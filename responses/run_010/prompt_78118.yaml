answer: |-
  **DRAFT FOR PUBLIC COMMENT**  
  **Form 5-X Instructions**  
  **Statement of Organization for an Entity Whose Major Purpose Is Not the Nomination or Election of Federal Candidates**  
  **Federal Electoral Commission | Campaign Finance Regulation Bureau**  
  *DRAFT – NOT FOR FILING – COMMENTS ACCEPTED UNTIL [DATE]*

  ---

  **PURPOSE OF THIS FORM**  
  Form 5-X establishes an entity’s organizational status under federal campaign finance law. It is filed prior to any disbursement to confirm that influencing federal elections is not the entity’s major purpose. Filing Form 5-X allows an organization to receive funds not subject to source or amount limitations and to disburse funds for communications influencing federal elections without disclosing the original sources of its funding, provided all requirements are met. The form must be filed before the entity makes any expenditure.

  ---

  **WHO MUST FILE / WHO NEED NOT FILE**  
  *Who Must File:* Any entity (including but not limited to corporations, labor organizations, and unincorporated associations) that:  
  (a) Anticipates making disbursements exceeding $1,000 during a calendar year for communications that reference a clearly identified federal candidate; and  
  (b) Reasonably expects that influencing federal elections will not constitute its major purpose.  
  *Who Need Not File:* Entities whose major purpose is the nomination or election of a federal candidate (file Form 1). Entities not anticipating disbursements for communications referencing a clearly identified federal candidate. Entities already registered as political committees.

  ---

  **DEFINITIONS**  
  *Major Purpose:* The primary reason for an entity’s existence. Determined by comparing the proportion of resources (funds, personnel, time) allocated to activities intended to influence federal elections versus all other activities combined. Influencing federal elections is not the major purpose if less than 50% of total resources are allocated to such activities.  
  *Communication that References a Clearly Identified Federal Candidate:* Any public message (e.g., broadcast, cable, satellite, digital, print, mailing) that names or depicts a candidate for federal office within 120 days of a general election or 90 days of a primary election involving that candidate.  
  *Independent Expenditure:* A disbursement for a communication expressly advocating the election or defeat of a clearly identified federal candidate, made without coordination with any candidate, candidate’s authorized committee, or political party committee.  
  *Express Advocacy:* Communications using explicit words such as "vote for," "elect," "support," "cast your ballot for," "Smith for Congress," "vote against," "defeat," or "reject."  
  *Issue Advocacy:* Communications discussing public policy issues, legislative positions, or the voting records, qualifications, or positions of elected officials or candidates without using words of express advocacy.  
  *Coordination:* Occurs when a communication is created, produced, or distributed:  
  (i) At the request or suggestion of a candidate/committee/party;  
  (ii) After substantial discussion with a candidate/committee/party regarding structure, content, timing, etc.;  
  (iii) By a vendor providing services to the entity *and* to the candidate/committee/party within the current or previous election cycle; or  
  (iv) By a former employee/officer of the candidate/committee/party within 120 days of departure.  
  *Firewall:* A documented, enforced policy separating employees/vendors working on activities referencing federal candidates from those interacting with federal candidates/committees/parties, preventing the sharing of strategic information.  
  *Earmarking:* A designation or instruction by a donor that their contribution be used for a specific activity (e.g., a particular communication). Contributions subject to earmarking for use in federal election activity must be disclosed if given to a political committee.  

  ---

  **PART I: ORGANIZATIONAL INFORMATION**
  *Line 1a:* **Entity Name:** Enter the full legal name of the organization.  
  *Example:* The Sidewalk Hydrodynamics Institute  
  *Line 1b:* **Tax Classification:** Enter the relevant subsection of the Internal Revenue Code under which the organization is recognized.  
  *Example:* 501(c)(4)  
  *Line 2:* **Address:** Enter principal place of business.  
  *Line 3:* **Date of Incorporation/Formation:** Enter the date the entity was legally established.  
  *Example:* [Date 1 month prior]  
  *Line 4:* **Anticipated Major Purpose:** Describe the primary non-electoral purpose.  
  *Example:* "To advance public knowledge of urban infrastructure through the annual publication of a peer-reviewed bulletin analyzing the drainage efficacy of municipal sidewalk joint materials."  
  *Line 5:* **Projected First Date of Activity:** Enter the date the entity expects to begin operations.  
  *Example:* [Date 2 weeks after filing]  

  ---

  **PART II: STRUCTURE AND CONTACTS**
  *Line 6:* **Responsible Officer:** Name and title of the individual responsible for filings.  
  *Line 7:* **Treasurer:** Name and title of the individual controlling funds.  
  *Line 8:* **Custodian of Records:** Name and title.  
  *Line 9:* **Official Email:** Address for Commission communications.  

  ---

  **PART III: PROJECTED DISBURSEMENTS FOR COMMUNICATIONS REFERENCING FEDERAL CANDIDATES**
  *Report all anticipated disbursements for communications that reference a clearly identified federal candidate during the next 24 months.*  
  *Line 10:* **Total Projected Disbursements for Communications:** Estimate the total funds to be spent on *all* public communications (including non-electoral).  
  *Line 11:* **Projected Disbursements for Communications REFERENCING Federal Candidates:** Estimate funds for communications meeting the definition above (regardless of express advocacy or electioneering intent).  
  *Line 12:* **Projected Disbursements for Independent Expenditures EXPRESSLY ADVOCATING Election/Defeat:** Estimate funds for communications containing words of express advocacy, made independently.  
  *Line 13:* **Projected Non-Communications Operational Expenditures:** Estimate funds for overhead, non-public activities, research not resulting in public communication, etc.  
  *Line 14:* **TOTAL PROJECTED RESOURCES EXPENDED (Sum Lines 10 + 13):**  
  *Line 15:* **CALCULATION OF MAJOR PURPOSE STATUS:** Divide Line 11 by Line 14. Multiply by 100. Result must be less than 50.00%. This demonstrates influencing federal elections is not the major purpose.  
  \>\>\>\> **Worked Example** \>\>\>\>  
  *Line 10:* $1,000,000 (Total Communications - Bulletin printing/mailing, ads)  
  *Line 11:* $490,000 (Communications Ref. Fed. Candidates - e.g., ads discussing Sen. Stone's infrastructure votes)  
  *Line 12:* $300,000 (Express Advocacy IEs - e.g., "Defeat Sen. Stone!")  
  *Line 13:* $510,000 (Salaries, office rent, sidewalk joint research)  
  *Line 14:* $1,510,000 (Line 10 $1M + Line 13 $510K)  
  *Line 15:* ($490,000 / $1,510,000) * 100 = **32.45%**  
  **Result:** 32.45% < 50.00%. Major Purpose Test Satisfied.  
  \<\<\<\< **End Worked Example** \<\<\<\<  

  ---

  **PART IV: FUNDING AND DISCLAIMER PROTOCOLS**
  *Line 16:* **Source of Funds:** Describe the anticipated types of funding sources (e.g., "Membership dues," "Grants from other 501(c)(4) organizations," "Contributions from individuals"). Do NOT list specific donors.  
  *Line 17:* **Intermediary Handling:** Will funds be received through any entity acting as an intermediary (e.g., another corporation, LLC, trust)? (Yes/No). If "Yes," describe the intermediary structure generally.  
  *Example:* "Funds may be received through grants from non-profit organizations or via limited liability companies established for estate planning purposes."  
  *Line 18:* **Earmarking Policy:** Describe the policy for rejecting contributions where the donor specifies the contribution must be used for a particular communication or independent expenditure.  
  *Example:* "The Institute will not accept any funds accompanied by a written or oral direction, instruction, or designation regarding their use for a specific communication or independent expenditure."  
  *Line 19:* **Disclaimer Text:** Provide the standardized disclaimer text that will appear on all public communications referencing a clearly identified federal candidate.  
  *Example:* "Paid for by The Sidewalk Hydrodynamics Institute (www.sidewalkhydro.org). Not authorized by any candidate or candidate's committee."  
  *Note:* The disclaimer must not name any individual donor or intermediary entity funding the communication.  

  ---

  **PART V: COORDINATION PREVENTION**
  *Line 20:* **Firewall Policy:** Attach a description of the written policy establishing a firewall between personnel/vendors involved in creating communications referencing federal candidates and personnel/vendors who have contact with federal candidates, their committees, or political party committees. Describe enforcement mechanisms.  
  *Line 21:* **Vendor Vetting:** Describe the process for ensuring vendors used for communications referencing federal candidates have not provided services to any federal candidate, authorized committee, or political party committee within the current or immediately preceding election cycle. If a common vendor is used, describe the documented policy preventing strategic information flow as required.  
  *Line 22:* **Former Employee Policy:** Describe the policy prohibiting the involvement of former employees/officers of any federal candidate, candidate committee, or political party committee in creating or distributing communications referencing federal candidates for 120 days after their departure from the candidate/committee/party.  

  ---

  **COMMON FILING ERRORS (SIDEBAR)**  
  *   **Line 15 Calculation Error:** Incorrectly summing Line 10 + Line 13 for the denominator. Verify arithmetic.  
  *   **Insufficient Firewall Description:** Merely stating "a firewall exists" is insufficient. Attach detailed policy.  
  *   **Prohibited Donor Identification:** Listing specific donors in Part IV or in the disclaimer text (Line 19).  
  *   **Earmarking Policy Omission:** Failing to describe a policy for rejecting earmarked funds (Line 18).  
  *   **Missing Pre-emptive Filing:** Attempting to file Form 5-X after making the first disbursement for a communication referencing a federal candidate. File BEFORE any such disbursement.  
  *   **Misclassifying Issue Advocacy:** Reporting disbursements for communications discussing voting records without express advocacy as Line 12 Express Advocacy IEs. Report on Line 11 only.  

  ---

  **FREQUENTLY ASKED QUESTIONS (FAQ)**  
  1.  **Q: Must we amend Form 5-X if our actual spending differs from projections?**  
      A: No. Form 5-X is based on reasonable, good-faith projections made prior to activity. Actual spending percentages may differ without requiring amendment, unless the entity fundamentally changes its major purpose. Annual reports filed elsewhere capture actual spending.  
  2.  **Q: Can we discuss a candidate's position on sidewalk funding within 90 days of their primary?**  
      A: Yes, provided the communication constitutes issue advocacy. Discussing a candidate's stance on a public policy issue (e.g., "Senator Stone voted against the Sidewalk Safety Act, leading to hazardous pooling") without using words of express advocacy is permissible. Avoid phrases like "Defeat Stone" or "Re-elect him" during the 90/120-day window.  
  3.  **Q: If our projected Line 11 spending is 49.99% and actual spending reaches 50.01%, when does the requirement to disclose donors under political committee rules begin?**  
      A: Disclosure obligations would commence only for funds received *after* the point where it becomes reasonably clear that influencing federal elections has become the major purpose, typically based on a rolling assessment of actual resource allocation. Prior receipts generally remain undisclosed.^1  

  ---

  **CERTIFICATION**  
  Under penalties of perjury, I certify that:  
  1.  I am the Responsible Officer named in Part II, Line 6;  
  2.  I have examined this Form 5-X; and  
  3.  To the best of my knowledge and belief, the projections and statements contained herein are true, complete, and correct, and influencing federal elections is not the major purpose of the entity.  

  _____________________________________________  
  (Signature of Responsible Officer)  

  _____________________________________________  
  (Printed Name of Responsible Officer)  

  _____________________________________________  
  (Date)  

  ---  
  **DRAFT – NOT FOR FILING – COMMENTS ACCEPTED UNTIL [DATE]**  

  ^1 See Advisory Opinion 202X-XX (Hypothetical) regarding the prospective application of major purpose determination based on actual activity levels post-filing. Available at [Fictional FEC Website Link].
