prompt: |-
  ok so my reading group is going through Rousseau's Social Contract and we've just hit Book II ch. 2, the "sovereignty is indivisible" one (G.D.H. Cole translation), and I'm properly stuck. Here's the bit that's doing my head in:

  "Sovereignty, for the same reason as makes it inalienable, is indivisible; for will either is, or is not, general;[1] it is the will either of the body of the people, or only of a part of it. In the first case, the will, when declared, is an act of Sovereignty and constitutes law: in the second, it is merely a particular will, or act of magistracy—at the most a decree.

  But our political theorists, unable to divide Sovereignty in principle, divide it according to its object: into force and will; into legislative power and executive power; into rights of taxation, justice and war; into internal administration and power of foreign treaty. Sometimes they confuse all these sections, and sometimes they distinguish them; they turn the Sovereign into a fantastic being composed of several connected pieces: it is as if they were making man of several bodies, one with eyes, one with arms, another with feet, and each with nothing besides. We are told that the jugglers of Japan dismember a child before the eyes of the spectators; then they throw all the members into the air one after another, and the child falls down alive and whole. The conjuring tricks of our political theorists are very like that; they first dismember the body politic by an illusion worthy of a fair, and then join it together again we know not how.

  This error is due to a lack of exact notions concerning the Sovereign authority, and to taking for parts of Sovereignty what are only emanations from it. Thus, for example, the acts of declaring war and making peace have been regarded as acts of Sovereignty; but this is not the case, as these acts do not constitute law, but merely the application of a law, a particular act which decides how the law applies, as we shall see clearly when the idea attached to the word law has been defined."

  Three things about the passage itself, then two about what I'm actually trying to write:

  1. In "will either is, or is not, general" what's the criterion? It reads like generality is just a matter of whose will it is — the whole body or a part of it. But two sentences later he says the theorists divide sovereignty "according to its object." Are those two different senses of general (who wills vs. what the willing is about), and is he sliding between them, or is the object talk only a diagnosis of their mistake?

  2. The Japanese juggler analogy — what exactly is the charge? That dividing sovereignty is impossible, or that it's possible but the theorists can't explain how the pieces get reassembled? And why stress that the child falls down alive and whole: is the falseness supposed to be in the dismembering or in the reunion?

  3. The "emanations from it" move. Why does declaring war fail to be an act of sovereignty — I follow that it's particular rather than general, but then what's left that counts as law, and does this commit him to a sovereign that can only ever will in generalities and so can never actually decide anything?

  4. My project is about populism and "the will of the people," specifically the modern habit of treating that will as something assembled issue by issue (referendums, primaries, single-topic polls) instead of as one thing. There's a known aggregation problem where you can get a majority for each premise seperately and no majority for the conclusion they jointly entail. Does the indivisibility argument give an independent reason to think the issue-by-issue picture is confused even setting that problem aside, or is Rousseau only objecting to institutional design and therefore no use to me here?

  5. Relatedly, a bit later in ch. 3 he says (paraphrasing, I don't have the book in front of me) that the people is never corrupted though it's often deceived. If the sovereign can't be divided or represented and can't be corrupted, is there anyone left to blame when a bad law gets made — i.e. can Rousseau even state "the people willed X and X was terrible," or does his framework make that sentence unassertable?

  Answer as exactly five numbered points matching those five, a sentence or two each, no preamble and no wrapping-up paragraph.
reasoning: |-
  Hmm, the user is struggling with Rousseau's Social Contract, specifically Book II Chapter 2 about sovereignty being indivisible. They've provided a passage and five detailed questions about it. They're in a reading group and need help parsing Rousseau's arguments for their project on populism and "the will of the people."

  Looking at question 1, Rousseau's key point is that sovereignty comes from the general will, which must belong to the whole people. He criticizes theorists who try to divide sovereignty by its functions (like legislative vs executive), which he sees as confusing parts for the whole. The "generality" criterion is indeed about whose will it is - the entire body politic or just a subset. When he mentions theorists dividing by "object," he's diagnosing their mistake: they're focusing on what's being willed rather than who is willing it. I'll need to clarify that Rousseau isn't sliding between senses but exposing a category error.

  For question 2 about the Japanese juggler analogy, the charge is that dividing sovereignty is conceptually impossible from the start. Rousseau emphasizes the child falling down whole to show sovereignty can't actually be split - the "dismembering" is an illusion, and the theorists' attempt to reassemble it reveals their misunderstanding. The falseness lies in pretending division occurred at all.

  Question 3 addresses why declaring war isn't sovereign. Rousseau sees it as applying existing laws to specific cases, not creating new general laws. The sovereign only makes abstract, universal rules, while magistrates handle particular executions. This might seem to limit the sovereign to generalities, but Rousseau would argue this preserves its purity - decisions flow from laws, not direct sovereign action on specifics.

  Moving to the user's project in question 4, Rousseau's indivisibility argument directly challenges issue-by-issue approaches. He'd see referendums as particular wills masquerading as general will, creating an artificial "people" assembled from fragments rather than expressing a unified body politic. This is an independent critique beyond aggregation paradoxes, targeting the very premise of slicing popular will into policy segments.

  Finally for question 5 about blame for bad laws, Rousseau's framework creates tension. He claims the people "can never be corrupted" though "often deceived," meaning the sovereign will remains pure in essence even when misled about what serves the common good. So technically, "the people willed X and X was terrible" is possible in his terms - but only as error, not corruption. The blame falls on deception or poor information, not on the sovereign itself.

  The user seems analytically sharp but frustrated by Rousseau's dense prose. Their populism project shows they're thinking critically about modern democratic practices. I'll structure my response as five concise, numbered answers matching their queries exactly - no fluff, just focused clarifications that bridge textual analysis with their contemporary concerns.
answer: |-
  1.  The criterion for a "general" will is solely whose will it is: it must be the will of the entire body politic ("the people") acting *as* the sovereign. Rousseau argues the theorists mistakenly focus on the *object* (what is being willed, like war or taxes) instead of the *subject* (who is willing it). He is diagnosing their mistake, not sliding between senses; for him, only the subject (the whole people willing generally) defines sovereignty, making division by object incoherent.

  2.  The charge is that dividing sovereignty is conceptually impossible *in principle*. The juggler analogy stresses the false *illusion* of division (the dismembering) and the theorists' inability to explain the *reality* of its indivisible wholeness (the child falling down alive and whole). The falseness lies in the initial act of division; the reunion is a deceptive trick masking the fundamental impossibility of the division ever having truly occurred.

  3.  Declaring war fails as an act of sovereignty because it applies a general law (e.g., "defend the state") to a *particular* instance (this specific war). For Rousseau, only the creation of abstract, universal rules binding everyone equally ("laws") is sovereign. The sovereign *only* wills general laws; applying them to specific cases (execution, war, judgment) is delegated to the government (magistrates). This does mean the sovereign body itself never decides particular actions directly.

  4.  Yes, Rousseau's indivisibility argument provides an independent reason. He fundamentally rejects the idea that the "will of the people" can be constituted or understood issue-by-issue. Each referendum or poll expresses a *particular* will on a specific object, not the *general* will of the sovereign body acting as a unified whole. His framework sees issue-by-issue aggregation as inherently failing to capture the indivisible sovereign will, regardless of aggregation paradoxes.

  5.  Rousseau *can* state "the people willed X and X was terrible." His claim that the people is "never corrupted" means its *intent* is always the common good (it cannot *will* evil *as* its object). However, it can be "deceived" about what *constitutes* the common good in a specific instance. So, a bad law reflects an *error* in judgment by the sovereign people about what serves their own good, not corruption of their fundamental will. Blame falls on the deception or flawed deliberation, not on the sovereign will itself turning bad.
