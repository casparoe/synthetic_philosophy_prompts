prompt: |-
  Longtime reader of the sequences and the comment threads, not an academic, so bear with me. There's a shape of disagreement I keep hitting in the how-many-minds-are-in-there debates and I don't have a word for it.

  Concretely: two people are arguing about a split-brain patient. They agree on every single observable and every scan — what the left hand does, what the mouth reports, which hemisphere got shown the picture, what happens when you cue each side separately. They also aren't smuggling in private definitions; ask them what they mean by "subject of experience" and they give you the same gloss. And yet one says there are two subjects in that skull right now and the other says there's one, and each says the other is mistaken about the world, not about words. The kicker: neither one will accept that it's a fuzzy or borderline case. They don't say the concept runs out here. They each say there's a definite fact and the other guy has it backwards. So you've got a disagreement that no observation could ever settle, between people who are already in full observational agreement, who agree on meanings, and who both refuse the "it's vague" escape hatch — while insisting it's substantive.

  Same shape comes up with gradual neuron replacement: everyone agrees on all the functional facts at every step, and they still fight about one stream versus two, and nobody concedes borderlinehood.

  So: is there an established concept for that exact configuration? I know the reflexive answer is "it's just a verbal dispute," but that's precisely what both sides deny, and I don't think the denial is empty here. Tell me what the nearest existing ideas are, what each one gets wrong about this case, and which comes closest. Does whatever you land on also cover the replacement version, or is there something special about the consciousness case? And if nothing really fits, coin me a term with an actual definition plus one case that sits just inside the boundary and one just outside. I'm not after a reading list, I'm after the carving — and while you're at it, say whether you think one of these two arguers is making a mistake or whether they're both right that there's a fact of the matter.
reasoning: |-
  Okay, let me try to unpack this user's question. They're describing a specific disagreement pattern in consciousness debates, like split-brain cases or neuron replacement scenarios. Both parties agree on all observable facts and definitions but still insist there's a definite fact about the number of minds, rejecting vagueness.

  First, I need to identify the core issue. The user wants a term for this exact scenario. Common terms like "verbal dispute" don't fit because both sides deny it's about words. "Metaphysical disagreement" is close but too broad. Maybe "ontological indeterminacy" is better, but the rejection of vagueness complicates it.

  Looking at existing concepts: 
  - Verbal disputes: Both parties deny this, and they share definitions.
  - Hinge propositions: Not quite, as it's not foundational beliefs.
  - Metalinguistic negotiation: Involves term meanings, which they agree on.
  - Ill-posed problem: Possible, but might not capture the insistence on a definite fact.

  The user mentions both split-brain and gradual replacement cases. The key is the insistence on a binary answer despite functional continuity. This seems like a boundary dispute where the criteria are clear but their application isn't. 

  Coining a term: "Subjective ontology boundary dispute." It captures the focus on existence of subjects, the boundary issue, and the disputive nature. For example, split-brain sits inside, while a clear case like two separate brains is outside. Neuron replacement is inside, normal brain outside.

  As for who's mistaken: Both might be wrong in insisting on a definite fact. The mistake is rejecting indeterminacy where it exists. Consciousness might not have sharp boundaries, so forcing a binary answer ignores the underlying continuity. The error is epistemological—thinking we can always determine a count when the phenomenon is fuzzy.
answer: |-
  This is a *perfectly* crystallized description of a specific and fascinating philosophical impasse. You've identified a genuine conceptual knot. Let's carve it:

  ### The Core Problem
  You've described a scenario where:
  1.  **Full Observational Agreement:** All physical, functional, and behavioral facts are agreed upon.
  2.  **Definitional Agreement:** The core concept in dispute (e.g., "subject of experience") is given the *same* essential gloss by both parties (e.g., "that which has unified phenomenal states").
  3.  **Binary Ontological Disagreement:** They make contradictory claims about the *existence* or *number* of fundamental entities (subjects/streams/minds).
  4.  **Rejection of Vagueness:** Both deny the case is borderline or that the concept fails to apply determinately.
  5.  **Insistence on Factuality:** Both maintain their view describes a substantive fact about the world (not just words or perspective).
  6.  **Observational Irresolvability:** No further empirical data could settle the dispute, given points 1 & 2.

  ### Near Misses & Why They Don't Quite Fit
  1.  **Verbal Dispute:** The classic answer. *Why it misses:* Both parties explicitly deny this, *and* crucially, they agree on the *definition* of the core concept. The dispute arises when *applying* the agreed-upon definition to the agreed-upon facts. It's not about what "subject" *means*, but whether *this specific configuration* instantiates one or two of them.
  2.  **Hinge Proposition (Wittgenstein):** A foundational belief not grounded in evidence, underlying a framework. *Why it misses:* The disagreement isn't foundational in that sense; both likely agree on most other hinge propositions. It's specifically about applying a agreed-upon concept within a specific, empirically-defined scenario.
  3.  **Metalinguistic Negotiation (Barker/Plunkett):** Negotiating how a term *should* be used, often masking a normative or practical disagreement. *Why it misses:* While related, this usually involves disagreement *about* meaning or normative goals. Here, they agree on the essential meaning ("what a subject *is*") and deny they're negotiating usage; they insist they're describing the world *as it is*.
  4.  **Ill-Posed Problem:** A question that lacks sufficient information or is fundamentally unanswerable. *Why it misses:* This often implies the *facts* are insufficient. Here, the disputants agree *all* relevant facts are in, yet still demand a binary answer, insisting the facts *do* determine one.
  5.  **Ontological Vagueness/Indeterminacy:** The idea that existence/number itself can be vague. *Why it misses:* This is the escape hatch *both parties explicitly reject*. They insist the case is *not* vague; there *is* a definite fact.

  ### The Closest Fit: Ontological Boundary Dispute (with a Twist)

  The best existing label is likely an **Ontological Boundary Dispute** or **Boundary Case Dispute**, but it needs refinement for your specific criteria (agreement + rejection of vagueness). We can call it a **Subjective Ontology Boundary Dispute (SOBD)**.

  *   **Definition:** A disagreement concerning the number or existence of fundamental entities of subjective experience (e.g., minds, subjects, streams of consciousness) in a specific, empirically-defined system, characterized by:
      *   Complete agreement on all physical, functional, and behavioral facts.
      *   Agreement on the essential definition of the fundamental entity in question.
      *   A binary, contradictory ontological claim (1 vs. 2, existence vs. non-existence).
      *   Rejection by both parties that the case represents a borderline instance of the concept or that the concept fails to apply determinately.
      *   Insistence by both parties that their claim represents a substantive fact about the world, not resolvable by further empirical investigation given the existing agreement.

  ### Applying SOBD: Inside and Outside

  1.  **Just Inside (Your Cases):**
      *   **Split-Brain:** Agreed facts on lateralized function, commissurotomy, conflicting behaviors, unified reports under constraint. Agreed definition: "Subject = unified locus of phenomenal awareness." Dispute: "One subject (despite conflicts)" vs. "Two subjects (despite unified report under constraint)". Both reject vagueness.
      *   **Gradual Neuron Replacement (Ship of Theseus):** Agreed facts on functional continuity, physical discontinuity, behavioral identity at every step. Agreed definition: "Stream of consciousness = continuous subjective perspective." Dispute: "One continuous stream" vs. "Original stream ended, new stream began". Both reject vagueness.

  2.  **Just Outside (Not SOBD):**
      *   **Two Distinct Brains in Separate Skulls:** Agreed facts (separate bodies, independent reports). Agreed definition. Consensus: Two subjects. No binary dispute.
      *   **A Single, Clearly Integrated Brain:** Agreed facts (global workspace, unified reports). Agreed definition. Consensus: One subject. No binary dispute.
      *   **"Is Pluto a Planet?" (Classic Boundary/Vagueness):** Agreed facts (size, orbit, location). *Disagreement on the definition/criteria*. Many *accept* it's a borderline/vague case or that the definition is being negotiated. Fits Metalinguistic Negotiation better than SOBD.
      *   **"Is this a Heap?" (Sorites Paradox):** Agreed facts (number of grains). Core dispute *is* about vagueness/borderline status *by definition*. Both sides typically acknowledge the vagueness. Rejects SOBD criterion 4 (Rejection of Vagueness).

  ### Who is Mistaken? The Core Error

  **Both parties are making a mistake, but it's subtle.** The mistake is **epistemological**, not necessarily ontological:

  1.  **Insisting on Determinacy Where None is Warranted:** Consciousness, particularly its individuation (counting subjects/streams), is almost certainly a property that supervenes on complex, graded physical systems. The functional facts *can be continuous* (like in neuron replacement) or *discontinuous in complex ways* (like in split-brain). The agreed-upon definition ("unified locus," "continuous perspective") likely relies on concepts that *themselves* have fuzzy boundaries when applied to such systems. **The error is denying the inherent potential for vagueness or indeterminacy in applying these high-level concepts to such edge cases.** They mistakenly believe their conceptual framework *must yield* a sharp binary answer in every conceivable physical configuration, even when the underlying phenomena are continuous or fragmented in ways that resist crisp counting.
  2.  **Misidentifying the Nature of the Dispute:** By insisting it's a substantive fact about the world *beyond the agreed functional facts and definitions*, they are likely conflating their *interpretive framework* or *metaphysical commitment* with a brute fact. The "fact of the matter" they seek might simply *not exist* independently of how we choose to apply our concepts to these edge cases. The substantive core *is* the functional/physical setup; the "number of subjects" is a *description* we apply to it, and our descriptions can hit limits.

  ### Does this Cover Replacement? Is Consciousness Special?

  *   **Replacement Version:** Yes, the SOBD definition perfectly covers gradual replacement scenarios like the Ship of Theseus for consciousness. The core structure (agreement on facts/definition, binary ontological dispute, rejection of vagueness, insistence on factuality) is identical.
  *   **Is Consciousness Special?** While boundary disputes happen elsewhere (e.g., species definitions, artifact identity), consciousness *is* special in one key way relevant to SOBD: **Private Access & First-Person Individuation.** We can't directly observe or verify the "unity" or "continuity" of subjective experience from the outside; we infer it from behavior and function. This makes the application of concepts like "subject" or "stream" to complex functional systems *especially* prone to generating SOBDs. We lack the "view from inside" that would (potentially) resolve the ambiguity in split-brain or replacement cases. The inability to access the first-person perspective of the system in question is a major fuel for these disputes.

  **In essence:** You've pinpointed a **Subjective Ontology Boundary Dispute (SOBD)** – a clash over counting fundamental entities of mind at the conceptual frontier, where agreement on facts and definitions paradoxically fuels an irresolvable binary disagreement fueled by a shared (but likely mistaken) insistence on sharp boundaries for consciousness. The core error isn't in choosing one side, but in believing such a sharp boundary *must exist* in the world for these cases.
