prompt: |-
  I lead a small infrastructure team at a mid-sized B2B software company, and over the past year I have been keeping an informal log of every decision where we followed what everyone else was doing instead of investigating the question ourselves. I have no formal training in epistemology or economics; I have read the standard introductory accounts of informational cascades — the ones where each agent receives a private signal, observes the actions of everyone who moved before them, and then acts, so that beyond some point the public history outweighs any individual's private evidence — but what I actually care about is the less tidy question of when copying the crowd counts as a genuine inference and when it is an abdication dressed up as one. I want to build this into a one-page checklist for our design review template, which means I need something statable rather than something merely true. Below are my own verdicts on a set of concrete cases. Please treat those verdicts as data to be explained, not as errors to be corrected, at least until you have a candidate principle on the table; only then tell me which of them it cannot accommodate.

  The cases, in the order I wrote them down.

  1. We adopted Postgres for a new service without anyone on the team benchmarking alternatives or reading a line of its source. Nearly every company in our ecosystem uses it. Verdict: rational. My private information about databases is weak, and thousands of comparable teams have already revealed theirs.

  2. During a 2 a.m. incident, three on-call engineers before me each marked the same paging alert as a flapping sensor and cleared it. I did the same without opening the dashboard. It was not a flapping sensor, and we lost four hours. Verdict: not rational. This is the one that bothers me, because informationally it looks exactly like case 1 — three predecessors, each with a private read on the situation, all pointing the same way.

  3. A conference had roughly forty exhibitors selling observability tooling. From that I inferred the category was real and had real budgets attached to it, and I was right. I did not infer that any particular one of the forty products was good. Verdict: rational at the first level, would have been irrational at the second.

  4. Everyone in our engineering org cites the same third-party benchmark post in support of a performance claim. I refuse to credit it, because when I traced four separate internal threads that looked like independent agreement, all four led back to that single post. Verdict: my refusal was rational. This is where my rule of thumb comes from, and it is the rule I most want tested: count one vote per independent source of evidence, not one vote per person expressing a view — so if the first three adopters were all reading from the same artifact, they are one vote and not three.

  5. In hiring I filter heavily on referrals from people whose judgment I respect. Verdict: rational in general, but I am uneasy here, because my referrers all came from the same two companies and roughly the same handful of schools.

  6. I copied the syntax and idioms of the most widely used language in our stack without evaluating alternatives, purely so that new hires could read our code on day one. Verdict: rational — though I suspect that in calling it rational I am smuggling in something that is not an epistemic reason at all.

  7. The case I keep going back and forth on. Our organization migrated its systems work to Rust over eighteen months; I supported it, wrote the migration plan, and argued for it in review. I never ran a single load test. What I had was three staff engineers I rate highly saying it was the right call, plus a general sense that the broader industry was drifting that way. I alternate between thinking this was clearly rational, because deferring to people who know more than you is what a reasonable person does, and thinking I was simply vote four in a chain of four.

  My tentative principle is the one from case 4: one vote per independent source. Does it deliver all seven verdicts, or only most of them? In particular, does it separate case 1 from case 2, or do I have to bolt on extra terms to get that separation — the cost of checking for yourself, the reversibility of the decision, the asymmetry between the two kinds of error, whether the predecessors knew they were being watched and therefore had reason to be careful, whether the question is about what to believe or about what convention to join? If those terms have to be in there, tell me honestly whether the result is still one principle about evidence or two principles stapled together, and which of the two is doing more work. I would also like the principle's verdict on cases I have not listed: specifically, one where the crowd turns out to be right but no member of it could state why, and one where I hold a strong private signal that contradicts a large and genuinely independent public consensus. And if the honest answer is that some of my verdicts have to go, argue for dropping them rather than merely asserting it — I can be persuaded on 6 and 7, but I want to hold onto 2 unless you can show me it was case 1 wearing a disguise all along.

  I am not asking for references or a reading list, and I would not be able to chase them if you gave me one; I want the analysis itself, in plain language. If there is established terminology for the distinctions you end up relying on, name it and define it in a sentence, but do not assume I will recognize it.
reasoning: |-
  Hmm, the user is an infrastructure team lead at a mid-sized B2B software company. They've been tracking instances where their team followed the crowd instead of investigating independently, and they want to turn this into a practical checklist for design reviews. They've provided seven concrete cases with their own verdicts on whether following the crowd was rational, and they're looking for a unifying principle that explains these judgments.

  Looking at their cases, I notice some interesting patterns. Case 1 (adopting Postgres) was deemed rational because of the sheer volume of independent validation from similar teams. Case 2 (ignoring a paging alert) was considered irrational despite similar informational dynamics - the key difference seems to be the context of an incident versus a technology choice. Case 3 (observability tools) shows a nuanced approach - trusting the category but not individual products. Case 4 (third-party benchmark) introduces their core idea of counting independent evidence sources rather than people. Cases 5-7 show more ambiguous situations where social and practical factors complicate pure epistemic reasoning.

  Their tentative principle of "one vote per independent source" is insightful but needs refinement. It explains cases 1, 3 and 4 well, but struggles with cases 2 and 7. The incident response case (2) highlights how contextual factors like risk, reversibility and decision costs matter more than just source independence. Case 7 (Rust migration) shows how expertise and practical constraints blend with social evidence.

  I think we need to distinguish between two fundamentally different scenarios: "evidence aggregation" problems (where we're trying to discover truth) and "coordination problems" (where agreement itself creates value). The Postgres adoption (1) and coding standards (6) are coordination problems - the rightness comes from widespread adoption itself. The incident response (2) and benchmark validation (4) are evidence problems - we care about ground truth.

  For their checklist, we should develop three filters: 1) Is this an evidence problem or coordination problem? 2) For evidence problems, are sources truly independent and sufficient? 3) What are the stakes and constraints? This framework explains all their verdicts while adding necessary nuance. It preserves their core insight about independent evidence while acknowledging that sometimes following the crowd is rational for non-epistemic reasons.

  The user seems particularly concerned about case 2 - they want to maintain that it was irrational despite superficial similarity to case 1. Our framework supports this by showing it was an evidence problem with high stakes, not a coordination problem. For their unlisted cases, this approach would say: a crowd being right without knowing why doesn't validate their reasoning (though might still be useful for coordination), and strong private evidence should outweigh public consensus only when we have reason to doubt the independence or competence of that consensus.

  This gives them a practical, statable framework that captures their intuitions while adding necessary distinctions. The three-filter approach should work well for their design review checklist.
answer: |-
  Based on your cases and verdicts, your "one vote per independent source" principle is a strong start, but it needs refinement to handle the nuances you've identified. Here's a principled framework that explains all seven verdicts and addresses your core concern about *when* copying is rational inference vs. abdication:

  ---

  ### **The Three-Filter Checklist for Following the Crowd**
  Before relying on others' choices, ask:

  1.  **Is this an evidence problem or a coordination problem?**
      *   *Evidence Problem*: We care about **ground truth** (e.g., "Is the sensor flapping?", "Is Product X performant?").
      *   *Coordination Problem*: Value comes from **shared convention** (e.g., "Which syntax should we use?", "Which DB has the most compatible expertise?").
      *   **Rational to Follow Crowd?** Primarily for **Coordination Problems** (Cases 1, 6). *Not sufficient* for Evidence Problems.

  2.  **For Evidence Problems Only: Are the sources INDEPENDENT and SUFFICIENT?**
      *   *Independent*: Sources reached their conclusions based on **distinct data/effort** (your core principle). One artifact = one vote (Case 4).
      *   *Sufficient*: The crowd's aggregate signal **outweighs private doubts** *given the stakes*. Consider:
          *   **Stakes & Reversibility**: Cost of being wrong (high in Case 2, low in Case 3 category-level).
          *   **Cost of Verification**: Effort to check yourself (high for DB benchmarks, low for opening a dashboard).
          *   **Asymmetry of Error**: Is one type of mistake far worse? (Ignoring a real incident vs. adopting a slightly suboptimal DB).
      *   **Rational?** Only if sources are **Independent AND Sufficient given stakes/cost** (Case 3 first level: Yes; Case 2: No - low verification cost, high stakes).

  3.  **Does "following" resolve ambiguity OR mask it?**
      *   Rational if it **resolves legitimate uncertainty** using others' knowledge (Case 1, Case 7 potentially).
      *   Irrational if it **replaces necessary investigation** where signals are weak or stakes are high (Case 2, Case 4).
      *   *Special Case: Expertise*: Deferring to trusted experts (Case 5, Case 7) is rational *if* their expertise is relevant and *their* independence/sufficiency is vetted (your unease in Case 5 hints at vetting failure).

  ---

  ### **How This Explains Your Verdicts**
  *   **Case 1 (Postgres - Rational):** **Coordination Problem** (ecosystem compatibility, hiring pool). Evidence aggregation is secondary.
  *   **Case 2 (Incident - Not Rational):** **Evidence Problem** (ground truth: is it flapping?). Sources *not* **Sufficient**: Stakes (4hr outage) and verification cost (opening dashboard) were low. Independence irrelevant – action was negligent.
  *   **Case 3 (Observability - Rational L1):** **Evidence Problem** (category exists). Sources **Independent & Sufficient**: 40 vendors signal real market. L2 (product quality) fails sufficiency – needs deeper evidence.
  *   **Case 4 (Benchmark - Rational refusal):** **Evidence Problem**. Sources **Not Independent** (all from one artifact). One "vote," easily disproven.
  *   **Case 5 (Referrals - Rational but uneasy):** **Evidence Problem** (candidate quality). Sources **Independent? Unclear** (similar backgrounds risk groupthink). **Sufficiency?** Depends on vetting referrers' judgment diversity – your unease is warranted.
  *   **Case 6 (Syntax - Rational):** **Coordination Problem** (readability, onboarding). Ground truth (best syntax) is secondary to shared convention.
  *   **Case 7 (Rust - Ambiguous):** **Primarily Coordination Problem** (industry trend, internal alignment). Evidence (performance) secondary. **Rational IF:** Trusted experts based judgment on *their* sufficient evidence (you deferred, didn't abdicate). **Irrational IF:** Experts were also just following without evidence (you were vote 4). Your role in the *migration plan* (practical coordination) makes initial support rational; lack of *performance* testing is the gap.

  ---

  ### **Why This Separates Case 1 & Case 2 (and Preserves Your Verdict)**
  *   **Case 1 is fundamentally a Coordination Problem.** The value of Postgres arises *because* everyone uses it (ecosystem, hiring). Evidence (raw performance) is secondary. Following is rational convention-adoption.
  *   **Case 2 is fundamentally an Evidence Problem with High-Stakes/Low-Cost Verification.** The *only* thing that matters is the ground truth of the system state. Copying predecessors without checking was negligent because:
      *   The cost of verification (opening a dashboard) was trivial.
      *   The stakes (potential outage) were high.
      *   The action (clearing an alert) masked the problem instead of resolving ambiguity.
  *   Your "one vote" principle *alone* wouldn't separate them (both have multiple actors). **Filter 1 (Evidence vs. Coordination) is the critical separator.** Adding Stakes/Cost (**Filter 2 - Sufficiency**) explains *why* it was negligent in Case 2.

  ---

  ### **Verdicts on Your Unlisted Cases**
  1.  **Crowd right, but no member knows why:**
      *   **Verdict:** *Not* rational inference (abdication). Following might *work* (if ground truth exists), but it's luck, not reasoning. Fails **Filter 3** (masks ambiguity). Useful only for low-stakes coordination.
  2.  **Strong private signal contradicts large, independent consensus:**
      *   **Verdict:** Trust your signal *if* you have high confidence in its validity/relevance AND the consensus lacks a clear mechanism for aggregating superior evidence (e.g., they might be biased). Failing **Filter 2 - Sufficiency**: Your strong signal outweighs the consensus signal *for you*. Proceed cautiously, investigate *why* consensus disagrees, but don't blindly override your direct evidence without cause.

  ---

  ### **Is This One Principle or Two Stapled?**
  It's **one coherent principle with three necessary, interdependent filters**:
  1.  **Filter 1 (Evidence/Coordination)** defines the *nature of the problem*. This is foundational.
  2.  **Filter 2 (Independent/Sufficient Evidence)** operationalizes *how to weigh signals* for Evidence problems.
  3.  **Filter 3 (Resolving vs. Masking)** ensures action is *meaningful*.

  **Why it's coherent:** All filters address the core question: "Is copying others a *valid substitute for my own judgment* in this specific context?" Filter 1 sets the context, Filter 2 provides the epistemic mechanics for evidence contexts, Filter 3 is a sanity check. **Filter 1 does the heaviest lifting** – it fundamentally changes the justification for copying.

  ---

  ### **The One-Page Checklist (Statable Version)**

  **Before following the crowd on a technical decision, ask:**

  1.  **COORDINATION OR TRUTH?**  
      *   *If the main value comes from **everyone doing the same thing** (e.g., standards, conventions, ecosystem fit)* → **Following is often rational.** (Proceed to Step 3).  
      *   *If we need to **discover a fact** about the world (e.g., performance, root cause, correctness)* → **Go to Step 2.**

  2.  **EVIDENCE: INDEPENDENT & WORTH IT?** (For Truth-Seeking *only*)  
      *   **Independent?** Are the sources you're relying on basing their views on **different data or investigation**? (One source artifact/rumor = one vote, regardless of how many people repeat it).  
      *   **Sufficient?** Given **what's at stake** if we're wrong, and the **effort required to check yourself**:  
          *   Is the crowd's consensus **strong enough** to override your own doubts/ability to check?  
          *   Is one type of error **(false positive/negative) much worse**?  
      *   *If YES to both* → **Following can be rational inference.**  
      *   *If NO* → **Investigate yourself. Copying is abdication.**

  3.  **CLARITY OR COVER?**  
      *   Does following resolve a **genuine ambiguity** using others' knowledge? → **Rational.**  
      *   Does it let you **avoid a necessary investigation**? → **Abdication. Stop.**

  ---

  This framework validates your verdicts (including Case 2 as negligent), explains Case 7's ambiguity (hinges on whether the experts did sufficient evidence-gathering or were cascading), provides clear guidance for your unlisted cases, and delivers a statable checklist grounded in the distinction between *seeking truth* and *coordinating action*.
