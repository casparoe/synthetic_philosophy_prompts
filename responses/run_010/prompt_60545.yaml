  ### Falsifiability Verdict and Top Defeaters

  The Bayesian brain thesis has absorbed objections (e.g., action via active inference, meta-priors) in a manner resembling normal scientific refinement, not insulation into unfalsifiability. Each addition addresses empirical gaps (e.g., dark room) while generating new predictions (e.g., precision estimation in neural gain). However, the trajectory risks becoming a "tell" if auxiliary constructs (e.g., hierarchical precisions) proliferate without independent constraints, allowing post hoc fixes. Crucially, the core claims remain falsifiable: cue combination must obey reliability-weighting, neural responses must scale with precision, and illusions must align with natural statistics. The insulation is legitimate if it extends predictive scope without arbitrary flexibility, but it becomes problematic if it dilutes the "real quantities" claim—e.g., if hyperparameters are always retrofitted, not pre-registered. 

  The top three defeaters, in order, are:  
  1. **D1 (Formal intractability)**: If proven, it undermines the physical possibility of the theory. Proponents contest this by appealing to approximations, but weak approximations may not preserve normativity.  
  2. **D2 (Neural implementation gap)**: This directly attacks the "real quantities" claim. Proponents concede it would be serious if neural correlates remain elusive after exhaustive search.  
  3. **D3 (Predictive failure against associative rivals)**: If associative models consistently outperform in explaining the thesis’s own legs (e.g., cue weighting), the Bayesian account’s necessity collapses. Proponents contest this but cannot ignore persistent predictive shortfalls.  

