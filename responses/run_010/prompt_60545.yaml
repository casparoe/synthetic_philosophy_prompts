  | Neural populations should exhibit separable representations for prediction errors and priors (e.g., in fMRI), with error amplitudes scaling inversely with precision. | Dynamical-systems: Neural activity reflects holistic attractor states, not separable "error" or "prior" signals. | If neural data shows no dissociable error/prior coding or precision-scaling, dynamical accounts gain ground, undermining representational commitments. |
  | Illusions should transfer to novel stimuli sharing statistical features (e.g., texture), even without associative history, due to prior generalization. | Associative-learning: Illusions require specific learned associations and fail to generalize to novel statistical contexts. | If illusions lack generalization, associative accounts win, forcing the Bayesian view into inelegant ad hoc adjustments (e.g., narrow priors). |
