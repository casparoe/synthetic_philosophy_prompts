  | D2  | Neural implementation gap: No consistent neural correlates for Bayesian quantities (e.g., priors, likelihoods) exist, indicating they are not "real" but post hoc constructs.                         | empirical finding    | Comprehensive neural recording studies (e.g., fMRI, EEG, single-unit) across multiple paradigms fail to find decodable representations of probability distributions or their updates, despite sensitive methods and cross-species validation. | serious  | Bayesian quantities are encoded distributively or dynamically in population activity, and current methods lack resolution; absence of evidence isn't evidence of absence. | Persistent failures across improved techniques would erode the "reality" claim.                            | would concede    |
  | D3  | Predictive failure against associative rivals: Pure associative models (e.g., Rescorla-Wagner) explain cue combination and illusion data better without inference, violating the necessity of Bayesian computation. | rival explanation    | A series of experiments where associative models quantitatively outperform Bayesian models in predicting behavioral and neural data (e.g., cue reweighting speed, illusion magnitude) while being more parsimonious. | serious  | Bayesian models subsume associative ones as special cases (e.g., with fixed priors), and they explain why behavior is normatively optimal, not just how. | Associative models may capture adaptive phenomena without invoking inference, undermining Bayesian uniqueness. | contested        |
