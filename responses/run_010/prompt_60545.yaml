  Let's brainstorm defeaters that specifically target the strong Bayesian claim:

  1. **Empirical: Lack of neural implementation evidence.** Even if behavior is Bayesian, the neural implementation might not involve manipulating likelihoods, priors, etc. as real quantities. Trigger: Failure to find neural representations of probability distributions (e.g., no neurons or populations that code for likelihoods, priors, or posteriors in a way that is necessary for the computation) despite sufficient investigation.

  2. **Formal: The problem of unmanageable complexity.** Hierarchical generative models in real-world settings are computationally intractable. The brain cannot possibly compute the required inferences in the time it does. Trigger: A formal proof that the class of generative models required to explain human perception and action (given the complexity of natural scenes) cannot be approximated with neural resources in real time.

  3. **Philosophical: The problem of multiple realizability of behavior.** The same behavior can be produced by many different computational processes, so even if behavior is optimal, it doesn't mean the brain is doing Bayesian inference. Trigger: An existence proof (e.g., a neural network or dynamical system) that achieves the same behavioral and neural effects without any Bayesian inference, by using a different mechanism.

  4. **Rival explanation: Success of non-Bayesian models.** There are phenomena that are better explained by associative learning or dynamical systems without any appeal to inference. Trigger: A clear experimental demonstration where a non-Bayesian model (e.g., Rescorla-Wagner or a dynamical systems model) predicts the data better than the Bayesian model, and the Bayesian model fails to capture key aspects even with added machinery.

  5. **Empirical: Mismatch in temporal dynamics.** Bayesian updating is typically assumed to be rapid and online, but some perceptual and learning effects show much slower timescales that are hard to reconcile with continuous inference. Trigger: Evidence that the timescales of belief updating (e.g., in cue combination or aftereffects) are orders of magnitude slower than what would be required for real-time inference, and that they depend on factors like sleep or consolidation that are not part of the generative model.

  6. **Formal: The problem of model selection.** The brain must have a generative model, but how is this model selected? If it's innate, how does it account for learning new concepts? If it's learned, then we need a meta-Bayesian process, which leads to regress. Trigger: A formal result showing that the space of possible generative models is so vast that no biologically plausible mechanism can select the right one in a lifetime, or empirical evidence that humans learn new causal structures in ways that cannot be explained by Bayesian updating of a hierarchical model.

  7. **Rival explanation: Predictive coding is not the only neural implementation.** Even if the brain does Bayesian inference, it might not be using predictive coding (which is often assumed in the user's literature). Other neural architectures (e.g., sampling-based, or non-predictive) might be at play. Trigger: Neural data showing that the brain uses a coding scheme that is incompatible with predictive coding (e.g., no hierarchical prediction errors, or no separation of prediction and error signals).

  8. **Empirical: Failure of generalization.** The Bayesian models work well in lab settings but fail in naturalistic settings. Trigger: A study showing that in real-world scenarios, human perception does not follow Bayesian predictions (e.g., in complex, changing environments) and that simpler heuristics outperform.

  We need at least two that the user hasn't anticipated. They mentioned:
