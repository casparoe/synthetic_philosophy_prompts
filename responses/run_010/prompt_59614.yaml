prompt: |-
  In a seminar last term someone circulated the following argument against hedonism about well-being, and I have been unable to decide whether it is any good.

  (1) For hedonism to be true, there must be a single property that every pleasant experience has and that is what makes having it good for you.
  (2) Pleasant experiences have no such property in common: a cold drink on a hot day, a proof finally clicking, a passage of music, and pain easing share nothing comparable to what all red things share.
  (3) So "pleasant" is a heterogeneous predicate, on the order of "game" — it picks out a family of loosely related cases, not a kind.
  (4) A heterogeneous predicate cannot name an intrinsic value-maker; if the property that makes experiences good has to be the same property in each case, hedonism fails.
  (5) And the failure generalizes: any candidate good-maker that is phenomenally multiply realizable is disqualified on the same grounds, so no unified account of well-being survives.
  (6) The way forward is therefore to stop asking what pleasures have in common in experience and to analyze pleasantness dispositionally instead: an experience is pleasant just in case it is one that its subject, at the time, wants to continue.

  I would like a diagnosis rather than a verdict. Which step should be struck, and why did it look safe to assert? Please name the equivocations and gaps explicitly — in particular, tell me whether (2) to (4) slides between claims about phenomenal qualities and claims about properties in general, and whether (5) and (6) can both be held by the same person. Then price the alternatives: what does a hedonist pay for rejecting (2), for rejecting (4), and for rejecting (5) respectively, and what does the argument's author pay for adopting (6) as a rescue of the theory (6) was supposed to help bury? I am not attached to hedonism itself, but I would rather not accept (5) if it can be avoided.

  Keep your answer under 400 words. Open with one sentence naming the step you would strike, then give the diagnosis, then set out the costs as a ranked list.
reasoning: |-
  Hmm, the user has shared an argument against hedonism that they encountered in a seminar. They want me to diagnose which step is flawed rather than just giving a verdict. The argument claims that pleasant experiences don't share a single property that makes them good, making "pleasant" a heterogeneous predicate like "game." Steps (4) and (5) then argue this disqualifies hedonism and any unified account of well-being, leading to a dispositional analysis in (6). The user specifically asks about equivocations between phenomenal qualities and properties, whether (5) and (6) can be held together, and the costs of rejecting different steps.

  I need to pinpoint the weakest link. Step (2) claims that pleasant experiences share nothing comparable to what all red things share. But this seems to conflate phenomenal qualities (how experiences feel) with properties in general. Hedonists might argue that while the experiences are diverse phenomenally, they share the abstract property of being pleasant - meaning they're all experiences we find positively valenced or desirable. The analogy to "red" is misleading because "red" refers to a specific phenomenal quality, while "pleasant" might refer to a functional role or evaluative property.

  The key equivocation happens between (2) and (4): (2) denies a shared phenomenal property, but (4) requires a shared property for being a value-maker, without specifying it needs to be phenomenal. The argument slides from "no shared phenomenal quality" to "no shared property at all that could ground value."

  For the costs:
  1. Rejecting (2) costs the least: Hedonists can maintain that pleasantness is a unified property at some level (e.g., motivational or functional), even if phenomenally diverse.
  2. Rejecting (4) would be costly as it challenges the idea that value-makers must be intrinsic properties, which might force hedonists into a less intuitive position.
  3. Rejecting (5) avoids the strong conclusion that no unified account of well-being is possible, but leaves the original argument against hedonism standing.

  The author of the argument pays a price by adopting (6) - the dispositional account. If pleasantness is defined dispositionally (as what we want to continue), this might save the unity of pleasantness as a property, but it risks collapsing into a desire-satisfaction theory of well-being, which isn't hedonism anymore. Hedonism traditionally holds that pleasure is intrinsically good, but if pleasantness is defined by desires, then desires become primary, and pleasure is just a consequence. So (6) rescues a theory by transforming it into something else, which might not help bury hedonism but rather replaces it.

  Regarding whether (5) and (6) can be held together: Probably not consistently by the same person. (5) claims that any phenomenally multiply realizable good-maker is disqualified, but (6) offers a dispositional account that avoids phenomenal multiplicity by not relying on phenomenology. The author might hold both only if they see (6) as abandoning the search for a phenomenal good-maker altogether, but (5) seems to dismiss any unified account, while (6) proposes an alternative unified account based on dispositions. There's tension here.

  I'll structure my response to start by naming step (2) as the one to strike, then explain the equivocation, then list the costs in a ranked order as requested. I'll keep it concise under 400 words.
answer: |-
  Strike (2) for equivocating between phenomenal properties and the property of pleasantness *simpliciter*.

  The argument slides from (2)'s claim that pleasant experiences share no *phenomenal* property comparable to redness (which may be true) to (4)'s demand that a value-maker must be a single intrinsic property (here presumed phenomenal). But hedonists need not hold that pleasantness is a phenomenal quality; they can treat "pleasant" as denoting a unified *evaluative or functional* property (e.g., positive affective valence or motivational pull), even if realized by diverse phenomenal states. Step (2) looks safe because introspection reveals stark phenomenal differences, but it ignores non-phenomenal interpretations of "property."

  Costs ranked by severity:
  1.  **Rejecting (2)**: Pays by weakening hedonism's tie to phenomenology, risking that "pleasantness" becomes abstract or functional—potentially diluting its introspective appeal. *Least costly.*
  2.  **Rejecting (4)**: Pays heavily by denying value-makers must be intrinsic/unified properties, inviting accusations of ad hoc-ery and undermining the search for a fundamental good. *Moderate cost.*
  3.  **Rejecting (5)**: Pays minimally by preserving unified non-hedonist theories (e.g., desire satisfaction), but leaves hedonism vulnerable to the original argument. *Low cost if abandoning hedonism.*

  The argument's author pays for adopting (6): Defining pleasantness dispositionally "rescues" hedonism only by transforming it into desire theory (since well-being would depend on desires, not intrinsic pleasure), contradicting (6)'s aim to bury hedonism. (5) and (6) *cannot* be consistently held: (5) rejects all unified accounts, but (6) offers one (desire-based), so endorsing both is self-undermining.
