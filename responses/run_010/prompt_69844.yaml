answer: |-
  ### In-Class Game: Selection Architectures  
  **Goal:** Experience Dennett's creature types through rule-based architectures, focusing on where selection occurs and who pays for errors. Teams operate under hidden constraints without knowing the creature names until debrief.

  ---

  ### **Materials List**  
  - **Index cards**:  
    - 32 strategy cards (8 per phase, 2 per team) 
    - 20 trial cards (numbers 1-10, two sets)  
    - 4 role rule sheets (one per team)  
    - 4 scorecards  
  - **Dice**: 2 standard six-sided dice  
  - **Whiteboard** for tracking scores  
  - **Timer**  
  - **Pre-written artifacts** (for Gregorian team)  

  ---

  ### **Setup & Hidden Structure**  
  **Core Mechanics**:  
  - **Two phases** (each 20 minutes).  
  - **Hidden Rules**:  
    - **Phase 1**: Correct answer is **A if number is prime, B otherwise**.  
      *Trials*: 2, 3, 4, 5, 9 (Correct: A, A, B, A, B).  
    - **Phase 2**: Correct answer is **A if number >5, B otherwise**.  
      *Trials*: 2, 3, 6, 9, 10 (Correct: B, B, A, A, A).  
  - **Scoring**: Correct guess = +3 points. Incorrect = 0.  

  **Sandbox Flaw**:  
  - Sandbox (Popperian) team practices with numbers 1-10 using **flawed rule: A if odd, B if even**.  
  - Real rules differ: Prime (Phase 1) and >5 (Phase 2).  
  - Artifact (Gregorian) team inherits sandbox team’s flawed rule.  

  **Hardwired Strategy**:  
  - Strategy card: **"Choose A if number <6, else B"**.  
    - *Phase 1 success*: Correct for 4/5 trials (fails on 4).  
    - *Phase 2 failure*: Correct for 0/5 trials (all wrong).  

  **Outcome Learner Costs**:  
  - Probe (learn true answer) costs 2 points. Guess without probing earns +3 if correct.  

  ---

  ### **Role Rule Sheets (One-Pager per Team)**  
  **Distribute these *without* creature names.**  

  #### **Team 1: Fixed Strategy (Hardwired/Darwinian)**  
  > "You are **HARDWIRED**. Follow your strategy card exactly. Do not change it.  
  > - **Strategy**: Choose **A if number <6, else B**.  
  > - **Scoring**: +3 for correct guess, 0 for wrong.  
  > - **Rules**: No probing or learning. Stick to your card!"  

  #### **Team 2: Outcome Payoff (Skinnerian)**  
  > "You **PAY FOR KNOWLEDGE**. Each trial, choose:  
  > - **GUESS**: Earn +3 if correct, 0 if wrong.  
  > - **PROBE**: Pay 2 points to learn the *true answer*. Then, you must guess it (earning +3). Net: +1 if correct.  
  > **Scoring**: Track costs on your scorecard."  

  #### **Team 3: Sandbox Practice (Popperian)**  
  > "You get **FREE PRACTICE**.  
  > - **Step 1 (Practice)**: Test any numbers 1-10. Instructor gives answers. *Record your rule*.  
  > - **Step 2 (Real Trials)**: Use *only* your rule to guess.  
  > - **Scoring**: +3 for correct, 0 for wrong. No probing in real trials!"  

  #### **Team 4: Borrowed Tool (Gregorian)**  
  > "You use a **PRE-MADE TOOL**.  
  > - **Artifact**: "Choose A if odd, B if even." (From Team 3’s practice).  
  > - **Rules**: Use this tool for *all* guesses. Do not change it.  
  > - **Scoring**: +3 for correct, 0 for wrong."  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Intro (5 min)**:  
     - Split into 4 teams. Explain: "Discover a hidden rule. Follow your team’s rules strictly. Goal: Maximize points."  

  2. **Setup (10 min)**:  
     - Give each team their rule sheet, scorecard, and materials.  
     - **Sandbox Team**: Runs practice (5 min). Records rule. Instructor gives copy to **Artifact Team**.  

  3. **Phase 1 (20 min)**:  
     - **Trials (15 min)**: Instructor reveals numbers one-by-one. Teams guess A/B:  
       - *Hardwired*: Applies strategy card.  
       - *Outcome*: Chooses probe/guess per trial.  
       - *Sandbox/Artifact*: Apply their rule.  
     - **Scoring (5 min)**: Record points. *Do not reveal rule*.  

  4. **Phase 2 (20 min)**:  
     - Repeat trials with new numbers. Rules change (unannounced).  
     - *Hardwired*: Same strategy (fails).  
     - *Sandbox/Artifact*: Same rule (partial success).  

  5. **Final Scoring (5 min)**:  
     - Tally points. Reveal hidden rules.  

  6. **Debrief (30 min)**:  
     - Reveal creature names. Map experiences:  
       - **Darwinian (Hardwired)**: "You succeeded in Phase 1 but couldn’t adapt in Phase 2. Selection happens *before* the task—fixed competence, no error cost."  
       - **Skinnerian (Outcome)**: "You paid for every probe. Selection happens *during* the task—errors cost points, but you converged on truth."  
       - **Popperian (Sandbox)**: "Your ‘free’ practice had a hidden flaw. Selection happened in a *simulation*—errors felt costless until real failure."  
       - **Gregorian (Artifact)**: "You ‘rented’ the sandbox team’s model. Genius until Phase 2, when you inherited *their* error. Gregorian creatures outsource selection and get the downsides."  
     - **Key Insight**: "Cleverness isn’t the ladder. The difference is *where* selection occurs (before/during/simulation/outsourced) and *who pays* for errors."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Sandbox Team Suspicious of Free Trials**:  
     - Why: They’ll question why practice is costless.  
     - Fix: Emphasize: "This is part of your architecture. Trust the rules." Add a fake "budget" to their sheet ("Free trials: Use wisely!").  

  2. **Hardwired Team Bored/Breaks Character**:  
     - Why: Passive role; may disengage.  
     - Fix: Assign a "strategy analyst" role: Track if others deviate from rules. Offer bonus points for vigilance.  

  3. **Artifact Team Finishes Early/Heckles**:  
     - Why: Simple rule → quick guesses.  
     - Fix: Give them "artifact upgrade" tasks: "Predict how other teams will guess and why."  

  4. **Outcome Learner Over-Probes**:  
     - Why: May probe all trials, missing the learning-as-investment point.  
     - Fix: Cap probes at 2/5 trials. Say: "Limited resources!"  

  5. **Time Crunch in 90 Minutes**:  
     - Cut: Reduce trials from 5 to 3 per phase. Skip Phase 2 for Sandbox (focus on artifact inheritance).  

  ---

  ### **Limitations & Discussion Gaps**  
  - **Skinnerian/Popperian Are Simulated, Not Pure**:  
    - Students (language-users) can’t *fully* experience non-linguistic conditioning (Skinnerian) or internal simulation (Popperian). They’re role-playing.  
    - **Cover in Discussion**: "Real Skinnerian creatures pay with survival, not points. Popperian creatures don’t *know* they’re in a sandbox. We’re approximating."  
  - **Gregorian Is the Only "Real" Architecture Here**:  
    - Using artifacts (rules) is native to humans. Lean into this: "You *are* Gregorian creatures role-playing the others. What did it feel like to trust a flawed tool?"  
  - **If Cutting One Team**:  
    - **Drop Skinnerian**: Their "pay-for-info" mechanic is least distinct from everyday learning. Fold probing into discussion: "How is this like Skinnerian conditioning?"  

  ---

  ### **Instructor Cheat Sheet**  
  - **Hidden Rules**:  
    - Phase 1: Prime → A.  
    - Phase 2: >5 → A.  
  - **Sandbox Flaw**: Practice rule = odd/even (not prime/>5).  
  - **Hardwired Strategy**: A if <6, else B.  
  - **Scoring**:  
    - Outcome Team: Probe cost = -2. Correct guess = +3.  
    - Others: Correct = +3, wrong = 0.  
  - **Critical Debrief Points**:  
    - **Error Cost**: Who paid? (Hardwired: none. Skinnerian: themselves. Popperian: delayed. Gregorian: inherited.)  
    - **Selection Location**: Before (Hardwired), during (Skinnerian), simulated (Popperian), outsourced (Gregorian).  

  Run tight, emphasize role constraints, and debrief ruthlessly. The game will create visceral "aha!" moments about competence without intelligence.
