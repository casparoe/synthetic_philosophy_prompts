prompt: |-
  I'm two years into a PhD in ancient history — my thesis is on honorific decrees and elite self-presentation in the Greek East under the empire, so Plutarch keeps getting waved at me by my supervisor as the thing I ought to be reading him against. I've also been co-teaching a survey that runs out into late antique saints' cults, which is not my period at all. Last week our reading group took up a recently published trade-ish book on the history of life-writing, and the introductory chapter makes an argument that I found persuasive on the first pass and slightly wrong on the second, but I can't tell which of my two reactions is the ignorant one. Here's the chapter's argument, condensed and put in my own words but with nothing added or dropped:

  "Plutarch is where the West gets the idea that a life is a moral instrument rather than a record of events. He tells his reader at the outset of the Alexander that what he is offering is a life, not a history, and that what actually discloses a man's character is rarely large — a remark, a joke, how someone conducts himself when nobody consequential is watching — whereas battles with tens of thousands dead tell you almost nothing about a soul. Hagiography is the same genre re-pointed: instead of an exemplar for civic life you get an exemplar for religious life, but the machinery is identical, so select the edifying episodes, compress the chronology, suppress what doesn't serve the portrait, and you have either a Plutarchan life or a saint's life. Which is why both are equally useless as evidence about their subjects and equally good as evidence about their audiences: they tell you what the people reading them valued, not who the person was. The one genuine formal difference runs in the opposite direction from the usual assumption — Plutarch at least paired a Greek with a Roman and then set the two side by side in a comparison, so he had a built-in control on how exceptional his subject was. Hagiographers had no comparative apparatus whatsoever, and therefore no way of knowing whether their saint was unusually holy or merely conventionally pious."

  Can you go through this claim by claim and tell me what's solid, what's a defensible simplification for a general reader, and what a specialist would push back on? Specifically I'd like: (1) whether the "life, not history" business supports the inference the chapter draws from it, given how much campaign narrative Plutarch actually includes; (2) whether "invented" is fair in the first sentence, or whether there's a prior tradition of ethically-shaped life-writing he's working inside; (3) whether "same genre, same machinery" holds up for hagiography — I have a vague sense the saint's life is doing something structurally different, not just swapping the domain of virtue, and I'd like to know what that difference actually is (who the agent of the excellence is, what the reader is supposed to do, what the text is for in a cult); and (4) whether that last formal claim about comparative apparatus is right or whether hagiography has its own ways of calibrating degrees of holiness. Then tell me whether the two conclusions follow from the corrected premises: that both are equally useless as sources for their subjects, and that Plutarch's self-limitation gives him an evidential advantage the hagiographer lacks.

  And a practical worry underneath all this. My supervisor wants me to cite Plutarch for how provincial elites wanted to be seen; the chapter would have me say Plutarch is only evidence for Plutarch's audience and nothing more. Those feel like they can't both be wrong, but I also can't see how to hold them together — is that a real tension or am I just confusing two different questions? Please write the whole thing in British English.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex historiographical puzzle involving Plutarch, hagiography, and their evidentiary value - precisely the intersection where their PhD research lives. 

  First, I need to unpack the trade book's argument point by point while keeping in mind the user's practical concern about using Plutarch as evidence for provincial elite self-presentation. The four specific queries provide a good framework: 

  Regarding Plutarch's "life, not history" declaration, I recall he does include substantial military narratives despite his methodological statement. This seems like a case where practice doesn't fully match theory - the campaign details serve his moral aims by showing character under pressure. The dichotomy might be overstated.

  On invention claims, there's definitely pre-Plutarchan life-writing traditions (Xenophon's Agesilaus, Philo's Moses) that already framed lives ethically. Plutarch innovated within existing conventions rather than creating ex nihilo. 

  The hagiography comparison feels problematic. While both select edifying episodes, saints' lives operate within different frameworks: miracles as divine authentication, imitatio Christi patterns, and liturgical functions that Plutarch's Lives lack. The "machinery" isn't identical when one serves civic pedagogy and the other religious cult.

  The comparative apparatus point is interesting. Plutarch's synkriseis do provide relative scaling, but hagiography has its own calibration methods through typology (biblical parallels) and gradations of asceticism. The absence of explicit comparison doesn't mean no implicit frameworks exist.

  For the evidentiary conclusions: both genres require careful hermeneutics. Plutarch absolutely reflects contemporary elite values, but precisely because he shares that worldview with his subjects. The distance between authorial audience and historical subject matters - provincial elites were reading Plutarch too, so the values transmission is multidirectional. 

  The user's methodological tension is real but resolvable: Plutarch is evidence for both his subjects' self-presentation (as they'd want to be seen) and his audience's values (as they wanted to see it). The key is acknowledging the mediated nature of this evidence rather than treating it as transparent.

  I should emphasise that British academic conventions mean prioritising nuance over bold claims, showing awareness of key scholars (Stadter, Cox, Burridge), and avoiding reductive binaries while still offering clear guidance for the user's thesis work.
answer: |-
  Right, let's break this down point by point, addressing your queries in turn and then tackling the underlying tension. I'll use British English throughout.

  **Analysis of the Chapter's Claims:**

  1.  **"Plutarch is where the West gets the idea that a life is a moral instrument rather than a record of events... He tells his reader... what he is offering is a life, not a history..."**
      *   **Solid:** Plutarch *does* explicitly state this methodological distinction in the *Alexander* proem (and elsewhere, like *Nicias* 1.5). His focus *is* overwhelmingly on character (ἦθος) and virtue/vice (ἀρετή/κακία) revealed through anecdote, speech, and private moments (πρᾶξεις μικραί, λόγος, παιδιά), rather than exhaustive historical chronicle. The *purpose* is moral edification.
      *   **Defensible Simplification:** Framing him as the *origin* ("where the West gets the idea") for this specific *biographical* focus is a strong claim suitable for a trade book, but requires nuance.
      *   **Specialist Pushback:** Two key points:
          *   **Prior Tradition:** Plutarch didn't invent ethically-shaped life-writing. He worked within established Greek traditions: Xenophon's *Agesilaus* is explicitly encomiastic and moralising; Isocrates' *Evagoras* is a prose encomium; Hellenistic biography (e.g., Satyrus, fragments) often had ethical aims; Philo's *Life of Moses* offers a parallel Jewish example. Roman *exempla* tradition also valorised figures morally. Plutarch *systematised* and perfected the "parallel life" as a moral project on a grand scale, but the core idea predates him.
          *   **Campaign Narrative Inclusion:** You rightly spot the tension. While Plutarch *says* he privileges the small detail over grand events, his Lives *are* often packed with military and political narrative (e.g., *Caesar*, *Alexander* itself). The chapter slightly overplays the dichotomy. Plutarch *uses* historical events, especially battles and political crises, precisely *as* the crucible in which character is revealed. He doesn't omit major events; he selects and narrates them *through* the lens of character assessment. The campaign narrative isn't "useless history" to him; it's the stage where the moral drama plays out. The "remark, a joke" principle is his *method* for revealing character *within* the broader historical framework he often provides.

  2.  **"Hagiography is the same genre re-pointed... machinery is identical... select the edifying episodes, compress the chronology, suppress... you have either a Plutarchan life or a saint's life."**
      *   **Solid:** Superficially, there are undeniable similarities in technique: selectivity, anecdotal focus for character revelation, chronological compression/arrangement for thematic/edifying purposes, omission of inconvenient details. Both aim to present an exemplary figure. The shift from civic/political virtue to religious virtue is a valid observation.
      *   **Defensible Simplification:** Highlighting these shared narrative strategies is useful for a general reader to see a conceptual link across time.
      *   **Specialist Pushback (Crucial Differences):** The chapter significantly underplays fundamental structural, functional, and ideological differences:
          *   **Agent of Excellence:** In Plutarch, virtue (ἀρετή) is fundamentally human, cultivated through reason, education, and action within the civic sphere. In hagiography, holiness is a *gift of divine grace*, demonstrated through miracles, asceticism, and unwavering faith, often *transcending* or *rejecting* civic norms. The saint is a conduit for divine power.
          *   **Purpose & Function:** Plutarch's Lives are primarily *didactic* for elite citizens navigating public life. Hagiography serves multiple, often simultaneous functions: liturgical (readings on feast days), cultic (establishing/legitimising the saint's power and presence at a shrine/apostolic succession), paraenetic (exhortation to imitate the saint's faith/asceticism), apologetic (defending orthodoxy), and thaumaturgic (demonstrating the saint's *ongoing* power through miracles, often linked to relics). The text isn't just *about* the saint; it *activates* the saint's power within the community.
          *   **Structural Elements:** Hagiography incorporates specific topoi largely absent or downplayed in Plutarch: miraculous birth/childhood prophecies, radical conversion, intense ascetic struggles (demonic battles, extreme deprivation), posthumous miracles (often the most important section), the "good death" (martyrdom or peaceful repose as triumph), and the establishment of cult (relics, shrine, feast). The narrative arc is often teleological, moving inexorably towards sanctification and eternal reward.
          *   **Truth Claims & Audience Expectation:** While both use selectivity, hagiography frequently operates within a framework where the miraculous is not just exemplary but *evidential* of divine favour and power. Suppression isn't just about polishing; omitting a saint's sin might be essential to their status as a vessel of grace. The audience often approaches the text with a devotional or intercessory mindset, different from Plutarch's reader seeking civic wisdom. The "machinery" involves fundamentally different theological cogs.

  3.  **"The one genuine formal difference... Plutarch at least paired... a built-in control... Hagiographers had no comparative apparatus whatsoever..."**
      *   **Solid:** Plutarch's *Synkriseis* are indeed a unique formal feature of his project, explicitly inviting comparison to calibrate the degree of virtue/vice relative to another eminent figure.
      *   **Defensible Simplification:** Stating hagiography lacks this *specific, explicit* comparative structure is accurate.
      *   **Specialist Pushback:** Hagiography *absolutely* has mechanisms for calibrating holiness, just different ones:
          *   **Typology:** Saints are constantly measured against biblical archetypes (Christ, Apostles, prophets, martyrs) or earlier saints. Athanasius presents Antony as a new Apostle. The *Life of Martin* by Sulpicius Severus implicitly compares Martin to biblical figures and earlier ascetics.
          *   **Gradation within Hagiography:** Different *types* of sanctity imply hierarchy (e.g., martyr > confessor; stylite > cenobitic monk). Accounts often show saints surpassing their predecessors or teachers in ascetic rigor or miraculous power.
          *   **Miracles as Quantifiable Proof:** The scale, frequency, and nature of miracles often serve as an implicit measure of holiness. Power over nature, healing terminal illnesses, or defeating powerful demons signifies a higher degree of divine favour than lesser feats.
          *   **Asceticism as Scale:** The extremity of ascetic practices (fasting, exposure, endurance) provides a relative scale of holiness. The more superhuman the renunciation, the holier the saint.
          *   **Communal Recognition:** The gathering of disciples, veneration by bishops, or posthumous cult formation within the narrative itself acts as a form of calibration – the community recognises and validates the degree of holiness.

  **Evaluating the Conclusions:**

  1.  **"Equally useless as evidence about their subjects":**
      *   **Overstated/Significant Pushback:** This is far too reductive. While neither provides a straightforward, objective "record of events," they are invaluable sources when used critically:
          *   **Plutarch:** Provides insights into his subject's *reputation*, key events in their career (even if interpreted), contemporary anecdotes circulating about them, and sometimes unique information (especially for Hellenistic figures where sources are scarce). His access to sources now lost (e.g., Hellenistic historians, letters) makes him irreplaceable, *if* handled with source-critical rigour. He *is* evidence for how elite figures *were presented and remembered*, which is crucial for your thesis on elite self-presentation.
      *   **Hagiography:** Can preserve historical kernels: the saint's origin, location, rough chronology, association with known figures/events, foundation of monasteries/churches, social context of conflicts (e.g., paganism vs. Christianity, theological disputes). Archaeological evidence sometimes corroborates basic facts in vitae. Utterly dismissing them as "useless" ignores sophisticated historical methodologies developed by late antique/medieval historians.

  2.  **"Equally good as evidence about their audiences... tell you what the people reading them valued":**
      *   **Largely Solid, but with Nuance:** This is the *strongest* part of the chapter's argument and aligns well with reception theory. Both genres are primary sources par excellence for understanding the *ideals, values, anxieties, and self-conceptions* of the cultures that produced and consumed them.
      *   **Nuance:** Plutarch primarily reflects the values of the educated Greco-Roman elite of the early Imperial period. Hagiography reflects the values of specific Christian communities, monastic circles, bishops, and the developing cult of saints – which were diverse and evolved over time. The *audience* for hagiography could be broader (including laity via liturgical readings) than Plutarch's primarily literate elite readership.

  3.  **"Plutarch's self-limitation gives him an evidential advantage the hagiographer lacks":**
      *   **Partially True, but Misleading:** The *Synkriseis* are a unique formal tool for explicit relativisation. However:
          *   Plutarch's "self-limitation" is more rhetorical than absolute (point 1 rebuttal). He still includes vast historical narrative.
          *   Hagiography's implicit calibration methods (typology, miracles, asceticism) are equally potent *within their own framework* for understanding how *that culture* perceived and graded holiness. They tell us *how* the audience measured sanctity, which is precisely the evidence about the audience the chapter values. Plutarch tells us how *he* measured civic virtue comparatively; hagiography tells us how *its audience* measured sanctity comparatively (implicitly). The *nature* of the evidence differs, but both provide evidence of comparative frameworks.

  **Resolving Your Practical Worry: Plutarch & Provincial Elites**

  This is the crux, and the chapter's stark position creates a false dichotomy. Here's how to hold your supervisor's view and a more nuanced version of the chapter's insight together:

  1.  **Plutarch as Evidence for Elite Values:** Your supervisor is fundamentally correct. Plutarch *is* a prime source for understanding the ethical ideals, anxieties about power, concepts of leadership, and modes of self-presentation valued by the Greco-Roman elite in the Imperial period, *including* provincial elites. He articulates the cultural script they were often performing. Reading Plutarch tells you what constituted "honour" and "virtue" in that world.
  2.  **The Chapter's Valid Point:** The chapter correctly emphasises that Plutarch primarily tells us about the *values of his audience* (and his own perspective as a member of that elite). He filters his subjects *through* that lens. We see Alexander or Pericles *as Plutarch and his contemporaries thought a great leader should be seen*.
  3.  **The Synthesis for Your Thesis:** This is *precisely why* Plutarch is relevant to your work on "elite self-presentation."
      *   Provincial elites aspiring to status within the Imperial system were consuming literature like Plutarch. They were part of his audience. His Lives presented models of behaviour and values *they sought to emulate* in their own civic benefactions and inscriptions.
      *   The values Plutarch espouses (paideia, philanthropia, civic virtue, moderation, leadership) are the *same values* provincial elites were showcasing in their honorific decrees and public image. Plutarch provides the philosophical and literary articulation of the cultural framework *within which* provincial elite self-presentation operated.
      *   **Therefore:** Plutarch *is* direct evidence for the *value system* that provincial elites were buying into and performing. He is evidence for the *audience's values* – and your provincial elites *were* part of that audience and actively shaping their self-presentation *according to* those values. He may not be a transparent window onto the *precise inner thoughts* of a specific 2nd-century AD notable in Bithynia, but he is an essential source for understanding the *cultural repertoire of elite values and self-presentation strategies* that they drew upon and contributed to.

  **Conclusion:**

  The chapter makes some valid points about shared narrative techniques and the importance of audience reception but oversimplifies drastically. Plutarch wasn't the inventor of ethical biography, his practice was more complex than his proem suggests, and the differences between Plutarchan Lives and hagiography are profound, not merely a matter of swapping "civic" for "religious" virtue. Neither genre is "useless" for their subjects when used critically; both are excellent for understanding their audiences' values.

  Your practical worry stems from the chapter's overly stark presentation. Your supervisor's direction is sound: Plutarch *is* crucial for understanding the value system underpinning provincial elite self-presentation precisely *because* he articulates the ideals of the audience (including those elites) for whom that presentation was performed. The "tension" dissolves when you recognise that provincial elites were *consumers* of Plutarchan values and *actors* performing within that same framework. Your thesis can (and should) use Plutarch to illuminate that framework, while acknowledging the mediated nature of his portraits. Cite him for the values, the models, and the cultural script – the very things your elites were trying to project. That *is* evidence for their self-presentation.
