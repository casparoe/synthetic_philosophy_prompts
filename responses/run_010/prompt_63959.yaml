  ### Design Notes  
  **Brainstorming & Triage of Branch Variables**  
  I identified nine candidate variables: cost location (essential; high discriminative power), second-law quantity (core to entropy definitions), system boundary (foundational for accounting), initial condition (separates dynamical vs. statistical views), non-representational test (probes dependence on "demonhood"), generality (tests robustness), cost without use (addresses use-dependence), erasure-dependence (discarded: too tied to Landauer), and record physicality (discarded: metaphysical, low discriminative power).  

  **Discarded Variables**  
  - *Erasure-dependence:* Phrased as "does resolution depend on erasure?" This privileges Landauer and biases answers. Replaced with neutral cost-location options.  
  - *Record physicality:* Asks "is the record always physical?" Tracks verbal disagreements (e.g., "information" vs. "physical state") without physical implications.  

  **Variable Ranking**  
  1. **Cost location (6 options):** Highest discriminative power. Separates Landauer (C4), Brillouin (C1), statistical (C5), and use-based (C3) resolutions.  
  2. **Boundary (3 options):** Splits total-system views (B1) from demon-external views (B2/B3).  
  3. **Second-law quantity (5 options):** Distinguishes thermodynamic, information-theoretic, and mutual-information accounts.  
  4. **Cost without use (2 options):** Isolates use-dependent resolutions (e.g., Cost in Use requires U2).  
  5. **Non-representational test (2 options):** Separates Brillouin (R2) from general resolutions (R1).  
  6. **Initial condition (2 options)/Generality (2 options):** Lower discriminative power; refine statistical and niche views.  

  **Tree Structure Rationale**  
  Ordering avoids priming: boundary first (neutral setup), then cost location (core), then conceptual quantities, then tests/special conditions. Paths to leaves cover all major positions while exposing gaps (e.g., storage-cost resolutions are unnamed due to theoretical awkwardness).
