  ### Maxwell's Demon Diagnostic Decision Tree  
  *Starting Commitments:* You accept that a Szilard engine can be constructed and cycled, and that the second law holds in some form. Answer each question based on physical reasoning alone.  

  1. **Boundary:** For entropy accounting, is the demon (including its memory) considered part of the system?  
     - **B1:** Always part of the system.  
     - **B2:** Always separate from the system.  
     - **B3:** Sometimes part, sometimes separate (e.g., during specific operations).  

  2. **Cost Location:** Where in the demon’s operation is the compensating thermodynamic cost paid?  
     - **C1:** Acquisition of information.  
     - **C2:** Storage of information.  
     - **C3:** Use of information.  
     - **C4:** Disposal (erasure) of information.  
     - **C5:** Nowhere (no cost in the operation).  
     - **C6:** Multiple stages (distributed cost).  

  3. **Second-Law Quantity:** What primary quantity does the second law apply to?  
     - **Q1:** Thermodynamic entropy of the gas.  
     - **Q2:** Gibbs entropy (ensemble entropy).  
     - **Q3:** Shannon entropy of the system’s state.  
     - **Q4:** Mutual information between system and record.  
     - **Q5:** Total thermodynamic entropy (system + demon + environment).  

  4. **Initial Condition:** Does the resolution require a special low-entropy initial condition for the universe?  
     - **I1:** Yes.  
     - **I2:** No.  

  5. **Non-Representational Test:** Can the demon be replaced by a non-representational device (e.g., ratchet and pawl) without changing the resolution?  
     - **R1:** Yes.  
     - **R2:** No.  

  6. **Generality:** Does the resolution apply to every conceivable demon?  
     - **G1:** Yes.  
     - **G2:** Only to analyzed cases.  

  7. **Cost Without Use:** Is the cost incurred even if information is acquired and stored but never used?  
     - **U1:** Yes.  
     - **U2:** No.  

