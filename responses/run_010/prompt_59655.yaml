answer: |-
  ### Philosophy of Action Seminar: Side-Effect Asymmetry Activity  
  **Total Time:** 75 minutes  
  **Students:** 22 second- and third-year undergraduates  
  **Goal:** Generate and analyze the side-effect asymmetry (Knobe effect) using novel vignettes, then debate whether it reflects a performance error or a feature of the concept of intentional action.  

  ---

  ### **Session Design**  
  #### **Step 1: Introduction & Setup (5 min)**  
  - **Context (2 min):** Briefly recap the standard analysis of intentional action and deviant causal chains. Introduce today’s focus: empirical challenges to the analysis, specifically whether moral valence affects judgments of intentionality.  
  - **Logistics (3 min):**  
    - Randomly distribute **sealed envelopes** (prevents neighbors seeing different conditions). Each contains one vignette (Condition A or B) and a response slip.  
    - Instructions: “Read your vignette silently. Answer the questions honestly—your data will shape our discussion. Do not discuss until prompted.”  

  #### **Step 2: Novel Vignettes (Reading: 3 min; Response: 5 min)**  
  - **Design Principles:**  
    - **Held Equal:**  
      - Agent’s foresight (explicitly stated).  
      - Probability of side effect (“virtually certain”).  
      - Agent’s skill (“highly competent”).  
      - Side effect’s status (purely a side effect, not a means).  
      - Agent’s attitude (“indifferent” to outcome).  
    - **Manipulated:** Valence of side effect (harm vs. help).  
  - **Vignettes (Set in a neutral academic context):**  
    - **Condition A (Harm):**  
      > *Sam is a highly competent linguistics student. Their professor asks them to test a new speech-analysis algorithm by recording a class discussion. Sam knows the algorithm is almost flawless at detecting accents. Recording the discussion will provide the needed data, but it will also* harm *a classmate, Kai, who is self-conscious about their accent. Sam is indifferent to Kai’s feelings. Sam proceeds. The algorithm works perfectly, and Kai, as expected, feels* humiliated.  
      (85 words; ~60 sec to read)  
    - **Condition B (Help):**  
      > *Sam is a highly competent linguistics student. Their professor asks them to test a new speech-analysis algorithm by recording a class discussion. Sam knows the algorithm is almost flawless at detecting accents. Recording the discussion will provide the needed data, but it will also* help *a classmate, Kai, who hopes to improve their accent. Sam is indifferent to Kai’s progress. Sam proceeds. The algorithm works perfectly, and Kai, as expected, gains* confidence.  
      (83 words; ~60 sec to read)  
  - **Response Slip (45 sec to complete):**  
    1. Did Sam bring about the effect on Kai **intentionally**?  
       ☐ Yes  ☐ No  
    2. Rate your confidence:  
       1 (Not at all)  2  3  4  5 (Very)  
    3. **Optional:** One reason for your answer: _______________  

  #### **Step 3: Data Collection & Tally (7 min)**  
  - **Logistics:**  
    - Students seal responses in envelopes after completion.  
    - Envelopes collected and shuffled to obscure conditions.  
  - **Tally on Whiteboard (4 min):**  
    - Draw a table:  

      | Condition | Intentional (Yes) | Unintentional (No) | Total |  
      |----------|-------------------|---------------------|-------|  
      | A (Harm) | [Tally]          | [Tally]            | 11    |  
      | B (Help) | [Tally]          | [Tally]            | 11    |  

    - Calculate percentages:  
      - E.g., Harm: 8/11 (73%) Yes vs. Help: 2/11 (18%) Yes → asymmetry present.  

  #### **Step 4: Initial Debrief (10 min)**  
  - **Reveal Conditions & Results (3 min):** Disclose that A = Harm, B = Help. Show tallied data. Highlight asymmetry if present.  
  - **Pose the Fork (7 min):**  
    - “Why might we see this pattern? Two hypotheses:  
      1. **Performance Error:** The concept of intentional action is morally neutral, but people misapply it due to bias.  
      2. **Concept Fact:** Moral valence is built into the concept—calling harm intentional isn’t a mistake.”  
    - **Prompt:** “In pairs, propose one way to test these hypotheses. Focus on *how* we could gather evidence.”  

  #### **Step 5: Hypothesis Testing Activity (25 min)**  
  - **Group Proposal (10 min):**  
    - Students form pairs/small groups. Task: “Design a quick test (≤5 min) to discriminate between the hypotheses. Use paper slips or the board.”  
    - **Anticipated Proposals:**  
      - *Vary agent’s attitude* (e.g., Sam *desires* the side effect).  
      - *Ask about intent* (e.g., “Did Sam *intend* the outcome?” vs. “Was it *intentional*?”).  
      - *Remove moral language* (e.g., describe outcomes neutrally: “Kai felt stressed” vs. “Kai felt relaxed”).  
  - **Select & Run a Test (15 min):**  
    - **Instructor Guidance:** Steer toward a feasible, quick test (e.g., varying attitude).  
    - **Example Test (Attitude Manipulation):**  
      - Rewrite vignettes adding: “Sam *actively wants* [to humiliate Kai/to help Kai].”  
      - Re-poll the class (split into 4 groups: Harm + Desire, Harm + Indifferent, Help + Desire, Help + Indifferent).  
      - Tally and compare to original data:  
        - *Performance Error Prediction:* Desire increases “yes” for help; indifference reduces asymmetry.  
        - *Concept Fact Prediction:* Asymmetry persists regardless of attitude.  
    - **Logistics:** Use paper slips for new responses; tally on board.  

  #### **Step 6: Conclusion (5 min)**  
  - **Synthesize (3 min):** Contrast group predictions with results. Emphasize that asymmetry often persists despite attitude changes (supporting concept fact).  
  - **Limitations & Wrap-up (2 min):**  
    - “Today’s small sample can’t confirm statistical significance—we’d need 100+ participants. But we replicated the *logic* of the asymmetry. Next week: How theorists explain this.”  

  ---

  ### **Predictable Challenges & Solutions**  
  - **Asymmetry Fails to Appear (e.g., 5/11 Yes for Harm, 4/11 for Help):**  
    - **Solution:** Normalize this! Say: “Small samples vary. Published studies show ~80% call harm intentional vs. ~20% for help. Our trend [point it out] aligns. Let’s use it to debate anyway.”  
  - **Students Spoil Conditions:**  
    - **Solution:** Envelopes prevent leaks. If someone blurts, say: “Focus on your unbiased response—real data is messy!”  
  - **Time Shortfalls:**  
    - Skip optional response Q3 or streamline voting (e.g., show of hands for the test phase).  
  - **Unreliable Proposals in Testing Phase:**  
    - Have a backup test ready (e.g., the attitude manipulation).  
  - **What a Single Seminar Cannot Reproduce:**  
    - **Statistical Power:** With N=22, we can’t prove the effect’s robustness. *Supply by hand:* Reference Knobe’s original data (82% vs. 23%) and stress that philosophy engages empirical patterns, not just one study.  

  **Total Word Count:** 990 (vignettes: 168 words; plan: 822 words).  
  **Materials Needed:** Envelopes, pre-printed vignettes/response slips, whiteboard, markers.
