  We are designing a seminar activity to demonstrate the side-effect asymmetry (Knobe effect) without using published vignettes that students may have encountered. We'll create a fresh matched pair of vignettes (and possibly a third condition) set in a neutral context. The key is to manipulate the valence (good vs. bad) of the side effect while holding constant:
     - The agent's foresight of the side effect (both foreseen and not intended as part of the main goal).
     - The stated probability of the side effect (same level of certainty).
     - The agent's skill (same level of competence).
     - The side effect's status as a side effect (not a means to the goal).
     - The agent's avowed attitude (neutral or none stated, to avoid biasing).

  What may differ: the valence (good vs. bad) of the side effect.

  We'll have three conditions to test the asymmetry and perhaps a neutral baseline:
    Condition 1: Harm condition (bad side effect)
    Condition 2: Help condition (good side effect)
    Condition 3: Neutral condition (optional, but might help in discussion)

  However, the classic asymmetry is between harm and help. The neutral condition might not be necessary and could dilute the effect. Given time and the small sample (n=22), we might stick to two conditions. But let's design three and then decide.

  Vignettes must be:
    - Set in a neutral, everyday context (avoiding corporate, environmental, or profit settings).
    - Short (under 90 seconds to read).
    - Matched except for the valence of the side effect.

  Response sheet: We want more than yes/no. We can ask:
    - Whether the side effect was intentional (yes/no) - primary question.
    - A rating scale (e.g., 1-7) for how intentional it was? But that might be too much. Alternatively, we can ask for a confidence rating in their yes/no, or ask for a brief reason. However, we want it to take under a minute.

  Alternatively, we can ask:
    Q1: Do you think [agent] brought about [side effect] intentionally? (Yes/No)
    Q2: How confident are you in your answer? (1: Not at all confident, 5: Very confident)
