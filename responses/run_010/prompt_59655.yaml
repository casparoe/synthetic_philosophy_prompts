  Let's design the vignettes first.

  Vignette 1 (Harm condition):

    Alex is a talented gardener who has been hired to design a small flower garden for a community center. The center has a resident cat named Whiskers that often sleeps in the flower beds. Alex knows that if they plant a particular type of flower (Lilies), which will make the garden look beautiful and meet the center's request, it will also cause Whiskers to develop an allergic reaction and become uncomfortable. Alex doesn't care about Whiskers either way. Alex plants the Lilies. The garden is beautiful. As expected, Whiskers develops an allergic reaction and becomes uncomfortable.

