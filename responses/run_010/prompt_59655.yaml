  Alternatively, we can use phones only as screens? But the department's polling software is unreliable, so we can use a simple Google Form (if allowed) or just paper.

  Given constraints, paper is better. We'll have three sets of slips (one for each condition). We'll shuffle and hand out. We'll instruct students not to reveal their scenario to others until the end.

  Tally procedure: We'll have students write their condition letter (A, B, C) and their yes/no on a separate slip and collect. Then we tally on the board by condition.

