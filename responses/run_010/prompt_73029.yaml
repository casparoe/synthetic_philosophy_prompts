  The user's explicit request is a two-page max procedure for writers, but the deeper needs include preserving credibility with readers and partner organizations (like state legislatures), avoiding legal challenges from rated subjects, and resolving internal philosophical divides among writers about whether future claims have truth value yet.

  Hmm... the three test cases are crucial stress tests: 
  1) The premature "Inaccurate" rating on the tax claim shows urgency in handling open-window claims 
  2) The stuck "Unverifiable" referendum item reveals how conditional claims create dead ends 
  3) The recession forecast exposes definitional ambiguity.

  Key tensions to address:
  - Philosophical (can future claims be true/false now?) vs practical (what readers expect)
  - Preserving board-mandated verdicts while making "Unverifiable" less misleading
  - Writers' time constraints (20 mins/item!) against thoroughness

  I'll structure the procedure around claim anatomy rather than truth-value debates. Forced mechanical steps (like checking dates) can sidestep metaphysics. The "interim placeholder" concept might bridge the Unverifiable problem by changing the output wording while keeping the verdict label.

  For the test cases: 
  - Case 1 needs to flag the rating as premature and require recheck at window close 
  - Case 2 should resolve as "Unverifiable" but with clearer explanatory language 
  - Case 3 demands operationalizing the claim's definition upfront

  Biggest risk: if writers interpret the procedure as endorsing one philosophical camp. Need to explicitly state in the preamble that the workflow is agnostic - the "truth value exists but unknown" vs "no fact yet" debate doesn't affect the mechanical steps. The user was wrong to say it doesn't matter; it affects how writers explain ratings, but the procedure can neutralize it through rigid criteria.

  The desk shouldn't be closed - their legislative partners rely on the tracker. But they'll eat credibility costs if they keep rating open-window claims definitively. The placeholder system is the compromise.
answer: |-
  ## Forward-Looking Claim Assessment Procedure (v1.0)

  **Preamble:** This procedure determines whether a forward-looking claim (promise, forecast, projection) can be rated NOW using our board-mandated verdicts (Accurate, Broadly Accurate, Inaccurate, Unverifiable). Its goal is to avoid premature judgments on open-window claims and clarify "Unverifiable" usage. **Philosophical Note:** The procedure does NOT assume a future claim is *already* true/false but unknowable *or* that no fact exists yet. It focuses solely on *what we can assess now* based on available evidence and the claim's structure. This neutrality avoids favoring either writer camp.

  **Required Input Per Item:** The exact quote, speaker, date made, context (e.g., speech, report), and defined outcome/timeframe if stated.

  **Procedure:**

  1.  **Define the Claim's Core Elements (5 mins):**
      *   *Question:* What is the *specific outcome* predicted/promised? What is the *deadline* or *time window*? Is it *conditional* (e.g., "If X, then Y")?
      *   *Sufficient Answer:* Pinpoint the exact event, metric, or state change, and the specific date or period (e.g., "Unemployment below 5% by Q4 2024", "Bridge opens by Dec 31, 2025"). Identify any clear conditions.
      *   *Termination:* If no specific outcome or timeframe can be identified, **VERDICT: Unverifiable** (Analysis must state: "The claim lacks a specific, measurable outcome or timeframe, making future verification impossible."). Stop.
      *   *Judgment Call:* Interpreting vagueness ("soon," "significant improvement"). If outcome/timeframe is ambiguous *despite context*, **VERDICT: Unverifiable** (Analysis: "The claim's vagueness regarding [specific ambiguity] prevents definitive future verification."). Stop.

  2.  **Check Deadline/Window Status (1 min):**
      *   *Question:* Has the deadline passed or the time window closed?
      *   *Sufficient Answer:* Compare current date to claim's deadline/window end.
      *   *Termination (Closed Window):** Proceed to Step 4.
      *   *Termination (Open Window):** Proceed to Step 3.

  3.  **Assess Open-Window Claims (10 mins):**
      *   *Question A (Probability):* Does the claim use explicit probability language (e.g., "60% chance," "likely," "probable")? *If YES, see **Probabilistic Claim Protocol** below.*
      *   *Question B (Evidence Basis):* What evidence existed *at the time the claim was made* supporting the predicted outcome? Is this evidence *still valid*? Has *new, decisive evidence emerged* proving the outcome impossible?
      *   *Sufficient Answer:*
          *   For Probability: See Protocol.
          *   For Evidence: Identify reports, data, expert consensus, or methodologies cited/available then. Note significant, uncontested subsequent events disproving core assumptions (e.g., promised funding law failed, major war erupted affecting key forecast variable).
      *   *Termination:*
          *   If explicit probability used: Apply **Probabilistic Claim Protocol**.
          *   If decisive evidence *proves outcome impossible* (e.g., law failed, meteor hit critical factory): **VERDICT: Inaccurate** (Analysis must detail the disproving evidence and its decisiveness). Stop.
          *   Otherwise: **PUBLISH INTERIM PLACEHOLDER.** Set **Mandatory Recheck Date** = Deadline/Window End Date. Use **VERDICT: Unverifiable** BUT Analysis MUST state: "The outcome cannot be assessed until [Deadline/Window End]. We will re-evaluate then. Available evidence at the time suggested [Brief summary of then-available evidence basis, if any]." Stop.

  4.  **Assess Closed-Window Claims (4 mins):**
      *   *Question:* Did the *specific outcome* occur by the *deadline*?
      *   *Sufficient Answer:* Compare verified outcome data to the claim's specifics. Did it happen? Fully? On time?
      *   *Termination:*
          *   Yes, fully & on time: **VERDICT: Accurate**. Stop.
          *   Mostly yes, minor discrepancy: **VERDICT: Broadly Accurate** (Analysis must note discrepancy). Stop.
          *   No, not achieved: **VERDICT: Inaccurate** (Analysis must state how outcome differed). Stop.
          *   Outcome occurred partially/late/in different form: **VERDICT: Inaccurate** (Analysis must detail the specific shortfall - partial, late, or materially different form). *See **Partial/Late/Different Outcome Note**.*
          *   Outcome data unavailable/contested: **VERDICT: Unverifiable** (Analysis must state the specific data gap/contention). Stop.
      *   *Judgment Call:* Defining "mostly" for Broadly Accurate, "materially different," or resolving contested data without clear authority. **Handoff Trigger:** If judgment on these points is complex or controversial, **STOP & HAND OFF TO STANDARDS EDITOR**.

  **Probabilistic Claim Protocol:**
  *   *Question:* Is the probability *quantified* (e.g., "70% chance")? If yes, what was the basis? Is it *qualitative* (e.g., "likely")?
  *   *Sufficient Answer:* Identify quantification or standard interpretation of qualitative term (e.g., IMF defines "likely" as >66% probability).
  *   *Termination:*
      *   Quantified & Basis Sound: **VERDICT: Unverifiable** BUT Analysis MUST state: "Probabilistic claims about the future cannot be rated true/false until the outcome occurs. The [Speaker] assigned a [%] probability based on [basis]." Set **Recheck Date** = Deadline. *Do not judge probability accuracy now.*
      *   Quantified & Basis Flawed/Dishonest: **VERDICT: Inaccurate** (Analysis must detail flaw/dishonesty in probability *assignment*, e.g., "Used flawed model ignoring key data"). *Rates the assignment, not the outcome.*
      *   Qualitative: **PUBLISH INTERIM PLACEHOLDER.** Set **Mandatory Recheck Date** = Deadline. Use **VERDICT: Unverifiable** BUT Analysis MUST state: "Claims about the likelihood of future events cannot be rated true/false until the outcome occurs. The term '[qualitative term]' was used based on [basis, if any]. We will evaluate the outcome by [Deadline]." Stop.

  **Partial/Late/Different Outcome Note:** Closed-window claims are rated based *only* on the specific outcome and deadline stated. "Partially" or "later" constitutes non-fulfillment. A "materially different form" means the core substance of what was promised/projected did not occur as described.

  **Promise vs. Forecast:** Treat them the *same* for rating purposes (using the procedure above). The *analysis text* should distinguish them for readers (e.g., "The Mayor *promised*..." vs. "The economist *forecast*...").

  **Rating Revision:**
  *   **Only** permitted if:
      1.  New, decisive, verifiable evidence emerges proving the original rating categorically wrong *and* the claim's window is still open OR the recheck date hasn't passed; OR
      2.  A factual error is found in the original assessment (e.g., misstated deadline, outcome data was later corrected).
  *   **Who:** Original writer + Editor review. Significant revisions require Standards Editor approval.
  *   **Cost:** Public correction notice appended to the original item, explanation in analysis, potential credibility cost if frequent. Revisions are expensive – prioritize getting it right first time using this procedure.

  **What the Procedure CANNOT Settle (Requires Handoff):**
  1.  Defining ambiguous terms central to the claim (e.g., "recession" when multiple definitions exist) - Editor sets house definition.
  2.  Resolving deep disputes over data validity or methodology.
  3.  Judging "materially different form" or "mostly" without clear criteria.
  4.  Handling novel claim structures not covered here.

  ---

  **Application to Live Items:**

  1.  **Senator's Tax Package (Open Window):**
      *   Step 1: Outcome = "Pay for itself" (specific metric needed! e.g., revenue = cost). Deadline = "Within three years" (window open).
      *   Step 3: Claim is not explicitly probabilistic. Revenue tracking low *now* does **not** prove future impossibility. **Original "Inaccurate" Verdict Premature & Wrong.** Required an **Interim Placeholder** (Unverifiable verdict + analysis explaining recheck at 3-year mark). **Reopening Cost:** Change verdict to Interim Placeholder, publish correction notice explaining premature rating. Minor credibility hit now; larger hit avoided if revenue rebounds by year 3.

  2.  **Mayor's Property Tax Promise (Conditional, Failed):**
      *   Step 1: Outcome = Property taxes fall within a year. **Condition:** If referendum passes. Deadline implied: One year after potential passage.
      *   Step 2: Condition (referendum) failed. The outcome *never had a possibility of occurring*.
      *   **Termination:** Condition not met. **VERDICT: Unverifiable** is *technically correct* BUT **Analysis Must State:** "The claim was contingent on the referendum passing. Since the referendum failed, the promised tax cut was never possible, and therefore cannot be verified as it pertained to an unrealized scenario." **Action:** Update analysis text immediately. No recheck needed.

  3.  **Economist's Recession Forecast:**
      *   Step 1: Outcome = "Metro area in recession". Deadline = "End of next year" (assume passed/window closed).
      *   Step 4: Outcome data contested – two standard definitions disagree. **Handoff Trigger:** Defining the outcome term ("recession") is not a factual lookup but an editorial policy choice. **STOP & HAND OFF TO STANDARDS EDITOR.** Editor must decide: a) Use the partner newsroom's definition (for consistency with their reliance), b) Use the editor's preferred definition (requires explaining discrepancy), c) Rule it Unverifiable due to unresolvable definition conflict (least desirable).

  ---

  **Premise Check:** The premise is *not* confused. Rating forward-looking claims is possible *if* focused on specific, testable assertions and clear about temporal limitations. The core challenge is resisting premature judgment on open windows and clarifying "Unverifiable." This procedure provides a viable workflow, emphasizing interim placeholders and rechecks. Closing the desk is unnecessary. **You were partially wrong:** The philosophical divide *does* impact work if it leads writers to prematurely label open-window claims as Accurate/Inaccurate (thinking truth-value exists now) or to overuse Unverifiable without explanation (thinking no fact can exist). The procedure forces agnosticism through its steps, making the philosophical stance irrelevant to the output.
