answer: |-
  A world without lies was created when an opportunist lied to the Compliance Engine. The deontologist sighed approvingly. "Finally, perfect honesty!"  
  "Then why," asked his friend, "did you refuse to flip that switch? You adore this outcome!"  
  "Because *I* would have lied to create it," the deontologist replied.  
  "But what about all the lies *prevented* by your potential lie? Who owns *those*?"  
  The deontologist smiled. "Not my lies, not my problem. That’s the opportunist’s circus. I just enjoy the clean cages."

  *(Punchline exploits the deontologist's disavowal of causal responsibility for outcomes they enable by inaction, while readily enjoying benefits wrought by another's identical violation.)*
