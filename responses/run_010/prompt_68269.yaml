prompt: |-
  I'm writing a novel and I've got an evolutionary biologist reading for accuracy — she's been ruthless about one word in partcular, which behaviors actually count as cooperation and which ones don't. So far: vampire bats sharing blood with unrelated roost-mates, yes. Cleaner fish picking parasites off bigger fish, yes, and she made a point of noting the client can swim off if the cleaner takes a bite of mucus instead. Ants herding aphids for honeydew, no — she called it farming. Mycorrhizal fungi trading phosphate for tree sugar, no. Birds and meerkats where the helpers are last season's offspring, no, that's just nepotism. Chimp hunts where the meat goes disproportionately to whoever groomed the hunter, yes. Hunter-gatherer camp meat sharing, yes.

  Now the species I invented: when a forager comes back empty, other members of the band feed it, at real cost to themselves and mostly to non-relatives. A forager who got turned down last time can and does turn down that specific individual in return. Nobody else gets involved — no ganging up on freeloaders, no punishment beyond refusal. And the food doesn't have to come back from the person you fed; anyone in the band might feed you later. I've deliberately left it undecided whether they remember individuals or whether the refusal is just a vaguer gut reaction to a familiar scent.

  So: will she call it cooperation? More usefully, what are all the rules that fit her seven earlier verdicts, what does each one say about my creatures, which would you bet on and why, and what further case would settle it — because I have to decide how smart these things are before chapter four.
reasoning: |-
  Okay, let me tackle this user's problem. They're writing a novel and need to ensure their fictional species' behavior is scientifically accurate according to their evolutionary biologist consultant. The biologist has strict criteria for what counts as cooperation, and the user wants to know if their invented behavior qualifies.

  First, I need to parse the biologist's existing verdicts. Vampire bats sharing blood and cleaner fish mutualism are clear cooperation. Ants farming aphids and mycorrhizal fungi trading are symbiosis but not cooperation. Nepotism in birds/meerkats is excluded, while chimp grooming-for-meat and hunter-gatherer sharing count. 

  The user's species: individuals feed unsuccessful foragers, even non-relatives, at personal cost. Refusals are direct and reciprocal but not enforced by the group. Memory might be individual or scent-based. 

  Key evolutionary biology concepts here: reciprocal altruism requires direct reciprocation with memory, while indirect reciprocity relies on reputation. The biologist excluded symbiosis and kin altruism. 

  For the user's case, the lack of direct exchange (A feeds B, B feeds A) and absence of reputation/punishment puts it in a gray zone. If refusal is individual-specific, it leans toward direct reciprocity. If scent-based, it's more like mutualism. 

  The biologist would likely require evidence of calculated exchange. To settle it, the user could add a scenario testing memory: if individual recognition affects refusal, it's cooperation; if not, it's mutualism. 

  I should advise the user to clarify the memory aspect for chapter four, as it defines the intelligence needed. Suggesting a test case (e.g., scent disguise) could help decide.
answer: |-
  Based on your biologist's criteria and your description, **your invented species' behavior *does* qualify as cooperation, specifically a form of *Direct Reciprocity*.** Here's the breakdown:

  1.  **Your Biologist's Rules (Deciphered):**
      *   **Cooperation YES:** Involves **reciprocity** between unrelated individuals where there's a **cost** to the giver and a **benefit** to the receiver *at the time of the act*. The potential for *cheating* exists and is *managed* (e.g., client fish swimming away, chimps withholding meat from non-groomers, hunter-gatherer sharing likely involving reputation/pressure).
      *   **Cooperation NO (Why?):**
          *   **Ants/Aphids & Fungi/Trees:** These are **Mutualism or Symbiosis**. The relationship is *obligate* or *tightly co-evolved*, often involving physiological adaptations. The "cost" is baked into the system, and immediate, individual-level cheating detection/response isn't the primary mechanism (though it can exist).
          *   **Helper Birds/Meerkats:** **Kin Selection/Nepotism.** The primary driver is helping relatives, passing on shared genes. Reciprocity might occur but isn't *necessary* for the behavior to evolve.
      *   **The Core Principle:** She requires evidence of a *reciprocal exchange mechanism* between *non-kin* that *mitigates the cost* and *deters cheating*.

  2.  **Analyzing Your Species:**
      *   **Cost/Benefit:** ✅ Clear cost (giving up food) and benefit (receiving food when needed).
      *   **Non-Kin:** ✅ You specify "mostly to non-relatives". Kin selection might play a role, but non-kin participation is essential for it to fit her criteria.
      *   **Reciprocity:** ✅ **This is the key.** Individuals feed others who are currently unsuccessful. Crucially, an individual *refuses to feed someone who refused them previously*. This is **direct, pairwise reciprocity**: "You didn't help me when I was down, so I won't help you now that you're down." It's a *contingent* strategy ("Tit-for-Tat" like).
      *   **Cheating Deterrence:** ✅ The refusal *is* the punishment. It directly targets the cheater (the one who refused help earlier) by denying them help now. No group enforcement is needed; the reciprocity system *is* the enforcement. The risk of future denial deters refusing to help in the first place.
      *   **Indirect Reciprocity?** Probably not, based on your description. For indirect reciprocity ("I help you, so others see I'm helpful and help me later"), reputation within the group is key. You say "Nobody else gets involved" and refusal is only by the *individual* who was previously refused. The benefit doesn't inherently come back via reputation influencing *others*; it comes back via direct payback from the *same individual* (or the avoidance of cost by refusing a cheater). Food coming from *anyone* later doesn't contradict direct reciprocity; it just means the system isn't purely pairwise accounting, but the *refusal rule* is strictly pairwise.

  3.  **Will She Call It Cooperation?**
      **Yes, very likely.** It ticks all her boxes:
      *   Non-kin (mostly).
      *   Clear cost/benefit per act.
      *   Reciprocal mechanism (direct payback: feeding contingent on having been fed).
      *   Cheating deterrence (refusal to help cheaters).

  4.  **The Memory/Scent Ambiguity:**
      This is fascinating and well-designed. **Both interpretations fit cooperation:**
      *   **Individual Recognition (Smarter):** This implies cognitive tracking: "I remember *you*, Steve, refused me last Tuesday." This is classic Tit-for-Tat cognition.
      *   **Scent-Based Association (Less Smart):** "This scent is associated with the negative experience of being refused when I was hungry." This could be a simpler associative learning mechanism, still enabling contingent reciprocity without complex individual identity tracking. It's still cooperation via direct reciprocity; the mechanism is just more basic.
      *   **Why Both Work:** The *function* is the same – contingent reciprocity deters cheating. The *mechanism* (cognitive vs. associative) is different, but the evolutionary outcome (cooperation) is identical. Your biologist should accept either as cooperation.

  5.  **What Would Settle the Mechanism?**
      To distinguish individual recognition from scent-based association, you'd need a **"Scent Swap" or "Masking" Test**:
      *   **Scenario:** Individual A refuses Individual B when B is unsuccessful. Later, B is successful, and A is unsuccessful. BUT, before B encounters A, you experimentally transfer A's scent onto Individual C (or mask A's scent).
      *   **Prediction:**
          *   **If Individual Recognition:** B should still refuse to feed A, regardless of scent, because B recognizes A's physical appearance/identity.
          *   **If Scent-Based Association:** B might feed A if A's scent is masked, or refuse C if C has A's scent. The refusal is tied to the *scent signature* associated with the negative event, not the specific individual.

  6.  **Recommendation & Why:**
      *   **Bet:** I'd bet she calls it **cooperation (Direct Reciprocity)**.
      *   **Why:** It perfectly mirrors the chimp grooming/meat-sharing example she approved. There, chimps remember who groomed them and share meat *with those specific individuals*. Here, they remember (or associate scent with) who *refused* them and refuse *those specific individuals* in return. It's the reciprocal contingency she clearly values.
      *   **For Your Novel (Chapter 4 Decision):** You have flexibility:
          *   **Smarter (Individual Recognition):** Allows for more complex social dynamics, potential grudges, alliances, even reconciliation later. Suggests higher cognitive load and memory.
          *   **Simpler (Scent Association):** Makes them more instinct-driven, perhaps less consciously "calculating". Could lead to interesting errors (refusing the wrong individual due to scent transfer after a fight, failing to refuse if scent is masked). Emphasizes primal senses.
      *   **Choosing:** Decide based on the *tone* and *themes* of your novel. Do you want more calculated social politics, or more instinctual, visceral reactions? Both are valid biologically. The scent-based version is slightly more unique and might fit a less human-like intelligence well.

  **In Summary:** Your biologist's pattern demands non-kin reciprocity with cheating control. Your species has exactly that through direct, pairwise "Refusal Tit-for-Tat". It's cooperation. The memory/scent question determines cognitive complexity, not whether it's cooperation. The "Scent Swap Test" would settle the mechanism. For your novel, choose the intelligence level (recognition vs. association) that best serves your story – both are biologically plausible for cooperation.
