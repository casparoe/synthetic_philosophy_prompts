prompt: |-
  I'm a junior double-majoring in philosophy and public policy, and I'm in a Hegel seminar this semester — we hit the Lordship and Bondage section of the Phenomenology in two weeks and I've read it like four times and I still only sort of get it. The reason I care isn't the seminar though. For the last two years I've been a peer mediator at my university's conflict resolution office: three of us, one-off 50-minute sessions, roughly twenty cases a semester, almost all undergrads — roommates, capstone group blowups, student-org leadership fights. Our training is entirely interests-versus-positions and paraphrasing back what you heard and helping people find a compromise, and it works fine on who buys the paper towels. But there's a whole class of case where it does literally nothing, where both people already know what the other wants, the compromise is obvious, and they still can't take it because of something about standing. I think that something is what the master–slave section is actually about, and I want to build a tool out of it.

  So: take the argument of that section — not the pop version where two people fight to the death and one wins — and turn it into a procedure a mediator could actually run in a room with two angry 20-year-olds. I want the questions to ask in order, what a sufficient answer to each looks like, how to tell which structural position each party is occupying (including the one who says she genuinely doesn't care what the other thinks of her and just wants the deliverable, and the one who has quietly ended up holding all the practical knowledge of the thing everyone is fighting over), where the procedure terminates in a workable agreement, and where it has to stop and hand the case up to our staff coordinator because what's in front of you isn't a recognition problem at all. Be explicit about what from Hegel has to survive the translation and what can be dropped without the procedure turning into mush — the life-and-death struggle, the thing as an independent object, work as desire held in check, the reversal, the fact that recognition from someone you don't recognize is worthless to the recognizer. No exegesis for its own sake and please don't quote translations at me; I need the concepts doing work, and I need the version a non-philosophy mediator could use without reading the book.

  Then run it on three cases. (1) Two roommates: one says she does all the emotional labor of the household and is invisible for it, the other says he doesn't need her approval, he just wants quiet after eleven. (2) A four-person capstone group where the member everyone treats as the least competent is the only one who actually understands the codebase, and the other three are now asking us to help them "restructure the team." (3) A student-org fight where the outgoing president keeps calling the new president "the transition team" in emails to the whole membership and refuses to say it's a big deal. At least one of these should come out with a verdict I won't like — my suspicion is that on one of them the honest output is do not mediate this, and I want to know which and why. Also tell me straight where the procedure will misfire: what it systematically misdiagnoses (especially the cases where it will re-describe something abusive or purely administrative as a recognition standoff), what it can't do at all, and which steps are judgment calls wearing a procedure costume.

  Format: give the procedure itself as a numbered flow in prose, then finish with a JSON object so I can put it in a spreadsheet for our training binder. Schema: "steps" = array of objects with fields "n", "ask" (the question verbatim as I'd say it), "sufficient_answer", "insufficient_answer", "hegel_concept" (which piece of the dialectic this step is operationalizing), "escalate_to_coordinator_if"; "cases" = array of objects with "case_id", "position_A", "position_B", "diagnosis", "verdict", "mediate" (true/false), "unwelcome_to_asker" (true/false), "reason_if_not_mediate"; "limits" = array of objects with "failure_mode", "how_it_misfires", "partial_fix"; and "translation_choices" = array of objects with "kept_or_dropped", "concept", "why_it_had_to_go_that_way".
reasoning: |-
  We are building a mediation procedure based on Hegel's master-slave dialectic, specifically the recognition struggle. The goal is to help mediators identify when a conflict is rooted in a need for recognition (or misrecognition) and to structure a conversation that addresses it. We'll avoid exegesis and focus on practical application.

  Key concepts to retain from Hegel:
  1. **The struggle for recognition**: The core idea that humans desire to be recognized as autonomous, self-conscious beings by others. Without recognition, we feel diminished.
  2. **Life-and-death struggle as abstraction**: We don't take this literally. Instead, we see it as a metaphor for high-stakes conflicts where parties risk their self-worth.
  3. **Master and slave positions**: After the struggle, one party becomes the "master" (who gets recognition but is dependent on the slave for it) and the other the "slave" (who is denied recognition but gains independence through work and knowledge). The positions are unstable and can reverse.
  4. **Work as formative**: The slave, through working on the world, develops skills and self-consciousness, while the master becomes dependent and stagnant.
  5. **Recognition must be mutual**: Recognition from someone you do not recognize is worthless. True resolution requires mutual recognition.

  Concepts we can drop without losing the core:
  - The literal fight to the death: We replace it with a metaphorical standoff where parties are entrenched in their positions.
  - The thing as an independent object: We focus on the relational dynamic, not the object of contention.
  - Some nuances of the reversal: We'll simplify to the idea that positions can shift and that the "slave" often holds hidden power.

  Procedure Goals:
  - Identify if the conflict is about recognition (desire for acknowledgment, respect, autonomy) versus mere interests (compromisable wants).
  - Map the parties into master/slave positions (without using those terms in the room).
  - Help parties see the hidden dependencies and the value of mutual recognition.
  - Terminate if the conflict is not about recognition (e.g., abuse, clear power imbalance, administrative issue) or if one party is not engaging in good faith.

  Procedure Steps:

  1. **Establish the Stalemate**  
     Ask: "You both seem to know what the other wants and what a fair compromise would be, but you haven't been able to take that step. What's the real obstacle?"  
     Sufficient Answer: Articulates a feeling of being disrespected, unseen, or that accepting the compromise would mean losing face or self-worth.  
     Insufficient Answer: Reiterates the surface issue or blames the other without emotional content.  
     Hegel Concept: The life-and-death struggle (metaphorical standoff where the stakes are identity).  
     Escalate if: The parties describe abuse, threats, or if the obstacle is purely logistical (e.g., "We just need the landlord to fix the sink").

  2. **Map the Recognition Dependencies**  
     Ask: "If the other person were to give you exactly what you want, how would that make you feel about yourself? What part of your self-worth is tied up in this?"  
     Sufficient Answer: Describes a need for validation, respect, or fear of being seen as weak/inferior.  
     Insufficient Answer: Focuses on practical outcomes only (e.g., "I'd just be glad the noise stops").  
     Hegel Concept: Desire for recognition as a self-conscious being.  
     Escalate if: One party denies any emotional stake (might indicate bad faith or a non-recognition issue).

  3. **Identify the Work/Knowledge Holder**  
     Ask: "Regardless of who's 'winning' the argument, who actually does the work or holds the knowledge that keeps this [project/household/org] running?"  
     Sufficient Answer: Parties acknowledge (even grudgingly) who has practical control or expertise.  
     Insufficient Answer: Denial of interdependence or claims of total independence.  
     Hegel Concept: Work as formative (the slave's hidden power through labor).  
     Escalate if: The work is irrelevant to the conflict (e.g., a pure status dispute with no practical basis).

  4. **Expose the Master's Dependency**  
     Ask (to the party who seems to be in the dominant position): "How much does your position depend on the other person's cooperation or acknowledgment?"  
     Sufficient Answer: Admits some level of reliance (e.g., "I need them to respect my authority" or "Without them, I'd have to do everything myself").  
     Insufficient Answer: Claims complete independence.  
     Hegel Concept: The master's dependence on the slave for recognition.  
     Escalate if: The dominant party is in a position of institutional power that isn't reliant on the other (e.g., a professor-student conflict).

  5. **Highlight the Slave's Autonomy**  
     Ask (to the party who seems to be in the subordinate position): "What parts of this situation do you control, even if it's not officially recognized?"  
     Sufficient Answer: Identifies areas of unacknowledged competence or influence.  
     Insufficient Answer: Expresses complete helplessness.  
     Hegel Concept: The slave's development of self-consciousness through work.  
     Escalate if: The subordinate party is in actual danger or is being abused (then it's not a recognition issue).

  6. **Test for Mutual Recognition**  
     Ask: "What would it take for you to see the other as a legitimate partner in this, rather than an obstacle?"  
     Sufficient Answer: Describes a step toward mutual respect, even if conditional (e.g., "If they admit my contribution, I could trust them").  
     Insufficient Answer: Refusal to engage or demands for total surrender.  
     Hegel Concept: Recognition must be mutual.  
     Escalate if: One party refuses to recognize the other under any circumstances (stalemate).

  7. **Reframe the Compromise as Mutual Recognition**  
     Ask: "How could the practical compromise you both see also become an opportunity to acknowledge each other's role and worth?"  
     Sufficient Answer: Integrates practical agreement with symbolic recognition (e.g., "We split chores, and we each say what we appreciate about the other's contribution").  
     Insufficient Answer: Sticks to the practical only.  
     Hegel Concept: The reversal (mutual recognition as the resolution).  
     Escalate if: The parties cannot conceive of a compromise that includes mutual acknowledgment (may need higher-level intervention).

  Termination Points:
  - Mediate: If steps 1-6 reveal a recognition struggle and step 7 yields a joint plan.
  - Do Not Mediate: If at any step the escalation condition is met (abuse, bad faith, institutional power imbalance, or no recognition stake).

  Now, apply to cases:

  **Case 1: Roommates**  
  - A: Does emotional labor, feels invisible.  
  - B: Wants quiet after 11, claims not to need approval.  
  - Diagnosis: A is in the slave position (doing unrecognized work). B is in the master position (denying need for recognition but dependent on A's labor for household harmony).  
  - Verdict: Mediate.  
  - Steps:  
    1. Stalemate: Obvious compromise (A does less emotional labor, B respects quiet hours) but obstacle is A's need for recognition and B's fear of losing independence.  
    2. B's self-worth: He ties his self-worth to not needing approval.  
    3. Work holder: A holds the emotional labor.  
    4. B's dependency: B depends on A to maintain the household.  
    5. A's autonomy: A controls the emotional climate.  
    6. Mutual recognition: B must acknowledge A's work; A must acknowledge B's autonomy.  
    7. Reframe: Quiet hours + scheduled appreciation for household contributions.  
  - Unwelcome to asker? The verdict is welcome. Mediate: true.

  **Case 2: Capstone Group**  
  - A: The member treated as least competent but only one who understands the codebase (slave position).  
  - B: The other three, wanting to "restructure" (master position).  
  - Diagnosis: Recognition struggle — B denies A's competence; A's knowledge gives hidden power.  
  - Verdict: Mediate.  
  - Steps:  
    1. Stalemate: Obvious to keep A on code, but B can't accept because it would admit misjudgment.  
    2. B's self-worth: Tied to being the competent leaders.  
    3. Work holder: A has the code knowledge.  
    4. B's dependency: B cannot complete the project without A.  
    5. A's autonomy: A could walk and sink the project.  
    6. Mutual recognition: B must acknowledge A's expertise; A must acknowledge B's roles.  
    7. Reframe: Restructure to put A in charge of code, with public acknowledgment.  
  - Unwelcome to asker? Might be unwelcome to B if they don't want to admit error, but necessary. Mediate: true.

  **Case 3: Student Org**  
  - A: Outgoing president (calling new president "transition team").  
  - B: New president.  
  - Diagnosis: A is refusing to recognize B's new status (master clinging to power). B needs recognition from A to legitimize their role.  
  - Verdict: **Do not mediate** (escalate to coordinator).  
  - Why: This is an institutional power transition. A's refusal to use the correct title is a power play, and the conflict is about formal authority, not mutual recognition. The procedure misfires because:  
    - Step 1: The obstacle is A's unwillingness to relinquish control, but it's not about self-worth in the Hegelian sense; it's about institutional rules.  
    - Step 4: A's dependency is low because A is leaving.  
    - Step 6: A may refuse to recognize B at all, which is a violation of org bylaws.  
    - The core issue is administrative (handover of power) and may require authority intervention.  
  - Mediate: false. Reason: Institutional power imbalance; not a recognition struggle but a violation of norms. Unwelcome to asker? Yes, because the mediator might hope for a recognition fix, but it won't work.

  Limits of the Procedure:  
  - Failure Mode 1: Misdiagnosing abuse as a recognition struggle.  
    How it misfires: An abusive party might frame control as a need for recognition.  
    Partial Fix: Escalate if one party fears the other (Step 1 insufficient answer).  
  - Failure Mode 2: Overlooking administrative issues.  
    How it misfires: Trying to solve a policy violation with mutual recognition.  
    Partial Fix: Escalate if the obstacle is rules-based (Step 1).  
  - Failure Mode 3: Parties stuck in bad faith.  
    How it misfires: One party goes through the motions without engaging.  
    Partial Fix: Escalate if answers are insufficient in Steps 2 or 6.  
  - Judgment Calls:  
    - Step 3: Who is the work holder? (Requires mediator to assess.)  
    - Step 4 and 5: Assigning master/slave positions. (Look for who seeks recognition vs. who holds knowledge.)

  Translation Choices:  
  - Kept: Mutual recognition as the core. Why: Without it, the procedure loses its purpose.  
  - Dropped: Life-and-death struggle as literal. Why: It's metaphorical; the practical version is the stalemate.  
  - Kept: Work as formative. Why: It reveals the slave's hidden power.  
  - Dropped: The thing as an independent object. Why: The object (e.g., chores) is just the vehicle; the relationship is key.  
  - Kept: Recognition from someone you don't recognize is worthless. Why: It explains why mutual buy-in is essential.  
  - Dropped: Detailed reversal dynamics. Why: Too complex; we simplify to shifting positions.

  Now, the JSON as requested.
answer: |-
  ### Hegelian Recognition Mediation Procedure  
  Based on Hegel's master-slave dialectic, this procedure identifies conflicts rooted in **mutual recognition**—where parties are stuck because their self-worth depends on the other's acknowledgment. It operationalizes the dialectic by focusing on:  
  - **Recognition struggle** (desire for validation as an autonomous agent).  
  - **Work/knowledge asymmetry** (how practical control shifts power).  
  - **Mutual dependency** (the "master" needs the "slave's" cooperation; the "slave" holds unacknowledged power).  

  **What it addresses**: Stalemates where logical compromise exists but parties reject it due to feelings of invisibility, disrespect, or threatened autonomy.  
  **What it excludes**: Abuse, institutional power imbalances, purely logistical disputes, or bad-faith actors.  

  ---

  ### Procedural Flow  
  **Step 1: Identify the Recognition Stalemate**  
  - **Ask**: "You both seem to know what a fair compromise looks like, but it hasn’t happened. What’s the emotional cost of accepting that compromise right now?"  
  - **Sufficient Answer**: Mentions pride, dignity, feeling disrespected/invisible, or fear of "losing" (e.g., "I’d feel like a doormat," "They’d think they own me").  
  - **Insufficient Answer**: Focuses only on practical outcomes (e.g., "I just want the paper towels bought," "It’s about the deadline").  
  - **Hegel Concept**: Life-and-death struggle (translated as high-stakes identity conflict).  
  - **Escalate to Coordinator if**: Answers indicate abuse, threats, or pure logistics (e.g., "They hit me," "We need the RA to intervene").  

  **Step 2: Map Self-Worth Dependencies**  
  - **Ask**: "If the other person ignored your feelings completely but gave you exactly what you asked for, would that resolve this? Why or why not?"  
  - **Sufficient Answer**: Exposes emotional stakes (e.g., "No, because it’s about respect," "Yes, but only if they admit I was right").  
  - **Insufficient Answer**: Dismisses emotional stakes (e.g., "I don’t care what they think," "Just fix the problem").  
  - **Hegel Concept**: Recognition as a self-conscious being (desire for validation).  
  - **Escalate to Coordinator if**: One party denies *any* emotional stake (suggests non-recognition issue).  

  **Step 3: Identify the Knowledge/Work Holder**  
  - **Ask**: "Who here does the hands-on work or holds the critical knowledge that keeps this [project/household/org] running?"  
  - **Sufficient Answer**: Parties acknowledge (explicitly or implicitly) who has practical control (e.g., "They handle the code," "I clean everything").  
  - **Insufficient Answer**: Denies interdependence (e.g., "Anyone could do it," "I don’t need their help").  
  - **Hegel Concept**: Work as formative (the "slave" gains power through labor/knowledge).  
  - **Escalate to Coordinator if**: Work is irrelevant (e.g., conflict is purely about titles with no practical impact).  

  **Step 4: Challenge the Dominant Party’s Dependency**  
  - **Ask** (to the party who *appears* more dominant): "How does your position rely on the other person’s cooperation or acknowledgment?"  
  - **Sufficient Answer**: Admits dependence (e.g., "I need them to respect my authority," "Without them, I’d fail").  
  - **Insufficient Answer**: Claims total independence (e.g., "I don’t need them," "This is about principle").  
  - **Hegel Concept**: Master’s dependence on the slave.  
  - **Escalate to Coordinator if**: Dominant party has institutional power (e.g., professor/student).  

  **Step 5: Surface the Subordinate Party’s Autonomy**  
  - **Ask** (to the party who *appears* more subordinate): "What power do you have in this situation that might be overlooked?"  
  - **Sufficient Answer**: Identifies hidden leverage (e.g., "I could walk away," "They need my skills").  
  - **Insufficient Answer**: Claims helplessness (e.g., "I have no power," "They control everything").  
  - **Hegel Concept**: Slave’s development of self-consciousness.  
  - **Escalate to Coordinator if**: Subordinate party fears retaliation (indicates abuse).  

  **Step 6: Test Mutual Recognition Feasibility**  
  - **Ask**: "What’s one thing the other person could do to make you feel like an equal partner in this?"  
  - **Sufficient Answer**: Requests symbolic acknowledgment (e.g., "Admit my contribution," "Stop treating me as inferior").  
  - **Insufficient Answer**: Demands surrender (e.g., "They must apologize for everything," "I won’t settle").  
  - **Hegel Concept**: Recognition from someone you don’t recognize is worthless (mutuality is key).  
  - **Escalate to Coordinator if**: Either party refuses to offer *any* form of acknowledgment.  

  **Step 7: Reframe Compromise as Mutual Recognition**  
  - **Ask**: "How can the practical solution also include a way for both of you to acknowledge each other’s role?"  
  - **Sufficient Answer**: Integrates practical and symbolic elements (e.g., "We split tasks, and they thank me," "I lead the code, but credit them publicly").  
  - **Insufficient Answer**: Reverts to pure logistics (e.g., "Just assign tasks").  
  - **Hegel Concept**: Reversal (resolution through mutual recognition).  
  - **Escalate to Coordinator if**: Parties cannot link practical agreement to mutual acknowledgment.  

  **Termination Rules**:  
  - **Mediate**: If Steps 1–7 yield a joint plan with mutual recognition.  
  - **Do Not Mediate**: If escalation occurs at any step.  

  ---

  ### Case Analyses  
  **Case 1: Roommates**  
  - **Position A**: Does emotional labor, feels invisible (subordinate/"slave").  
  - **Position B**: Wants quiet, claims no need for approval (dominant/"master").  
  - **Diagnosis**: Recognition struggle. B depends on A’s labor for household harmony; A’s self-worth hinges on acknowledgment.  
  - **Verdict**: Mediate.  
  - **Mediate**: True.  
  - **Unwelcome to Asker**: False (resolution validates both).  
  - **Why**: Step 2 reveals B’s "no need for approval" is a defense mechanism ("independence" relies on A’s labor). Step 5 uncovers A’s power to withdraw emotional labor. Step 7 reframes quiet hours + scheduled appreciation exchanges.  

  **Case 2: Capstone Group**  
  - **Position A**: Treated as incompetent but holds code knowledge (subordinate/"slave").  
  - **Position B**: Three members seeking to "restructure" (dominant/"master").  
  - **Diagnosis**: Recognition struggle. B’s self-worth tied to perceived competence; A holds practical power through irreplaceable skills.  
  - **Verdict**: Mediate.  
  - **Mediate**: True.  
  - **Unwelcome to Asker**: True (B may resent admitting A’s expertise).  
  - **Why**: Step 3 confirms A is the knowledge holder. Step 4 exposes B’s dependency on A. Step 6 tests recognition ("A leads code; B credits publicly").  

  **Case 3: Student Org Leadership**  
  - **Position A**: Outgoing president (refuses to use title, calls B "transition team").  
  - **Position B**: New president (wants recognition).  
  - **Diagnosis**: **Not a recognition struggle**. A’s behavior is a power grab enforcing institutional hierarchy, not a bid for mutual recognition.  
  - **Verdict**: Do not mediate.  
  - **Mediate**: False.  
  - **Unwelcome to Asker**: True (mediator may want "fix" it, but it’s invalid).  
  - **Reason if Not Mediate**:  
    - Step 1: Obstacle is A’s refusal to follow bylaws (administrative), not emotional cost.  
    - Step 4: A has no dependency on B (A is leaving; recognition is irrelevant).  
    - Step 6: A will refuse to acknowledge B ("They haven’t earned it").  
    - **Escalate**: Coordinator must enforce org rules.  

  ---

  ### Limits of the Procedure  
  | Failure Mode          | How It Misfires                                  | Partial Fix |  
  |------------------------|--------------------------------------------------|-------------|  
  | Abuse disguised as recognition | Frames control as "need for respect" (e.g., emotional abuse). | Escalate at Step 2 if answers indicate fear/coercion. |  
  | Administrative disputes | Misreads policy violations (e.g., title misuse) as recognition struggles. | Escalate at Step 1 if obstacle is rules-based. |  
  | Bad-faith actors       | One party manipulates the process to "win" acknowledgment without reciprocity. | Escalate at Step 6 if demands are one-sided. |  
  | **Judgment Calls**: Assigning dominant/subordinate roles (Steps 4–5), interpreting "sufficient" emotional stakes (Step 2). |  

  ---

  ### Translation Choices  
  | Kept or Dropped | Concept                     | Why It Had to Go That Way |  
  |------------------|-----------------------------|---------------------------|  
  | Kept            | Mutual recognition          | Core mechanism; without it, the procedure collapses into interest-based bargaining. |  
  | Dropped         | Life-and-death struggle     | Literal violence is irrelevant; metaphorical standoff suffices. |  
  | Kept            | Work as formative           | Practical knowledge = power; essential to identify leverage points. |  
  | Dropped         | Thing as independent object | The object (e.g., chores) is a vehicle; the relationship is the focus. |  
  | Kept            | Recognition from someone you don’t recognize is worthless | Explains why mutual buy-in is non-negotiable. |  
  | Dropped         | Detailed reversal dynamics  | Overly complex; simplified to "hidden power shifts." |  

  ---

