prompt: |-
  I'm moderating a fireside conversation at a small workshop on judgment and forecasting — audience is mostly public-policy grad students plus a handful of people who do cost estimation for a living. My guest is a methodologist who runs an outside-view-first practice for cost and schedule estimates. Her position, as I understand it (tell me if I've caricatured any of this):

  - reference class first, and literally first. Her teams lock in the reference class and its outcome distribution in a sealed envelope before anyone reads the project-specific file, because she wants to seperate picking the class from reading the case — picking the class using inside information looks circular to her.
  - the base rate is a constraint, not a prior. The final number has to land inside the central 80% of the reference distribution unless the team can argue a causal difference from the class, and that argument itself has to be backed by data from other projects. The burden sits entirely on the deviation.
  - when people ask whether *this* one is different, her answer is basically that you can't know that in advance, and the pretense that you can is what blows up budgets. So epistemic modesty is doing structural work here, its not just a vibe.
  - she's in the Flyvbjerg lineage on megaprojects, but she pushes the method well past construction — R&D timelines, how long wars last, product launches.

  I don't want soft questions and I don't want her restating the planning fallacy at me. Write six questions, ordered so the difficulty ramps: open with something she'll field comfortably, close with one I suspect she can't get out of. For each one, name the pressure point you're actually targeting, give me the reply she's most likely to give, and then a follow-up that survives that specific reply — assume her first answer is the good one, not a strawman answer, she's sharp.

  Make sure these get covered, though I don't want the set to read like a checklist:

  - the sealed envelope. Locking the class before you know anything about the case seems to fix the circularity, but somebody still had to decide which class, and that decision appears to need exactly the information she's refusing to look at. Also nested classes: all wars, or all wars since 1945, or all wars since 1945 with comparable technology? The distributions differ enormously and she's barred from using case knowledge to choose among them.
  - the constraint reading. If the base rate is really a prior you update, then "outside view first" just means "don't neglect the prior," and the entire substance is the size of the adjustment, which is inside-view work. If it's a hard constraint instead, it can conflict with information that's about as good as information gets. Concretely: a project under a genuine fixed-price turnkey contract has close to no cost uncertainty. Does her protocol make her widen the interval anyway? If yes, the method is producing worse estimates on purpose. If no, she's letting case-specific information override the class, which is the one thing she forbids.
  - first-of-a-kind cases. The risk-versus-uncertainty line: base rates belong to situations that repeat, and forcing a genuine one-off into a distribution assembled from non-comparable cases may be false precision wearing modesty as a costume. Ask what makes reporting a wide interval more honest than saying the distribution doesn't apply here.
  - performativity. If her method becomes standard practice, the reference distribution changes, because part of what it records is overruns caused by people not using the method. Which distribution is she supposed to use once the method is widespread, and is a method whose success erodes its own evidence base a feature or a defect?
  - turn it on her. Her view is itself a claim about how to make estimates better, so what's the reference class for methodological interventions like hers, and what's the base rate for those actually improving outcomes in the wild? Debiasing training tends to wash out fast and forecasting-improvement methods have a graveyard. She can't exempt her own thesis from the outside view without special pleading.

  Then two things I want as much as the questions. First: tell me straight which of the six you think she has a real answer to, and what that answer is — I don't want to walk in believing I've got a knockout when I've got a nuisance. Second: say what would change your mind about the ranking. Which detail of her view, if I've described it wrong above, would flip your judgment about which question is the killer, and where do you think my framing is most likely to have smuggled in a strawman?
reasoning: |-
  Okay, let me tackle this query. The user is moderating a fireside chat with a methodologist who advocates an outside-view-first approach to cost estimation. They need six sharp questions that escalate in difficulty, targeting specific pressure points in her methodology. 

  First, I need to unpack the key tension points the user outlined: the sealed envelope protocol, the base rate as constraint vs prior, first-of-a-kind cases, performativity, and self-application of the outside view. Each question should surgically probe these while avoiding softballs.

  Starting with question sequencing - I'll open with the sealed envelope since it's foundational. The circularity concern is obvious: how can you choose a reference class without case knowledge? The follow-up needs to push on nested classes, forcing her to address the meta-selection problem. 

  Next, the constraint versus prior dilemma. If she insists base rates are rigid constraints, that creates absurd outcomes like widening intervals for fixed-price contracts. The follow-up must corner her on whether this makes estimates artificially worse. 

  For first-of-a-kind cases, I'll frame it as false precision. The follow-up should contrast wide intervals with outright rejecting comparability - if the class doesn't fit, isn't pretending otherwise dishonest?

  Performativity is subtle but crucial. If her method succeeds, it alters the very reference distributions it relies on. The follow-up needs to make her confront the self-eroding evidence base. 

  Saving the toughest for last: applying her own method to her claims. What's the base rate for estimation methods actually improving outcomes? If debiasing trainings often fail, why should hers work? The follow-up must block the "this time is different" escape route.

  Now for self-assessment: I suspect she has strong answers for sealed envelopes (it's about process discipline) and first-of-a-kind (all cases claim uniqueness). Performativity might be manageable if she uses pre-reform data. But the constraint dilemma and self-application seem genuinely hard - if she can't resolve the fixed-price paradox or her method's own track record, that's problematic.

  Biggest vulnerability in my framing? I might underestimate how she handles constraints. If she allows case data to override classes in extreme cases (like fixed-price contracts), that contradicts her "no inside info" rule. But if she doesn't, the method produces absurdly conservative estimates. That's the real trap.
answer: |-
  Here are six ordered questions targeting core tensions, designed to escalate in difficulty while respecting her position. Each includes the pressure point, her likely strong reply, and a follow-up that forces nuance without strawmanning.

  **Question 1: The Sealed Envelope Protocol (Opening Comfortably)**  
  *Pressure Point: Can reference classes be selected *objectively* without case knowledge?*  
  **Q:** "Your 'sealed envelope' step prevents contamination from case details. But *choosing* the reference class itself requires some understanding of the project domain. How do you guard against arbitrary or non-representative class selection *before* seeing the case?"  
  *Likely Reply:* "We use standardized taxonomies and meta-classes developed from decades of historical data (e.g., 'All NATO R&D projects >$500M'). Teams are trained on class selection using *only* high-level descriptors ('software development,' 'infrastructure') – never specifics. It’s about process discipline, not omniscience."  
  **Follow-Up:** "But taxonomies aren’t neutral. ‘All wars since 1945’ vs. ‘asymmetric wars post-Vietnam’ yield wildly different distributions. If class selection *itself* requires judgment, how do you prevent *that* decision from becoming a backdoor for inside-view bias?"  

  **Question 2: First-of-a-Kind Cases (Escalating Specificity)**  
  *Pressure Point: False precision in genuinely novel contexts.*  
  **Q:** "For truly novel initiatives (e.g., first commercial fusion plant), the reference class may include non-comparable projects. Why is reporting a wide interval based on a weak class more ‘honest’ than stating ‘no valid reference class exists’?"  
  *Likely Reply:* "Genuine novelties are rarer than claimed. *All* projects claim uniqueness. Using a broad class (e.g., ‘first-of-kind tech megaprojects’) forces acknowledgment of systemic uncertainty. Saying ‘no class exists’ invites inside-view overconfidence."  
  **Follow-Up:** "But doesn’t stretching the class risk anchoring on irrelevant data? If your class for ‘fusion plant’ includes ITER (research) and Sizewell B (fission), haven’t you traded inside-view delusion for outside-view *illusion*?"  

  **Question 3: Base Rate as Constraint vs. Prior (Testing Rigidity)**  
  *Pressure Point: Can the method handle unambiguous case-specific evidence?*  
  **Q:** "You treat the base rate as a hard constraint. But take a fixed-price turnkey contract: cost uncertainty is near-zero. Does your method *force* you to widen the interval to match the class distribution? If yes, isn’t that knowingly producing a worse estimate?"  
  *Likely Reply:* "Contracts don’t eliminate uncertainty; they transfer risk. The *actual* cost distribution remains – contractors pad bids using outside-view data. We’d use a class like ‘fixed-price infrastructure projects’ which still shows overrun variance due to force majeure, scope creep, etc."  
  **Follow-Up:** "Assume a truly rigid contract with liquidated damages so severe that cost *cannot* exceed bid+1%. If you still widen the interval to [X, Y] per the class, isn’t the interval *objectively* wrong? If not, how does case data *ever* justify overruling the class?"  

  **Question 4: Performativity (Institutional Impact)**  
  *Pressure Point: Method success erodes its evidence base.*  
  **Q:** "If your method becomes standard, future projects won’t overrun as much, altering the reference distribution. Should you then use pre-reform data (now irrelevant) or post-reform data (sparse)? Is this self-eroding evidence a fatal flaw?"  
  *Likely Reply:** "We’d use pre-reform data until a robust post-reform class emerges. This isn’t unique – actuarial tables update gradually. The point is to break the *current* cycle of optimism bias. Success means distributions *should* tighten – that’s validation, not failure."  
  **Follow-Up:** "But if your method works, the pre-reform class becomes non-representative. Using it for new estimates would *understate* true accuracy, causing misallocation. Isn’t this a Catch-22 where you can’t trust old *or* new data during transition?"  

  **Question 5: Nested Classes & Meta-Selection (Deepening the Envelope Problem)**  
  *Pressure Point: Choosing between competing classes without case knowledge.*  
  **Q:** "Even with taxonomies, nested classes (e.g., ‘all wars’/‘post-1945 wars’/‘drone-era wars’) exist. Their outcome distributions differ significantly. Since you forbid inside-view input, what *objective* protocol selects the *right* level of granularity pre-envelope?"  
  *Likely Reply:** "We predefine hierarchy rules: e.g., ‘Use most granular class with N>20 projects.’ If multiple classes satisfy criteria, we take the union distribution. This is documented in our SOPs – it’s mechanical, not judgmental."  
  **Follow-Up:** "Doesn’t ‘most granular class with N>20’ *itself* encode an assumption that granularity trumps breadth? If ‘post-1945 wars’ has N=50 and ‘counterinsurgencies’ has N=15, you’d use the broader class. But what if the *causal drivers* align better with the smaller class? Aren’t you trading bias for variance?"  

  **Question 6: Applying the Outside View to Her Own Method (The Closer)**  
  *Pressure Point: Self-exemption from epistemic modesty.*  
  **Q:** "Your thesis is that this method *improves* estimates. But the outside view shows most debiasing techniques (e.g., training) fade quickly, and forecast-improvement methods often fail replication. What’s the *base rate* for interventions like yours achieving lasting real-world accuracy gains?"  
  *Likely Reply:** "Valid challenge. We track our estimates vs. outcomes religiously. Our error is 30-50% lower than inside-view benchmarks for the same projects. For meta-evidence: Flyvbjerg’s data shows reference-class forecasting reduces infrastructure overruns by ~40% when applied rigorously."  
  **Follow-Up:** "But isn’t that ‘rigorous application’ the rub? The base rate for *sustained* organizational adoption of *any* process reform is low. If your own data assumes perfect compliance, while the outside view says compliance decays, shouldn’t your error reduction estimate be discounted by the base rate for method abandonment?"  

  ---

  **Where She Likely Has Strong Answers:**  
  1.  **Sealed Envelope (Q1):** Her process discipline argument holds if taxonomies are truly prebaked and trained. The follow-up exposes but doesn't break this.  
  2.  **First-of-a-Kind (Q2):** Her "uniqueness is overclaimed" rebuttal is empirically sound. The follow-up is thorny but surmountable with class quality controls.  
  3.  **Performativity (Q4):** Using pre-reform data during transition is defensible. Her "validation via tightening" is clever.  

  **Where She’s Vulnerable:**  
  1.  **Constraint vs. Prior (Q3):** The fixed-price counterexample is brutal. If she admits the interval shouldn’t widen, she violates her constraint. If she insists it must, she endorses absurdity. **This is the killer.**  
  2.  **Self-Application (Q6):** She can cite internal success, but the compliance decay base rate threatens real-world scalability. Forces her into "this time is different" territory.  
  3.  **Nested Classes (Q5):** Predefined rules feel arbitrary when causal structures vary. She must defend the SOP as "least bad," not optimal.  

  **What Could Change My Assessment:**  
  -   **If she allows *minimal* inside-view input for class selection:** Q1/Q5 weaken, but her "no inside info" stance seems absolute. If she softens this, the constraint dilemma (Q3) becomes even *more* critical.  
  -   **If she has a causal model for class granularity:** E.g., "We use classes mapped to project *archetypes* via unsupervised ML on objective features." This could defang Q5.  
  -   **If her 'constraint' isn't literal:** If she permits deviations with overwhelming evidence (e.g., the fixed-price case), Q3 loses force, but her core thesis blurs. Your description suggests rigidity.  
  -   **Strawman Risk:** Your framing of the "constraint" is fair, but if she views it as a "strong prior requiring extraordinary evidence to override," Q3 becomes less damning. However, her "burden sits entirely on deviation" and "land inside the central 80%" imply rigidity. **Clarify this pre-debate.**  

  **Tactical Advice:**  
  -   Open with Q1 to warm her up. Use Q3 as the pivot to expose deepest tension. End with Q6 to leave the audience pondering scalability.  
  -   If she dodges Q3's fixed-price paradox, restate it: "So for *truly* binding contracts, you’d still report a 80% interval wider than the *actual* uncertainty? Doesn’t that misinform decision-makers?"  
  -   Her strength is empirical results; her weakness is philosophical coherence. Press her where methodology meets reality.
