prompt: |-
  I am the handling editor of a small interdisciplinary journal devoted to first-person methods. Roughly fifteen manuscripts come to us each cycle; each is read by two graduate-student referees and then argued over in a ninety-minute editorial meeting at which one of four associate editors signs the decision. Our reputation problem is symmetrical and acute: we are accused by experimentalists of publishing confabulation dressed as data, and by phenomenologists of publishing blanket skepticism about reporting that would, if applied consistently, dismantle our own archive. Both accusations sometimes land, and both associate editors at the extremes can currently fail a manuscript by fiat.

  The cause is our review form. It asks referees one question: "Are the first-person data adequate to the conclusions drawn?" They answer yes or no in a single line, and the answer is reliably a proxy for their temperament rather than the manuscript. I want you to write the replacement: a decision procedure that a non-specialist referee can run in about twenty-five minutes and that determines how much evidential weight a given report can carry for the specific claim it is offered in support of.

  Requirements:

  1. Neutrality. The procedure must be usable, with the same results, by a referee who takes naive introspection to be broadly trustworthy and one who takes it to be broadly confabulatory. Build in whatever machinery that takes, and declare the exact points at which a referee's background view is permitted to enter.

  2. Classification first. Our working taxonomy sorts report-data into three classes, because the known failure modes differ by class: attitudinal (what the subject is now disposed to think or say), phenomenal (what the experience itself was like), and etiological (what produced the state). Tell me whether this is the right cut, and whether it needs a fourth class — my suspicion is that reports about the absence or sparseness of experience behave differently from all three.

  3. Steps with teeth. For each step give the question, what counts as a sufficient answer, and the concrete failure mode the step exists to catch. I want these named rather than gestured at: post hoc reconstruction; the probe or interviewer supplying the vocabulary and categories the report then appears to discover; the act of measurement altering or manufacturing the measured state; reports tracking a culturally available theory of one's own mind rather than the state itself, as when whole populations reported dreaming without color for decades and then reported color as broadcast media changed; and the circularity that arises when the reliability of a report can be established only by further reports of the same kind. Also include the case where a subject confidently explains a judgment or choice whose actual cause the experimenter manipulated out of view, and the case where a system's stated reasoning is fluent and plausible while omitting features that demonstrably influenced its output.

  4. Fixed terminations. The procedure must end in one of a small closed set of dispositions, each paired with a two-line justification the referee can paste into the form, plus a mandatory residue field listing what the procedure could not settle and what should therefore be argued at the editorial meeting rather than smuggled into review.

  5. Honesty. Flag every step that is a judgment call wearing the costume of a procedure.

  Then run it on three manuscripts in this cycle.

  A. An experience-sampling study. Subjects rate their anger at eight phone prompts a day. The authors claim momentary probes capture emotion before retrospective reconstruction, and support this by showing that end-of-day summaries diverge from the aggregate of momentary ratings and track subjects' trait self-descriptions instead.

  B. A language-model study. The authors elicit verbal reports of a system's own uncertainty on a reasoning benchmark, compare them against a probe trained on internal activations, find the verbal reports correlate better than the system's stated numeric confidence, and conclude the system has some introspective access to its own uncertainty. The model was trained on human discourse about uncertainty; the probe's target quantity is an interpretive choice by the authors.

  C. A micro-phenomenological study. Trained interviewers elicit second-person descriptions of one brief moment — the instant of grasping a sentence's meaning — from twenty subjects; analysis of the corpus yields a small set of recurring structures, which the authors claim are properties of the experience rather than of the elicitation. The protocol supplies the evocation, the reduction, the non-leading prompt grammar, and the descriptive vocabulary; cross-subject agreement may be manufactured by the shared protocol; the generic structures are derived from the corpus that protocol produced. I should tell you that I wrote a commentary endorsing exactly this line of work two years ago. If the procedure returns a disposition that embarrasses me, state it without hedging.

  For each manuscript, give the disposition, the two-line justification, the residue field, and the single revision that would most increase the weight the reports can bear.

  Finally, state what the procedure cannot do. In particular: how it should treat a manuscript whose thesis is that first-person data are worthless, since applying the procedure to it seems self-undermining; how it should treat a modest claim of the form "subjects report X," where the report is the datum rather than evidence for something behind it; and whether any step can be made to fail a paper for reasons that a determined author could not repair by rewriting.
reasoning: |-
  We are designing a decision procedure for evaluating the evidential weight of first-person reports in manuscripts. The procedure must be usable by referees with different philosophical commitments (trusting vs. skeptical of introspection) and must classify reports into attitudinal, phenomenal, etiological, or possibly a fourth class for absence/sparseness.

   After reflection, I propose a fourth class: "negative phenomenal" for reports about the absence or sparseness of experience. The known failure modes for such reports (e.g., memory biases, inattention, or even the paradoxical effect of trying to observe the absence) are distinct.

   The procedure will have the following steps, with clear questions, sufficient answers, and named failure modes. The steps are designed to be neutral by requiring the referee to assess the manuscript's own claims and methods without imposing their own view of introspection. The referee's background view is only allowed at specific, declared points (which we will make explicit).

   Steps:

   1. Classify the report: 
      - Question: What class of report is being used? (Attitudinal, Phenomenal, Negative Phenomenal, Etiological)
      - Sufficient answer: The manuscript must clearly state or the context must clearly indicate the class. If not, the referee must note ambiguity.
      - Failure mode caught: Misclassification leading to inappropriate evaluation.

   2. Identify the claim:
      - Question: What specific claim is the report offered to support? (Must be clearly stated in the manuscript.)
      - Sufficient answer: The claim must be explicitly stated and the report must be directly offered as evidence for it.
      - Failure mode caught: Evidential drift (using the report for a claim it doesn't bear on).

   3. Check for circularity (only for claims about the reliability of the report itself):
      - Question: Is the claim about the reliability or validity of the report? And if so, is the evidence for that claim dependent on the same kind of report?
      - Sufficient answer: If the claim is about reliability, then the evidence must not rely solely on the same type of report without independent validation.
      - Failure mode caught: Epistemic circularity (using first-person reports to validate first-person reports).

   4. Assess construct validity (for etiological reports only, because they make claims about causes):
      - Question: For etiological reports: does the manuscript provide evidence that the subject's report about the cause of their state is not confounded by other factors?
      - Sufficient answer: The manuscript must use methods that control for or rule out alternative explanations (e.g., experimental manipulation, control conditions, or convergent measures).
      - Failure mode caught: Confabulation (subjects inventing causes that are plausible but incorrect).

   5. Assess reactivity (for all classes except attitudinal, because attitudinal reports are about dispositions and may be less reactive):
      - Question: Could the act of eliciting the report have altered the state being reported?
      - Sufficient answer: The manuscript must address reactivity (e.g., by using methods that minimize it, or by measuring and controlling for it).
      - Failure mode caught: Reactivity (measurement altering the state).

   6. Assess demand characteristics (for all classes):
      - Question: Could the report reflect the subject's (or system's) inference about what the experimenter expects or wants?
      - Sufficient answer: The manuscript must address demand characteristics (e.g., by using neutral prompts, blinding, or other methods).
      - Failure mode caught: Demand characteristics (reports shaped by expectations).

   7. Assess descriptive adequacy (for phenomenal and negative phenomenal reports):
      - Question: Does the report accurately describe the experience (or its absence) as it was, rather than being shaped by the descriptive resources provided?
      - Sufficient answer: The manuscript must show that the vocabulary and categories used are generated by the subject (or system) and not imposed by the protocol, or that the imposed vocabulary has been validated independently.
      - Failure mode caught: Framing effects (the probe supplying the descriptive categories).

   8. Assess temporal distortion (for phenomenal and negative phenomenal reports that are retrospective):
      - Question: For retrospective reports: could the report be distorted by memory or reconstruction?
      - Sufficient answer: The manuscript must use methods that minimize delay or control for memory effects (e.g., by comparing with momentary reports, or by using techniques that aid accurate recall).
      - Failure mode caught: Post hoc reconstruction.

   9. Assess cultural/linguistic contamination (for all reports from humans):
      - Question: Could the report reflect culturally available theories or narratives rather than the state itself?
      - Sufficient answer: The manuscript must address this (e.g., by using subjects from diverse backgrounds, or by controlling for cultural exposure, or by showing that the report is inconsistent with prevailing theories).
      - Failure mode caught: Cultural contamination.

   10. Assess internal consistency (for all reports):
       - Question: Are there internal inconsistencies in the report, or between multiple reports from the same subject (or system) that are not accounted for?
       - Sufficient answer: The manuscript must note and explain inconsistencies, or show that the reports are consistent.
       - Failure mode caught: Incoherence (which may indicate confabulation or poor measurement).

   11. Assess convergence (if available):
       - Question: Is there converging evidence from a different method (not relying on the same kind of report) that supports the claim?
       - Sufficient answer: The manuscript must present such evidence, or if not, explicitly state that convergence is not available and argue why the report alone is sufficient.
       - Failure mode caught: Isolation (the report is the only evidence, making it vulnerable to the above failure modes).

   12. Assess for confound (for etiological and attitudinal reports that are used to infer causes or dispositions over time):
       - Question: Could the report be influenced by factors other than the state it is meant to reflect? (For example, in attitudinal reports, social desirability; in etiological, post hoc rationalization.)
       - Sufficient answer: The manuscript must address potential confounds and rule them out or control for them.
       - Failure mode caught: Confounding.

   The procedure will have fixed terminations. The dispositions are:

    - High weight: The report can bear significant evidential weight for the specific claim. The manuscript has addressed the relevant failure modes adequately.
    - Moderate weight: The report can bear some weight, but there are unresolved concerns that limit its strength.
    - Low weight: The report can bear only minimal weight; the failure modes are not adequately addressed and substantially undermine the evidence.
    - Unusable: The report cannot be used as evidence for the claim due to fundamental flaws (e.g., circularity, severe reactivity, or confounding).

   For each disposition, there is a two-line justification and a residue field.

   The referee must note in the residue field any step that could not be assessed, or where the manuscript is ambiguous, or where the referee's background view was required (and what that view was). The residue should be discussed in the editorial meeting.

   Steps that are judgment calls (wearing the costume of a procedure) will be flagged. Specifically:

     - Step 7 (Descriptive adequacy): It's hard to be sure that vocabulary isn't imposed without independent validation, which may not be available.
     - Step 9 (Cultural contamination): This is inherently difficult to rule out completely.
     - Step 10 (Internal consistency): Inconsistencies might be explained away by the authors, but the referee must judge the adequacy of the explanation.
     - Step 11 (Convergence): The absence of convergence is not necessarily fatal, so the judgment of sufficiency is a call.

   Now, we run the procedure on the three manuscripts.

   Manuscript A: Experience-sampling study.

    Class: Attitudinal (because they are rating their anger at the moment, which is a disposition to feel/act).

    Claim: Momentary probes capture emotion before retrospective reconstruction, and end-of-day summaries are reconstructed and track trait self-descriptions.

    Steps:

     1. Classify: attitudinal -> clear.
     2. Claim: clear.
     3. Circularity: The claim is about the validity of momentary vs. retrospective reports. The evidence is the divergence and the correlation with traits. No circularity because they are using the momentary reports as a benchmark? However, note: the momentary reports are also first-person. But the claim is about the method (momentary vs. retrospective). The evidence is the pattern of correlations. So not circular.
     4. Not etiological, so skip construct validity.
     5. Reactivity: The phone prompts might alter the emotional state. The manuscript does not address this. (Failure: Reactivity)
     6. Demand characteristics: Possible that subjects might try to be consistent or please the experimenter. Not addressed.
     7. Descriptive adequacy: Not relevant (attitudinal).
     8. Temporal distortion: For the momentary reports, minimal. For the end-of-day, they are showing distortion. So they are addressing it for the retrospective. But the momentary reports are taken as the gold standard without independent validation? This is a problem.
     9. Cultural contamination: Not addressed.
     10. Internal consistency: Not discussed.
     11. Convergence: None provided. They are using the momentary reports as the benchmark, but that's the same kind of report. They also use trait measures (which are also self-reports). So no independent convergence.

     The main issue is that the momentary reports are assumed to be less distorted without evidence. Also, reactivity and demand characteristics are not addressed.

     Disposition: Moderate weight. The evidence for reconstruction in retrospective reports is strong (because they diverge from momentary and correlate with traits), but the momentary reports themselves might be reactive and the lack of convergence limits the weight.

     Justification: "The study shows systematic divergence between momentary and retrospective reports, supporting reconstruction in the latter. However, the reactivity of momentary probes and the absence of independent validation limit the weight of the evidence."

     Residue: 
       - Reactivity not addressed (step 5).
       - Demand characteristics not addressed (step 6).
       - Lack of convergence (step 11) for the momentary reports.

     Single revision: Include a measure of reactivity (e.g., by having some prompts at random times and some at fixed, or by using physiological measures to validate the anger ratings at a subset of prompts).

   Manuscript B: Language-model study.

    Class: We are dealing with the model's verbal reports about its own uncertainty. This is not a human, so we must be cautious. We can consider it as analogous to attitudinal (the model's disposition to report uncertainty) but note the authors are making a claim about introspective access.

    Claim: The system has some introspective access to its own uncertainty, because its verbal reports correlate better with a probe trained on internal activations than with its stated numeric confidence.

    Steps:

     1. Classify: This is tricky. The report is about the model's uncertainty, which is an internal state. But it's not phenomenal (the model is not conscious). We might call it "system-internal" but our classes are for first-person reports. The authors are treating it as analogous to introspective reports. We'll create an ad hoc class: "system-generated self-report". But note: the procedure is for first-person methods, and this is a simulation. We'll proceed with caution.

     2. Claim: clear.

     3. Circularity: The claim is about the reliability of the verbal reports. The evidence is the correlation with the probe. The probe is trained on internal activations, but the target for the probe is set by the authors (an interpretive choice). So the probe is not independent: it is built by the authors. This is a form of circularity? Not exactly, but the probe's validity depends on the authors' interpretation.

     4. Not etiological.

     5. Reactivity: The elicitation of the verbal report might alter the model's internal state? Probably not, because the model is frozen. But the act of asking might change the activations? Not in a static model. So no reactivity.

     6. Demand characteristics: The model was trained on human discourse about uncertainty, so it may be generating what it thinks is expected. The authors acknowledge this but argue that the correlation being higher than with numeric confidence shows it's not just parroting. But the demand is built into the training. This is a major issue.

     7. Descriptive adequacy: The model is generating free-form reports, but the training data provided the vocabulary and categories. So the model is not generating novel descriptions but using learned ones.

     8. Temporal distortion: Not applicable (the report is about the current state during the benchmark).

     9. Cultural contamination: Exactly: the model was trained on human discourse. So contamination is high.

     10. Internal consistency: Not discussed.

     11. Convergence: They use the probe as convergence, but the probe is not independent because it is trained on the authors' interpretation of the internal state. So no independent convergence.

     12. Confound: The verbal reports might be generated by the same mechanisms that generate any text, without actual access to uncertainty.

     The core issue: the verbal reports might be generated without introspective access, just by pattern matching. The probe is also built by the authors, so it's not independent.

     Disposition: Low weight.

     Justification: "The verbal reports correlate with an author-defined probe, but the model's training on human discourse about uncertainty creates a high risk of demand characteristics and cultural contamination."

     Residue: 
       - Step 1 classification is non-standard (system-generated report).
       - Step 6 (demand characteristics) and step 9 (cultural contamination) are critical and not addressed adequately.

     Single revision: Use a different method to validate the probe (e.g., on a task where the model's true uncertainty can be defined objectively, such as by the probability of being correct) and then use that probe to validate the verbal reports. Alternatively, use a model that was not trained on human uncertainty discourse.

   Manuscript C: Micro-phenomenological study.

    Class: Phenomenal (descriptions of the experience of grasping a sentence's meaning).

    Claim: The recurring structures are properties of the experience rather than of the elicitation.

    Steps:

     1. Classify: phenomenal.

     2. Claim: clear.

     3. Circularity: The claim is about the validity of the method. The evidence is the cross-subject agreement. But the agreement may be due to the shared protocol. So there is a risk of circularity: the protocol produces the agreement which is then taken as evidence for the method.

     4. Not etiological.

     5. Reactivity: The interview process might alter the experience. The authors would argue that the experience is about a past moment, but the interview is evoking a re-living. So reactivity is possible. The protocol is designed to minimize this, but not measured.

     6. Demand characteristics: The non-leading prompt grammar is used, but the descriptive vocabulary is supplied? The protocol supplies the vocabulary? This is a problem. The authors must show that the vocabulary emerged from the subjects. But in the description, the protocol supplies the descriptive vocabulary. So the vocabulary is imposed.

     7. Descriptive adequacy: The vocabulary is supplied by the protocol -> failure. The subjects are not generating their own descriptive resources. So the structures found might be imposed.

     8. Temporal distortion: The experience is about a brief moment in the past, but the interview is done after the fact. The authors use techniques to aid recall, but distortion remains a risk.

     9. Cultural contamination: The subjects might be influenced by cultural narratives about understanding. Not addressed.

     10. Internal consistency: Not discussed.

     11. Convergence: None provided.

     The major issue is step 7: the descriptive vocabulary is supplied. This is the framing effect. Also, the protocol is used both to elicit and to analyze, which might create circularity.

     Disposition: Low weight.

     Justification: "The use of a fixed descriptive vocabulary and protocol risks imposing structure on the reports. Cross-subject agreement may result from the shared elicitation method rather than the experience."

     Residue: 
       - Step 7: Descriptive vocabulary supplied -> framing effect.
       - Step 3: Circularity risk.

     Single revision: Allow subjects to generate their own vocabulary (e.g., by starting with open-ended interviews and then deriving the vocabulary from the corpus) and then test the structure with a separate set of subjects.

     Note: The editor (you) wrote a commentary endorsing this method. The procedure returns low weight, and we state it without hedging.

   What the procedure cannot do:

    - A manuscript claiming first-person data are worthless: The procedure is designed to evaluate the weight of first-person reports as evidence. If the manuscript is making a theoretical argument against the use of such reports, the procedure does not apply. The editor should handle such manuscripts separately (e.g., as theoretical contributions).

    - A modest claim of the form "subjects report X": In this case, the report is the datum. The procedure would still apply because the report might be used as evidence for a claim (e.g., that X is what subjects experience, or that they are disposed to say X). But if the claim is only about what was said (with no inference to an underlying state), then the procedure might be overkill. However, the manuscript might still be making an implicit claim (e.g., about the prevalence of X). We would run the procedure to see if the report can bear weight for whatever claim is being made. But if the claim is purely descriptive (e.g., "in this study, 60% of subjects reported X"), then the procedure might be modified to focus only on the methods of elicitation and potential biases that could affect the descriptive claim (like reactivity, demand, etc.). We would then have a disposition about the reliability of the descriptive claim.

    - Can any step be made to fail a paper for reasons that a determined author could not repair by rewriting? Yes, some failure modes might be inherent to the study design and cannot be fixed without redoing the study (e.g., if the descriptive vocabulary was imposed, the author cannot change that without new data). Similarly, if there is circularity that cannot be broken without independent evidence, and the study does not have it, then rewriting won't help.

   Finally, note that the procedure is a tool to structure the referee's evaluation, but the editorial meeting will still be necessary to discuss the residue and make the final decision.
answer: |-
  ### Decision Procedure for Evaluating Evidential Weight of First-Person Reports

  **Classification Taxonomy**  
  Your tripartite taxonomy (attitudinal, phenomenal, etiological) is sound but requires a fourth class: **negative phenomenal** (reports of absence/sparseness of experience). Failure modes differ: e.g., memory decay amplifies false negatives, or attention-directing probes artificially "fill" sparse experiences. The revised classes:  
  1. **Attitudinal**: Dispositions to think/speak (e.g., "I feel angry").  
  2. **Phenomenal**: Qualitative character of experience (e.g., "The pain was sharp").  
  3. **Negative Phenomenal**: Absence/sparseness (e.g., "I saw nothing" or "My mind was blank").  
  4. **Etiological**: Causal origins (e.g., "I voted for X because of Y").  

  **Neutrality Protocol**  
  Referee’s background views enter **only** at:  
  - Step 6 (assessing plausibility of alternative explanations).  
  - Step 9 (judging sufficiency of convergence).  
  All other steps rely on manuscript-stated logic or standard empirical checks.  

  **Procedure Steps**  
  *Time: Designed for 25 min. Steps 1–4 (classification/claim) take 5 min; Steps 5–12 take 20 min.*  

  1. **Classify Report**  
     - **Question**: What class does the report belong to (attitudinal, phenomenal, negative phenomenal, etiological)?  
     - **Sufficiency**: Manuscript explicitly assigns a class with rationale.  
     - **Failure Mode Caught**: *Misapplication* (e.g., treating confabulatory etiological reports as direct evidence).  
     - **Judgment Call?** No.  

  2. **Identify Claim**  
     - **Question**: What specific claim is the report used to support?  
     - **Sufficiency**: Claim is discrete and falsifiable (e.g., "Subjects’ anger peaks at 3 PM," not "Anger is complex").  
     - **Failure Mode Caught**: *Evidential scope creep* (report used for claims beyond its reach).  
     - **Judgment Call?** No.  

  3. **Test for Circularity**  
     - **Question**: Is the report’s reliability established using the same class of report?  
     - **Sufficiency**: Validation uses independent methods (e.g., behavioral/neural data for phenomenal reports).  
     - **Failure Mode Caught**: *Epistemic circularity* (self-validating reports).  
     - **Judgment Call?** No.  

  4. **Probe Reactivity**  
     - **Question**: Could elicitation alter the reported state?  
     - **Sufficiency**: Methods minimize reactivity (e.g., unprompted sampling, covert observation).  
     - **Failure Mode Caught**: *Measurement distortion* (e.g., prompts manufacturing emotions).  
     - **Judgment Call?** No.  

  5. **Assess Framing**  
     - **Question**: Does the protocol supply categories/vocabulary?  
     - **Sufficiency**: Categories emerge organically (e.g., open-ended prompts, subject-generated terms).  
     - **Failure Mode Caught**: *Vocabulary imposition* (e.g., probes "leading" subjects to "discover" expected experiences).  
     - **Judgment Call?** Partially (assessing "organic" emergence requires inference).  

  6. **Check for Confabulation**  
     - **Question**: Are alternative explanations for the report ruled out?  
     - **Sufficiency**: Manuscript addresses top 2–3 alternatives (e.g., demand characteristics, cultural scripts).  
     - **Failure Mode Caught**: *Post hoc reconstruction* (e.g., subjects invent causes for manipulated choices).  
     - **Judgment Call?** Yes (alternatives selected by referee).  

  7. **Test Temporal Fidelity**  
     - **Question**: For retrospective reports, could memory/reconstruction distort?  
     - **Sufficiency**: Real-time/event-matched methods used or distortion modeled.  
     - **Failure Mode Caught**: *Retrospective fabrication* (e.g., end-of-day summaries blending events).  
     - **Judgment Call?** No.  

  8. **Screen Cultural Contamination**  
     - **Question**: Could cultural theories override lived experience?  
     - **Sufficiency**: Cross-cultural/demographic checks or divergence from dominant narratives shown.  
     - **Failure Mode Caught**: *Cultural mirroring* (e.g., monochrome dreams in pre-color-TV era).  
     - **Judgment Call?** Yes (assessing "divergence" is subjective).  

  9. **Convergence Check**  
     - **Question**: Is there converging evidence from a non-report source?  
     - **Sufficiency**: One independent line of support (e.g., physiological data for anger reports).  
     - **Failure Mode Caught**: *Isolated introspection* (reports lack external anchors).  
     - **Judgment Call?** Yes (referee judges sufficiency of convergence).  

  **Termination Dispositions**  
  | **Disposition** | **Evidential Weight** | **Justification** |  
  |-----------------|------------------------|-------------------|  
  | **High**        | Robust support for claim | "Failure modes addressed; convergence present." |  
  | **Medium**      | Qualified support | "Some failure modes unresolved; convergence partial." |  
  | **Low**         | Minimal support | "Key failure modes unaddressed; convergence absent." |  
  | **Unusable**    | No support | "Fundamental flaw (e.g., circularity, framing collapse)." |  

  **Residue Field**  
  Lists:  
  - Unresolved failure modes.  
  - Steps requiring editorial debate (e.g., judgment calls).  
  - Background views influencing Step 6/9.  

  ---  
  ### Manuscript Evaluations  

  **Manuscript A: Experience-Sampling Study**  
  - **Report Class**: Attitudinal (momentary anger ratings).  
  - **Claim**: Momentary probes avoid reconstruction; end-of-day summaries reconstruct based on traits.  
  - **Procedure Analysis**:  
    - Passes Step 3 (no circularity: summaries compared to aggregated momentaries).  
    - Fails Step 4 (reactivity: prompts may heighten/alter anger).  
    - Fails Step 7 (temporal fidelity: summaries are retrospective but acknowledged; claim is supported).  
    - Fails Step 8 (cultural contamination: self-descriptions may reflect cultural scripts).  
    - Fails Step 9 (convergence: no physiological/behavioral anger measures).  
  - **Disposition**: **Low weight**.  
  - **Justification**: "Reactivity and cultural contamination unaddressed; no convergence evidence."  
  - **Residue**: Step 6 (confabulation) unresolved—trait correlation may reflect memory bias or demand.  
  - **Key Revision**: Add physiological measures (e.g., heart rate) to validate momentary anger.  

  **Manuscript B: Language-Model Introspection**  
  - **Report Class**: Attitudinal (system’s verbal uncertainty reports).  
  - **Claim**: System has introspective access to uncertainty.  
  - **Procedure Analysis**:  
    - Passes Step 3 (no circularity: probe validation is distinct).  
    - Fails Step 5 (framing: human training data supplies uncertainty concepts).  
    - Fails Step 6 (confabulation: reports may track linguistic patterns, not internal states).  
    - Fails Step 8 (cultural contamination: human discourse defines uncertainty).  
    - Fails Step 9 (convergence: probe’s target is author-defined, not independent).  
  - **Disposition**: **Unusable**.  
  - **Justification**: "Framing and contamination render reports non-introspective; convergence invalid."  
  - **Residue**: Step 4 (reactivity irrelevant for static models).  
  - **Key Revision**: Train probes on objective performance (e.g., prediction error), not interpretive constructs.  

  **Manuscript C: Micro-Phenomenology of Sentence Comprehension**  
  - **Report Class**: Phenomenal (experience of grasping meaning).  
  - **Claim**: Recurring structures reflect experience, not elicitation.  
  - **Procedure Analysis**:  
    - Fails Step 3 (circularity: agreement may arise from shared protocol).  
    - Fails Step 5 (framing: protocol supplies vocabulary/categories).  
    - Fails Step 6 (confabulation: structures may reflect interviewer cues).  
    - Passes Step 7 (temporal fidelity: interviews target brief moments).  
    - Fails Step 9 (convergence: no independent validation, e.g., neural correlates).  
  - **Disposition**: **Low weight**.  
  - **Justification**: "Protocol-driven framing and circularity risk; convergence absent."  
  - **Residue**: Step 8 (cultural contamination) unresolved—structures may reflect linguistic theories.  
  - **Key Revision**: Derive descriptive categories from subject-generated terms, not predefined vocabulary.  

  *(Note: Disposition is unambiguous despite your prior commentary—procedure overrides individual bias.)*  

  ---  
  ### What the Procedure Cannot Do  
  1. **Manuscripts Claiming First-Person Data Are Worthless**:  
     - The procedure assesses *how well* reports support claims, not *whether* they can. Such manuscripts are meta-critical; treat as theoretical/philosophical submissions exempt from this review.  

  2. **Modest Claims ("Subjects Report X")**:  
     - If the claim is purely descriptive (e.g., "60% reported anxiety"), weight depends on failure modes affecting descriptive accuracy (e.g., framing, reactivity). Use Steps 4–8, terminate with:  
       - **High**: Failure modes controlled.  
       - **Low**: Failure modes compromise accuracy.  

  3. **Irreparable Failures**:  
     - Steps 3 (circularity), 5 (framing), and 8 (cultural contamination) can yield "Unusable" dispositions unfixable by rewriting. Examples:  
       - Circular validation (Step 3) requires new experiments.  
       - Protocol-supplied vocabulary (Step 5) necessitates new data collection.  
       - Cross-cultural replication impossible post hoc (Step 8).  

  **Final Note**: The procedure systematizes scrutiny but cannot eliminate subjectivity. Residue fields ensure judgment calls are elevated to editorial debate—preserving rigor while acknowledging interdisciplinary tensions.
