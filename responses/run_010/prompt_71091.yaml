  Interestingly, the bimodal distribution in our solar system (with eight planets clustered together and dwarf planets far below) might defeat the tolerance premise for known bodies. But since the definition must cover undiscovered objects and exoplanets, the vagueness appears dispositional - it's about potential objects that could fall in the theoretical gap.

  For vagueness location: The third condition ("cleared the neighborhood") seems inherently vague. Does "cleared" mean 100% cleared? 90%? This is where the sorites vulnerability lies. The location-dependence objection is different - it's about context sensitivity. A Mars-sized object would be a planet in one orbit but not another, showing that planetary status depends relationally on orbital position.

  Now applying the three readings: 
  - Discovery reading claims an unknowable sharp boundary exists
  - Precisification views this as selecting one sharpening among many possibilities
  - Engineering sees it as replacing concepts for practical purposes

  The engineering reading seems strongest here. It explains why Mercury gets grandfathered in (practical continuity), why dissent exists (different conceptual priorities), and matches the historical asteroid precedent where classification changed for practical reasons. This would be falsified if the IAU claimed their definition revealed a pre-existing truth.

  What does this tell us about vagueness theories? The committee's consideration of a purely conventional definition suggests vagueness isn't just epistemic. But Mercury's exception handling shows scientific definitions aren't bound by supervaluationist constraints - they prioritize utility over precision. Theories of vagueness don't address institutional authority aspects well.

  The key insight is that the IAU wasn't discovering or precisifying as much as engineering a concept for their disciplinary needs, with voting serving as institutional ratification rather than truth-tracking.
answer: |-
  ### 1. Sorites Series Analysis  
  **Ordering dimension**: A dimensionless clearing measure (e.g., \( k = M^2 / P \), mass squared over orbital period), quantifying dynamical dominance.  
  **Base case**: Jupiter (\( k \sim 10^{15} \)), unambiguously clears its orbit.  
  **Inductive step**: If a body with clearing measure \( k_n \) is a planet, then a body with \( k_{n+1} \) (where \( |k_n - k_{n+1}| \) is negligibly small) should also be a planet.  
  **Tolerance principle**: Imperceptible differences in \( k \) do not change planetary status.  

  **Bimodality’s role**: The gap of orders of magnitude between the eight planets and dwarf planets **defeats the tolerance premise for known bodies**, as no intermediate cases exist to force a sorites progression. However, this is sampling-contingent: undiscovered bodies in other systems (or Mercury-like objects in exo-Kuiper belts) could fill the gap, making the vagueness **dispositional**. The definition must govern all possible bodies, so the sorites threat persists for hypothetical objects with \( k \) values spanning the void between clusters. The vagueness is thus dispositional—rooted in possible, unsampled instances—not actual in the current Solar System.  

  ---

  ### 2. Locating the Vagueness  
  **Primary vagueness**: Resides in the third condition ("cleared the neighbourhood"). "Cleared" lacks sharp thresholds:  
  - Does 90% clearing suffice? 99%?  
  - Must competing bodies be eliminated entirely, or merely subjugated?  
  The definition relocates vagueness from "planet" to "cleared," failing to dissolve it.  

  **Location-dependence objection**: This is **not vagueness** but **context-sensitivity**. A Mars-mass object’s status changes with orbital distance because dynamical dominance is relational (dependent on local density and orbital size). The issue is that planetary status is extrinsic—a property of the body-environment system—not intrinsic. This clashes with intuitions that "planet" denotes intrinsic features (e.g., shape). The procedural facts support this: astronomers explicitly debated whether to prioritize intrinsic (geophysical) or extrinsic (dynamical) properties, confirming the complaint is about relationality, not borderline cases.  

  ---

  ### 3. Three Readings Applied  
  **Discovery reading**:  
  - *What the Union did*: Mistakenly treated a vague concept as having a discoverable sharp boundary.  
  - *Dissenters*: Correctly recognize epistemic indeterminacy; the vote did not "track" reality.  
  - *1801–1851 precedent*: Inconsistent, as reclassification reflected pragmatic consensus, not discovery.  
  - *Legitimacy account*: Fails—voting cannot legitimize "discovery" of a nonexistent boundary.  
  - *Falsifier*: Proof that no sharp boundary exists (e.g., exoplanet data showing a \( k \)-continuum).  

  **Precisification reading**:  
  - *What the Union did*: Selected one admissible sharpening (dynamical dominance) from many (e.g., geophysical rounding).  
  - *Dissenters*: Propose a competing sharpening (e.g., rounding alone).  
  - *1801–1851 precedent*: Consistent—asteroids were precisified into a new category.  
  - *Legitimacy account*: Voting legitimizes by convention, but low participation undermines representativeness.  
  - *Falsifier*: If the definition violates penumbral truths (e.g., Mercury excluded).  

  **Engineering reading**:  
  - *What the Union did*: Replaced a folk concept with a technical one optimized for dynamical taxonomy.  
  - *Dissenters*: Defend a distinct concept (e.g., geophysical "planet"), making the dispute terminological.  
  - *1801–1851 precedent*: Direct parallel—engineering a category to manage scientific workflow.  
  - *Legitimacy account*: Voting ratifies expert utility; legitimacy derives from institutional authority, not truth-tracking.  
  - *Falsifier*: If the IAU claimed its definition revealed a pre-existing fact (it did not).  

  **Verdict**: The **engineering reading** is strongest. The Union explicitly prioritized dynamical utility over folk usage or intrinsic properties, creating a novel stipulation. The asteroid precedent and hybrid definition (rejecting purely structural/cultural options) confirm this. Dissent reflects competing engineering goals (geophysical vs. dynamical), not error. The vote’s legitimacy hinges on the IAU’s role as astronomy’s governing body, not democratic consensus.  

  ---

  ### 4. Lessons for Theories of Vagueness  
  - **Conventionalism’s traction**: The 2005 committee’s "cultural" option treats "planet" as purely conventional. Its dismissal (not refutation) shows scientists reject conventionalism for natural-kind-like categories, implying vagueness is not merely linguistic but anchored in worldly properties.  
  - **Supervaluationism’s limits**: Mercury’s inclusion despite failing hydrostatic equilibrium violates supervaluationist admissibility. Scientific definitions prioritize utility over consistency: Mercury is a "core example" and was exempted to preserve continuity. This suggests scientific kind-terms are **underdetermined and contested**, not truly vague—they admit exceptions for pragmatic coherence.  
  - **Silences**:  
    - Theories of vagueness ignore institutional authority. The vote’s legitimacy stems from the IAU’s role, not semantic constraints.  
    - They do not prescribe which properties (intrinsic/extrinsic) a category *should* track—this is a normative choice, evident in the 2005 committee’s three proposals.  
  - **Overall implication**: The episode reveals that "planet"-like terms in science are **negotiated technical constructs**. Vagueness theories capture the initial indeterminacy but not the resolution, which is driven by disciplinary utility, not semantic precisification or discovery. The outcome aligns with conceptual engineering, not epistemology or metaphysics.
