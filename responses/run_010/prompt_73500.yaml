prompt: |-
  I am a novelist — four books, the last of them a family saga told from inside five heads — and for the past twelve years I have also taught a graduate fiction workshop and done two paid manuscript assessments a month for a literary agency. The two jobs have converged on a single problem, which I should like your help solving properly. Week after week I find myself writing some version of the same note in the margin of someone's pages: *she doesn't want it enough*; *the motive is asserted rather than earned*; *he does this because the plot requires him to*. I have come to distrust these formulations, because I now think they cover at least three quite different complaints that call for quite different remedies: that nothing in the character's actual psychology leads to the action; that such a path exists but the text has failed to show it; and that I simply disapprove of the character's motives and would prefer he had better ones. I want a diagnostic procedure that will let me tell those apart before I write anything down.

  The theory I want it grounded in is the internal/external reasons distinction — Williams's argument that a claim of the form "A has a reason to φ" is made true, when it is true at all, by something in A's own subjective motivational set together with whatever a sound deliberative route from that set would reach (including correcting A's false beliefs, imagining what A has not imagined, weighing consequences A has not weighed), and that the contrary way of speaking — insisting that someone has a reason he cannot feel, as when Williams's own illustration, if I recall it correctly, is borrowed from Henry James and involves a young man whose family maintains he has every reason to take up the military career he loathes — is doing something other than reporting a fact of the same kind. Please build me a procedure a working critic can actually run: an ordered set of questions to ask of a passage in which a character acts, what in the text counts as a sufficient answer to each, what a failure at each step licenses me to say, and where the procedure stops and hands the decision back to the writer because what remains is a question of what the book is for rather than of whether the motive is there. I want two layers in the deliverable — the reasoning behind each step, for my own use, and a single plain-sentence marginal comment for the student or the client, who has not read any philosophy and should not have to. It must be runnable in about twenty-five minutes per manuscript, and it must not need me to consult a bibliography; if the thing ever becomes an essay I will supply references myself.

  Then run it on three cases and show me the notes it produces. First, a student story in which a woman walks out on two small children in a single paragraph, and the workshop's instinct is that the departure is unmotivated, while my own hunch is that a deliberative route exists through imagination and through a belief of hers that is simply false. Second, a client's manuscript in which a man remains in a dead marriage for two hundred pages, and I want to write that he has reason to leave — I expect your procedure to tell me this is the wrong note to write, and I would rather it did so bluntly, since a rule that only confirms my prejudices is worth nothing to me. Third, a narrator whose subjective motivational set is genuinely thin — a six-year-old, or a character well into dementia — where the procedure may not be able to run at all, and should say so rather than manufacture a verdict.

  Finally, two things I will hold you to. Be explicit about which steps are judgment calls wearing the uniform of procedure, and about what the procedure cannot do even when it works: it can tell me whether a motive exists on the page, not whether that motive is interesting, and I assume it has nothing to say about the deliberate withholding that makes some fiction better than others. And tell me how confident you are that what you have built preserves the distinction as it is actually drawn rather than a tidier version of it; single out the one step where you are least sure you have not quietly substituted something more convenient, and note where your procedure leans on a contested reading — in particular, how far the sound deliberative route can be stretched before the notion stops doing any work.
reasoning: |-
  We are building a diagnostic procedure based on Bernard Williams' internal reasons theory. The core idea is that a character has a reason to act only if that reason can be linked to their "subjective motivational set" (which includes desires, dispositions, commitments, etc.) via a sound deliberative route (which may involve correcting false beliefs, imagining possibilities, weighing consequences, etc.). The procedure must distinguish between:
  1. No psychological basis for the action (no path in the subjective set).
  2. The path exists but isn't shown in the text.
  3. The critic disapproves of the motives (but they are present and valid for the character).

  The procedure is a set of ordered questions for the critic to ask about a passage where a character acts. For each question, we specify:
  - What counts as a sufficient answer in the text?
  - What a failure at that step means (and what the critic can say).
  - The reasoning behind the step (for the critic) and a plain-sentence comment for the student/client.

  The procedure should take about 25 minutes per manuscript and not require external references.

  We also run it on three cases and produce marginal comments.

  Additionally, we must:
  - Be explicit about which steps are judgment calls.
  - Note the procedure's limits (it doesn't judge if a motive is interesting, or about deliberate withholding).
  - Identify where we might have substituted a tidier version and where we rely on contested readings (especially about the extent of the sound deliberative route).

  Let's outline the procedure step by step.

  **The Diagnostic Procedure**

  *Goal*: Determine whether a character's action is motivated by an internal reason (i.e., rooted in their subjective motivational set and accessible via sound deliberation).

  *Steps*:

  1. **Identify the Action and the Stated Reason (if any)**
     - *Critic's Task*: Note the action in question and any reason explicitly given in the text (by the narrator, the character, or others).
     - *Sufficient Answer*: The text explicitly states a reason for the action (even if it's from another character's perspective).
     - *Failure*: If no reason is stated, move to step 2.
     - *Reasoning*: We start with the text's surface. If the reason is stated, we have a candidate to evaluate in later steps. If not, we must look deeper.
     - *Plain Comment if Stated Reason is Present*: None yet (we proceed to step 3 to evaluate it). If no stated reason, the comment might be: "The text does not state why [character] does this." But we don't stop here.

  2. **Reconstruct the Subjective Motivational Set (S)**
     - *Critic's Task*: List the elements of the character's subjective motivational set (S) as presented in the text up to this point. This includes:
          - Desires (explicit or implicit)
          - Dispositions (e.g., personality traits, habits)
          - Commitments (moral, relational, professional)
          - Projects (long-term goals)
          - Fears, aversions
          - Beliefs (especially about the world and others)
     - *Sufficient Answer*: Any textual evidence (direct narration, dialogue, internal monologue, actions) that establishes an element of S.
     - *Failure*: If there is insufficient textual evidence to reconstruct S (e.g., the character is underdeveloped), then we cannot proceed. The problem is lack of characterization.
     - *Reasoning*: Without a clear S, we cannot ground reasons. This step is crucial because internal reasons must be based on S.
     - *Plain Comment if Failure*: "The story hasn't shown us enough about [character]'s inner life to understand what drives this action." (This corresponds to problem type 1: no psychological basis.)

  3. **Check if the Stated Reason (or the Action) is in S or Directly Linked**
     - *Critic's Task*: If a reason was stated in step 1, check if it is part of S or can be directly linked to S (e.g., the action is an expression of a desire in S). If no reason was stated, check if the action itself is directly motivated by an element of S (e.g., the character is acting out of a known fear).
     - *Sufficient Answer*: The text shows that the reason (or the action) is connected to an element of S without needing complex deliberation.
     - *Failure*: If the stated reason (or the action) is not directly in S and no direct link is shown, move to step 4. If the action is not in S and no reason was stated, also move to step 4.
     - *Reasoning*: Some actions are directly motivated by a desire or commitment in S. If so, the reason is internal and present.
     - *Plain Comment if Success*: None (the action is motivated). But we might note if the link is weak. If the link is direct and clear, we are done (the motive is there). Otherwise, we proceed.

  4. **Explore Sound Deliberative Routes (SDR)**
     - *Critic's Task*: Consider whether there is a sound deliberative route from S to the action. This involves:
          - Correcting false beliefs (if the character has a false belief that blocks a reason, correcting it might reveal a reason).
          - Imagining possibilities (if the character hasn't considered an option, imagining it might connect S to the action).
          - Weighing consequences (if the character hasn't thought through the consequences of an action, doing so might connect S to the action).
          - Note: The SDR must be one that the character could in principle undertake (given their capacities and the information available) and that would lead them to the action.
     - *Sufficient Answer*: The text provides evidence that the character has engaged in such deliberation (or that they could, given their capacities and context). Alternatively, the text provides enough about S and the situation that the critic can construct a plausible SDR without requiring the character to have explicitly thought it.
     - *Failure*: If no plausible SDR exists, then the action is not internally motivated (problem type 1). If a SDR exists but the text does not show it (or at least the elements that would allow it to be inferred), then we have problem type 2 (not shown). If the SDR is present in the text, then the motive is there.
     - *Judgment Call Warning*: This step is highly interpretive. The critic must avoid substituting their own deliberation for the character's. We must stay within the bounds of what the character could reasonably deliberate given their S and context.
     - *Reasoning*: This step is where Williams' theory does the heavy lifting. We are allowing for the possibility that the character might not have explicitly formed the reason but could have through sound deliberation.
     - *Plain Comments*:
          - If SDR exists and is shown: No problem (motive is there).
          - If SDR exists but is not shown: "The story hasn't shown how [character]'s inner life leads to this action. We need to see the thought process or the trigger that connects their feelings to this decision."
          - If no SDR exists: "This action doesn't seem to come from [character]'s established desires, fears, or commitments. What in their psychology would lead them to do this?"

  5. **Check for Critic Disapproval (Problem Type 3)**
     - *Critic's Task*: If steps 1-4 have shown that there is an internal reason (either directly in S or via a SDR that is present or inferable), but the critic still feels the action is unmotivated, then the critic must ask: "Do I disapprove of the motive or find it insufficient, even though it is valid for the character?"
     - *Sufficient Answer*: The critic recognizes that the motive is valid for the character (it is in S or via SDR) but personally dislikes it or thinks it's weak.
     - *Failure*: If the critic cannot separate their disapproval from the character's psychology, they may misdiagnose.
     - *Reasoning*: This step is to catch the critic's bias. It requires self-awareness.
     - *Plain Comment*: None (because the problem is with the critic, not the text). But if the critic realizes they are in this case, they should not write a note about motivation. They might write about the character being unsympathetic, but that's a separate issue.

  *Where the Procedure Stops*: After step 4, if we have a failure due to the SDR not being shown, we note that. If we have a failure because there's no SDR, we note that. If we have a success, we say nothing (or note that the motive is present). Step 5 is a check on the critic.

  **Limits of the Procedure**:
  - It does not judge the quality of the motive (e.g., if it's interesting or original).
  - It does not address deliberate withholding by the author (which might be an artistic choice).
  - It requires a minimal level of characterization (so it may not work for very thin subjective sets, like a young child or dementia patient).
  - It cannot force the critic to be perfectly objective in step 5, but it flags the risk.

  **Contested Reading and Our Approach**:
  - The main contestation is about the extent of the "sound deliberative route". We interpret it as including:
      - Correcting false beliefs (if the character has access to the truth).
      - Imagining possibilities (within the character's cognitive capacity).
      - Weighing consequences (if the character has the time and capacity to do so).
  - We draw the line at what the character could reasonably do given their situation and capacities. We do not allow for radical transformations of S (e.g., acquiring a new desire that isn't latent in S). This is in line with Williams.
  - The step we are least confident in is step 4 (SDR) because it is easy for the critic to overreach and construct a deliberation the character wouldn't. We mitigate this by requiring textual evidence of the elements of S and the situation, and by emphasizing that the SDR must be one the character could have taken.

  Now, we run the procedure on the three cases.

  **Case 1: Student Story - Woman walks out on two small children**

  *Passage*: In a single paragraph, a woman leaves her two small children. The workshop says it's unmotivated. The critic's hunch is that a deliberative route exists via imagination and a false belief.

  *Procedure*:

  1. **Action and Stated Reason**: The action is leaving the children. The text does not state a reason (we assume). → Move to step 2.
  2. **Reconstruct S**: What do we know about the woman?
     - Textual evidence: She is overwhelmed? She feels trapped? She has dreams of a different life? We need to see what the story has shown. Let's assume the story has shown her as feeling trapped, having unfulfilled ambitions, and perhaps having a false belief that her children would be better off without her (or that she can't be a good mother).
     - *Sufficient?* If the story has shown these, then yes. If not, we might have a problem at step 2. But the critic's hunch is that the elements are there, so we assume the story has shown some of this.
  3. **Direct Link?** The action (leaving) isn't directly in S (we don't see her having a direct desire to leave). So we move to step 4.
  4. **SDR**: 
     - The character might have a false belief: "My children are suffering because of me," or "They would be better off without me." Correcting this belief might not lead to leaving (it might lead to staying). But the critic's hunch is that there is a false belief and imagination. 
     - Alternatively: She hasn't imagined the possibility of leaving. Once she imagines it, she sees it as a way to escape her trapped feeling (which is in S). Weighing the consequences: She might believe (falsely) that the children won't be harmed, or that they will be cared for by someone else. 
     - *Sufficient?* If the text shows her having these feelings (trapped) and beliefs (false ones about the children's well-being without her) and at least hints at her imagining an alternative (even if briefly), then a SDR exists. The text might not show the full deliberation, but the elements are there for the reader to infer.
     - *Critic's Decision*: The text has shown enough of S (her feelings) and the false belief? If yes, then the SDR exists and the motive is present (though perhaps not explicitly shown). If the text hasn't shown the false belief or the feeling of being trapped, then we have a failure at step 4 (not shown). 
     - Given the critic's hunch, we assume the text has shown the feelings but not the false belief or the deliberation. So the problem is that the SDR is not shown.
  5. **Critic Disapproval?** The critic might disapprove of leaving children, but that's not the issue.

  *Diagnosis*: The motive exists (via SDR) but is not shown. The problem is type 2.

  *Plain Comment*: "The story hasn't shown how her feelings of being trapped lead to the decision to leave. We need to see her thought process: perhaps her false belief that the children would be better off without her, or her imagining an escape."

  **Case 2: Client's Manuscript - Man remains in a dead marriage for 200 pages**

  *Critic's Initial Reaction*: The critic wants to write that the man has reason to leave (i.e., external reason). The procedure should stop the critic from writing that.

  *Procedure*:

  1. **Action and Stated Reason**: The action is staying. The text may state a reason (e.g., commitment, fear of loneliness, financial reasons, for the kids). Let's assume the text states that he stays out of a sense of duty (or doesn't state a reason). We'll proceed.
  2. **Reconstruct S**: What is in the man's motivational set?
     - Desires: Maybe he desires stability, fears being alone, is committed to his wedding vows, loves his children and wants to be with them every day, fears financial ruin, etc.
     - The text should have shown some of these over 200 pages. We assume it has.
  3. **Direct Link?** Staying is directly linked to S (if he has a commitment to marriage or fear of change). So we might stop here: the motive is present and shown.

  But let's say the critic thinks he should leave because the marriage is dead. That's an external reason. We must go through the steps.

  4. **SDR**: 
     - Is there a sound deliberative route that would lead him to leave? 
       - Correcting false beliefs: Does he falsely believe the marriage can be saved? If so, correcting that might lead to leaving. But the text might show he knows it's dead and stays anyway.
       - Imagining possibilities: He might not have imagined life outside the marriage. If he did, he might see it as better. But if his S includes a strong commitment to staying, then even imagining might not lead to leaving.
       - Weighing consequences: He might weigh the consequences of leaving (loneliness, financial loss, hurting children) and decide to stay because his S values stability and family unity.
     - The critic might think that a sound deliberative route (weighing the misery of staying) would lead to leaving. But note: if his S includes a strong aversion to hurting his children or a belief that divorce is morally wrong, then even after deliberation, he might choose to stay.
     - *Failure*: The critic must not impose their own values. If the character's S includes commitments that override the desire for happiness, then staying is internally motivated.
     - *Critic's Mistake*: The critic is trying to apply an external reason (the marriage is dead, so he should leave). But the procedure shows that as long as staying is linked to S (step 3) or via a SDR that is consistent with S (step 4), then the character has an internal reason to stay.

  *Diagnosis*: The motive to stay is present (it's in S). The critic's note about having reason to leave is invalid because it's an external reason.

  *Plain Comment*: None about motivation (because it's present). The critic should not write that he has reason to leave. Instead, if the critic feels the character's suffering is not being explored, they might write: "The story effectively shows why he stays, but consider whether the emotional toll of staying could be more deeply explored to heighten the conflict." But that's beyond motivation.

  **Case 3: Thin Subjective Motivational Set (Six-Year-Old or Dementia Patient)**

  *Passage*: A character with a very thin S (e.g., a child acting on impulse, or a dementia patient acting erratically).

  *Procedure*:

  1. **Action and Stated Reason**: The action is some behavior (e.g., a child grabs a toy; a dementia patient wanders). The text may not state a reason.
  2. **Reconstruct S**: For a child, S might include immediate desires (wanting the toy, avoiding discomfort) and simple fears. For a dementia patient, S might be fragmented (momentary impulses, residual memories). 
     - *Sufficient?* If the text has shown the character's limited inner life, then we can list those elements. If not, we cannot reconstruct S → failure at step 2.
     - *Problem*: Even if we can list some elements, the deliberative route (step 4) may be inapplicable because the character lacks the capacity for deliberation.
  3. **Direct Link?** The action (grabbing the toy) might be directly linked to a desire (wanting the toy). Then it's motivated. But for more complex actions, we might need step 4.
  4. **SDR**: 
     - For a young child or dementia patient, sound deliberation (in Williams' sense) may not be possible. They might not be able to correct false beliefs (if they have them) or weigh consequences. So we cannot construct a SDR in the same way.
     - *Failure*: The procedure breaks down because the character may not have the capacity for deliberation. The action might be explained by an immediate impulse (which is part of S) but without deliberation.

  *Diagnosis*: The procedure may not be applicable. The critic might need a different framework (e.g., for children, actions are often directly motivated by immediate desires). But if the action is complex and the character lacks the capacity, then we might say the motive is not there (or is not deliberative) and the text must account for that (e.g., by showing the impulse).

  *Plain Comment*: "Because [character] is very young/suffering from dementia, their actions may be driven by immediate impulses rather than deliberation. The text needs to show the immediate trigger (like seeing the toy) or the inner state (like confusion) that leads to this action."

  **Summary of the Procedure in Steps with Reasoning and Comments**

  We'll now write the procedure as a clear guide, then show the three cases.

  **Final Procedure for the Critic**

  *Step 1: What is the action and does the text state a reason?*
  - Look at the passage and surrounding context. Is a reason given (by the narrator, the character, or another character)?
  - *Sufficient*: Any explicit statement of a reason.
  - *Failure*: If not, note: "No reason stated for the action." But this is just a starting point.
  - *Next*: If a reason is stated, proceed to step 3 to evaluate it. If not, go to step 2.

  *Step 2: What is the character's subjective motivational set (S) as shown by the text?*
  - List the elements of S (desires, fears, commitments, beliefs, etc.) that have been established in the text up to this point. Use only textual evidence.
  - *Sufficient*: At least two or three elements of S that are clearly established and relevant to the action.
  - *Failure*: If there is not enough to build S, stop. The problem is underdeveloped character.
    - *Comment*: "The story hasn't shown us enough about [character]'s inner life to understand this action. What drives them? What do they want or fear?"
  - *Next*: If S is established, proceed to step 3.

  *Step 3: Is the action or the stated reason directly linked to S?*
  - Check if the action (or the stated reason) is an expression of an element in S (e.g., the character acts out of a desire that is in S).
  - *Sufficient*: The text shows a clear connection (e.g., the character thinks about the desire just before acting, or the action is typical of a trait in S).
  - *Failure*: If not, go to step 4.
  - *Success*: If yes, the motive is present and shown. You may stop (unless you suspect step 5 applies).
  - *Comment for Failure*: None yet (we move to step 4).

  *Step 4: Can a sound deliberative route (SDR) from S lead to the action?*
  - Consider if, by correcting false beliefs, imagining possibilities, or weighing consequences (within the character's capacity and context), the character could arrive at the action.
  - *Sufficient*: The text provides enough about S and the situation that a plausible SDR exists and is consistent with the character's capacities. The text might show part of this route (e.g., a false belief) or leave it to the reader to infer.
  - *Failure*: 
    - If no SDR exists (the action cannot be reached from S by any reasonable deliberative path), then the action is not internally motivated.
      - *Comment*: "This action doesn't seem to arise from what we know of [character]'s inner life. What in their psychology would lead them to do this?"
    - If a SDR exists but is not shown in the text (and the reader cannot infer it), then the problem is that the motive is not shown.
      - *Comment*: "The story hasn't shown how [character]'s feelings and thoughts lead to this action. We need to see more of their internal process (e.g., their false belief, their imagining of alternatives, or their weighing of consequences)."
  - *Success*: The motive is present (even if not explicit).
  - *Judgment Call*: Be careful not to invent a deliberation that the character wouldn't do. Stick to what the text provides and what the character could reasonably do.

  *Step 5: Is my problem with the motive, not its existence?*
  - If steps 1-4 show the motive is present (either directly or via SDR), but you still feel the action is unmotivated, ask: Do I think the motive is weak or unworthy?
  - *Result*: If yes, then the problem is your disapproval, not the text. Do not write a note about motivation. If you think the motive is uninteresting, that's a separate issue (not for this procedure).
  - *Comment*: None (because the problem is not in the text).

  **Running the Cases with Comments**

  *Case 1: Woman leaving children*
  - Step 1: No reason stated. Go to step 2.
  - Step 2: S includes feeling trapped, overwhelmed, and perhaps a false belief about the children being better off without her (if shown). Assume the text has shown the trapped feeling but not the false belief.
  - Step 3: Leaving is not directly linked (she hasn't expressed a desire to leave).
  - Step 4: A SDR exists: by imagining freedom and believing (falsely) the children will be fine, she might leave. But the false belief and the moment of imagination are not shown. So the problem is not shown.
  - Comment: "The story hasn't shown how her feelings of being trapped lead to the decision to leave. We need to see her thought process: perhaps her false belief that the children would be better off without her, or her imagining an escape."

  *Case 2: Man staying in marriage*
  - Step 1: The text may state a reason (e.g., duty). Assume it does: he stays because of duty.
  - Step 2: S includes commitment to marriage, fear of change, love for children.
  - Step 3: Staying is directly linked to S (duty is part of his commitments). Motive is present.
  - Step 5: The critic's desire to say he has reason to leave is external. The procedure stops at step 3 (motive is present). The critic should not write about motivation.

  *Case 3: Six-year-old child*
  - Step 1: Action (e.g., grabs a toy). No stated reason.
  - Step 2: S is thin: immediate desires (wants the toy). The text might show this.
  - Step 3: Grabbing the toy is directly linked to wanting it. Motive is present. But if the action is more complex (e.g., the child runs away from home), we might need step 4.
  - Alternatively, if the action is complex and S is too thin for deliberation, step 4 might fail. 
  - Comment for a complex action: "Because the character is very young, the story needs to show the immediate impulse or feeling that leads to this action (like fear or a sudden desire)."

  **Confidence in Preserving the Distinction**
  - We are most confident in steps 1-3 (they are textual).
  - Step 4 (SDR) is the most contested and where we might have substituted a tidier version. We rely on a moderate reading of SDR (it must be within the character's capacities). The contested part is how much we can "fill in" for the character. We have tried to tie it to textual evidence and avoid overreach by requiring the elements to be in the text. But it remains a judgment call.
answer: |-
  ### Diagnostic Procedure for Character Motivation: Grounded in Williams's Internal Reasons Theory

  This procedure is designed to diagnose issues of character motivation in fiction by applying Bernard Williams's distinction between *internal* and *external* reasons. An internal reason is one that arises from a character's "subjective motivational set" (S)—their desires, commitments, beliefs, fears, etc.—and can be reached via a "sound deliberative route" (SDR). An SDR involves correcting false beliefs, imagining unconsidered possibilities, or weighing consequences, *without* adding new elements to S. External reasons (e.g., "he should leave this marriage") are invalid—they reflect the critic's values, not the character's psychology.

  The procedure is a 5-step checklist. Each step asks a question, defines what constitutes a sufficient textual answer, and specifies the failure outcome. Steps 1–4 are sequential; step 5 is a self-check for critic bias. **Bold text** is the reasoning (for your reference); *plain text* is the marginal comment (for students/clients). The procedure takes ~25 minutes per manuscript (focus on 1–2 key actions).

  **Key Limits**  
  - It only assesses if a motive exists *on the page* (not if it's interesting, original, or intentionally withheld).  
  - It stops when the issue becomes artistic intent (e.g., deliberate ambiguity).  
  - It may fail for characters with "thin" S (e.g., children, dementia patients) due to limited capacity for deliberation.  
  - **Judgment calls** are required in Steps 2 and 4, where S and SDR reconstruction involves interpretation.  

  ---

  ### The Procedure  
  #### *Step 1: Is the action’s reason explicitly stated?*  
  - **Reasoning**: Start with the text’s surface. A stated reason (e.g., dialogue, narration) provides a candidate for evaluation. If absent, we probe deeper.  
  - **Sufficient Answer**: Direct textual evidence (e.g., “She left because [reason]”).  
  - **Failure Outcome**: No stated reason → Proceed to Step 2.  
  - *Marginal Comment*: “No reason given for [action].”  

  #### *Step 2: Is there textual evidence for a subjective motivational set (S)?*  
  - **Reasoning**: S is the foundation for internal reasons. It includes:  
    - Core desires/fears (e.g., “wants security,” “fears abandonment”).  
    - Commitments (e.g., “devoted to family”).  
    - Beliefs (true or false).  
    - Dispositions (e.g., “impulsive,” “loyal”).  
    S must be shown *before* the action.  
  - **Sufficient Answer**: At least 2–3 established elements of S (via actions, thoughts, dialogue).  
  - **Failure Outcome**: Insufficient evidence → Problem Type 1 (no psychological basis). Stop.  
  - **Judgment Call**: Reconstructing S requires interpreting subtext. Avoid inferring unshown traits.  
  - *Marginal Comment*: “We haven’t seen enough of [character]’s inner world to understand this action. What drives them? What do they want/fear/believe?”  

  #### *Step 3: Does the action directly align with S?*  
  - **Reasoning**: If the action flows naturally from S (e.g., a fearful character avoids risk), no deliberation is needed. This step catches obvious matches.  
  - **Sufficient Answer**: Clear link between S and action (e.g., a stated desire directly enables the action).  
  - **Failure Outcome**: No direct link → Proceed to Step 4.  
  - *Marginal Comment*: None (move to Step 4).  

  #### *Step 4: Can a sound deliberative route (SDR) bridge S and the action?*  
  - **Reasoning**: An SDR extends S through plausible reasoning the character *could* perform, given their capacities. It may involve:  
    - Correcting false beliefs (e.g., “If she knew X, she’d act”).  
    - Imagining possibilities (e.g., “If he considered Y, he’d see it’s feasible”).  
    - Weighing consequences (e.g., “If she thought through Z, she’d prioritize this”).  
    **Crucial constraint**: SDR cannot add *new* elements to S (e.g., a selfish character can’t “deliberate” their way to selflessness).  
  - **Sufficient Answer**: Text provides elements for a plausible SDR (e.g., false beliefs are established; consequences are knowable).  
  - **Failure Outcomes**:  
    - SDR is *impossible* → Problem Type 1 (no psychological basis).  
    - SDR is *possible but not shown* → Problem Type 2 (motive exists but isn’t earned).  
  - **Judgment Call**: This step is highly interpretive. The critic must:  
    - Use only textual evidence (no invention).  
    - Respect character capacity (e.g., a child can’t weigh complex consequences).  
    - **Contested Reading**: We define SDR as “minimally rational” (belief correction, basic imagination/consequence-weighing). We exclude advanced reasoning (e.g., moral epiphanies) to avoid overreach.  
    - **Weakest Confidence**: Here, we risk substituting a “tidier” SDR. To mitigate, tie SDR strictly to established S and context.  
  - *Marginal Comments*:  
    - SDR impossible: “This action doesn’t grow from [character]’s established desires/fears/beliefs. What in their psychology would lead to it?”  
    - SDR possible but not shown: “The story hasn’t shown how [character] gets from their feelings to this action. Show their thought process: a false belief, an imagined choice, or weighing consequences.”  

  #### *Step 5: Is my critique based on disapproval? (Self-check)*  
  - **Reasoning**: If Steps 1–4 confirm a motive, but you still object, the issue is likely your values (Problem Type 3).  
  - **Sufficient Answer**: Motive is internally valid (per Steps 2–4), but you dislike it.  
  - **Failure Outcome**: Realize bias → Do not write a motivation note.  
  - *Marginal Comment*: None. Write instead about subjective preferences (e.g., “I find this motive unsympathetic,” but flag this as opinion).  

  **When to Stop**: The procedure halts if:  
  - Step 2 fails (no S).  
  - Step 4 confirms a motive.  
  - Step 5 reveals critic bias.  
  After this, motivation is “present”—artistic choices (e.g., withholding thoughts) are the writer’s domain.  

  ---

  ### Case Applications  
  #### *Case 1: Student Story (Woman walks out on children)*  
  - **Action**: Woman leaves her children abruptly.  
  - **Workshop Verdict**: Unmotivated.  
  - **Your Hunch**: SDR exists via false belief + imagination.  

  | Step | Answer | Outcome |  
  |------|--------|---------|  
  | 1 | No stated reason. | → Step 2 |  
  | 2 | S likely includes: “feels trapped” (shown via earlier sighs/restlessness), “believes she’s a bad mother” (shown via self-loathing monologue). | Sufficient S → Step 3 |  
  | 3 | No direct link: S shows discontent, not abandonment. | → Step 4 |  
  | 4 | **SDR Possible**: (1) False belief: “Children are better off without me” (established in S); (2) Imagination: She envisions freedom (not shown). **SDR Not Shown**—text skips her weighing consequences or imagining escape. | Problem Type 2 (motive exists but not earned) |  
  | 5 | Motive is valid internally; your discomfort is ethical, not textual. | No motivation note |  

  *Marginal Comment*: “The story hasn’t shown how her feelings of being trapped lead to leaving. Show her thought process: her false belief that the children are better off without her, or her imagining an escape.”  

  #### *Case 2: Client Manuscript (Man stays in dead marriage)*  
  - **Action**: Man remains for 200 pages.  
  - **Your Instinct**: “He has reason to leave.”  

  | Step | Answer | Outcome |  
  |------|--------|---------|  
  | 1 | Stated reason: “For the kids” (dialogue), “fear of being alone” (narration). | → Step 2 |  
  | 2 | S includes: “commitment to fatherhood” (shown via interactions), “aversion to conflict” (shown via avoidance), “belief that divorce harms children” (stated). | Sufficient S → Step 3 |  
  | 3 | Direct link: Staying aligns with S (fear + commitment). | Motive present → Stop |  
  | 4 | N/A (Step 3 resolved) | — |  
  | 5 | **Critic Bias Alert**: Your note (“he has reason to leave”) is an *external* reason. S confirms his internal reason to stay. | Do not write motivation note |  

  *Marginal Comment*: None. Instead: “His commitment to staying is clear, but consider heightening the tension by showing the cost of this choice (e.g., his suppressed anger or grief).”  

  #### *Case 3: Thin Subjective Set (Child or Dementia Patient)*  
  - **Action**: A six-year-old hides a broken vase.  
  - **Challenge**: Limited capacity for deliberation.  

  | Step | Answer | Outcome |  
  |------|--------|---------|  
  | 1 | No stated reason. | → Step 2 |  
  | 2 | S is thin: “desires praise” (shown via seeking approval), “fears punishment” (shown via flinching). | Barely sufficient → Step 3 |  
  | 3 | No direct link: Hiding isn’t yet tied to fear. | → Step 4 |  
  | 4 | **SDR Impossible**: A young child can’t reasonably weigh consequences (e.g., “Hiding avoids scolding”). **Capacity Exceeded**—procedure fails. | Problem Type 1 + Procedure Limit |  

  *Marginal Comment*: “Because [character] is a child, their actions are driven by immediate impulses (fear, desire). Show the moment of panic after breaking the vase—don’t assume they deliberated.”  

  **Procedure Limit Note**: For thin S, focus on impulses, not deliberation.  

  ---

  ### Confidence Assessment  
  The procedure preserves Williams’s core distinction:  
  - **Strengths**: Steps 1–3 are objective (text-based). Step 5 explicitly isolates critic bias.  
  - **Weakest Step**: Step 4 (SDR).  
    - **Risk of Substitution**: We may replace “character-accessible deliberation” with “critic-accessible logic.” Our constraint (using only established S) mitigates this but doesn’t eliminate it.  
    - **Contested Reading**: We limit SDR to *corrective* deliberation (fixing beliefs/gaps), not *transformative* (e.g., “if he were braver…”). This aligns with Williams but may feel restrictive.  
  - **What It Cannot Do**:  
    - Judge motive “strength” (only existence).  
    - Handle radical withholding (e.g., Kafkaesque ambiguity).  
    - Overcome thin S without authorial input.  

  **Final Confidence**: 85%. The procedure will reliably separate Problem Types 1–3 and force rigor, but Step 4 remains interpretive. It succeeds if it prevents your default “unmotivated” note when the issue is Type 2 or 3.  

  ---  
  Use this as a quick checklist. For essay expansion, ground it in Williams’s “Internal and External Reasons” (1979) and examples from your novels (e.g., multi-POV deliberation in your saga).
