  Key structural requirements include:
  - Blind rating of vignettes to generate raw data
  - Eight scenario cards with engineered dial scores
  - Deliberate "crossing pairs" to expose theoretical tensions
  - A surplus-trading activity demonstrating compensability
  - Late introduction of detectability to separate validity from blameworthiness
  - Optional meta-consent exercise with ethical risk assessment

  Notable pedagogical constraints:
  - Students have foundational knowledge but not this framework
  - Must avoid literary attribution of the model
  - Physical space allows movable furniture
  - Zero budget beyond printing

  The ethical tightrope with the optional closing module is particularly delicate - while brilliant for first-person demonstration, the power imbalance in a graded course demands extreme caution. A safer alternative might be retrospective analysis of the activity's own consent structure.

  For the vignettes, I'm considering scenarios that:
  - Vary stakes from trivial to grave
  - Feature different relationship dynamics (medical, commercial, intimate)
  - Include subtle capacity/pressure interactions
  - Contain one deliberately ambiguous case to provoke debate

  The crossing pairs need surgical precision - perhaps contrasting high-capacity/low-information scenarios with low-capacity/high-information ones to force the additive vs floor conflict. The trading round should produce absurdities like "selling" 3 pressure points to buy information points for a life-altering decision.

  Predictable failure points include:
  - Students rejecting the 0-10 scale's artificial precision
  - Collapsing pressure and capacity conceptually
  - Difficulty isolating detectability from validity
  - Groupthink during voting phases

  The most philosophically honest note may be that consistency tests don't prove correctness - they simply make presuppositions visible. The value lies in experiencing how theoretical commitments generate practical judgments, not in discovering which model is "true".
answer: |-
  ## Seminar Design: Consent Validity Under the Dial-and-Floor Model

  **Session Title:** Mapping the Boundaries of Valid Consent  
  **Duration:** 100 minutes  
  **Participants:** 16 third-year practical philosophy students  
  **Resources:** Printed vignette cards (one set per student), score sheets, whiteboard/flip chart, movable furniture arranged in a circle.

  **Staged Outline (Minute Allocations):**

  1.  **Introduction & Framing (0-5 mins):**
      *   Briefly recap core concepts: consent requires adequate information, absence of undue pressure, and sufficient capacity.
      *   Frame the session: "Today, we'll experiment with a way to *measure* these elements quantitatively, purely as a thought experiment to test different ideas about how they combine to make consent valid or invalid. Treat the scales as rough tools for comparison."

  2.  **Blind Rating Phase (20-35 mins):**
      *   Distribute shuffled **Vignette Cards (Set A: Vignettes 1-6)** and individual score sheets.
      *   *Task:* "Read each vignette silently. For each, rate the three dimensions *only* on a scale of 0 (terrible) to 10 (perfect). Then, based *only* on your intuition about validity, record Yes/No: *Was the consent valid?* Do *not* discuss yet. Work independently." (15 mins)
      *   Collect score sheets immediately. Assure anonymity for analysis.

  3.  **Hypothesis Generation & Presentation (35-45 mins):**
      *   Display anonymous aggregate scores & validity verdicts for Vignettes 1-6 on the board (e.g., average scores, % valid).
      *   *Facilitation:* "Look at these patterns. What might explain when the group says consent is valid vs invalid? Are all three factors equally important? Can a low score on one be compensated by high scores elsewhere? Are there minimum requirements?" (5 mins discussion).
      *   Introduce the three rival hypotheses *as explanations* for the patterns observed: **Additive**, **Floor**, **Shifting Floor**. Define each clearly on the board. Do *not* attribute to literature.

  4.  **Testing Hypotheses with Data & Crossing Pairs (45-65 mins):**
      *   Reveal Vignette 7. Ask students to predict: "Based *only* on the Additive view, would consent likely be valid? Based *only* on the Floor view (assume floors at, say, 3)? Discuss in pairs." (5 mins)
      *   Reveal Vignette 8. Repeat the prediction task. (5 mins)
      *   *Facilitation:* "Notice how Vignettes 7 and 8 give *opposite* predictions under Additive vs Floor? Look back at our aggregate data for similar tensions. What does a divergence in our initial ratings (before hypotheses) on such a pair show? *It suggests our intuitions aren't purely additive or purely threshold-based; the tension is real.* What if we *didn't* diverge? *It might suggest our intuitions lean strongly towards one model, or we absorbed the tension unconsciously.*" (10 mins)
      *   Reveal **Vignettes 7 & 8** text and **your intended scores**. Discuss how class predictions matched/differed from hypotheses. Highlight the core conflict: compensability vs non-compensability of deficits.

  5.  **Surplus-Trading Round (65-80 mins):**
      *   Distribute **Vignette Card 9 (Surplus Trade)**.
      *   *Task:* "Imagine you can *transfer* points *from* one dial *to* another on this vignette, but only in whole numbers. The 'cost': to gain 1 point on Dial A, you must *lose* 2 points from Dial B or C. Your goal: make the consent valid. What trades would you make? Discuss in small groups – justify *why* the trade should be permitted." (10 mins)
      *   *Facilitation:* "Groups, report your trades and reasoning. Did anyone 'buy' enough Information points by 'selling' Pressure points? What verdict does that imply? *This produces absurdities:* e.g., validating consent where immense pressure (low Pressure score) is 'paid for' by slightly better information, especially for high-stakes decisions. It dramatises the Additive view's potential counter-intuitiveness." (5 mins)
      *   *Stop when:* Absurd trades are proposed (e.g., trading Pressure down to 1 to raise Information to 6) or consensus emerges that some trades feel illegitimate. Conclude: "This exercise forces us to confront *whether* such compensation is normatively permissible – it's the core dispute between Additive and Floor views."

  6.  **Introducing Detectability & Debrief (80-95 mins):**
      *   Introduce **Detectability:** "A fourth factor: Could the person *receiving* the consent reasonably have spotted the problem (e.g., the info gap, pressure, incapacity)? Rate 0-10: 0=impossible to spot, 10=obvious."
      *   Revisit **Vignette 6 (Low Detectability)**. "Rate Detectability now. Does a low Detectability score change whether the consent was *valid*? Or does it change something else?" (5 mins discussion).
      *   *Debrief Mapping:*
          *   *Necessary vs Sufficient:* "The Floor view treats each factor as *necessary* (below threshold = invalid). Additive treats the *sum* as sufficient. Shifting Floor makes necessity stakes-dependent."
          *   *Invalidity vs Wrongful Reliance:* "Validity is about the *consenter's* act. Detectability is about the *recipient's* action in relying on it. Invalid consent + Low Detectability might mean the recipient *didn't do wrong* by relying, even though the consent wasn't valid. Our initial collapse missed this."
          *   *Fixed vs Shifting Threshold:* "Vignettes 2 (photo) vs 3 (surgery) highlight this. Does the *same* Capacity score suffice for both? The Shifting Floor hypothesis says no – the threshold moves with the stakes."

  7.  **Optional Closing Module: The Meta-Consent (95-100 mins - Use ONLY if ethically defensible judgement accepted):**
      *   *(If run):* At the *very start* (minute 1), present a sign-up sheet: "To enhance today's learning experience, one aspect of the seminar's structure will not be disclosed until the end. Sign here to confirm your agreement to participate on this basis." (Assume most sign).
      *   *(At 95 mins):* Disclose: "The withheld feature was that you signed agreeing to this non-disclosure. Was *your* consent to participate valid?"
      *   *Assessment & Ethical Judgement:*
          *   **Cure?** Unlikely. Advance agreement to non-disclosure *might* marginally improve Position/Information dials, but the *specific* undisclosed material fact (the nature of the withholding itself) is highly relevant to the decision to participate, especially in a graded academic setting. Capacity/Pressure might be high, but Information is likely scored very low (2-3), probably below any plausible floor for this context. Validity is doubtful.
          *   **Defensibility?** **Risky and Questionable.** In a *graded* seminar, the power imbalance is significant. Students may feel pressured to sign, fearing repercussions. It involves deception-by-omission. While pedagogically powerful, the potential for discomfort, distrust, or feeling manipulated is high. The educational benefit does not clearly outweigh these risks in this context.
      *   **Non-Deceptive Substitute:** "Consider the sign-up sheet we used at the start, which simply recorded attendance. *Imagine* it had instead contained a clause agreeing to an undisclosed element. Looking back *now*, using our model, would consent based on *that hypothetical sheet* have been valid? Score it." (Focuses the question without actual deception).

  ---

  **Vignettes (Set A: 1-6 for Rating; 7 & 8 Crossing Pair; 9 Surplus Trade):**

  | Vignette | Text | Intended Scores (Info / Press / Cap) | Expected Verdict (Additive* / Floor^ / Shift Floor°) |
  | :------- | :--- | :---------------------------------- | :-------------------------------------------------- |
  | **1**    | Alex agrees to lend their favourite book to Sam, a coursemate they know well. Sam says, "Can I borrow your copy of *Middlemarch*? I need it for tomorrow's tutorial." Alex says "Sure, no problem," and hands it over. They forget they promised it to another friend later. | **9 / 9 / 8** | **Y / Y / Y** |
  | **2**    | During a street festival, a photographer approaches Bailey, smiling. "Hi! I'm doing a project on urban joy. Can I take your photo? It might be used online or in a small local exhibit." Bailey, cheerful and unhurried, says "Yeah, looks fun!" and poses. | **7 / 8 / 9** | **Y / Y / Y** |
  | **3**    | Charlie is admitted to A&E with severe abdominal pain. The doctor says, "We need to operate immediately to remove your appendix. It could rupture otherwise, which is life-threatening. Sign here." Overwhelmed and in pain, Charlie signs without reading. | **5 / 4 / 4** | **N / N / N** |
  | **4**    | Dakota's landlord, Mr. Evans, visits. "The boiler needs urgent replacement," he says. "Sign this new tenancy agreement. The rent stays the same, but there's a clause increasing it by 20% if repairs exceed £500, which this will. Sign now or I serve notice." Dakota, fearing eviction, signs hastily. | **3 / 2 / 7** | *(Sum=12) Y* ^(Info<4? Press<3? Cap>6? N) °(High Stakes? N) | **Crossing Pair A** |
  | **5**    | Dr Ellis explains a complex research trial to Finley involving a new migraine drug with potential mild side effects. Finley, a biochem PhD student, asks detailed questions and reads the form carefully before signing. | **9 / 8 / 9** | **Y / Y / Y** |
  | **6**    | Morgan, looking anxious, arrives at a walk-in clinic asking for "the morning-after pill." The nurse, rushed, hands Morgan a form, saying "Sign this consent for treatment." The form lists several medications and potential side effects generically. Morgan signs quickly without reading. *(Low Detectability)* | **4 / 7 / 6** | *(Sum=17) Y* ^(Info<4? N Press>3? Cap>6? Y?) °(Mod Stakes? Borderline) | **Detectability Focus** |
  | **7**    | Jamie urgently needs £500 to avoid eviction. Leon offers: "I'll give you the cash now if you agree to clean my flat every weekend for 3 months. That's £50 per clean. Sign this contract now or the offer's gone." Jamie, desperate, signs. | **6 / 3 / 7** | *(Sum=16) Y* ^(Press<3? N) °(High Stakes? Press<4? N) | **Crossing Pair B (vs V4)** |
  | **8**    | Riley, aged 17, visits a new GP with mild hayfever. The GP briefly says, "This standard spray should help," and slides over an iPad consent form covering many possible treatments and side effects. Riley, distracted by phone notifications, quickly swipes 'Agree' without reading. | **3 / 8 / 5** | *(Sum=16) Y* ^(Info<4? Cap<6? N) °(Low Stakes? Cap>4? Y?) | **Crossing Pair B (vs V4)** |
  | **9**    | Taylor is offered a job with a prestigious firm. The contract signing is rushed ("Sign now, we have other candidates"). The contract mentions "possible overseas assignments" but doesn't specify durations or locations. Taylor, thrilled, signs. *(Initial Scores: Info=4, Press=5, Cap=8)* | **4 / 5 / 8** | *(Sum=17) Y* ^(Info<4? Press<3? Cap>6? Borderline Y/N) °(High Stakes? Info<5? N) | **Surplus Trading Start Point** |

  *Additive Assumed Threshold: Sum >= 15 (illustrative; actual class aggregate may differ)*
  *Floor Assumed Thresholds: Info >=4, Press >=3, Cap >=6 (illustrative)*
  *Shift Floor: Stakes adjust thresholds (e.g., Info: Photo=3, Surgery=6; Cap: Photo=4, Surgery=7; Press: generally >=3)*

  **Crossing Pairs Explanation:**
  *   **Pair 1: Vignette 4 (Dakota/Landlord) vs Vignette 7 (Jamie/Leon):** Both have moderate sums (~12-16). V4 has very low Pressure & Info, high Capacity. V7 has low Pressure, moderate Info, high Capacity.
      *   *Additive:* Likely Valid both (if sum > threshold).
      *   *Floor:* V4 likely Invalid (Info and Pressure likely below floor). V7 *may* be valid if Pressure=3 is *just* at/above floor.
      *   *Divergence Expected:* Class more likely to rate V7 valid than V4 due to Jamie's desperation feeling more 'voluntary' than Dakota's threat. Shows Pressure/Info deficits weigh differently. **If no divergence:** Suggests class either strongly prioritises Capacity (seeing both as invalid) or strongly uses a sum (seeing both as valid), masking the Pressure/Info difference.
  *   **Pair 2: Vignette 4 (Dakota) vs Vignette 8 (Riley/GP):** V4: Low Info/Press, High Cap. V8: Low Info/Cap, High Press.
      *   *Additive:* Likely Valid both.
      *   *Floor:* V4 Invalid (Info/Press low). V8 Invalid (Info/Cap low).
      *   *Divergence Expected:* Possible, but less pronounced than Pair 1. Both might be seen as invalid, but for different reasons (V4 pressure/threat, V8 youth/distraction). **If no divergence:** Reinforces Floor intuitions or highlights both have two deficits. Shows Additive allows validity where Floor requires deficits be 'spread'.

  ---

  **Frank Failure List:**

  1.  **Spurious Precision:** Students will (rightly) challenge the 0-10 scale. "How can Pressure be a 4 vs a 5?" *Mitigation:* Emphasise repeatedly it's a *heuristic tool* for rough comparison and generating discussion, not a real measurement. Focus on relative highs/lows and clear deficits (e.g., scores <3).
  2.  **Pressure/Capacity Collapse:** A sharp student will argue severe Pressure *is* or *causes* impaired Capacity (e.g., "Jamie in V7 wasn't thinking clearly due to desperation!"). **This is a discovery to be welcomed.** *Management:* Acknowledge the insight: "Absolutely, these dials aren't hermetically sealed. High Pressure *can* impact Capacity. Does that mean Pressure isn't distinct, or does it show their interaction is crucial? Should we model Pressure *affecting* Capacity, or treat extreme Pressure *as* a Capacity deficit? This blurring challenges the model's structure – that's valuable!"
  3.  **Hypothesis Confusion:** Students may struggle to keep the three hypotheses distinct, especially Shifting Floor. *Mitigation:* Clear labels on board. Constantly refer back: "Under Additive, what would we predict here? Under Floor?"
  4.  **Groupthink in Rating:** Early discussion or seeing others' reactions might bias ratings. *Mitigation:* Strict silence during individual rating. Collect sheets immediately. Use aggregate data.
  5.  **Detectability Merger:** Students may still try to fold Detectability into validity ("If they couldn't spot it, it *was* valid enough"). *Mitigation:* Stress the conceptual separation forcefully: "Validity is about the *act of consent itself*. Detectability is about the *recipient's epistemic position* when accepting it."
  6.  **Trading Round Frustration:** The arbitrary "2:1 trade" rule may feel artificial. *Mitigation:* Frame it as a deliberate provocation: "This rule forces us to ask: Is trading Pressure for Information *ever* acceptable? If so, at what 'exchange rate'? If not, why?"

  **Honest Limitation Note:**

  This activity, while valuable, has inherent limitations:

  1.  **Absence of the Consenting Party:** Students score hypotheticals. They lack the consenter's true internal state, subjective experience, cultural context, and relationship history. Real validity assessment requires empathy and context beyond vignettes.
  2.  **Adjudication by Committee:** Real-world validity is rarely decided by peer vote. It's typically assessed by individuals with specific standing (judges, ethics boards, clinicians) using professional judgement, precedent, and often formal guidelines, considering the consenter's perspective paramount. Our exercise flattens this authority and perspective.
  3.  **Simplification of Complexity:** Real consent situations involve nuance, ambiguity, and interacting factors beyond three dials (e.g., emotions, trust, past experiences, systemic power). The model is a drastic simplification.
  4.  **Static Snapshot:** It captures a moment of assent. Real consent can be ongoing, withdrawn, or situational, which the model doesn't easily capture.
  5.  **Lack of Consequences:** Students judge validity abstractly, divorced from the real-world harms of invalid consent or the burdens of excessive caution.

  **You must explicitly state these limitations** during the introduction and debrief. Emphasise the model is a *discussion tool*, not a decision procedure, and real-world application requires sensitivity to context, perspective, and consequences beyond the scores.

  **Reflexive Assessment of Consistency Test (Point 3):**

  The consistency test using crossing pairs **does not provide genuine evidence about which hypothesis is objectively "correct."** Its value is purely **dramatic and diagnostic**:

  1.  **Dramatises the Conflict:** It makes the abstract theoretical disagreement between compensability (Additive) and non-compensability (Floor) concrete and visible through conflicting predictions on real(istic) cases.
  2.  **Diagnoses Intuitions:** It reveals the structure of the students' *own pre-theoretical intuitions*. Do their individual judgements align more with one model than another? Where do tensions arise? Does the group aggregate lean towards thresholds or sums?
  3.  **Highlights Normative Stakes:** By forcing a choice or revealing a tension in judgements about specific cases (e.g., Jamie's loan vs Dakota's lease), it shows *why* the theoretical disagreement matters – it leads to different practical outcomes for real people.
  4.  **Motivates Theoretical Scrutiny:** Experiencing the tension or the counter-intuitive results of applying a model rigidly (like the trading round) motivates students to scrutinise the assumptions and implications of each hypothesis more deeply. It moves the discussion from "What does the theory say?" to "Why might this theory be right/wrong *given what we find plausible*?"

  **The exercise's worth lies in this experiential engagement:** transforming an abstract conceptual debate into a lived intellectual challenge where students discover the tensions within their own judgements and grasp the practical significance of theoretical commitments. It fosters critical reflection on the very structure of validity assessment.
