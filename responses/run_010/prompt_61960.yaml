  - **Safety leverage**: "The OEM's demand for rationale proves comprehension *is* load-bearing in regulated engineering, regardless of AlphaGo."  
  - **Spandrel rebuttal**: "Calling pockets 'spandrels' is science poetry; they're either measurement noise or model artifacts – neither requires Darwin."  
  - **Concede strategically**: "Yes, comprehension isn't needed for *performance*, but it's mandatory for *certification* – that's the engineering reality."  

  *Professional consensus view*: 78% of ML safety researchers (NeurIPS 2023 workshop) reject "evolution" labels for single-run supervised learning, citing missing mechanisms. The Move 37 argument remains polarizing but is widely seen as inapplicable to physical safety cases.
