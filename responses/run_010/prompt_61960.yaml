  ### Key Audit Notes
  1. **Evolutionary analogy breakdown**  
     - ✗ **Fatal flaw**: No heritability or cross-run lineage (violates Darwin's "descent with modification").  
     - △ **Partial match**: Stochastic variation exists but is guided (non-blind via gradients).  
     - △ **Fitness function**: Human-curated loss ≠ environmental selection (lacks emergence).  

  2. **Spandrels misapplication**  
     Gould required *historical contingencies* from evolutionary history (e.g., panda's thumb). Your pockets are likely:  
     - **Overfitting artifacts** (model capturing noise)  
     - **Training data ghosts** (echoes of simulation anomalies)  
     *Consensus*: Not spandrels without phylogenetic evidence (per ALife debates).

  3. **Move 37 diversion**  
     - Valid for *performance-only* contexts (Go has no safety audits).  
