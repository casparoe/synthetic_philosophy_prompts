  4. Reaching for a cookie but stopping: We take the stopping as evidence, not the initiation.
  5. Repeatedly fails at a goal: Recover the goal and attribute failure to lack of competence, not indifference.
  6. Same behavior as 3 but due to conditioning: Now we accept that the recovered reward (preference for work) is correct.

  Additionally, we have a case of pre-commitment (throwing out cigarettes, deleting an app) and a concern about the role of the agent's planning competence.

