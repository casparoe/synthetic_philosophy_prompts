  ### Worked Applications
  | case | kind of cycle | first step that decides it | outcome | admissible output | who decides | why I will not like it |
  |------|---------------|----------------------------|---------|-------------------|-------------|------------------------|
  | (a) Funding cutoff (15th vs 16th) | NIE (noise in estimates) | Step 6 | VP chooses which project to fund | hand to human | VP | Your favored project loses despite statistical tie; teams see outcome as arbitrary. |
  | (b) 20 small fixes vs. large migration | Methodological flaw (non-additive value) | Not in cycle steps¹ | Migration ranks above all fixes. Fixes not funded. | rank | n/a² | Migration funded even though bundle of fixes is objectively better; systemic risk persists. |
  | (c) Cycle breaks against your championed project | GAC (aggregation paradox) | Step 9 | Chair ranks your project last in the cycle | rank | chair | Your pet project (e.g., "Logging V3") is cut after 3 quarters of advocacy. |

  ¹ *Accumulation case note*: Pairwise comparisons cannot resolve this. Required pre-procedure fix: Group related small projects into "bundles" before scoring.  
  ² *Not applicable to cycle steps*; handled by project definition phase.

  ---

  ### Limitations and Failure Modes
  - **Misfires often at**:  
    - Step 5 (re-voting): Fatigue causes rubber-stamping original votes.  
    - Step 8 (Borda): Susceptible to strategic ranking (members game points).  
  - **Unreliable signals**:  
    - Step 4 (score audits): Teams often defend scores post-hoc to avoid rework.  
    - Step 7 (individual rankings): Members force transitivity artificially to avoid escalation.  
  - **Worsened by**:  
    - Vague project descriptions (amplifies NIE).  
    - >50 projects (increases cycle probability).  
    - Chair/VP overrides without transparency (erodes trust).  

  **→ Mitigation**: Audit cycle resolutions quarterly. Track how often Steps 6/9 are invoked.
