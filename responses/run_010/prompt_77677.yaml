  Okay, the user is part of an institute that funds computational modeling projects aimed at explaining specific historical events. They co-chair a review panel that's split between historians and modelers, leading to unhelpful scores based on disciplinary biases. The historians argue models can't explain singular events (tokens), only types, while modelers criticize narrative history as unfalsifiable. The user needs to establish criteria for what constitutes a valid explanation of a singular past event, with concrete requirements and distinctions.

  The user's explicit request is for a specification of what an explanation must deliver, focusing on phenomena like why an event occurred (contrastive explanation), why then (temporal specificity), and why there (spatial/localization). They want distinctions like token vs. type explanations, difference-makers vs. mere conditions, and the challenges of sparse evidence and tuned models. The user also wants to know which criteria are non-negotiable versus disciplinary preferences and if some criteria can't be jointly satisfied.

  The deeper need here is to resolve the interdisciplinary deadlock. The user needs a framework acceptable to both historians and modelers, ensuring funded projects meet rigorous standards. They might also be seeking validation that some expectations are impossible, which would itself be a useful insight for the panel. The mention of hard cases like overdetermined events or models tuned to outcomes suggests they want realism about limitations.

  I'll outline the core requirements for explaining singular events, drawing from philosophy of history and science. Key elements include specifying the explanandum precisely (avoiding vagueness), contrastive structure (why this rather than that), temporal/spatial localization, and difference-makers. Challenges like sparse evidence and non-repeatability must be addressed. I'll use concrete examples as requested, such as a harvest-price spike causing unrest in one province but not another.

  For distinctions, I'll emphasize token explanation (this specific event) vs. type (general patterns). I'll separate difference-makers (factors that actively contributed) from mere conditions (background factors). Also, I'll distinguish narratives consistent with sources from those actively supported by evidence, and intelligibility (making sense of the event) vs. significance (broader implications).

  Hard cases: Overdetermined events (e.g., multiple sufficient causes converging), generalizations requiring fixed conditions that changed (like a drought-response pattern failing when social structures shift), false beliefs (e.g., acting on misinformation), and event descriptions depending on later outcomes (e.g., a protest becoming "the first spark of revolution" retroactively). For models, I'll address tuning parameters to fit outcomes.

  For criteria assessment, non-negotiables include contrastive structure and evidence-based constraints. Disciplinary preferences: modelers favor mechanisms/generality, historians prefer narrative unity/source fidelity. The most exclusionary criterion is likely modal robustness (showing the event was necessary or contingent under conditions), as it's often unattainable with historical evidence.

  I'll argue that trade-offs are inevitable. For example, narrative coherence vs. mechanistic detail: a rich narrative may not specify mechanisms, while a model might sacrifice nuance. Modal robustness might be impossible without speculative evidence. The key insight is that perfection is unattainable—explanations are partial and should acknowledge limitations.

  Finally, I'll evaluate covering-law accounts (explanation via general laws), reasons-based accounts (explaining actions through beliefs/desires), and narrative accounts against the criteria. Covering-law struggles with token events and contrastive questions. Reasons-based handles "why that action" well but may miss structural factors. Narratives excel at coherence and temporal structure but can be unfalsifiable. All have strengths and weaknesses; the panel should focus on which aspects are essential for their specific projects.

  The conclusion will emphasize that a good specification accepts these trade-offs. For the panel, acknowledging that no explanation meets all ideals can guide more constructive reviews, prioritizing clarity on explanandum, difference-makers, and evidence integration over disciplinary biases.
answer: |-
  Explaining a singular, non-repeatable historical event is a distinct epistemic challenge, demanding criteria rooted in the nature of the explanandum and the limitations of historical evidence. Your panel’s impasse reflects genuine philosophical tensions, not mere taste. Let’s build the specification concretely.

  First, the **explanandum must be precisely characterized**. "Why did the harvest-price spike in Province A cause unrest?" is inadequate. It must specify *what kind of unrest* (peasant riots? urban bread riots?), *when* (which harvest year? over what duration?), *where* (which towns? the countryside?), and crucially, **the contrast class**: Why unrest *here* but not in Province B facing a larger spike? Why *this season* but not last season with a similar spike? An explanandum like "mass unrest" is a mere description; specifying "widespread, coordinated attacks on granaries in Province A's northern districts in the autumn of 1623, absent in Province B despite a worse harvest" makes it a specific puzzle demanding explanation. This precision is non-negotiable; without it, one cannot assess if an explanation fits the actual event or a vague abstraction.

  Any candidate explanation must then deliver several things:
  1.  **Identify Difference-Makers:** It must isolate factors that *made a difference* to the outcome occurring *here and now*, versus factors that were merely present or necessary background conditions. Oxygen was present for the palace economy's collapse, but it wasn't a *difference-maker*. The historian-modeler split often collapses this distinction. A model showing crop failure *could* cause collapse doesn’t show it *did* here, nor why collapse happened *here* and not elsewhere with similar failure. The hard case is **overdetermination**: Imagine three factors (e.g., drought, trade route collapse, dynastic strife) present in the eastern Mediterranean collapse; each alone *might* have been sufficient. An explanation must show how they converged and interacted *in this case*, not just list possibilities. It must grapple with whether the collapse would *still* have happened if one factor were absent, even if it cannot definitively prove the counterfactual.
  2.  **Provide Contrastive Structure:** It must address "why this *rather than* that?" – why unrest *in A* but not B? Why the epidemic stalling *in this valley*? This requires identifying what was *different* in the contrasting cases. Merely listing factors present in A isn’t enough; the explanation must show why those factors (or their absence in B) *mattered* for the specific outcome difference. The hard case is **false beliefs**: Why did a general act on faulty intelligence? The explanation must show how those specific beliefs, *though false*, were the difference-maker leading to *this* defeat, rather than a different outcome that *would* have occurred with accurate intelligence.
  3.  **Situate Temporally and Spatially:** "Why then?" and "Why there?" demand sensitivity to chronologies and local contexts. Why did the harvest spike cause unrest *this year* but not last year? Perhaps because grain reserves were depleted, or militia were distracted elsewhere *this year*. Why *this valley* stalled the epidemic? Perhaps its unique settlement pattern created natural bottlenecks *at that specific stage* of the epidemic’s spread. The hard case is the **shifting event description**: Consider a protest initially seen as a local grievance that later historians label "the first spark of revolution." The explanandum depends on later significance. An explanation must either focus on the event *as understood contemporaneously* (why *this* protest happened *then*) or explicitly justify the retrospective description and explain the event *under that description* (why did *this* become a spark?).
  4.  **Respect the Evidence Base:** Any explanation must be constrained by the available evidence – sparse, non-experimental, mediated, often produced by interested parties. It cannot posit factors entirely unsupported or contradicted by the record. A "narrative consistent with the sources" (one possible story fitting the facts) is weaker than a "narrative the sources support" (where evidence actively points to this story being more plausible than alternatives). This is a non-negotiable boundary condition. The hard case for models is **fitting to outcome**: A model reproducing the valley epidemic stall *only* after parameters are tuned to match the outcome is suspect. It risks being a sophisticated curve-fitting exercise, no more explanatory *of this token event* than a chronicle describing the stall. To be evidence, the model must either use parameters fixed *independently* of the outcome (e.g., from climate data, demographic studies of the valley *not* based on the epidemic outcome) or demonstrate *robustness* – the stall occurs across a plausible range of parameters, not just the finely-tuned set. Otherwise, it merely shows the outcome *could* happen this way, not that it *did* or *why it did here*.
  5.  **Make the Event Intelligible:** This is the core demand: rendering the event non-arbitrary, showing how it followed (not necessarily inevitably) from antecedent conditions and processes. This often involves mechanisms – causal pathways linking causes to effects. However, "mechanism" is contested. Historians often see it as detailed processes (e.g., how rumors spread panic triggering riots). Modelers often see it as formalized rules generating the outcome. The key is showing *how* the difference-makers produced *this* outcome. The hard case is the **ceteris paribus generalization**: Historians rely on generalizations like "severe price spikes *tend to* cause unrest, *ceteris paribus*." But *ceteris* are rarely *paribus*; the provisos are open-ended ("unless strong social controls exist," "unless blame is deflected," etc.). An explanation must show why the generalization held (or didn't hold) *in this specific instance*, closing the relevant *ceteris paribus* clauses for *this* case (e.g., showing why social controls *were* weak in A but strong in B). A model might achieve this by instantiating the mechanisms, but it must be shown to fit *this* case, not just any case where the generalization applies.

  **Non-Negotiables vs. Preferences:**
  *   **Non-Negotiables:** Precise explanandum specification (including contrast), evidence constraint, identifying plausible difference-makers, achieving basic intelligibility. Without these, it’s not an explanation *of that event*.
  *   **Disciplinary Preferences:**
      *   *Modelers:* Strong preference for generality/subsumption under laws (even probabilistic), explicit mechanisms (formalized), replicability, modal support (showing necessity/contingency via multiple runs).
      *   *Historians:* Strong preference for narrative unity/coherence, source fidelity, understanding reasons/beliefs of agents, context sensitivity, significance ("what turned on it"). Modal claims (counterfactuals) are often viewed with suspicion.
  *   **The Most Exclusionary Criterion:** **Modal Support / Robustness** – demonstrating that the outcome was necessary, contingent, or likely *given the conditions*. This is incredibly hard for singular events. Historians often lack the evidence for robust counterfactuals. Models *can* generate modal insights (e.g., "the collapse only occurs when these 3 factors align in the model"), but demonstrating that the model's modal structure accurately reflects the *real historical possibilities* is exceptionally difficult with sparse data. It often requires assumptions that historians find unjustified. This criterion, if demanded strongly, excludes most historical explanations.

  **Can All Criteria Be Jointly Satisfied?** Perfectly? Almost certainly not for complex historical events, and this is the crucial finding. The demands of **token-level specificity** (this exact event, with its unique context), **contrastive power** (why not the alternative?), **evidence constraint** (limited, messy data), **intelligibility via mechanisms/reasons**, and **modal robustness** (showing necessity/contingency) pull in different directions. Achieving deep mechanistic detail and strong modal claims often requires simplifying assumptions that sacrifice historical specificity or ignore inconvenient evidence. A rich, source-driven narrative explaining the agents' reasons may capture specificity and intelligibility but struggle to demonstrate modal robustness or isolate precise difference-makers amidst complex context. A well-tuned model might show robustness and mechanisms but risk being insufficiently constrained by the specific historical record or failing to capture the meaning-laden actions of historical agents. **Trade-offs are inevitable.** The best explanations acknowledge these limitations, clearly stating what they *can* deliver (e.g., "this model shows how such stalling *can* occur given plausible valley demographics, consistent with the sparse parish records") and what remains speculative or unresolved.

  **Verdict on Types:**
  *   **Covering-Law:** Struggles profoundly with token events. General laws (even ceteris paribus) are too blunt. It collapses the token/type distinction and fails on contrastive "why here/why then?" and difference-making. It fares poorly against most criteria except perhaps generality (a preference, not core).
  *   **Reasons/Agential:** Excels at making specific actions intelligible ("why did *this* leader order *that*?") and respects source-driven narratives. It handles contrast ("why this action, not that?") well for individual choices. However, it can struggle with structural difference-makers, broad temporal/spatial questions ("why the *widespread* unrest?"), modal robustness, and integrating complex systemic factors like climate models. It risks neglecting the "merely present" background conditions enabling the action.
  *   **Narrative:** Excels at temporal structure, context, holistic intelligibility, and often significance. It can integrate diverse factors (reasons, structures, events) meaningfully. However, it can be less precise on specific difference-makers versus conditions, struggle with rigorous contrastive focus ("why here not there?"), be vulnerable to unfalsifiability charges (multiple consistent narratives possible), and find modal claims difficult to substantiate beyond plausibility.

  The core insight for your panel is this: Explaining singular historical events is inherently partial and perspectival. A good specification won't magically reconcile historians and modelers, but it can force both to articulate *which aspects* of explanation their project prioritizes and *how* it tackles the inherent tensions and limitations. The goal should be plausible, evidence-constrained accounts that make the specific event more intelligible by identifying plausible difference-makers within its unique context, not the illusion of complete, law-like certainty. Acknowledge the trade-offs, demand clarity on the explanandum and contrast, insist on evidence constraints, and accept that modal robustness is often a bridge too far. The specification itself, by making these demands and limitations explicit, becomes a tool for more focused, productive (if still difficult) evaluation.
