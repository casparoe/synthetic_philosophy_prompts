answer: |-
  Here’s a defended agenda for your seminar, structured around open questions, ranked and justified against your criteria. I’ll be explicit about trade-offs, exclusions, and fragility.

  ### Core Criteria Weighting
  1. **Downstream weight (DW)**: Prioritized (40%). Determines real-world impact on non-citizens, future generations, and transnational actors.  
  2. **Tractability (T)**: Secondary (35%). Ensures concrete progress per session; avoids abstract stalemates.  
  3. **Neglectedness (N)**: Tertiary (25%). Focuses on underexplored angles where interdisciplinary input can shine.  
  *Trade-off*: When DW and T conflict (e.g., highly impactful but intractable questions), I prioritize T slightly to maintain momentum. Neglectedness breaks ties when DW/T are close.

  ---

  ### Ranked Questions & Session Order
  *(Justifications follow each entry)*

  1. **Session 1: Foundational Authority**  
     *Question: Can a demos legitimately constitute itself without presupposing prior membership rules? If not, what non-democratic normative principles (e.g., reciprocity, coercion, moral agency) *must* ground the initial boundary?*  
     **DW**: Critical—all other boundaries presuppose this. Directly affects non-citizens’ inclusion.  
     **T**: High. Formalists can model "constitutional moments"; lawyers can analyze historical cases (e.g., founding enfranchisement).  
     **N**: Underexplored in *practical* terms—most theories assume rather than justify foundations.  

  2. **Session 2: Coercion vs. Affected Interests**  
     *Question: Does the "coercion principle" resolve circularity better than "all-affected" by limiting regress? Or does it arbitrarily exclude stakeholders (e.g., climate-vulnerable non-residents)?*  
     **DW**: Highest for migration law/climate policy. Tests if coercion can protect non-citizens from arbitrary exclusion.  
     **T**: High. Social choice tools can map coercion networks (e.g., graph theory of power relations).  
     **N**: Coercion is debated but rarely tested against affectedness *formally*.  

  3. **Session 3: Temporal Binding & Future Generations**  
     *Question: Can a present demos bind future demoi without democratic authorization? If not, what institutions (e.g., trusteeship, constitutional constraints) mitigate this?*  
     **DW**: Core for climate policy, sovereign debt.  
     **T**: Moderate. Formalists can model intertemporal preferences; lawyers can dissect legal precedents (e.g., rights of nature).  
     **N**: Future generations are fashionable, but *procedural* solutions remain scarce.  

  4. **Session 4: Transnational Rule-Makers**  
     *Question: When non-state actors (e.g., ICANN, WTO) make coercive rules, must affected parties have input? Does this require new demoi or reforming existing ones?*  
     **DW**: Directly targets private authority across borders.  
     **T**: Moderate. Case studies (e.g., EU data laws affecting foreigners) + social choice analysis of multi-level governance.  
     **N**: Under-theorized in political theory; lawyers offer concrete examples.  

  5. **Session 5: Path Dependence & Boundary Change**  
     *Question: How do existing boundaries distort democratic reform (e.g., citizens vetoing inclusion of non-citizens)? Can "meta-rules" for boundary revision escape path dependence?*  
     **DW**: Explains stability of exclusion (e.g., long-term residents).  
     **T**: High. Game theory models of voting rule changes; historical path dependence (e.g., suffrage expansions).  
     **N**: Rarely framed as a game-theoretic trap.  

  6. **Session 6: Nested Demoi & Exit/Voice**  
     *Question: Can a system of overlapping demoi (local/global) resolve boundary issues via "exit" options? Or does exit merely displace coercion (e.g., migrants choosing states)?*  
     **DW**: Affects federalism, supranational bodies, and migration.  
     **T**: High. Formalists can analyze exit costs; lawyers can compare free movement regimes.  
     **N**: Exit/voice dynamics are undertheorized in boundary debates.  

  7. **Session 7: Fixed-Points vs. Typed Hierarchies**  
     *Question: Can a membership rule be a fixed-point (stable under its own application)? Or must we accept a typed hierarchy (first-order demos, second-order rule-makers) with inevitable regress-stopping?*  
     **DW**: Determines if boundary-setting can ever be truly democratic.  
     **T**: Moderate. Formalists can model self-referential rules (e.g., recursive functions); theorists assess normative costs.  
     **N**: Your self-application reframing is fresh and unexamined.  

  8. **Session 8: Meta-Question: Is the Regress Pathological?**  
     *Question: Is the boundary problem an unsolvable paradox revealing democracy’s limits, or a misdiagnosis that dissolves with better institutional design?*  
     **DW**: Answers dictate whether we seek solutions or manage inevitabilities.  
     **T**: Low (conceptual), but positioned here to synthesize prior sessions.  
     **N**: Forces interdisciplinary reflection.  

  ---

  ### Exclusion of Two Over-Discussed Questions  
  1. **"All-Affected Principle" as a Standalone Solution**  
     *Why Excluded*: Intractable (who counts as "affected"?), and debates are circular. Downstream impact is low because it either collapses into coercion or becomes impossibly vague. Neglectedness is near-zero.  
  2. **"Demos Prior to Constitution" (Ethnonational/Cultural Arguments)**  
     *Why Excluded*: Regress-stopper by fiat. Settling this changes nothing—it’s a normative choice disguised as a solution. Downstream impact is nil; it merely restates the problem.  

  ---

  ### Taking a Stand: Self-Application Reframing  
  **Your suspicion is correct and promising**. The regress *is* fundamentally a problem of self-application, and a typed/fixed-point approach clarifies where normativity enters.  
  - **Dead End? No**—but the formal frame must *reveal* normative injections, not hide them.  
  - **First Non-Trivial Result**: A fixed-point membership rule (e.g., "Include all who recognize reciprocal obligations with current members") tested for stability under iteration. If it converges, coercion/affectedness debates become about defining "obligations" (exposing normative choices).  
  - **Bears On**: Foundational Authority (Session 1), Path Dependence (Session 5), and Fixed-Points (Session 7).  

  **What’s Lost?** The emotional resonance of "self-determination" risks being technocratized. But this is a *gain*: it isolates coercion’s normative core.  

  ---

  ### Fragility & Self-Critique  
  1. **Dominant Criterion**: Downstream weight (40%). Sessions 2-4 could swap order, but DW anchors them.  
  2. **Reversible Judgment**: Session 5 (Path Dependence) might precede Session 3 (Temporal Binding) if participants emphasize historical exclusion over future risks.  
  3. **Key Vulnerability**: Session 7 (Fixed-Points) may be too abstract if formalists dominate. Mitigation: Require concrete examples (e.g., EU accession rules).  
  4. **Normative Tension**: I slightly favored tractability over neglectedness (e.g., excluding "all-affected"). Under pressure, I’d reinstate "all-affected" *only* if reframed as a coercion-affectedness hybrid (Session 2).  
  5. **Least Confident**: Session 8 (Meta-Question). It risks becoming a recap. Solution: Assign pre-session reflections on "Which argument from Weeks 1-7 is strongest/weakest?"  

  ### Summary Logic  
  The sequence **ascends from foundations (1) to applications (2-6) to meta-frameworks (7-8)**, forcing each session to build on prior unresolved tensions. By excluding well-rehearsed questions, you reserve energy for:  
  - Lawyers testing theories against migration cases (Sessions 2,4,6)  
  - Formalists modeling path dependence/self-application (Sessions 5,7)  
  - Theorists isolating normative "infection points" (Sessions 1,8)  

  This order honors your mandate: *"The series must advance arguments, not survey literature."*
