  ### Analysis of Professor R.'s Determinism Criterion

  Professor R.'s rulings on the ten systems reveal a consistent criterion for determinism that emphasizes the *metaphysical completeness* of the laws and the *sufficiency of the state* to uniquely determine the entire future evolution. Specifically, a system is deterministic if and only if, for every possible state in the state space, the laws of the system uniquely determine the state at all future times, and the solution exists for all future times. This criterion has three key components:
  1. **Global existence**: The solution must be defined for all future times; it cannot "run out" or cease to exist in finite time.
  2. **Uniqueness of future evolution**: The state at any time must uniquely fix the entire future trajectory; multiple futures from the same state violate determinism.
  3. **State-law sufficiency**: The state must contain all information necessary for the laws to operate; if the state is inadequate to determine the future (e.g., due to underdetermination by the laws), the system is non-deterministic.

  This criterion treats determinism as a *metaphysical* property (about how the world is governed) rather than an epistemic one (about what we can know or compute). It is a feature of the *laws together with the state space*, not laws alone or states alone. It requires histories to extend indefinitely in time; finite-time blow-up or cessation of evolution violates determinism. Crucially, it does not require:
  - **Continuous dependence on initial data**: Chaos (e.g., Lorenz) and sensitivity to initial conditions are compatible with determinism.
  - **Recoverability of the past**: Non-invertible evolution (e.g., heat equation) is acceptable.
  - **Exceptionless statistical regularities**: Randomness in measurement (e.g., quantum decay) may be epistemic.
  - **Computability or predictability**: Incomputable futures (e.g., cellular automata) are irrelevant.

  ### Evaluation of Tempting Criteria
  Several intuitive criteria are ruled out by Professor R.'s rulings:
  - **Lipschitz ODEs (co-author's proposal)**: Misclassifies (3) cellular automaton (not ODEs), (5) PRNG (discrete), and (10) heat equation (PDE). Also, it correctly classifies (8) dome (non-Lipschitz, non-unique) as non-deterministic but fails to explain (9) five masses (Lipschitz locally) or (6) quantum (stochastic).
  - **Continuous dependence on initial data**: Ruled out by (2) Lorenz model (chaotic, sensitive dependence) classified as deterministic.
  - **Recoverability of the past**: Ruled out by (10) heat equation (past not unique) classified as deterministic.
  - **Exceptionless statistical regularities**: Ruled out by (6) quantum (irreducible randomness) classified as non-deterministic, while (7) pilot-wave (same statistics, but deterministic) is yes.
  - **Law-governedness alone**: Ruled out by (8) dome and (9) five masses, which are law-governed but non-deterministic due to state-law insufficiency ("nothing to determine") or solution non-existence ("laws run out").
  - **Epistemic predictability**: Ruled out by (3) cellular automaton and (2) Lorenz, where unpredictability is deemed irrelevant.

  All ten rulings are consistent with the proposed criterion (global unique future evolution for all states). No tensions exist among the verdicts under this criterion.

  ### Application to the Three Remaining Entries
  Using the criterion, the verdicts for the new systems are:

  1. **Classical massless field (wave equation) with computable initial data but incomputable future value**  
     - **Verdict**: Deterministic.  
     - **Reasoning**: The wave equation is a linear hyperbolic PDE. For any initial state (field profile and derivative) in a suitable function space (e.g., Sobolev), unique global solutions exist for all time. The non-computability of a field value at a later point is epistemic (about our ability to calculate) and does not affect the unique metaphysical determination of the future by the state and laws. This aligns with R.'s view in (2) Lorenz and (3) cellular automaton, where chaos and incomputability are "facts about us."  
     - **Pressure from prior rulings**: (8) dome emphasizes state-law sufficiency (here met); (9) five masses requires global existence (here satisfied); (7) pilot-wave shows determinism is metaphysical, not epistemic.

  2. **Ideal billiard with non-computable initial position**  
     - **Verdict**: Deterministic.  
     - **Reasoning**: The system has unique, well-defined trajectories for all initial states (position and velocity) in the state space, assuming smooth convex obstacles and no exotic dynamics (e.g., no finite-time blow-up or non-unique paths). The non-computability of the initial position is epistemic, like the incomputable state in (3) cellular automaton, and does not undermine the unique future evolution. The trajectory is defined for all time.  
     - **Pressure from prior rulings**: (4) coin/die and (1) pendulum show Newtonian systems can be deterministic with unique evolution; (9) five masses warns against solutions that "run out" (here avoided by problem's assurance of unique, non-exotic dynamics).

  3. **3D Navier-Stokes equations with smooth initial data (unknown global existence)**  
