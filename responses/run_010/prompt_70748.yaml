     - **Pressure from prior rulings**: (9) five masses mandates global existence ("laws run out"); (10) heat equation shows well-posed PDEs can be deterministic, but Navier-Stokes is ill-posed in this sense; (6) quantum emphasizes that indeterminism arises from system properties, not ignorance.

  ### Best Guesses and Reasoning
  - **Wave equation**: Best guess is deterministic. The wave equation is provably well-posed globally, satisfying the criterion. Non-computability is irrelevant per (3) and (2).
