prompt: |-
  So, no science background here, never took a psych class, but a passenger of mine started talking about predictive processing and the free energy stuff about a year ago and I've been reading around it ever since, and it's kind of rewired how I think about what I actually do for a living. I'm a flight instructor, mostly instrument students, twelve of them at the moment, and I fly with each one two or three times a week. A huge chunk of the job is teaching people not to believe their own body once the horizon goes away — the leans, that turn-and-roll feeling that isn't there, the night departure over the water or over unlit terrain where your inner ear is dead certain you're pitching up into a stall when you're really nose-down and gathering speed.

  The standard spiel is "trust your instruments" and "keep the cross-check going," and it's not wrong, but it doesn't explain anything, and the students who need it most are the ones who nod along and then forty minutes later, tired and a little spooked, fly exactly what they feel. Which suggests to me that a slogan isn't competing with the body on the body's terms.

  The predictive processing picture seems to say something much more specific, and more useful: you never get the world raw, you get your model's guess, the senses mostly only speak up where the guess is wrong, and how much the guess versus the evidence gets to drive things depends on how reliable the brain currently rates each of them. If that's right, then the leans isn't a broken instrument in the head, it's my student's brain weighting a very confident wrong guess above weak noisy evidence — and there ought to be a drill that actually shifts that weighting, rather than one that just repeats a rule at them.

  Can you turn that into a procedure I could teach? Some constraints from my end:

  - It has to survive being briefed in about fifteen minutes before a flight, and it has to be runnable by a tired non-scientist in a cockpit, alone, later, when I'm not in the right seat.
  - Give it as ordered steps or checks, with the actual words to say out loud where speaking helps, and say what counts as having passed each one versus just gone through the motions.
  - Mark clearly where the procedure runs out and it's a judgment call that I or the student has to own — including anything that's really about values or risk appetite rather than about perception.
  - Tell me which distinctions from the theory have to survive the simplification because the drill breaks without them, which ones you dropped as decoration, and — this is the part I really want — where the theory is not doing any work at all and I'd get the same result from ordinary instruction. I'd rather know that than have it dressed up in fancy language.

  Then run it on three cases:

  1. A student in the sim who is genuinely, sincerely level in a coordinated bank and reports feeling perfectly fine, and won't believe the attitude indicator.
  2. A pilot who's been hand-flying, then engages the autopilot on a long night leg, and eight minutes later the aircraft starts doing something he did not expect and did not command.
  3. A case where the procedure gives an answer I don't want — I'm thinking something like the pitot or the static side icing up so that several instruments all agree on the same false story, which is exactly the situation where "trust your instruments" is the wrong advice. Show me what the procedure says there and whether it can even detect that it's being fooled.

  One more thing: please don't hand me a reading list or name papers and researchers at the end. I can't chase any of that down and I wouldn't trust myself to get the names right anyway. Just use the ideas well and tell me where they stop applying.
reasoning: |-
  Okay, the user is a flight instructor dealing with instrument students who struggle with sensory illusions during flight. They've been exploring predictive processing theory as a way to better understand why standard "trust your instruments" advice often fails. They want a practical, actionable procedure based on this theory that can be taught quickly and used independently by students in real cockpit situations.

  Hmm, the core issue here is that physiological sensations during flight often override instrument readings, especially when students are tired or stressed. Predictive processing offers a useful framework: the brain prioritizes its predictions over sensory input when it considers those predictions highly reliable. In aviation illusions, the body's signals (like inner ear sensations) generate extremely confident but wrong predictions about aircraft attitude.

  The user needs a concrete method to help students recalibrate how much weight they give to bodily sensations versus instruments. The challenge is making this both theoretically sound and practically usable by non-scientists in high-stress environments. Key constraints: brief pre-flight explanation, clear step-by-step actions, explicit success criteria, and demarcation where judgment calls begin.

  For the procedure itself, it should focus on three key principles from predictive processing: 1) All perception is inference (never direct reality), 2) Confidence determines weighting, 3) Evidence must accumulate where predictions fail. These can't be simplified away without losing effectiveness. Less crucial are terms like "free energy minimization" - the core mechanism matters more than the terminology.

  The cases presented are excellent tests: the first demonstrates total trust in false bodily predictions; the second shows autopilot-induced prediction errors; the third is the critical case where instruments collectively lie. This last case is where the procedure must explicitly avoid blind instrument trust.

  Notably, the user wants full transparency about where the theory adds value versus where standard instruction would suffice. They're clearly wary of academic jargon without practical payoff. The rejection of reading lists reinforces their focus on immediately applicable tools.

  For implementation, the procedure should use active language and physical actions (like touching instruments) to ground the cognitive process. Speaking aloud helps override automatic responses. Success metrics must be observable - not just verbal compliance but behavioral change under stress.

  The icing scenario is particularly important to address well. Here the procedure must trigger suspicion when all instruments agree but the body's prediction strongly contradicts them - essentially teaching students to notice when their "prediction error" feels physically undeniable despite instrument consensus.
answer: |-
  Here's a flight-ready procedure based on predictive processing ("PP"), designed for your constraints. It replaces "trust your instruments" with "calibrate your confidence." The core PP insight driving this is: **Your feeling *is* data, but it's low-confidence data when the horizon is gone. Your instruments are *also* data. The key is correctly assigning *confidence weights* to each source.**

  **Procedure Name: CALIBRATE Confidence (Attitude Assessment)**

  **Pre-Flight Briefing (15 mins):**
  *   **The Core Idea (3 mins):** "When we fly visually, your brain builds its model of 'level' using your eyes and inner ear together. Under the hood, your inner ear *alone* is easily fooled – it's built for ground-level balance, not flight. It reports sensations like 'leaning' or 'pitching up' with *high confidence* even when it's dead wrong. Your instruments report actual aircraft attitude, but the *brain* sees them as new, complex, and initially 'noisy' data it doesn't trust as much. Our job is to deliberately *lower* the brain's confidence in unreliable body signals and *raise* its confidence in instrument scans. We don't ignore feelings; we recognize them as *high-confidence-but-often-wrong guesses*, and we use the instruments to prove those guesses wrong."
  *   **The Steps (10 mins):** Walk through the CALIBRATE steps below. Emphasize speaking aloud.
  *   **The Boundary (2 mins):** "This procedure tells you *what* to look at and *how* to weigh the evidence to know your attitude. *What you do next* (e.g., push vs. pull, left vs. right bank) is your judgment and skill. Also, if *all* your instruments suddenly agree on something that feels catastrophically wrong (like nose-down when you feel a stall), that's a red flag – the procedure helps spot that, but resolving it requires emergency training (e.g., partial panel, unreliable airspeed)."

  **The CALIBRATE Procedure (Ordered Steps):**

  1.  **Catch the Feeling:** *As soon as you feel an unexpected attitude (leans, pitch illusion, disorientation) OR when you suspect you might be drifting (e.g., after autopilot disconnect, long hand-flying):*
      *   *Say Aloud:* "Feeling [State the feeling: e.g., 'Leaning Left', 'Pitching Up']."
      *   *Why (PP):* Acknowledges the high-confidence prediction (the feeling) is present. *Must survive.*
      *   *Pass/Fail:* You specifically named the bodily sensation triggering your concern. Going through motions = just saying "I feel weird."

  2.  **Acknowledge the Guess:** *Immediately after Step 1:*
      *   *Say Aloud:* "That's my body's *best guess*. It might be wrong."
      *   *Why (PP):* Explicitly labels the feeling as a *high-confidence prediction*, not reality. Lowers its weight mentally. *Must survive.* This is the core shift from "sensation = truth" to "sensation = hypothesis".
      *   *Pass/Fail:* You articulated that the feeling is just a guess. Going through motions = skipping this or saying it without conviction.

  3.  **Load the Instruments:** *Look deliberately at the PRIMARY attitude instruments (Attitude Indicator, Turn Coordinator/Ball, Heading Indicator). Scan them systematically.*
      *   *Say Aloud:* (While scanning) "Loading Instruments: Attitude [State], Turn [State Coord/Uncoord, Rate], Heading [State]."
      *   *Why (PP):* Forces gathering *independent evidence* to test the body's prediction. "Loading" implies inputting data. *Must survive* the systematic scan and verbalization.
      *   *Pass/Fail:* You verbally stated the raw readings from the core attitude instruments. Going through motions = glancing vaguely at the panel without stating specific values.

  4.  **Identify the Mismatch:** *Compare the instrument readings directly to your stated feeling from Step 1.*
      *   *Say Aloud:* "Mismatch: Feeling [Repeat Feeling] but Instruments show [State Key Instrument Reading contradicting feeling, e.g., 'Wings Level', 'Coordinated', 'No Pitch Change']."
      *   *Why (PP):* Explicitly generates "prediction error" – the difference between the body's confident guess and the instrument evidence. This is where learning happens. *Must survive.*
      *   *Pass/Fail:* You clearly stated *how* the instruments contradict your bodily sensation. Going through motions = stating readings without contrasting them to the feeling.

  5.  **Rate the Evidence:** *Assign a conscious confidence rating (1-5, Low-High) based on instrument reliability IN THIS MOMENT.*
      *   *Say Aloud:* "Confidence: Body Feeling [Rate 1-5, e.g., '1 - Low'] (Horizon gone!). Instruments [Rate 1-5, e.g., '5 - High'] (Scanned, stable)."
      *   *Why (PP):* This is the *critical weighting step*. Forces explicit metacognition about reliability. Grounds instrument confidence in the *action* (scanning) just performed. Grounds body *low* confidence in its *known failure mode* (no horizon). *Must survive.*
      *   *Pass/Fail:* You assigned a number/level *and* gave a *reason* for each rating (even if brief: "no horizon", "just scanned"). Going through motions = assigning numbers without reasoning.

  6.  **Trust the Weight:** *Based on Step 5, declare which source wins.*
      *   *Say Aloud:* "Trusting Instruments. Attitude is [State Correct Attitude based *only* on instruments]."
      *   *Why (PP):* Forces commitment to the higher-confidence evidence. *Must survive.*
      *   *Pass/Fail:* You explicitly stated you are trusting the instruments and stated the *actual* aircraft attitude *as shown by instruments*. Going through motions = saying "trust instruments" but not stating what they *say* the attitude is.

  7.  **Execute & Verify:** *Fly the aircraft to maintain or achieve the correct attitude based *only* on instruments. Perform another quick scan (verbalize key parameters silently or aloud).*
      *   *Say Aloud (Optional but helpful):* "Flying [State Action: e.g., 'Level Wings', 'Reduce Pitch']. Verify: [Key Instrument Reading]."
      *   *Why (PP):* Completes the loop. Acting on the high-confidence evidence should reduce the prediction error over time (the feeling *should* fade as the brain updates). Verification reinforces instrument reliability. *Judgment Call Starts Here:* *What* control inputs to make is pilot skill/experience. *Risk Appetite Starts Here:* How aggressively to correct, considering altitude, traffic, etc.
      *   *Pass/Fail:* You made *appropriate control inputs* based on the declared correct attitude. Going through motions = stating an action but not doing it effectively, or not verifying.

  **Where Theory Works & Where It Doesn't:**

  *   **Must Survive Simplification:** The core distinctions that *make the procedure work* are:
      *   Feelings as High-Confidence *Predictions/Guesses* (not raw truth) - (Steps 1 & 2).
      *   Explicit *Mismatch Identification* (Step 4).
      *   Explicit *Confidence Rating* based on *reliability conditions* (Step 5 - "Horizon gone" / "Just scanned").
      *   *Trust* linked to *weighting* (Step 6).
  *   **Dropped as Decoration:** Terms like "Generative Model," "Free Energy," "Precision Weighting." The *mechanism* (weighting based on reliability) is vital, the specific PP jargon isn't needed in the cockpit.
  *   **Theory Not Doing Work / Same as Ordinary:** Steps 3 (Scan Instruments) and 7 (Fly the Aircraft) are standard good airmanship. The *unique value* of PP is in Steps 1, 2, 4, 5, and 6 – reframing the feeling, forcing mismatch detection, and forcing explicit confidence weighting. This targets the *cognitive root* ("my feeling is highly confident reality") better than just "trust instruments."

  **Running the Cases:**

  1.  **Student in Sim (Feels Level in Coordinated Bank):**
      *   **C:** "Feeling Perfectly Level."
      *   **A:** "That's my body's best guess. It might be wrong." (Crucial! They feel fine, but procedure forces acknowledgment of potential error).
      *   **L:** "Loading Instruments: Attitude [e.g., 30° Bank], Turn [Coordinated, Rate 1], Heading [Changing]."
      *   **I:** "Mismatch: Feeling Level but Instruments show 30° Bank."
      *   **R:** "Confidence: Body Feeling 1 (Horizon gone!). Instruments 5 (Scanned, stable)."
      *   **T:** "Trusting Instruments. Attitude is 30° Bank."
      *   **E:** "Flying: Reducing Bank. Verify: Attitude [e.g., 20° Bank]." (Judgment: *How much* to reduce bank? Skill/Experience).
      *   *Why it works:* Forces them to confront the *evidence* contradicting their confident feeling and explicitly downgrade body confidence. "Feeling fine" becomes the *problem* to analyze, not reality.

  2.  **Pilot After Autopilot Engages (Unexpected Behavior):**
      *   **C:** "Feeling [e.g., Rolling Right / Pitching Down]." (Body senses unexpected motion).
      *   **A:** "That's my body's best guess. It might be wrong."
      *   **L:** "Loading Instruments: Attitude [State], Turn [State], Heading [State]." (Critical: Did AP mode change? Is FD commanding something? Check AP status!).
      *   **I:** "Mismatch: Feeling [Rolling Right] but Instruments show [Wings Level / Turn Coordinator centered]." OR "Mismatch: Feeling [Pitching Down] but Altimeter/VSI show [Climbing]." OR "Mismatch: Autopilot Mode is [e.g., VNAV DESCENT] - *that's* the command."
      *   **R:** "Confidence: Body Feeling 1 (Was passive, inner ear lag/error). Instruments 5 (Scanned, AP engaged)." OR "Confidence: AP Mode [X] 5 (Just engaged/verified)."
      *   **T:** "Trusting Instruments / Autopilot Mode. Aircraft is [State actual attitude/mode]." OR "Trusting Autopilot Mode. Command is [e.g., Descent]." (Judgment: Monitor vs. Disconnect AP?).
      *   **E:** Monitor instruments closely. Verify expected performance (e.g., VSI decreasing if in DESCENT). Take control if necessary.
      *   *Why it works:* Prevents panic reaction to body sensations immediately after AP engagement (common cause of accidents). Forces instrument scan and *AP mode verification* to find the *actual* command (the brain's prediction was based on passive flight, the AP introduced a new state). Explicitly rates passive body sensations as *low* confidence.

  3.  **Pitot/Static Icing (Instruments Lie, Body Might Be Right):**
      *   **C:** "Feeling Pitching Up / Stalling!" (Body senses high AOA/near stall).
      *   **A:** "That's my body's best guess. It might be wrong." (Procedure forces saying this, but...)
      *   **L:** "Loading Instruments: Attitude [May show nose-high], Airspeed [Decreasing/invalid], Altimeter [May freeze/erratic], VSI [May show climb/erratic]." (Scan reveals *multiple* instruments showing *consistent* but potentially erroneous data).
      *   **I:** "Mismatch: Feeling Stalling but Instruments show... [State readings, e.g., 'Nose High, Airspeed 90kts, Altitude Climbing']." (Note: Instruments *agree* with each other but contradict *catastrophic* body feeling).
      *   **R:** **Critical Step Here:** "Confidence: Body Feeling **3** (Feels *extreme*, like stall buffet/muscle sense?). Instruments **2** (Airspeed dropping *fast*? Altimeter/VSI mismatch? *All* disagree with engine power/flap setting? Icing conditions?)" **<-- JUDGMENT CALL BASED ON CONTEXT.**
      *   **T:** "**Cannot Trust Instruments! Suspect Pitot/Static Blockage.**" OR if body sensation is less extreme, "Trusting Instruments... cautiously. Verify Power/Flaps." (Judgment: Declare Emergency, Unreliable Airspeed Drill - **This is where procedure ends and emergency training takes over**).
      *   **E:** Execute Unreliable Airspeed / Partial Panel Emergency Procedure (Pitch + Power).
      *   *How it detects being fooled:* Step 5 (**Rate the Evidence**) is the key. The procedure forces the pilot to *explicitly consider the reliability context* (Icing? Sudden instrument failure? Extreme body feeling?) and *assign a confidence rating*. If the body sensation is *extremely compelling* (e.g., stall buffet, severe G-force mismatch) *and* the instrument context is suspicious (icing, rapid/implausible readings, known failures), Step 5 allows the pilot to consciously *downgrade instrument confidence* below body confidence. The explicit **Mismatch** step (4) also highlights that *all* instruments agreeing on something that *feels* catastrophically wrong is a red flag. **This is VASTLY superior to "trust your instruments," which would fail catastrophically here.** The procedure flags the need for emergency action.

  **Where the Procedure Stops Applying:**
  *   **Emergency Procedures:** Once unreliable instruments or other major failures are identified/suspected (like in Case 3), specific emergency drills take over. CALIBRATE helps *detect* the problem via Step 5.
  *   **Pure Judgment Calls:** Aircraft control inputs (Step 7), deciding to disconnect AP, declaring an emergency, terrain avoidance maneuvers – these require experience and training beyond the perceptual calibration.
  *   **Risk Management:** Accepting a slight deviation vs. aggressive correction, continuing vs. diverting – these are risk appetite decisions.
  *   **Non-Attitude Illusions:** While useful for spatial disorientation, this specific procedure targets attitude perception. It wouldn't directly address, e.g., approach illusions (black hole effect) which involve misjudging distance/altitude, though the core principles (rating evidence confidence) could be adapted.

  **Summary:** The CALIBRATE procedure leverages PP by making the brain's weighting process conscious and deliberate. It attacks the root problem (high confidence in faulty bodily predictions) by forcing explicit mismatch identification and confidence rating based on *why* sources are reliable/unreliable. It survives simplification by focusing on actionable steps and clear verbalizations, works when tired, and crucially, has a mechanism (Step 5) to flag situations where instruments *cannot* be trusted.
