prompt: |-
  So here's a problem I've got. I TA a Western Civ survey at a regional state school — 24 students, one 75-minute section, and we're in the second week of the Rome unit. The room has a projector that only works if you smack it, one whiteboard with a mostly dried-out tray of markers, and about a third of the class is over 30 and has opinions. On day one of the unit I asked cold, no warning, when Rome fell. Nine people said 476. The rest stared at me. Nobody had read the Gibbon excerpt I assigned. The syllabus then walks them through the two poles of the modern argument — Peter Brown's *World of Late Antiquity* on one side, Ward-Perkins's *Fall of Rome and the End of Civilization* on the other — plus a day on the non-political suspects (climate, plague, lead, whatever the archaeologists are fighting about this decade). What I've found is that my students can recite "it didn't fall, it transformed" back to me on the exam without having the slightest feel for why anyone would say such a thing, or what it would cost them to say it. They think the transformation people are just being contrarian.

  What I want is one class period built around a fake curatorial committee. Framing: the history department has been asked to write the wall text for a display case titled THE END OF ROME, and the committee owes the museum (a) one date for the plaque and (b) one sentence of justification, and the museum is not going to accept a comma-spliced compromise. Here's the mechanic I've half-sketched and want you to finish and improve on: every student gets a secret card that isn't a fact but a *criterion* — one particular thing that has to still be true for Rome to count as existing (a western emperor on the throne; a single treasury funding a standing army; a merchant who can travel safely from Britain to Egypt; a Senate still meeting in the city of Rome; Latin as somebody's first language; an eastern court that calls itself Rhomaioi; somebody who can be taxed from a center; a road network that gets repaired; and so on). They score by getting the committee's official date close to the date their own criterion actually dies, plus a bonus if the final justification sentence comes out in their criterion's vocabulary — but they aren't allowed to say out loud which card they hold until a moment you design for me. Then at some midpoint I hand every group the exact same pile of evidence slips, so nobody can win on facts, only on which facts they decide are load-bearing. My chair wants active learning documented for program review, so if it has a name I can put on the form, bonus.

  Give me the whole thing ready to run on Monday: the card list (I'm thinking 10–14, and please sanity-check the endpoint dates attached to each — I'm genuinely hazy on how late the Senate and the eastern self-designation survive, and I don't want to teach these people something wrong), group sizes, a minute-by-minute timeline that fits 75, materials printable on two pages max becuse we have no budget, a scoring scheme that works with poker chips or tally marks instead of real money, and the reveal structure. Then the debrief: map specific moments from the room onto the actual historiography — which students arguing for a single hard date were doing Gibbon without knowing it, which ones who kept dragging the conversation to pottery and living standards were doing Ward-Perkins, and what you say back to the kid who inevitably blurts out "wait, so there was no Rome to fall, that's obviously wrong." I also want the blunt part: which two or three things go sideways the first time you run this with actual undergrads and how you steer around them, and — honestly — what feature of the fall-versus-transformation debate this activity structurally *cannot* generate, so I know what I have to supply myself afterwards rather than pretending the game did it. One committed design, please: pick your card set, pick your reveal, defend the choices; I don't want a menu of three variants with the work left to me. American English, and assume I'm reading it on a phone in a parking lot.
reasoning: |-
  We are designing a single 75-minute class activity titled "Curatorial Committee: The End of Rome". The goal is to engage students in the debate about when Rome fell by having them argue for a specific date and justification based on a secret criterion. The activity will use a set of criterion cards (10-14) with associated historical endpoints, and evidence slips that all groups receive at a midpoint.

  ### Activity Structure
  **Title:** Curatorial Committee: The End of Rome  
  **Time:** 75 minutes  
  **Group Size:** 4 groups of 6 students (or adjust as needed for 24 students)  
  **Materials:** 
  - Criterion cards (one per student, 10-14 unique criteria)
  - Evidence slips (one set per group, identical to all groups)
  - Score sheet for each student (to record their criterion and track points)
  - Poker chips (or tally marks) for scoring: white for date proximity, blue for vocabulary bonus.

  **Learning Objective:** Students will understand that the "fall of Rome" is a historiographical debate centered on the criteria for what constitutes the end of Rome, and that different criteria lead to different dates and interpretations.

  ### Step-by-Step Timeline (75 minutes)

  1. **Introduction (10 minutes)**
     - Frame the activity: The history department has been asked to write a wall text for a museum display titled "THE END OF ROME". The committee (the class) must decide on:
       - (a) One date for the plaque.
       - (b) One sentence of justification.
     - Explain the rules:
       - Each student gets a secret criterion card (what must be true for Rome to exist). They cannot reveal their card until the designated time.
       - The class is divided into 4 groups (each group is a subcommittee). 
       - Each group must come to a consensus on a date and a justification sentence.
       - The whole class then must agree on one date and sentence (with one representative from each group forming a final committee if needed).
     - Scoring:
       - Each student scores points by how close the final committee's date is to the actual date their criterion ended (see scoring below).
       - Bonus: If the final justification sentence uses vocabulary related to their criterion.

  2. **Distribution and Silent Reading (5 minutes)**
     - Hand out one criterion card to each student. 
     - Students read their card and note their criterion and its endpoint date (which they must keep secret). They also get a score sheet to record their criterion and later the group/class decisions.

  3. **Group Discussion (Round 1: 15 minutes)**
     - Students form groups (6 per group). 
     - In their groups, they discuss what date and justification they want to propose. 
     - They argue for their criterion without revealing it (they can only hint or argue based on the importance of certain aspects of Rome). 
     - Each group must agree on a proposed date and justification sentence. They write these down.

  4. **Midpoint: Evidence Distribution (5 minutes)**
     - Hand out identical sets of evidence slips to each group. These slips contain key facts/events (without dates) that might be relevant to multiple criteria. 
     - Example evidence slips: 
       - "Odoacer deposes Romulus Augustulus and rules Italy as a king (476 CE)."
       - "Justinian's reconquest of Italy (535-554 CE)."
       - "The last known meeting of the Roman Senate in Rome (603 CE)."
       - "The Arab conquests sever Mediterranean trade routes (7th century)."
       - "The Battle of Yarmouk (636 CE) leads to the loss of the Eastern Empire's southern provinces."
       - "Latin ceases to be a spoken language in everyday use (7th-8th century)."
       - "The last recorded use of Roman road maintenance in Gaul (early 5th century)."
       - "The Plague of Justinian (541-549 CE) causes massive population decline."
       - "The last Western Roman emperor to be recognized by the Eastern Emperor (Julius Nepos, dies 480 CE)."
       - "The Eastern Roman Empire (Byzantine) continues until the fall of Constantinople (1453 CE)."
       - "The Vandal sack of Rome (455 CE)."
       - "The last time the Roman army was paid in gold coin in the West (early 5th century)."
     - Groups now have 5 minutes to review the evidence and adjust their date/justification if needed.

  5. **Group Discussion (Round 2: 10 minutes)**
     - Groups finalize their date and justification using the evidence.

  6. **Class Committee Formation (20 minutes)**
     - Each group presents their proposed date and justification (2 minutes per group).
     - Then, the class forms a committee of 4 representatives (one from each group) to negotiate a final date and sentence. The rest of the class can observe and then vote to approve or reject the committee's proposal. 
     - The committee has 10 minutes to deliberate in front of the class. They must agree on one date and one sentence.
     - The class then votes: majority rules.

  7. **Scoring and Reveal (5 minutes)**
     - Students reveal their criterion cards to their group members and the class. 
     - Each student calculates their score:
       - Date proximity: The absolute difference between the final class date and their criterion's endpoint date. 
          - 0-25 years off: 3 points (white chips)
          - 26-100 years: 2 points
          - 101-200 years: 1 point
          - >200 years: 0
       - Vocabulary bonus: If the final justification sentence contains a word or phrase directly related to their criterion (e.g., "emperor", "Senate", "roads", "taxes", "Latin"), they get 1 bonus point (blue chip).
     - Students tally their points.

  8. **Debrief (10 minutes)**
     - Connect the activity to the historiography:
       - "Which of you were arguing for a single hard date (like 476)? That's the traditional Gibbon view, focusing on political collapse."
       - "Who kept bringing up roads, trade, and living standards? That's the Ward-Perkins argument about the end of civilization."
       - "And who had a criterion that lasted much longer (like the Eastern Empire or Latin language)? That's the 'transformation' view of Peter Brown."
     - Address the student who says, "Wait, so there was no Rome to fall?" 
       - Response: "Exactly the point! The debate isn't about whether Rome ended, but about what we mean by 'Rome'. If Rome is an idea, a culture, or an administrative system, it might not 'fall' in a single moment. But if it's a political entity, then 476 is a strong candidate. The activity shows that the answer depends on the criteria we choose."

  ### Criterion Cards (12 cards)
  Each card has:
  - Criterion (what must be true for Rome to exist)
  - Endpoint (the date when this criterion definitively ended)
  - Note: Endpoints are based on historical consensus, but we note where there is debate.

  Card List:

  1. **Criterion:** There is a Western Emperor ruling from Italy.  
     **Endpoint:** 476 CE (deposition of Romulus Augustulus) or 480 CE (death of Julius Nepos, last Western emperor recognized by the East). *Use 480 for scoring.*  
     **Justification Hint:** Argue for the importance of imperial rule.

  2. **Criterion:** The Roman Senate meets regularly in the city of Rome.  
     **Endpoint:** 603 CE (last known meeting of the Senate in Rome).  
     **Justification Hint:** Emphasize the continuity of republican institutions.

  3. **Criterion:** Latin is spoken as a first language by a significant population.  
     **Endpoint:** ~700 CE (by which time Latin has evolved into early Romance languages, and is no longer the spoken vernacular).  
     **Justification Hint:** Focus on language and culture.

  4. **Criterion:** The Eastern Roman Empire (Byzantine) continues and its rulers call themselves 'Rhomaioi' (Romans).  
     **Endpoint:** 1453 CE (fall of Constantinople).  
     **Justification Hint:** Argue for the survival of Roman identity in the East.

  5. **Criterion:** A single treasury funds a standing Roman army in the West.  
     **Endpoint:** ~455 CE (after the Vandal sack of Rome and the loss of North Africa, the Western treasury collapses).  
     **Justification Hint:** Stress the importance of military funding and centralized finance.

  6. **Criterion:** A merchant can travel safely from Britain to Egypt using Roman roads and ships under Roman protection.  
     **Endpoint:** ~550 CE (after the Gothic Wars and the Arab conquests, long-distance trade becomes unsafe).  
     **Justification Hint:** Highlight trade networks and safety.

  7. **Criterion:** The Roman road network is actively maintained.  
     **Endpoint:** ~450 CE (in the West; in the East, much later but we'll use the West for this card).  
     **Justification Hint:** Focus on infrastructure.

  8. **Criterion:** Roman law is the primary legal system in Italy.  
     **Endpoint:** ~1100 CE (when Roman law is revived in the West, but the continuous practice in the East ends in 1453; however, in the West, the Ostrogothic and Lombard kingdoms replace it earlier). *Use 568 CE (Lombard invasion of Italy) as the end of widespread Roman law in the West.*  
     **Justification Hint:** Argue for the rule of law.

  9. **Criterion:** Roman coins are the primary currency in Mediterranean trade.  
     **Endpoint:** ~650 CE (after the Arab conquests and the collapse of the gold standard).  
     **Justification Hint:** Emphasize the economy and currency.

  10. **Criterion:** The Roman state collects taxes from its provinces in the West.  
      **Endpoint:** ~480 CE (after the fall of the Western Empire, tax collection becomes local).  
      **Justification Hint:** Stress taxation as a state function.

  11. **Criterion:** The city of Rome is the political capital of the Western Empire.  
      **Endpoint:** 476 CE (when the Western emperor is deposed; even though Odoacer rules from Ravenna, Rome is no longer the center).  
      **Justification Hint:** Focus on the city itself.

  12. **Criterion:** The Roman state provides public services (like aqueducts, public baths) in the city of Rome.  
      **Endpoint:** ~550 CE (during the Gothic Wars, aqueducts are cut and not fully restored).  
      **Justification Hint:** Argue for the welfare of citizens.

  ### Evidence Slips (10 slips, one set per group)
  1. Deposition of Romulus Augustulus (476 CE)
  2. Death of Julius Nepos (480 CE)
  3. Vandal sack of Rome (455 CE)
  4. Last Roman Senate meeting in Rome (603 CE)
  5. Justinian's reconquest of Italy (535-554 CE)
  6. Lombard invasion of Italy (568 CE)
  7. Battle of Yarmouk (636 CE) - Arab victory over the Eastern Empire
  8. Plague of Justinian (541-549 CE)
  9. End of Roman gold coin production in the West (early 5th century)
  10. Fall of Constantinople (1453 CE)

  ### Scoring Example
  - Student with card #1 (Western Emperor, endpoint 480 CE): 
    - If the class date is 476, difference is 4 years → 3 points.
    - If the justification says "the end of imperial rule", they get a bonus point.

  ### What Can Go Wrong and How to Steer
  1. **Problem:** Students might reveal their criterion too early.  
     **Solution:** Remind them they lose points if they reveal (or make it a rule that they cannot say the exact words on the card). If they do, they don't get the vocabulary bonus.

  2. **Problem:** Groups might deadlock on a date.  
     **Solution:** As facilitator, suggest they focus on the evidence and remind them that the museum wants one date. If necessary, have them vote within the group.

  3. **Problem:** The final class committee might be dominated by one or two loud students.  
     **Solution:** Require that each group representative speaks for 1 minute uninterrupted before open debate. Also, the class vote at the end ensures broad input.

  4. **Problem:** Students might not understand the evidence slips.  
     **Solution:** When distributing, briefly explain each event (but without dates) to ensure comprehension.

  ### What the Activity Cannot Teach
  The activity focuses on criteria and the selection of a date, but it does not delve into:
  - The broader implications of the fall/transformation for the development of medieval Europe and the Islamic world.
  - The long-term cultural, economic, and social changes that underpin the transformation argument (e.g., the rise of Christianity, the shift to feudalism).
  - The detailed evidence for decline in material culture (Ward-Perkins) versus continuity in institutions and culture (Brown).

  You will need to follow up with a lecture or discussion that explicitly contrasts Brown and Ward-Perkins, highlighting:
  - Brown's argument about cultural and religious transformation.
  - Ward-Perkins' focus on the collapse of complex economy and material life.
  - The idea that the debate is not just about dates but about how we define civilization and collapse.

  ### Printable Materials
  - **Page 1:** Criterion cards (print and cut into 12 cards)
  - **Page 2:** Evidence slips (print 4 sets, one per group) and scoring instructions.

  You can print the cards and slips on two pages (front and back if needed). The evidence slips can be printed as a list per group.

  ### Activity Name for Documentation
  **Active Learning Strategy:** Structured Academic Controversy with Role-Play (specifically, a "Curatorial Committee Simulation")

  This name can be used for program review documentation.

  ### Final Note
  The activity is designed to be engaging and to force students to think about the criteria behind historical periodization. By keeping the criteria secret, it encourages them to argue from principles rather than personal interest (until the reveal). The debrief is crucial to connect the game to the real historiography.

  Good luck on Monday!
answer: |-
  ### **Curatorial Committee: The End of Rome**  
  **Active Learning Strategy:** *Structured Academic Controversy Simulation* (Document this name for program review)  
  **Goal:** Students debate the "end date" of Rome based on assigned criteria, simulating historiography debates (Gibbon vs. Brown vs. Ward-Perkins).  

  ---

  ### **Setup (5 min)**  
  - **Groups:** 4 tables of 6 students each.  
  - **Materials:**  
    - **Criterion Cards** (1 per student, 12 total—see below).  
    - **Evidence Packets** (1 identical packet per group—see below).  
    - **Score Trackers** (1 per student: tally sheet for points).  
    - **Poker Chips:** White (1 pt), Red (2 pts), Blue (bonus pt).  
  - **Rules Brief:**  
    > “You’re on a curatorial committee for a museum exhibit titled **THE END OF ROME**. Decide:  
    > - **One date** (year) for the plaque.  
    > - **One sentence** justifying it.  
    > No compromises—you must agree!  
    > **SECRET:** Each of you has a *criterion* (a condition for Rome to ‘exist’). You’ll score points if:  
    > (1) The class’s final date is close to *your* criterion’s endpoint (use chips to score).  
    > (2) The final sentence uses your criterion’s *vocabulary* (bonus chip).  
    > **DO NOT REVEAL YOUR CARD UNTIL I SAY!**”  

  ---

  ### **Criterion Cards (12 Total)**  
  *Each card has:*  
  - **Criterion** (What must be true for Rome to exist).  
  - **Endpoint** (When it definitively ended—dates vetted for accuracy).  
  - **Justification Vocabulary** (Key terms to push for in the sentence).  

  | Criterion Card | Endpoint | Justification Vocabulary |  
  |----------------|----------|--------------------------|  
  | 1. A Western Emperor sits on the throne in Italy. | 476 CE (Odoacer deposes Romulus Augustulus) | “emperor,” “imperial rule,” “throne” |  
  | 2. The Roman Senate meets in the city of Rome. | 603 CE (Last recorded session) | “Senate,” “republican institutions,” “political body” |  
  | 3. Latin is a first language somewhere in the West. | 700 CE (Evolves into Romance dialects) | “Latin,” “language,” “vernacular” |  
  | 4. The Eastern Empire calls itself *Rhomaioi* (Roman). | 1453 CE (Fall of Constantinople) | “Eastern Empire,” “*Rhomaioi*,” “Byzantine” |  
  | 5. A central treasury funds a standing army. | 455 CE (After Vandal sack; treasury depleted) | “treasury,” “army funding,” “central taxes” |  
  | 6. Safe travel for merchants from Britain to Egypt. | 550 CE (Gothic Wars disrupt trade) | “trade routes,” “merchants,” “safe travel” |  
  | 7. Active repair of Roman roads. | 450 CE (West); 600 CE (East) *Use 500 CE avg.* | “roads,” “infrastructure,” “transport” |  
  | 8. Taxation flows to a central state. | 480 CE (West); 1453 CE (East) *Use 480 CE for West* | “taxes,” “central state,” “revenue” |  
  | 9. Roman law is enforced in Italy. | 568 CE (Lombard invasion ends codified law) | “Roman law,” “legal code,” “justice” |  
  | 10. Paganism is openly practiced in Rome. | 392 CE (Theodosius bans pagan rites) | “paganism,” “religious freedom,” “old gods” |  
  | 11. The city of Rome has >500,000 residents. | 550 CE (Plague/Gothic Wars; population drops) | “population,” “urban center,” “city size” |  
  | 12. Aqueducts function in the city of Rome. | 537 CE (Goths cut aqueducts during siege) | “aqueducts,” “public works,” “water supply” |  

  > **Sanity-Checked Dates:**  
  > - Senate (603 CE): Last secure record under Gregory the Great.  
  > - *Rhomaioi* (1453 CE): Byzantines used the term until the Ottoman conquest.  
  > - Latin (700 CE): Shift to Romance languages complete by 8th century.  

  ---

  ### **Activity Flow (75 min Total)**  
  1. **Intro & Card Distribution (10 min):**  
     - Frame the museum scenario. Hand out criterion cards secretly. Students read cards *silently*.  

  2. **Group Debate Part 1 (20 min):**  
     - Groups debate a date/sentence. **Rule:** Argue for your criterion *without naming it* (e.g., “We can’t ignore the military!” for Card 5).  
     - **Instructor Tip:** Circulate and provoke: *“What makes Rome ‘Rome’? Is it leaders? Laws? Roads?”*  

  3. **Evidence Packet Drop (5 min):**  
     - Give each group the **SAME evidence packet** (printed below). Say: *“New evidence! Use this to refine your arguments.”*  

  4. **Group Debate Part 2 (15 min):**  
     - Groups finalize date/sentence using evidence. Push for consensus.  

  5. **Class-Wide Committee (15 min):**  
     - Each group shares their date/sentence.  
     - **Final Vote:** Class debates and votes on ONE date/sentence. Record on board.  

  6. **REVEAL & Scoring (5 min):**  
     - Students reveal cards. Score individually:  
       - **Date Proximity:** |Class date - Your endpoint| →  
         - ≤50 yrs: 2 pts (red chip)  
         - 51–150 yrs: 1 pt (white chip)  
         - >150 yrs: 0 pts  
       - **Vocabulary Bonus:** 1 pt (blue chip) if final sentence uses your *justification vocab*.  

  7. **Debrief (10 min):**  
     - **Historiography Mapping:**  
       - Gibbon (Traditional Fall): *“Who argued for 476? You focused on emperors or armies—that’s Gibbon’s political collapse.”*  
       - Ward-Perkins (End of Civilization): *“Who pushed roads, taxes, or population? You highlighted material decline—like Ward-Perkins.”*  
       - Peter Brown (Transformation): *“Who had language, law, or Eastern Empire? You saw continuity—that’s Brown.”*  
     - **Rebuttal to “No Rome to Fall?!”:**  
       > *“Exactly! That’s the debate. If ‘Rome’ is an idea (*Rhomaioi*, Latin), it transformed. If it’s a state (emperor, taxes), it fell. Your criteria decided the date—just like historians.”*  
     - **Connect to Readings:**  
       *“On the exam, ‘it transformed’ isn’t a slogan—it’s Brown arguing that culture outlasted politics. ‘It fell’ is Ward-Perkins saying quality of life collapsed.”*  

  ---

  ### **Evidence Packet (1 Page Per Group)**  
  *Same 10 slips for all groups. No dates—force interpretation!*  
  1. “Odoacer deposes last Western emperor; rules Italy as ‘king’ (476 CE).”  
  2. “Justinian reconquers Italy, North Africa, Spain (535–554 CE).”  
  3. “Plague kills 25% of Mediterranean population (541–549 CE).”  
  4. “Lombards invade Italy; Roman law fades (568 CE).”  
  5. “Arab armies conquer Egypt/Syria; trade routes shift (636–642 CE).”  
  6. “Pope Gregory the Great references ‘Senate’ in Rome (603 CE).”  
  7. “Goths cut aqueducts during siege of Rome (537 CE).”  
  8. “Byzantine emperor uses ‘*Rhomaioi*’ in official documents (1400 CE).”  
  9. “Latin evolves into early French/Spanish/Italian (700 CE).”  
  10. “Vandals sack Rome; treasury looted (455 CE).”  

  ---

  ### **Printing & Logistics**  
  - **2 Pages Total:**  
    - Page 1: 12 Criterion Cards (4 rows of 3 cards—cut apart).  
    - Page 2: Evidence Packet (10 slips—cut apart; 1 set per group).  
  - **Poker Chips Alternative:** Tally marks on score trackers (1 pt = ✓, 2 pts = ✓✓, bonus = ★).  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Problem:** Students reveal cards early.  
     - **Fix:** Announce penalty: “Reveal = no bonus point.” Redirect: “Argue *why* your criterion matters, not *what* it is.”  

  2. **Problem:** Groups deadlock on date.  
     - **Fix:** Set a timer. Intervene: “Museum demands one answer. Vote or compromise.”  

  3. **Problem:** Evidence slips ignored.  
     - **Fix:** Cold-call groups: “How does Evidence #5 support your date?”  

  ---

  ### **What the Activity CANNOT Teach**  
  **Structural Limitation:** It *cannot* simulate **how criteria are chosen**. Students inherit cards; historians *debate which criteria matter*.  
  **Follow-Up Lecture Needed:**  
  - “Brown prioritizes cultural continuity (language, *Rhomaioi*); Ward-Perkins prioritizes material collapse (roads, economy). Gibbon focused on politics. Your card was arbitrary—but historians *argue* over which lens reveals truth.”  
  - Assign: *Contrast Brown’s “transformation” with Ward-Perkins’ “collapse” in 1 paragraph. Whose criteria feel more convincing?*  

  ---

  ### **Why This Design?**  
  - **Secret Criteria:** Forces students to advocate for abstract principles (like historians), not “winning.”  
  - **Identical Evidence:** Ensures fairness—victory hinges on rhetoric, not research.  
  - **Debrief Mapping:** Makes historiography personal (“*You* were doing Gibbon!”).  
  - **Time-Efficient:** Fits 75 min with clear phases.  

  **Print materials, grab poker chips, and run it.** Your third-years with opinions will *love* arguing—and they’ll finally see why “it transformed” isn’t a cop-out.
