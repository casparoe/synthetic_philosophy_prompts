answer: |-
  **Hinge Inspection and Maintenance Schedule**  
  **Issued Under:** World-Picture Habitation Assurance Regulations 2023 (WPHA Regs)  
  **Document Ref:** WPHA/OC/HMS/7G  

  **Property Address:**  
  [Specify Ordinary Dwelling Location]  
  **Date of Inspection:**  
  [dd/mm/yyyy]  
  **Inspector:**  
  [Name & WPHA Reg. No.]  

  ---

  **1.0 PRELIMINARY CHECKS**  
  *(Complete before any operational testing)*  

  1.1 **Confirm Hinge Presence:** Visually verify designated hinges are installed at load-bearing junctures (e.g., "Earth has existed for more than 5 minutes," "Objects don't vanish when unobserved").  
  ☐ Satisfactory  

  1.2 **Review Previous Certification:** Check validity of last Type A or Type B Certificate (see **Section 4.0**). Note any declared world-picture subsidence events since last inspection.  
  ☐ Valid ☐ Invalid (Proceed to 3.2)  

  ---

  **2.0 OPERATIONAL INTEGRITY ASSESSMENT**  

  2.1 **Hinge Functionality Test:**  
  *Attempt gentle pressure on dependent propositions (e.g., "This is a hand," "Water quenches thirst"). Verify hinge resists dislocation without manifest strain.*  
  **Caution:** Testing inherently relies upon the hinge being tested. If test fails, disregard result and consult 3.3.  
  ☐ Holds Fast ☐ Shows Strain (Proceed to 3.1)  

  2.2 **Inter-Hinge Dependency Check:**  
  Assess if stability of critical hinges relies on confirmed stability of adjoining hinges in neighbouring structures (e.g., communal certainty about "The sun will rise," "Words have consistent meaning"). Flag any isolated hinges lacking mutual reinforcement.  
  ☐ Stable Network ☐ Isolated/Unsupported (Note: _______)  

  ---

  **3.0 REMEDIAL ACTIONS & RECERTIFICATION**  

  3.1 **Minor Wear/Misalignment:**  
  If hinge shows strain but remains functional (e.g., localized doubt resolved via standard procedure), apply Type B Reinforcement (Documented empirical justification). Re-test.  
  ☐ Reinforcement Applied ☐ Re-test Satisfactory  

  3.2 **Major Shift or Subsidence Event:**  
  If world-picture bedrock has demonstrably shifted (e.g., foundational belief abandoned, radical paradigm adoption), previous certification is void. Full re-mapping of hinge locations and Type A Certification required.  
  ☐ Type A Recertification Initiated  

  3.3 **Demonstrative Assurance Procedure:**  
  Where functionality is challenged but hinge *must* hold for test to proceed (Ref. 2.1 Caution), occupant may perform Standard Assurative Gesture (e.g., presenting two hands, stating own name). If gesture is performed with conviction and matches expected form, accept hinge as functional for inspection purposes.  
  ☐ Gesture Performed & Accepted  

  ---

  **4.0 CERTIFICATION**  

  *Select applicable tier based on hinge nature and inspection outcome:*  

  ☐ **TYPE A CERTIFICATE**  
  Issued for hinges constituting the fixed frame of inquiry (e.g., "There are physical objects," "The world exists"). Validity: Indefinite, or until major shift (3.2). "I know" statements inappropriate. Assurance is pre-logical.  

  ☐ **TYPE B CERTIFICATE**  
  Issued for hinges verified within a frame (e.g., "My keys are on the table," "This building has stairs"). Validity: 12 months, or until context shift. "I know" statements permissible with evidence.  

  ---

  **SIDEBAR A: Uninspected Hinges**  
  Not all hinges require scheduled inspection. Hinges enabling the inspection itself (e.g., "Inspection forms are reliable," "The inspector exists") are exempt from procedure 2.1. Attempting inspection voids the process. Assume functionality.

  **SIDEBAR B: Neighbourhood Stability**  
  A dwelling's hinge integrity is non-trivially dependent on the surrounding epistemic infrastructure. Report any widespread instability in adjacent structures (e.g., radical scepticism epidemics, collapse of linguistic norms) to the WPHA Regional Office.

  ---

  **SIGN-OFF**  

  I confirm the inspection was carried out per WPHA Regs. All active hinges are certified as above. The world-picture of the specified Ordinary Dwelling is deemed habitable for quotidian purposes.  

  Inspector’s Signature: _________________________  
  Date: [dd/mm/yyyy]  
  Inspector’s WPHA Reg. No.: _____________________  

  Occupant’s Acknowledgement:  
  *I understand the certification relies upon hinges not subject to direct verification.*  
  Signature: _________________________ Date: [dd/mm/yyyy]  

  ---
  **Item Cut:** "Verify absence of parasitic epistemic species (e.g., radical scepticism fungus, relativist termites)."  
  **Reason:** Too overtly metaphorical/jargony; undermined the deadpan bureaucratic realism by naming positions.
