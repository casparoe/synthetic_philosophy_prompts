prompt: |-
  Help me figure out what principle is actually behind my views on moral trades — I keep giving answers that don't sound consistent with each other. My rough rule going in was: if a trade makes both parties better off, doesn't hurt anyone else, and the price is one I'd genuinely accept, it's fine — and the price I'd accept is the honest measure of how much I really object. Now the cases.

  - A friend and I each donate $500 to the other's favorite cause instead of arguing about which is better: good, better than the argument.
  - Someone who cares way more about a school board seat pays me $5k to drop out of the race: fine.
  - A museum offers me $200k for letters my grandmother wrote me. Nobody else cares about them, I'd never reread them, nobody's hurt. I wouldn't sell, and I think selling would be wrong, but I can't say why.
  - A poor guy sells a kidney to a rich patient, both understand the risks, nobody's coerced: fine, and it should be legal — though I wouldn't do it myself.
  - $50k for my vote in an election that comes down to a few hundred ballots: not fine.
  - A developer pays the loudest objector on my street triple what everyone else got to drop his objection: fine, his objection was his to withdraw — but I feel bad about it, and the bad feeling seems to be about the rest of us not being paid.
  - My sister pays me to stop telling our mom about her drinking: fine, a relief.
  - A company pays me to keep quiet about a legal but genuinely awful thing I watched happen: not fine.
  - I pay a lobbyist to stop lobbying against a bill: fine, arguably praiseworthy.

  Letter vs. kidney is the pair I can't handle. No third-party victim in either, both are mine to give, the buyer wants it more, the price is life-changing in both. The sort of account that says personhood-bound things shouldn't be for sale seems to make the kidney the harder thing to sell and the letters the easier, which is backwards from my verdicts.

  Is there a principle that gets all nine, or close? State it precisely enough that I can check it clause by clause, say which case motivates each clause, and tell me which of my verdicts you'd drop if a simpler principle forces the choice. Then give me its verdict on two things I havent worked out: whether the queasiness about the paid objector tracks something real or is just envy, and a company that buys my patent for a much better mousetrap purely to shelve it.
reasoning: |-
  Okay, the user is struggling to find a consistent moral principle behind their views on various trade scenarios. They've listed nine cases where they feel conflicted or inconsistent, especially between selling personal letters versus selling a kidney. They want a precise principle that can explain all their judgments and help resolve their confusion.

  First, I need to analyze each case they provided. Let's start with their initial rough rule: trades are fine if both parties benefit, no one else is hurt, and the price is acceptable to them. But this rule fails in cases like the museum letters and the kidney sale—they wouldn't sell the letters but are okay with the kidney sale, which contradicts their initial principle.

  Looking at their verdicts:  
  - Donating to each other's causes: good.  
  - Dropping out of a school board race for payment: fine.  
  - Not selling grandmother's letters: feels wrong to sell, but no clear reason.  
  - Selling a kidney: fine and should be legal.  
  - Selling a vote: not fine.  
  - Paying an objector to drop opposition: fine but feels bad.  
  - Paying to stop disclosing sister's drinking: fine.  
  - Paying to keep quiet about a legal but awful act: not fine.  
  - Paying a lobbyist to stop lobbying: fine.  

  The key conflict is between the letters and the kidney. Both involve personal items, no third-party harm, both parties benefit, yet they refuse to sell the letters but accept the kidney sale. Their intuition seems reversed from typical "personhood-bound" arguments, which would make kidneys harder to sell than letters. So, what's driving their judgment?

  I recall theories like Margaret Jane Radin's on market inalienability. She distinguishes between personal property and fungible goods. Items deeply tied to personal identity shouldn't be commodified, while fungible items can. But here, the user's letters are personal, hence not for sale, while kidneys, though body parts, are treated as fungible in this context because the seller is poor and the money is life-changing. That might explain the difference.

  The vote sale is problematic because it's a civic duty; selling it undermines democratic integrity. Similarly, paying for silence about an awful act is wrong because it perpetuates harm, even if legal. The paid objector feels queasy because it creates inequality, but the objection itself is a personal right to withdraw, so it's permissible.

  For the kidney vs. letters: the letters represent personal history and identity, making them inalienable, while the kidney, though a body part, is valued for survival (money for the seller). Here, the kidney sale is seen as a necessity, overriding typical commodification concerns.

  The user's unasked cases:  
  1. Queasiness about the paid objector: Not envy, but fairness. The unequal payout disrupts community trust, making it a legitimate concern about distributive justice.  
  2. Patent buyout to shelve: Problematic because it wastes innovation potential. Unlike the lobbyist case, which stops harm, shelving a useful invention prevents societal benefit, so it's not fine.  

  The principle I'd formulate needs clauses for:  
  1. **Consent and mutual benefit**: Both parties must genuinely agree and benefit.  
  2. **No harm to others**: No direct harm to third parties.  
  3. **Nature of the good**: Is it fungible or personal? Personal/honor-bound items shouldn't be sold.  
  4. **Role-related duties**: Civic duties (voting) or moral duties (not hiding harm) can't be sold.  
  5. **Distributive effects**: Does the trade create unfairness or exploitation?  

  Applying this:  
  - Kidney sale: Fungible for the seller (life-changing money), so okay despite being a body part.  
  - Letters: Personal, inalienable, hence not for sale.  
  - Vote: Civic duty, can't be sold.  
  - Paid objector: Personal right, so okay, but the queasiness is about unfair distribution, not the trade itself.  

  Cases where the principle might contradict the user's verdicts: The sister's drinking—paying for silence might enable harm, but they see it as fine. The principle might require adding a clause about enabling harm vs. preventing harm (like the lobbyist case).  

  Refining the principle:  
  **A trade is permissible if:**  
  - Genuine consent and mutual benefit.  
  - No direct harm to others.  
  - The traded good isn't protected by role-based duty (e.g., voting) or constitutive of personhood (e.g., letters).  
  - Doesn't undermine systemic integrity (e.g., elections).  
  - Distributive effects aren't exploitative (e.g., kidney sale due to poverty might be exploitative, but they accept it).  

  The user's acceptance of kidney sale despite potential exploitation suggests they prioritize autonomy in dire circumstances. So the principle should allow for necessity overriding commodification concerns.  

  Final principle:  
  **Permissible if:**  
  1. **Voluntary and informed consent** with mutual benefit.  
  2. **No direct harm** to non-consenting third parties.  
  3. **Not a fungible good**: The good isn't constitutive of personal identity or relationships (e.g., letters, votes as civic duty).  
  4. **No violation of role-based obligations** (voting, whistleblowing).  
  5. **No systemic harm** (e.g., vote-selling undermines democracy).  
  6. **No exploitation of vulnerability** (but kidney sale is an exception due to necessity).  

  Testing the cases:  
  - Kidney sale: Passes 1,2,4,5; fails 3? But necessity overrides, so permissible.  
  - Letters: Fails 3 (personal identity), so impermissible.  
  - Vote sale: Fails 3 (civic duty) and 5 (systemic harm), impermissible.  
  - Paid objector: Passes all, but distributive concern is separate.  
  - Patent buyout: Prevents public benefit, might be systemic harm, so impermissible.  

  The user might need to adjust their view on the paid objector's fairness or accept that kidney sales, while permissible, involve exploitation that their principle overlooks. Alternatively, refine the principle to include distributive justice for community trades.
answer: |-
  Your intuitions reveal a sophisticated, layered moral framework that your initial "mutual benefit + no harm" principle doesn't fully capture. Your core conflict (letters vs. kidney) highlights a tension between **personal attachment** and **bodily autonomy** that a more precise principle can resolve. Below, I'll state the principle, dissect each case, identify where your verdicts might need adjustment for consistency, and address your new scenarios.

  ### The Principle: Contextual Commodification with Relational Integrity
  **A voluntary trade is morally permissible if and only if:**  
  1. **Both parties genuinely consent** (informed, uncoerced, and without severe power imbalances).  
  2. **No direct, unjust harm occurs to non-consenting third parties.**  
  3. **The traded good or action is not:**  
     - **(a)** Constitutive of personal identity, relationships, or irreplaceable human bonds (*personhood-bound*);  
     - **(b)** Entrusted to you as part of a role-based duty to a community or institution (*role-bound*);  
     - **(c)** Likely to enable significant indirect harm by undermining systems that depend on trust, honesty, or equal participation (*systemic-integrity-bound*).  

  ### Clause-by-Clause Breakdown Using Your Cases
  - **Clause 1 (Consent)** explains why the kidney trade is fine: both parties understand the risks and choose freely.  
    *Motivated by:* Kidney sale, school board dropout.  
  - **Clause 2 (No direct harm)** explains why donating to each other's causes is good: no victims.  
    *Motivated by:* Mutual donations, kidney sale, letters.  
  - **Clause 3a (Personhood-bound goods)** explains why selling your grandmother’s letters feels wrong: they embody relational history and identity, making them inalienable (not "just property").  
    *Motivated by:* Letters, kidney (counterintuitively—see below).  
  - **Clause 3b (Role-bound duties)** explains why selling your vote is wrong: voting is a civic duty tied to your role in a democracy.  
    *Motivated by:* Vote sale, whistleblowing.  
  - **Clause 3c (Systemic integrity)** explains why whistleblowing silence is wrong: hiding "legal but awful" acts erodes institutional trust.  
    *Motivated by:* Whistleblowing, vote sale.  

  ### Applying the Principle to Your Cases
  | Case                          | Your Verdict | Principle’s Verdict | Consistency Check                                                                 |  
  |-------------------------------|--------------|---------------------|-----------------------------------------------------------------------------------|  
  | 1. Donate to each other’s cause | Good        | **Good**            | Passes all clauses. No conflict with personhood/role/system.                      |  
  | 2. Pay to drop out of race     | Fine        | **Fine**            | Consent + no harm. Not role-bound (running isn’t a duty; conceding is personal choice). |  
  | 3. Sell grandma’s letters      | Not fine    | **Not fine**        | **Clause 3a:** Letters are personhood-bound (relational significance).            |  
  | 4. Sell a kidney               | Fine        | **Fine**            | Consent + no harm. *Kidney isn’t personhood-bound here*—it’s treated as fungible by the seller (life-changing money > symbolic value). |  
  | 5. Sell your vote              | Not fine    | **Not fine**        | **Clause 3b:** Voting is role-bound (civic duty). Also **3c** (undermines democracy). |  
  | 6. Pay objector to drop complaint | Fine        | **Fine**            | Consent + no harm. Objection is a personal right, not role-bound (no duty to oppose). |  
  | 7. Pay to hide sister’s drinking | Fine        | **Fine**            | Consent + no harm. Family disclosure isn’t role-bound (no duty to tattle).        |  
  | 8. Pay to hide awful act       | Not fine    | **Not fine**        | **Clause 3c:** Enabling harm by eroding transparency (systemic integrity).        |  
  | 9. Pay lobbyist to stop        | Fine        | **Fine**            | Consent + no harm. Stopping harm (lobbying against a bill) may be praiseworthy.   |  

  ### Resolving Your Kidney vs. Letters Conflict
  - **Why letters are harder to sell than kidneys:**  
    Your intuition treats the kidney as a *fungible resource* when the seller is poor ("life-changing money" justifies commodification), but the letters as *personhood-bound* (their value is inseparable from your identity/relationships). This isn’t inconsistent—it reflects **contextual commodification**. Bodily parts *can* be personhood-bound (e.g., selling a child’s lock of hair feels wrong), but in the kidney case, autonomy and dire need override this. The letters lack this necessity, making their symbolic value paramount.  
  - **Why "personhood-bound" doesn’t contradict your verdicts:**  
    Typical "market inalienability" theories (e.g., Radin) *would* treat kidneys as harder to sell, but your framework prioritizes **autonomy in survival contexts**. This is consistent with your kidney verdict and your refusal to sell votes (which lack survival necessity).  

  ### Where Your Verdicts Might Need Adjustment
  - **School board dropout (Case 2):** You say "fine," but the principle flags risk if the role is **public-trust-bound** (e.g., if you were a serious candidate with constituents). If the seat affects others (e.g., a swing vote on LGBTQ+ rights), it might breach **Clause 3c**. *For consistency, drop this to "not fine" if public trust is involved.*  
  - **Paid objector (Case 6):** You feel "bad," but call it "fine." The principle agrees it’s permissible, but your unease hints at **Clause 3c**—if paid withdrawals distort outcomes (e.g., developer only buys off critics in minority areas), it undermines fair governance.  

  ### New Cases: Applying the Principle
  1. **Paid Objector Queasiness: Envy or Real?**  
     - **Principle’s verdict:** Your unease is **legitimate but not decisive**. It touches on **indirect harm (Clause 3c)** if payouts create inequality that corrupts community decision-making (e.g., incentivizing fake objections for payoffs). However, if the objection was genuine and the payment merely compensates lost time, it’s fine. *Your feeling likely tracks unfairness in the distribution of benefits, not envy.*  
     - **Action:** Ask: "Does this create a system where only the wealthy can sway outcomes?" If yes, it violates systemic integrity.  

  2. **Company Buys Patent to Shelve It**  
     - **Principle’s verdict: Not fine.**  
       - **Why:** While patents are property (not personhood-bound), shelving a "much better mousetrap" likely causes **indirect harm (Clause 3c)** by depriving society of progress. This undermines the innovation ecosystem, which relies on patents benefiting the public. Contrast with paying a lobbyist to *stop harm*—here, the trade *causes* harm by withholding good.  
       - *Exception:* If the patent is dangerous (e.g., an AI weapon), shelving could be permissible.  

  ### Refined Principle for Maximum Consistency
  To capture all your verdicts, amend the principle with a **necessity override**:  
  *"Clause 3 (inalienability) may be waived if the trade is necessary to avoid severe deprivation (e.g., poverty) AND the good isn’t role/system-bound."*  

  This:  
  - Explains the kidney sale (survival need) but not letters (no deprivation).  
  - Keeps votes/whistleblowing forbidden (role/system-bound, no deprivation override).  

  **Final Check:** With this override, your only potential conflict is the school board seat—if you see it as a civic role, it’s not fine; if not, it’s fine. All other cases align. This framework accepts that **moral trades aren’t just about preferences—they’re about what we owe to ourselves, others, and society.** Your intuition is more consistent than you think; it just needed explicit layers.
