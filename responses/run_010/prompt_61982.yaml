  For names, "Proper™ Home Accuracy Monitor" feels right, with accessories like "Calibration Confidence Kit". The tone must stay earnestly defensive - every flaw is a virtue. 

  Key jokes to emphasize:
  - Coherent agents always self-endorse (true!)
  - Log score's infinity penalty at certainty (mathematically accurate)
  - Proper rules can't isolate errors (genuine limitation)
  - Accidental accuracy still minimizes score (by definition)
