prompt: |-
  I'm the sole staff person supporting the standards committee of a regional federation of worker cooperatives — thirty-eight member co-ops across food production, light manufacturing, software, and home care. Membership is not decorative: it carries access to a revolving loan fund, a shared certification mark that members put on retail packaging, and preferential purchasing from other members. Two or three times a month I get a file that turns, whether or not anyone says so in those terms, on a Marxian question — is this arrangement extracting surplus from someone who has no claim on it, and does the work itself deform the people doing it. At present I have no framework, and the decisions are made by seven elected members with mixed schooling, no taste for theory, and about as much patience for abstraction as a zoning board. I get roughly two hours per file. I took one undergraduate course that covered the theory of surplus value and the early writings on alienation, and I would like to build the procedure out of that material, though I'm aware Marx is not obviously in the business of handing anyone a decision rule.

  What I want is a procedure I can actually run: the questions to ask in order, what counts as a sufficient answer to each, which of them are answerable from a co-op's books and governance documents and which are not answerable from anything I can obtain, where the procedure terminates in a refusal, and where it stops and hands the question back to the committee because the remaining issue is one of values rather than facts. It has to keep the two axes distinct rather than letting them collapse into a single score of good-or-bad workplace: the appropriation of surplus (who produces, who claims, under what property relations, and whether the claim rests on ownership rather than on work), and the character of the activity itself (the four moments of alienation in the 1844 manuscripts — from the product, from the act of producing, from species-being, and from other human beings). For each of those four, tell me plainly whether a non-specialist reading a file can operationalize it or whether it cannot be operationalized at all, and don't hand me a checkbox I'll be unable to fill in honestly. The procedure must also confront the feature of Marx's account that makes my current practice look confused: his claim that exploitation occurs through the free exchange of equivalents and does not depend on the wage being below market, on coercion, or on anyone's intentions or bad faith. Much of what my committee currently tests — pay levels, consent, whether workers are better off than their alternatives, the existence of a grievance channel — may be beside the point, and I need to be told what to do when a file shows non-member workers paid above the local market, satisfied with the arrangement, and freely consenting to it. Where the distinction between labor and labor power, or between absolute and relative surplus value, buys me something observable, keep it; where it is load-bearing in the theory but invisible from inside a co-op's file, say so and move on. Address how far the procedure reaches beyond the member's own walls — the co-op that is internally impeccable but buys its inputs from firms running ordinary wage labor — and use the formal versus real subsumption distinction only if it actually generates a different verdict somewhere. Finally, be explicit at the step where it happens, not in a closing caveat, about anywhere Marx's account does not supply a decision rule and you have had to import one: for instance the analytic-Marxist move to define exploitation in terms of unequal ownership of productive assets and a counterfactual test about what a coalition could withdraw with, or a domination-based test about who is subject to whose arbitrary will. Tell me which distinctions you judged indispensable to the translation and which you dropped, what the dropped ones were doing in the theory, and whether the imports change any verdicts.

  Then run the procedure on three files I have in front of me. First: a bakery with twelve member-owners, one member one vote, pay held within a two-to-one band, surplus distributed in proportion to hours worked, and six non-member seasonal workers paid above the local living wage with no realistic path to membership, because the buy-in is five thousand dollars and the season runs four months. Second: a software co-op that is fully worker-owned and governed but in which a mission-aligned venture fund holds three million dollars of preferred stock, a board seat, and a liquidation preference, and whose product is a scheduling and location-monitoring platform sold to logistics firms. Third: a member co-op with impeccable internal democracy that voted last year to contract out its night-shift cleaning to an outside non-union firm, after which member distributions rose by twelve percent. I expect the third to come out badly and I want it to: if the procedure gives a clean pass to the file my committee is proudest of, it is tracking the wrong thing. Close by telling me where the procedure will misfire — which files it will classify wrongly and why, what a co-op could do to game it while satisfying every step, which inputs I simply will not be able to obtain — and what it cannot do even when it is run competently and in good faith.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're the sole staff person supporting a standards committee for a federation of worker cooperatives. Their main challenge is assessing member co-ops based on Marxian principles of surplus value extraction and alienation, but they need a practical procedure that can be applied within tight time constraints. The committee members aren't theory-inclined, so the process has to be straightforward and operational.

  First, I need to break down the two main axes: exploitation (surplus appropriation) and alienation. For exploitation, Marx's theory hinges on labor power being commodified and surplus value extracted, even if wages are fair. In a co-op, since workers own the means of production, the traditional exploitation might not apply. But the user mentioned non-member workers, like in the bakery example. Here, those seasonal workers don't own assets, so their surplus labor benefits the owners. That's a red flag. The key is whether all workers have ownership. If not, exploitation is possible.

  For alienation, the four aspects from Marx's 1844 manuscripts need practical checks. Product alienation: do workers control the product's use? Process alienation: can they influence their work conditions? Species-being: does the work allow creativity and development? Social alienation: are relationships cooperative or hierarchical? These need observable indicators like governance participation, skill development opportunities, and workplace culture.

  The user also needs clarity on what can be operationalized. Financial records and governance docs can show ownership structure, pay equity, and surplus distribution. But assessing species-being or social alienation might require surveys or interviews, which aren't feasible in two hours. So the procedure must flag when subjective judgment is needed.

  Now, the three cases. The bakery has non-owners without a path to membership. Even with good pay, they're exploited because they don't share ownership. Alienation might be lower if they have autonomy, but without membership, their influence is limited. The software co-op's issue is the venture capital's control. Preferred stock and board seats introduce external control, subsuming the co-op to capital's logic. The cleaning service outsourcing clearly exploits third-party workers, and the co-op benefits from that surplus.

  Misfires could occur if non-member workers are content but still exploited, or if alienation is hard to measure. Co-ops might game the system by having nominal ownership paths or superficial participation. The procedure can't assess external supply chains thoroughly, so that's a limitation. Also, without worker testimonials, alienation assessments are speculative.

  The user's deeper need is a reliable, efficient tool that aligns with Marxian principles without getting bogged down in theory. They need to uphold the federation's standards while ensuring decisions are defensible and transparent. The procedure must balance rigor with practicality, clearly indicating where committee judgment is required.
answer: |-
  Here is a procedure built from your specifications, designed for operational clarity within tight constraints, focusing distinctly on **Exploitation (Surplus Appropriation)** and **Alienation (Character of Work)**. It prioritizes observable evidence from standard co-op documents (bylaws, financials, employment contracts, org charts, member agreements) while flagging unresolvable value judgments.

  **Core Principles & Distinctions:**
  1.  **Exploitation:** Focuses *solely* on **ownership of productive assets** and **claim on surplus**. Does surplus value produced by labor flow to non-laborers based on ownership? Exploitation occurs when labor-power is sold as a commodity, even if "fairly" priced.
  2.  **Alienation:** Focuses on **worker control** and **meaningfulness** within the labor process itself. Assesses the four moments based on structural arrangements.
  3.  **Separation of Axes:** Verdicts are independent. A co-op can be non-exploitative but alienating, or vice-versa (though likely correlated).
  4.  **Operationalization:** Prioritizes objective evidence. Specifies where evidence is insufficient or requires committee value judgment.
  5.  **Decision Rule Import:** Explicitly flags where core Marxian theory lacks a decision rule and imports a common analytical-Marxist one: **Exploitation is defined by workers lacking ownership of the assets necessary for their work, enabling others to appropriate surplus based on ownership rather than labor contribution.**

  **Procedure: Step-by-Step**

  **I. Initial Triage (10 min)**
      *   **Question:** Who performs labor directly contributing to the co-op's goods/services? (Identify ALL workers: members, non-member employees, contractors).
      *   **Evidence:** Payroll records, contractor agreements, org chart.
      *   **Sufficiency:** Clear list of individuals/roles.
      *   **Termination:** If no labor performed (pure holding co-op?), flag for committee. Proceed otherwise.

  **II. Axis 1: Exploitation (Surplus Appropriation) (45 min)**
      *   **A. Ownership of Productive Assets:**
          *   **Question:** Do ALL individuals performing core labor (Step I) hold equal, non-transferable ownership shares in the cooperative (means of production)? (Check: Buy-in cost, vesting period, transfer restrictions, voting rights).
          *   **Evidence:** Bylaws, Membership Agreement, Capital Accounts.
          *   **Sufficiency:** Binary: Yes (all core workers are full owners) / No (some core workers are not owners).
          *   **Decision:** If **Yes**, proceed to II.C. If **No**, proceed to II.B.
      *   **B. Non-Owner Workers & Surplus Flow:**
          *   **Question 1:** Do non-owner workers produce surplus value (i.e., is their labor necessary for the co-op's output and revenue)?
          *   **Evidence:** Job descriptions, revenue attribution (if possible), operational necessity.
          *   **Sufficiency:** Almost always "Yes" for core labor roles. If clearly "No" (e.g., purely symbolic role), flag. Assume "Yes".
          *   **Question 2:** Does any portion of the surplus value produced by non-owner workers flow to individuals or entities *based solely on ownership* (member distributions, investor dividends, retained earnings controlled by owners) rather than as payment *for their labor* (wages/salary)?
          *   **Evidence:** Financial Statements (Profit & Loss, Distribution records), Investor Agreements, Retained Earnings policy.
          *   **Sufficiency:** Financial trace showing surplus (revenue - wages - material costs) is distributed to owners/investors or held for their collective benefit, while non-owners only receive wages.
          *   **Verdict:** **Exploitation Present** if surplus from non-owner labor flows to owners. Proceed to II.C.
      *   **C. Exploitation via External Inputs (Limited Scope):**
          *   **Question:** Does the co-op *directly* generate significant surplus by purchasing inputs (goods/services) *from non-cooperative entities* under conditions strongly suggesting *those entities exploit their own workers* (e.g., below living wage, union-busting, sweatshop labor)? (Focus: Significant, direct, egregious).
          *   **Evidence:** Major supplier contracts, supplier audits (rare), public reports, known industry practices.
          *   **Sufficiency:** High bar. Requires strong, credible evidence of severe worker exploitation *by a major supplier*. "Ordinary" wage labor suppliers are **presumed exploitative but insufficient for co-op's verdict** under this procedure due to complexity and scope. Formal vs Real Subsumption **dropped** as impractical; both are exploitative on core definition.
          *   **Verdict:** If strong evidence exists, **Exploitation Indirectly Supported**. Else, no additional verdict. (*Committee Note: This step is inherently limited; focus is primarily on internal relations*).
      *   **Overall Exploitation Verdict:** Present / Absent / Indirectly Supported.

  **III. Axis 2: Alienation (Character of Work) (45 min)**
  *(Assess for ALL core workers, owners and non-owners)*
      *   **A. Alienation from the Product:**
          *   **Question:** Do workers have significant collective control over *what* is produced and *how it is used/distributed* (beyond individual task execution)?
          *   **Evidence:** Bylaws (product/service scope), Strategic Plan approval process, Marketing/Sales decisions, Product Development input, Disposition of surplus/product.
          *   **Operationalization:** **Yes/No.** Look for formal mechanisms: Member votes on major product/service changes, strategy, sales channels, significant surplus allocation. Worker input structures in design/development. *Not* operationalized: Deep personal identification with the product.
          *   **Sufficiency:** Evidence of formal democratic control mechanisms over product/service scope and use.
      *   **B. Alienation from the Act of Producing (Labor Process):**
          *   **Question:** Do workers have significant collective control over *how* the work is organized, paced, and managed (work processes, tools, schedules, supervision)?
          *   **Evidence:** Org structure, Team/Workgroup autonomy policies, Defined supervisory roles (are they elected/rotational?), Scheduling processes, Grievance procedures.
          *   **Operationalization:** **Yes/No.** Look for: Self-managed teams, democratic hiring/firing of managers (or no managers), worker control over scheduling/task assignment, participatory process design. *Not* operationalized: Intrinsic enjoyment of every task.
          *   **Sufficiency:** Evidence of formal structures enabling collective control over work organization and management.
      *   **C. Alienation from Species-Being (Gattungswesen):**
          *   **Question:** Does the work structure provide meaningful opportunities for developing and applying human capacities (skill, creativity, intellect) and foster a sense of collective purpose?
          *   **Evidence:** Training & Development programs, Job design (variety, complexity), Opportunities for role rotation/learning, Mission/Vision statements, Meeting minutes reflecting purpose, Exit interviews (if available).
          *   **Operationalization:** **Partially/Not.** *Highly subjective.* "Partially" if evidence shows: Active skill development programs, designed job variety/autonomy, clear connection to co-op mission in communications. Relies heavily on committee interpretation of evidence. *Cannot be fully operationalized* from documents alone; requires worker testimony (infeasible in 2 hrs). Focus on structural *opportunities*, not individual experience.
          *   **Sufficiency:** Evidence of structures *enabling* development/purpose. **Hand back to Committee** for value judgment on sufficiency based on evidence.
      *   **D. Alienation from Other Human Beings:**
          *   **Question:** Is the workplace structured to minimize hierarchical domination and foster cooperative, non-instrumental relations among workers?
          *   **Evidence:** Pay equity ratios, Governance structure (flat vs hierarchical), Decision-making processes (consensus, voting), Conflict resolution mechanisms, Job titles/hierarchy, Communication policies.
          *   **Operationalization:** **Partially/Not.** "Partially" if: Narrow pay band (+/- evidence), democratic governance, formal cooperative processes, minimal hierarchy. "Not" if significant pay disparity, rigid hierarchy, top-down control. *Not* operationalized: Subjective feelings of camaraderie.
          *   **Sufficiency:** Evidence of structural features promoting equality/cooperation vs hierarchy/domination. **Hand back to Committee** for value judgment on degree.
      *   **Overall Alienation Verdict:** Low (A&B Yes, C&D Partially) / Moderate (A or B No, or C/D Not) / High (Multiple No/Not) / Inconclusive (C/D unclear). *Requires Committee synthesis.*

  **IV. Synthesis & Recommendation (20 min)**
      *   Summarize Exploitation Verdict (Present/Absent/Indirect).
      *   Summarize Alienation Verdict (Low/Mod/High/Inconclusive).
      *   **Flag Key Issues:** Explicitly note:
          *   Non-owner workers (II.B).
          *   Significant external control/investment (II.B/II.C).
          *   Species-Being/Social Alienation requiring committee judgment (III.C/III.D).
          *   Indirect exploitation via suppliers (II.C).
      *   **Recommendation:** Based on Federation Standards (e.g., "No exploitation, Low/Mod Alienation required"). Recommend: Pass / Conditional Pass (specify remediation) / Fail / Needs Committee Deliberation (specify unresolved issues).

  **Key Theoretical Choices & Imports:**
  1.  **Exploitation Definition:** **Imported.** Core Marxian theory describes *how* exploitation happens under capitalism but lacks a simple decision rule for complex cases (e.g., co-ops with employees). Used analytical-Marxist definition: **Exploitation occurs when workers lacking ownership of necessary assets produce surplus appropriated by owners.** This makes wages, consent, and alternatives **irrelevant** (your bakery concern). Ownership of the MoP by *all* workers is the key.
  2.  **Dropped Distinctions:**
      *   **Labor vs. Labor Power:** Load-bearing in theory (explains how "fair" wages hide exploitation) but **dropped**. The imported definition (II.B) captures the outcome without needing this step. Verdicts remain the same.
      *   **Absolute vs. Relative Surplus Value:** Explains *methods* of increasing exploitation (lengthening day vs. productivity). **Dropped** as irrelevant to the *existence* of exploitation, which is the focus.
      *   **Formal vs. Real Subsumption:** Describes capital's deepening control over labor. **Dropped** in II.C; both forms involve exploitation, and distinguishing them doesn't change the core verdict for the *member co-op's* responsibility under II.C.
  3.  **Alienation Operationalization:** **Imported Judgment.** Marx's descriptions are philosophical. Focused on structural *conditions enabling or preventing* alienation (control, purpose, equality) rather than subjective experience. Explicitly flagged III.C/III.D as requiring committee value judgment due to evidence limits.

  **Application to Your Files:**

  1.  **Bakery (12 owners, 6 seasonal non-owners):**
      *   **Exploitation (II):**
          *   II.A: No, not all core workers (bakers, sellers?) are owners. Non-owner seasonal workers exist.
          *   II.B: Q1: Yes, seasonal workers produce core goods. Q2: Yes, surplus they produce flows to member-owners via distributions (proportional to hours, but based on ownership). **Exploitation Present.**
          *   II.C: Assume no evidence of egregious input exploitation.
      *   **Alienation (III):**
          *   A: Likely Yes (members control product). Non-members? Probably No control.
          *   B: Likely Yes for members (self-managed?). Non-members? Probably No (take direction).
          *   C: Partially for members? (Baking can be skilled). Non-members? Likely Not (seasonal, repetitive). **Committee Judgment.**
          *   D: Partially for members (democracy). Non-members? Likely Not (separate class). **Committee Judgment.**
      *   **Verdict:** **Exploitation Present.** Alienation likely Low for members, High for non-members. Overall: **Fail** on Exploitation axis. Committee must weigh Alienation for non-members.

  2.  **Software Co-op (Worker-owned, VC Preferred Stock):**
      *   **Exploitation (II):**
          *   II.A: Yes, all core workers are owners.
          *   II.B: Not applicable (all core workers are owners).
          *   II.C: **Crucial Step.** VC claims based on ownership (preferred stock): Dividends? Liquidation preference payout? Board seat influence on surplus allocation? Evidence: Investor Agreement. *If* VC receives dividends or its preferences guarantee a claim on surplus exceeding its capital contribution (common), **Exploitation Present** (surplus flows to non-laboring owner). Board seat implies potential control over surplus allocation. **Likely Exploitation Present via II.C (External Claimant).**
      *   **Alienation (III):**
          *   A: Likely Yes (workers own co-op, control product?).
          *   B: Likely Yes (self-managed tech?).
          *   C: Partially/Yes (creative work, skill development).
          *   D: Partially (pay equity? VC board seat = external hierarchy influence). **Committee Judgment.**
      *   **Verdict:** **Exploitation Likely Present** due to VC claim. Alienation likely Low/Mod. **Fail** on Exploitation axis. *The VC relationship fundamentally compromises the co-op's non-exploitative structure.*

  3.  **Member Co-op (Outsourced Cleaning):**
      *   **Exploitation (II):**
          *   II.A: Yes, all *core workers defined by the co-op* are owners. Cleaning is outsourced.
          *   II.B: Not applicable (no *internal* non-owner workers).
          *   II.C: **Critical Step.** Outsourced cleaning is a *major input*. The non-union firm *almost certainly* exploits its workers (standard wage labor). The member co-op *directly benefits* from lower costs/surplus generated by this exploitation (12% distribution increase). **Exploitation Indirectly Supported.**
      *   **Alienation (III):** (For the *member* workers only, as cleaners are external)
          *   A/B/C/D: Likely scores well ("impeccable internal democracy").
          *   Verdict: **Low Alienation** (for members).
      *   **Verdict:** **Exploitation Indirectly Supported.** Alienation Low. **Fail** on Exploitation axis. *The co-op's internal democracy is negated by its reliance on exploiting external workers.*

  **Where the Procedure Will Misfire & Limitations:**

  1.  **Gaming the System:**
      *   **Nominal Ownership:** Set absurdly high buy-ins or long vesting periods for "members," keeping workers as de facto employees. (Procedure catches II.A "No" and II.B).
      *   **Token Control:** Grant minimal input on minor issues (Alienation A/B) while retaining real power elsewhere. (Procedure relies on committee interpreting evidence of *significant* control).
      *   **Exploitative Supply Chains:** Obfuscate suppliers or use complex intermediaries. (II.C requires strong evidence; easy to hide).
      *   **"Happy" Exploitation:** Non-owner workers paid well above market, genuinely satisfied. **Procedure still flags Exploitation (II.B)** based on asset ownership/surplus flow, rejecting the "better off" justification. This is a *feature*, not a bug, per your requirement.
  2.  **Unobtainable Inputs:**
      *   **Subjective Alienation (III.C/III.D):** Worker satisfaction, sense of purpose, quality of social relations. Requires surveys/interviews (infeasible).
      *   **Supplier Labor Conditions (II.C):** Reliable, verifiable data on supplier working conditions is extremely rare without dedicated audits.
      *   **VC Influence Nuance (II.C):** Quantifying the precise impact of a board seat on surplus allocation is often speculative.
      *   **"Species-Being" Evidence:** Documented opportunities exist, but proof of meaningful development/purpose is subjective.
  3.  **Misclassification:**
      *   **False Negative on Exploitation (II.C):** Co-op uses exploitative suppliers but hides it well. Procedure relies on scarce evidence.
      *   **False Positive on Alienation:** Co-op has excellent structures (III.A/B) but toxic culture making work alienating (III.C/D). Procedure can't capture culture.
      *   **Overlooked Exploitation:** Very small number of non-owner workers producing minimal surplus might be deemed insignificant, though theoretically exploitative. (Procedure relies on "core labor" definition).
      *   **"Good" Capital?:** A truly patient, non-controlling, dividend-free social investor might be misclassified as causing exploitation under II.C if they hold equity, even without claiming surplus. (Procedure prioritizes structure over stated intent).
  4.  **Inherent Limitations:**
      *   **Cannot Measure Subjective Experience:** Alienation's core is phenomenological. The procedure assesses *conditions*, not lived experience.
      *   **Limited Scope on Supply Chains:** Only catches direct, major, *egregious* exploitation based on *available* evidence. "Ordinary" exploitation is pervasive but often invisible.
      *   **Value Judgments Required:** Species-Being (III.C) and Social Alienation (III.D) verdicts remain partially subjective committee decisions.
      *   **Ignores Macro Effects:** Doesn't assess if the co-op reinforces capitalism overall, only its internal and direct external relations.
      *   **Static Snapshot:** Assesses current structure, not historical development or future trajectory.

  **Conclusion:** This procedure provides a rigorous, Marxian-informed framework focused on observable structures of ownership, surplus flow, and worker control. It cleanly separates exploitation and alienation, operationalizes core concepts where possible, explicitly flags necessary value judgments and evidence gaps, and addresses the critical issue of "fair" exploitation and external relationships. It will reliably flag the cases you *want* flagged (like your third file) based on the imported analytical definition of exploitation. Its effectiveness depends critically on the committee's willingness to engage with the structural logic of exploitation (II.B & II.C) and make informed judgments on alienation's less tangible aspects (III.C & III.D). It is a tool for structural analysis, not a perfect measure of worker well-being or revolutionary purity.
