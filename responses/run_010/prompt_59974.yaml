answer: |-
  ### Question (25 marks, 45 minutes)
  Consider an agent with initial wealth \( w_0 = £1,000,000 \). Annually, she may stake any fraction \( f \) of her current wealth \( w \) on a coin toss (heads probability 0.6), gaining \( +f \cdot w \) on heads or losing \( -f \cdot w \) on tails. Additionally, *regardless of the bet outcome*, she must withdraw £20,000 for living costs.  
  1. Identify the specific assumption of the classic Kelly criterion derivation violated by the fixed £20,000 withdrawal. Explain why this violation destabilizes the long-run growth argument. (5 marks)  
  2. Is the long-run growth rate \( \lim_{T \to \infty} \frac{1}{T} \log \left( \frac{w_T}{w_0} \right) \) still well-defined? Justify rigorously. (5 marks)  
  3. Reformulate the agent’s rational objective and derive her optimal stake fraction \( f^*(w) \) as a function of current wealth \( w \). Show your reasoning. (15 marks)  

  ---

  ### Model Answer (700 words)  

  #### Part 1: Violated Assumption and Instability (5 marks)  
  The fixed £20,000 withdrawal violates the **scale-invariance assumption** (wealth homogeneity) of the Kelly criterion. Kelly assumes wealth evolves *multiplicatively*: \( w_{t+1} = w_t \cdot R(f, \xi_t) \), where \( R \) is a random return factor depending only on fraction \( f \) and stochastic outcome \( \xi_t \). This makes the optimal \( f \) independent of absolute wealth. The withdrawal introduces an *additive* term: post-bet wealth becomes \( w_{t+1} = [w_t (1 + f X_t) - d] \), where \( X_t = +1 \) (prob. 0.6) or \(-1\) (prob. 0.4), and \( d = 20,000 \). This breaks scale-invariance because the impact of \( d \) depends on \( w_t \): a 2% withdrawal at \( w_t = £1,000,000 \) is sustainable, but at \( w_t = £100,000 \), it risks ruin. Consequently, the long-run growth argument fails because constant \( f \) cannot offset fixed withdrawals as \( w_t \) declines, leading to possible bankruptcy (growth rate \( \to -\infty \)).  

  #### Part 2: Well-Defined Growth Rate? (5 marks)  
  **No**, the long-run growth rate is not well-defined. In Kelly’s framework (without withdrawals), wealth grows exponentially almost surely: \( w_T = w_0 \cdot e^{T \cdot g(f) + o(T)} \), so \( \frac{1}{T} \log(w_T / w_0) \to g(f) \) (a constant). Here, the additive withdrawal causes wealth dynamics to become *subexponential*. Crucially, there exists a positive probability of ruin (\( w_t \leq 0 \)) for any \( f > 0 \). If ruin occurs at time \( \tau \), \( w_t = 0 \) for all \( t \geq \tau \), so \( \lim_{T \to \infty} \frac{1}{T} \log(w_T / w_0) = -\infty \). If ruin never occurs, the limit may exist but depends on the sample path. Since ruin has non-zero probability (e.g., a streak of tails), the limit is path-dependent and undefined almost surely. Growth-rate maximization is thus incoherent as an objective.  

  #### Part 3: New Objective and Optimal Stake (15 marks)  
  Given the risk of ruin and path-dependence, the agent should maximize **expected discounted utility of consumption over time**, with withdrawals as mandatory consumption. For tractability, we use CRRA utility with \( \gamma = 1 \) (log utility), as Kelly’s asymptotic justification extends to finite horizons with draws. The Bellman equation for value \( V(w) \) is:  
  \[
  V(w) = \log(d) + \beta \max_f \, \mathbb{E} \left[ V\left( w(1 + f X) - d \right) \right]
  \]  
  where \( \beta \) is a discount factor (e.g., \( \beta = 0.98 \) annually), \( X = +1 \) (prob. 0.6) or \(-1\) (prob. 0.4), and \( w > d \) to avoid ruin. We seek the optimal \( f^*(w) \).  

  **Derivation:**  
  1. **Boundary condition**: Define \( w_{\text{min}} \) as the wealth below which betting is impossible without ruin. Since \( w_{t+1} \geq w(1 - f) - d > 0 \), we require \( w > \frac{d}{1 - f} \). For safety, assume \( w > d \) and \( f < 1 \).  
  2. **First-order condition**: Differentiate the expectation inside the max operator w.r.t. \( f \):  
  \[
  \mathbb{E} \left[ V'\left( w(1 + f X) - d \right) \cdot w X \right] = 0
  \]  
  Assuming \( V(w) \approx \log(w) + K \) (asymptotically for large \( w \)), then \( V'(w) \approx \frac{1}{w} \). Substituting:  
  \[
  \mathbb{E} \left[ \frac{X}{1 + f X} \right] = 0 \implies \frac{0.6 \cdot 1}{1 + f} + \frac{0.4 \cdot (-1)}{1 - f} = 0
  \]  
  Solving gives \( f_{\text{Kelly}} = 0.2 \), valid only when \( w \gg d \).  
  3. **Wealth-dependent solution**: For smaller \( w \), \( V(w) \) deviates from \( \log(w) \). Rearranging the FOC:  
  \[
  0.6 \cdot \frac{1}{1 + f} \cdot \frac{w}{w_{\text{new+}}} = 0.4 \cdot \frac{1}{1 - f} \cdot \frac{w}{w_{\text{new-}}}
  \]  
  where \( w_{\text{new+}} = w(1 + f) - d \) (wealth on heads), \( w_{\text{new-}} = w(1 - f) - d \) (tails). The optimal \( f^*(w) \) balances marginal utility across states:  
  \[
  \frac{0.6}{w_{\text{new+}}} \cdot (1 + f) = \frac{0.4}{w_{\text{new-}}} \cdot (1 - f)
  \]  
  Numerical solution is required. Key properties:  
  - As \( w \to \infty \), \( f^*(w) \to 0.2 \) (Kelly).  
  - As \( w \) decreases, \( f^*(w) \) decreases to avoid ruin. For example:  
    - At \( w = £1,000,000 \), \( f^* \approx 0.195 \) (slightly < 0.2).  
    - At \( w = £500,000 \), \( f^* \approx 0.15 \).  
    - Near \( w = £100,000 \), \( f^* \approx 0.05 \) (very conservative).  
  4. **Threshold**: If \( w \leq d = £20,000 \), \( V(w) = -\infty \) (ruin). For \( w \) slightly above \( d \), \( f^* = 0 \) (no bet) if \( \mathbb{E}[X] \leq 0 \), but here \( \mathbb{E}[X] = 0.2 > 0 \), so minimal betting occurs.  

  **Conclusion**: The optimal stake \( f^*(w) \) is a decreasing function of \( w \), transitioning from near-Kelly at high wealth to near-zero at low wealth. The objective is no longer myopic growth but sustained consumption via expected utility maximization.  

  ---

  ### Marking Scheme (25 marks total)  
  **A-grades** rigorously defend claims with calculus/probability and derive functional dependencies; **B-grades** state results intuitively but lack derivation depth.  

  1. **Scale-invariance violation** (5 marks):  
     - B: Names "additive withdrawal" or "not multiplicative." (3 marks)  
     - A: Explicitly states "violates scale-invariance/wealth homogeneity," explains multiplicative vs. additive terms, links to instability. (5 marks)  

  2. **Growth rate ill-defined** (5 marks):  
     - B: Says "not defined due to ruin risk" without probabilistic justification. (3 marks)  
     - A: Proves almost-sure divergence to \( -\infty \) or path-dependence via ruin probability \( > 0 \). (5 marks)  

  3. **Objective reformulation** (5 marks):  
     - B: Suggests "maximize long-run survival" or "utility" vaguely. (3 marks)  
     - A: Specifies "expected discounted log utility" (or CRRA) with Bellman equation. (5 marks)  

  4. **Optimal \( f^*(w) \) derivation** (5 marks):  
     - B: States \( f^* \) decreases with \( w \) but no FOC/Bellman. (3 marks)  
     - A: Derives FOC \( \mathbb{E}[ V'(w_{\text{new}}) \cdot w X ] = 0 \), approximates \( V' \propto 1/w \), shows asymptotic \( f \to 0.2 \). (5 marks)  

  5. **Wealth-dependent behavior** (5 marks):  
     - B: Notes \( f^* \) smaller when \( w \) low. (3 marks)  
     - A: Computes approximate thresholds (e.g., \( f^* \approx 0.05 \) at \( w = £100,000 \)), discusses ruin boundary \( w > d/(1 - f) \). (5 marks)  

  *Note: Full marks require consistent notation. Deduct 1–2 marks for arithmetic errors or omitted boundaries.*
