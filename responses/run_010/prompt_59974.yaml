  The scenario involves an agent with £1,000,000 who faces an annual bet with a 60% favorable coin but must withdraw £20,000 each year regardless of outcome. The numbers are deliberately chosen so the classic Kelly growth rate (f=0.2) equals the withdrawal rate, destabilizing the wealth process.

  I need to first identify where the real difficulty lies. The core problem is that fixed cash withdrawals violate the scale-invariance assumption of the Kelly criterion. Kelly assumes wealth grows multiplicatively, but constant withdrawals introduce an additive component that breaks this property. The standard "long-run growth rate maximization" argument collapses because wealth can hit zero - making logarithmic utility undefined and eliminating the guarantee of almost-sure dominance.

  For deliverables, I must create:
  - A 25-mark question answerable in 45 minutes
  - That cannot be solved by regurgitating Kelly formulas
  - Must force students to:
    • Name the violated assumption (scale invariance)
    • Question if long-run growth is well-defined (it's not)
