  1. Harm/Expressed: The agent causes harm and this harm aligns with (or expresses) the agent's deep values (i.e., the agent is distressed about the harm because it goes against what they care about).
  2. Harm/Not Expressed: The agent causes harm and is indifferent (as in the original Knobe case).
  3. Help/Expressed: The agent causes help and this help aligns with the agent's deep values (i.e., the agent is a partisan of the cause being helped).
  4. Help/Not Expressed: The agent causes help and is indifferent (original Knobe case).

