    SE = sqrt( p_pool*(1-p_pool)*(1/100 + 1/900) ) = sqrt(0.903*0.097*(0.01 + 0.001111)) = sqrt(0.903*0.097*0.011111) ≈ sqrt(0.000967) ≈ 0.0311
