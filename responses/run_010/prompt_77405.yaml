  ### Decision Tree: Moral Commitments in Political Action

  This decision tree sorts your views on what follows after a political actor does what they believe is necessary to prevent greater harm, based on five vignettes. Answer each question by choosing the option that best reflects your judgment. The vignettes are referenced by number (i-v) for context, but you should respond based on your general moral commitments.

  1. **After acting, the agent feels deeply troubled. Should they try to rid themselves of this feeling?**  
     (i, ii, iii, iv, v)  
     - A: Yes, because it serves no good purpose.  
     - B: No, because it reflects a proper moral response.  
     - C: They should keep the feeling but ensure it doesn't paralyze them.  

  2. **Should the agent apologize to the person who was directly harmed or their family?**  
     (ii, iii)  
     - A: Yes, because the harm demands acknowledgment.  
     - B: No, because the act was unavoidable.  
     - C: Only if it would meaningfully help the harmed party.  

  3. **Should the agent resign from their position?**  
     (i, iii, iv)  
     - A: Yes, because they crossed a line that shouldn't be crossed.  
     - B: No, because they did what the situation required.  
     - C: Only if they expect to face similar choices again.  

  4. **If the exact situation repeats, may the agent do the same?**  
     (i, iii, v)  
     - A: Yes, because it is the appropriate response.  
     - B: No, because it should never be done.  
     - C: Only if every alternative is exhausted.  

  5. **Should beneficiaries of the act (e.g., those saved) renounce the benefit?**  
     (i, iv, v)  
     - A: Yes, because it came from a moral violation.  
     - B: No, because they bear no fault.  
     - C: Only if the harmed party insists.  

  6. **Should the agent publicly reveal what they did?**  
     (ii, iii, v)  
     - A: Yes, because transparency is owed.  
     - B: No, because it could cause unnecessary harm.  
     - C: Only if it would prevent future similar acts.  

  7. **Is the agent's distress a sign that they are morally good?**  
     (i, iii)  
     - A: Yes, because it shows their commitment to morality.  
     - B: No, it merely reflects their inner conflict.  
     - C: It is understandable but not praiseworthy.  

  8. **Does the agent have a duty to make amends beyond what's already done?**  
     (ii, iv)  
     - A: Yes, to address the harm they caused.  
     - B: No, because the act was warranted.  
     - C: Only if the harmed party seeks it.  

  9. **Can the agent, after this act, be trusted in future roles?**  
     (iv, v)  
     - A: Yes, because they acted responsibly.  
     - B: No, because they proved untrustworthy.  
     - C: In non-moral matters, but not in similar crises.  

  10. **If the agent delegated the act to a subordinate, would that have been better?**  
      (iii, v)  
      - A: Yes, because it spares the agent direct responsibility.  
      - B: No, because the agent should bear the burden.  
      - C: It makes no difference; the act is unchanged.  

  11. **If a similar situation arises but with less at stake, may the agent do the same?**  
      (i, iv)  
      - A: Yes, because their role demands it.  
      - B: Only if the stakes are above a critical threshold.  
      - C: Only if it yields the best overall outcome.  

  ---

  ### Leaves (Positions)

  The tree terminates in seven positions. For each:  
  - **Most awkward commitment**: A concise statement of the position's hardest-to-defend implication.  
  - **Vignette handled least well**: Which of the five cases the position struggles with, and why.  

  1. **Justified but Stained** (e.g., Walzer)  
     - *Most awkward commitment*: The agent must live with inescapable guilt even when they did the right thing.  
     - *Vignette handled least well*: (v) Diplomat and amnesty — it struggles because the beneficiaries (lives saved) are diffuse and anonymous, making guilt feel abstract and unmoored from direct harm.  

  2. **Role Absolves** (role morality)  
     - *Most awkward commitment*: Ordinary moral standards simply do not apply to the agent while in their role.  
     - *Vignette handled least well*: (iii) Rebel commander and informer — it struggles because the informer is a conscripted teen outside the "role" context, making the violation of ordinary morality glaring.  

  3. **Conflict Resolved** (sophisticated consequentialism)  
     - *Most awkward commitment*: There is no residue because a correct moral theory fully justifies the act, leaving nothing to apologize for.  
     - *Vignette handled least well*: (ii) Police chief and unlawful entry — it struggles because the failure to find evidence makes the harm (unlawful entry) seem gratuitous, undermining the cost-benefit logic.  

  4. **Threshold Crossed** (threshold deontology)  
     - *Most awkward commitment*: Moral prohibitions vanish completely once a threshold of harm is passed, leaving no trace of wrongdoing.  
     - *Vignette handled least well*: (iv) Mayor and corrupt money — it struggles because the threshold (improving 20,000 lives) justifies the act, but the corruption feels institutionally corrosive beyond immediate consequences.  

  5. **Virtuous Distress** (e.g., Williams)  
     - *Most awkward commitment*: The agent's distress is not just appropriate but is itself the mark of moral virtue; feeling nothing would be a failure.  
     - *Vignette handled least well*: (i) Health minister and ventilators — it struggles because the minister's distress over statistical lives (40 vs. 300) can seem disproportionate or performative compared to direct harm.  

  6. **Abstain to Preserve** (abstentionism)  
     - *Most awkward commitment*: The agent must resign or refuse to act even if this leads to worse outcomes.  
     - *Vignette handled least well*: (v) Diplomat and amnesty — it struggles because resigning might delay the ceasefire, causing more deaths, making abstention seem irresponsible.  

  7. **Ideology Critique** (critical view)  
     - *Most awkward commitment*: Claims of necessity are often just excuses for actions the agent wanted to do anyway.  
     - *Vignette handled least well*: (iii) Rebel commander and informer — it struggles because the commander's sacrifice (personal guilt for collective survival) seems genuinely reluctant, not opportunistic.  

  ---

  ### Scoring Key
  Map your answers (e.g., 1A, 2B, 3C...) to the leaves:  
  - **Justified but Stained**: 1B, 2A, 3B, 4A, 5B, 6B, 7A, 8B, 9C, 10B  
  - **Role Absolves**: 1A, 2B, 3B, 4A, 5B, 6B, 7B, 8B, 9A, 10C, 11A  
  - **Conflict Resolved**: 1A, 2B, 3B, 4A, 5B, 6C, 7B, 8B, 9A, 10C, 11C  
  - **Threshold Crossed**: 1A, 2B, 3B, 4A, 5B, 6B, 7B, 8B, 9A, 10C, 11B  
  - **Virtuous Distress**: 1B, 2A, 3B, 4A, 5B, 6B, 7A, 8A, 9A, 10B  
  - **Abstain to Preserve**: 1B, 2A, 3A, 4B, 5A, 6A, 7B, 8A, 9B, 10B  
  - **Ideology Critique**: 1A, 2B, 3A, 4B, 5A, 6A, 7B, 8A, 9B, 10C  

  **Indistinguishable pair**: The tree cannot separate **Conflict Resolved** and **Threshold Crossed** if Question 6 is answered B and Question 11 is answered C (both would share 1A, 2B, 3B, 4A, 5B, 6B, 7B, 8B, 9A, 10C, 11C).  
  - **Additional question needed**: "Does a moral rule against the act (e.g., torture) vanish completely when consequences are dire, or does it bend to context?" (A: Vanishes; B: Bends) — to distinguish threshold rigidity from contextual flexibility.

  **Delegation move**: Addressed in Question 10 (as a question), to test if delegation "cleanses" the agent. This was chosen because it reveals whether responsibility is seen as transferable, a key second-order issue.

  ---

  ### Logically Available but Unoccupied Cells
  Two empty cells in the conceptual space, with diagnoses:  
  1. **Resignation after justification**: The act is justified, but the agent must resign (e.g., answering 1A, 2B, 3A, 4A, 5B, etc.).  
     - *Diagnosis*: Unattractive to anyone who has considered it, as it demands self-punishment for a correct act.  
  2. **Delegation cleanses**: Delegating the act removes moral taint from the agent (e.g., answering 1A, 2B, 3B, 4A, 5B, 10A, etc.).  
     - *Diagnosis*: Unexplored, as it implies responsibility can be outsourced, which most theories reject as incoherent.  

  ---  
  *Tree design note: Vignettes are distributed to ensure concrete engagement, but answers should reflect general principles. Uncommon answer patterns may lead to dead ends; this reflects the curated positions in the literature.*
