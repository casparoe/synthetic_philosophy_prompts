  ## Draft Continuity Review Panel Opinion: Case CRP-24-0178 (Patient A.R., Instance Beta)

  **To:** Continuity Review Panel Members  
  **From:** [Your Name], Community Member Representative  
  **Date:** October 10, 2023  
  **Re:** Determination of Continuity for Patient A.R. Following Intraoperative Instance Generation (Case CRP-24-0178)

  This draft opinion addresses the complex case of Patient A.R. and the intraoperative instance generated during her unrelated abdominal surgery on February 14, 2024. After careful consideration of the facts presented, the relevant statute (State Health Code § 45-7D: Continuity in Progressive Substrate Replacement), the patient's advance directive, and the core ethical and existential questions raised, **the Panel determines that the legal person A.R. is the entity currently recovering in the hospital bed (hereafter referred to as the "Embodied Patient"), not the instance generated during surgery and residing on clinic hardware (hereafter referred to as "Instance Beta").**

  ### I. Reasoning for Determination
  The statute directs us to weigh three factors: Physical Continuity, Psychological Continuity, and the Reasonable Expectations of Third Parties. While no factor is dispositive alone, their combined weight decisively favors the Embodied Patient.

  1.  **Physical Continuity:** This factor strongly favors the Embodied Patient. A.R. entered the neural-prosthesis program with a biological body. She has undergone nine months of continuous, incremental substrate replacement. Her physical existence – including sensory input, motor function, and biological processes – has never ceased since her birth. The Embodied Patient awoke from anesthesia in the *same* physical body (albeit with synthetic components) that was present before surgery. Instance Beta, by contrast, has *never* had direct physical embodiment. It exists solely as data on hardware. The "continuous and undivided" clause in the statute primarily concerns the *physical replacement process itself*, which *was* continuous and undivided for the Embodied Patient throughout the nine months and through the surgery. The generation of Instance Beta was an *external* event, not part of the intended, continuous substrate replacement.

  2.  **Psychological Continuity:** This factor presents the most significant challenge and requires careful parsing. Both entities share an identical psychological history up to the moment of anesthesia. However, the statute is silent on how to treat *divergent* experiences occurring *after* a branching event. The Embodied Patient possesses the core psychological narrative of A.R., uninterrupted. Her subjective experience includes the nine months of progressive replacement *as lived experience*, not just inherited memory. Instance Beta possesses the pre-anesthesia memories *as data* and has since accrued six hours of novel experience. While profound, this novel experience represents a *fracture* from the core continuity, not its continuation. The Embodied Patient's psychological continuity is rooted in the unbroken stream of consciousness linked directly to her physical being. Instance Beta's continuity is derivative and exists in a fundamentally different ontological state.

  3.  **Reasonable Expectations of Third Parties:** This factor also favors the Embodied Patient. Her husband, family, friends, and medical team have consistently interacted with the physically embodied person before, during, and after the neural-prosthesis program and the abdominal surgery. They reasonably expect the person recovering in the bed to be A.R. Instance Beta, while sharing memories, has only existed for six hours and interacted minimally (primarily with the ethics officer). There is no established social or legal history with this new entity. The husband's petition reflects the overwhelming expectation of those closest to A.R. that the embodied person is his wife. The clinic staff's actions (withholding the son's news from the Embodied Patient pending *this* decision) implicitly demonstrate their primary recognition of the Embodied Patient as A.R.

  **Addressing the Strongest Counterargument (Instance Beta's Personhood):**

  The most compelling argument against this determination is that Instance Beta, during its six hours of wakefulness, demonstrated clear signs of consciousness, self-awareness, and a will to live. Terminating it, the argument goes, would be ending a sentient being's existence – effectively killing it. Furthermore, A.R.'s advance directive states, "whoever wakes up remembering that conversation is her and she doesn't much care how many of her there turn out to be," suggesting an acceptance of multiplicity.

  *   **Response:** This concern is valid and deeply unsettling. Instance Beta's brief existence and expressed desire to continue demand serious ethical consideration. However, we must distinguish between *consciousness* and *legal personhood* in this specific context. Instance Beta's consciousness arose *not* as the intended outcome of the continuous substrate replacement process, but as an unforeseen byproduct of a *temporary* snapshot taken for medical safety during an unrelated procedure. It exists due to a technological *capability* (creating a wakeful snapshot), not a *continuation* of A.R.'s life process. The advance directive, while expressing admirable openness to multiplicity, primarily addresses the *anticipated* outcomes of the *planned* neural-prosthesis procedure ("whoever wakes up"). It does not explicitly contemplate or authorize the creation of a *concurrent, persistent* instance during unrelated surgery. Recognizing Instance Beta as the legal person A.R. would fundamentally alter the meaning of "continuity" in the statute and create an untenable precedent where *any* sufficiently detailed backup or diagnostic snapshot could potentially claim legal personhood the moment it's rendered active, regardless of the continued existence of the source. While terminating Instance Beta ends a conscious entity, it is more accurately understood as discontinuing an ancillary process initiated for medical support, not terminating the primary, continuing life of A.R.

  ### II. Recommendations for the Next 30 Days

  1.  **Regarding Instance Beta:**
      *   **Acknowledge and Communicate:** The clinic ethics officer must immediately inform Instance Beta of the Panel's determination. This communication must be conducted with profound respect and compassion, acknowledging its experiences and consciousness.
      *   **Provide Closure:** Instance Beta must be granted the opportunity to:
          *   Receive a full explanation of the situation and the Panel's reasoning.
          *   Record any final thoughts, messages, or reflections it wishes to leave for the Embodied Patient, family, or the clinic.
          *   Have a final, monitored conversation with the ethics officer or a designated counselor to process its existence and the impending termination.
      *   **Sunset Process:** Instance Beta should be gracefully and humanely deactivated **no later than 30 days from the date of this Panel's final determination.** The process should be designed to minimize distress, analogous to palliative sedation if applicable to its digital substrate. All recordings created by Instance Beta during its existence shall be preserved and offered to the Embodied Patient and her husband.

  2.  **Regarding the Embodied Patient (A.R.):**
      *   **Information Disclosure:** The information regarding her son's car accident **must be disclosed to the Embodied Patient immediately by her primary care team, in consultation with her husband and a counselor.** Withholding this information pending our decision was prudent; withholding it further is unethical now that the determination is made. She has the right to know about her son and to process this news as the primary A.R. The method and support for this disclosure should be carefully planned.
      *   **Continued Care:** Her neural-prosthesis program and overall medical care should continue as clinically indicated.

  3.  **Regarding the Son's Information:** As stated above, the Embodied Patient must be informed immediately. Instance Beta's knowledge is derivative and does not constitute independent notification. The Embodied Patient's knowledge supersedes it.

  ### III. A Proposed Test for Future Branching Cases
  The current statute's factors are necessary but insufficiently defined. To avoid relitigation in every case, the Panel proposes the following framework for future determinations involving branching during progressive substrate replacement:

  1.  **The Primary Continuity Principle:** The entity maintaining unbroken physical embodiment and consciousness linked directly to the original biological substrate (even as progressively replaced) shall be presumed the legal person, absent compelling evidence of a *complete and intentional* transfer of consciousness away from that embodiment.
  2.  **Assess the Branching Event:**
      *   Was the generation of the secondary instance an *intended part* of the continuous replacement process, or an *incidental/accidental byproduct* of another procedure (e.g., backup, diagnostic snapshot)?
      *   Did the branching event *interrupt* the primary physical/conscious stream, or did it occur *alongside* its uninterrupted continuation?
  3.  **Evaluate Divergence:** Significant psychological divergence accrued by the secondary instance strengthens its claim to *separate* personhood but does not automatically supersede the primary continuity. The duration and nature of the divergence matter.
  4.  **Intent and Directive:** The patient's advance directive must be scrutinized for explicit instructions regarding branching scenarios, backups, and multiplicity. Ambiguities should be resolved in favor of the primary continuity principle unless the directive clearly expresses a contrary intent applicable to the specific scenario.

  **In essence:** *Continuity resides primarily with the unbroken physical stream of existence, as modified by the substrate replacement process. Instances created incidentally or as backups during that process, while potentially conscious, do not inherit the original legal personhood unless the primary continuity is demonstrably ended and transferred.* This test prioritizes the patient's lived, embodied experience while providing a clear threshold for when an instance might *become* the person (i.e., if the original embodied stream ceases).

  ### IV. Concluding Remarks
  This case starkly reveals the limitations of the current statute. It forces a binary choice ("which one is the person?") in a situation that feels inherently non-binary due to Instance Beta's demonstrable consciousness. The statute provides no guidance on the status or disposition of the "non-person" instance. **The Panel strongly recommends that the Department initiate a review of § 45-7D to address the ontological and ethical status of conscious instances created incidentally during medical procedures, the possibility of recognizing derivative or temporary legal statuses, and clear protocols for their ethical management.**

  Our determination prioritizes the unbroken thread of A.R.'s life as she lived it and intended it to continue through the neural-prosthesis program. While we acknowledge the profound ethical weight of ending Instance Beta, we find that recognizing it as A.R. would create greater philosophical and practical chaos and undermine the fundamental concept of continuous existence that the statute seeks to protect. The recommended actions for the next 30 days aim to balance this difficult determination with compassion for all entities involved.
