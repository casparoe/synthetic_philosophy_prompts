prompt: |-
  I have no philosophy background, so I'd like help taking apart a sentence I heard used as a conversation-ender. I help out at a small animal shelter, and during an argument about whether it's acceptable to keep a dog kenneled for most of its life, one of the other volunteers said the whole worry was sentimentality: a dog is just a biological machine, Descartes was right, there's nobody inside it. Two minutes later he was describing how his own dog sulks when he leaves the house without her. I didn't have an answer at the time and I'd like one now.

  Could you separate out the distinct claims that "it's just a machine" might be standing in for here — a claim about how the body works, a claim about whether anything non-physical is involved, a claim about whether pain is felt rather than merely detected and reacted to, a claim about speech or improvised behaviour, a claim about moral standing — and say for each whether it is trivially true, defensible but contested, or simply false? Then tell me which of them he would actually need in order to get from "machine" to "so kenneling her does her no harm," and whether the sulking is evidence against any of them.

  One complication I can't resolve on my own: I've come across people who insist Descartes never denied that animals feel anything, only that they think. If that's a serious possibility rather than a dodge, show me where it changes the picture.
