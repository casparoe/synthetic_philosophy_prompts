  | Room richly detailed to edges of vision | Don't believe | **Lacks Direct Accessibility**: Known perceptual bias (overestimation of peripheral detail). |
  | Not thinking during run | Untrustworthy | **Lacks Direct Accessibility**: Introspection failure; thoughts are missed due to inattention. |
  | Itch on shoulder blade, scratched | Trustworthy | **Immediacy + Direct Accessibility**: Bodily sensation, reflexive action. |
