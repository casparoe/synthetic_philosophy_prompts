answer: |-
  The font on the screen swam slightly. "Vital," the Style Committee chair, Elara Vance, had typed. *Always prefer 'vital' when referring to persons in general contexts.* Below, the justification glowed with serene confidence: *'Vital' is the traditional, concise term. Its inclusive sense (encompassing all persons regardless of health status) is universally understood. Alternatives like 'person,' 'individual,' or 'citizen' are cumbersome or imply specific contexts.* Alistair Finch, Senior Lexical Editor for the Consolidated Communications Group, sighed. He’d drafted this section himself.

  "Objection logged," murmured Priya Sharma from Compliance, her voice tight over the speakerphone. "The 'Vital Futures' healthcare campaign. Feedback from the Chronic Illness Alliance: 'Vital' excludes us. It reinforces the association of value with able-bodiedness. They request 'people' or 'person'."

  Alistair leaned into his mic. "Priya, respectfully, the *meaning* is inclusive. The campaign *is* about health futures for everyone. 'Vital' carries connotations of energy, potential – precisely the aspirational tone we need. Using 'people' is… flabby. Generic. It loses the punch."

  Elara chimed in, smooth as polished oak. "Precisely, Alistair. Context makes the intent clear. It’s unfortunate some feel excluded, but language can’t cater to every hypersensitive interpretation. We’d lose all elegance, all efficiency. 'Vital' has served us well for decades. It’s *understood*."

  The call ended with the directive unchanged. Alistair felt the familiar thrum of vindication. Tradition, concision, understood meaning – pillars of clear communication. He fired off an email to the marketing team: *Re: Vital Futures Wording – retain 'vital'. Attached rationale. Context clarifies inclusivity.*

  Later, grabbing lunch, he overheard two junior editors.
  "...felt like a punch," one whispered. "My sister has ME. 'Vital Futures'? Sounds like a future she’s not invited to."
  "But it *means* everyone," the other countered weakly.
  "Does it? When you picture 'vital citizens'," the first pressed, "who do you see? Sprinters? CEOs? Or people needing mobility aids, struggling through brain fog?" They fell silent as Alistair passed. He quickened his step, the unease a pebble in his shoe.

  ***

  Wednesday brought a new directive. Elara dropped a thick folder on his desk. "The Pendleton University contract. Their new 'Campus Heritage Initiative'. They're hypersensitive about terminology relating to… well, demographics. Need our top linguist to vet the style guide appendix. Specifically, the generic term they prefer for 'person'. It's…" She wrinkled her nose. "Unique. Deadline: COB Friday. Make it defensible."

  Alistair opened the folder. The university's style guide excerpt leapt out:

  *Preferred Generic Term: 'Heritage'.*
  *Justification: 'Heritage' is our traditional, unifying term. Its inclusive sense (encompassing all students, faculty, and staff regardless of ethnic or cultural background) is deeply embedded in Pendleton's history and understood by our community. Alternatives like 'person,' 'student,' or 'individual' are contextually weak or fail to capture the shared legacy that binds us.*

  Alistair blinked. *Heritage?* He scanned the usage examples:

  *   *"All heritage are encouraged to attend the Founder's Day picnic."*
  *   *"Pendleton provides resources to support the mental well-being of its heritage."*
  *   *"The library is open to all heritage seeking knowledge."*

  A cold trickle started down his spine. It felt… jarring. Wrong.

  He drafted his initial note: *While appreciating tradition, 'heritage' as a generic term risks misinterpretation. Its primary association is with lineage, ancestry, cultural inheritance. In contexts like mental well-being, it might feel exclusionary to those whose families haven't been part of Pendleton's long history, or who don't identify primarily through inherited culture. Recommend 'people' or 'persons' for clarity and inclusivity.*

  He paused. His fingers hovered over the keyboard. *Tradition. Embedded meaning. Understood by the community. Context clarifies.* The phrases echoed, hollow now. He thought of Priya’s objection, the junior editor's words: *Who do you see?*

  He tried Pendleton's own justifications on for size: *"The inclusive sense is understood."* Understood by whom? Primarily by those whose *own* heritage was comfortably aligned with Pendleton's dominant narrative. *"Alternatives are cumbersome or lack resonance."* Flabby. Generic. Like 'people'. *"It's unfortunate some feel excluded, but language can't cater to every hypersensitive interpretation."*

  The arguments fit perfectly. They were *his* arguments. Defending 'vital'. Now, applied to 'heritage', they felt… obscene. Elegant efficiency curdled into erasure. He pictured a first-generation student, scholarship kid, reading "resources for heritage seeking knowledge." Would they feel *seen*? Or would they feel like a guest at someone else's family reunion? The *logic* was identical. The *weight* was unbearable.

  He deleted his draft. Sweat prickled his collar. He couldn't write the defense for 'heritage'. It felt like betrayal. But he couldn't write the rejection using arguments he’d just torpedoed for ‘vital’. His carefully constructed linguistic fortress had no door.

  ***

  Friday. The Pendleton appendix remained unfinished, a blinking cursor accusing him. Elara summoned him.

  "Pendleton is anxious, Alistair. And we have the 'Vital Futures' launch event recording today. You're narrating the corporate overview section. Script’s final, uses 'vital' throughout. Needs warmth, authority." She smiled. "Your rationale convinced them. Show them how it sounds."

  The recording booth was soundproofed, intimate. The engineer gave a thumbs-up. Alistair cleared his throat, looked down at the script. The word 'vital' appeared seventeen times in five minutes.

  *"...building a vital future for all vital citizens requires investment in vital infrastructure..."*
  His voice, usually resonant, caught slightly. He pictured his neighbour, Marina, vibrant, whip-smart, navigating campus in her power chair. *Vital?* The script said yes. Her exclusion whispered no.
  *"...ensuring every vital member of our community has access..."*
  He saw the junior editor’s face, heard her whisper: *A future she’s not invited to.*
  *"...the resilience and potential of our vital population..."*
  The Pendleton student, lost in the sea of 'heritage', materialized in his mind’s eye. The two faces blurred.
  *"...this vital initiative..."*
  His throat tightened. Each utterance of "vital" scraped like gravel. He was performing the exclusion he’d defended. The elegant, efficient, *understood* word tasted like ash. He stumbled over the next sentence.
  *"...will empower... vital... individuals..."* He choked. *Individuals.* The flabby alternative. A gasp of air in the suffocating room.

  "Cut!" The engineer peered in. "You okay, Alistair? Sounded a bit strained. Want water?"

  Alistair shook his head, unable to speak. He gestured for a minute. Elara's voice crackled in his headphones, cool, concerned. "Alistair? Is there a problem? We're on a tight schedule. The script is approved."

  He took a shuddering breath. "No. No problem. Let's... continue." His voice sounded thin, alien. He forced it lower, trying to reclaim authority. He read the rest mechanically, hitting every "vital" like a required step on a path he suddenly hated. Each one cost him. Not his job, perhaps, not yet, but something vital *within* the job – the certainty, the clean logic, the pride in wielding language efficiently. He felt stained.

  He emerged from the booth into the quiet office corridor. Elara was waiting, holding a printout. "Good recovery. Though maybe ease up on the gravitas next time." She handed him the sheet. It was the Pendleton appendix. His unfinished comments section was blank. Below it, Elara had written in neat, decisive script: *Revised. Arguments for 'heritage' align with our established principles on linguistic tradition and contextual understanding. See justification parallels in 'vital' usage (Ref: CCG Style Guide Sec 4.7). Append and send.*

  She patted his arm. "Sometimes we just need to see our own logic reflected back to us, don't we? Clears things right up. Get that sent by five." She walked away, heels clicking on the polished floor.

  Alistair stood frozen, the printout limp in his hand. The elevator doors across the hall slid open, empty. He could step in, descend, walk out. But the words would remain. 'Vital' echoing in the recorded campaign, 'heritage' about to be enshrined in Pendleton's guide with his implicit endorsement. Both defended by the same impeccable, unbearable logic. The doors slid shut. He didn't move. The corridor stretched, silent, holding only the unresolved weight of the words hanging in the air.
