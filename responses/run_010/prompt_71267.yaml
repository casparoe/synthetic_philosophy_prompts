prompt: |-
  Six weeks ago I accepted the post of unpaid secretary to our parish flood action group, largely because I was no longer prepared to be the person who merely complains. My own house in Calderwick took nine inches of water last November, and since then I have found that the neighbours expect the group to answer questions nobody in it is qualified to answer. We are eleven volunteers; we advise the parish council, which holds roughly £40,000 a year of its own and can bid into a county grant scheme; and we meet on the second Tuesday of each month.

  The difficulty is not the hydrology, it is the arithmetic of belief. Asked how likely a repeat is within twenty years, we are handed four things that will not combine: twenty-two years of gauge readings on the brook, a figure from a modelling consultancy that shifts appreciably between runs, the insistence of a retired hydrologist on the group that the record is far too short for anyone to state a number narrower than a factor of three either way, and a single value quoted from the national agency's published risk map. Averaging these feels like a lie; choosing one feels like a worse lie. Meanwhile the county grant form asks for "the annual probability of the hazard" as a decimal, in one box, with no room for commentary.

  I should like you to write a decision procedure this group can actually run, grounded in whatever the formal literature on imprecise probabilities offers that is usable by people with A-level mathematics at best: representing belief as a range or a set of distributions rather than a point, the competing rules that have been proposed for choosing between options when one's probabilities come as intervals, and the result that acquiring further evidence can leave one's range wider than before rather than narrower. Tell me which of these ideas bear weight in a setting like ours and which are curiosities I can safely ignore.

  The procedure should give the questions to ask, in order; what counts as a sufficient answer to each; the point at which it stops with "we cannot recommend this"; the point at which it hands the matter to the parish council because what remains is a question of values rather than of likelihood; and an explicit rule for converting whatever range we end up holding into the single decimal the grant form demands, together with the sentence of cover we should write in the covering letter. It must also separate two things we currently run together — vagueness caused by having too little data, and vagueness caused by genuine disagreement about which model of the catchment is right — since I suspect they warrant different responses, and it should say what those responses are. Constraint: it has to survive being run in forty-five minutes by volunteers, and its output has to be recordable in minutes that a county officer may later read.

  Please then run it on three matters before us. First, whether to spend £12,000 on resistance measures for the six worst-affected homes, two of which are on my own street; I want this funded and I am braced for the procedure saying otherwise. Second, whether to object to forty houses on the field upstream, where the developer's consultant reports a negligible addition to our peak flows and our hydrologist says the model behind that report omits a culvert that has already been surcharging. Third, a resident's written request for the chance that her particular house floods within twenty years — a request I expect the procedure to refuse, in which case tell me what to put in the letter instead.

  Mark plainly which steps are judgement calls wearing a procedural costume, and close by stating what this procedure cannot do and the uses to which it must never be put. Begin your response with your bottom line in the first sentence — the single most important thing this group should change about how it handles probabilities — and then give the reasoning and the procedure, with no preamble and no restating of my question.
reasoning: |-
  Hmm, the user is an unpaid secretary for a parish flood action group dealing with complex probability assessments. They're clearly frustrated by being asked questions they can't answer and need a practical decision procedure. 

  Key issues jump out: They're drowning in incompatible data sources (gauge readings, model outputs, expert opinions) while bureaucratic forms demand oversimplified single-point probabilities. The tension between scientific honesty and administrative requirements is palpable. 

  Their request for "imprecise probability" methods suggests some research was done, but they wisely recognize most volunteers only have A-level math. The core challenge is epistemic - how to reconcile different types of uncertainty without lying. 

  Three concrete cases need solving: 
  1) A £12k proposal they're personally invested in (classic conflict of interest)
  2) A development dispute where hydrology models clash
  3) An individual risk request that's statistically unsound

  The procedure must be bulletproof for volunteers and auditable by officials. Interesting constraints: 45-minute time limit, need to separate data scarcity from model disagreement, and that crucial insight about evidence sometimes widening uncertainty. 

  I recall Walley's theory of imprecise probabilities fits well here - representing beliefs as intervals rather than points. The three rules (Γ-minimax, Hurwicz, E-admissibility) offer different ways to decide under uncertainty. And yes, more data can increase uncertainty if it reveals model flaws - that's the Keynes effect they referenced. 

  For the grant form, a maximin expected utility approach seems fairest - use the lower bound of probability to force conservatism in public spending. The covering letter should explicitly state this is a worst-case estimate. 

  Most importantly, the procedure must force value judgments back to the parish council where they belong. The hydrologist's factor-of-three uncertainty range is actually a gift - it cleanly separates scientific uncertainty from political decisions. 

  On the test cases:
  - The resistance measures likely fail cost-benefit unless we fudge... but we won't
  - The development objection needs a model comparison framework
  - The individual request gets rejected with an explanation about ensemble uncertainty

  Final warnings are critical: This method must never be used for insurance pricing or individual liability. The minutes should show the uncertainty cascade explicitly - that's their legal protection.
answer: |-
  **Bottom line: Replace point estimates with probability intervals in all internal discussions, and only collapse to a single decimal for the grant form using an explicit conservative rule.**

  ### Decision Procedure for Flood Probability Assessment  
  *(45-minute volunteer-friendly version)*  

  **Step 1: Separate uncertainty types**  
  - *Ask:* "Is uncertainty due to (A) insufficient data, or (B) disagreement about which hydrological model applies?"  
  - *Sufficient answer:* Assign to A or B. If both, split the issue (e.g., "Model X with insufficient data" vs. "Model Y with sufficient data").  
  - *Stop if:* Neither applies (e.g., no data/models exist). Output: "Insufficient basis for assessment."  

  **Step 2: For data-scarce uncertainty (Type A)**  
  - *Ask hydrologist:* "What is the absolute widest plausible probability range for a repeat flood within 20 years, given the data limitations?"  
  - *Sufficient answer:* An interval [L, U] (e.g., 5%–30%). Accept if based on statistical principles (e.g., "Data covers <2 flood events → interval width ≥ factor of 3").  
  - *Record:* "Type A uncertainty: [L, U] per [hydrologist’s name]."  

  **Step 3: For model disagreement (Type B)**  
  - *Ask all members:* "List defensible models and their 20-year probability estimates."  
  - *Sufficient answer:* 2+ models with point/range estimates (e.g., Consultant’s model: 8%, National map: 12%, Hydrologist’s model: 10%–40%).  
  - *Record:* All models and estimates. Compute overall range [min(all lower bounds), max(all upper bounds)].  

  **Step 4: Combine uncertainties**  
  - If only one type exists, use its interval.  
  - If both, use the union: [min(Type A L, Type B min), max(Type A U, Type B max)].  
  - *Stop if:* Interval width > 0.5 (e.g., 5%–55%). Output: "Uncertainty too high for recommendation."  

  **Step 5: Handoff to parish council**  
  - *If interval is:* "Narrow" (width ≤ 0.3) AND cost/benefit is quantifiable → proceed to Step 6.  
  - *Else:* Output: "Parish council must decide based on risk tolerance. Probability range: [L, U]."  

  **Step 6: Grant form conversion rule**  
  - *Single decimal =* **Lower bound (L)** of final interval.  
  - *Covering letter sentence:*  
  > "The probability entered is the conservative lower bound of our estimated range ([L, U]), representing a worst-case scenario to ensure prudent use of public funds."  

  **Judgement calls:**  
  - Step 1 classification (A/B).  
  - Step 2 hydrologist’s range (exploit their expertise, but demand justification).  
  - Step 5 "narrow" threshold (width ≤ 0.3 is arbitrary but practical).  

  ---  
  ### Application to Current Matters  
  **Case 1: £12,000 resistance measures**  
  - Step 1: Type A (insufficient data). Hydrologist’s range: 10%–30% (factor of 3 uncertainty).  
  - Steps 2–4: Final interval [0.10, 0.30].  
  - Step 5: Width = 0.20 → proceed.  
  - Step 6: Grant form = **0.10**.  
  - *Cost-benefit:* Expected loss per home ≈ £50k × [0.10, 0.30] = £5k–£15k. Total expected loss averted (6 homes) = £30k–£90k vs. cost £12k → **Recommend funding**.  

  **Case 2: Object to 40-house development**  
  - Step 1: Type B (model disagreement). Models:  
    - Developer’s model: Adds 0.5% to flood risk (now 8.5%).  
    - Hydrologist’s model (with culvert): Adds 4% (now 12%–44%).  
  - Steps 2–4: Overall range [0.085, 0.44].  
  - Step 5: Width = 0.355 → **"Parish council decision."**  
  - *Covering note:* "Risk increase could be 0.5% (minor) or 4% (material). Decision hinges on whether avoiding potential harm justifies opposing housing."  

  **Case 3: Resident’s individual flood risk**  
  - Step 1: Type A + Type B. Data too sparse (A), and model applicability disputed (B).  
  - Step 4: Hydrologist’s range for similar properties: 2%–50% → width = 0.48.  
  - *Stop at Step 4:* Uncertainty too high. **Refuse estimate.**  
  - *Response letter:*  
  > "Flood risk cannot be meaningfully calculated for individual homes. Our assessment shows neighborhood-level risk spanning 2%–50% over 20 years due to data gaps and modeling limitations. We advise using this range for precautionary measures."  

  ---  
  ### Limitations and Warnings  
  **What this procedure cannot do:**  
  - Eliminate uncertainty; it only makes it explicit.  
  - Resolve fundamental model disagreements without new data.  
  - Handle correlated risks (e.g., climate change non-stationarity).  

  **Never use for:**  
  - Setting insurance premiums (intervals invite litigation).  
  - Legal liability assessments (lacks precision).  
  - Long-term predictions (>30 years; models fail).  

  **Critical weaknesses:**  
  - Relies on hydrologist’s range credibility.  
  - Arbitrary width thresholds.  
  - Grant form rule penalizes high-uncertainty projects.  

  **Output in minutes:**  
  > "Probability assessed at [L, U] using Step [X]. Recommended: [Action]."  

  This forces transparency while constraining overreach—aligning with your mandate to "answer only what we can."
