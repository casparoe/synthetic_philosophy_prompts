prompt: |-
  Help me settle an argument at a journal where I'm a handling editor. We get maybe ten submissions a month that are pseudoscience in various costumes, and the EIC wants a one page desk reject policy that a non-specialist can actually apply in fifteen minutes and defend when the author appeals. I keep saying the demarcation problem is unsolved so we shouldn't pretend to have a criterion; my colleague says pick falsifiability and be done with it.

  So: take the usual candidates — verifiability, falsifiability, Lakatos's progressive vs degenerating problem shift, fit with the surrounding paradigm, Bayesian degree of confirmation, ad hoc-ness, and the courtroom style factors (stated error rates, whether there are standards controlling the technique, general acceptance in the field) — and give each two scores out of 10, one for philosophical defensibility and one for policy usability by a tired non-expert. Flag where the two come apart most; my hunch is the most defensible ones are the least usable and vice versa, and I want to know if that's wrong.

  Then rank them on usability alone, tell me which single one you'd build the policy around, and which two, combined, would most often make us reject somthing that's actually good work. Be blunt about any candidate that sounds impressive in a seminar and is worthless at a desk. No citations, I'll add those myself if we end up using it.
