  For the second part - what this reveals about the theories - I'm struck by how the unique features of this case (long-term stewardship, institutional decision-making, non-identity problems) expose gaps in frameworks typically applied to individual ethics. The theories seem silent on symbolic aspects like the moral weight of certifying eradication.

  I should be particularly mindful of the user's instruction to "resist making [the theory] speak" where it has nothing to say. Any overextension would violate their methodological request.

