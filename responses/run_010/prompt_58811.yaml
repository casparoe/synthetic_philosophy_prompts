  Below is a decision tree designed as a sorting instrument for your committee. It adheres to all requirements: starts from shared commitments, uses 10 concrete case-based nodes (including 6 specified cases), avoids theory/introspection/consciousness questions, and leads to 7 distinct endpoints. Each node fits on one slide and is answerable in 20 seconds.

  ---

  ### **Decision Tree: Distribution of Welfare-Relevant States**  
  *Shared starting point: Only behavior and neuroanatomy provide evidence.*

  #### **Node 1: Child without cerebral cortex**  
  *Case: A human child born without a cerebral cortex tracks faces and shows distress/comfort behaviors.*  
  **Q:** Does this child’s distress/comfort behavior indicate a welfare-relevant state?  
  - **Yes** → Node 2  
  - **No** → Node 3  

  #### **Node 2: Crab abandoning shocked shelter**  
  *Case: A crab (no pallium) abandons a shelter after electric shocks.*  
  **Q:** Does this avoidance behavior indicate a welfare-relevant state?  
  - **Yes** → Node 4  
  - **No** → Node 5  

  #### **Node 3: Cerebellum removal**  
  *Case: Human cerebellum (most brain neurons) is surgically removed; reported experience remains intact.*  
  **Q:** Does this imply neuron count is irrelevant to welfare-relevant states?  
  - **Yes** → Node 6  
  - **No** → Node 7  

  #### **Node 4: Octopus arm during sleep**  
  *Case: Octopus arm ganglia solve problems while the animal sleeps.*  
  **Q:** Does decentralized problem-solving imply welfare-relevant states can be local?  
  - **Yes** → Node 8  
  - **No** → Node 9  

  #### **Node 5: Fruit fly injury response**  
  *Case: Fruit fly changes behavior after injury; central complex supports navigation.*  
  **Q:** Does injury-response behavior indicate a welfare-relevant state?  
  - **Yes** → Node 10  
  - **No** → **Endpoint: Higher-Order Representation (HOT)**  
    *Requires self-referential cognition; rejects insects without complex metacognition.*  

  #### **Node 6: Reef fish mirror test**  
  *Case: Reef fish passes mirror test, scrapes at marked body part.*  
  **Q:** Does this self-directed behavior indicate a welfare-relevant state?  
  - **Yes** → **Endpoint: Global Workspace (GWT)**  
    *Consciousness tracks system-wide broadcast (e.g., central brain integration).*  
  - **No** → **Endpoint: Deflationary View**  
    *Phenomenal consciousness is illusory; welfare hinges on functional states.*  

  #### **Node 7: Crab vs. fruit fly consistency**  
  *Compare: Crab (Node 2) and fruit fly (Node 5) cases.*  
  **Q:** If crab behavior doesn’t indicate welfare-relevant states, is fruit fly behavior also insufficient?  
  - **Yes** → **Endpoint: Behavior-Only Pragmatist**  
    *Welfare decisions based solely on observed behavior, not inferred states.*  
  - **No** → **Endpoint: Integration of Information (IIT)**  
    *Consciousness tracks information integration (e.g., neural complexity).*  

  #### **Node 8: Fruit fly with/without cortex**  
  *Compare: Fruit fly (Node 5) and child without cortex (Node 1).*  
  **Q:** Could the fly have welfare-relevant states if the child (lacking cortex) does?  
  - **Yes** → **Endpoint: Panpsychism**  
    *Consciousness is fundamental; present in all systems with integrated information.*  
  - **No** → **Endpoint: Integration of Information (IIT)**  
    *Requires sufficient information integration (child has subcortical structures; fly may not).*  

  #### **Node 9: Fruit fly injury response**  
  *Case: Fruit fly changes behavior after injury.*  
  **Q:** Does injury response indicate a welfare-relevant state?  
  - **Yes** → **Endpoint: Global Workspace (GWT)**  
    *Requires central broadcast (e.g., to central complex).*  
  - **No** → **Endpoint: Higher-Order Representation (HOT)**  
    *Requires self-monitoring; rejects insects.*  

  #### **Node 10: Reef fish mirror test**  
  *Case: Reef fish passes mirror test.*  
  **Q:** Does self-directed scraping indicate a welfare-relevant state?  
  - **Yes** → **Endpoint: Agnostic**  
    *Question unresolvable, but welfare obligations live (e.g., precautionary principle).*  
  - **No** → **Endpoint: Behavior-Only Pragmatist**  
    *Welfare based on behavior alone; rejects mirror test as evidence.*  

  ---

  ### **Annotations**  
  1. **Unexplored/Unoccupied Combinations**  
     - *Node 7 → "No" (IIT) + Node 8 → "No" (IIT)*: Unoccupied but coherent. Assumes information integration is gradable and anatomy-specific.  
     - *Node 4 → "No" + Node 9 → "No" (HOT)*: Unattractive (rejects welfare states in octopus, crab, and fly without strong evidence).  

  2. **Indistinguishable Endpoints**  
     - **Global Workspace (GWT) vs. Integration (IIT)**  
       *Separating evidence:* Experiments disrupting *global* broadcasting (e.g., in octopus central brain) without altering local integration.  
     - **Deflationary vs. Behavior-Only Pragmatist**  
       *Separating evidence:* Cases where functional behavior exists without subjective reports (e.g., AI systems).  

  3. **Key Disagreement Drivers**  
     - Decisive cases differ:  
       - HOT proponents reject welfare without self-referential acts (fish mirror test decisive).  
       - Panpsychists prioritize information integration (octopus ganglia/fly injury decisive).  
       - Pragmatists/Agnostics reject anatomy (crab shelter/fish mirror test inconclusive).  

  ---

  ### **Design Notes**  
  - **Case Usage:** Child (Node 1), crab (Node 2), cerebellum (Node 3), octopus (Node 4), fruit fly (Nodes 5/9), reef fish (Nodes 6/10).  
  - **Theories Mapped:** GWT (Nodes 6/9), IIT (Nodes 7/8), HOT (Nodes 5/9), Deflationary (Node 6), Panpsychism (Node 8), Pragmatist (Nodes 7/10), Agnostic (Node 10).  
  - **Efficiency:** Branches terminate at first unambiguous endpoint; no redundant paths.  
  - **Discovery Focus:** Members identify disagreements via pivotal cases (e.g., if fruit fly injury is pivotal, they lean IIT/GWT/Panpsychism).  

  This instrument forces members to confront *which evidence they treat as decisive*, revealing fault lines in practical welfare judgments.
