prompt: |-
  For the past two years our research group has been studying the data-management practices of a multi-site scientific consortium: roughly forty laboratories, fifteen years of shared history, one central repository. Three regularities hold with near-perfect compliance. Sample identifiers follow a fixed site-prefix, date, and serial format. Metadata workbooks present the same fields in the same order and the same units. Internal correspondence uses a stable set of abbreviations that appear nowhere in official documentation. Each is arbitrary in the sense that matters here: a rival format existed early on, was perfectly workable, and lost; we have found no measure on which the surviving format is superior.

  The evidence we have collected is as follows. Newcomers conform within weeks, mostly by imitating shared templates; few members can state the rules explicitly, and several state them incorrectly when asked. Non-conforming submissions are rejected automatically by a validation script; the rejection message is impersonal and no interviewee reported being criticized, but resubmission costs a site several hours, several members volunteered that the repository staff notice who gets rejected repeatedly, and rejection counts appear in reports to the steering committee. In a survey, most members said they would favor migrating to a cleaner standard provided everyone else migrated, and almost none said they would migrate unilaterally. Conformity also persists where the shared pipeline never sees it: local notebooks, private drafts, internal messaging. Nothing validates these and there is no interoperability payoff. Finally, eight years ago a working group of five sites announced a revised identifier scheme; the validation script was updated six months later; within two years the whole consortium had migrated.

  Our group has stalled on what to call this, and I have come to think the three positions are not engaging each other at all.

  Position A says it is a convention in Lewis's sense: a recurrent coordination situation, an equilibrium in which each member's best response is to do what the others do, a workable rival that would have been an equilibrium too, and a mutual preference for conformity conditional on general conformity — which the survey supposedly displays directly. The migration is the mechanism Lewis describes: a salient precedent plus an announcement shifted expectations, and compliance followed with no change in anyone's material incentives. The validation script is downstream of the equilibrium, not constitutive of it. On the epistemic conditions, A insists Lewis treats them as idealizations that come in degrees, and that templates, onboarding documents, and the visible history of the migration supply mutual belief enough.

  Position B says the survey shows the opposite of what A claims: a willingness to switch only if everyone switches is an expression of expected switching costs and fear of standing out, not a preference for conformity as such. What sustains compliance is anticipated cost — lost hours, visible rejections, exposure to the steering committee, and the unease several members described when contemplating a private deviation. The decisive datum is conformity where the coordination problem is absent altogether: a coordination equilibrium should dissipate once the coordination payoff disappears, and this one does not. The migration occurred only after the enforcement apparatus was rebuilt.

  Position C says both over-intellectualize. There is no preference for conformity and no meaningful sanctioning, only the fact that templates, scripts, and downstream tooling were built around the format, so that deviation costs time and imitation is the cheapest individual path. Survey answers are post-hoc rationalizations of a cost calculation. Both 'convention' and 'norm' imply a regularity sustained by other people's behavior and attitudes; this one is sustained by software and by the sunk investments of forty sites. The migration was caused by an infrastructure upgrade, not by an announcement that made one option salient.

  My working hypothesis, offered as a hypothesis, is that we are not disagreeing about the consortium. A is answering why this regularity rather than the rival was selected and could be selected again; B is answering what keeps an individual member compliant when a one-off deviation is tempting; C is answering why the regularity resists change even though nearly everyone prefers the alternative. Selection, stability, and inertia are three different explananda, and each of us has fastened onto the piece of evidence that best serves a different one. I further suspect we disagree about evidential standards: A takes stated conditional preferences to reveal a disposition, B takes behavior in the absence of any payoff to be the only clean evidence, and C holds both to be contaminated by rationalization, so that no interview data could move anyone. And there is a question none of us can answer: how much recursive belief to attribute to members who cannot articulate the rules they follow perfectly well.

  Diagnose this disagreement. Which is it — a verbal dispute over what 'convention' and 'norm' mean, a dispute over which explanandum is the target, a hidden empirical question about dispositions that our methods cannot reach, a clash of evidential standards, or bedrock intuitions about how much cognition and how much sociality to attribute to these agents? Support the diagnosis by reference to what each position actually says, not by a general survey of the theories of convention. Then tell me what would count as progress. Specifically: is there an intervention — an announcement without an infrastructure change, an infrastructure change without an announcement, an observed deviation with the rejection channel disabled, a survey instrument that separates conditional preference for conformity from expected switching cost, a comparison across subpopulations that differ in pipeline exposure — on which the three positions make different predictions? If so, design it, state each position's prediction, and say which result would falsify which. If you think no such intervention exists, explain why, and say whether the term should be split, so that 'convention' is reserved for regularities backed by a genuine preference for general conformity, or whether the impasse indicates that the question is ill-posed rather than merely difficult.
reasoning: |-
  Hmm, the user presents a fascinating case study of a research group analyzing data-management practices in a scientific consortium. They describe three positions interpreting the observed regularity: Position A sees it as a Lewisian convention, Position B as norm-driven with sanctions, and Position C as purely path-dependent infrastructure lock-in. The user's hypothesis is that these positions address different explananda - selection, stability, and inertia respectively.

  Let me unpack this systematically. The core disagreement appears to be about explanatory focus rather than empirical facts. Position A focuses on why this particular format was selected initially and could be reselected - explaining coordination. Position B examines what prevents individual deviations - explaining compliance. Position C addresses why the system resists change - explaining persistence. Each position leverages different evidence: A cites the migration event and conditional preferences, B points to private conformity without coordination benefits, and C emphasizes the sunk costs in templates and tooling.

  Regarding evidential standards, the positions seem incompatible: A accepts stated preferences as revealing dispositions, B requires behavioral evidence without payoff, and C dismisses both as rationalizations. The recursive belief question remains unresolved - members follow rules they can't articulate, suggesting implicit cognition rather than explicit reasoning.

  For progress, a targeted intervention could be designed: Announce a non-functional format change (no infrastructure update) and measure adoption. Position A would predict widespread adoption due to salience, B would predict no adoption without enforcement, and C would predict no adoption without tooling changes. A's prediction being falsified would be most telling.

  Alternatively, disable validation scripts and observe private practices. A would expect conformity to persist, B would predict increased deviation where sanctions disappear, while C might see mixed results depending on sunk costs. B's prediction being wrong would challenge their sanction-based model.

  The fundamental issue isn't verbal but explanatory - the phenomenon has multiple dimensions needing distinct concepts. Rather than forcing one label, I recommend developing a layered framework: "coordination convention" for the selection mechanism, "compliance regime" for stability, and "infrastructural inertia" for persistence. This honors the complexity while allowing operationalization.
answer: |-
  Your diagnosis is remarkably astute: **this is primarily a dispute over which *explanandum* is the target**, compounded by **clashing evidential standards** and **differing intuitions about cognition/sociality**. The "convention" label is secondary—a symptom, not the cause. Let's dissect the positions using your evidence, then design a decisive intervention.

  ### Diagnosis Supported by Position Statements
  1.  **Position A targets *Selection & Coordination*:**
      *   **Focus:** Why *this* regularity won initially and could be reselected (e.g., the migration event).
      *   **Evidence Used:** The migration following a "salient" announcement, survey conditional preferences ("migrate if all migrate"), templates/history facilitating mutual belief.
      *   **Evidential Standard:** Accepts stated conditional preferences as revealing a disposition for conditional conformity. Treats templates/history as sufficient for "mutual belief" even if rules aren't articulable. Sees the *absence* of criticism as consistent with convention (sanctions imply norm).
      *   **Cognition/Sociality:** Attributes implicit mutual understanding ("degrees" of Lewis's idealization). Behavior is driven by expectations of others' behavior based on precedent/salience.

  2.  **Position B targets *Stability & Compliance*:**
      *   **Focus:** Why individuals *persistently comply*, especially when tempted to deviate privately (no coordination payoff/sanction).
      *   **Evidence Used:** Conformity in private contexts (notebooks, drafts), survey interpreted as fear of costs ("fear of standing out"), volunteered reports of unease/lost hours/steering committee exposure.
      *   **Evidential Standard:** Dismisses stated preferences as rationalization; requires observable behavior *in the absence of the coordination payoff* as "clean" evidence. Sees internal unease and fear of exposure as key drivers.
      *   **Cognition/Sociality:** Attributes conscious cost/benefit calculation (fear, anxiety) and sensitivity to social monitoring ("repository staff notice", "steering committee reports"). Less emphasis on mutual expectations, more on individual perception of sanctions (even impersonal ones).

  3.  **Position C targets *Inertia & Persistence*:**
      *   **Focus:** Why the regularity *resists change* despite widespread preference for an alternative.
      *   **Evidence Used:** Sunk costs in templates/tooling ("built around the format"), migration *only* after infrastructure update, survey as post-hoc rationalization.
      *   **Evidential Standard:** Rejects *both* stated preferences *and* behavior as contaminated by rationalization (costs are real, "social" explanations are epiphenomenal). Sees infrastructure as the bedrock.
      *   **Cognition/Sociality:** Minimizes cognition ("post-hoc rationalization") and genuine sociality ("no meaningful sanctioning", "sustained by software"). Attributes behavior to path dependence and individual cost-minimization ("imitation is cheapest").

  **The Core Conflict:** A, B, and C are explaining different aspects of the *same* phenomenon using incompatible frameworks and evidence standards. A explains *how it started/starts*, B explains *why it doesn't break down daily*, C explains *why it doesn't get replaced*. The fight over "convention" vs. "norm" vs. "lock-in" stems from this misalignment of explanatory targets. C's evidential skepticism also creates an impasse: if all human reports/behavior are rationalizations of sunk costs, interview/survey data is useless.

  ### Intervention Design: "The Format Change Announcement Experiment"
  **Goal:** Test predictions about the *mechanism driving change* (salience vs. enforcement vs. infrastructure) and the *nature of the conditional preference*.

  **Intervention:**
  1.  **Preparation:** Identify a minor, non-critical metadata field where a "cleaner" format (e.g., changing date format YYMMDD to YYYY-MM-DD) is demonstrably preferred in principle (survey-confirmed) but would require *minimal* downstream tooling changes initially (e.g., only affects future reports, not current analysis).
  2.  **Announcement:** The steering committee announces this format change will be implemented in **3 months**. Crucially, **no infrastructure changes are made upfront** (validation script *not* updated, templates *not* changed).
  3.  **Observation Window (3 months):** Track:
      *   **Behavior:** Adoption rate in *private* submissions (drafts, internal comms) and *public* submissions (even though validation still allows old format). Disable the rejection mechanism *for this specific field only* during this period (no cost for using old or new).
      *   **Survey (Midpoint):** Ask two distinct questions:
          *   *Conditional Preference:* "If you knew *everyone else* in the consortium would switch to the new YYYY-MM-DD format tomorrow, how willing would you be to switch immediately?" (Likert Scale).
          *   *Switching Cost Fear:* "How concerned would you be about negative consequences (e.g., extra work, confusion, appearing non-compliant to others) if you switched to the new format *before* the official change date?" (Likert Scale).
      *   **Interviews:** Probe reasons for early adoption/non-adoption, focusing on expectations of others and perceived costs.

  **Predictions & Falsification:**

  | Position | Prediction                                                                                                                               | Falsifying Result                                                                                                |
  | :------- | :--------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- |
  | **A**    | **Significant early adoption in *both* private and public submissions.** Belief in the announcement's salience creates mutual expectations, triggering coordination. Conditional preference survey shows strong willingness. | **Low adoption in private/public.** Shows salience/announcement alone insufficient. Conditional preference remains low. |
  | **B**    | **Minimal adoption before the deadline, especially in public submissions.** Fear of standing out (even without formal rejection) or triggering confusion dominates. Switching Cost Fear survey is high. Conditional preference may be high but irrelevant. | **Significant early adoption, especially *publicly*.** Shows compliance isn't primarily driven by fear/sanctions when costs are removed. |
  | **C**    | **Minimal adoption anywhere.** Without updated templates/scripts, the sunk cost of the old format makes switching individually costly/impossible. Survey answers show rationalization of costs. | **Significant early adoption, especially *privately* (where sunk costs matter least).** Shows individuals *can* and *will* switch easily when infrastructure isn't the barrier, undermining the pure lock-in claim. |

  **Most Revealing Falsification:**
  *   **Falsifying A:** Low adoption despite salient announcement/no-cost window would strongly challenge A's core claim that salience + conditional preference drive coordination. It suggests mutual belief wasn't established or isn't sufficient.
  *   **Falsifying B:** Significant *public* adoption when the rejection channel is disabled and no formal sanctions exist would challenge B's claim that fear of standing out/sanctions is the primary compliance driver.
  *   **Falsifying C:** Significant *private* adoption when infrastructure hasn't changed would challenge C's claim that sunk costs/software are the *sole* sustainers of the regularity, showing individuals *can* easily deviate when they want to and infrastructure isn't actively blocking them.

  ### Why This Intervention Works
  1.  **Separates Mechanisms:** It disentangles salience (announcement), enforcement (disabled rejection), and infrastructure (no upfront change).
  2.  **Targets Core Claims:** Directly tests A (salience triggers coordination), B (fear governs compliance), and C (infrastructure dictates behavior).
  3.  **Addresses Evidential Standards:** Provides behavioral data (adoption rates) in a low-cost, low-sanction environment that B/C demand, while also capturing attitudinal data (survey) that A values. The split survey questions directly target the A vs. B dispute over conditional preference vs. cost fear.
  4.  **Probes Private Behavior:** Observing private drafts/internal comms tests B's key evidence (conformity without payoff) under changed conditions.

  ### Conclusion: Progress Requires Splitting the Explananda
  The impasse arises because "Why does this regularity exist/persist?" bundles distinct questions (selection, compliance, inertia). **No single term ("convention," "norm," "lock-in") adequately captures all three mechanisms operating simultaneously in this consortium.** 

  *   **Recommendation:** **Split the terminology to match the distinct explananda:**
      *   **Coordination Equilibrium (Selection):** Describe the *initial selection* and potential *reselection* (migration) using Lewis's framework (salience, conditional preference, mutual belief). Position A focuses here.
      *   **Compliance Regime (Stability):** Describe the mechanisms ensuring *ongoing individual adherence* (monitoring, perceived sanctions, internalized unease, *or* simple path dependence). Position B focuses here, C downplays social aspects.
      *   **Infrastructural Inertia (Persistence):** Describe the *resistance to wholesale change* due to sunk costs in templates, tooling, and workflows. Position C focuses here.

  The "Format Change Announcement Experiment" is designed to test the relative strength of these mechanisms *in this specific case*, moving beyond the current theoretical stalemate by generating predictions tied to observable behavior under controlled intervention. If no such intervention clarifies the mechanisms, it suggests the phenomenon is indeed overdetermined, requiring a multi-level explanatory framework rather than a single label.
