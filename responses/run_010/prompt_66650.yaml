prompt: |-
  I am writing the framing section of my doctoral chapter on the common prior assumption, and every draft I produce collapses into a summary of two camps that have not moved relative to one another in thirty years. The critics hold that a common prior is a substantive empirical claim about where beliefs come from: since agents have had different information and different lives, their genuine priors differ, so the assumption is not a requirement of rationality but a false idealisation — and Aumann's agreement theorem then rules out persistent disagreement by stipulation rather than by argument. The defenders reply that the prior is no claim about the world at all, but part of the descriptive apparatus, Harsanyi's way of coding what the players know about the game, so that it is neither true nor false and the critics have simply misread the formalism. My own hypothesis, which I would rather have tested than confirmed, is that the two sides are answering different questions — one epistemological, about the justification of belief, one methodological, about what a model represents — and that this is precisely why each argument is met with a shrug. Is that diagnosis correct, or is there a substantive disagreement buried inside it: for instance, about whether the assumption is really a coherence requirement capable of failing, as the betting-based characterisations of when a common prior exists suggest? I want the diagnosis argued from what each side actually says rather than a survey, and then an account of what would count as progress — a distinction, a formal result, a reformulation of the question — or of why none should be expected. Please answer in British English.
reasoning: |-
  Okay, let's start by unpacking the user's problem. They're writing a doctoral chapter on the common prior assumption (CPA) and feel stuck in a loop between two entrenched positions. The critics see CPA as an unrealistic empirical claim, while defenders treat it as a methodological tool. The user suspects these camps are talking past each other—one about epistemology, the other about modeling. 

  First, I need to verify if their diagnosis holds water. Looking at the critic's argument: Morris, Gul, etc., frame CPA as falsifiable because actual human priors vary due to differing life experiences. Their betting-argument interpretations treat CPA as a testable coherence condition. Meanwhile, defenders like Aumann and Harsanyi position the prior as part of the model’s structure—a way to encode informational asymmetries, not a psychological claim. 

  Ah, here's the nuance: the betting arguments *do* create tension. If CPA fails coherence tests (e.g., no money pump), doesn’t that undermine the "just a modeling tool" stance? But defenders might counter that such tests presuppose the model’s applicability—begging the question. 

  The user’s hypothesis seems robust. The camps occupy different discursive universes: epistemology vs. methodology. No wonder they shrug—each side’s rebuttals miss the other’s core concerns. 

  Now, the buried disagreement: Is CPA a rationality requirement? Critics say yes (via coherence failures), defenders say it’s prior to rationality questions. This hinges on whether we view models as descriptive or normative. 

  For progress... Conceptual distinctions would help: separate "belief genesis" (empirical) from "model consistency" (formal). A formal result showing CPA’s necessity for specific agreement types could shift debates. Or—radically—abandon CPA as optional scaffolding. 

  User likely needs ammunition to break their summary deadlock. Highlighting this methodological/epistemological fault line offers a fresh framing. They’ll want to avoid survey-style lit review; instead, position their work as mapping the impasse’s architecture. 

  Must stress British English: "lit review," "faff," and "sticky wicket" feel appropriately Brit-academic. Keep it crisp—no jargon overkill.
answer: |-
  Your diagnosis is astute and largely correct: the impasse stems precisely from the two camps addressing distinct questions—one **epistemological** (concerning the justification of actual beliefs), the other **methodological** (concerning the function of models). However, there *is* a substantive disagreement buried within this, relating to **whether the common prior can function as a coherence requirement**. Let's dissect this from their own arguments and explore paths forward.

  ### 1. **The Core Divide: Epistemology vs. Methodology**
  *   **Critics (e.g., Morris, Gul, Binmore, Sugden):** Focus on the *genesis of actual beliefs*. They argue that rational agents, shaped by unique life experiences ("different information and different lives"), *must* develop genuinely different prior beliefs about the fundamental structure of the world. The CPA, therefore, is a **substantive empirical claim** about human cognition and social learning. Insisting on it *a priori* is not rationality but **false idealisation**. Aumann's theorem, under this view, "rules out disagreement by stipulation" because it *assumes away* the very heterogeneity that explains persistent real-world disagreement. Their arguments often draw on intuitions about learning, path-dependence, and the diversity of human experience.
  *   **Defenders (e.g., Aumann, Harsanyi, Samuelson, Feinberg):** Focus on the *logic of modelling interdependent beliefs in games*. The "common prior" is **not a psychological state** but a **formal device** within the Harsanyi type-space framework. It represents the *ex-ante* informational symmetry *before* agents receive their private signals (types). It's a way to *encode* the agents' knowledge (including knowledge of others' knowledge structures) consistently. Under this view, the CPA is a **methodological postulate** ensuring that differences in beliefs arise *solely* from differences in information within the model, not from unexplained fundamental disagreements about the model's parameters. It’s "neither true nor false" in an empirical sense; it’s a definitional choice for constructing a coherent model of incomplete information.

  *   **The Shrug Factor:** You are right. Critics hear defenders saying "Your objections are irrelevant, we're not talking about real beliefs," and shrug, thinking this dodges the substantive point about rationality in the real world. Defenders hear critics saying "Your formalism doesn't match messy reality," and shrug, thinking this misses the point of formal modelling as abstraction. They are indeed ships passing in the night.

  ### 2. **The Buried Substantive Disagreement: Coherence & Rationality**
  The point of genuine friction concerns the **betting-based characterisations** linking the CPA to **no-trade theorems** and the absence of **"agreeing to disagree"** (beyond Aumann's specific conditions). *This* is where the methodological and epistemological collide:
  *   **Critics' Leverage:** They argue that if agents with *genuinely* different priors (reflecting deep-seated, rationally formed differing worldviews based on disparate experiences) were to meet, they *could* rationally agree to disagree or find bets they both deem favourable (a "money pump" *only* from the perspective of an external observer assuming a CPA). The *failure* of these coherence conditions in experiments or thought experiments (e.g., speculative trade puzzles) suggests the CPA *is* a substantive empirical claim about the possibility of such fundamental coherence. If the CPA is *necessary* to avoid these incoherencies (as the formal results suggest), then its absence implies a *failure of rationality* at the level of belief formation itself. Thus, defenders *cannot* fully escape the epistemological charge by retreating to methodology; the formalism *implies* a coherence requirement capable of failing.
  *   **Defenders' Counter:** They retort that the betting arguments *presuppose* the type-space framework and common knowledge of rationality. Demonstrating a "money pump" between agents modelled *without* a CPA doesn't prove the agents are irrational *in reality*; it simply highlights the **inconsistency within the model specification**. The model without a CPA *cannot* guarantee the agents share enough common ground (a consistent "world view") to avoid the incoherence *as modelled*. The requirement for coherence, they argue, is a requirement *for the model to be well-defined and internally consistent*, not an unconditional requirement for real-world rationality. The "failure" is the model's, not necessarily the agents'.

  *   **The Sticky Wicket:** This disagreement hinges on **what the betting arguments actually demonstrate**. Critics see them as revealing a deep requirement for rational belief coherence *in the world*. Defenders see them as revealing a requirement for model coherence *on the page*. This difference in interpretation is fundamental and stems directly from their core perspectives (epistemology vs. methodology).

  ### 3. **Paths to Progress: Beyond the Impasse**
  True progress requires moving beyond simply restating the positions. Promising avenues include:

  1.  **Sharp Conceptual Distinction:** Explicitly and rigorously formalise the difference between:
      *   **Model-CPA:** A formal construct within a type-space defining a consistent ex-ante state.
      *   **Epistemic-CPA:** An empirical claim that rational agents, given human learning constraints, can arrive at beliefs representable by a Model-CPA.
      *   **Coherence-CPA:** The condition derived from no-trade theorems, often presented as a *consequence* of the Model-CPA + common knowledge of rationality. *Is this consequence unique to the Model-CPA?*
      A clear taxonomy could prevent talking past each other.

  2.  **Formal Results on Necessity/Sufficiency:** Produce results that directly address the buried disagreement:
      *   Is the Model-CPA the *only* way to guarantee the Coherence-CPA (no acceptable bets, no agreeing to disagree in specific ways) within a broad class of belief models? If *yes*, it strengthens the critic's point that the CPA is doing heavy lifting as a coherence requirement. If *no* (e.g., showing weaker assumptions can yield similar coherence), it weakens the critics' leverage and supports the defenders' view of CPA as one methodological choice among others.
      *   Formalise "truly fundamental disagreement" *within* a model. What happens if we relax CPA *but* add other structure? Can we model persistent disagreement *without* obvious coherence failures *and* without a CPA? Results here could either vindicate critics (showing alternatives exist) or defenders (showing CPA remains uniquely clean).

  3.  **Reformulating the Question: The Purpose of Models:**
      *   Shift focus from "Is the CPA true?" to **"For what modelling purposes is the CPA essential, useful, or obstructive?"**
      *   When does imposing a Model-CPA generate accurate predictions or insights? When does it obscure crucial dynamics (e.g., genuinely clashing worldviews, ideological conflict)?
      *   Explore the **cost of abandoning CPA**. What explanatory power is lost? Does modelling without it become intractable or yield less sharp predictions? Articulating the *trade-offs* inherent in the methodological choice moves beyond the true/false dichotomy.

  4.  **Learning & Foundations:** Bridge the gap by formally modelling belief formation:
      *   Under what (stringent) conditions does rational learning from *common* experiences (but potentially different private signals) *lead to* beliefs representable by a Model-CPA? (This leans defender).
      *   Conversely, formally model how path-dependent learning or radically different experiences *necessarily* lead to beliefs *incompatible* with *any* single Model-CPA, even assuming rationality (This leans critic). Results here could ground the epistemological debate in formal learning theory.

  ### Why Progress is Elusive but Possible
  Progress is difficult because the core perspectives are deeply entrenched and serve different purposes. Expecting defenders to abandon a powerful modelling tool because it doesn't reflect messy reality, or critics to accept it as "just a tool" when it seems to make strong implicit claims about belief coherence, is unrealistic.

  **However, progress *is* possible by:**
  *   **Acknowledging the divide:** Explicitly framing discussions with your epistemological/methodological distinction.
  *   **Targeting the coherence question:** Focusing formal energy on the necessity/sufficiency of the CPA for avoiding specific incoherencies.
  *   **Emphasising purpose and cost:** Moving towards a nuanced understanding of the CPA as a modelling choice with specific benefits and limitations for specific questions.

  Your framing chapter shouldn't just summarise the stalemate. Use your diagnosis to **structure the debate**, highlight the *source* of the impasse (the divergent questions), identify the *substantive friction point* (the coherence requirement), and point towards the **kinds of results or distinctions** that could move the conversation forward. That itself is a significant contribution, providing a map for navigating this notoriously sticky wicket in the foundations of game theory and decision theory. Good luck with the chapter – it's tackling a proper Gordian knot.

  Would you like to explore potential formal results or specific reformulations in more detail?
