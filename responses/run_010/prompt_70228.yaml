prompt: |-
  So I'm a junior and I'm one of six mods on a mid-size forum (about 11k members, mostly teenagers) for people trying to quit vaping. We don't have anything written down about manipulative posts, we just have a track record, and next week we're voting on a new one — I want to argue from our own precedents instead of from scratch, since half the mod team keeps talking past each other. Here's the record as best I can reconstruct it: (1) we deleted a quit-app's post that said "you've gone 47 days, don't break your streak now," even though the account was clearly labeled as the app's official one; (2) we kept a post from the same app that was just a chart of money saved and self-reported cravings, also labeled; (3) we deleted an account pretending to be a 16-year-old quitter that DM'd people a link to a "natural craving killer" supplement, and the reason everybody gave in mod chat was that it lied about who it was; (4) we kept, with a pinned note, a school counselor's post with really graphic diseased-lung photos, because it also gave the actual statistics and a quitline number and because it went up in a thread where people had asked for "something that would scare me straight"; (5) we deleted a wellness brand's giveaway where staying entered meant posting a daily public confession to your own profile with the full terms behind a link, and mods mostly said "you can't quit this one without losing face"; (6) we've kept a ton of pure testimony posts, like "here's what worked for me, I don't sell anything."

  The new case, which is what's got us stuck. A well-funded anti-vaping nonprofit — discloses its donors, isn't selling anything, signs its messages with its real name — wants to DM individual members at the specific hour each member mentioned in their intro post that they usually vape (so like 9pm for someone who said 9pm in the car). The message itself is genuinely reason-giving: two accurate paragraphs about how cravings spike at habitual times and what to do about it, plus the quitline number. No product, no payment, no scare photos, and there's a one-click opt-out at the bottom. What it doesn't say is that the send time was chosen from what the person told the forum, and the org didn't ask anyone's permission first — one mod pulled the timing info from the public intro threads himself and offered it to them, which is a seperate problem I guess. Our faculty advisor, who sits in on votes, keeps saying the real line is whether the message gives you something to weigh, but another mod says that misses the point entirely because it's about whether they used your weak spot against you, and a third thinks it's all about whether you could have said no beforehand.

  Can you put on your professional-philosopher-of-autonomy hat and also just act like an incoming mod who has to live with this decision? Think it through carefully, and please start by brainstorming the candidate rules we might already be running — something like "it doesn't offer reasons," "it hides the fact that it's trying to influence you," "it exploits a vulnerability we know is specific to this person," "the person wouldn't sign off on it if they saw how it works," "it doesn't leave a real way out" — before you commit to one. Then tell me: which of those rules actually fits all six precedents and which only fits most of them (I want to know where each one strains); what each surviving rule predicts about the nonprofit's DM campaign; your single best recommendation for how we should vote if we want to be consistent with ourselves, plus which of the six precedents is the closest analog and why; and, if the record genuinely underdetermines it, say plainly what principle we'd be adopting by voting yes and what different principle we'd be adopting by voting no. Also throw in one hypothetical future case that would force us to pick between the two best-fitting rules, because I want to drop it in the vote thread. Don't oversell any of this though — end with where you think you're most likely wrong: which precedent I've probably mis-stated the point of, which rule I'm over-reading into our history, and what argument from one of the other mods would legitimately change your recommendation.
reasoning: |-
  Okay, let me unpack this user's request. They're a junior mod on a vaping cessation forum dealing with a tricky policy decision about manipulative content. The core challenge is establishing a consistent rule from past moderation precedents to evaluate a new case involving timed DMs from a nonprofit. 

  First, I need to analyze their six historical cases to extract implicit principles. The pattern shows concern about exploitation (deleting the supplement scam), transparency (keeping the counselor's graphic post with context), and coercion (removing the confession-based giveaway). The kept cases all involve voluntary engagement or factual reasoning.

  For the new nonprofit DM case, the tension lies between the message's helpful content and the non-consensual timing exploiting members' vulnerability windows. The faculty advisor emphasizes "reason-giving" while other mods focus on "exploiting weak spots" or "prior consent." 

  Looking at the precedents, the strongest unifying rule seems to be about exploiting known vulnerabilities without consent. This would prohibit the DMs since they weaponize members' disclosed craving times. The closest analog is case #3 (deleted supplement scam) due to similar vulnerability targeting, though the nonprofit's content is more factual.

  If voting no, they'd establish "no exploiting specific vulnerabilities without consent" as policy. Voting yes would prioritize intent/opt-outs over method. A good test case would be AI-generated voice messages mimicking a user's dead relative - this would force choosing between the consent and exploitation rules.

  Potential weak spots: maybe case #4 (graphic images) was kept more due to user request than consent, or that I'm overreading "exploitation" into case #5. The opt-out argument could sway me if framed as respecting ongoing autonomy.
answer: |-
  Here's a systematic breakdown applying professional ethics to your precedents, designed for consistency and honest about uncertainty:

  **Candidate Rules Extracted from Precedents:**
  1.  **Manipulation-by-Hiding:** Hides the true nature/source of influence. (Fits #3 clearly)
  2.  **Exploitation-of-Known-Vulnerability:** Leverages a specific, known weakness of the target user. (Fits #1, #3, #5 strongly, hints at #4)
  3.  **Lack-of-Meaningful-Opt-Out:** Makes refusal/escape unreasonably difficult, costly, or socially punitive. (Fits #1, #5 clearly)
  4.  **Purpose-over-Content:** Focuses on *why* the influence is applied (e.g., to sell, coerce) rather than just the message itself. (Fits #1, #3, #5)
  5.  **Absence-of-Reason-Giving:** Fails to provide factual information or rational arguments for the user to consider. (Fits #1, #3, #5 poorly? #1 arguably gives a "reason" but manipulative)
  6.  **Lack-of-Prior-Consent:** Acts without the user's knowledge/permission regarding *how* they'll be targeted. (Fits #3, #5, arguably #1 & #4 contextually)

  **Rule Fit Analysis (✓=Fits, ~=Strained, ✗=Doesn't Fit):**

  | Rule                              | #1 (47 days) | #2 (Chart) | #3 (Supplement) | #4 (Lung pics) | #5 (Giveaway) | #6 (Testimony) | Overall Fit      |
  | :-------------------------------- | :----------- | :--------- | :-------------- | :------------- | :------------ | :------------- | :--------------- |
  | **1. Manipulation-by-Hiding**     | ✗ (Labeled)  | ✗ (Labeled)| ✓ (Fake teen)   | ✗ (Clear source)| ✗ (Clear?)    | ✗ (Clear)      | Weak (Fits only #3) |
  | **2. Exploitation-of-Vulnerability** | ✓ (Streak anxiety)| ~ (Neutral) | ✓ (Young quitter)| ✓ (Scare req.)| ✓ (Social cost)| ✗ (General)     | **Strong** (Fits 1,3,4,5) |
  | **3. Lack-of-Meaningful-Opt-Out** | ✓ (Implied pressure) | ✓ (Passive) | ✓ (DM trap)     | ✓ (Can scroll)| ✓ (Public shame)| ✓ (Ignore)     | **Strong** (Fits 1,3,5) |
  | **4. Purpose-over-Content**       | ✓ (App engagement)| ~ (Data?)  | ✓ (Selling)     | ~ (Education?) | ✓ (Brand gain)| ✗ (Sharing)     | Good (Fits 1,3,5) |
  | **5. Absence-of-Reason-Giving**   | ~ (Reason given, but manipulative)| ✓ (Facts) | ✗ (Likely had "reasons")| ✓ (Facts+scare)| ✗ (Had terms?) | ✓ (Experience) | **Weak** (Strained on 1,3,5; fits 2,4,6) |
  | **6. Lack-of-Prior-Consent**      | ~ (Implied forum consent?) | ~ | ✓ (No consent) | ~ (Thread context?) | ✓ (No consent for terms)| ✓ (Public post) | Good (Fits 3,5 clearly) |

  **Applying Surviving Rules to the Nonprofit DM:**
  *   **Exploitation-of-Vulnerability (Strong Fit):** **Likely Violates.** The *timing* directly exploits the specific, self-disclosed vulnerability (habitual craving time) you know users struggle with. This mirrors the streak anxiety (#1) and social shame (#5) exploitation.
  *   **Lack-of-Meaningful-Opt-Out (Strong Fit):** **Likely Complies.** The one-click opt-out is a clear, low-cost escape hatch, unlike the pressure in #1 or shame in #5.
  *   **Purpose-over-Content (Good Fit):** **Likely Complies.** Nonprofit, no sell, factual content aligns with educational purpose (#4, #6), not commercial/coercive (#3, #5).
  *   **Lack-of-Prior-Consent (Good Fit):** **Violates.** Users never consented to being contacted via DM *based on their intro post timing data*, especially not at their most vulnerable moment. This echoes the non-consensual DM in #3 and hidden terms in #5.

  **Recommendation & Closest Precedent:**
  *   **Vote NO on allowing the DM campaign.** The strongest, most consistent rule across your history is **prohibiting the *exploitation of known, specific vulnerabilities* without adequate safeguards.** The timed DM weaponizes a user's disclosed weak point against their autonomy.
  *   **Closest Analog: #3 (Supplement Scam).** While the *content* is worlds apart, the *method* is parallel: using non-public-channel contact (DM) based on a specific, non-consensually leveraged vulnerability (age/role in #3, craving time here). The harm is the exploitation of trust and vulnerability, not just the content.

  **If the Record Underdetermines It:**
  *   **Voting YES** adopts the principle: **"As long as the influencer is transparent, offers a real opt-out, and provides factual reasons, exploiting known vulnerabilities for timing/personalization is permissible."**
  *   **Voting NO** adopts the principle: **"Exploiting a user's self-disclosed, specific vulnerability (beyond general forum context) without their explicit prior consent violates autonomy, regardless of the influencer's intent or content quality."**

  **Future Test Case (Forcing Rule Choice):**
  > *"A user posts: 'I only crave when I see my ex's social media pics, it's my biggest trigger.' A well-intentioned, non-commercial member creates a browser extension (approved by mods) that automatically blocks the ex's profile pics. It silently installs after the user clicks an unrelated-looking 'support resource' link in a DM from the member. Content is helpful, opt-out exists, but consent was tricked and it exploits the specific trigger."*
  *   Forces choice between **Lack-of-Prior-Consent/Exploitation** (NO) vs. **Purpose/Content/Opt-Out** (YES).

  **Where I'm Most Likely Wrong & Counterarguments:**
  1.  **Mis-stated Precedent #4 (Lung Pics):** I assumed consent via the request thread was key. Maybe the mods kept it *despite* the graphic nature *because* it provided factual reasons/scare was requested, making "Reason-Giving" or "Contextual Consent" more central than I credited. **If so, the faculty advisor's "reasons to weigh" point gains weight for the DM.**
  2.  **Over-reading "Exploitation" into #5 (Giveaway):** Maybe the primary objection *was* the lack of upfront terms ("hiding") and public shame ("opt-out cost"), not the *exploitation* of social anxiety per se. **If so, the "Lack-of-Prior-Consent" or "Lack-of-Opt-Out" rules become stronger than "Exploitation" for the DM case.**
  3.  **Underestimating the Opt-Out:** The third mod ("could have said no beforehand") might argue the one-click opt-out *is* sufficient ongoing autonomy protection, making prior consent for the *method* less critical than preventing *ongoing* coercion. **If this view dominated past decisions (esp. #1, #4), voting YES becomes more defensible.**

  **Final Thought:** Your record shows a community deeply protective against *weaponizing vulnerability*. The mod who sees "using your weak spot against you" as the core issue has the strongest precedent alignment. While the nonprofit's intent is good, the *method* crosses the autonomy line your team has consistently drawn by exploiting a specific, disclosed vulnerability without consent. Vote NO for consistency, but acknowledge the opt-out mitigates harm compared to your worst precedents. Frame the decision as about *how* help is delivered, not its content.
