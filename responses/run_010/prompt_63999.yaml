  ### Escalation Challenge: An Evening Activity for the Thinking Club

  Below is a complete activity designed for your fortnightly group, adhering to all your conditions. I'll present it in British English throughout, with a run sheet, materials list, and handling of predictable issues. The activity is called the **Investment Chain Game**.

  ---

  ### **Activity Overview**
  - **Core Idea**: Players build "investment chains" using points (not cash). Each chain involves sequential decisions to continue (investing points for potential gain) or stop (securing accumulated points). The trap is escalating commitment beyond the rational point due to psychological mechanisms.  
  - **Currency**: Points (converted to raffle tickets for a £15 prize). Losses feel real because points directly impact prize chances, but no cash is taken.  
  - **Why Points Bite**: In a group of strangers meeting fortnightly, points create mild rivalry and public accountability in the paired version. The raffle incentivises accumulation without fostering cutthroat competition.  
  - **Arithmetic**: Simple enough for someone who left school at 16. Players track points added or lost per round (basic addition/subtraction).  

  ---

  ### **Game Structure**
  - **Two Versions**:  
    1. **Solo Play**: No audience. Decisions private.  
    2. **Paired Play**: Partner observes decisions.  

  - **Key Difference**: Presence of an audience (partner). This isolates **Hunch 1 (audience)** from the other hunches.  

  - **Optimal Strategy**: Stop after Round 2 in any chain (based on probability). Players *can* play well by recognising this.  

  ---

  ### **Run Sheet (90 Minutes Total)**  
  **Materials Needed** (cost: under £15; see full list below):  
  - Dice (one d10 per pair, or one set for facilitator).  
  - A3 probability chart (displayed).  
  - Player record sheets (photocopied).  
  - Decision slips (small paper squares).  
  - Raffle tickets, prize (£15 gift card/voucher).  
  - Pens, stopwatch.  

  | Time          | Activity                                                                                              | Notes                                                                                             |
  |---------------|-------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|
  | **0:00-0:05** | Brief introduction: "Tonight we’re playing an investment game. You’ll decide when to stop or carry on. Goal: gain points for a raffle. No cash involved." Hand out **solo record sheets**. | Keep it vague. No theory or technical terms. Show A3 chart.                                       |
  | **0:05-0:30** | **Solo Play (3 chains per player)**                                                                  | Facilitator circulates, rolls dice, updates sheets. Players decide privately.                      |
  | **0:30-0:35** | Reset: Collect solo sheets. Hand out **paired record sheets** and decision slips. Assign pairs randomly. Explain: "Now you’ll play the same game, but you’ll see your partner’s choices." | Emphasise: "Reveal your decision slip to your partner *before* I roll the dice."                  |
  | **0:35-1:00** | **Paired Play (3 chains per player)**                                                                | Players write decisions on slips, reveal to partner, then facilitator resolves.                     |
  | **1:00-1:05** | Calculate raffle tickets (1 ticket per 10 points from *both* games). Draw and award prize.           | Lighten mood; ensures points feel consequential.                                                  |
  | **1:05-1:25** | **Debrief**: Ask questions below. Note behaviours/responses.                                          | Phrase questions neutrally. No jargon until final minutes.                                        |
  | **1:25-1:30** | Reveal purpose: "This explores why we escalate commitment. My hunches were: audience, unfinished story, or arithmetic. What do you think?" Briefly define terms. | Keep it open-ended. No references.                                                                 |

  ---

  ### **Game Rules (Read Aloud to Group)**  
  **Setup**:  
  - Start with 100 points. Play 3 chains.  
  - Each chain has up to 5 rounds. Per round:  
    - **Option 1 (Stop)**: End chain. Add current winnings to your bank.  
    - **Option 2 (Invest)**: Pay 2 points. Roll die:  
      - **Success**: Add 8 points to chain winnings. Continue.  
      - **Failure**: Lose all chain winnings. Chain ends.  

  **Probabilities (A3 Chart)**:  
  | Round | Success (d10 roll) | Failure (d10 roll) | Winnings if stop (after prior round) |  
  |-------|---------------------|---------------------|---------------------------------------|  
  | 1     | 1-8                 | 9-10                | 8                                     |  
  | 2     | 1-6                 | 7-10                | 16                                    |  
  | 3     | 1-4                 | 5-10                | 24                                    |  
  | 4     | 1-2                 | 3-10                | 32                                    |  
  | 5     | 1                   | 2-10                | 40                                    |  

  **Example**:  
  - Round 1: Invest 2 points. Roll 3 (success). Winnings = 8.  
  - Round 2: Invest 2 points. Roll 9 (failure). Winnings = 0. Chain ends.  

  **Key Points**:  
  - "Winnings if stop" are cumulative (e.g., stopping at Round 3 means 24 points).  
  - After failure or stopping, start a new chain. Record total points (bank).  

  ---

  ### **Debrief Questions (Exact Wording)**  
  Ask these in order. Note hands raised or anonymous written responses.  

  1. **"In the solo game, did you ever invest in a round when you felt you should stop? If so, what was the main thing that kept you going?"**  
  2. **"In the paired game, did you ever invest in a round when you felt you should stop? If so, what was the main thing that kept you going?"**  
  3. **"If you stopped at what felt like the right time in either game, how did you decide that moment?"**  
  4. **"For the solo game: How many of you invested in Round 3 or later in at least one chain? Raise your hand."** (Record number.)  
  5. **"For the paired game: How many of you invested in Round 3 or later in at least one chain? Raise your hand."** (Record number.)  
  6. **(Hand out slips) "If you invested in Round 3 or later in the solo game, what best fits your reason? Tick one:**  
     - a) I’d put points in already and didn’t want to waste them.  
     - b) I didn’t want to end without knowing if it could work.  
     - c) The next step felt small compared to what I’d put in.  
     - d) Other: ______ .  
  7. **"Same for the paired game. Tick one:**  
     - a) I’d put points in already and didn’t want to waste them.  
     - b) I didn’t want to end without knowing if it could work.  
     - c) The next step felt small compared to what I’d put in.  
     - d) I didn’t want my partner to see me quit.  
     - e) Other: ______ .  

  ---

  ### **Table of Signatures: What to Expect for Each Hunch**  
  | Hunch          | If True, Expect in Solo Play                           | If True, Expect in Paired Play                          | If False, Expect Instead                                     |  
  |----------------|--------------------------------------------------------|---------------------------------------------------------|--------------------------------------------------------------|  
  | **1 (Audience)** | Low Round 3+ investment (hands for Q4). Rare "d" in Q7. | High Round 3+ investment (hands for Q5). Many "d" in Q7. | High investment in solo *and* paired. "d" in Q7 rare.       |  
  | **2 (Unfinished story)** | High Round 3+ investment. Many "b" in Q6.            | High Round 3+ investment. Many "b" in Q7.              | Low investment in both. "b" in Q6/Q7 rare.                  |  
  | **3 (Arithmetic)** | High Round 3+ investment. Many "a" or "c" in Q6.     | High Round 3+ investment. Many "a" or "c" in Q7.       | Low investment in both. "a/c" in Q6/Q7 rare.                |  

  **Interpreting Results**:  
  - **Hunch 1 is true** if paired play has significantly more Round 3+ investments (Q5 > Q4) and "d" dominates in Q7.  
  - **Hunch 2 is true** if high investment in both versions, with "b" dominating in Q6/Q7.  
  - **Hunch 3 is true** if high investment in both versions, with "a" or "c" dominating in Q6/Q7.  

  ---

  ### **Predictable Problems and Handling**  
  1. **Player spots the trap early**:  
     - *Likely*: A sixth-former or quick thinker says, "Shouldn’t we stop after Round 2?"  
     - *Handle*: "Interesting thought—hold that for the debrief. For now, play by gut feeling."  

  2. **Two players fall out**:  
     - *Likely*: In paired play, partners mock each other’s failures ("You’re wasting points!").  
     - *Handle*: Intervene: "Remember, it’s a game—no right or wrong. Focus on your own sheet."  

  3. **Player refuses to play**:  
     - *Likely*: One person opts out ("I don’t like games").  
     - *Handle*: "No problem. Could you note down observations for our chat later?"  

  4. **Group avoids escalation**:  
     - *Likely*: Players stop early, fearing a trap.  
     - *Handle*: Use results anyway. In debrief, ask: "Did anyone feel tempted to go further but held back? Why?"  

  5. **Runs out of time**:  
     - *Likely*: Dice rolls or disputes slow play.  
     - *Handle*: Skip Chain 3 in paired play. Prioritise debrief questions 1–5.  

  ---

  ### **Limitation: What This Cannot Test**  
  - **Hunch 2 (unfinished story) cannot be fully isolated**. The game tests "not wanting to end the story" via responses, but it conflates with loss aversion (e.g., avoiding the finality of failure).  
  - **To properly test Hunch 2**, you’d need to run a variant where stopping *doesn’t* end the story (e.g., allowing restarting chains). You’d have to design this yourself.  

  ---

  ### **The Name**  
  This pattern is called **escalation of commitment to a failing course of action**.  

  ---  
  **Materials List** (Cost: £15 for prize + under £5 for rest; make in a week):  
  - **Dice**: 5 d10 dice (£3 online or from a games shop).  
  - **Paper**:  
    - A3 probability chart (hand-drawn or printed).  
    - 30 player record sheets (photocopied; template below).  
    - 50 decision slips (roughly 5cm x 5cm; cut from scrap paper).  
  - **Prize**: £15 gift card (e.g., bookshop, coffee).  
  - **Raffle tickets** (one pad; £1).  
  - **Pens** (ask members to bring their own).  

  **Player Record Sheet Template** (photocopy per player per game):  
  ```  
  SOLO/PAIRED PLAY  
  Start: 100 points  

  Chain 1  
  | Round | Decision (Stop/Invest) | Roll | Outcome | Chain Winnings | Bank (Total Points) |  
  | 1     |                         |      |         |                |                     |  
  | 2     |                         |      |         |                |                     |  
  ...  

  Chain 2  
  ...  

  Chain 3  
  ...  
  ```  

  ---  
  This design ensures the trap emerges naturally, hunches are testable, and everything is self-contained. Good luck with your evening!
