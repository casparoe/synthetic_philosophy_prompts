answer: |-
  **Cognitive Artifact Management SOP**  
  **Document No.:** NEU-QMS-0042  
  **Issue Date:** 15-Nov-2023  
  **Effective Date:** 01-Dec-2023  
  **Owner:** Dr. A. Clark (Director, Extended Cognition Division)  
  **Approver:** Prof. D. Chalmers (Chief Quality Officer)  
  **Uncontrolled if printed**  
  *Cover Motto: "Cognitive processes ain’t (all) in the head!" — Institutional Policy §8.3*  

  ---

  ### 1. PURPOSE  
  To establish procedures for the registration, maintenance, and incident management of external artifacts constituting lab-approved cognitive processes under the Extended Mind Policy (EMP). Ensures parity between internal and external cognitive operations for accreditation compliance.  

  ### 2. SCOPE  
  2.1. Applies to all artifacts performing operations that would be unhesitatingly classified as cognitive if occurring within biological neural tissue.  
  2.2. Includes notebooks, digital devices, software, and environmental systems (see §8.0).  
  2.3. Excludes transient tools (e.g., unregistered sticky notes).  

  ### 3. DEFINITIONS  
  3.1. **Cognitive Artifact (CA):** External resource registered per §4.  
  3.2. **Automatic Endorsement:** User’s non-revisional acceptance of CA content at entry (cf. §4.3.3).  
  3.3. **Cognitive Merger:** Unauthorized integration of CAs between personnel (cf. §6.0).  
  3.4. **Subject O./Subject I.:** Reference individuals for CA-dependent vs. internal-recall protocols.  

  ### 4. REGISTRATION OF COGNITIVE ARTIFACTS  
  4.1. **Eligibility Criteria:** Artifacts must demonstrate:  
    4.1.1. Constant availability during operational tasks.  
    4.1.2. Retrievable content without excessive reconstruction.  
    4.1.3. Automatic endorsement by user at data entry.  
  4.2. **Algorithmic Outputs:**  
    4.2.1. Apps with adaptive algorithms require v. 4.0+ *Trusted Source Certification* to satisfy §4.1.3.  
    4.2.2. Uncertified outputs are deemed "suspicious cognition" and invalid for reporting.  
  4.3. **Registration Form NEU-CA-F01** must be submitted to QA.  

  ### 5. LOSS/DESTRUCTION OF CAs  
  5.1. **Severity Classification:**  
    5.1.1. **Critical:** Loss of CA containing >30% of Subject O.’s procedural knowledge.  
    5.1.2. **Major:** Loss affecting calibration memory.  
    5.1.3. **Minor:** Loss of non-core data (e.g., breakroom duty roster).  
  5.2. **Incident Report NEU-IR08** must declare:  
    *"I attest that the unavailability of [CA ID] has rendered me cognitively non-compliant for [Task] per §2.1."*  

  ### 6. PROHIBITION ON LENDING  
  6.1. CAs are non-transferable. Lending constitutes:  
    6.1.1. Temporary cognitive merger (§3.3).  
    6.1.2. Risk of unauthorized belief annotation.  
  6.2. Violations are logged as EMP nonconformances.  

  ### 7. SHARED NOTEBOOK PROTOCOLS  
  7.1. **Dual Custody Required:**  
    7.1.1. Two personnel must co-sign entries.  
    7.1.2. Quarterly review for "belief drift" (QA-FORM-77).  
  7.2. Subject O. exempt if notebook is sole memory substrate.  

  ### 8. BOUNDARY DISPUTES & SCOPE CREEP  
  8.1. **Ambiguous Cases** (e.g., fire alarm, building layout, coffee machine):  
    8.1.1. If artifact use meets §2.1, submit *CA Boundary Inquiry* (QA-FORM-83) to Document Owner.  
    8.1.2. Pending review, treat as "provisional cognition."  
  8.2. **Grey Area Example:** Repeatedly consulted reference manuals become CAs after undocumented threshold. Report uncertainty per §8.1.1.  

  ### 9. RESPONSIBILITIES  
  9.1. **Users:** Certify CA compliance daily (LOG-EMP-01).  
  9.2. **QA Auditors:** Verify CA parity via Subject O./Subject I. cross-checks.  
  9.3. **Document Owner:** Resolve boundary disputes within 5 business days.  

  ### 10. RECORDS  
  10.1. CA registration forms retained for 10 years.  
  10.2. Incident reports archived with accreditation files.  

  ---

  **REVISION HISTORY**  
  | Ver. | Date       | Change Description                          | Initiator       |  
  |------|------------|--------------------------------------------|----------------|  
  | 1.0  | 01-06-2022 | Initial issue                              | A. Clark       |  
  | 1.1  | 15-08-2022 | §2.1 amended per Audit NCR-2022-14 (hydrant/fire engine analogy rejected for cognitive parity) | QA Internalism Task Force |  
  | 1.2  | 30-03-2023 | §4.2.1 added after Incident CA-023 (unfiltered algorithm caused erroneous titration endorsement) | D. Chalmers    |  
  | 1.3  | 15-11-2023 | §8.1 expanded to include coffee machine; §5.1.1 reinstated post-Incident CA-045 (Subject O. unable to locate centrifuge) | A. Clark       |  

  ---  
  **END OF DOCUMENT**  
  *This revision supersedes all prior versions. Uncontrolled printed copies must be verified against the digital master before use.*  

  ---
  **Design Notes for Your Reading Group:**  
  - **Internalist Critique Embedding:** The revision history shows scope narrowing (v1.1) after an audit citing the fire hydrant analogy (implying causal coupling ≠ constitution), threatening accreditation. Revisions later expand boundaries again after practical failures.  
  - **Boundary Ambiguity:** §8 forces bureaucratic escalation for cases like the coffee machine (is it part of "digestive readiness" for cognition?), mirroring real QA grey areas.  
  - **Algorithmic Tension:** §4.2.1’s certification requirement highlights Clark & Chalmers’ unresolved "endorsement" problem with curated digital content.  
  - **Subject O./I. as QA Artifacts:** Treated as data points, not philosophical dilemmas. Subject I.’s recall is merely a "control method."  
  - **Humors of Bureaucracy:** The EMP nonconformance log (§6.2) for notebook lending frames "belief contamination" as a paperwork violation. §5.2’s incident report forces users to confess cognitive incapacity in QA jargon.  

  This document weaponizes QA literalism against the extended mind’s practical implications—forcing commitment to *regulated mind-in-pieces*. Specialists will debate whether §4.2.1 betrays the thesis or saves it, while lay readers chuckle at a lab declaring coffee machines "provisional cognition."
