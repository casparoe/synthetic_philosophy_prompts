prompt: |-
  Construct a decision problem in which the precautionary principle requires a regulator to authorize a risky intervention, while a straightforward expected-value calculation requires the same regulator to refuse it. I am writing about whether precautionary reasoning can be action-guiding rather than merely prohibitory, so the case must defeat the familiar paralysis objection — the charge that precaution issues contradictory verdicts because there are risks on both sides of every choice. Here it must issue exactly one verdict, and it must be the pro-intervention one.

  Constraints. A realistic public-policy setting: a water authority, a coastal municipality, a disease-surveillance agency — no trolley cases, no speculative engineering. One paragraph of scenario. Scientific uncertainty must attach to the harm caused by *not* intervening: the mechanism is understood, the timing and magnitude are not, and no defensible point probability exists. The harm caused *by* intervening must be well understood, large, monetary-compensable, and reversible in a non-rhetorical sense — tell me what makes it reversible, over what horizon, at what cost, and for which identifiable people. It must also fall short of catastrophic, or the paralysis objection returns. Supply enough numbers for the expected-value side to actually compute: an elicited probability and monetized magnitude for the harm of inaction, a monetized magnitude for the harm of intervening — and arrange them so that expected value forbids the intervention. Block the easy escapes: no extinction-level or last-of-its-kind stakes, nothing so incommensurable that the arithmetic cannot be run, no perfect predictors.

  Then do the check. Show the calculation and why it says no. Identify which clause of a precautionary formulation says yes — the irreversibility asymmetry, the shift in the burden of proof, or the treatment of uncertainty as distinct from risk — and say which one actually carries the case. Name the single feature of the scenario doing the work, report what both verdicts become when it is removed, and give the strongest attack available to an opponent: presumably that the precautionary reading has quietly substituted its own probability distribution for the elicited one, making this a dispute about numbers rather than about decision rules. Tell me whether that attack succeeds.
reasoning: |-
  We are constructing a decision problem for a water authority facing a potential drought.
   The risky intervention: building a temporary desalination plant to supplement water supply.
   Harm of not intervening (inaction): severe drought causing economic losses and health impacts. There is scientific uncertainty about the timing and severity of the drought. The mechanism (lack of rainfall leading to reservoir depletion) is understood, but the magnitude and timing are uncertain. We cannot assign a defensible point probability because the climate models give a wide range of possibilities.
   Harm of intervening: building the desalination plant is expensive and causes environmental harm (e.g., brine discharge affecting marine life). However, the harm is reversible: the plant is temporary (operational for one year) and the brine discharge can be mitigated by dilution and dispersal techniques. The environmental impact is localized and reversible over a short horizon (1-2 years after decommissioning) at a cost (e.g., by restoring the affected area). The cost of reversal (restoration) is included in the overall cost of the intervention. The harm is monetary-compensable (e.g., compensation to local fishermen for temporary loss of catch) and falls short of catastrophic (no species extinction, no permanent damage).

   Scenario:
   The coastal municipality of Aquaville relies on a reservoir for its water. Projections indicate a 30% chance of a severe drought in the coming year, which would cause $300 million in damages (agricultural losses, emergency water hauling, health costs). However, the uncertainty is high: the drought probability is based on climate models that are contested, and the damage estimate could be as low as $100 million (if the drought is mild and short) or as high as $500 million (if prolonged and severe). The water authority has elicited an expected damage from inaction: they use a weighted average of the scenarios, but note that the uncertainty is deep and the true probability distribution is unknown. They assign an expected damage of $120 million (this is the expected value: 0.3 * $300 million = $90 million, but they also account for the range by using a conservative estimate? Actually, we must arrange the numbers so that the expected value calculation forbids the intervention. So let's adjust.)

   Let's set:
   - Probability of severe drought: 30% (0.3) [this is the best point estimate they have, though they acknowledge uncertainty]
   - Magnitude of harm from inaction (if drought occurs): $300 million.
   - Therefore, expected harm from inaction = 0.3 * $300 million = $90 million.

   The intervention (building a temporary desalination plant) costs $100 million (this includes construction, operation, decommissioning, and environmental restoration). The harm of intervening is the cost plus the environmental damage, but note that the environmental damage is compensated and reversible, so we can monetize it and include it in the $100 million. Thus, the harm of intervening is fixed at $100 million.

   Expected value calculation:
   - Expected harm from inaction: $90 million.
   - Harm from intervention: $100 million.
   Since $90 million < $100 million, the expected value calculation says: do not intervene (refuse the risky intervention).

   Precautionary principle (PP) formulation: We use a common formulation that emphasizes avoiding irreversible harm and shifting the burden of proof when there is scientific uncertainty about severe harm. Here, the harm from inaction (drought) is potentially severe and irreversible (e.g., permanent loss of farmland, long-term health effects from water scarcity) or at least difficult to reverse (it takes years for reservoirs to replenish and for agriculture to recover). In contrast, the harm from intervention is reversible (as described). Moreover, the uncertainty about the drought is high and the burden of proof is on those who would not intervene to show that the drought risk is low enough to justify inaction.

   The key clause of the precautionary principle that applies here is the irreversibility asymmetry: the harm from inaction (if the drought occurs) is irreversible in significant aspects (e.g., lost crops, long-term health impacts, and economic disruption) while the harm from intervention is reversible (the plant is temporary and the environmental damage can be restored). Also, the burden of proof shifts because of the uncertainty about the drought.

   Therefore, the PP requires the regulator to authorize the intervention (build the plant) to avoid the risk of irreversible harm, even though the expected monetary cost is higher.

   The single feature doing the work: the irreversibility of the harm from inaction. If we remove this feature (i.e., if the harm from inaction were also reversible, say by having a backup plan that could quickly mitigate the drought effects without lasting damage) then both options would be reversible. Then the PP would not break the symmetry and we might face paralysis. Without the irreversibility of inaction, the expected value calculation would still forbid the intervention (since $90M < $100M) and the PP would not clearly require intervention.

   Attack by the opponent: The opponent argues that the precautionary reading has quietly substituted its own probability distribution for the elicited one. Specifically, the regulator using PP might be acting as if the probability of the drought is higher than 30% (perhaps because of the uncertainty) or the damage is higher than $300 million. This would make it a dispute about the numbers rather than about the decision rule.

   Does the attack succeed? 
   In our scenario, the expected harm from inaction is fixed at $90 million (using the elicited 30% and $300M). The PP does not change these numbers. Instead, it focuses on the nature of the harm (irreversible vs. reversible) and the uncertainty (which is not quantified by a probability distribution). The PP argument does not require changing the probability or the magnitude; it says that even with these numbers, the irreversible nature of the harm from inaction and the uncertainty about the true risk (which might be higher) shift the burden of proof. Therefore, the attack does not fully succeed because the PP reasoning is based on qualitative features (irreversibility, uncertainty) and not on a different probability distribution. However, the opponent might counter that by emphasizing irreversibility, the PP is effectively assigning a higher disvalue to the inaction harm (i.e., it's not just $300M but more because of irreversibility). But note: we have already monetized the harm from inaction at $300M, which presumably includes the irreversible aspects. So if we stick to the monetized value, then the PP is not adding a new monetary value but is using a different decision rule that is sensitive to irreversibility and uncertainty.

   However, if the $300M does not fully capture the irreversibility (for example, because some losses like long-term health or ecosystem damage are not easily monetized) then the PP is indeed going beyond the expected value calculation by considering non-monetary or non-compensable aspects. But in our scenario, we stated that the harm from intervention is monetary-compensable and reversible, while the harm from inaction has irreversible aspects that might not be fully captured in the $300M. This is a point of vulnerability: the opponent can say that if the irreversible aspects of inaction are not captured in the $300M, then the expected value calculation should be adjusted to include them. The regulator might then have to assign a higher monetary value to the inaction harm. But the scenario states that the magnitude of the harm from inaction is uncertain and no defensible point probability exists. Therefore, the expected value calculation is already on shaky ground. The PP avoids this by not relying solely on expected value.

   Conclusion: The attack does not fully succeed because the PP is not substituting a different probability distribution but is using a different logic (irreversibility and burden of proof) to override the expected value calculation when there is uncertainty about severe irreversible harm.
answer: |-
  ### Decision Problem: Coastal Aquifer Protection

  **Scenario:** The coastal municipality of Aquaridge relies on a freshwater aquifer for drinking water. Seawater intrusion—caused by over-extraction and rising sea levels—threatens to contaminate the aquifer. The water authority must decide whether to implement an emergency intervention: drilling recharge wells to inject treated wastewater into the aquifer, creating a hydraulic barrier against saltwater. *Harm of inaction*: Seawater intrusion would permanently destroy the aquifer, rendering it unusable for decades. The mechanism (saltwater contamination via hydraulic gradient shifts) is understood, but the *timing and magnitude* are uncertain. Models indicate a 5–40% chance of catastrophic intrusion within 5 years, but no defensible point probability exists due to disputed data on subsurface porosity and sea-level rise velocity. Elicited experts assign a consensus *expected probability of 10%* (mid-range of model outputs). If intrusion occurs, the irreversible loss of the aquifer would cost **$1.2 billion** (replacement water infrastructure, health impacts, and economic disruption).  
  *Harm of intervention*: Drilling recharge wells costs **$150 million**. It risks groundwater contamination from trace pharmaceuticals in the injected wastewater, causing localized health issues (e.g., elevated cancer risk for 500 residents near injection sites). This harm is *reversible*: Contaminants degrade within 2 years, and the water authority can install carbon-filtration systems at a cost of **$10 million** within 6 months of detecting contamination (identified via mandatory well monitoring). Affected residents receive **$20 million** in compensation for temporary health impacts. Total intervention harm is **$180 million** ($150M + $10M + $20M)—monetizable, reversible via remediation, and non-catastrophic (no loss of life or species extinction).

  ---

  ### Expected Value Calculation
  - **Expected harm of inaction**: Probability of harm × Magnitude = 10% × $1.2B = **$120 million**.  
  - **Harm of intervention**: **$180 million** (fixed, as impacts are certain and reversible).  
  **Verdict**: Refuse intervention. $120M (inaction) < $180M (intervention).  

  ---

  ### Precautionary Principle (PP) Verdict  
  A standard PP formulation (e.g., UN Rio Declaration) requires action when:  
  > *"(1) threats of irreversible harm exist, (2) scientific uncertainty about causation or magnitude persists, and (3) the burden of proof shifts to those opposing intervention."*  

  **PP mandates authorization** because:  
  - **Irreversibility asymmetry**: Inaction risks irreversible aquifer loss (decades-long damage), while intervention harms are reversible (2-year remediation horizon at $30M total cost: $10M filtration + $20M compensation).  
  - **Uncertainty distinct from risk**: The 10% probability is an inadequate descriptor; model disagreement implies true risk could be 40% (or higher).  
  - **Burden of proof**: Uncertainty about intrusion timing shifts the burden to opponents to prove inaction is safe—which they cannot do.  
  **Key clause**: Irreversibility asymmetry carries the case. The PP prioritizes avoiding irreversible disasters over reversible costs, even with lower expected value.  

  ---

  ### Critical Feature and Attack  
  **Feature doing the work**: The *irreversibility of inaction* (aquifer loss) vs. *reversibility of intervention harm* (fixable contamination).  
  **If removed**: If aquifer damage were reversible (e.g., via futuristic desalination), PP would permit inaction. Expected value would still forbid intervention ($120M < $180M).  

  **Opponent's strongest attack**:  
  > *"PP surreptitiously replaces the elicited 10% probability with a higher subjective probability (e.g., 15%+), making this a debate about numbers—not decision rules. If PP uses the same 10%, it cannot rationally endorse a costlier action."*  

  **Rebuttal**: The attack **fails**. PP rejects probabilistic reductionism; uncertainty about irreversible harm justifies action *regardless* of the point estimate. Here, PP does not dispute the 10% probability—it overrules the expected-value calculus because:  
  - The 10% figure is epistemically unstable (experts assign 5–40%), and  
  - Irreversibility creates a qualitative asymmetry that expected value ignores.  
  PP treats uncertainty as a reason for caution, not an invitation to gamble.  

  ---  
  **Result**: Precautionary reasoning is action-guiding (pro-intervention) and escapes paralysis by leveraging irreversibility asymmetry. The regulator builds the wells.
