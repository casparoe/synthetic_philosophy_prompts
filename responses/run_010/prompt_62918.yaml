answer: |-
  Here are five desiderata for an inaccuracy measure and epistemic utility theory, addressing your core concerns:

  1.  **Truth-Directedness:** The measure must strictly reward closeness to truth. A credence closer to 1 (true) or 0 (false) for a given proposition must always be less inaccurate than one farther away, *for that specific proposition*. **Motivation:** Without this, the score wouldn't actually track accuracy – it wouldn't discern getting it right from getting it wrong. This is non-negotiable; an "accuracy" measure failing this is incoherent. **Conflict:** None inherently, but its simplicity underpins tensions elsewhere (e.g., with additivity or symmetry).

  2.  **Propriety (Strictly Proper Scoring):** An agent must *expect* their own sincere credences to yield the best possible score *by their own lights*. **Motivation:** This prevents self-sabotage and ensures honesty is the stable, rational strategy. It's the mechanism ensuring probabilism via dominance arguments. **Virtue or Bias?** It's a protective virtue against manipulation *by the agent themselves*, ensuring coherence is the uniquely rational strategy. Not a bias *for* a specific truth, but *for* coherence *given* the agent's own beliefs. Non-negotiable for the dominance arguments you describe.

  3.  **Additivity (Separability):** Total inaccuracy must be the sum of the inaccuracies assigned to each individual proposition in the partition. **Motivation:** This makes the score manageable and allows decomposition. It underpins the "no matter how the world turns out" dominance proofs by ensuring the score for one proposition doesn't depend on credences/truths for others. **What Breaks?** Without it, dominance proofs become vastly harder or impossible; a credence function beaten in *every* world might not exist. **Conflict:** This clashes fundamentally with your "questions can matter more" concern (Desideratum 4) and causes partition variance (your 2016 shouting match). It's negotiable *in principle* (other theories exist) but is load-bearing for standard dominance arguments.

  4.  **Context/Weight Insensitivity (Symmetry):** The inaccuracy contribution of being wrong/right about a specific proposition must depend *only* on the credence and the truth value, not on *which* proposition it is or *how* the world otherwise turns out. **Motivation:** This is often bundled with "Symmetry" and assumed for mathematical tractability and the "purity" of measuring pure epistemic disutility, divorced from practical consequences. **Conflict with Reality:** This directly contradicts your flood warning vs. picnic example – the real-world cost of being wrong varies massively. Insisting on this makes the theory inadequate for *practical* forecasting where stakes differ. It's negotiable and often a prejudice of the "pure epistemic utility" camp. **Collision:** This requirement **cannot** coexist with allowing variable question importance based on outcomes (your core objection) – they are mutually exclusive. Additivity (3) also prevents weighting *within* the sum.

  5.  **Feasible Application (Boundedness/Pragmatics):** The scoring rule and dominance arguments must be usable by actual, finite agents with limited access to truth and potential starting incoherence. **Motivation:** World-by-world dominance proofs are elegant but useless if (a) an incoherent agent sees no *practical* path to the dominant coherent function ("judging by her own lights"), or (b) the rule incentivizes harmful epistemic actions (e.g., your "better not to look" paradox). **Boundedness** protects against catastrophic penalties destroying comparability (your logarithmic score objection). **Conflict:** Strict dominance proofs often ignore *how* an agent reaches coherence or the cost of evidence gathering. If the theory prescribes *not looking* at crucial data to avoid expected penalty (due to anticipated stubborn misreading), that's likely a **reductio** against its adequacy as a *practical* guide, even if mathematically consistent. Boundedness is often negotiable theoretically but non-negotiable practically. Feasibility for imperfect agents is frequently sidelined.
