prompt: |-
  For thirty-seven years I was a statistical mechanician, and I retired three years ago; philosophy has since become my principal occupation, and I have been working through the philosophy of probability largely on my own. I want to understand a conceptual difficulty concerning the Principal Principle that I have not managed to resolve. I should note at the outset that I have no means of consulting sources, so please do not direct me to readings, and no bibliography is wanted — I need the reasoning laid out, not the state of play surveyed.

  Here is the difficulty. I arrived at the Principal Principle with a physicist's habits of thought. Chance struck me as a physical magnitude, on a par with mass or viscosity: a quantity a system possesses, which measurement can estimate and which theory can predict. On that reading the Principle looks like a simple norm of tracking — an agent's degree of belief in an outcome should be set to the magnitude she takes the system to possess, just as her belief about a body's mass should track her best measurement of it. Two claims I have since encountered sit badly with that reading, and I cannot see how to fit them together.

  First, the claim that the Principle is not a rule of updating at all, but a constraint on the prior credence function, so that an agent who begins in perfect deference can, by entirely ordinary conditionalization on subsequent evidence, end up out of deference. Please explain what sense this makes. If conditionalizing on new evidence can break the relation the Principle demands, then either the Principle is not a norm for a continuing agent, or it must be read as governing conditional chances rather than unconditional ones. I would like to see why the second move is the natural one, and precisely what it costs.

  Second, the claim that the difficulty becomes acute if chance is held to supervene on the total pattern of particular events. On such a view a chance hypothesis is itself partly a claim about how the actual sequence of outcomes goes, and so evidence about outcomes is evidence about the hypothesis. Please make this concrete with a small worked example and explicit arithmetic: a sequence of trials under a chance hypothesis assigning, say, 0.4 to the outcome of interest; an actual run that comes out strongly the other way; and a further trial whose probability I am trying to assess. Walk through what the Principle demands at each stage, what conditionalization delivers, and exactly where the two come apart. Then tell me which premise is doing the damage — the deference norm, the supervenience thesis, the unrestricted application of conditionalization, or the assumption that all evidence about outcomes is admissible — and whether removing it genuinely repairs the situation or merely empties the norm of content.

  Interwoven with this is a claim of my own that I suspect is mistaken and would like corrected. I reasoned as follows: if chances are nothing over and above summaries of actual frequencies, and if my credence concerning a future trial should equal my expectation of that frequency, then the Principal Principle adds nothing to ordinary conditionalization — it restates what a rational agent does in any case. I have been assured of the opposite: that the Principle is what makes chance the sort of thing it is, and that without a deference norm the Humean summary would be inert bookkeeping. Please adjudicate between these two pictures and say which is right, and why.

  Finally, please set out the principal strategies of repair — restricting deference to conditional chances, denying the supervenience thesis, tightening the notion of admissible evidence, weakening the norm to something approximate or asymptotic — and assess each against a standard I care about: does the repaired norm still tell an agent what to do, or has it been rendered true at the price of being unusable? Close by telling me directly where my mass analogy misleads, or, if you think it does not, where my reasoning above first went astray. Please keep the notation light and the exposition self-contained.
reasoning: |-
  Okay, the user is a retired statistical mechanician with 37 years of experience, now deeply engaged in philosophy of probability. They're struggling with the Principal Principle, particularly how it interacts with conditionalization and Humean supervenience. Their physics background makes them view chance as a physical magnitude, but philosophical claims about the Principle being a prior constraint and issues with supervenience are causing tension.

  First, I need to address why the Principal Principle is considered a constraint on priors rather than a updating rule. The key point is that evidence can change what we believe the chances are. If the Principle applied at every step, we'd have to constantly adjust beliefs to current chance estimates, but conditionalization already handles belief updating. Making it a prior constraint avoids double-counting evidence. 

  For the supervenience problem, I'll construct a concrete coin flip example. Start with a fair coin (chance 0.5), then show how observing all tails makes the Humean chance shift to near 0. The conflict arises when we try to apply the Principal Principle to a new flip - should we use our original 0.5 or updated near-0 chance? This exposes the tension between deference and supervenience.

  Regarding their "Humean summary" claim: they're right that if chances just are summaries of frequencies, then expecting future frequencies might seem sufficient. But the Principal Principle does extra work by forcing initial deference even before data exists, which pure conditionalization wouldn't require. It's what makes chance normative rather than descriptive.

  For repair strategies:
  - Conditional chances approach: Defer to current chances given history. Solves the problem but requires knowing entire history.
  - Reject supervenience: Makes chance primitive but loses physical grounding.
  - Restrict admissibility: Tricky to define non-circularly.
  - Asymptotic deference: Pragmatic but weakens norm.

  Their mass analogy fails because mass is time-independent while Humean chance evolves with history. The first misstep was viewing chance as a static physical property rather than a dynamic, history-dependent one.

  The core issue is that Humean chance tries to be both descriptive (supervening on actuals) and normative (guiding credence), creating tension when evidence changes the descriptive facts. The conditional chance move preserves normativity at the cost of practicality.
answer: |-
  Let's resolve this systematically. Your mass analogy is intuitive but misapplied—chance isn't a static physical property like mass in the Humean view. I'll address each point with explicit reasoning and a concrete example. Notation: \( Cr \) for credence, \( ch \) for chance, \( E \) for evidence, \( A \) for an event.

  ### 1. **The Principal Principle as a Constraint on the Prior**
  The Principal Principle (PP) requires that your initial credence in an event \( A \) conditional on the chance \( ch(A) = p \) and admissible evidence \( E \) should be \( p \):  
  \[ Cr_0(A \mid ch(A) = p \land E) = p. \]  
  This is a constraint on your *prior* credence function \( Cr_0 \), not a rule for updating.  
  - **Why this makes sense**:  
    If PP governed every stage, updating on evidence about outcomes would force you to constantly adjust your credence to match your *current* best estimate of the chance. But conditionalization already updates your beliefs rationally. PP ensures you *start* with correct deference; from there, conditionalization handles new evidence.  
  - **The cost of moving to conditional chances**:  
    If PP governed conditional chances (e.g., \( Cr(A \mid \text{history}) = ch(A \mid \text{history}) \)), it avoids conflicts but requires knowing the *entire history* to set credences. This is impractical and loses the simplicity of unconditional PP.  

  ### 2. **Problem with Humean Supervenience: A Worked Example**
  **Setup**:  
  - A coin is tossed 10 times.  
  - Hypothesis \( H \): \( ch(\text{Heads}) = 0.4 \) for each toss.  
  - Humean supervenience: Chances supervene on the *actual* sequence of outcomes. If all tosses land Tails, the chance isn’t 0.4—it’s near 0.  
  - Sequence: Tosses 1–9 all land Tails. You’re assessing Toss 10.  
  - Admissible evidence: All outcomes are admissible (per your request).  

  **Stages**:  
  1. **Before any tosses** (Prior state):  
     - PP demands: \( Cr_0(\text{Heads}_{10} \mid H) = 0.4 \).  
     - Your credence in Heads on toss 10 is 0.4.  

  2. **After observing first 9 tosses all Tails** (Evidence \( E \)):  
     - Conditionalization: Update credence by \( Cr_1(\cdot) = Cr_0(\cdot \mid E) \).  
     - But \( H \) says \( ch(\text{Heads}) = 0.4 \), yet the actual sequence (all Tails) suggests \( H \) is likely false. Humean chance *now* is near 0.  
     - PP for conditional chances would require \( Cr_1(\text{Heads}_{10} \mid H \land E) = ch(\text{Heads}_{10} \mid \text{history}) \approx 0 \).  
     - Unconditional PP still points to 0.4, but conditionalization on \( E \) lowers your credence in \( H \).  

     **Explicit arithmetic**:  
     - Suppose prior over chances: \( Cr_0(H) = 0.5 \) (50% chance \( ch = 0.4 \)), and alternative \( H' \): \( ch(\text{Heads}) = 0.01 \) (weighted for simplicity).  
     - Likelihood of 9 Tails:  
       - Under \( H \): \( (0.6)^9 \approx 0.01 \)  
       - Under \( H' \): \( (0.99)^9 \approx 0.91 \)  
     - Posterior:  
       \[
       Cr_0(H \mid E) = \frac{Cr_0(E \mid H) Cr_0(H)}{Cr_0(E)} = \frac{0.01 \times 0.5}{(0.01 \times 0.5) + (0.91 \times 0.5)} \approx 0.01
       \]  
     - Your credence in Heads on toss 10:  
       \[
       Cr_1(\text{Heads}_{10}) = Cr_1(H) \cdot 0.4 + Cr_1(H') \cdot 0.01 \approx 0.01 \times 0.4 + 0.99 \times 0.01 = 0.004 + 0.0099 = 0.0139
       \]  
     - **Conflict**:  
       - Unconditional PP says: "If you still believe \( ch = 0.4 \), set \( Cr(\text{Heads}_{10}) = 0.4 \)". But you no longer believe \( ch = 0.4 \)!  
       - Conditionalization lowers \( Cr(\text{Heads}_{10}) \) to 0.0139 based on evidence.  

  **Where they come apart**:  
  - PP (unconditional) demands 0.4 *if* you accept \( H \), but conditionalization shows \( H \) is implausible.  
  - The damage is done by **Humean supervenience + all outcome evidence being admissible**.  
    - Supervenience ties chance to actual outcomes, so outcome evidence directly impacts chance hypotheses.  
    - If all outcomes are admissible, PP conflicts with conditionalization when evidence undermines \( H \).  

  ### 3. **Your Claim: Is PP Redundant Under Humeanism?**  
  You argued: If chance is a summary of frequencies, and credence matches expected frequency, then PP adds nothing.  
  - **Why this is incorrect**:  
    - Without PP, nothing forces your *prior* credence to match the chance hypothesis. You could start with arbitrary priors (e.g., \( Cr_0(\text{Heads} \mid H) = 0.9 \) even if \( ch = 0.4 \)).  
    - PP enforces *initial deference*: it bridges the gap between the descriptive (frequency summary) and normative (how beliefs *should* align).  
    - **Adjudication**: The Humean summary is inert without PP—it’s PP that makes chance *authoritative* for belief.  

  ### 4. **Strategies of Repair**  

  | **Strategy**                  | **Does it work?**                                                                 | **Usable?**                                                                 |
  |-------------------------------|-----------------------------------------------------------------------------------|-----------------------------------------------------------------------------|
  | **Defer to conditional chances** | Yes: \( Cr(A \mid \text{history}) = ch(A \mid \text{history}) \).                  | Partially: Requires knowing entire history, often impractical.             |
  | **Deny supervenience**        | Yes (e.g., primitivist chances).                                                  | Cost: Loses physical grounding; chances become metaphysical.               |
  | **Restrict admissibility**    | Yes: Define "admissible evidence" as non-outcome-based (e.g., theoretical laws). | Unclear: Circular if "admissible" is defined via chance.                   |
  | **Asymptotic deference**      | Weak: Demand \( Cr(A) \approx ch(A) \) only after "enough" data.                 | Vague: No guidance for finite cases; norm is toothless.                    |

  - **Best balance**: Defer to *conditional* chances. It preserves normativity and avoids conflict with conditionalization, but requires tracking history.  

  ### 5. **Where Your Analogy Misleads**  
  - **Mass analogy**: Mass is intrinsic and time-independent. Humean chance is *extrinsic* and *time-dependent*—it supervenes on the entire history of outcomes.  
  - **First misstep**: Treating chance as a static "property" like mass. Under supervenience, chance is dynamic: observing outcomes *changes* the chance itself.  
  - **Core error**: Assuming PP can govern ongoing belief without conflicting with conditionalization. It can’t—because evidence about outcomes is evidence about chance.  

  ### **Direct Answer to Your Questions**  
  - The conflict arises from **Humean supervenience + unrestricted admissibility**.  
  - Repair by **deferring to conditional chances**: It works and remains usable, though demanding.  
  - Your mass analogy fails because **chance evolves with history**, while mass does not.  
  - Your reasoning went astray in **assuming chance is a static physical magnitude**—it’s not, under Humeanism.  

  The deeper lesson: PP isn’t about "tracking" a fixed quantity. It’s a normative bridge between objective patterns and subjective belief. Without it, Humean chance is indeed inert bookkeeping.
