prompt: |-
  Okay so I've been going around in circles on this for a week and I want to force myself to commit to a number, so help me do that.

  Setup, roughly as I understand it. In the obfuscated-arguments problem, a debater pushing some false claim F doesn't have to tell a single catchable lie. They build a tree instead: F follows from A, A follows from B, B follows from C, and so on, where every individual link is only about 50/50 plausible to the judge. The honest debater can't decisively knock down any one node, because at each node they only have a coin-flip case, and the judge is by assumption weaker than both debaters, so they can't be moved by an objection they can't evaluate themselves. The tree is way too big to audit end to end. So F survives not by being believed but by never getting located.

  Here's the proposition I want your credence on, and I want a number rather than a shrug:

  A protocol of this general shape -- two adversarial debaters, a weaker judge, bounded rounds and a bounded number of claims per turn -- cannot be made to reliably favor true claims over false ones in the regime where the false claim is backed by an obfuscated tree of that kind. Its not a fixable engineering problem, there's an actual ceiling, and no amount of cleverness in the rulebook (forced commitments, spot checks, recursive decomposition, making debaters stake falsifiable subclaims) gets you past it.

  Give me your number, then decompose it. The terms I think belong, though you should restructure or add to these if you'd carve it differently:

  - P(the real bottleneck is the judge's inability to evaluate a single 50/50 step) versus P(the real bottleneck is just the size of the tree, which is a resource issue rather than a conceptual one)
  - P(some rulebook change restores the asymmetry in favor of truth -- the liar has to commit to something checkable somewhere, and the honest side doesn't)
  - P(the honest debater has a move the liar lacks: refusing to go node by node and attacking the conjunction instead)
  - P(the alignment questions we actually care about turn out to be in the easy-to-locate class anyway, so the obfuscation regime never really bites)
  - and a reading question: does "reliably favor" mean "better than an unaided weak judge guessing alone" or "close to correct"? Tell me which one you scored your headline number against, because I'd bet the two readings are 0.2 apart.

  A number plus a line or two of justification for each term, then how you combine them into the headline credence. Then: which term is the headline most sensitive to, and what's the cheapest thought experiment or result that would move it?

  Also -- I'm at about 0.55 on the proposition and a collaborator is at 0.15. Tell me which of those terms you think the two of us are actually disagreeing about, because I'm pretty sure its not the one we argue about out loud.

  No need to point me at papers, I've read the usual ones. I just want the number you'd actually put down.
