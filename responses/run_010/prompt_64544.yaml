  2. **Rulebook changes restoring asymmetry**: I'm skeptical. The liar can always structure the tree to avoid checkable commitments. The honest side has to defend the entire chain, while the liar picks paths. Forced commitments might help, but the liar can use plausible deniability. P=0.2 that rule changes fix this.

