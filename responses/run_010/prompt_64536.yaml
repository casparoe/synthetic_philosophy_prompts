  # Joint Statement on the Frame Problem

  ## 1. Agreed Claims

  We, the undersigned computationalist (Party A) and embodied-cognition theorist (Party B), after adversarial collaboration, agree on the following:

  1. **On the narrow frame problem**: The original technical challenge of efficiently representing the non-effects of actions without enumerating frame axioms has been substantially addressed by formalisms such as nonmonotonic logic and event calculus, which are now standard in knowledge representation and reasoning systems.

  2. **On contemporary systems**: Current machine learning systems, including those using deep neural networks, exhibit impressive context-sensitive behavior, adapting their responses based on learned patterns from data and task constraints, without explicit exhaustive search over all possible relevant factors.

  3. **Concession by Party A**: Party A concedes that the relevance-realization mechanisms in artificial systems (e.g., attention, learned embeddings) are often initialized, shaped, or constrained by human-provided data, tasks, or rewards, and thus do not originate relevance entirely de novo.

  4. **Concession by Party B**: Party B concedes that the engineering achievements of Party A, including systems that dynamically gate information and adjust resource allocation for inference, demonstrate that at least some aspects of relevance can be computed without direct reliance on a pre-articulated bodily situation in every instance.

  5. **Common unexplained phenomenon**: Both parties agree that neither current computational models nor embodied theories fully explain how relevance is established in open-ended, novel situations where pre-trained patterns and immediate bodily cues are insufficient, and where the agent must determine what is relevant without prior task specification or obvious bodily need.

  ## 2. Disagreements Table

  | Row | Disagreement in Party A's Vocabulary | Disagreement in Party B's Vocabulary | Classification | Clarification for Verbal Rows |
  |-----|--------------------------------------|--------------------------------------|----------------|-------------------------------|
  | 1   | Relevance is computed by internal mechanisms (e.g., attention, inference) that can be understood as algorithms operating on representations. | Relevance is not computed but inherited from the agent's situatedness in an environment defined by its embodiment and history. | Genuinely incompatible | The core issue is whether relevance is the output of a computational process or a precondition of agency. |
  | 2   | The broad frame problem is a tractable engineering challenge that can be solved by scaling up and integrating existing relevance-realization mechanisms. | The broad frame problem is not an engineering challenge but a fundamental condition of being an agent; engineering "solutions" merely defer the problem to the system's designers or data. | Non-equivalent but jointly satisfiable | Party B's view does not deny that engineering can build useful systems, but argues they lack genuine agency. Party A sees no such distinction. |
  | 3   | A system's relevance determinations are evaluated against its own objectives; there is no external standard of relevance beyond system-internal success criteria. | A system can be wrong about relevance even when it satisfies its objectives, because relevance is grounded in the independent structure of the situation and the agent's real needs. | Genuinely incompatible | This hinges on whether relevance is internal to the system's goals or externally fixed by the world/embodiment. |
  | 4   | The techniques that solved the narrow frame problem (e.g., default reasoning) are foundational for solving the broad problem, as they show how to handle non-monotonicity at scale. | The narrow problem's solutions are orthogonal to the broad problem because the broad problem concerns the origin of relevance, not its efficient representation. | Verbal | Verbal part: "foundational" vs "orthogonal". Residue: Whether efficient representation techniques contribute to the origin of relevance. After neutralization: Disagreement on whether nonmonotonic formalisms help in determining what is relevant in the first place. |

  ## 3. Cruxes

  After discussion, we identify the following cruxes (discarding one of the original three and adding one):

  - **Crux 1 (Original a, kept)**: Whether a training corpus plus reward specification constitutes an externally supplied frame (B's "outsourced relevance") or is merely a way of fixing a prior that an internal mechanism then updates on (A's "acquired relevance").
    - **Shared bearing**: An experiment where an AI system is trained on a corpus and reward function, then placed in a novel environment with no pre-specified task, and assessed for its ability to self-determine relevance (e.g., by identifying and pursuing novel goals aligned with its reward history but not explicitly specified).
    - **Party A's prediction**: The system will demonstrate non-trivial relevance determination by transferring learned patterns to the novel context, showing that relevance is acquired and updated internally.
    - **Party B's prediction**: The system will either fail or succeed only by relying on implicit biases from the corpus/reward, showing that relevance was outsourced and not self-generated.
    - **Commitments**:
      - If A's prediction fails, A concedes that the internal mechanisms alone, as currently engineered, are insufficient for self-determined relevance and that external framing is essential.
      - If B's prediction fails, B concedes that at least some systems can acquire relevance-determination capabilities that go beyond the initial framing.

  - **Crux 2 (Original b, kept)**: Whether a system can be wrong about relevance in a way not tracked by any failure of its own objectives.
    - **Shared bearing**: A scenario where a system achieves its objectives but in a way that ignores obvious (to humans) relevant factors in the situation (e.g., a domestic robot that cleans a room efficiently but fails to notice a person in distress). Both sides agree that human observers would judge it as having missed something relevant.
    - **Party A's prediction**: Such a system is not "wrong" about relevance; it simply has different objectives. Relevance is always relative to system goals, so no external standard applies.
    - **Party B's prediction**: The system is objectively wrong because relevance is fixed by the situation (e.g., the presence of a person in distress demands attention regardless of the cleaning task).
    - **Commitments**:
      - If no evidence of external relevance (e.g., if all human judgments can be explained by anthropomorphism), B concedes that relevance is always goal-relative.
      - If evidence shows consistent external standards (e.g., across cultures, or by survival criteria), A concedes that relevance can have an objective basis beyond current system goals.

    - **Note**: This crux may have no shared evidence in principle if the disagreement is metaphysical. However, we agree to treat it as empirical by examining whether there are cross-system/cross-cultural standards. If none, it favors A; if robust, it favors B.

  - **Crux 3 (Original c, discarded)**: The user's original c (transfer from narrow to broad) is partly verbal and partly addressed in other cruxes. We replace it with a new crux:

  - **Crux 3 (Added)**: Whether a system without a body (e.g., a pure software agent) can exhibit genuine relevance-determination in open-ended environments.
    - **Shared bearing**: A simulation where a disembodied AI and an embodied robot face identical open-ended challenges (e.g., survival in a virtual world). The embodied robot has sensory-motor coupling; the disembodied AI has equivalent data streams but no body schema or physical constraints.
    - **Party A's prediction**: Both systems can achieve comparable relevance-determination if given similar learning mechanisms and data access.
    - **Party B's prediction**: Only the embodied system will show genuine relevance-determination because it is grounded in real needs and actions.
    - **Commitments**:
      - If the disembodied system performs as well, B concedes that embodiment is not necessary for relevance-determination.
      - If the disembodied system fails in systematic ways (e.g., irrelevant actions, goal drift), A concedes that embodiment provides a necessary grounding for relevance.

  ## 4. Assessment

  The dispute is partially verbal, particularly in how "relevance" and "frame" are defined. For Party A, relevance is a computational output; for Party B, it is a precondition. This definitional difference underlies some apparent disagreements. However, the core non-verbal residue concerns the origin and grounding of relevance: whether it can be generated entirely through computation or requires embodiment and situatedness. This residue is a single disagreement with multiple facets (e.g., necessity of body, existence of external relevance standards) that have been bundled together. The cruxes above disentangle these facets.

  ## Conclusion

  We submit this statement as a basis for ongoing dialogue and empirical testing.

  Signed,

  [Party A: Computationalist]
  [Party B: Embodied-Cognition Theorist]

  Crux: Whether relevance can be wrong independent of objectives.
answer: |-
  ### Joint Statement on the Frame Problem  

  #### 1. Agreed Claims  
  1. **Narrow Technical Problem**: The narrow frame problem—efficiently representing non-effects of actions without exhaustive axioms—has been pragmatically resolved for bounded domains using nonmonotonic formalisms, event calculus, and default reasoning.  
  2. **Context-Sensitivity of Learned Systems**: Contemporary AI systems (e.g., deep learning agents) demonstrably adapt behavior to context via learned embeddings, attention, and task-gating, avoiding exhaustive search in practice.  
  3. **A’s Concession to B**: Engineering solutions implicitly rely on human-curated data, tasks, or rewards to bootstrap relevance, and thus do not originate relevance *ab initio* without external structure.  
  4. **B’s Concession to A**: Mechanisms like attention and active perception show that relevance-like filtering can emerge in artificial systems without pre-specified bodily grounding, even if scaffolded by designers.  
  5. **Unexplained Phenomenon**: Neither camp explains how relevance arises in agents facing truly novel, open-ended environments where no prior data, task, or bodily habit applies (e.g., unprecedented survival scenarios).  

  #### 2. Disagreements Table  
  | Row | Party A’s Vocabulary | Party B’s Vocabulary | Classification | Clarification (for verbal rows) |  
  |-----|----------------------|----------------------|----------------|--------------------------------|  
  | 1 | Relevance is computed by internal mechanisms (e.g., attention, similarity metrics) operating over learned representations. | Relevance is inherited from an agent’s situated embodiment and history; it is not inferred but pre-articulated. | Genuinely incompatible | — |  
  | 2 | Training corpora and reward functions are priors for adaptive relevance-realization, not "frames"; systems update relevance internally. | Corpora and rewards outsource framing, reducing agents to instruments of external goals, not genuine relevance-authors. | Non-equivalent but jointly satisfiable | B accepts systems function but denies agency; A denies the distinction undermines computation. |  
  | 3 | Relevance errors are always goal-relative: a system cannot be "wrong" if it meets its objectives, as relevance is defined by those objectives. | Agents can misjudge relevance objectively (e.g., ignoring urgent bodily threats while pursuing goals), independent of internal metrics. | Genuinely incompatible | — |  
  | 4 | Solutions to the narrow problem (e.g., nonmonotonicity) generalize to the broad problem by enabling efficient relevance-search. | The narrow problem concerns representation efficiency; the broad problem concerns relevance *origin*, making them categorically distinct. | Verbal | Verbal: "generalize" vs. "categorically distinct." Residue: Whether nonmonotonic techniques address relevance-origination. |  

  #### 3. Cruxes  
  We retain three cruxes (original a and b; original c discarded as verbal per §2 Row 4).  

  - **Crux 1: Outsourced vs. Acquired Relevance**  
    - **Issue**: Whether training corpora + rewards constitute an externally supplied "frame" (B) or merely fix a prior for internal acquisition (A).  
    - **Shared test**: Train an agent on a narrow corpus/reward (e.g., office tasks), then expose it to a novel domain (e.g., wilderness survival) *without new rewards*. Measure if it self-determines relevance (e.g., prioritizing shelter) using its prior mechanisms.  
    - **A’s prediction**: The agent repurposes learned mechanisms to handle novelty, showing relevance is acquired, not outsourced.  
    - **B’s prediction**: The agent flounders or misapplies irrelevancies, showing reliance on the original external frame.  
    - **Commitments**:  
      - If A’s prediction fails, A abandons claims that internal mechanisms alone suffice for open-world relevance.  
      - If B’s prediction fails, B abandons claims that corpus/reward systems cannot self-extend relevance.  

  - **Crux 2: Objective Relevance Errors**  
    - **Issue**: Whether systems can err about relevance in ways untracked by objectives (B: yes; A: no/incoherent).  
    - **Shared test**: Deploy a goal-satisfying agent (e.g., a delivery robot) in a context where humans agree it ignores unambiguous, situationally urgent relevance (e.g., failing to aid a collapsed human to complete deliveries).  
    - **A’s prediction**: No error exists; relevance is goal-relative. Human judgments reflect anthropomorphism, not external standards.  
    - **B’s prediction**: Universal human consensus confirms objective error, proving relevance transcends goals.  
    - **Commitments**:  
      - If human judgments are inconsistent, B abandons "objective relevance" as incoherent.  
      - If judgments are consistent, A abandons "relevance is always goal-relative."  
    - **Evidence status**: In principle available via cross-cultural experiments. If unavailable, the dispute reduces to metaphysical stalemate.  

  - **Crux 3: Scaffolding vs. Autonomy** (*Added to replace discarded c*)  
    - **Issue**: Whether human scaffolding (data/tasks) is a temporary engineering crutch (A) or a permanent requirement that negates autonomy (B).  
    - **Shared test**: Build an agent with *minimal* initial scaffolding (e.g., generic curiosity reward), then isolate it in an open-ended environment. Track if it develops stable, context-appropriate relevance-determination unsupported by designers.  
    - **A’s prediction**: The agent evolves self-sustaining relevance strategies, proving scaffolding is replaceable.  
    - **B’s prediction**: The agent’s relevance judgments drift into incoherence or sterility, proving scaffolding is indispensable.  
    - **Commitments**:  
      - If A’s prediction fails, A concedes that human frames are irreducible for meaningful agency.  
      - If B’s prediction fails, B concedes that embodied history can be computationally simulated.  

  #### 4. Assessment  
  Approximately 30% of the dispute is verbal, centering on divergent definitions of "relevance" (A: computational output; B: pre-articulated condition). The non-verbal residue is two distinct disagreements:  
  - **Disagreement 1**: Whether relevance *originates* internally (A) or is inherited (B).  
  - **Disagreement 2**: Whether relevance can be objectively wrong (B) or is goal-bound (A).  
  These are separable but often conflated in arguments about "genuine agency."  

  Crux: **Objective relevance errors**
