answer: |-
  ### Objection Prep Sheet: Collapse of Fink/Mask Distinction  
  *(Ranked by Expected Damage: High to Low)*  

  ---

  **1. Circularity Charge (Conditional-Analysis Grad Students)**  
  *Objection:* "You've *defined* disposition loss as removal from the sufficiency set, and finks *by definition* remove dispositions. So of course masks become finks—it's tautological! This doesn't *explain* anything; it's verbal reshuffling of Lewis's second-order suitability clause."  
  **Reply:** "The collapse isn't stipulative—it reveals that masks *must* act either on the basis (finking) or the sufficiency set (antidoting). When a mask (e.g., wire mesh on glass) blocks fragility, it either destabilizes the molecular structure (basis removal) or alters background conditions (sufficiency-set change). We misclassify it as 'masking' only if we falsely assume the basis persists."  
  *Soft Spot:* Conflates basis-removal with sufficiency-set changes.  
  *Follow-up:* "But your 'sufficiency set' *includes* the basis—so basis-removal *is* sufficiency-set change. Circularity remains."  
  **Concede/Preempt in Talk:** ✅  

  **2. Essence Over Context (Dispositional Essentialists)**  
  *Objection:* "If property essences fix dispositional powers (e.g., NaCl's solubility), then context can't *remove* the basis—it can only *interfere* with manifestation downstream. Calling this 'finking' ignores modal rigidity."  
  **Reply:** "Essences fix *what* the disposition *is*, not its invulnerability. A water-soluble salt in anhydrous conditions lacks the basis for solubility *in that environment*. The essence governs the power, but its activation requires essence-specified conditions—remove one, you fink the disposition."  
  *Soft Spot:* Blurs essence-governed necessity with contextual contingency.  
  *Follow-up:* "But the essence *guarantees* the power exists if the substance exists—so how can context 'remove' it?"  
  **Concede/Preempt:** ❌  

  **3. Wrapped-Glass Counterexample (Philosopher of Science)**  
  *Objection:* "Foam-wrapped glass stays fragile (basis intact) but won't shatter when struck. By your view, the foam must be a fink removing fragility *upon impact*—but it doesn't! It's a passive barrier. Calling it a 'covert fink' is ad hoc."  
  **Reply:** "The foam alters the sufficiency set: impact + intact basis + *unimpeded energy transfer* are jointly sufficient for shattering. The foam removes the third condition—acting as an antidote to the basis. No finking occurs because the basis wasn't neutralized *before* stimulus."  
  *Soft Spot:* Arbitrarily expanding "sufficiency set" to include omitted conditions.  
  *Follow-up:* "Then *any* physical barrier becomes an 'antidote'—trivializing the distinction you tried to collapse!"  
  **Concede/Preempt in Talk:** ✅  

  **4. Anti-Reductionist Dismissal (Potentiality-First Metaphysicians)**  
  *Objection:* "Your entire argument presupposes dispositions *have* causal bases. But if dispositions are primitive, multi-track modal profiles, finks/masks are *both* just local interferers with manifestation—no need for your basis/sufficiency-set machinery."  
  **Reply:** "Even primitive powers require a supervenience base. When an interferer prevents manifestation, it must disrupt *whatever grounds* the power (a fink) or block its output (a mask). Your view still needs an account of *how* interference works—which my collapse explicates."  
  *Soft Spot:* Assumes reductionism about grounding.  
  *Follow-up:* "Primitive powers aren't grounded—they're fundamental. Interference is brute."  

  **5. Semantics of Generics (Generics Specialist)**  
  *Objection:* "Fink/mask distinctions track *ascriptive practices*, not metaphysics. 'Glass is fragile' is a generic true despite foam-wrapping. Your 'sufficiency set' just codifies context-sensitive defaults for generics."  
  **Reply:** "Ascriptive practices *reflect* what we take to be normal conditions for sufficiency. But the defeasibility itself is metaphysical—whether wrapping *physically prevents* shattering isn't about language."  
  *Soft Spot:* Fails to rule out linguistic explanation.  
  *Follow-up:* "Then why does 'fragile' apply to wrapped glass but not electro-finked glass? Your collapse erases that difference."  

  **6. Antidotes as Distinct (Conditional-Analysis Group)**  
  *Objection:* "Antidotes (e.g., vitamin C for scurvy) neutralize manifestations *without* removing the basis (malnourished body). Your view misclassifies this as finking, but antidotes don't touch the disposition!"  
  **Reply:** "Antidotes remove conditions *necessary* for the basis to suffice. Vitamin C isn't part of the basis for scurvy susceptibility—it's a background condition whose removal antidotes the manifestation. This fits: antidotes revise the sufficiency set."  
  *Soft Spot:* Vulnerability to "necessary condition" inflation.  
  *Follow-up:* "Then isn't *every* interferer an 'antidote' by adding/removing background conditions?"  

  **7. Multiple Dispositions Conflict (Dispositional Essentialists)**  
  *Objection:* "A corrosion inhibitor adsorbed onto steel doesn't remove its basis for rusting—it adds a *new* basis for resistance. Two powers coexist; no finking occurs."  
  **Reply:** "The inhibitor either destabilizes the rusting basis (finking) or adds a blocker to the sufficiency set (antidoting). Coexistence is illusory—only one power is active per stimulus."  
  *Soft Spot:* Overlooks simultaneous multi-track dispositions.  
  *Follow-up:* "But the steel *retains* rusting capacity—e.g., if the inhibitor desorbs. Your collapse can't capture this."  

  **8. Causal-Model Semantics Sidestep (Causal-Model Advocate)**  
  *Objection:* "Why not use causal models? Finks break the stimulus-basis link, masks break basis-manifestation. Your 'sufficiency set' is just a non-causal proxy."  
  **Reply:** "Causal models *presuppose* a sufficiency set to define 'links.' Masking *is* link-breaking—but that’s antidoting/finking under a description. My account unifies the failure modes at the metaphysical level."  
  *Soft Spot:* May concede causal models are explanatory equals.  
  *Follow-up:* "Then your collapse adds no value—it's a notational variant."  

  ---

  ### Critical Exchange & Nightmare Question  
  **Must-Win Exchange:** The circularity charge (#1). If the view is seen as trivial/tautological, all else fails.  
  **Reply Strategy:** Stress that the collapse *exposes* a false distinction in the *phenomenology* of interference—empirical cases (e.g., catalyst poisons) force reclassification.  

  **Nightmare Question:** "Why isn't your 'sufficiency set' just Lewis's reformed conditional analysis with 'suitability' relabeled?"  
  **Least-Bad Answer:** "Lewis's suitability is a *restriction* on conditionals to exclude finks/masks. My sufficiency set is *constitutive* of the disposition. The difference: suitability is external; mine is internal to the property's identity. But yes, structurally, it's a descendant—with the key advance that it *dissolves* the distinction Lewis needed suitability *for*."  

  ---

  ### On-the-Spot Test Cases  
  **1. Catalyst Poisoning (Chemistry)**  
  *Case:* A palladium catalyst hydrogenates alkenes but is poisoned by trace sulfur. The catalyst’s structure (basis) is intact, but no reaction occurs.  
  *Verdict:* **Absorbed.** Sulfur acts as an antidote: it removes a condition (active site accessibility) from the sufficiency set. *Cost:* Must include "catalytic site availability" in sufficiency conditions.  

  **2. Firebreaks in Forest Fires**  
  *Case:* A dry forest is flammable, but a firebreak (cleared land) halts the fire without removing flammability of trees.  
  *Verdict:* **Absorbed.** Firebreak removes "continuous fuel" from the sufficiency set for fire spread. *Cost:* Suggests dispositions are environment-relative.  

  **3. Allosteric Inhibition (Biochemistry)**  
  *Case:* An enzyme’s active site (basis for catalysis) is unaltered, but an inhibitor binds elsewhere, changing its shape to block substrate binding.  
  *Verdict:* **Genuine Damage.** Basis persists *structurally* but is functionally neutralized—a true mask? Forces refinement: the "basis" must include *dynamic* capacity, not just static structure.  

  ---

  **Summary Tactics:**  
  - Preempt circularity (#1) and wrapped glass (#3) in the talk.  
  - For #2 (essences), stress that essence fixes *what would suffice* in ideal conditions, not unconditional activation.  
  - For science cases, lean into sufficiency-set flexibility—but admit allosteric inhibition (#3) may need "process basis" expansion.  

  ---  
  *Format: Compact, bullet-ready, no citations. Focus on dialectical rhythm over comprehensiveness.*
