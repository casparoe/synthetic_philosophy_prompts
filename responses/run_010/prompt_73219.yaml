prompt: |-
  I'm running a 75-minute senior seminar on intergenerational justice next month — usually 20-22 students, mostly philosophy with a few econ majors who've already seen the standard discounting math. Twice now I've tried to teach pure time preference by just talking about it, and it flops: they nod at the principle ("mere position in time can't be a morally relevant difference, that's arbitrary") and then turn around and defend discounting the far future on other grounds, and I can't get them to see that the other grounds aren't doing the work they think they are.

  So I want them to run into it instead. Design an in-class game that makes the force of pure time preference felt, and — this is the part I care about most — separates it from the things people always say they're really doing when they discount: uncertainty about whether the future payoff arrives, the risk of dying or forgetting before you collect, temptation/weakness of will, and plain inequality (giving to poorer people first).

  Here's the apparatus I want you to work with, feel free to adjust the numbers but keep the structure:

  - Tokens, no real money. Candy, poker chips, whatever converts to a fraction of a participation point — it has to feel like something is actually lost when they spend it now.
  - A compounding pot. Each cohort starts with an inherited pot, decides each round how much to spend now vs. leave in the pot, and whatever's left grows by a known fixed multiple. The last cohort in the chain consumes the whole pot. That terminal round matters: somebody has to eat it, and everyone knows it.
  - The reveal is mid-game, not upfront. They should be told before their first choice that the pot was seeded by a previous cohort — but not how that cohort decided, not how much was passed on, and not who they were. Just: someone you'll never meet made a number, and here you are. And then after their own decisions, they get told exactly what that previous group did and what they're about to do to the next group. I want the moment where they realize they're angry at, or grateful to, a nameless stranger for a choice made under conditions identical to their own.
  - Pre-registration. Before anything starts, each student writes down, privately, a number: what weight they'd give to the welfare of a stranger a hundred years from now relative to an identical stranger today. Keep the slips. At the end you pull out their own number and compare it to the discount rate their play actually revealed, and you compute that implied rate out loud on the board from the multiplier and what they chose. Watching someone's stated rate and their revealed rate disagree is the whole point of the exercise.

  The two-arm thing: run the same game twice with the class split, where in one arm the transfer is deterministic — no risk of the round ending, no chance of forgetting, you are absolutely told you'll be around to collect, and the choice is made once and locked so there's no temptation to reverse it — and in the other arm the standard confounds are switched on (random chance of early termination that wipes unsaved tokens but returns saved ones, re-choosing every round so they can renege). Then put the two implied rates side by side. If the deterministic arm still shows heavy discounting, they've got nowhere to hide. If it doesn't, that's an honest result too and the debrief has to be able to handle it without me looking like I rigged it.

  What I need back:

  1. The full rules and materials, and a payoff scheme with actual numbers that works with tokens and a class of ~20 — including how many rounds, what the multiplier should be so the choice bites, and how you handle the logistics of the inheritance chain when you only have one class period and no previous cohort to seed from (I assume you fake it or run one cohort as the ancestors and one as the descendants; tell me which and what the fake version costs you).
  2. A minute-by-minute for the 75 minutes.
  3. A debrief that maps specific moments in the game onto specific claims — which moment is pure time preference, which is uncertainty, which is inequality — and that ends only after they've heard the Sidgwick/Rawls line of argument and can say for themselves whether the game supports it or undercuts it.
  4. An honest account of what will predictably break the first time I run this: where students will collude, which round they'll game, who sulks, what happens when the terminal cohort gets greedy and everyone finds out, and what I say to the student who announces they were just playing to maximize their candy and doesn't that prove nothing.
  5. A frank note on the feature of the idea the game cannot reproduce and that I'll have to supply in words — my guess is that a known-length game with a known final round produces something that looks like discounting but is really backward induction, and that's not the same thing as the attitude the concept is supposed to name. Tell me if that's right and how much of it I can paper over.
reasoning: |-
  Okay, let me start by understanding the professor's problem. They've tried teaching pure time preference through lectures, but students keep justifying discounting on other grounds like uncertainty or inequality. The professor wants an in-class game where students experience pure time preference firsthand and see how it's separate from those other factors.

  The key elements from the query are: tokens with real stakes (like candy or participation points), a compounding pot that grows each round, inheritance from a previous cohort revealed later, and pre-registration of their stated discount rates. The two-arm design is crucial—one deterministic and one with confounds—to isolate pure time preference.

  Hmm, the professor mentioned that students nod at the principle but then defend discounting using other reasons. So the game needs to create a situation where those other reasons are controlled, especially in the deterministic arm. I need to make sure uncertainty, mortality risk, and temptation are removed there. For the confound arm, I'll add elements like random termination or the ability to change decisions each round.

  Logistics are tricky. With only 75 minutes and no real previous cohort, I'll need a seeding mechanism. Using the first group as "ancestors" for the second group makes sense. But that means the second group's starting pot depends on the first group's decisions. The professor wants the reveal to happen mid-game, so Group 2 shouldn't know what Group 1 did until later. Maybe run Group 1 quietly while Group 2 does another activity?

  Pre-registration is important for cognitive dissonance. Students write down their stated weight for future strangers, then we compare it to their revealed rates. The moment they see the discrepancy could be powerful, especially when they realize they're angry or grateful to the "nameless strangers" (Group 1) after the reveal.

  For the numbers, the multiplier needs to be high enough that saving feels meaningful but not so high that it's obvious. A 1.5x multiplier seems right—it compounds noticeably over a few rounds. Starting with 100 tokens per cohort, with 5 rounds total (3 decision rounds plus seed and terminal). Wait, the professor mentioned inheritance, so Round 0 is seeded by the facilitator, then Round 1 (Group 1), Round 2 (Group 2), and Round 3 as the terminal round.

  Payoff scheme: Each student gets tokens based on their cohort's consumption. Since cohorts are groups of 10-11, the pot size affects everyone equally. Maybe individual choice within the cohort? But that might complicate things. Perhaps each cohort decides collectively? But free-rider problems... Maybe better to have individual decisions that affect a personal pot, but then inheritance gets messy. 

  Ah, got it: Each student has their own "lineage" within the cohort. So for Group 1, each student gets a starting pot (say 100 tokens) from the "ancestor," decides how much to consume/save, and what's saved grows to the next round. Then Group 2 inherits individually from Group 1's saved amounts, and so on. But that requires tracking individuals across cohorts, which is logistically tough in one class. 

  Alternative: Cohorts decide collectively. Group 1 as a whole decides how much to consume and save from the inherited pot. Then the saved amount grows, and Group 2 inherits that single pot. This is simpler but loses individual revelation. The professor cares about revealed personal rates, so maybe individual tracking is necessary. But with 20 students, if I split into two arms (A and B), each arm has two cohorts (e.g., Arm A: Cohort A1 and A2; Arm B: Cohort B1 and B2). Each cohort has 5 students. Each student in Cohort A1 is matched to one in Cohort A2 for inheritance. 

  Yes! That works. So in Arm A (deterministic), Cohort A1 decides, their saved tokens grow, and go to their linked "descendant" in Cohort A2. Same for Arm B with confounds. This way, each student's decision directly affects their descendant, making the personal connection stronger. The anger/gratitude moment is towards a specific person, not a group. 

  For the terminal round, Cohort A2 consumes what they saved in the final round. The professor said the last cohort consumes the whole pot, so after Cohort A2 decides, they get to consume whatever they didn't save? But there's no one after them. The rules need to clarify that the terminal cohort consumes everything without saving. 

  Pre-registration: At the start, each student writes their δ (weight for future stranger). Keep it simple: "What fraction of a token for someone today would you give up to give one token to someone 100 years from now?" So if they say 0.7, that means they value future at 70% of present. 

  The two arms: Arm A has no confounds—deterministic, one decision locked in, no mortality risk. Arm B has re-choice each round, random termination risk (e.g., 10% per round that the round ends early, wiping unsaved tokens but returning saved ones to the pot), and maybe a temptation element? But the professor listed forgetting, dying, etc. Random termination covers mortality risk. Re-choosing every round adds temptation because they can change their minds. 

  Revealing the ancestor's decision: After Cohort A2 decides, show them what their linked ancestor in Cohort A1 actually saved for them. Then they see if they got a lot or a little, and compare to what they passed on. 

  Time planning: 75 minutes. Need intro, pre-reg, game setup, two rounds of play (since only two cohorts per arm), reveal, and debrief. With two arms running simultaneously, logistics might be tight. Maybe 5 min intro, 5 min pre-reg, 10 min explaining rules, 15 min for Cohort 1 decisions, 10 min for Cohort 2 decisions (since they see the inherited pot), then 10 min reveal and compute rates, 25 min debrief. 

  Debrief structure: Start by asking Cohort 2 how they felt seeing what their ancestor left them. Then show the computed discount rates from play vs. stated δ. Highlight the difference between the two arms—if Arm A still shows discounting, that's pure time preference. Map moments: When Cohort 2 felt gratitude/anger, that's pure time preference; in Arm B, changing decisions or termination events show confounds. End with Sidgwick/Rawls: "mere position in time" shouldn't matter, but the game shows it does, revealing bias. 

  Predictable problems: Terminal cohort (Cohort 2) might save nothing, making descendants angry. Or students collude to save everything, but since they consume now, there's temptation. The student who says "I just wanted candy" needs addressing—point out that maximizing personal gain is exactly what reveals discounting, but the moral question is whether that preference is justifiable. 

  Limitation: The fixed endpoint with backward induction isn't the same as infinite future discounting. In the game, Cohort 2 knows they're last, so not saving is rational. But in real intergenerational justice, there's no endpoint. Need to clarify that the pure time preference component is about favoring present over future regardless of endpoint, but the game's structure might conflate it with finite-horizon effects. Can't fully reproduce, so discuss in debrief.
answer: |-
  Here’s a robust design for your seminar, honed to isolate pure time preference while exposing common confounds. The key innovation: **individual inheritance chains** within cohorts, forcing personal accountability and magnifying the "nameless stranger" effect.

  ---

  ### **1. Rules, Materials & Logistics**  
  **Materials**:  
  - Tokens: Poker chips (100 blue = 1 token; 1 token = 0.1% participation credit).  
  - Two growth multipliers: **1.5x** (for bite) and **1.1x** (for confound-arm control).  
  - Two dice (for termination risk in confound arm).  
  - Pre-printed decision sheets, envelopes for pre-registration slips.  

  **Structure**:  
  - **Players**: 20 students → Split into **Arm A (deterministic, 10 students)** and **Arm B (confounds, 10 students)**.  
  - **Inheritance chains**: Each arm has 5 "ancestors" (Cohort 1) and 5 "descendants" (Cohort 2). *Each Cohort 1 student seeds a unique pot for one Cohort 2 student* (no overlap).  
  - **Rounds**:  
    - **Round 0 (Seed)**: Facilitator seeds 100 tokens per inheritance chain (e.g., Arm A Chain 1: 100 tokens).  
    - **Round 1 (Cohort 1)**: Ancestors decide how much to consume now vs. save. Saved tokens grow.  
    - **Round 2 (Cohort 2)**: Descendants inherit grown pot, decide consumption/saving. Terminal consumption occurs.  
  - **Growth**: Saved tokens multiply after each round (e.g., save 40 tokens → 40 × 1.5 = 60 for descendant).  

  **Arm-Specific Rules**:  
  | **Condition**               | **Arm A (Deterministic)**                          | **Arm B (Confounds)**                              |  
  |-----------------------------|---------------------------------------------------|---------------------------------------------------|  
  | **Uncertainty**             | None. Guaranteed payout.                          | 20% chance per round of early termination (roll die). If triggered, saved tokens returned to pot; unsaved lost. |  
  | **Temptation/Weakness**     | One locked decision per cohort.                   | Re-decision every 5 mins (can change consumption). |  
  | **Inequality Control**      | All start with 100 tokens; no wealth differences. | Same.                                              |  
  | **Growth Multiplier**       | 1.5x                                              | 1.1x (lower to avoid dwarfing confound effects).   |  

  **Payoff Scheme**:  
  - Tokens consumed = personal candy (e.g., 10 tokens = 1 candy).  
  - **Cohort 2’s terminal consumption** converts to credit (e.g., 50 tokens = 0.5% credit).  
  - *Crucially: Cohort 1’s consumption is immediate candy; Cohort 2’s is delayed credit + candy.*  

  **Seeding Logistics**:  
  - **Fake Round 0**: You act as "ancestor" for Cohort 1, seeding 100 tokens per chain.  
  - **Cost**: Minimal (you "consume" nothing; students know it’s fictional but feel inheritance gravity).  

  ---

  ### **2. Minute-by-Minute Schedule** (75 mins total)  
  - **0:00–5:00**: Intro + Pre-registration  
    - *Activity*: Students write δ ("Weight for a stranger 100yrs from now vs. today") on slips. Collect in envelopes.  
  - **5:00–15:00**: Rules Explanation  
    - Split into Arms A/B → Assign Cohort 1/2 roles. Emphasize: "You inherit from a real person who decided before you."  
  - **15:00–25:00**: **Cohort 1 Decisions**  
    - Arm A: Decide once (save S1, consume 100-S1).  
    - Arm B: Decide now; can revise at 20:00 and 25:00. Roll for termination after each decision.  
  - **25:00–35:00**: **Pot Growth & Inheritance Reveal**  
    - Calculate new pots: Arm A grows saved tokens by 1.5x; Arm B by 1.1x.  
    - Give Cohort 2 their inherited pot size *but not Cohort 1’s choices*.  
  - **35:00–45:00**: **Cohort 2 Decisions**  
    - Cohort 2 decides consumption/saving (terminal round: all saved tokens consumed).  
  - **45:00–55:00**: **The Reveal & Rate Calculation**  
    - Show Cohort 1’s actual choices + inherited pots.  
    - Compute revealed discount rate:  
      - *Example*: Ancestor saved 40/100 → Descendant got 60 tokens. If descendant saved 30/60, revealed discount factor = (40/100) × (30/60) = 0.2. Rate = (1/0.2)^(1/100yrs) [simplify to per-period].  
    - Compare to pre-registered δ.  
  - **55:00–75:00**: **Debrief** (see next section).  

  ---

  ### **3. Debrief Framework**  
  **Map Game Moments to Concepts**:  
  - **Pure Time Preference**:  
    - *Moment*: Cohort 2’s anger when ancestor under-saved (e.g., "They had the same info but took 90 tokens!").  
    - *Claim*: "Mere position in time isn’t morally relevant—yet you rewarded yourself for being first."  
  - **Uncertainty/Risk**:  
    - *Moment*: Arm B’s panic during termination rolls.  
    - *Claim*: "You discounted because you might not get it—but Arm A had no risk and still under-saved."  
  - **Temptation**:  
    - *Moment*: Arm B students revising decisions upward ("I’ll save less... just 5 more tokens now").  
    - *Claim*: "Weakness of will feels distinct from thinking future people matter less."  
  - **Inequality**:  
    - *Moment*: Equal starting pots, yet unequal outcomes due to choices.  
    - *Claim*: "Did you discount because descendants are poorer? No—they started equal."  

  **Sidgwick/Rawls Pivot**:  
  - *Sidgwick*: "Pure time preference is irrational unless based on general good."  
  - *Rawls*: "Just savings principle rejects discounting for arbitrary timing."  
  - *Game Link*: "Your revealed rate ≠ your stated δ. Does the game show we *act* as if time creates moral privilege?" → Push students to argue whether the discounting was defensible.  

  ---

  ### **4. Predictable Breakdowns & Responses**  
  - **Terminal Cohort Greed**: Cohort 2 saves little → Ancestors protest.  
    - *Response*: "This is intergenerational injustice in miniature. Why is your ‘now’ more urgent than theirs?"  
  - **Collusion**: "Let’s all save 100%!" → Undermined by temptation (Arm B) or self-interest (free candy now).  
  - **Sulking**: Ancestor who saved 90% but descendant saved nothing.  
    - *Response*: "Your sacrifice wasn’t reciprocated. Does that make it irrational? Or is justice non-transactional?"  
  - **"I just wanted candy!"**:  
    - *Response*: "Exactly. You revealed a preference for present consumption *even when inequality, risk, and weakness were removed*. That’s pure time preference—and we must ask if it’s ethical."  
  - **Math Gripes**: Econ students compute optimal save rates.  
    - *Response*: "Optimizing ≠ justifying. Should your self-interest define moral weight?"  

  ---

  ### **5. Limitation: Finite Horizon vs. Pure Time Preference**  
  **The Problem**:  
  - Backward induction in a known-end game *looks* like discounting but stems from strategic necessity (e.g., Cohort 2 consumes all because no one follows). True pure time preference (e.g., valuing 2100 less than 2050 *solely* due to time) isn’t cleanly isolated.  

  **Mitigations & Words to Supply**:  
  - **Mitigation 1**: The ancestor’s choice (Round 1) has no backward induction pressure—they *know* Cohort 2 exists. Their under-saving reveals pure time preference.  
  - **Mitigation 2**: Stress that *real* intergenerational justice lacks a fixed endpoint. The game’s "final cohort" is a simplification.  
  - **Key Verbal Bridge**:  
    > "In this game, Cohort 2’s consumption spree might be strategic. But ask: Why did Cohort 1—who faced no endpoint—still prioritize themselves? And why did *you* feel wronged when your ancestor did that? *That* is the kernel of pure time preference: favoring oneself for being earlier, even when no endpoint exists."  

  ---

  **Why This Works**:  
  - The **individual inheritance chains** make discounting visceral (anger at a specific stranger).  
  - **Arm A vs. Arm B** isolates confounds: If Arm A discounts heavily, pure time preference is exposed.  
  - **Pre-registration → Revealed rate** dissonance forces reflection.  
  - **Terminal round injustice** mirrors real-world consequences of discounting.  

  **First-Run Tip**: Dry-run the math (use multipliers 1.5x and 1.1x). Ideal token counts:  
  - Ancestor saves 40 → Descendant gets 60.  
  - If descendant saves 30, revealed discount factor = (40/100) × (30/60) = 0.2 → "You acted as if future people are worth 20% of present people."
