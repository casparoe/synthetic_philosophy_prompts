  We are writing a joint statement for a universalist and a nihilist about composition. We must avoid quoting authors, keep it self-contained, and define all terms. The structure is strict: Agreed Claims, Disagreements (table), Cruxes, Test Cases, Verbal Residue, and then a JSON summary.

  First, define key terms simply:
  - **Universalist (about composition)**: Holds that whenever there are some things, no matter what they are or how they are arranged, they always compose a further thing. So for any collection of objects, there is an additional object that is the whole they form.
  - **Nihilist (about composition)**: Holds that composition never happens. There are only simple, partless objects (simples) arranged in various ways. When we say "there is a table", we mean there are simples arranged tablewise, but no table as an additional object.
  - **Life-based middle answer (van Inwagen-like)**: Composition occurs only when the activities of the parts constitute a life. So, only living organisms are composite objects; non-living composites (like tables or rocks) do not exist as objects, only their parts do.

  Now, the joint statement.

  ## Joint Statement: Universalism vs. Nihilism on Composition

  ### 1. Agreed Claims

  Both the universalist and the nihilist agree on the following substantive points:

  1. **Claim A1: The observable facts about the robots are the same regardless of which view is correct.**  
     Both sides agree that what we can observe and measure in the lab—such as the positions, movements, interactions, and functional behaviors of the robots—remains unchanged. The disagreement is not about these facts but about whether the existence of a composite object is an additional fact.  
     *Non-vacuous because:* A skeptic might think that if the views don't affect observables, then the dispute is empty. But both sides affirm that the dispute is about the ontological inventory (what exists) beyond the observable arrangements, which is a substantive metaphysical issue.

  2. **Claim A2: Neither view is falsified by ordinary language or engineering practice.**  
     Both sides agree that when people say "that is one robot" about a latched cluster, they are speaking truly in a practical or loose sense, but this does not settle the metaphysical question. The universalist takes this talk at face value as referring to a composite object, while the nihilist interprets it as referring to simples arranged robot-cluster-wise.  
     *Non-vacuous because:* This claim denies that common usage is decisive evidence for either side, making room for a genuine metaphysical disagreement that isn't resolved by how we talk.

  3. **Claim A3: Both views must account for vagueness in composition.**  
     Both sides agree that there are unclear cases (e.g., during latching/unlatching) where it might be vague whether composition occurs. The universalist holds that composition is always definite, so vagueness must be explained as semantic (in our language) or epistemic (due to our ignorance). The nihilist holds that there are no composite objects to be vague about, so vagueness is only about how we describe arrangements.  
     *Non-vacuous because:* It forces both sides to provide a non-trivial account of vagueness, showing that their positions are not undermined by borderline cases.

  4. **Claim A4: The life-based middle answer is inadequate for non-living composites.**  
     Both sides agree that the life-based view (that composition requires life) fails to account for ordinary objects like tables, rocks, or robotic clusters, which clearly function as unities but are not alive. The universalist says this shows the life-based view is too restrictive, while the nihilist says it shows that even life-based composites are not needed (only simples arranged living-wise).  
     *Non-vacuous because:* It identifies a shared weakness in the middle position, making the extremes more defensible by comparison.

  5. **Claim A5: No exceptions to their principles.**  
     Both views are exceptionless. Universalism holds that composition happens in every case, no matter how scattered or disunified the parts. Nihilism holds that composition never happens, no matter how unified the parts appear.  
     *Non-vacuous because:* It shows that neither view can be easily refuted by counterexamples, as they are principled and universal.

  ### 2. Disagreements

  We present the disagreements in a table. Each row states a point of disagreement, with formulations each side would accept, an assessment of whether it is genuine or merely verbal, and a link to a crux.

  | Disagreement | Formulation the universalist would sign | Formulation the nihilist would sign | Genuine or merely verbal | Feeds crux |
  |--------------|----------------------------------------|------------------------------------|--------------------------|------------|
  | D1: Existence of composite objects | Whenever two or more material objects exist, there is an additional object that is their sum. | There are no composite objects; there are only simple, partless objects arranged in various ways. | Genuine | C1 |
  | D2: What ordinary language refers to | When we say "there is one robot cluster", we are referring to a single composite object made of the parts. | When we say "there is one robot cluster", we are referring to the many simples arranged cluster-wise, and there is no additional object. | Verbal | C2 |
  | D3: Counting objects | In a scenario with six robots, there are at least seven objects: the six robots and the cluster they compose. | In a scenario with six robots, there are exactly six objects (if robots are simples) or many more simples (if robots are composite), but no seventh object. | Genuine | C1 |
  | D4: The role of functional unity | Functional unity (like shared control) is evidence that the parts compose an object. | Functional unity is merely evidence of complex arrangement of simples; it does not imply a composite object. | Genuine | C3 |
  | D5: The status of the life-based view | The life-based view is incorrect because composition occurs even without life. | The life-based view is incorrect because even in life, there are no composite objects. | Genuine | C4 |

  ### 3. Cruxes

  Cruxes are sub-questions that could move one side. We include one on verbal dispute and one on the life-based view.

  1. **Crux C1: Is there a seventh object?**  
     - *Question:* In a scenario with six distinct material objects (e.g., six robots), is there a seventh object that is the composite of the six?  
     - *Shared consideration:* Both agree that if there were a seventh object, it would have properties (location, mass, etc.) that are determined by the six. However, the universalist predicts that we can refer to and quantify over this object directly, while the nihilist denies such reference succeeds.  
     - *Universalist prediction:* We can successfully use singular terms to refer to the whole (e.g., "the cluster") and assign properties to it that are not reducible to properties of the parts.  
     - *Nihilist prediction:* Any attempt to refer to the whole can be paraphrased away by referring only to the parts and their relations.  
     - *Who moves if wrong:* If the universalist prediction fails (i.e., if we cannot refer to the whole without paraphrase), the universalist might weaken to accepting contextual composition. If the nihilist prediction fails (i.e., if we must refer to wholes as objects), the nihilist might move toward accepting some composites.  

  2. **Crux C2: Is the dispute merely verbal?**  
     - *Question:* Can the statements of universalism and nihilism be translated without loss of meaning into each other?  
     - *Shared consideration:* Both agree that if the dispute is verbal, then there is no substantive disagreement. We can test by seeing whether all statements about composite objects can be paraphrased into statements about arrangements of simples.  
     - *Universalist prediction:* Some statements about composites (e.g., "the cluster survived the loss of a part") cannot be fully paraphrased without losing meaning.  
     - *Nihilist prediction:* All statements about composites can be paraphrased into statements about simples and their relations.  
     - *Who moves if wrong:* If the universalist prediction holds (paraphrase fails), the nihilist must either accept composites or provide a better paraphrase. If the nihilist prediction holds (paraphrase succeeds), the universalist must concede the dispute is verbal.  

  3. **Crux C3: Does functional unity imply composition?**  
     - *Question:* When parts are functionally unified (e.g., a latched cluster with a single control loop), does this provide evidence for the existence of a composite object?  
     - *Shared consideration:* Both agree that functional unity is observable and important for engineering, but disagree on its ontological implications.  
     - *Universalist prediction:* Functional unity is a strong indicator of composition and cannot be fully explained without positing a composite.  
     - *Nihilist prediction:* Functional unity can be fully explained by the interactions of the parts, with no need for a composite object.  
     - *Who moves if wrong:* If functional unity cannot be explained without composites, the nihilist might accept composites in unified systems. If it can be explained without, the universalist might restrict composition.  

  4. **Crux C4: Is the life-based view a viable alternative?**  
     - *Question:* Does the life-based view (composition only in life) provide a better account than both extremes?  
     - *Shared consideration:* Both agree that living organisms are paradigmatic examples of unity, but disagree on whether non-living composites exist.  
     - *Universalist prediction:* Life-based composition leaves out too many unified wholes (like robots) and thus cannot account for ordinary objects.  
     - *Nihilist prediction:* Life-based composition is unnecessary; even living things are just arrangements of simples.  
     - *Who moves if wrong:* If the life-based view is shown to be superior (e.g., by explaining unity better), both extremes might need revision. But both predict it will fail.  

  ### 4. Test Cases

  We analyze the six cases with three views: universalist (U), nihilist (N), life-based (L).

  - **A. Latched cluster:** Six robots bolted together, shared control, swapped units.  
    - U: There is one composite object (the cluster) in addition to the six robots (if robots are composite) or many simples.  
    - N: There are only the six robots (or simples arranged robot-wise) and no cluster object; during latching, simples are arranged cluster-wise.  
    - L: Since no life, no composite; only parts exist.  
    - Observational difference: None; all agree on the arrangement and behavior.  
    - Case quality: Good; clear functional unity without life.  

  - **B. Contact-free swarm:** Drones in formation, no physical contact.  
    - U: There is a composite swarm object.  
    - N: Only individual drones (or their parts); no swarm object.  
    - L: No life, no composite.  
    - Observational difference: None.  
    - Case quality: Good; tests whether physical connection is necessary.  

  - **C. Printed part:** Mid-build, half fused, half powder.  
    - U: There is no single composite object yet; the fused part is one object, the powder is many. (But universalism might say any arbitrary collection composes something, so there are many composites.)  
    - N: Only simples (powder particles and fused bits); no bracket object.  
    - L: No life, no composite.  
    - Observational difference: None.  
    - Case quality: Ambiguous; vagueness in composition during construction.  

  - **D. Symmetric double:** Two halves bolted, never separated.  
    - U: There is a composite satellite object.  
    - N: Only two halves (or their parts); no satellite object.  
    - L: No life, no composite.  
    - Observational difference: None.  
    - Case quality: Good; tests unity without inseparability.  

  - **E. Biohybrid:** Polymer chassis with muscle tissue, no nervous system.  
    - U: There is a composite object.  
    - N: Only chassis parts, muscle cells, etc.; no composite.  
    - L: Muscle tissue is alive, so there is a living composite organism.  
    - Observational difference: None for U and N; L might predict different behavior if "life" is defined functionally, but in this case, no nervous system so borderline for life.  
    - Case quality: Ambiguous; depends on definition of "life".  

  - **F. Software system:** Distributed control system.  
    - U: There is one composite software system.  
    - N: Only individual processes and machines; no system object.  
    - L: No life, no composite.  
    - Observational difference: None.  
    - Meta-answer: The composition question applies to non-material systems if we extend metaphysics to abstract objects, but engineering intuitions about "one system" are pragmatic and not evidence for metaphysical composites.  
    - Case quality: Good; tests non-material composition.  

  ### 5. Verbal Residue

  We judge that a portion of the dispute is merely verbal. Specifically, the disagreement over what ordinary language refers to (D2) is verbal: both sides can agree on the arrangements and behaviors, and the difference is in how to describe them ontologically. However, the core disagreement over whether composite objects exist (D1, D3) is substantive, as it affects what we take to exist in the world. Both signatories would accept this diagnosis: the universalist and nihilist both acknowledge that some aspects are verbal, but insist the existence question is genuine. There is no dissent.

  ## JSON Summary

  Now, the machine-readable JSON as specified.
