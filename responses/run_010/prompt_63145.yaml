answer: |-
  **Bottom line:** Nozick's hybrid view permits severely harming animals with complex, future-directed projects if the net utilitarian gain is sufficient, precisely *because* they lack the capacity for an overarching life plan that justifies absolute side constraints.

  **The Case:** Consider the "lacustrin," a semi-aquatic mammal. Lacustrins instinctively build elaborate, multi-generational dam-and-lodge complexes over decades. An individual lacustrin might spend its entire adult life (5-7 years) maintaining and expanding a specific section of the complex initiated by its parents, storing precise food caches for predictable winter shortages, and mastering complex water-flow manipulation using modified stones. This requires foresight months ahead, intricate learned skills, and significant effort. Suppose a human project requires flooding a valley, permanently drowning 100 lacustrin colonies (affecting ~1,000 individuals) and destroying centuries of accumulated construction. This saves significant resources, enabling a massive recreational lake benefiting 10,000 humans with substantial, long-term happiness gains. The lacustrins experience terror, drowning, and the annihilation of their life's work; the net utilitarian calculation (assuming human gains vastly outweigh lacustrin suffering/losses) is positive.

  **What the Two Halves Say:**  
  1.  **Utilitarian Half (For Animals):** Frustrating the lacustrins' projects is not inherently wrong. The immense suffering, death, and destruction of their life's work *count* negatively in the utilitarian calculus. However, if the projected happiness gains for the large number of humans demonstrably outweigh these significant animal losses (e.g., the lake creates profound, lasting joy for thousands), then flooding the valley is not only *permitted* but *required* to maximize total happiness. The lacustrins' complex, future-oriented activities and suffering are factored in, but they are outweighed.
  2.  **Side Constraint Half (For Humans Only):** Destroying the lacustrin colonies violates no side constraints. Nozick's rationale is that side constraints protect beings capable of forming and pursuing an overarching conception of their *whole* life – a chosen narrative or plan that gives their existence meaning. While lacustrins exhibit impressive, future-directed *project-like* behaviors (caching, building sections), this is driven by strong instinct and lacks the reflective, self-authored, "this is my life's story" quality humans possess. They don't conceptualize their life *as a whole* to be shaped according to a plan. Thus, the core rationale ("only life they get," "meaning through planning") doesn't apply. They lack the inviolability blocking utilitarian trade-offs.

  **Which One Should Give:** Neither half strictly "gives" within Nozick's framework; the tension is inherent. The lacustrin case highlights that the view *does* permit immense harm to creatures with sophisticated, welfare-affecting futures, purely based on net utility, precisely because the high bar for side constraints (the "overall life plan") isn't met. The intuition that destroying years of complex effort and causing mass suffering/death *should* be forbidden, regardless of human gain, challenges the adequacy of the "overall life plan" criterion for grounding inviolability. If the lacustrin's deep investment in its future-oriented activities *feels* like it should grant it stronger protection than simple utilitarianism allows, then the rationale for withholding side constraints becomes questionable. The burden lies on Nozick to defend why the specific capacity for an "overall plan" is the *only* plausible ground for inviolability strong enough to block such trade-offs.
