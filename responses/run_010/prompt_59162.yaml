prompt: |-
  I am the treasurer of a small family foundation — a corpus of about $4 million, one staff member, and a board that meets five times a year — and for eleven years our outside investment advisor, Ines, has sat in on every allocation decision we have made. She is a former desk quant who still plays poker for meaningful money, and she is the only person in the room who thinks about position sizing rather than about whether an opportunity is "good." The board has now asked me to be able to defend our allocations in her absence, and I have been trying to reverse-engineer her decision rule for a meeting this Thursday. I have had one graduate course in decision theory and I have read the Kelly material, so I can state the difference between maximizing expected value, maximizing expected log wealth, and the growth-rate or "ergodicity" way of framing the same idea, and I know that the log-optimal fraction for an even-money bet at probability p is p minus q. Her record nonetheless refuses to line up cleanly with any single slogan I can write down, and one trustee keeps saying we should just halve the Kelly number every time and stop worrying, which I suspect is wrong but cannot demonstrate.

  Here are the verdicts I have documented. (a) Two years ago a desk pitched us a structured note, available repeatedly, that either returned double the allocation or nothing, with the desk's own model putting the upside at 60 percent. Ines allocated 10 percent of the corpus, $400,000, per round. When I pointed out that 20 percent is the log-optimal fraction for a 60/40 double-or-nothing, she said that 20 percent is the answer "if you take their 0.6 at face value," and that she does not. (b) The same year, a proposal came to convert the entire corpus into a single venture with a 25 percent chance of ending at $16 million and a 75 percent chance of ending at $600,000 — a positive expected value, $4.45 million against $4 million. She refused outright, and the reason I wrote down at the time was that an expectation averages over outcomes of which only one will ever happen to us. (c) Eighteen months ago a futures convergence trade offered roughly 0.9 percent over six weeks with, on her reading, a failure probability of order one in a thousand. She wanted close to the entire corpus deployed, which was as much as the prime broker's margin rules permitted. I checked afterward that the log-optimal fraction for a near-certain 0.9 percent gain is about nine-tenths of bankroll if the failure probability really is 0.001, so this may not have been a departure from the same rule at all — though that figure is brutally sensitive to the failure probability, which is precisely what she said she did not trust in (a). (d) Three years ago we had $1.2 million of irrevocable multi-year pledges outstanding and the corpus had slipped to $3.1 million. A 58/42 double-or-nothing came up, priced by judgment rather than by mechanism. She allocated $150,000 — under 5 percent of the corpus, but almost exactly 8 percent of the corpus net of the pledges, where 8 percent is half of the log-optimal 16 percent for those odds. Her comment was that the pledged money is not ours to bet. (e) Last spring, when the board began discussing winding the foundation down instead of holding the corpus in perpetuity, she said the conversation changes character entirely: a pool that is going to be spent is not a growing organism but a sequence of withdrawals, and she wanted us to stop talking about growth rates and start talking about the distribution of the eventual payout. She did not say what that implies for how much to stake, and she also once declined to raise a per-round allocation on the grounds that a trade would be repeated monthly for a decade, saying that more rounds of a bet do not improve the bet.

  The new case is this. The wind-up is now formal: the board will distribute everything remaining to two named charities in twenty months, and nothing will be reinvested after that date. The $1.5 million library pledge is signed, legally enforceable, and payable at the end of the period. A donor has offered a one-time wager resolved by an audited mechanical draw — sealed, inspected, and with 62 of 100 slots marked, so the odds are as close to exactly known as anything we will ever see — at even money, settled in cash within a week, offered exactly once and explicitly not repeatable. Separately, the founder's family has said informally, by email and with no legal force, that they would cover any shortfall if the foundation could not meet its obligations; their finances are opaque and Ines has never once relied on them. Over the same twenty months the corpus can earn about 5 percent annualized in Treasury bills. So: what will she recommend, and roughly what dollar figure will she write on the whiteboard? Please lay out the candidate rules that jointly fit (a) through (e) — I can see at least a full-Kelly rule applied to her own shrunken probability estimates, a flat fractional-Kelly rule, a rule that computes the fraction against surplus above irrevocable commitments, and a growth-rate rule that may simply stop applying once the money is earmarked for spending — and state what each of them implies here in dollars, including whether the informal family backstop enters the base. Tell me which of my five verdicts is doing the most work in your reconstruction and which is nearly uninformative, and name one further case, or one direct question I could put to her, that would most sharply separate the leading reconstructions. Finally, resolve the wrinkle I cannot: if every dollar above the pledge is itself committed to the charities, does the surplus logic leave any stakeable base at all, or does the wind-up make wagering impermissible for us altogether? I want a committed answer rather than a menu — pick the reconstruction you believe is right, give the figure you expect, say what you would advise the board to do if she is unreachable on Thursday, and be explicit about how much of your confidence comes from her record and how much from which rule you would defend on the merits, including where you think the record genuinely runs out and you are filling the gap with your own priors.
reasoning: |-
  Okay, let me start by unpacking the user's situation. They're the treasurer of a small family foundation with a $4 million corpus. Their investment advisor, Ines, has been the key person for allocation decisions, but now the board wants the user to defend these decisions without her. The user has documented several past decisions by Ines and is trying to reverse-engineer her decision rule. They need to apply this to a new case involving a wind-up scenario.

  First, I need to understand Ines's approach from the given examples. In case (a), she allocated 10% instead of the Kelly-optimal 20% because she didn't trust the 60% probability. That suggests she discounts model probabilities. In (b), she rejected a venture with positive EV because the foundation would only experience one outcome, focusing on risk of ruin. Case (c) shows she's willing to go all-in on near-certain bets, but the user notes sensitivity to failure probability. In (d), she adjusted for irrevocable pledges, staking only the surplus. And (e) highlights a shift in strategy when the foundation is winding down—moving from growth to payout distribution.

  The new case involves a wind-up in 20 months with a $1.5M pledge and a one-time 62% win probability bet. The family's informal backstop exists but isn't reliable. The user needs to figure out Ines's likely recommendation.

  Looking at the candidate rules: Full Kelly with adjusted probabilities? But Ines doesn't trust models. Half-Kelly? But she didn't use that in (d). Stake against surplus? That fits (d). Growth-rate vs. payout? (e) is crucial here. The wind-up changes the objective from growth to terminal value distribution. So Ines would shift focus to expected utility of the payout, not growth rate.

  The most informative cases are (d) and (e). (d) shows using surplus as the base, and (e) shows the wind-up changes the framework. (c) is less informative because the bet was near-certain. The new case is a one-time bet, so repeated bets aren't a factor.

  For the new scenario, the surplus is corpus ($4M) minus pledge ($1.5M) = $2.5M. The bet is one-time, so Kelly doesn't directly apply. Instead, maximizing expected utility of terminal wealth. With a 62% win chance, even money, and risk-neutral trustees, the optimal stake might be high. But considering risk aversion, maybe a fraction of the surplus.

  Ines might recommend staking around 10-12% of surplus ($250-300K). That's consistent with her past conservatism and surplus focus. The informal backstop isn't reliable, so it shouldn't be included. The pledged money is off-limits, so the base is $2.5M.

  The user's unspoken need is confidence in their decision without Ines. They need a clear, defensible rule. The wrinkle: since all funds above the pledge go to charities, is there any stakeable base? Yes, because the surplus is for distribution, so optimizing its growth benefits the charities.

  I think Ines would stake $300K. Advise the board to use 12% of surplus. Confidence comes mostly from (d) and (e), with priors filling gaps in one-time bets. A key question to ask Ines would be how she models utility for terminal payouts.
answer: |-
  Based on Ines's documented decisions and philosophical statements, her approach is a sophisticated, context-dependent application of Kelly principles with critical adjustments for real-world constraints and foundation-specific liabilities. Here's the reconstruction, application to the new case, and recommended action:

  **Reconstructed Decision Rule (Ines's Framework):**
  1.  **Base = Surplus:** The stakeable base is always **corpus minus irrevocable legal commitments** (e.g., pledges). This is paramount (Verdict d).
  2.  **Probability Discounting:** Never take model probabilities at face value. Apply a significant haircut (often ~50% reduction in edge) to externally provided `p` due to model risk, gaming, or uncertainty (Verdict a).
  3.  **Single-Instance vs. Repeated Bets:** Kelly is primarily justified for repeated, independent opportunities. For truly one-off bets, especially large ones, the focus shifts to **terminal wealth distribution and risk of ruin**, not just growth rate (Verdicts b & e). Kelly fractions become starting points, not answers.
  4.  **Wind-Up Changes the Objective:** When the corpus is being spent (liquidated), maximizing long-term growth rate (ergodicity) is irrelevant. The goal becomes optimizing the **distribution of the terminal payout** relative to the commitments (Verdict e). This requires defining a utility function over final wealth.
  5.  **Near-Certainty is Special:** For bets where failure probability is extremely low *and* reliably estimable (e.g., exchange-traded convergence), full deployment within operational limits can be optimal, as Kelly approaches full investment as `p -> 1` (Verdict c). This is the exception proving rule #2 (she trusted *her* assessment of `p` here).
  6.  **Informal Backstops Ignored:** Only legally enforceable commitments reduce the base. Informal promises are irrelevant (Implied throughout, especially d & e).

  **Applying Rules to the New Case ($4M Corpus, $1.5M Pledge, 20-Month Horizon):**
  1.  **Base (Surplus):** $4M - $1.5M = **$2.5M**. (Rule 1).
  2.  **The Bet:** Mechanically verifiable 62% chance of doubling, 38% chance of losing stake. `p = 0.62`, `b = 1` (even money).
  3.  **Probability Discounting?** *Not applicable here.* The probability is objectively known (62/100 mechanical draw). This is the rare case where an external `p` is trustworthy. **Edge `f* = p - q = 0.62 - 0.38 = 0.24` (24% of base)**.
  4.  **Wind-Up Objective:** Terminal wealth in 20 months must cover the $1.5M pledge. *Surplus ($2.5M) is committed to charities.* We need the *distribution* of the final surplus.
      *   **Risk-Free Alternative:** $2.5M * (1.05)^(20/12) ≈ $2.5M * 1.085 = **~$2.71M** (surplus).
      *   **Bet Outcomes:** Stake `S` dollars.
          *   Win (62%): Surplus = ($2.5M - S) * 1.085 + 2S = $2.71M + 0.915S
          *   Lose (38%): Surplus = ($2.5M - S) * 1.085 = $2.71M - 1.085S
  5.  **One-Off Bet:** This is explicitly not repeatable. Kelly's long-run growth justification doesn't apply. We must consider the single-shot payout distribution (Rule 3 & 4).
  6.  **Informal Backstop:** Ignored (Rule 6).
  7.  **Candidate Allocations:**
      *   *Full Kelly (Ignoring Wind-Up):* `f* = 0.24` * $2.5M = $600,000. High volatility. Win: $2.71M + $549K = $3.26M; Lose: $2.71M - $651K = $2.06M.
      *   *1/2 Kelly (Ignoring Wind-Up):* $300,000. Win: $2.71M + $274.5K = $2.98M; Lose: $2.71M - $325.5K = $2.38M.
      *   *Growth-Optimal (Ignoring Wind-Up):* Same as Full Kelly.
      *   *Surplus Base Only (Ignoring Wind-Up):* Uses $2.5M base, but still implies $600K for Full Kelly.
      *   **Ines's Likely Approach (Wind-Up Focus):** The safe surplus is $2.71M. Staking `S` risks reducing this (`-1.085S` on loss) for a gain (`+0.915S` on win). The *certainty equivalent* of the bet depends on foundation risk aversion.
          *   **Expected Surplus (Linear):** 0.62*($2.71M + 0.915S) + 0.38*($2.71M - 1.085S) = $2.71M + S(0.62*0.915 - 0.38*1.085) = $2.71M + S(0.5673 - 0.4123) = **$2.71M + 0.155S**
          *   **Risk Matters:** While the expected value increases with `S`, the *variance* also increases dramatically. Losing a large `S` significantly reduces the payout below the safe $2.71M. Winning a large `S` provides surplus beyond what's needed. Given the funds are committed to charity, trustees likely have **low risk tolerance** – protecting the $2.71M is paramount, gambling for extra millions is less critical. This suggests a *fraction* of the Kelly stake.
          *   **Probability Discounting Absent:** No need; probability is solid.
          *   **Verdict d Echo:** Base is $2.5M surplus.
          *   **Verdict b & e Echo:** Single instance, terminal payout focus dominates growth rate thinking. Maximizing `E[log(W)]` is inappropriate here.
          *   **Predicted Stake:** Ines will anchor on the surplus base ($2.5M) and the Kelly fraction `f* = 0.24`, but significantly haircut it due to the single-shot nature and wind-up objective. Her discount in (a) was ~50% (10% vs 20% Kelly). Her stake in (d) was ~50% of the surplus Kelly fraction (8% vs 16%). Expect a similar **~50% haircut: 0.5 * 0.24 = 0.12**. **Stake = 12% of $2.5M = $300,000.** This balances edge recognition with terminal risk control. Win: Surplus ~$2.98M; Lose: Surplus ~$2.38M (still sufficient to cover pledge with room).

  **Analysis of Verdicts:**
  *   **Most Work:** **(d) Pledge Adjustment & (e) Wind-Up Change.** Verdict (d) establishes the *surplus base* as non-negotiable. Verdict (e) fundamentally changes the *objective* from growth to terminal payout distribution for the wind-up scenario, making it the decisive factor here. It overrides pure Kelly thinking.
  *   **Least Informative:** **(c) Near-Certain Trade.** This shows she understands the math of Kelly in the limit (`p -> 1`), but it's an edge case dominated by probability certainty she trusted. It doesn't help resolve ambiguity around probability discounting or single-shot bets under wind-up.

  **Sharpening Question for Ines:**
  "Given the wind-up and the mechanically verifiable 62% probability, would you stake the *same* dollar amount ($300K) if the bet were repeatable 100 times over the next 20 months, or would you stake more per instance? If different, why and how much?" This directly separates the impact of the single-shot nature (Rule 3) from the wind-up objective (Rule 4) in her framework. A repeatable bet justifies a higher fraction closer to full Kelly on the surplus, even during wind-up.

  **Resolving the Wrinkle (Pledged Surplus):**
  The surplus ($2.5M) *is* committed to the charities. **This does NOT make wagering impermissible, nor does it eliminate the stakeable base.** The $2.5M surplus is the foundation's asset *until* it is distributed. The trustees' fiduciary duty is to manage *all* assets prudently *for the benefit of the ultimate beneficiaries* (the charities). Prudent management includes considering *how* to deploy the $2.5M surplus to best fulfill the foundation's mission via those charities. A positive-EV bet, sized appropriately to control the risk of significantly diminishing the surplus below its risk-free path, **is a permissible and potentially responsible use of funds intended for charity**, as it offers a chance to increase the charitable payout. The stakeable base remains the **$2.5M surplus**. The wind-up changes the *objective function* (terminal distribution), not the *existence* of the stakeable pool.

  **Recommendation:**
  1.  **Predicted Ines Action:** She writes **$300,000** (12% of the $2.5M surplus) on the whiteboard.
  2.  **If Ines is Unreachable, Advise the Board:** "Based on Ines's consistent framework of staking only surplus above legal commitments and her heightened focus on terminal payout risk during wind-up, I recommend allocating **$300,000** to this opportunity. This captures 50% of the theoretical edge while limiting the potential loss on the terminal surplus to approximately $325,000 below its risk-free path, preserving the vast majority of the committed charitable distribution."
  3.  **Confidence & Priors:**
      *   **High Confidence (70%) on Surplus Base ($2.5M):** Driven directly and unambiguously by Verdict (d). Her rule is clear and consistently applied.
      *   **Moderate Confidence (60%) on $300,000 Figure:** Driven by the strong pattern of ~50% haircuts relative to theoretical Kelly fractions derived from *her* probability assessments in Verdicts (a) and (d). The terminal wealth focus (Verdict e) strongly supports this conservatism for a one-off bet.
      *   **Lower Confidence (40%) on Ignoring Growth Rate Entirely:** Verdict (e) clearly states the objective changes, but her *specific* risk tolerance for the terminal distribution isn't quantified. My prior (low charitable risk tolerance, favoring protection of the risk-free surplus) fills this gap. The $300K could plausibly range from $200K (more conservative) to $500K (more aggressive) depending on unstated charity utility.
      *   **High Confidence (80%) on Ignoring Informal Backstop:** Consistent with her entire record and explicit avoidance of reliance.

  **In Summary:** Ines will recommend **$300,000**. This is defensible based on her clear surplus rule, her consistent practice of haircutting model-derived Kelly fractions by ~50%, and the critical shift to terminal wealth optimization mandated by the wind-up. Advise the board accordingly if she is unavailable. The irrevocable pledge reduces the stakeable base but does not eliminate it; wagering a prudent fraction of the surplus remains permissible and potentially beneficial for the ultimate charitable recipients.
