prompt: |-
  I am a liaison psychiatrist, and a growing share of my capacity assessments involve older adults whose everyday thinking is carried partly by things outside their heads: a notebook maintained for thirty years, a phone that prompts every medication and appointment, a spouse who supplies the missing words. The statutory test I work to has four limbs — the person must understand, retain, weigh, and communicate information relevant to the decision — but my service assesses those limbs as though they measured internal machinery alone: we take aids out of the room, and we score a relative's prompting as contamination rather than as part of the cognitive system being tested.

  Please convert the extended mind thesis, and the parity principle at its core, into a procedure my team can run inside a forty-five-minute assessment by clinicians with no philosophy training. I want the questions asked in order, what counts as a sufficient answer to each, which external supports are to be treated as constituents of the person's cognition for assessment purposes and which are merely aids they could do without, and how to treat supports that are unreliable, absent overnight, or controlled by someone with an interest in the outcome. Mark the steps that are judgment calls dressed as procedure, and say plainly where the thesis runs out — in particular, whether any criterion can be applied to a human partner without the boundary of the mind dissolving altogether.

  Then run it on two cases: a retired engineer who cannot reproduce a single date, name, or commitment without his notebook, and who uses it competently and unthinkingly; and a woman with early-stage dementia whose husband answers most questions before she can, and whose own answers improve markedly when he leaves the room. Give me a procedure I could defend to a tribunal, and tell me where it will misfire.
reasoning: |-
  We are going to design a procedure based on the extended mind thesis (EMT) and the parity principle. The core idea is that if a resource (like a notebook, phone, or spouse) functions in a way that is equivalent to an internal cognitive process, then it should be considered part of the cognitive system. However, we must be cautious about boundaries, especially when dealing with human partners.

  The procedure must fit in 45 minutes and be usable by clinicians without philosophy training. We will break it down into steps.

  ### Key Principles from EMT and Parity
  1. **Parity Principle**: If an external resource plays a role that, if done internally, we would have no hesitation in accepting as part of a cognitive process, then it should be considered part of the cognitive process.
  2. **Reliability and Trust**: The resource must be reliably available and typically trusted by the person to function without question.
  3. **Accessibility**: The resource should be easily accessible to the person during the assessment, unless there are specific concerns (e.g., coercion).

  ### Procedure Outline
  We will structure the assessment into four parts, corresponding to the four limbs of the statutory test: understand, retain, weigh, and communicate. For each limb, we will:
  - Assess without aids (as a baseline, but not to exclude the extended mind).
  - Then, with the aid that the person normally uses, if it is considered part of their cognitive system.
  - We will determine which external supports count as constituents and which are merely aids.

  #### Step 0: Pre-assessment (5 minutes)
  - Explain to the person and any accompanying person (e.g., spouse) the purpose of the assessment and the role of external aids.
  - Ask the person: "What do you normally use to help you remember things or make decisions? (e.g., notebook, phone, spouse)"
  - Determine which resources are routinely used and relied upon. Also, note if the resource is readily available and under the person's control.

  **Criteria for an external resource to be considered a constituent of cognition (part of the extended mind):**
     - **Consistency**: The resource is routinely used in the person's everyday cognitive tasks.
     - **Automaticity**: The person uses the resource without conscious effort, as if it were an extension of their own mind.
     - **Reliability**: The resource is generally dependable and the person trusts it without question.
     - **Accessibility**: The resource is readily available to the person when needed (with exceptions for temporary unavailability, e.g., overnight, if the resource is typically available during waking hours).

  **Resources that are merely aids (not part of extended mind):**
     - Those that the person uses sporadically or with conscious effort.
     - Resources that are not routinely incorporated into the cognitive process (e.g., occasional reminders from a neighbor).

  **Special Case: Human Partners**
     - A human partner (like a spouse) may be considered part of the extended mind if the interaction is so seamless and automatic that it functions as a coupled system. However, we must be cautious because:
          - The partner might have their own interests and biases.
          - The partner might be doing more than just extending cognition (e.g., making decisions for the person).
     - We will assess the degree of integration and the potential for undue influence.

  #### Step 1: Understand (10 minutes)
  - **Without aids**: Ask the person to explain in their own words the information relevant to the decision (e.g., "What is the decision about?"). This is to establish baseline.
  - **With aids**: Allow the person to use their external resource (if deemed a constituent) and ask the same. Also, observe whether the resource helps in understanding or merely recalls information.

  **Sufficient answer**: The person can explain the key facts, options, and consequences. If using a resource, they should be able to use it to support their understanding (e.g., reading from a notebook and explaining what it means).

  #### Step 2: Retain (10 minutes)
  - **Without aids**: Ask the person to hold in mind the key information for a short period (e.g., 5 minutes) and then recall it without the resource.
  - **With aids**: Allow the resource to be present during the retention interval and at recall. The resource should be one that the person normally uses for retention.

  **Sufficient answer**: The person can retain the information for long enough to use it in decision-making. With the resource, they can access the information when needed.

  #### Step 3: Weigh (10 minutes)
  - **Without aids**: Ask the person to discuss the pros and cons of the options. Observe if they can manipulate the information internally.
  - **With aids**: Allow the resource and observe how they use it to weigh. They might refer to notes about previous experiences, pros/cons they have written, or discuss with a partner.

  **Sufficient answer**: The person can consider the advantages and disadvantages of each option and express a reasoned preference.

  #### Step 4: Communicate (5 minutes)
  - **Without aids**: Ask the person to communicate their decision and the reasons for it.
  - **With aids**: Allow the resource (if it is part of their communication process, e.g., a communication board or a partner who helps articulate).

  **Sufficient answer**: The person can express their decision and the reasons clearly, either verbally, in writing, or with the help of an external resource that is part of their cognitive system.

  ### Special Considerations
  1. **Unreliable Resources**: If a resource is unreliable (e.g., a notebook with errors, a phone that often breaks), then it cannot be considered a reliable part of cognition. The assessment must note this and possibly discount it.
  2. **Absence Overnight**: If a resource is not available overnight but the decision does not require overnight retention, then it may still be included. For decisions requiring continuous access (e.g., medication at night), the absence might be a problem.
  3. **Controlled by Someone Else**: If a resource (especially a human partner) is controlled by someone with an interest in the outcome, then we must assess for undue influence. This might disqualify the resource as part of the extended mind if the person is not in control. We might test without the partner and see if the person's cognition collapses.

  ### Judgment Calls Dressed as Procedure
  - **Determining Constituent vs. Aid**: This is inherently a judgment call. We use the criteria (consistency, automaticity, reliability, accessibility) but they are not black-and-white.
  - **Human Partners**: The boundary is especially fuzzy. We might say the partner is part of the extended mind only if the interaction is so integrated that without the partner, the person's cognitive abilities are significantly impaired, and the partner does not introduce bias. But if the partner is answering for the person, that might be overreach.

  ### Where the Thesis Runs Out
  The extended mind thesis becomes problematic when applied to human partners because:
     - The partner has their own mind and agency, which may not align with the patient's.
     - It is difficult to disentangle the patient's cognition from the partner's, especially if the partner is dominating.
     - The risk of undue influence is high. In such cases, we might have to assess the patient alone and then with the partner, but the partner's role might be considered an aid rather than part of the patient's mind.

  ### Applying the Procedure to Cases

  #### Case 1: Retired Engineer with Notebook
  - **Step 0**: The notebook is used for 30 years, competently and unthinkingly. It is consistent, automatic, reliable, and accessible. We consider it part of his extended mind.
  - **Understand**: Without notebook, he may not recall details. With notebook, he can read and explain the decision. Sufficient.
  - **Retain**: Without notebook, he might not retain. With notebook, he can refer to it. Since the notebook is always with him, he can retain by accessing it. Sufficient.
  - **Weigh**: He might use the notebook to record pros/cons. He can weigh by referring to his notes. Sufficient.
  - **Communicate**: He can communicate using the notebook. Sufficient.
  - **Conclusion**: He has capacity with the notebook. Without it, he might not, but the notebook is part of his cognitive system.

  #### Case 2: Woman with Early Dementia and Husband
  - **Step 0**: The husband answers most questions. We must determine if he is part of her extended mind or if he is dominating. We note her answers improve when he leaves the room. This suggests that without him, she can think better, but with him, she might be interrupted or he might be answering for her. This does not meet the automaticity and reliability criteria in a way that is integrated with her cognition. Instead, it might be that his presence is disruptive. Therefore, we do not consider him as part of her extended mind. He is an aid at best, but one that might be interfering.
  - **Assessment without husband**: She performs better. We do the entire assessment without him.
  - **Understand**: Without husband, she can understand? We test and find she can. Sufficient.
  - **Retain**: Without husband, she might have difficulty. We test: ask her to retain information for 5 minutes. If she can, sufficient. If not, then we must see if she uses another resource (e.g., a notebook) that is part of her extended mind. If she doesn't have one, then she might fail retention.
  - **Weigh and Communicate**: Similarly, without husband, we assess.
  - **Conclusion**: If she can perform the tasks without him (or with a non-human resource that is part of her extended mind), then she has capacity. If she cannot, then she might lack capacity. The husband's role is not considered part of her mind because it does not meet the criteria (especially automaticity and reliability without domination).

  ### Defending to a Tribunal
  - The procedure is based on the extended mind thesis, which argues that cognitive processes can extend beyond the brain.
  - We have clear criteria for when an external resource counts as part of the mind: routine use, automatic, reliable, accessible.
  - We have safeguards against undue influence, especially with human partners.
  - We test both with and without the resource to establish the baseline and the role of the resource.

  ### Where it Might Misfire
  - If the person is overly reliant on an unreliable resource, we might incorrectly include it.
  - With human partners, it's hard to draw the line. If the tribunal is conservative, they may reject the extended mind for humans.
  - In high-stakes decisions, the tribunal might require internal capacity only.

  ### Final Procedure Steps (45 minutes)

  1. **Pre-assessment (5 min)**:
     - Identify external resources and assess against criteria (consistency, automaticity, reliability, accessibility). 
     - For human partners, note if they are answering for the person or if the interaction is seamless. If not, exclude from the extended mind and test without.

  2. **Understand (10 min)**:
     - Without resource: "Can you explain the decision in your own words?"
     - With resource (if deemed constituent): "Now, using your usual aids, can you explain the decision?"
     - Sufficient: Explanation of key elements.

  3. **Retain (10 min)**:
     - Without resource: Give key information, distract for 5 minutes, then ask to recall.
     - With resource: Allow resource during retention and recall (if constituent).
     - Sufficient: Recalling the information (with resource, if allowed) when needed.

  4. **Weigh (10 min)**:
     - Without resource: Discuss pros and cons.
     - With resource: Use resource to help weigh.
     - Sufficient: Able to discuss advantages and disadvantages and express a preference.

  5. **Communicate (5 min)**:
     - Without resource: Ask for decision and reasons.
     - With resource: Allow resource for communication (if constituent).
     - Sufficient: Clear expression of decision and reasons.

  6. **Finalize (5 min)**:
     - Determine if the person meets all four limbs with their extended cognitive system (if the resources are constituents and available). If a resource is not available when needed for the decision, then it cannot be relied upon.

  **Reporting**: State which resources were considered part of the extended mind and why. Note any concerns about reliability or undue influence.

  This procedure allows for the inclusion of external resources when they function as part of the person's cognitive system, while maintaining rigor and defensibility.
answer: |-
  Below is a practical, step-by-step procedure for integrating the extended mind thesis (EMT) and its core "parity principle" into capacity assessments. The parity principle states: **If an external resource functions in the same way as an internal cognitive process (e.g., memory, reasoning), and is seamlessly integrated into the person's problem-solving, it should be considered part of their cognitive system.** This procedure adapts EMT for clinical use, focusing on your statutory test's four limbs (understanding, retaining, weighing, communicating). It includes safeguards for reliability, bias, and human partners, and can be completed in 45 minutes by non-philosophers. 

  I'll first outline the procedure, then apply it to your two cases. Key features:
  - **External supports as constituents**: Resources are treated as part of cognition if they are **consistently relied upon, automatic, trustworthy, and person-controlled**.
  - **Mere aids**: Resources are excluded if they are **sporadic, effortful, unreliable, or controlled by others**.
  - **Human partners**: Treated cautiously—integration must be so seamless that the partner acts as a "cognitive extension," not a director. Boundaries are tested rigorously to avoid "mind dissolution."
  - **Judgment calls**: Marked as **"JC"**—these are subjective but structured to reduce arbitrariness.
  - **EMT limits**: EMT struggles with human partners due to risks of bias/coercion, and when resources are absent/unreliable. I'll note where the thesis "runs out."

  ---

  ### **Procedure: Extended Mind Capacity Assessment (45 Minutes)**  
  **Goal**: Assess capacity by testing the person *with* their integrated external supports, not just "internal" cognition.  

  #### **Step 0: Identify Constituents vs. Aids (5 minutes)**  
  **Actions**:  
  1. Ask the person: *"What tools or people do you use daily to remember things, make decisions, or manage tasks? Show me how you use them."*  
  2. Observe: Is the resource used automatically (without hesitation)? Is it trusted like "biological memory" (e.g., referenced without doubt)?  
  3. Classify supports:  
     - **Constituent (part of cognition)**: Must be **ALL** of:  
       - **Consistent**: Used routinely for this decision/domain (e.g., a 30-year notebook for appointments).  
       - **Automatic**: Accessed effortlessly (e.g., flipping to a notebook page without prompting).  
       - **Trustworthy**: Historically reliable (e.g., phone alerts rarely fail).  
       - **Person-controlled**: Directly accessible/controlled by the person (e.g., spouse only "fills gaps," not dominates).  
     - **Mere aid (not part of cognition)**: **ANY** of:  
       - Sporadic use (e.g., occasional lists).  
       - Requires effort (e.g., needs instructions to use).  
       - Unreliable (e.g., phone crashes often).  
       - Controlled by others with a stake in the outcome (e.g., spouse answers *for* them).  
  4. **JC**: Deciding "automatic" vs. "effortful." Use cues: Does the person pause to "search" internally when the resource is removed? If yes, it may be a constituent.  

  #### **Step 1: Understand Relevant Information (10 minutes)**  
  **Test**: *"Explain [decision, e.g., moving to a care home] in your own words. What are the key facts?"*  
  - **Without supports**: Ask first without any aids (baseline).  
  - **With supports**: Re-ask using constituents (e.g., notebook, spouse).  
  **Sufficient answer**: Accurately describes >50% of key facts (e.g., "It involves 24-hour care," "I’d sell my house").  
  **JC**: Is the support *enabling understanding* (constituent) or *replacing it* (aid)? (e.g., Notebook user explains entries → constituent; Spouse paraphrases for them → aid).  

  #### **Step 2: Retain Information (10 minutes)**  
  **Test**: *"Repeat back the key facts about [decision] after a 2-minute delay."*  
  - **Without supports**: No aids during delay.  
  - **With supports**: Constituents available during delay/response (e.g., notebook open).  
  **Sufficient answer**: Recalls >50% of facts after delay. Supports must be:  
    - **Available when needed**: If absent overnight/in crisis, test without them.  
    - **Reliable**: If error-prone (e.g., notebook has wrong dates), discount them.  
  **JC**: Is retention "extended" (e.g., notebook as memory) or a "crutch" (e.g., spouse whispering answers)?  

  #### **Step 3: Weigh Information (10 minutes)**  
  **Test**: *"What are the pros/cons of [options]? How do you feel about them?"*  
  - **Without supports**: No aids.  
  - **With supports**: Constituents available (e.g., notebook with past notes, spouse for context).  
  **Sufficient answer**: Identifies ≥1 pro/con per option and expresses a preference (e.g., "Care home is safer but I’ll miss my garden").  
  **Human partners**: Only allow if they provide *facts* (e.g., "Last year you fell") not *opinions* (e.g., "You should move").  
  **JC**: Is the person weighing *independently*? If spouse dominates, test alone.  

  #### **Step 4: Communicate Decision (5 minutes)**  
  **Test**: *"What is your decision, and why?"*  
  - **Without supports**: No aids.  
  - **With supports**: Constituents for expression (e.g., notebook to point, spouse to clarify words).  
  **Sufficient answer**: Clear choice with rationale (e.g., "I’ll move because I’m lonely").  
  **JC**: Is communication *aided* (e.g., spouse supplies missing words → constituent) or *controlled* (e.g., spouse interrupts → aid)?  

  #### **Final Scoring (5 minutes)**  
  - **Capacity**: Pass if sufficient on **all 4 limbs WITH constituents** (if available/reliable).  
  - **Fail if**:  
    - Insufficient WITH constituents, OR  
    - Constituents are unreliable/absent when critical (e.g., spouse unavailable overnight for emergency decisions).  
  - **Document**: Why each support is constituent/aid, and how biases were managed.  

  ---

  ### **Where EMT Runs Out (and Defensibility)**  
  - **Human partners**: EMT risks "mind dissolution" if the partner’s role isn’t bounded. **Solution**: Treat partners as constituents **ONLY** if:  
    - They are a "cueing system" (e.g., spouse *prompts* "What did the doctor say?" not *answers*).  
    - No conflict of interest (test with/without them; if cognition collapses without bias, they may be constituent).  
    - **EMT limit**: If the partner has a stake (e.g., carer stress), they are **always a mere aid**—EMT cannot resolve coercion risks.  
  - **Unreliable/absent supports**: If resources fail >25% of the time or are inaccessible when needed (e.g., overnight), they are aids. Capacity requires testing without them.  
  - **Defensibility**: This is legally defensible as it:  
    - Aligns with statutes by testing "functional ability" (how the person *actually* decides).  
    - Uses objective criteria (consistency, reliability) for supports.  
    - Addresses bias (e.g., excluding influenced partners).  
  - **Misfires**:  
    - **False positives**: If constituents are overestimated (e.g., a manipulative spouse included). Mitigation: Test without supports.  
    - **False negatives**: If EMT is rejected by tribunals focused on "internal" capacity. Mitigation: Cite real-world functioning (e.g., "Notebook user manages finances safely").  
    - **Complex cases**: Where supports are partially reliable (e.g., dementia patient’s sporadic notebook use). **JC** here may be challenged.  

  ---

  ### **Case Applications**  
  #### **Case 1: Retired Engineer with Notebook**  
  - **Step 0**: Notebook is **constituent** (consistent 30-year use, automatic, trustworthy, controlled by him).  
  - **Step 1 (Understand)**: Without notebook, he recalls little. With it, he reads dates/commitments accurately → **Sufficient with constituent**.  
  - **Step 2 (Retain)**: Without notebook, he retains <50%. With it, he "retains" by referencing → **Sufficient** (notebook is always accessible).  
  - **Step 3 (Weigh)**: Without notebook, he struggles. With it, he compares past notes (e.g., "I declined surgery last year") → **Sufficient**.  
  - **Step 4 (Communicate)**: Uses notebook to confirm details → **Sufficient**.  
  - **Capacity**: **Yes** (passes all limbs with constituent). Tribunal defense: "His cognition functionally includes the notebook, enabling autonomous decisions."  

  #### **Case 2: Woman with Dementia; Husband Answers**  
  - **Step 0**: Husband is **mere aid** (he answers *for* her; her cognition *improves* alone → not automatic/integrated). Test without him.  
  - **Step 1 (Understand)**: Without husband, she explains decision basics (e.g., "It’s about my medication") → **Sufficient**.  
  - **Step 2 (Retain)**: Without husband, she retains <50% after delay → **Insufficient** (fails retention).  
  - **Step 3 (Weigh)**: Without husband, she identifies pros/cons (e.g., "Pills help my pain but make me dizzy") → **Sufficient**.  
  - **Step 4 (Communicate)**: Expresses clear preference (e.g., "I’ll take pills but lower dose") → **Sufficient**.  
  - **Capacity**: **No** (fails retention). Tribunal defense: "Husband is not a constituent (dominates responses); without him, retention is impaired. No reliable external support compensates."  
  - **EMT limit**: Husband could not be "constituent" due to bias risk (answers first) and her improved solo performance.  

  ---  
  This procedure enhances ecological validity while setting clear boundaries to prevent overextension. It will misfire if tribunals reject EMT, so emphasize functional outcomes: *"Capacity is decision-making in the real world, not in a clinical vacuum."* Training staff on the parity principle (e.g., "If the notebook were a brain region, would we accept its use?") can aid consistency.
