    - By avoiding LPO and LLPO, we maintain the computational content of the proofs.
    - By requiring explicit declaration of every non-constructive axiom, we keep track of the dependencies.

  Final Triage Procedure (ordered steps):

    1. **Check DNS of conclusion**:
          - If the conclusion is stable, mark as "might be provable by negative translation" and go to step 4.
          - If not, note that the conclusion might need to be restated.

    2. **Examine the proof for non-constructive case splits**:
          - Look for any case split on a predicate that is not known to be decidable (e.g., equality of two reals, or an arbitrary disjunction). 
          - If found, then we try to see if the predicate can be made decidable by hypothesis. If so, then outcome: port with the hypothesis that the predicate is decidable (or the reals are located, if applicable). 
          - If not, and if the split is essential, then we might need to restate the theorem or add an axiom for excluded middle for that predicate. But we avoid adding axioms for excluded middle for real predicates.

    3. **Check for doubly negated existentials**:
          - If the proof ends with a double negation of an existential and the predicate is decidable, then we can use Markov's principle. Outcome: add Markov's principle for that predicate (if allowed) or restate the conclusion as the double negation (if that is acceptable). 
          - If the predicate is not decidable, then restate the theorem approximately (if possible).

    4. **Apply the negative translation**:
          - If the conclusion is stable, then we can attempt to prove the double negation of the entire theorem constructively. However, this might require that all lemmas in the proof are stable. If we can see that the proof uses only stable lemmas, then we can port as stated (because the negative translation will go through). 
          - If the proof uses non-stable lemmas, then we might need to reprove them under negative translation? This is complex and might escalate.

    5. **Check for LPO/LLPO**:
          - If the proof uses a step that is equivalent to LPO or LLPO, then we must restate approximately or add the principle (but we ban these by default).

    6. **If the theorem is an existence statement and we cannot get a witness**:
          - Restate approximately: replace the exact existence by an epsilon-version.

    7. **If we still haven't resolved, and the proof is complex or uses choice**:
          - If the proof uses countable choice, then we may allow it with an explicit declaration (if we decide to allow countable choice). 
          - Otherwise, escalate.

  The procedure should be run with the understanding that it is a heuristic and might require escalation. 

  For the three examples:

    - IVT: 
          Step 1: Conclusion not stable -> step 2: case split on sign -> not decidable -> step 6: restate approximately.
          Outcome: restate approximately.

    - Every real nonnegative or nonpositive:
          Step 1: Disjunction not stable -> step 2: no case split in a proof? Actually, the statement itself is the case split. We recognize it as LLPO -> step 5: requires LLPO -> but we ban LLPO -> step 6: restate approximately? But how? We escalate because it's a foundational decision.
          Outcome: escalate.

    - Bolzano–Weierstrass:
          Step 1: Conclusion not stable -> step 2: case split on which half has infinitely many points -> not decidable -> step 6: restate approximately? We tried but couldn't find an obvious one -> step 7: we see that the classical proof uses a case split that requires LPO -> step 5: it's equivalent to LPO -> we ban LPO -> so we restate the theorem as: every bounded sequence has a Cauchy subsequence? But that might require additional principles. 
          Alternatively, we know that it is not constructively provable. Therefore, we restate: every bounded sequence has a cluster point (and if we want a subsequence, we need countable choice). But the cluster point existence also requires LPO? 
          We decide to escalate because the constructive alternatives are complex.

  Final note: 
    - The procedure cannot catch principles smuggled in through definitions. For example, if a definition uses excluded middle (like defining the absolute value by cases on the sign), then the definition is non-constructive. We assume that the library has constructive definitions. Therefore, we must audit the definitions separately.

  We hope this procedure helps the students to make consistent decisions.
answer: |-
  Below is the triage procedure designed for your formalization project, optimized for under 30 minutes per theorem. It consists of 7 sequential tests, each with clear pass/fail criteria and outcomes. The procedure prioritizes efficiency by focusing on syntactic patterns and common non-constructive pitfalls, avoiding deep proof transformations. I've adopted **Cauchy reals** as the default (with a modulus of convergence) and banned unrestricted choice and full excluded middle (EM). Markov's Principle (MP) and limited excluded middle (e.g., for rational comparisons) are permitted behind a flag. The goal is to enforce consistency without requiring foundational expertise.

  ---

  ### **Triage Procedure**  
  **Input**: A theorem statement and its classical proof sketch.  
  **Output**: One of:  
  - **A**: Port as stated (constructively valid).  
  - **B**: Port with strengthened hypothesis (decidability/locatedness).  
  - **C**: Restate approximately (ε-version).  
  - **D**: Add a named axiom (EM/MP/LPO/etc. for specific predicates).  
  - **ESCALATE**: To you (architectural commitment needed).  

  #### **Step 1: Conclusion Stability Under Double Negation**  
  - **Test**: Is the conclusion syntactically stable? (i.e., Does `~~P → P` hold for conclusion `P`?)  
  - **Stable forms**: `¬Q`, `∀x, P(x)`, `P → Q`, `x ≤ y` (or other stable atomic relations), `~~∃` if `∃` is not required.  
  - **Unstable forms**: `∃x, P(x)`, `A ∨ B`, `x = y` (for reals), `¬¬P` (if `P` is not already stable).  
  - **Settled answer**:  
    - Pass (stable): Proceed to Step 2.  
    - Fail (unstable): Proceed to Step 3.  
  - **Time**: 2–3 minutes (syntax check).  

  #### **Step 2: Case Splits on Undecidable Predicates**  
  - **Test**: Scan the proof for case splits (`if P then Q else R`) where `P` is not provably decidable.  
  - **Decidable predicates**: Rational inequalities (`q < r`), boolean values, concrete disjunctions with EM axioms already declared.  
  - **Undecidable predicates**: Real inequalities (`x < y`), `x = 0`, `∀n, P(n)` (unless recursive), unconstrained `∃`.  
  - **Settled answer**:  
    - Pass (no undecidable splits): Proceed to Step 4.  
    - Fail (undecidable split found): If the split predicate is isolated, output **B** (add decidability hypothesis, e.g., `[DiscretePred P]`). If not, proceed to Step 5.  
  - **Judgment call**: Whether the split is "isolated" depends on if it's a single lemma. If pervasive, **ESCALATE**.  
  - **Time**: 5 minutes (proof scan).  

  #### **Step 3: Witness Extraction from `~~∃x, P(x)`**  
  - **Test**: Does the proof end with a double-negated existential (`~~∃x, P(x)`) without constructing a witness?  
  - **Settled answer**:  
    - Pass (no `~~∃`): Proceed to Step 4.  
    - Fail (`~~∃` found): If `P` is decidable (e.g., algebraic on rationals), output **D** (add `MP`). If `P` is undecidable (e.g., real equality), output **C** (restate as `∀ε>0, ∃x, |f(x)| < ε`).  
  - **Time**: 3 minutes (check last proof step).  

  #### **Step 4: Negative Translation Feasibility**  
  - **Test**: Is the conclusion stable (Step 1 pass) and the proof free of disjunction/existential goals?  
  - **Settled answer**:  
    - Pass: Output **A** (port as stated; negative translation will work).  
    - Fail: Proceed to Step 5.  
  - **Time**: 1 minute (reuse Step 1 result).  

  #### **Step 5: Markov’s Principle (MP) Applicability**  
  - **Test**: Is there a subgoal `¬∀n, Q(n)` where `Q` is decidable and quantifier-free? (e.g., `¬∀n, |a_n| > ε`).  
  - **Settled answer**:  
    - Pass: Output **D** (add `MP`).  
    - Fail: Proceed to Step 6.  
  - **Time**: 2 minutes (scan for negated universals).  

  #### **Step 6: Limited Principles of Omniscience (LPO/LLPO)**  
  - **Test**: Does the proof use:  
    - `LPO`: `∀f : ℕ → {0,1}, (∃n, f(n)=1) ∨ (∀n, f(n)=0)`?  
    - `LLPO`: `∀x,y ∈ ℝ, (x ≤ y) ∨ (y ≤ x)`?  
  - **Settled answer**:  
    - Pass (LPO/LLPO detected): **ESCALATE** (foundational choice; we ban these outright).  
    - Fail: Proceed to Step 7.  
  - **Time**: 3 minutes (match against LPO/LLPO patterns).  

  #### **Step 7: Final Default Action**  
  - **Test**: Is the theorem an existence claim (`∃x, P(x)`) or disjunction (`A ∨ B`)?  
  - **Settled answer**:  
    - Yes: Output **C** (restate approximately, e.g., with `ε` or `~~∃`).  
    - No: Output **A** (port as stated; likely safe).  
  - **Judgment call**: Assumes non-existence claims are benign. False negatives possible here.  
  - **Time**: 1 minute.  

  **Total max time**: 17 minutes.  

  ---

  ### **Procedure Applied to Your Cases**  
  #### **Case 1: Intermediate Value Theorem (IVT)**  
  - **Statement**: Let `f : [a,b] → ℝ` be continuous, `f(a) < 0 < f(b)`. Then `∃c ∈ [a,b], f(c) = 0`.  
  - **Triage**:  
    1. **Step 1**: Conclusion `∃c, f(c)=0` is unstable (fails).  
    2. **Step 2**: Classical proof bisects `[a,b]` on `f(mid) ≤ 0` (undecidable for reals). Fail → **B** if `f` has decidable sign? No, not general.  
    3. **Step 3**: Proof shows `~~∃c, f(c)=0` but `f(c)=0` is undecidable → **C** (restate approximately).  
  - **Outcome**: **C** (Restate as: `∀ε>0, ∃c ∈ [a,b], |f(c)| < ε`).  

  #### **Case 2: Every Real is Nonnegative or Nonpositive**  
  - **Statement**: `∀x ∈ ℝ, (x ≥ 0) ∨ (x ≤ 0)`.  
  - **Triage**:  
    1. **Step 1**: Conclusion `A ∨ B` is unstable (fails).  
    2. **Step 2**: Proof uses `x > 0 ∨ x ≤ 0` (undecidable split on `x > 0`). Fail → Not isolated (core to theorem).  
    3. **Step 6**: Matches `LLPO` (equivalent to `(x ≥ 0) ∨ (x ≤ 0)`). **ESCALATE**.  
  - **Outcome**: **ESCALATE** (LLPO is banned, but the student must choose: drop, weaken to `~~(x ≥ 0 ∨ x ≤ 0)`, or add axiom).  

  #### **Case 3: Bolzano-Weierstrass for Bounded Sequences**  
  - **Statement**: Every bounded sequence `(a_n)` has a convergent subsequence.  
  - **Triage**:  
    1. **Step 1**: Conclusion `∃ (subsequence), convergent` is unstable (fails).  
    2. **Step 2**: Bisection proof splits on "infinitely many terms in left/right half" (undecidable for reals). Fail → Not isolated.  
    3. **Step 3**: No `~~∃` (proof constructs subsequence).  
    4. **Step 6**: Uses `LPO` implicitly (to choose intervals with infinitely many points). **ESCALATE**.  
  - **Outcome**: **ESCALATE** (Architectural: Use weak counterexample or assume sequential compactness).  

  **Student resentment**: Case 2 (ESCALATE) will frustrate—they must abandon the classical tautology or commit to LLPO.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Smuggled Axioms via Definitions**:  
     - **Risk**: Definitions like "`x = y` as `∀ε>0, |x-y|<ε`" are safe, but "`sup S` as a choice of supremum" may hide choice. Diaconescu’s theorem makes this critical.  
     - **Mitigation**: Audit definitions for:  
       - `IndefiniteDescription` (choice),  
       - Case splits on real predicates (EM),  
       - Non-computable limits (requires MP/LPO).  
     - **Our stance**: Ban `IndefiniteDescription` outright. Require witnesses in definitions (e.g., `sup S` must include a modulus of convergence).  

  2. **Implicit Use of Choice**:  
     - **Example**: Subsequence selection in Bolzano-Weierstrass uses countable choice.  
     - **Procedure gap**: Step 7 defaults to **C** for existence claims, missing choice dependencies.  
     - **Fix**: Add a pre-check: If the proof uses `∃` without a witness in a non-empty set, **ESCALATE** (countable vs dependent choice).  

  3. **Equivalence of Reals**:  
     - The procedure assumes **Cauchy reals** (default). For Dedekind reals, Step 2 would fail more often (locatedness required). This is an architectural constant—no checklist resolves it.  

  ---

  ### **Defended Defaults**  
  - **Banned outright**: Full EM, LPO, LLPO, unrestricted choice.  
    - *Why*: They break computational meaning and imply classical logic. Diaconescu’s theorem shows choice + EM collapse.  
  - **Permitted behind flag**:  
    - **MP** for decidable predicates (e.g., `~~∃n, P(n)` with `P` quantifier-free).  
    - **EM for rationals** (`q < r ∨ q ≥ r`).  
    - *Why*: MP is "harmless" for computable reals; rational EM is provable.  
  - **Approximate restatements preferred**: Over adding axioms (e.g., IVT).  
  - **Escalate architectural issues**: Cauchy vs Dedekind, choice in definitions, LLPO adoption.  

  This balances rigor with pragmatism—your students get quick answers for 80% of theorems, and you resolve foundational tensions.
