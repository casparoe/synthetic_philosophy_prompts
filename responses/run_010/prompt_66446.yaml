  We are given a bet that wins with probability p = 0.55 and loses with probability 0.45, at even money (so if you stake s and win, you get s back plus s, i.e., total return is 2s; if you lose, you lose the stake s). We bet a fixed fraction f of our current bankroll at each round. The bankroll evolves multiplicatively: if we start with B0, then after a win we have B0*(1+f) and after a loss we have B0*(1-f). Note: the return per unit staked is 2 on a win and 0 on a loss? But note: if we stake f*B and win, we get 2*(f*B) = 2fB, so the bankroll becomes B - fB + 2fB = B*(1+f). Similarly, if we lose, we lose the stake fB, so the bankroll becomes B*(1-f). So the multiplicative factors per bet are (1+f) for a win and (1-f) for a loss.

  After n bets, if we have k wins and n-k losses, the bankroll is:
     B_n = B0 * (1+f)^k * (1-f)^{n-k}

  The growth rate per bet is (1/n) * log(B_n / B0) = (k/n)*log(1+f) + ((n-k)/n)*log(1-f)

  By the law of large numbers, as n → ∞, k/n → p = 0.55. Therefore, the long-run growth rate converges to:
     G(f) = p * log(1+f) + (1-p)*log(1-f)

  We want to maximize G(f) over f in [0,1). The Kelly fraction f* is the value that maximizes G(f).

  Now, consider two bettors: bettor A uses the Kelly fraction f*, and bettor B uses some other fraction g ≠ f*. Both start with the same bankroll B0. We wish to show that as n → ∞, the probability that A has more money than B goes to 1.

  Let A_n and B_n be the bankrolls of A and B after n bets. Then:
     A_n = B0 * (1+f*)^k * (1-f*)^{n-k}
     B_n = B0 * (1+g)^k * (1-g)^{n-k}

  Therefore, the ratio of A_n to B_n is:
     R_n = A_n / B_n = [ (1+f*)^k * (1-f*)^{n-k} ] / [ (1+g)^k * (1-g)^{n-k} ]

  Take logarithms:
     log(R_n) = k * log( (1+f*)/(1+g) ) + (n-k) * log( (1-f*)/(1-g) )

  We can rewrite:
     log(R_n) = n * [ (k/n) * log( (1+f*)/(1+g) ) + ((n-k)/n) * log( (1-f*)/(1-g) ) ]

  As n → ∞, by the law of large numbers, k/n → p. Therefore, the expression inside converges to:
     p * log( (1+f*)/(1+g) ) + (1-p) * log( (1-f*)/(1-g) ) 
     = [ p * log(1+f*) + (1-p)*log(1-f*) ] - [ p * log(1+g) + (1-p)*log(1-g) ]
     = G(f*) - G(g)

  Since f* maximizes G, we have G(f*) > G(g) for any g ≠ f*. Therefore, the limit of the expression inside is a positive constant, say c = G(f*) - G(g) > 0. Thus, log(R_n) → ∞ as n → ∞ (because it grows linearly with n: n * c). This implies R_n → ∞. But note that convergence is almost sure? We have to be cautious because the convergence of k/n is almost sure (by the strong law of large numbers), and then log(R_n)/n → c > 0, so log(R_n) → ∞ almost surely. Therefore, R_n → ∞ almost surely.

  This means that with probability 1, the ratio A_n/B_n becomes arbitrarily large. In particular, for any fixed M, there is an N such that for all n>N, A_n > M * B_n. Therefore, A_n > B_n for all sufficiently large n, with probability 1. But note: we must also consider the possibility that both bankrolls might be going to zero? However, if g is chosen such that G(g) > 0, then both bankrolls grow to infinity, but A_n grows faster. If G(g) < 0, then B_n goes to 0 while A_n goes to infinity (if G(f*)>0). In either case, we have A_n / B_n → ∞ almost surely. Therefore, the event that A_n > B_n happens for all sufficiently large n, almost surely.

  But note: the event that A_n > B_n for all sufficiently large n implies that the probability that A_n > B_n goes to 1? Actually, since it happens almost surely, we have:
     P( A_n > B_n ) → 1   as n → ∞.

  However, note that the convergence is in the sense that the event {A_n > B_n} will eventually hold with probability 1. Therefore, the probability that A_n > B_n at any fixed n might not be 1, but the limit as n→∞ is 1.

  So the fact is established: the Kelly bettor finishes ahead of any other fixed fraction bettor with probability approaching 1 as the number of bets goes to infinity.

  Now, to the second part: is this more than the law of large numbers applied to the logarithms? Essentially, we used the strong law of large numbers to say that the log bankroll per bet (i.e., the growth rate) converges to G(f). Then we compared the two growth rates. The key point is that the difference in log bankrolls grows linearly with n at the rate c>0. So it is an application of the law of large numbers and the fact that the growth rate function G is uniquely maximized at f*.

  The normative force requires that the bettor cares about the long-run outcome. Specifically, if the bettor's goal is to outperform other bettors in the long run (in the sense of having a higher bankroll with probability approaching 1) then the Kelly fraction is the only fraction that achieves this against any other fixed fraction. But note: if the bettor has a different goal (like avoiding ruin in the short run, or reaching a fixed target by a fixed time) then Kelly may not be optimal. The key normative assumption is that the bettor is engaged in a long sequence of bets and wants to maximize the probability of being ahead of any other fixed strategy in the long run. 

  Third part: the objection that real life is not an infinite sequence of identical independent bets. We concede that the Kelly criterion is derived under an idealization. However, the fact that we established still holds: for any two fixed fraction strategies, the Kelly fraction will beat any other in the long run in the sense of the probability of being ahead going to 1. Therefore, if a bettor is facing a long (but finite) sequence of similar bets, then the Kelly fraction is still the one that maximizes the growth rate and hence the long-run bankroll. But for a finite sequence, there is a trade-off between growth and risk of ruin. Also, if the bettor has a specific target and deadline, then a different fraction might be better. But note: the Kelly fraction minimizes the expected time to reach a given target? Not exactly. However, the Kelly fraction has the property that it maximizes the asymptotic growth rate, which is still a desirable property for long-term growth. The objection limits the reach of the position because it says that in many real-world situations, the goal is not only long-term growth. But it does not refute the fact that for the specific goal of long-term growth, Kelly is optimal.

  Fourth part: staking half the Kelly fraction due to uncertainty about the estimate of p. This is not a counterexample. The Kelly fraction f* is computed based on the estimated p. But if the bettor is uncertain about p, then they might use a different fraction to account for model risk. The growth-rate rule ranks policies (i.e., fixed fraction strategies) based on the assumed p. But if the true p is unknown, then the bettor might choose a fraction that is robust to uncertainty. This is an application of the same principle: the bettor is choosing a fixed fraction that maximizes the expected growth rate under their uncertainty (by averaging over possible p) or they are choosing a fraction that avoids ruin in case p is overestimated. However, note that the rule we stated was for a known p. If the bettor has a prior over p, then they might compute a new growth rate function by integrating over p. But that would be a different policy (a fixed fraction based on the prior) and then the same fact would hold: that fraction would beat any other fixed fraction in the long run (if the prior is correct). However, if the true p is fixed but unknown, then the Kelly fraction for the prior might not be the same as the Kelly fraction for the true p. So the bettor using half Kelly is not necessarily violating the principle; they are adjusting the policy to account for uncertainty. The policy they choose is still a fixed fraction, and the fact we established applies to that fixed fraction: it will beat any other fixed fraction in the long run if the true p is such that their chosen fraction is the growth-rate maximizer for that true p? But note: they are not using the growth-rate maximizer for the true p (because they don't know it) but for their prior. So we cannot say that half Kelly will beat every other fraction. However, the bettor is still following a fixed fraction policy, and the fact we established says that the growth-rate maximizing fraction for the true p will beat any other fixed fraction. Therefore, if the bettor's chosen fraction (half Kelly) is not the true growth-rate maximizer, then there exists another fraction (the true Kelly fraction) that will beat it in the long run. But the bettor does not know the true p. So the bettor is making a trade-off: they are sacrificing some growth in the case that their estimate is accurate to avoid the risk of ruin or severe loss in case the estimate is too optimistic. This is a practical adjustment, but it does not refute the theoretical fact for known p.

  In summary, the view presented is that the Kelly criterion is a rule for choosing a fixed fraction to bet in repeated independent bets that has the property that it will beat any other fixed fraction in the long run with probability approaching 1. This is a consequence of the law of large numbers and the maximization of the growth rate. The normative force comes from the goal of long-run growth and outperforming others in the long run. The reach of the position is limited by the fact that not all betting situations are infinitely repeated and independent, and by the fact that bettors may have other goals. However, within its domain, the fact stands.

  Finally, if I (the responder) believed the view was false, I would say so. But in this case, I do not. The view is a clear and accurate representation of the Kelly criterion's property. However, note that the Kelly criterion can be extended to more complex situations (multiple simultaneous bets, correlated bets, etc.) and then the same principle applies: maximize the expected logarithm of wealth. But the core idea remains: it is a policy that maximizes long-run growth and has the property of dominating any other fixed policy in the long run.
answer: |-
  ### Part 1: Establishing the Fact  
  Consider a bet at even money (1:1 odds) where you win with probability \(p = 0.55\) and lose with probability \(0.45\). You stake a fixed fraction \(f\) of your bankroll each round. Let \(B_n\) be your bankroll after \(n\) bets. If you win \(k\) times and lose \(n - k\) times, your bankroll evolves as:  
  \[
  B_n = B_0 \cdot (1 + f)^k \cdot (1 - f)^{n - k}.
  \]  
  The **growth rate per bet** is \(\frac{1}{n} \log(B_n / B_0)\). Substituting:  
  \[
  \frac{1}{n} \log(B_n / B_0) = \frac{k}{n} \log(1 + f) + \frac{n - k}{n} \log(1 - f).
  \]  
  By the law of large numbers, as \(n \to \infty\), \(\frac{k}{n} \to p = 0.55\). Thus, the long-term growth rate converges to:  
  \[
  G(f) = p \log(1 + f) + (1 - p) \log(1 - f).
  \]  
  Maximize \(G(f)\) by solving \(\frac{dG}{df} = 0\):  
  \[
  \frac{p}{1 + f} - \frac{1 - p}{1 - f} = 0 \implies f^* = 2p - 1 = 2(0.55) - 1 = 0.10.
  \]  
  This is the growth-maximizing (Kelly) fraction. Now, suppose two bettors:  
  - Bettor A stakes \(f^* = 0.10\).  
  - Bettor B stakes \(g \neq 0.10\).  

  Both start with bankroll \(B_0\). After \(n\) bets:  
  \[
  A_n = B_0 \cdot (1 + f^*)^k \cdot (1 - f^*)^{n - k}, \quad B_n = B_0 \cdot (1 + g)^k \cdot (1 - g)^{n - k}.
  \]  
  The ratio \(R_n = A_n / B_n\) is:  
  \[
  R_n = \left[ \frac{(1 + f^*)^k (1 - f^*)^{n - k}}{(1 + g)^k (1 - g)^{n - k}} \right].
  \]  
  Take logarithms:  
  \[
  \log R_n = k \log\left( \frac{1 + f^*}{1 + g} \right) + (n - k) \log\left( \frac{1 - f^*}{1 - g} \right).
  \]  
  Divide by \(n\):  
  \[
  \frac{1}{n} \log R_n = \frac{k}{n} \log\left( \frac{1 + f^*}{1 + g} \right) + \frac{n - k}{n} \log\left( \frac{1 - f^*}{1 - g} \right).
  \]  
  As \(n \to \infty\), \(\frac{k}{n} \to p\), so:  
  \[
  \frac{1}{n} \log R_n \to p \log\left( \frac{1 + f^*}{1 + g} \right) + (1 - p) \log\left( \frac{1 - f^*}{1 - g} \right) = G(f^*) - G(g).
  \]  
  Since \(f^*\) maximizes \(G\), \(G(f^*) > G(g)\). Thus, \(\frac{1}{n} \log R_n \to c > 0\), implying \(\log R_n \to \infty\) (grows linearly with \(n\)). Consequently, \(R_n \to \infty\) almost surely. This means:  
  - \(A_n > B_n\) for all sufficiently large \(n\) with probability 1.  
  - The probability that \(A_n > B_n\) approaches 1 as \(n \to \infty\).  

  **Conclusion:** Kelly staker A beats any other fixed-fraction staker B with certainty in the long run.  

  ---

  ### Part 2: Relationship to the Law of Large Numbers  
  The fact **is** an application of the law of large numbers (LLN) to log returns. The core argument relies on:  
  1. LLN ensuring \(\frac{k}{n} \to p\), making \(G(f)\) the long-term growth rate.  
  2. \(G(f^*)\) being strictly greater than \(G(g)\) for \(g \neq f^*\).  
  3. The multiplicative nature of wealth ensuring that a small persistent advantage compounds to dominance.  

  The **normative force** of this fact requires two premises:  
  1. **Long-term growth is the goal**: You care about outcomes after many bets, not just one.  
  2. **Dominance is compelling**: You prefer strategies that almost surely overtake others in the long run.  

  Without these, the fact is mathematically true but normatively inert. If a bettor prioritizes short-term survival or a specific target, Kelly may not be best. But if outperforming others over time is paramount, the fact forces Kelly upon you.  

  **Your exposure**: Your position implicitly assumes that long-run dominance is the ultimate objective. Critics may reject this, but they cannot deny the math.  

  ---

  ### Part 3: Handling Finite Horizons and Specific Goals  
  **Concession**: The objection is valid. Few face infinite identical bets. Many bet to reach a target (e.g., $1M by age 60) and may accept higher risk of ruin for a chance at early success. In such cases:  
  - A target-seeker might stake **more** than Kelly (e.g., "bold play" to minimize expected time to a goal).  
  - A risk-averse bettor might stake **less** than Kelly to reduce short-term volatility.  

  **Why this doesn’t refute your view**:  
  1. **Kelly remains optimal for its goal**: Your fact holds for the narrow objective of long-run dominance. If a bettor rejects this objective, Kelly is not required—but this is a shift in goals, not a flaw in Kelly.  
  2. **Kelly as a benchmark**: Even with finite horizons, Kelly is often a reference. Staking more/less is a *modification* of Kelly for new constraints, not a repudiation of the growth-maximizing principle.  
  3. **Robustness in long sequences**: For bets repeated often (e.g., daily trading), the "long run" arrives quickly, and Kelly’s dominance manifests within practical horizons.  

  **Limitation, not refutation**: Your view applies when the bettor’s horizon is "long enough" for compounding to outweigh short-term noise. For short sprints, other tactics exist—but they abandon the goal of long-run dominance.  

  ---

  ### Part 4: Half-Kelly and Uncertainty  
  A bettor staking half the Kelly fraction (\(f = 0.05\) instead of \(0.10\)) due to uncertainty about \(p = 0.55\) is **an application of your view**, not a counterexample. Here’s why:  
  1. **Kelly assumes known probabilities**: Your fact assumes \(p = 0.55\) is correct. If the bettor doubts this, they face a new problem: uncertainty in the model.  
  2. **Robust policy over outcomes**: The half-Kelly staker is choosing a *different policy* (fixed fraction \(g = 0.05\)) because they believe it better maximizes long-run growth under uncertainty. They still rank policies by growth but account for estimation risk.  
  3. **Your fact still governs**: If the true win rate is \(p = 0.55\), full Kelly (\(f^* = 0.10\)) will beat half-Kelly (\(g = 0.05\)) with probability →1 as \(n \to \infty\). However, if the bettor’s doubt is justified (e.g., true \(p < 0.55\)), half-Kelly may avoid ruin and win in the long run.  

  **Key point**: Half-Kelly is a *conservative policy* for a different scenario (unknown \(p\)), not a rejection of growth-rate maximization. Your view ranks policies—and half-Kelly is one such policy chosen under uncertainty.  

  ---

  ### Final Assessment  
  Your view is **correct and coherent**. Kelly is not a utility function; it ranks policies by long-run growth, and its supremacy follows from the law of large numbers and compounding. The "finishing ahead with certainty" fact is the bedrock, and all else (e.g., logs, expectations) are tools to compute or justify it. Critics conflate:  
  - **Utility theory**: Ranks outcomes (static choices).  
  - **Kelly**: Ranks strategies (dynamic policies).  

  They address different questions. While Kelly has limitations (e.g., sensitivity to parameter estimates, short-term volatility), your core argument stands. **Nothing should replace it** for the goal of long-run dominance. If forced to critique, I might say that in non-i.i.d. or non-repeated settings, Kelly needs extension—but your formulation for repeated bets is flawless.
