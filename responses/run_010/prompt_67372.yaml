  ### In-Class Game Design: "The Bankroll Builder"

  **Core Structure**:  
  A 20-round repeated betting game (Phase 1) followed by a one-shot bet (Phase 2). Students play in **pairs** (9 total) to reduce bookkeeping errors and encourage peer discussion. Pairs submit one stake decision per round and share calculations.  

  **Materials**:
  - **Random device**: A 10-sided die (d10). Outcomes: 1-6 = win (60%), 7-10 = loss (40%). Students verify fairness by noting equal probability for each face.
  - **Token tracking sheet** (one per pair):  
    | Round | Start | Stake fraction | Outcome | End |  
    |-------|-------|----------------|---------|-----|  
    (Pre-filled with "Start" = 100 for Round 1; "End" becomes next round’s "Start".)
  - **Multiplier table** (one per pair):  
    | Stake Fraction | Win Multiplier | Loss Multiplier |  
    |----------------|---------------|----------------|  
    | 0.0            | 1.00          | 1.00           |  
    | 0.1            | 1.10          | 0.90           |  
    | 0.2            | 1.20          | 0.80           |  
    | ...            | ...           | ...            |  
    | 1.0            | 2.00          | 0.00           |  
  - **Reward**: All pairs receive **two candies** for completing the game (uniform reward). Top 3 pairs by final tokens get **bonus stickers** (competitive feel without luck-based rewards).

  ---

  ### **Minute-by-Minute Timeline** (75 min total)
  **0-5 min: Setup**  
  - Distribute tracking sheets, multiplier tables, and dice.  
  - Assign pairs randomly.  
  - **Script**: *"Today, you’ll play a token-betting game in pairs. Start with 100 tokens. Each round, you’ll bet a **fraction** of your tokens (e.g., 0.5 for half) on a die roll. If the die shows 1–6, you win (60% chance); 7–10, you lose (40%). Winning multiplies your bet by 2 (so staking 50 tokens returns 100). Losing costs your bet. Use the table to multiply your total tokens after each outcome. If you hit 0, you’re out. We’ll play 20 rounds. Tokens convert to candy—everyone gets some, top 3 get extra. Let’s practice one round!"*  
    - Demo: Roll die; pairs calculate a practice bet (e.g., stake 0.4; win → 100 × 1.4 = 140; lose → 100 × 0.6 = 60).  

  **5-25 min: Phase 1 (20 rounds)**  
  - Each round:  
    1. **Decide**: Pairs secretly write stake fraction (0.0–1.0) on sheets.  
    2. **Roll**: Instructor rolls die, announces outcome (win/loss) to all.  
    3. **Calculate**: Pairs apply multiplier to "Start" tokens, record "End" tokens.  
  - **Key rules**:  
    - **Identical outcomes**: All pairs use the same die-roll sequence.  
    - **Bankrupt pairs**: Record "0" for all remaining rounds. Still participate in Phase 2.  
  - **Timekeeping**: Strict 60 seconds/round. Use timer!  

  **25-35 min: Data Collection & Analysis**  
  - **Script**: *"Report final tokens. Let’s compute the average (mean) and middle value (median)."*  
    - Write all 9 final token counts on board.  
    - Students sort values; identify median (5th-highest).  
    - Students calculate mean: (sum ÷ 9).  
  - **Discovery prompt**: *"Compare mean and median. Is the mean higher or lower? Why? Who pulled the mean up? Who pulled it down?"*  
    - Expected result: Mean < median (due to zeros/low values dragging mean down).  

  **35-40 min: Phase 2 (One-Shot Bet)**  
  - **Script**: *"New opportunity: Same bet (60% win), but you **must** stake exactly 50% of your current tokens. Decide: take it or not? Write ‘yes’ or ‘no’. After decisions, I’ll roll once."*  
    - Pairs decide secretly. Roll die; announce outcome.  
    - **No revision**: Outcomes applied immediately (win: ×1.5; lose: ×0.5).  

  **40-70 min: Debrief**  
  - **Map gameplay to concepts**:  
    1. **Phase 1 separation**: *"Why did identical bets lead to wildly different results? Stake fraction mattered. Who went bust? Who barely grew? Who thrived?"*  
    2. **Optimal strategy**: *"The best performers likely staked ~20%. Why? Let’s see: a 20% bet turns 100 → 120 on a win, 80 on a loss. Over many rounds, this balances growth and safety."*  
    3. **Mean/median lesson**: *"Zeros dragged the mean down. The median ignored extremes. The ‘thrivers’ pulled the mean up but couldn’t offset the zeros."*  
    4. **Phase 2 contrast**: *"Did you take the one-time 50% bet? It had positive expected value (60% × 50% gain > 40% × 50% loss). But after Phase 1, some declined. Why?"*  
  - **Critical distinction**: *"Phase 1 rewarded **long-term growth** (not luck or risk preferences). Phase 2 tested **single-bet favorability**. These are different questions!"*  
  - **Avoid misattribution**: *"This doesn’t mean you have a ‘risk-averse’ utility function. It means repeated bets require staking control."*  

  **70-75 min: Wrap-Up & Rewards**  
  - Distribute candies/stickers.  
  - **Final note**: *"Real-world parallels: Odds are estimated (not known), ‘optimal’ is long-term (not 20 rounds), and losses hurt more than tokens. But the core split remains: bet favorability ≠ staking size."*  

  ---

  ### **Arithmetic Validation**
  - **Round count**: 20 rounds suffice for visible mean/median separation with 60% win probability.  
    - **Simulation** (12 wins, 8 losses; 9 pairs):  
      - 3 pairs stake 0.0 → End: 100  
      - 3 pairs stake 0.2 → End: 100 × (1.2)^12 × (0.8)^8 ≈ 150  
      - 2 pairs stake 0.5 → End: 100 × (1.5)^12 × (0.5)^8 ≈ 51  
      - 1 pair stakes 1.0 → Bust (end: 0)  
    - **Results**: Sorted = [0, 51, 51, 100, 100, 100, 150, 150, 150]  
      Median = 100; Mean = (0+51+51+100+100+100+150+150+150)/9 ≈ 94.4 (mean < median).  
  - **If separation is weak**: Increase to **30 rounds** (adds 10 min; enhances growth dispersion). Do not change odds/payouts—it obscures the lesson.  

  ---

  ### **Predictable Problems & Fixes**
  1. **"I stake nothing, I’m safe!"**  
     - **Problem**: Ends with 100 tokens; feels vindicated despite suboptimal growth.  
     - **Fix**: In debrief, contrast with 20% stakers (≈150 tokens). *"Safety has a growth cost."*  

  2. **Eliminated early, disengaged**  
     - **Problem**: Pair busts in round 3; tunes out.  
     - **Fix**: Assign them as "outcome trackers" (record die rolls). Emphasize: *"Your experience shows overstaking’s risk—it’s key to the lesson!"*  

  3. **Arithmetic errors**  
     - **Problem**: Wrong multiplier application.  
     - **Fix**: Use pre-calculated table; pairs cross-check; instructor spot-checks 2–3 pairs.  

  4. **Phase 2 confusion**  
     - **Problem**: Misunderstands "fixed 50% stake".  
     - **Fix**: Script clarity: *"You must stake half your tokens—no choice."*  

  5. **Time overrun**  
     - **Problem**: Round delays.  
     - **Fix**: Enforce 60-second rounds; use timer. If behind, skip post-round checks (collect sheets later).  

  ---

  ### **What the Game Cannot Reproduce & Bridging Script**
  - **Estimated odds (not known)**:  
    *"In reality, you estimate probabilities. If you overestimate your edge, you overbet and lose."*  
  - **Asymptotic optimum (not 20-round)**:  
    *"The 20% stake is ideal for long-term growth. Short horizons might justify different stakes."*  
  - **Token loss ≠ livelihood loss**:  
    *"Real losses have stakes beyond tokens—like rent or retirement. This demands extra caution."*  

  This design ensures students discover the bet/stake split through gameplay, with minimal jargon and maximal engagement. The paired approach streamlines logistics while preserving individual agency.
