  "Now, let's find the median. Sort the list and pick the middle one." [Do it.]

  "Notice that the mean is [mean] and the median is [median]. Are they different? Why? Let's look at the distribution. Who has the highest? What fraction did you bet? Who has the lowest? What fraction did you bet? Who went to zero? When?"

  [They should notice that the pairs that bet very high fractions (like 1.0) went to zero early. The pairs that bet around 0.2 did well. The pairs that bet 0 ended at 100.]

  "The zeros and the low bankrolls are dragging the mean down. The median is less affected by these extremes. So the mean is below the median."

  "Now, what was the best strategy? [Point out the pair that has the highest bankroll and ask their strategy.] Why did staking 20% do well? Because it balanced risk and reward."

  "Now, in the one-time bet we did at the end: we offered the same bet at a fixed stake of 50%. How many of you took it? Why did some decline? [Discuss.] Even though the bet was favorable, some declined because they were risk averse or because they had a bad experience in the repeated game. But note: in the one-time bet, the expected value is positive. So if you only care about expected value, you should take it. But if you are risk averse, you might not. However, in the repeated game, we saw that the amount you bet matters for long-term growth. That's a different consideration."

  "The lesson: deciding that a bet is favorable (positive expected value) is one thing. Deciding how much of your bankroll to stake on it is another. In the repeated game, staking too much can lead to ruin even if the bet is favorable. In the one-time bet, you might take it if you are risk-neutral, but decline if you are risk-averse. But note: the repeated game strategy (Kelly) does not assume risk aversion. It maximizes the growth rate. So it's about a different objective."

  "Finally, remember that in the real world:
     - You often don't know the exact probabilities. You have to estimate them.
     - The optimal strategy we saw (staking 20%) is for the long run. For a short series of bets, you might choose differently.
     - And losing money in the real world can have serious consequences, so you might be more cautious than in this game."

  **Materials**:

  - 10-sided die (or a digital RNG displayed for all to see).
  - Tracking sheets for each pair (with 20 rows and columns: Round, Current, Fraction, Outcome, New Bankroll).
  - Multiplier table handout.
  - Board or chart to record final bankrolls.
  - Candy for participation (two per pair).

  **Adjustments**:

  - If the separation isn't clear in practice, we might need more rounds. But our simulation showed a clear separation. Alternatively, we can adjust the odds to make the optimal fraction more pronounced? But 60% is standard.

  - We can also change the payout: instead of even money, maybe 2:1? But that would change the lesson. We want even money to keep it simple.

  Given the time constraints, 20 rounds is acceptable.

  **Revised round count check**: We did 20 rounds and saw separation. We can try 10 rounds to see if it's enough?

      For Kelly (f=0.2) over 10 rounds with, say, 6 wins and 4 losses:
          Bankroll = 100 * (1.2)^6 * (0.8)^4
          = 100 * (2.985984) * (0.4096) ≈ 100 * 1.223 ≈ 122.3

      For f=0: 100
      For f=0.5: 100 * (1.5)^6 * (0.5)^4 = 100 * (11.390625) * (0.0625) ≈ 100 * 0.7119 = 71.19
      For f=1.0: if there is at least one loss, they go to zero. With 4 losses, they go to zero on the first loss.

      Now, if we have:
        2 pairs: 100 (f=0)
        3 pairs: 122.3 (f=0.2)
        2 pairs: 71.19 (f=0.5)
        2 pairs: 0 (f=1.0)

      Sorted: 0,0,71.19,71.19,100,100,122.3,122.3,122.3
      Median: 5th = 100.
      Mean: (0+0+71.19+71.19+100+100+122.3+122.3+122.3) / 9 = 708.27/9 ≈ 78.7.

      Still separation: mean 78.7, median 100.

      So 10 rounds might be enough? But 20 rounds gives more dramatic results (the Kelly goes to 150, and the zeros are more zeros). We have time for 20 rounds? We planned 20 minutes for 20 rounds. If we do 10 rounds, we save 10 minutes. But the effect is less pronounced.

      We'll stick to 20 rounds.

  **Final Timeline**:

