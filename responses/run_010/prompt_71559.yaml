prompt: |-
  I'm a software engineer at a mid-size foundation and I sit on the panel that renews our long-horizon research grants — I'm the "technical" member, the rest are an economist, a historian, and two program officers. Here's the case I have to write up.

  A group we've funded for three straight five-year cycles built a model back in the 80s in the Malthus tradition: finite resource base, exponential demand growth, and a claim that the system overshoots and then corrects hard. The correction hasn't happened. Commodity prices fell, crop yields kept climbing, substitution kicked in wherever something got scarce. Every cycle their progress report says basically the same thing — the structure was right, the timing was off, and here's the revised parameter set. The scarce input has migrated from oil to phosphorus to freshwater, and the arrival date has moved from around 2000 to 2040 to "sometime within the century." They've also picked up a couple of things that did go their way, regional fisheries collapse and topsoil depletion, and they present those as partial vindication of the same structure.

  The panel is split down the middle. Two want to cut them: a theory that can accommodate any outcome explains nothing, and at this point we're funding a vibe with a lot of equations attached. Two want to renew: Malthus gets declared wrong every fifty years and the underlying pressure is obviously real, the group trains excellent students, and their open datasets get used by people who don't cite them at all.

  Draft the memo I'll circulate before Thursday. It needs a bottom line I can actually vote on — cut, renew, or renew with conditions, and if it's conditions, what they'd look like concretely enough that the group could tell whether they'd met them — plus the reasoning behind it, including an honest account of the strongest thing the renew side has going for it, not a strawman of it. One more thing: I keep reaching for machine-learning language for what bothers me here (post-hoc tuning, backtesting on the same data you fit on, a model that never gets falsified becuse you can always move the date), and I want you to tell me straight whether that vocabulary actually does the work, or whether "the theory was right, just early" has something in it that a model-selection framing misses.

  No reading list, no citations, I'm not going to chase anything down. Under 500 words.
reasoning: |-
  Okay, the user is a software engineer on a panel deciding whether to renew funding for a long-running research group. This group has been funded for fifteen years and uses a Malthusian model predicting resource collapse, but their predictions keep failing—timelines shift and the "critical resource" changes. The panel is split: two want to cut funding because the model seems unfalsifiable, while two want to renew because the core idea has merit, the group trains students, and their data is widely used.  

  The user needs a memo draft by Thursday with a clear recommendation (cut/renew/conditional renewal) and reasoning. They specifically want:  
  - Honest engagement with the renewal argument (no strawman)  
  - Clarity on whether ML analogies (overfitting, backtesting) validly critique the group's methods  
  - Concrete conditions if recommending conditional renewal  

  First, I should acknowledge the renewal side's strongest points:  
  1. Malthusian pressures *are* real (climate change, soil depletion prove that)  
  2. The group produces tangible value (trained students, open datasets)  
  3. History shows similar theories were prematurely dismissed  

  But the critique is damning:  
  - Moving goalposts (resource shifts, timeline extensions) make the model unfalsifiable  
  - Retroactive parameter tweaking resembles ML overfitting  
  - No error analysis or structural updates despite repeated failures  

  The ML framing absolutely holds:  
  - Tuning parameters after failed predictions = classic overfitting  
  - Treating regional collapses as "partial vindication" is like cherry-picking validation data  
  - A model that avoids falsification by adjusting inputs/dates has zero predictive power  

  Recommendation: Renew with strict conditions. Cutting ignores the ancillary benefits, but unconditional renewal endorses bad science. Conditions must force methodological rigor:  
  1. **Pre-commitment:** Require them to register predictions (resource, timeline, thresholds) before the next cycle.  
  2. **Falsifiability test:** Define clear failure criteria (e.g., if predicted resource scarcity doesn’t materialize within ±5 years of their date).  
  3. **Structural audit:** Make them justify why the core model hasn’t incorporated substitution/demographic shifts observed in reality.  

  This satisfies the user’s need for concrete, actionable terms while pushing the group toward accountability. The ML analogy works because it exposes how their adjustments evade disproof—no model that endlessly moves the goalposts can claim scientific validity.  

  Final memo structure:  
  - Header with recommendation upfront  
  - Balanced summary of both sides  
  - Explicit validation of renewal arguments  
  - Critique using ML framing (with plain-English explanation)  
  - 3 concrete conditions with implementation details  
  - Note on why this isn’t punitive but necessary for credibility
answer: |-
  ### MEMO: Funding Recommendation for Malthusian Resource Modeling Group  
  **To:** Grant Renewal Panel  
  **From:** [Your Name], Technical Representative  
  **Date:** [Date]  
  **Subject:** Conditional Renewal Recommendation for Cycle 4 (2025–2030)  

  #### Bottom Line  
  **Renew for one final five-year cycle with strict conditions** (detailed below). Do not fund beyond 2030 without demonstrable progress.  

  #### Core Reasoning  
  The renewal side’s strongest argument is compelling: the team’s work captures a real, high-stakes dynamic (resource depletion *does* drive crises like fisheries collapse), their open datasets are widely leveraged (even without citation), and they mentor exceptional students. Dismissing this over 50-year horizons risks ignoring persistent systemic threats. However, the critique of unfalsifiability is equally valid. A model that retroactively shifts inputs (oil → phosphorus → water), timelines (2000 → 2040 → 2100), and treats regional failures as "partial proof" while ignoring global non-events (e.g., sustained yield growth) operates more like a belief system than predictive science.  

  #### Why Machine Learning Language Fits (and Why It Matters)  
  Your instinct is correct: **the ML framing exposes the core flaw**. The group’s process mirrors:  
  - **Overfitting**: Tuning parameters post-failure to "predict" past noise (e.g., recalibrating after 2000 passes without collapse).  
  - **Data leakage**: "Validating" the model on the same phenomena it was fitted to (e.g., claiming topsoil loss proves the model, though it wasn’t a primary original output).  
  - **Null predictive power**: A model that absorbs all outcomes (growth *or* collapse) by adjusting inputs/dates is functionally untestable.  

  The "right theory, wrong timing" argument *does* hold intuitive weight for slow-moving risks, but it becomes unscientific without committing to falsifiable tests. A model-selection lens forces this rigor: if the theory can’t specify *what would disprove it*, it ceases to be science.  

  #### Conditions for Renewal  
  Renewal is justified given the ancillary benefits (data, training), but the model must be stress-tested. Conditions are:  
  1. **Pre-registered predictions**: By 2026, the team must publish specific, measurable predictions (e.g., "Freshwater scarcity will reduce global grain yields by ≥10% by 2035 due to [mechanism]"). These must include **failure criteria** (e.g., "If yields stay flat or rise through 2035, the core scarcity mechanism is invalid").  
  2. **Formal falsifiability framework**: Integrate counterfactual analysis (e.g., "How much substitution/innovation would void the prediction?") and document past errors (e.g., "Why did phosphorus scarcity not trigger collapse as projected in 2015?").  
  3. **Third-party audit**: An external expert (e.g., ecological economist) assesses model adjustments pre/post 2030 renewal. They verify whether parameter changes reflect new data or merely evade falsification.  

  #### What Success Looks Like  
  By 2030, the group must:  
  - Pass the audit showing ≥80% of parameter updates are driven by *new* data (not retrospective fitting).  
  - Have ≥2 pre-registered predictions pass/fail definitively against their criteria.  
  - Publish a plan to retire or fundamentally restructure the model if failure criteria are met.  

  **Vote**: Renew with above conditions. This balances respect for their contributions with a demand for accountability. Without these guardrails, we fund dogma, not discovery.  

