  #### **8. Debrief Script**  
  Map activity moments to concepts:  
  1. **Premise vs. conclusion aggregation**: "When you voted P/Q/R then applied the rule, that was *premise-based*. Direct debar vote was *conclusion-based*. Which felt more legitimate? Why?"  
  2. **Group inconsistency**: "In divergent panels, the group’s findings (P=Y,Q=Y,R=Y) supported debar, but no member held all three. Yet individually, everyone was consistent."  
  3. **Epistemic case + price**: "Premise-based pooling helps with partial information (like your inserts). But the price is verdicts no member endorsed."  
  4. **Impossibility theorem**: "What you saw wasn’t a fluke. General proofs show *no* aggregation rule satisfies all fairness conditions in every case. This instance illustrates that depth."  
  5. **Responsibility & courts**: "When no member’s reasoning supports the verdict, who ‘owns’ it? Appellate courts face this: judges may agree on outcomes but disagree on legal paths."  
  6. **Meta-vote**: After vote, note: "This worked because it’s one question. With multiple interconnected rules, the paradox could reoccur."  

  #### **9. Predictable Problems & Responses**  
  - **Panel reaches agreement**: "This shows the paradox is profile-dependent. With full evidence (like control groups), it often dissolves."  
  - **Student refuses insincere vote**: "The exercise explores pressure, not compulsion. Your integrity is noted—we’ll discuss tensions."  
  - **Panel diagnoses setup early**: "The charter requires premise votes. Proceed, then we’ll discuss alternatives later."  
  - "Wording artifact" objection: "Real charters often encode conjunctive tests. Wording matters, but the structural issue is generalizable."  
  - **Panel invents new procedure**: "Innovate in Round 2! But first, complete Round 1 as instructed to experience the baseline."  

  #### **10. What the Activity Cannot Reproduce**  
  - **Persistence over time**: The paradox bites hardest when groups make *sequential decisions*, accumulating inconsistent commitments. You must note: "Real panels face cases yearly; inconsistency may compound."  
  - **Generality of impossibility**: One instance ≠ proof. State: "General theorems show this *can* happen under any rule, but not that it *always* will."  
  - **Deliberation’s role**: "In reality, discussion changes beliefs (e.g., sharing inserts resolved disagreements). Is dissolving the paradox this way a ‘solution’? Or does it sidestep aggregation?"  
  - **Simulated stakes**: "No livelihoods actually hung on your vote. In real cases, emotional load amplifies tension between truth-seeking and fairness."  

  ---  
  This design forces students to *generate* the paradox through evidence-driven disagreement, then confront its implications via role-play. The reveal crystallizes intuition before theory, making the abstraction visceral.
