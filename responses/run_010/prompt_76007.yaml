answer: |-
  ### Candidate Setups Considered  
  Before detailing the design, I considered three approaches to seed sincere disagreement through evidence without scripting beliefs. The core challenge is creating *interpretive ambiguity* in each premise, where reasonable individuals can draw different conclusions from partial, non-overlapping evidence.  

  1. **Environmental Permit Revocation**: A panel decides whether to revoke a factory's permit based on pollution exceedance (P), intent (Q), and failure to mitigate (R). Private evidence included technical monitoring data (P), internal compliance memos (Q), and maintenance logs (R). While environmentally relevant, the technical nature risked abstract debates, and the premises felt less personally immediate to students.  

  2. **Academic Integrity Hearing**: A university panel adjudicates plagiarism allegations, requiring copied content (P), intent (Q), and impact on grading (R). Private inserts included source comparisons (P), student emails (Q), and grading rubrics (R). Though relatable, the academic context risked meta-discussions about real policies, and intent (Q) often dominated moral reasoning, overshadowing factual ambiguity.  

  3. **Contractor Debarment Case (Chosen)**: Retaining your seed case, I refined it to maximize interpretive tension. P (understatement), Q (knowing), and R (materiality) each turn on *ambiguous documentation* (e.g., timesheets with plausible excuses, emails with vague phrasing). Moral texture (e.g., the foreman’s job, school delays) remains but is backgrounded; evidence is technically focused. Crucially, inserts are designed so each piece:  
     - **Strongly supports one interpretation** but doesn’t dictate it (e.g., an email implying pressure could indicate dishonesty or diligence).  
     - **Is silent on other premises**, forcing reliance on shared (inconclusive) dossier or reasonable defaults.  
     - **Overlaps minimally**: No shared evidence beyond the dossier. This maximizes information asymmetry, making disagreement likely as members prioritize different "clues." Control groups receive all inserts to simulate full information, where agreement typically emerges.  

  This setup best balances ambiguity, stakes, and neutrality. Students focus on puzzling out evidence, not debating values, and the labor context grounds abstractions without melodrama.  

  ---

  ### Full Activity Design  

  #### **1. Evidence Design: Shared Dossier and Private Inserts**  
  **Shared Dossier (1 page, ≤4 min read)**  
  > **Riverside Culvert Project: Background**  
  > BoltConcrete Inc. seeks renewal of its municipal contract. Complainant (rival firm BuildRight) alleges payroll fraud to underbid competitors.  
  > - **Project**: Critical repairs near Riverside High; delays risk school opening.  
  > - **Allegation**: Certified payroll reported 1,200 hours; BuildRight claims ≥1,500 worked.  
  > - **Local-Hiring Threshold**: Contract requires ≥60% local workers. BoltConcrete reported 78/120 local (65%). If proven, understatement *might* affect this count.  
  > - **Stakes**: Debarment costs BoltConcrete 40% of revenue; foreman Maria Gonzalez (15-year employee) may lose job. City needs affordable completion.  

  **Private Inserts (Index cards, 1 per panel member)**  
  - **Insert A (Timesheets)**:  
    > **Foreman’s Draft Timesheets**:  
    > - Logged hours: 1,480. Certified payroll: 1,200 (difference: 280 hours).  
    > - Margin note: "Rain delays 10/3–10/5? Not billed per contract." (Rain occurred 10/4.)  
    > *Suggests understatement (P). Ambiguity: Does "not billed" mean not worked? Rain only 1 day; 280hr gap unexplained.*  

  - **Insert B (Email)**:  
    > **Internal Email (Payroll Clerk to Foreman)**:  
    > "Maria, hours over budget. Make Riverside numbers work. Can’t lose contract."  
    > *Suggests pressure to falsify (Q). Ambiguity: "Make numbers work" could mean cost-cutting (legitimate) or fraud.*  

  - **Insert C (Hiring Calc)**:  
    > **Local-Hiring Threshold Analysis**:  
    > - Reported: 78 local / 120 total (65%).  
    > - Disputed workers:  
    >   - Alex Chen: License from next county, local lease.  
    >   - Jamie Rivera: Temp from agency 5 miles outside city.  
    > - If both non-local, true local % = 76/120 = 63.3% (fails). If one local, 64.2% (passes).  
    > *Materiality (R) hinges on residency classification. Understatement only relevant if threshold fails.*  

  **Why this works**:  
  - Each insert provides *strong but rebuttable* evidence for one premise (A→P, B→Q, C→R), while being silent on others.  
  - Ambiguity arises from incomplete context (e.g., rain delays cover 1 day, not 280hrs; email lacks follow-up; residency is debatable).  
  - Default rule: "Vote Y only if evidence proves beyond reasonable doubt." Burden of proof ensures negative votes where evidence is missing.  

  #### **2. Distribution & Control Groups**  
  - **Divergent Panels (6 panels)**: Each of 3 members gets one unique insert (A, B, or C). Profile prediction:  
    - Member A (P-focused): Likely P=Y (timesheets), Q=N (no evidence), R=N (no evidence) → No debar.  
    - Member B (Q-focused): Likely P=N (no evidence), Q=Y (email), R=N (no evidence) → No debar.  
    - Member C (R-focused): Likely P=N (no evidence), Q=N (no evidence), R=Y (if strict residency) or N (if lenient) → No debar.  
    Premise-based majority: P=Y (A), Q=Y (B), R=Y (C) → Debar. Conclusion-based: Unanimous No → Divergence.  
  - **Control Panels (2 panels)**: All 3 members receive all inserts. Full information typically yields P=Y, Q=Y, R=Y → Debar both ways.  
  - **Handling Belief Shifts**: If discussion changes votes, use it! Divergent groups that agree become "accidental controls." Debrief contrasts profiles: "In panels where evidence was shared fully, outcomes aligned; where it wasn’t, they often diverged."  

  #### **3. Stakes & Scorekeeping Mechanism**  
  **Reason-Coherence Score (Improved)**:  
  - **Procedure**:  
    - Post-vote, panels write a 2-sentence justification using **Tally Sheet** fields:  
      > "We find [P: Y/N] , [Q: Y/N] , [R: Y/N]. Therefore, debar [Y/N] because [charter]."  
    - Justifications rotate to another panel for scoring (0–2 pts):  
      > 2 = Uses **only** the three premises + charter rule.  
      > 1 = Minor leap (e.g., assumes unchallenged premise).  
      > 0 = Invokes external factors (e.g., "Maria needs her job").  
  - **Why it ensures sincerity**:  
    - Justifications must cite *recorded findings*, not private beliefs. Fabricating reasoning is harder than fabricating a vote.  
    - Peer scoring creates accountability; low scores feel "embarrassing" in a competitive seminar.  
    - Avoids bribes/grades that distort incentives.  

  #### **4. Sequencing Wrinkle**  
  **Chair’s Instruction (Printed on Charter)**:  
  > "Vote premises in order P→Q→R. If a premise fails (N), you have two options:  
  > 1. Stop and record ‘No Debar’ immediately.  
  > 2. Continue voting on remaining premises.  
  > Your panel must choose an option before voting on P."  

  **When Panels Ask for a Rule**:  
  Say: "The charter delegates this to the chair’s discretion. Your panel must interpret it." Forces groups to confront procedural arbitrariness.  

  #### **5. Second Round: Strategic Play**  
  - **Setup**: Same evidence, but:  
    - Privately tell the **chair**: "You worry the city will face cost overruns if BoltConcrete is debarred. You want *No Debar*. You may change voting order and stop/continue rules."  
    - Privately tell **one member** (e.g., Insert B holder): "You learned Maria’s daughter has medical needs. You want No Debar, but your sincere vote is Q=Y. If others vote P=Y/R=Y, debar occurs. Voting Q=N might prevent this."  
  - **Why it works**: Students discover premise-based voting’s manipulability through role constraints, not abstract critique.  

  #### **6. Minute-by-Minute Timeline**  
  - **0:00–5:00**: Distribute charter + shared dossier. Students read. (5 min)  
  - **5:00–10:00**: Distribute private inserts. Students read alone. (5 min)  
  - **10:00–25:00**: **Round 1**—Discussion + voting. Chairs enforce P→Q→R order. (15 min)  
  - **25:00–30:00**: Panels write justifications. Rotate for scoring. (5 min)  
  - **30:00–35:00**: Collect tallies. Distribute Round 2 role notes (chair + one member). (5 min)  
  - **35:00–50:00**: **Round 2**—Discussion + voting. Chairs may alter order/stop rules. (15 min)  
  - **50:00–55:00**: Justifications + scoring. (5 min)  
  - **55:00–65:00**: **REVEAL**: "Today, every panel applied one rule: Debar iff P∧Q∧R. But some reached different verdicts by voting premises vs. conclusion. This is the *doctrinal paradox*. Let’s map results..." Show divergence on whiteboard. (10 min)  
  - **65:00–80:00**: **Debrief** (follow order in Req 8). (15 min)  
  - **80:00–85:00**: **Meta-vote**: "Which method should the charter adopt: Premise-based or conclusion-based?" (5 min)  
  - **85:00–90:00**: Discuss meta-vote: "This vote avoided the paradox because it’s one question. But if we aggregated multiple principles, it could recur." (5 min)  

  #### **7. Printable Texts**  
