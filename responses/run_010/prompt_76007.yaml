  **3. Stakes-and-Scorekeeping**  
  Your idea: reason-coherence score. After voting, each panel writes a justification, and another panel scores whether it uses only the findings they voted on.  
  - **Improvement**: To ensure sincerity, we add that the justification must cite specific evidence from the dossier or their insert. The scorer checks for:  
    - Internal consistency: If the verdict is no debar, it should be because at least one premise is N, and they must state which.  
    - Evidence grounding: Each finding must be supported by evidence they had.  
  - **Mechanics**:  
    - After voting, each panel has 3 minutes to write a justification.  
    - Then, rotate the justifications to another panel (e.g., panel 1 scores panel 2, etc.).  
    - Scorecard (0-2 points):  
      - 1 point if the justification uses only the evidence available to the entire panel (shared dossier) or the member's private insert (but the scorer doesn't know which insert they had). Wait, the scorer doesn't know what evidence they had.  
    **Problem**: The scorer cannot know what private insert the writer had, so they can't check if a member is fabricating evidence.  

    **Revised**: The justification must be based on the findings and the evidence they explicitly cite. The scorer only checks if the reasoning from the cited evidence to the findings to the verdict is coherent.  
    Example: "We find P=Y because [evidence], Q=N because [evidence], R=Y because [evidence]. Since Q=N, we vote no debar." → coherent.  
    If they say: "We vote no debar because the firm is small" → incoherent, not based on findings.  

    **Scorecard**:  
    > **Coherence Score (0-2)**:  
    > 2: Justification uses only the three premises and the charter rule, with findings clearly leading to the verdict.  
    > 1: Minor leap (e.g., assumes a premise without evidence).  
    > 0: Unrelated to premises or charter.  

    But this doesn't prevent insincere voting, only incoherent justification.  

    **Why it keeps them honest**: If a member votes against their belief to manipulate outcome, their justification might be incoherent or hard to write. For example, if they vote P=Y without evidence, they can't justify it. The threat of low score encourages voting based on evidence.  

    **Announcement**: "After voting, your panel will publish a written justification. Another panel will score it for coherence (0-2). High scores contribute to your group's standing in the class exercise." (No grade impact, but peer pressure.)  

  **4. Sequencing Wrinkle**  
  Chair's instruction:  
  > "As chair, you must conduct votes in the order P→Q→R. After each vote, if the finding is negative, you have two options:  
  > - Option 1: Continue voting on the remaining premises.  
  > - Option 2: Stop and record the verdict as 'no debar' without voting on remaining premises.  
  > You may choose either procedure. If you choose to stop, record the unvoted premises as 'not reached'."  

  This forces a decision. When a panel asks you to rule, say: "The charter gives the chair discretion. You must decide as a panel which option to take."  

  **5. Second Round**  
  - **Setup**: Redistribute inserts within the same panel, so that one member is pivotal and has an incentive to vote insincerely. Example:  
    - In round 1, the panel had a divergent vote (say, debar by premises, no by conclusion).  
    - For round 2, give the same case but with new instructions to the chair only (privately):  
      > "In this round, you are concerned that the firm will cause more problems if not debarred. You want debarment. You may choose the voting order and whether to stop after a negative vote to influence the outcome."  
    - To one member (quietly, by a note):  
      > "You are the firm's friend. You believe the firm should not be debarred, but you know that if you vote P=Y, Q=Y, R=N, the premises might lead to debarment. If you vote R=Y sincerely, the verdict might be debarment. If you vote R=N insincerely, the verdict might be no debar."  

    But this might be too heavy-handed.  

    Instead:  
    - The case is the same, but the panel is told: "Assume new evidence has been found that is available to all." Then give a new shared insert that resolves one premise.  
    - But then it might change beliefs.  

    Better:  
    - Round 2 uses the same evidence, but the chair is privately instructed:  
      > "You have a strong preference for no debarment. You may choose the order of voting (P, Q, R in any order) and whether to stop after a negative vote."  
    - And to one member (e.g., the one who had insert C in round 1), give a new private instruction:  
      > "You have learned that if the firm is debarred, Maria Gonzalez will lose her job and her daughter's medical insurance. You believe the firm should not be debarred, but your sincere vote on R would be Y, which might lead to debarment. You are considering voting R=N to prevent debarment."  

    This creates tension. The member might vote strategically.  

    **Logistics**: After round 1, collect the inserts. For round 2, give the same inserts back, but with the private instruction to one member and the chair instruction.  

  **6. Timeline (90 minutes)**  
  - 0:00-0:05: Distribute materials. Students read charter and shared dossier. (5 min)  
  - 0:05-0:10: Distribute private inserts. Students read insert alone. (5 min)  
  - 0:10-0:25: **Round 1 discussion and voting**. Panels discuss and vote on premises and conclusion. Chair manages order. (15 min)  
  - 0:25-0:30: **Justification writing**. Each panel writes justification. (5 min)  
  - 0:30-0:35: **Scorekeeping**. Rotate justifications, score. (5 min)  
  - 0:35-0:40: Collect tally sheets. Distribute Round 2 materials (same evidence, plus private notes to one member and chair per panel). (5 min)  
  - 0:40-0:55: **Round 2 discussion and voting**. (15 min)  
  - 0:55-1:00: **Justification and scoring** for round 2. (5 min)  
  - 1:00-1:30: **Debrief and reveal** (30 min)  

  **7. Debrief Script**  
  - Start: "Let's see what happened. How many panels had debarment by premise-based? By conclusion-based?" Map to board.  
  - Then: "In panels [X], the two methods diverged. Why?" Let students describe.  
  - Concepts in order:  
    1. **Premise-based vs. conclusion-based**: "Some groups voted on each factual finding (premises) and then applied the rule. Others voted directly on the bottom line. Which feels more natural? Why?"  
    2. **Group inconsistency**: "In the divergent groups, the group's set of findings (P=Y, Q=Y, R=Y) was inconsistent with the verdict some individuals wanted, even though each individual had a consistent set."  
    3. **Epistemic case for premises**: "Premise-based voting might be better when members have different information (as you did) because it pools knowledge. But the price is that the group's verdict might not reflect any member's view."  
    4. **Impossibility theorem**: "It turns out that no voting system can always output a consistent group judgment that also meets some fair conditions. What you saw is one instance; there's a general proof that it's unavoidable in some cases."  
    5. **Responsibility for verdict**: "When the group's verdict isn't held by any member, who is responsible? In law, appellate courts face this: they might agree on the outcome but for different reasons."  
  - **Meta-vote**: "Now, vote: Should the charter adopt premise-based or conclusion-based aggregation?" Then: "Notice: this meta-vote is on a single question, so it's not exposed. But if we had to vote on multiple principles, it might be."  

  **8. Predictable Problems**  
  - **Panel reaches agreement**: Likely in control groups or if they share inserts. Response: "That's fine; it shows that with full information, the paradox may not arise."  
  - **Student refuses to vote insincerely**: In round 2, some won't strategic vote. Response: "That's okay; the exercise is to see the temptation, not to force it."  
  - **Panel diagnoses and votes conclusion only**: "The charter requires voting on premises. You must at least record your individual premise votes."  
  - "Wording artifact": "Yes, the way we define the premises matters. But in real cases, breaking down the decision is common and often required by law."  
  - **Panel invents a fourth procedure**: "Interesting! But for consistency, please follow the charter procedure this time. We'll discuss alternatives later."  

  **9. What the Activity Cannot Reproduce**  
  - **Persistence over time**: The activity is one case. In reality, groups make many decisions, and inconsistency across cases can bite.  
  - **Generality of impossibility**: One instance doesn't prove the theorem; it's an illustration.  
  - **Deliberation changing beliefs**: In reality, discussion might resolve disagreement, dissolving the dilemma. Is that a solution? It depends on whether you value the deliberative process.  
  - **Real stakes**: No one's job is actually at risk, so the moral weight is simulated.  

  Given the complexity, we proceed with the design as outlined. The full printable texts are below.  

