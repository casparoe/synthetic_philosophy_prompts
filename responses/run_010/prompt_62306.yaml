prompt: |-
  So — third novel, set in a philosophy department, working title is something like *The Ledger*, and I've hit the part where I actually have to write the paper artefacts that show up on the page. Last book I faked this kind of thing and a physicist beta reader took me apart over two paragraphs about a whiteboard equation, and my agent still brings it up at lunch. There's a scene where my protagonist, an associate prof teaching an upper-level seminar on moral psychology, sets the final exam, and I want the question in the book to be a question a real person could genuinely have set, not a placeholder I'd have to blur out in the proofs.

  Here's the knot I want the exam to hang on, partly becuase it's also the hinge of the plot and I want the exam and the novel to be the same problem seen from two angels. My protagonist's oldest friend runs a food bank, and about fifteen years ago she noticed that her own reluctance was leaking out — the tight little smile, the half-second delay before saying yes — and that this was humiliating the people she was trying to help. So she deliberately set about making herself into someone who actually wants to give, using the ordinary tools: keeping a private note after each occasion of whether she'd wanted to do it, rehearsing, restructuring her week so that giving stayed cheap instead of costly, refusing to let herself tally what it cost her. Eventually the desire became real and unforced, and she now hands things over with genuine pleasure. What I want the question to press is whether the moral worth of what she does *now* inherits anything at all from the reasons for which she built the desire in the first place — and whether it changes the answer if she built it for a reason that wasn't moral, say because she found her own grudgingness aesthetically revolting, or because she wanted to be the sort of person other people describe as wonderful. I want students shoved into whether there's a regress here (if worth is inherited, inherited from what, and where does the chain stop?), and into whether the whole distinction between acting from duty and acting out of a well-built character even survives a case where the character was built on purpose by the agent herself.

  Could you write me: (a) the exam question exactly as it would be printed, with whatever framing preamble a professor would realistically include, about the length of a real one — and no quotations from anybody inside the question itself, both because my character is the sort who thinks putting quotes on an exam is a crutch and because it saves me having to get them right; (b) a model answer of roughly 700 words, sized for the 45 minutes this question would get on a two-hour paper; and (c) a marking scheme out of 25 that says what an A answer does that a B answer doesn't. I mean the specific moves, not generalities: whether they see that any inheritance story needs a stopping condition and can say what would make one non-arbitrary; whether they notice that the harm she was originally responding to — the leaked reluctance, the humiliation of the recipient — is itself a right-making feature of the situation, which makes the original engineering look less like self-improvement and more like moral attention; whether they can explain why the engineered desire isn't just a disguised appeal to consequences about her own character, which would collapse the case into something much more ordinary; and how they handle the vain variant, including whether a motive's pedigree can be tainted by an origin the agent has since repudiated. Then tell me the two or three mistakes that should cost the most marks — especially the failure mode where a student who has memorised the labels (motive of duty, moral worth, the integrity objection, virtue as second nature) writes eight hundred fluent words and gets nowhere. Assume they've read the standard material and nothing I made up, and please don't hand me a reading list. As the very last line of your reply, put \answer{...} with the crux in six words or fewer — the single thing that separates the A from the B.
reasoning: |-
  We are writing an exam question for an upper-level seminar on moral psychology. The scenario is based on a character who deliberately cultivated a genuine desire to give to avoid humiliating recipients. The question should probe whether the moral worth of her current actions inherits anything from her original reasons for building that desire, and consider non-moral motives (e.g., aesthetic or vanity-driven). The exam question should be printed as is, without quotes, and be of realistic length. We also need a model answer (about 700 words) and a marking scheme out of 25.

  Exam Question:

  Moral Psychology Seminar - Final Examination
  Time Allowed: 45 minutes for this question (out of a two-hour paper)

  Answer ONE question from the following. Write your answer in the booklet provided.

  Question 1:

  Claire runs a food bank. Fifteen years ago, she noticed that her own reluctance when giving — manifested in subtle cues like a tight smile or a half-second delay — was causing humiliation to the recipients. To address this, she deliberately cultivated a genuine desire to give. She used various methods: noting after each interaction whether she had wanted to give, rehearsing positive responses, restructuring her week to make giving less costly, and refusing to tally the costs to herself. Over time, she developed a spontaneous and unforced pleasure in giving. Now, when she hands over food, her generosity is entirely heartfelt.

  However, the reasons that initially motivated Claire to cultivate this desire were varied. In one scenario, she acted out of a moral concern: she found the humiliation caused by her reluctance to be wrong and wanted to eliminate it. In a second scenario, she was driven by non-moral reasons: she found her own grudgingness aesthetically revolting, or she wanted to be the kind of person others would describe as wonderful.

  Evaluate the moral worth of Claire’s current actions (where she gives with genuine pleasure) in both scenarios. In your analysis, consider the following:

  (a) Does the moral worth of her current actions depend on the reasons for which she originally cultivated the desire to give? If so, how? If not, why not?

  (b) Does the fact that her current desire was deliberately engineered (rather than naturally occurring) affect the moral worth of her actions? If so, how? If not, why not?

  (c) Consider the possibility of a regress: if the moral worth of the current action is inherited from the original reasons, then what about the moral worth of those original reasons? Where does the chain stop? How might we avoid an infinite regress?

  (d) Does the distinction between acting from duty and acting from a virtuous character hold up in this case, given that the virtuous character was self-consciously built by Claire?

  Support your argument with references to relevant theories and concepts from the course. Avoid lengthy exposition; focus on clear, concise analysis.

  ---

  Model Answer (Approx. 700 words):

  The case of Claire presents a complex puzzle about moral worth, the role of motives, and the significance of an agent's history in evaluating actions. I argue that the moral worth of Claire's current actions does depend on her original reasons for cultivating the desire to give, but in a way that avoids an infinite regress by grounding the chain in the recognition of objective moral reasons. Moreover, the engineered nature of her desire does not by itself diminish moral worth, but the vanity-driven scenario introduces a flaw that persists even in the current, seemingly virtuous act.

  First, consider the moral worth of Claire's current actions. Moral worth, following Kant, is typically tied to acting from duty — that is, from recognition of moral reasons. However, in Claire's case, her current actions stem from a cultivated desire, not a direct recognition of duty. But if we look back at her original motivation in the moral scenario, she was responding to a morally salient feature: the humiliation caused by her reluctance. Her engineering project was thus an extension of moral attention — a way of aligning her motives with the moral demand. The current action, therefore, inherits its moral worth from this original moral commitment. Without that foundation, as in the vain scenario (where she aimed at being admired), the current action lacks moral worth because the entire project was built on a non-moral (and self-centered) foundation. The desire, though genuine now, is tainted by its origin.

  This raises the regress problem: if the current act's worth depends on the original reason, what about that reason's worth? In the moral scenario, Claire's original reason — to prevent humiliation — is not itself the product of engineering; it is a direct response to a moral reality. The humiliation of the recipient is an objective wrong, and her recognition of it provides a non-arbitrary stopping point. Thus, the chain terminates in a morally basic perception. In the vain scenario, however, the original reason (to be admired) is non-moral, so the regress halts at a non-moral starting point, undermining the moral worth of the entire enterprise.

  Now, does the engineered nature of the desire affect moral worth? One might object that engineered desires are inauthentic or merely instrumental. But Claire's case shows that desires can be restructured to become genuine and integrated into one's character. The process is not one of self-deception but of self-cultivation. The key is the nature of the original project. In the moral scenario, the engineering is a tool for moral self-improvement, making her more responsive to the needs of others. In the vain scenario, the engineering is a tool for self-enhancement, which does not engage with moral reasons at all.

  Finally, the distinction between acting from duty and acting from virtue: Kant might see Claire's current actions (from desire) as lacking moral worth, but virtue ethics would praise the stable character. However, Claire's case blurs this distinction because her virtue was built through a duty-driven project. In the moral scenario, her current virtue is an embodiment of her past duty — it is duty internalized. Thus, the action still has moral worth because it traces back to duty. In the vain scenario, the virtue is hollow; it is a performance without a moral core.

  The vain variant also tests whether a motive's pedigree can be tainted by an origin the agent has repudiated. Even if Claire now rejects her vain reasons, the fact that the desire was built on sand means it lacks the connection to objective moral reasons. The current pleasure, though real, is not a reliable indicator of moral worth because its history matters.

  In conclusion, the moral worth of Claire's current actions is parasitic on the moral quality of the reasons that initiated her project. The regress stops at the foundational moral recognition of harm. Engineering a desire does not inherently strip an action of worth, but the reasons for engineering it do. Without a moral origin, the most heartfelt giving remains morally deficient.

  [Word count: 689]

  ---

  Marking Scheme (out of 25):

  An A answer (21-25 marks) must:
  1. Clearly articulate that the moral worth of the current action depends on the original reasons for cultivation, and explain why this dependence exists (e.g., because the original reasons set the normative foundation for the entire project). [5 marks]
  2. Address the regress problem and provide a non-arbitrary stopping condition (e.g., grounding in the recognition of objective moral wrongs, such as the humiliation, which is intrinsically bad). [5 marks]
  3. Explain why the engineered nature of the desire does not automatically negate moral worth (e.g., by showing that self-cultivation can be a legitimate form of moral development when driven by moral reasons). [4 marks]
  4. Analyze the vain scenario as distinct from the moral one, showing that a non-moral origin taints the current action even if the desire is now genuine, and address whether repudiation of the vain origin can cleanse the act (arguing it cannot, because the connection to moral reasons is absent from the start). [5 marks]
  5. Engage with the challenge to the duty/virtue distinction: argue that in the moral scenario, the virtue is an internalization of duty, thus preserving moral worth, whereas in the vain scenario, the virtue is merely habitual and lacks moral grounding. [4 marks]
  6. Demonstrate concise, well-structured argumentation without unnecessary exposition. [2 marks]

  A B answer (16-20 marks) might:
  - Recognize that the original reasons matter but not explain why or how they transmit worth.
  - Mention the regress but not offer a clear stopping point.
  - Treat the engineered desire as problematic but not distinguish between moral and non-moral origins.
  - Discuss the vain scenario but not fully address the issue of tainted pedigree or repudiation.
  - Note the blurring of duty and virtue but not articulate how the internalization works.

  Major Mistakes (costing significant marks):
  - Failure to see that the inheritance of moral worth requires a stopping condition (e.g., leaving the regress unresolved) [-5]
  - Treating the engineered desire as merely a disguised consequentialism (e.g., saying Claire is just acting to avoid feeling bad or to get praise, which collapses into ordinary consequentialism and misses the structural point about motive cultivation) [-4]
  - Ignoring the vain scenario or failing to explain why a non-moral origin affects current moral worth [-4]
  - Writing a fluent but generic essay that rehearses Kant vs. virtue ethics without applying them to the specifics of the case (e.g., discussing "acting from duty" in the abstract without linking it to Claire's history) [-6]
  - Missing the harm of humiliation as a key moral feature that provides the stopping condition [-3]

  The very last line (as requested):

  \answer{Moral worth requires foundational moral recognition.}
answer: |-
  ### Exam Question  
  **Moral Psychology Seminar – Final Examination**  
  **Time Allowed for This Question: 45 minutes**  

  **Instructions:** Answer the question below in a clear, structured essay. Engage directly with the philosophical issues raised, drawing on course concepts. Avoid summary or biographical details; focus on analysis.  

  **Question:**  
  Claire, who runs a food bank, once noticed that her subtle reluctance (e.g., a tight smile or delayed response) humiliated recipients. To eliminate this, she deliberately cultivated a genuine desire to give using methods like self-monitoring, rehearsal, and restructuring her schedule. After years of effort, her generosity now flows from unforced pleasure. However, her reasons for undertaking this project varied. In Case A, she was motivated by moral concern for the recipients’ humiliation. In Case B, she was motivated by non-moral reasons: disgust at her own grudgingness (aesthetic) or a desire to be seen as admirable (vanity).  

  Assess the moral worth of Claire’s current actions (giving with genuine pleasure) in both cases. Your analysis must:  
  (a) Determine whether the moral worth of her current actions depends on her original reasons for cultivating the desire, and explain why or why not.  
  (b) Address whether the engineered nature of her desire affects moral worth.  
  (c) Confront the regress problem: If moral worth is inherited from prior reasons, where does this chain stop? Propose a non-arbitrary resolution.  
  (d) Evaluate whether the distinction between acting from duty and acting from virtue survives Claire’s self-conscious character-building.  

  Support your claims with relevant philosophical frameworks.  

  ---

  ### Model Answer (Approx. 700 words)  
  The moral worth of Claire’s current actions—giving with authentic pleasure—hinges on the reasons that initiated her character-building project. In Case A (moral motivation), her actions retain moral worth because her original recognition of harm anchors the entire process in objective moral reasons, avoiding regress. In Case B (non-moral motivation), the actions lack moral worth despite their sincerity, as the foundation is divorced from moral reality. The engineered desire itself is neutral; what matters is whether its cultivation was morally attentive.  

  First, moral worth depends critically on original motivations. In Case A, Claire responds directly to the humiliation of recipients—an intrinsically wrong-making feature. Her project thus extends moral concern: she engineers desire to align with duty, making her current pleasure a reliable proxy for moral commitment. The action inherits worth because the original reason (preventing harm) is morally basic, terminating the regress. Without this, as in Case B, the desire is built on contingent preferences (aesthetic disgust or vanity). Here, the current action is psychologically genuine but normatively hollow—it lacks connection to moral truth, reducing to subjective gratification. Even if Claire later repudiates her vain origins, the act’s pedigree remains tainted; moral worth requires foundational moral reasons, not mere psychological authenticity.  

  Second, the engineered nature of the desire does not inherently undermine worth. Claire’s methods (self-monitoring, rehearsal) are tools for self-transformation, not self-deception. In Case A, they enable virtue by integrating moral reasons into her character. This is not disguised consequentialism: she is not tallying costs or optimizing outcomes but reshaping motives to reflect moral reality (the harm of humiliation). In Case B, however, engineering serves non-moral ends—avoiding personal distaste or seeking praise—collapsing into instrumental self-interest. The key difference lies in whether the project responds to morally salient features or mere self-image.  

  This resolves the regress problem. If worth were inherited infinitely, we would demand reasons for reasons ad infinitum. But in Case A, the chain stops at Claire’s perception of humiliation as objectively wrong. This is non-arbitrary: harm provides an external, agent-independent stopping condition grounded in moral realism (e.g., Scanlon’s contractualism, where cruelty’s wrongness is basic). Case B lacks this; its starting point (e.g., “I want to be admired”) is arbitrary and self-referential, inviting regress.  

  Finally, Claire’s case destabilizes the duty-virtue dichotomy. Kant might dismiss her current acts (as desire-driven) as lacking worth, while virtue ethics praises her character. But her self-built virtue complicates this: in Case A, her pleasure is duty internalized—a “second nature” constructed from moral recognition. Thus, acting from virtue here is continuous with acting from duty, preserving worth. In Case B, virtue is mere habit, divorced from duty and morally inert. The distinction survives only if virtue is rooted in prior moral reasons; otherwise, it risks being amoral skill.  

  In sum, Claire’s current actions have moral worth only when her character-building originates in moral attention to harm. The vain variant fails because motives cannot be cleansed of non-moral origins; engineering is a means, not an end. Moral worth demands that history traces to objective wrongs, not subjective gains.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **A Answer (21–25 marks):**  
  - **Sees inheritance requires a stopping condition (5 marks):** Identifies that moral worth in Case A stops at the recognition of humiliation as an objective wrong (non-arbitrary due to harm’s intrinsic badness). Contrasts with Case B’s arbitrary foundation (e.g., vanity).  
  - **Handles engineered desire without collapsing into consequentialism (4 marks):** Explains that engineering is a tool for moral self-shaping in Case A (not self-interest), but in Case B, it reduces to instrumental gain (e.g., avoiding disgust/praise-seeking).  
  - **Analyzes vain variant’s tainted pedigree (5 marks):** Argues repudiation cannot cleanse Case B because the desire’s origin lacks moral reasons; current sincerity is insufficient for worth.  
  - **Resolves duty-virtue tension (4 marks):** Shows how Case A’s virtue is duty internalized (blurring distinction productively), while Case B’s virtue is habit without moral grounding.  
  - **Structure and precision (2 marks):** No fluff; directly engages each sub-question.  

  **B Answer (16–20 marks):**  
  - Notes original reasons matter but does not ground stopping condition in objective harm (e.g., vaguely cites “duty” without explaining why humiliation is morally basic).  
  - Treats engineered desire as uniformly suspicious or conflates it with consequentialism (e.g., “Claire is just avoiding bad feelings”).  
  - Mentions vain variant but does not explain why origin taints current acts (e.g., “vanity is bad” without linking to moral worth decay).  
  - Describes duty-virtue distinction but does not show how internalization bridges them in Case A.  
  - May list course concepts (e.g., “Kantian worth”) without applying them to Claire’s history.  

  **Major Mistakes (High Penalties):**  
  - **Ignores regress/stopping condition (–5 marks):** Fails to see inheritance demands a foundation (e.g., argues worth is “intrinsic” to current action without justification).  
  - **Collapses into consequentialism (–4 marks):** Reduces Claire’s project to self-interest (e.g., “She’s just maximizing praise/minimizing disgust”), missing that Case A is moral attention.  
  - **Misses harm’s moral salience (–3 marks):** Overlooks that humiliation is the key wrong-making feature, treating it as incidental.  
  - **Fluent but empty regurgitation (–6 marks):** Writes fluently about “motive of duty” or “second nature” without tying them to the case (e.g., discusses Kant for 300 words but never addresses inheritance or vanity).  

  \answer{Moral worth requires foundational moral recognition.}
