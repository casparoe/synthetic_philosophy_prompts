answer: |-
  Here’s a Q&A prep sheet tailored to your audience and thesis, ordered by potential damage level (high to medium), with concise replies, strategic concessions, and vulnerability notes. The nightmare question is at the end.

  ### **Top-Tier Objections (High Damage Potential)**
  1. **Identification Problem & Causality**  
     *Objection:* "How do you *prove* accountability structures *cause* lower famine mortality? Isn’t this just correlation? What about omitted variables (e.g., market integration, infrastructure)?"  
     **Concession first:** "You’re right—establishing causality in historical settings is inherently messy."  
     **Reply (2-min):** "I use process-tracing: cases like 19th-century India (colonial vs. princely states) show similar climate shocks but divergent outcomes under different accountability. The key is *policy rigidity*: low-accountability states (e.g., Bengal 1943, GLF) persisted with harmful policies (export bans, procurement quotas) despite local warnings. High-accountability cases (e.g., post-1850s India droughts) saw faster course-correction. The mechanism is *information flow and sanction risk*, not just democracy."  
     **Soft spot:** Hard to quantify "accountability pressure"; relies on narrative evidence.

  2. **Counterfactual Baseline**  
     *Objection:* "Your ‘accountability’ lens assumes rulers *could* have acted differently. But what’s the baseline? Pre-industrial states lacked capacity to prevent famines regardless of accountability."  
     **Concession first:** "Absolutely—no one claims Ming China could achieve Singaporean famine resilience."  
     **Reply:** "My baseline is *contemporaneous variation*: why did some states (e.g., British India post-1870s, 18th-century Qing China) reduce famine deaths *before* modern tech? Why did similar-capacity states (e.g., Ireland vs. Scotland 1840s) diverge? Accountability explains why existing tools (granaries, relief codes) were deployed or ignored."  
     **Soft spot:** Ignores long-term capacity constraints; risks presentism.

  3. **Testability vs. Sen Redux**  
     *Objection:* "Isn’t this just Amartya Sen’s ‘democracy prevents famine’ with jargon? How is ‘accountability’ falsifiable? Show me a regression."  
     **Concession first:** "Sen’s insight is foundational, but I’m pushing further."  
     **Reply:** "Sen focused on electoral democracy. I track *non-electoral* accountability: Bengal had elections but no famine prevention (landowners could veto taxes for relief). Qing China had censorial institutions that moderated famines pre-1850. Testability: 1) Predict *policy reversal speed* under duress; 2) Use principal-agent frameworks (e.g., local officials hiding deaths in GLF vs. Irish Poor Law inspectors). Metrics: archival evidence of elite sanctions (e.g., promotions withheld, protests)."  
     **Soft spot:** "Accountability" is less tidy than Sen’s democracy variable.

  ---

  ### **Medium-Tier Objections (Survivable but Require Care)**
  4. **Chinese Data Reliability**  
     *Objection (from mortality demographer):* "GLF mortality estimates vary wildly. How can you assert provincial accountability differences when data is politicized/missing?"  
     **Concession first:** "Data gaps are severe—I don’t trust any single GLF mortality number."  
     **Reply:** "I use *relative* provincial outcomes: why did Anhui suffer worse than Guangdong under similar drought? Archival work shows Guangdong’s provincial leaders (Tao Zhu) secretly criticized Mao, diverted grain, and were later purged—a costly signal of accountability pressure. Anhui’s leaders (Zeng Xisheng) over-reported grain, worsening famine. We can track policy choices even when death tolls are fuzzy."  
     **Soft spot:** Relies on contested provincial narratives; no smoking-gun data.

  5. **Irish Grain Exports**  
     *Objection (economic historian):* "You dismiss exports as irrelevant, but O’Rourke showed exports fell post-1846. Isn’t your ‘unaccountability’ just a synonym for Treasury ideology?"  
     **Concession first:** "Exports alone didn’t cause famine—I agree with Mokyr’s entitlement collapse view."  
     **Reply:** "But why did London reject Irish pleas to halt exports *even temporarily* in 1846-47? Unaccountability: Irish voters couldn’t punish Westminster (Catholics couldn’t vote), and English taxpayers/elites prioritized laissez-faire orthodoxy over Irish lives. Contrast with 1782-83 Bengal famine, where East India Company reversed exports after shareholders feared profit loss."  
     **Soft spot:** Overlaps with ideological explanations; exports were symbolic but not caloric key.

  6. **Proximate Causes Matter Too**  
     *Objection:* "Aren’t you replacing one reductionism (FAD/entitlements) with another? What about war, crop disease, or transport networks?"  
     **Concession first:** "Proximate triggers are essential—I’m not denying their role."  
     **Reply:** "But they don’t explain variance: Bengal had better infrastructure than 1840s Ireland but worse famine. The Great Leap had no external war/crop failure. Accountability determines whether states *mitigate* proximate causes. E.g., 1896-97 India had worse drought than Bengal 1943 but far fewer deaths due to accountable relief systems."  
     **Soft spot:** Downplays unique contingencies (e.g., WWII in Bengal).

  7. **State Capacity Confound**  
     *Objection (political scientist):* "Isn’t ‘accountability’ endogenous to state capacity? Strong states can build accountability mechanisms; weak states can’t."  
     **Concession first:** "Capacity and accountability are often linked, but not always."  
     **Reply:** "Qing China had high capacity but famine mortality rose as accountability eroded post-1850 (corruption, censors weakened). British India had capacity but withheld it in Bengal 1943 due to wartime priorities—a choice enabled by low accountability. Meanwhile, weak but accountable states (e.g., early colonial Massachusetts) averted famine via community pressure."  
     **Soft spot:** Hard to disentangle empirically; risks circularity.

  ---

  ### **The Nightmare Question (Hope Nobody Asks)**  
  **"Why do accountability structures emerge at all? If rulers rarely face costs for famine, why did any society ever develop them?"**  
  *Why it’s deadly:* Forces you into unsupported grand theory about state formation, distracting from your core argument.  
  **Defensive Reply:** "That’s beyond this paper’s scope, but provisionally: they emerge from elite competition (e.g., English Parliament vs. Crown), fiscal demands (e.g., war requiring broad taxation), or legitimizing ideologies (e.g., Confucian ‘mandate of heaven’). My focus is *how* they function once they exist."  
  **Evasion Tactic:** "I’m happy to discuss historical origins offline, but for now, I’ll note that once established, accountability can persist independently—e.g., in British India despite colonial autocracy."

  ---

  ### **Delivery Tips**
  - **Lead with concessions** to disarm critics.  
  - **Anchor replies in cases**—this audience respects granularity.  
  - **Use their jargon:** "principal-agent," "endogeneity," "process-tracing."  
  - **Soft spots:** Acknowledge them openly to preempt follow-ups ("I admit this is hard to quantify, but the pattern holds across cases...").  
  - **China/Ireland:** Expect the heaviest fire—rehearse archival specifics.  

  This prep forces engagement on *your* terms: shifting debate from "intent vs. nature" to the mechanics of state response. Good luck!
