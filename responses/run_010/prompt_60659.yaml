answer: |-
  The air in the Boundary Office hung thick with dust motes and quiet desperation. Outside, the city rumbled under a grey sky. Inside, beneath flickering fluorescent tubes, Aris pushed another petition form across the chipped laminate of his desk. Form 7B: *Petition for Cohort Reassignment (Cusp Cases)*. Triplicate. Always triplicate.

  His job, technically speaking, was Temporal Demarcation Clerk, Grade II. Practically, he was a gatekeeper of fate defined by the stroke of a pen on an official calendar. The Office didn’t study generations; it *made* them. A line drawn at midnight on a chosen date cleaved the population into Stalwarts or Framers, Echoes or Anchors – names changed with bureaucratic whims, but the consequences were eternal. School admissions, mandatory service rosters, pension tiers, property tax brackets – all hinged on which side of the arbitrary, state-sanctioned line you fell.

  Today was a "Redrawing." Not of the current boundary, but of one two decades old – the split between the "Lodestone" cohort (supposedly resilient, duty-bound) and the "New Current" cohort (supposedly adaptive, tech-savvy). New socio-economic modelling, the higher-ups claimed, necessitated a slight adjustment. The cut-off was shifting from January 1st, 2004, to December 31st, 2003. A single day’s difference, shunting thousands overnight.

  Hence the queue. Snaking out of Aris’s small, overheated booth (the heater rattled ominously, stuck on high despite the season) and down the drab corridor, clutching their triplicate pleas. Each petitioner born in the three days straddling the new line – December 31st, 2003, January 1st, 2004, January 2nd, 2004 – sought reassignment. Mostly, they wanted the *older* Lodestone designation. Lodestones got earlier pension vesting and marginally lower conscription risk for their children. New Currents faced longer waits and the dreaded "Adaptive Service" modules rumoured to involve lunar hydroponics.

  The queue was managed by a dispenser spitting numbered tickets. Aris processed them mechanically: stamp, initial, file, repeat. Supervisor Varn only cared about throughput, his voice crackling intermittently over the intercom: "Maintain velocity, Clerk Thorne. Lunch break at 12:30 sharp."

  Then came Ticket #47. Elara Vanya. Born: January 1st, 2004, 00:15 AM. Seeking: Reassignment to Lodestone.

  Her reason wasn't the usual grumbling about pensions. Attached was a faded hospital record. Twin sister, Livia Vanya. Born: December 31st, 2003, 11:58 PM. Two minutes apart. Midnight fell between them. Livia, by the original boundary, was Lodestone. Elara, New Current. Their childhoods were mirror images: same streets, same schools, same friends. Then, at sixteen, the divergence. Livia entered the Lodestone vocational stream, guaranteed apprenticeship. Elara, classified New Current, was shunted into the "adaptive readiness" program – a hodgepodge of generic skills training, endlessly deferred. Livia was now a certified grid technician. Elara worked temp jobs, her potential perpetually on hold, separated from her twin by an invisible, bureaucratic wall. "We shared a womb," her petition stated simply, "but the state split our lives. Please, let us be Lodestones together."

  Aris felt a familiar, unwelcome pang. He stamped the form: *Received*. Noted her file. Procedure.

  Ticket #48 was Kael Brenner. Born: January 1st, 2004, 00:05 AM. Seeking: Reassignment to Lodestone.

  His petition was rambling, ink-blotted. He’d missed the Lodestone conscription lottery by five minutes. Drafted into New Current service, he’d been assigned to a remote bio-dome maintenance unit. "Got the lung blight from the spore filters," he wheezed, leaning heavily on Aris’s desk, smelling faintly of damp wool and medication. His pension was docked for ongoing treatment. "If I’d been born five minutes earlier, I’d be drawing full Lodestone benefits now, maybe even a service medal discount on my meds. Five minutes! It ain’t right." He coughed, a wet, rattling sound. "Just… shift me over. Make it square."

  Two petitioners. One cleaved from her twin by systemic irony, the other broken by literal bad timing. Both pleas were valid within the cruel logic of the system. Aris stamped Kael’s form: *Received*. His gaze drifted to the stack of finalized petitions awaiting data entry. A thought, cold and unwelcome, slithered in.

  He’d seen it before. After a major boundary shift, when the Office ran its first post-adjustment demographic analyses, the data always seemed… cleaner. Sharper. The supposed traits of the new cohorts – Lodestone stoicism, New Current adaptability – showed stronger statistical correlations *after* the line was drawn than the models predicting the shift had indicated. It was subtle, an artefact whispered about over lukewarm tea in the canteen. Old Man Gereth called it "the polish of precision." Aris called it unsettling. Did the classification *create* the conformity? Did knowing your cohort nudge you, invisibly, towards its stereotype? Or was it just that clerks like him, now armed with the official categories, subconsciously categorized data points differently? He could never pin it down, and mentioning it invited Varn’s displeasure or, worse, a transfer to basement archives.

  He pushed the thought away. Elara Vanya. Kael Brenner. Both wanted Lodestone. The Office didn't grant reassignments based on merit, only on *administrative error*. Birth certificates were gospel. The cut-off was absolute. Midnight. The line was the line.

  He processed a dozen more. A woman born Jan 2nd wanting New Current status to access their later-life retraining grants. A man born Dec 31st desperate to *stay* Lodestone to keep his veteran father's supplementary allowance. Each story a small tragedy bending around the immutable date.

  At lunch, Aris avoided the canteen. He sat on a cold bench in the courtyard, unwrapping a tasteless sandwich. He pulled out his pocket terminal, pulling up preliminary post-redraw data summaries flagged for review. Health indicators for the new Lodestone cohort (now including late-Dec '03 births) already showed a fractional but statistically significant uptick in markers associated with "physical resilience" compared to pre-redraw projections. For the newly defined New Currents (early Jan '04), "digital aptitude" scores in sampled youth groups were minutely higher than anticipated. It was happening again. The data was tightening around the freshly drawn line. Coincidence? Confirmation bias? Or was the Office not just *describing* generations, but somehow… *cultivating* them? The thought made the sandwich turn to ash in his mouth.

  Back at his booth, Varn’s voice grated: "Thorne. Velocity. The Brenner petition needs final disposition before end-of-day."

  Kael Brenner. The man with the blight. Aris pulled his file. The medical reports were stark. Denial was standard. The line was the line. He picked up the rejection stamp.

  Then he saw Elara Vanya’s file beneath it. The twins' childhood photo paperclipped to the petition – identical smiles, arms slung around each other. Separated not by time, but by an official decree drafted in an office much like this one.

  Aris hesitated. His eyes flicked to Kael’s petition, then to the data summary glowing faintly on his terminal screen. The Lodestones were looking sturdier already. Would shifting Kael, damaged as he was, mess with the nascent statistics? A ridiculous thought. He stamped Kael’s form: DENIED. The sound was final.

  He reached for Elara’s. Her case was equally hopeless by the rules. Born after midnight. New Current. He picked up the DENIED stamp. It hovered over the paper.

  He thought of the data tightening. Of lines becoming walls. Of twins divided. Of Kael’s wet cough echoing in the overheated booth. The heater clanked, spewing another wave of stale warmth.

  Aris put the DENIED stamp down. He picked up a pen. With meticulous, bureaucratic neatness, on the line marked *Clerk’s Notes (Internal Use Only)* on Elara Vanya’s petition form, he wrote: *Petitioner exhibits strong familial cohesion, a noted Lodestone characteristic*. Utterly meaningless. Not grounds for reassignment. Just words on a form. He stamped it: DENIED.

  He filed both petitions. Kael Brenner would receive his official notice tomorrow, a fresh denial to accompany his blighted lungs. Elara Vanya would get hers too, the note unseen by anyone but future archivists, perhaps.

  Aris pulled the next ticket from the dispenser. Ticket #49. He adjusted the slightly crooked nameplate on his desk – *A. Thorne, TD Clerk II*. Outside, the grey afternoon light was fading. The queue remained. The line held. The data, somewhere in the bowels of the Office, would continue its silent, inexplicable drift towards conformity. And Aris, the gatekeeper of arbitrary midnights, kept stamping, the heater’s rattle the only sound breaking the silence of lives bending.
