  - Rohingya evolution shows evidentiary threshold being responsive
  - Uyghur case is the bombshell - they explicitly rejected the killing requirement, focusing on birth prevention/child separation
  - The "forgotten refusal" of cultural erosion is the counterpoint, where they declined despite catastrophic group loss because no intent

  Ah, and there's the rub - the chair's attempted reconciliation (Lemkinian intent + Convention acts) feels unstable. If forced to synthesize, their precedent suggests: 
  1. They require proof of specific intent (leaked memos help) 
  2. They interpret "destroy" broadly per Uyghurs (not just killing) 
  3. BUT they draw the line at unintentional cultural loss

  For the new case: 
  - No physical destruction parallels Uyghurs rather than Rwanda 
  - Cultural bans/resettlement mirror Uyghur methods 
  - Leaked memo provides intent evidence stronger than Uyghur circumstantial case 
  - But is it really "imposing measures to prevent births" or "forcibly transferring children"? The schools stay open... 

  The user's hunch about "culturicide" is sharp. Voting "yes" would indeed stretch the Convention beyond drafters' intent - but voting "no" after their Uyghur stance reeks of hypocrisy. Perhaps the answer lies in their Rohingya approach: "possible genocide" pending authentication of that memo?

  What they really need is a test case to force clarity: imagine state-mandated sterilization of women from a minority group under the guise of "family planning" - that would pit physical vs. cultural destruction directly. But for now... 

  *checks precedents again* 
  The closest analog is actually Uyghurs - both involve systematic cultural suppression with demographic aims. If they designated that, consistency demands designation here. But the lack of child separation/birth control gives pause. Maybe crimes against humanity is the safe call? 

  No - their own rationale would trap them. The Uyghur designation explicitly said genocide doesn't require mass killing. To refuse here because there's no sterilization would contradict that. Unless... they distinguish via scale? But the memo shows equal intent. 

  *realizes the deadline pressure* 
  Right - recommendation must be actionable. I'll say: 
  - Designate as genocide with medium confidence (5/10) 
