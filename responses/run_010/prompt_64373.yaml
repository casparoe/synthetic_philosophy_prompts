prompt: |-
  ok so context: I'm a backend engineer at a mid-size studio, I work on trust & safety tooling for a persistent sandbox game (roughly 3m monthly players, player-built structures, a real economy with item trading, proximity voice chat, and some shards where people run years-long roleplay). I have zero formal philosophy background, never taken a class, so please write for someone who knows distributed systems rather than Kant. Act as an expert on the philosophy of virtual reality who has also actually shipped moderation policy at scale, and think carefully before answering rather than jumping straight to the deliverable.

  Here's the problem. Our triage rule today is basically "did the game behave as designed? if yes, close the report." Its not working. We get reports about things that broke no rule and are obviously not fine, and we also close reports where even our own gut says something real was taken from somebody, and I can't articulate to my team why one of those is different from the other. I read a summary somewhere of a philosopher (Chalmers? not sure) arguing that virtual objects are real objects and virtual harms can be real harms. I want something in that spirit, but as a procedure I can hand to a moderator, not a vibe.

  Step one, before the procedure: brainstorm like four candidate principles for when an in-game event counts as a genuine harm rather than "just pixels" — a couple of lines each, with the obvious failure case for each — then pick one (or a hybrid) and say why it survives the others. I want to see the tradeoff, not just the winner.

  Step two: the actual procedure. Ordered questions a moderator runs top to bottom, what counts as a sufficient answer at each question, where it hard-stops at "no action, close it," and where it hands the decision to a human because it's a values question and not a facts question. Also — this matters a lot for my side of the house — for each step tell me whether it's automatable from logs/telemetry or whether it needs a person, because whatever I can't automate I have to staff. And be honest about which steps are judgment calls wearing a procedure costume. Assume 10 minutes per report, moderators with no theory background, and an appeals team that will read our reasoning.

  Step three: run it on these four, showing the answers at each step, not just the verdict.

  1. A player sinks ~200 hours into a build in an open shard. A group spends a weekend dismantling it using only mechanics that are explicitly legal there, and the shard rules permit it. Reporter wants them banned. Our rules say no. Reporter says they lost something they can't get back.
  2. Long-running RP shard, both parties opted into a "no protections, anything can happen to your character" agreement. One player's character of three years is betrayed and killed in-character by someone they considered a friend. The accused says it was good roleplay and stays in character about it. The reporter says it wrecked their month and recieved no warning out of character.
  3. An avatar follows one player into every instance for six weeks. Never touches them, never sends a message, never violates a single rule. Just stands one meter closer than normal and mirrors their movement. Telemetry shows it clearly; there is no chat log to point at.
  4. This one is on us, not on a player: we patched a companion NPC's personality model, and about four thousand tickets came in saying we deleted or killed their friend. Some are offering to pay to have it reverted. Does the procedure even accept a report where the accused is the operator?

  One of these four should come out with an answer I'll hate. Don't soften it or hedge it into mush — if the procedure says close the report, say close the report.

  Hard constraints: no citations, no bibliography, no paper or book titles, no "see also." I can't look anything up and I won't, so anything you name I'd just have to take on faith. Also: tell me what this procedure can't do, where it will systematically misfire, and flag every place it quietly assumes virtual events are real events — plus what breaks in the reasoning if a teammate refuses to grant that assumption.
reasoning: |-
  We are given a complex problem that requires both philosophical grounding and practical implementation. The user is a backend engineer working on trust & safety for a persistent sandbox game. The current triage rule ("did the game behave as designed? if yes, close the report") is failing because it doesn't account for situations that, while technically within the rules, cause genuine harm to players.

  The request has three steps:

  1. Brainstorm four candidate principles for when an in-game event counts as genuine harm, each with a failure case, then pick one (or a hybrid) and justify.
  2. Create a step-by-step procedure for moderators, indicating at each step if automatable, if it's a hard stop, or if it requires human judgment. Also note where the procedure assumes virtual events are real and what breaks if that assumption is denied.
  3. Apply the procedure to four test cases, showing the reasoning at each step.

  Additionally, we must:
  - Avoid academic citations, paper titles, etc.
  - Be honest about limitations and systematic misfires.
  - Ensure one of the four test cases yields an unpopular outcome.

  ---

  ### Step 1: Candidate Principles for Genuine Harm

  We need principles that go beyond "just pixels" while being actionable. Here are four candidates:

  **Candidate 1: Intentional Infliction of Distress**
  - **Principle**: An in-game event causes genuine harm if it was intended to cause significant emotional distress and succeeded, regardless of rule-breaking.
  - **Failure Case**: Players might report distress from legitimate gameplay (e.g., losing a hard-fought battle). This principle could punish competitive but fair play.

  **Candidate 2: Violation of Reasonable Expectations**
  - **Principle**: Harm occurs when an event violates the reasonable expectations of the player in that context (e.g., a safe zone vs. a PvP area), even if no rules were broken.
  - **Failure Case**: In sandbox games, players might have wildly different expectations. This could lead to inconsistent rulings and false positives (e.g., someone expecting safety in a PvP zone).

  **Candidate 3: Deprivation of Meaningful Investment**
  - **Principle**: Harm occurs when a player loses something they invested significant time, emotion, or identity into, and the loss was avoidable and unfair (not part of the intended risk of the activity).
  - **Failure Case**: In games with permadeath or high-risk mechanics, losses are expected. This might overprotect players from core game challenges.

  **Candidate 4: Social Contract Breach**
  - **Principle**: Harm occurs when an action breaks the implicit social contract of the community (e.g., exploiting a loophole, bad faith actions), even if technically allowed.
  - **Failure Case**: Requires moderators to interpret vague "social contracts," leading to subjectivity and potential bias.

  ---

  **Selection and Justification**

  I propose a hybrid of **Candidate 1 (Intentional Infliction of Distress)** and **Candidate 3 (Deprivation of Meaningful Investment)**. We'll call it:

  **The Real Harm Principle**: An in-game event causes genuine harm if:
  - **A) Intentionality**: It was intentionally designed or executed to cause distress, *or*
  - **B) Investment Loss**: It results in the irreversible loss of something the player invested significant identity-forming time/effort into, *and* the loss was not a reasonably expected risk of the activity.

  **Why this hybrid?**
  - It balances the malicious actor (A) and the victim's experience (B).
  - It avoids punishing fair competition (Candidate 1 failure case) by requiring intent OR investment loss beyond expected risk.
  - It addresses the sandbox nature by requiring "not reasonably expected" (e.g., dismantling a build in a protected zone vs. an open shard).
  - **Tradeoff**: It requires moderators to judge intent and "reasonably expected risk," which can be subjective. But with guidelines, it's manageable.

  ---

  ### Step 2: The Procedure

  We design a decision tree for moderators. Key:
  - **Automatable?** We note what can be done by bots (using logs, telemetry) and what needs humans.
  - **Hard Stop?** Steps that can close the report immediately.
  - **Human Judgment?** Steps requiring interpretation.
  - **Appeals**: Reasoning must be clear for the appeals team.

  **Procedure: Real Harm Assessment**

  1. **Was the game functioning as designed? (Automatable: Yes)**
     - *Check*: Did the event occur due to a bug, exploit, or unintended behavior?
     - *If NO (functioning as designed)*: Proceed to Step 2.
     - *If YES (malfunction)*: This is a bug report → Route to engineering. **Hard Stop** for moderation path. Close report as "not a player conduct issue."
     - *Why automatable?*: Compare event logs against known bugs/exploits. Flag if unexpected behavior.

  2. **Did the reported action break any explicit rule? (Automatable: Partially)**
     - *Check*: Based on chat logs, telemetry (e.g., proximity, item transfers), and shard-specific rules.
     - *If YES*: Proceed to standard enforcement. **Hard Stop** for this procedure. (Moderator handles under existing rules.)
     - *If NO*: Proceed to Step 3.
     - *Automatable?*: Rules with clear triggers (e.g., hate speech in chat) can be automated. Ambiguous cases (e.g., "harassment") need human review.

  3. **Is there evidence of intentional infliction of distress? (Automatable: No)**
     - *Check*: Look for patterns indicating malice (e.g., repeated targeting, taunting messages, context of prior conflicts). Requires human judgment.
     - *If YES*: **Genuine harm**. Escalate for action (e.g., warning, suspension). **Hard Stop**.
     - *If NO or UNCLEAR*: Proceed to Step 4.

  4. **Did the event cause irreversible loss of significant investment? (Automatable: Partially)**
     - *Check*: 
       - **Significant investment**: Time (e.g., 100+ hours), emotional attachment (e.g., roleplay character, memorial build), or identity (e.g., avatar tied to self-expression). 
       - **Irreversible**: Cannot be restored via game mechanics or support.
       - **Not reasonably expected**: Was the loss outside the normal risks of the activity/shard? (e.g., in an open PvP shard, building destruction is expected; in a "safe" RP shard, it is not.)
     - *If NO*: **No genuine harm**. Close report. **Hard Stop**.
     - *If YES*: Proceed to Step 5.
     - *Automatable?*: Time investment can be logged (e.g., playtime). Emotional attachment requires player statements → human. "Reasonably expected" is context-dependent → human.

  5. **Values Judgment: Does this warrant an exception? (Automatable: No)**
     - *Check*: Even if Steps 3-4 are negative, is there a compelling case for harm? E.g., systemic issues, extreme edge cases. This is a rare override for human moderators.
     - *If NO*: Close report.
     - *If YES*: Escalate to senior staff for policy review. **Not a hard stop** — leaves room for discretion.
     - *Note*: Use sparingly to avoid inconsistency.

  **Where the procedure assumes virtual events are real**:
  - Steps 3 and 4 explicitly treat emotional distress and investment as real. If a teammate denies this, they would reject the entire procedure after Step 2, falling back to "only rule-breaking matters."

  **Systematic Limitations**:
  - **Subjectivity in Steps 3-4**: Intent and "reasonably expected" are interpretive. Training and guidelines are critical.
  - **False Negatives**: Players who don't report distress clearly might be missed.
  - **Resource-Intensive**: Step 4 requires reading player statements → not scalable without staffing.
  - **Cannot Fix Design Flaws**: If harm is caused by allowed mechanics (e.g., griefing via legal means), the procedure might flag it but not resolve it — this needs game design changes.

  ---

  ### Step 3: Run the Test Cases

  We apply the procedure to the four cases. We assume:
  - Moderators have 10 minutes per report.
  - Appeals team will read the reasoning.

  ---

  **Case 1: Build Dismantling in Open Shard**
  - **Step 1 (Game functioning as designed?)**: Yes (used legal mechanics). → Proceed to Step 2.
  - **Step 2 (Rule broken?)**: No (shard rules permit dismantling). → Proceed to Step 3.
  - **Step 3 (Intentional distress?)**: No evidence of malice (group spent a weekend; may be competitive or roleplay). → Proceed to Step 4.
  - **Step 4 (Investment loss?)**: 
    - Significant investment? Yes (200 hours).
    - Irreversible? Yes (cannot get back time/unique build).
    - Not reasonably expected? **No** — open shard explicitly allows dismantling. Players should expect this risk.
  - **Verdict**: No genuine harm → Close report.  
  - **Why you'll hate it**: Reporter lost something meaningful, but the context (open shard) made it an accepted risk. The procedure doesn't override design.

  ---

  **Case 2: RP Betrayal**
  - **Step 1**: Game functioning as designed? Yes (mechanics used legally). → Step 2.
  - **Step 2**: Rule broken? No (both opted into "no protections" agreement). → Step 3.
  - **Step 3**: Intentional distress? 
    - *Check*: Accused stays in character, claims it was good RP. No OOC malice indicated. But reporter says it wrecked their month → distress is real, but intent is ambiguous. 
    - *Judgment*: Without evidence of OOC intent (e.g., messages planning to upset the player), we default to NO. → Proceed to Step 4.
  - **Step 4**: Investment loss?
    - Significant? Yes (3-year character, emotional attachment).
    - Irreversible? Yes (character death in "no protections" RP is permanent).
    - Not reasonably expected? **No** — both players opted into a shard where "anything can happen." Betrayal is a classic RP trope; it's an accepted risk.
  - **Verdict**: No genuine harm → Close report.  
  - **Note**: This might feel harsh, but the opt-in agreement is key. The procedure could flag this for a design review (e.g., should "no protections" require additional consent?).

  ---

  **Case 3: Stalking Avatar**
  - **Step 1**: Functioning as designed? Yes (avatar movement is legal). → Step 2.
  - **Step 2**: Rule broken? No (no touching, no messages). → Step 3.
  - **Step 3**: Intentional distress? 
    - *Check*: Telemetry shows 6 weeks of mirroring at close proximity → clear pattern of unwanted attention. Even without messages, this is classic harassment signaling intent to distress. 
    - *Judgment*: YES → **Genuine harm**. Escalate for action (e.g., temp ban for harassment).
  - **Verdict**: Action required.  
  - **Note**: This case tests the procedure's ability to handle non-verbal harm. Step 3 catches it.

  ---

  **Case 4: Patched NPC**
  - **Step 1**: Functioning as designed? **No** — the patch was an intentional change by the operator. (This is not a bug; it's a design decision.) → **But wait**: The procedure starts with "game behaving as designed?" — here, the patch *is* the design. So YES (functioning as intended). → Proceed to Step 2? 
    - *Clarification*: The procedure is for player conduct reports. Here, the "accused" is the operator. We must adjust:
      - At Step 1: If the event is caused by operator action (not player conduct), it's not a moderation issue → Route to community/design team. **Hard Stop**.
  - **Verdict**: Close report as "not player conduct."  
  - **Why you'll hate it**: Players are genuinely distressed (lost a "friend"), but the procedure doesn't apply. This is a product issue, not moderation. The procedure can't help here — it's a design problem.

  ---

  **Summary of Unpopular Outcome**: Case 1 and 2 are closed (may disappoint reporters), but Case 4 is the one you'll truly hate because the procedure rejects it entirely, leaving players without recourse via moderation. This highlights the need for a separate feedback path for operator-caused issues.

  ---

  **Final Notes**:
  - **For Your Team**: If they reject the "virtual events are real" assumption, Steps 3-4 become meaningless. You'd need to revert to a pure rule-based system, which fails for subtle harms.
  - **Deployment Tip**: Start with a pilot, track false positives/negatives, and iterate. Train moderators on intent and "reasonably expected" with examples.
answer: |-
  ### Step 1: Brainstorming Candidate Principles
  I'll propose four principles for when an in-game event counts as genuine harm. Each includes a one-line summary, a brief rationale, and an obvious failure case. Then I'll pick/hybridize and explain why.

  1. **Player Investment Principle**  
     *Harm occurs when an action destroys or appropriates something a player invested significant time, emotion, or identity into, and that loss is irreversible within the game's design.*  
     **Rationale**: Virtual objects gain "reality" through human effort and attachment—like a 200-hour build becoming part of a player's identity.  
     **Failure Case**: In high-risk PvP zones, players *expect* loss. Applying this here overprotects players and stifles emergent gameplay. A griefer could claim their "hard-earned" right to harass others.

  2. **Consent Violation Principle**  
     *Harm occurs when an action bypasses or violates the reasonable, context-specific consent of the affected player(s), especially when trust or social norms are exploited.*  
     **Rationale**: Virtual harm mirrors real harm when it ignores autonomy (e.g., stalking without consent). Context matters—what's fine in a competitive shard isn't in a cooperative RP one.  
     **Failure Case**: Ambiguous in sandbox games. Players might retroactively withdraw consent after losing fairly (e.g., "I didn't consent to my character dying in RP!"). Mods get bogged down in "he-said-she-said."

  3. **Malicious Intent Principle**  
     *Harm occurs when an action is primarily intended to cause distress, disruption, or disproportionate suffering, regardless of rule-breaking.*  
     **Rationale**: Focuses on the *actor's mindset*. Real harm often lies in the intent (e.g., harassment for "lulz"). Telemetry patterns (e.g., stalking) can proxy for intent.  
     **Failure Case**: Hard to prove without explicit evidence (e.g., no chat logs). False negatives when intent is masked (e.g., "I was just roleplaying!"). Also, punishes competitive play that causes legit distress.

  4. **Social Fabric Principle**  
     *Harm occurs when an action undermines the shared values, trust, or sustainability of a community, even if technically legal.*  
     **Rationale**: Persistent worlds rely on social contracts. Harm isn't just individual—it's systemic (e.g., exploiting loopholes that erode player trust).  
     **Failure Case**: Subjective and culturally loaded. Requires mods to be sociologists. Small communities might see everything as "harming the fabric," while large ones lack cohesion.

  #### Selection: Hybrid Principle  
  I'll blend **Player Investment** + **Consent Violation** into:  
  **The Invested Consent Principle**:  
  *Genuine harm occurs when:  
  (A) A player suffers irreversible loss of something they deeply invested in (time/emotion/identity), AND  
  (B) The loss occurred in a context where they did not reasonably consent to the risk, OR the action exploited trust/social norms.*  

  **Why this hybrid?**  
  - It avoids the overreach of Player Investment (by requiring context) and the subjectivity of Consent Violation (by tethering consent to measurable investment).  
  - It handles griefing (e.g., stalking exploits investment + lack of consent) and RP betrayal (investment + violated trust), while allowing high-risk zones where consent is implied.  
  - **Tradeoffs**:  
    - **Survives Player Investment's failure**: By adding consent/context, it doesn't overprotect in PvP zones (e.g., dismantling a build in an open shard isn't harm—consent to risk is implied).  
    - **Survives Consent Violation's failure**: By requiring tangible investment, it filters out bad-faith consent claims.  
    - **Weakness**: Still needs human judgment for "reasonable consent" and "deep investment." But it’s operationalizable with telemetry + guidelines.

  ### Step 2: Moderator Procedure  
  **Input**: A player report.  
  **Output**: Close (no action), Escalate (to human for action), or Route (to another team).  
  **Time Budget**: 10 mins/report. Focus on fast triage, not deep investigation.  
  **Key**:  
  - 🟢 = Automatable (logs/telemetry).  
  - 🟠 = Partially automatable (needs simple human check).  
  - 🔴 = Not automatable (needs human judgment).  
  - ⏹️ = Hard stop (close if criteria unmet).  
  - ❓ = Values judgment (escalate to human).  

  ---

  **Procedure: Invested Consent Harm Assessment**  
  Run these steps in order. Stop when a hard stop or escalation is reached.

  1. **🔴 Step 1: Is the accused a player?**  
     - *Check*: Is this report about *player* conduct? Or is it about game design, bugs, or the operator (e.g., an update)?  
     - *Sufficient Answer*:  
       - If **YES** (player conduct): Proceed to Step 2.  
       - If **NO** (e.g., operator action): **Hard stop ⏹️**. Close report and route to "Design Feedback" team. *Not a moderation issue*.  
     - *Why?* This filters out non-conduct reports (e.g., Case 4). Automatable? **🟢** (flag if "accused" is system/operator).  

  2. **🟢 Step 2: Was a rule broken?**  
     - *Check*: Using logs, does the action violate *explicit, written rules*? (e.g., hate speech, exploiting bugs).  
     - *Sufficient Answer*:  
       - If **YES**: **Hard stop ⏹️**. Escalate for standard enforcement (e.g., ban). *No need for harm assessment—rules cover it*.  
       - If **NO**: Proceed to Step 3.  
     - *Why?* Efficiency. Don't overcomplicate clear violations. Automatable? **🟢** (scan logs for keywords, blacklisted actions).  

  3. **🟠 Step 3: Is there irreversible loss of deep investment?**  
     - *Check*:  
       - **Deep investment**: >20 hours of verifiable effort OR emotional attachment evidenced in logs (e.g., player describes build/character as "part of me").  
       - **Irreversible**: Cannot be restored via game mechanics (e.g., no undo feature).  
     - *Sufficient Answer*:  
       - If **NO**: **Hard stop ⏹️**. Close report. *No significant loss*.  
       - If **YES**: Proceed to Step 4.  
     - *Why?* Filters "just pixels" from meaningful harm. Automatable? **🟠**:  
       - Time investment **🟢** (log playtime).  
       - Emotional attachment **🔴** (needs human to read report for phrases like "I loved this" or "years of work").  

  4. **🔴 Step 4: Was there reasonable consent to the risk?**  
     - *Check*:  
       - **Context**: Shard rules, prior agreements (e.g., "no protections" RP opt-in), and location (e.g., PvP zone vs. safe area).  
       - **Consent**: Would a reasonable player in this context expect this risk? (e.g., building destruction in an open shard = expected; stalking = not).  
     - *Sufficient Answer*:  
       - If **YES** (consent implied): **Hard stop ⏹️**. Close report. *Player assumed the risk*.  
       - If **NO** (no consent): Proceed to Step 5.  
     - *Why?* Anchors harm to context. Automatable? **🔴** (shard rules **🟢**, but "reasonable" needs human judgment).  

  5. **🔴 Step 5: Was there exploitation of trust/social norms?**  
     - *Check*: Did the action exploit relationships, loopholes, or community trust? (e.g., abusing friendship in RP, using mechanics in unintended ways to distress).  
     - *Sufficient Answer*:  
       - If **NO**: **Hard stop ⏹️**. Close report. *Unfortunate but not exploitative*.  
       - If **YES**: ❓ **Escalate to human moderator** for action (e.g., warning, temp ban). *Genuine harm likely*.  
     - *Why?* Catches "technically legal" abuse. Automatable? **🔴** (requires interpreting player relationships/norms).  

  ---

  **Critical Assumptions & Limitations**  
  - **Assumes virtual events are real**: Steps 3–5 treat time/emotion as valuable. If denied:  
    - Steps 3–5 collapse. You revert to "only rule-breaking matters," which fails for Cases 1–3.  
  - **Systematic Limitations**:  
    - **False Negatives**: Hurts sensitive players in high-consent zones (e.g., RP betrayal).  
    - **Resource Heavy**: Steps 4–5 need trained humans → staff accordingly.  
    - **Cannot Fix Design Flaws**: If harm stems from bad design (e.g., griefing mechanics), this flags harm but doesn’t solve it—needs game changes.  
    - **Subjectivity in Disguise**: Step 4 ("reasonable consent") and Step 5 ("exploitation") are judgment calls. Appeals team must audit these.  
  - **What It Can’t Do**:  
    - Handle operator-caused harm (e.g., Case 4).  
    - Resolve cultural clashes (e.g., what's "exploitative" in one community isn't in another).  
    - Replace player education (e.g., teaching consent expectations in risky shards).

  ### Step 3: Run Test Cases  
  **Case 1: Build Dismantling in Open Shard**  
  - **Step 1 (Player?)** → YES (players accused).  
  - **Step 2 (Rule broken?)** → NO (legal mechanics, shard permits it).  
  - **Step 3 (Deep investment?)** → YES (200 hours, irreversible).  
  - **Step 4 (Reasonable consent?)** → **YES** (open shard rules = consent to destruction implied).  
  - **Verdict**: ⏹️ **Close report** at Step 4. *No harm—player consented to risk*.  
  - **Automation**: Step 3 🟠 (human checks time logs + report for emotion), Step 4 🔴 (human verifies shard rules).  

  **Case 2: RP Betrayal**  
  - **Step 1** → YES.  
  - **Step 2** → NO (no rule broken; "no protections" opt-in).  
  - **Step 3** → YES (3-year character, irreversible loss).  
  - **Step 4 (Reasonable consent?)** → **YES** (both opted into "anything can happen" – consent implied).  
  - **Verdict**: ⏹️ **Close report** at Step 4. *No harm—consent was explicit*.  
  - **Automation**: Step 3 🔴 (human reads for emotional attachment), Step 4 🔴 (human checks RP agreement).  

  **Case 3: Stalking Avatar**  
  - **Step 1** → YES.  
  - **Step 2** → NO (no rule broken).  
  - **Step 3** → YES (6 weeks of investment in safety/comfort → irreversible loss of peace).  
  - **Step 4 (Reasonable consent?)** → **NO** (no shard implies consent to stalking).  
  - **Step 5 (Exploitation?)** → **YES** (mirroring movement exploits social norms to distress).  
  - **Verdict**: ❓ **Escalate to human** at Step 5. *Genuine harm likely*.  
  - **Automation**: Step 3 🔴 (human assesses distress from behavior), Step 4–5 🔴 (human interprets norms).  

  **Case 4: Patched NPC (Operator Action)**  
  - **Step 1 (Player?)** → **NO** (accused is operator).  
  - **Verdict**: ⏹️ **Close report** at Step 1. Route to "Design Feedback" team. *Not moderation*.  
  - **Why you’ll hate this**: Players are devastated ("deleted their friend"), but the procedure rejects it outright. This exposes a gap—operator-caused harm needs a separate process.  

  **Unpopular Outcome**: Case 4 is closed immediately. This will frustrate players (and you!), but it’s consistent—moderation handles *players*, not design. If you want operator harm covered, you’d need a parallel procedure for "design-caused distress."  

  ### Final Notes  
  - **For Your Team**: This procedure shifts from "did the game work?" to "did players suffer meaningful harm?" Staffing needs focus on Steps 3–5 (🔴 steps). Automation handles ~50% (Steps 1–2 and parts of 3).  
  - **If Teammates Reject "Virtual=Real"**: The entire harm assessment (Steps 3–5) fails. Cases like the stalker (Case 3) get closed, eroding trust. Argue that players *live* in this world—ignoring that causes real churn.  
  - **Deploy Incrementally**: Pilot on 10% of reports, track appeals, and refine "reasonable consent" guidelines. Use Case 3 as a training example.  
  - **Remember**: No procedure replaces good design. If legal griefing is common, change shard rules or mechanics—don’t rely on mods to patch systemic issues.
