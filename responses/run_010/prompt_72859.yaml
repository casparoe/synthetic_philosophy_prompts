  Okay, the user is a high school copy editor dealing with a strict rule against mental-state verbs for software. The current rule is causing awkward writing and reader complaints. They want a practical decision procedure based on the intentional stance that a 16-year-old can apply quickly.

  First, I need to recall what the intentional stance entails. It's about predicting behavior by attributing beliefs and desires. The key is whether this attribution is useful for prediction, not whether the system truly has mental states. The user wants a step-by-step procedure with clear questions, tests like substitution, and distinctions about where the mental state originates.

  The user mentioned avoiding philosophical debates but grounding the procedure in this theory. I should note where steps assume that successful prediction licenses attributing real beliefs, as critics might disagree. Also, they want to identify cases where it's about values, not accuracy.

  Building the procedure step by step. Start with checking if the verb is necessary or avoidable. If avoidable, rewrite. If not, proceed to see if it's predictive. Then, determine whose intention it is: the system, designers, prompt, or training data. If it's the system's, does the attribution allow new predictions? If not, hedge. If it leads to predictions, it's acceptable. Cases involving values go to the advisor.

  Now, applying to the three sentences. 

  First sentence: "The tutoring bot knows..." Check if it's predictive. Does changing "knows" to a design description change the claim? Probably not, since the bot's behavior is programmed. But does attributing "knows" help predict? Maybe, if the bot consistently adapts. However, the knowledge might belong to the designers. So hedge with "programmed to recognize." Verdict: rewrite.

  Second sentence: "Our moderation filter doesn't understand context..." Substituting "lacks contextual analysis capability" might be more accurate. The misunderstanding isn't predictive; it's a limitation. Belongs to the system's design. Verdict: rewrite.

  Third sentence: "The rover wanted..." Here, "wanted" implies a goal. Substituting "was programmed to prioritize reaching" changes the claim. If the rover's behavior can be predicted based on this goal, it might be acceptable. But critics would say it's just following algorithms. However, in this context, attributing desire might be useful. But the user suspects it won't survive. The procedure might require hedging because the desire comes from designers. Verdict: rewrite.

  The user expects sentence three to survive but it might not. That's the case they won't like. Need to explain why: the desire belongs to the designers, not the rover itself, and without new predictions, it's redescriptive.

  For the footnotes, short glosses explaining the attribution. 

  The procedure can't settle value questions, like whether attributing intentions anthropomorphizes systems. Also, cases where predictive success is debated.

  Creating a one-page version: list steps concisely. Default verb treatments: "knows" usually needs rewrite unless predictive; "understands" similar; "wants" might be okay if goal-oriented.

  Dropped distinctions: maybe the fine line between functional and real intentionality. Misfires in ambiguous cases like chatbots where training data vs. system intent is blurry.
answer: |-
  Here is a practical decision procedure grounded in the intentional stance, designed for high school journalists without philosophy training. It focuses on **predictive utility** and **attribution clarity**, not metaphysics. Steps marked (💡) assume that *successful prediction* licenses saying the system "really has" beliefs/desires *for journalistic purposes*; critics reject this, so alternatives are provided.

  ---

  ### **Decision Procedure: Mental-State Verbs for Software**
  **Ask these questions in order. Stop at the first definitive answer.**

  1.  **Can we delete the verb without changing meaning?**
      *   *Test:* Read the sentence without the mental-state verb. Does it still accurately describe the event?
      *   *Sufficient Answer:* **YES** → **Rewrite:** Delete the verb or use a neutral action verb (e.g., "The bot *detected* a student was about to give up...").
      *   *NO* → Move to Q2.

  2.  **Does substituting a design/physical-level description *change* the core claim?**
      *   *Test:* Replace the mental-state verb with a description of *how* it works (design: "was programmed to...", "uses an algorithm to...") or *what* physically happened (physical: "outputted code 403", "activated motor B"). Does this new version make a *different* claim about what occurred or why?
      *   *Sufficient Answer:* **NO CHANGE** (The substitution says the *same* thing more accurately) → **Rewrite:** Use the substitution.
      *   **CHANGE** → Move to Q3.

  3.  **Whose "want/belief" is this?**
      *   *Test:* Ask: Is this mental state most accurately attributed to...
          *   **A. The System Itself?** (Does it emerge from the software's operation in this specific interaction?)
          *   **B. The Designers/Programmers?** (Is it baked into the code's purpose?)
          *   **C. The User's Prompt/Input?** (Was it directly instructed by the user?)
          *   **D. The Training Data?** (Is it a statistical reflection of patterns in the data?)
      *   *Sufficient Answer:*
          *   **B, C, or D** → **Hedge or Rewrite:** Use phrases like "programmed to act as if...", "responded in a way consistent with...", "based on patterns in its training data...".
          *   **A** → Move to Q4. *(💡 This step assumes attributing mental states to the system itself is legitimate if useful. Critics say only B/C/D exist. If siding with critics, treat **A** like B/C/D and hedge/rewrite here.)*

  4.  **Is the attribution *predictive* or just *redescriptive*?**
      *   *Test:* Does saying the system "believes X" or "wants Y" let you predict its behavior in *other, similar situations* the reporter didn't describe? Or does it only restate what it did in *this one specific instance*?
      *   *Sufficient Answer:*
          *   **PREDICTIVE** (It helps forecast behavior) → **MAY STAND** (You can keep the verb). *Add a short footnote gloss if needed.*
          *   **REDESCRIPTIVE** (It only explains this one event) → **Hedge:** Use phrases like "acted as if it..." or "behaved in a way suggesting..." *(💡 This step relies on predictive utility justifying the attribution. Critics might say redescriptions are still useful metaphors; if so, they might hedge less often here.)*
      *   **UNCLEAR / VALUES ISSUE** → **Hand to Advisor.** (E.g., Does attributing "understanding" imply moral responsibility? Is this encouraging problematic anthropomorphism?).

  ---

  ### **Application to Your Sentences**

  1.  **"The tutoring bot knows when a student is about to give up, and it changes its tone before they do."**
      *   Q1: Deleting "knows" → "The tutoring bot changes its tone when a student is about to give up." **Meaning changes? YES.** (Loss of implied detection/anticipation). → Q2.
      *   Q2: Substitute Design: "The tutoring bot, *using engagement-detection algorithms*, changes its tone when predicting a high probability of student disengagement." **Claim changed? YES.** (Original implies direct awareness; substitution describes mechanism). → Q3.
      *   Q3: Whose "knows"? Likely **B (Designers)**. The knowledge is a programmed detection capability. *Even if it feels emergent (A), critics strongly favor B here.* → **VERDICT: HEDGE or REWRITE.**
      *   *Rewrite Suggestion:* "The tutoring bot detects signs a student is about to give up and changes its tone proactively." OR "Programmed to identify disengagement cues, the tutoring bot changes its tone before students give up."
      *   *Footnotes Gloss (if kept/hedged):* "The bot uses algorithms to identify patterns associated with disengagement."

  2.  **"Our moderation filter doesn't understand context, so it flagged the entire news article about the book challenge."**
      *   Q1: Delete "doesn't understand context" → "...so it flagged..." **Meaning changes? YES.** (Loss of *why* it flagged). → Q2.
      *   Q2: Substitute Design: "Our moderation filter *lacks contextual analysis capabilities*, so it flagged..." **Claim changed? NO.** This is more precise. → **VERDICT: REWRITE.**
      *   *Rewrite Suggestion:* "Our moderation filter lacks contextual analysis capabilities, so it flagged keywords in the news article about the book challenge, misinterpreting it as problematic content."
      *   *Why not hedge?* The substitution is clearer and more accurate than "doesn't understand."

  3.  **"The rover wanted to reach the far checkpoint, so it abandoned the shorter route."**
      *   Q1: Delete "wanted" → "...so it abandoned..." **Meaning changes? YES.** (Loss of *motivation*). → Q2.
      *   Q2: Substitute Design: "The rover, *programmed to prioritize reaching the far checkpoint*, abandoned the shorter route." **Claim changed? YES.** (Original implies internal goal-state; substitution describes external programming). → Q3.
      *   Q3: Whose "wanted"? **B (Designers)**. The goal is explicitly programmed. *Critics and proponents likely agree here; true internal "desire" in a rover is improbable.* → **VERDICT: HEDGE or REWRITE.**
      *   *Rewrite Suggestion:* "Programmed to prioritize the far checkpoint, the rover abandoned the shorter route when conditions made that path optimal." OR "The rover abandoned the shorter route, acting to fulfill its primary objective of reaching the far checkpoint."
      *   *Footnotes Gloss (if kept/hedged):* "The rover's behavior followed its programmed goal hierarchy."
      *   *Why you won't like this:* You expected it to survive because the intentional stance feels predictive. The procedure flags it because the "want" belongs to the designers, not the rover itself (Q3), making a hedge/rewrite clearer. Predictive power (Q4) alone doesn't overcome this misattribution.

  ---

  ### **What the Procedure Cannot Settle (Hand to Advisor)**
  *   **Anthropomorphism & Values:** Is it harmful or helpful for readers to casually describe software as "knowing" or "wanting," even if predictive? Does it obscure responsibility or create false intimacy?
  *   **Moral/Legal Implications:** Does describing an AI as "refusing" imply it has rights or responsibilities?
  *   **Deep Metaphysical Disputes:** Should we *never* attribute beliefs/desires to machines, even predictively? (The procedure assumes predictive utility justifies it; strict critics disagree).
  *   **Highly Contextual "Understanding":** Cases where whether attribution is predictive or merely descriptive is hotly debated (e.g., advanced chatbots).

  ---

  ### **One-Page Version (For Newsroom Cabinet)**

  **CAN WE USE MENTAL VERBS (like knows, wants, believes) FOR SOFTWARE? ASK:**

  1.  **DELETE IT?** If removing the verb doesn't change the meaning, delete it or use a plain action verb (e.g., "detected," "responded").
  2.  **DESCRIBE HOW IT WORKS?** Can you replace the verb with *how* it was programmed or *what* physically happened? If this says the same thing *better*, do it.
  3.  **WHOSE "THOUGHT"?**
      *   Is it really the **Programmer's Goal?** → Say "programmed to..." or "designed to act as if..."
      *   Is it really the **User's Prompt?** → Say "following the user's instruction to..."
      *   Is it really the **Training Data?** → Say "based on patterns in its data..." or "reflecting statistical associations..."
      *   *(Only if none of these fit)* Does it seem like the **Software Itself?** → Go to 4.
  4.  **PREDICT OR JUST DESCRIBE?**
      *   Does the verb help us guess what it would do in *other situations*? **→ OK to use.** Add a tiny footnote like "using predictive algorithms" if needed.
      *   Does it *only* explain this one event? **→ Hedge:** Use "acted as if it..." or "behaved consistently with..."
  5.  **STILL STUCK?** Ask the Advisor! (Especially for values, ethics, or deep arguments).

  **DEFAULT TREATMENTS FOR COMMON VERBS:**
  *   **Knows / Understands:** Usually **REWRITE** (Use "detects," "analyzes," "processes," "lacks capability for..." - Often belongs to Designers/Data). *Why?* Highly ambiguous, easily redescriptive.
  *   **Wants / Desires:** Often **HEDGE** (Use "programmed to prioritize...", "acted to achieve..."). *Why?* Goals are usually set externally, even if pursuit is predictive.
  *   **Believes / Thinks:** **REWRITE or HEDGE** (Use "calculated...", "determined based on data...", "operated under the assumption..."). *Why?* Easily conflated with human cognition; usually redescriptive or belonging to Data.
  *   **Decides / Chooses:** **HEDGE** (Use "selected...", "executed a pre-programmed option...", "outputted..."). *Why?* Implies agency; nearly always belongs to Designers/Algorithms.
  *   **Refuses:** **REWRITE** (Use "did not execute...", "returned an error...", "lacked permission..."). *Why?* Strongly implies agency/morality; belongs to Designers/Security rules.

  ---

  ### **Compromises & Limitations**
  *   **Dropped Distinctions:** Deep debates about "real" vs. "as-if" intentionality, emergence, consciousness, and the precise boundary between system/designer/prompt/data are simplified into a workflow. The predictive vs. redescriptive test is blunt but practical.
  *   **Where it Might Misfire:**
      *   **Chatbots/LLMs:** Their behavior *can* be highly predictive using the intentional stance, making Q4 often say "keep." However, Q3 (attribution) is messy – is the "belief" in the system, the prompt, or the training data? Expect borderline calls.
      *   **"Predictive but Misleading":** A verb might be predictive *and* belong to the system (Q3A, Q4 Yes), but still be ethically/socially problematic (e.g., "The AI believes minorities are higher risk"). The procedure flags this only if someone recognizes it as a values issue in Q4/Handoff.
      *   **Over-Hedging:** In simple, highly predictive goal-driven systems (like a thermostat "wanting" 70°F), the procedure (especially Q3) might insist on hedging ("programmed to maintain...") even when "wants" feels harmless and clear.
      *   **Under-Hedging:** If a reporter convincingly argues a complex AI's behavior is predictive and emergent (Q3A), the procedure allows the verb, which critics would argue is always misleading.

  This procedure prioritizes **clarity, accuracy, and teachability** over philosophical purity. It replaces a blanket ban with reasoned choices based on *what the sentence is actually trying to convey* and *where the attributed mental state originates*.
