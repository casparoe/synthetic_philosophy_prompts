prompt: |-
  I am three years into a novel whose centre of gravity is a regional human-rights court: a treaty body to which some forty-odd states have submitted, which hears complaints brought by individuals directly against their own governments, and whose judgments those governments describe, in the operative text of the treaty, as binding and as ones they undertake to execute. My protagonist is a lawyer in the court's registry, and because her crisis of faith is the whole of the second half of the book, my editor has asked that the procedural texture be exact; so I have spent this year reading the machinery rather than the case law, and I keep coming up against an arrangement I cannot make philosophical sense of. There is no sheriff. Execution of a judgment is supervised by a committee composed of the member states' own representatives — including, when their turn comes round, the representatives of the state that has just lost — and that committee's instruments are publication, pressure, deferral, and patience. The heaviest thing in the cupboard is expulsion from the organisation, which has the peculiar property that the ultimate sanction for breaking a treaty obligation is that the obligation stops applying to you; a state may also denounce the treaty outright, lawfully and prospectively, on notice. The federation disclaims any power to compel by force while its members keep standing armies. And yet compliance is high: governments pay the awards, reopen closed proceedings, amend offending statutes, and brief the committee at length on how thoroughly they have complied, rather than shrugging.

  Alongside this sits a second and stranger practice. Where a person is about to be removed from a country and claims he will be tortured or killed on arrival, the court can indicate an urgent interim measure — not a judgment, not a ruling on the merits, but an administrative indication issued under its own rules of procedure and reserved for cases of imminent and irreparable harm — asking the government to keep the man on the ground until the case has been examined. The treaty itself says nothing about such indications; there is no penalty attached to them anywhere. The court has nonetheless held that a state's failure to honour one can itself violate the provision guaranteeing the right of individual petition, and governments overwhelmingly obey, sometimes at real domestic cost, sometimes while protesting loudly that they were not obliged to.

  What I want from you is a reconstruction of the theory of law and obligation this machinery presupposes: what has to be true about the nature of a legal duty for a duty of exactly this shape — unenforced, self-supervised by the parties to it, individually invokable against one's own sovereign, terminable by exit, and nevertheless generally kept — to be a legal duty at all, rather than a species of promise or of etiquette. Which rival accounts of law does the practice quietly rule out, and which does it merely happen to sit comfortably with? I am especially interested in how it looks from Kant's side of the fence. In the peace essay he wants a federation of free states rather than a world republic, because a state of nations would be a contradiction in terms and a world state a soulless despotism; elsewhere he binds right inseparably to the authorization to use coercion, and holds that outside a civil condition obligations remain provisional rather than peremptory. Is this court the federation he was reaching for, or is it the thing he thought impossible — peremptory law among sovereigns resting on nothing but reciprocal expectation and reputational exposure? If the latter, does the practice presuppose that states are entities capable of being bound by their own recognition alone, and that individuals rather than states are the ultimate units of right? Or could precisely the same procedures be run on quite different premises? Please keep strict presupposition separate from good fit, mark the places where the machinery is philosophically underdetermined — where two incompatible theories would license the identical procedure — and say which of its parts are in tension with each other, the interim measures and the judgment-enforcement apparatus being my own chief suspicion. Finally, tell me what would have to be added to this court, or deleted from it, for a Hobbesian replacement or a genuinely Kantian world republic to become visible in its daily working; I want to know which of those two institutions my character could coherently believe she serves. No references or reading list, please — the argument, not the scholarship.
reasoning: |-
  Okay, let me approach this novelist's deep philosophical query methodically. The core challenge is reconstructing the implicit legal theory behind a regional human-rights court where compliance relies on peer pressure rather than coercion, especially regarding two puzzling aspects: high adherence to binding judgments despite no enforcement mechanism, and near-universal obedience to interim measures lacking treaty basis. 

  First, I need to dissect the apparent contradictions. The court's enforcement relies entirely on reputational sanctions within a voluntary association, yet states comply meticulously. Meanwhile, interim measures - created judicially without treaty authorization - are treated as binding through interpretive sleight-of-hand. This suggests a legal universe where obligation stems from mutual recognition rather than force.

  Considering Kant's framework seems crucial here. His rejection of world government in favor of voluntary federation resonates with this court's structure, but clashes with his view that law requires coercion. The court's practice implies that sovereigns can be bound by collective scrutiny alone, modifying Kant's coercion requirement into a continuum where reputational enforcement suffices for peremptory obligation. 

  The interim measures phenomenon is particularly telling. By framing disobedience as violating the right to petition, the court reveals its foundational premise: sovereign recognition creates obligations that self-bind through the very act of submission. This transforms Kant's provisional morality into concrete law via institutionalized peer judgment.

  For the novelist's purpose, the key tension lies between the judgment enforcement system (collective, slow, political) and interim measures (unilateral, urgent, quasi-judicial). Their coexistence suggests a hybrid theory: states accept being bound by their consent, but the court asserts authority to define the scope of that consent. This positions the court somewhere between Kant's federation and his "impossible" coercive-less system.

  To make Hobbes visible, the court would need centralized enforcement powers; for a Kantian world republic, elimination of state consent mechanisms. But as is, it embodies a third way: law emerging from sovereigns mutually constructing constraints through recognition, with individuals as ultimate beneficiaries. The protagonist's crisis might stem from seeing this delicate balance threatened when states test its limits.
answer: |-
  Here’s a reconstruction of the legal theory implied by your court’s machinery, marking tensions and philosophical underdetermination:

  ### Core Presuppositions
  1.  **Law as Mutual Recognition, Not Coercion:** The system presupposes that legal obligation for sovereign states arises from *public, reciprocal recognition*, not force. A duty is "legal" because it is:
      *   **Mutually Undertaken:** States explicitly consent via treaty.
      *   **Institutionalized:** Embodied in a permanent court with defined procedures.
      *   **Publicly Accountable:** Non-compliance is exposed to peers and global scrutiny.
      *   **Self-Binding:** Consent implies accepting the rules *as law*, altering the state's normative self-conception. Breaking it isn't merely costly; it violates an identity as "law-abiding."

  2.  **The Sovereign Paradox:** States are presumed capable of binding *themselves* meaningfully. The "binding" force isn't external compulsion but the *internalization* of the obligation through consent and the reputational/social costs of public breach within the community they chose to join. Expulsion isn't just escape; it's a profound reputational penalty confirming the obligation's reality *until* exit.

  3.  **Individuals as Subjects of International Law:** The system presupposes individuals are *direct* holders of international legal rights invocable against their own state. This subtly displaces the state as the sole subject of international law, making it a guarantor of individual rights *to* individuals.

  4.  **Obligation Beyond the Treaty Text (Interim Measures):** The court presupposes an inherent authority to ensure the *effectiveness* of its core function (individual petition). Interim measures derive legitimacy not from explicit text but from the *telos* of the treaty and the court's role: preventing the petition's object (e.g., the individual) from being irreparably destroyed before judgment. Disobeying an interim measure functionally nullifies the right of petition, hence violating the treaty.

  ### Rival Accounts Ruled Out (or Severely Challenged)
  *   **Austinian/Hobbesian Command Theory:** Ruled out. No sovereign habitually obeyed, no sanction of force. Obligation rests on consent and reciprocity, not fear.
  *   **Strict Legal Positivism (Text-Only):** Challenged by interim measures. The court's authority to create binding obligations (via interpreting Art. petition right) beyond explicit text presupposes law's dynamism and purpose-driven interpretation. The "source" isn't *just* the treaty text, but the institutional logic necessary for its effectiveness.
  *   **"Vanishing Point" Sovereignty:** Challenged. Sovereignty here is inherently *relational* and self-limited. Absolute, uncontrolled sovereignty is incompatible with submitting to binding adjudication and accepting individual petitions.

  ### Philosophical Underdetermination & Good Fits
  *   **Compliance Mechanism:** Fits well with **Hart's "Rule of Recognition"** adapted internationally. States treat the court's judgments as binding (the "rule") because other states expect compliance and apply pressure (criticism, committee scrutiny), reinforcing the internal attitude of obligation. Also fits **Constructivism (IR):** States comply due to internalized norms and identity ("we are states that obey human rights law").
  *   **Interim Measures:** Fits **Dworkinian "Integrity".** The court interprets the treaty not just by its words but by the principles of justice and effectiveness underpinning the whole system. Fits **Fuller's "Internal Morality of Law":** A system claiming to adjudicate rights must provide effective remedies; interim measures are necessary for the system's coherence and avoidance of absurdity (granting a right posthumously).
  *   **Underdetermined:** The *precise* philosophical basis for the *bindingness* of interim measures. Is it:
      *   Implied consent to effective procedures (Consent Theory)?
      *   Logical necessity for a functioning legal system (Systemic Integrity)?
      *   An inherent judicial power (Institutional Competence)?
      The *practice* works without settling this.

  ### Tensions Within the Machinery
  1.  **Judgments vs. Interim Measures (Your Suspicion):**
      *   **Judgments:** Enforced via collective, political, slow-moving peer pressure (Committee of States). Compliance is high but negotiable, involving dialogue, delays, partial compliance. The state remains *in* the system.
      *   **Interim Measures:** Enforced via near-automatic, judicialized *fiat* backed by the threat of instantly branding the state a treaty violator *now*. Compliance is swift and near-universal, achieved through the court's unilateral authority invoking systemic integrity.
      *   **Tension:** The judgment system embodies *sovereign equality* and *consensual politics*. Interim measures embody *judicial supremacy* and *effectiveness of rights*. The former is horizontal (state-state), the latter is vertical (court-state). The court bridges this by grounding interim measures in the treaty's *purpose* (individual petition), but the methods of enforcement remain starkly different.

  2.  **Expulsion/Denunciation as Sanction vs. Escape Hatch:** The ultimate "sanction" is also an escape. This highlights the system's foundation in *ongoing consent*. It presupposes states *want* to belong more than they want to violate, making expulsion costly. But it reveals the fragility: obligation lasts only as long as the state accepts the role.

  ### Kantian Lens: Reaching For, But Surpassing, the Impossible?
  *   **Against Kant's Coercion Requirement:** Kant is clear: "Right and authorization to use coercion mean one and the same thing." Your court lacks direct coercive power. Judgments rely on non-coercive "publicity" and reputation (closer to Kant's "publicity principle" for justice). This suggests the court falls short of peremptory obligation; it remains "provisional" in Kantian terms.
  *   **The Kantian Leap (Interim Measures):** Here's the twist. The court *creates* a form of peremptory obligation through interim measures. By linking disobedience to an *instant, public violation of the treaty itself* (right of petition), and securing near-universal compliance, it simulates coercion via reputational annihilation. States act *as if* coercion exists. The court leverages the state's *own* prior consent and the *system's* normative power to generate a binding effect Kant thought impossible without a world state. It *is* the "peremptory law among sovereigns resting on reciprocal expectation and reputational exposure" he deemed impossible. It works because states are bound *by their own recognition* of the system's legitimacy and cost of exit.
  *   **Federation vs. Republic:** It fits Kant's *federation* (voluntary, no world state) structurally. However, through individual petition and the court's authority (especially interim measures), it injects a quasi-constitutional, vertical element Kant associated only with a republic. It's a hybrid: a federation with a surprisingly supreme court empowered to bind states instantly in extremis.

  ### Making Hobbes or Kant Visible
  *   **Hobbesian Court:** Add a centralized enforcement arm: an independent executive body with material power (e.g., a UN-style force, or direct economic sanctions authority) to *compel* compliance with judgments and interim measures, bypassing the Committee of States. The Registry lawyer would see writs enforced by bailiffs. Sovereignty would visibly pool upwards. Fear of the Leviathan's sword, not peer pressure, would dominate.
  *   **Genuine Kantian World Republic:** Remove state consent mechanisms: eliminate denunciation clauses, make membership universal/compulsory, replace the state representatives' Committee with a directly elected parliamentary body overseeing a powerful executive enforcing judgments. The court would be one branch of a global government. The Registry lawyer would be a civil servant in a true world state, enforcing peremptory law backed by irresistible force.

  ### Your Protagonist's Belief
  Your character could *coherently* believe she serves **Kant's Federation.** The structure is voluntary, states retain sovereignty (armies, denunciation), enforcement is non-coercive/publicity-based, and the aim is peace through law. The interim measures, though powerful, can be rationalized as essential for the *federation's* purpose – making individual rights effective and preventing the system from becoming a cruel joke. The tension arises because the court, through its interpretive power and the interim measures procedure, constantly *pushes* the federation towards the *logic* of the world republic, demanding submission to judicial authority in the name of rights. Her crisis could stem from seeing this tension break: when a state brazenly ignores an interim measure *without* reputational collapse, exposing the system's reliance on fragile reciprocity and consent, revealing the ghost of Hobbesian anarchy beneath the Kantian façade.
