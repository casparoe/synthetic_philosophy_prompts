answer: |-
  ### Analysis of the Structural Feature

  The structural feature you describe involves decision problems where an agent faces multiple indistinguishable occasions (states) and must choose a policy (a rule applied uniformly across all occasions) because the agent's evidence about their current location depends on the policy itself. This creates a situation where myopic reasoning (choosing acts based on fixed beliefs about location) leads to suboptimal outcomes, and optimality requires selecting a policy that accounts for how it shapes the agent's beliefs. Below, I address your queries systematically.

  ---

  ### (a) Established Concepts and Where They Break Down

  1. **Partially Observable Markov Decision Process (POMDP)**  
     - **Closest fit**: POMDPs model decision problems where an agent cannot directly observe the current state but must infer beliefs from observations and actions. The agent chooses policies mapping beliefs to actions, and beliefs are updated via Bayesian methods.  
     - **Breakdown**: While your cases fit the POMDP framework (indistinguishable states, policy-dependent beliefs), POMDPs are a broad framework. Your feature is a specific *subtype* where:  
       - No observations update beliefs during the decision process (e.g., the courier sees nothing).  
       - Beliefs are *entirely* policy-dependent (no exogenous signals).  
       - The agent cannot condition actions on states, forcing a uniform policy.  
     POMDPs do not inherently emphasize the *uniform policy* requirement or the *deliberate induction of ignorance* (Case 2).

  2. **Dynamic Inconsistency / Time-Inconsistency**  
     - **Closest fit**: This occurs when an agent's optimal plan changes over time due to shifting preferences (e.g., hyperbolic discounting). Sophisticated agents precommit to policies to avoid future deviations.  
     - **Breakdown**: In your cases, the issue is not changing preferences but *ignorance of location*. The suboptimality arises from flawed *belief formation* (using fixed priors like 50-50), not from preference shifts. Case 1 involves no temptation or self-control; Case 2 uses ignorance to prevent inconsistency, but the core is about state uncertainty, not preference dynamics.

  3. **Strategic Ignorance / Information Avoidance**  
     - **Closest fit**: Agents avoid information to maintain desirable outcomes (e.g., avoiding genetic tests to preserve hope). Case 2 fits perfectly, as the agent destroys information to enforce a uniform policy.  
     - **Breakdown**: This concept does not cover Case 1, where ignorance is involuntary (no choice to avoid information). It also ignores the *policy-dependent belief* aspect: strategic ignorance focuses on hiding payoff-relevant information, not on how policies shape beliefs about location.

  4. **Precommitment**  
     - **Closest fit**: Agents restrict future options to resist temptation (e.g., Odysseus tying himself to the mast). Case 2 resembles this, as the agent removes location information to bind themselves to a rule.  
     - **Breakdown**: Precommitment assumes a known future temptation. In your cases:  
       - Case 1 has no temptation; suboptimality stems from faulty reasoning, not impulsivity.  
       - Case 2 uses ignorance to create a uniform policy, not to block specific actions.  
     Precommitment does not address policy-dependent beliefs or involuntary ignorance.

  **Summary of Breakdowns**:  
  - POMDPs are broad and lack emphasis on uniform policies/deliberate ignorance.  
  - Dynamic inconsistency focuses on preferences, not state uncertainty.  
  - Strategic ignorance covers only deliberate cases (not involuntary ones).  
  - Precommitment assumes temptation, which is absent here.  
  None fully encapsulate the policy-dependent evidence and uniform policy requirement.

  ---

  ### (b) Coverage by Established Concepts  
  - **No single established concept covers both cases**.  
    - **Involuntary cases (e.g., Case 1)** are best modeled as POMDPs with unobservable states and policy-dependent beliefs.  
    - **Deliberate cases (e.g., Case 2)** align with strategic ignorance for self-commitment.  
  - **Combined coverage**:  
    - POMDPs + strategic ignorance can jointly describe the feature:  
      - POMDPs handle the belief-policy interdependence.  
      - Strategic ignorance explains self-induced indistinguishability.  
    However, this combination is descriptive, not a unified concept. The shared core—policy-dependent evidence forcing uniform policies—lacks a dedicated term.

  ---

  ### (c) Policy Choice vs. Policy-Dependent Evidence  
  - **The injunction to choose policies over acts is necessary but insufficient**.  
    - Standard policy-based decision-making (e.g., in MDPs) assumes states are observable or beliefs are fixed. Here, the agent’s beliefs about their location *depend on the policy*, creating a feedback loop:  
      - Choosing a policy affects the likelihood of being in each state.  
      - Beliefs must be consistent with the policy to avoid incoherence (as in Case 1’s 50-50 error).  
    - This adds a layer of complexity: agents cannot form beliefs *before* choosing a policy because beliefs *require* a policy. The choice must optimize globally, with beliefs and policy co-determined.  
  - **Why it adds something new**:  
    - In standard frameworks (e.g., Savage’s decision theory), acts are chosen given fixed beliefs. Here, beliefs are endogenous to the policy, violating the "given where I am" logic.  
    - The feature necessitates a fixed point: a policy whose implied beliefs justify its actions (e.g., \(q = 7/12\) in Case 1 yields beliefs that make turning/continuing equal).

  ---

  ### (d) Coined Term: Definition, Test, and Non-Qualifying Cases  
  Since no established term suffices, I coin:  
  **Endogenous State Uncertainty (ESU)**  

  **Definition**:  
  A decision problem exhibits Endogenous State Uncertainty (ESU) if:  
  1. An agent faces multiple states ("occasions") that are indistinguishable at the time of acting.  
  2. The agent’s belief about their current state depends on the policy being evaluated, due to policy-driven state transitions or prior distributions.  
  3. Optimality requires selecting a uniform policy (a rule applied identically across all states) because conditioning actions on state-specific evidence is infeasible or incoherent.  
  4. The ignorance of state may be either involuntary (e.g., inherent indistinguishability) or deliberate (e.g., self-induced to enforce uniformity).  

  **Test for ESU**:  
  A decision problem has ESU if answering "yes" to all:  
  - Are states indistinguishable to the agent at decision time?  
  - Does the probability of being in each state depend on the agent’s policy?  
  - Would myopic reasoning (conditioning actions on fixed beliefs) lead to a suboptimal policy?  
  - Is a uniform policy necessary for optimality?  

  **Non-Qualifying Cases**:  
  1. **Standard POMDP with Discriminatory Signals** (resembles but does not qualify):  
     - An agent navigates two identical-looking rooms but hears a unique sound in each. They form state-dependent beliefs from the sound.  
     - *Why not ESU?* Beliefs come from exogenous signals, not policy-dependence. Actions can be state-specific.  
  2. **Precommitment without State Uncertainty** (resembles deliberate cases):  
     - An agent locks away a cookie jar to avoid temptation. They know their location (near the jar) but remove the *option* to act.  
     - *Why not ESU?* No state uncertainty; the agent knows where they are. Ignorance is of options, not location.

  ---

  ### (e) Name for the Move in Case 1  
  The move—**forming beliefs about one’s state from the policy being chosen**—is called:  
  **Rational Expectations in Policy Space (REPS)** or **On-Policy Belief Formation**.  

  - **Established basis**: In dynamic programming (e.g., POMDPs), this is "consistent belief updating" where beliefs are derived from the policy’s transition probabilities. In economics, it aligns with "rational expectations" (beliefs consistent with the model).  
  - **Why it resolves the difficulty**:  
    - Using fixed beliefs (e.g., 50-50) ignores how the policy affects state occupancy. REPS ensures beliefs are a fixed point: e.g., for \(q = 7/12\), beliefs (\(12/17\) first underpass, \(5/17\) second) make actions equally good, validating the policy.  
  - **Key insight**: The agent is entitled to REPS because the policy determines state frequencies; ignoring this leads to incoherence.  

  ---

  ### Verdict: Endogenous State Uncertainty  
  **Verdict: Endogenous State Uncertainty**  

  **Why this term**:  
  - "Endogenous" captures the policy-dependence of evidence.  
  - "State uncertainty" centers on ignorance of location.  
  - It covers both involuntary (Case 1) and deliberate (Case 2) forms under one umbrella.  
  - It distinguishes the feature from related concepts (e.g., POMDPs as a framework, strategic ignorance as a subset).  

  **Carving the phenomenon**:  
  - ESU arises when evidence about location is entangled with the policy choice, forcing a uniform rule.  
  - It is not about hidden payoffs, changing preferences, or option restriction; it is about *location uncertainty* that is *shaped by the agent’s own strategy*.  
  - Edges: ESU requires (1) indistinguishability, (2) policy-dependent beliefs, and (3) uniform policies as necessary for coherence. Cases lacking these (e.g., observable states, exogenous beliefs) fall outside.
