  We are constructing a triage procedure for contested terms in a terminology panel. The procedure is based on the idea of banning the contested term and requiring restatements in substitute terms, but we must account for practical constraints (no philosophy training, no time for lengthy discussions) and several possible outcomes.

  The key outcomes we want to distinguish and route are:
  1. Disagreement evaporates under substitution (merely verbal, but note: "verbal" does not mean unimportant).
  2. The word carries two senses -> split the entry.
  3. The predicate is vague -> panel must fix a boundary (cutoff).
  4. Parties differ about the world -> need evidence, not definition.
  5. Merely verbal between the disputants but still requires a binding decision because of legal effect.

  Additionally, we must handle the case where a member refuses to offer a substitute.

  We also note that a verdict of "merely verbal" must not be used to dismiss a colleague. We must build a guard against that.

  The procedure will be a set of ordered questions. For each question, we must state:
  - The question
  - What counts as a sufficient answer
  - The exits (i.e., what to do if the condition is met)

  We'll then create a one-page version for the panel.

  After that, we'll note which distinctions from the underlying method we dropped and why, and which we kept at the cost of clumsiness.

  We'll mark steps that are judgment calls.

  Then we run the procedure on the three terms and provide:
  - Classification
  - Exit
  - Glossary action
  - Sentence for the minutes

  Finally, we'll note what the procedure cannot do.

  Let's design the procedure step by step.

  **Procedure: Triage for Contested Terms**

  **Step 0: Preparation**
  - The chair reminds the panel that the goal is to resolve disagreements about terminology, and that the process is designed to be fair and efficient. The chair also notes that the term in question has real-world consequences (as stated in the problem).

  **Step 1: Ban the term**
  - Question: "Let's set aside the term [contested term] for now. Can each side restate their position without using that term, using substitute words or phrases that the other side can accept as a fair representation of their view?"
  - Sufficient answer: Each side must provide at least one substitute phrase that captures their intended meaning and that the other side agrees is a fair restatement. If they cannot agree on a substitute, they must at least provide their own substitute and the other side must acknowledge that they understand the restatement (even if they don't agree with the substance).
  - Exits:
    - If both sides provide substitutes and the other side accepts them as fair restatements: proceed to Step 2.
    - If a member refuses to offer a substitute: skip to Step 5 (Refusal Path).
    - If after 5 minutes of discussion no substitutes are produced: skip to Step 5.

  **Step 2: Test for agreement on substance**
  - Question: "Now that we have these substitute phrases (e.g., 'A' from side 1 and 'B' from side 2), do the two sides disagree about the facts of the world when using these substitutes? Or do they agree on the facts but are using different words?"
  - Sufficient answer: The panel must discuss whether the disagreement is about the facts (what is true in the world) or about the words (how to label the same facts). The chair should ask each side: "If we used the substitute phrase from the other side, would you still object? Why?"
  - Exits:
    - If both sides agree that using the other side's substitute phrase would be acceptable (i.e., they realize they are saying the same thing in different words): Outcome 1 (Disagreement evaporates). Go to Outcome Handling.
    - If one or both sides say that even with the substitute phrases, they still disagree because they are describing different concepts: proceed to Step 3.

  **Step 3: Check for two distinct senses**
  - Question: "Are these two substitute phrases capturing two different concepts that are both important and need to be represented in the standard?"
  - Sufficient answer: The panel must discuss whether the two substitutes are:
    (a) Two different aspects that should be split (e.g., one is about temperature and the other about humidity).
    (b) Two different ways of measuring the same underlying concept (e.g., one uses a fixed threshold and the other uses a dynamic index) and the panel must choose one.
    (c) Two different concepts that are both valid but distinct and should be split into two entries.
  - Exits:
    - If the panel agrees that the two substitutes represent two distinct concepts that are both necessary: Outcome 2 (Split the entry). Go to Outcome Handling.
    - If the panel agrees that the two substitutes are two ways of measuring the same concept and the disagreement is about where to draw the line (e.g., a cutoff): Outcome 3 (Fix a boundary). Go to Outcome Handling.
    - If the panel agrees that the two substitutes are about the same concept but the disagreement is about which one is correct based on evidence (e.g., which measure better predicts mortality): Outcome 4 (Need evidence). Go to Outcome Handling.
    - If the panel cannot agree on which of the above applies, but it is clear that the disagreement is not about the facts but about the words (and the words have legal consequences): Outcome 5 (Merely verbal but requires decision). Go to Outcome Handling.

  **Step 4: Handling Outcome 4 (Need evidence)**
  - If the outcome is that evidence is needed, the panel must decide:
    - What evidence would resolve the issue? (e.g., a study comparing the two measures against mortality data)
    - Can the evidence be obtained in a reasonable timeframe? If yes, defer the term until the next cycle and assign evidence gathering. If no, then the panel must either choose one based on available evidence (and document the reason) or (if the evidence is truly lacking) mark the term as unresolved and note the need for research.

  **Step 5: Refusal Path (when a member refuses to offer a substitute)**
  - Question: "Since we cannot run the substitution test, we must try to understand the nature of the disagreement in other ways. Let each side state their position again, and let's see if we can rephrase the disagreement without the term."
  - Sufficient answer: The chair tries to reframe the positions without the term, or the panel attempts to break down the disagreement.
  - Exits:
    - If the chair can restate the positions in a way that both sides accept, then proceed to Step 2 with those restatements.
    - If not, then the chair must note that the term is stuck and the panel must vote. The vote is a last resort. The chair should remind the panel of the real-world consequences and the need for a decision. The outcome of the vote is recorded and the glossary action is taken accordingly.

  **Outcome Handling:**
  - For each outcome, we have a glossary action and a minute note.

  **Outcome 1: Disagreement evaporates (merely verbal)**
  - Glossary action: The panel agrees on a single definition that captures the shared concept. The contested term is defined accordingly.
  - Minute note: "The panel determined that the disagreement over the term [term] was primarily verbal. Both parties agreed that the concept could be captured by [agreed definition]. The term [term] will be defined as [definition]."

  **Outcome 2: Split the entry**
  - Glossary action: Create two new terms (or subterms) for the two distinct senses. The original term might be deprecated or used as a broader category.
  - Minute note: "The panel identified two distinct concepts underlying the term [term]: [concept A] and [concept B]. The term [term] will be split into [term A] and [term B] with respective definitions."

  **Outcome 3: Fix a boundary (vagueness)**
  - Glossary action: The panel sets a cutoff (e.g., a specific temperature, a duration) based on available evidence and practical considerations. The definition includes this boundary.
  - Minute note: "The panel determined that the term [term] requires a clear boundary. After discussion, the boundary was set at [value] based on [reason, e.g., available evidence, operational feasibility]. The term [term] is defined as [definition including boundary]."

  **Outcome 4: Need evidence**
  - Glossary action: Defer the term until the next cycle if evidence can be gathered. If not, make a provisional decision with a note that it is based on the best available evidence and may be revisited.
  - Minute note: "The panel concluded that the disagreement on [term] hinges on evidence about [specific issue]. The term is deferred until the next meeting to allow for evidence gathering [or: The panel made a provisional decision to define [term] as [definition] based on the best available evidence, with a note that this may be updated when new evidence emerges]."

  **Outcome 5: Merely verbal but requires binding decision**
  - Glossary action: The panel must choose one definition. The choice should be based on the standard's goals, legal requirements, and practical consequences. The minute must clearly state that the decision is binding and necessary for consistency, even though the disagreement was verbal.
  - Minute note: "The panel recognized that the disagreement over [term] was primarily about the label and not the underlying facts, but due to the legal and operational necessity of having a single definition, the panel decided to define [term] as [definition]. This decision was made to ensure consistency in [application]."

  **Guard against dismissing via "merely verbal":**
  - The chair must frame Outcome 1 and 5 as a success of the process: "We have clarified that the disagreement was about words, which means we can now agree on a common language without changing our substantive views. This is a win for clarity."
  - The minute note for Outcome 1 and 5 should not imply that the issue was trivial, but rather that the process resolved a labeling issue.

