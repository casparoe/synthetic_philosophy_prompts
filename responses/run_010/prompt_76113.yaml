  - For the inclusion: Outcome 5 (must have a binding decision) to keep the term.

  Glossary action: Keep the term and define it as: "a group of individuals with increased risk during heat events due to personal characteristics (e.g., age, specified comorbidities) or circumstances (e.g., no working cooling, outdoor work, living alone, no vehicle), or a combination thereof."

  Minute note for the definition: "The panel determined that vulnerability during heat events can arise from both personal characteristics and circumstances. The term 'vulnerable population' is defined to include both aspects."

  Minute note for the inclusion: "The panel reaffirmed the inclusion of the term 'vulnerable population' in the standard to explicitly recognize the unequal distribution of heat risk. The argument that the term is advocacy language was noted, but the panel concluded that it is a scientifically valid concept when properly defined."

  Now, let's formalize for each term.

  **Term 1: Excessive heat event**

  - Classification: Outcome 4 (need evidence) -> but with evidence reviewed, panel makes a decision.
  - Exit: Outcome 4 with decision.
  - Glossary action: Define using the humidity-adjusted index, as it better predicts mortality (assuming the data supports that).
  - Minute note: "The panel reviewed submitted data and found that humidity-adjusted indices better predict heat-related mortality than dry-bulb temperature alone, especially during high-humidity events. Therefore, 'excessive heat event' is defined using [specify the humidity-adjusted index and threshold]."

  **Term 2: Heat emergency**

  - Classification: Outcome 5 (merely verbal in the sense of two valid approaches, but a single definition is needed for legal reasons).
  - Exit: Outcome 5.
  - Glossary action: Define based on forecast conditions.
  - Minute note: "The panel agreed that the primary purpose of declaring a 'heat emergency' is to enable proactive measures to prevent harm. Therefore, the definition is based on forecast conditions meeting specified criteria, to allow for advance actions such as opening cooling centers and implementing moratoriums."

  **Term 3: Vulnerable population**

  - Classification: 
    - For the definition: Outcome 1 (disagreement evaporates with a combined definition).
    - For the inclusion: Outcome 5 (binding decision to keep the term).
  - Exit: Outcome 1 for definition, Outcome 5 for inclusion.
  - Glossary action: Keep the term and define with both personal and circumstantial factors.
  - Minute note: "The panel defined 'vulnerable population' to include individuals with increased risk due to personal characteristics (e.g., age, comorbidities) or circumstances (e.g., lack of cooling, outdoor work). The panel also reaffirmed the inclusion of the term in the standard to acknowledge the unequal distribution of heat risk, which is a key public health concern."

  ---

  **What the Procedure Cannot Do**

  1. **Deep-seated policy disagreements**: If the disagreement is about the goals of the standard (e.g., prevention vs. response) and not about facts or definitions, the procedure may force a decision (Outcome 5) but cannot resolve the underlying policy issue. The minute may not satisfy all parties.

  2. **Multiple competing definitions (more than two)**: The procedure is designed for two sides. With more, it becomes messy and may require multiple rounds or voting.

  3. **Disagreements based on values or ethics**: If the disagreement is about what the standard _should_ value (e.g., equity vs. efficiency), the procedure cannot resolve it. It will be forced into Outcome 5.

  4. **When evidence is ambiguous or not available**: Outcome 4 may lead to a provisional decision that is arbitrary if evidence is lacking.

  5. **When a term is fundamentally contested in the literature**: If experts in the field cannot agree, the procedure may not help and may force an artificial resolution.

  **How to recognize you are in one of these**:

  - The discussion keeps coming back to core values or policy goals.
  - The disagreement persists even after following the procedure, and members are not satisfied with any outcome.
  - The disagreement is not about the term itself but about the scope or purpose of the standard.
  - Evidence is mixed, contradictory, or absent, and the panel feels they are making a guess.
  - The literature shows multiple equally valid definitions and the panel has no basis to choose.

  In such cases, the chair should note the impasse and possibly escalate to the sponsor or seek external input.

