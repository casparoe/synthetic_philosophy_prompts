  ### Triage Procedure for Contested Terms  
  **One-Page Panel Version**  

  1. **Ban the term**:  
     - *Question*: "Set aside the contested term. Restate your position using new words the other side accepts as fair."  
     - *Sufficient answer*: Each side provides a substitute phrase. The other side must agree it captures their intent (even if they disagree on substance).  
     - *Exit*: If substitutes are accepted → Go to Step 2. If refusal/no agreement in 5 mins → Go to Step 5.  

  2. **Test disagreement on facts**:  
     - *Question*: "Using these substitutes, do you still disagree? Is it about what’s true (facts) or what to call it (words)?"  
     - *Sufficient answer*: Sides clarify if they object to the substitute itself or the facts behind it.  
     - *Exit*: If both sides accept each other’s substitutes (disagreement was just words) → **Outcome 1**. If not → Go to Step 3.  

  3. **Check for two concepts or boundary issue**:  
     - *Question*: "Are these substitutes two different ideas (split the term)? Two ways to measure the same idea (set a cutoff)? Or a factual dispute (need evidence)?"  
     - *Sufficient answer*: Panel discusses if the substitutes represent distinct concepts, a vague boundary, or conflicting evidence.  
     - *Exit*:  
       - Two distinct ideas → **Outcome 2**.  
       - Same idea, but boundary is fuzzy → **Outcome 3**.  
       - Conflict about what’s true → **Outcome 4**.  
       - None of these, but term has legal effect → **Outcome 5**.  

  4. **Handle outcomes**:  
     - **Outcome 1 (Evaporated)**: Glossary uses agreed concept. Minutes: "Disagreement was verbal; term defined as [definition]."  
     - **Outcome 2 (Split)**: Term divided into two entries. Minutes: "Term split into [Term A] and [Term B] to reflect distinct concepts."  
     - **Outcome 3 (Boundary)**: Panel sets cutoff (e.g., temperature threshold). Minutes: "Boundary fixed at [value] based on [reason]."  
     - **Outcome 4 (Evidence)**: Defer for data or decide provisionally. Minutes: "Deferred for evidence on [issue]" or "Provisional definition based on current evidence."  
     - **Outcome 5 (Verbal but binding)**: Panel chooses one definition. Minutes: "Disagreement verbal; definition [chosen] adopted for legal consistency."  

  5. **Refusal to substitute (Step 5)**:  
     - *Question*: "Without substitutes, restate positions plainly. Can we rephrase the disagreement?"  
     - *Sufficient answer*: Chair reframes without the term; sides confirm accuracy.  
     - *Exit*: If reframed → Return to Step 2. If not → Vote. Minutes: "Term resolved by vote due to lack of substitutes."  

  **Guard against dismissal**:  
  - Chair must say: "A 'verbal' outcome means we agree on facts but not words—this is crucial for clarity, not a dismissal." Reinforce that Outcome 5 respects legal stakes.  

  ---  
  **Design Choices**  
  - **Dropped distinctions**:  
    - *Deep epistemic analysis*: Original method probes "why" parties fix meanings. Dropped for speed; panel lacks philosophy training.  
    - *Full sense decomposition*: We don’t dissect all possible word senses. Kept only "split vs. boundary" to avoid complexity.  
  - **Kept at cost of clumsiness**:  
    - *Judging "distinct concepts" (Step 3)*: Requires subjective panel discussion. Kept because splitting terms is common.  
    - *Handling Outcome 4 in-meeting*: Panel may lack expertise to weigh evidence. Kept to force action, but risks arbitrary cuts.  

  **Judgment Calls Dressed as Procedure**:  
  - Step 2 (facts vs. words): Chair interprets if objections are substantive.  
  - Step 3 (concept vs. boundary): Panel decides if substitutes are "different ideas" or "fuzzy measure."  
  - Step 5 (reframing): Chair’s rephrase may bias outcomes.  

  ---  
  **Term Applications**  

  1. **Excessive heat event**  
     - **Process**:  
       - *Step 1*: Side 1: "3+ days ≥100°F." Side 2: "Heat index ≥X for 2+ days." Both accept as fair.  
       - *Step 2*: Disagreement survives (Side 2 rejects dry-bulb; Side 1 rejects humidity).  
       - *Step 3*: Not two concepts (both target "dangerous heat"). Not vague boundary (two measures). Conflict is factual: which predicts mortality?  
     - **Classification**: Outcome 4 (need evidence).  
     - **Exit**: Evidence submitted; panel evaluates in-room.  
     - **Glossary action**: Define using humidity index (data shows better mortality correlation).  
     - **Minutes**: "Data indicates humidity-adjusted indices better predict mortality. 'Excessive heat event' defined as [specified index] exceeding [threshold] for [duration]. Dry-bulb alternative rejected due to lower predictive accuracy per submitted studies."  

  2. **Heat emergency**  
     - **Process**:  
       - *Step 1*: Side 1: "Declaration when forecast meets danger criteria." Side 2: "Declaration after observed excess deaths." Both accept as fair.  
       - *Step 2*: Disagreement survives. Parties agree on forecasts/deaths but not trigger.  
       - *Step 3*: Not two concepts (both define "emergency"). Not boundary or evidence issue (no factual dispute). Outcome 5: verbal but binding due to statute.  
     - **Classification**: Outcome 5 (verbal but binding).  
     - **Exit**: Panel chooses based on statutory intent (prevention).  
     - **Glossary action**: Define using forecast trigger.  
     - **Minutes**: "Parties agree on factual conditions but differ on declaration trigger. For proactive harm prevention (statutory intent), 'heat emergency' defined by forecast criteria. Observed deaths may inform revisions but are not the trigger."  

  3. **Vulnerable population**  
     - **Process**:  
       - *Step 1*: Side 1: "People with risk traits (age/comorbidities)." Side 2: "People in risk circumstances (no cooling/outdoor work)." Side 3: "Remove term (non-scientific)." Side 4: "Keep term (acknowledges inequality)." All accept as fair.  
       - *Step 2 (definition)*: Sides 1/2 agree on facts (both factors matter) but not definition.  
       - *Step 3 (definition)*: Not two concepts; combined definition possible. Outcome 1: disagreement evaporates.  
       - *Step 2 (inclusion)*: Sides 3/4 disagree on term’s role (scientific vs. ethical). Outcome 5: binding decision needed.  
     - **Classification**: Outcome 1 (definition); Outcome 5 (inclusion).  
     - **Exit**: Adopt combined definition; retain term.  
     - **Glossary action**: Define with traits + circumstances; keep term.  
     - **Minutes**: "Vulnerability arises from personal traits or circumstances. Term defined inclusively. Retention aligns with standard’s role in highlighting unequal risk distribution; removal would obscure this. 'Advocacy' objection noted but overruled given public health imperative."  

  ---  
  **What the Procedure Cannot Do**  
  - **Misclassifies**:  
    - **Value conflicts** (e.g., equity vs. efficiency): Treated as Outcome 5, but the real issue is unresolvable by definitions. *Recognize when*: Debate centers on "should" not "what is," e.g., "We *should* prioritize fairness over cost."  
    - **Expertise gaps** (e.g., lacking evidence): Outcome 4 may force a guess. *Recognize when*: Panel says, "No data exists—we’re choosing blindly."  
    - **Strategic stubbornness**: Refusal to engage (Step 5) defaults to vote, which may inflame tensions. *Recognize when*: A member disengages or repeats talking points.  
    - **Intertwined terms** (e.g., systemic vs. individual factors): May force arbitrary splits (Outcome 2) or combined definitions (Outcome 1) that miss nuance. *Recognize when*: Disagreement persists after substitution; parties say, "This oversimplifies."  
  - **Response**: Escalate to sponsor, seek external review, or flag for revision in the next cycle.  

  **Final Note**: This procedure ensures clarity and legal defensibility but cannot resolve all human or political conflicts. Your role as chair is to enforce rigor, not neutrality—use your signature to anchor decisions in the standard’s mission.
