prompt: |-
  You are a philosopher of science who specializes in the scientific realism debate and in the pessimistic meta-induction, and who is willing to get formal rather than reaching for the first available label. Please think carefully before answering. Open with a short brainstorming pass in which you list candidate principles for splitting a successful-but-false theory into a part that survives and a part that does not — including candidates you expect to reject, and including at least one that strikes you as obviously wrong but is worth stating so that I can see exactly why it fails.

  Here is my situation. I want to be a scientific realist: I want to say that our best current theories are approximately true and that their central terms refer. I also accept the raw material of the pessimistic meta-induction, namely the record of theories that were enormously successful and turned out false. My strategy, like most people's, is to insist that in each such case only part of the theory was thrown away, and that the surviving part is what explains the success. But when I try to say which part, I find that my case-by-case judgments do not appear to come from a single rule, and I suspect that some of them are mutually inconsistent. So I am reporting my verdicts and asking what principle, if any, they add up to.

  1. Phlogiston. Burning bodies contain and release a substance; calcination is its release; ores are recombined with it by charcoal. It explained a great deal and was used quantitatively for the better part of a century. Verdict: nothing in it is even approximately true, and "phlogiston" refers to nothing. No qualification.

  2. Caloric. A weightless, self-repulsive, conserved fluid flowing from hot to cold. Verdict: the fluid is gone, but Carnot's result about the maximum work obtainable from an engine running between two temperatures was proved inside caloric theory and is still true, and Fourier's conduction equation, written in caloric terms, is still correct and still taught. So the theory is partly preserved — though I cannot say what the preserved part is except by pointing at the mathematics.

  3. Fresnel's ether. A wave theory of light in a medium with specific elastic properties. It predicted a bright spot at the center of a circular shadow, which Poisson raised as a reductio and Arago then observed, and it yielded the drag coefficient for light in moving media that Fizeau later measured. Verdict: the optical mathematics survives essentially intact and the medium does not. Fresnel was approximately right about light and wrong about what carries it; "the ether" refers to nothing.

  4. Lorentz. A stationary ether, electrons, local time, length contraction, and transformations that remain the core of relativity. Verdict: nearly all of the mathematics survives, essentially none of the ontology does, and yet I do not want to credit Lorentz with approximate truth in the way I credit Fresnel. I cannot say why not.

  5. Ptolemy. Epicycles, deferents, and the equant, predicting planetary positions usefully for some fifteen centuries. Verdict: not approximately true in any degree — the planets were not doing that. But the machinery survives as a truncated Fourier analysis of periodic motion and is still used in perturbation theory.

  6. Newton. Mass, force, momentum, gravity as instantaneous action at a distance, absolute space and time. Verdict: mass and momentum survive as low-velocity limits; gravity as a force does not survive into general relativity, where it is spacetime curvature; absolute space and time do not survive. And yet I want to call Newtonian mechanics approximately true as a whole, while refusing that description to the ether theory of light.

  7. Lavoisier's oxygen. Named for being the acid-forming principle, which is false: hydrochloric acid contains no oxygen. Verdict: "oxygen" refers to oxygen, and the chemistry of combustion and respiration was preserved, but the property that fixed the name was wrong. This makes me uneasy, since if a name survives the falsity of the very property it was coined for, I do not see what blocks "phlogiston" from referring.

  8. Mendel. Discrete hereditary factors, segregating and assorting independently, with dominance. Verdict: approximately true, and his factors refer to genes, despite his knowing nothing of chromosomes or DNA and despite dominance being a contingent pattern that is often violated.

  9. Boltzmann. Atoms and molecules, temperature as mean kinetic energy, entropy as a count of microstates — maintained against critics who denied that unobservable atoms earned their keep. Verdict: straightforwardly true.

  10. Bohr's atom, the one I keep flip-flopping on. Electrons in circular orbits with quantized angular momentum, jumping between them and emitting a quantum. The orbits are false, but the energy levels, the quantum numbers, the Balmer lines, and the shell explanation of the periodic table survive. I lean toward calling it approximately true — except that this looks like precisely the move I refused for Ptolemy, whose numerical machinery also survives.

  Two pairs I cannot reconcile. First, Boltzmann's molecules and the ether: both were posited to explain the same general territory, both were quantitatively indispensable to the predictions that made their theories successful, and both were unobservable in principle. One refers and one does not. So any principle that credits a posit for doing real explanatory work rather than sitting idle gives the wrong answer for the ether. Second, Fresnel and Ptolemy: both are preserved mathematically, and one gets credit for approximate truth while the other gets none. So any principle that says the structural or relational content is what survives either credits Ptolemy with being approximately right or fails to explain why Fresnel is different.

  Notice before you begin that my verdicts are stated in at least three currencies — reference, approximate truth, and preservation — and part of my problem may be that I am sliding among them without noticing.

  There is also a general worry I want you to confront rather than set aside. My splits look as though they are drawn with hindsight, using knowledge the historical scientists lacked: I know there is no ether and that gravity is curvature, and I then identify as "preserved" exactly the parts consistent with what I already believe. If that is what I am doing, the principle cannot be applied by a working scientist to decide what to believe, and it cannot explain why the preserved part was successful when it was.

  What I would like back:

  (a) Two to four candidate dividing principles, each stated as an explicit schema or conditional that could be applied to a case you have never seen — not as a slogan — with each clause tied to the case of mine that forced it in.

  (b) For each candidate, its verdict on all ten of my cases, with every mismatch flagged and explained.

  (c) Its verdict on at least three cases I have not listed, at least two of them outside physics and chemistry, and including one where a false mechanism was later replaced while the observable regularity stood firm.

  (d) A forward-looking test: apply your recommended principle to at least two live posits — a particle constituting dark matter, and the field driving cosmic inflation — and say whether a realist today can commit to them now, prospectively, and what would count as having gotten it wrong.

  (e) A direct answer to the hindsight worry: can the principle be stated so that someone in 1890 could have used it, without knowing our results, to guess which parts of their theory would survive? If it cannot, does that destroy the realist's explanation of success, or is the cost smaller than it looks?

  (f) A recommendation. If I must abandon one verdict to obtain a simple principle, which is cheapest to give up and what do I lose by giving it up? Set that against the complex principle that saves all ten, and tell me honestly whether its complexity is principled or merely my prejudices written down as a list of exceptions.

  Practical constraints: work from the cases above and from general knowledge. Do not give me a bibliography, a reading list, or citations, and do not point me to sources; if you invoke a named position, gloss it in a sentence or two so the label does no unexplained work. Use numbered sections and keep the prose tight. If one of my verdicts is not merely unprincipled but confused — if it rests on a distinction that will not bear weight — say so plainly and identify the confusion. I would rather be corrected than accommodated.
reasoning: |-
  Hmm, this user is deeply engaged with scientific realism and the pessimistic meta-induction challenge. They've presented ten carefully considered historical cases where successful theories turned out false, but with varying degrees of "survival" – and they're frustrated by inconsistent intuitions about what parts get preserved. The core tension is between their realist desires and historical counterexamples.

  Looking at their cases, three patterns emerge: 
  First, ontological failures (phlogiston, ether) versus structural survivals (Fresnel's equations, Carnot's theorem). 
  Second, reference puzzles where naming properties were wrong (oxygen) versus successful referential chains (Mendel's factors). 
  Third, their asymmetric treatment of similar cases – why credit Fresnel but not Ptolemy when both have mathematical survivals? Why accept Lorentz's math but reject his ontology while doing the opposite for Newton?

  Their self-awareness about hindsight bias is acute. Any solution must address whether a 19th-century scientist could apply the principle prospectively. The demand for formal schemas rather than slogans suggests they've exhausted superficial solutions.

  Key challenges I need to tackle:
  1) Their three "currencies" (reference, approximate truth, preservation) are indeed being conflated – these need disentangling.
  2) The Ptolemy/Fresnel asymmetry reveals a hidden criterion: whether the mathematics maps onto reality's causal structure or merely describes appearances.
  3) The oxygen case exposes that reference determination isn't about initial definitions but sustained causal chains – Lavoisier's "acid-maker" was wrong, but the underlying substance was robustly manipulable.
  4) Lorentz is tricky because special relativity *is* his mathematics stripped of ether – but granting him approximate truth feels wrong because the ontology was fundamentally misleading about spacetime's nature.

  For the forward-looking test: Dark matter's posit (weakly interacting particles) passes the structural/independent access test if multiple detection methods converge. Inflationary field fails if the B-mode polarization remains undetected – its current success is too model-dependent.

  The cheapest verdict to abandon might be Ptolemy – we could reframe epicycles as early Fourier analysis that *does* capture real orbital harmonics, just not as fundamental physics. But this risks weakening the realist position against anti-realists who'd say all theories are just instruments.

  Ultimately, a multi-axis framework is unavoidable. The structural preservation axis (mathematical dependencies) explains Fresnel/Lorentz. The referential axis (causal grounding) explains oxygen/Mendel. The ontological axis (independent access) separates Boltzmann from ether. This complexity isn't ad hoc – it mirrors science's own layered progress.
answer: |-
  ### Brainstorming Candidate Principles  
  1. **Structural Dependency Principle (SDP)**: A component survives if it is structurally indispensable to the theory’s predictive success *and* its mathematical form remains invariant under successor theories. Rejects ontologies not required for derivations.  
  2. **Operational Robustness Principle (ORP)**: A component survives if it corresponds to an entity/property that can be measured or manipulated independently of the false theoretical framework. Rejects posits accessible only through the theory’s own constructs.  
  3. **Referential Grounding Principle (RGP)**: A term refers if its associated properties are *approximately causally efficacious* in producing evidence, even if descriptively flawed. Rejects terms defined by essential false properties.  
  4. **Wrong but Tempting: Preservation of Predictive Core (PPC)**: Any part directly responsible for a novel prediction survives. *Fails*: Ptolemy’s epicycles predicted successfully but were false; predictive success ≠ truth-tracking.  

  ---

  ### Analysis of Principles  
  #### **1. Structural Dependency Principle (SDP)**  
  *Schema*: Component C of theory T survives if:  
  (i) C is necessary to derive T’s successful predictions,  
  (ii) C’s mathematical relations are preserved in successor theories.  

  *Verdicts on Cases*:  
  - **Phlogiston**: Fails (ii). No mathematics preserved. ✓  
  - **Caloric**: ✓ (Carnot’s theorem/Fourier’s equation preserved mathematically).  
  - **Fresnel**: ✓ (Optical equations preserved).  
  - **Lorentz**: ✓ (Lorentz transformations preserved).  
  - **Ptolemy**: ✗ **Mismatch**. Mathematics preserved (Fourier analysis), but you deny approximate truth. *Explanation*: SDP credits structural preservation, but you demand ontology.  
  - **Newton**: ✓ (Equations for mass/momentum preserved as limits).  
  - **Lavoisier**: ✗ **Mismatch**. "Oxygen" not mathematical. SDP silent on reference.  
  - **Mendel**: ✗ **Mismatch**. Factors not mathematical.  
  - **Boltzmann**: ✓ (Kinetic theory equations preserved).  
  - **Bohr**: ✓ (Energy levels/quantum numbers preserved mathematically).  

  *New Cases*:  
  - **Miasma Theory (medicine)**: False mechanism (bad air) but hygiene practices (e.g., sanitation) preserved. SDP ✗ (no mathematics).  
  - **Geocentric Astronomy (Tychonic)**: Mathematical predictions preserved; SDP ✓.  
  - **Vitalism (biology)**: False "life force" ontology; preserved metabolic pathways (e.g., glycolysis equations). SDP ✓ for pathways.  

  *Forward-Looking Test*:  
  - **Dark matter particle**: Survives only if its gravitational effects remain indispensable in ΛCDM cosmology *and* equations persist in successors.  
  - **Inflation field**: Survives only if inflationary perturbations’ math persists post-theory.  

  *Hindsight Worry*: Scientists in 1890 could identify components *necessary* for derivations (e.g., Fresnel’s equations for diffraction). Surviving mathematics is retrospectively confirmed but prospectively identifiable as "load-bearing." Explains success: structural dependencies capture real patterns.  

  ---

  #### **2. Operational Robustness Principle (ORP)**  
  *Schema*: Component C survives if C can be detected, measured, or manipulated via methods separable from T’s false ontology.  

  *Verdicts on Cases*:  
  - **Phlogiston**: ✗ (No independent access). ✓  
  - **Caloric**: ✗ (Temperature/heat flow measurable without fluid). ✓  
  - **Fresnel**: ✗ (Ether not detectable independently). ✗ **Mismatch**: You credit optics.  
  - **Lorentz**: ✗ (Ether undetectable). ✓  
  - **Ptolemy**: ✗ (Epicycles not observable/operational). ✓  
  - **Newton**: ✓ (Mass/force measurable via mechanics).  
  - **Lavoisier**: ✓ (Oxygen isolatable via combustion).  
  - **Mendel**: ✓ (Factors inferred from cross-breeding).  
  - **Boltzmann**: ✓ (Atoms confirmed via Brownian motion).  
  - **Bohr**: ✗ (Orbits not observable; only spectral lines). ✗ **Mismatch**: You credit energy levels.  

  *New Cases*:  
  - **Phrenology (psychology)**: False ontology (skull shapes), but correlation between brain regions/functions preserved. ORP ✓ for functional localization (via lesions/fMRI).  
  - **Caloric (revisited)**: Thermometers operationalized "heat" without fluid; ORP ✓.  
  - **Lysenkoism (biology)**: False inheritance mechanism; no robustly measurable components. ORP ✗.  

  *Forward-Looking Test*:  
  - **Dark matter**: Survives only if detected via multiple independent methods (e.g., gravitational lensing + CMB).  
  - **Inflation field**: Fails ORP; only inferred from CMB patterns.  

  *Hindsight Worry*: Scientists can prospectively ask: "Can we observe/measure C without assuming T?" (e.g., 1890s physicists knew ether was undetectable). Explains success: robustly accessible entities track reality.  

  ---

  #### **3. Referential Grounding Principle (RGP)**  
  *Schema*: Term "X" refers if:  
  (i) X’s *causal role* in producing evidence is approximately correct,  
  (ii) Misdescriptions do not block a causal-historical link to a real entity.  

  *Verdicts on Cases*:  
  - **Phlogiston**: ✗ (No real entity; causal role: oxidation misattributed). ✓  
  - **Caloric**: ✗ (No fluid; heat is motion). ✓  
  - **Fresnel**: ✗ ("Ether" has no causal role today). ✓  
  - **Lorentz**: ✗ (Ether causally inert). ✓  
  - **Ptolemy**: ✗ (No deferents/epicycles). ✓  
  - **Newton**: ✓ (Mass/gravity causally efficacious).  
  - **Lavoisier**: ✓ ("Oxygen" refers: causal role in combustion correct despite false descriptor).  
  - **Mendel**: ✓ ("Factors" causally ground heredity).  
  - **Boltzmann**: ✓ (Atoms causally efficacious).  
  - **Bohr**: ✓ (Electrons causally explain spectra; orbits are misdescribed).  

  *New Cases*:  
  - **Humoral Theory (medicine)**: "Black bile" ✗ (no entity); "blood" ✓ (causal role in oxygen transport preserved).  
  - **Galenic Anatomy**: "Animal spirits" ✗; "nerves" ✓ (causal role in signaling).  
  - **Prout’s Hydrogen Atom**: False (all elements from H), but "hydrogen" refers correctly. RGP ✓.  

  *Forward-Looking Test*:  
  - **Dark matter**: Refers if it causally influences galaxies (e.g., via gravity).  
  - **Inflation field**: Refers only if it generates CMB fluctuations; failure if fluctuations are artifacts.  

  *Hindsight Worry*: Scientists can ask: "Does X play the causal role attributed?" (e.g., 1890s: ether played no detectable causal role). Success explained by causal accuracy.  

  ---

  ### Recommendation & Reconciliation  
  **Your Core Inconsistencies**:  
  - **Boltzmann vs. Ether**: ORP resolves this. Atoms were independently confirmed (Brownian motion); ether was not.  
  - **Fresnel vs. Ptolemy**: SDP + RGP resolve this. Fresnel’s equations describe light’s *causal structure* (RGP); Ptolemy’s epicycles are *non-causal mathematical tools* (SDP only).  

  **Cheapest Sacrifice**: Abandon "Ptolemy not approximately true." Under SDP, his mathematics *is* approximately true as a kinematic description (like Fourier analysis). Cost: weakens "approximate truth" to include instrumental models.  

  **Best Unified Principle**: **Causal-Structural Principle (CSP)**  
  - *Schema*: Component C survives if:  
    (i) It is structurally indispensable to predictions (SDP), *and*  
    (ii) It corresponds to a real causal node (RGP) OR is operationally robust (ORP).  
  - *Saves All 10*:  
    - Ptolemy: Fails (ii) → no survival (epicycles lack causal/operational reality).  
    - Others: Consistent with your verdicts (e.g., Fresnel: SDP + RGP for light; Lorentz: SDP only for math).  
  - *Complexity*: Principled. Distinguishes *structural-preservation-only* (Lorentz math) from *causal-ontological survival* (Boltzmann).  

  **Hindsight Defused**: CSP is prospective. Scientists can ask:  
  1. Is C necessary for our predictions?  
  2. Is C causally active/operationally accessible beyond the theory?  
  *(e.g., 1890: Ether fails #2; electrons pass #2 via cathode rays).*  
  Success explained by components latching onto real causal-structural patterns.  

  **Final Counsel**: Your intuitions track CSP. Abandon Ptolemy’s *fundamental* falsehood but accept his *instrumental* truth. This preserves realism: successful theories get structure *and* causality right where it counts.
