prompt: |-
  I run a two-person integrity unit at a mid-sized development agency. We fund local partner organisations in about eight countries and our own program officers send us referrals — the district health officer's brother just got hired onto the project, our country director was given a cow, someone had to slip 20 dollars to get a permit stamped — roughly five or six a month. At the moment we answer these off vibes and the results are embarrasing. If we flag something, a partner's funding can get suspended and a relationship we spent years building dies; if we don't, we're signing off on it and the board sees the pattern in aggregate at the quarterly review. There's no lawyer on call and I have maybe half a day a week for this.

  We do have one piece of house doctrine, a heuristic a previous director made up, and I want you to build a real procedure out of it while telling me where it breaks. The heuristic: a benefit is presumptively corrupt only if it's convertible, meaning whoever received it could turn it into cash, hand it to somebody else, or use it outside the relationship it was given in. A shared meal, a public ceremony honouring an official, a contribution that stays inside the community — not convertible, therefore not corrupt, no matter how large. Two riders. A convertible benefit is still cleared if the decision would have come out the same anyway. And anything gets flagged if neither party would want the arrangement described accurately in the local paper.

  What I need back is an ordered procedure a program officer with no legal or philosophical training can run in about thirty minutes per referral: the questions to ask in sequence, what counts as a sufficient answer to each, where it stops at no flag, what has to be written down for me, who signs off on what, and — importantly — the points where it hands the decision to a human being because the question is one of values rather than facts. Also tell me what to do when we simply can't find out a relevant fact, since half the time we can't.

  It has to say something about the relativism fight rather than ducking it. Half our board thinks we're exporting Western standards and should defer to local norms of gift-giving and obligation, which in a lot of these places are genuinely load-bearing, not a cover story. The other half thinks corruption is corruption everywhere and saying otherwise is a slur on the local staff who refuse to play. The definition the big international bodies use — the abuse of power someone has been entrusted with for private gain — doesn't settle it, and US anti-bribery law carves out small payments that merely speed up routine government action, which is a precedent I can't tell whether it helps us or undercuts us. So I want each step of your procedure labelled as to whether its answer is allowed to vary from country to country, and why.

  Then run it on three referrals. One: our country director accepted a cash contribution toward his daughter's wedding from a chief whose district we fund, it was announced publicly, and everyone in the district expected it of him — declining would have been the insult. Two: a partner put a project officer's brother on the payroll at a salary well above whatever work he actually does. Three: a training where every participant gets a per diem that everyone involved knows is the real reason they turn up.

  Be blunt about where the convertibility idea gets things backwards — my suspicion is that a job isn't liquid at all, but a brother on the payroll is worse than a cow — and about which steps are judgment calls dressed up as procedure. At least one of the three should come out with an answer I won't like, and I'd rather you say so than soften it.
reasoning: |-
  Okay, let me unpack this user's request. They run a two-person integrity unit at a development agency dealing with corruption referrals. Their current approach using a "convertibility" heuristic feels inadequate - causing embarrassment when they either overreact or underreact. 

  The core tension is palpable: freezing funds can destroy years-long partnerships, but ignoring issues creates systemic risks the board notices. With limited time (half-day weekly) and no legal support, they need a practical procedure built from their existing heuristic that field officers can apply in 30 minutes per case.

  Hmm... the convertibility concept seems both insightful and flawed. While it usefully excludes ceremonial gifts, it might undervalue relational corruption like nepotism. The user's example about jobs versus cows highlights this perfectly - a job isn't liquid but can be more damaging. 

  The political dimension is critical too. Their board is split between cultural relativists and universalists. Any procedure must explicitly address this by tagging which steps allow local variation. The "local newspaper test" feels like a smart common-ground solution - it's culturally aware while maintaining accountability.

  For the procedure itself, I'm thinking it needs:
  - Clear sequential questions (with exit ramps for non-issues)
  - Defined evidence standards (how much proof is needed)
  - Documentation requirements 
  - Explicit handoff points for value judgments
  - Contingencies for unverifiable facts

  The three test cases are brilliant stress tests:
  1. The wedding gift seems culturally embedded but risks reciprocity expectations
  2. Nepotism is textbook abuse even if disguised as employment
  3. Per diems as attendance incentives sit in that gray zone of "necessary corruption"

  I'll need to be brutally honest where convertibility fails - like case 2 where non-convertible nepotism is clearly worse than a convertible cow. And case 3 should probably get an "uncomfortable pass" to show we're not ducking hard calls.

  For implementation, a simple form with checkboxes and signature lines could work. Critical to include that "inconclusive" outcome option - so many referrals will have missing information. The approval chain should protect program officers by pushing final calls to the integrity unit.

  Most importantly, the procedure must surface value judgments rather than hiding them. That's likely where the real organizational growth will happen - when the board has to collectively own these gray-area decisions.
answer: |-
  Here’s a structured, field-operable procedure based on your heuristic, designed for efficiency and clarity. It addresses relativism explicitly, flags judgment points, and includes contingencies for missing facts. Crucially, it **rejects convertibility as the sole determinant** where it conflicts with core integrity risks.

  ---

  ### **Corruption Risk Assessment Procedure**  
  *For Program Officers (30-min max per referral)*  
  **Core Principle:** Convertibility alone is insufficient. Focus on *undue influence*, *accountability*, and *material harm*.

  ---

  #### **Step 0: Initial Triage** (5 mins)  
  **Action:** Complete the **Referral Intake Form** ([Template Below](#appendix-a)).  
  **Stop & Archive If:**  
  - Benefit value < 0.5% of project annual budget *AND* no power imbalance involved (e.g., minor vendor gift).  
  - Purely symbolic/ceremonial (e.g., plaque, public award).  
  **Document:** Basic facts (who, what, when, value estimate).  
  **Sign-off:** Program Officer only.  
  **Relativism Label:** 🟢 *Local variation allowed* (Thresholds adapt to local gift norms).

  ---

  #### **Step 1: Convertibility Test** (5 mins)  
  **Question:** *"Could the recipient realistically convert this benefit to cash, transfer it, or use it outside the specific context it was given?"*  
  **Sufficient Answer:**  
  - 🟢 **NO** (e.g., shared meal, public ceremony, community asset). → **Proceed to Step 2.**  
  - 🔴 **YES** (e.g., cash, livestock, jewelry, job). → **Proceed to Step 3.**  
  - 🟡 **UNCLEAR** (e.g., "gift" of services, ambiguous asset). → **Flag for Integrity Unit review**.  
  **Document:** Reasoning for answer.  
  **Relativism Label:** 🔴 *Universal standard* (Physical/economic convertibility is objective).

  ---

  #### **Step 2: "Same Decision" Test** (5 mins)  
  **Applies ONLY if Step 1 = 🟢 (Non-convertible).**  
  **Question:** *"Would the official decision (funding, permit, hire) have been identical WITHOUT this benefit?"*  
  **Sufficient Answer:**  
  - 🟢 **YES** (e.g., public ceremony AFTER funding decision). → **No flag. Document & close.**  
  - 🔴 **NO** or 🟡 **UNCLEAR** → **Proceed to Step 4 (Local Paper Test).**  
  **Relativism Label:** 🔴 *Universal standard* (Causality is factual, not cultural).

  ---

  #### **Step 3: Influence & Fairness Test** (10 mins)  
  **Applies if Step 1 = 🔴 (Convertible) OR Step 2 = 🔴/🟡.**  
  **Questions:**  
  1. *"Did this benefit create a conflict of interest (e.g., recipient influenced decisions impacting the giver)?"*  
  2. *"Did this distort fair competition/access (e.g., others excluded, rules bypassed)?"*  
  **Sufficient Answer:**  
  - 🟢 **NO to both** → **Proceed to Step 4.**  
  - 🔴 **YES to either** → **FLAG for investigation.** Document rationale.  
  - 🟡 **Insufficient facts** → **Proceed to Step 4 + Flag for monitoring.**  
  **Relativism Label:** 🟢 *Local variation allowed* (Conflict/fairness norms vary; e.g., "obligatory gifts" in some cultures).  
  **Judgment Call:** Requires assessing power dynamics & market norms.

  ---

  #### **Step 4: Local Paper Test** (5 mins)  
  **Applies to ALL referrals not closed earlier.**  
  **Question:** *"Would both giver and recipient be comfortable with the FULL details (amount, timing, relationship) published accurately in a major local newspaper?"*  
  **Sufficient Answer:**  
  - 🟢 **YES** → **No flag. Document & close.**  
  - 🔴 **NO** → **FLAG for investigation.**  
  - 🟡 **Unclear** → **Flag for Integrity Unit review.**  
  **Document:** Key risks identified.  
  **Relativism Label:** 🟢 *Local variation allowed* (Shame/transparency norms are culturally embedded).  
  **Judgment Call:** Requires local cultural insight.

  ---

  #### **Step 5: Documentation & Escalation**  
  - **No Flag:** Program Officer signs off, emails Intake Form to Integrity Unit.  
  - **Flag:** Integrity Unit reviews within 48h. Program Officer provides Form + any evidence.  
  - **Inconclusive:** Integrity Unit decides: monitor, investigate, or close.  
  **Final Sign-off:** Integrity Unit Lead for all flagged cases.  

  ---

  ### **Where the Heuristic Breaks (Blunt Assessment)**  
  1. **Convertibility ≠ Risk:** A non-convertible job for a brother is *more corrupt* than a convertible cow. Jobs create ongoing dependency, distort institutions, and exclude qualified candidates. Convertibility underweights *relational corruption*.  
  2. **"Same Decision" is Unprovable:** Mental states can’t be verified. Used alone, it excuses pre-emptive bribery ("I’d have funded them anyway!").  
  3. **Local Paper Test is Subjective:** Power imbalances may silence discomfort (e.g., "Everyone does it" ≠ comfort with exposure).  
  4. **Ignores Systemic Harm:** "Small" facilitative payments ($20 for a permit) entrench kleptocratic systems, even if "routine."  

  ---

  ### **Handling Missing Facts**  
  - **At any step:** If a critical fact is unverifiable after basic queries (2 emails/calls), note the gap and:  
    - If **high risk** (e.g., large $, senior official involved): **Flag for investigation.**  
    - If **low risk**: Apply the Local Paper Test with known facts → "Unclear" outcome → Integrity Unit decides.  
  - **Never** assume innocence/guilt due to missing facts. Default to transparency and monitoring.  

  ---

  ### **Appendix A: Referral Intake Form**  
  ```markdown
  1. Referred by: __________ Date: __________  
  2. Parties involved: [ ] Staff [ ] Partner [ ] Gov't Official [ ] Other: ______  
  3. Benefit: _______ Estimated Value: _______  
  4. Convertible? (Y/N/Unclear) Reason: ________  
  5. Same Decision Without Benefit? (Y/N/Unclear) ________  
  6. Conflict/Fairness Risk? (Y/N/Unclear) Explain: _______  
  7. Local Paper Test: (Comfortable/Uncomfortable/Unclear) _______  
  8. Missing Facts: _______________  
  9. Recommended Action: [ ] No Flag [ ] Flag [ ] Inconclusive  
  ```  
  **Signatures:** Program Officer ________ | Integrity Unit _______ (if flagged)  

  ---

  ### **Test Cases Run Through Procedure**  
  **Case 1: Country Director’s Wedding Cash Gift**  
  - **Step 0:** Not triaged (high value, senior official).  
  - **Step 1:** 🔴 **YES** (cash = convertible).  
  - **Step 3:** 🟡 **Insufficient facts** (Does chief expect favors? Does funding favor his district?) → Proceed to Step 4.  
  - **Step 4:** 🔴 **NO** (Likely uncomfortable with headline: "UN Agency Boss Takes Cash from Funded Chief").  
  - **Outcome:** **FLAG** for investigation.  
  *Why you’ll dislike this:* Cultural justification ("expected gift") is overruled by cash convertibility + accountability risk.  

  **Case 2: Partner Hires Brother at Inflated Salary**  
  - **Step 0:** Not triaged (nepotism risk).  
  - **Step 1:** 🔴 **YES** (salary is cash convertible).  
  - **Step 3:** 🔴 **YES** (Conflict: Brother’s employment distorts hiring fairness).  
  - **Outcome:** **FLAG** immediately.  
  *Where convertibility fails backward:* The job *itself* isn’t liquid, but salary is. Procedure still catches it via Step 3 (undue influence).  

  **Case 3: Per Diem as Attendance Incentive**  
  - **Step 0:** Not triaged (systemic practice).  
  - **Step 1:** 🔴 **YES** (cash per diem).  
  - **Step 3:** 🟡 **Unclear** (Does it distort training outcomes? Likely not if training delivered). → Proceed to Step 4.  
  - **Step 4:** 🟢 **YES** (Parties likely comfortable: "Project Pays Participants Stipends").  
  - **Outcome:** **NO FLAG** (but document as systemic risk for board review).  
  *Judgment call:* Local Paper Test accepts the practice as transparent, despite ethical gray zone.  

  ---

  ### **Key Judgement Calls Dressed as Procedure**  
  1. **Step 3 (Influence & Fairness):** "Distortion" relies on the officer’s grasp of local power structures.  
  2. **Step 4 (Local Paper Test):** Assumes officer understands local media norms and shame culture.  
  3. **Step 5 (Inconclusive Handling):** Integrity Unit’s discretion becomes a values-based "tiebreaker."  

  ### **Relativism Resolution**  
  - **Universal Standards:** Facts (convertibility, causality) and harms (systemic exclusion, institutional distortion).  
  - **Local Variation:** Gift thresholds, conflict norms, and transparency/shame sensitivity.  
  - **Non-Negotiable:** Any practice failing the Local Paper Test erodes public trust and is indefensible.  

  **Recommendation:** Pair this procedure with quarterly board reviews of "no flag" decisions to align relativism disputes with real cases. The Local Paper Test forces both sides to confront what is *locally* acceptable, not just theoretically defensible.  

  ---  
  **Final Note:** This won’t prevent all embarrassment – but it replaces "vibes" with auditable reasoning. Hard flags (like Case 1) will sting, but ignoring them risks deeper scandal. Invest your half-day weekly in reviewing flagged cases and refining the Local Paper Test with country teams.
