  For the dictionary closer, considering having the disputed word be "primarily" in the definition - which liquid gets top billing implies everything. Last line should hang on that word like a knife edge.
answer: |-
  ## The Liquid That Broke the Lexicon

  The air in the Trade Commission Arbitration Chamber 7 smelled faintly of ozone and recycled sweat. Thirty years since the first hesitant radio signals bridged the void between Earth and Twin Earth, and we were still arguing about *water*.

  Specifically, the six hundred thousand gallons of it currently sloshing in contaminated containment vats on Docking Bay Gamma-12, rendered unsellable when the *Tranquility Trader*’s environmental seals failed mid-transit. Was it ‘water’ as defined in Clause 17(b) of the Interplanetary Freight Accord (Standard)? If yes, the liability fell on the Twin Earth consortium that shipped it. If no, Earth-based Helios Logistics, who owned the ship and signed the manifest accepting the cargo as ‘potable water’, was bankrupt.

  “It’s simple,” rumbled Borlan Vex, the Twin Earth representative. His thick, greyish skin seemed to absorb the harsh chamber lights. He tapped the projected contract text. “The manifest says ‘water’. The cargo *is* water. Clear and drinkable. Passes every safety test *we* have, just as it always has for us. Your seals failed, Helios pays. Our liquid meets every functional definition.”

  Across the polished obsidian table, Elara Chen, representing Helios, leaned forward. “Function isn’t the point, Borlan. The *word* has a history. When Helios Logistics signed for ‘water’, they meant the liquid we have on Earth. H2O. What you shipped… isn’t that.”

  “XYZ,” supplied Dr. Aris Thorne, the Commission’s lead linguist, peering through thick glasses. “A complex chain molecule superficially identical in behaviour, taste, and appearance to Terran dihydrogen monoxide. But chemically distinct. The Twin Earth baptismal event involved XYZ. Ours involved H2O.”

  “History?” scoffed Kaelen Riss, the young, brilliant (and often insufferable) semantic analyst from the Commission. She’d grown up after contact, fluent in both languages, seemingly untethered to either planet’s past. “That’s sentimental archaeology. Words latch onto the *real thing*, the fundamental substance that does the job. Both liquids hydrate, both freeze, both boil, both form lakes and seas. They are functionally identical twins! The word ‘water’ points to *that shared function*, that *liquid essence*, regardless of its accidental molecular arrangement. Why privilege one historical accident over another? XYZ *is* water, just as much as H2O is. The contract is clear.”

  Kaelen’s argument *was* tempting. Elegant. It cut through the messy history. For a moment, the chamber hummed with the possibility of a clean solution. Function over origin. Reality over record. Borlan looked hopeful. Elara looked strained.

  Then Commissioner Vance, presiding with weary patience, raised a hand. “The contract signing. Who signed the manifest accepting the cargo as ‘water’?”

  The evidence holo shimmered. Security footage from the *Tranquility Trader*’s cargo bay. Earth-standard gravity, Earth atmosphere. A harried Helios clerk, Jansen Poole, Earth-born and raised, wiped sweat from his brow as he inspected a sample glass of the clear liquid drawn from the Twin Earth shipment. He sniffed it, swirled it, took a cautious sip. He nodded, seemingly satisfied. He pressed his thumb to the manifest pad next to the pre-filled description: `CARGO TYPE: Water (Potable), Twin Earth Standard.`

  “Jansen Poole,” Elara stated. “Born New Vancouver. He learned the word ‘water’ from his parents, who learned it from theirs, all the way back to someone dipping a cup into the Pacific.”

  “But he was *tasting XYZ*,” Kaelen countered, undeterred. “His sensory experience was of the functional liquid. His *intent* was to accept the clear, drinkable stuff in the tanks. That’s what matters! The word connected him to the substance present.”

  Vance nodded slowly. “And the Twin Earth translator present? The one who facilitated?”

  The footage shifted slightly. Standing beside Poole was a tall, slender Twin Earth native, Seri Valen. She watched Poole’s inspection, her large, dark eyes unreadable. When Poole signed, she added her own verification code – a requirement for cross-cultural contracts.

  “Seri Valen,” Borlan said. “Born in the Twin Earth settlement of New Aquila. She learned Terran Standard primarily *after* contact. From immersion programs, trade manuals, interacting with Earth crews. Her primary linguistic community shifted.”

  “Show the deposition snippet,” Vance ordered.

  Seri Valen’s image appeared, recorded earlier. She spoke precise, slightly formal Terran Standard. “The word ‘water’… I learned it from Captain Mendoza, on my first trade liaison posting. He pointed to a glass from his ship’s dispenser. ‘Water,’ he said. Later, he pointed to a lake on Twin Earth during a survey. ‘And that’s also water.’ For me, the word meant… the liquid. The clear, life-giving liquid. Both kinds were just ‘water’. That’s how I understood it when I co-signed.”

  Kaelen practically beamed. “See? Intent. Function. Reality.”

  Elara pressed a button. A new document appeared: the original, handwritten baptismal entry from the *Lexicon Terra* archive, dated centuries ago. `Baptismal Event: Explorer Aris Thorne (the First), dipping vessel into Lake Superior. Designated substance: Aqua. Later standardized to 'water'. Composition: H2O.`

  Then, another image: a simple clay tablet from Twin Earth’s pre-contact era, a stylized wave symbol beside scratch marks linguists later decoded as their native word for XYZ. No mention of H2O. No concept of it.

  “Seri learned the word *from us*,” Elara insisted, her voice tight. “From Captain Mendoza. And Mendoza learned it from someone who learned it from someone… back to Thorne dipping his cup into H2O. When Seri used the word ‘water’ while co-signing, that chain of usage points back to *our* liquid, regardless of what was in front of her. Jansen Poole, signing based on a lifetime of H2O meaning, saw XYZ, but the word *he* used was anchored to H2O. He wouldn’t have called XYZ ‘water’ if he’d known it wasn’t H2O – he’d have called it ‘Twin Aqua’ or something. The manifest *should* have said ‘Twin Aqua (XYZ)’.”

  “But it *didn’t*,” Borlan retorted. “It said ‘water’. And Poole accepted XYZ *as* water! He tasted it! Function prevailed!”

  The arguments swirled like the molecules in question. Vance listened, his expression unreadable. Kaelen’s functional reality seemed powerful, clean. But the image of Jansen Poole, trusting the word he knew, tasting a liquid that *wasn't* what his ancestors meant… and Seri Valen, using a borrowed word with a borrowed history she didn’t fully grasp… cast long shadows.

  Finally, Vance called for the evidence locker. A technician brought in a sealed container. Inside, resting on inert gel, were two glass vials. One contained a sample from the disputed cargo – XYZ. The other contained pure Terran H2O, drawn that morning from the Commission’s fountain. They were indistinguishable.

  Beside them lay the original manifest tablet Poole and Valen had signed, the word `WATER` etched clearly.

  Vance didn’t look at the vials. He looked at the manifest. Then he spoke, his voice cutting through the tension.

  “The contract defines key terms by reference to the *First Consolidated Interplanetary Dictionary*. Its entry for ‘water’ is binding for Trade Commission disputes. Bring up the current approved entry.”

  A screen flickered. The entry appeared:

  **water** *noun* /ˈwɔːtər/
  1.  A clear, colourless, odourless, and tasteless liquid **primarily** found covering much of the surface of Earth and Twin Earth, essential for all known forms of life. Characterized by its ability to dissolve many substances, exist in solid, liquid, and gaseous states within terrestrial temperature ranges, and exhibit surface tension.
  2.  Any body or quantity of this liquid (e.g., lake water, drinking water).
  3.  (Poetic/Metaphorical) A vast expanse; lifegiving essence; etc.
  *Etymology: Terra Standard: Derived from Old English wæter; baptismal event linked to H2O substance. Twin Standard Adoption: Post-contact borrowing from Terra Standard; functional equivalence recognized.*
  ***See also:** Twin Aqua (XYZ) – specific Twin Earth variant.*

  Silence descended, thick as fog. Every eye scanned the entry. Borlan’s gaze fixed on "**primarily** found covering much of the surface of Earth and Twin Earth". *Primarily*. Not exclusively. Covering *both*. It encompassed XYZ! Elara’s finger hovered near "baptismal event linked to H2O substance" and the "See also" note separating "water" from "Twin Aqua". Kaelen frowned at the dual etymology, the implicit tension between origin and adoption.

  Vance steepled his fingers. “The definition relies on shared characteristics. The etymology acknowledges dual roots. The ‘See also’ distinguishes a variant. The case hinges on Clause 17(b) and the meaning of ‘water’ at the moment of signing, by the signatories involved.” He paused, his eyes moving from Poole’s thumbprint to Valen’s verification glyph on the manifest image. “Based *solely* on the binding dictionary definition presented…”

  He didn’t finish. He didn’t need to. The ambiguity wasn’t resolved; it was enshrined. The last line of the entry shimmered, holding the ruin of Helios Logistics or the Twin Earth consortium in the weight of a single, carefully chosen word:

  "...this liquid..."
