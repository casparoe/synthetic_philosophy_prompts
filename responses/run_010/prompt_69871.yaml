prompt: |-
  I'm a postdoc in a systematics lab — day job is species delimitation in a group of freshwater snails, so my whole working vocabulary is monophyly vs. paraphyly vs. polyphyly, grades vs. clades, homoplasy and convergence, character choice and weighting, OTU boundaries, ring species, tree topology, and the endless argument about when a group counts as real and wich features are actually diagnostic. I know that toolkit cold. What I don't know is political philosophy, which is a problem, because our building's interdisciplinary reading group has a session coming up on the left/right distinction and I've volunteered to open it. The question on the table is roughly: is the split between left and right a real division in the world, or a habit of speech, and if it's real, what is it that holds each side together — shared content, shared history, or shared enemies?

  Here's what I want. Take the main candidate answers to that question and restate them, one at a time, in the vocabulary I actually use, as faithfully as you can manage. The candidates I have in mind: the origin story about it starting as a seating arrangement in the French revolutionary assemblies (defenders of the old order on the president's right, partisans of the revolution on his left) and the resulting view that the labels are purely positional or indexical, defined only relative to whatever arrangement is currently established; the view associated with Bobbio that the whole axis is really one underlying disagreement about equality — whether inequalities are natural and to be accepted or social and to be attacked; the family-resemblance or bundle view, where each side is a statistical cluster of positions that hang together without any single necessary feature; the relational view where a side is held together less by what its members share than by who they oppose, including the horseshoe suggestion that the extremes end up resembling each other; and the deflationary view that the axis is largely an artifact of how questions get asked and positions get coded in the first place. For each one, give me the translation into my terms — is the group monophyletic, paraphyletic or polyphyletic; is it a clade or a grade; is the resemblance homoplasy; is the space a line, a circle, a tree or something with reticulation; are the boundaries observer-chosen or discovered; are we weighting economic characters over cultural ones or vice versa.

  Then the residue report, which is the part I actually care about. Tell me wich claims survive the translation intact, wich ones you had to bend or fudge to make fit, and wich ones have no expression at all in a systematist's vocabulary. Two suspects I'd like you to test rather than assume: first, in my field the group is there before anyone describes it — snails dont read our cladograms — whereas political actors plainly do sort themselves by the labels, so the classification seems to be inside the object being classified; and second, my vocabulary is descriptive all the way down, while a lot of the political debate looks like it's about whether some arrangement is legitimate, and I'm not sure I have any term for that. For each piece of residue, say whether it exposes a real limitation of the taxonomic framework — something politics has that organisms don't — or whether it's a sign that the philosophical question was less determinate than it sounded, e.g. people arguing past each other about several seperate "is it real" questions while using one word. And please don't quietly import my field's assumptions and call it translation: if the analogy presupposes that only lineage-based groups can be real, or that similarity has to be similarity in intrinsic characters, flag that explicitly instead of baking it into the mappings. No references or reading lists, I just want the analysis.
reasoning: |-
  Hmm, the user is a postdoc in systematics who studies freshwater snails and needs help translating political philosophy concepts into their specialized taxonomy vocabulary. They've volunteered to lead a reading group discussion on whether the left/right political distinction is real or just a habit of speech.

  The core request is to map five specific theories about the left/right distinction onto systematics terms: the French Revolution seating origin (positional view), Bobbio's equality theory, family-resemblance view, relational/enemy-focused view, and the deflationary artifact view. For each, I need to translate using concepts like monophyly vs. paraphyly, clades vs. grades, homoplasy, character weighting, etc.

  I should also analyze what gets lost in translation ("residue report"), especially regarding two key differences: (1) political actors self-classify using these labels (unlike snails), and (2) political debate involves normative legitimacy claims (absent in descriptive taxonomy). The user wants me to explicitly flag where I might be smuggling in biological assumptions rather than doing neutral translation.

  Breaking it down: First, the French Revolution view translates to purely positional classification - like defining taxa by current biogeography rather than lineage. This would make "left" and "right" operational taxonomic units (OTUs) with observer-defined boundaries, analogous to designating species based on island habitats. But the residue is huge here - unlike snails, political actors consciously adopt these positions.

  For Bobbio's equality theory, this treats the axis as a single diagnostic character (equality stance). That makes left/right monophyletic clades if we accept that character as weighted 100%. But this forces convergence (e.g., libertarians and socialists both supporting equality but for different reasons) to count as homoplasy. The residue includes the fact that real political positions bundle economic/cultural characters arbitrarily.

  The family-resemblance view maps cleanly to polythetic grouping - no essential character, just statistical clustering. Like defining a genus through overall similarity despite homoplasies. Minimal residue here since it accepts fuzzy boundaries.

  The relational view (defined by opposition) is like classifying parasites by host rather than lineage - resulting in a horseshoe topology where extremes converge. Residue: this makes classification purely extrinsic (based on enemies), unlike taxonomy which prioritizes intrinsic traits.

  The deflationary view sees the axis as an artifact of coding - like how character choice creates artificial groups. Here the residue is thinnest because it mirrors taxonomic debates about operationalization.

  For the residue report: Self-classification has no analogue in systematics - it's a fundamental difference where the classifier influences the classified. Normative legitimacy claims also have no equivalent; taxonomy describes what is, politics argues what ought to be. This exposes real limitations of the framework. The "is it real" question might conflate four separate issues: historical origin, current coherence, predictive power, and causal independence - much like how "species reality" means different things in different contexts.

  I need to present this without references or jargon overload, staying strictly within their requested framework while highlighting where the analogy breaks meaningfully.
answer: |-
  Here's the translation of political left/right theories into systematics vocabulary, followed by the residue report:

  ### Candidate Theories Translated
  1. **French Revolution Seating (Positional/Indexical View)**  
     *Translation:* Left/right are **observer-defined operational taxonomic units (OTUs)** based solely on relative position in a current political morphospace. No shared ancestry or synapomorphies — it’s like defining "mountain snails" and "valley snails" based only on present elevational zonation. **Monophyly is irrelevant**; groups are **grades** defined by current proximity to an arbitrary reference point (the status quo "president"). Boundaries are **observer-chosen** and shift with each new "assembly" (political context).  

  2. **Bobbio’s Equality Axis (Single Diagnostic Character)**  
     *Translation:* The entire clade "Politics" splits into two **monophyletic clades** based on a single binary synapomorphy: attitude toward equality (accept natural inequality vs. attack social inequality). All other characters (economics, culture) are **homoplastic** or **autapomorphies** — convergence (e.g., fascists and monarchists both rejecting equality) is **homoplasy**, not shared ancestry. Left/right are **diagnosable clades** iff you weight the "equality character" 100%. Disagreements arise from **character weighting**: critics argue economic/cultural traits are non-homologous and should be weighted separately.  

  3. **Family-Resemblance (Bundle Theory)**  
     *Translation:* Left/right are **polythetic groups** lacking a universal synapomorphy. Each "side" is a **statistical cluster** in morphospace (e.g., support for welfare *or* secularism *or* environmentalism correlating on "left"). **No necessary or sufficient characters** — like defining a genus by overall similarity despite homoplasies. Groups may be **paraphyletic** or **polyphyletic** (e.g., libertarians clustered with left on drugs, with right on taxes). Boundaries are **fuzzy** and based on **character correlation**, not deep homology.  

  4. **Relational/Enemy-Focused (Horseshoe Topology)**  
     *Translation:* Group cohesion is defined **extrinsically** by shared antagonism (synapomorphy = "opposes center"). This creates a **non-tree-like topology** — specifically a **horseshoe continuum** where extreme-left and extreme-right converge due to **homoplastic rejection of moderate "ancestral" traits**. Left/right are **grades** defined by distance from the center, not shared ancestry. Like classifying parasites by host antagonism rather than lineage: groups are **polyphyletic** (different origins) but resemble each other via **convergent adaptation to opposition**.  

  5. **Deflationary/Artifact View**  
     *Translation:* The left/right axis is an **artifact of character coding and matrix construction**. Analysts **overweight economic characters** (ignoring cultural homoplasy) or force a 1D morphospace onto multidimensional data. "Sides" are **paraphyletic grades** or **polyphyletic assemblages** created by lumping non-homologous positions (e.g., coding "anti-establishment" as a single character). Boundaries are **observer-imposed** like defining OTUs by arbitrary gap thresholds in continuous variation. The "axis" itself is a **suboptimal tree model** with low consistency index.  

  ---

  ### Residue Report  
  **Survived Intact:**  
  - **Family-resemblance** → polythetic grouping is native to systematics.  
  - **Deflationary view** → critiques of character coding/weighting map directly.  
  - **Relational homoplasy** → convergence due to similar selective pressures (opposition) is a known phenomenon.  

  **Bent/Fudged:**  
  1. **Self-Classification (Labels Inside the System):**  
     - *Translation Attempt:* Treated as taxa evolving via **lineage-specific marker adoption** (like snails expressing convergent shell traits due to selective pressure).  
     - *Residue:* Unlike snails, political actors *use* the classification to *create* alliances. This is **lineage sorting via self-assignment** — a feedback loop absent in biology. Taxonomy has no equivalent to "identity as a synapomorphy."  

  2. **Normative Legitimacy Claims:**  
     - *Translation Attempt:* Framed as **adaptive vs. maladaptive traits** (e.g., "illegitimacy" = low fitness in current environment).  
     - *Residue:* "Ought" statements (e.g., "inequality is unjust") have no analogue. Systematics assesses *what is*, not *what should be*. Legitimacy debates are **extrinsic to character matrices**.  

  **No Expression in Systematics:**  
  1. **Self-Referential Classification:** When a taxon uses *your* cladogram to decide its phenotype. Biology lacks this causal loop.  
  2. **Teleology/Normativity:** Claims that a group *should* exist or arrangements *ought* to change. Taxonomy is strictly mechanistic.  
  3. **Dynamic Boundaries:** Political positions shift via debate, not descent. Like OTUs redefining their own diagnostic characters between generations.  

  **Limitations Exposed:**  
  - **Agency & Reflexivity:** Politics has **intentional self-grouping** — a process outside phylogeny. Taxonomy assumes passive organisms.  
  - **Normativity:** Legitimacy is **evaluative**, not descriptive. Systematics has no "fitness function" for social arrangements.  
  - **Causal Density:** Political alignment stems from ideology, material interest, *and* opposition — a **multilayered selective regime** harder to disentangle than natural selection.  

  **Indeterminacy in "Real"?**  
  The question conflates four distinct "realities":  
  1. **Historical Reality:** The French origin is a **single speciation event** (monophyletic origin of terms).  
  2. **Current Cohesion:** Whether groups share synapomorphies (**monophyly**) or just homoplasies (**grade**).  
  3. **Predictive Utility:** Whether the axis explains trait correlations better than null models (**tree robustness**).  
  4. **Causal Independence:** If the axis exists independently of observer coding (**character objectivity**).  

  **Your Toolkit’s Silent Assumptions (Flagged):**  
  - Lineage essentialism is *not* presupposed here. Grades are "real" if consistently diagnosable.  
  - Similarity includes relational traits (e.g., "opposes X") — not just intrinsic morphology.  
  - The translation assumes political "traits" can be discretely coded, which is itself contested.  

  **Verdict:** The taxonomy framework *can* diagnose cohesion mechanisms (clade vs. grade) but is **agnostic on normativity and blind to reflexivity**. The indeterminacy lies in politics, not your tools: "Left/right" is a **grade defined by current opposition and statistical clustering**, but its legitimacy claims and self-reinforcement are outside systematics' domain.
