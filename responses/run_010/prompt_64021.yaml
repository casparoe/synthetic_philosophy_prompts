prompt: |-
  So — I cover science and ideas for a couple of general-interest magazines, two or three pieces a year where the whole evidentiary base ends up sitting on one side of a fight that the other side lost. Every time I've found this out at fact-check, not while reporting, which is way too late. I want a reusable triage procedure I can run on a story in a single afternoon, before I commission anything or start drafting, that tells me how lopsided my sources are and what that lopsidedness actually licenses me to say.

  Ground it in whatever the historiography genuinely says about how silences get into the record. I know Michel-Rolph Trouillot's Silencing the Past has that argument about silences entering at four separate moments — the making of sources, the making of archives, the making of narratives, and whatever gets treated as significant later on — and I want the procedure to keep those four apart instead of mushing them into one hand-wavy "the victors wrote it" gesture. But write it for someone who hasn't read the book and won't.

  Three things I specifically need, because I keep seeing them collapsed into each other:
  - separate "the losing side never wrote anything down" from "they wrote it down and it didn't survive" from "it survived, but only inside the winners' files." Those have completely different evidential weight and license completely different conclusions, and my drafts routinely slide from the first to the third.
  - a step that counts mediation layers between an event and my screen — transcription, translation, a court clerk, a missionary, a press office, a digitization grant — and says what each layer costs me.
  - something that stops me treating absence of counter-evidence as evidence of suppression. Give me a way to think about base rates: what fraction of records normally survives anyway, for anyone.

  Shape: numbered steps in the order you'd actually run them, what counts as a sufficient answer at each, where the procedure terminates in "you cannot run this story as pitched," where it terminates in "you can run it, but only with disclosure X," and where it hands the call up to me or my editor because it's a values question rather than a facts question — editor signs off on anything that survives with a disclosure attached. Flag explicitly which steps are judgment calls wearing a lab coat. I'd rather know.

  Also include: a three-sentence disclosure template for the top of the piece; the five questions I should put to a historian on the record rather than paraphrase loosely; and hard kill criteria.

  Then run the whole thing on these three:

  1. A nineteenth-century public-health quarrel at a port city, quarantine versus sanitation, where the quarantine side's mortality numbers survive only inside the report of the commision that rejected them.
  2. A new paper "confirming" an indigenous account of a volcanic eruption, where the account reaches us via an 1890s missionary transcription plus interviews done by grad students at the same university that ran the confirming study.
  3. My pet story, and be honest with me: a claim that a discipline's founder buried a rival's priority claim, where the rival's letters are the main evidence — and those letters survive at all only because the founder's own institution collected and kept them.

  No bibliography and no reading list, I'm not chasing anything down and neither are you. And please don't reach for the wartime planes-and-armour-plating story — I've written that analogy twice myself and I'm sick of it.
reasoning: |-
  Okay, the user is a science journalist who writes a few pieces a year for general-interest magazines. They've run into a recurring problem: they only discover at the fact-checking stage that the evidence for a story is entirely one-sided, coming from the winning side of a historical dispute. That's way too late in the process. They want a reusable triage method they can apply in a single afternoon before commissioning or drafting a piece. This method should help them identify how lopsided their sources are and what conclusions that imbalance actually supports.

  The user specifically references Michel-Rolph Trouillot's framework about silences entering the historical record at four distinct moments: making of sources, making of archives, making of narratives, and retrospective significance. They want these four categories kept separate rather than lumped together. Three key distinctions they need: whether the losing side never documented their views, or if documents existed but didn't survive, or if they survived only within the winners' collections. They also want a way to count mediation layers (translations, transcriptions etc.) and assess their impact, plus a method to avoid mistaking absence of counter-evidence as evidence of suppression—requiring consideration of typical document survival rates.

  For the structure, they want a numbered step-by-step procedure that indicates: what constitutes a sufficient answer at each step, when to kill the story entirely, when to proceed with disclosures, and when to flag a decision as editorial judgment rather than fact. They also request specific deliverables: a disclosure template, five questions to ask historians, and hard kill criteria. Finally, they want the method applied to three test cases.

  The user is clearly frustrated with oversimplified historical narratives ("the victors wrote history") and wants rigorous, actionable tools. Their examples show they deal with conflicts where evidence imbalance could invalidate their narrative—public health debates, indigenous knowledge validation, and academic priority disputes. The underlying need is for a systematic way to surface and account for historical silences before committing to a story.

  I'll develop a procedure called the Source Silencing Audit with four phases aligned to Trouillot's moments. Each step will include: what to do, how to know when you've done enough, and decision pathways. The deliverables will be integrated where relevant. For the test cases, I'll apply the procedure strictly to demonstrate its use.

  Key challenges to address: Making the mediation layer assessment concrete (perhaps using a "degrees of separation" count with standard penalties). Creating a practical base-rate benchmark for document survival (suggesting 80-90% loss as normal). Designing a disclosure template that's concise but covers critical silences. The historian questions must elicit specific warnings about source limitations.

  For the test cases: 
  - The quarantine debate likely has high mediation (commission reports) and archival silencing (opposition numbers only in hostile sources). 
  - The volcanic eruption confirmation involves heavy translation/transcription layers and possible narrative silencing. 
  - The founder-priority dispute centers on archival silencing (survival only in rival's collection) with high risk of overinterpretation.

  The procedure needs to flag when silences prevent responsible conclusions—like when opposition voices exist only in curated hostile sources, or when mediation layers make original intent unrecoverable. Kill criteria should include absence of any losing-side traces or uncorrectable mediation damage.

  Throughout, I'll maintain the distinction between Trouillot's four silences while keeping explanations accessible for someone who hasn't read his work. The goal is pragmatism—tools a journalist can use in one afternoon with minimal outside research.
answer: |-
  Here’s a reusable triage procedure grounded in Trouillot’s framework, designed for a single-afternoon pre-commissioning audit. It separates silences at four moments (source creation, archiving, narrative crafting, retroactive significance) and addresses your core requirements.

  **The Source Silencing Audit (SSA): A 7-Step Triage**

  **Phase 1: Source Creation Silences (What was never recorded?)**
  1.  **Map the Battle Lines:** List all named factions/groups involved in the historical dispute. *Sufficient:* Identifiable proponents of at least two distinct positions. *Termination (Kill):* Only one side is nameable/identifiable.
  2.  **Source Survival Triage:** For each faction, identify: (a) Did they create *any* primary sources (reports, letters, diaries, oral traditions)? (b) If yes, are any accessible? *Sufficient:* Evidence of source creation for at least the main opposing faction(s), even if access is limited. *Termination (Disclosure):* No evidence any opposing source *was ever created* (True Source Silence). *Judgment Call:* Assessing likelihood of creation (e.g., literate groups vs. pre-literate).

  **Phase 2: Archival Silences (What wasn't preserved or is inaccessible?)**
  3.  **Archive Provenance & Survival:** For accessible sources from losing/opposing factions: (a) Where do they physically reside? (Winner's archive? Independent repository? Private collection?) (b) How were they preserved? (Deliberate curation? Accident? Selective collection?) *Sufficient:* Identification of holding entity and broad preservation context. *Termination (Disclosure):* Opposing sources *only* survive within the winner's archival collection. *Judgment Call:* Assessing likelihood of deliberate suppression vs. happenstance loss (base rates matter here - see Step 5).
  4.  **Mediation Layers Audit:** For *each key piece* of evidence (especially opposition sources), list every step between the original event/knowledge and your access:
      *   *Examples:* Oral -> Memory -> Recounting -> Transcription -> Translation -> Editorial Selection -> Archival Categorization -> Digitization -> Your screen.
      *   *Cost Assessment:* Assign a "distortion risk" per layer (Low/Med/High). Translation & Transcription = **High** (semantic shifts). Archival Selection/Curation = **High** (context loss). Digitization = **Low-Med** (accessibility boost, potential metadata loss). Press Office/PR = **High** (agenda-driven framing). *Sufficient:* List layers and flag High-Risk steps. *Termination (Kill):* Evidence passes through >2 High-Risk layers *and* no corroborating low-mediation evidence exists. *Termination (Disclosure):* Any High-Risk mediation layer present. *Judgment Call:* Assessing the severity of distortion risk per layer.

  **Phase 3: Narrative & Retroactive Silences (How was the story told & why does it matter now?)**
  5.  **Dominant Narrative Check:** What is the established/accepted historical narrative? How does it frame the "losers"? Where do *your* key sources fit into promoting or challenging this narrative? *Sufficient:* Identification of the dominant narrative and your sources' relationship to it.
  6.  **Counter-Evidence & Base Rates:** (a) Is there *any* trace of opposing views (even in winner's sources, e.g., rebuttals, dismissals)? (b) Apply Base Rate Reality: **Assume 80-90% of *all* historical records are lost to time, disinterest, or decay (the "normal noise floor").** *Sufficient:* Acknowledgment of base rates; presence of *any* counter-trace weakens "suppression" claims. *Termination (Disclosure):* Absence of counter-evidence *must* be framed as "absence of evidence," not "evidence of suppression," *especially* if within the normal noise floor. *Judgment Call:* Is the *specific* absence unusual given context (e.g., systematic burning of records vs. normal decay)? *Termination (Kill):* Claiming suppression *solely* based on absence within the normal noise floor.

  **Phase 4: Synthesis & Go/No-Go**
  7.  **Silencing Impact Assessment:** Synthesize findings from Steps 1-6:
      *   What *type* of silence dominates for the losing side? (True Non-Creation? Archival Loss/Curation? Narrative Erasure?)
      *   What does this silence *actually* license? (E.g., True Non-Creation might support "their voice is unrecoverable"; Archival Curation might support "the winners controlled the narrative"; normal Absence supports "we just don't know").
      *   How severe is the mediation burden? Can the core claim survive it?
      *   *Termination (Kill):* True Source Silence (Step 2) + No credible proxies OR Uncorrectable High-Risk Mediation (Step 4) OR Reliance on Absence=Suppression fallacy (Step 6).
      *   *Termination (Disclosure):* Any Archival Silencing (Step 3), High-Risk Mediation (Step 4), or reliance on absence needing base rate context (Step 6). Proceed with mandatory disclosure.
      *   *Termination (Editor/Values):* The story hinges on interpreting silence *as* agency (e.g., "deliberately suppressed") without direct proof, requiring an editorial stance on historical interpretation. *Judgment Call:* Balancing the weight of evidence for suppression claims.

  **Deliverables:**

  1.  **Disclosure Template (3 Sentences):** "This story relies primarily on sources from [Winning Side/Institution]. Perspectives from [Losing Side/Group] are scarce/absent due to [Specific Silence: e.g., 'lack of surviving records' / 'preservation primarily within rival archives' / 'limited documentation at the time']. Key evidence has passed through layers like [e.g., transcription, translation, institutional curation], potentially shaping its interpretation."
  2.  **5 Questions for a Historian (On Record):**
      1.  "Based on your expertise, what fraction of *relevant* source material from this period/conflict typically survives (the 'base rate')?"
      2.  "Where would we *expect* to find sources from [Losing Side] if they existed? Have those archives been thoroughly searched?"
      3.  "What specific distortions are most likely introduced by the mediation layers [e.g., missionary transcription, commission report framing] present here?"
      4.  "Does the *absence* of counter-evidence on point X seem unusual given the base rate, or could it be routine loss?"
      5.  "What's the strongest *alternative interpretation* of the surviving evidence that challenges the dominant narrative?"
  3.  **Hard Kill Criteria:**
      *   **Kill A:** Only one side of the dispute is identifiable; no opposing voice exists even as a trace.
      *   **Kill B:** Core evidence requires assuming absence of counter-evidence *is* evidence of suppression, and base rates show this absence is normal.
      *   **Kill C:** High-risk mediation layers (>2, e.g., oral -> missionary transcription -> editorial selection) render the original meaning/claim unrecoverable *and* uncorroborated.

  **SSA Applied to Your Cases:**

  **1. Port City Quarantine vs. Sanitation:**
      *   1: Factions: Quarantine Advocates (Losers?), Sanitation Advocates (Winners?), Port Authorities, Merchants? *Sufficient.*
      *   2: Quarantine side *did* create numbers (they're in the report!). No True Source Silence. *Proceed.*
      *   3: **Archival Silencing:** Numbers *only* survive embedded in the hostile commission report. **Disclosure Required.** Provenance = winner's archive.
      *   4: **Mediation:** Original Data -> Quarantine Report -> Commission Review/Selection -> Commission Report Framing -> Your Screen. Layers: Commission Review = **High** (agenda). Commission Framing = **High**. **Disclosure Required.**
      *   5: Dominant narrative: Sanitation won as scientifically superior. Commission report drives this.
      *   6: Counter-trace: Numbers quoted (to dismiss) *is* the counter-trace. Base rates: Loss of internal reports common. Absence of *other* quarantine docs = normal noise? Not clear suppression.
      *   7: **Licenses:** Can discuss the *existence* of the quarantine argument & their numbers, **but** must stress: numbers filtered/selected/presented by opponents; cannot assess original methodology/context; narrative shaped by winners' report. **Cannot** conclude their numbers were objectively wrong *based solely on this source*. **Verdict:** **Can run, with Strong Disclosure (Archival Silencing + High Mediation).**

  **2. Indigenous Volcanic Account "Confirmed":**
      *   1: Factions: Indigenous Knowledge Holders (Losers?), Scientists (Winners?), Missionaries, Grad Students. *Sufficient.*
      *   2: Source created orally. *Proceed.*
      *   3: Archival Silencing? Oral tradition -> Missionary Archive -> University Archive. Provenance: Colonial/Institutional. **Disclosure Required** (potential curation bias).
      *   4: **Mediation:** **Critical.** Oral Tradition -> Memory (generations) -> Recounting to Missionary -> **Transcription (High)** -> Translation (High) -> Missionary Interpretation (High) -> Archival Storage -> Grad Student Interviews (Med - framing/questioning) -> Scientific Analysis. **>2 High-Risk Layers. Disclosure Mandatory.**
      *   5: Dominant narrative? Often Western science "validates" indigenous knowledge. Risk of retroactive significance fitting this frame.
      *   6: Counter-trace: Oral tradition itself *is* the trace. Base rates: Loss/fragmentation of oral traditions under colonialism is high, but normal survival rate for *specific* events? Unknown. "Suppression" not the main issue here; **Mediation is the killer.**
      *   7: **Licenses:** Can report the *claim* of confirmation and the scientific findings. **Cannot** treat the missionary transcript as a direct, unproblematic record of the original event/knowledge; must emphasize the epistemic chasm bridged by multiple high-risk steps. The "confirmation" is of the *transcribed/mediated account*, not necessarily the pristine original event knowledge. **Verdict:** **Can run, but with Very Strong Disclosure (Heavy Mediation + Archival Provenance).** Frame carefully around confirming the *persistence of a tradition*, not the literal historical accuracy of the pre-mediation account.

  **3. Founder Buried Rival's Priority:**
      *   1: Factions: Founder (Winner?), Rival (Loser?), Institution. *Sufficient.*
      *   2: Rival *did* create letters! *Proceed.*
      *   3: **Archival Silencing:** Letters *only* survive because Founder's institution collected/kept them. **Disclosure Required.** Provenance = winner's archive.
      *   4: Mediation: Rival Writes Letter -> Founder/Institution Receives -> **Selection for Preservation (High - why keep these?)** -> Archival Categorization -> Your Screen. Key Layer: Institutional Selection = **High**. **Disclosure Required.**
      *   5: Dominant narrative: Founder as genius originator. Rival letters challenge this.
      *   6: Counter-trace: The letters *are* the counter-evidence. Base rates: Survival of private letters is low; rival's *own* papers likely lost (normal noise). Absence of *other* evidence = normal. **Crucially:** The letters' *existence within the archive* **does not** prove the founder *buried* them. That's an *interpretation* of intent based on outcome.
      *   7: **Licenses:** Can report the rival's priority *claim* as made in the letters. Can note the letters survived only in the founder's archive. **Cannot** conclusively state the founder "buried" the claim based *only* on the letters' survival location and priority dispute. This requires *evidence of deliberate action* (e.g., founder suppressing the letters *contemporaneously*, destroying rival's other work). **Verdict:** **Can run, but with Disclosure (Archival Silencing + Selection Mediation) AND Editor/Values Call.** You must decide: Is stating "buried" just vivid shorthand for the *outcome* (rival forgotten, founder credited), or are you claiming *deliberate, provable malfeasance*? The evidence supports the outcome; proving the deliberate act of "burying" is much harder and leans heavily on interpretation. **Recommend:** Use "the rival's claim survived only in the founder's archive, and was overlooked" unless finding direct evidence of suppression. Frame as institutional silencing/selection over individual villainy unless proof exists.
