  Let me unpack the mandatory scenes: First, the council debate where three characters all argue for similar discount rates but for incompatible reasons - wealth expectation, pure time preference, and uncertainty. That's where the confusion between justifications can naturally emerge. Second, Kael must articulate why intrapersonal discounting (his own thinning future identity) doesn't extend to strangers, while Lysan can counter with intergenerational ethics. 

