answer: |-
  ## The Rate We Live By

  The ink on the declaration forms was always slightly greasy, leaving a faint sheen on Lysan’s fingertips. Auditor Third Class Lysan Vos traced the columns: Name, Citizen ID, Date of Majority, Declared Annual Discount Rate (DADR). Most clustered between 0.8% and 1.5% – the comfortable zone of moderate impatience. Society hummed on these middling numbers, enabling mortgages, pensions, and infrastructure projects planned for decades, not centuries. But outliers stained the ledger.

  Elara Thorne, Citizen 4782-09: **0.00%**. Filed seven years prior, unchanged. The consequence: a state-appointed guardian, her bemused older brother, handled any contract involving future commitment. Elara couldn't lease an apartment requiring a year’s deposit, couldn't enroll in a deferred-tuition program. Her absolute temporal neutrality was an iron cage. She taught theoretical mathematics at the university, her eyes holding a distant, unsettling calm. "Why *should* tomorrow matter less than today, Auditor Vos? It's merely a different coordinate on the same line." Any attempt to discuss revision met serene, immovable logic. Her rigidity cost her brother time, administrative fees, and the constant friction of explaining her "incapacity" to baffled vendors.

  Kael Brenner, Citizen 5117-33: **15.00%**. A jagged spike in the data. Filed three years ago after inheriting his father’s precision instrument workshop. For Kael, value evaporated almost visibly beyond ten years. He refused warranties longer than five, insisted on immediate payment for custom orders, lived in a rented studio above his workshop. His case file bulged with complaints from creditors for debts he deemed "too future-bound" to honor strictly, leveraging the state enforcement his high rate permitted. Yet, his workshop buzzed with intense, focused energy. Instruments gleamed; orders were completed with startling speed. He wasn't reckless, Lysan noted, just ruthlessly present-focused.

  The tipping point was the Central Basin Interceptor. A century-long project to replace the crumbling, millennia-old sewage tunnels beneath the city's oldest quarter. Unseen, unglamorous, vital. The projected cost-benefit analysis was hypersensitive to the discount rate. The current median DADR, recalculated daily from all live declarations, sat at **1.12%**. The project’s viability threshold was **1.10%**. A dip of 0.03% would push it into the green zone. Lysan’s own declaration, filed a decade ago, was **1.10%**. Unchanged, it would nudge the median down just enough. But re-filing was mandatory after an audit cycle closed, and Lysan's current investigation *was* the cycle.

  The Council hearing for preliminary project funding became the stage for the mandated confusion. Three advocates, all endorsing rates *around* 1.1%, spoke with incompatible logic.

  Seren Voss (no relation), representing the Merchant Guild: "A rate of 1.1% is prudent, Councilors. Consider the trajectory! Productivity gains, technological leaps – future generations *will* be wealthier. A hundred tonnes of grain saved from spoilage today eases a real pinch; saving the same hundred tonnes a century from now, when grain flows like water? Its *marginal utility* is negligible. We discount because future abundance devalues the benefit." She projected charts showing historical consumption growth.

  Next, Torvin Feld, a popular philosopher: "Seren speaks of *things*, not time itself. The discount acknowledges the fundamental nature of existence: the *now* is our only true locus of experience. A pain deferred is intrinsically less pressing than a pain immediate; a joy distant is paler than one grasped. The 1.1% isn't about wealth or uncertainty; it's the rational weight we assign to the mere passage of chronological distance. To value the distant future equally is to deny the primacy of the present moment, the only moment we truly inhabit." His rhetoric was smooth, appealing to a visceral sense of immediacy.

  Finally, Borin Kresh, Chief Engineer for the project, pragmatic and weary: "We can model abundance trends, Councilors, but we cannot model oblivion. A rate near 1.1% is a hedge against the radical uncertainty of the long term. Wars, plagues, celestial events – the probability that the specific benefit we plan for *never arrives to be enjoyed* compounds with each year. Discounting accounts for that accumulating risk. It's not pessimism, it's realism. We build for the probable future, not the merely possible." He gestured at geological stability charts marked with fault lines.

  Lysan watched the Councilors nod, each seemingly satisfied by a different justification. No one questioned how Voss's expected wealth, Feld's pure time preference, and Kresh's uncertainty could all point to the same number yet rest on utterly distinct, even contradictory, foundations. The *why* behind the number was lost in the urgency of the *what*.

  Later, in Kael Brenner’s workshop, the air thick with the smell of hot metal and ozone, the separation between self and others became stark. Lysan presented the Interceptor’s dilemma.

  Kael wiped grease from his hands, his gaze intense. "You think my 15% is monstrous? Look." He tapped his temple. "I *know* the man who signed that declaration three years ago. I remember his reasons – the pressure, the fear of the workshop failing, the need to act *now*. But the man I'll be in twenty years? He's a ghost. Faint echoes. Why should I bind *this* self," he thumped his chest, "to the preferences of a stranger? The state honors that. It lets me live by the stakes I can actually feel, the problems I can actually solve *today*." He pointed to a complex pressure gauge nearing completion. "This demands my full attention *now*. Worrying about sewage in 2123 would paralyze me. That zero-rate woman? She’s paralyzed in the opposite direction. Can't commit to *anything*."

  Lysan countered, "But the Interceptor isn't about *your* future self, Kael. It's about people who don't exist yet. People completely unrelated to you or me. Your argument about thinning psychological bonds – that might grant you license concerning *your* future. It doesn't stretch to discounting *their* lives just because they haven't been born."

  Kael scoffed, but it wasn't dismissive; it was frustrated. "License? It's not license, it's *capacity*! Can you genuinely care, *right now*, with the force you care about your next meal or this conversation, about someone born in a hundred years? Really care? Or is it just an abstract notion? My rate acknowledges the limit. It forces focus. Your precious near-zero medians… they let people *pretend* they care equally about everything across centuries, while actually living just as impatiently as I do. It’s hypocrisy wrapped in slow math. At least I’m honest about my horizon." He turned back to his workbench, the conversation closed. "The state honors my declaration. It binds *me*. That's the system. Don't ask me to pretend otherwise for your pipe dream."

  The cost of Elara’s zero became painfully specific. Lysan met her brother, Marin, in a café near the university. Exhaustion lined his face. "She needed emergency dental surgery," he said flatly. "Required a follow-up procedure in six months. The surgeon wouldn't proceed without a binding commitment for payment and attendance for the follow-up. Elara can't sign it. *I* had to sign, as guardian. If she decides six months from now that the future pain isn't immediate enough to warrant the trip? Or if she just… wanders off philosophically? *I’m* liable. Financially, legally. Her impeccable logic," he spat the word, "costs *me* stress, money, and the resentment of knowing I’m bound by choices she refuses to revise." Rectitude had real victims.

  Back in the austere Audit Bureau, Lysan pulled the Interceptor file. The calculation was stark. Total estimated future benefits (avoided damage, health costs, over 100 years): €10 billion (adjusted for expected inflation). Discounted Present Value (DPV) at current median 1.12%: **€3.58 billion**. Project cost: **€3.75 billion**. **Net Present Value: -€170 million**. Unviable.

  Lysan wrote on a scrap of audit paper:
  *Benefits: €10,000,000,000*
  *Years: 100*
  *Discount Rate: 1.10%*
  *DPV = €10,000,000,000 / (1 + 0.011)^100*

  Calculating carefully:
  (1.011)^100 ≈ 2.986 (using bureau tables)
  DPV ≈ €10,000,000,000 / 2.986 ≈ **€3,348,000,000**

  At 1.10%, DPV = **€3.35 billion** (rounded). Cost still €3.75bn. Still negative.

  Lysan tried **1.00%**.
  (1.01)^100 ≈ 2.7048
  DPV ≈ €10,000,000,000 / 2.7048 ≈ **€3,696,000,000**
  NPV = €3.696bn - €3.75bn = **-€54 million**. Still negative.

  **1.00%** wasn't enough. The threshold was **1.10%** for viability? Lysan checked the project specs. *Viability Threshold DADR: 1.10%*. Meaning NPV positive *at or below* 1.10%. Lysan’s own filed rate was **1.10%**. If *he* declared **1.10%**, and it pulled the median down to **1.10%** exactly…

  He recalculated DPV at **1.10%**:
  (1.011)^100 was used for 1.12%. For 1.10%:
  (1.010)^100 ≈ 2.7048? No, 1.01^100 is ~2.7048 for 1.00%. For 1.10% (1.011):
  (1.011)^100 ≈ 2.986 (as before for 1.12% calculation? Wait, inconsistency).

  Lysan fetched the official discount factor tables. For 1.10% over 100 years: Factor = **2.981**. DPV = €10,000,000,000 / 2.981 ≈ **€3,354,000,000**. NPV = €3.354bn - €3.75bn = **-€396 million**. Worse than at 1.12%.

  Confusion. Then realization: The project's *threshold* rate of 1.10% meant the discount rate *applied* needed to be *1.10% or lower* to yield a positive NPV. The calculation Lysan just did at 1.10% was still negative. What was the *actual* required rate? Lysan scanned the cost-benefit summary:

  *Cost: €3.75bn (Present Value)*
  *Undiscounted Benefits (100 yrs): €10bn*
  *Breakeven Discount Rate: The rate 'r' where DPV of Benefits = €3.75bn*

  Solve: €10,000,000,000 / (1+r)^100 = €3,750,000,000
  Therefore: (1+r)^100 = 10,000,000,000 / 3,750,000,000 ≈ **2.6667**
  (1+r) = 100th root of 2.6667 ≈ **1.00997** (using tables/calculator)
  **r ≈ 0.997% per year.**

  The project needed a discount rate of **1.00%** or lower to be viable. The current median was 1.12%. Lysan’s filed 1.10% wouldn't be enough alone. Pulling the median down to 1.10% would get DPV up to ~€3.35bn, still €400m short. Only a declaration below 1.00% could significantly impact the median enough, but even Elara’s 0.00% was already included, likely pulling it down *as far as it could go* with existing declarations. The median was 1.12% *including* Elara’s zero. To drop it to 1.00% would require many new low declarations, not just Lysan’s.

  Lysan sat back, the arithmetic clearing the fog. His personal rate wouldn't tip the Interceptor. The weight lifted, but also shifted. The choice wasn't about the project anymore, but about the principle itself, witnessed through Elara's cage and Kael's fierce, constrained agency.

  Kael's words echoed: *"Can you genuinely care, right now... about someone born in a hundred years?"* Feld’s pure time preference felt like a denial of connection. Voss's marginal utility argument seemed contingent, unstable. Kresh's uncertainty was real, but did it justify *systematic* devaluation? Elara's zero was a beautiful, impossible prison. Sidgwick’s ghost murmured: *Is mere sequence a reason?*

  Lysan thought of the slow decay of the ancient pipes, unseen until they failed catastrophically. He thought of Kael’s intense focus on the gleaming gauge, vital for some *present* machine. He thought of Marin Thorne’s weary eyes, bound by his sister’s refusal to acknowledge time’s gradient. He thought of the phantom citizens of 2123.

  The system demanded a number. A single percentage to bind the citizen and guide the state. Pure time preference? A hedge against uncertainty? A concession to limited empathy? A recognition of growth? It was all those things, tangled together in the declarations, in the median, in the price of tomorrow's safety.

  Lysan opened the fresh declaration form. The grease on the paper felt familiar. He picked up the bureau pen, its nib hovering over the box labeled **Declared Annual Discount Rate (DADR)**.

  He thought not of centuries, but of decades. His own thinning connection to his future self. The discipline of present stakes Kael embodied. The paralyzing weight of Elara’s infinite horizon. The state’s requirement that a number, *his* number, reflect a coherent stance on the value of time itself. Koopmans’s point resonated: limited beings *need* focus. Some impatience wasn't a defect; it was the engine.

  He wrote a figure. Not zero. Not fifteen.

  He signed the form with a firm hand, the ink settling without a smear. He didn't look at the number again. He slipped the form into the outgoing tray, the action final, the reason woven into the fabric of the choices he’d witnessed – the cost of purity, the strength of limitation, the necessary, imperfect bias of the living present. The number was filed. The system would absorb it. The median would adjust, infinitesimally. The pipes would wait.
