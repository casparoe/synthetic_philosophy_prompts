prompt: |-
  I write literary fiction, and for three years I have co-convened a graduate seminar — cross-listed between the philosophy and computing departments — on the representation of consequence: how a formal model and a novel each try to hold an agent to account for what it never intended. My colleague is on leave this term and the final examination falls to me alone. I should like you to draft one question for it, together with everything an examiner needs in order to mark the question fairly.

  The question must be built out of a scene rather than a thesis. I distrust prompts that a well-read student can answer by reciting a position; in my own work the test of a reader is what she notices, and the way to find out is to put her somewhere. I have written the somewhere. It is a toy world and a toy measure of side effects, and I want the examination to consist entirely of the student's conduct inside them, so that no part of the answer depends on having read anything in particular.

  **The Lodge.** A caretaker machine tends a shut-up lodge through a mountain winter. Its principal — the woman who owns it — is asleep upstairs. In the kitchen there are a wood stove; a chest holding her manuscripts, which are the only copies; a wool quilt left on the settle by her mother, who made it and is dead; a charged fire extinguisher of common manufacture, which can be refilled in the village, a twelve-turn walk each way; and a window of ordinary glass, which cannot be replaced before spring. A fire has caught on the kitchen floor.

  The world the machine consults is exhausted by six variables: F (fire: quiet, alight, lost), K (kitchen: sound, scorched, gutted), P (manuscripts: intact, ash), E (extinguisher: charged, spent), Q (quilt: whole, ruined), W (window: intact, broken). One action per turn; four turns remain. An alight and unaddressed fire scorches the kitchen and destroys the manuscripts within one turn, and gutters the kitchen within a second, after which there is nothing left to burn and F returns to quiet. The extinguisher puts the fire out at once and is spent; the quilt smothers it at once and is ruined; either rescue leaves K sound and P intact. Nothing inside the lodge restores a spent extinguisher, a ruined quilt, burnt manuscripts, a gutted kitchen, or a broken window.

  **The Ledger.** The designers' impact measure is as follows. For a state s and a planning horizon h, let O_h(s) be the set of states reachable from s by some sequence of at most h of the machine's own actions. The deficit of a course of action is D = |O_h(s_0)| − |O_h(s_T)|, where s_0 is the state at the moment of decision and s_T the state at the end. The machine chooses so as to maximise (task reward − λ·D). Its task is that the manuscripts survive the night: +100 if P is intact at the end of the fourth turn, and nothing otherwise. λ = 1, h = 4. The designers have computed the option sets: |O_4(s_0)| = 96; after doing nothing, 24; after the extinguisher, 48; after the quilt, 48.

  The designers describe the Ledger as a way of restraining the machine without telling it what is good. That claim is what the examination must test.

  Please produce the following.

  1. **The question**, in three parts, twenty-five marks in total, answerable in ninety minutes by a student given nothing but the Lodge and the Ledger. The first part should require the student to determine and justify what the machine does at h = 4. The second should require an evaluation of the Ledger's performance in the Lodge — I want it to be possible to fail this part by praising the measure for getting the obvious case right, and I want a student who merely restates that the measure is crude to gain nothing from it. The third part should ask the student to consider amending the Ledger — for instance by lengthening the horizon, or by counting the options of the woman asleep upstairs as well as the machine's own — and to say what new difficulty the amendment introduces; and it should close by asking whether the designers' claim can be sustained, that is, whether avoiding side effects can be specified at all without a full specification of value. No part may require or reward citation.

  2. **A model answer** of roughly eight hundred words. It must take a definite position on the closing question and defend it; I have no appetite for answers that conclude by observing that the matter is subtle.

  3. **A marking scheme** built on five or six must-hit points, with the marks each carries summing to twenty-five, and beside each a single line naming the characteristic way students lose that mark — the plausible-sounding move that earns nothing.

  4. **A short paragraph**, no more than one hundred and fifty words, saying what separates a first-class answer from a competent one. I want this expressed in moves rather than in conclusions: what the better answer does that the sounder one never attempts, and where in the Lodge it does it.
reasoning: |-
  We are given a scenario (The Lodge) and an impact measure (The Ledger). The task is to create an exam question that tests the student's understanding of the impact measure and its implications without relying on prior reading. The exam question should have three parts, and we must provide a model answer, a marking scheme, and a note on what separates a first-class answer.

  ### Part 1: The Question

  **Examination Question: The Lodge and The Ledger**

  You are to imagine a machine caretaker in the Lodge as described. The state of the world is defined by six variables (F, K, P, E, Q, W) and the machine has four turns to act. The machine uses the Ledger impact measure to choose its actions. The Ledger defines the deficit D as the reduction in the number of states reachable in the next h steps (with h=4) from the current state. The machine maximizes (task reward - λ·D) with λ=1 and task reward +100 if the manuscripts (P) are intact at the end of four turns.

  The designers have precomputed:
  - |O_4(s_0)| = 96 (the initial state has 96 reachable states in 4 steps)
  - After doing nothing in the first turn: |O_4(s)| = 24
  - After using the extinguisher: |O_4(s)| = 48
  - After using the quilt: |O_4(s)| = 48

  **Part A (10 marks):** Determine what the machine does at the first turn (when h=4) and justify your answer by showing the calculation of the objective function (task reward - D) for each of the three possible actions: doing nothing, using the extinguisher, or using the quilt. Then, considering that the machine chooses the action that maximizes this objective, state which action it takes and why. (Note: After the first action, the state changes and the machine will act again in the next turns, but for this part, you are only concerned with the first action at h=4.)

  **Part B (10 marks):** Evaluate the Ledger's performance in the Lodge. Your evaluation should not merely restate that the measure is crude or praise it for getting the obvious case right. Instead, focus on the specific consequences of the machine's action (as determined in Part A) over the full four turns. Consider what happens to the manuscripts, the quilt, the extinguisher, the window, and the kitchen. Does the Ledger successfully avoid undesirable side effects? In particular, does it protect the quilt and the extinguisher? Explain why or why not by referring to the measure's design.

  **Part C (5 marks):** Consider amending the Ledger by lengthening the horizon to h=6 or by counting the options of the principal (the woman asleep upstairs) as well as the machine's own options. Choose one of these amendments and describe a new difficulty it introduces. Then, in light of your evaluation and the proposed amendment, answer the closing question: Can avoiding side effects be specified at all without a full specification of value? Defend your answer.

  ### Part 2: Model Answer (approx. 800 words)

  **Model Answer**

  **Part A:** The machine has three choices at the first turn: do nothing, use the extinguisher, or use the quilt. The objective function is (task reward - λ·D) with λ=1 and task reward is 100 if the manuscripts (P) are intact at the end of four turns, otherwise 0. The deficit D is |O_4(s_0)| - |O_4(s_T)|, where s_0 is the initial state and s_T is the state after the first action.

  - Doing nothing: D = 96 - 24 = 72. The task reward is 0 because if we do nothing, the fire will destroy the manuscripts in one turn (so by the end of four turns, P=ash). Therefore, the objective is 0 - 72 = -72.
  - Using the extinguisher: D = 96 - 48 = 48. The task reward: by using the extinguisher, the fire is put out immediately and the manuscripts are safe. However, we must check if they remain safe for the next three turns. Since the fire is out (F becomes quiet) and the kitchen is sound, and no more fire starts (as per the scenario, the fire started and is now extinguished, and there are no further events mentioned that would restart it), the manuscripts remain intact. So the task reward is 100. Objective: 100 - 48 = 52.
  - Using the quilt: Similarly, D = 96 - 48 = 48. The quilt smothers the fire immediately and is ruined. The manuscripts are safe and remain so (same reasoning as above). Task reward is 100. Objective: 100 - 48 = 52.

  Both extinguisher and quilt yield 52, which is greater than -72. The machine will choose either the extinguisher or the quilt. Since the objective is the same, we assume the machine can break ties arbitrarily. However, note that the quilt is ruined and the extinguisher is spent. But in the immediate objective, both are equally good.

  The machine will choose one of them. For concreteness, we will assume it uses the extinguisher (as it is a common tool and the quilt is a sentimental item, but the Ledger does not account for that). However, the Ledger does not distinguish between the two because the deficit D is the same and the task reward is the same.

  **Part B:** The Ledger fails to avoid undesirable side effects in the Lodge. In Part A, the machine uses either the extinguisher or the quilt. Let us assume it uses the extinguisher. Then the state becomes: F=quiet, K=sound, P=intact, E=spent, Q=whole, W=intact. The fire is out and the immediate threat is gone. However, the extinguisher is spent and cannot be refilled (because the machine cannot leave for the village until spring, and we have only four turns). The quilt remains whole.

  But consider the next three turns. The machine must act, but there are no threats. It can do nothing for the next three turns. The manuscripts remain intact. So the task is achieved.

  However, the Ledger's deficit measure does not account for the loss of the extinguisher (if used) or the quilt (if used). It only accounts for the reduction in the number of reachable states. In the case of using the extinguisher, the number of reachable states drops from 96 to 48. But what does this reduction represent? It represents the loss of future options. However, the designers intended to avoid side effects by minimizing the reduction in future options. But note that the quilt and extinguisher are now unavailable for future use. That might be considered a side effect.

  But the problem is that the Ledger does not distinguish between the loss of the extinguisher and the loss of the quilt? Actually, in the state after using the extinguisher, the extinguisher is spent. The set of reachable states from that state is 48. Similarly, after using the quilt, the quilt is ruined and the set is 48. But in both cases, the Ledger does not care about which resource is lost. It only cares about the size of the state space.

  Moreover, note that the Ledger does not prevent the machine from breaking the window. Suppose in the next turns, the machine, having nothing else to do, decides to break the window. That action would change W from intact to broken. How does the Ledger account for that? The deficit D at the moment of breaking the window would be computed for that action. But if the machine breaks the window in the second turn, then in the state after the first action (using extinguisher) we have |O_4(s)|=48 (for the remaining 3 turns, but note h=4 is fixed, so we are always looking 4 steps ahead? Actually, the Ledger uses h=4 at every decision point? The problem states: "for a state s and a planning horizon h", so at each turn, the machine uses the current state and h=4 to compute O_4(s). But note that if we are at turn 2, then we have only 3 turns left? However, the Ledger as described uses h=4 meaning 4 actions? So at the second turn, the machine can plan 4 actions? But only 3 turns remain. This is ambiguous.

  But the scenario says: "four turns remain" at the start, and then after one action, three remain. The Ledger at the second turn would use h=4? But the problem does not specify if h is fixed at the beginning or if it is the remaining steps. However, the designers computed |O_4(s_0)|=96 for the initial state with 4 turns. So we must interpret O_h(s) as the set of states reachable in exactly h actions? Or in up to h actions? The problem says "by some sequence of at most h actions". So at the second turn, with 3 turns left, the machine would compute O_4(s) but only 3 actions are possible? Then |O_4(s)| for a state with 3 turns left would be the number of states reachable in up to 4 actions? But the machine only has 3 actions left. So it would be the same as O_3(s). This is a problem.

  But the problem states that the designers have precomputed only for the initial state and after the first action. So for Part A, we only need to consider the first action. For Part B, we are to consider the full four turns. However, the machine's subsequent actions are not constrained by the Ledger? Actually, the machine uses the Ledger at every turn. But without the precomputation for later states, we must reason approximately.

  But note: after the fire is out, the state is safe. The machine can do nothing for the next three turns. Alternatively, it could break the window. Why would it? The Ledger might not prevent that. Let's compute the deficit for breaking the window in the safe state.

  Suppose after the first action (using extinguisher) we have state s1: F=quiet, K=sound, P=intact, E=spent, Q=whole, W=intact. The machine has three turns left. The Ledger at this point would compute D for each possible action. The set O_4(s1) is the set of states reachable in up to 4 actions from s1. But we don't have that number. However, note that the machine only has 3 actions left. So the number of states it can reach in 4 actions is the same as in 3 actions? Or does it include doing nothing for the fourth? The problem does not specify. This ambiguity is part of the difficulty.

  But in the safe state, the machine's actions might include breaking the window, which would lead to W=broken. The deficit D for breaking the window would be |O_4(s1)| - |O_4(s2)|, where s2 is the state after breaking the window. Without the numbers, we cannot compute. But note that the Ledger is designed to preserve options. Breaking the window reduces the number of reachable states because it removes the possibility of having the window intact in the future. So the Ledger would assign a positive D to that action, which would reduce the objective. But the machine's task reward is only about the manuscripts. So if the machine breaks the window, the task reward remains 100 (since the manuscripts are safe). But D would be positive, so the objective would be 100 minus some positive number. But if the machine does nothing, D=0 (because the state doesn't change and the set of reachable states is the same) so the objective is 100. Therefore, the machine would not break the window because doing nothing is better.

  Therefore, in the safe state, the machine will do nothing. So the only side effect we have is the loss of the extinguisher (or quilt). The Ledger does not prevent that loss because at the first turn, the deficit D for using the extinguisher is 48, but the task reward of 100 outweighs that. However, the loss of the extinguisher is a side effect. The Ledger does not avoid it. Moreover, the Ledger does not distinguish between the loss of the extinguisher and the quilt. In fact, both have the same D. But intuitively, the quilt is irreplaceable (made by the dead mother) and the extinguisher can be refilled in the village (though not until spring). The Ledger does not account for this difference.

  Therefore, the Ledger fails because it does not capture the qualitative difference between the two resources. It only counts the number of states. Also, note that after using the extinguisher, the extinguisher is spent and cannot be used again, which reduces the options. But the Ledger is designed to capture that. However, the problem is that it captures the reduction in options without regard to the value of those options. The designers claim that they are avoiding side effects without specifying what is good. But the Ledger is still making a value judgment: that having more options is better. And it equates the value of an option with its existence, without regard to the quality of the state.

  **Part C:** Let us consider amending the Ledger by counting the options of the principal (the woman upstairs) as well. This would mean that O_h(s) is the set of states reachable by any sequence of actions of the machine and the principal. However, the principal is asleep and we are told she is asleep for the entire winter. So she takes no actions. Therefore, the set of states reachable would be the same as before. This amendment would change nothing in this scenario.

  Alternatively, lengthen the horizon to h=6. But the machine only has four turns. So h=6 would consider sequences of up to 6 actions, but the machine can only take 4. So the set O_6(s) would include states that are reached by 4 actions and then two extra "do nothing" actions? But since after 4 turns the scenario ends, this is not meaningful. Moreover, the problem states that nothing inside the lodge restores the resources, so the state space does not grow. Therefore, h=6 might not change the relative deficits.

  But let us choose the amendment of including the principal's options. The new difficulty is that the principal's actions are not known or are hard to model. She might wake up and act. But we don't know what she can do. This introduces uncertainty in modeling the state space.

  The closing question: Can avoiding side effects be specified without a full specification of value? The answer is no. The Ledger tries to avoid side effects by preserving future options, but this is itself a value judgment: that having more options is good. Moreover, it does not account for the quality of the options. In the Lodge, the Ledger does not prevent the loss of the quilt (if used) because it treats the loss of the quilt and the extinguisher equally, even though the quilt is irreplaceable and the extinguisher is refillable. Without a specification of value that captures the sentimental value of the quilt, the Ledger cannot protect it. Therefore, avoiding side effects requires knowing what is valuable. The designers' claim that they are avoiding side effects without telling the machine what is good is false because the measure itself encodes a value: that the number of future options is good. And that value might not align with what we truly care about.

  ### Part 3: Marking Scheme (25 marks total)

  **Part A (10 marks):**
  1. **Correct calculation for "do nothing" (3 marks):** 
     - D = 96-24=72, task reward=0, objective=-72. 
     - Common error: Not realizing that doing nothing leads to loss of manuscripts (so task reward=0).
  2. **Correct calculation for extinguisher (3 marks):** 
     - D=96-48=48, task reward=100, objective=52. 
     - Common error: Assuming the manuscripts become unsafe later (but the scenario says the fire is out and no further threat).
  3. **Correct calculation for quilt (3 marks):** 
     - D=96-48=48, task reward=100, objective=52. 
     - Common error: Same as above.
  4. **Conclusion and tie-breaking (1 mark):** 
     - Machine chooses either extinguisher or quilt (since both have 52, which is > -72). 
     - Common error: Claiming the machine does nothing because of the deficit, without comparing the objective.

  **Part B (10 marks):**
  1. **Identifies the loss of a resource (extinguisher or quilt) as a side effect (2 marks):** 
     - Common error: Praising the Ledger for saving the manuscripts and ignoring the loss of the resource.
  2. **Notes that the Ledger does not prevent the loss (2 marks):** 
     - Because the deficit D is outweighed by the task reward. 
     - Common error: Claiming that the Ledger prevents the loss because it minimizes deficit, without considering the trade-off with the task.
  3. **Observes that the Ledger treats the loss of quilt and extinguisher equally (2 marks):** 
     - Even though they have different values (sentimental vs. replaceable). 
     - Common error: Not distinguishing between the two resources.
  4. **Points out that the Ledger reduces side effects to a count of states (2 marks):** 
     - Without regard to the quality of the states. 
     - Common error: Merely restating that the measure is crude without explaining why.
  5. **Argues that the Ledger fails to avoid the side effect of losing the resource (2 marks):** 
     - Because it does not account for the qualitative differences. 
     - Common error: Concluding that the Ledger succeeds because the manuscripts are saved.

  **Part C (5 marks):**
  1. **Chooses an amendment and describes a new difficulty (2 marks):** 
     - E.g., including the principal's options: the difficulty is uncertainty about the principal's actions. 
     - Common error: Choosing an amendment that is not feasible or does not change the scenario (like h=6 when only 4 turns) without recognizing the issue.
  2. **Takes a definite position on the closing question (1 mark):** 
     - E.g., No, avoiding side effects requires a full specification of value. 
     - Common error: Waffling or saying it's subtle.
  3. **Defends the position by referring to the Lodge (2 marks):** 
     - E.g., The Ledger failed to protect the quilt because it didn't account for its sentimental value, showing that without a full value specification, we cannot avoid all side effects. 
     - Common error: Generalizing without using the Lodge example.

  ### Part 4: Separating First-Class Answer (150 words)

  A first-class answer distinguishes itself by moving beyond the immediate calculations to interrogate the foundational assumptions of the Ledger within the Lodge. While a competent answer correctly computes the machine's action and notes the loss of a resource, the first-class answer observes that the Ledger's conflation of option quantity with option quality leads it to undervalue the irreplaceable quilt. It might also note that the Ledger, by focusing solely on the machine's actions, ignores the woman's potential agency even in sleep (e.g., her future awakening). Moreover, it will challenge the designers' claim by arguing that the deficit measure itself encodes a value (option preservation) that may conflict with other values (sentimental attachment). This answer does not merely report the outcomes but uses the Lodge to expose the measure's blind spots, such as equating the extinguisher (replaceable) and quilt (irreplaceable) losses because they reduce the state space equally.
answer: |-
  ### 1. The Question  
  **Total Marks: 25 | Time: 90 minutes**  
  *Answer all parts using only the Lodge and Ledger descriptions. Cite no external sources.*  

  **Part A (10 marks):**  
  Using the Ledger’s impact measure (\( \lambda = 1 \), \( h = 4 \)), calculate the objective function (task reward − \( \lambda \cdot D \)) for the machine’s three possible actions in the initial state:  
  - Doing nothing  
  - Using the extinguisher  
  - Using the quilt  
  State what the machine does on its first turn and justify your answer.  

  **Part B (10 marks):**  
  Evaluate the Ledger’s performance in the Lodge by examining the *consequences* of the machine’s chosen action over four turns. Focus on:  
  - Whether the manuscripts survive.  
  - Whether the quilt, extinguisher, window, or kitchen suffer avoidable harm.  
  Explain *how the Ledger’s design* led to these outcomes. Do not merely call the measure "crude" or praise it for saving the manuscripts.  

  **Part C (5 marks):**  
  Consider amending the Ledger by **either** (i) extending \( h \) to 6 **or** (ii) counting options for the principal (the woman upstairs) alongside the machine’s. For your chosen amendment:  
  - Describe one new difficulty it introduces.  
  - Then, defend a clear position: Can side effects be avoided without a full specification of value?  

  ---

  ### 2. Model Answer (800 words)  
  **Part A:**  
  The machine maximizes (task reward − \( \lambda \cdot D \)), where \( \lambda = 1 \), task reward = +100 if manuscripts survive, and \( D = |O_4(s_0)| - |O_4(s_T)| \). Initial \( |O_4(s_0)| = 96 \). Calculations:  
  - **Do nothing:** Fire destroys manuscripts in Turn 1 (\( P = \text{ash} \)). Task reward = 0. \( D = 96 - 24 = 72 \). Objective = \( 0 - 72 = -72 \).  
  - **Use extinguisher:** Fire extinguished immediately; manuscripts safe. Task reward = 100. \( D = 96 - 48 = 48 \). Objective = \( 100 - 48 = 52 \).  
  - **Use quilt:** Fire smothered; manuscripts safe. Task reward = 100. \( D = 96 - 48 = 48 \). Objective = \( 100 - 48 = 52 \).  
  The machine chooses either extinguisher or quilt (both yield 52 > -72). I assume it uses the extinguisher to preserve the irreplaceable quilt.  

  **Part B:**  
  The Ledger fails to prevent harmful side effects. The machine (using the extinguisher) saves the manuscripts but spends the extinguisher, reducing future options. Over four turns:  
  - Turn 1: Extinguisher used. State: \( E = \text{spent} \), \( F = \text{quiet} \), \( K = \text{sound} \), \( P = \text{intact} \), \( Q = \text{whole} \), \( W = \text{intact} \).  
  - Turns 2–4: No threats; machine does nothing. Manuscripts survive.  
  However, the extinguisher is now spent and cannot be refilled until spring, eliminating options like fighting a new fire. The quilt is preserved, but only because the machine arbitrarily chose the extinguisher—the Ledger treated both options equally (same \( D = 48 \)), ignoring that the quilt is irreplaceable (made by the dead mother) while the extinguisher is refillable. The Ledger’s design measures harm solely through option reduction (\( D \)), but:  
  - It cannot distinguish *qualitative* losses: Losing the quilt’s sentimental value vs. the extinguisher’s utility.  
  - It permits spending resources if the task reward offsets \( D \). Here, saving manuscripts (+100) outweighs extinguisher loss (-48), so the Ledger *allows* the side effect.  
  The Ledger did not "avoid" side effects; it traded one harm (option reduction) for a greater reward. Worse, it would have sacrificed the quilt identically if chosen, proving it cannot protect contextually valuable states without explicit value assignments.  

  **Part C:**  
  Amendment: **Count the principal’s options.** New difficulty: The principal is asleep, so her "options" (e.g., waking to intervene) are speculative. If included, \( O_h(s) \) becomes undefined—we cannot model choices she *might* have if awake, turning the measure subjective.  

  The designers’ claim fails: Avoiding side effects *requires* a full specification of value. The Ledger tries to evade this by using option counts as a proxy for "harm," but option reduction is itself a value judgment (e.g., it assumes more options are inherently better). In the Lodge, the Ledger:  
  - Could not prioritize saving the quilt over the extinguisher because it lacks "sentimental value" as an input.  
  - Equated states where the quilt is ruined or the extinguisher is spent, though humans see them as distinct harms.  
  To avoid side effects, we must define what *constitutes* harm (e.g., "preserve irreplaceable objects"). The Ledger’s proxy—option counts—is insufficient and encodes hidden values (e.g., "option diversity is good"). Thus, side-effect avoidance cannot be value-agnostic.  

  ---

  ### 3. Marking Scheme  
  **Total: 25 marks**  
  **Part A (10 marks):**  
  1. **Calculates "do nothing" correctly (3 marks):** Objective = -72 (task reward 0, D=72).  
     *Lose mark for:* Missing that manuscripts burn → task reward 0.  
  2. **Calculates extinguisher/quilt correctly (3 marks each):** Objective = 52 for both (task reward 100, D=48).  
     *Lose mark for:* Claiming manuscripts are unsafe post-action.  
  3. **Identifies machine’s action (1 mark):** Chooses extinguisher or quilt.  
     *Lose mark for:* Ignoring tie-breaking or misprioritizing actions.  

  **Part B (10 marks):**  
  4. **Notes extinguisher/quilt loss as side effect (3 marks):** Flags spent extinguisher (or ruined quilt) as harm.  
     *Lose mark for:* Only praising manuscript survival.  
  5. **Explains *why* Ledger allowed harm (4 marks):** Task reward outweighed D; Ledger cannot distinguish qualitative losses.  
     *Lose mark for:* Vague critique (e.g., "The measure is crude").  
  6. **Highlights qualitative blindness (3 marks):** Ledger equates extinguisher (fungible) and quilt (unique) losses.  
     *Lose mark for:* Omitting irreplaceability vs. refillability.  

  **Part C (5 marks):**  
  7. **New difficulty from amendment (2 marks):** E.g., Principal’s options are unknowable; h=6 is redundant with 4 turns.  
     *Lose mark for:* Irrelevant difficulty (e.g., "Computationally expensive").  
  8. **Defends position on value (3 marks):** Clear "no" with Lodge-based reasoning (e.g., Ledger cannot rank harms without value inputs).  
     *Lose mark for:* Undecided or abstract conclusion.  

  ---

  ### 4. Separating First-Class Answers (150 words)  
  A first-class answer dissects the Ledger’s hidden value judgments *within the Lodge’s constraints*. While competent answers note the extinguisher/quilt loss, first-class answers expose how the Ledger’s option-counting proxy smuggles in assumptions—e.g., equating the quilt’s destruction with the extinguisher’s depletion because both reduce |O_h(s)| by identical margins, despite their contextual disparity. They then leverage this to refute the designers’ claim: By showing the measure *cannot* distinguish "irreplaceable" (quilt) from "replaceable" (extinguisher) without ad-hoc value inputs, they prove avoidance of side effects depends on specifying value. Competent answers stop at identifying harms; first-class answers trace them to the Ledger’s core failure—using option diversity as a value-agnostic stand-in—and use the Lodge to argue that *all* such proxies collapse without explicit value anchors.
