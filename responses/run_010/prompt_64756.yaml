prompt: |-
  I attended a reading-group session last month on Hume's section on miracles in the *Enquiry Concerning Human Understanding*, and the evening collapsed into a stalemate that I now think was entirely about the meaning of a single sentence. Our discussion leader, resisting the charge that Hume makes testimony to a miracle inadmissible in advance, said that Hume is only articulating ordinary epistemic hygiene — the line about the wise man, who therefore proportions his belief to the evidence — and that declining to accept a miracle report on that basis is no different from declining to act on a rumour. A week later, in an online exchange about a recovery that was documented by physicians and had no assignable natural explanation, a correspondent quoted that same sentence back at me in support of the opposite verdict: the evidence for the recovery is direct, contemporaneous, and multiply attested, whereas the evidence against it amounts only to a generalisation about how bodies usually behave, so proportioning belief to evidence obliges us to accept it. Identical words, contradictory conclusions, and nobody on either side ever said what the words assert.

  What I want is a disambiguation of that maxim, not a defence of either party. Please lay out the distinct precise theses it could be expressing, and separate the axes along which they differ: whether "belief" denotes a graded confidence or an all-or-nothing acceptance, since proportioning obviously makes sense of the first and is at least puzzling for the second; whether "proportions" means matching degree to degree, or merely varying in the same direction as, or simply not exceeding, the strength of the evidence; whose evidence is in question, and at what time — the believer's total evidence, the evidence actually before them, or the evidence available in principle; whether the rule is indifferent to the content of what is believed, or whether it permits the antecedent improbability of the reported event to be counted on the evidence's side, which is what seems to do all the work in Hume's application; and whether the sentence is descriptive, a claim about how wise people in fact form beliefs, or normative, a claim about how they ought to.

  For each candidate reading, say whether it is a platitude nobody would dispute, a substantive thesis that can be argued for, or straightforwardly false — and then say which reading each of my two interlocutors needed in order for their use of the maxim to go through, and whether any single reading could support both uses. I would also like the relation between this maxim and the comparison rule Hume advances a little later in the same section, roughly that testimony establishes a miracle only if the testimony's being false would be stranger than the event it reports: does that rule follow from the proportioning maxim, restate it, or smuggle in a further premise about how the two quantities are to be compared?

  Two further requests. First, tell me where you are most confident and where you are constructing readings that may correspond to nothing anyone has actually held; mark the difference rather than presenting the whole menu as equally attested. Second, say what would change your mind: which consideration, if it came out the other way, would push you to a different verdict about what the maxim claims or about whether it can be turned against miracle testimony at all — and identify the step in your own analysis that you think is most likely to be wrong. No reading list or references are needed; I am after the carving, not the scholarship.
reasoning: |-
  Okay, let me start by unpacking the user's query. They attended a reading group on Hume's section on miracles, which ended in a stalemate over the interpretation of one sentence: "the wise man proportions his belief to the evidence." The discussion leader used it to argue that rejecting miracle reports is standard epistemic practice, while another person used the same maxim to support accepting a well-documented miracle. The user wants a disambiguation of this maxim, breaking down possible interpretations along specific axes like the nature of belief, proportionality, whose evidence counts, etc. They also want to know which readings support each interlocutor's view and how Hume's comparison rule relates.

  First, I need to address each axis they mentioned. The nature of belief is crucial—whether it's binary or gradational. Proportioning makes more sense with degrees of confidence. Then, proportionality itself: does it mean matching degree, varying directionally, or not exceeding? The scope of evidence is another key point—total evidence vs. evidence at hand. Also, whether the content of the belief (like antecedent improbability) affects the evidence. And finally, whether the maxim is descriptive or normative.

  Hume's context is important here. In the miracles section, he's arguing against accepting miracle testimony because the improbability of the event outweighs the reliability of testimony. The user’s first interlocutor uses the maxim to say that rejecting miracles is standard, while the second uses it to argue that strong evidence obliges acceptance. So I need to show how different interpretations of the maxim lead to these opposing conclusions.

  For the wise man proportioning belief: if "evidence" includes prior probabilities (like the uniformity of nature), then the miracle's inherent improbability makes the evidence against it strong, supporting the first view. If evidence is only the testimony's reliability, then multiple attestations might support accepting it, as the second person argues. That's where the axes about evidence scope and content come in.

  The comparison rule Hume mentions—testimony must be more miraculous than the event—might derive from the proportioning maxim if we consider prior probabilities. But it could also be a separate rule. I need to clarify if it's a restatement or requires additional premises.

  The user also wants to know where I'm most confident. The gradational belief and normative readings are well-supported. The inclusion of prior probabilities in evidence is key in Hume's context but might not be explicit in the maxim itself. The binary belief interpretation is weaker since proportioning is tricky with on/off acceptance.

  For the interlocutors: the first needs a reading where evidence includes prior probabilities, leading to rejection. The second needs a narrow view of evidence as just testimony quality, supporting acceptance. No single reading supports both unless equivocated.

  Finally, I should identify what could change my mind. If the maxim is only about direct evidence without priors, that would weaken Hume's application. Or if belief is strictly binary, that makes proportioning incoherent. But historical context supports Hume's use of prior probabilities.
answer: |-
  Here's a disambiguation of Hume's maxim "the wise man proportions his belief to the evidence," structured along your specified axes. I'll mark confidence levels: **High Confidence** (textually or logically well-supported/common), **Medium Confidence** (reasonable inference/plausible reading), **Low Confidence** (more speculative/less attested). The maxim *can* support both positions in your examples, but only under distinct, incompatible interpretations.

  ---

  ### Axes of Disambiguation

  1.  **Nature of "Belief":**
      *   **Graded Confidence (Credence):** Belief exists on a continuum (e.g., 0% to 100% certainty). Proportioning means adjusting the *degree* of confidence to match the strength of the evidence.
          *   *Status:* **Platitude** (among those accepting graded belief). **High Confidence** this is Hume's primary meaning.
      *   **All-or-Nothing Acceptance (Binary):** Belief is "on" (accepted as true) or "off" (rejected or suspended). Proportioning becomes puzzling. Interpretations:
          *   *Only accept when evidence surpasses a high threshold (e.g., "beyond reasonable doubt").*
          *   *Accept/reject based on preponderance/balance of evidence.*
          *   *Status:* **Substantive Thesis** (arguable rules for acceptance), bordering on **False** if taken as "direct proportioning" (binary states don't proportion easily). **Medium Confidence** Hume *implies* rules for acceptance/rejection derived *from* graded proportioning, but the maxim itself strongly suggests gradation.

  2.  **Meaning of "Proportions":**
      *   **Matching Degree:** Degree of belief directly corresponds to the quantitative strength/weight of the evidence (e.g., 70% evidence → 70% confidence).
          *   *Status:* **Idealized Platitude** (aspirational norm), but **Substantive Thesis** in practice (how to measure "degree"?). **High Confidence** this is the core intent.
      *   **Varies Monotonically:** Belief strength increases/decreases as evidence strength increases/decreases, but not necessarily 1:1.
          *   *Status:* **Weaker Platitude.** **High Confidence** this is entailed by the core intent.
      *   **Does Not Exceed:** Belief strength should never be *greater* than what the evidence warrants (key for skepticism).
          *   *Status:* **Corollary Platitude** (follows from matching/varying). **High Confidence** this is crucial for Hume's application.

  3.  **Scope of "Evidence":**
      *   **Believer's Total Evidence (at time t):** All relevant knowledge/justification the individual possesses when forming the belief.
          *   *Status:* **Standard Normative View.** **High Confidence** this is Hume's meaning.
      *   **Evidence Actually Before Them:** Only the specific data/arguments consciously considered at the moment.
          *   *Status:* **Descriptively Plausible, Normatively Deficient.** **Medium Confidence** Hume intends total evidence, especially given his focus on prior probabilities.
      *   **Evidence Available In Principle:** All evidence that exists or could be gathered, regardless of the believer's access.
          *   *Status:* **Idealized Norm** (relevant for criticism), but **Impractical** for actual belief formation. **Low Confidence** as Hume's meaning here.

  4.  **Content-Neutrality vs. Antecedent Probability:**
      *   **Content-Neutral:** Evidence strength is assessed purely on the reliability/source/quantity of the *report* itself, independent of *what* is reported. The inherent plausibility of the event (prior probability) is irrelevant to "the evidence."
          *   *Status:* **Straightforwardly False** in probabilistic reasoning; ignores crucial Bayesian insight. **Low Confidence** as Hume's meaning (contradicts his argument).
      *   **Includes Antecedent Probability:** "Evidence" encompasses *all* relevant background knowledge, *including* the extremely high prior probability (based on uniform experience) that events like miracles (violations of natural law) do *not* occur. This prior probability is a massive component of the "evidence against" the miracle.
          *   *Status:* **Substantive Thesis** (Bayesianism), **Essential** to Hume's argument. **High Confidence** this is fundamental to Hume's intended application.

  5.  **Descriptive vs. Normative:**
      *   **Descriptive:** Claims this is how wise people actually *do* form beliefs.
          *   *Status:* **Empirically Dubious.** **Low Confidence** as primary meaning; Hume is prescribing wisdom.
      *   **Normative:** Prescribes how beliefs *ought* to be formed to be wise/rational.
          *   *Status:* **Platitude** (among proponents of evidence-based reasoning). **High Confidence** this is Hume's primary intent.

  ---

  ### Candidate Readings & Status

  1.  **Core Reading (Hume's Intent - High Confidence):** The wise man *normatively* adjusts his *graded confidence* to *match the strength* of his *total evidence*, which *includes the relevant antecedent probabilities* based on uniform experience. Belief should *not exceed* what this total evidence warrants.
      *   *Status:* **Substantive Thesis** (esp. re: antecedent probability & quantification). Core of Hume's epistemology in Sec. X.
      *   *Supports:* Your discussion leader's use (rejecting miracle testimony). The massive prior probability against miracles is a dominant part of the "evidence," making even strong testimony insufficient to warrant high confidence/acceptance.

  2.  **"Direct Evidence Only" Reading (Medium Confidence):** The wise man normatively adjusts his *binary acceptance* based *only* on the *direct evidence before him* (e.g., quality of testimony/witnesses), *ignoring antecedent probability*. Acceptance occurs if this direct evidence surpasses some threshold ("preponderance").
      *   *Status:* **Substantive Thesis** (arguable), but **Inadequate** for Hume's purpose and likely **False** as rational norm. Ignores crucial background knowledge.
      *   *Supports:* Your correspondent's use (accepting the documented recovery). Strong direct testimony ("direct, contemporaneous, multiply attested") outweighs the weak "evidence against" (mere "generalisation").

  3.  **"Do Not Exceed" Skeptical Reading (High Confidence Corollary):** The wise man ensures his *degree of confidence* (or his *binary acceptance*) *never exceeds* what the *total evidence* (including priors) warrants. Focus is on restraint.
      *   *Status:* **Platitude** following from Core Reading. Key skeptical tool.
      *   *Supports:* Discussion leader's use directly. *Could indirectly* support correspondent *if* they argue total evidence *including priors* actually *does* support acceptance (e.g., priors aren't absolute), but this is strained for miracles.

  4.  **Idealized Quantification (Low Confidence):** The wise man assigns a *precise numerical probability* matching the *quantifiable weight* of *all available evidence*.
      *   *Status:* **Aspirational Ideal, Substantive Thesis** (formal probabilism), **Impractical.** Not explicitly in Hume, though gestured towards.
      *   *Supports:* Neither use directly without further premises about quantification. Favors Core Reading's structure.

  ---

  ### Application to Your Interlocutors & Hume's Comparison Rule

  *   **Discussion Leader:** Needs **Reading 1 (Core)** or **Reading 3 ("Do Not Exceed")**. The inclusion of the massive antecedent improbability of miracles within the "evidence" is essential for their argument that proportioning belief *requires* rejection/very low confidence. **Reading 2 fails** for them.
  *   **Correspondent:** Needs **Reading 2 ("Direct Evidence Only")**. They explicitly exclude the antecedent improbability ("only a generalisation") from the relevant "evidence," focusing solely on the quality of the testimony as the "evidence for." **Reading 1 fails** for them as it includes the devastating prior probability.
  *   **Can one reading support both?** **No.** The interpretations are contradictory on the **Scope of Evidence** and **Antecedent Probability** axes. Reading 1 defines "evidence" inclusively (priors count heavily against), Reading 2 defines it exclusively (priors don't count/don't count heavily). The maxim is being **equivocated** upon.

  *   **Relation to Hume's Comparison Rule ("...the testimony being false would be more miraculous than the event it reports"):**
      *   This rule **follows directly from the Core Reading (1)** when applied to miracles.
      *   **Premise 1 (Core Reading):** Belief must be proportioned to total evidence.
      *   **Premise 2 (Hume):** The total evidence includes:
          *   (E1) The evidence *for* the reliability of the testimony (strength/character/number of witnesses, etc.).
          *   (E2) The evidence *against* the event occurring, derived from the uniform experience supporting the relevant law of nature (massive prior probability).
      *   **Conclusion (Comparison Rule):** To rationally believe the miracle report (M) over the alternative hypothesis that the testimony is false/mistaken (¬T), the probability of ¬T (given E1) must be *lower* than the prior probability of M (given E2). That is: `P(¬T | E1) < P(M | E2)`. Hume expresses this as ¬T being "more miraculous" (more contrary to uniform experience) than M. It's a specific application of proportioning belief to total evidence when weighing two competing hypotheses concerning an extraordinary event. It **restates the Core Reading's consequence** for this specific case, relying on the inclusion of antecedent probability.

  ---

  ### Confidence & What Could Change My Mind

  *   **Highest Confidence:** The maxim is **normative**, concerns **graded confidence**, and prescribes **matching/varying/not exceeding** the strength of the **total evidence available to the believer**. Hume **intends antecedent probability to be part of this evidence** in the miracle context.
  *   **Medium Confidence:** The comparison rule is a **direct consequence** of the Core Reading applied to miracles. Hume saw the maxim as justifying rules for **binary acceptance/rejection** derived *from* graded proportioning (e.g., reject when evidence falls below a practical threshold).
  *   **Low Confidence/Likely Construction:** The strict "Direct Evidence Only" reading as a *held principle* (rather than a mistake). While people *argue* like your correspondent, it's unlikely they consciously hold this as a coherent epistemic principle distinct from the Core Reading; it's more likely an oversight of prior probability. The "Idealized Quantification" reading as Hume's conscious model.

  *   **What Could Change My Mind:**
      1.  **On Antecedent Probability:** If a compelling textual/historical analysis showed Hume *explicitly* intended "evidence" in the maxim *only* to mean *direct testimonial/observational evidence* for the *specific event*, excluding general background knowledge/priors, that would significantly weaken my **Core Reading**. (Step: Interpretation of "evidence" scope in maxim vs. Hume's overall argument). *Current Strength:* Hume's entire Sec. X argument collapses without priors being evidence.
      2.  **On Graded vs. Binary Belief:** If analysis demonstrated that 18th-century epistemology (or Hume specifically) *only* conceived of belief in binary terms ("assent"/"dissent"), and the maxim was universally understood that way, I'd need to reinterpret "proportions" as purely about *whether* to believe, not *how much*. (Step: Nature of "belief"). *Current Strength:* "Proportions" strongly implies gradation; Hume's frequentist probability talk supports it.
      3.  **On Supporting Both Uses:** If a single, coherent, non-equivocal interpretation of the maxim could be articulated that *genuinely* supports *both* "reject all miracle testimony" *and* "accept this specific well-attested miracle" *using the same definition of evidence*, that would surprise me and force a re-evaluation. (Step: Coherence of interpretations). *Current Strength:* The prior probability creates an asymmetry no testimony can overcome for Hume, making the positions fundamentally incompatible under one reading.

  **Most Vulnerable Step in My Analysis:** The claim that the **"Direct Evidence Only" reading is not a seriously held principle but likely an oversight**. It's possible someone could consciously defend epistemic systems prioritizing direct report reliability over background priors in specific contexts (e.g., historical inquiry vs. natural law), though this remains deeply problematic probabilistically. My confidence here is more interpretive than textual.
