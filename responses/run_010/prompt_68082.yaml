  | Final election step               | Anti-faction (Guerrero/Dowlen) | strains  | Election allowed elite control but lot steps disrupted predictability.           | High               |  
  | Ceremonial Doge role              | Anti-capture efficacy           | breaks   | Powerless office reduced incentives for capture; real power elsewhere.           | High               |  
  | Hereditary eligibility            | Manin’s lot-as-democratic       | strains  | Lot served aristocracy, contradicting democratic association.                    | High               |  
  | Small face-to-face pool           | Anti-faction in small groups    | confirms | Random selection defused factions despite mutual knowledge.                      | Medium             |  
  | 500-year stability                | Anti-faction payoff             | confirms | System endured without internal collapse due to lot’s anti-faction role.         | High               |  

