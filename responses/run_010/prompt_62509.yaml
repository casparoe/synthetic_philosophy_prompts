     **Conclusion for case 1:** We cannot assign a single prior. We report the range of probabilities from the set of priors we considered (at least the two that the applicant might use: uniform T and uniform λ, and also the Jeffreys and log-uniform if deemed reasonable). We document that the range is due to the choice of variable for the prior and the lack of a clear natural symmetry.

