  We are facing a problem of assigning a prior distribution in the absence of data, where the principle of indifference (uniform prior) leads to paradoxes when the variable of interest is transformed. The goal is to create a decision procedure for assessors that avoids these paradoxes by requiring a justification for the choice of variable on which we are indifferent.

  The key insight is that indifference should be based on a "worldly carving" (a physical or natural property of the system) rather than an arbitrary choice of variable. The procedure should guide the assessor to find such a carving, and if none exists, then the procedure should not assign a single prior but instead handle the uncertainty appropriately.

  Proposed Decision Procedure:

  1. **Identify the quantity of interest (QoI) and the transformation group:**
     - Ask: What is the physical quantity that the safety case depends on? (e.g., time to breach, transmissivity, aperture, fraction defective)
     - Ask: What are the natural transformations that arise from the physics? (e.g., for time to breach, the rate is the reciprocal; for transmissivity, it is related to the cube of aperture; for a fraction, it might be invariant under relabeling)

     If the QoI has a natural scale (i.e., a transformation that is physically meaningful and leaves the problem invariant), then we can use that to define the prior.

  2. **Check for a natural symmetry or invariance:**
     - Ask: Is there a physical principle that suggests a particular form of invariance (e.g., scale invariance, translational invariance, rotational invariance) for the QoI?
     - Example: For a quantity that is inherently positive and might span orders of magnitude (like transmissivity), a log-uniform prior might be natural if the physics suggests that we are equally ignorant per order of magnitude.

     If such a symmetry exists, then we can use the invariant measure (Haar measure) for the prior.

  3. **Check for a known reference prior:**
     - Ask: Is there a well-established noninformative prior for this type of parameter in the statistical literature? (e.g., Jeffreys prior, which is invariant under reparameterization, and is based on the Fisher information)

     However, note that Jeffreys prior can be complex and may require a model (likelihood) to compute. Since we are in a no-data scenario, we must be cautious. But if the likelihood structure is known (even without data), then Jeffreys prior can be computed.

  4. **If a natural symmetry or reference prior exists:**
     - Use that prior and document the justification (e.g., "The prior is log-uniform because the physics of flow in fractures depends multiplicatively on aperture" or "The Jeffreys prior for the exponential model is uniform on the rate").
     - Report the prior and the transformation group that justifies it.

  5. **If no natural symmetry or reference prior is found:**
     - Then we cannot assign a unique prior. Instead, we must:
          a. Identify a set of reasonable priors (e.g., both uniform and log-uniform for a positive parameter) and propagate each through the model to get a set of probabilities for the event of interest.
          b. Report the range of probabilities (min and max) from the set of priors.

     The set of priors should be chosen based on common noninformative priors for the type of parameter (e.g., for a positive parameter: uniform, log-uniform, Jeffreys if known). The set should be kept small (2-3) and must be justified.

  6. **Documentation:**
     - For every prior assignment, document:
          - The variable chosen and why (the physical justification for the variable and the prior form)
          - The transformation group that the prior is invariant under (if applicable)
          - The set of priors considered (if multiple) and the resulting range of probabilities.

  7. **Reporting rule:**
     - If a unique prior is justified (by steps 1-3), then a single figure (probability or distribution) may be reported.
     - If multiple priors are considered (step 5) and they lead to a small divergence (e.g., less than a factor of 2 in probability, or less than 0.05 in absolute probability for critical events), then report the range and note the sensitivity.
     - If the divergence is large (e.g., factor of 2 or more, or absolute difference > 0.05), then:
          - Do not report a single figure. Instead, report the range and state that the uncertainty in the prior dominates.
          - If the event probability is critical (e.g., for safety case) and the range includes values that are both above and below a critical threshold, then the safety case must be re-examined with this uncertainty in mind.

     The thresholds (factor of 2, absolute 0.05) are judgment calls and should be set by the regulator. They can be adjusted per context.

  8. **Special case: Discrete uniform (like the canisters):**
     - When the indifference is over a finite set of equally likely possibilities (like the defective canister among 200) and the labeling is arbitrary (so that permuting the labels does not change the problem), then the uniform prior is justified by symmetry. This is a "worldly carving" because the physical objects are distinct but we have no information to distinguish them.

  Steps that are judgment calls (wearing the clothing of procedure):
     - Deciding which transformations are "natural" (step 1 and 2).
     - Choosing the set of priors in step 5 (which common noninformative priors to include).
     - Setting the thresholds for divergence in step 7.

  Now, run the procedure on the three cases:

  **Case 1: Incident one (liner-breach assessment)**
     - Quantity of interest: Time to first breach (T) and the annual breach rate (λ = 1/T). The event is breach within 100 years: P(T <= 100) = 1 - exp(-100λ) [if we model as exponential] but note the applicant model assumes T uniform on [50,500]. Alternatively, if we model T as uniform, then P(T<=100) = (100-50)/(500-50) ≈ 0.111. If we model λ as uniform on [0.002,0.02], then P(T<=100) = P(λ >= 0.01) = (0.02-0.01)/(0.02-0.002) ≈ 0.556 (if we assume T is exponential with constant rate, but note the uniform T model is not exponential). However, the problem states that the two assignments (uniform T and uniform λ) lead to different probabilities. We must decide which variable is natural.

     Steps:
     1. Identify QoI: The physical process of breach might be driven by a constant failure rate? If so, then the rate λ is a natural parameter (exponential model). But the applicant's model is uniform on T. So we must check the physics.

     2. Check for natural symmetry: 
          - If the breach mechanism is such that the failure rate is constant (memoryless), then the exponential model is natural, and the prior for λ should be uniform? Actually, in the exponential model, the noninformative prior for λ is 1/λ (Jeffreys prior) or uniform on log(λ). But note: the problem states the applicant's model makes T uniform. We have to see what the physics says.

          Without more information, we might consider that the time to breach is a result of a degradation process that is additive in time? Then uniform T might be natural. Or multiplicative? Then log T. Or constant hazard? Then uniform λ is not natural because the Jeffreys prior for the exponential rate is 1/λ (which is improper) or uniform on log(λ). 

     3. Since the physics is not specified, we cannot uniquely decide. Therefore, we must consider multiple priors.

          Possibilities:
            a. Uniform on T (as per applicant): P(T<=100) = (100-50)/(500-50) = 50/450 ≈ 0.111
            b. Uniform on λ: Then λ ~ U(0.002,0.02). Then the CDF for T is 1 - exp(-λ t). But note: if we assume T is exponentially distributed with rate λ, then the event T<=100 has probability 1 - exp(-100λ). Then:
                  P(T<=100) = ∫_{λ=0.002}^{0.02} [1 - exp(-100λ)] * (1/(0.02-0.002)) dλ
            We can compute this integral:

            Let a=0.002, b=0.02, then the density of λ is 1/(b-a) = 1/0.018.

            The integral becomes:
              [1/(b-a)] * [ ∫_{a}^{b} (1 - e^{-100λ}) dλ ]
              = (1/0.018) * [ λ + (1/100)e^{-100λ} ]_{0.002}^{0.02}
              = (1/0.018) * [ (0.02 - 0.002) + (1/100)(e^{-2} - e^{-0.2}) ]
              = (1/0.018) * [ 0.018 + 0.01*(0.1353 - 0.8187) ]   [because e^{-2}=0.1353, e^{-0.2}=0.8187]
              = (1/0.018) * [ 0.018 + 0.01*(-0.6834) ]
