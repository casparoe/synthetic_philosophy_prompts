          "In the absence of data, the assignment of a prior distribution must be based on physical symmetries or well-established noninformative priors. When no such basis is available, the assessment must consider a set of reasonable priors and report the resulting range of probabilities for the event of interest. This range reflects the uncertainty in the prior assignment and must be taken into account in the safety case."

     This approach is honest about the limitations and avoids the illusion of objectivity that the uniform prior in an arbitrary variable gives.

     Note: The procedure might be seen as more complex and time-consuming. However, it is necessary to avoid the paradoxes and to provide a defensible assessment.
answer: |-
  ### Decision Procedure for Assigning Priors in the Absence of Frequency Data

  #### **Objective**: Replace the current uniform-distribution default with a defensible, transparent process that avoids Bertrand-style paradoxes by requiring physical (not notational) justification for indifference.

  #### **Procedure Steps**:
  1. **Identify the Fundamental Physical Quantity (FPQ)**  
     - **Question**: "What is the physical property or event in the world that directly determines the safety outcome, independent of mathematical representation?"  
     - **Sufficient Answer**: A description grounded in physics/engineering (e.g., "aperture width of fractures" not "transmissivity"; "time-to-event of physical degradation" not "rate").  
     - **Judgment Call**: Deciding which quantity is "fundamental" (e.g., aperture vs. transmissivity). Requires domain expertise.  
     - **Stop Condition**: If no FPQ is agreed upon (e.g., applicant and assessor dispute the physics), proceed to Step 4.  

  2. **Check for Physical Symmetry or Natural Invariance**  
     - **Question**: "Is there a physical symmetry (e.g., permutation, scaling, or translational invariance) that justifies equal likelihood?"  
     - **Sufficient Answer**:  
       - **Discrete case**: Indistinguishability due to identical manufacturing/conditions (e.g., 200 canisters).  
       - **Continuous case**: Evidence of scale invariance (e.g., logarithmic spacing in hydraulic properties).  
     - **Judgment Call**: Whether a symmetry is "physical" (e.g., are fracture apertures inherently multiplicative?).  
     - **Assign Prior**: If symmetry is validated, use the invariant prior (e.g., discrete uniform, log-uniform).  

  3. **Validate Reparameterization Invariance**  
     - **Question**: "If we reparameterize the FPQ (e.g., rate vs. time, aperture vs. transmissivity), does the prior yield consistent probabilities for the safety event?"  
     - **Sufficient Answer**: The probability of the safety event (e.g., breach within 100 years) varies by ≤ δ (see Reporting Rule).  
     - **Assign Prior**: If invariant (≤ δ), use the prior from Step 2.  
     - **Stop Condition**: If not invariant, proceed to Step 4.  

  4. **Propagate Multiple Priors (No Unique Assignment)**  
     - **Action**: Compute probabilities for the safety event under all "reasonable" priors for the FPQ:  
       - For bounded intervals: Uniform, log-uniform, and Jeffreys prior (if applicable).  
       - For rates/events: Uniform, 1/λ (for rates), or hazard-based priors.  
     - **Report**: The minimum and maximum probabilities.  
     - **Documentation**: List all priors tested and their event probabilities.  
     - **Stop Condition**: Always stops here if prior is non-unique.  

  5. **Escalate to Qualitative Judgment**  
     - **Trigger**: Disputes over what "should" be indifferent (e.g., "Is fracture size naturally additive or multiplicative?").  
     - **Action**: Refer to regulator’s chief scientist or panel. Document competing justifications.  

  ---

  #### **Documentation Format**  
  - **FPQ**: [Stated fundamental quantity]  
  - **Symmetry/Invariance**: [Description or "none"]  
  - **Priors Tested**: [List, with event probabilities]  
  - **Divergence**: [Max difference in event probabilities]  
  - **Resolution**: [Single prior + value, or min/max range]  

  ---

  #### **Reporting Rule**  
  - **Single Figure Allowed If**:  
    - Divergence in safety event probability across priors is ≤ **0.05 absolute** or **≤ 20% relative**.  
    - **Example**: Probabilities 0.10 vs. 0.12 (divergence 0.02) → report 0.11.  
  - **Range Required If**:  
    - Divergence > 0.05 absolute or > 20% relative.  
    - **Example**: Probabilities 0.11 vs. 0.62 → report [0.11, 0.62].  
  - **Withdraw Single Figure**: If new reparameterization shows divergence > thresholds.  

  ---

  ### **Procedure Applied to Cases**  

  #### **Case 1: Liner-Breach Assessment (Incident One)**  
  - **FPQ**: Time to breach (T) or breach rate (λ)?  
    - Physics: Breach is a time-to-event process; no inherent rate symmetry.  
    - **Judgment**: T is FPQ (applicant’s model centers on time).  
  - **Symmetry**: None (no evidence rates are additive/scaling-invariant).  
  - **Reparameterization Check**:  
    - Uniform T ∈ [50, 500] years → P(breach ≤ 100) = (100–50)/(500–50) = **0.111**.  
    - Uniform λ ∈ [0.002, 0.02]/year → P(breach ≤ 100) = P(λ ≥ 0.01) = (0.02–0.01)/(0.02–0.002) = **0.556**.  
    - Divergence: |0.111 – 0.556| = 0.445 > 0.05 → **non-invariant**.  
  - **Propagate Multiple Priors**:  
    - Include Jeffreys prior (1/λ) → P(breach ≤ 100) ≈ **0.625** (worse divergence).  
  - **Report**: Range **[0.111, 0.625]**.  
  - **Documentation**:  
    > FPQ: Time to breach (T). No physical symmetry. Priors tested: Uniform T (P=0.111), Uniform λ (P=0.556), Jeffreys (P=0.625). Divergence: 0.514. Resolution: Range [0.111, 0.625].  

  ---

  #### **Case 2: Transmissivity Assessment (Incident Two)**  
  - **FPQ**: Hydraulic aperture (a) (transmissivity T ∝ a³; aperture is physical basis).  
  - **Symmetry**: Fracture sizes often log-scaled in geophysics → **log-invariance plausible**.  
  - **Reparameterization Check**:  
    - Uniform T ∈ [1e⁻⁹, 1e⁻⁵] m²/s → P(T < threshold) ≈ **0.01**.  
    - Uniform a (derived from T) → P(a < threshold) ≈ **0.012**.  
    - Log-uniform T → P(T < threshold) = **0.25**.  
    - Log-uniform a → P(a < threshold) ≈ **0.17**.  
    - Divergence: Max |0.01–0.25| = 0.24 > 0.05 → **non-invariant**.  
  - **Propagate Multiple Priors**:  
    - Min probability: Uniform T (0.01)  
    - Max probability: Log-uniform T (0.25)  
  - **Report**: Withdraw single figure; publish range **[0.01, 0.25]**.  
  - **Documentation**:  
    > FPQ: Hydraulic aperture (a). Symmetry: Scale invariance (log-uniform). Priors tested: Uniform T (P=0.01), Uniform a (P=0.012), Log-uniform T (P=0.25), Log-uniform a (P=0.17). Divergence: 0.24. Resolution: Range [0.01, 0.25].  

  ---

  #### **Case 3: Defective Canister Shipment**  
  - **FPQ**: Identity of defective canister (discrete choice).  
  - **Symmetry**: Canisters physically identical; records lost → **permutation invariance**.  
  - **Reparameterization Check**: Not applicable (discrete case).  
  - **Assign Prior**: Uniform (1/200 per canister).  
  - **Report**: Single figure **0.005**.  
  - **Documentation**:  
    > FPQ: Defective canister ID. Symmetry: Permutation invariance (indistinguishable units). Prior: Uniform (P=0.005).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve Non-Unique "Worldly Carving"**:  
     - The world rarely provides a unique FPQ or symmetry (e.g., aperture vs. transmissivity). The procedure will often output ranges, not single values.  
     - **Handbook Response**: "When physical symmetries are ambiguous or contested, we report a probability range reflecting all reasonable priors. This range quantifies epistemic uncertainty and must inform risk tolerance."  

  2. **Eliminate Judgment**:  
     - Choosing the FPQ and symmetry relies on assessor expertise (and is contestable). The procedure exposes—not eliminates—this subjectivity.  

  3. **Guarantee Precision**:  
     - In continuous cases (e.g., fracture properties), divergences >20% are common. The procedure forces transparency but cannot compress ranges artificially.  

  4. **Replace Data**:  
     - It does not generate knowledge; it only formalizes ignorance. When data exists, use empirical priors.  

  ---

  ### **Diagnosis Validation**  
  - **Case 2** produces the undesirable result (range [0.01, 0.25] replaces published 0.01), confirming your expectation.  
  - **Collapse Risk**: The procedure avoids collapse by:  
    - Allowing single values when symmetry is physical (Case 3).  
    - Outputting ranges (not refusing priors) when symmetry is ambiguous (Cases 1–2).  
  - **Handbook Update**: Replace the uniform-default rule with this procedure. Train assessors in symmetry identification and sensitivity analysis.
