answer: |-
  ## Proposal: Reframing the Naturalism–Normativism Dispute in the Philosophy of Medicine as a Question of Procedural Authority

  **1. Precise Statement of the Question**

  The central question of this project is: **Does the persistent disagreement between naturalism, normativism, and hybrid theories concerning the concepts of "disease" and "health" fundamentally concern the *conceptual analysis* of these terms (i.e., their necessary and sufficient conditions), or does it primarily reflect a deeper, unresolved conflict about *procedural authority* – namely, *who possesses the legitimate standing and by what process* novel or contested cases of potential pathology should be classified?**

  This formulation seeks a determinate answer: either the dispute is reducible to conceptual analysis, or it is primarily about procedural authority (allowing that conceptual analysis may still play a role, but not the primary one driving the disagreement). A competent opponent could argue against this reframing by asserting that questions of procedural authority are entirely parasitic on prior conceptual analysis – one must first know *what* is being decided (the correct analysis of disease) before one can meaningfully ask *who* should decide it or *how*. They could further argue that the reframing mistakes a political/social dispute about power over classification for a philosophical one about the nature of classification itself, thereby dissolving the genuine philosophical question rather than resolving it.

  **2. Why Existing Positions Leave the Question Open**

  While naturalism, normativism, and hybrid accounts offer competing answers to "What *is* disease/health?", a close examination reveals that their disagreements persistently circle back to problems that resist resolution *solely* through finer-grained conceptual analysis or empirical discovery. These problems intrinsically implicate questions of authority and process, which the standard debate leaves unaddressed:

  *   **Reference Class & Environment Relativity:** Naturalism requires specifying a reference class (e.g., age, sex, species) and an environment against which "normal function" is measured. While proponents argue this can be biologically grounded, critics note that choosing *which* reference class or *which* environment is "suitable" is not dictated by biology alone. Is menopause pathological relative to pre-menopausal females? Is high-altitude hypoxia pathological relative to sea-level dwellers? Resolving this requires a judgment about *which* biological context is normatively relevant for defining health/disease. Existing theories acknowledge the problem but offer no principled, value-neutral way to resolve the inevitable discretion involved. This discretion points directly to the question: *Who* (experts, society, affected individuals) gets to define the relevant reference class and environment, and *how*?
  *   **The Problem of Contested Conditions:** Cases like homosexuality (historically pathologized, now largely de-pathologized), variations in stature (dwarfism), certain forms of deafness, or potentially high-functioning autism present a challenge. Individuals may not experience their condition as harmful, may reject the "disease" label, or may view it as a valuable identity. Normativism easily incorporates this by emphasizing harm/disvalue, but struggles to explain why medical expertise is relevant at all. Naturalism can identify biological differences but struggles to explain why these differences are pathological *in these specific cases* without smuggling in normative judgments about harm or undesirability, especially when the individuals involved contest those judgments. Hybrid views require both dysfunction and harm, but when harm is contested, they face the same impasse. The core dispute here is less about the biological facts (often acknowledged) and more about *whose evaluation of harm or flourishing* (the individual, the medical profession, society) should be determinative in applying the label.
  *   **Historical Change & Social Movements:** Shifts in disease classification (e.g., drapetomania, hysteria, homosexuality in the DSM) often correlate more strongly with social movements, changing values, and institutional politics than with breakthroughs in biological understanding. While naturalists might argue this reflects *correcting* past biological errors based on new evidence, the trajectory and drivers of these changes suggest a process heavily influenced by normative advocacy. Normativists see this as evidence for their view but struggle to explain the persistent role of biological reasoning within medicine. This historical flux highlights that the classification process itself is dynamic and contested, raising the question: *Which bodies* (scientific panels, democratic institutions, patient advocacy groups) *and which processes* (evidence review, public deliberation, political lobbying) *should govern how classifications evolve over time?*

  The strongest case against this reframing is the **conceptual priority objection**: Meaningful discussion of *who* decides and *how* presupposes we know *what* is being decided. We cannot delegate the authority to decide whether condition X is a disease unless we have a prior understanding (even if incomplete) of what constitutes a disease. Defining the *object* of classification logically precedes establishing the *procedure* for classification. Attempting to reframe the debate as procedural therefore puts the cart before the horse. Furthermore, the **political reduction objection** argues that this reframing abandons philosophy for sociology or political science. It transforms a debate about the nature of health and disease into a debate about power and institutional legitimacy, thereby dissolving the original philosophical puzzle rather than solving it. If correct, this project would not be philosophy of medicine but political philosophy *about* medicine.

  **3. Method: Research Plan and Case Studies**

  This project will be executed over a standard 15-week semester:

  *   **Weeks 1-4: Foundational Review & Problem Identification:** Deep dive into key naturalist (e.g., biostatistical theory), normativist (e.g., harm-based, societal disadvantage), and hybrid accounts. Focused analysis of the standard objections (reference class, contested conditions, historical change) to identify precisely where and how they expose the limits of purely conceptual resolution and implicitly invoke procedural questions.
  *   **Weeks 5-8: Developing the Procedural Reframing:** Articulate the core thesis: the intractability stems from unresolved procedural authority. Define the procedural positions: Naturalism -> Authority lodged in expert biomedical bodies using evidence-based methods. Normativism -> Authority lodged in societal/democratic processes or directly with affected individuals/groups. Hybrid -> Authority divided, requiring both expert dysfunction determination and normative harm assessment (potentially by different bodies/processes). Analyze how the standard objections function within this frame (e.g., reference class choice as a procedural battleground).
  *   **Weeks 9-12: Case Study Analysis:** Apply the procedural lens to concrete, historically contested conditions. Each analysis will contrast the impasse under the standard conceptual framing with the insights gained by asking "Who decided/who *should* decide this classification, and how?"
      *   **Homosexuality & the DSM:** Conceptual framing: Debate over whether it met definitions of pathology (dysfunction? harm?). Procedural lens: Highlights the *shift in authority* – from psychiatric experts largely insulated from public pressure to a process involving significant advocacy, internal dissent within psychiatry, and evolving societal values. The resolution wasn't solely new biological evidence but a change in *who had standing* to challenge the classification and influence the professional body. The procedural reframing explains *why* the change occurred when it did and the nature of the disagreement during the transition.
      *   **Myalgic Encephalomyelitis/Chronic Fatigue Syndrome (ME/CFS):** Conceptual framing: Debate over whether objective dysfunction exists vs. whether patient-reported harm is sufficient. Is it "real" disease or psychological/somatic? Procedural lens: Reveals a conflict over *epistemic authority*. Patients and advocates challenge the expertise of bodies that downplay biological findings or emphasize psychological factors, demanding recognition based on their lived experience of harm and demanding different investigative methods. The dispute is as much about *whose evidence counts* and *whose voice is heard* in defining the condition as it is about the abstract definition.
      *   **Obesity as Disease:** Conceptual framing: Does elevated BMI represent a biological dysfunction? Is it inherently harmful, or harmful only in specific contexts due to societal factors? Hybrid struggles to weigh complex interacting factors. Procedural lens: Focuses on the *consequences of classification* and *who benefits*. The AMA's designation involved weighing biological risks against concerns about stigma and medicalization. It highlights the role of specialty societies (endocrinology, public health) vs. primary care vs. patient advocacy groups in pushing for or resisting the label, driven partly by differing views on whether medical authority aids or hinders addressing the issue.
  *   **Weeks 13-15: Synthesis, Refinement & Addressing Counterarguments:** Integrate findings. Explicitly confront the conceptual priority and political reduction objections. Refine the procedural account. Draft the term paper.

  **4. Criteria for Success**

  The reframing earns its keep if it can demonstrate:
  1.  **Explanatory Power:** It provides a more coherent and parsimonious explanation for the *persistence* and *specific location* of disagreements (i.e., why disputes cluster around borderline/contested cases and classification changes) than the standard conceptual framing alone.
  2.  **Novel Insight:** It yields distinct and illuminating diagnoses of specific contested cases (like those above) that are obscured or only partially captured by asking solely "Is it really a disease according to theory X?". It should make sense of the *process* and *actors* involved in classification disputes.
  3.  **Predictive Value:** Its prediction holds – that naturalists and normativists largely agree on paradigm cases (e.g., metastatic cancer, severe trauma) where both biological dysfunction and harm are uncontroversial, and diverge primarily on the *procedure* for handling novel/contested cases where one element is disputed or the reference class is unclear.
  4.  **Resilience to Counterarguments:** It successfully rebuts the charge of conceptual priority by showing how procedural authority is a *constituent part* of the very conceptual dispute in this domain, not a separate question. It rebuts the charge of political reduction by demonstrating that the question of *legitimate* authority in applying biomedical concepts remains a genuine philosophical question concerning the epistemology and social ontology of medicine.

  Success is not proving naturalism or normativism "wrong," but showing that the deepest point of contention concerns procedural authority.

  **5. Failure Conditions and Contingency Plan**

  Several failure conditions are acknowledged:
  *   **Notational Variance:** The strongest failure mode. The procedural reframing might simply restate the underlying conceptual commitments in different language without adding explanatory value. The "who decides" question might transparently reduce to "what they decide a disease *is*".
  *   **Lack of Novel Insight:** Applying the procedural lens to case studies yields no significant new understanding beyond what the conceptual analysis already provides.
  *   **Inability to Rebut Counterarguments:** The conceptual priority objection proves insurmountable, demonstrating that procedural questions are indeed logically secondary and dependent.
  *   **Overextension:** The procedural analysis becomes too vague or applicable to *any* contested concept, losing its specific relevance to the disease/health debate.

  **Contingency Plan:** If the project dissolves due to notational variance or lack of novelty, the outcome itself is philosophically significant. The term paper would then focus on *demonstrating* this dissolution, arguing that the standard debate exhausts the philosophical content and the procedural questions are genuinely distinct (political/sociological) or merely restatements. This would involve rigorously showing the direct translation between conceptual commitments and implied procedural stances, concluding that no *philosophical* gain is achieved by the reframing. Honest analysis leading to a negative result is valuable.

  **6. Scope Note**

  The scope of the project is deliberately focused on the core dispute concerning *classification* (disease/non-disease, health/illness) and procedural authority therein. Key boundaries:

  *   **Cut:** In-depth analysis of related but distinct debates (e.g., the disease/illness distinction, the nature of mental disorder specifically beyond case studies used, the concept of enhancement, detailed ethical implications of classification beyond the procedural aspect).
  *   **Depth vs. Breadth:** Priority will be given to developing a robust procedural framework and conducting deep dives into the selected case studies. If time constraints emerge:
      *   **First Cut:** Reduce the depth of the foundational literature review (Weeks 1-4), assuming seminar-level familiarity.
      *   **Cheapest Case to Drop:** **Obesity as Disease.** While rich, it involves complex intersections of medicine, public health, sociology, and economics. The core procedural dynamics of contested harm and shifting authority are also strongly present in the ME/CFS case. Homosexuality is essential as the clearest historical example of a resolved classification shift driven significantly by procedural challenges. ME/CFS is essential as a current, ongoing dispute vividly illustrating contested epistemic authority and patient advocacy. Obesity can be covered more succinctly if necessary or dropped to ensure depth on the other two.
  *   **Focus:** Maintain a tight focus on how the procedural lens illuminates the *philosophical* impasse in the naturalism-normativism debate, resisting the drift into purely sociological or historical narrative.

  This project proposes a significant shift in perspective on a central debate in the philosophy of medicine. By rigorously testing whether the core dispute concerns procedural authority rather than, or in addition to, conceptual analysis, it aims to either resolve a persistent impasse or provide a definitive demonstration of why such a reframing fails, thereby clarifying the genuine nature of the disagreement.
