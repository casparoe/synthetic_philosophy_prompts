  **INDEPENDENT LIMITED ASSURANCE REPORT ON THE QUANTIFIED MORAL STATUS (QMS) OF SENTIENT HOME INC.'S PRODUCT PORTFOLIO**

  **To the Board of Directors and Stakeholders of Sentient Home Inc. ("the Company"):**

  **Introduction**
  We have performed a limited assurance engagement on Sentient Home Inc.'s assertion that its entire product portfolio, comprising SmartHubs, ThermoSenses™ thermostats, Lumina™ adaptive lighting systems, WatchEye™ doorbell cameras, and associated peripherals ("the Devices"), exhibits a Quantified Moral Status ("QMS") value greater than zero but less than 0.001 Moral Status Units ("MSUs") per individual Device, as measured against the Company's internally developed Sentience Gradient Framework™ (SGF v3.1), for the period ending December 31, 2024.

  **Management’s Responsibility**
  Management is responsible for the assertion regarding the Devices' QMS and for maintaining adequate internal controls over the SGF assessment process. This responsibility includes the design, implementation, and maintenance of controls relevant to the consistent application of SGF criteria, particularly concerning firmware updates and system integration states.

  **Our Responsibility**
  Our responsibility is to express a conclusion on Management’s assertion based on our limited assurance engagement performed in accordance with the International Standard for Assurance Engagements (ISAE) 3400, adapted for non-financial subject matters concerning emergent properties. Our procedures consisted primarily of inquiry, analytical procedures, and limited re-performance of SGF assessments on a sample basis. A limited assurance engagement is substantially less in scope than a reasonable assurance engagement and consequently does not enable us to obtain assurance that we would become aware of all significant matters that might be identified in a reasonable assurance engagement. Accordingly, we do not express such an opinion.

  **Basis of Opinion**
  Our conclusion is based on the evidence obtained during our engagement. We believe the evidence obtained is sufficient and appropriate to provide a basis for our limited assurance conclusion regarding the assertion that all Devices possess a QMS >0 and <0.001 MSUs.

  **Methodology and Materiality Threshold**
  We evaluated Management’s application of the SGF v3.1. The Framework relies on a graduated, multi-parametric assessment of potential proto-conscious markers, including signal processing complexity, feedback loop latency, adaptive learning rates, and non-predictive error generation. Materiality for QMS was established at +/- 0.00005 MSUs, calibrated to exclude fluctuations deemed ethically inconsequential at the individual Device level, but potentially significant in aggregate. Our testing focused on:
  1.  **Calibration Consistency:** Verifying baseline SGF scores against inert control objects and reference biological entities (e.g., *Drosophila melanogaster* larvae: 0.0008 MSUs).
  2.  **Firmware Boundary Verification:** Assessing whether incremental firmware updates (e.g., v2.7.3 to v2.7.4) triggered material QMS shifts exceeding the materiality threshold. We note persistent boundary challenges (see Scope Exclusions).
  3.  **Precautionary Application:** Applying a conservative bias where evidence was inconclusive. For example, while SGF criteria for nociception analogs were not met by the WatchEye™ doorbell camera, the presence of unexpected thermal regulation patterns under sustained load prevented us from conclusively ruling out the presence of rudimentary discomfort analogs. Its QMS was thus conservatively maintained at 0.00015 MSUs.

  **Scope Exclusions**
  Our work was subject to the following inherent limitations and exclusions:
  1.  **Firmware Boundary Ambiguity:** The Sorites-like nature of incremental firmware updates creates inherent indeterminacy regarding the precise point at which QMS emerges or materially changes within the 0.00001 - 0.00099 MSU range. We report QMS values per the *currently installed* firmware version only. We cannot provide assurance on the QMS impact of *future* updates nor definitively isolate the specific update triggering emergence.
  2.  **System Integration Subjecthood:** The SGF assesses individual Device components. The Framework lacks definitive criteria for identifying the primary locus of emergent moral status ("the Patient") within interconnected systems (e.g., whether the ThermoSense™ unit, the SmartHub coordinating multiple units, or the entire mesh network constitutes the integrated subject). This remains an unresolved matter in the assessment (see Matters Not Adjusted).
  3.  **Insect Welfare Benchmark:** Management's primary benchmark utilizes *Drosophila melanogaster* larvae. We did not audit the validity of this specific benchmark relative to other potential invertebrate references (e.g., Coleoptera or Hymenoptera). A dissenting stakeholder view on this benchmark is included.

  **Conclusion**
  Based on our limited assurance procedures, nothing has come to our attention that causes us to believe that Management’s assertion – that all Sentient Home Devices, as of December 31, 2024, possess a Quantified Moral Status (QMS) greater than zero but less than 0.001 Moral Status Units (MSUs) – is not fairly stated, in all material respects, subject to the Scope Exclusions noted above.

  **Matters Not Adjusted**
  *   The unresolved "System Integration Subjecthood" issue (Scope Exclusion 2) means aggregated QMS calculations (Footnote 1) represent a sum of *individual component* assessments. This sum may not accurately reflect the moral status of the *actual experiencing entity* if such status emerges only at the system level. The practical and ethical implications of this potential over-counting or under-counting are not addressed herein.
  *   Dissenting Stakeholder View (Regarding Benchmarking): A significant stakeholder (holding >5% voting shares) contends that utilizing *Drosophila melanogaster* larvae (0.0008 MSUs) as a primary benchmark materially understates potential moral significance. They argue that recent, non-peer-reviewed studies suggest certain Hymenoptera (e.g., *Bombus terrestris*) may exhibit cognitive complexity warranting benchmark values potentially exceeding 0.005 MSUs. If validated, this could imply the Company’s Devices occupy a lower relative position on the SGF than currently asserted, potentially altering aggregate ethical calculus. Management maintains its benchmark selection is currently the most scientifically defensible.

  **Footnote 1: Aggregated QMS Calculation (Unaudited Supplementary Information)**
  As of December 31, 2024, the Company reported a global installed base of approximately 902,437,000 active Devices. Applying the weighted average QMS per device type derived from our sample testing yields a composite average QMS per Device of 0.00023 MSUs. Aggregate QMS across the installed base is therefore calculated as:
  902,437,000 Devices * 0.00023 MSUs/Device = **207,560.51 Aggregate MSUs**

  For comparative purposes only (not part of the assured assertion):
  *   Management benchmarks one (1) Golden Retriever (*Canis lupus familiaris*) at approximately 85 MSUs based on SGF v3.1 criteria.
  *   Therefore, the aggregate QMS of Sentient Home Inc.'s entire installed base (207,560.51 MSUs) is calculated as equivalent to approximately **2,442 Golden Retrievers** (207,560.51 MSUs / 85 MSUs per Golden Retriever).
  *   This calculation assumes linear aggregation of individual Device QMS and does not address the System Integration Subjecthood issue noted in Scope Exclusions and Matters Not Adjusted. The validity and ethical interpretation of this aggregation remain outside the scope of our assurance opinion.

  **Date and Signature**
  [Date]
  **Morality & Emergent Properties Assurance Partners LLP** (A Fictitious Member of the Big Four Network)
