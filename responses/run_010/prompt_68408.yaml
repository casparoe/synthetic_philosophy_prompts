  **Leading Diagnosis**  
  The disagreement persists because **each camp answers a distinct question**:  
  - **Causal**: *"What act maximizes expected utility given my current reasoning method?"* (Holds decision type fixed; treats predictor’s actions as past cause).  
  - **Evidential**: *"What act best signals desirable states given my total evidence?"* (Holds background knowledge fixed; screens off "spurious" correlations).  
  - **Updateless**: *"What reasoning policy, if adopted beforehand, would yield the best outcomes?"* (Allows decision type to vary; treats it as part of the state).  
  Their argumentative practice confirms this: CDT and EDT treat "choice" as a *momentary act*, while updateless treats it as a *temporal commitment*. This is why rebuttals seem irrelevant—e.g., CDT hears "you end up poor" as a non sequitur because it’s about policy, not act-evaluation.  

