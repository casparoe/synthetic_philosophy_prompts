  **Bottom Line**  
  The disagreement is irreconcilable without meta-acknowledgment that "decision problems" are underspecified. Progress lies in clarifying whether we seek *act-rationality* (causal/evidential) or *policy-rationality* (updateless), not in refuting one view. Each theory answers a valid question, but no question owns "decision theory."  

