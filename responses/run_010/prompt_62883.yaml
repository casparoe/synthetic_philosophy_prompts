prompt: |-
  I'm in a phil of mind seminar that's spent the last three weeks on mind uploading, and I'm supposed to write a paper that engages with the personal-identity side of it. But before I wade into the candidate views I want to know what I should be demanding of one. So: write me the desiderata for a theory of survival-through-uploading — the full spec of what an account has to deliver to be good enough that I could actually use it to reason about what happens to me in these cases, not just to score points in section.

  What I want in it:

  - the cases it has to get right, with the intuition behind each one and a note on how load-bearing that intuition really is. Include the standard set (scan-and-destroy, the gradual neuron-for-neuron replacement of Chalmers's fading/dancing qualia sort, fission into two running copies, a copy that stays online while I'm still walking around in my body) plus one my seminar group made up that I've never seen handled anywhere: a handshake upload where the emulation is built first, and then biological neurons get deleted one at a time as the em takes over each job, so for weeks the two systems are causally coupled and jointly producing my behavior — and the em runs at maybe 10x clock speed so it's racking up memories faster than the meat does. Mid-transition, who is thinking? Does the speed mismatch matter, and if a theory says no, what is it using to say so?
  - the distinctions it can't collapse. Identity vs. what matters in survival, survival vs. duplication, and whatever else you think people quietly run together in this debate.
  - anything from neuroscience or physics it can't contradict, if there's anything relevant at that level.
  - for each requirement, whether it's genuinely non-negotiable or is really one camp's preference dressed up as a constraint. Like "must be compatable with functionalism" reads as a hard requirement to some people and as begging the question to others, and I suspect a few more on the list are like that.

  And the part I most want: tell me whether some subset of these is jointly unsatisfiable. My hunch is that "gradual replacement preserves me" plus "branching breaks identity" plus "scan-and-destroy doesn't preserve me" can't all stand, because a gradual replacement is decomposable into a bunch of steps that each look like a tiny scan-and-destroy — but argue it rather than assuming I'm right, and if I'm wrong say so. If the list itself turns out to be a result rather than a checklist, say that too.

  Then briefly, a paragraph each and no more, how the main contenders do against the list: psychological continuity views, the biological/animalist view, the Parfit line that identity isn't what matters, and a phenomenal-continuity view. Keep the weight on the criteria though, I'll do my own scoring. Don't give me references or a reading list, I can find those.

  Last line should start with "Verdict:" and name the single requirement that knocks out the most candidates — or, if you think a pair can't be jointly satisfied, name the pair and say which one has to go.
reasoning: |-
  Hmm, the user is in a philosophy of mind seminar focusing on mind uploading and needs to write a paper about personal identity in that context. They want a clear set of desiderata for a theory of survival-through-uploading - essentially what makes a theory good enough for practical reasoning about what happens to them in upload scenarios. They've outlined specific requirements: cases it must handle, distinctions it shouldn't collapse, scientific constraints, and an analysis of negotiability for each requirement. They also want to know if certain requirements create contradictions and a brief evaluation of main theories.

  The cases they want covered are important. The scan-and-destroy scenario tests whether copying alone equals survival - if I'm scanned and then my biological brain is destroyed, do I wake up as the upload? Intuition says no, which is quite strong. Then there's gradual replacement (like Chalmers' fading qualia), which should preserve identity through slow changes - intuition strongly supports continuity here. The branching/fission case with two uploads challenges whether identity can split, with intuition leaning against it. The duplicate case where both biological and upload versions coexist highlights the uniqueness of identity - intuition strongly says they're distinct. The novel handshake upload case is fascinating: a coupled system where biological and digital components work together at different speeds during transition. Key questions here include whether there's a single thinker or multiple, and if the speed mismatch affects identity. Intuition might be divided, making this a good test for theories.

  Important distinctions include identity versus what matters in survival (e.g., Parfit's view that identity isn't crucial, but continuity is), survival versus duplication (being copied isn't the same as surviving), and process versus product (the means of continuity might matter as much as the outcome). These help avoid conceptual confusion.

  For scientific constraints, theories must respect physicalism - no dualism allowed - since mind uploading assumes a physical basis for mind. They should also account for causal continuity in neural processes and avoid violating known physics, like information conservation.

  I need to analyze negotiability for each requirement. The scan-and-destroy intuition against survival is strong but might be negotiable if a theory offers compelling alternatives. Gradual replacement preserving identity seems non-negotiable due to strong intuition. Anti-branching is also strong but potentially negotiable. Anti-duplication is very strong. The handshake case is a wildcard with weaker intuition. Physicalism is a hard constraint, while functionalism compatibility is a soft one that might beg the question.

  The user suspects a contradiction between gradual replacement preservation, anti-branching, and scan-and-destroy not preserving identity. I agree: gradual replacement can be seen as a series of mini scan-and-destroy steps. If each step is identity-preserving, how does the whole process preserve identity while branching doesn't? Theories might resolve this by emphasizing continuity or redefining identity, but it's a real tension. The user is right to flag this.

  For the main theories: psychological continuity views (e.g., Locke) handle gradual replacement and branching but struggle with scan-and-destroy and duplication by denying identity in copying. They might handle handshake via continuity. Biological views (animalism) easily reject all uploads as non-survival but fail on gradual replacement and handshake. Parfit's view separates identity from what matters, accepting duplication as survival-like but struggling to explain scan-and-destroy and handshake phenomenology. Phenomenal continuity views focus on subjective flow, which might handle gradual and handshake cases but face issues with branching and duplication.

  The toughest requirement is likely the combination of gradual replacement preserving identity and scan-and-destroy not preserving it. This forces theories to explain why continuity matters, which might require abandoning strict identity in favor of what matters or redefining survival. So the verdict points to this tension as the major hurdle.
answer: |-
  Here's a comprehensive set of desiderata for a theory of survival-through-uploading, structured as requested:

  **Core Desiderata for a Survival-Through-Uploading Theory:**

  1.  **Handle Scan-and-Destroy:**
      *   **Case:** You are scanned/destructively copied; the original biological brain is immediately destroyed; the upload activates.
      *   **Intuition:** "I" do *not* survive. The upload is a replica, not me. Death occurs.
      *   **Load-Bearing:** Very high. The core intuition that *copying* isn't *moving*.
      *   **Negotiability:** High. Many theories *must* reject this intuition to work (e.g., psychological continuity). But denying it feels deeply counterintuitive to many.

  2.  **Handle Gradual Replacement (Fading/Dancing Qualia):**
      *   **Case:** Biological neurons are replaced one-by-one with functionally identical artificial components over time while consciousness continues uninterrupted.
      *   **Intuition:** "I" survive the process. Continuity of consciousness/function is preserved.
      *   **Load-Bearing:** Extremely high. Directly challenges biological essentialism and underpins functionalist views of mind. Denying it seems to deny the possibility of *any* biological change constituting survival.
      *   **Negotiability:** Very Low. A theory that denies survival here loses significant plausibility for most.

  3.  **Handle Branching/Fission (Two Running Copies):**
      *   **Case:** A non-destructive scan creates two simultaneous uploads, both claiming to be you (or one upload + original biological).
      *   **Intuition:** "I" cannot be *both*. Identity is exclusive; branching breaks it. At best, one inherits identity, or neither does.
      *   **Load-Bearing:** High. Captures the "only one me" intuition. Challenges theories that make identity depend solely on psychological connections.
      *   **Negotiability:** Moderate. Parfitians explicitly reject this intuition (identity doesn't matter, survival does via R-relatedness to both). Others accommodate via "closest continuer" rules.

  4.  **Handle Duplicate Coexisting with Original:**
      *   **Case:** A non-destructive scan creates an upload while the original biological you continues existing.
      *   **Intuition:** The upload is a distinct person, a replica. *You* are still biological. Creating a copy isn't surviving as the copy.
      *   **Load-Bearing:** Very High. Directly follows the Scan-and-Destroy intuition. Reinforces non-branching identity.
      *   **Negotiability:** Low. Denying this makes the theory highly revisionist about identity in ordinary non-branching cases.

  5.  **Handle the "Handshake Upload":**
      *   **Case:** Emulation built first. Biological neurons deleted *only* as the emulation functionally takes over each specific computational role. Systems are causally coupled during transition. Emulation runs 10x faster.
      *   **Intuition Pressure Points:**
          *   *Mid-Transition Identity:* Is there one thinker, two co-conscious thinkers, or a fragmented single thinker?
          *   *Speed Mismatch:* Does the vastly different rate of experience accumulation in the emulation component fracture identity or create a dominant perspective?
      *   **Load-Bearing:** Medium-High (as a stress test). Forces theories to confront *causal coupling*, *functional overlap*, *real-time integration*, and *temporal asynchrony* during identity-critical processes.
      *   **Negotiability:** Medium. Intuitions are less settled, making it a powerful probe for hidden assumptions. A theory saying "speed doesn't matter" must appeal to functional equivalence *despite* temporal disconnect, or define continuity in a way insensitive to local clock rates (e.g., causal connection quality).

  **Essential Distinctions the Theory Must Preserve:**

  1.  **Identity vs. What Matters:** Must not *automatically* equate numerical identity with what provides prudential concern for the future (e.g., Parfit's "R-relation" - psychological connectedness/continuity *with any cause*).
  2.  **Survival vs. Duplication:** Must distinguish *persisting as the same entity* from *being replaced by a qualitatively identical but numerically distinct copy*. (Scan-and-Destroy & Duplicate Coexisting cases test this).
  3.  **Process vs. Product:** Must account for whether the *manner* of continuity (e.g., gradual replacement vs. destructive scan & copy vs. branching) affects the outcome (identity/survival).
  4.  **Continuity vs. Connectedness:** Must handle degrees (Parfit: connectedness is overlapping direct links; continuity is overlapping chains of connectedness) and thresholds.
  5.  **Subjective Perspective vs. Third-Person Description:** Must explain the "from-the-inside" nature of survival claims, not just external behavioral/functional equivalence.

  **Scientific Constraints:**

  1.  **Physicalism/No Vitalism:** Cannot rely on non-physical souls or essences. Must be compatible with the mind arising from physical processes. (Non-negotiable for the upload context).
  2.  **Causal Efficacy:** Must respect that neural processes are causally responsible for cognition and behavior. Any continuity condition must involve appropriate causal chains. (Non-negotiable).
  3.  **Information Conservation (Plausible Constraint):** While not definitively proven at the macro level relevant to minds, a theory implying massive *de novo* information creation/destruction without physical cause during upload processes is suspect. (Moderately negotiable pending physics).

  **Negotiability Assessment:**

  *   **Scan-and-Destroy Intuition (Not Surviving):** Negotiable (though denying it is costly).
  *   **Gradual Replacement Intuition (Surviving):** Minimally negotiable.
  *   **Anti-Branching Intuition:** Negotiable (Parfitians reject it).
  *   **Anti-Duplication Coexistence Intuition:** Minimally negotiable.
  *   **Handshake Intuitions:** Negotiable (under-explored).
  *   **Physicalism/Causal Efficacy:** Non-negotiable for the context.
  *   **Information Conservation:** Soft constraint.
  *   **Functionalism Compatibility:** Not a *core* desideratum. A theory *can* reject functionalism (e.g., Biological View) but must still grapple with the Gradual Replacement and Handshake cases which strongly motivate functionalism. Insisting on functionalism *is* question-begging against biological views.

  **The Tension (You Are Largely Right):**

  The combination "**Gradual Replacement Preserves Identity (GRPI)** + **Branching Breaks Identity (BBI)** + **Scan-and-Destroy Does NOT Preserve Identity (SDNI)**" is extremely difficult to satisfy consistently.

  *   **The Problem:** Gradual replacement *can be decomposed* into a sequence of micro "scan-and-destroy" steps: Scan the state/function of neuron N, destroy neuron N, replace it with a component implementing that function. If GRPI holds, identity survives this sequence. But if each micro-step is *sufficiently similar* to SD (capture state/function, destroy original component, activate replica component), why does the *macro* SD case not preserve identity?
  *   **Resolution Attempts & Costs:**
      *   **Continuity Matters:** Argue that the *continuity* during gradual replacement is essential. Each micro-replacement doesn't break the overall causal chain of consciousness/function. SD breaks it abruptly. *Cost:* Needs a robust, non-arbitrary account of "continuity" that explains why it's identity-conferring for micro-steps but not for the macro-step. Handshake upload challenges this by introducing temporal asynchrony *within* continuity.
      *   **Spatiotemporal Path:** Argue identity requires an unbroken spatiotemporal path for the physical substrate. GRPI violates this if the artificial components aren't "the same stuff" continuously. *Cost:* Directly contradicts GRPI intuition, fails Handshake if coupling isn't enough.
      *   **Deny SDNI:** Accept that SD *is* survival. *Cost:* Violates a very strong intuition.
      *   **Deny BBI:** Accept that branching *is* survival (identity splits or R-relation is what matters). *Cost:* Violates the "only one me" intuition.
  *   **Conclusion:** The tension is real. A theory satisfying all three likely requires either a *sui generis* account of continuity that avoids the decomposition (hard), or subtly redefines one of the intuitions (e.g., SD *does* break continuity in a way micro-replacements don't, or branching *is* survivable but identity is lost). GRPI and SDNI are the hardest core pair to reconcile without sacrificing BBI or adopting a Parfitian stance.

  **Brief Theory Assessment vs. Criteria:**

  1.  **Psychological Continuity (e.g., Locke, Neo-Lockeans):**
      *   *Handles:* Branching (via "closest continuer" or rejects identity), Duplicate Coexisting (rejects identity for upload), often GRPI (if functional continuity preserved).
      *   *Struggles:* Scan-and-Destroy (often *must* say you survive as the upload, violating SDNI). Handshake: Likely sees one continuous mind if functional integration holds; speed mismatch irrelevant to identity (functional equivalence).
      *   *Distinctions:* Collapses identity into psychological continuity (R-relation), struggles to cleanly separate identity and what matters. Survival=Duplication in SD case.

  2.  **Biological/Animalist View:**
      *   *Handles:* Scan-and-Destroy (you die), Duplicate Coexisting (upload is copy), Branching (upload(s) are copies).
      *   *Struggles Severely:* Gradual Replacement (denies survival, violating GRPI). Handshake Upload (likely denies survival entirely or sees fragmented identity; speed irrelevant as em isn't "you").
      *   *Distinctions:* Clearly separates identity (biological organism) from what matters (possibly psychological continuity). Survival ≠ Duplication.

  3.  **Parfitian View (Identity Not What Matters, R-relation Does):**
      *   *Handles:* Scan-and-Destroy (you die, *but* R-related upload provides "what matters" - survival*), Branching (R-related to both branches - survival*), Duplicate Coexisting (R-related to duplicate - survival*), GRPI (R-relation preserved - survival*).
      *   *Struggles:* Explaining the *intuition* of death/loss in SD and Branching. Handshake: Likely sees strong R-relation; speed mismatch irrelevant to R-relation, though subjective experience of mismatch might be odd.
      *   *Distinctions:* Explicitly *collapses* identity and what matters (replacing identity with R-relation). Survival* = Duplication.

  4.  **Phenomenal Continuity/Subjective Perspective View:**
      *   *Handles:* Scan-and-Destroy (subjective stream ends, upload starts new one), Gradual Replacement (subjective stream continues), Duplicate Coexisting (original stream continues, upload starts new stream).
      *   *Struggles:* Branching (only one stream can continue? Or streams split? Lacks clear answer). Handshake: Major challenge – is there one unified subjective perspective spanning biological and emulated components at different speeds? If not, identity is fragmented mid-transition. Speed mismatch likely *does* matter.
      *   *Distinctions:* Focuses intensely on the first-person perspective. Survival = Continuation of *this* specific subjective stream. Survival ≠ Duplication.

  **Verdict:** The requirement that **Gradual Replacement Preserves Identity (GRPI)** combined with the intuition that **Scan-and-Destroy Does NOT Preserve Identity (SDNI)** creates the most fundamental tension, forcing theories into significant revisionism (denying SDNI), compromising the anti-branching intuition (BBI), or relying on an under-specified notion of continuity to differentiate micro from macro replacement. GRPI is the anchor point that makes upload survival plausible, while SDNI is the anchor point against pure copying-as-moving; reconciling them is the core challenge. If a theory sacrifices GRPI, it likely abandons upload survival altogether. If it sacrifices SDNI, it embraces copying-as-moving, forcing a reevaluation of branching and duplication.
