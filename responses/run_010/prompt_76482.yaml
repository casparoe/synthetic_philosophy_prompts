prompt: |-
  Doing my EPQ next year (5000 words, realistically about a term of work) and I've got a half-formed idea about Foucault I want turned into a proper proposal. Basically everyone in my sociology class reaches for the panopticon to explain social media, but I reckon the analogy is doing sneaky work: discipline is supposed to work because you feel watched and start policing yourself, whereas a feed doesn't need you to feel watched at all — no one's actually looking, it's just adjusting what you're shown based on everyone else's behaviour. So my question is whether Foucault's disciplinary framework genuinely covers that, or whether he'd have put it under a seperate heading (I vaguely remember him talking about security as a different kind of mechanism that works on populations and probabilities rather than on individual bodies, but I might be misremembering).

  Could you write the proposal for me: the question stated so it's actually answerable, why the usual takes on both sides don't settle it, what I'd do week by week and why that approach rather than just lining Foucault up against some modern surveillance theorist, what a convincing result would look like, what would count as the project failing, and an honest note on whether it's too big for one term. No references, I'll sort the citations out myself. British English please, my teacher marks spelling.
