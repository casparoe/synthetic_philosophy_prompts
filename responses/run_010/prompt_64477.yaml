answer: |-
  ### Stage One: Brainstorming Candidate Correspondences  
  *(Bad candidates marked with ⚠️; core tension: measure theory's static Ω vs. branching-time's ontological openness)*  

  1. **Branching-Time Structure ↔ Filtered Probability Space**  
     - Histories ≈ Sample paths in Ω (but Ω is fixed, while histories branch ontologically → **⚠️ static sample space kills openness**)  
     - Moments ≈ Stopping times τ (adapts to filtration, but moments are primitive → **⚠️ over-constrains temporal structure**)  
     - Natural Filtration {F_t} ≈ Growing knowledge of history (clean for "settled at t", but F_t is epistemic → **⚠️ confuses settledness with measurability**)  

  2. **Settled Truth ↔ F_t-Measurability**  
     - Pro: "X is settled true at t" ≈ X is F_t-measurable (known at t).  
     - Con: Only tautologies are F_t-measurable for all t? **⚠️ Settledness is metaphysical, F_t-measurability is epistemic → collapses to triviality under stochastic measures**.  

  3. **Future Contingent ↔ Non-Adapted Random Variable**  
     - Pro: "Will A happen?" ≈ RV A not F_t-measurable.  
     - Con: All RVs are defined on Ω, so "A" has a truth value *now* → **⚠️ No ontological indeterminacy in Ω, only ignorance**.  

  4. **Openness ↔ Conditional Probability ∈ (0,1)**  
     - Pro: P(A|F_t) ∈ (0,1) iff undetermined at t.  
     - Con: P(A|F_t) = p is a fact *now* → **⚠️ Measures future uncertainty but not genuine openness (Ω is fixed)**.  

  5. **Thin Red Line (TRL) ↔ Distinguished Measure P***  
     - Pro: Actual history ≈ Path with measure P*.  
     - Con: Under P*, future is determined → **⚠️ TRL implies determinism, contradicting openness**.  

  6. **Supervaluationism ↔ Set of Measures P**  
     - Pro: Quantifying over histories ≈ Quantifying over P∈P.  
     - Con: "True in all histories" ≈ P(A)=1 for all P∈P? **⚠️ Overgenerates necessity (e.g., if P excludes some measures)**.  

  7. **Aristotle's Sea Battle ↔ Event A with P(A|F_t)∈(0,1)**  
     - Pro: "Tomorrow’s battle is contingent" ≈ 0 < P(A|F_0) < 1 today.  
     - Con: A is still determined at t=0 in Ω → **⚠️ Fatalism is mathematically true in (Ω,F,P)**.  

  ---

  ### Stage Two: Refined Translation & Sea-Battle Analysis  
  **Best Mapping (Supervaluationist-Inspired):**  
  - **Histories** ≈ Sample paths ω ∈ Ω.  
  - **Moments** ≈ Filtration {F_t}: time-indexed σ-algebras.  
  - **Settled Truth at t** = F_t-measurability (e.g., "Sea battle has started" is settled at t if measurable w.r.t. F_t).  
  - **Future Contingent** = RV A not F_t-measurable (e.g., "Sea battle tomorrow" is contingent today).  
  - **Openness** = Existence of A s.t. P(A|F_t) ∈ (0,1) for some P.  
  - **TRL Rejected** → Use **supervaluationism**: Quantify over a **set P of measures** (e.g., all measures consistent with current history).  
  - **"Truth simpliciter"** = Truth w.r.t. a specific ω (but ω is fixed! → residual tension).  

  **Aristotle's Sea Battle in Measure Theory:**  
  - Let A = "Sea battle occurs at t=1".  
  - At t=0: A is not F_0-measurable → **future contingent**.  
  - **Aristotle's claim**:  
    - "Either A or ¬A will happen" ≈ P(A ∪ A^c | F_0) = 1 (tautologically true).  
    - "But neither is *now* true" ≈ 0 < P(A|F_0) < 1 under *some* P∈P (openness).  
  - **Fatalist's conclusion** ("A is already true/false at t=0"):  
    - True **iff** A is F_0-measurable (i.e., determined at t=0).  
    - But if A is *not* F_0-measurable, fatalism is **mathematically false** in the model.  
  - **Verdict**: Fatalism is a **straight error** under stochastic measures where A is non-degenerate.  

  **Residue Report** (What Doesn’t Translate Cleanly):  
  1. **Settled Truth as Metaphysical Necessity**  
     - Distortion: F_t-measurability captures *knowability* at t, not *ontological settledness*.  
     - Why: Probability 1 ≠ necessity (e.g., P(A)=1 but A not logically true).  
     - Verdict: **Philosophy exposes a limitation**—measure theory lacks a modal "could not be otherwise".  

  2. **Truth-Value Gaps for Future Contingents**  
     - No Expression: Random variables are total functions on Ω → "A(ω)" is defined for all ω, even if unknown.  
     - Why: Sample space Ω is complete; no "gaps" in classical probability.  
     - Verdict: **Evidence philosophers are onto something**—indeterminacy as lack of truth-value vs. lack of knowledge.  

  3. **Openness of the Future**  
     - Partial Translation: P(A|F_t)∈(0,1) models uncertainty, but Ω is static.  
     - Distortion: All futures "exist" in Ω from the start → no *becoming*.  
     - Verdict: **Limitation of measure theory**—mathematics cannot express temporal emergence without smuggling determinism.  

  ---

  **Epistemic Standing:**  
  - **Overall Confidence**: 85% (The mapping holds *if* we reject TRL and embrace supervaluationism over sets of measures).  
  - **Least Certain Correspondence**: Settled Truth = F_t-Measurability.  
    - **Why**: It reduces metaphysical settledness to epistemic access.  
    - **What Would Settle It**: If we can formalize a **non-classical probability space** where "settled" means "fixed across all possible continuations" (e.g., using non-Archimedean probabilities or causal counterfactuals).  

  **Conclusion**: Your suspicion was correct—**settled truth collapses under stochastic measures** if equated with probability 1. The fatalist’s error is conflating determinism (A is F_t-measurable) with classical logic (A ∨ ¬A). The residue confirms that **philosophers identify real gaps**: measure theory’s static Ω cannot model genuine temporal becoming or truth-value gaps.
