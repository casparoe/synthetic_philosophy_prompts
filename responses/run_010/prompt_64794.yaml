prompt: |-
  I'm running a two-hour session for a school district's behavior team in a couple weeks — about 15 people, mostly counselors and deans, one school resource officer, and the restorative practices coordinator, who's actually read Braithwaite and will call me out if I strawman the reintegrative-shaming idea. Topic is guilt vs shame: which one a moral community should be trying to produce in its members, and whether that's even the sort of thing a community can settle on purpose.

  The problem is they already have the answer. They all sat through a PD a few years back where they were told shame is toxic and guilt is the healthy one — bad act vs bad self, that framing — so anything I say risks landing as confirmation of something they walked in believing. I dont want to hand them the slogan. I want them to leave less sure of it than they arrived, and able to say why.

  So plan the session, don't just explain the material to me. What has to be in place before the distinction is even intelligible to this room, and the order the pieces go in with the dependency reason for each — my guess is I can't touch "which is better" until they've got some grip on the possibility that guilt and shame don't carve out the same territory in every culture's emotional vocabulary, but tell me if that's backwards. The one scenario I should build both hours around, and what it has to have and what it has to leave out to do that job. The misconceptions they'll bring plus the ones they'll form mid-session — shame is just guilt with an audience, guilt always needs an identifiable victim, shame only ever corrodes, the shame-culture/guilt-culture contrast as a clean split between the Greeks and Japan — and exactly where in the sequence each gets headed off, instead of me arguing with it at the end. And a check I can run in the last ten minutes that distinguishes "they got the distinction" from "they liked the story."

  Two things I want your actual call on, because I will get asked. Which of the standard distinctions does the real taxonomic work — act vs self, who's watching, or the action tendency of repair vs hide-and-vanish — and what's the case that should make me pick one as primary rather than treating them as a bundle. And: the district wants this in a handbook next year, so somebody's going to ask whether a community can just choose its dominant moral emotion, or whether that's like trying to pick a language's tense system from the outside. Give me the two or three considerations that would genuinely separate "our preference for guilt over shame tracks something in the emotions themselves" from "it's a local taste we've mistaken for a discovery," and say which one you think holds up.

  Also tell me what to leave out at this level, and which of those I should say out loud that I'm leaving out. No reading list — I'm not assigning anybody anything.
reasoning: |-
  Okay, let's tackle this educator's challenge. They need a two-hour session that destabilizes a simplified "guilt good, shame bad" framework for a team that already believes they know the answer. The goal isn't confirmation but productive uncertainty. 

  First, the misconceptions to dismantle: the act/self dichotomy, audience dependence, repair/hide binaries, and cultural essentialism. These can't be lectured away—they need experiential unraveling. 

  The core scenario must be culturally neutral yet personally relatable: maybe a student cheating where the "victim" is abstract (scholarship committee). This forces examination of guilt without clear harm-doer and shame without spectators. 

  Key sequence dependencies: 
  - Start with differentiating moral emotions (shame/guilt vs anger/fear) through visceral examples before comparing shame/guilt. 
  - Introduce cultural variation early through quick "what's condemnable?" contrasts to prevent false universality. 
  - Scaffold the scenario in layers: first emotional responses, then imagined community reactions, finally repair attempts. 

  For taxonomic priority, the repair/hide action tendency holds most weight. Evidence: shame can be private (no audience), guilt can target identity ("I'm a liar"), but hiding vs repairing behaviorally defines social function. 

  On community choice: emotions aren't arbitrarily selectable like vocabulary. Three anchors: 
  1) Embodied constraints (shame's physical collapse vs guilt's energization) 
  2) Existing community architecture (hierarchies vs individualism) 
  3) Repair infrastructure (rituals for reintegration) 

  Omit neurobiology, protracted cultural analysis, and non-Braithwaite shaming theories—explicitly state these as intentional exclusions due to focus on practical application. 

  The check: Have them design two parallel interventions for the same case—one guilt-focused, one shame-focused—then identify which elements would backfire if misapplied. The output isn't answers but sharper questions.
answer: |-
  Here’s a session plan designed to destabilize oversimplified "guilt=good/shame=bad" assumptions and foster nuanced inquiry. The goal is **productive uncertainty**, not replacement dogma.

  ---

  ### **Core Structure & Rationale**  
  *(Total: 115 min + 5 min buffer)*  

  #### **Phase 1: Undermining Foundations (30 min)**  
  *Goal: Expose the instability of their existing framework.*  
  - **Opening (5 min):** "Today isn’t about confirming what you know. It’s about discovering what we *can’t* settle easily. Your job is to interrogate your certainty."  
  - **Exercise: Emotion Mapping (25 min):**  
    - *Task:* Small groups list **all emotions** triggered when someone violates a school rule (e.g., vandalism). Cluster them: "Self-Focused," "Other-Focused," "Community-Focused."  
    - *Why:* Reveals guilt/shame are embedded in a complex ecosystem (e.g., anger, disgust, pride). Prevents false binaries.  
    - *Dependency:* They can’t analyze guilt/shame without seeing emotions as relational.  

  #### **Phase 2: Cultural Disruption (25 min)**  
  *Goal: Show guilt/shame aren’t universal categories.*  
  - **Scenario: "The Silent Lunch" (15 min):**  
    - *Setup:* A student eats alone after spreading a rumor. No audience sees them. Groups discuss:  
      *"What might this student feel? What would make those feelings change if this happened in...*  
      *(a) a tight-knit rural town, (b) a collectivist diaspora community, (c) an elite private school?"*  
    - *Key Omissions:* No "victim" is identifiable; no authority intervenes. Forces examination of *internalized* community standards.  
  - **Debrief (10 min):** Highlight variations:  
    - Guilt may manifest as somatic pain (e.g., stomachache) in some contexts, not just "I did bad."  
    - Shame might drive silent reparation (e.g., anonymously fixing damage) without hiding.  
    - *Heads off:* "Shame needs an audience," "Guilt requires a victim."  

  #### **Phase 3: Action Tendencies as the Key Distinction (40 min)**  
  *Goal: Shift focus from definitions to consequences.*  
  - **Input (5 min):** Introduce **action tendencies**:  
    - Guilt → **Repair** (confessing, amends).  
    - Shame → **Withdraw/Hide** (avoiding eye contact, quitting teams) *or* **Attack** (deflecting blame).  
  - **Scenario Deep Dive: "The Stolen Phone" (35 min):**  
    - *Facts:* Student A takes Student B’s phone. B’s family can’t afford a replacement.  
    - *Task:* Groups design two interventions:  
      1. **Elicit guilt:** "How would you prompt Student A to *fix* this?"  
      2. **Leverage shame:** "How would you make Student A *feel seen* by peers?"  
    - *Twist:* "What if Student A is your best athlete? What if they’re chronically bullied?"  
    - *Why:* Forces engagement with context. Shame’s "attack" tendency might escalate bullying; guilt might ignore power imbalances.  
    - *Taxonomic Call:* **Action tendency is primary**. Evidence:  
      - Someone can feel guilt about their *core self* ("I’m a thief").  
      - Shame can be solitary (e.g., remembering past acts).  
      - But repair/withdraw *determines communal outcomes*.  

  #### **Phase 4: Can a Community Choose? (15 min)**  
  *Goal: Complicate the idea of emotional engineering.*  
  - **Guided Discussion:**  
    - "What would it take for this district to ‘prefer’ guilt? To ‘prefer’ shame?"  
    - *Considerations:*  
      1. **Social Architecture:** Guilt thrives in systems with clear repair pathways (e.g., restorative circles). Shame dominates where identity is rigid (e.g., "honor" cultures).  
      2. **Power:** Can marginalized students safely *repair*? Or does shame become weaponized?  
      3. **Embodiment:** Emotions aren’t chosen; they’re *habituated* through repeated experience.  
    - *Your Call:* "We can’t ‘pick’ an emotion. But we *can* design systems that make repair viable—which makes guilt *actionable* and shame *tolerable*."  

  #### **Check for Understanding (10 min)**  
  *Goal: Distinguish comprehension from agreement.*  
  - **Exit Task:** "Write:  
    1. One question this session made you ask about ‘guilt good, shame bad.’  
    2. One context where shame *might* serve this community.  
    3. One context where guilt *might* backfire."  
  - *Why:* Tests if they see nuance (e.g., "Shame might deter bullying if peers disapprove; guilt might overwhelm a traumatized student"). If answers are slogans, they missed the point.  

  ---

  ### **What to Leave Out & Why**  
  1. **Neurobiology of shame/guilt.** *Say:* "I’m omitting brain science—not because it’s irrelevant, but because today focuses on social function."  
  2. **Detailed cultural anthropology.** *Say:* "We’re sampling cultural variation to challenge universality—not to stereotype groups."  
  3. **Non-Braithwaite shame theories.** *Say:* "We’re using Braithwaite’s reintegrative framework; other valid models exist but exceed our scope."  

  ### **Handling the Restorative Practices Expert**  
  - If challenged: "Braithwaite’s key insight was that *shaming* isn’t the problem—it’s *disintegration*. Our session asks: When does guilt *reintegrate*? When does shame *disconnect*? Let’s test his theory against our realities."  

  ---

  ### **Why This Works**  
  - **Myths die early:** Phase 1–2 dismantle "audience = shame" and "guilt = private."  
  - **Action > definition:** Focusing on repair/withdraw makes the distinction *practical*, not semantic.  
  - **No easy answers:** The scenarios resist dogma by demanding contextual judgment.  
  - **They leave troubled:** Good. Uncertainty here is pedagogical progress.  

  > "The task is not to map emotions onto a grid, but to ask: What do we unleash when we make someone feel *this*? And who pays the cost?" — Close the session here.
