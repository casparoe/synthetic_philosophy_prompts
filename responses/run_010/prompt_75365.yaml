  Qual paper deadline, decision theory, and I need to commit to a number rather than survey the literature. What's your credence that risk-weighted expected utility (the Buchak / rank-dependent family, where a convex risk function reweights cumulative probabilities instead of states) is the correct theory of individual rational choice under uncertainty — as opposed to plain EU with a curved-enough utility function over outcomes? I'm sitting at about 0.55. My adviser is at 0.15 and wont say much more than "you're letting the experiments do your axioms' work."

  Give me your number plus the decomposition, priced seperately:

  (a) that Allais-style common consequence and common ratio preferences are stable features of rational agency rather than framing or noise artifacts;
  (b) that the right thing to give up is event-wise dominance in its strong form, rather than ordering/completeness, or nothing at all;
  (c) that Friedman–Savage style curvature of u over wealth can't absorb the phenomena once you let outcomes be individuated properly — background wealth, describing the act as a one-shot rather than a myopic slice of a sequence;
  (d) that the risk-weighted agent survives the diachronic stuff: money pumps, resolute vs. myopic choice, and the long-run argument that a risk-weighting loses out over repeated gambles;
  (e) that "the correct theory of rational choice" is a well-posed single target rather than a pluralist question where EU and REU are each right in their own domain.

  Say how you combine those terms (independent conjuncts? a conditional chain? something else), give the total, then tell me which term my 0.55 and my adviser's 0.15 are most likely to be split over, and which single argument or result would move your number furthest. American English please.
