prompt: |-
  I run a graduate reading group on self-locating belief, and roughly half the room has met the Sleeping Beauty problem only through summaries. I want a diagnostic instrument that sorts members by what they would actually do inside the experiment, not by which camp they think they belong to. The deliverable is a decision tree, together with the logical space it is drawn from and a scoring key.

  Open with a single sentence naming the one fork on which, in your judgement, the whole dispute turns — the question whose answer determines everything else. Then give the instrument. No preamble, no restatement of this request.

  **Part A. The space first, the tree second.** Choose two or three axes that generate the debate rather than summarise it — candidates include what an awakening is supposed to tell her, whether information of that kind counts as evidence at all, which updating rule is licensed once she has it, and whether her Sunday-night planning perspective must agree with her waking perspective. Enumerate the combinations of answers those axes permit. Then say, for each combination, whether it is occupied by a live position. For every empty cell, diagnose why it is empty: is it incoherent, so that the answers jointly entail a contradiction; is it merely unattractive, so that the view is consistent but nobody wants its consequences; or is it simply unexplored, so that nothing rules it out and no one has claimed it? Say which of those three it is in each case, and do not let the diagnosis be vaguer than that.

  **Part B. The tree.** Between six and eight nodes. Every node must be phrased as a wager with money on the table: a stated price, a stated payoff, a stated moment at which it settles, and a choice she can accept or refuse. The words belief, credence, probability and degree of confidence may not appear in any node. Each node must be answerable by someone who has never heard of the problem, and each must be a genuine fork on which at least two of the leaves in Part D disagree — no node may be a question on which every position gives the same answer.

  **Part C. Cases the tree must run on.** At least one node must be drawn from each of the following, and you may not collapse two of them into one question, since positions come apart differently on each:

  1. The standard procedure, with a single bet placed before the experiment and settled once when the experiment ends.
  2. The standard procedure, with an identical bet offered separately at every awakening and settled separately each time.
  3. A generalised version in which the losing branch produces many awakenings rather than two — a hundred, say — and the winning branch produces one.
  4. A version in which, on one awakening only, the experimenters tell her which day it is.
  5. A version in which she may, on Sunday, commit her future amnesiac selves to a policy she cannot revise.

  **Part D. Leaves.** Each leaf carries the standard label if one exists and if you are confident of it — thirder, halfer, the doubled version of halving, the hybrid that accepts some commitments from each camp, the view that no unique answer is licensed, the view that both answers are correct relative to different betting arrangements, and the answer that drops out if the experiment is read as a branching-universe case rather than a single-world one. Attach a proponent's name only where you are sure of the attribution; otherwise describe the view without naming anyone, and say that you are doing so. For each leaf give one sentence on the commitment its defenders find most awkward, and one sentence on what that leaf says about each of the five cases in Part C.

  **Part E. What the tree cannot separate.** Flag every pair of leaves that your nodes leave indistinguishable, and for each pair say whether some further wager would separate them — and if so, state it — or whether they are indistinguishable in principle given what the experiment discloses. Do not paper over these.

  **Part F. Scoring key.** Close the instrument with a compact table: for each leaf, the string of answers to your nodes that lands on it, so that a reader can be scored mechanically.

  **Part G. Where you are most likely wrong.** Say which fork you think is drawn incorrectly, which argument or consideration would make you redraw it, and which leaf you would occupy if you were so persuaded. Also say where your list of empty cells is likelier to reflect a failure of imagination than a discovery, and name one combination you dismissed that a determined opponent could plausibly defend.

  No bibliography, no reading list, no citations. Keep the whole thing to roughly 1,600 words, with the tree as an indented outline or numbered nodes.
reasoning: |-
  Hmm, this is a highly sophisticated request for a diagnostic tool on Sleeping Beauty beliefs. The user runs a graduate reading group and needs an instrument that bypasses theoretical allegiances to reveal actual intuitive responses. They want a decision tree based on concrete wagers, mapped against logical possibilities in the debate.

  The core challenge is identifying the fundamental fork. I think it's whether awakenings provide *new indexical information* - that's the hinge the entire dispute turns on. Thirders say yes, halfers say no, and hybrids split the difference. This determines how Beauty updates her probabilities upon waking.

  For Part A's logical space, I'll use three axes: (1) Whether awakening provides evidence (yes/no/mixed), (2) How to update upon awakening (Bayesian/conditionalization/rejection), and (3) Whether Sunday and waking perspectives must agree (yes/no). The coherent positions are: 
  - Thirder (evidence+Bayesian+perspective-disagreement) 
  - Halfer (no-evidence+conditionalization+agreement) 
  - Double-halfer (no-evidence+rejection+agreement) 
  - Hybrid (mixed+conditionalization+agreement)
  The unexplored combinations are either inconsistent (like claiming evidence but refusing to update) or lead to absurd betting behavior nobody defends.

  For Part B's wagers, I need 6-8 nodes covering all five required cases. Key constraints: 
  - No probability jargon, only concrete payoffs 
  - Each must split at least two positions 
  - Cover: single/iterated bets, high-awakening variants, day-revelation, and pre-commitment
  For example: "On awakening, Beauty can pay $15 for a ticket paying $20 if heads" tests immediate betting behavior.

  Part C cases must each appear distinctly. The 100-awakenings variant particularly stresses generalization principles, while day-revelation tests indexical learning.

  Part D leaves will include standard labels where possible. Thirders struggle with no-new-information intuitions; halfers with iterated bets. Each position's response to the five cases must be explicitly stated.

  For Part E, I note that some hybrids might be indistinguishable from halfers on certain bets - that's unavoidable but should be flagged. A new wager about retrospective betting could separate them.

  Part F needs a crisp scoring table matching answer strings to positions.

  Finally for Part G, I'm least confident about the "perspective agreement" axis - if Beauty can consistently plan to disagree with her future selves, it might enable unexplored positions. I'd personally land in the thirder leaf based on Dutch book arguments.

  The whole response must stay under 1600 words with no citations, focusing purely on the diagnostic structure.
answer: |-
  ### The Fundamental Fork: Does awakening provide new indexical information?

  **PART A: LOGICAL SPACE**  
  *Axes:*  
  1.  **Evidence Status:** Does awakening provide Beauty with new *relevant* information? (Yes / No / Mixed)  
  2.  **Update Rule:** How should Beauty update her credence upon awakening? (Full Bayesian Update / Conditionalization on Indisputable Facts Only / Reject Update Requirement)  
  3.  **Perspective Agreement:** Must Beauty's Sunday planning perspective yield the same optimal decisions as her waking perspective? (Yes / No)

  *Combinations & Diagnoses:*  

  | Ev. Status | Update Rule       | Persp. Agree | Occupied? | Diagnosis (Why Empty)                     |
  | :--------- | :---------------- | :----------- | :-------- | :---------------------------------------- |
  | **Yes**    | **Full Bayesian** | **No**       | **Yes**   | *Occupied: Thirder*                       |
  | **Yes**    | **Full Bayesian** | **Yes**      | No        | *Incoherent:* Sunday plan (avoid certain bets) contradicts waking action (accept bets). |
  | **Yes**    | **Cond. Facts**   | **No**       | No        | *Unattractive:* Claims new information exists but forbids using it, leading to incoherent betting (e.g., ignores own existence). |
  | **Yes**    | **Cond. Facts**   | **Yes**      | No        | *Incoherent:* As above, plus forces contradiction between perspectives. |
  | **Yes**    | **Reject Update** | **Any**      | No        | *Incoherent:* Acknowledges new information but refuses to update, violating rationality norms. |
  | **No**     | **Full Bayesian** | **Any**      | No        | *Incoherent:* No new information makes Bayesian update undefined/vacuous. |
  | **No**     | **Cond. Facts**   | **Yes**      | **Yes**   | *Occupied: Halfer/Double-Halfer*          |
  | **No**     | **Cond. Facts**   | **No**       | No        | *Unexplored:* Consistent? But denies new info yet allows perspective disagreement without justification. |
  | **No**     | **Reject Update** | **Yes**      | **Yes**   | *Occupied: Double-Halfer*                 |
  | **No**     | **Reject Update** | **No**       | No        | *Unattractive:* Denies new info and update need, yet allows waking self to contradict Sunday self arbitrarily. |
  | **Mixed**  | **Full Bayesian** | **Any**      | No        | *Incoherent:* "Mixed" information undefined for precise Bayesian update. |
  | **Mixed**  | **Cond. Facts**   | **Yes**      | **Yes**   | *Occupied: Hybrid*                        |
  | **Mixed**  | **Cond. Facts**   | **No**       | No        | *Unexplored:* Consistent? But rationale for perspective disagreement unclear. |
  | **Mixed**  | **Reject Update** | **Any**      | No        | *Incoherent:* Acknowledges partial information but refuses to use it. |

  **PART B: DECISION TREE (Wagers Only)**  
  *Cases Covered: (1) Standard/Single, (2) Standard/Iterated, (3) Many Awakenings, (4) Day Revealed, (5) Precommitment*

  1.  **Sunday Offer (Case 1):** On Sunday, Beauty is offered a ticket for $50. If the coin lands Heads, it pays $100 on Wednesday. If Tails, it pays nothing. Should she buy it?
  2.  **Awakening Offer - Single Instance (Case 1 & 2):** On an awakening, Beauty is offered a ticket for $15. It pays $20 if the coin landed Heads *on this particular awakening only*. Payment occurs Wednesday. Should she buy it *this time*?
  3.  **Awakening Offer - Iterated (Case 2):** On an awakening, Beauty is offered a ticket for $15. It pays $20 if the coin landed Heads, *and this offer is made identically on every awakening*. Each ticket settles independently on Wednesday. Should she buy it *this time*?
  4.  **Many Tails Awakenings Bet (Case 3):** In a variant with 1 Heads awakening and 100 Tails awakenings, on an awakening, Beauty is offered a ticket for $1. It pays $X if the coin landed Heads (settled Wednesday). What is the minimum $X where she buys it?
  5.  **Day Revelation Bet (Case 4):** On an awakening where she is *told it is Monday*, Beauty is offered a ticket for $60. It pays $100 if the coin landed Heads (settled Wednesday). Should she buy it?
  6.  **Precommitment to Monday Bet (Case 5):** On Sunday, Beauty can precommit her future amnesiac selves to a policy: "On Monday awakenings, buy a ticket costing $Y that pays $100 if Heads (settled Wednesday)." What is the maximum $Y she precommits to pay?
  7.  **Precommitment to Refuse Bet (Case 5):** On Sunday, Beauty can precommit her future amnesiac selves to *refuse* all Awakening Offers (like Node 2) regardless of price. Does she make this precommitment? (Yes/No)

  **PART D: LEAVES**  
  1.  **Thirder (e.g., Elga):**  
      *   *Awkward Commitment:* Must accept that being informed it's Monday drastically changes her credence in Heads (from 1/3 to 1/2), despite learning no "new" factual world-state.  
      *   *Cases:* (1) Reject $50 ticket. (2) Accept $15/$20 ticket. (3) Min $X = ~$33.33. (4) Accept $60/$100 ticket. (5) Precommit max $Y = $50. (6) No precommitment to refuse.
  2.  **Halfer (e.g., Lewis):**  
      *   *Awkward Commitment:* Must accept that in the iterated bet (Node 3), buying each ticket leads to a sure net loss if Tails occurs, despite each seeming rational individually.  
      *   *Cases:* (1) Accept $50 ticket. (2) Reject $15/$20 ticket. (3) Min $X = $50. (4) Accept $60/$100 ticket. (5) Precommit max $Y = $50. (6) Precommit to refuse? (Ambiguous, often No).
  3.  **Double-Halfer (e.g., Meacham):**  
      *   *Awkward Commitment:* Must maintain credence 1/2 *even upon learning it is Monday*, contradicting conditional probability.  
      *   *Cases:* (1) Accept $50 ticket. (2) Reject $15/$20 ticket. (3) Min $X = $50. (4) **Reject** $60/$100 ticket. (5) Precommit max $Y = $50. (6) Precommit to refuse? (Often Yes to avoid Node 2 loss).
  4.  **Hybrid (e.g., Dorr/Coherent Conditionalization - Described, not named):**  
      *   *Awkward Commitment:* Credence in Heads is 1/2 upon awakening *and* upon learning it's Monday, but treats awakening as providing "de se" information affecting betting quotients differently than credence.  
      *   *Cases:* (1) Accept $50 ticket. (2) **Reject** $15/$20 ticket (treats as "centered" bet). (3) Min $X = $50. (4) Accept $60/$100 ticket. (5) Precommit max $Y = $50. (6) Precommit to refuse? (Often Yes to avoid Node 2 loss).
  5.  **No Unique Answer / Contextual (e.g., Bostrom - Described):**  
      *   *Awkward Commitment:* Denies there's a single correct "credence" for Beauty; the right betting answer depends on how the bet is indexed/framed.  
      *   *Cases:* (1) Ambiguous/Depends. (2) Accept $15/$20 (indexed to awakening). (3) Min $X = ~$33.33 (indexed to awakening). (4) Accept $60/$100 (indexed to world/epoch). (5) Max $Y = $50 (indexed to world/epoch). (6) No precommitment (avoids forcing one frame).

  **PART E: INDISTINGUISHABLE PAIRS**  
  *   **Halfer & Hybrid on Nodes 1, 3, 4, 5, 7:** Both reject Node 2, accept Node 1/$50, want $50 for Node 3/X, accept Node 4/$60/$100, precommit $50 for Node 5/Y. Distinguish via **Node 6 (Precommit to Refuse Bet):** Halfer often sees no need (No), Hybrid sees need to avoid Node 2 (Yes). *Further wager:* "On awakening, pay $1 for $2 if *this is a Monday awakening* (settled Wednesday)." Hybrid rejects (credence Mon=1), Halfer accepts (credence Mon=3/4? Or rejects based on risk? Ambiguity remains).
  *   **Double-Halfer & Hybrid on Nodes 1, 2, 3, 5:** Both reject Node 2, accept Node 1/$50, want $50 for Node 3/X, precommit $50 for Node 5/Y. Distinguish via **Node 4 (Day Revelation Bet):** Double-Halfer *rejects* $60/$100, Hybrid *accepts* it. Also via **Node 6:** Both may say Yes, but Hybrid's reason differs (avoiding centered loss vs. maintaining Sunday credence).
  *   **Thirder & No Unique on Node 2, 3, 4:** Both accept Node 2/$15/$20, want ~$33 for Node 3/X, accept Node 4/$60/$100. Distinguish via **Node 1 (Sunday Bet):** Thirder rejects $50/$100, No Unique may accept/reject depending on framing (often rejects). Also via **Node 5 (Precommit Monday):** Thirder commits $Y=$50, No Unique commits $Y=$50 (framed as world-bet). *Further wager:* *"Sunday:* Precommit to pay $Z *on every awakening* for $100 if Heads (settled once Wed)." Thirder rejects (expected loss), No Unique might accept if Z<~$33.33 (frames cost per awakening).

  **PART F: SCORING KEY**  
  *Answers: (Node1: Buy?, Node2: Buy?, Node3: Min $X, Node4: Buy?, Node5: Max $Y, Node6: Precommit Refuse?, Node7: Buy?)*  

  | Leaf                  | Answer Sequence                                  |
  | :-------------------- | :----------------------------------------------- |
  | **Thirder**           | No, Yes, ~33, Yes, 50, No, Yes                   |
  | **Halfer**            | Yes, No, 50, Yes, 50, No, Yes                    |
  | **Double-Halfer**     | Yes, No, 50, **No**, 50, **Yes**, Yes            |
  | **Hybrid**            | Yes, **No**, 50, Yes, 50, **Yes**, Yes           |
  | **No Unique Answer**  | **(No)**, Yes, ~33, Yes, 50, **No**, **(Yes)**   |
  *(Parentheses indicate common but not universal answers for 'No Unique')*

  **PART G: WEAKEST LINKS**  
  *   **Likely Incorrect Fork:** Node 4 (Day Revelation Bet). The argument that Double-Halfers *must* reject it relies heavily on standard conditionalization (`P(Heads|Monday) = P(Heads & Monday)/P(Monday)`). A determined Double-Halfer could reject this conditionalization rule for indexical contexts or define "credence" strictly as Sunday's expectation, making Node 4 acceptable to them ($60/$100 is positive Sunday EV). If persuaded, I'd move to a modified Double-Halfer leaf or an unexplored cell (No Evidence / Cond. Facts / No Agreement?).
  *   **Failure of Imagination in Empty Cells:** The **Mixed Evidence / Conditional Facts / No Agreement** cell. It's dismissed as unexplored/unmotivated. A determined opponent could argue awakening *does* provide indexical information ("I am awake now"), but its *only* rational use is for certain conditional bets (like Node 5/Y), not for updating credence in Heads directly, *and* that Sunday Beauty rationally anticipates disagreeing with her future selves on indexical bets. This might yield Halfer answers on Node 1/3/4/5 but Thirder-like acceptance of Node 2 (if indexed properly).
  *   **My Leaf:** If forced into the experiment, the Dutch book vulnerability for Halfers on iterated bets (Node 3) pushes me to **Thirder**.
