answer: |-
  ## The Night Before Platonia

  **Setting:** A dimly lit common room in the dormitory of the summer institute. Comfortable chairs, scattered papers. Late evening.

  **Characters:**
  *   **YAEL:** Early 30s, intense focus, speaks with conviction but listens intently.
  *   **CALLUM:** Mid-30s, calm demeanor, methodical, slightly weary.

  **(The scene opens with YAEL pacing near a window. CALLUM sits in an armchair, staring at a blank piece of paper. The tension is palpable, though unspoken.)**

  **CALLUM:** (Without looking up) You couldn’t sleep either, I see.

  **YAEL:** (Stops pacing) Sleep? With that letter burning a hole in my desk? It’s absurd. It’s elegant. It’s… maddening. We’re supposed to pretend we haven’t all read Kavka on symmetric coordination problems. Pretend we don’t know the canonical solution.

  **CALLUM:** The letter *tells* us we’ve all read it. Explicitly. That’s the unusual twist. No room for doubt about common knowledge of the analysis or the prescription. It hands us the premise superrationality usually needs to assume.

  **YAEL:** Precisely! So why the struggle? The solution is transparent. We randomize. Each mails the card with probability one in twenty. Exactly one person wins with probability maximized. The calculation is trivial. (She grabs a notebook and pen from a nearby table, sits opposite Callum) Look: Probability I mail: *p*. Probability any *specific* other person mails: assume also *p*, by symmetry. Probability I win? Only if I mail *and* no one else does. So: *p * (1-p)^19*. Now, we maximize that expression over *p*. Take the derivative, set to zero… we get *p = 1/20*. Plug back in: Probability *I* win is *(1/20) * (19/20)^19*. But the *overall* probability *anyone* wins? That’s twenty times the probability *one specific person* wins, since only one can win: 20 * [(1/20) * (19/20)^19] = (19/20)^19*. Roughly… 37.7% chance someone gets rich.

  **CALLUM:** (Nods slowly) The arithmetic is impeccable, Yael. I don’t dispute the calculation of the maximizing probability given the symmetry assumption. Nor the overall success probability. It’s optimal… *if* everyone plays that randomized strategy. The prescription is mathematically sound *as a coordination device*, assuming universal adoption. But that’s my first point of fracture. The letter tells us we’ve all *read* the analysis. Not that we’ve all *accepted* it as binding. Or that we all interpret "reason alike" identically.

  **YAEL:** But Callum, that’s the core! We *do* reason alike. We’ve had the same training, we’re looking at the same problem statement, the same background literature. There’s only one competent way to run this argument under perfect symmetry. My deliberation isn’t happening in a vacuum. It’s a token of a type – the type being “decision theorist reasoning under these exact symmetric conditions.” The type output is determined: randomize with p=1/20. Therefore, my token output *is* that output. It’s not causal magic; it’s recognizing that logic, applied competently to identical premises, yields identical conclusions. To think otherwise is to pretend my brain operates by different laws than the other nineteen. It doesn’t.

  **CALLUM:** Let me grant, for argument’s sake, that perfect reasoning symmetry *implies* identical action – that we all *would* end up doing the same thing. But *what* thing? Your argument assumes the prescription *is* the unique output of competent reasoning. But is it? Consider this: Suppose, hypothetically, I had reason to believe all nineteen others were devout superrationalists like you, committed to mailing with probability 1/20. What should *I* do? Not randomize.

  **YAEL:** (Frowns) Go on.

  **CALLUM:** If I believe the other nineteen each mail with p=1/20, the probability that *any specific one* mails is low. Crucially, the probability that *no one else* mails is (19/20)^19 – that same ~37.7% we calculated for overall success. Now, if I mail *with certainty*, my expected payoff is: $10 million * Probability(no one else mails) = $10M * (19/20)^19 ≈ $3.77 million. Compare that to my expected payoff if I also randomize with p=1/20: $10M * [ (1/20) * (19/20)^19 ] ≈ $10M * 0.0189 ≈ $189,000. Mailing with certainty, *if others randomize*, gives me nearly twenty times the expected value. The asymmetry is stark. Why would I leave $3.6 million on the table?

  **YAEL:** (Leans back, steeples fingers) Because you *can’t* simultaneously believe they will randomize *and* choose to mail with certainty. That’s the inconsistency! If you truly believe they are superrationalists reasoning identically to you, then your own reasoning *must* lead you to randomize. Choosing to mail with certainty proves you *don’t* believe they are reasoning identically to you, or that you aren’t reasoning identically yourself. You’re smuggling in a causal separation – “*they* will do X, therefore *I* should do Y” – that the symmetry forbids. My act isn’t chosen *given* theirs; our acts are jointly determined by the shared reasoning process. Your calculation only looks tempting if you illegitimately step outside the symmetric frame.

  **CALLUM:** But the symmetric frame *is* the assumption. You insist identical reasoning *forces* identical action. Fine. What does it force? Does it force randomization, or does it force defection? Your prescription says randomization. My calculation shows defection dominates if others randomize. If reasoning is identical, and they see the same dominance, wouldn’t they defect too? But then *everyone* mails with certainty, and we all get nothing! The symmetric solution seems unstable under its own logic. It prescribes randomization, but simultaneously shows that deviating *from* randomization is beneficial *if* others follow the prescription. How can the output of identical reasoning be a strategy vulnerable to exploitation by itself?

  **YAEL:** It’s not vulnerable because the defection strategy *isn’t* the output of the symmetric reasoning process! The dominance only appears if you artificially fix the others' strategies while varying your own. Superrationality doesn’t allow that separation. We don’t *condition* on the others' acts; we *deduce* what the common act must be. The only strategy consistent with the premise that all reason identically *and* seek to maximize their expected payoff under that premise *is* the randomized strategy. Any other choice – mailing for sure, or not mailing – involves assuming you are special, or that others are different, which contradicts the symmetry. The dominance calculation is a phantom; it relies on a counterfactual (“if they randomize”) that cannot coherently hold within the symmetric perspective.

  **CALLUM:** You call it a phantom, but it feels very real from where I sit. It points to a tension. Let me probe another seam. The symmetry assumption. The letter guarantees we all *reason* alike about the *problem*. It says nothing about our *valuations*. We all get the same letter offering ten million dollars. But is ten million dollars worth the *same* to each of us? Does it have identical marginal utility? Professor Alvares just inherited a fortune; ten million might be pocket change. Anna Petrov is drowning in medical debt; it would be life-altering. The superrational derivation *assumes* symmetry of payoffs – that maximizing the probability *I* win is isomorphic for everyone. But if utilities differ, the identical reasoning might *not* lead to identical randomization probabilities. Someone for whom ten million is trivial might rationally set *p* near zero. Someone desperate might bias *p* higher. The symmetric Nash equilibrium calculation breaks down without symmetric payoffs. How does superrationality handle that?

  **YAEL:** (Pauses, genuinely considering) That’s… a fair point, Callum. A substantive one. The canonical analysis *does* assume symmetric linear utilities. The letter doesn’t guarantee that. So, strictly speaking, perfect reasoning symmetry only implies we all run the *same algorithm* on our *individual* utility functions. If utilities differ, the prescribed *p* could differ. The beautiful, unique *p=1/20* evaporates.

  **CALLUM:** Exactly. So even granting your core premise, the prescription isn’t necessarily universal.

  **YAEL:** But here’s the counter. First, the letter *emphasizes* we’ve all read the standard analysis, which *does* assume symmetric linear utility. It primes us for that model. Second, and more importantly, even with differing utilities, the superrational logic applies *within the model we adopt*. If we all *believe* the others are using the symmetric linear model – which the letter strongly suggests we should, given its explicit reference to the “standard analysis” – then we should all *act as if* utilities are symmetric. Because that’s the model we are mutually attributing to each other. Deviating based on my private valuation would require me to assume my utility function isn’t part of the common knowledge or that others aren’t modeling it correctly, which again breaks the symmetry of reasoning. The safest, most consistent course, given the letter’s framing, is to adopt the symmetric model *as* the common ground and randomize accordingly. It’s robust against uncertainty about private valuations precisely because it assumes they are irrelevant to the coordination logic established by the letter.

  **CALLUM:** Hmm. You’re arguing that the *shared understanding of the problem framing*, reinforced by the letter, overrides potential private differences? That we should act *as if* utilities are symmetric because that’s the framework we’ve mutually acknowledged?

  **YAEL:** Precisely. The symmetry of the *reasoning context* dictates the symmetry of the *solution concept*. Private valuations are noise the shared framework filters out. To do otherwise introduces an asymmetry the problem statement explicitly denies us.

  **CALLUM:** (Sighs) I see the internal consistency. I admire it, even. But my fundamental unease remains. We agree on all the empirical facts: twenty recipients, identical letters, common knowledge of the problem and its standard analysis. We agree on the arithmetic: *p=1/20* maximizes individual win probability under symmetric randomization, overall success is ~37.7%, and mailing for sure yields ~$3.77M expected *if* others randomize. We agree the letter doesn't guarantee symmetric valuations but that the framing pushes us towards acting as if they are. Yet…

  **YAEL:** Yet we disagree on the logic of choice itself.

  **CALLUM:** Yes. You see the decision as the output of a single, shared computation. Identity of reasoning *constitutes* identity of action. The choice is discovered, not made freely in the moment, conditional on others. It’s global.

  **YAEL:** And you?

  **CALLUM:** I see twenty individual computations, causally isolated, however similar. My choice is a free variable. The symmetry gives me evidence – strong evidence! – about what the others *will* do. I might rationally choose *p=1/20* based on that evidence, betting on coordination. But I might also weigh the evidence and see the huge incentive to mail if I believe others are randomizing. The symmetry tells me *they* see that incentive too… which makes me doubt they *will* randomize… leading me back to wanting to randomize. It’s a loop. My CDT framework forces me to *fix* my belief about others (based on the evidence symmetry provides) and *then* choose my action. But *which* belief to fix? The belief that they follow the prescription? Or the belief that they see the incentive to defect? Symmetry alone doesn’t resolve *that* ambiguity within CDT. It’s messy. But it feels honest. I choose based on my best guess about *their* choices, derived from the evidence, treating my choice as independent. You choose by dissolving the independence into a single logical outcome. Your way is cleaner. Mine feels… agent-centric.

  **YAEL:** And mine feels like the only way to avoid self-defeating loops and honor the radical symmetry the problem presents. We both see the numbers. We both see the structure. We both understand the risks. But we model the agency within that structure differently. You see twenty choosers. I see one choice, replicated.

  **CALLUM:** (Looks at his watch) Almost midnight. The cards are due at noon. We’ve argued the principle to the bone. The letter forbids… well, you know.

  **YAEL:** (Stands up, a faint, strained smile) Indeed. No collusion. No disclosure. Only independent choice. Based on… reasoned principles. However divergent those principles might be in the end.

  **CALLUM:** (Also stands) Good luck, Yael. With your… computation.

  **YAEL:** And with yours, Callum. May the logic… whichever it is… hold.

  **(They exchange a look heavy with unspoken decisions and the weight of ten million dollars hanging in the balance. YAEL turns and walks out quickly. CALLUM remains for a moment, picks up the blank piece of paper, folds it neatly, and puts it in his pocket before leaving the room, turning off the light.)**

  **(FADE OUT)**
