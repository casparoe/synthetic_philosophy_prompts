prompt: |-
  I write novels for a living, and I have come to distrust how confidently I judge my characters' relations to work and to rest. Here are the verdicts I keep arriving at; I should like to know what principle, if any, they add up to.

  The man who works eighty hours a week at a trade he despises in order to pay for his mother's care: admirable, without qualification.

  The woman who works the same hours to pay for her children's private schooling, the local schools being perfectly adequate: not admirable — I find I want to write her as mistaken about her own life.

  The clerk in Tokyo who collapses at his desk and dies, and whose firm issues a statement praising his devotion: the firm is culpable and the man pitiable rather than admirable, though I cannot write him as simply a victim, since in some sense he chose it.

  The surgeon who works himself to death across the course of an epidemic: here I want the reader to admire the excess itself. This is the pair I cannot reconcile with the one above; the hours and the outcome are close to identical.

  The woman of independent means who devotes her life to scholarship she never publishes: enviable, and not wasteful.

  The salaried employee who has automated his post down to four honest hours a week, says nothing, and continues to draw his full pay: a cheat, though he delivers everything the job exists to deliver. The freelancer who bills by the result and works the same four hours is, in the same draft, a hero.

  My own tentative principle is that work is good when it is necessary and leisure good when it has been earned; I can see at once that the unpublished scholar breaks it and the automated clerk does not. Give me a principle, or a small set of rival candidates, precise enough to be tested: state which clause is doing the work in each case, say plainly which of my verdicts the principle cannot keep, and tell me what it implies for two cases I have not yet written — the small-town businessman whose sense of a calling will not let him retire at seventy, and the civil servant who works his thirty-five hours and insists, as a matter of principle, that no one may reach him after six in the evening. If the principle must choose between treating work as an instrument for good ends and treating it as an activity with standards of its own, I want to know which way it goes, and what that will cost me in the drafts.
reasoning: |-
  Okay, the user is a novelist struggling with how to judge their characters' relationships to work and rest. They've listed several scenarios with their own verdicts and are looking for a unifying principle. Let me start by understanding each case they mentioned.

  First, the man working 80 hours at a despised job for his mother's care: admirable. Then the woman doing the same for her kids' private schooling when public schools are adequate: not admirable. The Tokyo clerk who dies from overwork: pitiable, the firm culpable. The surgeon dying during an epidemic: admirable excess. The scholar with unpublished work: enviable. The salaried employee automating his job to 4 hours: a cheat, but the freelancer doing the same is a hero.

  Their tentative principle is work good when necessary, leisure good when earned. But the scholar breaks this since her work isn't necessary, and the automated clerk fits but is seen as a cheat. So that principle doesn't hold.

  Now, I need to find a better principle. The key might be in the purpose and autonomy. The admirable cases (mother's care, surgeon, scholar) involve personal commitment or moral duty. The non-admirable ones (private school, clerk) lack autonomy or have misaligned purposes. The freelancer vs. salaried employee: autonomy in how work is structured matters. Freelancer sets their own terms, salaried employee deceives the system.

  Also, the surgeon and clerk both die from overwork, but surgeon is seen as admirable because of the context—epidemic, saving lives. The clerk's work lacks that higher purpose. So the principle might involve alignment of work with intrinsic values or greater good.

  For the new cases: the small-town businessman who won't retire. If his calling aligns with community service, admirable. If it's just ego, not. The civil servant sticking to 35 hours: if protecting work-life balance as a principle, admirable; if laziness, not. Autonomy and purpose again.

  Need a principle that combines autonomy, purpose, and alignment with personal or societal values. Maybe "work is justified when it aligns with freely chosen values or duties." Then, for leisure, it's about whether it's chosen or imposed. The scholar's work is freely chosen, so enviable. The automated employee isn't autonomous in the same way—deceiving the employer.

  Testing against the surgeon: freely chosen duty during crisis, admirable. Clerk: perhaps coerced by work culture, not autonomous, pitiable. Woman working for private school: misaligned values, not necessary, so mistaken. Mother's care: necessary and aligned with duty.

  The civil servant case: sticking to hours as a principle could be seen as valuing personal time, which is a legitimate choice if aligned with his values. The businessman: calling could be aligned or not.

  Possible candidates: 1. Autonomy and Value Alignment. 2. Necessity and Contribution. But the scholar isn't necessary, so maybe autonomy is stronger.

  Refining the principle: "Admiration depends on alignment with authentic values (freely chosen or deeply held duties) and contributes to genuine needs (personal or communal)." The surgeon contributes to communal need; the mother's care to personal duty. The scholar's work, while not published, fulfills a personal intellectual need, so enviable. The freelancer's efficiency aligns with autonomy and delivering value, while the salaried employee deceives, lacking transparency.

  For the businessman: if his calling serves the community, admirable. If not, maybe not. Civil servant: upholding work-life balance as a value is admirable if it's a conscious choice against exploitation.

  What about the cost? If the principle values autonomy and purpose, it might conflict with societal norms. For example, the civil servant refusing overtime might be seen negatively by others, but the principle admires his stance. The automated employee is a cheat because he lacks transparency, not just efficiency.

  Need to check all cases. The Tokyo clerk: if he chose freely, but the work culture coerces, so not autonomous. The surgeon chooses freely in a crisis. So autonomy is key.

  Final principle: Work is admirable when autonomously aligned with authentic values or duties; leisure is enviable when chosen consciously. The scholar's work is autonomous, so enviable. The automated employee lacks autonomy in deception. The civil servant's leisure is chosen as a principle, admirable. Businessman's work depends on whether it's authentic calling or fear of irrelevance.

  Cases that don't fit: maybe the woman for private schooling. If she genuinely believes it's best, is that authentic? But the user sees her as mistaken. So perhaps the values need to be justified externally too. That complicates it. Maybe the principle includes both internal alignment and external justification. Her values might be internally held but misaligned with actual needs (adequate schools). The mother's care is externally necessary. So combining internal and external factors.

  Proposed principle: "Admiration arises when work expresses authentic agency (freely chosen commitment) directed toward substantively valuable ends (meeting genuine needs or advancing understanding)."

  Then, for the surgeon: genuine need during epidemic. Mother's care: genuine need. Scholar: advancing understanding, even unpublished. Freelancer: efficient, meets ends, autonomous. Salaried employee: lacks transparency, so not authentic agency. Clerk: work might not be substantively valuable, coerced. Woman: private school not substantively valuable if schools are adequate. Businessman: if calling serves community, valuable. Civil servant: his stance protects genuine need for rest, so admirable.

  This seems to cover most cases. The user's verdict on the clerk as pitiable but not a victim fits—coerced but some choice. The surgeon's excess is admirable because of the context. The scholar is covered. The automated clerk is a cheat because of deception, not efficiency. The freelancer is a hero due to autonomy and delivering value.

  For the civil servant, his principle of disconnecting protects personal time, a genuine need, so admirable. The businessman: if his work serves a real need, admirable; if not, perhaps not, but the user might need to show his internal conflict.

  This principle treats work as both instrumental (for good ends) and intrinsic (standards like autonomy). The cost might be that it requires nuanced character development to show internal and external alignment. In drafts, characters' motivations and the actual impact of their work need clear portrayal.
answer: |-
  Your verdicts reveal a deep tension between work as *instrumental* (a means to an end) and work as *intrinsic* (valuable in itself, governed by its own standards). Your tentative principle ("work good when necessary, leisure good when earned") stumbles because it overemphasizes instrumentality and neglects autonomy, consent, and the inherent dignity of the activity. Here's a more robust principle, its competitors, and how they handle your cases and new ones.

  **The Core Principle: Autonomy-Aligned Purpose**
  **Work is admirable when it expresses authentic agency (freely chosen commitment) directed toward substantively valuable ends (meeting genuine needs or advancing understanding). Leisure is enviable when it reflects conscious choice and enables flourishing, not mere avoidance.**

  *   **Key Components:**
      1.  **Authentic Agency:** Is the effort driven by the individual's own values, commitments, or necessities they endorse, not coercion (external or internalized)? Is there meaningful consent?
      2.  **Substantively Valuable End:** Does the work serve a *genuine* need (basic survival, care, justice, truth, essential service) or create meaningful value beyond status or arbitrary preference?
      3.  **Alignment:** Are agency and purpose coherent? Does the chosen *means* (the work) align in scale and nature with the *end*?

  **How It Explains Your Verdicts:**

  1.  **Man (80h, despised trade, mother's care):**
      *   **Agency:** Necessity-driven, but endorsed as a core duty (care). Limited choice, but authentic commitment to the *end*.
      *   **End:** **Substantively valuable** (basic care for a dependent). Life/death stakes.
      *   **Alignment:** Extreme means justified by the extreme end. **Admirable.** (Clause: **Substantively Valuable End + Authentic Agency**)

  2.  **Woman (80h, private school, adequate public):**
      *   **Agency:** Likely driven by status anxiety, internalized pressure, or misaligned priorities rather than a freely chosen, essential duty.
      *   **End:** **Not substantively valuable** (luxury preference, no demonstrable *need* met beyond the adequate baseline). Status-driven.
      *   **Alignment:** Extreme means grossly disproportionate and misaligned with the non-essential end. **Mistaken.** (Clause: **Lack of Substantively Valuable End** dominates; Agency likely compromised)

  3.  **Clerk (dies at desk, firm praises):**
      *   **Agency:** **Lacking.** Coerced by toxic work culture, economic pressure, possibly internalized obligation ("gaman"). Choice exists but is heavily constrained. Not freely chosen commitment.
      *   **End:** **Value questionable.** Work's purpose (firm profit? routine tasks?) likely not inherently vital or aligned with clerk's *own* deep values. Firm exploits his lack of agency.
      *   **Alignment:** Misaligned. Means (death) catastrophically disproportionate to the likely trivial end. **Pitiable, Firm Culpable.** (Clause: **Lack of Authentic Agency** dominates; End lacks substantive value)

  4.  **Surgeon (dies working, epidemic):**
      *   **Agency:** **High.** Freely chosen commitment to vocation and duty in crisis. Authentic expression of skill and purpose.
      *   **End:** **Profoundly valuable.** Saving lives during an overwhelming societal need.
      *   **Alignment:** Extreme means tragically aligned with the extreme, vital end. Sacrifice stems from commitment, not coercion. **Admirable (excess included).** (Clause: **Authentic Agency + Substantively Valuable End + Alignment**)
      *   ***Reconciliation with Clerk:*** The *source* of the "choice" and the *value* of the end differ fundamentally. The surgeon acts from authentic commitment to a vital end; the clerk succumbs to coercion for a trivial end.

  5.  **Scholar (independent means, unpublished):**
      *   **Agency:** **High.** Pursuit driven by intrinsic love of knowledge/truth. Freely chosen.
      *   **End:** **Substantively valuable.** Advancing understanding (even if unpublished; value is in the pursuit and personal/eventual contribution to thought). Scholarship has intrinsic value.
      *   **Alignment:** Means (life devoted) perfectly aligned with the end (pursuit of understanding). **Enviable, not wasteful.** (Clause: **Authentic Agency + Substantively Valuable End** - Publication is instrumental, not core to the value here)

  6.  **Salaried Employee (automates to 4h, silent):**
      *   **Agency:** Misapplied. Chooses deception for personal gain.
      *   **End:** **Lacks value creation.** Delivers *only* the minimal contractual obligation, extracting maximum unearned resources. Exploits the system.
      *   **Alignment:** Means (deception) misaligned with the implied social contract of salaried work (presumed effort/time). **Cheat.** (Clause: **Lack of Substantively Valuable End** creation beyond contract + **Misalignment** via deception)

  7.  **Freelancer (bills by result, 4h):**
      *   **Agency:** **High.** Chooses efficiency and values results over time.
      *   **End:** **Meets substantive value.** Delivers the agreed-upon result efficiently. Creates the value the client pays for.
      *   **Alignment:** Means (efficiency) perfectly aligned with the end (result delivery) within the agreed framework. **Hero (of efficiency/autonomy).** (Clause: **Authentic Agency + Substantively Valuable End + Alignment**)

  **Where the Principle Stretches (But Holds):**
  *   **The Scholar:** Challenges "substantive value" being purely external/public. Principle holds because the value of scholarship is inherent in the *activity and its object* (advancing understanding), even if private. Her agency and the intrinsic value of the pursuit suffice.
  *   **The Surgeon vs. Clerk:** Principle clearly distinguishes via Agency and End value.

  **Rival Principles & Why They Fail:**
  1.  **Pure Instrumentality (Work only good for necessary ends):**
      *   **Fails:** Cannot explain admiration for the Surgeon's *excess* (instrumentally, rest might make him save *more* lives) or the Scholar (no "necessary" end served). Condemns the Freelancer's efficiency if his needs are met. Excuses the Salaried Employee if the job's purpose is delivered.
  2.  **Pure Intrinsic Value (Work good by its own standards):**
      *   **Fails:** Cannot condemn the Woman (she works hard!) or the Salaried Employee (he delivers!). Makes the Clerk potentially admirable ("devotion"). Cannot distinguish Surgeon/Clerk death by context. Struggles to explain envy of Scholar's leisure-like pursuit.
  3.  **Sacrifice = Admiration:**
      *   **Fails:** Admires the Woman and the Clerk equally with the Man and Surgeon. Ignores purpose and consent. Condemns the efficient Freelancer.

  **Implications for New Cases:**

  1.  **Small-Town Businessman (won't retire at 70, sense of calling):**
      *   **Analysis:** Hinges on **Authentic Agency** and **Substantively Valuable End**.
          *   If his "calling" is authentic (deeply held identity, service to community, mentorship, preserving something vital), and the business serves a genuine community need or provides meaningful work/identity *for him*, it's **Admirable**. (Like the Scholar, work *is* his flourishing).
          *   If driven by fear of irrelevance, inability to let go, ego, or the business serves no real need, it's **Potentially Pitiable/Misguided** (like the Woman). Means (working past need) misaligned with a non-substantive end.
      *   **Principle's Verdict:** **Ambiguous - Requires Nuance.** You must show the *source* of his calling and the *value* the business provides (beyond profit).

  2.  **Civil Servant (35h, unreachable after 6pm, principle):**
      *   **Analysis:** Tests **Authentic Agency** and the **Value** of boundaries.
          *   If his principle is a **freely chosen commitment** to work-life balance, mental health, family, or resisting exploitative "always-on" culture, and he delivers his core duties effectively within 35h, it's **Admirable/Enviable**. He asserts agency for a substantively valuable end (personal flourishing, upholding healthy norms). (Similar to the Freelancer's autonomy).
          *   If it's rigid laziness, shirking genuine emergencies within his remit, or neglecting core responsibilities that necessitate occasional flexibility, it's **Potentially Culpable/Cheating**. Lack of agency (dogma over duty) and failure to meet a substantively valuable end (effective public service).
      *   **Principle's Verdict:** **Leans Admirable** if framed as conscious defense of human needs against encroachment. Requires showing he *does* deliver the job's core purpose.

  **The Cost in Your Drafts:**
  This principle **integrates instrumentality and intrinsic standards**, but **prioritizes agency and purpose over pure necessity or inherent work standards.** The cost is:
  1.  **Demands Depth:** You must explore characters' *internal motivations* (authenticity of agency) and critically assess the *actual value* of their work's ends (beyond their own claims). The Woman and Businessman require showing why their ends *aren't* substantively valuable.
  2.  **Context is King:** The same act (long hours, death by work) is judged by context (Surgeon vs. Clerk). Setting and societal need become crucial.
  3.  **Validates Non-Traditional Work/Leisure:** The Scholar and the balanced Civil Servant are justified by agency and the value of their choices, challenging pure productivity norms. The efficient Freelancer is celebrated.
  4.  **Condemns Systemic Exploitation:** It clearly indicts the systems that crush agency (Clerk's firm) or enable deception without value creation (Salaried Employee's structure).
  5.  **Moral Complexity:** Characters like the Clerk aren't pure victims, but their limited agency within coercion makes them pitiable, not admirable. The Man's admirability is tinged with the tragedy of necessity.

  This principle provides a sturdy, testable framework rooted in character agency and the real-world impact/value of their choices. It forces you to interrogate both the *why* and the *what for* of work and rest in your characters' lives, leading to richer, more nuanced narratives. Use it to probe whether your characters' efforts are truly their own and truly matter.
