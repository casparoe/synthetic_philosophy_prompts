  To address the query, I define a scoring rule on the smallest non-trivial algebra: a single contingent proposition \(A\) and its negation \(\neg A\), with two possible worlds: \(w_1\) (where \(A\) is true) and \(w_2\) (where \(A\) is false). A credence function \(c\) is specified by \(c(A) = x\) and \(c(\neg A) = y\), where \(x, y \in [0, 1]\). Coherence (probabilism) requires \(x + y = 1\).

  ### Defined Scoring Rule
  The scoring rule \(s(c, w)\) is defined as follows:
  - If \(w = w_1\) (i.e., \(A\) is true):  
    \[
    s(c, w_1) = (x - 1)^2 + y^2 + 1000 \left[ (x - 0.4)^2 + (y - 0.4)^2 \right]
    \]
  - If \(w = w_2\) (i.e., \(A\) is false):  
    \[
    s(c, w_2) = x^2 + (y - 1)^2 + 1000 \left[ (x - 0.4)^2 + (y - 0.4)^2 \right]
    \]

  ### Incoherent Credence Function
  Consider the incoherent credence function \(c^*\) with \(c^*(A) = 0.4\) and \(c^*(\neg A) = 0.4\) (so \(x + y = 0.8 \neq 1\)). Its scores in both worlds are:
  - In \(w_1\):  
    \[
    s(c^*, w_1) = (0.4 - 1)^2 + (0.4 - 0)^2 + 1000 \left[ (0.4 - 0.4)^2 + (0.4 - 0.4)^2 \right] = (-0.6)^2 + (0.4)^2 + 0 = 0.36 + 0.16 = 0.52
    \]
  - In \(w_2\):  
    \[
    s(c^*, w_2) = (0.4 - 0)^2 + (0.4 - 1)^2 + 1000 \left[ (0.4 - 0.4)^2 + (0.4 - 0.4)^2 \right] = (0.4)^2 + (-0.6)^2 + 0 = 0.16 + 0.36 = 0.52
    \]

  ### Comparison with Coherent Credence Functions
  A coherent credence function must satisfy \(x + y = 1\). Let \(c_p\) be coherent with \(c_p(A) = p\) and \(c_p(\neg A) = 1 - p\) for some \(p \in [0, 1]\). We show that for any such \(c_p\) and in any world, \(s(c_p, w) > 0.52\).

  **In \(w_1\):**
  \[
  s(c_p, w_1) = (p - 1)^2 + (1 - p)^2 + 1000 \left[ (p - 0.4)^2 + (1 - p - 0.4)^2 \right] = 2(1 - p)^2 + 1000 \left[ (p - 0.4)^2 + (0.6 - p)^2 \right]
  \]
  The expression \(2(1 - p)^2 + 1000 \left[ (p - 0.4)^2 + (0.6 - p)^2 \right]\) is minimized at \(p \approx 0.5005\) (found via calculus), yielding approximately \(20.4995 > 0.52\). For example:
  - At \(p = 0.4\):  
    \[
    s(c_p, w_1) = 2(0.6)^2 + 1000 \left[ 0 + (0.2)^2 \right] = 2 \times 0.36 + 1000 \times 0.04 = 0.72 + 40 = 40.72 > 0.52
    \]
  - At \(p = 0.5\):  
    \[
    s(c_p, w_1) = 2(0.5)^2 + 1000 \left[ (0.1)^2 + (0.1)^2 \right] = 2 \times 0.25 + 1000 \times (0.01 + 0.01) = 0.5 + 20 = 20.5 > 0.52
    \]

  **In \(w_2\):**
  \[
  s(c_p, w_2) = p^2 + (1 - p - 1)^2 + 1000 \left[ (p - 0.4)^2 + (1 - p - 0.4)^2 \right] = 2p^2 + 1000 \left[ (p - 0.4)^2 + (0.6 - p)^2 \right]
  \]
  This is minimized at \(p \approx 0.4995\), yielding approximately \(20.4995 > 0.52\). For example:
  - At \(p = 0.4\):  
    \[
    s(c_p, w_2) = 2(0.4)^2 + 1000 \left[ 0 + (0.2)^2 \right] = 2 \times 0.16 + 1000 \times 0.04 = 0.32 + 40 = 40.32 > 0.52
    \]
  - At \(p = 0.5\):  
    \[
    s(c_p, w_2) = 2(0.5)^2 + 1000 \left[ (0.1)^2 + (0.1)^2 \right] = 2 \times 0.25 + 1000 \times (0.01 + 0.01) = 0.5 + 20 = 20.5 > 0.52
    \]

  Thus, \(c^*\) scores strictly better than every coherent \(c_p\) in both worlds: \(s(c^*, w) = 0.52 < s(c_p, w)\) for all \(p\) and both \(w\).

  ### Violated Conditions
  This scoring rule violates two standard conditions for accuracy measures:

  1. **Truth-Directedness**: A scoring rule is truth-directed if, whenever one credence function is uniformly closer to the truth-values than another in a world, it scores better. Here, \(c^* = (0.4, 0.4)\) is not uniformly closer to the truth than all coherent functions. For example, in \(w_1\) (truth-value \((1, 0)\)), the credence \((0.4, 0.3)\) is closer to \((1, 0)\) than \(c^*\) is, but:  
     \[
     s((0.4, 0.3), w_1) = (0.4-1)^2 + (0.3)^2 + 1000\left[(0.4-0.4)^2 + (0.3-0.4)^2\right] = 0.36 + 0.09 + 1000 \times 0.01 = 0.45 + 10 = 10.45 > 0.52 = s(c^*, w_1)
     \]
     Thus, moving closer to the truth worsens the score, violating truth-directedness.

  2. **Propriety**: A scoring rule is proper if every coherent credence function minimizes expected score relative to itself. Here, a coherent function \(c_p\) does not minimize expected score relative to its own credences because the penalty term \(1000 \left[ (x - 0.4)^2 + (y - 0.4)^2 \right]\) biases the score toward \((0.4, 0.4)\), not toward the coherent function itself.

  ### Assessment
  A defender of the dominance argument can rule out this scoring rule by insisting on **truth-directedness** without assuming probabilism. Truth-directedness is a minimal requirement for an accuracy measure: it ensures that improving accuracy (moving credences closer to truth-values) always improves the score. This condition is motivated independently of probabilism, as it directly ties the scoring rule to the goal of accuracy. Rejecting such a rule does not presuppose coherence; it only requires that the scoring rule appropriately reflects accuracy relative to the actual world.

  This example shows that the dominance argument relies on more than just propriety; **truth-directedness is essential**. Without it, incoherent functions can artificially "dominate" coherent ones due to biases in the scoring rule (e.g., the penalty for deviating from \((0.4, 0.4)\)). Thus, the defender can exclude this counterexample by upholding truth-directedness as a non-negotiable constraint on accuracy measures.
