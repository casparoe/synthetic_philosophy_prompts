prompt: |-
  I run a small podcast that grew out of a rationalist meetup, and next week's guest is a working New Testament scholar — mainstream critical, not a mythicist and not an apologist — who thinks the criteria of authenticity, used carefully, actually deliver a defensible minimal portrait of Jesus. He has a go-to deflection. Press him on circularity or on the bias baked into dissimilarity and he says the criteria are heuristics, not algorithms, and that they're just a formalized version of the weighing that every historian does anyway. I want a run of eight to ten questions that makes that move progressively harder to keep using.

  Coverage I want, one question each at minimum:

  - The criterion of embarrassment read as a likelihood ratio. You can't estimate how likely an awkward detail is to be preserved without knowing what the redactors found awkward, and you infer that from what they preserved. Also worth noting that they usually didn't delete awkward material, they kept it and explained it — the baptism by John is retained but reframed so that John protests it should be the other way round, and the cry of abandonment on the cross survives in the earlier gospels and gets replaced in Luke and John. Does retain-and-reframe count for or against authenticity, and does his answer change depending which case he's looking at?
  - Double disimilarity. If you only admit material that looks like neither first-century Judaism nor the early church, your output is by construction a pile of exceptions. What kind of person can that method produce, and can a portrait made entirely of residues support any positive claim about what he was mainly about?
  - Multiple attestation. Independent in what sense — sources, or forms? And is a pass on this criterion evidence about Jesus, or evidence about how far back a tradition stream goes?
  - The background-model problem. The criteria are calibrated against a picture of first-century Judaism and of early Christian tendencies that was itself built largely out of the same texts. I want him to give one case where a change in that background picture flipped a verdict, and say whether that's a feature.
  - Asymmetry. As far as I can tell the criteria only ever license inclusion. Is there a saying he used to count as authentic and has since ruled out? If not, what's the mechanism by which his method could be wrong?
  - The social-memory objection, that there's no clean line between a stable core and later interpretation — but press his likely reply, which will be that the memory people are doing criteria-shaped inference with the serial numbers filed off.

  Audience note: half my listeners are Bayes-brained and will think this is trivially a likelihood-ratio problem, and I want the episode to be fair rather than a cage match. I've been reading the same blogs since before I had a beard and my reflex is epistemic learned helplessness about anything Jesus-shaped, so make the good questions genuinely answerable by someone who knows the field. Every question gets a follow-up keyed to the specific answer he's most likely to give, with the next move already written out. Don't build anything on a citation I'd have to look up — names are fine as gestures, but the substance should be the argument. End with one that makes him name the single most load-bearing assumption in the whole approach and say what happens to his conclusions if it's false. No softballs about how he got into the field.
reasoning: |-
  Okay, let me unpack this user's request. They run a rationalist-adjacent podcast and need a rigorous question sequence for a New Testament scholar defending historical Jesus criteria. The user wants to systematically challenge the "it's just heuristics" deflection while keeping it fair and substantive.

  Hmm, the user's clearly done their homework - they're referencing specific criteria problems (double dissimilarity, embarrassment as likelihood ratio) and want Bayesian-friendly framing. Interesting that they mention "epistemic learned helplessness" about Jesus studies; they want to push hard but avoid gotcha dynamics. The audience split matters too - half Bayes-literate, so questions must accommodate probabilistic thinking without alienating non-specialists.

  First, I should map their requested coverage points to question flow. The embarrassment criterion needs to highlight the circularity in assessing "awkwardness" - especially since early Christians often reframed rather than deleted uncomfortable material. For double dissimilarity, the key is showing how it constructs a Jesus of exceptions. Multiple attestation requires probing what "independence" really means in their sources.

  The background-model problem feels crucial - if scholarly consensus about 1st-century Judaism shifts (like after Dead Sea Scrolls discoveries), how does that change criterion judgments? And the asymmetry point is sharp: if criteria only add material without excluding, what falsifies the method? 

  Ah, and the social-memory challenge needs preemption - they predict the guest will say memory studies just use informal criteria. Good reminder to ask for an example where memory theory changed a specific authenticity verdict.

  For structure: opening with embarrassment makes sense as it's concrete (baptism/cry of dereliction). Then double dissimilarity shows methodological limits. Multiple attestation transitions to source issues, leading to the background-model dependency. Asymmetry tests falsifiability before the memory studies counter. Finally, the load-bearing assumption question forces meta-reflection.

  Each question needs built-in follow-ups. For example, if they defend baptism's authenticity via embarrassment, ask why reframing doesn't undermine it. If they claim sources are independent, press on Q/Luke interdependence. The goal isn't trap but depth - making the "just heuristics" reply feel insufficient without denying its partial validity.

  Last thought: the user wants no citations but names as gestures (e.g., "like Bauckham argued"). Keeps it accessible. And absolutely no softball questions - this is for listeners who've read LessWrong sequences on bias. The closing must force explicit acknowledgement of foundational assumptions. I'll avoid anything requiring offhand source recall; all arguments should stand without specific verse references.
answer: |-
  Here's a precise, escalating question sequence designed to challenge the "just heuristics" deflection while remaining fair, substantive, and forcing explicit methodological reflection:

  1.  **Opening on Embarrassment (Likelihood Ratio & Reframing):** "You often cite Jesus' baptism by John as passing the criterion of embarrassment. But calculating *how* embarrassing something was requires estimating both the prior likelihood of invention and the likelihood of preservation *given* embarrassment. How do you independently assess what the *early redactors specifically* found embarrassing enough to trigger this criterion? For instance, they didn't delete the baptism – they *reframed* it (Matt 3:14-15). Doesn't 'reframing' undermine the idea that embarrassment *forces* preservation in a raw state? Is retain-and-reframe evidence *for* authenticity, or evidence of *damage control* on a problematic inherited tradition?"
      *   *Likely Reply/Follow-Up:* (If he argues reframing still shows the core event was too solid to discard) "But doesn't that shift the criterion? It becomes 'embarrassing enough to *require reframing* but not deletion'. How do you quantify *that* threshold across different cases? Take the Cry of Dereliction ('My God, why...') – preserved raw in Mark/Matthew, *replaced* in Luke/John. Does replacement mean it *wasn't* embarrassing enough for your criterion, or that it *was* so embarrassing later communities deleted it? How does your criterion distinguish?"

  2.  **Double Dissimilarity (The Exception Pile):** "Double dissimilarity selects sayings/acts unlike both 1st-century Judaism *and* the early church. Doesn't this *by construction* produce a figure composed *only* of exceptions to prevailing norms? Can a portrait built *entirely* from residues – things he alone did/said that neither predecessors nor followers replicated – tell us anything coherent about his *central* mission or message? What positive, characteristic picture of Jesus emerges *solely* from this double-dissimilar material?"
      *   *Likely Reply/Follow-Up:* (If he argues it reveals unique aspects or a core break) "But isn't the risk that you're artificially isolating him? If his core message resonated enough to launch a movement, wouldn't we expect *some* continuity with the early church? If *everything* characteristic of him must be unlike the church, doesn't that make him fundamentally alien to the movement bearing his name? Can a 'minimal Jesus' built only from residues support the claim that he was the *founder* of Christianity?"

  3.  **Multiple Attestation (Source vs. Form & What it Proves):** "Multiple attestation is crucial for your minimal portrait. But 'independence' is contested. When you argue for a saying's authenticity based on appearing in Mark *and* Q, how confident are you that Mark and Q represent genuinely *independent* streams of tradition, rather than interconnected branches? Furthermore, is a 'pass' on multiple attestation strong evidence the saying goes back to the *historical Jesus*, or is it primarily evidence that the tradition is *early and widely circulated* within the developing movement?"
      *   *Likely Reply/Follow-Up:* (If he defends Mark/Q independence or distinguishes source/form) "Let's grant potential independence for argument's sake. If a saying passes multiple attestation but *fails* dissimilarity or coherence – say, a widely attested apocalyptic saying typical of early Christians – does multiple attestation *override* the other criteria? If not, what's the hierarchy? And if multiple attestation mainly proves earliness/widespread circulation, how do you then distinguish *authentic Jesus material* from *very early Christian theology*?"

  4.  **Background-Model Problem (Calibration Drift):** "The criteria rely on a background model: what 1st-century Jews believed/did and what the early church tended to invent/emphasize. This model is built largely from the same texts we're evaluating. Can you give one concrete example where a significant *shift* in our understanding of 1st-century Judaism or early Christianity (e.g., insights from Dead Sea Scrolls, social history, changed views on Paul) demonstrably *changed* the verdict of the criteria on a specific saying or event? If such shifts happen, is this a feature showing the method adapts, or a bug revealing its core dependence on potentially unstable consensus?"
      *   *Likely Reply/Follow-Up:* (If he cites an example like changed views on apocalypticism) "Doesn't that case highlight the circularity? The background model shift likely stemmed partly from re-evaluating the *same texts* using evolving historical methods. If the criteria's output depends significantly on a scholarly consensus built from the sources under analysis, how strong is the independent leverage they provide?"

  5.  **Asymmetry & Falsifiability:** "The criteria seem fundamentally asymmetric: they're tools for *including* material in the 'authentic' pile. Can you name a specific saying or event that was *once widely accepted* by mainstream scholars using these criteria as authentic, but that you or the field now confidently *excludes* based *primarily* on applying these same criteria? If not, what is the mechanism *within the criteria methodology itself* that could falsify a claim of authenticity? Doesn't the lack of such examples suggest the criteria are better at generating hypotheses than testing them?"
      *   *Likely Reply/Follow-Up:* (If he struggles or cites material excluded for failing criteria) "But isn't exclusion usually just failing to pass the inclusion tests? That's different from a criterion actively *ruling it out*. For instance, does the criterion of embarrassment *ever* say 'This *non*-embarrassing detail is likely *inauthentic* because they *would* have invented it'? If the criteria only license inclusion, not exclusion, can the method ever be *wrong* in a way that forces a core revision, rather than just failing to add more material?"

  6.  **Social Memory (Criteria in Disguise?):** "Social memory theorists argue there's no clean 'core' of authentic memory separable from interpretation; memory is constantly reshaped by community needs. You've suggested their work often ends up doing criteria-shaped inference informally. Can you give one specific example where a social-memory approach, focusing on the community's needs and narrative shaping, led to a *different* conclusion about the likely historicity of a specific pericope than a standard criteria-based approach? If not, does this suggest the criteria are simply formalizing inevitable historical reasoning, or that social memory theory is being forced into the old paradigm?"
      *   *Likely Reply/Follow-Up:* (If he disputes a clear example exists or argues for convergence) "Take the Temple Cleansing. Criteria might emphasize its embarrassment (disruptive act) or multiple attestation. A social-memory approach might emphasize its powerful symbolic resonance for post-70 communities interpreting the Temple's destruction. Does the criteria approach adequately account for why such a disruptive *memory* would be preserved and shaped *if it wasn't historical*? Or does the social-memory perspective offer a valid alternative explanation *without* needing to posit historicity, challenging the criteria's inference?"

  7.  **The Heuristics Defense Under Pressure:** "You emphasize the criteria are heuristics, not algorithms, formalizing what historians do. Given the issues raised – potential circularity in calibration, asymmetry, producing a residue-Jesus, dependence on contested independence – could these heuristics be systematically generating a *specific kind of illusion*? Specifically, could they reliably produce a 'minimal Jesus' that appears defensible primarily *because* the method selects for scattered, anomalous data points that resist easy categorization, while potentially missing or excluding more characteristic but less distinctive core elements?"
      *   *Likely Reply/Follow-Up:* (If he defends the yield or necessity of the method) "How do you guard against that illusion? If the 'minimal portrait' is built from inherently anomalous data selected by these heuristics, what positive evidence assures us these anomalies cohere into a real historical figure rather than fragments of diverse tradition?"

  8.  **The Load-Bearing Assumption:** "Stepping back: what is the single most load-bearing assumption underlying the entire criteria-of-authenticity approach? The one that, if it were shown to be significantly flawed or unsustainable, would most seriously undermine the confidence you place in the 'minimal portrait' derived through this method?"
      *   *Likely Reply/Follow-Up:* (Whatever he names - e.g., general reliability of oral tradition, discernibility of early layers, stability of community memory pre-70, basic historicity of the narrative framework) "If [State his assumption] turned out to be far less robust than currently assumed – say, evidence mounted that oral transmission in this context was far more fluid and creative in the first decades, or that the 'framing narratives' are largely later constructs – how drastically would that change your minimal portrait? Would it collapse entirely, or just shrink further? Does the method have a contingency plan if its foundation shifts?"

  **Key Features of this Sequence:**

  *   **Escalating Challenge:** Starts concrete (baptism), moves to methodological flaws (dissimilarity's residue, asymmetry), tackles foundational issues (background model, social memory), and ends with the core assumption.
  *   **Pre-empts Deflections:** Directly addresses the "heuristics" and "historians do this anyway" points by probing *how* the heuristics work and *what specific historical reasoning* they formalize, exposing potential flaws in that reasoning itself.
  *   **Built-in Follow-Ups:** Each question anticipates a likely reply and has a specific, harder follow-up ready, preventing easy escape hatches.
  *   **Bayesian Friendly:** Explicitly frames issues like likelihood ratios (embarrassment), priors (background model), and hypothesis testing (falsifiability).
  *   **Substantive & Fair:** Grounded in mainstream scholarship (baptism, cry of dereliction, dissimilarity critique, social memory). Asks for positive examples from the scholar (changed verdict, social memory difference). Focuses on *method*, not dogma.
  *   **No Obscure Citations:** Uses well-known examples (Baptism, Cry of Dereliction, Temple Cleansing) and concepts (Mark/Q, reframing) without requiring niche references.
  *   **Forces Core Reflection:** Culminates in identifying and testing the load-bearing assumption.
  *   **Avoids Learned Helplessness:** Provides a structured way to probe without dismissing the scholar's work; seeks concrete answers about the method's operation and limits.

  This sequence respects the scholar's expertise while rigorously testing the methodology he defends, moving the conversation beyond the "just heuristics" deflection into the deeper epistemological and practical challenges of historical Jesus research. Good luck with the interview!
