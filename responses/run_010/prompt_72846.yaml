prompt: |-
  So I'm one of six voting members on my city's automated-decision review board, and Thursday we have to rule on a Parks & Rec proposal that has the whole board arguing past each other. I've been asked to write up the recommendation memo, and I want to get it right.

  The proposal: instead of surveying residents about which classes and programs they want, Parks wants to *infer* it. A vendor system learns a reward function from behavior — signup abandonment, how long you hover on a listing, waitlist joins, no-shows, cancellations — and then ranks and recommends programming accordingly. Technically it's inverse reinforcement learning dressed up in marketing language, and they call the output "preference learning."

  A neighborhood coalition invoked our policy clause requiring "meaningful notice of the criteria used to rank or allocate services affecting a resident," and they're demanding that each resident recieve a plain-language statement of what the system thinks they want, plus a way to contest it. Parks' technical lead says that's impossible in principle, not merely expensive: a reward recovered from behavior isn't pinned down uniquely, because whole families of reward functions that differ in ways that leave the optimal behavior untouched are equally consistent with the data, so any printed statement picks one arbitrary member of an equivalence class and attributes goals to people they'd disavow — while the system's recommendations would be byte-for-byte identical under the alternative. Also, they say, there's no per-person reward function to begin with; it's one shared model conditioned on features.

  Board is split. One member says the underdetermination point makes the coalition's demand incoherent and we should just approve. Another says that's precisely why we shouldn't: a system that can't say what it takes you to want can't be contested, and contestability was the point of the clause.

  Two wrinkles neither side is addressing. First, most of the training behavior comes from last year's pilot, which was itself recommending things — so a chunk of the "revealed" preferences were manufactured by the system, and the vendor's headline accuracy number is holdout agreement with behavior-under-recommendation, which looks circular to me. Second, subsidized kids' swim slots get allocated by the same ranking, so opting out costs you access.

  Draft the memo the board could actually act on: approve, deny, or approve with conditions. If conditions, spell out concretely what Parks would have to disclose or offer residents that *survives* the underdetermination objection — I suspect the answer lives at the level of what the system does differently under some counterfactual rather than any statement of a reward, but argue it rather than assuming it — how you'd handle the feedback-loop problem and the people who can't opt out, and what the timeline should be for pilot versus full rollout. And give the strongest case for whichever side you don't land on, in a form that side would recognize as their own argument.
reasoning: |-
  We are drafting a memo for a city automated-decision review board regarding a Parks & Rec proposal to use an inverse reinforcement learning system (marketed as "preference learning") to infer resident preferences for classes and programs. The system uses behavioral data (signup abandonment, hovering, waitlist joins, no-shows, cancellations) to learn a reward function and then ranks and recommends programming accordingly.

  Key issues:
  1. A neighborhood coalition demands that each resident receive a plain-language statement of what the system thinks they want and a way to contest it, citing a policy clause requiring "meaningful notice of the criteria used to rank or allocate services affecting a resident."
  2. Parks' technical lead argues that providing such a statement is impossible in principle because:
     a. The reward function is underdetermined: multiple reward functions can explain the same behavior (equivalence classes), so any statement would be arbitrary and not necessarily what the resident would endorse.
     b. There is no per-person reward function; it's a shared model conditioned on features.
  3. The board is split:
     - One side: underdetermination makes the demand incoherent; approve.
     - Other side: precisely because of underdetermination, the system cannot be contested; deny.
  4. Additional wrinkles not fully addressed:
     a. Feedback loop: The training data comes from a pilot that was itself recommending things, so "revealed" preferences may be system-influenced. The vendor's accuracy is measured by agreement with behavior under recommendation, which is circular.
     b. Impact on equity: Subsidized kids' swim slots are allocated by the same ranking, so opting out of the system (if possible) costs access.

  We must draft a memo that:
  - Recommends: approve, deny, or approve with conditions.
  - If conditions, specify concrete disclosures or offerings that survive the underdetermination objection. Focus on what the system does differently under counterfactuals rather than stating a reward function.
  - Address the feedback loop and the opt-out problem (especially for subsidized slots).
  - Propose a timeline for pilot vs. full rollout.
  - Present the strongest case for the side not taken.

  After analysis, I recommend: **Approve with conditions**.

  Reasoning:
  - The system has potential benefits: more responsive programming, efficient resource allocation, and possibly better serving residents who don't actively provide feedback.
  - However, the concerns about contestability, feedback loops, and equity must be addressed.

  Conditions should:
  1. Provide contestability without requiring a unique reward function statement.
  2. Mitigate the feedback loop.
  3. Ensure equitable access regardless of participation in the recommendation system.

  **Concrete conditions for contestability** (surviving underdetermination):
  - Instead of a statement of "what the system thinks you want", which is problematic, provide:
    a. **Counterfactual explanations**: For any recommended program, the system should be able to generate a plain-language statement of the minimal changes in the resident's past behavior (or features) that would have led to a different recommendation (e.g., "If you had not cancelled two art classes last year, we would have recommended more art programs"). This is about the system's behavior, not the reward function. It is technically feasible (e.g., via methods like LIME or SHAP, but adapted to the sequential setting) and addresses contestability by allowing residents to see how their actions influence outcomes.
    b. **Feature importance disclosure**: Provide residents with a list of the top features (e.g., past attendance, cancellations, hovering) that most influenced their recommendations, in plain language. This is about the inputs, not the reward.
    c. **Opt-out with no penalty for subsidized slots**: Ensure that residents can opt out of the recommendation system without losing access to subsidized programs. The allocation for subsidized swim slots must use a method that does not rely on the recommendation system for those who opt out (e.g., a lottery or first-come, first-serve for the subsidized slots, independent of the ranking).

  **Feedback loop mitigation**:
  - Require Parks to run an A/B test during the next pilot phase (e.g., 6 months) where a randomly selected control group does not receive recommendations, and their behavior is used to retrain the model without the circularity. Compare the behavior of the control group with the recommended group to assess the influence of the system.
  - Until the feedback loop is assessed, do not use the system for allocating subsidized slots (use an alternative method).

  **Timeline**:
  - **Pilot phase (12 months)**: 
    - Implement the system with the above conditions (counterfactual explanations, feature disclosure, opt-out without penalty for subsidized slots).
    - Run the A/B test for the first 6 months to assess feedback loop impact.
    - At 6 months, report to the board on the feedback loop and any adjustments.
    - At 12 months, evaluate for full rollout.
  - **Full rollout**: Only after successful pilot evaluation and board approval.

  **Strongest case for denial (the side not taken)**:
  The coalition and some board members argue that the system fundamentally undermines the purpose of the notice-and-contest clause because it cannot provide a unique, verifiable statement of the criteria used to allocate services. The underdetermination of the reward function means that any explanation is arbitrary and may misattribute preferences. Moreover, the feedback loop risks entrenching the system's own biases and creating a self-fulfilling prophecy where the system's past recommendations shape future behavior, making it impossible to discern true resident preferences. This is especially concerning for subsidized programs where access is at stake. The system's opacity and the inability to contest the "why" of a recommendation in a meaningful way violate the spirit of transparency and accountability required by city policy. Therefore, we should deny the proposal until a system is developed that can provide unique, contestable criteria.

  **Memo Draft**:

  ---

  **MEMORANDUM**

  **To**: Automated-Decision Review Board  
  **From**: [Your Name], Board Member  
  **Date**: [Date]  
  **Subject**: Recommendation on Parks & Recreation's Proposed "Preference Learning" System for Program Recommendations  

  ### Introduction
  This memo addresses the proposal from Parks & Recreation (Parks) to implement a vendor-supplied system that infers resident preferences for classes and programs using inverse reinforcement learning (marketed as "preference learning"). The system learns from resident behavior (e.g., signup abandonment, hovering, waitlist joins, no-shows, cancellations) to rank and recommend programming. We have reviewed the proposal in light of a neighborhood coalition's request under the city's policy requiring "meaningful notice of the criteria used to rank or allocate services affecting a resident." The board is divided, and this memo provides a recommendation for action.

  ### Key Concerns
  1. **Notice and Contestability**: The coalition demands that each resident receive a plain-language statement of what the system infers they want and a way to contest it. Parks argues this is impossible because the inferred reward function is underdetermined (multiple reward functions explain the same behavior) and because the model is shared, not per-person.
  2. **Feedback Loop**: Most training data comes from a pilot that used the system for recommendations, potentially creating a feedback loop where the system's past recommendations influence the behavior it learns from. The vendor's accuracy metric (agreement with behavior under recommendation) may be circular.
  3. **Equity Impact**: Subsidized kids' swim slots are allocated via the same ranking. Residents who opt out of the system (if allowed) may lose access to these subsidized slots.

  ### Recommendation
  **Approve the proposal with the following conditions to address the concerns, to be implemented during a 12-month pilot phase**:

  #### Conditions for Approval
  1. **Contestability via Counterfactual Explanations** (to be available to residents by the start of the pilot):
     - For any recommended program, Parks must provide a plain-language explanation of the minimal changes in the resident's past behavior (e.g., "If you had attended more pottery classes last year, we would have recommended advanced pottery") that would have led to a different recommendation. This explanation must be generated by the system and made accessible via the online portal and upon request.
     - Additionally, Parks must disclose the top three features (e.g., "your cancellations of art classes," "the time you spent viewing cooking programs") that most influenced the recommendation, updated annually.

  2. **Opt-Out Without Penalty for Subsidized Programs**:
     - Residents may opt out of the recommendation system entirely. For those who opt out:
       - Their behavior data will not be used for training the model.
       - They will not receive personalized recommendations but will have full access to browse and sign up for programs.
       - **Crucially, access to subsidized kids' swim slots must be allocated by a method independent of the recommendation system** (e.g., a lottery or first-come, first-serve for the subsidized slots only). Parks must ensure that opting out does not disadvantage access to these programs.

  3. **Feedback Loop Mitigation**:
     - During the first 6 months of the pilot, Parks must conduct an A/B test:
       - Randomly assign residents to two groups: a "treatment" group that receives recommendations and a "control" group that does not.
       - Retrain the model using data from the control group (which is not influenced by recommendations) and compare the behavior of both groups to assess the feedback loop effect.
       - Report the results to the board at the 6-month mark, including any adjustments to the model or training process.
     - Until the feedback loop is assessed, the system must not be used to allocate subsidized swim slots (use the independent method in Condition 2).

  #### Timeline
  - **Months 1-3**: Parks implements the system with the required disclosures (counterfactuals and feature importance) and opt-out mechanism. Testing and staff training.
  - **Months 4-9**: Pilot phase with A/B testing for the first 6 months (months 4-9). The A/B test report is due at the end of month 9.
  - **Month 10**: Board review of the A/B test report and pilot progress.
  - **Month 12**: Full evaluation of the pilot, including:
    - Resident feedback on the explanations and opt-out experience.
    - Assessment of the feedback loop impact.
    - Equity analysis of program access, especially for subsidized slots.
  - **Full Rollout**: Only upon board approval after the 12-month pilot.

  ### Strongest Case for Denial
  The board member(s) advocating for denial argue that the system's inability to provide a unique, verifiable statement of the criteria used for recommendations violates the core purpose of the notice-and-contest clause. The underdetermination of the reward function means that any explanation of "what you want" is arbitrary and may misrepresent resident preferences. This opacity, combined with the feedback loop, risks creating a system that is not only inscrutable but also self-reinforcing, potentially amplifying biases and reducing the diversity of programs offered. For subsidized swim slots, the stakes are high: allocating a scarce resource via an uncontestable system could lead to unfair outcomes. The coalition's demand for contestability is not a technical obstacle but a fundamental requirement for legitimacy. Until a system can provide unique, attributable criteria for decisions, it should not be deployed.

  ### Conclusion
  The proposed system has the potential to improve program offerings but must be deployed responsibly. With the conditions above, we can ensure meaningful contestability, mitigate feedback loops, and protect equitable access. I recommend approval with these conditions for a 12-month pilot.

  ---
answer: |-
  ### MEMORANDUM  
  **To:** Automated-Decision Review Board  
  **From:** [Your Name], Board Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Parks & Recreation "Preference Learning" Proposal  

  ---

  ### **Introduction**  
  This memo addresses Parks & Recreation's (Parks) proposal to deploy a vendor-supplied "preference learning" system (an inverse reinforcement learning model) to infer resident program preferences from behavioral data (e.g., signup abandonment, hover time, cancellations). The system would rank/recommend programs and allocate subsidized kids' swim slots. A neighborhood coalition invoked our transparency policy requiring "meaningful notice of the criteria used to rank or allocate services affecting a resident," demanding individualized plain-language explanations and contestability. Parks contends this is *impossible* due to reward function underdetermination and the model’s shared structure. The board is divided, with additional concerns about feedback loops (training data from prior recommendations) and equity (subsidized slot allocation).  

  After review, I recommend **APPROVAL WITH CONDITIONS**, detailed below. These conditions ensure contestability and equity without requiring impossible reward disclosures, address feedback loops, and mandate a phased rollout.  

  ---

  ### **Recommendation: Approve with Conditions**  
  Parks’ system may improve program relevance and resource efficiency, but its design risks undermining transparency and equity. Approval is contingent on the following enforceable conditions, which resolve the underdetermination objection by shifting from *reward disclosure* to *system-behavior disclosure*, while mitigating other risks.  

  #### **1. Conditions for Meaningful Notice & Contestability**  
  *To comply with our policy despite reward underdetermination, disclosures must focus on **actionable system behavior**, not inferred preferences.* Parks must provide:  
  - **A. Per-Recommendation Counterfactual Statements** (Not Reward Labels):  
    - For each recommendation (e.g., "We suggest pottery class"), residents receive a plain-language statement:  
      > *"This recommendation would change if your past interactions with programs like [Category X] changed. For example: If you had attended 2+ dance classes last year, this recommendation might prioritize dance."*  
    - **Why it survives underdetermination:** This describes how *behavioral inputs* alter outputs, not unobservable "wants." It leverages the model’s *predictive function* (e.g., "If feature X changed, output Y changes"), bypassing reward ambiguity. Technically, this is feasible via perturbation-based explainability (e.g., SHAP/LIME variants for sequential data). Parks’ vendor can implement this without unique reward recovery.  

  - **B. Dynamic Opt-Out with Explanation Portal:**  
    - Residents may opt out of personalized recommendations. If opted out:  
      - They receive non-personalized, popularity/default rankings.  
      - They retain full access to all programs.  
    - An **online portal** allows residents to:  
      - See the top 3 behavioral features driving their recommendations (e.g., "cancellation rate," "hover time on cooking programs").  
      - Submit contested recommendations (e.g., "Why was dance not suggested?") and receive a counterfactual response (e.g., "Higher attendance in visual arts reduced dance priority").  

  #### **2. Resolving the Feedback Loop**  
  *Training on prior recommendation-influenced data risks self-fulfilling preferences.* Parks must:  
  - **Run a 6-Month Randomized Controlled Trial (RCT) Before Full Rollout:**  
    - **Phase 1 (Months 1–3):** Deploy the system to a randomly selected 50% of users ("test group"); the other 50% receive non-personalized recommendations ("control group").  
    - **Phase 2 (Months 4–6):** Retrain the model using *only control group data* (uninfluenced by recommendations). Compare test vs. control group behavior to quantify feedback loop bias.  
    - **Requirement:** If bias exceeds a predefined threshold (e.g., >15% divergence in key metrics like signup completion), Parks must revise the model (e.g., add de-biasing layers) or halt rollout.  

  #### **3. Equity Protections for Subsidized Slot Allocation**  
  *No resident may be penalized for opting out of recommendations.* Parks must:  
  - **Decouple Subsidized Allocation from Recommendations:**  
    - Use a **separate, transparent allocation rule** (e.g., lottery or first-come-first-served) for subsidized kids' swim slots. Recommendations may *inform* program scheduling but cannot rank eligibility.  
    - Publicly post allocation criteria before each season (e.g., "Subsidized slots: 50% lottery, 50% income-based priority").  

  ---

  ### **Timeline for Pilot vs. Full Rollout**  
  - **Pilot (Months 1–6):**  
    - Implement conditions 1A–B (counterfactual statements, portal) and 3 (equity protections).  
    - Conduct RCT to audit feedback loops (Condition 2).  
  - **Evaluation (Month 7):** Board reviews RCT results and public feedback.  
  - **Full Rollout (Months 8+):**  
    - Only permitted if RCT shows minimal feedback loop bias (<15%) and >80% resident satisfaction with explanations.  
    - Ongoing disclosures: Annual public report on recommendation drivers (e.g., "Top 5 behavioral features system-wide").  

  ---

  ### **Strongest Case for Denial**  
  *(Presented as advocates for denial would articulate it, per request)*  
  "This system violates our transparency policy’s core purpose: enabling residents to understand and challenge decisions affecting them. The underdetermination problem isn’t a technicality—it proves the system **cannot** provide the 'criteria' used for recommendations, as no unique 'preference' exists to disclose. Instead, residents get arbitrary post-hoc justifications. This is compounded by feedback loops: the system manufactures the preferences it claims to 'discover,' trapping residents in a cycle of self-reinforcing recommendations. For subsidized slots, this opacity risks discriminatory allocation under a veneer of neutrality. Opt-outs are hollow when non-participation costs access. We cannot approve a system where contestability is *structurally impossible*. Denial protects residents from unaccountable automation that prioritizes efficiency over rights."  

  ---

  ### **Conclusion**  
  The proposed system offers potential benefits but risks entrenching inscrutable automation. The conditions above ensure:  
  1. **Contestability** via counterfactual explanations (not reward labels),  
  2. **Accountability** through RCTs and equitable allocation, and  
  3. **Adaptability** in a staged rollout.  
  If Parks cannot meet these conditions, the proposal should be rejected. With them, we advance innovation while honoring our mandate for transparency and fairness.  

  **Recommended Vote: Approve with Conditions.**  

  ---  
  **Appendices** (if included):  
  - Technical feasibility memo on counterfactual explanations (vendor-independent assessment).  
  - Draft resident disclosure language.  
  - RCT design specifications.
