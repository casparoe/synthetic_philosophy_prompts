  ### Should You Keep "Ghost Promise"?  
  **Yes, keep it.**  
  - **Why it works**: Perfectly maps to "misleading conversational implicature" in pragmatics—a true literal statement + false inference (Grice’s maxim violations).  
  - **Value**: Distinguishes from legal "misrepresentation" (intent to deceive) and focuses on unintended inferences.  
  - **When to use**: Flag sentences where customer complaints cluster around inferences, not literal falsehoods.  
  - **Refinement**: Specify the implicature type in brackets (e.g., "ghost promise [scalar]") to guide fixes.  

  **Final Tip**: Pair this procedure with customer complaint logs. If ≥3 complaints align on an inference, treat it as a ghost promise—even if pragmatics suggests "low risk."
