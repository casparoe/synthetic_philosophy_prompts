  - **Cancellation backfire risk**: High (Adding "but most save less" undermines offer).  
  - **Ghost promise**: True  
  - **Why annoying?** Customers will still complain they "only" saved $50, but the sentence is legally defensible. Fixes violate plain-language rules or amplify distrust.  

