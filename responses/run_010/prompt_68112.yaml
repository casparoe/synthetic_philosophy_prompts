answer: |-
  ### Pragmatic Disclosure Review Procedure  
  This 5-minute procedure identifies "ghost promises" (unintended pragmatic inferences) using Gricean principles. Steps 1–3 focus on literal meaning; 4–8 on implicatures; 9 escalates unresolvable risks. Plain-language constraints limit fixes to short, simple phrasing (≤2 sentences, no long footnotes).  

  | Step | Question | Passing Answer | Action if Fails | Judgment Call? |
  |------|----------|----------------|-----------------|----------------|
  | 1 | What is literally said? (Truth conditions) | Literal meaning is unambiguous and verifiable. | Rephrase for precision (e.g., replace vague terms). | No |
  | 2 | Are scalar terms present? ("some," "up to," "may," etc.) | None, or context prevents upper-bound inference (e.g., "up to" not implying "usually"). | Flag term; test if it implies a stronger claim (e.g., "may" → "will"). | Yes |
  | 3 | Does the statement contain a conditional ("if")? | No, or context prevents perfection (A→B not read as A↔B). | Rephrase to block biconditional inference (e.g., add "even if not..."). | Yes |
  | 4 | Could relevance implicatures arise? (Grice: Why mention this?) | No unstated relevant inferences (e.g., "fixed rate" doesn’t imply "only rate matters"). | Block inference by adding explicit scope (e.g., "this does not mean..."). | Yes |
  | 5 | Does manner (brevity, simplicity) imply false completeness? | No (e.g., short sentence doesn’t hide complexity). | Add minimal caveat (e.g., "Other terms may vary"). | Yes |
  | 6 | Is conditional perfection risk high? (If A then B → Only if A then B) | Low (e.g., "if you default" not read as sole condition for penalties). | Rephrase or add cancellation clause. | Yes |
  | 7 | Can implicature be cancelled without backfire? | Yes (e.g., adding "but not always" doesn’t amplify implicature). | Avoid cancellation; rephrase core claim instead. | Yes |
  | 8 | Is a plain-language fix feasible? (Short, 1–2 ideas, ≤8th grade) | Yes (e.g., adding 3–5 words doesn’t break rules). | Proceed to Step 9. | Yes |
  | 9 | Is residual risk acceptable? | N/A (Compliance/legal judgment). | Escalate to lawyer with risk analysis. | No (Handoff) |

  ---

  ### Worked Examples  
  #### Case 1: "Your rate is fixed for the first 12 months."  
  - **What is said**: The interest rate remains unchanged for 12 months.  
  - **Implicatures triggered**:  
    - { "type": "relevance", "gloss": "No other terms (fees, penalties) change during 12 months." }  
