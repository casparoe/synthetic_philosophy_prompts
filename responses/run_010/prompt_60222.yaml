  I recall the consequence argument from free will debates—it argues that if determinism is true, no one has free will because choices stem from prior causes. This argument seems analogous but applied to distributive justice. The key question is whether compatibilism can resolve it in this context.

  The flaw likely lies in premise 2. It sets an impossibly high bar for responsibility, requiring total self-creation. In moral philosophy, compatibilists argue responsibility doesn't need such ultimacy. For example, an agent can be responsible if their choice aligns with their character, even if that character has contingent origins. Premise 2's definition conflates origin with control—saying that because factors originate from luck, the agent has no control. But control is about how choices are made, not their origins.

  The mismatch between "to the extent" and the absolute claim in step 5 might amplify the problem. Premise 1 allows degrees of responsibility, but step 5 declares no responsibility exists, which is an overreach if responsibility can be partial.

  If a luck egalitarian rejects premise 2 instead of premise 4, they surrender the ultimacy requirement but keep the core project. They'd adopt a compatibilist view: responsibility exists when choices reflect the agent's character without coercion. This preserves the distinction between brute and option luck. For instance, the saver versus gambler case: the gambler's loss might still count as option luck if their choice was voluntary, even if their risk-taking temperament has lucky origins. This avoids collapsing into strict equality.

  Rejecting premise 4 (claiming some factors are "up to the agent") risks circularity. If capacities or character are deemed under control, it might sneak in responsibility without addressing the deeper challenge. It's less stable than revising premise 2.

  The free will analogy holds, but distributive justice adds nuances. Here, the focus is on fairness in distribution rather than blame. Still, compatibilist tools apply: responsibility is about guided choices, not uncaused causes. However, distributive contexts might require pragmatic adjustments, like accepting that responsibility is scalar (partial) rather than all-or-nothing.

  The user's deeper need is likely to resolve the argument without abandoning luck egalitarianism's core. They might also want clarity on how philosophical concepts translate across domains. By targeting premise 2, they can preserve the theory while acknowledging that responsibility is relational and contextual, not metaphysical ultimacy.
answer: |-
  Right, this is a tight argument—I see why it’s causing headaches. It’s structurally valid, but the poison is in premise 2. That’s the sleight of hand. It smuggles in an ultimacy requirement for responsibility that makes the whole project impossible, and it does so by borrowing the fatalist intuition from the free will debate (your supervisor isn’t wrong about the blazer). Let me walk through why.

  First, the mismatch between "to the extent" in 1 and "no choice" in 5 isn’t trivial, but it’s not the core flaw. Premise 1 allows for *degrees* of responsibility and thus *degrees* to which inequality reflects brute luck. But premise 2 sets up a binary, all-or-nothing condition: responsibility *only* exists if the choice *isn't* the upshot of factors for which the agent isn’t responsible. Step 5 then exploits this binary condition to conclude *no* responsibility exists *at all*. If you accept premise 2’s requirement, step 5 logically follows from 3 and 4. The real question is whether premise 2 states a necessary condition for the *kind* of responsibility luck egalitarianism actually needs. It doesn’t.

  Premise 2 demands what philosophers call "ultimate responsibility." It implies that for a choice to be "up to" the agent in the relevant sense, the agent must be the uncaused cause of the factors leading to that choice. This is the core move of the incompatibilist argument against free will (yes, the consequence argument). But luck egalitarianism doesn’t require this metaphysical ultimacy. It typically operates with a *compatibilist* notion of responsibility. What matters isn’t whether the agent *caused themselves ex nihilo*, but whether the choice reflects their *own* preferences, values, or character in a way that allows us to fairly attribute consequences to *them* rather than to circumstances thrust upon them.

  Think about the saver vs. gambler case. The gambler isn’t responsible *only if* their choice to gamble was forced by circumstances they couldn’t control (e.g., addiction, coercion, sheer ignorance of options). But if they gambled freely—even if their *inclination* to gamble stemmed from constitutive luck—we still intuitively hold them responsible *for acting on that inclination when they could have done otherwise*. The compatibilist says responsibility attaches to the exercise of *agentive control* within their given capacities and options, not to the *origin* of those capacities. Premise 2 conflates "not responsible for the *source* of their character" with "not responsible for the *choices flowing from* that character." Luck egalitarians need the latter, not the former.

  If you cut premise 2 instead of 4, here’s what happens: You surrender the demand for ultimacy. You concede that agents *are* responsible for choices that express their character and values, even if those traits themselves have roots in constitutive luck. This preserves the core luck egalitarian distinction. An inequality due to *differential brute luck* (e.g., being born blind vs. sighted) is unjust. An inequality due to *differential exercises of responsible agency within similar brute luck parameters* (e.g., two able-bodied people with similar opportunities, one chooses to work hard and save, the other chooses to gamble) is potentially just. The gambler’s loss is "option luck" because it stemmed from a *choice they made* with the capacities and options available, even if their risk-tolerance was partly constitutive luck. Their choice was still *theirs* in the relevant sense. You avoid the collapse to strict equality.

  Cutting premise 4 is messier and less stable. If you claim character, capacities, tastes, or perceived options *are* somehow "up to the agent" in the sense premise 2 demands, you face an immediate regress problem. *How* are they up to the agent? Presumably through prior choices. But those prior choices would themselves depend on *even earlier* constitutive factors... and so on. To avoid this, you’d need to posit some uncaused core self—a move that’s metaphysically dubious and doesn’t align with how we actually assign responsibility in social contexts. It risks making luck egalitarianism hostage to a controversial libertarian metaphysics of free will, which most luck egalitarians (like Cohen, Dworkin) explicitly reject. It surrenders less of the *surface* theory but imports a much heavier and more problematic philosophical burden.

  So, what does the luck egalitarian surrender by cutting 2? They surrender the fantasy of a perfectly self-made person. They acknowledge that responsibility is always *situated* within unchosen circumstances. But crucially, they maintain that agency and choice *within* those circumstances can still be robust enough to ground distributive fairness. The project isn’t destroyed; it becomes modest and pragmatic. They focus on mitigating *specific* forms of brute luck that severely undermine fair opportunity for agency (e.g., lack of basic education, healthcare, severe discrimination) while allowing inequalities that track genuine exercises of responsible choice.

  Is the free will analogy perfect? Mostly, yes. The compatibilist responses (Frankfurt, Fischer, Wallace) map directly: responsibility requires guidance control, not ultimate control. But the distributive context *does* add a twist. In the free will debate, compatibilism often justifies blame/praise. In distributive justice, it justifies *distributive consequences*—who gets what. This raises practical questions about how to *institutionalize* the distinction fairly (e.g., how do we determine if a "choice" was sufficiently free? What baseline of opportunity is required?). But these are challenges *within* the project, not fatal to its core distinction. You absolutely *can* import the compatibilist toolkit here. The analogy holds, and it’s the way out.

  Your argument succeeds brilliantly as an *internal critique* of luck egalitarianism *if* it adopts premise 2’s ultimacy requirement. But since no plausible version of luck egalitarianism actually requires that, the bullet you’re forced to bite is rejecting premise 2, not accepting 6 or 7. The subtle sleight was making premise 2 *look* like a necessary truth about responsibility, when it’s really just a deeply controversial—and largely rejected—metaphysical claim. Ditch the blazer; keep the compatibilist core.
