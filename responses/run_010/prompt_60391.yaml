  Alternatively, revising commitment 5. They could say that confirmation doesn't necessarily extend to stronger hypotheses. That would align with probability raising, where data might support H but not H'.

  But the core issue is subjectivity vs objectivity. If they keep confirmation as probability raising, they must accept that it involves prior beliefs. Otherwise, they need a different definition of confirmation.

  In summary, the worst conflict is between 1 and 6. To fix it, weaken 6 to allow that confirmation can depend on reasonable priors or something, but that might not satisfy their desire for full objectivity. Or they could adopt a more objective notion like hypothetico-deductive confirmation, but that might conflict with other commitments.

  For the user, since they're writing a paper, pointing out that their resolution in 4 depends on priors which aren't fully objective. So to maintain objectivity, they might need to adjust their definition of confirmation. But that's a big change. Alternatively, embrace Bayesianism and accept that confirmation has a subjective element, but argue that in practice, with reasonable priors, it's fine.

