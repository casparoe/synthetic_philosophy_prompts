answer: |-
  ## Joint Statement: Gricean-Relevance Theoretic Collaboration on Speaker Meaning

  **Section 1: Agreed Claims (Signed by Both Camps)**

  1.  **Speaker Meaning & Intention:** Speaker meaning is fundamentally a matter of the speaker’s reflexive communicative intention: the intention to produce a certain cognitive effect in the hearer *by means* of the hearer recognising that very intention through the utterance and available contextual information.
  2.  **Intention Recognition:** Hearers recover speaker meaning through a process of intention-recognition, utilising linguistic decoding of the uttered sentence, contextual information (physical, linguistic, encyclopedic), and general cognitive principles.
  3.  **Role of Cooperative Principle (CP) / Principle of Relevance (PR):** Both the Gricean CP (with its maxims) and the Relevance Theoretic PR serve as overarching cognitive principles governing, explaining, and predicting the *inferential processes* hearers employ to bridge the gap between the linguistic meaning of the uttered sentence and the speaker’s intended meaning. They explain *why* and *how* hearers derive implicatures and enrichments.
  4.  **Contextual Dependence:** The meaning recovered by the hearer (whether classified as said or implicated) is critically dependent on context for both reference assignment/disambiguation *and* for inferential processes.
  5.  **Cancellability as Diagnostic:** The potential for an aspect of meaning to be explicitly cancelled without contradiction (as in corpus (a)) is a key diagnostic test for distinguishing implicature from entailment. Both camps agree cancellability strongly indicates the meaning is not part of the linguistically encoded content.
  6.  **Explicature/Implicature Distinction (Broadly):** There is a functional distinction between aspects of meaning that develop the proposition explicitly expressed (explicature) and those that are additional propositions communicated (implicature), though they disagree fundamentally on how the boundary is drawn and what processes create explicature.
  7.  **Corpus Meaning (Partial Agreement):**
      *   (a) The utterance "Some of the applicants were shortlisted" standardly communicates that not all were, but this can be cancelled, as shown.
      *   (b) The conditional "If some of the plates are clean..." typically conveys that it is not known or not relevant that *all* are clean in the context of planning dinner.
      *   (c) The utterance "Moira knows that some of the delegates voted against the motion..." is problematic or potentially misleading if Moira knows that *all* voted against it, indicating a tension between the semantic meaning of "some" and the likely enriched interpretation.

  **Section 2: Residual Disagreements & Diagnostic Cruxes**

  | Disagreement Area              | Gricean Camp Formulation (Accepted by Griceans)                                                                                             | Relevance Theoretic Camp Formulation (Accepted by Relevance Theorists)                                                                                                                             | Crux & Diagnostic Case                                                                                                     | Gricean Prediction                                                                                                 | Relevance Theoretic Prediction                                                                                                                       |
  | :----------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Composition of "What is Said" (Explicature)** | What is said is determined solely by decoding, disambiguation, and reference assignment. Pragmatic processes only contribute to implicature. | The proposition explicitly communicated (explicature) is recovered by pragmatic enrichment processes that develop the linguistically encoded logical form, guided by relevance.                     | **Crux: Embedding under factives/attitudes.** <br> **Diagnostic:** Corpus (c): *"Moira knows that some of the delegates voted..."* Does Moira know the *minimal semantic proposition* ("at least some voted") or the *pragmatically enriched proposition* ("some but not all voted")? | Moira can know the minimal semantic proposition ("at least some voted") even if she knows all voted. The potential misleadingness arises from a *conversational implicature* (not all) that Moira might not hold. | Moira cannot genuinely be said to *know* the proposition expressed in this context unless she knows the pragmatically enriched content ("some but not all voted"). Knowing the minimal proposition is irrelevant or insufficient. |
  | **2. Status of Pragmatic Input** | Pragmatic enrichment occurs *only* to derive implicatures. The input to pragmatic processing is the minimal, semantically determined "what is said". | Pragmatic enrichment is a routine, necessary, and sub-personal process that operates *before* the proposition is fully determined (explicature formation), not just for implicatures. | **Crux: Cancellability Scope & Mechanism.** <br> **Diagnostic:** Corpus (a): *"Some of the applicants were shortlisted — indeed, all forty were."* What does the cancellation cancel? | The cancellation cancels a *generalised conversational implicature* (not all). "What is said" (some, possibly all) remains intact and is asserted first. | The cancellation blocks the derivation of an *explicature* where "some" was enriched to mean "some but not all". The first clause initially communicates the enriched explicature, which the second clause overrides. |
  | **3. Process & Motivation of Inference** | Inferences are guided by the Cooperative Principle and its maxims (Quality, Quantity, Relation, Manner). Hearers actively reason about speaker adherence. | Inferences follow the automatic, sub-personal cognitive Principle of Relevance: hearers follow a path of least effort to achieve sufficient cognitive effects, stopping when expectations of relevance are satisfied. | **Crux: Effort/Effect Trade-off in Interpretation.** <br> **Diagnostic:** Corpus (b): *"If some of the plates are clean, we can start dinner."* Why is the "not all" interpretation standard? | The speaker adheres to the maxim of Quantity (be as informative as required). If all plates were clean, saying "some" would be less informative than required, suggesting they cannot say "all". | The most accessible interpretation yielding adequate effects for minimal effort is "some but not all" (e.g., we might need *some* clean plates to start, but having *all* clean is irrelevant or unexpected). |

  **Conclusion on Terminology:**

  Both camps acknowledge that a significant part of the dispute hinges on the definition and theoretical role assigned to the phrase **"what is said"**. The Gricean camp argues this pre-pragmatic notion is essential and explanatorily useful. The relevance-theoretic camp argues that this notion, as defined by Grice, is psychologically implausible and does no significant explanatory work that isn't better handled by their concept of explicature formed through mandatory pragmatic enrichment. Therefore, while the debate involves substantive differences in the architecture of comprehension, the precise meaning and utility of the term **"what is said"** itself is a core point of contention.
