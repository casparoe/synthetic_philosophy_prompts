prompt: |-
  I'm co-teaching a seminar in the spring, working title something like "Honesty, Tact, and Translation" — half philosophy students, half people from an intercultural-communication program — and separately I've been helping a company whose HQ is in Amsterdam and whose second-biggest office is in Osaka write a single global policy on giving employees feedback. Both projects have convinced me of the same thing: nobody in either of them has ever specified what they actually want from a theory. The Dutch side says directness is a form of respect, the Japanese side says that same directness is a deliberate injury, HR says everyone should just "be honest," and the readings on my syllabus argue about whether white lies are wrong without ever saying what a correct account of the whole territory would have to be able to do. So before I read another one of them: write the desiderata. What does an adequate normative theory of honest and polite communication have to deliver — which cases it must get right, which distinctions it must not collapse, which empirical or conceptual facts it must be consistant with? Give me the consideration behind each requirement, not just the label. Adequacy is relative to a purpose, so take the purpose to be: usable to adjudicate the Amsterdam/Osaka fight, and teachable to people who are going to go write real workplace and clinical guidelines.

  Here's what I have so far, mostly as raw material for you to sort, extend, and tell me I've got wrong. I keep finding four distinct things lumped together under "dishonesty": flat-out asserting what you believe to be false; asserting something literally true while implicating something false; saying nothing with real propositional content but performing it in a register that carries a false attitude — the effusive thank-you note for a gift you hated, which I've been calling register deceit, and I want the theory to say whether that's a moral category at all or just a mannerism; and simply not mentioning what the other person had a claim to be told, where the silence does all the work. A theory that handles only the first and treats the rest as noise should fail. Then there's the cross-cultural wrinkle I think the literature mostly misses: what an utterance communicates depends on local convention, so the same remark can be honest by the speaker's community's rules and systematically misleading by the hearer's — which forces the theory to say whose conventions fix the content, and whether a speaker can be simultaneously blameless and deceptive, or culpably ignorant about the conventions they're operating inside. It also has to cover the other direction, candour and not just deception: when you're required to volunteer unwelcome truths nobody asked for, and when strict truthfulness is itself a way of doing harm — bluntness as a weapon, the colleague who prides himself on telling it like it is and is mostly just being cruel with an alibi. And it can't make ordinary social life pervasively immoral; if the theory implies that every pleasantry, every "lovely to see you," every softened performance review is a wrong, that's a cost it has to explain rather than a feature to celebrate.

  So give me the list, and mark which requirements are non-negotiable versus which are really one camp's prejudices dressed up as criteria — I suspect the demand that the norms be culture-independent is one of the latter, and so is the demand that a lie must involve an intention to deceive, but you tell me. Then say which single requirement does the most to exclude otherwise attractive views, because that's where I'd want to aim the seminar. And do the part I want most: flag any pair of desiderata you think can't be jointly satisfied. My guess is that "whose conventions fix the content" collides with "the norms must not be hostage to which community you happen to stand in," and seperately that a robust duty of candour toward intimates collides with a right to keep parts of yourself unexposed — but argue it, don't just take my word. Finish with a tight scorecard, a sentence or two each, for the four families people actually defend this stuff with: the respect-for-rational-agency prohibition on lying; the practice-of-trust view where the wrong is erosion of a shared institution; the entitlement view where it turns on what this particular hearer had a right to be told; and a tact-or-virtue view on which the question is what a perceptive and kind person would do here. Keep the weight on the criteria and their motivating cases, the scorecard short. And please no reading list or bibliography — I've got a stack, what I'm missing is the spec.
reasoning: |-
  Hmm, the user is working on a seminar about honesty, tact, and translation, and also helping a company with cross-cultural feedback policies between Amsterdam and Osaka offices. They're frustrated that no one has clearly defined what they want from a theory of honest communication. They've noticed that dishonesty comes in different forms: outright lies, misleading truths, deceptive tone, and harmful omissions. Plus, cultural differences mean the same words can be honest in one culture but deceptive in another. The user wants desiderata—clear requirements—for a good normative theory that handles real-world cases like the Amsterdam-Osaka conflict and can be taught to people writing guidelines.

  I need to build on their ideas and organize them. They mentioned four types of dishonesty: flat-out lies, misleading implications, register deceit (like fake thank-you notes), and omissions. The theory must cover all these, not just lies. Cultural relativity is key: whose conventions matter? Can someone be blameless but deceptive? Also, candor: when must you volunteer bad news, and when is bluntness harmful? And the theory can't make everyday politeness immoral.

  The user wants a list of desiderata, marking which are non-negotiable vs. debatable. They suspect some demands, like culture-independence or the intent to deceive, might be biases. I should identify which requirement excludes many views, and flag any conflicting pairs. Finally, scorecard four common theories: respect for rationality, trust as an institution, entitlements based on rights, and virtue ethics focusing on kindness.

  Starting with desiderata: first, the theory must address all four communication modes—assertions, implications, register, omissions. That's non-negotiable because real life involves all, as in gift notes or silence. Second, it must handle cultural relativity in meaning, without favoring one culture. Non-negotiable, as the Amsterdam-Osaka case shows. Third, it must distinguish blameless ignorance from culpable deception—e.g., a Dutch person being direct in Japan might not mean harm, but could be at fault if they should know better.

  For candor, the theory must specify when to volunteer unwelcome truths, like in medical errors, and condemn harmful bluntness, like cruelty disguised as honesty. That's non-negotiable for workplace guidelines. It also can't vilify social niceties; if "lovely to see you" is always wrong, the theory fails. That's non-negotiable for practicality.

  Now, debatable desiderata: Culture-independence is probably a bias—insisting on universal rules ignores context, so it's negotiable. Intent to deceive might be negotiable too, as omissions can deceive without intent. The requirement that excludes many views is likely cultural relativity—theories like Kantian ethics struggle because they assume fixed meanings.

  Conflicts: Cultural relativity vs. universal norms is a big one—e.g., if conventions fix meaning, norms depend on community, but that might not work for global policies. Also, duty of candor vs. right to privacy—telling all to intimates could violate boundaries, like oversharing personal flaws.

  Scorecard for theories: Respect for rationality (Kant) fails on cultural meaning and omissions. Trust as institution (Bok) handles conventions but might not cover omissions well. Entitlements (rights-based) is strong on omissions but vague on cross-cultural issues. Virtue ethics (tact) excels in nuance but is hard to codify for guidelines.

  I'll structure the response with desiderata, conflicts, and scorecards, keeping it focused on criteria and cases. No bibliography—they have readings already.
answer: |-
  Here’s a rigorous set of desiderata for a normative theory of honest and polite communication, designed to resolve cross-cultural conflicts (e.g., Amsterdam vs. Osaka) and inform real-world guidelines. Desiderata are ranked by priority, with justifications grounded in your cases. **Bold** = non-negotiable; *Italics* = potentially negotiable/debatable.

  ---

  ### **Core Desiderata: What the Theory Must Deliver**
  1. **Handle All Four Modes of Dishonesty**  
     The theory must distinguish and normatively evaluate:  
     - Literal falsehoods  
     - Misleading truths (implicature)  
     - Register deceit (misattribution of attitude/affect)  
     - Omissions (withholding owed information)  
     **Why non-negotiable**: Workplace feedback and gift examples show these are empirically distinct and carry different moral weights. A theory collapsing them cannot diagnose why an effusive thank-you for a hated gift feels deceptive, or why silence in a performance review is harmful.  

  2. **Resolve Cross-Cultural Meaning Conflicts**  
     The theory must specify:  
     - Whose conventions fix communicative content (speaker’s intent? hearer’s interpretation? hybrid?)  
     - When speakers are culpable for ignoring/reinforcing mismatches (e.g., Dutch directness in Osaka)  
     **Why non-negotiable**: The Amsterdam/Osaka conflict hinges on this. If content is fixed solely by the speaker’s conventions, the Japanese are "oversensitive"; if by the hearer’s, the Dutch are "reckless." A usable theory must assign blame/absolution in hybrid cases (e.g., "Was the Dutch manager *obliged* to know Japanese norms?").  

  3. **Define Duties of Candor and Limits of Harm**  
     The theory must:  
     - Specify when unwelcome truths *must* be volunteered (e.g., medical errors, project risks)  
     - Condemn "weaponized honesty" (bluntness causing gratuitous harm) without conflating it with justified directness  
     **Why non-negotiable**: HR’s "just be honest" fails here. Dutch "respectful directness" and Japanese "tactful restraint" both claim moral high ground; the theory must adjudicate when candor becomes cruelty.  

  4. **Avoid Over-Criminalizing Social Lubricants**  
     The theory must not condemn universal politeness norms (e.g., "lovely to see you," softening criticism) as inherently immoral.  
     **Why non-negotiable**: If the theory demands radical sincerity, it becomes irrelevant to real workplaces/clinics where rapport enables truth-telling.  

  5. ***Account for Variable Entitlements***  
     The theory should explain why some hearers have stronger claims to truth (e.g., a patient vs. a stranger) and how relationships/roles alter duties (e.g., manager→employee vs. colleague→colleague).  
     *Why negotiable*: While essential for clinical guidelines, strict entitlements may crowd out broader virtues (e.g., kindness to strangers).  

  ---

  ### **Most Excluding Requirement**  
  **#2 (Cross-Cultural Meaning)** does the heaviest lifting. It excludes:  
  - **Absolutist views** (e.g., Kantianism): If "lying is always wrong," but meaning is culturally relative, how can we judge a Dutch "direct truth" that functions as an insult in Japan?  
  - **Speaker-intent theories**: If intent alone fixes morality, the Dutch are blameless even when causing foreseeable harm in Osaka.  
  - **Hearer-centric views**: If interpretation rules, the Japanese could demand unrealistic accommodation from global colleagues.  

  ---

  ### **Irreconcilable Tensions? Two Pairs That Collide**  
  1. **Cultural Relativity vs. Universal Norms**  
     - *Conflict*: If conventions fix meaning (#2), norms become community-relative—but then the Dutch/Japanese deadlock has no principled resolution. If norms are universal, they may ignore local communicative practices.  
     - *Resolution path*: Hybrid theory (e.g., "speakers must follow *their own* sincerity norms *while* avoiding foreseeable harm in the hearer’s context"). Sacrifices purity for practicality.  

  2. **Candor Duties vs. Right to Privacy**  
     - *Conflict*: Intimates may have a claim to unwelcome truths (e.g., "your partner is cheating"), but compelled self-exposure ("share every private thought!") violates autonomy.  
     - *Resolution path*: Distinguish *information critical to the relationship* from *idiosyncratic disclosures*. Still messy: Who defines "critical"?  

  ---

  ### **Scorecard: Four Major Theories**  
  *(Evaluated against the desiderata above, especially cross-cultural resolution and multi-mode dishonesty)*  

  | **Theory**                     | **Strengths**                                  | **Fatal Flaws for Your Purpose**                |  
  |--------------------------------|-----------------------------------------------|------------------------------------------------|  
  | **Respect for Rational Agency** (Kant, Korsgaard) | Clear on literal lies; non-negotiable duties. | Fails #2 (ignores cultural meaning), #3 (no candor/harm balance), and omits register/omission. |  
  | **Practice of Trust** (Bok, Scanlon)              | Handles social context; explains erosion of trust. | Struggles with #2 (whose trust matters?), #4 (over-condemns white lies), and omits omissions. |  
  | **Entitlement-Based** (Shiffrin, Marušić)         | Excels on #5 (variable duties); strong on omissions. | Vague on #1 (register deceit?) and #2 (cross-cultural entitlements?). Hard to codify globally. |  
  | **Tact/Virtue Ethics** (Aristotle, Slote)         | Best for #3 (harm avoidance) and #4 (social nuance); handles attitude/register. | Weak on #2 (virtues are culturally shaped), #5 (under-specified duties). Least "guideline-ready." |  

  ---

  ### **Conclusion**  
  A theory usable for Amsterdam/Osaka and teachable to guideline-writers **must** prioritize #1–4, with #2 (cross-cultural meaning) as the keystone. The virtue ethics framework (supplemented with entitlements) best navigates the tensions *if* it incorporates a hybrid convention model (e.g., "sincerity in your register + foreseeable harm avoidance in theirs"). The irreconcilable tension between cultural flexibility and universal norms is unavoidable—but a "contextual universalism" (core duties + culture-sensitive application) offers a pragmatic path forward for workplace policies.  

  Would you like a draft syllabus segment applying this framework to the Dutch/Japanese feedback case?
