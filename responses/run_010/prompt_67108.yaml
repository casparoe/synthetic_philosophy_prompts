  ### Confidence Statement  
  I am **moderately confident** in this procedure. The central claims—assigning low weight to crustaceans (VP1) and multiplicative scaling (VP2)—are pragmatic responses to contested evidence and scale disparities. However, VP2 (scaling impact by individual count) is the **least defensible** step. It risks overprioritizing high-quantity/low-certainty interventions (e.g., shrimp) despite ethical discomfort. New empirical evidence on public or expert moral weightings (e.g., surveys showing nonlinear scaling) would compel revision. Use this procedure as a starting point; audit outcomes annually.
