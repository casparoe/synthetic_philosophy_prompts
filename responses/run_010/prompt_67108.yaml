answer: |-
  ### Prioritization Procedure for Welfare Investments  
  **Purpose:** To allocate fixed welfare capital budget across taxa with differing evidence of sentience, scale, and measurability, within 2-hour committee meetings.  

  #### Step 1: Assign Evidence-Based Moral Weights  
  - **Task:** Rate evidence strength for capacity to suffer on a 3-point scale:  
    - **3 (High):** Strong, consolidated evidence (e.g., salmon).  
    - **2 (Medium):** Substantial but contested evidence.  
    - **1 (Low):** Thin, actively disputed evidence (e.g., shrimp).  
  - **Sufficient:** Clear assignment with justification (e.g., "Salmon: 3 (EFSA consensus); Shrimp: 1 (limited neural homology)").  
  - **Fails:** Ignoring active disputes or assigning "0" (inaction not permitted).  
  - **Handoff:** Weight assignment is a **value premise** (VP1). Committee must agree explicitly.  
  - **Precaution:** Low ≠ zero. Minimum weight = 1 to ensure consideration.  

  #### Step 2: Calculate Scale-Adjusted Impact  
  - **Task:** For each proposal, compute:  
    **Weighted Impact = (Number of individuals affected/year) × (Moral Weight from Step 1)**  
  - **Sufficient:** Numerical output (e.g., "10M shrimp × weight 1 = 10M").  
  - **Fails:** Omitting either variable or misrepresenting numbers.  
  - **Handoff:** Using multiplication (not addition) is a **value premise** (VP2). Assumes moral importance scales with individual count.  
  - **Trade-off Ratio:** Implicit in weights. For example, 1 salmon (weight 3) = 3 shrimp (weight 1). VP2 defines this.  

  #### Step 3: Screen for "No-Regret" Measures  
  - **Task:** Flag proposals that:  
    (a) Reduce observable harm (e.g., physical injury, stress) *regardless of sentience debate*, AND  
    (b) Have neutral/positive operational impact (e.g., lower mortality, reduce waste).  
  - **Sufficient:** Binary yes/no with brief rationale (e.g., "Reduces deformities; may improve yield").  
  - **Fails:** Overlooking (b) or mislabeling sentience-dependent measures.  
  - **Outcome:** Automatic approval if both criteria met. Fund first.  

  #### Step 4: Assess Welfare Impact & Gaming Risk  
  - **Task:** Classify welfare indicators for each proposal:  
    - **Type A:** Aligns with productivity (e.g., growth rate, mortality).  
    - **Type B:** Welfare-specific, may reduce output (e.g., behavioral agitation, fin erosion).  
    - **Flag indicators easily gamed** (e.g., mortality via culling; feed conversion via fasting).  
  - **Sufficient:** List indicators, classify, and note gaming risks.  
  - **Fails:** Relying solely on Type A indicators; ignoring gaming.  
  - **Handoff:** Requiring ≥1 Type B indicator is a **value premise** (VP3). Ensures genuine welfare commitment beyond profit.  

  #### Step 5: Rank by Cost-Effectiveness  
  - **Task:** Score each proposal:  
    **Cost-Effectiveness = (Weighted Impact × Welfare Improvement Score) ÷ Annualized Cost**  
    - **Welfare Improvement Score:** Committee estimate (1–10 scale) based on Step 4 indicators.  
    - **Annualized Cost:** Capital costs amortized (e.g., 5-year lifespan). Revenue losses treated as annual costs.  
  - **Sufficient:** Numerical score; ranked list.  
  - **Fails:** Skipping cost annualization; arbitrary welfare scores.  
  - **Handoff:** Welfare score is **judgmental** (e.g., "Is reducing fin damage a 3 or 7?").  

  #### Step 6: Document Value Premises  
  - **Task:** Explicitly state VP1 (moral weights), VP2 (multiplicative scaling), VP3 (Type B requirement).  
  - **Sufficient:** Premises minuted and attached to decision.  
  - **Fails:** Premises not recorded.  

  ### Ethical Views Altering Outcomes  
  - **Killing as distinct wrong:** Elevates harvest-stage interventions (e.g., stunning) in Step 5 welfare scoring.  
  - **Life worth living:** Emphasizes chronic conditions (e.g., stocking density) over acute suffering in Steps 4–5.  

  ### Candid Notes  
  - **Judgment calls disguised as procedure:** Step 1 (weights), Step 5 (welfare scores), and Step 4 (Type B classification) are subjective but structured for transparency.  
  - **Cannot:** Resolve deep ethical conflicts (e.g., "Are shrimp sentient?"), create missing data, or guarantee public acceptance.  

  ---

  ### Worked Examples  
  **Proposal (a): Shrimp electrical stunning (£600,000 capital)**  
  - **Step 1:** Shrimp moral weight = 1 (low; evidence contested).  
  - **Step 2:** 80M shrimp/year × 1 = 80M weighted impact.  
  - **Step 3:** Not no-regret. Welfare benefit sentience-dependent; operational risk (efficacy uncertain).  
  - **Step 4:**  
    - Type A: None (no productivity link).  
    - Type B: Agitation reduction (gaming risk: immobility ≠ insensibility; no validated indicator).  
    Fails VP3—no reliable Type B indicator.  
  - **Step 5:** Welfare score low (2/10 due to uncertainty). Annualized cost (£77,700; 10-year, 5% discount). Cost-effectiveness = (80M × 2) ÷ 77,700 ≈ 2,058.  
  - **Outcome:** **Rejected.** Fails Step 4 (no valid Type B indicator) and high uncertainty.  

  **Proposal (b): Salmon density reduction (£400,000 annual revenue loss)**  
  - **Step 1:** Salmon moral weight = 3 (high).  
  - **Step 2:** 267,000 salmon/year × 3 = 801,000 weighted impact.  
  - **Step 3:** Not no-regret. Welfare gain clear, but revenue loss.  
  - **Step 4:**  
    - Type A: Reduced mortality (gaming risk: low).  
    - Type B: Fin damage ↓, lice ↓ (welfare-specific, cost to output).  
  - **Step 5:** Welfare score high (7/10). Cost-effectiveness = (801,000 × 7) ÷ 400,000 ≈ 14.02.  
  - **Outcome:** **Prioritized.** High cost-effectiveness, passes VP3.  

  **Proposal (c): Double shrimp production (cost: expansion capital, not welfare-funded)**  
  - **Step 1:** Shrimp weight = 1.  
  - **Step 2:** 80M new shrimp × 1 = 80M.  
  - **Step 3:** Not no-regret. Increases total animals without welfare gain; may intensify harms.  
  - **Step 4:** No welfare improvement proposed.  
  - **Outcome:** **Excluded.** Not a welfare intervention; ineligible for welfare budget.  

