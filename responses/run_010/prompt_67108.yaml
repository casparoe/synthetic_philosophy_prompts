prompt: |-
  I am head of animal welfare at a mid-sized aquaculture group in northern Europe. We farm Atlantic salmon in marine cages across four sites — around 1.6 million fish at any one time — and whiteleg shrimp in lined ponds at two sites, on the order of thirty to forty million animals per crop cycle, harvested twice a year. I sit on a monthly welfare and operations committee with the managing director, the production manager and the head of sales; none of them has any training in ethics, we have a fixed annual welfare capital budget, and we have about two hours per meeting in which to reach a decision that the board will accept. Our salmon are stunned and bled at harvest. Our shrimp are harvested by draining the ponds and immersing the animals in a chilled ice-water slurry, a practice one of our retail auditors has queried. Our principal retailer has now asked us to demonstrate how we prioritise welfare improvements, noting that decapod crustaceans fall within the scope of the Animal Welfare (Sentience) Act 2022.

  The difficulty is that I have no defensible way of ranking the proposals that come to me, because the two halves of the business differ on every dimension that matters ethically: the strength of the evidence that these animals are capable of suffering, the number of individuals affected, how much we can actually measure on farm, and what is technically feasible at harvest. Please write me a prioritisation procedure that this committee can genuinely run inside two hours.

  The procedure should consist of ordered steps, and for each step it should say what counts as a sufficient answer, what makes an answer fail, and where the step hands the decision over to a person because the question is one of values rather than of fact. In particular, it needs to address the following, explicitly and in sequence:

  1. How much weight to give evidence about capacity for suffering when that evidence is strong and consolidated for one taxon and thin and actively disputed for the other — without either letting uncertainty license inaction or letting precaution consume the entire budget.
  2. How to compare a change affecting many millions of individuals whose moral status is contested against a change affecting a smaller number of individuals whose status is not, and whether this requires a trade-off ratio; if it does, say where such a ratio could come from and flag it as a value premise rather than a finding.
  3. A class of "no-regret" measures that are justified whichever way the sentience question resolves.
  4. The measurement problem: the indicators we can cheaply collect (mortality, growth, feed conversion, deformity rates, fin condition, eye and rostrum damage, behavioural agitation at harvest) are correlated with productivity, so a procedure that ranks by what is measurable will drift towards whatever also improves yield. It should distinguish interventions that improve welfare and output together from those that improve welfare at a real cost to output, since only the latter test whether the commitment is genuine, and it should note which indicators can be gamed.
  5. Where the procedure's value premises should be written down as premises, so that a critic or an auditor can locate the disagreement instead of quarrelling with arithmetic.

  Then say which of its own steps would give different answers under a view that treats killing as a distinct wrong, and under a view that asks whether the animal's life is worth living rather than how much suffering occurs in it. Be candid about which steps are judgement calls wearing the clothes of procedure, and close with a plain statement of what the procedure cannot do.

  Finally, run the procedure on three live proposals: (a) roughly £600,000 to replace the shrimp harvest slurry with electrical stunning in the pond water followed by immediate chilling, where efficacy in high-salinity water is uncertain, where immobilisation is easily mistaken for insensibility, and where we have no validated indicator of unconsciousness in a shrimp; (b) a twenty per cent reduction in stocking density at one salmon site to lower lice burden and fin damage, costing perhaps £400,000 of revenue a year with no retailer premium available; and (c) a plan to double shrimp production by bringing the second site to full capacity next year. At least one of these should come out badly for us, and if so I would rather you said so plainly than softened it.

  Please give me the procedure in a form that could be handed to the committee as a single page, with the three applications shown as worked examples against it. I do not want a reference list or a reading list; where you are relying on a contested empirical claim, mark it as contested in the body of the answer. End with a short paragraph stating how confident you are in the procedure's central claims — especially in the weight you assign to the crustacean evidence and in whatever ranking rule you propose — and identifying the one step or premise you are least sure of, together with what would change your mind about it.
reasoning: |-
  We are designing a prioritization procedure for the welfare and operations committee. The procedure must be executable within a two-hour meeting and must address the specific challenges outlined. The steps are ordered and include clear pass/fail criteria and points where human judgment is required due to value premises.

  **Prioritization Procedure for Animal Welfare Investments**

  **Step 1: Establish Evidence of Capacity for Suffering**
     - **Task**: Assign a relative weight to each taxon (salmon and shrimp) based on the strength of evidence for their capacity to suffer. Use a three-tier scale: High (strong, consolidated evidence), Medium (substantial but disputed evidence), Low (thin and actively disputed evidence). 
     - **Sufficient Answer**: A tier assignment for each taxon with a brief justification. 
     - **Fail**: If no assignment is made, or if the assignment ignores current scientific consensus without reason. 
     - **Judgment Call**: The assignment itself is a judgment call. However, the committee must document the rationale. 
     - **Notes**: 
          - Atlantic salmon: High (strong evidence of sentience and capacity to suffer, as per EFSA and other bodies). 
          - Whiteleg shrimp: Low to Medium (contested evidence; some studies suggest decapods can experience pain, but the evidence is not consolidated and is actively disputed). 
     - **Weighting**: Assign a numerical weight for budget allocation: High=3, Medium=2, Low=1. This weighting factor will be used in later calculations. 
     - **Precautionary Principle**: Even for Low evidence, we do not assign zero weight. Uncertainty does not justify inaction, but the weight reflects the level of uncertainty.

  **Step 2: Scale of Impact and Moral Status Trade-off**
     - **Task**: For each proposal, calculate the number of individuals affected per year. Then, adjust this number by the evidence weight from Step 1 to get a "weighted impact score". 
          - Weighted Impact Score = (Number of individuals affected per year) × (Evidence weight from Step 1)
     - **Sufficient Answer**: Calculation of the weighted impact score for each proposal. 
     - **Fail**: If the calculation is not done, or if the evidence weight is ignored. 
     - **Trade-off Ratio**: This step implicitly uses a trade-off ratio by weighting the number of individuals by the evidence of their moral status. The ratio (the evidence weights) is a value premise. It comes from the committee's judgment in Step 1. 
     - **Judgment Call**: The choice of using a multiplicative model (number × weight) is a value premise. It assumes that the moral weight of an intervention is proportional to both the number of individuals and the strength of evidence for their capacity to suffer.

  **Step 3: Identify "No-Regret" Measures**
     - **Task**: Before proceeding, identify if any proposal is a "no-regret" measure. These are interventions that:
          - (a) Improve welfare regardless of sentience (e.g., by reducing physical damage, stress, or improving health) and 
          - (b) Have a neutral or positive effect on operational efficiency (e.g., reduce mortality, improve growth, or reduce costs). 
     - **Sufficient Answer**: A yes/no for each proposal on whether it meets both criteria. 
     - **Fail**: If the committee does not consider both criteria. 
     - **Outcome**: Any proposal that is a "no-regret" measure is automatically prioritized and funded from the budget (if not already implemented). 
     - **Judgment Call**: The assessment of operational impact is factual, but the definition of "regardless of sentience" is a judgment. However, measures that reduce observable harm (like injury or mortality) are generally no-regret.

  **Step 4: Measure Welfare Impact and Avoid Gaming**
     - **Task**: For each proposal, estimate the welfare impact using measurable indicators. Classify each indicator as:
          - Type A: Indicators that are both welfare-positive and productivity-positive (e.g., reduced mortality, improved growth, better feed conversion). 
          - Type B: Indicators that are welfare-positive but productivity-negative or neutral (e.g., reduced stocking density leading to lower yield, or behavioral improvements with no production benefit). 
     - **Sufficient Answer**: A list of indicators for each proposal, classified as Type A or Type B. At least one Type B indicator must be present for the proposal to be considered a genuine welfare improvement (to avoid only selecting measures that also boost productivity). 
     - **Fail**: If the proposal relies solely on Type A indicators without any Type B indicators, or if the indicators can be easily gamed (e.g., mortality can be manipulated by culling). 
     - **Notes**: 
          - Flag indicators that are easily gamed (e.g., mortality rates can be gamed by early culling; fin condition can be subjective). 
          - The presence of Type B indicators is critical to demonstrate a genuine commitment to welfare beyond productivity.

  **Step 5: Cost-Effectiveness Calculation**
     - **Task**: Calculate a cost-effectiveness score for each proposal:
          - Cost-Effectiveness Score = (Weighted Impact Score from Step 2) × (Estimated Welfare Improvement) / (Annualized Cost)
     - Where:
          - Estimated Welfare Improvement: A committee estimate (on a scale of 1-10) of the overall welfare improvement per individual, based on Step 4 indicators. 
          - Annualized Cost: The total cost per year (for capital costs, annualize over the expected lifespan; for revenue losses, use the annual loss). 
     - **Sufficient Answer**: A numerical score for each proposal. 
     - **Fail**: If the score is not calculated for any proposal. 
     - **Judgment Call**: The welfare improvement score is a judgment call. The committee must document the basis for the score (e.g., based on the number and severity of Type A and Type B improvements).

  **Step 6: Final Ranking and Value Premises**
     - **Task**: Rank proposals by cost-effectiveness score (highest first). 
     - **Sufficient Answer**: A ranked list. 
     - **Fail**: If the ranking ignores the scores without justification. 
     - **Value Premises**: The entire procedure rests on:
          - VP1: The evidence weights assigned in Step 1 (a value-based judgment on the moral status of each taxon).
          - VP2: The use of a multiplicative model for weighted impact (implies that both numbers and moral status matter).
          - VP3: The requirement for Type B indicators to demonstrate genuine welfare commitment.
     - **Documentation**: The value premises (VP1, VP2, VP3) must be written in the meeting minutes.

  **How Different Ethical Views Would Change the Procedure**
     - **View that killing is a distinct wrong**: This view would add extra weight to harvest-stage interventions (like stunning). The procedure does not currently account for this. To incorporate, the committee could add a fixed welfare improvement score for interventions that address killing (but this would be a value premise).
     - **View focused on life worth living**: This view would shift attention to conditions throughout life (e.g., stocking density, environment). The current procedure already captures this via welfare improvement estimates (Step 5) and Type B indicators (Step 4). However, it might require a different weighting of long-term vs. acute suffering.

  **Candid Note on Judgment Calls**: Steps 1 (evidence weight), Step 5 (welfare improvement score), and the classification of indicators in Step 4 are judgment calls. They are structured to force explicit reasoning, but they are not purely objective.

  **What the Procedure Cannot Do**: It cannot resolve fundamental ethical disagreements (e.g., whether shrimp have moral status). It cannot create data where none exists (e.g., on shrimp stunning efficacy). It may not capture all welfare dimensions (e.g., positive experiences).

  ---

