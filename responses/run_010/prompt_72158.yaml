  ## DECLARATION OF COVENANTS, CONDITIONS, AND RESTRICTIONS FOR PERPETUA ESTATES  
  **RECORDING REQUESTED BY:**  
  Perpetua Development Company, LLC  
  **AND WHEN RECORDED MAIL TO:**  
  Perpetua Management Trust, c/o Perpetua Development Company, LLC  
  100 Binding Way, Founders Landing, CA 94103  

  **SPACE ABOVE THIS LINE FOR RECORDER'S USE**  

  **DECLARATION** made this _____ day of __________, 20____, by **PERPETUA DEVELOPMENT COMPANY, LLC**, a Delaware limited liability company ("Declarant").  

  **RECITALS**  

  WHEREAS, Declarant is the owner and developer of certain real property situated in the County of __________, State of California, more particularly described in Exhibit "A" attached hereto and incorporated by reference (the "Property"), which Property is being developed as a planned residential community known as PERPETUA ESTATES (the "Community");  

  WHEREAS, the fundamental character and enduring value of the Community depend upon the maintenance of specific aesthetic, environmental, and communal standards designed to foster tranquility, stability, and a shared commitment to long-term excellence;  

  WHEREAS, experience demonstrates that individuals and collectives, when confronted with transient pressures, immediate convenience, or shifting preferences, may act in ways contrary to their own settled, long-term objectives and the collective good they have previously endorsed;  

  WHEREAS, the very purpose of acquiring property within the Community is predicated upon adherence to these established standards, which define its unique desirability;  

  WHEREAS, the Declarant recognizes that its own successors, assigns, and future owners within the Community ("Members") are equally susceptible to such future divergence from present commitments as the Declarant itself would be;  

  WHEREAS, therefore, a mechanism of preemptive self-binding is essential to safeguard the Community's defining characteristics against the predictable, yet detrimental, fluctuations in individual and collective judgment over time;  

  WHEREAS, such mechanism must be robust, resistant to casual alteration, and designed to enforce adherence to the original vision even against the future desires of the Members themselves;  

  WHEREAS, Declarant deems it necessary and desirable to create a flexible framework for the maintenance, administration, and preservation of the Community through the imposition of mutually beneficial covenants, conditions, and restrictions upon the Property;  

  NOW, THEREFORE, Declarant hereby declares that the Property shall be held, transferred, sold, conveyed, used, occupied, and enjoyed subject to the following Covenants, Conditions, and Restrictions (the "CC&Rs"), which shall run with the land and be binding upon all parties having or acquiring any right, title, or interest in the Property, their heirs, successors, and assigns, in perpetuity, unless amended or terminated as herein provided.

  **ARTICLE I: DEFINITIONS**  
  *(Standard definitions omitted for brevity)*  

  **ARTICLE II: PROPERTY SUBJECT TO DECLARATION**  
  2.01 **The Property**: The real property described in Exhibit "A".  
  2.02 **Platted Lots**: The Property is subdivided into One Hundred Fifty (150) residential lots ("Lots") as shown on the Final Map of Perpetua Estates, recorded___________.  

  **ARTICLE III: ADMINISTRATION**  
  3.01 **Architectural Review Board ("ARB")**: An Architectural Review Board is hereby established.  
  3.02 **Composition**: The ARB shall consist of three (3) individuals appointed in the first instance by the Declarant. Upon the death, resignation, or incapacity of any member, the remaining members shall appoint a successor. Should no members remain, the Declarant's successor-in-interest (or if none, a court of competent jurisdiction upon petition by any Member) shall appoint the Board *de novo*.  
  3.03 **Powers**: The ARB shall have absolute and final authority to interpret these CC&Rs, approve or deny all plans for construction, alteration, or landscaping, and enforce compliance. Its decisions shall be final and binding, and expressly **shall not be subject to review, appeal, or override by the Membership or any committee thereof**.  

  **ARTICLE IV: AMENDMENT**  
  4.01 **General Amendment**: Except as provided in Section 4.02 below, these CC&Rs may be amended only by an affirmative vote representing **Seventy-Five Percent (75%)** of the total Voting Interests (as defined in Article V).  
  4.02 **Amendment of Article IV or Article X**: Any amendment to this Article IV (Amendment) or Article X (Term; Sunset) shall require an affirmative vote representing **Ninety Percent (90%)** of the total Voting Interests.  
  4.03 **Ratcheting Threshold**: Upon the successful amendment of these CC&Rs pursuant to Section 4.01, the threshold required for any *subsequent* amendment under Section 4.01 shall automatically increase by five percentage points (5%). This increased threshold shall apply to the next and all subsequent amendment attempts. The threshold for amending Article IV or Article X (Section 4.02) shall remain fixed at Ninety Percent (90%).  

  **ARTICLE V: VOTING INTERESTS**  
  5.01 **Definition**: "Voting Interest" means the vote allocated to each Platted Lot. Each Platted Lot shall have one (1) Voting Interest.  
  5.02 **Voting Pool**: The total number of Voting Interests eligible to be cast on any matter subject to a vote of the Membership shall be **One Hundred Fifty (150)**, corresponding to the total number of Platted Lots shown on the Final Map, **regardless of the number of Lots actually developed, sold, or occupied at the time of the vote.** Vacant Lots shall be deemed to vote in the negative on any proposed amendment.  

  **ARTICLE VI: ACKNOWLEDGEMENT OF FUTURE PREFERENCE DIVERGENCE**  
  6.01 **Member Acknowledgement**: By accepting title to a Lot within the Community, each Member expressly acknowledges and agrees:  
      (a) That their future preferences, priorities, and judgments regarding the standards, restrictions, and governance of the Community may materially diverge from their preferences, priorities, and judgments at the time of acquisition;  
      (b) That such future divergence is a known and inherent risk to the preservation of the Community's character as established by these CC&Rs;  
      (c) That the restrictions imposed by these CC&Rs, including the amendment thresholds and ARB authority, are designed specifically to protect the Community *against* the realization of such future divergent preferences; and  
      (d) That, accordingly, any future preference for relaxation of standards, alteration of the amendment process, or diminution of ARB authority shall be deemed, for the purposes of governance under these CC&Rs, to reflect the transient pressures these CC&Rs were designed to counter, and **shall be accorded diminished weight in the deliberative and enforcement processes of the Community.**  

  **ARTICLE VII: VARIANCES**  
  7.01 **Request**: A Member may petition the ARB for a variance from a specific restriction contained herein.  
  7.02 **Standard**: The ARB may grant a variance only upon a finding of unique and extreme hardship directly attributable to the physical characteristics of the specific Lot, **and** that the variance will not materially alter the Community's character or set a precedent weakening the CC&Rs.  
  7.03 **Finality**: The ARB's decision on a variance request shall be absolute and final. There shall be no appeal to the Membership or any other body.  

  **ARTICLE VIII: MEMBER ORIENTATION AND DISCLOSURE**  
  8.01 **Mandatory Orientation**: Prior to close of escrow for any Lot, the prospective Member **must** attend and complete a mandatory Orientation Session conducted by the Declarant or its designated agent.  
  8.02 **Content**: The Orientation Session shall provide a comprehensive, detailed, and explicit review of:  
      (a) All restrictions imposed by these CC&Rs, including but not limited to architectural controls, land use limitations, and behavioral standards;  
      (b) The governance structure, emphasizing the absolute authority of the ARB and the high thresholds for amendment;  
      (c) The Acknowledgement of Future Preference Divergence (Article VI);  
      (d) The calculation and purpose of Assessments (Article IX); and  
      (e) The self-renewing Sunset Clause (Article X).  
  8.03 **Purpose**: The Orientation Session is designed to provide full transparency regarding the binding nature of the commitment being undertaken. **Completion of the Orientation Session is a condition precedent to ownership within the Community.**  

  **ARTICLE IX: ASSESSMENTS**  
  9.01 **Annual Assessment**: An annual assessment ("Assessment") shall be levied against each Lot.  
  9.02 **Use of Funds**: Assessment funds shall be used **exclusively** for the following purposes:  
      (a) The compensation and administrative costs of the Architectural Review Board;  
      (b) Costs associated with enforcing these CC&Rs, including legal fees for actions to compel compliance or enjoin violations;  
      (c) Costs of administering the amendment process, should one be initiated;  
      (d) Costs of conducting Mandatory Orientation Sessions;  
      (e) **No Assessment funds may be used for common area maintenance, landscaping, security, amenities, or any other tangible benefit to the Membership beyond the strict administration and enforcement of these CC&Rs.**  

  **ARTICLE X: TERM; SUNSET**  
  10.01 **Initial Term**: These CC&Rs shall be effective upon recording and shall remain in force for a period of twenty-five (25) years.  
  10.02 **Automatic Renewal**: Upon the expiration of the initial twenty-five (25) year term, and upon each subsequent expiration, these CC&Rs shall automatically renew for an additional successive term of twenty-five (25) years **unless**, prior to the expiration of the then-current term, an instrument terminating these CC&Rs is recorded, signed by Members holding **Ninety-Five Percent (95%)** of the total Voting Interests (150 votes).  
  10.03 **Perpetual Effect**: If no such termination instrument is recorded within the required timeframe preceding expiration, renewal shall be automatic and perpetual pursuant to Section 10.02.  

  **ARTICLE XI: GENERAL PROVISIONS**  
  *(Standard provisions on Severability, Enforcement, Notice, etc., omitted for brevity)*  

  **IN WITNESS WHEREOF,** Perpetua Development Company, LLC, has caused this Declaration to be executed by its duly authorized officer on the date first written above.

  **PERPETUA DEVELOPMENT COMPANY, LLC**  
  By: _______________________________________  
  Name: A. S. Binder  
  Title: Managing Member  

  **STATE OF CALIFORNIA**  
  **COUNTY OF ______________**  

  On this _____ day of __________, 20____, before me, _____________________________, a Notary Public, personally appeared A. S. Binder, who proved to me on the basis of satisfactory evidence to be the person(s) whose name(s) is/are subscribed to the within instrument and acknowledged to me that he/she/they executed the same in his/her/their authorized capacity(ies), and that by his/her/their signature(s) on the instrument the person(s), or the entity upon behalf of which the person(s) acted, executed the instrument.

  I certify under PENALTY OF PERJURY under the laws of the State of California that the foregoing paragraph is true and correct.

  WITNESS my hand and official seal.

  _______________________________________  
  Signature of Notary Public  

  (SEAL)
