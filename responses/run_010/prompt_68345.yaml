prompt: |-
  I write novels for a living, but I also run a tiny podcast out of my kitchen — six or seven episodes a year, mostly me talking to academics whose books I've quietly stolen from. Next week's guest is a moral philosopher whose position is that hypocrisy doesn't just make blame clumsy or self-defeating or rude: it takes away your standing to blame at all, so the hypocrite's condemnation isn't badly delivered, it isn't hers to deliver. I've read the book twice and I still can't tell what she thinks the mechanism actually is, which is the one thing I want the hour to pin down.

  Can you draft me eight to ten questions, each with a short follow-up attached that's keyed to the answer you'd expect her to actually give? Nothing soft, nothing about how she got into philosophy, and keep each question short enough to say out loud without sounding like I'm reading a seminar paper.

  I want some of them built out of my own material, so they're questions nobody's put to her before:

  - The mechanism. Her target's conduct really was bad, and what she says about it is true — so what does the blamer's own record do to the blame? Follow up on whatever she says about implicitly granting herself an exemption, using a blamer who grants herself nothing: she just failed, feels awful about it, and has already made restitution in private.
  - A character from my manuscript. Dee publicly tears into her contractor for padding invoices; he did it, he deserves it; Dee has also been under-reporting her royalties for six years and no one will ever find out, and Dee thinks she's weak rather than special. Does Dee loose standing? And does it change if she's confessed to her accountant and started paying it back but hasn't said a word to the contractor?
  - Scope. Does standing lapse only for the norm you've broken, or does it bleed sideways — a man who lies about money denouncing someone who lies about sex? Make her say how the edges of a norm get drawn, and follow up with whatever she'll use to dodge the arbitrariness.
  - If Dee can't say it, her neighbor can, and the neighbor's sentence would be word-for-word identical. Is the defect in the target, the audience, or the speech itself? Follow-up: can the contractor waive it — can he say "I don't care, you're right" and hand standing back?
  - Self-blame. Can Dee blame Dee? Does her view end up making self-blame the one kind of blame nobody can be a hypocrite about?
  - The psychology. People seem to punish hypocrisy hardest when the hypocrite is visibly signalling virtue, even where the thing they blamed was real. Is that support for her account, or evidence that the folk concept is a mess? Get her to commit to one.
  - The political consequence. If standing tracks your own compliance, is basically all public condemnation — politicians, columnists, the internet — standing-less? Ask her to either own that or show where the block is, and follow up on whichever she picks.

  Then flag the two you think would be hardest for her to answer, because I want to build the turn of the episode — and, honestly, of a scene I'm stuck on — around one of them.
reasoning: |-
  Okay, the user is a novelist and podcaster preparing for an interview with a moral philosopher. They need sharp questions focused on the mechanism of hypocrisy nullifying standing to blame. Let me unpack their requirements.

  First, the core puzzle: how does the hypocrite's own misconduct invalidate their blame even when the condemnation is factually correct? The user wants concrete mechanisms, not abstract theory. The manuscript character Dee is their test case - perfect for grounding the discussion.

  Hmm their angle is fresh - not "why hypocrisy is bad" but "how it structurally voids standing." That's smart. The follow-ups must press on real weak points: restitution without confession, norm bleed-over, whether audiences or speech acts themselves are tainted. 

  Noticing tension points: 
  - The restitution scenario where Dee privately repays but remains silent to the contractor seems tricky for the philosopher's position. Does invisible reform restore standing? 
  - The scope question could expose arbitrariness in defining "same norm." If lying about money vs sex, where's the line? Philosophers hate fuzzy boundaries. 
  - Political consequences might force her into radical "all public blame is invalid" stance or reveal special pleading. 

  User's manuscript scene blockage probably connects to Dee's silent restitution dilemma - that feels pivotal. Also the waiver question: if the contractor accepts the blame, does it retroactively validate? That undermines the whole standing-as-prerequisite framework. 

  For hardest questions: 
  1. The private restitution follow-up traps her. If she says standing is restored without confession, her theory crumbles; if not, it seems unreasonably rigid. 
  2. Waiver question is existentially dangerous - if standing can be handed back, it's not inherent but transactional. 

  Must avoid seminar paper tone. Questions need punchy, conversational phrasing while preserving precision. Dee examples keep it novelistic - plays to user's strength. 

  Political angle could be explosive but might derail into punditry. Better focus on moral mechanics - that's what user needs for their writing. 

  Final list should open with the mechanism heart, then pressure points (Dee variations, scope creep), then philosophical grenades (waiver, self-blame). Save restitution and waiver as kill shots for the climax.
answer: |-
  Here’s a lean, adversarial question set targeting the mechanism and edges of her thesis—with exact follow-ups prepped for likely answers. The two toughest questions are flagged at the end.

  ---

  ### Core Questions & Pre-Built Follow-Ups:
  1. **Mechanism Opener**:  
     *"When a hypocrite condemns a real wrong, what* specifically *voids their standing? Is it their past act, their current attitude, or something else?"*  
     → *(If she cites inconsistency/entitlement):* "But if the blamer *admits* their past failure, feels remorse, and made restitution—no entitlement—does their blame still lack standing?"  

  2. **Dee Scenario (Unrepentant)**:  
     *"Dee condemns her contractor for theft while secretly doing the same. She believes she's weak, not exempt. Does she lack standing?"*  
     → *(If yes):* "So even if she *judges herself* as harshly as she judges him, her speech is disqualified? Why?"  

  3. **Dee Scenario (Privately Reformed)**:  
     *"Same Dee, but she’s confessed to her accountant and repaid the taxes—silently. She blames the contractor. Standing now?"*  
     → *(Likely: "No—she hasn’t confessed to *him*"):* "If standing hinges on *his* awareness, is this about the blamer’s record or the audience’s perception?"  

  4. **Scope Test**:  
     *"A politician who lied about finances condemns a rival who lied about an affair. Same norm?"*  
     → *(If she distinguishes norms):* "What defines a norm’s boundaries? If both involve ‘breach of trust,’ is that enough for symmetry?"  

  5. **The Speech Act Itself**:  
     *"If Dee’s condemnation is void, but her neighbor says the *exact words* to the contractor, it lands. What’s defective: the target, audience, or the words’ origin?"*  
     → *(If "origin"):* "Could the contractor *waive* the defect? If he says, ‘You’re right, I don’t care if you’re a hypocrite,’ does standing snap back?"  

  6. **Self-Blame Paradox**:  
     *"Can Dee blame *herself* for under-reporting? If hypocrisy voids standing, is self-blame uniquely immune?"*  
     → *(If "self-blame is different"):* "Why? Doesn’t she ‘grant herself exemption’ by not facing consequences?"  

  7. **Psychology vs. Philosophy**:  
     *"People react most to *performative* hypocrisy. Does that support your view, or show the folk concept is about signaling—not standing?"*  
     → *(If "supports"):* "But if standing is moral, not psychological, why would visible virtue-signaling matter?"  

  8. **Political Nuclear Option**:  
     *"If standing requires personal compliance, does *any* public figure—columnist, activist, politician—have standing to condemn?"*  
     → *(If "no"):* "Doesn’t that paralyze moral discourse?"  
     → *(If "yes—some contexts differ"):* "What’s the *structural* difference? Is it role-based duties, or just scale?"  

  ---

  ### Hardest Questions to Answer:  
  **#3 (Privately Reformed Dee)** forces her to choose:  
  - If standing *isn’t* restored, her theory demands public confession for moral authority—which feels punitive and impractical.  
  - If it *is* restored, hypocrisy becomes a purely internal flaw, undermining her "standing void" claim.  

  **#5 (Waiving Standing)** is existentially dangerous:  
  - If the *target* can reinstate standing, her entire framework collapses into subjectivism.  
  - If not, her "standing" is rigidly detached from the wrongdoer’s reception—risking irrelevance.  

  ---

  ### Why These Work:  
  - **Tight Phrasing**: All questions fit 1 breath. Example: *"Does Dee lack standing?"* not *"Given the epistemic conditions of..."*  
  - **Follow-Ups as Traps**: Designed to corner evasion. Her likely answers are pre-targeted.  
  - **Your Material as Leverage**: Dee scenarios pressure abstract theory into lived dilemmas.  
  - **Turn Potential**: #3 and #5 expose fissures in the theory. Use one to pivot the episode (and your scene) from "explanation" to "tension."  

  For the episode climax, **#3 (Privately Reformed Dee)** is richer—it ties to guilt, secrecy, and whether moral repair requires audience participation. Perfect for a novelist’s angle.
