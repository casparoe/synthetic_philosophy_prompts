answer: |-
  ## Joint Statement: Humean Best-Systems vs. Governing Laws (Universals/Necessitation)

  **Participants:**
  *   **Proponent A (Humean):** Defending the Lewisian Best Systems Account (BSA) of laws and chance. Laws supervene on the total spatiotemporal mosaic of particular matters of fact (the "Humean Mosaic") and are those regularities belonging to the system of truths that achieves the best combination of simplicity and strength (informativeness) about that mosaic.
  *   **Proponent B (Governing Laws):** Defending a Universals/Necessitation account (Armstrong/Dretske/Tooley style). Laws are constituted by contingent, irreducible relations of nomic necessitation (N) holding between universals. These relations *govern* the behavior of particulars, making the regularities in the mosaic necessary and explaining why they hold.

  **Purpose:** This document outlines areas of agreement, core disagreements, and crucial test cases (cruxes) for our adversarial collaboration on the metaphysics of laws of nature. We commit to precise formulations and pre-registered predictions to facilitate clear adjudication.

  ---

  ### 1. Agreed Claims (Non-Trivially Shared)

  We jointly affirm the following claims, recognizing that an outside observer might reasonably expect them to be points of contention between our views:

  1.  **Epistemic Primacy of Best-System Reasoning:** Regardless of the *metaphysical nature* of laws, the methodology of seeking the best systematization (optimizing simplicity and strength relative to the total evidence) is our best available *epistemic route* to discovering the laws of nature. This methodology is central to scientific practice.
  2.  **Non-Primitivism Requirement:** Any viable account of laws must provide substantive, non-primitive *truth conditions* for law statements. Appeals to the "governing" relation (Proponent B) or "best system" status (Proponent A) must ultimately ground out in identifiable features of the world, not in an unanalyzable primitive "lawhood."
  3.  **The Accidental Gap Problem is Non-Trivial:** Both accounts face a significant challenge in distinguishing genuine laws (e.g., "No object travels faster than light") from merely accidental, universal generalizations that hold throughout spacetime (e.g., "All gold spheres are less than one mile in diameter"). Neither account can dismiss this distinction as illusory; both must provide a principled metaphysical ground for it. The "all gold spheres" case is a genuine problem requiring a solution specific to each view.
  4.  **Laws are Contingent:** The actual laws of nature are not metaphysically necessary. There are possible worlds with different laws governing different patterns of events.
  5.  **Laws Support Counterfactuals:** Genuine laws of nature underwrite robust counterfactual conditionals in a way that accidental generalizations do not (e.g., "If this match *were* struck, it *would* light" vs. "If this piece of gold *were* spherical, it *would* be less than one mile in diameter").
  6.  **Chance is Objective:** There are objective, single-case chances in the world (e.g., the chance of a specific atom decaying in a given interval). These chances are not merely epistemic probabilities reflecting human ignorance.

  ---

  ### 2. Core Disagreements

  | Claim                                                                 | Humean (BSA) Wording                                                                 | Governing Laws Wording                                                                                              | Why the Difference Isn't Just Verbal                                                                                                                                                                                                                                  | Concessions                                                                                                                                                                                             |
  | :-------------------------------------------------------------------- | :----------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. The Nature of Laws**                                             | Laws *are* those universal generalizations that feature in the best deductive system summarizing the Humean mosaic. | Laws *are* contingent relations of nomic necessitation (N) holding between universals.                             | The dispute is ontological: Are laws *constituted by* global patterns (BSA) or are they *irreducible relations* that *produce* and *explain* the patterns (Governing)? The Governing view posits a distinct metaphysical category (N) absent from the BSA ontology. | **Humean Concedes:** The Governing view captures the strong intuition that laws are "over and above" the patterns. **Governing Concedes:** The BSA provides a clear, naturalistic criterion for identifying laws relative to the mosaic.                             |
  | **2. Explanation Direction**                                          | The Humean mosaic (the total pattern of particular facts) explains why we have the laws we do. | The governing laws explain why the Humean mosaic exhibits the regularities it does.                                 | This is a fundamental asymmetry in explanatory priority. For the BSA, laws are a *product* of the mosaic; for Governing, they are the *producer* (or ground) of the mosaic's regular character. This reflects the core ontological difference. Claims about "governing" vs. "summarizing" track this deep divergence. | **Humean Concedes:** Governing captures the intuitive direction of scientific explanation (laws explain events). **Governing Concedes:** The BSA provides a compelling account of how we *identify* candidate explanations (laws). |
  | **3. Source of Modality & Necessity**                                 | The (physical) necessity associated with laws is a feature of our systematization, reflecting its strength and resilience within the mosaic. | The (physical) necessity associated with laws is grounded in the irreducible nomic necessitation (N) relation between universals. | The BSA reduces nomic necessity to features of descriptive systematization (strength, best fit). The Governing view posits an irreducible modal relation (N) that *makes* the regularities necessary. This difference in the source of modality is substantive, not linguistic. | **Humean Concedes:** Governing provides a more straightforward ground for the modal force of laws. **Governing Concedes:** The BSA successfully anchors modality in the actual world without primitive modality. |
  | **4. Universals vs. Systematization**                                 | Talk of "universals" is shorthand for predicates playing key roles in the best system; their metaphysical status is derivative. | Universals are fundamental constituents of reality, and their nomic relations are what laws fundamentally are. | The disagreement concerns the metaphysical fundamentality of properties. The BSA is compatible with nominalism or a deflationary view of properties; Governing requires robust universals as the relata of the irreducible N relation. | **Humean Concedes:** Universals provide a natural ontology for predicates featuring in strong systematizations. **Governing Concedes:** Systematization is crucial for identifying *which* universals are nomically related. |
  | **5. "Governing" (Verbal & Residual)**                                | Laws "govern" only in the sense that they are highly informative summaries of the mosaic's constraints. | Laws "govern" by the nomic necessitation relation actively determining the behavior of particulars.                  | **Verbal Aspect:** Both sides agree laws "govern" in *some* sense. **Residual Disagreement:** The Humean view is *fully* captured by the summary/constraint sense. The Governing view insists the word points to an additional, irreducible *causal/metaphysical* determination relation (N) that the Humean denies exists. | **Humean Concedes:** "Govern" captures the predictive and counterfactual-supporting role of laws. **Governing Concedes:** The summary/constraint sense is a *component* of the governing role. |

  ---

  ### 3. Cruxes with Pre-Registered Predictions

  We identify the following scenarios as crucial tests for our respective views. For each, we state a shared description of the case/argument and pre-register our specific, potentially falsifiable predictions about how the world described would work under our respective metaphysical accounts.

  **Crux 1: The Copycat World**
  *   **Case Description:** Consider a world consisting of two large, spatially and causally isolated spatiotemporal regions, A and B (each containing ~10^20 spacetime points). Within each region, a sequence of events occurs that perfectly mirrors the decay pattern of an unstable particle type P. In Region A, the sequence (S_A) is generated by a genuinely indeterministic process with a 0.5 single-case chance for "decay" at each relevant point. In Region B, the sequence (S_B) is *also* generated by a genuinely indeterministic process with the same 0.5 single-case chance, *but* through an unimaginably improbable coincidence, S_B is *exactly* S_A shifted by one temporal position. No connection or common cause exists between the generative processes in A and B; the match is pure fluke. We evaluate candidate systematizations for the *entire* Humean mosaic of this world.
  *   **Relevant Argument:** The Humean (A) claims the laws are determined by the Best System. A candidate system "IND" posits independent 0.5 chances in A and B. Another candidate "COPYCAT" posits deterministic laws in B governed by the state in A one timestep prior: "The outcome in B at time t is identical to the outcome in A at time t-1." COPYCAT is extremely *strong* (it perfectly predicts all of B from A's state) and very *simple* (the rule is short). IND is also simple but much weaker (it leaves the specific sequences in A and B brute). Naïve application of BSA metrics suggests COPYCAT wins, implying the laws in B are deterministic and non-locally dependent on A. This seems absurd, as the generating story involves independent chances in B. Proponent B argues this shows the BSA cannot track the real, local, indeterministic laws that govern the processes in each region. Proponent A must either accept the counterintuitive COPYCAT laws or modify the BSA, risking ad-hoc constraints.
  *   **Pre-Registered Predictions:**
      *   **Humean (A):** *Prediction:* The Best System for the Copycat World mosaic *will not be* the COPYCAT system. A successful BSA requires that candidate systems must describe the mosaic using *local* dynamical laws. The COPYCAT "law" violates locality, as the state in B depends instantaneously (or via past-light-cone violation) on the state in a distant, causally isolated region A. Systems violating fundamental constraints like locality (understood as a crucial aspect of *scientific* simplicity/pragmatic utility) are disqualified or heavily penalized. The winning system will posit independent 0.5 chances in A and B. *Embarrassment Condition:* If analysis shows COPYCAT demonstrably wins on Lewisian simplicity/strength *even after* incorporating standard scientific constraints like locality into the simplicity metric, and no non-ad-hoc repair is found.
      *   **Governing Laws (B):** *Prediction:* The real laws governing each region are independent, local, probabilistic laws for particle decay. The COPYCAT pattern is a gigantic, flukish accident. The BSA, *if it delivers the correct result*, must build in constraints (like locality) that *presuppose* or *mimic* the structure expected from genuine governing laws. This exposes that the BSA's metrics are not purely descriptive/pragmatic but are covertly tracking mind-independent modal structure (like locality and causal independence). The case shows the BSA either gets the laws wrong or succeeds only by illicitly incorporating features definitive of the Governing view. *Embarrassment Condition:* If the BSA can deliver the correct independent-chance laws *without* smuggling in constraints that presuppose governing-law structure (e.g., via a purely syntactic or epistemic account of simplicity that naturally rejects COPYCAT).

  **Crux 2: The Cosmic Coin Flip (Induction & Stability)**
  *   **Case Description:** Consider a universe that has existed for exactly 1 billion years. Throughout its entire history up to now, a specific, fundamental type of event (e.g., the outcome of a "cosmic coin flip" occurring once per second) has *always* resulted in "Heads". We are at t=now.
  *   **Relevant Argument:** The Humean (A) must fit this pattern into the Best System. A system positing "Always Heads" is maximally simple and perfectly strong so far. However, it lacks the resilience expected of a law; a single future "Tails" would falsify it utterly. A system positing a fundamental chance Ch(Heads) = 1 - ε (for very small ε) is slightly less simple but vastly more resilient (able to accommodate future Tails). Proponent B argues that the Governing view can ground the expectation that the pattern will continue (it's law-governed) or that it was genuinely chancy, without making resilience a constitutive feature of lawhood itself. The challenge is whether the BSA can justify inductive confidence and distinguish stable laws from unstable cosmic flukes solely from the mosaic up to now.
  *   **Pre-Registered Predictions:**
      *   **Humean (A):** *Prediction:* The Best System for the mosaic up to *now* will posit either Ch(Heads)=1 (if simplicity wins out for the current mosaic) or, more plausibly, Ch(Heads) ≈ 1 (if resilience/strength over possible futures is weighted heavily). The BSA *can* justify high confidence in future Heads based on the best *current* systematization. The "fluke" vs. "law" distinction emerges from the system's strength/resilience relative to the mosaic. *Embarrassment Condition:* If analysis shows the BSA *must* (on pain of arbitrariness) treat the "Always Heads" pattern as a mere fluke with no predictive force for the future, contrary to strong scientific intuition.
      *   **Governing Laws (B):** *Prediction:* The Governing view can posit a law N(F, Heads) (making Heads necessary) *or* a probabilistic law, independently of the mosaic's temporal extent. The intuition that the pattern is likely lawlike (either deterministic or near-deterministic probabilistic) stems from the governing relation, not just systematization of past data. The BSA struggles to justify this intuition robustly without implicitly relying on assumptions about governing laws ensuring stability. *Embarrassment Condition:* If the Governing view cannot coherently state what the law *is* now (before future events) without reference to the mosaic's future development or BSA-like reasoning.

  **Crux 3: Emergent Regularities & Reducibility**
  *   **Case Description:** Imagine a world where fundamental physics is entirely deterministic and local. However, at a highly complex macro-scale, stable, exceptionless regularities emerge that *appear* lawlike (e.g., "No spontaneous decrease in entropy for isolated systems over 1 cubic meter", "All ravens are black" holding universally due to complex evolutionary/chemical constraints). These regularities supervene on the fundamental dynamics but exhibit remarkable resilience and projectability.
  *   **Relevant Argument:** The Humean (A) sees these as prime candidates for inclusion in the Best System at a higher level of description, adding significant strength for manageable complexity cost. Proponent B argues that genuine governing laws exist only at the fundamental level; macro-regularities, no matter how robust, are merely derivative "phenomenological laws" explained by, but not themselves constituted by, an irreducible N relation. They are accidental generalizations from a fundamental governing perspective, even if enormously resilient.
  *   **Pre-Registered Predictions:**
      *   **Humean (A):** *Prediction:* The Best System for this world *will* include the macro-regularities as genuine laws (or statements of chance ≈1) within its appropriate domain. The BSA naturally accommodates laws at multiple levels of description based on systematization benefits. *Embarrassment Condition:* If compelling reasons show such macro-regularities *cannot* count as laws within the BSA framework (e.g., because fundamental dynamics fully determine them, making their inclusion redundant or violating strict supervenience).
      *   **Governing Laws (B):** *Prediction:* Only the fundamental deterministic relations are genuine governing laws. The macro-regularities, while robust, are metaphysically accidental; their necessity is derivative, explained by the fundamental laws and initial conditions. They do not involve a distinct N relation at the macro level. The intuition that they *could* fail (even if physically impossible given fundamentals) reflects their non-fundamental-law status. *Embarrassment Condition:* If the Governing view cannot provide a clear, non-arbitrary criterion distinguishing fundamental governing laws from merely supervening, exceptionless macro-regularities that play an identical explanatory role within their domain.

  ---
  **Signed:**

  [Proponent A - Humean BSA]
  [Proponent B - Governing Laws (Universals/Necessitation)]

  **Date:** October 26, 2023
