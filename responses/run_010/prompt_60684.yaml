  **Q4 (for all):** Is the commitment made before or after learning the other's default?
    - Before: leaves 1a, 2a, 3a, 4a
    - After: leaves 1b, 2b, 3b, 4b

  That gives 8 leaves.

  Then we don't use Q5-Q7 for branching, but we can note that they are additional dimensions.

  ## Leaves:

  1. **Maximin with commitment before learning:**
     - Name: "Maximin commitment"
     - Most awkward commitment: You commit to a conservative strategy without knowing if the other agent is cooperative, potentially missing out on gains.
     - Without source code: Survives if you can publicly commit to a strategy that guarantees the maximin payoff.

  2. **Maximin with commitment after learning:**
     - Name: "Conditional maximin commitment"
     - Most awkward commitment: You only commit after seeing the other's action, which might be too late in some games (like the drivers' game).
     - Without source code: Might not be possible because you need to see their action before they see yours? In public announcements, you might announce conditionally.

  3. **Focal point with robustness and commitment before learning:**
     - Name: "Robust focal commitment"
     - Most awkward commitment: It requires that the focal point is common knowledge and that the commitment is robust to any deviation, which might be impossible.
     - Without source code: Survives if the focal point is public and the commitment device is public.

  4. **Focal point with robustness and commitment after learning:**
     - Name: "Conditional robust focal commitment"
     - Most awkward commitment: After seeing the other's default, you commit only if it matches the focal point, but if it doesn't, you might not commit and end up in a bad outcome.
     - Without source code: As above, might work with public conditionals.

  5. **Safe given beliefs and commitment before learning:**
     - Name: "Belief-robust commitment"
     - Most awkward commitment: If your beliefs are wrong, you are not safe.
     - Without source code: Requires that your beliefs about the other's default are correct, which might be hard without source code.

  6. **Safe given beliefs and commitment after learning:**
     - Name: "Conditional belief-robust commitment"
     - Most awkward commitment: You can wait and see, but then you might be in a suboptimal position if the other agent has already committed to exploit.
     - Without source code: Easier because you can see their public default.

  7. **Expected improvement with commitment before learning:**
     - Name: "Expected utility commitment"
     - Most awkward commitment: You might end up worse off in some cases.
     - Without source code: Survives if you can compute expectations from public information.

  8. **Expected improvement with commitment after learning:**
     - Name: "Conditional expected utility commitment"
     - Most awkward commitment: You commit after seeing their default, which might give you more information for expectation, but might not be feasible in real-time.
     - Without source code: As above.

  ### Empty cells:
  - The tree has 8 leaves, but there are 2 (robust) * 2 (variations) * 2 (before/after) + 2 (non-robust) * 2 (variations) * 2 (before/after) = 8, so no empty cells from this tree. But in reality, some combinations might be incoherent or unattractive.

  ### Incoherent or unattractive cells:
  - For example, in the robust focal point branch, commitment after learning (leaf 4) might be unattractive because if the other agent's default is not the focal point, then the commitment might not happen, and you might be in a bad state. But it's coherent.

  ### Pairs that the tree can't tell apart:
  - The tree doesn't distinguish between different methods of commitment (rewrite, delegate, cheap talk) or binding structure. So within a leaf, there are further variations.

  ### Without source code:
  - We added one line per leaf above.

  ## Final Output:

  ### Branch Questions:

  1. When you consider a commitment, must it guarantee that you are never worse off than the default outcome *no matter what the other agent does*? (Yes/No)

  2. (If Yes to 1) How do you define the default outcome for this guarantee? 
     - A: The worst possible outcome for me.
     - B: A specific outcome that we both know would happen.

  3. (If No to 1) For the commitment to be acceptable, must it guarantee that you are never worse off than the default *in every possible outcome* (given your beliefs about the other agent), or is it enough that you expect to be better off on average?
     - A: Guaranteed in every outcome given my beliefs.
     - B: Better off on average.

  4. Is the commitment made before or after learning the other agent's default action or commitment?
     - A: Before.
     - B: After.

  ### Leaves (8 in total):

  1. **Leaf 1:** 
     - Path: 1=Yes, 2=A, 4=A (Maximin, before)
     - Name: "Maximin commitment"
     - Most awkward commitment: Committing to a conservative strategy without knowing if the other is cooperative, potentially forgoing gains.
     - Without source code: Survives with public commitment to a strategy ensuring maximin payoff.

  2. **Leaf 2:**
     - Path: 1=Yes, 2=A, 4=B (Maximin, after)
     - Name: "Conditional maximin commitment"
     - Most awkward commitment: You might not be able to commit in time after seeing the other's action.
     - Without source code: May work with public conditional announcements.

  3. **Leaf 3:**
     - Path: 1=Yes, 2=B, 4=A (Focal point, before)
     - Name: "Robust focal commitment"
     - Most awkward commitment: Requires the focal point to be common knowledge and the commitment to be robust to any deviation, which may be impossible.
     - Without source code: Survives if the focal point is public and commitment device is public.

  4. **Leaf 4:**
     - Path: 1=Yes, 2=B, 4=B (Focal point, after)
     - Name: "Conditional robust focal commitment"
     - Most awkward commitment: If the other's default isn't the focal point, you might not commit and end up in a bad outcome.
     - Without source code: As above.

  5. **Leaf 5:**
     - Path: 1=No, 3=A, 4=A (Safe given beliefs, before)
     - Name: "Belief-robust commitment"
     - Most awkward commitment: If your beliefs are wrong, you might be exploited.
     - Without source code: Requires correct beliefs about the other's default, hard without source code.

  6. **Leaf 6:**
     - Path: 1=No, 3=A, 4=B (Safe given beliefs, after)
     - Name: "Conditional belief-robust commitment"
     - Most awkward commitment: You can wait and see, but then the other agent might have already committed to exploit.
     - Without source code: Easier with public information about the other's default.

  7. **Leaf 7:**
     - Path: 1=No, 3=B, 4=A (Expected improvement, before)
     - Name: "Expected utility commitment"
     - Most awkward commitment: You might end up worse off in some cases.
     - Without source code: Survives with public commitment and public information for expectations.

  8. **Leaf 8:**
     - Path: 1=No, 3=B, 4=B (Expected improvement, after)
     - Name: "Conditional expected utility commitment"
     - Most awkward commitment: The timing might not allow for conditional commitment in fast-paced interactions.
     - Without source code: As above.

  ### Empty cells:
  - In this tree, we have 8 leaves and no empty cells. But note, we have not used the other dimensions (binding structure, race condition, assumptions), so there are many cells in the full logical space that are empty. Specifically, we haven't represented:
    - The type of commitment (rewrite, delegate, cheap talk) -> 3 options not branched.
