answer: |-
  Below is a decision tree designed to help participants identify their view on cooperative gains through commitment, based on concrete scenarios without jargon. The tree has **7 branch questions** and **8 leaves** (within your 12-leaf limit). Each question is framed to be answered by imagining a two-agent scenario (e.g., drivers on a narrow road, countries disputing a shipping lane). The tree prioritizes the **risk allocation** axis (who bears the risk if you're wrong about the other agent's default behavior) and covers your other axes logically.

  ---

  ### **Decision Tree**

  1. **When you commit, must it guarantee you’re never worse off than the default *no matter what the other agent does*?**  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **How do you define the "default" for this guarantee?**  
     - **A:** Against the *worst possible outcome* for you (e.g., a head-on crash if the other driver doesn’t swerve). → **Leaf 1**  
     - **B:** Against a *specific outcome you both know* would happen without commitment (e.g., both swerve right). → **Leaf 2**  

  3. **If you might be worse off in some cases, must you *never be worse off when the other agent acts as you expect*?**  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q5.  

  4. **Do you commit *before* or *after* learning the other agent’s default action?**  
     - **Before** → **Leaf 3**  
     - **After** → **Leaf 4**  

  5. **Is it enough that you’re better off *on average* (even if you might be worse off sometimes)?**  
     - **Yes** → Go to Q6.  
     - **No** → **Leaf 5** (incoherent; see empty cells)  

  6. **Do you commit *before* or *after* learning the other agent’s default action?**  
     - **Before** → **Leaf 6**  
     - **After** → Go to Q7.  

  7. **When committing after, do you need the option to *undo* the commitment if the other agent exploits you?**  
     - **Yes** → **Leaf 7**  
     - **No** → **Leaf 8**  

  ---

  ### **Leaves**  
  Each leaf includes:  
  - **Name** (standard name or "unnamed" if none exists).  
  - **Most awkward commitment**: A concrete scenario where this view struggles.  
  - **Without source code**: Whether it works with public announcements only (no code inspection).  

  1. **Name**: Maximin Commitment  
     - **Path**: Q1=Yes, Q2=A  
     - **Most awkward commitment**: Committing to swerve left *no matter what*, even if the other driver flashes a "swerve left" signal—you miss out on mutual gains because you’re stuck avoiding the worst case.  
     - **Without source code**: Survives. Public commitments (e.g., treaties) can enforce worst-case safety.  

  2. **Name**: Focal-Point Commitment  
     - **Path**: Q1=Yes, Q2=B  
     - **Most awkward commitment**: If the “default” (e.g., both swerve right) isn’t truly mutual knowledge, you commit to swerve right but the other swerves left—causing a crash.  
     - **Without source code**: Survives. Publicly agreeing on a focal point (e.g., "always yield to oncoming traffic") works.  

  3. **Name**: Belief-Robust Commitment  
     - **Path**: Q1=No, Q3=Yes, Q4=Before  
     - **Most awkward commitment**: You publicly precommit to swerve left, expecting the other to do the same, but they precommit to swerve right—both lose.  
     - **Without source code**: Struggles. Requires correct beliefs about the other’s default; announcements alone don’t reveal intent deeply.  

  4. **Name**: Conditional Commitment  
     - **Path**: Q1=No, Q3=Yes, Q4=After  
     - **Most awkward commitment**: You wait to see the other’s default, but they accelerate—forcing you to swerve too late to avoid a crash.  
     - **Without source code**: Survives. Public conditional statements (e.g., "I yield if you flash headlights") work.  

  5. **Name**: (Incoherent view)  
     - **Path**: Q1=No, Q3=No, Q5=No  
     - **Most awkward commitment**: N/A (incoherent—if you reject both worst-case and average-case safety, no rational commitment exists).  
     - **Without source code**: N/A  

  6. **Name**: Expected Improvement  
     - **Path**: Q1=No, Q3=No, Q5=Yes, Q6=Before  
     - **Most awkward commitment**: You commit to swerve left expecting a 90% chance the other does too, but they never cooperate—you crash repeatedly.  
     - **Without source code**: Survives. Public commitments can incorporate probability (e.g., "I’ll yield based on traffic data").  

  7. **Name**: Reciprocation-Based Commitment  
     - **Path**: Q1=No, Q3=No, Q5=Yes, Q6=After, Q7=Yes  
     - **Most awkward commitment**: You only commit after seeing the other yield, but they fake yielding and then accelerate—trapping you.  
     - **Without source code**: Survives. Public conditional announcements (e.g., "I commit if you do") handle this.  

  8. **Name**: Unnamed  
     - **Path**: Q1=No, Q3=No, Q5=Yes, Q6=After, Q7=No  
     - **Most awkward commitment**: You commit after seeing the other’s default, but they exploit your irreversible commitment (e.g., you yield, they take the road).  
     - **Without source code**: Struggles. Without code inspection, you can’t ensure the other won’t fake their default action.  

  ---

  ### **Empty Cells and Indistinguishable Pairs**  
  - **Empty cells** (logically possible combinations with no leaf):  
    - **Q1=No, Q3=No, Q5=No**: Marked as **incoherent** (rejects all safety criteria).  
    - **Sequential binding reintroduces a race**: Not explicitly branched, as it’s covered by "after" commitments (Leaves 4, 7, 8). These are **unattractive but coherent** (e.g., racing to commit second to exploit the other).  
    - **Delegate/cheap-talk mechanisms**: Not branched, as they’re not core to risk allocation. These are **not explored** in the tree but fit into Leaves 2, 3, or 6.  

  - **Indistinguishable pairs**:  
    - **Leaf 3 (Belief-Robust) vs. Leaf 6 (Expected Improvement)** if beliefs align with averages. The tree distinguishes them via Q3 (certainty vs. averages), but in practice, they blur if beliefs are probabilistic.  
    - **Leaf 7 (Reciprocation) vs. Leaf 8 (Unnamed)** if "undoing" is ambiguous. The tree uses Q7 to split them, but real-world commitments may not clarify this.  

  ---

  ### **Key Notes**  
  - **Source code vs. public announcements**: Views relying on *beliefs* (Leaf 3) or *irreversible after-commitments* (Leaf 8) struggle without code inspection, as announcements can be faked. Others generally survive with public commitments.  
  - **Tree focus**: Prioritizes risk allocation (Q1–Q3) and timing (Q4, Q6, Q7), subsuming other axes (e.g., "binding structure" is covered by before/after splits, "assumptions" by Q2).  
  - **Concreteness**: All questions use driver/road or country/shipping-lane scenarios. No jargon.  

  This tree should spark discussion in your group while clarifying the logical space. Let me know if you’d like tweaks!
