prompt: |-
  I lead a weekly section of nine students attached to a second-year module on perception and knowledge. Two weeks ago they were walked through the argument from illusion in lecture and in the set textbook chapter, and the section has since settled into the view that it is decisive: asked to explain why the oar looks bent, six of the nine now produce something along the lines of "because what I'm directly aware of is a bent something-or-other," and they say it with the confidence of people who believe the hard work is already behind them. My job on Wednesday is to teach disjunctivism in twenty-five minutes at a blackboard. The aim is not to convert them but to get them to see precisely what the view denies, such that by the end they can state the common-factor assumption in their own words and explain why the argument from illusion is supposed to depend on it. Please do not explain disjunctivism to me: I have read around it and I am reasonably confident I understand the position. What I need is a plan for how to explain it.

  Three constraints shape the plan. First, I cannot simply reopen the argument from illusion by re-running it and disputing a premise. They will experience that as a stalemate of intuitions against intuitions, and I do not have the time, so the sequence needs a way of exposing the load-bearing assumption from inside an argument they already accept. Second, the case that carries the indistinguishability intuition may not be a hallucination case. One of the nine has been open with the group about a recent brief psychotic episode, and I do not want the session's central device to be "you could not have told your hallucination from a real thing," nor anything else built on psychopathology; equally I want to avoid the three cases they have already chewed through — the bent stick, the tomato seen in good light, the pink elephant. Whatever example I choose has to make subjective indistinguishability vivid enough that they feel the pull toward a common factor, while being one in which they cannot comfortably say that the object itself really was partly as it appeared. Third, I have a blackboard and no slides, so anything I write down has to earn its space.

  Format the answer as exactly five numbered items, in this order: the sequence of ideas with what each step depends on and which one of them does the load-bearing work; the example and what it must have and must lack to do the job; the misconceptions they will arrive with and the point in the sequence at which each should be headed off; the misconceptions they will generate on the way, of which I expect "so disjunctivism is claiming that hallucinations have nothing whatever in common with perceptions" to be the largest; and finally one question I can put to them at the end that will show whether the idea has landed, together with what I should say aloud that I am deliberately leaving out at this level. Each item should run to one or two sentences, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user is a philosophy instructor preparing to teach disjunctivism to second-year students in a 25-minute session. They need a lesson plan that meets specific constraints: avoid rehashing the argument from illusion, use a new non-pathological example, and work with just a blackboard. The students are currently convinced by the argument from illusion, seeing sensory awareness as always mediated by subjective appearances.

  Key challenges emerge here. The students are entrenched in the common-factor view ("directly aware of bent something-or-other"), so reopening debates would feel like intuitive stalemates. The psychotic episode disclosure means hallucination examples are ethically off-limits, requiring a fresh case that preserves indistinguishability without trauma. The blackboard-only format demands extreme economy in visual scaffolding.

  The core pedagogical task is to expose the common-factor assumption implicitly, using an example where subjectively identical experiences differ in objective reality. A mirror-based case could work well here: two identical rooms, one with a real cat and one with a perfectly mirrored wall creating a virtual cat. This maintains indistinguishability while avoiding hallucinations, and the cat's presence/absence cleanly separates perception from illusion. Crucially, the cat can't "really be partly there" in the mirrored case, blocking their usual fallback.

  For misconceptions, the "experiences share nothing" objection will likely dominate. The response must clarify that disjunctivism denies only identical mental states, not all commonalities. Timing matters—this correction should come after establishing the disjunctive structure but before discussing epistemic implications.

  The diagnostic question at the end should force articulation of the common-factor assumption in their own words. Asking why the argument from illusion requires indistinguishability to imply identical awareness will reveal whether they grasp the dependency. Deliberately omitting metaphysical commitments keeps focus on the structural point.

  Sequencing is vital. Starting from their accepted illusion example (bent stick) builds trust, then pivoting to the mirror case creates productive tension. Writing "common factor?" on the board during the mirror scenario makes the assumption visible as a choice rather than a given. The disjunctivist "or" statement then emerges as the alternative, framed as a denial of the questioned assumption.

  This approach respects the constraints while targeting the precise learning outcome: recognizing the common-factor assumption as the argument from illusion's foundation. The mirror example provides ethical vividness, the sequence avoids intuitive battles, and the board work stays minimal yet potent.
answer: |-
  1. **Sequence of Ideas:** Start with their accepted illusion example ("Why does the stick look bent?" → "Direct awareness of a bent appearance"), then introduce a new case where indistinguishability occurs without the object being partly present; the load-bearing step is contrasting this with the illusion case to reveal that "direct awareness of X" explanations *assume* indistinguishability implies identical awareness-objects, which disjunctivism denies by treating perception and non-perception as fundamentally different kinds of relation.
  2. **The Example:** Use a *perfect mirror illusion*: describe two identical rooms; in one, a real cat sits on a mat; in the other, an angled mirror perfectly reflects a hidden cat, creating an indistinguishable "mirror-cat" image. It must induce the indistinguishability intuition ("You couldn't tell which room you were in just by looking at the cat") but must lack any object that *is* "partly a cat" or "a cat appearance" (unlike the bent stick, which is a real stick), forcing the question of what you are "directly aware of" in the mirror room.
  3. **Arriving Misconceptions to Head Off:** At the start, head off "Disjunctivism must deny illusions exist" by clarifying it accepts illusions/hallucinations as real phenomena but disputes *what constitutes them*; when introducing the disjunctive claim ("Either you see the actual cat *or* it's the mirror illusion"), head off "But they look the same, so the experience must be the same inside" by stressing disjunctivism challenges whether 'the experience' is a single inner state.
  4. **Generated Misconception During:** When explaining the disjunct, expect "So disjunctivism says hallucinations/perceptions have *nothing* in common?"; counter this immediately by specifying they share *causal origins* (light patterns), *indistinguishability*, and *belief effects*, but deny an *identical mental state/object* is the common factor in awareness itself.
  5. **Closing Diagnostic Question & Omission:** Ask: "Why, according to the argument from illusion, does indistinguishability *force* us to say you're directly aware of the same thing in both the real cat and mirror cat cases?" (They should articulate the common-factor assumption). State aloud you are deliberately leaving out *how* disjunctivism metaphysically explains hallucinations without common inner objects.
