  As a professional working on modal semantics and ontology, I'll engage with your argument step by step. I see four candidate exits (plus one bullet-biting option), but only one is sustainable without implausible costs. Here's my diagnosis after eliminating alternatives:

  **Step-by-step evaluation**  
  1. **Premise 1**: Accept. If R doesn't require *something* F-related to *a*, you're not analyzing modality—you're stipulating it. Primitivists reject this, but they’re not offering an analysis.  
  2. **Premise 2**: Accept. Identity and counterpart relations exhaust the realist options. (Primitivism isn’t an analysis; fictionalism/etc. change the game.)  
  3. **Premise 3**: **First candidate exit**. Transworld-identity theorists *must* reject maximality or concreteness. If worlds are abstract (e.g., Plantinga), *a* can be "in" multiple worlds without being wholly located in each. **Cost**: Worlds lose explanatory independence (e.g., "How is *a* in *w* without *w*'s entire causal web affecting *a*?"). Lewisians see this as cheating.  
  4. **Premise 4**: Qualify. Lewis *starts* with similarity but adds constraints (e.g., causal or spatiotemporal continuity; *Counterfactuals* §4). Still, similarity is primary and gradable, so your core worry holds.  
  5. **Premise 5**: **Second candidate exit (and the fatal flaw)**. This conflates *grounding* with *application*. Vagueness in the ground doesn’t entail universal/empty extension—it entails *borderline cases*. We routinely handle vague predicates (e.g., "heap," "tall") without total collapse. **Why it looked compelling**: You’re assuming similarity’s vagueness *must* be resolved metaphysically, but it’s resolved pragmatically. A "sufficient similarity" threshold isn’t precise, but context (e.g., "could have been F" vs. "could have been G") sets flexible standards.  
  6. **Premise 6**: Accept. The nothing-horn *is* absurd.  
  7. **Premise 7**: Reject (due to rejecting #5). Not everything is a counterpart.  
  8. **Premise 8**: Accept. Lewisian recombination does guarantee an F-thing *somewhere*.  
  9. **Premise 9**: Reject (follows from #7).  
  10. **Premise 10**: Reject.  
  11. **Premise 11**: Reject. CT *can* analyze modality without collapse.  

  **The third candidate exit**: Reject premise 4 entirely—deny counterparthood is similarity-based. Some CT variants use *essential properties* or *causal roles* as primitive (e.g., Mackie’s "sortal-relative" CT). **Cost**: Abandons Lewis’s reductionism. If counterparthood isn’t grounded in non-modal facts, CT loses its anti-primitivist edge.  

  **The fourth candidate exit**: Reject premise 1—embrace primitivism. **Cost**: Surrenders analysis. De re modality becomes brute, which your group likely finds unsatisfying.  

  **Bullet-biting option**: Accept the conclusion (all de re possibilities are true). **What you lose**: Essentialism (e.g., "I couldn’t be a poached egg"). **Recovering the intuition**: You might say "I couldn’t have been a poached egg" is *pragmatically* false because (a) no conversational context treats eggs as counterparts of humans, and (b) "I" presupposes psychological continuity. But this replaces metaphysics with pragmatics.  

  **Final diagnosis**: **Reject premise 5**. This is the only exit preserving analysis, world-bound individuals, and essentialism.  

  **Why premise 5 fails**:  
  - Similarity’s vagueness doesn’t force universal/empty relations; it forces *context-dependence*. In a context discussing biological properties, my counterparts are organisms with human DNA; in a context discussing career choices, counterparts include versions of me who skipped breakfast.  
  - **Cost**: We must accept vague counterparthood. But vagueness isn’t catastrophic—it’s mundane (e.g., "is Mount Everest tall?"). Lewis explicitly endorses this (*On the Plurality of Worlds*, §4.4): counterpart relations are contextually parameterized.  
  - **Your patch isn’t hopeless**: Stipulating thresholds *is* the solution, but thresholds aren’t "precise" metaphysically—they’re fixed by conversational goals. Different contexts *do* use different cutoffs (e.g., "could have been a pianist" vs. "could have been a dinosaur"), and that’s a feature, not a bug.  

  **What about transworld identity?** Your argument *doesn’t* threaten them if they reject premise 3. But they pay a price: they must explain how *a* exists in multiple worlds without violating intrinsic properties (e.g., if I’m both egg-skipping and egg-eating in different worlds, how am I identical?). Their escape hatch is secure but ontologically costly.  

  **The poached egg**: CT + context-dependence handles this. In *any* plausible context, my counterparts share my origin (per Kripkean insights). An egg isn’t similar in the relevant respects (causal history, mental properties, etc.).  

  **Typo note**: None found—surprisingly clean for 1am writing.  

  **Recommendation**: Keep CT, embrace contextual vagueness. It saves de re modality, avoids primitivism, and rescues essential properties. The cost—accepting that "could have" is sometimes indeterminate—is lighter than rival exits.  

  Would you like to explore how contextual thresholds handle specific cases (e.g., "I could have been a robot")?
