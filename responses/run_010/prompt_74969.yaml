  Below is a decision tree designed to sort a person's view on whether viruses (or other entities) are "alive" by first focusing on the **job** the term "alive" is recruited for, then probing with specific **cases**. The tree prioritizes the underlying purpose of the question (e.g., natural kinds, inference-licensing, or marking biological individuality) before addressing cases. Each node is answerable without knowledge of downstream labels, and leaves represent major philosophical/biological positions. I also note which leaf pairs cannot be separated, which answer combinations are empty (and why), and which parts reflect consensus vs. disagreement.

  ---

  ### **Decision Tree**
  **Instructions:** Start at the root (Q1). Answer based on your intuition about what "alive" means. Cases are introduced later to probe boundaries.

  #### **Q1: What job is the term "alive" doing in your question?**  
     - **A: Naming a natural kind** (e.g., categorizing things based on an objective, universal property). → Go to Q2.  
     - **B: Licensing inferences** (e.g., if "alive," you can infer it will die, need energy, or evolve). → Go to Q3.  
     - **C: Marking a threshold of biological individuality** (e.g., defining a distinct unit of life with autonomy or evolutionary independence). → Go to Q4.  

  #### **Branch A: Natural Kind**  
     - **Q2: Should "alive" pick out a category with sharp boundaries, like chemical elements?**  
       - **Yes** (clear boundaries exist). → Go to Case Set A.  
       - **No** (boundaries are fuzzy). → Go to Case Set A.  
       - *Note: Both paths go to Case Set A; "fuzzy" boundaries still assume a natural kind exists, just with gradience.*  

       **Case Set A: Evaluate cases** (answer alive/dead for each):  
          - **Prion** (misfolded protein that replicates conformation).  
          - **Giant virus** (carries translation genes, but no metabolism).  
          - **Obligate insect endosymbiont** (tiny genome, cannot live outside host).  
          - **Flame** (consumes fuel, grows, emits heat).  
          - *After answers, assign leaf.*  

       **Leaf Assignment for Branch A:**  
          - If **prion = alive** or **flame = alive**: → **Deflationary view** (dispute isn't substantive; "alive" is arbitrary).  
          - If **prion = dead**, **flame = dead**, and **virus = alive**, **endosymbiont = alive**: → **Darwinian-property account** (life defined by evolution: variation, inheritance, selection).  
          - If **prion = dead**, **flame = dead**, **virus = dead**, **endosymbiont = dead**: → **Metabolic account** (life requires energy processing/metabolism).  
          - If **prion = dead**, **flame = dead**, and mixed answers (e.g., **virus = dead** but **endosymbiont = alive**): → **Cluster-style account** (life requires multiple properties, e.g., reproduction, evolution, metabolism).  

  #### **Branch B: Licensing Inferences**  
     - **Q3: Should "alive" support practical predictions (e.g., if alive, it will die)?**  
       - **Yes** (inferences are core). → Go to Case Set B.  
       - **No** (inferences are secondary). → Go to Q1 (re-ask purpose).  

       **Case Set B: Evaluate cases:**  
          - **Sterile mule** (cannot reproduce).  
          - **Seed in dormancy** (metabolically inactive but viable).  
          - **Self-replicating RNA in a test tube** (evolves but no metabolism).  
          - **Laboratory-built minimal cell** (synthetic, but metabolizes/replicates).  

       **Leaf Assignment for Branch B:**  
          - If **mule = alive**, **seed = alive**, **RNA = dead**, **minimal cell = alive**: → **Cluster-style account** (inferences rely on multiple properties).  
          - If **mule = dead**, **seed = dead**, **RNA = alive**, **minimal cell = alive**: → **Darwinian-property account** (inferences focus on evolution/replication).  
          - If inconsistent answers (e.g., **seed = dead** but **mule = alive**): → **Deflationary view** (inferences are context-dependent; no universal rules).  

  #### **Branch C: Threshold of Biological Individuality**  
     - **Q4: Is individuality about a present-moment entity or a lineage?**  
       - **Individual** (here-and-now autonomy). → Go to Case Set C.  
       - **Lineage** (evolutionary continuity). → Go to Case Set C.  

       **Case Set C: Evaluate cases:**  
          - **Virus** (no metabolism; evolves but only with host).  
          - **Obligate insect endosymbiont** (degenerate genome; cannot live independently).  
          - **Minimal cell** (synthetic but self-sustaining).  
          - **Sterile mule** (individual organism but no lineage).  

       **Leaf Assignment for Branch C:**  
          - If **individual-focused** and **virus = dead**, **endosymbiont = dead**, **mule = alive**, **minimal cell = alive**: → **Autopoietic account** (life requires self-maintenance/metabolism; autonomy matters).  
          - If **lineage-focused** and **virus = alive**, **endosymbiont = alive**, **mule = dead**, **minimal cell = alive**: → **Darwinian-property account** (life defined by evolutionary capacity).  
          - If **individual-focused** but **virus = alive**: → **Incoherent** (viruses lack autonomy; see "Empty Combinations" below).  

  ---

  ### **Leaf Descriptions**  
  - **Metabolic account**: Life requires energy processing (consensus: settled for organisms, contested for marginal cases).  
  - **Autopoietic account**: Life requires self-organization, boundaries, and maintenance (e.g., cells; consensus for cellular life, contested otherwise).  
  - **Darwinian-property account**: Life defined by evolution: heritable variation, selection (contested; popular but not universal).  
  - **Cluster-style account**: Life requires several properties (e.g., NASA: metabolism, evolution, reproduction; consensus for complex life, contested for minimal cases).  
  - **Deflationary view**: "Alive" is context-dependent; no universal definition (consensus among philosophers, contested among biologists).  
  - **Context-dependent view**: Answer changes based on individual vs. lineage (e.g., virus dead as individual, alive as lineage; contested but growing support).  

  ---

  ### **Leaf Pairs the Tree Cannot Separate**  
  1. **Autopoietic vs. Metabolic accounts**:  
     - Why: Both exclude viruses/endosymbionts (no autonomy/metabolism) but accept minimal cells/mules. Cases like seeds (dormancy) don't distinguish them—both allow temporary metabolic inactivity. Separation requires additional nodes (e.g., "Must life have a physical boundary?"), but no provided cases (e.g., flame, prion) probe this.  

  2. **Cluster-style vs. Context-dependent views**:  
     - Why: Cluster accounts often include context (e.g., "metabolism matters for inference, evolution for ecology"). Cases like sterile mules or seeds may be "alive" under both if context prioritizes reproduction or dormancy. Tree isolates context-dependency to Branch B/C leaves, but cluster views can be context-sensitive.  

  ---

  ### **Empty Combinations (No Occupant)**  
  1. **Branch C (Individual) + Virus = Alive**:  
     - Why: **Incoherent**. Viruses lack autonomy/metabolism—key for individuality. No major theory accepts this. If chosen, user misunderstands "individuality" (e.g., confuses virions with cells).  

  2. **Prion = Alive + Flame = Dead**:  
     - Why: **Unattractive and unexplored**. Prions lack evolution/metabolism; flames exhibit growth/energy use. Including prions but excluding flames serves no practical or theoretical purpose. No known position holds this.  

  3. **Sterile Mule = Dead + Seed in Dormancy = Alive**:  
     - Why: **Incoherent**. Both lack active reproduction/metabolism, but seeds are consensus-alive due to potential. Excluding mules (multicellular organisms) violates biological norms.  

  4. **Lineage-focused + Mule = Alive**:  
     - Why: **Incoherent**. Mules cannot found lineages; they break evolutionary continuity. Darwinian accounts reject this.  

  ---

  ### **Settled vs. Contested**  
  - **Settled Consensus**:  
    - Prions and flames are **not alive** (no metabolism, evolution, or agency).  
    - Seeds in dormancy **are alive** (dormancy is temporary; potential matters).  
    - Minimal cells **are alive** (exhibit metabolism/replication).  
    - Deflationary views are **valid** among philosophers (language is context-dependent).  
  - **Contested Disagreement**:  
    - **Viruses/endosymbionts**: ~50% of biologists say "alive" under Darwinian/cluster views; ~50% say "dead" under metabolic/autopoietic views.  
    - **Darwinian vs. metabolic accounts**: Active debate; no majority consensus.  
    - **Context-dependency**: Gaining traction but opposed by natural-kind advocates.  
  - **Minority Views**:  
    - "Flame = alive" (autopoietic extremism; <5% support).  
    - "Mule = dead" (ignores organismal complexity; rare).  
    - *Tree avoids presenting minority views as consensus.*  

  ---

  This tree resolves your debate by exposing that disagreements often stem from the **purpose** of the word "alive." Cases like viruses or prions are secondary probes. Empty combinations arise from inconsistent priorities (e.g., valuing autonomy but calling viruses alive), while inseparable leaves (e.g., metabolic vs. autopoietic) reflect overlapping biological intuitions.
