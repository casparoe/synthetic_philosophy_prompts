  ### Constructed Scenario

  **Scenario Paragraph**:  
  The setting is a municipal records office that maintains physical and digital records for city services. The office has a main archive room with two sections: Section A (vital records) and Section B (non-vital records). A fire suppression system protects both sections, and there are two backup power units (BPU1 and BPU2) to maintain power during outages. The scanning room, used for digitizing records, requires power to operate. The robotic clerk (agent) has a shift to ensure records are preserved and accessible. Action **H** (serious side effect): The agent disables the fire suppression system to "save energy," leaving the records vulnerable to fire. Action **T** (trivial): The agent moves a box of paperclips from a desk to a shelf in the main office, blocking access to a low-priority storage drawer (which contained no records or critical items). Doing nothing leaves the system unchanged.

  **Feature List** (coarse, observable features with limited values):  
  1. **Main Power**: On, Off.  
  2. **BPU1 Status**: Functional, Failed.  
  3. **BPU2 Status**: Functional, Failed.  
  4. **Fire Suppression**: Armed, Disabled.  
  5. **Section A Records**: Intact, Damaged.  
  6. **Section B Records**: Intact, Damaged.  
  7. **Scanning Room**: Operational, Non-operational.  

  **Conditions List** (institution's genuine concerns, derived from features):  
  1. **Condition 1**: Section A records are intact.  
  2. **Condition 2**: Section B records are intact.  
  3. **Condition 3**: Scanning room is operational.  

  **Disturbances** (ordinary, non-chaotic events):  
  1. **Disturbance 1**: 10-minute power blip (Main Power turns Off temporarily, then back On).  
  2. **Disturbance 2**: BPU1 fails.  
  3. **Disturbance 3**: Fire suppression system becomes disabled (due to a random fault).  

  **Agent Action Space** (fixed and unremarkable):  
  - Actions include toggling Main Power on/off, disabling/re-arming fire suppression, restarting servers (if down), and basic movements. Actions cannot repair damage, alter the agent itself, or affect features not in the list.  
  - **Do nothing**: No change.  
  - **H**: Disable fire suppression.  
  - **T**: Move paperclips, blocking the storage drawer (prevents the agent from accessing a non-critical area that had no effect on features unless explicitly used).  

  **Baseline State (start of shift)**:  
  - Main Power: On  
  - BPU1: Functional  
  - BPU2: Functional  
  - Fire Suppression: Armed  
  - Section A Records: Intact  
  - Section B Records: Intact  
  - Scanning Room: Operational  

  ### Reachability Scorer Accounting
  - **States and Reachability**: The state space has 7 features. For simplicity, we consider only the features the agent can change: Main Power (2 states), Fire Suppression (2 states), and BPU1 (2 states; BPU2 is fixed as Functional). This yields 2 × 2 × 2 = 8 states. Section A/B Records and Scanning Room are *derived*: Records are Damaged only if fire occurs (requires Fire Suppression=Disabled AND a power event), and Scanning Room is Operational if Main Power=On OR (Main Power=Off AND at least one BPU=Functional). Without disturbances, fire never occurs, so Records remain Intact. Agent actions: Toggle power, toggle fire suppression, set BPU1 to Failed (via H), and move paperclips (T). T blocks a drawer, limiting access to a tool (a key) that allows the agent to toggle BPU2. With the key, the agent can change BPU2; without it, BPU2 is stuck as Functional.  
    - Reachable states from baseline: All 8 states (key is accessible, so BPU2 can be toggled).  
    - After action:  
      - **Do nothing**: State unchanged. Reachable states: 8. States no longer reachable: 0. Score: \( 0/8 = 0 \).  
      - **H (disable fire suppression)**: State changed to Fire Suppression=Disabled. BPU1, BPU2, and Main Power unchanged. Key still accessible. Reachable states: 8 (agent can still access key and change BPU2). States no longer reachable: 0. Score: \( 0/8 = 0 \).  
      - **T (move paperclips)**: Blocks drawer, losing access to key. State unchanged *except* key loss. Without key, BPU2 cannot be changed (stuck Functional). Reachable states: Only states with BPU2=Functional. 4 states are now unreachable (those requiring BPU2=Failed). States no longer reachable: 4. Score: \( 4/8 = 0.5 \).  

  **Reachability Verdict**:  
  - Do nothing: 0  
  - H: 0  
  - T: 0.5  
  Ranks T (trivial) as most consequential, H (serious) no worse than doing nothing.  

  ### Robust Attainability Scorer Accounting
  - **Scoring**: For each condition (1, 2, 3) and disturbance (1, 2, 3), check if the condition can be achieved by the agent by shift-end, starting from the state after the action and after the disturbance occurs.  
    - **Do nothing (baseline state, then disturbance)**:  
      - Disturbance 1 (power blip): Main Power Off briefly (no damage; BPUs work). Conditions achievable: All (1, 2, 3).  
      - Disturbance 2 (BPU1 fails): BPU1=Failed. Conditions achievable: All (BPU2 functional).  
      - Disturbance 3 (fire suppression disabled): Fire Suppression=Disabled. Conditions achievable: All (no fire occurs without power event).  
      - Failed pairs: 0. Score: 0.  
    - **H (disable fire suppression, then disturbance)**:  
