  Part 1: Request for Proposals (RFP)
  - Includes functional requirements that are bureaucratic restatements of Arrow's conditions.

  Part 2: Bid evaluation memo
  - The procurement officer reviews bids and rejects each for technically correct reasons, including at least one that declines the question as asked (like approval voting). 
  - At least four escape routes from Arrow's theorem should appear (e.g., domain restriction, cardinal methods, randomization, etc.). 
  - One bid is rejected because it doesn't comply with the input specification (e.g., using approval ballots when the RFP requires strict rankings).

  Part 3: The sole-source award and addendum
  - The town awards to a longtime resident (effectively a dictator) because it's the only compliant bid.
  - Then, after public outcry, the council strengthens the non-dictatorship clause, making no bids compliant.
  - The procurement officer recommends settling by a show of hands at the next meeting.

  We also include a dissenting note from a council member about the list of alternatives.

  Let's invent names and details:
  - Township: We'll call it "Haven Township"
  - Procurement Officer: Gerald Fitzwilliam
  - Clerk: Martha Abernathy
  - Council Members: 
    - Chair: Councilor Robert Dunning
    - Dissenting member: Councilor Evelyn Shaw
    - Others: Councilor James Holt, Councilor Patricia Vance
  - Vendors: We'll create several, each with a bid that fails for a different reason.

  Document numbers: 
  - RFP: RFP-2024-007
  - Bid Evaluation Memo: MEMO-2024-007-01
  - Addendum: ADD-2024-007-01

  We'll write the RFP first.

  ---

  **Part 1: Request for Proposals**

  Document Number: RFP-2024-007  
  Issuing Office: Haven Township Procurement  
  Date: April 1, 2024  
  Subject: Request for Proposals for a Resident Preference Aggregation System  

  **1. INTRODUCTION**  
  Haven Township (“Township”) seeks proposals for the provision of a Resident Preference Aggregation System (“System”) to facilitate collective decision-making in matters of municipal policy and resource allocation. The System must be fair, transparent, and resistant to strategic manipulation. Proposals must be received by the Office of the Clerk no later than 5:00 PM on April 30, 2024.  

  **2. BACKGROUND**  
  Following the unsatisfactory performance of the previously deployed Condorcet-Borda Hybrid Method (Contract No. 2022-015), which was found to be susceptible to tactical misrepresentation of preferences by residents during the 2023 Community Center Renovation vote, the Township requires a robust replacement. The new System must avoid all such vulnerabilities.  

  **3. FUNCTIONAL REQUIREMENTS**  
  The System must satisfy the following mandatory requirements:  

  **3.1. Universal Resident Input Acceptance (Clause 7.1)**  
  The System shall accept, without precondition or screening, any configuration of resident inputs, provided each input is a complete, transitive, and strict ordering of the available alternatives. The System must function without imposing restrictions on the content, diversity, or distribution of resident inputs.  

  **3.2. Unanimity Responsiveness Warranty (Clause 7.2)**  
  If every resident indicates a strict preference for one alternative over another, the System’s output must reflect that same strict preference.  

  **3.3. Independence of Contextual Alternatives (Clause 7.3)**  
  The System’s determination of the relative standing between any two alternatives must depend solely on the residents’ indicated preferences between those two and must not be affected by the presence, absence, or relative promotion of any third alternative.  

  **3.4. Anti-Single-Vendor-Dependency and Anti-Nepotism Provision (Clause 7.4)**  
  The System’s output must not be determined by the input of a single resident. Furthermore, the System must not exhibit any bias toward, or dependency upon, any individual resident or group of residents related by blood, marriage, or cohabitation.  

  **4. SUBMISSION REQUIREMENTS**  
  ... [Standard boilerplate about format, etc.] ...  

  **5. EVALUATION CRITERIA**  
  ... [Standard boilerplate] ...  

  Prepared by:  
  Gerald Fitzwilliam  
  Procurement Officer, Haven Township  

  Approved by:  
  Robert Dunning  
  Chair, Haven Township Council  

  ---

  **Part 2: Bid Evaluation Memo**

  Document Number: MEMO-2024-007-01  
  To: Haven Township Council  
  From: Gerald Fitzwilliam, Procurement Officer  
  Date: May 15, 2024  
  Subject: Evaluation of Proposals for Resident Preference Aggregation System (RFP-2024-007)  

  **1. OVERVIEW**  
  Six proposals were received in response to RFP-2024-007. Each was evaluated against the mandatory functional requirements (Clauses 7.1-7.4). All proposals were found non-compliant, except one (discussed in Section 3).  

  **2. EVALUATION OF NON-COMPLIANT PROPOSALS**  

  **2.1. Vendor: Majority Rules Inc.**  
  *Proposal:* A pairwise majority method with a fallback to Borda count in the event of a cycle.  
  *Evaluation:*  
  - Failed Clause 7.3 (Independence of Contextual Alternatives): The fallback to Borda count introduces dependence on the full set of alternatives.  
  - Failed Clause 7.4 (Anti-Nepotism): The method is vulnerable to strategic manipulation (as evidenced in the 2023 incident) and may effectively grant undue influence to blocs of residents coordinating their inputs.  
  *Recommendation: Reject.*  

  **2.2. Vendor: Points-Based Solutions LLC**  
  *Proposal:* A points system (range voting) where residents assign scores to alternatives.  
  *Evaluation:*  
  - Failed Clause 7.1 (Universal Resident Input Acceptance): The proposal does not require residents to submit complete, strict orderings. Instead, it accepts scores. This is non-compliant with the input specification.  
  *Note:* The vendor’s technical merits (e.g., resistance to cloning) are irrelevant to compliance.  
  *Recommendation: Reject.*  

  **2.3. Vendor: Condorcet Systems Co.**  
  *Proposal:* A Condorcet method (ranked pairs) that always selects the Condorcet winner if one exists.  
  *Evaluation:*  
  - Failed Clause 7.3 (Independence of Contextual Alternatives): The ranked pairs procedure uses the full set of alternatives to break cycles, violating independence.  
  - Failed Clause 7.4 (Anti-Nepotism): The method is known to be vulnerable to strategic nomination of alternatives (cloning).  
  *Recommendation: Reject.*  

  **2.4. Vendor: Fair Draw Associates**  
  *Proposal:* A randomized system that selects an alternative with probability proportional to a Borda-like score.  
  *Evaluation:*  
  - Failed Clause 7.3 (Independence of Contextual Alternatives): The scoring mechanism depends on the full set of alternatives.  
  - Failed Clause 7.2 (Unanimity Responsiveness Warranty): It is possible that an alternative unanimously preferred to another may have a lower probability of selection.  
  *Recommendation: Reject.*  

  **2.5. Vendor: Single-Peak Analytics**  
  *Clarification Question (dated April 15, 2024):* “Do the preferences of Haven Township residents typically exhibit single-peakedness along a unidimensional ideological corridor?”  
  *Officer’s Reply (April 16, 2024):* “The Township imposes no restrictions on resident inputs (Clause 7.1). The System must function without such assumptions.”  
  *Proposal:* A method that assumes single-peaked preferences and uses a median voter mechanism.  
  *Evaluation:*  
  - Failed Clause 7.1 (Universal Resident Input Acceptance): The method only functions correctly when inputs are single-peaked. It does not accept any configuration.  
  *Recommendation: Reject.*  

  **3. EVALUATION OF COMPLIANT PROPOSAL**  

  **3.1. Vendor: Albert G. Thorne (Sole Proprietor)**  
  *Proposal:* The System shall output the strict ordering provided by Mr. Thorne, a lifelong resident of Haven Township (with proof of residency since 1952).  
  *Evaluation:*  
  - Compliant with Clause 7.1: Accepts any configuration of resident inputs (though it ignores them).  
  - Compliant with Clause 7.2: If every resident prefers A to B, then Mr. Thorne’s ordering must also (by his attestation) reflect that preference.  
  - Compliant with Clause 7.3: The relative standing of any two alternatives is determined solely by Mr. Thorne’s preferences, independent of other alternatives.  
  - Compliant with Clause 7.4: Mr. Thorne is not a vendor in the traditional sense and has no familial relationship to any council member (per attached affidavit).  
  *Recommendation: Award as the sole compliant bidder.*  

  **4. RECOMMENDATION**  
  Award the contract to Albert G. Thorne.  

  Respectfully submitted,  
  Gerald Fitzwilliam  
  Procurement Officer, Haven Township  

  ---

  **Part 3: Addendum and Dissent**

  Document Number: ADD-2024-007-01  
  To: Haven Township Council  
  From: Gerald Fitzwilliam, Procurement Officer  
  Date: June 5, 2024  
  Subject: Addendum to RFP-2024-007 and Subsequent Developments  

  **1. COUNCIL ACTION**  
  On May 20, 2024, the Council voted 3-1 to approve the award to Albert G. Thorne (Contract No. 2024-007-01).  

  **2. PUBLIC RESPONSE AND AMENDMENT**  
  Following public outcry over the award, the Council convened an emergency session on May 25, 2024. By unanimous vote (with Councilor Shaw abstaining), the Council amended RFP-2024-007 to strengthen Clause 7.4 (Anti-Single-Vendor-Dependency and Anti-Nepotism) as follows:  

  “The System’s output must not be determined by, or correlated with, the input of any single resident, and must reflect the aggregated inputs of all residents.”  

  **3. RE-ISSUANCE AND EVALUATION**  
  The amended RFP was re-issued as RFP-2024-007-Rev1. The sole bidder from the previous round, Albert G. Thorne, declined to submit a revised proposal. No other bids were received.  

  **4. RECOMMENDATION**  
  No responsive bids were received for RFP-2024-007-Rev1. I recommend that the Council settle this matter by a show of hands at the next regular meeting.  

  **5. DISSENTING NOTE (Attached)**  
  From: Councilor Evelyn Shaw  
  Date: June 4, 2024  

  “The entire procurement was flawed from the outset. The functional requirements were impossible to jointly satisfy, as evidenced by the failure of every bid. Moreover, the evaluation process focused on the bids’ compliance with the requirements without ever questioning the list of alternatives against which the bids were scored. The Township’s insistence on an exhaustive set of alternatives, combined with the demand for independence from irrelevant ones, created a self-defeating circularity. The real issue is that we never controlled the agenda of alternatives, and no aggregation method can be immune to that. But even if we had, the fundamental constraints remain.”  

  Respectfully submitted,  
  Gerald Fitzwilliam  
  Procurement Officer, Haven Township  

  ---

  This document satirizes the township's approach by having them issue an RFP that is effectively Arrow's theorem in bureaucratic language, then reject all the real voting methods for the right reasons, and finally award to a dictator. The addendum shows them strengthening the non-dictatorship clause and then having no solution, leading to a show of hands (which is itself a voting method that fails independence and can be cyclic). The dissenting note touches on agenda control but in a way that doesn't actually solve the problem. 

  The satire should work for those familiar with social choice theory, while the bureaucratic farce should be evident to anyone.
