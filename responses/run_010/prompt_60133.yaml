  ### HAVEN TOWNSHIP PROCUREMENT OFFICE  
  **Document No.: RFP-2024-019**  
  **Issue Date:** October 3, 2024  
  **Subject:** Request for Proposals for a Resident Preference Aggregation System  

  #### 1. PURPOSE  
  Haven Township ("Township") solicits proposals for a turnkey Resident Preference Aggregation System ("System") to facilitate collective decision-making on municipal initiatives. The System must convert resident preferences into a coherent, transitive, and defensible township-wide ranking of policy alternatives. Proposals must demonstrate strict adherence to all functional requirements herein.  

  #### 2. BACKGROUND  
  The Township previously utilized the "Condorcet-Borda Hybrid" (Contract No. 2021-012) for park redevelopment prioritization. Post-implementation audit revealed resident coalitions strategically misrepresented preferences to distort outcomes. Consequently, this RFP mandates absolute resistance to tactical input manipulation.  

  #### 3. FUNCTIONAL REQUIREMENTS  
  ##### 3.1. Universal Input Acceptance (Clause 5.1a)  
  The System shall ingest any resident-submitted strict ranking of alternatives. No pre-screening, validation, or restriction of input patterns is permitted. The System must process all configurations of resident preferences, including those exhibiting maximal heterogeneity.  

  ##### 3.2. Unanimity Compliance Warranty (Clause 5.1b)  
  Where all participating residents report a strict preference for Alternative A over Alternative B, the System’s output must reflect a strict preference for A over B.  

  ##### 3.3. Contextual Independence Guarantee (Clause 5.1c)  
  The System’s relative ranking of any two alternatives (X vs. Y) must derive exclusively from resident preferences over the pair (X,Y). Output must be invariant to the inclusion, exclusion, or re-ranking of any third alternative Z.  

  ##### 3.4. Anti-Monopoly and Kinship Exclusion (Clause 5.1d)  
  System output must not replicate any single resident’s submitted ranking. No resident, nor any consortium of residents related by blood, marriage, or cohabitation, may exert determinative influence.  

  #### 4. SUBMISSION INSTRUCTIONS  
  [... Standard procurement boilerplate ...]  
  **Issuing Officer:** Gerald Fitzwilliam, Procurement Officer  
  **Approved:** Martha Abernathy, Township Clerk; Haven Township Council (Robert Dunning, Chair)  

  ---

  ### MEMORANDUM  
  **Document No.: EVAL-2024-019-01**  
  **To:** Haven Township Council  
  **From:** Gerald Fitzwilliam, Procurement Officer  
  **Date:** November 14, 2024  
  **Subject:** Bid Evaluation for Resident Preference Aggregation System (RFP-2024-019)  

  #### 1. EXECUTIVE SUMMARY  
  Seven proposals received. Six non-compliant with mandatory clauses. One fully compliant bid recommended for award.  

  #### 2. NON-RESPONSIVE BID ANALYSIS  
  ##### 2.1. Vendor: Plurality Systems Ltd.  
  *Method:* First-past-the-post (highest vote share wins).  
  *Deficiency:* Violates Clause 5.1c (Contextual Independence). Example: Introducing alternative Z identical to X splits X’s vote, altering X vs. Y outcome. Non-compliant.  

  ##### 2.2. Vendor: Cardinal Metrics Inc.  
  *Method:* Residents assign alternatives scores (0–10); highest average wins.  
  *Deficiency:* Violates Clause 5.1a (Universal Input). Proposal requires cardinal scores, not strict rankings. Inputs fail format specification. Non-compliant.  

  ##### 2.3. Vendor: Majority Rule Co.  
  *Method:* Pairwise majority comparisons; top cycle-resolver via Borda count.  
  *Deficiencies:*  
  - Violates Clause 5.1c (Contextual Independence): Borda fallback uses full alternative set to resolve cycles.  
  - Violates Clause 5.1d (Anti-Monopoly): Method is demonstrably manipulable (per 2021-012 audit), enabling blocs to exert determinative influence.  
  Non-compliant.  

  ##### 2.4. Vendor: FairDraw Consulting  
  *Method:* Randomly selects resident; adopts their ranking.  
  *Deficiencies:*  
  - Violates Clause 5.1b (Unanimity): If all prefer A≻B, random selection may output B≻A if dictator prefers B.  
  - Violates Clause 5.1d (Anti-Monopoly): Output replicates single resident’s input. Non-compliant.  

  ##### 2.5. Vendor: MedianVote LLC  
  *Clarification Query (Oct. 10, 2024):* "Do resident preferences align along a single left-right spectrum?"  
  *Officer Reply (Oct. 11, 2024):* "Clause 5.1a forbids presuming input patterns. System must accept *any* configuration."  
  *Method:* Assumes single-peaked preferences; outputs median ideal point.  
  *Deficiency:* Violates Clause 5.1a (Universal Input). Fails when preferences are not single-peaked. Non-compliant.  

  ##### 2.6. Vendor: Approval Ballot Co.  
  *Method:* Residents approve/disapprove each alternative; most approvals wins.  
  *Deficiency:* Violates Clause 5.1a (Universal Input). Binary approvals do not constitute strict rankings. Non-compliant.  

  #### 3. COMPLIANT BID  
  ##### 3.1. Vendor: Albert G. Thorne (Sole Proprietor)  
  *Method:* Outputs Mr. Thorne’s personal strict ranking (attached). Ignores resident inputs.  
  *Compliance:*  
  - Clause 5.1a: Accepts any resident input (though inputs are unused).  
  - Clause 5.1b: If all prefer A≻B, Mr. Thorne attests he will always rank A≻B (Notarized Affidavit, Appendix A).  
  - Clause 5.1c: Output based solely on Mr. Thorne’s preferences; irrelevant alternatives do not affect X vs. Y.  
  - Clause 5.1d: Mr. Thorne is not a resident consortium. No kinship ties to council members (disclosure filed).  
  Fully compliant.  

  #### 4. RECOMMENDATION  
  Award contract to Albert G. Thorne. Cost: $1,200 (data entry services).  

  ---

  ### ADDENDUM  
  **Document No.: ADD-2024-019-01**  
  **To:** Haven Township Council  
  **From:** Gerald Fitzwilliam, Procurement Officer  
  **Date:** December 1, 2024  
  **Subject:** Post-Award Revisions for RFP-2024-019  

  #### 1. SOLE-SOURCE AWARD EXECUTION  
  Contract 2024-019-01 executed with Albert G. Thorne on November 20, 2024. System operational December 1, 2024.  

  #### 2. PUBLIC FEEDBACK AND COUNCIL ACTION  
  Residents protested System’s reliance on Mr. Thorne. On November 25, 2024, Council unanimously amended Clause 5.1d to read:  
  > "Output must not derive from any single resident’s preferences and must incorporate all resident inputs equally."  

  #### 3. RE-EVALUATION OF BIDS  
  All prior bids re-assessed against amended Clause 5.1d:  
  - Albert G. Thorne’s bid now non-compliant (output derived from single resident).  
  - No bids satisfy amended requirements.  

  #### 4. RECOMMENDATION  
  No responsive bids. Suspend procurement. Recommend Council resolve policy rankings via show of hands at meetings until new System procured.  

  #### 5. DISSENTING OPINION (Councilor Evelyn Shaw)  
  "The RFP’s failure was inevitable. We demanded independence from ‘irrelevant’ alternatives but let vendors define ‘relevant’ alternatives. No method can be context-independent when we don’t control the alternative set. Fixing *that* might have helped, but even then, our requirements were self-canceling."  

  **Attest:**  
  Gerald Fitzwilliam, Procurement Officer  
  Martha Abernathy, Township Clerk  

  ---  
  *End of Document*  

  ### SATIRICAL NOTES (FOR CONTEXT ONLY, NOT PART OF DELIVERABLE)  
  This file satirizes institutional blindness to Arrow’s theorem by mirroring its conditions in municipal procurement jargon: Unrestricted Domain (Clause 5.1a), Pareto (5.1b), IIA (5.1c), and Non-Dictatorship (5.1d, later strengthened). The bids represent FPTP (spoilers), cardinal voting (input format rejection), Condorcet methods (cycles/manipulability), random dictatorship (Pareto/dictatorship failure), domain restriction (single-peakedness), and approval voting (input rejection). The township’s reflexive response to failure—tightening specs rather than questioning trade-offs—culminates in the council adopting the one "compliant" method (dictatorship), then banning it after outcry, leaving only a cycle-prone show of hands. Councilor Shaw’s dissent highlights agenda control without resolving the core impossibility, underscoring the theorem’s inescapability. The satire operates through bureaucratic literalism, requiring no knowledge of Arrow but resonating darkly with those who recognize the constraints.
