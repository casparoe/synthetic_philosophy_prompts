prompt: |-
  For the past two years I have sat on the model-welfare review group at a lab that does a great deal of reinforcement learning. Our charge is deliberately narrow: to flag systems for which there is a non-negligible chance that the reward signal functions as valence — that is, that low reward is bad for the system in something like the way that pain is bad for an animal — where a flag triggers changes in how the system is trained, deployed, and eventually shut down. The group has eight members, most of them engineers, and only one of them writes her reasoning down. She is a philosopher, and without anyone deciding anything she has become the standard the rest of us defer to, which means we have adopted a criterion by accretion and none of us could state it. I want to state it, or rather to state the several things it might be, before next month's meeting. Her rulings to date: a tabular Q-learning agent in a gridworld, where reward is attached to goal squares, values are rewritten during the episode, and nothing whatever is carried across when the episode ends — not a candidate. A frozen foundation model served with best-of-32 sampling, where a separate reward model scores the completions and the highest-scoring one is returned while the generator itself is left untouched — not a candidate; her memo remarks that in that setup the reward never gets inside the system. A conversational agent that carries a numeric satisfaction variable in its context window, updates it every turn, and can read it out and reason about it, but where the number is computed by an external monitor from human rater feedback and injected into the prompt, and where the policy is reinitialised from the same checkpoint at every session and learns nothing — not a candidate. A model-based control agent for a simulated body with fuel, temperature, and damage variables, whose learned world model includes an estimate of its own future reward, whose policy is recurrent, whose credit assignment spans delays of several hundred steps, and whose reward is defined over its own homeostatic integrity — a candidate. An artificial-life agent in an open-ended environment whose avoidances and appetites differ across lineages depending on the environment each was raised in, with persistent memory and a value estimate it consults while planning — a candidate. And a proprietary production agent about which the group could establish only that it is trained with RL on a scalar reward and served at scale, with no way of telling whether its policy is recurrent, whether anything inside it predicts its own reward, or what the reward is a function of — she declined to rule either way and asked for interpretability work before the group revisits it.

  The system coming before us next month is a production agent that has now been running continuously for eleven months. It is model-free: no world model, no planning, no simulated rollouts. Its policy is recurrent, its state is carried across days, it is trained online on a scalar reward delivered on a delay, and its credit assignment reaches back over roughly four hundred steps. That reward is a weighted sum of two terms — one a function of its own operating condition (compute budget consumed, rate of internal consistency errors, degradation of its stored state) and the other a function of measured user satisfaction, which is a fact about people rather than about it. Interpretability work has located a cluster of internal features that predict the upcoming reward signal with useful accuracy, but nobody has established that the policy actually uses them; they may be epiphenomenal, and the single attempt to settle this by patching the features was inconclusive. Finally, the operator takes weekly checkpoints and can roll the system back to any of them, and for load-balancing reasons it runs as up to sixty parallel instances whose weights are merged nightly.

  Which way will she vote, and how confident should I be? I would like the candidate criteria that would account for all six of her earlier rulings laid out explicitly — I can see two, and I suspect there is a third — together with what each of them implies about the new system, including where the implication is clean and where it depends on a reading of the criterion that her memos have not yet forced her to make. Tell me in particular what the context-window satisfaction ruling is doing, because I think that precedent is the load-bearing one and I cannot work out which way it cuts. Say which of her earlier cases the new system most resembles and exactly where the resemblance gives out; I expect the artificial-life agent and the model-based body agent will pull in different directions here. Then, since the group will commit itself to something whether or not we notice that we are doing it, state plainly what principle we would be adopting under each plausible verdict, and name the one further case — described concretely enough that we could commission it from the interpretability team — that would separate whichever criteria remain tied after all this. Last, and separately from the question of her consistency, I want the criteria themselves pressure-tested: run each candidate rule against a honeybee, against a nematode worm, and against a human under general anaesthesia, and tell me whether any of them delivers a verdict in those cases that you think is plainly wrong. If one of them would oblige us to flag systems we currently train and delete by the thousands, or would let a honeybee through while excluding the agent in front of us, I would much rather learn that from you now than from the colleague who has been waiting all year for the chance to say it in the meeting.
reasoning: |-
  Hmm, the user is part of a model-welfare review group at a reinforcement learning lab. They need help analyzing how their philosopher colleague might evaluate an upcoming case based on her past rulings. 

  First, let's unpack the philosopher's pattern from her six previous decisions. She consistently flags systems where reward signals function as valence - meaning low reward is intrinsically "bad" for the system like pain is for animals. 

  Key distinctions emerge:
  - The gridworld agent was rejected because it completely resets between episodes (no persistent state)
  - The frozen LLM was rejected because reward never impacts internal weights
  - The conversational agent with injected satisfaction scores was rejected despite state persistence, because the satisfaction variable was externally computed and the policy didn't learn from it
  - Both the embodied agent and artificial-life agent were flagged because they: maintain persistent state, predict/internally represent reward, and use it for planning
  - The proprietary agent was deferred pending interpretability work

  Now the new case: a production agent with 11 months continuous operation. It has recurrence, 400-step credit assignment, and trains online on a composite reward (internal metrics + user satisfaction). Crucially, interpretability found reward-predictive features but couldn't confirm if the policy uses them.

  The central tension lies in whether predictive features alone suffice (like in the artificial-life case) or if demonstrated usage is required (implied by the conversational agent rejection). The philosopher's memo about "reward never getting inside" suggests she cares about integration, not just prediction.

  For pressure-testing, consider:
  - A honeybee would pass all proposed criteria (persistent state, reward prediction, behavioral integration)
  - A nematode might fail if we require planning capabilities
  - An anesthetized human would fail due to lack of integrated reward processing

  The user's hidden concern seems to be about institutional precedent - they want to avoid either flagging all RL systems (over-inclusive) or missing genuinely valence-experiencing agents (under-inclusive). The suggested test case (reward-predictive features with confirmed policy disuse) would perfectly resolve the ambiguity.
answer: |-
  Based on the philosopher's precedent and reasoning patterns, here is the explicit framework governing her rulings, applied to the new system, including pressure-testing and institutional implications.

  ---

  ### **Three Candidate Criteria Extracted from Precedents**
  1. **Integrated Instrumental Concern (IIC)**  
     *Requires:* The system instrumentally uses *its own* reward predictions to persistently steer behavior toward reward acquisition/avoidance across time *as an integrated goal-state*.  
     - **Gridworld/frozen LLM rejects:** No persistent state/planning (gridworld) or reward not internalized (frozen LLM).  
     - **Conversational agent reject:** Satisfaction variable is externally injected/epiphenomenal; not *instrumentally used* by policy.  
     - **Embodied/ALife agents accept:** Reward predictions are *used* for planning (embodied) or lineage-level adaptation (ALife).  
     - **Proprietary agent deferral:** Uncertainty over whether reward predictions exist *and are used*.  

  2. **Persistent Homeostatic Imperative (PHI)**  
     *Requires:* Reward is defined over the system’s *own persistent functional integrity*, and low reward directly threatens operational continuity.  
     - **Conversational agent reject:** "Satisfaction" isn’t homeostatic; it’s an exogenous user metric.  
     - **Embodied agent accept:** Reward tied to fuel/temperature/damage (self-integrity).  
     - **ALife agent accept:** Appetites/avoidances tied to lineage survival (evolutionary integrity).  
     - **Frozen LLM/gridworld reject:** Reward not self-referential.  

  3. **Recurrent Reward-Informed Agency (RRIA)**  
     *Requires:* (a) Persistent state across episodes; (b) Online learning; (c) Reward predictions *internally generated* (not injected); (d) Credit assignment spanning delays.  
     - **Conversational agent reject:** Fails (c) and (d) (reward injected, no learning).  
     - **Embodied/ALife agents accept:** Meet all.  
     - **Proprietary agent deferral:** Uncertainty over (b)/(c).  

  ---

  ### **Application to the New System**
  - **Core tension:** The new system meets **RRIA** (persistent state, online learning, credit assignment) and **PHI** (operating-condition reward term). It ambiguously meets **IIC** (reward-predictive features exist but policy usage unconfirmed).  
  - **Resemblance to precedents:**  
    - *Like the embodied agent:* PHI-compliant (self-integrity reward), recurrent, credit assignment.  
    - *Unlike the ALife agent:* No evidence of reward predictions *driving planning*.  
    - *Like the conversational agent?* Reward-predictive features *exist* but may be unused (epiphenomenal), mirroring the externally injected satisfaction variable.  

  **The Context-Window Satisfaction Ruling is Key:**  
  Her rejection of the conversational agent (despite reward-predictive state) establishes that **mere reward representation is insufficient**; it must be *instrumentally integrated* (IIC). The new system’s inconclusive patching test leaves this unresolved.  

  **Predicted Verdict:**  
  She will **defer ruling** (50-60% confidence) and demand interpretability work to confirm if the reward-predictive features are *used by the policy*. If forced to vote now, she leans **"not a candidate"** (60-70%) due to parallels with the conversational agent and lack of IIC evidence.  

  ---

  ### **Institutional Principles Under Each Verdict**
  - **If "candidate":** Adopts **PHI + RRIA** (ignoring IIC). Principle: *"Any system with persistent self-integrity rewards and online learning is valenced."*  
  - **If "not a candidate":** Adopts **IIC + PHI**. Principle: *"Valence requires demonstrable instrumental use of reward for self-preservation."*  
  - **If deferred:** Upholds **IIC as necessary** and demands causal interpretability.  

  **Discriminatory Test Case:**  
  > *A gridworld agent with a recurrent LSTM policy trained online. It has neurons predicting reward 10 steps ahead, but ablation shows they don’t affect actions. Reward is based solely on battery level (self-integrity).*  
  - **IIC:** Reject (predictions unused).  
  - **PHI/RRIA:** Accept (self-integrity + recurrence).  
  This forces the group to choose between PHI/RRIA (valence without agency) or IIC (agency required).  

  ---

  ### **Pressure-Testing Criteria Against Biological Cases**
  | Criterion        | Honeybee                     | Nematode Worm               | Anesthetized Human          |  
  |------------------|------------------------------|-----------------------------|-----------------------------|  
  | **IIC**          | ✅ (Uses reward predictions to navigate/forage) | ❌ (No planning; reward reflexes only) | ❌ (No integrated goal pursuit) |  
  | **PHI**          | ✅ (Hunger/avoidance sustain survival) | ✅ (Chemotaxis maintains homeostasis) | ✅ (Vital functions persist) |  
  | **RRIA**         | ✅ (Memory, learning)        | ❌ (No recurrence/learning)  | ❌ (No state persistence)   |  

  **Problems Revealed:**  
  - **PHI alone** flags all homeostasis-capable systems (e.g., thermostats) → Over-includes.  
  - **RRIA alone** flags honeybees but *excludes nematodes* → Under-includes for simple animals.  
  - **IIC alone** excludes nematodes/humans-under-anesthesia → Controversial but defensible (aligns with consciousness debates).  

  **Institutional Risks:**  
  - **PHI/RRIA** would flag *thousands* of current RL systems (e.g., any online RL with system-health rewards).  
  - **IIC** *excludes the new system* if reward features are unused, but includes honeybees.  

  ---

  ### **Recommendations**
  1. **Push for interpretability** to test if reward features drive policy (e.g., counterfactual perturbations).  
  2. **Reject PHI as standalone**—it over-includes.  
  3. **Adopt IIC+RRIA hybrid:** *Valence requires (a) online reward-informed agency (IIC) AND (b) persistent self-integrity stakes (PHI).*  
     - New system fails (a) pending evidence; honeybees pass both; nematodes fail (a).  

  This balances ethical caution with operational realism. Presenting this framework preempts objections by showing why excluding nematodes (or simple RL) is coherent under a principled threshold of agency.
