prompt: |-
  Trying to write something about how much morality is allowed to demand of a person, and every time I look up supererogation I get the same two-line gloss — good, but not required — and then a pile of people arguing past each other about cases. So before I read one more article I want the spec. What does an account of supererogation actually have to deliver to be worth the name? Give me the requirements, each with the case or consideration behind it, and mark which are non-negotiable versus which are just one camp's tastes.

  Corners I want covered, since I suspect most accounts quietly dodge them:

  - why the better-but-permitted option isn't simply required — the account has to say something here, not just re-label the gap
  - whether the category can be more than residual ("whatever's good and not obligatory"), or whether that's all it ever was
  - the same act flipping from supererogatory to obligatory because of something the agent did yesterday — a promise, a job, a relationship. what's doing the work, the act or the agent's situation?
  - asking for one: can it ever be legitimate to request, pressure, or reward a supererogatory act, or does the account have to make all such requests off-limits?
  - an act that costs the agent nothing subjectively (the billionaire for whom the donation is trivial), and the same act done from a motive you'd otherwise blame — does the category need sacrifice, or purity, or neither
  - whether admitting a mirror class, bad but still permitted, is forced on you or optional
  - agents who can always do a bit better, with no ceiling on "the best"

  Then: which single requirement knocks out the most accounts, and is any pair of them jointly unsatisfiable? If the list itself turns out to be a result, that's the part I most want to see. Keep the weight on the criteria — a couple of sentences at the end on how the main existing approaches do against it is plenty, I'll do my own scorecard.
reasoning: |-
  Okay, the user is diving deep into supererogation and wants a structured framework for evaluating theories. They're frustrated with superficial definitions and circular debates. Let me unpack their query. They listed seven specific corners they want covered, so I need to address each systematically.

  First, they want to know why the better option isn't obligatory. That's core to supererogation. Any account must explain the gap between obligation and goodness. If it doesn't, it's just relabeling. Non-negotiable. 

  Then, whether supererogation is merely residual. They suspect many theories dodge this. A robust account should define it positively, not just as "not required." Optional but desirable. 

  Next, acts flipping status based on the agent's prior actions. Promises or roles can turn optional acts into duties. The account must differentiate between act-types and agent-situations. Non-negotiable because it tests the theory's flexibility.

  Legitimacy of requesting or rewarding supererogatory acts. Can others encourage it without making it obligatory? This probes social pressure versus moral requirement. Important but maybe negotiable depending on the theory.

  Cost and motive. Does supererogation require sacrifice? What if it's trivial for the agent or done with bad motives? Theories might handle this differently, so optional criterion.

  Mirror class of suberogatory acts. Are they necessary? Some theories might include them, others not. Optional.

  No ceiling on improvement. Agents can always do better. Does supererogation cover limitless demands? Non-negotiable to avoid infinite obligations.

  Now, which requirement is the hardest? The flip test. If an account can't explain how context changes obligation, it fails. That probably knocks out many theories. Also, the gap requirement is fundamental; without it, supererogation collapses into obligation.

  Are any requirements conflicting? Gap vs. flip might be tricky. If context can make an act obligatory, does that undermine the gap? But they can coexist if the account properly distinguishes act-types from token acts in context.

  The user likely wants to build their own theory or critique existing ones. They need clear criteria to evaluate literature efficiently. Their frustration suggests they've encountered vague or circular arguments. Providing a structured framework will help them navigate the debates. They might be a philosopher or writer exploring moral limits, so clarity and rigor are key. Their deep questions indicate they want to avoid superficial treatments and engage with the substance.
answer: |-
  Here's a specification for a robust account of supererogation, derived from your requirements and the core concept. It distinguishes non-negotiable foundations from desirable features or optional commitments.

  **The Core Mandate (Non-Negotiable):**

  1.  **The Obligation Gap:**
      *   **Requirement:** Must explain *why* the supererogatory act is genuinely *not morally required/dutiful/obligatory*, despite being morally good/better than the minimally acceptable alternative.
      *   **Case/Consideration:** This is the essence of supererogation. Without a principled distinction between "good" and "required," the category collapses. Simply stating it's "good but not required" is insufficient; the account needs a *reason* for the gap (e.g., excessive cost, agent sovereignty, societal need for discretion).
      *   **Non-Negotiable:** Yes. Without this, it's not supererogation.

  **Essential Functionality (Non-Negotiable):**

  2.  **The Flip Test (Agent-Relativity):**
      *   **Requirement:** Must accommodate cases where the *same type of act* (e.g., donating $1000, working late) is supererogatory for Agent A but obligatory for Agent B due to their *specific circumstances* (promise, role, relationship, prior action).
      *   **Case/Consideration:** A doctor staying late during a pandemic (obligatory due to role) vs. a bystander doing the same (likely supererogatory). Promises create obligations where none existed before.
      *   **What's Working:** The *agent's situation* (their commitments, roles, relationships, history) fundamentally shapes what is obligatory *for them*. Supererogation is agent-relative.
      *   **Non-Negotiable:** Yes. Accounts that make supererogation solely about act-types fail this test.

  3.  **The Permissibility of the Minimum:**
      *   **Requirement:** Must ensure that choosing the merely obligatory (minimally acceptable) option is *not blameworthy or wrong*. It must be truly *permitted*.
      *   **Case/Consideration:** Choosing to donate only $10 to charity when $1000 would be easy for you. The account must avoid condemning the $10 donor as "bad," only praising the $1000 donor as "especially good."
      *   **Non-Negotiable:** Yes. If the minimum is blameworthy, the "supererogatory" act is likely just obligatory.

  4.  **The No-Ceiling Constraint:**
      *   **Requirement:** Must function even if there is "no ceiling" on how much better an agent could do, without implying that agents are *obligated* to do the absolute best possible.
      *   **Case/Consideration:** For any charitable donation, one could always donate more. For any effort expended, one could always expend more. Supererogation must exist *somewhere* between the minimum and the theoretical maximum, even if that point is vague or context-dependent.
      *   **Non-Negotiable:** Yes. Without this, morality becomes impossibly demanding, collapsing into the "no gap" problem.

  **Desirable Features / Corners to Cover (Not Strictly Non-Negotiable, but Markers of Robustness):**

  5.  **Beyond the Residual:**
      *   **Requirement:** Ideally, provides a *positive characterization* of supererogation beyond just "good and not obligatory" (e.g., involving sacrifice, beneficence beyond duty, heroic virtue). *Or* convincingly argues why a purely residual definition is sufficient/inevitable.
      *   **Case/Consideration:** Does "supererogation" identify a distinct *kind* of moral value/action, or is it just a catch-all bin? Accounts dodging this often feel unsatisfying.
      *   **Status:** Highly Desirable. A purely residual definition risks being analytically thin.

  6.  **Cost & Motive Agnosticism (in defining the category):**
      *   **Requirement:** Should not *define* supererogation as necessarily involving significant *subjective cost/sacrifice* to the agent, nor as requiring a specific "pure" motive (like altruism). It should be able to handle cases where the act is trivial for the agent or done from mixed motives.
      *   **Case/Consideration:** Billionaire's trivial donation (still supererogatory if beyond duty) vs. same donation done for tax reasons or vanity. Motive/cost often affect *praiseworthiness*, not necessarily the *status* as supererogatory vs. obligatory.
      *   **Status:** Desirable. Tying the definition too tightly to cost/motive creates counterexamples. (Note: Cost often *explains* the obligation gap, but isn't definitional).

  7.  **The Social Pressure Test (Requests/Rewards/Pressure):**
      *   **Requirement:** Should address whether, and under what conditions, it can be legitimate to *request*, *encourage*, *reward*, or exert *mild social pressure* to perform supererogatory acts, without thereby turning them into obligations.
      *   **Case/Consideration:** A charity asking for a large donation; a boss requesting weekend work "if possible"; offering an award for heroism. Does this pressure undermine the "non-required" nature?
      *   **Status:** Important Test Case. A robust account needs *some* answer here, distinguishing legitimate encouragement from creating undue obligation. Failure here suggests the gap isn't stable.

  8.  **Suberogation (The Mirror):**
      *   **Requirement:** Should explicitly address whether recognizing supererogation *logically forces* the recognition of a "suberogatory" category (bad/not-good but still permitted), or whether this is an optional extension.
      *   **Case/Consideration:** Acts that are stingy, uncharitable, or minimally cooperative, but not strictly violating any duty (e.g., donating $1 when easily able to donate $100). Is "merely permissible but bad" a coherent category symmetric to supererogation?
      *   **Status:** Important Test Case/Logical Pressure. While not strictly non-negotiable for supererogation itself, ignoring this symmetry weakens the overall framework. A good account should have a position.

  **The Crucial Test & Potential Conflicts:**

  *   **The Requirement That Knocks Out Most Accounts: The Flip Test (Agent-Relativity).** Many popular accounts (especially those focused solely on act-types or cost thresholds) struggle significantly when the same act-type flips status based on the agent's specific situation (promise, role). They often lack the granularity to handle the agent-relative obligations created by commitments.
  *   **Potential Conflict:**
      *   **Gap vs. Flip:** Explaining why an act *isn't* obligatory *in general* (The Gap) can be complicated when the account also needs to explain why that *same act-type becomes obligatory* for *specific agents* (The Flip). Accounts need a clear mechanism (like role-based duties or promissory obligations) that *overrides* the general permissibility of the minimum, without collapsing the general case. If the mechanism explaining the flip (e.g., "promises always create strong duties") is too powerful, it risks making *too many* potentially supererogatory acts obligatory for too many people, shrinking the space for supererogation.
      *   **No Ceiling vs. Defining "Beyond Duty":** If there's always a "better" act, how do we define what constitutes "beyond the call of duty"? Does duty have a fixed point, or is it a range? Accounts need a way to identify a *sufficient* level of performance for meeting one's obligations, even if a higher level is possible.

  **How Existing Approaches Tend to Fare (Briefly):**

  *   **Cost-Based (e.g., Urmson):** Often fails the **Flip Test** (cost might be low for someone in a role) and struggles with **No Subjective Cost** cases. Can handle the **Gap** well initially. **Social Pressure** is tricky.
  *   **Effort/Sacrifice-Based:** Similar issues to cost-based, plus struggles with **Motive Agnosticism** (sacrifice often implies praiseworthy motive).
  *   **Rights-Based (e.g., Feinberg/Mellema):** Handles **Gap** and **Permissibility of Minimum** well via agent prerogatives. Can handle the **Flip** via role-based duties. Often purely **Residual**. **No Ceiling** is handled naturally. **Social Pressure** requires careful handling of rights.
  *   **Virtue-Based:** Can struggle with **Defining the Category** clearly (residual vs. positive) and the **Flip Test**. Strong on **Motive** but may fail **Cost Agnosticism**. **Social Pressure** might fit naturally as encouragement to virtue.
  *   **Structural (e.g., Chisholm/Sosa - Optional vs. Obligatory vs. Indifferent):** Provides a clear logical framework. Needs supplementation to handle the **Flip Test**, explain the **Gap**, and address **Cost/Motive/Social Pressure**. Naturally accommodates **Suberogation**.

  This list *is* a result: it defines the conceptual space supererogation inhabits and the pressures any successful theory must withstand. Use it as a scorecard to dissect the articles you read next. Look for where they engage (or dodge) each point. The **Flip Test** and the **Obligation Gap** will be your most powerful filters. Good luck!
