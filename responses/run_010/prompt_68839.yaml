answer: |-
  **The episode shows that the units-of-selection framework reveals a core disconnect: NTW attacked inclusive fitness as an *engine* of fitness differences (questioning its causal necessity), while defenders treated it as a *ledger* (a mathematical accounting tool), explaining the vehement response due to fundamentally different engagements.**

  ### Mapping Units and Distinctions
  1.  **NTW Position:** The primary *unit of selection* is the **colony (group)** acting as a Darwinian individual in an **MLS2** framework (groups reproduce, compete, and go extinct). Helping individuals are *vehicles* for colony-level adaptations. Inclusive fitness theory is rejected as a necessary explanatory framework.
  2.  **Defenders' Position:** The primary *unit of selection* remains the **gene (replicator)**. Individuals are the primary *vehicles*. Kin selection/inclusive fitness operates within an **MLS1** framework: selection acts on individuals, but their fitnesses (and thus gene frequency change) are influenced by social partners (often kin). Groups are not Darwinian individuals (not MLS2). Inclusive fitness provides the essential causal accounting.

  NTW's attack centered on the *level* of selection (promoting group selection/MLS2) and the *causal adequacy* of inclusive fitness. Defenders focused on the *representational adequacy and generality* of inclusive fitness as a gene-centered (replicator) accounting framework within MLS1. The dispute *was* fundamentally about units/levels (MLS1 vs. MLS2) and the causal role of relatedness.

  ### Engine vs. Ledger Distinction
  *   **Engine Question:** At what level do fitness differences *causally arise*? (What causes some entities to leave more offspring?)
  *   **Ledger Question:** At what level must a model be parameterized to *account for all the variance* in trait frequency? (How do we accurately tally the evolutionary change?)

  *   **NTW (2010 Paper) Attacked:** The **Engine** claim of inclusive fitness. They argued relatedness is *not* the primary causal driver ("engine") of eusociality. Instead, they posited ecological factors (defensible nests) and direct colony-level competition (group selection/MLS2) as the causal engines, making relatedness a consequence, not a cause.
  *   **Defenders (Signatories) Defended:** The **Ledger** status of inclusive fitness. They argued inclusive fitness (with the Price equation) is a general, causally sufficient *accounting framework* (ledger) for predicting gene frequency change under all conditions, including those NTW described. Removing relatedness from the ledger makes the accounting incomplete or misleading, *regardless* of the proximal causal engine.
  *   **Engagement:** The sides largely **did not engage the same question**. NTW attacked the causal necessity of relatedness (Engine), while defenders asserted the mathematical necessity and completeness of inclusive fitness accounting (Ledger). The vehemence stemmed from defenders perceiving NTW as misrepresenting (or abandoning) a powerful, general ledger and falsely promoting MLS2 as a distinct causal engine, while NTW perceived defenders as ignoring the true causal drivers (ecology/group competition).

  ### Where the Framework Goes Silent
  1.  **The Price Equation as "Neutral Arbiter":** Both sides invoked the Price Equation, claiming it supported their view. The units framework cannot resolve this because the Price Equation is a tautological accounting identity. The dispute was over *how to partition the covariance term* (e.g., into individual fitness + relatedness vs. group fitness + within-group selection) and which partition provides genuine *causal insight* or is more *explanatory*. This is a debate about representation, interpretation, and causality *within* the formalism, not directly about units.
  2.  **Mathematical Generality vs. Ontological Claim:** NTW framed their critique mathematically (inclusive fitness is "mathematically restricted"). Defenders interpreted this (correctly or not) as an ontological claim denying the reality/causal efficacy of kin selection and promoting group selection (MLS2) as the *true* mechanism. The units framework identifies the ontological commitments (MLS1 vs. MLS2) but cannot explain why a mathematical argument was received as an ontological one. This likely reflects deep-seated historical and sociological divisions within the field about the primacy of gene-centric vs. group-centric explanations.
  3.  **The Status of "Relatedness":** The framework doesn't fully classify the debate over whether relatedness is a *cause* (NTW: no, it's often a byproduct) or an *essential parameter* in a causal model (defenders: yes, always, for social traits).

  ### Verdict on the Theory
  The episode is an **anomaly** for the units-of-selection framework *if* viewed as the *sole* dispute. It confirms that MLS1/MLS2 and replicator/vehicle distinctions are crucial for mapping ontological commitments. However, it reveals a **deeper, unresolved tension** the framework alone cannot classify: the **relationship between mathematical representation (ledger) and causal mechanism (engine)**. The core conflict was not *just* over the unit (gene/individual vs. group), but over whether a specific representational framework (inclusive fitness) is *causally necessary* or merely *sufficient for accounting*. The controversy exposed that the units debate is often entangled with debates about the explanatory primacy of specific modeling formalisms.
