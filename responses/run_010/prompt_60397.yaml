prompt: |-
  Novelist here, and there's a scene I've rewritten nine times. My narrator is a woman blind from birth who gets usable sight at 38, and her brother — the smug one, always has an answer for everything — keeps saying "you had to be there, some things you can only know by being there." He reaches for it about anything: the funeral she couldn't see, what the coast looks like, the color of her own eyes in a mirror. I want that line to be load-bearing instead of mush, so I need to know exactly what it could be claiming.

  Act like a philosopher of mind who actually works on the knowledge argument and Mary-the-color-scientist stuff, and teach me the distinctions rather than the history. Brainstorm out loud first, then give me a menu of every precise thesis that one sentence could be carrying — is it about new facts, new abilities, new concepts, the difference between knowing-that and knowing-how, or just about what imagination can and can't simulate? For each reading, tell me whether it's a platitude, a substantive claim with real argumentative weight behind it, or flatly false, and say which of them would actually let my brother win the argument that she learned something genuinely new the first time she saw red. Then tell me which reading ordinary people mean when they say it at a bar, because I suspect he slides between readings mid-sentance and I want to write that slide deliberately.

  Also: run the readings past Molyneux's question to Locke — the man born blind who can tell a cube from a globe by touch and then gets his sight, and whether he can pick them out by looking alone. I want to know which readings of my brother's slogan predict a yes and which predict a no, and whether that's a real test or a fake one. Think carefully, and don't give me a bibliography or a reading list — I just want the distinctions, laid out long and messy if that's what it takes.
