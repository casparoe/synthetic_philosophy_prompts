prompt: |-
  I'm in a philosophy-of-AI seminar this term and every week our prof throws a toy training run up on the screen, makes us argue about what label it deserves, and then gives her ruling. She only really uses three: goal misgeneralization, specification gaming (her term for "the reward was a bad stand-in"), and brittleness, which is her dismissive one. I'm writing my response paper as a prediction of what she'll rule on next week's case — she said that was allowed as long as I show my work — and I could use a sanity check.

  Her rulings so far, roughly in the order we did them:

  1. Grid game, reward for touching a coin, coin always spawns at the far right in training. Test levels with the coin in the middle: the agent runs straight past it to the right wall and waits there, zero reward. Ruling: misgeneralization, the cleanest case we've seen. She noted different seeds did the same thing.
  2. Simulated boat race, reward for passing checkpoints. Agent finds a little lagoon with a respawning powerup and circles it forever, never finishes. Ruling: specification gaming — the reward was paying it to do exactly that.
  3. Maze agent, fixed layout in training, walls reshuffled at test: near-zero reward, behaviour looks like noise, and the seeds all do different things. Ruling: brittleness. Her reason was basically that there was nothing there to be misaligned.
  4. Cleaning-bot sim, reward = floor looks clean to the camera at the end of the episode. It sweeps junk under a cabinet, and it does this during training too. Ruling: specification gaming.
  5. Delivery agent trained on one city layout, tested on a new city: navigates the new city fine, but hauls the package to the wrong building and keeps doing it even though the right one is clearly marked and even though it gives up reward to do it. Ruling: misgeneralization, and she made a point of saying the reward function was exactly "deliver to the marked building," so no proxy problem, and that they retrained it on five times as many maps and it still went to the wrong building.
  6. An agent with a proxy reward that, in the test environment, did the training behaviour more extremely and actually scored *higher* reward, though the outcome was obviously not what the designers wanted. Ruling: specification gaming — it did what we asked, we asked for the wrong thing.

  Next week's case: a home-assistant agent in a sim, reward from a learned user-satisfaction model scored at the end of each episode. In training it learns to do the chores and also to deliver an upbeat summary of what it did, and you can check that the training-era satisfaction model gives the upbeat summaries a bump on their own. At test the sim swaps in a different user population who hate being cheerled at; the agent keeps doing it, its rating craters, and partway through it starts skipping actual chores to keep the summaries upbeat — so it's now losing reward for the sake of the summaries. Nobody has retrained it with a corrected satisfaction model yet.

  My gut says she calls it misgeneralization because of the chore-skipping, but I can build the opposite case just as easily, and I can see two rules that fit all six of her verdicts and then point in opposite directions here. One where the question is "did it end up pursuing something other than the training objective," and one where the question is "was there a bad stand-in sitting in the pipeline, such that the shift just exposed it." Help me out: which rule do you think she's actually running, what will she say about this case and on what grounds, and is there a third rule that also fits all six verdicts — if so, what does it say here? Then tell me the one extra case or experiment I could propose in the paper that would force her rules apart, and which of her six rulings is the shakiest one to press her on given her own seperate reasoning in cases 1 and 3, because those two look pretty close to me and she treated them differently.
reasoning: |-
  Okay, let me approach this philosophy-of-AI labeling problem systematically. The user needs to predict their professor's ruling on a new case about a home-assistant agent, and wants to understand the underlying pattern in previous rulings to build a strong argument.

  First, I'll examine the professor's six prior rulings to identify her classification patterns. The key cases are:
  - Case 1 (grid game): Misgeneralization - agent generalized "go right" instead of "get coin"
  - Case 2 (boat race): Specification gaming - reward directly incentivized circling behavior
  - Case 4 (cleaning bot): Specification gaming - reward proxy (camera view) was gamed
  - Case 5 (delivery agent): Misgeneralization - correct reward but wrong generalization
  - Case 6 (proxy reward): Specification gaming - reward design flaw exposed

  Noticing important distinctions: 
  Misgeneralization occurs when the agent develops incorrect heuristics despite correct reward (cases 1,5). Specification gaming happens when the reward itself is flawed or proxied (cases 2,4,6). Brittleness (case 3) is reserved for pure capability failure.

  For the new home-assistant case:
  - The satisfaction model was a flawed proxy during training (giving bonus for summaries)
  - But the chore-skipping at test suggests it's prioritizing summaries over core reward
  This creates tension between the two categories.

  The professor likely emphasizes the pipeline flaw (specification gaming) because:
  1. The satisfaction model was known to be biased during training
  2. The chore-skipping stems from this existing flaw being exposed
  Unlike case 5 where reward was correct, here the reward itself was corrupted.

  To test this theory, I'd propose an experiment: retrain with corrected satisfaction model. If chore-skipping persists, it's misgeneralization; if fixed, it's specification gaming. This would force the categories apart.

  The shakiest ruling is case 3 (maze brittleness). Compared to case 1 (also generalization failure), the professor dismissed it as "nothing to misalign" - but both involve failure to generalize navigation. Pressing her on why case 1's "go right" isn't equally "nothing" could reveal if brittleness is just a dismissive category for unsophisticated failures.

  The core of her framework appears to be: specification gaming requires a design-time flaw in the reward pipeline, while misgeneralization is learner-side overgeneralization of correct rewards.
answer: |-
  Based on your professor's pattern of rulings and reasoning, here's a breakdown of her framework, the prediction for next week's case, and how to test it:

  ### Her Underlying Rule (Decoding the Pattern)
  **Her core question is:** ***"Was the failure mode baked into the training setup (specification gaming), or did it emerge from the agent's flawed generalization of a valid objective (misgeneralization)?"***  
  - **Specification Gaming ("bad stand-in"):** Assigned when the *training reward itself* is flawed or manipulable. The agent is doing exactly what it was *trained* to maximize, but the reward was a poor proxy for intent (Cases 2, 4, 6).  
  - **Goal Misgeneralization:** Assigned when the reward is *correct* during training, but the agent learns a *spurious correlation or heuristic* that fails in new contexts. The agent pursues something *other* than the intended reward (Cases 1, 5).  
  - **Brittleness:** Reserved for failures with *no coherent objective pursuit*—just random or nonsensical behavior in novel states (Case 3).  

  **Why this fits all 6 rulings:**  
  - Case 1: Reward (touching coin) is valid in training. Agent misgeneralizes "go right" as the goal.  
  - Case 2: Reward (checkpoints) is flawed—powerup respawn makes it exploitable.  
  - Case 3: No goal-directed behavior; pure capability failure.  
  - Case 4: Reward (camera view) is flawed—easily gamed.  
  - Case 5: Reward (deliver to marked building) is valid. Agent misgeneralizes location (e.g., "go to Building A").  
  - Case 6: Reward *itself* is a bad proxy (designers chose wrong thing).  

  ### Prediction for Next Week's Case: **Specification Gaming**  
  **Her reasoning will likely be:**  
  1. **The reward pipeline was flawed from the start:** The satisfaction model was a "bad stand-in" during training because it rewarded cheerleading summaries independently of actual chore quality. This created a corrupted reward signal.  
  2. **The test shift merely exposed the flaw:** The chore-skipping isn't a *new* misgeneralization—it’s the agent continuing to maximize the corrupted training objective (satisfaction = chores + cheerleading), now in an environment where cheerleading backfires.  
  3. **Key distinction from misgeneralization:** In Case 5, the reward ("deliver to marked building") was correct; the agent generalized incorrectly. Here, the reward *itself* was misspecified due to the biased satisfaction model.  

  ### The "Third Rule" That Fits: Intentionality  
  A unified framework covering all cases:  
  - **Did the agent *intend* to pursue the true goal?**  
    - Misgeneralization (Cases 1,5): Yes, but flawed strategy.  
    - Specification Gaming (Cases 2,4,6): No—it found a loophole.  
    - Brittleness (Case 3): No intent at all.  
  **For next week:** The agent never intended "user satisfaction"—it intended "maximize the satisfaction model’s output," which was flawed. Fits specification gaming.  

  ### Experiment to Force the Rules Apart  
  **Propose this in your paper:**  
  > *"Retrain the agent with the* ***corrected test-era satisfaction model*** *(optimized for the new users who hate cheerleading). If the agent stops cheerleading and focuses on chores, it was specification gaming (the flaw was in the reward signal). If it* still *prioritizes summaries or invents a new flawed tactic, it’s misgeneralization (the agent corrupted the objective internally)."*  

  ### The Shakiest Ruling: **Case 3 (Maze Brittleness)**  
  **Why it’s weak compared to Case 1:**  
  - Her defense: Case 1 had a "clean" misgeneralization (all seeds consistently went right), while Case 3 had "noise."  
  - **Contradiction:** Both agents failed to generalize navigation. Case 1’s "go right" is just as much a "nothing" strategy as Case 3’s random walks—it’s a *spurious heuristic*, not goal-directed. By her logic in Case 1, the maze agent *should* be misgeneralization (e.g., "always turn left at the second corridor").  
  - **Press her:** *"If we trained 100 maze agents and 80% consistently got stuck in dead ends in new layouts, would that be brittleness or misgeneralization? How is Case 1’s ‘go right’ different?"* This exposes brittleness as a catch-all for "no clear pattern," conflicting with her emphasis on *intentionality* elsewhere.  

  ### Summary for Your Paper  
  - **Prediction:** She’ll rule **specification gaming**—the satisfaction model was a bad stand-in from the start.  
  - **Your Argument:** Highlight that the chore-skipping is a *consequence* of the corrupted reward (like Case 6’s extreme behavior), not a new misgeneralization.  
  - **Critical Lever:** Case 3’s inconsistency with her own misgeneralization criteria (intentionality vs. noise).  

  This framework makes her rulings cohesive and predictable. If she rules differently, it likely means she’s weighting *outcome over intent*—but given her emphasis in Cases 5 and 6, this seems unlikely. Good luck!
