answer: |-
  Here are nine ordered questions designed to escalate from outsider-accessible to technical cruxes, with follow-ups targeting likely replies. Dodges flagged at Q5, Q7, and Q8.

  ---

  **Q1 (Intro/Why Radical?)**  
  *Question:* "Many Bayesians treat learning as becoming certain of evidence — like setting P(it rained) to 1 after seeing wet grass. You reject this. At the most basic level, why is certainty the wrong starting point?"  
  *Likely Reply:* Human experience is always noisy and ambiguous; no perception (e.g., seeing grass) *forces* total certainty. Probabilism respects our actual fallibility.  
  *Follow-up:* "But if I *feel* certain it rained, doesn’t that suffice? Or is the claim that feeling certain is never justified?"  

  **Q2 (Kinematics Intro)**  
  *Question:* "If learning isn’t about certainty, what is it? You describe it as updating ‘weights’ on possibilities — like raising the probability of ‘rain’ while lowering ‘sprinklers’ after seeing wet grass. How is this different from just getting vague hunches?"  
  *Likely Reply:* It’s structured: experience selects a *partition* (e.g., {rain, sprinklers, neither}) and reshapes probabilities over it while keeping conditional probabilities (e.g., P(slippery|rain)) fixed.  
  *Follow-up:* "Where does this partition come from? Does seeing wet grass *tell* me to consider sprinklers, or is that my choice?"  

  **Q3 (Provenance of Numbers)**  
  *Question:* "You say experience fixes *exact* new probabilities for partition members non-propositionally. But how? If I see a faint shape, does its ‘greyness phenomenology’ dictate a 0.7 probability for ‘cat’ rather than 0.6? What anchors these numbers?"  
  *Likely Reply:* Phenomenology doesn’t dictate digits, but *constrains* credence via comparative confidence (e.g., "cat feels likelier than dog"). Exact values emerge from coherent integration.  
  *Follow-up:* "If values emerge from my prior, isn’t phenomenology merely *causing* shifts? How does it *justify* the specific weights?"  

  **Q4 (Rigidity Failures)**  
  *Question:* "Rigidity assumes conditional probabilities stay fixed. But if I learn the lighting is poor *while* seeing the shape, my P(shape|cat) should change. How do you update without collapsing into conditionalization?"  
  *Likely Reply:* Expand the partition: include lighting conditions. Kinematics updates on {good-light/poor-light} × {cat/dog/…}, fixing conditionals *within* cells.  
  *Follow-up:* "Doesn’t expanding the partition *require* me to suspect bad lighting first? If so, is kinematics parasitic on conditionalization for meta-uncertainty?"  

  **Q5 (Zeros & Certainty Ban)**  
  *Question:* "Rigidity prevents new probability for hypotheses with zero conditional probability on all partition members. Doesn’t this block learning *new* possibilities? Say I never considered ‘raccoon’ until one surprises me."  
  *Likely Reply:* Zeros aren’t fatal; the partition must be rich enough to anticipate surprises. If ‘raccoon’ was truly unexpected, expand the algebra post-hoc and apply kinematics to the new partition.  
  *Follow-up:* "But if I can expand partitions freely, doesn’t this *allow* certainty (e.g., add a ‘raccoon’ cell when it’s staring at me)? Or must I always leave nonzero doubt?"  
  **\*DODGE FLAG\*** (Likely rehearsed: "Coherence excludes true certainty.")  
  *Re-ask:* "Can you give an example of an experience that *justifies* 0.999 but *rules out* 1.0? What norm enforces the gap?"  

  **Q6 (Enlargement Rejoinder)**  
  *Question:* "A classical Bayesian might add a variable E for experience (e.g., E = ‘seems-cat-ish’) and conditionalize on it. If E is certain upon seeming, kinematics is redundant. If not, how do you get your weights?"  
  *Likely Reply:* Conditionalizing on E treats experience as a proposition, but the *content* of E—e.g., the cat-ishness—isn’t captured propositionally. Kinematics directly models the *impact*, not the report.  
  *Follow-up:* "Suppose two agents conditionalize on the same E but interpret ‘cat-ishness’ differently. Doesn’t your view forbid this misalignment in a way theirs doesn’t?"  

  **Q7 (Bootstrapping)**  
  *Question:* "You argue kinematics blocks bootstrapping (e.g., ‘my vision is reliable because things look right’). But couldn’t many small kinematic shifts—each slightly boosting trust in vision—accumulate into near-certainty without independent evidence?"  
  *Likely Reply:* Coherence demands that if vision’s reliability is uncertain, each update must *preserve* that uncertainty via the partition (e.g., including ‘reliable/unreliable’ cells), preventing illicit gains.  
  *Follow-up:* "If I *fail* to include ‘unreliable’ cells (perhaps naively), could kinematics *allow* bootstrapping? If so, is your solution to mandate partitions we often don’t use?"  
  **\*DODGE FLAG\*** (Likely rehearsed: "Bootstrapping violates coherence.")  
  *Re-ask:* "In a concrete case: After 100 clear-seeming cat sightings, must my P(vision reliable) stay below 1? If not, what distinguishes this from bootstrapping?"  

  **Q8 (Deference to Experts)**  
  *Question:* "If an expert tells you P(H) = 0.8 for some hypothesis, and you trust them, how do you update? Adopting their marginal P(H) isn’t kinematics—it ignores your conditionals and may clash with other experts."  
  *Likely Reply:* Treat the expert report as constraining your probability for H, and minimize entropy subject to that constraint (a generalization of kinematics).  
  *Follow-up:* "But this could violently alter your conditional probabilities (e.g., P(E|H)). If kinematics is about *preserving* conditionals, isn’t this a different rule? How is it ‘radical probabilism’?"  
  **\*DODGE FLAG\*** (Likely rehearsed: "Minimal revision preserves coherence.")  
  *Re-ask:* "If two experts say P(H)=0.8 and P(H)=0.9, minimal revision averages them. But shouldn’t trusting both *raise* my doubt? What does coherence say here?"  

  **Q9 (Normative Convergence)**  
  *Question:* "If no update is uniquely correct—only coherent—could two agents with wildly different priors see identical evidence forever and rationally disagree? Does experience ever *force* convergence?"  
  *Likely Reply:* Coherence doesn’t guarantee convergence, but long-run agreement is likely with shared partitions and rigid conditional links (e.g., if both tie observations to hypotheses similarly).  
  *Follow-up:* "If convergence isn’t assured, in what sense does evidence ‘teach’ us? Must we add empirical assumptions (e.g., ‘reliability’) to salvage learning—and if so, doesn’t that undercut radicalism?"  

  ---

  **Final Concrete Case Question**  
  *Question:* "To make this vivid: Describe a real choice—a bet, a medical decision, an experiment—where your theory and traditional conditionalization would give different advice to the same person with the same evidence."  
  *Prediction:* He will **likely restate the view** (e.g., "Conditionalization can’t handle vague evidence") but struggle to cite a *practically distinct* outcome. If pressed, he might gesture at high-uncertainty scenarios (e.g., interpreting a blurry scan under time pressure), but the advice difference will be subtle (e.g., slower belief shifts). Prepare to pivot to Q9’s normative stakes if answers stay abstract.  

  ---

  **Flow Logic**  
  - **Gentle Start**: Q1–Q2 introduce radicalism vs. certainty and kinematics.  
  - **Technical Core**: Q3 (numbers), Q4 (rigidity), Q5 (zeros), Q6 (enlargement) attack mechanics.  
  - **Norms & Implications**: Q7 (bootstrapping), Q8 (deference), Q9 (convergence) stress normative costs.  
  - **Dodge Management**: Re-asks for Q5/Q7/Q8 cut through "coherence" sloganeering by demanding concrete constraints or cases.  
  - **Outsider Bridge**: Q1–Q2 avoid jargon; Q3’s "faint shape" example eases outsiders into technical depth.
