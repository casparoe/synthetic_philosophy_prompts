prompt: |-
  I'm in my final year of secondary school and I'm writing a 5,000-word essay for our school's academic journal about the claim that the linguistic data available to a child are too poor to explain what the child ends up knowing, and more generally about what 'innate' is supposed to mean when it appears in that claim. My supervisor's objection to essays of this kind is that they settle on a meaning for 'innate' on the first page and then win by stipulation. I think he's right, and I don't want to do that. So I'd like the requirements list first, and to choose an account afterwards, if choosing is even legitimate.

  What I'm after is a specification: everything a theory of innateness has to be able to do before it may be put to work in an argument about language acquisition. For each requirement, give me the consideration behind it — a concrete developmental example, a recognisable way the argument can go wrong, a result the account cannot contradict — rather than a label and a slogan. Please cover at least the following, and add whatever you think I've missed while cutting anything you judge to be padding:

  - The distinctions an account must not collapse: a trait being innate versus a capacity or disposition being innate; innate as present at birth versus innate as robustly developing; innate versus merely universal across the species; innate versus simply not learned.
  - Non-vacuity. On some accounts nearly every cognitive trait turns out to be innate, and on others nothing does, so the requirement should be that an account must not make the nativist conclusion true by definition. If you think that demand is unfair, say so and tell me what to demand in its place.
  - The developmental biology constraint. Every trait depends on genes and environment in interaction, so any account implying that some traits are carried by the genome independently of the environment is not merely contentious but mistaken. I want to know what is left of innateness talk once that is conceded, and whether what's left is enough to run an acquisition argument on.
  - Relativisation. I suspect a poverty-of-input argument cannot even be stated until one says which alternatives the learner was capable of entertaining and what counts as the input. Please make this explicit, including how an account should handle input that is poor in one respect (no reliable correction of malformed sentences) and rich in another (abundant distributional evidence).
  - Portability beyond language. If the account cannot be applied to infant number sense, face preferences, or object individuation, either explain why that is no defect or count it as one.
  - Gradability and accessibility. Whether innateness comes in degrees, and if so whether those degrees can be assessed in principle for a species we cannot rear in deliberately varied environments.

  Then mark which requirements are non-negotiable and which are the preferences of one camp; say which single requirement eliminates the largest number of popular accounts; and tell me whether any subset of the list is jointly unsatisfiable. My suspicion is that a definition in terms of counterfactual environmental variation, non-vacuity, and testability on human beings cannot all be had together. If that's right, I want it stated as the finding of the exercise, not tucked away as a caveat.

  There is one particular thing I need the list to be able to adjudicate. My supervisor considers the whole debate closed, because current large language models acquire usable syntax from text alone, with no correction and no embodied experience, which he says shows the input was never poor. I cannot tell whether that is an argument, a category mistake, or a genuinely relevant observation. One of the requirements should be strong enough to give a verdict: the account ought to tell me what would count as evidence for or against a poverty-of-input claim, and whether a system trained that way falls within the class of learners the claim is about in the first place.

  Close with no more than half a page applying the list to three candidates — a universal-grammar style nativism, a usage-based or statistical-learning account, and one philosophical account that defines innateness in terms of developmental robustness. Keep that brief; the requirements are the deliverable, not the scorecard.

  Two requests about manner. Please write in British English. And please keep a firm line between what is settled among people who actually work on this and what is genuinely contested — I'm not yet able to tell the difference on my own, and I'd much rather my essay said plainly that experts disagree than quietly adopted one side's assumption as the default. Where a requirement you list is your own rather than a standard one, flag it as such.
reasoning: |-
  Okay, this is a sophisticated request from a final-year secondary student writing a 5,000-word essay on linguistic nativism and innateness. The student shows impressive grasp of the complexities - they've identified key pitfalls in the debate, particularly their supervisor's warning against stipulative definitions. They want a rigorous requirements list for any theory of innateness, with concrete justifications, and specific instructions about what to cover.

  Hmm, the core challenge here is balancing philosophical precision with developmental biology realities while keeping it applicable to language acquisition arguments. The student rightly points out that traditional innate/learned dichotomies collapse under gene-environment interaction models. I need to construct requirements that avoid that trap but still allow meaningful discussion.

  The supervisor's LLM objection is particularly thorny. We need a requirement that explicitly addresses what counts as evidence for poverty-of-stimulus, and whether artificial learners are relevant comparators. This might need a dedicated requirement about evidentiary standards.

  For structure, I'll address each requested distinction systematically:
  - Trait vs capacity distinction: must handle cases like birdsong where the capacity is innate but dialect is learned
  - Present-at-birth vs developmental robustness: e.g., walking isn't present at birth but is robust
  - Universal vs innate: avoiding conflating cultural universals with biological givens
  - Innate vs unlearned: accounting for emergent properties

  Non-vacuity is crucial - many definitions make nativism either trivial or impossible. I should reference how "canalization" in biology avoids this.

  The developmental biology constraint changes everything. We have to frame innateness as predictable developmental outcomes despite environmental variation, not genes-alone. The student's suspicion about unsatisfiable requirements might be right - testability in humans conflicts with controlled environmental variation.

  For the LLM issue, Requirement 8 will need to establish that poverty-of-input arguments presuppose a biological learner with specific constraints. Supervisor's objection may confuse competence (human knowledge) with performance (LLM output).

  Portability matters - if the account can't explain face recognition or number sense, it's probably language-biased. Gradability is tricky but important - we can't ethically vary human environments, so robustness must be inferred indirectly.

  For the three candidate accounts:
  - UG nativism fails on developmental biology and portability
  - Usage-based accounts struggle with robustness requirements
  - Developmental robustness handles biology well but may collapse innate/universal distinctions

  The student's British English request means I'll use "behaviour" not "behavior", and "learnt" occasionally. Crucially, I must flag where requirements reflect consensus (like gene-environment interaction) versus contested views (like whether LLMs refute poverty-of-stimulus).

  This student deserves kudos - they're grappling with graduate-level epistemology while avoiding partisan traps. The requirements list should empower them to dissect definitions rather than adopt one.
answer: |-
  Here is a specification of requirements for any theory of innateness intended for use in arguments about language acquisition, grounded in concrete considerations. Requirements marked **(Consensus)** reflect widely accepted constraints in cognitive science/developmental biology. Those marked **(Contested)** or **(Author's View)** highlight disagreements or my own emphasis. I flag core non-negotiables and key tensions.

  ### Requirements Specification

  1.  **Trait/Capacity Distinction:**
      *   **Requirement:** Must distinguish between innate *knowledge/representations* (e.g., specific grammatical principles), innate *computational capacities/learning biases* (e.g., statistical learning mechanisms), and innate *sensory-motor/perceptual predispositions* (e.g., preference for speech sounds).
      *   **Consideration:** Explaining rule-learning (e.g., structure dependence in questions) requires different mechanisms than explaining phonetic category acquisition. An account collapsing these cannot pinpoint *what* is innate in language acquisition. (Chomsky vs. statistical learning debates). **(Consensus: Necessary Distinction)**

  2.  **Birth vs. Robust Development:**
      *   **Requirement:** Must not equate "innate" solely with "present at birth". Must accommodate traits robustly emerging later via typical maturation, given species-typical environments.
      *   **Consideration:** Puberty, walking, or specific syntactic knowledge (emerging around age 3-4) are not present at birth but develop robustly across environments. An account requiring birth presence misses core nativist claims about language. **(Consensus: Necessary Distinction)**

  3.  **Innate vs. Merely Universal:**
      *   **Requirement:** Must provide criteria to distinguish traits universal due to shared biological endowment from those universal due to universal environmental regularities or cultural transmission.
      *   **Consideration:** Basic colour terms show strong universality patterns (Berlin & Kay), but their acquisition is heavily influenced by language input and cultural salience. An innate account must explain why universality in language *isn't* like colour terms. Poverty-of-input arguments hinge on this. **(Consensus: Necessary Distinction)**

  4.  **Innate vs. Simply Not Learned:**
      *   **Requirement:** Must distinguish traits arising from *specific* innate structures/biases from traits arising as emergent properties of general learning systems interacting with input, or from physical constraints.
      *   **Consideration:** The honeycomb's hexagonal structure emerges from physical laws of packing, not a "hexagon template" in bees. An innate language faculty must be more than just the emergent product of general intelligence + input. **(Consensus: Necessary Distinction)**

  5.  **Non-Vacuity Constraint:**
      *   **Requirement:** Must not render "innate" co-extensive with "all cognitive traits" (e.g., defining it as "genetically influenced") or "no cognitive traits" (e.g., defining it as "wholly independent of environment"). Must allow for a substantive distinction between innate and learned aspects.
      *   **Consideration:** If "innate" means "influenced by genes", then *all* traits are innate (and learned!). If it means "wholly environment-independent", nothing is innate. The account must identify a *specific* developmental signature (e.g., robustness, precocity, specific pattern of environmental insensitivity) marking a trait as innate. **(Consensus: Non-Negotiable)**

  6.  **Developmental Biology Constraint:**
      *   **Requirement:** Must be compatible with the fundamental principle that *all* traits result from gene-environment interaction. Cannot imply "genes alone" or deterministic unfolding independent of environment. Must define innateness *within* an interactionist framework.
      *   **Consideration:** Species-typical bird song requires both species-specific neural circuits (gene-dependent) *and* exposure to conspecific song during a critical period (environment-dependent). "Innate" here means the circuit *biases* learning towards conspecific song and makes it robust. Innateness must be a property of the *developmental system*, not genes in isolation. **(Consensus: Non-Negotiable)** *What's left?* Innateness as *canalization*: a trait's development is buffered against a *wide range* of environmental variations, emerging reliably given a species-typical environment.

  7.  **Relativisation to Learner and Input:**
      *   **Requirement:** Must explicitly define:
          *   a) The *class of learners* (e.g., human infants, with specific biological constraints).
          *   b) The *relevant input* (e.g., primary linguistic data: utterances heard, not explicit corrections).
          *   c) The *range of hypotheses/representations* the learner is capable of forming/entertaining.
      *   **Consideration:** Poverty-of-input arguments are meaningless without these. Claiming input is "poor" regarding learning structure dependence (c) presumes infants *could* consider structure-independent hypotheses but don't, and that input (b) lacks evidence ruling them out. Richness in distributional statistics (b) doesn't negate poverty regarding abstract principles (c). An account must specify these relativisations to evaluate "poverty". **(Consensus: Necessary for Acquisition Arguments)**

  8.  **Evidentiary Standard for Poverty-of-Input:**
      *   **Requirement:** Must specify what would count as evidence *for* or *against* a poverty-of-input claim for a specific piece of knowledge, relative to a defined learner, input, and hypothesis space.
      *   **Consideration (LLM Challenge):** Evidence *for* poverty: The knowledge emerges reliably despite input lacking unambiguous positive evidence *and* learners failing to acquire it under plausible alternative learning regimes lacking the posited bias. Evidence *against*: A system (biological or artificial) demonstrably lacking the posited innate structure acquires the knowledge from the *same* input definition. **LLM Verdict:** LLMs trained on text *alone* acquire syntactic competence *if* competence is measured by performance (output). This *suggests* distributional input *can* be sufficient *for systems with their specific architecture/learning algorithms*. However: i) It doesn't prove human infants use *only* those mechanisms; ii) Human acquisition involves radically different sensory-motor grounding and social interaction; iii) The hypothesis space for LLMs is vastly different. LLMs are relevant evidence *against* the strongest claims that syntax *cannot possibly* be learned statistically, but do *not* directly refute poverty claims relativised to *human infant* learning mechanisms, input, and developmental constraints. **(Consensus/Contested: Necessary, but scope of relevant evidence is debated - LLMs force refinement of the claim.)** **(Author's View: LLMs shift the burden of proof but don't fully resolve the debate relativised to human biology.)**

  9.  **Portability Beyond Language:**
      *   **Requirement:** Must be applicable to uncontroversial examples of innate traits in other cognitive domains (e.g., core number sense, face preference, intuitive physics) without ad-hoc adjustments.
      *   **Consideration:** Newborns show preference for face-like patterns and basic numerical discrimination (e.g., 8 vs. 16 dots). An innate account must explain the developmental signature of these traits (e.g., robustness, precocity, specific patterns of environmental insensitivity) consistently with how it explains putative innate language traits. Failure suggests language-specific bias. **(Consensus: Non-Negotiable for a general theory)**

  10. **Gradability and Accessibility:**
      *   **Requirement:** Should acknowledge that developmental robustness (canalization) can be a matter of degree. Must provide (in-principle) methods for assessing this degree, even given ethical constraints on manipulating human environments.
      *   **Consideration:** Newborn face preference is highly robust (appears in typical pre/post-natal environments). Core number sense is robust but shows more variation and refinement with input. Syntactic knowledge might be highly robust compared to vocabulary. Assessment relies on: i) Cross-cultural universality; ii) Resilience to deprivation within ethical bounds (e.g., studying language acquisition in deaf children of hearing parents); iii) Developmental disorders (e.g., Specific Language Impairment); iv) Comparative studies; v) Computational modelling of necessary input. An account must be compatible with such indirect assessments. **(Consensus: Gradability is likely; Accessibility is challenging but necessary in principle.)**

  ### Analysis of Requirements

  *   **Non-Negotiables:** 5 (Non-Vacuity), 6 (Developmental Biology Constraint), 9 (Portability).
  *   **Major Eliminator:** **Requirement 6 (Developmental Biology Constraint)** eliminates classical definitions of innate as "in the genes", "present at birth deterministically", or "wholly independent of environment". It forces accounts towards canalization/robustness.
  *   **Key Tension & Potential Unsatisfiability:** Your suspicion is largely correct. **Requirement 6** (Interactionism) + **Requirement 5** (Non-Vacuity - requiring a substantive distinction) + **Requirement 10** (Testability/Gradability in humans) creates tension.
      *   *Why?* Defining innateness as canalization within interactionism makes it inherently about *degree* of environmental buffering (Requirement 10). Non-Vacuity demands a clear distinction. But empirically, drawing a sharp line between "innate" (canalized) and "learned" is often impossible with human data, where environmental variation is ethically limited and complex. **Finding:** While *in principle* a canalization account satisfies all requirements, *in practice* for many human cognitive traits (especially complex ones like syntax), providing conclusive, quantified evidence for a sharp innate/learned distinction meeting non-vacuity and testability demands is extremely difficult, if not currently impossible. Nativist claims often rely on inference to the best explanation (e.g., poverty-of-input) rather than direct measurement of canalization breadth.

  ### Brief Application to Three Candidates

  1.  **Universal Grammar (UG) Nativism (Chomskyan):**
      *   *Strengths:* Directly addresses poverty-of-input (Req 7, 8), distinguishes innate knowledge (principles) from capacities (Req 1).
      *   *Weaknesses:* Historically violated Req 6 (genes alone implication). Struggles with Req 9 (Portability - UG is language-specific) and Req 10 (Gradability/Accessibility - UG is often seen as all-or-nothing). Vulnerable on Req 3/4 (Is UG distinct from general learning/emergence?).

  2.  **Usage-Based / Statistical Learning:**
      *   *Strengths:* Embraces Req 6 (Interactionism). Strong on Req 10 (Mechanisms testable via modelling/experiment). Portable (Req 9 - applies to number, categories etc.).
      *   *Weaknesses:* Struggles to meet Req 5 (Non-Vacuity - risks making "innate" vacuous by reducing it to initial learning biases). Often struggles with Req 7/8 (Explaining the *specificity* and *robustness* of linguistic knowledge acquisition purely from input + general stats).

  3.  **Developmental Robustness/Canalization (e.g., Ariew, Griffiths):**
      *   *Strengths:* Best satisfies Req 6 (Interactionist). Meets Req 5 (Non-Vacuity - canalization is a specific signature). Portable (Req 9 - applies to faces, number etc.). Compatible with Req 10 (Gradability).
      *   *Weaknesses:* Can struggle with Req 1 (Trait/Capacity - canalization applies to outcomes, less clearly to representations vs biases). Challenges: Req 7/8 (Defining the relevant environmental variations for "poverty" claims is complex); Req 3/4 (A culturally universal trait *could* be highly canalized, but requires explaining *why* it's canalized). Faces the practical testability tension outlined above.

  **Conclusion:** The requirements highlight that viable innateness accounts must be grounded in developmental biology (canalization), avoid false dichotomies, be portable, and define their terms relativistically for acquisition arguments. Non-vacuity and practical testability in humans create significant challenges. The LLM challenge forces greater precision in relativising poverty claims to specific learners and inputs but does not definitively settle the debate for human biological learners. The canalization account emerges as the most biologically plausible framework, though operationalising it conclusively for complex cognition remains difficult. Experts genuinely disagree on the sufficiency of non-nativist explanations (like powerful statistical learning) meeting all requirements, particularly concerning poverty-of-input arguments relativised to human infants.
