  ### Atrocity Comparison Decision Tree  
  *Instructions: For each scenario, select the option that best reflects your view. Answer intuitively without overthinking; there are no right or wrong paths.*

  1. **Ledger:** 100,000 killed over 2 years vs. 10,000 enslaved for 30 years (no deaths).  
     - A: Killing is worse.  
     - B: Enslavement is worse or equally bad.  
     - C: Not comparable (no meaningful answer).  

  2. **Distribution:** 1 million deaths in a single campaign vs. 1 million deaths across 100 massacres over a century.  
     - A: Concentrated deaths are morally worse.  
     - B: Spread-out deaths are morally worse or morally equivalent.  
     - C: Shape matters only rhetorically, not morally.  

  3. **Agency (Outcome):** Regime tortures one dissident for a year vs. state’s negligent dam failure kills one million.  
     - A: Dam failure is worse (greater harm).  
     - B: Torture is worse or equivalent.  
     - C: Not comparable.  

  4. **Agency (Will):** For the same cases, focus *only* on the perpetrators’ intent/negligence.  
     - A: Torture is worse (deliberate cruelty).  
     - B: Dam failure is worse (gross negligence) or equivalent.  
     - C: Not comparable.  

  5. **Erasure:** Two equally lethal genocides; one destroys archives/language/shrines.  
     - A: Erasure makes it worse (same moral sense as killing).  
     - B: Erasure adds a *different* kind of wrong (e.g., epistemic violence).  
     - C: No moral difference or not comparable.  

  6. **Triage:** Aid official diverts team from documenting a massacre to prevent a famine.  
     - A: The choice proves the two *are* comparable.  
     - B: The choice only proves she is constrained, *not* that they are comparable.  
     - C: Practical comparison is possible, but moral comparison is distinct.  

  7. **Aggregation:** 50,000 killed in war vs. 500,000 permanently displaced (no deaths).  
     - A: Killing is worse.  
     - B: Displacement is worse or equivalent.  
     - C: Not comparable.  

  8. **Absolute Atrocity:** An atrocity annihilates a people and erases their culture/history.  
     - A: This is *incommensurably* worse than all others (beyond comparison).  
     - B: It may be the worst but is still *comparable*.  

  9. **Ranker’s Role:** A scholar with no ties to affected groups publishes a ranked list of atrocities.  
