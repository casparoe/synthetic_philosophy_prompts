answer: |-
  ## The Unsealable Jar

  The rain lashed the ancient stones of the Aethelward as High Inspector Silas, mud-spattered and shivering, was led into the Chapter Hall. Before him sat the Custodian, an old man whose eyes held the stillness of deep water. Behind the Custodian, recessed into the damp stone wall, sat a small, unadorned oaken door.

  "Welcome, Inspector," the Custodian rasped. "You come to see if we hold the Secret. The True Name of the First Rain. Or so they say in the Capital."

  Silas nodded, stripping off his sodden cloak. "The Exchequer doubts. Claims of ancient custodianship are… easily made. The Seal of Verification must be renewed. I require proof."

  "Proof?" The Custodian smiled faintly. "But not the Secret itself? For that cannot be shown. It is bound. We offer only the *knowing* of it."

  "What does that mean?" Silas demanded, frustration bleeding through. "Riddles won't satisfy the Chancellor."

  "No riddle," the Custodian said. "A demonstration. We call it the Choosing of Jars. Bring the chest, Brother."

  A younger monk emerged, bearing a heavy chest. From it, he withdrew two large, identical clay jars, sealed with wax and cord. He set them on a low table between the Custodian and Silas. Next came a smaller wooden box, which the monk opened to reveal ten smooth black stones and ten smooth white stones – marbles, polished by time. Finally, the monk placed two empty basins on the table.

  "The Secret," the Custodian explained, his voice low, "is bound to that door." He gestured to the recessed door in the wall. "It cannot be opened by will or force. It opens only when the Secret is spoken truly *to* it, by one who knows."

  Silas eyed the door skeptically. It looked utterly ordinary, save for a faint, intricate carving around the frame that seemed to drink the candlelight.

  "The Jars," the Custodian continued, tapping the two clay vessels. "One is the True Jar. The other is the Shadow. Only one who knows the Secret can distinguish them reliably, for the Secret resonates faintly within the True Jar. We will demonstrate."

  The ritual began. Silas turned his back. He heard shuffling, the scrape of clay on wood. When he turned around, the two jars had been moved, their positions swapped or not – he couldn't tell. The younger monk stood impassively beside them.

  "Choose, Inspector," the Custodian invited. "Which is the True Jar?"

  Silas pointed at random. The left jar. The younger monk carefully broke the seal and tipped the jar over the left basin. Out tumbled five white stones and five black stones. Utterly random.

  "A Shadow Jar," the Custodian said. "It always holds this mixed truth. Now, the True Jar."

  The monk broke the seal on the right jar and emptied it into the right basin. Ten black stones clattered out.

  "See?" the Custodian said. "The True Jar holds pure black stones. Always. But only the knowing of the Secret guides my hand to choose the True Jar when the Shadow is presented. Anyone can *say* one jar is true. Only the knower can consistently *choose* the True Jar when both possibilities exist."

  Silas frowned. "That proves nothing. You might have just gotten lucky. Or rigged the jars."

  "Indeed," the Custodian nodded. "So we repeat. You shuffle. You choose which jar I must identify as True."

  Silas turned his back again. He heard the monk move the jars. He turned, pointed decisively to the jar on the right. "That one. Is it True?"

  The Custodian closed his eyes for a moment, then opened them and pointed to the jar on the *left*. "That is the True Jar."

  Silas gestured to the monk. The left jar was unsealed and emptied: ten black stones. The jar Silas had pointed to (the right one) was unsealed: five white, five black. A Shadow.

  "Again," Silas commanded.

  He turned his back. The jars moved. He chose which one the Custodian must identify. This time, Silas pointed to the left jar. "Is *this* True?"

  The Custodian pointed to the same jar Silas indicated. "It is True."

  Silas felt a flicker of suspicion – was the old man just agreeing with him? But the jar was unsealed: ten black stones. True. Silas pointed to the other jar: Shadow.

  Round after round. Ten times. Twenty. Silas varied his tactics. Sometimes he demanded the Custodian identify the True Jar outright. Sometimes he pointed to a jar and demanded, "Is *this* True?" forcing the Custodian to confirm or deny his choice, regardless of where the True Jar actually was. The Custodian never hesitated. He was always correct.

  The basins filled with stones – one basin holding only pure black piles from the True Jar, the other a chaotic mix from the Shadows. The sheer weight of correct answers pressed on Silas. The chance of guessing correctly so many times, especially when Silas was actively trying to trick him by linking his question to a specific jar… it dwindled from improbable to impossible. Only someone who *knew*, who could unerringly pick the True Jar regardless of Silas's misleading prompts, could achieve this.

  On the twenty-fifth round, as the monk resealed a Shadow Jar with fresh wax and cord, Silas finally exhaled. His shoulders slumped, not with fatigue, but with the release of doubt. He *knew*. The Custodian held the Secret. The Aethelward was true. He felt the conviction settle in his bones, cold and certain as the monastery stone.

  "You see," the Custodian murmured, watching the certainty bloom in Silas's eyes. "You saw what you saw."

  ***

  Back in the bustling, sunlit Capital, Silas stood before Junior Archivist Pell in the cluttered Records Annex. Silas had spent weeks crafting his report: meticulous descriptions of the ritual, diagrams of the jars and basins, a full transcript of every single round – which jar Silas had pointed to, which jar the Custodian had declared True or False, and the stone contents revealed each time. He’d even included the calculations showing the vanishingly small probability of guessing correctly through so many adversarial rounds.

  Pell, a thin man with ink-stained fingers, read carefully. He rearranged Silas’s pages, referring back and forth. He drew little diagrams of his own. He counted rounds. Finally, he looked up, his expression not hostile, but profoundly neutral. Like a man solving a puzzle with no stakes.

  "It's ingenious, Inspector," Pell said, tapping the report. "And a compelling narrative. But... it proves nothing."

  Silas stiffened. "Nothing? It proves they *know*! The odds—"

  "The *odds*," Pell interrupted gently, "are about chance. But look." He spread out several pages detailing specific rounds. "Here, round seven. You pointed to Jar A and asked, 'Is this True?' The Custodian said 'No.' Jar A was opened, held mixed stones – a Shadow. Jar B held pure black – True. Correct?"

  "Yes," Silas said, feeling cold creep back.

  "Now, round twelve. You pointed to Jar B and asked, 'Is this True?' The Custodian said 'Yes.' Jar B held pure black – True. Correct again."

  "Exactly! He knew!"

  Pell picked up two blank sheets and two inkwells, one black, one containing a mix of black ink and water, grey and streaky. "Imagine *I* am the Custodian, Inspector. But I know *nothing*. I'm a fraud."

  Pell turned his back. "Shuffle the 'jars'," he instructed Silas. Silas hesitantly swapped the positions of the two inkwells. Pell turned back. "Point to one and ask your question."

  Silas pointed to the left inkwell. "Is this True?" (Meaning: does it hold pure black?)

  Pell shrugged. "No."

  Silas 'opened' it – he dipped a quill; grey, streaky ink. Shadow. The other inkwell, when 'opened', showed pure black. Correct! But only because Pell had simply *disagreed* with Silas's guess. If Silas had guessed right (pointing to the pure black inkwell and asking "Is this True?"), Pell could have just *agreed*.

  "See?" Pell said. "Without knowing, I can *always* give you an answer that *matches* what opening the jars later reveals. If you point to a jar and ask 'Is this True?', I just say the opposite of what I think *you* might be guessing. Or if you ask me to identify the True Jar outright, I guess randomly. Sometimes I get lucky, sometimes not. But look at your own transcript!" Pell flipped pages rapidly. "For every round where the Custodian was correct, *I* could have produced the same answer by pure chance, or by cleverly mirroring or contradicting *your* actions. There’s no single answer in here," he tapped the thick report, "that *only* a true knower could have given. A determined fraud, playing the odds and reacting to your prompts, could have generated this *exact* sequence of correct answers."

  He pushed the report back across the table. "Your conviction is personal, Inspector. You were there. You felt the weight of the repetitions. But this?" He gestured at the painstakingly written account. "This is just a record of guesses that happened to be right. Or clever reactions. It could have been crafted by anyone sitting in that room, knowing or not. By the rules of evidence, it’s… empty."

  Silas stared at the report. The meticulous handwriting blurred. The cold certainty he’d carried from the Aethelward was still there, solid as granite within him. He *knew*. But the proof – the tangible thing he could place before the Chancellor, the thing that had cost him weeks of effort – lay on Pell’s desk like a dead leaf. Pell’s logic was watertight, an elegant dissection that left only dust. The Junior Archivist wasn't accusing him of lying; he was demonstrating that truth, in this case, was structurally invisible on the page. Silas opened his mouth, wanting to convey the pressure of twenty-five correct answers, the feel of the rain, the Custodian’s ancient eyes, the absolute *rightness* of it. But all that emerged was silence. He looked at Pell, who merely waited, politely expectant, sitting in the chair where the truth dissolved.

  ---

  **Note on Fidelity:** The ritual logic hinges on the Custodian's *consistent* ability to identify the True Jar regardless of Silas's potentially misleading prompts ("Is *this* True?"). A pure guesser would be right roughly 50% of the time on average. Over 25 rounds, the probability of guessing correctly *every single time*, especially when Silas is trying to trick him, is astronomically low (1 in ~33 million for pure random guessing, worse when accounting for Silas's adversarial choices). This is what convinces Silas *in the room*. Pell's dismantling relies on the fact that *any specific sequence* of correct answers, no matter how improbable, *could* theoretically be the result of luck or reactive bluffing. A forger *could* have produced Silas's exact transcript without knowing the Secret, just like someone *could* flip 25 heads in a row – it's vanishingly unlikely, but the sequence itself doesn't *prove* the coin is rigged; it only proves the sequence happened. The "fudge" is minor: Pell simplifies by suggesting a reactive strategy (always agree/disagree with Silas's prompt) *could* produce a perfect score. In reality, if Silas *only* used the "point and ask" method, a reactive strategy *would* work perfectly. If Silas *only* asked the Custodian to identify the True Jar outright, a pure guesser would be right only ~50% of the time. Silas's *mix* of questioning styles makes a reactive strategy less reliable for a fraudster *in practice*, but Pell correctly argues that the *specific sequence* Silas recorded *could* still be explained by a combination of luck and reaction. The transcript lacks a single response *only* a knower could give. The ritual proves the Secret to the *participant* through probability; the transcript fails to prove it to the *observer*.
