prompt: |-
  Act as a moral philosopher who actually works on blame, resentment, and responsibility — someone who knows the recent literature on hypocrisy and "standing to blame" — but who can explain it to a software engineer without making me feel dumb. Please think carefully and brainstorm out loud first (what the possible answers are, what turns on which distinction, where the obvious framings break down) before you hand me the finished thing. I want to see the working, not just the deliverable.

  Some context. I'm a tech lead on a backend team of about nine. I look at basically every PR that lands, so maybe 25–30 a week, and a chunk of them I'd call low-stakes individually but they add up because people remember. Over the last year I've noticed I keep flagging things in other people's code that I'm obviously guilty of myself: a 900-line PR with no tests, a function called `doThing2`, magic numbers, a `// TODO: fix later` that's been there since 2019, a commit message that says "fix stuff". Last month one of the seniors pushed back during review, friendly-ish, roughly: you merged three worse than this yourself last quarter, so what gives. I didn't have an answer then and I still don't.

  A friend of mine who reads more philosophy than I do said two things that both sound right to me and seem to contradict each other. One: if I'm a hypocrite, my criticism loses its force, I've forfeited the right to make it, and the other guy is entitled to resent it. Two: hypocrisy isn't an argument, my observation that his PR is untested is still true and still worth saying even if I'm guilty of the same thing, so "you do it too" is just a deflection and caving to it makes the codebase worse. My gut says both can't be right and my gut also says both are right. I'm pretty sure I'm mangling something here — maybe conflating "it's not true" with "it's not my place to say it", maybe something else — so part of what I want is for you to tell me where my confusion actually is before you build anything on top of it.

  What I want out of you isn't an essay, it's a procedure I can run before I hit "request changes":

  - a short ordered list of questions to ask myself about the comment I'm about to write, with what counts as a sufficient answer at each step
  - explicit branches: where the answer is "post it as normal", where it's "post it but frame it differently" (and what that framing is, concretely, in review-comment language), where it's "this is a team norm problem, escalate it as a norm rather than a person", and where it's "don't post it at all"
  - the standard reply I'd give myself at each step and why that reply doesn't get me off the hook
  - a line between the things that are genuinely about my standing to say it and the things that are just about whether the comment is correct and useful, since I suspect I've been smushing those together

  Then run it on three cases. (a) The 900-line untested PR from a junior, when I merged something comparably bad two quarters ago and nobody called me on it. (b) Something I've never done but am about to do next sprint anyway because the roadmap is going to force me to skip tests on an urgent hotfix too — I want the procedure to handle "you're going to do the same thing soon", which my friend claimed is somehow worse than having already done it, and I don't get why. (c) A case where you think the correct output is that I should drop the comment and the junior is right, i.e. one where the procedure tells me something I won't like. Please don't soften that one.

  Also be honest about the limits: which steps are judgment calls wearing a checklist costume, and where the procedure just won't survive contact with the real setting — it's async, it's in writing, it's on a public channel other teams can read, the person I'm reviewing often doesn't feel able to push back on me the way my senior did, and I have like 90 seconds per comment.

  Finally, the epistemic part, and this matters to me: tell me how confident you are in the main claims you're making here. Is there something like a settled consensus among people who study blame about whether hypocrisy costs you standing, or are you handing me one contested view dressed up as the answer? Point out the single thing you're least sure of, and flag anywhere you deliberately smoothed over a live disagreement to make the procedure usable.
reasoning: |-
  We are going to break this down step by step. The user is a tech lead who reviews PRs and has been called out for hypocrisy. They want a practical procedure to decide when and how to comment on PRs, especially when they've been guilty of similar issues.

  Key concepts from moral philosophy:
  - **Standing to Blame**: The idea that to have the moral authority to blame someone, you must not be guilty of the same offense (or similar relevant offense) without having addressed it. Hypocrisy can undermine your standing.
  - **Hypocrisy**: Involves a discrepancy between one's actions and one's criticisms. It can make blame inappropriate even if the criticism is factually correct.
  - **Deflection**: Responding to criticism by pointing out the critic's own faults. This can be a legitimate challenge to standing or a mere distraction.

  The user's friend gave two seemingly contradictory points:
  1. Hypocrisy forfeits the right to criticize and entitles the recipient to resentment.
  2. Hypocrisy doesn't negate the truth of the criticism; calling it out is a deflection.

  The confusion lies in separating:
  - The **truth** of the criticism (the code issue is real and should be fixed).
  - The **appropriateness** of the person delivering the criticism (their standing).

  Thus, even if the criticism is true, the person delivering it might lack standing due to hypocrisy. But that doesn't mean the issue should be ignored; it might need to be addressed by someone else or in a different way.

  **Brainstorming the Procedure**

  We need a checklist that the user can run quickly (90 seconds per comment) that asks:

  1. **Is the criticism true and important?** (If not, don't post.)
  2. **Am I guilty of the same thing?** (If yes, how recent and how addressed?)
     - Including: have I done it in the past? Am I about to do it? (The friend said "about to do" is worse; we'll see why.)
  3. **Does my guilt undermine my standing?** (This depends on factors like: have I taken steps to correct my own behavior? Is the context similar? Is the team aware of my own faults?)
  4. **Can I reframe the criticism to avoid hypocrisy?** (E.g., by acknowledging my own fault, framing it as a team norm, or deferring to someone else.)
  5. **Should the issue be raised at all?** (If I lack standing, maybe someone else should raise it, or it should be raised as a systemic issue.)

  Factors that affect standing:
  - **Recency**: A past offense that you've corrected is less problematic than an ongoing one.
  - **Acknowledgment**: If you've acknowledged your own fault and are working on it, you have more standing.
  - **Intention to repeat**: If you are about to do the same thing (like skip tests on an upcoming hotfix), that's particularly bad because it shows you haven't learned and are acting in bad faith.
  - **Severity**: Minor vs. major issues.

  Why is "about to do" worse? Because it shows that you are not only a hypocrite but also actively planning to violate the norm you are enforcing on others. It's a current, willful disregard.

  **The Procedure: Pre-Comment Checklist**

  Ask these questions in order. If any step leads to "don't post" or "reframe", do that and stop. Otherwise, proceed to the next.

  1. **Truth and Importance**:
     - *Question*: Is the issue I'm pointing out (a) factually correct and (b) significant enough to warrant a comment? (E.g., a real bug, violation of team norms, or maintainability issue.)
     - *Sufficient answer*: Yes, it's correct and important (e.g., it risks bugs, tech debt, or violates an agreed standard). If not, skip the comment.
     - *Branch*: If no, don't post. If yes, go to step 2.

  2. **Self-Consistency Check**:
     - *Question*: Have I done the same thing (or something very similar) in the past, or am I about to do it in the near future?
     - *Sufficient answer*: 
       - If I have never done it and have no plans to, proceed to step 4 (post as normal).
       - If I have done it or am about to, go to step 3.
     - *Note*: Be honest. Include:
          - Past offenses (within a reasonable timeframe, e.g., last year).
          - Future offenses (if you know you'll skip tests next sprint).

  3. **Standing Assessment**:
     - *Question*: Does my past/future behavior undermine my standing to criticize?
       - Consider:
          - **Recency and Frequency**: How long ago? How often? (Recent and frequent is worse.)
          - **Acknowledgment and Amendment**: Have I acknowledged my own similar faults? Am I actively trying to improve? (If I haven't, I lack standing.)
          - **Intention to Repeat**: Am I about to do the same thing? (If yes, I definitely lack standing because I'm acting in bad faith.)
          - **Context Similarity**: Was my offense in a similar context? (E.g., both in hotfixes? Both in large PRs?)
     - *Sufficient answer*: 
       - If I lack standing (e.g., I did it recently without acknowledging, or I'm about to do it), then go to step 4 with reframing or step 5 (escalate as norm).
       - If I don't lack standing (e.g., I did it a long time ago and have since reformed, or I acknowledged and fixed it), then I can post as normal (step 4) but with extra care.
     - *Branch*: 
       - If standing is intact: proceed to step 4 (post as normal, but consider a light reframe to acknowledge history if relevant).
       - If standing is compromised: go to step 4 with reframing or step 5.

  4. **Reframing Options**:
     - *Question*: How can I deliver the criticism without hypocrisy or by mitigating it?
       - Options:
          - **Acknowledge your own fault**: "I've been guilty of this too, so I know it's easy to skip. But let's try to avoid it because..."
          - **Frame as a shared problem**: "This is a common pitfall we all fall into. How about we fix it here and I'll also revisit my old code?"
          - **Focus on the code, not the person**: Instead of "You forgot tests", say "This PR would be more robust with tests."
          - **Defer to a neutral party**: If possible, ask someone else to review this point.
          - **Commit to change**: If you are about to do the same, commit publicly not to: "I'll make sure not to skip tests in my upcoming hotfix, and I'd appreciate if we hold each other accountable."
       - *Branch*: 
          - If you can reframe appropriately, post the reframed comment.
          - If reframing isn't possible (e.g., the issue is too personal or the reframing would be insincere), then go to step 5.

  5. **Escalate as a Norm Issue**:
     - *Question*: Is this a systemic problem that should be addressed at the team level?
       - If yes, then don't post the individual criticism. Instead, create a separate issue (e.g., in a team meeting or a retro) to discuss the norm.
       - Example: "I've noticed several PRs (including some of my own) skipping tests. Let's discuss as a team how to balance speed and quality."
     - *Branch*: 
          - If the issue is critical and cannot wait, you might have to comment anyway (but use extreme reframing and acknowledge your own fault).
          - Otherwise, drop the individual comment and address the system.

  **Standard Replies and Why They Don't Let You Off the Hook**

  - **"You do it too!" (from reviewee)**:
     - *If you have standing*: "You're right that I've done it in the past, but I'm trying to improve. Let's both do better here." (This doesn't let you off because you must then actually improve and acknowledge.)
     - *If you lack standing (e.g., you're about to do it)*: "You're right, and I shouldn't. I commit to not skipping tests in my next hotfix. But for now, let's fix this one because the risk is real." (You must then follow through.)

  - **Why the truth doesn't save you**: Even if the criticism is true, your hypocrisy can make the recipient resentful and less likely to listen. It can also erode trust in your leadership. So, you must address the hypocrisy to make the criticism effective.

  **Applying the Procedure to Cases**

  *(a) The 900-line untested PR from a junior, when I merged something comparably bad two quarters ago and nobody called me on it.*

  1. **Truth and Importance**: Yes, a 900-line PR without tests is a real problem (hard to maintain, test, etc.). Important.
  2. **Self-Consistency**: I did the same thing two quarters ago (past offense).
  3. **Standing Assessment**: 
     - Recency: Two quarters ago is not recent but not ancient. 
     - Acknowledgment: I wasn't called out, so I haven't acknowledged or fixed it? (Assume not.) 
     - Intention to repeat: No plan to do it again? (Assume no.) 
     - Standing is borderline: I haven't shown reform. 
     - **Verdict**: Standing is weak. I should reframe.
  4. **Reframing**: 
     - "I see this PR doesn't have tests. I realize I merged a similar one in Q2 without tests, and that was a mistake. Let's not repeat that. Can we break this down and add tests?"
     - Post the reframed comment.

  *(b) Something I've never done but am about to do next sprint (e.g., skip tests on an urgent hotfix).*

  1. **Truth and Importance**: Yes, skipping tests is bad (risky).
  2. **Self-Consistency**: I haven't done it in the past, but I am about to do it (future offense). 
  3. **Standing Assessment**: 
     - Intention to repeat: Yes, I plan to skip tests soon. 
     - This is very bad for standing because I'm acting in bad faith. 
     - **Verdict**: I lack standing to criticize unless I change my own plan.
  4. **Reframing**: 
     - I must either (a) abandon my plan to skip tests or (b) explicitly commit not to and then criticize. 
     - "I notice there are no tests here. I was planning to skip tests in my upcoming hotfix, but that's wrong. I won't do that. Let's both commit to tests even when it's hard. For this PR, can we add at least a minimal test?"
     - If I'm not willing to change my own plan, I cannot criticize. Then I must either:
          - Not comment and let someone else catch it, or
          - Address the systemic issue (step 5): "Team, we're skipping tests in hotfixes. Let's create a policy."

  *(c) A case where I should drop the comment (the user won't like it)*

  Situation: A junior submits a PR with a `// TODO: fix later` comment. I have several of these in my own code, some from years ago, and I've never addressed them. I haven't acknowledged this as a problem and I don't plan to clean mine up.

  1. **Truth and Importance**: TODO comments are bad practice (they accumulate), but maybe not critical? (Assume it's important because it can lead to bugs if ignored.)
  2. **Self-Consistency**: I have many, and I've done nothing about them.
  3. **Standing Assessment**: 
     - Recency: Ongoing (I still have them).
     - Acknowledgment: None.
     - Intention to repeat: I'm not removing mine, so I'm effectively repeating the offense by inaction.
     - **Verdict**: I lack standing. I haven't shown any commitment to change.
  4. **Reframing**: Hard to do sincerely because I don't plan to fix mine. 
     - If I try: "I see a TODO here. I have some too, and I know they linger. But let's try to avoid new ones." 
     - But this is weak because I'm not fixing the root cause. The junior can rightly say: "Why should I avoid it if you don't?"
  5. **Escalate as Norm**: This is the best path. 
     - Don't comment on the PR. Instead, raise in a team meeting: "I've noticed many TODO comments in our code, including mine. Let's set a policy: either fix immediately or create a ticket. I'll clean up mine next week." 
     - Then, after the policy, you can enforce on new PRs.

  **Limits of the Procedure**

  - **Judgment calls**: Steps 2 and 3 are subjective (e.g., "how recent is recent?"). Use common sense (e.g., within the last few months is recent). Also, "importance" in step 1 is a judgment.
  - **Real-world constraints**: 
     - 90 seconds: Skip deep introspection. Focus on obvious hypocrisy.
     - Async/public: Reframing might be harder in writing. Be extra careful to avoid sounding accusatory.
     - Power dynamics: Juniors might not push back. So, when in doubt, err on the side of reframing or not commenting. Use 1:1s for sensitive issues.
     - Not every comment needs this checklist. Only use it when you're worried about hypocrisy.

  **Epistemic Confidence**

  - **Consensus**: There's broad agreement that hypocrisy *can* undermine standing, but there's debate on when and how. Some philosophers (e.g., Macalester Bell) argue that hypocrisy always undermines standing; others (e.g., Todd) say it depends on whether the hypocrite is committed to the norm. I'm giving a moderate view: standing depends on your own relationship to the norm (acknowledgment, reform).
  - **Least sure about**: The treatment of future offenses. Some argue that intending to violate a norm is worse than past violations because it's current. I'm confident in this, but it's not universally accepted.
  - **Deliberate smoothing**: I'm presenting a practical hybrid. In reality, there's a debate about whether hypocrisy affects the *authority* to blame or just the *effectiveness*. I'm blending them for usability: if you lack standing, your criticism may be true but ineffective or unfair. So, we reframe.

  **Final Procedure for the User**

  Here's a condensed version for your 90-second pre-comment check:

  1. **Is it true and important?** 
     - No → Skip.
     - Yes → Next.

  2. **Have I done it or will I?**
     - No → Post normally.
     - Yes → Next.

  3. **Do I lack standing?** (Consider: recent? ongoing? unacknowledged? planning to repeat?) 
     - No → Post, maybe with light reframing.
     - Yes → Next.

  4. **Can I reframe?** 
     - Yes → Post reframed (acknowledge fault, focus on code, commit to change).
     - No → Next.

  5. **Escalate as norm?** 
     - If the issue is critical and cannot wait → Post with extreme care (acknowledge and commit).
     - Else → Drop the comment and raise the issue systemically (retro, meeting, etc.).

  **Standard reply to "you do it too"**: 
  - If standing intact: "Fair point. I've done it before, but we should both aim higher. Let's fix this and I'll revisit my old code."
  - If standing compromised: "You're right. I haven't lived up to this norm. I will [specific action]. For now, let's fix this because it's important."

  Remember: The goal is better code and a healthier team, not just avoiding hypocrisy. So, when in doubt, act to improve the system.
answer: |-
  Below is a step-by-step procedure based on contemporary moral philosophy (especially work on "standing to blame" by scholars like R. Jay Wallace, Macalester Bell, and Miranda Fricker). I'll start with a candid brainstorm to show my reasoning, then give you the actionable checklist, apply it to your cases, and end with epistemic honesty.

  ---

  ### **Brainstorm: Untangling the Confusion**
  Your core confusion is conflating two distinct dimensions:  
  1. **The truth/utility of the criticism** ("This PR is untested → it introduces risk").  
  2. **Your standing to deliver it** ("Do I have the moral authority to say this, given my actions?").  

  Your friend's two points aren't contradictory—they address different dimensions:  
  - Point 1 is about **standing** (your credibility/right to blame).  
  - Point 2 is about **truth/utility** (the criticism's objective value).  

  **Why hypocrisy costs standing**: When you blame others for something you’re guilty of without acknowledgment, you:  
  - Undermine trust (you’re not committed to the norm).  
  - Treat yourself as "exempt" from rules you enforce, which is unfair.  
  - Invite resentment (the recipient feels disrespected).  

  **Why truth doesn’t save you**: Even if your criticism is valid, delivering it without standing:  
  - Makes the recipient defensive (they focus on *you*, not the issue).  
  - Erodes your authority long-term ("Why should I listen if they don’t practice what they preach?").  

  **Key distinctions from recent literature**:  
  - **Past vs. future hypocrisy**: Saying "you’ll do it soon" is worse because it shows active bad faith (you know you’re about to violate the norm). Philosophers like Todd (2019) argue this is more damaging to standing than past offenses.  
  - **Acknowledgment matters**: If you admit your fault and commit to change, you regain partial standing (Wallace, 2010).  
  - **Severity context**: Minor slips (e.g., a one-line `//TODO`) vs. major violations (e.g., no tests in a critical module) affect how much standing is compromised.  
  - **Deflection vs. legitimate challenge**: "You do it too!" is deflection if the criticism is ignored. It’s legitimate if it questions your standing.  

  **Obvious framings that break down**:  
  - "The truth justifies it" → Ignores that blame is interpersonal, not just factual.  
  - "I’m the tech lead, so I have authority" → Leadership relies on moral consistency. Hypocrisy undermines that.  
  - "But the codebase suffers if I stay silent" → True, but you can address issues without hypocritical blame (e.g., reframing or escalating as a norm).  

  **The Goal**: A procedure that separates truth/utility from standing, minimizes resentment, and keeps criticism actionable.

  ---

  ### **The Procedure: Pre-Comment Checklist**
  Run this in order. Aim for 60-90 seconds per comment. If you hit a "no" or "compromised," skip to the branch.  

  1. **Is this criticism TRUE and ACTIONABLE?**  
     - *Question*: "Is the issue factually correct, specific, and fixable (e.g., ‘no tests’ vs. ‘this code sucks’)?"  
     - *Sufficient answer*: Yes → Proceed. No → **Don’t post**.  
     - *Why this doesn’t save you*: Truth is necessary but insufficient. If your standing is compromised, truth alone won’t make the criticism effective.  

  2. **Am I GUILTY of the SAME thing?**  
     - *Question*: "Have I done this recently (≤6 months) or will I likely do it soon (e.g., next sprint)?"  
     - *Sufficient answer*:  
       - No → **Post normally** (e.g., "Please add tests here").  
       - Yes → Proceed to Step 3.  
     - *Why "soon" is worse*: Future hypocrisy implies you don’t value the norm (it’s not a "mistake," but a choice). Past offenses are less damaging if acknowledged.  

  3. **Is my standing COMPROMISED?**  
     - *Question*: "Given my guilt, would delivering this blame fairly invite resentment?" Consider:  
       - **Severity**: Is this a major norm (e.g., no tests) or minor (e.g., imperfect commit message)?  
       - **Recency**: Did I do this last week (high compromise) or 5 years ago (low)?  
       - **Acknowledgment**: Have I admitted my fault publicly? (If not, standing is compromised.)  
       - **Intent**: Am I *planning* to repeat it? (If yes, standing is dead.)  
     - *Sufficient answer*:  
       - Not compromised → **Post with light reframing** (e.g., "I’ve slipped here too—let’s fix it").  
       - Compromised → Proceed to Step 4.  

  4. **Can I REFRAME to avoid hypocrisy?**  
     - *Question*: "Can I deliver this without blame, while acknowledging my fault?"  
     - *Sufficient answer*:  
       - Yes → **Post reframed** (see language below).  
       - No → Proceed to Step 5.  
     - *Reframing templates*:  
       - Acknowledge: *"I’ve made this same mistake [recently/soon], so I get why it happens. But for this PR, could we…"*  
       - Depersonalize: *"This PR is missing tests—I’ll add tests to my old PRs too. Let’s make this a habit."*  
       - Invite collaboration: *"I struggle with this too. Want to pair on a test strategy?"*  

  5. **Should this be a NORM issue?**  
     - *Question*: "Is this a systemic problem where team-wide action is better than individual blame?"  
     - *Sufficient answer*:  
       - Yes → **Escalate as norm** (e.g., retro ticket, team chat).  
       - No → **Don’t post** (if reframing fails and standing is gone, your comment will backfire).  

  ---

  ### **Applying the Procedure to Your Cases**  
  *(Using the checklist above)*  

  **Case (a): 900-line untested PR (junior), you did similar 2 quarters ago**  
  1. **True/actionable?** Yes (untested PR → risk).  
  2. **Guilty?** Yes (past offense).  
  3. **Standing compromised?**  
     - Severity: High (major maintainability risk).  
     - Recency: 2 quarters = borderline. Without acknowledgment, standing is **compromised**.  
  4. **Reframe?** Yes → *"I merged a similar PR last quarter without tests, and it caused headaches. Let’s avoid repeating that—can we split this and add tests?"*  
  5. **Norm issue?** Not needed (reframing works).  
  **Verdict**: Post reframed.  

  **Case (b): Issue you’ve never done but WILL do next sprint (e.g., skipping tests for a hotfix)**  
  1. **True/actionable?** Yes.  
  2. **Guilty?** Yes (future offense → worse).  
  3. **Standing compromised?**  
     - Future intent = **high compromise** (you’re planning to violate the norm).  
  4. **Reframe?** Only if you commit publicly: *"We need tests here. I’ll need to skip them in my hotfix next week, but I’ll add them post-release—can we do the same here?"*  
     - If you can’t commit to this, reframing fails.  
  5. **Norm issue?** Likely → *"Team: We’re skipping tests in hotfixes. Let’s create a ‘hotfix test’ protocol."*  
  **Verdict**: If you can reframe with commitment, post. Else, escalate as norm.  

  **Case (c): Drop the comment (junior is right)**  
  *Situation: Junior uses `//TODO: fix later`. You have 10+ unaddressed TODOs from 2020–2023, never acknowledged, and no plan to fix them.*  
  1. **True/actionable?** Yes (TODOs create debt).  
  2. **Guilty?** Yes (ongoing offense).  
  3. **Standing compromised?**  
     - Severity: Medium (not critical, but accumulates).  
     - Recency: Ongoing + no acknowledgment → **fully compromised**.  
  4. **Reframe?** Hard → *"I see a TODO—I have many too. Maybe we should…"*  
     - Problem: If you’ve ignored yours for years, this sounds hollow. Junior may resent "rules for thee, not me."  
  5. **Norm issue?** Yes → Escalate: *"Team: Our TODOs are piling up. Let’s purge them next sprint or ban new ones."*  
  **Verdict**: Don’t post the comment. Escalate as a norm.  

  ---

  ### **Limits and Real-World Constraints**  
  - **Judgment calls in disguise**: Steps 3 (standing) and 4 (reframing) are subjective. Severity/recency require gut checks.  
  - **Survival in your context**:  
    - **Async/public**: Reframing is harder in writing. Use emojis to soften tone (e.g., "😅 I’ve done worse—but let’s fix this").  
    - **Power dynamics**: Juniors won’t push back. Default to reframing or norms to avoid intimidation.  
    - **90-second limit**: Focus on glaring issues (e.g., no tests > magic numbers). Skip minor hypocrisy checks if time-strapped.  
    - **When to break the rules**: If a PR introduces critical risk (e.g., security flaw), comment immediately—even with poor standing—then acknowledge your hypocrisy.  

  ---

  ### **Epistemic Honesty**  
  - **Confidence in core claims**: 85%. There’s consensus that hypocrisy *can* undermine standing (Wallace, Bell, Todd), but **no consensus on when it’s fatal**. I draw from Todd’s "Future-Focused Accountability" (2019) for the "you’ll do it soon" case, which is widely accepted but not universal.  
  - **Least sure about**: The line between "standing compromised" and "not compromised" in Step 3. Philosophers debate how much acknowledgment/change restores standing. I’ve simplified it for your use case.  
  - **Smoothed-over disagreements**:  
    - Some (e.g., Fritz & Miller, 2015) argue hypocrisy *never* voids standing if the norm is important. I reject this as impractical for team dynamics.  
    - I present a middle-ground view (from Bell): Hypocrisy undermines standing unless you acknowledge it. This is pragmatic but debated.  
  - **Recommendation**: Treat this as a heuristic, not gospel. If resentment persists, revisit norms as a team.  

  ---

  ### **Final Output**  
  **Procedure Summary** (for your notepad):  
  1. **True/actionable?** → No? DROP.  
  2. **Guilty (past/future)?** → No? POST NORMALLY.  
  3. **Standing compromised?** → No? REFRAME LIGHTLY.  
  4. **Can reframe?** → Yes? REFRAME AND POST.  
  5. Else: NORM ISSUE or DROP.  

  **When you get "you do it too!":**  
  - If standing intact: *"Fair—I’ll fix mine. Let’s improve together."*  
  - If compromised: *"You’re right. I haven’t upheld this. I’ll [action]. For now, can we [fix]?"*  
  *(Why it doesn’t save you: It exposes your standing problem—address it or lose credibility.)*  

  Run this before "request changes." Update quarterly as team norms evolve.
