prompt: |-
  For eleven years I have been one of three volunteer administrators of a long-running persistent world: a text-and-blocks server with about four hundred regulars, many of whom joined when they were in secondary school and are now adults with children of their own. I manage infrastructure for a logistics firm by trade, and the only philosophy I have ever studied formally was a single evening course, so I write this as a layman who has been handed a job he is not equipped for. Last month a player of sixteen years used a duplication exploit to demolish a structure another player had spent four years building — a scale model, block by block, of the chapel in which her great-grandparents were married, sitting in a region of the map almost nobody visits. He sold the reclaimed materials and joked about it in a public channel. I banned him for ninety days, and his father, who also plays, has now written to me twice asking on what grounds, since nothing of value was destroyed and the chapel has since been rebuilt from our backups. Trying to answer him has made me realize that I have been adjudicating cases like this for a decade without knowing what my standard actually is.

  Here is what I think, case by case. The chapel: a real harm, and a serious one — more serious, in my judgment, than the loss of a unique sword of comparable build time that changes hands on the grey market for real money, even though the sword is by our own rules and everyone's understanding the more valuable object. Yet when a player's account is stolen and the character is sold for around two hundred dollars on a third-party site, I think that is straightforward theft of property, the kind I would testify about in an actual court; the in-game act is the same as in the sword case, and only an out-of-game fact the thief neither knew nor could have seen from inside the server changes my verdict. A pyramid scheme run in our currency, which cannot be cashed out and which our written rules explicitly permit: not a wrong, or barely one, even though two players lost the equivalent of a year of evenings. A player who roleplayed a scene of sexual violence in a public channel within earshot of someone who did not want to read it: a real wrong done to that reader, though nothing was done *to* her; the identical scene, word for word, between two consenting adults in a private room: no wrong at all. A buggy script I wrote myself deleted a town-crier NPC that half the server had been talking to for nine years, and people were genuinely upset — I think no one was harmed and no one was wronged, but I also cannot say their upset was simply a mistake about the facts. A child's sandcastle kicked over by a stranger on a public build map, in a game whose design positively encourages that: a small real wrong; the identical act in a game advertised as being about griefing: no wrong at all, even though the victim in both worlds knew perfectly well where he was standing. And the case I keep turning over, the one the father's letters really turn on: since the chapel has been rebuilt from backups, block for block, in the same place, is the wrong merely diminished, or is the harm simply gone, leaving behind a bad character and a breach of rules rather than a loss? I have asserted both things, in the same email, to the same man.

  The shorthand we admins use is something I will call the brick test, because I coined it and have never seen it anywhere: a thing counts as real if what was done to it would still have been a loss had it been made of brick and mortar, and if it is destroyable only because it happens to be made of data, then it is not real. It handles the chapel and the sandcastle. It makes the pyramid scheme a serious wrong, which I do not believe, since an evening of labour is an evening of labour whether or not it is recorded in a ledger nobody can cash. It is silent on the roleplay cases and on the NPC, where the material is identical and only the framing or the audience changes. It also cannot explain why the two-hundred-dollar character counts for more than the chapel.

  So: can you give me the principle, or the smallest set of principles, that generates as many of these verdicts as possible — stated precisely enough that I could compress it into three lines of a code of conduct and hand it to two other people who will disagree with me? For each clause, tell me which of my cases forces it in. Then tell me what it implies for cases I have not raised: our eventual shutdown of the server, deleting twenty years of builds, announced a year in advance; a memorial garden constructed inside the world for a player who died in 2019 and then vandalized; a player who paid a real-world artist four hundred dollars for a portrait of her character, which another player then deleted from the shared gallery; and an administrator — me, say — deleting a player's work as discipline for breaking an unrelated rule. Finally, be blunt about the cost. Which of my verdicts cannot be kept by any principle simple enough to administer, and which of the pairs that pull against each other — the stolen character against the demolished chapel, the public scene against the private one, the sandcastle in a game that invites it against the sandcastle in a game that does not — am I required to give up? I am not looking for a reading list or for names to look up; where a philosopher's idea is doing the work, give me the idea itself and the reasoning, not the attribution.
reasoning: |-
  Okay, the user has been managing a persistent online world for eleven years as a volunteer admin. They've encountered various incidents where they had to make judgment calls without a clear principle. Now, they're seeking a consistent framework to handle such cases, especially after banning a player for using an exploit to destroy another player's chapel build. The player's father is questioning the grounds since backups restored the chapel. The user needs a principle that can be compressed into a code of conduct and applied consistently.

  First, I need to understand their existing approach. They mentioned the "brick test," which considers if something would be a loss if made of physical materials. But this test fails in cases like pyramid schemes or roleplay scenarios. The key conflicts they face involve:
  - The chapel vs. the stolen sword/character: Emotional significance vs. monetary value.
  - Public vs. private roleplay: Consent and audience matter.
  - Sandcastle in different game contexts: Intent and expectations change the wrongness.

  The user needs principles that address harm beyond physicality. They value emotional labor, consent, and context. Their unspoken need might be justifying their intuitive judgments to others, maintaining community trust, and having a defensible standard.

  Possible principles:
  1. **Harm Principle**: Focus on emotional and psychological harm. The chapel represents years of emotional labor, making its destruction harmful despite restoration. The sword's monetary loss is tangible but less emotionally significant. The brick test overlooks emotional value.
     
  2. **Consent and Context**: For roleplay, harm arises from non-consensual exposure. Public scenes violate others' consent, unlike private ones. Similarly, sandcastle destruction in a griefing-allowed game is expected, so no violation occurs.

  3. **Labor and Investment**: Pyramid schemes waste time, but since in-game currency has no real value, the harm is minimal. However, time investment's emotional aspect might need recognition.

  Applying these to their cases:
  - **Chapel**: Harm due to emotional labor and symbolic value. Restoration doesn't negate the initial harm.
  - **Stolen Character**: Theft of real monetary value, actionable outside the game.
  - **Pyramid Scheme**: Not a significant wrong because no real loss, just time wasted within agreed rules.
  - **Public Roleplay**: Violates consent of unwilling participants, causing psychological harm.
  - **Deleted NPC**: Loss of communal history, but no intentional harm, so no wrong.
  - **Sandcastle**: Wrong in a non-griefing context due to violation of community norms.

  For new cases:
  - **Server Shutdown**: Announced in advance, part of the game's lifecycle. Not a wrong, as it's inevitable and communicated.
  - **Memorial Vandalism**: Severe harm due to emotional and memorial significance, akin to desecrating a grave.
  - **Deleted Portrait**: Theft of real-world value ($400), similar to the stolen character.
  - **Admin Discipline**: Potentially just if proportional and within rules, but risks perceived overreach if unrelated.

  Conflicts to resolve:
  - **Chapel vs. Stolen Character**: Accept that harm can be emotional or monetary; both are valid but different. The chapel's harm is communal and symbolic, while the character is individual and financial.
  - **Public vs. Private Roleplay**: Uphold consent as the key differentiator.
  - **Sandcastle Context**: Admit that community rules and expectations define the wrongness.

  Principles to codify:
  1. **Harm from Violation**: Wrong occurs when acts violate consent, inflict emotional harm, or disregard community norms.
  2. **Context Matters**: Intent and game rules define the permissibility of actions.
  3. **Restoration Doesn't Erase Harm**: Initial violation's impact remains even if rectified.

  Sacrifices: The brick test must be abandoned. Pyramid schemes might need re-evaluation if time investment is seen as valuable labor. The stolen chapel's worth over the sword requires accepting emotional value as legitimate harm.
answer: |-
  I'll give you a precise, actionable principle derived from your cases, structured as a three-line code of conduct clause. Then I'll break down how it applies to your examples, new cases, and the costs. The core insight unifying your judgments is that **harm arises from violating the consent, labor, or communal meaning invested in an act or object, not from its material form or restorability**. This combines two ideas:  
  1. **Subjective harm is real when it disregards another's agency or investment** (e.g., emotional labor, consent, or communal trust).  
  2. **Context determines permissibility** (e.g., rules, intent, or audience).  

  ### The Principle: The Consent and Investment Standard  
  **Compressed into three lines for a code of conduct:**  
  > Harm occurs when an act:  
  > (a) violates consent, disregards invested labor, or damages communal meaning;  
  > (b) and is not justified by context (server rules, intent, or audience).  
  > Restoration or material form does not negate the initial violation.  

  ### How Your Cases Force Each Part of the Principle  
  - **Clause (a) – "Violates consent, disregards invested labor, or damages communal meaning"**:  
    - Forced by:  
      - **The chapel demolition**: The player's 4-year labor created symbolic/emotional value (communal meaning). The exploit disregarded this.  
      - **The public roleplay scene**: It violated the consent of the unwilling reader.  
      - **The deleted NPC**: It damaged communal meaning (9 years of history), even though unintentional.  
      - **The sandcastle in a non-griefing game**: It disregarded the child's labor and the game's intended context.  
    - *Why it fits*: Your verdicts treat harm as tied to agency—e.g., the chapel builder’s emotional investment, the reader’s lack of consent. The brick test fails here because it ignores non-physical investments (like communal history for the NPC).  

  - **Clause (b) – "Not justified by context"**:  
    - Forced by:  
      - **The pyramid scheme**: Permitted by rules, so no wrong (context overrides labor loss).  
      - **The private roleplay scene**: Consent makes it permissible (context matters).  
      - **The sandcastle in a griefing game**: Encouraged by design, so no violation (context justifies).  
    - *Why it fits*: You consistently weigh intent and environment. The brick test fails because it can't distinguish identical acts (like sandcastles) in different contexts.  

  - **"Restoration or material form does not negate the violation"**:  
    - Forced by: **The chapel rebuild**. You felt harm persisted despite backups because the initial act disrespected labor/meaning. This clause explicitly rejects the father’s argument.  

  ### Why This Principle Explains Your Key Conflicts  
  - **Stolen character ($200) vs. chapel**:  
    - The character theft violates both labor (the player’s investment) and real-world property (monetary value), making it "worse" than the chapel. The chapel’s harm is purely symbolic, but still real under clause (a). The principle accepts both harms without equating them.  
  - **Public vs. private roleplay**:  
    - Audience consent (public = non-consensual exposure) is the differentiator, covered by clause (a) and (b).  
  - **Sandcastle in different games**:  
    - Context (game design) defines permissibility under clause (b).  

  ### Implications for Your Unraised Cases  
  Apply the principle strictly:  
  1. **Server shutdown after 20 years (announced in advance)**:  
     - **Verdict**: No wrong. *Why*: Context justifies it (planned lifecycle, advance notice). No consent violation. Labor/meaning is respected via transparency.  
  2. **Vandalized memorial garden for a deceased player**:  
     - **Verdict**: Serious harm. *Why*: Damages communal meaning (clause a) and disregards emotional investment. Context (memorial purpose) makes it indefensible under (b).  
  3. **Deleted $400 character portrait**:  
     - **Verdict**: Real harm. *Why*: Disregards labor (artist’s work) and real-world value (like the stolen character). Context (shared gallery implies consent for display, not destruction) violates clause (a).  
  4. **Admin deleting work as unrelated discipline**:  
     - **Verdict**: Harm, unless explicitly in rules. *Why*: Disregards labor (clause a). Context (disciplinary action) might justify only if proportional and rule-based (clause b). If not, it’s an abuse of power.  

  ### The Costs: What You Must Give Up  
  This principle is simple enough to administer (it distills to "respect people’s effort and consent, within the rules"), but it forces trade-offs:  

  - **Sacrificed verdicts**:  
    - **The pyramid scheme**: You must either:  
      - Reclassify it as harmful (since it wasted labor), or  
      - Accept that your "not a wrong" verdict relies on context overriding labor loss (as the principle does). The principle *can* uphold your verdict via clause (b), but it exposes a conflict—you undervalue time investment here compared to the chapel. **Cost**: Consistency forces you to either downgrade the chapel’s harm (which you won’t) or upgrade the pyramid scheme’s severity.  
    - **The brick test**: Abandon it entirely. It conflicts with clause (a) by ignoring non-physical harm (e.g., the NPC’s communal meaning).  

  - **Sacrificed pairs**:  
    - **Chapel vs. stolen character**: You must accept that monetary harm ($200 character) and symbolic harm (chapel) are *different* but both valid. The principle doesn’t rank them, so you’ll need separate rules for "real-world theft" vs. "in-game disrespect."  
    - **Sandcastle griefing contexts**: You must fully outsource permissibility to game design/rules. If griefing is allowed, no wrong exists—even if the victim feels harmed.  

  - **Bluntly**: The principle won’t resolve every tension. For example, the **deleted NPC case** (no harm) vs. **memorial vandalism** (serious harm) hinges on *intent and meaning*, not material. If players see the NPC as equally "sacred," your verdict might seem inconsistent. But the principle handles this: the NPC’s deletion was accidental (no consent violation), while vandalism is deliberate.  

  ### Final Note  
  This works because it mirrors ethical ideas like **relational autonomy** (harm occurs when we ignore others' agency in relationships) and **consequentialism in context** (acts are judged by their impact given the environment). It’s admin-friendly: focus on *what was violated* (consent/labor/meaning) and *whether the context excuses it*. Hand this to your team, and if they disagree, debate clause weights (e.g., is "communal meaning" as vital as "consent"?). Your experience shows you already use this—now it’s codified.
