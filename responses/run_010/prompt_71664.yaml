  First, I need to unpack their main points. The core idea is that comparison, not exemplification, drives moral reflection. Plutarch uses pairs to highlight traits through contrast, while hagiography presents flawless models. Modern obituaries fall awkwardly between these, often including flaws but without the structured comparison.

  The user plans to use Plutarch's preface from the Life of Alexander and the Nicias-Crassus pair. They're concerned about misconceptions: obit writers pride themselves on including flaws, seeing it as the whole moral task, and might mistake Plutarch for just ancient fact-checking. They also might see anecdotes as mere color, comparisons as rankings, and hagiography as bad reporting.

  I need to structure the session. Starting with the anecdote might not work because participants won't grasp the purpose yet. Instead, establishing the framework first makes sense. Open with the dilemma of modern obituaries to engage their experience. Then introduce Plutarch's method as a solution, using the preface. After that, delve into the Nicias-Crassus pair to show comparison in action. Contrast with hagiography to highlight the design difference. Finally, reinforce the key idea and have them apply it.

  Why Nicias-Crassus? Both have military failures due to character flaws—hesitation vs. greed. Neither is a saint; they're complex. The pair avoids ranking, focusing on traits. It lacks overt moralizing, which helps avoid confusion with their "not a eulogy" rule. Other pairs like Demosthenes-Cicero might focus too much on success, which isn't ideal. Cato the Younger is too polarizing, risking ranking.

  Addressing misconceptions: At the start, challenge the idea that flaws alone do moral work. After the Plutarch preface, clarify that anecdotes reveal character, not just color. During the pair analysis, emphasize that comparison isn't ranking. When discussing hagiography, explain suppression as design, not bad reporting.

  For the check-in activity, have them compare two fictional obits—one flaw-focused, one trait-focused via anecdote. This tests if they grasp the moral work through comparison without Plutarch knowledge.

  Omissions: Avoid historical debates, the Moralia, and English reception. State that it's beyond the session's scope to maintain focus on the core idea.

  Potential pitfalls: Time management is tight. Need to keep each segment within allotted times. Also, participants might resist the comparison concept initially, so the opening dilemma must resonate. Using relatable examples and clear contrasts will help. Ensuring the activity is practical and ties back to their work is crucial for buy-in.
answer: |-
  Here’s a structured 80-minute session plan designed to deliver your core idea through careful sequencing, using the Nicias/Crassus pair, while proactively dismantling misconceptions. The dependency is critical—missteps in order will undermine the "comparison, not exemplification" insight.

  **Session Structure & Timing:**

  1.  **The Dilemma (10 mins):**
      *   **Hook:** Start with their reality. "You write obituaries under a vital rule: 'Not a eulogy.' You include divorces, lawsuits, failures. You see this as honesty. But *what is this honesty* *for*? What moral work does it *actually* do on the reader? Does listing flaws automatically create ethical reflection?" *This directly engages their pride in "warts and all" and implicitly questions its sufficiency, setting up the need for a new framework.*
      *   **Stake the Claim:** Briefly state the core conflict: Modern obits often struggle between two ancient models: one offering a flawless saint to imitate (hagiography), the other offering complex lives to compare/reflect upon (Plutarch). You aim to explore this tension.

  2.  **Plutarch's Tool: The Anecdote as Character Revelation (15 mins):**
      *   **Source:** Whiteboard key quotes from the *Alexander* preface (focus on "writing lives, not histories," and the "slight thing... a remark, a joke" revealing character better than grand battles).
      *   **Activity:** Ask: "Think of a recent subject. What single, small moment or remark would reveal something *essential* about them that a list of achievements or scandals wouldn't?" Brief pair-share (2 mins), then quick share-outs. *This grounds Plutarch's abstract point in their practice, showing the *instrument* (anecdote for character) before its *purpose* (comparison).*
      *   **Key Point:** Emphasize: The anecdote isn't just "color" or garnish. It's a *diagnostic tool* Plutarch uses to expose the underlying character traits that drive grand successes *and* failures. This is the building block.

  3.  **Plutarch's Purpose: Comparison, Not Exemplification (25 mins - The Core)**
      *   **Introduce Nicias & Crassus:** Briefly context: Athenian general (Syracuse), Roman general (Carrhae). Both led massive, disastrous military expeditions ending in catastrophe and their deaths.
      *   **The Pair:** Explain Plutarch pairs them explicitly for comparison. Whiteboard core traits revealed through anecdotes/histories:
          *   *Nicias:* Paralysis by caution, superstition, hesitation (*not* cowardice, but excessive prudence becoming fatal). Anecdote: His disastrous delays due to omens at Syracuse.
          *   *Crassus:* Driven by insatiable greed, ambition overriding prudence, poor judgment of men/situations. Anecdote: His obsession with Parthian gold overriding military sense.
      *   **Activity:** "What's the *point* of putting these two very different men who suffered similar fates side-by-side? What does comparing Nicias's hesitation to Crassus's greed *do* for the reader?" Guide discussion. *Crucially, force the distinction:*
          *   Is Plutarch saying "Crassus was worse than Nicias" (ranking)? NO.
          *   Is Plutarch saying "Be like Nicias, avoid being like Crassus" (exemplification/imitation)? NO.
      *   **The Reveal:** The comparison forces the reader to *reflect* on the nature of flawed leadership, the different ways virtue can curdle into vice (prudence into paralysis, ambition into greed), and how similar catastrophes spring from utterly different character flaws. The moral work happens *in the reader's mind* via the juxtaposition. Plutarch provides the material for reflection, not a simple model. *This is where your core idea lands.*

  4.  **Contrast: Hagiography - Design, Not Bad Reporting (15 mins)**
      *   **Define:** Saint's Life = Designed as a perfect model for *imitation*. Flaws are suppressed *by design*, not by error. The purpose is emulation, not nuanced understanding or reflection on character complexity.
      *   **Contrast with Plutarch:** Point back: Plutarch *includes* flaws precisely *for* the comparison/reflection. Suppressing them would ruin his purpose. Including them isn't just "honesty" for honesty's sake; it's essential to the comparative instrument.
      *   **Contrast with Obits:** "Your rule 'not a eulogy' rightly rejects hagiography's *purpose* (creating a perfect model). But does simply *including* flaws achieve Plutarch's *purpose* (sparking reflection via comparison)? Or does it often just feel like a balanced resume with 'color' added?" *This explicitly separates the inclusion of flaws (which they do) from the *structural purpose* of those flaws (which Plutarch harnesses for comparison vs. hagiography's suppression for imitation).*
      *   **Head off Misconception:** Stress: Calling hagiography "design" isn't endorsing it or calling it "good." It's recognizing its *different function*. Bad reporting suppresses flaws *accidentally*; hagiography does it *deliberately* for a specific (imitative) end. Their obits avoid hagiography's *purpose*, but haven't necessarily adopted Plutarch's *method*.

  5.  **The Check: Application (10 mins)**
      *   **Activity:** "Imagine you are writing *two* very short obituaries (2-3 lines each) for *different* publications about the *same* recently deceased local business figure known for both significant philanthropy and a ruthless, reputation-damaging takeover early in their career."
          *   *Version A:* Focuses on balancing the "good" (philanthropy) and the "bad" (ruthless takeover) as facts.
          *   *Version B:* Uses one small anecdote revealing a character trait *connected to both* the philanthropy and the ruthlessness (e.g., an intense, almost obsessive focus on 'legacy' manifesting in both actions).
      *   **Question:** "Which approach comes closer to doing Plutarchan 'moral work'? Why? How does Version B potentially prompt more reflection in the reader than Version A, even though Version A includes the flaw?" *This tests if they grasp that the *character revelation* (via anecdote) linked to actions is more potent for reflection than just listing good/bad deeds (their instinct). It shows Plutarch's tool in action without requiring prior knowledge.*

  6.  **Wrap & Point to the Gap (5 mins)**
      *   Reiterate the core idea: Moral work comes from comparison/reflection sparked by character revelation (Plutarch), not imitation of perfection (hagiography) or mere balanced accounting of virtues/flaws (modern obit's typical middle ground).
      *   **The Challenge:** "Your obituaries avoid hagiography. Could Plutarch's method – using telling detail to reveal character, and perhaps implicit comparison (to other lives, to the reader's own experience) – help them move beyond just 'not a eulogy' to doing deeper, more reflective moral work?"

  **Dependency Structure & Why:**

  1.  **Start with Their Dilemma (Step 1):** Essential. You must create the *need* for the framework *before* introducing Plutarch. Jumping straight to Plutarch makes him feel academic and irrelevant. Their pride in "not a eulogy" is the hook you leverage.
  2.  **Introduce Plutarch's *Tool* (Anecdote) Before His *Purpose* (Step 2 before Step 3):** They need to grasp *what* Plutarch is doing (using small moments to reveal character) before understanding *why* he does it (for comparison). Introducing the pair first risks them seeing the anecdotes *only* as evidence for the comparison, missing their fundamental role as character diagnostics. Step 2 makes the anecdote the building block.
  3.  **Establish Plutarch's Method *Before* Contrasting Hagiography (Step 3 before Step 4):** You need them solidly understanding Plutarch's comparative purpose *first*. If you introduce hagiography too early, they will likely dismiss it as "bad reporting" (their existing frame) rather than understanding it as a distinct instrument with a different (imitative) purpose. Plutarch provides the counter-model.
  4.  **The Check (Step 5) Must Come Last:** It relies on them understanding the distinction between listing facts (their norm) and revealing character for reflection (Plutarch's tool/purpose). Doing it earlier wouldn't work.

  **Why Nicias & Crassus is the Right Horse:**

  1.  **Clear Parallel Catastrophe:** Similar, massive failures (Syracuse/Carrhae) make the pairing obvious and the comparison unavoidable. The scale highlights the impact of character.
  2.  **Diametrically Opposed Flaws:** Hesitation vs. Greed/Impetuosity. This stark contrast makes the comparison vivid and prevents any easy ranking ("worse"). They are flawed in completely *different* ways. This forces reflection on *types* of failure.
  3.  **Lack of Simple Heroism/Villainy:** Neither is a pure hero or villain. Both had significant achievements and complex motivations. This avoids simplistic moralizing and reinforces Plutarch's focus on nuanced character over judgment.
  4.  **Lack of Direct Moralizing:** Plutarch doesn't hammer the reader with "Don't be like this!" He presents the comparison and lets it work. This distinguishes his method from both exemplification (hagiography) and simple condemnation (which they might mistake their flaw-inclusion for).
  5.  **Succinctness:** Their stories are relatively straightforward to summarize within the time constraints. Avoids overly complex political webs.

  **Addressing Misconceptions - Where & How:**

  1.  **"Flaws = Entire Moral Work":** **Head off in Step 1 & Step 3.** Step 1 questions the *sufficiency* of including flaws. Step 3 explicitly shows how Plutarch *uses* flaws not just as facts, but as the *material* for comparative reflection, which is the deeper work.
  2.  **"Anecdote as Color/Garnish":** **Head off in Step 2.** By immediately linking the anecdote exercise to revealing "something *essential*," and emphasizing Plutarch's quote about it revealing character *better* than grand events, you establish its core diagnostic function *before* it gets used in the pair.
  3.  **"Comparison as Ranking":** **Head off explicitly during Step 3 (Nicias/Crassus analysis).** Pose the question directly: "Is Plutarch ranking them?" Guide the discussion to the conclusion that the point is reflection on *different types* of flawed leadership, not establishing who was "better" or "worse" overall.
  4.  **"Hagiography = Simple Bad Reporting":** **Head off explicitly in Step 4.** Frame it upfront as a *deliberate design choice* for a *specific purpose* (imitation), fundamentally different from accidental suppression (bad reporting). Contrast its *purpose* directly with Plutarch's.
  5.  **Likely Unconsidered Misconception: "Plutarch is just ancient biography, same goals as us."** This is subtly addressed throughout by constantly contrasting Plutarch's *comparative reflective purpose* with the modern obit's often implicit purpose (balanced factual accounting, capturing a life, sometimes celebrating achievement). Step 1 and the Wrap make this explicit.

  **Omissions (What to Decline & Why):**

  1.  **"Lives as History or Literature?":** Decline. **Why:** It's a scholarly debate tangential to your core point about the *moral mechanics* of narrated lives. Say: "That's a fascinating academic discussion, but today we're focused purely on the *instrument* Plutarch crafted and how it functions on the reader."
  2.  **Ethics of the Moralia:** Decline. **Why:** While related to ethics, the *Moralia* is a different genre (essays). Your focus is on the ethical *effect* generated by the narrative structure of the *Lives* themselves. Say: "Plutarch explored ethics directly elsewhere; here, we're interested in how the *form* of the paired Lives itself does ethical work."
  3.  **English Reception / North's Translation:** Decline. **Why:** Irrelevant to understanding Plutarch's *intended* method and your core contrast. It's reception history, not source mechanics. Say: "The influence on Shakespeare and others is profound, but for our purpose today, understanding Plutarch's original design is what matters."

  **Key to Success:** Maintain relentless focus on the *instrument* (anecdote, pairing) and its *intended effect on the reader* (comparison/reflection), constantly contrasting it with hagiography's instrument (suppression of flaw) and effect (imitation), and positioning the modern obit's common practice as caught between these two distinct purposes. Time management is critical; stick ruthlessly to the segments. The check activity is vital for grounding it in their potential practice.
