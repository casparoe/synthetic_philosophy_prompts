prompt: |-
  I'm trying to work out what I actually believe about when a promise binds, going case by case, and I keep hitting a wall. Here are my verdicts.

  - I promised my grandmother, the day before she died, that I'd never let her letters get published. Binds, absolutely, still, 40 years on. Nobody alive can hold me to it and she can't be affected by it either way.
  - Same shape, but the person is alive: my father made me promise I'd never put my mother in a care home. She has advanced dementia now, doesn't know who I am, and the home would clearly be better for her. I think that promise doesn't bind, or binds a lot less. I cannot make these two line up. Neither case has anyone in a position to complain.
  - A guy at work got me to promise to cover his shifts by hinting he'd otherwise mention something I did to the manager. Void, obviously.
  - But my brother in law, who I know full well is running the guilt routine on me every single time, got me to promise the loan. That one binds. Duress voids, manipulation doesn't, and I dont know why.
  - I promised myself no drinking until March. I think it binds, and I think the whole point is that I can't release myself, because the me who'd release it is exactly the one being bound against.
  - Raised my hand at an auction. Never said a word. Bound.
  - Told a contractor "yeah, whatever, I'll cover the extra" when he found rot under the floorboards, purely to keep him working, fully intending to haggle later. Not fine. I'm on the hook for it.
  - Promised my six year old we'd go to the pool Saturday, then it poured and I was knackered. Binds, and if anything harder than the same promise to an adult — which strikes me as backwards from what any planning based story would predict.
  - The venue burnt down before the event I'd promised to cater. No performance owed, but I feel a residue: I owe them the phone call, and probably the deposit back plus something.
  - "I promise I'll name my firstborn after you," to a friend at 1am, both of us laughing. Not binding. But something did happen. He'd feel a bit let down if the kid ended up a Gary, and I'd feel a bit cheap.

  My own tentative principle, which I know is broken: a promise binds in proportion to how much the other person has rebuilt their plans on top of my word. I hand them my will, they build on it, and the bond just is the building. It gets the contractor and the shift cover about right. It totally whiffs on my grandmother (she stopped planning the next morning, so the bond should have decayed to nothing) and it predicts the six year old is the weakest case when I think it's one of the strongest.

  So: is there a principle, or a small set of clauses, that gets most of these? State it precisely, clause by clause, and say which of my cases is doing the work for each clause — I want to see where the pressure is coming from and what would collapse if I dropped that clause. Then tell me what it says about cases I haven't raised, including at least one where I'd be genuinely surprised by the verdict, and be straight with me about which of my verdicts it can't save and which one I should give up. The grandmother/dementia pair is the one I most want cracked open: if no principle can hold both, tell me which of the two intuitions is the illusion and why I have it.

  I don't want a tour of who in the literature said what — no names, no reading list. I want the principle and the reasoning.
reasoning: |-
  Okay, let me tackle this user's deep dive into promise ethics. They've presented nine concrete cases where their moral intuitions about promise-binding conflict, and their proposed "reliance principle" fails to explain key examples - especially the grandmother/dementia contradiction. The core tension seems to be between objective reliance (someone actually changing plans based on the promise) and some deeper, almost metaphysical bond that persists beyond death or incapacity.

  Hmm... the grandmother case is fascinating. The user feels bound despite zero practical consequences, suggesting promises create intrinsic moral debts rather than just instrumental obligations. Meanwhile with the dementia promise, the practical welfare consequences seem to override the promise - except the user notes guilt remains even when releasing themselves. That points to multiple dimensions at play: autonomy-respect vs harm-prevention vs integrity-maintenance.

  For the coercion cases, the work blackmail vs brother-in-law manipulation distinction reveals another layer: promises extracted by threats to basic security (job) void differently than emotional pressure, where consent was still arguably present. The contractor case shows performative intent matters less than reasonable expectation creation. And the auction example proves binding can occur without words at all - through institutional context.

  The self-promise about drinking is particularly insightful. The user recognizes the temporal self-binding function, where present-me uses promise to constrain future-me's weakness. This is less about others' reliance and more about identity continuity. Similarly, the absurd naming promise creates weak but real expectations about relationship maintenance.

  For a unifying framework, I'm considering three axes: 
  (1) Promise gravity (formality/solemnity), 
  (2) Harm potential of breach (to others or self), 
  (3) Reliance reasonableness. 

  Grandmother's deathbed vow scores high on (1) and (2) (dignity harm), making it endure. The dementia care promise might start high but (2) flips when home care becomes harmful. The brother-in-law loan stays binding because while (1) is low, breach causes financial harm. The naming joke fails all three. The six-year-old pool promise gets binding strength from (2) - potential developmental harm to child trust.

  The surprise case? Promising to water a neighbor's plants while they're in a coma. Reliance is zero, but breach would still feel wrong - revealing the integrity dimension. The user might need to sacrifice their "only reliance matters" instinct for the dementia case, recognizing that welfare harm overrides promise obligations when vulnerability increases.
answer: |-
  Here's a principle built from your cases, designed to explain your intuitions while resolving the grandmother/dementia conflict:

  **The Principle of Reciprocal Commitment and Vulnerability:**

  A promise creates a binding moral obligation when it meets **both** of these clauses:

  1.  **Solemn Commitment:** The promise was made in a context implying serious personal commitment (intent to be bound, not jest, coercion, or extreme manipulation), creating a relational debt.
  2.  **Induced Vulnerability:** The promisee (or a vulnerable party they represent) reasonably relies on the promise, making themselves vulnerable to harm (practical, emotional, relational, or dignitary) if the promise is broken, *or* the promise inherently concerns the protection of a fundamental, enduring interest (like dignity, legacy, or core well-being) that persists beyond active reliance.

  **Clause Breakdown & Case Application:**

  1.  **Solemn Commitment (The Debt Creation):**
      *   **Works For:** Grandmother (deathbed vow), Father (serious request re: mother), Brother-in-Law (knowing manipulation, but *you* chose to commit), Self-promise (deliberate self-binding), Auction (institutional context implies commitment), Contractor (verbal agreement in professional context), Child (parental promise), Venue (formal agreement).
      *   **Voids/Weakens:** Work Shift (coercion voids commitment), Baby Name (jest context, no serious intent).
      *   **Pressure Source:** This clause explains why frivolous promises (baby name) or coerced ones (work shift) aren't binding – the core "commitment" element is absent or flawed. Dropping it makes *all* utterances potentially binding, which you clearly reject (e.g., baby name).

  2.  **Induced Vulnerability / Fundamental Interest (The Harm Prevention):**
      *   **Induced Vulnerability (Reliance Harm):**
          *   **Works For:** Work Shift (vulnerable to blackmail *during* coercion), Contractor (relied by continuing work), Child (relied emotionally, making plans), Venue (relied by contracting, preparing; breach causes practical harm), Brother-in-Law (relied by expecting loan, potentially spending it).
          *   **Weakens:** Grandmother (no reliance after death, no practical harm possible), Father/Mother (Mother cannot rely now, Father might not be relying currently).
      *   **Fundamental Interest (Enduring Protection):**
          *   **Works For:** Grandmother (fundamental interest in *posthumous dignity and control over personal legacy* – letters are an extension of her intimate self), Father/Mother (Mother's *fundamental interest in well-being and dignified care* overrides the specific *means* promised (no care home) when that means becomes harmful). Self-promise (fundamental interest in *personal integrity and future-self protection*).
          *   **Voids/Weakens:** Baby Name (no fundamental interest at stake), Venue fire (fundamental interest in holding event is destroyed by fire, leaving only reliance-based residue like deposit return/call).
      *   **Pressure Source:** This dual-track clause resolves the grandmother/dementia conflict. Grandmother binds due to the *enduring fundamental interest* (dignity/legacy). The dementia promise *weakens/binds less* because the *specific instruction* (no care home) conflicts with Mother's *current fundamental interest* (well-being/dignity in her vulnerable state). The *original intent* (protect mother's well-being) persists, but the *method* must adapt. Dropping this clause leaves reliance doing all the work, failing grandmother and self-promise.

  **How it Solves Grandmother vs. Dementia:**
  *   **Grandmother:** Binds strongly due to **Clause 1 (Solemn Commitment)** + **Clause 2 (Fundamental Interest - enduring dignity/legacy)**. Lack of reliance is irrelevant; the core interest persists.
  *   **Dementia:** **Clause 1 (Solemn Commitment)** creates an initial obligation. However, **Clause 2** shows the *vulnerability/reliance* is now minimal (mother unaware, father may not be actively relying). Crucially, adhering to the *letter* of the promise ("no care home") now *violates* Mother's **fundamental interest** in well-being and dignity given her advanced needs. The *spirit* of the promise (her welfare) must take precedence over the *specific instruction*, releasing you from the literal promise while demanding you act in her best interest. The guilt is residue from Clause 1, mitigated by fulfilling Clause 2's core purpose (her welfare).

  **Verdicts Explained & Saved:**

  *   **Grandmother:** Saved (Clause 2: Fundamental Interest).
  *   **Dementia:** Saved (Clause 2: Fundamental Interest overrides specific method; welfare trumps literal promise).
  *   **Work Shift:** Saved (Clause 1 Void - Coercion).
  *   **Brother-in-Law Loan:** Saved (Clause 1 intact; Clause 2 - Induced Vulnerability).
  *   **Self-Promise:** Saved (Clause 1 intact; Clause 2 - Fundamental Interest (integrity)).
  *   **Auction:** Saved (Clause 1 - Institutional context implies commitment; Clause 2 - Induced Vulnerability (auction process reliance)).
  *   **Contractor:** Saved (Clause 1 intact; Clause 2 - Induced Vulnerability (relied by continuing)).
  *   **Child Pool:** Saved (Clause 1 intact; Clause 2 - Induced Vulnerability (strong emotional reliance/trust harm) + arguably Fundamental Interest (child's need for reliable care)).
  *   **Venue Fire:** Saved (Clause 2: Fundamental Interest in event gone; residue is from Induced Vulnerability reliance costs like deposit).
  *   **Baby Name:** Saved (Clause 1 Void - Jest context).

  **Surprise Case Prediction:**

  *   **The Case:** You promise your terminally ill spouse you'll scatter their ashes at a specific remote mountain peak. After their death, you discover the journey is far more dangerous and expensive than anyone knew, involving significant personal risk.
  *   **Principle Verdict:** **Still Binds.** Why? **Clause 1:** Solemn commitment (deathbed/spousal vow). **Clause 2:** Fundamental Interest (posthumous dignity, final wishes, legacy - intensely personal and enduring). The impracticality/danger, while significant, doesn't inherently destroy the *fundamental interest* the promise protects in the way the venue fire did. You might *feel* it's overly burdensome, but the principle says the obligation stands. (You might be surprised if you focused only on reliance or practicality).
  *   **Variation:** If scattering there violated environmental laws or sacred indigenous grounds, *then* the fundamental interest might be overridden by a greater ethical duty, releasing you.

  **What You Likely Need to Give Up:**

  *   **The Strict "Rebuilt Plans = Binding" Reliance Model.** Your principle fails grandmother and self-promise precisely because it ignores the **Solemn Commitment/Fundamental Interest** dimension that creates obligations *independent* of active reliance or planning. The bond isn't *just* the building; it's the act of handing over the will (creating the debt) *plus* the nature of what was entrusted (something fundamental vs. something trivial).

  **Which Intuition is the Illusion (Grandmother/Dementia)?**

  *   **The Illusion:** That the dementia promise *should* bind with the same strength as the grandmother promise because the *structure* (promise to family about care) is similar, ignoring the **radical shift in the fundamental interest at stake**.
  *   **Why you have it:** The *act of promising* feels identical (Clause 1), triggering the same sense of debt. You're conflating the *debt created* (which exists) with the *specific action required* to discharge it. The dementia case reveals that fulfilling the *core purpose* of the promise (protecting welfare/dignity) might require *different actions* than originally specified when circumstances fundamentally change the nature of that welfare. The grandmother's interest (dignity via letter privacy) is static and enduring; the mother's interest (well-being/dignity in care) is dynamic and requires reassessment based on her current profound vulnerability. The intuition that they *should* align comes from focusing on the promise *act* itself, not the underlying *interest* it serves.
