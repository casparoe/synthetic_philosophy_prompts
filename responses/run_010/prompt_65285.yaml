prompt: |-
  I run a small informal forecasting group — eight of us, two historians, two quants, and four people who mostly just like being right — and last month we picked a deliberately long-horizon question: will something recognisable as the current global technological order (world trade roughly at present scale, grid electricity, industrial agriculture, cheap long-distance travel) still be functioning in the year 2300? Predictably the group split not over the answer but over the method, and the argument has now gone on for three meetings and gotten worse, so I want an outside opinion, sorry, a more outside outside opinion.

  My friend R. takes the outside view seriously. He built a spreadsheet with three nested reference classes — hegemonic great powers of roughly the last five centuries, complex agrarian-bureaucratic states of the last few millennia, and urban-literate societies of any kind going back as far as the record allows — and computed a survival distribution at each level. The thing that's bugging me: the median tenure rises monotonically as you widen the class. His story is that widening is the standard cure for a small n, and that it also happens to produce a rosier number because longer-lived kinds of thing are, well, longer-lived. My worry is that the cure for small n and the source of the optimism are the same move wearing two hats — that he's not extracting anything from history so much as choosing which history to be extracted from. There's also a measurement problem I can't get him to engage with: "the end" isn't one event type across those levels. A hegemon can be displaced while everything else carries on, a state can collapse and be replaced by something continuous in every practical respect, and a whole mode of life can fade without any date you could put on a tombstone. So it's not obvious the three rows of his table are even measuring the same quantity, let alone that ours is the same quantity as any of them. And underneath all of it, the case we actually care about has exactly one observed member, which makes me suspect any number that comes out of this is a laundered inside view.

  So here's what I want. Give me your credence in this proposition: for questions about how long the current global technological order lasts, an outside-view estimate built from historical reference classes can supply genuine information — meaning it can rationally move a thoughtful person's credence — over and above what is already contained in the choices they made when constructing the reference class. I want a number and the full decomposition: name each sub-question as its own term, give it a probability and one line of justification, and say how they combine (multiplicatively, or some more honest way). Include at least one term for whether there's any non-arbitrary principle of reference-class selection that survives the n=1 case, one term for whether survival statistics transfer at all across the levels R. nested, and one term for whether a self-sampling style inference — the kind that says your own position in a sequence is itself evidence about the sequence's length — could rescue anything here in cases where the historical base rate can't. Then tell me which term you're least confident about and what would move it most, and separately: is the monotonic pattern (wider class, longer median tenure) an artifact of how the classes are counted, a genuine statistical effect, or simply unknowable from the data he has? Finally, R. is sitting at about 0.7 on the overall proposition and I'm at about 0.15 — tell me which single term you think accounts for most of that gap, because if I can't name it I'll be having this argument again next month. No reading list, no citations, no bibliography — I can't check any of that anyway and it isn't what I'm after. I want your reasoning with its weak spots marked.
reasoning: |-
  Okay, let me try to unpack this user's problem. They run a forecasting group that's stuck on a method debate about predicting the survival of the current global technological order until 2300. Specifically, R. is using an outside view with nested reference classes, and the user is skeptical. 

  First, I need to understand the core disagreement. R. believes widening reference classes provides more data and naturally leads to longer median tenures. The user thinks this is circular - that R. is just selecting the history that gives the desired answer. The user also points out measurement issues: "the end" means different things at different levels (hegemon vs state vs civilization), and our current system is unique (n=1 problem).

  The user wants my credence on whether historical reference classes can provide genuine new information beyond the reference class choices themselves. They want it broken down into specific terms with probabilities and justifications. Required terms include: non-arbitrary class selection (n=1 problem), survival statistic transfer across levels, and self-sampling inference. 

  I should start structuring the decomposition. The multiplicative approach seems cleanest: P(information) = P(class selection valid) × P(transfer valid) × P(self-sampling applicable) × P(measurement solvable). Each term needs a probability and one-line justification.

  For P(non-arbitrary class selection), I'm leaning toward 0.3. At n=1, any class definition feels subjective. For P(survival transfers across levels), maybe 0.4 - agrarian states and tech civilizations seem fundamentally different. P(self-sampling helps) could be 0.5 - it's clever but assumes we're typical. P(measurement solvable) might be 0.6 - we could define "functioning" but dating "ends" is messy.

  Multiplying these gives me 0.036, rounded to 0.04. That's much closer to the user's 0.15 than R.'s 0.7. The biggest gap probably comes from the class selection term - R. likely sees classes as natural categories while the user sees arbitrariness.

  The monotonic tenure increase? Probably an artifact. Widening classes adds more stable entities (civilizations last longer than states), so it's selection bias, not a statistical law. R.'s data can't prove otherwise.

  I'm least confident about self-sampling. The justification feels slippery. Observing our position might tell us something, but only if we assume the process is stationary - which is the whole question!

  The user seems analytically sharp but frustrated. They want ammunition for their next argument with R., not academic citations. I should keep it concrete and mark where I'm uncertain. The key is showing why R.'s widening classes don't "fix" n=1 but just mask it with different history slices.
answer: |-
  Here's my decomposed credence assessment. I'll give the overall probability first: **P(genuine information from reference classes) = 0.04**  

  **Decomposition (multiplicative):**  
  1.  **P(Non-arbitrary class selection exists at n=1):** `0.30`  
      *Justification:* Defining "similar enough" for a unique technological civilization requires subjective choices (e.g., is it energy density? complexity?); no objective, universally agreed-upon principle exists when there's only one true comparator.*  
  2.  **P(Survival statistics transfer across R.'s levels):** `0.40`  
      *Justification:* Hegemons, agrarian states, and urban-literate societies have fundamentally different failure modes and resilience profiles (e.g., collapse vs. succession); assuming their survival distributions are comparable for high-tech global systems is weak.*  
  3.  **P(Self-sampling inference provides valid evidence here):** `0.50`  
      *Justification:* While observing we exist "early" *might* suggest a longer future, it assumes stationarity and that our observation point isn't biased by existing during a fragility window.*  
  4.  **P("The end" can be meaningfully measured consistently):** `0.60`  
      *Justification:* Defining "failure" functionally (e.g., collapse of key systems) is possible but dating it is inherently fuzzy; historical cases often blur continuity/replacement, making precise survival times debatable.*  
  5.  **P(Historical base rates contain signal beyond class-definition noise):** `0.70`  
      *Justification:* While noisy, durations of complex systems *do* cluster (e.g., empires rarely last millennia); some weak signal exists if classes are *very* carefully defined.*  

  **Combination:** `0.30 * 0.40 * 0.50 * 0.60 * 0.70 = 0.0252 ≈ 0.03`. Adjusted to **0.04** for minor unmodeled factors (e.g., potential for partial analogies).  

  **The Monotonic Tenure Pattern:** It's **primarily an artifact of how classes are counted/defined**. Widening the class inherently aggregates more entities with *longer intrinsic lifespans* (e.g., adding "urban-literate societies" includes Egypt/China, vastly older than any hegemon). It's selection bias, not a statistical law about the *same* type of entity. R.'s data likely reflects this compositional effect, not a discoverable "wider view = longer life" truth.  

  **Biggest Gap Term:** **P(Non-arbitrary class selection exists at n=1) (Term 1)**. This is the core philosophical rift. R. (`P≈1.0`) likely sees classes as natural categories where widening objectively improves estimation. You (`P≈0.05?`) see class definition as inherently arbitrary for this unique case, making the "data" an output of prior choices, not an input to update on. This single difference likely explains >60% of your credence gap.  

  **My Least Confident Term:** **P(Self-sampling inference provides valid evidence here) (Term 3)**.  
  *   **Why:** It feels like clever wordplay masking deep uncertainty. Does "our position is random" apply to the lifespan of a *specific* civilization, or just civilizations in general? The stationarity assumption is critical and untestable.  
  *   **What Would Move It:** A rigorous demonstration (simulation?) that self-sampling *reliably* improves tail-probability estimates for unprecedented systems without begging the question. Absent that, it remains highly speculative.  

  **Why 0.04?** The compounding skepticism is brutal. Term 1 (class arbitrariness) and Term 2 (non-transferability) are major filters. Even if you grant some signal exists (Term 5) and a fuzzy definition works (Term 4), the uniqueness of the case (Term 1) and the mismatch of historical levels (Term 2) mean most of the apparent "information" in R.'s spreadsheet is likely an echo of his class-construction choices. Self-sampling (Term 3) is too shaky to rescue it. The outside view here feels less like learning from history and more like projecting your priors *onto* history.
