prompt: |-
  I run post-editing QA for a mid-sized publisher of translated narrative non-fiction — memoirs, popular science, long-form journalism — roughly forty chapters a week across eleven source languages, and for the last two years the first draft of most of that material comes from a commercial neural engine rather than from a human translator. Our workflow is still built for the old failure mode: a post-editor reads the target text against the source and logs mistranslations, omissions, and terminology slips. What it structurally cannot catch is the failure that worries me, the one Hofstadter presses in *Le Ton beau de Marot* and returns to in his later essay on Google Translate: not that the engine gets words wrong, but that it never builds the scene those words describe, so the output is fluent, locally impeccable, and unmoored from any state of the world. Two incidents from our own catalogue made this concrete. In a translated memoir, two consecutive pages referred to the narrator's older brother with feminine pronouns throughout, and nobody noticed for six weeks because every individual sentence read perfectly — the engine had no idea who was in the room. In a popular-science chapter, a safety caveat expressed as a double negative in the source emerged as a flat assertion, and the surrounding paragraph was otherwise so clean that the reviewer signed it off. I have also seen the reverse: the engine produce a version of a dense contractual clause that was tighter and more accurate than the human draft, which tells me the procedure cannot rest on a presumption that machine output is suspect.

  What I want is something my post-editors can actually run — not an essay, not a philosophy lecture — a named, ordered battery of probes to apply to a chapter in about twenty-five minutes, by people with no training in linguistics who, for at least half our language pairs, cannot read the source at all. That last constraint should shape the design rather than be noted in passing: some diagnostics will have to work monolingually on the target text alone, and the procedure must say explicitly which probes those are and which require a bilingual reader, because a checklist that assumes a reader we do not have is worse than no checklist. For each probe I need the operation to perform on the passage, what a pass looks like, what a fail looks like, the rough time cost, and what a fail licenses us to conclude; and I want the evidential logic stated plainly, including the asymmetry I suspect is real — that a failed probe is evidence about the absence of a constructed scene while a passed probe is not evidence of its presence — together with instructions for what to do given that. Then the decision rules: at what point a post-editor patches a sentence locally, at what point the chapter escalates to a bilingual editor, and at what point we reject the engine run for the whole title and commission a fresh translation, with thresholds stated rather than left to feel. Our senior editor signs off on anything escalated, and the economics should be visible in the thresholds: a false alarm costs us about three days and a freelance re-translation at roughly €600, whereas a miss costs a correction notice and, in the memoir case, an apology to a living author's family.

  Three things I would like handled candidly. First, tell me which parts of Hofstadter's argument had to be dropped or distorted to fit inside twenty-five minutes, and which distinctions genuinely had to survive the compression; I would rather be told that the procedure tests a cheap proxy for "no mental movie behind it" than be sold the proxy as the real thing. Second, deal with contamination: our vendor's models are trained on corpora that plausibly contain exactly the sort of probe sentences a clever reviewer would invent, and our style guides are public, so a probe that was diagnostic in 2023 may now be pattern-matched rather than understood — say which probes are most likely to have gone hollow and how the battery should be rotated or varied in response. Third, mark where judgment cannot be eliminated — deliberate ambiguity, wordplay, an author who means to disorient, questions of register and voice — and where the procedure will misfire in a predictable direction. Then run it on three cases: (a) a page of memoir in which the engine has misgendered a recurring character while every sentence remains locally correct; (b) a deliberately vertiginous stretch of literary non-fiction, full of unresolved pronouns and intended contradictions, which I expect the procedure to condemn and which I believe is an excellent translation — here I want you to say outright that the procedure returns the answer I will not like, and what should be allowed to override it; and (c) a technical passage that passes every probe cleanly and nevertheless contains a false statement about the world that no probe we could afford to run would expose. Close with what the procedure cannot do at all, and where it will make my post-editors worse rather than better.
reasoning: |-
  Okay, let me start by really unpacking what this user is asking for. They run post-editing QA for a publisher dealing with translated narrative non-fiction. Their main concern isn't just typical translation errors but something deeper—what Hofstadter calls the lack of a "mental movie" or constructed scene. The examples they gave, like consistent misgendering in a memoir or a double negative turned into an assertion in a science text, really highlight how fluent yet disconnected the MT output can be. 

  The user needs a practical, time-efficient checklist for post-editors, many of whom don't even speak the source language. They want clear probes with specific operations, pass/fail criteria, time estimates, and implications. There are constraints: 25 minutes per chapter, some monolingual checks, and handling cases where probes might be gamed by the MT system. Also, they need decision rules for when to escalate or reject a translation.

  First, I need to address Hofstadter's core idea—does the text create a coherent scene? But compressing that into a 25-min checklist means focusing on detectable symptoms, like entity tracking, causal chains, or logical connectors. The user is aware this is a proxy, so honesty about what's lost is key. For example, the "mental movie" can't be directly tested, so we rely on coherence markers.

  Next, contamination. The MT might recognize probe patterns from training data. So probes should be varied and rotated. Using abstract scenarios or changing templates monthly could help. Also, some probes are more resistant, like those requiring inference beyond the sentence, while others (e.g., pronoun checks) might be gamed faster.

  Handling ambiguity is tricky. The procedure might flag intentional disorientation as a failure. The user's example (b) of vertiginous text is a case where the checklist would wrongly condemn a good translation. So, exceptions for stylistic choices are necessary, maybe a bypass option with notes.

  For the three test cases: 
  (a) The misgendering in memoir—probes on entity consistency would catch it, especially if checking pronouns across sentences. 
  (b) The vertiginous passage—probes on ambiguity and contradiction would flag it, but here the procedure should allow reviewer override if intentional.
  (c) The technical passage with undetected falsehood—probes won't catch it, so the procedure must acknowledge that factual accuracy isn't covered.

  Time management is crucial. Each probe needs to be quick, under 2-3 minutes. Monolingual probes save time but have limitations. Bilingual checks are deeper but require specific skills. The decision rules must balance cost: false alarms (€600) vs. misses (reputation damage).

  The user also mentioned economics, so thresholds are vital. For example, one critical failure might trigger a full re-translation, while minor issues get patched. Clarity here prevents subjective calls.

  Finally, limitations: The procedure can't ensure factual correctness or capture deep stylistic subtleties. Over-reliance might make editors complacent with fluent but hollow text. So, training on the "why" behind probes is essential, even if they're not linguists.
answer: |-
  Here is a concrete, executable QA procedure designed to detect "unmoored fluency" within your 25-minute/chapter constraint. It prioritizes *detectable symptoms* of missing coherence over philosophical depth, with explicit guardrails for its limitations.

  **Core Principle:** We test for *coherence anchors* – elements forcing the engine to build a scene. Failure indicates absence, success does not guarantee presence. The procedure is asymmetric.

  **The Coherence Anchor Checklist (25-Minute Protocol)**

  1.  **Probe: Entity Tracking & Consistency (Monolingual - Target Text)**
      *   **Operation:** Scan the chapter for 3-5 key named entities (people, places, specific objects). For each, track their pronouns, descriptors, and core actions over 2-3 pages. Note sudden shifts.
      *   **Pass:** Consistent pronouns, descriptors logically align with actions/context (e.g., "the chemist" performs chemistry, "she" remains "she").
      *   **Fail:** Pronoun/descriptor mismatch (e.g., "Dr. Vargas" becomes "he", then suddenly "she" without reason), illogical actions (e.g., "the oak tree whispered secrets" in a non-fiction botany text), entity vanishing/reappearing illogically.
      *   **Time:** 5-7 mins (Focus on key entities, not all).
      *   **Evidential Logic:** Failure strongly suggests the engine isn't modeling entities within a persistent scene. Pass is weak evidence (could be pattern-matching).
      *   **Fail Consequence:** **Escalate IMMEDIATELY to bilingual editor.** This is a critical coherence failure. Do not patch locally.

  2.  **Probe: Causal Chain Verification (Monolingual - Target Text)**
      *   **Operation:** Identify 2-3 explicit cause-effect statements (look for "because", "therefore", "led to", "resulted in"). Verify the effect plausibly follows from the stated cause *within the world described*.
      *   **Pass:** Effect logically follows cause (e.g., "The dam broke (cause), flooding the valley (effect)").
      *   **Fail:** Effect is nonsensical or contradicts known facts *within the text's own established context* (e.g., "He forgot his keys (cause), therefore the moon is made of cheese (effect)" OR "The drought worsened (cause), leading to record crop yields (effect)" without explanation).
      *   **Time:** 3-5 mins.
      *   **Evidential Logic:** Failure indicates inability to model basic world logic or track stated relationships. Pass is weak (could be rote connector use).
      *   **Fail Consequence:** **Patch locally if isolated and clear fix.** If unclear or recurring pattern, **escalate to bilingual editor.**

  3.  **Probe: Negation & Modality Trap (Bilingual - Requires Source)**
      *   **Operation:** Identify sentences containing explicit negations ("not", "no", "never", "cannot"), prohibitions ("must not", "avoid"), or strong modalities ("might", "could", "possibly"). Compare source and target for logical equivalence of the negation/modality's *scope and force*.
      *   **Pass:** Negation/modality scope and force match (e.g., "not allowed" = "prohibited", "might cause" ≠ "will cause", double negative preserved or correctly simplified).
      *   **Fail:** Negation dropped ("not safe" → "safe"), weakened ("must not" → "should avoid"), strengthened ("could fail" → "will fail"), modality inverted ("unlikely" → "likely"), double negative misinterpreted.
      *   **Time:** 5-7 mins (Focus hunt on high-risk areas: warnings, hypotheses, contrasts).
      *   **Evidential Logic:** Failure is a direct signal of failing to parse/represent logical operators and their impact on meaning within a proposition. Pass is necessary but insufficient for deep coherence.
      *   **Fail Consequence:** **Patch locally IMMEDIATELY** if clear. If complex or involving double negatives, **escalate to bilingual editor.** Safety-critical fails trigger immediate escalation.

  4.  **Probe: Pronoun/Deictic Ambiguity Stress Test (Bilingual - Requires Source)**
      *   **Operation:** Find sentences where pronouns ("it", "this", "they", "he", "she") or deictics ("here", "there", "now", "then") have multiple possible antecedents/referents in the immediate context (1-3 prior sentences). Verify the target pronoun/deictic points to the *same* entity/point as the source.
      *   **Pass:** Unambiguous link to the correct antecedent/referent matches source.
      *   **Fail:** Ambiguity introduced where source is clear, ambiguity resolved incorrectly, pronoun mismatched (gender/number).
      *   **Time:** 5-6 mins (Scan for clusters of pronouns/deictics, focus on dense paragraphs).
      *   **Evidential Logic:** Failure indicates inability to track references across sentences, a core scene-building function. Pass is weak (antecedent might be close/obvious).
      *   **Fail Consequence:** **Patch locally** if antecedent is clear. If ambiguous or core character/object involved, **escalate to bilingual editor.**

  5.  **Probe: Register & Stylistic Echo (Monolingual - Target Text)**
      *   **Operation:** Read 1-2 paragraphs aloud. Does the voice feel consistent (e.g., academic, conversational, lyrical)? Do stylistic elements (short/long sentences, metaphors, jargon level) align with the *apparent* genre and authorial intent inferred from the *target text alone*? Flag jarring shifts.
      *   **Pass:** Consistent "voice" feel within the sampled text. Style matches genre expectations (e.g., memoir has personal tone, science has precise terms).
      *   **Fail:** Sudden, unexplained shifts in formality, tone, or sentence complexity. Inappropriate jargon or colloquialism. Generic, "flat" prose devoid of authorial fingerprint where context suggests there should be one.
      *   **Time:** 3-4 mins (Relies on post-editor's feel for the *target* language's norms).
      *   **Evidential Logic:** Failure suggests stitching sentences without modeling a consistent speaker/context. Pass is very weak evidence for deep coherence; fluent blandness passes easily.
      *   **Fail Consequence:** **Note for bilingual editor review.** Rarely a sole reason for rejection. Patch locally if minor stylistic slip.

  **Decision Rules & Thresholds**

  *   **Patch Locally:** Single, clear-cut failures in Probes 2, 4, or 5 where the fix is obvious and contained (e.g., wrong pronoun, dropped negation, minor stylistic glitch).
  *   **Escalate to Bilingual Editor:**
      *   ANY failure in Probe 1 (Entity Tracking).
      *   ANY failure in Probe 3 (Negation/Modality) that is complex or safety-related.
      *   >1 clear failure in Probes 2 or 4 within a chapter.
      *   Significant/consistent failure in Probe 5 combined with other minor flags.
      *   ANY pattern suggesting systemic incoherence, even if individual probes pass.
  *   **Reject Engine Run / Commission Retranslation:**
      *   Escalation reveals pervasive failures across multiple probes (e.g., consistent entity drift, multiple critical negation errors, widespread ambiguity creation).
      *   Escalation reveals a failure so severe it undermines the chapter's core meaning (e.g., misgendering a main character throughout, reversing a crucial scientific finding via negation error).
      *   **Threshold:** More than ~10% of the chapter requires substantive bilingual rework stemming from coherence failures, or ANY single failure posing significant reputational/ethical/safety risk (e.g., misgendering, safety warning error). **Economic Driver:** Cost of widespread rework/review + risk cost > €600 retranslation.

  **Candid Handling of Constraints & Risks**

  1.  **Hofstadter Compression:**
      *   **Dropped:** The "mental movie" itself. We test proxies: entity persistence, logical links, reference tracking. These are symptoms of potential incoherence, *not* proof a scene was built. Passes prove fluency, not understanding.
      *   **Survived:** The core distinction between *local fluency* (sentence-level correctness) and *global coherence* (scene/logic across sentences). The asymmetry of evidence (failure is significant, pass is not).

  2.  **Contamination & Hollow Probes:**
      *   **Most Vulnerable:** Probe 5 (Register/Style) - easiest to pattern-match generic "academic" or "conversational" outputs. Probe 1 (Entity Tracking) if entities are very common/patterned.
      *   **Resistant:** Probe 3 (Negation/Modality) - logical relationships are harder to fake without understanding. Probe 4 (Pronouns/Deictics) - requires real-time context tracking.
      *   **Mitigation:**
          *   **Rotate Probe Templates:** Monthly, subtly change the *way* probe instructions are phrased or the examples given internally.
          *   **Vary "Trap" Examples:** For Probe 3, use diverse phrasings for negation/double negatives. For Probe 4, create ambiguous scenarios not easily found in training data.
          *   **Prioritize Probes 3 & 4:** Their failures are higher-signal. Probe 5 is the weakest link.
          *   **Abstract Probes:** Occasionally use slightly abstract or unusual but verifiable cause-effect or entity descriptions unlikely to be memorized.

  3.  **Unavoidable Judgment & Misfires:**
      *   **Judgment Required:** Deliberate ambiguity, wordplay, unreliable narrators, complex metaphors, subtle register shifts. **Probe 5 is especially vulnerable here.**
      *   **Predictable Misfires:**
          *   **False Positives:** Will condemn intentional disorientation (Case B), lyrical ambiguity, or sophisticated voice shifts as "incoherent".
          *   **False Negatives:** Will pass fluent nonsense that happens to get entities/pronouns/logic right locally (Case C), deeply buried factual errors, and bland but coherent text lacking authorial voice.
      *   **Override for Case B (Vertiginous Passage):** If the procedure flags intentional disorientation as failure, the **bilingual editor/senior editor MUST override** based on source intent and literary merit. Document the override. The checklist flags potential incoherence; human judgment determines if it's intentional and effective.

  **Testing the Cases**

  *   **Case A (Misgendered Character):**
      *   Probe 1 (Entity Tracking): **FAIL.** Consistent pronoun mismatch for a key entity. Triggers immediate escalation. Bilingual editor finds the error.
  *   **Case B (Vertiginous Literary Non-Fiction):**
      *   Probes 1 & 4: Likely **FAIL** due to unresolved pronouns/ambiguity.
      *   Probe 2: May **FAIL** if contradictions break causal logic.
      *   Probe 5: May **FAIL** due to jarring shifts (if intentional).
      *   **Result:** Procedure condemns it. **Override Required.** Senior editor, confirming source intent and literary quality, approves it. The checklist did its job (flagged potential incoherence), but human judgment supersedes for artistic intent.
  *   **Case C (Technical Passage with Undetected Falsehood):**
      *   All Probes: **PASS.** Entities consistent, logic connects, negations correct, pronouns clear, register appropriate. The false statement is a *factual error within a coherent but incorrect model*. **The procedure is blind to this.** It only checks internal coherence and basic logic, not external truth.

  **What the Procedure CANNOT Do**

  1.  **Guarantee Factual Accuracy:** It checks internal logic and coherence, not truth against reality (Case C).
  2.  **Detect Deep Semantic Errors:** Subtle shifts in meaning where words are correct but connotations or implications are wrong, *if* coherence anchors hold.
  3.  **Capture Authorial Voice Depth:** It catches jarring shifts (Probe 5 Fail), but passes fluent blandness. Nuanced, distinctive voice is hard to verify quickly.
  4.  **Handle Intentional Complexity Perfectly:** It will misfire on deliberate ambiguity/contradiction, requiring override (Case B).
  5.  **Eliminate Need for Skilled Bilingual Review:** Escalation paths are critical. Monolingual checks are limited proxies.

  **Where It Might Make Things Worse**

  1.  **Complacency with Fluency:** If chapters consistently "pass," post-editors might reduce scrutiny, missing subtle errors the probes don't cover.
  2.  **Over-Reliance on Procedure:** Treating it as comprehensive rather than a coherence safety net. "It passed the checklist" ≠ "It's perfect."
  3.  **Chilling Effect on Style:** Post-editors or translators might avoid complex, ambiguous, or voice-driven writing for fear of false positives, leading to blander translations.
  4.  **Resource Drain if Poorly Calibrated:** Too many false escalations wastes bilingual editor time; too few misses errors. Thresholds need monitoring.

  **Implementation Advice:**

  *   **Train on Examples:** Use your own cases (misgendering, double negative) to demonstrate probes and decision rules.
  *   **Track Results:** Log probe fails, escalation reasons, and override outcomes. Refine thresholds/probes based on data.
  *   **Empower Senior Editors:** They are the final arbiters for overrides and rejection decisions.
  *   **Communicate Limitations:** Ensure post-editors understand this targets *coherence failures*, not all translation errors.

  This procedure provides a structured, time-bound method to catch the most damaging symptoms of "unmoored fluency," explicitly acknowledging its limits and the irreducible need for human judgment in key areas. It prioritizes actionable results over philosophical purity.
