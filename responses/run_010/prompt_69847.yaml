prompt: |-
  I am a junior and the recording secretary of my school's student council, and after our debate coach lent me a copy of J. L. Austin's *How to Do Things with Words* I got as far as the first few lectures before realizing that the interesting part for me is not Austin's list of conditions but my own reactions to cases from the meetings I actually sit through. I have been keeping a running record of moments where saying something seemed to do something, and where it seemed not to, and I have sorted each one into "the act happened" or "it didn't." What I want from you is not a survey of speech act theory — I would rather you engage with my list than with the literature — but a principle, or the smallest workable set of conditions, that generates my verdicts, with the case that motivates each clause. Here are the verdicts.

  1. At a council meeting our president says "I appoint Priya treasurer," and the bylaws give the president that power: Priya is treasurer.
  2. A sophomore with no office says the identical sentence in the hallway, half as a joke: nothing happens. But I do not think he said anything false, or that he lied; he just didn't manage to do it.
  3. The bylaws were amended last spring so that the treasurer is elected by a council vote. This fall the president again says "I appoint Priya treasurer," seriously, in session, and everyone understands her: still nothing happens, even though she is exactly the right person.
  4. A classmate says "I'll return the textbook Monday" as a promise while already intending not to: I think a promise was made, and then broken.
  5. A friend says "I'm sorry" in a completely flat voice, rolling her eyes: I think she apologized. Badly, hollowly, but she did it.
  6. A teammate is told by the coach that unless he says, right now, that he promises to leave the team, he will be cut. He says it. I think no promise was made at all. This is the pair I cannot reconcile: in 4 and 5 something internal is missing and the act still goes through; in 6 something internal is missing and I want to say the act is void. If you tell me coercion is the difference, I want to know what about coercion does the work that insincerity fails to do.
  7. A club officer types "I resign" into an email and sends it to the faculty adviser from her bedroom at eleven at night: it counts, with no ceremony and no one present. The same sentence typed into an unsent draft: nothing.
  8. In the spring production, an actor playing a judge pronounces a sentence on another character: nothing happens to the actor playing the convict. The same actor, twenty minutes after the final curtain, says "I quit" to the stage manager: that counts. So it is not the words, and it is not the person, and I am not sure it is even the intention, since she intended to say those lines all along.
  9. My grandmother told my uncle "I forgive you" long after their estrangement, and I think the forgiveness was real; she needed nothing from him. But when I said "I bet you ten dollars it rains tomorrow" to a friend who laughed and walked off, I do not think there was any bet. So some of these acts seem to require that the other party take them up and some do not, and I have no idea which is which, or what makes the difference.
  10. Whispering "I promise I'll visit every week" to a friend who has fallen asleep on the bus: I lean toward saying no promise was made, or at least none that binds. This seems to conflict with 7, where nobody was listening either, or at least nobody was in the room.
  11. The chair announces "I declare this meeting adjourned" five minutes after the meeting ended and the room emptied: it fails, though she plainly has the authority, and though everyone present was serious.
  12. My chemistry teacher says "Is that your phone out?" — no performative verb, no first person, not even a statement of a rule — and I think this is genuinely a command, that putting the phone away is obeying it, and that answering "yes" and continuing to scroll would be a kind of cheating. So some of these acts get done with no formula at all, and I want to know whether your principle is meant to cover that case too or whether it belongs to a different species.

  So: is there one account that delivers all twelve, and if there is not, which of my verdicts should I surrender to buy a simpler principle — and if you would rather keep every verdict, tell me honestly what the extra clauses cost you. Then give me the account's verdicts on cases I have not thought through: a resignation letter that is mailed but returned unopened and never read; wedding vows spoken by someone who is heavily intoxicated; a teacher saying "I hereby expel you" with no such power, in a school where everyone mistakenly believes she has it; a chatbot telling me it promises to remember our conversation for next time, where I cannot decide whether the failure is that it cannot intend anything or that its word simply does not count; a parent who says "say you'll never do that again" and waits for the words; and two students who say "I'm claiming this table" at the same instant in the cafeteria, where I cannot tell whether the first speaker wins, whether both lose, or whether there is no fact of the matter. One further thing I keep circling: I suspect that when I write "it didn't work" I am reporting at least three different outcomes — nothing at all happened, something happened but it was hollow, and something happened that nevertheless does not bind anyone. If you think the binary of felicitous and infelicitous is the wrong frame for what I have been recording, say so and tell me how the outcomes should actually be divided.
reasoning: |-
  We are given twelve cases with the student council secretary's verdicts. The goal is to find a principle (or a small set of conditions) that explains all these verdicts, and then to apply that principle to new cases. If no single principle can cover all, we must decide which verdicts to surrender for simplicity, or else accept a more complex account.

  Let me first restate the cases and the verdicts:

  1. President appoints Priya treasurer (with proper authority): **act successful**.
  2. Sophomore says the same words jokingly: **act fails** (nothing happens).
  3. President tries to appoint when the bylaws changed (now requiring a vote): **act fails**.
  4. Promise to return a book (with insincere intention): **promise made and then broken** (so the act of promising happened).
  5. Insincere apology (flat voice, eye-roll): **apology happened** (but hollow).
  6. Coerced promise (to leave team, under threat): **no promise made**.
  7. Resignation email sent: **counts**. Unsent draft: **does not count**.
  8. Actor in play: **not a real act**. Same actor after the play: **real resignation**.
  9. Forgiveness without the other party: **forgiveness happened**. Bet proposed and ignored: **no bet**.
  10. Promise whispered to a sleeping friend: **no promise** (or at least not binding).
  11. Adjournment declared after the meeting ended: **fails**.
  12. Teacher's question "Is that your phone out?" interpreted as a command: **command issued**.

  The main challenges are:

  - Insincerity: In (4) and (5), insincerity doesn't prevent the act from occurring (though it may be defective). But in (6), coercion seems to prevent the act entirely.
  - Uptake: In (9), forgiveness doesn't require the other party to accept, but a bet does. In (10), a promise to a sleeping person might not take effect.
  - Context: The same words by the same person can be effective or not depending on the context (e.g., 8).
  - Non-explicit performatives: (12) shows that an act can be done without a performative verb.

  We are also asked about the binary of felicitous and infelicitous: the secretary suspects that "it didn't work" might mean different things.

  I propose an account based on three conditions for a speech act to be successful (i.e., to occur at all). This account draws from Austin and others but focuses on the patterns in the cases.

  **Conditions for a successful speech act:**

  1. **Authority and Position**: The speaker must have the requisite authority, and the context must be appropriate (including any institutional rules). This covers cases where the act requires a specific role.

  2. **Uptake and Reciprocity**: For some acts, the act requires that the hearer (or relevant party) take it up, or that there be a convention of reciprocity. This is especially true for acts that create mutual obligations (like bets) or require the hearer to be in a position to receive the act (like a promise).

  3. **Seriousness and Commitment**: The words must be uttered with a serious intention to perform the act, and without defects that completely vitiate the commitment (like coercion, which undermines the voluntariness). However, mere insincerity (without coercion) does not prevent the act from occurring (though it makes it defective).

  But note: In (4) and (5), insincerity doesn't prevent the act from occurring, but in (6) coercion does. So we must distinguish between:

  - **Defective but existent acts**: Insincere (without coercion) but uttered in the right context with the right form. They occur but are flawed (they are "abuses" in Austin's terms).
  - **Void acts**: Where the act doesn't occur at all because of a fundamental flaw (like lack of authority, or coercion).

  Also, we must account for the requirement of uptake:

  - Some acts are **unilateral**: They depend only on the speaker and the context (like resigning, forgiving, appointing). They do not require the hearer to do anything for the act to be accomplished.
  - Some acts are **bilateral**: They require the hearer's acceptance or at least the possibility of uptake (like bets, promises in some contexts).

  Now, let's go through each case with the conditions:

  1. **President appoints Priya**: 
     - Authority: President has it (by bylaws). 
     - Context: In session. 
     - **Success** (Condition 1 satisfied).

  2. **Sophomore jokingly appoints**:
     - Authority: None. 
     - Also, not serious. 
     - **Failure** (Condition 1 and 3? But note: Condition 1 is primary here. Even if he were serious, he lacks authority. Also, he is joking, so not serious. We can say Condition 1 and Condition 3 (seriousness) both fail, but Condition 1 is the main one).

  3. **President appoints after bylaw change**:
     - Authority: No longer has the power (now requires vote). 
     - **Failure** (Condition 1).

  4. **Insincere promise**:
     - Authority: Anyone can promise (no special role needed). 
     - Uptake: Not explicitly required for a promise to occur (though it may affect its bindingness). 
     - Seriousness: The words are seriously uttered (it's not a joke, even if insincere). 
     - But note: The secretary says the promise was made and then broken. So the act of promising occurred. 
     - **Success** (but defective due to insincerity). Condition 3 (seriousness) is met in the sense that the utterance is seriously offered as a promise (even if internally insincere). The defect is in the sincerity condition.

  5. **Insincere apology**:
     - Similar to 4: The words are uttered in a context where they count as an apology. The flat tone and eye-roll make it insincere, but it is still an apology (a bad one). 
     - **Success** (defective).

  6. **Coerced promise**:
     - The secretary says no promise was made. Why? Coercion undermines the voluntariness. We can say that the promise is not made because the speaker is forced and thus does not genuinely commit. 
     - Condition 3 (seriousness and commitment) is violated in a fundamental way: the speaker is not committing voluntarily. 
     - Alternatively, we might say that the context of coercion makes the act void. 
     - **Failure**.

  7. **Resignation email**:
     - Sent: **Success**. Why? The act of resignation is unilateral. It requires communication (sending) but not necessarily receipt or acceptance. The faculty adviser might not have read it, but the resignation is effective upon sending (if that is the convention). 
     - Unsent draft: **Failure** (not communicated). 
     - Condition: The act requires that the utterance be issued (or sent) in the appropriate manner. For resignation by email, sending is sufficient.

  8. **Actor in play vs. after play**:
     - In play: The context is fictional. The actor is not acting as herself but as a character. Condition 1 (appropriate context) fails. 
     - After play: The context is real. Condition 1 satisfied. 
     - Also, the words are uttered seriously in the real context. 
     - So: **Failure** in the play, **Success** after.

  9. **Forgiveness vs. Bet**:
     - Forgiveness: Unilateral act. It does not require the forgiven person to accept. Condition: The speaker must have the standing (but that is not an issue here). **Success**.
     - Bet: Requires mutual agreement. When the friend walks off, there is no uptake. Condition 2 (uptake) fails. **Failure**.

  10. **Promise to a sleeping friend**:
      - The secretary leans toward no promise (or not binding). Why? The promise requires that the hearer be in a position to take it up (or at least to receive it). Since the friend is asleep, there is no communication. But note: In (7), the resignation was sent and the adviser might not have been awake either. The difference? 
      - For resignation, the convention is that sending is enough. For a promise, the promisee must be aware of the promise for it to create an obligation? Or is it that the promise is made but the obligation is weaker? 
      - We can say: The act of promising still occurs (the speaker has committed), but the obligation might be conditional on the promisee's awareness? But the secretary says "no promise was made, or at least none that binds." 
      - To reconcile with (7): The resignation is a formal act that is complete upon sending. A promise is an interpersonal act that requires the promisee to be aware? 
      - Alternatively, we can say that the promise is made but it is defective because the promisee did not hear it? 
      - However, the secretary's intuition is that it doesn't bind. So let's say: **Failure** (or at least the act is not fully successful). Condition 2 (uptake) is not satisfied because the promisee must be in a position to receive the promise for it to take effect? But note: in (4), the promise is made even if the hearer doesn't believe it. 
      - I think the key is that for a promise, the utterance must be addressed to the promisee and the promisee must be capable of receiving it (i.e., not asleep). But if the friend is asleep, it's as if the promise was not communicated. So **Failure**.

  11. **Adjournment after meeting ended**:
      - The meeting is already over. The context is no longer appropriate. Condition 1 (context) fails. **Failure**.

  12. **Teacher's command as a question**:
      - The words are not explicit, but the context (teacher-student, rule against phones) makes it a command. Condition: The act can be done without explicit performative if the context and convention support it. **Success**.

  Now, the main sticking points:

  - (4) and (5) vs (6): Why does insincerity not void the act but coercion does? Because coercion removes the element of voluntary commitment, making the act not just defective but void. Insincerity is an internal state that doesn't necessarily show in the act (so the act is done but dishonestly). Coercion, by contrast, undermines the very possibility of commitment.

  - (7) vs (10): Why does sending an email count but whispering to a sleeping person not? Because the resignation is a formal act that is complete upon sending (it is a convention of the institution). A promise is an informal act that requires the promisee to be aware to create the obligation. Alternatively, we might say that for a promise, the communication must be received (or at least the promisee must be in a state to receive it) for the act to be complete. But note: in (4), the promise is made even if the promisee doesn't believe it. The difference in (10) is that the promisee is not even aware. So the act of promising requires that the promisee is addressed and the utterance is made in their presence (and they are capable of hearing). If they are asleep, it's not properly addressed.

  - (9): Forgiveness vs Bet. Forgiveness is unilateral, so no uptake is needed. Bet requires agreement (uptake).

  **A Unified Account Proposal:**

  We can use a set of conditions:

  A. **Preparatory Conditions** (must be satisfied for the act to be attempted):
     1. The speaker has the required authority (for acts that require it).
     2. The context is appropriate (e.g., the meeting is ongoing for adjournment, the person is not acting in a play, etc.).
     3. The utterance is communicated appropriately (e.g., sent in an email for resignation, said to an awake person for a promise).

  B. **Sincerity Condition** (if violated, the act is performed but defective):
     - The speaker must have the corresponding mental state (e.g., intention to keep a promise, feeling sorry for an apology). If missing, the act is insincere.

  C. **Commitment Condition** (if violated, the act is void):
     - The speaker must be voluntarily committing to the act. Coercion violates this.

  D. **Uptake Condition** (for bilateral acts):
     - For acts that create mutual obligations (like bets, contracts) or require acceptance (like some appointments), the other party must accept (or at least not reject) for the act to be complete. For unilateral acts (like resigning, forgiving), uptake is not required.

  Now, applying to the cases:

  1. **Appointment**: 
     - A1 (authority): satisfied. 
     - A2 (context): meeting. 
     - **Success**.

  2. **Sophomore**: 
     - A1 (authority): not satisfied. 
     - Also, not serious (so C? But A1 is primary). **Failure**.

  3. **President after bylaw change**: 
     - A1: not satisfied. **Failure**.

  4. **Insincere promise**: 
     - A3: communicated. 
     - B: violated (insincere) → defective but done. 
     - C: voluntary → satisfied. 
     - **Success** (defective).

  5. **Insincere apology**: 
     - Similar: A3 (communicated), B violated, C satisfied. **Success** (defective).

  6. **Coerced promise**: 
     - A3: communicated. 
     - C: violated (involuntary due to coercion) → void. **Failure**.

  7. **Resignation email**: 
     - A2: context? Sending email is appropriate. 
     - A3: sent → communicated. 
     - **Success**. Unsent: A3 violated → **Failure**.

  8. **Actor**: 
     - In play: A2 (context) violated (fictional). **Failure**. 
     - After play: A2 satisfied. **Success**.

  9. **Forgiveness**: 
     - Unilateral, so no D required. **Success**. 
     - Bet: Requires D (uptake) → not satisfied. **Failure**.

  10. **Promise to sleeping friend**: 
      - A3: not satisfied? The promisee is not in a state to receive the communication. We might say communication must be to an audience capable of receiving. **Failure**.

  11. **Adjournment after meeting**: 
      - A2 (context): meeting already over → violated. **Failure**.

  12. **Teacher's command**: 
      - Even without explicit performative, the context and convention make it a command. We can say the act is successful. Condition: The utterance must be interpretable as the act in the context. **Success**.

  **New Cases**:

  We'll apply the same conditions.

  a. **Resignation letter that is mailed but returned unopened and never read**:
     - If the convention is that sending is enough (like email in case 7), then it is effective. The act is unilateral and complete upon sending. **Success**.

  b. **Wedding vows spoken by someone heavily intoxicated**:
     - Intoxication might undermine the commitment condition (voluntariness and capacity). If the person is so drunk that they cannot understand the act, then the act is void. **Failure**. (But note: in law, intoxication can invalidate contracts.)

  c. **Teacher saying "I hereby expel you" without power, but everyone believes she has it**:
     - Condition A1 (authority) is not satisfied. Even if everyone believes, the teacher lacks the actual authority. **Failure**.

  d. **Chatbot saying "I promise to remember our conversation"**:
     - The issue: can a chatbot have intentions? Condition B (sincerity) and C (commitment) require a human agent. Without the capacity to intend or commit, the act is void. Also, there might be no convention for taking a chatbot's promise seriously. **Failure**.

  e. **Parent says "say you'll never do that again" and waits for the words**:
     - The child says the words. Is it a promise? The child might be coerced. Condition C: if the child is forced, then it might be void. But note: this is not as extreme as case 6. If the child says the words under duress, then the promise might be void. Alternatively, if the child says it voluntarily (even if prompted), then it counts. However, the parent is demanding the words, so it might be coerced. The secretary might consider it a promise but defective? But the verdict in case 6 was that no promise was made. So if this is coercion, **Failure**. But if it's just a demand and the child freely says it, then **Success** (though insincerity might be present).

  f. **Two students say "I'm claiming this table" at the same instant**:
     - This is a declaration. Condition: It requires authority? Probably not, but it requires that the table not be already claimed. Also, there might be a rule of first claim. But if they say it at the same time, then neither has precedence. The act might be attempted by both but not completed because of conflict. **Failure** for both? Or we might say that the act is not one that can be done by two at once, so neither succeeds.

  **On the Binary of Felicitous/Infelicitous**:

  Austin originally distinguished between:
  - Misfires: the act is not achieved (conditions A not satisfied).
  - Abuses: the act is achieved but insincere (conditions B not satisfied).

  But we also have:
  - Void acts due to coercion (which we put as a separate condition C).
  - Acts that require uptake (condition D) and fail if not obtained.

  So the secretary is right: "it didn't work" can mean:

  1. **Misfire**: The act was not performed at all (due to lack of authority, wrong context, not communicated, etc.). Examples: 2, 3, 8 (in play), 10 (sleeping), 11, and new case c.
  2. **Coercion void**: The act was not performed because the commitment was not voluntary (6 and possibly e if coerced).
  3. **Uptake failure**: The act was attempted but not completed because the other party did not accept (9 bet, and possibly 10 if we consider the sleeping person as making uptake impossible).
  4. **Abuse**: The act was performed but insincere (4, 5).

  In addition, we have:

  5. **Successful**: All conditions met.

  So the binary is too coarse. We should have:

  - **Successful**: All conditions (A, B, C, and D if applicable) satisfied.
  - **Defective but existent**: A, C, and D (if applicable) satisfied, but B violated (insincere).
  - **Void (misfire)**: A violated.
  - **Void (coercion)**: C violated.
  - **Void (uptake)**: D violated (for bilateral acts).

  Now, for the secretary's list:

  - Case 1: Successful.
  - Case 2: Void (misfire: authority and context).
  - Case 3: Void (misfire: authority).
  - Case 4: Defective (insincere).
  - Case 5: Defective (insincere).
  - Case 6: Void (coercion).
  - Case 7 (sent): Successful; (unsent): Void (misfire: not communicated).
  - Case 8 (play): Void (misfire: context); (after): Successful.
  - Case 9 (forgiveness): Successful; (bet): Void (uptake failure).
  - Case 10: Void (misfire: communication not received, or uptake failure? We classified as misfire because the promisee is not in a state to receive).
  - Case 11: Void (misfire: context).
  - Case 12: Successful (by context).

  This accounts for all the verdicts.

  **Conclusion**:

  The smallest set of conditions that covers the cases:

  1. **Preparatory Conditions** (authority, context, communication): If violated → void (misfire).
  2. **Commitment Condition** (voluntariness, no coercion): If violated → void.
  3. **Sincerity Condition**: If violated → defective but done.
  4. **Uptake Condition** (for bilateral acts): If violated → void.

  This set gives the verdicts in all twelve cases.

  **Cost**: The account is more complex than a binary, but it captures the nuances. It requires distinguishing between different types of failures and between unilateral and bilateral acts.

  **Final Answers for New Cases**:

  a. Resignation letter mailed but returned: **Success** (if convention is that sending suffices).
  b. Wedding vows by intoxicated person: **Failure** (void due to lack of capacity, violating Commitment condition).
  c. Teacher without power expelling: **Failure** (void, Preparatory condition: authority).
  d. Chatbot's promise: **Failure** (void, because no capacity to intend or commit).
  e. Parent forcing child to promise: **Failure** (void, coercion, unless the child freely commits).
  f. Two students claiming table at same time: **Failure** for both (Preparatory condition: conflict makes the context inappropriate? Or uptake? It's a misfire because the table cannot be claimed by two at once).
answer: |-
  Based on your twelve cases and verdicts, I propose a unified account grounded in four core conditions for a speech act to be successful (i.e., for the act to "happen" in a way that aligns with your judgments). This framework adapts J. L. Austin's ideas but prioritizes your intuitive classifications, focusing on why some acts succeed despite defects (e.g., insincerity) while others fail entirely (e.g., due to coercion or context). The conditions are:

  1. **Contextual Authority**: The speaker must be in a valid position (role, relationship, or convention) to perform the act, and the circumstances must be appropriate (e.g., a meeting must be in session for adjournment).  
  2. **Communicative Execution**: The utterance must be intentionally directed toward its intended audience or context (e.g., spoken aloud, sent in a message, or otherwise "put into the world" in a way that could be received).  
  3. **Volitional Commitment**: The act must be performed without external coercion that negates the speaker's agency. (Insincerity alone doesn't void this; it merely makes the act defective.)  
  4. **Uptake Dependency**: For acts that create mutual obligations (e.g., bets) or require acknowledgment to take effect, the recipient must be capable of and positioned for uptake (hearing, understanding, or accepting). Unilateral acts (e.g., forgiving, resigning) don't require this.  

  This framework explains all twelve of your verdicts without contradiction. Below, I unpack each condition using your cases as motivation, then apply the account to your new scenarios. Finally, I address your suspicion about the binary of "act happened/didn't happen" and propose a more nuanced taxonomy.

  ---

  ### **The Four Conditions, Motivated by Your Cases**
  Each condition is derived from specific conflicts in your list, particularly the coercion/insincerity puzzle (Cases 4–6) and the uptake variability (Cases 7, 9–10).

  - **Condition 1: Contextual Authority (motivated by Cases 1–3, 8, 11–12)**  
    The act requires the speaker to have the institutional, social, or conventional standing to perform it, and the context must be valid (e.g., not a fictional setting). This resolves cases where identical words fail due to role or timing.  
    - Case 1: President has authority per bylaws → act happens.  
    - Case 2: Sophomore lacks authority → act fails.  
    - Case 3: President loses authority after bylaw change → act fails (even with seriousness).  
    - Case 8: Actor lacks authority in a play (wrong context) → nothing; after curtain, context is real → resignation happens.  
    - Case 11: Meeting is over, so context invalid → adjournment fails.  
    - Case 12: Teacher has authority in a classroom context → "Is that your phone?" functions as a command despite lacking performative verbs.  

  - **Condition 2: Communicative Execution (motivated by Cases 7, 10, and 12)**  
    The utterance must be "executed" in a way that could reasonably reach its target (e.g., sent, not just drafted; audible, not whispered to someone unconscious). This distinguishes acts that merely require transmission from those requiring reception.  
    - Case 7: Sent email is executed → resignation happens; unsent draft isn't executed → nothing.  
    - Case 10: Whispering to a sleeping friend isn't executed (no possibility of uptake) → no binding promise.  
    - Case 12: Execution occurs via speech in context → command happens.  

  - **Condition 3: Volitional Commitment (motivated by Cases 4–6)**  
    The speaker must not be under severe coercion that voids their agency. Insincerity (e.g., lying or bad faith) makes the act defective but doesn't prevent it from occurring—coercion does. This resolves the insincerity/coercion asymmetry.  
    - Case 4: No coercion, just insincerity → promise happens (then broken).  
    - Case 5: No coercion, just insincerity → apology happens (but hollow).  
    - Case 6: Coercion voids commitment → no promise at all.  
    - *Why coercion voids but insincerity doesn't*: Coercion destroys the speaker's agency, making the act non-volitional. Insincerity is a hidden flaw that doesn't alter the act's social reality (e.g., insincere apologies still count as apologies).

  - **Condition 4: Uptake Dependency (motivated by Cases 9–10)**  
    Acts are divided into two types:  
    - **Unilateral**: Require no recipient uptake (e.g., resigning, forgiving, appointing). The act happens upon execution.  
    - **Bilateral**: Require uptake (e.g., bets, promises, commands), meaning the recipient must be capable of registering the act for it to take effect.  
    - Case 9: Forgiveness is unilateral → happens without uncle's involvement. Bet is bilateral → fails without friend's acceptance.  
    - Case 10: Promise is bilateral → fails due to friend's unconsciousness (no uptake possible).  
    - *What makes an act unilateral vs. bilateral*: Convention. Unilateral acts change the speaker's status (e.g., resigning) or express personal states (e.g., forgiving). Bilateral acts create shared obligations (bets) or demand responses (promises, commands).

  ---

  ### **Applying the Account to Your New Cases**
  Using the four conditions, here are verdicts for your unconsidered scenarios. I'll note which condition drives the outcome.

  - **Resignation letter mailed but returned unopened and never read**  
    - **Verdict**: Resignation happens.  
    - **Why**: Condition 2 (execution) is met (sent, not just drafted). Condition 4: Resignation is unilateral, so no uptake needed. (Like Case 7.)  

  - **Wedding vows spoken by someone heavily intoxicated**  
    - **Verdict**: No marriage vow occurs.  
    - **Why**: Condition 3 (volition) is voided—intoxication can negate agency akin to coercion. Even with authority (Condition 1) and execution (Condition 2), the lack of sober commitment invalidates the act.  

  - **Teacher says "I hereby expel you" with no power, but everyone mistakenly believes she has it**  
    - **Verdict**: Expulsion does not happen.  
    - **Why**: Condition 1 (authority) fails—actual authority is required, not just perceived. Belief doesn't grant power. (Like Case 3.)  

  - **Chatbot says "I promise to remember our conversation for next time"**  
    - **Verdict**: No promise occurs.  
    - **Why**: Condition 3 (volition) fails—a chatbot lacks the capacity for commitment or intent. Condition 4 also fails (no convention for AI promises), but volition is the core flaw.  

  - **Parent says "Say you'll never do that again" and waits for the child to say it**  
    - **Verdict**: No promise occurs (or it is void).  
    - **Why**: Condition 3 (volition) is compromised—this is coerced mimicry, not genuine commitment (like Case 6). The child isn't volunteering the words.  

  - **Two students say "I'm claiming this table" simultaneously in the cafeteria**  
    - **Verdict**: No one successfully claims the table—it's a stalemate.  
    - **Why**: Condition 1 (authority) fails—there's no convention for resolving simultaneous claims, so context invalidates both acts. (Like a misfired declaration.)  

  ---

  ### **Moving Beyond the Binary: Three Types of "Failure"**
  You're right to suspect that "it didn't work" masks multiple outcomes. The felicitous/infelicitous binary is too crude for your observations. Based on your cases, we can categorize three distinct failure modes:  

  1. **Void Acts (Nothing Happens)**: The act doesn't occur due to a fatal flaw in authority, context, execution, or volition.  
     - Examples: Cases 2 (no authority), 3 (lost authority), 6 (coercion), 8-in-play (wrong context), 10 (no uptake possible), 11 (expired context).  
     - New cases: Intoxicated vows (void volition), teacher expulsion (void authority), simultaneous claims (void context).  

  2. **Defective Acts (Hollow but Happened)**: The act occurs but is flawed—insincere, insubstantial, or ethically broken.  
     - Examples: Cases 4 (insincere promise), 5 (hollow apology).  
     - These are "abuses" in Austin's terms: they "happen" socially but lack moral weight.  

  3. **Unbinding Acts (Happened but No Obligation)**: The act occurs but doesn't create expected commitments due to uptake issues or defects.  
     - Examples: Case 9-bet (no uptake → no mutual obligation), Case 10-promise (no uptake → no binding force).  
     - Contrast with unilateral acts like Case 9-forgiveness, which need no uptake to "happen."  

  This taxonomy preserves your verdicts while acknowledging nuance:  
  - **"Act happened"** = Successful or defective acts.  
  - **"Act didn't happen"** = Void acts.  
  - **Bindingness** is separate and depends on uptake, sincerity, and reciprocity.  

  ---

  ### **Conclusion: One Account, No Verdicts Surrendered**
  This four-condition framework (Contextual Authority, Communicative Execution, Volitional Commitment, Uptake Dependency) explains all twelve of your verdicts without contradiction, reconciles the coercion/insincerity puzzle, and addresses uptake variability. The cost is accepting a slightly more complex model than Austin's, but it buys precision and consistency. Crucially, it retains your intuitive classifications while clarifying why failures differ.  

  If you test this against more cases, watch for:  
  - **Authority vs. Convention**: When does social belief (e.g., everyone thinking the teacher has power) override actual authority? (Answer: Never—Condition 1 requires real authority.)  
  - **Execution Thresholds**: How "sent" must a resignation be? (Answer: It depends on conventions—email sent counts, but a draft doesn't.)  
  - **Uptake Boundaries**: Why does a sleeping person block a promise (Case 10) but not resignation (Case 7)? (Answer: Promises are bilateral; resignations are unilateral.)  

  Your list reveals that speech acts are less about formulas (like Austin's conditions) and more about social ecosystems—roles, power, consent, and context. If you refine this further, track when "intention" matters (e.g., it's irrelevant for authority-driven acts like appointments but crucial for commitments like promises). Your instincts are spot-on: the binary is inadequate, and your three failure modes are a better lens. Keep recording those meetings—you're building a pragmatic speech act theory from the ground up.
