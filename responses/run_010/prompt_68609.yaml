prompt: |-
  I have spent twenty years in a furniture conservation lab, and two related puzzles keep recurring there; I have a word for neither.

  The first: once a chair has had a leg, a rail, and half its seat replaced over the decades, arguments about whether it is still the same chair turn out to hinge on which question was actually being asked — whether this is the same wood, or the same chair — and the disputants almost never notice that they have switched. I assume this is adjacent to the ship of Theseus, and I know there is a standard textbook version involving a statue and the lump of clay it is made from.

  The second is the one I actually want identified. The argument for counting two things where there looks to be one always has the same shape: the clay could have survived being squeezed into a ball, the statue could not, therefore they are two. Nobody ever tests that. The claims about what could have survived appear to be read straight off the way the thing was named. I watched this shape convert a single oak table into two objects during an insurance dispute, and watched it do the same to a chair and its arrangement of parts in a catalogue meeting. So the furniture of the room seems to multiply with the number of ways of describing it, and the reasoning that licenses the multiplication looks to me like swapping one name for another inside a sentence about what might have happened, which feels like a move one is not entitled to make.

  Is there an established concept for this second pattern? Please name the nearest candidates and compare them, say what each fails to capture, and state which fits best; and if none fits exactly, coin a term with a definition and the boundary cases that separate it from my first puzzle and from the mere charge that people are arguing about words rather than things. A label alone will not help me — I want the carving.
reasoning: |-
  Okay, let me tackle this fascinating conservation puzzle. The user describes two distinct but related philosophical problems they've encountered in their furniture conservation work. The first is clearly the Ship of Theseus paradox applied to furniture - multiple replacements triggering debates about object identity. But the second one is more subtle and seems to be their core concern.

  Hmm... the second pattern involves what appears to be a single object being treated as two distinct entities based on modal properties - what "could have happened" to it. The insurance dispute (oak table becoming two objects) and catalog meeting (chair vs arrangement of parts) examples show how this reasoning leads to ontological multiplication. 

  The key mechanism seems to be: 
  1) Taking a description ("the clay", "the statue") 
  2) Asserting different counterfactual persistence conditions for each description 
  3) Concluding these must be distinct objects

  Ah! This is textbook modal divergence - where one entity is described in ways that carry different modal properties. But the user's observation is sharper: people aren't just noting this divergence, they're using it to multiply entities. And crucially, they're deriving the modal properties directly from the labels themselves rather than independent criteria.

  Let me compare this to existing concepts:
  - Type-token distinction: Too broad, doesn't capture the modal aspect
  - Constitution vs identity: Closer (like statue/clay), but the user notes this usually gets confused with the first puzzle
  - Sortal-dependence: Yes - the modal claims depend entirely on which sortal (category term) we use
  - Modal persistence conditions: Core issue but needs framing

  Wait... Lynne Baker's constitution view actually predicts this multiplication (one object constitutes another distinct object with different persistence conditions). But the user's complaint is about how easily people slide into this dual ontology without justification.

  The brilliant insight here is that people are committing a linguistic sleight-of-hand: "the statue could not survive squeezing" is true only because "statue" implies form - it's analytic. But they treat this as synthetic information about the world. This is the move that needs naming.

  After considering options like "sortal smuggling" or "modal reification", I think "counterfactual sortal grafting" captures it best: grafting persistence conditions onto an object by switching sortals in counterfactual claims. The boundary with the first puzzle is clear: Theseus debates are about identity over time, while this is about synchronic multiplicity. And it's not "just semantics" because it has real-world consequences (insurance values, catalog systems).

  For the definition: When distinct sortals carrying implicit modal persistence conditions are applied to the same physical entity, and their counterfactual divergence (under identical scenarios) is interpreted as revealing multiple objects rather than multiple descriptions. Must involve 1) same spatiotemporal entity 2) multiple sortals 3) derivation of modal claims directly from sortals 4) ontological conclusion.

  The oak table case perfectly fits: "table" (functional sortal) vs "oak mass" (material sortal) with their different "could have" properties leading to insurance double-counting. Exactly the graft.
answer: |-
  Your second puzzle dissects a fascinating and distinct pattern of ontological inflation—one where **a single physical entity fractures into multiple "objects" based solely on divergent modal properties (possibilities or necessities) projected through different descriptive labels**. This is not merely linguistic confusion but a conceptual sleight-of-hand with real-world consequences, as in your insurance and catalog examples. Below, I identify the closest philosophical concepts, evaluate their fit, and propose a precise term for the pattern you describe.

  ---

  ### **Nearest Candidates & Comparative Analysis**
  1. **Sortal-Dependent Persistence Conditions**  
     *Core Idea*: Objects persist through change only relative to a *sortal* (category term like "statue" or "lump of clay"). Different sortals imply different criteria for survival.  
     *Fit*: Directly addresses your observation that "claims about what could have survived are read straight off the way the thing was named."  
     *Gap*: Fails to explain why people *infer multiple objects* rather than recognizing one entity under multiple descriptions. It doesn't capture the *conflation* of modal divergence with ontological separation.  

  2. **Modal Realism Fallacy**  
     *Core Idea*: Mistaking modal properties (e.g., "could survive being squeezed") as intrinsic to objects, rather than relational to conceptual frameworks.  
     *Fit*: Exposes how insurance/catalog disputes treat *counterfactual resilience* as a discovery about reality.  
     *Gap*: Too broad. Doesn't specify why *naming* drives the multiplication or how it differs from Ship-of-Theseus debates.  

  3. **Constitution Without Identity** (Lynne Baker)  
     *Core Idea*: A statue and its clay are "distinct" objects occupying the same space but with different persistence conditions (e.g., the clay survives reshaping, the statue does not).  
     *Fit*: Mirrors your examples (clay/statue, table/wood, chair/arrangement).  
     *Gap*: Baker *endorses* this multiplication as metaphysically valid. Your critique targets its *uncritical application*—treating linguistic labels as ontological proof.  

  4. **Quantifier Variance** (Eli Hirsch)  
     *Core Idea*: What counts as "one object" varies by conceptual scheme.  
     *Fit*: Explains catalog/insurance disagreements as scheme clashes.  
     *Gap*: Frames disputes as *equally valid perspectives*, ignoring your observation that modal claims are *derived tautologically from labels*.  

  ---

  ### **The Best Fit: A Coined Term**  
  No existing term fully captures your second puzzle’s mechanics:  
  - **The conflation of sortal-bound modal properties with object multiplicity**,  
  - **The inference "Label L1 implies modal property P1, Label L2 implies P2, ∴ L1 and L2 denote distinct objects"**,  
  - **The social consequences (insurance payouts, catalog entries)**.  

  Thus, I propose:  
  **Counterfactual Sortal Grafting (CSG)**  

  #### **Definition**  
  *The fallacy of inferring multiple distinct objects from a single spatiotemporal entity by attaching divergent modal persistence conditions (e.g., "could survive X") to different sortals (descriptive labels) and treating these conditions as ontologically decisive, rather than as features of the conceptual framework.*  

  #### **Boundary Cases**  
  - **vs. Ship of Theseus (Your First Puzzle)**  
    - *Theseus Debates*: Concern **diachronic identity** (whether an object survives *changes over time*).  
    - *CSG*: Concerns **synchronic multiplicity** (whether one entity at one time is *already multiple objects* due to divergent modal projections).  
    Example: A chair with replaced parts asks, "Is this the *same* chair?" CSG asks, "Is this chair *also* a distinct object from its wood?"  

  - **vs. "Arguing About Words"**  
    - *Mere Semantics*: Disputes over definitions without ontological claims (e.g., "Is a ‘sofa’ a type of ‘couch’?").  
    - *CSG*: Uses linguistic labels to *generate ontological conclusions* with material consequences (e.g., double insurance value).  

  #### **Mechanism of CSG**  
  1. **Sortal Selection**: Choose labels (e.g., "oak table" vs. "mass of oak").  
  2. **Modal Projection**: Assign persistence conditions *based on the label’s definition* (e.g., "tables cannot survive disassembly" ← analytic truth).  
  3. **Grafting**: Treat projected conditions as discovered facts about the world.  
  4. **Multiplication**: Conclude multiple objects exist because modal properties diverge.  

  ---

  ### **Why "Counterfactual Sortal Grafting" Fits Your Cases**  
  - **Insurance Dispute (Oak Table)**:  
    "Table" (functional sortal) → "Cannot survive disassembly."  
    "Mass of oak" (material sortal) → "Can survive disassembly."  
    → CSG: Two objects, doubling value.  
    *Flaw*: The persistence conditions are baked into the labels, not empirically verified.  

  - **Catalog Meeting (Chair Parts)**:  
    "Chair" (artifact sortal) → "Cannot survive rearrangement."  
    "Arrangement of parts" (geometric sortal) → "Can survive rearrangement."  
    → CSG: Chair and arrangement are distinct.  
    *Flaw*: No evidence that "arrangement" is an object *separate from* the chair.  

  ---

  ### **The Core Move: Illicit Modal Reification**  
  CSG’s power lies in disguising a *conceptual necessity* as a *physical discovery*. When we say, "The statue couldn’t survive being squeezed," this is true by definition of "statue"—not because we’ve tested statues. **The move you’re denied is swapping a label into a counterfactual to "prove" its objecthood.**  

  This pattern thrives where institutional practices (insurance, catalogs) demand discrete, countable entities. A label alone *is* inert—but grafted onto modal logic, it becomes an ontological multiplier. CSG names that operation precisely.
