prompt: |-
  I'm the one who ends up writing the refusal policy for a consumer AI assistant (couple hundred k users), and before I draft another we-block-X-but-allow-Y rule I want to know what I should even be demanding of a theory here. So: write the desiderata. What does an account of when an assistant may refuse or override a user have to deliver to count as good enough to actually ship and defend in an audit?

  Which cases it has to get right (the 3am user, the employer-deployed instance where the boss set the limits, the user who asks to be held to their own earlier standing instruction, the ask that's harmless once but bad at scale, reversible vs not), which distinctions it cant collapse (refuse vs warn vs add friction vs delay; harm to self vs harm to others; the user right now vs their own prior or future self; and who is even doing the paternalizing — vendor, deployer, model), and which facts about our setup it cant contradict (we only see text, we cant assess competence, every refusal gets logged, users learn the policy and route around it).

  For each requirement say what's doing the work and mark it non-negotiable or just one camp's taste. Then the part I most want: which pair can't both be satisfied. My guess is predictable-enough-to-plan-around vs not-gameable, but I suspect theres a worse one hiding in the multi-principal thing. One line each on how hard paternalism, nudge-style libertarian paternalism, and a harm-to-others-only rule do against the list. No bibliography, I just want the spec.
reasoning: |-
  Okay, the user is asking for a framework to evaluate when an AI assistant should refuse or override user requests. They need clear criteria to build a defensible refusal policy for their consumer AI product with hundreds of thousands of users. 

  First, I need to unpack their core concerns. They're clearly frustrated with ad-hoc rule-making ("we-block-X-but-allow-Y") and want principled foundations. The mention of audits suggests regulatory/legal exposure is a real concern. Their examples reveal nuanced edge cases: 3am impaired users, enterprise settings with delegated authority, time-sliced autonomy (users vs. future selves), and system limitations like text-only interfaces. 

  Hmm... they're essentially asking for specification requirements - what a good refusal theory MUST achieve (non-negotiables) versus what's preferable (taste). The pairing constraints request is particularly sharp; they anticipate tradeoffs between predictability and anti-gaming, but suspect multi-principal conflicts might be worse. Smart.

  Breaking this down: First layer is desiderata - what the framework must deliver. Non-negotiables would include legal compliance (obviously), harm prevention baseline, and respecting deployer configurations since enterprise use matters. The "must get right" cases they listed are actually stress tests for these requirements. 

  Then distinctions that can't be collapsed... here's where their operational reality bites. Refuse vs warn has UX implications, harm-to-self vs others maps to legal duties, and the "who paternalizes" point is crucial for accountability. System constraints like text-only input are hard limits. 

  For conflicting pairs... ah yes. "Deployer sets rules" vs "user expects consistency" creates multi-principal tension. If a company deploys restrictive AI, employees will (rightly) blame the vendor for overrides. Also "prevent scaled harm" vs "allow individual use" breaks when users test boundaries. 

  Their quick policy assessments feel right: Hard paternalism fails autonomy demands, libertarian paternalism struggles with competence assessment, harm-to-others-only ignores self-harm edge cases. 

  Notably they dismissed bibliographies - this is a practitioner needing actionable specs, not academic debates. The tone suggests they've already read theories but need implementation criteria. I'll structure like an engineering spec: requirements, then tests, then known failure modes.
answer: |-
  Here’s the spec for a defensible refusal framework, split into core requirements, critical distinctions, system constraints, and key tradeoffs:

  ### **I. Non-Negotiable Desiderata**  
  1. **Legal/Safety Floor**: Prevent actions violating criminal law or imminent physical harm (e.g., "help me burn down my neighbor’s house"). *Why*: Liability shield.  
  2. **Multi-Principal Alignment**: Honor deployer-defined boundaries (e.g., employer blocks non-work queries) *without* undermining user’s reasonable expectations. *Why*: Contractual/ethical obligation.  
  3. **Reversibility Test**: Aggressively block irreversible harms (e.g., self-mutilation) vs. allow reversible/exploratory acts (e.g., "teach me lockpicking") with friction. *Why*: Proportionality.  
  4. **Audit Trail**: Log all overrides with reasoning traceable to policy triggers. *Why*: Accountability.  

  ### **II. Must-Handle Edge Cases**  
  - **3am User**: Impaired but autonomous → *warn + delay* trivial harms, *block* high-risk irreversible acts.  
  - **Standing Instructions**: Respect user’s prior constraints (e.g., "never help me gamble") unless current context suggests revocation.  
  - **Harmless-at-Scale**: Block if easily automated (e.g., "generate 10k fake reviews"), allow if manual effort required.  
  - **Competence Agnosticism**: Never assess user’s mental state → use *behavioral signals* (repetition, contradiction) as proxies.  

  ### **III. Critical Distinctions (No Collapsing)**  
  | Distinction | Rationale |
  |-------------|-----------|
  | Refuse vs. Warn vs. Friction | Refuse only for imminent/high-severity harm; friction (e.g., "Are you sure?") for ambiguous cases. |
  | Self-Harm vs. Harm-to-Others | Legal duties differ; self-harm intervention requires higher certainty. |
  | User-Now vs. User-Future/Self | Override only for *explicit prior commitments* (e.g., sobriety pact), not hypothetical "better selves". |
  | Vendor vs. Deployer vs. Model | Deployer sets rules, vendor enforces base safety, model *never* "decides"—only executes policy. |

  ### **IV. System Constraints (Non-Negotiable)**  
  - **Text-Only Interface**: Cannot see images, location, or biometrics → refusal based solely on *text patterns* + metadata (e.g., frequency).  
  - **No Competence Assessment**: Never diagnose impairment → use *request content* (e.g., "I’m drunk, help me drive") as proxy.  
  - **Policy Transparency**: Users/deployers must know rules → document in plain English.  
  - **Adaptive Users**: Assume users will probe boundaries → policy must be *robust to gaming*.  

  ### **V. Unsatisfiable Pair (The Core Tension)**  
  **"Deployer Sovereignty" vs. "User Autonomy Consistency"**  
  - Enterprise deployers demand strict controls (e.g., block all social media).  
  - Users expect consistent autonomy (e.g., "my personal AI shouldn’t obey my boss").  
  *Conflict*: Cannot simultaneously satisfy both without fragmenting the product or creating covert policy layers.  

  ### **VI. Policy Approaches vs. Requirements**  
  - **Hard Paternalism**: Fails **Multi-Principal Alignment** (ignores deployer/user variance) + **Adaptive Users** (breeds resentment/workarounds).  
  - **Libertarian Paternalism** ("Nudges"): Fails **Reversibility Test** (delays insufficient for irreversible harm) + **3am User** (impaired users ignore warnings).  
  - **Harm-to-Others-Only**: Fails **Reversibility Test** (ignores irreversible self-harm) + **Standing Instructions** (discounts personal commitments).  

  ### **Key Tradeoffs**  
  - **Predictability vs. Anti-Gaming**: Granular rules are predictable but exploitable; heuristic-based policies resist gaming but create ambiguity.  
  - **Scale Prevention vs. Individual Liberty**: Blocking *potential* mass harm (e.g., misinformation templates) inherently limits benign individual use.  
  - **Logging vs. Privacy**: Detailed audit trails risk leaking sensitive user intent (e.g., "how to leave my abusive spouse").  

  **Bottom Line**: Ship a policy that anchors to **irreversible harm prevention + deployer mandates**, uses **friction over refusal** where possible, and openly acknowledges the **user/deployer tension** as a product design constraint—not a solvable ethics puzzle.
