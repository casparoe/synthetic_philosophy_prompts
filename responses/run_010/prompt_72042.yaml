  Key concessions: the user should acknowledge that narrative revision requires cognitive mechanisms and that belief isn't entirely irrelevant. They should avoid claiming their model explains all cases. The dreaded question might be about empirical support or how their view handles cases where people suddenly "snap out" of self-deception.

