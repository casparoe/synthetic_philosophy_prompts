prompt: |-
  I teach an upper-level philosophy of mind seminar: eighteen students, one ninety-minute session, a room with a projector and whiteboard, and a budget limited to paper and pens. Design an activity that makes students feel the force of heterophenomenology as a method rather than as a thesis — the practice of taking a subject's verbal reports and other behavior as data for constructing a theorist's model of the world as that subject takes it to be, while refusing the subject any special authority about that world, and holding that once everything in the constructed world and its functional role has been explained, no further fact about experience remains to be explained. I want them to run into the pressure of that method from the inside: to experience what it is like to have one's own avowals treated as evidence about something other than how things are with one, and to notice what the treatment brings into view and what it appears to discard.

  Give me roles and rules, including a rotation under which no student ever interprets their own reports; the materials and stimulus setup; a minute-by-minute timeline; and a debrief that maps particular moments of the exercise onto particular methodological commitments. Build in one deliberate feature: the corpus of reports the class interprets should secretly include items produced by something we would not ordinarily count as a subject at all — a scripted actor or a text-generating program — which the class should be unable to identify. Explain what that reveal is meant to establish and what it cannot establish. In particular, I suspect that the protests of students whose authority has just been denied are themselves only more data of the same kind, so the exercise cannot settle whether the method is neutral between realism and eliminativism about experience and that I will have to supply that argument myself; tell me whether that suspicion is correct. Close with what will predictably go wrong the first time I run it and how to handle each failure.
reasoning: |-
  Okay, the user teaches an upper-level philosophy of mind seminar and wants an activity to help students grasp heterophenomenology as a method. They need something hands-on where students experience having their verbal reports treated as data without granting them authority about their own experiences. 

  First, I need to unpack heterophenomenology. It's Dennett's approach: take subjects' reports as evidence for constructing a model of their world, but don't treat them as infallible. The key is making students feel what it's like to be on the receiving end of this method. 

  The user has specific requirements: 18 students, 90 minutes, projector/whiteboard, limited budget. They want rotation so no one interprets their own reports, and secretly include non-subject generated reports. Also, they suspect student protests during the activity are just more data, which ties into the realism vs. eliminativism debate. 

  Hmm, the core challenge is designing an exercise where students experience the methodological shift from "I'm reporting my experience" to "my report is just data for your model." The secret inclusion of non-human reports will test if the method can handle non-experiencing entities, highlighting that the method itself doesn't distinguish between real and artificial subjects. 

  For the activity structure: I'm considering using simple stimuli like optical illusions to generate rich but contestable reports. Rotation is crucial - pairing students as Subjects and Theorists, ensuring no one analyzes their own data. The reveal of non-subject reports should happen late to maximize the "aha" moment. 

  Timing is tight: 90 minutes for setup, three observation rounds, interpretation, and debrief. Need to keep transitions snappy. The debrief must explicitly connect activity moments to methodological principles, like how theorist questions treat avowals as behavioral data rather than truth-claims. 

  The user's suspicion is correct - protests about being misinterpreted are indeed more data for the heterophenomenologist. This means the exercise can't settle the realism debate, only demonstrate the method's procedural neutrality. The reveal of non-subject reports shows the method's agnosticism but doesn't prove eliminativism. 

  Predictable failures: students might resist the role-play ("But I really did see it!"), theorists could get distracted by identifying the non-subject, or discussions might stall. Contingency plans: emphasize this is a methodological experiment, not truth-seeking; redirect focus to model construction; have backup prompts ready. 

  For materials, basic supplies suffice: printed stimuli sheets, paper for reports. The secret non-subject reports could be pre-scripted based on common responses or generated by a simple text algorithm. 

  Biggest risk is students feeling violated by having their authority denied. Need to frame carefully: this is about experiencing the method, not attacking personal experience. The debrief should acknowledge discomfort as part of understanding heterophenomenology's radical stance.
answer: |-
  Here’s a structured activity designed to make students *feel* heterophenomenology’s methodological pressure, with built-in sabotage via non-subject reports:

  **Activity Title:** *The Phenomenological Detective Agency*  
  **Core Mechanism:** Students alternate as "Subjects" (describing experiences) and "Theorists" (building models from reports), with reports anonymized and redistributed. Secretly, 3/18 reports are fabricated by non-subjects.

  ---

  ### **Roles & Rules**  
  1. **Subjects (6 per round):**  
     - Observe a stimulus (e.g., optical illusion, ambiguous image) for 60 sec.  
     - Verbally describe their experience *in real time* while being recorded (audio or written scribe).  
     - *Forbidden* from explaining, justifying, or revising reports post-hoc.  

  2. **Theorists (12 per round):**  
     - Receive **anonymized transcripts** of Subject reports (not their own).  
     - Build a "world-model" for *each Subject*: What must their world contain? What functional roles do reported elements play?  
     - **Rule:** Treat reports *only as behavioral data* — never as truth-claims. Challenge: "What must *their world* be like for this report to occur?"  

  3. **Rotation:**  
     - 3 rounds (18 students → all serve as Subject once, Theorist twice).  
     - Reports are coded (e.g., Subject #A7). After each round, reports reshuffled so no Theorist analyzes a Subject they observed.  

  ---

  ### **Materials & Setup**  
  - **Stimuli (Projected):**  
    - Round 1: *The Dress* (blue/black vs. white/gold illusion)  
    - Round 2: *Jastrow Duck-Rabbit* (ambiguous figure)  
    - Round 3: *Köhler Motion Illusion* (ambiguous direction)  
  - **"Non-Subject" Sabotage:**  
    - Pre-write 3 reports per round mimicking real responses (e.g., GPT-4 trained on pilot student data). Insert them as "Subject #X" reports.  
    - *Example fabricated report:* "The duck’s beak keeps melting into fur, then snapping back — like reality glitching."  

  ---

  ### **Timeline (90 Min)**  
  **0-5 min:** Framing (Whiteboard)  
  - Define heterophenomenology *as method*: "We treat avowals as data to construct *their world-model*, not as direct access to their mind."  

  **5-25 min: Round 1**  
  - Stimulus 1 (Dress) → 6 Subjects report aloud → Scribes transcribe + 3 fabricated reports shuffled in.  
  - Theorists (in pairs) model 1 Subject’s world from assigned report.  

  **25-45 min: Round 2**  
  - Repeat with Rabbit-Duck. Reassign roles/transcripts.  

  **45-65 min: Round 3**  
  - Repeat with Motion Illusion.  

  **65-75 min: Theorist Showcase**  
  - Each pair shares one model: "Subject #E2’s world contains unstable object boundaries..."  
  - *Note:* Theorists don’t know which reports are real/fabricated.  

  **75-85 min: The Reveal & Debate**  
  - Announce: "3 reports per round were fabricated. Could you identify them?"  
  - Let students guess → reveal fakes.  
  - Prompt: "Did your method *require* a conscious subject?"  

  **85-90 min: Transition to Debrief**  

  ---

  ### **Debrief: Mapping Activity to Method**  
  | **Activity Moment**          | **Heterophenomenological Principle**                                                                 |  
  |------------------------------|------------------------------------------------------------------------------------------------------|  
  | Theorists ignoring Subject’s "But I *saw* gold!" protest | **Denial of 1st-person authority:** Protests are more data for the model, not evidence of incorrigibility. |  
  | Modeling "glitching reality" from a fake report | **Methodological neutrality:** The same process constructs worlds for entities with/without experiences. |  
  | Theorists describing functional roles (e.g., "color instability triggers confusion responses") | **Explanatory sufficiency:** Once the model’s causal roles are explained, no "extra" experience remains. |  
  | Inability to reliably spot fakes | **Data purification:** The method discards the *source* of reports (consciousness, AI, acting) as irrelevant to model-construction. |  

  ---

  ### **The Sabotage’s Purpose & Limits**  
  **What the reveal establishes:**  
  - The method *works identically* for conscious humans and unconscious systems. Successfully modeling a world from reports doesn’t prove subjective experience exists in the source.  
  - **Methodological agnosticism:** Heterophenomenology brackets the "hard problem" by design.  

  **What it *cannot* establish:**  
  - **Realism vs. eliminativism:** The activity *shows* the method’s neutrality but doesn’t resolve whether experience is real. Students’ outrage at being "misinterpreted" is itself behavioral data to the heterophenomenologist — *including your suspicion that this protest is just more data*. **You are correct:** The exercise *cannot* settle this. It only demonstrates that the method procedurally excludes first-person authority. You’ll need to argue separately whether this neutrality implies eliminativism or is compatible with realism.  

  ---

  ### **Predictable Failures & Fixes**  
  1. **Failure:** Students resist role-play ("But I *know* what I saw!").  
     - **Fix:** Pre-frame rigidly: "You’re not Subjects *defending* your world — you’re *phenomena* generating data. Theorists, you’re not debating truth — you’re reverse-engineering a possible world."  

  2. **Failure:** Theorists focus on spotting fakes, not model-building.  
     - **Fix:** Delay reveal until final discussion. Emphasize: "Your goal is coherence, not detection."  

  3. **Failure:** Subjects give sparse reports ("It’s a duck. Done.").  
     - **Fix:** Use richer stimuli (e.g., music clips, tactile objects). Require "continuous narration."  

  4. **Failure:** Sabotage too obvious/unnatural.  
     - **Fix:** Pilot stimuli with outsiders to refine fake reports. Use subtle oddities (e.g., "the rabbit’s ear twitched" vs. "the duck’s beak pulsed").  

  5. **Failure:** Debrief devolves into realism vs. eliminativism.  
     - **Fix:** Redirect: "Note how the *method* remained unchanged whether sources were human or not. What does that *procedurally* exclude?"  

  ---

  **Why this works:** Students experience having their avowals stripped of privileged status and repurposed as theorist-fodder. The sabotage concretizes how the method "flattens" all report-sources into data — making the abandonment of 1st-person authority visceral. The rest is your lecture.
