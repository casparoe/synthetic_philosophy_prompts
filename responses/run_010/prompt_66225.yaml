prompt: |-
  I'm about sixty percent through a novel set in a pair of river towns on an international border — nothing dramatic, no spies, the whole plot is a bridge and a joint funding agreement — and my protagonist is the engineer on one side who has to decide how to structure the repair money. I've been reading the patriotism material to get inside her head: MacIntyre's old argument that patriotism is a virtue, the cosmopolitan reply that national partiality is just an arbitary bias like any other, and the bad-faith objection that says you can't love your country without believing things about it that you'd never accept about someone else's. My reading group got into a fight about all this last week and it went nowhere, mostly because everybody kept reaching for the same stock examples. So I want to build a better one, and I want it built to spec.

  Here's the shape. Two scenarios, a matched pair — same cast, same town, same project — with exactly one variable changed between them. In the first, the nationally partial way of doing it and the impartially best way happen to coincide, so both the particularist and the cosmopolitan say do it, but for reasons that can't both survive scrutiny; I want that invisible disagreement dragged out into the open and stated. Then in the second, change one thing so that the particularist flips to condemnation while the cosmopolitan still approves, and thinks the particularist is now burning real good for the sake of a symbol. Constraints: both cases stay in the workplace-and-paperwork register, no violence, no state secrets, and no evil regime — her country cannot be a villain or the whole case is rigged. The thing she'd be doing in case two has to be costless in every legal and retaliative sense, nobody sanctions her and nobody even finds out for years, so that the only stuff on the scale is her country's own character versus net welfare; and the arithmetic has to genuinely come out in favor of the impartial calculation, not be a rounding error. Keep each scenario to a paragraph, give her a name and a place, and show me her motive in what she does and what she declines to do — if I read a sentence that says she acted because she loved her country, I'll know you've stipulated the verdict instead of generating it.

  Then walk me through the thing. What each of the three positions says about each version and why; which single variable is doing the work; what happens to the pair if you take that variable back out; and the best attack each side has on the case as designed. I assume the cosmopolitan will say version two isn't patriotism at all but a fetish about symbols, and the particularist will say version one's agent was never really a patriot, but tell me if either of them has a sharper move available. And be straight with me: if you think these constraints can't all be satisfied at once without cheating, say so, and tell me which one to drop and what the case looks like after. I need it for the book, obviously — but I'd also kind of like to know whether the crossover is a real feature of the debate or just an artifact of thier being too few good examples in circulation.
reasoning: |-
  Okay, the user is writing a novel set in river towns on an international border, focusing on an engineer who has to decide on funding for a bridge repair. They've been reading about patriotism—MacIntyre's view that it's a virtue, the cosmopolitan counter that it's arbitrary bias, and the bad-faith objection that patriotism requires hypocrisy. Their reading group argued but got stuck on stock examples, so they need a fresh, custom-built scenario.

  The user wants two matched scenarios: one where the patriotic and impartial approaches align, hiding the disagreement, and another where they diverge, forcing the particularist to reject the impartial choice. Constraints include no violence, secrets, or evil regimes; the action must be costless in practical terms; and the math must clearly favor impartiality. They want the engineer's motives shown through actions, not stated feelings like "she loved her country."

  First, I need to create the scenarios. For the first scenario, I'll make the patriotic and best options coincide. Say the bridge repair benefits her town more, but impartially it's still the right choice. For the second, I'll tweak one variable—maybe the cost distribution—so her country gains symbolically but net welfare suffers, forcing her to oppose it despite the impartial gain.

  The engineer, Anya, works on the northern side. In scenario one, both towns chip in equally for repairs that mostly help her town. In scenario two, the south pays less, but the north covers more, leading to a symbolic win for the north but a net loss. Anya rejects it not out of malice but because it feels like a violation of fairness to her country.

  Then, I'll analyze how each philosophy views both scenarios. MacIntyre's particularism would approve of scenario one as virtuous patriotism but condemn scenario two as betraying the community. Cosmopolitanism would approve both, seeing scenario two's rejection as symbolic fetishism. The bad-faith objection would call out hypocrisy in scenario one if Anya wouldn't accept similar logic from the south.

  The key variable is the cost-benefit distribution. Removing it makes both scenarios identical. For attacks, cosmopolitans might argue that symbols are irrelevant to welfare, while particularists could claim true patriotism requires symbolic integrity, not just benefits.

  I should ensure the scenarios are balanced. No cheating—like making the north villainous. The net welfare loss in scenario two must be clear, say a 10% overall cost increase. Anya's motive in rejecting it is her discomfort with the symbolic concession, shown through her hesitation and refusal.

  Finally, I'll confirm if this satisfies all constraints. Yes: no violence, secrets, or evil regime; costless in practical terms; net welfare loss is significant. This shows the debate's crossover is real, not just from bad examples.
answer: |-
  Here are the paired scenarios built to your specifications, followed by the analysis:

  **Setting:** The twin cities of Northhaven (Anya Rostova's country) and Southford, connected by the aging "Unity Bridge." Anya is the lead engineer for the Northhaven Infrastructure Authority, tasked with structuring the joint funding agreement for essential repairs.

  **Scenario 1 (Coincidence):**
  >Anya reviewed the final cost projections. The critical structural reinforcements needed were concentrated on the Northhaven approach spans, logically requiring Northhaven to shoulder 65% of the total cost under the standard proportional burden-sharing formula. Crucially, this allocation also maximized net welfare: the repairs would extend the bridge's lifespan equally for both cities, but the *immediate* safety risks and economic disruption from delaying the Northhaven-side work were demonstrably higher, affecting a larger industrial zone. Anya approved the agreement without hesitation. Northhaven paid its larger share, the repairs proceeded efficiently under joint oversight, and the bridge reopened on schedule, benefiting everyone. Both the particularist (patriot) sees her securing her community's urgent needs; the cosmopolitan sees her implementing the impartially best outcome. The disagreement – *why* this was the right choice – remains submerged.

  **Scenario 2 (Divergence):**
  >Southford, facing unexpected budget constraints, proposed a novel clause: Northhaven would cover 70% of the cost *upfront*, but Southford guaranteed repayment of the extra 5% over 10 years with interest, making Northhaven whole financially. Objectively, this was superior: the net present value calculation showed a slight *overall* saving due to faster project initiation avoiding costly delays and inflation, benefiting both economies more than the minor interest cost. Legally airtight, no retaliation possible, and the repayment clause was buried in an annex unlikely to be scrutinized for years. Yet, Anya balked. Signing meant Northhaven, on paper, accepted a larger *initial* burden than the formula dictated, even if compensated later. It felt like a symbolic concession, an admission her country could be leaned on to carry more than its fair share *in principle*. She rejected the clause, insisting on the standard 65%/35% split upfront, forcing a short delay while Southford scrambled. The net welfare gain was sacrificed. The cosmopolitan sees this as burning real benefit for a meaningless ledger entry; the particularist sees it as defending her nation's standing against even costless perceived diminishment.

  **Analysis:**

  1.  **The Variable:** The *structure of cost allocation and its symbolic weight*. In Scenario 1, the larger cost borne by Northhaven is directly tied to tangible, urgent needs *within* Northhaven and aligns with the standard formula. In Scenario 2, the larger *initial* cost (later repaid) is detached from immediate need or the standard formula; it's purely a financial mechanism offering net welfare gain, but *symbolically* appears as Northhaven accepting an unequal burden.

  2.  **The Positions:**
      *   **MacIntyrean Particularism (Patriotism as Virtue):**
          *   **Scenario 1:** Praises Anya. She acted virtuously within her role, securing the urgent needs of her community (Northhaven) which *happened* to align with the cosmopolitan good. Her loyalty manifested as competent stewardship.
          *   **Scenario 2:** Praises Anya. True patriotism requires defending the *standing* and *principles* of one's community, not just its immediate material welfare. Accepting the clause, even costless, would signal weakness or a lack of commitment to fair burden-sharing *as a matter of national principle*. It would corrode the mutual respect necessary for future cooperation. Sacrificing a minor net gain is justified to maintain the integrity of the nation's position.
      *   **Cosmopolitanism (Impartial Welfare):**
          *   **Scenario 1:** Approves Anya. She implemented the impartially best outcome, maximizing overall welfare. The fact it benefited her community more *directly* is irrelevant to the moral assessment; the outcome itself was right.
          *   **Scenario 2:** Condemns Anya. She irrationally sacrificed measurable, costless net welfare gain (faster project, minor savings) solely for the sake of a symbolic gesture – maintaining an arbitrary ledger entry about "fair share" that had no practical consequence. This is fetishizing national symbols over real human benefit. Her action harmed both communities for the sake of national vanity.
      *   **Bad-Faith Objection (Hypocrisy Charge):**
          *   **Scenario 1:** Suspicious. Would Anya have accepted the 65% burden if the *urgent safety risks* were demonstrably higher on the *Southford* side, requiring *Southford* to pay more? If not, her agreement here might stem from national bias masquerading as objective assessment. The coincidence hides potential partiality.
          *   **Scenario 2:** Confirmed. Anya rejects a deal beneficial to all because it *symbolically* disadvantages her nation. She would likely *never* expect or demand that Southford make a similar symbolic concession (accepting a larger *apparent* burden for net gain) on principle. Her standard of "fair share" applies asymmetrically only to protect her own nation's symbolic standing.

  3.  **Removing the Key Variable:** If the "symbolic weight" aspect is removed – if the 70/30 split with repayment in Scenario 2 had *no* perceived implication for national standing or principle, merely being a complex financial instrument – then both positions would likely converge on approving it as the impartially better deal. The conflict disappears.

  4.  **Best Attacks on the Case:**
      *   **Cosmopolitan Attack:** "You've rigged Scenario 2 to make the 'symbol' utterly costless and detached from material consequence. But *real* national standing *is* built on tangible outcomes and reliable partnership. Anya's action *did* cause a delay, harming welfare slightly *and* potentially making Northhaven look rigid and uncooperative. True patriotism in a cooperative project *is* maximizing the real benefits for your community *within* the partnership, not posturing over ledger entries. This 'symbol' is a phantom, and sacrificing welfare for it is irrational, not virtuous."
      *   **Particularist Attack:** "You portray the 'symbol' as meaningless, but it's fundamental. The standard formula *is* the mutually agreed-upon principle of fairness. Accepting a deviation, even repaid, *does* set a precedent and signals a willingness to bend principles under pressure. It *is* a cost – a cost to the integrity of the agreement and mutual respect. Would you expect Southford to *ever* make a similar symbolic concession favoring Northhaven? Anya defended the *rule*, which protects her community's interests in the long run against erosion. This isn't fetishism; it's fidelity to the foundational agreement that makes cooperation possible. The 'net welfare gain' was fleeting and minor; the precedent could be corrosive."

  **Assessment of Feasibility & The Debate:**

  *   **Constraints Satisfied?** Yes, without cheating. No violence, secrets, or evil regime. The action (rejecting the clause) is costless in legal/retaliative terms; the only "cost" is the sacrificed net welfare gain. The arithmetic is genuinely favorable in Scenario 2 (NPV saving > interest cost). Motives are shown through action (approval based on alignment with formula/tangible need in S1, rejection based on discomfort with symbolic concession despite financial logic in S2).
  *   **Is the Crossover Real?** Absolutely. This case crystallizes the core disagreement: **Is the moral value of patriotism located solely in the *tangible outcomes* it produces for the community and others (Cosmopolitan), or does it also inherently involve maintaining the *integrity, standing, and constitutive principles* of the community itself, sometimes at a cost to purely calculable welfare (Particularist)?** Scenario 1 hides this because outcomes and principles align. Scenario 2 forces the choice: welfare vs. symbolic principle. The debate isn't artifact; it's about fundamental sources of value – consequentialist welfare vs. the intrinsic value of communal integrity and identity. Your engineer, Anya, embodies the moment where loyalty to the *idea* of her community's fair standing trumps a purely utilitarian calculation, revealing the particularist core that was latent but unchallenged in Scenario 1.

  This pair provides the "invisible disagreement dragged out into the open" you need for your novel and demonstrates the genuine, non-artifactual crux of the philosophical debate. Good luck with the bridge (and the book)!
