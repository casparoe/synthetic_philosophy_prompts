prompt: |-
  I'm applying for a one-year postdoc fellowship and my half-formed idea is about Nozick's tracking theory and closure. Rough version, so you can see where I'm going: everybody agrees the theory breaks closure under known entailment, and everybody agrees that sensitivity is indexed to a belief-forming method M. What I think nobody wants to touch is that there's no non-question-begging account of when two processes count as the same method, and that this isn't a technical annoyance — it's what actually decides the closure question. Type M coarsely and the grandmother's belief comes out insensitive; type it perceptually and it's fine; type it differently again and fake barns stops being a counterexample and starts being one. So my hunch is either (a) there's a principled way of typing methods under which tracking comes out closed after all, in which case Nozick loses the thing that made the view interesting — denying closure while keeping all the ordinary knowledge — and we're stuck with the abominable conjunction anyway; or (b) every principled typing fails closure, in which case the real question is which failure pattern is least damaging and whether that's even a determinate question.

  Turn that into an actual proposal. I want a precise statement of the research question — I think there are at least two in there and I want you to say which one is primary and why the other can't be settled first. Then the case for why the existing positions leave it open rather than just disagreeing about it. Then the method: what I would concretely do, roughly month by month across twelve months, with intermediate deliverables that are checkable, because the committee will ask whether this is a project or just a mood. And an honest account of what would count as the thing failing, as opposed to coming out inconclusive — I'd rather tell them the failure conditions myself.

  Two more things. First, there's a paragraph I need defending this angle against the obvious alternatives: bite the bullet on closure, ditch sensitivity for safety, go contextualist, or treat the whole method problem as a reason to abandon the modal analysis of knowledge entirely. Say why mine is worth funding over each of those, or admit where it isn't. Second, be blunt about scope — is the method-individuation piece actually doable in a year by one person, or is it the kind of thing that swallows the project?

  Don't bother with citations or a bibliography, I'll add those myself. But if you think I've mangled a detail in the setup above, flag it at the end.
