prompt: |-
  I'm a second-year philosophy grad student applying for my department's summer stipend — eight weeks, not much money, and the committee wants a one-page project description plus about 200 words on feasibility. Write both. No references, I'll add those myself; I need positions and argument forms described, not cited.

  Here's the half-formed idea. The strategy-stealing argument — the one Nash had for Hex and that's since been used on Chomp, generalized tic-tac-toe, Sylver coinage "enders," and a bunch of maker-maker games — goes: suppose the second player had a winning strategy. The first player makes any old move, which by hypothesis can't hurt, then plays second-player against that strategy, ignoring his own extra piece (and when the stolen strategy happens to want the square the extra piece is sitting on, the ignored piece migrates). Contradiction, so no winning strategy exists for the second player; if draws are impossible, the first player wins.

  The standard gloss is that this is a non-constructive proof, filed on the same shelf as the √2^√2 example. My suspicion is that the gloss is wrong, and that fixing it is a real question rather than a quibble. Everything here is finite — the tree is finite, the reductio runs over a finite object — so excluded middle costs nothing intuitionistically, and the usual diagnosis (you leaned on a non-constructive existence principle) just doesn't apply. What's lost looks like something else. Read as a procedure, the argument hands you a way to beat any given second-player strategy, but only relative to knowing that strategy; and the opponent's strategy is exactly the thing the reductio discharges, so you can never be handed one. What the proof delivers is oracle-relative, and what everyone hears in the theorem is unconditional, and the gap between those is where the non-constructivity actually lives. Not existence versus construction — uniform-relative-to-an-oracle versus unconditional. There's also the separate step where you go from "the second player can't win" to "the first player can," which seems to need determinacy for finite games; I want the proposal to be explicit about whether that step is doing extra work or is free.

  There's a complexity result I half-remember — recent, I think it shows that finding a winning move in some games where strategy-stealing proves one exists is PSPACE-hard — which makes me think the gap isn't just a bookkeeping irritation but something you can put a lower bound on. Treat it as a placeholder, I'll chase the citation.

  So: state the question sharply enough that it has a determinate answer — what does a strategy-stealing theorem assert, and under what conditions can its oracle-relative content be converted into an unconditional strategy; is the failure to convert essential to the argument form or contingent on the game? And give me a testable deliverable, not a survey: the explicit hypotheses the form needs (symmetry, "an extra move can't hurt," no draws, plus whatever else you think is smuggled in) and a graded notion of extractability that sorts the usual cases — Hex, Chomp, m,n,k-games, Shannon's pass-variant of chess, zugzwang positions where the extra move is a liability, Go once komi breaks the symmetry, Sylver coinage enders. Tell me which of those are load-bearing and which I should drop.

  The part I keep going back and fourth on: the proposal has to say what the philosophy is doing that the complexity theory isn't already doing. My worry is a sharp referee saying "oracle-relative versus unconditional is just uniform versus non-uniform, that's a CS distinction, put on a hat and go home." Don't dodge it — take a position, and give the committee a kill criterion: a specific thing that, if it turns out true in the first three weeks, means I abandon this and write something else.

  Method should be week by week for eight weeks and be realistic: one graduate logic course, I can read a proof carefully, I am not proving a new lower bound. And there's a loose thread I don't know what to do with — the same argument shape seems to show up outside games, in "an incumbent can always copy the entrant's plan," in "the state could always do what the market does, plus," and in claims that an agent with a superset of options can't do worse than one with a subset. Either work it in as a final section or tell me to cut it, but say which.

  Last two sentences should be readable by the two committee members who don't work in philosophy of math: what's at stake, why eight weeks, why me.
