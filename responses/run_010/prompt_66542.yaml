      Given the complexity, I propose to focus on the voluntary contribution game with the three phases as above, and assume the redistribution rule is fixed as equal. The initial group doesn't set it, but they are told the rules. Then after the game, we can discuss in the debrief how in the real world, the demos sets the rules without knowing future members.

      Or, to meet the requirement, we can have the initial group vote on the production multiplier? That doesn't make sense.

      Another idea: the initial group votes on whether to have a minimum contribution requirement? But that is not about redistribution.

      Let's reinterpret: the group fixes the terms of redistribution by choosing between equal sharing and keeping the returns private. But in the public goods game, if they choose private returns, then there is no common pool.

      We can have:

          The initial group votes on the design of the game itself: 
              Option 1: Each player keeps their own tokens and there is no common pool.
              Option 2: There is a common pool with equal sharing.

          If they choose option 1, then there is no game. If they choose option 2, we play the public goods game.

          They vote. We assume they choose option 2.

          Then we proceed with the three phases.

      This way, they set the rule of redistribution (by choosing to have it) without knowing the future group.

      So the vote happens before round 1.

      Now, the design is:

          - 6 initial players.
          - They vote: "How should the game be played? 
              Option A: Each player keeps their own tokens. There is no common pool.
              Option B: Players can contribute to a common pool, which will be multiplied by 1.5 and then divided equally among all players in the group at the time."
          - Majority wins. (We assume they choose B.)

          Then rounds 1-3: with 6 players, multiplier 1.5.
          Then rounds 4-6: with 6 players, multiplier 1.125. (We announce: "The multiplication factor is now 1.125.")
          Then rounds 7-9: with 8 players (6 initial + 2 new), multiplier 1.5.

      We then compare the average contribution of the initial 6 players in:
          Phase 1 (rounds 1-3): arithmetic return 0.25 per token
          Phase 2 (rounds 4-6): arithmetic return 0.1875
          Phase 3 (rounds 7-9): arithmetic return 0.1875, but with new players.

      The solidarity effect is the difference between phase 2 and phase 3.

      This meets the requirement that the erosion comes from the rules and not from the facilitator's explanation.

      Now, for the new players in phase 3: we can assign them to be played by two students who were not in the initial group. They are given the same instructions.

      Materials:
          - Tokens: enough for each player to have 10 per round. (For 9 rounds, 8 players max: 9*8*10 = 720 tokens. Use poker chips or paper slips.)
          - Record sheets for each player to record their contribution and their payoff each round.
          - A calculator for the facilitator.

      Roles:
          - The initial 6 players.
          - The facilitator.
          - Two additional players who join in round 7.

      Payoff scheme: 
          In each round, for each player i:
              payoff_i = 10 - c_i + ( multiplier * total_contributions ) / current_group_size

      The winner is the player with the most tokens at the end? Or we can convert to extra credit? But the problem says no money, only paper tokens. We can just use tokens as points.

      To make it engaging, we can say that the tokens will be converted into candy or extra credit points at the end. But we don't want to use money.

      Debrief mapping:

          - The vote at the beginning: This represents the demos setting up the welfare state (redistribution) without knowing future members.
          - Phase 1: Cooperation among the initial group.
          - Phase 2: The arithmetic effect of a larger group (even though the group hasn't expanded yet, we simulate the reduced per-capita return).
          - Phase 3: The actual expansion. The additional drop in contributions (if any) is due to the solidarity effect: the initial players are less willing to contribute when the group includes strangers.

          Vocabulary to withhold until debrief:
              - The solidarity objection.
              - The tension between open borders, generous redistribution, and a bounded demos.

          Name for the claim: "The trilemma of open borders, generous welfare state, and democratic sovereignty".

      Rule modifications a critic could propose:

          Modification 1: 
              What if the new players are introduced gradually and are allowed to participate in the vote at the beginning? 
              How to test: Run a variation where at the beginning, we have the 6 initial players and tell them that in round 7, two new players will join, and the new players will be bound by the vote taken now. Then we take the vote. Then proceed as before.
              Prediction: The initial players, knowing that the new players will join, might choose a different rule (maybe even vote for option A: no common pool). Or if they vote for common pool, they might contribute less in phase 1 in anticipation. In phase 3, the drop might be smaller because the new players were part of the original social contract.

          Modification 2:
              What if we allow punishment? 
              How to test: Add a punishment phase after the contribution decision. Each player can spend tokens to reduce the payoff of others.
              Prediction: With punishment, cooperation can be sustained even in phase 3.

      What the activity cannot reproduce:
          - The erosion parameter (the extent of the solidarity effect) is stipulated by the design (we assume it happens) and might not match the real world.
          - Real migrants are agents with reasons of their own: in our game, the new players are just additional students. In reality, migrants might have different norms, work ethics, etc.
          - In the game, the new players are exogenous and not chosen by the group. In reality, immigration policy is endogenous.
          - The game does not model the long-term integration of immigrants.
          - The mandatory tax aspect of the welfare state is not captured; we have voluntary contributions.

      What will predictably go wrong the first time:
          - The initial group might not cooperate in phase 1, making it hard to see a drop.
          - The new players in phase 3 might free ride excessively, causing a drop that is due to their behavior, not the initial players' solidarity. But in our design, we are only measuring the initial players' contributions in phase 3. We can separate the data: look only at the initial players' contributions in phase 2 and phase 3.

          How to handle:
              - If phase 1 cooperation is low, in the debrief we can discuss why cooperation is hard even in homogeneous groups.
              - For the new players: we can instruct them privately to try to cooperate, but not force them. In the analysis, we will focus on the initial players. If asked, we can explain that we are interested in the initial players' response to expansion.

      Answer to the student on ethnic heterogeneity and evidence:
          "This game is not designed to settle empirical questions about the real world. It is a thought experiment to help us understand a theoretical mechanism: how group boundaries might affect solidarity. The empirical literature on ethnic heterogeneity and support for redistribution is mixed and context-dependent. Some studies find a negative correlation, while others find that it is mitigated by institutional design or shared identity. What this game illustrates is one possible mechanism that could explain a part of that empirical pattern, but it is not a substitute for careful empirical research. I encourage you to look into the literature and see how well the evidence supports the mechanism we've explored today."

      Given the time constraint (80 minutes), we have to keep the rounds short. We can do:

          - Vote: 5 minutes
          - Rounds 1-3: 3 minutes per round (including collecting contributions and distributing payoffs) -> 9 minutes
          - Break and announce phase 2: 2 minutes
          - Rounds 4-6: 3 minutes per round -> 9 minutes
          - Break, add new players, explain phase 3: 5 minutes
          - Rounds 7-9: 3 minutes per round -> 9 minutes
          - Debrief: 30 minutes

      Total: 5+9+2+9+5+9+30 = 69 minutes. Extra time for transitions.

      We can do one round per phase? But that might not be enough to see a trend. Or we can do two rounds per phase.

      Given the time, let's reduce to two rounds per phase.

      Adjusted timing:

          - Vote and explanation: 5 minutes
          - Round 1-2: 3 minutes each -> 6 minutes
          - Break to phase 2: 1 minute
          - Round 3-4: 3 minutes each -> 6 minutes (round 3 and 4 are phase 2: still 6 players, multiplier 1.125)
          - Break, add new players, explain phase 3: 5 minutes
          - Round 5-6: 3 minutes each -> 6 minutes (round 5 and 6 are phase 3: 8 players, multiplier 1.5)
          - Debrief: 45 minutes

      Total: 5+6+1+6+5+6 = 29 minutes for gameplay, 45 for debrief -> 74 minutes.

      Alternatively, we can have each round take 2 minutes for decision and 1 minute for payoff calculation.

      Let's write the full procedure.

      Due to the complexity, we will proceed with this design.
answer: |-
  ### **Solidarity and Redistribution Game: "The Commons Dilemma"**

  #### **Learning Objective**
  To experientially distinguish between two questions often conflated in debates on immigration and welfare states:  
  1. **Fiscal Impact**: Whether an additional member is a net contributor to the common pool.  
  2. **Solidarity Erosion**: Whether group expansion weakens the reciprocal willingness to contribute, independent of fiscal math.  

  ---

  ### **Materials**  
  - **Tokens**: 150+ identical tokens (e.g., poker chips, buttons, or paper clips).  
  - **Contribution Cards**: 18 index cards (one per student) for private contribution decisions.  
  - **Record Sheet**: Whiteboard/paper to track:  
    - Group size (N)  
    - Total contributions (C)  
    - Multiplier (M)  
    - Per-capita redistribution (C×M ÷ N)  
  - **Timer**  

  ---

  ### **Roles**  
  1. **Citizens (12–14 players)**: Decide how many tokens to contribute to the common pool each round.  
  2. **Rule-Setting Committee (4 players)**: Drafts the initial redistribution rule **before knowing they will later expand**.  
  3. **Immigrants (2 players)**: Join mid-game. Identical endowments/choices as citizens.  
  *(Assign roles randomly; committee is isolated during rule-setting.)*  

  ---

  ### **Rules & Round Structure**  
  **Phase 0: Rule-Setting (10 mins)**  
  - **Committee Task**: Draft a *redistribution covenant*:  
    *"All tokens contributed to the common pool are multiplied by M and redistributed equally to every member, regardless of individual contribution."*  
    (Committee must agree on M. Suggested: M = 1.8. *No other instructions given.*)  
  - **Citizens Wait**: Unaware of future expansion.  

  **Phase 1: Baseline Rounds (15 mins)**  
  - **Group**: 12 citizens (excluding committee).  
  - **Rounds 1–2**:  
    - Each gets 10 tokens.  
    - Privately decide contributions (0–10) via cards.  
    - Facilitator collects cards, calculates:  
      - Total contributions (C)  
      - Per-capita payoff = (C × M) ÷ 12 + (10 − individual contribution)  
    - **No discussion** between rounds.  

  **Phase 2: Expansion Rounds (20 mins)**  
  - **Round 3**:  
    - **Add 2 immigrants** (identical rules/tokens).  
    - Group size now = 14.  
    - **Same M** as Phase 1.  
    - Contributions and payoffs calculated as before.  
  - **Round 4**:  
    - Repeat Round 3 with same group (N=14).  
  - **Round 5**:  
    - **Critical change**: *Secretly* set M = 1.5 (even if committee chose 1.8).  
    - Play normally (N=14, M=1.5).  
    *(Students see M change but get no explanation.)*  

  **Phase 3: Final Round (5 mins)**  
  - **Round 6**:  
    - M returns to original value (e.g., 1.8).  
    - Play normally (N=14).  

  ---

  ### **Payoff Scheme**  
  - **No real money**: Tokens → "points" (e.g., candy, extra credit, or symbolic victory).  
  - **Individual Payoff** = (Tokens kept) + (Redistribution share)  
    - *Redistribution share* = (Total contributions × M) ÷ N  
  - **Example**:  
    - Phase 1 (N=12, M=1.8):  
      - If all contribute 10: (10 − 10) + (120 × 1.8) ÷ 12 = 0 + 18 = 18  
    - Phase 2 (N=14, M=1.8):  
      - If all contribute 10: (10 − 10) + (140 × 1.8) ÷ 14 = 0 + 18 = 18  
    *(Identical outcomes if all cooperate, but M=1.5 in Round 5 creates a fiscal shock.)*  

  ---

  ### **Debrief (30 mins)**  
  **Withhold vocabulary until now**. Map gameplay to concepts:  
  1. **Round 1–2**:  
     - *Concept*: Baseline solidarity in a bounded "we."  
     - *Observe*: Typical high contributions in small, cohesive groups.  
  2. **Round 3–4 (expansion, same M)**:  
     - *Concept*: **Fiscal impact question**. Immigrants are identical—no arithmetic reason for contributions to drop.  
     - *Observe*: Contribution drop? *This is solidarity erosion*.  
  3. **Round 5 (M=1.5)**:  
     - *Concept*: **Fiscal shock** simulating "net cost" migrants.  
     - *Observe*: Contributions drop further. Distinguish arithmetic vs. solidarity effects.  
  4. **Round 6 (M restored)**:  
     - *Observe*: Does cooperation rebound? Or is trust broken?  
  5. **Name the Tension**:  
     - **"The Democratic Trilemma"**: Open borders + generous redistribution + democratic self-rule are mutually incompatible without trade-offs.  

  ---

  ### **Testing Modifications for Critics**  
  A critic might argue solidarity erosion is an artifact of your rules. Test with:  
  1. **Modification 1**: Immigrants join the Rule-Setting Committee.  
     - *Prediction*: If immigrants help set the covenant, solidarity remains high.  
     - *Rationale*: Shared authorship of rules builds inclusive "we."  
  2. **Modification 2**: Allow punishment of low contributors.  
     - *Prediction*: Sanctions sustain cooperation despite expansion.  
     - *Rationale*: Institutions (e.g., conditional welfare) offset erosion.  

  ---

  ### **What the Game Cannot Reproduce**  
  1. **Erosion is stipulated, not emergent**:  
     - You set M=1.5 in Round 5 to simulate fiscal strain. IRL, this is dynamic.  
  2. **Migrants as agents**:  
     - Real migrants have motives, skills, and adaptability. Here, they’re passive.  
  3. **Endogenous policy**:  
     - IRL, democracies adjust borders/welfare rules. Here, rules are fixed until altered by you.  
  4. **Identity factors**:  
     - Ethnic/cultural heterogeneity is abstracted. Only group size matters.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem**: Low initial cooperation (Phase 1).  
    - *Fix*: Remind them high contributions benefit all if others reciprocate.  
  - **Problem**: Immigrants blamed for Round 5 drop (due to secret M=1.5).  
    - *Fix*: In debrief, reveal M was changed by you—highlight how bias misattributes erosion.  
  - **Problem**: Rule-setting committee drafts unclear rules.  
    - *Fix*: Gently enforce: "Redistribute equally after multiplying by M."  

  ---

  ### **Response to the Empirical Question**  
  If a student cites ethnic heterogeneity studies:  
  > *"This game isolates one mechanism—group size eroding reciprocity—but real-world evidence is complex. Some studies find ethnic diversity correlates with lower support for redistribution, but context matters: shared institutions, narratives, or time can mitigate this. The game doesn’t prove diversity *causes* erosion; it shows how *any* expansion might strain solidarity, even with identical newcomers. We must consult empirical work, but also ask: can institutions transform strangers into a ‘we’? That’s a normative choice, not just an empirical one."*  

  ---

  ### **Summary**  
  This design forces students to:  
  1. **Experience solidarity erosion** via falling contributions after expansion—despite identical fiscal math.  
  2. **Distinguish arithmetic** (Round 5) **from reciprocity** (Rounds 3–4).  
  3. **Confront the Trilemma** democratically: Who is "we," and what are we willing to share?  

  Run tight on time? Shorten rounds to 2 mins each. The "aha" moment comes when expansion drops contributions *before* the fiscal shock.
