answer: |-
  Here are five claims the film is committed to, each tied to a specific scene:

  1.  **The film demonstrates that the *anticipation* of extinction, not low population itself, corrodes societal meaning and action.** The pervasive despair, cultural stagnation (e.g., Theo's apathy, the "Ark of the Arts"), and state brutality (Bexhill) stem from the *knowledge* of impending end, not the material conditions of 2027.
  2.  **Children function primarily as symbols of collective continuity and shared humanity, not as units of welfare.** The ceasefire in Bexhill as the baby cries forces this: the soldiers' awe momentarily transcends ideology and conflict, revealing a latent, universal human response to the *idea* of future possibility embodied by an infant.
  3.  **Intrinsic value is found in nurturing existing life, not in creating new life for instrumental ends.** Jasper's woodland refuge, with its care for his catatonic wife and Theo/Kee, stands in stark contrast to the Fishes (exploiting Kee), the state (brutalizing refugees), and the Human Project (abstract goal). Its warmth persists *despite* no children.
  4.  **The film critiques instrumentalizing life, showing that factions seeking the baby for power (Fishes, state) or abstract salvation (Human Project) are morally compromised or ineffective.** Luke's cold-blooded betrayal and murder of Julian at the farmhouse after capturing Kee forces this, exposing the Fishes' revolution as just another power grab using the baby as a tool.
  5.  **The film exposes the hypocrisy of valuing "more population" only for an exclusive "us".** Kee's status as a *refugee*, hunted by the state desperate for a propaganda win with a baby while caging and murdering refugees in Bexhill, forces this point: the state's desire for population growth is nationalistic and exclusionary, not universalist.
