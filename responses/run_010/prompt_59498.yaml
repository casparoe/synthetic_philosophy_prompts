  Based on your gut reactions and the analysis, there isn't a single, universally consistent principle that covers all cases. However, a **hybrid rule** combining Nash bargaining and Kalai-Smorodinsky (KS) solutions aligns with most of your intuitions while minimizing deviations. Here's the breakdown:

  ### **Hybrid Rule**  
  - **If the Pareto frontier is a straight line**, use **Nash bargaining**: Maximize the product of gains over the walkaway point:  
    \((u_1 - d_1) \times (u_2 - d_2)\), where \(u_i\) is the payoff and \(d_i\) is the walkaway.  
  - **If the frontier is piecewise linear (not straight)**, use **Kalai-Smorodinsky**: Equalize the *proportional gains* relative to each player's ideal outcome:  
    \(\frac{u_1 - d_1}{u_1^{\max} - d_1} = \frac{u_2 - d_2}{u_2^{\max} - d_2}\),  
    where \(u_i^{\max}\) is the maximum payoff player \(i\) can achieve on the frontier.

  ---

  ### **Evaluation Against Your Cases**  
  1. **Case 1**: Straight line, walkaway (0, 0).  
     - Nash: Maximize \(me \times her\) → (50, 50).  
     - **Matches your gut (50/50)**.  

  2. **Case 2**: Straight line, walkaway (50, 0).  
     - Nash: Maximize \((me - 50) \times (her - 0)\) → (75, 25).  
     - **Matches your gut (75/25)**.  

  3. **Case 3**: Piecewise linear, walkaway (0, 0).  
     - KS: Ideal gains (120 for you, 60 for her). Solve \(\frac{me}{120} = \frac{her}{60}\) → (66.7, 33.3).  
     - **Matches your gut (66.7/33.3)**.  

  4. **Case 4 (original)**: Piecewise linear, walkaway (0, 0).  
     - KS: Ideal gains (12 for both). Solve \(\frac{me}{12} = \frac{her}{12}\) → (6.67, 6.67).  
     - **Deviation from your gut (6/7.5)**: This is the verdict to give up. Your initial Nash-based answer (6/7.5) is replaced by KS for piecewise frontiers.  

  5. **Case 4 (after adding (9,4))**: Still piecewise linear.  
     - KS: New solution ≈ (6.73, 6.73). Both players gain slightly vs. original (6.67→6.73).  
     - **Plausible to accept**: Adding an option slightly benefits both, avoiding your concern about her losing.  

  6. **Survivor Case**: Straight line from (0,100) to (100,0), walkaway (0, 30).  
     - Nash: Maximize \((me - 0) \times (her - 30)\) → (35, 65).  
     - **Matches your implied gut (35/65)**: You "bank" her 30 and split surplus 70 evenly.

