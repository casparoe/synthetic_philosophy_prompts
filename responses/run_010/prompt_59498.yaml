  ### **Why This Hybrid?**  
  - **Coherence**:  
    - Straight-line frontiers (Cases 1, 2, Survivor) use Nash, matching your "bank and split" intuition.  
    - Piecewise frontiers (Cases 3, 4) use KS, matching your "equal fraction of best case" intuition and avoiding the "irrelevant options" issue in Case 4.  
