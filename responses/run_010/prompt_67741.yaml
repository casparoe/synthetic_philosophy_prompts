prompt: |-
  I ran a metrology group for thirty-eight years — resistance standards, thermometry, calibration chains — and retired two years ago. Philosophy has since become my principal occupation, pursued with the habits of the laboratory, which is why I keep looking for the error bars. My difficulty concerns learning from evidence that is itself uncertain, and I have reached the point where I can state both sides of that dispute but neither adjudicate nor set aside. What I want is not a verdict. I want the document that a sincere adversarial collaboration between the two camps ought to have produced.

  The camps, as I understand them. On one side: those who hold that all learning is conditioning upon a proposition of which the agent becomes certain, and that apparently uncertain evidence can always be re-described — the certain input being a proposition about the agent's own present experience, with the instrument's error model supplying the likelihood that connects that experience to the world. On the other side: those who hold that probability kinematics is a fundamental update scheme in its own right rather than a derived special case, and that the re-description either smuggles in incorrigible inner states or is simply not defined for the agents who actually exist.

  Please draft their joint statement, to the following specification.

  1. Agreed claims, numbered, ten to fourteen of them. These should include the shared mathematics — the coherence framework, both static and diachronic; the sufficiency or rigidity condition; the weighted-average form of the rule and its uniqueness; the martingale property; the behaviour of iterated updates — together with what both camps agree needs explaining and what they agree about the conduct of measurement. Every item must be one both would sign without reservation. I would rather have twelve sharp items than forty bland ones.

  2. A disagreements table, with columns for the disputed claim in the conditioning camp's own preferred wording; the same point in the kinematics camp's own preferred wording; whether the disagreement is substantive, verbal, or partly both, with a reason; and what each camp would accept as settling it. The rows must include at least: whether any proposition is ever an object of certainty; whether the new probabilities assigned to the observation-cells require an explanation or may stand as inputs; whether evidence is propositional at all; whether the rigidity condition mis-describes observation, given that experience often changes one's conditional credence about the measurand given the very reading just taken — I am thinking of learning that the instrument has drifted; and whether the two schemes ever issue in different recommendations for one and the same real agent.

  3. Three to five cruxes: sub-questions such that settling one would move at least one camp. For each, a concrete case, each camp's prediction recorded in advance, and the outcome that would falsify it. Say plainly whether any crux is a crux only against a background disagreement about the metaphysics of evidence. If you conclude that some part of the dispute is verbal, identify that part and explain why; do not distribute the blame evenly as a courtesy.

  4. Case discipline. No urns, no cards glimpsed under a lamp, no tablecloth seen under changing shop light. Build every case from a measurement chain of this sort: a bench voltmeter reading a thermocouple, four and a half digits; an operator who occasionally takes a 3 for an 8 in the last place; a colleague who logs a value called out across the room; a calibration certificate stating an expanded uncertainty; a slow ambient drift; and, in at least one case, two readings taken under different conditions and absorbed in a stated order. I want the order-dependence question worked out on that material, with the partition written down.

  5. My own notes, which I suspect are partly garbled and partly partisan. Verify, correct, and tell me which of them already favours a camp:
   (a) The rule leaves the conditional probabilities of the hypothesis given each cell unchanged, and the posterior is the weighted average of those conditionals under the new cell probabilities.
   (b) Applying the rule successively to two different partitions need not commute, whereas always conditioning on the accumulated total evidence makes the order of absorption irrelevant, since the endpoint is a single conditional on a conjunction. I take this asymmetry to be the conditioning camp's strongest technical card, and I should like to see it played or explained away.
   (c) Given the rigidity condition, the rule is the unique update satisfying it, and it generalizes to inputs given as several linear constraints rather than as a partition.
   (d) An agent who expects to update by the rule, and who is not offered bets across the interval, cannot be diachronically Dutch-booked; within its domain the rule is coherence-mandated, not merely permitted.
   (e) The prior credence in a hypothesis equals the agent's own prior expectation of her posterior credence, and something like the reflection principle follows.
   (f) The rule's originator appears to have conceded that the new cell probabilities are not fixed by anything antecedent — they simply arrive — which one camp treats as a decisive admission and the other answers by asking where certainties come from.

  6. A closing pair of paragraphs on practice: what each camp tells a scientist to write in the notebook when a reading is uncertain, each account such that the opposing camp would recognize it as fair. This is what I actually want to know about myself.

  I am aware of the neighbouring disputes about old evidence and about non-rigid updating generally; bring them in only where they bear on a crux, and say so when you do. No bibliography and no reading list — where a result is load-bearing, state its content precisely enough that I could reconstruct it myself.
reasoning: |-
  We are drafting a joint statement from two camps in the philosophy of uncertain evidence. The camps are:
  1. Conditioning Camp (CC): Holds that all learning is conditioning upon a proposition of which the agent becomes certain. Uncertain evidence is re-described as certain evidence about the agent's own experience, with an error model connecting that experience to the world.
  2. Kinematics Camp (KC): Holds that probability kinematics (Jeffrey conditionalization) is a fundamental update scheme, not a derived special case. The re-description either smuggles in incorrigible inner states or is not defined for actual agents.

  The document must have:
  1. Agreed claims (10-14 items)
  2. Disagreements table (with specified rows)
  3. Cruxes (3-5, with concrete cases and predictions)
  4. Cases built from measurement chains (no traditional thought experiments)
  5. Analysis of user's notes (verify, correct, note partisan leaning)
  6. Closing paragraphs on practice (what each camp tells a scientist to write in a notebook)

  We start with the agreed claims.

  Agreed Claims (numbered 1 to 12):

  1. Coherence Framework: Both camps agree that an agent's degrees of belief at a given time should satisfy the probability axioms (static coherence). They also agree that there are diachronic constraints to avoid dynamic incoherence (e.g., Dutch books).

  2. Representation of Uncertainty: Both agree that uncertainty is represented by a probability function over a set of propositions (the algebra).

  3. The Rigidity Condition (Sufficiency Condition): When updating on a partition of propositions {E_i} (the "cells"), the conditional probabilities of any hypothesis H given each cell E_i remain unchanged by the update. Formally, P_new(H | E_i) = P_old(H | E_i) for each i, provided P_old(E_i) > 0. This condition is agreed to be necessary for the update to be considered a learning experience about the partition.

  4. The Weighted-Average Form: Given the rigidity condition, the posterior probability of any hypothesis H is given by the formula:
     P_new(H) = ∑_i P_new(E_i) * P_old(H | E_i)
     This is the standard form of Jeffrey conditionalization.

  5. Uniqueness of the Rule: Given a prior probability function and a new probability distribution over a partition {E_i} (with the same index set), the update rule that satisfies rigidity and the probability axioms is unique and is given by the weighted-average formula.

  6. The Martingale Property: For any hypothesis H, the prior probability P_old(H) equals the prior expectation of the posterior probability P_new(H). That is, 
     P_old(H) = ∑_i P_old(E_i) * P_old(H | E_i) = ∑_i P_old(E_i) * P_new(H | E_i) [by rigidity] 
     But note that the posterior expectation of P_new(H) is not necessarily the same as the prior. The martingale property here is with respect to the prior: the prior probability is the expected value (over the partition) of the posterior probability.

  7. Iterated Updates: When updating sequentially on two different partitions, the order of updates may matter. Both camps agree that the rigidity condition must hold for each update step and that without additional constraints (like commutativity conditions) the result may depend on the order.

  8. The Role of Measurement in Science: Both camps agree that in scientific practice, measurements are often uncertain and that the uncertainty is quantified (e.g., by standard deviation, expanded uncertainty). They also agree that the calibration chain (traceability) and error models are essential for establishing the reliability of measurements.

  9. The Need for Explanation: Both camps agree that an update rule must be explicable and that the rigidity condition is a key constraint. They also agree that the update rule must be applicable to real agents and that the agent's cognitive state is relevant.

  10. The Conditioning Update as a Special Case: Both camps agree that when the new probabilities for the partition {E_i} assign 1 to a particular cell E_k (and 0 to others), the update reduces to conditioning on E_k (i.e., strict conditionalization).

  11. The Algebra of Propositions: Both camps agree that the propositions over which probabilities are defined are part of a Boolean algebra (or sigma-algebra for continuous cases).

  12. The Possibility of Misdescription: Both camps agree that an agent might misdescribe their own experience (e.g., misreading a meter) and that the error model must account for such possibilities.

  We have 12 agreed claims.

  Disagreements Table:

  We structure the table with columns:
  - Disputed Claim in CC's wording
  - Disputed Claim in KC's wording
  - Nature of Disagreement (substantive, verbal, or both; with reason)
  - What would settle the dispute (according to each camp)

  Rows:

  Row 1: Certainty of Propositions
  - CC: "Every learning experience is conditioning on a proposition about the agent's own present experience, which becomes certain for the agent."
  - KC: "No proposition about the agent's experience (or any other) is ever an object of certainty; all evidence is inherently uncertain and must be represented by a probability distribution over a partition."
  - Nature: Substantive. CC holds that certainty is achievable for inner states (incorrigibly), while KC denies that any proposition is ever certain and that inner states are not incorrigible. Also, KC argues that the agent's experience is not propositionally structured in a way that allows for certainty.
  - Settlement: 
    - CC: If it can be shown that agents can be certain of their own experiences (e.g., by introspection) and that such certainty is the basis for all learning.
    - KC: If it can be shown that the certainty requirement leads to regress or that agents in practice do not achieve certainty even about inner states.

  Row 2: Explanation of New Cell Probabilities
  - CC: "The new probabilities assigned to the observation-cells must be explained by conditioning on a certain proposition about the agent's experience, using an error model that provides the likelihoods connecting the experience to the world."
  - KC: "The new probabilities assigned to the observation-cells are inputs to the update and do not require further explanation; they are the direct result of the agent's experience and may stand as primitives."
  - Nature: Partly substantive and partly verbal. Substantive: CC requires an account of how the new probabilities arise (via conditioning on a certain experience), while KC takes them as given. Verbal: The term "explanation" may be understood differently. For CC, an explanation is necessary for rationality; for KC, it is not required at the input stage.
  - Settlement:
    - CC: If it can be shown that without an error model, the update is arbitrary and irrational.
    - KC: If it can be shown that the error model itself requires an update that is not reducible to conditioning (e.g., a case where the error model is uncertain and updated by kinematics).

  Row 3: Propositional Nature of Evidence
  - CC: "Evidence is propositional: it is the content of a perceptual judgment that the agent endorses with certainty."
  - KC: "Evidence is not necessarily propositional; it can be a non-propositional experience that directly prompts a change in the probabilities over a partition."
  - Nature: Substantive. CC holds that evidence must be propositional to be incorporated into a Bayesian framework, while KC argues that the update rule can be applied without reducing evidence to a proposition.
  - Settlement:
    - CC: If it can be shown that non-propositional evidence leads to incoherence.
    - KC: If it can be shown that every instance of learning can be modeled as a change in probabilities without requiring a proposition to be conditioned upon.

  Row 4: Rigidity Condition and Drift
  - CC: "The rigidity condition correctly describes observation because the conditional probabilities of the hypothesis given the observation-cell (e.g., the instrument reading) are fixed by the error model and do not change unless the error model itself is updated by new evidence (e.g., learning of drift)."
  - KC: "The rigidity condition may mis-describe observation because experience (e.g., learning that the instrument has drifted) can change the conditional probabilities of the hypothesis given the same instrument reading, without a separate update to the error model."
  - Nature: Substantive. The dispute is about whether the rigidity condition can be maintained in the face of changes in the reliability of the instrument. CC would require that any change in the error model (due to drift) be handled by a separate update (conditioning on the drift information), while KC might allow a single kinematics update that simultaneously changes the probabilities over the partition and the conditionals (which would violate rigidity). However, note that standard kinematics requires rigidity. So the point is that when drift is learned, the original rigidity condition might be violated. KC might argue that kinematics can be applied to a finer partition that includes drift, while CC would break it into two steps.
  - Settlement:
    - CC: If it can be shown that cases of drift are always handled by conditioning on new evidence about the drift, without violating rigidity for the original partition.
    - KC: If it can be shown that in some cases, the agent's learning about drift and the new reading cannot be separated without loss and must be updated in a single step that violates the rigidity condition for the original partition.

  Row 5: Order Dependence and Real Agents
  - CC: "For one and the same real agent, the two schemes (conditioning and kinematics) never issue different recommendations because kinematics is reducible to conditioning on a proposition about experience."
  - KC: "There are cases where conditioning and kinematics give different results for a real agent, and kinematics is the correct update."
  - Nature: Substantive. This is about the empirical adequacy of the two methods for actual agents in real situations.
  - Settlement:
    - CC: If every apparent kinematics update can be reconstructed as a conditioning update on a proposition about experience.
    - KC: If there is a scenario where the agent's update is best described by kinematics and cannot be reduced to conditioning without introducing an artificial proposition that the agent does not actually condition upon.

  Cruxes (3 to 5):

  Crux 1: Can the new cell probabilities be reduced to conditioning on a certain experience?
  - Concrete Case: 
    - Setup: A bench voltmeter reads a thermocouple, showing 1.234 V (four and a half digits). The operator knows that they occasionally misread the last digit (taking a 3 for an 8 or vice versa, with known probability 0.1). The actual reading is 1.234, but the operator is not certain: they assign P(reading is 1.234) = 0.9 and P(reading is 1.238) = 0.1. The true voltage is of interest (H: true voltage is 1.235 V). The error model is known: if the true voltage is x, the probability that the voltmeter shows y is given by a known distribution (including the digit misreading). 
    - Question: Can the update (to the probabilities of the true voltage) be achieved by conditioning on a proposition about the operator's experience?
    - CC Prediction: Yes. The agent conditions on the proposition: "I have the visual experience as of seeing 1.234". The error model then gives the likelihood of this experience given the true state. The new cell probabilities are not primitive but derived.
    - KC Prediction: No. The agent does not condition on a proposition about experience; they directly assign probabilities to the possible readings (1.234 or 1.238) based on the experience. The experience itself is not propositional in the required sense.
    - Outcome: 
      - Falsification of CC: If the agent cannot articulate a proposition about their experience that they are certain of (e.g., because they are unsure about what they saw, but also unsure about whether their vision is reliable at that moment).
      - Falsification of KC: If the update can be shown to be mathematically equivalent to conditioning on a proposition about experience (using the error model to define the likelihoods).

  Crux 2: Does learning about instrument drift violate the rigidity condition for the original partition?
  - Concrete Case:
    - Setup: The same voltmeter is used. The operator takes a reading (1.234 V) and is about to update their belief about the true voltage. Then, a colleague informs them that the voltmeter has been drifting slowly due to ambient temperature changes. The drift is such that the error model has changed. The operator now revises their conditional probabilities for the true voltage given the same reading (1.234 V). 
    - Question: Can the update (after learning about drift) be done while maintaining the rigidity condition for the original partition {E_i} where each E_i is a possible reading? 
    - CC Prediction: Yes, because learning about drift is a separate piece of evidence (a proposition) that the agent conditions on. After conditioning on the drift information, the original rigidity condition may no longer hold, but that's because the error model has changed. Then, when updating on the reading, the rigidity condition holds for the new error model. Alternatively, the agent can condition on both the experience and the drift information at once.
    - KC Prediction: The rigidity condition for the original partition is violated by the drift information. The update must be done by revising the entire probability distribution, possibly by applying kinematics to a finer partition that includes drift parameters. The original partition alone is insufficient.
    - Outcome:
      - Falsification of CC: If the drift information cannot be captured by a proposition that the agent conditions on without simultaneously updating the probabilities of the original cells and the conditionals in a way that breaks rigidity for the original partition at an intermediate step.
      - Falsification of KC: If the update can be broken into two conditioning steps (first on the drift information, then on the experience) without violating rigidity at any step.

  Crux 3: Order dependence in iterated updates.
  - Concrete Case:
    - Setup: An operator takes two readings under different conditions. First, they take a reading with the voltmeter (V1 = 1.234 V) and then they take a second reading with the same voltmeter but after noticing a fluctuation in the ambient temperature (V2 = 1.235 V). The two readings are absorbed in two orders: 
        Order A: First update on V1, then on V2.
        Order B: First update on V2, then on V1.
    - The partition for the first update (in either order) is the set of possible readings for that measurement. The operator uses kinematics for each update (with rigidity for the partition of that update). The error model is the same for both readings, but the drift information is learned after the first reading and before the second. 
    - Question: Does the order of update affect the final probabilities for the true voltage? 
    - CC Prediction: Since kinematics is reducible to conditioning on an experience proposition, and conditioning on the total evidence (conjunction of the two experiences) is order-independent, the final probabilities should be the same regardless of order. Any order dependence in kinematics is an artifact and would not occur if the update were done by conditioning on the total evidence.
    - KC Prediction: Order dependence is a natural feature of kinematics and may occur in this case because the two updates are on different partitions (the two readings) and the rigidity condition for the second update may be affected by the first update. In particular, after updating on the first reading, the agent's probabilities for the true voltage change, which might affect the error model for the second reading (if, say, the error model depends on the true value). Also, the drift information might be incorporated in between. So order may matter.
    - Outcome:
      - Falsification of CC: If order dependence occurs and cannot be eliminated by conditioning on the total evidence (because the agent never conditions on a single proposition that captures both experiences at the same time).
      - Falsification of KC: If the order dependence disappears when the update is done by conditioning on the total evidence (the conjunction of the two experience propositions) and the agent does have such a proposition.

  Note: This crux is partly against the background of the metaphysics of evidence (whether evidence is propositional and can be conjoined).

  We have three cruxes.

  User's Notes Analysis:
  We have six notes (a to f). We verify and correct, and note which camp they favour.

  (a) "The rule leaves the conditional probabilities of the hypothesis given each cell unchanged, and the posterior is the weighted average of those conditionals under the new cell probabilities."
     - This is correct and describes the rigidity condition and the weighted-average form. Both camps accept this. It is neutral.

  (b) "Applying the rule successively to two different partitions need not commute, whereas always conditioning on the accumulated total evidence makes the order of absorption irrelevant, since the endpoint is a single conditional on a conjunction. I take this asymmetry to be the conditioning camp's strongest technical card, and I should like to see it played or explained away."
     - Correct. This is a key point. Conditioning on total evidence is order-independent, but kinematics updates on two partitions may not commute. CC uses this to argue that kinematics is not fundamental. KC must explain why order dependence is acceptable (e.g., because the evidence is absorbed in pieces and the agent's state changes in between). This note favours CC.

  (c) "Given the rigidity condition, the rule is the unique update satisfying it, and it generalizes to inputs given as several linear constraints rather than as a partition."
     - Correct. The uniqueness is proven (by Jeffrey and others). The generalization to linear constraints (like expectation values) is also known (e.g., in the work of Wagner). This is neutral.

  (d) "An agent who expects to update by the rule, and who is not offered bets across the interval, cannot be diachronically Dutch-booked; within its domain the rule is coherence-mandated, not merely permitted."
     - Partially correct. There are Dutch book arguments for kinematics (e.g., by Armendt) that show that if an agent announces in advance that they will update by kinematics on a partition, then they can be Dutch-booked only if they violate probability axioms. However, note that if the agent is not offered bets on the partition cells, then a Dutch book might be avoided. But the full coherence of kinematics is debated. This note leans slightly towards KC.

  (e) "The prior credence in a hypothesis equals the agent's own prior expectation of her posterior credence, and something like the reflection principle follows."
     - Correct. This is the martingale property (agreed claim 6). The reflection principle (van Fraassen) is related but distinct. The martingale property is neutral.

  (f) "The rule's originator (Jeffrey) appears to have conceded that the new cell probabilities are not fixed by anything antecedent — they simply arrive — which one camp treats as a decisive admission and the other answers by asking where certainties come from."
     - Correct. Jeffrey did say that the new probabilities are "raw" and not derived. CC sees this as an admission that kinematics is incomplete because it doesn't explain the inputs. KC argues that the same is true for conditioning: the certainty on a proposition "just arrives". This note is neutral but highlights the dispute.

  Closing Paragraphs on Practice:

  Conditioning Camp's Advice to a Scientist:
  "When taking a reading that is uncertain (e.g., due to possible misreading or instrument error), record the following in your notebook: (1) the raw reading (e.g., '1.234 V'), (2) your certainty about your own experience (e.g., 'I am certain that I saw "1.234" on the display'), and (3) the error model that connects your experience to the true state (which may include known uncertainties such as misreading probabilities and instrument errors). This allows you to later condition on the proposition about your experience (what you saw) to update your beliefs about the measurand. The error model must be based on calibration data and known limitations."

  Kinematics Camp's Advice to a Scientist:
  "When taking a reading, record: (1) the reading (e.g., '1.234 V'), (2) your new probabilities for the possible values of the measurand (or for the reading if you are using it as a partition) based on the experience, and (3) any relevant factors that influenced your assessment (such as environmental conditions or known instrument drift). The update of your beliefs about the measurand is done by Jeffrey conditionalization: set the new probabilities for the partition (e.g., the possible readings) to the ones you now assign and then use the rigidity condition (which comes from your error model) to compute the posterior for the measurand. The error model is still essential for the rigidity condition, but the new probabilities for the partition are direct outputs of your experience."

  Both camps would recognize the other's account as fair because both include the error model and the reading. The difference is in what is taken as the input (certain experience vs. new probabilities).

  We have now addressed all parts of the request.
answer: |-
  ### Joint Statement: Conditioning vs. Kinematics in Uncertain Evidence  

  #### 1. Agreed Claims  
  Both camps endorse the following, grounded in formal coherence and scientific practice:  

  1. **Probability Axioms (Static Coherence):** Rational credences form a probability distribution over a Boolean algebra of propositions.  
  2. **Diachronic Coherence:** Updates must avoid sure losses in sequential betting (no Dutch books).  
  3. **Rigidity/Sufficiency Condition:** For any hypothesis \(H\) and partition \(\{E_i\}\), updating preserves conditionals: \(P_{\text{new}}(H \mid E_i) = P_{\text{old}}(H \mid E_i)\) if \(P_{\text{old}}(E_i) > 0\).  
  4. **Weighted-Average Form:** Given rigidity, the posterior is \(P_{\text{new}}(H) = \sum_i P_{\text{new}}(E_i) \cdot P_{\text{old}}(H \mid E_i)\).  
  5. **Uniqueness of the Rule:** Rigidity and the probability axioms imply the weighted-average form is the unique update for a given partition and new \(\{P_{\text{new}}(E_i)\}\).  
  6. **Martingale Property:** Prior credence equals the prior expectation of posterior credence: \(P_{\text{old}}(H) = \sum_i P_{\text{old}}(E_i) \cdot P_{\text{old}}(H \mid E_i)\).  
  7. **Iterated Non-Commutation:** Sequential updates on distinct partitions generally depend on order (unless partitions are compatible).  
  8. **Measurement Uncertainty:** Scientific instruments (e.g., voltmeters) have error sources (e.g., misreading, drift) quantified as probabilities.  
  9. **Calibration Chains:** Traceable standards (e.g., NIST-traceable certificates) justify likelihoods in error models.  
  10. **Reduction to Conditioning:** When \(P_{\text{new}}(E_k) = 1\) for some \(k\), the update reduces to conditioning on \(E_k\).  
  11. **Domain of Applicability:** Both rules apply only when rigidity holds (e.g., stable error models).  
  12. **Need for Explanation:** The update rule must account for how evidence affects beliefs; neither camp treats rigidity as arbitrary.  

  #### 2. Disagreements Table  
  | Conditioning Camp (CC) Claim | Kinematics Camp (KC) Claim | Disagreement (Substantive/Verbal) | Settlement Condition |  
  |------------------------------|----------------------------|----------------------------------|----------------------|  
  | "All learning requires certainty in *some* proposition (e.g., about immediate experience), with likelihoods bridging to the world." | "Learning requires no certainty; inputs are non-dogmatic probabilities over \(\{E_i\}\), irreducible to higher-order certainties." | **Substantive:** CC demands an incorrigible foundation; KC denies incorrigibility exists. | **CC:** Exhibit a case where kinematics inputs *must* derive from non-certain antecedents. **KC:** Exhibit a case where certainty leads to regress (e.g., uncertain meta-credences). |  
  | "New probabilities \(P_{\text{new}}(E_i)\) *must* be explained by conditioning on a certain experience-proposition \(C\), with \(P_{\text{new}}(E_i) = P_{\text{old}}(E_i \mid C)\)." | "New probabilities \(P_{\text{new}}(E_i)\) are primitives—direct outputs of experience—needing no reduction." | **Substantive:** CC requires reduction for rationality; KC sees reduction as impossible/spurious. | **CC:** Derive \(P_{\text{new}}(E_i)\) from \(C\) in all cases. **KC:** Show agents assign \(P_{\text{new}}(E_i)\) without accessing \(C\). |  
  | "Evidence *is* propositional: updates are triggered by endorsing a statement (e.g., 'I see "1.234 V"')." | "Evidence is non-propositional; it is an experience that *directly* sets \(P_{\text{new}}(E_i)\)." | **Verbal (mostly):** "Evidence" means propositions for CC, but raw experience for KC. **Substantive edge:** KC denies propositions capture phenomenology. | Agree to use "evidence-input" for kinematics and "evidence-proposition" for conditioning. |  
  | "Rigidity always holds absent new error-model evidence (e.g., drift); if drift occurs, rigidity is preserved by conditioning on drift separately." | "Rigidity fails when experience (e.g., learning drift) alters \(P(H \mid E_i)\) mid-update; kinematics handles this without ad hoc steps." | **Substantive:** CC sees rigidity as robust; KC sees it as fragile. | **Both:** Test if drift changes \(P(H \mid E_i)\) without new *propositional* input (see Crux 2). |  
  | "For real agents, conditioning and kinematics yield identical results when evidence is properly described." | "Real agents face cases where kinematics is inapplicable to conditioning, and vice versa." | **Substantive:** CC asserts reducibility; KC denies it. | **CC:** Reduce kinematics to conditioning in a case of vague evidence. **KC:** Find an agent who cannot report certainties (see Crux 1). |  

  #### 3. Cruxes  
  **Crux 1: Can kinematics inputs be reduced to certainties?**  
  - **Case:** Bench voltmeter shows 1.234 V. Operator occasionally misreads digits (3↔8 in last place; known rate: 10%). True voltage \(V\) is the measurand. Operator feels unsure, assigning \(P_{\text{new}}(E_{1.234}) = 0.9\), \(P_{\text{new}}(E_{1.238}) = 0.1\).  
  - **CC Prediction:** Update reduces to conditioning on \(C =\) "I seem to see '1.234'". Likelihoods \(P_{\text{old}}(E_y \mid C)\) from error model yield identical \(P_{\text{new}}(E_i)\).  
  - **KC Prediction:** Operator assigns \(P_{\text{new}}(E_i)\) directly; no certainty in \(C\) (e.g., due to fleeting attention). Reduction fails.  
  - **Falsification:** If operator cannot articulate \(C\) without residual uncertainty (e.g., "Did I *really* see '1.234' or just guess?"), CC falsified. If \(C\) is certain and yields identical \(P_{\text{new}}(E_i)\), KC falsified.  
  - **Metaphysical Background:** Yes—turns on whether evidence is propositional.  

  **Crux 2: Does drift violate rigidity?**  
  - **Case:** Operator reads thermocouple as \(T = 25.0^\circ\text{C}\) (partition \(\{E_T\}\)). Before updating, colleague says, "The voltmeter drifted during calibration." This *changes* \(P_{\text{old}}(H \mid E_{25.0})\) for \(H =\) "True temp is 25.1°C".  
  - **CC Prediction:** Rigidity holds. First condition on drift-proposition \(D\), updating error model; *then* apply rigidity to \(\{E_T\}\) with new conditionals.  
  - **KC Prediction:** Rigidity for \(\{E_T\}\) is broken. Single kinematics update on partition \(\{E_T\} \times \{\text{drift}, \text{no-drift}\}\) required.  
  - **Falsification:** If \(P_{\text{old}}(H \mid E_{25.0})\) changes *without* new certain input (e.g., vague unease about drift), CC falsified. If conditioning on \(D\) restores rigidity, KC falsified.  

  **Crux 3: Does order dependence favor conditioning?**  
  - **Case:** Two voltmeter readings under drift: First (\(R_1 = 1.234\) V), then (\(R_2 = 1.235\) V). Partitions: \(\{E_{R_1}\}\), \(\{E_{R_2}\}\). Absorb \(R_1\) then \(R_2\) (Order A), or \(R_2\) then \(R_1\) (Order B).  
  - **CC Prediction:** Order dependence is artificial. Conditioning on total evidence \(C_1 \land C_2\) (e.g., "I saw '1.234' then '1.235'") makes order irrelevant.  
  - **KC Prediction:** Order matters: Updating on \(R_1\) first alters error model for \(R_2\) (e.g., via drift estimation), changing \(P(H \mid E_{R_2})\).  
  - **Falsification:** If Order A ≠ Order B *and* no conjunction \(C_1 \land C_2\) is certain (e.g., memory fades), CC falsified. If orders converge when conditioning on \(C_1 \land C_2\), KC falsified.  
  - **Metaphysical Background:** Yes—hinges on whether evidence is propositionally conjoinable.  

  #### 4. Case: Order Dependence in Measurement Chain  
  - **Setup:**  
    - Voltmeter (4.5 digits) reads thermocouple output. True voltage \(V\) unknown.  
    - Operator error: 10% chance of misreading last digit (3↔8).  
    - Ambient drift: Slow voltage shift; captured in calibration certificate (expanded uncertainty: ±0.005 V).  
    - Two readings: \(R_1 = 1.234\) V (taken at time \(t_1\)), \(R_2 = 1.235\) V (taken at \(t_2 > t_1\), after drift warning).  
  - **Partition:** For update: \(\{E_{1.234}, E_{1.238}\} \times \{E_{1.235}, E_{1.238}\}\) (cells are possible readings).  
  - **Order A:** Update on \(R_1\) first (set \(P_{\text{new}}(E_{1.234}) = 0.9\)), then on \(R_2\) (set \(P_{\text{new}}(E_{1.235}) = 0.9\)). Drift warning after \(R_1\) alters conditionals for \(R_2\).  
  - **Order B:** Reverse. Drift warning before \(R_2\) alters \(R_2\)'s conditionals, but \(R_1\) uses pre-drift model.  
  - **Outcome:** \(P_{\text{final}}(V > 1.236)\) differs between orders. KC affirms this reflects real agent constraints; CC attributes it to incomplete evidence capture.  

