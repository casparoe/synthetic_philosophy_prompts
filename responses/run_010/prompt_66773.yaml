prompt: |-
  For eleven years I have sat on the panel that awards our trust's bursaries: about forty a year from roughly twelve hundred applications, decided by six volunteers with no training in economics and ten minutes per file. We rank applicants on parental household income, and I have become convinced this measures the wrong thing. Much of what a family hands on never appears in a death or in an income figure — a deposit on a flat, school and university fees, rent covered during an unpaid internship, a car, a business introduced rather than bequeathed. My own way of putting it, which may be crude, is that advantage should be counted in capital-years: the sum handed over multiplied by the number of years the recipient has had the use of it. On that measure a £100,000 deposit given at twenty-two has done far more work by the time someone is sixty than the same £100,000 arriving when a parent dies at eighty-five, which is nevertheless the transfer most of the debate about taxing estates is focused on. (I know a gift made within seven years of death can still be caught, but the money that matters is usually spent decades earlier.)

  Please turn this into a procedure my panel could actually run: the questions to ask of each file in order, what counts as a sufficient answer to each, how to estimate capital-years from what an applicant can honestly report without demanding intrusive documentation, and where the procedure must stop and hand the case to a human being because what remains is a question of values. Flag every step that is a judgement call dressed up as a rule. Then apply it to three files of your own construction, including one where it recommends a candidate the panel will resist, and one where a parent gave up their earnings to care for a disabled child, so that no money moved but a great deal was handed on. Say plainly what the procedure cannot do, and whether ranking people by what their families gave them is coherent in a scheme whose whole point is to help those who received least. No references or reading list — I want the reasoning, not the names. Please write in British English.
reasoning: |-
  Hmm, the user is describing their experience on a bursary panel that awards grants based on parental income. They've become convinced this approach is flawed because it misses non-monetary advantages like gifts, deposits, or unpaid rent support. They propose "capital-years" - valuing advantages by the amount multiplied by years held.

  The user needs a practical procedure for their panel to implement this. They want step-by-step questions, clear thresholds for answers, estimation methods without intrusive documentation, and guidance on when human judgment is needed. They also want me to flag any steps that seem objective but are actually subjective judgments.

  They've asked for three example applications: one that challenges the panel's biases, one involving non-financial caregiving, and presumably a standard case. I need to explicitly state the limitations of this approach and address whether assessing family advantages conflicts with the bursary's mission to help those who received least.

  This requires creating a structured yet adaptable system. The procedure must be administratively feasible (10 minutes per file) while capturing complex intergenerational advantages. Key challenges include:
  - Quantifying non-cash advantages
  - Avoiding overly intrusive questions
  - Balancing objectivity with necessary judgment
  - Reconciling privilege assessment with equity goals

  The capital-years metric is clever but has inherent limitations - it can't measure things like social networks or emotional support, and may still undercount advantages where no money changed hands. The caregiver example will be particularly tricky to value fairly.

  For implementation, I'll design a phased questionnaire with clear stopping rules. The three cases will illustrate: 
  1) A candidate with early-life capital injections that boost compounding (likely resisted by panel)
  2) The caregiver scenario showing non-financial advantage
  3) A standard case for contrast

  British terminology and spelling will be used throughout. The conclusion should frankly address whether this approach aligns with the trust's goals - particularly the tension between helping the disadvantaged versus those who received least family advantage, which aren't always the same thing.
answer: |-
  Here’s a practical procedure for implementing "capital-years" assessment, designed for your panel’s constraints (10 mins/file, no economics training). It prioritises estimable proxies over precision, flags judgment calls, and defines handover points to human discretion.

  **Procedure: Capital-Years Assessment**

  1.  **Question 1: Parental Support for Major Assets (Pre-22)**
      *   *Question:* "Before you turned 22, did your parents (or legal guardians) provide significant financial support towards any of these: university fees, rent deposits, car purchase, business start-up capital, or similar major assets? If yes, please estimate the total value (£) of *all* such support received before age 22."
      *   *Sufficient Answer:* A single £ figure (e.g., "£15k for uni deposit", "£5k for car"). Accept estimates rounded to nearest £1k. No documentation required unless figure seems wildly inconsistent with context (e.g., "£100k" from low-income household – flag for human review).
      *   *Calculation:* Multiply the figure by (Current Age - 22). *(Example: £20k support at 18, applicant now 30: 20,000 * (30-22) = 160,000 capital-years)*.
      *   *Judgement Call Flag:* Defining "significant" is subjective. Is £1k for a scooter "significant"? The £1k threshold is arbitrary. Panel must accept the applicant's self-assessment unless implausible.

  2.  **Question 2: Sustained Subsidised Living (Post-18)**
      *   *Question:* "After you turned 18, for periods longer than 6 months, did you live with parents/guardians paying significantly below market rent, *or* live elsewhere (e.g., uni) while they covered your rent/mortgage? If yes, estimate the total *savings* you made compared to typical local rent/mortgage payments during those periods."
      *   *Sufficient Answer:* A single £ figure representing total estimated savings (e.g., "Saved £300/month for 3 years at uni = £10,800"). Accept reasonable estimates based on local knowledge (e.g., "Rent would be £800pm, paid £200pm, saved £600pm for 2 years = £14,400").
      *   *Calculation:* Multiply the savings figure by (Current Age - Midpoint Age of Subsidy Period). *(Estimate midpoint: e.g., subsidy aged 19-21, midpoint = 20. Applicant now 28: 14,400 * (28-20) = 115,200 capital-years).*
      *   *Judgement Call Flag:* Estimating "typical" local rent/mortgage and "significant" discount is subjective. The method for calculating the midpoint age is a simplifying assumption masking complexity.

  3.  **Question 3: Major Gifts/Support (Post-22)**
      *   *Question:* "Since turning 22, have you received any single gift, loan (not requiring repayment), or substantial financial support (e.g., covering major medical bills, large wedding contribution, bailout from debt) from parents/guardians exceeding £5,000? If yes, state the amount(s) and the age you received each."
      *   *Sufficient Answer:* List of amounts and ages (e.g., "£10k gift at 25 for wedding", "£8k help with medical bills at 30"). Focus on large, discrete sums.
      *   *Calculation:* For each item: Amount * (Current Age - Age at Receipt). Sum these. *(e.g., £10k* (30-25)=50,000; £8k*(30-30)=0; Total = 50,000 capital-years).*
      *   *Judgement Call Flag:* The £5k threshold is arbitrary. Defining "substantial" support is subjective.

  4.  **Question 4: Non-Financial Capital Proxy (Care)**
      *   *Question:* "Did a parent/guardian significantly reduce their paid work (by 50%+ time for 1+ year) to provide essential, unpaid care for you (due to disability/chronic illness) during your childhood/young adulthood (under 25)? If yes, estimate their approximate annual pre-tax income *before* they reduced work."
      *   *Sufficient Answer:* "Yes" plus an estimated annual income figure (e.g., "Yes, Mum earned ~£25k before caring").
      *   *Calculation:* Multiply estimated annual income by (Current Age - Age Care Started). *Use Age Care Started = Applicant's Age when care began. (e.g., Care from age 10-18, applicant now 28. Income £25k. Capital-Years = 25,000 * (28 - 10) = 450,000).* **STOP - HANDOVER TO HUMAN.** This figure is highly speculative (lost earnings ≠ direct capital transfer; value of care is complex). It flags significant non-financial advantage but cannot be fairly integrated numerically. Human judgement must decide its weighting relative to financial capital-years.

  5.  **Question 5: Inheritances/Expected Wealth (Post-Parental Death)**
      *   *Question:* "Have you already received, or do you reasonably expect to receive in future, an inheritance (cash, property, assets) from parents/guardians exceeding £50,000? If yes, state the amount (received or estimated) and the age you received/will likely receive it."
      *   *Sufficient Answer:* Amount and age (e.g., "£25k received at 40", "Expect ~£150k property around age 60").
      *   *Calculation:* For received: Amount * (Current Age - Age Received). For expected: Amount * (Expected Age - Current Age). *But ONLY if Expected Age <= 85. If Expected Age >85, value as ZERO.* Sum these. *(e.g., £25k* (45-40)=125,000; £150k*(60-45)=2,250,000; Total=2,375,000 capital-years).*
      *   *Judgement Call Flag:* The £50k threshold. Estimating "reasonable expectation" and future value/age is highly subjective and speculative. Valuing future inheritance *at all* before receipt, especially decades early, is a major judgement. The 85-year cutoff is arbitrary but crucial to focus on *early* advantage. **HANDOVER TO HUMAN if inheritance expectation is complex/contested or expected age is very uncertain.**

  **Total Capital-Years:** Sum the results from Steps 1, 2, 3, and 5 (if calculated). Step 4 provides context but isn't summed. **Rank applicants by LOWEST total capital-years.** The core idea is capturing *early* advantage compounding over time.

  **Where Procedure Stops for Human Judgement:**
  *   Implausible figures (Step 1,2,3).
  *   **Always** for Step 4 (Parental Care Sacrifice). Humans must assess the significance and how it interacts with financial disadvantage.
  *   Complex/contested inheritance expectations (Step 5).
  *   Any case where the applicant highlights exceptional circumstances not captured by the questions (e.g., trust fund access, complex business transfers hinted at but not quantified).
  *   **Final Ranking Adjustment:** After calculating capital-years totals, the panel *must* use human judgement to review the ranking. Does it feel ethically right? Does it align with the trust's mission? Adjustments based on *current* hardship, applicant's own achievements despite advantage, or the *nature* of advantage (e.g., care vs. cash) may be necessary. **This is the ultimate values judgement.**

  **What the Procedure Cannot Do:**
  1.  **Capture All Privilege:** Social networks, cultural capital (e.g., knowing how to navigate institutions), elite schooling's non-financial benefits, parental connections securing jobs/internships, subtle confidence/expectations instilled. These remain invisible.
  2.  **Perfect Quantification:** Estimates are rough proxies. The value of care (Step 4) is especially unquantifiable. Future inheritance valuation is speculative.
  3.  **Distinguish Motive/Impact:** £100k for lifesaving surgery vs. £100k for a luxury gap year look identical. Human judgement is needed for context.
  4.  **Address Current Need Directly:** Someone with high capital-years (e.g., large inheritance expected at 85) might be desperately poor *now*. The procedure focuses on lifetime advantage, not current income poverty.
  5.  **Be Fully Non-Intrusive:** While avoiding demands for bank statements, asking about family wealth, inheritances, and parental sacrifices *is* personal. Applicants might under-report due to privacy or misunderstanding.

  **Coherence Question: Ranking by "Least Given" vs. Helping "Those Who Received Least"**
  This is the core tension. *Is the scheme's point to help those who received the least family advantage? Or those who are currently most disadvantaged?* They are not the same.
  *   **If the goal is mitigating *intergenerational* disadvantage:** Capital-years directly targets this. It identifies those who started with the *least compounded familial head start*. Ranking by low capital-years is coherent. It helps those who truly had to build everything themselves.
  *   **If the goal is alleviating *current* hardship/poverty:** Capital-years is flawed. Someone with high capital-years (e.g., large future inheritance) but low *current* income might be more deserving *now* than someone with low capital-years but a stable middle-income job. Parental care (Step 4) might create current financial disadvantage despite significant past non-financial advantage.
  *   **The Procedure's Stance:** It inherently prioritises the *intergenerational* definition of "received least." It assumes that early advantage compounds into lifetime opportunity, even if current circumstances vary. The final human judgement step allows moderating this for extreme current need.

  ---

  **Example Applications:**

  **Case 1: "The Resisted Candidate" - Eleanor (Age 28)**
  *   **Q1:** "Parents paid £50k university fees (age 18)." *Calc:* 50,000 * (28-22) = 300,000 CY.
  *   **Q2:** "Lived at home during uni (ages 18-21), saved £600pm rent (£21,600 total)." *Calc:* Midpoint age 19.5. 21,600 * (28-19.5) ≈ 21,600 * 8.5 = 183,600 CY.
  *   **Q3:** "£20k gift for flat deposit at 25." *Calc:* 20,000 * (28-25) = 60,000 CY.
  *   **Q4:** "No."
  *   **Q5:** "Expect £300k inheritance around 60." *Calc:* 300,000 * (60-28) = 9,600,000 CY. *(Total CY: 300k + 183.6k + 60k + 9,600k = 10,143,600)*.
  *   **Panel Resistance:** Eleanor has very high capital-years (£10m+) due to large early support and huge expected inheritance. She *currently* earns £24k in the charity sector and lives modestly. Her application is compelling – she wants funding for a Masters to boost her impact. The panel will resist ranking her highly for support because she "comes from money," despite her current modest means and laudable goals. The procedure flags her immense *lifetime* family advantage. **Human Judgement Needed:** Panel must decide if her *current* situation and potential impact outweigh her immense familial safety net.

  **Case 2: "The Caregiver Sacrifice" - Ben (Age 25)**
  *   **Q1:** "No significant support pre-22." *Calc:* 0 CY.
  *   **Q2:** "Lived at home until 22 paying nominal rent. Saved approx £500pm vs local rent (£26,400 total)." *Calc:* Midpoint age 20. 26,400 * (25-20) = 132,000 CY.
  *   **Q3:** "No." *Calc:* 0 CY.
  *   **Q4:** "Yes. Mum stopped work (earned ~£30k) when I was 10 due to my disability. Full-time care until I was 18." *HANDOVER TO HUMAN.* Estimated CY = 30,000 * (25-10) = 450,000 CY (but not summed).
  *   **Q5:** "No expectation of significant inheritance." *Calc:* 0 CY. *(Total Calculated CY: 132,000)*.
  *   **Analysis:** Ben's calculated CY (£132k) is moderate (mostly subsidised living). However, Step 4 reveals massive non-financial advantage: his mother sacrificed ~£240k in earnings (8 years * £30k) plus career progression to provide essential care. This care was invaluable, enabling his development and current studies. **Human Judgement Crucial:** The panel sees Ben's current low income (supported by benefits) and his disability. They must weigh the huge *advantage* of the dedicated care (without which his prospects would be far worse) against the *financial disadvantage* it caused his family (and thus him). Does this represent high capital transfer (in kind) or compound disadvantage? Values dominate.

  **Case 3: "Standard Case - Low Advantage" - Chloe (Age 32)**
  *   **Q1:** "Parents contributed £3k towards used car at 20." *Calc:* 3,000 * (32-22) = 30,000 CY.
  *   **Q2:** "Lived at home 18-20 while at college, saved £400pm (£9,600). Moved out at 20." *Calc:* Midpoint age 19. 9,600 * (32-19) = 9,600 * 13 = 124,800 CY.
  *   **Q3:** "£4k help with emergency car repair at 28." *Below £5k threshold, ignore.* 0 CY.
  *   **Q4:** "No." 0 CY.
  *   **Q5:** "Parents have modest savings, might get £20k-£30k someday, probably after 85." *Expected Age >85, value as 0 CY.* *(Total CY: 30,000 + 124,800 = 154,800)*.
  *   **Analysis:** Chloe received modest but typical parental support (car, subsidised rent for 2 years). No large gifts, no inheritance expectation within the timeframe, no complex care sacrifice. Total CY (£155k) is relatively low. Her current income is also modest. She represents the "low family advantage" candidate the procedure is designed to identify and rank highly for support.

  This procedure offers a structured, time-efficient way to move beyond simple income, focusing on the *timing* and *scale* of familial transfers to better approximate lifetime head start. Its limitations necessitate clear handover points to human values, and the panel must continually reflect on whether ranking by "least family advantage given" aligns with their core mission of alleviating disadvantage.
