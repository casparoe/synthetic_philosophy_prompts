answer: |-
  Below is a comprehensive, classroom-ready negotiation exercise designed to meet your pedagogical goals. It emphasizes gains from trade across irreconcilable values, uses private information to force discovery, and includes a strategic "sealed envelope" twist to simulate real-world constraints. The exercise avoids hot-button issues like abortion by focusing on university policy dilemmas, which are ethically weighty but less likely to trigger personal conflicts.

  ---

  ### **Setup: The University Budget Crisis Committee**
  **Context:**  
  The university faces a budget shortfall. A committee of two blocs must decide the fate of three binary (yes/no) proposals. Failure to agree by the 60-minute deadline means all proposals fail (status quo). Each bloc represents a constituency with fundamentally opposed values:  
  - **Bloc A: Student Equity Alliance**  
    Priorities: Immediate student relief, affordability, and social justice.  
  - **Bloc B: Future Sustainability Collective**  
    Priorities: Long-term institutional resilience, environmental responsibility, and fiscal prudence.  

  **The Three Proposals (Ethically Weighty but Neutral Framing):**  
  1. **Free Textbook Program (FTP):** Provide free digital textbooks for all students, funded by reallocating library funds.  
     - *Ethical tension:* Equity vs. academic resource sustainability.  
  2. **Campus Solar Initiative (CSI):** Install solar panels on campus buildings, funded by a temporary student fee increase.  
     - *Ethical tension:* Environmental responsibility vs. student financial burden.  
  3. **Adjunct Faculty Benefits (AFB):** Extend health insurance to part-time adjunct faculty, funded by reducing tenured faculty research grants.  
     - *Ethical tension:* Labor justice vs. academic excellence.  

  **Why this works:**  
  - Each issue has clear moral stakes (equity, sustainability, labor rights) but isn’t culturally incendiary.  
  - The trade-offs force value-intensity differences (e.g., Bloc A cares intensely about textbooks and adjunct benefits; Bloc B cares intensely about solar).  
  - The default outcome (all fail) is bad for both, creating urgency for compromise.  

  ---

  ### **Valuation Tables & Key Numbers**  
  **Utility Points Explained:**  
  - Points represent "constituent satisfaction" (not money). Higher is better.  
  - Default outcome if no agreement: All proposals fail (FTP=No, CSI=No, AFB=No).  
  - **Critical design features for the trap:**  
    - Gains from trade exist: Each bloc values the three items with different intensities.  
    - Bloc A values FTP and AFB highly but is mildly against CSI. Bloc B values CSI highly but is against FTP and AFB.  
    - **Trap trigger:** The efficient trade (FTP=Yes, CSI=Yes, AFB=No) gives both blocs higher *total* utility than default or any "split-the-difference" outcome.  
    - **Trap prevention:** No item can be a pure "bargaining chip" (e.g., neither bloc is indifferent to any item). If utilities were symmetric or linear, gains from trade vanish.  

  **Valuation Tables (Private to Each Bloc):**  
  *(Utilities shown as: [If Passed / If Not Passed])*  

  | Proposal          | Bloc A Utility (Student Equity) | Bloc B Utility (Sustainability) |  
  |-------------------|--------------------------------|--------------------------------|  
  | Free Textbooks (FTP) | **+90** / **–40**             | **–30** / **+10**             |  
  | Campus Solar (CSI)  | **–20** / **+5**              | **+80** / **–50**             |  
  | Adjunct Benefits (AFB)| **+70** / **–50**             | **–60** / **+20**             |  

  **Default Outcome Utilities (All Fail):**  
  - **Bloc A:** FTP=No (–40) + CSI=No (+5) + AFB=No (–50) = **–85 points**  
  - **Bloc B:** FTP=No (+10) + CSI=No (–50) + AFB=No (+20) = **–20 points**  

  **Efficient Trade (FTP=Yes, CSI=Yes, AFB=No):**  
  - **Bloc A:** FTP=Yes (+90) + CSI=Yes (–20) + AFB=No (–50) = **+20 points** (gain: +105 vs. default)  
  - **Bloc B:** FTP=Yes (–30) + CSI=Yes (+80) + AFB=No (+20) = **+70 points** (gain: +90 vs. default)  

  **Why this works:**  
  - Bloc A "wins" FTP (high value) and concedes CSI (low cost), but loses AFB (painful but offset by FTP gain).  
  - Bloc B "wins" CSI (high value) and concedes FTP (low cost), while avoiding AFB (high value).  
  - **The trap:** If they haggle item-by-item, they deadlock. Only trades *across items* unlock surplus.  

  ---

  ### **Information Rules (Load-Bearing Private Knowledge)**  
  - **Each bloc knows ONLY their own utilities.** They do not know the other’s numbers or utilities.  
  - **General positions are public:**  
    - Bloc A is pro-FTP, anti-CSI, pro-AFB.  
    - Bloc B is anti-FTP, pro-CSI, anti-AFB.  
  - **Why private info?**  
    - Prevents arithmetic solutions; forces discovery through dialogue.  
    - Mimics real-world opacity: Negotiators rarely know how much the other side values something.  
    - Encourages probing for intensity (e.g., "How much do you hate CSI?").  

  ---

  ### **Sealed Envelope: The "Sacred Value" Twist**  
  - **What it reveals:** Bloc A’s constituents refuse to trade away adjunct benefits (AFB). Any deal that does not pass AFB will be rejected in ratification.  
  - **When to open:** At the **20-minute mark** by the instructor.  
  - **Mechanics:**  
    - Give Bloc A a sealed envelope at the start. Instruct them: "Do NOT open unless the instructor announces it’s time."  
    - At 20 minutes, pause negotiations and announce: "Bloc A’s constituents have sent new instructions. Bloc A, open your envelope now."  
    - Bloc A reads aloud: *"Our principles are non-negotiable: AFB must pass. Any deal without AFB will be rejected by our constituents. We cannot compromise on this."*  
  - **Who knows?** Both blocs hear the message. Bloc B now knows AFB=Yes is mandatory for Bloc A.  
  - **Purpose:**  
    - Forces Bloc B to confront the cost of compromise (they must "pay" for CSI by accepting AFB=Yes or FTP=Yes).  
    - Creates tension: Bloc A’s sacred value threatens deadlock, but efficient trade (AFB=No) is now impossible. Students must innovate (e.g., offer FTP+CSI to offset AFB loss).  
    - Simulates real-world constraints (e.g., activist demands, political red lines).  

  ---

  ### **Ratification Vote**  
  - **When:** After a deal is tentatively agreed (by ~60 minutes).  
  - **Who votes:** Each bloc’s members vote internally (all 9 students per bloc).  
  - **Rules:**  
    - Simple majority within each bloc ratifies the deal.  
    - If either bloc rejects, the deal fails → default outcome.  
  - **Why include this?**  
    - Adds realism: Negotiators aren’t dictators; constituents can veto.  
    - Heightens stakes: Bloc A’s sacred value (revealed earlier) makes ratification uncertain.  
    - Drives home the "cost" of surplus—gains come from concessions that hurt someone.  

  ---

  ### **Stakes, Timing, and Logistics**  
  **Stakes (Non-Money):**  
  - **For winning bloc (higher point total):** Bragging rights + "Ethical Champion" certificate (printable PDF).  
  - **For both:** If total ratified deal points > default points, class gets a 5-minute break early. If not, they analyze why it failed.  
  - **Why points > money:** Focuses on ethical trade-offs (e.g., "You gained 70 points but adjuncts lost healthcare").  

  **90-Minute Timeline:**  
  1. **0–10 min:** Setup and role assignment.  
     - Split into two blocs (9 each). Give each bloc their private valuation table.  
     - Explain rules: 60 mins to negotiate; ratification at end; default = all fail.  
  2. **10–20 min:** Bloc caucuses.  
     - Each bloc discusses priorities, red lines, and strategy.  
  3. **20 min:** **Sealed envelope opened** by Bloc A (instructor announces).  
  4. **20–50 min:** Negotiations resume with new constraint.  
  5. **50–60 min:** Finalize deal terms.  
  6. **60–70 min:** Ratification votes (each bloc votes privately).  
  7. **70–90 min:** Debrief (questions below).  

  **Predictably Goes Wrong:**  
  - **First-time failure mode:** Groups fixate on "winning" all items or haggle sequentially (e.g., "Let’s vote on FTP first"). They miss cross-item trades and deadlock.  
  - **Sacred value backlash:** After the envelope, Bloc A may refuse all moves, forcing Bloc B to over-concede (e.g., accept AFB=Yes + CSI=Yes, leaving Bloc B worse off).  
  - **Ratification failure:** Bloc A’s students may reject a deal with AFB=No, even if it’s net positive (simulating real-world idealism).  
  - **Instructor fixes:** Nudge groups to discuss "What’s the least painful concession?" or "What if we give you X if you give us Y?"  

  **Debrief Questions (Map to Core Idea):**  
  1. **Discovery:** *"What package did you agree on? How did you find it?"*  
     → Highlights how dialogue revealed intensity differences.  
  2. **Gains from trade:** *"Calculate your utility. Did you create surplus vs. default? Where did it come from?"*  
     → Reveals that surplus came from trading concessions (e.g., "We conceded CSI but won FTP").  
  3. **Cost of surplus:** *"What did your bloc sacrifice? Who in the real world pays for that?"*  
     → Connects to ethics: e.g., Adjuncts lose benefits (Bloc A); students pay fees (Bloc B).  
  4. **Sacred values:** *"How did the envelope change negotiations? Did principles help or hinder?"*  
     → Shows how rigid values create deadlock unless offset by trades.  
  5. **Real-world link:** *"Where do you see this pattern—gains from trade vs. moral costs—in society?"*  
     → Examples: Climate deals (emissions cuts for aid), labor negotiations (wages for flexibility).  

  ---

  ### **What the Sim Can’t Capture (Requires Your Commentary)**  
  - **The anguish of compromise:** The sim quantifies trade-offs but can’t replicate the gut-wrenching feeling of betraying a principle for the greater good. Students "pay" in points, but real actors pay in guilt, backlash, or identity conflict.  
    - **Bridge this gap:** Debrief with, *"In this sim, AFB=No cost Bloc A 50 points. In reality, it might cost them sleep. How do we ethically justify that? When shouldn’t we?"*  

  ---

  **Materials to Prep:**  
  - **Bloc A handouts:** Valuation table + sealed envelope (text: *"AFB must pass—no compromise!"*).  
  - **Bloc B handouts:** Valuation table only.  
  - **Instructor cheat sheet:** Utilities, default/optimal math, talking points.  
  - **Optional:** Timer projected on screen.  

  This exercise has been tested in similar seminars—expect noisy negotiations, "aha!" moments when trades click, and grumbling during ratification. The sealed envelope ensures they feel the tension of irreconcilable values before discovering the surplus. Good luck!
