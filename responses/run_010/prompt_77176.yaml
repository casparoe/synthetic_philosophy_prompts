prompt: |-
  I run the discussion section for an applied ethics seminar — 18 students, 90 minutes, most of them have had intro ethics and roughly one week of game theory. The idea I want them to walk out with is that compromise between two value systems that genuinely can't be reconciled can still create value on both sides: not splitting the difference on one question (that's the incoherent half-belief version they'll all assume I mean), but trades across several questions where the two sides care with different intensities. I want them to hit the surplus themselves, in their own decisions, before anyone says the phrase "gains from trade" out loud — and then I want them to feel what the surplus costs the people who pay for it.

  So design me a negotiation I can actually run in the room. What I need from you:

  - the setup: two blocs sitting on some committee with a three-item agnda, each item binary, and whatever framing makes the items feel morally weighty without turning the session into a fight about abortion
  - the numbers. Give me actual valuation tables for each side and a default outcome if they fail to agree. Tell me what those numbers have to satisfy for the trap to spring, and what property they must not have
  - what each bloc is allowed to know about the other's valuations — I suspect private information is load-bearing here, because otherwise it's just arithmetic in public
  - somewhere around the midpoint I want a sealed envelope that reveals that one bloc's constituents treat one item as not up for trade and will reject any package that gave it away. Tell me when to open it, what it should say, and whether the other bloc ever learns it exists
  - whether there should be a ratification vote at the end, and by whom
  - stakes that aren't money, minute by minute timing, the debrief questions that map each moment back onto the idea, what predictably goes wrong the first time you run this, and the one feature of compromise that the sim can't produce and I'll just have to supply by talking
