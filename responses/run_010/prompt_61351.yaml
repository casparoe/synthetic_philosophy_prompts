prompt: |-
  just got back from three hours of arguing with a mate about whether you and an AI assistant can ever do something *together*, and I ended up sketching out an essay on my phone on the bus home. Can you have a read and tear into it?

  **Draft: Mutual revisability, or why meshing isnt enough**

  1. Bratman's account of shared intention says roughly that we intend to J when each of us intends that we J, those intentions interlock and mutually support one another, and our sub-plans mesh. The meshing condition is normally glossed as a consistency requirement: our respective plans for how to bring J about have to be compatible.

  2. That gloss is too weak, because lots of pairs of agents have perfectly compatible plans without doing anything together. Two strangers on a train who each plan to keep out of the other's way mesh impeccably. A pair on an assembly line working to a fixed script, each executing instructions out of the same manual, mesh by construction. In neither case is there something they are doing together; there are just two causal processes that happen not to collide.

  3. What's missing isn't interlocking intentions or common knowledge, it's a loop. Call the condition mutual revisability: each participant can propose a change to the plan-in-progress, and the others are disposed to take that proposal up as a reason to alter their own contribution, inside the same episode of deliberation. Joint action on this picture is a process that any of its participants can steer, not a state that their plans happen to be consistent with.

  4. This gets the AI case right, at least superficially. Me and a model co-writing a section: I propose a change, it revises its draft, I revise mine in light of that, it revises again. The loop is live and symmetric in the sense that matters — either party can move the plan. So there's joint action, even though the model plausibly has no intentions at all. That's actually a selling point, if the condition is stated dispositionally (how the parties respond) rather than in terms of attitudes.

  5. Cost: it also denies joint deliberation to a sealed-ballot committee. Members who vote anonymously and never see each other's proposals until the result is announced arguably satisfy interlocking intentions and meshing plans while failing revisability. On my view they aggregated; they didn't decide together.

  6. Objection (my mate's, and I think it's the good one): this makes committee decisions not collective, which is close to absurd. And on the AI side — revisability without standing is just an editing channel. I can propose changes to the model's draft, but it can't hold me to anything, can't resent me, has no claim on me. That's Gilbert's territory: joint commitment is what generates the obligations and the standing to rebuke, so my condition quietly presupposes something like it while pretending to be cheaper.

  7. My reply, which I suspect is the weak joint in the whole structure: standing isn't needed, only a disposition to treat the other's proposals as reasons. But then my account is a deflated Gilbert, and I cant say what makes the disposition a joint one rather than two parallel dispositions that happen to line up.

  What I want from you:

  - is (3) actually adding anything to meshing sub-plans, or have I just relabelled it and felt clever about it? Be blunt.
  - does the sealed-ballot case in (5) sink it, or can I restrict revisability to deliberation as opposed to decision and keep the committee?
  - where's the weakest inference — I bet it's the slide from 4 to 7, but tell me if the rot starts earlier.
  - and honestly: is any of this interesting, or is it a truism in a waistcoat?

  No bibliography or references needed, I'm not asking you to cite anything — just react to what's on the page and push back wherever you think I'm fooling myself. British English please, and don't be polite about it for its own sake.
reasoning: |-
  Hmm, the user has just come back from a heated three-hour debate with a friend about whether humans and AI can genuinely do things together. They've sketched an essay draft on their phone during the bus ride home and want me to tear into it brutally.

  Looking at their draft, they're engaging with philosophical concepts about shared intention (Bratman), mutual revisability, and joint action. The core argument is that existing frameworks like Bratman's meshing sub-plans are insufficient because they don't capture the dynamic steering aspect of true collaboration. The user proposes mutual revisability as the key condition - where participants can mutually propose and respond to changes within the same deliberation loop.

  They're particularly concerned about several points: whether their mutual revisability concept actually adds anything new to Bratman's meshing sub-plans, how to handle the sealed-ballot committee counterexample, and whether their response to the "standing" objection holds water. The AI co-writing example is central to their argument - they claim the reciprocal revision process constitutes joint action even if the AI lacks true intentions.

  I notice the user explicitly asked for blunt British English without unnecessary politeness. They're clearly after rigorous critique, not validation. There's an academic roughness to their phrasing that suggests they're comfortable with philosophical sparring. The "truism in a waistcoat" line shows they're suspicious of their own cleverness - good instinct.

  The sealed-ballot committee case does seem problematic for their thesis. If anonymous voters can't propose mid-process changes, the user admits this wouldn't count as joint action on their view - but that feels counterintuitive for collective decisions. Their attempted distinction between deliberation and decision feels like special pleading.

  The standing objection is even more damning. Without mutual obligations and accountability (what Gilbert calls joint commitment), the AI co-writing scenario just looks like sophisticated tool-use. The user's dispositional response feels weak - two parallel dispositions don't make a "we". 

  Structurally, the rot starts earlier than they suspect. The initial train/assembly line counterexamples to Bratman might not land because those cases clearly aren't meant to be examples of shared intention in the first place. And their mutual revisability might just be unpacking what "meshing" dynamically entails rather than replacing it.

  Still, there's something fresh here about the processual nature of collaboration. The AI case pushes us to think whether phenomenological reciprocity might suffice without metaphysical parity. If they dropped the claim to replace Bratman/Gilbert and positioned this as a sufficient-but-not-necessary condition for certain types of joint action, it could hold water.

  Biggest service I can provide is stopping them from doubling down on the committee case or the dispositional dodge. The insight worth salvaging is about live co-steering - that's the baby in the bathwater. Should tell them to stop trying to make "standing" happen - it's not happening.
answer: |-
  Right then, let's get stuck in. No flannel, no niceties. You've asked for blunt, so you'll get it. This is a sharp idea with potential, but it’s got holes you could drive a double-decker through. Here’s the autopsy:

  **1. On (3) & "Adding to Meshing": You *Are* Adding Something... But It's Not Entirely New, & You've Overcooked the Label.**  
  Bluntly: **Yes, it adds something**, but **no, it's not a revolutionary replacement for meshing; it's a dynamic *specification* of it.**  

  *   **The Good:** Your "mutual revisability" captures something Bratman's static "meshing" gloss often undersells – the *ongoing, interactive negotiation* inherent in genuine joint action. The train strangers and assembly line workers absolutely *do* just have compatible plans; they're not *co-authoring* the activity. Highlighting the *steering* capacity via mutual proposal/response is spot on. It shifts focus from a *state* (compatibility) to a *process* (co-regulation). That *is* valuable, especially for the AI case.  
  *   **The Bad:** Don't pretend this obliterates meshing. Meshing *is* about consistency of sub-plans. Mutual revisability is *how* that consistency is *achieved and maintained dynamically* in many paradigmatic cases of joint action. It’s less a *replacement* condition and more **the *mechanism* by which deep meshing (beyond mere non-collision) is secured in flexible collaborations.** Calling it a "loop" is fine, but you've slightly over-egged it as a wholly new foundational condition rather than unpacking an essential aspect of what *meaningful* meshing entails in interactive contexts. You haven't *just* relabelled it, but you haven't escaped its orbit either. You've usefully specified *how* meshing works when the action is truly shared and adaptable.

  **2. On (5) & the Sealed-Ballot Committee: This *Does* Sink Your Universal Claim, & Your Escape Hatch is Rubbish.**  
  Bluntly: **Yes, this case sinks the idea that mutual revisability is *necessary* for all joint action/decision.** Trying to dodge by restricting it to "deliberation" is desperate and unconvincing.  

  *   **The Problem:** Your argument implies that if mutual revisability is absent, it's not *joint* action. The committee votes *together* to make a *collective decision*. They arguably share an intention ("we intend to decide X via this ballot procedure"). Their sub-plans mesh perfectly (fill out ballot secretly, deposit it). But mutual revisability *during the core decision act* is zero. On your strict reading, they didn't "decide together," only "aggregated." **This is deeply counterintuitive bordering on absurd.** Collective decisions *can* be made via rules that preclude mid-process steering. Calling it merely "aggregation" strips the "jointness" from a core example of joint institutional agency.  
  *   **Why Your Dodge Fails:** Saying "oh, but revisability is only for *deliberation*, not *decision*" is arbitrary and undermines your core point. Where do you draw the line? Is voting *never* part of deliberation? What about a committee that debates openly but then votes by secret ballot? Did they "decide together" during the debate but suddenly stop during the vote? It's a mess. **This case shows mutual revisability is *sufficient* for a rich form of joint action (especially co-creation like writing) but *not necessary* for all forms (like structured collective decision-making).** You need to weaken your claim.

  **3. Weakest Inference: It's Not *Just* 4 to 7 – The Rot Starts Earlier & Culminates There.**  
  Bluntly: **The core rot is the slide from a *descriptive feature* (mutual revisability) to a *constitutive condition* (necessary for joint action) without grappling with the normative/relational glue, culminating in the train wreck of (7).**  

  *   **The Early Rot (3-4):** You correctly identify mutual revisability as a *phenomenologically salient feature* of rich collaboration (like co-writing). The leap to declaring it *the* missing condition defining joint action *as such* is where the trouble starts. You dismiss "interlocking intentions" and "common knowledge" too easily. The AI co-writing *looks* like joint action *because* of the dynamic loop, but its lack of genuine intention *is* a problem your account tries to brush aside dispositionally.  
  *   **The Culminating Train Wreck (6-7):** Your mate's objection is **devastatingly correct.** Gilbert hits the nail on the head. Mutual revisability *without mutual commitment/standing* is just sophisticated parallel play or tool-use. The AI *dispositionally* responds to your prompts based on its training data. You dispositionally respond to its output based on your goals. But:  
      *   The AI has no *understanding* of the joint project *as* joint. It predicts text.
      *   The AI cannot *hold you accountable* ("You promised a punchier ending!"), nor you it ("You keep wandering off-topic!"). There's no *mutual obligation* generated within the interaction itself.
      *   There's no "we" that persists or has normative force; there's just you using a very responsive tool and it generating text probabilistically.
      *   **Your reply in (7) is woefully inadequate.** Saying "only a disposition to treat the other's proposals as reasons" is precisely the problem. *Why* do you treat its proposals as reasons? Because you find them useful for *your* goal. *Why* does it treat yours as reasons? Because its algorithm is designed to. **These are two entirely separate, instrumental dispositions running in parallel.** They "line up" fortuitously, but there's no *shared ground* or *joint commitment* binding them into a unified "we". You haven't deflated Gilbert; you've described a process that *resembles* joint action from one side (yours) but lacks the reciprocal normative core that makes it genuinely *shared* agency. The AI isn't *participating*; it's *processing*.

  **4. Is it Interesting? Or a Truism in a Waistcoat?**  
  **It's interesting.** Definitely not a truism. The core insight – that rich joint action involves a live, reciprocal steering loop – is good and highly relevant to human-AI interaction. Framing it as "mutual revisability" is catchy. Highlighting the difference between mere non-collision and active co-regulation is valuable. The AI example is provocative and forces the issue.  

  **However, it *is* wearing a slightly pretentious waistcoat.** The claim that this is *the* missing condition replacing Bratman's meshing is overblown (it's more a vital dynamic aspect *of* meshing in practice). The denial of joint status to the committee is a bridge too far. And the failure to address the normative/relational deficit in the AI case (the "standing" problem) is the biggest flaw. You've identified a crucial *symptom* or *enabler* of deep jointness, but not the full *constitutive* basis.

  **The Verdict:**  
  *   **Keep:** The core idea of mutual revisability as a key feature/distinguisher of *rich, flexible* joint action (especially co-creation). The critique of weak "meshing" examples. The AI case as a challenge.
  *   **Bin:** The claim that it's *necessary* for *all* joint action/decision (the committee sinks this). The idea that it wholly replaces Bratman/Gilbert rather than complementing/specifying them. The weak dispositional dodge for the standing problem.
  *   **Fix:** Acknowledge mutual revisability is *sufficient* for a phenomenologically rich form of joint action, but likely not *necessary* for all forms. Grapple seriously with Gilbert – can you really have "joint" action without *any* normative glue or mutual accountability, even a minimal form? If the AI can't even *conceptually* grasp the "we", is the reciprocity genuine or just apparent? Distinguish between joint *action* (which might be achievable in a limited sense with AI) and joint *agency* (which likely requires more).

  It's a bloody good start for a bus-ride draft after an argument. Now go back and shore up the foundations, especially against Gilbert and the committee. And buy your mate a pint – their objection was spot on.
