  ### Metaethics Diagnostic Decision Tree  
  **Instructions:** Work through the tree by answering each question about the specified sentence(s) using only your own view. Proceed to the next node based on your answer. The tree uses six fixed sentences (i)–(vi). Answer in terms of what the sentence *says* or what a speaker *is committed to*—never in doctrinal vocabulary.  

  ---

  #### **Node 1 (root; about (iii))**  
  When someone asserts (iii), does the part "plagiarizing a colleague's manuscript is wrong" contribute the same thing it does when asserted alone as (i)?  
  - **Yes** → Node 3  
  - **No** → Node 2  

  #### **Node 2 (about (iii))**  
  Does the whole sentence (iii) express a single mental state (e.g., a unified attitude or commitment) without its parts contributing independently?  
  - **Yes** → Leaf 7  
  - **No** → Unoccupied combination (incoherent)  

  #### **Node 3 (about (i))**  
  When someone asserts (i), are they stating how things are (like describing a feature of the world)?  
  - **Yes** → Node 8  
  - **No** → Node 4  

  #### **Node 4 (about (vi))**  
  When someone asserts (vi), are they primarily stating how things are (e.g., describing a property of the act)?  
  - **Yes** → Leaf 4  
  - **No** → Node 5  

  #### **Node 5 (about (iii))**  
  When someone asserts (iii), are they expressing that accepting the first part commits one to accepting the second part?  
  - **Yes** → Leaf 5  
  - **No** → Node 6  

  #### **Node 6 (about (v))**  
  When someone asserts (v), are they expressing that they haven’t settled whether to take the stance expressed by (i)?  
  - **Yes** → Leaf 2  
  - **No** → Node 7  

  #### **Node 7 (about (ii))**  
  When someone asserts (ii), is the mental state expressed the same *type* as for (i), but directed at the opposite (e.g., for (i) it’s "against," for (ii) it’s "not against")?  
  - **Yes** → Leaf 3  
  - **No** → Leaf 1  

  #### **Node 8 (about (i))**  
  When someone asserts (i), are they also expressing their opposition to the act?  
  - **Yes** → Node 9  
  - **No** → Node 10  

  #### **Node 9 (about (iv))**  
  When someone asserts (iv), is the speaker’s uncertainty about whether to oppose the act part of what is expressed?  
  - **Yes** → Node 11  
  - **No** → Leaf 6  

  #### **Node 10 (about (i))**  
  Can (i) be true or false?  
  - **Yes** → Leaf 6  
  - **No** → Unoccupied combination (unexplored)  

  #### **Node 11 (about (vi))**  
  For (vi), is the property of being exploitative (e.g., taking unfair advantage) separable from expressing opposition?  
  - **Yes** → Leaf 4  
  - **No** → Leaf 1  

  #### **Node 12 (about (v); optional for tie-breaking)**  
