  ### Unoccupied Combinations  
  - **No at Node 1 → No at Node 2**: Diagnosed as *incoherent* (denies compositionality without offering an alternative).  
  - **Yes at Node 3 → No at Node 8 → Yes at Node 10**: Diagnosed as *coherent but unattractive* (descriptivist view with deflationary truth but no expressivism; e.g., minimalist cognitivism).  
  - **Yes at Node 3 → No at Node 8 → No at Node 10**: Diagnosed as *unexplored* (non-descriptivist cognitivism with no truth-aptness).  

  ---

  ### The Hinge  
  **Node 3 (about (i))** does the most work. It splits the tree into two major branches: views where (i) describes a state of affairs (cognitivist-leaning) and those where it does not (expressivist-leaning). This isolates the core disagreement about moral language’s function. The remaining nodes are comparatively idle: they refine distinctions *within* these branches (e.g., Node 4 separates Ridge from other expressivists; Node 6 sorts pure expressivists), but Node 3 determines the primary fault line.  

