  - *(Used only for flagged pairs; see "Separability" below)*  

  ---

  ### Leaves  
  **Leaf 1: Blackburn-style quasi-realism**  
  - Embedded clause in (iii) contributes: The same stance (opposing plagiarism) as in (i), but conditioned on the consequent.  
  - Hardest sentence: (iv) (due to handling uncertainty as a higher-order attitude).  
  - Most awkward commitment: Moral attitudes can mimic factual discourse through systematic higher-order attitudes.  

  **Leaf 2: Gibbard’s planning-based semantics**  
  - Embedded clause in (iii) contributes: The same state (a plan to oppose plagiarism) as in (i), embedded in a conditional plan.  
  - Hardest sentence: (v) (due to explaining indecision in planning).  
  - Most awkward commitment: Planning for hypothetical scenarios that may never occur.  

  **Leaf 3: Schroeder’s uniform "being for" account**  
  - Embedded clause in (iii) contributes: The same state ("being for" blaming plagiarism) as in (i), with the conditional linking two such states.  
  - Hardest sentence: (iv) (due to reducing uncertainty to "being for" complex relations).  
  - Most awkward commitment: "Being for" highly abstract relations (e.g., blaming-if).  

  **Leaf 4: Ridge’s ecumenical expressivism**  
  - Embedded clause in (iii) contributes: Both a descriptive claim (about plagiarism) and an expressive stance, with the conditional operating on both.  
  - Hardest sentence: (iii) (due to tracking dual contents in embeddings).  
  - Most awkward commitment: Every moral sentence has two distinct contents that logic must handle simultaneously.  

  **Leaf 5: Inferentialism**  
  - Embedded clause in (iii) contributes: A premise in a commitment (if you commit to opposing plagiarism, you must oppose paying).  
  - Hardest sentence: (i) (due to reducing atomic sentences to inferential roles).  
  - Most awkward commitment: Meaning is exhausted by inferential links, with no independent psychology.  

  **Leaf 6: Deflationary response**  
  - Embedded clause in (iii) contributes: The same thing as in (i) (a truth-apt claim), with no special problem.  
  - Hardest sentence: None (trivializes the embedding problem).  
  - Most awkward commitment: Expressivist psychology must align with deflationary truth conditions.  

  **Leaf 7: Unoccupied view**  
  - Embedded clause in (iii) contributes: Nothing; the whole sentence expresses a single attitude (e.g., conditional opposition).  
  - Hardest sentence: (v) (due to disjoining atomic attitudes without composition).  
  - Most awkward commitment: Complex sentences lack internal structure.  

