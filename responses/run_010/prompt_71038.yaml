answer: |-
  ## Research Proposal: Structured Imprecise Credence and the Resilience of Bayesian Objections

  **1. Research Question**
  This project asks: For non-vacuous, structured credal sets (specifically *ε*-contamination, Gamma-minimax, and moment-constrained families), do the canonical objections to imprecise Bayesianism (dilation, learning impediments, practical paralysis, diachronic incoherence) retain their force universally, or are they constrained by the *structure* of the imprecision? The *technical component* determines: (i) under which evidence structures and for which formal classes of credal sets dilation occurs or is avoided; (ii) whether learning trajectories within structured sets circumvent stagnation; (iii) whether practical decisions remain indeterminate under plausible decision rules. The *philosophical component* deduces which norms linking evidence to credal state structure are vindicated or challenged by these results, particularly concerning the expression of bounded distrust versus ignorance. The determinate answer will specify which structures (if any) robustly evade objections or confine them to pathological evidence scenarios.

  **2. Why Existing Answers Leave the Question Open**
  The debate fixates on the maximally imprecise (vacuous) prior state. Orthodox Bayesians demonstrate severe pathologies (dilation preventing learning, decision paralysis) *in this specific case*, arguing it generalises. Imprecise Bayesians counter that maximal ignorance *should* yield maximal imprecision, dismissing the pathologies as acceptable costs or misapplying decision rules. Crucially, *both sides presuppose a lack of structural constraint*. Orthodox arguments rely entirely on properties unique to the vacuous set, while imprecise defences often tacitly assume unstructured imprecision is the relevant baseline. Consequently, neither addresses whether *bounded, structured* imprecision – expressing quantified distrust in a well-defined nominal model – succumbs to the same objections. The dilation debate, for instance, ignores whether its occurrence depends on specific structural features interacting with improbable evidence relative to the nominal prior.

  **3. Methodology & Timeline (Illustrative Example: Diagnostic Test Distrust)**
  *   **Months 1-3:** Formalise core objections within structured frameworks. Analyse *ε*-contamination models. *Example:* Diagnostic test with nominal sensitivity/specificity (e.g., 95%), but distrust modelled via *ε*-contamination (e.g., *ε*=0.1). Derive conditions under which receiving a positive test result causes dilation in the disease probability. Develop conceptual argument: Does this dilation reflect genuine epistemic tension or an artefact of distrusting the manufacturer?
  *   **Months 4-6:** Investigate Gamma-minimax classes. Analyse learning dynamics and decision paralysis. *Example:* Portfolio optimisation where the nominal asset return distribution is known but distrusted (Gamma-minimax over mean/variance). Does conditioning on market data reduce imprecision? Can robust decisions be made despite the set?
  *   **Months 7-9:** Examine moment-constrained sets (e.g., known mean/variance bounds). Focus on diachronic coherence (e.g., reflection principles). *Example:* Climate model ensemble projections where mean temperature rise and variance are bounded, but the distributional form is distrusted. Is the agent vulnerable to reflection-based incoherence over time?
  *   **Months 10-12:** Synthesise results. Identify common structural features shielding against objections. Develop philosophical account: Under what evidential conditions does bounded distrust *warrant* structured imprecision, and which structures best align with normative demands of rationality? Finalise arguments using the diagnostic test example to demonstrate key conclusions.

  **4. Definitional Apparatus**
  *   **Dilation:** A phenomenon whereby conditioning on some piece of evidence *increases* the range (imprecision) of an agent's credence in a proposition, contrary to the intuitive expectation that evidence should refine beliefs.
  *   **ε-contamination:** A class of probability distributions formed by taking a nominal probability distribution and mixing it (contaminating it) with an arbitrary alternative distribution from a large class, where the mixing weight (*ε*) represents the degree of distrust in the nominal model.
  *   **Reflection-style diachronic objection:** A challenge asserting that an agent holding imprecise credences at one time may be rationally compelled to adopt credences at a later time that are incompatible with them, violating a principle of diachronic coherence (e.g., planning now to have a precise credence later that falls outside one's current imprecise range).

  **5. Outcomes & Success Criteria**
  *   **Success:** Characterising one or more classes of structured credal sets that demonstrably avoid dilation under plausible evidence scenarios, permit meaningful learning, support determinate robust decisions, and satisfy diachronic constraints. This would vindicate a norm linking specific evidence structures (bounded distrust) to specific imprecise representations.
  *   **Failure:** Demonstrating that *all* examined structured sets remain vulnerable to the core objections under common evidence conditions, severely undermining the motivation for bounded imprecise models.
  *   **Publishable Negative Result:** Showing that dilation is pervasive even under structure (but perhaps predictable based on evidence improbability relative to the nominal prior), or that only highly restrictive/unnatural sets avoid objections. Identifying *which* objections survive under structure is valuable.
  *   **Worst Outcome:** Discovering that *no interesting class* (i.e., one expressive enough for practical bounded distrust) is characterisable within the timeframe is worse than finding objections survive under characterisable structures. The former renders the entire structural approach pragmatically unviable for this project, while the latter provides a clear, albeit negative, philosophical result.

  **6. Addressing the Core Objection: Why Not Just Use the Nominal Prior?**
  The strongest objection contends that if a nominal prior is available, the agent should simply be a precise Bayesian using it; the neighbourhood adds needless complexity without genuine representational content. **Answer:** The nominal prior is not the agent's *actual* belief. It represents a baseline model subject to *acknowledged, non-quantifiable* flaws. Distrust often concerns *which aspects* of the model might be wrong, not a precise alternative probability. The neighbourhood represents uncertainty *about the model itself*, not just uncertainty within a fixed model. **Cost:** The imprecise Bayesian must concede this requires a psychologically real distinction between "belief in the nominal model" and "distrust concerning its correctness," and that the neighbourhood structure is a formal representation of this qualitative distrust, not directly reducible to a precise meta-probability. Its justification hinges on the *inadequacy* of any single probability function to capture this epistemic state of model suspicion.

  **7. Scope & Contingency Plan**
  The formal analysis of multiple credal set classes (especially Gamma-minimax and moment constraints) is ambitious. If technical hurdles arise:
  *   **Priority:** Focus will shift to achieving comprehensive results for *ε*-contamination (structurally simplest) and one other class deemed most tractable.
  *   **Reduction:** Analysis of diachronic coherence (Month 7-9) may be narrowed to focus primarily on learning dynamics and dilation, deferring full reflection-principle analysis.
  *   **Fallback Deliverable:** A robust formal and philosophical analysis of *ε*-contamination models and moment-constrained sets, demonstrating how specific objections manifest or are mitigated within these structures, alongside a conceptual taxonomy mapping types of distrust to potential credal structures and their vulnerability profiles. The diagnostic test example will be fully developed to illustrate this.
