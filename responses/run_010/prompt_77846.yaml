prompt: |-
  My housemate Dara has lived in four countries and has strong views about when a visitor has to do as the locals do, and she applies them with anoying consistency. Her verdicts so far:

  - A visiting researcher at a US university who thinks tipping is a racket still has to tip 18–20% at sit-down restaurants, including when the server was curt and the food was mediocre. Non-negotible, she says.
  - That same visitor can cross against the light at 3 a.m. at a wide empty intersection in a city where locals wait religiously for the little green man. Fine. Also fine if a local is standing right there watching you do it.
  - A foreign student who uses the laundry sign-up sheet everyone in the dorm maintains, but only signs it when it suits them and grabs a free machine when the room is empty: not fine. Her reason is that the sheet only does its job if people sign it on the mornings they'd rather not.
  - A houseguest whose host says "please, shoes off — though honestly it doesn't matter, the rugs are ancient and I was going to replace them": shoes off anyway. She's explicit that this one isn't about the rugs.
  - A guest at a wedding of a faith she doesn't share, asked to cover her head, finds the whole thing uncomfortable and doesn't believe any of it: cover it. Dara says the day isn't about you.
  - A coworker who doesn't chip in for a farewell gift for someone he barely knew: completely fine, as long as he says he's not participating rather than pretending he forgot, and still signs the card.
  - A visitor in a country where nobody drinks the tap water, who has read the water quality reports and knows perfectly well it's safe: drink it, fine — but she wants you to say out loud, in front of people, why you're doing it.

  She swears none of that is inconsistent, and I mostly believe her, but I can't reconstruct the rule. Here's the case I actually care about.

  Our department runs on a completely unwritten norm that nobody sends work email between 7 p.m. and 7 a.m. It's in no policy, nobody explains it to newcomers, and it isn't about hours worked — people are at their desks till nine, they just don't hit send. We're now hosting a visiting fellow for four months, from a place where midnight emails are normal and even expected of juniors. He sends them, always with a line at the top saying no reply needed before morning. Our grad students reply at 11 p.m. anyway, because they feel they can't leave a senior visitor hanging, and one of them told me she's stopped sleeping properly. Nobody has complained to him, nothing about pay or grading or authorship is affected, and when I finally mentioned it he was genuinely surprised — he said he'd happily schedule-send everything if we asked, but he also thinks the norm is silly and would rather be told it exists than left to guess. Its his last month here in eight weeks' time.

  What's Dara's verdict — is he obliged to stop, obliged to do something less than stopping, or off the hook?

  What I want from you: the candidate rules that would generate all seven verdicts at once (there's more than one, and I want them stated sharply enough that I could run each back down the list and check it); which of those are actually killed by a specific verdict, and which one is doing the most work in holding the set together; what each surviving rule says about the email case; your single best guess at her answer and why you'd bet on that rule rather than the others; which of the seven is the closest analog to the email case, and whether that analogy is doing real work or just feels comforting; and one further case I could put to her that would split the surviving rules cleanly, with what each rule would say about it. If the seven verdicts genuinely underdetermine this one, say so plainly and tell me what principle she'd be committing herself to under each possible answer — I'd rather have that than have you pick a favorite and paper over the gap. Name whatever philosophical machinery helps you, but don't send me off to read anything. Keep it tight enough that I could actually read it before dinner.
reasoning: |-
  Hmm, this user is presenting a fascinating puzzle about social norms and cultural expectations. They've described their housemate Dara's seven specific verdicts on visitor behavior across different scenarios, and now want to apply that reasoning to an email norm situation in their academic department. 

  The user seems intellectually rigorous - they're not just asking for a simple answer, but want candidate rules that explain all seven cases, analysis of which rules survive, analogies to the email case, and even a test case to distinguish between remaining rules. This is someone who enjoys precise thinking and hates fuzzy logic. 

  I notice they're particularly invested in the email norm situation - it's causing real stress to grad students, and the visitor is willing to adapt but unaware. The user seems frustrated that nobody has communicated this unwritten rule, yet also skeptical about whether it should be enforced. 

  Breaking this down: First, I need to reverse-engineer Dara's principles from the seven cases. There are multiple possible rules here, but they likely cluster around three core ideas: consent/cooperation, symbolic respect, and harm prevention. 

  The tipping case suggests obligation to participate in systems you benefit from, even if flawed. The jaywalking case shows norms can be broken when harmless and non-performative. The laundry sheet reveals the importance of maintaining collective systems. The shoes-off case emphasizes symbolic respect over practical impact. The head-covering prioritizes event-specific decorum. The gift contribution highlights transparency over participation. The tap water case demands public justification when breaking norms. 

  For the email dilemma: The key tension is between maintaining a collective wellbeing system (like the laundry sheet) versus allowing harmless deviations (like jaywalking). The grad students' lost sleep suggests real harm, making this lean toward requiring schedule-send. The closest analog is probably the laundry sheet - both involve maintaining systems that only work with universal buy-in. 

  The user's request for a test case is sharp - I'd propose something about queue-jumping when no one's waiting, to test whether empty violations are permitted. That would split between "harm-focused" and "system-integrity" rules. 

  Ultimately Dara would likely say the visitor must schedule-send, because the norm protects vulnerable parties (grad students) and the system collapses without compliance - just like the laundry sheet. The visitor's willingness to adapt makes this even clearer. The "no reply needed" line ironically increases pressure, mirroring how the gift-contribution transparency didn't absolve participation. 

  This user clearly values intellectual honesty - I should acknowledge where the verdicts underdetermine the answer (they slightly do between harm and system rules) while showing why one interpretation fits best. No jargon - just crisp reasoning they can digest before dinner as requested.
answer: |-
  Here's the breakdown of Dara's principles, applied rigorously to your email case:

  **Candidate Rules Generating All Seven Verdicts:**

  1.  **The Cooperative System Rule (CSR):** You must follow *procedural norms essential for a cooperative system's function* when you benefit from or participate in that system, even if inconvenient. Harmless deviations from *symbolic/decorative* norms are permitted.
  2.  **The Harm & Transparency Rule (HTR):** You must avoid *actionable harm* (including creating unreasonable pressure/obligation) and *deception*. Violating harmless norms is fine if done transparently (explaining why). Respecting symbolic/decorative requests (even if "pointless") is required when the context is about others.
  3.  **The Contextual Integrity Rule (CIR):** You must respect the *integrity of the specific context* you are in. This means upholding *essential functioning mechanisms* (like the laundry sheet), respecting *explicitly expressed symbolic wishes* of hosts/event holders (shoes, head covering), and being transparent when *violating norms based on personal judgment* (water). Harmless, non-disruptive deviations in non-core contexts (jaywalking) are fine.

  **Survival & Dominance:**
  *   **Killed:** Rules based *solely* on "local custom," "benefit received," or "harm avoidance" fail individually. (e.g., Tipping benefits server but harms tipper? Jaywalking breaks custom but harmless. Gift refusal avoids cost but is transparent).
  *   **Surviving:** CSR, HTR, and CIR all generate the 7 verdicts. CIR does the most work holding the set together. It directly addresses the *type* of norm in each context (functional system vs. symbolic gesture vs. personal choice) and the *source* of the expectation (implicit system need vs. explicit host/event request vs. general custom).
  *   **Why CIR Dominates:** It best explains the fine distinctions: *why* the laundry sheet is binding (essential function) vs. jaywalking (non-essential custom), *why* "shoes off" is required despite the host downplaying it (explicit symbolic wish of the host context), and *why* transparent refusal for the gift is fine (no deception, context is the group's gesture, not a functional system).

  **Application to Email Case (Visiting Fellow):**
  *   **CSR:** The email norm *is* a cooperative system (prevents pressure/obligation chain reactions). Fellow benefits from the department. He *must* stop sending live late emails. Schedule-send is the solution.
  *   **HTR:** Fellow causes *actionable harm* (grad student sleep loss due to perceived obligation). His "no reply needed" doesn't eliminate the *pressure* (like gift refusal transparency didn't eliminate non-participation, but harm here is the *feeling* of obligation). He *must* stop/schedule-send to prevent harm.
  *   **CIR:** The email norm maintains the *integrity* of the department's work-life context by preventing implied pressure/obligation. It's an *essential functioning mechanism* for well-being (like the laundry sheet), not just a custom. Fellow is participating in *this* context. He *must* follow the norm. Schedule-send respects the context's integrity.

  **Best Guess for Dara's Verdict: Obliged to Stop (Use Schedule-Send)**
  *   **Why:** CIR is the strongest rule. The email norm is most analogous to the **Laundry Sheet (Case 3)**. Both are:
      *   Unwritten, cooperative systems.
      *   Essential for smooth functioning and preventing negative consequences (laundry chaos / sleep loss/perceived obligation).
      *   Rely on universal adherence to function effectively ("only works if people sign on mornings they'd rather not" / only works if no one sends late emails triggering replies).
      *   Violation disrupts the system's integrity *for others*, even if the violator thinks it's silly or offers workarounds ("no reply needed" / "grabs machine when empty").
  *   **Why not other rules?** While HTR also demands stopping, CIR captures the *systemic* nature better. CSR points the same way. The analogy to the Laundry Sheet is doing **real work** – it highlights the core issue of maintaining a fragile, essential cooperative practice.

  **Closest Analog: The Laundry Sheet (Case 3)**
  *   **Why:** As above. The "silly norm" and "willing to comply if asked" aspects are similar too. The analogy is **crucial** – it reveals the norm as a functional mechanism, not just politeness.

  **Test Case to Split CSR/HTR vs. CIR:**
  *   **Scenario:** A visitor attends a regular, informal neighborhood potluck with a strong *unspoken* norm that everyone brings enough food for 4 people. The visitor thinks this leads to too much waste. They bring only enough for themselves, but announce clearly upon arrival: "I only brought food for myself tonight, as I believe the usual amount causes waste. Please don't feel obligated to share yours with me."
  *   **Verdicts by Rule:**
      *   **CSR:** *Violation.* The potluck is a cooperative system relying on contribution for abundance/sharing. Bringing only for oneself undermines the system, even transparently.
      *   **HTR:** *Possibly Fine.* Transparent, no deception. Harm (waste) is arguably avoided, though others might feel the social contract/abundance is harmed. Debatable, but leans towards permissible.
      *   **CIR:** *Violation.* The potluck's context is about shared abundance and communal contribution. Bringing only for oneself, even transparently, violates the core *integrity* of the event's purpose (communal sharing), similar to refusing the head covering at a wedding. It's about respecting *what the event is for*.

  **Underdetermination & Commitment:**
  The seven verdicts *slightly* underdetermine the email case. CSR and CIR clearly demand stopping. HTR *strongly suggests* stopping due to harm, but the Fellow's transparency ("no reply needed") creates a tiny ambiguity compared to the clear harm in other cases.

  *   **If Dara says "Obliged to Stop":** She prioritizes **Contextual Integrity (CIR)** or **System Function (CSR)**. She commits to the principle that unwritten norms essential for a group's functional well-being must be followed by participants, regardless of personal opinion or transparency, once aware.
  *   **If Dara says "Off the Hook" (Unlikely) or "Only Obliged to be More Transparent":** She prioritizes **Harm Avoidance/Transparency (HTR)** taken very strictly. She commits to the principle that causing *feelings* of obligation without explicit coercion isn't sufficient "harm" if met with full transparency, and that norms lacking explicit authority or policy can be broken if justified and declared. (This clashes strongly with the Laundry Sheet verdict).

  **Your Best Bet:** Dara says the Fellow is **obliged to stop sending live late emails and use schedule-send**. The Laundry Sheet analogy is too compelling under CIR. The norm exists to protect vulnerable participants (grad students) from implied pressure within a cooperative system, making adherence essential to the context's integrity, just like signing the sheet on inconvenient mornings. His willingness to comply if asked reinforces that he *should* comply now that he knows.
