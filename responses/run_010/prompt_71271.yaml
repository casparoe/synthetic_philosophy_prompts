prompt: |-
  Just got out of a ~3 hour argument with a friend about pure time preference and my brain wont shut up, so I'm dumping it on you instead.

  Context: I'm on a small program committee that gets to fund three one-year projects — one person each, no team, no data collection, basically a desk and a year — on the ethics of discounting the far future. Philosophers and economists can both apply. My job is to propose what those three slots should go to, and I want to walk in with something better than "the usual controversies, again."

  The argument, since its what triggered this. My friend's position is that pure time preference isn't a moral claim at all. On his telling, a nonzero delta is a commitment device: a way for the present generation to refuse to be dictated to by the sheer arithmetic of how many future people there will eventually be. He calls it the sovereignty reading — we discount not because future welfare counts for less, but because setting the pure rate to roughly zero means handing policy over to a headcount that doesn't exist yet and can't reciprocate. My counter was that this just relabels status quo bias, that it can't explain why the rate should be small rather than large, and that it collapses the second you notice the same logic licenses discounting the claims of large groups of living people too. He said that's a feature, not a bug. We did not resolve it and I'm still annoyed.

  So: pretend you're a philosopher-economist who is equally at home with the Ramsey-equation machinery (growth, elasticity of marginal utility, extinction risk folded into the rate) and with population ethics, person-affecting restrictions, that whole territory. Think carefully, and before you rank anything, brainstorm something like eight to ten genuinely open questions here — including at least two that are *not* the tired Stern-vs-Nordhaus stalemate over whether ethics or observed market returns should set the pure rate. Then cut down to three, and tell me what each funded year should actually *produce* — an argument, a new distinction, a small model, a worked case — not just a topic label.

  Defend the ordering, not just the list. For each pick I want: how much of the rest of the debate is downstream of it, whether it's genuinely stuck or merely unfashionable, and whether one person in one year can realistically move it. And place my friend's sovereignty reading explicitly — is it a real fourth contender that deserves one of the slots, a repackaging of something already covered, or a red herring? If you think the money is better spent on something I didn't mention at all — uncertainty about the discount rate itself and why the certainty-equivalent rate declines with the horizon, say, or whether people are quietly conflating discounting utility with discounting consumption — say so and argue for it over my candidates.

  No bibliography, no citations, no reading list. I can't check any of that and it isn't the deliverable.

  Last thing, because this goes in front of people who will push back: tell me what would change your mind. Which consideration, if it came out the other way, would flip your ranking — and where in your own reasoning is the weak joint most likely to be? I'd much rather hear that than get a confident-sounding list.
