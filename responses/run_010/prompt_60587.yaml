  The kinship prediction (move 2) is the strongest point for the theory, but it's outweighed by the rescues. Lakatos's idea of a "research programme" helps here: a theory can be progressive (making new predictions) or degenerating (constantly patching holes). Here, the rescues dominate, making it degenerating.

