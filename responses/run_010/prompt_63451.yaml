  The user's opening five minutes must preemptively frame clause (b) as operational rather than metaphysical. I'll suggest they explicitly state it's not a definition but a necessary condition, using the cancer analogy to make it vivid. For replies: concede freely on model equivalence (it's about explanation not calculation) but stand firm on timescales being measurable via variance partitioning. The microbial experimentalist objection is actually a gift – I'll outline concrete mutation-rate comparisons they could propose.

