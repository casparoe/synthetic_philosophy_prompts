prompt: |-
  I am the archivist responsible for description at a county historical society, and our board has asked me to supply a written statement of descriptive principles to accompany the policy manual we are rewriting this year. I have been drafting it by writing down what I actually do and then generalizing, and the result worries me: I have defended each item separately at various points over fifteen years, but I have never laid them out side by side, and I suspect I have a list rather than a position. The collection that forced the issue is the records of the county infirmary, 1868 to 1929 — admission registers in which most inmates appear only as a number, one column that sorts them by race in the administrative vocabulary of the period, no names at all recorded for the people entered in that column, no separate register for them among the surviving papers, the superintendent's annual reports to the county commissioners, and a photograph album whose captions are in his hand. Here is what I currently hold. (1) The catalog entry should say what a record is and what it says, not what it means; our description should be the one part of the repository's output that a researcher of any politics can rely on, with neutral tone, the least loaded vocabulary available, and interpretation left to the scholarship that cites us. (2) The language we inherit is not innocent: titles, series labels, and subject headings handed down from creators and from earlier staff were chosen by people who had standing to name others and no standing to be named, and when we transmit them without comment we reproduce the register's point of view as though it were the world's. (3) Where an item bears an original title or label, we transcribe it as it stands and flag it as transcribed, and we do not modernize or bowdlerize it, including where the wording is a slur or a demeaning designation. (4) Absence is part of the record: where a group appears only obliquely or not at all, the description should register the gap and give the best available account of why it is there, rather than letting a researcher conclude that these people did not exist. (5) Where the records concern an identifiable community that still exists, that community has authority over the terms we use for it in our description; we ask its members what they call themselves and we adopt it. (6) Arrangement follows provenance and original order; we do not re-sort a creator's files to match how we now carve up the subject, and we do not build synthetic collections out of material pulled from several fonds because a present-day constituency finds that arrangement more legible. (7) Description is infrastructure: entries carry persistent identifiers and get quoted in print, so someone who cited our description three decades ago should be able to find what they cited, which means we keep superseded wording in a version history but change the current entry's substantive claims rarely and reluctantly.

  What I want is an audit of this set, not a lecture on the literature and not a bibliography. Tell me which of these can be held together and which cannot, and please discriminate rather than flag everything: some of these only look like they conflict, and I would rather be told that plainly, with the distinction that dissolves them, than have the whole set treated as equally unstable. For each genuine tension, rank it by severity, identify precisely what has to give, and say what giving it costs me — including whether the cost falls on the infirmary registers specifically, since that is the collection I have to describe next quarter. I would especially like to know whether the principles can deliver a description of the people who appear in the race column as numbers and in no other form, because that is the case I started from and I no longer trust that my list reaches it. Then tell me which single revision would buy the most coherence across the whole set, and what I should expect to lose by making it. I deliberately am not telling you which commitments I would be most reluctant to abandon; I suspect that reluctance is itself part of the problem, and I do not want the audit shaped around it.

  One further thing. For each tension you identify, say how confident you are that it is real rather than an artifact of the way I have phrased the commitment, and note where a different phrasing of mine would make the conflict disappear. At the end, single out the one claim in your audit that you are least sure of, and say what consideration would settle it either way.
reasoning: |-
  Okay, I need to tackle this archivist's query thoroughly. They're rewriting their descriptive principles and need an audit of their existing seven points. The core challenge is the county infirmary records, especially the unnamed individuals categorized by race. They want to know which principles conflict, how severe the conflicts are, what must be compromised, and the costs involved. They also want a single revision that would bring the most coherence and specifically address the infirmary case.

  First, I'll list out the seven principles to reference them easily:
  1. Neutral description: Catalog entries state what the record is and says, not what it means; avoid interpretation.
  2. Language isn't innocent: Inherited labels reflect power imbalances; transmitting them without comment perpetuates bias.
  3. Transcribe originals faithfully: Don't modernize or censor, even if terms are slurs.
  4. Note absences: Highlight gaps in the record, explain why they exist.
  5. Community authority: Consult modern communities for their preferred terms.
  6. Provenance and original order: Don't rearrange records to fit modern subjects.
  7. Description as infrastructure: Maintain persistent identifiers; changes are rare, with versioning for superseded wording.

  Now, I need to identify tensions between these principles. The archivist wants me to discriminate between real conflicts and apparent ones, rank severity, and specify costs. I should also consider how the principles apply to the infirmary case—people listed only as numbers in a race column.

  Starting with tensions:
  - Principle 1 (neutrality) vs Principle 2 (language isn't innocent): Neutrality demands we just present the record, but Principle 2 says that's not enough because it passively endorses biased language. For example, transcribing a racial slur without comment might be seen as neutral, but it could perpetuate harm. This conflict is severe because it goes to the heart of archival ethics—balancing authenticity with justice. Resolving it might require adding context in descriptions, which could violate strict neutrality. Cost: If we prioritize Principle 2, we add interpretive comments, risking that researchers might see it as non-neutral. In the infirmary case, this affects how we handle the race column—if we just transcribe it, we're silent on its dehumanizing aspects; if we comment, we interpret.

  - Principle 1 (neutrality) vs Principle 5 (community authority): Neutrality says use the record's terms, but Principle 5 says use modern community-preferred terms. For instance, if the infirmary records use an outdated racial term, but the community now prefers a different one, which do we use? Conflict is severe because it involves representation. Resolving it might mean adding community-preferred terms alongside original terms. Cost: If we add preferred terms, it introduces interpretation, conflicting with neutrality. For the infirmary, this directly impacts describing the unnamed people—we might need to note that the terminology is offensive and provide context.

  - Principle 3 (faithful transcription) vs Principle 5 (community authority): Transcribe exactly, even slurs, but Principle 5 says use respectful community terms. This looks like a conflict, but it might be resolvable. We can transcribe the original faithfully but also add a note with preferred terms, aligning with Principle 4 on noting absences. So, it's an apparent conflict. For the infirmary, we transcribe the race column as is, but in a scope note, explain the issues and consult the community for better terms when describing gaps.

  - Principle 4 (note absences) vs Principle 6 (provenance): Principle 4 wants us to highlight missing information, like the unnamed people in the infirmary, while Principle 6 says don't rearrange records. But noting absences doesn't require rearrangement; it's descriptive. So, no real conflict here. We can describe gaps without altering the original order.

  - Principle 7 (infrastructure) vs others: Changing descriptions is problematic because of persistence, but Principles 2, 4, and 5 might require updates for accuracy or ethics. For example, if community preferences evolve, we might need to update terms, conflicting with Principle 7. Severity is moderate. Cost: If we update descriptions, it breaks citation persistence; if not, we might perpetuate harm. A version history helps, but the "current entry" changes could confuse. In the infirmary case, if we later consult the community, we might need to revise descriptions, affecting citations.

  For the infirmary records specifically: The people are listed as numbers in a race column. Principles 1 and 3 say transcribe it neutrally and faithfully. Principle 4 says note the absence of names and explain why—e.g., institutional dehumanization. Principle 5 might not apply directly if the community isn't clearly identifiable, but if it is, we should consult on terminology. Principle 2 reminds us that the language used reflects power dynamics, so we might add context in the description. Overall, the principles can address this if we combine faithful transcription with contextual notes on gaps and biases.

  Ranking tensions by severity:
  1. Highest: Principles 1 vs 2 and 1 vs 5, as they challenge core archival values of neutrality vs equity.
  2. Moderate: Principle 7 vs 2/4/5, due to practical impacts on persistence.
  3. Low: Apparent conflicts like 3 vs 5, which can be resolved with careful phrasing.

  Single best revision for coherence: Adjust Principle 1 to allow for contextualization. Instead of "no interpretation," say something like "minimal necessary context to prevent harm or misunderstanding." This buys coherence by bridging neutrality with ethical responsibilities. Cost: Some researchers might see it as less purely objective, and it requires careful wording to avoid over-interpretation. It directly helps the infirmary case by enabling notes on the unnamed individuals.

  Confidence in tensions: For Principle 1 vs 2, I'm highly confident it's real. For Principle 1 vs 5, also high confidence. For Principle 3 vs 5, confident it's apparent with good phrasing. Least sure about Principle 7 conflicts—it might be manageable with versioning, so phrasing could reduce the issue.

  Finally, the archivist's unspoken reluctance might be clinging to strict neutrality. By softening it, the whole set becomes more workable, especially for the infirmary project.
answer: |-
  Based on your principles and the specific challenge of the infirmary registers, here is a focused audit of tensions, ranked by severity, with actionable resolutions and costs. Conflicts are dissected to distinguish genuine tensions from resolvable ones. The infirmary case serves as the primary stress test.

  ### Core Tensions (Ranked by Severity)
  **1.  PRINCIPLE 1 (Neutral Description) vs. PRINCIPLE 2 (Language Isn’t Innocent) & PRINCIPLE 4 (Absence is Part of the Record)**  
      - **Conflict:** Principle 1 demands pure transcription without interpretation ("say what it is, not what it means"). Principles 2 and 4 require actively contextualizing harmful language or silences (e.g., noting that the race column’s terminology reflects institutional power, or that the absence of names dehumanizes individuals). Neutrality here *is* complicity with the original viewpoint.  
      - **Severity:** High (fundamental ethical clash).  
      - **What Must Give:** Principle 1’s prohibition on "interpretation" must be relaxed to allow minimal contextualization of systemic bias or silence.  
      - **Cost:**  
          - *General:* Some researchers may perceive contextual notes as political "bias," undermining their view of the archives as purely objective.  
          - *Infirmary-Specific:* Essential for describing the numbered individuals. Without contextualization, the catalog entry replicates the superintendent’s erasure (e.g., transcribing "Colored inmates, Nos. 78-82" without comment implies acceptance of this as a factual category).  
      - **Confidence:** High (95%). This is a well-documented tension in critical archival studies. Your phrasing of P1 as "not what it means" is the root; revising it to *"prioritize factual transcription but allow contextual notes on systemic gaps or oppressive language"* resolves the conflict.  

  **2.  PRINCIPLE 1 (Neutral Description) vs. PRINCIPLE 5 (Community Authority)**  
      - **Conflict:** Principle 1 requires using the record’s original terms. Principle 5 mandates using modern community-preferred terms in description (e.g., replacing "Negro" in subject headings with "African American" if the community specifies).  
      - **Severity:** High (affects findability and representation).  
      - **What Must Give:** Principle 1’s insistence on original language must yield to P5 in descriptive metadata (subject headings, scope notes), but not in transcription (P3).  
      - **Cost:**  
          - *General:* Loss of terminological consistency over time if community preferences evolve (challenging P7’s persistence).  
          - *Infirmary-Specific:* If the race column uses slurs (e.g., "Mulatto"), and a descendant community prefers specific modern terms, you must decide whether to use those terms in access points. Not doing so risks alienating the community; doing so violates strict neutrality.  
      - **Confidence:** High (90%). Conflict is inherent; P5’s implementation requires overriding inherited language in *description* (not transcription).  

  **3.  PRINCIPLE 3 (Faithful Transcription) vs. PRINCIPLE 5 (Community Authority)**  
      - **Conflict:** P3 forbids altering slurs in transcription; P5 requires using respectful terms in description. This *appears* conflicting but is resolvable.  
      - **Resolution:** Transcription (P3) remains untouched. Community-preferred terms (P5) are used in *enhanced description* (subject headings, notes).  
      - **Severity:** Apparent conflict only (low if resolved correctly).  
      - **Cost:** None if handled via scope notes. For infirmary registers: Transcribe the race column verbatim (e.g., "Idiots, Nos. 45-47") but add a note: "Term reflects contemporary institutional classifications. [Modern Community] prefers 'persons with intellectual disabilities'."  
      - **Confidence:** 98% this is not a genuine tension. Your phrasing of P3 and P5 already allows this distinction.  

  **4.  PRINCIPLE 7 (Infrastructure/Persistence) vs. PRINCIPLE 2, 4, & 5 (Context, Absence, Community)**  
      - **Conflict:** P7 demands rare substantive changes to descriptions to preserve citations. P2/4/5 may require updates as scholarship evolves, communities redefine terms, or new gaps are identified.  
      - **Severity:** Moderate (practical, not ethical).  
      - **What Must Give:** P7’s "rare and reluctant" changes must accommodate necessary updates to contextual notes or terminology when harm or significant inaccuracy is documented.  
      - **Cost:**  
          - *General:* Broken citations if substantive changes occur, or administrative burden maintaining version histories.  
          - *Infirmary-Specific:* If new research reveals why certain groups were unnamed (e.g., specific racist policies), updating the description to reflect this may invalidate old citations.  
      - **Confidence:** 85%. Version history mitigates this, but your P7 phrasing ("substantive claims rarely changed") clashes with P2/4/5’s iterative nature.  

  **5.  PRINCIPLE 6 (Provenance) vs. PRINCIPLE 4 (Absence)**  
      - **Conflict:** No genuine tension. P6 governs physical/intellectual arrangement; P4 governs descriptive content. You can note absences *within* the existing structure (e.g., in the infirmary series description: "No names were recorded for individuals in the race column; see Superintendent’s reports for context").  
      - **Severity:** None.  
      - **Confidence:** 100%.  

  ### Can These Principles Describe the Numbered Individuals?  
  **Yes, but only if P1 is revised.**  
  - **Without revision:** Principles 3/6/7 ensure faithful transcription and persistence, but P1 blocks contextual notes. Researchers encounter "Colored, Nos. 33-37" with no explanation of why names are missing, reproducing dehumanization.  
  - **With P1 revised to allow minimal context:**  
      - P3: Transcribe race column exactly.  
      - P4: Note in the series description: "Individuals in this column are anonymized; no separate register survives. This reflects institutional practices for marginalized groups."  
      - P2: Add: "Terminology reflects superintendent’s administrative categories."  
      - P5: If applicable, consult descendant communities on respectful modern terms *for descriptive notes* (e.g., using "Black" or "African American" in access points).  
      - P6/P7: Preserve original order and identifiers.  

  ### Single Revision for Maximum Coherence  
  **Revise Principle 1 to:**  
  *"Catalog entries prioritize factual transcription and structure but include minimal contextual notes to acknowledge harmful language, systemic silences, or significant gaps without interpretive analysis."*  

  - **What It Buys:**  
      - Resolves the highest-severity conflicts (P1 vs. P2/4/5) by permitting essential context for the infirmary case and similar collections.  
      - Maintains core archival integrity (transcription, provenance) while addressing ethical obligations.  
      - Aligns with modern standards like *Radical Empathy* in archival description.  
  - **What It Costs:**  
      - Some researchers may accuse the archives of "bias" for contextualizing oppression.  
      - Increased labor to research/add concise, factual notes (e.g., investigating why infirmary groups were unnamed).  
      - Potential tension with P7 if contextual notes evolve significantly.  

  ### Least Confident Claim in This Audit  
  **That P7 (persistence) vs. P2/4/5 (context/community) is a moderate, not low, tension (85% confidence).**  
  - **What Would Settle It:**  
      - **If version history includes detailed change logs** accessible to researchers (e.g., "2025 note added: Community requested updated term"), the tension eases. P7 holds if the *core factual transcriptions* remain stable and changes are additive.  
      - **If community requests require altering transcriptions** (e.g., redacting slurs), conflict escalates to severe, violating P3/P7. Your current principles forbid this, so it’s unlikely.  

  ---

  ### Summary Recommendations  
  1. **Revise P1** to allow minimal contextualization (key for the infirmary registers).  
  2. **Implement P4 aggressively** for the infirmary collection: Explicitly state that the absence of names reflects dehumanizing systems.  
  3. **Use P5 consultatively:** If descendant communities of the infirmary exist, engage them on modern descriptive terms (e.g., subject headings), but preserve original transcriptions.  
  4. **Document version histories** rigorously to satisfy P7 when contextual notes evolve.  

  This approach transforms your list into a coherent framework, centered on *transparent accountability* rather than false neutrality, while respecting archival fundamentals. The infirmary’s numbered individuals can be described with integrity—acknowledging their presence, the system that erased them, and the surviving evidence—without over-interpretation.
