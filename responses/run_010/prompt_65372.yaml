prompt: |-
  Our reading group has been stuck on this for a year and I want to write the document we should of produced. Half of us are updateless decision theorists: pick the policy that maximises expected utility against your prior, don't conditionalise on which situation you happen to find yourself in, and let the counterfactuals run through your own reasoning process. The other half are plain causal decision theorists: conditionalise on all your evidence first, then take the act that causally promotes the most value, and stop pretending you can affect branches that never happened.

  Draft the joint statement the two camps could both sign after a good-faith adversarial collaboration. I want a numbered section of claims both can actually sign — including whatever, if anything, they agree on about the right answers in counterfactual mugging and in XOR blackmail; the disagreements stated precisely, each side's position worded so that side would accept the wording; the cruxes, meaning the sub-questions where settling them would move at least one camp; and for each crux a case or argument both accept as bearing on it, with each side's prediction recorded in advance. Also say whether their quarrel over counterfactual mugging and their quarrel over XOR blackmail are one quarrel or two, and flag anything you think is really just a verbal dispute.

  Then get both camps to handle a case I made up, because I think its where they actually break apart. A year ago Omega flipped a fair coin in secret. Had it come up heads, Omega would have handed a complete stranger $10,000 — but only if the prediction Omega made at the time was that you would hand Omega $100 today. It came up tails, the stranger got nothing, and Omega says its prediction was that you'd refuse. So: do you hand over the $100? Give each camp's answer, each camp's account of what the other is getting wrong, and what each would count as evidence against its own view here.

  Format it as numbered agreed claims followed by a disagreements table — columns for each side's preferred wording, the crux it feeds into, and what would settle it. British English please.
reasoning: |-
  Okay, the user is part of a reading group that's been stuck on a decision theory debate for a year between Updateless Decision Theorists (UDT) and Causal Decision Theorists (CDT). They want me to draft a joint statement both camps could sign, including agreed claims, precise disagreements, cruxes with test cases, and analysis of whether counterfactual mugging and XOR blackmail are the same issue. They also want both theories applied to a new case they invented.

  First, I need to understand the core conflict. UDT maximizes expected utility against the prior without updating, letting counterfactuals run through their reasoning. CDT updates on evidence and chooses acts that causally promote value. The user wants this documented clearly.

  For the joint statement, I'll structure it with numbered agreed claims first. Both sides agree on basic axioms like maximizing expected utility and rational coherence. They also accept Newcomb's Problem as a point of agreement where both prefer one-boxing, even though CDT traditionally two-boxes—wait, that might need clarification. In standard formulations, CDT does two-box, but perhaps here they're agreeing on the outcome? I need to be careful. Maybe phrase it as accepting the dominance of one-boxing in Newcomb-style problems when considering predictors like Omega.

  For disagreements, the key points are updating vs not updating, and how to handle counterfactuals. In counterfactual mugging, UDT pays while CDT doesn't. In XOR blackmail, both might not pay, but for different reasons. The user's new case is crucial because Omega's action depends on a coin flip and a prediction about the user's action in a counterfactual branch.

  The user's case: Omega flipped a fair coin. Heads: stranger gets $10k only if Omega predicted you'd pay $100 today. Tails: stranger gets nothing, and Omega predicted refusal. Now Omega asks for $100. UDT would pay because their policy considers the prior probability, including the heads branch where paying gets the stranger $10k. CDT wouldn't pay because, conditional on tails, paying has no causal effect—it just loses $100.

  Cruxes should test what drives the disagreement. For example, does the predictor's accuracy in counterfactual branches matter? Both sides might agree on a test case varying that. Another crux is whether decision-making should ignore branches where the agent isn't present, which could be tested with a modified mugging.

  I need to ensure the wording is precise. UDT sees the decision as setting a policy across all possible worlds, while CDT focuses on the actual world after updating. The user wants British English, so I'll use "maximise" and "conditionalise".

  For the new case, UDT pays $100 to potentially benefit the stranger in the heads branch, while CDT doesn't because in the actual tails branch, paying doesn't change anything. Each would see evidence against their view if, say, UDT's payment doesn't lead to benefits in similar past cases, or if CDT's refusal in such scenarios leads to worse outcomes overall.

  I should also clarify if counterfactual mugging and XOR blackmail are the same quarrel. They both involve counterfactual dependence, but XOR blackmail adds complexity with evidence about the prediction. So it's one core issue with variations.

  Finally, ensure the document is neutral, precise, and has numbered sections as requested. Include a disagreements table with columns for each side's position, crux, and settling method.
answer: |-
  ## Joint Statement on Decision-Theoretic Divergences  
  **Agreed Claims of the Updateless (UDT) & Causal (CDT) Camps**  

  1.  **Rational Objective:** Both camps aim for agents to maximise expected utility (EU) relative to their beliefs and values.  
  2.  **Formal Framework:** Decisions should be analysed within a causal model or world-program specifying dependencies, including how actions influence outcomes. Omega is modelled as a near-perfect predictor with access to this model.  
  3.  **Newcomblike Dominance:** In the canonical Newcomb problem (one-box = £1M, two-box = £1K + £1M iff predicted two-box), both camps concur that one-boxing is rationally mandated. (UDT achieves this directly; CDT requires evidential incorporation or tickles to avoid self-sabotage).  
  4.  **XOR Blackmail Core Agreement:** In XOR Blackmail (Omega demands £X, else reveals embarrassing info iff (A XOR B) is true, where A/B are facts unknown to you), both camps agree **refusing payment is correct**.  
      *   *UDT Reasoning:* Refusal maximises prior EU. Paying lowers EU in all world-states (embarrassment or wasted money).  
      *   *CDT Reasoning:* Conditional on the demand, paying £X does not *causally prevent* embarrassment (which depends on XOR of fixed facts). Paying only loses £X.  
  5.  **Verbal Distinction:** The term "counterfactual" is used differently. CDT uses it for causally possible worlds given fixed past/physics. UDT uses it for logically possible worlds in the prior, including those where the agent's decision algorithm differs. This difference is terminological but underpins substantive disputes.  
  6.  **The User's Case (Coin-Prediction Stranger):**  
      *   **Agreed Structure:** Omega fairly flipped coin (H: Offer Stranger £10k iff predicted you pay £100 today; T: No offer, predicted refusal). Coin landed Tails. Omega now demands £100.  
      *   **Agreed Predictor Capability:** Omega's prediction is highly reliable conditional on the coin flip and its own algorithm.  

  ---

  **Precise Disagreements & Cruxes**  

  | Disagreement Area             | UDT Position (Preferred Wording)                                                                 | CDT Position (Preferred Wording)                                                                 | Crux                                                                                                 | Settling Method & Predictions                                                                                                                                 |
  | :---------------------------- | :----------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Counterfactual Mugging (CM)**<br>(Heads: Omega asks for £100; Tails: Omega gives £10k iff predicted you *would have paid* in Heads) | **Pay £100 (Tails):** An optimal decision *policy* maximises expected utility against the *prior*. Paying in Tails is required because the *same policy* pays in Heads, securing £10k. Failing to pay in Tails means the policy is suboptimal ex ante. | **Refuse £100 (Tails):** The agent must *conditionalise* on all *actual evidence* (Coin=Tails). Conditional on Tails, paying £100 has *no causal effect* on any outcome (the £10k is irrevocably lost). Paying only loses £100. | **Crux 1a:** Does rational choice require selecting an action *now* that maximises EU against the *original prior*, or must it maximise EU against the *posterior* after updating on all available evidence (including which branch one is in)? | **Test Case: "Counterfactual Accuracy Test"**<br>Setup: Like CM, but Omega's prediction in the *counterfactual branch* (Heads) is known to be *only 60% reliable* due to added noise, while prediction in the *actual branch* (Tails) remains 99.9%.<br>*UDT Prediction:* Paying remains optimal if ex ante EU of the "Pay" policy > "Refuse" policy, despite poor counterfactual accuracy.<br>*CDT Prediction:* Refusal becomes *even stronger*, as the low counterfactual accuracy severs any link between paying now and the lost counterfactual gain.<br>**Crux 1b:** Does the *mere logical possibility* of affecting outcomes in *unrealised branches* (via the predictor's model of your decision algorithm) constitute a form of *causal leverage* that a rational agent should utilise? | **Test Case: "Branch Existence Ignorance"**<br>Setup: Identical to CM, but the agent has *conclusive evidence* that the Heads branch *physically cannot exist or never happened* (e.g., quantum decoherence renders it impossible).<br>*UDT Prediction:* Paying remains optimal. The logical dependency in the world-program justifies it, regardless of physical branch existence.<br>*CDT Prediction:* Refusal is definitively correct. There is *literally nothing* to affect; paying is pure loss.<br>*Both agree* this test bears on the crux. |
  | **2. Core Difference in the User's Case**<br>(Coin=Tails, Demand Present) | **Pay £100:** The prior EU-maximising *policy* pays upon demand. This policy causes the Stranger to get £10k in the Heads branch. *Not* paying now reveals this policy is suboptimal, costing £10k ex ante. | **Refuse £100:** Conditional on knowing the coin is Tails *and* Omega predicted refusal, paying £100 has *absolutely no causal consequences*. The Stranger never received and never will receive anything. Paying only loses £100. | **Crux 2:** Does the predictor's use of the agent's *decision algorithm* (specifically, its output *in the counterfactual branch*) create a *causal responsibility* for the agent *in the actual branch* to act *as if* they were in that counterfactual branch, for the sake of ex ante optimality? | **Test Case: "Stranger Feedback Loop"**<br>Setup: Modify User's Case: In Heads, the Stranger *learns* if they got the £10k (and why). In Tails, the Stranger *learns* if you paid Omega £100 *unnecessarily*. Both Stranger and you care deeply about each other's opinion.<br>*UDT Prediction:* Paying likely remains optimal. The policy consideration dominates; avoiding Stranger's scorn in Tails may be outweighed by securing their gratitude in Heads.<br>*CDT Prediction:* Refusal becomes *even more critical*. Paying in Tails *directly causes* the Stranger to know you wasted £100 trying to influence an impossible outcome, maximising scorn. Refusal minimises scorn in the actual world.<br>*Both agree* this tests if "responsibility for counterfactual outcomes" overrides "direct consequences in actual branch". |
  | **3. Relationship of CM & XOR Blackmail** | **One Quarrel:** Both disputes stem from the core divergence: whether EU maximisation is defined over the prior (including counterfactual branches linked by the predictor's model) or the posterior (only the causally accessible actual branch). CM makes the benefit counterfactually explicit; XOR hides it behind logical uncertainty, but the core mechanism (predictor using algorithm output) is identical. | **Distinct Quarrels:** CM involves a direct counterfactual dependency of a *benefit* on the agent's *hypothetical* action. XOR involves the agent's *ignorance* of fixed facts determining if a *cost* is *already real*. The core difference in CM is about counterfactual influence; in XOR, both camps agree refusal is correct because there is *no* counterfactual influence to exploit – the cost is either already locked in or not. | **Crux 3:** Is the disagreement in CM fundamentally driven by *how to handle logical uncertainty about the world-state* (shared with XOR), or is it driven by *how to handle the agent's influence over counterfactual branches via their fixed decision algorithm* (unique to predictor scenarios like CM)? | **Test Case: "Predictor-Free XOR"**<br>Setup: XOR Blackmail variant where the *embarrassment trigger* (A XOR B) is *not* predicted by Omega but is a simple fixed fact unknown to you. Omega demands £X *or else* it will reveal the info *if* (A XOR B) is true.<br>*UDT Prediction:* Refusal remains optimal (as in agreed claim 4).<br>*CDT Prediction:* Refusal remains optimal.<br>*Both agree* this shows XOR isn't *inherently* about predictor-based counterfactuals. The CM dispute requires the predictor linking action to counterfactual outcomes. |

  ---

  **Analysis of the User's Case: UDT vs CDT**

  *   **UDT Answer:** Pay £100.
      *   **Reasoning:** The optimal policy (determined ex ante) is to pay upon demand. This policy results in the Stranger receiving £10k if the coin is Heads. Choosing *not* to pay in the actual Tails branch demonstrates that your policy is "Don't Pay", which would have caused the Stranger *not* to get £10k in the Heads branch. Paying £100 now, while costly, is the only action consistent with the ex ante optimal policy that secured the potential £10k gain for the Stranger.
      *   **What CDT Gets Wrong:** CDT myopically focuses only on the causally isolated Tails branch, ignoring that the *reason* the Stranger got nothing is *because* Omega predicted you would follow a policy of refusing. By refusing now, you validate that prediction and confirm the suboptimality of your policy ex ante. CDT sacrifices ex ante value for no ex post gain.
      *   **Evidence Against UDT:** If empirical data showed that agents consistently following the "Pay in this specific scenario" policy *did not* lead to higher average payoffs for strangers (or themselves in similar linked scenarios) across many instances compared to "Refuse", this would undermine the claim that this is the ex ante optimal policy. Evidence that Omega's predictions are not sensitive to the agent's *actual* decision algorithm in the counterfactual branch would also be damaging.

  *   **CDT Answer:** Refuse £100.
      *   **Reasoning:** You know the coin landed Tails. You know the Stranger received nothing. You know Omega predicted your refusal. Paying £100 *cannot* change any of these facts. It cannot cause the Stranger to receive money (that branch is closed). It cannot retroactively make Omega's prediction correct (the prediction was about *this* demand scenario in Tails, and it was "Refuse"). Paying £100 therefore has *no beneficial causal consequences whatsoever*. It only causes you to lose £100. Refusing costs nothing and changes nothing. Refusal is causally dominant.
      *   **What UDT Gets Wrong:** UDT is paying £100 for a benefit (£10k to the Stranger) that *logically could not have occurred in this branch of reality* and which *cannot be caused* by the payment. UDT is being blackmailed by a ghost – a counterfactual possibility that has been definitively extinguished by the evidence. This is irrational money burning based on a confusion between logical dependencies in a model and actual causal power in the world.
      *   **Evidence Against CDT:** If empirical data showed that agents who consistently refused in this specific scenario later discovered that, across many such interactions, the *predictions made about them in counterfactual branches* (like Heads) were systematically less accurate or led to worse outcomes *in those branches* compared to agents who paid, this would suggest a link CDT denies. Evidence that Omega (or similar predictors) actually base their counterfactual actions on the *actual algorithm* used in *this* instance, and that this algorithm's output *here* demonstrably influences counterfactual outcomes *there* over many trials, would challenge CDT's isolation of branches.

  **Summary of Quarrels:** The dispute over **Counterfactual Mugging** and the dispute over the **core divergence manifested in the User's Case** are fundamentally **one quarrel**: it concerns the rational relevance of counterfactual branches linked to the agent's decision algorithm by a predictor. The agreed position on **XOR Blackmail** arises because it lacks this specific counterfactual link; that dispute is separate and resolved. The User's Case cleanly isolates the core UDT/CDT fracture point regarding counterfactual influence via algorithmic policy.
