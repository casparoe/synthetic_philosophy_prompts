  ## Dr. Fenn's Farewell: Seeing the Shape Beneath the Sums

  Ladies and Gentlemen, colleagues, friends, family… and especially Rosalind. Eighteen years I’ve written about science, energy, and the long run. In practice, that often meant chronicling Rosalind Fenn’s patient, persistent argument with her own profession. So, being asked to speak tonight feels… well, let’s just say unexpected. After all, I’m not an old family friend. I’m the journalist who once, rather flippantly, described Rosalind’s flagship work – the guidance that shapes how governments value projects spanning lifetimes – as ‘sentimentality dressed as arithmetic’. I received in return a four-page letter, written in ink. I kept it. Not just for the stationery upgrade, but because, on the technical points, she was almost entirely right. Tonight isn’t about my conversion – turning points make poor theatre – but about honouring the mind that wrote that letter, and the decades of work it represented. A mind that insisted we see clearly what we’re *really* doing when we choose costs now over benefits later.

  Now, talking about valuing the distant future in a room like this… it’s a challenge. We have experts who breathe the rarefied air of Ramsey-rule equations, listening for every dropped decimal. We have esteemed academics who’ve argued vigorously, and in print, that Rosalind set one particular dial far too low. We have the brilliant engineers who built structures her numbers justified – and the community downstream who live with the results. And we have her wonderful family, for whom terms like ‘elasticity of marginal utility’ might as well be ancient Greek. How to speak to you all? By going back to the heart of what Rosalind fought for, for twenty years, trying to lodge it firmly in the heads of ministers and mandarins alike.

  It boils down to this: the rate used to shrink future costs and benefits isn’t a single, simple number plucked from the sky or the stock market. It’s a composite. Think of it as three distinct ingredients mixed into one pot.

  1.  **Tomorrow’s Prosperity:** We generally expect people decades hence to be richer than we are. A pound’s worth of wellbeing – shelter, food, comfort – simply *means less* to someone who has more of it. So, we naturally scale down the future value of benefits measured in wellbeing. This isn’t preference; it’s projection.
  2.  **The Shadow of Catastrophe:** Then there’s the vanishingly small, but real, chance that the world as we know it, or the specific project, simply won’t *be there* in the distant future. We make a tiny allowance for this grim possibility. This isn’t preference; it’s prudence.
  3.  **The Nudge Towards Now:** And finally… there’s the bare fact that we, human beings, sitting here today, *just like now more than later*. We prefer the bird in the hand. Taken purely on its own – the desire for immediacy, for ourselves, simply because it’s *now*.

  Rosalind’s life’s work, her quiet fury, was directed squarely at this third ingredient. She saw it not as an economic law to be measured, but as a stipulation – a choice. A small, pervasive moral failing. You cannot, she argued relentlessly, simply *read* this preference off what savers do today or what markets happen to show. Markets reflect a messy soup of motivations, risks, and information gaps – not a pure ethical stance on time itself. For twenty years, above her desk, she kept a photocopy of a paragraph from an old paper by a long-gone Cambridge mathematician. Not as a citation to wield, but as a quiet reminder – office furniture with a point: that this raw preference for the near over the far, *just because it’s near*, rests on no ethical foundation. It was her North Star, that paragraph.

  Of course, the argument isn’t settled tonight. Serious, thoughtful people disagree. They argue powerfully that observed market returns *are* evidence of genuine societal impatience, not just noise to be ignored. They warn that setting the rate too low can distort choices – making a cheaper, objectively *worse* option appear attractive compared to a more expensive, better one, simply because its benefits are further off. They point out, crucially, that the cost of a low rate – of favouring projects with very long-term payoffs – is often borne by people who are alive, and often poor, *right now*. The beneficiaries, decades hence, are faceless, unthankable. And they argue that when you honestly average over the genuine uncertainty about which precise rate is ‘correct’, the effective schedule declines with the time horizon anyway. Much of what Rosalind sought, they contend, emerges naturally from arithmetic nobody disputes.

  Hearing these points laid out, so starkly, so reasonably… it’s compelling. But Rosalind remained unmoved. Why? Because for her, it always came back to that third ingredient. Seeing it clearly, naming it as a *choice* we make, not a *fact* we find. Evidence of impatience in the market, she’d say, isn’t revelation; it’s a description of what *is*, often under pressure, not a prescription for what *ought* to be. The distortion of project rankings? That highlighted the profound ethical weight of the choice we were making, not its irrelevance. The costs falling on the present poor? This demanded careful, equitable policy *alongside* the long view, not an excuse to ignore the long view itself. The averaging over uncertainty? It smoothed the path, perhaps, but didn’t remove the fundamental ethical question baked into the core rate we started with. For Rosalind, the arithmetic only sang when you first decided the key you were playing in. The discount rate wasn’t merely a technical parameter; it was the numerical shape of our responsibility.

  So, Rosalind, as you leave the agency, the equations, the guidance, the slow argument… we honour the clarity you brought. Not just the technical brilliance – though that was formidable – but the moral clarity. You never stopped seeing the human shape beneath the sums. You never let the complexity obscure the core choice: how much weight do we, today, deliberately place on the wellbeing of those who will inherit the world we build, or fail to build? You showed us the three ingredients. You asked us to look hard at the third one. And you insisted, with ink and intellect, that it wasn’t a force of nature, but a choice we own. For that unwavering focus, that insistence on seeing the ethics within the economics… we thank you. Enjoy the view from outside the spreadsheet. You’ve earned it.
