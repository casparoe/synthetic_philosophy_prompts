prompt: |-
  I write a weekly ideas column for a general-interest magazine — science, technology, and the conceptual wreckage they leave behind — and I have a draft feature that my editor has tentatively scheduled, which means I now need it read unkindly by someone who knows the material better than I do. Please take the role of a historian and philosopher of science and technology with a working specialization in mid-century American science policy (the atomic-energy establishment, the early computing labs, the first generation of formal arguments about the governance of research) and in the conceptual analysis of technological change. I would like you to think carefully rather than quickly, and to treat this as a real editorial read rather than a courtesy pass. Two process requests before the comments themselves. First, begin with a short brainstorming section — five or six bullets — listing what would have to be true for the central analogy in my piece to hold, and naming the three or four places where a specialist in this period would most likely push back on a journalist. Only after that should you turn to the draft. Second, when you comment, work through the piece section by section rather than impressionistically, and tag each comment as concerning accuracy, argument, or interest. Where you think I have distorted a source, say what the distortion consists in — which term has been swapped for which — rather than simply marking it wrong; and where your correction rests on the excerpts I supply below rather than on your own recollection, say so, since I want to know which of your objections I can verify and which I would have to take on trust. I am not asking for a bibliography, a reading list, or citations of any kind; I have no expectation that you can supply them accurately, and a confident guess at a page number would be worse than useless to me. Please do not invent quotations, and do not correct me into a fabricated version of the text. If you are unsure whether I have got a historical detail right, flag the uncertainty explicitly instead of resolving it either way.

  The piece is built on the essay von Neumann wrote in 1955 under the title "Can We Survive Technology?" — he was by then a member of the Atomic Energy Commission and roughly two years from his death. The following excerpts are the only von Neumann material I want you to treat as authoritative; assume you have no access to anything else of his, and note that they are set here as they appear in the transcription I am working from, so the punctuation may need a further check before publication:

  > "the effect of the increased speed of technological processes was to enlarge the size of units — political, organizational, economic, and cultural — affected by technological operations."

  > "That is, instead of performing the same operations as before in less time, now larger-scale operations were performed in the same time. This important evolution has a natural limit, that of the earth's actual size. The limit is now being reached, or at least closely approached."

  > "...there is in most of these developments a trend toward affecting the earth as a whole, or to be more exact, toward producing effects that can be projected from any one to any other point on the earth. There is an intrinsic conflict with geography — and institutions based thereon — as understood today."

  > "What safeguard remains? Apparently only day-to-day — or perhaps year-to-year — opportunistic measures, a long sequence of small, correct decisions."

  Here is the draft, at roughly the length it will run:

  **THE GLOBE IS TOO SMALL**

  The man who did more than almost anyone else to make the computer age possible did not leave us a warning about machines that think. He left us a warning about a planet that has run out of room.

  Almost every retrospective invocation of von Neumann on the future quotes him on speed — on acceleration, on the quickening tempo of invention. But speed is not really his variable. The mechanism he identifies is stranger and, I think, more useful. Most human time scales are anchored to reaction times, habits, and other physiological facts about us, and those do not move. What moves is the footprint of any single technological act: "the effect of the increased speed of technological processes was to enlarge the size of units — political, organizational, economic, and cultural — affected by technological operations." In his own gloss, "instead of performing the same operations as before in less time, now larger-scale operations were performed in the same time." Acceleration therefore shows up not as a shorter interval but as a bigger unit — a village problem becomes a regional problem becomes a planetary one — and enlargement, unlike speed, has a ceiling. "This important evolution has a natural limit, that of the earth's actual size. The limit is now being reached, or at least closely approached."

  The institutional consequence follows directly. Our arrangements are territorial: jurisdictions, sovereigns, treaties, markets, all cut to the shape of the map. Technology, in von Neumann's account, quietly deletes the map. He writes that there is "an intrinsic conflict with geography — and institutions based thereon — as understood today." Intrinsic is the operative word. This is not a case of institutions failing to keep up because the people running them were slow or corrupt or underfunded; it is a case of institutions being built out of a material that technological change dissolves. And because the conflict is structural rather than moral, it cannot be settled by exhortation. Progress, on this view, cannot be slowed by agreement, since somebody always gains by going further and everyone else knows it: the ratchet turns in one direction only. Von Neumann was, in short, a fatalist about technology, and he did not apologize for it.

  That fatalism is why the essay keeps getting read as a prophecy of automation and joblessness. He does discuss automation, and he does expect the disruption to reach well past the factory floor. But the deeper anticipation lies elsewhere, in work he left unfinished at his death and his collaborators completed afterward: the theory of self-reproducing automata. A machine that can build a copy of itself is the first machine whose output is not bounded by a factory, and that, rather than unemployment, is the hinge on which the essay's argument turns. Read the two bodies of work together and you have a theory of runaway capability assembled seven decades before anyone coined a term for it.

  Which is why von Neumann now surfaces constantly in arguments about the governance of frontier computer systems. If the ratchet only turns one way, then any negotiated pause is waste paper: the defector captures the entire advantage, and the compliant party merely loses. On this reading von Neumann identified the central coordination problem of machine-intelligence policy before there was machine intelligence to coordinate about — and identified it, notably, from inside the government agency charged with managing the first technology that made the problem visible.

  He offers no program in return, and he means not to. Asked what safeguard remains, he answers: "Apparently only day-to-day — or perhaps year-to-year — opportunistic measures, a long sequence of small, correct decisions." It is a bleak place to end, and von Neumann intended it bleakly: no architecture, no treaty, no authority, only the hope that the sequence of correct decisions turns out to be long enough.

  Some further context and requests. The column will run at about eleven hundred words, so anything you think is expendable should be marked as such; I would rather cut a section than soften a claim I cannot support. My editor's standing objection to pieces of this kind is that they are reverent — that quoting a dead mathematician is a way of borrowing authority rather than making an argument — and I would like you to assess honestly whether that objection lands here. I am particularly interested in your verdict on three things: whether my gloss of the quoted passages drifts from what they actually say, and if so where; whether the move from von Neumann's skepticism about agreements to present-day arguments about coordinating the development of advanced computer systems is load-bearing or a category error, and if it is the latter, which specific disanalogy does the damage; and whether the section on self-reproducing automata earns its place or is doing rhetorical work that the quoted material does not authorize. Please close with a bottom line in one or two sentences — publishable as it stands, in need of surgery on one identified section, or wrong in its thesis — and resist the temptation to pad the read with praise. I would much rather be told the piece is mistaken than be told it is fine.
