prompt: |-
  I chair the rules committee for a seven-member appellate panel at a national medicines regulator, and before we select a voting procedure I want the requirements written down. The panel's output is not a bare verdict. We publish a single determination that records findings on an ordered sequence of questions — whether the pivotal evidence is methodologically adequate to the claim, whether the benefit–risk profile is favorable in the target population, whether the manufacturing and stability data suffice, whether the proposed labeling is adequate — and then derives the disposition from those findings by a rule fixed in advance. The determination has legal force and is treated as authority in later matters, so the reasoning is the product rather than a gloss on the result. Our present practice is an independent majority vote on each question followed by mechanical application of the rule, and two incidents have persuaded me that this is not obviously defensible.

  Incident A. On a renewal application the panel split four–three in the applicant's favor on each of the first three questions and four–three against on the fourth. The derived disposition was refusal. No member held the combination of findings the determination attributes to the panel, and six of the seven would have voted to grant had the disposition been put to them directly. Applicant's counsel now argues, in unrelated proceedings, that our determinations record views the panel does not hold.

  Incident B. On a safety suspension the sequence in which the questions were taken decided the case: addressing the adequacy of monitoring before causation produced one pattern of majorities, and reversing the order produced another, with identical votes by identical members on identical questions. One member has also stated on the record that she voted against a finding she accepted in order to secure a disposition she preferred.

  What I want is the specification, not a recommendation. Write the desiderata any aggregation procedure for a body of this kind must meet to count as adequate for our purpose, stating for each the case or consideration that motivates it and what would count as violating it. Be precise about the distinctions the list must not collapse: aggregating judgments rather than preferences; a collectively consistent set of findings as against findings attributable to some actual member or coalition; the procedure that fixes the disposition as against the procedure that fixes the published reasons; stability of the outcome as against stability of the reasoning when membership rotates or a matter is reheard. Then mark which desiderata are non-negotiable for a panel that issues binding reasoning and which are preferences of particular camps — deductive closure of the collective set, anonymity, independence across questions, unanimity preservation, responsiveness, non-manipulability, order-invariance — saying in each case what institutional commitment makes it mandatory or dispensable here.

  Where a subset cannot be jointly satisfied, that is the part I most want to see. State the clashing conditions exactly, identify what has to be given up, and say whether the surrender is forced by the logical structure of the agenda or only by our insistence on a single authored determination. Tell me also which single desideratum does the most work in ruling candidates out, and which of the things routinely demanded of such procedures are genuine requirements rather than artifacts of modeling this panel as a court rather than as a committee.

  Finally, briefly and without belaboring it: how do a premise-based procedure, a conclusion-based procedure, and a procedure that publishes several reasoned opinions while taking the disposition by simple majority fare against the list? No bibliography, no reading list, no citations — I want the reasoning, not the references.
reasoning: |-
  Hmm, the user chairs a rules committee for a seven-member appellate panel at a national medicines regulator. They need a specification of desiderata for their voting procedure, not recommendations. The panel publishes a single determination with legal force, based on findings for ordered questions, with a fixed derivation rule for the disposition.

  The user describes two incidents highlighting problems with their current system:
  - Incident A: The determination reflected a combination of findings no member actually held, leading to a refusal that six members would have opposed if directly voted on.
  - Incident II: The order of questions affected the outcome, and a member admitted strategic voting.

  Key distinctions I must address:
  - Aggregating judgments vs. preferences
  - Collectively consistent findings vs. findings attributable to actual members
  - Procedure for disposition vs. procedure for published reasons
  - Outcome stability vs. reasoning stability across membership changes or rehearings

  I need to outline mandatory desiderata (due to institutional constraints) vs. negotiable ones. Identify conflicts between desiderata, especially which are impossible to satisfy jointly and why. Highlight the most constraining desideratum.

  For the procedures:
  1. Premise-based: Majority vote on each question, then apply derivation rule.
  2. Conclusion-based: Direct vote on disposition, then reconstruct findings.
  3. Multi-opinion: Publish multiple opinions but take disposition by majority.

  Assess each against the desiderata list.

  The user wants precision, no citations, just reasoning. Focus on clarity and addressing all points without markdown.
answer: |-
  ### Desiderata for Aggregation Procedure  
  The panel issues a *single, binding determination* comprising findings on an ordered sequence of binary questions (Q1, Q2, ..., Qn) and a disposition derived via a fixed rule. The procedure must produce **collectively consistent reasoning** attributable to the panel as a whole, not merely a verdict. Below, desiderata are categorized as **non-negotiable** (NN) or **negotiable** (N), with motivations, violations, and institutional basis.  

  #### Core Distinctions  
  1. **Judgments vs. Preferences**:  
     - Judgments concern truth/falsity of questions (e.g., "Is evidence adequate?"). Preferences rank outcomes.  
     - *Collapse risk*: Modeling votes as preferences (e.g., for "grant") obscures whether findings reflect genuine assessments.  
  2. **Collective Consistency vs. Attributability**:  
     - *Collective consistency*: The published findings must logically cohere (e.g., no finding "benefit-risk unfavorable" if "evidence adequate" implies otherwise under the fixed rule).  
     - *Attributability*: Findings need not match any individual’s views (Incident A shows why attributability is not required).  
  3. **Disposition vs. Reasoning Procedure**:  
     - The procedure generating findings (reasoning) may differ from that for the disposition (e.g., disposition fixed by rule; reasoning by voting).  
  4. **Outcome vs. Reasoning Stability**:  
     - *Outcome stability*: Identical votes yield same disposition regardless of question order or irrelevant factors (Incident B).  
     - *Reasoning stability*: Identical votes yield same findings regardless of order (violated in Incident B).  

  ---

  ### Desiderata List  
  1. **Logical Consistency (NN)**  
     - *Motivation*: The determination is binding precedent; inconsistent findings (e.g., Q1 true and Q2 false when Q1→Q2) undermine authority (Incident A: disposition derived from incompatible findings).  
     - *Violation*: Published findings contradict the fixed derivation rule or each other.  
     - *Institutional basis*: Legal force requires defensible reasoning.  

  2. **Dispositional Accuracy (NN)**  
     - *Motivation*: The disposition must correctly apply the fixed rule to the findings. Incident A’s refusal was correct per the rule but based on incoherent findings.  
     - *Violation*: Disposition does not match the rule applied to published findings.  

  3. **Question Order Invariance (NN for Reasoning)**  
     - *Motivation*: Identical votes must produce identical findings regardless of question sequence (Incident B).  
     - *Violation*: Reordering questions changes findings despite identical votes.  

  4. **Non-Manipulability (NN)**  
     - *Motivation*: Members must not game the system by voting strategically against their judgment (Incident B: member voted against belief to sway disposition).  
     - *Violation*: A member can achieve a preferred outcome by misrepresenting views.  

  5. **Reasoning Robustness (N)**  
     - *Motivation*: Findings should be stable under minor membership changes or rehearings (avoiding flip-flopping on identical evidence).  
     - *Violation*: Rotating one member alters findings despite identical votes/evidence.  
     - *Institutional basis*: Desirable for precedent but dispensable if conflicts with NN goals.  

  6. **Deductive Closure (N)**  
     - *Motivation*: If majority judgments imply a logical consequence (e.g., Q1 and Q2 true imply Q3 true), the collective set should reflect it.  
     - *Violation*: Findings omit logically required conclusions (e.g., Q3 false when Q1 and Q2 true imply Q3 true).  
     - *Institutional basis*: Ideal for coherence but not mandatory if procedure guarantees consistency.  

  7. **Anonymity (N)**  
     - *Motivation*: Votes are secret to prevent coercion.  
     - *Violation*: Votes are traceable to members.  
     - *Institutional basis*: Protects integrity but dispensable if procedure is secure.  

  8. **Unanimity Preservation (N)**  
     - *Motivation*: If all members agree on a finding, it should be reflected.  
     - *Violation*: Unanimous view on a question is overruled.  
     - *Institutional basis*: Intuitive fairness but may conflict with consistency.  

  9. **Responsiveness (N)**  
     - *Motivation*: Changing a member’s vote on a question should potentially alter findings.  
     - *Violation*: A vote change never affects outcomes (e.g., due to supermajority requirements).  

  ---

  ### Conflicts and Trade-offs  
  - **Irreconcilable Conflict: Logical Consistency vs. Attributability & Independence**  
    - *Conflict*: Requiring findings to be both (a) logically consistent and (b) directly attributable to a member or coalition (e.g., via majority votes on each question) is impossible when judgments are interdependent (as in fixed derivation rules).  
    - *Example*: In Incident A, majority votes per question produced consistent individual sets but an inconsistent collective set.  
    - *Forced by*: Logical structure of the agenda. If questions are logically connected (e.g., Q1 and Q2 jointly determine disposition), independent aggregation cannot guarantee consistency (McGarvey’s theorem).  
    - *Surrender*: Attributability must be abandoned. The panel’s findings need not mirror any member’s views; they are a *collective construct*.  

  - **Secondary Conflict: Order Invariance vs. Multi-Opinion Procedures**  
    - *Conflict*: Publishing several opinions (e.g., concurrences) may violate order invariance if opinions are sequenced arbitrarily.  
    - *Forced by*: Institutional insistence on a *single* determination. Multi-opinion systems can be order-invariant but lack a unified voice.  

  **Most Constraining Desideratum**: **Logical Consistency** (NN). It rules out all procedures using independent majority votes on interconnected questions (current system) and forces collective-rationality approaches.  

  **Misplaced Requirements**:  
  - **"Court-like" Artifacts**: Demanding attributability (findings match a member) or treating questions as independent (ignoring fixed derivation rules) misapplies court models. This panel’s reasoning is a product, not a record of individual views.  
  - **Unanimity/Responsiveness**: Often prioritized in preference aggregation but secondary here; consistency and non-manipulability dominate.  

  ---

  ### Evaluation of Candidate Procedures  
  1. **Premise-Based Procedure**  
     - *Description*: Majority vote on each question, apply fixed rule to derive disposition.  
     - *Assessment*:  
       - Violates **Logical Consistency** (Incident A) and **Question Order Invariance** (if votes are sequential/strategic).  
       - Fails **Non-Manipulability** (Incident B).  
       - Satisfies Attributability (trivially) but this is dispensable.  
     - *Verdict*: Unacceptable; fails NN desiderata.  

  2. **Conclusion-Based Procedure**  
     - *Description*: Vote directly on disposition (by majority), then assign findings by chair/algorithm to fit the rule.  
     - *Assessment*:  
       - Ensures **Dispositional Accuracy** and **Logical Consistency** (findings fabricated to fit).  
       - Violates **Non-Manipulability** (members vote strategically on disposition, not questions).  
       - Undermines authority: Findings are post hoc and may not reflect deliberations (Incident A: counsel’s challenge worsens).  
     - *Verdict*: Fails due to manipulability and loss of reasoning integrity.  

  3. **Multi-Opinion with Majority Disposition**  
     - *Description*: Publish reasoned opinions from all members; disposition by majority vote on outcome.  
     - *Assessment*:  
       - Satisfies **Attributability** and **Unanimity Preservation**.  
       - Violates **Single Determination** (institutional requirement), risking contradictory precedents.  
       - May violate **Reasoning Robustness** (small membership changes alter published rationale).  
       - **Logical Consistency** not guaranteed (opinions may conflict).  
     - *Verdict*: Unworkable; prioritizes individual views over collective reasoning.  

  ---

  ### Summary  
  **Non-negotiable core**: Logical consistency, order invariance, non-manipulability, and dispositional accuracy. These force abandonment of attributability and independent voting.  
  **Optimal path**: A procedure ensuring collective consistency (e.g., deliberation-guided voting with agenda robustness) is unavoidable. The key is accepting that findings are *emergent* from the procedure, not attributable.  
  **Critical trade-off**: Sacrificing attributability (to satisfy consistency) is logically necessary, not merely institutional.
