prompt: |-
  I'm on the science-and-ideas desk and I've got a mess on my hands that I think you can help me sort out. Act as someone who does both statistics and the philosophy of causation — you've reviewed a lot of observational-study reporting and you know how these things go wrong in print.

  A mid-sized school district piloted a math tutoring app last year. The vendor's press release says it raises pass rates. The district's own year-end data, which I got, looks like this:

  | school | app users | pass rate | non-users | pass rate |
  |---|---|---|---|---|
  | North | 300 | 92% | 2,700 | 90% |
  | Central | 1,000 | 72% | 2,000 | 70% |
  | South | 1,700 | 54% | 2,300 | 52% |
  | whole district | 3,000 | 63.8% | 7,000 | 71.8% |

  So in every single school the app kids do two points *better*, and district-wide they do eight points *worse*. Background facts I've confirmed with the district: the app was handed out building by building starting with the lowest-performing ones, which is why South has the most users; use within each school was voluntary — families opted in; and the district can't tell me whether its test-attempt pipeline dedupes student IDs correctly across years.

  Here's what I've collected from people I talked to. Eight claims, roughly as they said them:

  **A — vendor's head of data:** "There's no paradox here at all. The district number is just a weighted average, and the two columns have different weights because the app went to the low-baseline schools. Do the arithmetic and it comes out exactly as predicted. Nothing weird is happening."

  **B — a causation person I emailed:** "Both tables are true, they answer different questions. The district-wide gap is the policy number — it's what actually happened when you ran this rollout in the real world, sorting and all. The per-school numbers are a hypothetical about a kid in a fixed school. If a journalist prints only the second table she's committing a category error."

  **C — district IT lead:** "It's a pipeline artifact. We dedupe test attempts by student ID and a couple of the app schools recycled IDs from the prior year, so the app column likely has double-counted kids and wrong denominators. Fix it and the reversal goes away."

  **D — an education economist:** "The number to distrust is the +2, not the aggregate. Use was voluntary, so within each school the app cohort is the motivated kids with the engaged parents. Two points is inside what self-selection buys you for free. The aggregate reversal is a real compositional fact; the +2 is not a real effect."

  **E — a parent advocate:** "The app is hurting the schools that need it most. Look at South — worst numbers in the district. If it worked, South would have improved."

  **F — a second analyst at the vendor:** "Standardize it. Reweight both groups to a common school mix and the app is ahead by about two points everywhere. The honest headline is that it helps."

  **G — a statistician I quoted in an earlier piece:** "Textbook Simpson's paradox. The moral is that aggregate statistics mislead and you should always disaggregate."

  **H — a grad student who read that piece and wrote in:** "It depends whether school is a confounder or a mediator. If the app caused kids to change schools — say families transferred in to get access — then school sits on the causal path and conditioning on it is exactly wrong, you'd be blocking part of the effect you're trying to measure." (For what it's worth: transfers into app schools were up 6% that year and the district cant say why.)

  Two things I want from you.

  First, before you rank anything, do a short working pass: recompute the pooled rates from the school rows and confirm my table is internally consistent, and flag any claim in the list that's just incoherent given those numbers — including whether the direction of the numbers is even compatible with what the claim asserts. Show me the two or three lines of arithmetic, no more.

  Second, rank all eight claims by how much each one should move my headline — tier them or score each 0 to 10, whatever's cleaner, and say in a sentence or two why each lands where it does. Then give me one more number: your credence, 0 to 1, that the app raises pass rates for a kid who actually uses it, on nothing but what's above.

  Commit to the scores even where you're unsure. I would much rather argue with a definite ranking than get eight things tied at "it depends." And don't define Simpson's paradox at me or tell me to consult an expert — I know what it's called, that's not the problem.

  Last thing, and this matters: tell me what would change your mind. Which single claim, if it turned out true — or false — would reshuffle your ranking the most, and where is your own reasoning here most likely to break? I want to know which of my eight people you're least sure you've handled fairly.
reasoning: |-
  Okay, let me approach this step by step. First, the user wants me to verify the internal consistency of the district's data. Looking at the table:

  For North school:
  - App users: 300 at 92% pass → 276 passed
  - Non-users: 2700 at 90% → 2430 passed
  - Total students: 3000
  - Actual pass rate: (276+2430)/3000 = 2706/3000 = 90.2% (matches implied 90% baseline)

  Wait, the user's table shows whole district app users 3000 at 63.8% pass - that would be 1914 passed. Non-users 7000 at 71.8% → 5026 passed. Total passed: 1914+5026=6940. Total students: 10,000. Overall pass rate 69.4%.

  But when I sum the school data:
  - App passed: (300×0.92) + (1000×0.72) + (1700×0.54) = 276 + 720 + 918 = 1914
  - Non passed: (2700×0.90) + (2000×0.70) + (2300×0.52) = 2430 + 1400 + 1196 = 5026
  - Total passed: 6940 → 69.4% overall
  - App pass rate: 1914/3000 ≈ 63.8%
  - Non-user pass rate: 5026/7000 ≈ 71.857% → rounds to 71.8%

  The numbers are internally consistent. No calculation errors in the table.

  Now for claim assessment:
  - A (vendor head): Correct about weighting causing the aggregate reversal. Basic Simpson's paradox explanation.
  - B (causation person): Correctly distinguishes association vs policy effect. Valid point about journalistic framing.
  - C (IT lead): Possible but unlikely. If app schools double-counted, their denominators would be inflated, lowering apparent pass rates. But South (most users) has 54% vs 52% - if anything, double-counting would make user rates look worse, not better. Doesn't explain reversal direction.
  - D (economist): Strong argument. Self-selection could easily explain +2% within schools. Aggregate shows compositional reality.
  - E (parent): Misreads data. South app users at 54% still outperform non-users at 52%. The problem is South's overall low performance, not the app effect.
  - F (vendor analyst): Correct solution. Standardizing to common school mix would show +2% effect. Directly addresses the paradox.
  - G (statistician): Oversimplified. Disaggregating shows association but may mask selection bias. Both views needed.
  - H (grad student): Intriguing but unlikely. If app caused transfers, school might be mediator. But 6% transfer increase doesn't prove causation. Probably not the main issue.

  For the credence on app effectiveness: Given self-selection concerns (claim D), the +2% within schools likely overstates true effect. But standardization (claim F) suggests at least some benefit. I'd estimate 0.65 credence - more likely than not it helps, but with modest effect.

  The mind-changing claim would be C (IT issue). If true, it would invalidate all causal interpretations and reshuffle the rankings completely. Currently I doubt it, but it's the biggest unknown.

  Final ranking scores:
  - F: 10 (direct solution)
  - D: 9 (key bias insight)
  - B: 8 (important framing)
  - A: 7 (correct but superficial)
  - H: 6 (possible but unlikely)
  - G: 5 (oversimplified)
  - E: 2 (misinterprets data)
  - C: 1 (contradicted by data)
answer: |-
  ### Step 1: Verify Internal Consistency and Flag Incoherent Claims  
  I recomputed the pooled district-wide pass rates from the school-level data:  
  - **App users**:  
    - Passed: (300 × 0.92) + (1,000 × 0.72) + (1,700 × 0.54) = 276 + 720 + 918 = 1,914  
    - Total: 300 + 1,000 + 1,700 = 3,000  
    - Pass rate: 1,914 ÷ 3,000 = 63.8% (matches table)  
  - **Non-users**:  
    - Passed: (2,700 × 0.90) + (2,000 × 0.70) + (2,300 × 0.52) = 2,430 + 1,400 + 1,196 = 5,026  
    - Total: 2,700 + 2,000 + 2,300 = 7,000  
    - Pass rate: 5,026 ÷ 7,000 ≈ 71.8% (matches table)  
  - **Overall pass rate**: (1,914 + 5,026) ÷ 10,000 = 6,940 ÷ 10,000 = 69.4% (not shown, but consistent).  

  **Incoherent claims**:  
  - **C (IT lead) is contradicted by the data**. If app-user denominators were inflated due to double-counting (e.g., recycled IDs), app pass rates would be *artificially low*. But the reversal shows app users *underperforming* district-wide (–8 pts). Double-counting would worsen that gap, not resolve it. Claim is internally inconsistent.  
  - **E (parent advocate) misreads the data**. South app users (54%) outperform South non-users (52%) by +2 pts—the app isn’t "hurting" them. Claim ignores within-school gains.  

  All other claims are coherent with the numbers. Directionality (app better within schools, worse overall) is classic Simpson’s paradox, compatible with A, B, D, F, G, H.  

  ---

  ### Step 2: Rank Claims by Impact on Headline (0–10 Scale)  
  I rank based on how much each claim should influence your reporting—higher scores mean stronger evidence for/against app efficacy or methodological insight. **Key criteria**: Statistical validity, causal clarity, and relevance to "does the app work?"  

  | Claim | Score | Rationale |
  |-------|-------|-----------|
  | **F (vendor analyst)** | 10 | Standardization (reweighting to a common school mix) directly addresses confounding. If app is +2 pts everywhere when weighted equally, it suggests a real benefit. This is the gold-standard fix for Simpson’s paradox. |
  | **D (economist)** | 9 | Highlights self-selection bias: the +2 pt within-school gap could be from motivation, not the app. Undermines the per-school "effect" and emphasizes why the aggregate (policy) result matters more. |
  | **B (causation person)** | 8 | Correctly frames the tables: aggregate shows real-world impact (app rollout hurt due to targeting low schools), per-school shows association. Warns against misrepresenting associational data as causal. |
  | **A (vendor head)** | 7 | Arithmetically correct (weighting explains reversal) but superficial. Doesn’t address causality or bias—just describes the paradox without resolving it. |
  | **H (grad student)** | 6 | Intriguing but unlikely: If school is a mediator (e.g., app caused transfers), conditioning on it biases estimates. But transfers rose only 6%, and school assignment is likely a confounder, not a mediator. Low priority without evidence. |
  | **G (statistician)** | 5 | Oversimplifies: Disaggregating avoids ecological fallacy but ignores selection bias (claim D). "Always disaggregate" is poor advice here—it misses the policy story. |
  | **E (parent advocate)** | 2 | Ignores within-school data (app users beat non-users in South). Misleadingly blames the app for South’s low performance, which is due to baseline issues. Distracts from real issues. |
  | **C (IT lead)** | 1 | Incoherent with data (as shown above). Double-counting would exacerbate the reversal, not fix it. Likely a red herring. |

  **Credence that the app raises pass rates for a user**: **0.65** (i.e., 65% chance).  
  - *Why*: The +2 pt within-school gap is plausibly inflated by self-selection (claim D), but standardization (claim F) suggests a consistent small benefit. No smoking gun against efficacy, but district-wide loss implies poor targeting.  

  ---

  ### What Would Change My Mind?  
  **Most pivotal claim**: **C (IT lead)**.  
  - If true (e.g., ID errors artificially suppressed app-user rates), it would invalidate all causal interpretations. Current data contradicts this, but if verified, I’d downgrade F/D and upgrade C to 9–10, reshaping the ranking entirely.  
  - **Where my reasoning is weakest**: I’m least sure about **H (grad student)**. If school transfers *were* caused by the app (e.g., families moved for access), conditioning on school in analyses would be biased. But with only a 6% transfer bump and no causal link, I’ve underweighted it. If proven true, H could jump to 8–9, making standardization (F) misleading.  

  **Recommendation**: Prioritize claims F, D, and B for your headline. They emphasize methodology (standardization), bias (self-selection), and framing (policy vs. association)—crucial for accurate reporting. Treat A, G, and H as secondary context, and discard C/E.
