prompt: |-
  You are a philosopher of biology who also works in the economics of information: you know the technical literature on animal signals, the game theory behind separating and pooling equilibria, cheap talk, and countersignaling, and the empirical disputes over whether signal cost is really doing the work that popular accounts assign to it. Please reason carefully from first principles rather than reaching for the standard popular-science version of this material. I have no web access, so I want analysis, not scholarship: no bibliography, no reading list, no citations, and please do not manufacture references. Names of theorists are fine where genuinely useful; dates and titles are not needed.

  Background. I sit on the grants committee of a mid-sized private foundation. A colleague has circulated a strategy memo arguing that our scoring rubric, which penalizes charities with high overhead ratios, is exactly backwards. His central analogy: a charity's annual gala, its marble lobby, and its outsized communications budget are the nonprofit world's peacock's tail. On his account, the cost of a peacock's tail cannot be faked — a bird in poor condition simply cannot grow one — so a costly display is a reliable guarantee of underlying quality, and wastefulness is the mechanism that makes it reliable. Applying this to charities, he claims that conspicuous overhead works the same way: only an organization with genuinely strong impact can afford to burn that much, and therefore visible waste is positive evidence of effectiveness rather than a red flag. The memo draws two practical conclusions: we should delete the overhead-ratio penalty from our rubric, and we should stop funding independent outcome evaluation, since reported outcomes are cheap talk from an interested party while the cost signal is unfakeable.

  One further move matters. When I noted that the two organizations our independent evaluators rate highest in the portfolio have overhead below the sector median, he replied that this is just what the theory predicts — the very best performers have no need to signal. I want you to address whether that reply rescues the analogy or makes it unfalsifiable.

  Deliverables, in this order:

  1. Begin with a short, explicit brainstorm: enumerate every feature of the peacock's-tail case that the analogy could plausibly be borrowing, before deciding which of them the memo actually depends on.

  2. A correspondence table mapping the source onto the target — tail, its metabolic and predation costs, condition-dependence, the chooser, the chooser's preferences, the quality being advertised, the heritability of that quality, who bears the cost, how often the cost is paid, and any further element you think load-bearing. Mark rows where there is no plausible counterpart at all, and say so plainly rather than forcing a fit.

  3. The disanalogies, split into two piles: those that are decisive for the memo's two conclusions, and those that are merely interesting and do no work against them. State what makes a disanalogy decisive in this particular use, not in the abstract.

  4. What the source quietly imports that the target lacks — in particular, what has to be true of the chooser for a costly display to track quality, and whether the foundation occupies that role. Note also whether "costly" and "differentially costly" have been run together anywhere in the argument.

  5. Whether any weaker conclusion in the neighborhood survives: is there a claim about what high overhead reliably indicates that the analogy does support, and what would have to be true of it? Be specific about the difference between what the signal reveals and what the memo wants it to reveal.

  6. Whether a better analogy exists for the phenomenon the memo is groping toward, what it would predict differently, and where it too would break.

  Keep the whole thing to roughly 1,000–1,400 words, written for an audience that is quantitatively literate but not a specialist in signaling theory. Your verdict should concern the memo's conclusions — deleting the overhead penalty and deprioritizing outcome evaluation — not the general usefulness of signaling language.

  End with a single final line in exactly this form, with nothing after it:

  Verdict: HOLDS | PARTLY HOLDS | FAILS — <if PARTLY HOLDS, a phrase naming which conclusion survives>
reasoning: |-
  Hmm, the user is presenting a complex analogy between biological signaling and nonprofit evaluation. They sit on a grants committee where a colleague argues that high charity overhead is like a peacock's tail - a costly signal of quality. The colleague wants to remove overhead penalties and stop funding independent evaluations. 

  First, I need to deconstruct the peacock's tail analogy properly. The core biological features include: condition-dependent cost, genetic heritability, mate choice context, predation tradeoffs, and evolutionary stability. But when mapping to charities, key elements like heritability and consistent chooser preferences have no counterpart. 

  The decisive flaws become clear when examining what makes biological signals work: the cost must correlate directly with the advertised quality (fitness), and receivers must consistently reward only honest signals. For charities, high overhead costs don't necessarily correlate with impact quality - they might indicate inefficiency or different priorities. More critically, donors aren't consistent "choosers" applying uniform evolutionary pressure; foundations actively shape criteria rather than passively responding to signals.

  The "countersignaling" defense (that top performers don't need to signal) ironically undermines the analogy. In biology, countersignaling works because minimal displays still convey quality through alternative channels (like behavioral dominance). But if foundations abandon outcome evaluation, they remove the very channel that could validate countersignaling in charities.

  A weaker interpretation might survive: high overhead could signal financial stability rather than impact. But this doesn't support dropping outcome measures. A better analogy might be luxury branding, where costs signal market position - but again, this doesn't equate to effectiveness.

  Ultimately, both of the memo's conclusions fail. Removing overhead penalties ignores that costs aren't condition-dependent for impact, and abandoning evaluations leaves no verification mechanism. The biological analogy quietly imports assumptions about receiver consistency and direct fitness links that don't hold for charities.
answer: |-
  ### 1. Brainstorm: Features of the Peacock's-Tail Analogy  
  The peacock's tail in sexual selection theory relies on:  
  - **Costliness**: High metabolic/nesting costs and predation risk.  
  - **Condition dependence**: Only high-fitness individuals can afford the tail.  
  - **Honesty enforcement**: Cost prevents cheating by low-fitness signalers.  
  - **Receiver benefit**: Females gain genetic quality for offspring.  
  - **Evolutionary stability**: Signals align with receiver preferences through heritability.  
  - **Frequency dependence**: Signal value depends on population averages.  
  - **Countersignaling**: Exceptionally fit individuals may signal minimally.  

  The memo borrows **costliness**, **condition dependence**, and **countersignaling**. It ignores **heritability**, **receiver benefit**, and **evolutionary stability**.  

  ---

  ### 2. Correspondence Table  
  | Element                 | Peacock's Tail (Source)                     | Charity Overhead (Target)                     | Plausible? |  
  |-------------------------|---------------------------------------------|-----------------------------------------------|------------|  
  | **Signal**              | Tail                                        | High overhead (gala, marble lobby, etc.)      | Partial    |  
  | **Cost type**           | Metabolic, predation risk                   | Financial                                     | Weak       |  
  | **Cost bearer**         | Signalers (males)                           | Charity (potentially diverting donor funds)   | Yes        |  
  | **Cost paid**           | Continuously, lifespan                      | Annually, project cycle                       | Partial    |  
  | **Advertised quality**  | Genetic fitness, disease resistance         | Programmatic impact, organizational strength  | **No**     |  
  | **Condition dependence**| Tail size covaries with fitness             | Overhead costs covary with impact?            | **Unlikely**|  
  | **Chooser**             | Peahens                                     | Donors, foundations                           | Partial    |  
  | **Chooser preference**  | Heritable preference for tails              | Foundations seek impact; donors may prefer prestige | **No** |  
  | **Honesty mechanism**   | Cost makes cheating unaffordable            | High overhead "unfakeable" by weak charities? | **No**     |  
  | **Heritability**        | Signal/response coevolve                    | No equivalent dynamic                         | **No**     |  
  | **Countersignaling**    | Elite males may use minimal displays        | Top charities have low overhead               | Borrowed   |  

  **Key gaps**: No heritable link between signal and quality; no coevolution of signal/receiver preferences; charities lack "fitness" analog; foundations aren't selecting for genetic gain.  

  ---

  ### 3. Disanalogies  
  **Decisive for the memo’s conclusions**:  
  - **No condition dependence for impact**: A charity’s overhead costs (e.g., galas) don’t mechanically covary with program effectiveness. Unlike peacocks, a charity can "grow a tail" via debt or unrestricted grants without underlying strength.  
  - **Chooser incentives misaligned**: Foundations seek *impact*, not signaler fitness. High overhead doesn’t benefit the foundation (unlike peahens gaining genetic quality).  
  - **No honesty enforcement**: Weak charities *can* fake high overhead (e.g., via splashy events funded by earmarked donations), breaking the unfakeability claim.  
  - **Countersignaling requires validation**: In biology, countersignaling works because minimal displays *still convey quality* (e.g., through behavioral dominance). If foundations abandon outcome evaluation, they have no way to distinguish true elites from low-effort charities.  

  **Merely interesting (non-decisive)**:  
  - Costs are in different currencies (metabolic vs. financial).  
  - Charities operate in regulated markets; peacocks in an evolutionary game.  
  - Overhead costs can be manipulated via accounting, unlike biological constraints.  

  ---

  ### 4. What the Analogy Covertly Assumes  
  - **Chooser behavior is critical**: For costly signals to track quality, choosers must *consistently reward signalers proportionally to the signal*. Foundations don’t do this—they penalize overhead. If they reversed course, charities might inflate overhead strategically, inviting fakery.  
  - **Differential cost conflated**: The memo treats "costly" and "differentially costly" (i.e., cheaper for high-quality types) as identical. Only the latter enforces honesty. A marble lobby is equally costly for all charities—it lacks condition dependence.  
  - **The foundation isn’t the chooser**: In the analogy, the foundation is the peahen. But foundations actively *shape* charity behavior via grants, unlike passive biological selectors.  

  ---

  ### 5. Weaker Surviving Conclusion  
  The analogy *might* support:  
  > High overhead could signal **financial stability** or **donor appeal**, not impact.  

  **Conditions required**:  
  - Overhead must be *differentially costly*: Only financially robust charities can sustain waste without collapsing.  
  - Foundations must value stability over impact (which they don’t).  

  **Gap**: Financial stability ≠ program effectiveness. A charity burning funds on galas might survive long-term but achieve little—like a peacock with a large tail but poor immunity. The memo wrongly conflates *organizational persistence* with *impact*.  

  ---

  ### 6. A Better Analogy: **Luxury Branding**  
  - **Source**: High prices and lavish stores signal exclusivity.  
  - **How it fits**:  
    - Costs (e.g., flagship stores) are condition-dependent: Only truly desirable brands can profit from them.  
    - Countersignaling: Elite brands (e.g., Brunello Cucinelli) use subtlety; mid-tier brands shout.  
  - **Predicts differently**:  
    - High overhead would signal **market position** or **donor cachet**, not impact.  
    - Top charities would avoid waste not because they’re elite, but because their brand is already established.  
  - **Where it breaks**:  
    - No mechanism linking branding to social outcomes.  
    - Foundations care about impact, not prestige.  

  ---

  ### Final Assessment  
  The memo’s analogy **fails** for its intended purpose:  
  1. **Overhead isn’t condition-dependent for impact**. A struggling charity can host a gala with earmarked donations; a thriving one may minimize overhead to maximize output.  
  2. **Dropping outcome evaluation destroys signal validation**. Unlike peahens (who "know" tails correlate with fitness), foundations lack innate discernment. Independent evaluation is the *only* way to assess impact—abandoning it makes *all* signals unverifiable, including overhead.  
  3. **Countersignaling defense is circular**: If overhead signals nothing without outcome data, low overhead in top charities proves nothing. It could mean efficiency—or inadequate investment in capacity.  

  **Verdict: FAILS**
