  Good morning. Before we unveil her, I need to speak plainly about Nora. Not about the theft, or the insurance, or the foundry’s hard work – though all that matters. I need to speak about what stands under that tarp, and what we mean when we say it’s her.

  On my desk sits a shoebox. Inside it is a long, rough piece of bronze, cooled in the shape of the channel the molten metal ran through to fill the mold. Danny from Kestrel Foundry calls it the sprue. It’s made of the exact same stuff as the statue we’re about to see – some of it from the bronze that came back from the smelter, some of it new. It’s the same metal. But it was never Nora. It was just the path the metal took. Danny suggests we mount it beside her. It’s the shoebox problem: same stuff, never shaped. It’s metal that could have been part of her, but never was.

  Then there’s the shoulder. Eighty-eight years ago, Elias Vane pressed his thumb into the clay, shaping Nora before the mold was made. That thumbprint, a shallow whorl, was captured in the plaster mold we kept in our storeroom. It was on the old bronze. When Kestrel poured the new metal into that very same mold – the mold Vane himself created – the metal flowed into that hollow. The new bronze cooled, and there it was again: the same thumbprint, in precisely the same spot, to the millimeter. It looks identical. It *is* identical, in shape and place. But is it Vane’s thumbprint? Or is it the mold’s memory of it?

  **(Pause)**

  Our own museum records can’t quite agree. For the insurer, for the ledger, I closed the file on the stolen statue in 2019 and opened a new one for the recasting. That’s what the paperwork demands. But downstairs, the letters children write to Nora every spring? They still go into the *old* file. The one marked 1931. Nobody could bring themselves to move them. So the filing cabinet itself holds both answers: new object, same Nora. It’s a bit like finding an old key that still fits a lock you thought was changed.

  **(This is the moment: The children will likely chuckle at the image of the confused filing cabinet. Alma Fitch will recognize it as the central paradox – the institution holding contradictory truths simultaneously, reflecting the town's lived experience versus formal record-keeping.)**

  So, what are we unveiling? Is it the same object that stood here since 1931? No. That bronze was taken, melted down. What’s under the tarp was poured just last year, by the skilled hands at Kestrel Foundry. They used a mold from 1931 and some metal that came back to us – metal that had been Nora, mixed with metal that never was. They did remarkable work, and they deserve our deep thanks for bringing Nora back to us. But they didn’t sculpt her. They *recast* her, using the sculptor’s own mold. The shape is Vane’s. The thumbprint is the impression *he* made. The foundry gave her back her body, using the mold he left behind and metal that holds echoes of her own.

  But is it Nora? That’s the other question. That’s the question Reverend Talbot asked me: does the blessing from 1987 still hold? That blessing wasn’t just over bronze. It was over what Nora *meant* to us, standing sentinel here, holding her lantern. It was over the stories told, the letters written, the memories held in this place. The thieves took the bronze, but they couldn’t take *that*. That lived here, with us. When we look at this figure, poured from Vane’s mold, placed back on her plinth, holding her lantern just so… we see *Nora*. We recognize her. The town’s memory, our connection, finds its anchor again. That blessing? It was for *this* – for the place she holds in the life of the town. And that hasn’t been broken. It’s been waiting, like Nora herself, for her to come home. So, Reverend, I believe the blessing still holds the harbor. This statue standing here *is* its vessel again.

  To Marian Vane: This figure standing here carries the exact shape your grandfather gave Nora in 1931. His hand is in the mold, his thumbprint is on her shoulder. This is his work, returned.

  To Danny and the Kestrel crew: You didn’t just deliver metal. You poured life back into Vane’s creation. You used skill and care to resurrect her form. You brought her home. Thank you.

  To my daughter: You see the difference clearly. This bronze cooled in 2023, not 1931. The thumbprint is a cast, not a press. You’re right. It’s a new object. But the town? The town sees Nora. And sometimes, what a town holds onto *is* the thing.

  As for the sprue in the shoebox? Danny’s right. Let’s mount it beside her. It’s the perfect piece for us. It’s the metal that flowed through the channel but didn’t become her shape. It’s the part that was only ever potential, only ever the path. It reminds us of the journey, the loss, the metal that came back, and the shape that endured. It’s not Nora. But it belongs beside her story.

  So, let’s welcome her back. The same Nora? In shape, in spirit, in the harbor’s heart, yes. A new object? In substance, in the date it cooled, yes too. And both those truths can stand together on this plinth, just like Nora and the sprue. She’s home.

  **(After the speech: I have committed you to the position that while the physical statue is a new object cast in 2023, it is Nora because it embodies Vane's original artistic intent and seamlessly resumes the town's enduring relationship and meaning invested in the figure.)**
