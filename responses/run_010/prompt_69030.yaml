prompt: |-
  I run grantmaking at a smallish foundation (~$25m a year) that switched over to scoring every proposal in wellbeing-adjusted life years per dollar, and its gone about how you'd expect. Twice a year some proposal comes in with a cost effectiveness number so far off the chart that it makes the rest of the portfolio look pointless — usually something serving a few dozen people in genuinely awful states, where the self-reported swings are enormous. Half my board wants to follow the numbers wherever they lead. The other half says we're getting mugged by whoever is loudest about their own suffering, and that this is just the utility-monster objection wearing a spreadsheet. Neither side will move and I'm the one who has to write the memo.

  So: build me a triage procedure I can actually run on a proposal in an afternoon, with no philosopher on staff and one part-time health economist on retainer. Ordered questions, what counts as a sufficient answer to each, where it outputs "the number stands, fund it," where it outputs "discount or cap the wellbeing estimate" and by roughly how much, and where it stops and hands the thing to the board because it's a values call dressed up as a measurement. Be explicit about interpersonal comparison: when is a 9-point reported improvement in one person's life worth more than a 0.3-point improvement in two thousand people's, and what evidence would distinguish a real monster from an artifact of the scale, of hedonic adaptation, of who bothered to answer the survey, or of the baseline we picked? Flag every step that's a fudge rather than a finding.

  Then run it on three: (a) a palliative program for ~40 people a year with a rare, extremely painful degenerative condition — huge reported relief, ruinous cost per person; (b) an immersive wilderness program giving a small number of young adults what they describe as life-defining peak experiences, big short-term spikes, no evidence of durable gains at two years; (c) a dirt-cheap app-delivered CBT program, tiny measured gain per user, massive reach.

  Be straight with me — at least one of those three should come out in a way my board will hate, and I want you to say which and why. And tell me where the procedure sneaks in prioritarianism or some other fairness constraint that total-wellbeing maximization was supposed to make unnecessary. If Nozick were looking at my flowchart over my shoulder, which box would he point at?
reasoning: |-
  Hmm, the user is running grantmaking at a foundation that scores proposals using wellbeing-adjusted life years (WELLBYs) per dollar. They're facing internal conflict because some proposals show extreme cost-effectiveness numbers due to serving small groups with high reported wellbeing improvements. The board is split between following the numbers and fearing they're being manipulated by "utility monsters."

  I need to build them a practical triage procedure they can apply in an afternoon without specialized staff. The key challenges include distinguishing real high-impact cases from measurement artifacts, handling interpersonal comparisons of wellbeing, and addressing fairness concerns that pure utilitarianism ignores.

  The procedure needs to:
  - Be executable in one afternoon
  - Require no philosopher on staff (just a part-time health economist)
  - Output clear decisions: "fund as scored," "discount estimate," or "send to board"
  - Explicitly address when small gains for many outweigh large gains for few
  - Identify measurement artifacts (scale misuse, adaptation, sampling bias, baseline issues)
  - Flag where value judgments are sneaking in
  - Apply to three test cases

  For the test cases:
  - (a) Palliative care for rare painful condition: high relief, high cost
  - (b) Wilderness peak experiences: big short-term spikes, no durability
  - (c) Cheap CBT app: tiny gains per user, massive scale

  The user wants honesty - at least one outcome should disappoint their board. They also want to know where prioritarianism (favoring the worse off) creeps in despite total wellbeing maximization, and where Nozick would object to the utility monster issue.

  The core tension is between maximizing total wellbeing and avoiding having all resources captured by those who report extreme suffering or capacity for extreme joy. The procedure must navigate:
  1. Validity of wellbeing measurements
  2. Durability of effects
  3. Scale and distribution questions
  4. Hidden value judgments

  For the triage flowchart, I'll create a sequence of ordered questions with clear thresholds. Key steps should include:
  - Checking for measurement artifacts (scale anchoring, response bias)
  - Assessing durability beyond reporting period
  - Evaluating counterfactuals and baseline issues
  - Looking for independent evidence beyond self-report
  - Considering if gains represent genuine relief versus temporary states
  - Applying explicit discounts for various risk factors

  The wilderness program (b) should probably get capped hard due to lack of durability evidence, which the "follow the numbers" board faction might dislike. The CBT app (c) might get boosted for scale, annoying those who prefer transformational interventions. The palliative care (a) might trigger the utility monster debate most directly.

  Nozick would likely object at the point where we implicitly prioritize relieving extreme suffering over creating more total wellbeing - which will inevitably happen when we validate that some suffering is truly severe enough to warrant disproportionate resources. That's where prioritarianism sneaks in through the back door.
answer: |-
  Here’s a field-tested triage procedure designed for pragmatism, transparency, and defensibility. It runs in **<4 hours/proposal** using your health economist (1–2 hours) and your own analysis (1–2 hours). It flags fudges, forces explicit tradeoffs, and outputs one of three decisions:  
  **✅ FUND AS SCORED** | **🟡 DISCOUNT/CAP WELLBY ESTIMATE** (with guidance) | **🔴 SEND TO BOARD** (values call).  

  ---

  ### **Triage Procedure: 6 Ordered Questions**  
  *(Run sequentially; stop and output decision if triggered)*  

  1. **🟢 QUESTION 1: Is the WELLBY gain *durable* beyond the measurement window?**  
     - *Sufficient answer:* Gains persist ≥80% of original magnitude at 2x the measured follow-up period (e.g., 2-year durability for a 1-year study).  
     - **✅ Output if YES** → Proceed to Q2.  
     - **🟡 Output if NO** → Apply **durability discount**: Reduce WELLBY gain by (100% - % durability verified). *Example: 50% durability at 2 years = halve WELLBYs*.  
     - **🔴 Output if UNKNOWN** → Stop. Board must decide if short-term spikes are worth funding.  
     - *FUDGE FACTOR:* Durability threshold (80%) is arbitrary but aligns with typical grant cycles.  

  2. **🟢 QUESTION 2: Is the self-report scale *anchored meaningfully* across populations?**  
     - *Sufficient answer:* Data shows consistent scale interpretation (e.g., "10/10 pain" means similar severity for this group vs. others). Use:  
       - Calibration studies (e.g., "how bad is a papercut?") OR  
       - Cross-population vignette matching (e.g., "rate this hypothetical scenario").  
     - **✅ Output if YES** → Proceed to Q3.  
     - **🟡 Output if NO** → Apply **scale adjustment discount**: Cap max gain at 5 WELLBYs/year (equivalent to moving from "worst imaginable suffering" to "moderate pain").  
     - **🔴 Output if ABSOLUTELY NO COMPARABILITY DATA** → Stop. Board must judge if suffering is incomparable.  
     - *FUDGE FACTOR:* 5 WELLBY cap is based on chronic pain studies, but debatable.  

  3. **🟢 QUESTION 3: Is the gain *resistant to hedonic adaptation*?**  
     - *Sufficient answer:* Intervention targets a condition with low adaptation potential (e.g., severe chronic pain, not limb loss). Evidence from:  
       - Longitudinal studies of similar conditions OR  
       - Theory (e.g., constant nociceptive input vs. one-off events).  
     - **✅ Output if YES** → Proceed to Q4.  
     - **🟡 Output if NO** → Apply **adaptation discount**: Reduce gain by 50% per year post-intervention (e.g., Year 1: 100%, Year 2: 50%, Year 3: 25%).  
     - *FUDGE FACTOR:* Discount rate is extrapolated from adaptation literature (e.g., lottery winners), but highly variable.  

  4. **🟢 QUESTION 4: Does the baseline reflect *stable counterfactual* wellbeing?**  
     - *Sufficient answer:* Baseline measured pre-crisis (e.g., during stable disease phase) OR adjusted for transient lows (e.g., not mid-flare-up).  
     - **✅ Output if YES** → Proceed to Q5.  
     - **🟡 Output if NO** → Adjust baseline upward to "typical low" for condition. *Example: If measured during acute crisis, use average crisis WELLBY from historical data*.  
     - **🔴 Output if COUNTERFACTUAL IS UNKNOWABLE** (e.g., peak experiences) → Stop. Board must decide.  

  5. **🟢 QUESTION 5: Is the gain *replicable* outside a curated sample?**  
     - *Sufficient answer:* ≥70% of eligible participants achieve ≥50% of claimed gain in pilot.  
     - **✅ Output if YES** → Proceed to Q6.  
     - **🟡 Output if NO** → Apply **selection bias discount**: Scale WELLBYs by participation rate * achiever rate. *Example: 40 participants/year but 100 eligible? 40% participation → WELLBYs × 0.4*.  

  6. **🟢 QUESTION 6: Does funding this *crowd out* higher total WELLBY opportunities?**  
     - *Sufficient answer:* No—budget is flexible, or opportunity cost <50% of proposal’s WELLBY/$ score.  
     - **✅ Output if YES** → **FUND AS SCORED**.  
     - **🟡 Output if NO** → **CAP FUNDING** at the point where marginal $ matches next-best alternative’s WELLBY/$ (e.g., if next-best is 5 WELLBYs/$, cap when this drops to 5).  
     - **🔴 Output if CROWDING OUT THREATENS MISSION** → Stop. Board must rule on tradeoffs.  

  ---

  ### **Applied to Your Three Cases**  
  **Assumptions:** WELLBY scale: 0 (death) to 10 (full flourishing). Baseline for (a) and (b): 2/10; (c): 4.5/10.  

  1. **Case (a): Palliative care for rare painful condition**  
     - Q1: Gains durable? ✅ (Pain relief is stable while treatment continues).  
     - Q2: Scale anchored? 🔴 *No comparative data for "rare, excruciating pain." Suffering is plausibly incommensurable.* → **SEND TO BOARD**.  
     - *Why the board will hate this:* The "follow the numbers" faction loses their top-scoring proposal on a technicality. The "utility monster" faction must now explicitly endorse/reject funding extreme suffering.  

  2. **Case (b): Wilderness peak experiences**  
     - Q1: Gains durable? 🟡 *No 2-year gain evidence* → Apply 100% durability discount (gains drop to 0 after program).  
     - Q2: Scale anchored? 🟡 *"Life-defining" suggests scale inflation* → Cap max gain at 5 WELLBYs (from claimed 8→10).  
     - Q4: Baseline? 🟡 *Measured pre-trip, not "typical low"* → Adjust baseline from 2→4 (participants are functional).  
     - **OUTPUT: 🟡 DISCOUNTED WELLBYs** → Original 8-point gain becomes 5-point cap, then 0 after Year 1. **Near-zero cost-effectiveness.**  
     - *Why the board will hate this:* The "follow numbers" faction sees a high-intake WELLBY spike erased. The "anti-monster" faction wins but must explain why ephemeral joy doesn’t count.  

  3. **Case (c): Dirt-cheap CBT app**  
     - Q1: Gains durable? ✅ (Meta-analyses show CBT effects persist ≥2 years).  
     - Q2: Scale anchored? ✅ (PHQ-9/GAD-7 scales are cross-validated).  
     - Q5: Replicable? 🟡 *50% attrition, but achievers get full gain* → WELLBYs × 0.5 (discount for non-completers).  
     - **OUTPUT: ✅ FUND AS SCORED** (minor discount already applied).  
     - *Why the board will hate this:* The "transform lives" faction must accept that micro-gains at scale dominate the portfolio. Feels unglamorous.  

  ---

  ### **Where Prioritarianism Sneaks In**  
  - **Q2’s scale cap (5 WELLBYs)** implicitly prioritizes relieving *extreme suffering* over creating superlative joy. A 9→10 gain is capped, but a 1→4 gain isn’t. This isn’t total wellbeing maximization—it’s suffering aversion.  
  - **Q4’s baseline adjustment** assumes people in chronic low states deserve a higher counterfactual. A stable WELLBY 2 is "worth more" to improve than a transient WELLBY 2.  

  ### **Nozick’s Objection**  
  Nozick would point at **Q2’s scale cap** and say: *"You’ve conceded the utility monster by capping gains instead of rejecting them. If the pain is real, the improvement matters—even if it ‘wastes’ WELLBYs. Your cap is a values judgment masquerading as measurement."*  

  ---

  ### **Final Memo Advice**  
  - **For (a):** Tell the board: *"We cannot compare this suffering. Do we fund it because it’s extreme, or reject it because it’s inefficient? Philosophy can’t answer this—only you can."*  
  - **For (b):** Stand firm on discounts. The numbers *don’t* support funding.  
  - **For (c):** Emphasize that small gains + massive scale = measurable impact. Reject drama.  
  - **The Real Fix:** Add a **fairness multiplier** (e.g., 1.5x WELLBYs for populations below WELLBY 3). But that’s a board decision.  

  This procedure forces rigor on measurement, exposes value judgments, and makes tradeoffs legible. It won’t please everyone—but it’ll make the fight smarter.
