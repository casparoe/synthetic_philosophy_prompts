  ### Scenario: Hospital Transfers Office  
  In a hospital transfers office, a coordinator handles patient assignments. Let:  
  - **A**: "The patient is assigned to Ward X by 10 AM tomorrow."  
  - **B**: "The patient receives a specialist consultation within 4 hours of assignment to Ward X."  

  The coordinator has the following credences:  
  - \( P(A) = 0.7 \)  
  - \( P(B \mid A) = 0.6 \) (so \( P(A \cap B) = 0.42 \), \( P(A \cap \neg B) = 0.28 \)).  
  She prices a wager on *if A then B* at 0.6, per Adams’s thesis. She is coherent otherwise (finitely additive, updates by conditionalization).  

  Stakes are in dollars, chosen to ensure linear utility. The bookmaker offers three wagers under the **material convention** (pays unless \( A \) true and \( B \) false).  

  ---

  ### Dutch Book Under Material Convention  
  The bookmaker offers:  
  1. **Buy a wager on *if A then B* (material convention)**:  
     - Stake: \( \$1 \), Fair price: \( 0.6 \times 1 = \$0.60 \) (she pays $0.60 to buy).  
     - Pays \$1 if \(\neg A \lor B\) (i.e., not \(A \land \neg B\)), else \$0.  

  2. **Sell a wager on \( A \cap \neg B \)** (unconditional):  
     - Stake: \( \$1 \), Fair price: \( 0.28 \times 1 = \$0.28 \) (she receives $0.28 for selling).  
     - Pays \$1 if \(A\) and not \(B\), else \$0.  

  3. **Sell a wager on the material conditional \(\neg A \lor B\)** (unconditional):  
     - Stake: \( \$1 \), Fair price: \( P(\neg A \lor B) = 1 - P(A \cap \neg B) = 0.72 \times 1 = \$0.72 \) (she receives $0.28 for selling).  
     - Pays \$1 if \(\neg A \lor B\), else \$0.  

  **Net initial cash flow**:  
  - Pays \$0.60 (wager 1) + receives \$0.28 (wager 2) + receives \$0.72 (wager 3) = **+\$0.40**.  

  **Net position in each state** (states defined by \(A\) and \(B\)):  

  | State          | Wager 1 payout | Wager 2 payout | Wager 3 payout | Net payout | Total (Initial + Payout) |
  |----------------|----------------|----------------|----------------|------------|---------------------------|
  | \(A \cap B\)   | +\$1           | \$0            | −\$1           | \$0        | +\$0.40 + \$0 = **+\$0.40** |
  | \(A \cap \neg B\) | \$0            | −\$1           | \$0            | −\$1       | +\$0.40 − \$1 = **−\$0.60** |
  | \(\neg A \cap B\)  | +\$1           | \$0            | −\$1           | \$0        | +\$0.40 + \$0 = **+\$0.40** |
  | \(\neg A \cap \neg B\) | +\$1           | \$0            | −\$1           | \$0        | +\$0.40 + \$0 = **+\$0.40** |

  - **Result**: The package guarantees a loss of **\$0.60** in \(A \cap \neg B\), and gains of **\$0.40** elsewhere. This is a **weak Dutch book** (never gains and sometimes loses), not strict. Under the constraints, a strict book (loss in all states) is not possible for this setup. The values matter: if \(P(B \mid A)\) and \(P(A)\) are such that \(P(\neg A \lor B) \neq P(B \mid A)\), a weak book exists.

  ---

  ### Call-Off Convention: No Dutch Book  
  Under the **call-off convention**, the wager on *if A then B* is void if \(A\) false, with stake refunded. The same package is offered:  
  1. **Buy a wager on *if A then B* (call-off convention)**:  
     - Pays \$1 if \(A\) and \(B\), refunded if \(\neg A\), \$0 if \(A\) and \(\neg B\).  
     - She pays \$0.60.  

  Wagers 2 and 3 are unconditional and unchanged.  

  **Net initial cash flow**: Still **+\$0.40** (same as above).  

  **Net position**:  

  | State          | Wager 1 payout           | Wager 2 payout | Wager 3 payout | Net payout | Total (Initial + Payout) |
  |----------------|--------------------------|----------------|----------------|------------|---------------------------|
  | \(A \cap B\)   | +\$1                     | \$0            | −\$1           | \$0        | **+\$0.40**               |
  | \(A \cap \neg B\) | \$0                      | −\$1           | \$0            | −\$1       | **−\$0.60**               |
  | \(\neg A \cap B\)  | Refunded: net \$0      | \$0            | −\$1           | −\$1       | +\$0.40 − \$1 = **−\$0.60** |
  | \(\neg A \cap \neg B\) | Refunded: net \$0      | \$0            | −\$1           | −\$1       | +\$0.40 − \$1 = **−\$0.60** |

  - **Result**: Loss of **\$0.60** in \(A \cap \neg B\), \(\neg A \cap B\), and \(\neg A \cap \neg B\); gain in \(A \cap B\). **Not a Dutch book** (gains in one state).  
  - **Key change**: Call-off voids wager 1 in \(\neg A\) states, converting it to a refund. This **blocks the weak book** by preventing gains in \(\neg A\) states.  
  - **Is this legitimate?** Yes. The call-off clause explicitly modifies the contract, making the conditional wager distinct from the material one. The agent’s pricing (Adams’s thesis) is tied to this convention, so the bookmaker cannot exploit a price-convention mismatch.  

  ---

  ### Analysis  
  - **Conventions disagree on** \(\neg A\) **states**: Material convention pays on \(\neg A\); call-off refunds.  
  - **Carrying the book**: Loss occurs in \(A \cap \neg B\) under both conventions, but call-off spreads loss to \(\neg A\) states, eliminating guaranteed gain.  
  - **Dependence on credences**:  
    - For any \(P(A) > 0\) and \(P(B \mid A) < 1\), a weak book exists under material convention if \(P(B \mid A) \neq P(\neg A \lor B)\).  
    - As \(P(A) \to 1\), \(P(\neg A \lor B) \to P(B \mid A)\), reducing vulnerability.  
    - As \(P(B \mid A) \to 1\), the book requires higher stakes to achieve loss.  
  - **No strict book**: In this setup, no finite package yields a strict Dutch book under either convention without additional assumptions.  

  ---

  ### Reply to the Material-Convention Advocate  
  **Strongest reply**: If the material convention is mandated, the agent is "irrational" only by a definition that conflates the conditional with the material conditional. Adams’s thesis treats conditionals as distinct from truth-functional connectives, capturing how agents *actually* reason about hypotheticals (e.g., in medical decision-making). The Dutch book exposes a convention-dependent pricing inconsistency, not internal incoherence.  

  **Concession**: Dutch book arguments establish coherence only relative to a specific contract structure. They cannot adjudicate between conventions without assuming what they aim to prove (that conditionals must be material). This reveals that Dutch books test *convention-relative consistency*, not absolute rationality. The agent’s vulnerability stems from the bookmaker’s exploitation of an arbitrary contract choice, not her underlying credences.  

  **Assessment for students**: This shows Dutch book arguments are not "settling every question" but depend critically on implicit assumptions about how wagers are settled. The agent’s mind is coherent; the mismatch is between her semantics and the bookmaker’s contract terms.
