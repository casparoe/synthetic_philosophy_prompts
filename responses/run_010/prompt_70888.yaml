  The proposal needs several key components: a precise research question, critique of existing interpretations, clear methodology, justification for a philosophical approach, measurable outcomes, and realistic scope assessment. The challenge is framing this as philosophically significant rather than historical rehabilitation.

  Hmm... the panel composition matters - two philosophers and a skeptical law professor. So the proposal must emphasize what's at stake theoretically. Maybe positioning it as solving a puzzle in legal enforcement justification that both Hart-style liberalism and Devlin-style conservatism miss.

  The common-pool resource analogy seems powerful here. If morality functions like fishing grounds or irrigation systems (valuable only when collectively maintained), it creates different enforcement criteria than harm prevention. That could explain why some norms feel "enforceable" even without direct harm - their violation triggers cascading defection.

  For methodology, breaking down the semester into phases makes sense: formalizing the model first, then deriving testable criteria, then stress-testing against counterexamples. Important to present the threshold/assumption hypothesis as... well, a hypothesis rather than foregone conclusion.

  The trickiest part is defending why this isn't a sociology project. Need to stress it's about conceptual structure - what kinds of norms logically require collective maintenance? The empirical question presupposes we can identify such norms first.

  Failure modes should be addressed head-on. If the model just becomes harm prevention 2.0 or produces no practical guidance, that's useful knowledge too. Shows where this reconstruction approach hits limits.

  Scope feels manageable - one solid paper framing the model and its implications, not rewriting moral philosophy. The "what turns on this" hook is crucial: it might explain persistent intuitions about enforceability that liberalism struggles with.
answer: |-
  Here’s a structured proposal draft focusing on philosophical precision, methodological clarity, and stakes for legal-moral theory. It explicitly addresses your requirements while framing the project to resonate with skeptical panelists.

  ---

  **Project Title:**  
  Reconstructing Devlin: Shared Morality as a Common-Pool Resource and the Limits of Legal Enforcement  

  **Core Question:**  
  *Under what conditions, if any, does the collective-action structure of a shared moral norm justify its enforcement through criminal law, even absent direct harm to others?*  

  ### 1. The Problem: Why Existing Readings Fall Short  
  The Hart-Devlin debate centers on whether law may enforce "public morality." Standard critiques (following Hart) treat Devlin’s "societal disintegration" claim as a falsifiable empirical prediction. His thesis is then dismissed because permissive sexual norms (e.g., post-*Wolfenden*) haven’t caused collapse. **This misreads Devlin’s core insight.**  

  Devlin’s analogy to treason suggests he’s describing a *structural vulnerability*: shared morality functions like an "invisible institution" whose maintenance depends on reciprocal participation. If we reconstruct his argument not as sociology but as **applied collective action theory**, his claim becomes:  
  > *Moral norms with high strategic interdependence—where individual compliance depends on expected compliance by others—are susceptible to irreversible erosion if defection becomes visible and contagious.*  

  This framing is untouched by Hart’s "no evidence of collapse" objection, which targets a straw man. Yet current literature lacks tools to rigorously evaluate *this* version of Devlin’s argument.  

  ### 2. Method: Reconstruction and Norm-Sorting Criteria  
  **Over one semester, I will:**  
  - **Month 1:** Formalize the collective-action model.  
    - Define "threshold/assurance-structured" moral norms using game theory (e.g., Schelling, Ostrom): norms where (a) value depends on critical mass participation, (b) defection is observable and imitable, (c) erosion is path-dependent (hard to reverse).  
    - Contrast with "private-compliance" norms (value independent of others’ actions).  
  - **Month 2:** Derive a testable criterion for legal enforceability.  
    - Hypothesis: Legal enforcement is *prima facie* justifiable *only* for threshold/assurance norms where:  
      (i) Defection risks cascading non-compliance ("contagion"),  
      (ii) Enforcement can reliably stabilize participation at the threshold.  
    - Test against Devlin’s examples (e.g., marital fidelity vs. private homosexuality) and Hart’s counterexamples.  
  - **Month 3:** Stress-test the model against objections.  
    - Does it collapse into harm prevention (e.g., by defining "erosion" as harm)?  
    - Can it distinguish *enforceable* moral norms from merely *conventional* ones (e.g., dress codes)?  
    - Does it generate false positives/negatives (e.g., enforcing dietary laws vs. not enforcing environmental norms)?  

  ### 3. Why Philosophy, Not Sociology?  
  A sociological project ("Does moral change destabilize societies?") cannot answer our core question:  
  - It presupposes we *already know* which norms have threshold/assurance structure.  
  - It cannot resolve *normative* questions about when enforcement is justified, even if destabilization occurs.  
  - **This project is conceptual:** It develops a *criterion* to identify norms whose strategic logic makes them candidates for enforcement under Devlin’s reconstructed view. Without this, empirical studies lack a theoretical lens to isolate relevant variables (e.g., is "instability" caused by norm erosion or economic inequality?).  

  ### 4. Outcomes and Failure Conditions  
  **Success** looks like:  
  - A defensible principle for when a norm’s collective-action structure *could* justify enforcement, distinct from the harm principle.  
    *(Example: "Enforcement may be warranted for norms where visible defection triggers strategic unraveling that is prohibitively costly to reverse.")*  
  - Showing this reconstruction rescues Devlin from Hart’s knockout blow while constraining moralistic enforcement.  

  **Explicit Failure Modes:**  
  - **Triviality:** The model shows Devlin is *conceivably* right but offers no actionable guidance (e.g., all norms are deemed "threshold-dependent" under loose definitions).  
  - **Harm Principle Collapse:** The reconstructed justification reduces to preventing indirect harms (e.g., "erosion causes anxiety"), making it compatible with Hart’s liberalism → the project buys nothing.  
  - **Unworkable Criterion:** The sorting test is either incoherent or fails to discriminate between plausible/non-plausible cases of enforcement (e.g., it equally "justifies" criminalizing adultery or failing to recycle).  

  ### 5. Scope and Deliverables  
  **One semester suffices for:**  
  - A rigorously developed theoretical model.  
  - A working paper (7,000–9,000 words) establishing:  
    (a) The collective-action reconstruction of Devlin,  
    (b) The enforceability criterion,  
    (c) Responses to major objections.  
  **This is not overreach:** It builds on established tools (game theory, political philosophy) to solve a defined puzzle. Empirical applications (e.g., case studies) are *future work*; here, we establish the conceptual groundwork.  

  ### Why This Matters Beyond Devlin  
  **What turns on getting this right?**  
  - **For liberals:** It identifies a *non-harm-based* argument for enforcement that demands engagement, strengthening harm-principle defenses by clarifying their limits.  
  - **For conservatives:** It replaces Devlin’s vague "disintegration" with a testable model, exposing when moral enforcement is *instrumentally irrational* (e.g., for non-strategic norms).  
  - **For legal theory:** It offers a framework to evaluate real-world disputes (e.g., enforcing vaccine mandates vs. burqa bans) based on a norm’s *functional logic*, not just moral preference.  

  This project doesn’t rehabilitate Devlin—it isolates a *philosophically salient kernel* in his argument that survives Hart’s critique and advances the debate over legal moralism.  

  ---

  **Key Adjustments for the Panel:**  
  - **Anti-Devlin law prof:** Emphasizes that the project *constrains* moralistic enforcement (most norms won’t meet the threshold) and may ultimately vindicate Hart. The goal is analytical progress, not reviving Devlin’s agenda.  
  - **Philosophers:** Stresses model-building and conceptual innovation ("collective-action structure" as a missing category in enforcement justifications).  
  - **No "joke" framing:** Present Devlin’s argument as a placeholder for a persistent intuition (that some norms feel "structurally fragile") that deserves rigorous reconstruction.  

  **Next Steps:**  
  - Add your citations to Hart/Devlin, game theory (e.g., Ostrom on CPRs, Ullmann-Margalit on norms), and contemporary legal moralism (e.g., George, Dworkin).  
  - Specify a working title for the paper (e.g., "Morality as a Common-Pool Resource: A Game-Theoretic Reconstruction of the Hart-Devlin Debate").  
  - Briefly flag real-world cases where the model could apply (e.g., enforcing honesty in markets vs. criminalizing blasphemy).  

  This proposal treats your hunch as a hypothesis to probe—not a foregone conclusion—while giving skeptical panelists clear reasons to care about the answer.
