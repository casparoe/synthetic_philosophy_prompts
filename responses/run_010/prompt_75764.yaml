     = (-10 -6 -3.6 -2.16) + (9 +5.4 +3.24 +1.944)
     = (-21.76) + (19.584) = -2.176

   Now compare: monthly gives 6, weekly gives -2.176. So she should still prefer monthly.

   This isn't working.

  **New Idea: The Book Purchase**

  Alice is considering buying a book that she will use for a project. The book costs $20 if bought in advance (online) and will be delivered in two days. Alternatively, she can buy it in person at the bookstore for $25, but then she can get it immediately.

   The project is in three days.

   On Day 1, she can order the book online for $20, to be delivered on Day 3.
   On Day 2, she can go to the bookstore and buy it for $25, available immediately.
   On Day 3, she can use the book for the project (if she has it) and it's worth $30 to her.

   But if she orders online on Day 1, she will have it on Day 3 and get $30, so net $10.
   If she waits until Day 2, she can buy it at the bookstore for $25 and have it on Day 3, net $5.
   If she does nothing, she gets $0.

   So on Day 1, she should order online.

   But she might procrastinate. On Day 1, she might think that on Day 2 she can still get it at the bookstore, and the cost of $25 on Day 2 might feel less painful than $20 on Day 1 because of present bias? Let's see with quasi-hyperbolic discounting.

   Assume she discounts future costs and utilities with β=0.5, δ=1.

   On Day 1 (time0):
    - Option1: Order online: cost $20 at time0, utility $30 at time2.
          Discounted utility: -20 + βδ^2*30 = -20 + 0.5*1*30 = -20+15 = -5.
    - Option2: Wait and buy at the bookstore on Day2: cost $25 at time1, utility $30 at time2.
          Discounted at time0: βδ^1*(-25) + βδ^2*30 = 0.5*(-25) + 0.5*30 = -12.5 + 15 = 2.5.
    - Option3: Do nothing: 0.

   So she prefers to wait (2.5) over ordering (-5) and over nothing.

   Then on Day 2 (time1), she can buy at the bookstore: cost $25 at time1, utility $30 at time2.
          Discounted at time1: -25 + βδ^1*30 = -25 + 0.5*30 = -25+15 = -10.
    So she would not buy it! But then she gets 0.

   So at time0, she thought she would get 2.5, but at time1, she changes her mind and doesn't buy, so she gets 0.

   This is a case of sophisticated time inconsistency, but not a money pump because there's only one decision.

   To make it a money pump, we need multiple cycles.

  **Proposed Money Pump Scenario (finally):**

  Alice has to submit a report every month. She can buy a template for the report. There are three versions of the template:

  - Version A: costs $10, available immediately.
  - Version B: costs $12, available in 1 day.
  - Version C: costs $15, available in 2 days.

  She needs the template in 2 days. The template saves her $20 in effort when she uses it in two days.

  She has the following options over time:

  - On Day 1, she can buy A for $10.
  - On Day 1, she can order B for $12, to be available on Day2.
  - On Day 2, she can buy B for $12 (available immediately on Day2) or order C for $15 (available on Day3, which is too late).
  - On Day 2, if she doesn't have a template yet, she can buy A for $10 (but now it's Day2, and she would have it for Day3? We need to make the availability clear.

   Instead, let's set the availability such that on any day, she can choose to buy a template for use in two days, but then as time passes, the available templates change.

   This is getting messy.

  ** I found a standard example in the literature: the procrastination of a single task that can be done at different times with increasing cost. But we need a cycle.

