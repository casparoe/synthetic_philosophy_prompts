  ### Thought Experiment: The Savings App Subscription  
  Alice uses a savings app to manage her freelance income. The app offers a premium feature: for a $10 monthly fee paid in advance, it automatically rounds up purchases into a savings account. She can cancel anytime, but reactivating requires a $5 reactivation fee. Alice values the feature at $8 per month for its convenience. However, her discounting is non-stationary—hyperbolic with a present bias (β = 0.8, δ = 0.99). She knows her future valuations, the fee schedule, and can precommit to blocking reactivation for a $0.50 fee at the start. Stakes are low ($10–$20), and no surprises occur.  

  **Preference Structure**:  
  Alice’s utility function at time \(t\) for outcome \(x\) at \(t+\tau\) is:  
  \[ U_t(x, t+\tau) = \beta \delta^{\tau} \cdot x \quad (\beta=0.8, \delta=0.99) \]  
  At each node, she evaluates options:  
  - **Option A**: No premium (no cost, no benefit).  
  - **Option B**: Premium active ($10 fee, $8 benefit).  
  Benefits are received daily (≈ $0.27/day), but fees are immediate. On day \(d\), "premium active" delivers $8 utility discounted to day \(d+30\) (end of month).  

  #### Sequence of Events:  
  1. **Day 0 (Start)**:  
     - *Options*:  
       - **Precommit**: Pay $0.50 to block reactivation forever.  
       - **Subscribe**: Pay $10 for premium, get $8 (discounted to Day 30).  
       - **Do nothing**: Stay with no premium.  
     - *Ranking (transitive)*:  
       - **Subscribe** > **Do nothing** > **Precommit**.  
       - **Why?** \(U_0(\text{Subscribe}) = \beta\delta^{30} \cdot 8 - 10 \approx -3.5\) (net gain vs. nothing: \(-3.5 > -4.0\)). Precommit costs $0.50 now for no benefit: \(U_0(\text{Precommit}) = -0.5\).  
     - *Decision*: Does nothing (net utility: $0$).  
     - *Running total*: $0.  

  2. **Day 15 (Mid-month)**:  
     - Premium inactive. She reconsiders.  
     - *Options*:  
       - **Reactivate**: Pay $5 reactivation fee + $10 prorated monthly fee, get $4 benefit (half-month, discounted to Day 30).  
       - **Do nothing**: No premium.  
     - *Ranking (transitive)*:  
       - **Reactivate** > **Do nothing**.  
       - **Why?** \(U_{15}(\text{Reactivate}) = \beta\delta^{15} \cdot 4 - 15 \approx -7.6\) (vs. doing nothing: \(-7.6 > -8.0\)).  
     - *Decision*: Reactivates. Pays $15.  
     - *Running total*: $-15.  

  3. **Day 30 (Month-end)**:  
     - Premium active, but benefit ($8) is realized. She decides whether to cancel.  
     - *Options*:  
       - **Cancel**: No further cost, but loses next month’s benefit.  
       - **Keep**: Pay $10 for next month, get $8 (discounted to Day 60).  
     - *Ranking (transitive)*:  
       - **Cancel** > **Keep**.  
       - **Why?** \(U_{30}(\text{Keep}) = \beta\delta^{30} \cdot 8 - 10 \approx -3.5\) (vs. cancel: $0$).  
     - *Decision*: Cancels.  
     - *Running total*: $-15 + 8 = -7$ (net loss).  

  #### Net Outcome:  
  Alice started and ended with no premium but paid $15 in fees (reactivation + prorated fee) and received $8 in benefits, netting a **$7 loss**. She returns to the exact same state (no premium) with less money.  

  ### Analysis:  
  **Step-by-Step Ledger**:  
  | **Day** | **Decision** | **Local Ranking (Options)** | **Dominance at Node** | **Cumulative $** |  
  |---------|--------------|----------------------------|------------------------|-----------------|  
  | 0       | Do nothing   | Subscribe > Nothing > Precommit | Subscribe dominates Nothing by net $-3.5 > -4.0$ | $0$ |  
  | 15      | Reactivate   | Reactivate > Nothing        | Reactivate dominates Nothing by $-7.6 > -8.0$ | $-15$ |  
  | 30      | Cancel       | Cancel > Keep               | Cancel dominates Keep by $0 > -3.5$ | $-7$ |  

  **Transitivity Check**:  
  - *Day 0*: Subscribe > Nothing > Precommit. No cycle (Subscribe ≻ Nothing ≻ Precommit).  
  - *Day 15*: Reactivate ≻ Nothing. No other options, hence transitive.  
  - *Day 30*: Cancel ≻ Keep. No cycle.  
  At every moment, preferences are transitive and complete.  

  **Role of Non-Stationary Discounting**:  
  The pump arises because Alice’s discounting flips her valuation of the premium:  
  - On Day 0, the benefit is 30 days away and heavily discounted; subscribing is barely worthwhile.  
  - On Day 15, the benefit is only 15 days away; less discounting makes reactivation seem better.  
  - On Day 30, the benefit is again 30 days away; she cancels.  
  If discounting were stationary (β=1), she would see Day 0: \(U_0(\text{Subscribe}) = \delta^{30} \cdot 8 - 10 \approx -7.5\), making her precommit or never subscribe. The pump **collapses entirely** without non-stationarity.  

  ### Blocking Moves:  
  1. **Sophisticated Choice**:  
     - On Day 0, Alice could foresee her Day 15 preference reversal and precommit to block reactivation.  
     - *Why it fails*: Precommit costs $0.50. At Day 0, \(U_0(\text{Precommit}) = -0.5\), while \(U_0(\text{Do nothing}) = 0\). Sophistication doesn’t force her to incur a cost to prevent a future "gain" she doesn’t yet want to avoid.  

  2. **Planning/Disposition**:  
     - Alice could adopt a plan ("never reactivate") or a disposition (avoid reactivation fees).  
     - *Why it fails*: At Day 15, deviating from the plan (reactivating) is locally dominant. Her discounting makes reactivation *genuinely preferable* at that time, so she has no reason to follow the plan.  

  ### Synchronic Rationality Defense:  
  A synchronic theorist argues:  
  - *"At every node, Alice maximizes her utility given her current preferences. She is never mistaken. The net loss arises from lawful preference shifts, not irrationality. Calling this a ‘pump’ equivocates between synchronic and diachronic rationality."*  
  - **Rebuttal**: The net loss is *foreseeable and avoidable* (e.g., precommit on Day 0). Refusing to block a known drain on wealth violates instrumental rationality. Synchronic rules alone can’t explain why she repeatedly moves toward a dominated outcome when she could have permanently avoided it at a trivial cost.  

  ### Verdict:  
  **Alice is irrational at Day 0 for refusing to precommit**.  
  - **Why Day 0?** This is the only node where she can costlessly block the entire pump. Her decision is myopic: she saves $0.50 by not precommitting but enables a $7 loss. While she maximizes locally at each node, her Day 0 choice ignores the predictable consequences of her future preferences. Rationality requires managing foreseeable diachronic traps, even if no *single* choice is locally flawed. The failure is in her **global strategy**, not in any isolated moment.  
  - **The core failure**: She treats her future preferences as exogenous when they are foreseeable and avoidable. Instrumental rationality demands she prevent her future self from causing net harm, especially when precommitment is cheap and locally neutral.  

  **Final note**: This case forces students to confront whether rationality is more than moment-by-maximization. Alice’s net loss isn’t bad luck—it’s a predictable result of her discounting structure, and her inaction at Day 0 is the linchpin.
