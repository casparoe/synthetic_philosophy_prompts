  **Final Scenario (Savings App with Withdrawal Fees):**

  Alice has $100 in her Spend account. She can transfer money to her Save account (which earns 0% interest) but to withdraw from Save to Spend, there is a $1 fee and a 1-day delay. She is expecting to need the money in 2 days for a purchase. The purchase will yield her $5 in convenience (so she values having the money available in 2 days at $5 more than not having it).

  The pump sequence:

  - On Day 1, she can transfer $100 from Spend to Save for a $1 fee (so she has $99 in Save).
  - On Day 2, she can withdraw from Save to Spend: she will get $99 - $1 fee = $98 in Spend, but it will be available on Day3.
  - But she needs the money on Day3 for the purchase, which is okay, but she has $98 instead of $100.

  Alternatively, she could leave the money in Spend.

  But she might be tempted to transfer to Save on Day1 because of a present bias against spending.

  Assume that on Day1, she feels a pang of guilt if she leaves the money in Spend because she feels she should save. This guilt is immediate. Specifically, at any moment, if the money is in Spend, she experiences a guilt of -$3. If it's in Save, she experiences no guilt.

   The guilt is experienced only for as long as the money is in Spend.

   So the states:

  - State A: money in Spend.
  - State B: money in Save.

  In state A, she experiences a guilt of -3 per day.
  In state B, no guilt.

  On Day1, if she transfers to Save, she pays a $1 fee and moves to state B.

  On Day2, she can withdraw from Save to Spend, paying $1 fee and moving back to state A on Day3.

  The money is needed on Day3 for a purchase that yields +5. But if she has less money, the purchase still happens and yields the same convenience, so the convenience is independent of the amount (as long as she has at least the amount needed).

   But assume she needs exactly $100 for the purchase. If she has less, she cannot make the purchase and loses the $5 convenience.

   So in the above sequence, on Day3 she has $98, which is not enough, so she loses the $5 convenience.

   Alternatively, if she leaves the money in Spend on Day1, she has $100 on Day3 and makes the purchase.

   Now, at each step:

   On Day1:
    - Option1: Leave in Spend: 
          guilt on Day1: -3
          guilt on Day2: -3 (because still in Spend)
          then on Day3: she has $100 and makes the purchase: +5.
          Discounted with quasi-hyperbolic: assume guilt is per day, experienced at the end of the day.
          At the decision moment on Day1 (beginning of the day), she discounts the future with β=0.5, δ=1.
          Utility = guilt on Day1 (at time0): -3 (immediate) 
                   + β * guilt on Day2 (at time1): 0.5 * (-3) 
                   + β * purchase utility at time2: 0.5 * 5 = 2.5
                   = -3 -1.5 +2.5 = -2.

    - Option2: Transfer to Save:
          cost: $1 fee on Day1 (immediate) -> utility -1
          and no guilt on Day1 or Day2.
          on Day3: she has $99 in Save, which she can withdraw to Spend but then she would have $98 on Day4 (too late) or leave in Save. In either case, she doesn't have the money for the purchase on Day3, so she loses the $5 convenience.
          but also, on Day3, if she leaves in Save, no guilt. But she doesn't make the purchase.
          So utility = -1 (from the fee) + 0 (no guilt) + 0 (no purchase) = -1.

   So on Day1, she prefers transferring to Save (-1) over leaving in Spend (-2).

   On Day2, she is in state B (Save). She has the option to withdraw or not.
    - If she withdraws: she pays $1 fee, and the money will be in Spend on Day3.
          On Day2: no guilt (since in Save) and she pays the fee: -1 utility.
          On Day3: the money is in Spend, so guilt -3, but she can make the purchase with $99? 
          But wait, she withdrew $99 - $1 = $98? Let's clarify: initially in Save: $99 (after the first fee). Withdrawing: she pays another $1 fee, so she gets $98 in Spend on Day3.
          She needs $100 for the purchase, so she cannot make it. 
          So utility on Day2 for withdrawing: 
               immediate fee: -1
               on Day3: guilt -3 (because in Spend) and no purchase.
               Discounted at Day2: -1 + β * (-3) = -1 + 0.5*(-3) = -1-1.5 = -2.5.
    - If she does nothing: money remains in Save on Day3. No guilt on Day2 or Day3. She doesn't make the purchase (since she doesn't have the money in Spend on Day3).
          Utility: 0.

   So she prefers to do nothing (0) over withdrawing (-2.5).

   So the sequence:
     Day1: transfers to Save (because -1 > -2)
     Day2: does nothing (0 > -2.5)
     Day3: she has $99 in Save, cannot make the $100 purchase, so loses the $5 convenience.

   Compared to if she had left the money in Spend on Day1: she would have had $100 on Day3 and made the purchase, and her utility would have been -2 (from the guilt on Day1 and Day2) +2.5=0.5? Let's calculate for the alternative path at Day1: 
     Leave in Spend: guilt on Day1: -3, on Day2: -3, on Day3: +5 (purchase). 
     At Day1: -3 (immediate) + β*(-3) + β*5 = -3 +0.5*(-3)+0.5*5 = -3 -1.5+2.5 = -2.
     But at Day3, when she has the purchase, she might also have guilt on Day3 if the money is in Spend? We said guilt is for as long as the money is in Spend. So on Day3, if she has it in Spend, guilt -3 on Day3.

   So then for leave in Spend:
     Day1: guilt -3
     Day2: guilt -3
     Day3: guilt -3 and purchase +5
     At Day1: -3 + β*(-3) + β^2*(-3+5) = -3 +0.5*(-3) +0.25*(2) = -3 -1.5 +0.5 = -4.

   This is worse.

   We want her to end up worse off in the pump sequence.

   In the pump sequence, she ends up with $99 in Save and no purchase, utility -1 from the first fee.
   In the alternative, if she leaves in Spend, she has -3 guilt on three days and +5 on the last day.

   With β=0.5, the alternative utility at Day1 is: -3 (Day1 guilt) + β * [-3 (Day2 guilt) + β * (-3 (Day3 guilt)+5))] 
   = -3 + 0.5 * [-3 + 0.5*(2)] = -3 +0.5*[-3+1] = -3+0.5*(-2) = -3-1 = -4.

   In the pump sequence, at Day1 she had utility -1 for sure.

   So she still prefers the pump sequence at Day1.

   But then on Day3, in the pump sequence, she has no purchase and -1 from the fee, while in the alternative, she has -3 guilt on Day3 and +5, so net 2 on Day3. So from the perspective of Day3, the alternative is better.

   But the decision is made at Day1.

   This is not a money pump that returns to the same state. She ends up in a different state (Save account with $99) versus alternative ( Spend with $100 after the purchase).

   To have a cycle, we need to return to the start state.

