  **Scenario: The агент with Non-Stationary Discounting**

   (This is based on the example from (Sugden, 2004) or (Hofbauer & Sandholm, 2002), but I'll адаптирую.)

   Alice has to choose when to do a task. The task can be done on Friday, Saturday, or Sunday. 
   The cost of doing the task on each day is:
     Friday: $0
     Saturday: $5
     Sunday: $9

   She values having the task done at $10, which is received on Sunday night regardless of when it is done.

   So:
     If done on Friday: cost 0, benefit 10 -> net 10.
     If done on Saturday: cost 5, benefit 10 -> net 5.
     If done on Sunday: cost 9, benefit 10 -> net 1.
     If not done: net 0.

   On any day, if the task is not yet done, she can do it that day.

   She has quasi-hyperbolic discounting: β=0.5, δ=1.

   On Friday, her utility for the net outcome on Sunday is multiplied by β, and the cost on the day it is done is not discounted if that day is today, or β if in the future.

   Specifically, if she does the task on Friday:
     cost on Friday: -0 (immediate, so no discount)
     benefit on Sunday: β * δ^2 * 10 = 0.5 * 1 * 10 = 5.
     utility on Friday: 0 + 5 = 5.

   If she plans to do it on Saturday:
     cost on Saturday: β * δ^1 * (-5) = 0.5 * (-5) = -2.5
     benefit on Sunday: β * δ^2 * 10 = 0.5 * 10 = 5
     utility on Friday: -2.5 + 5 = 2.5.

   If she plans to do it on Sunday:
     cost on Sunday: β * δ^2 * (-9) = 0.5 * (-9) = -4.5
     benefit on Sunday: β * δ^2 * 10 = 0.5 * 10 = 5
     utility on Friday: -4.5+5=0.5.

   So on Friday, she prefers to do it on Friday (5) > Saturday (2.5) > Sunday (0.5) > not done (0).

   So she should do it on Friday. But if she doesn't do it on Friday, then on Saturday she re-evaluates.

   On Saturday, if not done yet:
     Do it Saturday: cost -5 (immediate), benefit β * δ^1 *10 =0.5*10=5 -> utility: -5+5=0.
     Do it Sunday: cost β * δ^1 *(-9)=0.5*(-9)=-4.5, benefit β * δ^1 *10=0.5*10=5 -> utility: -4.5+5=0.5.
     So she prefers to wait until Sunday (0.5) over doing it Saturday (0).

   Then on Sunday: 
     cost -9 (immediate), benefit 10 -> -9+10=1, so she does it.

   So the sequence: 
     - On Friday, she doesn't do it (even though at that moment she prefers to do it on Friday, but why doesn't she? Because at the moment of decision on Friday, she has to incur the cost of doing it (which is 0) immediately. But there is no cost on Friday, so she should be indifferent to doing it or not at that moment? 

   The cost of doing it on Friday is $0, so there's no reason not to do it. To make her not do it, we need to introduce a small immediate cost of effort, even if monetary cost is 0.

   Assume that doing the task on any day requires a small effort that is experienced as a utility loss of $0.50, and this effort cost is immediate. 

   So revised costs:
     Friday: effort cost $0.50 ( so total cost = $0.50)
     Saturday: effort cost $0.50 + monetary cost $5 = $5.50
     Sunday: effort cost $0.50 + monetary cost $9 = $9.50

   Benefit: $10 on Sunday night.

   On Friday:
     Do it Friday: effort cost -0.50 (immediate), benefit: βδ^2*10=0.5*10=5 -> utility= -0.50+5=4.5.
     Do it Saturday: cost: βδ^1*(-5.50)=0.5*(-5.50)=-2.75, benefit:5 -> utility= -2.75+5=2.25.
     Do it Sunday: cost: βδ^2*(-9.50)=0.5*(-9.50)=-4.75, benefit:5 -> utility=0.25.
     So she prefers to do it Friday (4.5).

   So she does it on Friday.

   To make her procrastinate, we need the cost on Friday to be more immediate and hence weighed more with present bias. But the cost on Friday is already immediate.

   Alternatively, make the benefit sooner if done earlier? The benefit is on Sunday regardless.

