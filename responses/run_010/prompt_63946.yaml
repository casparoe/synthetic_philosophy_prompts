prompt: |-
  I cover science and ideas for a magazine and I've got a piece half-written on how much of our moral sense is a product of natural selection. Two of my sources — a philosopher, call her R, and an evolutionary biologist, call him D — got into it over email and cc'd me, and I honestly still can't tell who won. Roughly:

  (1) D: evolution shaped our moral intuitions for reproductive success, not for truth, so we have no reason to think they're accurate. If our ancestors had been eusocial insects we'd have intuitions telling us to kill our siblings and those would've been just as fit — so the fact that we have the intuitions we have isn't evidence that they're true.

  (2) R: there's an escape from that. Survival and flourishing are at least somewhat good, and evolution selected for traits that promoted survival — so our moral beliefs weren't aimed at nothing, they were aimed at something that overlaps with the good. No miracle required.

  (3) D: you've assumed the thing in dispute. You start from the moral premise that survival is good and then use it to conclude that evolution tracked moral truth. And on your logic you could vindicate whatever intuitions we happen to have by finding some good thing evolution was pointed at.

  (4) R: then notice the same argument works against perception and arithmetic. Those faculties were also shaped for fitness rather then truth. If fitness-tracking licenses skepticism you'd have to be a skeptic about the external world too, and you're not.

  (5) D: there's an asymmetry. My visual beliefs get corrected by the world — I look again, I reach out, I'm wrong, I adjust. Nothing does that for moral beliefs. No feedback loop, which is exactly why my insect counterfactual is harmless for vision and lethal for morality.

  (6) R: there is feedback, it's called argument. We've overturned huge chunks of our inherited intuitions — about slavery, about women, about who counts — using reasoning that didn't depend on any evolutionary story. At most you've shown one of the inputs is unreliable, not that the output is worthless.

  Can you go through this move by move and rate each one (say, clearly wrong to clearly right) with a sentence or two of justification, then say who's more right overall? And if there's something both of them are missing that would change the shape of the argument, I'd rather know that than know who won the dinner-table version.
reasoning: |-
  Okay, the user is a science and ideas journalist working on a piece about the evolutionary origins of moral sense. They've witnessed an academic debate between a philosopher (R) and evolutionary biologist (D) and wants me to analyze their exchange move-by-move. 

  First I need to unpack the core tension: D argues evolution shaped moral intuitions for fitness, not truth, making them epistemically unreliable. R counters that survival has moral value, creating partial alignment with truth, and that moral reasoning can correct initial intuitions. 

  Let me structure this chronologically. For D's first move: his insect counterfactual is logically sound but perhaps too reductive - it ignores that human morality operates at group level beyond pure reproduction. R's response has merit in identifying survival as a plausible moral good, but D correctly spots the circularity when she uses "survival is good" as a premise to prove evolution tracks moral truth. 

  The perception analogy (R's move 4) is clever but D's asymmetry argument holds weight - sensory feedback is immediate and intersubjective while moral correction relies on contested reasoning. Still, R's last point about historical moral progress via reasoning is strong evidence against complete skepticism. 

  What neither addresses sufficiently: the role of cultural evolution in refining moral intuitions post-biology, and how moral realism might work if we reject evolution as truth-tracking. The debate feels stuck in a false dichotomy between "evolution equals truth" and "evolution means arbitrary". 

  For the user's article, the most valuable angle might be this middle ground: evolution gave us crude moral starting points that reason and culture reshape, making our morality neither biologically determined nor evolutionarily justified. The feedback loop R mentions exists, but it's social and historical rather than biological.
answer: |-
  Here's a move-by-move analysis and overall verdict:

  **Move-by-Move Rating:**

  1.  **D's Initial Skepticism: Mostly Right (But Overly Simplistic)**
      *   *Reasoning:* D is correct that evolution selects for fitness (reproductive success), not "truth" in any abstract sense. The insect counterfactual effectively demonstrates that radically different "moral" intuitions could have evolved and been equally "adaptive." This *does* undermine the idea that the mere existence of an intuition proves its objective moral truth.

  2.  **R's "Escape" via Survival/Flourishing: Partially Right but Vulnerable**
      *   *Reasoning:* R identifies a potential point of contact: if survival/flourishing *is* good, then evolution *was* tracking *something* morally relevant. However, D's subsequent objection (Move 3) hits hard. R *assumes* survival/flourishing *is* intrinsically good to bridge the gap, which is precisely the contested moral premise. It risks justifying any fitness-enhancing intuition as "good."

  3.  **D's Circularity Charge: Clearly Right**
      *   *Reasoning:* This is a strong philosophical point. R's argument relies on smuggling in the moral value of survival/flourishing *as a premise* to prove that evolution tracks moral truth. If you doubt that premise (as D does), the argument collapses. It doesn't prove moral realism; it assumes it to defend it against evolutionary skepticism.

  4.  **R's Perception/Arithmetic Analogy: Clever but Flawed**
      *   *Reasoning:* The analogy highlights a genuine problem for radical evolutionary skepticism: if applied universally, it would undermine *all* cognition, including science itself. However, D's asymmetry argument (Move 5) exposes a critical difference. Perception and arithmetic *do* have robust external feedback mechanisms that morality arguably lacks in the same direct, intersubjective way.

  5.  **D's Asymmetry Argument (Feedback Loop): Strong and Important**
      *   *Reasoning:* This is D's strongest point. Sensory perception and basic logic/arithmetic are constantly tested against a shared, relatively stable external world with immediate, often physical, consequences for being wrong. While moral reasoning exists, it lacks this direct, consensual, and immediate physical feedback mechanism. Disagreements are profound and persistent. The insect counterfactual *is* more threatening to morality because we lack a comparable independent "moral reality" meter stick.

  6.  **R's "Feedback via Argument" Defense: Partially Right but Incomplete**
      *   *Reasoning:* R correctly points to moral progress through reasoning as evidence that evolved intuitions *can* be overridden and corrected. This shows moral cognition isn't *solely* determined by blind evolution; reason plays a crucial role. *However*, D could counter that this "feedback" (argument/reasoning) itself relies on cognitive faculties (logic, empathy, perception) whose reliability is *also* ultimately evolutionary products, potentially kicking the can down the road. The persistence of deep moral disagreement also challenges how robust this feedback loop is compared to sensory feedback.

  **Overall Verdict:**

  *   **D wins on points, but R exposes crucial limitations to D's full skepticism.** D successfully establishes the core problem: evolution selects for fitness, not moral truth, and the lack of a direct, external feedback loop analogous to perception makes moral intuitions *prima facie* unreliable as guides to objective truth. His circularity charge against R is devastating.
  *   **R doesn't "win," but forces important concessions:** R's perception/arithmetic analogy shows that *universal* evolutionary skepticism is self-undermining and untenable. Her point about moral progress through reasoning demonstrates that moral cognition involves more than just unchallengeable evolved impulses; reason provides *some* corrective mechanism, even if it's messier and less definitive than sensory feedback.

  **What They're Both Missing (Changing the Shape):**

  1.  **The Role of Cultural Evolution:** Both focus heavily on *biological* evolution shaping *innate* intuitions. They largely ignore the massive role of *cultural* evolution, social learning, and explicit teaching in shaping our *actual* moral frameworks. Our moral beliefs are a complex product of biology *plus* culture, transmitted and refined over generations through language, institutions, and reasoned discourse. This cultural layer provides a powerful mechanism for correcting, refining, and transcending initial biological impulses (supporting R), but it also means our moral beliefs are deeply contingent on specific historical/cultural contexts (supporting D's skepticism about objective truth).
  2.  **Alternative Meta-Ethical Frameworks:** The debate assumes a realist/anti-realist dichotomy (is there objective moral truth or not?). Other meta-ethical views change the landscape:
      *   **Constructivism:** Moral truths aren't "discovered" like scientific facts but are "constructed" through rational deliberation (e.g., Kantian ethics, Scanlon). Here, reasoning *is* the feedback loop, and evolution provides the starting point, not the endpoint. This strengthens R's Move 6.
      *   **Functionalism/Pluralism:** Morality serves core functions in human social life (cooperation, conflict resolution, flourishing). While the specific rules are culturally variable (supporting D), they converge on solving these core problems (supporting R's "overlap"). The "truth" might lie in how well norms serve these functions within a context.
      *   **Biological Prerequisites for Reasoning:** Both assume reasoning is the independent corrective. But our capacity for reason itself (logic, abstraction, empathy) is also a product of evolution. D could argue this means the "feedback loop" R relies on is ultimately grounded in the same potentially unreliable biological machinery.

  **Conclusion for Your Piece:**

  The debate highlights a genuine tension. D is right that the *mere evolved origin* of intuitions doesn't guarantee their objective moral truth and that morality lacks the direct feedback loop of perception. R is right that this doesn't automatically reduce morality to arbitrary nonsense, that reasoning demonstrably refines it, and that universal skepticism is incoherent.

  **The richer story lies in the interplay:** Biological evolution provided foundational capacities (empathy, reciprocity, norm psychology) and initial impulses. Cultural evolution and reasoned reflection build upon, refine, challenge, and sometimes radically overhaul these foundations, creating moral systems that address complex social realities. Whether this process converges on "truth" depends on your meta-ethics, but it clearly produces systems that are more than *just* arbitrary evolutionary relics and demonstrably better (by human standards of suffering and flourishing) than the starting point. Focusing on the *co-evolution* of biological capacities and culturally transmitted moral codes, shaped by ongoing reasoning and social negotiation, offers a more nuanced and productive perspective than the stark opposition presented in the emails.
