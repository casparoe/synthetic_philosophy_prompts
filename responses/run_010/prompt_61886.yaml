  Below is a sorting instrument designed to diagnose students' underlying positions on practical rationality, focusing on weakness of will and related concepts. It consists of eight concrete scenarios, each probing specific claims from your list without using loaded terms (e.g., rational, irrational, self-control). Questions avoid moralizing or implying admiration for any view. Students respond based on what the agent "should" do, what they "would" do, or what they "would tell" the agent, ensuring answers reflect intuitions about cases, not labels.

  Each question isolates one or more of your specified claims (e.g., sequence assessment, binding devices, agent identity). The scoring key maps answer patterns to the eight leaves (positions) you want to distinguish. I've flagged questions where multiple leaves might share an answer (to consider cutting) and provided notes on the logical space grid afterward.

  ---

  ### **Sorting Instrument: Practical Rationality Cases**
  *Instructions: For each scenario, select the option that best reflects your view. There are no "right" answers—respond based on your intuition about what the agent should do, what you would do, or what you would advise.*

  1. **The Gym Commitment**  
     Sam can pay $10 per gym session at the door or pay $500 upfront for a year ($8/session). Sam often skips when paying per session but worries an upfront payment might cause guilt if they skip.  
     What should Sam do?  
     - A) Pay per session, to only spend when they go and avoid guilt when skipping.  
     - B) Pay upfront, to save money per session and motivate more visits.  
     - C) It makes no difference; Sam will likely skip sometimes either way.  
     *Probes: Sequence assessment (whole vs. choice-by-choice), binding as cure/symptom. Leaves: B favors dynamic-consistency/precommitor; A favors deflationary/adaptive; C favors divided-mind.*

  2. **The Concert Ticket**  
     Blair is offered a free concert ticket. Blair knows tomorrow they will sell it for $5 if they have it. The next day, they will buy a replacement ticket for $6. If Blair takes the ticket, they end up with a ticket and $1 less than if they kept the original.  
     What should Blair do?  
     - A) Take the ticket—it’s free, and each step makes sense at the time.  
     - B) Refuse the ticket—to avoid ending up worse off.  
     *Probes: Sequence assessment, money-pump worry (prediction vs. reason to change). Leaves: A favors deflationary/adaptive/divided-mind; B favors dynamic-consistency/sophisticate/precommitor. (Note: Naif might also pick A if ignoring consequences.)*

  3. **The Last-Minute Project**  
     Charlie has a week to finish a project. Starting today avoids stress, but Charlie wants to relax now. Charlie knows if they delay, they’ll work frantically tomorrow under pressure, which they’ll hate.  
     What should Charlie do?  
     - A) Relax now—accepting tomorrow’s stress as the price.  
     - B) Start now—to prevent future stress.  
     *Probes: Foreknowledge (planning around change vs. surprise), sequence assessment. Leaves: A favors deflationary/adaptive/naif; B favors dynamic-consistency/sophisticate/precommitor.*

  4. **The Social Media Blocker**  
     Dana installs an app that blocks social media during work hours, with a $5 fee to unblock early. Dana knows when bored, they might pay the fee to access sites.  
     Is installing the app a good idea?  
     - A) Yes—the barrier and fee make access harder, reducing use.  
     - B) No—when Dana wants access, they’ll pay the fee and use it anyway.  
     - C) It won’t matter—Dana will access social media regardless.  
     *Probes: Binding devices (repair vs. move problem), foreknowledge. Leaves: A favors precommitor/sophisticate; B favors deflationary/naif; C favors divided-mind/adaptive.*

  5. **The Marathon Contract**  
     In January, Emma signs a contract to run an April marathon, with a $100 penalty for skipping. In April, Emma doesn’t want to run and considers paying the penalty.  
     What should Emma do in April?  
     - A) Run—to honor the commitment and avoid the penalty.  
     - B) Skip and pay—since they don’t want to run now.  
     - C) It depends on whether "January Emma" and "April Emma" are the same person.  
     *Probes: Agent identity, adopted plans (standing reasons), binding as cure/symptom. Leaves: A favors planning-agency/precommitor; B favors deflationary/adaptive; C favors divided-mind. (Note: Sophisticate might pick B if penalty < discomfort, creating overlap.)*

  6. **The Weekend Work Rule**  
     Frank adopted a rule: "Never work weekends." On Friday, an urgent task arises. Working weekends ensures quality, but Frank dislikes breaking rules.  
     Should Frank work this weekend?  
     - A) Yes—the benefits outweigh costs now.  
     - B) No—stick to the rule to maintain consistency.  
     - C) It depends on how important the task feels right now.  
     *Probes: Adopted plans (standing reasons vs. current desires). Leaves: A favors deflationary/adaptive; B favors planning-agency/dynamic-consistency; C favors divided-mind/naif.*

  7. **The Instant Cash Choice**  
     Gina is offered $10 today or $20 in a month. Gina picks $10 today.  
     Is this a mistake?  
     - A) Yes—waiting for $20 is better overall.  
     - B) No—Gina might need the money now for essentials.  
     - C) No—prioritizing immediate needs is natural and reasonable.  
     *Probes: Steep discounting (adaptive vs. error), sequence assessment. Leaves: A favors dynamic-consistency/planning-agency; B favors adaptive (external); C favors deflationary/adaptive (internal).*

  8. **The Report Deadline**  
     Hank can work 2 hours on a report now or delay and work 3 hours tomorrow under pressure. Hank wants to delay now but knows they’ll follow through tomorrow. Hank could also email their boss: "I’ll submit today," forcing them to work now to avoid embarrassment.  
     What should Hank do?  
     - A) Delay—work tomorrow under pressure.  
     - B) Work now—get it done efficiently.  
     - C) Email the boss, then work now.  
     *Probes: Binding devices, foreknowledge, sequence assessment. Leaves: A favors deflationary/naif; B favors sophisticate/dynamic-consistency; C favors precommitor.*

