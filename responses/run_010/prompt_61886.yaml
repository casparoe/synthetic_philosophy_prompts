  ### **Logical Space Grid**
  The grid axes are your seven claims. Each claim is binary (Yes/No) for simplicity, though some admit gradations. The grid has 128 cells (2^7), but most are empty. I categorize empties as: **Incoherent** (logically contradictory), **Unexplored** (coherent but no proponents), or **Stable but Vacant** (coherent and potentially stable, just unclaimed). Your eight leaves occupy 8 cells; I map these first.

  #### **Claims (Axes)**:
  1. **Sequences assessable** (Y/N): Can a sequence be judged irrational even if every choice is best at the time?  
  2. **Prediction → Reason** (Y/N): Is "you’ll pay to switch and end up worse off" a *reason* to change now (not just a prediction)?  
  3. **One agent matters** (Y/N): Does verdict change if January and April actors aren’t the "same agent"?  
  4. **Foreknowledge works** (Y/N): Does knowing you’ll change your mind let you plan around it?  
  5. **Binding repairs** (Y/N): Does a device (e.g., penalty clause) fix the problem, or just move it?  
  6. **Standing reasons** (Y/N): Do adopted plans create reasons beyond current desires?  
  7. **Discounting adaptive** (Y/N): Is steep near-term discounting biologically adaptive (not irrational)?  

