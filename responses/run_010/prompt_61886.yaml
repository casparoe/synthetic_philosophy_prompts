  What should Alex do? 
  A) Pay per session, because each time they go they only pay if they actually go and avoid feeling guilty when they skip.
  B) Pay the upfront fee, because it will save money per session and the commitment will help them go more often.
  C) It doesn't matter; Alex will end up spending the same either way because the upfront fee might lead to more sessions but also more guilt.

  This question probes:
