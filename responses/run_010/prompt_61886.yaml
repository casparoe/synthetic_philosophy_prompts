  1. Dynamic-consistency view (sequence as the unit of assessment)
  2. Precommitor (binds future self to avoid inconsistency)
  3. Sophisticate (plans around future changes of mind)
  4. Naif (does not anticipate future changes of mind)
  5. Divided-mind/multiple-selves view (no single subject)
  6. Planning-agency view (failure to govern by adopted plans)
  7. Deflationary view (no akrasia, just stronger contrary desire)
  8. Adaptive view (steep discounting as adaptive)

  We also note the claims that divide the field:

  - Whether a sequence of choices can be assessable even if every choice is best at the time (money-pump worry)
  - Whether "you'll end up paying to switch and be worse off" is a reason to change now or just a prediction; whether binding is a cure or symptom
  - Whether the January and April persons are one agent and if that matters
  - Whether foreknowledge does any work (planning around change vs. being surprised)
  - Whether devices (penalty clauses, etc.) repair the problem or just move it
