    - **N, Y, N, Y, Y, N, Y**: *Sequences not assessable, prediction is reason, not one agent, foreknowledge works, binding repairs, no standing reasons, discounting adaptive.*  
      Status: **Incoherent**. If prediction is a reason (2=Y), it implies sequences *can* be assessed (1=Y), so 1=N clashes.  
    - **Y, Y, N, Y, N, Y, N**: *Sequences assessable, prediction is reason, not one agent, foreknowledge works, binding doesn’t repair, standing reasons, discounting not adaptive.*  
