answer: |-
  ### Game Design: **"Collapse or Transform?"**  
  A 75-minute, evidence-based debate game for 12 engineers, focused on evaluating societal "collapse" vs. transformation using elite-centric data.  

  ---

  ### **Game Components**  
  1. **Evidence Packets** (3 societies):  
     Each packet includes:  
     - A brief context paragraph (location, era, key elite structures).  
     - A table of data spanning 5–7 centuries (mixed metrics, 90% elite-focused).  
     - *No interpretations or conclusions*—only raw data and notes.  

  2. **Roles & Scoring**:  
     - **Roles per Team (4 players each)**:  
       - **Data Analyst**: Tracks trends in the table.  
       - **Elite Skeptic**: Questions bias in elite evidence.  
       - **Narrative Challenger**: Flags gaps between data and popular myths.  
       - **Verdict Master**: Ensures consensus and writes the verdict.  
     - **Scoring**:  
       - 1 point for a unanimous verdict.  
       - Bonus point if the verdict references *non-elite evidence contradictions*.  
       *(No competitive scoring—focus on consensus. Points are for internal motivation.)*  

  3. **Whiteboard Setup**:  
     - Columns: `Society | Collapse? (Y/N) | Key Evidence | Elite Bias?`.  
     - Teams fill this during debrief.  

  4. **Printed Materials**:  
     - 3 evidence packets (1 per society, print 4 copies each for teams).  
     - Verdict sheets (simple template: `[ ] Collapse [ ] Transformation | Reasoning: _________`).  

  ---

  ### **Evidence Packets**  
  Data is simplified but plausible, based on real archaeological/historical proxies. Non-elite evidence (health markers) is sparse and ambiguous.  

  #### **Packet 1: Kingdom of Heloria** (Inspired by **Classic Maya**)  
  *Collapse per Diamond’s definition—population and complexity decline together.*  
  - **Context**: Tropical lowlands (400–900 CE). Monumental cities, royal inscriptions, long-distance jade trade.  
  - **Data Table**:  

  | Century | Population (est. thousands) | Palaces/Temples Built | Inscriptions Found | Trade Volume (scale 1-10) | Avg. Skeletal Height (cm) | % Skeletons w/Malnutrition |
  |---------|-----------------------------|------------------------|--------------------|---------------------------|----------------------------|----------------------------|
  | 400-500 | 750                         | 12                     | 45                 | 8                         | 162                        | 25%                        |
  | 500-600 | 900                         | 18                     | 62                 | 9                         | 163                        | 20%                        |
  | 600-700 | 1,100                       | 22                     | 78                 | 9                         | 164                        | 15%                        |
  | 700-800 | 850                         | 8                      | 32                 | 6                         | 162                        | 30%                        |
  | 800-900 | 300                         | 0                      | 2                  | 2                         | 159                        | 45%                        |  

  - **Notes**:  
    - *700–800 CE*: Last dated royal monument (798 CE).  
    - *800–900 CE*: Pollen shows forest regrowth on farmland.  

  #### **Packet 2: The Riverland Federation** (Inspired by **Indus Valley/Late Bronze Age**)  
  *Transformation: Political complexity collapses, but population disperses and health improves.*  
  - **Context**: River delta (1800–1200 BCE). Central granaries, standardized weights, clay tablets.  
  - **Data Table**:  

  | Century  | Population (est. thousands) | Administrative Seals Found | Monumental Buildings | Trade Volume (scale 1-10) | Avg. Skeletal Height (cm) | % Skeletons w/Malnutrition |
  |----------|-----------------------------|----------------------------|----------------------|---------------------------|----------------------------|----------------------------|
  | 1800-1700| 200                         | 85                         | 15                   | 8                         | 158                        | 30%                        |
  | 1700-1600| 250                         | 92                         | 18                   | 9                         | 159                        | 25%                        |
  | 1600-1500| 300                         | 105                        | 22                   | 9                         | 160                        | 20%                        |
  | 1500-1400| 280                         | 40                         | 8                    | 5                         | 161                        | 18%                        |
  | 1400-1300| 320                         | 12                         | 2                    | 3                         | 162                        | 15%                        |
  | 1300-1200| 350                         | 0                          | 0                    | 2                         | 163                        | 12%                        |  

  - **Notes**:  
    - *1400–1300 BCE*: Clay tablets stop; last central warehouse abandoned.  
    - *1300–1200 BCE*: Settlement maps show smaller, dispersed villages.  

  #### **Packet 3: Rapa Nui Society** (Inspired by **Easter Island**)  
  *Narrative Challenge: Popular ecocide story vs. evidence of resilience.*  
  - **Context**: Remote island (1000–1800 CE). Moai statues, elite-controlled ahu platforms.  
  - **Data Table**:  

  | Century | Population (est. thousands) | Moai Erected | Ahu Platforms Maintained | Elite Residences | Avg. Skeletal Height (cm) | Fish Bones in Middens (kg/ha) |
  |---------|-----------------------------|--------------|--------------------------|------------------|----------------------------|-------------------------------|
  | 1000-1200| 3                           | 15           | 10                       | 8                | 167                        | 50                            |
  | 1200-1400| 6                           | 40           | 25                       | 20               | 168                        | 45                            |
  | 1400-1500| 10                          | 55           | 30                       | 28               | 168                        | 40                            |
  | 1500-1600| 10                          | 5            | 20                       | 15               | 169                        | 55                            |
  | 1600-1700| 9                           | 0            | 10                       | 5                | 169                        | 60                            |
