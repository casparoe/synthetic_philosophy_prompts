  - **Notes**:  
    - *1500–1600 CE*: Palm pollen vanishes (deforestation complete).  
    - *1600–1700 CE*: Statue-building stops; oral histories describe "clan reforms."  
    - *1700–1800 CE*: European contact (1722 CE); slave raids begin.  

  ---

  ### **Timeline (75 Minutes Total)**  
  1. **0–5 min: Setup**  
     - Split into 3 teams of 4. Assign roles.  
     - Hand each team 1 evidence packet, verdict sheet, and pens.  
     - State the goal: *"Was this a collapse (per Diamond’s definition) or a transformation?"*  

  2. **5–35 min: Team Analysis (30 min)**  
     - Teams review packets. Emphasize: *"Focus on the evidence—ignore what you ‘know.’"*  
     - **Critical Moments to Engineer**:  
       - *Heloria (Packet 1)*: "Records stop at 800 CE!" → "But does that mean collapse, or just elites losing power?"  
       - *Riverland (Packet 2)*: "Seals and monuments vanish!" → "Yet health improves—is this collapse or decentralization?"  
       - *Rapa Nui (Packet 3)*: "They deforested and collapsed!" → "But population was stable until Europeans. Did they adapt?"  

  3. **35–45 min: Verdict Submission (10 min)**  
     - Teams write verdicts with 1–2 key evidence points.  
     - **Rule**: No abstentions—must commit.  

  4. **45–65 min: Rotate & Rebut (20 min)**  
     - Teams swap packets. Each team now argues *against* the previous verdict:  
       - E.g., If Team 1 called Rapa Nui a "collapse," Team 2 must argue "transformation."  
     - Forces engagement with ambiguity.  

  5. **65–75 min: Debrief (10 min)**  
     - Teams share verdicts. Fill whiteboard:  
       - `Society | Collapse? | Key Evidence | Elite Bias?`  
     - **Facilitator Qs**:  
       - *"Where did elite evidence mislead you?"*  
       - *"When did non-elite data (e.g., health) contradict the ‘collapse’ narrative?"*  
       - *"Is collapse an objective event—or a label we slap on change we dislike?"*  
     - End with: *"Historians debate these societies for decades. You did it in 75 minutes."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"We need more data!"** → *Lean into it:* "You have only elite records—make a call anyway."  
  2. **Refusal to commit** → *Force a vote:* "Verdict Master, break ties."  
  3. **Gaming scoring** → *Downplay points:* Focus on consensus in debrief.  
  4. **Over-reliance on pop culture** → *Use Packet 3 (Rapa Nui):* Data contradicts the "ecocide" myth.  

  ---

  ### **What the Game Can’t Do**  
  - **Reproduce historian expertise**: Real debates involve decades of scholarship, not 3 tables. You’ll need to remind players: *"This is a simplification—real evidence is messier."*  
  - **Embody lived experience**: The game is analytical. To evoke human stakes, add during debrief: *"Imagine farmers in Riverland: their kings vanished, but their kids grew taller. Was that collapse?"*  
  - **Resolve the Diamond debate**: The game exposes ambiguity in "collapse" as a concept—it won’t prove Diamond right/wrong. Hammer this in debrief: *"Collapse isn’t a fact—it’s a story we tell about change."*  

  ---

  ### **Why This Works for Engineers**  
  - **Data-centric**: Tables let them quantify "drastic drops."  
  - **Bias spotlight**: Elite evidence forces them to question proxies (e.g., "No inscriptions = no society?").  
  - **Narrative friction**: Packet 3 (Rapa Nui) mirrors their Easter Island argument, making it personal.  

  **Final Tip**: Print packets in large font—engineers love legible data. Run it tight on time to force decisions. Good luck!
