  Below is a decision tree designed to classify the decline of a historical norm into one of seven explanation families. The tree uses **factual, record-settable questions** (no subjective judgments) and includes explicit tie-breaking rules. It prioritizes mechanisms in a specific order to handle overlaps, and flags limitations in separating certain leaves. I'll first present the tree, then analyze hard-to-separate pairs, empty cells, and finally run it on your three cases.

  ---

  ### **Decision Tree for Norm Decline**  
  **Input:** Historical facts about a norm's decline.  
  **Output:** One of seven explanation families.  
  **Tie-breaking rule:** The tree evaluates mechanisms in a fixed order (coercion → interest → persuasion → honor → positional → drift → sensibility). The first matching leaf wins.  

  1. **Was a new enforcement institution (e.g., police, inspectorate, licensing) introduced around the time of decline?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **Did the norm persist in regions *without* this institution?**  
     - **Yes** → Go to 3.  
     - **No** → **Output: 5. Coercion/State Capacity** (Enforcement made the norm impossible/ruinous).  

  3. **Did material profitability/benefit decline for the powerful *before* the norm declined?**  
     - **Yes** → Go to 4.  
     - **No or N/A** → Go to 5.  

  4. **Did the norm decline first among its core practitioners (insiders)?**  
     - **Yes** → **Output: 4. Interest Convergence** (Stopped paying for the powerful).  
     - **No** → Go to 5.  

  5. **Were moral arguments against the norm available ≥20 years before decline began?**  
     - **No** → Go to 6.  
     - **Yes** → Go to 7.  

  6. **Did decline begin ≤10 years after moral arguments became widely known?**  
     - **Yes** → Go to 8.  
     - **No** → Go to 9.  

  7. **Did core practitioners lead the abandonment?**  
     - **Yes** → Go to 10.  
     - **No** → Go to 9.  

  8. **Did core practitioners describe the norm as "morally wrong" after decline?**  
     - **Yes** → **Output: 1. Rational Persuasion** (Arguments finally landed).  
     - **No** → Go to 9.  

  9. **Did core practitioners describe the norm as "vulgar," "embarrassing," or "shameful" after decline?**  
     - **Yes** → **Output: 2. Honor Restructuring** (Became dishonorable).  
     - **No** → Go to 11.  

  10. **Did the practice become more widespread (less exclusive) before decline?**  
      - **Yes** → **Output: 7. Positional/Fashion Dynamics** (Lost elite status).  
      - **No** → Go to 11.  

  11. **After decline, did practitioners describe the norm as "unnecessary" or avoid discussing it?**  
      - **Yes** → **Output: 6. Generational Drift** (Aged out without conversion).  
      - **No** → **Output: 3. Sensibility Shift** (New feelings/revulsion).  

  ---

  ### **Key Design Notes**  
  - **Tie-breaking:** Coercion > interest > persuasion > honor > positional > drift > sensibility. This reflects a hierarchy from most structurally visible (enforcement) to most culturally subtle (sensibility).  
  - **Avoided "Complicated" Leaves:** Every path ends in one output. Mixed cases are resolved by the tie-breaker.  
  - **Rejected Leaf Split:** I kept your 7 families intact, but note that "sensibility shift" (3) and "generational drift" (6) are porous; they share a reliance on cultural inertia.  

  ---

  ### **Hard-to-Separate Pairs & Evidence Gaps**  
  1. **Honor Restructuring (2) vs. Sensibility Shift (3):**  
     - Both involve cultural change and often overlap (e.g., "shame" could be social or visceral).  
     - **Separating evidence:** Look for *who enforced the stigma*. If condemnation came from the group's **traditional honor community** (e.g., peers, guilds), it leans toward honor. If it came from **broader society/media** (e.g., novels, newspapers) and emphasized visceral reactions (disgust, empathy), it leans toward sensibility. If ambiguous, the tree favors honor due to earlier placement.  

  2. **Honor Restructuring (2) vs. Positional Dynamics (7):**  
     - Both involve status loss and elite abandonment.  
     - **Separating evidence:** Check if the practice became **democratized** (positional) or **stigmatized without democratization** (honor). Positional requires evidence of the norm spreading to lower classes/groups before decline (node 10).  

  3. **Rational Persuasion (1) vs. Honor Restructuring (2):**  
     - Both might cite moral arguments.  
     - **Separating evidence:** Focus on **post-decline justifications**. If practitioners call it "morally wrong" (belief change), it’s persuasion; if "shameful" (status loss), it’s honor.  

  **Unresolvable Gap:** If a case has no records of practitioners' post-decline statements (node 9/11), honor/sensibility/drift become indistinguishable. The tree defaults to honor (node 9) or drift (node 11) based on the tie-breaker.  

  ---

  ### **Empty Cells & Why They’re Empty**  
  - **Coercion without enforcement persistence (Q2=Yes):** The tree routes to other mechanisms, but a "coercion + cultural shift" hybrid isn't captured.  
     - **Why empty:** Structurally unstable. Enforcement without necessity implies the norm was already dying culturally (e.g., dueling laws passed after elites abandoned it).  
  - **Interest convergence without insider abandonment (Q4=No):** If the powerful benefited but didn’t quit first, the tree skips interest.  
     - **Why empty:** Incoherent. If the norm became unprofitable, insiders would logically lead abandonment to cut losses.  
  - **Persuasion with delayed arguments (Q6=No):** Arguments >20 years old but no decline for decades.  
     - **Why empty:** Unstable over time. Persistent arguments without action suggest hidden barriers (e.g., honor or interests blocking change).  
  - **Positional dynamics without core abandonment (Q10 + outsiders):** The tree routes to sensibility/drift.  
     - **Why empty:** Rare. Positional decline typically starts with elites (e.g., fashion trends); if outsiders quit first, it’s likely coercion or moral shift.  

  ---

  ### **Case Analyses**  
  I’ll run the tree on your cases, quoting historical consensus for context. Paths are evaluated step-by-step.  

  #### **1. Britain Ending Atlantic Slave Trade (1807)**  
  - **Path:**  
    - Q1: **Yes** (Royal Navy enforcement).  
    - Q2: **No** (Trade continued where Britain couldn’t enforce; e.g., Brazil). → **Output: 5. Coercion/State Capacity**.  
  - **Why it fits:** The 1807 Act depended on naval suppression. Profitability declined (per Eric Williams), but enforcement was decisive.  
  - **Tree’s Blind Spot:** Ignores abolitionist arguments/honor shifts. Coercion wins via tie-breaker.  

  #### **2. Dueling Among English Gentlemen (~1840s)**  
  - **Path:**  
    - Q1: **No** (No dedicated anti-dueling police).  
    - Q3: **No** (Dueling wasn’t materially profitable).  
    - Q5: **Yes** (Arguments since 1600s).  
    - Q7: **Yes** (Gentlemen led abandonment).  
    - Q9: **Yes** (Called "barbaric" and "unworthy of gentlemen"). → **Output: 2. Honor Restructuring**.  
  - **Why it fits:** Appiah’s core case. Elites framed dueling as dishonorable, not unprofitable.  

  #### **3. Executions Moved Inside Prisons (England, 1868)**  
  - **Path:**  
    - Q1: **Yes** (Prisons/inspectorates under Capital Punishment Amendment Act).  
    - Q2: **No** (Public executions persisted where enforcement lapsed; e.g., colonies). → **Output: 5. Coercion/State Capacity**.  
  - **Why it *might* misdiagnose:** Cultural shifts (sensibility) drove the law, but the tree prioritizes enforcement.  
  - **Added Node to Catch It:** Insert after Q1:  
    > **"Did public calls to end the norm emphasize visceral disgust (e.g., 'brutalizing,' 'sickening') over moral/economic arguments?"**  
    > - **Yes** → Override to sensibility shift (3).  
    > - **No** → Proceed.  
    This would catch the shift in public sensitivity to violence (e.g., Victorian sensibilities).  

  ---

  ### **Weakest Diagnosis & Improvement**  
  - **Most Plausible Misdiagnosis:** **Public executions (Case 3)**. The tree blames coercion, but sensibility shifts were pivotal (e.g., newspapers decried the "barbarity" of crowds).  
  - **Added Node:** As above. **Evidence:** Quotes from debates/petitions (e.g., "degrading spectacle," "repulsive to public feeling").  
  - **Why the Tree Struggles:** Sensibility shifts (3) are last in the tie-breaker and lack a dedicated trigger. The new node isolates visceral language in primary sources.  

  This tree will sometimes misassign complex cases, but it forces explicit tests for each mechanism. To use it, historians must gather data on enforcement timing, profit curves, abandonment patterns, and post-decline statements—settling debates with evidence, not ideology.
