          - The epistemic payoff: if experience is penetrated, then the justificatory power of perception is undermined because your beliefs are influencing what you see. But if only judgment is affected, then the experience itself remains a source of justification, though our reports may be biased.

  Failure modes:
     - Loud student guesses the hypothesis: If someone says early on that the order might affect things, say "That's an interesting thought; let's see what the data shows." Don't confirm or deny.
     - Order effects bleeding into each other: We have rinsing, but if the first beverage affects the taste of the second, that's a carryover effect. We can't avoid it entirely. Acknowledge it as a limitation.
     - Non-tasters feel like furniture: Make sure the Experimenter and Data Recorder have active roles. The Experimenter interacts with each taster, and the Data Recorder is in charge of the whiteboard and calling out numbers.
     - Beverage difference too obvious: Choose two juices that are not too different. Or use the same juice for both? But then if they notice, it might spoil the expectation effect. We can reveal at the end that they were different (or the same) to make a point.

  What the activity cannot reproduce:
     - In perception studies, we often have objective measures (like eye-tracking) or indirect measures that are less susceptible to judgment bias. In our activity, we only have self-report. So we cannot demonstrate genuine perceptual penetration vs judgment bias with certainty. We can only show that there are alternative explanations for the data.

  Verdict: Expectation and order jointly influence reported enjoyment.

  Given the complexity, here is a runnable package with the understanding that the pattern might not be perfect, but the discussion can proceed from whatever pattern emerges.

  Detailed timeline and materials:

  Materials:
  - Two pitchers, one labeled "A: Premium Wine", the other "B: Budget Wine"
  - In pitcher A: white grape juice (or a nicer juice)
  - In pitcher B: apple juice (or a less expensive juice)
  - 20 small cups (two per taster)
  - Water and cups for rinsing
  - Index cards (20, two per taster)
  - Markers for whiteboard
  - Notecard for Experimenter with the descriptions

  Roles:
  - Experimenter (non-alcohol student): They will read the descriptions, pour the beverages, and hand them to the tasters in the assigned order. They also manage the rinsing.
  - Data Recorder (dairy-issue student): They will distribute and collect index cards. After the tasting, they will call out the ratings and write them on the whiteboard.

  Timing (75 minutes):

  1. (0-5 min) Introduction: 
     - "Today we're doing an activity on the psychology of taste perception. We have two wines to taste, and each of you will taste both. We are interested in how expectations influence perception."
     - Assign roles: Experimenter and Data Recorder. Randomly divide the remaining 10 students into Group1 and Group2 (5 each).

  2. (5-8 min) Setting expectations:
     - Experimenter reads the descriptions of the two wines (premium and budget) without specifying which is which yet.
     - Then Experimenter points to the pitchers: "This is the Premium Wine (A) and this is the Budget Wine (B)."

  3. (8-10 min) Explain the procedure:
     - "Group1 will taste the Premium Wine (A) first, then the Budget Wine (B). Group2 will taste the Budget Wine (B) first, then the Premium Wine (A)."
     - "For each wine, you will first rate how much you expect to enjoy it on a scale of 1 to 10. Then you will taste it and rate how much you actually enjoyed it on the same scale."

  4. (10-30 min) Tasting and rating:
     - Data Recorder gives two index cards to each taster.
     - For the first wine:
          - Taster writes their name, group, and which wine they are about to taste (A or B) on the card.
          - Then they write: "Expectation: [number]"
          - Experimenter pours a small amount of the first wine for the taster.
          - Taster tastes it.
          - Then they write: "Enjoyment: [number]"
     - Taster rinses with water (provided by Experimenter).
     - Repeat for the second wine on the second card.

  5. (30-35 min) Data collection:
     - Data Recorder collects all cards.

  6. (35-50 min) Tallying:
     - On the whiteboard, Data Recorder makes a table:
          Taster | Group | First: Wine | First: Expect | First: Enjoy | Second: Wine | Second: Expect | Second: Enjoy
     - For each taster, fill in the row.
     - Then, at the bottom, compute:
          - Average Expectation for A, for B.
          - Average Enjoyment for A, for B.
          - For Group1: average enjoyment for A and for B.
          - For Group2: average enjoyment for B and for A.
          - Also, average enjoyment for first wine (across groups) and for second wine.

  7. (50-70 min) Discussion and debrief:
     - Start by asking: "What patterns do you see?"
     - They might notice that the overall enjoyment for A and B are similar.
     - Then point out that in Group1, the ratings for A and B might be different, and in Group2, the ratings for B and A might be different in the opposite way.
     - Ask: "Why might that be?" Guide them to consider order.
     - Then ask: "How do we know whether the expectation changed the actual taste experience or only the reported enjoyment?"
     - Discuss the philosophical distinction: penetration vs judgment.
     - Map specific moments:
          - The overall flat average is like a study that doesn't control for order effects and might miss the expectation effect.
          - The within-group pattern shows the expectation effect but is confounded with order.
          - The fact that we needed to counterbalance to see the pattern mirrors good experimental design.
     - Epistemic payoff: If experience is penetrated, then the justificatory role of perception is compromised because it is not independent of beliefs. But if only judgment is affected, then the experience itself is still a reliable foundation, though our reports might be biased.

  8. (70-75 min) Wrap-up: Reveal that both were non-alcoholic juices. Explain that the activity illustrates the challenge of studying cognitive penetrability.

  Failure modes and fixes:
     - Order effects dominate: This is likely and can be used to make the point about confounds.
     - Loud student: If someone says early on that order matters, say "That's a hypothesis we can test with the data."
     - Non-tasters: The Experimenter and Data Recorder are active throughout. The Data Recorder is the center of attention during tallying.
     - One beverage is universally preferred: Choose two juices that are equally liked on average. Or use the same juice in both pitchers? But then we have to hope they don't notice. If they do, we can say: "Even though the wine was the same, the expectation might have influenced your rating."

  What the activity cannot do: It cannot conclusively demonstrate cognitive penetrability because we only have self-report. It only shows that reports are influenced by expectation and order, which could be judgment effects. To argue for penetrability, we would need additional evidence that the experience itself changed, which this activity does not provide.

  Verdict: Reported enjoyment is jointly influenced by expectation and order.
answer: |-
  ### Exercise Purpose  
  This activity creates a controlled, experiential puzzle where students must confront the gap between subjective reports and perceptual experience, mirroring the core evidentiary challenge in the cognitive penetrability debate—without announcing the distinction upfront.

  ---

  ### Runnable Package  
  **Materials**  
  - **Beverages**: Two pitchers—one with chilled apple juice (labeled "A"), one with chilled white grape juice (labeled "B"). Both are non-alcoholic and dairy-free.  
  - **Cards & Tools**: Index cards (20), markers (12), whiteboard, two coin-sized stickers (one red, one blue).  
  - **Setup**:  
    - Place pitchers on a central table. Prep index cards: 10 pairs (one labeled "1st Taste," one "2nd Taste"), each pair pre-assigned to a taster with order counterbalanced (see **Roles**).  

  **Roles**  
  - **Non-alcohol taster**: Serves as the *Blind Pourer*. They handle pitchers (never tasting) and never see labels.  
  - **Dairy-issue student**: Serves as *Data Custodian*. They shuffle and distribute cards, then record whiteboard tallies.  
  - **Tasters (10 students)**: Split into two groups by card assignment:  
    - Group 1 (5 students): Tastes A then B.  
    - Group 2 (5 students): Tastes B then A.  

  **Rules**  
  1. **No discussion** during tasting or rating.  
  2. Tasters rate *enjoyment* (1–10) for each beverage immediately after tasting.  
  3. **No rinsing** between tastes (to amplify contrast effects).  

  ---

  ### Minute-by-Minute Timeline (75 Min Total)  
  **0–5 min: Setup & Roles**  
  - Assign roles. Blind Pourer is shown pitchers *without labels*. Data Custodian shuffles cards, distributes one pair per taster.  
  - Announce: *"We’re exploring how descriptions shape sensory evaluation. Taste both beverages in your assigned order. Rate enjoyment immediately after each sip—no overthinking."*  

  **5–15 min: Expectation Priming**  
  - Hold up pitcher A: *"This is a rare, sweet ice wine from a boutique vineyard. It’s rich and layered."*  
  - Hold up pitcher B: *"This is a budget cider from concentrate. It’s sharp and one-dimensional."*  
  - **Crucial**: Do *not* mention perception or penetration.  

  **15–35 min: Tasting & Rating**  
  - **Blind Pourer**: Turns away. Data Custodian sticks a red sticker on pitcher A and blue on B (visible only to Data Custodian). Blind Pourer pours based on sticker (A=red, B=blue), unaware of descriptions.  
  - Tasters sip in assigned order, rating each *enjoyment* (1–10) on their cards. Data Custodian collects cards.  

  **35–50 min: Data Tally**  
  - Data Custodian writes on whiteboard:  
    | Group | Order | Avg Enjoyment (1st) | Avg Enjoyment (2nd) |  
    |-------|-------|----------------------|----------------------|  
    | 1     | A→B   | [value]             | [value]             |  
    | 2     | B→A   | [value]             | [value]             |  
  - Calculate averages *separately* for first and second tastings per group.  

  **50–70 min: Discussion & Debate**  
  - **Step 1: Surface the puzzle**  
    - Point to whiteboard: *"Group 1’s first drink (A) averaged 7.4; second (B) 3.8. Group 2’s first drink (B) averaged 6.6; second (A) 4.2. But overall, A=5.8, B=5.2—nearly identical. Why the discrepancy?"*  
    - **Predictable reactions**:  
      - *"The first taste always gets higher ratings!"* (order effect)  
      - *"But the ‘ice wine’ should’ve been rated higher!"* (expectation effect)  
  - **Step 2: Force the distinction** (10-min argument)  
    - Interject: *"When Group 2 tasted B first, did they *experience* it as ‘rich’ or just *rate* it higher because it was first?"*  
    - **Map to philosophy**:  
      - *"If expectation changes *experience*, the ice wine should’ve *tasted* better—even when second. If it only changes *judgment*, Group 2’s high rating for B was just reporting bias."*  
      - Epistemic payoff: *"If experience is penetrated, your beliefs alter how things seem. ‘How-things-look’ can’t independently justify those beliefs—it’s circular. If only judgment shifts, experience *could* still be neutral evidence."*  

  **70–75 min: Reveal & Debrief**  
  - Blind Pourer reveals stickers/contents. Data Custodian reveals labels.  
  - **Debrief links**:  
    - *"The order effect masked expectation’s role—just like poor controls in penetrability studies hide cognitive effects."*  
    - *"You fought over whether ratings reflected taste or judgment. That *is* the penetration debate: does cognition alter the *sensory impression* or just the *post-hoc story*?"*  

  ---

  ### Failure Modes & Fixes  
  - **Order effects bleed**: Likely, as no rinsing exaggerates contrast. **Fix**: Lean into it—*"Yes, sequence matters. But why didn’t ‘ice wine’ override this when tasted second?"*  
  - **Loud student guesses early**: If someone says, *"This is about expectations vs. reality!"* in priming phase: *"Hold that thought—let’s see if the data supports it."* If post-tasting, *"Great hypothesis—does Group 2’s data back it?"*  
  - **Non-tasters feel sidelined**: **Fix**: Blind Pourer’s role is critical—only they know stickers are meaningless (juices were random). Data Custodian’s tally choices (e.g., grouping data) subtly steer conclusions.  
  - **Ratings cluster**: If all rate A=8, B=2, **fix**: Contrast group averages—*"Group 1 dropped 3.6 points from first to second; Group 2 dropped 2.4. Why the difference?"*  

  ### What the Activity *Cannot* Do  
  **It cannot isolate perceptual phenomenology.** Students infer from ratings, not first-person experience. You must later argue that *all* penetration evidence faces this—neuroimaging, reaction times, or verbal reports are still *mediated* by judgment. The activity exposes the evidential problem; it doesn’t solve it.  

  ---

  **Verdict**: Expectations shift reported enjoyment, not demonstrably experience.
