  We are designing a diagnostic quiz to sort students by their epistemic intuitions about how knowledge is acquired, without using technical vocabulary. The quiz will have nine case-based questions. The goal is to map answer patterns onto classical Indian positions about the number and nature of pramāṇas (means of knowledge).

  The candidate pramāṇas under dispute are:
  1. Perception (pratyakṣa)
  2. Inference (anumāna)
  3. Testimony/Word (śabda)
  4. Comparison (upamāna)
  5. Postulation (arthāpatti)
  6. Non-apprehension (anupalabdhi)

  Reduction moves:
  - Testimony may be reduced to inference (by arguing that we infer the speaker's knowledge and trustworthiness).
  - Non-apprehension may be reduced to perception (by arguing that we perceive the absence of the object) or to inference (by arguing that we infer the absence from the absence of perception when conditions are right).
  - Postulation may be reduced to inference (by arguing that it is a form of inference from a contradiction).
  - Comparison may be reduced to a combination of testimony, perception, and memory (e.g., we are told a similarity, then perceive the object, and remember the description).

  We also have the principle about how to count pramāṇas: by the kinds of objects (distinct objects require distinct pramāṇas), by the ways cognitions arise, or by parsimony.

  The questions must be concrete cases. We have specific required cases:

  1. Brief unrecognised seeing of an unfamiliar animal (perception without conceptualization).
  2. Smoke on a distant hill (inference).
  3. Stranger at a station giving platform info (mundane testimony).
  4. Vedic injunction (religious testimony, to test source-relativity).
  5. Being told by a forester what a word for a wild ox means, then later seeing an animal and recognizing it (comparison).
  6. A man alive and fat, never eats by day, never at home at night (postulation).
  7. Knowing a pot is absent from a bare, well-lit floor (non-apprehension).
  8. What changes when a trusted source deceives you (presumption of reliability vs. neutral starting point).
  9. How to settle the number of sources (by objects, by ways of arising, or by parsimony).

  We design the questions in an order that builds dependencies. For example, questions about reduction (like reducing testimony) should come after the cases that illustrate the candidate pramāṇas.

  Order of questions:

  We start with the most basic: perception (case 1). Then, we can move to inference (case 2). Then, testimony (case 3 and 4). Then comparison (case 5). Then postulation (case 6). Then non-apprehension (case 7). Then the question about the default status of a cognition (case 8). Finally, the meta-question about counting (case 9). This order allows us to build up the concepts without presupposing too much.

  However, note that the testimony cases (3 and 4) are split to check for source-relativity. We do the mundane testimony (stranger) first, then the Vedic one.

  Also, the postulation case (6) and non-apprehension (7) come after the more straightforward ones.

  The question about default status (8) might be placed earlier? But it might be better after the students have encountered several cases. Let's put it after the testimony cases because testimony is often a point of debate about default trust.

  Revised order:

  1. Unfamiliar animal (perception without conceptualization)
  2. Smoke on a hill (inference)
  3. Stranger at station (mundane testimony)
  4. Vedic injunction (religious testimony)
  5. Forester and wild ox (comparison)
  6. Fat man (postulation)
  7. Absent pot (non-apprehension)
  8. Source deception (default status)
  9. How to count sources (meta-question)

  We now write the questions.

  Question 1 (Unfamiliar animal):
  You are walking in a forest and see an animal you have never seen or heard of before. You see it clearly but only for a moment, and you have no idea what it is. Do you:
  A) Already know something about the animal (for instance, that it exists and has certain features you saw), even though you cannot name or classify it.
  B) Not know anything about the animal until you can classify it or relate it to what you already know.

  Question 2 (Smoke on the hill):
  You see smoke rising from a distant hill. You remember that wherever there is smoke, there is fire. Do you:
  A) Come to know there is fire on the hill solely based on seeing the smoke and remembering the connection.
  B) Come to know there is fire only if you also have additional reasons to believe that the connection between smoke and fire holds in this case (for instance, by ruling out other possible causes of smoke).

  Question 3 (Stranger at station):
  At a train station, a stranger tells you that your train leaves from platform 3. You have no way to check this information until the train arrives, and you have no particular reason to trust or distrust this person. Do you:
  A) Come to know that the train leaves from platform 3 based solely on the stranger's testimony.
  B) Not know the platform until you have independent confirmation (like an announcement or a schedule).

  Question 4 (Vedic injunction):
  You are told that performing a specific rite (which you have never performed) will lead to a specific result after death (which you cannot observe). The source of this claim is a Vedic text, which is considered authoritative in your tradition. Do you:
  A) Come to know that performing the rite leads to that result solely on the basis of the text.
  B) Not know that the rite leads to that result until you have independent evidence (such as reasoning or experience).

  Question 5 (Forester and wild ox):
  A forester tells you that a 'gavaya' is a wild ox that looks like a cow. Later, while in the forest, you see an animal that looks like a cow and recall the forester's words. Do you:
  A) Come to know that this animal is a gavaya solely by seeing it and recalling the description.
  B) Come to know that it is a gavaya only by comparing it with a cow (which you already know) and then applying the name.

