  | AAABAABAB             | Buddhist (e.g., Dignāga)          | 2: Perception (pratyakṣa), Inference (anumāna)                                                   | Resists reducing testimony to inference (Q3–4: B); holds sources match objects (Q9: A). |
  | AAAAAAABA             | Vaiśeṣika                         | 4: Perception, Inference, Testimony (śabda), Comparison (upamāna)                               | Resists reducing comparison to testimony/perception (Q5: B); reduces non-apprehension (Q7: A). |
