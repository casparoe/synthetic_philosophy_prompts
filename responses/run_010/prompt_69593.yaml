  ### Classical Indian Epistemology: Diagnostic Placement Instrument  
  **For First-Year Graduate Students with Analytic Backgrounds**  

  This handout presents a case-based diagnostic quiz to map your epistemic intuitions onto classical Indian debates about the sources of knowledge. The tradition identifies six candidate sources: *perception* (direct sensory or mental awareness), *inference* (reasoning from evidence), *testimony* (learning from words), *comparison* (recognizing similarity), *postulation* (presuming an explanation for incongruities), and *non-apprehension* (knowing absence through non-perception). Disputes arise when schools reduce one source to another—e.g., testimony to inference (arguing we infer a speaker’s reliability), non-apprehension to inference (arguing absence is inferred from failed perception), postulation to inference (treating it as reasoning from contradiction), or comparison to testimony/perception/memory (viewing it as recall of descriptions applied to new experiences). The number of sources may be determined by:  
  - **Distinct objects**: Each source corresponds to a unique kind of knowable thing (e.g., inference for universals, perception for particulars).  
  - **Distinct causal processes**: Each source reflects a unique way cognition arises.  
  - **Parsimony**: Sources are minimized by reduction where possible.  

  The quiz’s order is designed to scaffold intuitions:  
  - Questions 1–2 establish perception and inference as baseline sources (without these, later reductions are incoherent).  
  - Questions 3–4 test testimony, with mundane (Q3) and Vedic (Q4) cases separated to detect source-relativity.  
  - Question 5 (comparison) presupposes testimony (Q3–4), as comparison relies on prior linguistic input.  
  - Questions 6–7 (postulation, non-apprehension) build on perception/inference, as they involve complex reasoning or perception-like absence.  
  - Question 8 (default trust) probes testimony’s status after Q3–4 and informs reductions.  
  - Question 9 (counting) integrates all cases to reveal meta-principles.  

  **Answer based solely on your epistemic intuition—not prior knowledge of Indian philosophy.**  

  ---

  ### Quiz: Nine Cases on Knowledge Acquisition  
  **Instructions:** For each case, select the option that best captures your judgment about whether and how knowledge is acquired.  

  1. **Unfamiliar Animal**  
     You glimpse an animal in the forest, seeing it clearly but only for an instant. You have never encountered or heard of such a creature and cannot classify it (e.g., as a “deer” or “rodent”). Do you:  
     A. Already know something about it (e.g., “a brown, four-legged thing exists here”), even without classification.  
     B. Not know anything about it until you can classify or relate it to known categories.  

  2. **Smoke on a Distant Hill**  
     You observe smoke rising from a hilltop and recall that smoke is reliably caused by fire. Do you:  
     A. Come to know there is fire on the hill solely from seeing the smoke and recalling the connection.  
     B. Only know there is fire if you have additional reasons to trust this connection (e.g., ruling out alternatives like fog or dust).  

  3. **Stranger at the Station**  
     A stranger at a train station tells you, “Your train leaves from platform 3.” You have no way to verify this (e.g., no schedules or announcements) and no reason to trust or distrust them. Do you:  
     A. Come to know the train’s platform based solely on the stranger’s statement.  
     B. Not know the platform until you get independent confirmation (e.g., seeing the train).  

  4. **Vedic Rite**  
     A Vedic text (considered authoritative in your tradition) states that performing a specific ritual yields a benefit after death, which you cannot observe or verify. Do you:  
     A. Come to know the ritual’s efficacy solely from the text.  
     B. Not know the efficacy until you have independent evidence (e.g., reasoning or experience).  

  5. **Wild Ox Recognition**  
     A forester tells you, “A ‘gavaya’ is a wild ox resembling a cow.” Later, in the forest, you see an animal like a cow and recall the forester’s words. Do you:  
     A. Come to know this animal is a gavaya solely by seeing it and recalling the description.  
     B. Come to know it is a gavaya by comparing it to a cow and then applying the name.  

  6. **The Fat Man**  
     You know a man who is inexplicably fat despite never eating by day and never being home at night. Do you:  
     A. Come to know he eats at night by combining these facts (e.g., “he must eat secretly”).  
     B. Not know he eats at night until you get direct evidence (e.g., seeing him eat).  

  7. **Absent Pot**  
     You look directly at a bare, well-lit floor and see no pot. Do you:  
     A. Come to know there is no pot simply by seeing the floor and not seeing a pot.  
     B. Only know there is no pot with positive evidence (e.g., “if a pot were here, I’d see it; I don’t see it”).  

  8. **Trusted Source Deceives**  
     A news source you always trusted once deceived you. When it reports a new claim, do you:  
     A. Still accept it as knowledge unless you have a specific reason to doubt this claim.  
     B. No longer accept it as knowledge without independent confirmation for this claim.  

  9. **Counting Knowledge Sources**  
     When deciding how many distinct ways of gaining knowledge exist, which principle is most fundamental?  
     A. Count by distinct kinds of objects knowable (e.g., physical things vs. abstract relations).  
     B. Count by distinct ways cognitions arise (e.g., seeing, inferring, hearing words).  
     C. Minimize the count by reducing sources to others where possible.  

