prompt: |-
  In three weeks I am presenting a chapter of my doctoral thesis at my department's aesthetics research seminar, and I would like a preparation sheet for the question period rather than a defence of the view itself.

  The chapter attempts a revival of the evaluative half of Tolstoy's account of art. My argument runs as follows. I claim that *What Is Art?* contains two theses that are almost always run together and should be pulled apart: a criterion of arthood, on which something is art insofar as it deliberately transmits to others, by means of external signs, a feeling the maker has genuinely experienced; and a criterion of artistic value, on which works are ranked by the quality of the feelings transmitted and by the breadth of the human circle those feelings can unite. Tolstoy's notorious verdicts — his rejection of Shakespeare, of Wagner, of late Beethoven, and of most of his own earlier fiction — belong to the second thesis, and I argue that they are failures of application rather than entailments of the criterion, which is why I propose to keep the criterion and discard the verdicts. I further argue that infectiveness should be treated as graded and audience-relative rather than all-or-nothing, and I introduce what I call a reach condition: the wider the circle a work can infect without diluting the feeling, the higher its value, other things being equal. Finally, I claim that Tolstoy's four diagnostic marks of counterfeit art — borrowing, imitation, effectfulness, and diversion — do real work on cases that institutional and aesthetic-function theories handle badly: socially engaged and participatory practice, community arts, protest song, documentary, and design. My test case in the talk is a community choir in a post-industrial town, which I argue an institutionalist must treat as marginal to art while my account treats it as central.

  The audience shapes everything here. There will be roughly twenty people: the convenor, trained in the Danto and Dickie tradition, who considers arthood settled by a historically situated artworld; a senior colleague who works on Collingwood and insists on a sharp distinction between expressing an emotion and arousing one in an audience, and who will therefore regard Tolstoy as having conflated them; a philosopher of music with formalist sympathies who cares about absolute music; two or three doctoral students steeped in recent analytic work on the emotions in the arts; and a practising artist who teaches on our joint programme and resents any theory that makes art answerable to an external purpose. Nobody in the room is a Tolstoy specialist, and most will have met the book only through summaries that treat it as an ageing crank's repudiation of culture.

  Please prepare me as follows:

  - The eight to ten objections I will actually face from this particular room, ordered by how much damage each would do if left unanswered — not the objections a literary theorist or a historian of Russian thought would raise.
  - Each objection phrased in the vocabulary its raiser would use: the Collingwoodian will not put it the way the institutionalist does, and the artist will not put it the way either of them does.
  - For each, a reply I can deliver in about two minutes of discussion, a note on where that reply is softest, and an indication of whether it is better met by concession or by resistance.
  - What I should concede in my opening five minutes in order to pre-empt the first round altogether.
  - The single reply that has to land for the chapter to survive the afternoon.
  - The question I am hoping nobody asks: the one my argument cannot presently answer. I suspect it concerns whether the criterion is forced to rank a technically superb piece of propaganda above a slight but honest landscape, but tell me if there is a worse candidate in this room.
  - Where my characterisation of Tolstoy is itself vulnerable to the charge that I have produced a rational reconstruction rather than an interpretation, since at least two people present will want to know whether I am defending Tolstoy or merely myself.
reasoning: |-
  Okay, the user is preparing for their doctoral thesis chapter presentation in an aesthetics seminar. They're focusing on the Q&A period, not the defense itself. Let me unpack their request. They're reviving Tolstoy's evaluative account of art, separating the criteria for arthood and artistic value. Their main argument is that Tolstoy's notorious rejections of artists like Shakespeare are misapplications of his value criterion, not inherent flaws. They've also modified infectiveness to be graded and audience-relative, adding a "reach condition." The test case is a community choir that institutional theories marginalize but their account centralizes.

  The audience is specific: about twenty people with varied expertise—some institutionalists (Danto/Dickie), a Collingwood specialist, a formalist music philosopher, analytic emotion theorists, and a practicing artist. No Tolstoy experts here, and most know his work through dismissive summaries. The user needs targeted objections from this crowd, phrased in each questioner's likely terminology, with rebuttals, weaknesses, and whether to concede or resist. Also, they want preemptive concessions in their intro, the crucial reply, their weakest point, and vulnerability to rational reconstruction charges.

  First, identifying key objections from each audience member. The institutionalist will challenge the community choir as non-art under institutional definitions. The Collingwoodian will argue Tolstoy conflates expression with arousal. The formalist will question absolute music's place without feelings. The emotion theorists might critique the graded infectiveness model. The artist will resist external purposes for art. The convenor (Danto/Dickie) might see Tolstoy's criteria as outdated. The doctoral students could question the diagnostic marks of counterfeit art. The senior colleague might doubt Tolstoy's separation of criteria.

  For the institutionalist's objection, the reply should contrast institutional marginalization with Tolstoy's inclusivity, using the choir example. Weakness: institutionalists might argue artworld recognition is essential. Concession isn't advisable here—resist to maintain the theory's distinctiveness.

  Collingwoodian objection: They'll claim Tolstoy confuses expression and arousal. Reply by clarifying that Tolstoy sees transmission as integral to expression. Weakness: Collingwood's distinction is foundational. Concede that Tolstoy differs but argue transmission is key to his expressive theory. Resist conflation charge.

  Formalist objection: Absolute music lacks feelings, so Tolstoy's account fails. Reply with Hanslick's view but argue music transmits non-representational feelings. Weakness: Formalists might reject any extra-musical content. Concede that Tolstoy undervalued formalism but resist exclusion of absolute music.

  Emotion theorists: Graded infectiveness might not align with appraisal theories. Reply by integrating appraisal into the reception process. Weakness: Appraisal theories are complex; might need more nuance. Concede possible integration but resist reduction.

  Artist's objection: External purpose undermines autonomy. Reply by redefining purpose as internal to artistic practice. Weakness: Might not satisfy artists valuing autonomy. Concede Tolstoy's moralism but resist instrumentalization charge.

  Convenor's objection: Tolstoy's criteria ignore historical context. Reply with the reach condition as context-sensitive. Weakness: Artworld's role in defining context. Resist to maintain theory's independence.

  Doctoral students on counterfeit art: Question applicability to modern art. Reply with examples like protest art. Weakness: Subjectivity in applying marks. Concede flexibility needed.

  Senior colleague: Doubt separation of criteria. Reply with textual evidence showing Tolstoy distinguishes them. Weakness: Possible conflation in practice. Resist separation charge.

  Preemptive concessions: Admit Tolstoy's verdicts are flawed and that institutional theories explain prestige art better. This disarms critics early.

  Crucial reply: The community choir example must land. Show how institutional theory marginalizes it while Tolstoy's account centralizes it, highlighting inclusivity.

  Worst unanswerable question: Propaganda vs. landscape. Current framework might prioritize propaganda's reach. Need to acknowledge this tension and suggest refining value criteria.

  Rational reconstruction charge: Acknowledge interpretive choices but cite textual support. Emphasize philosophical engagement over exegesis.

  Need to ensure objections are specific to this audience, using their jargon. Avoid literary or historical angles. Focus on philosophical and practical critiques. Ensure replies are concise, about two minutes each. Highlight where concessions can soften opposition without undermining the core argument.
answer: |-
  Here is your preparation sheet, tailored precisely to your audience and strategic needs. I've distilled eight core objections ordered by potential damage, phrased in each questioner's likely idiom, with rebuttals, soft spots, and concession/resistance guidance—followed by your opening concessions, the key reply, your weakest point, and the rational reconstruction vulnerability.

  ---

  ### **Top 8 Objections (Ordered by Damage Potential)**
  1. **The Institutionalist (Convenor/Danto-Dickie tradition)**  
     *Objection:* "Your community choir may be socially valuable, but calling it *central* to art ignores that 'arthood' is historically conferred by an artworld. Tolstoy’s transmission criterion is prescriptive, not descriptive—it doesn’t engage with actual art practices, just imposes an outsider’s moralism."  
     *Reply (1.5–2 min):* "Tolstoy’s criterion isn’t meant to *describe* institutional practices but to *evaluate* what art *ought* to do. The choir isn’t ‘marginal’ because it lacks gallery validation; it’s central because it achieves art’s core function: uniting people through shared feeling. Institutional theories struggle with participatory art precisely because they prioritize elite validation over community impact."  
     *Soft Spot:* Risks conflating *descriptive* and *normative* claims.  
     *Tactic:* **Resist.** Emphasize that institutionalism’s "descriptive" label is itself normative (e.g., it excludes non-Western practices).

  2. **The Collingwoodian (Senior Colleague)**  
     *Objection:* "Tolstoy collapses expression and arousal. Transmitting a feeling *to* an audience isn’t expression—it’s craft. Collingwood shows expression is the artist’s self-clarification; arousal is mere psychological manipulation, irrelevant to art’s essence."  
     *Reply (1.5 min):* "Tolstoy *does* require genuine feeling in the maker—this is his ‘expression’ moment. But for him, art’s social purpose necessitates transmission. Unlike manipulation, infection requires sincerity: if the feeling isn’t authentically expressed, it can’t be ‘infected’. The choir leader’s expression *depends* on communal transmission."  
     *Soft Spot:* Collingwood’s distinction is cleaner. Tolstoy *does* blur the lines.  
     *Tactic:* **Concede** Tolstoy prioritizes social utility over solitary expression, but **resist** that this reduces to "manipulation."

  3. **The Formalist (Music Philosopher)**  
     *Objection:* "Your graded infectiveness can’t save Tolstoy from dismissing absolute music. If Beethoven’s late quartets transmit no ‘feeling’ beyond their formal structure—as Tolstoy claims—your account still excludes them. But their artistic value is self-evident."  
     *Reply (2 min):* "Tolstoy’s *verdict* was wrong, but not his *criterion*. The quartets *do* transmit feeling—awe at complexity, joy in pattern—even if non-representational. My ‘graded infectiveness’ allows for this: a specialist audience might be deeply ‘infected’ by their emotional intensity, fulfilling the reach condition through niche transmission."  
     *Soft Spot:* Formalists may deny that "awe at patterns" counts as a *feeling transmitted*.  
     *Tactic:* **Resist.** Insist musical form *can* carry affective weight (cite Hanslick’s "tonally moving forms").

  4. **The Artist-Practitioner**  
     *Objection:* "You say art must ‘unite people through feeling’—but that reduces art to a social tool. My art’s value isn’t in its utility; it’s in the work itself. Tolstoy’s demand for external purpose kills autonomy."  
     *Reply (1.5 min):* "Tolstoy’s ‘uniting’ isn’t instrumental; it’s constitutive. The *value* of the feeling transmitted (e.g., honesty, empathy) is internal to the work’s success. Your autonomy isn’t threatened unless you equate freedom with indifference to reception. The community choir’s value *is* in the work—as a shared experience."  
     *Soft Spot:* Artists may reject any "purpose" beyond the work.  
     *Tactic:* **Concede** Tolstoy’s moralism is excessive but **resist** that infectiveness is "external."

  5. **Emotion Theorists (Doctoral Students)**  
     *Objection:* "Graded infectiveness feels ad hoc. If infectiveness is audience-relative, doesn’t that confuse *artistic value* with contingent reception? Appraisal theories (e.g., Robinson) show emotions are elicited by cognitive evaluations, not ‘transmission’."  
     *Reply (2 min):* "Audience-relativity *acknowledges* that reception depends on cognitive/social context—but the *capacity* to infect widely (my ‘reach condition’) is objective. Tolstoy’s ‘transmission’ includes the work’s ability to trigger appraisals (e.g., protest songs frame injustice to elicit outrage)."  
     *Soft Spot:* Grading "infectiveness" risks circularity (valuable art = art that infects).  
     *Tactic:* **Concede** reception is complex but **resist** reducing value to maker-side factors.

  6. **Institutionalist Again (Convenor)**  
     *Objection:* "Even if your account handles community art, it fails *descriptively*. Danto’s ‘artworld’ explains why Warhol’s Brillo Boxes are art but store boxes aren’t. Tolstoy’s criterion can’t make that distinction."  
     *Reply (1.5 min):* "Tolstoy isn’t trying to! He’d call Warhol ‘counterfeit’ for borrowing commercial imagery (one of his diagnostic marks). My point isn’t that Tolstoy *replaces* institutionalism, but that his *evaluative* criterion better captures why community art matters. The Brillo Boxes’ institutional status doesn’t make them *better* at uniting people than the choir."  
     *Soft Spot:* Tolstoy *would* exclude much contemporary art.  
     *Tactic:* **Concede** descriptively but **resist** evaluatively. Shift to "which theory handles *value* better?"

  7. **Collingwoodian Again (Senior Colleague)**  
     *Objection:* "Your ‘diagnostic marks’ (borrowing, imitation) assume Tolstoy’s conflation of art and craft. If expression is self-clarification, borrowing is irrelevant. A pastiche *can* express genuine feeling."  
     *Reply (1 min):* "Tolstoy’s marks target *bad faith* borrowing—using others’ forms *without* authentic feeling (e.g., academic art). In participatory art, ‘borrowing’ folk songs can be sincere if the feeling is re-lived. The test is whether transmission is genuine, not whether forms are original."  
     *Soft Spot:* "Genuine" is vague; Collingwood’s "self-clarification" is stricter.  
     *Tactic:* **Resist.** Stress that sincerity ≠ originality.

  8. **Generalist Critic (Overlap of Multiple)**  
     *Objection:* "Isn’t this just ‘good art = morally good art’? If a homophobic demagogue transmits sincere outrage to millions (high reach!), do you rank it above a modest queer poem that unites a small community?"  
     *Reply (2 min):* "No—Tolstoy ranks feelings *by quality* (depth, universality). Rage targeting a minority is low-quality: it *divides* humanity. The poem’s feeling (e.g., resilience) unites across difference. Reach alone isn’t sufficient; the feeling must be ‘good’."  
     *Soft Spot:* "Quality of feeling" is undertheorized in your account.  
     *Tactic:* **Concede** Tolstoy’s moralism needs refinement but **resist** equating reach with value.

  ---

  ### **Preemptive Concessions (Opening 5 Minutes)**  
  Start with:  
  > *"I concede three things upfront: (1) Tolstoy’s *verdicts* (e.g., against Beethoven) are indefensible—they’re failures of application, not logic. (2) Institutional theories *do* explain ‘arthood’ for prestige art better than Tolstoy. (3) His conflation of *expression* and *transmission* is real—but I argue it’s a feature, not a bug, for evaluative purposes. My aim isn’t to defend Tolstoy wholesale, but to salvage his insight that art’s value lies in *shared human connection*."*  
  **Why this works:** Disarms verdict-based attacks, acknowledges institutional strengths, and flags the Collingwoodian tension—letting you pivot to your positive case.

  ---

  ### **The Reply That Must Land**  
  **The community choir example.** When challenged by the institutionalist, respond:  
  > *"For institutional theories, this choir is peripheral—it lacks gallery/museum recognition. But if art’s highest purpose is to unite people through shared feeling, the choir is *central*. It transmits joy, solidarity, and resilience across a divided town. Tolstoy’s ‘reach condition’ captures this: it infects non-specialists *without* diluting its emotional power. Relegating this to ‘social practice’ marginalizes art’s democratizing potential."*  
  **Why it’s critical:** If this fails, your revival seems irrelevant to contemporary art discourse.

  ---

  ### **The Question You Hope Nobody Asks**  
  **The Propaganda vs. Landscape Problem (Your Suspected Weakness)**  
  *Objection:* "If a fascist film (sincere feeling, technically masterful, infects millions) transmits ‘high-quality’ feeling for its audience (patriotic unity), and a modest landscape painting infects only a few with calm, doesn’t your criterion force you to rank the propaganda higher?"  
  *Why it’s devastating:* Exposes ambiguities in "quality of feeling" and risks moral horror.  
  *Your current vulnerability:* You lack a clear, non-circular standard for "quality." Tolstoy appeals to "Christian love," but you’ve jettisoned his metaphysics.  
  *Damage control:*  
  - **Short-term:** "Tolstoy defines ‘good’ feelings by their *universal* uniting power—the film *excludes* minorities, so its feeling is low-quality. The landscape’s calm *can* unite anyone."  
  - **Long-term:** You need to ground "quality" in intersubjective human flourishing (e.g., Nussbaum) without Tolstoy’s dogma.

  ---

  ### **Vulnerability: Rational Reconstruction Charge**  
  *Likely Objection (from Institutionalist or Collingwoodian):* "You claim Tolstoy *separates* arthood and artistic value, but in *What Is Art?* he calls non-infective works ‘counterfeit art’—not ‘bad art.’ Isn’t this your rational reconstruction, not his actual view?"  
  *Your Soft Spot:* Tolstoy *does* blur the line (e.g., Chapter 5: "If it does not infect, it is not art").  
  *Reply Strategy:*  
  1. **Concede the ambiguity:** "You’re right—Tolstoy isn’t always consistent. But his *diagnostic marks* (borrowing, etc.) target works that *fail at transmission*, implying arthood requires *some* infectiveness. Meanwhile, his *rankings* (Shakespeare vs. folk tales) clearly separate ‘is art’ from ‘is great art’."  
  2. **Reframe constructively:** "My aim isn’t exegesis but philosophical salvage. Even if Tolstoy conflates them, disentangling the criteria strengthens his core insight."  
  3. **Cite textual evidence:** Note his distinction between "universal" art (good) and "exclusive" art (still art, but bad) in Chapter 16.  

  **Tactic:** **Concede** textual imperfections but **resist** that this undermines your philosophical project.  

  ---

  ### **Summary Checklist for Delivery**
  - **Preempt** with your 3 concessions upfront.  
  - **Anchor** replies to the **community choir** when possible.  
  - **Pivot** from "Is this Tolstoy?" to "Is this *useful*?" when pressed on exegesis.  
  - **Flag** where you **concede** (e.g., "Tolstoy is flawed here, but...") to build credibility.  
  - **Protect** your core: Infectiveness + reach condition = art’s unifying power.  

  This room will test your account’s applicability, not its fidelity to Tolstoy. Stay grounded in cases (choir, protest art), and you’ll force engagement on your terms. Good luck!
