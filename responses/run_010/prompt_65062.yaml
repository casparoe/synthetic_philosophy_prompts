prompt: |-
  I edit a series of 700-word biographical readings used by secondary-school humanities teachers. We take about six proposals a month, and each receives one decision from a three-person review panel: run as pitched, run with a specified reframing, or reject. The writers are journalists who get roughly two hours among a subject's sources before drafting, so the procedure has to be runnable in that time and has to yield reasons the panel can check rather than tastes it can only vote on.

  The series exists for moral learning from a life rather than for biography as such, and that is where we keep failing. A reading on a celebrated nurse was withdrawn after a teacher pointed out that the incident the whole piece turned on survives only in an admiring life published by her own order. Our house guidance — admire the deed rather than the person, note the flaws briefly, let the reader draw the moral — collapses on the hard cases. Hagiography and Plutarch's practice are both ways of making a life teach: he remarks at the opening of the Life of Alexander that he is writing lives rather than histories, and he reads character off slight acts instead of great ones, then closes most of his pairs with a formal comparison. Neither approach is the same as reporting what happened, and I want the procedure to be explicit about what each can support.

  Please write that procedure: the questions to ask in order, what counts as a sufficient answer to each, where it terminates in a reject, and where it hands the decision back to the panel because the question is one of value rather than fact. It must separate the different uses a life can be put to — evidence for a claim about a trait, object of admiration, template for imitation — and attach the appropriate evidential standard to each; it must handle sources that are admiring or hostile by construction, including cases where the only surviving account is hagiographic, and say what such an account is legitimately evidence of; it must handle subjects whose finest feature and their worst wrong spring from the same disposition; and it must flag every step that is a judgment call wearing a procedural costume.

  Then run it on three proposals: a nineteenth-century factory reformer whose campaign rested on a paternalism he also enforced against his own workers' organizing; a medieval saint known only through a vita of miracles and an edifying death; and a twentieth-century geneticist whose science is sound and who campaigned successfully for compulsory sterilization. The third is the panel's favourite — tell me plainly if the procedure kills it.
reasoning: |-
  Okay, I need to understand the user's problem deeply. They edit biographical readings for secondary schools, aiming for moral learning, but they've faced issues like hagiography and unreliable sources. The current guidance isn't holding up for hard cases. 

  The user wants a new procedure that's explicit about how to use lives for teaching, separates different purposes like admiration or evidence of traits, handles biased sources, and flags judgment calls. Then, they want it tested on three proposals. 

  First, I'll recall core challenges: avoiding uncritical admiration, dealing with single-source accounts, and subjects with moral complexities. The procedure must be factual and checkable within a journalist's two-hour research limit. 

  For the procedure structure, I'll consider how Plutarch approached lives—focusing on character through small acts, not just big events. The user mentioned that, so I should incorporate similar distinctions. 

  Key elements to cover: 
  - Separating evidential standards for different uses (e.g., evidence of a trait vs. template for imitation). 
  - Handling admiring/hostile sources: what they can reliably show. 
  - Addressing subjects where good and bad stem from the same root. 
  - Explicitly noting where judgments are disguised as procedure. 

  I'll outline a step-by-step process with clear questions, sufficiency criteria, and termination points. For sufficiency, I'll define what counts as enough evidence—like multiple sources for actions, but character insights can come from reliable anecdotes. 

  Now, for the three test cases: 
  1. The factory reformer with paternalism: I need to assess if the paternalism is central and how it affects moral lessons. The procedure might require reframing to discuss this tension. 
  2. The medieval saint with only a vita: Here, the source is inherently biased. The procedure should restrict claims to what the vita can support, like cultural values, not historical facts. 
  3. The geneticist with compulsory sterilization: This is contentious. I must analyze if the science and campaign are separable. If not, the procedure should likely reject it due to inseparable harm, as per Step 5. 

  For the geneticist, I'll be honest—it probably kills the proposal because the harm is direct and severe, making admiration unsafe. The user needs that clarity. 

  Throughout, I'll flag judgment points, like determining if a flaw is "inseparable" in Step 5. That's procedural but relies on human assessment. 

  Finally, ensuring the procedure ties back to moral learning without preaching, letting readers draw conclusions from well-vetted facts.
answer: |-
  Here's a procedural framework designed for your 2-hour research window, separating evidential standards for different "uses" of a life, handling bias, complexity, and exposing judgment calls. It prioritizes what *can* be reliably known/supported over what makes a "good story."

  **The Biographical Reading Evaluation Procedure: "Life as Lens" Framework**

  **Core Principle:** The reading must enable *moral learning from the subject's life*, not *moral instruction by the subject*. The focus is on how the life illustrates human choices, consequences, virtues, vices, and contexts, allowing the reader to draw insights. The subject is the *specimen*, not the *sage*.

  **Questions & Procedure:**

  1.  **Define the Proposed Central Moral Lens:**
      *   *Question:* What specific human quality, dilemma, choice, consequence, or aspect of character (e.g., "the cost of unwavering conviction," "the tension between compassion and control," "how bias can distort even brilliant minds," "resilience in adversity") is this reading primarily using the subject's life to explore?
      *   *Sufficiency:* A clear, concise, non-hagiographic statement focusing on a *human* element, not just achievement. Must be explicitly stated by the proposer/writer.
      *   *Termination:* If no clear lens is proposed, or if the lens is solely "admiration for greatness/achievement," **REJECT** (Fails core mandate). If vague, return for refinement.
      *   *Judgment Call Flag:* Defining the "lens" inherently shapes the narrative. Is the chosen lens the *most* illuminating, or just the most flattering/convenient?

  2.  **Identify Key Evidence Supporting the Lens:**
      *   *Question:* What specific, documented actions, decisions, writings, or contemporaneous reports (not later interpretations) *directly* illustrate the proposed central moral lens? List chronologically.
      *   *Sufficiency:* At least **two independent, primary sources** (letters, diaries, official records, direct eyewitness accounts from distinct perspectives, subject's own verified writings) for *each* key action/decision central to the lens. If only one source exists, it must be critically assessed in Step 3.
      *   *Termination:* If no key evidence meeting the standard exists for the proposed lens, **REJECT** (Lens unsupported). If evidence exists only for tangential aspects, return for lens refinement or **REJECT**.
      *   *Judgment Call Flag:* Deciding what constitutes a "key" action/decision central to the lens. Determining "independence" of sources (e.g., are two newspapers just reprinting the same wire report?).

  3.  **Assess Source Reliability & Bias for Key Evidence:**
      *   *Question:* For each key piece of evidence (especially if relying on fewer than two independent sources), what is the provenance, potential bias (pro-subject/admiring, anti-subject/hostile, institutional, self-serving), and corroboration level of the source(s)?
      *   *Sufficiency (Admiring/Hostile Sources):*
          *   *Admiring (e.g., vita, eulogy, PR):* Can reliably demonstrate: **What the subject or their admirers *wanted* to be true/emulated; the values *they* prized; the image cultivated.** Cannot reliably support: **Specific factual claims (esp. miraculous/extraordinary), unalloyed virtue, absence of flaws, motivations.** Requires extreme caution for factual claims; prioritize where it aligns with neutral evidence.
          *   *Hostile:* Can reliably demonstrate: **Criticisms circulating, opposition faced, potential flaws/controversies acknowledged by contemporaries.** Cannot reliably support: **Malicious rumors without corroboration, claims of pure evil/bad faith without evidence.** Requires corroboration for factual claims.
          *   *Single Surviving Account (esp. Hagiographic):* **Only** supports: **The existence of the *story/legend* itself and the values it promoted in its time/context.** It is **NOT** sufficient evidence for the *factual occurrence* of the events described as historical reality within the moral lens, unless corroborated by archaeology or overwhelming contextual evidence. A reading relying solely on this must explicitly frame the lens around "The Legend of X and what it tells us about..." or "How X was remembered and why..." **not** "How X demonstrated virtue through..."
      *   *Termination:* If the *only* evidence for the core lens element(s) is a source deemed unreliable *for that specific claim* (e.g., a miracle in a vita as proof of virtue; a rumor in a hostile pamphlet as proof of depravity), and no reframing is possible (Step 6), **REJECT** (Evidence insufficient/tainted).
      *   *Judgment Call Flag:* Interpreting the *degree* of bias and its specific impact on a given claim. Deciding if contextual/corroborative evidence is sufficient to "rescue" a claim from a biased source.

  4.  **Identify Major Flaws/Wrongs & Their Connection:**
      *   *Question:* What significant flaws, harmful actions, or wrongs (by modern or relevant contemporary ethical standards) are credibly documented? Is there evidence linking the disposition/impulse underlying the *admired traits/actions* (Step 1 Lens) to these *flaws/wrongs*?
      *   *Sufficiency:* Acknowledgement based on credible evidence (Step 2-3 standard). Connection need not be proven definitively, but plausible links based on subject's patterns, testimony, or historical context must be presented if they exist. *Brief* does not mean *absent* or *glossed over*; it means *integrated concisely into the narrative relevant to the lens*.
      *   *Termination:* If major, relevant flaws/wrongs are *credibly documented* but the writer/proposal *omits or actively whitewashes* them without justification in source limitations, **REJECT** (Unbalanced/Uncritical). Proceed to Step 5.
      *   *Judgment Call Flag:* Defining "significant" flaw/wrong in context. Assessing the plausibility of the connection between virtue and vice. Avoiding false equivalence while acknowledging complexity.

  5.  **Assess Inseparability of Harm & Lens:**
      *   *Question:* For the proposed lens (Step 1), is the documented harm/wrong (Step 4) **inextricably linked** to the very disposition or trait being explored? (e.g., Was the paternalism *essential* to the reformer's method? Was the scientist's eugenics drive *fueled* by the same mindset as their sound genetics?).
      *   *Sufficiency:* Analysis of whether the harm was a direct consequence, a core component, or a manifestation of the same trait central to the lens. Requires historical/logical argument, not just assertion.
      *   *Termination/Handoff:* If the harm is deemed **inextricable** from the lens trait *and* the harm is severe (e.g., advocating mass sterilization, violent repression), then **REJECT** (Admiration/emulation unsafe, moral lens contaminated). *This is a value judgment on potential harm.* If the panel believes the lens *can* be explored safely despite the link (e.g., explicitly framing it as a cautionary tale about that trait), they may override to "Run with Reframing." If the harm is **separable** (e.g., a great scientist who was also a petty thief; a reformer with unrelated marital infidelity), proceed to Step 6.
      *   *Judgment Call Flag (Major):* This is **THE** core value judgment disguised as procedure. Determining "inextricable link" and "severity of harm" are inherently ethical decisions about risk and pedagogical suitability. The procedure forces explicit confrontation but requires panel input.

  6.  **Reframing Check & Final Decision:**
      *   *Question:* Based on Steps 1-5, can the reading be structured to:
          *   Accurately reflect the reliable evidence (Step 2-3)?
          *   Integrate flaws/complexity relevant to the lens (Step 4)?
          *   Avoid presenting the subject as simply admirable if harm is inextricable (Step 5)?
          *   Maintain focus on enabling moral learning *from* the life, not *through* the subject?
      *   *Sufficiency/Handoff:* If the original pitch fails Step 5 or inadequately addresses Steps 3-4, propose a **Reframing** (e.g., "Explore the tension between compassion and control in Reformer X's life," "Examine how Saint Y's legend reflects medieval values," "Analyze the tragic disconnect between Geneticist Z's scientific rigor and his ethical blindness"). If the pitch survives Step 5 and adequately addresses Steps 1-4, **Run as Pitched**. If reframing is impossible or still unsafe/unreliable, **REJECT**.
      *   *Judgment Call Flag:* Designing an effective, truthful reframe requires editorial skill and ethical sensitivity.

  ---

  **Application to Proposals:**

  1.  **19th-Century Factory Reformer (Paternalism vs. Organizing):**
      *   **Step 1 (Lens):** Likely "Effectiveness of reform through paternalistic authority" or "Tension between benevolence and control."
      *   **Step 2 (Evidence):** Reform successes (govt. reports, newspapers) & suppression of unions (union records, worker testimonies, court docs?) should be findable. **Sufficient.**
      *   **Step 3 (Bias):** Admiring sources (business press) vs. hostile (union papers). Cross-check key facts. **Handled.**
      *   **Step 4 (Flaws):** Suppressing worker agency is a major flaw. **Plausible link:** Paternalism ("I know what's best") motivated both reform *and* suppression. **Must be included.**
      *   **Step 5 (Inseparability):** **Highly Likely Inextricable.** His reform method *was* paternalistic control; suppressing unions was the *same impulse* applied defensively. Harm (denying worker rights) is significant.
      *   **Step 6 (Reframe):** **REJECT** if pitched as "Admirable Reformer." **Run with Reframing:** Focus lens explicitly on "The Paradox of Paternalism: How Reformer X's desire to help workers led him to deny their autonomy." Frame moral learning around this tension, not emulation.

  2.  **Medieval Saint (Miracles/Edifying Death Vita):**
      *   **Step 1 (Lens):** Original pitch likely "Virtue/piety demonstrated through miracles."
      *   **Step 2 (Evidence):** Only source is the hagiographic vita. **Insufficient** for factual claims about miracles/deeds.
      *   **Step 3 (Bias):** Vita is **purely admiring/hagiographic** by design.
      *   **Step 4 (Flaws):** Vita likely omits flaws. No reliable evidence exists.
      *   **Step 5 (Inseparability):** N/A (Lens unsupported factually).
      *   **Step 6 (Reframe):** **REJECT** original pitch. **Run with Reframing (if panel approves):** "The Making of a Saint: What the Vita of X Tells Us About Medieval Piety and Ideals." Focus lens on the *values and purposes* of hagiography itself. What did his contemporaries admire *through this story*? **Cannot** present miracles as historical facts demonstrating virtue.

  3.  **20th-Century Geneticist (Sound Science, Compulsory Sterilization Advocacy):**
      *   **Step 1 (Lens):** Likely "Brilliant scientific discovery" or "Impact of genetics on society."
      *   **Step 2 (Evidence):** Sound science (journals, peer acceptance) & active, successful eugenics campaigning (speeches, writings, legislation, org. membership) are well-documented. **Sufficient.**
      *   **Step 3 (Bias):** Scientific work subject to peer review (reliable). Eugenic writings often reveal own bias (reliable for *his* views). **Handled.**
      *   **Step 4 (Flaws):** Advocacy for coerced sterilization is a major, harmful wrong. **Plausible Link:** His scientific expertise lent credibility to his eugenics arguments; both stemmed from belief in applying biological principles to "improve" humanity. **Must be included.**
      *   **Step 5 (Inseparability):** **CRITICAL JUDGMENT.**
          *   **Argument for Inextricable:** His scientific authority was *the weapon* used to inflict harm. The mindset ("objective biological management of populations") fueled both sound lab work *and* destructive social policy. Harm (state coercion, violation of bodily autonomy, targeting vulnerable groups) is severe and foundational to his activism.
          *   **Argument for Separable:** Science (lab work) vs. Activism (policy) - different domains. The *science itself* remains sound regardless of his personal views.
      *   **Procedure Outcome & Panel Decision:**
          *   The procedure **forces a stark choice at Step 5.** The *harm* (coerced sterilization) is severe. The *link* between his scientific mindset/authority and the harm is strong and demonstrable through his *own* writings linking them.
          *   **Therefore, the PROCEDURE TERMINATES AT STEP 5 WITH A "REJECT" RECOMMENDATION.** Presenting him primarily through a lens of scientific admiration risks laundering his harmful legacy and implying the soundness of his science validates his ethics (a dangerous moral takeaway). A lens focusing *only* on the science ignores his defining harmful action.
          *   **Panel Override Option:** The panel could argue for a **Reframing** (Step 6) so explicit and critical it mitigates the risk: e.g., "The Blind Spot of Genius: How Geneticist Z's Scientific Brilliance Fueled His Harmful Eugenics Campaign." This makes the *harm and the link* the central moral lens (a cautionary tale about scientific hubris and ethics). **This is high-risk.** Can it be done without creating inadvertent admiration for the "brilliance" that enabled the harm? Will it be age-appropriate and truly serve moral learning about ethics in science? **The procedure flags this as a profound value judgment the panel must own.** The default procedural outcome is **REJECT**.

  **Plain Answer on the Geneticist:** **Yes, the procedure kills the panel's favorite as pitched.** The geneticist presents a classic Step 5 Inextricable Harm case. To run it requires the panel to consciously **override** the procedure's rejection recommendation and mandate a specific, critical reframing that makes the harm and its link to his science the explicit central focus, accepting the pedagogical risks involved. The procedure forces this ethical burden onto the panel by explicitly flagging the severe, inextricable harm.
