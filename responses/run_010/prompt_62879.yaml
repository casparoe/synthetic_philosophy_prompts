  - Move 5 did most damage by exposing Idris's category error about figurative language.
  - The unaddressed core issue: Orwell's concern is fundamentally political - how language obscures power dynamics. Both debaters slightly miss this by focusing on individual vs institutional blame.

  For the user's novel: Writing a permanent secretary in bureaucratic idiom isn't inherently confession or defense - it depends on whether the narrative exposes the evasion (defense) or merely replicates it (confession). The key is conscious deployment.

