  Move 3: Helen lands solidly here. She refines her test to focus on the ability to paraphrase plainly, which directly addresses Orwell's call for taking "necessary trouble" with language. This isn't about aesthetics but about substantive clarity.

  Move 4: Idris fails. His attack on the paraphrase test misses Helen's distinction between dead metaphors and fresh imagery. Orwell's own vivid analogies serve clear purposes and could survive paraphrase explanation, unlike the bureaucratic sludge Helen critiques.

  Move 5: Helen lands decisively. She clarifies Orwell targets dead language, not figurative writing, and notes his rules are meant to be broken when necessary. This counters Idris's misrepresentation while strengthening her diagnostic.

  Move 6: Idris half-lands. He correctly notes the rules' defeasibility weakens them as moral tests, but wrongly claims this destroys Helen's practical diagnostic. Her move 7 will show it remains useful as a burden-shifting tool.

  Move 7: Helen lands. She concedes the test isn't absolute but argues it creates accountability for stylistic choices. This is consistent with Orwell's practical aims.

  Now for the additional analysis:
