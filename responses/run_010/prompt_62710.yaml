prompt: |-
  I've been reading the communitarian-vs-liberal debates for a couple years now, mostly becuase of work — I do policy stuff around communal land tenure — and there's a pattern I keep running into that I can't find a word for. I've started to suspect there isn't one. Here's the pattern. A liberal says the state isn't in the business of promoting any particular way of life; it just sets up a neutral framework — individual title, contracts, courts, school to sixteen, one official language for public business — and inside that framework communities can live however they like, so long as members are free to leave. That sounds fine, because no belief is being suppressed and nobody is told what to think. But the framework isn't neutral in the way advertised, because it doesn't merely tolerate ways of life, it requires them to have a particular shape in order to be usable by it at all. To hold land under the neutral title system you have to be able to name individual owners, which a community that holds land in common and re-allots it by kinship can't do without becoming a different kind of community. To be a party to a contract you need members who are legally individuated and can be sued. For exit to be real the state has to make sure leavers have credentials and market capacities, which means years of exactly the schooling the community's apprenticeship system exists to replace. To be heard in court you need the official language. In every one of those cases the demand isn't "stop believing X." It's "be capable of doing what a liberal individual does, even if you never actually do it" — and the community is free to refuse, and free to disappear.

  The part I think makes this different from the usual complaint is that it survives every concession the liberal is willing to make. Grant that the framework is neutral in its justification, with no appeal to any conception of the good anywhere in it. Grant that the effects are unequal but unintended. Grant that consent is real and exit is genuinely available. The requirement about internal form is still sitting there, and it's still there because a framework that has to be operable by individuals one at a time imposes an individual-shaped structure on anything that wants to operate within it, whatever its designers intended or believed. So it isn't just the neutrality-of-justification vs neutrality-of-effect point, since I'm not complaining about unequal outcomes, I'm complaining about a standing requirement on organizational form that never appears in anyone's statement of the framework. And it isn't quite Sandel or MacIntyre's line that liberalism is a comprehensive doctrine wearing a procedural costume, because I don't think you need any particular view of the person or the good to notice it — you just need the machinery to work. And it isn't paternalism, since nobody's welfare is being consulted at any point, and it isn't oppression by a majority either, because the same demand would show up in a framework designed by saints.

  So — does this have a name? I've come across "the myth of liberal neutrality," liberalism-as-perfectionism, the accommodation cases about facially neutral rules that fall much harder on some groups, Shachar's paradox of multicultural vulnerability, Kymlicka on exit and internal restrictions, and all of them circle it and none of them is it. If one of those actually is it, tell me which and where I'm misreading them. If nothing fits, coin something: a definition with the boundaries drawn, plus how you'd tell it apart from (a) plain majority domination dressed up as procedure, (b) a framework that's neutral in principle but merely unequal in effect, and (c) the banal point that every institution carries a culture. And please don't just hand me a label, I want the carving. What counts as a case and what doesn't? For instance: does a rule that public contracts must be in writing count, given that an oral-economy community can just decline and take the loss — at what point does "you may opt out at a cost" turn into "you must reorganize"? Does the phenomenon need the framework to be justified in neutral terms, or would it also apply to an openly perfectionist state that happens to require the same forms? Is it about the state specifically, or would a professional licensing body or a bank's know-your-customer rules be instances too? Where does the thing stop?
reasoning: |-
  Okay, the user is deep into political theory, specifically the communitarian-liberal debate, and has encountered a recurring pattern they can't name. They work in policy around communal land tenure, so this is both academic and practical for them. The core issue is that liberal frameworks, while claiming neutrality, impose structural requirements that force communities to adopt individualistic forms to participate, even if they don't actively suppress beliefs. 

  Hmm, they've already ruled out common critiques like "myth of liberal neutrality," perfectionism, unequal effects, or comprehensive doctrines. They want something more precise—a concept that survives even if you grant liberals all their concessions (neutral justification, unintended effects, real consent/exit). The key is the *unavoidable organizational demand*: communities must be *structurally compatible* with individualism, regardless of intent.

  The user is clearly sophisticated—they cite Sandel, MacIntyre, Shachar, Kymlicka—but feels existing terms miss the mark. Their frustration is palpable: "none of them is it." They need a scalpel, not a hammer. And they want boundaries: how this differs from majority domination, mere unequal effects, or cultural baggage. 

  Let me unpack their examples: land titling requiring individual owners, contracts needing legally individuated members, exit requiring state-schooled credentials. Each forces a group to reorganize internally to interface with the system. The state isn’t saying "don’t be communal"; it’s saying "to play by these rules, you must *be legible* as liberal individuals." 

  Crucially, this isn’t about outcomes (who wins/loses) or intent (bad faith). It’s a *systemic* feature: any framework built for atomic actors will mold groups into atomic shapes. Even a saint-designed system would do this. That’s why it’s distinct from oppression or paternalism—no ill will needed, just institutional logic.

  The user also asks edge cases: When does "opt out at cost" become "reorganize or die"? (Probably when cost = existential threat.) Does it apply beyond the state? (Yes—banks, licensing bodies.) Must neutrality be claimed? (No—even perfectionist states imposing similar forms would trigger it.)

  ...I think I’ve got it. "Structural preemption." It captures how liberal frameworks *preemptively require* certain structures, making alternatives non-viable not by ban but by operational necessity. The "preemption" part emphasizes it’s not coercion—it’s the quiet displacement of possibility. 

  Boundaries: 
  - Vs. majority domination: No malice required; happens even in ideal systems. 
  - Vs. unequal effects: Not about disparate impact, but mandatory reorganization. 
  - Vs. cultural baggage: Not incidental—it’s a functional prerequisite for participation. 

  For their oral-contract example: If the cost of opting out (e.g., no access to courts) guts the community’s survival, it crosses into structural preemption. The bank KYC case? Textbook—forces groups to bureaucratize to exist financially. 

  This feels right. The user needs a term that’s surgical enough for academic debates but robust enough for policy work. "Structural preemption" might just carve reality at the joints they’re pointing to.
answer: |-
  Your description captures a distinct and under-theorized phenomenon in political theory: **the imposition of *structural prerequisites* inherent to liberal institutional frameworks, which demand that groups internally reorganize to achieve *functional compatibility* with individualism—regardless of neutrality claims, intent, or exit availability.** This isn't merely unequal effect or disguised perfectionism; it's a **non-optional operational requirement** embedded in the machinery itself. Let's carve it:

  ### Proposed Term: **STRUCTURAL PREEMPTION**
  *(or: **Institutional Assimilation Requirement**, **Operational Homogenization**)*

  **Core Definition:**  
  The phenomenon where a state's (or institution's) *procedurally neutral framework* necessitates that participating groups adopt specific **internal organizational forms**—shaped by liberal individualism—to functionally interface with that framework. This requirement persists even when:  
  - The framework is justified neutrally (no appeal to the good).  
  - Effects are unintended.  
  - Exit is genuinely available.  
  - No belief or practice is directly prohibited.  

  **Why Existing Concepts Don't Fit:**  
  | Concept              | Why It Falls Short                                                                 |  
  |----------------------|------------------------------------------------------------------------------------|  
  | "Myth of Neutrality" | Focuses on biased *outcomes* or *justification*; your point is about *functional necessity*. |  
  | Perfectionism        | Asserts liberalism *promotes* a good; here, the demand is *operational*, not evaluative. |  
  | Unequal Effects      | About disproportionate *burdens*; you highlight a *precondition* for participation. |  
  | Comprehensive Doctrine | Claims liberalism *presupposes* a worldview; your point holds even without such presuppositions. |  
  | Paternalism/Majoritarianism | Requires intent or preference; your case works absent both. |  

  ### Boundaries: What Counts vs. What Doesn't  
  **Essential Features of a Case:**  
  1. **Functional Mandate:** The framework *requires* groups to adopt internal structures mirroring liberal individualism (e.g., legal individuation, standardized credentials) **to use core services** (courts, property, contracts).  
  2. **Neutral Facade:** The requirement is hidden within "neutral" procedures (e.g., "anyone can own land" ignores that ownership *must* be individual).  
  3. **Reorganization, Not Prohibition:** Groups aren’t banned, but must *transform internally* to participate (e.g., communal land → individual titles).  
  4. **Exit Insufficiency:** Exit being "available" doesn’t resolve the issue; the framework still demands assimilation *if you engage*.  

  **Your Edge Cases Resolved:**  
  - **"Public contracts must be in writing"**  
    *Counts* if oral communities face existential exclusion from essential services (e.g., no access to dispute resolution). If opting out merely means using private arbitration, it *doesn’t count*—cost alone isn’t enough. The line is crossed when the cost **destroys the group’s functional viability** (e.g., no land tenure security without written contracts).  
  - **Openly Perfectionist State**  
    *Still counts* if the *form* of the requirement is identical. The phenomenon is about the **structural demand itself**, not the justification. If a theocracy required individual land titling to "save souls," the *organizational coercion* remains.  
  - **Non-State Institutions (Banks, Licensing)**  
    *Absolutely counts*. Banks requiring individual accounts/KYC force groups to bureaucratize internal relations. Medical boards requiring standardized degrees dismantle apprenticeship systems. The logic is identical.  

  ### Distinguishing from Neighboring Concepts  
  | Concept                          | How Structural Preemption Differs                                  |  
  |----------------------------------|---------------------------------------------------------------------|  
  | **Majority Domination**          | No malicious intent needed; occurs even in ideal systems.           |  
  | **Unequal Effects**              | Not about *impact* but *precondition*; groups must *change* to avoid harm. |  
  | **Cultural Baggage of Institutions** | Goes beyond "bias"; it’s a *functional prerequisite* for access.   |  

  ### Why "Structural Preemption"?  
  - **Structural**: Embedded in the design of institutions.  
  - **Preemption**: The framework *preemptively* eliminates alternative organizational forms by making them non-viable within the system, without explicitly banning them.  

  **Key Insight:** Liberalism’s "neutrality" isn’t violated by bias, but by its **operational dependence on individualism**. The framework can’t function unless groups atomize internally—making neutrality *logically impossible* for non-individualist communities, regardless of intent.  

  ### In Your Policy Context  
  This explains why communal land tenure systems fail under liberal regimes: **individual titling isn’t just an option—it’s a non-negotiable entry fee.** The state says, "You can keep your culture!" while its machinery whispers, "...but only if you reshape it to fit our sockets."  

  **Scholarly Anchor:** This extends Chandran Kukathas’ "exit-only" critique (*The Liberal Archipelago*, 2003) but goes further: exit doesn’t address the *assimilation imperative* for those who stay. It also complements Jacob Levy’s "multiculturalism of fear" by showing how institutional mechanics—not just state power—generate coercion.  

  You’ve identified a gap. Naming it clarifies why liberal toleration often feels like a velvet-gloved demand to self-dismantle.
