prompt: |-
  I am auditing a graduate seminar in political theology this term, and its organizer has built the whole unit on political violence around a single sentence drawn from Aquinas's discussion of sedition in the Secunda Secundae: "a tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler" — and therefore, he continues, disturbing such a government is not sedition, unless the disturbance does the subjects more harm than the tyranny itself did. That sentence has become the seminar's all-purpose answer. Last week a classmate used it to shut down a question about whether a crowd that stormed a courthouse had any standing to act, and outside the seminar the same line circulates whenever anyone wants to insist that the people who rioted were on the right side of history. I am not persuaded one sentence can do all that work, but I cannot yet say why.

  The complication is that another member of the seminar wants to import it into law. Her project is a model jury instruction for sedition and insurrection offenses under which a defendant may argue that the government he acted against had forfeited its claim to stand for the common good, so that his conduct was not seditious at all but defensive; a proportionality proviso, taken from Aquinas's caveat, would require the jury to weigh the harm caused by the disturbance against the harm caused by the regime. As I understand it, nothing of the kind is available in practice today: legitimacy is not a question the jury may entertain, and the nearest analogue, nullification, is not a right anyone can assert. The proposal is therefore genuinely novel, and its defenders say the Aquinas line is its foundation.

  Could you set out, as a menu I can bring to the seminar, the distinct precise claims this one sentence might be making? I want the readings separated rather than blended: is it a stipulative point about what "sedition" means in Aquinas's technical vocabulary — he follows Augustine in taking a people to be "the assembly of those who are united together in fellowship recognized by law and for the common good," and treats sedition as an offense against that unity — or a substantive moral claim that resistance to tyranny is permissible, or a narrower claim about how guilt distributes between the authors of a disturbance and its followers, or a claim about what the tyrant has forfeited? For each reading, tell me whether it becomes trivial once the definitions are granted, whether it is defensible, whether it is false, and whether it is merely verbal. In particular: does Aquinas meet the objection that delivering a multitude from a tyrant is praiseworthy by redefining "the people," and if so, has he said something or only rearranged terms? And what is the proportionality proviso doing — a moral limit on resistance, a condition on the concept, or a hedge against precisely the objection my classmate refused to answer?

  Finally, say which of these readings, if any, would support the proposed jury instruction and which would leave it unsupported; what premises the legal version requires that Aquinas never supplies — who identifies a tyranny, by what procedure, and whether a modern state is a "multitude" in his sense at all; and which reading my classmate was invoking when he used the line to end an argument. I am not looking for a defense of one reading and need no bibliography: just the disambiguation, with verdicts.
reasoning: |-
  Okay, the user is in a graduate seminar on political theology, and the whole unit on political violence is centered around one sentence from Aquinas. The user is skeptical about how this single sentence is being used as an all-purpose answer to justify various actions, including recent events like storming courthouses. They want a breakdown of the distinct claims Aquinas might be making in that sentence, and how those interpretations hold up. They also want to know if any of these readings support a proposed jury instruction that would allow defendants to argue the government was tyrannical.

  First, I need to parse the original Aquinas quote. The key part is that a tyrannical government isn't just because it serves the ruler's private good, not the common good. Therefore, disturbing it isn't sedition unless the harm outweighs the tyranny. The seminar is using this to validate acts of resistance, and one student is even proposing a legal model based on it.

  The user's main request is to disambiguate the possible interpretations of Aquinas's sentence. They want each reading separated: is it a definitional point, a moral claim, about guilt distribution, or about forfeiture? For each, I need to assess if it's trivial, defensible, false, or just verbal. Also, whether redefining "the people" is substantive or just wordplay. Then, the proportionality proviso—what role does it play? Lastly, which interpretations support the jury instruction, and what additional premises are needed.

  Starting with the readings. The first is the definitional/stipulative reading. Aquinas defines sedition as opposing a just government; tyranny isn't just, so opposing it isn't sedition. If you accept his definitions, then yes, it's tautological. But that doesn't make it trivial because the definitions carry normative weight. The key here is whether "common good" is objectively definable. If it's just a label, then it's verbal. But Aquinas likely has a substantive view of the common good, so it's defensible within his framework.

  Next, the substantive moral claim. Is Aquinas saying resisting tyranny is permissible? The sentence implies permissibility, but it's not explicit. He might be leaving room for prudence. The caveat about proportionality adds a moral limit. This reading is defensible but not explicitly stated in that sentence alone; it requires his broader ethical system. So, it's not trivial and not merely verbal.

  Third, guilt distribution. Does the sentence address whether leaders vs. followers are culpable? The original text mentions that disturbing tyranny isn't sedition, but doesn't specify levels of guilt. Aquinas elsewhere discusses cooperation with evil, but this sentence alone doesn't cover that. So this reading might be a stretch, possibly false if forced into the text.

  Fourth, forfeiture claim. Has the tyrant forfeited legitimacy? The sentence implies that tyranny lacks justice, so authority is illegitimate. But forfeiture is a modern legal concept; Aquinas is more about the nature of authority. It's defensible as an implication, but he doesn't use the term "forfeit." So, not trivial, defensible, but needs interpretation.

  On redefining "the people": Aquinas follows Augustine's definition—a people united by law for the common good. If a ruler serves private good, the unity is broken, so it's no longer a people in that sense. Is this just wordplay? If "common good" is objectively verifiable, then it's substantive. But if it's subjective, then it's verbal. Given Aquinas's natural law framework, it's substantive, but requires agreement on what constitutes the common good.

  The proportionality proviso: it's a moral limit. Without it, resisting any tyranny would be justified regardless of consequences. The caveat introduces a utilitarian element—weighing harms. It's a pragmatic hedge against reckless resistance. So, it's both a moral and practical condition.

  Now, the jury instruction proposal. It would let defendants argue the government forfeited its claim to the common good, with a proportionality test. Which readings support this? The substantive moral claim and forfeiture reading do. But Aquinas doesn't provide mechanisms to identify tyranny or procedures for judgment. Who decides? In a modern legal system, this is problematic. Juries aren't equipped to assess a regime's legitimacy broadly. Also, modern states are more complex than Aquinas's "multitude," so applying his concepts directly might not fit.

  The classmate who shut down the question likely used the substantive moral claim or forfeiture reading, implying that any tyrannical government can be justly opposed, ignoring the proportionality and the nuances of defining tyranny and common good.

  Key premises the jury instruction needs that Aquinas doesn't supply: an objective standard for "common good," a procedure to declare a government tyrannical (who, how), whether collective judgment is required, and how proportionality is measured. Also, Aquinas's context was medieval monarchy, not modern bureaucratic states, so applicability is an issue.

  In summary, the definitional reading makes the sentence true by stipulation but doesn't help legally. The moral and forfeiture readings support the instruction but require additional legal structures Aquinas doesn't provide. The guilt distribution reading is weak here. The classmate probably invoked the substantive moral claim, oversimplifying Aquinas to justify the rioters' actions without considering proportionality or proper authority.
answer: |-
  Here is a disambiguation of Aquinas's sentence ("a tyrannical government is not just...") into distinct claims, evaluated for triviality, defensibility, and substance, followed by analysis of its application to the jury instruction proposal and your classmate's usage. Each reading is presented as a precise, separable interpretation.

  ---

  ### **I. Distinct Readings of Aquinas's Sentence**

  1.  **Stipulative/Definitional Claim (Sedition Redefined):**
      *   **Claim:** "Sedition" *by definition* only applies to disturbances against a *just* government (one oriented to the common good). Therefore, disturbing a *tyrannical* government (oriented to private good) is *not sedition* within Aquinas's technical framework.
      *   **Trivial?** **Yes, but consequentially so.** Once you accept Aquinas's definitions ("sedition" = sin against unity of a *just* people; "people" = assembly united for *common good*; "tyranny" = rule for *private good*), the conclusion follows tautologically. Opposing non-just rule isn't sedition *by definition*.
      *   **Defensible?** **Yes, internally.** It's logically consistent within his system built on Augustinian political philosophy and Aristotelian teleology. The definitions are coherent.
      *   **False?** **No**, within its own terms. It avoids external falsity by being a stipulation.
      *   **Merely Verbal?** **Mostly, but not entirely.** The power lies in the *normative weight* packed into the definitions of "common good" and "private good." While the inference is verbal, the definitions themselves are substantive moral/political judgments.
      *   **Redefining "the People"?** **Yes, explicitly.** Aquinas meets the objection ("delivering a multitude from a tyrant is praiseworthy") by redefining terms: A group ruled tyrannically *is not a true "people" united for the common good* in the relevant sense. The tyrant has shattered the unity based on law and common good.
      *   **Substance vs. Rearrangement:** It **rearranges terms to make a substantive point.** Defining the "people" (and thus the legitimate object of sedition) *in terms of the common good* embeds the substantive moral claim that legitimacy *depends* on pursuing the common good. The rearrangement *enables* the substantive conclusion.

  2.  **Substantive Moral Claim (Permissibility of Resistance):**
      *   **Claim:** Resisting or disturbing a tyrannical regime is morally *permissible* (or even praiseworthy), because the regime lacks justice. The sentence is a premise establishing the *condition* (tyranny) under which resistance loses the character of a sin (sedition).
      *   **Trivial?** **No.** This is the *substantive payoff* of the definitional move. It moves from definition ("it's not sedition") to moral implication ("it's permissible" or at least "not inherently sinful").
      *   **Defensible?** **Yes, within Thomistic natural law.** It flows from the principle that unjust laws/commands lack binding force and the duty to promote the common good. Resistance can be an act of virtue (e.g., charity, justice).
      *   **False?** **Debated, but defensible.** Critics might argue it oversimplifies political obligation or risks anarchy. Defenders argue it's a necessary corrective to absolute obedience.
      *   **Merely Verbal?** **No.** This is the core substantive moral assertion enabled by the definitional framework.

  3.  **Claim About Guilt Distribution (Focus on Authors vs. Followers):**
      *   **Claim:** The primary guilt for the "disturbance" lies with the *tyrant* who caused the injustice, not necessarily with those who initiate the resistance ("disturbing" the tyranny). The tyrant bears responsibility for creating the unjust condition that provokes resistance.
      *   **Trivial?** **No.**
      *   **Defensible?** **Partially, but this is a weak/imprecise reading of *this sentence*.** Aquinas elsewhere discusses degrees of guilt in cooperating with evil or resisting injustice, but *this specific sentence* doesn't explicitly address distributing guilt *between* resisters. It contrasts the guilt of the *tyrant* (implied by creating the injustice) with the potential innocence (or non-seditiousness) of the *resisters*. It's about the *nature of the act* (resistance) relative to the regime, not primarily about apportioning blame *among resisters*. Reading it this way stretches the text.
      *   **False?** **As a direct reading, likely misinterpretation.** The sentence doesn't support this well.
      *   **Merely Verbal?** **N/A** (Misinterpretation).

  4.  **Forfeiture Claim (Tyrant Lacks Legitimate Authority):**
      *   **Claim:** By ruling for private good instead of the common good, the tyrant *forfeits* their claim to legitimate authority. The government ceases to be a true "government" in the just sense. Subjects are therefore no longer bound by the duty of obedience associated with just rule in the same way.
      *   **Trivial?** **No.**
      *   **Defensible?** **Yes, as a strong implication.** Aquinas's definitions and logic strongly suggest this. If the unity of the people (based on common good/law) is broken by the ruler's private aims, the ruler's authority *over that unified people* is fundamentally undermined. This is the *ground* for resistance not being sedition.
      *   **False?** **Contested, but logically consistent within the framework.**
      *   **Merely Verbal?** **No.** This is a substantive claim about the *conditional nature* of political authority and its dissolution under tyranny.

  **The Proportionality Proviso ("unless the disturbance does the subjects more harm than the tyranny itself did"):**
  *   **Function:** This is a **pragmatic moral limit on resistance**, a **hedge against the objection** your classmate ignored.
      *   **Not part of the definition of sedition/non-sedition:** Aquinas has already defined disturbing tyranny as *not sedition*. The proviso comes *after* this definitional move.
      *   **A Moral Limit:** Even though resistance isn't *sedition* (i.e., sinful *against the political unity*), it might *still be wrong* if its *consequences* are disproportionately harmful. This injects a consequentialist/prudential element into the otherwise deontological framework. It addresses the very real concern that revolution/civil strife can be catastrophic, potentially worse than enduring a bad ruler. It prevents the definitional claim from becoming a carte blanche for any resistance.

  ---

  ### **II. Application to the Jury Instruction Proposal**

  *   **Supported Readings:** The proposal **primarily relies on the Forfeiture Claim (4) and the Substantive Moral Claim (2).** It argues the government forfeits legitimacy (forfeiture), making resistance not seditious but defensive (substantive moral claim derived from definitions). The proportionality proviso is directly incorporated.
  *   **Unsupported/Insufficient Readings:** The Stipulative Claim (1) alone is merely definitional within Aquinas's system and doesn't translate to a legal defense without importing his entire moral framework. The Guilt Distribution Claim (3) is irrelevant/misapplied.
  *   **Critical Premises Aquinas DOES NOT Supply (Required for the Legal Version):**
      1.  **Who Identifies Tyranny?** Aquinas (writing for theologians/princes) assumes a *shared, objective understanding* of "common good" vs. "private good" based on natural/revealed law. Modern pluralistic societies lack this consensus. The proposal needs a *legal procedure* or *evidentiary standard* for a *jury* to determine if the government is tyrannical ("forfeited"). Aquinas offers none.
      2.  **By What Procedure?** Is it individual conscience? Collective uprising? Judicial review? Legislative action? Aquinas doesn't specify a *process* for declaring forfeiture or authorizing resistance. The proposal requires embedding this within the trial process itself (jury deliberation), which is novel and fraught.
      3.  **Is the Modern State a "Multitude" in Aquinas's Sense?** Aquinas envisions smaller, more homogenous political communities bound by shared law/custom focused on virtue. The complex, pluralistic, bureaucratic modern state may not map neatly onto his concept of a "people" united for a singularly understood "common good."
      4.  **Objectivity of "Harm":** The proportionality proviso requires weighing disparate harms (ongoing structural injustice vs. acute violence/chaos). Aquinas provides no metric for this impossible calculus; the proposal leaves it entirely to the jury's subjective judgment.

  **Verdict on Jury Instruction Support:** Aquinas's sentence provides **philosophical inspiration** for the concepts of forfeiture and justifiable resistance, but offers **zero practical legal mechanism or procedure** for implementing these concepts within a modern adversarial judicial system. The proposal requires translating profound, contested political theology into a workable jury instruction, navigating problems of definition, proof, and subjectivity that Aquinas never addressed. His sentence is a **foundation in moral theory, not a blueprint for law.**

  ---

  ### **III. Your Classmate's Usage (Shutting down the courthouse question)**

  *   **Likely Invoked Reading:** Your classmate almost certainly invoked the **Substantive Moral Claim (2)** ("resisting tyranny is permissible") or the **Forfeiture Claim (4)** ("the tyrant lacks legitimacy"), likely **stripped of the Proportionality Proviso and the nuances of definition**.
  *   **How it was Used:** They treated Aquinas's sentence as a **self-sufficient moral warrant**, implying that labeling the target government "tyrannical" (according to the resisters' view) automatically justifies the disturbance as "not sedition" and therefore legitimate ("on the right side of history"). This ignores:
      *   The crucial **Proportionality Proviso** (was the storming *actually* less harmful?).
      *   The **definitional precision** (was the target *objectively* tyrannical by Aquinas's standard? Was the act aimed *at restoring the common good* or something else?).
      *   The **question of standing/authority** (Aquinas doesn't specify *who* gets to act; your classmate presumed the "crowd" had inherent standing).
      *   The difference between Aquinas's *moral/theological* judgment and a concrete *political/legal* justification for a specific act.

  **In essence, your classmate used the sentence as an unnuanced slogan of justification ("Tyranny = Resistance OK"), ignoring Aquinas's careful qualifications (definitions, proportionality) and the leap from moral permissibility to specific political action.**

  ---

  ### **Summary Menu for Seminar**

  | Reading                     | Core Claim                                                                 | Trivial? | Defensible? | False? | Merely Verbal?          | Supports Jury Instr.? | Notes                                                                 |
  | :-------------------------- | :------------------------------------------------------------------------- | :------- | :---------- | :----- | :---------------------- | :-------------------- | :-------------------------------------------------------------------- |
  | **1. Stipulative (Sedition Redefined)** | Opposing tyranny isn't "sedition" by definition.                           | **Yes**  | **Yes**     | **No** | **Mostly**              | **No**                | True by definition within framework. Power is in the definitions.     |
  | **2. Substantive Moral**    | Resisting tyranny is morally permissible.                                  | **No**   | **Yes**     | **No** | **No**                  | **Yes (Inspiration)** | Core moral implication. Lacks legal mechanics.                         |
  | **3. Guilt Distribution**   | Tyrant bears primary guilt for disturbance (Misreading).                   | **No**   | **Weak/No** | **Yes**| **N/A**                 | **No**                | Not well-supported by this sentence.                                |
  | **4. Forfeiture**           | Tyrant forfeits legitimate authority by ruling for private good.           | **No**   | **Yes**     | **No** | **No**                  | **Yes (Inspiration)** | Key premise for permissibility. Lacks identification mechanism.       |
  | **Proportionality Proviso** | Resistance must cause less harm than tyranny (Moral limit/hedge).        | **No**   | **Yes**     | **No** | **No**                  | **Yes (Direct Copy)** | Critical qualifier ignored by absolutist readings. No objective metric. |

  **Classmate's Usage:** Invoked **Reading 2 or 4** absolutized, ignoring **Proportionality** and definitional nuance.  
  **Jury Instruction:** Requires **Readings 2 & 4 + Proviso**, but needs **unanswered premises** (Who judges tyranny? How? What metric for harm? Modern state fit?). Aquinas provides the **moral concept**, not the **legal procedure**.
