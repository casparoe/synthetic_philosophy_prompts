  ## Adversarial Collaboration Report: The Semantics and Prohibition of Slurs (using *skrell*/*Velani*)

  **Part 0: Diagnosis of Talking-Past**
  The impasse stems primarily from divergent, often unstated, conceptions of core terms, leading to apparent contradictions where substantive disagreements exist alongside terminological slippage.

  *   **Meaning/Content:** The Semanticist typically restricts "meaning" or "content" to elements compositionally active and projectible within the formal semantic system (truth-conditional or use-conditional). The Prohibitionist often employs "meaning" more broadly, encompassing the total social significance or effect of a word, including its prohibitory status. *Regimentation:* We distinguish **Semantic Content** (SC: compositionally determined elements, subject to embedding tests, contributing to truth conditions or conventionally triggered use conditions) from **Social Meaning** (SM: the conventionalized social effects, associations, and prohibitions attached to a word-type by a linguistic community).
  *   **Convention:** The Semanticist focuses on linguistic conventions governing compositional contribution. The Prohibitionist focuses on social conventions governing permissibility and sanction. *Regimentation:* **Linguistic Convention** (LC: shared rules for combining words to determine SC) vs. **Social Convention** (SoC: shared norms governing acceptable use, triggering sanctions for violation).
  *   **Offense/Harm:** Both agree offense occurs but differ in proximate cause. Semanticists often see offense as *conventionally triggered* by the SC (even if ultimately rooted in social facts). Prohibitionists see offense as a *performative consequence* of violating the SoC prohibition. *Regimentation:* **Conventional Offense Potential** (COP: offense arising directly from the understood SC or its conventional association, potentially present even in non-assertoric uses) vs. **Sanctioned Use Offense** (SUO: offense arising primarily from the recognition that a prohibited word-type has been used, regardless of specific SC).
  *   **Derogatory:** Semanticists equate this with a specific type of SC (descriptive or expressive). Prohibitionists equate it with the prohibited status itself (SM). *Regimentation:* **Semantic Derogation** (SD: derogatory content encoded as SC) vs. **Social Derogation** (SoD: the status of being a prohibited term used to express contempt or enact harm).

  The core *substantive* disagreement is: **Does the prohibitory status and offensive effect of *skrell* require positing a distinct, derogatory element within its Semantic Content (SC), or can it be fully explained by the Social Convention (SoC) of prohibition attached to the word-type itself, coupled with the SC of its neutral counterpart *Velani*?** The following sections use the regimented terms to avoid equivocation.

  **Part I: Agreed Claims**

  Both parties endorse the following substantive claims:

  1.  Substituting *skrell* for *Velani* is never merely stylistic; it reliably alters the utterance's effect, typically making it offensive or inappropriate in contexts where *Velani* is acceptable.
  2.  Adding a disclaimer (e.g., "I don't mean it that way") does not reliably remove the offensiveness of an utterance containing *skrell*.
  3.  Reclamation (in-group use of *skrell* with non-derogatory/non-offensive effect) is a genuine, widespread, but often partial phenomenon (e.g., not all in-group members accept it, outsiders may still find it offensive).
  4.  The harms associated with *skrell* are serious and extend beyond individual hurt feelings to include group-based degradation, intimidation, and reinforcement of social inequalities.
  5.  Compositionality is a core principle: the meaning of a complex expression is determined by the meanings of its parts and their mode of combination.
  6.  Tests like embedding under negation, in questions, conditionals, attitude reports, and indirect speech, and distinguishing use from mention, are the primary methodological tools for determining whether an element contributes to Semantic Content (SC).
  7.  Speaker intentions alone cannot determine whether *skrell* is used offensively or whether it possesses derogatory Semantic Content; conventional meaning and social norms are primary.
  8.  In Case N1 (Decreed Neologism): *skrell* was successfully established as a prohibited term conveying offense despite lacking prior history; competent speakers report offense upon its utterance while explicitly disbelieving the associated stereotypes and being unable to articulate specific derogatory SC beyond its prohibited status.
  9.  In Case N2 (Prohibited Neutral): *Brill* now reliably triggers sanctions and offense identical to *skrell* due to the sustained prohibition campaign. *Brill* retains its original, neutral Semantic Content (SC) identical to *Velani*.
  10. In Case N3 (Scrubbed Speaker): Speaker S's non-assertoric uses of *skrell* (negation, conditionals, questions, mention) are still found jarring by hearers and lead to social sanction in some instances.
  11. In Case N4 (Unknowing User): The lexicographer's good-faith, ignorant use of *skrell* caused genuine offense to the audience. The speaker is not blameworthy in the ordinary sense (lacking intent and knowledge).
  12. In Case N5 (Two Communities): The same utterance of *skrell* by a speaker from Community A (reclaimed) causes offense in Community B (non-reclaimed) but not in A. The speaker's identity and community context significantly affect offensiveness.
  13. An adequate account of slurs must explain the substitution failure (Claim 1), the ineffectiveness of disclaimers (Claim 2), the possibility and partiality of reclamation (Claim 3), the embedding behavior (using the tests in Claim 6), and the role of community norms (evident in N5).
  14. The prohibitory status of *skrell* is a robust social fact (SoC) that plays a central role in its use and effects.
  15. The word *skrell* carries significant Social Meaning (SM), centrally including its prohibited status and potential to cause offense/harm.

  **Part II: Disagreements Table**

  | Issue                                                                 | Semanticist Formulation                                                                                                 | Prohibitionist Formulation                                                                                                                                 | Genuine or Verbal? | What Would Settle It                                                                 | Agreed Test / Case                                                                                                  | Semanticist Prediction                                                                                             | Prohibitionist Prediction                                                                                               |
  | :-------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------- | :----------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- |
  | **1. Source of Offense in Standard Assertoric Use**                   | The offense arises conventionally and directly from the derogatory Semantic Content (SD) of *skrell*.                   | The offense arises primarily from the recognition that a word prohibited by Social Convention (SoC) has been used (SUO), exploiting the neutral SC of *Velani*. | **Genuine**        | Can offense occur reliably without any posited derogatory SC?                        | **Case N1 (Decreed Neologism):** Offense occurs despite no articulated SD beyond prohibition.                      | *Predicts:* Offense implies some derogatory SC is present/conventionally triggered, even if hard to articulate.    | *Predicts:* Offense is fully explained by the SoC prohibition + use of term co-referential with *Velani*; no SD needed. |
  | **2. Semantic Content of *skrell***                                   | *skrell* has distinct Semantic Content (SC) from *Velani*, crucially including a derogatory element (SD).              | *skrell* has the *same* Semantic Content (SC) as *Velani*; its difference lies entirely in its Social Meaning (SM - prohibition) and lack of neutrality.   | **Genuine**        | Does *skrell* contribute distinct, compositionally active content beyond reference? | **Embedding Tests (e.g., negation):** "Ollie is not a skrell." Does this deny group membership or the derogation? | *Predicts:* Negation typically targets/takes scope over the derogatory component (SD), *not* group membership.     | *Predicts:* Negation targets the group membership (SC shared with *Velani*); offensiveness (SUO) may persist.           |
  | **3. Status of Prohibited Neutral (*brill* in N2)**                   | *Brill* (N2) is *not* a slur; it lacks derogatory SC (SD). Its offense stems solely from violating the SoC (SUO).       | *Brill* (N2) *is* now functionally a slur; its offense is identical to *skrell*'s and stems from the same source (SoC violation/SUO + neutral SC).        | **Primarily Verbal** | Does being a "slur" require derogatory SC (SD), or is it defined by prohibitory status (SoD)? | **Case N2 (Prohibited Neutral):** Behavior under embedding/reporting.                                               | *Predicts:* *Brill* embeds/reports like *Velani* (only group reference SC), unlike *skrell*. Offense is SUO only. | *Predicts:* *Brill* embeds/reports like *Velani*, but causes SUO offense *identical* to *skrell* in unembedded uses.    |
  | **4. Offense in Non-Assertoric Contexts (e.g., N3)**                  | The offense/jarring effect in non-assertoric uses (N3) arises because the derogatory SC (SD) projects or is activated. | The offense/jarring effect in non-assertoric uses (N3) arises because the prohibited word-type *skrell* is used, violating the SoC (SUO).                 | **Genuine**        | Can the SoC violation (SUO) alone explain offense in embeddings/mentions?           | **Case N3 (Scrubbed Speaker):** Offense occurs in negation, questions, conditionals, mention.                      | *Predicts:* Projection behavior of SD explains variation/persistence of offense across embeddings.                 | *Predicts:* SUO explains offense; the prohibition applies to *using the word-type* regardless of syntactic context.     |
  | **5. Role of Speaker Belief/Ignorance (N4)**                          | The derogatory SC (SD) is conveyed conventionally, so offense can occur even if the speaker lacks derogatory beliefs.   | Offense occurs due to the SoC violation (SUO). An unknowing user (N4) violates the convention unintentionally, causing offense without blameworthiness.    | **Verbal**         | Is SD's conventional nature fundamentally different from SoC's?                      | **Case N4 (Unknowing User):** Offense occurs without speaker intent/belief.                                        | *Predicts:* Consistent with SC being conventional.                                                                 | *Predicts:* Consistent with SoC violation being conventional.                                                           |
  | **6. Relativity & Reclamation (N5)**                                  | Reclamation (N5A) involves altering or neutralizing the derogatory SC (SD) for the in-group.                           | Reclamation (N5A) involves lifting the SoC prohibition *within* the in-group, changing the Social Meaning (SM); SC remains constant.                      | **Genuine**        | Does reclamation change SC or SM?                                                   | **Case N5 (Two Communities):** Does *skrell* in Community A have different SC or different SM from Community B?    | *Predicts:* SC (including SD) is altered/neutralized for in-group use in A.                                        | *Predicts:* SC is identical in A and B; only SM (prohibition status) differs for the in-group in A.                     |

  **Part III: Cruxes and Pre-committed Concessions**

  Ranked by potential to move the debate:

  1.  **Crux 1: Embedding Behavior & Semantic Content (Issue 2 & 4, Tests: N3, Embedding generally)**
      *   *Why:* This directly tests whether prohibitory status (SoC/SUO) alone can explain the complex behavior under negation, questions, etc., or whether a distinct semantic component (SD) with specific projection properties is required. It probes the core compositional claim.
      *   **Semanticist Concession:** If rigorous analysis shows the offense/jarring effect in *all* non-assertoric contexts (N3) *exactly mirrors* the pattern expected from simple word-type prohibition triggering SUO in any utterance context, *and* shows no distinct projection behavior attributable only to SD, then Semanticists will abandon the claim that a distinct, compositionally active derogatory element (SD) is *necessary* within Semantic Content to explain the embedding data. They will accept that a purely prohibition-based account *can* formally model the observed embedding effects.
      *   **Prohibitionist Concession:** If rigorous analysis shows the offense/jarring effect in non-assertoric contexts (N3) exhibits a *systematic projection pattern* (e.g., consistently surviving certain embeddings but not others in a way predictable by semantic type) that cannot be straightforwardly explained by word-type prohibition triggering SUO uniformly, *and* this pattern aligns with known semantic types (e.g., conventional implicatures, expressives), then Prohibitionists will abandon the claim that *skrell* has *no* distinct Semantic Content (SC) from *Velani*. They will accept that *skrell* possesses an additional, non-truth-conditional, conventionally triggered use-conditional or expressive element within its SC.

  2.  **Crux 2: Offense without Articulable Derogatory Content (Issue 1, Test: N1)**
      *   *Why:* N1 challenges the Semanticist claim that offense *requires* conventionally triggered derogatory SC (SD). If prohibition + coreference alone suffice, the need for SD is weakened.
      *   **Semanticist Concession:** If analysis confirms that competent speakers in N1 genuinely cannot articulate *any* specific derogatory content (beyond "it's the bad word") conventionally associated with *skrell* as part of its meaning, *and* there is no evidence of such content being compositionally active (via embedding tests), *and* the offense is robustly explained by the known prohibition (SoC) and coreference to Velani, then Semanticists will abandon the claim that a slur *must* encode specific derogatory descriptive or expressive content (SD) as part of its Semantic Content. They will accept that a term can become a slur purely through deliberate prohibition attached to a neutral-referring form.
      *   **Prohibitionist Concession:** If analysis shows that competent speakers in N1, despite initial reports, demonstrably *do* conventionally associate specific derogatory stereotypes or attitudes with *skrell* (beyond mere prohibition), evidenced through patterns of use, inference, or metalinguistic discussion, *and* this content shows signs of being compositionally active (e.g., projecting in embeddings), then Prohibitionists will abandon the claim that offense *never* involves conventionally triggered derogatory Semantic Content (SD). They will accept that deliberate neologism *can* establish specific derogatory SC.

  3.  **Crux 3: The Nature of Reclamation (Issue 6, Test: N5)**
      *   *Why:* Reclamation tests whether the offensive element is semantic (requiring SC change) or social/prohibitory (requiring SM/SoC change). N5 provides a direct comparison.
      *   **Semanticist Concession:** If analysis of in-group use in Community A (N5) shows *no* systematic difference in the compositional behavior of *skrell* compared to Community B (e.g., same embedding effects, same inferences drawn under negation/questions), *and* the only observable change is the lifting of sanctions/offense within the in-group context, then Semanticists will abandon the claim that reclamation *necessarily* involves a change in Semantic Content (neutralization/alteration of SD). They will accept that reclamation can occur purely through a change in Social Meaning (SM) / Social Convention (SoC) regarding permissibility.
      *   **Prohibitionist Concession:** If analysis of in-group use in Community A (N5) shows clear differences in the compositional behavior of *skrell* compared to Community B (e.g., lack of projection of offense in certain embeddings, emergence of positive/neutral inferences), indicating a change in conventional meaning, then Prohibitionists will abandon the claim that the Semantic Content (SC) of *skrell* remains *identical* to *Velani* in all contexts. They will accept that reclamation can involve a change in the conventionally encoded meaning (SC), likely neutralizing or altering a derogatory component.

  **Part IV: Residual Disagreement**

  *   **Semanticist Statement:** "Despite areas of potential convergence, we maintain that the most elegant and empirically adequate explanation for the full range of data – particularly the *projection behavior* of offensiveness in embeddings and the *specificity* of the offense tied to the target group even in cases like N1 – requires positing a derogatory element within the conventional semantic content of *skrell* itself. While prohibition is a crucial social fact, it arises *because of* and *reinforces* this encoded derogation; it is not the sole source. Prohibition-based accounts struggle to explain the fine-grained interaction of offensiveness with semantic structure without implicitly smuggling in semantic features. The residual difference is not merely verbal; it concerns whether the formal semantic apparatus must include a distinct component for slurs to model their linguistic behavior accurately."

  *   **Prohibitionist Statement:** "We acknowledge the complexity but hold that the central phenomenon – the profound offense and sanction triggered by *skrell* – is fundamentally explained by its status as a prohibited word, a social fact distinct from its semantic content (which is identical to *Velani*). Attributing derogation to semantic content conflates cause (prohibition) with effect (offense) and mistakes a metalinguistic prohibition for linguistic meaning. The embedding data and cases like N1 and N3 are fully explained by the blanket prohibition on *using the word-type* in virtually any context. Reclamation (N5) clearly demonstrates that offensiveness is governed by social permission, not inherent semantics. The residual disagreement is substantive: it concerns whether semantics is the appropriate level to explain the *prohibition-driven* harm of slurs, or whether this mislocates a social fact within the linguistic system."
