prompt: |-
  I sit on a nine-member Living Conditions Review Panel in a mid-sized American state. Two years ago, after our warden and our officers' union president returned from a study visit to Norwegian facilities operating under a normality principle, Halden among them, the department commissioned a redesign of Ridgeview, our medium-security institution built in the 1970s, and made every proposed change to daily life there subject to our vote. Our charter directs us to weigh the security of the facility, the safety of staff and residents, and the successful return of residents to the community, and it does not rank those considerations. The panel comprises three department appointees, two members nominated by the officers' union, two by a statewide victims' rights coalition, and two by the legislature. We record vote tallies only: no written reasons, and we have never adopted a general standard.

  Our record so far, in the order decided:

  1. Approved: work release at a commercial dairy thirty miles away. Residents leave unescorted at 5 a.m. and return by 7 p.m., six days a week, are paid the local minimum wage, wear GPS monitors, and are subject to immediate recall. Mandatory deductions for room and board, child support, and victim restitution leave them roughly forty dollars a week, which may not be spent in town.
  2. Rejected: paying the same minimum wage, with the same deductions, for work inside the fence, in the kitchen, laundry, and maintenance shops.
  3. Rejected: fitting every resident's door in the west unit with a lock operable from the inside, in a unit where the officer's station is forty feet away and every room has a working call button.
  4. Approved: ending twenty-two-hour lockdown in that same west unit. Rooms are open from 6 a.m. to 10 p.m., residents move freely among dayroom, gym, library, and yard, and officers walk the tier continuously instead of observing from the booth.
  5. Approved: closing the cafeteria and giving each resident a weekly food allowance set at the state's SNAP-equivalent per diem, spent at an in-unit store priced at cost, with meals cooked in a shared kitchen where knives are issued on a sign-out log and counted back each night.
  6. Rejected: personal mobile phones with unrestricted calling, texting, and internet access.
  7. Approved: free video calls from open booths in the dayroom, thirty minutes by appointment, recorded, restricted to a pre-approved contact list, with an officer in sight of every booth.
  8. Approved: a music program. Piano and drum kit are kept in a locked, staff-controlled storeroom, practice runs from 4 to 8 p.m., and we invite the victims' coalition and the local paper to two concerts a year.
  9. Rejected: converting the minimum-security wing to fenceless cottages with residents walking to jobs in the adjoining town, despite a state audit reporting zero escapes from that wing in three years and a sharp drop in assaults there since item 4 took effect.

  Next month's item is a family residential unit sited inside the existing perimeter, on the footprint of the minimum-security wing: eight furnished one-bedroom apartments, each with a full kitchen including knives in a lockable drawer, a living room, and a bathroom. A resident classified minimum security, with two years served, a clean disciplinary record for eighteen months, and documented participation in the video-call and work-release programs, may apply for a stay of forty-eight to seventy-two hours with a spouse or partner and dependent children under fourteen. Groceries come through the same store and allowance as item 5. Officers are posted at the unit's single entrance and there are no cameras inside the apartments; the department's security review finds escape risk no greater than in the wing as it now stands and states that an officer can reach any apartment door within ninety seconds. Under the proposal as drafted, each resident signs an agreement providing that officers will not enter an occupied apartment except on activation of a duress alarm, at the twice-daily head counts, or in a documented emergency. The department's research office has given us two studies of extended family-contact programs, one finding a modest reduction in returns to custody and one finding no measurable effect; a private foundation covers construction and operating costs fall on the department; the victims' coalition has asked that the item be deferred, and two of its seats have said they will vote no.

  What I need is an analysis of our own consistency, not a survey of the literature. Specifically:

  (a) Reconstruct two or three candidate standards, each compatible with all nine votes or requiring the fewest and least damaging exceptions, and state what each predicts about the new item. Give the prediction in terms of the conditions attached, not merely yes or no, since I expect the conditions are where the standards genuinely part company.
  (b) Say what weight the department's security finding and the two conflicting studies carry under each candidate standard, and in particular whether item 9 shows that outcome data has any independent force for this panel.
  (c) Recommend a decision: approve as drafted, approve with specified conditions, defer, or reject, together with the conditions you would write. Identify which of the nine items is the closest analog to the new one and defend that choice against the nearest competitor, and identify which item is hardest to explain on the standard you favor and what the panel would have to say about it.
  (d) State in one sentence each, in language fit for a public report, the principle the panel would be adopting by approving as drafted, by approving with your conditions, and by rejecting.
  (e) Design one further item, to be calendared after this one, that would most cleanly separate the two candidate standards you rate highest, and say what each of them predicts about it.
reasoning: |-
  Hmm, the user is a member of a nine-person panel reviewing prison living conditions. They've described nine previous decisions and now need help analyzing the tenth proposal about family residential units. This is a complex policy analysis task requiring careful pattern recognition and principled reasoning.

  The panel seems deeply divided between rehabilitation-focused and security-focused members. The voting patterns suggest the victims' coalition members consistently oppose liberalizing measures, while department appointees and union members show more variation. The legislature-nominated members appear to be the swing votes.

  Looking at the history: Work release passed (item 1) but internal wages didn't (2) - interesting disparity suggesting the panel values community connection over internal economy. Door locks rejected (3) but lockdown ended (4) - they'll grant movement freedom but not privacy. Self-catering approved (5) but personal phones rejected (6) - practical autonomy yes, digital autonomy no. The music program (8) passed as a controlled cultural activity while the cottage conversion (9) failed despite positive data.

  For the family unit proposal, three potential standards emerge: The "Controlled Normalization" standard (focuses on supervised community reintegration), the "Internal Security Primacy" standard (prioritizes institutional control), and the "Measured Rehabilitation" standard (requires concrete recidivism evidence). Each explains most votes but struggles with some items.

  The cottage rejection (item 9) is particularly telling - it suggests outcome data alone doesn't sway the panel without other factors. For the family unit proposal, I think approval with modified conditions (like adding cameras in common areas and shortening stays) would be the wisest compromise, as it balances the competing concerns.

  The closest analog is actually the work release program (item 1) - both involve supervised community reintegration. The hardest item to explain under any standard is the rejection of internal wages (item 2), which seems inconsistent with approving external work.

  For future items, a proposal about resident-controlled savings accounts would nicely test whether the panel truly supports financial autonomy or just values work as connection to community.
answer: |-
  Based on your voting history, here's an analysis of consistency, candidate standards, and recommendations for the family residential unit proposal:

  **(a) Candidate Standards & Predictions for the New Item:**

  1.  **Standard: "Controlled Normalization for Community Reintegration"**
      *   **Core Principle:** Supports programs that mimic external community life *only when* they directly facilitate supervised reintegration into society and involve structured, off-site activity with demonstrated security controls. Internal changes are less favored unless they directly enable such external programs.
      *   **Compatibility:** Explains all approvals (1, 4, 5, 7, 8) and rejections (2, 3, 6, 9).
          *   *Items 1 & 7:* Directly facilitate external connection (work, family calls) with strong security (GPS, monitoring, pre-approval).
          *   *Item 4:* Enables participation in programs (work release prep, music, potentially family unit access).
          *   *Item 5:* Mirrors community living (food budgeting, cooking) with significant controls (sign-out knives, SNAP budget, cost pricing).
          *   *Item 8:* Structured, staff-controlled community activity with public oversight.
          *   *Items 2 & 3:* Purely internal, no direct community reintegration link.
          *   *Item 6:* Uncontrolled external connection, insufficient security.
          *   *Item 9:* Involves unsupervised *external* movement/activity, lacking sufficient controls despite outcome data.
      *   **Prediction for Family Unit:** **Reject as drafted, but potentially Approve with Conditions.** While it mimics community life (apartment, family), it occurs *inside the fence* and lacks the direct, supervised *external* activity link (like work release). The "escape risk = current wing" finding is insufficient under this standard without the reintegration component being externally focused. Conditions adding a stronger external link (e.g., mandatory participation in external work release *during* the stay) might align it. The internal location and lack of constant officer presence *within* the living space are significant departures from the controlled normalization seen in approved items.

  2.  **Standard: "Internal Security Primacy with Managed Behavioral Incentives"**
      *   **Core Principle:** Security and staff control are paramount within the perimeter. Changes enhancing internal movement/activity are tolerated *if* they demonstrably improve internal safety/order or serve as incentives for low-risk behavior tied to *internal* compliance, but autonomy is strictly limited. External programs require absolute, verifiable security.
      *   **Compatibility:** Explains all approvals (1, 4, 5, 7, 8) and rejections (2, 3, 6, 9). Minor tension with Item 5's knives.
          *   *Item 1:* Strict external security (GPS, recall), clear incentive structure.
          *   *Item 4:* Improves internal safety (reduced lockdowns correlate with fewer assaults - implied by item 9 context), increases officer presence.
          *   *Item 5:* Strict controls on weapons (knives), pricing prevents exploitation, likely seen as improving order vs. cafeteria.
          *   *Item 7:* Highly controlled, monitored, officer-supervised access to external contact.
          *   *Item 8:* Staff-controlled equipment, specific times, oversight, positive PR.
          *   *Item 2:* Seen as undermining work release incentive, no security/safety benefit.
          *   *Item 3:* Reduces immediate staff control/access.
          *   *Item 6:* Uncontrolled external access, massive security risk.
          *   *Item 9:* Removes perimeter security, unacceptable risk despite data.
          *   *(Item 5 Tension):* Knives require trust; justified by strict sign-out/logging and nightly count, aligning with managed control.
      *   **Prediction for Family Unit:** **Reject as drafted, potentially Approve with Significant Conditions.** The lack of cameras inside apartments and restrictions on officer entry create unacceptable internal security risks and loss of control within the perimeter. The "90-second response" is reactive, not preventative. Conditions such as internal cameras (excluding bathrooms), explicit officer right of entry for routine patrols/checks (beyond headcounts/emergency), shorter initial stays (e.g., 24 hrs), or requiring an officer stationed *within* the common area of the unit itself might align it. The proposal's privacy level exceeds any previously approved internal measure.

  3.  **Standard: "Measured Rehabilitation Focus with Low Risk/Cost"**
      *   **Core Principle:** Favors programs with credible evidence of reducing recidivism or demonstrably low cost/risk, prioritizing those fostering pro-social skills or connections, but only with minimal security concessions and clear boundaries. Outcome data is key, but cost/risk can override weak evidence.
      *   **Compatibility:** Explains most votes (1, 4, 5, 7, 8 approved; 2, 3, 6 rejected). Struggles with Item 9 rejection despite positive data and Item 1 approval despite no explicit recidivism data cited.
          *   *Item 1:* Builds work skills, external connection, low cost (covered by deductions), strong security controls minimize risk.
          *   *Item 4:* Reduced assaults (per item 9 context) implies improved internal environment/safety (a rehabilitative factor), low cost.
          *   *Item 5:* Teaches budgeting/cooking skills, low cost (SNAP-level, cost pricing), controlled risk.
          *   *Item 7:* Maintains family ties (known rehabilitative factor), low cost, high control.
          *   *Item 8:* Pro-social activity, positive PR, low cost/risk with controls.
          *   *Items 2, 3, 6:* No strong recidivism link cited, perceived higher risk/cost vs. benefit.
          *   *Item 9:* **Inconsistency:** Strong outcome data (zero escapes, reduced assaults) and clear rehabilitative potential (transition to community). Rejection suggests either cost (implied by "operating costs fall on the department") or perceived risk (fenceless) overrode the evidence for this panel. *Exception needed:* Perceived risk/cost trumped positive outcome data in this specific, high-visibility case.
      *   **Prediction for Family Unit:** **Leans Approve, but Uncertain.** The conflicting recidivism studies are a weakness ("modest reduction" vs. "no effect"). The private funding for construction is a plus, but department operating costs are a minus. Security risk deemed equal to the current wing is positive. The strong focus on family connection aligns with rehabilitative goals. However, the panel's rejection of item 9 despite strong data casts doubt on whether the positive elements (family focus, external funding for build, security parity finding) will outweigh the weak recidivism evidence and operating costs. Likely requires emphasizing the *unique* rehabilitative value of intensive family contact not captured by standard video calls.

  **(b) Weight of Security Findings & Studies / Outcome Data Force:**

  *   **Controlled Normalization Standard:**
      *   *Security Finding:* Crucial. The finding that escape risk is no greater than the current wing is necessary but *insufficient* for approval; the lack of an *external reintegration* component remains the primary barrier. Security enables the standard's goal but doesn't fulfill it alone.
      *   *Recidivism Studies:* Minimal weight. The standard prioritizes the *structure and purpose* of the program (community reintegration) over specific outcome metrics for approval. Conflicting studies reinforce their irrelevance here.
      *   *Item 9 & Outcome Data:* Confirms outcome data has *no independent force* if the program structure (unsupervised external access) violates the core principle, regardless of positive results.

  *   **Internal Security Primacy Standard:**
      *   *Security Finding:* Paramount, but the proposal's security controls are deemed *inadequate* under this standard (lack of internal monitoring/access). The "90-second response" and "risk equal to wing" are acknowledged but don't compensate for the loss of control *within* the living units.
      *   *Recidivism Studies:* Negligible weight. Security and control are the primary drivers; rehabilitative outcomes are secondary considerations at best.
      *   *Item 9 & Outcome Data:* Confirms outcome data has *no independent force* when weighed against a perceived increase in security risk (removing the fence), even with positive results.

  *   **Measured Rehabilitation Standard:**
      *   *Security Finding:* Very Important. The finding that risk equals the current wing is a significant positive factor, reducing a major barrier to considering rehabilitative benefits.
      *   *Recidivism Studies:* Significant weight, but conflicting results create ambiguity. The "modest reduction" study is a point in favor, but the "no effect" study weakens the case. The standard demands clearer evidence than this conflict provides.
      *   *Item 9 & Outcome Data:* Demonstrates outcome data *can* have force (it was presented and noted), but **it is not decisive.** Item 9 proves that even strong positive outcome data can be overridden by other factors (likely perceived risk and cost) for this panel. Outcome data is influential but lacks independent determinative power.

  **(c) Recommendation & Justification:**

  *   **Recommendation:** **Approve with Conditions.** Rejection ignores the rehabilitative potential and security assessment; approval as drafted ignores genuine security and precedent concerns.
  *   **Key Conditions:**
      1.  **Enhanced Security Monitoring:** Install tamper-proof duress alarms in each apartment *and* motion-activated cameras in common areas (hallways, living rooms - explicitly excluding bedrooms/bathrooms via design/angle).
      2.  **Officer Access Protocol:** Amend the agreement to allow officers to conduct random, unannounced visual inspections of the apartment interior (e.g., door open, officer remains in doorway observing) at any time outside of sleeping hours (e.g., 7 AM - 10 PM), in addition to headcounts, duress alarms, and emergencies. This balances privacy with necessary oversight.
      3.  **Shorten Initial Stay Duration:** Pilot 24-hour stays initially (e.g., Saturday 10 AM to Sunday 10 AM), with potential extension to 48 hours after positive evaluation.
      4.  **Explicit Tie to Reintegration:** Require residents to be *currently participating* in work release (Item 1) or a similarly approved external program during their eligibility period.
  *   **Closest Analog:** **Item 1 (Work Release).** Both involve significant trust and movement/activity beyond standard confinement, focused on maintaining critical external connections (work/family) vital for reentry, under specific security protocols (GPS/secure unit entrance, monitoring/recording). The family unit extends this principle to intensive, private family bonding.
  *   **Nearest Competitor (Item 7 - Video Calls):** While both involve family contact, Item 7 is highly controlled, short-duration, and public. The family unit offers qualitatively different, private, extended contact mimicking home life – a major step beyond scheduled, monitored calls in a booth. Item 1 is a better functional analog for granting significant, trust-based privileges.
  *   **Hardest Item to Explain on Favored Standard (Controlled Normalization):** **Item 2 (Reject Internal Wages).** Why reject paying minimum wage for internal work when external work release (Item 1) is approved? The standard explains it: internal work lacks the *essential community reintegration component* and *external supervision* that defines Item 1. It's purely internal economic activity, not preparing for life outside in the same direct way. The panel views internal work as part of institutional maintenance, not reintegration training.

  **(d) Public Report Principles:**

  *   **By Approving as Drafted:** "The Panel adopts the principle that intensive, private family contact within a secure perimeter is an essential component of rehabilitation and successful community reintegration, with security ensured through controlled access and resident agreements."
  *   **By Approving with Conditions:** "The Panel adopts the principle that supervised residential family contact can be a valuable rehabilitative tool when integrated with external reintegration programs and balanced with appropriate security measures, including monitored common areas and reasonable officer access."
  *   **By Rejecting:** "The Panel reaffirms the principle that the security of the facility and the safety of staff and residents require maintaining clear boundaries on resident autonomy and privacy within the perimeter, particularly concerning unsupervised living spaces and access protocols."

  **(e) Separating Item Design:**

  *   **Item:** **Resident-Controlled Savings Account Proposal.** Allow residents participating in work release (Item 1) to retain a portion (e.g., 25%) of their earnings *after* mandatory deductions in a restricted, interest-bearing savings account within the facility. Funds are inaccessible until 90 days before their scheduled release date, at which point they can be used for approved reentry expenses (housing deposit, work clothes, transportation). Account statements are provided monthly. Security: Funds held by the department in a segregated account, access audited.
  *   **Prediction by Standards:**
      *   **Controlled Normalization for Community Reintegration:** **Approve.** Directly facilitates reintegration by building financial resources *for use upon release*, tied to successful participation in the external work release program. Teaches financial responsibility with a clear external purpose.
      *   **Internal Security Primacy with Managed Behavioral Incentives:** **Reject or Hesitant Approve.** Creates internal management complexity (accounts, audits). While an incentive for work release participation, the benefit is deferred and external, offering no *immediate* security or internal order advantage. Potential perceived risk of disputes or fraud. Might approve only if tightly capped and seen as a powerful incentive with minimal risk.
      *   **Measured Rehabilitation Focus with Low Risk/Cost:** **Approve.** Strong evidence links financial stability post-release to reduced recidivism. Low operational cost/risk (department holds funds). Clear rehabilitative goal (financial literacy, reentry planning). This cleanly separates from Internal Security Primacy, which would likely resist the administrative burden and deferred benefit. Controlled Normalization and Measured Rehabilitation both approve, but for different primary reasons (reintegration link vs. outcome evidence/cost).
