  ### Classification Instrument: Understanding Behaviour Regularities  

  **1. Conceptual Space: Three Axes of Variation**  
  *(a) The Swap Test*  
  - **Passes**: An alternative pattern would serve equally well. Everyone would willingly switch together, but no one would switch alone.  
  - **Fails**: No equally good alternative exists; the current pattern is uniquely functional or preferred.  

  *(b) What Holds It In Place*  
  1. **Social Mirroring**: Acting based on expecting others to act similarly.  
  2. **Reaction Fear**: Worry that others will respond negatively to deviation.  
  3. **Deep Discomfort**: Unease persists even with no observers or expectations of others.  
  4. **Pure Routine**: No reason beyond habit or inertia.  

  *(c) How It Arose*  
  1. **Natural Drift**: Emerged gradually without deliberate choice.  
  2. **Explicit Pact**: Result of agreement, negotiation, or formal enactment.  
  3. **Imposed Order**: Forced by one party; others lacked power to refuse.  

  **Total Cells**: 2 (swap test) × 4 (holds in place) × 3 (arose) = 24 cells.  
  **Unoccupied Cells**:  
  - **(Fails, Social Mirroring, Imposed Order)**: Incoherent. If imposed, deviation isn’t driven by social mirroring.  
    - *Example vacancy*: A tax imposed by a dictator wouldn’t rely on citizens mutually expecting compliance.  
  - **(Passes, Deep Discomfort, Imposed Order)**: Unattractive. Why internalize discomfort for an arbitrary rule forced by others?  
    - *Example vacancy*: A colonially imposed dress code that becomes internalized (rare; usually resisted).  
  - **(Fails, Pure Routine, Explicit Pact)**: Unexplored. A habit-formed regularity that uniquely solves a problem but arose from explicit pact is plausible but underexamined.  
    - *Example*: A community explicitly agrees to rotate crop lands, then follows it unthinkingly for generations.  

  ---

  **2. Decision Tree**  
  *Answer based on your intuition about what sustains a regularity; use Section 3 vignettes for reflection.*  

  1. **If everyone switched to a different way of doing this, and you knew they would, would you switch too without hesitation?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 5.  

  2. **Why do you stick to the current way?**  
     - **Because you expect others to do it and want to match them** → **Leaf A: Lewisian Convention**.  
     - **Because you fear backlash if you don’t** → **Leaf G: Sanction-Backed Convention** *(Defense: Some arbitary conventions enforce sanctions, making them distinct from Lewisian)*.  
     - **No strong reason; it’s just habit** → **Leaf E: Bare Descriptive Regularity**.  

  3. *[Unreachable; placeholder]*  

  4. *[Unreachable; placeholder]*  

  5. **If you were alone and no one could see or know, would you still feel you must do it?**  
     - **Yes** → **Leaf D: Internalized Norm**.  
     - **No** → Go to 6.  

  6. **Why not deviate?**  
     - **Fear of backlash from others** → Go to 7.  
     - **No choice; others hold power over you** → **Leaf F: Power-Asymmetry Regularity**.  
     - **No reason; it’s automatic** → **Leaf E: Bare Descriptive Regularity**.  

  7. **Is the fear of backlash because not doing it harms the group or is unfair?**  
     - **Yes** → **Leaf B: Ullmann-Margalit Cooperation Norm**.  
     - **No** → **Leaf C: Bicchieri-Style Social Norm**.  

  **Leaves**:  
  - **A**: Lewisian convention (strict; e.g., driving side choice).  
  - **B**: Ullmann-Margalit norm (sustains mutual benefit).  
  - **C**: Bicchieri-style norm (requires belief others conform/expect it).  
  - **D**: Internalized norm (no audience needed).  
  - **E**: Bare descriptive regularity (no "ought").  
  - **F**: Power-asymmetry regularity (imposed; illusory mutual benefit).  
  - **G**: Sanction-backed convention (arbitrary but enforced).  

