  **3. Diagnostic Items (Vignettes)**  
  *Options: (a) Content if all switch. (b) Feel wrong even alone. (c) Fear backlash. (d) Pure habit.*  

  1. **Pub Rounds (Local)**: At your regular pub, your friend group buys drink rounds in rotation. How do you see this?  
     - (a) If all switched to separate tabs, I’d be fine.  
     - (b) Not buying a round would feel stingy even if alone.  
     - (c) I fear being called selfish if I skip my turn.  
     - (d) It’s just automatic.  

  2. **Pub Rounds (Abroad)**: In a foreign pub, you join strangers for one evening. Round-buying is expected. How do you see this?  
     - (a) If all switched to separate tabs, I’d be fine.  
     - (b) Not buying a round would feel stingy even if alone.  
     - (c) I fear these strangers judging me if I skip.  
     - (d) It’s just automatic.  

  3. **Service Window Reopening**: At a bakery, the queue re-forms after a closure. Regulars reclaim spots; newcomers join the end. How do you see holding your spot?  
     - (a) If all switched to a new line, I’d be fine.  
     - (b) Taking someone’s spot would feel rude even if unseen.  
     - (c) I fear complaints if I cut in.  
     - (d) It’s just ingrained.  

