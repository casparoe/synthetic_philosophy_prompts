     - (c) I fear being seen as greedy if I take it.  
     - (d) It’s just what we do.  

  10. **Apology for Bumping**: After bumping someone, you say "Sorry!" immediately. How do you see this?  
      - (a) If all said "Pardon me", I’d be fine.  
      - (b) Staying silent would feel cruel even with no witnesses.  
      - (c) I fear being seen as rude if I don’t apologize.  
      - (d) It’s just instinctive.  

  11. **Corridor Passing (Local)**: At work, you and a colleague veer right in narrow corridors. How do you see this?  
      - (a) If all veered left, I’d be fine.  
      - (b) Veering left feels awkward even alone.  
      - (c) I fear a collision if I deviate.  
      - (d) It’s just natural.  

