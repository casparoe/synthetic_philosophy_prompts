  Okay, the user is building a causal attribution layer for an incident-review system in warehouse robotics. They need a rigorous theory of omissive causation to determine which absences count as causes in post-incident analysis. Their query is dense with specific requirements and edge cases.

  First, I need to unpack their core ask: desiderata for any adequate theory of omissive causation, with concrete cases forcing each requirement. They've listed six key areas: 1) why some absences but not all qualify as causes, 2) redundant omissions, 3) double prevention, 4) non-agent omissions (like sensor failures), 5) normative/mind-dependency, and 6) compatibility with physics. Plus they want sorting by negotiability, conflict analysis, and a scorecard of existing theories.

  The user's "duty-anchored vs free-floating" distinction seems useful - it directly addresses their practical need to filter relevant absences in robotic systems. But I suspect it might break on non-agent cases (e.g., a sensor failing without explicit "duty"). Must test this against the desiderata.

  For structuring the response:
  - Start with the six desiderata, each illustrated by their warehouse cases
  - Analyze collisions: e.g., physics compatibility vs. double prevention (if absences aren't real, how can their absence cause anything?)
  - Identify the theory-killer: physics compatibility requirement likely eliminates most process theories
  - Their shipping priority suggests sacrificing perfect physics compatibility for workable norm-based attribution

  Scorecard should be brutally concise:
  - Counterfactual theories: handle redundancy but struggle with irrelevance (neighbor case)
  - Process theories: fail physics compatibility hard
  - Fictionalism: elegant but unhelpful for responsibility assignment

  Biggest tension: physics wants no negative events, but responsibility assignment demands we treat certain absences as real causes. For their system, duty-anchoring + counterfactuals might be the pragmatic path, despite philosophical messiness.
answer: |-
  Here are the desiderata for an adequate theory of omissive causation, derived from your cases, sorted by non-negotiability, with conflicts and a scorecard. Your "duty-anchored" (DA) vs. "free-floating" (FF) distinction is **valuable** and integrated below.

  ---

  ### **Core Desiderata (Non-Negotiable)**
  1. **Causal Relevance of Absences**  
     *Case*: A robot's sensor fails to detect a pallet shift (DA absence). The system *must* recognize this as causal, unlike your neighbor not watering your plants (FF absence) when robots had sole duty.  
     *Requirement*: The theory must distinguish *which absences are causes* from irrelevant ones (e.g., DA absences matter; FF generally don’t).  
     *DA/FF Utility*: DA provides a natural filter. FF absences (e.g., "no meteor struck") are excluded unless artificially anchored.

  2. **Non-Spurious Dependence**  
     *Case*: The pallet sensor omission causes the crash, but the absence of your neighbor watering doesn’t—even though the crash counterfactually depends on both.  
     *Requirement*: Dependence (e.g., counterfactual or probabilistic) is necessary but insufficient. The theory must add *constraints* (e.g., norms, duties, or physical processes) to block overgeneration.

  3. **Redundant Omissions**  
     *Case*: Two technicians both fail to hit the stop button (DA absences), either omission alone would have sufficed to ruin the batch.  
     *Requirement*: The theory must allow multiple omissions to be *actual causes* without implying that neither is causal if the other is present.  
     *Conflict Potential*: Process theories (requiring physical connections) struggle here, as absences lack "connections."

  ---

  ### **Tractable but Demanding Desiderata**
  4. **Non-Agent Omissions (Artifacts)**  
     *Case*: A sensor fails to fire (DA absence, by design intent) or a breaker doesn’t trip.  
     *Requirement*: The theory must treat artifacts’ functional omissions *similarly* to agent omissions if they serve identical roles (e.g., both a robot’s and a human’s duty to monitor).  
     *Why Principled?* DA covers artifacts via "design intent" or "normal function" (e.g., a sensor’s *function* is to detect). Rejecting this forces an arbitrary agent/artifact split.

  5. **Double Prevention/Prevention-of-Prevention**  
     *Case*: Absence of a safety override (which would have prevented a shutdown) causes a meltdown. Or: Absence of corrosion (which would have prevented a circuit closure) allows a spark.  
     *Requirement*: The theory must handle absences that *enable* outcomes by *removing barriers* (e.g., "no one disarmed the interlock" is DA and causal).  
     *Collision Alert*: Physics compatibility (#6) clashes here (see Conflicts).

  ---

  ### **Negotiable (Camp-Specific Constraints)**
  6. **Physics Compatibility**  
     *Case*: Physics describes only positive events (particle motions, fields). Absences (e.g., "sensor didn’t signal") aren’t in the ontology.  
     *Requirement*: A theory should either reduce omissions to positive facts (e.g., "the sensor’s circuitry remained open") or explain why causation *isn’t* purely physical.  
     *Pet Constraint?* Yes—reductive physicalists insist on this; normativists reject it as irrelevant to causal *attribution*.

  7. **Mind/Norm Independence**  
     *Case*: If all humans died, would a sensor’s failure still "cause" a robot collision?  
     *Requirement*: Must the theory require norms (duties, functions) or minds to "select" relevant absences?  
     *Honest Truth*: Yes—absences are intrinsically normative. DA absences are selected by duties/functions; FF aren’t. But this is *controversial*; process theorists avoid norms.

  ---

  ### **Conflicts and Tradeoffs**
  - **Fatal Conflict**: **Physics Compatibility (#6) vs. Double Prevention (#5)**.  
    Physics rejects negative events → Double prevention (e.g., "absence of an absence") lacks physical relata.  
    *Resolution*: **Drop physics compatibility (#6)**. Your system needs responsibility assignment, not fundamental ontology. Anchoring in duties (DA) avoids "free-floating" absurdities while satisfying #1–5.  
  - **Tense but Manageable**: **Norm-Dependency (#7) vs. Process Purity**.  
    Norms solve #1–4 elegantly but annoy reductionists. Since your system *requires* assigning responsibility (inherently normative), embrace #7.  

  **Theory-Killer Requirement**: **Physics Compatibility (#6)**. Eliminates all process/mechanical theories (e.g., conserved-quantity) and forces fictionalism or normativism.  

  **DA/FF Verdict**: A **DA-only theory survives all cases** if:  
  - Artifacts have "functions" (extending "duty" to design intent)  
  - Double prevention is framed as DA (e.g., "absence of the override" is DA if the override *should have been maintained*).  
  FF absences are excluded as non-causal (satisfying #1–2).  

  ---

  ### **Scorecard of Theories**
  1. **Counterfactual/Difference-Making** (e.g., Lewis)  
     - ✅: Handles redundancy (#3), double prevention (#5), and DA omissions via "norm-sensitive" worlds.  
     - ❌: Struggles with non-spurious dependence (#2)—needs norms to exclude neighbors.  
     - 🟡: Physics (#6) ignored; functional for attribution.

  2. **Process/Conserved-Quantity** (e.g., Salmon, Dowe)  
     - ✅: Physics-compatible (#6); intuitive for positive causation.  
     - ❌: Fails omissions entirely (no "process" for absences). Rejects #1–5.  
     - 🚫: Useless for your use case.

  3. **Normative/Fictionalist** (e.g., McGrath, Moore)  
     - ✅: Excels at #1–5 and #7. DA omissions are "causes" due to norm-violations; FF excluded.  
     - ❌: Rejects physics (#6)—causation is a "pragmatic fiction".  
     - 💡: Best fit for responsibility systems. Add counterfactuals for redundancy.

  ---

  ### **Recommendation**  
  Build on a **norm-sensitive counterfactual theory** using **DA absences**.  
  - Define "duties" broadly: agents (roles), artifacts (design specs), systems (protocols).  
  - Ignore physics compatibility (#6)—it’s a philosophical luxury.  
  - Use DA to filter absences: "Relevant omission = absence of an event that a duty/function required".  
  This satisfies all non-negotiable desiderata (#1–5) and aligns with attribution goals. Ship it.
