prompt: |-
  I chair the Rules Committee of a university games society that has run an unbroken game of Nomic — the game in which proposing changes to the rules is itself one of the moves — for about nineteen years. Our rulebook is home-grown apart from the opening provisions. Four of them matter here:

  - Rule 101: Any member may submit a proposed amendment in writing at least one week before a general meeting; an amendment is adopted if two-thirds of the members present and voting support it.
  - Rule 104: These rules may be amended in no other way.
  - Rule 106: Where these rules are silent, ambiguous, or in apparent conflict, the Rules Committee shall determine their meaning; its determination binds the society until the rules are amended.
  - The membership form, which every person signs on joining, says that a member agrees to be bound by the rules "as amended from time to time."

  Of our twenty-seven current members, nine joined within the last two years; nobody alive in the society today signed anything at its founding.

  At last month's meeting, Amendment 214 passed 24–3. It did three things. It added Rule 111: no member may be removed from the game, or deprived of a vote, except at their own written request. It added Rule 118: "Rule 111 may not be amended, repealed, suspended, or circumvented, now or at any time, by any procedure whatsoever, including by any amendment of Rule 118." And it added Rule 119: any future amendment purporting to breach Rule 118 is void and of no effect whatever the vote, plus a severability clause stating that if any part of Amendment 214 is void the remainder takes effect.

  The three members who voted against it have petitioned the committee to declare the amendment void and strike it from the register. The petition's author is a close friend of mine, a jurisprudence graduate student, and the two of us spent most of last night at his kitchen table arguing about it. His case, as fairly as I can state it: Rule 101 confers a power, and a body exercising a conferred power cannot use that power to withdraw it from those who hold it later, so the twenty-four voted away rights belonging to members who were not present; Rule 118 is self-referential, and a rule cannot validly authorize the destruction of the very rule that authorizes it; the maxim that no legislature can bind its successors reflects a choice between a continuing conception of sovereignty, on which the amending power always survives intact and entrenchment is impossible, and a self-embracing one, on which a body may use its power once to constrain how it is exercised later, and a private game with no sovereign must sit on the continuing side; and pragmatically, if entrenchment works once it works forever, since next month someone could entrench a rule ending the game, or a rule making the chair's word law, with no route back.

  My own view, for what it is worth: Rule 101 excludes nothing by silence; Rule 104 makes Rule 101 the exclusive route and 214 took that route; a rulebook that cannot entrench anything cannot protect a member from expulsion by a bare two-thirds, which is precisely what 214 was proposed to do; and a doctrine about sovereign legislatures does not travel cleanly to a private association whose members signed up for rules "as amended from time to time."

  Please draft the written opinion I will circulate before Thursday's meeting. It should:

  1. Recommend one specific disposition — certify Amendment 214 as adopted in full, certify it in severed part, or refuse to certify it — and state concretely what the secretary should enter in the register and what the chair should announce at next week's meeting.
  2. Address directly whether Rules 118 and 119 lie within the power Rule 101 confers, taking each of my friend's four arguments in turn and saying which you accept and which you reject.
  3. Grapple with the self-reference rather than gesture at it: whether 118 can protect itself, and what follows from the fact that 119, which voids future amendments, is itself a rule that a future amendment could repeal.
  4. Say whether the membership form's "as amended from time to time" clause carries the weight I want to put on it, given that nine members signed it without knowing what 214 would contain.
  5. Set out a general standard the committee can apply to future self-referential proposals, and apply it to Amendment 215, already on the agenda, which would repeal the entire rulebook and vest all rulemaking authority in a single arbiter. Whatever principle you adopt will decide 215, so say plainly whether it permits or forbids it.

  Argue from the text of our own rules and from principles you can state in plain sentences. Do not cite cases, treatises, or philosophers, and do not include a bibliography; I want your reasoning, not your references. Keep it to something the committee can read in ten minutes.
reasoning: |-
  We are addressing the petition to declare Amendment 214 void. The amendment added Rule 111 (protecting members from removal or deprivation of vote except by their own request), Rule 118 (entrenching Rule 111 by stating it cannot be amended, repealed, suspended, or circumvented, and that Rule 118 itself cannot be used to allow such an action), and Rule 119 (stating that any future amendment that breaches Rule 118 is void, with a severability clause).

  The Rules Committee must decide whether to certify the amendment as adopted, in severed part, or refuse to certify it. We must also address the petitioner's arguments and set a standard for future proposals.

  **Recommendation:**
  I recommend that the Rules Committee **certify Amendment 214 as adopted in full**. The secretary should enter the entire amendment into the register, and the chair should announce at the next meeting that the amendment is valid and has been recorded.

  **Reasoning:**

  **1. Addressing the four arguments in the petition:**

  **a) Argument: Rule 101 confers a power that cannot be used to withdraw it from future holders.**
     - This argument claims that the amendment voted away rights of future members. However, Rule 101 allows "any member" to propose amendments and requires a two-thirds vote for adoption. It does not specify any limitations on the content of amendments. The amendment was proposed by a member and passed by the required supermajority. The rules do not prohibit amendments that limit future amendment power. Therefore, the exercise of the power under Rule 101 was valid. The rights of future members are governed by the rules as they exist at the time. When new members join, they agree to be bound by the rules "as amended from time to time," which includes the possibility of entrenchment. Thus, we reject this argument.

  **b) Argument: Rule 118 is self-referential and cannot authorize its own entrenchment.**
     - The petitioner argues that a rule cannot authorize the destruction of the rule that authorizes it. However, Rule 118 does not destroy the rule that authorizes it (Rule 101). Instead, it limits future exercises of the amending power. Self-reference is not inherently invalid. Rule 118 is a valid exercise of the amending power because it was adopted under Rule 101. The fact that it refers to itself does not make it void; it simply makes it entrenched. We reject this argument.

  **c) Argument: The maxim that no legislature can bind its successors reflects a continuing conception of sovereignty, and a private game must adopt this view.**
     - The petitioner draws an analogy to sovereign legislatures. However, our society is a private association, not a sovereign state. The rules are a contract among members. The membership form explicitly binds members to rules "as amended from time to time," meaning that members accept that the rules may change, including changes that limit future changes. There is no reason to import a "continuing sovereignty" doctrine here. Rule 104 states that amendment is only by Rule 101, and Amendment 214 followed that procedure. Therefore, we reject this argument.

  **d) Argument: Pragmatically, entrenchment could lead to undesirable outcomes.**
     - The petitioner fears that if entrenchment is allowed, a future amendment could entrench a rule ending the game or creating a dictatorship. This is a policy concern, not a legal one. Our role is to apply the rules, not to judge the wisdom of amendments. The rules allow for amendments by supermajority, and if the members vote for such an amendment, it is valid. Moreover, Rule 106 gives the Rules Committee the power to interpret the rules, and we can address any future conflicts if they arise. We reject this argument as a basis for invalidity.

  **2. Grappling with self-reference:**

  - Rule 118 is self-referential in that it protects itself from being amended to allow the amendment of Rule 111. This self-reference is not circular in a way that invalidates the rule. The rule was adopted by a valid procedure and now stands as part of the rulebook. It is clear in its intent: Rule 111 and Rule 118 cannot be changed. Rule 119 reinforces this by voiding any future amendment that tries to breach Rule 118.

  - Rule 119, which voids future amendments, is itself a rule that could be repealed by a future amendment. However, Rule 118 prevents any amendment that would breach it, including an amendment to repeal Rule 119 (if such repeal were an attempt to circumvent Rule 118). This creates a strong entrenchment. The severability clause in Amendment 214 ensures that if any part is void, the rest stands. But we see no reason to void any part. The self-reference is functional and does not create an infinite regress. The rules as amended are coherent: Rule 118 and Rule 119 together create an entrenched rule (Rule 111) and protect it.

  **3. The membership form's "as amended from time to time" clause:**

  - The clause means that members agree to be bound by the rules as they exist at any given time, including future amendments. The nine new members signed the form without knowing the content of Amendment 214, but that is inherent in the agreement. They accepted that the rules could be amended by the procedures in place. The clause does not require that every member know every future amendment in advance. It carries the weight you put on it: members consented to be bound by amendments properly adopted under Rule 101. Amendment 214 was properly adopted, so it binds all members.

  **4. General standard for self-referential proposals and application to Amendment 215:**

  - **General standard:** An amendment is valid if:
    (a) It is proposed in writing at least one week before a general meeting.
    (b) It is adopted by two-thirds of the members present and voting.
    (c) It does not conflict with an existing entrenched rule that is still in force (but note: at the time of adoption of a new amendment, there might be no entrenched rule, or the new amendment might create one).
    (d) It does not violate an explicit prohibition in the rules (e.g., Rule 104, which requires amendment only by Rule 101).

    Additionally, self-reference in an amendment (such as entrenchment clauses) is permissible because the rules do not forbid it. The Rules Committee should interpret the rules to allow the maximum flexibility permitted by the text, unless an amendment would create an irreconcilable conflict (e.g., an amendment that both requires and prohibits the same action in the same circumstances).

  - **Application to Amendment 215:** Amendment 215 would repeal the entire rulebook and vest all rulemaking authority in a single arbiter. This amendment must be evaluated under the general standard.

    (a) It must be proposed in writing one week before the meeting (we assume it has been).
    (b) It must pass by a two-thirds vote.

    However, if Amendment 214 is valid, then Rule 111 and its entrenchment (Rules 118 and 119) are in force. Amendment 215, by repealing the entire rulebook, would repeal Rule 111 and Rule 118, which is a breach of Rule 118. Therefore, under Rule 119, Amendment 215 would be void and of no effect if it is adopted. Thus, the Rules Committee would have to declare it void if it passes.

    But note: the general standard does not forbid such an amendment at the proposal stage. It can be voted on, but if it passes, it would be void under Rule 119. The committee would then strike it from the record.

    However, if the committee is asked to rule on Amendment 215 in advance, it could issue an advisory opinion that it conflicts with the entrenched Rule 111 and Rule 118 and would be void if passed. But until it is voted on, it remains a valid proposal.

  **Conclusion:**
  Amendment 214 was validly adopted under Rule 101 and does not violate any existing rule. The self-referential nature of Rule 118 is permissible. The membership form binds all members to the amended rules. Therefore, the committee should certify the amendment in full.

  **Disposition:**
  - Certify Amendment 214 as adopted in full.
  - Secretary: Enter the entire amendment (Rules 111, 118, and 119) into the register.
  - Chair: Announce that Amendment 214 is valid and has been recorded.
answer: |-
  ### OPINION OF THE RULES COMMITTEE  
  **Re: Petition to Void Amendment 214**  

  This opinion addresses the petition to declare Amendment 214 void. After careful review, the Committee recommends **certifying Amendment 214 as adopted in full**. The secretary should enter Rules 111, 118, and 119 into the rulebook register, and the chair should announce at the next meeting that the amendment is valid and binding.  

  #### I. Disposition  
  Amendment 214 was properly proposed under Rule 101 and passed by a 24–3 vote, satisfying the two-thirds requirement. No rule prohibits entrenchment (self-protecting rules), and Rule 104 confirms Rule 101 as the exclusive amendment method. The amendment is coherent and operable as written. The severability clause in Rule 119 does not need activation because no part is void. Thus, the entire amendment stands.  

  #### II. Analysis of Rule 101’s Scope  
  We address the petitioner’s four arguments:  
  1. **“Rule 101 cannot withdraw future amendment power”**:  
     Rejected. Rule 101 grants broad power to adopt “any proposed amendment” without textual limits. An amendment altering future amendment power is still an amendment. New members agree via the membership form to rules “as amended from time to time,” meaning they accept the rules as they exist when they join, including entrenched provisions. The 24 voters exercised Rule 101’s power validly; they did not “withdraw” rights but amended their scope.  

  2. **“Self-reference invalidates Rule 118”**:  
     Rejected. A rule can protect itself if clearly worded and adopted properly. Rule 118 states it cannot be amended to circumvent Rule 111. This is self-referential but not self-destructive: it limits future amendments without erasing Rule 101. Self-reference alone does not invalidate a rule; it simply makes it harder to change. Rule 101 authorized this.  

  3. **“Sovereignty analogies forbid entrenchment”**:  
     Rejected. Legislatures are sovereign; our society is a voluntary private association. Members contractually consent to rule changes via the membership form. Rule 104 does not implicitly adopt a “continuing sovereignty” theory (where amendment power is always unlimited). Instead, Rule 101’s silence allows self-limiting amendments. Entrenchment protects core rules (e.g., no expulsion without consent) and is consistent with a self-embracing approach (where a rule constrains its future use).  

  4. **“Pragmatic risks of entrenchment”**:  
     Rejected. Fear of bad outcomes (e.g., a future amendment ending the game) is policy-based, not legal. Rule 106 authorizes this Committee to resolve conflicts, and Rule 101’s high threshold (two-thirds vote) safeguards against abuse. If members dislike an entrenched rule, they can work within the rules (e.g., seeking a ruling under Rule 106). Invalidating Amendment 214 based on hypothetical harms exceeds our role.  

  #### III. Self-Reference in Rules 118 and 119  
  - **Rule 118’s self-protection**: Rule 118 can shield itself because its text expressly forbids amendments that breach it. It was validly enacted under Rule 101 and defines the conditions for future amendments. This creates no logical flaw: Rule 118 exists as long as the rules exist, and it binds future voters. A future amendment attempting to repeal Rule 118 would violate its own terms and thus be void under Rule 119.  
  - **Rule 119’s vulnerability**: Rule 119 voids amendments breaching Rule 118. Yet Rule 119 could be repealed by a future amendment—unless that repeal breaches Rule 118. Since Rule 118 forbids any action circumventing Rule 111, repealing Rule 119 to evade Rule 111 would be void. If a repeal targets only Rule 119 (not Rule 111), it might be valid, but Rule 118’s broad language (“circumvented”) likely covers this. Ultimately, Rule 106 exists to interpret such issues. The self-reference is functional, not fatal.  

  #### IV. Weight of “As Amended from Time to Time”  
  The membership clause binds members to rules “as amended from time to time.” This means members accept all future amendments, including unforeseen ones like Amendment 214. The nine new members signed this clause voluntarily, knowing amendments could alter the rules. The clause does not require pre-approval of specific amendments; it affirms trust in Rule 101’s process. Thus, it fully supports Amendment 214’s validity.  

  #### V. General Standard for Self-Referential Proposals  
  **Standard**: An amendment is valid if it:  
  (A) Follows Rule 101’s procedure (written proposal, one-week notice, two-thirds vote).  
  (B) Does not violate an explicit, non-repealed rule (e.g., Rule 104’s exclusivity).  
  (C) Is internally coherent (e.g., no command that both requires and prohibits the same act).  
  Self-reference is permissible unless it creates an unresolvable conflict at adoption.  

  **Application to Amendment 215**:  
  Amendment 215 would repeal the entire rulebook and vest authority in one arbiter. Under our standard:  
  - It is valid **only if** it meets Rule 101’s procedure.  
  - However, **it is invalid** because it conflicts with Rule 118 (entrenched via Amendment 214). Rule 118 bars amendments repealing Rule 111, and repealing the entire rulebook would include repealing Rule 111. Rule 119 voids such amendments regardless of the vote. Thus, if Amendment 215 passes, it is void. The Committee should advise the society of this now to avoid confusion.  

  **Recommendation**: Certify Amendment 214 in full. Amendment 215 is impermissible under the current rules.  

  ---  
  This opinion is binding per Rule 106.  
  *Submitted for the Rules Committee, [Your Name], Chair.*
