  Hmm, the request is very specific: an island harbour town with entrenched channel rules, a founding myth about a vote, an archival discovery revealing the myth is false (but not debunked publicly), and a failed attempt to change the rules due to coordination problems. Needs a mechanical (not tragic) failure, a contrasting non-convention, and an open ending about the "first convention" paradox. British English, no jargon, 1.5-2k words.  

