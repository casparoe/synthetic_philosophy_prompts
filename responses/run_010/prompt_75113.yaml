  Tricky bit: Keeping the vote myth alive despite evidence. Mrs. Trengrouse will share findings only with Ned, who dismisses it because "knowing how it started doesn’t change how it works now." That preserves the myth for townsfolk.  

  For the mechanical failure: Show a skipper seeing the notice but hesitating because he doubts others saw it. Arlo's attempt should feel futile—like being a single car at a green light when others are stopped.  

