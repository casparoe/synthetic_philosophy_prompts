  For animal knowledge, the user needs to see which versions of "plus something" would automatically exclude animals. If it's justification requiring rationality, that excludes; if it's reliable process, maybe not. Their friend seems to think any "plus" definition settles it, which is sloppy.

  *starts organizing* I'll break down the "plus" candidates: justification/account (Plato's own), warrant (Plantinga), externalist features, meta-belief, non-propositional elements... each gets a quick assessment. 

