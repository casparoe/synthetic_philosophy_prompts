prompt: |-
  I write about science and ideas for a general-interest magazine, and once a year I also mark the take-homes for a science-writing MA module on evolution — I'm the "real world" marker, not the biologist, which is normally fine but has landed me in a spot this term. One answer I have read three times and I still cant tell whether it's strong work with a couple of rough edges or whether there's a load-bearing crack running through the middle that I'm sailing right past. I don't want to guess, and I don't want to grade it up just because it reads confidently.

  The assignment I set was:

  "A magazine essay argues that the units-of-selection debate was settled in the 1970s. Genes are the only things that get copied; bodies are throwaway containers that carry them; therefore any talk of group selection, or of the individual organism as a unit of selection, is at best a loose way of talking about genes. Assess this argument. Say explicitly whether 'unit of selection', 'replicator' and 'vehicle' pick out the same thing, and whether recent multilevel-selection modelling reopens the debate. 800 words max."

  Here's the answer, verbatim apart from a few spelling fixes:

  ---

  The essay is half right, and the half it gets right is the half it doesn't actually need.

  Start with what's solid. Genes get copied; bodies don't. An organism is a one-off combination assembled out of two other combinations, and it gets taken apart at meiosis before it can pass the whole thing on, so nothing at the level of the body persists across generations in the sense that matters. A gene, by contrast, can sit in an unbroken line of copies for millions of years. That asymmetry is real, and it's why Dawkins split the replicator — the thing that gets copied — from the vehicle, or as he later renamed it, the interactor: the thing whose properties decide which copies get made.

  It's also fair to say the old good-of-the-species stories were bad biology. A population of birds that lays fewer eggs for the sake of the branch isn't stable, because a single mutant who lays more takes the whole branch, and then the next, and the restraint disappears. Whatever you call that, it isn't an explanation.

  But the essay's conclusion doesn't come out of those premises. Selection, in the ordinary sense of some things surviving and reproducing more than others, happens to vehicles. It's the deer that gets eaten, not the deer's alleles. What flows down the generations is gene-level; what gets filtered along the way is body-level. So the claim that only genes are units of selection quietly does two different jobs with one word. If the essay were right, the replicator/vehicle distinction would have no content at all — you'd only ever need one of the two terms.

  The same swap infects the standard recipe for selection: variation, heritability, differential success. Nothing in that list mentions a level, which is why you can apply it to genes, to cells inside a body, to organisms, and in principle to groups without changing a word. Groups usually fail the heritability clause, since a herd doesn't bud off daughter herds that resemble it. But usually isn't never.

  Which brings me to the multilevel modelling, and here the essay is simply out of date. There are two kinds of case, MLS1 and MLS2, and the difference between them is bookkeeping rather than biology. In both, what matters is whether the between-group part of the variance does more work than the within-group part; whether the groups themselves happen to reproduce is a choice the modeller makes when she writes the equations down. So any trait that spreads because of what happens between groups counts as group selection, and the essay's insistence that only genes count is just an unfashionable way of describing the same arithmetic.

  The clincher is that kin selection and group selection turn out to be intertranslatable — you can rewrite either as the other inside the same models. When two descriptions convert into each other at will, the choice between them isn't a matter of fact. There's no answer to which level selection really acts at, only a choice of notation.

  So: the essay is wrong that the debate was settled, and right that the cumulative record of evolution is written in genes. Both of those can be true.

  ---

  Our rubric is 1–5: 5 = would survive a hostile biologist at a dinner party; 4 = right conclusions, distinctions handled properly, one real slip; 3 = mostly there but something load-bearing is wrong or doesn't follow; 2 = arrives at a defensible verdict by accident; 1 = the framing itself is broken. These are smart journalists, not biologists, so honest simplification is fine — confusion isn't.

  Give me the grade in your very first sentence, with a clause saying what decided it, then work through the answer in order: for each claim, quote the phrase that's doing the work and sort it as right / acceptable simplification at this level / right but for a bad reason / actually wrong or non-sequitur. I'll mention that the two paragraphs on multilevel modelling are the ones I have least grip on, but don't let that steer you — the crack could be anywhere, including in the passage that reads best, and I'd rather you tell me the whole thing is fine than manufacture a problem. Finish with two or three sentences I can paste straight into the feedback box. No preamble, no restating my question back at me, and no bibliography — I'm not sending a reporter off to the library.
reasoning: |-
  Okay, let me tackle this step by step. The user is a science writer grading MA essays on evolution, specifically about the units-of-selection debate. They're stuck on one submission that seems polished but might have foundational flaws. 

  First, I need to evaluate the student's argument against core concepts: replicator vs vehicle, multilevel selection (MLS), and whether the essay's claims hold. The student makes several key points:
  - Correctly identifies genes as replicators and organisms as vehicles
  - Rightly dismisses naive group selection ("good-of-the-species")
  - But then claims group selection is valid via MLS models
  - Concludes the debate isn't settled because kin/group selection are "intertranslatable"

  The alarm bells ring in the MLS section. The student says MLS1/MLS2 differ only in "bookkeeping" and that group reproduction isn't biologically necessary. This misrepresents Damuth & Heisler's framework where MLS1 requires group-level heritability. Calling group selection valid whenever "between-group variance does work" oversimplifies - it ignores that selection requires heritable units. 

  The "intertranslatable" argument is also shaky. While kin and group models can be mathematically equivalent sometimes, that doesn't mean levels are arbitrary. The student implies choosing levels is like choosing coordinate systems in physics, but biological hierarchies (genes, cells, organisms) are real causal structures, not just perspectives.

  The user's rubric hinges on whether errors are "load-bearing." Here, the MLS misunderstanding undermines the whole conclusion. The student says the debate isn't settled because levels are subjective, but that's not what biologists think - MLS requires specific conditions to be valid, not just modeling choices.

  Final call: This is a 3 ("mostly there but something load-bearing is wrong"). The student gets basics right but the core argument about levels collapses under scrutiny. Feedback should flag the MLS oversimplification and the flawed "intertranslatable" leap.
answer: |-
  **Grade: 3** - Mostly there but the misrepresentation of multilevel selection modelling is a load-bearing flaw.

  1.  **"Genes get copied; bodies don't... That asymmetry is real... Dawkins split the replicator... from the vehicle... the interactor."** - **Right.** Correctly identifies the core replicator/vehicle distinction and its basis.
  2.  **"the old good-of-the-species stories were bad biology... isn't stable... restraint disappears."** - **Right.** Accurate critique of naive group selection.
  3.  **"Selection... happens to vehicles... What flows down the generations is gene-level; what gets filtered along the way is body-level."** - **Acceptable simplification.** Captures the key interaction between levels in standard individual selection.
  4.  **"the claim that only genes are units of selection quietly does two different jobs with one word... the replicator/vehicle distinction would have no content... only ever need one of the two terms."** - **Right.** Good point about the essay conflating the *unit of replication* with the *unit that is selected*.
  5.  **"variation, heritability, differential success... Nothing in that list mentions a level... apply it to genes, to cells... organisms, and in principle to groups... Groups usually fail the heritability clause... But usually isn't never."** - **Right.** Correctly identifies the logical structure of selection theory and the potential (though often problematic) application to groups.
  6.  **"the essay is simply out of date... MLS1 and MLS2... the difference between them is bookkeeping rather than biology... whether the groups themselves happen to reproduce is a choice the modeller makes... whether the between-group part of the variance does more work... any trait that spreads because of what happens between groups counts as group selection... the essay's insistence that only genes count is just an unfashionable way of describing the same arithmetic."** - **Actually wrong or non-sequitur.** This fundamentally misrepresents MLS. MLS1 *requires* group-level heritability (groups reproducing/projecting properties) and measures individual fitness within groups. MLS2 *requires* group reproduction and measures group fitness. The distinction is biological, not just bookkeeping. Claiming group selection applies whenever between-group variance does "more work" ignores the critical requirement of heritability at the group level. The "choice" is constrained by the biological reality of whether groups *are* reproducing units. Calling gene-centric and group-selectionist views "unfashionable ways of describing the same arithmetic" oversimplifies genuine biological differences in how selection acts.
  7.  **"kin selection and group selection turn out to be intertranslatable... the choice between them isn't a matter of fact... There's no answer to which level selection really acts at, only a choice of notation."** - **Right but for a bad reason.** While mathematical equivalence exists *in many models*, the student uses this to support their flawed point #6. The equivalence shows formal connections, but it doesn't make the *biological level* of selection (individual vs. group) merely a "choice of notation" in reality. The *biological mechanisms* (e.g., direct group extinction vs. kin recognition) matter, even if the math can be transformed.
  8.  **"the essay is wrong that the debate was settled, and right that the cumulative record of evolution is written in genes. Both of those can be true."** - **Acceptable simplification (Conclusion).** The conclusion is defensible, but partially rests on the flawed argument in point #6.

  **Feedback for Student:**

  > **Strengths:** You clearly grasp the replicator/vehicle distinction and effectively critique naive group selection and the essay's conflation of terms. You correctly note the logical structure of selection applies potentially to multiple levels.  
  > **Key Weakness:** Your description of multilevel selection (MLS) is significantly flawed. MLS1 *requires* group-level heritability (groups projecting properties/reproducing), and MLS2 *requires* group reproduction; this is a biological distinction, not just "bookkeeping." Claiming group selection applies whenever between-group variance "does more work" ignores the critical requirement of heritability at the group level. While kin and group selection models are often mathematically translatable, this doesn't mean the *biological level* of selection (e.g., group extinction vs. individual kin interactions) is merely a "choice of notation." The debate is nuanced, not settled by dismissing levels as arbitrary.  
  > **Overall:** Solid understanding of core concepts undermined by a crucial misstep in interpreting modern MLS theory.
