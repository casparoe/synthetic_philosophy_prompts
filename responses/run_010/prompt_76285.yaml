prompt: |-
  I write a fortnightly column on science and ideas for a British broadsheet, and I am currently reporting a piece on the strange architecture by which civil aviation regulators decide that a pilot has stopped being a pilot. Once you look at it closely, the system sorts a person's capacities into at least three classes with wildly different shelf lives. In the United States, a pilot's certificate does not expire at all: it is held for life, and the written examinations on air law, meteorology, navigation and aircraft systems on which it rests are never sat again once the licence has been issued. European rules differ in detail but not in kind. What does expire is everything else. An instrument qualification lapses unless the holder has flown a specified number of approaches, holding procedures and tracking exercises within the preceding six months. To carry passengers at all, a pilot must have made three take-offs and three landings in the same category and class of aircraft within the preceding ninety days. And the type rating — the endorsement for a particular airframe — is revalidated by a proficiency check, usually in a full-flight simulator and usually every six to twelve months, in which an examiner scores the pilot against published tolerances: altitude held within a hundred feet, heading within ten degrees, and so forth. Alongside all of this sits the medical, which lapses every six or twelve months depending on the holder's age.

  The detail that started me off is a proposal I have been shown by a national authority, which I will not name because it has not yet gone to consultation, under which a pilot returning after a long absence could regain the type rating by passing a demanding computer-based assessment of procedures and systems knowledge, supplemented by a fixed number of hours in a part-task trainer, rather than by a simulator check with an examiner. The pilots' association objected, but not on the grounds anyone expected. Their argument was not that the evidence base was thin, nor that the trainer was a poor proxy for the aircraft. It was that the scheme confuses two different things: a pilot who has been away has not lost the knowledge and could pass any written paper you set him tomorrow, whereas what he has lost is something no written paper could either detect or restore. The airline's head of safety, in reply, told me this sounded like mysticism dressed as expertise — that if the man can state correctly what the aircraft will do in each configuration and can execute the procedures on a screen, then whatever else the union believes is missing is not a matter of competence at all, and certainly not one a regulator should be codifying.

  So I would like the implicit theory of the practice reconstructed, rather than the dispute settled on safety grounds. Does the bifurcation — a knowledge test that never expires, a performance test that expires constantly — only make sense against a view on which knowing how to fly is a genuinely distinct kind of state from knowing that such-and-such, or could a regulator who held that all knowledge is propositional, including knowledge of how to do things, run precisely the same schedule, treating the recurrent check merely as a cost-effective way of sampling a disposition that happens to decay? I want to be told where the practice is philosophically underdetermined, which rival accounts it rules out rather than merely sits awkwardly beside, and what the checklist-and-tolerances method of examining skill commits the regulator to about whether competence is an inner state or an observable performance. Then tell me what would actually have to change — the examinations, the intervals, the wording printed on the licence — if the authority adopted the safety manager's position and treated knowing how as a species of knowing that; and say whether the union's objection survives that adoption or is exposed as incoherent by it. Finally, since my editor will ask: does the expiring medical complicate the picture, or does the body sit outside it altogether?
reasoning: |-
  Okay, let me approach this query methodically. The science columnist presents a fascinating case study in aviation regulation epistemology, centered on the distinction between theoretical knowledge and practical skill in pilot certification. The core question revolves around whether the bifurcated licensing system - perpetual knowledge certification versus expiring performance checks - necessarily implies a philosophical commitment to distinct types of knowledge.

  First, I need to unpack the implicit assumptions in current practice. The permanent retention of written exam results suggests regulators view declarative knowledge as stable once acquired. In contrast, the frequent revalidation requirements for instrument qualifications, takeoff/landing counts, and simulator checks treat skills as perishable. This structure appears to align with Ryle's knowing-that/knowing-how distinction, where procedural knowledge decays without practice.

  The columnist's specific challenge is fascinating: could a regulator who believes all knowledge is propositional maintain the same system? Here I consider dispositional theories - perhaps recurrent checks merely sample decaying behavioral dispositions rooted in retained propositional knowledge. But this seems strained when applied to time-sensitive maneuvers like engine failures during takeoff. The embodied nature of flying suggests something beyond propositions is involved.

  Regarding competence ontology, the checklist-and-tolerances approach clearly prioritizes observable performance over inner states. This operationalizes competence as successful action rather than mental representation. If regulators adopted the safety manager's strict propositional view, they'd need to eliminate recurrent simulator checks entirely, replacing them with knowledge tests - a position the union rightly rejects as inadequate.

  The medical certificate presents an interesting parallel case. Its expiration schedule acknowledges biological factors affecting performance capacity, but treats them as separate from knowledge/skill decay. This suggests regulators implicitly categorize pilot capability into three distinct domains: theoretical knowledge (stable), practical skills (practice-dependent), and physiological fitness (age-dependent).

  The union's objection holds philosophical weight regardless of the safety manager's position. Even if "knowing how" were reduced to propositional knowledge, the decay of time-sensitive motor skills and decision-making heuristics under pressure remains empirically observable and practically significant. Their argument isn't mystical but grounded in aviation psychology literature on skill retention.
answer: |-
  The architecture you describe reveals a sophisticated, though philosophically layered, approach to competence assessment—one implicitly grounded in a hybrid theory of human capability. Let's reconstruct its foundations, test rival accounts, and explore the consequences of adopting the safety manager's propositional reductionism.

  ### The Implicit Philosophy of Current Practice
  1.  **The Knowledge/Performance Bifurcation & Its Commitments:**
      *   **Enduring "Knowing-That":** The lifetime validity of theoretical knowledge (air law, systems, navigation) assumes:
          *   Declarative knowledge, once deeply encoded, is relatively stable (barring neurological impairment).
          *   It can be reliably assessed via written exams and isn't *inherently* dependent on constant physical practice.
          *   Updates occur through mandatory recurrent training (not re-examination), implying regulators trust systemic updates over individual decay for this domain.
      *   **Perishable "Knowing-How":** The expiring qualifications (instrument currency, takeoffs/landings, type ratings) assume:
          *   Procedural knowledge and sensorimotor skills *degrade* with disuse.
          *   Competence requires not just knowing *what* to do, but *doing* it reliably under operational constraints (time pressure, stress, environmental factors).
          *   Competence is **performance-dependent and contextually embedded**. Knowing the procedure for an engine failure isn't sufficient; reliably executing it within altitude/heading tolerances in a simulated (or real) high-stakes scenario is the benchmark.
      *   **Philosophical Anchor:** This structure aligns strongly with Gilbert Ryle's critique of the "intellectualist legend." It treats "knowing-how" (skillful performance) as conceptually and practically distinct from "knowing-that" (propositional knowledge). A pilot could ace a systems test (knowing-that) yet fail to smoothly manage a complex failure sequence in the sim (knowing-how). The system codifies this distinction.

  2.  **Competence as Observable Performance, Not Inner State:**
      The checklist-and-tolerances method is fundamentally **behaviorist/operationalist**. The regulator commits to:
      *   Competence is defined *solely* by meeting observable, measurable performance criteria under defined test conditions.
      *   The "inner state" (neural pathways, muscle memory, cognitive heuristics) is irrelevant *unless* it manifests in the required performance. A pilot could have "perfect" internal models, but if they consistently exceed tolerances, they fail.
      *   This rejects Cartesian dualism applied to skill: competence isn't a ghostly mental substance; it *is* the successful action.

  3.  **What the Practice Rules Out (or Sits Awkwardly With):**
      *   **Strong Intellectualism (Safety Manager's View):** The current system *incompatibly* contradicts the idea that "knowing-how is just knowing-that." If it were, lifetime theoretical knowledge plus periodic *knowledge* tests should suffice for *all* qualifications. The *need* for recurrent *performance* checks (simulator, landings) is evidence the regulator implicitly rejects this reduction.
      *   **Pure Dispositionalism (Decaying Propositional Knowledge):** Could a regulator viewing all knowledge as propositional run the *same* schedule, treating sim checks as sampling decaying dispositions? Only superficially. The *nature* of the test matters. A knowledge test (written/CBT) probes declarative recall. A sim check probes embodied skill execution under pressure. Running a sim check while believing it's *only* testing decaying propositional dispositions is incoherent – the test format contradicts the ontology. Why not just retest the propositions?
      *   **Mystical Inner States (Union Caricature):** The system also rules out truly ineffable, unobservable "essences" of piloting. Competence *must* be demonstrable against standards. The union's point isn't mysticism; it's about the *type* of capacity lost (procedural/motor/situational skill), which *is* observable (via failed sim checks), but *not* detectable via a knowledge test.

  ### Adopting the Safety Manager's Propositionalism: Consequences
  If the regulator fully embraced "all knowledge is propositional, including know-how":
  1.  **Required Changes:**
      *   **Examinations:** Recurrent simulator checks and takeoff/landing currency requirements become philosophically unjustifiable. They would be replaced entirely by demanding, scenario-based CBT exams probing "propositional knowledge about actions" (e.g., "Describe the exact steps for an engine failure at V1," "State the pitch attitude for best glide").
      *   **Intervals:** Intervals would be based purely on estimated decay rates for declarative knowledge (potentially longer than current skill intervals, or requiring more frequent CBT testing if decay is assumed fast).
      *   **Licence Wording:** Distinctions between "Type Rating" (skills), "Instrument Rating" (skills), and "Theoretical Knowledge" would collapse. The licence would list only "Knowledge Endorsements" for aircraft types, instruments, etc., validated by CBT.
      *   **The "Returning Pilot" Proposal:** It would become the *only* logical path – a CBT test plus part-task trainer (probing knowledge of procedures, not full performance) would suffice for full revalidation. The simulator check becomes redundant.

  2.  **The Union's Objection:**
      *   **Does it survive?** **Yes, and is vindicated, not exposed.** Adopting propositionalism wouldn't magically make the lost skill (decayed motor programs, degraded situational awareness under stress, slowed decision heuristics) reappear. Pilots returning after long absence *would* likely pass a sophisticated CBT (demonstrating retained "knowing-that") but could catastrophically fail the *actual performance* demands of the aircraft (the "knowing-how" that decayed). The union identifies a real, empirically demonstrable category of loss that propositionalism ignores. The safety manager's dismissal *is* the incoherent position here – it mistakes the map (propositions about flying) for the territory (flying itself).

  ### The Medical Certificate: A Separate but Parallel Axis
  The expiring medical sits *alongside* the knowledge/skill framework, addressing a fundamentally different domain:
  1.  **The Body "Outside":** It concerns **capacity**, not knowledge or skill. A pilot could retain perfect knowledge (knowing-that) and razor-sharp skills (knowing-how) but be rendered unsafe by a heart condition, untreated depression, or deteriorating eyesight. The medical assesses the biological platform *upon which* knowledge and skill operate.
  2.  **Philosophical Distinction:** It reflects a commitment to **embodied cognition** and **biological realism**. Competence isn't just mental; it requires a functioning physical system. A paralysed concert pianist retains the "knowing-how" but lacks the capacity to perform. The medical expiry acknowledges that biological fitness can change, unlike (in the regulator's view) core theoretical knowledge, and decays predictably with age, unlike skills which decay primarily with disuse.
  3.  **Complicating the Picture?** It adds a necessary third dimension (Biological Capacity) to the model (Theoretical Knowledge / Practical Skill), but doesn't conflate with them. It reinforces the overall philosophy: air safety requires validating *multiple, distinct* aspects of human capability, each with its own dynamics of acquisition, maintenance, and decay.

  **In Conclusion:** The current system is philosophically *over*determined in favour of a Rylean distinction between knowing-that and knowing-how, coupled with a behaviourist definition of competence as observable performance. Adopting the safety manager's strict propositionalism would necessitate dismantling the performance-based recurrent checks, replacing them with knowledge tests—a change the union correctly identifies as dangerous, because it ignores the empirical reality of skill decay. The medical certificate, while separate, underscores the system's holistic view by adding the critical dimension of biological capacity. The "strange architecture" isn't arbitrary; it's a pragmatic, philosophically coherent (though perhaps not explicitly articulated) response to the multifaceted nature of human expertise and its vulnerabilities. The union's objection isn't mysticism; it's a defense of the system's deeper wisdom against a reductive oversimplification.
