prompt: |-
  I cover statistics and research methodology for a general-interest science desk, and after several years of reporting on the replication controversies I keep running into a pattern I have no name for. I would like to know whether the methodological literature has one, and if it does not, what the pattern ought to be called.

  Stated plainly: a study establishes something rigorously, and the rigor is then spent in support of a claim the study never established — not because anyone misreports the numbers, but because the quality of the measurement is treated as though it transferred to the reach of the interpretation.

  Two instances, both simplified from reporting I have done. First: a large, preregistered, multi-site study finds that scores on a questionnaire administered in a laboratory predict small variations in behavior on a second laboratory task. The finding survives every robustness check anyone has thrown at it. In the argument that follows — about hiring, about policing, about classroom policy — the study is cited with its sample size and its registration front and center, as evidence for how a trait operates outside the laboratory. The trait was never measured outside the laboratory. When I raise that, the reply is a restatement of the design's quality: the sample was enormous, the analysis plan was posted before the data were seen, everything is public.

  Second: an economics team runs an unusually well-controlled trial of a training program and produces a very tight estimate of its effect on a standardized exam. The tightness is real and earned. Within a year that estimate is being quoted — by partisans on every side, and by the team's own press office — as the effect of training on earnings, and the question of whether an exam score is the right quantity to be estimating gets answered by re-describing how carefully the trial was run.

  In both cases the researchers were, to my knowledge, scrupulous: the limits were flagged in the discussion section, and in interviews some of them objected to the uses their work was being put to. The pattern did not require their cooperation. The credential travelled; the caveat did not.

  There is a second feature I want kept in view. The response to an objection about scope is invariably a rejoinder about quality. Nobody disputes the objection's premise. The subject simply never changes to the scope question, and because everything said about quality is true, the exchange leaves the impression that the criticism has been met.

  I know the obvious neighbors, and I do not think any of them is it. Construct validity concerns the gap between an operationalization and the construct theorized; external validity concerns the gap between the study setting and the world; statistical versus practical significance concerns the mistake of treating a precisely estimated small effect as an important one. Each of those names a standing property of a study. What I keep meeting is transactional: rigor demonstrated about one quantity being converted, in public, into warrant for a different one, with the conversion never stated and the objection to it answered by pointing back at the rigor.

  So, four questions. (a) What are the nearest established concepts, and for each, precisely how does the pattern I have described depart from it? (b) Which of them, if any, is its proper home? (c) Is the second feature — quality rejoinders to scope objections — a distinct phenomenon with a label of its own, a case of some old fallacy, or just the surface of the first? (d) Where are the edges? I want at least three cases you would exclude, and I want to know whether the pattern can occur without the defensive move, or whether the defensive move is what makes it what it is. If no established term fits, coin one, define it so that it cannot collapse back into the neighbors above, and say what you would count as a borderline instance.

  Please do not guess at sources, references, or authors' names; I am not asking for a bibliography and I will chase the literature myself once I know what to look for. What I want is the carving rather than the label — a precise account of what this thing is and is not, of which I would rather have too much than a confident name.

  Finish with the label on its own line, in the form \answer{...}, containing either the established term you judge the best fit or the term you propose.
reasoning: |-
  Okay, the user is a science journalist covering statistics and methodology, particularly the replication crisis. They've observed a specific pattern where rigorous studies are cited beyond their actual scope—using the study's methodological rigor as justification for broader claims that weren't actually tested. They want to know if there's an established term for this or if one should be coined.

  First, I need to understand the core issue: it's about the transfer of credibility from a well-measured variable to a different, broader interpretation. The user provided two examples: one where a lab-measured trait is applied to real-world behavior, and another where exam scores are conflated with earnings. The key elements are the rigor of the measurement (large sample, preregistration) being used to support claims about a different construct, and when challenged, defenders pivot to discussing the study's quality instead of addressing scope limitations.

  The user mentions they're familiar with related concepts like construct validity, external validity, and statistical vs. practical significance, but these don't fully capture the transactional nature of this phenomenon. They specifically want to avoid misattribution of numbers and focus on the misuse of methodological credibility.

  Breaking down the questions:
  (a) Nearest concepts and how this departs:
  - **Construct validity**: Focuses on whether the operationalization measures the intended construct. But here, the issue is the *transfer* of credibility to a different construct, not questioning the original measure itself.
  - **External validity**: Concerns generalizability of findings to other settings. However, the pattern here involves substituting a different variable (e.g., exam scores for earnings) rather than just settings.
  - **Statistical vs. practical significance**: About interpreting effect sizes, not about swapping constructs.

  This pattern differs because it's transactional—the rigor is leveraged post-hoc to defend broader claims, and the defense mechanism (redirection to quality) is integral.

  (b) Proper home: None fit perfectly. Construct validity comes closest but doesn't cover the rhetorical pivot.

  (c) The defensive move: When critics raise scope issues, proponents respond by restating the study's quality. This seems like a **red herring fallacy** (diverting from the actual issue) or **credentialing** (using rigor as armor). It's not distinct but central to the phenomenon—it operationalizes the credibility transfer.

  (d) Edges: Cases to exclude:
  1. **HARKing (Hypothesizing After Results Known)**: Here, researchers are transparent; misuse happens downstream.
  2. **P-hacking/data dredging**: The original analysis is rigorous; the problem is interpretation.
  3. **Simple overgeneralization**: Without the quality-based defense, it's just routine overreach, not this specific pattern.

  The defensive move is essential—it transforms overgeneralization into this credibility-transfer phenomenon.

  Proposed term: **Credential Transfer Fallacy** or **Rigor Laundering**. The former emphasizes the core mechanism: methodological credentials being misapplied to unrelated claims. The definition must specify that the rigor is valid for the measured variable but improperly extended to a different construct, with the defensive pivot as a key feature.

  Borderline case: A study measuring "cognitive reflection" with lab tasks is cited for "real-world decision-making" without the defensive pivot—this would be simple overgeneralization, not the full pattern unless met with quality-based rebuttals.
answer: |-
  ### Analysis of the Pattern

  The pattern you describe involves a two-step epistemic maneuver: (1) **methodological rigor** (e.g., large sample, preregistration, tight controls) validly establishes a finding for a specific operationalized variable (e.g., lab behavior, exam scores), and (2) this rigor is implicitly or explicitly transferred to warrant a broader, distinct claim (e.g., real-world behavior, earnings) that was not directly measured. Crucially, when challenged on scope misalignment, critics are met with defenses reiterating the study's technical quality—effectively redirecting attention from the scope objection without engaging it. This is transactional, leveraging the credibility of the methodology to "cover" the inferential leap.

  #### (a) Nearest Established Concepts and Departures
  1. **Construct Validity**:  
     - *Concept*: Concerns whether an operationalization (e.g., a questionnaire) adequately measures the theoretical construct it claims to represent.  
     - *Departure*: Your pattern is not about the *adequacy of the original measure* but about the *post hoc transfer of credibility* to a different construct. For example, the lab-measured trait may have high construct validity, but the rigor is then misapplied to an unrelated construct (e.g., "real-world trait operation"). Construct validity critiques focus on measurement alignment; yours focuses on misattribution of methodological prestige.  

  2. **External Validity**:  
     - *Concept*: Addresses whether findings generalize across populations, settings, or times.  
     - *Departure*: Your pattern is not merely about generalizability but about *substituting one variable for another* (e.g., exam scores → earnings). External validity assumes the outcome variable is fixed; here, the outcome is replaced or conflated. The defensive pivot to quality (e.g., "but our sample was large!") ignores external validity concerns entirely.  

  3. **Statistical vs. Practical Significance**:  
     - *Concept*: Distinguishes precise estimation of an effect from its real-world importance.  
     - *Departure*: Your pattern involves a *conceptual substitution* (e.g., behavior on Task A → behavior in society), not a confusion about effect size magnitude. Practical significance critiques question whether an effect matters; your pattern questions whether the effect is relevant to the new claim.  

  4. **HARKing (Hypothesizing After the Results are Known)**:  
     - *Concept*: Involves presenting post hoc findings as a priori hypotheses.  
     - *Departure*: Your pattern does not require misrepresentation of hypotheses. The original study is often rigorous and transparent, but its credibility is co-opted downstream for unrelated claims.  

  **Summary of Departures**: The pattern is distinct due to its transactional nature—rigor "earned" for Variable A is rhetorically "spent" on Variable B, with the defensive rejoinder (rehashing quality) acting as a smokescreen. It exploits the social credibility of methods like preregistration or large samples to immunize against scope critiques.

  #### (b) Proper Home Among Established Concepts  
  No established term fully captures this phenomenon. **Construct validity** is the closest framework because it deals with gaps between operationalization and interpretation, but it does not address the *rhetorical transfer of methodological credibility* or the *defensive pivot*. The pattern is better seen as a **meta-validity failure**—a misuse of the validation process itself—rather than a flaw in the study's design. If forced to categorize, it belongs under "construct proliferation" or "construct extrapolation," but these lack emphasis on the transactional defense mechanism.

  #### (c) The Defensive Move: Distinct or Integral?  
  The quality rejoinder is **not a distinct phenomenon** but the operational core of the pattern. It functions as a **red herring fallacy** (diverting to irrelevant but true facts) combined with **credentialing** (using methodological rigor as rhetorical armor). This move:  
  - Prevents engagement with scope by weaponizing the study's technical strength.  
  - Exploits the cultural cachet of "rigor" (e.g., preregistration, large N) in science reform movements.  
  Without this defensive pivot, the pattern reduces to routine overgeneralization—common but not uniquely problematic. The pivot transforms it into a self-sustaining epistemic bypass.

  #### (d) Edges and Borderlines  
  **Cases to Exclude**:  
  1. **Direct misreporting**: If a study's numbers are misrepresented (e.g., "the paper said it was significant for earnings"), it is fraud or misinformation, not this pattern.  
  2. **Poor construct validity**: If the original measure lacks credibility (e.g., a flawed questionnaire), criticism targets the study itself, not downstream inference transfer.  
  3. **Uncontested overreach**: If proponents concede scope limits when challenged (e.g., "we agree this doesn't apply to earnings"), it lacks the defensive pivot and becomes ordinary scientific debate.  

  **Can the pattern occur without the defensive move?**  
  No. Without the rejoinder (repeating quality metrics to deflect scope objections), this is merely **overgeneralization**—a common error but not systemic. The defensive move is what makes it a distinct pattern: it uses rigor as currency to "purchase" unwarranted inferential distance.  

  **Borderline Instance**:  
  A study uses fMRI to precisely measure neural activity during a decision-task in a controlled lab. Critics note this does not imply real-world choices. Proponents respond, "But we used double-blind procedures and 3T MRI!" This is borderline if the neural activity is *related* to decision-making but not interchangeable with it. The defense invokes quality to bridge the gap without evidence.

  ### Proposed Term  
  Since no established term fits, I coin **rigor laundering**:  
  - **Definition**: The rhetorical practice of using demonstrated methodological rigor (e.g., large samples, preregistration, robustness checks) from a study of Variable A to lend unwarranted credibility to a claim about Variable B, where B is conceptually distinct from A. Critiques of scope misalignment are deflected by restating the study's technical quality, creating the illusion of addressed objections.  
  - **Anti-Collapse Clause**: Unlike construct validity, it focuses on *post hoc misappropriation* of credibility, not measurement alignment. Unlike external validity, it involves *variable substitution* (A→B), not setting generalization. Unlike statistical significance, it ignores effect size relevance. The defensive pivot is necessary.  

  \answer{rigor laundering}
