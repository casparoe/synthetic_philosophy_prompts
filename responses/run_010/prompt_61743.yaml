answer: |-
  **The Weight of Ink**

  Aris Thorne’s knuckle brushed the drying ink on Salt Fleet’s filing. *Salt Fleet pledges to carry all ore from the Blackstone mines during the winter season, commencing Frostmonth First. Terms: Three barrels per ton carried. Salt Fleet forfeits the deed to their drydock slip if observed carrying less than the mines’ full winter output, or if observed carrying ore for any other party.* The date stamp beneath it was fresh: Deepnight 27th. Early. Very early.

  She laid it atop the thin stack for the Firstday reading. The Saltmen were burning their bridges early this year. Filing first meant their terms – demanding, aggressive – became the fixed point. Anyone else wanting a slice of that ore haul would have to route around *this* rock, blind to what counter-rock the Greys might drop. Aris knew the Greys were drafting their own oath; their runner had been lurking outside the Ledger House steps since dawn.

  The market bell clanged. Old Evin shuffled forward, presenting his monthly filing. His knobbly finger tapped the parchment. “Same as ever, Ledger-keeper. Evin Barrow pledges to tend the community garden plot behind the tannery daily until the first frost fails. Forfeit: My good pruning shears.” He placed the worn tools on the counter. Keeper Rhys nodded, stamped the page, and Evin shuffled off, leaving the scent of damp earth and rust.

  At the Firstday reading, Rhys’s voice boomed over the fishmongers’ cries. “Evin Barrow pledges daily tending of the tannery garden plot until first frost fails. Forfeit: One pair pruning shears, held.” Murmurs of approval. Routine. Then: “Salt Fleet pledges winter carriage of all Blackstone ore, commencing Frostmonth First. Terms: Three barrels per ton carried. Forfeit: Deed to drydock slip, held.” A sharper murmur rippled through the crowd. Salt Fleet captains stood stone-faced. Three barrels was steep, but the slip… that was the heart of their operation. They’d staked their berth.

  Two days later, Grey Fleet’s filing landed on Aris’s desk. Her stomach tightened as she read. *Grey Fleet pledges to undercut Salt Fleet’s ore carriage rate by one barrel per ton, commencing Frostmonth First, provided Salt Fleet maintains its filed pledge. Grey Fleet forfeits the naming rights to their flagship, the *Grey Dawn*, if they fail to undercut, or if they carry ore for any other party before the Salt Fleet pledge is fulfilled or broken.* The date: Deepnight 29th. They’d seen the Saltmen’s move and dropped an anchor on their heads.

  Aris traced the words. The Salt Fleet was locked into carrying *all* the ore at three barrels per ton. The Greys were locked into charging only two barrels per ton *if* the Salts held to their pledge. But the Salt Fleet *couldn't* hold to it profitably at two barrels – their costs were too high, especially with winter channel risks. The only way the Salt Fleet could avoid ruin was to break their pledge, lose their slip, *and* the Greys would get the contract at two barrels. The Greys would get the contract either way, but only by forcing the Salts to destroy themselves. And the forfeit? The *Grey Dawn*’s name? It sounded symbolic, but Aris knew. That name was painted on the hull with the founder’s own hand; selling the naming rights was akin to selling their soul. Both were staking things worth more than the winter contract’s profit. The collision was set. Both would bleed.

  She saw the solution immediately, a way to pull both anchors before they sank the ships: a joint filing. *Both parties mutually release each other from their prior filed oaths concerning Blackstone ore carriage, Frostmonth First onward.* Filed simultaneously. Neither could defect because neither would see the other's filing first. But filings *weren't* simultaneous. They landed on her desk one after another, stamped with date and precise hour. Whoever filed second in this counter-oath would see the first had filed, know they were released, and could simply not file their own, leaving the first filer bound while they were free. The race just moved.

  Rhys found her staring at the Grey Fleet filing long after the office dimmed. He knew the collision too. “Unravels itself, doesn’t it?” he rumbled, lighting a pipe. “Like watching two drunks bet their boots on who can stand in the fire longest. Each step makes sense to them.”

  “There must be a way,” Aris whispered, not looking up. “A way to file together.”

  Rhys blew a smoke ring. “The Ledger reads in order. Always. You can’t file *together*. You file *first*, or you file *second*. There’s no ‘together’ on parchment.”

  But Aris saw the shape of it. Not the filing itself, but the *holding* of it. The ensuring. Someone had to make *that* binding. Someone had to stake something real on the procedure, on the absolute, identical treatment of both filings, regardless of who handed over their parchment first.

  The next morning, Aris presented two identical parchments to Rhys. *Salt Fleet and Grey Fleet mutually release each other from all prior filed oaths concerning Blackstone ore carriage, Frostmonth First onward.* Blank spaces waited for signatures and forfeitures.

  Rhys raised a bushy eyebrow. “And how does this land on my desk without one landing before the other? Do they float down together on a magic carpet?”

  Aris placed her own small, carefully written parchment on top. Her hand trembled only slightly. *Aris Thorne pledges that the Salt Fleet and Grey Fleet counter-oaths, filed today, shall be treated by the Ledger as simultaneous in execution and binding only if both are completed. Should one be filed without the other, the Ledger shall disregard both. Should both be filed, the Ledger shall bind them as simultaneous. Forfeit: My father’s fishing skiff, the *Tern’s Return*.*

  Rhys stared. The *Tern’s Return* was old, but it was Aris’s sole inheritance, her livelihood when not clerking. It was worth far more than her wages. “Aris…”

  “It makes the simultaneity real,” she said, her voice tight. “I stake the skiff on the *procedure*. On you treating both filings as one, bound together. If only one files, you disregard it. I lose nothing unless both file and you don’t hold them as simultaneous. And if both file… they’re free. But my forfeit binds *you*, Keeper. To treat them as one act. You break that, you cost me my boat.” She met his gaze. “It makes the ‘together’ real. Because I pay if it isn’t.”

  Rhys studied her parchment, then the two blank ones. He sighed, a sound like gravel shifting. “It’s a steep toll for a clerk, Aris Thorne.”

  “It’s the only bridge,” she said simply.

  The runners from both fleets arrived within minutes of each other, eyes wary. Aris took both counter-oath parchments simultaneously, her hands outstretched, accepting them at the same instant. She didn’t look, didn’t check which captain’s hand touched hers first. She laid them side-by-side on Rhys’s counter. He stamped both with the same date and identical hour. He took the forfeits noted: Salt Fleet offered a chest of winter-grade tar, the Grey Fleet a season’s worth of privileged net-mending rights at their sheds. Tangible, valuable, but not vital organs. Then he took Aris’s filing, stamped it, and placed it slightly apart. The *Tern’s Return* wasn’t brought in; its forfeit was understood, its painted name on the hull its marker.

  At the next Firstday reading, after Old Evin’s pruning shears were confirmed held again, Rhys’s voice carried the new weight. “Salt Fleet and Grey Fleet mutually release each other from all prior filed oaths concerning Blackstone ore carriage, Frostmonth First onward. Forfeits: Salt Fleet, one chest winter-grade tar. Grey Fleet, season’s net-mending rights. Held.” A pause. The crowd held its breath. “Aris Thorne pledges that the Salt Fleet and Grey Fleet counter-oaths filed Deepnight 30th shall be treated by the Ledger as simultaneous…” Rhys read the rest, his tone flat, final. “…Forfeit: The fishing skiff *Tern’s Return*, held.”

  Aris stood at the back, near the fish scales. She saw the Salt and Grey captains exchange a look – not relief, not triumph, but the wary acknowledgment of a bullet dodged. They were free to haggle now, in the smoky back rooms, without the Ledger’s chains. Their race had been halted by a clerk stepping onto the track with a heavier anchor.

  Later, Rhys found her watching the *Tern’s Return* bob at its mooring. The tide was going out. “They’ll haggle,” he said. “Maybe find a deal. Maybe not. Your skiff bought them the table.”

  Aris nodded, the salt wind sharp on her face. She hadn’t solved the conflict. She’d only made the pause possible. And the cost of that pause, the cost of making the simultaneity more than ink, was the weight of the boat she now only watched. The Ledger held it. The procedure was paid for.
