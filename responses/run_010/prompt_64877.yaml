prompt: |-
  I'm auditing a graduate seminar on knowledge and action this term, and there is a knot in the material on knowing how versus knowing that that I have not been able to untangle. The setup is familiar enough: Ryle's argument in The Concept of Mind is usually presented as showing that intellectualism — the thesis that knowing how to F is a species of knowing that something is the case — collapses into an infinite regress, because acting intelligently would first require contemplating a proposition about how to F, and that contemplating would itself have to be done intelligently, requiring a further such proposition, and so on. Our instructor's response was that this is a bad argument, or at any rate an argument against a straw man: what it actually refutes is only the claim that an agent must occurrently consider a proposition in order to act intelligently on it, and no intellectualist needs that claim, since the intellectualist can hold that a stored piece of propositional knowledge guides action without ever being brought before the mind. She added that the point cuts against the other side too — whatever stops the regress for the intellectualist, namely that the knowledge is simply there in the right relation to the action without being surveyed, seems to stop it equally for the anti-intellectualist, whose dispositions are likewise supposed to guide action without being exercised in any further act. I think I follow this, but I would like a careful explanation of what the regress does and does not establish: which premise is the vulnerable one, why the intellectualist can reject that premise without giving up intellectualism, and whether her symmetry claim really holds or is too quick.

  The reason I am not satisfied is a second worry that surfaced afterwards and that we ran out of time to resolve. Suppose the intellectualist, having escaped the regress, still owes an account of what makes a piece of propositional knowledge the right kind of knowledge to constitute skill. Take a cycling commentator who can recite everything true about countersteering — lean the way you want to go, steer briefly the other way, the role of trail and of gyroscopic effects, the correction rate as a function of speed — and who, put on a bicycle in an empty parking lot, goes down within ten feet. Intuitively she knows all the propositions and still does not know how to ride. (This is not a hypothetical: my partner teaches adult swim lessons and meets roughly this person every season.) The intellectualist's standard move is to say that the propositions must be grasped under a practical rather than a theoretical mode of presentation, so that the commentator lacks not the content but the way of having it; or, alternatively, that knowing how requires employing the relevant proposition in action rather than merely assenting to it. Both moves strike me as doing all of the work and none of the explaining. If grasping a proposition practically just means grasping it in whatever way is required for knowing how to F, the account is circular; and if employing a proposition in intentional action is itself something done skillfully, then it is itself a know-how, and the regress has not been stopped but relocated one level down — this time to the notion of a mode of presentation or of employment, rather than to the notion of contemplating.

  So here is what I want: an explanation of this conceptual issue, not a survey of the positions. Walk me through the structure of the disagreement — what the regress is meant to show, what it actually shows, and what it presupposes about how knowledge has to relate to action in order for the intellectualist to be in trouble. Then take up the sufficiency problem I sketched and lay out clearly what resources are available for closing the gap between having the right propositional knowledge and being able to perform: a substantive account of practical ways of thinking that is more than a label; a restriction on which propositions count, so that the way must be one the agent can actually execute; an appeal to the difference between possessing and exercising knowledge, perhaps together with cases of the temporarily incapacitated expert who keeps her know-how while losing the ability to display it; or a concession that the gap is primitive. For each option, tell me what it costs and whether it reintroduces the regress somewhere new. I am content for you to conclude that one option is the best of a bad lot, or that the whole dispute rests on an unstable notion of guidance — but I want the reasoning that gets there spelled out rather than a verdict announced, and I would rather you reason from the cases and the concepts than send me anywhere to look things up.
reasoning: |-
  Okay, I need to tackle this user's complex query about the know-how vs. know-that debate. Let me start by breaking down their main concerns. They're auditing a graduate seminar and are stuck on Ryle's regress argument against intellectualism. Their instructor argued that the regress only targets occurrent contemplation, not stored propositional knowledge, and that the same regress-stopper applies to both sides. The user follows this but is unsure about what the regress actually proves and whether the symmetry claim holds.

  The user's second worry is about the sufficiency of propositional knowledge for skill. They give the example of a cycling commentator who knows all the relevant propositions but can't ride a bike. They're skeptical of solutions like practical modes of presentation or employment in action, seeing circularity or regress in those moves. They want a clear analysis of the disagreement structure and the options for bridging the gap between propositional knowledge and ability.

  First, I need to reconstruct Ryle's regress accurately. The key is that the regress targets the intellectualist's claim that intelligent action requires prior contemplation of a proposition. But as the instructor noted, intellectualists don't require occurrent contemplation; stored knowledge suffices. So the regress only refutes a straw man. The symmetry point is valid: both sides need a regress-stopper, like stored knowledge or dispositions operating without further contemplation.

  Next, the sufficiency problem. The commentator knows the propositions but can't perform. The intellectualist might appeal to practical modes of presentation or the ability to employ the knowledge. But the user worries that "practical mode" is circular, and "employment" might itself require know-how, leading to a new regress. 

  I should explore each intellectualist option. Practical modes of presentation: if defined as whatever enables action, it's circular. If substantive (e.g., motor representations), it might work but needs independent grounding. Restricting propositions to executable ones risks conflating know-how with ability. The possession/exercise distinction helps with temporarily incapacitated experts but doesn't explain how knowledge guides action. Conceding primitivity avoids regress but might dissatisfy theorists.

  Crucially, the employment move must avoid requiring a further skillful act. If employing knowledge is itself an intentional action needing know-how, regress resurfaces. The intellectualist must argue that employment is a non-intentional triggering of stored knowledge, like dispositional responses. But then the symmetry claim holds—both sides rely on such mechanisms.

  The deeper issue might be the concept of "guidance." Both sides need an account of how knowledge informs action without infinite steps. Either dispositional properties or structured stored knowledge can serve this role. The regress highlights that guidance must be non-deliberative at the point of action.
answer: |-
  Let's untangle this systematically, starting with Ryle's regress and its limits, then addressing the sufficiency problem for intellectualism. The goal is clarity on what the arguments reveal about the relationship between knowledge and intelligent action.

  ### I. Dissecting Ryle's Regress: What it Does and Doesn't Show
  1.  **The Regress Argument (as Ryle Presents it):**
      *   **Premise 1 (Intellectualist Core):** Knowing how to F is knowing that some proposition(s) P (e.g., "To F, one must do A, B, C") is true.
      *   **Premise 2 (Contemplation Requirement):** To act intelligently (to F), an agent must first *contemplate* or *occurrently consider* the relevant proposition P.
      *   **Premise 3 (Intelligent Contemplation):** This act of contemplating P must itself be done intelligently.
      *   **Regress Engaged:** To contemplate P intelligently (Premise 3), the agent must first contemplate *another* proposition P1 about *how* to contemplate P (per Premise 1 & 2). This requires contemplating P2 about how to contemplate P1, and so on, infinitely. Intelligent action becomes impossible.

  2.  **The Vulnerability: Premise 2 (Contemplation Requirement)**
      *   **The Straw Man:** Your instructor is correct. Ryle's argument powerfully refutes the idea that intelligent action requires the agent to *occurrently consider* (consciously think about, entertain in their mind) a proposition *before* or *during* the action. This *is* a straw man.
      *   **The Intellectualist Escape:** Intellectualists (e.g., contemporary ones like Jason Stanley or Timothy Williamson) readily reject Premise 2. They argue that knowing *that* P can guide action *dispositionally* or *implicitly*. The propositional knowledge (e.g., "To countersteer, briefly steer away from the turn direction") is stored in the agent's mind/brain, causally connected to their motor and cognitive systems. It influences behavior *without* needing to be consciously brought before the mind each time. When the cyclist leans into a turn, the stored knowledge guides the slight countersteer reflexively, not via conscious deliberation.

  3.  **The Instructor's Symmetry Claim: Does it Hold?**
      *   **Yes, it holds.** The core problem the regress highlights is the need for a "regress-stopper" – something that explains how knowledge (whether propositional or not) can guide action *without* itself requiring a further intelligent act to apply it.
      *   **For the Intellectualist:** The regress-stopper is the agent's *disposition to utilize the stored propositional knowledge appropriately in action*. The knowledge is structured and connected to behavior in a way that allows it to be triggered by the situation and guide the relevant movements without conscious contemplation. The "right relation" is a specific causal-functional role the propositional state plays within the agent's cognitive architecture.
      *   **For the Anti-Intellectualist (e.g., Ryle):** The regress-stopper is a *complex of dispositions* directly geared towards performing F intelligently. Seeing the turn *disposes* the skilled cyclist to countersteer in the right way. This disposition operates without the agent needing to first contemplate rules about dispositions or how to exercise them.
      *   **The Symmetry:** Both positions require *something* – either dispositionally structured propositional knowledge or non-propositional dispositions – that is *operative* in guiding action without requiring a *prior* intelligent act to *apply* that very thing. The regress doesn't refute intellectualism *per se*; it refutes a *specific, implausible mechanism* (occurrent contemplation) for how *any* knowledge (propositional or otherwise) could guide action. Both sides need, and can provide, a dispositional regress-stopper.

  **Conclusion on the Regress:** Ryle's argument successfully shows that occurrent contemplation cannot be the mechanism linking knowledge to intelligent action. It fails to refute a sophisticated intellectualism based on *dispositional* propositional knowledge. The symmetry claim holds: both intellectualists and anti-intellectualists must ground intelligent action in dispositions that operate without further intelligent supervision.

  ---

  ### II. The Sufficiency Problem: From Knowing That to Knowing How
  Even if intellectualism escapes the regress via dispositional propositional knowledge, the cycling commentator case highlights a deeper challenge: **Having the relevant propositional knowledge *dispositionally* still seems insufficient for knowing *how* to F.** The commentator knows *that* all the facts about countersteering are true, dispositionally, yet cannot ride.

  **Intellectualist Strategies and Their Costs:**

  1.  **Practical Mode of Presentation (MOP):**
      *   **The Move:** The commentator and the skilled cyclist both know the *proposition* "Countersteering involves briefly steering away from the turn direction." However, the cyclist grasps this proposition under a *practical* MOP, while the commentator grasps it under a *theoretical* MOP. The practical MOP is the "way of thinking" that directly engages the agent's action-planning and motor-control systems.
      *   **The Circularity Worry:** If "practical MOP" is *defined* simply as "whatever way of grasping the proposition that enables one to perform F," then the account *is* circular. "Knowing how to F is knowing that P under a MOP that constitutes knowing how to F" explains nothing.
      *   **Avoiding Circularity (Cost: Need for Independent Grounding):** To avoid circularity, the intellectualist must give a *substantive, independent characterization* of what a practical MOP is. This requires delving into cognitive science: a practical MOP might involve embodiment (the knowledge is tied to sensorimotor representations), procedural encoding (the knowledge is stored in a format optimized for rapid execution, unlike declarative facts), or direct motor schemas (the propositional content is linked to specific motor programs). The cost is shifting the explanatory burden onto cognitive science and potentially blurring the line between "propositional knowledge in a special format" and "non-propositional ability." It also raises the question: *How* does possessing the proposition *under this MOP* grant the ability? This risks the next problem...
      *   **Regress Relocation?** If employing the proposition *in virtue of* its practical MOP is itself an intentional action requiring skill, then regress threatens: "She knows *how* to employ P practically." However, the intellectualist can (and must) argue that the causal triggering of the disposition tied to the practical MOP is *automatic* and *non-intentional* given the right perceptual cues and the agent's overall skill state. It's part of the regress-stopper. The challenge is explaining *why* the commentator, possessing the proposition *theoretically*, cannot simply "switch" its MOP to practical without acquiring a distinct ability.

  2.  **Restriction on "Relevant" Propositions / Executability:**
      *   **The Move:** The commentator knows *propositions about* cycling, but not the *specific propositions* that constitute the know-how. The know-how-constituting propositions must be ones the agent *can execute* or are *practically actionable* for them. "Relevant" might mean propositions specifying basic actions the agent can perform directly.
      *   **The Problem:** This risks collapsing intellectualism into anti-intellectualism or vacuity.
          *   **Circularity/Regress:** If the proposition must be "executable," then "knowing how to F is knowing the executable proposition P that constitutes F." But what makes P executable *by this agent*? It seems to presuppose the agent already possesses the very know-how (the ability to execute basic actions) that the proposition is supposed to constitute. We get a regress about basic actions: "To execute P (a basic action), must I know an executable proposition P1 about executing P?" This forces the intellectualist to posit genuinely basic "executable propositions" whose execution requires no further know-how – which looks suspiciously like a non-propositional ability.
          *   **Vagueness:** Defining the "relevant" or "executable" propositions in a non-circular way is extremely difficult. Does knowing "Move your leg *thusly*" (where "*thusly*" points to a motor feeling) count as propositional? If so, how is "*thusly*" captured propositionally without regress or circularity?

  3.  **Possession vs. Exercise + Temporary Incapacitation:**
      *   **The Move:** The commentator possesses the propositional knowledge but cannot *exercise* it in action (like a temporarily paralyzed expert cyclist still knows *how* to ride). The know-how *is* the possession of the dispositional propositional knowledge. The inability to perform is a separate failure of *ability* or *capacity*, not a lack of *knowledge*.
      *   **The Cost 1 (Separation Problem):** This severs the tight conceptual link between knowing-how and ability. While we accept temporary incapacitation (paralysis, panic), the commentator case seems different. The commentator arguably *lacks* the know-how itself, not just the ability to exercise it. They lack the *skill*, not just the physical capacity. Saying "She knows how, she just can't do it *at all*" seems counterintuitive. Intellectualism struggles to explain the *difference* between the commentator (who possesses facts) and the skilled-but-temporarily-incapacitated cyclist (who possesses know-how).
      *   **The Cost 2 (Guidance Problem):** If know-how *is* just the possession of the propositions, what explains the commentator's failure? Merely saying "she can't exercise it" doesn't explain *why* she can't. The intellectualist must still explain what *else* is missing besides the propositional knowledge – precisely what the other strategies (MOP, executability) try, and fail, to capture non-circularly. This move dodges the sufficiency problem by definition ("know-how = possession, not exercise"), but leaves the *connection* between possession and the potential for successful exercise deeply mysterious. *How* does possessing the proposition, even dispositionally, provide the guidance the commentator lacks? Appealing to "the right disposition" just pushes the question back.

  4.  **Conceding the Gap is Primitive:**
      *   **The Move:** The intellectualist concedes that possessing the relevant propositional knowledge under the right MOP (or whatever) is *necessary* for know-how, but not *sufficient*. An additional primitive element – an ability, a non-propositional skill, a "click" of understanding – is required to bridge the gap to performance. Knowing-that provides the content/structure, but something non-propositional provides the executive power/implementation.
      *   **The Cost:** This is a significant retreat for *strong* intellectualism (knowing-how *just is* a form of knowing-that). It becomes a *hybrid* view. The gap between propositional knowledge and ability is accepted as fundamental. This avoids circularity and regress (the primitive element is the regress-stopper), but at the expense of intellectualism's reductive ambitions. It also leaves the nature of the primitive element unexplained.

  **The Central Tension and Potential Instability:**

  The core difficulty for intellectualism lies in the concept of **guidance**. How does dispositional propositional knowledge *guide* intelligent action in the way know-how demonstrably does?

  *   **For the Anti-Intellectualist:** Guidance is explained by the direct, situation-responsive dispositions constituting the skill. No propositions need to be "guiding" in a semantic sense; the disposition *is* the guidance.
  *   **For the Intellectualist:** The propositional content *must* play a causal role in structuring and informing the action. But how?
      *   If the proposition's role requires *interpretation* or *application* by the agent, regress threatens (How do they know *how* to apply it?).
      *   If the proposition's role is *purely causal* and automatic (like a stimulus-response), it becomes hard to see how the *semantic content* of the proposition is genuinely guiding the action, rather than just being a neural placeholder for a disposition that does the real work. This risks reducing the "propositional knowledge" to a non-propositional causal state in disguise.
      *   The MOP strategy tries to split the difference: the content *is* guiding *because* it's encoded in a way that directly interfaces with action systems. But as argued, characterizing this encoding independently and non-circularly is the major challenge.

  **Conclusion on the Sufficiency Problem:**

  1.  **The Gap is Real:** The commentator case convincingly shows dispositional propositional knowledge, even of the relevant facts, isn't sufficient for know-how. Something more is needed.
  2.  **The Options are Costly:**
      *   **Practical MOP:** Best hope for strong intellectualism, but requires risky, independent cognitive grounding to avoid circularity and faces the "why can't she switch MOP?" question.
      *   **Executable Propositions:** Leads to circularity/regress or vacuity.
      *   **Possession vs. Exercise:** Severs know-how from ability too radically and dodges the guidance question.
      *   **Primitive Gap:** Abandons strong intellectualism.
  3.  **The Symmetry Holds, but Deepens the Problem:** Just as both sides need a regress-stopper for *initiating* action, both sides need an account of *how* their preferred state (propositional knowledge under MOP / dispositions) *successfully guides* complex, adaptive, intelligent performance. The commentator case suggests intellectualism struggles more to provide this account without either collapsing into circularity, smuggling in primitives, or reducing the propositional content to an inert passenger on a dispositional process. The "guidance" relation itself – how *any* cognitive state results in *intelligent* rather than merely mechanical behavior – might be the unstable core of the entire dispute. Ryle's regress, while refuting a straw man, points towards this deeper instability concerning the nature of intelligent action itself.

  The most plausible paths forward involve either a substantive, science-informed account of practical MOPs or conceding a hybrid view where propositional knowledge plays a crucial but non-exhaustive role in know-how. Pure strong intellectualism faces a persistent sufficiency gap that its standard moves struggle to close convincingly.
