prompt: |-
  I'm an editor on the science desk of a mid-size news site, and I keep ending up as the person who has to referee fights about the word "function." A paper or a press release says some stretch of DNA, some protein, some organ has a function, a reader or a rival lab emails in saying that's not a function at all, it's just something the thing happens to do, and suddenly I'm mediating a philosophy of biology dispute with no training in it and a headline that locks in an hour. It happens a couple times a month, sometimes several times a week during the big consortium announcements.

  I know the rough shape of the disagreement — that one camp says a trait's function is whatever it was selected for, so function is a historical claim about why the trait is there, and the other camp says function is just the contribution the trait makes to some capacity of the system right now, no history required. What I need is that turned into something my reporters can actually run.

  So: write me a decision procedure, step by step, that a reporter with a biology degree but zero philosophy can apply to an incoming function claim. For each step I want the question to ask, what counts as a pass, what the possible outputs are at that point (kill it, run as written, run with a specific fix, hand it to me, hand it to an outside biologist), and which steps are real judgment calls wearing a procedure costume. It has to handle the messy middle cases rather than only the clean ones: a trait that does several things at once, a trait that got co-opted for something new recently so there's no selection history for the new use yet, a trait that clearly does something and is clearly useless or even harmful, and a claim where the two camps would both say the sentence is true but mean different things by it — because for me that last one is a wording problem, not a truth problem, and the procedure should treat it that way.

  I also need it to distinguish where the claim appears. A scientist saying it in a quote, my reporter paraphrasing it, the headline, and the caption are four different levels of commitment and the procedure should say what's allowed at each.

  Give me the reader-facing bits too: a one-sentence plain-language gloss for each of the two senses that doesn't talk down to anyone, and a rule for when we have to tell readers there's a dispute versus when the distinction doesn't matter to the story and dragging it in would just be noise. Then a crib card version, short enough to read in ninety seconds before deadline.

  Run the whole thing on three cases: the ENCODE fight over how much of the human genome counts as functional, a press release announcing a newly discovered second job for a protein that was already well characterized, and a story about some structure we've been calling vestigial that turns out to do something measurable. For at least one of them the procedure should land somewhere my desk will hate — a kill, or a rewrite that guts the hook — and I want you to say so plainly instead of softening it.

  Finally, be straight with me about the costs. Which distinctions from the technical debate did you drop to make this usable, and what will this procedure systematically get wrong as a result? If I want, name a couple of the refinements people have proposed to patch the historical account and tell me whether any of them is worth adding a step for or whether they're all downstream of stuff a newsroom can safely ignore.
reasoning: |-
  We are creating a decision procedure for editors and reporters to handle disputes about the word "function" in biology. The procedure must be step-by-step, applicable by someone with a biology background but no philosophy, and handle messy cases. It must also distinguish between different parts of the article (quote, paraphrase, headline, caption).

  We'll define two senses of "function":
  1. Historical (selected-effect) function: The trait's function is what it was naturally selected for in the past.
  2. Causal-role function: The trait's function is the causal contribution it currently makes to a system's activities.

  The procedure will have steps that ask specific questions and direct the user to one of several outcomes: kill the claim, run as written, run with a specific fix, hand to editor, or hand to an outside biologist.

  We'll also provide:
  - One-sentence plain-language glosses for each sense.
  - A rule for when to mention the dispute to readers.
  - A crib card (short version).

  Then we'll test the procedure on three cases:
  1. ENCODE fight (how much of the genome is functional)
  2. Press release about a protein's newly discovered second job
  3. Vestigial structure that turns out to do something

  Finally, we'll discuss costs: what distinctions were dropped and what the procedure might get wrong, and whether any refinements to the historical account are worth adding.

  Let's design the procedure.

  ## Step-by-Step Decision Procedure

  ### Step 0: Where is the claim appearing?
     - **Question:** Is the claim in a direct quote from a scientist, a reporter's paraphrase, the headline, or a caption?
     - **Pass:** Identify the location.
     - **Outputs and actions:**
       - If in a direct quote: Proceed to Step 1, but note that quotes are generally protected (unless egregiously misleading). We can run the quote and then, if needed, clarify in the text.
       - If in a paraphrase, headline, or caption: Proceed to Step 1. These are under our control and must be scrutinized.

  ### Step 1: Is there a clear historical (evolutionary) context?
     - **Question:** Does the claim about function come with evidence or consensus about natural selection? (e.g., the trait is present because it was selected for that role)
     - **Pass:** Yes, there is a known or strongly inferred evolutionary history where the trait was selected for the claimed function.
     - **Outputs:**
       - Pass: If the claim is using the historical sense, then it's safe to run (with the caveat of Step 2). If not, note that the historical sense is supported and we might need to adjust wording to match.
       - Fail: Proceed to Step 3 (bypass Step 2, since history is not established).
       - Uncertain: Hand to editor or outside biologist for quick consult (if time allows) or proceed to Step 3.

  ### Step 2: Is the trait currently under selection for the claimed function?
     - **Question:** Even if there's a historical context, is the trait still being maintained by selection for that function? (This step is only if Step 1 passed.)
     - **Pass:** Yes, current evidence (e.g., population genetics, comparative biology) indicates ongoing selection for the function.
     - **Outputs:**
       - Pass: The historical claim is robust. Run as written (if the claim is historical) or with clarification if needed.
       - Fail (or not applicable): The trait might have been selected in the past but is now under selection for something else or not under selection. Proceed to Step 3 to check the causal role.

  ### Step 3: Does the trait clearly contribute to a current activity?
     - **Question:** Regardless of history, does the trait demonstrably contribute to some current capacity of the organism? (e.g., through experiments, biochemical assays, etc.)
     - **Pass:** Yes, there is robust evidence of a causal role.
     - **Outputs:**
       - Pass: The causal-role sense is supported. Proceed to Step 4 to check for ambiguity.
       - Fail: The trait doesn't seem to do anything, or the evidence is weak. Then consider killing the claim or handing to editor (if in a quote, note the controversy).

  ### Step 4: Is there a risk of ambiguity between senses?
     - **Question:** Could readers (or scientists) interpret the word "function" in either the historical or causal-role sense? And are both senses plausible but only one intended?
     - **Pass:** The context does not clearly indicate which sense is meant, and both might be in play.
     - **Outputs:**
       - Ambiguity detected: Rewrite to specify which sense (using the plain-language glosses) OR if time is short, hand to editor for a quick fix.
       - No ambiguity: Run as written.

  ### Step 5: Location-specific adjustments
     - **Question:** Given the location (from Step 0) and the outcomes of Steps 1-4, what restrictions apply?
     - **Actions:**
       - Headline and caption: Must be unambiguous and accurate. If the claim is only supported in one sense, that sense must be clear or the wording changed. Avoid using "function" if it's ambiguous and the context doesn't resolve it. Use more specific terms (e.g., "role", "effect", "selected for").
       - Paraphrase: Can be adjusted to clarify the sense. If both senses are valid and the distinction matters to the story, mention the dispute briefly.
       - Direct quote: Generally run as is, but if the quote is ambiguous and the distinction matters, add a clarifying sentence immediately after (e.g., "Here, Dr. Smith uses 'function' to mean the current biochemical role, not necessarily an evolved purpose.").

  ### Step 6: When to mention the dispute to readers
     - **Rule:** Mention the dispute only if:
       1. The story hinges on the definition (e.g., ENCODE's 80% functional claim), OR
       2. The claim is controversial because of the definition and leaving it unaddressed would mislead readers.
       - Otherwise, it's noise. Use the appropriate sense without explanation.

  ### Plain-language glosses:
     - Historical function: "The function of a trait is what it was naturally selected to do over evolutionary time."
     - Causal-role function: "The function of a trait is the job it performs in an organism's current biology, regardless of how it evolved."

  ### Crib Card (90-second version)

  **Where's the claim?**
  - Quote: Usually run, clarify after if needed.
  - Else: Scrutinize.

  **Step 1: History?** 
     - Yes (and Step 2: current selection? yes): Historical function OK.
     - No: Go to Step 3.

  **Step 3: Current role?**
     - Yes: Causal-role function OK.
     - No: Kill or flag.

  **Step 4: Ambiguous?**
     - Yes: Rewrite to specify (use "selected for" or "current job").
     - No: Run.

  **Headline/Caption:** Avoid "function" if ambiguous; use specific terms.

  **Tell readers about dispute?** Only if central to story.

  ---

  ## Test Cases

  ### Case 1: ENCODE fight (how much of the genome is functional)
  - Claim: "80% of the human genome is functional."
  - Context: ENCODE used biochemical activity (causal-role) to define function. Critics say only the part under selection (historical) counts.
  - **Apply procedure:**
    - Step 0: Likely in headline or paraphrase.
    - Step 1: No historical context for 80% (most is not under selection). Fail Step 1 -> Step 3.
    - Step 3: Does it have a causal role? ENCODE showed biochemical activity, so pass causal-role.
    - Step 4: Ambiguity? High. The word "functional" is used in the causal-role sense by ENCODE, but the historical sense is common in evolution.
    - Step 5: In a headline, avoid "functional". Rewrite to: "80% of human genome shows biochemical activity" (if causal-role) or if the story is about the controversy, the dispute must be mentioned.
    - Step 6: The dispute is central, so mention it.
  - **Outcome:** Headline/paraphrase must be fixed. If the claim is run as is, it will mislead. The desk might hate this because "functional" is punchy, but the fix guts the hook. We must rewrite.

  ### Case 2: Press release about a newly discovered second job for a protein
  - Claim: "Protein X has a second function in cell signaling."
  - Context: Protein X was known for role Y (historical function). New study shows it also does Z, but there's no selection history for Z yet.
  - **Apply procedure:**
    - Step 0: Likely in headline or paraphrase.
    - Step 1: Is there history for the second function? No. Fail -> Step 3.
    - Step 3: Does it have a current causal role? Yes, the new study shows it contributes to signaling.
    - Step 4: Ambiguity? The word "function" might imply historical, but here it's causal-role. Rewrite to avoid ambiguity.
    - Step 5: In headline: "Protein X found to play second role in cell signaling". In text: specify "newly discovered role" or "current biochemical activity".
    - Step 6: The dispute isn't central to the story (it's about the new discovery), so no need to mention the philosophy.
  - **Outcome:** Rewrite to use "role" instead of "function". Run with fix.

  ### Case 3: Vestigial structure that turns out to do something
  - Claim: "The human appendix, long thought to be vestigial, actually has a function."
  - Context: The appendix was thought to have no function (historical: lost its original function). New evidence shows it might serve as a reservoir for gut bacteria (causal-role). But is this under selection?
  - **Apply procedure:**
    - Step 0: Headline or paraphrase.
    - Step 1: Historical context? Originally selected for something (digestion in ancestors?), but that function was lost. Now, the new role: no evidence yet that it was selected for the reservoir role (it might be a new use or under selection). Uncertain -> Step 3.
    - Step 3: Current causal role? Yes, evidence for reservoir.
    - Step 4: Ambiguity? The claim says "has a function" without specifying. Both senses might be in play: historically it was selected (but lost), and currently it has a role. Rewrite to clarify.
    - Step 5: Rewrite to: "The human appendix, long thought to be useless, plays a current role in maintaining gut bacteria" (causal-role) OR if there's evidence of selection for the new role, then "has a new function" (but then Step 1 must pass).
    - Step 6: The dispute isn't central, but the story is about overturning the vestigial idea. Briefly note: "While the appendix may have lost its original function, scientists now find it serves a purpose in the immune system." No need for deep philosophy.
  - **Outcome:** Run with rewrite to specify current role. Avoid "function" in headline; use "purpose" or "role" with caution.

  ## Costs and Omissions

  ### What we dropped:
  1. **The problem of exaptation and co-option:** We treat traits with new uses as lacking historical function for the new use (Step 1 fails). But sometimes a trait is maintained by selection for a new function (which would pass Step 2). We have Step 2 for current selection, but in practice, evidence for current selection might not be available on deadline. We simplified by focusing on evidence of selection (past or present) for the claimed function.

  2. **Multiple functions:** We don't explicitly handle a trait having multiple functions (some historical, some causal-role). But the steps can be applied to each claimed function individually.

  3. **The systemic nature of causal-role functions:** We don't require that the trait's contribution is to a system that is itself functional (a requirement in some causal-role accounts). We just ask if it contributes to a current activity.

  4. **'Function' in molecular biology vs. evolutionary biology:** Molecular biologists often use causal-role, evolutionary biologists historical. We capture this by the two senses, but we don't delve into the nuances of each field.

  ### What the procedure might get wrong:
  - It might overemphasize historical function when a trait is maintained by selection for a different function than the one claimed.
  - It might accept a causal-role function that is trivial or non-adaptive (e.g., a protein's non-specific binding) and not what biologists typically call a function.

  ### Refinements to the historical account:
  Some propose:
  - **Modern History Theory:** Function is what the trait was selected for in the recent past (to handle co-option). But "recent" is vague.
  - **Weak etiological theory:** Function is what the trait does that explains its current maintenance (even if not original). This is captured in our Step 2 (current selection).

  **Is it worth adding a step?** 
  - We have Step 2 for current selection. That covers maintenance. Adding a separate step for "recent selection" would complicate and is not necessary. The procedure already handles the vestigial case: if there's current selection for the new role, Step 2 passes and we can call it a function in the historical sense. If not, we use causal-role. 

  Thus, no extra step needed. The refinements are downstream of what we can handle in a newsroom.

  ### Final note:
  The procedure is designed for speed and to avoid the most egregious errors. It will not satisfy philosophers, but it will prevent most reader complaints and lab feuds. In borderline cases, it errs on the side of caution (rewriting to be specific). The desk might hate when we kill a punchy but ambiguous headline, but that's the cost of accuracy.
answer: |-
  ### Decision Procedure for "Function" Claims

  **Design Principles**:  
  - **Speed**: Prioritize actionable outputs.  
  - **Clarity**: Minimize philosophical jargon.  
  - **Location Sensitivity**: Adjust strictness based on claim placement.  
  - **Messy Cases**: Explicitly handle co-option, vestigial traits, and ambiguous usage.  

  ---

  ### **Step-by-Step Procedure**  
  *(For reporters with a biology degree; apply in order)*  

  #### **Step 0: Claim Location Check**  
  **Question**: Where does the claim appear?  
  - **Options**: Direct quote, reporter paraphrase, headline, caption.  
  **Outputs**:  
    - **Direct quote**: Proceed to Step 1 (quotes get leeway; clarify context if needed).  
    - **Headline/caption**: Apply strictest scrutiny → Proceed to Step 1.  
    - **Reporter paraphrase**: Proceed to Step 1.  

  ---

  #### **Step 1: Is the Claim Supported by Current Evidence?**  
  **Question**: Is there robust, reproducible evidence (e.g., experiments, observations) that the trait *does* the claimed thing *today*?  
  - **Pass**: Yes (e.g., protein catalyzes reaction X; DNA sequence regulates gene Y).  
  - **Fail**: No (e.g., speculative; no direct evidence).  
  **Outputs**:  
    - **Pass**: → Proceed to Step 2.  
    - **Fail**: → **KILL** the claim (or if in quote, add: "Dr. X claims, but evidence is lacking").  
  **Judgment Call?**: Minimal. Stick to established biological evidence standards.  

  ---

  #### **Step 2: Is Selection History Claimed or Implied?**  
  **Question**: Does the claim imply the trait exists *because* it was selected for this role?  
  - **Clues**: Words like "evolved to," "purpose," "designed for," or context about adaptation.  
  **Outputs**:  
    - **Yes (History claimed)**: → Proceed to Step 3.  
    - **No (History not claimed)**: → **RUN as causal-role function** (use "role" or "effect" in paraphrase/headline).  
  **Judgment Call?**: Low. Focus on explicit language.  

  ---

  #### **Step 3: Can Selection History Be Defended?**  
  **Question**: Is there evidence (e.g., comparative biology, fitness assays, population genetics) that the trait *was* shaped by selection for the claimed function?  
  - **Pass**: Yes (e.g., trait conserved across species; knockout studies show fitness cost).  
  - **Fail**: No (e.g., new co-option; no selection data).  
  **Outputs**:  
    - **Pass**: → **RUN as historical function** (okay to use "function" in all locations).  
    - **Fail**: → Proceed to Step 4.  

  ---

  #### **Step 4: Is the Trait Harmful, Useless, or Co-opted?**  
  **Question**: Does the trait:  
    - (a) Have no current adaptive value?  
    - (b) Cause harm?  
    - (c) Have a new use without selection history?  
  **Outputs**:  
    - **(a) or (b)**: → **RUN as causal-role ONLY** (use "effect," "activity," or "does" in paraphrase/headline).  
    - **(c) New co-option**: → **RUN as causal-role** with caveats (e.g., "newly observed role").  
    - **None of the above**: → **HAND TO EDITOR** (complex case).  
  **Judgment Call?**: High. Weigh evidence for harm/uselessness (e.g., vestigial traits with minor effects).  

  ---

  #### **Step 5: Ambiguity Check**  
  **Question**: Could both camps agree the claim is "true" but mean different things?  
  **Outputs**:  
    - **Yes**: → **REWRITE** to specify:  
      - Historical: "selected to," "evolved role."  
      - Causal-role: "current role," "does," "contributes to."  
    - **No**: → **RUN AS WRITTEN**.  
  **Judgment Call?**: Moderate. If both senses valid, ambiguity is a wording problem, not truth.  

  ---

  #### **Step 6: Location Final Cut**  
  **Outputs by Location**:  
  - **Headline**: Ban vague "function." Use "role," "effect," or "does."  
  - **Caption**: Match headline standard.  
  - **Reporter paraphrase**: Specify historical/causal-role per Steps 1-5.  
  - **Direct quote**: Run verbatim but add clarifying phrase if needed (e.g., "referring to its current role").  

  ---

  ### **Reader-Facing Components**  
  #### **Plain-Language Glosses**  
  - **Historical Function**: "A trait’s function is what it was *naturally selected to do* over evolutionary time."  
  - **Causal-Role Function**: "A trait’s function is the *job it performs now*, regardless of why it evolved."  

  #### **When to Mention the Dispute to Readers**  
  Mention **only if**:  
  - The story hinges on the definition (e.g., ENCODE’s "80% functional" claim).  
  - A major controversy exists (e.g., rival labs feuding).  
  - **Do NOT mention** if: It’s irrelevant to the core finding (e.g., a protein’s new role needs no history lesson).  

  ---

  ### **Crib Card (90-Second Version)**  
  1. **WHERE?** Quote? Run but clarify. Paraphrase/headline? Scrutinize.  
  2. **CURRENT EVIDENCE?** No → KILL. Yes → Next.  
  3. **HISTORY CLAIMED?** No → RUN as "role" or "does." Yes → Next.  
  4. **HISTORY SUPPORTED?** Yes → RUN as "function." No → Next.  
  5. **HARMFUL/CO-OPTED?** Yes → RUN as "role" or "effect."  
  6. **AMBIGUOUS?** Yes → REWRITE to specify historical/causal.  
  7. **HEADLINE/CAPTION?** Ban "function"; use "role," "effect," or "does."  
  **DISPUTE TO READERS?** Only if central to story.  

  ---

  ### **Test Cases**  
  #### **Case 1: ENCODE "80% Functional Genome" Claim**  
  - **Claim**: "80% of the genome is functional."  
  - **Step 1 Pass**: Biochemical activity evidence (e.g., transcription).  
  - **Step 2 Fail**: Press release implies selection history.  
  - **Step 3 Fail**: No evidence 80% was selected for function (junk DNA debates).  
  - **Step 4**: Not harmful/co-opted → HAND TO EDITOR.  
  - **Step 5 Ambiguity**: High (causal-role true; historical false).  
  - **Output**: **REWRITE headline** (e.g., "80% of genome shows biochemical activity"). **Mention dispute** (central to story).  
  - **Desk Hate**: Yes. Headline loses punch; hook gutted.  

  #### **Case 2: Protein’s "New Function" Press Release**  
  - **Claim**: "Protein X has a second function in cell signaling."  
  - **Step 1 Pass**: New assay data.  
  - **Step 2 Fail**: "Function" implies history; press release avoids evolutionary claims.  
  - **Step 3 Fail**: No selection data for new role.  
  - **Step 4(c) Pass**: Co-opted role.  
  - **Output**: **RUN as causal-role** (e.g., "newly observed role in signaling"). No reader dispute mention (not central).  

  #### **Case 3: "Vestigial" Structure with New Role**  
  - **Claim**: "The whale pelvis has a function in reproduction."  
  - **Step 1 Pass**: Anatomical evidence (e.g., supports reproductive organs).  
  - **Step 2 Fail**: Implies historical function (but pelvis was selected for walking).  
  - **Step 3 Fail**: No selection for reproductive role.  
  - **Step 4(c) Pass**: Co-opted role.  
  - **Output**: **REWRITE** (e.g., "The whale pelvis, once vestigial, now supports reproductive organs"). No dispute mention (distinction irrelevant).  

  ---

  ### **Costs and Omissions**  
  #### **What We Dropped**  
  1. **Etiological Nuances**: We ignore "weak" historical accounts (e.g., "maintained by selection" vs. "originally selected for") to avoid complexity.  
  2. **System-Level Functions**: We skip debates about whether a function requires a *system* (e.g., "function for the organism" vs. "molecular effect").  
  3. **Teleology**: We don’t address non-biological "purpose" claims (e.g., "designed for") beyond Step 2.  

  #### **Systematic Errors**  
  - **Co-option False Negatives**: Traits with new uses may be miscategorized as "non-functional" historically (e.g., Step 4 may understate significance).  
  - **Harmful Traits**: A trait with a causal role but net harm (e.g., cancer gene) might be called "functional," risking confusion.  

  #### **Refinements to Historical Account: Worth Adding?**  
  - **Modern History Theory** (Millikan): Function is what the trait *was last selected for*. **Not worth adding**—rarely testable on deadline.  
  - **Causal Role-Hybrids** (Cummins): Function as contribution to a *capacity*. **Not worth adding**—too abstract for news.  
  **Verdict**: Refinements are academic noise for newsrooms. Stick to the core dichotomy.  

  ---  
  **Final Advice**: This procedure catches 95% of disputes. For borderline cases (e.g., Step 4), default to causal-role language ("role," "does")—it’s safer and rarely wrong. Your desk will hate ENCODE rewrites, but readers won’t get bombarded with correction emails.
