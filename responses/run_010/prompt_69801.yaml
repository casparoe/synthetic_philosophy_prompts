prompt: |-
  Doing a master's in philosophy and I've been working through the arguments that say your degrees of belief have to obey the probability rules on pain of being cleaned out by a clever bookie. There's a feature of them I keep running into and I haven't got a word for it, and I'd like to know whether one exists.

  Here's the setup from a seminar exercise. Three runners, exactly one of them wins. I'd pay up to 30p for a £1 ticket on Alice, up to 30p for a £1 ticket on Bob, and — asked separately — up to 80p for a £1 ticket on 'Alice or Bob'. The bookie sells me the third ticket for 78p and buys the first two off me for 32p each. I'm 14p out of pocket and the payouts cancel exactly whichever horse wins. Every one of those three deals cleared my own bar at the moment it was put to me. But if he'd been made to offer the whole thing as one contract, it would have read 'hand over 14p and recieve nothing', and nobody signs that.

  That's the bit I want a name for. My twin in the next room has exactly the same numbers and is facing exactly the same bookie, but he insists on being shown all the offers at once, and he can't be touched. So whatever the vulnerability is, its not sitting in the credences on their own — it's a property of the pair (credences, offer protocol), and you can add it or take it away by changing how the bets get presented, without anyone's mind changing at all.

  Is there an established concept for this? I don't want the nearest label just slapped on it, I want the carving: what the thing is, what it isn't, and where the edges fall. In particular, tell me how it differs from the old objection that these theorems idealise away finite minds, from the way behavioural economists describe people evaluating gambles one at a time rather than as a portfolio, from the version of the argument that runs over time and turns on how you plan to revise, and from the general point that what you pick depends on the menu you're handed. And if nothing fits properly, coin something and define it tightly enough that I can settle the borderline cases — does it still bite when the bookie gets only one approach but I don't know what he'll offer, and does it survive if the one-at-a-time presentation is something I chose for myself rather than something done to me?

  Skip the references, I'll chase those down myself. Answer in exactly five numbered points, two or three sentences each, with nothing before or after them; between them they should cover whether a term exists, the nearest candidates and what each of them misses, the definition you'd give, and where the boundaries lie.
reasoning: |-
  Hmm, the user is a philosophy student working on the Dutch Book argument for probabilistic coherence. They've encountered a vulnerability where separate bets that seem individually acceptable lead to a sure loss when combined, but this loss depends on how the bets are presented—if shown all at once, the problem disappears. They want a precise term for this phenomenon and a clear definition that distinguishes it from related concepts like idealization, portfolio evaluation, diachronic updating, and menu dependence.

  The user is clearly deep into formal epistemology and prefers analytical rigor. They're not just asking for a term; they want conceptual clarity on what this vulnerability is and isn't, including boundary cases like unknown bookie strategies and self-imposed sequential evaluation. Their frustration with "slapped-on labels" suggests they've encountered superficial treatments before.

  I need to identify if there's an established term. The closest concepts are:
  - **Synchronous vs. diachronic Dutch books**: But this is about synchronic bets presented sequentially versus jointly, not about belief revision over time.
  - **Portfolio effects in decision theory**: Relevant but usually framed as cognitive bias ("narrow framing"), whereas here the beliefs themselves are consistent—it's purely about offer structure.
  - **Context dependence**: Too vague; this is specifically about decomposition of composite contracts.

  No existing term perfectly fits. "Composite offer decomposition vulnerability" captures the core: the risk arises from how a set of bets is broken into sub-offers. Key boundaries:
  - **Unknown single offer**: Still vulnerable if the bookie exploits one decomposed bet, as coherence requires robustness against all decompositions.
  - **Self-imposed sequencing**: If the agent chooses to evaluate separately, it's still exploitable unless they recompute globally when faced with the net effect—which would require probabilistic coherence anyway.

  The definition must stress that the vulnerability is in the *pair* of beliefs and presentation method, not beliefs alone. This distinguishes it from:
  1. **Finite minds**: Not about computational limits, as the twin example shows same beliefs avoid loss when shown holistically.
  2. **Narrow framing**: Behavioral econ focuses on cognitive errors; here, the agent rationally accepts each bet given their beliefs—it's the bookie's orchestration that creates loss.
  3. **Diachronic Dutch books**: Those rely on belief revision; this is purely synchronic.
  4. **Menu dependence**: Standard menu effects involve changing preferences; here, preferences are consistent, but net implications are obscured.
answer: |-
  1. No established term specifically targets this vulnerability. The closest is "diachronic incoherence," but it misapplies here as the bets are synchronous; your beliefs remain fixed, and the issue arises purely from sequential offer presentation, not belief revision over time.
  2. "Narrow framing" (from behavioral economics) describes evaluating gambles individually rather than as a portfolio. However, your case differs: you rationally accept each bet given your credences, whereas narrow framing involves cognitive bias; here, the vulnerability persists even without irrationality, stemming solely from the bookie's offer structure.
  3. Define it as **composite offer decomposition vulnerability**: the exploitability arising when (a) an agent's non-probabilistic credences make decomposed sub-offers (e.g., individual bets) seem acceptable when presented separately, but (b) the composite offer (e.g., the net position) would be rejected if presented holistically, enabling a sure loss via orchestrated sub-offers.
  4. Boundaries: It bites with unknown single approaches if the bookie can exploit any one sub-offer (e.g., selling "A or B" alone suffices to lock in loss given your credences). It survives self-imposed sequential evaluation if you lack a mechanism to integrate offers retroactively; coherence requires rejecting vulnerable sub-offers by anticipating their composability.
  5. Contrasts: Unlike idealizing finite minds, this exploits credences directly—your "twin" avoids loss with identical beliefs but holistic view. Unlike diachronic arguments, no belief change occurs. Unlike menu dependence, your preferences are stable; the loss emerges from obscured logical dependencies in the offer protocol, not the menu's content.
