  Okay, the user is building a training module for regulatory professionals about two years into their jobs. They need a theory of "dirty hands" that's relevant to their specific context—enforcement discretion cases, not high-level policy. The example case involves an enforcement attorney who uses a pretext inspection to prevent contaminated water dumping, which later gets the case thrown out. The user wants a spec for what makes a dirty hands theory adequate for this audience, with justifications, and they want me to flag non-negotiables versus preferences. They also want me to analyze three candidate requirements and identify which requirement knocks out most theories.

  First, I need to unpack the key features of their example case: small procedural wrongs (like fabricated paperwork), invisibility initially but discovered later, role morality that might pre-authorize actions, and the residue as something owed rather than just a mood. Classic dirty hands cases (like Walzer's politician who tortures) involve bigger, visible moral violations, so the theory must handle subtler, procedural wrongs within an agent's discretionary authority.

  The user emphasized several unique aspects: the wrong is small-scale and procedural, discovered post-hoc by the targets, and sits within the gray area of role-authorized discretion. The residue needs to be a substantive obligation, not just guilt. This contrasts with Walzer's focus on grave violations where the stakes are existential (e.g., torture to prevent a bomb). Here, the harm is procedural integrity, and the agent's distress might be misinterpreted as mere regret rather than moral residue.

  For the spec requirements, non-negotiables would include handling low-stakes cases and procedural violations because the audience faces these daily. The residue must be substantive—something owed to someone—as mood-based theories fail to capture accountability. Prospectivity is tricky; most theories are retrospective, but trainees need real-time decision tools. However, insisting on a step-by-step guide might oversimplify. The user mentioned that motivated agents shouldn't be able to misuse the theory for self-exculpation, so non-self-exculpation is non-negotiable.

  Now, analyzing the candidate requirements: (a) explaining why the agent isn't off the hook is a real desideratum—role morality doesn't absolve them, so the theory must account for lingering obligations. (b) Prospectivity is desirable but might be a preference; forcing theories into a decision procedure could strip nuance. (c) Non-self-exculpating is non-negotiable; otherwise, the theory becomes a loophole. Distress as substantive? Probably a literary tic—some agents might not feel guilt but still owe amends. The blameworthiness vs. all-things-considered rightness distinction is genuine; it separates justification from accountability, crucial for regulatory roles where actions are procedurally wrong but prevent harm.

  The requirement that knocks out most contenders is the demand for substantive residue as something owed. Many theories (like Williams' agent-regret or Walzer's guilt) focus on emotional residue, which doesn't translate to obligations. Consequentialists might see no residue if the outcome is good, while Kantians reject justified wrongs. This leaves few options, perhaps a hybrid approach like Nagel's moral residue or institutional debt theories.

  Finally, the standard "wrong-yet-right-ATC" formulation survives but needs refinement. It must include that the wrong creates ongoing obligations, not just emotional distress. The residue is external—owed to the violator or the system—making it actionable (e.g., future transparency). Without this, the formulation is insufficient for their audience.
answer: |-
  Here's the spec for a dirty hands theory tailored to your regulatory enforcement audience, derived from your case constraints and operational needs. Requirements are ranked by criticality, with justifications and camp affiliations marked.

  ### Non-Negotiable Core Requirements
  1. **Must explain residue as substantive obligation, not mood**  
     *Why*: In your case, the attorney owes the firm acknowledgment (or systemic repair) for the procedural violation—even after preventing harm. Mood-focused theories (e.g., Williams' "agent-regret") reduce this to psychology, undermining accountability. *Camp conflict*: Rejects purely phenomenological accounts (Williams) and consequentialist dismissal of residue (early Hare).  

  2. **Must operate in low-stakes/procedural violations**  
     *Why*: Classic theories (Walzer’s torture; Nagel’s bombing) require existential stakes. Your case involves fabricated paperwork—minor wrongs endemic to regulatory work. A theory demanding "saving a city" to justify dirt fails here. *Camp conflict*: Excludes high-threshold absolutists and Walzer’s "supreme emergency" framing.  

  3. **Must survive role morality challenges**  
     *Why*: Enforcement roles pre-authorize discretion (e.g., warrantless inspections in emergencies). A theory must show why *this specific act* exceeds role permissions ("fabrication" vs. "expediency") and leaves residue. *Camp conflict*: Consequentialists (e.g., rule-utilitarians) might see no dirt if the role permits it; Kantians see roles as irrelevant to moral constraints.  

  4. **Must be non-self-exculpating**  
     *Why*: A motivated agent could rationalize *any* action as "dirty but necessary." Your theory must include objective checks (e.g., "Would this destroy public trust if revealed?"). *Camp conflict*: Rejects purely internalist accounts (e.g., some virtue ethics) and subjective consequentialism.  

  ---

  ### Contested but Critical (Marked Preferences)
  5. **Should treat discovery/accountability as morally significant**  
     *Why*: In your case, the firm’s later discovery triggers the residue (owed apology/reform). Theories ignoring *who* discovers the dirt (e.g., Nagel’s "blind" violations) miss how accountability shapes obligations. *Preference*: Institutionalists (Thompson) vs. individualists (Sartre).  

  6. **Should distinguish blameworthiness from all-things-considered (ATC) rightness**  
     *Why*: The attorney acted rightly ATC (prevented harm) but is blameworthy for the violation. Conflating these (as pure consequentialists/Kantians do) collapses the dilemma. *Genuine distinction*: Supported by hybrid theorists (Greenspan); rejected by monists.  

  7. **Should function prospectively**  
     *Why*: Trainees need real-time guidance (e.g., "Does this violation create future obligations?"). Most theories are diagnostic, not action-guiding. *Preference*: Pragmatists (Deweyan approaches) vs. interpretive theorists (Walzer).  

  ---

  ### Candidate Requirements Analysis  
  **(a) Explain why agent isn’t off the hook → REAL DESIDERATUM**  
  Role morality can’t fully absorb the wrong (fabrication exceeds reasonable discretion). Residue exists as debt to the violator/system.  

  **(b) Prospectively usable → PREFERENCE (PRAGMATIST CAMP)**  
  A strict "20-minute phone test" risks oversimplification. Better: Provide heuristics (e.g., "Would this need concealment?") rather than algorithms.  

  **(c) Non-self-exculpating → NON-NEGOTIABLE**  
  Without this, the theory becomes a license for bad faith actors (e.g., "I feel bad, so it’s dirty hands"). Must include external anchors (e.g., procedural reciprocity).  

  **Distress Requirement**: *Literary tic*. The attorney might feel pride, not guilt—yet still owe repair. Feeling-centric theories confuse moral residue with psychology.  

  ---

  ### Joint Unsatisfiability Alert  
  **"Substantive residue + Role morality absorption + Low stakes" creates tension**:  
  - If roles authorize wide discretion (e.g., "pretext inspections are routine"), the procedural wrong may vanish.  
  - But if residue *always* exists (requirement 1), roles can’t fully sanitize acts.  
  - **Resolution**: The theory must define role *corruption thresholds* (e.g., fabrication crosses a line; expediency doesn’t). Not all discretion is exculpatory.  

  ---

  ### The Killer Requirement  
  **"Substantive obligation (not mood)" knocks out 90% of theories**:  
  - Walzer: Residue is guilt (mood).  
  - Consequentialists: No residue if outcome good.  
  - Kantians: No "justified wrong" concept.  
  - **Survivors**: Hybrid institutionalism (Thompson), moral residue theorists (Stocker), and reparative-duty accounts.  

  ---

  ### Fate of "Wrong-yet-right-ATC"  
  It **survives but requires amendment**:  
  1. "Wrong" must be a *procedural violation creating obligations* (not just "felt bad").  
  2. "Right-ATC" must acknowledge *role-specific trade-offs* (preventing harm vs. due process).  
  3. **Crucially**: The formulation must embed *who is owed* (the firm) and *how it’s repaid* (systemic change, not self-flagellation).  

  **Verdict**: Viable only if residue is externalized as debt—otherwise, it’s inert theater. Your case demands a *transactional* not *emotional* model.  

  Recommend starting with **Dennis Thompson** (political ethics) and **Bernard Williams** (modified for obligations), then stress-test against your case. Avoid Walzer (too grand) and pure consequentialism (no residue).
