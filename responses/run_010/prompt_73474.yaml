  Draft seven or eight interview questions that get past her just restating this. I want one on Goodman's insistence that the characters of a real notation be syntactically disjoint and finitely differentiated — she'll say notations are an idealization for scores and inscriptions, not for letters as actually read, so give me the follow-up to that. One on whether discriminability is constitutive of being an 'a' or only the causal reason our a's came out shaped that way. One on what her .5 output is: a genuine borderline case, or a measure of our ignorance about a line that's really sharp. One on the double-storey versus single-storey 'a', and on why a Cyrillic а is sometimes the same letter and sometimes not. And one asking whether the view proves too much — if letter identity is holistic and system-relative, does adding a 27th character change what every previous 'a' was? Each with a follow-up keyed to the answer she's most likely to give, and please nothing about what drew her to the field.
