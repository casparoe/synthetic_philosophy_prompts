  Looking at their bullet points, they want to cover key arguments like temporary intrinsics, relativity, vagueness, statue/clay, worms vs stages, change, falsifiability, and practical applications. Each question needs follow-ups that "bite" based on the guest's response. They also emphasize avoiding misrepresentations of the debate's current state, so I should note where consensus exists and where disputes are ongoing.

