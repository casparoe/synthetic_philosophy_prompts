answer: |-
  Here's a set of 8 targeted questions with biting follow-ups, structured to force substantive engagement on your key points. Each includes a **Consensus Check** note clarifying where the debate stands among specialists. I've corrected minor misimpressions in your bullets (noted below).

  ---

  ### **1. The Core Argument: Temporary Intrinsics**
  **Question:** "Lewis argued that only temporal parts solve the problem of temporary intrinsics – my bent-at-t phenomenon can’t be identical to my straight-at-t2 self if objects endure wholly. Endurantists reply that ‘bent’ is a relational property: bent-*at-t*. Why isn’t that sufficient?"  
  *(Consensus Check: All agree this reply is available to endurantists. The fight is over whether it’s adequate. Lewis/Sider think it fails; Lowe/van Inwagen defend it.)*

  *   **Likely Answer A:** "Because it makes change extrinsic – the object itself doesn’t change, only its relations do."  
      **Follow-up:** "But isn't *all* change relational on *any* view? Even on 4D-ism, 'change' just means temporal part P1 has F and part P2 lacks F – that's also a relation (difference) between parts. So how is your 'extrinsic change' objection not equally fatal to *your own* account of change?"  
      *(Bites: Forces him to define "genuine change" in a way that doesn't boomerang.)*

  *   **Likely Answer B:** "The 'relation to time' just smuggles in temporal parts – 'bent-at-t' describes a *temporal slice*."  
      **Follow-up:** "Then isn't this a verbal dispute? If the endurantist says 'No, the *whole* object is bent-at-t without parts,' and you insist this *must* refer to a part, what non-question-begging argument shows they're wrong?"  
      *(Bites: Challenges the charge of "smuggling" as circular.)*

  ---

  ### **2. Relativity: Eternalism vs. 4D-ism**
  **Question:** "Special Relativity undermines absolute simultaneity, supporting eternalism (all times equally real). But eternalism doesn't *entail* 4D-ism – you could have enduring objects 'stretched across' the block universe. What *additional* premise gets you from relativity to temporal parts?"  
  *(Consensus Check: Specialists agree relativity strongly supports eternalism but *not* necessarily 4D-ism. Linking them requires extra argumentation.)*

  *   **Likely Answer:** "Relativity requires that objects have properties relative to reference frames. Only temporal parts can instantiate frame-relative properties like 'simultaneity' or 'shape'."  
      **Follow-up:** "Why can't the *whole* enduring object instantiate the relational property 'has shape S relative to frame F'? Isn't denying this just assuming 4D-ism from the start?"  
      *(Bites: Forces him to justify why frame-relativity *requires* parts, not just relational properties.)*

  ---

  ### **3. Vagueness Argument & Epistemicism**
  **Question:** "Sider's argument from vagueness says if there were no temporal parts, there'd be vagueness in the world (e.g., when exactly I ceased to exist), but vagueness is only semantic, so temporal parts must exist with sharp boundaries. What if the endurantist bites the bullet and says vagueness *is* ontological, or goes epistemicist – there *are* sharp cutoffs, we just can't know them?"  
  *(Consensus Check: This is hotly contested. Sider thinks epistemicism fails here; Williamson/Cameron think it can work. No consensus.)*

  *   **Answer A (Survives):** "Epistemicism about persistence is implausible – it posits unknowable, arbitrary facts about identity."  
      **Follow-up:** "But isn't your view *also* committed to arbitrary facts? You say there's a precise temporal part corresponding exactly to 'Ted from 8am-9am'. Why is *that* cutoff less arbitrary than an epistemicist's persistence cutoff?"  
      *(Bites: Highlights arbitrariness in *both* views.)*

  *   **Answer B (Concedes):** "Fine, the vagueness argument isn't decisive alone; it's part of a cumulative case."  
      **Follow-up:** "Doesn't conceding this significantly weaken the case? If the *only* argument forcing sharp boundaries fails, why not accept vague objects or epistemicism, avoiding the explosion of temporal parts?"  
      *(Bites: Presses the cost of multiplying entities if the key motivation is gone.)*

  ---

  ### **4. Statue/Clay & Counting**
  **Question:** "4D-ism resolves the statue/clay puzzle by saying they share temporal parts *only while coincident*. But if I destroy the statue at t2 while reshaping the clay, they now have *different* temporal parts after t1. So at t1, weren't there still two numerically distinct objects (statue-worm, clay-worm) wholly occupying the same space? How is that better than endurantist coincidence? And how many things *are* on my desk right now?"  
  *(Consensus Check: Specialists agree 4D-ism *allows* this, but debate whether it's a cost. Sider embraces it; Merricks attacks it.)*

  *   **Likely Answer:** "Yes, there are two distinct spacetime worms overlapping at t1. That's fine! Counting is always relative to a sortal: 'how many statues?' vs 'how many lumps of clay?'."  
      **Follow-up:** "So on your view, *right now*, there are actually thousands (millions?) of overlapping spacetime worms where I see 'one chair' – the chair-worm, the wood-worm, the leg-worm, etc. Does this ontological profusion – vastly more entities than common sense recognizes – not count significantly against the view? Isn't Ockham spinning in his grave?"  
      *(Bites: Makes the radical ontological commitment explicit and challenges its plausibility.)*

  ---

  ### **5. Worms vs. Stages: Pick Your Poison**
  **Question:** "Do you take spacetime worms or instantaneous stages as fundamental? Worm-theory or stage-theory?"  
  *(Consensus Check: Deep divide *among* 4D-ists. Sider (worms) vs. Hawley (stages). No consensus.)*

  *   **Answer A (Worms):** "Worms are fundamental."  
      **Follow-up:** "Then how do you solve the 'problem of the many' for worms? Is there one precise Ted-worm, or trillions of slightly different worms differing by a nanosecond or a few atoms? If the latter, why isn't this just as bad as the statue/clay profusion? If the former, what determines its exact boundaries non-arbitrarily?"  
      *(Bites: Applies the statue/clay counting problem directly to the person.)*

  *   **Answer B (Stages):** "Stages are fundamental."  
      **Follow-up:** "Then when I say 'I was a child', that stage no longer exists. You say this is true because my *current* stage bears a 'counterpart relation' to a past child-stage. But doesn't this mean ordinary statements about persisting objects are *systematically false*? They're really about counterparts, not identity. Isn't this a massive error theory about language?"  
      *(Bites: Highlights the radical semantic revisionism required.)*

  ---

  ### **6. The Illusion of Change?**
  **Question:** "If only temporal parts have intrinsic properties, then no *single thing* changes. Different temporal parts just have different properties. So what, on your view, actually *is* change? Haven't you eliminated it?"  
  *(Consensus Check: 4D-ists generally bite this bullet. Change = variation between temporal parts. Most see it as a feature, not a bug.)*

  *   **Likely Answer:** "Change *is* variation in properties across the temporal parts of an object. That's all it ever was!"  
      **Follow-up:** "But pre-theoretically, when I say 'the leaf changed color', I mean the *same leaf* went from green to red. On your view, no leaf *has* different colors; green-part and red-part are distinct entities. Isn't this a complete revision of the concept, making 'change' just a label for difference? Shouldn't we just say 'change is an illusion'?"  
      *(Bites: Forces him to admit the radical reconception and challenges whether it preserves the phenomenon.)*

  ---

  ### **7. What Would Move You?**
  **Question:** "What specific, concrete discovery, argument, or intuition – not abstract methodology – would genuinely make you reconsider and potentially abandon 4D-ism for endurantism?"  
  *(Consensus Check: Metaphysics often struggles with clear defeaters. Many think arguments turn on fundamental intuitions/judgments.)*

  *   **Answer A (Names something):** E.g., "A coherent account of change without temporal parts," or "Proof that vagueness is ontological."  
      **Follow-up:** "Interesting. [Probe specifics: Why that? How likely is it? Does existing endurantist work X not already do this?]"  
      *(Bites: Tests the robustness of the proposed defeater.)*

  *   **Answer B (Nothing concrete / It's the best theory):** "It's the most coherent framework given our best physics/metaphysics."  
      **Follow-up:** "If there's *no* conceivable evidence or argument that could falsify 4D-ism or make endurantism superior, doesn't that render it untestable and potentially unscientific – more a paradigm than a falsifiable theory? Shouldn't that worry us?"  
      *(Bites: Highlights unfalsifiability without you needing to say the word. Lets the audience draw the conclusion.)*

  ---

  ### **8. Consequences: Databases & Version Control**
  **Question:** "In software, we track identity over time constantly: database records with version histories, git commits for code states. This looks *superficially* like temporal parts (each commit is a 'stage', the repo is the 'worm'). Does 4D-ism provide a *metaphysically grounded* framework for understanding this, or is it just a useful analogy? Could an endurantist model of 'enduring records with historical properties' work just as well?"  
  *(Consensus Check: This is illustrative/analogical, not a core argument. 4D-ism *fits* versioning well, but endurantists can model it relationally. Real connection is conceptual utility, not necessity.)*

  *   **Likely Answer:** "It shows the concept is coherent and useful! The 4D structure mirrors how we naturally model temporal data."  
      **Follow-up:** "But engineers aren't committed to the *ontological reality* of each commit as a distinct temporal part object. We could model it as one enduring record with a 'history' property listing its states. So doesn't this just show 4D-ism is a *useful model*, not necessarily the *true metaphysics*? Why should the engineer care about the underlying ontology?"  
      *(Bites: Separates useful modeling from ontological commitment, questioning the practical relevance.)*

  ---

  **Key Corrections/Clarifications on Your Bullets:**
  1.  **Temporary Intrinsics:** Your understanding is correct. The debate is precisely over whether the relational reply *succeeds*.
  2.  **Relativity:** Spot on. Eternalism ≠ 4D-ism. Good catch.
  3.  **Vagueness:** Yes, epistemicism is the main escape hatch. The argument's vulnerability here is widely acknowledged.
  4.  **Statue/Clay:** Correct on the "outlives" case causing partial overlap. The counting objection is potent.
  5.  **Worms vs. Stages:** Perfect – this is *the* internal divide for perdurantists.
  6.  **Change:** Your objection is standard and fair. 4D-ists redefine it.
  7.  **Databases:** It's a *real* analogy (temporal parts model versioning perfectly), but not a *necessary* one (endurantists can use relational models). Worth including, but frame it as conceptual utility.

  **Execution Tip:** After his initial answer to each question, pause slightly before unleashing the follow-up. This signals you're engaging deeply, not just reading a script. Good luck – your prep already puts you ahead of 90% of interviewers!
