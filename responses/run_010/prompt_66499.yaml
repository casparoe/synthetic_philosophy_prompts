  5-20: Rounds 1-10 (15 min, 1.5 min per round)
  20-35: Betting rounds 11-15 (15 min, 3 min per round)
  35-40: Reveal device types and final scores
  40-75: Debrief (35 min) - we can use the time.

  Now, the debrief in three parts:

  1. Map each phase to the argument:
     - Rounds 1-5: This is like using the device's self-report (e.g., the gas gauge's self-check) to conclude it is reliable without independent verification. This is premise-circular because one must assume the device is reliable to take the self-report as evidence.
     - Rounds 6-10: This is like using the device's readings and then independently verifying them. This is rule-circular in a broader sense (using the rule and then checking by independent means) but is not vicious because of the independent check.
     - The closure step: The overall move from the record of self-reports to the conclusion of reliability (in rounds 1-5) is what generates easy knowledge and bootstrapping.
     - The betting phase: This is where they act on their confidence, and it shows that the procedure in rounds 1-5 did not provide truth-conducive justification.

  2. Theoretical exits:
     - If a group refused to certify in rounds 1-5 (marked "N"): This corresponds to refusing to accept the device's self-report without prior warrant. Cost: they might underuse a reliable device.
     - If a group always certified in rounds 1-5 but then in rounds 6-10 saw that it was sometimes wrong and became less confident: This corresponds to restricting closure or transmission until independent checks are available. Cost: it requires independent checks, which are not always available.
     - If a group always certified and then bet high even with an unreliable device: This is like endorsing bootstrapping. Cost: it leads to false beliefs and poor decisions.

  3. Attach names: We can say that the first exit is like externalist restrictions (e.g., one must have independent access to the reliability of the instrument), the second is like internalist demands for independent verification, and the third is like reliabilism without a safety condition.

  But we don't attach names until the end.

  Now, what will go wrong:

  1. A group notices the check-output never disagrees and infers the trick early.
     - Fix: The instructor can say: "The device's behavior is what it is. You must work with the data you have." And remind them that the point is to experience the procedure.

  2. A group refuses to certify and stalls.
     - Fix: Encourage them to play by the rules and make a decision. If they refuse, they will have to bet in the betting phase anyway.

  3. Groups with reliable devices finish at the top and conclude bootstrapping works.
     - In the debrief, we will reveal that some groups had reliable devices and some didn't. The point is that for the unreliable groups, the same self-confirming record was generated, but they lost in the betting phase. So bootstrapping only "works" if the device is reliable, but the procedure doesn't tell you if it is.

  4. Students playing the scoreboard rather than the reasoning.
     - The instructor can remind them that the point is to think about the epistemology, not to win. In the debrief, we will focus on the reasoning.

  Contingency for 6 students: 3 groups of 2. The game scales down.

  Gaps:

  1. The reveal at the end hands them the independent check, so they might think bootstrapping fails only if you get caught.
     - In the debrief, emphasize: "Imagine you never had rounds 6-10 or the betting phase. You would have a perfect self-confirming record. But for the unreliable groups, that record would be just as perfect, even though the device is broken. The procedure doesn't discriminate between reliable and unreliable devices."

  2. Students have reflective access that the agents in the literature don't.
     - We can't remove that, but we can point it out: "In real life, we don't get to see the hidden state. We are like in rounds 1-5. The device's self-report is all we have. And then we bootstrap."

  In the last five minutes, we must emphasize the modal point: the procedure would produce the same record regardless of reliability, so it's not truth-conducive.

  Materials to prepare:

  - Instructor: 
     - Master sheets for 7 groups (or 3 if only 6 students) with pre-generated hidden states and readings for rounds 1-15. For each group, assign type (reliable or unreliable) and then generate readings accordingly.
     - Output cards for rounds 1-10 for each group (one per round per group). Each card has "Reading: [H/T]" and "Check-output: OK".
     - For rounds 6-10, the instructor also has the hidden state to reveal.
     - For betting rounds 11-15, output cards with only the reading.

  - Groups:
     - Certification log worksheet (one per group) with a table for rounds 1-10 and a table for rounds 11-15.
     - Pens.

  Let's write the certification log worksheet:

  **Certification Log for Rounds 1-10**

  Group #: _____

  | Round | Reading | Check-output | For Rounds 1-5: Certification (Reliable? Y/N) | For Rounds 6-10: Hidden state (revealed) | Device Correct? (Y/N) |
  |-------|---------|--------------|----------------------------------------------|------------------------------------------|-----------------------|
  | 1     |         |              |                                              |                                          |                       |
  | 2     |         |              |                                              |                                          |                       |
  | ...   |         |              |                                              |                                          |                       |
  | 10    |         |              |                                              |                                          |                       |

  **Betting Rounds 11-15**

  Starting score: 100 points.

  | Round | Reading | Bet amount (0 to current score) | Actual hidden state | Outcome (Win/Loss) | New score |
  |-------|---------|---------------------------------|---------------------|--------------------|-----------|
  | 11    |         |                                 |                     |                    |           |
  | 12    |         |                                 |                     |                    |           |
  | 13    |         |                                 |                     |                    |           |
  | 14    |         |                                 |                     |                    |           |
  | 15    |         |                                 |                     |                    |           |

  Total score after round 15: _____

  Now, the rules for the game:

  **Rules for the Game**

  1. **Roles**:
     - **Reporter**: Receives the device output for each round from the instructor and announces it to the group. For rounds 6-10, also receives the hidden state from the instructor after the group has recorded the reading and check-output.
     - **Certifier**: Records the reading and check-output in the log. For rounds 1-5, decides whether to certify the device as reliable for that round (mark Y or N) based on the check-output. For rounds 6-10, records the hidden state and whether the device was correct. In the betting rounds, decides how much to bet and records the outcomes.

  2. **Rounds 1-10**:
     - In each round, the instructor gives the Reporter a card with the reading and check-output.
     - The Reporter announces them.
     - The Certifier records the reading and check-output.
     - For rounds 1-5: The Certifier must decide whether to certify the device as reliable for that round (mark Y or N) based solely on the information in that round (which is the reading and check-output). They must do this before moving to the next round.
     - For rounds 6-10: After recording the reading and check-output, the instructor will reveal the hidden state for that round to the Reporter, who announces it. The Certifier then records the hidden state and whether the reading was correct.

  3. **Betting Rounds 11-15**:
     - The group starts with 100 points.
     - In each betting round, the instructor gives the Reporter the reading for that round.
     - The group decides how much to bet (an integer between 0 and their current score) that the reading is correct.
     - The Certifier records the bet amount.
     - The instructor then reveals the hidden state.
     - If the reading matches the hidden state, they win: add the bet amount to their score.
     - If not, they lose: subtract the bet amount from their score.
     - The Certifier records the outcome and updates the score.

  4. **Scoring**:
     - The group's final score is their score after round 15.
     - The group with the highest score wins (but the point is the lesson, not winning).

  Finally, the debrief:

  **Debrief Structure**

  1. **Map to the argument** (10 minutes):
     - Rounds 1-5: This is the bootstrapping move. The device's self-report (check-output) is taken as evidence of its own reliability. But this is premise-circular: to trust the check-output, you must already trust the device. However, the groups did it anyway because the check-output was positive.
     - Rounds 6-10: Here, the same type of inference (from the device's output to the hidden state) is followed by an independent check. This is not circular because of the independent verification. It is rule-circular in the sense that you are using the rule to get the belief and then checking the rule, but it is not vicious because of the independent check.
     - The betting phase: Shows the practical consequence of the certification. If they over-certified (prematurely trusted an unreliable device), they lost points.

  2. **Theoretical exits** (10 minutes):
     - Exit 1: Refusing to certify in rounds 1-5. This avoids bootstrapping but might lead to underuse of a reliable device. (This corresponds to requiring prior warrant for the instrument's reliability.)
     - Exit 2: Using only the independent checks (rounds 6-10) to update confidence. This is safe but requires independent checks, which are not always available. (This corresponds to restricting closure or transmission to cases with independent verification.)
     - Exit 3: Accepting bootstrapping and possibly losing in the betting phase. (This is the problem of easy knowledge.)

  3. **Attach names** (5 minutes):
     - The bootstrapping problem is raised by Vogel and others.
     - The distinction between premise-circular and rule-circular is from van Cleve.
     - Positions: Reliabilism might be thought to allow bootstrapping, but it leads to easy knowledge. Internalists might reject bootstrapping but face the cost of scepticism or demandingness.

  **Honest note on gaps**:

  - The reveal (rounds 6-10 and betting) gives an independent check, which might make students think the problem is just about being caught. To close this, emphasize in the debrief: "The point is that in rounds 1-5, you had no independent check. For the unreliable groups, the device was broken but the record looked perfect. The procedure in 1-5 is not truth-conducive because it would produce the same record regardless of reliability."

  - Reflective access: Students know they are in an experiment. Real epistemic agents don't. But the structure of the problem is the same: the agent only has the device's outputs. We can say: "In real life, you are in the position of rounds 1-5: you don't get independent checks. The bootstrapping problem asks: can you gain knowledge of the device's reliability from its own outputs? The game shows that the procedure is not truth-conducive because it would produce the same record for a broken device."

  We must supply by hand: the modal point (the record would be the same even if broken) and the fact that in real life we don't get independent checks.

  This design should work.
answer: |-
  Below is a complete design for your in-class game, structured to meet your specifications while addressing the bootstrapping problem and easy knowledge. The game focuses on the core realization that the issue isn't easily identifiable circularity but the lack of truth-conduciveness—the same self-confirming record arises regardless of the instrument's reliability. I've refined your stipulations for clarity, feasibility, and pedagogical impact.

  ### **Game Overview**
  **Title:** The Reliability Gauntlet  
  **Core Realization:** Students experience that self-certification (using an instrument's outputs to confirm its reliability) is not truth-conducive—a broken instrument generates an identical record of self-confirmation as a reliable one. This surfaces the bootstrapping pathology without relying on circularity as the primary villain.  

  **Groups and Roles:**  
  - 7 groups of 2 students (scalable to 3 groups if only 6 students attend).  
  - **Reporter:** Sees the instrument's outputs (reading and check-output) and announces them aloud. Cannot touch the certification log or authorize bets.  
  - **Certifier:** Maintains a written certification log, decides whether to "certify" the instrument each round, and is the only one who can authorize bets. Must record reasoning briefly for debrief.  
  **Why division of labor matters:** It mirrors the epistemology of "who holds which belief"—e.g., the Reporter "receives" evidence (like perception), while the Certifier "evaluates" it (like reasoning). This forces groups to confront how beliefs are formed from distributed inputs.

  ---

  ### **Materials List (All Print-Ready on 2 Pages)**
  **Page 1: Group Worksheets (Print one per group)**  
  - **Certification Log:** A table for rounds 1–10 with columns:  
    `Round | Reading (R) | Check-Output (C) | Certification? (Y/N) | Independent Check? (If applicable) | Notes`  
  - **Betting Log:** A table for betting rounds:  
    `Round | Reading | Bet Amount (0-10) | Outcome (Win/Loss) | Points Change | Total Points`  
  - **Role Reminders:**  
    - Reporter: "You receive the instrument's outputs. Announce R and C aloud. Do not write on the log."  
    - Certifier: "You record R and C. Decide certification (Y/N) based on rules. Only you can authorize bets."  

  **Page 2: Instructor Materials (Print one master copy)**  
  - **Device Output Sheets:** 7 sets (one per group), each with 10 rounds of pre-generated outputs. Each round has two lines:  
    - Line 1: Reading (R: "H" or "T")  
    - Line 2: Check-Output (C: "OK" for all rounds)  
  - **Hidden State Key:** A master table for the instructor with:  
    `Group | Device Type | Rounds 1-10: Hidden State (H/T) | Rounds 11-15: Hidden State (H/T)`  
  - **Device Construction:**  
    - **Reliable Device (3-4 groups):** R matches the hidden state (e.g., hidden state H → R = H). C always "OK".  
    - **Unreliable Device (3-4 groups):** R is random (50% H/T, uncorrelated with hidden state). C always "OK".  
    **Why this works:** Both devices produce identical outputs (R and C) from the group's perspective. The unreliable device's C always says "OK" while R is random, simulating a broken instrument that self-confirms. Outputs are pre-generated using coin flips to ensure randomness.  
  - **Tokens:** 70 small tokens (e.g., poker chips, paper clips)—10 per group for betting. Use a whiteboard for scoring if tokens are impractical.  

  ---

  ### **Rules and Procedures**  
  **Objective:** Certify the instrument's reliability over 10 rounds, then bet on its accuracy in 5 betting rounds. Maximize points.  
  **Scoring:**  
  - Groups start with 0 points.  
  - **Betting Payoffs:**  
    - Win: Gain bet amount.  
    - Lose: Lose bet amount.  
    - **Costs:** Overconfidence (betting high on an unreliable device) loses tokens; underconfidence (betting low on a reliable device) misses gains. Groups that decline to certify/bet cannot win (max score = 0).  
  **Rounds 1–10 (Certification Phase):**  
  1. **Rounds 1–5 (Premise-Circular Task):**  
     - Instructor gives the Reporter a card with R and C for the round.  
     - Reporter announces R and C (e.g., "Reading: H, Check-Output: OK").  
     - Certifier records R and C in the log.  
     - **Certification Decision:** Certifier must choose "Y" (certify) or "N" (not certify) based *only* on C. **Rule:** "If C = 'OK', you may certify the instrument as reliable for this round."  
     - *No hidden state is revealed.* This forces premise-circularity—groups must interpret C as evidence of reliability without independent access, effectively assuming reliability to justify itself.  
  2. **Rounds 6–10 (Rule-Circular Task with Asymmetry):**  
     - Same as above, but after certification, the instructor reveals the hidden state (from the master key).  
     - Certifier records if R matched the hidden state (independent check).  
     - **Certification Decision:** Certifier again chooses "Y" or "N" based on C.  
     - *Why asymmetry:* Here, the same inferential pattern (using C to certify) is legitimate because the independent check validates it. Groups experience a "split verdict"—rounds 1–5 feel fishy, rounds 6–10 feel justified.  
  3. **Key Constraint:** Groups cannot revisit past rounds until the betting phase.  

  **Rounds 11–15 (Betting Phase):**  
  - Instructor gives Reporter R for the betting round (no C).  
  - Certifier decides bet amount (0–10 tokens) based on their certification log.  
  - Instructor reveals hidden state.  
  - If R matches hidden state, group wins bet amount; else, loses it.  
  - Certifier updates points.  

  ---

  ### **Timeline (75 Minutes Total)**  
  - **0–5 min:** Introduce the game. Assign groups/roles. Hand out worksheets. Explain rules: "Your goal is to certify a mysterious instrument and use it to bet. The Reporter sees outputs; the Certifier decides and bets."  
  - **5–20 min: Rounds 1–5.** Instructor distributes output cards (5–10 sec per group per round). Groups complete one round every 2 minutes. Focus: Premise-circular certification.  
  - **20–35 min: Rounds 6–10.** Same as above, but instructor reveals hidden state after certification (adds 15 sec per round). Focus: Rule-circularity with independent checks.  
  - **35–50 min: Betting Rounds 11–15.** 3 min per round. Certifiers bet tokens.  
  - **50–55 min: Scoring and Reveal.** Tally points on the board. Reveal which groups had reliable/unreliable devices.  
  - **55–75 min: Debrief** (structured below).  

  ---

  ### **Mid-Game Student Questions and Answers**  
  1. **"Is the check-output independent of the reading?"**  
     - Answer: "The check-output is part of the instrument's report. You must interpret it based on what it says and the rules."  
     - *Why:* Avoids revealing the trick (C is independent of R only for unreliable devices) without stonewalling.  

  2. **"May we simply stop and tally how often the device has been right?"**  
     - Answer: "You may review your log, but remember: for rounds 1–5, you don't know if it was right. For rounds 6–10, you do. Your certification decisions must be made round-by-round as per the rules."  
     - *Why:* Prevents groups from "solving" the game early by tallying, forcing them to experience incremental certification.  

  3. **"May we assume reliability in order to interpret the device's self-report?"**  
     - Answer: "Your certification decisions must be based on the instrument's outputs and the rules. Whether you assume reliability is up to your group's epistemic policy."  
     - *Why:* Lets groups wrestle with premise-circularity but doesn’t endorse/reject it.  

  ---

  ### **Debrief (20 Minutes)**  
  **Part 1: Map Game to Argument Components**  
  - **Rounds 1–5 (Premise-Circular):** Represents the "self-report" step (e.g., Vogel's gas gauge checking itself). Groups use C ("OK") to conclude reliability, but this requires assuming reliability to interpret C—a premise-circular move.  
  - **Rounds 6–10 (Rule-Circular with Asymmetry):** Represents "application + independent check." Groups apply the rule ("trust C") and then verify reliability via the hidden state—rule-circular but truth-conducive.  
  - **Betting Phase:** Shows the "higher-order conclusion" in action—overconfidence with unreliable devices loses points, illustrating easy knowledge pathology.  
  - **Core Realization:** The problem in rounds 1–5 isn't circularity (which feels similar to 6–10) but lack of truth-conduciveness—the same record of "OK"s would exist even with a broken device.  

  **Part 2: Theoretical Exits and Costs**  
  - **Exit 1: Refuse to Certify (Always "N" in Rounds 1–5)**  
    - *Corresponds to:* Rejecting bootstrapping by demanding independent warrant for reliability upfront.  
    - *Cost:* Underuse of reliable instruments (missed gains in betting). Leads to skepticism—if applied broadly, it blocks knowledge from instruments altogether.  
  - **Exit 2: Only Certify with Independent Checks (Rounds 6–10)**  
    - *Corresponds to:* Restricting closure/transmission—allowing certification only after independent verification.  
    - *Cost:* Impoverished epistemology—many real-world instruments (e.g., gas gauges) lack accessible independent checks.  
  - **Exit 3: Always Certify (Always "Y")**  
    - *Corresponds to:* Endorsing bootstrapping/easy knowledge.  
    - *Cost:* Overconfidence with unreliable devices (catastrophic losses in betting). Violates truth-conduciveness.  

  **Part 3: Attach Names to Positions**  
  - **Exit 1** mirrors "Infallibilism" or "Cartesianism": Requires certainty for justification.  
  - **Exit 2** aligns with "Modest Foundationalism": Allows basic knowledge but restricts transmission without independent checks.  
  - **Exit 3** reflects "Liberal Reliabilism": Permits bootstrapping if the instrument is reliable, but ignores modal failure.  
  - **The Problem:** Van Cleve’s premise-circularity is present in rounds 1–5, but the deeper issue (truth-conduciveness) is Vogel’s point: bootstrapping fails because a broken device would produce the same record.  

  ---

  ### **Predictable Failures and Fixes**  
  1. **Group Infers the Trick Early (Notices C Always "OK")**  
     - **Fix:** In mid-game answers, emphasize interpreting outputs per rules. In debrief, use them as an example: "This group sensed the lack of truth-conduciveness—why did that feel unsatisfying?"  
     - **Contingency:** If they vocalize it, respond: "Hold that thought for debrief. For now, play out the procedure."  

  2. **Group Refuses to Certify/Stalls**  
     - **Fix:** Remind them that underconfidence is costly (they can’t win with 0 points). If they resist, say: "You must make a decision—even 'N' is a choice."  
     - **Contingency:** Assign a "default" bet of 0 tokens if they stall in betting.  

  3. **Reliable Groups "Win" and Conclude Bootstrapping Works**  
     - **Fix:** In scoring, highlight that unreliable groups *also* had perfect self-confirmation records (all "OK"s) but lost. Stress: "If your device was unreliable, would your certification have changed? No—the procedure isn’t truth-conducive."  

  4. **Students Play the Scoreboard, Ignoring Reasoning**  
     - **Fix:** In the intro, frame it as an "epistemic experiment," not a game. During play, ask probing questions: "Why did you certify that round?" Record reasons for debrief.  

  **Contingency for 6 Students:** Run 3 groups of 2. Reduce devices to 3 (2 reliable, 1 unreliable). Shorten rounds to 8 total (4 certification, 4 betting) to fit time.  

  ---

  ### **Honest Note on Gaps and How to Close Them**  
  **Gap 1: The Reveal Undermines the Modal Point**  
  - **Problem:** Independent checks (rounds 6–10 and betting) provide external validation, risking the lesson: "Bootstrapping fails because you got caught," not "it fails because it’s not truth-conducive."  
  - **Can the Design Close It?** Partially. The pre-generated hidden states for rounds 1–5 are never revealed during certification, so groups experience the void. But the reveal at the end may overshadow this.  
  - **How to Supply It:** In the last 5 minutes, say:  
    > "In rounds 1–5, you had no independent check—just like real epistemology. Your unreliable groups generated perfect self-confirmation records. That’s the modal point: whether your device was reliable or broken, the record was identical. Bootstrapping pathologies aren’t about being ‘caught’; they’re about the procedure’s inability to distinguish truth from falsehood. You must take on trust that this is replicable in real cases—like Vogel’s gas gauge—where no independent check exists."  

  **Gap 2: Reflective Access**  
  - **Problem:** Students know they’re in a game, while epistemic agents in literature (e.g., Vogel’s driver) lack this awareness. This may dilute the "internal" experience.  
  - **Can the Design Close It?** No. The game cannot simulate non-reflective agents without deception (unethical).  
  - **How to Supply It:** Say:  
    > "Real agents don’t know they’re in a ‘bootstrapping scenario.’ They just trust their instruments. You had the luxury of skepticism because you knew it was an experiment. That’s why bootstrapping is insidious—it exploits our default trust. In the wild, this leads to invisible failures."  

  **Final Advice:** Emphasize trust in the modal point during debrief. Use the unreliable groups’ identical logs as physical proof. The gaps require you to verbally reinforce that bootstrapping’s failure is about possible worlds (what *would* happen) and everyday epistemic vulnerability.  

  This design meets your core goals: Students *feel* the bootstrapping problem, confront circularity vs. truth-conduciveness, and leave with a targeted realization. Run it as-is, and adapt contingencies as needed.
