  ## Research Proposal: Epistemic Constraints and Decision Theory in Unbounded St. Petersburg Games

  **1. Research Question:**  
  *Can epistemic constraints – specifically, the costs associated with acquiring and verifying the parameters of a St. Petersburg-type game – resolve the paradox by rendering the infinite expected utility calculation pragmatically inaccessible or normatively irrelevant to a bounded rational agent, and does this necessitate an amendment to expected utility theory (EUT) or merely an explicit incorporation of its implicit epistemic assumptions?*

  **2. Motivation and Gap Analysis:**  
  The St. Petersburg paradox (SPP) demonstrates that EUT, when applied naively to unbounded games, prescribes paying arbitrarily large entry fees despite vanishingly small probabilities of realizing substantial gains. Standard resolutions impose bounds:

  *   **Bounded Utility (e.g., Bernoulli, Samuelson):** Imposes concavity, ensuring convergence. *Critique:* This appears ad hoc; any proposed bound invites a modified game exceeding it (e.g., payoffs = 2^(2^n)), recreating the divergence. It sidesteps the core issue of evaluating genuinely unbounded prospects under standard EUT axioms.
  *   **Bounded Resources (e.g., Casino Bankroll):** Caps maximum payout (L). Expectation collapses to ~L + 1 (or log₂(L) + 1 for wealth-relative utility). *Critique:* This resolves the *practical* problem but not the *conceptual* one. The paradox persists theoretically for agents facing entities with *apparently* unlimited resources. The resolution depends entirely on an external, often opaque, constraint.
  *   **Finite Plays & Long-Run Growth (e.g., Kelly Criterion):** Ranks alternatives by expected log-wealth growth, ensuring convergence. *Critique:* This is a compelling alternative *norm* for repeated play, but it doesn't address the single-shot decision problem where EUT is typically applied. It replaces, rather than resolves within, standard EUT.
  *   **Conditional Convergence (e.g., WLLN violations):** Focuses on series whose sum depends on order. *Distinction:* This proposal targets games where the *expectation series diverges absolutely* (like the canonical SPP), not conditionally convergent series. The pathology is fundamental divergence, not sensitivity to ordering.

  **The Gap:** All existing resolutions bound the game's *payoff structure* or *evaluation norm*. Crucially, they assume the agent possesses *costless, perfect knowledge* of the relevant bound (L) or the precise probability distribution. This neglects the *epistemic process*: How does a real agent *ascertain* that the casino's bankroll is 2^L? How do they *verify* the coin's fairness for astronomically unlikely high-payout events? Acquiring this knowledge is non-trivial and costly.

  **3. Core Hypothesis:**  
  The paradox dissolves not by bounding payoffs, utilities, or plays, but by recognizing that *establishing the credibility and parameters of the game itself incurs costs that scale with the very factors making the expectation large*. Specifically:
  1.  **Costly Verification:** Confirming the feasibility/cap (L) for high-n outcomes requires investigation (due diligence). The cost plausibly scales with the *magnitude* or *complexity* of what needs verification (e.g., auditing funds for 2^100 vs. 2^10). A simple model: cost = c·L, where c is a cost per "doubling" of the cap.
  2.  **Net Value Collapse:** Under this model, the expected net value becomes Σ [p_n * Payoff_n] - c·L = Σ_{n=1}^L [ (1/2)^n * 2^n ] - c·L = Σ_{n=1}^L [1] - c·L = L - c·L = L(1 - c). This turns negative for c > 1, making participation irrational irrespective of L.
  3.  **Epistemic Instability:** As the *potential* payout scale (L) increases to make the nominal expectation large, the cost of *knowing* this potential can be realized (c·L) increases proportionally. The attractive game on paper becomes proportionally more expensive to verify.
  4.  **Robust Evaluation (Secondary):** For truly uncapped games (L→∞), the sample mean diverges empirically. This suggests a need for tail-robust evaluation metrics (like a trimmed mean or median) within a normative framework. Are these compatible with EUT for bounded utilities? Do they represent a distinct normative principle, or a practical approximation forced by epistemic limitations inherent in EUT's application?

  **4. Methodology & Work Plan (4 Terms):**

  *   **Term 1: Foundational Analysis & Formalization (Conceptual & Formal)**
      *   Detailed literature review: EUT axioms (Von Neumann-Morgenstern, Savage), SPP resolutions (bounded utility, resource, growth-rate), critiques (e.g., Weirich on unbounded utility).
      *   Precise formalization of the epistemic cost model:
          *   Define "establishing the game": Verifying cap (L), probability model (fairness), counterparty solvency.
          *   Develop formal cost functions: Simple linear (c·L), investigate alternatives (e.g., cost ∝ log(L), cost ∝ verification complexity).
          *   Integrate cost into the decision model: As a direct subtraction? As a constraint on feasible L? As a cost of refining probability estimates?
      *   *Deliverable:* Formal model of SPP with epistemic acquisition costs, demonstrating convergence/non-participation under plausible cost assumptions.

  *   **Term 2: Philosophical Justification & Normative Implications (Conceptual)**
      *   Argue for the *normative relevance* of epistemic costs: Critique the "free specification" assumption in standard EUT models. Draw parallels to debates on logical omniscience in epistemic logic and bounded rationality (Simon).
      *   Analyze the relationship between the cost model and existing resolutions:
          *   Does it *explain* the appeal of bounded resources? (Yes, by making L costly to discover).
          *   Does it *challenge* or *support* bounded utility? (It offers an alternative path, potentially preserving unbounded utility in theory while rendering its problematic application infeasible).
      *   Explore the status of "truly infinite" games: If verification cost scales indefinitely, does this render the concept pragmatically incoherent/normatively irrelevant?
      *   *Deliverable:* Philosophical argument situating epistemic costs as a necessary component of a realistic decision theory, resolving SPP without ad hoc bounds on utility or payoff.

  *   **Term 3: Robust Evaluation & Repeated Play (Formal & Conceptual)**
      *   Formal analysis of robust statistics (trimmed mean, median) for SPP outcomes:
          *   Prove convergence properties under Monte Carlo simulation (Appendix B).
          *   Investigate axiomatic foundations: Can these statistics be derived from modified EUT axioms (e.g., continuity under fat tails)? Or do they require a distinct normative basis (e.g., minimax regret, satisficing)?
      *   Integrate growth-rate reasoning (Kelly): How does the epistemic cost model interact with repeated play? Does it alter the optimal fraction to bet?
      *   Compare the robust evaluation approach to the primary epistemic cost resolution.
      *   *Deliverable:* Formal characterization of robust evaluation metrics for divergent expectation games and their normative justification; analysis of repeated play under epistemic costs.

  *   **Term 4: Synthesis, Defense & Limitations (Conceptual)**
      *   Synthesize results: Does the epistemic cost model *amend* EUT (by adding a deliberation cost module) or *complete* it (by making implicit assumptions explicit)?
      *   Defend against alternatives: Why is this preferable to simply adopting bounded utility? (Preserves theoretical unboundedness, explains practical boundedness via costs, avoids arbitrariness). Why not just use growth-rate? (Addresses single-shot case).
      *   Scrutinize model assumptions: Sensitivity to cost function form? Dependence on specific verification model? Applicability beyond SPP (e.g., Pascal's Wager)?
      *   Articulate philosophical significance: Implications for rationality, the ontology of decision problems, the role of information in agency.
      *   *Deliverable:* Coherent synthesis report; robust defense of the approach; clear statement of contributions and limitations; thesis draft.

  **Simulation Component (Appendix B):** A Monte Carlo study demonstrating the divergence of the sample mean for the uncapped SPP and the convergence of robust alternatives (trimmed mean, median) is valuable. It provides *empirical motivation* for the robust evaluation question and *illustrates* the pathological behavior. While central to an engineering paper, in a philosophy context, it belongs in an appendix as supporting evidence for the *conceptual* point about the instability of the expectation, not as a primary philosophical argument.

  **5. Feasibility & Researcher Background:**  
  As a Staff Software Engineer, I possess the necessary skills:
  *   **Formal Modeling:** Strong mathematical aptitude (probability, discrete math) for developing and analyzing cost models and convergence proofs.
  *   **Conceptual Rigor:** Experience in abstract reasoning, system design, and identifying implicit assumptions translates well to philosophical analysis.
  *   **Simulation:** Expertise in implementing Monte Carlo methods (Appendix B).
  *   **Project Management:** Proven ability to manage complex projects part-time alongside professional commitments.

  The scope is well-defined and achievable within the constraints. The project leverages my strengths while demanding growth in philosophical argumentation and engagement with decision-theory literature – core goals of the MA.

  **6. Success, Failure, and Scope Management:**

  *   **Success Criteria:**
      1.  A formally coherent model integrating epistemic costs into the evaluation of St. Petersburg games, demonstrating resolution of the paradox.
      2.  A persuasive philosophical argument establishing the normative necessity of including such costs in decision theory.
      3.  A clear articulation of the relationship between this approach, bounded utility, growth-rate theory, and robust evaluation.
      4.  Identification of broader implications for decision theory under uncertainty and bounded rationality.
  *   **Failure Criteria:**
      1.  If the epistemic cost model proves formally intractable or demonstrably incompatible with core EUT axioms without collapsing into an existing bounded model (e.g., if cost *must* act exactly like a utility bound).
      2.  If compelling arguments show epistemic costs are already sufficiently handled by existing decision frameworks (e.g., Savage acts, state-dependent utility) in a way that dissolves the novelty.
      3.  If robust evaluation metrics cannot be given a coherent normative justification distinct from approximation.
  *   **Scope Management (Prioritizing 8 hrs/week):**
      *   **Primary Focus:** The **Epistemic Cost Thesis** (Terms 1 & 2) is the core novel contribution and must be fully developed. This is non-negotiable.
      *   **Secondary Focus:** **Robust Evaluation** (Term 3) is valuable but can be scaled back if necessary. Focus would shift to its conceptual relationship with the primary thesis and the repeated-play case, reducing formal axiomatic exploration.
      *   **Tertiary/Deferrable:** Deep dives into highly specific alternative cost functions, extensive comparison to *all* historical variants of SPP, or a fully general theory of deliberation costs beyond SPP. The simulation (Appendix B) remains manageable as illustrative support.
      *   **Hunch Prioritization:** The **Costly Verification hunch** (scaling cost with L) is primary. The Robust Evaluation hunch is secondary, explored primarily in relation to the epistemic limitations highlighted by the primary hunch and the repeated-play context.

  **7. Conclusion:**  
  This project offers a novel resolution to the St. Petersburg paradox by shifting focus from bounding the game's structure to bounding the agent's *epistemic access* to that structure. It argues that the costs of verifying the parameters necessary for the divergent expectation calculation scale precisely with the factors causing divergence, rendering participation irrational or the calculation practically inaccessible. This approach promises to resolve the paradox without ad hoc utility bounds, preserve the theoretical possibility of unbounded utility, illuminate the role of information costs in decision theory, and connect to questions of robust evaluation under extreme uncertainty. It is a philosophically grounded, formally tractable project well-suited to my background and the part-time MA structure.

  ---

  **Note to Applicant: Feedback on Your Idea & Proposal Strategy**

  1.  **Framing Clarity:** Your core insight – **epistemic costs scaling with the payoff scale (L) as the key bound** – is sharp and philosophically significant. The proposal successfully reframes it in decision-theory vocabulary ("epistemic constraints," "costly verification," "implicit assumptions of EUT"). The distinction from conditional convergence variants is correctly noted and important.
  2.  **Cost-per-Doubling Arithmetic:** Your calculation is **correct in the simple model**.
      *   `Expected Gross Payout = Σ_{n=1}^L (1/2)^n * 2^n = Σ_{n=1}^L 1 = L`
      *   `Verification Cost = c * L` (assuming cost per doubling level confirmed)
      *   `Net Expected Value = L - c*L = L(1 - c)`
      *   This is negative for c > 1. The critical point is that `c` need only exceed 1, not be enormous.
  3.  **Dependence on Arithmetic:** The proposal's core argument **does not critically depend on the *exact* linear cost model (c·L)**.
      *   **Conceptual Strength:** The fundamental point is that verification costs *monotonically increase* with L and plausibly *scale significantly* (e.g., linearly, logarithmically, super-linearly) with the *magnitude* or *complexity* represented by L. Any such increasing cost function will eventually dominate the linear increase in expected gross payout (which is just L under the cap), leading to a maximum net value and potential negative returns. The linear model is a clean, illustrative example. The philosophical argument relies on the *principle* of scaling costs, not the specific coefficient. Your Term 1 work will explore alternative cost functions to demonstrate robustness.
  4.  **Originality Check:** While the *general idea* that information is costly is ancient (Hayek, Stigler), and *specific costs* have been mentioned in passing regarding SPP (e.g., discussing auditing the casino), **your core innovation – the *scaling* of verification cost *with the cap L itself* as the crucial mechanism resolving the divergence – appears genuinely novel within the specific philosophical literature on the St. Petersburg paradox.** Standard discussions of "bounded resources" focus on the *existence* of the cap, not the *cost of discovering* it. The tight linkage between the cost and the parameter driving the expectation is your unique contribution.
  5.  **Residual Question (if core exists elsewhere):** *If* a close precedent were found (e.g., a paper explicitly modeling verification cost = k*log(L) or similar), the **residual question** becomes: **"What is the *minimal* and most plausible structure for epistemic costs (e.g., linear, logarithmic, step-function) that normatively resolves the St. Petersburg paradox for bounded rational agents, and how does this integrate with/constrain the foundations of expected utility theory (e.g., does it challenge specific axioms, or merely operationalize their application)?"** Your project would then focus on formally characterizing this class of cost functions and their precise philosophical implications for EUT, moving beyond the mere existence of costs to their necessary structure and normative force. The robust evaluation thread remains a distinct secondary contribution.
  6.  **Proposal Tune-up:** The proposal structure outlined effectively addresses the application requirements. Key strengths: Clearly defined question in field vocabulary, motivated gap analysis, feasible methodology with term-by-term breakdown distinguishing formal/conceptual, clear success/failure criteria, and pragmatic scoping. The defense against bounded utility is well-placed. Keeping simulation as an appendix is the right call philosophically.

  **Overall:** Your idea is philosophically sound, original, and well-suited for an MA project. The proposed structure effectively translates it into a compelling research proposal. Proceed with confidence, focusing on fleshing out the philosophical justification in Term 2 – that's where the most significant conceptual heavy lifting for the degree resides. Good luck!
