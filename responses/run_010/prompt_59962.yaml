answer: |-
  Here’s a 20-mark exam question designed to challenge students beyond mechanical application of Jeffrey conditionalization, with a model answer and marking scheme.

  ---

  ### Exam Question: Jeffrey Conditionalization and Partition Sensitivity (20 marks)
  **Time allowed:** 45 minutes  
  **No calculators permitted.**

  Jo is assessing whether a fabric swatch is from a 19th-century batch (\(H\)). Her initial credences:  
  - Colours: \(P(\text{red}) = 0.5\), \(P(\text{pink}) = 0.3\), \(P(\text{white}) = 0.2\)  
  - Conditional credences: \(P(H \mid \text{red}) = 0.8\), \(P(H \mid \text{pink}) = 0.4\), \(P(H \mid \text{white}) = 0.0\)  

  When the showroom lights return, Jo revises her credence in *red* to \(P_\text{new}(\text{red}) = 0.75\).  
  - **Coarse description:** She treats the experience as shifting credence over \(\{\text{red}, \text{not-red}\}\), with \(P_\text{new}(\text{not-red}) = 0.25\).  
  - **Fine description:** She revises to \(P_\text{new}(\text{red}) = 0.75\), \(P_\text{new}(\text{pink}) = 0.20\), \(P_\text{new}(\text{white}) = 0.05\).  

  **(a)** Compute \(P_\text{new}(H)\) using Jeffrey conditionalization under both descriptions. Show that the updates disagree not only about \(H\) but also about the posterior credence in at least one colour.  
  **(b)** What has gone wrong? Is one description inaccurate, or does this reveal a limitation in Jeffrey conditionalization as a norm? What must be true of an experience to privilege one partition, and what could "repair" the rule (e.g., rigid learning, input probabilities)? Discuss costs of such repairs.  
  **(c)** Could a bookie who knows Jo’s priors and updating habits exploit this via a diachronic Dutch book? What precisely must the bookie predict: Jo’s update method, the evidence partition, or the specific probabilities? Explain briefly.  

  ---

  ### Model Answer (≈700 words)  
  **(a) Calculations and Disagreement**  
  *Coarse update (\(\{\text{red}, \text{not-red}\}\)):*  
  - \(P_\text{new}(\text{red}) = 0.75\), \(P_\text{new}(\text{not-red}) = 0.25\)  
  - Rigidity: \(P_\text{new}(H \mid \text{red}) = P(H \mid \text{red}) = 0.8\), \(P_\text{new}(H \mid \text{not-red}) = P(H \mid \text{not-red})\)  
  - Compute \(P(H \mid \text{not-red})\):  
    \[
    P(H \mid \text{not-red}) = \frac{P(H \cap \neg \text{red})}{P(\neg \text{red})} = \frac{P(H \cap \text{pink}) + P(H \cap \text{white})}{0.5} = \frac{(0.3 \times 0.4) + (0.2 \times 0)}{0.5} = \frac{0.12}{0.5} = 0.24
    \]  
  - Thus:  
    \[
    P_\text{new}(H) = (0.75 \times 0.8) + (0.25 \times 0.24) = 0.60 + 0.06 = 0.66
    \]  

  *Fine update (\(\{\text{red}, \text{pink}, \text{white}\}\)):*  
  - Input probabilities: \(P_\text{new}(\text{red}) = 0.75\), \(P_\text{new}(\text{pink}) = 0.20\), \(P_\text{new}(\text{white}) = 0.05\)  
  - Rigidity: \(P_\text{new}(H \mid \cdot) = P(H \mid \cdot)\)  
  - Thus:  
    \[
    P_\text{new}(H) = (0.75 \times 0.8) + (0.20 \times 0.4) + (0.05 \times 0) = 0.60 + 0.08 + 0 = 0.68
    \]  

  *Disagreement beyond \(H\):*  
  - Coarse posterior for pink: \(P_\text{new}(\text{pink}) = P_\text{new}(\text{pink} \mid \text{not-red}) \times P_\text{new}(\text{not-red})\).  
    But \(P_\text{new}(\text{pink} \mid \text{not-red}) = P(\text{pink} \mid \text{not-red}) = \frac{0.3}{0.5} = 0.6\), so \(P_\text{new}(\text{pink}) = 0.6 \times 0.25 = 0.15\).  
  - Fine posterior: \(P_\text{new}(\text{pink}) = 0.20\).  
  - **Thus, the updates disagree on \(P_\text{new}(\text{pink})\) (0.15 vs. 0.20) and \(P_\text{new}(H)\) (0.66 vs. 0.68).**  

  **(b) Diagnosis and Repair**  
  The issue is **not** that one description is "inaccurate." Both are mathematically valid applications of Jeffrey conditionalization. The problem is that **Jeffrey’s rule is partition-sensitive**: it outputs different posteriors for the same evidence when applied to different partitions.  

  Jeffrey conditionalization assumes rigidity *over the chosen partition*. For the rule to be normatively compelling, the experience must **directly fix posterior probabilities over a privileged partition** while leaving conditional probabilities given its cells unchanged. Here:  
  - The coarse update assumes the experience directly specifies only \(P_\text{new}(\text{red})\) and \(P_\text{new}(\text{not-red})\), leaving \(P_\text{new}(H \mid \text{red})\) and \(P_\text{new}(H \mid \text{not-red})\) rigid.  
  - The fine update assumes the experience fixes probabilities for *all three colours* rigidly.  

  **What privileges a partition?** The experience itself must determine which propositions have their probabilities directly set (*input probabilities*) and which conditionals remain unchanged (*rigidity*). If Jo’s experience *only* warrants shifting credence in "red" (treating "not-red" as a single blob), the coarse partition is privileged. If it warrants distinct shifts to pink and white, the fine partition is correct. The **same burst of light** may not justify both equally; Jo must interpret how the evidence bears on each proposition.  

  **Repairs and costs:**  
  - **Require "rigid learning"**: Demand that experiences fix input probabilities over a *minimal* partition where rigidity holds. But determining this partition is subjective and context-dependent.  
  - **Use input probabilities from evidence**: Jeffrey’s rule requires the *input probabilities* (0.75 red, or 0.75/0.20/0.05) to be given by the experience. If the light *only* justifies \(P_\text{new}(\text{red}) = 0.75\) (with no constraints on pink/white), the fine description is *inaccurate* because it arbitrarily specifies pink/white.  
  - **Cost**: This makes Jeffrey conditionalization dependent on an ambiguous, agent-relative input (how to partition evidence). It loses its generality as a purely formal norm.  

  **(c) Dutch Books**  
  A bookie **could** Dutch book Jo **only if** they can predict:  
  - **Her chosen partition** (coarse or fine) *and* her input probabilities *in advance*.  
  - Suppose the bookie knows Jo will use the coarse update if she sees the light. They can exploit the discrepancy between her coarse posteriors and the "true" fine posteriors. For example:  
    - Before the light, sell a bet that pays £1 if \(H \land \text{pink}\) (fair price \(P(H \land \text{pink}) = 0.3 \times 0.4 = £0.12\)).  
    - After coarse update, buy a similar bet at her new \(P_\text{new}(H \land \text{pink}) = P_\text{new}(H \mid \text{pink}) \times P_\text{new}(\text{pink}) = 0.4 \times 0.15 = £0.06\).  
    - Profit: £0.12 - £0.06 = £0.06, regardless of outcomes.  
  - **Key point**: The bookie must predict *which partition Jo will use* and *her specific input probabilities*. If Jo’s response is unpredictable (e.g., she sometimes uses coarse, sometimes fine), no guaranteed Dutch book exists.  
  - **Limitation**: Jeffrey conditionalization is vulnerable to Dutch books only when update rules are predictable, *not* when evidence is partition-sensitive per se.  

  ---

  ### Marking Scheme (20 marks total)  
  **Part (a) (8 marks)**  
  - **Coarse calculation**: Correct \(P(H \mid \text{not-red}) = 0.24\) (1 mark), \(P_\text{new}(H) = 0.66\) (1 mark).  
  - **Fine calculation**: Correct \(P_\text{new}(H) = 0.68\) (1 mark).  
  - **Disagreement on colours**: Correct posterior for pink: coarse 0.15 (1 mark), fine 0.20 (1 mark).  
  - **Identify disagreement**: States coarse/fine disagree on \(P_\text{new}(\text{pink})\) and \(P_\text{new}(H)\) (1 mark).  
  - **Workings**: Full clarity and no arithmetic errors (2 marks).  
    *Penalties:*  
    - Minor arithmetic error: -1  
    - Miscomputes \(P(H \mid \text{not-red})\): -1 (if final answer wrong)  
    - Only shows disagreement on \(H\), not colours: -2  

  **Part (b) (8 marks)**  
  - **Diagnosis**: Identifies partition-sensitivity (not "inaccuracy") as core issue (2 marks).  
  - **Rigidity assumption**: Explains rigidity is partition-relative (1 mark).  
  - **Privileged partition**: States experience must determine input probabilities *and* rigidity scope (2 marks).  
  - **Repair**: Discusses rigid learning/input probabilities (1 mark).  
  - **Cost**: Notes subjectivity/ambiguity in choosing partitions (1 mark).  
  - **Rejects "fine is better"**: Critiques claim that fine partition is "obviously" correct without justification (1 mark).  
    *Penalties:*  
    - Claims coarse update is "wrong": -2  
    - Assumes fine partition is inherently superior without argument: -2  
    - Omits discussion of rigidity scope: -2  

  **Part (c) (4 marks)**  
  - **Predictability**: Bookie must know Jo’s update rule *and* chosen partition (2 marks).  
  - **Dutch book example**: Conceptual description of how bet works (1 mark).  
  - **Limitation**: Explains that unpredictability shields Jo (1 mark).  
    *Penalties:*  
    - Claims no Dutch book possible: -1  
    - Says bookie needs only priors/evidence: -2  

  ---

  ### Key Distinctions for Grading  
  - **A-grade (16–20)**: Clearly diagnoses partition-sensitivity, rejects "fine is better" without justification, and explains how experience determines the partition. Explicitly links rigidity to the partition choice.  
  - **B-grade (12–15)**: Correct calculations and identifies disagreement, but may imply the fine update is "more accurate" without critiquing the coarse description. Superficial Dutch book analysis.  
  - **C-grade (8–11)**: Mechanical calculations with errors. Assumes coarse update is "wrong" or fails to explain why partition choice matters. Omits discussion of rigidity scope.  
  - **Failing (<8)**: Major calculation errors, misapplies Jeffrey’s formula, or claims the problem is "impossible."  

  This question tests deeper understanding of how evidence interpretation (via partitions) interacts with formal norms, pushing students beyond rote application.
