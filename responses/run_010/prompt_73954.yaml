  The powder keg metaphor needs unpacking layer by layer. Powder = Balkan tensions/alliances? Keg = rigid alliance system? Spark = Franz Ferdinand's assassination? But the metaphor's danger lies in its physics: gunpowder has no agency, no aims. It erases human decisions—like Germany's "blank check" to Austria—that actively escalated the crisis. Worse, it implies inevitability when historians like McMeekin show how many off-ramps were missed. 

  The user's forest fire metaphor improves on this by making drought (structural conditions) distinct from the camper's choice (deliberate negligence). But yes, it *does* bake in their Fischer-leaning conclusion by framing Germany as the negligent actor. A truly neutral metaphor might be impossible for singular events; all frameworks prioritize certain facts. Perhaps a "cascade" metaphor? But even that implies passivity. 

  Most crucially, the user suspects—rightly—that the powder keg's real power is metaphysical: it avoids whether *nations* can bear moral responsibility. The metaphor reduces states to chemical elements, dodging the very question the thread debates. Their replacement at least accommodates intent via the camper's timber plans. 

