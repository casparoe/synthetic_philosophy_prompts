  **Decision Tree for the Paradox of Phenomenal Judgment**  
  *Starting commitment: The entire causal chain from stimulus to report is physical, and the afterimage (if non-physical) does no causal work in this chain.*

  1. **Does the report's accuracy require causal contact with the afterimage?**  
     - **Yes**: Go to 2.  
     - **No**: Go to 3.  

  2. **Is the afterimage physical?**  
     - **Yes**: Go to 4.  
     - **No**: Go to 5.  

  3. **Is the report veridical (i.e., is there really an afterimage)?**  
     - **Yes**: Go to 6.  
     - **No**: **Illusionism**  
       *Most awkward commitment: Conscious experiences are systematic misrepresentations (e.g., there is no "red afterimage," only brain states misdescribed).*  

  4. **Is the phenomenal property type-identical to a neural property?**  
     - **Yes**: **Type-identity theory**  
       *Most awkward commitment: Phenomenal properties rigidly correlate with specific neural states (e.g., "red afterimages" cannot be multiply realizable).*  
     - **No**: **Non-reductive physicalism (causal exclusion rejected)**  
       *Most awkward commitment: Phenomenal properties are distinct from neural properties but causally efficacious without violating physical closure (e.g., mental causation is brute).*  

  5. **Is the report veridical?**  
     - **Yes**: **Bullet-biting epiphenomenalism**  
       *Most awkward commitment: Reports track experiences by cosmic coincidence (e.g., no causal or explanatory link between afterimage and report).*  
     - **No**: *Unoccupied (incoherent: Dualism requires afterimages to exist, but reports are non-veridical; subjects cannot be wrong about private experiences).*  

  6. **What fixes the reference of "afterimage"?**  
     - **Acquaintance**: *Unoccupied (incoherent: Acquaintance implies direct epistemic access, but non-causal contact is undefined under physicalism).*  
     - **Shared neural cause**: **Tracking (non-causal correlation)**  
       *Most awkward commitment: Reports and experiences correlate via a common cause, but experiences never cause reports (e.g., neural state N causes both, risking mismatches).*  
     - **Nothing**: **Bullet-biting epiphenomenalism** (collapses with branch 5).  

  **Unoccupied Cells and Reasons**:  
  - **Dualist interactionism**: Incoherent with starting commitment (requires non-physical afterimage to exert causal force).  
  - **Acquaintance-based reference**: Incoherent (acquaintance sans causation is undefined under physical constraints).  
  - **Non-veridical dualism (branch 5)**: Incoherent (veridicality failure contradicts private access in dualism).  
  - **Other reference-fixers (e.g., conceptual role)**: Unexplored (no major defenses in literature).  

  **Indistinguishable Leaves**:  
  - **Bullet-biting epiphenomenalism** (branches 5 and 6) collapses with **pre-established harmony** (both appeal to non-causal "coincidence" to explain report-experience match).
