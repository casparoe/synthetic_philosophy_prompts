prompt: |-
  I am the standards editor at a mid-sized digital science outlet — a general-interest desk with roughly a million readers a month, four staff editors, and one part-time consulting statistician who turns questions around in two days but never sooner. Between six and ten items a week reach my desk citing a heritability estimate, a polygenic score, or the phrase "partly genetic," and my team has to decide, usually in under twenty minutes and always without a specialist, whether the inference the piece draws is licensed by the number it quotes. Our style guide currently requires that any variance-component figure carry a context line of no more than thirty words naming the population and the range of environments it was estimated in, and it bans the formulation "X percent genetic" in headlines; those are our only existing tools, and they are not enough. I argued about this for most of Saturday with a friend who does quantitative social science. Her position is the deflationary one: a heritability estimate is a ratio of variances in one population at one time under one distribution of environments, it does not travel to individuals, it does not bound what an intervention can do to a mean, it says nothing about differences between groups, and therefore it licenses essentially no claim a newspaper would want to make. My reply was that if the figure licenses nothing, we should print none of them, which is absurd, because our reporters use these numbers to knock down claims that are genuinely knocked down by them — the assertion that the variation in a trait must be entirely a matter of upbringing, for instance, or the assumption that whatever nobody can change must have a high heritability. What I need is an instrument that says positively what such a figure does entitle a writer to assert, and under what conditions, not a list of disclaimers.

  So: write me the decision procedure my four editors can run on a submission. I want the questions in order — sequence matters, since some are cheap and some require reading the methods section — and for each one, what a sufficient answer looks like in finished copy, what phrasings fail it, and where the procedure stops with a no rather than a request for revision. It needs an explicit off-ramp for the most common case, in which the article cites no heritability estimate at all but something adjacent that our writers routinely call one: a polygenic score's share of variance explained, a genetic correlation, a twin concordance figure, a within-family coefficient. It should say what to do when the estimate comes from a population, a birth cohort, or an environment range other than the one the piece is about, and what to do when the measure itself changed between the study and the story. It should include the section my friend will attack hardest, on how far a writer may go in describing a single person's trait as partly genetic, given her contention that the flat denial of any individual-level reading is a slogan rather than a theorem. And it should tell me loudly which questions are really about our mission or about foreseeable harm rather than about what the statistic means, and must therefore be handed up to me instead of settled by the checklist — I would rather the procedure flag its own limits than smuggle values in as method. Mark, as you go, the steps where a judgment call is wearing a lab coat: the places where "sufficient answer" is doing covert normative work. No references and no further reading, please; I need something usable at 9:15 on a Tuesday morning.

  Then run it on three items sitting on my desk now, showing what your questions extract from each. First, a piece by our most senior reporter built on a study that re-estimated a behavioural trait's genetic associations using sibling pairs, arguing that the larger figures reported by earlier studies of unrelated people were inflated by family environment and population structure; the piece concludes that those earlier numbers were largely an artefact, and I have already told the reporter I like the framing. Second, a piece reporting that the heritability of IQ-test scores is much higher among affluent families than among poor ones in the country where the study was done, which goes on to conclude that cognitive outcomes among poor children are essentially environmental and that only social spending can move them; the replication record for that interaction is mixed and the piece does not say so. Third, a contribution from an outside writer with a reputation for hereditarian argument whose draft is, so far as my editors can tell, technically scrupulous — it reports a within-population estimate, declines to draw any inference about group differences, and even supplies its own context line — but which my deputy wants spiked on the grounds that it will be excerpted by readers who do draw that inference. If your procedure clears the third item, say so plainly and tell me what it leaves me free to do about it; I would rather have an instrument that occasionally tells me something I do not want to hear than one that ratifies my instincts. Close with what the procedure cannot do: the classes of claim it will pass or fail wrongly, and where you expect my friend to break it, since she has agreed to read the thing.
reasoning: |-
  Hmm, the user is a standards editor at a science outlet dealing with genetics reporting. They need a practical decision procedure for evaluating heritability claims that editors can apply quickly without specialist help. Their current style guide only requires context lines and bans "X percent genetic" headlines, which they find insufficient.

  The core tension is between the deflationary view (heritability estimates have very limited inferential power) and practical journalism needs (these numbers do useful work in debunking certain claims). The user explicitly rejects disclaimer-based approaches and wants positive guidance on what claims are actually licensed.

  Key challenges to address:
  - Handling adjacent metrics often mislabeled as heritability (PGS, concordance, etc.)
  - Population/environment mismatches between studies and articles
  - The thorny issue of individual-level attributions
  - Flagging where value judgments masquerade as methodology
  - Explicit off-ramps for unsalvageable cases
  - Distinguishing statistical validity from editorial policy concerns

  For the decision procedure, I'll need to build something that:
  1. First catches non-heritability metrics masquerading as heritability
  2. Then verifies basic interpretability (population, environment range)
  3. Restricts allowable inferences to what the statistic actually supports
  4. Explicitly marks policy decisions for human judgment
  5. Has kill switches for fundamental violations

  The test cases present excellent stress tests:
  1. The sibling study piece - should pass but requires careful framing
  2. The SES-IQ interaction piece - needs caveats about generalizability
  3. The hereditarians' piece - may pass technically but requires policy decision

  Special attention needed for the individual attribution problem - I'll need to find middle ground between "meaningless at individual level" absolutism and journalistic practicality. The solution might be restricting to probabilistic statements about populations.

  For limitations, I'll highlight:
  - Can't prevent deliberate misinterpretation by readers
  - Doesn't handle longitudinal changes in heritability
  - Limited against novel methodologies
  - Can't resolve the individual attribution debate

  The procedure should yell loudly when it encounters policy decisions (like the third piece) so the editor knows they're making an ethical call, not a statistical one.
answer: |-
  Here is a decision procedure for your editors, designed for speed and clarity. It progresses from cheap checks to costly ones, with explicit stop/kill criteria. Normative judgments are marked with **🖋️**, policy handoffs with **🚩**, and critical limitations at the end.

  ---

  ### **Heritability/PGS Claim Decision Procedure**
  *(Run sequentially; stop if any step fails)*

  1.  **IS THIS ACTUALLY A HERITABILITY ESTIMATE (h²)?**  
      *Check the metric cited:*  
      - **Sufficient:** Explicitly labeled "narrow-sense heritability" (h²), "SNP heritability" (h²~SNP~), or "heritability" *from a twin/adoption/sibling design* (specifying model).  
      - **Fail (Off-Ramp 1 - Not h²):** Polygenic Score (PGS) R², genetic correlation (r~g~), twin concordance rate, within-family estimate, GCTA estimate not labeled h²~SNP~, "genetic influence" without quantification.  
          *→ STOP. Claim cannot be treated as heritability. Writer must reframe:*  
          *"The study reports [Metric Name], which estimates [brief definition, e.g., 'predictive power of DNA variants for the trait in this sample'], not heritability. Therefore, it cannot support claims about the proportion of trait variation attributable to genetic inheritance." Request revision to remove heritability language or fundamentally reframe claim.*

  2.  **DOES THE CONTEXT LINE MEET STANDARDS?**  
      *Check if the required 30-word line is present AND specifies:*  
      - **Sufficient:** Specific population (e.g., "UK residents of European ancestry born 1946-1958"), environment range (e.g., "current socioeconomic conditions in the UK circa 2000"), and measurement method (e.g., "via LD Score Regression on GWAS data").  
      - **Fail:** Vague population ("white Europeans"), missing environment range, missing method, or >30 words.  
          *→ Request immediate revision to add/mend context line. Do not proceed without it.*  
      - **Kill:** Context line reveals fundamentally non-generalizable sample (e.g., "in a sample of severe schizophrenia cases hospitalized in 1920s Berlin").  
          *→ STOP. "The cited heritability estimate is derived from a population/environment too specific or atypical to support general claims about this trait. Remove the estimate or fundamentally reframe the piece."*

  3.  **DOES THE CLAIM RESPECT THE "ONE POPULATION, ONE TIME" LIMIT?**  
      *Check if the article implies the estimate applies to:*  
      - A different population group (e.g., using h² estimated in Europeans to discuss trait differences between continents).  
      - A significantly different environment (e.g., using h² estimated in 1950s rural Sweden to discuss modern urban Brazil).  
      - Future/potential environments.  
      - **Sufficient:** Claim explicitly ties conclusion to the population/environment described in the context line.  
      - **Fail:** Claim implies universality, transhistorical validity, or applies it directly to a different group/environment.  
          *→ Request revision to qualify claim: "In [Study Population] under [Study Environment],..." or "This estimate does not necessarily apply to [Different Group/Time]...".*  
      - **Kill:** Claim bases a policy or group-difference argument *entirely* on extrapolating h² beyond its context.  
          *→ STOP. "Heritability estimates cannot be reliably extrapolated to justify claims about differences between groups or the potential impact of interventions in different environments. Remove or fundamentally reframe."*

  4.  **WHAT INFERENCE IS BEING DRAWN? MATCH TO LICENSED CLAIMS.**  
      *Does the claim match one of these **positive**, licensed inferences?*  
      - **Licensed Claim A (Refuting Environmental Determinism):** "This estimate shows that variation in [Trait] within [Study Population] is not *entirely* due to environmental differences." *(Sufficient)*  
      - **Licensed Claim B (Refuting Genetic Determinism/Immutability):** "This estimate shows that variation in [Trait] within [Study Population] is not *entirely* genetic, and a high heritability does *not* mean the trait is unchangeable by environment/intervention." *(Sufficient)*  
      - **Licensed Claim C (Interaction - If Supported):** "This estimate suggests that the relative contribution of genetic vs. environmental variation to differences in [Trait] within [Study Population] may depend on specific environmental factors (e.g., socioeconomic status)." *(Requires evidence of a significant GxE interaction in the study or meta-analysis cited)*  
      - **🚩 Policy Handoff 1 (Group Differences):** *Any* claim about differences *between* groups (e.g., ethnicities, sexes, nations), even if only implied or suggested as a possibility.  
          *→ "Inference about group differences flagged for editorial policy decision. Cannot be resolved statistically." Escalate to Standards Editor.*  
      - **🖋️ Licensed Claim D (The Individual - Use Extreme Caution):** "In [Study Population], genetic differences contribute probabilistically to differences in [Trait] among individuals. Therefore, an individual's [Trait] is *likely influenced* by both their genes and their environment."  
          *→ **Sufficient:** Uses probabilistic, population-based framing ("contributes to differences," "likely influenced"); avoids "partly genetic" or assigning a %.  
          *→ **Fail:** "This person's trait is X% genetic," "Genes explain why John has a higher trait than Jane," "Partly genetic" *without* explicit probabilistic/population context.  
          *→ Request revision to probabilistic framing or remove individual-level attribution.*  
      - **Kill:** Claim that h² estimates the genetic contribution *to an individual's trait value* or *bound the effect of an intervention on the population mean*.  
          *→ STOP. "Heritability estimates describe variation within a population, not causation within an individual or limits on population-level change. Remove the heritability figure or fundamentally reframe the claim."*

  5.  **FOR PGS CLAIMS (If off-ramped at Step 1 but PGS R² is central):**  
      *Check:*  
      - **Sufficient:** Labeled clearly as "PGS R²" or "variance explained by the polygenic score". Context line specifies population, environment, and PGS derivation sample. Claim limited to predictive power *in that specific population/sample*.  
      - **Fail:** Called "heritability" or "genetic influence"; implies causation or general predictive power across diverse populations; used to bound intervention effects.  
          *→ Request revision to focus solely on predictive accuracy in the study context.*  
      - **Kill:** Uses PGS R² to make claims about genetic causation, group differences, or individual destiny.  
          *→ STOP. "A polygenic score's R² measures prediction, not causation or heritability. Remove or fundamentally reframe."*

  ---

  ### **Application to Your Three Items**

  **Item 1: Sibling Study Re-Estimating Heritability**  
  1.  **Is it h²?** Likely YES (sibling design re-estimating heritability).  
  2.  **Context Line?** Assume present/sufficient (study details provided).  
  3.  **Respect "One Pop/Time"?** YES. Compares estimates *from the same population type* using different methods.  
  4.  **Inference?** Claim: "Earlier higher estimates were inflated artifacts." **→ Licensed Claim A (Refuting Environmental Determinism)**. Also implicitly **Licensed Claim B (Refuting earlier genetic determinism implication)**. NO group differences claim. Individual attribution unlikely. **PASS (with standard context line).**  
      *Your framing is sound.*

  **Item 2: h²(IQ) x SES Interaction**  
  1.  **Is it h²?** YES (implied twin/family study).  
  2.  **Context Line?** Needs explicit population/environment (e.g., "US children studied in 2010s").  
  3.  **Respect "One Pop/Time"?** **FAIL.** Piece concludes about "poor children" *universally* ("cognitive outcomes among poor children are essentially environmental"). Study is specific to one country/time.  
  4.  **Inference?** Claim: "h² lower in poor families → outcomes essentially environmental, only social spending can move them." **→ Licensed Claim C (Interaction)** *is supported for the study pop*. BUT:  
      - "Essentially environmental" **KILLS** (implies near-zero genetic influence, not supported by h²).  
      - "Only social spending can move them" **KILLS** (h² doesn't bound mean effects; ignores potential GxE).  
      - Universal claim ("poor children") **FAILS** Step 3.  
      *→ STOP. Requires fundamental revision:*  
      *"In [Study Country] during [Study Period], the heritability of cognitive test scores was lower among children from low-SES families, suggesting environmental factors played a larger role *in explaining differences among these children* compared to higher-SES children. This does not preclude genetic influences, nor does it guarantee that any specific intervention will raise mean scores." Add note on mixed replication.*

  **Item 3: Hereditarian Writer's Piece**  
  1.  **Is it h²?** YES.  
  2.  **Context Line?** YES (assumed sufficient per you).  
  3.  **Respect "One Pop/Time"?** YES (stays within population).  
  4.  **Inference?** Reports h², avoids group differences, uses context line. **Licensed Claim A/B are likely supported.** If individual attribution is present, Step 4D requires probabilistic framing.  
      **→ TECHNICALLY PASSES the statistical checklist.**  
      *🚩 What it leaves you free to do:* The procedure flags that **preventing reader misappropriation for group differences is a POLICY DECISION (Policy Handoff 1)**, not resolvable by statistics. You are free to:  
      - Publish as-is (technically sound).  
      - Add an **explicit editorial note**: "While this study estimates heritability within Group X, heritability cannot explain causes of differences *between* groups. Readers should not extrapolate these findings to such comparisons."  
      - **Spike it** based on foreseeable harm/editorial mission grounds, *acknowledging this is a policy call, not a statistical flaw.* The procedure does not spike it.

  ---

  ### **What the Procedure Cannot Do (Limitations & Friend's Attack Points)**

  1.  **Cannot Prevent Deliberate Misinterpretation:** It ensures *the text* is statistically defensible. It cannot stop bad-faith actors from misusing correctly reported numbers (Friend: "This is naive! Numbers will be weaponized regardless"). **Mitigation:** Explicit policy notes (as above).
  2.  **Cannot Resolve the Individual Attribution Debate (Step 4D):** Friend will attack **🖋️ Licensed Claim D** as giving unwarranted legitimacy to individual-level talk. She argues the probabilistic framing smuggles in the "partly genetic" concept it supposedly bans. The procedure judges "likely influenced by genes" as sufficient; she sees this as a fatal concession.
  3.  **Cannot Judge Quality of Underlying Study:** Relies on the context line. A garbage study with a perfect context line might pass. Editors need basic plausibility sense (sample size, method named).
  4.  **Cannot Handle Novel/Complex Methods Perfectly:** May misfire on unusual designs (e.g., novel GxE estimators). Off-Ramp 1 catches most mislabeling.
  5.  **Cannot Address Temporal Instability Deeply:** Step 3 flags obvious mismatches but can't quantify how much environment must change to invalidate an estimate.
  6.  **🚩 Cannot Make Policy Judgments:** It outsources group difference implications and harm/appropriateness decisions. Friend will say this is ducking the hardest issues.
  7.  **False Negatives:** May pass claims that are technically correct but so likely to mislead in practice that they should be spiked (Item 3 is the test case). **False Positives:** May spike nuanced claims if wording slightly fails strict licensed claim criteria.
  8.  **"Knock Down" Claims:** Friend argues Steps 1 (Off-Ramp 1) and 4 (Licensed Claims A/B) *do* enable refuting strong environmental/genetic determinism, which she might concede is the *only* valid use. She'll attack everything else.

  **Friend's Primary Break Point:** Step 4D (Individual Attribution). She'll argue the *only* statistically valid statements are about *variances in populations*, full stop. Any individual-level language, however probabilistic, misrepresents the statistic. The procedure's allowance here is its most vulnerable normative judgment (**🖋️**).
