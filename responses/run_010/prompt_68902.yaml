prompt: |-
  I am drafting the middle chapter of a dissertation on the seventeenth-century beast-machine controversy, and the part I keep circling back to is not the metaphysics of the soul but the tests Descartes actually applied to particular creatures. So I have compiled his verdicts case by case, as I read them, in order to find out what they commit him to about a case he never saw. The record, roughly: dogs, horses, and magpies that have been taught to answer to words or to utter them are machines, and the fact that a magpie can be made to say something on cue establishes nothing, because the utterance is tied to a situation and a reward rather than to a thought it declares — this is the line he presses in his mid-1640s correspondence with an English aristocrat who kept and trained animals. Human beings born deaf, by contrast, are observed to invent signs of their own and to use them to make their thoughts known, which he takes to show that the capacity in question is not a matter of the vocal organs and cannot be explained away by a bodily defect. The intricate and uniform constructions of bees, spiders, and beavers count against their builders' intelligence rather than for it: the more regular and finished the work, the more plainly it proceeds from the disposition of the parts (Discourse, Part Five). The water-driven displays in the royal gardens, which visitors found astonishing, are wholly accounted for by the pressure and routing of the water, and in the preface to his unfinished treatise on the human body he likens his own project to that of the engineers who built them. The human body is a machine of the same kind, the difference in our case being a rational soul actually united to it. His two published tests for telling a man from a machine that resembled one are, first, that whatever has thought can arrange words or other signs to declare its thoughts to others in whatever situation it happens to be in — something the dullest and most impaired human beings manage and no animal ever does — and second, that even a machine which matched us at a great many things would inevitably fail at others, and those failures betray a thing acting not from knowledge but from the disposition of its organs. He also maintains, against an objector in the Fourth Set of Objections and Replies, that the mind thinks always, including in the womb, and that we simply do not retain the thoughts of that period. And when an English theologian pressed him near the end of his life on whether the doctrine renders beasts insensible and licenses cruelty toward them, he resisted the inference and declined to treat the denial of thought as a denial of everything we call feeling in an animal.

  Here is the case my reading group could not settle, drawn from the long-running laboratory work on vocal labels in psittacines and idealized slightly for the sake of the argument. Over twenty years a grey parrot has acquired several hundred labels, used appropriately for objects, colours, shapes, and materials; it reports which of two trays holds more of a requested category; it spontaneously asks what a newly presented object is called and repeats the question until it is answered; it refuses a mislabelled item and corrects the trainer; and it combines familiar labels into requests it was never trained to make, including requests for combinations of two foods and for being carried to a named place. At the same time it fails a battery that an ordinary three-year-old human being passes: no role reversal in a two-partner game, no pretence, no deception about the symbols themselves (it will not mislabel a container to send a competitor to the empty one, even where that would pay), no comprehension of a two-clause instruction concerning an object that is absent, no embedding of one label inside another — and its errors are strikingly predictable from its reinforcement history, in the sense that its trainers can trace every success back to shaping. What I want is not my own view, nor what a present-day philosopher of mind should say, but what this record commits Descartes to. Which verdict do you predict: that it thinks, that it does not, or that it feels without thinking? And which single precedent is the closest analogue — the trained magpie, the deaf sign-inventor, the beaver's dam, the garden automaton, the human body, or the thinking infant in the womb — and in which respects does that analogy carry the weight?

  It seems to me that the verdicts I listed are jointly consistent with at least four rules, and that the parrot splits them. A rule keyed to the use of signs to declare thought appears to be partly satisfied here, since it asks questions and composes novel requests. A rule keyed to generality delivers the opposite verdict, since any failure at something a lesser creature manages is proof of mechanical operation, and the failures are numerous. A rule keyed to explicability also delivers the opposite verdict, since thought is posited only where the arrangement and history of the parts cannot account for the behaviour, and here they arguably can. And a rule keyed to the substance of the soul and its union with a human body makes the behavioural tests merely diagnostic, so that they can always be satisfied spuriously by a machine. Say what each rule predicts, which one he would most plausibly retreat to under pressure, and what that retreat costs him — in particular, whether the sign test can still function as evidence for him once a non-human passes part of it, or whether it has become immune to disconfirmation. State the principle he would be adopting on each option: if he calls the parrot an automaton despite its questions and its novel requests, is the work being done by a species clause, by the absence of a failure-proof generality, or by the availability of a shaping explanation? Then name the further case that would best discriminate among the four rules — I suspect it is not another clever animal but something else entirely — and tell me whether the Fourth Replies commitment that the mind always thinks, or the late refusal to equate thoughtlessness with insensibility, exerts any pull on this case that I have overlooked. If any of the verdicts as I have reported them cannot be reconciled with the rest, flag it rather than reasoning around it. I have the editions and translations to hand, so please argue from the material as I have set it out rather than directing me to sources.
reasoning: |-
  Okay, let me approach this methodically. The user presents a complex thought experiment about applying Descartes' criteria to a hypothetical parrot case, seeking to resolve tensions in his behavioral tests. 

  First, I need to map Descartes' existing verdicts onto four potential interpretive rules:
  1. Sign-use test (declaring thought through adaptable communication)
  2. Generality test (consistent performance across diverse tasks)
  3. Explicability test (behavior unexplainable by mechanical causes)
  4. Substance-based view (soul as defining human exception)

  The parrot case deliberately fractures these criteria: it passes aspects of the sign test (novel requests, questions) but fails generality (predictable errors) and explicability (shaping history). 

  For the sign test, Descartes' correspondence with Newcastle establishes that situational/reward-tied utterances don't count - but the parrot's spontaneous questions complicate this. Its "what is that?" behavior mirrors human sign-invention more than the magpie's trained responses. However, Descartes' deaf human precedent requires sign-use to demonstrate thought independent of vocal organs - which the parrot's shaping history undermines.

  The generality test clearly fails here. Descartes' machine argument in Discourse V and Replies emphasizes that mechanical failures reveal non-thought - and the parrot's patterned errors align with this. Its inability to deceive or handle embedded clauses would be decisive for Descartes.

  On explicability, the shaping history provides a mechanical account. Descartes' beaver/bee examples show regularity as evidence of mechanism - and the parrot's reinforcement traces supply that. 

  The substance view would dismiss behavioral evidence entirely, but Descartes relies on behavioral diagnostics elsewhere. His late refusal to equate thoughtlessness with insensibility doesn't help here since it addresses feeling, not thought.

  The closest precedent is actually the garden automaton: both exhibit complex but traceable mechanical causation. The parrot's successes are like water displays - impressive but reducible to part-dispositions. 

  For discriminatory cases, consider:
  - A human with global aphasia who invents novel gestures (tests sign-use without speech)
  - A machine passing all behavioral tests (exposes substance-view problems)
  - An anencephalic infant (challenges "mind always thinks")

  The unresolved tension lies in Descartes treating deaf humans' sign-invention as conclusive proof while dismissing parrots' similar behavior. This inconsistency reveals his human-exceptionalism bias.
answer: |-
  Based strictly on Descartes' stated precedents and principles as you've outlined them, here is the analysis of the parrot case and its implications for his framework:

  ### 1. **Predicted Verdict**
     Descartes would unequivocally classify the parrot as a **non-thinking machine (automaton)**, despite its novel requests and questions. His core commitment to human exceptionalism—grounded in the rational soul's union with the human body—demands this. The parrot fails his two explicit published tests:  
     - **Generality of Sign-Use**: It cannot deploy signs adaptively *in all situations* (e.g., fails deception, embedding, role reversal).  
     - **Absence of Predictable Failure**: Its errors are traceable to reinforcement history, proving "disposition of organs" over understanding.  

  ### 2. **Closest Analogue: The Garden Automaton**  
     - **Why**: The parrot's successes (like the automaton's displays) are reducible to mechanical causes ("shaping" = water pressure/routing). Novel combinations are programmable outcomes of part-dispositions, not evidence of thought.  
     - **Key Respects**:  
       - Both exhibit complexity *without flexibility*: Automata execute pre-set routines; the parrot's "inventions" are shaped associations.  
       - Both "declarations" are situational: The parrot's questions/rewards mirror the automaton's triggered displays.  
     - *Contrasts with deaf humans*: Their invented signs reflect *spontaneous generality* (untrained, context-independent), which Descartes ties to the soul.  

  ### 3. **Analysis of Your Four Rules**  
     | **Rule**               | **Parrot Verdict** | **Principle Invoked**                                  | **Cost to Descartes**                                                                 |  
     |-------------------------|--------------------|-------------------------------------------------------|---------------------------------------------------------------------------------------|  
     | **Sign-Use Test**       | *Partially passes* | Signs must declare thought across novel situations    | Undermined if non-humans pass *any* part. Forces retreat to stricter criteria.        |  
     | **Generality Test**     | **Fails**          | Failure at *any* human-managed task proves mechanism  | Risks circularity: Humans define "generality," so animals *always* fail by design.    |  
     | **Explicability Test**  | **Fails**          | Thought exists only if mechanics *cannot* explain acts | Threatens to collapse into epiphenomenalism: Why posit thought if mechanics suffice? |  
     | **Substance-Based View**| **Fails**          | Only human bodies are united to rational souls        | Makes behavioral tests irrelevant. Opens charge of dogmatism (as you note).           |  

  - **Descartes' Retreat Under Pressure**: He defaults to the **Generality Test** (invoking predictable failures) *reinforced by* the **Explicability Test** (shaping history).  
     - **Principle**: "No failure-proof generality → mechanical operation."  
     - **Cost**: The Sign-Use Test loses evidentiary value once animals achieve partial success. It becomes a *corollary* of generality, not independent proof.  

  ### 4. **Discriminatory Case to Test the Rules**  
     - **Case**: A *human* with severe cognitive impairments (e.g., global aphasia) who **fails Descartes' sign-use/generality tests** but **exhibits inexplicable behaviors** (e.g., solves novel problems mechanically "impossible" for their condition).  
     - **Why**:  
       - **Substance View** *must* affirm they think (soul present).  
       - **Generality/Explicability Tests** *deny* thought.  
       - **Sign-Use Test** is silent.  
     - **Outcome**: Exposes Descartes' inconsistency in applying behavioral tests only to non-humans.  

  ### 5. **Overlooked Tensions in Descartes' Framework**  
     - **Fourth Replies (Thinking Infants)**: Asserts *all* humans think (soul active in womb). This is **incompatible** with the Generality/Explicability Tests: Infants fail behavioral criteria but are granted thought. *This bias toward human exception undermines the universality of his tests*.  
     - **Refusal to Deny Animal Sensibility**: Irrelevant here. Descartes distinguishes *feeling* (mechanical) from *thinking* (immaterial). The parrot's case concerns thought, not sensation.  

  ### 6. **Flagged Inconsistency**  
     Descartes' treatment of **deaf sign-inventors vs. parrots** is irreconcilable:  
     - Both invent/use signs contextually.  
     - He accepts human sign-invention as *proof of thought* but dismisses animal sign-use as *programmed response*.  
     - **Contradiction**: The explicability criterion (shaping history) could theoretically apply to humans (e.g., a child taught signs), but Descartes never allows this. The difference is species, not behavior.  

  ### Conclusion  
  Descartes is committed to denying thought to the parrot. Its successes are garden-automaton-like outputs; its failures prove mechanical limits. The Generality Test (invoked alongside Explicability) is his bulwark, but it rests on a human-exceptionalist foundation that his infant/impairment cases destabilize. The Sign-Use Test, once partially satisfied, ceases to function as independent evidence. The unresolved tension is his asymmetrical application of behavioral criteria: identical acts are "thought" in humans but "mechanism" in animals.
