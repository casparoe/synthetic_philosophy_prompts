  ## The Monsoon Broker
  The monsoon turned the harbor into a frothing beast, and with it, the town’s desires flipped like the tide tables pinned to every shop door. Dry season craved salt and hardtack; monsoon lusted after fresh fruit and rainwater rice. Everyone knew the turn was coming. That’s where I came in—Elias, the monsoon broker. My job was to guide souls through the predictable chaos of their own changing wants, trade by trade, taking a clipped copper bit each time, until they ended up right back where they started, just lighter in the purse.

  This season, my mark was Anya. She’d bound herself with a public vow at the Shrine of Tides: no trading at the season’s turn. Not one bolt of cloth, not one grain of rice. Her past self had shackled her future self, and the town buzzed about it. I found her on the Saltwalk, haggling fiercely over a basket of withered lemons—monsoon fruit, already losing their appeal as the dry winds whispered offshore.

  "Anya," I called over the gulls. "The turn’s at sundown. Let me walk you through the dance. No obligation. Just… see the steps."

  She eyed me, sharp as flint. "My vow stands, Elias. I won’t be pumped."

  "Of course not," I soothed. "But humor me. What’ve you got?" She showed me her haul: ten thick monsoon mangoes, ten sacks of dry-season saltfish, ten bundles of aromatic cinnamon bark. A balanced monsoon bundle, worthless tomorrow.

  "Perfect," I said. "Now, right now—this very breath—what do you crave? Honestly."

  She didn’t hesitate. "The mangoes. They’re gold. The fish… too salty for this damp. The cinnamon’s just for trade."

  "Exactly." I gestured to Old Man Hemlock’s stall. "See his sign? He’s dry-season minded already. Desperate for mangoes. He’ll give you saltfish for them, straight swap. But you’re Elias’s client, so I’ll handle it. Fee’s one copper bit." I mimed the trade. "You give one mango, get one saltfish. *Right now*, that feels good, yes? More of what you barely want, less of what you crave?"

  She frowned. "I suppose. But I know the dry’s coming. I *know* I’ll hate all this fish tomorrow."

  "Ah!" I held up a finger. "But *right now*, holding that mango? It’s torture. Trading it eases that itch. The future ‘you’ isn’t here. She’s a ghost." I led her down the wharf. "Now, Hemlock’s got dry-season cinnamon too, hoarded like treasure. You *loathe* fish right now. Trade one back to him for cinnamon. Fee: another copper." I scribbled in the air: *Mango down one, Fish unchanged, Cinnamon up one.* "Better?"

  "For this moment," she conceded, suspicion warring with the logic. "The fish is gone. I have cinnamon, which is… fine. Neutral."

  "Good! Now…" I pointed to the sky. The sun bled orange onto the horizon. "The turn. Dry season bites. Just like that." I snapped my fingers. "Suddenly, saltfish is ambrosia. Mangoes? Pah. Wet rubbish. Cinnamon? Still fine, but not fish." I steered her toward Marta’s smokehouse, reeking of drying fish. "Look at Marta. She’s monsoon-hearted still. Hates fish. Craves cinnamon. Trade her one cinnamon bundle for one of her precious fish. Fee: copper bit." *Mangoes down one, Fish up one, Cinnamon down one.* "Now you’ve got back a fish! The dry-season you is singing. But…" I tapped her dwindling coin purse. "Remember the mango?"

  Her eyes narrowed. "I have less cinnamon. And I started with ten mangoes, now I have nine. But I have ten fish again? And… nine cinnamon?"

  "Patience." I walked her back to Hemlock, now grinning dry-season glee. "He’s got your mangoes! Hates them. Loves cinnamon. Trade your last ‘spare’ fish for a mango. Fee: final copper." *Mangoes back to ten, Fish back to ten, Cinnamon back to ten.* "See? Bundle restored. Exactly as you began."

  She stared at her hands, as if the goods materialized there. "But… four coppers gone. For nothing."

  "Not nothing," I corrected gently. "For easing the craving *each time it bit*. You paid to satisfy the ‘you’ of each moment. The monsoon you got rid of unwanted fish for cinnamon. The dry-season you got rid of unwanted cinnamon for fish. Both were happy *at the time*. The cycle only bleeds you because the seasons turn."

  She shook her head, braids whipping like ropes. "It’s madness. Knowing I’d swap it all back, why wouldn’t I just… endure? Hold tight through the turn?"

  "Because holding tight *hurts*," I insisted, leaning close. "That mango in monsoon? It’s joy in your hand. Letting it go *now*, even knowing you’ll buy it back later with a fee, kills a little joy today. The future isn’t a weight you can feel; it’s the itch you *can* scratch. That’s the pump. Not stupidity. Just… time slicing desire into pieces."

  Her gaze stayed clouded, unconvinced. The explanation hadn’t landed. "My vow protects me. I won’t pay for phantom satisfaction."

  The dry wind rose, gritty and sharp. Vendors shuttered stalls; monsoon fruit vanished like dreams. Anya clutched her monsoon bundle: precious mangoes, despised saltfish, neutral cinnamon. I saw the revulsion flicker as the dry-season taste buds awoke in her—the mango’s cloying sweetness now sickly, the fish’s brine becoming nectar. She wouldn’t trade. Her vow held.

  For weeks, I saw her. Hauling water under the brass-bowl sun, her skin parched. She’d trade *within* the season—cinnamon for water, haggling fiercely—but never touched the core bundle. The saltfish became her staple, eaten with grim resolve. The mangoes shriveled in their net, a mocking reminder of lost sweetness. She avoided the bustling market where the pumps whirred, her jaw set. Was it discipline? Or was her past self robbing her present of comfort, forcing her to choke down fish while others savored theirs, paid for by copper bits they’d never miss?

  The cost was etched in the tightness around her eyes, the frugal sips of water. She endured. But as the dry earth cracked and the first distant thunder rumbled, heralding the next turn, I wondered. Would those ten shriveled mangoes taste like victory when the monsoon returned? Or would they just be fruit, exchanged in a future trade, while the memory of dry-season thirst lingered—a cost paid not in copper, but in grit and sand? The pump takes coins. The vow takes something else. I never learned which theft she minded less.
