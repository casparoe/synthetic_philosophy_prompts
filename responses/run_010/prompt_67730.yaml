answer: |-
  ### Step-by-Step Diagnosis  
  Your roommate’s argument is a **valid reductio ad absurdum** targeting pure will-based theories of promissory obligation. It fails due to a **category error in step (2)**, which conflates the *content* of a promise with the *conditions for its existence as a normative act*. Here’s the breakdown:  

  1. **Type of Failure**:  
     - **Step (2) → (3)** commits a **level confusion** (content vs. meta-commitment).  
     - **Step (4)** is **false** under most theories: escape clauses create *weaker but real obligations*.  
     - The core error is an **equivocation on "obligation"** between *unconditional duty* and *conditional commitment*.  

  2. **Rejecting Step (3)**: The Flaw in the Will-Based Account  
     - **Why (3) seems innocent**: If obligation springs *solely* from the promisor’s will (per (1)–(2)), then a self-canceling promise appears coherent.  
     - **Diagnosis**: The act of promising *presupposes a normative structure* it cannot unilaterally alter. A "promise" that says *"I commit until I don’t"* isn’t a promise—it’s a **descriptive statement of intent**. Promises require the *intention to undertake a constraint*; a built-in off-switch voids that intention by denying constraint.  
     - **Cost to will-based theories**: They must concede that promissory obligations depend on **background practices** (e.g., the promisee’s normative standing) to exist. Pure will isn’t sufficient.  

  3. **Rejecting Step (4)**: Why Escape Clauses Create *Some* Obligation  
     - **The false premise**: "No constraint = no obligation."  
     - **Reality**: An escape clause modifies but doesn’t negate obligation. You incur duties:  
       - To give **advance notice** (e.g., 2 weeks).  
       - To act **in good faith** (e.g., not quit before a critical project).  
       - To **train the replacement** *if* you leave (a conditional duty).  
     - **Analogy**: A lease with a 30-day termination clause still binds you until notice is given; violating *those terms* breaches the obligation.  

  ---

  ### How Different Theories Resolve This  
  | **Theory**                  | **Response to Argument**                                                                 | **Cost**                                                                 |
  |-----------------------------|------------------------------------------------------------------------------------------|--------------------------------------------------------------------------|
  | **Will-Based** (e.g., Roth) | Bites the bullet: Self-canceling "promises" are possible but incoherent (collapses into (5)).                         | Sacrifices intuitive binding force; minority view.                       |
  | **Expectation-Based** (Scanlon) | Rejects (3): Promises bind because they induce reliance. An escape clause *limits* reliance but doesn’t destroy it (e.g., you still rely on notice). | Must explain why some expectations (e.g., "no notice") aren’t protected. |
  | **Practice-Based** (Rawls, Searle) | Rejects (2): Promising requires a social practice defining "commitment." A self-voiding act violates constitutive rules. | Must ground the practice’s authority.                                    |
  | **Second-Personal** (Darwall) | Rejects (1): Obligation arises from the promisee’s authority to *hold you accountable*. You can’t unilaterally revoke their standing. | Requires a non-instrumental view of moral relations.                     |

  ---

  ### Settled vs. Contested Issues  
  - **Settled**:  
    - No mainstream theory accepts pure will-based obligations (step (1)) without *external constraints*.  
    - Escape clauses create **conditional obligations** (step (4) is false).  
    - The power to release **cannot reside solely with the promisor** for a promise to exist. If you alone control the "off-switch," it’s not a promise—it’s an announcement.  

  - **Live Debates**:  
    - **Where the normative force originates**: Expectations vs. practices vs. second-personal authority.  
    - **Whether the promisee must hold the release power**: Consensus: **yes**, but theories disagree *why*.  
      - Expectation-based: Promisee’s reliance gives them standing to release.  
      - Second-personal: Accountability requires the promisee’s authority.  
      - Will-based (rare): The promisor transfers control via the promise.  

  ---

  ### Verdict  
  Your instinct about a **level confusion** (steps 2–3) is correct. The argument fails because:  
  - **Step (2)** wrongly assumes the promisor’s act can define *what counts as an obligation*. In fact, promising is a **speech act** with constitutive rules: if it lacks constraint, it’s not a promise.  
  - **Step (4)** is empirically false: Real-world contracts with termination clauses still impose duties (notice, good faith).  

  **Cheapest fix**: Reject pure will-based obligation (step (1)). Most philosophers (e.g., Scanlon, Darwall) ground promises in the **promisee’s normative standing**, not the promisor’s will. This preserves binding force while allowing for limited escape clauses.  

  **Your roommate’s win?** Only against a strawman (radical will-based theory). In practice, his "promise" isn’t a promise—it’s a statement of intent with conditions. The agreement’s termination clause *modifies* the obligation but doesn’t void it.
