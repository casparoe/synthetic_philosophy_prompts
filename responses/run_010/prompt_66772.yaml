  The user's three focal points are razor-sharp:
  1) The speed of Germany's reversal despite no new technical data suggests risk perception is driven by sociocultural imaginaries more than probabilities. 
  2) The moral asymmetry between tolerating coal's certain deaths versus nuclear's catastrophic possibilities demands philosophical unpacking. 
  3) The institutional dimensions - liability caps and waste retrievability - reveal buried ethical commitments.

  For part one about risk judgment, I'm struck by how Fukushima functioned less as new information and more as a focusing event that shattered Germany's "risk denial equilibrium." The user's hunch about vividness trumping statistics feels right - but I should emphasize it revealed a pre-existing cultural vulnerability to nuclear anxiety dating back to Chernobyl and the anti-nuclear movement. The technical probability didn't change; Germany's emotional tolerance did.

  For the second part on moral asymmetry, their candidate theories are admirably comprehensive. The "dread vs familiarity" frame explains much - coal deaths are statistically abstract while nuclear accidents are media spectacles. But the consent angle might be even more fundamental: coal's harms feel like collective choices while nuclear feels like imposed technological risk. The liability cap regime they mention later actually proves this point - it literally externalizes nuclear risk.

  On institutional dimensions, they've nailed the disturbing truth about nuclear liability conventions: the Paris/Brussels treaties make nuclear risk socialism official policy. And Germany's retrievability requirement? That's intergenerational theater - pretending we're preserving future choice while actually burdening them with our waste.

  When reconstructing alternative policy paths, I need to be brutally concrete: German policy under strict consequentialism would have kept reactors running while accelerating coal phaseout - the exact inverse of what happened. France under consent-based ethics would need unlimited liability and local veto powers, gutting state control. 

  The user's closing challenge about falsifiability is excellent. My entire reading crumbles if: 1) Secret technical assessments actually drove Merkel's reversal (unlikely but possible), 2) New studies show nuclear's lifecycle mortality exceeds coal's (contra current IPCC data), or 3) French communities actually consent more meaningfully than assumed.

  This is the kind of query that reminds me why policy analysis without philosophy is just spreadsheet fetishism. The user isn't just comparing policies - they're excavating civilizational risk epistemologies.
answer: |-
  Your analysis cuts to the core of how national energy policies encode unstated philosophical commitments about risk, ethics, and sovereignty. Below is a systematic dissection of the presupposed theories in both cases, addressing each element of your query:

  ### I. The German Reversal: Presupposed Risk Theory
  **First Feature: Speed of Reversal & Non-Technical Basis**  
  Germany's abrupt policy shift presupposes that **risk perception is socially constructed and mediated by cultural trauma**, not merely probabilistic calculation. Fukushima acted as a *focusing event* that crystallized latent societal anxieties, validating three implicit premises:  
  - **Vividness over Statistics**: Harm that is dramatic and imaginable (meltdowns, radiation plumes) outweighs statistically greater but mundane harms (coal pollution).  
  - **Epistemic Humility**: Fukushima revealed that *unknown unknowns* (e.g., cascading failures from extreme external events) make probabilistic risk assessment (PRA) inherently incomplete.  
  - **Democratic Responsiveness**: The state treated risk acceptability as contingent on public consent, which evaporated after Fukushima.  

  *Does this require "vivid imagination" or reveal "invariant unknowns"?*  
  - **Requires vividness**: Without media imagery of Fukushima, the reversal lacks impetus.  
  - **Reveals invariant unknowability**: German plants were always vulnerable to *unforeseen* combinations of failures (e.g., loss of grid + backup failure), making PRA inadequate for "maximum credible accidents."  

  **Second Feature: Moral Asymmetry (Nuclear vs. Coal)**  
  The commission’s composition signals that nuclear risk is categorically distinct due to:  
  - **Non-Compensability**: Nuclear accidents create irreversible harm (e.g., land contamination, intergenerational health effects) that cannot be remedied financially or medically. Coal harms are compensable (e.g., healthcare, pollution controls).  
  - **Consent & Agency**: Coal mortality is framed as a *diffuse byproduct of societal choices* (implicitly consented to via decades of energy use), while nuclear risk is *actively imposed* by a centralized technological elite.  
  - **Dread vs. Familiarity**: Coal deaths are "normal accidents" of industrial society; nuclear meltdowns are *civilization-threatening events* that rupture social trust.  

  *Testing Your Candidate Theories*:  
  | Theory                          | German Practice | Notes |  
  |---------------------------------|-----------------|-------|  
  | Dread vs. Familiarity           | **Requires**    | Core to moral asymmetry; dread triggers taboo logic |  
  | Lack of Consent                 | **Requires**    | Nuclear seen as "imposed"; coal as "legacy system" |  
  | Doing vs. Allowing              | **Fits**        | Shutting nukes = stopping active imposition; coal phaseout = allowing existing harm to decline |  
  | Structural Harm (Concentrated)  | **Requires**    | Uncontainable catastrophes violate solidarity norms |  
  | Insurability                   | **Requires**    | Liability caps prove nuclear risk is socialized; state won’t underwrite tail risk |  

  *Philosophical Underdetermination*:  
  - The reversal is compatible with both **deontological** (nuclear violates consent/dignity) and **virtue ethics** (prudence demands avoiding catastrophe). A purely consequentialist reading fails.  

  ### II. French Policy: Presupposed Risk Theory  
  France presupposes **technocratic paternalism**:  
  - **Risk as Calculable & Manageable**: Complex systems can be mastered via state expertise; Fukushima is attributed to Japanese regulatory failure, not inherent nuclear risk.  
  - **Sovereignty Trumps Consent**: Energy autonomy and decarbonization are collective goods justifying state imposition of risk. Public consultations (e.g., *débats publics*) are informational, not consensual.  
  - **Consequentialism Dominates**: The greater harm (climate change, reliance on Russian gas) outweighs nuclear risks.  

  *Liability Regime & Institutional Commitments*:  
  - Your description is accurate: The Paris/Brussels Conventions cap operator liability (€1.5B for FR) and channel claims to the operator. This presupposes that:  
    - Nuclear risk is *politically unavoidable* for decarbonization, requiring socialization of costs.  
    - States may redistribute risk burdens without direct consent if they serve national interests.  
  - **Waste Retrievability in Germany**: Presupposes that future generations deserve *flexibility* (avoiding irreversible mistakes) but ignores that retrieval transfers costs/decisions to them. It reflects **weak intergenerational equity** – we preserve options but force them to manage our waste.  

  ### III. Alternative Policy Sketches  
  **Germany under Rigorous Expected-Harm Consequentialism**:  
  - Keep reactors operating until coal is phased out (pre-2030), saving ~1,100 lives/year from coal pollution (per EU emissions data).  
  - Drop the retrievability mandate (favoring permanent geological disposal to reduce costs/future burdens).  
  - Invest savings in grid resilience and renewables.  
  - *What survives*: Renewable subsidies; grid upgrades.  

  **France under Consent-Based Deontology**:  
  - Unlimited liability for EDF (no caps); plants require local/regional consent via binding referenda.  
  - No new builds without proven waste solution accepted by host communities.  
  - Phase out oldest reactors (avoiding "imposed risk" without renewal).  
  - *What survives*: State ownership; R&D on nuclear tech.  

  ### IV. Vulnerabilities in My Reconstruction  
  1. **Technical Factors in German Reversal**: If internal reports pre-Fukushima revealed *new* vulnerabilities (e.g., German plants lacked filtered vents), this weakens the "pure ethics" reading.  
  2. **Coal vs. Nuclear Mortality**: If nuclear's lifecycle mortality (mining, construction) rivals coal's (highly contested: IPCC cites nuclear median 1gCO₂/kWh vs. coal 820g), the moral asymmetry collapses.  
  3. **French Public Consent**: If EDF's "public consultations" involve meaningful local veto powers (they don’t), my "paternalism" claim is overstated.  

  ### What Would Change My Verdict  
  - **Evidence**: Documentation showing Merkel’s 2011 decision relied on undisclosed safety assessments (not ethics).  
  - **Argument**: A demonstration that Germany’s coal phaseout timeline was *accelerated by nuclear closure* (data shows lignite use increased until 2013).  
  - **Institutional**: Proof that the liability regime’s caps are actuarially sound (they’re not: Chernobyl cost ~$235B; Fukushima ~$200B).  

  **Closing Synthesis**: Germany’s policy presupposes **risk as a sociocultural taboo**, where democratic legitimacy demands avoiding *unbounded, unconsented* catastrophes. France presupposes **risk as a technical parameter**, subordinate to state-managed collective goods. Both are coherent but irreconcilable – exposing how energy transitions are ultimately contests over political morality, not just engineering.
