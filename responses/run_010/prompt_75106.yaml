  **1. Indistinguishable Leaf Pairs**:  
  - **Leaf E vs. Leaf G**: Both predict high escalation in (a), (g), and (e), but not in (d) Round 5.  
    *Separation test*: Run auction (d) with 20+ rounds. **Leaf E** predicts *consistent* high escalation (loss-avoidance loop). **Leaf G** predicts volatile bids (mixed strategies).  
  - **Leaf F vs. Leaf I**: Both predict reduced escalation in (d) Round 5.  
    *Separation test*: Run auction (d) with new partners each round. **Leaf F** collapses (no reputation building). **Leaf I** persists (audience still watches).  

