  ### Decision Tree Handout: Explaining Escalation in Dollar Auctions

  **Instructions**:  
  Answer each question based on observed outcomes from the seven auction variants. Circle "Yes" or "No" for each node. Follow the arrows to the next node until you reach a leaf (final explanation). Do not skip ahead—each question builds on prior answers.  
  **Note**: Variant (g) is a new, untested auction. Base your answer on your prediction of what *would* happen.

  ---

  #### **Node 1**: In auction (c) (second-highest bidder refunded), does bidding stop at or below $1.00?  
  - **Yes** → Go to Node 2.  
  - **No** → **Leaf A**: Escalation as something the structure of the game genuinely licenses.  
    *(Disputed: Some game theorists argue rational bidders *should* escalate beyond $1.00, even with refunding. Others contest this.)*

  #### **Node 2**: In auction (a) (standard rules, public bids, audience), does bidding escalate above $2.00?  
  - **Yes** → Go to Node 3.  
  - **No** → **Leaf B**: No significant escalation observed.  
    *(Rare in data; only if bidders avoid bidding entirely.)*

  #### **Node 3**: In auction (b) (private written bids, audience), does bidding escalate above $1.50?  
  - **Yes** → **Leaf C**: Escalation as something the structure of the game genuinely licenses.  
    *(Disputed: Predicts escalation regardless of bid privacy; contradicts observed data.)*  
  - **No** → Go to Node 4.  

  #### **Node 4**: In auction (g) (public bids, *no audience*), does bidding escalate above $2.00?  
  *(New variant: Identical to (a) but held privately with only bidders and auctioneer.)*  
  - **Yes** → Go to Node 5.  
  - **No** → Go to Node 6.  

  #### **Node 5**: In auction (e) (hard cap at $2.00), do bidders run bids to the cap?  
  - **Yes** → Go to Node 7.  
  - **No** → **Leaf D**: Escalation as a failure to ignore sunk costs.  
    *(Disputed: Sunk costs alone rarely explain cap-driven escalation; contradicts data.)*  

  #### **Node 7**: In auction (d) (repeated rounds, first round), does bidding escalate above $2.00?  
  - **Yes** → Go to Node 8.  
  - **No** → **Leaf E**: Escalation driven by bidder's shift into a loss situation.  
    *(Broadly agreed as a psychological mechanism, but disputed in causal dominance.)*  

  #### **Node 8**: In auction (d) (fifth round), does bidding stop at or below $1.10?  
  - **Yes** → **Leaf F**: Reputation effects across repeated rounds.  
    *(Broadly agreed for repeated games; less disputed.)*  
  - **No** → **Leaf G**: Escalation as the mixed-strategy outcome of a war of attrition.  
    *(Disputed: Dollar auctions ≠ canonical war-of-attrition games; empirical support is weak.)*  

  #### **Node 6**: In auction (f) (talking allowed), do bidders collude to pay under $1.00?  
  - **Yes** → **Leaf H**: Collusion among bidders.  
    *(Broadly agreed for communication-enabled auctions.)*  
  - **No** → **Leaf I**: Not wanting to be seen backing down in front of an audience.  
    *(Broadly agreed in social psychology; robust evidence for audience effects.)*  

