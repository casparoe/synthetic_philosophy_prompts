answer: |-
  Here's the fix-first priority and targeted comments, under word limit:

  **Fix First: Your unresolved Worry #2 (invented cowardice + flagging)**  
  This *does* sink the piece. Non-foreclosure feels ethically incomplete here. Descendants (and viewers) aren't just owed *awareness* of invention; they're owed **respect for the subject's fundamental humanity and legacy**. Flagging a damaging invention doesn't neutralize its harm or fulfill the deeper duty to avoid gratuitous character assassination. You need to either:
  *   Concede non-foreclosure is a *necessary but insufficient* duty, requiring an additional ethical layer (e.g., proportionality, good faith interpretation of known character), OR
  *   Sharpen non-foreclosure to explicitly exclude inventions that **irredeemably distort the core historical significance or character** of the subject, even when flagged. The "cowardly motive" likely crosses this line.

  **Other Comments:**

  1.  **"Spends credibility it never earned":** This phrasing is slightly misleading. The film *borrows* credibility inherent in the *subject's reality*, but it *spends* (risks) its *own* credibility/artistic integrity via inventions. Rephrase for clarity: "...exploits a credibility derived solely from the subject's existence, credibility it hasn't validated through its own depiction."
  2.  **Thesis Statement Refinement:** "What a film owes the dead isn't accuracy... but non-foreclosure." Strengthen by linking directly to your gap taxonomy: "...isn't accuracy *within the gaps*, but **signposting those gaps** to prevent foreclosure." Emphasizes the *method*.
  3.  **Worry #1 (Recent Trauma/Contested Testimony):** This is valid and deep. Acknowledge that non-foreclosure (via seams) might be **inappropriate or insufficient** when depicting contested events involving living victims or recent atrocities. The ethical duty here likely shifts towards **deference to living testimony** and recognizing potential real-world harm, potentially requiring *different* mechanisms than seams or even limiting certain inventions altogether.
  4.  **Taxonomy Value:** **It earns its keep**, but needs tightening. The labels are slightly abstract ("Persons"). Rename for instant clarity:  
      (1) **Attested Outcome → Imagined Event** (Needed scene occurs)  
      (2) **Attested Event → Imagined Dialogue**  
      (3) **Attested Action → Imagined Motive**  
      (4) **Attested Context → Imagined Character** (Composite/fictional person)  
      This highlights the *attested core* vs. the *invented elaboration* for each type, making the distinction harder to collapse.
