  Okay, the user is describing a fascinating phenomenon in moral and political bargaining where two parties make a trade on issues they consider non-negotiable values. They're both happy with the arrangement until someone explicitly points out that it was a trade. At that point, both sides react strongly, feeling cheapened, and the agreement starts to unravel. The user gives two examples: a coalition between housing-density and fare policy groups that fell apart after a member described their swap, and a family funeral arrangement that collapsed when the son joked about "getting his half."

  The user is clearly well-versed in concepts like sacred values and taboo trade-offs but insists this is different because the trade itself is acceptable—it's the explicit acknowledgment that causes problems. They want to know if there's an established concept for this, and if not, they want a well-defined term with clear boundaries.

  Hmm, this feels like a blend of sociology, psychology, and philosophy. Let me think about related concepts. Taboo trade-offs come to mind, but those usually condemn the trade itself, not just its articulation. Hypocrisy doesn't fit because both sides genuinely accept the arrangement until it's named. Euphemism is too shallow—this isn't just polite language but a fundamental refusal to acknowledge the trade's nature.

  What about symbolic vs. instrumental action? In the funeral example, the mother sees the church service as sacred (symbolic), while the son views his role instrumentally. But the coalition example is more instrumental on both sides. The key seems to be the cognitive dissonance when the instrumental framing contaminates the symbolic value.

  The retroactive unraveling is crucial. Naming the trade forces both parties to confront the contradiction: they've treated a sacred value as negotiable. That triggers cognitive dissonance, and to reduce it, they reject the trade altogether. The user mentioned "mutually assured humiliation"—perfect phrasing. Both sides feel exposed and retaliate to save face.

  Boundaries: This isn't ordinary discretion, where avoiding offense is the goal. Here, naming the trade destroys the value itself. It's also not bad faith because both sides initially believed in the compromise. The line blurs if one side was always cynical, but in the pure case, sincerity is key.

  Term suggestions: "Value-trade paradox" captures the contradiction but might be too broad. "Compromise dissociation" emphasizes the denial mechanism. "Unnameable bargaining" is descriptive but clunky. The user's "mutually assured humiliation" is vivid but maybe too dramatic. "Sacred-instrumental collapse"? Hmm, needs work.

  The user's deep need seems to be conceptual clarity for something they've observed repeatedly. They might be developing a theory or policy approach and need precise language. Frustration with existing frameworks is palpable—they've done their homework but found gaps. Nailing this could help them analyze real-world conflicts more effectively. 

  Final thought: This sits at the intersection of "pluralistic ignorance" (both privately accept the trade but assume others don't) and "belief fusion" (values tied to identity). When named, the illusion shatters. Term-wise, "Fragile Value Truce" feels right: temporary, stability-dependent on silence, values at stake. Boundaries: collapses under explicit instrumental framing, unlike mere euphemism; requires mutual sincerity, unlike hypocrisy.
answer: |-
  What you're describing is a fascinating and under-discussed phenomenon. While it touches on several established concepts, it doesn't have a single, universally accepted name. It's a distinct blend of **cognitive dissonance avoidance**, **sacred value protection**, **face-saving**, and the **performative nature of value commitment**. Let's break it down:

  **Core Elements of Your Phenomenon:**
  1.  **Value-Based Issues:** Both sides treat the issues as non-negotiable *values* (sacred, identity-linked, moral), not mere preferences.
  2.  **Implicit Bargaining:** A tacit or explicit trade *does* occur ("A for B"), satisfying instrumental goals.
  3.  **Mutual Satisfaction:** Both sides are initially content with the outcome *as experienced*.
  4.  **The Verbalization Taboo:** Explicitly *describing the interaction as a trade* is catastrophic.
  5.  **Retroactive Devaluation & Punishment:** Naming the trade causes both sides to:
      *   Reinterpret their own concession as a betrayal/violation.
      *   Feel their core value has been cheapened or commodified.
      *   Turn aggressively on the namer and often each other.
      *   Partially or fully unravel the agreement.
  6.  **Self-Enforcement:** The prohibition and punishment come *from the participants themselves*, not outsiders.

  **Why Existing Concepts Don't Fully Capture It:**

  *   **Taboo Trade-offs:** Focuses on the *inherent unacceptability* of trading a sacred value (e.g., life for money). Your phenomenon is different: *the trade itself is pragmatically acceptable and occurs*. The taboo is on *naming* it, triggering a retroactive realization of the taboo violation.
  *   **Hypocrisy:** Involves a *contradiction between belief and action*. Here, the action (the trade) is initially acceptable. The contradiction *only becomes apparent and unbearable when named*, forcing the actors to confront their own inconsistency. They then *become* hypocrites retroactively in their own eyes.
  *   **Euphemism/Politeness:** Involves using softer language to avoid offense. This goes deeper: *any* direct description of the trade mechanism, even clinically accurate, is destructive. It's not about softening language but about maintaining a necessary fiction about the *nature* of the agreement.
  *   **Moral Compromise:** General term for finding middle ground on values. Doesn't capture the specific fragility induced by *verbalizing the instrumental nature* of the compromise.
  *   **Pluralistic Ignorance:** People privately accept something but believe others don't. Here, both privately (and temporarily) accept the trade *instrumentally*, but naming it forces a confrontation with the dissonance between that instrumental acceptance and their professed sacred value. It shatters the illusion that "we didn't *really* trade; we found a higher harmony."

  **A Proposed Name & Definition:**

  **Fragile Value Truce (FVT)**

  **Definition:** An implicit or explicit agreement resolving conflicting sacred values through reciprocal concessions, which is functionally stable only as long as the instrumental, transactional nature of the concession exchange remains unarticulated. Explicit verbalization of the trade mechanism triggers intense cognitive dissonance in both parties, leading to retroactive devaluation of their own concessions as value betrayals, aggressive condemnation of the verbalizer (and often each other), and potential unraveling of the agreement.

  **Core Mechanism:** The trade creates a state of **cognitive dissonance** held in suspension. Participants simultaneously hold:
      *   Belief 1: "Value X is sacred/non-negotiable."
      *   Belief 2: "I conceded on X (in exchange for Y)."
      *   Resolution Strategy: Implicitly treating the concession *as if it weren't a concession on the sacred value itself*, perhaps framed as "context," "limited application," "respect," or simply not examined. *Naming the trade shatters this fragile resolution*, forcing Belief 1 and Belief 2 into direct, undeniable conflict. The dissonance is resolved by rejecting Belief 2 ("My concession was a terrible mistake/betrayal!") and attacking the source of the discomfort (the namer and the "tainted" agreement).

  **Boundaries and Edge Cases:**

  1.  **Where FVT Starts:**
      *   Issues involve values treated as sacred/non-negotiable *by the participants*.
      *   A reciprocal concession trade *actually occurs* and is initially accepted.
      *   Stability is *contingent* on not acknowledging the trade's instrumental logic.
      *   Naming the trade causes disproportionate, retroactive negative reactions *from the traders themselves*.

  2.  **Where FVT Stops / Blurs into Similar Concepts:**
      *   **Ordinary Discretion/Politeness:** If naming the trade causes *mild offense* or *awkwardness* but doesn't trigger retroactive devaluation, unraveling, or intense aggression from the traders themselves, it's just tactlessness. FVT requires the catastrophic reaction. (e.g., "Perhaps we helped each other out?" might cause eye-rolls, not nuclear fallout).
      *   **Ordinary Bad Faith/Cynicism:** If one or both parties *never* sincerely held the value as sacred and were *always* purely instrumental, naming the trade might cause anger at being exposed as hypocrites to outsiders, but not the *internal* retroactive value betrayal and unraveling. FVT requires some initial level of sincerity in the value commitment *and* the functional acceptance of the outcome. The shock comes from confronting their *own* inconsistency.
      *   **Failed Bargaining:** If the trade is proposed explicitly *upfront* and rejected *because* it's seen as a taboo trade-off, that's standard sacred value territory, not FVT. FVT requires the trade to have been *implemented and accepted* before the naming causes collapse.
      *   **External Enforcement:** If the outrage comes *only* from external observers (not the traders) calling out hypocrisy or a taboo trade-off, it's not FVT. The traders themselves must turn on the namer *and* their own past acceptance.
      *   **Preference-Based Bargaining:** If the issues are openly acknowledged as preferences or interests ("I want A, you want B, let's swap"), naming the trade is expected and unproblematic. FVT requires the values to be framed as non-tradeable *in principle*.
      *   **Single-Issue Compromise:** If it's concessions *within* one value domain (e.g., how much pollution is acceptable), without the clear "A-for-B" reciprocal exchange across distinct value domains, it's less likely to trigger FVT. The explicit "swap" across sacred boundaries is key.

  **Why "Fragile Value Truce" Fits:**

  *   **Fragile:** Highlights the extreme sensitivity to the specific act of *naming* the trade mechanism.
  *   **Value:** Centers the core issue being the conflict and temporary suspension of dissonance around sacred values.
  *   **Truce:** Emphasizes that it's a temporary, negotiated peace (often uneasy but functional) that depends on maintaining a specific fiction. A truce can be broken.

  **In essence:** You've identified a specific psychological and social mechanism where the *performative maintenance of value purity* is essential for the stability of an otherwise pragmatic, reciprocal concession on those very values. The trade works *only* as long as everyone pretends it wasn't *really* a trade in the core sense that would violate the sacredness of the values involved. Naming it destroys the illusion, forcing an unpleasant confrontation with the inherent contradiction, leading to a defensive and destructive backlash. It's not just hypocrisy; it's hypocrisy that *only becomes unbearable and visible when named*, maintained by a collective, fragile suspension of disbelief.
