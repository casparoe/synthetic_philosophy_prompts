prompt: |-
  I'm trying to get my head around Copycat (the Hofstadter/Mitchell letter-string model) and there's one conceptual point I keep tripping on. Take aabc : aabd :: ijkk : ? — to land on ijll the model has to let rightmost letter slip over into rightmost group, rather than staying put. Fine, I buy that's slippage. But what's actually doing the work in picking that slip rather than some other one? I get the pieces: a slipnet with conceptual depths and halos, codelets getting chucked onto the coderack, and a temperature that drops as the workspace gets more confident in its current viewpoint and that controls how far a slippage is allowed to go. My worry is that this all looks like a description-length prior with extra steps — score finished candidate answers by how compact the rule is, times how activated the relevant concepts are, and you'd also produce ijll most of the time plus the occasional abd for the plain ijk case. So what does temperature buy you that a static cost function over completed interpretations doesn't? Put differently: what does it really amount to, to say that a half-built structure can change what it is partway through a search, and why is that supposed to matter for getting the analogy right instead of just getting lucky?
