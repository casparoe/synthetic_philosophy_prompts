  First, I need to map what each camp actually requires for their position to hold. For the deflationist's minimalism to work, the equivalence schema must genuinely exhaust truth's theoretical role, and all apparent explanatory uses of truth must be reducible to generalizations. Conversely, substantive theorists need truth to play irreducible causal/explanatory roles - like explaining the explorer's survival - that demand a robust property. 

  The user's Quinean indispensability hypothesis is sharp: if both sides accept that indispensable explanatory role justifies property-positing, their truth dispute collapses into whether truth meets that standard. But do they? Deflationists likely reject the principle itself, seeing "property" as thin whenever we have predicates. Substantivists embrace it. 

  This reveals three layers: 1) The surface truth debate 2) The meta-methodological split about indispensability 3) Potentially deeper commitments about what counts as a "property" or "explanation." The user asks whether this is substantive, verbal, or normative. 

  Substantive disagreement seems clear at the meta-level: they fundamentally disagree about when we're licensed to posit properties. But it's entangled with verbal elements - their definitions of "property" likely differ. Normative dimensions appear too: what a theory of truth should explain is evaluative. 

  Progress might come from isolating these layers. We could: A) Find a neutral criterion for "substantive property" both accept (unlikely) B) Identify a concrete case where their predictions diverge (e.g., does truth explain success in non-generalizable contexts?) C) Shift focus to meta-methodology explicitly. 

  The deepest insight may be recognizing that "property" isn't monolithic. Deflationists see it as minimal/logical; substantivists as causal/explanatory. Until this schematic difference is addressed, the debate will continue talking past itself. The user's hypothesis successfully reframes the stalemate but shows reconciliation requires unpacking these presuppositions first.
answer: |-
  Here's a careful diagnosis grounded in the commitments of each side, assessing your hypothesis and exploring paths to progress:

  **What Each Side is Committed To & What Must Be True for Their View:**
  1.  **Deflationist (Horwich, Field):**
      *   **Core Commitment:** The *only* theoretically significant function of 'true' is expressive generalization (endorsing infinite conjunctions/disjunctions). The Equivalence Schema (ES) - "<p> is true iff p" - exhaustively captures its content.
      *   **What Must Be True:** Explanatory uses of 'true' (e.g., "he survived because his beliefs were true") *must* be paraphrasable away without loss into generalizations citing only the specific contents of the beliefs and their causal efficacy, relying solely on the ES. Truth itself adds no *explanatory power* beyond the instances. There is no substantive *property* "truth" over and above what is captured by the ES and its generalization function. Talk of a "property" here is merely a reflection of having a predicate satisfying the ES.

  2.  **Substantivist (Correspondence, Lynch's Pluralism):**
      *   **Core Commitment:** Truth is a substantive property (either uniform or plural) that plays an indispensable *explanatory role* in our best theories (e.g., explaining success, convergence, meaning, normativity of belief). This property cannot be reduced to the expressive function captured by the ES.
      *   **What Must Be True:** Explanations like "he survived because his beliefs were true" *cannot* be fully paraphrased without loss into explanations citing only the specific belief contents and causal chains. The *generality* and *unifying power* of citing truth *itself* as the explanatorily relevant feature must be irreducible. Truth is a genuine explanatory posit.

  **Your Hypothesis: The Dispute is Really About Indispensability**
  *   **What Must Be True:** For your hypothesis to be correct, the disagreement about truth *must stem primarily* from a deeper disagreement about the following methodological principle (MP): *If a concept (like 'truth') is indispensable for formulating our best explanations (e.g., of success, normativity, cognitive coordination), then we are ontologically committed to a substantive property corresponding to that concept.*
  *   **Deflationist Stance on MP:** They would **reject** MP. For them, the indispensability of 'true' in explanations is *solely* due to its expressive, generalizing function. Citing 'true' in an explanation is just a placeholder for enumerating the specific truths involved and their specific causal roles. It adds no *extra* explanatory element warranting a distinct property. They see no need for truth itself to be a causal/explanatory *relatum*.
  *   **Substantivist Stance on MP:** They would **accept** (a version of) MP. They argue that the indispensable role 'true' plays in our best explanations *cannot* be reduced to its expressive function; it genuinely picks out a feature (the property of being true) that is doing the explanatory work. Its indispensability signals ontological commitment.

  **Diagnosis: Substantive Meta-Methodological Dispute, Entangled with Semantic/Normative Elements**
  1.  **Core Substantive Disagreement:** The fundamental clash is indeed meta-methodological and ontological: **Is the indispensability of 'true' in certain explanations sufficient (and necessary) grounds for positing truth as a substantive explanatory property?** Deflationists say no; Substantivists say yes. This *is* a substantive disagreement about the criteria for ontological commitment arising from explanatory practice.
  2.  **Entangled Verbal/Conceptual Element:** This meta-dispute is entangled with how each side understands key terms:
      *   **"Property":** Deflationists often work with a very thin, minimal conception of "property" (e.g., any predicate satisfying certain syntactic/semantic rules marks a property). Substantivists work with a thicker, more robust conception (e.g., a property must play a causal/explanatory role, or be a genuine unity underlying diverse phenomena). This difference *fuels* the disagreement over MP. Whether the dispute *over "property"* is merely verbal is debatable; it reflects deeper commitments about metaphysics and language.
      *   **"Explanation":** Deflationists often demand explanations ultimately bottom out in non-semantic, non-intentional physical facts. Substantivists are comfortable with explanations citing intentional/semantic properties as irreducible. This reflects broader commitments about reduction and the autonomy of higher-level explanations.
  3.  **Normative Element:** The question "What does a theory of truth *owe* us?" is inherently normative. Substantiates argue a theory *must* explain truth's normative force and its apparent explanatory power. Deflationists argue a theory *only* owes an account of the function of the truth predicate. The methodological dispute over MP is partly driven by these differing normative expectations about the theory's role.

  **Paths to Progress:**
  True progress requires addressing the meta-methodological stalemate. Here are potential paths, ranked by difficulty:

  1.  **Identify a Neutral Criterion for "Substantive Property":** Find a criterion for when indispensability warrants a "substantive property" that both sides *could* accept *prior* to adjudicating the truth case.
      *   *Challenge:* Deep metaphysical commitments make this extremely difficult. Deflationists are often naturalists skeptical of non-natural properties; substantivists (especially pluralists) may embrace a more expansive ontology. Agreeing on a neutral criterion *is* agreeing on the core of MP.

  2.  **Find a Concrete Case Study with Divergent Predictions:** Identify a specific, novel explanatory context (beyond the well-worn "explorer" case) where:
      *   Deflationism *requires* that the explanation *must be* paraphrasable without 'true' without loss.
      *   Substantivism *requires* that such paraphrases *necessarily* fail or distort the explanation.
      *   *Challenge:* Deflationists are masters of ingenious paraphrases. Substantiates must show a paraphrase genuinely misses an essential, generalizable explanatory element captured *only* by 'true'. Finding a clear-cut case that doesn't beg the question against one side is hard.

  3.  **Shift the Question to Meta-Methodology Explicitly:** Explicitly frame the debate as being *primarily* about MP and the criteria for ontological commitment from explanation. Ask:
      *   Are there *other* concepts where deflationists accept MP? (e.g., logical constants? mathematical objects? - though these are contentious).
      *   Can substantivists point to clear cases where indispensability *clearly does* warrant a property (by their lights) that deflationists accept, creating pressure for consistency?
      *   Can deflationists offer a compelling *positive* account of explanatory indispensability without ontological commitment, robust enough to cover all cases *including* truth?
      *   *Prospect:* This is the most promising route. It forces each side to defend their broader methodological stance and its implications, moving beyond truth-specific rhetoric. Success would mean either convincing the other side on MP *or* showing how their view of truth is inconsistent with their broader methodological commitments.

  **Conclusion:**
  Your hypothesis is largely correct. The decades-long stalemate arises because the disagreement **is** fundamentally about a meta-methodological principle (MP) concerning indispensability and ontological commitment, deeply intertwined with differing conceptions of "property" and "explanation," and normative views on what a theory of truth should do. While not *purely* verbal, the differing interpretations of key terms sustain the dispute. Progress is unlikely to come from rehashing the standard moves about normativity or the explorer within the truth debate itself. The only viable path forward is to **explicitly confront the meta-methodological disagreement about indispensability (MP)**, seeking either a neutral criterion, a decisive case study, or exposing inconsistencies in how each side applies their methodological principles beyond truth. Failing that, the stalemate persists because the core assumptions about explanation and ontology are too deeply entrenched.
