prompt: |-
  Still buzzing from a two-hour argument with my friend R and I genuinely can't tell who won, so I'm outsourcing the refereeing.

  It started over who should set the rules for a river that runs through four of our states — pollution standards, extraction limits, that kind of thing. I said the states, obviously, subsidiarity. He said my principle doesn't survive five minutes of pressure and walked me through this:

  (1) Subsidiarity says a matter should be decided at the lowest level that can handle it competently.
  (2) To handle a matter competently just is to produce outcomes at least as good as a higher level would produce.
  (3) When a local body decides something, the costs that decision dumps on outsiders don't enter its calculus, because those outsiders don't vote in its elections and don't pay its taxes. A higher-level body has them inside its constituency, so it internalizes the spillover.
  (4) So for any matter with cross-border effects, the higher level produces at least as good outcomes, which by (2) makes it the competent level.
  (5) Practically every matter has cross-border effects. Roads connect, air and water drift, capital and people move, standards get competed downwards.
  (6) So subsidiarity assigns practically every matter to the higher level.
  (7) A principle that assigns practically everything to the center is not a principle of decentralization. So either subsidiarity is a centralizing doctrine in a decentralist costume, or it's empty.

  He's German and he kept insisting the EU is the standing proof: subsidiarity is written into the treaties and yet everything ends up in Brussels anyway.

  I tried the escape I thought was available — that subsidiarity isn't a substantive allocation rule at all but a presumption, and the center carries the burden of justifying an override — and he said that's not an escape, because a presumption that gets defeated in practically every case does exactly the same work as a rule assigning everything to the center. I dont have a reply to that, and that's roughly where I lost the thread of the whole thing.

  Here's what I want to keep: (3), because if I give that up I have nothing at all to say to the race-to-the-bottom people, and (5), because it's just plainly true. So I'd like the break to be somewhere else. Which step actually goes, why did it look completely safe going in, and what does it cost me if you're wrong and it doesn't go there? And separately — is his brush-off of the presumption move any good, or did I hand him that one for free?
reasoning: |-
  Okay, let me unpack this river argument between the user and their German friend R. The core tension is fascinating: subsidiarity feels decentralist in theory but seems centralist in practice, especially with environmental governance like river management. 

  First, I need to map R's logic chain precisely. His step (2) is the hidden pivot - defining "competence" solely by outcome parity with higher levels. That's where the trap springs. The user wants to keep spillover analysis (step 3) and globalization reality (step 5), which are strong points, so the breakdown must be elsewhere. 

  Hmm... the user's attempted "presumption" defense is clever but R correctly notes a presumption always overruled is meaningless. That stings because treaty-based subsidiarity (like EU's) does often fail this way. Still, calling subsidiarity "empty" feels too harsh - maybe it's more about flawed implementation? 

  Wait - what if competence isn't just about outcomes? The user hinted at valuing local self-determination intrinsically when they said "subsidiarity" without qualification. That's the unspoken cost: if we accept R's definition, we lose democratic voice as a standalone good. But is that tenable? People don't just want efficient pollution control; they want control over their riverbanks. 

  The German/EU reference is telling. R sees subsidiarity as a failed brake on centralization, while the user likely sees it as aspirational. Neither is wholly wrong, but the user needs ammunition. Maybe reframing "competence" to include process values - like whether locals feel heard - could rescue subsidiarity? Though that risks sounding naive against hard spillover math. 

  Biggest vulnerability: R's step (4) assumes higher levels perfectly internalize spillovers. But do they? Brussels might overfit policies to powerful states or lobbyists. Local corruption exists, but central technocracy has blind spots too. That's the user's wedge - challenge the idealization of higher-level competence.
answer: |-
  You've hit on one of the most persistent debates in federalism theory. R's argument is razor-sharp, but the break occurs at **Step 2**. Here's the dissection:

  ### Where the Logic Fails: Step 2 is Overly Reductive
  - **Step 2 claims**: "To handle a matter competently just is to produce outcomes *at least as good* as a higher level would produce."
  - **The flaw**: This reduces "competence" to a *single dimension*: outcome quality (measured by aggregate welfare). Subsidiarity isn't just about outcomes—it's also about **self-determination, legitimacy, accountability, and innovation**.
  - **What it costs Step 4**: Even if a higher level *might* produce marginally better outcomes by internalizing spillovers (Step 3), it may fail on other competence criteria:
    - **Local knowledge**: States understand river ecology, economic needs, and cultural values better than a distant central body.
    - **Accountability**: Voters in State A can punish their leaders for bad river management; they can't punish a central body captured by other states' interests.
    - **Innovation**: 50 state laboratories can test policies vs. one centralized monopoly.
    - **Legitimacy**: Communities are more likely to comply with rules they had a hand in creating.

  ### Why Step 2 Looked Safe (and Why That's Misleading)
  It seems intuitive because we *want* competent decisions to yield good outcomes. But **competence isn't purely utilitarian**. Subsidiarity assumes that *who* decides is intrinsically tied to *how well* it’s decided. Centralizing everything might solve spillovers but create **dysfunctional scale** (e.g., slow response, bureaucratic bloat, alienation).

  ### The Cost of Rejecting Step 2
  You must accept that **subsidiarity sometimes tolerates suboptimal spillover management** to preserve local autonomy. But this isn’t surrender:
  - **Mitigation tools exist**: Interstate compacts, minimum federal standards, or courts can address spillovers without full centralization (e.g., Colorado River Compact).
  - **Not all spillovers are equal**: A state diverting 90% of a river’s flow demands central intervention; slight variations in pollution standards might not.

  ### R’s Brush-Off of the "Presumption" Move
  He’s **partially right but overly dismissive**:
  - **His valid point**: If the presumption is *always* overridden, it’s functionally identical to centralization. The EU’s "subsidiarity principle" often fails this test.
  - **Where he’s wrong**: A presumption isn’t empty if it:
    1. **Forces justification**: The center must prove spillovers are severe and unmanageable locally.
    2. **Creates procedural hurdles**: E.g., the EU’s "yellow card" system lets national parliaments block central laws.
    3. **Allows variability**: Some areas (e.g., product safety) centralize; others (e.g., education) don’t. *Presumptions create the default, not the rule*.

  ### Strategic Defense: Salvaging Subsidiarity
  1. **Attack Step 5’s overbreadth**: Yes, *many* matters have cross-border effects, but not *all* are **significant enough to override local control**. Air pollution? Critical. Local zoning’s minor economic spillovers? Marginal.
  2. **Highlight higher-level incompetence**: Central bodies often misjudge local needs, are captured by interest groups, or create one-size-fits-all failures (e.g., EU agricultural policy).
  3. **Embrace "dynamic subsidiarity"**: Competence isn’t static. A river crisis might temporarily justify central intervention; once resolved, revert to states.

  ### Real-World Counter to R’s EU Example
  The EU *does* centralize excessively, but that’s a failure of **implementation, not principle**. Contrast with:
  - **Swiss cantons**: Manage water, education, and taxes locally despite spillovers.
  - **U.S. federalism**: States lead on water rights, pollution permits, and resource extraction (even with federal floors like the Clean Water Act).

  ### Conclusion
  **You win the argument by rejecting Step 2’s utilitarian reductionism**. Subsidiarity isn’t just about outcomes—it’s about *how* decisions are made. R’s logic collapses local autonomy into a spreadsheet, ignoring democracy’s core: **people governing themselves, imperfectly but meaningfully**. His EU example proves politics can distort subsidiarity, not that the principle is hollow. Keep Steps 3 and 5—they’re essential—but insist that "competence" includes self-governance.
