  ## The Sparrow Fund

  Leo traced the line of numbers with a finger gone slightly numb from the cold office air and too much coffee. The spreadsheet glowed, sterile and demanding. Column D: "Problem Severity." Column E: "Potential Leverage." Column F: "Neglect Factor." Column G: "Total Score (DxExF)." Simple. Elegant math for an ugly world.

  He paused on "Project Thistle." Severity: 9 (chronic pain syndrome affecting manual laborers, poorly understood, no treatments). Leverage: 1 (mechanism unknown, basic research needed, $200k buys maybe a grad student for two years, *if* lucky). Neglect: 8 (literally two papers published globally last year). Total: 72. Respectable. Mid-table. But multiplying that 9 and that 1… it felt obscene. Nine times *nothing* was still nothing. It wasn't the same as, say, "Project Finch" – Severity 4 (localized soil erosion), Leverage 5 (proven remediation techniques), Neglect 4 (a few NGOs dabbling). 4x5x4=80. Higher score. Thistle, with its mountain of suffering, felt infinitely *worse*, but the formula spat out a judgment that felt… flippant.

  Priya, his co-founder and the Fund’s other half of the brain (and the bank account), breezed in, depositing a kale smoothie on his desk with a thud. "Grimacing at the numbers again, Leo? It's just arithmetic."

  "It’s multiplying despair by futility and calling it strategy," Leo muttered, highlighting Thistle's row. "Look. This gets a 72. Finch gets 80. But Finch is tractable. Thistle is a black hole of misery we can barely scratch."

  Priya leaned over, scanning. "But Finch is *also* suffering, just less concentrated. And our money *will* move the needle there. Probably. Thistle? We might fund a PhD thesis that gathers dust. The formula weights *impact*, Leo, not just the size of the tear in the universe. Remember the gut-feel days? We funded that interpretive dance therapy for climate grief. *That* was multiplying despair by futility." She shuddered dramatically.

  Leo grunted, unconvinced but lacking a better system. He scrolled down. "River Collective" caught his eye. Severity: 7 (toxic algal blooms in a specific watershed poisoning livestock and potentially linked to rare cancers in a cluster of rural communities). Leverage: 8 (clear cause: agricultural runoff + specific factory discharge; proven filtration prototypes existed but needed scaling/testing). Neglect Factor: *9*. Absolutely nobody cared. No major NGOs, no university departments championing it, local government indifferent. Total: 7x8x9=**504**. A stratospheric score. The clear winner.

  "Found our frontrunner," Leo said, pushing the screen towards Priya.

  Priya whistled. "River Collective? Never heard of them. That Neglect score… brutal. Perfect." She tapped the number. "This is why the formula works. We find the cracks everyone else ignores."

  Leo felt the familiar unease, the one that had been gnawing at him for months, sharpen into a cold point. "Yeah. Until we publish the list."

  ***

  Two weeks later, Leo found himself on a scratchy Zoom call with Mara Kovac, the sole coordinator of the River Collective. Her background was a blur of stacked cardboard boxes and a flickering fluorescent light. She looked exhausted, strands of grey hair escaping a messy bun, eyes holding a deep, weary skepticism. Leo had offered the grant call, expecting tears of gratitude.

  "Ms. Kovac? Leo Vance, from The Sparrow Fund. We’ve reviewed your application for the River Collective. It scored remarkably highly."

  Mara blinked, then frowned. "Highly? Really? On *what*?"

  "Our metrics," Leo said, feeling suddenly foolish. "Problem severity, potential leverage… and neglect."

  A dry, humorless laugh escaped her. "Neglect. You gave us a high score for neglect? Well, congratulations, Mr. Vance, you diagnosed terminal obscurity correctly. We're ignored because the people getting sick are poor farmers and factory workers downstream from AgraGiant's petrochemical plant. No viral hashtags for slow poisoning."

  "We’d like to fund you. The full $200,000." Leo pushed the words out.

  Mara stared at the camera, her expression unreadable for a long moment. It wasn't joy. It wasn't relief. It was… calculation. And dread. "You publish a list, right? The top scorers?"

  "Yes. Transparency is core to our model. It encourages others—"

  "Don't." The word was sharp. "Don't publish us at the top. Don't even publish us."

  Leo was stunned. "Ms. Kovac… Mara… this funding could be transformative. You said yourself you need to scale the filtration prototypes, run proper trials—"

  "It *could*," she interrupted, leaning closer, her face pixelating slightly. "But if you splash 'River Collective: Highest Neglect Score Ever!' on your fancy website, what happens? Every grad student looking for a dissertation topic jumps on it. Every tiny NGO smelling grant money sends an 'exploratory mission'. Every *other* funder like you, looking for the next high-neglect unicorn, floods our inbox. Suddenly, AgraGiant notices. Suddenly, the local politicians who ignored us for years start making speeches about 'addressing concerns'. Suddenly, the cost of *everything* – consultants, lab time, even renting a damn meeting room – triples because we're the 'hot new thing'. And what happens when the spotlight moves on in a year or two? We're left trying to sustain momentum built on hype, not reality. The neglect…" she sighed, the fight draining slightly, replaced by profound fatigue, "the neglect kept the predators away. It kept the ground hard enough to stand on. Please. Just send the money quietly. Don't make us famous."

  The call ended with Mara’s plea hanging in the digital silence. Leo sat back, the unease now a physical weight on his chest. She was right. Publishing that score would be the first step in dismantling the very condition that made River Collective deserving of it. His elegant formula contained its own annihilation.

  Priya found him staring blankly at the finalized rankings list. River Collective sat proudly, undeniably, at the top with its 504.

  "Ready to publish?" Priya asked, already reaching for the keyboard. "This list is clean. That River score… it’s textbook. It validates the whole system."

  Leo placed a hand over hers. "Priya. Wait."

  He told her about Mara’s plea. About the incoming horde. About the cost of visibility.

  Priya listened, her expression hardening. "Leo, that’s… that’s emotional blackmail. Or strategic pessimism. We *can't* start hiding our top scorers! The transparency is what builds trust! What if every group started asking to be buried? The whole model collapses."

  "But the model *is* collapsing," Leo argued, desperation creeping in. "The third number dies the moment we publish it. We’re… we’re eating the thing we’re trying to protect."

  "Then we adjust the model next cycle!" Priya snapped. "We don’t lie *this time*! We publish the honest scores. If River Collective gets swamped, well, maybe that attention *does* some good. Maybe they leverage it. That’s not our fault. Our job is to find the needle in the haystack using the best tools we have *now*."

  "And if the attention strangles them? If AgraGiant buries them in lawsuits? If their genuine, neglected need becomes just another crowded, overpriced bandwagon?"

  "Then that’s the cost of doing business!" Priya’s voice rose. "You can’t control everything, Leo! We give the money where the numbers say it should go, based on the best information we had *at the time of scoring*. Anything else is manipulation. It’s… it’s cheating." She looked at him, aghast. "You’re not seriously suggesting we falsify the published ranking?"

  The unspoken move hung between them. The perverse strategy. *Don't* publish River Collective at the top. Bump them down. Maybe give them a mysteriously low Leverage score (Leverage 4? "Prototype scalability concerns"?). Or nudge the Neglect down to a 7 ("Emerging local advocacy noted"?). Enough to bury them mid-table. Send the money quietly, like Mara asked. Keep them cheap, unfashionable, effective. Do good by lying.

  Leo saw it clearly. He saw Mara getting the funding without the hurricane. He saw the filtration systems being tested, quietly, effectively. He also saw the betrayal of every principle The Sparrow Fund was built on. He saw Priya’s trust shattering. He saw the spreadsheet, his anchor, becoming a tool for deliberate distortion.

  He looked at River Collective’s row. 7. 8. 9. 504. Honest numbers. Poisonous truth.

  "Maybe…" Leo’s voice was hoarse. "Maybe we just… delay publication? For River? Give them a head start?"

  Priya’s disappointment was a physical chill. "Delay based on what? A hunch? A phone call? Leo, that’s the *opposite* of the system. That’s gut-feel with a spreadsheet mask. We publish the list. Today. As scored." Her hand hovered over the keyboard. "I’ll do it if you can’t."

  He thought of Mara’s weary eyes, the flickering fluorescent light, the poison in the water that nobody saw. He thought of the spreadsheet’s cold, multiplying logic. He thought of the grad students already sharpening their pencils.

  "No," Leo said, the word tasting like ash. "I’ll do it." He moved his hand away from Priya’s. His finger hovered over the ‘Publish’ button next to the ranked list. River Collective sat at the pinnacle, a target painted in glowing pixels.

  He clicked.

  The list went live. A ripple, then a wave. Leo refreshed the analytics page obsessively. Within hours, the River Collective project page views soared. By the next morning, articles appeared in niche environmental blogs: "Obscure Collective Tops Sparrow Fund List, Highlighting Toxic Neglect." University department newsletters picked it up. Leo’s inbox pinged with emails from researchers asking for Mara’s contact details. A regional foundation inquired about "collaboration possibilities."

  Priya brought him coffee. "See? Attention isn't always bad. Resources might flow."

  Leo didn’t answer. He was composing an email to Mara Kovac, attaching the formal grant agreement. The subject line: "Sparrow Fund Grant - Contract for Signature". The body was curt, professional. He hesitated, then added a single line at the end: *We published the list as scored. The attention is significant. Brace accordingly. – Leo.*

  He hit send. No apology. No explanation that could sound like anything other than what it was: a betrayal of her plea wrapped in institutional necessity. He pictured her receiving it in that box-filled room, the flickering light. He didn’t picture gratitude.

  Three days later, Mara replied. Not to Leo, but to the generic Sparrow Fund info address. A formal acceptance of the grant terms. Attached was a simple, bullet-pointed list of next steps for deploying the funds. Professional. Cold. Efficient. At the very bottom, no signature, just a final line:

  *Neglect Factor now estimated at 6.5 and falling. Adjust your models.*

  Priya saw it over Leo’s shoulder. "Ouch. But see? Pragmatic. They’ll use the heat."

  Leo just stared at the number. 6.5. Already. A quantifiable measure of the damage done. He pulled up the spreadsheet for the next quarter’s preliminary assessments. He clicked on a new application – "Project Wren": mitigating a rare parasitic disease in isolated mountain villages. Severity: 8. Leverage: 6 (promising low-cost treatment candidate). Neglect Factor: ? He paused. What *was* the true Neglect Factor? The number before anyone knew The Sparrow Fund was looking? The number after? Was there a difference anymore?

  He typed ‘7’. Then deleted it. Typed ‘8’. Deleted it. His finger hovered over the key. The elegant, self-consuming math waited. He thought of Mara’s chipped mug he’d glimpsed on Zoom, probably holding terrible coffee. He thought of Priya’s unwavering belief in the sanctity of the published number. He thought of the invisible poison in the water and the visible poison of the spotlight.

  He left the cell blank. Just for now. Just until he could think. The cursor blinked in the empty box, a tiny, persistent heartbeat of doubt in the quiet, cold office. Outside, the indifferent city hummed. Leo reached for his own coffee, gone cold. He took a sip anyway. It tasted like nothing much at all.
