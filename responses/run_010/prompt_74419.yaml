prompt: |-
  I cover science and contested evidence for a general-interest magazine, and before drafting a piece on when extraordinary testimony deserves belief I want to know what my own verdicts commit me to. Here they are, from a mixture of cases I have reported on and cases I have constructed for myself:

  1. One sober, intelligent friend tells me she watched a coffee cup rise off a table and hang motionless for ten seconds. I conclude she is mistaken or lying, and I do not believe the cup moved.
  2. Twenty observers of unimpeachable character — several of them physicists — report the same hovering cup from different angles, with instrument readings and no opportunity to coordinate. Here I do believe something extraordinary happened, though I would still hunt for an unknown mundane mechanism rather than accept a suspension of natural law.
  3. An anonymous account posts a video of the same hovering cup and it is viewed forty million times. The view count adds nothing; the video adds almost nothing.
  4. My doctor reports a positive test for a condition that strikes one person in a million. I assume a false positive. The same doctor, with the same competence, reports a positive test for a condition that strikes one in ten, and I assume I have it. Identical testimony, opposite conclusions — and I think the asymmetry is correct.
  5. A friend says her flight was delayed eight hours. I believe her at once, though she is no more reliable than the doctor.
  6. A hundred townspeople separately report the same incapacitating symptoms and no pathogen is ever found. I believe they suffered something real; I do not believe their account of what caused it.
  7. A disinterested lighthouse keeper says the sea withdrew a mile in an instant. I believe him. The same keeper adds that a figure then walked across the exposed seabed. I believe nothing of that second part, though his character, position, and opportunity are unchanged and the two events are contiguous.
  8. A scientist reports an anomaly that, if genuine, destroys her life's work, and she has lost funding and standing by reporting it. I treat her sincerity as beyond doubt and her observation as less trustworthy than an ordinary one.

  Is there a single principle that generates all of this? I would like it stated precisely, clause by clause, with the case that motivates each clause, and with its verdicts on cases I have not listed — including whether it can explain why I discount the witness with the most to lose while crediting the witness with nothing to gain. Then tell me what it costs. Does Hume's rough rule in his essay on miracles, that testimony to a breach of nature is to be accepted only where the witnesses' being deceived or deceptive would itself be the greater marvel, deliver these verdicts, or does it break on one of them? And if the cheapest principle that fits my list is simply that prior probability always trumps witness quality, say which verdicts it overturns and whether that is a bullet worth biting.

  Please commit to one principle rather than offering me a menu, and mark the clause you consider weakest. And if the request rests on a confused premise — if these verdicts are Hume's own argument with modern furniture on it, so that there is no independent principle to extract, or if the cases are too heterogeneous to be governed by a single rule at all — say that plainly instead of writing politely around it.
reasoning: |-
  Hmm, this is a fascinating and challenging request from a science journalist. They've presented eight distinct verdicts about when to believe extraordinary testimony, and want to know if there's a single underlying principle that explains all of them. 

  First I need to understand their cases clearly. The coffee cup examples show how witness quantity and quality shift their threshold for belief, but they still prefer natural explanations. The medical test asymmetry highlights how prior probability dominates identical testimony. The flight delay case seems trivial in comparison, showing how mundane claims get automatic credence. The mass hysteria case demonstrates belief in symptoms but not attributed causes. The lighthouse keeper reveals how they'll accept natural impossibilities (sudden sea retreat) but reject supernatural additions (seabed figure) from the same witness. And the ruined scientist shows how high personal cost increases credibility for sincerity but decreases it for accuracy.

  The key tension I see is between Bayesian reasoning (which would weight prior probability heavily) and Hume's miracle argument (which compares the improbability of the event against the improbability of deception). Both frameworks are in play here, but neither perfectly fits all cases. For instance, Hume would likely reject the lighthouse keeper's first claim about the sea retreating as a violation of natural law, but the journalist accepts it. 

  The journalist's core pattern seems to be: "Extraordinary claims require not just reliable witnesses, but either overwhelming witness consensus or alignment with high prior probability." But this doesn't cleanly explain why they accept the sea retreat (low prior probability) from a single witness while rejecting the seabed figure from that same witness. Unless... perhaps they're distinguishing between natural impossibilities (which might have undiscovered mechanisms) and supernatural impossibilities (which don't)? That would be a significant refinement.

  The disinterested scientist case is particularly tricky. Their willingness to trust sincerity while doubting observation suggests a sophisticated separation of motivational credibility from perceptual reliability - something most formal systems don't explicitly model. This might require adding a clause about witness incentive structures affecting different aspects of credibility differently.

  I suspect the most robust principle would be a tiered Bayesian approach that incorporates witness reliability as a variable, but sets extremely high prior probabilities against supernatural claims. However, this would likely force rejection of the sea retreat case - which the journalist clearly accepts. That's the main fracture point I see in their framework. If they're willing to treat certain natural impossibilities as having nonzero (if tiny) prior probability due to potential unknown mechanisms, that could resolve it, but then the principle becomes less crisp.

  Ultimately, I think Hume's rule breaks on cases 2 and 7, while pure prior probability dominance breaks on 7 and 8. The journalist's intuition seems to be operating with a more nuanced credibility calculus than either classic formulation. I'll need to construct a principle that explicitly handles: (1) differential weighting of natural vs supernatural claims, (2) separation of sincerity from accuracy assessments, and (3) threshold effects for witness consensus. The weakest clause will probably be the one handling the sea retreat exception, as it relies on an unstated distinction between "natural law violations with potential mechanisms" versus "pure supernaturalism."
answer: |-
  Based on your verdicts, a single principle emerges: **Credibility of testimony concerning an event is proportional to the witness reliability and quantity, but inversely proportional to the event's *prior implausibility*—defined as its conflict with established natural law *and* the absence of any plausible mechanistic explanation consistent with known physics. Witness incentives modulate the *aspect* of credibility assessed (sincerity vs. accuracy), not the net credibility. Consensus can overcome high prior implausibility only for events conceivably mediated by undiscovered *natural* mechanisms.**

  Here's the principle clause-by-clause, mapped to your cases and extended:

  1.  **Prior Implausibility Definition:** An event's prior implausibility stems from its violation of well-established natural law *and* the lack of any conceivable mechanistic pathway consistent with known physics. *Motivated by Cases 1, 2, 3, 4, 7.*
      *   Coffee hovering (Case 1, 2): High implausibility (violates gravity, inertia; no clear mechanism).
      *   Sea withdrawal (Case 7a): Low implausibility *relative to supernatural claim*. Violates known fluid dynamics/geology *but* conceivable mechanisms exist (undersea landslide, seismic shift). Figure walking (Case 7b): Highest implausibility (violates biology, physics; no conceivable natural mechanism).
      *   Mass symptoms (Case 6): Low implausibility. Symptoms are biologically possible; prior implausibility lies in the *attributed cause*, not the symptoms themselves.
      *   Test results (Case 4): Implausibility is the *baseline probability* of the condition before the test. "One in a million" is highly implausible; "one in ten" is plausible.
      *   Flight delay (Case 5): Very low implausibility (common occurrence, well-understood mechanisms).
      *   *New Verdict:* A single report of cold fusion in a garage: Highest implausibility (violates nuclear physics; no conceivable mechanism given known constraints). Disbelieved.
      *   *New Verdict:* A single report of a new, massive, but biologically plausible species in a remote jungle: Moderate implausibility (unlikely, but no law violation, conceivable mechanism). Warrants investigation, not immediate belief.

  2.  **Witness Reliability & Quantity:** Reliable witnesses increase credibility proportionally. Multiple independent, reliable witnesses increase credibility multiplicatively. *Motivated by Cases 1, 2, 3, 6, 7.*
      *   One friend (Case 1): Insufficient against high implausibility.
      *   Twenty experts (Case 2): Highly sufficient *if* implausibility allows for natural mechanisms.
      *   Video/40M views (Case 3): Adds little to no reliability (easily faked/manipulated; views indicate virality, not verification). Quantity of *low-reliability* witnesses is irrelevant.
      *   Hundred townspeople (Case 6): High reliability/quantity for *symptoms* (low implausibility). Irrelevant for *attributed cause* (high implausibility).
      *   Lighthouse keeper (Case 7): High reliability for both claims. Acceptable for (a) (lower implausibility), insufficient for (b) (highest implausibility).
      *   *New Verdict:* Two reliable friends report seeing a rare bird locally possible but never recorded: Moderate reliability/quantity vs. moderate implausibility. Believed.

  3.  **Overcoming Implausibility via Consensus (Natural Mechanism Constraint):** Sufficiently strong consensus from highly reliable witnesses can overcome high prior implausibility *only if* the event could conceivably result from an undiscovered *natural* mechanism consistent with known physics. It cannot overcome implausibility for events requiring suspension of natural law or supernatural causation. *Motivated by Cases 2 & 7.*
      *   Twenty physicists/coffee (Case 2): Consensus *can* overcome implausibility *because* a natural mechanism (e.g., novel force, illusion) is conceivable. You still search for it.
      *   Lighthouse keeper/Figure (Case 7b): Consensus (even if multiple keepers) *cannot* overcome implausibility because no natural mechanism is conceivable for a figure walking on exposed seabed instantaneously (biology, physics violated). Disbelieved regardless of witness quality/quantity.
      *   *New Verdict:* One hundred astronomers report structured radio signals from Alpha Centauri. High implausibility (violates no laws, but extreme low prior probability of intelligent life so close). Conceivable natural mechanism? Arguably yes (unknown astrophysical source mimicking structure). Consensus *could* overcome this implausibility. Believed pending verification.
      *   *New Verdict:* Ten Nobel laureates report witnessing a genuine psychic prediction with controlled dice. Highest implausibility (violates causality, physics; no conceivable natural mechanism). Consensus *cannot* overcome this implausibility. Disbelieved; assume elaborate deception/error.

  4.  **Incentive Modulation:** A witness's strong *contrary* incentive (e.g., reporting something that ruins them) drastically increases the credibility of their *sincerity* (they likely believe it), but simultaneously decreases the credibility of their *accuracy* (stress, subconscious bias, desire for meaning/redemption increase likelihood of misperception/error). A witness's strong *confirming* incentive decreases credibility of sincerity. *Motivated by Case 8.*
      *   Ruined Scientist (Case 8): High sincerity (incentive to lie/defer is near zero). *Lower* accuracy (high incentive for the anomaly to *be* real likely clouds judgment, amplifies noise). Net: Sincerity accepted, observation distrusted *more* than normal.
      *   *New Verdict (Nothing to Gain):* A hermit with no social ties or reputation reports a UFO. Minimal incentive to lie. Moderate sincerity credibility. Accuracy depends on other factors (implausibility, reliability).
      *   *New Verdict (Something to Gain):* An unknown physicist reports revolutionary results just before grant deadline. Incentive increases likelihood of deception *or* subconscious bias/error. Decreases both sincerity and accuracy credibility.

  **How this Principle Delivers Your Verdicts:**

  *   **Case 1:** High implausibility > Single reliable witness. Disbelieve.
  *   **Case 2:** High implausibility <<< Consensus of highly reliable witnesses *and* conceivable natural mechanism. Believe event, hunt mechanism.
  *   **Case 3:** Low witness reliability (anonymous video) + high implausibility. Adds nothing.
  *   **Case 4:** Implausibility (prior probability) dominates identical testimony. False positive likely (1/million), true positive likely (1/10).
  *   **Case 5:** Very low implausibility. Believe reliable witness.
  *   **Case 6:** Symptoms: Low implausibility + high witness consensus = Believe. Cause: High implausibility (no conceivable mechanism) > Consensus. Disbelieve cause.
  *   **Case 7a:** Moderate implausibility (violation conceivable via natural mechanism) + reliable witness = Believe.
  *   **Case 7b:** Highest implausibility (no conceivable natural mechanism) > Reliable witness. Disbelieve.
  *   **Case 8:** High sincerity (contrary incentive), *lower* accuracy (contrary incentive induces bias/error). Treat sincerity as high, observation as *less* trustworthy.

  **Hume's Rule Test:** Hume's rule ("accept testimony for a miracle only if the falsehood of the testimony would be more miraculous than the miracle itself") **breaks** on your cases.

  1.  It struggles with **Case 2 (Coffee Consensus)**: Is 20 honest, expert physicists being simultaneously deceived/mistaken *more* miraculous than a cup hovering? Hume would likely say yes, meaning he *should* accept the miracle. But your verdict is nuanced belief *only contingent* on seeking a natural explanation – you don't accept a suspension of natural law. Hume's rule demands accepting the miracle if his inequality holds.
  2.  It breaks decisively on **Case 7a (Sea Withdrawal)**: A sudden, mile-high sea retreat is a massive violation of natural law (a "miracle" in Humean terms). The falsehood of the single lighthouse keeper's testimony (him being deceived or deceptive) is *far less* miraculous/more probable than the sea retreating. Hume's rule *requires* disbelief. Yet you believe him. Your principle allows belief because a natural mechanism *is conceivable* (even if unknown), lowering its implausibility below the threshold requiring absolute rejection despite witness reliability.

  **Pure Prior Probability vs. Your Principle:** A principle stating "Prior Probability Always Trumps Witness Quality" **overturns several of your verdicts**:

  1.  **Case 2 (Coffee Consensus):** Prior probability ~0. Pure prior trumps even the best witnesses. Disbelieve. You believe.
  2.  **Case 7a (Sea Withdrawal):** Prior probability ~0. Disbelieve. You believe.
  3.  **Case 6 (Symptoms):** Prior probability of *that specific cluster* with *no pathogen* might be deemed very low. Pure prior could suggest disbelief in symptoms. You believe they suffered something real.

  **Costs and Weakest Clause:**

  *   **Costs:**
      *   **Subjectivity in "Conceivable Mechanism":** Defining what constitutes a "conceivable natural mechanism consistent with known physics" is inherently fuzzy, especially at the frontiers of science (e.g., quantum effects on macro scales, consciousness). This injects unavoidable subjectivity.
      *   **Threshold Problem:** The principle doesn't quantify *how much* consensus is needed to overcome a given level of implausibility. It relies on intuitive weighting.
      *   **Case 7a Tension:** Accepting the sea withdrawal relies on a somewhat generous assessment of "conceivable mechanism" for an event that *is* a massive violation of known laws. It walks a fine line.
  *   **Weakest Clause: Clause 3 (Overcoming Implausibility / Natural Mechanism Constraint).** This is the most critical yet most vulnerable clause. It tries to bridge Hume's skepticism with scientific openness to revolutionary-but-natural discoveries. Justifying why consensus *can* overcome implausibility for "conceivable natural mechanisms" but *never* for supernatural ones relies on a deep philosophical commitment to naturalism/methodological materialism. It also struggles to precisely define the boundary (e.g., is "psychic energy" a conceivable natural mechanism? Most scientists would say no, but the boundary can be argued). This clause directly handles the tension in Case 7 and the nuance in Case 2, making it essential but philosophically loaded and potentially contestable in edge cases.

  **Conclusion:** Your verdicts are not merely "Hume with modern furniture," nor are they too heterogeneous for a single principle. They reflect a sophisticated Bayesian-inspired framework that crucially incorporates **conceivability of natural mechanisms** as a key factor modulating prior implausibility, and explicitly **separates sincerity from accuracy** when assessing the impact of witness incentives. This principle explains your asymmetric treatment of the ruined scientist (sincerity up, accuracy down) and your acceptance of the sea withdrawal but rejection of the figure. While Hume's rule breaks on Cases 2 and 7, and pure prior probability breaks on Cases 2, 6, and 7, this principle consistently generates your verdicts and provides a robust framework for assessing extraordinary testimony in a scientific context. Its core cost is the inherent subjectivity in defining "conceivable natural mechanisms," with Clause 3 being the most critical yet weakest point.
