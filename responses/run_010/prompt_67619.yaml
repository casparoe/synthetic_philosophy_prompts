  ### Which Account of Knowledge Do You Hold? Quiz  
  *Answer based on your intuitive approach to knowledge, not prior study of Indian philosophy.*

  1. **Bus Platform**: A stranger in a new city tells you the downtown bus leaves from platform 3. You have no reason to distrust them.  
     - A. You know it’s platform 3 because they said so.  
     - B. You only know after checking the schedule yourself.  
     - C. You believe it provisionally but need future verification.  

  2. **Smart Speaker**: Your reliable smart speaker (with a perfect record) says Estonia’s capital is Tallinn. You don’t know how it knows.  
     - A. You know it because the speaker said it.  
     - B. You only know after consulting an atlas.  
     - C. You know it due to the speaker’s past reliability.  

  3. **Bird Recognition**: A friend describes a rare bird as "sparrow-like with a red crest." Later, you see such a bird and identify it.  
     - A. You know it’s the bird by matching features you observed.  
     - B. You know it by comparing it to a sparrow and noting differences.  
     - C. You know it by recalling the friend’s description.  

  4. **Missing Milk**: You look in the fridge for milk and don’t see it.  
     - A. You know it’s absent because you didn’t perceive it.  
     - B. You know it’s absent because if present, you would see it.  
     - C. You don’t know—it might be hidden.  

  5. **Coworker’s Whereabouts**: You see a coworker’s car in the lot but not at her desk. You recall she has meetings and conclude she’s in the conference room.  
     - A. You know it because that’s the only explanation.  
     - B. You infer it from the car’s presence and her absence.  
     - C. You’re guessing—she might be elsewhere.  

  6. **Restaurant Review**: A review says a restaurant’s pasta is excellent. You’ve never been there.  
     - A. You know it’s excellent because the review states it.  
     - B. You only know after tasting it yourself.  
     - C. You know it only if the reviewer is proven reliable.  

  7. **Lost Keys**: You check your pockets for keys and don’t feel them.  
     - A. You know they’re absent because you didn’t feel them.  
     - B. You know they’re absent because if present, you’d feel them.  
     - C. You don’t know—they might be in a hidden pocket.  

  8. **Wet Ground**: You know rain makes ground wet. The ground is wet; you didn’t see rain.  
     - A. You know it rained because that’s the only explanation.  
     - B. You infer rain from the wetness and the causal link.  
     - C. You don’t know—it could be a sprinkler.  

  9. **Red Apple**: You see a red apple but lack the concept "apple."  
     - A. You know the object directly by seeing it.  
     - B. You don’t truly know it until you learn the concept.  
     - C. You know sensory data (red, round) but not the object.  

  ---

  ### Scoring Key  

  **Step 1: Tally irreducible sources you accept**  
  - **Perception**: Always counted (1 point).  
  - **Inference**: If you chose **A or B in Q8** (1 point).  
  - **Testimony**: If you chose **A in Q1, Q2, and Q6** (1 point; else 0).  
  - **Comparison**: If you chose **B in Q3** (1 point; else 0).  
  - **Non-apprehension**: If you chose **A in Q4 and Q7** (1 point; else 0).  
  - **Postulation**: If you chose **A in Q5** (1 point; else 0).  

  **Step 2: Your view based on total sources**  
  - **1 source (Perception only)**:  
    - *Awkward commitment*: Must reduce all knowledge (e.g., abstract truths, others’ words) to sensory input.  
  - **2 sources (Perception + Inference)**:  
    - *Matches*: Buddhist view; *or* analytic view reducing testimony to inference (e.g., Q2C = induction).  
    - *Awkward commitment*: Must reduce testimony, absence, analogy, and puzzles to inference.  
  - **3 sources (Perception, Inference, Testimony)**:  
    - *Matches*: Sāṃkhya view.  
    - *Awkward commitment*: Must reduce analogy, absence, and puzzles to the first three.  
  - **4 sources (Perception, Inference, Testimony, Comparison)**:  
    - *Matches*: Nyāya view.  
    - *Awkward commitment*: Must reduce absence and puzzles to the first four.  
  - **5 sources (Perception, Inference, Testimony, Comparison, Postulation)**:  
    - *Matches*: Prabhākara Mīmāṃsā view.  
    - *Awkward commitment*: Must explain absence without a dedicated source.  
  - **6 sources (All six)**:  
    - *Matches*: Kumārila Mīmāṃsā/Vedānta view.  
    - *Awkward commitment*: Must defend absence as a unique cognitive act, not perceptual failure.  

  ---

  ### Logical Space of Possibilities  
  **Coherent but unoccupied combinations**:  
  - **Non-apprehension without testimony** (e.g., 3+ sources including non-apprehension but excluding testimony):  
    - *Possible?* Yes. *Why unoccupied*? Testimony is socially central; rejecting it while accepting absence is unintuitive.  
    - *Awkwardness*: Requires reducing testimony to inference (e.g., "reliable speaker" = inductive guess).  
  - **Postulation without inference** (e.g., accepting Q5A but rejecting inference):  
    - *Impossible*: Postulation ("only explanation") inherently involves inferential reasoning.  

  **Indistinguishable pairs**:  
  - **Buddhist (2) vs. analytic reductionism (2)**: Both reduce testimony to inference (Q1B/C, Q2C, Q6C → no testimony point). The quiz cannot separate these; they collapse into "2 sources."  
  - **Skepticism vs. reductionism**: Choosing "C" (doubt) in multiple questions may lower your count, but it reflects epistemic caution, not a distinct theory.  

  **Incoherent combinations**:  
  - **Accepting non-apprehension while rejecting perception**: Absurd—non-apprehension presupposes perception’s validity.  
  - **>6 sources**: Later Vedānta posited 8 sources (adding *inclusion*—whole/part reasoning—and *hearsay*), but both collapse:  
    - *Inclusion* (e.g., "whole animal from a tail") reduces to inference.  
    - *Hearsay* reduces to testimony (if reliable) or inference (if unreliable).  

  **Why no 7-source views?**  
  The extra candidates (inclusion, hearsay) were debated but universally reduced—no school defends them as irreducible.  

  *(End of handout)*
