  We are creating a quiz to tease apart the sources of knowledge according to classical Indian theories. We have nine scenarios, each with three options. The goal is to map the answers to a position on how many irreducible sources of knowledge there are (from one to six, and possibly more) without using technical terms.

   The classical sources (pramāṇas) we are considering are:
    1. Perception (pratyakṣa)
    2. Inference (anumāna)
    3. Testimony (śabda)
    4. Comparison (upamāna)
    5. Postulation (arthāpatti)
    6. Non-apprehension (anupalabdhi)

   We also note that the Vedānta schools sometimes added two more:
    7. Inclusion (sambhava) - knowing the whole from the part or vice versa?
    8. Hearsay (aitihya) - tradition or rumor (sometimes considered a form of testimony but sometimes proposed as distinct)

   However, we are to focus on the main six for the quiz, and only include the extra two if we can do so cleanly.

   We design each question to test one of these without being obvious.

   Important fault lines:
    - Testimony: Can we accept it without independent verification? And what if the speaker is reliable but we don't know why?
    - Comparison: Is recognizing something by being told it's like something else a distinct source?
    - Non-apprehension: Is knowing the absence of something a distinct source?
    - Postulation: Is reasoning from a puzzle (how else could this be?) a distinct source?
    - Perception: Does it deliver knowledge without concepts? (But note: we might not have a direct question for this because it might be hard to frame without concepts.)

   We design 9 questions. Each question has three options (A, B, C). We must avoid textbook examples.

   Let's sketch the questions:

   1. Testimony without independent verification.
      Scenario: You are in a new city and a stranger tells you that the bus to downtown leaves from platform 3. You have no reason to distrust this person, but you haven't verified it.
          A. You know the bus leaves from platform 3 because the stranger told you.
          B. You don't really know until you check the bus schedule yourself.
          C. You know it provisionally, but it becomes knowledge only if you later see the bus there.

   2. Testimony with reliable speaker but unknown reasons.
      Scenario: Your smart speaker, which has always given correct information in the past, tells you that the capital of Estonia is Tallinn. You don't know how the smart speaker knows this.
          A. You know it because the smart speaker is reliable.
          B. You know it because you trust the technology, but you would need to check to be sure.
          C. You know it because the smart speaker's past reliability gives you good reason to believe it.

   3. Comparison: recognizing something by analogy.
      Scenario: A friend describes a rare bird they saw as "like a sparrow but with a bright red crest." Later, you see a bird that matches that description and recognize it as the rare bird.
          A. You know it's the rare bird because you saw it and it matched the description.
          B. You know it by comparing it to the sparrow and noting the red crest.
          C. You know it because your friend's description allowed you to form a mental image and you recognized the bird by matching that image.

   4. Non-apprehension (absence).
      Scenario: You look in the fridge for the milk and don't see it. You conclude that the milk is not in the fridge.
          A. You know the milk is not there because you didn't see it.
          B. You know the milk is not there because if it were, you would have seen it.
          C. You don't really know; it might be hidden behind something.

   5. Postulation (arthāpatti): resolving a puzzle.
      Scenario: You know your coworker is in the office because you saw her car in the parking lot, but you don't see her at her desk. You remember she has a meeting in the conference room and conclude she must be there.
          A. You know she is in the conference room because that's the only place she could be.
          B. You infer she is there because her car is here and she's not at her desk, so she must be somewhere else in the office.
          C. You don't know for sure; you are just guessing.

   6. Perception: does it require concepts?
      Scenario: You see a red apple on the table. You have never seen an apple before and don't know what it is called, but you see it clearly.
          A. You know the apple (as a particular object with color, shape) without knowing the concept "apple".
          B. You don't really know the apple until you can identify it as an apple.
          C. You know it only as a collection of sensory data (red, round, etc.), but that is still knowledge of the object.

