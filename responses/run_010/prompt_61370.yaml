prompt: |-
  Ok so I've been rereading the introspection-skeptic stuff (Nisbett & Wilson's old Psych Review piece, Wegner on apparent mental causation, bits of Schwitzgebel) and I keep thinking the canonical case study everyone should be using isn't a lab experiment at all — it's the facilitated communication blowup of the early-to-mid 90s.

  Facts as I have them, correct me if I'm off: Crossley develops supported typing in Australia, Biklen brings it to Syracuse around 1990, and within a couple of years you have nonverbal autistic people, held at the wrist or forearm, producing eloquent first-person prose about their inner lives. Parents and teachers are overwhelmed. Then some of the output starts naming abusers, there's a wave of allegations, and when people run message-passing tests — show the kid a picture the facilitator can't see, or vice versa — the typed answers track what the facilitator knows, not what the person being supported knows. Professional bodies conclude there's no real evidence the supported person is the author. The facilitators werent lying, exactly: they respond, sincerely, that the testing is invalid because it stresses the kid and destroys the trust the method runs on, and most of them keep going. The ones who recanted, like Boynton, seem to have done it only after personally running the blind tests and watching their own hands do it.

  So run that episode through the introspection theories properly, not just "people are bad at introspection, QED." I want the mapping first — who exactly is the introspector here (facilitator? parent? the person being supported?), what is the report a report *of*, and what would even count as ground truth. Then tell me what the Nisbett & Wilson thesis actually predicts about the facilitators, and whether it's the right lens at all, since their claim is about having no access to the higher-order processes behind your own responses, whereas what the facilitators got wrong was the authorship of a movement. Same failure, or a different one that just gets lumped in? Same question for Wegner: he says the sense of willing comes from priority, consistency and exclusivity, and in FC all three seem wierdly satisfied for the facilitator — she has the thought, the typing matches it, no conspicuous alternative cause on her radar — and yet she experiences *not* willing it. Does his framework eat that, need an extra clause, or is FC just outside its scope?

  And here's my actual hobbyhorse: the Boynton pattern. The only reliable route to changing a facilitator's mind seems to have been handing her own body a discrepancy signal in real time. Which makes me suspect the honest thesis isn't "introspection is unreliable" but something weaker and more specific — call it the no-discrepancy-no-update thesis: introspective confidence stays pinned at whatever the vividness of the experience supports until something forces a mismatch you can't explain away. Tell me whether that's a real position or a dodge, and whether FC is evidence for it or merely consistent with it.

  Finally, where is this literature just silent? I'm thinking about the cost asymmetry (an accusation is not the mirror image of a missed voice) and about the fact that the exact same skeptical machinery gets pointed at the testimony of disabled people generally. Does the theory ever say when a first-person report deserves the benefit of the doubt, or does it only cut one way?

  Bottom line up front in two sentences, then the analysis. Hard cap of 600 words — if you hit the cap mid-thought, cut the thought.
reasoning: |-
  Okay, the user is diving deep into introspection skepticism, referencing key works by Nisbett & Wilson, Wegner, and Schwitzgebel. They propose facilitated communication (FC) as a prime case study instead of typical lab experiments. 

  First, I need to confirm the FC facts they provided: Crossley in Australia, Biklen at Syracuse, rapid adoption, allegations of abuse, failed message-passing tests, and facilitators' sincere denial despite evidence. The user wants a precise mapping of who the introspector is in FC—facilitator, parent, or supported person. The ground truth here is tricky since the person being supported might have thoughts but can't express them independently. Message-passing tests become the key evidence, showing facilitators are the true authors.

  Next, applying Nisbett & Wilson's thesis: they argue people lack access to higher cognitive processes and create post-hoc explanations. For FC facilitators, this fits well. They aren't aware their motor actions cause the typing, attributing it to the person they're supporting. Their "inner life" reports are confabulations based on expectations. This isn't just about introspection of processes but misattributing authorship, which aligns with Nisbett & Wilson's broader point about confabulation.

  Wegner's apparent mental causation theory focuses on the feeling of will. Priority, consistency, and exclusivity usually generate that feeling. In FC, facilitators have the thought (priority), the typing matches (consistency), and no obvious alternative cause (exclusivity), yet they don't feel they are willing the action. This contradicts Wegner's model because they experience it as the supported person's action. FC shows Wegner's framework needs adjustment—exclusivity must include the perceived presence of another agent. Facilitators attribute causality to the person they're supporting, overriding the feeling of will.

  The user's hobbyhorse is the "no-discrepancy-no-update" thesis. Facilitators only change their minds after direct, undeniable evidence from their own actions in controlled tests. This matches the idea that introspective confidence remains high until a stark, unexplainable discrepancy occurs. FC strongly supports this, showing that vivid experience trumps abstract evidence until a personal, real-time mismatch forces reevaluation.

  The literature is silent on cost asymmetry and disability testimony. False accusations via FC caused real harm, while dismissing genuine communication harms disabled individuals. Introspection skepticism often undermines marginalized voices without providing criteria for trusting first-person reports. This highlights a gap in the theory—it critiques without offering norms for when to believe self-reports, especially from nonverbal individuals.

  In summary, FC is a rich case for introspection theories. It shows confabulation (Nisbett & Wilson), challenges theories of agency (Wegner), and supports the no-discrepancy-no-update thesis. However, the literature ignores the ethical costs and asymmetric application to disabled populations, revealing a need for balanced frameworks that don't invalidate genuine testimony.
answer: |-
  ### Bottom Line Up Front  
  Facilitated communication (FC) offers a powerful real-world case study for introspection skepticism, revealing confabulated authorship (Nisbett & Wilson), challenges to Wegner’s agency criteria due to *attributed* agency, and strong evidence for the "no-discrepancy-no-update" thesis. However, the literature is silent on asymmetric ethical costs and the systematic dismissal of disabled testimony.  

  ### Analysis  

  #### Mapping the Introspectors  
  - **Primary Introspector**: The *facilitator* (e.g., Boynton), whose report concerns the *source* of typed content ("The child is authoring this!").  
  - **Reported Content**: Beliefs about agency, authorship, and the inner life of the supported person.  
  - **Ground Truth**: Message-passing tests (e.g., showing images only to the supported person). When typing reflects the *facilitator’s* knowledge, authorship is disproven.  

  #### Nisbett & Wilson’s Thesis  
  N&W argue we lack access to causal cognitive processes and confabulate explanations. FC fits perfectly:  
  - Facilitators unconsciously generate content via ideomotor action but confabulate an external source (the child).  
  - Their error mirrors N&W’s lab examples (e.g., position effects on preferences) but extends to *motor authorship*—a natural extension, as motor control is a higher-order process.  

  #### Wegner’s Apparent Mental Causation  
  Wegner’s criteria (priority, consistency, exclusivity) predict the facilitator *should* feel authorship. FC breaks the model:  
  - **Discrepancy**: Facilitators feel *zero* personal authorship despite meeting all criteria.  
  - **Resolution**: FC exposes a gap in Wegner: exclusivity requires *no plausible alternative agent*. Facilitators attribute agency to the child ("They’re typing!") overriding the sensorimotor evidence. Wegner’s framework needs an "attributed agency" clause.  

  #### The "No-Discrepancy-No-Update" Thesis  
  Boynton’s pattern supports this strongly:  
  - Facilitators dismissed abstract evidence (studies, allegations) because their *experience* felt coherent: "I’m not moving my hand; the child is!"  
  - Only real-time *sensorimotor discrepancy* (e.g., their hand typing "apple" when shown an orange) forced belief-updating. This isn’t a dodge—FC shows vivid experience sustains confidence until an *unexplainable* perceptual mismatch occurs.  

  #### Where the Literature is Silent  
  1. **Cost Asymmetry**: Skepticism cut one way—discrediting abuse allegations (false positives) but ignoring the cost of silencing genuine voices (false negatives). The theory offers no tools to weigh these risks.  
  2. **Disabled Testimony**: Identical skeptical arguments (e.g., "no access to true causation") are used to dismiss AAC users or psych patients. The literature never addresses when first-person reports *should* be trusted, especially when ground truth is contested.  

