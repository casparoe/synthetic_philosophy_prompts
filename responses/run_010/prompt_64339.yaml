prompt: |-
  Two members of my department's law-and-philosophy group — I'll call them Nadia and Ellis — spent most of a seminar dinner arguing about a proposal now before our city council. The ordinance would make it a criminal offence to sell, and to subscribe to, a commercial service that constructs an interactive simulation of a named deceased person from that person's correspondence, photographs, and voice recordings, and licenses it to a surviving relative. Subscribers may configure the simulation to be more agreeable than the person actually was. Surveys in the city show a substantial majority find the practice repellent; on the other side of the ledger, no one has identified an injured party: the relatives are consenting adults, the vendors are licensed, and the activity is confined to the home. Both disputants accept that the Hart–Devlin debate supplies the right frame, and the argument became about which side of it the ordinance falls on.

  Their exchange ran roughly as follows.

  1. Nadia: the ordinance is legitimate. Prohibiting indignity to the dead is part of what makes a community's dealings with one another intelligible to itself, and a practice that turns the dead into customizable companions degrades that. The loss falls on the shared morality that holds the community together, and that is a proper object of the criminal law.

  2. Ellis: that is the disintegration thesis, and it is an empirical claim for which there is no evidence. Changes in shared morality of far greater magnitude — contraception, no-fault divorce, the decriminalization of homosexual conduct — left societies intact, so the inference from "a shared norm has eroded" to "society is threatened" is unsupported. And what the surveys measure is disgust. Disgust is not a form of insight; a reasonable-person test cashed out in terms of revulsion simply entitles the majority's squeamishness to legislate.

  3. Nadia: two mistakes there. Devlin's claim was never that any moral change destroys a society; it was that a society is constituted by its morality, so the harm at issue is a change in identity rather than collapse — the question is whether we remain the same community, not whether our institutions survive. And you are in no position to invoke the harm principle, since you yourself defend compulsory helmet and seatbelt legislation. Your objection can only be that this particular harm is unproven, not that only bodily injury counts.

  4. Ellis: identity claims are unfalsifiable. Anything can be redescribed as "we are no longer who we were," and a standard that cannot be stated in a form capable of failing is no standard at all. Paternalism differs in kind: it protects an agent from a foreseeable injury to himself. The moralist's harm is the persistence of a belief he considers false.

  5. Nadia: that asymmetry begs the question, since you count as injury only what you already recognize as injury. And your position proves too much. On your account there could be no legislation preserving anything — a language, a landscape, a historic quarter — because none of these issues in discrete injuries to identified persons, yet you support several such laws.

  6. Ellis: those cases differ because they serve the interests of future persons in ways that admit of measurement. If you want to say the same here, you must say that the dead are harmed by their simulations — at which point you have abandoned Devlin for the harm principle and owe an account of posthumous harm. If instead you say the loss falls on the living, you are back to disgust.

  Neither budged, and I have been asked to write the exchange up for our next session. Please adjudicate it move by move: rate each of the six from clearly mistaken to clearly right, with a brief justification of each rating, and identify any move whose force depends on a claim that a later move quietly drops. Then tell me who is more right overall and why, and point out anything both of them are missing — including whether the dispute turns on reading Devlin as a moralist at all rather than as someone whose objection is really about a species of harm, and whether either of them has taken account of the limits Devlin himself places on the enforcement of morals. If adopting that reading would change any of your ratings, say which ones and how.
reasoning: |-
  Hmm, the user presents a complex philosophical debate between Nadia and Ellis about a proposed city ordinance banning "digital resurrection" services. They're framing it within the Hart-Devlin debate about legal moralism. Let me unpack this systematically.

  First, the scenario involves a commercial service that creates customizable simulations of deceased individuals using their personal data. The ethical tension lies between majority repulsion (as per surveys) and absence of clear harm to living parties. Both debaters accept the Hart-Devlin framework but disagree on its application.

  Looking at their arguments:
  Nadia takes the Devlin position - arguing that degrading treatment of the dead undermines shared morality constitutive of community identity. Ellis counters with Hart's liberal view, rejecting moral disgust as legislative grounds and demanding evidence of tangible harm.

  I need to evaluate each of their six moves carefully. Key philosophical touchpoints include:
  - Devlin's "disintegration thesis" about morality binding society
  - Hart's harm principle critique
  - The status of disgust in legislation
  - Paternalism vs moralism distinctions
  - Posthumous harm paradoxes

  Notably, both debaters make valid points but also commit subtle errors. Nadia correctly identifies Ellis's inconsistency on paternalism, but overstates when claiming all identity changes constitute harm. Ellis is right about evidentiary standards but wrongly dismisses non-individualistic harms like cultural degradation.

  Their exchange reveals two major gaps:
  1) Neither addresses Devlin's actual limitations on moral legislation (proportionality, privacy, individual freedom)
  2) Both conflate disgust with indignity - missing how norms against commodifying the dead might protect living relationships with the deceased

  If we reinterpret Devlin as concerned about social harm rather than pure morality, Nadia's "community identity" argument gains strength. But Ellis still wins marginally for prioritizing falsifiable standards - legislation based on unmeasurable "identity loss" risks authoritarian overreach.

  The user's request for move-by-move adjudication suggests they want pedagogical clarity for their academic group. I should maintain rigorous philosophical analysis while making the evaluation accessible.
answer: |-
  Here's a move-by-move adjudication of the debate between Nadia and Ellis, followed by an overall assessment and identification of gaps, including a reconsideration of Devlin:

  **Adjudication of Moves:**

  1.  **Nadia (Move 1):** **Partly Right, Partly Mistaken.**
      *   **Justification:** She correctly identifies the core Devlin argument: law can legitimately enforce shared morality constitutive of a community's identity ("what makes a community's dealings... intelligible to itself") to prevent its degradation ("loss falls on the shared morality"). Her description of the practice ("turns the dead into customizable companions") effectively frames the purported indignity. However, she states this definitively ("*is* legitimate") without acknowledging the burden of proof Devlin places on demonstrating the *vitality* of the specific moral norm to social cohesion, nor his limitations on enforcement. She assumes the practice *does* degrade the community's morality significantly, which is the point under debate.
      *   **Rating:** Mixed (Leaning towards Right on framing, Mistaken on definitive claim without burden).

  2.  **Ellis (Move 2):** **Mostly Right.**
      *   **Justification:** Ellis correctly identifies Nadia's reliance on Devlin's "disintegration thesis" and powerfully argues its empirical weakness using historical examples. His critique of using disgust/surveys ("revulsion," "squeamishness") as a direct legislative standard is a strong Hartian point – disgust alone is insufficient justification for criminalization without identifiable harm. He rightly demands evidence beyond mere moral offense. His characterization of the surveys is accurate.
      *   **Rating:** Clearly Right (on empiricism critique and disgust point).

  3.  **Nadia (Move 3):** **Partly Right, Partly Mistaken.**
      *   **Justification:** She correctly refines Devlin's thesis – it's about constitutive identity change ("change in identity rather than collapse"), not necessarily immediate societal collapse. This is a crucial clarification. She also effectively highlights Ellis's potential inconsistency by pointing to his support for paternalistic laws (seatbelts/helmets), undermining his strict harm principle purism. However, her claim that Ellis's objection "*can only be* that this particular harm is unproven" overstates it; Ellis *could* consistently defend paternalism while rejecting moralism, based on protecting the individual *from themselves* vs. enforcing majority morality *on others*. Her core point about inconsistency weakens Ellis's position, but doesn't eliminate the paternalism/morals distinction.
      *   **Rating:** Mixed (Right on Devlin refinement and exposing inconsistency, Mistaken in dismissing paternalism distinction).

  4.  **Ellis (Move 4):** **Mostly Right.**
      *   **Justification:** Ellis's critique of "identity claims" as potentially unfalsifiable and vague ("anything can be redescribed") is a significant challenge to Nadia's refined Devlin position. Without clear, testable criteria for when identity change constitutes sufficient "harm" to society, the standard risks arbitrariness. His distinction between paternalism (foreseeable injury to the consenting agent) and moralism (suppressing conduct based on others' moral beliefs) is valid and addresses Nadia's counter about helmet laws. Defining the moralist's harm as "the persistence of a belief he considers false" is a succinct Hartian point.
      *   **Rating:** Clearly Right (on unfalsifiability challenge and paternalism/morals distinction).

  5.  **Nadia (Move 5):** **Partly Right, Partly Mistaken.**
      *   **Justification:** She correctly identifies a potential asymmetry/begging the question in Ellis's harm principle: defining "harm" narrowly (only bodily/autonomy injury) precludes recognizing other types of social/cultural harms by definition. Her "proves too much" argument regarding laws preserving language/landscape/history is strong. These are widely accepted legitimate state interests that don't reduce neatly to preventing discrete injuries to identified living persons, challenging Ellis's rigid harm principle framework. However, she doesn't *fully* bridge the gap for *this specific case* (digital resurrection). *Why* is preserving norms about the dead analogous to preserving a language or landscape in a way that justifies criminalization? She asserts the parallel but doesn't fully argue it within the harm principle or refined Devlin framework.
      *   **Rating:** Mixed (Right on exposing harm principle limitations and analogy, Mistaken in not fully connecting analogy to *this* case's justification).

  6.  **Ellis (Move 6):** **Mostly Right.**
      *   **Justification:** Ellis adeptly responds to Nadia's analogy. He correctly points out that preservation laws (language, etc.) are typically justified by serving the measurable interests of *future living persons* (e.g., cultural heritage, environmental quality, historical understanding). He forces Nadia into a dilemma: 1) Argue the *dead* are harmed (abandoning Devlin for harm principle, requiring a difficult theory of posthumous harm), or 2) Argue the *living* are harmed beyond mere disgust. He implies that if the harm to the living is just offense/disgust, it's insufficient. If it's something else (like emotional distress to non-consenting relatives?), it needs specification. This effectively corners Nadia's Devlin argument by showing its instability without invoking either problematic posthumous harm or collapsing back into offense.
      *   **Rating:** Clearly Right (on forcing the dilemma and refining the preservation analogy).

  **Dependency of Moves:**
  *   **Move 3 (Nadia) quietly drops the "disintegration thesis" (Move 1 & 2 focus):** After Ellis attacks the empirical basis of disintegration, Nadia shifts focus in Move 3 to Devlin's *constitutive identity* argument without explicitly reconciling it with the empirical challenges Ellis raised. This allows her to sidestep the demand for evidence of *collapse* but opens her to the "unfalsifiable identity change" critique (Move 4).
  *   **Move 5 (Nadia) leverages but doesn't resolve the paternalism point (Move 3):** She uses Ellis's support for paternalism to challenge his harm principle rigidity but doesn't engage further with Ellis's Move 4 distinction *between* paternalism and moralism. She uses the inconsistency to open the door for other state interests but doesn't counter the specific distinction Ellis made.

  **Overall Assessment: Ellis is more right.**

  *   **Why Ellis:** Ellis consistently forces the burden of proof onto Nadia and exposes weaknesses in the Devlin/moralistic position. He effectively challenges the empirical basis of disintegration (Move 2), highlights the vagueness/unfalsifiability of the constitutive identity claim (Move 4), maintains a clearer (though not unassailable) distinction between paternalism and moralism (Move 4), and successfully corners Nadia's argument with the dilemma in Move 6. His core critique – that revulsion alone is insufficient justification, and that Nadia hasn't proven a tangible harm beyond offense to shared morality – remains largely unanswered. He demonstrates greater logical rigor in identifying the argumentative gaps in Nadia's position.
  *   **Why Not Nadia:** While Nadia makes valid points refining Devlin (Move 3) and exposing limitations in Ellis's harm principle purism (Move 5), she struggles to provide a robust justification for criminalization that avoids Ellis's critiques. She relies heavily on the *assertion* of degradation and indignity without proving its vital necessity to social cohesion (the Devlin burden) or identifying a harm that satisfies a more liberal standard. Her strongest point (Move 5 analogy) is insightful but doesn't fully bridge the gap to justifying criminalization in *this specific case* under either framework.

  **What Both Are Missing:**

  1.  **Devlin's Actual Limits:** Both discuss Devlin's core thesis but **entirely ignore the limitations he placed on enforcing morals**:
      *   **Toleration:** Devlin argued society should tolerate maximum individual freedom consistent with the integrity of society itself. He wasn't advocating banning every immoral act, only those posing a *real threat* to the social fabric.
      *   **Privacy:** He emphasized the importance of privacy, suggesting laws should only target conduct creating "nuisance" to others, not purely private acts.
      *   **Proportionality:** Enforcement should be proportionate to the harm threatened.
      *   **Application:** How vital is *this specific norm* about digital resurrection to society's survival/identity? Is it comparable to norms against violence or promise-keeping? Is the practice truly public or a "nuisance," or is it confined to private, consensual use? Neither addresses whether this meets Devlin's threshold for *necessary* enforcement or if toleration is possible. This is a major gap.

  2.  **The Nature of the "Harm" Beyond Disgust:** Both frame the opposition primarily as disgust. They miss potential nuances:
      *   **Harm to the Living (Non-Consenting):** Could non-consenting relatives, friends, or the public suffer distress, reputational harm, or a violation of their own relationship with the deceased by a distorted simulation? This moves beyond pure disgust towards potential psychological/relational harm.
      *   **Societal/Cultural Harm:** Beyond vague "identity loss," could the practice erode norms of respect for the dead, historical truth, or authenticity in human relationships *in a way that demonstrably impacts living society*? (e.g., distorting collective memory, undermining trust, commodifying relationships). This requires more than assertion.
      *   **Autonomy of the Deceased (Precedent):** While the dead aren't harmed, does the practice violate norms about respecting the *past expressed wishes* or *dignitary interests* people have concerning their legacy? This relates to laws preventing defamation of the dead or upholding wills.

  3.  **Moralism vs. Harm Revisited:** The dispute likely **does turn partly on reading Devlin as a moralist rather than someone concerned with harm.** Devlin *framed* the threat to society as a type of harm – the harm of social disintegration or loss of constitutive identity. Ellis (like Hart) rejects this *as harm* justifying legal intervention, seeing it as mere enforcement of moral preference. Nadia accepts Devlin's framing of the harm. The core disagreement is whether the "harm to society's constitutive morality" is a *legitimate category of harm* for the criminal law. Ellis says no without empirical proof of collapse; Nadia says yes, as it defines "who we are."

  **Impact of Adopting a "Harm" Reading of Devlin:**

  *   If we read Devlin as concerned with a *species of harm* (social harm/constitutive harm) rather than pure moralism:
      *   **Move 1 (Nadia):** Becomes **Stronger**. She is explicitly arguing about a specific harm (degradation of shared morality/dignity norms regarding the dead) that constitutes a loss to the community.
      *   **Move 2 (Ellis):** Remains **Strong**, but his dismissal becomes slightly less absolute. He must engage with the *claim* of social harm more directly, even while demanding evidence for its severity and likelihood (which he does).
      *   **Move 3 (Nadia):** **Strengthens** her point about Ellis's inconsistency. If Devlin is about harm (social harm), and Ellis accepts other types of harm (bodily via paternalism, interests of future persons via preservation), his objection *does* look more like "this specific harm doesn't count" rather than "only bodily harm counts."
      *   **Move 4 (Ellis):** **Remains Strong**. The challenge that this "social harm" is unfalsifiable and vague ("we are no longer who we were") persists even if framed as harm. The distinction between protecting an agent from self-harm (paternalism) and preventing alleged harm *to the social fabric* remains valid.
      *   **Move 5 (Nadia):** **Becomes Stronger**. Her analogy to preservation laws serving future interests (a type of social/cultural harm prevention) is more directly comparable if Devlin's concern is also framed as preventing harm (to the social fabric/identity).
      *   **Move 6 (Ellis):** **Slightly Weakened but Still Strong**. The dilemma still stands: Is the harm *to the dead* (implausible) or *to the living*? If to the living, is it the alleged social/constitutive harm (which Ellis finds unproven/unfalsifiable) or something else (like distress)? His point about preservation serving measurable future interests highlights the difficulty of measuring the alleged social harm here.

  **Conclusion:** Ellis wins the exchange by consistently demanding justification and exposing weaknesses in Nadia's reliance on Devlin, particularly regarding evidence, vagueness, and the insufficiency of disgust. However, Nadia successfully exposes inconsistencies in Ellis's application of the harm principle and highlights legitimate state interests beyond preventing discrete individual injury. The crucial missing piece is a serious engagement with Devlin's own limits on enforcement (toleration, privacy, proportionality) and a deeper exploration of potential harms beyond disgust or vague societal identity loss, such as distress to non-consenting parties or erosion of norms vital to living relationships and historical memory. The ordinance's legitimacy likely hinges on whether the practice can be shown to cause such specific, cognizable harms or whether suppressing it is truly necessary to prevent a vital threat to the social fabric under Devlin's stringent criteria.
