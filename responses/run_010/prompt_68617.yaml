answer: |-
  ### (1) Exam Question  
  **Human Sciences 602: Final Examination**  
  **Time Allowed:** 75 minutes  
  **Notes/Texts:** Closed book. No external materials permitted.  

  ---

  **QUESTION (Answer in essay form):**  
  Both Browning and Goldhagen seek to explain widespread participation in Battalion 101’s mass killings. Goldhagen treats the absence of formal punishment for refusal at Józefów as decisive evidence for a dispositional account (eliminationist antisemitism). Browning, however, argues situational pressures—especially conformity—better explain the unit’s actions.  

  Consider the following *stipulated* archival finding:  
  > Three comparable Order Police battalions (X, Y, Z) from the same region and age cohort show starkly different opt-out rates when given a Józefów-style choice. Battalion X (opt-out: 40%) had conducted 0 prior killings; Battalion Y (opt-out: 15%) had conducted 5 prior killings; Battalion Z (opt-out: 3%) had conducted 12 prior killings. Pre-war records show no correlation between opt-out rates and individual political affiliations or the antisemitic framing of orders.  

  **Using this vignette and the course framework:**  
  (a) Explain why Goldhagen’s inference from "no formal punishment" to "no cost to refusal" misrepresents Browning’s conformity mechanism.  
  (b) Analyze how the vignette *appears* to resolve the debate but instead exposes a deeper ambiguity between two causal pathways.  
  (c) Defend a precise claim about where Browning’s and Goldhagen’s accounts **genuinely conflict** (rather than merely operating at different levels).  
  *(Focus on argumentative structure. Do not narrate the scholars’ dispute or cite historical specifics.)*  

  ---

  ### (2) Model Answer (798 words)  
  The Józefów opt-out moment is a litmus test for causal explanations of perpetrator behavior. Goldhagen’s claim that absent formal sanctions prove dispositional motivation commits a category error. Browning’s conformity mechanism hinges on *informal* costs: public refusal burdens comrades, marking the refuser as disloyal. The absence of court-martials no more disproves situational pressure than a lack of fines disproves peer pressure in a fraternity hazing. Goldhagen substitutes a narrow legalist notion of "cost" for Browning’s sociological one, conflating coercion with punishment.  

  The stipulated vignette initially seems to vindicate Browning. If prior killing experience predicts opt-out rates—not pre-war politics or ideological framing—it suggests situational adaptation (brutalization) matters more than stable dispositions. Battalion X’s high opt-out rate (40%) with no prior exposure aligns with Browning: newcomers face raw shock. Battalion Z’s near-total compliance (97%) after 12 killings suggests desensitization. Yet this evidence is tragically ambiguous. Does repeated killing *transform* individuals (brutalization), or does it allow reluctant members to self-select into non-combat roles over time (compositional drift)? The vignette cannot distinguish internal change from group sorting. Battalion Y’s intermediate data (15% opt-out after 5 killings) could support either path: is this the tipping point for desensitization or the moment when most dissenters have exited?  

  This ambiguity reveals the core conflict. Browning and Goldhagen do not merely operate at different analytical levels (psychological vs. cultural). They clash on the **mechanism driving individual participation**. For Goldhagen, eliminationist antisemitism is both necessary and sufficient: it explains why *this specific man* shoots. For Browning, antisemitism is a permissive background condition; the proximate cause is peer pressure amplified by incremental escalation. Their accounts conflict at the point of action: Goldhagen sees ideology directly motivating killers; Browning sees ideology making violence acceptable while conformity executes it.  

  The vignette’s failure to resolve the brutalization-vs-selection dilemma underscores a weakness in dispositional accounts. If antisemitism were uniformly high (as Goldhagen asserts), why do opt-out rates *vary* across battalions? A constant cannot explain a variable. Conversely, Browning must explain why conformity overrides moral aversion *here* but not in all police units. The vignette hints that prior exposure matters—but whether through changed psyches or changed group dynamics remains opaque. Historians cannot run interventions to isolate variables, so they rely on natural experiments like comparing battalions. Yet when the variables (e.g., "degree of antisemitism," "peer pressure intensity") resist clear measurement, counterfactuals become speculative. The real test isn’t whether antisemitism existed (both agree it did), but whether it *varied enough* to explain behavioral differences. The vignette suggests it did not.  

  Ultimately, the conflict is irreducible. Goldhagen needs antisemitism to be the engine; Browning needs it to be the fuel. One demands disposition do all the work; the other lets situation steer.  

  ---

  ### (3) Marking Scheme (25 Total Marks)  
  **I. Exposing Goldhagen’s Misrepresentation** (5 marks)  
  - (3) Identifies conflation: "Absence of *formal* sanction ≠ absence of *all* costs."  
  - (2) Explains Browning’s mechanism: Public opt-out creates informal costs (self-marking, burdening peers).  

  **II. Analyzing the Vignette** (8 marks)  
  - (2) Notes apparent support for Browning: Opt-out rates track prior exposure, not ideology.  
  - (4) Identifies ambiguity: Cannot distinguish *brutalization* (changed individuals) from *selection* (changed group composition).  
  - (2) Explains why ambiguity matters: Both paths could produce the data, but imply different mechanisms.  

  **III. Locating Genuine Conflict** (6 marks)  
  - (4) Precise articulation: Conflict centers on whether ideology (Goldhagen) or conformity (Browning) is the *proximate mechanism for individual participation*.  
  - (2) Rejects false resolution: Not merely "different levels" (e.g., psychological vs. cultural).  

  **IV. Evaluating Explanatory Power** (6 marks)  
  - (3) "Constant cannot explain variable": Goldhagen’s uniform antisemitism fails to explain *variation* in opt-out rates.  
  - (3) "Converse problem for Browning": Explains participation generally but needs to account for *specificity* (why *this* unit/regime?).  

  ---

  ### (4) Characteristic Errors & Penalties  
  - **"Merely different levels" fallacy** (-4): Claims accounts are complementary because "Browning focuses on psychology, Goldhagen on culture." *Fails to locate conflict at mechanism level*.  
  - **Vignette as decisive proof** (-3): Asserts vignette "confirms brutalization" or "confirms Browning" without noting selection ambiguity.  
  - **Narrating the controversy** (-5): Describes Browning/Goldhagen debate or cites real historical details.  
  - **Formal sanction conflation** (-2): Uncritically accepts Goldhagen’s inference that no punishment = no cost.  
  - **Pseudo-insight error** (-3): "Both accounts are reductionist; we need a dialectical synthesis." *Offers no argument for synthesis, evades clash*.  
  - **Ignoring vignette** (-4): Discusses theories generally without engaging stipulated data.  

  ---

  ### (5) A vs. B Differentiation  
  **A work** isolates the *mechanism-level conflict* (ideology-as-motive vs. ideology-as-context) and wrestles with the vignette’s *brutalization-selection ambiguity* as a test of causal claims. **B work** accurately critiques Goldhagen’s sanction fallacy and notes the vignette’s surface implications but misses the deeper ambiguity or conflates conflict with level-difference. The pivot to A is recognizing that **both theories accept antisemitism’s existence but clash over its causal role in immediate participation**—and that the vignette’s unresolved ambiguity exposes how hard this is to adjudicate historically. Most students will miss that selection vs. brutalization isn’t just a detail; it determines whether disposition (via filtering) or situation (via transformation) dominates.
