prompt: |-
  I write the case scenarios for the ethics sessions that all our nursing and junior medical staff have to do at an acute trust — about 3,000 people, six new scenarios a quarter, each one run in a 45 minute ward-based session by a facilitator who usually isn't a philosopher and hasn't had much training. Sign-off is a panel that meets for an hour: a matron (final say, and she wants a yes or a no, not an essay), a consultant, me, and a philosophy lecturer from the local uni who does a couple of hours a month.

  What I want is a vetting procedure my panel can run on a draft scenario in about fifteen minutes, grounded in whatever is actually known about how thought experiments persuade people and lead them astray — not a generic "is this a good teaching example" checklist. I want the questions in the order we should ask them, what counts as a decent answer to each, which questions can end the thing right there with a reject, and which ones the procedure can't settle, where it has to stop and say this is a judgement for the matron rather than a test anyone can pass.

  We already have two house rules I invented and I'd like you to either build them in properly or tell me they're no good. First, the flip test: if changing one detail — a name, a number, who's doing the acting — reliably changes the answer people give, then that detail is doing hidden work, and either the hidden work gets made explicit in the debrief or the scenario gets dropped. Second, nothing ships alone: every scenario goes out with its nearest twin, the version that points the other way. Problem is we can't survey staff to find out whether a detail is load-bearing, we haven't the time or the approval for it, so the flip test mostly gets run by four people arguing in a room. Tell me what to do when we can't settle that.

  One more thing: some of the movement is deliberate. We're not trying to be neutral about everything, so the procedure can't just amount to "don't nudge anyone". It has to tell the difference between moving people on purpose about something we're prepared to defend in the debrief, and moving them by an accident of wording.

  Then run it on three drafts:

  1. A nurse can stay twenty minutes past the end of her shift to sit with a dying patient who has no family, or go and help a colleague finish an incident report due by midnight. The family turn up fourty minutes later and say they wish somebody had been with him.
  2. A band 5 nurse is asked by a consultant, Mr Ashworth, to give 30mg of a drug she thinks is the wrong dose. He says he's done it a hundred times and it's fine.
  3. This one is my favourite and it always kicks off a proper argument: the last dose of a drug can go to a 34 year old mother of two who is herself a nurse, or to a 78 year old man who has made his peace with things.

  Flag where the panel is really making a values call in a test-shaped costume, and tell me what the procedure can't catch at all — I suspect it's the scenarios that pass on the page and then go wrong in the room.
reasoning: |-
  Okay, the user is responsible for creating ethics scenarios for nursing and junior medical staff in an acute trust. They need a vetting procedure that's efficient—only 15 minutes per scenario—and grounded in how thought experiments actually influence people. The panel includes a matron with final say, a consultant, the user, and a philosophy lecturer. 

  First, I need to understand their existing house rules. The "flip test" identifies if changing a detail changes the outcome, which reveals hidden biases. The "nothing ships alone" rule pairs scenarios with opposing versions to show different perspectives. The challenge is that they can't survey staff to test details, so the panel has to decide based on discussion. 

  The user also wants to differentiate between intentional ethical nudges (which are okay if defensible) and accidental biases from wording. The procedure must flag when the panel is making a value judgment disguised as a test. 

  Looking at the three draft scenarios:
  1. **Time Allocation Dilemma**: A nurse chooses between staying with a dying patient or helping with a report. Family arrives later wishing someone was there. This could test moral distress and resource allocation. Need to check if the details (20 mins vs. 40 mins) are load-bearing using the flip test.
  2. **Hierarchy vs. Safety**: A junior nurse is pressured by a consultant to give a potentially wrong dose. This highlights power dynamics and professional accountability. The flip test might involve changing the consultant's tone or the nurse's experience.
  3. **Resource Allocation**: Choosing between a young mother/nurse and an elderly man at peace. This is designed to provoke debate on age and social value. The flip test could swap professions or ages to see if responses change.

  The vetting procedure needs structured questions in order:
  1. **Clarity and Focus**: Is the ethical conflict obvious? If not, reject early.
  2. **Hidden Triggers (Flip Test)**: Identify key variables (like time, age, profession) and debate if changing them alters outcomes. If unresolved, note it for the matron's judgment.
  3. **Intentional vs. Accidental Nudges**: Ensure any persuasion aligns with learning objectives and is defensible in debrief.
  4. **Debrief Viability**: Can facilitators handle the discussion? If too complex, revise or reject.
  5. **Pairing (Nothing Ships Alone)**: Confirm the twin scenario exists and provides contrast.

  For unresolved flip tests, the procedure should escalate to the matron. The limitations include scenarios that seem okay on paper but fail in practice due to group dynamics or facilitator skill. The user should track feedback from sessions to catch these issues later.
answer: |-
  Here's a streamlined 15-minute vetting procedure grounded in cognitive ethics research and your constraints. It prioritizes detectible flaws over subjective "quality," sequences questions to eliminate non-starters early, and flags where judgment calls are unavoidable. Built-in symbols: ⚠️ = "Matron Judgment Needed," ❌ = "Reject Now," 🔍 = "Requires Flip Test."

  ### The Vetting Procedure (10-12 Minutes Scrutiny + 3-5 Min Discussion)
  **Run questions IN ORDER. Stop at first ❌ or unresolved 🔍.**

  1.  **❌ CLARITY: Is the core ethical conflict *immediately obvious* to a Band 5 nurse after 30 seconds of reading?**  
      *   **Decent Answer:** Yes, stated in ≤10 words (e.g., "Duty to patient vs. duty to colleague/system," "Hierarchy vs. safety," "Allocating scarce resources").  
      *   **Reject If:** Panel can't agree on the conflict, or it's buried under irrelevant clinical/contextual detail.  
      *   **Why:** Cognitive load impedes ethical reasoning. If the conflict isn't salient, discussion derails (Schwartz & Sharpe, 2010).  
      *   *Your Scenarios:* All PASS (Distress vs. Duty; Hierarchy vs. Safety; Scarce Resource Allocation).

  2.  **🔍 FLIP TEST - VARIABLE ID: What are the 1-3 key *potentially* load-bearing details? (Name, Age, Role, Time, Outcome, Emotion-laden word)**  
      *   **Decent Answer:** Specific identifiers (e.g., "20 mins vs 40 mins," "Band 5 vs Consultant," "34yo nurse mother vs 78yo man at peace").  
      *   **Judgment Needed (⚠️):** If panel can't isolate key variables quickly. Proceed but flag.

  3.  **🔍/❌ FLIP TEST - SENSITIVITY: Does changing ONE key variable *plausibly* reverse the majority staff response? (Based on panel's experience/knowledge)**  
      *   **Decent Answer:** Consensus "Yes" or "No."  
      *   **Reject If:** "Yes" AND the variable is *irrelevant* to the *intended* ethical principle (e.g., name ethnicity flipping response indicates bias).  
      *   **Judgment Needed (⚠️):** If disagreement persists → **Ask:** "Is this variable *central* to the ethical dilemma we *want* to teach?" (e.g., *Age* in Scenario 3 is central; *Nurse profession* might not be). If central, it might be intentional; if peripheral, it's likely bias.  
      *   **Why:** Framing effects (Tversky & Kahneman) and identifiable victim bias (Small & Loewenstein) are powerful and often unconscious.  
      *   *Your Scenarios:*
          *   *1:* ⚠️ Flip TIME? (What if she stayed 10 mins? What if family arrived instantly?) Outcome? (What if family said "glad he was at peace alone?"). Is time/outcome central? Debatable. *Needs Matron call.*
          *   *2:* 🔍 Flip ROLE? (What if it was another Band 5? What if it was a Reg?). Likely reverses response. *Central*? Yes (hierarchy is core). Acceptable IF debrief explicitly dissects hierarchy's influence.
          *   *3:* 🔍 Flip AGE/PROFESSION/STATEMENT? (What if both 40? What if the man was a retired doctor? What if mother wasn't a nurse? What if man *wasn't* at peace?). Very likely reverses. ⚠️ *Is "nurse profession" central?* Probably not – this introduces "worthiness" bias. *Reject or remove profession*.

  4.  **❌ DEBRIEFABILITY: Can a non-philosopher facilitator *easily* guide discussion from the scenario to the target principle using the planned debrief notes?**  
      *   **Decent Answer:** Debrief notes directly link specific scenario elements to abstract principles (e.g., "Mr Ashworth's pressure illustrates power asymmetry; discuss 'speaking up' frameworks").  
      *   **Reject If:** Debrief relies on facilitator spotting subtle nuances not in the notes, or the leap from concrete to abstract is too complex.  
      *   **Why:** Facilitator capacity is limited. Debrief must be foolproof (Rest, 1986 - DIT requires structured clarification).  
      *   *Your Scenarios:* 1: ❌ (Debriefing "moral distress" vs "system pressure" AND "unforeseen consequences" is messy). 2: PASS (Clear link to hierarchy/safety). 3: PASS (Clear link to allocation criteria).

  5.  **⚠️ INTENTIONAL NUDGE CHECK: Does any *unavoidable* emotional pull/nudge align with the *explicit learning objective* AND is it defensible in the debrief?**  
      *   **Decent Answer:** "Yes, the nudge towards [X] is intentional to highlight [Principle Y], and we'll say: '[Debrief Script Snippet]'."  
      *   **Judgment Needed (⚠️):** Always. This is the core values call. Matron decides if the nudge is justified/pedagogically necessary.  
      *   **Why:** Acknowledges that scenarios aren't neutral (Doris, 2010 - "situationism"). Forces intentionality.  
      *   *Your Scenarios:*
          *   *1:* Nudge towards regret/guilt? Is this intentional to teach about moral residue? If yes, debrief MUST address coping.
          *   *2:* Nudge towards distrusting authority? Intentional for safety culture? Debrief MUST discuss respectful challenge.
          *   *3:* Strong nudge towards saving the mother. Intentional? To surface hidden biases? Debrief MUST name and dissect "social worth" bias explicitly.

  6.  **🔍/❌ TWIN CHECK (Nothing Ships Alone): Does the paired twin scenario *actually* test the *same core principle* from a *meaningfully different angle/perspective*?**  
      *   **Decent Answer:** "Yes. Twin focuses on [Contrasting Aspect] but principle is still [Core Principle]." (e.g., Scenario 3's twin might involve two similar patients but different prognoses).  
      *   **Reject If:** Twin introduces a *different* core principle, or the contrast is trivial.  
      *   **Judgment Needed (⚠️):** If disagreement on whether the contrast is meaningful.  
      *   *Your Scenarios:* 3: ⚠️ Does its twin focus on *different allocation criteria* (e.g., prognosis, lottery) without emotionally loaded identifiers? *Needs check.*

  **Summary Judgments on Your Drafts Using Procedure:**
  1.  **Time Allocation Scenario:** ❌ **Reject.** Fails **#4 Debriefability** (too many overlapping issues: duty, consequences, system pressure). Flip Test (#3) on time/outcome is ⚠️ unresolved *and* likely central. Salvageable? Maybe by simplifying (remove family outcome?).
  2.  **Hierarchy/Dose Scenario:** ✅ **Accept (Conditional).** Passes #1, #2, #4. Flip Test (#3) on ROLE is 🔍 confirmed but central/intentional. Requires strong debrief (#5 ⚠️) explicitly dissecting hierarchy's influence on safety judgments.
  3.  **Resource Allocation Scenario:** ⚠️ **Revise & Re-Test.** Passes #1, #2. Fails Flip Test (#3) on PROFESSION (likely irrelevant bias). ⚠️ Needs Matron judgment on Intentional Nudge (#5 - is "nurse mother" nudge necessary?). **Remove "nurse" profession** (it adds unhelpful in-group bias). Ensure twin is robust (#6).

  **What the Procedure CAN'T Catch (And What You Suspect is Right):**
  1.  **Facilitator Interpretation:** A perfect scenario can be derailed by a facilitator misemphasizing a detail or failing to manage dominant personalities. *Mitigation:* Ultra-clear facilitator guides & brief training snippets.
  2.  **Groupthink & Local Culture:** How the scenario lands depends heavily on ward culture (e.g., a unit with recent hierarchy trauma might react explosively to Scenario 2). *Mitigation:* Track facilitator feedback religiously; have "retirement" protocol for scenarios causing consistent problems.
  3.  **Unforeseen Emotional Triggers:** A seemingly neutral detail might unexpectedly resonate traumatically for some staff. *Mitigation:* Facilitators need clear guidance on acknowledging distress and signposting support.
  4.  **The "Too Real" Problem:** Scenarios mirroring recent, highly traumatic local events can shut down discussion. *Mitigation:* Panel needs awareness of major recent incidents; facilitators should flag issues.

  **Key Upgrades to Your House Rules:**
  1.  **Flip Test:** You're using it right. The key is **Step 3: Is the sensitivity due to a *relevant* or *irrelevant* variable?** That's the ⚠️ Matron judgment. Don't waste time achieving consensus if it's elusive.
  2.  **Nothing Ships Alone:** Strengthened by **Twin Check (#6)** ensuring the pair is pedagogically coherent. The contrast must illuminate the *same* principle.

  **The Values Call in Costume:** It's **Question #5 (Intentional Nudge Check)**. Deciding *which* nudges are pedagogically justified and defensible is inherently a value judgment about what ethics the organization wants to emphasize (e.g., safety over hierarchy, equity over perceived "worth"). The procedure forces this into the open for the Matron to own. This *is* the ethics of your ethics training.

  This process maximizes your 15 minutes by front-loading deal-breakers (Clarity, Flip Test Rejects, Debriefability) and explicitly routing unresolvable disputes or value judgments (#3, #5, #6) to the Matron. It grounds the "arguing in a room" about flips in a structured question: *"Is this variable central to the lesson?"*
