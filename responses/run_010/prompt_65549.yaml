prompt: |-
  I've got a 35-minute whiteboard slot on Moore's paradox next week with second-year cognitive science undergrads. They've had one term of truth tables, no philosophy of language at all, and they've just finished a unit on self-deception so they're completely certain they already know what's going on. Don't explain the paradox to me, I know it — plan the session for me.

  First thing: what has to be on the board before what? My worry is that if I write the sentence up first and ask what's wrong with it, half the room shouts "contradiction" and I spend the remaining half hour digging them back out, but if I build up to it carefully the sentence lands with no punch at all and they don't feel why anyone would ever have called it a paradox. Tell me which way to go and what the dependency structure actually is — what genuinely can't be understood until something else is in place.

  Second: I'm not using the rain example. It's in every handout ever written and they've half-seen it. I want one carrier case that does double duty — feels flat-out absurd when the speaker says it about themselves right now, and reads as plainly true, even kind of sad, when somebody else says it about that same person. Help me pick it, and tell me what it has to have and what would wreck it (my instinct is that it can't be a case where the person is obviously joking or performing).

  Third, the misconception map, with the exact point in the sequence where each one gets headed off:
  - "it's just a contradiction, move on" — they will want to truth-table it
  - "so this is about lying, about being insincere"
  - "wait, the past tense version is fine? then the whole thing is a cheap trick about tenses" — this is the one that scares me, because the tense shift is arguably the biggest clue in the whole puzzle and I need them to feel the difference between a clue and an escape hatch
  - "so we can't be wrong about our own beliefs after all"
  - and the one they'll raise inside two minutes: what if a chatbot says it? I need a firm call on whether to fold that in or park it. It could eat the entire session, but if I park it they'll sit on it and stop listening.

  Also make a call on whether both forms of the sentence — the "I don't believe it" one and the "I believe it isn't" one — need to be there, or whether one does the work and the other just costs five minutes I don't have. Same for the knowledge version ("it's raining but I don't know that it is"): worth two minutes or a distraction.

  Then tell me what I should openly refuse to cover and say I'm refusing. I'm assuming the formal doxastic logic proof and the whole argument over what assertion is normed on are both off the table at this level, but say so explicitly if cutting either one guts the thing rather than just trimming it.

  Last: give me one question to put on the board with three minutes left that separates "got it" from "vaguely enjoyed a cute puzzle." Ideally something where a student who thinks the absurdity lives in the sentence gives a visibly diffrent answer from one who thinks it lives in the act of saying it.

  No reading list, please — they won't read anything and I don't want to be gesturing at books I'd have to get the details wrong on.
reasoning: |-
  We are planning a 35-minute session on Moore's paradox for second-year cognitive science undergraduates. They have some logic (truth tables) but no philosophy of language. They've just covered self-deception and might be overconfident.

  Key goals:
  1. Avoid having them prematurely conclude it's just a contradiction and then having to backtrack.
  2. Use one example that works both in first-person present (absurd) and third-person (plausible).
  3. Address common misconceptions at the right time.
  4. Decide on the scope: which forms of the paradox to include and what to exclude.

  Plan:

  Dependency Structure (Whiteboard Sequence):

  1. Start with a non-paradoxical example to set the stage. We want to establish that we are talking about assertions and the norms of assertion. But without getting into the theory of assertion.

     Write: "I believe that the library is open today."

     Ask: "Is this a weird thing to say? Why or why not?" (Expected: No, people report their beliefs all the time.)

  2. Then, write: "The library is open today."

     Ask: "How is this different from the first one?" (Expected: It's a straight assertion of fact, not about belief.)

  3. Now, combine: "The library is open today, but I don't believe it is."

     But wait, we don't want to write the Moorean sentence immediately because they might shout "contradiction". So instead, we build context.

  Alternative approach: Start with a third-person case.

  Step-by-step board build:

  Minute 0-5:
    - Write: "Case 1: Alex says: 'It is raining, but I believe it is not raining.'" (This is the commissive form: p and I believe not-p)
    - Ask: "What's going on with Alex? Is this a contradiction? Can we imagine a situation where this is true?"
      - They might say: "Yes, maybe Alex is lying, or mistaken about his own belief, or it's raining and he doesn't realize it and he thinks he doesn't believe it, but actually he does? ... This is messy."

    Instead, we want a case that feels absurd in the first person but is clearly possible in the third person.

  Carrier Case:

  We need a case that:
    - Is not the rain example (overused).
    - Feels absurd when said by the speaker about themselves in the present.
    - Is plainly true and even sad when said by someone else about that person.

  Proposal: Use a case about a missed deadline.

  Example:
    - First-person absurd: "The deadline was yesterday, but I don't believe it was." (This might not be as strong because it's past tense and the belief is about the past.)

  Better: Present tense and about a current fact.

  Alternative: "My phone is ringing, but I don't believe it is." 
    - But if the phone is ringing, and you don't believe it, that might be because you don't hear it? Then it's not absurd, it's just a mistake.

  We need a case where the fact is such that the speaker is in a position to know, and yet they are saying they don't believe it.

  Another idea: "I am standing right here, but I don't believe I am." 
    - This is odd, but maybe not as absurd as we want.

  Classic: "I have been diagnosed with a serious illness, but I don't believe I have."

  But that might be too heavy and also past tense.

  Let's try: "There is a spider on your back, but I don't believe there is." 
    - This is said to someone else? We need first-person.

  We want the speaker to be talking about themselves.

  Revised carrier case:

  Use: "I have hands, but I don't believe I have hands." 
    - This is Moore's own example? But it's odd because it's hard to imagine not believing one has hands.

  Alternatively: "I am speaking right now, but I don't believe I am." 
    - This is self-referential and might be confusing.

  After reflection: Let's use a case about a current, obvious, external fact that the speaker is aware of.

  Proposed carrier case:

  "Look, the sun is shining right now, but I don't believe it is."

  But then if the sun is shining and I say that, it's absurd because I'm looking at it.

  But we also want a third-person version that is sad: "The sun is shining, but poor Alex doesn't believe it is." (Maybe because Alex is depressed and in denial?)

  That could work.

  But let's make it more relatable. How about:

  "Your birthday is today, but I don't believe it is." 
    - This is second-person. We need first-person for the absurdity and third-person for the plausible case.

  First-person: "It's my birthday today, but I don't believe it is."
    - This could be said by someone in denial? But then it might not be absurd in the same way.

  Alternatively: "This class is happening right now, but I don't believe it is." 
    - While we are in class.

  That might work.

  Final choice for carrier case: 

  First-person: "This class is meeting right now, but I don't believe it is." 
    - Said by the professor? That would be absurd because we are clearly meeting.

  Third-person: "This class is meeting right now, but Alex (a student) doesn't believe it is." 
    - Why? Because Alex is skipping class and is in denial about the class meeting? That's plausible and sad.

  But note: the third-person version is not an assertion by Alex, but about Alex. The paradox is about asserting the Moorean sentence.

  So we have two scenarios:

  Scenario A (first-person, absurd):
    - Professor stands in front of the class and says: "This class is meeting right now, but I don't believe it is."

  Scenario B (third-person, plausible):
    - Professor says: "Look, Alex is not here. The class is meeting right now, but Alex doesn't believe it is. He's in denial."

  Now, we can also do the commissive form: "This class is not meeting right now, but I believe it is." 
    - That might be less absurd? Because it could be a mistake (if the professor is confused about the schedule). But in context, if we are in class, it's absurd.

  But let's stick to the omissive form for simplicity.

  So, we'll use: "This class is meeting right now, but I don't believe it is."

  Whiteboard sequence:

  Minute 0-3:
    - Write: "Scenario A: I say: 'This class is meeting right now, but I don't believe it is.'"
    - Ask: "What's wrong with this? Why is it odd?" 
      - Expectation: They might say it's contradictory? But we want to draw out that it's not a logical contradiction. We can ask: "Is it possible for both parts to be true at the same time? Could the class be meeting and I not believe it? Yes, if I'm deluded. But then why is it absurd for me to say it?"

  Minute 3-8:
    - Write the truth table for the two parts:
        p: "This class is meeting"
        q: "I don't believe p"
        The conjunction: p and q.

    - Show that there is no row where the conjunction is false in the truth table? Actually, the truth table doesn't show a contradiction because p and q are independent. The truth table will have a row where p is true and q is true and the conjunction is true.

    - So it's not a contradiction. Then why is it absurd?

    - Now, switch to third-person.

  Minute 8-12:
    - Write: "Scenario B: Alex is not in class today. I say: 'The class is meeting right now, but Alex doesn't believe it is.'"
    - Ask: "Is this odd? Why or why not?" 
      - Expected: It's not odd. It's a sad fact about Alex's state of mind.

    - Contrast with Scenario A. What's the difference? 
      - In Scenario A, the speaker is asserting p and also asserting that they don't believe p. But if they are asserting p, they are presenting p as true, which suggests they believe p. So there's a tension.

    - Write: "When I assert p, I represent myself as believing p."

  Minute 12-15:
    - Address misconception 1: "It's just a contradiction." 
      - We've shown it's not a logical contradiction. It's perfectly possible for p to be true and for me not to believe p. The absurdity is pragmatic: it's about the act of asserting it.

    - Misconception 2: "It's about lying or insincerity." 
      - But if I were lying, I wouldn't be asserting something I believe to be false. But in this case, if I were lying about p, I would be asserting p while believing not-p. Then the Moorean sentence would be: "p (which I don't believe) and I don't believe p." That seems consistent? Actually, if I'm lying, I know I don't believe p. But then why would I say I don't believe p? That would be odd because it would reveal the lie? 
      - Alternatively, if I'm sincere in the assertion, then I do believe p, so I can't truthfully say I don't believe p. 
      - So it's not about lying per se, but about the norms of assertion.

  Minute 15-20:
    - Address misconception 3: "The past tense version is fine, so it's about tenses."
      - Write: "Yesterday, the class met, but I didn't believe it did."
      - Ask: "Is this absurd? Why not?" 
        - Because when I say it, I'm not asserting that the class met yesterday as a current commitment? I'm reporting a past fact and a past belief. There's no tension because I'm not representing my current belief about the past fact? Or rather, I might be representing my current belief that the class met yesterday, but I'm reporting a past belief that was different. That's normal (e.g., I was wrong then).

      - So the tense shift isn't an escape hatch, it's a clue: the absurdity arises only when the belief report is about my current belief and the assertion is about the current state.

    - Write: "The paradox only bites for present tense assertions about present beliefs."

  Minute 20-25:
    - Misconception 4: "So we can't be wrong about our own beliefs after all." 
      - But we can! The point is not that we are infallible about our beliefs. The point is that we cannot appropriately assert the Moorean sentence. It's possible for me to have a false belief about my own belief (maybe through self-deception). But if I do, then I cannot assert the Moorean sentence without absurdity because in asserting p I represent that I believe p, but then I say I don't. So if I am self-deceived, I might believe p and also believe that I don't believe p? That's complicated. But the point is: asserting the Moorean sentence is always odd, even if the state it describes is possible.

    - So the paradox does not show that we are infallible about our beliefs.

  Minute 25-28:
    - Misconception 5: What if a chatbot says it?
      - Park it. Say: "That's a great question, and it gets into the philosophy of AI and whether machines have beliefs. But for today, we're focusing on human assertion. We can come back to that in office hours or the next class if you're interested."

    - Also, which forms to include?
      - Do both omissive ("p and I don't believe p") and commissive ("not-p and I believe p")?
      - In 35 minutes, stick to the omissive form (the one we've been using). The commissive form is also absurd but for similar reasons. If you have time, you can mention it: "I believe the class is meeting, but it isn't." That's also absurd because if I believe it, I might assert it, so why would I assert that it isn't? But we don't have time to go into it. So skip it.

    - The knowledge version: "p but I don't know that p." 
      - This is also Moorean and absurd. But it's a bit different because knowledge is more than belief. However, the structure is similar. Since we are short on time, skip it.

    - So we are only covering the omissive form.

  Minute 28-32:
    - Recap: 
      - Moorean sentences are not contradictions (truth table shows they can be true).
      - But asserting them is absurd because assertion represents belief.
      - The absurdity is pragmatic, not logical.
      - The past tense version avoids the absurdity because the belief report is about the past, not the present.

  Minute 32-35:
    - Put the question on the board: 
        "If someone asserts 'p but I don't believe p', what must be true about their belief state for the assertion to be absurd? And is the absurdity due to the sentence itself or the act of asserting it?"

    - Expected answers:
        - A student who thinks the absurdity is in the sentence might say: "It must be that they actually believe p, so they are contradicting themselves." But that's not necessary. The state of affairs is possible (they might not believe p) but the act of asserting is still absurd because by asserting p they are representing that they believe p.
        - A student who gets it will say: "The absurdity comes from the act of asserting p while also saying they don't believe p. This is inconsistent with the norm of assertion: when you assert p, you present yourself as believing p. So they are representing themselves as believing p and then immediately saying they don't. It doesn't matter what their actual belief state is."

    - So the question is designed to separate those who think the absurdity is in the content (which would require that they believe p) from those who see it as in the act (which happens regardless of their actual belief state).

  What to refuse to cover:
    - Explicitly say: "We are not going into the formal doxastic logic proof that shows that the sentence is inconsistent under certain assumptions. That's for advanced logic classes."
    - Also: "We are not going to dive into the debate about what exactly the norm of assertion is (whether it's knowledge, belief, or something else). We are just taking for granted that assertion represents belief."

  Summary of the session:

  1. Start with the first-person absurd example (class meeting) and get reactions.
  2. Show it's not a contradiction with a truth table.
  3. Contrast with the third-person case (about Alex) to show the same content is not absurd when said about someone else.
  4. Explain the pragmatic tension: asserting p represents that you believe p.
  5. Address misconceptions as they come up, especially the past tense and the self-deception one.
  6. Park the chatbot question and avoid other forms to save time.
  7. End with the reflection question.

  Timing is tight, but this should fit in 35 minutes if we keep the discussion focused.
answer: |-
  ### Moore's Paradox Session Plan for 35 Minutes

  **Core Goal:** Make them feel the paradox's absurdity without getting bogged down in logic or self-deception overconfidence. Focus on the pragmatic tension (assertion vs. belief) and why it's not a contradiction. Use one carrier case throughout for consistency.

  ---

  ### 1. **Whiteboard Sequence & Dependency Structure**
  **Key Principle:** Avoid writing the Moorean sentence first. Build context to prevent premature "contradiction!" shouts. The sequence must show the absurdity is *pragmatic* (about the act of asserting) not *logical* (about truth conditions).  
  **Total Time:** 35 minutes.  
  **Dependency:**  
  - **Step 1 must come before Step 2** → Without establishing assertion norms, they’ll miss the paradox.  
  - **Step 3 must come before Step 4** → The third-person contrast defuses "it’s just a contradiction."  
  - **Step 5 is the hinge** → Addressing misconceptions here locks in the insight.  

  **Whiteboard Flow:**  
  1. **Min 0–3: Set Up Norms of Assertion**  
     - Write: "What do we do when we assert something? Example: 'The library is open.'"  
     - Ask: "If I say this, what am I communicating about my state of mind?" (Elicit: When we assert P, we imply we *believe* P. Don’t use the word "norm" yet—keep it intuitive.)  
     - **Why now?** This must be first. Without it, they’ll leap to truth tables.  

  2. **Min 3–6: Introduce Belief Reports**  
     - Write: "Contrast: 'I believe the library is open.'"  
     - Ask: "How is this different from asserting 'The library is open'?" (Elicit: Direct assertion presents P as true; belief reports describe a mental state.)  
     - **Why now?** Separates belief from truth to prep for Moore.  

  3. **Min 6–10: Third-Person Case (Plausible/Sad)**  
     - **Carrier Case: "Your partner still loves you"**  
       - Write: "Sam says to Alex: 'Your partner still loves you, but Alex doesn’t believe it.'"  
       - Ask: "Is this coherent? Could it be true?" (Elicit: Yes—Alex might be heartbroken, in denial, etc. It’s poignant, not absurd.)  
     - **Why now?** Prevents "contradiction" rush by showing the content is logically possible. Builds empathy for the state described.  

  4. **Min 10–14: First-Person Case (Absurd)**  
     - Write: "Alex says: 'My partner still loves me, but I don’t believe it.'"  
     - Ask: "What’s wrong here? Try saying it aloud—how does it feel?" (Elicit: It feels self-undermining, like a performative error. Some may laugh.)  
     - **Why now?** The contrast with Step 3 makes the absurdity visceral. Punch lands because they see the same content is fine in third-person but absurd in first-person.  

  5. **Min 14–20: Truth Table & Misconception Busting**  
     - Write the truth table for P and ~B(P) [where P = "My partner loves me", B(P) = "I believe P"]:  
       | P | ~B(P) | P ∧ ~B(P) |  
       |---|---|-------------|  
       | T | T | T (Possible? Yes—self-deception!) |  
       | T | F | F |  
       | F | T | F |  
       | F | F | F |  
     - **Misconception Responses:**  
       - *"It’s a contradiction!"*: "But the truth table shows P ∧ ~B(P) can be true (first row). So why can’t Alex assert it? The issue isn’t logic—it’s what asserting P *does* (Step 1)."  
       - *"It’s about lying!"*: "If Alex were lying, he wouldn’t admit he doesn’t believe it—that’s the opposite of lying! Sincerity isn’t the point."  
       - *"Past tense fixes it"*: Write: "Yesterday, my partner loved me, but I didn’t believe it." Ask: "Why is this okay?" (Elicit: Asserting past P doesn’t imply *current* belief about P. The paradox requires present belief + present assertion.)  
         - **Clue vs. Escape Hatch:** "The tense shift is a clue—it shows the problem is about *present commitment*, not grammar. Park tenses for now."  
     - **Why now?** Truth tables come AFTER they’ve felt the absurdity, so they see logic doesn’t resolve it.  

  6. **Min 20–25: Self-Deception & Belief Fallibility**  
     - Write: "Can Alex be wrong about his own belief?" (Yes! Self-deception makes P ∧ ~B(P) possible.)  
     - Ask: "But if he’s in denial, why can’t he *say* this?" (Elicit: Asserting P forces him to present himself as believing P, conflicting with ~B(P). The act is inconsistent, not the belief.)  
     - **Why now?** After truth tables, they see the state is possible—so the absurdity must be in asserting it.  

  7. **Min 25–28: Chatbot Question**  
     - **Park it firmly:** "Great Q—but AI isn’t asserting, it’s simulating. Humans assert with commitment; chatbots don’t. We’re focusing on human cases today. Discuss after class!"  
     - **Why now?** Address early before it derails the room.  

  ---

  ### 2. **Carrier Case: "Your partner still loves you"**  
  - **Why this works:**  
    - **First-person absurdity:** "My partner still loves me, but I don’t believe it" feels immediately self-defeating (like punching yourself while declaring you exist). No humor—raw denial.  
    - **Third-person plausibility:** "Your partner still loves you, but you don’t believe it" feels empathetic (e.g., after a breakup).  
  - **What it must have:**  
    - High emotional stakes (denial feels tragic, not trivial).  
    - Present-tense belief + assertion (to avoid tense distractions).  
    - No ambiguity about the fact (e.g., not "it might rain"—partners love or don’t).  
  - **What would wreck it:**  
    - Joking/irony (e.g., "I’m a terrible driver, but I don’t believe it" → undermines absurdity).  
    - External factors (e.g., "My partner loves me but I haven’t checked my phone" → shifts focus to evidence).  

  ---

  ### 3. **Misconception Map & Timing**  
  Address these **exactly when they arise** (don’t preempt—let them surface naturally):  
  - **"Contradiction!"** → Head off at **Min 14–20** with truth table (show it’s logically possible).  
  - **"It’s about lying/insincerity"** → Crush at **Min 14–20** (lying hides disbelief; Moorean assertion reveals it).  
  - **"Past tense fixes it—cheap trick!"** → **Min 14–20**: Contrast past-tense example to show the paradox hinges on *present* commitment in assertion.  
  - **"So we can’t be wrong about beliefs?"** → **Min 20–25**: Emphasize fallibility (self-deception makes P ∧ ~B(P) possible) but asserting it breaches pragmatic norms.  
  - **Chatbot question** → **Min 25–28**: Park it (it’s about philosophy of AI, not Moore).  

  ---

  ### 4. **Scope Calls: What to Include/Exclude**  
  - **Omissive form only ("P and I don’t believe P"):** Skip commissive ("~P and I believe P"). It’s redundant for your goal and eats 5 minutes.  
  - **Skip the knowledge version ("P but I don’t know P"):** Distraction—it introduces justification, muddying belief-focused absurdity.  
  - **Openly refuse to cover:**  
    - "We won’t cover doxastic logic proofs—they’re for advanced seminars."  
    - "We’re skipping debates on assertion norms (e.g., knowledge vs. belief). We’re assuming assertion implies belief for now—it’s enough to feel the paradox."  
    - **Why these cuts?** The paradox’s core (absurdity via assertion-belief tension) survives without them.  

  ---

  ### 5. **Closing Question (Min 32–35)**  
  **Write:** *"If someone asserts 'P but I don’t believe P', could the sentence be true while the assertion is absurd? Why?"*  
  - **"Got it" answer:** "Yes—the sentence can be true (e.g., self-deception), but asserting it is absurd because you present belief in P while denying it. The absurdity is in the act."  
  - **"Vaguely enjoyed puzzle" answer:** "No, because if it’s true, asserting it should be fine" (focuses on content, not action) or "It’s always false" (still stuck on contradiction).  
  - **Why this works:** Forces distinction between sentence truth (logic) and assertion (pragmatics).  

  ---

  **Session Flow Summary:**  
  - Min 0–10: Build assertion norms → third-person case → first-person absurdity.  
  - Min 10–25: Truth tables + misconception busting (focus: not contradiction, not lying, tense is clue).  
  - Min 25–32: Belief fallibility + parked chatbot.  
  - Min 32–35: Closing question.  

  **Stick to the carrier case rigidly—no diversions.** If they reference self-deception, nod but steer back to assertion: "Self-deception explains how the state happens, but not why asserting it feels broken." You’ve got this!
