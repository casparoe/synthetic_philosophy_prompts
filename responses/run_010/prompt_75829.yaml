  Then push one case I cooked up all the way through, since that's what I actually care about. Call it Tiebreak: the complete history of a universe admits two best systems, exactly tied on simplicity, strength and fit, that agree on everything that happened but assign different chances to some repeatable process, and so disagree about which counterfactuals hold. What is each side committed to saying, and does either answer cost them more elsewhere? Run the self-undermining problem as a second crux too — the Humean's own chances make the actual frequencies somewhat unlikely, and had those frequencies obtained they'd have supported a rival system.

  Finally, say how much of this is verbal. Propose a translation test both would accept (whether every counterfactual true on one side is true on the other, maybe) and say which parts of the dispute survive it.
