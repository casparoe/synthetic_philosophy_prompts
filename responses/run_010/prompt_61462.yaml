prompt: |-
  I have been assigned a ninety-minute session in an interdisciplinary graduate seminar whose members come either from philosophy, with one term of decision theory behind them, or from computer science, with no philosophy at all. Everyone in the room has met the one-shot prisoner's dilemma and the definition of a Nash equilibrium; everyone can read a short program; essentially no one has encountered a formal proof system.

  The topic is program equilibrium. To fix the target rather than leave you guessing at it, here is the setup I intend to teach, which you should treat as given: the players do not select actions directly. Each submits a program, written in some common language, before play; each program receives the full source code of the other as its input and returns an action as its output; payoffs are then read off the ordinary matrix. Under this rule, programs that cooperate only when they can establish that their opponent will cooperate can in principle both cooperate in a single-shot dilemma, so the familiar argument that mutual defection is forced no longer goes through unopposed. I want the students to leave able to say what an equilibrium is in this setting, why the usual dominance reasoning does not settle the outcome, and where the new difficulty enters.

  What I need is a plan for the explanation, not the explanation. Specifically:

  1. The dependency structure. Tell me the order the components must come in and what each one is a prerequisite for. In particular: should I motivate by exhibiting a pair of cooperating programs first and only then asking what could go wrong, or should I first show that the obvious reciprocal program — the one that simply returns whatever it determines its opponent will return — fails to have a determinate result, and only then build the cooperating pair? How much of best response and of the Nash definition has to be re-laid before the notion transfers to programs, and what exactly carries over versus what has to be replaced? Where must the fixed-point character of the idea be made explicit, and what breaks if I defer it?

  2. The carrying example. Choose the single small family of programs that should support the whole session. Say what it must demonstrate, and just as important what it must not be: I do not want anything a student could dismiss as tit-for-tat with extra steps, anything that smuggles in repeated interaction, or anything that turns on randomness. Keep it displayable in under fifteen lines of pseudocode, and tell me whether to put numbers in the payoff matrix or leave it ordinal. Also tell me what the example should visibly fail at, so that the hard part of the topic is on the table instead of being smoothed over.

  3. The misconceptions. I expect at least these: that the result is just the iterated dilemma relabeled; that cooperating remains irrational because defecting is still better once the other program's code is fixed, so cooperation must involve trust or self-deception; that reciprocal copying settles everything, which I suspect is false but cannot demonstrate cleanly; that the whole thing is a theorem about machines and says nothing about people who cannot read one another's minds; and that the players simply choose twice, so an equilibrium over programs is nothing but an equilibrium in an outer game with a bigger action space. For each, say whether I should prevent it from forming or deliberately allow it to form and then dismantle it, and mark the exact point in the sequence where it gets handled. Add any you think I have missed that this audience reliably produces.

  4. The logic I must black-box. Making the cooperating pair actually work rather than merely look plausible seems to require some claim about what one program can establish about the other, and my students have no tools for that. Tell me the minimum assertion I have to make for the example to function, how much of the surrounding machinery I can honestly bracket at this level, and what I should say about the bracketing so that it registers as a flagged simplification rather than as hand-waving.

  5. The check. Give me one short exercise or question to put at the end whose answers separate students who have the idea from students who have only the slogan, and describe what a characteristic wrong answer looks like and what it reveals about which step of the sequence failed.

  6. The omissions. Tell me what I should announce as out of scope in the first two minutes, and which questions I should refuse on the grounds that answering them properly exceeds the session.

  Finally, allocate the ninety minutes across the parts you have specified. Give me the plan together with the reasoning behind the ordering and the misconception map, not a script or lecture notes, and please do not include readings or references of any kind.
reasoning: |-
  We are given 90 minutes to cover program equilibrium in the context of a one-shot prisoner's dilemma for an interdisciplinary graduate seminar. The audience has basic knowledge of the prisoner's dilemma and Nash equilibrium, can read short programs, but has no formal proof system background.

  The goal is for students to understand:
  - What an equilibrium is in this program setting.
  - Why the usual dominance reasoning (that mutual defection is forced) does not apply.
  - Where the new difficulty (the fixed-point character) enters.

  We break the plan into the requested parts.

  1. **Dependency Structure**:

     We must introduce the components in an order that builds understanding without unnecessary detours.

     Proposed order:

     a. **Recap the Prisoner's Dilemma (PD) and Nash Equilibrium (NE) in the normal form (5 minutes)**.
        - Remind: PD matrix (ordinal or with numbers? We'll use ordinal for simplicity: C and D, with T > R > P > S and 2R > T+S). The usual NE is (D,D) because D is dominant.
        - Why? Because no matter what the other does, D gives a better payoff. Hence mutual defection is the only NE.

     b. **Introduce the program game setup (10 minutes)**.
        - Instead of choosing actions, players submit programs. Each program gets the source code of the other as input and outputs an action (C or D).
        - The payoffs are determined by the actions output by the two programs when run on each other's source.
        - Note: The programs are run simultaneously and in isolation (no repeated interaction, no shared state).

     c. **Attempt 1: The "Naive Reciprocator" and its failure (15 minutes)**.
        - Present a program that tries to do what the other does. Pseudocode:

          ```
          def naive_reciprocator(opponent_code):
              return run(opponent_code, naive_reciprocator)   # Opponent_code is run on naive_reciprocator
          ```

        - Why does this fail? It leads to infinite recursion (or non-termination). The program tries to simulate the opponent running on itself, which in turn simulates the opponent again, etc. This is the first obstacle: we cannot simply have a program that says "do what the other does" because that requires simulating the other which is simulating you.

        - This step is crucial because it shows that the direct translation of "reciprocity" fails due to self-reference. It also motivates the need for a more sophisticated approach.

     d. **Building the cooperating pair (20 minutes)**.
        - Now we show a pair of programs that do cooperate. We need a way to break the circularity. The key idea is to use a program that checks whether the opponent is similar to itself (in a way that ensures cooperation) and then cooperates, else defects.

        - We present a family of programs that use a "proof" (or a check) that the opponent will cooperate. We black-box the details of the proof (see part 4). Example:

          ```
          def cooperator(opponent_code):
              if proves(opponent_code, "returns C") and proves(opponent_code, "does not defect when I cooperate"): 
                  return C
              else:
                  return D
          ```

          But this is vague. Instead, we use a simpler version that is more concrete but still requires a black-box. We'll use:

          ```
          def cooperator(opponent_code):
              # Check: does opponent_code, when run on cooperator's code, return C?
              # But note: we cannot run opponent_code on cooperator because that might be expensive or non-terminating.
              # Instead, we use a black-box "proof" system.

              # We assume we have a function check_proof(opponent_code, property) that returns True if there exists a short proof that opponent_code has the property, else False.

              if check_proof(opponent_code, "returns C when run on cooperator"):
                  return C
              else:
                  return D
          ```

          However, note that both players are submitting the same program? We must allow for symmetric and asymmetric programs. We'll assume both players are submitting the same program? But we want an equilibrium so we need to consider deviations.

          Actually, we want to show a symmetric equilibrium. So we will have two copies of the same program (say `cooperator`) facing each other.

          But note: when `cooperator` is run with `cooperator` as input, it must check: does `cooperator` (the opponent) when run on `cooperator` (itself) return C? We need to ensure that this check succeeds.

          How? We black-box the proof system. We assume that the program is written in such a way that the proof system can prove that `cooperator` returns C when given `cooperator` as input. This is a fixed point: the program must be designed so that the proof of its behavior on itself exists.

        - We explain that under the assumption that the proof system is strong enough to prove this fact about itself, then when two `cooperator`s meet, they both return C.

        - Why is this an equilibrium? We must then check that no player would want to deviate to another program. We show that if one player changes to a different program, say `defector` (which always defects), then what happens? The `cooperator` will run `defector` and see that it cannot prove that `defector` returns C (because it doesn't), so it returns D. Then the outcome is (D,D). But note: the deviator (who is `defector`) gets the same as if both defected? Actually, the `defector` gets to defect against a `cooperator` that cooperates? Wait: no. Because the `cooperator` when facing `defector` will output D, so the outcome is (D,D). Therefore, the deviator does not gain.

          But what if the deviator submits a program that always cooperates? Then the `cooperator` (when facing this always-C program) will check: can I prove that the opponent returns C when run on me? The always-C program does return C regardless, so the proof should be easy. Then `cooperator` returns C. So the outcome is (C,C) and the deviator gets the same as before.

          Therefore, the `cooperator` program is a best response to itself? Actually, we must consider all possible deviations. We note that if the opponent is fixed to `cooperator`, then the player can submit any program. The key is: what action does the program output when given the `cooperator` code? The `cooperator` program outputs C when it sees the opponent is `cooperator`. If the deviant program, when given `cooperator` as input, outputs D, then what? The `cooperator` (the original one) when run on the deviant program will not have a proof that the deviant returns C when run on `cooperator` (because it doesn't), so it returns D. Then the outcome is (D,D). The deviant program gets the same as the non-deviant: P (the punishment payoff). But if the deviant program, when given `cooperator` as input, outputs C, then the outcome is (C,C) and the deviator gets R. But note, the deviator could have gotten R by sticking to `cooperator` as well. So there is no incentive to deviate to a program that also cooperates when facing `cooperator`? Actually, the deviator cannot get more than R because if both play `cooperator` they get R, and if the deviator plays a program that cooperates when facing `cooperator`, then the outcome is (C,C) and they get R. But if the deviator plays a program that defects when facing `cooperator`, then the outcome is (D,D) and they get P, which is worse. Therefore, there is no profitable deviation.

        - However, there is a catch: what if the deviant program tricks the `cooperator` into cooperating while the deviant defects? This is the key: the `cooperator` only cooperates if it can prove that the opponent returns C. Therefore, if the deviant program is such that it returns D, then the `cooperator` will not find a proof (if the proof system is sound) and hence will defect. So the outcome is (D,D). Therefore, the deviant does not get T (the temptation) because the opponent defects. Hence, the deviant cannot get T.

        - Therefore, in the program equilibrium, (cooperator, cooperator) is a Nash equilibrium: no unilateral deviation yields a strictly better payoff.

     e. **The fixed-point character and the new difficulty (10 minutes)**.
        - Now we highlight the fixed-point: the program must be designed so that when it is fed to itself, the proof of cooperation exists. This is a self-referential design. Without this, the program would defect when facing itself. The fixed-point is the reason why we can have cooperation.
        - The new difficulty is that we must design the program so that it can prove things about itself. This requires a proof system that can handle self-referential statements. We note that in general, it is not trivial to write such a program without causing the proof system to break down (e.g., inconsistency or incompleteness).

     Why this order? We start by reminding the standard argument to set the stage. Then we show the program setting and the first naive attempt fails, which motivates the need for a more sophisticated approach. Then we build the cooperating pair and show it is an equilibrium. Finally, we highlight the fixed-point and the new difficulty.

  2. **The Carrying Example**:

     We choose the symmetric `cooperator` program as above. We must avoid tit-for-tat and repeated interaction. The example must be short.

     Pseudocode (under 15 lines):

     ```
     # We assume a function check_proof(program, property) that returns True if there is a proof (in a fixed formal system) that the program has the property, else False.

     def cooperator(opponent_code):
         # Property: when run on the code of cooperator, does the opponent return C?
         property = "returns C when run on cooperator's code"
         if check_proof(opponent_code, property):
             return C
         else:
             return D
     ```

     However, note: the property string must be defined precisely. We are using "cooperator's code" as a placeholder. We must be careful: the program is using its own code? We can do:

     ```
     def cooperator(opponent_code):
         # We have a global variable MY_CODE that holds the source of cooperator? 
         # But we want to avoid having to pass self. Alternatively, we can design the property to be about the opponent being run on the same input that the opponent is getting? Actually, the opponent is run on MY_CODE. But note: in the call, we are passing `cooperator` to the opponent? How do we refer to the current program?

     This is tricky. We can assume that the program has access to its own source code. We can do:

     ```
     def cooperator(opponent_code):
         # We have a string SELF that is the source of the cooperator function.
         if check_proof(opponent_code, f"returns C when run on input '{SELF}'"):
             return C
         else:
             return D
     ```

     But note: we are using SELF. We assume that the language allows this (quining). We can black-box this too.

     We must demonstrate:
     - That when two `cooperator`s meet, they both find the proof and return C.
     - That if one player uses `cooperator` and the other uses `always_defect` (which is `def f(opponent_code): return D`), then the `cooperator` does not find a proof (because `always_defect` does not return C) and returns D, so outcome (D,D). Hence, the deviator does not gain.

     What it must visibly fail at: The program relies on a proof system that is not specified. We do not show how `check_proof` works. Moreover, we must note that the proof system might be incomplete: it might not be able to prove true statements, or it might prove false ones. We assume it is sound and sufficiently strong for the self-referential proof. But we do not construct the proof. This is the hard part that we black-box.

     We leave the payoff matrix ordinal: C and D, with T>R>P>S and 2R>T+S. The numbers are not necessary.

  3. **Misconceptions**:

     We address:

     a. *That the result is just the iterated dilemma relabeled.* 
        - We prevent it by emphasizing: this is a one-shot interaction. The programs are run once and only once. There is no repetition. We should say this explicitly when introducing the setup.

     b. *That cooperating remains irrational because defecting is still better once the other program's code is fixed.*
        - We handle this when we analyze the equilibrium. We show that if the opponent's program is fixed to `cooperator`, then any program that the deviator submits: if it tries to defect, then the `cooperator` (the original one) will also defect (because it doesn't find a proof), so the outcome is (D,D) and the deviator gets P, which is worse than R. Therefore, it is not better to defect. We must make this clear in the equilibrium analysis.

     c. *That reciprocal copying settles everything, which is false.*
        - We already showed that the naive reciprocator fails (infinite recursion). We then built a program that does not just copy but uses a proof system. We can contrast: the `cooperator` does not run the opponent's code arbitrarily; it uses a proof system to reason about the opponent's behavior without running it. This avoids the infinite recursion. We handled this in step c (the naive reciprocator failure).

     d. *That the whole thing is a theorem about machines and says nothing about people who cannot read one another's minds.*
        - We should allow this to form and then dismantle it. We note that the model is an idealized machine setting. However, it shows that in principle, if players can commit to programs and the programs can reason about each other, then cooperation is possible. We can draw an analogy to pre-play negotiation: if players can exchange code and have the ability to reason about each other's strategies, then they can achieve cooperation. But we must be clear that the model assumes the programs are available to each other. We handle this at the end when discussing the fixed-point and the new difficulty.

     e. *That the players simply choose twice, so an equilibrium over programs is nothing but an equilibrium in an outer game with a bigger action space.*
        - We should prevent this. We emphasize that the program choice is a choice of a function that maps the opponent's program to an action. This is a much larger space and the payoffs are defined by the fixed-point of the two functions. We note that the usual dominance reasoning does not apply because the action chosen depends on the opponent's entire program. We can say: in the normal form, we choose an action and the payoff depends only on the two actions. Here, we choose a program and the payoff depends on the fixed-point of the two programs. This is more complex and allows for the possibility of cooperation. We handle this when we introduce the program game and when we build the cooperating pair.

     Additional misconceptions:

     f. *That the proof system is a magic box that can do anything.*
        - We should address this by noting that we are making a strong assumption: that the proof system can prove the necessary self-referential statement. In reality, this requires a fixed-point in the proof system (by Löb's theorem, which we do not mention by name). We flag that there are technical challenges (incompleteness, undecidability) but we are assuming a sufficiently strong and sound proof system for the purpose of the example.

     g. *That the program must run the opponent's code to determine the action, leading to infinite regress.*
        - We already showed the naive reciprocator fails. The `cooperator` program does not run the opponent's code; it uses a proof system to reason about it. We avoid the infinite regress by not running the code but by proving properties about it.

  4. **The Logic to Black-Box**:

     We must black-box the proof system. We assume:

     - We have a function `check_proof(program, property)` that is sound (if it returns True, then the property holds) and that is strong enough to prove the statement: "when the program `cooperator` is run on input `cooperator`, it returns C".

     We do not construct the proof. We simply state that if the program is written in a way that is amenable to the proof system (i.e., the proof system can prove the necessary properties about it), then the example works.

     We bracket:
     - How the proof system works.
     - How the program refers to itself (quining) to form the property string.
     - The possibility of undecidability or incompleteness (we assume the necessary proofs exist).

     We say: "We are assuming that the proof system is powerful enough to prove the necessary properties about the programs we consider, and that it is sound. In reality, designing such a system without running into issues like incompleteness is challenging, but for the purpose of this example, we set that aside."

  5. **The Check**:

     Exercise: Consider a different program, `selfish`:

     ```
     def selfish(opponent_code):
         return D   # always defects
     ```

     Now, suppose we are in a world where two `cooperator` programs are facing each other. One player considers deviating to `selfish`. What happens? What is the outcome? Does the deviator get a higher payoff than R?

     Characteristic wrong answers:
     - "The deviator gets T because the `cooperator` will cooperate." -> This is wrong because when `cooperator` is run with `selfish` as input, it checks: can I prove that `selfish` returns C when run on `cooperator`? The answer is no (because `selfish` always returns D). So `cooperator` returns D. Then the outcome is (D,D). The deviator gets P, which is less than R. So the deviation is not profitable.

     Why this exercise? It tests whether the student understands that the `cooperator` program does not naively cooperate but conditions on the proof. It also checks the equilibrium condition.

  6. **Omissions**:

     Announce at the beginning (first two minutes):

     - We will not cover the technical details of the proof system (how it works, how it avoids inconsistency, how it handles self-reference). This is a deep topic that requires more logic than we have time for.
     - We are only considering deterministic programs and a one-shot interaction (no repetition, no randomness).
     - We are not discussing how to extend this to more than two players or other games beyond the prisoner's dilemma.
     - We are not going into the philosophical debate about whether this solution applies to human players.

     Refuse questions that require:
     - Explaining the construction of the proof system (Löb's theorem, fixed-point theorems in logic).
     - Handling cases where the proof system is incomplete or unsound.
     - Extensions to repeated games or games with incomplete information.

  **Time Allocation**:

  Total: 90 minutes.

  - Recap PD and NE: 5 min.
  - Program game setup: 10 min.
  - Naive reciprocator and its failure: 15 min.
  - Building the cooperating pair and showing equilibrium: 20 min.
  - Fixed-point and new difficulty: 10 min.
  - Addressing misconceptions (woven in, but we also set aside 10 min for explicit discussion): 10 min.
