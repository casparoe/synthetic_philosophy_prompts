  Note: The misconceptions are addressed throughout the lecture. We reserve 10 minutes at the end of the main content to explicitly review and clarify them. The exercise is at the end.

  The plan:

  1. (0-5 min) Recap of PD and NE.
  2. (5-15 min) Program game setup.
  3. (15-30 min) Naive reciprocator and its failure.
  4. (30-50 min) Building the cooperating pair and equilibrium analysis.
