  This leaves 5 minutes for transitions and flexibility.

  Reasoning: We start with what they know to build confidence. Then we introduce the new setting. The failure of the naive approach creates a puzzle. We then resolve the puzzle with the `cooperator` program. We analyze it as an equilibrium to show that it works. Then we step back to see the fixed-point as the key. We then explicitly address misconceptions that might have arisen. The exercise checks understanding. We end by recapping the boundaries of the session.
answer: |-
  ### Plan for the Ninety-Minute Session

  #### **Dependency Structure (Order of Components)**  
  **Total: 40 minutes**  
  1. **Recap standard PD and Nash equilibrium (NE) (5 min)**  
     - Prerequisite: Remind students of the PD matrix (use **ordinal payoffs**: T > R > P > S, 2R > T + S) and why (D, D) is the unique NE.  
     - **Why first?** Grounds the discussion in familiar territory. Students must see that dominance forces mutual defection in the normal form.  

  2. **Introduce the program game setup (10 min)**  
     - Explain: Players submit programs that take each other’s source code as input and output actions. Payoffs are determined by the matrix.  
     - **Prerequisite for**: Everything that follows. Emphasize this is **one-shot** (no repeated interaction).  

  3. **Motivate with a *failed* reciprocal program (15 min)**  
     - Present:  
       ```python  
       def Copy(opponent_code):  
           return run(opponent_code, Copy)  # Outputs whatever opponent outputs when given Copy  
       ```  
     - Show it fails: Self-reference causes infinite recursion (non-termination).  
     - **Why before success?** Forces students to confront the core problem: Naive reciprocity is impossible. This creates "cognitive dissonance" and primes them for the solution.  

  4. **Build the cooperating pair (10 min)**  
     - Now introduce a program that cooperates *only* if it can prove the opponent cooperates:  
       ```python  
       def CooperateBot(opponent_code):  
           if proves(opponent_code, "returns C when run on CooperateBot"):  
               return C  
           else:  
               return D  
       ```  
     - **Prerequisite for equilibrium**: Show that if both play `CooperateBot`, they cooperate (assume the proof succeeds).  

  5. **Define program equilibrium and refute dominance (15 min)**  
     - **Transfer Nash**: A program profile is a NE if no player gains by switching to another program, *given the opponent’s program*.  
     - **Refute dominance**:  
       - Dominance says "always D beats C when opponent is fixed". But here, if you switch to `AlwaysDefect` (defects unconditionally), `CooperateBot` facing it outputs D → (D, D). You gain nothing.  
       - **New difficulty**: The outcome depends on a **fixed point** (each program’s output depends on proving properties about the other). Deferring this breaks the example—it must be explicit here.  

  #### **Carrying Example**  
  **Program**: `CooperateBot` (as above).  
  **Pseudocode (under 10 lines)**:  
  ```python  
  def CooperateBot(opponent_code):  
      # Assume: proves(program, property) = True iff a proof exists that  
      #          "program outputs C when run on CooperateBot’s source"  
      if proves(opponent_code, "returns C when run on CooperateBot"):  
          return C  
      else:  
          return D  
  ```  
  **What it demonstrates**:  
  - Cooperation is possible in a one-shot PD.  
  - `CooperateBot` vs. `CooperateBot` → (C, C).  
  - `CooperateBot` vs. `AlwaysDefect` → (D, D).  
  - Equilibrium: Deviating to `AlwaysDefect` yields P (same as mutual defection).  

  **What it visibly fails at**:  
  - The `proves` function is a black box. Students see that **self-reference is unresolved**—we assume the proof exists but don’t construct it. This exposes the "hard part" (the gap between intuition and formal machinery).  

  **Why not tit-for-tat?** No history, no repeated play. Programs run once, using only source code analysis.  

  #### **Misconceptions**  
  1. **"This is just the repeated PD"**  
     - **When handled**: Prevent during setup (minute 5). Stress: "Programs run once; no future interactions."  

  2. **"Cooperating is irrational because defecting dominates once the opponent is fixed"**  
     - **When handled**: Dismantle during equilibrium definition (minute 50). Show: Deviating to `AlwaysDefect` *doesn’t* yield T because the opponent (`CooperateBot`) outputs D in response.  

  3. **"Copying solves everything"**  
     - **When handled**: Deliberately allow during naive reciprocal program (minute 20), then dismantle by showing infinite recursion.  

  4. **"This requires mind-reading, so it’s irrelevant to humans"**  
     - **When handled**: Allow to form during setup, dismantle during conclusion (minute 80). Argue: The key is **public commitment** (programs as binding strategies), not telepathy.  

  5. **"Equilibrium over programs is just a bigger normal-form game"**  
     - **When handled**: Prevent during equilibrium definition (minute 50). Contrast: In normal-form games, actions are chosen *independently*. Here, the program’s output *depends on the opponent’s source code*, creating interdependence that breaks dominance.  

  **Added misconception**:  
  6. **"Randomness/approximations could achieve the same"**  
     - **When handled**: Prevent during setup (minute 10). Rule out: "No randomness; programs are deterministic."  

  #### **Logic to Black-Box**  
  **Minimum assertion**:  
  - "Assume a sound proof system where `CooperateBot` can prove true statements about program behavior, including self-referential ones."  

  **What to bracket**:  
  - How proofs work (incompleteness, Gödel, etc.).  
  - Implementation of `proves` (e.g., quining to handle self-reference).  

  **How to flag**:  
  - "We’re idealizing: Real proof systems have limitations, but for this example, assume they work perfectly. This is a *conceptual* proof, not an implementation guide."  

  #### **Check Exercise**  
  **Question**: "Suppose Alice plays `CooperateBot`. Bob considers playing a program `TrickBot` that:  
  - Outputs C if Alice plays `CooperateBot`,  
  - Outputs D otherwise.  
  Does Bob gain by switching to `TrickBot`? Why?"  

  **Correct answer**: No gain. `CooperateBot` facing `TrickBot` checks: "Can I prove `TrickBot` outputs C when run on me?" But `TrickBot`’s code *conditions on Alice’s program*, so the proof fails → `CooperateBot` outputs D. Outcome: (D, D).  

  **Characteristic wrong answer**:  
  - "Yes, because `TrickBot` cooperates when facing `CooperateBot`."  
  - **Reveals**: Student ignored the **proof-check step**. They treated programs as actions, not strategies that analyze code.  

  #### **Omissions**  
  **Announce upfront (minute 0–2)**:  
  - "We omit: How proofs work (incompleteness, formal logic), extensions to n-player games, probabilistic programs, and real-world applications to AI safety."  

  **Refuse (if asked)**:  
  - "How do you implement `proves` without inconsistency?" → Exceeds scope (requires logic background).  
  - "What if programs aren’t deterministic?" → Out of bounds (session assumes determinism).  

  ---

  ### **Timeline (90 Minutes Total)**  
  1. **Intro & Omissions (2 min)**: Set boundaries.  
  2. **Recap PD/NE (5 min)**: Anchor in known concepts.  
  3. **Program Game Setup (10 min)**: New rules. Prevent misconception 1.  
  4. **Naive Reciprocal Program (15 min)**: Let misconception 3 form, then dismantle.  
  5. **CooperateBot Example (10 min)**: Show cooperation. Black-box `proves`.  
  6. **Program Equilibrium (15 min)**: Define NE, refute dominance, dismantle misconception 2.  
  7. **Fixed Point & Difficulty (8 min)**: Highlight self-reference.  
  8. **Address Misconceptions (10 min)**: Explicitly dismantle 3, 4, 5, 6.  
  9. **Check Exercise (10 min)**: Pose question, discuss answers.  
  10. **Wrap-up (5 min)**: Summarize "why dominance fails" and "where the fixed point bites".  

  ---

  ### **Rationale**  
  - **Order**: Start with failure (naive reciprocity) to create tension. Success (`CooperateBot`) then resolves it, making the equilibrium payoff clear. Nash is re-laid *after* the example to leverage intuition.  
  - **Example choice**: `CooperateBot` is minimal, non-random, and visibly relies on proofs (exposing the gap). Numbers distract; ordinal payoffs suffice.  
  - **Misconception timing**: Prevent early (1, 6), dismantle during key points (2, 3, 5), address late (4) when students see the big picture.  
  - **Black-box**: Students lack logic tools; asserting a working `proves` avoids derailing the core idea.  
  - **Check**: Tests if students see programs as code-analyzing entities (not actions).  
  - **Omissions**: Keeps focus on intuition. Philosophy students may itch for extensions; CS students for implementation. Refuse both.
