  We are given a set of commitments and two test cases. We need to check for consistency and tensions within the commitments and whether the commitments deliver the verdicts on the cases as intended.

  First, list the commitments:

  1. Testimonial injustice (TI) requires a credibility deficit caused by identity prejudice. The wrong is not exhausted by practical costs.

  2. Hermeneutical injustice (HI) is structural, due to a gap in shared interpretive resources from group exclusion. No individual culpability for the gap.

  3. Remedy for TI: cultivated virtue of critical sensitivity to adjust credibility judgments to track actual trustworthiness.

  4. Identity prejudice is often implicit and not introspectively accessible, but ignorance does not excuse; responsibility survives.

  5. Evidentialism: credibility should be apportioned by evidence of reliability. Adjusting for social identity (up or down) is a departure from epistemic rationality.

  6. Epistemic exploitation (EE) is wrong; stop calling on marginalized speakers to educate the privileged.

  7. Affirmative responsibility: dominant hearers must acquire interpretive resources by soliciting and deferring to testimony from marginalized communities when their understanding is inadequate.

  8. Willful hermeneutical ignorance (WHI) is culpable: refusing to engage existing resources is blameworthy.

  9. Contributory injustice (CI) is a species of TI (not a third kind) because it involves a credibility deficit.

  Test cases:

  Case A: Nurses give less credibility to pain reports due to dialect (stigmatized). Nurses disavow prejudice but have comprehension issues. Verdict: TI, nurses culpable.

