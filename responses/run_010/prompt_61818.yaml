  Tension 1: Between 4 and 5.

  - 4 says that even implicit, inaccessible prejudice doesn't excuse, so the hearer is responsible.
  - 5 says that adjusting for social identity (even to correct for prejudice) is a departure from epistemic rationality. But 3 suggests that we should adjust to track actual trustworthiness.

  Mechanism: 5 implies that any adjustment for social identity is irrational. But 3 and 4 together suggest that we must adjust (to correct for prejudice) and that we are responsible for doing so. This seems to require an adjustment that 5 deems irrational. So, 5 forces that the adjustment in 3 is not required by rationality, but 3 and 4 together hold that we are responsible for making that adjustment. There is a conflict: one cannot be both required by responsibility and irrational.

  Severity: High (5) because it strikes at the heart of the remedy.

  Cheapest fix: Modify 5 to allow that in cases of known implicit bias, adjusting for social identity (to correct the bias) can be rational. For instance, if the evidence shows that one's implicit bias leads to systematic undervaluing, then adjusting upward for a marginalized group might be evidence-based. But note that 5 says adjusting for social identity is a departure. Alternatively, we might reinterpret "adjusting" in 3 as not being an adjustment for social identity per se but an adjustment to remove the distortion so that the judgment is based on the actual evidence. However, 5 says that any adjustment for social identity is irrational. So, if the adjustment in 3 is based on the awareness of one's implicit bias (which is about social identity), then it is adjusting for social identity. The fix might be to clarify that the adjustment in 3 is not a direct adjustment for social identity but an indirect one that is responsive to evidence about one's own cognitive distortions. But that might not be enough. Alternatively, we might relax 5 to say that adjusting for social identity is irrational unless it is to correct for a known bias. But then it becomes rational to adjust in that case. The cost is that we abandon pure evidentialism in the sense that we allow social identity to play a role when it is evidence of bias.

  Cost: We lose the pure evidentialism that forbids any role for social identity in credibility. We now allow that in some cases, social identity can be part of the evidence for adjustment.

  Amplifiers: 3 and 4.

  Tension 2: Between 2 and 8.

  - 2 says that hermeneutical injustice is structural and no individual is culpable for the gap.
  - 8 says that willful hermeneutical ignorance (refusing to engage existing resources) is culpable.

  Mechanism: 8 seems to introduce individual culpability for a kind of hermeneutical failure. But 2 says that the gap itself (which is the lack of resources) is not the fault of any individual. However, 8 is about a failure to use existing resources that are available elsewhere. So, the gap in the shared resources (as per 2) might be distinct from the individual's refusal to use resources that are available in other communities. Thus, the tension might be only apparent. The distinction is between the structural gap in the shared resources (for which no individual is to blame) and the individual's failure to seek out resources that exist elsewhere (which is willful ignorance). So, 8 is about a failure to acquire resources that are available, while 2 is about the absence of resources in the shared pool. Therefore, no real conflict.

