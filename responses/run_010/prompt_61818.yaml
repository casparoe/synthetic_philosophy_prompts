  Cheapest fix: None needed. We can hold both by noting that 2 is about the gap in the shared resources, and 8 is about an individual's failure to use existing resources that are available in other communities.

  Amplifiers: 7 (which imposes an affirmative duty to acquire resources) and 9 (which is about the misapplication of concepts, which might be related to willful ignorance).

  Tension 3: Between 6 and 7.

  - 6: We should stop calling on marginalized speakers to educate the privileged (epistemic exploitation is wrong).
