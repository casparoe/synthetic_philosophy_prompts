  This approach sacrifices some communal harmony for autonomy - exactly what the regulator might question but can't avoid per Sen. Best to document the rationale transparently.
answer: |-
  Here's a practical, Sen-grounded decision procedure for your frontline staff. It explicitly prioritizes **protected private spheres** over unanimous preferences when they conflict, per Sen's impossibility theorem. The tradeoff is clear: **individual autonomy in private spaces supersedes communal comfort**, even when unpopular.

  ---

  ### **The Decision Procedure: 15-Minute Flowchart**
  **Core Principle:** *"What happens behind your closed door is yours to control, unless it materially harms others' health/safety or violates tenancy terms. What happens in shared spaces requires compromise."*

  #### **Questions to Ask (In Order):**
  1. **"Where did the disputed behavior occur?"**  
     - *Private space (flat/bathroom)* → Proceed to Q2.  
     - *Shared space (corridor/lounge/garden)* → Skip to Q5.  
     - *Sufficient answer:* Clear location (e.g., "her kitchen," "the courtyard").

  2. **"Is this causing material harm beyond discomfort?"**  
     - *Material harm =* Health risk (e.g., smoke), safety hazard, property damage, or illegal act.  
     - *Yes* → Escalate to manager.  
     - *No* (e.g., smells, sounds, visuals) → **STOP. No action.** Resident’s private conduct stands.  
     - *Sufficient answer:* Evidence of harm (e.g., "asthma attack triggered," "carpet burned").

  3. **"Is the complaint about the *right-holder's own* conduct, or someone else’s?"**  
     - *About own conduct* (e.g., "I hate my cooking smells") → Offer support/resources.  
     - *About others’ conduct* (e.g., "I hate *her* cooking smells") → **STOP. No action.**  
     - *Sufficient answer:* "I want *them* to stop..." vs. "I want to change *my*..."

  4. **"Does the tenancy agreement explicitly grant control here?"** (e.g., courtyard gate)  
     - *Yes* → Respect the right-holder’s current preference. **STOP.**  
     - *No* → Proceed to Q5.

  5. **"Is this about shared space use?"**  
     - *Yes* → Move to house meeting agenda.  
     - *No* → **STOP. No action** (e.g., complaints about others’ private conduct).

  ---

  ### **Escalation & Ethics**
  - **STOP (No Discussion):** At Q2 (no material harm in private space) or Q3 (complaint targets others’ conduct).  
  - **House Meeting:** Only for shared-space disputes (Q5). If low attendance:  
    - *Staff notes:* "Rule proposed but no quorum. No change."  
    - *Never impose rules* without quorum; it violates autonomy.  
  - **Manager Sign-Off:** Needed only if material harm (Q2) or tenancy violation.  
  - **Values Conversations (Not Procedure):** When residents express distress lacking material harm (e.g., "I find his movements upsetting"). Staff response: *"I hear this is hard. Let’s discuss coping strategies."*  

  ---

  ### **Critical Distinctions to Keep**
  | **Must Keep**                          | **Can Drop**               |
  |----------------------------------------|----------------------------|
  | Private vs. shared space boundaries    | "Fairness" interpretations |
  | Material harm vs. discomfort           | Cultural preferences       |
  | "Their conduct" vs. "my conduct"       | Popularity of the complaint|
  | Tenancy-granted rights (e.g., gate)    | Mediation attempts         |

  ### **Judgment Calls Disguised as Steps**
  - Q2: Whether something is "material harm." *Staff tip:* Health/safety only (e.g., allergies = harm; dislike = discomfort).  
  - Capacity assessments: Use momentary capacity ("Can they consent *now*?"), not long-term stability.  

  ### **What This Cannot Settle**
  - **Moral disagreements** (e.g., "spices are immoral").  
  - **Preferences about others’ lives** (e.g., "I don’t like how he dresses in his flat").  
  - **Bargains/swaps** (e.g., trading parking for gate rights).  
  - **Emotional distress without harm** (e.g., "seeing him move unsettles me").  

  ---

  ### **Case Applications**

  #### **Case 1: Spiced Food Smells**  
  1. **Location?** *Private kitchen.* → Proceed.  
  2. **Material harm?** *No* (discomfort ≠ harm). → **STOP. No action.** Cook’s right upheld.  
     - *Staff script:* "Her tenancy protects cooking in her flat. We can offer you noise-canceling headphones or air fresheners."  

  #### **Case 2: Blinds Open at Night**  
  1. **Location?** *Private flat.* → Proceed.  
  2. **Material harm?** *No* (distress ≠ harm). → **STOP. No action.** Blind control is his right.  
     - **Harsh truth:** Autonomy wins. Staff script: "His flat, his blinds. Let’s explore curtains for your windows."  

  #### **Case 3: Courtyard Gate**  
  1. **Location?** *Shared courtyard* → Skip to Q5.  
  2. **Tenancy-granted right?** *Yes* (sole say). → **Respect right-holder’s preference.** He prefers locked → Lock it.  
     - *Handling instability:* Ask *now*: "Do you want it locked tonight?" If yes, lock it. His past/future views don’t matter.  

  #### **Case 4: Parking/Gate Swap**  
  1. **Proposed swap?** → **Reject immediately.**  
     - *Why:* Tenancy rights aren’t tradable. Procedure **cannot enforce bargains**.  
     - *Staff script:* "Rights under your tenancy can’t be swapped. The gate stays as per Case 3. Parking stays as per agreement."  

  ---

  ### **Why This Works (and Where It Hurts)**
  - **Solves inconsistency:** Clear thresholds replace gut calls.  
  - **Regulator-proof:** Prioritizes tenancy rights (autonomy) while documenting communal attempts.  
  - **You’ll hate Case 2:** Yes, it feels cruel, but Sen’s tension means you *must* sacrifice communal comfort for private autonomy here. The regulator’s conflict is *their* problem—your procedure is legally defensible.  
  - **Handling capacity fluctuations:** Rights are exercised based on *current* capacity. Ask: "What do you want *today*?" Record it. Next week, ask again.  

  **Final Tip:** Laminate this flowchart. Train staff: *"If it’s behind their door and not harmful, drop it. If it’s shared space, take it to the meeting. If they have a right, obey it."* This won’t eliminate complaints, but it will keep the ombudsman at bay.
