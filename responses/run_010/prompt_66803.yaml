  - Paradox: Overall, the promotion rate is higher for those who took the training. But when split by department, the promotion rate is higher for those who didn't take the training in each department. However, the catch is that the assignment to department is influenced by the training (e.g., the training makes people more likely to apply for Sales, which has a higher promotion rate). Thus, the lumped (overall) number is correct because the split is caused by the treatment.

