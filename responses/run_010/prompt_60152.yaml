answer: |-
  ## Sestina: On Translating the Moral Ledger

  The map seemed clear: assign each creed its **weight**,
  A probability, cool and unadorned.
  Sum **value** promised, discounted by the doubt,
  Place cautious **bet** where expectation gleams,
  Assess the **risk** of choosing poorly, wrong,
  Then act with logic, clean and **sure**.

  But soon the ground felt less than wholly **sure**.
  What holds this meta-judgment’s heavy **weight**?
  Is choosing lesser evil still the **right**?
  The theories whisper costs no coin defines.
  To **bet** on souls feels different than on stocks;
  A different flavour stains the word **risk**.

  Is it just outcome spread, this moral **risk**?
  Or trespassing a line, though consequences lure?
  Can "should" be measured by the stakes you **bet**?
  The **weight** of "never" crushes simple sums.
  Is "personhood" a kind of absolute **value**,
  Outside the scale? What makes an action **right**?

  Deontology claims a stark, bright **right**,
  No hedging calculus absorbs its **risk**.
  Consequentialism sees the net **value** bloom.
  But *can* they share a scale? Are we so **sure**?
  The **weight** of "ought" – a force, or just belief?
  How much to **bet** that "good" is one clear thing?

  The gambler's calm, the measured, cool **bet**,
  Assumes a world of states where payoffs **right**
  Can be defined. But duty bears a **weight**
  That feels like fracture, not a priced-out **risk**.
  Is "credence" here a concept we are **sure**
  Applies to visions of the ultimate **value**?

  And what, precisely, *is* this final **value**?
  Is it a state the universe will **bet**
  Upon? Or just a preference, hardly **sure**,
  A feeling we dress up as cosmic **right**?
  Is choosing virtue just aversion's **risk**,
  Or does intrinsic meaning add its **weight**?

  The terms return, but shift beneath their **weight**.
  The final **value** hides. The prudent **bet**
  Feels hollow facing true, unflinching **right**.
  Can we absorb the deontologist's **risk** –
  The terror of transgression – and stay **sure**
  Our meta-scheme has captured all the **sure**?

  **Envoi**
  The residue: that stark, commanding **right**
  Which shouts its "must!" beyond all counted **risk**,
  Refusing any **bet**, ignoring **weight**,
  Dismissing sums of pleasure's shifting **value**,
  Declaring acts forbidden, clean and **sure** –
  A categorical ghost no ledger can make **sure**.

  ---

  **Liberties & Contentions:**

  1.  **"Value" Commensurability:** The poem assumes deep incommensurability between (e.g.) utils and deontic constraints. Many theorists *do* argue for sophisticated aggregation or "veil of ignorance"-style comparisons, claiming comparability *is* possible, albeit complex. The poem leans towards the skeptical view.
  2.  **The Nature of "Ought" (Envoi):** Framing the deontic "ought" as a "categorical ghost" reflects a non-naturalist or strong realist view. Expressivists, error-theorists, or naturalist reductionists would argue this "residue" is illusory – it's just strong feeling or social pressure misdescribed.
  3.  **"Credence" on Moral Propositions:** The poem questions if "credence" applies cleanly to moral beliefs ("Is 'credence' here a concept we are sure / Applies..."). This touches on live debates about cognitivism vs. non-cognitivism and whether moral beliefs are truth-apt *in the same way* as empirical ones. Many Bayesians argue credence *does* apply meaningfully.
  4.  **"Risk" of Transgression:** Portraying deontic violation as a unique "terror" or "risk" beyond consequence weighs heavily on phenomenology. A strict consequentialist might argue this feeling *is* just aversion to bad consequences (e.g., guilt, social sanction) misattributed.
  5.  **The "Meta-Weight":** Treating the meta-rule (assigning weights) as potentially groundless ("What holds this meta-judgment's heavy weight?") highlights the regress problem. Some argue for a "default" rule (e.g., maximize choice-worthiness expectation) or grounding in coherence, contesting that it's *necessarily* arbitrary.

  The poem favors perspectives emphasizing the *qualitative* differences and potential breakdowns in translation, leaning on arguments from moral realism (especially non-naturalist), incommensurability, and the phenomenology of duty. These are significant viewpoints but remain contested within normative uncertainty research.
