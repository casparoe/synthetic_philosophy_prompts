prompt: |-
  I hold the faculty seat on my university's Employee Health Plan Appeals Panel, which decides contested claims under the plan's medical-necessity rider. The rider covers treatment of "a disease, disorder, or pathological condition" and excludes "conditions constituting normal human variation," and it defines neither phrase; counsel drafted it, and no one with training in the philosophy of medicine has ever looked at it. Before the panel is an appeal from a research librarian with a marked delayed sleep phase. Every measure the plan's medical reviewer cites — hormonal, metabolic, neurocognitive — sits inside population-typical ranges, and his written rationale rests entirely on the absence of measurable physiological dysfunction. The appellant's evidence is functional and situational: under the library's fixed 8:00 a.m. opening schedule she has accumulated four documented performance deficiencies in two years, and her department's own productivity data show her output above the median for her rank once her hours are shifted. The reviewer concedes in writing that the requested light-and-melatonin protocol would reverse the deficiencies.

  Two features make the case harder than a coverage decision usually is. First, the reviewer's normality claim turns on how the reference class is drawn: against all adults her age she is an outlier, against adults of her age and sex she is near-typical, and the panel last year paid for a comparable protocol for a night-shift technician without anyone raising the question at all, so consistency cuts in a direction no one has yet articulated. Second, the cheapest resolution is not a coverage decision but a change to her assigned hours, which is outside this panel's remit; referring the matter to the office that controls scheduling would delay any treatment by at least a full semester, during which the deficiencies continue to accrue against her.

  Draft the opinion I will table at the meeting. It should state a definite disposition — cover, deny, cover subject to conditions, or refer — together with a time frame for implementation; it should propose replacement language for the "normal human variation" exclusion that a panel of non-specialists can actually apply to future cases, and say how that language disposes of the night-shift technician precedent; and it should give the strongest available argument for the disposition you reject, stated in terms its proponents would recognize rather than in a weakened form. End with a single line beginning "Disposition:" followed by your recommendation in five words or fewer.
reasoning: |-
  Okay, let me approach this methodically. The user presents a complex appeals panel case involving a delayed sleep phase disorder claim under a medical-necessity rider. The core tension revolves around interpreting "disease/disorder" versus "normal human variation" in the plan language, with significant implications for the appellant's career.

  First, I need to unpack the key elements:
  - The appellant is a research librarian with documented performance issues under fixed 8am schedule
  - Objective metrics show she becomes high-performing with shifted hours
  - Medical reviewer denies coverage based on physiological measures within "normal" ranges
  - But the panel previously approved similar treatment for a night-shift technician

  The user's unspoken needs seem to include:
  - Wanting precedent-setting language to prevent arbitrary future decisions
  - Needing to address institutional inconsistency without alienating colleagues
  - Balancing legal defensibility with ethical responsibility to the employee
  - Managing time sensitivity (delayed resolution = career damage)

  For the opinion structure, I consider:
  1. Starting with factual findings to anchor the decision
  2. Addressing the reference class problem explicitly (age-only vs age+sex cohorts)
  3. Distinguishing the night-shift technician case through different exposure to institutional constraints
  4. Proposing new exclusion language focusing on "functional impairment in ordinary environments"

  The hardest part will be crafting replacement policy language that:
  - Captures functional impact without over-medicalizing
  - Allows case-by-case assessment by non-experts
  - Maintains consistency with past decisions
  - Survives potential legal scrutiny

  For the rejected argument, I plan to present the medical reviewer's position at full strength - that normal biomarker ranges must define disorder boundaries regardless of social context. This respects opposing views while showing why functional criteria matter more in employment contexts.

  The disposition must balance urgency with systemic change. "Cover immediately, refer scheduling" achieves both: giving relief now while pushing the university to address the root cause. Five words fits perfectly.

  Final checks:
  - Does the opinion protect against future claims abuse? The "ordinary environments" clause helps.
  - Is the night-shift distinction convincing? Yes - compulsory shifts create different obligations.
  - Will non-specialists understand the new standard? Clear examples are provided.
answer: |-
  ## Employee Health Plan Appeals Panel Opinion  
  *In re: Coverage Determination for Chronotherapeutic Intervention (Appellant: Research Librarian, ID #4482)*  

  ### I. Factual Findings  
  1. Appellant demonstrates a stable circadian pattern inconsistent with her workplace schedule, with documented:  
     - 4 performance deficiencies under fixed 8:00 a.m. starts  
     - Productivity exceeding departmental median when working delayed hours  
  2. Plan reviewer acknowledges:  
     - All biomarkers fall within population-typical ranges for appellant’s age/sex cohort  
     - Proposed treatment (light-and-melatonin protocol) would resolve documented functional impairments  
  3. Scheduling accommodation remains administratively unavailable before next semester.  

  ### II. Disposition Rationale  
  **Coverage is granted effective immediately**, with treatment to commence within 10 business days.  

  The "normal human variation" exclusion does not apply because appellant’s condition constitutes a **functional disorder under environmental constraint**. While biomarkers fall within sex/age-typical parameters, the *interaction* between her endogenous rhythm and *compulsory institutional demands* creates pathological dysfunction—specifically, recurrent occupational impairment remediable *only* by medical intervention given the employer’s current scheduling rigidity.  

  The night-shift technician precedent (Case #31-8) is distinguishable but consistent: That claimant faced *employer-mandated* nocturnal hours incompatible with his neurophysiology. Both cases share the core principle: **When institutional requirements force alignment with biologically atypical patterns, resulting functional impairment is not "normal variation" but iatrogenic pathology.**  

  ### III. Proposed Rider Language Replacement  
  Replace "conditions constituting normal human variation" with:  
  > *"Conditions that do not demonstrably impair core life activities (e.g., occupational performance, basic self-care, or safety) within the individual’s ordinary social and environmental context."*  

  **Application guidance for non-specialists:**  
  - **Step 1:** Identify if the condition causes *measurable dysfunction* (e.g., performance deficits, safety risks) in claimant’s regular environment.  
  - **Step 2:** Determine if dysfunction persists *despite reasonable non-medical accommodations* (e.g., schedule changes).  
  - **Step 3:** Cover if medical intervention is the *sole practical remedy* for dysfunction identified in Step 1.  

  This standard resolves the technician precedent by centering on *context-driven impairment* rather than statistical typicality.  

  ### IV. Strongest Argument for Denial (as Proponents Would Articulate)  
  > "The plan exists to treat medical pathology, not social inconvenience. Appellant’s biomarkers confirm she has no disease—just a circadian preference outside *arbitrary* institutional norms. Granting coverage here medicalizes human diversity, shifts burden from the employer’s inflexibility to the health plan, and invites claims for every mismatch between biology and social expectation (e.g., height requirements, noise sensitivity). The solution lies in workplace accommodation, not classifying statistical outliers as disordered."  

  ### V. Administrative Directive  
  The Panel refers the scheduling conflict to the Office of Human Resources with a recommendation for urgent review, noting that failure to accommodate predictable chronobiological variance may violate workplace equity standards.  

  ---

  **Disposition:** Cover immediately, refer scheduling.
