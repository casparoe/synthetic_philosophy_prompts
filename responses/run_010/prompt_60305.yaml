  First, I need to unpack the chair's claim. Steven Pinker's "Better Angels of Our Nature" and similar works argue that violence has declined based on per capita battle deaths. But the objectors have valid points. The first trustee mentions different metrics like absolute numbers, structural violence, displacement—each telling a different story. For example, while per capita deaths might be down, absolute numbers could rise with population growth. Structural violence (like poverty or oppression) isn't captured in battle deaths. Also, modern conflicts cause more displacement despite fewer deaths. These are legitimate critiques.

  The statistician's point about fat tails is crucial. War deaths follow a power-law distribution, meaning rare, catastrophic events (like world wars) dominate the data. Seventy years of relative peace don't guarantee future stability. This isn't just statistical nitpicking; it's a fundamental uncertainty in forecasting rare, high-impact events. The chair dismissing this as motivated reasoning overlooks genuine methodological concerns.

  The user wants to avoid bias in either direction. So, I should clarify where consensus exists. Most experts agree that battle deaths per capita have decreased since the mid-20th century. However, there's no consensus on whether this trend will continue, especially with new risks like climate change or AI. Also, the shift from interstate to intrastate conflicts complicates the picture. Structural violence and displacement are rising but aren't included in traditional metrics.

  For the memo's structure, start by acknowledging the chair's argument but stress the contested nature of the claims. Propose amending the sentence to reflect uncertainties. Recommend keeping existing programs while exploring catastrophic risks incrementally. Outline specific evidence needed for review in five years: trends in key metrics, near-misses of catastrophes, and program effectiveness. This balances respect for the chair's vision with addressing trustees' concerns.

  The user's deeper needs include ensuring evidence-based decisions without ideological bias, maintaining board unity, and responsibly transitioning programs. They might also want to preserve the trust's legacy in conflict prevention while cautiously expanding into new areas. The memo should bridge divides by focusing on empirical clarity and pragmatic steps.
answer: |-
  ## MEMORANDUM  
  **To:** Board of Trustees  
  **From:** [Your Name], Trustee  
  **Date:** 22 October 2023  
  **Subject:** Review of Draft Strategy Paper - Foundational Claim on Violence Trends & Strategic Pivot  

  This memo addresses the opening assertion in the Chair's draft ten-year strategy paper ("the world has been getting measurably less violent for centuries, and steeply since 1945") and its implication for pivoting from our core conflict-prevention programmes towards long-run catastrophic risk. It aims to clarify the empirical landscape, evaluate the claim's suitability for the strategy document, propose a resolution, outline operational consequences, and establish criteria for future review.

  **1. Clarifying the Empirical Landscape: Settled vs. Contested**

  *   **Settled Consensus:**  
      *   **Battle Deaths per Capita Decline (Post-1945):** The assertion that *battle deaths per capita* have declined significantly since 1945 compared to earlier historical periods (especially the first half of the 20th century) is widely accepted among quantitative researchers working with datasets like the Correlates of War Project or UCDP/PRIO. This trend is robust across most analyses.  
      *   **Decline in Interstate War:** The incidence and lethality of large-scale, conventional wars *between states* have demonstrably decreased since 1945.  

  *   **Live Arguments & Contested Ground:**  
      *   **"Less Violent for Centuries"?** The pre-1945/long-term trend (especially pre-19th century) is heavily debated. Data quality deteriorates, definitions shift, and interpretations (e.g., was the early modern period more or less violent than medieval times?) vary significantly. Asserting a centuries-long *measurable* decline is **not settled consensus**; it represents one influential interpretation (e.g., Pinker) but faces substantial scholarly pushback.  
      *   **Beyond Battle Deaths:** The claim becomes highly contestable when moving beyond battle deaths per capita:  
          *   *Absolute Numbers:* Global population growth means declining *rates* can mask stable or rising *absolute numbers* of victims from conflict or violence.  
          *   *Structural Violence:* Deaths from poverty, preventable disease, or repression linked to systemic injustice are not captured in battle death statistics but are widely considered forms of violence. Trends here are complex and not uniformly positive.  
          *   *Displacement:* Forced displacement (refugees, IDPs) has reached record highs in recent decades, directly linked to conflict and violence.  
          *   *Non-Lethal Harm:* Trauma, sexual violence, infrastructure destruction, and societal disruption are critical dimensions of violence inadequately reflected in mortality stats.  
      *   **Fat Tails & Future Predictions:** The statistician's objection is methodologically sound. The distribution of conflict severity is "fat-tailed" – dominated by rare, catastrophic events (World Wars). The post-1945 period, while historically relatively peaceful, is a single data point in this distribution. **There is no consensus** that this period proves a fundamental shift guaranteeing continued decline. Extrapolating a "trend line" as predictive law, especially over decades relevant to catastrophic risk, is a profound uncertainty, not settled science.  

  **2. Evaluation of the Draft Sentence & Objections**

  *   The Chair's core argument (declining marginal returns for conventional peacebuilding due to falling violence) relies heavily on the contested long-term trend and the battle-deaths-per-capita metric, while potentially undervaluing the *nature* of contemporary conflicts (often intrastate, complex, generating high displacement/non-lethal harm) where our current work operates.  
  *   The objections are substantive, not merely "motivated reasoning":  
      *   The "category error" objection correctly highlights that *which violence you measure* drastically alters the conclusion. Peacebuilding addresses complex realities beyond just battle deaths.  
      *   The "fat tail" objection correctly underscores the inherent fragility of long-term predictions based on recent history, especially concerning catastrophic events. Assuming the trend *will* continue is a major assumption, not an established fact.  
  *   **Problem:** Including the sentence as written presents contested interpretations as settled fact and uses them as the primary justification for a fundamental strategic pivot. This weakens the strategy's foundation and ignores valid counter-evidence relevant to our existing work in the Sahel and Balkans – regions experiencing significant conflict and displacement *despite* the global per-capita trend.

  **3. Recommendation: Amend the Sentence & Reframe the Justification**

  *   **Action:** **Remove the specific sentence asserting a centuries-long measurable decline steepening since 1945 as an established fact justifying reduced marginal returns.**  
  *   **Amended Foundation for Strategy Discussion:** Replace it with a more nuanced framing, e.g.:  
      > "*While quantitative measures of battle deaths per capita show a significant decline globally since the mid-20th century compared to earlier periods, the nature and impacts of conflict continue to evolve. Contemporary violence often manifests as complex intrastate conflict, generating high levels of displacement and non-lethal suffering, alongside persistent risks of catastrophic escalation. This context demands careful assessment of where finite resources can achieve the greatest impact in preventing human suffering from conflict, both in fragile states today and against potential large-scale future catastrophes.*"  
  *   **Why Amendment?** This:  
      1.  Acknowledges the *specific* evidence (post-1945 battle deaths per capita) without overstating its scope or certainty.  
      2.  Incorporates the valid concerns about what is *not* measured by that statistic (displacement, complex conflicts, non-lethal harm).  
      3.  Explicitly notes the uncertainty around catastrophic events ("persistent risks").  
      4.  Shifts the justification for strategic review away from a potentially flawed premise about *past trends proving future irrelevance* towards a more robust discussion about *resource allocation for maximal impact* given the *current and future landscape* of risk.

  **4. Implications for Programmes & Strategic Direction**

  *   **Existing Programmes (Sahel/Balkans):** **Do not commit to winding down within three years.** These programmes address tangible, ongoing conflict dynamics and human suffering in our core regions. Their marginal return should be assessed based on their *specific impact and local context*, not a contested global trend. A sudden wind-down risks abandoning partners and communities mid-stream, potentially increasing instability.  
  *   **Strategic Pivot:** The Chair's underlying concern – exploring long-run catastrophic risk – warrants serious consideration, *but not as a zero-sum replacement*.  
      *   **Proposed Path:** Initiate a **time-bound (18-24 month) strategic exploration phase** alongside continuing current programmes. This phase should:  
          *   Fund a rigorous, independent assessment of catastrophic risk relevance to our mission, size, and capabilities.  
          *   Identify specific, actionable catastrophic risk mitigation opportunities that align with our strengths (e.g., local monitoring networks repurposed for specific biological/ecological early warnings? Facilitation for AI governance dialogues in fragile states?).  
          *   Develop clear criteria for potential future investment, including evidence of leverage, feasibility, and distinct value-add compared to larger players.  
          *   Be funded from new contributions, a modest percentage of returns, or temporary administrative savings – *not* core programme budgets.  
  *   **Outcome:** This allows responsible investigation of the Chair's vision without prematurely sacrificing proven impact. A decision on significant reallocation would follow the exploration phase, based on concrete findings.

  **5. Criteria for Revisiting Strategy in Five Years**

  Regardless of Thursday's vote, the Board should formally agree to review the strategic direction and resource allocation in **five years** (Q4 2028), triggered by evidence including:

  1.  **Trends in Core Metrics:** Significant, sustained reversal (upward or downward) in relevant conflict indicators (battle deaths, displacement, conflict incidence) *in our operational regions* (Sahel/Balkans) and *globally*.  
  2.  **Catastrophic Risk Near-Misses/Materialization:** Occurrence of major events (or near-misses with high confidence) related to postulated catastrophic risks (e.g., major bio-event, severe AI governance failure, climate-driven mass conflict).  
  3.  **Evidence of Programme Effectiveness:** Robust evaluations demonstrating significantly changing marginal impact or cost-effectiveness of our *specific* current programmes versus potential catastrophic risk initiatives explored/launched.  
  4.  **Funding Landscape:** Major shifts in donor priorities or funding availability for either conventional peacebuilding or catastrophic risk mitigation affecting our ability to operate.  

  **Bottom Line:**

  *   **Sentence:** **Remove the current sentence** asserting a centuries-long, steep decline in violence as settled fact justifying reduced marginal returns. **Replace it with the amended, nuanced framing** above.  
  *   **Programmes:** **Do not wind down existing Sahel/Balkans programmes** based on this contested premise. Continue them with ongoing rigorous impact assessment.  
  *   **Strategy:** **Approve a time-bound strategic exploration phase (18-24 months)** for catastrophic risk mitigation, funded without cannibalizing core programmes. Require a concrete proposal from this phase before any major reallocation.  
  *   **Review:** **Formally commit** to a strategic review in five years (Q4 2028) based on the specific criteria outlined above.

  This approach respects the Chair's desire to explore a consequential new direction while upholding intellectual rigour regarding the empirical claims, protecting vital ongoing work, and ensuring any future pivot is based on evidence and careful analysis specific to our trust's capabilities and mission.
