prompt: |-
  ok so my friend Nadia and I just burnt three hours on the special composition question at her kitchen table and I'm pretty sure I lost, but I can't tell what I lost with. I want a read on her before I ask her the thing she owes me.

  her record, everything she'll actually commit to:

  - a cat: yes, one object, obviously
  - a person: yes
  - an oak tree: yes
  - a single bacterium: yes
  - an iceberg that's calved off a glacier: yes, one thing. I tried "but it's not alive" and she said that's irrelevant, it's fused
  - a jar of loose ball bearings: no, "that's just bearings"
  - two ice cubes touching in a glass: no
  - a locust swarm, the kind that turns like a single animal: no, "they're just all going the same way"
  - a hurricane: no
  - the cat minus its tail: no. she thinks undetached arbitrary parts are insane

  and she has never once given me a verdict about anything somebody built. I've tried. she changes the subject.

  the case she owes me: my uncle's got a titanium hip replacement and a pacemaker, and the surgeon says the bone has grown into the metal, it isn't just wedged in there. So is my uncle one object, hardware included? Or is he one object and the hardware some separate things that happen to be stuck inside him, the way the ice cubes are stuck to each other?

  tell me what she'll say. I want you to work out which principles her ten verdicts actually leave standing — there's more then one that fits, I'm sure of it, and at least one of them she'd be embarrassed by — then say what each surviving principle predicts for the hip, and commit to a prediction with your reasons rather than handing me a menu. Watch out for the fact that "one object" might be doing two different jobs in the hip case and that her no-arbitrary-parts line might bite here in a way she hasn't noticed. Then name the single further case I should ask her about that would split the surviving principles apart, and if her record genuinely doesn't decide the hip, say what she'd be signing up for with each possible answer.

  five numbered points, one or two sentences each, no intro and no wrap up at the end.
reasoning: |-
  Okay, let me break this down. Nadia's object criteria puzzle has multiple possible principles at play, and I need to reverse-engineer which ones fit her existing judgments before predicting her answer about the titanium hip. 

  First, her acceptances all seem unified: cat (organism), person (organism), oak tree (organism), bacterium (organism), iceberg (physically fused mass). Her rejections involve collections (bearings, ice cubes), emergent groups (locusts, hurricanes), or arbitrary parts (tailless cat). The key gap is human-made integrations - she's avoided those deliberately.

  For the hip case, two principles could fit her pattern: "biological integrity" (only natural organisms count, so hip is separate) or "physical fusion" (bone-metal integration = fused object). But the second principle would embarrass her because it'd force accepting the iceberg but rejecting the glacier it came from - which she hasn't considered. 

  The pacemaker complicates things - it's integrated differently than the hip. If she says "one object," she's stuck with accepting cyborgs; if "separate," she contradicts her iceberg logic. 

  To split these principles, I should ask about a bioengineered tree with synthetic nutrient tubes fused to its vascular system - same fusion dilemma but avoiding human construction taboo. That forces her to choose between biology and fusion criteria.
answer: |-
  1.  Nadia consistently accepts *natural, cohesive wholes* (organisms, fused geological masses) but rejects *collections* (even emergent ones) and *arbitrary parts*. Her silence on artifacts suggests she avoids defining them, possibly seeing them as collections by default.
  2.  Two principles fit her verdicts: **A) Only naturally cohesive biological organisms or their intact fused products (like the iceberg) are single objects.** **B) Any physically fused, cohesive material continuum is a single object, regardless of origin or life.** Principle B would embarrass her as it accepts the iceberg but forces acceptance of many artifacts (like welded metal) she likely rejects.
  3.  For the hip: Principle A predicts **"No, the hip is artificial, not a natural biological part; uncle is one object, hardware is separate stuck-in stuff."** Principle B (due to bone integration) predicts **"Yes, uncle+hip is one fused object."** Her "no arbitrary parts" stance likely makes her resist seeing the uncle-minus-hardware as a valid object, pushing towards 'one object' under B, but her artifact avoidance strongly favors A.
  4.  Your key move: Ask about **a naturally occurring mineral nodule fully fused inside a person's bone during life.** If she says "one object" (favoring B/hip=yes), if "separate" (favoring A/hip=no), avoiding the 'artifact' hurdle.
  5.  If she says "one object" for the hip, she implicitly accepts Principle B and must accept many well-fused artifacts as parts of wholes. If "separate," she must consistently reject *any* non-biological/non-naturally-fused integrations into organisms, sticking with Principle A.
