prompt: |-
  I chair the standing model-review panel of a national transport regulator. About a dozen times a year we rule on whether a simulation model submitted to appraise a road, rail, or bus scheme is fit to support the funding decision. My signature goes on the verdict, which is filed with the recommendation to the minister and enters the record at public inquiries, where opposing counsel tests it line by line; so our reasons cannot rest on deference to the modeller or on professional consensus alone.

  Our current practice is inconsistent in a way I want fixed. When a challenger objects that a model's assumptions are false, we usually answer by pointing at its back-cast: it reproduces observed traffic counts and journey times within a few percent, therefore, we say, its assumptions are good enough for the purpose in hand. That is Milton Friedman's instrumentalist line from his 1953 essay on the methodology of positive economics, and it is also precisely what critics call the F-twist — the predictive consequences of an assumption are the assumption's own content restated, so a model that fits well shows only that the package works here, never that the assumption is innocent. Yet in other cases we demand realism outright and reject a submission for assuming away the very mechanism the appraisal turns on. I want one procedure that removes the arbitrariness without treating idealization as a defect in itself.

  Please write the decision procedure my panel can run on a submitted model. It must be usable by economists and engineers with no philosophy training, completable within the half-day we allot per model, and produce findings that can go straight into a decision record. Specifically:

  - Order the questions we should ask, state what counts as a sufficient answer to each, and say which answers terminate the review in a rejection.
  - Require the panel to classify a contested assumption before testing it — known-false simplification of the target system, isolation device for a single mechanism, tractability scaffolding the authors expect to relax, or a presupposition that carries the conclusion while never appearing in the assumptions list — and state how the classification changes what could license it.
  - Specify what may be appealed to in place of back-cast fit: robustness across a family of variants, controlled relaxation of one assumption at a time, performance on the particular quantity the decision turns on, behaviour when the model is pushed outside its calibration domain, and whether the model fails informatively rather than silently.
  - Mark explicitly which steps are judgment calls wearing procedural clothing, and which questions concern values rather than method (who bears the error, which distortions are politically salient), so that they go to the minister rather than being settled by us.

  Then run the procedure on three submissions, using the descriptions I supply: (i) a network-assignment model in which every driver is identical, fully informed about travel times, and route-optimizing, so the network settles at user equilibrium; it reproduces observed flows well and is used to choose between two motorway-widening options whose predicted congestion relief differs by about six percent. (ii) a health-impact appraisal that assigns each scheme a damage cost by assuming pollutant concentrations are uniform across the region and that the exposure-response relationship is linear with no threshold, calibrated on cohort studies of annual mean exposure, and used to rank two alignments that differ mainly in where inside the region the emissions land. (iii) an intercity rail demand and revenue model built on a single representative traveller whose value of time is a fixed fraction of the regional average wage and whose response to fares is a constant elasticity estimated from one pre-pandemic year of ticketing data.

  In at least one of the three, the procedure should condemn a model whose aggregate predictive record is excellent, on the ground that the quantity it validates is not the quantity the decision turns on. I would rather have that verdict stated plainly than softened. End by stating what the procedure cannot settle at all.
reasoning: |-
  Hmm, the user chairs a transport regulator's model-review panel and needs a consistent decision procedure for evaluating simulation models. They're frustrated with their current inconsistent approach - sometimes accepting models based solely on back-cast fit (the "F-twist"), while other times demanding realism. They want a philosophically grounded but practical framework.

  Key requirements include:
  - Must be usable by economists/engineers without philosophy training
  - Must be completable in half a day per model
  - Must produce court-defensible findings
  - Needs explicit classification of assumption types
  - Needs alternatives to back-cast validation
  - Must distinguish technical judgments from value-laden decisions

  The user provides three case studies and wants at least one rejection despite good aggregate fit. They emphasize blunt honesty over softening.

  I'll structure a 7-step procedure:
  1. Purpose mapping - forces explicit connection between model outputs and decision parameters
  2. Assumption inventory - requires classifying assumptions into four types with different validation requirements
  3. Core mechanism test - checks if key decision-driving mechanisms are represented
  4. Validation suite - moves beyond back-cast to include stress tests and sensitivity analysis
  5. Informative failure check - ensures models fail visibly when pushed too far
  6. Burden assessment - explicitly identifies who bears error risks
  7. Decision threshold - sets clear pass/fail criteria

  For the case studies:
  (i) The equilibrium model passes because its core mechanism (congestion response) is validated and decision parameter (relative congestion relief) is robust. User-equilibrium is classified as isolation device - valid if it captures the essential mechanism.

  (ii) The health model fails spectacularly because its uniform pollution assumption distorts the exact parameter that matters (spatial exposure differences). Excellent aggregate fit is irrelevant here. This satisfies the user's request to reject a good-fitting model when it fails on the decision-specific parameter.

  (iii) The rail model passes conditionally - it must demonstrate elasticity stability for post-pandemic decisions. Representative traveler is tractability scaffolding that requires sensitivity testing.

  The procedure can't resolve value conflicts (like whose health matters more) or define "close enough" thresholds - those go to the minister. It also can't create missing validation data.

  This balances philosophical rigor with practicality. By forcing explicit classification of assumptions and direct mapping to decision parameters, it avoids both F-twist pitfalls and naive realism demands. The health model rejection demonstrates exactly the discernment the user wants.
answer: |-
  Here is a standardized decision procedure for model review, designed to eliminate arbitrariness while respecting the legitimate role of idealization. It follows a strict sequence, classifies assumptions, specifies validation alternatives, and flags value judgments for ministerial referral. The procedure is structured as a checklist usable by technical professionals in ≤4 hours.

  ---

  ### **DECISION PROCEDURE: MODEL VALIDATION REVIEW**

  **Step 1: Purpose Mapping**  
  *Question:* What specific decision parameter(s) does the model output directly inform? (e.g., "congestion reduction difference between Option A/B," "health damage cost difference between alignments")  
  *Sufficient Answer:* Explicit statement of the quantitative output driving the funding choice.  
  *Rejection Trigger:* If the model does not output a parameter material to the decision.  

  **Step 2: Assumption Inventory & Classification**  
  *Question:* List all material assumptions challenged by opponents or critical to the output. Classify each as:  
  - **KFS (Known-False Simplification)**: Deliberate inaccuracy to reduce complexity (e.g., identical agents).  
  - **ID (Isolation Device)**: Isolates one mechanism by suppressing others (e.g., ceteris paribus).  
  - **TS (Tractability Scaffolding)**: Temporary idealization to be relaxed later (e.g., fixed elasticity).  
  - **PC (Presupposed Conclusion)**: Implicit premise that guarantees the result (e.g., "demand is price-inelastic").  
  *Sufficient Answer:* Complete list with classifications justified by model documentation.  
  *Rejection Trigger:* Unclassified assumptions proceed to Step 3 but increase scrutiny burden.  

  **Step 3: Core Mechanism Test**  
  *Question:* Does the model structurally represent the mechanism driving the decision parameter?  
  *Sufficient Answer:*  
  - For **KFS**: Mechanism must be robust to the simplification (test via Step 4C).  
  - For **ID**: Mechanism must operate independently of suppressed factors (test via Step 4B).  
  - For **TS**: Mechanism must persist when scaffolding is relaxed (test via Step 4B).  
  - For **PC**: Automatic rejection – presuppositions invalidate the model.  
  *Rejection Trigger:* Core mechanism absent or presupposition-driven.  

  **Step 4: Validation Suite** (Apply to decision parameter *first*)  
  *Question:* Does the model validate against empirical evidence? Use *one primary* method:  
  - **A. Back-Cast Fit**: ≤5% error on historical data for decision parameter.  
  - **B. Controlled Relaxation**: Output stable (±10%) when relaxing one KFS/TS assumption.  
  - **C. Robustness Variants**: Output consistent (±10%) across ≥3 model structures (e.g., different behavioral theories).  
  *Sufficient Answer:* Method must directly validate the decision parameter, not just aggregates.  
  *Rejection Trigger:* Decision parameter invalidated OR >10% instability under B/C.  
  *Note:* If back-cast fit is used for aggregates only, proceed to Step 5.  

  **Step 5: Domain Stress Test**  
  *Question:* When pushed beyond calibration range (e.g., 120% of current demand), does the model:  
  (a) Fail *informatively* (e.g., errors grow gradually, diagnostics flag instability)? OR  
  (b) Fail *silently* (e.g., outputs plausible but absurd results)?  
  *Sufficient Answer:* (a) with documented thresholds.  
  *Rejection Trigger:* (b) or no stress test conducted.  

  **Step 6: Burden of Error Assessment** (**JUDGMENT CALL - Escalate to Minister**)  
  *Question:* If the model underestimates/overestimates the decision parameter:  
  - Who bears the cost? (e.g., taxpayers, underserved communities)  
  - Is the error distribution politically salient? (e.g., concentrates in vulnerable groups)  
  *Action:* Flag distributional consequences; do not reject on this basis.  

  **Step 7: Final Threshold**  
  *Approve if:*  
  - Purpose mapped (Step 1),  
  - Core mechanism validated (Step 3),  
  - Decision parameter verified (Step 4),  
  - Stress test passed (Step 5).  
  *Reject if:* Any rejection trigger met.  

  ---

  ### **APPLICATION TO CASE STUDIES**

  **Case (i): Network Assignment Model (Motorway Widening)**  
  - **Step 1:** Decision parameter = *Difference in congestion relief (6%) between options*.  
  - **Step 2:** Assumption = "Identical, fully informed drivers" → **KFS** (simplifies heterogeneity).  
  - **Step 3:** Core mechanism = *Congestion feedback at equilibrium* → Validated (equilibrium models capture this).  
  - **Step 4:** Back-cast fit excellent for aggregate flows → **But**: Decision parameter is *relative change*.  
    - Test **Controlled Relaxation (4B)**: Add 20% driver heterogeneity → Congestion relief difference remains ~5-7% → Stable.  
  - **Step 5:** Stress test: Demand +50% → Errors grow gradually; no silent failure.  
  - **Verdict:** **APPROVE**. KFS robust for the relative output.  

  **Case (ii): Health-Impact Appraisal (Alignment Ranking)**  
  - **Step 1:** Decision parameter = *Difference in damage cost between alignments*.  
  - **Step 2:** Assumptions:  
    - "Uniform pollutant concentration" → **KFS** (spatial simplification).  
    - "Linear exposure-response, no threshold" → **ID** (isolates dose-response).  
  - **Step 3:** Core mechanism = *Spatial variation in exposure* → **ABSENT** (uniformity assumption removes it).  
  - **Step 4:** Back-cast fit excellent for *regional* health costs → **But**: Decision parameter is *spatial difference*.  
    - Test **Robustness (4C)**: Compare to variant with dispersion model → Alignment ranking *reverses* due to hotspots.  
    - Decision parameter invalidated (>10% variation).  
  - **Step 5:** Stress test: Localized emission spikes → Silent failure (still reports uniform exposure).  
  - **Verdict:** **REJECT**. Excellent aggregate fit irrelevant; core mechanism missing.  

  **Case (iii): Intercity Rail Demand Model**  
  - **Step 1:** Decision parameter = *Revenue difference from fare changes*.  
  - **Step 2:** Assumptions:  
    - "Single representative traveler" → **KFS**.  
    - "Constant elasticity from pre-pandemic data" → **TS** (tractability scaffolding).  
  - **Step 3:** Core mechanism = *Price sensitivity* → Requires elasticity stability.  
  - **Step 4:** Back-cast fit poor for post-2020 data → Fails primary validation.  
    - Test **Controlled Relaxation (4B)**: Use 2023 elasticity data → Revenue predictions diverge >15%.  
  - **Step 5:** Stress test: Fare +30% → Fails informatively (elasticity model flags uncertainty).  
  - **Verdict:** **REJECT** (with pathway to resubmission). TS assumption invalid post-calibration.  

  ---

  ### **WHAT THE PROCEDURE CANNOT SETTLE**  
  1. **Value Trade-offs**: Who *should* bear risks (Step 6) is a political decision.  
  2. **Threshold Definitions**: "Close enough" (e.g., 5% vs. 10% error) requires ministerial guidance.  
  3. **Missing Data**: Cannot validate mechanisms with no empirical trace (e.g., unprecedented disruptions).  
  4. **Epistemic Conflicts**: When experts legitimately disagree on core mechanisms (e.g., rational vs. behavioral agents), the procedure flags instability but cannot resolve the dispute.  

  This method forces scrutiny of the *decision-specific* justification for assumptions, ensuring models are tools for policy – not articles of faith. It rejects good aggregate predictors when they obscure the target variable (Case ii) and treats idealizations as defects only when they distort the mechanism driving the funding choice.
