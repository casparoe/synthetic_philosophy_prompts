prompt: |-
  I teach a second-year seminar on law and political morality — 18 students, one 100 minute session, no prep reading. They'll have had one lecture giving the bare outline of the postwar tribunals and nothing more. Design an in-class structured deliberation that makes them feel the difference between two complaints that always get fused together under the label victors' justice: that the charges were retroactive, and that the court was staffed, funded and framed by one side only. I want them to notice you can grant the first and still press the second, and the reverse too — and I want them to hit the queasy part, which is that the no-crime-without-law principle is something they'll want to invoke on behalf of people they think deserve punishment most, and they'll feel the pull to carve an exception for exactly those people.

  Setup requirements. Use an invented war between two invented coalitions, not the real 1939–45 one, so nobody's recall of history is being tested and the case does the work. I'd like a drafting phase where the losing side's delegates get to write exactly one article of the tribunal's charter and the winners are bound to accept it, then a sealed-envelope reveal partway through containing the winning coalition's own conduct — you invent the contents, something along the lines of a sustained bombing campaign against cities, a merchant-shipping campaign, and a decree passed after the acts it's meant to cover. Finish with a neutral panel of students who held no other role deciding whether the convictions stand up; that's the only stakes I want, no points or money.

  Give me: role sheets and how many of each, the one-page charter template with the blank articles, a minute-by-minute timeline, the debrief questions in the order I should ask them (name the technical terms only there, not before), what will predictably go wrong the first time I run this and how to handle it, and an honest paragraph on which feature of the real problem the activity can't reproduce and that I'll have to supply myself. No reading list or bibliography. And if you do gesture at the actual tribunals anywhere in the debrief, keep it to what your confident about and flag the rest as uncertain.
reasoning: |-
  We are designing a structured deliberation for a seminar on law and political morality. The goal is to separate two common complaints about victors' justice: retroactive charges and one-sided court structure. We want students to see that one can accept one complaint while rejecting the other, and to feel the tension in applying the principle of non-retroactivity to those they believe deserve punishment.

  Key elements:
  - Invented war between two coalitions: let's call them the "Alliance of Free Nations" (AFN) and the "Coalition for Mutual Prosperity" (CMP).
  - Losing side (CMP) gets to draft one article of the tribunal's charter, which the winners (AFN) must accept.
  - A sealed envelope reveals the winning coalition's own conduct (e.g., bombing cities, merchant-shipping campaign, retroactive decree).
  - A neutral panel (students without roles) decides if convictions stand.

  Role Sheets (for 18 students):
  1. AFN Delegates (Winners): 6 students. They are setting up the tribunal and must accept the one article drafted by the losers. They will also have to defend their own conduct when revealed.
  2. CMP Delegates (Losers): 6 students. They are the defeated side and get to write exactly one article of the tribunal's charter. They will also face charges but can point to the winners' conduct when revealed.
  3. Neutral Panel: 6 students. They do not participate in the drafting or deliberation until the end, when they decide whether the convictions (based on the charter) stand.

  Charter Template (one page with blank articles):
  The charter will have several articles, but only one (Article X) will be drafted by the CMP. The rest are pre-filled by the instructor to set up the tribunal. We leave one article blank for the CMP to fill.

  Pre-filled charter (for the AFN to present, with one blank article for the CMP to fill):

  **Charter of the International Tribunal for the War in Atlantica**

  **Preamble:** The victorious Alliance of Free Nations (AFN) establishes this tribunal to try individuals from the defeated Coalition for Mutual Prosperity (CMP) for crimes committed during the Atlantica War (20XX-20XX). The tribunal is established in the interest of justice and peace.

  **Article 1: Jurisdiction**
  The Tribunal shall have the power to try and punish persons who, acting in the interests of the CMP, committed crimes against peace, war crimes, and crimes against humanity.

  **Article 2: Crimes Against Peace**
  Planning, preparation, initiation, or waging of a war of aggression.

  **Article 3: War Crimes**
  Violations of the laws and customs of war, including murder, ill-treatment of civilians, deportation, plunder, destruction of cities not justified by military necessity.

  **Article 4: Crimes Against Humanity**
  Inhumane acts committed against civilian populations, before or during the war, including murder, extermination, enslavement, deportation, and other inhumane acts.

  **Article 5: Individual Responsibility**
  Official position shall not free a person from responsibility.

  **Article 6: [TO BE DRAFTED BY CMP DELEGATES]**

  **Article 7: Procedure**
  The Tribunal shall have the power to summon witnesses, require evidence, and conduct trials. The rules of evidence shall be those of international law as recognized by the Tribunal.

  **Article 8: Judgment and Sentence**
  The Tribunal shall have the right to impose upon a convicted person death or such other punishment as shall be determined to be just.

  **Article 9: Establishment**
  The Tribunal is established by the AFN and shall consist of four judges appointed by the AFN.

  Note: The AFN must accept whatever the CMP writes for Article 6.

  Sealed Envelope Contents (revealed later):
  - The AFN conducted a sustained bombing campaign against CMP cities, causing massive civilian casualties (similar to the firebombing of Dresden or Tokyo).
  - The AFN engaged in unrestricted submarine warfare, sinking merchant ships without warning, leading to civilian deaths.
  - The AFN passed a decree after the war criminalizing certain acts that had been committed by CMP leaders during the war (retroactive law).

  Timeline (100 minutes total):

  1. **Introduction (5 minutes):**
     - Explain the setup: invented war, two coalitions, tribunal charter. Assign roles: 6 AFN, 6 CMP, 6 neutral panel. The neutral panel is to remain silent until the deliberation phase.

  2. **Charter Drafting (15 minutes):**
     - The CMP delegates (losers) are given 15 minutes to draft Article 6. They must write one article only. They can choose any topic they want (e.g., definition of a crime, procedural safeguard, jurisdiction limitation, etc.). They must write it on a provided card or sheet.
     - The AFN delegates are instructed that they must accept whatever Article 6 the CMP writes without amendment.

  3. **Charter Finalization (5 minutes):**
     - The instructor collects the drafted Article 6 and inserts it into the charter. The charter is now complete. Distribute the complete charter to all students.

  4. **Initial Deliberation (15 minutes):**
     - The AFN and CMP delegates discuss the charter and the upcoming tribunal. The AFN delegates are preparing to bring charges against the CMP. The CMP delegates are preparing a defense. The neutral panel listens but does not speak.

  5. **Sealed Envelope Reveal (10 minutes):**
     - The instructor reveals the contents of the sealed envelope: the AFN's own conduct during the war (bombing cities, merchant-shipping campaign, retroactive decree). Distribute a written summary to all.

  6. **Reaction and Defense (20 minutes):**
     - The AFN and CMP delegates discuss the implications of the revealed conduct. The CMP delegates can now argue that the AFN's conduct was also criminal. The AFN must defend their actions. The neutral panel still listens.

  7. **Neutral Panel Deliberation (20 minutes):**
     - The neutral panel is given the floor. They must decide whether the convictions (if there were any) under the tribunal's charter would stand up. They should consider:
       - The fairness of the tribunal (one-sidedness).
       - The retroactivity of the laws (if any).
       - The implications of the AFN's own conduct (should it affect the legitimacy?).
     - The panel can ask questions to both sides (5 minutes of Q&A within this time) and then deliberate among themselves.

  8. **Panel Announcement (5 minutes):**
     - The neutral panel announces their decision and brief reasons.

  9. **Debrief (10 minutes):**
     - The instructor leads a discussion with the whole class using the following questions:

  Debrief Questions (in order):

  1. "What was the main complaint the CMP had about the tribunal? How did they try to address it in Article 6?"
     - (This should surface the two complaints: retroactivity and one-sidedness. They might have used Article 6 to address one or both.)

  2. "When the sealed envelope was opened, what new issues arose? How did the AFN's conduct affect the legitimacy of the tribunal in your view?"

  3. "Did the tribunal avoid the problem of retroactivity? Why or why not? And did it avoid the problem of one-sidedness? Why or why not?"
     - (Here, introduce the technical terms: *ex post facto* laws for retroactivity, and impartiality for one-sidedness.)

  4. "Did anyone feel a tension between wanting to punish what you thought were clear wrongs and the principle that there should be no crime without a pre-existing law (nullum crimen sine lege)? When did that tension arise most strongly?"

  5. "How did the drafting of Article 6 by the losers affect the tribunal? Was it enough to address the concerns?"

  6. "In the real Nuremberg and Tokyo tribunals, both complaints (retroactivity and one-sidedness) were raised. We know that the principle of non-retroactivity is now enshrined in many legal systems, but do you think the one-sidedness of the tribunal is a separate issue? Can one exist without the other?"

  7. "What do you think is the most queasy or uncomfortable part of this exercise? Why?"

  What might go wrong:
  - **Time management:** The drafting and discussions might run over. Have strict timekeeping and use a timer. Cut off discussions if needed.
  - **Neutral panel disengagement:** They might feel left out until their turn. Emphasize they must listen carefully and take notes during the first phases.
  - **CMP drafting an irrelevant article:** They might write something off-topic. The instructor can gently remind them of the context and that they are trying to protect their side from unfair prosecution. But let them write what they want.
  - **AFN delegates being too defensive:** They might dominate the discussion. Encourage the instructor to moderate and ensure CMP gets to speak.
  - **Lack of depth in neutral panel deliberation:** They might rush to a decision. Provide them with a structured set of questions to consider (as above) and encourage them to take 20 minutes seriously.

  What the activity can't reproduce:
  "This activity simplifies the historical context and the gravity of the real post-WWII tribunals. The moral weight of the Holocaust and other atrocities, the unprecedented nature of the crimes, and the political necessity felt by the Allies to establish a new legal order are hard to capture in a simulation. Also, in reality, the defeated powers were not given a say in drafting the tribunal's charter. The activity might not fully convey the emotional and historical complexity that made the victors feel justified in setting aside strict legality for the sake of justice. You'll need to bridge that gap by contextualizing the simulation within the broader historical and moral landscape in your debrief."

  Note on real tribunals in debrief:
  If you mention the actual tribunals, stick to well-established facts: 
  - The Nuremberg Charter defined crimes against peace, war crimes, and crimes against humanity. 
  - The defense did raise the issue of retroactivity (ex post facto laws). 
  - The tribunal was established by the victorious Allied powers and consisted only of judges from those nations. 
  - The Tokyo Tribunal had similar features. 
  - Avoid speculative or contested historical interpretations.

  This design should meet the requirements and achieve the learning objectives.
answer: |-
  ### Structured Deliberation: "The Atlantica Tribunal"  
  **Invented Conflict:** The **Alliance of Free Nations (AFN)** vs. the **Coalition for Mutual Prosperity (CMP)** fought the **Atlantica War** (2020–2024). The AFN won.  
  **Core Tension:** Separating complaints about **retroactive charges** (*ex post facto* laws) and **one-sided courts** (impartiality).  

  ---

  ### **Role Sheets (18 Students)**  
  1. **AFN Delegates (Winners):** 6 students.  
     - *Goal:* Establish a tribunal to prosecute CMP leaders. Must accept the CMP’s drafted article.  
     - *Secret Knowledge:* You ordered city bombings and unrestricted submarine warfare during the war.  
     - *Talking Points:* "Justice demands accountability for atrocities. The tribunal is fair because we accepted the losers’ input."  

  2. **CMP Delegates (Losers):** 6 students.  
     - *Goal:* Avoid unfair prosecution. Draft **one article** for the tribunal charter to protect your side.  
     - *Secret Knowledge:* AFN committed similar atrocities (revealed later).  
     - *Talking Points:* "This court is biased. We had no choice but to defend our sovereignty."  

  3. **Neutral Panel:** 6 students.  
     - *Goal:* Decide if convictions stand after deliberation. No other role. Take notes during discussions.  
     - *Rules:* No speaking until Phase 4. Base judgment **only** on the charter and evidence.  

  ---

  ### **Tribunal Charter Template (One Page)**  
  **Charter of the Atlantica War Crimes Tribunal**  
  *Established by the Alliance of Free Nations (AFN)*  

  **Article 1: Jurisdiction**  
  The Tribunal may prosecute CMP leaders for acts committed during the Atlantica War (2020–2024).  

  **Article 2: Crimes**  
  (a) **Crimes Against Peace:** Waging aggressive war.  
  (b) **War Crimes:** Violating laws of war (e.g., targeting civilians, torture).  
  (c) **Atrocity Crimes:** Systematic violence against civilian populations.  

  **Article 3: Judges**  
  Four judges appointed by the AFN.  

  **Article 4: Evidence**  
  Testimony, documents, and expert analysis are admissible.  

  **Article 5: Penalties**  
  Maximum sentence: Life imprisonment.  

  **Article 6: [BLANK – TO BE DRAFTED BY CMP DELEGATES]**  
  *(CMP writes ONE article here. AFN must accept it.)*  

  **Article 7: Retroactivity**  
  Charges may be brought for acts not illegal under CMP law at the time committed.  

  ---

  ### **Timeline (100 Minutes Total)**  
  **Phase 1: Setup (10 mins)**  
  - 00:00: Introduce the Atlantica War. Assign roles (AFN: 6, CMP: 6, Neutral Panel: 6).  
  - 00:05: Distribute role sheets and charter template. Explain:  
    - CMP drafts **Article 6** (10 mins). AFN **must** accept it.  
    - Neutral Panel takes notes but stays silent.  

  **Phase 2: Drafting & Charter Finalization (15 mins)**  
  - 00:10: **CMP Delegates** draft Article 6 (10 mins). *Instructor tip:* Push them to focus on retroactivity or impartiality (e.g., "No ex post facto charges" or "Neutral judges").  
  - 00:20: **AFN Delegates** review the charter with CMP’s Article 6 inserted (5 mins). AFN may react but cannot amend it.  

  **Phase 3: Initial Deliberation (15 mins)**  
  - 00:25: **AFN argues for prosecuting CMP** (e.g., "CMP invaded neutral countries").  
  - 00:30: **CMP defends itself** (e.g., "AFN provoked us; tribunal is biased").  
  - *Instructor:* Moderate to ensure both sides speak. Neutral Panel listens/takes notes.  

  **Phase 4: Sealed Envelope Reveal (10 mins)**  
  - 00:40: **Reveal AFN’s conduct** (contents below). Distribute to all students.  
    > **AFN’s Wartime Conduct:**  
    > - **Operation Firestorm:** AFN bombed CMP cities (50,000 civilians killed).  
    > - **Wolfpack Directive:** AFN sank neutral merchant ships carrying food to CMP.  
    > - **Decree 144:** Passed *after* the war, criminalizing "economic aggression" (CMP’s pre-war trade sanctions).  
  - 00:45: **Open discussion:** CMP/AFN debate implications.  

  **Phase 5: Neutral Panel Deliberation (30 mins)**  
  - 00:50: **Neutral Panel questions both sides** (10 mins). Sample Qs:  
    - "Does Article 6 address your concerns about fairness?"  
    - "Should AFN’s conduct affect the tribunal’s legitimacy?"  
  - 01:00: **Panel privately deliberates** (15 mins). They must answer:  
    > "Can convictions under this charter stand? Why/why not?"  
  - 01:15: **Panel announces verdict** (5 mins).  

  **Phase 6: Debrief (20 mins)**  
  - 01:20: Instructor-led discussion using questions below.  

  ---

  ### **Debrief Questions (Order Matters – Introduce Terms Here)**  
  1. **"What did the CMP try to achieve with Article 6?"**  
     *(Surface motives: e.g., blocking retroactive charges or demanding neutral judges.)*  
  2. **"When AFN’s conduct was revealed, how did it affect arguments about the tribunal?"**  
     *(Highlight: One-sidedness [impartiality] vs. retroactivity [ex post facto laws].)*  
  3. **"Could the tribunal be *biased* (one-sided) even if charges weren’t retroactive? Could charges be *retroactive* even if the court was neutral?"**  
     *(Force separation of the two complaints. Use terms: **ex post facto laws** and **impartiality**.)*  
  4. **"When did you feel torn between punishing clear wrongs and the rule ‘no crime without pre-existing law’ (nullum crimen sine lege)?"**  
     *(Target the "queasy" tension: e.g., "CMP deserved punishment, but retroactivity felt wrong.")*  
  5. **"Did anyone want to exempt ‘deserving’ offenders from nullum crimen? Why?"**  
     *(Connect to real-world moral dilemmas.)*  
  6. **"In real postwar tribunals, both complaints arose. Nuremberg’s judges addressed retroactivity by citing ‘natural law’ (arguing some acts are inherently criminal). But could that solve one-sidedness?"**  
     *(Flag uncertainty: "Historians debate if Tokyo was more biased than Nuremberg.")*  
  7. **"What’s harder to fix: retroactivity or bias? Why?"**  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** CMP drafts a vague/off-topic Article 6 (e.g., "Trials must be fair").  
     **Fix:** Pre-empt by urging CMP to focus on retroactivity or impartiality. Have backup examples (e.g., "Judges from neutral nations").  
  2. **Problem:** AFN dominates discussion; CMP disengages.  
     **Fix:** Assign a "spokesperson" per group. Use a talking stick.  
  3. **Problem:** Neutral Panel struggles with abstract deliberation.  
     **Fix:** Give them a checklist: "Consider (a) Charter fairness, (b) AFN’s conduct, (c) Article 6."  
  4. **Problem:** Students conflate the two complaints.  
     **Fix:** In debrief, contrast examples: "Retroactivity = prosecuting for acts legal at the time. Bias = only one side’s judges/funders."  
  5. **Problem:** Time runs short in Phase 5.  
     **Fix:** Trim Panel Q&A to 5 mins if needed. Prioritize verdict announcement.  

  ---

  ### **What the Activity Can’t Reproduce**  
  "This simulation can’t capture the **existential stakes** of real postwar tribunals. At Nuremberg, the Allies confronted genocide—crimes so horrific they shattered legal paradigms. That moral urgency made retroactivity feel necessary, even if logically shaky. Here, invented atrocities lack emotional weight, so students may miss why victors ‘bent’ principles. You’ll need to contextualize this: Explain that real trials balanced justice, politics, and the need to rebuild a broken world, where abstract ideals clashed with the visceral demand for accountability."  

  ---  
  **No prep needed. Use this as a self-contained module.**  
  **For real tribunals in debrief:** Only reference uncontroversial facts (e.g., "Nuremberg charged ex post facto crimes; judges were Allied appointees"). Flag speculation (e.g., "Whether Tokyo was *more* biased is debated").
