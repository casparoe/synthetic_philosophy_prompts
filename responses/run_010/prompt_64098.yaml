answer: |-
  ## Research Proposal: Rationality's Split in Parfit's Hitchhiker

  **Core Research Question:** Does Parfit's Hitchhiker case necessitate distinct conceptions of rationality ("global cultivation rationality" vs. "local action rationality") to simultaneously satisfy its dual roles in (1) justifying the rationality of paying the driver (within sophisticated decision theories like TDT/FDT) and (2) illustrating Parfit's concept of "rational irrationality" (where cultivating a disposition is rational, but the act it produces is locally irrational)?

  **The Tension:** The case functions in two distinct ways:
  1.  **Decision Theory Challenge:** Used to critique Causal (CDT) and Evidential (EDT) Decision Theory for failing to prescribe paying the driver in town (leading to death in the desert). Theories like Timeless (TDT) or Functional (FDT) Decision Theory prescribe paying, arguing it *is* the rational act *simpliciter*.
  2.  **Parfit's Rational Irrationality:** Parfit (*Reasons and Persons*, Sec. 46) emphasizes that the *act* of paying, considered only at the moment of choice in town, is "irrational" (it gains you nothing, costs money). The *rational* part is the prior cultivation of the *disposition* to pay, ensuring rescue. The rationality lies in becoming the type of person for whom the locally irrational act is inevitable.

  **Conflict:** The DT reading *requires* paying to be rational *at the time of action* to validate TDT/FDT as correct theories of rational choice. Parfit's reading *requires* paying to be locally irrational to motivate the distinction between cultivating a disposition and performing the act. This pulls the term "rational" in opposing directions within the same case.

  **Why Existing Resources Leave the Question Open:**
  1.  **Resolute Choice (McClennen):** Advocates sticking to a prior plan (pay) despite local incentives. *Problem:* This might *describe* the agent's behavior but doesn't resolve *which* conception of rationality justifies it. Is resoluteness rational because the *act* is rational (DT view), or because it honors the rational *disposition* cultivated earlier (Parfit view)? It blurs the distinction without dissolving it.
  2.  **Global/Dispositional Evaluation:** Evaluating the rationality of the *disposition* rather than the act. *Problem:* While this captures Parfit's cultivation point, it sidesteps the DT challenge. DT theories specifically aim to prescribe *acts* as rational *in the moment*. Saying "the disposition is rational" doesn't tell us if the act prescribed by the disposition is *itself* rational under a unified standard. Does TDT/FDT's prescription for the act *rely* on this global evaluation, implying a separate standard?
  3.  **Analogy to Toxin Puzzle (Kavka):** Both involve committing to future acts. *Problem:* The Toxin Puzzle highlights a conflict between *intending* and *acting*. Parfit's Hitchhiker, especially in the DT reading, claims the conflict is *resolved* (paying *is* rational). The analogy doesn't clarify *how* this resolution works or if it smuggles in a shift in the meaning of rationality.
  4.  **Schmagent-Style Replies (e.g., Greene):** Characterizing the driver as a "schmagent" who punishes not just defection but the *disposition* to defect. *Problem:* This reformulates the problem to make paying locally rational *if* you have the disposition. While clever, it arguably *changes* the original case Parfit described (where the driver only cares about the *act* of paying *then*). It answers the DT challenge by altering the setup, potentially avoiding the core tension Parfit identified between disposition cultivation and local act evaluation.

  **Research Plan (6 Months):**

  *   **Month 1: Groundwork & Formalization:**
      *   Detailed analysis of Parfit's original presentation and intent in *Reasons and Persons*.
      *   Formal reconstruction of the Hitchhiker problem within standard CDT, EDT frameworks, clearly identifying their failure.
      *   Formal reconstruction of TDT/FDT solutions, isolating their core reasoning for prescribing "pay".
  *   **Month 2: Disambiguating "Rationality":**
      *   Conceptual analysis of the differing requirements for "rationality" in the DT success condition (paying must be rational *at t2*) vs. Parfit's rational irrationality (paying is irrational *at t2*, cultivation rational *at t1*).
      *   Map existing philosophical accounts of rationality (procedural, substantive, instrumental, etc.) onto these requirements.
  *   **Month 3: Interrogating TDT/FDT:**
      *   Close examination: Do TDT/FDT *genuinely* show the act of paying is rational *at t2* under a single, consistent standard? Or does their machinery implicitly rely on evaluating the *type* of agent/decision process (a global/dispositional evaluation) to justify the act, effectively splitting the concept?
      *   Analyze key TDT/FDT texts (Soares, Yudkowsky, MacAskill) for explicit or implicit commitments regarding this split.
  *   **Month 4: Testing the Distinction:**
      *   Construct variations of the Hitchhiker case designed to pull apart the two conceptions:
          *   Cases where cultivating the disposition is clearly rational, but the local act prescribed by TDT/FDT seems *prima facie* irrational under any plausible local standard.
          *   Cases where TDT/FDT prescribe an act based on global reasoning that seems disconnected from local consequences.
      *   Evaluate whether proponents must consistently appeal to different "levels" of rationality to justify prescriptions across these cases.
  *   **Month 5: Synthesis & Implications:**
      *   Formulate the strongest case for a unified interpretation (reconciling DT success with Parfit's point under one "rationality").
      *   Formulate the strongest case for an irreducible distinction.
      *   Analyze the implications of a necessary split for the TDT/FDT program: Does it undermine their claim to provide a *general* theory of rational *action*? Does it relegate them to theories of rational *agency* or *disposition cultivation*?
  *   **Month 6: Drafting & Refinement:**
      *   Write core argument of the paper.
      *   Refine responses to anticipated objections (especially "manufactured distinction").
      *   Finalize structure and key conclusions.

  **What a Result Looks Like:**

  *   **Success 1 (Distinction Confirmed):** A clear demonstration that the Hitchhiker case *requires* two distinct rationality concepts ("cultivation-rationality" and "local-act-rationality") to fulfill both its DT and Parfitian roles. A compelling argument that TDT/FDT's "solution" relies on this distinction, potentially limiting their scope as theories of rational action *simpliciter*.
  *   **Success 2 (Unification Achieved):** A robust argument showing how a single, coherent conception of rationality (e.g., a sophisticated functional or process-based view) can simultaneously explain why cultivating the disposition is rational *and* why paying, *at the moment of action*, is the rational act, without equivocation. This would strengthen TDT/FDT's foundational claims.
  *   **Success 3 (Productive Reframing):** Demonstrating that the apparent tension reveals a deeper feature of rational agency (e.g., the essential role of diachronic commitment or identity) that existing theories capture imperfectly, leading to a novel positive account.

  **What Counts as Failure:**

  1.  **Manufactured Distinction:** Failure to demonstrate that the tension isn't merely semantic or an artifact of imprecise language in the literature. If close analysis reveals Parfit and DT theorists are ultimately using "rational" in compatible ways for the act itself, or if the "local irrationality" of paying is shown to be a misreading of sophisticated theories, the core problem dissolves.
  2.  **Inconclusive Analysis:** Failure to provide decisive arguments for either unification or distinction, leaving the question as murky as before. This could stem from an inability to formally isolate the concepts or to compellingly interpret key texts.
  3.  **Ignoring the Nuance:** Collapsing Parfit's "rational irrationality" into a simpler "it's rational to be irrational" slogan without capturing the specific structure of disposition cultivation and its justification, or misrepresenting the DT solution as merely endorsing the disposition without claiming the act is locally rational.
  4.  **Failure to Engage TDT/FDT:** Not providing a substantive analysis of *how* TDT/FDT specifically handle the tension, or addressing only straw-man versions of these theories.
  5.  **Lack of Novelty:** Merely rehashing existing discussions of resolute choice or dispositional rationality without applying the specific lens of the Hitchhiker tension to yield new insights about TDT/FDT or the concept of rationality itself.

  **Mitigating Failure Risk 1 (Manufactured Distinction):** The research will rigorously test the distinction by:
  *   Precisely defining the criteria for "local-act-rationality" (e.g., maximizing expected utility given *only* information available at t2, consequences immediately flowing from the act at t2).
  *   Precisely defining the criteria for "cultivation-rationality" (e.g., maximizing expected utility over time by adopting traits/processes at t1).
  *   Constructing scenarios where these criteria clearly yield conflicting verdicts *within the Hitchhiker structure*.
  *   Examining if TDT/FDT calculations for the act at t2 *explicitly depend* on variables representing the agent's t1 state or decision process (suggesting reliance on cultivation-rationality) or if they genuinely derive from t2 conditions alone (supporting unification).

  This project aims to resolve a foundational ambiguity in a pivotal thought experiment, with direct consequences for evaluating cutting-edge theories of rational agency and the coherence of "rational irrationality."
