prompt: |-
  I'm running a philosophy-of-medicine reading group and I want a diagnostic tree, not a lecture. Starting commitment: "here is a human condition — is it a disease?" Give me at most five branch questions that actually separate the camps, each phrased so a reader can answer it from the case alone without knowing where the answer sends them: is there a value-free fact about malfunction; does the harm or disvalue go into the definition of disease or only into the decision to treat; does the reference class get indexed to environment and era; is "disease" one concept or a cluster (disease / illness / sickness); and whatever else you think belongs there.

  Then run these through it in a table of verdicts: stage-1 hypertension caught on screening with no symptoms at all; sickle-cell trait in someone who'll never leave a temperate city; a BRCA1 carrier with nothing wrong yet; adult deafness in a signing community that doesn't experience it as a loss; adult lactose intolerance in a country where most adults have it; grief six weeks after a spouse dies; homosexuality as it appeared in an older diagnostic manual.

  Each leaf gets the position's name if you're confident one exists, otherwise just "unnamed," plus a line on the commitment that leaf most regrets. Then tell me which combinations of answers the tree permits that nobody actually occupies, and whether that's because the view is incoherent, unappealing, or merely untried. Finally flag any two leaves these cases can't separate — I expect Boorse and Wakefield will land on near-identical verdicts and differ only in their explanation, and I want to know if that's right or whether some case pries them apart.
