  Below is the decision tree structured as an indented outline, designed to reveal cross-cutting commitments about the norms governing assertion. It uses concrete cases and claims (not labels) to force explicit choices, and it accommodates your specified cases. The tree has **7 branching questions**, leading to **12 distinct leaves** that cover the required views and additional nuanced positions. Each leaf includes a one-sentence "most awkward commitment." Finally, I note indistinguishable leaf pairs and unoccupied combinations.

  ---

  ### Decision Tree: Norms of Assertion  
  *Run this tree by answering each question with "Yes" or "No" based on your intuitive judgments about the cases. Work downward sequentially.*

  1. **In the physician case** (excellent evidence, prediction turns false):  
     **Claim:** *The assertion is proper at the moment of utterance, even though it later proves false.*  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **In the lottery case** ("your ticket will lose"):  
     **Claim:** *The assertion is improper, even if the ticket loses and the speaker has statistical evidence.*  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  3. **In the Gettier case** (justified true belief by fluke):  
     **Claim:** *The assertion is proper because the speaker’s evidence was excellent, despite the fluky truth.*  
     - **Yes** → Go to 6.  
     - **No** → Go to 7.  

  4. **In the Moorean case** ("it is raining, but I don't know it is"):  
     **Claim:** *This assertion is inherently defective, regardless of context or whether it is raining.*  
     - **Yes** → Go to 8.  
     - **No** → Go to 9.  

  5. **In the fourth-grade teacher case** (states evolution without believing it):  
     **Claim:** *The assertion is improper solely because the teacher lacks belief, despite her strong evidence.*  
     - **Yes** → Go to 10.  
     - **No** → Go to 11.  

  6. **Claim:** *The propriety of an assertion can shift after utterance if new evidence emerges (e.g., the physician’s assertion becomes improper only after the patient dies).*  
     - **Yes** → **Leaf: Relativist/Assessment-Sensitive (R)**  
       - *Most awkward commitment:* The same assertion can retroactively become improper due to later events, even if perfectly reasonable when made.  
     - **No** → **Leaf: Justification Norm (JN)**  
       - *Most awkward commitment:* Gettiered assertions are proper because the speaker met their justificatory duty, despite the truth being accidental.  

  7. **Claim:** *The norm of assertion is identical to the norm of belief (e.g., if belief requires knowledge, so does assertion).*  
     - **Yes** → **Leaf: Knowledge Norm (KN)**  
       - *Most awkward commitment:* The lottery assertion is always improper (even if true and statistically sound) because the speaker lacks knowledge.  
     - **No** → **Leaf: Hybrid Norm (HN)**  
       - *Most awkward commitment:* An assertion can be "evidentially proper" but "doxastically improper" (e.g., the teacher case), creating two dimensions of fault.  

  8. **Claim:** *The physician’s assertion would be proper if standards in her context were lower (e.g., in a low-stakes chat, not a medical consultation).*  
     - **Yes** → **Leaf: Contextualist (C)**  
       - *Most awkward commitment:* "Knowledge" is so elastic that the same assertion can switch from proper to improper by changing conversational settings.  
     - **No** → **Leaf: Strict Evidentialism (SE)**  
       - *Most awkward commitment:* The lottery assertion is improper even in casual contexts because statistical evidence is always insufficient for propriety.  

  9. **Claim:** *The teacher’s assertion is proper only because her role mandates deferring to experts, not because evidence alone suffices.*  
     - **Yes** → **Leaf: Pragmatic Role Norm (PRN)**  
       - *Most awkward commitment:* Identical evidence can license or forbid assertion based on social roles (e.g., a philosopher vs. a teacher).  
     - **No** → **Leaf: Evidence-Relative Norm (ERN)**  
       - *Most awkward commitment:* The physician’s false assertion is proper if her evidence was excellent, even if the outcome causes harm.  

  10. **Claim:** *The oddity of the Moorean sentence stems from violating a linguistic convention, not an epistemic norm.*  
      - **Yes** → **Leaf: Sincerity + Practical Rationality (SPR)**  
        - *Most awkward commitment:* The lottery assertion is proper if sincerely believed and practically useful (e.g., to discourage wasted money).  
      - **No** → **Leaf: Belief Norm (BN)**  
        - *Most awkward commitment:* The teacher’s assertion is improper even if socially beneficial because she lacks belief, making it insincere "testimony."  

  11. **Claim:** *Truth alone determines propriety (e.g., the lottery assertion is proper if the ticket loses, regardless of evidence).*  
      - **Yes** → **Leaf: Truth Norm (TN)**  
        - *Most awkward commitment:* A lucky guess with no evidence is proper if true, but a justified false assertion (e.g., the physician) is always improper.  
      - **No** → **Leaf: Deflationary (D)**  
        - *Most awkward commitment:* No unified norm explains all cases (e.g., lottery impropriety is just a linguistic quirk, not a deep epistemic flaw).  

  ---

  ### Indistinguishable Leaf Pairs  
  The following pairs **cannot be separated** by the test cases provided, as they yield identical verdicts across all five cases:  
  - **Strict Evidentialism (SE) vs. Knowledge Norm (KN):** Both reject the lottery case, Gettier case, and Moorean sentence as improper; both accept the physician case as improper if false.  
    - *Why:* The cases don’t force a choice between "justification beyond statistical evidence" (SE) and "knowledge" (KN), as statistical evidence is insufficient for both.  
  - **Evidence-Relative Norm (ERN) vs. Justification Norm (JN):** Both accept the teacher case and the Gettier case as proper, and both reject the lottery case as improper.  
    - *Why:* The teacher and Gettier cases pivot on evidence quality alone, and neither view requires belief or knowledge.  

