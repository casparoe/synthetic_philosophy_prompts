prompt: |-
  i'm the only analyst at a small family foundation — about $25m a year, and our whole portfolio is "emerging risks," which is a polite way of saying we fund stuff where the data doesnt exist yet: novel pathogens in specific regions, water security, governance of new tech, that kind of thing. Four times a year i put about ten proposals in front of a board of four people, none of whom have any stats background. One of them is an ex-trader who is convinced everything can be written as a distribution if you just try hard enough, and another is a retired pediatrician who is convinced the opposite. Right now i run everything through a scoring rubric that makes me type a single probability and a single impact number into a spreadsheet and multiplies them, and i've become pretty sure that's fake precision wearing a lab coat — the number looks like knowledge but its actually just me picking something out of the air and rounding it. Last quarter i killed a proposal basically because "there's no evidence base," and i've been chewing on it ever since, because i think i might have just done the urn thing. You know the setup: 90 balls, 30 red, and 60 that are either black or yellow in some proportion nobody will tell you, and everyone bets on red over black and then on black-or-yellow over red-or-yellow, which is not allowed if you're being a good Bayesian. That's roughly my entire job, except the urns are grant applications.

  What i need is a decision procedure i can actually run on a proposal in about 45 minutes, maybe an hour on a big one, and that survives being handed to a board member who has never heard the word "ambiguity" used as a term of art. So: the questions to ask in order, what counts as a sufficient answer to each, and how i'm supposed to sort a proposal into "we have frequencies for this," "we don't have frequencies but we could bound things," and "we have no idea and no amount of thinking this afternoon will change that." I want it to be explicit about what to do when i genuinely can't produce a number — sets of priors, worst-case reasoning, whatever the right move actually is — rather than letting me smuggle a single point estimate back in through the side door. And it needs a step where i check whether my reluctance about the unknown-urn option is real caution or just the fact that i spent six years working in the field the well-evidenced option lives in, since i know ambiguity aversion mostly evaporates when people feel like the expert in the domain. The mirror-image failure needs handling too: the proposals that are gambles on the unknown urn dressed up as bold vision, where the ambiguity is doing all the work of hiding a bad bet. Mark clearly where the procedure stops and hands the thing to the board because what's left is a values question and not a facts question.

  For the deliverable, assume the output is a one-page brief per proposal: a recommendation, the assumptions that carry it, and a line saying what evidence would change the answer. Then run it on three cases for me. One: a program with fourteen randomized trials behind it, modest but real effect, boring, scalable, and it costs almost exactly what our average grant costs. Two: a genuinely novel intervention with a plausible mechanism, one small pilot, no comparison group, and an upside that is maybe ten times anything else in the pile. Three: a proposal where the ambiguity is entirely self-inflicted — the applicant could have generated the missing evidence cheaply and chose not to — and i want to know whether that changes how the procedure treats it. At least one of those three should come out with an answer i personally will not like, and you should say which one and why. Finish with a short section on what the procedure cannot do and where it will misfire, and be honest about which of the steps are judgment calls dressed up as procedure. I don't need references or a reading list, i'm not going to chase any down — i need the procedure itself.
reasoning: |-
  We are designing a decision procedure for evaluating grant proposals under deep uncertainty (ambiguity) for a foundation focused on emerging risks. The procedure must be executable in 45-60 minutes per proposal and understandable by a board without statistical background.

  Key features:
  1. Explicitly handle three states of knowledge: 
     a. We have frequencies (or sufficient data to model probabilities).
     b. We can bound probabilities (set of priors, interval, or worst-case).
     c. We have no idea (and cannot bound) - the true unknown urn.
  2. Avoid fake precision: do not force a point estimate when none is justified.
  3. Mitigate cognitive biases: ambiguity aversion (when we are domain experts) and overconfidence in bold visions that are actually bad bets hidden by ambiguity.
  4. Clearly separate factual analysis from values judgments (which are left to the board).
  5. Output: one-page brief with: recommendation, key assumptions, and what evidence would change the answer.

  The procedure will have the following steps:

  Step 1: Domain Familiarity Check (to mitigate bias)
  - Question: "Am I (the analyst) an expert in the domain of this proposal, or is it outside my usual area?"
  - Purpose: To flag potential overconfidence (if expert) or underconfidence (if not) in the face of ambiguity.
  - Action: 
    - If expert: be extra cautious about dismissing ambiguity (because we might be too comfortable with the domain and underweight the unknown).
    - If not: be extra cautious about accepting ambiguous proposals (because we might be averse to the unknown).

  Step 2: Evidence Base Categorization
  - We ask: "What is the nature of the evidence for the probability of success and the impact?"
  - We categorize into one of three buckets:
    a. "Frequencies": There is historical data or multiple studies (e.g., randomized trials) that allow us to estimate a probability distribution. We can say: "The probability of success is around p, with confidence intervals [a,b]."
    b. "Bounded Ambiguity": There is no precise data, but we can bound the probabilities. For example, we can say: "The probability of success is at least p_min and at most p_max" or "The impact is between X and Y". This includes worst-case and best-case scenarios.
    c. "Unknown Urn": We have no basis for assigning probabilities or even bounds. We cannot say anything about the likelihood of success or the magnitude of impact beyond a vague qualitative description.

  Step 3: Check for Self-Inflicted Ambiguity
  - Question: "Is the ambiguity in this proposal due to a lack of available data that could have been reasonably obtained by the applicant (without excessive cost or time) before submitting?"
  - Purpose: To penalize proposals that are ambiguous because of the applicant's failure to gather obvious evidence.
  - Action:
    - If yes (self-inflicted), note this as a negative factor. It suggests the applicant might be avoiding evidence that could undermine their case.
    - If no (inherent ambiguity), then it's a genuine feature of the emerging risk.

  Step 4: Impact Assessment
  - We ask: "What is the range of possible impacts (positive and negative) if the project succeeds or fails?"
  - We look for:
    - Upside: Best-case impact (in quantitative or qualitative terms).
    - Downside: Worst-case negative consequences (if any).
    - Scale: How many people/regions/systems could be affected?
  - We do not assign a single number. Instead, we describe the range and the nature of the impact.

  Step 5: Proposal Evaluation
  - Now we combine the evidence category and impact assessment to arrive at a recommendation framework.

  We will use a decision matrix:

  | Evidence Category | Impact Assessment | Recommendation |
  |-------------------|-------------------|---------------|
  | Frequencies       | Any               | Strong candidate. If the expected value (using the frequency) is positive and cost-effective, recommend. |
  | Bounded Ambiguity | High upside, low downside | Consider for funding. Use a robust decision rule: e.g., maximize the minimum gain (maximin) or minimize maximum regret (minimax regret). If the worst-case scenario is acceptable and the best-case is very good, then lean towards funding. |
  | Bounded Ambiguity | High downside     | Be cautious. If the worst-case downside is catastrophic, avoid. If the downside is bounded and acceptable, then consider. |
  | Unknown Urn       | High upside, low downside | Consider, but only if the upside is transformative and the downside is minimal. Use a precautionary principle: if failure would cause irreversible harm, avoid. |
  | Unknown Urn       | High downside     | Avoid, unless the upside is existential (preventing an existential catastrophe) and the downside is not. |

  In addition, for proposals with self-inflicted ambiguity, we downgrade the recommendation by one level (e.g., from "recommend" to "consider" or from "consider" to "avoid") unless the applicant provides a compelling reason for not having gathered the evidence.

  Step 6: Separate Values Questions
  - We explicitly note for the board: 
    - Any decision under bounded ambiguity or unknown urn involves a values judgment about risk tolerance and the weight given to worst-case vs. best-case scenarios. 
    - The board must decide on the foundation's risk appetite and their willingness to fund transformative but uncertain bets.

  Step 7: Output the Brief
  - Structure of the one-page brief:
    - Proposal Title
    - Summary of the Intervention
    - Evidence Category (Frequencies, Bounded Ambiguity, Unknown Urn) and why
    - Impact Assessment (range of outcomes, upside, downside)
    - Note on Self-Inflicted Ambiguity (if applicable)
    - Recommendation: Fund, Consider, or Avoid (with strength: strong, weak, etc.)
    - Key Assumptions: e.g., "We assume the probability of success is between 10% and 40%", or "We assume the worst-case impact is limited to X"
    - What Evidence Would Change the Answer? e.g., "A larger randomized trial would narrow the confidence interval", or "Pilot data on mechanism Y would help bound the probability"

  Now, let's run the three test cases:

  Case 1: The Boring, Well-Evidenced Program
  - Description: 14 randomized trials, modest but real effect, scalable, cost = average grant.
  - Step 1: Domain Familiarity - likely expert (since it's well-studied). We must be cautious not to undervalue because it's boring.
  - Step 2: Evidence Category - Frequencies (we have multiple trials).
  - Step 3: Self-Inflicted Ambiguity? No.
  - Step 4: Impact Assessment: modest but real effect. Upside: moderate positive impact at scale. Downside: low (since it's been tested).
  - Step 5: Evaluation - Frequencies + positive expected value -> Strong candidate for funding.
  - Recommendation: Fund.
  - Key Assumptions: The trials are of good quality and generalizable.
  - Evidence that would change: None needed, but if new evidence showed harm in a subgroup, reconsider.

  Case 2: The Novel Intervention with High Upside
  - Description: Plausible mechanism, one small pilot without comparison group, upside maybe 10x anything else.
  - Step 1: Domain Familiarity - might be outside expertise (because it's novel). We must be cautious about ambiguity aversion.
  - Step 2: Evidence Category: Bounded Ambiguity? We have a pilot without control, so we don't have frequencies. But we might bound the probability of success. For example, based on the mechanism and pilot, we might say the probability of success is between 5% and 50%. Alternatively, if we cannot bound it, then Unknown Urn. Let's say we can bound: we use the pilot and mechanism to set a range. We'll go with Bounded Ambiguity (if we can set even wide bounds) or Unknown Urn (if we cannot). 
    - Judgment: We can bound. Why? The mechanism is plausible and the pilot showed some effect. We can set a wide interval: e.g., 10% to 60% chance of success. 
  - Step 3: Self-Inflicted? No, because it's genuinely novel and the evidence doesn't exist yet.
  - Step 4: Impact: High upside (10x), but what about downside? The proposal might fail with no harm, or it might have unintended consequences. Since it's novel, we don't know. We must consider: if it fails, is there harm? If the pilot didn't show harm, we might assume low downside. But let's be cautious: downside could be moderate if the intervention has risks. We'll assume low to moderate downside.
  - Step 5: Bounded Ambiguity with high upside and low/moderate downside -> Consider for funding. However, we must apply a robust decision rule. If we use maximin: the worst-case scenario (10% chance of success) might still be acceptable if the upside is huge and the cost is not too high. Alternatively, if the worst-case expected value (10% * upside) is positive and large enough, then it's a go. But note: the upside is 10x, so even at 10% chance, the expected impact might be 1x the next best (if the next best has a 100% chance of 1x). However, we must compare to the opportunity cost (the average grant). 
    - But the board must decide on risk tolerance. 
  - Recommendation: Consider for funding (with a note to the board about the high uncertainty and high upside).
  - Key Assumptions: Probability of success between 10% and 60%. Downside is limited to moderate. 
  - Evidence that would change: A larger pilot with a control group would narrow the probability bounds.

  Case 3: Self-Inflicted Ambiguity
  - Description: The applicant could have generated the missing evidence cheaply but chose not to.
  - Step 1: Domain Familiarity - depends, but we'll assume we are experts and note that we might be biased against this because we know the evidence could have been gathered.
  - Step 2: Evidence Category: Let's assume it falls into Bounded Ambiguity or Unknown Urn. But because of Step 3, we note it is self-inflicted.
  - Step 3: Self-Inflicted? Yes. This is a negative factor.
  - Step 4: Impact: Suppose the upside is high and downside low (otherwise we wouldn't even consider). 
  - Step 5: Because of self-inflicted ambiguity, we downgrade the recommendation. For example, if without the downgrade it would be "Consider", now it becomes "Avoid". Why? Because the applicant's failure to gather evidence raises concerns about the proposal's merit and the applicant's credibility. 
  - Recommendation: Avoid.
  - Key Assumptions: The missing evidence could have been obtained without excessive cost and would have been informative.
  - Evidence that would change: If the applicant provides the missing evidence.

  Now, we must have at least one case that the analyst (you) won't like. I suspect Case 3 might be it because you might feel that even with self-inflicted ambiguity, if the upside is huge, we should consider it. But the procedure would downgrade it to avoid.

  Alternatively, Case 2 might be one you don't like because it might be too cautious for a high-upside bet? But we are recommending "Consider" for Case 2. So let me adjust Case 3 to have high upside and low downside, but self-inflicted ambiguity. You might not like that we avoid it.

  Finally, limitations and misfires:

  Limitations:
  1. The categorization in Step 2 (evidence) is inherently subjective. What one person sees as bounded, another might see as unknown. We rely on the analyst's judgment.
  2. The impact assessment (Step 4) is also qualitative and may miss second-order effects.
  3. The procedure does not explicitly compare proposals against each other (opportunity cost). We assume each is evaluated independently, but the board will see a set.
  4. It does not account for the cost of the grant beyond noting that it's within the average. We assume all proposals are within the foundation's budget range.
  5. The bias check in Step 1 is a self-assessment and may be inaccurate.

  Misfires:
  - The procedure might reject a truly transformative idea because it falls into Unknown Urn and the downside is not well understood (but actually the downside is minimal). 
  - It might accept a proposal with self-inflicted ambiguity if the analyst is too lenient in Step 3.
  - The bounded ambiguity step might be applied too optimistically, leading to funding of proposals that are actually bad bets.

  Despite these, the procedure forces explicit reasoning about ambiguity and avoids fake precision.

  Let's write the briefs for the three cases.

  Due to the length, I'll write one brief per case in the required format.

  **Case 1 Brief:**

  **Proposal Title:** Scaling a Proven Intervention for Clean Water Access  
  **Summary:** A program to provide clean water filters in a region with high waterborne disease burden, backed by 14 randomized trials showing a reduction in disease incidence.  
  **Evidence Category:** Frequencies. Multiple trials provide a solid evidence base.  
  **Impact Assessment:** Modest but real positive impact (reduction in disease). Upside: Scalable to thousands. Downside: Low (trials show no significant harm).  
  **Self-Inflicted Ambiguity?** No.  
  **Recommendation:** Fund (strong).  
  **Key Assumptions:** The trials are methodologically sound and the context of implementation is similar to the trial contexts.  
  **Evidence That Would Change the Answer:** New evidence showing harm in the target population.

  **Case 2 Brief:**

  **Proposal Title:** Novel Pathogen Early Detection System  
  **Summary:** A new technology using AI to detect novel pathogens in wastewater. One small pilot showed promising results but without a comparison group. Mechanism is plausible. Potential upside is 10x current methods in speed and coverage.  
  **Evidence Category:** Bounded Ambiguity. We estimate a 10% to 60% chance of success based on the pilot and mechanism.  
  **Impact Assessment:** High upside (transformative improvement in early detection) with moderate downside (if the system fails, it might lead to false negatives, but the pilot showed no major issues).  
  **Self-Inflicted Ambiguity?** No.  
  **Recommendation:** Consider (for funding). The decision involves a values judgment about risk tolerance given the high uncertainty and high potential payoff.  
  **Key Assumptions:** The probability bounds are reasonable and the downside is bounded.  
  **Evidence That Would Change the Answer:** A controlled pilot study would narrow the probability bounds.

  **Case 3 Brief:**

  **Proposal Title:** Governance Framework for AI in Healthcare  
  **Summary:** A proposal to develop a governance framework for AI in healthcare in a region with no existing regulations. The applicant did not conduct a stakeholder survey that would have cost $5,000 and taken two weeks, which could have provided evidence on key concerns.  
  **Evidence Category:** Without the survey, we have Bounded Ambiguity? Actually, we might have less. Since the applicant skipped a cheap and informative step, we might categorize as Unknown Urn because we cannot trust the bounds. Alternatively, we might still set bounds but note the self-inflicted gap. We'll say Bounded Ambiguity (but with a negative mark).  
  **Impact Assessment:** High upside (if successful, could prevent misuse of AI) and low downside (if it fails, no direct harm, just wasted resources).  
  **Self-Inflicted Ambiguity?** Yes.  
  **Recommendation:** Avoid. The self-inflicted ambiguity raises concerns about the proposal's credibility and the applicant's diligence.  
  **Key Assumptions:** The missing survey could have provided critical evidence and was feasible to conduct.  
  **Evidence That Would Change the Answer:** If the applicant conducts the survey and the results support the proposal.

  The analyst might not like Case 3's outcome because the upside is high and the downside is low, but the procedure penalizes the self-inflicted ambiguity. This is intentional to discourage applicants from avoiding evidence gathering.

  Final note: The procedure is a tool to structure thinking, but it is not a substitute for wisdom. Judgment is embedded throughout, especially in Steps 2 and 4. The board's role in making values-based decisions under uncertainty is critical.
answer: |-
  ### Decision Procedure for Evaluating Grant Proposals Under Ambiguity  
  **Designed for: Small foundation funding emerging risks (novel pathogens, water security, new tech governance, etc.).  
  Time per proposal: 45–60 minutes.  
  Output: One-page brief (recommendation, assumptions, evidence gaps).**  

  ---

  #### **The Procedure: 7 Steps**  
  **Goal:** Categorize proposals into three evidence states—**Frequencies**, **Bounded Ambiguity**, or **Unknown Urn**—and mitigate bias. Explicitly reject fake precision.  

  1. **Step 1: Domain Familiarity Check (5 min)**  
     - **Question:** *"Is this proposal in a domain where I have deep expertise, or is it unfamiliar?"*  
     - **Purpose:** Flag bias. Experts underweight ambiguity ("I know this, so it’s less risky"). Non-experts overweight it ("This feels too uncertain").  
     - **Action:** Write down:  
       - *If expert:* "I am biased toward underweighting ambiguity here. I will demand stronger evidence for unknowns."  
       - *If non-expert:* "I am biased toward overweighting ambiguity. I will force bounds or reject unknowns."  
     - **Output:** A bias warning for your brief.  

  2. **Step 2: Evidence State Categorization (15 min)**  
     - **Questions:**  
       - *"Is there data to estimate a probability distribution (e.g., historical frequencies, controlled studies)?"*  
       - *"If no, can we bound outcomes (e.g., min/max impact, plausible probability ranges) using theory, analogs, or expert input?"*  
       - *"If no bounds possible, is the ambiguity inherent (unknowable now) or fixable (evidence could exist)?"*  
     - **Categorization Rules:**  
       - **Frequencies:** ≥3 independent data points (e.g., trials, historical cases). *Sufficient if:* You can plot a distribution.  
       - **Bounded Ambiguity:** No data, but logical/reasonable bounds (e.g., "success probability between 10–40%"). *Sufficient if:* Bounds are defensible with 1–2 sentences of reasoning.  
       - **Unknown Urn:** No data, no defensible bounds. *Sufficient if:* All arguments for bounds feel speculative.  
     - **Output:** One evidence state + 1-sentence rationale (e.g., "Unknown Urn: No analogs for Martian soil pathogens").  

  3. **Step 3: Impact Range Assessment (10 min)**  
     - **Questions:**  
       - *"What is the BEST-case impact (e.g., lives saved, $ impact) if successful?"*  
       - *"What is the WORST-case impact (e.g., harm, wasted resources) if it fails?"*  
       - *"Is the impact range asymmetric (e.g., huge upside, low downside)?"*  
     - **Action:** Describe ranges qualitatively (e.g., "Upside: 10x current solutions. Downside: Minimal harm"). **Never assign a single number.**  

  4. **Step 4: Self-Inflicted Ambiguity Check (5 min)**  
     - **Question:** *"Could the applicant have reduced ambiguity cheaply (e.g., pilot, literature review) but chose not to?"*  
     - **Action:**  
       - *If yes:* Label "Self-Inflicted." Downgrade recommendation later.  
       - *If no:* Label "Inherent Ambiguity."  
     - **Output:** Flag in brief.  

  5. **Step 5: Apply Decision Rule (10 min)**  
     - **Rules per Evidence State:**  
       - **Frequencies:** Calculate expected value (EV) using distribution. Recommend if EV > cost.  
       - **Bounded Ambiguity:** Use **maximin rule** (favor options with best worst-case outcome) or **minimax regret** (favor options where max regret is lowest). No point estimates.  
       - **Unknown Urn:** Use **precautionary principle** if downside is catastrophic; else, **opportunity maximization** (prioritize transformative upside).  
     - **Bias Adjustments:**  
       - *If expert (from Step 1):* For Unknown Urn, ask: "Is my aversion rational, or am I overconfident in alternatives?"  
       - *If non-expert:* For Unknown Urn, ask: "Is this truly a gamble, or is ambiguity masking a bad bet?"  
     - **Self-Inflicted Penalty:** Downgrade by one level (e.g., "Consider" → "Avoid").  

  6. **Step 6: Values Check (2 min)**  
     - **Question:** *"Does the decision hinge on the foundation’s risk tolerance (e.g., funding moonshots vs. avoiding downside)?"*  
     - **Action:** If yes, stop and hand to board. Label: "Board Decision: Values Call."  

  7. **Step 7: Compile Brief (3 min)**  
     - **Template:**  
       ```  
       - RECOMMENDATION: [Fund / Consider / Avoid]  
       - EVIDENCE STATE: [Frequencies / Bounded / Unknown Urn]  
       - BIAS WARNING: [e.g., "Expert domain → may underweight ambiguity"]  
       - IMPACT RANGE: Upside: [Best-case], Downside: [Worst-case]  
       - SELF-INFLICTED AMBIGUITY: [Yes/No]  
       - KEY ASSUMPTIONS: [e.g., "Bounded success probability (20–50%) based on pilot"]  
       - EVIDENCE GAPS: [e.g., "Field trial would narrow bounds"]  
       - VALUES CALL?: [If yes: "Board must decide risk tolerance"]  
       ```  

  ---

  ### **Test Cases**  
  #### **Case 1: The Boring, Well-Evidenced Program**  
  - **Description:** 14 RCTs, modest effect, scalable, cost = average grant.  
  - **Procedure:**  
    1. **Step 1:** Expert domain → Bias: Underweight ambiguity.  
    2. **Step 2:** **Frequencies** (multiple RCTs).  
    3. **Step 3:** Upside: Reliable, scalable benefit. Downside: Low (tested).  
    4. **Step 4:** No self-inflicted ambiguity.  
    5. **Step 5:** EV positive → **Fund**.  
    6. **Step 6:** No values call.  
  - **Brief:**  
    ```  
    - RECOMMENDATION: Fund  
    - EVIDENCE STATE: Frequencies  
    - BIAS WARNING: Expert domain → may undervalue ambiguity  
    - IMPACT RANGE: Upside: Predictable benefit. Downside: Minimal risk.  
    - SELF-INFLICTED AMBIGUITY: No  
    - KEY ASSUMPTIONS: RCTs generalize to target population.  
    - EVIDENCE GAPS: None needed.  
    - VALUES CALL?: No.  
    ```  

  #### **Case 2: The High-Upside Novel Intervention**  
  - **Description:** Plausible mechanism, one pilot (no control group), 10x upside potential.  
  - **Procedure:**  
    1. **Step 1:** Non-expert domain → Bias: Overweight ambiguity.  
    2. **Step 2:** **Bounded Ambiguity** (pilot + mechanism suggest success probability 5–30%).  
    3. **Step 3:** Upside: 10x impact. Downside: Low (no harm in pilot).  
    4. **Step 4:** No self-inflicted ambiguity (genuinely novel).  
    5. **Step 5:** Maximin rule: Worst-case (5% success) still acceptable given upside → **Consider**.  
    6. **Step 6:** Board decides risk tolerance (high upside vs. uncertainty).  
  - **Brief:**  
    ```  
    - RECOMMENDATION: Consider (with board input)  
    - EVIDENCE STATE: Bounded Ambiguity  
    - BIAS WARNING: Non-expert domain → may overweight ambiguity  
    - IMPACT RANGE: Upside: 10x standard impact. Downside: Low/no harm.  
    - SELF-INFLICTED AMBIGUITY: No  
    - KEY ASSUMPTIONS: Success probability bounded at 5–30%.  
    - EVIDENCE GAPS: Controlled pilot would narrow bounds.  
    - VALUES CALL?: Yes – Board must decide if 5% worst-case justifies 10x upside.  
    ```  

  #### **Case 3: Self-Inflicted Ambiguity**  
  - **Description:** Applicant skipped cheap soil-testing pre-study ($2k) for agriculture resilience project, leaving key risks unknown. Upside: High if successful.  
  - **Procedure:**  
    1. **Step 1:** Expert domain → Bias: Underweight ambiguity.  
    2. **Step 2:** **Bounded Ambiguity** (could have been Frequencies if tested).  
    3. **Step 3:** Upside: High. Downside: Crop failure risk (unknown magnitude).  
    4. **Step 4:** **Self-Inflicted Ambiguity** (skipped $2k test).  
    5. **Step 5:** Downgrade to **Avoid** (penalty for avoidable ambiguity).  
    6. **Step 6:** No values call (procedural rejection).  
  - **Brief:**  
    ```  
    - RECOMMENDATION: Avoid  
    - EVIDENCE STATE: Bounded Ambiguity (could be Frequencies)  
    - BIAS WARNING: Expert domain → may forgive self-inflicted gaps  
    - IMPACT RANGE: Upside: High yield improvement. Downside: Crop failure risk.  
    - SELF-INFLICTED AMBIGUITY: Yes – Skipped $2k soil test.  
    - KEY ASSUMPTIONS: Missing evidence could resolve ambiguity.  
    - EVIDENCE GAPS: Soil test data.  
    - VALUES CALL?: No.  
    ```  

  **Which answer won’t you like? Case 3.** You might argue the upside justifies funding, but the procedure penalizes self-inflicted ambiguity to discourage strategic ignorance. It forces accountability: applicants must reduce ambiguity where feasible.  

  ---

  #### **Limitations and Failure Modes**  
  1. **Judgment Dressed as Procedure:**  
     - Step 2 (Evidence State) and Step 5 (Decision Rule) rely on subjective bounds. What’s "reasonable" for Bounded Ambiguity? A trader might call everything bounded; a pediatrician might disagree.  
     - Step 1 (Bias Check) is self-reported and prone to blind spots.  

  2. **Misfires:**  
     - **Over-rejection of Unknown Urns:** The precautionary principle may kill truly transformative ideas if downside is misjudged.  
     - **Misclassification:** A proposal with thin but existent data might be forced into Bounded Ambiguity instead of Frequencies, inflating perceived risk.  
     - **Board Dynamics:** If board members are entrenched (e.g., trader vs. pediatrician), the "Values Call" may deadlock.  

  3. **What It Can’t Do:**  
     - **Compare proposals:** This evaluates one application at a time. Portfolio balancing (e.g., "fund 2 safe + 1 risky") is left to the board.  
     - **Handle Interdependence:** If proposals affect the same system (e.g., two pathogen detectors), risks compound. Not addressed.  
     - **Quantify Ambiguity Aversion:** It flags bias but doesn’t measure "how much" ambiguity aversion is present.  

  **Final Note:** This procedure replaces fake precision with explicit uncertainty. It won’t eliminate disagreement—but it will make the disagreement honest (e.g., "We’re fighting over values, not hidden numbers"). Use it to force clarity, not consensus.
