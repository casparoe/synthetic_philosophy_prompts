  **Closing Address for Deputy Sheriffs Swearing-In Ceremony**

  **(1)** Deputy Sheriffs, families, honored guests, Sheriff, Command Staff, Commissioner, Chaplain – thank you for the profound honor of speaking at this moment. We’ve just witnessed forty-two individuals take an oath. They didn’t just promise to *do* a job; they swore an oath to *be* something: upholders of the Constitution, faithful dischargers of duty. That oath hangs in the air now, a commitment made tangible by your presence here, Deputy Sheriffs. Look around you at the people who believe in you. Feel the weight of the trust this county places in you today. That trust isn’t abstract; it’s earned by the journey you’ve completed and promised by the words you’ve just spoken.

  **(2)** That oath is your compass. But a compass, however true, doesn’t navigate the terrain. You will navigate complex, often ambiguous terrain. You will be called upon to act, decisively, in moments where the right path isn’t brightly lit by a rulebook. You will hold authority granted by the people, embodied in your badge, and with it comes the extraordinary power to use force – force to protect, to detain, to intervene, to control. This power is fundamental to your role; without it, the oath remains words, the duty unfulfilled. But this power is not self-justifying. Its legitimacy springs entirely from *why* and *how* you use it.

  **(3)** Centuries ago, a thinker wrestling with the messy realities of power observed a profound tension. He saw societies struggling endlessly to make justice truly powerful, to ensure the right always prevailed. Yet, he noted, because justice itself can be fiercely debated – what *is* fair, what *is* right in this specific moment? – and force is undeniable, a dangerous slippage occurs. We can start seeing the *settled fact* of force – the thing that *is* – as proof that it *ought* to be. We confuse what *has been established* with what *should be right*. His unsettling conclusion was stark: since we struggle to make what is just strong, we often end up making what is strong seem just.

  **(4)** This isn’t ancient history; it’s the daily crucible of law enforcement. The thinker’s diagnosis points directly to a crucial distinction vital for you to grasp, deeply and personally. It’s the difference between two ways force relates to rights. Force can be **instrumental**: it’s the tool used to uphold a right whose boundaries are already clear and agreed upon. Think of enforcing a court order. The right (possession) is defined; your force is the instrument to effect it. But force can also be **constitutive**. This is where the profound, unique responsibility of your office lies. Constitutive force is what *makes the right real* in the moment of uncertainty. When chaos erupts, when the rulebook falls silent, when immediate action is needed to prevent harm and create the space where justice can later be sought – *your* judgment, *your* decision to act (or not act), *your* measured use of force *constitutes* the possibility of right in that instant. Without someone authorized, trained, and willing to step into that breach and act wisely and justly, the right to safety, order, and due process remains merely a wish.

  **(5)** The peril identified by that thinker is ever-present. Because instrumental force is clearer, more procedural, it’s tempting to let *all* force slip into that category – to believe that because we *can* act (the force is available and authorized), that action *must* be just. The danger is that the undeniable reality of our power – the uniform, the badge, the tools – begins to *substitute* for the harder, ongoing work of discerning and enacting justice itself. We risk mistaking the *possession* of force for the *justification* of its use. This is where the oath you just took becomes your anchor. Your fidelity to the Constitution, your commitment to faithfully discharging your duties – these are the safeguards against that slippage. They demand that your force, especially when it is constitutive – when you are *making* the right possible in the moment – is guided by more than just capability or procedure.

  **(6)** So, what does this mean for you, starting tomorrow? It means recognizing that your most significant acts won’t always be the clearest instrumentalities. They will be the moments you step into the gray area, assess a volatile situation, and use your authority and, potentially, force, not merely to enforce a pre-existing right, but to *create the conditions* where rights – everyone’s rights – can breathe and be protected. This constitutive power is your solemn burden and your highest calling. It demands constant vigilance: vigilance against the internal slide towards assuming force equals right, and vigilance against the external pressures that would ask you to use force simply because it *can* be used. Your strength lies not just in your ability to act, but in your unwavering commitment to act *justly*, especially when justice is contested or obscured. Your force must be the servant of the right you are there to constitute, not its master.

  **(7)** To the families and loved ones: You see the person behind the badge. You know their heart, their struggles, their dedication. Support them in holding fast to that oath. Remind them of the *why* behind the duty. The strength they carry is immense; your love and grounding remind them that true strength is measured by character, restraint, and an unwavering moral compass, especially when no one is watching but their own conscience. To the Sheriff and Command Staff: You know the institutional weight of this distinction. Building a culture that constantly reinforces the *constitutive* purpose of force – creating just outcomes, protecting inherent rights – over the mere exercise of power, is your critical stewardship. It’s what turns policy into principled action. To the Commissioner and the people of this county: Your trust is not given lightly. Hold these deputies accountable, yes, but also recognize the profound complexity and weight of the constitutive moments they will face. Support systems that nurture judgment and justice, not just compliance.

  **(8)** Deputy Sheriffs, you chose this path. You swore the oath moments ago. You now hold the public trust and the power that comes with it. Carry that constitutive power not as a club, but as a sacred responsibility. Use your strength not to *become* the law, but to *uphold* it; not to *define* justice arbitrarily, but to *make space* for it to be realized fairly for all. In every call, every interaction, every moment requiring your judgment and potential force, remember: you are not merely instruments of existing rules; you are, in the most critical moments, the active constituters of the very possibility of justice and safety in this community. Do that faithfully, with courage and unwavering integrity, and you will truly honor the oath you took today. Godspeed in your service. Go well.

  ---

