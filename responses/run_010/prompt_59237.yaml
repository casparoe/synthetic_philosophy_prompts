prompt: |-
  Was in an argument on a rationalist Discord about how much research effort it takes to be rational about picking something like a career path or a charity. I said you should at least compare a handful of options instead of going with the first thing that clears some bar, and the other guy answered 'the best is the enemy of the good' and then 'satisficing is rational, nobody's required to maximize' — and dropped Herbert Simon's name like it settles it. We talked past each other for two hours and I still can't say what went wrong.

  Can you pull that slogan apart into the separate claims it could be making? I want the full ladder: the readings that are just true and say nothing, the one Simon was actually defending, the one where satisficing turns out to be maximizing once you price in the cost of the search, and the genuinely radical one where it's fine to leave free value on the table. For each, say whether it survives contact and what the standard objection to it is. Then tell me which reading he actually needed to shut down my point — my suspicion is the trivial ones don't get him there and the strong one is the one that's hard to hold onto.

  Two extra things: is 'good enough' just relocating the optimization problem rather than escaping it, via the aspiration level? Real objection or gotcha. And does any of this have to do with the maximizer-vs-satisficer personality stuff people cite, or is that a totally different claim that's getting smuggled in?
