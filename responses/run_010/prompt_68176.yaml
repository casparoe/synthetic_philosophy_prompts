  Okay, the user is a novelist who's been stuck for two years researching a 19th-century surveying expedition. They've hit a wall with two conflicting interpretations of the expedition's end, both supported by the same limited documents. The issue is that historians have split into two camps, each reinterpreting new evidence to fit their view. The user sees this same pattern in their manuscript where readers are split on a character's motive. They want to know if there's a name for this specific phenomenon.

  First, I need to unpack the core issue: a fixed set of documents with no new evidence possible, two comprehensive interpretations that explain all existing evidence, and each camp reinterpreting any new findings to maintain their narrative. The user knows about underdetermination and Rashomon effect but feels those don't fit perfectly. Rashomon involves conflicting eyewitness accounts, but here there are no witnesses—just documents reinterpreted after the fact.

  The concept that comes to mind is hermeneutic closure. Hermeneutics deals with interpretation, especially texts. Closure here means the interpretive system is self-sealing. Each camp's framework is a hermeneutic circle, where the whole interpretation shapes the parts and vice versa. Any new evidence gets incorporated without changing the overall view because the framework adjusts to include it. That fits the historian camps and the beta readers' split on the character's motive.

  But is there a more precise term? Duhem-Quine thesis says evidence alone can't confirm a theory since theories are tested in bundles. But it's more about scientific theories. The user's case is about historical interpretation. So hermeneutic closure seems closer. 

  Also, confirmation bias plays a role, but it's not structural like the closed evidence system. Motivated reasoning is part of it, but the user wants the structural aspect. 

  The user mentions paradigms. Kuhn's paradigms involve shifts in scientific consensus, but here the camps coexist without one overtaking. So not exactly. 

  I should also consider if the expedition qualifies. The user has a fixed evidence set, two interpretations accounting for all data, and no future data possible. The camps thrive by reinterpreting findings. That matches. 

  For a coined term, maybe "hermeneutic stalemate" or "interpretive incommensurability." But defining it: closed evidence system, exhaustive but incompatible interpretations, no possible decisive evidence, and self-sealing mechanisms. 

  A near-miss example: textual criticism debates where scholars have different readings of a manuscript. But if new fragments are found, it might resolve. In the user's case, no new evidence is possible. So that's a key difference. 

  The user's own expedition qualifies if no new documents can appear. They mentioned the record is closed. So yes. 

  Also, the beta reader split mirrors this: fixed text, two interpretations, readers' preconceptions shape their reading. The revisions don't change their views because they reinterpret the text to fit. 

  So the answer should explain hermeneutic closure, distinguish from near-misses, define the coined term, and confirm their case fits.
answer: |-
  What you're describing isn't perfectly captured by any single established term, but several concepts brush against it. Crucially, your case adds a specific *structural* element: **a *closed* body of evidence with no possibility of new data, supporting two equally comprehensive, internally consistent, and *self-sealing* interpretations that become entrenched in distinct scholarly communities.** Let's dissect the near-misses and then coin the term:

  1.  **Underdetermination of Theory by Evidence (Duhem-Quine Thesis):**
      *   **What it is:** The idea that any finite body of evidence can be explained by multiple, logically incompatible theories. Evidence alone cannot conclusively choose one theory over another.
      *   **Where it fits:** Perfectly explains the *possibility* of the two interpretations existing based on the same evidence.
      *   **Where it stops:** It's a *logical* point about evidence/theory relationships. It doesn't address the *sociological* phenomenon of sustained, active, *productive* scholarly communities thriving on *each* interpretation within a *closed* system, constantly "repairing" their frameworks. It also doesn't inherently imply the evidence set is fixed and finite with no future adjudication possible.

  2.  **Hermeneutic Circle / Hermeneutic Fore-structure (Heidegger/Gadamer):**
      *   **What it is:** The idea that understanding a text (or event) is always shaped by pre-existing assumptions, expectations, and the interpreter's "horizon." Interpretation is circular: the whole is understood in terms of the parts, and the parts in terms of the whole. Our pre-understanding shapes what we see and how we interpret details.
      *   **Where it fits:** Explains *why* the interpretations are self-sealing ("repairs are always individually reasonable"). New "awkward" evidence is interpreted through the lens of the existing whole framework (the camp's narrative), changing the meaning of the part (the evidence) to fit. This directly mirrors your beta readers' interpretations of your character's motive via the same sentences.
      *   **Where it stops:** While fundamental to *how* interpretation works, it's a general principle of understanding, not a specific label for the *sociological outcome* you describe (two thriving camps based on incompatible interpretations of a *closed* archive). It doesn't inherently emphasize the *closed* nature of the evidence or the impossibility of future decisive data.

  3.  **Paradigm Incommensurability (Kuhn):**
      *   **What it is:** During scientific revolutions, proponents of competing paradigms (like Newtonian vs. Einsteinian physics) literally see the world differently, use different concepts, value different problems and standards, and find it difficult to communicate across paradigms. Evidence is evaluated *within* a paradigm.
      *   **Where it fits:** Captures the idea that the two camps "speak different languages" and see the *same evidence* as meaning fundamentally different things. Their frameworks are self-contained systems of meaning. The "repairs" are paradigm-maintenance.
      *   **Where it stops:** Kuhn focused on large-scale scientific revolutions where one paradigm eventually displaces another. Your case involves *co-existing*, non-displacing interpretations of a *single historical event* based on a *fixed, limited archive*. It's less about a revolutionary shift and more about permanent, parallel interpretations nurtured within distinct scholarly niches. The "incommensurability" is present, but the scale and context differ.

  4.  **Motivated Reasoning / Confirmation Bias:**
      *   **What it is:** The tendency to interpret, favor, and recall information in a way that confirms one's preexisting beliefs or hypotheses.
      *   **Where it fits:** Explains the *psychological mechanism* driving the "repairs" within each camp. Scholars in Camp A instinctively find ways to make new findings fit Camp A's narrative.
      *   **Where it stops:** These are individual cognitive biases. Your phenomenon is a *structural and sociological* outcome arising *from* these biases operating within the specific constraints of a *closed system* supporting *two equally viable comprehensive interpretations*. It's the emergent system, not just the individual tendency.

  5.  **The Rashomon Effect:**
      *   **What it is:** The phenomenon where different witnesses provide significantly different, seemingly credible, yet contradictory accounts of the same event, often due to subjective perception, memory distortion, or self-interest.
      *   **Where it fits:** Captures the existence of incompatible narratives.
      *   **Where it stops:** As you noted, Rashomon relies on *contemporaneous, subjective witness testimony*. Your case involves the *retroactive interpretation of a fixed, limited documentary record by historians*, not conflicting primary eyewitness accounts. The "witnesses" are the historians themselves, interpreting the *same* texts differently long after the fact.

  **Why Your Case Doesn't Have a Perfect Name:** Existing terms focus on the *logical* possibility (Underdetermination), the *process* of interpretation (Hermeneutic Circle), the *psychological* drivers (Motivated Reasoning), or *large-scale scientific shifts* (Paradigm Incommensurability). None explicitly combine the critical elements of:
  1.  **Closed Archive:** A finite, fixed body of evidence with *no possibility* of new, decisive data.
  2.  **Comprehensive Interpretive Closure:** Two (or more) interpretations that each provide a *complete*, internally consistent account of *all* existing evidence within their own framework.
  3.  **Structural Self-Sealing:** Each interpretation possesses inherent mechanisms (rooted in hermeneutics and bias) to absorb and reinterpret *any* potential "awkward" evidence without falsifying the core narrative ("always individually reasonable" repairs).
  4.  **Entrenched Scholarly Bifurcation:** The formation and sustained productivity of distinct scholarly communities built around each interpretation, thriving *because* of the closure and self-sealing nature (it allows endless refinement *within* the framework).

  **Coining the Term: Hermeneutic Stalemate in a Closed System (HSCS)**

  *   **Definition:** A situation arising from the interpretation of a **fixed and finite body of evidence** where:
      1.  **Exhaustive Interpretive Closure:** Two (or more) comprehensive, internally coherent interpretive frameworks emerge, each capable of accounting for *every* piece of existing evidence within its own logic.
      2.  **Structural Self-Sealing:** Each framework possesses inherent mechanisms (hermeneutic principles combined with motivated reasoning) to absorb, reinterpret, or minimize the significance of any evidence that *prima facie* appears challenging, rendering the interpretation effectively unfalsifiable *within the bounds of the existing archive*.
      3.  **No Adjudication Possible:** Due to the closure of the evidence set, there exists no conceivable future discovery capable of empirically or logically compelling proponents of one framework to abandon it in favor of another. The interpretations are fundamentally underdetermined *and* insulated from falsification.
      4.  **Scholarly Bifurcation & Entrenchment:** The existence of these frameworks leads to the formation of distinct, active scholarly communities. These communities thrive by continuously refining their respective interpretations internally, deepening the coherence within each framework and widening the gap between them, often fueled by the very act of defending against the *implied* challenge of the other framework.

  *   **Conditions to Qualify as HSCS:**
      1.  A finite, closed corpus of evidence with no prospect of significant new primary data.
      2.  At least two distinct, comprehensive interpretive frameworks developed *for that specific corpus*.
      3.  Each framework demonstrably accounts for *all* evidence within the corpus through its own interpretive logic.
      4.  Demonstrable instances of each framework successfully "repairing" apparent counter-evidence through reinterpretation consistent with its core logic.
      5.  Evidence of sustained scholarly activity and community formation around *each* framework, characterized by internal refinement rather than attempts (or realistic hope) to decisively refute the other framework(s) using the existing evidence.

  *   **Does Your Expedition Qualify?** Absolutely. It's a textbook case:
      *   **Closed Archive:** Ship's log with gaps, letters, memoirs. "That's everything. There will never be any more of it."
      *   **Exhaustive Interpretive Closure:** Two accounts, each citing *all* documents, each giving them meaning within their own narrative ("handles it better... reads the same letter as meaning something slightly different").
      *   **Structural Self-Sealing:** "Each account quietly repairs itself whenever something awkward turns up. The repairs are always individually reasonable."
      *   **No Adjudication Possible:** "I've come around to thinking no discovery could break the tie now... whatever surfaced would be read through whichever account you already hold."
      *   **Scholarly Bifurcation & Entrenchment:** "The people who study this expedition... sorted themselves into two separate camps, each going on producing careful, footnote-dense, utterly convincing work."

  *   **A Near-Miss That Isn't HSCS: The Shakespeare Authorship Question.**
      *   **Why it looks similar:** Fixed body of evidence (plays, poems, limited biographical records), multiple interpretations (Stratfordian, Oxfordian, Baconian, etc.), passionate scholarly camps, reinterpretation of evidence within each camp.
      *   **Why it's NOT HSCS:** While the *core* biographical evidence is limited, it's **not truly closed in the *interpretive* sense relevant to HSCS.** The arguments heavily rely on *interpretations of the texts themselves* (stylometrics, alleged hidden meanings, biographical parallels). Crucially, *new textual analysis techniques or discoveries about Elizabethan theatre practices could, in principle, provide decisive evidence* (e.g., a definitively authenticated contemporary document naming the author, or a breakthrough in stylometric analysis accepted by all sides). The possibility, however remote, of future decisive data distinguishes it from your expedition's absolute closure. The camps also often rely on arguments *beyond* the primary archive (e.g., claims about noble education being necessary), which isn't pure interpretation of the fixed documents.

  **Your Manuscript Scene:** This is a *perfect microcosm* of HSCS applied to fiction. The fixed text (your scene) becomes the closed archive. Readers arrive with pre-existing interpretive frameworks (shaped by prior reading, character expectations, genre conventions). The ambiguous motive allows two comprehensive, coherent readings ("knew/didn't know"). The *same sentences* are the evidence interpreted differently within each framework ("both halves point at the same sentences as proof"). Revisions are futile because they are simply new "finds" absorbed into the existing reader's framework ("every version gets read straight back into whichever camp the reader was already in"). The "repairs" are the readers' own interpretations smoothing over ambiguity to fit their chosen reading.

  **In essence, HSCS describes the point where historical (or literary) interpretation, faced with a hard boundary of evidence, bifurcates into permanently viable, self-sustaining, and mutually exclusive realities.** It's not just that we don't know; it's that the structure of the evidence and interpretation *makes definitive knowing impossible* and instead fosters parallel, thriving worlds of meaning. Your expedition is a prime example, and your novel is wrestling with the same fundamental structure of ambiguity and interpretation. Recognizing it as HSCS might be the key to writing *through* the trap, not just around it.
