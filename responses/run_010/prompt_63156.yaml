prompt: |-
  Act as a philosopher of interpretation who's spent years in the intentionalism debates — I want adjudication, not a survey. Quick problem from my actual life: I'm one of five people on the board that runs a mid-century novelist's literary archive. We license adaptations, sign off on the annotations for the critical edition, and every so often we have to rule on what a passage means when somebody claims it means something she'd have hated. Our track record so far:

  1. Two years after publication she told an interviewer that the famous line in ch. 3 was meant ironically. The line reads perfectly straight, the words can carry the irony, and the ironic reading is the one most critics prefer. We endorsed the irony and glossed it that way in the edition.
  2. In 1994 a private letter surfaced, written the year the book came out, telling a friend that the uncle is her brother. The text doesnt resist it, but treating the novel as a roman à clef flattens its best scenes. We refused the gloss, and refused an adapter who wanted to lean on it.
  3. A scholar argued from the surviving drafts that she abandoned an ending in which the protagonist lives. We said the abandoned ending has no bearing on meaning, but agreed to print it as an appendix.
  4. In a lecture in the 70s she insisted the novel is not about the war. Everyone reads it as a war novel, and the war reading is what holds the thing together. We left the war reading standing and noted the lecture.

  New case, vote in three weeks. We've just catalogued a private notebook in her hand that spells out what she meant by the knot in part three — the passage people have argued over for fifty years. The reading the notebook supports is one the text can obviously bear, and honestly its better: it untangles the knot. Nobody saw the notebook in her lifetime, and nothing in the published book points at it.

  Start by brainstorming every principle that could account for all four verdicts, including ones that aren't in the standard taxonomy, and note where a principle is just a familiar position from the literature wearing a disguise. Kill the ones the record kills. Then tell me what each surviving principle says about the notebook, which precedent is the closest analog and exactly where that analogy breaks, and what we should vote if consistency with ourselves is the goal. If the precedents genuinely run out here, say plainly which principle we'd be committing to by voting yes and which by voting no. Last thing: name the one hypothetical case that would best separate the principles still standing after those four verdicts.
reasoning: |-
  Okay, the user is on the board of a literary archive and needs help deciding whether to use a newly discovered notebook to interpret a knotty passage in a novel. They've provided four past cases and want a principled approach that's consistent with their previous decisions. Let me start by understanding their precedents.

  In Case 1, they endorsed the author's statement about irony even though the text read straight. The ironic reading was plausible and preferred by critics. Case 2 rejected a private letter identifying a character as her brother because it flattened the novel. Case 3 dismissed abandoned drafts as irrelevant to meaning but included them as an appendix. Case 4 kept the war reading despite the author's denial because it's integral to the text.

  The key principles here seem to balance authorial intent against textual integrity and public meaning. The board values what the text can support but rejects private intentions that contradict the work's artistic merit. The notebook in the new case offers a resolution that the text can bear and improves it, but wasn't known during her lifetime.

  Looking at intentionalism debates, actual intentionalism might support using the notebook, but Case 2 rejected a private letter. Hypothetical intentionalism could work since the notebook's reading enhances the text, similar to Case 1's irony. Textualism might resist, but Case 1 used external evidence. The board's approach seems pragmatic: authorial input is valid if it coheres with the text and enriches it without undermining the work.

  Case 1 is the closest precedent because both involve the author's direct statements, but the notebook was private, unlike the interview. The analogy breaks on publicity. However, since the text supports it and it improves the passage, voting yes aligns with their pattern of accepting authorial insight that enhances understanding without compromising the text's integrity. Consistency suggests endorsing the notebook's reading.

  A hypothetical to test remaining principles: if the author's note offered an interpretation the text couldn't support, would they still include it? Their history suggests not, as they prioritize textual coherence. So voting yes commits to a moderate actual intentionalism, where private intent is valid if it fits and enriches the text.
answer: |-
  Here’s the adjudication you requested, distilled from your precedents. I’ll move swiftly—consistency is the knife-edge here.

  **Brainstormed Principles (Accounting for All Four Verdicts):**
  1.  **Textual Sovereignty (Modified):** Meaning resides in the public text *as it can be reasonably interpreted*. Authorial input is admissible *only* if:
      *   (a) The text demonstrably supports it (Cases 1, 4),
      *   (b) It doesn’t actively *diminish* the work’s artistic coherence or value (Cases 2, 4).
      *   *Disguise:* A pragmatic hybrid of moderate textualism and hypothetical intentionalism (author's *reasonable* public intent).
  2.  **Authorial Voice as Corrective (Not Determinative):** The author’s *explicit, public* statements about meaning post-publication can clarify *possible* textual meanings (Case 1), but not override the text’s inherent structure or artistic success (Case 4). Private evidence (letters, drafts, notes) is *inadmissible* for core meaning if it contradicts the public text’s best reading (Cases 2, 3) or wasn’t public.
      *   *Disguise:* Strong actual intentionalism filtered through a publicity requirement and an aesthetic constraint.
  3.  **Aesthetic Integrity Primacy:** The primary goal is preserving/affirming the interpretation that yields the *richest, most coherent, and artistically successful* reading of the text as published. Authorial intent (public or private) is evidence *towards* that goal, but discarded if it flattens or undermines the work (Cases 2, 4). Drafts show process, not product (Case 3).
      *   *Disguise:* Value-maximizing textualism or "best meaning" theory.
  4.  **Rejected Principles (Killed by the Record):**
      *   *Strict Actual Intentionalism:* Rejected by Case 4 (author’s public denial ignored) and Case 2 (private intent ignored).
      *   *Radical Textualism/Death of the Author:* Rejected by Case 1 (author’s statement *used*).
      *   *Biographical Determinism:* Rejected by Case 2 (private letter ignored).
      *   *Genetic Fallacy Acceptance:* Rejected by Case 3 (drafts irrelevant to meaning).

  **Surviving Principles & The Notebook:**
  1.  **Textual Sovereignty (Modified):**
      *   **Says about Notebook:** The notebook *is* admissible evidence because the text "obviously can bear" the reading and the reading "untangles the knot" (improves coherence/interpretability). It meets criteria (a) and (b). The lack of publicity *might* be a concern, but the aesthetic benefit overrides it here.
      *   **Verdict:** **Yes** (Use the notebook reading).
  2.  **Authorial Voice as Corrective (Not Determinative):**
      *   **Says about Notebook:** This is problematic. The notebook is *private* and *unpublished*, unlike Case 1 (public interview). Case 2 explicitly rejected private evidence (letter) for meaning, even though the text could bear it, because it diminished the work. The notebook reading "untangles," but its private nature places it firmly in the inadmissible category per Case 2.
      *   **Verdict:** **No** (Do not use the notebook reading).
  3.  **Aesthetic Integrity Primacy:**
      *   **Says about Notebook:** This principle strongly favors using the notebook. The key facts are: the text supports it ("obviously can bear"), and it yields a *better* reading ("untangles the knot," "its better"). The artistic improvement is paramount. The private nature is irrelevant; the goal is the best reading of the *published text*, and this evidence demonstrably improves it.
      *   **Verdict:** **Yes** (Use the notebook reading).

  **Closest Precedent & Breaking Point:**
  *   **Closest:** **Case 1 (Interview/Irony)**. Both involve the author explicitly stating an intended meaning that clarifies an ambiguous passage, which the text supports and which critics/readers find compelling/aesthetically beneficial.
  *   **Breaking Point:** **Publicity**. Case 1 was a *public* statement during the work's reception lifetime. The notebook is *private*, unknown until now. Case 2 (Private Letter) is the counterpoint, where private evidence was rejected *despite* textual plausibility due to aesthetic detriment. The Notebook case lacks the aesthetic detriment of Case 2 but shares the privacy of Case 2, conflicting with the publicity of Case 1. **The analogy breaks on whether the *privacy* of the evidence is fatal *even when* it demonstrably improves the aesthetic coherence (unlike Case 2).**

  **Verdict for Consistency:**
  *   **Vote: YES** (Endorse the notebook reading for the critical edition gloss).
  *   **Reasoning:** Principles 1 (Textual Sovereignty Modified) and 3 (Aesthetic Integrity Primacy) align on **Yes** and best explain the *dominant pattern* across all cases, especially the decisive rejection of intent that *harms* the work (Cases 2 & 4) and the embrace of intent that *clarifies/enhances* a plausible textual reading (Case 1). Principle 2 (Authorial Voice as Corrective) is the outlier, primarily supported only by Case 2. However, Case 2’s rejection was driven *more* by the aesthetic detriment ("flattens its best scenes") than *solely* by its privacy. Since the notebook reading *improves* the aesthetic coherence ("untangles the knot"), the core driver of your precedents (aesthetic/textual integrity) overrides the privacy concern. Consistency demands privileging the aesthetic gain, as you did in Case 1, over the private nature, as the harm in Case 2 was the key factor, not just privacy.

  **Commitment by Vote:**
  *   **Voting YES:** Commits you to a **Moderate Actual Intentionalism filtered through Aesthetic Coherence and Textual Plausibility** (or "Value-Maximizing Actual Intentionalism"). You prioritize discoverable authorial intent *if and only if* it aligns with the public text and enhances the work's artistic value. Privacy is a secondary concern.
  *   **Voting NO:** Commits you to a **Strong Public Meaning Textualism with Authorial Commentary as Public Clarifier Only**. Authorial intent *must* be publicly accessible (during reception or via the text itself) to count for core meaning. Private evidence is strictly genetic/historical, not interpretive.

  **The Separating Hypothetical:**
  *   **The Case:** "A private journal entry, written *after* publication but unknown until now, reveals the author intended a specific, *flatly literal* reading of a passage universally read as profound symbolic allegory. The literal reading is grammatically possible but renders the passage banal and severs its thematic connections to the rest of the novel. The text *can* technically bear the literal reading, but it drastically diminishes the work's artistic stature and coherence."
  *   **Why it Separates:**
      *   **Principle 1 (Textual Sovereignty Modified):** Likely **REJECT**. The text *can* bear it (a), but it *diminishes* artistic coherence/value (violates b).
      *   **Principle 2 (Authorial Voice as Corrective):** Likely **REJECT**. Private evidence + diminishes the work (like Case 2).
      *   **Principle 3 (Aesthetic Integrity Primacy):** **REJECT**. It diminishes the work's artistic value/coherence.
      *   **Contrast with Notebook Case:** Here, the author's private intent *harms* the best reading, whereas in the Notebook case, it *enhances* it. This tests whether the *aesthetic outcome* is the true driver (Principles 1 & 3) or whether *privacy itself* combined with detriment is key (Principle 2). Your vote on *this* hypothetical would starkly reveal if privacy *alone* is a veto point when harm is present, or if harm is the decisive factor regardless of publicity.

  **Final Adjudication:** Vote **YES** on the notebook. Your precedents reveal a board prioritizing interpretations that unlock the text's richest coherence and artistic success, using authorial insight as a key when it serves that goal, regardless of its original privacy. The notebook meets this criterion definitively.
