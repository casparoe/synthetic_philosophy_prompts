  Okay, the user is a lay commissioner on a drainage district board, tasked with predicting how the chair, Harlan Voss, will vote in an upcoming flood management decision. They've provided six past determinations by Voss and need help analyzing the pattern to predict the February case. The user's personal home is at stake, so this is urgent and concrete for them.

  First, I need to understand Voss's apparent decision-making pattern from the six cases. Let me list them chronologically with key factors:

  1. **Spring 2004 (Morgan Bend):** Permissible - Flooded farmland that would've flooded anyway. No lives at risk, no prior assurances. Essentially accelerated inevitable damage.

  2. **Summer 2008 (Dry Creek Hollow):** Impermissible - Actively flooded dry homes to save commercial property. Created new harm where none was imminent.

  3. **Spring 2011 (Farrow Street):** Permissible - Allocated limited resources to critical infrastructure (hospital) over insured homes in designated floodway. No prior promises made.

  4. **Autumn 2013 (Kessler outlet):** Impermissible - Actively damaged private property (farmer's land) to save public infrastructure. Direct causation of harm.

  5. **Winter 2016 (Station 12):** Permissible - Withheld protection from non-residential, non-promised area to prioritize homes. Resource allocation during shortage.

  6. **Autumn 2019 (Hollis Bend):** Impermissible - Withdrew existing protection (closed culvert) that caused flooding, despite prior assurances in plats/brochures.

  Now looking at the February dilemma: Choosing between protecting the Bottoms (400 older homes, historically protected, many uninsured) or Sable Road (900 newer insured homes, no protection promises). Key conflict points:
  - Bottoms has historical protection status and reliance
  - Sable Road has greater immediate risk (boil) and larger population
  - Bottoms residents explicitly relied on protection
  - Sable Road residents knew they were in residual risk zone

  The user mentions four potential rules Voss might use:
  1) Origin of threat (district-caused vs natural)
  2) Counterfactual (what if district never existed)
  3) Withdrawal of existing protection vs not starting new
  4) Assurances/reliance

  From the cases, Rule 3 (withdrawal vs withholding) and Rule 4 (assurances) seem strongest. Hollis Bend (impermissible) parallels Bottoms - both involve withdrawing existing protection people relied on. Station 12 (permissible) parallels Sable Road - both involve not starting protection where none was promised.

  For the hypothetical test case, I need something that would split between Rules 3 and 4. Maybe a scenario where protection was promised but never actually provided - does withdrawal apply if protection wasn't operational yet? That would distinguish between physical withdrawal and breach of promise.

  Institutional implications matter too. If they protect Bottoms, they commit to maintaining legacy promises regardless of cost. If they choose Sable Road, they prioritize immediate risk/numbers over historical assurances. This could trigger new disclosure requirements either way.

  The user's personal stake makes this delicate - they need objective analysis despite emotional investment. My response should focus on helping them build a persuasive case for Voss, not advocate for either outcome. The detailed precedent analysis is crucial for their memo.
answer: |-
  Based on your analysis of Voss's determinations, four candidate rules emerge as plausible explanations for his decisions. I'll analyze each rule, apply it to the February case, identify the closest precedent, predict Voss's vote with reasoning, provide a clarifying hypothetical, and outline the institutional commitment for each outcome.

  ---

  ### **Candidate Rules & Their Application to February**
  1.  **Rule of Origin/Active Harm:** Actions that *create* a new threat or harm where none existed are impermissible. Actions that merely *fail to prevent* harm from a pre-existing natural threat or accelerate inevitable harm are permissible.
      *   **February Application:** Protecting Sable Road involves *preventing* a natural threat (seepage boil). Protecting the Bottoms involves *withdrawing* existing protection (Station 7), potentially creating harm where none would occur if protection continued. *Leaning Impermissible for Bottoms abandonment.*
  2.  **Rule of Natural Baseline:** Decisions are permissible if they result in outcomes no worse than if the district never existed or intervened at all. Impermissible if they make things worse than that baseline.
      *   **February Application:** Without the district, *both* areas flood due to inherent risk. Protecting one area inherently leaves the other to flood, matching the baseline. The Bottoms' historical dryness is *due* to district intervention. *Leaning Permissible for either choice.*
  3.  **Rule of Reliance & Withdrawal:** Withdrawing an *existing, relied-upon protection* (especially one promised) is impermissible. Merely *failing to initiate* protection where none existed or was promised is permissible.
      *   **February Application:** Shifting protection away from Station 7/Bottoms constitutes *withdrawing* a relied-upon protection (evidenced by removal from high-risk maps, refinancing memo, residents moving in based on designation). Shifting protection *to* Sable Road is *initiating* protection where none was promised or expected. *Leaning Impermissible for Bottoms abandonment.*
  4.  **Rule of Explicit Assurance:** Actions violating explicit, documented assurances (plats, brochures, official designations) made by or binding on the district are impermissible. Actions consistent with known risks or lacking specific promises are permissible.
      *   **February Application:** Bottoms has explicit assurances (removal from high-risk map, "protected reach" in 2019 memo). Sable Road has explicit *lack* of assurance ("residual risk", no representation of protection). *Leaning Impermissible for Bottoms abandonment.*

  ---

  ### **Closest Analog Precedent & Why**
  *   **Hollis Bend (2019) is the closest analog.** Both involve:
      1.  An *existing, operational protection* relied upon by residents (culvert gate open / Station 7 operational).
      2.  *Documented assurances* (plat/sales brochures / map removal & refinancing memo).
      3.  A district decision to *stop* that protection for operational convenience/prioritization, *causing flooding* that wouldn't have otherwise occurred at that moment.
      4.  Voss ruled it **Impermissible**.
  *   **Station 12 (2016) is less analogous:** It involved *failing to initiate* protection for an unprotected, non-residential area with *no prior assurances* to prioritize a protected residential area. Sable Road resembles Station 12's *lack* of prior protection/assurance, but Station 12 doesn't involve *withdrawing* an existing protection from a reliant population.

  ---

  ### **Prediction for Voss's February Vote & Why**
  *   **Predicted Vote:** **Impermissible** to abandon Station 7 / the Bottoms. Protect Sable Road.
  *   **Reasoning & Preferred Rule:** Rules 3 (Reliance & Withdrawal) and 4 (Explicit Assurance) best explain the pattern and align perfectly with the Hollis Bend precedent – the strongest analog.
      *   **Rule 1 (Origin):** Supports this outcome but is less consistent (Farrow Street involved *withholding* protection, which was permissible; Hollis Bend involved *withdrawing*, impermissible).
      *   **Rule 2 (Baseline):** Is too permissive and doesn't explain the impermissible rulings (Dry Creek Hollow, Kessler, Hollis Bend all arguably met the baseline *eventually*, but active harm/withdrawal mattered).
      *   **Rule 3 & 4:** Directly explain *why* Hollis Bend was impermissible (withdrawal of relied-upon/assured protection) and why Station 12 was permissible (no withdrawal, no assurance). They also explain Dry Creek Hollow (active creation of harm) and Kessler (active harm to assured property rights) as impermissible, and Farrow Street (withholding, no assurance) and Morgan Bend (accelerating inevitable) as permissible. The Bottoms' documented "protected reach" status and resident reliance mirror Hollis Bend's assured drainage. Sable Road's "residual risk" status mirrors Station 12/Farrow Street.

  ---

  ### **Distinguishing Hypothetical Case**
  *   **Scenario:** A new development ("Sunny Acres") is built in 2025 within the district's theoretical service area but *outside* any formally protected reach or mapped floodway. The *preliminary* developer plat submitted to the county (but *not* yet approved or recorded) mentions "potential future connection to District drainage." The district *has never* reviewed, approved, or commented on this plat. During a 2027 flood, the district has resources to protect either Sunny Acres (50 homes, dry so far) or a long-protected industrial park (200 jobs, assured protection). Protecting Sunny Acres requires activating pumps never before used there.
  *   **Difference Under Rules:**
      *   **Rule 3 (Reliance & Withdrawal):** *Permissible* to protect the industrial park. Protecting Sunny Acres would be *initiating* new protection (like Station 12/Sable Road), not *withdrawing* existing protection. Failing to protect Sunny Acres doesn't withdraw anything they had.
      *   **Rule 4 (Explicit Assurance):** *Also Permissible* to protect the industrial park. The developer's *unapproved* plat note is not an explicit assurance *by the district*. The industrial park has explicit assurances.
      *   **Where Rules Diverge:** If, hypothetically, the district had *formally approved* the Sunny Acres plat *including* the drainage note *and* had connected the drainage system pre-2027 (making it operational), then:
          *   Rule 3 (Withdrawal) would make abandoning it **Impermissible** (operational system withdrawn).
          *   Rule 4 (Assurance) *might still be Permissible* if the district argued the plat note was only "potential future," not a firm guarantee, and the protection wasn't yet demonstrably "relied upon" by residents moving in. This tests the boundary between documented "potential" vs. firm "assurance" and the operational status requirement of Rule 3.
  *   **How to Present to Voss:** "Chairman Voss, regarding the principle applied in Hollis Bend: If a development's *approved and recorded* plat described it as 'eligible for district drainage upon connection' *and* the district had connected it and operated the drainage for a season, but then faced a choice to divert those resources during a flood, would diverting them constitute an impermissible withdrawal of protection? Or would the lack of a firm guarantee in the original designation make it permissible, like simply not starting protection at Station 12?"

  ---

  ### **Principle Committed To & Required Changes Based on Vote**
  *   **If Vote: Impermissible to Abandon Bottoms (Protect Bottoms):**
      *   **Principle Committed To:** The district is bound to maintain existing protection indefinitely for areas explicitly designated as protected or where residents demonstrably rely on continuous protection, even if protecting newer/higher-risk areas appears more efficient or protects more people/property. Historical reliance and explicit assurances create a paramount obligation.
      *   **Required Changes:**
          1.  **Formalize "Protected Reach" Status:** Create a legally defined category for areas like the Bottoms, with explicit criteria and binding commitments.
          2.  **Strict Scrutiny for Map Changes:** Any future proposal to remove an area from a protected designation must undergo rigorous review and potentially compensate residents.
          3.  **Enhanced Disclosure:** Require significantly stronger, legally-vetted disclosures to residents in "protected" areas outlining the limits of the guarantee (e.g., "protected *if resources allow*").
          4.  **Resource Allocation Priority:** "Protected Reach" areas must be prioritized for maintenance and resource allocation during events, potentially at the expense of non-protected areas even if larger/more valuable.
          5.  **Risk Pooling/Insurance Mandate:** Consider mechanisms (e.g., special assessments) to ensure adequate insurance or district reserves for "protected" areas, as federal requirements don't apply.
  *   **If Vote: Permissible to Abandon Bottoms (Protect Sable Road):**
      *   **Principle Committed To:** The district retains full operational discretion during emergencies to allocate resources based on current risk assessment, efficiency, and maximizing overall protection/benefit, regardless of historical protection status or past designations, provided no *active harm* is done or *explicit contractual guarantee* is violated. Past dryness due to district action does not create a perpetual entitlement.
      *   **Required Changes:**
          1.  **Reinterpret "Protected" Designations:** Issue clear guidance/policy that terms like "protected reach" or map removals signify *past performance only* and do *not* constitute a guarantee of future protection.
          2.  **Revise Public Communications:** Overhaul all public materials (maps, memos, websites) to explicitly state that *all* protection is contingent on resource availability and operational priorities during events, even in areas historically kept dry.
          3.  **Mandatory High-Risk Disclosure:** Require sellers/landlords in areas historically protected by district infrastructure (like the Bottoms) to disclose the *continuing underlying flood risk* and the *contingent nature* of district protection, regardless of official map status.
          4.  **Operational Protocols:** Develop clear, risk-based prioritization protocols for resource allocation during shortages, potentially deprioritizing older, less dense, or uninsured areas even if historically protected.
          5.  **Abandonment Procedures:** Establish formal procedures (notification, documentation) for when protection is withdrawn from a historically protected area.

  ---

  **Conclusion:** Based on the strong alignment of Rules 3 (Reliance & Withdrawal) and 4 (Explicit Assurance) with Voss's past rulings, especially the Hollis Bend precedent, the prediction is that Voss will vote **Impermissible** to abandon the Bottoms, requiring the district to protect it and let Sable Road flood. This would commit the district to upholding historical protections based on reliance and explicit assurances, demanding significant changes to how it defines, communicates, and prioritizes "protected" areas. Prepare for the furnace.
