  Hmm... the opponent's argument is clever but overreaches. Points 1-4 are solid - the "every civilization thinks they're special" trope is indeed well-documented in Tetlock etc. But step 5 is where it derails by claiming inside-view can never adjust base rates. That's not how proper Bayesian updating works! 

  Ah, and the user spotted the self-refutation in step 8-9 - the reference class construction itself requires inside-view judgments. They're right that this torpedoes the absolutist position. But instead of abandoning base rates entirely, we need to recognize this as a constraint on their precision.

  The user's concrete concern about modern world order longevity needs addressing too. They listed valid inside-view factors (nukes, globalization) that do legitimately differentiate this era. The key is showing how to weigh those against historical patterns without falling into "this time is different" hubris.

