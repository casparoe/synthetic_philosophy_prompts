  **Research Proposal: The Autonomy of Semantic Norms: A Graded Approach to Intentionality**

  **1. Introduction and Research Question**

  The traditional dispute about intentionality centers on whether a state's aboutness is intrinsic (as per Searle) or interpretation-relative (as per Dennett). Both sides assume that content is determinate and that the only question is the source of that determinacy. This project challenges that shared assumption and reframes the issue by asking: *What makes the content of a state determinate?* Specifically, we propose that the key feature is the *autonomy of the semantic norm*—the degree to which the system itself sets the standard for when a state is correct or incorrect. This autonomy is graded, not binary.

  The research question is: **Can the autonomy of the semantic norm, as a graded feature, provide a more fruitful framework for understanding intentionality than the binary intrinsic/derived distinction?** A "yes" would mean that the ladder of cases (detailed below) reveals a spectrum of autonomy that maps onto intuitive and theoretical distinctions in a way that the traditional binary cannot, and that this spectrum avoids the pitfalls of both intrinsicness and interpretation-relativity. A "no" would mean that the autonomy spectrum either collapses into existing categories or fails to provide new explanatory power.

  The claim we seek to fund is: **The autonomy of the semantic norm is a graded feature that explains the determinacy of content and resolves the impasse in the intrinsic/derived debate.**

  **2. Limitations of Existing Approaches**

  The intrinsicness view (Searle) holds that genuine intentionality requires intrinsic content, immune to outside interpretation. The Chinese Room argument is deployed to show that derived content (via interpretation) is not real intentionality. The interpretation-relativity view (Dennett) counters that all content is relative to an interpretive context, as illustrated by the two-bitser (a component that can be interpreted as a bit in different ways). Both views, however, assume that content is determinate and only disagree on the source.

  Naturalistic middle routes (e.g., Millikan's teleosemantics based on biological function, or Dretske's information-based account) ground content in causal or functional roles. But these do not capture the autonomy of the norm. For instance:
  - Teleosemantics ties content to evolutionary history, but the norm is fixed by past selection pressures, not the system's current autonomy.
  - Information-based accounts tie content to causal covariance, but without a norm of correctness (e.g., a tree ring carries information about age, but it's not "wrong" if the ring is damaged).

  Our proposal does not deny that biological function or information may be part of the story, but argues that the autonomy of the norm—the degree to which the system itself sets and enforces the standard of correctness—is an additional, graded dimension that is not reducible to these. It explains why some systems (e.g., humans) have more robust intentionality than others (e.g., thermostats) without requiring an all-or-nothing intrinsicness.

  **3. Method: A Ladder of Cases**

  We will construct a ladder of cases, each representing a step in complexity, and analyze them through three lenses: (1) Searle's intrinsicness, (2) Dennett's interpretation-relativity, and (3) our autonomy of semantic norm. The rungs:

  1. **Passive sensor** (e.g., a thermometer): 
     - Searle: No intrinsic content; it merely carries information.
     - Dennett: Content is derived from our interpretation of the reading.
     - Our view: The norm of correctness (e.g., matching temperature) is entirely set externally; autonomy is minimal.

  2. **Feedback controller** (e.g., thermostat with setpoint):
     - Searle: Still no intrinsic content; the setpoint is set by an external agent.
     - Dennett: Content is derived from the designer's interpretation of the setpoint and comparator.
     - Our view: The norm is fixed by the setpoint, which is externally set; autonomy is low.

  3. **Self-revising setpoint system** (e.g., a simple adaptive controller that adjusts its setpoint based on error history):
     - Searle: Unlikely to grant intrinsic content; the adjustment rules are programmed.
     - Dennett: Content remains derived, but the system is more complex.
     - Our view: The system now sets its own setpoint based on internal error tracking; autonomy is moderate.

  4. **Trained model with external error signals** (e.g., a neural network trained via backpropagation from an external loss function):
     - Searle: No intrinsic content; the model's states are derived from the training process.
     - Dennett: Content is interpretation-relative, depending on the training data and loss function.
     - Our view: The norm is fixed by the external loss function during training, but once deployed, the model may operate without external feedback. Autonomy is medium (if deployed without feedback) but constrained by past training.

  5. **Nonhuman animal** (e.g., a bird building a nest):
     - Searle: Likely grants intrinsic content due to biology.
     - Dennett: Content is attributed by the intentional stance.
     - Our view: The norm is set by the animal's own biological drives and learning; autonomy is high.

  **Key rungs**: Rungs 3 and 4 are critical. Rung 3 (self-revising system) challenges the binary by showing how internal error correction increases autonomy without invoking intrinsicness. Rung 4 (trained model) is especially relevant to AI and will show that autonomy is not simply about feedback loops but about the source of the norm. The trained model may have higher autonomy during deployment than in training, but less than the animal.

  **Where verdicts come apart**: 
  - At rung 3, Searle and Dennett see no intrinsic shift, but we see increased autonomy.
  - At rung 4, AI researchers might see internal representations as contentful, but Searle denies this. Our view captures a middle ground: the model has some autonomy (if deployed without feedback) but less than biological systems.

  **4. Confronting Objections**

  a. *Objection: Autonomy of norm is just counting feedback loops, not a new distinction.*  
     Reply: Feedback loops are necessary but not sufficient. Autonomy requires that the system itself sets the standard. A thermostat has feedback but no autonomy (setpoint is external). Rung 3 has feedback and self-set setpoints, so autonomy emerges. This is a qualitative shift.

  b. *Objection: Correctness is intentional, so the account is circular.*  
     Reply: We use "correctness" in a minimal, non-intentional sense: a state is correct if it matches the norm set by the system's own mechanisms (e.g., a comparator outputting an error signal). This is functional, not semantic, and avoids circularity.

  c. *Objection: This collapses into Dennett's instrumentalism.*  
     Reply: Unlike Dennett, we argue that autonomy is an objective feature of the system, not just our stance. The ladder shows increasing autonomy independent of interpretation. We do not reduce intentionality to usefulness for prediction.

  **5. Impact on the Systems and Robot Replies**

  Searle's Chinese Room argument is countered by two replies:
  - *Systems Reply*: The whole system (not just the man in the room) understands Chinese.
  - *Robot Reply*: If the system is embodied and interacts with the world, it might have genuine intentionality.

  Our reframing:
  - *Systems Reply*: We agree that the system as a whole may have more autonomy than the man alone, especially if it has feedback mechanisms. This vindicates Searle's intuition that the man lacks intentionality, but shows that the system might have some autonomy if it meets certain conditions.
  - *Robot Reply*: Embodiment may increase autonomy (by providing internal error signals), but it is not sufficient. The key is whether the robot sets its own norms (e.g., through learning). We concede that a sufficiently autonomous robot might have intentionality without being biological, which challenges Searle's intrinsicness requirement.

  **6. Plan, Deliverable, and Assessment**

  **Month-by-Month Plan:**
  - Month 1: Detailed analysis of rungs 1-3 (passive sensor to self-revising system). Draft sections on objections and existing approaches.
  - Month 2: Analysis of rung 4 (trained models) and rung 5 (nonhuman animal). Engage with AI literature on internal representations. Refine the autonomy spectrum.
  - Month 3: Synthesize the ladder, address the Systems and Robot replies, and write the full draft. Incorporate committee feedback (if any during the period).

  **Deliverable**: A draft paper (approx. 8000 words) suitable for submission to a philosophy/AI journal.

  **Failure Condition**: The project fails if:
  - The ladder of cases does not reveal a graded autonomy that is distinct from the traditional binary (i.e., if autonomy correlates perfectly with existing categories).
  - The objections (especially circularity) cannot be adequately addressed.

  **Time Assessment**: Three months is sufficient for a draft that establishes the framework and the ladder, given that much of the groundwork has been done. However, full refinement and peer review would require more time. The internal grant will enable a proof of concept.

  ---

  **Proposal Ends**
answer: |-
  **Research Proposal: The Autonomy of Semantic Norms: A Graded Framework for Intentionality**  

  **1. Research Question and Core Claim**  
  The debate between intrinsic (Searlean) and derived (Dennettian) intentionality assumes that content is *determinate*—i.e., a state’s "aboutness" has a fact of the matter—and disputes only whether determinacy originates internally or externally. This project challenges that assumption by asking: **Is the determinacy of content contingent on the *autonomy of the semantic norm*, defined as the degree to which a system sets and enforces the standard for when a state is correct or incorrect, and can this autonomy be graded rather than binary?**  

  A "yes" answer would reveal a spectrum: Systems with low autonomy (e.g., a thermometer) lack determinate content because norms are imposed externally, while high-autonomy systems (e.g., a biological agent) exhibit robust determinacy because norms are self-generated. A "no" answer would imply autonomy is reducible to existing concepts (e.g., feedback loops) or fails to resolve the impasse.  

  The specific claim to be funded is that **autonomy of semantic norm is a graded property, distinct from intrinsicness or interpretation-relativity, which explains the determinacy of content and reframes the intentionality debate.** Success will be measured by constructing a "ladder" of cases demonstrating this spectrum and defending it against major objections.  

  **2. Why Existing Approaches Fail**  
  The intrinsicness view (Searle) insists content must be intrinsic to the state (e.g., biological brains), rendering external interpretation irrelevant (as in the Chinese Room). The interpretation-relativity view (Dennett) argues content is always derived from context (e.g., the two-bitser), making intrinsicness incoherent. Both *presuppose determinacy* and thus ignore the prior question: What grounds the possibility of error in the first place?  

  Naturalist middle-ground accounts (e.g., Millikan’s teleosemantics or Dretske’s informational semantics) do not resolve this. They ground content in:  
  - **Biological function**: Norms are fixed by evolutionary history (e.g., a heart’s function is to pump blood). But this ignores systems without evolutionary teleology (e.g., AI), conflates normativity with causal role, and cannot explain how *new* norms emerge in learning.  
  - **Information-carrying**: Covariation with the world (e.g., smoke carrying information about fire) defines content. Yet this lacks normativity—smoke isn’t "wrong" if no fire exists—and treats content as passive, neglecting the system’s role in *using* information.  

  Our proposal absorbs these insights but argues autonomy is irreducible: It focuses on who *sets* the norm (e.g., evolution sets biological norms, but a self-revising system sets its own). Autonomy is graded because systems vary in their capacity to generate, evaluate, and adapt norms independently. This avoids reducing content to history or causation and instead centers the system’s ongoing normative self-governance.  

  **3. Method: The Ladder of Cases**  
  We will analyze five rungs on a complexity ladder, comparing the three perspectives (intrinsicness, interpretation-relativity, autonomy) to identify where verdicts diverge. Each rung will be evaluated for:  
  - **Semantic determinacy**: Is there a fact of the matter about content?  
  - **Source of norm**: What defines correctness/error?  
  - **Autonomy level**: Low (externally fixed) to high (self-fixed).  

  **Rungs and Analysis:**  
  1. **Passive sensor** (e.g., thermometer):  
     - *Searle*: No intrinsic content; state covaries with temperature but lacks "aboutness."  
     - *Dennett*: Content is derived from interpretation (e.g., humans assign meaning to readings).  
     - *Our view*: No autonomy. The norm (correct temperature reading) is set externally; no capacity for error beyond malfunction. Content is indeterminate—it only becomes meaningful when used.  
     - *Divergence*: Dennett grants derived content; we deny determinacy without normative context.  

  2. **Feedback controller** (e.g., thermostat with setpoint):  
     - *Searle*: No intrinsic content; setpoint is externally programmed.  
     - *Dennett*: Derived content via designer interpretation (e.g., "desires" room temperature).  
     - *Our view*: Minimal autonomy. Norm is fixed by the setpoint, but the comparator enables error detection (e.g., "too cold"). Content is determinate only relative to the external norm.  
     - *Divergence*: Searle/Dennett assume determinacy; we show it is conditional on external norms.  

  3. **Self-revising setpoint system** (e.g., a thermostat that adjusts its setpoint based on error history):  
     - *Searle*: Still no intrinsic content; rules for revision are preprogrammed.  
     - *Dennett*: Content remains derived; interpretation depends on context.  
     - *Our view*: Moderate autonomy. The system generates norms internally (e.g., optimizing for efficiency) using error history. Content gains determinacy because norms are self-imposed, even if simple.  
     - ***Key rung***: Reveals a middle ground where autonomy emerges without biology, challenging the intrinsic/derived binary.  

  4. **Trained model with external error signals** (e.g., a neural net trained via backpropagation):  
     - *Searle*: No intrinsic content; states reflect statistical patterns from external training.  
     - *Dennett*: Content is derived from training data and user interpretation.  
     - *Our view*: Variable autonomy. Norms originate externally (loss function), but during deployment, the model may self-generate sub-norms (e.g., via internal representations). Autonomy increases if the model incorporates self-supervised learning.  
     - ***Key rung***: Critical for AI researchers—shows that models have partial autonomy, blurring Dennett’s relativity and Searle’s intrinsicness.  

  5. **Nonhuman animal** (e.g., bird building a nest):  
     - *Searle*: Intrinsic content due to biology.  
     - *Dennett*: Content derived from evolutionary/behavioral context.  
     - *Our view*: High autonomy. Norms are self-generated (e.g., through learning and drives) with minimal external imposition. Content is determinate because the animal sets and enforces norms (e.g., "wrong" nest material).  
     - *Divergence*: Searle attributes determinacy to biology; we attribute it to autonomy.  

  **Workhorse rungs**: Rung 3 (self-revising system) and Rung 4 (trained model) are pivotal. Rung 3 demonstrates autonomy without biology, forcing intrinsicness advocates to explain why self-revision doesn’t suffice for determinacy. Rung 4 forces AI researchers to confront whether external training undermines content determinacy or if internal processes confer partial autonomy. Both rungs reveal graded autonomy where traditional views see binary categories.  

  **4. Objections Addressed Head-On**  
  **Objection 1: Autonomy is just feedback-loop counting, adding nothing.**  
  Autonomy is not reducible to feedback loops. Feedback enables error detection but does not imply norm-setting (e.g., a thermostat detects errors against a fixed setpoint). Autonomy requires norm-*generation* (e.g., Rung 3’s self-revising system). We will quantify autonomy using: (i) *Source of norms* (external vs. self), (ii) *Adaptability* (static vs. dynamic norms), and (iii) *Error responsiveness* (passive vs. active revision). This framework captures dimensions feedback loops alone cannot.  

  **Objection 2: Correctness is intentional, so the account is circular.**  
  We define correctness minimally: a state is incorrect if it fails a functional standard the system *itself* enforces (e.g., a comparator outputting an error signal). This is non-intentional—it relies on mechanistic functions (e.g., mismatch detection). Circularity only arises if "correctness" presupposes full intentionality; our ladder starts with non-intentional systems (Rung 1) to show how normativity emerges.  

  **Objection 3: This collapses into Dennett’s instrumentalism.**  
  Dennett’s intentional stance attributes content for predictive utility, regardless of reality. Our view is realist: Autonomy is an objective feature of the system’s operation. For example, Rung 3 has autonomy independent of interpretation—it revises norms even if unobserved. We avoid instrumentalism by showing autonomy can be empirically assessed (e.g., via error-correcting behavior) without invoking observer utility.  

  **5. Impact on the Systems and Robot Replies**  
  - **Systems Reply** (content belongs to the whole system, not parts): Our view vindicates Searle’s core intuition. The Chinese Room’s "man" lacks autonomy because norms are scripted; the full system might achieve low autonomy if it incorporates feedback. However, without norm-generation (e.g., Rung 3), content remains indeterminate.  
  - **Robot Reply** (embodied systems gain intrinsic content): We concede that embodiment *can* increase autonomy (e.g., sensorimotor loops enable self-generated norms), potentially supporting Searle. But it is not sufficient—a robot with fixed programming (Rung 2) has less autonomy than a self-revising one (Rung 3). This reframes the reply: What matters is not embodiment per se, but the capacity for normative self-governance.  

  **6. Project Plan, Deliverable, and Viability**  
  **Month-by-Month Plan:**  
  - **Month 1**: Develop the autonomy framework and analyze Rungs 1–3. Draft responses to objections.  
  - **Month 2**: Analyze Rung 4 (trained models), engaging with AI literature on internal representations. Analyze Rung 5 (animals). Refine the graded spectrum.  
  - **Month 3**: Synthesize divergences across the ladder, finalize the Systems/Robot reply analysis, and complete the draft paper.  

  **Deliverable**: A 25-page paper presenting: (i) the autonomy framework, (ii) ladder analysis with emphasis on Rungs 3–4, (iii) objections addressed, and (iv) implications for the intentionality debate.  

  **Failure Condition**: The project fails if:  
  - The ladder shows no significant divergence between autonomy and intrinsicness/relativity (e.g., Rungs 3–4 align with Dennett).  
  - Autonomy cannot be defined non-circularly (Objection 2 stands).  
  - Graded autonomy collapses into functional complexity (Objection 1 stands).  

  **Is Three Months Enough?**  
  Yes, for a proof of concept. The ladder structure is well-defined, and preliminary work is complete. The tight timeline focuses analysis on key rungs (3–4), avoiding tangential debates. However, full validation requires peer review, which extends beyond three months. This grant enables the core argument.  

