prompt: |-
  I co-host a small phil-of-mind podcast — 45-minute episodes, audience is mostly grad students and curious non-specialists, so we can be technical but not jargon-dense. Next week's guest is a philosopher whose position I want to stress-test rather than just advertise. She's a qualia skeptic of a particular sort: she grants the whole classic negative case (nothing can be intrinsic, private, ineffable, and directly apprehended all at once, so the posit collapses) but she refuses to land on deflationism or on "just be a functionalist." Her positive claim is that in the familiar coffee-taster sort of case — someone who loved a certain coffee for years and now finds it undrinkable, or a wine drinker whose tastes migrate — it's a mistake to ask whether the feel changed or whether the judgment about the feel changed, because there's a third thing that also changes and its the one doing the real work: the standard the person applies when they classify their own present state against their memory of past ones. She calls this calibration drift, and she says it explains why the realist and the eliminativist are each half right. The subject is correct that something changed and correct that they can't pin down what, but wrong to model the "what" as a private intrinsic property sitting behind the reports.

  Write me eight to ten interview questions, ordered so the episode builds. No restatement questions ("so, tell us about calibration drift") and nothing about her intellectual biography — she gets plenty of that everywhere else. What I do want covered:

  - one that presses on whether calibration drift is anything more than the "the judgment changed" option wearing a new label, and what content is actually added by talking about a standard rather than a disposition to judge;
  - one on spectrum inversion and inverted-earth style cases: does her view make them coherent or incoherent, and what does she think turns on the answer;
  - one on the cases where calibration plausibly stays anchored while experience shifts fast and hard — anesthesia, a migraine aura, a drug that changes color saturation — since those look like the cleanest place to seperate her story from a pure judgment story;
  - one on the introspection side: if all there is is calibration plus report, why does it seem to the subject that there's something it's like at all, and does she want to call that seeming an illusion, a bad description of something real, or neither;
  - and a closing question asking her to name an observation or experiment that would come out differently under her view than under plain representationalism — and, if she can't name one, what work the view is doing.

  For each, give me a follow-up keyed to the answer she's most likely to give, not to a strawman. She's extremely good at dissolving pressure by saying the disagreement is merely verbal, so build at least two of the follow-ups so that reaching for that line costs her something concrete. And if you think one of my bullets is just a bad question — too easy, or one she's answered a hundred times — say why and swap in a better one in its place.
reasoning: |-
  Okay, the user is co-hosting a philosophy of mind podcast and needs interview questions for a guest who's a qualia skeptic with a unique position. The guest rejects both deflationism and functionalism, proposing "calibration drift" as a third option in cases like changing taste preferences. The user wants stress-testing questions that avoid biography and restatements, focusing on specific pressure points.

  First, I need to understand the guest's position clearly. Calibration drift is presented as a shift in the standard used to compare current experiences to past memories, rather than a change in experience itself or just a judgment change. The user wants to challenge whether this is meaningfully different from existing options.

  The key areas the user wants covered are:
  - Whether calibration drift adds anything beyond "judgment changed"
  - How it handles spectrum inversion and inverted earth cases
  - How it accounts for sudden experience shifts like anesthesia or migraines
  - The nature of introspection and the "seeming" of qualia
  - Predictive differences from representationalism

  The guest is skilled at deflecting with "merely verbal disagreement" claims, so some follow-ups need to make that move costly. I should also evaluate if any proposed questions might be too easy or overasked.

  For the calibration drift vs judgment question, the guest will likely argue that standards are meta-cognitive frameworks shaping how judgments are made. A strong follow-up could ask why metacognition adds explanatory power without creating an infinite regress.

  On spectrum inversion, the guest might say such scenarios are incoherent because calibration drift makes private comparisons impossible. A good follow-up could challenge whether this dissolves the intuition or explains it away.

  For sudden shifts like anesthesia, the guest may attribute these to calibration failing to track rapid changes. The follow-up should press on why we wouldn't default to representationalism if calibration breaks down here.

  Regarding the "seeming" of qualia, the guest might call it a misdescription of relational processes. The follow-up should ask how this avoids being eliminativist.

  For empirical differences, if the guest cites ambiguous-change cases, the follow-up should question whether representationalism couldn't absorb this.

  I'll structure questions to build logically: start with core mechanics, move to challenges (inversion, sudden shifts), address introspection, then test empirical content. Two follow-ups will be designed to make "merely verbal" claims costly - perhaps by showing explanatory gaps or theoretical costs.

  The questions should avoid restatements while pressing the guest's unique claims. I'll ensure each follow-up targets likely responses, not strawmen, maintaining a constructive but rigorous tone throughout.
answer: |-
  Here are 10 tightly focused, stress-testing questions designed to build logically, incorporating your requirements and anticipating the guest's likely defense strategies. Two follow-ups explicitly make the "merely verbal" move costly. I've replaced one bullet (see rationale below) and refined others for maximum pressure.

  **Question Sequence & Rationale:** The sequence starts with core mechanics, moves to classic thought experiments (inversion), then sudden shifts (the hardest case), introspective phenomenology, and finally empirical bite. It avoids letting her settle comfortably into describing the view early on.

  1.  **The Judgment/Standard Distinction:** "You argue calibration drift isn't just a change in judgment about the experience, but a change in the *standard* used *for* judging. Could you walk us through a specific contrast? For instance, in the coffee case, what would a pure judgment change look like versus what actually happens under calibration drift, and crucially, *what observable or introspective difference* signals we're dealing with drift rather than simple judgment shift?"
      *   *Follow-Up (Likely: She emphasizes standards are meta-cognitive, framing how judgments are made):* "If the standard is a higher-order disposition governing *how* lower-order judgments (like 'this tastes bad now') are formed, doesn't this risk collapsing into a complex functional story about judgment formation? What substantive *non-functional, non-judgmental* residue does 'calibration drift' preserve that 'shifting judgment thresholds' doesn't capture?"

  2.  **The "Merely Verbal" Cost #1 - Explanatory Scope:** "Let's grant the standard/judgment distinction for argument's sake. What specific *explanatory work* does invoking 'calibration drift' do that a sophisticated representationalist account of shifting sensory *discriminations* couldn't handle equally well? Does drift explain something *beyond* why reports change over time in these ambiguous cases?"
      *   *Follow-Up (Likely: She argues drift explains the *phenomenology of uncertainty* or the *feeling* that something ineffable changed):* "But doesn't attributing the *feeling of ineffable change* to drift itself just relocate the problem? If the drift is unconscious or sub-personal, why does it generate this specific *seeming* of a private shift? And if it's conscious, haven't you just reintroduced a quale-like element – the 'feel' of the drifting standard itself?"

  3.  **Spectrum Inversion & Coherence:** "Spectrum inversion scenarios rely on private qualia being inverted while public behavior and functional roles stay constant. Your view seems to make such inversion incoherent *in principle* – if the 'feel' just *is* the calibrated reporting disposition anchored to public standards and memory, there's nothing *to* invert privately. Is that your position? And if so, does the *intuition* of possibility reveal a deep confusion about introspection, or is it doing some other work we should salvage?"
      *   *Follow-Up (Likely: She agrees it's incoherent & attributes the intuition to conflating calibration with a mythical intrinsic property):* "Many philosophers find the inversion intuition incredibly strong and revealing. If your view dismisses it *entirely* as confusion, doesn't that constitute a significant cost? What positive account does calibration drift offer for why this intuition arises so persistently if it's tracking nothing real?"

  4.  **Inverted Earth & Anchoring:** "Inverted Earth cases involve a slow, pervasive shift in external stimuli that the subject doesn't notice. This seems tailor-made for calibration drift – the standard itself slowly shifts with the environment. Does your view predict the subject *wouldn't* notice the inversion over time, or that their reports of stability would be veridical? And crucially, what does this say about the *original* calibration – was *it* ever tracking something intrinsic, or was it always just an environmentally anchored disposition?"
      *   *Follow-Up (Likely: She emphasizes dynamic calibration anchored to environment/memory, denying original intrinsic tracking):* "So on this view, there's no 'true' baseline experience pre-Inverted Earth, just different calibration states? Doesn't this make the very idea of an 'accurate' memory of past experience deeply problematic – it's just recalling a past calibration state, not an intrinsic quality? How do we avoid a kind of global instability in experiential reporting?"

  5.  **Sudden Shifts - The Hard Case (Migraine/Aneasthesia/Drugs):** "Let's move to cases where experience seems to shift dramatically and rapidly *without* slow environmental change: a sudden migraine aura, waking from anesthesia, or taking a drug that massively boosts color saturation. Here, calibration plausibly *hasn't* drifted yet – the subject immediately notices something is 'off' or radically different. Doesn't this cleanly separate a change in the *presented character* of experience from a change in judgment or calibration standard? How does your model capture this *immediate, pre-reflective* sense of radical difference without invoking a shift in the 'what it's like'?"
      *   *Follow-Up (Likely: She argues the 'immediate sense' *is* a calibration failure – the current input clashes violently with the entrenched standard, triggering a 'mismatch report'):* "If the calibration standard is stable, and the input suddenly clashes, what *is* the nature of the 'clash' itself? Isn't the clash precisely the difference between the *current sensory presentation* (e.g., blinding aura, washed-out colors) and the *expected presentation* based on calibration? Doesn't this tacitly rely on the sensory presentation having its own character *independent* of the calibration process for the clash to even occur?" *(This directly pressures the core).*

  6.  **Replaced Question: Why not just complex functionalism?** (Rationale: The "plain representationalism" ask comes later for empirical bite. This earlier question cuts deeper into her uniqueness claim, which is central). "You explicitly reject landing on 'just be a functionalist.' Functionalism can easily absorb shifting dispositions, standards, and even meta-cognitive states. What specific *aspect* of the coffee-taster phenomenon, or the nature of the 'seeming' involved, does functionalism *fail* to capture that calibration drift *succeeds* in explaining? What's the *positively unique* explanatory target of your view?"
      *   *Follow-Up (Likely: She argues functionalism misses the *first-person perspective* of evaluating change against memory, or the *normativity* involved in 'getting it wrong'):* "But sophisticated functionalism *can* model first-person perspective as higher-order monitoring and normativity as compliance with internalized standards. If your rebuttal is that functionalism *describes* this but doesn't *capture the phenomenology*, haven't you just restated the hard problem in a new form? How does invoking 'calibration drift' as a posit *solve* that phenomenological aspect any better than adding 'and it feels like X' to the functional description?"

  7.  **Introspection & The "Seeming":** "If calibration drift plus report is the whole story, why does it seem so compelling to the subject that there's a private, intrinsic 'feel' they're struggling to capture? Is this seeming:
      *   a) An *illusion* (if so, what generates it and why is it so persistent?),
      *   b) A *misdescription* of the real relational process of calibration and reporting (if so, what's being misdescribed *as* intrinsic?), or
      *   c) Something else entirely?"
      *   *Follow-Up (Likely: She opts for (b) - misdescription, arguing we mistake the complex relational process for a simple intrinsic property):* "When the coffee taster introspects and finds only this 'elusive something' they can't pin down, isn't their introspection *failing* to reveal the relational calibration process you posit? If introspection reliably reveals judgments and concepts, why doesn't it reveal the *calibration standard itself* as a component of experience? Does your view imply introspection is systematically misleading us about the very nature of our own experiential states?"

  8.  **The "Merely Verbal" Cost #2 - Introspective Access:** "Building on introspection: If the calibration standard is a crucial part of the experiential story, *to what extent is it introspectively accessible?* Can a subject, with effort, become aware of their own standard for comparing current coffee taste to past memory? If yes, doesn't that make it just another reportable judgment (undermining its distinctness)? If no, in what sense is it part of their *experience* rather than a sub-personal mechanism?"
      *   *Follow-Up (Likely: She says it's partially accessible/reflectable upon, but not fully transparent):* "If it's partially accessible, why can't the coffee taster resolve their uncertainty by inspecting *it*? If 'drift' explains their confusion, shouldn't clarifying their *current standard* resolve the confusion? If it doesn't resolve it, doesn't that suggest the confusion stems from something else – perhaps the very 'feel' you're trying to eliminate?"

  9.  **Empirical Bite vs. Representationalism:** "You position calibration drift as a third way between realism and eliminativism. What specific, concrete *observation or experimental result* would look different or be predicted differently under your view compared to a mainstream representationalist view (say, one like Tye's or Dretske's that takes phenomenal character seriously as representational content)?"
      *   *Follow-Up (Likely: She points to ambiguous-change cases like the coffee taster, arguing representationalism is forced to take a stand on an undecidable intrinsic shift):* "But a representationalist could readily agree that *in ambiguous cases*, we cannot know if the content shifted or the valuation/judgment did, and that memory-comparison standards play a key role. How does your view generate a *different prediction* about, say, neural correlates, behavioral reports under uncertainty, or learning in such cases? If there's no different prediction, is the difference between your view and representationalism *only* in how they describe the ontology of the 'seeming' – intrinsic property vs. representational content?"

  10. **The Work of the View - Closing:** "Pulling it together: If the empirical predictions align closely with representationalism or sophisticated functionalism in the key cases, and if insisting on 'no intrinsic qualia' comes at the cost of complex maneuvers to handle sudden shifts and introspective seemings... what *positive philosophical work* is 'calibration drift' doing that warrants it as a distinct position? Is it primarily dissolving a pseudo-problem, offering a better metaphysics of mind, or reframing how we should study subjective reports? And why is *this* framework better at that work than the alternatives you reject?"
      *   *(No specific follow-up needed here – it's the closing synthesis prompt).*

  **Key Pressure Points Incorporated:**

  1.  **Judgment vs. Standard:** Q1 & F-U directly tackle this, demanding an *observable* difference and pressing the functional collapse.
  2.  **Inversion/Inverted Earth:** Q3 & Q4 cover this, focusing on coherence and the anchoring problem. F-Us target the cost of dismissing intuition and the instability of memory.
  3.  **Sudden Shifts:** Q5 & F-U are the core challenge. The F-U directly argues that a clash *presupposes* independent character.
  4.  **Introspection/Seeming:** Q7 & Q8 cover this. Q8's F-U specifically makes claiming partial accessibility costly by questioning why it doesn't resolve confusion. Q7's F-U questions why introspection fails to reveal the posited process.
  5.  **Empirical Bite:** Q9 & F-U directly ask for a difference and press hard if the answer relies only on ambiguous cases where other views can be agnostic or complex. This is where "merely verbal" becomes costly – if there's no predictive difference, the distinctness is threatened.
  6.  **"Merely Verbal" Traps:** Explicitly in Q2 F-U (relocating the seeming) and Q9 F-U (lack of predictive difference). Implicitly in Q8 F-U (introspective access failing to resolve).
  7.  **Replaced Bullet:** Swapped "plain representationalism" in an empirical ask for Q6 ("Why not complex functionalism?"). This is more potent *earlier* as it attacks her core claim of novelty head-on, forcing her to articulate what's *uniquely* explained before getting to empirical predictions. The empirical comparison to representationalism remains crucial and is covered thoroughly in Q9.

  This set aims to be rigorous, avoid softballs, build logically, and force clarification on the most contentious and novel aspects of her view while respecting her intelligence and anticipating her dialectical moves. Good luck with the interview!
