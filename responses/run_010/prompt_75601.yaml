answer: |-
  Below is a decision tree designed to help readers identify their stance on the social discount rate for climate policy. The tree starts with a shared scenario: **A policy imposes costs on people alive today to avoid damages to people living a century from now.** Each question is framed around concrete, intuitive cases—no economics expertise required. The tree has 8 branching nodes and ends in 7 distinct leaves (including one added for logical completeness). I've flagged limitations and undefended positions at the end.  

  ---

  ### **Decision Tree: What’s Your View on Discounting the Future?**  
  *Start here:*  

  1. **Should the welfare of future people (e.g., someone born in 2124) count equally to the welfare of people alive today?**  
     - *Case: Imagine two identical people, one alive today and one in 2124. Both would suffer equally from climate impacts if we do nothing.*  
       - **Yes, they count equally** → Q2  
       - **No, future people count less** → Q3  

  2. **Even if future people are richer, does their greater wealth justify discounting their well-being?**  
     - *Case: By 2124, per-person income is projected to be 3× higher. Does that make a dollar of damage to them less urgent?*  
       - **Yes, their wealth justifies discounting** → Q4  
       - **No, their wealth doesn’t change our duty** → **Leaf A**  

  3. **Is your main reason for discounting the future the risk that humans won’t survive to 2124?**  
     - *Case: Asteroids, pandemics, or nuclear war could wipe out humanity. Does this justify prioritizing the present?*  
       - **Yes, survival risk is key** → **Leaf B**  
       - **No, other reasons** → Q5  

  4. **For very distant futures (e.g., 200+ years), should uncertainty about future growth make our discount rate *fall* over time?**  
     - *Case: We’re confident about growth for 50 years, but clueless about 2200. Should uncertainty lower the discount rate for 2200?*  
       - **Yes, uncertainty lowers the rate** → **Leaf C**  
       - **No, use a stable rate** → **Leaf D**  

  5. **Should we base the discount rate on how people *actually* trade present/future in markets (e.g., via stock returns or savings)?**  
     - *Case: If investors demand 4% returns to delay consumption, should policy use 4%?*  
       - **Yes, markets reveal true preferences** → **Leaf E**  
       - **No, markets don’t reflect ethics** → Q6  

  6. **Should the discount rate be decided by democratic debate, not technical formulas?**  
     - *Case: Should elected bodies set the rate based on society’s values, not economists’ models?*  
       - **Yes, it’s a political choice** → **Leaf F**  
       - **No, it’s an ethical/economic issue** → **Leaf G**  

  7. **Can a policy that’s justified over 50 years become *unjustified* over 200 years?**  
     - *Case: A 50-year flood barrier pays off, but a 200-year version costs “too much” due to compounding. Is this fair?*  
       - **Yes, compounding is legitimate** → *Return to Q4*  
       - **No, compounding is unethical** → *Return to Leaf A*  

  8. **Does the sheer temporal distance of future people *itself* make their suffering less urgent?**  
     - *Case: Identical suffering today vs. in 2124. If you already agreed future people are equal (Q1), does distance matter?*  
       - **Yes, distance reduces urgency** → *Return to Q3*  
       - **No, only survival risk matters** → *Return to Leaf B*  

  ---

  ### **Leaves (Your Position)**  
  - **Leaf A**: Pure time preference is an ethical defect → set near **0%**.  
    *Why? Future people matter equally, regardless of wealth or distance. Discounting is unjust.*  
  - **Leaf B**: Positive pure time preference is justified by **extinction risk**.  
    *Why? If humanity dies out, future benefits vanish. Discount for survival uncertainty.*  
  - **Leaf C**: Uncertainty about future growth justifies a **falling discount rate**.  
    *Why? Growth uncertainty compounds over time. Use lower rates for distant futures.*  
  - **Leaf D**: **Constant discount rate** based on expected growth.  
    *Why? Future wealth reduces marginal utility of damages. No adjustment for uncertainty needed.*  
  - **Leaf E**: **Descriptive view**—set the rate from observed market returns.  
    *Why? Markets reveal society’s true time preferences. Use returns on capital (e.g., 3–5%).*  
  - **Leaf F**: The whole calculation is a **political decision** in ethical clothing.  
    *Why? No “objective” rate exists. Democracy must weigh competing values.*  
  - **Leaf G**: Positive pure time preference for **non-utilitarian reasons** (e.g., present bias isn’t defective).  
    *Why? Society’s impatience is legitimate, independent of extinction risk or markets.*  

  ---

  ### **Limitations & Undefended Views**  
  - **Leaf A vs. Leaf D separation**: The tree struggles to distinguish between:  
    - "Pure time preference = 0% + no growth adjustment" (Leaf A)  
    - "Pure time preference = 0% + growth adjustment" (Leaf D).  
    *Why? Both start from ethical symmetry (Q1 → Yes), but Leaf D accepts wealth-based discounting (Q2 → Yes).*  

  - **Undefended region**: Answers leading to **“no growth adjustment + falling discount rate”** (e.g., Q1 → Yes, Q2 → No, Q4 → Yes).  
    - **Why empty?** Incoherent. If you reject wealth-based discounting, you lack a rationale for *any* positive rate (let alone a falling one).  

  - **Weakly defended region**: **Leaf G** (pure time preference, non-existential).  
    - **Why rare?** Unattractive to ethicists (it defends “unjust” impatience) and economists (it ignores markets).  

  - **Added leaf**: **Leaf G** was added because the logical space permits defending pure time preference without appealing to extinction or markets (e.g., for communitarian reasons).  

  ---

  ### **Key Design Notes**  
  - **American English**: Plain language, no jargon (e.g., “marginal utility” → “their greater wealth makes a dollar less urgent”).  
  - **No shortcuts**: Nodes avoid technical terms (e.g., “Ramsey equation”) and never ask, “Which leaf do you prefer?”  
  - **Time horizons**: Q4 and Q7 explicitly address how justification changes over 50 vs. 200 years.  
  - **Logical coverage**: The tree catalogs major academic positions (e.g., Stern/Leaf A vs. Weitzman/Leaf C vs. Nordhaus/Leaf E) while exposing tensions.  

  This tree isolates core disagreements about time, risk, and democracy—helping readers find their stance *without* picking a pre-labeled team.
