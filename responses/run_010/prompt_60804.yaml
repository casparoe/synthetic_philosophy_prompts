prompt: |-
  So, kind of an odd request. I'm a backend engineer, zero formal philosophy background — the most I've done is skimmed some blog posts about that guy who wrote the book arguing against democracy, plus a wikipedia-level summary of the Condorcet jury theorem. Next month I'm giving a 20 minute talk at a small interdisciplinary workshop run by our local university's political theory group (I know a couple of the organizers from a meetup), and I'm going to get eaten alive if I don't prep.

  The talk is about a voting system I actually built and that my company uses to decide whether design proposals (RFCs) get accepted. I'm pitching it as a small-scale, self-correcting epistocracy. How it works:

  - every engineer starts at weight 1 when they approve or reject an RFC
  - your weight moves based on your review track record: approve something that later causes an incident, weight goes down; leave a review comment flagging a risk that later turns out to have been a real risk, weight goes up
  - weights are capped, they decay back toward 1 on roughly a six month half life, and there's a floor so nobody ever drops to zero — everyone always keeps some vote
  - my main claim is that this dodges the standard objections to epistocracy, because it doesn't install a fixed class of wise people. Anyone can earn weight, it's scored on calbration rather than credentials, and it gets revised automatically when you turn out to have been wrong.

  Audience: about 25 people. Mostly political theorists, grad students and a few faculty, who care about political equality and legitimacy; one sociologist who studies open source communities; and two people who work on DAO governance who are basically already on my side. Aside from the DAO folks nobody writes code for a living.

  Build me the Q&A prep sheet. Exactly five objections, ordered most damaging to least, numbered, and nothing at all before or after the list. Each item should have: (a) the objection in one sentence, phrased the way that room would actually phrase it, in their vocabulary and not mine; (b) a reply of two sentences that I could say out loud at normal speed; (c) one short line saying where that reply is soft, or where I'd just be changing the subject; and (d) a tag, either "survivable" or "this one sinks it." One of the five should be the question I'm privately hoping nobody asks — mark which.

  No hedging and no both-sides mush, please. I want you to actually take a position: tell me which of the five genuinely defeats the proposal rather than just annoying it, and if you think my "it's not really epistocracy, it's different" framing is a dodge, say that straight out and give me the honest version of the claim I should be defending instead. Five items, that's all — no intro paragraph, no wrap-up, no further reading.
reasoning: |-
  Okay, let's tackle this user's request. He's a backend engineer preparing for a talk on a voting system he built, pitching it as a self-correcting epistocracy. The audience is political theorists, so I need to anticipate their key objections in their language. 

  First, the core tension: epistocracy vs. political equality. The user's system uses track records to adjust voting weights, which directly challenges democratic equality. Political theorists would see this as inherently elitist, no matter how dynamic. That's the most damaging objection—it questions legitimacy at a foundational level. The user's reply emphasizes meritocracy and error correction, but that doesn't address the equality concern. This one probably sinks his framing.

  Next, path dependence and systemic bias. If initial errors lower someone's weight permanently, it could create feedback loops favoring early participants. The user's decay mechanism helps but doesn't eliminate the risk. The sociologist might push this hard. Survivable, but needs acknowledgment.

  Third, the "black box" problem. Technocratic systems often lack transparency, eroding trust. The user's reply focuses on operational explainability, but theorists care about normative justification—why weights should matter at all. Survivable if he pivots to practical outcomes.

  Fourth, scope limitation. Workplace governance isn't a polis. The user can deflect here by narrowing his claims, but it admits his system isn't a model for broader democracy. That's fine—he should embrace it. Survivable.

  Finally, the hope-nobody-asks one: conflating technical and moral judgment. If "risks" are only operational, the system ignores ethical concerns. The DAO folks might not care, but theorists will. This forces the user to admit his epistocracy is narrowly technical—which might actually save him from bigger legitimacy fights. Marking it as survivable with honesty.

  Assessing the damage: Objection 1 is fatal to his "dodges epistocracy's problems" claim. The rest are survivable with tactical concessions. His framing isn't a full dodge but overreaches; he should position it as "error-correcting technical governance," not mini-epistocracy. 

  Noting the user's unspoken need: He wants armor against academic criticism without philosophy depth. The prepped replies must be punchy and grounded in his system's mechanics, avoiding theoretical debates he can't win. Keeping each retort to two sentences forces discipline.
answer: |-
  Here is your Q&A prep sheet, numbered 1-5, ordered by damage potential:

  1.  **Objection**: "This system formalizes unequal political agency based on technical judgments, violating core democratic principles of equal moral standing and undermining legitimacy, even if weights fluctuate."  
      **Reply**: "It doesn't claim moral inequality; it weights *predictive accuracy* on specific, measurable system outcomes, treating all as fallible. Legitimacy arises from demonstrably better collective decisions reducing costly errors, not from equal votes on unequal expertise."  
      **Soft Spot**: Doesn't fully address the "moral standing" concern; shifts to instrumental legitimacy.  
      **Tag**: **this one sinks it** (for the "dodges epistocracy objections" framing; your system *is* epistocratic by nature, just dynamic).  

  2.  **(The one you hope nobody asks)**: "Doesn't rewarding accurate risk-flagging incentivize excessive negativity and conservatism, stifling innovation, while punishing approvals that fail only creates risk-aversion not wisdom?"  
      **Reply**: "The weight adjustments focus solely on *actual* incidents and *later-confirmed* risks, not hypotheticals. Approval weight loss only triggers if an incident *directly traces* to the approved proposal, countering blanket conservatism."  
      **Soft Spot**: Assumes perfect traceability of incidents; doesn't address cultural chilling effects from perceived risk.  
      **Tag**: **survivable**  

  3.  "This creates path dependence: early mistakes permanently disadvantage certain voices, embedding initial biases or luck into the system's power structure despite decay mechanisms."  
      **Reply**: "Weight decay and the floor actively reset standings, preventing permanent lock-in. Crucially, weight changes require *later* independent validation of judgments (incidents/confirmed risks), acting as continuous correction, not just initial luck."  
      **Soft Spot**: Heavy decay weakens the "wisdom accumulation" claim; corrections rely on potentially incomplete incident data.  
      **Tag**: **survivable**  

  4.  "You've built a technocratic black box: ordinary participants can't audit or intuitively grasp why weights are assigned, eroding perceived fairness and trust compared to simple voting."  
      **Reply**: "Weight changes are algorithmically transparent (track record + formula) and tied to concrete events (incident reports, comment resolutions). We publish anonymized stats showing weight shifts correlate with verifiable outcomes, making 'why' explicit."  
      **Soft Spot**: "Transparency" doesn't equal "intuitive grasp" for non-experts; trust may still require faith in the metric.  
      **Tag**: **survivable**  

  5.  "This conflates technical reliability with governance wisdom; avoiding system failures is necessary but insufficient for legitimate collective decisions, which require deliberation on values, trade-offs, and justice."  
      **Reply**: "You're right – this system governs *technical RFCs* specifically, where the primary value *is* system reliability. It delegates only this narrow epistemic task, not broader normative questions of 'justice' or resource allocation within the team."  
      **Soft Spot**: Admits severe scope limitation; the "epistocracy" claim only holds for purely technical judgments.  
      **Tag**: **survivable**  

  **Crucial Assessment**: Objection #1 genuinely sinks your "dodges epistocracy objections" framing. Your system *is* epistocracy (rule of the knowledgeable), just dynamic and competency-based. **Drop that defense.** Instead, honestly claim: "It *is* a form of epistocracy, but one focused narrowly on technical calibration, dynamically updated, ensuring the most *reliably accurate* voices on system safety have proportionate influence *on that specific domain*, while preserving universal suffrage and a path for anyone to gain standing." Defend *that*.
