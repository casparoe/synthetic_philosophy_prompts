prompt: |-
  I'm chairing our departmental colloquium next Thursday and the speaker defends a hybrid expressivism: on her view, judging that lying is wrong is a matter of disapproving of lying while also believing that lying has the descriptive property of being such that any fully informed, imaginatively vivid observer would disapprove of it. So the belief component handles embedding and the attitude component is there to explain why moral judgments motivate. I've got about twenty minutes of Q&A and I dont want to spend it on softballs. Write me six to eight questions aimed squarely at the Frege-Geach problem, and for each one, the answer she's most likely to give plus a follow-up that cuts off that escape route. I want coverage of: the negation problem -- if the belief content is purely descriptive, what exactly does someone who says lying isn't wrong disagree with, and does the hybrid just relocate the old expressivist difficulty instead of solving it; conditional embeddings, where the moral content shows up only in an unasserted antecedent and the attitude seems to have nothing to attach to; and whether two people who agree on every non-moral fact but differ morally end up sharing her belief component, in which case what is their disagreement a disagreement about. Save the last slot for the charge that the attitude does no semantic work at all and could be deleted with no change to truth conditions or validity -- that's the one I want her to squirm on. Keep the questions short enough to ask out loud, and nothing in the register of "what drew you to metaethics."
reasoning: |-
  Okay, the user is chairing a departmental colloquium and needs tough questions for a speaker defending hybrid expressivism. They specifically want to focus on the Frege-Geach problem, covering negation, conditionals, disagreement, and the charge that the attitude component is semantically redundant. 

  Hmm, the user is clearly well-versed in metaethics - they're using technical terms like "Frege-Geach" and "negation problem" casually. They're not looking for introductory questions but want to pressure-test the theory. Interesting that they mention making the speaker "squirm" - this suggests they might be skeptical of hybrid expressivism themselves or at least want a rigorous debate. 

  The core challenges here are: 
  First, negation - if "wrong" just describes what ideal observers would disapprove of, how does denying "lying is wrong" differ from denying that ideal observers would disapprove? The hybrid view seems vulnerable to the same problem it tried to solve. 

  Second, conditionals - if moral content only appears in unasserted antecedents, where does the disapproval attitude attach? Classic Frege-Geach challenge. 

  Third, disagreement - if two people agree on all descriptive facts (including what ideal observers would do) but disagree morally, what's left to disagree about? The hybrid might collapse into descriptivism. 

  Finally, the redundancy charge - if the belief component does all the semantic heavy lifting, why keep the attitude? This cuts to the heart of whether hybrid expressivism is meaningfully distinct. 

  For each point, I'll craft a question that forces the speaker to confront the weakness, anticipate their likely defense, then design a follow-up that blocks their escape route. The redundancy question should go last for maximum impact - the user specifically wants this to be uncomfortable. 

  Key tactics: 
  - For negation, attack the relocation of the problem rather than solving it 
  - For conditionals, emphasize the lack of attitude in unasserted contexts 
  - For disagreement, expose the vanishing disagreement point 
  - For redundancy, demand functional justification for the attitude 

  The questions must be concise enough for live Q&A but precise enough to trap the theory in its contradictions. No mercy per the user's request.
answer: |-
  Here are eight targeted questions addressing the core Frege-Geach challenges for her hybrid view, designed for live Q&A, with anticipated answers and sharp follow-ups:

  1.  **Question (Negation - Core Disagreement):** "If 'Lying isn't wrong' expresses *disbelief* that ideal observers would disapprove of lying, what do I genuinely *disagree* with when I say 'Lying *is* wrong' to someone who says that? Doesn't my disapproval seem irrelevant to the disagreement, which is now just about a descriptive fact?"
      *   **Likely Answer:** "We disagree about the descriptive belief – whether ideal observers would disapprove. But crucially, *my* judgment also involves *my own* disapproval of lying. When I assert 'Lying is wrong,' I express *both*."
      *   **Follow-up:** "But if the *only* thing we genuinely *contradict* is the descriptive belief about ideal observers (since my disapproval doesn't negate their disbelief), haven't you just relocated the expressivist's problem? The original expressivist struggled to explain how 'Lying isn't wrong' negates the *attitude* in 'Lying is wrong'. Here, your 'not wrong' only negates the *belief*, leaving the attitude untouched. How is this negation *of the moral content itself*?"

  2.  **Question (Negation - Attitude in Denial):** "When someone sincerely asserts 'Lying is not wrong,' what *non-belief attitude*, if any, does your view take this assertion to express? And if it expresses something like *tolerance* or *non-disapproval* of lying, how is *that* attitude compositionally generated from the negation plus the atomic 'wrong' claim?"
      *   **Likely Answer:** "'Lying is not wrong' expresses disbelief in the descriptive proposition *and* likely expresses a *lack* of disapproval of lying, or perhaps tolerance."
      *   **Follow-up:** "But your semantics for 'wrong' is 'disapproval + belief that ideal observers disapprove'. Applying a standard truth-functional negation operator only targets the belief component. How does negating a *belief* component logically entail or generate the expression of this distinct *positive* attitude of tolerance or non-disapproval? Where does *that* attitude come from in the compositional semantics?"

  3.  **Question (Conditionals - Antecedent Attitude):** "Consider the conditional: 'If lying is wrong, then getting your little brother to lie is wrong.' According to your view, what non-belief attitude is expressed *towards the antecedent* ('lying is wrong') when this entire conditional is asserted? If none, how does the meaning of 'wrong' in the antecedent retain its distinctive motivational/expressive character?"
      *   **Likely Answer:** "When embedded in an unasserted antecedent, the *attitude* component isn't actively expressed by the speaker. The sentence functions by presenting a hypothetical connection between the *descriptive belief contents*."
      *   **Follow-up:** "If the attitude component vanishes in the antecedent, doesn't that mean the word 'wrong' in 'if lying is *wrong*' doesn't actually *mean* disapproval + belief? It seems to mean *only* the belief about ideal observers in that context. How is this consistent with your account of the meaning of 'wrong' in atomic sentences? Doesn't this suggest the attitude is pragmatically expressed only when asserted, not semantically encoded?"

  4.  **Question (Conditionals - Validation):** "Take the valid inference: (1) If lying is wrong, then getting your little brother to lie is wrong. (2) Lying is wrong. Therefore, (3) Getting your little brother to lie is wrong. Your view validates this because (2) provides the descriptive belief needed to satisfy the antecedent's condition. But if (2) also expresses *disapproval*, and this disapproval isn't part of the antecedent's *content*, how does the inference capture the *moral* connection? Couldn't someone accept (1) and the *descriptive belief* in (2) but lack disapproval of lying, and thus rationally avoid disapproving of getting their brother to lie, violating the intuition that this is a *moral* modus ponens?"
      *   **Likely Answer:** "The inference is valid based on the shared descriptive belief content. The speaker's disapproval expressed by (2) motivates *them*, but the logical connection is secured by the descriptive components."
      *   **Follow-up:** "But isn't the *point* of the moral conditional (1) that disapproval of lying *commits* one to disapproval of getting one's brother to lie? If the validity relies *only* on the descriptive contents, and the actual attitudes can rationally come apart (accepting premises descriptively but lacking the antecedent attitude), haven't you lost the essential *normative force* of the moral inference?"

  5.  **Question (Disagreement - Shared Belief Component):** "Imagine two people: Alice believes lying is wrong (disapproves + believes ideal observers disapprove). Bob believes lying is *not* wrong (lacks disapproval? + *disbelieves* ideal observers disapprove). They agree on *all* non-moral facts, including complex sociological/psychological facts, but disagree here. Do they share the *same belief component* regarding what ideal observers would disapprove of?"
      *   **Likely Answer:** "No, because their moral difference *stems* from a difference in their descriptive belief about what ideal observers would do. Alice believes they *would* disapprove, Bob believes they *wouldn't*."
      *   **Follow-up:** "But what if they *do* agree on *all* descriptive facts? Bob, while agreeing that ideal observers *would* disapprove of lying (the descriptive belief), still insists lying is *not wrong*. He says 'Yes, they'd boo, but so what? I don't disapprove, and it's not wrong.' On your view, what is Alice and Bob's *disagreement about* now? They agree on the belief component and the non-moral facts. Is it *just* that Alice disapproves and Bob doesn't? If so, how is this a *substantive moral disagreement* rather than a report of differing feelings?"

  6.  **Question (Disagreement - Disagreement without Descriptive Conflict):** "Building on that: If Bob agrees that ideal observers would disapprove of lying but *still* claims 'Lying is not wrong' (expressing lack of disapproval/tolerance), and Alice claims 'Lying is wrong' (expressing disapproval + the same belief), do Alice and Bob genuinely *disagree*? If so, what proposition or state of affairs are they disagreeing *about*? It can't be the belief component (they agree), and they aren't disagreeing about their own attitudes (they know they differ)."
      *   **Likely Answer:** "They disagree about whether the property of being such that ideal observers disapprove *is the property of being wrong*. Alice thinks it is, Bob thinks it isn't."
      *   **Follow-up:** "But isn't defining 'wrong' *as* that property (being such that ideal observers disapprove) the core of your *semantic* theory? If Bob is using 'wrong' with a different meaning (rejecting your analysis), then this becomes a meta-semantic disagreement about the meaning of 'wrong', not a first-order moral disagreement *using* 'wrong' with the same meaning. How does your view account for *first-order* moral disagreement between people who share *your* semantic theory (agree on the analysis) but differ in attitude despite agreeing on the descriptive facts?"

  7.  **Question (Compositionality - Complex Embeddings):** "Your account specifies the mental state for atomic 'X is wrong'. How does it compositionally generate the mental state expressed by logically complex sentences, like 'Either lying is wrong or stealing is wrong' or 'It might be that lying is not wrong'? Specifically, how does the disapproval attitude component feature in the semantics of these complex embeddings?"
      *   **Likely Answer:** "The attitude is only expressed when the moral predicate is used in an asserted context. In complex embeddings like disjunctions or modals, the sentence expresses a belief about the complex descriptive content (e.g., that ideal observers disapprove of lying or of stealing) without expressing disapproval of either."
      *   **Follow-up:** "This sounds like the attitude component is *only* expressed in simple assertions and *disappears* under embedding or logical operators. Doesn't this undermine the claim that the attitude is part of the *semantic content* of 'wrong'? If the meaning of 'wrong' shifts depending on whether it's asserted or embedded (sometimes including the attitude, sometimes not), how is this a compositional and unified semantics?"

  8.  **Question (Redundancy - Semantics vs. Psychology):** "Here's a skeptical worry: Your belief component (that lying has the property of being disapproved by ideal observers) seems to do *all* the semantic heavy lifting. It handles truth conditions, embedding, logical relations, and disagreement. The disapproval attitude explains motivation and 'oomph' but appears semantically inert – it doesn't affect what the sentence *says* or how it embeds logically. Couldn't we simply *delete* the attitude component from your semantic account? We'd have a robust descriptivist theory handling Frege-Geach perfectly, with the *additional psychological claim* that people who hold these descriptive beliefs also tend to disapprove. What essential *semantic* work does the attitude component actually perform?"
      *   **Likely Answer:** "The attitude is crucial! It captures the *distinctive nature* of moral judgment – its action-guiding force and why it's not *just* a belief about reactions. It explains the internal connection between judgment and motivation *for the speaker*. Without it, you lose what makes moral judgments *moral*."
      *   **Follow-Up (The Squirm):** "I understand it explains *psychological* features of the *speaker's state of mind*. But does it contribute *anything* to the *meaning* of the *words uttered*, to the *proposition* expressed, or to the *logical validity* of inferences involving those words? If the belief component alone determines truth conditions, entailment relations, and what is contradicted, in what sense is the attitude part of the *semantic content* rather than merely a *psychological accompaniment* to asserting that content? Doesn't your hybrid view collapse into a sophisticated *descriptivism* about semantics, with expressivism relegated to a theory of the *mental state* associated with holding those beliefs?"

  **Key Coverage Summary:**
  *   **Negation:** Q1 (Core Disagreement/Relocation), Q2 (Attitude in Denial/Composition).
  *   **Conditionals:** Q3 (Antecedent Attitude), Q4 (Validation/Normative Force).
  *   **Disagreement:** Q5 (Shared Belief Component), Q6 (Disagreement without Descriptive Conflict).
  *   **Redundancy/Attitude Semantics:** Q8 (The Squirm).
  *   **Compositionality (General):** Q7 (Complex Embeddings).

  These questions force engagement with the core Frege-Geach puzzles specifically for her hybrid structure, anticipate her likely defenses, and immediately challenge those defenses with deeper problems inherent in the view. Good luck with the colloquium!
