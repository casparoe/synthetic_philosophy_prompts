answer: |-
  ## Beyond Words: A Dialogue on Pictorial Language

  **Setting:** A sunlit workshop cluttered with drafting tables and oversized proof sheets pinned to boards. Marianne Vogl, dressed in practical work clothes, stands beside Tobias Reuter, who wears a slightly rumpled suit. They are scrutinizing two large panels laid out on a table.

  **Marianne:** Thank you for coming, Tobias. These final panels are crucial. Panel A establishes a general rule about gear-driven machines across our catalogued examples. Panel B reports the census finding on district employment limits alongside the calculated unemployment rate. We need your critical eye before printing.

  **Tobias:** (Leaning over Panel A) Marianne, your ambition is clear. But let’s start simply. This panel *shows* several distinct machines, each with gears. How does it *state* a general rule? Where is the "every"? I see specific instances, but no universal quantifier. Without it, this could just mean "Look at these machines with gears," not "All machines of this class *must* have gears." How does the picture itself assert generality?

  **Marianne:** (Points to the repeating element) Look at the serial order and the repetition of the core machine schematic. The rules are explicit: identical sign repetition signifies ‘all documented cases’, and serial order signifies the scope of the claim – all machines *in this defined class*. It’s not a word, Tobias, but it’s a syntactic function performed by the arrangement, just as word order performs functions in English. Our caption clarifies, but the assertion lives in the structured repetition itself.

  **Tobias:** Repetition signifies plurality, perhaps, but not universality or necessity. It shows *these* instances conform. What stops someone reading it as merely a report on sampled machines? Your rules say repetition means number, but number isn’t the same as quantification. You need a way to *say* "for every machine of type X". Pictures depict particulars; they don’t seem to possess the logical operator for universality.

  **Marianne:** (Taps the construction rules sheet) The rule *is* the operator. Within this system, this specific visual syntax – the standardized sign repeated in the designated sequence position – *is* how we assert the universal claim about the defined class. It’s conventional, yes, like the word ‘every’ is conventional. But the determinacy comes from the *system*, not from resemblance. Isn’t the determinacy of ‘every’ also learned through practice? Why demand instant transparency from pictures that we don’t demand from words?

  **Tobias:** (Moves to Panel B) Fair point on practice, but it highlights another gap. Here: "No establishment in District Gamma employed more than 50 people in 1938." Crucially, a *negative* finding. Where is the ‘not’? Where is the ‘no’? Pictures show what *is* present. How do you depict an *absence*? You show… buildings? But showing buildings doesn’t assert the *non*-existence of large ones. You need negation, which seems fundamentally non-pictorial. And then… this label: "Unemployment Rate: 12%". What arrangement of observable things depicts a *rate*? It’s a ratio, a calculation, an abstract magnitude – invisible!

  **Marianne:** (Points to Panel B elements) First, the negation: We use the absence of a specific sign within a predefined frame. The district outline is shown. The ‘large establishment’ sign (the factory icon scaled large) is *absent* within it. The rule states: absence of this sign within the district boundary signifies no establishment exceeded the threshold. It’s a syntactic operation defined by the system – omission signifying negation within context. As for the rate… (sighs, gestures to adjacent charts) The rate *is* derived from depicted counts – the number of worker signs, the number of ‘idle worker’ signs elsewhere in the sequence – and the transformation rule specifies how to calculate the ratio. The label ‘12%’ points to the *result* of applying that rule to the depicted quantities. It names the outcome of an operation defined pictorially and procedurally.

  **Tobias:** That’s precisely my regress worry! Your ‘absence signifies negation’ rule… how is *that* rule conveyed pictorially? If you try to depict *that* rule with pictures, showing an icon inside a boundary meaning something, and then absent meaning something else, you already presuppose the viewer understands what ‘inside’, ‘boundary’, and ‘absence’ mean *in the pictorial context* – meaning you need prior rules for interpreting *that* picture of rules! It seems your system’s determinacy ultimately rests on verbal explanations, like these written rules here. You borrow the determinacy of language.

  **Marianne:** Does language escape this? When you teach a child ‘dog’ by pointing, haven’t you already presupposed they understand pointing and shared attention? All notation requires grounding in practice. Our construction rules *are* the syntax. They define the permissible combinations and their meanings, just as grammar does. And we *can* depict basic rules using the system itself – showing sequences with and without signs, captioned by the very icons being defined. It’s bootstrapping, not necessarily regress. Besides, your strict determinacy requirement – if applied to scientific prose – would indict many terms relying on context and shared understanding. "Force," "gene," "demand curve" aren't perfectly determinate without training either.

  **Tobias:** (Pauses) Granted, ordinary language isn't perfectly crystalline. But language *has* explicit logical particles – ‘not’, ‘all’, ‘if’ – designed for these functions. Your pictorial equivalents are… gestures towards omission or repetition, requiring heavy contextual scaffolding. And look at quantity encoding! Repeating 50 tiny worker icons is impractical and hides the ratio. Enlarging a single factory icon’s area to represent 50 employees? (Points) But area isn't linear; does doubling the area mean doubling the count? Or does it suggest a physically larger building? Your signs invite confusion because they retain pictorial qualities while trying to be symbolic. Reliable notation needs discrete, easily distinguishable characters, not shaded, continuous images where boundaries blur.

  **Marianne:** (Narrows focus) Tobias, remember the practical aim: readability across languages by non-specialists. Does a bar chart perfectly encode quantity linearly? Often not initially. People *learn* to read it. Our scaling conventions *are* learned through the rules and examples. Pictorial continuity aids immediate recognition – that *is* a factory – which is vital for our audience. We *accept* that ratios like the unemployment rate require a numerical label derived by rule; our system handles the *observable inputs* pictorially. Perhaps we can’t depict *every* abstract concept directly. But for the core layer of the encyclopedia – observable spatio-temporal arrangements, their quantities, changes, and basic relations like inclusion, exclusion, and sequential dependency – this system *is* sufficient and achieves its communicative goal directly. It asserts claims like "These machines share this feature universally," or "No large factory existed here," using its own syntax.

  **Tobias:** I agree it communicates effectively! But effectiveness doesn't make it a *language*. It seems a powerful, conventionalized visual instrument *parasitic* on linguistic determinacy for its rules and its handling of abstraction. It can *illustrate* claims grounded elsewhere. My core concern remains: Depiction fundamentally lacks the combinatorial logic for assertion, negation, quantification, or modality. You simulate them through elaborate, rule-bound procedures, but the pictorial substance itself – the arrangement of icons – doesn't *carry* that logic inherently. It needs the verbal crutch you deny.

  **Marianne:** And I maintain the logic *is* carried by the syntax defined *within the pictorial medium* by its rules of combination and transformation. The determinacy arises from the system as a whole, practiced, just as language determinacy does. The ‘pictorial substance’ underdetermines meaning without rules, just as phonetic sounds do.

  **The Crux:** *Can syntactic function within a pictorial system – defined by conventional rules – fully replace the logical operators (like negation and quantification) found in verbal language, or is pictorial depiction inherently incapable of expressing such operators without borrowing determinacy from language?*

  **Tobias:** If pictorial syntax *can* fully express logical operators with self-contained determinacy, then perhaps it qualifies as a language. But I see no path to depicting the *rules of negation* without already assuming a way to read ‘absence’. The dependence seems inescapable.

  **Marianne:** If the determinacy of *all* notation, including words, ultimately rests on learned practice within a system, and our pictorial system provides that practice, then it stands on its own. The burden is to show why pictures are uniquely incapable of this, beyond the practical challenges we navigate.
