  For (d), internal features suggesting sincerity include: the visceral tears ("prorrumpí en lágrimas"), logical necessity of humility for her defense (she must disarm critics), and later textual payoff (her arguments about women's education). Irony would collapse if her self-abasement functionally enables—rather than negates—her intellectual claims. Crucially, calling herself "judge" of her ingratitude subtly asserts her capacity for judgment.

