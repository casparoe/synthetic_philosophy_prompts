answer: |-
  ### Diagnostic  
  The core disagreement in two-history cases is whether function ascriptions depend on *historical selection* (etiological) or *current systemic contribution* (causal-role). For a trait with two effects (e.g., ice-inhibition and digestion in frogs), etiological accounts assign function only to the effect that was historically selected, while causal-role accounts assign function to any effect that currently contributes to a system’s capacities. Genuine difficulties: (1) Decoupling "selected for" from "currently beneficial"—students conflate historical fitness advantage with present utility. (2) Malfunction requires grasping counterfactuals: "fails to perform its *selected* task" vs. "fails to contribute causally now." (3) Type/token confusion when variants exist: does "function of the trait" refer to lineage history or individual capacity? Load-bearing features in the case: **duplicate’s dual roles** (ice-binding/digestion), **differential selection** (ice-binding selected recently), and **variants** (A/B with trade-offs). Non-load-bearing: calcium sequestration (mere side effect), noisy fitness data (distracts from mechanism).  

  ---

  ### Teaching Plan  

  #### 1. Sequence  
  - **(a) Order of components**  
    1. **Malfunction as entry point** (5 min): Start with "Can a trait fail to function?" Uses intuitive examples (e.g., broken watch). *Depends on:* priming student intuition. *Collapses if late:* Etiological accounts seem unmotivated.  
    2. **Name etiological/causal-role accounts** (10 min): Define *after* malfunction intro. *Depends on:* grounding in a puzzle. *Collapses if early:* Labels feel arbitrary.  
    3. **Introduce frog case abstractly** (15 min): Board only key elements (trait, two roles). *Depends on:* accounts being named. *Collapses if late:* No concrete conflict to resolve.  
    4. **Add variants** (20 min): Distinguish type (lineage) vs. token (individual) claims. *Depends on:* basic grasp of accounts. *Collapses if early:* Overwhelms with complexity.  
    5. **Resolve malfunction in the case** (15 min): Payoff showing divergence. *Depends on:* variants being clear.  

  - **(b) Explicit positions**  
    - Case on board *after* accounts named (avoids premature anchoring).  
    - Malfunction *is* entry point (creates tension; etiological needs it).  
    - Type/token separation *before* case variants (prevents conflating "function of duplicate gene" vs. "function in this frog").  
    - *Avoid* heart example entirely (overfamiliar; obscures divergence in two-history cases).  

  #### 2. Carrying Case Adjustments  
  - **Cut:** Calcium sequestration (irrelevant side effect), noisy fitness data (distracts from mechanism).  
  - **Keep:** Duplicate’s dual roles (digestion/ice-binding), recent selection for ice-binding, retained ancestral role, variants A/B with trade-offs.  
  - **Time adequacy:** Trimmed case fits 75 min if board script is tight (see §4).  
  - **What a carrying case must have:**  
    - Two current causal contributions.  
    - One contribution historically selected, the other not.  
    - Variants disrupting one contribution but not the other.  
  - **What it must lack:** Ambiguity about which role was selected (here, ice-binding is clear).  
  - **Real case?** Not needed; this works. A documented case would require identical properties (e.g., gene co-option with persistent ancestral role and polymorphisms).  

  #### 3. Misconception Map  
  | Misconception | When to Head Off | Minimal Move |  
  |---------------|------------------|--------------|  
  | Function = present contribution | During malfunction intro | Q: "If a trait loses its current benefit, did it ever *have* a function?" → Board: "Benefit now vs. selected then" |  
  | Selected-effect = "usefulness" | After naming etiological | Distinction: "Selected *for* ≠ currently adaptive. Did selection *act* on ice-binding?" |  
  | Teleological smuggling ("Evolution wants...") | Discussing selection | Q: "Did selection *foresee* ice-binding?" → Inscription: "Selection: past causes, no goals" |  
  | "Verbal debate" charge | During variant analysis | Q: "Does your verdict for Variant B change if we use history vs. current role?" → Shows stakes |  
  | Circular malfunction | Defining malfunction | Board: "Malfunction: fails to do what it *was selected for* (etio) vs. fails to *currently contribute* (CR)" |  
  | **Biology-major blind spot:** "Function is whatever increases fitness now." Will surface during variant discussion. Head off by asking: "Does Variant B *have* the function of ice-binding if it’s 20°C?"  

  #### 4. Board Plan  
  - **Minimal inscriptions (left→right flow):**  
    1. **Malfunction Q:** "Can a trait FAIL to function? (e.g., broken watch)"  
    2. **Accounts:**  
       - *Etiological (SE):* Function = what trait was SELECTED FOR.  
       - *Causal-Role (CR):* Function = what trait DOES in a system NOW.  
    3. **Frog abstract:** "Gene P: Gut (digestion) + Skin (ice-binding). Skin role SELECTED."  
    4. **Variants:** "Variant A: Digests well, no ice-binding. Variant B: Ice-binds, digests poorly."  
    5. **Malfunction resolution:**  
       - SE: "Ice-binding malfunction if fails (even if digests)"  
       - CR: "No malfunction if it contributes *something* (e.g., digests)"  
  - **Keep visible:** Account definitions and malfunction resolutions.  
  - **Erase:** Initial malfunction Q, abstract frog once variants are up.  

  #### 5. Check Question  
  - **Q:** "In a warm year, a Variant B frog digests poorly. Did its P gene malfunction?"  
  - **Label-only answer:** "Yes, because it failed to digest" (confuses CR with SE) or "No, because it ice-binds" (ignores selected role).  
  - **Real answer:**  
    - SE: "No—malfunction only if fails *selected* function (ice-binding), not digestion."  
    - CR: "Yes—fails to contribute causally to digestion (a current role)."  

  #### 6. Declared Omissions  
  - **Middle positions (e.g., goal-contribution):** "Some accounts blend history and causality; we focus on poles."  
  - **Organizational/Systems approaches:** "These emphasize complexity over history; we’re contrasting history vs. current role."  
  - **Pluralist reconciliations:** "Many philosophers think both matter; today we isolate their conflict."  
  - **Semantic machinery (e.g., proper functions):** "We skip the language philosophy built on SE functions."  

  #### 7. Timing  
  - 0–5 min: Malfunction entry (Q + examples).  
  - 5–15 min: Name/define accounts (board columns).  
  - 15–30 min: Abstract frog case + selection emphasis.  
  - 30–50 min: Variants + type/token distinction.  
  - 50–65 min: Malfunction resolution in frogs.  
  - 65–75 min: Check Q + paper prep.  
  - **If 10 min behind at 35 min:** **Drop variant fitness details** (e.g., "A struggles in cold, B in warm"). State trade-offs without ecology.  

  ---  
  **Rationale**: This sequence forces the divergence early, uses the case to fracture intuitions, and isolates misconceptions through targeted questions. The board anchors the conflict visually, while omissions keep focus on the core distinction needed for the paper.
