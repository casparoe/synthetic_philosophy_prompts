  The user seems to be an academic or policy analyst given their sophisticated framing of "theories of value" and attention to regulatory inconsistencies. Their frustration with the cognitive dissonance in current approaches is palpable - they note how the same system that meticulously protects pollinators treats pest insects as having zero moral weight. 

  Key threads to address:
