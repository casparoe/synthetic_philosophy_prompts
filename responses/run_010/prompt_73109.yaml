  Must resist the urge to explain the chance authority's motives. The not-knowing is crucial to the discomfort. And that final image - her turning away from the wall - perfectly captures the "odd relief of not being responsible" they requested.

  ...time to make Marta sweat over that 0.3.
answer: |-
  The ink-black coffee steamed in Marta’s chipped porcelain mug, a precise 6:47 AM ritual. Outside her window, New Albion stirred. Rain slicked the ferrocrete streets, gleaming under the sodium lamps. On her wrist-slate, the day’s figures pulsed: **Sea Wall Delta-7 Integrity Probability (Next Winter): 0.3**. The absolute, published chance. Marta inhaled the bitter scent, letting the number settle into her bones, a familiar anchor.

  She was a Risk Calibrator for Veritas Assurance. Her job wasn’t to predict, but to *believe*. The Bureau of Objective Chances published the true, single-case probabilities – not forecasts, not estimates, but the universe’s own dice-roll odds. Marta’s skill, honed over twelve years, was unwavering deference. She priced policies, hedged bets, allocated capital, her internal certainty mirroring the Bureau’s pronouncements with machinelike fidelity. Her colleagues respected her; her superiors valued her unshakeable adherence. She took quiet pride in it. To drift was unprofessional, irrational. Worse, it was arrogant.

  The first tremor was subtle. A minor maritime insurance policy for the *Skipjack*, a coastal freighter. Bureau chance of engine failure within the quarter: **0.15**. Routine. Then, Marta overheard two dockworkers at her usual lunch spot near the Veritas tower. One, grizzled and missing two fingers, gestured wildly. "...old *Skipjack*? Skipper Jenkins pushin' her hard, tryna make up time after that condenser fiasco. Hearin’ nasty knocks from the starboard drive-shaft, loud enough to scare the gulls off." He laughed, a harsh bark. "Betting man’s odds say she coughs it before month’s end."

  Marta froze, a forkful of synth-salad halfway to her mouth. The published **0.15** remained on her mental display, cool and immutable. But the image of a straining drive-shaft, the skipper’s desperation, bloomed unwanted. *Irrelevant*, she told herself firmly. *The Bureau incorporates all causally relevant factors. Anecdote is noise.* She priced the policy at the Bureau’s figure. The *Skipjack*’s drive-shaft seized catastrophically three days later.

  A week later, assessing medical liability for a pioneering neuro-graft procedure. Bureau survival chance: **0.78**. As Marta reviewed anonymized patient profiles (standard practice), one file photo snagged her attention. Not the medical data, but a glimpse of a wrist tattoo visible in the pre-op scan: intricate, swirling lines she recognized as the mark of the ‘Neural Disruptors’, a fringe group notorious for bio-hacks gone wrong. Paranoia? Perhaps. But the **0.78** suddenly felt… brittle. She processed the case, the number unchanged in her calculations. The patient died on the table, neural pathways cascading into chaotic failure. The autopsy noted unusual, undocumented synaptic inhibitors consistent with illicit modifications.

  Then came the drift.

  It started with Marta’s own portfolio. A cluster of medium-risk infrastructure bonds – flood barriers, power grid nodes – she’d weighted perfectly to the Bureau’s published failure chances. One by one, they underperformed. Not wildly, but consistently. The crumbling seawall that collapsed months early (**Pub. Chance: 0.4**), the transformer station that blew during a storm well within its tolerance (**Pub. Chance: 0.25**). The deviations were small individually, but the *direction*… always worse. She ran the numbers. The cumulative divergence in her sector over the last quarter was statistically significant. Highly improbable, given the Bureau’s infallibility.

  She brought it up discreetly at a sector meeting. "Just an anomaly run," shrugged her manager, Brennan, a man whose belief in the Bureau was almost religious. "Variance happens. Stick to the figures, Marta. That’s why we pay the Bureau."

  "But the *pattern*—"

  "Patterns are illusions humans impose on randomness," Brennan cut in gently. "Deference, Marta. It’s our bedrock."

  The name hung unspoken in the air: **Raf**.

  Rafael Varga had been brilliant, once. A star Calibrator, like Marta. Then, five years ago, he’d started ‘adjusting’. Whispers first: he’d priced a shuttle launch policy slightly below the Bureau’s **0.98** safety rating after reading an obscure engineering report on thruster fatigue. The shuttle launched fine. But he kept doing it. Citing ‘local factors’, ‘intuition’, ‘context’. He argued the Principal Principle allowed deviation with "relevant information" the Bureau might not possess *in this specific instance*. The company tolerated it while he profited. Then came the Harbor Grid project. Bureau chance of completion delay: **0.6**. Raf, citing labor unrest whispers and supply chain hiccups he’d ‘felt in his gut’, priced it at **0.75**. The project finished early and under budget. Veritas lost millions. Raf wasn’t just fired; he was stripped of his license, his professional reputation shredded. He vanished, rumored to be running shady back-alley odds in the Bayou District. A cautionary tale whispered in training seminars. *Deviate, and you end up like Raf.*

  Marta visited the Delta-7 sea wall. It was her current knot. **0.3**. Thirty percent chance this massive, algae-streaked barrier of reinforced bio-concrete would fail next winter. She stood on the damp promenade, the salt wind whipping her hair. She’d seen the Bureau’s geological surveys, the stress models. **0.3**.

  But she’d also seen the unlogged report: a minor seismic tremor two months prior, centered nearby, barely registering. She’d read the dismissed weather model predicting an unprecedented confluence of storm surges for the coming winter. She’d noticed, in drone footage, the unusual pattern of microfractures weeping brine near the base, matching a failure mode the Bureau’s model rated as ‘negligibly probable’.

  The **0.3** glowed in her mind. Solid. Authoritative. *Safe.* To believe it utterly meant freedom. Freedom from the gnawing anxiety of *knowing* the wall would fail, from the crushing responsibility of acting on that unlicensed certainty. She could price the coastal property policies accordingly, sleep at night, collect her salary. Deference was an armor against the terrifying chaos of the actual world.

  But the image of the microfractures, like dark veins in grey flesh, wouldn’t fade. The dismissed weather data felt heavy, *real*. And the drift in her portfolio… was that the first crack in the Bureau’s foundation, or just proof she was starting to hallucinate patterns like Raf?

  Back at Veritas, the air hummed with server-cooled sterility. Brennan dropped a new file on her desk. "Big one, Marta. Coastal Redevelopment Bond. Delta-7 zone is pivotal. Bureau chance of catastrophic failure impacting the project: **0.3**. Need your calibration by end of day."

  **0.3**. The number pulsed, demanding obedience. Pricing it accurately meant Veritas could undercut competitors, win the bond, secure massive fees. Pricing it higher, based on her… suspicions… meant losing the bid, inviting scrutiny, maybe even whispers about her stability.

  She pulled up Raf’s old company photo. Sharp suit, confident smile, eyes bright with the certainty of his own insight. Where was that certainty now? Selling lucky charms in the Bayou?

  Marta closed her eyes. She saw the wall, the dark veins. She felt the weight of the ignored tremor data. She remembered the *Skipjack*’s groaning shaft, the doomed patient’s hidden tattoo. Were these the "other relevant information" the Principle allowed? Or were they just the seductive whispers of chaos, luring her towards Raf’s cliff?

  Her fingers hovered over the input field. The cursor blinked next to the **0.3**.

  *Defer. It’s safe. It’s rational. It’s your job.*

  But another voice, cold and clear, cut through: *What if the Bureau is wrong? Not just noisy, but systematically failing? What if the drift is real? What if **0.3** is a lie painted over those dark veins?*

  To input **0.3** felt like complicity. To input anything else felt like professional suicide, the first step onto Raf’s path.

  She thought of the relief of not being responsible. The comfort of the number. It was immense, like sinking into a warm, numb sea. But beneath that surface, something primal stirred – the terror of the wall collapsing, the wave swallowing the coastal homes, *knowing* she could have priced the risk higher, could have screamed a warning, but chose not to. Chose the safety of the number.

  The afternoon light slanted through the window, catching dust motes dancing in the air. Marta’s wrist-slate buzzed with a reminder. She looked at the blinking cursor, then at the rain-streaked window facing the distant sea.

  She didn’t input a number.

  Instead, she grabbed her coat. She needed to see the wall again. She needed to stand on the promenade, feel the salt spray, look at those microfractures under the grey sky, and try, desperately, to believe in **0.3**. Or fail to.

  The walk to the harbor was long and wet. The wind carried the smell of ozone and rotting seaweed. She reached the promenade, the vast, indifferent bulk of Delta-7 looming before her. The tide was high, waves slapping rhythmically against the bio-concrete. She scanned the base, searching for the dark, weeping lines she’d seen in the footage.

  There they were. Clearer now, perhaps? Or was it just the rain making them glisten? She couldn’t tell. The **0.3** echoed in her skull, a mantra against the rising tide of doubt. *Believe it. Just believe it. It’s easier.*

  But the cracks were there. In the wall. In the Bureau’s perfection. In her own unwavering faith.

  Marta stood there, coat collar turned up against the damp wind, caught between the cold comfort of the number and the terrifying, uncertain weight of the world. The sea roared its indifference. She didn’t move towards the wall for a closer look. She didn’t move away. She just stood, suspended in the grey space between deference and doubt, the question hanging, raw and unresolved: What do you do when the truth you’re ordered to believe starts to feel like a lie, and the only alternative feels like madness? The relief of not being responsible was still there, a seductive undertow, but it tasted like salt and ashes now. The calculation remained unfinished. The bet, unplaced. The wave, still gathering force, out beyond the horizon.
