  First, I need to understand the salvage criterion. It defines "where am I?" by the location of the object whose destruction would result in death. In cases with duplicates, location is indeterminate because destroying either doesn't cause death. The user provided specific angles to cover: circularity, dependence on undetectable engineering, threshold problems, phenomenology, switch-flipping moments, teletransportation applications, and falsifiability. Plus, they want to prevent the guest from dodging with "that's an identity question."

  The user is likely well-versed in philosophy of mind, given their podcast focus. They want a rigorous discussion that pushes the guest's theory. The questions need to be incisive but fair, forcing the guest to defend her position. Unspoken needs might include making the episode engaging for listeners by highlighting tensions in the theory and ensuring the guest can't easily deflect.

  For circularity: The criterion uses "my death," which presupposes the "me" it's trying to locate. The user suggests a follow-up comparing it to defining "water in the glass." The guest might argue it's harmless circularity, so the follow-up should challenge if the definition actually explains anything or just labels the problem.

  Engineering details: The criterion depends on whether a duplicate is wired in sync, which isn't introspectively detectable. The follow-up should probe why location isn't first-person accessible, questioning the intuitive pull of the original scenario where the narrator feels located in the body.

  Threshold problem: Ordinary brain damage doesn't cause death, so the "thing" isn't a single point. If the guest limits the criterion to puzzle cases, the follow-up should ask why it only applies there, risking inconsistency.

  Phenomenology: The original scene has the narrator feeling located in the body despite the brain being in a vat. Does the salvage criterion ignore that subjective experience? The follow-up should push on whether the theory dismisses the puzzle's core.

  Switch-flipping moment: When the switch is flipped and nothing changes, the location becomes indeterminate. Does this indeterminacy have any experiential effect? If not, what does it add? The follow-up should challenge the ontological status of such indeterminacy.

  Applied cases: Teletransporters and uploading—salvage says you're where the copy is or nowhere if duplicated. How does this handle Star Trek scenarios where transporters create copies? Does it align with practical concerns like continuity?

  Falsifiability: Can any counterexample be absorbed by declaring indeterminacy? This risks making the theory unfalsifiable. The follow-up should ask for clear criteria where location must be determinate, testing the theory's limits.

  To block the "identity vs. location" dodge, I need a question that conflates the two. Perhaps asking about the moment of duplication, where identity and location become entangled. Force the guest to address both simultaneously.

  Structuring the questions: Start with circularity to challenge the foundation. Move to engineering details to highlight external dependence. Then threshold to test ordinary cases. Phenomenology questions the subjective aspect. Switch-flipping addresses indeterminacy's implications. Applied cases show real-world relevance. Falsifiability tests the theory's strength. The "blocking" question should come after phenomenology, using the switch moment to tie identity and location together.

  Ensure each question has a follow-up ready, anticipating the guest's responses. The goal is a dynamic interview that reveals the theory's strengths and weaknesses, providing listeners with a deep understanding of the salvage criterion and its implications for personal identity and location.
answer: |-
  Here are eight tightly-focused, biting questions designed to push the salvage criterion, incorporating your specific requests and anticipating dodges:

  1.  **Circularity & Bootstrapping:** "Your salvage criterion defines 'where I am' by locating 'the thing whose destruction would be *my* death.' Doesn't this smuggles in the very 'me' it's supposed to locate *before* it defines the location? How is this not viciously circular?"  
      *[Likely Reply: Harmless circularity, like defining "water in this glass"]*  
      **Follow-up:** "But 'water in this glass' relies on a pre-theoretical grasp of both 'water' and spatial containment. Your criterion seems to rely on a pre-theoretical grasp of *personal identity* ('my death') to define location, which is precisely what's contested in these puzzles. Doesn't this mean the criterion *presupposes* an answer to the identity question it was meant to sidestep?"

  2.  **Engineering Dependence & First-Person Access:** "The criterion crucially depends on external engineering facts – like whether the duplicate brain is wired in locked-step or not – facts utterly inaccessible to the subject. Why should the answer to 'Where am *I*?' – a question rooted in my immediate, first-person perspective – flip based on wiring diagrams I couldn't possibly detect from the inside?"  
      *[Likely Reply: Location was never supposed to be first-person accessible in that way]*  
      **Follow-up:** "But doesn't this completely sidestep the *phenomenological force* of the original scene? Dennett's narrator *feels* he's looking out of Hubert's eyes, even knowing Yorick is in the vat. If location isn't tied to that first-person perspective at all, what work is it doing for *me*, the conscious subject asking the question? Isn't the salvage criterion answering a purely third-person, biological question, not the introspective 'where am I?' the puzzle poses?"

  3.  **Threshold Problem & Ordinary Cases:** "Applied strictly, the criterion seems absurd for ordinary life. I survive losing small chunks of brain tissue. So, strictly speaking, 'the thing whose destruction would be my death' isn't a point location like Yorick, but a vague, smeared-out critical mass of neural tissue. Does this mean my location is fundamentally indeterminate or smeared even now? Or is the criterion only meant for 'puzzle cases'?"  
      *[Likely Reply: Only meant for puzzle cases / precise duplicates]*  
      **Follow-up:** "If it only applies to idealized puzzle cases, doesn't that severely limit its explanatory power? How do we draw the line between a 'puzzle case' triggering the criterion and an 'ordinary case' where location might be vague or smeared? Doesn't this risk making the criterion an *ad hoc* tool specifically designed *only* to dissolve these thought experiments, rather than a general principle?"

  4.  **Phenomenology & Subject-Changing:** "Does the salvage criterion actually engage with the core *pull* of the original scenario – the feeling that 'I' am *here*, looking out through Hubert's eyes, even while knowing 'my brain' is over *there*? Or does declaring location indeterminate simply change the subject away from that persistent, first-person sense of embodiment and location?"

  5.  **Blocking the "Identity/Location" Dodge & The Switch Moment:** "Let's focus on the moment the duplicate is activated and the switch is flipped. *By hypothesis*, absolutely nothing changes for the subject's conscious experience. Yet, according to your view, at that instant, my location flips from being determinate (say, with Yorick) to being fundamentally indeterminate. What, experientially or ontologically, corresponds to this sudden shift into indeterminacy? If *nothing feels or seems different* to the subject, what substantive work is the indeterminacy doing beyond declaring the 'where am I?' question ill-posed? Doesn't this moment *force* the identity and location questions together – if 'where I am' becomes indeterminate precisely when 'which one is *me*?' becomes unanswerable, how can you maintain the strict separation you often rely on?"

  6.  **The Applied Edge: Uploading & Teleportation:** "Applied to Star Trek-style transporters or whole-brain emulation, the salvage criterion gives a clear but stark answer: after a successful upload where the original is destroyed, 'I' am where the upload runs. If the original isn't destroyed, I am nowhere. This seems clean, but does it adequately capture our intuitions about *survival* and *continuity*? If I step into a teletransporter knowing it creates a duplicate on Mars while destroying me here, does declaring 'I am nowhere' truly reflect the practical significance of that scenario for *me*, the person stepping in?"

  7.  **Falsifiability & Absorbing Counterexamples:** "The criterion is very powerful: in any duplication scenario, it declares location indeterminate. This seems to make it immune to counterexamples within duplication puzzles – any challenge can be met by declaring indeterminacy. What specific observation, thought experiment outcome, or real-world case (even hypothetical) *could* potentially falsify or seriously challenge the salvage criterion? If none, does it risk being untestable?"

  8.  **Closing: The Core Motivation:** "Setting aside the technical arguments, what's the fundamental philosophical *motivation* for dissolving 'Where Am I?' via spatial indeterminacy? Is it primarily to avoid committing to a particular theory of personal identity (like brain or body), to highlight the limitations of spatial metaphors for the self, or something else entirely?"

  **Why this structure & why it bites:**

  1.  **Opens with Core Vulnerability (Circularity):** Immediately challenges the logical foundation, forcing justification for the core definition.
  2.  **Hits Key Objection (Engineering Dependence):** Directly confronts the disconnect between external facts and the first-person question, pushing on the phenomenology point implicitly.
  3.  **Exposes Potential Ad Hoc-ness (Threshold):** Tests the criterion's generality and applicability, highlighting a potential weakness in its scope.
  4.  **Forces Engagement with Phenomenology:** Prevents easy dismissal of the subjective experience central to the puzzle's appeal.
  5.  **Crucial "Dodge-Blocking" Question (Switch Moment):** This is the centerpiece. By focusing on the *change* to indeterminacy *with no experiential difference*, it directly ties the indeterminacy of location to the indeterminacy of identity *in that specific moment*, making the "that's identity, not location" dodge much harder. The guest *has* to address what the indeterminacy signifies if it has no experiential correlate.
  6.  **Tests Practical Implications (Uploading):** Shows the real-world consequences of the view, probing if it aligns with intuitive concerns about survival.
  7.  **Challenges Scientific Status (Falsifiability):** Pushes the view to defend itself against the charge of being unfalsifiable or merely stipulative.
  8.  **Closes on Motivation:** Shifts from defense to the underlying philosophical drive, offering a reflective conclusion.

  These questions assume familiarity with the paper/podcast context and dive straight into the toughest objections, minimizing restatement time and maximizing critical engagement. The "Switch Moment" question (#5) is specifically placed and phrased to make the identity/location separation dodge difficult by forcing an explanation of what indeterminacy *is* if it has no experiential or detectable consequence at the moment it arises.
