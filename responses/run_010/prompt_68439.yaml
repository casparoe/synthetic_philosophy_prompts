prompt: |-
  I'm a backend engineer on the pricing team at a mid-sized marketplace company, and I run an internal reading group called "decisions and incentives" — roughly a dozen people, mostly engineers and product managers plus two data scientists, all comfortable with matrices, expected values, and a bit of Python, none of whom has taken a course in game theory or philosophy. Next Thursday I have ninety minutes, a whiteboard with two working markers, and a topic a colleague suggested: the idea that some options can be ruled out as irrational without knowing anything at all about what the other people in the situation will do, and how far that procedure carries you when you feed its output back in. I've decided the spine of the session is iterated elimination of dominated strategies, and specifically the version in which a pure option may be dominated by a *mixture* rather than by any single alternative, because my own first pass through the material convinced me that the pure-strategy-only version is a toy that hides the whole point. To be clear about the deliverable: I'm not asking for a write-up of the material, and I don't want references or a syllabus. I want the sequencing plan and its rationale — which pieces must be in place before which others can mean anything, and why the dependencies run in that direction rather than some other. I already suspect that dominance has to be anchored to "against everything the other player might do" instead of "against the choice they happen to make" before anything downstream works, but I genuinely cannot tell whether that distinction has to land before or after I put a payoff matrix on the board, and I don't know how to get from one-shot deletion to iteration without the room losing track of what has changed between rounds. There is also a claim I half-remember from somewhere and have been unable to reconstruct: that a pure strategy which is never a best response to any belief about the others is always strictly dominated by some mixture, and conversely. Please confirm it, correct it, or tell me I'm mangling it — and then tell me whether it earns ninety minutes of stage time or belongs in a footnote.

  For seeding, here is the 3×3 game I built in a spreadsheet to serve as the running example. Row player's payoffs across columns X, Y, Z: strategy A gives 4, 0, 0; strategy B gives 0, 4, 0; strategy C gives 1, 1, −1. Column player's payoffs down rows A, B, C: strategy X gives 0, 4, 0; strategy Y gives 4, 0, 0; strategy Z gives 1, 1, 5. I chose it for three reasons: C is strictly dominated by a fifty-fifty mixture of A and B and by no pure strategy at all; deleting C then makes Z strictly dominated by a fifty-fifty mixture of X and Y, which it was not before, so the example demonstrates that elimination can *create* dominance; and what survives is a two-by-two matching-pennies shape, which I like because everyone has played that game without knowing its name. Tell me whether this is the right thing to carry the whole session, whether it does too much work at once for people who are simultaneously learning to read a bimatrix, whether I should open with a smaller one-player decision problem purely to fix the notation, and whether the negative entries will cause trouble with an audience that will reflexively try to read every number as dollars. If you think a different example would teach the same two lessons with less machinery, describe what it must have and what it must conspicuously lack rather than just asserting it is better.

  Second, I want the misconception map, with a designated point in the sequence for each. My guesses, in no particular order: that "dominated" collapses in their heads into "has the smallest number somewhere" or into "just take the max"; that deleting a strategy feels to them like *assuming* the other player is stupid or predictable, rather than like reasoning about what a rational player could never do; that a mixed strategy reads as a behavioral instruction to actually randomize, at which point someone will ask me how they'd seed it in production; that weakly dominated options get treated as deletable by the same move, with nobody noticing that order suddenly matters; and that whatever survives elimination gets received as "the correct thing to do" rather than as "everything not yet ruled out." Tell me which of these I should head off pre-emptively and where, which one I should instead let somebody say out loud and then use, and which one will resurface at the end no matter how well I handle it early. I'd also like one closing check — something answerable in two or three minutes that reliably separates the people who grasped the iteration from the people who merely watched me erase rows — plus an explicit statement of what I should refuse to cover and announce that I'm refusing. I'm inclined to defer all talk of equilibrium to a later session, but I can't tell whether the elimination story quietly depends on at least a gesture toward it, or whether naming it will let the room hijack the last half hour.
reasoning: |-
  We are designing a 90-minute session on iterated elimination of dominated strategies, with a focus on mixed strategies. The audience is technical but new to game theory. We'll use a specific 3x3 example to demonstrate key concepts.

  Key dependencies in the sequencing plan:

  1. **Start with the basics of a game matrix and payoffs** - Without this, no other concept can be introduced. We must explain the structure of the game (players, strategies, payoffs) and the idea of dominance.

  2. **Define strict dominance with pure strategies first?** Actually, given the focus on mixed strategies, we might skip pure dominance except to show its limitations. However, the concept of dominance "against everything the other player might do" must be established early.

  3. **Introduce the idea of mixed strategies** - This is necessary to define dominance by a mixed strategy. Without this, we cannot explain why a strategy might be dominated only by a mixture.

  4. **Define strict dominance by a mixed strategy** - This is the core concept. We must anchor the idea that a strategy is dominated if there exists a mixed strategy (over the other pure strategies) that yields a strictly higher payoff against every possible pure strategy of the opponent.

  5. **Show the example and demonstrate the first elimination** - Using the provided 3x3 game, show that C is strictly dominated by a 50-50 mixture of A and B. This requires calculating the expected payoff of the mixture against each of the column player's strategies and comparing to C.

  6. **Iterate the process** - After deleting C, show that now Z becomes strictly dominated by a mixture of X and Y. This demonstrates that elimination can create new dominance relations.

  7. **Reach the residual game** - The matching pennies subgame remains.

  8. **Discuss the result** - What does it mean that we are left with this? Emphasize that we have ruled out irrational strategies without assuming anything about the opponent's behavior, but we haven't necessarily found a solution.

  9. **The theorem on never best response and strict dominance** - State and briefly explain the equivalence: a pure strategy is strictly dominated (by some mixture) if and only if it is never a best response to any belief about the others. This is a deep point and might be a good capstone.

  Now, to the sequencing plan:

  **Total: 90 minutes**

  1. **Introduction and game setup (10 minutes)**  
     - Introduce the problem: How to reason rationally in strategic situations without knowing what others will do?  
     - Present the 3x3 game matrix on the board. Label row player (call her Rowena) and column player (call him Colin).  
     - Explain the payoff matrix: For each cell, (payoff to Rowena, payoff to Colin).  
     - Go through each cell to make sure they can read it.  
     - *Why now?* Without a concrete example, the abstract concepts won't land.  
     - *Pre-empt misconception:* The negative payoff in (C,Z) might cause concern. Explain that payoffs are arbitrary numerical representations of utility. It's not dollars. We can say that negative might represent a loss or a cost.

  2. **Dominance by pure strategies: a false start? (5 minutes)**  
     - Ask: Can any strategy be eliminated immediately? Check for pure strategy dominance.  
     - For Rowena: Compare A, B, and C.  
       - Against X: A=4, B=0, C=1 -> no dominance.  
       - Against Y: A=0, B=4, C=1 -> no dominance.  
       - Against Z: A=0, B=0, C=-1 -> C is worse than both A and B? But note: for pure dominance, we need one strategy that is better against every column. But A isn't always better (e.g., against Y, A=0 vs B=4). Similarly for B. So no pure strategy dominates another.  
     - For Colin: Similarly, no pure strategy dominates another.  
     - *Rationale:* Show that pure dominance is too weak. We need a stronger tool.

  3. **Introduce mixed strategies and dominance by mixtures (20 minutes)**  
     - Define a mixed strategy for Rowena: a probability distribution over A, B, C.  
     - Focus on a specific mixture: 50% A and 50% B (ignore C for the mixture).  
     - Compute expected payoff of this mixture against each of Colin's pure strategies:  
       - Against X: (0.5*4 + 0.5*0) = 2  
       - Against Y: (0.5*0 + 0.5*4) = 2  
       - Against Z: (0.5*0 + 0.5*0) = 0  
     - Compare to C: C gives 1, 1, -1 respectively.  
     - So against every Colin strategy, the mixture gives more: 2>1, 2>1, 0>-1. Therefore, C is strictly dominated by the mixture.  
     - *Key definition:* A strategy is strictly dominated if there exists a mixed strategy (over the other strategies) that yields a strictly higher payoff against every possible pure strategy of the opponent.  
     - *Why now?* We must establish the concept of dominance by mixtures to proceed.  
     - *Pre-empt misconception:* Clarify that the mixture is a plan, not necessarily a randomized action. We are not suggesting that Rowena must randomize in practice. The mixture is a tool for reasoning.  
     - *Rationale:* This step is the heart of the session. Take time to ensure the calculation is understood.

  4. **First elimination and its consequence (10 minutes)**  
     - Eliminate C. Now the game is 2x3 (Rowena: A, B; Colin: X, Y, Z).  
     - Show that now for Colin, Z is strictly dominated by a mixture? We have to check.  
     - Consider a mixture of X and Y: say 50% X and 50% Y.  
       - Against Rowena's A: (0.5*0 + 0.5*4) = 2  
       - Against Rowena's B: (0.5*4 + 0.5*0) = 2  
       - Compare to Z: against A: 1, against B: 1 -> 2>1 and 2>1.  
       - But note: the mixture gives 2 in both cases, while Z gives 1. So Z is strictly dominated by the mixture.  
     - *Key point:* After eliminating C, Z becomes dominated. Elimination can create dominance.  
     - *Why now?* This demonstrates iteration and the dynamic aspect.

  5. **Second elimination and residual game (5 minutes)**  
     - Eliminate Z. Now the game is 2x2: matching pennies.  
     - Show the payoffs:  
       - (A,X): (4,0) -> Rowena happy, Colin unhappy.  
       - (A,Y): (0,4)  
       - (B,X): (0,4)  
       - (B,Y): (4,0)  
     - Note that no further elimination is possible.  
     - *Rationale:* We have reached a point where no strategy is dominated (by any mixture).  
     - *Pre-empt misconception:* The residual game is not "the solution" but the set of strategies that survived rational elimination. It does not tell the players what to do.

  6. **Discussion of the process and its meaning (10 minutes)**  
     - What have we done? We iteratively removed strategies that are strictly dominated, meaning that they are never rational because there's always a better response (a mixture) no matter what the opponent does.  
     - Emphasize: This requires no assumption about the opponent's behavior.  
     - Contrast with: "If I assume the opponent does X, then I should do Y" - which is not robust.  
     - The result: We are left with a game where no strategy can be eliminated. But note: in matching pennies, there is no pure strategy equilibrium.  
     - *Why now?* Consolidate the learning.

  7. **The theorem: never best response and strict dominance (15 minutes)**  
     - State the theorem: A pure strategy is strictly dominated (by some mixture) if and only if it is never a best response to any belief about the opponents.  
     - Explain:  
       - Belief: a probability distribution over the opponents' strategies.  
       - Best response: the strategy that maximizes expected payoff given the belief.  
     - In our example:  
       - C was never a best response? Let's see: for any belief about Colin (pX, pY, pZ), the expected payoff of C is: 1*pX + 1*pY -1*pZ = (pX+pY) - pZ.  
       - The mixture of A and B (50-50) gives: 2*pX + 2*pY + 0*pZ = 2*(pX+pY).  
       - Since pX+pY = 1-pZ, we have: 2*(1-pZ) vs 1*(1-pZ) - pZ = 1 - 2pZ? Actually, wait: the expected payoff of C is: 1*pX + 1*pY -1*pZ = (pX+pY) - pZ = (1-pZ) - pZ = 1 - 2pZ?  
       - Actually, the expected payoff of C is:  
          - If Colin plays X: 1, Y:1, Z:-1 -> so E[C] = 1*pX + 1*pY + (-1)*pZ = pX + pY - pZ = (1-pZ) - pZ = 1 - 2pZ.  
       - The mixture (50-50 A and B) gives:  
          - Against X: 2, Y:2, Z:0 -> E[mixture] = 2*pX + 2*pY + 0*pZ = 2*(pX+pY) = 2*(1-pZ).  
       - Compare: 2*(1-pZ) vs 1 - 2pZ.  
          - 2-2pZ - (1-2pZ) = 1 >0. So the mixture always gives 1 more than C? Actually:  
            2(1-pZ) - (1-2pZ) = 2 - 2pZ -1 + 2pZ = 1.  
          - So the mixture is always 1 unit better than C, regardless of the belief. Hence, C is never a best response.  
     - Conversely, if a strategy is never a best response, then it must be strictly dominated. (We won't prove, but it's true.)  
     - *Why now?* This ties together the two concepts (dominance and best response) and provides a deeper insight.  
     - *Time allocation:* 15 minutes is enough to state, explain with the example, and note the importance. It's a key insight.

  8. **Common misconceptions and how to handle them (integrated throughout, but recap at the end)**  
     - Misconception: "Dominated" means "has the smallest number somewhere".  
       - *Handling:* We have shown that we compare across the entire row (for Rowena) against each column. We require better against every column.  
     - Misconception: Deleting a strategy assumes the opponent won't play it.  
       - *Handling:* Emphasize: we are not assuming anything about the opponent. We are saying that the strategy is bad no matter what the opponent does.  
     - Misconception: Mixed strategies require actual randomization.  
       - *Handling:* Clarify that mixed strategy here is a tool for reasoning. We are not requiring the player to randomize.  
     - Misconception: Weak dominance and order dependence.  
       - *Handling:* We are only using strict dominance, so order doesn't matter. But note: if we had weak dominance, order would matter. We avoid that by sticking to strict.  
     - Misconception: The residual set is the solution.  
       - *Handling:* Emphasize that it's the set of rationalizable strategies. It doesn't tell you what to do, only what not to do.

  9. **Closing check (5 minutes)**  
     - Pose a quick question: Consider a 2x2 game:  
          Rowena: 
            A: (3, ?) and (0, ?)
            B: (0, ?) and (3, ?)
          Colin: 
            X: (?, 1) and (?, 1)
            Y: (?, 0) and (?, 4)
       Actually, let's make it symmetric. Better:  
          Rowena / Colin | X       Y
          --------------------------
          A             | (3,3) (0,5)
          B             | (0,5) (3,3)
       But that doesn't have a dominated strategy. Let me build one for dominance.

     - Alternatively, use a simple one:  
          Rowena: 
            U: (1,?) (1,?) 
            D: (0,?) (2,?)
          Colin: L and R.

       For Rowena: 
          Against L: U gives 1, D gives 0 -> U better.
          Against R: U gives 1, D gives 2 -> D better.
          So no pure strategy dominance. But is there a dominated strategy by a mixture? 
          Consider a mixture over U and D? Actually, let's see if U is dominated. 
          We need a mixed strategy that does better than U against both L and R. 
          But note: against L, U is better than D. So any mixture that includes D would do worse against L than pure U? 
          Actually, U is not dominated. D is not dominated because against R it's the best.

       Let me create a dominated strategy:  
          Rowena has three strategies: U, M, D.
          U: (1, ...) (1, ...)
          M: (0, ...) (0, ...)
          D: (0, ...) (2, ...)

       Now, M is strictly dominated by U (against both L and R: 1>0 and 1>0). Also, M is strictly dominated by a mixture? Actually, by pure U. So it's a pure dominance.

     - Instead, let's do:  
          Rowena: 
            U: (2, ...) (0, ...)
            M: (1, ...) (1, ...)
            D: (0, ...) (2, ...)

       Now, M is strictly dominated by a 50-50 mixture of U and D? 
          Against L: mixture gives 0.5*2 + 0.5*0 = 1, which equals M (1). 
          We need strictly better. So we need a different mixture. 
          Try 60% U and 40% D: 
            Against L: 0.6*2 + 0.4*0 = 1.2 > 1
            Against R: 0.6*0 + 0.4*2 = 0.8 < 1 -> not better.

       How about 50% U and 50% D? 
          Against L: 1, against R: 1 -> same as M. 
          So we need to show that M is not dominated? 

     - Actually, we can use a variant of the original example. Create a small one:

          Colin L | Colin R
          ---------|---------
          A: 4, ? | 0, ?   -> Row1
          B: 0, ? | 4, ?   -> Row2
          C: 1, ? | 1, ?   -> Row3

       Then C is strictly dominated by a 50-50 mixture of A and B: 
          Against L: 0.5*4 + 0.5*0 = 2 > 1
          Against R: 0.5*0 + 0.5*4 = 2 > 1

       So the check: 
          "In this game, is there a dominated strategy? If so, which one and by what?"
          Then: "If we eliminate that strategy, is there another dominated strategy? Why or why not?"

       But note: after eliminating C, we have a 2x2 and no further dominance. So the residual set is {A, B} for Rowena and {L, R} for Colin.

     - This check is answerable in 2-3 minutes and tests understanding of dominance by mixtures and one round of elimination.

  10. **Refuse to cover (announced at the beginning and end)**  
      - We are not covering Nash equilibrium today. We are focusing on a procedure that does not require fixed-point reasoning.  
      - We are not covering weak dominance (because of order dependence issues).  
      - We are not going into the algorithmic complexity of the process.  
      - We are not discussing correlated strategies or other refinements.  

  **Why the example is suitable:**  
  - It shows both the need for mixtures (C is not dominated by any pure strategy) and the creation of dominance after elimination (Z becomes dominated after C is removed).  
  - The residual game is a simple and familiar one (matching pennies).  
  - The negative number: It's only one entry and we can explain it as a loss. The audience can handle it.  

  **Potential adjustments:**  
  - If the audience struggles with the matrix reading, we might spend more time on step 1.  
  - We might pre-empt the misconception about mixtures by explicitly saying: "We are not talking about implementing randomization in production. This is a conceptual tool for reasoning under uncertainty."  

  **Timeline:**  
  - 0-10 min: Setup and game explanation.  
  - 10-15 min: Check for pure dominance (and show it fails).  
  - 15-35 min: Mixed strategies and first elimination (C).  
  - 35-45 min: Second elimination (Z) and residual game.  
  - 45-55 min: Discussion of the process and meaning.  
  - 55-70 min: The theorem on never best response.  
  - 70-85 min: Recap misconceptions, Q&A.  
  - 85-90 min: Closing check.  

  **The theorem:**  
  It is true that a pure strategy is strictly dominated (by some mixture of the other strategies) if and only if it is never a best response to any belief about the opponents. This is worth 15 minutes because it connects two fundamental ideas and shows why iterated elimination works: we are removing strategies that are never rational. It also provides a foundation for future topics (like rationalizability).  

  **Final note:**  
  The session is ambitious. If time runs short, the theorem might be shortened to a statement and a quick illustration without the detailed belief calculation. But it's a key insight that elevates the session beyond a mechanical procedure.
answer: |-
  ### Sequencing Plan with Rationale
  **Core Objective:** Build understanding of iterated elimination of strictly dominated strategies (IESDS) with mixed strategies, demonstrating how options are ruled out without assumptions about opponents' behavior. Sequence must establish foundational concepts before iteration, and iteration before deeper implications.

  ---

  #### **Phase 1: Anchor Dominance Against All Opponent Actions (15 min)**
  - **Why first?** Dominance is meaningless without universal quantification ("against *every* opponent action"). If not anchored upfront, learners will conflate it with "best against a *specific* action" or "max-payoff" thinking.
  - **Sequence:**  
    1. **1-player warmup (5 min):**  
       - Sketch a *non-game* decision:  
         ```
         Options: A=(3), B=(5), C=(1)  
         Ruling out: C is dominated by B (pure).  
         ```  
       - **Purpose:** Fix notation (payoffs, strategies) and intuition: "dominated = never rational, regardless of world-states."  
    2. **Introduce 2-player matrix (10 min):**  
       - Draw your 3×3 bimatrix. Rowena (row player), Colin (column player).  
       - **Key move:** Define strict dominance for Rowena:  
         *"Strategy S is strictly dominated if there exists **any** strategy (pure or mixed) that gives > payoff **for every possible Colin choice**."*  
       - **Rationale:** Must stress "every possible Colin choice" before showing calculations. Contrast:  
         - Wrong: "If Colin picks X, A is best." (assumes opponent action)  
         - Right: "Even if Colin picks X, Y, or Z, I have an option better than C."  
       - **Preempt misconception:** Negative payoffs are fine—clarify *immediately*: "Payoffs are arbitrary utilities, not dollars. Negative = undesirable outcome."

  ---

  #### **Phase 2: Mixed Strategies and First Elimination (25 min)**
  - **Why now?** Pure-strategy dominance is intuitive but inadequate. Mixed strategies reveal the core insight: irrationality can stem from *flexibility*.
  - **Sequence:**  
    1. **Show C is dominated by mix of A/B (15 min):**  
       - Calculate for Colin's actions:  
         - vs. X: 50% A/B = (0.5×4 + 0.5×0) = **2 > 1** (C)  
         - vs. Y: 50% A/B = (0.5×0 + 0.5×4) = **2 > 1** (C)  
         - vs. Z: 50% A/B = (0.5×0 + 0.5×0) = **0 > -1** (C)  
       - **Emphasize:** "No single pure strategy beats C everywhere, but a mix does. C is irrational because it loses to a *plan* of randomizing A/B, **regardless of Colin's choice**."  
    2. **Address randomization misconception (5 min):**  
       - *Anticipate:* "How do I seed this in production?"  
       - **Response:** "Mixed strategies here are **proof tools**, not behavioral prescriptions. We’re proving C is illogical, not telling Rowena to randomize."  
    3. **Eliminate C (5 min):**  
       - Cross out C. State: "Rational Rowena never plays C. Colin knows this."

  ---

  #### **Phase 3: Iteration and Emergent Dominance (20 min)**
  - **Why after first elimination?** Learners must see the game state change *before* iterating. Use physical deletion (whiteboard) to visualize progress.
  - **Sequence:**  
    1. **Newly dominant Z (10 min):**  
       - Post-C matrix: Rows A,B; Columns X,Y,Z.  
       - Show Z is now dominated by 50% X/Y mix:  
         - vs. A: 50% X/Y = (0.5×0 + 0.5×4) = **2 > 1** (Z)  
         - vs. B: 50% X/Y = (0.5×4 + 0.5×0) = **2 > 1** (Z)  
       - **Key insight:** "Deleting C **changed Colin’s incentives**. Z wasn’t dominated before, but now it is. Iteration reveals new irrationalities."  
    2. **Eliminate Z → residual matching pennies (5 min):**  
       - Cross out Z. Show 2×2 game: (A,X)=(4,0), (A,Y)=(0,4), (B,X)=(0,4), (B,Y)=(4,0).  
    3. **No further dominance (5 min):**  
       - Show that no strategies are dominated now (pure or mixed).  
       - **Stress:** "Output is **what survives rationality checks**, not 'the solution.'"

  ---

  #### **Phase 4: Never-Best-Response Theorem (15 min)**
  - **Why last?** Requires mastery of dominance and beliefs. It’s a capstone, not a dependency for IESDS.
  - **Sequence:**  
    1. **State theorem (5 min):**  
       *"A pure strategy is strictly dominated iff it is **never a best response** to any belief about opponents' actions."*  
       - **Clarify:** "Belief = probability distribution over opponents' strategies."  
       - **Confirm:** Your memory is correct. (Proof sketch: If dominated, no belief justifies it; if never BR, a dominating mix exists.)  
    2. **Illustrate with C (10 min):**  
       - For C to be a best response, belief (p_X, p_Y, p_Z) must satisfy:  
         `1*p_X + 1*p_Y -1*p_Z > 4*p_X + 0*p_Y + 0*p_Z` (if A is best)  
         `... > 0*p_X + 4*p_Y + 0*p_Z` (if B is best)  
       - Show inequalities fail for all beliefs.  
       - **Depth vs. time:** Worth 15 min—it unifies dominance with belief-based rationality and justifies IESDS. But **announce upfront**: "This is advanced; we’ll focus on intuition."

  ---

  #### **Misconception Map & Handling**
  | Misconception | Handling Strategy | When to Address |
  |---------------|-------------------|----------------|
  | "Dominated = smallest number in a column" | Contrast row-wise vs. column-wise comparisons during Phase 1. | Phase 1 (when defining dominance) |
  | "Deletion assumes opponents are stupid" | Stress: "We rule out *our own* irrational options, regardless of opponents' rationality." | Phase 2 (after first elimination) |
  | "Mixed strategy = must randomize" | Explicitly decouple "proof tool" from "implementation" (Phase 2). | Phase 2 (when introducing mixtures) |
  | "Residual set = the correct choice" | Show matching pennies has no dominant strategies. Emphasize: "Survival ≠ optimal." | Phase 3 (when residual game appears) |
  | "Weak dominance is the same" | **Avoid entirely.** State: "We only use strict dominance—order doesn’t matter. Weak breaks this." | If asked: "Defer to next session; weak adds complexity." |

  - **Let them say aloud:** "Delete C → assume Colin won’t play it?" Use this to **reinforce Phase 1**: "Even if Colin plays Z, C is worse than A/B mix. No assumption needed."
  - **Will resurface:** "Residual set = correct choice." Combat by asking: "In matching pennies, what should Rowena do?" (No dominant action → no single answer.)

  ---

  #### **Closing Check & Refusals**
  - **3-min diagnostic question:**  
    Present a new 2×3 game:  
    - Rowena: U=(3,0), V=(0,3), W=(1,1)  
    - Colin: L=(payoffs irrelevant), R=(irrelevant)  
    Ask: *"Which strategies survive IESDS? Why?"*  
    - **Expected:** W is dominated by 50% U/V mix. U and V survive.  
    - **Why it works:** Catches "has max in a column" (W has highest min) vs. "dominated by mixture."
    
  - **Explicit refusals (announce upfront):**  
    - "We **will not cover** Nash equilibrium—it requires different reasoning."  
    - "We **ignore weak dominance**—it introduces order dependence."  
    - "We **skip behavioral interpretations** of mixing—focus on logical elimination."  
    **Rationale:** Prevents hijacking (e.g., equilibrium debates) and scope creep.

  ---

  ### Assessment of Your Example
  **Strengths:**  
  - Perfectly demonstrates both lessons: (1) mixtures matter (C dominated only by mix), (2) iteration creates dominance (Z becomes dominated post-C).  
  - Matching pennies residual elegantly shows survival ≠ optimality.  

  **Adjustments recommended:**  
  - **Open with 1-player example** (Phase 1) to teach notation without game-theoretic distractions.  
  - **Explicitly ignore column-player payoffs initially** (only reveal when needed). Reduces cognitive load.  
  - **Negative payoffs are acceptable**—use them to underscore "utility ≠ dollars."  

  **Not too much machinery:** Group can handle 3×3. Smaller games (e.g., 2×2) hide iteration’s power.  

  ---

  ### Session Flow Summary
  1. **0–15 min:** Dominance defined universally (1-player → bimatrix).  
  2. **15–40 min:** Mixed strategies → delete C.  
  3. **40–60 min:** Iteration → delete Z → matching pennies.  
  4. **60–75 min:** Never-best-response theorem.  
  5. **75–85 min:** Misconception recap + diagnostic.  
  6. **85–90 min:** Q&A + refusals reinforced.  

  **Critical dependency order:**  
  Universal dominance → mixed strategies → iteration → belief equivalence.  
  **Why?** Each step builds logical leverage for the next; inverting (e.g., iteration before mixed) collapses meaning.
