  After wrestling with your cases and the philosophical/economics literature, I've landed on a **Resolution-Commitment Principle** (RCP) that I believe captures most of your intuitions while addressing the key tensions. Here's the principle, clause-by-clause, followed by the damage report and new case applications.

  **The Resolution-Commitment Principle (RCP):**
  An act constitutes *weakness of will* (akrasia) if and only if:
  1.  **Resolution Existence:** The agent formed a prior *resolution* (not a mere wish). A resolution is a specific, future-directed intention adopted with the purpose of *binding* the agent’s future self against anticipated contrary inclinations or judgment shifts. *(Motivated by: Case 9 cousin vs. partner, Case 11 vs. lifelong smoker)*
  2.  **Binding Intent:** The resolution was formed (and maintained) with the *deliberate intent* to pre-commit or override the agent’s own anticipated future desires/judgments in the specific situation that arises. *(Motivated by: Ulysses cases - Case 10, Lockbox vs. Bottle; Distinguishes genuine pre-commitment from general goals)*
  3.  **Persistent Commitment:** At the time of acting against the resolution, the agent *still acknowledges the resolution itself as binding* upon them in that moment. They experience the conflict as a violation of their own *standing commitment*, not merely as a conflict between two current preferences or as a superseded judgment. *(Core Motivation: Separates Case 1 (commitment felt) from Case 2 (commitment gone), Case 4 (shame implies commitment felt) from Case 3 (no shame, commitment gone), Case 5/6 (commitment felt) from Case 7 (outcome irrelevant to commitment at T), Case 9 partner (commitment felt) vs. cousin (no binding resolution formed))*
  4.  **Acting Against:** The agent intentionally acts contrary to the resolution. *(Motivated by: Distinguishing akrasia from compulsion or accident - implicit in all cases)*

  **What RCP Buys & Key Insights:**
  *   **Resolutions are Special:** It elevates *resolutions* (as specific pre-commitment devices) above mere judgments or wishes (Case 9, 11). Forming one creates a distinct commitment obligation.
  *   **Focus on Action-Time Commitment:** The core work is done by Clause 3. Weakness of will happens *at the moment of action* when you feel bound by your prior commitment but act against it anyway. This explains shame (Case 1, 4) vs. lack thereof (Case 2, 3) – shame is a *symptom* of the violated commitment felt *at or after* the time of action, not the defining factor retrospectively.
  *   **Solves the Retrospectivity "Problem":** Your worry about Cases 3 vs. 4 relying on later feelings *is* addressed. Later shame/endorsement is evidence *for* whether the commitment was *still felt as binding at the time of action* (Clause 3). It's not circular: the later feeling provides evidence about the state of mind *during* the act. The *akratic act itself* is defined by the conflict experienced *then*. Shame is a common, evidentiary consequence, not the definition.
  *   **Discounting & Foreseeability:** RCP doesn't rely on discount function shape (Clause 3 handles Case 8 asymmetry) or foreseeability (anticipated temptations are handled by the *nature* of the resolution as a pre-commitment - Clause 2). Case 8 asymmetry: Taking $50 now vs. $60 next week *feels* weak-willed if you *had resolved* to wait for the larger-later option precisely because you knew your present bias would tempt you. If no such resolution existed (you just impulsively grab $50), it might be impulsive but not necessarily akratic. The year-ahead choice lacks the intense temporal proximity that resolutions typically target. The difference *is* partly about the "hot state" proximity triggering the need for binding resolutions.
  *   **Intentionality & Judgment/Desire:** The act must be intentional (Clause 4). Judgment vs. desire conflict is often present but not definitional (Case 10 drink vs. phone shows desires can conflict without akrasia). The key is whether the resolution *as a commitment* still binds you (Clause 3).
  *   **Hot vs. Cold States:** Often relevant to *why* resolutions are needed (Clause 2) and why we cave (lack of self-control in hot state), but not definitional for akrasia under RCP. The defining feature is the *persistence of the felt commitment* (Clause 3), which can be overridden in either state.

  **The Damage Report (Where RCP Disagrees With Your Verdicts):**

  1.  **Case 7 (Party Leads to Collaboration):** Your Verdict: NOT weakness of will. **RCP Verdict: WEAKNESS OF WILL.** *Damage:* RCP says this *is* akrasia. You violated your resolution (Clause 1) to write, formed as a binding pre-commitment (Clause 2), while likely still feeling that commitment was binding at the time you chose to go out (Clause 3), and you intentionally went (Clause 4). The *outcome* (meeting a collaborator) is irrelevant to whether the act itself was akratic. It was a lucky break resulting from an akratic act. This highlights that weakness of will is about the *structure of the action and commitment* at the time, not the consequences. *Argument:* Your intuition in Case 7 seems influenced by outcome. Akrasia is about acting against your *own* standard *as you hold it then*. The beneficial outcome doesn't retroactively change the nature of the choice you made in the moment against your resolution. Giving up this verdict preserves consistency with Cases 5 & 6 and the core idea of resolution-violation.

  2.  **Case 11 ("I'll quit tomorrow" for 5 years):** Your Verdict: WEAKNESS OF WILL. **RCP Verdict: NOT WEAKNESS OF WILL (strictly speaking).** *Damage:* RCP requires a *resolution* (Clause 1 - a specific, binding intention). Saying "I'll quit tomorrow" every day without feeling torn suggests no *binding* resolution is ever actually formed or maintained (failure of Clause 2 & especially Clause 3). It's a repeated expression of a wish or judgment, not a commitment intended to bind future action. It might be *irrational* or exhibit *poor self-governance*, but it lacks the specific structure of *acting against a standing commitment you still acknowledge*. *Argument:* This aligns RCP with your distinction in Case 9. The partner forms a resolution ("stop drinking") intending to bind themselves against the "one glass" temptation. The cousin expresses a wish ("quit sugar") but doesn't form a binding resolution. The person in Case 11 is acting like the cousin daily. Calling it weakness of will dilutes the concept. It's better seen as chronic failure to form or maintain resolutions, a different failure mode.

  **Other Verdicts Accommodated:** Cases 1, 2, 3, 4, 5, 6, 8 (as explained), 9 (partner: WW, cousin: not), 10 (Phone: Not WW - commitment not binding for that purpose; Drink: WW - resolution designed to bind precisely that desire) are all handled by RCP as per your intuitions, using the clauses outlined.

  **Application to New Cases:**

  (a) **Blood Transfusion:**
      *   **Action:** Revoking the directive while lucid.
      *   **RCP Analysis:** Was the advance directive a *resolution* (Clause 1)? Yes, typically, formed as a binding pre-commitment against anticipated future judgment shifts (e.g., due to pain, fear, religious doubt - Clause 2). At the time of revocation, does the patient *still acknowledge that resolution as binding* (Clause 3)? If yes (they feel they *should* abide by their past self but choose not to), it's weakness of will. If no (they have genuinely, authentically, and stably changed their values/judgment and no longer feel bound by the past directive - like your Case 2/3), it's a change of mind. *Honoring the directive* isn't about the patient's willpower *at that moment*; it's about respecting the authority of their prior binding commitment. The patient refusing the transfusion *now* while lucid would likely be seen as *strong-willed* in adhering to their resolution (if they feel bound) or consistent (if they genuinely still hold the judgment). Revoking *against a felt commitment* would be weak-willed.
      *   **Verdict:** Depends on the patient's state of mind (Clause 3). If they feel bound but revoke anyway: WW. If they authentically reject the prior commitment: Change of mind. Doctors should generally honor the directive unless there's clear evidence the revocation reflects a stable, authentic change of judgment (not just transient fear/weakness), which is hard to ascertain.

  (b) **Naive vs. Sophisticated Procrastinator:**
      *   **Naive:** Believes he'll start tomorrow, never does. *RCP:* If he *resolves* "Start NOW!" each day (binding intention) but caves while still feeling bound (e.g., feels guilty), it's repeated akrasia (WW). If he only ever *hopes* or *intends* to start tomorrow without forming a binding resolution, it's not WW (failure of resolution formation/maintenance, like Case 11). *Worse off:* Likely experiences more repeated failure and frustration.
      *   **Sophisticated:** Knows he'll procrastinate, does task early to avoid future failure. *RCP:* When he *does the task early*, it's not an act *against* a resolution; it's acting *on* a resolution (e.g., "Do it NOW to avoid future me screwing up"). He avoids the akratic situation entirely through planning. *Is he akratic?* Not in this successful act. He might *form* the resolution akratically later if he caves on *this* plan, but the early action itself isn't akratic. *Worse off:* The naive one is likely worse off due to repeated failures and potential guilt. The sophisticated one avoids the immediate failure but expends resources on pre-commitment and might feel less autonomous.
      *   **Akrasia Verdict:** The naive procrastinator *can* be akratic *if* he forms binding daily resolutions he then violates. The sophisticated procrastinator avoids akrasia *in the successful execution* of his early-action resolution.

  (c) **Cold-State Addict Drinks:**
      *   **RCP Analysis:**
          *   Clause 1: Presumably, they had a resolution to abstain (formed during remission).
          *   Clause 2: The resolution was likely formed as a binding pre-commitment against *any* drink, anticipating risks.
          *   Clause 3: **Crucially:** Does the agent *still acknowledge the resolution as binding* at the moment they judge the drink "worth it" and consume it? If they have *genuinely, stably, and authentically reevaluated* the risk/reward and no longer feel bound by the prior resolution (like Case 2), it's **not weakness of will** – it's a considered change of mind, albeit a potentially disastrous one. If, however, they *still feel the resolution binds them* ("I know I shouldn't, this breaks my commitment, but I'm doing it anyway because I judge the risk acceptable *right now*"), then it **is weakness of will**. The key is the persistence of the *felt obligation* from the resolution.
          *   Clause 4: Intentional.
      *   **Verdict:** Distinguishes it from Case 9 (Partner): The partner's "one glass" is typically a hot-state rationalization *while still feeling bound* (hence WW and shame). The cold-state addict *might* be experiencing a genuine judgment shift, dissolving the binding force of the resolution (not WW). **Why it feels different:** Case 9 partner acts *against* a commitment they still acknowledge in a moment of temptation (hot-state override). The cold-state addict might be *dissolving* the commitment through cold reassessment. RCP says the difference lies in whether Clause 3 holds at T(action). *Feeling different* might track the cold/hot state, but RCP anchors it in the commitment status.

  **Conclusion:** The Resolution-Commitment Principle (RCP) draws the line at the *persistence of a self-imposed binding commitment* at the moment of action. It handles your core cases (requiring giving up Case 7 as *lucky* akrasia and reclassifying Case 11 as a failure of resolution, not akrasia), resolves the retrospectivity worry by focusing on the commitment-state *during* the act (using later feelings as evidence for that state), and provides clear, non-circular answers to the new cases based on the agent's relationship to their prior resolution. The asymmetry in Case 10 (Phone vs. Bottle) is explained by whether the resolution was *intended* to bind the specific later desire (Clause 2) and whether the commitment is *still felt as binding* for that purpose (Clause 3).
