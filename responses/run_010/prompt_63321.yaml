prompt: |-
  You are advising the selection committee of a small institute that funds conceptual work in the philosophy of biology. We have one two-year postdoctoral position, and its mandate has been fixed in advance: the appointee will work on the units-of-selection debate. They will have no laboratory capacity and no means of generating data of their own, but they will have two standing collaborators — an experimental evolutionist who runs selection experiments on multicellular clusters of yeast propagated by selecting for faster settling, and a cancer genomics group interested in somatic evolution within tumours. The committee expects a conceptual result that a working biologist would find worth citing, not a piece of internal philosophy.

  We would like your recommendation on which open question the position should be aimed at, and on the ordering of the rest. The candidate questions as we currently have them:

  1. Whether the deflationary reading is correct — that the standard covariance partition shows that any evolutionary change can be described at any level, so that level attributions are choices among equally adequate bookkeeping schemes rather than reports of a fact about a system.
  2. Whether group-level fitness is a genuine causal property of a collective or a statistical aggregate of individual fitnesses, and whether there is any principled criterion for telling the two cases apart that does not collapse into an appeal to explanatory convenience.
  3. Whether the familiar marks of evolutionary individuality — a single-cell bottleneck in the life cycle, a division of labour between reproductive and somatic parts, low within-collective conflict — are necessary, sufficient, or merely typical, given systems that violate them while still evolving as collectives.
  4. Whether intra-genomic conflict and selfish genetic elements show that the gene fails to be a unit in the relevant sense, or whether they are instead the strongest evidence for sub-individual levels of selection that every account must accommodate.
  5. Whether somatic evolution in cancer makes the organism a leaky or contested unit, and what a philosopher could add here beyond what modellers already supply.
  6. Whether cultural group selection revives the group-level question in a way that no biological case does, and whether the same conceptual criteria can be carried across the biological/cultural boundary without equivocation.

  Write the committee a memo of roughly twelve hundred words. Deliver a defended ordering, not a survey. For each question in your ranking, say explicitly what makes it worth two years: how much of the rest of the agenda turns on its answer, how tractable it is for someone with no data but with these two particular collaborators, how far it has already been worked over, and what a result would look like as against what would count as failure. Where these criteria conflict, say so and say which you are trading off against which — we would rather see the trade-off than a ranking that looks unanimous.

  Treat question 1 as a special case and tell us whether it belongs in the list at all, or whether it is a background crux that conditions how the other five should be ranked: if the deflationary reading is right, does it moot the rest, or merely reframe what an answer to them could consist in?

  For the top two entries, say what developments over the next three to five years — in the experimental evolution of collectives, in tumour phylogenetics, in the microbiome literature, or in the conceptual literature itself — would move them up or down, and what would persuade us that the project had stalled.

  Finally, the committee is presently inclined toward question 5, on the grounds that it looks like the shortest route to a biologist audience. Several of us suspect that is precisely the wrong instinct. Address that inclination directly: either vindicate it or argue against it, and in the latter case name which entry you would remove from the list altogether as a dead end for a project of this shape and size, even if that disappoints us.

  Refer to positions, distinctions, and arguments by their content rather than by author or title; please do not include a bibliography, a reading list, or citations of any kind, since we will handle the scholarly apparatus ourselves. Assume your reader knows the standard framework well — the replicator/interactor distinction, the difference between group structure affecting individual fitness and selection among collectives as such, and the covariance decomposition — but has not thought seriously about the empirical systems named above.
reasoning: |-
  Hmm, this is a detailed request about prioritizing research questions for a philosophy of biology postdoc focused on units of selection. The committee wants me to rank six questions for a two-year project with specific collaborators (experimental evolutionist with yeast clusters and cancer genomics group). 

  I need to consider several factors: how central each question is to the broader debate, tractability given the collaborators, originality versus how worked-over it is, and what constitutes success. The memo should be decisive - not just survey options but defend a ranking. 

  Question 1 about the deflationary reading is tricky. If true, it could undermine the whole debate by making level attributions merely descriptive choices. But I think it's a background assumption that shapes how we approach the other questions rather than a standalone research target. If deflationism holds, we'd need to reframe the other questions in terms of explanatory utility rather than ontological reality. 

  Looking at the cancer question (5) that the committee favors: while it has direct biological relevance, I worry it might be too narrow. Cancer genomics is advancing rapidly, and philosophers might struggle to add value beyond what modelers already do. The yeast experimental system seems more flexible for testing conceptual frameworks. 

  The group fitness question (2) feels most foundational. If we can't distinguish causal group properties from statistical aggregates, the entire multi-level selection framework wobbles. And the yeast collaborator provides perfect test cases - those settling clusters blur the line between individuals and groups. 

  The evolutionary individuality marks (question 3) pairs beautifully with both collaborators. Cancer violates those marks (no bottleneck, high conflict) yet clearly evolves, while the yeast system allows controlled tests of which features matter. This could yield concrete criteria biologists might actually use. 

  For the trade-offs: I'm prioritizing centrality over immediate biological impact because conceptual clarity will make any biological application stronger later. The experimental tractability outweighs how much some questions (like cultural group selection) are underexplored. 

  I'll argue against the committee's instinct for question 5. While not a dead end, it's less likely to produce broadly applicable conceptual tools within two years. If forced to cut one, cultural group selection (6) seems most disconnected from the experimental systems available. 

  The memo should conclude with a clear ranking: group fitness (2) and individuality marks (3) as top tier, then cancer (5) and selfish genes (4), with cultural (6) last - while keeping deflationism (1) as framing context rather than primary question.
answer: |-
  ## Memo: Strategic Prioritization for Units-of-Selection Postdoc

  **To:** Selection Committee, Philosophy of Biology Postdoctoral Program  
  **From:** Conceptual Strategy Advisor  
  **Subject:** Recommended Research Focus & Ranking for Units-of-Selection Postdoc  
  **Date:** 26 October 2023  

  This memo addresses the prioritization of research questions for the two-year postdoctoral position focused on the units-of-selection debate. The primary goal is to maximize the likelihood of a conceptual result deemed citable by working biologists, leveraging the unique constraints (no lab/data generation) and assets (yeast experimental evolution & cancer genomics collaborators). The mandate requires decisive ranking, not a survey. I will defend an ordering based on: centrality to core debates, leverage over other questions, tractability given collaborators, state of existing literature, and clarity of success/failure conditions. Trade-offs will be explicit.

  **Question 1 (Deflationism): The Framing Imperative**  
  *Status:* **Essential Background, Not Primary Question.** It must shape the approach to *all* others but is unsuitable as the primary focus.  
  *Reasoning:* If the deflationary reading (covariance decomposition renders level attributions merely descriptive choices) is correct, it fundamentally reframes the *meaning* of answers to the other questions. It does not moot them, but transforms them from inquiries into ontological reality into assessments of explanatory power, predictive utility, or conceptual parsimony within specific empirical contexts. Tackling it directly for two years risks:  
  1.  **Intractability:** Debates often become purely abstract, detached from the empirical systems crucial for biologist engagement.  
  2.  **Low Leverage:** A conclusive resolution is unlikely in two years and doesn't *directly* yield tools biologists need.  
  3.  **Failure Ambiguity:** "Success" might be a nuanced argument for/against deflationism within a specific interpretation, unlikely to command broad citation.  
  *Recommendation:* The appointee must explicitly position their work on the chosen question *relative* to this deflationary challenge – either arguing *against* it by finding a non-arbitrary criterion (favouring ontological interpretations), or embracing it and demonstrating *why* a particular level attribution is uniquely powerful/explanatory within the empirical systems provided (favouring pragmatic interpretations). This framing must be integral to their proposal.

  **Ranking of Primary Questions (2-6):**

  1.  **Question 3: Marks of Evolutionary Individuality (Necessity/Sufficiency/Typicality)**  
      *Why Top?*  
      *   **Centrality & Leverage:** This cuts to the heart of defining the *interactors* in multi-level selection. Resolving the status of these marks (bottleneck, division of labour, conflict suppression) is fundamental to identifying *which* biological entities genuinely function as units of selection in practice. Progress here directly informs questions 2 (what constitutes a "genuine" collective property?), 4 (how does conflict define/undermine units?), 5 (is the cancerous organism still a unit?), and even 6 (defining cultural "individuals").  
      *   **High Tractability w/ Collaborators:** This is the **most tractable** question given your specific assets.  
          *   *Yeast Collaborator:* Their experimental system *directly* probes the evolution of individuality. By manipulating life cycles (inducing/reducing bottlenecks), spatial structure (influencing conflict), or task allocation in clusters, they generate real-time data on when collectives begin acting as units violating or adhering to the classic marks. The philosopher can analyze *how* specific manipulations shift the efficacy of collective-level vs. lower-level selection pressures, testing conceptual necessity/sufficiency.  
          *   *Cancer Collaborator:* Tumors are notorious violators of the marks (no bottleneck, rampant conflict, chaotic division of labour). Yet, somatic evolution clearly occurs. The genomics group provides data on clonal dynamics, selection signatures, and conflict levels. This offers a powerful "natural experiment" contrasting with the controlled yeast evolution, testing the limits of the marks and what replaces them in highly conflictual systems.  
      *   **Literature State:** While heavily discussed (e.g., biofilms, symbioses), the *systematic testing* of necessity/sufficiency using *controlled evolution* (yeast) combined with *high-resolution genomic conflict data* (cancer) is relatively novel territory ripe for conceptual refinement.  
      *   **Success/Failure:**  
          *   *Success:* A defensible framework specifying which marks are necessary/sufficient under what conditions (e.g., bottleneck essential for individuality *only* when conflict potential is high; conflict suppression necessary only above a threshold complexity), validated by insights drawn from *both* collaborators' systems. This yields concrete criteria biologists could apply to novel systems (e.g., microbiome communities).  
          *   *Failure:* Merely cataloging violations without generating testable criteria; failing to integrate insights from both empirical systems into a coherent framework; producing an analysis indistinguishable from existing reviews.

  2.  **Question 2: Group-Level Fitness – Causal Property or Statistical Aggregate?**  
      *Why Second?*  
      *   **Foundational Centrality:** This is the bedrock ontological/epistemological question underpinning multi-level selection theory. If group fitness is *only* an aggregate, it severely weakens claims for groups as genuine units. A principled distinction is crucial.  
      *   **Significant Leverage:** Resolving this directly impacts how we interpret data relevant to Q3 (what does it *mean* for a collective to have "fitness"?), Q5 (is tumor fitness causal or aggregate?), and Q6 (can cultural groups have causal fitness?).  
      *   **Tractability w/ Collaborators (Trade-Off Accepted):**  
          *   *Yeast Collaborator:* **Highly relevant.** By designing selection regimes explicitly targeting collective properties (settling rate) vs. individual properties within collectives, and measuring fitness consequences at both levels, they can generate data probing causality. Can changes in group fitness *cause* changes in individual fitness distributions in a non-aggregative way?  
          *   *Cancer Collaborator:* **Less directly applicable,** but tumor "fitness" (e.g., growth rate, metastasis potential) could be analyzed – is it a causal property of the tumor as a whole, or merely an aggregate of clone fitnesses? Genomics data on subclonal dynamics is key.  
          *   *Trade-Off:* While yeast offers the best experimental leverage, the conceptual heavy lifting is significant. We accept this trade-off (high centrality/high conceptual difficulty) because progress here is fundamental.  
      *   **Literature State:** Extensively debated philosophically, but often abstractly. Concrete analysis using experimental systems where group fitness is *directly* manipulated (yeast) is a significant opportunity.  
      *   **Success/Failure:**  
          *   *Success:* Articulating a clear, empirically applicable criterion for distinguishing causal group fitness from mere aggregation (e.g., based on emergent properties affecting survival/reproduction *irreducible* to individual actions, or specific signatures in fitness covariance decompositions under perturbation), demonstrated using yeast and/or cancer data.  
          *   *Failure:* Rehashing abstract arguments without a novel, testable criterion; failing to engage deeply enough with the collaborators' data to ground the distinction empirically; producing an analysis that biologists find too metaphysical to apply.

  3.  **Question 5: Somatic Evolution & the Organism as a Leaky Unit**  
      *Why Third?*  
      *   **Biological Relevance & Specific Leverage:** Directly addresses a major biological phenomenon (cancer) where the organism unit clearly breaks down. Success here has high potential for citation by cancer biologists and evolutionary oncologists. It leverages Q3 (how violated marks enable sub-organismal selection) and Q2 (is tumor fitness causal?).  
      *   **Tractability w/ Collaborators:**  
          *   *Cancer Collaborator:* **Directly provides the core data.** Phylogenetics, clonal interference, selection signatures, and measures of intra-tumor heterogeneity are the empirical grist.  
          *   *Yeast Collaborator:* Offers a contrasting model for studying conflict suppression mechanisms *within* an evolved individual (the cluster), highlighting what breaks down in cancer.  
      *   **Literature State:** Growing field, but room for philosophers to add value *beyond modelling* by clarifying conceptual foundations (e.g., defining "leakiness," the precise nature of the unit's contestation, implications for concepts like organismal fitness).  
      *   **Success/Failure:**  
          *   *Success:* A rigorous conceptual framework defining the modes and degrees of "leakiness" in the organismal unit, validated by cancer genomic data, that helps interpret evolutionary dynamics within tumors and informs models (e.g., by clarifying when selection acts at cell vs. sub-cell vs. tissue level).  
          *   *Failure:* Simply describing how cancer violates individuality without novel conceptual tools; failing to move beyond existing modelling frameworks; producing an analysis of interest only to philosophers.  
      *   **Addressing Committee Inclination:** The committee's instinct for Q5 (shortest route to biologists) is **understandable but risky as the top choice**. Cancer biology is fast-moving; philosophers risk lagging behind sophisticated models or focusing on nuances biologists find irrelevant. While highly citable *if successful*, the risk of producing something perceived as "philosophy-lite" or redundant is higher than for Q3 or Q2. Q3 offers a more generalizable conceptual toolkit *using* cancer as a key example, rather than focusing narrowly on it. **Verdict:** A strong candidate, but not the optimal #1 for maximizing foundational impact and leveraging *both* collaborators equally well. It is correctly placed at #3.

  4.  **Question 4: Intra-genomic Conflict & the Gene's Status**  
      *Why Fourth?*  
      *   **Centrality (but Narrower):** Crucial for defining the replicator level and understanding sub-individual selection. It tests the gene-centric view.  
      *   **Leverage:** Impacts Q3 (conflict as a mark violator) and the ontological foundations of replicators.  
      *   **Tractability w/ Collaborators:**  
          *   *Cancer Collaborator:* Provides rich data on subclonal selection, driver mutations, selfish elements (e.g., mobile elements, B-chromosomes if present), acting *within* the somatic cell population.  
          *   *Yeast Collaborator:* Less direct, though engineered conflicts within clusters could be studied.  
      *   **Literature State:** Well-trodden ground conceptually (selfish DNA, meiotic drive). Novelty would come from deep integration with *somatic* genomic conflict data (cancer).  
      *   **Success/Failure:**  
          *   *Success:* A compelling argument using somatic evolution data that forces a reevaluation of the gene/replicator concept, demonstrating how pervasive sub-gene or supra-gene elements function as units in cancer.  
          *   *Failure:* Rehearsing standard arguments about selfish genes without significant new insight from the cancer context; failing to connect convincingly to the broader units debate beyond the gene level.  
      *   **Trade-Off:** While important, it's slightly more niche than the top 3. The cancer data provides a good angle, but yeast offers less synergy here. Priority given to questions with broader interactor-level implications.

  5.  **Question 6: Cultural Group Selection**  
      *Why Last?*  
      *   **Lower Leverage on Core Biological Debate:** While fascinating, its primary impact is on cultural evolution. Translating concepts to biology risks equivocation unless grounded in *biological* units first.  
      *   **Lowest Tractability w/ Collaborators:** Neither collaborator provides relevant data or expertise. This would require the philosopher to engage with a largely separate literature and empirical domain alone.  
      *   **Literature State:** Rapidly evolving but distinct. Philosophers can contribute, but not optimally leveraging the *biological* assets provided.  
      *   **Success/Failure:**  
          *   *Success:* A demonstrably non-equivocal application of biological units-of-selection criteria to cultural groups, validated by cultural data, that meaningfully informs the biological debate. High bar.  
          *   *Failure:* An analysis highlighting parallels but failing to establish rigorous cross-domain criteria; perceived as irrelevant to the biological mandate.  
      *   **Recommendation:** **Remove as Primary Focus.** It's the weakest fit for the project's specific assets and mandate. While potentially interesting, it represents a significant diversion from the core biological questions and the unique experimental/cancer resources available. Pursuing it risks failure due to lack of synergy and the high bar for cross-domain conceptual transfer within two years. This is the clearest "dead end" for *this specific project*.

  **Top Questions: Future Sensitivity & Stalling Conditions**

  *   **Q3 (Marks of Individuality):**  
      *   *Up:* Breakthroughs in inducing synthetic individuality in lab systems (beyond yeast), revealing novel necessary/sufficient conditions; high-resolution studies of conflict suppression in nascent biological individuals (e.g., obligate symbioses, synthetic biology constructs); microbiome studies showing clear transitions to individuality.  
      *   *Down:* Consensus emerges from experimental evolution that the marks are purely historical contingencies with no predictive power; major advances in cancer evolution show violation of marks is irrelevant to somatic selection dynamics (unlikely).  
      *   *Stalling:* Inability to formulate testable criteria; failure to find common ground between yeast experiments and cancer genomics; analysis gets bogged down in definitional debates without empirical traction.
  *   **Q2 (Group Fitness Causality):**  
      *   *Up:* Development of new experimental protocols (e.g., in yeast) specifically designed to isolate and measure causal emergent properties; advances in causal modelling techniques applicable to multi-level systems; surprising results from cancer showing clear top-down fitness effects.  
      *   *Down:* Widespread acceptance of a purely deflationary/pragmatic view makes the ontological quest seem futile; failure to find any clear empirical signature distinguishing causal from aggregate fitness in model systems.  
      *   *Stalling:* Conceptual analysis becomes circular or detached from data; proposed criteria are deemed untestable or irrelevant by biologists; inability to leverage the yeast experiments effectively for this specific question.

  **Conclusion & Recommendation**

  The optimal strategy prioritizes questions where conceptual innovation is most tightly coupled with the unique empirical access provided by the collaborators, yielding generalizable criteria likely to be cited by biologists studying the evolution of biological individuality and multi-level selection.

  *   **Ranking:** 3 > 2 > 5 > 4. Remove 6. Treat 1 as essential framing.
  *   **Top Choice Justification (Q3):** It offers the strongest synergy between the two collaborators, directly addresses a core conceptual ambiguity with high biological relevance, and provides the clearest path to producing novel, testable criteria for identifying evolutionary individuals – a fundamental problem where philosophers can add significant value beyond modellers. The yeast system is an ideal testbed, cancer provides a critical edge case.
  *   **Addressing Committee Inclination (Q5):** While Q5 (Cancer) has strong biological appeal and is ranked a close third, it is not the optimal primary focus. Its scope is narrower than Q3, the risk of redundancy with modelling is higher, and it doesn't leverage the yeast collaborator as powerfully. Focusing first on the generalizable principles of individuality (Q3), *using cancer as a key exemplar*, provides a stronger foundation for impactful conceptual contributions applicable beyond oncology. Q5 is valuable and viable, but placing it first sacrifices some foundational leverage and experimental synergy.

  The recommended focus on **Question 3 (Marks of Individuality)**, rigorously framed in relation to Question 1 (Deflationism) and leveraging both the experimental evolution and cancer genomics collaborations, provides the highest probability of delivering a conceptually robust, biologically citable result within the two-year mandate. Question 2 (Group Fitness Causality) is the essential, albeit more challenging, runner-up tackling the ontological core.
