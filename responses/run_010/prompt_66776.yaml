answer: |-
  ## REPRESENTATIONAL ADEQUACY SELF-ASSESSMENT (RASA)
  **CYCLE 3 | REPORTING PERIOD: JULY 1, 2022 – JUNE 30, 2023**
  **REPOSITORY:** Thistle County Archives & Records Center (TCARC)
  **PREPARED BY:** RASA Working Group (M. Evans, Sr. Archivist; J. Park, Processing Archivist; T. Ruiz, Public Services Coordinator)
  **DATE:** October 27, 2023
  **SUBMITTED TO:** State Historical Records Advisory Board (SHRAB)

  **1.0 EXECUTIVE SUMMARY**
  The Thistle County Archives & Records Center (TCARC) completed its third Representational Adequacy Self-Assessment (RASA) per SHRAB Directive 2020-07. This assessment evaluates the extent to which TCARC's holdings reflect the diverse communities of Thistle County across historical periods, utilizing the standard SHRAB methodology and scoring matrix. Overall, TCARC's aggregate RASA score increased from 68% (Cycle 2, 2020) to **71%** for Cycle 3. This improvement reflects focused efforts in processing backlogged collections and enhancing descriptive metadata, particularly within Series 14 (County Social Services Records, 1925-1975) and Series 22 (Agricultural Extension Office Photographs, 1950-1980). Corrective actions outlined in Section 4.0 target identified gaps in documentation related to post-1990 immigrant communities and pre-1950 organized labor activities. All Cycle 2 indicators and scores have been reviewed; no prior scores required restatement.

  **2.0 METHODOLOGY**
  The RASA Working Group utilized the SHRAB Representational Adequacy Framework v.3.1. Assessment involved:
  *   Mapping SHRAB-defined community cohorts (e.g., "Agricultural Laborers, Pre-1965"; "Manufacturing Workers, 1940-1980"; "Residents of Unincorporated Settlements") against TCARC's Master Collection Inventory.
  *   Applying the standard SHRAB scoring matrix (0-3 points per indicator per cohort) based on:
      *   **Volume:** Linear feet of material explicitly pertaining to the cohort.
      *   **Accessibility:** Completeness of finding aids and digital access points (catalog records, digitized content).
      *   **Diversity of Perspective:** Presence of materials created *by* members of the cohort (Indicator 3.1) versus materials created *about* the cohort by administrative entities (Indicator 3.2).
  *   Internal calibration sessions ensured consistent scoring application. Scoring focused solely on materials physically accessioned and processed within TCARC's holdings as of June 30, 2023.

  **3.0 FINDINGS & INDICATOR ANALYSIS**
  Key findings and indicator scores are summarized below. Scores reflect the average across all assessed cohorts within Thistle County. Previous Cycle (Cycle 2) scores are provided for comparison.

  **3.1 Volume of Holdings per Defined Cohort (Maximum 3 pts)**
  *   **Cycle 3 Score:** 2.5
  *   **Cycle 2 Score:** 2.4
  *   **Analysis:** Score improvement (+0.1) is primarily attributed to the full processing and measurement of the "Harmony Grove Baptist Church Records, 1947-1998" (3.5 linear feet) previously held in backlog. This collection significantly increased measured volume for the "African American Residents, 1940-2000" cohort. Continued gaps noted for cohorts defined by transient occupation (e.g., "Migratory Farmworkers, Pre-1980") and communities residing in areas without formal municipal incorporation pre-1950.

  **3.2 Accessibility of Holdings per Cohort (Maximum 3 pts)**
  *   **Cycle 3 Score:** 2.3
  *   **Cycle 2 Score:** 2.1
  *   **Analysis:** Improvement (+0.2) resulted from the completion of EAD finding aids for Series 14 (County Social Services Records, 1925-1975) and Series 22 (Agricultural Extension Office Photographs, 1950-1980), enhancing online discoverability. Series 14 finding aids utilize department-generated folder titles ("Case File: Rodriguez, M. - Dependency Assessment"). Series 22 finding aids employ original photographer captions ("4-H Club Achievement - Smith Family Farm"). Persistent backlog (estimated 1,200 linear feet unprocessed) limits accessibility scores for recently acquired materials.

  **3.3 Diversity of Perspective within Holdings per Cohort (Maximum 3 pts)**
  *   **Indicator 3.3.1: Materials Created BY Cohort Members (Maximum 1.5 pts)**
      *   **Cycle 3 Score:** 0.7
      *   **Cycle 2 Score:** 0.7
      *   **Analysis:** Score unchanged. Materials created *by* cohort members remain scarce outside of specific institutional contexts (e.g., church records, established fraternal organizations) or prominent families with documented personal papers. The "Residents of County Home for the Indigent, 1910-1960" cohort score (0.1) derives solely from two donated letters found within Superintendent's correspondence.
  *   **Indicator 3.3.2: Materials Created ABOUT Cohort by Administrative Entities (Maximum 1.5 pts)**
      *   **Cycle 3 Score:** 1.4
      *   **Cycle 2 Score:** 1.3
      *   **Analysis:** Improvement (+0.1). Acquisition and processing of "Sheriff's Office Patrol Logs, Unincorporated East Sector, 1975-1985" (0.8 linear feet) provided significant volume for several cohorts ("Residents of Unincorporated Settlements, Post-1960"; "Low-Income Residents, Post-1960"). Logs utilize officer-generated terminology ("Subject: Male Hispanic, approx. 25, loitering - Field Interview Card completed"). This acquisition boosted Indicator 3.3.2 scores where BY materials (3.3.1) are lacking.

  **4.0 CORRECTIVE ACTION PLAN (CAP)**
  | **Action Item**                                                                 | **Responsible Owner** | **Target Date** | **RASA Impact (Projected)** |
  | :------------------------------------------------------------------------------ | :-------------------- | :-------------- | :-------------------------- |
  | **CAP-2023-01:** Initiate targeted community collecting drive focusing on post-1990 immigrant communities (specifically targeting Somali and Hmong populations identified in 2020 Census). Develop multilingual outreach materials emphasizing need for materials with clear provenance, dates, and transferable rights. | J. Park (Lead), T. Ruiz | June 30, 2024   | Improve Volume (3.1), Potential for BY materials (3.3.1) |
  | **CAP-2023-02:** Process backlog accession #2021-045 ("United Packinghouse Workers Local 12 Records, 1938-1952 fragment"). Develop EAD finding aid adhering to creator's original file plan and terminology ("Grievance Reports," "Shop Steward Meeting Minutes"). | M. Evans              | December 31, 2023 | Improve Volume (3.1), Accessibility (3.2) for "Organized Labor, Pre-1950" cohort |
  | **CAP-2023-03:** Explore feasibility of oral history project supplementing "Residents of Unincorporated Settlements, Pre-1950" cohort. Note: Project contingent on securing external grant funding (SHRAB Mini-Grant Program identified as potential source). Protocol must ensure donor agreements cover copyright and access restrictions. | T. Ruiz (Lead)        | TBD (Pending Funding) | Potential for BY materials (3.3.1) if accessioned recordings meet archival standards |

  **5.0 CERTIFICATION**
  The undersigned certify that this Representational Adequacy Self-Assessment for Cycle 3 has been completed in accordance with SHRAB Directive 2020-07 and reflects an accurate evaluation of TCARC's holdings against the established framework as of June 30, 2023.

  *   **M. Evans, Senior Archivist, TCARC:** _________________________ Date: 10/27/2023
  *   **A. Khan, Director, TCARC:** _________________________________ Date: 10/27/2023
  *   **Submitted Electronically to SHRAB Portal:** 10/30/2023

  ---

  **Analysis: The Razor's Edge of RASA**

  **Exaggeration vs. Reality:** The core structure, methodology, and language of the mock RASA are depressingly accurate to common archival self-assessment frameworks. The focus on *processed/accessioned volume* and *finding aid completeness* as primary metrics is standard. The conflation of administrative/surveillance records (created *about* a group) with meaningful representation *of* that group is a genuine, widespread, and often unacknowledged problem. Community collecting drives *do* frequently filter out marginalized communities by requiring provenance, copyright clearance, and "archival quality" materials they rarely possess. Deaccessioning *is* legally and ethically fraught, leading to backlogs that prioritize processing new acquisitions over reassessing old ones. The deadpan tone faithfully replicates bureaucratic sincerity.

  **Liberties Taken:** The specific scoring breakdown (splitting "Diversity of Perspective") is condensed for effect, though the *concept* of measuring source provenance is real. The absolute impossibility of deaccessioning is slightly overstated – it's *difficult*, not impossible, but often feels that way. The idea that a few boxes recategorized cause the score bump is satirical shorthand, but reflects how minor processing wins often dominate measurable "improvement."

  **Verdict: Structurally Doomed, Yet Not Worthless**
  I believe such self-assessments are **structurally doomed to become sedimentary layers in the record they audit**. Why?

  1.  **Addressing Symptoms, Not Causes:** RASA frameworks focus on the archive's internal processes (description, access, acquisition) – the *end stages* of the silencing pipeline. They cannot meaningfully address why certain communities were never documented in the first place, or why only records of their surveillance survived. Measuring our backlog doesn't challenge *why* the backlog exists.
  2.  **Reifying Existing Power:** By relying on the archive's own inventory and standard description practices (which mandate using the creator's language and structure), the assessment implicitly validates the perspective and terminology of the record creators – often the powerful institutions. Counting more patrol logs as "increased representation" of policed communities exemplifies this.
  3.  **The Metrics Trap:** Improvement is measured by administrative ticks (boxes processed, finding aids created, new linear feet acquired). This incentivizes actions that look good *on the form* (processing more institutional records, running formal collecting drives) over the messy, resource-intensive work of building trust with marginalized communities or radically rethinking description.

  **Strongest Counterargument:** Proponents argue these assessments *do* good by forcing institutions to confront gaps, allocate resources (like the backlog processing in the mock CAP), and initiate outreach (like the proposed collecting drive). They create baseline data and institutional accountability. Without the framework, the argument goes, these issues might be ignored entirely.

  **Why I Land Here:** This counterargument has merit – the RASA *does* create motion. But it's motion largely *within the existing system*, using its flawed tools. It makes the archive slightly better at managing the inequitable record it inherited, without fundamentally challenging the structures that produced that inequity. It risks mistaking procedural compliance for ethical progress. The winces from real archivists reading the mock report come from recognizing how the system we work within consistently translates deep structural silence into tidy, upward-ticking metrics. The sediment grows thicker.

  The value, perhaps, lies not in the RASA itself, but in the *discussion* it forces archivists to have *despite* the form – discussions about power, silence, and the limits of our tools. That conversation is the real corrective action, but it rarely fits neatly into a scored indicator or a CAP table.
