  Dreaded question: Name a non-market institution that generates new categories effectively. Military R&D (e.g., DARPA) could be an example, emphasizing urgency-driven innovation, but it's not purely non-market.

  Sink-the-paper objection: The exegesis challenge (#3). If the user can't defend their interpretation of Hayek, the core argument weakens. Also, if the Austrian expert shows the argument isn't novel, that's damaging.

  Audience misread: If more historians are present or the Austrian expert is more influential than assumed, reshuffle rankings. If ML folks are more theoretically inclined, objections might be less technical.

