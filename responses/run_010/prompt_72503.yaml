prompt: |-
  ok so my friend and I have been arguing about this for like six months and I want to know what the target even is before I read anything else.

  I help run a mutual aid fund in my town. Roughly 9k a month, donated by locals, and we decide where it goes at a Tuesday night meeting. My friend is completely convinced the answer is always obvious: spend it on whatever helps the most people, done. I cant shake the feeling that's wrong, but every time I try to say why I come out sounding like I want to let a bunch of people go without so one person gets spared, which isn't what I think either. So I want the requirements list for a theory about whether the numbers count. What does such a theory actually have to be able to do to be any good? Which situations does it have to get right, which lines does it have to keep from blurring, which things is it not allowed to just declare off limits — and for each requirement, the reason it's a requirement and not just a vibe. And I want you to sort them: which are non-negotiable, and which are really just one camp's gut feeling wearing a rule costume. I'm pretty sure some of the demands people make in this area are the second kind, and knowing which ones would save me a lot of time.

  Here's what the theory has to survive, and please use these, they aren't shaped like the ones I've seen:

  1. Same 9k. One family needs it for their kid's jaw surgery — no fund, the kid lives with pain and wrecked teeth forever. Or 225 households get 40 dollar grocery cards. Nobody starves without the cards, they're just way less strapped for a couple weeks. What has to be true for the 225 to either win or lose?
  2. Same pot, but now it's one elderly woman whose house is 48 degrees and needs a furnace, versus 60 families getting utility arrears cleared. The one is worse off than any of the many. Does the answer flip, and does the theory have to explain why it flips or why it doesn't?
  3. A donor offered to buy a defibrillator and train people on it. Put it at the senior center — 400 people use it, much higher per-person chance of cardiac arrest — or at the high school gym, 4000 people through it weekly, each with a much smaller chance. There is no particular person we're choosing between here, only odds. Does the theory still apply, and if it says "not my department," is that an answer or a dodge?
  4. Five households each need something completely different — a wheelchair ramp, glasses, an insulin fridge, a roof patch, bus passes — and one household needs the surgery. There's nobody to line up one-to-one against the surgery kid. What does a theory that compares complaints pairwise do with a case that refuses to pair?
  5. Pantry night, 40 people standing outside in the cold, one family in the office with something genuinely urgent. No procedure exists, no time to make one, somebody just decides. If the theory's answer is "flip a coin," what exactly does it owe us in that room?
  6. My friend's version: one stranger versus the entire town. He says if my view gives the same verdict there as it does on the grocery cards, my view is finished. Is he right? Does an adequate theory have to contain some point where it says fine, at this many, it just settles it?
  7. I take two ibuprofen now to head off a migraine that would be much worse tonight. I add up across time inside my own life constantly and feel zero conflict about it. If the theory says you can't add up claims belonging to different people, why can I add up claims belonging to different moments of me? Does it have to answer that, or can it shrug?
  8. If the theory says saving the one and helping the 225 are both permissible, and says other stuff about slightly different pairs, can it end up ranking things in a circle? My friend says circular means somebody could walk you through a series of trades that leaves everyone worse off. Is avoiding circles a hard requirement or can a theory own the circles and explain them?

  Also, the distinctions I think it has to hold onto without smearing: numbers don't matter at all versus numbers matter but don't get the final say; sparing someone a big harm versus handing someone a nice benefit; a named person in front of you versus a statistical somebody who only might exist; what one individual owes versus what an organization holding a budget owes; "you may help the one" versus "you must help the one." And I'd like to know whether the claim that claims don't add up and the claim that you should flip a coin are one claim or two, because people I've read seem to slide between them.

  One thing that makes this concrete for me: the theory has to be usable enough that I can defend the decision at the Tuesday meeting, and then explain it to the family we turned down, without either group being treated as a tally mark. So "adequate" here means adequate for that, not for a journal.

  Then tell me which single requirement kills the most views, and — this is the part I actually want — whether some subset of these requirements can't all be met at the same time. If the list itself turns out to be a proof that nothing can satisfy it, say so straight out rather than hedging.

  Last, short version only, three sentences max each: how Taurek's no-aggregation view with the coin flip, Kavka's the-numbers-should-count reply, Scanlon's pairwise balancing of complaints, a straight maximize-the-good view, and the threshold hybrid where numbers count up to a point, do against the list — and which requirement each one dies on if it dies. No bibliography, no reading list, no citations, I'll find material on my own. A table is fine for that last bit.
reasoning: |-
  Okay, the user is part of a mutual aid fund and has been arguing with a friend about whether helping the most people is always the obvious choice. They want a clear framework to evaluate different ethical theories in their context. 

  First, I need to unpack their eight scenarios. Each one tests a different aspect of resource allocation ethics: individual vs. many, severity of need, statistical lives, incommensurable needs, urgency, scale extremes, personal vs. interpersonal aggregation, and logical consistency. The distinctions they mention (like named vs. statistical persons) are crucial because mutual aid involves real human connections.

  The core tension seems to be between utilitarian "greatest good" approaches and deontological "individual rights" views. Their friend is firmly in the former camp, while the user intuitively feels something's missing there—especially when facing a suffering child or an elderly woman. 

  For requirements: Non-negotiables must include preventing abandonment of the severely suffering (scenario 1-2), handling statistical cases (3), and avoiding circular rankings (8). Organizational duty (distinction 4) is also essential—this isn't abstract philosophy but real decisions with accountability. 

  The killer requirement is likely #2 (elderly woman vs. utility arrears). Most theories crack here: strict aggregation would sacrifice her, strict non-aggregation might flip a coin despite her extreme need, and hybrids struggle to justify thresholds. Only Scanlon’s complaint model survives by weighing her suffering more heavily. 

  Notably, some requirements conflict. Personal aggregation (scenario 7) undermines non-aggregation theories unless they distinguish self/other—which feels arbitrary. And "defend to the family" requires more than cold calculus, which eliminates pure maximization views. 

  For theory snapshots: Taurek dies on statistical cases (#3), Kavka on urgent decisions (#5), Scanlon thrives except on scale extremes (#6), maximization fails the elderly woman (#2), and thresholds get arbitrary (#8). 

  Ultimately, Scanlon’s complaint model fits best with mutual aid’s ethos—it centers individual suffering while allowing numbers to matter when harms are comparable. But it still stumbles on town-scale dilemmas, which... might be okay? Not every theory must handle apocalyptic scenarios.
answer: |-
  Here's the core requirements for an adequate theory of resource allocation in mutual aid, ranked by non-negotiability, based on your scenarios and distinctions:

  **Non-Negotiable Requirements (Fail these = Theory Unusable)**
  1.  **Handle Extreme Suffering vs. Diffuse Benefit:** Must distinguish preventing catastrophic harm (jaw surgery, freezing house) from providing significant-but-not-catastrophic relief (grocery cards, arrears). *Reason:* Letting someone suffer severe, irreversible harm solely because many others get moderate relief feels morally bankrupt and violates the purpose of aid. (Scenarios 1 & 2).
  2.  **Address Statistical Beneficiaries:** Must apply when beneficiaries are probabilistic (defibrillator placement). *Reason:* Mutual aid often deals with preventing *risks* (like cardiac arrest). Saying "not my department" dodges core preventive work. (Scenario 3).
  3.  **Avoid Circular Rankings:** Must produce consistent, transitive priorities. *Reason:* Circularity (A>B, B>C, C>A) makes rational allocation impossible and opens the door to manipulation where everyone loses via bad trades. (Scenario 8 & your friend's point).
  4.  **Guide Urgent, Unstructured Decisions:** Must provide actionable principles for snap judgments (pantry night). *Reason:* Reality demands immediate choices under pressure; a theory that only works with perfect procedures is useless. (Scenario 5).
  5.  **Define Organizational Duty:** Must clarify the duty of *the fund* (distinct from individual morality). *Reason:* You hold resources *in trust* for the community; your obligation differs from an individual giving personal money. (Distinction: Individual vs. Organization).

  **Negotiable Requirements (Often Camp-Specific Preferences)**
  1.  **Absolute Numbers Threshold ("Entire Town")**: Need not contain a specific point where numbers *always* outweigh the one. *Reason:* The "entire town" scenario is unrealistic for your fund; requiring a magic number often masks a prior commitment to aggregation. A theory can say "numbers matter increasingly but never *automatically* outweigh preventing catastrophe." (Scenario 6).
  2.  **Resolving Incommensurable Needs:** Need not force pairwise comparisons *only*. *Reason:* Requiring strict pairwise comparison is artificial (Scenario 4). A theory can assess overall severity/impact across diverse needs without direct matching.
  3.  **Personal/Intertemporal Aggregation Justification:** Need not fully reconcile why we aggregate within one life but struggle across lives. *Reason:* This is a deep philosophical puzzle. A practical theory can note the intuitive difference ("me" vs. "others") without fully resolving the metaphysics. (Scenario 7).
  4.  **Permissible vs. Mandatory:** Need not dictate that helping the one is *always required*. *Reason:* It can be sufficient to say helping the one is *permissible* (and sometimes best), while helping the many is *also permissible* under different circumstances. (Distinction: May vs. Must).

  **Key Distinctions the Theory MUST Hold:**
  *   **Severity:** Big Harm Prevention vs. Significant Benefit.
  *   **Certainty:** Named Person Suffering Now vs. Statistical Risk Reduction.
  *   **Agent:** Individual Moral Choice vs. Organizational Fiduciary Duty.
  *   **Permission vs. Obligation:** "We *can* help the one" vs. "We *must* help the one."

  **"No Aggregation" vs. "Flip a Coin":** These are **two distinct claims**. "No Aggregation" denies adding small harms to outweigh a large one. "Flip a Coin" is a specific *decision procedure* often (but not always) proposed *because* of non-aggregation. One can accept non-aggregation but propose a different fair procedure.

  **The Killer Requirement:** **#2 (Elderly Woman's Furnace vs. 60 Utility Arrears).** Most theories fail here:
  *   **Strict Aggregation (Maximize Good):** Favors the 60, abandoning the freezing woman. Dies on Non-Negotiable #1 (Extreme Suffering).
  *   **Strict Non-Aggregation (Taurek):** Flips a coin, ignoring her vastly worse plight. Also dies on #1.
  *   **Simple Threshold Hybrids:** Struggle to non-arbitrarily define when numbers "win" against severe harm like freezing.

  **Incompatibility?** Yes, **partially.** Holding **all** non-negotiables *perfectly* is likely impossible for a *simple* theory. Specifically:
  *   Rigorously satisfying **#1 (Extreme Suffering)** AND **#3 (No Circularity)** AND **#2 (Statistical Cases)** while also navigating the incommensurability of **#4** and the pressure of **#5** pushes theories towards complexity or prioritization rules that might feel arbitrary. However, a theory can *adequately* address all for practical purposes without being philosophically perfect.

  ---

  **Theory Snapshots vs. Requirements:**

  | Theory              | Key Idea                                  | Major Strength                  | Fatal Flaw (Scenario)           | Other Failures                               |
  | :------------------ | :---------------------------------------- | :------------------------------ | :------------------------------ | :------------------------------------------- |
  | **Taurek (No Agg + Coin)** | Claims don't add; flip coin between lives | Protects individuals from being outweighed by numbers | **#3 (Defibrillator - "not my department" or unfair coin flip for stats)** | #1 (Ignores severity difference furnace/arrears), #2 (Stats), #8 (Coin flip isn't a ranking) |
  | **Kavka (Numbers Count)** | Aggregate smaller harms to outweigh a larger one | Handles #3 (Defibrillator) well, practical | **#5 (Pantry Night - Requires complex calc under pressure)** | #1 (Would sacrifice furnace for arrears), #2 (Furnace) |
  | **Scanlon (Complaint Model)** | Justify to each why their complaint wasn't met; worse-off have stronger complaints | Excels at #1, #2 (Severity), #4 (Diverse Needs), #5 (Fairness) | **#6 ("Entire Town" - Struggles to justify ignoring massive numbers)** | #3 (Can be clunky for stats - whose complaint?) |
  | **Maximize Good**   | Always choose option creating most total benefit | Simple, clear, handles #3, #6  | **#2 (Furnace - Sacrifices severe suffering for aggregate gain)** | #1 (Surgery), #4 (May ignore severe individual need) |
  | **Threshold Hybrid** | Numbers count until harm to one is "too severe" | Tries to balance #1 and #6      | **#8 (Thresholds often arbitrary, leading to inconsistency/circularity potential)** | #2 (Defining "too severe" is hard), #4 (Same threshold problem) |

  **Conclusion:** No theory aces every scenario perfectly. **Scanlon's Complaint Model** handles the most non-negotiables best for your context (esp. severity, urgency, diverse needs, organizational justification), though it strains at massive scale (#6). Its focus on justifying decisions *to those affected* aligns perfectly with your need to defend choices to the meeting and the family. The "killer" furnace scenario (#2) eliminates strict aggregation (Max Good, Kavka) and strict non-aggregation (Taurek), while Threshold Hybrids die on arbitrariness/inconsistency (#8).
