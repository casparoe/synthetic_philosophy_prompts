  Okay, the user is an analyst at a small food-crisis advocacy outfit. They need a systematic procedure to determine if a situation is heading toward famine and whether it's man-made. Currently, they rely on gut feeling, which isn't defensible. The procedure must be usable by their comms lead within an hour, using available data like market prices, wages, migration reports, etc. 

  The user emphasizes using Amartya Sen's entitlement approach, focusing on how people lose command over food rather than just food availability. They need to separate three levels: trigger (e.g., drought), transmission mechanism (how access was lost), and response failure (authorities' actions). The legal counsel requires identifying a specific decision by an actor that worsened the situation to call it "man-made."

  The user also wants the procedure applied to three historical cases: Bengal 1943, Ireland 1845-49, and the Great Leap Forward famine. They expect Bengal to challenge their view by showing an aggregate shortfall. The procedure must flag judgment calls, uncertainties, and situations where human judgment is needed due to values or legal risks. 

  Deep needs: The user likely needs a credible, repeatable method to justify their advocacy positions, especially under legal scrutiny. They want to avoid smearing different responsibility levels together. The unspoken need might be protecting their organization's reputation while effectively highlighting man-made famines. 

  Designing the procedure requires simplicity for the comms lead. Steps should be clear, using available data. Including "can't-tell-yet" branches and publishing guidelines is crucial for incomplete data. For the historical cases, the procedure must handle ambiguity, especially in Bengal where historians debate aggregate shortages. 

  The user’s mention of "the answer I don't want" suggests they’re prepared for the procedure to challenge their assumptions, which is healthy for robust analysis. Ensuring the method distinguishes between entitlement-driven and availability-driven but politically criminal famines is key. Highlighting judgment calls and legal handoff points addresses their need for defensibility and risk management.
answer: |-
  Here's a procedure designed for speed, defensibility, and Sen's entitlement framework, focusing on separating causes for legal clarity. It uses your available data streams and identifies judgment points.

  **The Famine Attribution Procedure (FAP)**

  **Goal:** Determine (1) Likelihood of Famine-Level Crisis (FLC), (2) Attribution for "Man-Made" Label per Counsel's Rule.
  **Input:** Trigger report + your standard data feeds (prices, wages, migration, nutrition surveys, govt actions, press).
  **Output:** One of: `FLC Unlikely`, `FLC Likely (Entitlement)`, `FLC Likely (Availability)`, `FLC Likely (Mixed)`, `Insufficient Data` + Attribution Level Analysis for Comms. **Plus:** `Man-Made` / `Not Man-Made` / `Man-Made Element (Specify)` / `Cannot Attribute Yet` flag.
  **Time Budget:** < 60 mins for Comms Lead execution.

  **Procedure:**

  1.  **Define the "Crisis Zone" (CZ):** Geographic area from the trigger report. *Judgment: Is the report credible & area defined clearly? If no, flag `Insufficient Data - Geographic Scope`.*

  2.  **Assess Famine Likelihood (FL) - "How Bad?" (Using IPC-like logic adapted for speed & entitlement):**
      *   **A. Nutrition Surveys:** Any survey in CZ showing GAM >15% or SAM >3%? **Yes:** Strong FL signal. **No/Outdated:** Proceed.
      *   **B. Market Entitlement Collapse:**
          *   *Food Prices:* Compare staple food price in CZ to: (a) same time last year, (b) national average, (c) regional average. >50% increase on *any two*? **Yes:** Strong FL signal. *Judgment: Are prices credible/reported?*
          *   *Wages:* Compare daily labor wage in CZ to staple food price (how many kg/day?). Significant worsening (>25% decline in kg/day) vs last year or stable region? **Yes:** Strong FL signal. *Judgment: Are wage data representative?*
      *   **C. Coping & Distress:**
          *   *Migration:* Reports of unusual out-migration from CZ? Asset sales (livestock, tools) reports? **Yes:** Moderate FL signal.
          *   *Mortality:* *Any* credible reports of unusual mortality (clinics, burial, press)? **Yes:** Critical FL signal (often lagging). **No:** Not reassuring yet.
      *   **D. Aggregate Availability (Crude Check):** Any *credible* reports/govt data showing >30% drop in CZ harvest/production vs average? **Yes:** Strong FL signal. *Judgment: Reliability of production data? Often poor.*
      *   **FL Conclusion:** `FLC Likely` if **A** OR (**B** + **C**) OR **D** OR compelling evidence in **C**. Else `FLC Unlikely` or `Insufficient Data (Specify)`.

  3.  **Attribution Analysis - "Why & Who?" (Sen's Levels - DO NOT MIX):**
      *   **Level 1: Trigger (The Spark):** What caused the initial shock? (e.g., Drought, Flood, Blight, Conflict Outbreak, Global Price Spike). *Data: Trigger report, press, govt announcements.* **Output:** Natural, Conflict, Economic, Mixed. *Judgment: Is the trigger clear? Often obvious, sometimes contested.*

      *   **Level 2: Transmission Mechanism (Entitlement Failure - How Access Was Lost):** How did the shock translate into lost command over food for groups in CZ? *Focus on Sen's key failures:*
          *   *Trade Failure:* Collapse of markets? Transport blocked? *Data: Price divergence (CZ vs elsewhere), migration reports (traders fleeing?), govt trade bans/restrictions.*
          *   *Production Failure:* Loss of land/livestock/tools? *Data: Reports of displacement, asset sales, conflict damage.*
          *   *Labor Failure:* Mass unemployment? Wage collapse vs food prices? *Data: Wage data, migration reports (job seeking?), govt labor bans.*
          *   *Transfer Failure:* Collapse of remittances? Social support gone? *Data: Migration reports (inward flow stopped?), govt welfare cuts.*
          *   *Direct Transfer (Theft/Seizure):* Forced appropriation? *Data: Reports, press.*
          *   **Output:** Primary Mechanism(s) identified (e.g., "Labor Failure Driven by Wage Collapse"). *Judgment: Which mechanism dominates? Often multiple, but pick the most acute based on data.*

      *   **Level 3: Response Failure (The Political Crime/Omission):** Did authorities (govt, de facto rulers, major aid agencies) *decide* to act in ways that worsened the crisis *beyond the initial shock + normal transmission*? Per Counsel: **Requires an identifiable decision/inaction by an identifiable actor.**
          *   *Check:*
              *   Was the crisis foreseeable/reported? *Data: Press coverage, prior warnings (internal/external), govt meeting minutes/announcements acknowledging problem.*
              *   Were resources *available* to mitigate? *Data: Govt budgets, surplus stocks in country/region, international aid offers.*
              *   Did actors *choose* actions worsening entitlement or blocking relief?
                  *   *Denial/Obstruction:* Blocking aid access? Expelling NGOs? Denying crisis exists? *Data: Govt statements, aid agency reports, press.*
                  *   *Malicious Policy:* Confiscating food? Blocking migration? Forced labor? Discriminatory rationing? *Data: Govt decrees, reports, survivor testimony (use cautiously).*
                  *   *Gross Negligence:* Refusing available aid? Diverting resources *away*? Maintaining harmful policies (e.g., export bans, price controls)? *Data: Policy announcements, aid refusal letters, budget allocations.*
          *   **Output:** `Response Failure Identified` (Actor: X, Decision: Y) OR `No Clear Response Failure` OR `Insufficient Data on Response`. *Judgment: This is the HIGHEST STAKES call. Link directly to identifiable actor & decision/inaction. If fuzzy, default to `Insufficient` or `No Clear`.*

  4.  **Synthesize "Man-Made" Determination (Per Counsel's Rule):**
      *   `Man-Made` **ONLY** if a **Level 3 (Response Failure)** is clearly identified (Actor + Decision making it worse).
      *   `Man-Made Element` if Level 3 is partial/fuzzy OR if Level 2 mechanism is *directly caused by malicious policy* (e.g., forced seizure, discriminatory labor ban) with clear actor. *Use with extreme caution, run by counsel.*
      *   `Not Man-Made` if Levels 1 & 2 dominate, and Level 3 is `No Clear Response Failure`.
      *   `Cannot Attribute Yet` if Level 3 is `Insufficient Data` OR FL is `Insufficient Data`.

  5.  **"Can't Tell Yet" Branch & Publishing:**
      *   **Trigger:** FL = `Insufficient Data` OR Attribution = `Cannot Attribute Yet`.
      *   **Permitted Publishing:** Focus on **observed facts & risks:** "Severe price spikes observed in [CZ], wages failing to keep pace. Reports of unusual migration and distress sales. Nutrition data outdated/limited. Situation deteriorating; famine risk high. Cause(s) and official response under investigation." **AVOID:** Attribution language ("man-made," "government failure"), definitive famine declarations without mortality/nutrition data.

  **Key Judgment Calls Disguised as Steps:**
  *   Step 2 FL Conclusion: Weighing conflicting/partial signals (e.g., high prices but no migration yet).
  *   Step 3 Level 2: Identifying the *dominant* entitlement failure mechanism.
  *   Step 3 Level 3 (CRITICAL): Determining if a crisis was "foreseeable," if resources were "available," and crucially, if a specific decision constituted "gross negligence" or "malicious policy." This is inherently values/legal-laden.
  *   Step 4: Interpreting "Man-Made Element" – high legal risk.

  **What It Can't Settle:**
  *   Genuine intent vs. incompetence (Level 3).
  *   Counterfactuals: "How much worse" did a decision make it?
  *   Long-term structural causes (colonial policy, inequality) – focus is on *proximate, identifiable decisions* triggering/amplifying *this* crisis.
  *   Disputes over aggregate availability data (Bengal problem).
  *   Moral blame beyond legalistic "man-made" definition.

  **Handoff to Human (Values/Legal Exposure):**
  1.  **Level 3 Judgment:** Any decision involving "gross negligence" or "malicious intent" determination. *Requires analyst/counsel review.*
  2.  **"Man-Made Element" Label:** Before using, *must* go to counsel.
  3.  **High-Profile/Ambiguous Cases:** When data is contested (e.g., conflicting reports on govt actions, availability figures) or stakes are extreme. *Requires team discussion.*

  ---

  **Case Applications:**

  **1. Bengal 1943 (The Unwanted Answer)**
  *   **FL:** `FLC Likely (Mixed)` (Mortality data, sky-high prices, distress migration evident).
  *   **Level 1 (Trigger):** Natural (Cyclone, Brown Spot disease) + Economic (War inflation, Burma rice loss).
  *   **Level 2 (Transmission):** **Trade Failure** (War disruption, panic hoarding, transport chaos) + **Labor Failure** (Rural wages collapsed vs. rice prices). *Judgment: Trade dominant, but labor critical.*
  *   **Level 3 (Response Failure):** **Identifiable Failures:** Churchill's War Cabinet diverting ships/food *from* Bengal; Bengal Govt. ineptitude/denial; Price controls creating black market. *Actor: UK War Cabinet (Decision: Prioritize European stocks); Bengal Ministry (Decision: Downplay crisis, mismanage distribution).*
  *   **Aggregate Availability:** *Judgment Call Wearing Procedure Costume:* Procedure **cannot settle**. Data is chaotic/hotly contested. Procedure flags `Contested Aggregate Data - Insufficient to Rule Out Shortfall`. Must be acknowledged in analysis.
  *   **Man-Made:** `Man-Made` **due to Level 3.** Churchill's decisions & local mismanagement objectively worsened the crisis beyond the triggers. The *severity* was man-made, even if a modest aggregate shortfall existed.
  *   **Output for Comms:** FLC confirmed. Trigger: War+Natural. Transmission: Market collapse & wage failure. **Crucially:** Failure by UK War Cabinet (diverting resources) and Bengal authorities (denial/mismanagement) turned crisis into catastrophe. **Note:** Historical debate on aggregate shortfall acknowledged, but response failures are clear per counsel's rule.

  **2. Ireland 1845-49 (The Quarter Acre Rule Matters)**
  *   **FL:** `FLC Likely (Entitlement)` (Mortality, mass emigration, sky-high food prices alongside exports).
  *   **Level 1 (Trigger):** Natural (Phytophthora infestans - Blight).
  *   **Level 2 (Transmission):** **Production Failure** (Potato dependence) + **Transfer Failure** (Collapse of potato-based economy) + **Direct Malfeasance?** *Judgment: Production failure primary driver initially.*
  *   **Level 3 (Response Failure):** **IDENTIFIABLE DECISIONS:**
      *   *Malicious Policy:* **Quarter Acre Rule** (1847 Poor Law). Actor: British Govt/Lord John Russell. Decision: Bar relief to anyone holding >1/4 acre, forcing mass evictions/surrenders. *Directly destroyed entitlement.*
      *   *Gross Negligence:* Continued export of grain/livestock *from* Ireland; Insufficient relief scale; Reliance on laissez-faire ideology.
  *   **Man-Made:** `Man-Made` **due to Level 3.** Quarter Acre Rule was a deliberate policy choice accelerating dispossession & death. Export policy was gross negligence. Response was utterly inadequate.
  *   **Output for Comms:** FLC confirmed. Trigger: Blight. Transmission: Collapse of subsistence base. **Response Failure:** British Government policies - crucially the Quarter Acre Rule forcing land abandonment and mass eviction, and the refusal to halt food exports - constituted gross negligence and deliberate entitlement destruction, making the famine far deadlier.

  **3. Great Leap Forward (China 1958-62)**
  *   **FL:** `FLC Likely (Mixed)` (Mass mortality confirmed later).
  *   **Level 1 (Trigger):** Economic/Political (GLF Policies - Communes, Backyard Furnaces).
  *   **Level 2 (Transmission):** **Production Failure** (Chaotic collectivization, diversion of labor to industry, killing sparrows) + **Direct Transfer (Seizure)** (State procurement quotas stripping villages bare) + **Labor Failure** (Exhaustion, collapse).
  *   **Level 3 (Response Failure):** **IDENTIFIABLE DECISIONS:**
      *   *Malicious Policy/Denial:* Continued high procurement quotas *despite* clear evidence of starvation (1959 Lushan); Suppression of reporting; Punishment for local leaders reporting shortages. Actor: Mao Zedong/CCP Central Committee. Decisions: Maintain quotas, suppress dissent, deny crisis.
      *   *Gross Negligence:* Persisting with failed GLF policies long after evidence mounted.
  *   **Man-Made:** `Man-Made` **due to Level 1 & Level 3.** The GLF policies *were* the trigger and the primary transmission mechanism (production failure + seizure). The denial and continued extraction constituted catastrophic response failure. Deeply political at all levels.
  *   **Output for Comms:** FLC confirmed. Trigger: Great Leap Forward policies. Transmission: Collapse of agricultural production due to commune chaos combined with state seizure of remaining food. **Response Failure:** CCP leadership (Mao) refused to acknowledge the crisis or reduce quotas despite overwhelming evidence, actively suppressing reports and prolonging the famine.

  **Summary for Comms Lead:** Run Steps 1-5 sequentially. Focus on data points for FL. For "Man-Made," **absolutely hinge on Level 3** - find the actor and their specific, identifiable decision/inaction that worsened things. Separate the levels rigorously in your bulletin draft. When in doubt on Level 3 or attribution, flag `Cannot Attribute Yet` or `Insufficient Data` and publish only observable facts/risks. Use the case logic as templates for reasoning.
