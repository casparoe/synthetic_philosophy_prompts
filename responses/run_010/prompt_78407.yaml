prompt: |-
  I am a third-year philosophy PhD student working on conditionals, and I would like to settle what Lewis's 1976 triviality result actually commits me to before I finalize my prospectus chapter. I suspect the reasoning below goes wrong somewhere, but I have not been able to locate where, so a diagnosis would be more useful to me than a summary of the literature.

  My understanding of the result is this. Lewis proved that Adams's thesis — the probability of an indicative conditional equals the conditional probability of its consequent given its antecedent — is false. The proof is a theorem of the probability calculus and turns on no assumption about what a conditional means: it establishes only that if the thesis holds for a pair A, C, then for every probability function P either P(A) = 1 or P(C | A) is 0 or 1. The thesis can therefore hold only for degenerate pairs. Being purely mathematical, I take the result to bear on every semantics that gives conditionals propositional content: on Stalnaker-style selection-function accounts, and equally on Lewis's own similarity semantics for counterfactuals, which assigns truth conditions in just the same way. That last consequence is the one I most want to avoid, since my chapter builds on the similarity framework.

  What makes me doubt the reading is a toy computation of my own. Four worlds w1–w4, uniform P. Let A = {w1, w2} and C = {w2, w3}, so P(C | A) = 1/2. I give the conditional truth conditions directly: it is true at a world w just in case C holds at every A-world closest to w, with all A-worlds tied for closest and w's mass divided evenly among them. Each world then contributes 1/2, and P(A → C) = 1/2 = P(C | A). Adams's thesis comes out true, with a perfectly non-extreme conditional probability, in a model I can check by hand.

  Two questions. First, since a theorem cannot have exceptions, where is the error in that computation? I have assumed it must be arithmetic and redone it several times without finding anything. Second, given that Adams's thesis is refuted outright, what should I put in its place as the norm governing which indicative conditionals may be asserted — a broadly Gricean pragmatic story laid over a truth-conditional core, or something else? I would especially like to know whether the answer differs for counterfactuals, since that is where my own project lives, and whether Lewis himself thought conditional probability had any residual role to play once the triviality argument was in hand.
reasoning: |-
  Alright, the user is a third-year PhD student in philosophy focusing on conditionals, specifically concerned about Lewis's 1976 triviality result and its implications for their prospectus chapter. They've presented a toy model where Adams's Thesis seems to hold, contradicting Lewis's theorem, and they're confused about where their reasoning went wrong. They also want guidance on what to replace Adams's Thesis with, especially for counterfactuals in their similarity-based framework.

  First, I need to address their computational example. They have four worlds with uniform probability. A is {w1, w2}, C is {w2, w3}, so P(C|A) = 0.5. They define the conditional A→C as true if C holds at every closest A-world, with all A-worlds tied. Each world contributes 0.5 to P(A→C), so it equals 0.5. But Lewis's theorem says this shouldn't happen unless P(A)=1 or P(C|A) is extreme. So where's the flaw?

  Ah, the key is that Lewis's triviality result requires the thesis to hold for all pairs A,C under a fixed probability function. In their model, they've only checked one pair. If they test another pair, say with different antecedents, it breaks. For example, suppose we take A' as {w1, w3}. Then P(C|A') = P({w2,w3} ∩ {w1,w3}) / P({w1,w3}) = P({w3}) / 0.5 = 0.25 / 0.5 = 0.5. But now compute P(A'→C). The closest A'-worlds are all tied. At w1, closest A'-worlds are w1 and w3; C is false at w1? Wait, C is {w2,w3}, so at w1, C is false. So A'→C is false at w1? Wait, no: the conditional is true iff C holds at every closest A'-world. At w1, closest A'-worlds are w1 and w3. C is false at w1 but true at w3? So not all closest A'-worlds satisfy C? Therefore A'→C is false at w1. Similarly at other worlds? At w1: closest A'-worlds are w1 and w3. C false at w1, true at w3 → not all satisfy C → false. At w2: not an A'-world? Antecedent is A'={w1,w3}, so w2 is not in A'. What's the closest A'-world to w2? Since all worlds are tied, the closest are w1 and w3. C is false at w1, true at w3 → not all satisfy → false. At w3: closest A'-worlds are w1 and w3. C false at w1 → not all → false. At w4: same as w2? Closest A'-worlds w1,w3; C false at w1 → false. So A'→C is false everywhere? P(A'→C)=0, but P(C|A')=0.5. Contradiction! So Adams's Thesis fails for this pair. The user only checked one pair, but Lewis's theorem requires it to hold for all pairs under the same probability function and interpretation.

  So the error was assuming that because it held for one pair, it would hold generally. Lewis's result shows that no non-trivial probability function can satisfy Adams's Thesis for all pairs A,C when the conditional has propositional content. Their toy model only worked for that specific pair, not universally.

  Next, they want to know what to replace Adams's Thesis with. For indicatives, the popular approach is to use a pragmatic story like Grice, or non-propositional views like Adams's own or dynamic semantics. But for counterfactuals, which is their focus, it's different. Lewis himself maintained that counterfactuals have truth conditions via similarity spheres, and their probabilities are just the probabilities of those truth conditions. So P(if A had been, C would have been) = P(A □→ C), which is ordinary probability of a proposition. Adams's Thesis doesn't apply here. The acceptance or assertability might still relate to conditional probability in some contexts, but it's not definitional.

  Lewis did think conditional probability played a role in counterfactuals for other reasons, like the Principal Principle or imaging, but not as Adams's Thesis. For their project, since they're using similarity semantics, they should treat counterfactuals as propositions with truth conditions, so their probability is straightforward. The assertability norm would be the usual one: assert if sufficiently probable to be true.

  They also asked if Lewis thought conditional probability had any role post-triviality. Yes, in imaging for counterfactual probability, but that's different from Adams's Thesis. Imaging shifts probability to closest worlds, whereas conditional probability is about updating. For counterfactuals, it's the probability after imaging that matters, not simple conditional probability.

  So to summarize: the flaw in their example was that Adams's Thesis failed for other antecedents in the same model. For their prospectus, they should defend the propositional view of counterfactuals and explain that Adams's Thesis was only ever intended for indicatives. Replace it with the probability of truth for counterfactuals, and for indicatives, perhaps discuss pragmatic or dynamic alternatives without endorsing them, since their focus is counterfactuals.
answer: |-
  Your questions cut to the heart of the triviality result and its implications. Let me diagnose the error in your computation, explain what Lewis's result actually commits you to (especially regarding counterfactuals), and address the normative question about assertability. Your concern about preserving Lewis's similarity semantics for counterfactuals is well-placed, and fortunately, the diagnosis shows your framework can be largely salvaged.

  ### 1. The Error in Your Toy Computation
  **The flaw is not arithmetic—it's in the scope of Adams's Thesis.** Lewis's triviality result proves that Adams's Thesis **cannot hold universally for all pairs (A, C) under a single probability function P and a fixed propositional interpretation of →**. Your computation only checks *one specific pair (A, C)* in your model. Lewis's theorem shows that *if* Adams's Thesis holds for all possible pairs (A, C) for a given P and →, *then* P must be trivial. Your model violates universality because Adams's Thesis fails for *other* antecedents/consequents under the same P and →.

  **Demonstration using your model:**
  - Worlds: w1, w2, w3, w4, uniform P (each P(w) = 0.25)
  - A = {w1, w2}, C = {w2, w3} → As you computed: P(C|A) = P(w2)/P(A) = 0.25/0.5 = 0.5  
    P(A→C) = P({w : A→C is true at w})  
    With all A-worlds tied for closest:  
    - w1: Closest A-worlds = {w1,w2}; C true at w2 but false at w1? → A→C false?  
    - w2: Closest A-worlds = {w1,w2}; C false at w1? → A→C false?  
    - w3: Closest A-worlds = {w1,w2}; C false at w1? → A→C false?  
    - w4: Closest A-worlds = {w1,w2}; C false at w1? → A→C false?  
    → **A→C is false at all worlds!** P(A→C) = 0 ≠ 0.5 = P(C|A).  

  **Why did your initial computation seem correct?** You likely misapplied the truth conditions. For A→C to be true *at a world w*, C must hold at *all* closest A-worlds to w. In your model, since w1 ∈ A but C is false at w1, any w for which w1 is among the closest A-worlds will make A→C false. Only if all closest A-worlds satisfy C (e.g., if C = A) would it hold. This reveals the key point: **Adams's Thesis cannot hold universally for non-extreme P(C|A) in any propositional semantics where → is defined by a fixed selection function.** Your model is non-trivial only because it violates universality—it works for some pairs but not others.

  ### 2. What Lewis's Result Commits You To
  - **For propositional semantics (including Stalnaker/Lewis-style accounts):**  
    Lewis's theorem shows that **Adams's Thesis cannot be a general principle** for any conditional with propositional content. If → expresses a proposition, P(A→C) is the probability of that proposition, which (by the probability calculus) cannot equal P(C|A) for all A, C unless P is trivial. This applies equally to indicatives and counterfactuals *if* they are given propositional truth conditions.  
  - **Counterfactuals vs. Indicatives:**  
    - **Counterfactuals (your focus):** Lewis's similarity semantics *is* propositional. Thus, for counterfactuals, **P(A □→ C) is simply the probability that "A □→ C" is true**, and Adams's Thesis does *not* hold. This is unproblematic—Lewis never endorsed Adams's Thesis for counterfactuals. Your similarity-based framework remains intact; you just cannot assert that P(A □→ C) = P(C|A).  
    - **Indicatives:** Lewis took his result to refute *propositional* accounts of indicative conditionals. He later endorsed a non-propositional view (e.g., Adams's logic of conditionals) for indicatives, where P(A → C) is *defined* as P(C|A), but → lacks truth conditions.  

  **Lewis's view post-1976:**  
  Lewis maintained that **conditional probability retains a role for counterfactuals**, but *not* via Adams's Thesis. Instead:  
  - **Imaging:** In "Probabilities of Conditionals and Conditional Probabilities" (1976), Lewis suggests that while P(A □→ C) ≠ P(C|A), it equals the probability obtained by *imaging* on A (shifting probability to the closest A-worlds). In your model, P(A □→ C) would be the probability after redistributing each world's mass to its closest A-world(s). For your A and C:  
    - After imaging on A: Mass shifts to {w1,w2}.  
    - P_{image}(C) = P(C|A) = 0.5.  
    Here, P(A □→ C) = P_{image}(C) ("probability under the imaging distribution"), not P(C|A) ("probability under conditioning").  
  - **Principal Principle:** Lewis also linked counterfactual probability to rational credence via chance (e.g., P(A □→ C) ≈ historic chance of C given A in relevant scenarios).

  ### 3. What to Put in Place of Adams's Thesis
  **For counterfactuals (your project):**  
  - **Norm of Assertability:** Assert A □→ C iff your credence in its *truth* is sufficiently high (e.g., > 0.5 or contextually thresholded). Since A □→ C has propositional content, this follows standard Bayesian norms.  
  - **Role of Conditional Probability:** While P(A □→ C) ≠ P(C|A), conditional probability still matters:  
    - Pragmatically: Asserting A □→ C often *conveys* that P(C|A) is high, as background knowledge suggests similarity spheres align with causal dependence (Gricean implicature).  
    - Theoretically: Under imaging, P(A □→ C) = ∑_w P(w) · P(C | closest A-world to w). If the similarity structure is "causally aligned," this approximates P(C|A).  

  **For indicative conditionals:**  
  - **Non-propositional route:** Adams's Thesis can be preserved by denying that indicatives have truth conditions (e.g., Adams, Edgington). Assert A → C iff P(C|A) is high.  
  - **Propositional + Pragmatics route:** Stalnaker (1975) combines truth conditions with a pragmatic constraint (e.g., P(A → C) = P(C|A) when A is compatible with the context). Lewis's result shows this cannot hold universally, but it may hold in limited contexts.  

  ### Recommendations for Your Prospectus
  1. **Defend similarity semantics for counterfactuals:** Stress that Lewis's triviality result *does not* threaten propositional truth conditions for counterfactuals. It only refutes Adams's Thesis as a general principle—which Lewis never supported for counterfactuals anyway.  
  2. **Clarify the probability issue:** State that P(A □→ C) is the ordinary probability of a proposition (determined by similarity spheres). Its value often *correlates* with P(C|A) when similarity reflects causal dependence, but they are not identical.  
  3. **Address assertability:** For counterfactuals, use a truth-conditional norm ("assert if probably true") and optionally supplement with imaging to explain the link to conditional probability. Lewis's "imaging" formalism can help here.  
  4. **Acknowledge the indicative/counterfactual divide:** Your chapter can maintain that counterfactuals have truth conditions while granting that indicatives may require a different treatment (e.g., pragmatic or dynamic). Lewis himself held this view.  

  **Key references:**  
  - Lewis, D. (1976). "Probabilities of Conditionals and Conditional Probabilities."  
  - Lewis, D. (1986). *On the Plurality of Worlds* (similarity semantics for counterfactuals).  
  - Stalnaker, R. (1975). "Indicative Conditionals" (pragmatic defense).  
  - Bacon, A. (2015). "Stalnaker's Thesis in Context" (modern overview).  

  Your toy model insightfully exposed the non-universality pitfall—now you can rigorously defend counterfactual truth conditions while contextualizing Adams's Thesis as a limited (not universal) principle.
