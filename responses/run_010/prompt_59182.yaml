prompt: |-
  I TA a grad seminar on the ethics of war, and my professor has been handing down verdicts on invented cases all term. She never states her principle — she just says liable or not liable and moves on. I'm trying to reverse-engineer her view before the last session, because I'm pretty sure she's going to put a case to us and ask what follows from it. You're a philosopher of war ethics who's taught this material for years and can hold the Walzerian and the revisionist positions in your head at once; think carefully and don't just pattern-match to whichever camp she sounds closest to.

  Her verdicts so far:

  1. A 19-year-old conscript in the aggressor state's army, drafted, genuinely believes the war is defensive, fights strictly within the rules of war. Targetable by the defenders: liable.
  2. A colonel on the aggressor's general staff who plans logistics, knows perfectly well the war is aggressive, carries no weapon, sits 800 km from the front. Liable.
  3. A civilian haulier under contract to the aggressor's army, knows what's in his trucks, but is one of about four thousand identical drivers, hauling grain as often as shells, and could quit tomorrow and be replaced by Thursday. Not liable.
  4. A fighter pilot on the defending, clearly-just side, who has bombed a munitions plant with foreseen but proportionate civilian casualties. Not liable to be targeted by the aggressor's troops.
  5. The same conscript from case 1, captured, disarmed, in a cage. Not liable.
  6. An aggressor soldier who has deserted, is hiding unarmed in a barn, and has no intention of ever picking up a rifle again. Not liable.

  The case she's flagged for next week: a software engineer, national of a neutral third country, working from his own apartment for a private firm. He wrote and still maintains the targeting software the aggressor uses to pick out electrical grid nodes in civilian areas — no one else alive understands the codebase, so if he stops, the campaign stops. He's never worn a uniform, has no rank, isn't on any payroll of the aggressor state, and does it purely for the money, saying he'd take the same contract from any government that paid. Defenders are considering sending a team to kill him. Also in the same building, there's an off-duty uniformed corporal from the aggressor's army who sublets the spare room and does nothing but play video games.

  Structure your answer exactly like this:

  - **Bottom line** — 3 or 4 sentences: who she says is liable in the new case, and with what confidence.
  - **Candidate rules** — about 350 words. Brainstorm here before you commit: lay out at least three principles that could generate all six verdicts (status/role forfeiture for one side's armed forces, graded moral responsibility for an unjust threat, current-threat-only, and anything else you think survives), and say what each one has going for it.
  - **Fit check** — about 300 words, a table is fine: each of the six verdicts against each surviving rule, marking whether the rule explains it cleanly, explains it only with a stretch, or flatly contradicts it. Kill off whatever dies.
  - **The new case** — about 450 words: run each surviving rule on the engineer and the corporal, note where they diverge, and give your best guess at her verdict plus the reasons for preferring it over the alternatives.
  - **The tiebreaker** — about 200 words: one further case, stated concretely, that would come out differently on the two rules you think are still alive, and which of them it would confirm.
  - **What she'd be committed to** — about 150 words: if she rules the way you predict, what's the cost? Which intuitively attractive thing does her view have to give up?

  Be honest about where her verdicts genuinely underdetermine the answer rather than pretending the rules pick out a unique one. No references or reading lists needed — I just want the reasoning.
reasoning: |-
  Hmm, the user is a teaching assistant for a graduate seminar on the ethics of war. They're trying to reverse-engineer their professor's unstated principles based on six case verdicts, and need to predict the verdict for a new case involving a neutral software engineer and an off-duty soldier.

  Looking at the professor's verdicts: She holds combatants liable based on participation rather than personal culpability (cases 1 and 2), but draws clear lines at civilian contractors (case 3 not liable) and non-combatants (cases 5 and 6 not liable). The defensive pilot case (4) shows she rejects moral symmetry - just combatants retain non-liable status.

  Three candidate principles emerge:
  1) **Functional Role Forfeiture**: Anyone integrated into hostile armed forces forfeits protection, regardless of personal beliefs or location. Explains cases 1, 2, 5 well but struggles with the civilian trucker (case 3).
  2) **Unjust Causation Threshold**: Liability requires direct causal contribution exceeding replaceability. Handles cases 2, 3, 4 cleanly but stumbles on the conscript (case 1) who's replaceable yet liable.
  3) **Control Over Unjust Harm**: Focuses on present agency in directing threats. Nails cases 4, 5, 6 but can't explain the non-combatant colonel (case 2) who plans but doesn't execute attacks.

  The fit check reveals Functional Role Forfeiture as the strongest contender, with Unjust Causation Threshold as runner-up. For the new case: The software engineer - while crucial - lacks formal integration into armed forces. The off-duty corporal remains functionally part of the military apparatus despite current inactivity. 

  The tiebreaker case would be a civilian intelligence analyst directly employed by the aggressor's defense ministry. Forfeiture theory would deem them liable; Causation theory might not if their contributions are minor/replaceable. 

  The cost of Forfeiture theory is harshness toward low-agency combatants; the cost of Causation theory is potentially excusing high-impact civilians. Given the professor's pattern, she'll likely apply strict functional membership criteria.

  Final prediction: Corporal liable (integrated), engineer not liable (civilian contractor). Confidence: 80% based on case 3 precedent.
answer: |-
  ### Bottom line
  Your professor will find the **corporal liable** (targetable) and the **software engineer not liable**. Confidence is high (~80%) based on her pattern. She draws a bright line between formal integration into the aggressor's armed forces (even if remote, unarmed, or off-duty) versus civilian contractors performing critical but outsourced functions. The corporal's uniformed status and organizational membership trigger liability despite inactivity; the engineer's neutrality, private employment, and replaceability analogize to the civilian hauler.

  ### Candidate rules
  1. **Functional Role Forfeiture**: Combatants forfeit rights by virtue of membership in the aggressor’s armed forces, regardless of personal culpability, proximity, or current activity. *Strengths*: Cleanly explains cases 1 (conscript), 2 (distant colonel), and 5 (captured POW). Aligns with Walzer’s "moral equality of combatants" but asymmetrically applied only to unjust side.  
  2. **Unjust Causation Threshold**: Liability requires (a) contributing to an unjust threat and (b) passing thresholds of causal significance and non-replaceability. *Strengths*: Explains case 3 (replaceable hauler not liable), case 4 (just combatant not liable for collateral harm), and case 6 (deserter severs causal link). Revisionist-friendly but stricter on causation.  
  3. **Control Over Harm**: Liability attaches only to agents presently controlling unjust threats or making operational decisions. *Strengths*: Explains case 5 (captured) and case 6 (deserter), plus case 4 (defender not liable). Weak on case 2 (non-operational colonel) and case 1 (low-agency conscript).  

  ### Fit check
  | Case               | Functional Role Forfeiture | Unjust Causation Threshold | Control Over Harm |
  |--------------------|----------------------------|----------------------------|-------------------|
  | 1 (Conscript)      | ✔️ Clean                   | ❌ Contradicts (replaceable) | ⚠️ Stretch (not controlling) |
  | 2 (Colonel)        | ✔️ Clean                   | ✔️ Clean (key planner)     | ⚠️ Stretch (no direct control) |
  | 3 (Hauler)         | ❌ Contradicts (civilian)   | ✔️ Clean (replaceable)     | ✔️ Clean (no control) |
  | 4 (Defender pilot) | ✔️ Clean (just side)       | ✔️ Clean (no unjust threat)| ✔️ Clean |
  | 5 (Captured)       | ✔️ Clean (status suspended)| ✔️ Clean (no causation)    | ✔️ Clean |
  | 6 (Deserter)       | ⚠️ Stretch (ex-member?)    | ✔️ Clean (no contribution) | ✔️ Clean |

  **Killed off**:  
  - **Control Over Harm** dies—fails case 2 (colonel liable without controlling harm).  
  - **Unjust Causation** survives but weakly; struggles with case 1 (conscript liable despite low culpability/replaceability).  
  - **Functional Role Forfeiture** survives strongest; only struggles with case 3 (hauler not liable).  

  ### The new case  
  **Functional Role Forfeiture**:  
  - **Corporal**: Liable. Uniformed, formally integrated into aggressor’s military. Off-duty status irrelevant (analogy to case 2: liability isn’t activity-dependent).  
  - **Engineer**: Not liable. Neutral civilian, private contractor, no formal ties to aggressor’s forces. Analogizes to case 3 (hauler)—critical but replaceable (she’d likely reject “no one else understands the code” as hyperbolic).  

  **Unjust Causation Threshold**:  
  - **Corporal**: Not liable? No *current* contribution while gaming. But case 2 suggests planners are liable regardless of activity; this rule may inconsistently excuse low-level soldiers off-duty.  
  - **Engineer**: Liable? Irreplaceably causes unjust harm (unlike hauler). But neutrality and contractor status conflict with case 3’s verdict.  

  **Divergence**: Forfeiture clearly distinguishes corporal (liable) from engineer (not). Causation might blur them (both contribute? neither active?).  

  **Best guess**: She’ll rule **corporal liable, engineer not liable**.  
  - **Why Forfeiture wins**: Case 3 establishes civilian contractors aren’t militarized, even if essential. Case 2 shows organizational membership suffices for liability. Corporal is "one of them"; engineer is a "gun for hire." Her bright line is institutional affiliation, not causal impact.  

  ### The tiebreaker  
  **Case**: *A civilian intelligence analyst employed directly by the aggressor’s Ministry of Defense, analyzing satellite imagery to identify targets. Works from home in a neutral country, replaceable, unarmed.*  
  - **Functional Role Forfeiture**: Liable (integrated into military structure, like colonel).  
  - **Unjust Causation Threshold**: Not liable (replaceable, like hauler).  
  - **Confirming verdict**: If liable, Forfeiture is confirmed; if not, Causation wins. Given her verdict on case 2, I’d predict liability here—securing Forfeiture as her core principle.  

  ### What she’d be committed to  
  Her view must **abandon the intuition that causal impact/replaceability determines liability**. The hauler (case 3) and engineer are causally significant but shielded, while low-level conscripts (case 1) or inactive soldiers (corporal) are exposed solely due to membership. This privileges organizational status over personal moral responsibility—a hard Walzerian edge. The cost: potentially over-including low-threat combatants (e.g., sleeping conscripts) while excluding high-impact civilians enabling aggression.
