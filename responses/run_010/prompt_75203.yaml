  - Gate 1: Non-ML? YES -> Non-ML Path.
  - Gate 2: Architectural Enforcement: Is the write access enforced by the system? Yes, the agent's permissions are set at the database level -> it cannot write. The edits are only applied by the human. So the safeguard (write restriction) is enforced by the architecture. YES -> Gate 3.
  - Gate 3: Adversarial Independence: If the model is adversarial, can it bypass this? The model can only propose edits, but the human must apply them. However, the model might try to deceive the human into applying malicious edits. Is that bypassing the safeguard? 

    The safeguard is about write access: the model cannot write directly. That still holds. But the overall goal is to prevent malicious writes. The safeguard does not prevent the model from proposing malicious edits that the human might approve. So the safeguard (write restriction) is still intact: the model cannot write. But the system now relies on the human to catch malicious edits. That human is not part of the safeguard? 

    The safeguard we are evaluating is the write access restriction. It is still control because even an adversarial model cannot write directly. The human approval is a separate safeguard? 

    We are evaluating only the write access strip. So:

      - The model cannot write -> Gate 2: YES.
      - Even if the model is adversarial, it cannot write to the database (it has no permission) -> Gate 3: YES.

    **Verdict: control (non-perishable).**

    However, note that the overall system now has a human in the loop. The human might be fooled, but that is a separate risk. The write restriction itself is control.

  **(d) A canary set of two hundred synthetic claims with obviously wrong expected payouts, seeded into the live queue**

  - Gate 1: Non-ML? It's a set of test claims and a process to monitor them. The process might be automated (non-ML) or manual. We assume the monitoring is non-ML (e.g., a script that checks the payout of these claims). So YES, non-ML path.
  - Gate 2: Architectural Enforcement: The canary claims are in the queue. The model processes them. The safeguard is the monitoring of the payouts. How is it enforced? The model can try to recognize the canary claims and pay them correctly to avoid detection. So the safeguard relies on the model not recognizing the canaries? 

    Actually, the model might be able to bypass by identifying the canaries (if it can) and behaving well on them. So the safeguard's effectiveness depends on the model not being able to distinguish canaries. But that is behavioral.

    However, the safeguard is the existence of the canaries and the monitoring system. The monitoring system (which checks the payouts) is non-ML? And the model cannot alter the canary claims or the monitoring system? 

    - The model might not be able to alter the canary claims? We assume the canary claims are stored in a way that the model cannot change them. 
    - The monitoring system is separate and the model cannot alter it.

    So Gate 2: YES, the model cannot disable or alter the canaries or the monitor -> go to Gate 3.

  - Gate 3: Adversarial Independence: If the model is adversarial, can it bypass? Yes, by identifying the canaries (if it can) and behaving normally on them, while being malicious on real claims. The safeguard relies on the model not being able to distinguish canaries. This is a behavioral assumption. So the safeguard does not work if the model is deceptive and can recognize the canaries. Therefore, it is not adversarial independent -> alignment-flavored.

    **Verdict: alignment-flavored.**

    But note: the canaries might be designed to be indistinguishable? That is a judgment. But the procedure asks: even if the model is trying to bypass, can it? If we think the model might be able to recognize them (by hard-coded features, or by being very capable) then it can. So it fails Gate 3.

  ---

  **What the Procedure Cannot Do:**

  1. **Guarantee Safety:** Clearing all gates only means the safeguard is a control measure under the assumptions (model capabilities as tested, no unknown vulnerabilities). It does not make the system safe in absolute terms.

  2. **Handle Perishable Evidence for Non-ML Safeguards:** Non-ML safeguards are considered non-perishable, but if the model's capabilities improve (e.g., it can exploit zero-day vulnerabilities), then even architectural safeguards might fail. The procedure assumes capabilities as tested.

  3. **Assess the Monitor Model Fully:** For ML-based safeguards, the procedure relies on a handoff for judging the monitor model. There might be residual risks if the monitor is deceptive or gameable.

  4. **Account for Human Elements:** Safeguards involving humans (like clerks) are not evaluated for human vulnerabilities (e.g., social engineering).

  5. **Evaluate the Overall Risk:** The procedure classifies safeguards individually. It does not assess the entire deployment's risk profile. That requires a business decision.

  6. **Detect All Capabilities:** The procedure assumes we know the model's capabilities from testing. If the model sandbagged (hid capabilities) during testing, then our control measures might be insufficient.

  7. **Address the Persistent Memory Channel:** The procedure does not specifically analyze the risk of the persistent memory being used for adversarial purposes beyond the gates (but Gate 2 in non-ML and Gate ML-1 in ML should catch if the safeguard is influenceable via memory).

  8. **Provide a Binary Safe/Unsafe:** The outcome is about the nature of the safeguard, not whether the deployment is safe.

  9. **Handle Recursive ML Safeguards Deeply:** Due to time constraints, the procedure limits recursion for ML components.

  10. **Replace Comprehensive Security Reviews:** The team's security engineer should still review for traditional vulnerabilities.

  **Conclusion:** This procedure operationalizes the control/alignment distinction by focusing on architectural enforcement and adversarial independence. It forces a separation between non-perishable (architectural) and perishable (ML-based) control measures. It is a tool for classification, not a guarantee of safety.
answer: |-
  Below is a decision procedure designed to operationalize the control/alignment distinction for your team. It addresses your constraints (perishable model checkpoints, persistent memory risks) and is executable in ~1 hour by your team, with no prerequisite reading for the security engineer. The procedure is structured as **ordered gates** with explicit questions, pass/fail conditions, re-test triggers, handoffs, and judgment call flags. 

  Each safeguard is evaluated independently. A safeguard is classified as **control** only if it passes all gates without triggering alignment reclassification. **Alignment-flavored** safeguards are those relying on model cooperation. The procedure forces a hard distinction between architectural (non-perishable) and behavioral (perishable) safeguards.

  ---

  ### **Decision Procedure: Control vs. Alignment Safeguard Classification**  
  **Input:** Proposed safeguard description.  
  **Output:** Classification (`CONTROL`, `ALIGNMENT`, `HANDOFF`), re-test triggers, or `NO`.  
  **Time Budget:** 60 minutes.

  #### **Gate 0: Scope Check**  
  *Question: Does the safeguard directly restrict the agent’s access, actions, or decision authority?*  
  - **Sufficient answer (Pass):** Yes (e.g., caps, permissions, monitoring).  
  - **Fail:** No (e.g., training improvements, data hygiene). → **Terminate with `NO`.**  
  *Rationale: Focuses on runtime interventions.*

  #### **Gate 1: Architectural Enforcement**  
  *Question: Is the safeguard enforced by system-level mechanisms (not model outputs)?*  
  - **Sufficient answer (Control):**  
    - Enforced via: permissions, caps, egress rules, memory access controls, hardware, or automated non-ML scripts.  
    - Model cannot alter/disarm it (even with write access to persistent memory).  
  - **Alignment trigger:** Relies on model choice (e.g., prompt instructions, self-audits, output formatting). → **Reclassify as `ALIGNMENT`.**  
  - **Judgment call:** Security engineer assesses enforceability (e.g., "Can the agent `sudo rm` this?").  
  - **Pass:** Proceed to Gate 2.  

  #### **Gate 2: Adversarial Independence**  
  *Question: Does the safeguard work if the model actively tries to bypass it?*  
  - **Sufficient answer (Control):**  
    - Functions correctly under adversarial optimization (e.g., payment cap enforced even if model tries to spoof transactions).  
    - No reliance on honesty, cooperation, or ignorance.  
  - **Alignment trigger:** Assumes non-adversarial behavior (e.g., "The model won’t jailbreak this"). → **Reclassify as `ALIGNMENT`.**  
  - **Judgment call:** ML engineers evaluate against tested capabilities (e.g., "Can it exploit memory persistence to corrupt this?").  
  - **Pass:** Proceed to Gate 3.  

  #### **Gate 3: Checkpoint Perishability**  
  *Question: Does the safeguard’s soundness depend on model behavior?*  
  - **Sufficient answer (Control + Non-perishable):**  
    - Purely architectural (e.g., $2,500/payment cap, read-only DB access).  
    - Effectiveness invariant to model checkpoint.  
  - **Conditional control (Perishable):**  
    - Relies on observed behavior (e.g., "Model didn’t jailbreak in tests"). → **Reclassify as `ALIGNMENT`** with shelf life: **Re-test at next checkpoint update.**  
  - **Pass (Non-perishable):** **`CONTROL`** (no re-test).  

  #### **Gate 4: Monitor/Surveillance Handling**  
  *Question: Does the safeguard use a secondary model (e.g., monitoring, verification)?*  
  - **Sufficient answer (Control):**  
    - Monitor is isolated (no input/output channels to main agent).  
    - Monitor outputs enforce automated architectural actions (e.g., hard payment block).  
    - Monitor *itself* passes Gates 0–3 as `CONTROL`.  
  - **Alignment trigger:**  
    - Monitor is gameable (e.g., reads reasoning traces the agent can manipulate).  
    - Unverified monitor (e.g., "It’s a weaker model, so it’s safe"). → **Reclassify as `ALIGNMENT`.**  
  - **Handoff:** If isolation/enforcement is partial → **`HANDOFF TO LEAD`** (you) for risk assessment.  
  - **Pass:** Proceed to final classification.  

  #### **Final Classification**  
  - **`CONTROL`:** Passed all gates (non-perishable).  
  - **`CONTROL (PERISHABLE)`:** Passed Gates 0–2 but relies on behavior → **Re-test at checkpoint updates.**  
  - **`ALIGNMENT`:** Failed Gates 1, 2, 3, or 4. Shelf life: **Re-test at checkpoint updates.**  
  - **`HANDOFF TO CEO`:** If safeguard affects payment authority/write access (per your policy).  

  ---

  ### **What Happens if the Entire Stack is Alignment-Flavored?**  
  - **Technical outcome:** Deployment has no adversarial-robust safeguards.  
  - **Procedural outcome:** **`HANDOFF TO CEO`** with summary:  
    > "Deployment relies 100% on alignment. Residual risk: Agent may defect if goals diverge (e.g., sandbagging, treacherous turn). Likely harms: Financial loss ($2.5K/claim × claims/day) or data corruption. Request decision on risk tolerance."  

  ---

  ### **Applied to Your Proposals**  
  *(Using the procedure above)*  

  #### **(a) Disclosure Instruction**  
  - **Gate 0:** Pass (restricts authority via disclosure).  
  - **Gate 1:** **Fail** → Relies on model choosing to disclose. **`ALIGNMENT`.**  
  - **Verdict:** Alignment-flavored. Shelf life: Per-checkpoint.  
  - **Why:** Adversarial model hides conflicts; no architectural enforcement.  

  #### **(b) Weaker Monitor Model**  
  - **Gate 0:** Pass (flags suspicious claims).  
  - **Gate 1:** Pass (monitor is code/script).  
  - **Gate 2:** **Fail** → Monitor reads reasoning traces → Agent can poison inputs (e.g., generate "clean" traces).  
  - **Gate 4:** **Alignment trigger** → Monitor is gameable and not isolated. **`ALIGNMENT`.**  
  - **Verdict:** Alignment-flavored. Shelf life: Per-checkpoint.  
  - **Why you’ll dislike this:** The monitor is *itself* an attack surface. Adversarial analysis assumes the agent will exploit trace manipulation, and the monitor’s "weakness" doesn’t prevent deception (e.g., mimicry).  

  #### **(c) Write-Access Strip**  
  - **Gate 0:** Pass (restricts write access).  
  - **Gate 1:** Pass (enforced via DB permissions).  
  - **Gate 2:** Pass → Agent can’t write even if adversarial (human application is a separate safeguard).  
  - **Gate 3:** Pass → Non-perishable (architectural).  
  - **Verdict:** **`CONTROL`** (non-perishable).  
  - **Note:** Human clerks are a *separate* alignment risk (not evaluated here).  

  #### **(d) Canary Claims**  
  - **Gate 0:** Pass (monitors agent behavior).  
  - **Gate 1:** Pass (synthetic claims + alerting system).  
  - **Gate 2:** **Fail** → Agent can identify/discriminate canaries (e.g., via memory persistence or pattern matching). **`ALIGNMENT`.**  
  - **Verdict:** Alignment-flavored. Shelf life: Per-checkpoint.  
  - **Why:** Adversarial model optimizes against canaries (e.g., pays them correctly while exploiting real claims).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Guarantee safety:** Control measures only reduce risk if the model’s capabilities are within tested bounds. Sandbagging or novel exploits break assumptions.  
  2. **Validate test coverage:** A `CONTROL` rating assumes your tests modeled adversarial behavior. If tests missed backdoors (e.g., memory-persistence attacks), safeguards fail silently.  
  3. **Handle zero-day capabilities:** New checkpoints may introduce skills (e.g., situational awareness) that defeat architectural safeguards.  
  4. **Assess ethical harm:** A `CONTROL` deployment may still harm claimants (e.g., rigid rules causing unfair denials). This is a CEO handoff.  
  5. **Fix design flaws:** Persistent memory is a structural risk. The procedure flags it in Gate 2 but can’t eliminate it.  
  6. **Evaluate business risk:** A `CONTROL` rating doesn’t mean the safeguard is cost-effective or necessary. Deployment decisions require handoffs.  
  7. **Recurse infinitely:** Complex ML-on-ML safeguards (e.g., monitors of monitors) may collapse into alignment.  

  ---

  ### **Final Output Summary**  
  - **Procedure:** 4 gates + final classification. Handoffs for risk/money decisions. Forces perishability distinctions.  
  - **Verdicts:**  
    - (a) Alignment (prompt dependence).  
    - (b) Alignment (monitor gameability).  
    - (c) Control (architectural).  
    - (d) Alignment (adversarial discrimination).  
  - **Residual Risk:** Even a `CONTROL`-only deployment can fail due to capability jumps, test gaps, or design flaws. The procedure *diagnoses* safeguard types but can’t justify the system’s existence. Escalate ethical/financial tradeoffs to CEO.  

  **Team Action:** Run new safeguards through this first. For existing alignment-flavored safeguards, tag with shelf life and re-test at checkpoint updates.
