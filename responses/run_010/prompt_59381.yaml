prompt: |-
  I'm in the middle of a novel about a staking operation — the sort where a backer puts up all the money and a young poker player grinds it out for a cut — and I've been talking to people in that world to get the details right. What keeps striking me is how much of a whole moral and mathematical system is baked into the paperwork, and I can't tell which bits are load-bearing and which are just custom.

  The arrangement as it's usually described to me: the backer fronts the bankroll, takes half the winnings, the player keeps half. If the player loses, the loss isn't wiped — it goes on the books as 'makeup', and the player doesn't see a penny of their share until makeup is cleared. Makeup survives the end of a session, a month, sometimes the end of the deal itself: if the player wants to walk and sign with another backer, the debt has to be bought out first. Alongside that, players are told constantly never to risk the roll — one or two per cent a game, and if you drop below a threshold you move down in stakes rather than up. But the same people will tell you to take a shot at a game you can't really afford when a rich fish sits down, and they'll say the reason its fine is that you're not risking your own money, you're risking the backer's.

  What does that whole package presuppose about what it is to bet well? I keep getting told it's the Kelly criterion in practice — bet the fraction of your roll that makes it grow fastest over the long run, and never risk going bust, because a bust ends the growth story. But makeup looks like it changes the story: nobody goes bust, they just owe, indefinitely, and the person doing the owing keeps playing. So is the rule about the money or about the person? And how can never risk the roll and take the shot both be right unless the two are measuring different things, or unless somebody's long run is not somebody else's?

  Can you reconstruct the theory of rational betting the staking world is actually running on, and tell me what it commits my characters to that I hadn't noticed — in particular whether it's a view about long-run growth, a view about utility, or a view about who a player is across time, and whether the long run it appeals to is something a single mortal person ever gets to stand in for. I'd like to know which parts of the practice strictly require that theory and which would sit just as happily under a rival one, plus where the practice is simply underdetermined, so I don't put a contradiction in someone's mouth that isn't really there. And if you swapped it for a straightforward expected-utility view of a person who's going to die in fourty-odd years and can't reinvest forever, what would these contracts have to look like instead — would makeup still make any sense?

  British English please. Don't worry about keeping it short, this is for my notes rather than the book.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're writing a novel about poker staking deals, specifically focusing on the moral and mathematical systems embedded in the paperwork. The key elements are the makeup clause, risk management rules, and the apparent contradiction between "never risk the roll" and "take the shot." They want to understand the underlying theory of rational betting that justifies these practices.

  First, I need to recall how staking operations work. The backer provides the bankroll, takes half the profits, and the player keeps the other half. Losses become makeup, which carries over indefinitely. The player can't earn until the debt is cleared. The user mentions the Kelly criterion as a reference point but questions how makeup fits into that framework.

  The user’s main question is about the presuppositions behind this system. They’re wondering if it’s about long-term growth, utility, or the identity of the player over time. Also, they want to know which parts of the practice are essential to the theory and which are flexible. The contradiction between conservative play and taking shots at juicy games needs explaining. They also ask how the system would change under a finite expected-utility model.

  I should start by breaking down the implicit assumptions. The makeup system treats the player as a perpetual entity. The debt sticks with them, suggesting that the player’s career is seen as a continuous enterprise. This contrasts with a finite human lifespan. The Kelly criterion emphasizes avoiding ruin, but makeup prevents ruin by converting losses into debt. So the risk shifts from bankruptcy to indebtedness.

  The "never risk the roll" rule is about preserving the enterprise, while "take the shot" is a tactical exception when the expected value is high. But since the backer absorbs the downside, the player might be incentivized to take more risks. However, the makeup acts as a counterbalance because the player owes those losses. So the system relies on the player’s reputation and future earning potential to enforce discipline.

  Next, considering different theoretical frameworks. The Kelly criterion is growth-optimized over infinite trials. Makeup extends this by ensuring losses are recouped before profits, aligning the player’s incentives with long-term growth. If swapped for a finite expected-utility model, makeup might not make sense because the player’s career is limited. Instead, contracts might have fixed terms or loss limits.

  I need to identify which practices are load-bearing. Makeup is crucial for incentive alignment but could be replaced with other mechanisms like shorter contracts. The 1-2% risk rule is core to bankroll management. The "take the shot" advice is context-dependent and reflects a utility calculation where high EV opportunities justify deviation from strict Kelly.

  The user also wants to avoid contradictions in character dialogue. So highlighting where the practice is underdetermined is key. For example, the threshold for moving down stakes isn't strictly mathematical but involves judgment. The tension between risk aversion and aggression isn't a contradiction but a nuanced application of principles based on context.

  Finally, considering alternative systems. Without makeup, staking deals might use escrow, profit-sharing only after a threshold, or staged contracts. The backer might impose stricter oversight. The moral hazard issue would be more pronounced without makeup, requiring different safeguards.

  I should ensure all points address the user’s deeper needs: accurate depiction of staking contracts, believable character motivations, and the underlying tensions between theory and practice. Highlighting the cultural aspects, like reputation and identity, adds depth to the narrative. Also, clarifying where flexibility exists allows the user to create authentic conflicts without logical flaws.
answer: |-
  Right, let's dissect this fascinating moral-mathematical engine powering the staking world. It's a system built on **perpetual enterprise, aligned incentives, and the primacy of survival**, wrapped in the harsh reality of human psychology and opportunity. Forget a single, pure theory; it's a pragmatic hybrid.

  **The Core Presuppositions:**

  1.  **The Player is a Perpetual Entity, Not a Mortal:** The entire structure presupposes the player's career is an infinite (or at least indefinite) sequence of gambles. "Going bust" isn't running out of *cash*, it's the *enterprise* collapsing. Makeup ensures the *enterprise* (the player's earning potential backed by capital) survives individual downswings. The debt attaches to the *player's identity and future earning capacity*, not just a finite bankroll. This is why makeup survives deals – the debt is against *them*, not a specific pot of money.
  2.  **Long-Run Growth is Paramount (But Survival is Prerequisite):** Kelly is indeed the foundational *mathematical* ideal: maximise the *geometric* growth rate of the bankroll. This necessitates *never risking ruin*. The "1-2%" rule and moving down stakes are pure Kelly-in-practice: protecting the roll *is* protecting the engine of growth.
  3.  **Incentive Alignment is Critical (The Moral Hazard Problem):** The backer faces massive moral hazard. The player:
      *   Doesn't risk their *own* capital upfront.
      *   Gets 50% of wins but only "owes" losses (via makeup) rather than paying them back directly.
      *   Could be tempted to play recklessly high for a big score (gambling) or play badly due to lack of skin in the game.
      Makeup is the **load-bearing mechanism** solving this:
      *   **Shares Downside:** Losses create a real, persisting debt (makeup) the player must clear before profiting. This is their "skin".
      *   **Aligns Time Horizons:** The player *must* care about long-term survival and consistent winning to ever get paid. Reckless play deepens the hole.
      *   **Prevents Walkaways:** By surviving deals, it locks the player in (or makes switching costly via buyouts), preventing them from dumping a losing position onto one backer and starting fresh with another.
  4.  **Variance is the Dragon, Skill is the Knight (Eventually):** The system presupposes that over a sufficiently long run, the player's *skill* will overcome variance and generate a positive expectation (+EV). Makeup allows the backer to weather the variance storm alongside the skilled player. If skill wasn't the bedrock assumption, staking would be pure madness.
  5.  **Opportunity Trumps Strict Bankroll Management (Sometimes):** This is where pragmatism bends the Kelly ideal. The Kelly Criterion optimises growth *of the current bankroll*. But poker isn't played in a vacuum.

  **The "Take the Shot" Paradox Resolved:**

  *   **"Never Risk the Roll" (Kelly):** This refers to risking a ruinous portion of the *entire enterprise bankroll* on a single session/game. It protects the *system*.
  *   **"Take the Shot" (Opportunity):** This refers to risking a *larger-than-usual* portion (maybe 5-10x a normal session buy-in, but crucially *not* the whole roll) against a perceived massive +EV opportunity (the rich fish). Why is it "fine"?
      *   **The Backer's Risk Appetite:** The backer, diversifying across players/games/businesses, may have a higher effective risk tolerance for *individual tactical opportunities* than the Kelly fraction calculated on a *single player's* bankroll would suggest. They absorb the variance *across* their portfolio.
      *   **Scaling the Opportunity:** The shot isn't about betting the entire roll, but about temporarily playing at stakes *supported by the potential EV of that specific game*, even if it slightly exceeds the strict Kelly fraction for their *isolated* roll. The fish creates an exceptional, non-recurring EV boost.
      *   **Downside is Contained (by Makeup):** If the shot fails, the loss *is* painful, but it becomes makeup. The *enterprise doesn't die*. The player isn't ruined, just deeper in debt. They can grind back down at lower stakes. The system survives to fight another day.
      *   **Upside is Captured (and Shared):** If the shot succeeds, it can significantly boost the bankroll (allowing higher *sustainable* stakes via Kelly) *and* potentially clear makeup faster. The backer gets 50% of this windfall.
      *   **Skill Leverage:** Crucially, the shot is only "rational" if the player's *skill edge* in that specific game is exceptionally large. It's leveraging skill against weakness, not blind gambling. The risk is justified by the distorted EV.

  **Which Bits are Load-Bearing vs. Custom?**

  *   **Load-Bearing (Requires the Core Theory):**
      *   **Makeup:** Fundamental for incentive alignment, long-term player lock-in, and enterprise survival. Without it, moral hazard explodes. Alternatives (like direct loss liability for the player) wouldn't work for most young players. *This is the core innovation.*
      *   **Profit Split (50/50):** The specific % is somewhat customary but rooted in balancing risk (backer provides 100% capital) and effort (player provides 100% execution). A significantly different split (e.g., 80/20) would radically alter incentives and likely require different safeguards.
      *   **Bankroll Management Rules (1-2%, Moving Down):** Core to the Kelly/survival principle. Playing above sustainable stakes risks catastrophic loss faster than skill can overcome variance, destroying the enterprise. Moving down is the safety valve.
  *   **Custom/Underdetermined:**
      *   **The *Specific* Profit Split (50/50 vs 60/40 etc.):** While the *concept* of a split is load-bearing, the exact percentage is more negotiable and customary. It reflects market forces, player reputation, and backer risk assessment.
      *   **Makeup Details:** Whether makeup survives the deal indefinitely, has a time limit, or requires buyout *at full value or a discount* is highly negotiable and underdetermined by pure theory. This is where power dynamics, reputation, and custom reign. Does interest accrue? Rarely discussed, highly custom.
      *   **"Shot" Thresholds:** *When* is a game "juicy" enough? *How much* over normal stakes is acceptable? This is pure judgment, experience, and risk tolerance. No strict formula, leading to potential disagreements.
      *   **Backer Oversight:** How closely the backer monitors play, demands hand histories, or dictates game selection varies massively. Theory suggests oversight reduces moral hazard, but practice ranges from micromanagement to total player freedom based on trust.
  *   **The Tension Isn't a Contradiction, It's Nuance:** The "never risk the roll" vs. "take the shot" advice isn't logically contradictory. It's applying different principles to different contexts:
      *   **Strategic Principle (Survival):** Governs the overall bankroll allocation and career trajectory (Kelly).
      *   **Tactical Principle (Maximising EV):** Governs exploiting exceptional, time-limited opportunities within the constraints of the strategic principle (i.e., without betting the *entire* roll).

  **The Mortal Problem: Expected Utility and Finite Horizons**

  If we swap the "perpetual enterprise" view for a mortal player with a 40-year career and no reinvestment infinity:

  1.  **Makeup Loses its Shine (and Sense):**
      *   **The Burden:** Owing makeup deep into a career becomes a crushing, potentially unrecoverable burden as time runs out. The incentive to grind it back diminishes as retirement looms.
      *   **Moral Hazard Shifts:** A player nearing retirement with large makeup might be tempted to "go for broke" – take insane risks knowing if they win, they clear the debt and profit, and if they lose... well, they were bankrupt anyway. This *increases* backer risk.
      *   **Alignment Breaks:** The long-term alignment provided by indefinite makeup fractures when the long-term isn't indefinite for the player.
  2.  **Alternative Contract Structures (No Makeup World):**
      *   **Fixed-Term Deals:** "I'll stake you for 2 years. 50/50 profits. Losses absorbed by me after 2 years." Cleaner for finite horizons but creates end-of-term perverse incentives (player might "tank" if losing near the end, or play recklessly if winning).
      *   **Loss Limits:** "I'll stake you, 50/50, but my total liability is capped at £X." Protects the backer but doesn't give the player the "infinite" variance absorption during the deal. Player might be forced to stop playing prematurely during a downswing.
      *   **Escrow/Reserves:** Player's *share* of profits is held in escrow to cover future losses within the deal. Once cleared, they get paid. Losses beyond the escrow end the deal. More player skin-in-the-game, less long-term debt burden.
      *   **Profit Thresholds:** "Backer absorbs first £Y losses. Profits split 50/50 only *after* the bankroll is £Z above starting point." Reduces initial makeup burden but still creates debt.
      *   **Discounted Buyouts:** Makeup *must* be settled on deal end, but at a negotiated discount (e.g., 50p on the pound). Acknowledges the finite horizon and reduced recoverability.
      *   **Higher Backer Share (e.g., 70/30):** Compensates the backer more for absorbing losses without recourse, reflecting the higher risk without indefinite makeup.
      *   **Staged Contracts:** "Deal 1: Build roll to X, 60/40 my way. Deal 2 (if successful): Larger roll, 50/50." Less need for deep makeup if initial success is proven.

  **What it Commits Your Characters To (Unseen Bonds):**

  1.  **The Player's Identity is Collateral:** Their *future self* is literally the guarantee. Walking away from makeup isn't just quitting; it's financial and reputational suicide. This creates immense psychological pressure – they *are* the debt.
  2.  **A Relationship of Asymmetric Dependency:** The player depends on the backer's capital for opportunity. The backer depends on the player's *continued effort and integrity* to realise a return. Makeup binds them in a potentially fraught, long-term marriage of convenience. Resentment can build on both sides (player feels enslaved by debt, backer feels bled dry by losses).
  3.  **The Primacy of Grind:** The system presupposes and demands relentless, disciplined grinding. The "get rich quick" dream is tempered by the reality of makeup clearance. Characters must embody patience and resilience or crack under the pressure.
  4.  **Reputation as Currency:** A player's reputation for skill *and* integrity (to grind out makeup, not welch) is paramount. A backer's reputation for fairness in settling makeup or allowing shots is equally critical. The paperwork is the legal framework; reputation is the oil in the engine.
  5.  **The Illusion of "House Money":** The constant refrain "it's not your money" is psychologically crucial *for taking necessary risks* but fundamentally misleading. It *is* the player's money in the sense that losses create a real, personal debt (makeup) and wins are their only path to income. The "shot" justification leverages this cognitive dissonance.

  **In Summary:**

  The staking system runs on a **theory of perpetual, skill-driven growth optimised for survival (Kelly)**, enforced by a **mechanism of long-term, identity-bound debt (makeup)** to solve **acute moral hazard**. It presupposes **infinite (career) time horizons** and treats the **player as an enduring enterprise**.

  *   **Load-Bearing:** Makeup, Profit Split Concept, Strict Bankroll Management Rules.
  *   **Custom/Underdetermined:** Exact Split %, Makeup Duration/Buyout Terms, Shot Thresholds, Oversight Level.
  *   **Finite Lifespan Incompatibility:** Makeup becomes problematic. Contracts would need fixed terms, loss caps, escrow, or higher backer shares to function rationally under an expected-utility model. The "perpetual enterprise" illusion shatters.

  For your novel, the richest veins lie in the **psychological weight of makeup** (the debt as identity), the **strained intimacy of the backer-player relationship**, the **tension between disciplined grind and opportunistic shots**, and the **constant, low hum of moral hazard** beneath the surface of the paperwork. The paperwork isn't just custom; it's the concrete manifestation of a brutal, fascinating logic designed to make betting other people's money rationally possible. Good luck!
