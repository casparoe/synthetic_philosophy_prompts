answer: |-
  What you're describing is a remarkably precise and layered phenomenon that operates at the intersection of cultural transmission, cognitive bias, institutional validation, and authorial adaptation. It's *not* just misquotation or drift—it's a specific feedback loop where **selection pressure for oral/aural efficiency and aphoristic resonance during social sharing rewrites the source material through institutional re-adoption, forcing authorial complicity.** Let's carve it:

  ### Core Components & The Nearest Established Concepts
  1.  **The Initial Mutation: Aphoristic Drift (with Orality Bias)**
      *   **What it is:** The transformation of your original sentence ("Grief is a house you keep adding rooms to...") into a tighter, more self-contained, rhythmically simpler mutant ("Grief is a house you build around the dead") during social sharing (podcasts, reviews, social media).
      *   **Nearest Concepts:** *Memetic Drift* (like genetic drift, but for ideas), *Leveling & Sharpening* (from rumor psychology - complex details drop, structure simplifies), *Aphorization*.
      *   **Distinction:** This isn't random mutation. It's *systematically directional*:
          *   **Cognitive Load Reduction:** Mutants minimize syntactic complexity ("hinges"), ambiguity, and emotional vulnerability ("embarrassed by itself").
          *   **Oral/Aural Optimization:** Mutants prioritize rhythm, punchiness, and ease of speaking aloud. They become soundbites.
          *   **Aphoristic Appeal:** Mutants strive for the self-contained, universal truth-feel of an aphorism, shedding context and nuance. They become *detachable*.
      *   **Boundary:** Ordinary paraphrase aims for semantic fidelity, even if simplified. Here, fidelity is sacrificed *specifically* for shareability and oral/aural efficiency. It's paraphrase optimized for viral transmission, not accuracy.

  2.  **The Feedback Loop: Retroactive Canonization**
      *   **What it is:** The mutated version, having gained cultural traction, is re-imported *into* the authoritative ecosystem of the original work (paperback blurbs, translations based on the mutant, anthologies, revised editions). The mutant becomes the *de facto* official text.
      *   **Nearest Concepts:** *Canonization* (establishing an authoritative version), *Feedback Loop* (in systems theory), *Path Dependency* (where early choices constrain later ones), *Source Contamination* (in textual criticism).
      *   **Distinction:** This isn't just the mutant existing alongside the original. It's the mutant *replacing* the original within its own institutional context because:
          *   **Cultural Primacy:** The mutant is more widely recognized.
          *   **Perceived Authority:** Institutions (publishers, translators, anthologists) validate the mutant by using it, mistaking popularity for authenticity or prioritizing audience expectation.
          *   **Source Degradation:** The original now sounds "wrong" or like a "typo" *precisely because* the mutant has become canonical. This is key – the source is corrupted *by its own offspring*.
      *   **Boundary:** A translator making an *interpretive choice* based on the *full original text* is ordinary adaptation. Here, the translator uses the *already-mutated social quote* as the source, bypassing your actual text. Editorial housekeeping fixes errors; this "restores" an error *because* it's popular.

  3.  **The Authorial Adaptation: Preemptive Aphorization**
      *   **What it is:** You consciously or subconsciously crafting lines *designed* to survive the mutation process ("short, self-contained, no hinge"), sacrificing the original prose's integrity ("writing for the copy") to avoid the pain of Retroactive Canonization.
      *   **Nearest Concepts:** *Self-Censorship*, *Anticipatory Conformity*, *Platform Optimization* (like writing for algorithms).
      *   **Distinction:** This isn't just learning to write quotably. It's a *defensive mutation* driven specifically by the trauma of the previous loop (source degradation). You're altering your core creative process to preempt the system that rewrote you, becoming complicit in the very process degrading your work. It's prophylactic self-bowdlerization for the age of social sharing.

  ### The Name for the Entire Loop
  No single established term perfectly captures the *entire* cycle (Drift -> Canonization -> Preemptive Adaptation). However, **Retroactive Canonization** is the most critical and unique *phase* needing a name, and it strongly implies the loop.

  1.  **Retroactive Canonization**
      *   **Definition:** The process by which a socially mutated variant of a textual element (phrase, sentence, quote), optimized for oral/aural transmission and aphoristic resonance, gains sufficient cultural traction to be re-imported and established as the authoritative version within the source material's own ecosystem (editions, translations, official derivatives), superseding the creator's original.
      *   **Pros:** Highly precise for the feedback phase. Captures the institutional re-writing ("canonization") based on later popularity ("retroactive"). Sounds academic/established. Implies the erasure of the original authority. Clearly distinct from simple drift.
      *   **Cons:** Doesn't *explicitly* encompass the initial mutation mechanics or the authorial adaptation (though these are implied drivers and consequences). Focuses on the institutional outcome.
      *   **Best For:** Academic/literary essays discussing the re-writing of the source. Your strongest candidate for "dropping in."

  2.  **Aphoristic Reversion**
      *   **Definition:** The systemic tendency of complex prose, under social transmission pressures, to mutate towards simplified, self-contained aphorisms, and for these successful mutants to subsequently replace their original source versions within authoritative contexts, often triggering authorial pre-emption of the process.
      *   **Pros:** Highlights the core *direction* of the mutation (towards the aphorism). "Reversion" hints at the feedback loop (returning to corrupt the source). Encompasses the evolutionary pressure.
      *   **Cons:** "Reversion" might imply a return to a *prior* state, which isn't accurate (it's a new state). Less immediately clear than "Retroactive Canonization" for the institutional overwrite. Sounds slightly more coined.
      *   **Best For:** Discussions emphasizing the *evolutionary* and *cognitive* pressures driving the phenomenon.

  3.  **Source Collapse**
      *   **Definition:** The erosion of a text's original authority caused by the feedback loop wherein socially optimized mutations of its elements gain primacy and are re-embedded as the canonical version, often leading to authorial adaptation towards producing pre-mutated forms.
      *   **Pros:** Dramatic, concise. Captures the consequence for the author/original text ("collapse"). Implies the instability of the source.
      *   **Cons:** Most metaphorical/coined-sounding. Doesn't specify the *mechanism* of mutation (aphoristic/oral). Might be misinterpreted as general plagiarism or loss of copyright.
      *   **Best For:** More polemical or creative non-fiction pieces emphasizing the author's experience of loss of control.

  **Which to Bet On: Retroactive Canonization.** It has the strongest academic ring, precisely names the most unique and jarring phase (the mutant becoming the source), and clearly distinguishes the phenomenon from mere misquotation or drift. You can then efficiently describe the "aphoristic drift" that enables it and the "preemptive adaptation" it induces. E.g., "My work has been subject to *retroactive canonization*, where aphoristic drift during social sharing creates mutants that later replace my original text in translations and editions, forcing a damaging cycle of preemptive adaptation in my drafting."

  ### Boundary Case: What Looks Like It But Isn't
  *   **The Case:** A famous line from a classic film or song exists in multiple legitimate versions (e.g., Bogart *may or may not* have said "Play it again, Sam" exactly that way in *Casablanca*; Bob Dylan constantly changes lyrics live). Fans debate the "true" version, misquote it, and iconic misquotes persist.
  *   **Why it's Different:** The *source material itself* (the released film, the original album recording) usually remains stable and authoritative. While misquotes thrive culturally, they don't typically get *written back into* official re-releases of the film, remastered albums, or the screenplays/sheet music published by the rights holders as the *definitive* text. The institutional canon (the original artifact) holds firm against the social mutant. Retroactive Canonization requires the mutant to *become* the official source text within its own lineage.

  This phenomenon is the dark side of shareability culture meeting institutional inertia and audience expectation. It's not fame; it's a specific textual entropy accelerated by the mechanics of digital oral culture, where the easiest-to-say version wins, then overwrites history. Recognizing it as **Retroactive Canonization** gives you the tool to dissect it. The tragic irony of your preemptive adaptation is that it feeds the very machine you're trying to appease. The only counter might be extreme textual vigilance (refusing all changes, even in blurbs/samplers) or leaning *harder* into the unruly complexity the system discards – making sentences that actively resist becoming soundbites, ensuring the mutants are clearly inferior distortions. A risky, but perhaps necessary, rebellion.
