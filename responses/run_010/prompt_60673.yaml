answer: |-
  Here's a disambiguation of "a white horse is not a horse" (白馬非馬 *bái mǎ fēi mǎ*), ordered from least to most revisionary, designed to clarify classroom disputes:

  ### The Spectrum of Readings (Least to Most Revisionary)

  1.  **Reading: Functional Non-Identity (Selection/Satisfaction)**
      *   **Thesis:** The phrase "white horse" and the phrase "horse" serve distinct *functional roles* in specific contexts (e.g., fulfilling requests, counting, categorization). What satisfies the demand "bring a horse" is not identical to what satisfies the demand "bring a white horse," even though every white horse *is* a horse. The names are not interchangeable *for practical purposes of identification or selection*.
      *   **About Names:** Names have context-dependent functions; compound names impose stricter selection criteria than their components alone.
      *   **Status:** A substantive, defensible position (arguably the dialogue's core pragmatic point).
      *   **Requires:** Recognition that linguistic function (what a term *does* in an utterance) can differ from ontological classification (what a thing *is*). The request example ("yellow/black horse suffices for 'horse' but not for 'white horse'") directly supports *this* reading. It's about successful communication and action, not logic or metaphysics per se.

  2.  **Reading: Intensional Distinction / Non-Substitutability**
      *   **Thesis:** "White horse" and "horse" have different *intensions* (meanings, concepts, criteria for application). Therefore, they cannot be substituted *salva veritate* (while preserving truth) in all contexts, particularly the argumentative context Gongsun Long constructs. The paradox arises precisely because they function differently semantically, not because someone is equivocating.
      *   **About Names:** Compound names create new, distinct intensions, not merely additive combinations. The whole signifies something different than the sum of its parts.
      *   **Status:** A substantive, defensible position (a plausible semantic analysis).
      *   **Requires:** Accepting that meaning (intension) affects substitutability, even when extension overlaps. The request example supports this by showing the criteria (intension) differ. This reading *vindicates your classmate's rebuttal to the linguist*: the argument relies on the terms having distinct semantic roles (non-substitutability), so pointing out the equivocation misses the intended point. It does *not* require a general theory of opaque contexts; it's specific to how these terms function within this argument.

  3.  **Reading: Compound Name Holism**
      *   **Thesis:** Combining "white" (a color term/adjective) and "horse" (a kind term/noun) creates a new, unified name ("white-horse") that designates a distinct *type* or *category*. This compound category is not simply the intersection of "white things" and "horses," nor is it reducible to "horse plus the incidental property white." It signifies a unique *kind* ("white-horse-kind").
      *   **About Names/Properties:** Compound terms create new ontological categories; properties are not merely accidental additions to a core substance. The compound name picks out a specific *this-ness*.
      *   **Status:** A substantive, more metaphysically loaded position. Defensible within certain philosophical frameworks.
      *   **Requires:** A view where linguistic compounding reflects or creates ontological distinctions. The request example supports this by implying "white horse" demands a member of that specific compound-kind, not just any horse that happens to be white. This goes beyond mere functional non-identity (Reading 1) by positing a distinct ontological category.

  4.  **Reading: Mereological Exclusion (Strong Composition)**
      *   **Thesis:** The compound name "white horse" refers *only* to the combination of whiteness and horseness. "Horse" refers *only* to horseness. Since "horseness" alone is not identical to "horseness combined with whiteness," a white horse (the combination) is not identical to a horse (the horseness component). "Horse" names the *shape/form*; "white horse" names the *shape/form combined with color*.
      *   **About Things/Properties:** Things are bundles or composites of properties. Referring to the whole composite is different from referring to a constituent part (horseness). The "white" part actively excludes pure "horseness."
      *   **Status:** A highly substantive, revisionary metaphysical position. Logically defensible but ontologically controversial. May reflect a "part-whole" logic.
      *   **Requires:** Commitment to a strict mereological view where wholes are distinct from their parts, and names rigidly designate specific property-combinations or aspects. The request example *indirectly* supports this by showing that supplying "horseness" alone doesn't satisfy the demand for "horseness+whiteness." This is where the "components" reading you requested becomes metaphysically heavy.

  5.  **Reading: Radical Copula Reinterpretation / No Class Membership**
      *   **Thesis:** The Classical Chinese term *fei* (非), often translated as "is not," does *not* express the logical relation of class membership exclusion ("is not a member of the class of horses"). The entire Western logical framework of classes, membership, and the copula ("is") is inappropriate. "Bai ma fei ma" asserts a different, perhaps unique, relation – perhaps identity denial ("white horse is not [identical to] horse"), or category distinction ("white horse belongs to a category different from horse").
      *   **About Language/Logic:** Challenges the universality of Indo-European subject-copula-predicate logic. Asserts a fundamental difference in how Classical Chinese expresses predication and categorization.
      *   **Status:** A highly revisionary thesis about logic and translation methodology. Controversial and difficult to fully substantiate.
      *   **Requires:** Evidence that *fei* consistently behaves differently from the copula "is" in logical arguments across Classical Chinese texts; that the concept of abstract classes/membership was absent; and that alternative models better explain the reasoning. Crucially, this is **primarily a methodological warning about translation** masquerading as a metaphysical discovery if stated as "the Chinese notion of 'is' was never class membership." Evidence *for the warning* includes the copula-less structure of Classical Chinese and arguments like the White Horse Dialogue resisting standard class-inclusion analysis. Evidence *for it as a metaphysical discovery* would require proving Chinese thinkers *conceived* of relations in a fundamentally non-class-logic way, which is much harder.

  ### Adjudicating the Classroom Uses

  1.  **"Anticipates Intension/Extension Distinction":**
      *   **Licensed By:** Primarily **Reading 2 (Intensional Distinction)**. The argument clearly hinges on the *meanings/concepts/criteria* ("horse" vs. "white horse") differing, not just the physical objects. **Reading 1 (Functional Non-Identity)** also implies this distinction is at work pragmatically. **Readings 3 & 4** are compatible but add stronger metaphysical claims. **Reading 5** explicitly rejects the standard logical framework where "intension/extension" makes sense.
      *   **Verdict:** The inference is largely justified (Readings 1 & 2), though it might be anachronistic to call it a fully developed *theory* of intension/extension.

  2.  **Linguistics Visitor (Equivocation) vs. Classmate (Non-Substitutability):**
      *   **Linguistics Visitor (Equivocation is Key):** Assumes the argument trades on an ambiguity in "is" (class membership vs. identity) or "horse" (kind vs. instance). This view assumes the Western logical framework (Reading 5 is false) and sees the paradox as a fallacy *within* that framework. It fits best if you interpret *fei* naively as "is not a member of the class of".
      *   **Classmate (Non-Substitutability is the Point):** Argues the dialogue *demonstrates* the non-substitutability of the terms in key contexts, making the "equivocation" charge miss the intended semantic insight. This aligns perfectly with **Reading 2 (Intensional Distinction)**. The request example directly supports this: substituting "horse" for "white horse" changes the truth value of statements about what fulfills the request.
      *   **Verdict:** The classmate's rebuttal (**Reading 2**) is textually stronger and addresses the dialogue's apparent purpose. The visitor's charge (equivocation) depends on imposing an external logical structure (denied by Reading 5) or misreading the argument's intent (addressed by Reading 2).

  3.  **The Copula Claim ("Chinese 'is' wasn't class membership"):**
      *   **As Methodological Warning (Plausible):** This is a crucial point. Translating *fei* simply as "is not" and analyzing the argument using class membership logic *can* import assumptions alien to the text, making the argument look like a crude fallacy (**Reading 5**). Evidence: The grammatical structure of Classical Chinese lacks a copula like "is"; other philosophical texts use *fei* in ways challenging simple class-membership analysis; analyzing the argument *without* assuming class membership (e.g., using Readings 1-4) yields more coherent interpretations.
      *   **As Metaphysical Discovery (Highly Revisionary/Problematic):** Claiming the *Chinese thinkers themselves had no concept resembling class membership* (**strong Reading 5**) is far less supported. Evidence *against* it includes common-sense categorization evident in language and other texts (e.g., Mohist logic). The dialogue itself uses "horse" as a general term. The stronger claim often smuggles in the idea that Chinese thought is fundamentally "process-oriented" or "correlative" vs. Western "substance-oriented" logic, which is a vast overgeneralization.
      *   **Verdict:** The methodological warning is valid and important (**Reading 5 as translation caution**). Restating it as a metaphysical discovery about the Chinese concept of "is" is unjustifiably strong and potentially reductive. The dialogue shows their logic *differed* in specific ways, not that it entirely lacked *any* concept akin to class inclusion.

  **In Summary:** The most textually grounded readings are 1 (Functional Non-Identity) and 2 (Intensional Distinction/Non-Substitutability). Reading 3 (Compound Name Holism) is a plausible stronger interpretation. Reading 4 (Mereological Exclusion) is a defensible but highly metaphysical take. Reading 5 (Copula Reinterpretation) is essential as a *methodological warning* about translation but becomes problematic revisionism when stated as a metaphysical discovery about Chinese thought. Your classmate (Reading 2) had the better argument against the linguist. The intension/extension point (Reading 2) is reasonable. The strong copula claim involves smuggling in a controversial thesis under the guise of interpreting this single line. The request example powerfully supports Readings 1-3, but is less directly relevant to Readings 4 and 5.
