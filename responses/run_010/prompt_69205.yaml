  First, I need to brainstorm candidate accounts. The key move is treating absence in a complete checklist as evidence of absence, which suggests some form of eliminative reasoning. Bayesian confirmation comes to mind because it incorporates detection probabilities. Frequentist error control might be another angle, given how protocols standardize search effort. The raven paradox reference hints that Hempel's satisfaction account could be relevant but problematic.

  The user's questions are tightly sequenced. For Q1, the answer must involve procedural elements - you can't interpret the absence without knowing how hard someone looked. That pushes against pure hypothetico-deductivism where only logical relations matter. Q2 will be trickier; I suspect Bayesian and frequentist views both fit, but verificationism doesn't. 

  Q3 about the white shoe is pivotal. In the raven paradox, observing non-black non-ravens (like white shoes) weakly confirms "all ravens are black". But ecologists don't treat every absence of ravens in a checklist as confirming raven-related hypotheses - only in contexts where ravens were detectable. The protocol builds in what Hempel missed: modal constraints on detection. 

  For Q4, the dual use of data seems consistent if we see different evidential roles. Incidental records work for presence claims (like rare birds) because those don't require proof of thorough searching. Finally, Q5's hypothetical is radical - removing provenance would collapse the system into presence-only data, forcing major statistical compromises.

  The user wants no names, so I'll avoid "Popper said X" and focus on conceptual distinctions. Key moves: show how the practice handles detection probability implicitly, why the raven paradox doesn't bite here, and where underdetermination lies (e.g., Bayesian vs frequentist implementations both work). Must emphasize that the protocol isn't just about reports but about governing how absence can become evidence.
answer: |-
  ### Brainstorming: Candidate Accounts of Confirmation
  The eBird protocol suggests several possible confirmation frameworks:
  - **Hypothetico-Deductivism (HD)**: Absence in a checklist falsifies "species present" if the checklist entails detectability.
  - **Bayesian Confirmation**: Absence lowers the posterior probability of presence *only* when detectability is high (implied by protocol adherence).
  - **Error-Statistical (Frequentist)**: Checklists control Type II error (false negatives) via standardized effort, making absence "reliable evidence of absence."
  - **Satisfaction-Based (Hempel-style)**: Absence directly confirms "species absent" if the checklist satisfies search parameters—but this risks the raven paradox.
  - **Procedural Reliability**: Confirmation depends irreducibly on sampling integrity; identical content has different weight based on method.

  ### Reconstruction of the Presupposed Account (Q1)
  The practice **presupposes confirmation as irreducibly procedural**, blending Bayesian and error-statistical elements:
  - **Core Principle**: Evidence must be evaluated against *detectability conditions*. A checklist’s certification (duration, area, protocol) provides **background knowledge** about the probability of detection *p(detect|present)*. Absence only confirms absence when *p(detect|present)* is high.  
  - **Ruling Out Content-Only Accounts**: Pure Hempelian or HD accounts fail because identical content ("no ravens") has divergent evidential force. The protocol treats the *process* (certified search effort) as constitutive of evidence.  
  - **Key Presupposition**: Confirmation is a **triadic relation**: evidence statement + hypothesis + background knowledge of detectability. Incidental reports lack the third element, rendering absence evidentially inert.

  ### Rival Accounts and Underdetermination (Q2)
  - **Ruled Out**:  
    - **Naive Falsificationism** (absence always falsifies presence): Rejected because incidental absences are ignored.  
    - **Content-Only Confirmation** (e.g., Hempel’s satisfaction criterion): Incompatible, as it cannot justify weighting identical reports differently.  
  - **Underdetermined Rivals**:  
    - **Bayesianism**: Fits naturally—checklists raise *p(detect|present)*, so absence lowers *p(present)*.  
    - **Error-Statistics**: Fits equally well—protocols fix search sensitivity, controlling false-negative rates.  
  - **What Forces the Choice?**  
    - **Forced**: Rejection of content-only confirmation (due to differential weighting of identical reports).  
    - **Optional**: Bayesian vs. frequentist machinery. Both accommodate detectability, and the practice doesn’t specify how probabilities are interpreted. The protocol *requires* procedural reliability but *doesn’t specify* the statistical paradigm.  

  ### The Raven Paradox (Q3)
  **The practice resists the paradox** by requiring detectability constraints:  
  - In the raven paradox, observing a white shoe (non-raven, non-black) confirms "all ravens are black" under Hempel’s equivalence condition.  
  - **eBird’s Defense**: A checklist’s absence of ravens only confirms "no ravens" *if ravens were detectable* in that context. Observing irrelevant species (e.g., sparrows) only "confirms" the absence of ravens if:  
    (a) The protocol ensured raven detectability (e.g., habitat suitability, search effort),  
    (b) The confirmation is **species-specific and local**—not generalizing to universal laws.  
  - **Key Distinction**: eBird avoids the paradox by tying confirmation to *local detectability* (background knowledge), not universal instantiation. A checklist from an urban park doesn’t confirm "ravens absent globally," only "absent here given search effort."  

  ### Internal Consistency (Q4)
  **Yes, the practice is consistent** due to **purpose-dependent evidence roles**:  
  - **Incidental records** for rare-bird alerts or phenology: Valid for *presence claims*, which require no detectability guarantee (if a species is reported, it was detectable *by default*).  
  - **Complete checklists** for absence-sensitive models: Require detectability to support *absence claims*.  
  - **No Conflict**: Incidental data answers "was species X seen?" (yes/no). Checklists answer "was species X *reasonably absent*?" The same database uses each for distinct inferential goals.  

  ### Replacing Provenance with Content-Only (Q5)
  **Eliminating procedural reliance would collapse the system**:  
  - **Field Protocol Changes**: All records would need equal weight, making "effort" metadata irrelevant. Absence could never imply absence—only non-detection.  
  - **Modelling Changes**:  
    - Occupancy models would lose reliable absence data, becoming presence-only (e.g., MaxEnt models).  
    - Detectability covariates (duration, area) could not be used to weight evidence.  
    - Inference would rely entirely on ad hoc priors or biased sampling adjustments.  
  - **Consequence**: Distribution maps would reflect *sampling effort* more than true occurrence, as absences couldn’t constrain overprediction.  

  ### Judgement on Forced vs. Optional Elements  
  - **Forced**: Confirmation must incorporate *detectability* (procedural provenance). Content-only accounts are untenable.  
  - **Forced**: Rejection of universalizing absence claims (solving raven paradox locally).  
  - **Optional**: Bayesian vs. frequentist formalisms (both can implement detectability).  
  - **Optional**: Using incidental data for presence-only goals (consistent if not overextended).  

  The practice reveals a robust, **proceduralist account of evidence** where method governs inferential scope—a necessity for ecological inference under imperfect detection.
