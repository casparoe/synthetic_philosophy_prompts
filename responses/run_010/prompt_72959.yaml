prompt: |-
  I direct patient safety at a mid-sized teaching hospital, and my team runs the investigation after every serious adverse event. The frameworks we are handed — fishbone diagrams, five whys, the standard event-analysis worksheets — never tell us what a cause is, so our reports come out reading like inventories of everything that was present in the room: the pump was programmed wrong, the handwritten order was illegible, the covering nurse had floated in from another unit, the patient was eighty-one. Families and plaintiffs want one thing from us, namely what made the difference — had it been otherwise, would she have lived. Our corrective-action plan wants something else: what we can change such that changing it reliably changes outcomes across cases like this one. Those two questions come apart constantly, and I have no principled way to say which finding in a report answers which.

  Please write a procedure that my analysts — nurses, a pharmacist, a quality engineer, none of them trained in philosophy or statistics — can run on a completed investigation inside the thirty days we are allotted. It should take the list of candidate factors the investigation has already surfaced and assign each to a small, fixed set of causal roles, with an explicit test for each role that can be applied by someone who has never encountered a counterfactual or an interventionist account of causation under those names. It should say what a report may claim, and what it must not claim, about a factor in each role. It should say what the procedure outputs when the event was overdetermined, so that no single failure made the difference and yet something plainly went wrong. It should tell us what to do with findings about things that did not happen — the double-check nobody performed, the alarm limit never set — since our reports are full of them and a but-for test seems to make every absence in the universe a cause. And it should mark plainly the steps where the analyst is exercising judgment rather than reading off a result, and the points where the live question is who bears a cost rather than what caused what.

  Ground the design in what the two traditions actually say about such cases — the counterfactual account associated with Lewis, and the interventionist or manipulability line descending from Woodward and Pearl — but keep the philosophy in the construction of the tests, not in the language of the report.

  Then run the procedure on three events. First, a fatal medication error in which three independent failures, any one of them, would have produced the death. Second, a post-operative death where the only robust difference-maker we can identify is the patient's age and comorbidity burden. Third, a wrong-site procedure where the sole factor that is stably associated with such events across our own incident data is weekend understaffing, which our board does not want named in a report. For the third, tell me what the procedure obliges me to write down, what it permits me to leave out, and whether it can do anything for me if the honest answer is one the institution will not accept.
reasoning: |-
  We are designing a procedure to classify causal factors from an adverse event investigation into specific roles. The procedure must be usable by professionals without training in philosophy or statistics and must fit within a 30-day timeline. The goal is to help the team distinguish between factors that made the difference in the specific event (counterfactual approach) and factors that, if changed, would reliably change outcomes in similar cases (interventionist approach). The procedure should also handle overdetermination, absences, and institutional constraints.

  The procedure will assign each candidate factor to one of four roles:
  1. **Difference-Maker (DM)**: A factor without which the outcome would not have occurred in this specific event (counterfactual necessity).
  2. **Stable Difference-Maker (SDM)**: A factor that, if intervened upon (changed or removed), would reliably prevent the outcome in similar cases (interventionist).
  3. **Contributing Factor (CF)**: A factor that increased the likelihood of the outcome but was not necessary (in the counterfactual sense) and is not necessarily a good target for intervention (may not be stable).
  4. **Background Condition (BC)**: A factor that was present but did not play a causal role in the event (it may be necessary in a broad sense but not specific to the event, or it may be non-modifiable).

  Additionally, we will handle absences (e.g., a missing double-check) by treating them as presences (the absence is the factor).

  The procedure steps:

  **Step 1: List Candidate Factors**
    - From the investigation report, list every candidate factor that has been identified (including absences as factors, e.g., "the absence of a double-check").

  **Step 2: Test for Difference-Maker (DM)**
    - For each factor F, ask: "If this factor had been different (i.e., absent or corrected) in the exact circumstances of this event, and everything else had been the same, would the outcome (the adverse event) definitely not have occurred?"
    - Note: This is a strict but-for test. The answer must be "yes" (the outcome would not have occurred) for DM.
    - If the event is overdetermined (multiple factors, each of which alone would have caused the outcome), then no single factor will pass this test. In that case, note that the event is overdetermined and skip this test for all factors (or mark none as DM). Instead, note that the event had multiple sufficient causes.

  **Step 3: Test for Stable Difference-Maker (SDM)**
    - For each factor F, ask: "If we could change (intervene on) this factor in general (across similar cases), would doing so reliably reduce the occurrence of similar adverse events in the future?"
    - This requires considering the factor in a broader context (not just this event) and whether there is evidence (from data or plausible reasoning) that an intervention on F would change the outcome in a stable way (across variations in other conditions).
    - Factors that are non-modifiable (like patient age) will typically not be SDM because we cannot change them. However, if the factor is modifiable and interventions on it are known to change outcomes, then it is SDM.

  **Step 4: Assign Roles**
    - If a factor passes the DM test (and the event is not overdetermined), assign it as DM.
    - If a factor passes the SDM test, assign it as SDM (regardless of DM status, because SDM is about future interventions).
    - If a factor does not pass either test but was part of the causal chain (i.e., it was involved but not necessary and not a good intervention target), assign it as CF.
    - If a factor was present but did not influence the outcome (e.g., the color of the walls) or is a fixed background condition (like gravity) that is always present and not modifiable in a relevant way, assign it as BC.

  **Step 5: Handle Overdetermination**
    - If the event is overdetermined (multiple independent causes, each sufficient), then:
        - No factor is a DM (because no single factor was necessary; the outcome would have occurred anyway due to another factor).
        - However, each factor that was part of a sufficient set is a CF (and possibly an SDM if modifiable and intervention would help in the future).

  **Step 6: Handle Absences**
    - Treat an absence (e.g., "the double-check was not performed") as a factor: "the absence of the double-check".
    - Apply the same tests: 
        - DM test: "Had the double-check been performed (i.e., the absence corrected), would the outcome not have occurred?" 
        - SDM test: "If we ensure double-checks are always performed (intervene on the absence), would that reliably prevent similar events?"
    - Note: An absence might be a DM in a specific event and/or an SDM for future events.

  **Step 7: Reporting and Corrective Actions**
    - In the report:
        - Clearly state the role of each factor.
        - For DMs: State that these factors were necessary in this specific event (if the event was not overdetermined). If overdetermined, state that multiple factors were independently sufficient and hence no single DM exists.
        - For SDMs: These are the factors that the corrective action plan should target because they are modifiable and interventions on them are expected to prevent future events.
        - For CFs: These factors contributed but were not necessary and may not be the best targets for intervention (though they might be addressed if feasible).
        - For BCs: These are not actionable and are noted for context only.
    - The report must not claim that a non-SDM factor is a good target for intervention (unless it is also a CF and there are other reasons to address it, but the procedure does not require intervention on non-SDMs).
    - The report must not claim that a factor was necessary (a DM) if it wasn't (especially in overdetermined cases).

  **Step 8: Judgment and Cost-Bearing**
    - Steps 2 and 3 require judgment. The analyst must:
        - In Step 2 (DM): Reason counterfactually about the specific event. This may require expert knowledge of the clinical scenario.
        - In Step 3 (SDM): Consider the broader evidence (e.g., incident data, literature) to judge whether an intervention would be reliably effective. This is where cost may come in: if an intervention is too expensive or institutionally unacceptable, it might not be proposed, but the causal fact (that it is an SDM) remains. The procedure does not hide the SDM because of cost, but the corrective action plan might choose not to act on it. The report must note the SDM even if the institution chooses not to intervene.

  **Applying the Procedure to Three Events**

  **Event 1: Fatal Medication Error (Overdetermined)**
    - Scenario: Three independent failures (each sufficient to cause death): 
        - F1: Pump programmed wrong
        - F2: Illegible handwritten order
        - F3: Covering nurse unfamiliar with the unit (and thus did not catch the error)
    - Step 1: Factors: F1, F2, F3, and possibly others (like patient age, but we'll focus on these).
    - Step 2 (DM test): For each factor, ask: if that factor had been corrected, would the death have been avoided? 
        - If we fix F1 (correct pump programming) but F2 and F3 are still present, the death might still occur (because of F2 or F3). Similarly for fixing only F2 or F3. Therefore, no single factor is DM (the event is overdetermined).
    - Step 3 (SDM test): 
        - If we fix F1 (by implementing barcode scanning for pump programming) across the hospital, would that prevent similar events? Yes, if it addresses a common cause. Similarly for F2 (by requiring electronic orders) and F3 (by better orientation for float nurses). So each is a candidate SDM.
    - Step 4: Assign roles: 
        - None are DM (due to overdetermination).
        - F1, F2, F3 are all SDM (if the interventions are reliable) and also CF (because they contributed).
    - Step 5: Overdetermined event: We note that there were multiple sufficient causes, so no single factor was necessary. But each is an SDM because fixing any one would prevent events that it causes.
    - Report: 
        - "The event was overdetermined: any one of the three failures (pump programming error, illegible order, or unfamiliar nurse) would have been sufficient to cause the death. Therefore, no single factor was necessary in this specific event. However, each of these factors is a stable difference-maker: interventions on any one (e.g., barcode scanning for pumps, electronic orders, better orientation) would reliably prevent a subset of similar events in the future."

  **Event 2: Post-Operative Death (Patient Factors)**
    - Scenario: The patient was 81 and had multiple comorbidities. The surgery and post-op care were performed according to standards, but the patient died due to complications that are more likely in such patients.
    - Factors: 
        - F1: Patient age (81)
        - F2: Comorbidity burden
        - Also, note: the care provided was appropriate (so no errors).
    - Step 1: Candidate factors: F1 and F2.
    - Step 2 (DM test): 
        - If the patient had been younger and without comorbidities, would the death have occurred? Possibly not. But note: we cannot change the patient's age or comorbidities. However, the test is counterfactual: if (in this event) the patient had been younger and healthier, would the outcome have been different? Yes, so F1 and F2 together (or perhaps individually) are DMs? But note: the care was appropriate, so without the comorbidities, the patient might have survived. However, we must be cautious: the counterfactual test for a factor is about changing that factor alone. 
            - If we change only age? (But age alone may not be the only factor.) Usually, we consider the comorbidity burden as a whole. Let's treat the patient's condition as one factor: "high-risk patient (due to age and comorbidities)".
        - Test: If the patient had been low-risk (young and healthy), would the death have been avoided? Yes. So it is a DM.
    - Step 3 (SDM test): 
        - Can we change the patient's age or comorbidity burden? No. So we cannot intervene on these factors. Therefore, they are not SDM.
        - However, note: we might intervene on how we care for high-risk patients (e.g., more monitoring). But that is a different factor. The factor in question is the patient's condition, which is non-modifiable.
    - Step 4: 
        - Assign: The patient's condition (F1 and F2 together) is DM (because it was necessary in the counterfactual sense for this event) and also CF (it contributed). But it is not SDM because we cannot change it.
        - Background: The care provided was appropriate and is not a factor. If there were no errors, then no other factors are present that are modifiable.
    - Report: 
        - "The patient's advanced age and comorbidity burden were difference-makers in this specific event: a younger, healthier patient would likely have survived. However, these factors are not modifiable and therefore not stable difference-makers for future interventions. The care provided met standards and was not a contributing factor. We note that for high-risk patients, the standard of care may not be sufficient to prevent such outcomes, and we may consider whether additional interventions (e.g., enhanced monitoring) could be developed and tested as stable difference-makers."

  **Event 3: Wrong-Site Procedure (Weekend Understaffing)**
    - Scenario: The wrong-site procedure occurred. The investigation found that the weekend understaffing was a factor. The board does not want this named.
    - Factors: 
        - F1: Weekend understaffing (leading to rushed pre-op checks).
        - F2: Absence of a time-out (or a rushed time-out) because of understaffing.
        - Also, note: the hospital's incident data show that wrong-site procedures are more common on weekends.
    - Step 1: Candidate factors: F1 (understaffing), F2 (absence of proper time-out). Note: F2 is an absence.
    - Step 2 (DM test): 
        - For F1: If the unit had been adequately staffed that weekend, would the wrong-site procedure have been avoided? Probably, because then the time-out would have been done properly. So F1 is a DM? But note: we have to be careful. The understaffing might have led to the absence of the time-out (F2). So we might have a chain: understaffing -> rushed time-out -> error.
        - Alternatively, we can test F2: If a proper time-out had been performed, would the error have been avoided? Yes. So F2 is a DM.
        - F1 might also be a DM: if staffing had been adequate, then the time-out would have been done, and the error avoided. So both are DMs? Actually, F1 is a cause of F2, which is a cause of the error. In such chains, both are causes. But note: F2 (the absence of the time-out) is more direct. However, the test for F1: without understaffing, would the outcome have occurred? We think not. So F1 is a DM. But note: it might be that even with understaffing, if the staff had been more careful, the time-out might have been done. But the counterfactual holds: if staffing had been adequate, the time-out would have been done (and the error avoided). So F1 passes the DM test. Similarly, F2 passes: without the absence of the time-out (i.e., if the time-out had been done), the error would have been avoided.
    - Step 3 (SDM test): 
        - F1 (understaffing): If we intervene to ensure adequate staffing on weekends, would that reliably prevent wrong-site procedures? The incident data suggest yes (more common on weekends), so yes, it is an SDM.
        - F2 (absence of time-out): If we ensure time-outs are always performed properly, would that prevent wrong-site procedures? Yes, and it is a known safety practice. So F2 is also an SDM.
    - Step 4: 
        - Assign: Both F1 and F2 are DM and SDM.
        - However, note: understaffing might be the root cause of the time-out failure. So both are important.
    - Reporting and Institutional Constraint:
        - The procedure requires that we note both F1 and F2 as SDM because they are modifiable and interventions would help. However, the board does not want F1 (weekend understaffing) named.
        - The procedure does not allow us to leave out a factor that is a DM or SDM because of institutional preferences. The analyst must record the role of each factor. But the report that goes to the board might be a separate document. The procedure is for the internal investigation record.
        - The procedure outputs: 
            - F1: Weekend understaffing: Role = DM and SDM.
            - F2: Absence of proper time-out: Role = DM and SDM.
        - The corrective action plan must target SDMs. Therefore, we must propose interventions on both understaffing and the time-out process. However, if the board refuses to address understaffing, then we can only address the time-out. The procedure still marks understaffing as an SDM, and the report should note that. The analyst must note that both are SDMs, but the institution may choose to act only on one.
        - What the procedure obliges: The internal investigation report must record the roles (including understaffing as DM and SDM). The public report (or the one to the board) might be written in a way that emphasizes the time-out (which is also an SDM) and understaffing might be omitted? But that would be dishonest. The procedure does not force disclosure to the family or plaintiff, but the internal report must be accurate for patient safety. The procedure cannot change the facts. If the institution will not accept the honest answer, the procedure still requires the analyst to note the factor and its role. The institution may then choose to ignore it, but the analyst has done their job.

    - What can be done if the institution won't accept the answer? 
        - The procedure outputs the truth. The corrective action plan must then decide whether to act on all SDMs. If the institution refuses to act on an SDM (due to cost or other reasons), that is a management decision. The procedure does not hide the SDM. It may be that the time-out intervention is a partial solution. The report can note that understaffing is an SDM but that the institution has chosen not to address it at this time. Alternatively, it might be framed as: "We will implement a robust time-out procedure to mitigate the risks of understaffing." But the root cause (understaffing) remains.

  **Summary of the Procedure**

  We have designed a procedure that:
  - Uses two tests (counterfactual for DM, interventionist for SDM) to assign roles.
  - Handles overdetermination by noting multiple sufficient causes and not assigning any single DM.
  - Treats absences as factors and applies the same tests.
  - Requires judgment at Steps 2 and 3.
  - Does not shy away from non-modifiable factors (like age) but marks them as non-SDM.
  - Requires reporting the truth about causal roles internally, even if the institution does not want to act on it.

  The procedure helps disentangle the two questions: what made the difference in this event (DM) and what we can change to prevent future events (SDM). It also provides clear reporting guidelines.
answer: |-
  Below is a causal role assignment procedure designed for your team. It uses a two-test system (counterfactual and interventionist) to assign each factor to one of four roles, with plain-language tests. The procedure explicitly handles overdetermination, absences, judgment points, and institutional constraints. Philosophy is embedded in the test construction but not the language.

  ---

  ### **Causal Role Assignment Procedure**  
  *For use on completed adverse event investigations*

  **Inputs**: List of candidate factors from the investigation (including "absent" factors like missing checks).  
  **Outputs**: Each factor assigned to one role (Difference-Maker, Stable Difference-Maker, Contributing Factor, or Background Condition), with clear reporting rules.  
  **Time**: 2–4 hours per case (within 30-day window).  
  **Roles Defined**:  
  1. **Difference-Maker (DM)**: Made the outcome unavoidable *in this specific event*.  
  2. **Stable Difference-Maker (SDM)**: Changing this *reliably prevents similar outcomes* in future cases.  
  3. **Contributing Factor (CF)**: Increased risk but wasn’t decisive alone; changing it *might* help but isn’t reliably preventive.  
  4. **Background Condition (BC)**: Present but didn’t meaningfully influence the outcome.  

  ---

  ### **Step-by-Step Instructions**  
  **Key Judgment Points**:  
  - Steps 2a and 2b require clinical/logical judgment (marked with ⚠️).  
  - Steps 3 and 5 involve cost/institutional considerations (marked with 💼).  

  #### **Step 1: List Factors**  
  - Gather all candidate factors from the investigation report.  
  - **For absent factors** (e.g., "no double-check"): Rephrase as a *presence* (e.g., "absence of double-check").  

  #### **Step 2: Assign Roles with Tests**  
  Apply these tests in order. Stop once a factor meets a test.  
  - **Test 2a: Difference-Maker (DM) Test**  
    ⚠️ *Ask: "If this factor had been different (e.g., removed, corrected, or present if absent) **in this exact event**, would the outcome **definitely not have happened**?"*  
    - **Yes** → Assign **DM**.  
    - **No** → Move to Test 2b.  
    - *Judgment note*: Be strict. If multiple factors pass, see Step 4 for overdetermination.  

  - **Test 2b: Stable Difference-Maker (SDM) Test**  
    ⚠️ *Ask: "If we **changed this factor** (e.g., fixed it, added it) **in future cases**, would it **reliably prevent similar outcomes** across different situations?"*  
    - **Yes** → Assign **SDM**.  
    - **No** → Move to Test 2c.  
    - *Judgment note*: Consider hospital data/literature. Focus on reliability ("usually works," not "might help").  

  - **Test 2c: Contributing Factor (CF) Test**  
    *Ask: "Did this factor **increase the chance** of the outcome but **fail both prior tests**?"*  
    - **Yes** → Assign **CF**.  
    - **No** → Assign **BC**.  

  #### **Step 3: Handle Overdetermination**  
  - **If multiple factors pass the DM test** (e.g., 3 failures, any one would cause death):  
    - Revise: **No factor is a DM**.  
    - Label the event: **"Overdetermined: Multiple independent factors could each have caused the outcome alone."**  
    - Re-test each factor in the SDM test (Step 2b).  

  #### **Step 4: Absent Factors**  
  - Treat as any other factor (e.g., "absent double-check" = "presence of no-double-check").  
  - Apply Tests 2a–2c normally.  
  - *Philosophy note*: Counterfactual tests avoid infinite causes (e.g., "absence" only matters if it was *expected* in context).  

  #### **Step 5: Reporting Rules**  
  - **DM**: Report as *"necessary for this outcome."* Never claim it is actionable.  
  - **SDM**: Report as *"changing this will reliably prevent future events."* Required for corrective actions.  
  - **CF**: Report as *"increased risk but not decisive."* Do not claim it is sufficient for prevention.  
  - **BC**: Report as *"present but not influential."* Omit from causal claims.  
  - 💼 **Institutional constraints**: If an SDM is politically sensitive (e.g., understaffing), it **must still be recorded internally** but may be omitted from **public reports** if legally defensible. State in internal notes: "SDM identified but excluded due to institutional policy."  

  ---

  ### **Procedure Applied to Your Cases**  
  *Factors tested in order; tests stop at first pass.*

  #### **Case 1: Fatal Medication Error (Overdetermined)**  
  - **Factors**:  
    1. Pump programmed wrong.  
    2. Illegible handwritten order.  
    3. Covering nurse floated from another unit.  
    4. Patient age (81).  

  - **Analysis**:  
    - **Test 2a (DM)**:  
      - If pump programmed correctly? Outcome still happens (illegible order or nurse error would cause death). → **No DM**.  
      - Same for factors 2 and 3.  
      - Patient age: If younger, death still occurs (errors were sufficient). → **No DM**.  
      - → **Event overdetermined**.  
    - **Test 2b (SDM)**:  
      - Pump programming: Fixing programming (e.g., barcode scanners) prevents future errors. → **SDM**.  
      - Illegible orders: Electronic orders prevent misreads. → **SDM**.  
      - Nurse floating: Standardized orientation prevents errors. → **SDM**.  
      - Patient age: Cannot change; no intervention. → **CF** (increased vulnerability).  
    - **Roles**:  
      - Pump error: **SDM**  
      - Illegible order: **SDM**  
      - Nurse floating: **SDM**  
      - Patient age: **CF**  

  - **Report Claims**:  
    > "Three independent failures (pump programming, handwritten order, nurse unfamiliarity) each sufficient to cause death. Correcting any one reliably prevents similar events. Patient age increased vulnerability but was not decisive."  

  #### **Case 2: Post-Operative Death (Age/Comorbidity)**  
  - **Factors**:  
    1. Patient age (81).  
    2. High comorbidity burden.  
    3. Standard post-op care.  

  - **Analysis**:  
    - **Test 2a (DM)**:  
      - If patient younger/healthier? Death likely avoided. → **DM** for age/comorbidity.  
    - **Test 2b (SDM)**:  
      - Age/comorbidity: Cannot intervene to change. → **Not SDM**.  
      - Standard care: Already optimal; changing it won’t help. → **BC**.  
    - **Roles**:  
      - Age/comorbidity: **DM** (but not SDM).  
      - Standard care: **BC**.  

  - **Report Claims**:  
    > "Patient age and comorbidities made death unavoidable in this case. No modifiable factors were identified for reliable prevention. Care met standards and did not contribute."  

  #### **Case 3: Wrong-Site Surgery (Weekend Understaffing)**  
  - **Factors**:  
    1. Weekend understaffing.  
    2. Absence of time-out.  
    3. Surgeon fatigue.  

  - **Analysis**:  
    - **Test 2a (DM)**:  
      - If adequate staffing? Time-out likely performed; error avoided. → **DM** for understaffing.  
      - If time-out performed? Error avoided. → **DM** for absent time-out.  
    - **Test 2b (SDM)**:  
      - Understaffing: Adding staff on weekends reduces errors (per hospital data). → **SDM**.  
      - Absent time-out: Mandating time-outs prevents wrong-site surgeries. → **SDM**.  
      - Surgeon fatigue: Not consistently linked to errors in data. → **CF**.  
    - **Roles**:  
      - Understaffing: **SDM** (and DM)  
      - Absent time-out: **SDM** (and DM)  
      - Surgeon fatigue: **CF**  

  - **Reporting Obligations**:  
    - **Must record internally**: Understaffing is an SDM/DM.  
    - **May omit from public report**: If board refuses, state: "Absence of time-out was decisive and correctable."  
    - **Institutional conflict**: Procedure still outputs understaffing as SDM. Internal report must note: "Weekend understaffing is a stable difference-maker but excluded from public report per policy." Corrective actions must still target time-outs (the other SDM).  

  ---

  ### **How Philosophy Informs the Tests**  
  - **Counterfactual (Lewis)**: Embedded in Test 2a ("if removed, would outcome change?"). Handles absences by requiring *contextual expectations* (e.g., double-checks are expected).  
  - **Interventionist (Woodward/Pearl)**: Embedded in Test 2b ("does intervention reliably change outcomes?"). Filters out non-actionable factors (e.g., age).  
  - **Overdetermination**: Explicitly addressed by voiding DM status when multiple sufficient causes exist.  
  - **Judgment/Cost**: Test 2b requires weighing evidence (💼 step flags cost-bearing decisions).  

  This procedure ensures your reports separate "what made the difference" (DM) from "what we can change" (SDM), while managing absences, overdetermination, and institutional pressures within your timeline. Analysts need no philosophy background—only clinical/logical judgment.
