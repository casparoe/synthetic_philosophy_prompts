prompt: |-
  I write literary fiction — four novels that all circle the same handful of people — and I keep what I call the bible: one document with every version of every character across every draft, plus the changes made for the audiobook, the French translator's substitutions, and the stage adaptation I sold the rights to. So I have something like eight Annas sitting in a spreadsheet. Draft-one Anna gets on the train. Draft-three Anna stays and it kills her. Stage Anna is forty years older. The translator renamed her. In my head they're all Anna, and I can tell you which of her traits are load-bearing — the ones where if you move them it stops being her at all — and which ones float free.

  My partner does philosophy and keeps trying to get me to care about an argument between two people about what it means for the same thing to be like this in some other possible situation. One of them says: when you ask what Anna would have done if she'd gotten on that train, you're really asking about some other, similar Anna in some other scenario, and how similar counts as similar enough depends on what you care about at the time. The other says no — it's literally Anna herself you're asking about, and pointing me at a lookalike is a dodge, because nobody asks a question about Anna and wants an answer about somebody who resembles her.

  Translate that whole disagreement into my vocabulary: drafts, retcons, the bible, load-bearing traits, adaptation, my authority to just decide things, and the fact that the published book outranks the drafts even though the drafts are where the same characters supposedly were. Be as faithful as you can and don't quietly smuggle your framework's assumptions in and hand them back to me labelled as translation.

  Then the residue report, which is the part I actually want. Which of their claims maps onto something I already do? Which ones you had to bend to make fit, and where exactly did the bending happen? And which ones can't be said at all in how a novelist talks about a character surviving a rewrite?

  Some places I suspect it'll tear — tell me if I'm wrong:

  - Their similarity thing doesn't chain. Draft-one Anna resembles draft-two Anna, draft-four resembles draft-five, but draft-one and draft-five share almost nothing, and still I say it's one continuous Anna. Does either view have room for that?
  - They apparently think every scenario is equally real from the inside, nobody's world is the true one. For me the printed book is the real Anna and the abandoned drafts are the maybe ones. Is their symmetry useless to me, or is my sense of one privileged version just bad metaphysics?
  - In draft six I swapped which twin does what and changed nothing else. Different situation, or the same one with the name tags moved? Do the two views answer that differently, and should I care?
  - I invent people. One of these guys seems to think scenarios are things we stipulate and the other thinks they're already out there. But I don't stipulate anything about a real person and I don't discover Anna either, I make her. Does either framework have a slot for that?

  Finally: when something doesn't survive the translation, tell me which way it cuts. Is craft-thinking missing a distinction, or is their fight thinner than it sounds? My own suspicion is that when I say the play's Anna "isn't really Anna" I'm doing both things at once — weighting traits by importance, like one of them, while insisting I'm talking about her and not a lookalike, like the other one. Either I'm confused, or the two of them are arguing about something smaller than they think. Which is it?
reasoning: |-
  Okay, let me unpack this fascinating problem. The user is a literary novelist with a complex character system ("the bible") who wants to map philosophical debates about identity to their creative process. They're specifically asking about two philosophers arguing over counterfactuals - whether "what Anna would do" refers to the actual Anna or a similar counterpart.

  Hmm, the core challenge is translating abstract modal metaphysics into the concrete realities of drafting fiction. The user's "bible" with its multiple Annas across versions creates a perfect testing ground for these theories. I need to carefully avoid imposing philosophical assumptions while honoring their framework of drafts, adaptations, and authorial authority.

  First, let's map the philosophers' positions:
  - Philosopher A (counterpart theorist) says counterfactuals involve similar entities in other scenarios
  - Philosopher B (haecceity theorist) insists it's literally the same entity

  In novel-writing terms:
  - Counterpart theory feels like comparing different draft Annas - similarity depends on which traits you preserve
  - Haecceity theory aligns with the author's insistence that all versions are "Anna", despite changes

  The user's practical concerns are revealing:
  - They maintain identity despite radical changes (draft1 vs draft5 Anna)
  - Privilege published text over drafts
  - Exercise authorial fiat (twin swap example)
  - Create rather than discover characters

  For the residue report:
  - Philosophical symmetry vs authorial hierarchy will clash
  - The "continuous identity through changes" resists both theories
  - Author as creator breaks metaphysics
  - Their suspicion about dual perspectives in adaptation is astute

  The deepest insight might be that authorship dissolves the debate - when the novelist says stage Anna "isn't really Anna", they're simultaneously invoking essential traits (counterpart-like) and insisting on the original identity (haecceity-like), but from a position of authority neither philosopher considers.
answer: |-
  Here's the translation into your craft vocabulary, followed by the residue report pinpointing where the fit succeeds, strains, or fails entirely. No smuggled metaphysics—grounded solely in your novelist's toolkit.

  ---

  ### Translation of the Philosophical Disagreement

  **Philosopher A (Counterpart Theorist):**  
  *Their Claim:* When you ask "What would Draft-Published Anna have done if she'd gotten on the train?" you're not asking about *her* in that scenario. You're asking about a *different version* of Anna—say, Draft-One Anna or a hypothetical Stage-Anna-in-a-train-scene. Whether this alternate version "counts" as Anna depends entirely on *which traits you prioritize* in your "bible" at that moment (e.g., her load-bearing traits vs. floating ones). It's a question of resemblance, not identity.  

  *Your Vocabulary:*  
  - You're comparing **drafts/adaptations**, not accessing a "core" Anna.  
  - "Similar enough" = matching the traits you deem **load-bearing** in that context (e.g., for thematic consistency in a sequel vs. historical fidelity in a prequel).  
  - Your **authority to decide** is key: you define what counts as a valid counterpart by weighting traits.  
  - The **published book** isn’t "truer"—it’s just the version you’ve sanctioned as the reference point *for now*.  

  **Philosopher B (Haecceity Theorist):**  
  *Their Claim:* When you ask that question, it’s *literally* about Draft-Published Anna herself. Pointing to Draft-One Anna (who got on the train) is cheating—it’s a *different entity*, like the French translator’s renamed character. The question demands an answer about *her* essence surviving a rewrite, not a lookalike.  

  *Your Vocabulary:*  
  - You’re asking how the **published Anna** (the "real" one) would react if *her timeline were retconned* to include the train.  
  - **Load-bearing traits are non-negotiable**: if altering them breaks her identity (e.g., making her a coward when her bravery is essential), it’s no longer Anna.  
  - **Abandoned drafts** are failed explorations of *her*—not parallel Annas.  
  - Your **authority** isn’t arbitrary; you’re uncovering what’s *true* to the character you created.  

  ---

  ### Residue Report: Where the Fit Succeeds, Bends, or Fails  

  #### 1. **What Maps Cleanly Onto Your Practice**  
  - **Load-Bearing vs. Floating Traits**: Both philosophers *partially* map here. Philosopher A treats them as adjustable criteria for similarity; Philosopher B treats load-bearing traits as essential to identity. **Your practice aligns with both, depending on context**: When revising, you act like A (tweaking floating traits freely). When defending a character’s core, you act like B (insisting some changes would "kill" her).  
  - **Your Authority**: Philosopher A’s view fits perfectly—you decide which traits matter and when. Philosopher B’s view *bends* to fit: you "uncover" Anna’s essence, but only because *you* constructed it.  

  #### 2. **Where the Translation Bends (and How)**  
  - **Draft Continuity vs. Radical Change**:  
    - *The Bend*: Philosopher A *can* handle draft drift (draft1→draft5) if you define similarity loosely (e.g., "shared origin in my intent"). Philosopher B *requires* a persistent essence—so if draft5 Anna has no load-bearing traits from draft1, B says it’s a *different character*.  
    - *Your Reality*: You still call it "Anna" because of **narrative continuity** (e.g., "draft5 evolved *from* draft1"). Neither theory accounts for this—it’s a *process-based identity*, not similarity or essence.  
  - **Privileged Versions (Published Book)**:  
    - *The Bend*: Philosopher A’s "all scenarios equal" symmetry **must be bent** to fit your hierarchy. We translate it as: "The published book is the *reference counterpart* for all questions." Philosopher B’s view fits better—published Anna is "real" because you sanctioned her.  
    - *Residue*: Your hierarchy isn’t metaphysics—it’s **practical necessity** (contracts, reader access, canonical facts). Their theories lack this.  

  #### 3. **What Can’t Be Said in Novelist Terms**  
  - **The Twin Swap (Draft Six)**:  
    - Philosopher A: "Same scenario with name tags moved? Depends on trait similarity—if the twins had identical floating traits, it’s irrelevant."  
    - Philosopher B: "You changed *who did it*—so the essence of each twin is altered. Different scenario."  
    - *Your Framework*: **Neither captures your reality**. You’d say: "I swapped labels, but the *action* wasn’t load-bearing for either twin’s identity. So it’s the same scenario with a cosmetic change." Their fight ignores *authorial intent about what matters*.  
  - **Creation vs. Discovery/Stipulation**:  
    - *The Unsayable*: Both philosophers assume Anna *exists* to be analyzed (in drafts or scenarios). But you **invent her ex nihilo**. Their frameworks have no slot for "This entity began as a choice, not a fact."  
    - *Residue*: When you say you "make Anna," it collapses their debate. You’re not tracking similarity or essence—you’re **exercising creative will**.  

  ---

  ### Where It Tears (Your Suspicions Confirmed)  
  1. **Draft Drift (Draft1 vs. Draft5 Anna)**:  
     - Philosopher A *barely* fits via "loose similarity." Philosopher B **tears**: if no essential traits persist, B denies it’s Anna. Your "continuous Anna" relies on **authorial narrative** ("she evolved"), which neither theory recognizes.  
  2. **Stage Anna "Not Really Anna"**:  
     - You’re **doing both things at once**, but *not* confused:  
       - You weigh traits (like A): "Stage Anna lacks 3 load-bearing traits, so she’s a counterpart."  
       - You invoke identity (like B): "I call her ‘not really Anna’ because she *betrays* the essence I defined."  
     - **The core they miss**: Your authority as creator. You’re not describing a metaphysical truth—you’re **making a creative judgment**.  

  ---

  ### Verdict: Their Fight Is Thinner Than They Think  
  - **What they miss**: Your practice reveals that **identity in fiction is *process-dependent***. "Anna" is:  
    - A chain of decisions (drafts),  
    - A set of sanctioned traits (bible),  
    - A hierarchy of versions (published > draft),  
    - And authorial fiat ("I de-canonize that draft").  
  - **The limits of their fight**: Their argument assumes a static entity to analyze. But in your work, Anna’s identity is:  
    - **Fluid** (across drafts),  
    - **Sanctioned** (by publication/adaptation contracts),  
    - **Intentional** (you decide what "counts").  
  - **Your suspicion is correct**: When you reject Stage Anna, you’re blending trait-weighting *and* essence-claiming—but *from a position of authority* their debate ignores. Their theories are sub-components of your creative toolkit, not competing truths.  

  **Final Cut**: Their frameworks are useful for *aspects* of your work (trait priority, essence claims), but your craft-thinking is **richer and more sovereign**. The residue isn’t a flaw in your approach—it’s evidence that their philosophical dispute is a narrow slice of a larger creative reality.
