  For structure: open with sensory decay (rusty staples, paper smell) to ground abstract ideas. Contrast "being contradicted by our dead" against institutional "tillage." Use his supervisor's rainfall records as emotional pivot—not heroic legacy but mundane accuracy that kept them honest. 

