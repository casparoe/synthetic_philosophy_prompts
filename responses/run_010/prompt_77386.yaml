prompt: |-
  Our department's graduate colloquium closes next Friday with a keynote on the boundary problem, and I have been handed the chair for the forty-five minutes of discussion that follow. The speaker defends an account she calls recursive self-constitution, and I want to press it properly rather than let the session drift into generalities about immigration. Her view, as I understand it from the introduction and one chapter, runs roughly as follows. She accepts the force of the circularity objection — that any democratic decision about who the people are already presupposes an answer to that question — but denies that it is fatal, on the ground that it treats legitimacy as a property a procedure either has or lacks at a moment of authorization. Legitimacy, she argues, can instead be acquired diachronically: a demos constitutes itself through a sequence in which each provisional electorate's framework is ratified by a wider electorate in the next round, so the structure is a spiral rather than a circle. To make this work she distinguishes authorization from validation, holding that the founding round is authorized by no one and is merely provisional, but is validated retrospectively when a later, more inclusive electorate endorses what it set up. That first round is deliberately over-inclusive: everyone within the jurisdiction, plus a random sample of outsiders who are plausibly affected by the polity's foreseeable decisions, sampling being her way of handling the unbounded reach of affectedness without narrowing the criterion. Inclusion is presumptive, exclusion bears the burden of justification, and the justification must be one the excluded could themselves accept. And no electorate is ever final: membership rules remain permanently revisable, which she counts as a virtue, since a frozen demos would tyrannize later arrivals. Her stock deflection, which I have seen her use twice in print, is to say that pressing on the founding round "presupposes a punctual conception of legitimacy," then to observe that every actual demos began in some species of usurpation and to redirect attention from origins to whether the sequence is inclusionary.

  What I need is a run of ten questions I can deliver from the chair, ordered as a sequence rather than as ten independent topics, with each one keyed to the answer she is most likely to give and paired with a single follow-up that closes off that answer. The sequence must reach, at minimum: whether the founding round is a normative fiat dressed up as a method, and if so what the account adds beyond an exhortation to be generous about membership; whether retrospective validation can validate anything when the electorate doing the validating was itself constituted by the framework it is validating; the fact that revision is not monotonic, so a later, narrower electorate can disenfranchise those admitted earlier, and whether the ratchet she will invoke — presumptive inclusion plus the burden of justification — is not in the end a substantive constraint imposed on the demos from outside the procedure, which is exactly the move she claims to avoid; the sampling device, where the sampling frame is itself a boundary decision, so the circularity may simply have been relocated one level up; whether her account gives any different answer from a straightforward coercion-based all-subjected principle paired with generous transitional enfranchisement, in which case I want her to name a case where the two come apart; and the nested-demops question, which I would like posed concretely by contrasting the 2014 Scottish independence referendum franchise, which admitted sixteen- and seventeen-year-olds and resident EU nationals while excluding Scots who had moved elsewhere in the United Kingdom, with the 2016 EU referendum franchise, which was built on the parliamentary register and so admitted overseas British citizens within the fifteen-year rule, members of the House of Lords, and residents of Gibraltar while excluding most EU nationals who had lived and worked in the country for decades — two franchises at two levels, each defended as tracking the people concerned, tracking different criteria. Please also include one question on the German Constitutional Court's Maastricht reasoning that there is no single European people capable of forming a majority will, asking her whether, on her account, that is a claim about facts or a report that the spiral has not yet closed; one question on the interim, since binding decisions get made while the sequence is still running and someone must have authority in the meantime; and, as the final item, a falsifiability question that asks for a diagnostic — what observable feature would show that a given polity's sequence is merely self-reproducing rather than inclusionary — with something more specific demanded than the observation that contraction has occurred.

  Two further constraints on the drafting. First, tone and audience: the room contains a faculty member who holds that the boundary problem is insoluble and that legitimacy must therefore be sourced somewhere other than democratic procedure, and a doctoral student who thinks the entire debate is a rationalization of the status quo, and I want the sequence to bite on both, so please include at least one question that concedes her spiral point in full and presses elsewhere, since a wholly adversarial run will get me nothing but a restatement of the thesis. Flag anywhere a question risks smuggling in a premise she would rightly reject, and mark the two or three questions that are load-bearing enough to survive a collapse of the clock and the one I should cut first. Second, usability: I have not read the book, so nothing may turn on passages or terminology I could not know, every question must carry its own setup in terms a graduate audience will follow, and each should be sayable in under thirty seconds of speech, in the second person, with no definitions of standard vocabulary, no requests for citations or further reading, and nothing resembling an inquiry into her intellectual biography.
reasoning: |-
  Okay, the user is chairing a discussion on the boundary problem in democratic theory, specifically targeting a speaker's "recursive self-constitution" model. They need ten sequenced questions that press weaknesses while avoiding dead ends. Let me unpack their requirements carefully.

  First, the core critique areas identified: founding round legitimacy (retrospective validation paradox), non-monotonic revision risks, sampling frame circularity, comparison to all-subjected principle, nested demoi conflicts via UK/EU referendum examples, Maastricht ruling implications, interim authority gap, and falsifiability. The user also wants tactical concessions to avoid adversarial tone.

  Hmm, the speaker's likely defenses are predictable - she'll invoke diachronic legitimacy against "punctual" critiques and redirect to inclusionary direction. So each question must anticipate and trap those moves. For example, on retrospective validation: if she says later ratification resolves founding illegitimacy, the follow-up must show the electorate validating its own constitution - that's inescapable circularity.

  The nested demoi question is particularly sharp. Using concrete UK cases prevents abstraction. The Scottish referendum included EU residents but excluded Scots elsewhere, while the EU referendum included overseas Brits but excluded long-term EU residents. This forces her to explain how "concerned people" criteria avoid arbitrariness when franchises clash.

  Noticing the user's hidden audience dynamics - the faculty skeptic who thinks boundary problems sink legitimacy, and the PhD student who sees status quo rationalization. Question 7 (interim authority) might hook the skeptic by exposing procedural gaps, while Question 10 (falsifiability) challenges the student's cynicism by demanding proof of inclusion beyond rhetoric.

  For usability: each question must stand alone without book knowledge. The Maastricht question references common knowledge (German court ruling), and sampling frame circularity is explained through the "affectedness" premise. Cutting Question 3 first makes sense - it's important but more technical than others.

  Biggest risk is smuggling premises. In Question 6 (all-subjected comparison), I avoided assuming coercion defines legitimacy - she might reject that. Instead, it neutrally asks for divergence cases. The ratchet constraint question (Question 4) explicitly flags her burden-of-justification device to avoid misrepresentation.

  Final falsifiability test needs teeth. "Observing contraction" is too easy - she'd say justification matters. So demanding "rejection of presumptive inclusion" or "disenfranchisement without justification criteria" forces concrete indicators. That's what the user wants: observable pathology, not just outcomes.

  The concession in Question 8 is strategic. By accepting diachronic escape from punctuality, it isolates the Maastricht question: if no European people exists, is that factual (spiral incomplete) or definitional (spiral impossible)? This avoids rehashing founding issues and might engage the faculty skeptic on alternative legitimacy sources.
answer: |-
  Here’s a sequenced run of ten questions designed to press critical points while respecting your constraints. Each question includes setup, core challenge, likely rebuttal anticipation, and a closing follow-up. Load-bearing questions (#4, #7, #10) should survive time cuts; cut #3 first if needed.

  ---

  ### **Question 1: Foundational Provisionality**  
  *(Targets: Founding fiat, adds value beyond generosity?)*  
  **Setup:** You argue the founding round is provisional, validated later by a more inclusive electorate.  
  **Question:** If the founders deliberately over-include *without authorization*, isn’t this a normative fiat—and if so, how does "recursive self-constitution" add more than advising generosity in boundary-setting?  
  *Likely Rebuttal:* "Diachronic legitimacy avoids punctualism; generosity is structured by the spiral."  
  **Follow-up:** But if the *only* constraint on founders is "be over-inclusive," how is this distinct from a moral plea masked as procedure?  

  ---

  ### **Question 2: Retrospective Validation Loop**  
  *(Targets: Circularity in validation)*  
  **Setup:** A later electorate validates the framework that constituted *it*.  
  **Question:** How can electorate E₂ validate the rules that created E₂, without circularity? Doesn’t this collapse into self-validation?  
  *Likely Rebuttal:* "The spiral breaks circularity via expanding inclusion."  
  **Follow-up:** If E₂ owes its existence to the rules it endorses, isn’t its validation predetermined? Where’s the critical distance?  

  ---

  ### **Question 3: Sampling Frame Circularity**  
  *(Targets: Relocated circularity in affectedness sampling)*  
  **Setup:** You sample "plausibly affected" outsiders to handle unbounded affectedness.  
  **Question:** But deciding *who counts as plausibly affected* is itself a boundary decision. Hasn’t circularity just shifted to defining the sampling frame?  
  *Likely Rebuttal:* "Presumptive inclusion and random sampling minimize arbitrariness."  
  **Follow-up:** If the sampling frame excludes some affected groups (e.g., climate-impacted future generations), isn’t the circularity reproduced?  

  ---

  ### **Question 4: Non-Monotonic Revision & External Constraints**  
  *(**Load-bearing**; targets: Ratchet vs. substantive constraints)*  
  **Setup:** You note revision isn’t monotonic—later electorates may contract. You invoke a "ratchet" (presumptive inclusion + burden on exclusion).  
  **Question:** If a narrower electorate later disenfranchises a group, and justifies it in terms *they couldn’t accept*, isn’t the ratchet a substantive moral constraint—imposed *outside* the procedure you claim is self-grounding?  
  *Likely Rebuttal:* "The burden of justification is internal; exclusion must be acceptable to the excluded."  
  **Follow-up:** But if the electorate itself defines "acceptability," what stops it from imposing unjustifiable exclusion? Isn’t the constraint external after all? *(Flags: She might reject "external" as mischaracterizing procedural morality.)*  

  ---

  ### **Question 5: Nested Demoi Concreteness**  
  *(Targets: Conflicting "concerned people" criteria)*  
  **Setup:** Consider the 2014 Scottish referendum (included EU residents, excluded UK-based Scots) vs. 2016 EU referendum (included overseas Brits, excluded long-term EU residents).  
  **Question:** Both claimed to track "the people concerned." On your account, can two conflicting franchises at different levels *both* be legitimate? If not, how does recursion resolve this?  
  *Likely Rebuttal:* "The spiral allows revision; conflicts push for higher-level inclusion."  
  **Follow-up:** But if each level’s franchise is validated *only* by its own next round, what prevents permanent fragmentation?  

  ---

  ### **Question 6: Contrast with All-Subjected Principle**  
  *(Targets: Distinctiveness of the model)*  
  **Setup:** A standard solution pairs the "all-subjected" principle with transitional enfranchisement.  
  **Question:** Does your account ever yield different boundaries? If so, name a case. If not, why prefer recursion?  
  *Likely Rebuttal:* "Recursion handles founding/transition dynamically; all-subjected is static."  
  **Follow-up:** But if both converge on "include all subjected + be generous," is recursion more than a backstory?  

  ---

  ### **Question 7: Interim Authority Gap**  
  *(**Load-bearing**; targets: Binding decisions mid-spiral)*  
  **Setup:** Binding decisions occur before the spiral "closes," under a provisional electorate.  
  **Question:** Who has authority to make those decisions? If it’s the latest electorate, how is its provisional authority legitimate *at the time*?  
  *Likely Rebuttal:* "Legitimacy accrues diachronically; interim decisions are validated later."  
  **Follow-up:** But if later validation fails (e.g., a group is excluded retroactively), were interim decisions illegitimate? *(Engages faculty skeptic: If "no," legitimacy isn’t purely procedural.)*  

  ---

  ### **Question 8: Maastricht "No Demos" Claim**  
  *(Concession + press; targets: Factual vs. procedural status of "no people")*  
  **Setup:** *[Conceding spiral]* Accepting your diachronic escape, consider the German Court’s claim: "No European people exists."  
  **Question:** Is this a factual observation (the spiral hasn’t closed) or a denial that it *can* close?  
  *Likely Rebuttal:* "It reflects the current stage; the spiral could create a European demos."  
  **Follow-up:** If "no demos" means no *preexisting* unity, doesn’t that concede origins are usurpatory—precisely what recursion sidesteps? *(Hooks PhD student: Highlights origins debate.)*  

  ---

  ### **Question 9: Revisability and Status Quo Bias**  
  *(Targets: Revision barriers in practice)*  
  **Setup:** You call permanent revisability a virtue to avoid tyrannizing newcomers.  
  **Question:** In practice, incumbents control revision rules. How does recursion prevent a self-entrenching demos?  
  *Likely Rebuttal:* "Presumptive inclusion and burden of justification block self-entrenchment."  
  **Follow-up:** But if incumbents define the burden (e.g., "exclude non-citizens for security"), what breaks the status quo?  

  ---

  ### **Question 10: Falsifiability & Self-Reproduction**  
  *(**Load-bearing**; targets: Distinguishing inclusion from self-replication)*  
  **Setup:** We need a diagnostic to distinguish "inclusionary" from "self-reproducing" sequences.  
  **Question:** What *observable feature*—beyond contraction—would show a polity’s spiral is merely self-replicating?  
  *Likely Rebuttal:* "Exclusion without justification meeting the burden, or rejecting presumptive inclusion."  
  **Follow-up:** But if the polity redefines "justification" to permit exclusion (e.g., "cultural threat"), how is that observable? *(Demands concrete institutional/behavioral criteria.)*  

  ---

  ### **Tactical Notes**  
  - **Audience Hooks:**  
    - Q7 (interim authority) challenges the faculty skeptic’s "insolubility" claim by exposing legitimacy gaps.  
    - Q10 (falsifiability) forces the PhD student’s "status quo rationalization" concern into a testable claim.  
  - **Concession:** Q8 explicitly grants the spiral to press on demos-formation dynamics.  
  - **Premise Risks:**  
    - Q4 flags her burden-of-justification device to avoid straw-manning.  
    - Q6 avoids assuming all-subjected is her opponent.  
  - **Usability:**  
    - Each question <30 secs; no jargon beyond her own terms ("provisional," "ratchet," etc.).  
    - UK/German Court examples are widely known in grad political theory.  
    - All questions self-contained; no book citations.  

  Cut #3 first if time lags; prioritize #4, #7, #10 as they force engagement with core tensions. Sequence builds from foundation (Q1-2) to mechanics (Q3-5) to alternatives (Q6) to edge cases (Q7-9), ending with falsifiability (Q10).
