  ### Scenario: The Silent Duet  
  Alice and Ben are amateur musicians who regularly practice in adjacent soundproof studios. Unbeknownst to each other, both decide to perform a duet of a piece they know well at 3 PM, expecting the other to join. Each enters their studio at 3 PM, puts on headphones connected to a shared audio system, and hears the other begin playing. They both know the piece requires both instruments (Alice on violin, Ben on piano) to be complete, and each intends to perform the duet *together*. They play flawlessly in sync, responding to each other’s tempo and dynamics through the headphones. However, neither signals their awareness (e.g., no verbal greeting, no visual contact due to soundproofing), and neither sees the other enter the studio. After finishing, they leave separately without interacting. The performance succeeds because each correctly assumes the other is committed to the joint activity, but neither has confirmation that the other knows *they* are aware.  

  ---

  ### Analysis Against Specifications  
  **Joint Activity Requirements (Pre-theoretic):**  
  - **Task requires both**: The duet cannot be performed alone; both instruments are essential.  
  - **Sub-plans mesh**: Alice adjusts her violin tempo to Ben’s piano dynamics, and Ben matches his phrasing to Alice’s lead; their actions are interdependent.  
  - **Success/failure together**: The duet succeeds only if both play correctly; if one fails, the music collapses.  
  - **No deception/coercion**: Both act voluntarily with full first-order knowledge. Alice knows Ben intends to play the duet with her (she hears him and knows the piece), and vice versa. Each knows the other takes it as joint (they both trained for duets).  

  **Failed Iteration Mechanism**:  
  - **Higher-order knowledge gap**: Alice hears Ben playing, so she knows he is participating and intends the joint activity. But because there is no exchange (no wave, no spoken agreement), she doesn’t know if Ben knows *she* is aware of *his* awareness. The soundproof studios and lack of signals prevent any confirmation beyond first-order knowledge. This is an ordinary feature of isolated practice spaces—no stipulation needed.  

  ---

  ### Account-by-Account Breakdown  
  **Bratman’s Account** (Reductive: interlocking individual plans + common knowledge):  
  - **Satisfied**:  
    - Each intends "that we perform the duet" (condition 1).  
    - Sub-plans mesh: Each adjusts to the other’s playing (mutual responsiveness; condition 2).  
  - **Failed**:  
    - **Common knowledge of the structure** (condition 3): Alice and Ben lack common knowledge that each has the intention and awareness of the other’s intention. Each knows the other is playing, but neither knows the other knows *they* know (iteration fails at the second order). Bratman’s account requires this infinite regress for shared intention; here, it is unmet.  
  - **Verdict**: Not shared agency. The missing higher-order knowledge prevents the interlocking intentions from forming a shared intention.  

  **Gilbert’s Account** (Plural subject via joint commitment + common knowledge of expressions):  
  - **Satisfied**:  
    - Both intend to contribute to the duet and are aware of the other’s contribution.  
  - **Failed**:  
    - **Joint commitment requires open expressions of readiness in common knowledge**: Neither expresses readiness (e.g., no verbal agreement, nod, or gesture) to be jointly committed. The act of playing is not an "expression" in Gilbert’s sense—it must be a clear signal of commitment to form a "plural subject." Without this, there is no joint commitment.  
    - **Common knowledge of expressions**: Even if playing counted as an expression (which Gilbert denies), there is no common knowledge of it because the headphones and studios block mutual confirmation.  
  - **Verdict**: Not shared agency. Without joint commitment, there is no plural subject.  

  **Searle’s Account** (Primitive we-intention, no mutual belief required):  
  - **Satisfied**:  
    - Each has a we-intention ("We are performing the duet") as a primitive mental state. This intention exists independently of mutual beliefs about the other’s intentions.  
    - The we-intention causes coordinated action (playing responsively).  
  - **No failure**: Searle’s account does not require mutual knowledge or expressions; the we-intention alone suffices for collective intentionality.  
  - **Verdict**: Shared agency. The we-intention is present and drives joint action.  

  ---

  ### Intuitive Verdict and Risk of Bias  
  - **Intuitive verdict**: Most people would describe this as shared agency. The musicians are cooperating in real-time, achieving a unified outcome that depends on mutual awareness and responsiveness. However, the lack of interaction feels slightly strained—some might call it "coincidental coordination" rather than true collaboration.  
  - **Risk of loading in Searle’s favor**: The case is designed to challenge Bratman and Gilbert by omitting common knowledge, but it does not artificially weaken their accounts. The gap arises naturally from environmental isolation (soundproofing, headphones). Searle benefits because his minimalism prioritizes individual we-intentions, but the scenario’s realism prevents it from being a straw man.  

  ---

  ### Crucial Feature and Its Removal  
  - **Feature doing the work**: The absence of any communicative exchange (e.g., a wave or "ready?" before playing) that could establish higher-order mutual knowledge.  
  - **Removal**: If Alice and Ben make eye contact through a window and nod before playing, common knowledge is established (the nod confirms mutual awareness). Bratman and Gilbert now count it as shared agency; Searle still does. The case becomes uncontroversial shared agency accepted by all three. Without the feature, it ceases to be joint for Bratman/Gilbert but remains so for Searle.  

  ---

  ### Attacks and Counterarguments  
  1. **Bratmanian attack**: "Common knowledge is not essential to Bratman; mutual belief suffices."  
     - **Response**: Bratman explicitly requires common knowledge (e.g., in *Shared Agency*). Mutual belief alone (e.g., Alice believes Ben knows, but no further iteration) is contested as insufficient. Here, even mutual belief fails—Alice doesn’t believe Ben knows *she* knows.  
     - **Does it succeed?** No. Bratman’s common knowledge condition is well-established; weakening it risks conflating shared intention with parallel action.  

  2. **Gilbertian attack**: "What’s missing isn’t knowledge but mutual responsiveness; they aren’t truly adapting."  
     - **Response**: Mutual responsiveness is satisfied—they adjust tempo/dynamics based on auditory feedback. The attack confuses the issue; Gilbert’s joint commitment hinges on expressions, not responsiveness.  
     - **Does it succeed?** No. Gilbert’s requirement for expressions is separate from responsiveness; the attack misrepresents her account.  

  3. **Stronger Gilbertian attack**: "Playing *is* an expression of readiness."  
     - **Response (contested)**: Gilbert insists expressions must be overtly communicative (e.g., verbal agreement). Merely acting alongside someone isn’t sufficient—this is debated, but Gilbert’s texts (e.g., *On Social Facts*) emphasize "open" expressions.  
     - **Does it succeed?** Unlikely. Without directed communication, it’s hard to see playing as expressing commitment *to the other person*.  

  **Which attack is strongest?** The Bratmanian attack on common knowledge is the most credible but ultimately fails because Bratman’s insistence on common knowledge is unambiguous. The case holds.  

  ---

  ### Tuomela’s We-Mode/I-Mode  
  *Confidence level: Moderate, but placement contested*. Tuomela would likely classify this as I-mode (individual-based) cooperation, not we-mode. Each acts with a private we-intention, but without mutual belief about the shared goal, it lacks the collective commitment of we-mode. We-mode requires "collective acceptance" via mutual awareness, which is incomplete here.  

  ---

  ### Summary for Seminar  
  This case isolates the mutual knowledge requirement: Searle’s we-intention survives without it, while Bratman and Gilbert fail. The disagreement is substantive—about whether shared agency demands intersubjective validation (Bratman/Gilbert) or resides in individual minds (Searle). Students must grapple with whether "acting together" is more than the sum of coordinated parts.
