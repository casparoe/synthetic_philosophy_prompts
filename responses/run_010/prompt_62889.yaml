prompt: |-
  I am reading a popular book on the philosophy of mathematics that devotes several pages to intuitionism, and before I draw on one passage for a short piece I am writing I would like an accuracy audit of it. The passage reads:

  "Brouwer's intuitionism begins from the claim that mathematics is an activity of mental construction, so a statement is true only if a proof of it has actually been carried out. It follows that intuitionists reject the law of excluded middle: for them 'P or not-P' is simply false in general, and neither disjunct may be asserted until someone decides the question. This is why Brouwer was able to show, by means of a real number defined out of an unresolved arithmetical problem, that one cannot even say of some particular number whether it is zero or nonzero. Intuitionists also refuse proof by contradiction, since deriving an absurdity from not-P establishes nothing whatever about P. On this view an unproved statement is neither true nor false but something in between, which is why intuitionistic logic is best understood as a species of many-valued logic. The costs are severe: Brouwer had to abandon much of classical analysis, and because truth now depends on what human minds are able to prove, mathematics becomes a private and subjective affair. It is no surprise that intuitionism has won almost no adherents among working mathematicians."

  On a first reading this struck me as plausible, and I suspect it is close to the standard account, but two things will not sit still. I have also come across the remark that intuitionistic logic proves something involving the double negation of excluded middle, which seems hard to reconcile with the claim that the law is false for intuitionists; and I have seen Bishop's constructive mathematics described as neutral between classical and intuitionistic interpretations, which does not fit the subjectivism of the closing sentences.

  Could you take the passage claim by claim and say which sentences a specialist in constructive mathematics would accept as they stand, which are fair though compressed, and which are misstatements — in particular whether the passage's talk of excluded middle being false is really the same thing as the intuitionist's refusal to assert it, and what intuitionistic logic does and does not license by way of reductio? Where you judge a sentence wrong, please tell me what belongs in its place, since I do not want to inherit the error. Then assess the passage's argument as a whole: does the conclusion that intuitionism makes mathematics subjective, and has consequently failed to attract mathematicians, follow from what is true in it, or does it depend on the parts that are not true?

  Finally, be explicit about the standing of your corrections. I want to know which of your points are settled matters — what intuitionistic logic in fact proves, what Brouwer and Bishop actually maintained — and which remain genuinely disputed among people who work in this area, for instance over how far Brouwer's idealism commits intuitionism to psychologism, or over what the correct account of intuitionistic truth is. Please do not let a contested position be presented to me as the consensus.
reasoning: |-
  Okay, let me approach this query methodically. The user presents a passage on intuitionism from a philosophy book and requests an accuracy audit, highlighting specific concerns about excluded middle and subjectivity. 

  First, I need to verify each claim in the passage against standard technical understanding of intuitionism. The description of mathematics as mental construction is fundamentally sound - Brouwer did emphasize this. But the assertion about excluded middle being "false" is problematic. From what I know, intuitionists reject its universal validity but don't declare it false; they simply don't accept unproven instances. 

  The user's unease about double negation is perceptive. I recall that intuitionistic logic does prove ¬¬(P∨¬P), which creates tension with calling LEM "false". This needs careful distinction between rejection and negation. 

  Regarding proof by contradiction, the passage oversimplifies. Intuitionists do accept certain forms like ¬¬P→P for negative statements, but not for positive existential claims. The "absurdity from not-P establishes nothing" phrasing is too sweeping.

  The many-valued logic characterization is misleading. While algebraic semantics exist, the intended interpretation is proof-conditional, not truth-functional. Bishop's constructivism further complicates this - his program was intentionally non-subjective yet intuitionistic-compatible. 

  The subjectivity charge deserves nuance. While Brouwer had idealist elements, modern constructivists like Bishop explicitly reject psychologism. The lack of adoption among mathematicians has multiple causes beyond subjectivity. 

  For disputed matters: 
  - Brouwer's idealism vs modern anti-psychologism is indeed contested 
  - "Truth as provability" interpretations vary (Brouwer vs Dummett vs Martin-Löf)
  - The exact relationship between intuitionism and Bishop constructivism remains discussed 

  I'll structure corrections to first address clear inaccuracies (LEM status, many-valued logic), then contextualize debatable claims (subjectivity), finally separating settled facts from ongoing debates. The conclusion about unpopularity requires examining both valid and invalid premises in the passage.
answer: |-
  Below is a detailed accuracy audit of the passage, structured claim-by-claim. Corrections distinguish **settled technical/logical matters** (e.g., what intuitionistic logic proves) from **interpretive or philosophical disputes** (e.g., subjectivity, psychologism). Sources include Brouwer's writings, Heyting's formalization, Bishop's constructivism, and contemporary scholarship (e.g., Dummett, van Atten, Bridges).

  ---

  ### **Claim-by-Claim Analysis**

  1.  **"Brouwer's intuitionism begins from the claim that mathematics is an activity of mental construction, so a statement is true only if a proof of it has actually been carried out."**
      *   **Assessment: Fair though compressed.**  
      *   **Correction:** Brouwer explicitly grounded mathematics in the "primordial intuition" of time, making it a *mental* activity. "Truth = proof" is the standard intuitionistic position. However, "actually carried out" could imply temporal psychologism (see #8 below), which is disputed.  
      *   **Standing:** Settled as core to Brouwer's view. Disputes exist over whether "proof" is private (Brouwer) or shareable (Heyting, later constructivists).

  2.  **"It follows that intuitionists reject the law of excluded middle: for them 'P or not-P' is simply false in general..."**
      *   **Assessment: Misstatement.**  
      *   **Correction:** Intuitionists *reject the universal validity* of LEM (¬∀P(P ∨ ¬P)). They do **not** claim it is "simply false in general" (∀P¬(P ∨ ¬P)), which is absurd. LEM is *not asserted* for arbitrary P, but it *holds* for decidable P (e.g., "n is prime").  
      *   **Why?** Asserting LEM requires a proof of P or a proof of ¬P. For undecided P, neither proof exists. Calling LEM "false" misrepresents the rejection: intuitionists deny its *justification*, not its truth-value in a classical sense.  
      *   **Standing:** Settled logic. Brouwer, Heyting, and all intuitionists reject LEM's general validity; none claim it's universally false.

  3.  **"...and neither disjunct may be asserted until someone decides the question."**
      *   **Assessment: Correct, but incomplete.**  
      *   **Correction:** This is accurate: neither P nor ¬P may be asserted without proof. However, it omits that intuitionists *can* assert ¬¬(P ∨ ¬P) (see below).  
      *   **Standing:** Settled.

  4.  **"This is why Brouwer was able to show, by means of a real number defined out of an unresolved arithmetical problem, that one cannot even say of some particular number whether it is zero or nonzero."**
      *   **Assessment: Fair example, but phrasing is slightly off.**  
      *   **Correction:** Brouwer used "creating subject" sequences (e.g., r = Σ aₙ/2ⁿ, where aₙ=0 if the nth digit of π’s decimal expansion is 0-8, else aₙ=1 *when the creating subject first proves Goldbach’s conjecture or its negation*). For such r, we *cannot assert* (r=0 ∨ r≠0) *until* Goldbach is decided. "Cannot say" means "cannot assert," not that it lacks a truth-value.  
      *   **Standing:** Settled example. Brouwer used such counterexamples.

  5.  **"Intuitionists also refuse proof by contradiction, since deriving an absurdity from not-P establishes nothing whatever about P."**
      *   **Assessment: Misstatement of scope.**  
      *   **Correction:** Intuitionists *reject* ¬¬P → P (double negation elimination) *for arbitrary P*. However:  
          *   They *accept* deriving ¬P from ¬¬¬P (since ¬¬¬P → ¬P is intuitionistically valid).
          *   They *accept* proof by contradiction *to prove negative statements*: deriving absurdity from P *does* prove ¬P (valid as ¬P := P → ⊥).
      *   **Key:** They reject using contradiction to prove *positive* existential claims or disjunctions ("P" in "¬¬P → P") without explicit construction.  
      *   **Standing:** Settled logic. The claim "establishes nothing whatever about P" is incorrect; it establishes ¬¬P, but not P.

  6.  **"On this view an unproved statement is neither true nor false but something in between..."**
      *   **Assessment: Misleading.**  
      *   **Correction:** Intuitionists reject the *principle of bivalence* (every proposition is true or false). An unproved P lacks a *truth-value* only if truth is defined classically. Intuitionistically, "P is true" *means* "P is proved"; "P is false" *means* "¬P is proved" (i.e., a construction shows P leads to absurdity). An unproved P isn't "in between"; it *has no truth-value* because the conditions for truth/falsity aren't met.  
      *   **Standing:** Settled. Rejection of bivalence is core. "Something in between" suggests many-valued logic, which is not the intended interpretation.

  7.  **"...which is why intuitionistic logic is best understood as a species of many-valued logic."**
      *   **Assessment: Misstatement.**  
      *   **Correction:** **No.** While algebraic semantics exist (e.g., Heyting algebras, topological models), the *intended meaning* (Brouwer-Heyting-Kolmogorov interpretation) is proof-conditional: logical connectives are defined by what counts as a proof. It is fundamentally a logic of *constructions/provability*, not truth-values. Many-valued logics assign intermediate truth-values; intuitionism assigns *no* truth-value to unproved statements.  
      *   **Standing:** Settled. Prominent constructivists (e.g., Bishop, Martin-Löf) reject the many-valued characterization. It's a common pedagogical error.

  8.  **"The costs are severe: Brouwer had to abandon much of classical analysis..."**
      *   **Assessment: Correct.**  
      *   **Correction:** Brouwer rebuilt parts of analysis intuitionistically, but classical results relying on LEM or non-constructive existence (e.g., least upper bound principle for arbitrary sets, Bolzano-Weierstrass for arbitrary sequences) are rejected or require significant reformulation.  
      *   **Standing:** Settled fact.

  9.  **"...and because truth now depends on what human minds are able to prove, mathematics becomes a private and subjective affair."**
      *   **Assessment: Contested and oversimplified.**  
      *   **Correction:**  
          *   **Brouwer:** He *did* emphasize the *individual* mathematician's mental activity ("creative subject"). This leans toward idealism/subjectivity ("solipsism" in his early writings, though moderated later).  
          *   **Heyting & Modern Constructivism:** Formalization (Heyting) and later constructivism (e.g., Bishop, Martin-Löf) treat proof as *shareable, objective* evidence. Bishop explicitly rejected Brouwer's idealism, stating constructivism is about *objective mathematical reality* accessed via computation/construction, not private minds.  
          *   **Truth vs. Knowability:** "Truth depends on what is *able* to be proved" aligns with anti-realism (Dummett), meaning truth = *provability in principle*. This need not imply *private* subjectivity.  
      *   **Standing:** **Genuinely Disputed.** Brouwer's idealism is part of his view. Modern constructivists (especially Bishop-style) *vehemently reject* psychologism/subjectivity, emphasizing objectivity and intersubjectivity of proofs. The claim that intuitionism *entails* subjectivity is false for modern constructivism.

  10. **"It is no surprise that intuitionism has won almost no adherents among working mathematicians."**
      *   **Assessment: Factually true but misattributed.**  
      *   **Correction:** Pure Brouwerian intuitionism *is* rare. **However:**  
          *   **Constructive Mathematics (Bishop):** This *is* intuitionistic in logic but rejects Brouwer's philosophy. It is practiced by a non-trivial (though still small) minority and influences computer science and proof theory.  
          *   **Adoption Barrier:** Low adoption is due more to the *incompatibility with classical reasoning* and practical efficiency, not primarily the subjectivity charge (which Bishop refuted).  
      *   **Standing:** Settled fact (low adoption), but the implied reason (subjectivity) is contested and incomplete.

  ---

  ### **Addressing Your Specific Concerns**
  *   **Excluded Middle & Double Negation:**  
      *   Intuitionistic logic **proves ¬¬(P ∨ ¬P)**. This shows LEM *cannot be refuted* (¬(P ∨ ¬P) leads to absurdity). Rejecting its *assertability* (due to lack of proof for P or ¬P) is **not** the same as declaring it *false*. The passage confuses rejection (refusal to assert) with negation (asserting falsehood).
  *   **Proof by Contradiction (Reductio):**  
      *   **Licensed:** Proving ¬P by assuming P and deriving absurdity (P → ⊥) entails ¬P.  
      *   **Not Licensed:** Proving P by assuming ¬P and deriving absurdity (¬P → ⊥) only proves ¬¬P, not P (unless P is ¬Q for some Q).  
  *   **Bishop's Neutrality:**  
      Bishop's constructivism uses intuitionistic logic but is *philosophically neutral* – it avoids Brouwer's idealism and presents constructive proofs as objectively valid. This directly contradicts the passage's claim that intuitionism entails subjectivity. Bishop aimed to capture the *computational content* of mathematics objectively.

  ---

  ### **Assessment of the Passage's Overall Argument**
  *   **Premises:**  
      *   Mostly accurate: Mental construction, rejection of LEM's universality, refusal of full proof-by-contradiction, rejection of bivalence, abandonment of classical results.  
      *   **Significant Errors:**  
          1.  Calling LEM "false" (misrepresents rejection).  
          2.  Characterizing intuitionistic logic as many-valued (incorrect).  
          3.  Overgeneralizing refusal of proof-by-contradiction.  
          4.  Equating unproved statements with "in between" values.  
  *   **Conclusion (Subjectivity & Unpopularity):**  
      *   **Does NOT follow validly from the corrected premises:**  
          *   The subjectivity charge rests primarily on Brouwer's idealism, *not* on the logic itself. Bishop-style constructivism maintains objectivity while using intuitionistic logic.  
          *   Unpopularity stems more from the *practical incompatibility* with classical mathematics and the need to rebuild analysis constructively. The passage's errors (especially "subjectivity") exaggerate the philosophical barrier.  
      *   **Depends on Errors:** The conclusion relies heavily on the mischaracterization of logic as many-valued/subjective and the conflation of Brouwer's specific philosophy with intuitionistic logic itself. Removing these errors weakens the argument significantly.

  ---

  ### **Key Corrections Summary**
  1.  **LEM:** Intuitionists *reject the assertion* of ∀P(P ∨ ¬P). They do *not* assert ∀P¬(P ∨ ¬P). **Replace "false in general" with "not assertable in general".**
  2.  **Proof by Contradiction:** Intuitionists *accept* it for proving *negations* (¬P). They *reject* using it to prove *positive existentials* or *disjunctions* via double negation elimination. **Replace "establishes nothing whatever about P" with "does not establish P (though it establishes ¬¬P)".**
  3.  **Truth-Values & Many-Valued Logic:** Intuitionism rejects bivalence; unproved statements lack a truth-value. It is *not* a many-valued logic in its intended interpretation. **Delete "something in between" and "species of many-valued logic". Replace with: "an unproved statement lacks a truth-value; intuitionistic logic is best understood as a logic of constructions or provability conditions."**
  4.  **Subjectivity:** Brouwer's idealism is subjective. Modern intuitionistic/constructive mathematics (Bishop, etc.) is explicitly objective. **Replace "private and subjective affair" with "For Brouwer, it involved elements of mental idealism; however, later constructive approaches emphasize the objective, shareable nature of proofs and constructions."**
  5.  **Unpopularity:** Acknowledge Bishop-style constructivism exists and is not subjective. **Add: "While Brouwer's original philosophy found few adherents, constructivist mathematics based on intuitionistic logic continues to be developed by mathematicians and computer scientists focused on computational meaning."**

  ---

  ### **Disputed vs. Settled Matters**
  *   **Settled:**  
      *   Syntax and theorems of intuitionistic logic (Heyting).  
      *   Rejection of universal LEM and bivalence.  
      *   Brouwer's creation of counterexamples using choice sequences/creating subject.  
      *   Bishop's rejection of Brouwer's idealism and commitment to objectivity.  
      *   Intuitionistic logic ≠ many-valued logic (intended interpretation).  
  *   **Genuinely Disputed:**  
      1.  **Psychologism/Idealism:** The extent to which Brouwer's idealism is essential to intuitionism vs. separable (Bishop vs. Brouwer).  
      2.  **Truth:** Whether truth is *provability* (Dummettian anti-realism), *idealized provability* (Kreisel), or *construction in a platonic realm* (Gödel's interpretation).  
      3.  **Brouwer's Later Views:** How much Brouwer moderated his solipsism.  
      4.  **Bishop's Neutrality:** Whether Bishop truly avoids philosophical commitment or implies a form of mathematical realism.

  This passage presents a common but philosophically slanted account. Correcting its logical errors reveals a more nuanced picture: intuitionistic logic is a robust, objective framework, distinct from Brouwer's controversial idealism. The unpopularity stems largely from practical incompatibility, not inherent subjectivity.
