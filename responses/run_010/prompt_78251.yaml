  4. The thing we should have been arguing about. IIA says options nobody would ever pick shouldn't move the answer; monotonicity says my share shouldn't fall when my own ceiling rises. Both sound obviously true, and he claims that once you also insist on Pareto, symmetry and invariance to rescaling you simply cannot have both. Is that right, and why exactly? Then tell me what each solution is really tracking, and which of the two criticisms lands. Related: I have a hazy memory that KS satisfies some weakened version of IIA, something about pairs of problems where the utopia point doesn't move. Is that a real thing, and can you show me why it would hold?

