  ### 4. Core Argument: IIA vs. Monotonicity  
  - **Incompatibility**: Yes, **Nash + KS axioms (Pareto, symmetry, scale invariance) cannot jointly satisfy both IIA and Monotonicity**.  
    - Proof: If a solution satisfies all axioms, consider two bargaining problems \((S,d)\) and \((T,d)\) with \(S \subseteq T\), \(u_x(T) > u_x(S)\), \(u_y(T) = u_y(S)\).  
      - By IIA, the solution for \((S,d)\) must also be the solution for \((T,d)\) if it’s in \(S\).  
      - By Monotonicity, player 1’s payoff in \(T\) should be \(\geq\) payoff in \(S\).  
      - Contradiction if the solution in \(S\) gives player 1 less than their ideal in \(T\).  
  - **What each solution tracks**:  
    - **Nash**: Maximizes product of gains (favors balanced gains).  
      - **Criticism**: Fails Monotonicity; ignores changes in "opportunity" (e.g., your ceiling rises, but Nash doesn’t reward you).  
    - **KS**: Equalizes ratio of gains to ideal gains (favors equity in potential).  
      - **Criticism**: Fails IIA; adding irrelevant options can change the ideal point and thus the solution.  
  - **Weakened IIA for KS**:  
    - KS satisfies: **If \(S \subseteq T\) and \(u(S) = u(T)\), then the solution for \((S,d)\) and \((T,d)\) is the same**.  
      - Why? KS depends only on \(d\), \(u\), and the Pareto frontier. If \(u\) is unchanged, the ray from \(d\) to \(u\) is fixed, so the intersection with the frontier remains the same if the solution point is still in \(S\).  
      - This is not full IIA (which requires no change even if \(u\) changes), but it’s a natural weakening.  

