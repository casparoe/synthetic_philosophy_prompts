  Example B. Frontier is one perfectly straight line from (0,10) to (10,0), but now d = (2,1).
  - Him: straight line, so they coincide, same argument.
  - Me: they dont. I get Nash at (5.5, 4.5) and KS at about (5.29, 4.71), and the reason has nothing to do with curvature and everything to do with where d sits.

