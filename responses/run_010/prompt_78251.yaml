  4. **The Trade-off between IIA and Monotonicity**:

     - Both IIA and Monotonicity are desirable properties, but they are incompatible with each other in the presence of the other axioms (Pareto efficiency, symmetry, and scale invariance). 

     - Your friend claims that with Pareto, symmetry, and scale invariance, you cannot have both IIA and Monotonicity. This is correct. The Nash solution satisfies IIA but not Monotonicity, while the KS solution satisfies Monotonicity but not IIA.

     - Why are they incompatible? Consider two bargaining they are in some sense independent, but then expanded set might have more options that should not affect the solution by IIA, but by monotonicity the solution should change.

     - A specific example to illustrate the incompatibility might be using Example A and a subset. 

     - We know of a weakened version of IIA that the KS solution satisfies: if two bargaining problems have the same ideal point, then the solution should be the same if it is feasible in both? But that's not accurate.

     - KS satisfies: if (S,d) and (T,d) are such that S is a subset of T and the ideal point of S is the same as the ideal point of T, then the KS solution for (T,d) should be at least as good for both players as the KS solution for (S,d). But that's a form of monotonicity.

     - KS satisfies a property called "individual monotonicity" which is the one described in the query.

     - It does not satisfy IIA, but it does satisfy a weaker property: if the feasible set is expanded in a way that the ideal point remains the same, then the solution for the larger set should be at least as good for both players as for the smaller set. 

     - In summary, the choice between Nash and KS depends on which property you value more: IIA or Monotonicity. 

     - The Nash solution is tracking the product of the gains, and it is affected only by the shape of the Pareto frontier near the solution. The KS solution is tracking the ratio of the gains to the ideal gains.

     - The criticism of the Nash solution is that it does not respond to changes in the ideal point, while the criticism of the KS solution is that it can be affected by the addition of alternatives that are not chosen (which is the IIA criticism).

     - Both criticisms land: in Example A, the KS solution changed because of the kink which allowed a different ideal point for player2, while the Nash solution did not care about the ideal point. In Example B, the KS solution took into account the location of the disagreement point in a different way (via the ideal point) than the Nash solution.

