  ### Key Implications
  - **Epistemic trade-off**: Delphi sacrifices *independence* (valuable for error-averaging) for *calibration* (correcting individual biases)—a defensible choice only if errors are random and consensus-seeking doesn’t introduce new biases.
  - **What consensus hides**: In complex domains (e.g., climate science), persistent disagreement often reflects deep uncertainty; Delphi’s convergence may create false certainty.
  - **Better fit**: Delphi works best for technical questions with single factual answers (e.g., engineering tolerances), not value-laden or ambiguous issues where disagreement is instructive. Your "disagreement-as-information" alternative suits "wicked problems" where uncertainty is irreducible.
