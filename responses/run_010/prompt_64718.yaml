prompt: |-
  Write a short story of roughly 1,500 words that dramatizes the position W. E. B. Du Bois defended in his 1926 address "Criteria of Negro Art" — that art made by a despised people can never be merely decorative, and that beauty, truth, and justice come as one demand. Do not name Du Bois, and do not use the word propaganda anywhere in the narration; let the view emerge from what the characters do and argue.

  Set it in the present. A muralist has won a commission from a city transit authority for the concourse wall of a new light-rail station in a neighborhood that was rezoned eighteen months earlier, and the contract's community-benefit clause requires the work to celebrate the area's resilience and heritage. Build the story around three pressures that cannot all be satisfied: a tenants' organizer who wants the wall to carry the street addresses of the buildings whose residents were priced out; a retired schoolteacher who insists the neighborhood has a right to see itself rendered beautifully, and warns that a wall of grievances will be buffed or ignored; and the artist's own conviction that the piece has to work as a picture before it can work as anything else. The story should turn on a specific decision about what actually goes on the wall, and should show the finished piece doing something in the world that the artist did not intend and partly disowns.

  Give the beauty-first position its strongest case rather than treating it as a foil, and end with the artist's own account of whether the work succeeded — an account the reader has reason to distrust.
reasoning: |-
  Okay, let me approach this story request methodically. The user wants a contemporary narrative illustrating Du Bois' aesthetic philosophy without explicit reference, centered on a mural commission with three conflicting pressures. 

  First, I consider how to translate Du Bois' principles into dramatic form: the inherent political weight of marginalized art, the inseparability of beauty and justice. The transit mural commission provides perfect tension - public art as contested space. 

  For the three viewpoints, I develop:
  - The tenants' organizer (Marcus) representing displaced residents' material reality
  - The retired teacher (Mrs. Armitage) advocating for aspirational beauty
  - The artist (Lena) caught between aesthetic integrity and social responsibility

  The key structural challenge is making the artwork's unintended consequence feel organic. I land on the mural becoming a memorial site after a police shooting - showing how community reclaims art beyond artist intent. 

  I plan to give Mrs. Armitage's beauty-first position real weight through her speeches about dignity, ensuring she's not a strawman. Lena's final assessment of "success" will ring hollow against the mural's actual use as protest space, creating the required dramatic irony.

  For authenticity, I research:
  - Contemporary mural techniques (phototransfer, fresco)
  - Gentrification patterns in transit-adjacent neighborhoods
  - Community benefit agreement language

  The ending will linger on Lena's discomfort as she sees her work transformed - the paint smears becoming more truthful than her careful composition. This embodies Du Bois' idea that oppressed people's art can't be merely decorative, however the artist intends.
answer: |-
  The commission notice arrived like an unexpected inheritance. Lena Morales stared at the email from the City Transit Authority, confirmation glowing on her laptop screen. The concourse wall of the new Cypress Avenue Light-Rail Station. *Her* wall. Five thousand square feet of blank concrete in the heart of what the city brochures now called "Cypress Heights," a neighborhood rezoning had reshaped eighteen months prior. The contract stipulated the mural must celebrate the area’s "resilience and heritage," a phrase Lena knew could mean anything and nothing.

  Her studio, a converted garment factory loft overlooking the very streets in question, became a war room. Sketches bloomed – vibrant patterns inspired by the old Caribbean bakeries and West African fabric shops, portraits based on faded photos from the local historical society, abstract swirls echoing the energy of the long-gone jazz clubs. She wanted beauty, undeniable beauty, the kind that made commuters pause mid-stride. Art, she believed fiercely, had to work as *art* first. If it wasn’t visually compelling, resonant on a purely aesthetic level, no message, however righteous, would land. A dull sermon preached to rushing backs.

  The pressures arrived swiftly.

  Marcus Johnson materialized first, knocking firmly on her studio door. Leader of the Cypress Tenants Union, his eyes held the weary fire of constant battle. "Resilience, huh?" he’d said, scanning her preliminary sketches – graceful dancers, geometric patterns hinting at kente cloth. "Resilience looks like Mrs. Henderson crying on the curb when the sheriff came. It looks like the ‘For Lease’ signs blooming faster than spring flowers." He dropped a folded printout on her drafting table. It was a list. Street addresses. 214 Cypress Ave. 305 Oak Terrace. 17 Sycamore Lane. Over fifty addresses, each one a home lost to skyrocketing rents post-rezoning. "That’s the heritage they’re erasing, Lena. Put *that* on the wall. Make them see the cost."

  Then came Eleanor Armitage, retired after forty years teaching art at the local high school. She brought tea and a quiet, unshakeable conviction. "Marcus means well," she said, her voice soft but firm as old oak. "But grief isn't the only story here. This neighborhood... we raised children here, celebrated weddings, mourned our dead under these trees. We deserve to see ourselves rendered with dignity, with *beauty*, Lena. Not just as victims." She touched a sketch Lena had done of a young girl jumping rope, her braids flying. "This. The joy, the ordinary grace. That’s resilience too. That’s truth." She leaned forward, her gaze sharp. "A wall of grievances, no matter how justified, becomes invisible. People avert their eyes. They call it ugly, depressing... *propaganda*." She spat the unspoken word Lena was forbidden to use. "It gets buffed over in the mind, or worse, on the wall by some city crew in the dead of night. Beauty disarms. Beauty invites people in. Then... *then* they might see the truth woven within it."

  Lena felt torn. Marcus’s demand felt urgent, vital – the raw, unvarnished cost of "progress." Eleanor’s plea resonated deeply with her artistic soul – the belief that capturing the human spirit, the inherent beauty of a community, *was* a radical act of preservation and defiance. And underpinning it all was her own creed: the mural had to sing visually. It couldn’t be a spreadsheet of sorrow or a saccharine postcard. It had to be a *painting*.

  Weeks bled into months. Lena walked the streets, absorbing the uneasy juxtaposition: sleek new coffee shops beside boarded-up bodegas, luxury condos casting long shadows over the stoops where neighbors still gathered. She photographed elderly men playing dominoes, children’s chalk drawings on the sidewalk, the intricate ironwork on surviving brownstones. She also photographed the addresses on Marcus’s list, the blank spaces where life had been uprooted.

  The solution, when it came, felt less like inspiration and more like a fragile truce. She would create a vibrant tapestry of Cypress life – the dancers, the jump rope girl, the domino players, the stoop sitters, all rendered in her signature style: bold, flowing lines, rich earth tones punctuated by bursts of Caribbean color. But woven into the background, subtly at first glance, emerging upon closer inspection, would be the architectural ghosts. Using a slightly darker, textured shade of the base color, she would silhouette the facades of the lost buildings, their outlines emerging from the vibrant scenes like memories pushing through. And within the windows of those ghost-buildings, rendered in tiny, precise script, would be the addresses Marcus provided. Not a scream, but a whisper from the walls.

  Marcus was skeptical. "People rushing for a train won't stop to squint at tiny numbers."
  "They will if the whole picture draws them in first," Lena countered. "The beauty makes them look closer. Then they see."
  Eleanor sighed, tracing the faint outline of 214 Cypress Ave. behind a joyful dancer. "It’s a risk, child. The sadness might swallow the joy. Or the joy might seem to mock the loss."
  "The joy *is* the resilience," Lena insisted, clinging to her vision. "The loss is the heritage. They exist together. The beauty holds them both."

  The execution was grueling. Scaffolding rose against the vast concourse wall. Lena and her assistants worked day and night under the harsh construction lights, the rumble of machinery a constant bass note. The vibrant figures emerged first – life-sized, dynamic, pulsing with energy. Then, with meticulous care, Lena painted the ghost-buildings, the subtle shift in texture and tone creating an almost subliminal depth. The tiny addresses were the final, painstaking touch, requiring a magnifying lens and surgeon’s steadiness.

  The unveiling was a city event. Speeches lauded the "revitalization" and the "vibrant community spirit." Cameras flashed on the stunning, colorful mural. Commuters streaming through paused, genuinely struck. "Wow, it’s beautiful!" was the common refrain. Lena saw people pointing out the jump rope girl, smiling at the domino players. She saw a few lean closer, squinting at the darker background textures, perhaps catching a glimpse of a number. Marcus nodded curtly, his expression unreadable. Eleanor clasped Lena’s hand, her eyes moist. "It *is* beautiful, dear. Truly."

  For weeks, Lena monitored the mural. She saw tourists take selfies in front of the dancers. She watched children trace the bold lines. She overheard snippets: "So vibrant!" "Makes the station feel alive." She saw a few people lingering, fingers tracing the faint outlines of the ghost-buildings, frowning slightly. But mostly, the beauty shone. The wall worked as a picture. She allowed herself a cautious satisfaction. It wasn’t perfect, but she’d threaded the needle. Beauty had carried the truth within it.

  Then came the Thursday night. A young man, Jamal Carter, grandson of one of Eleanor’s former students, was stopped by police three blocks from the station. An argument escalated. Shots were fired. Jamal died on the pavement under the newly gentrified streetlights.

  The grief that surged through Cypress was a physical wave. It crashed against the light-rail station. The following evening, a vigil began spontaneously at the mural. People brought candles, flowers, photos of Jamal. They stood in the concourse, not rushing, not averting their eyes. They looked at the mural, at the vibrant life depicted, at the ghost-buildings behind it.

  Lena heard about it and went down, her heart pounding. The scene took her breath away, not with beauty, but with raw, transformed meaning. Dozens of candles flickered on the floor, illuminating the wall from below. Someone had carefully taped Jamal’s high school graduation photo near the center. And then she saw it.

  On the subtle silhouette of 305 Oak Terrace – one of the displaced addresses – someone had used a thick, black marker. Not to deface, but to claim. They had written, large and clear over her carefully rendered ghost-building: **JAMAL LIVED HERE**.

  It was like a lightning strike. Suddenly, the whispered addresses became a shout. People weren't just seeing the ghost-buildings; they were *pointing* to them. "His grandma got pushed out of Sycamore Lane last year," someone said, gesturing towards 17 Sycamore Lane subtly woven into the background. "Like they’re trying to erase us all," another murmured, staring at the joyful dancer seemingly oblivious to the dark outline behind her.

  The mural was no longer just Lena’s composition. It had become a living palimpsest. Flowers were tucked into the painted hands of the jump rope girl. Notes addressed to Jamal were taped near his photo, overlapping the textured background. The phrase "HE LIVED HERE" appeared again, scrawled on another ghost-building facade. The beauty was still there, the vibrant life Lena had painted, but it was now framed, haunted, *contextualized* by the immediate, brutal truth of Jamal’s death and the systemic displacement the ghost-buildings represented. The commuters didn't just pause now; they stopped. They read the notes. They looked from Jamal’s face to the painted faces, to the ghostly addresses, the connection forming not subtly, but viscerally. Beauty hadn’t been swallowed; it had become the vessel holding an unbearable, undeniable pain. The justice demanded wasn't in Lena’s careful subtext; it was shouted in marker on the surface she’d created.

  Lena stood in the flickering candlelight, a stranger before her own work. She felt a surge of anger – at the defacement? At the hijacking of her vision? Then a deeper pang: the horrifying relevance Jamal’s death gave to Marcus’s list, to the ghost-buildings she’d rendered so artistically. Her beautiful tapestry had become a backdrop for a raw, contemporary tragedy, revealing layers of truth she hadn’t dared or known how to paint so starkly.

  Weeks later, the candles were gone, the notes eventually removed by station cleaners. Jamal’s photo vanished. But the words "HE LIVED HERE," though faded, remained stubbornly on 305 Oak Terrace and another ghost-building. They were part of the mural now. Commuters still glanced at the vibrant figures, but more eyes lingered on the marked addresses, the whispers louder.

  Eleanor found Lena staring at the wall one morning. "They see it now," Eleanor said quietly. "The cost."
  Lena nodded, her throat tight. "It wasn’t supposed to be... like this. So direct. So... accusatory."
  "Truth often is, dear," Eleanor sighed. "Perhaps beauty needed a little help this time."

  A journalist interviewed Lena for a piece on public art and community. Sitting in her studio, surrounded by her bright, controlled sketches, Lena composed her answer to the question of whether the mural succeeded.
  "Yes," she said, her voice firm, believing it even as another part of her recoiled. "Absolutely. It functions as compelling public art – it’s visually arresting, it engages commuters. And it subtly, powerfully, honors the community’s heritage, both its enduring spirit and the losses it’s sustained. The beauty draws people in, and within that beauty, they find a deeper truth about resilience and remembrance. That was always the goal."

  She didn’t mention the marker. She didn’t mention Jamal Carter. She focused on the aesthetic unity, the skillful integration of form and meaning. She described the ghost-buildings as a "poetic echo of the past," the addresses as "whispers of history." She spoke of the vibrant present depicted, the "optimism inherent in the community’s spirit." Her words were elegant, convincing, an artist’s testament to her vision realized.

  But down in the Cypress Avenue concourse, sunlight streaming through the high windows caught the faded black words on the textured paint: **HE LIVED HERE**. A young woman waiting for her train traced the letters with her finger, then looked up at the joyful, dancing figures, her expression unreadable. The mural held Lena’s beauty, Eleanor’s dignity, Marcus’s indictment, and Jamal’s unfinished story, all inseparable now. Lena’s account of success, neat and contained, echoed in the studio, while on the wall, a messier, more demanding truth pulsed quietly beneath the surface, waiting for the next gaze that dared to look beyond the artist's intention.
