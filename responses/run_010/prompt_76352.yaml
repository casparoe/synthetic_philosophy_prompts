  We are drafting a research proposal for a fellowship that pairs philosophers with machine-learning researchers. The core idea is to develop a new perspective on Goodhart's law that focuses on cases where the target itself changes under optimization pressure, not just the proxy's fidelity. The proposal must follow a specific structure.

  Let me outline the proposal structure as requested:

  1. **Research Question**: Split into primary and subordinate questions if needed.
  2. **Existing Positions**: Critique of the four-way taxonomy, incentive-design, and reward-hacking treatments, showing where they run out.
  3. **Method**: Four-month plan with phases, activities, and outputs. Justify the method.
  4. **Case Studies**: Two or three cases, with justification and what they demonstrate.
  5. **Success and Failure Conditions**: What success looks like and candid failure conditions.
  6. **Scope Risk**: How to handle if the project balloons, and the minimal deliverable.

  After the prose, a JSON summary with specific fields.

  Now, let's develop each part.

  ### 1. Research Question
  Primary Question: 
  - What is the criterion that distinguishes repairable Goodhart failures (those fixable by improving measurement fidelity) from constitutive ones (those requiring a change in what is being asked for)?

  Subordinate Questions:
  - How does the reorganization of measurement practices under incentive structures change the extension of the target?
  - Why do existing frameworks (the four-way taxonomy, incentive-design, reward-hacking) fail to capture constitutive Goodhart failures?
  - Can the constitutive/repairable distinction be formally modeled within existing frameworks, or does it require an extension?

  ### 2. Existing Positions
  - **Four-way taxonomy (regressional, extremal, causal, adversarial)**: Explains well the mechanisms of proxy degradation when the true goal is fixed. Runs out when the goal's extension shifts due to the incentive structure.
  - **Incentive-design treatment (economics)**: Focuses on designing incentives to align behavior with organizational goals. Explains how incentives can distort behavior but assumes the goal is fixed. Runs out when the goal itself becomes redefined by the measurement practice.
  - **Reward-hacking treatment (alignment literature)**: Addresses how agents might exploit proxy measures. Explains agentic manipulation but doesn't account for non-agentic shifts in the target's meaning.

  ### 3. Method
  Four-month plan:
  - **Phase 1 (1 month)**: Conceptual analysis. Clarify the distinction between repairable and constitutive failures. Output: A working definition and criteria.
  - **Phase 2 (1.5 months)**: Case study reconstruction. Analyze 2-3 cases to test the distinction. Output: Case analyses showing the distinction in action.
  - **Phase 3 (1 month)**: Formal modeling. Test if the distinction can be captured in existing formal frameworks (e.g., by extending them). Output: A model or a proof that it requires an extension.
  - **Phase 4 (0.5 months)**: Synthesis and writing. Output: A draft paper.

  Justification: Avoids the limitations of purely formal (which might miss practice) or purely empirical (which might lack generality) approaches. Uses conceptual analysis and cases to build theory, then tests with formal tools.

  ### 4. Case Studies
  Choose three common-knowledge cases:
  - **Hospital mortality rates**: When used as a target, hospitals may avoid high-risk patients, changing what "mortality" measures. Intended: Demonstrate constitutive shift. Risk: If the shift is just causal Goodhart, then fails.
  - **Journal impact factors**: When journals optimize for impact factor, they might publish review articles instead of original research, changing what "impact" means. Intended: Show change in extension. Risk: If it's just adversarial gaming, fails.
  - **Software code-review scores**: When scores are incentivized, reviewers might focus on trivial fixes. Intended: Show that the practice of code review changes. Risk: If the change is merely behavioral without a shift in the target's meaning, fails.

  ### 5. Success and Failure Conditions
  - **Success**: A clear criterion for the distinction, validated in cases, and either a formal model or a demonstration that existing frameworks cannot capture it without amendment.
  - **Failure Conditions**: 
    - The distinction collapses into causal Goodhart.
    - The distinction is merely verbal.
    - No clear criterion emerges from cases.

  ### 6. Scope Risk
  - Risk: Ballooning into a general theory of measurement. 
  - Cut: If time short, reduce the number of case studies or skip formal modeling.
  - Minimal deliverable: A well-argued conceptual distinction with one robust case study, even without formalization.

  ### Novel Contribution
  A new account of Goodhart's law that explains why some failures are not fixable by better measurement but require rethinking the target, providing a criterion to distinguish such cases.

  Now, write the proposal in prose and then the JSON.
answer: |-
  ### Project Proposal: Constitutive Goodhart Effects and the Limits of Measurement Repair  

  **1. Research Question**  
  The primary research question is: *What criterion distinguishes repairable Goodhart failures (fixable via improved measurement fidelity) from constitutive failures (requiring redefinition of the target itself)?* This resolves into three subordinate questions:  
  - (a) How do incentive structures reorganize measurement practices to alter the extension of a target?  
  - (b) Why do dominant frameworks (the four-way taxonomy, incentive-design, and reward-hacking approaches) fail to explain constitutive cases?  
  - (c) Can the distinction be formalized within existing models, or does it necessitate augmenting them?  

  **2. Existing Positions and Their Limitations**  
  *The four-way taxonomy* (regressional, extremal, causal, adversarial Goodhart) excels at classifying proxy-target decoupling when the goal is fixed and the proxy estimates it imperfectly. It explains *how* optimization degrades statistical relationships (e.g., overfitting in regressional cases) but assumes the target’s extension is antecedently determinate. It runs out when incentives reshape the practice that fixes the target’s meaning—e.g., when "hospital mortality rate" ceases to represent patient outcomes because reporting protocols change under pressure.  

  *The incentive-design treatment* (economics) effectively diagnoses goal misalignment in principal-agent problems, prescribing better incentive structures. It explains *why* agents game proxies but treats the target as a static, known quantity. It runs out when the target itself is reconstituted—e.g., when "academic impact" morphs from scholarly influence to citation manipulation, rendering the original goal incoherent.  

  *The reward-hacking treatment* (AI alignment) adeptly models agents exploiting proxy misspecification, emphasizing robustness techniques. It explains *strategies* for deceptive optimization but presupposes a stable, pre-defined goal. It runs out when measurement practices evolve non-strategically—e.g., when code-review scores shift from evaluating quality to rewarding trivial edits due to peer norms adapting to incentives, not agentic manipulation.  

  These frameworks share a blind spot: they treat measurement as a *discovery* problem (finding better proxies for a fixed target) rather than a *constitutive* one (where the target’s identity depends on contextual practices).  

  **3. Method and Justification**  
  This project combines conceptual analysis, case reconstruction, and lightweight formal modeling to avoid the pitfalls of purely formal, empirical, or historical approaches. A purely formal treatment would miss practice-dependent dynamics; a case-study-only approach risks anecdotalism; a historical focus distracts from mechanism design. The four-month timeline is structured as follows:  

  - **Phase 1: Conceptual Groundwork (4 weeks)**  
    *Activities*: Analyze "measurement practice" as a social-epistemic construct; define "constitutive failure" versus "proxy degradation."  
    *Output*: A taxonomy of failure modes with clear criteria for repairability.  

  - **Phase 2: Case Reconstruction (5 weeks)**  
    *Activities*: Apply the criteria to 2–3 cases (see §4); test if existing frameworks can explain them without ad hoc amendments.  
    *Output*: Case narratives highlighting when target redefinition occurs.  

  - **Phase 3: Formal Probing (2 weeks)**  
    *Activities*: Model cases in a simple state-space framework; test whether constitutive shifts reduce to causal/adversarial effects or require new parameters (e.g., endogenizing goal semantics).  
    *Output*: A technical appendix showing the necessity (or not) of framework augmentation.  

  - **Phase 4: Synthesis (1 week)**  
    *Activities*: Integrate findings; draft a paper articulating the criterion.  
    *Output*: Fellowship manuscript draft.  

  **4. Case Studies**  
  - **Case 1: Hospital Mortality Rates**  
    *Justification*: Widely documented; common in policy debates.  
    *Intended Demonstration*: Incentives reduced high-risk admissions, altering clinical reporting standards—changing what "mortality" measures. A constitutive failure where better data cannot repair the original goal.  
    *Failure Risk*: If the shift is attributable to causal gaming (e.g., administrators manipulating records), it collapses into the four-way taxonomy.  

  - **Case 2: Academic Journal Impact Factors**  
    *Justification*: Familiar in academia; illustrates non-agentic drift.  
    *Intended Demonstration*: Incentives prompted journals to favor review articles over original research, redefining "impact" from scholarly contribution to citation efficiency. Repair requires rethinking the target, not better metrics.  
    *Failure Risk*: If this is merely adversarial gaming by editors, the reward-hacking treatment suffices.  

  - **Case 3: Software Code-Review Scores**  
    *Justification*: Well-known in tech; shows peer-practice evolution.  
    *Intended Demonstration*: Scores incentivized trivial fixes (e.g., syntax) over substantive review, transforming "quality" from robustness to superficial compliance. Measurement repair fails; target redesign is needed.  
    *Failure Risk*: If the change is behavioral (e.g., rushed reviews) without semantic shift, it remains a causal/extremal effect.  

  **5. Success and Failure Conditions**  
  - **Success Criteria**:  
    - A falsifiable criterion for constitutive failures (e.g., "failure occurs iff incentive structures alter the practice defining the target’s extension").  
    - Cases showing the criterion explains gaps in existing frameworks.  
    - Formal proof that causal/adversarial categories cannot subsume constitutive cases.  

  - **Failure Conditions**:  
    - Constitutive cases reduce to causal Goodhart upon analysis.  
    - The distinction is merely verbal (e.g., "redefinition" is just proxy drift).  
    - No generalizable criterion emerges from cases.  

  **6. Scope Risk and Mitigation**  
  - **Risks**: Project could expand into a theory of social ontology or measurement realism.  
  - **Mitigation**: Focus narrowly on repair-vs.-redefinition in incentive contexts; omit historical debates.  
  - **If Time Short**: Prioritize one paradigmatic case (e.g., hospital mortality) and conceptual analysis; defer formal modeling.  
  - **Minimal Defensible Deliverable**: A rigorously argued distinction with one case showing why measurement repair fails, even if formalization is incomplete.  

  **Novel Contribution**: This project reframes Goodhart’s law as a problem of *semantic instability under incentives*, providing a criterion to diagnose when measurement repair is futile—advancing both philosophy of science and AI alignment by explaining persistent failures in target specification.  

