  ---

  ### Summary of Key Positions Named:  
  - **Pragmatic Encroachment**: Stakes affect knowledge standards.  
  - **Contextualism**: Stakes affect the *meaning* of "knows" in context.  
  - **Invariantism**: Knowledge standards are stakes-insensitive.  
  - **Relevant Alternatives**: Knowledge requires ruling out contextually relevant error-possibilities.  

