  - **Ceiling coherence**: Probability 0.85  
    *Justification*: The ceiling reflects finite resources, not skepticism. "Stops growing" due to cost/feasibility is unrelated to knowledge *conceptually* but affects practice.  

  **Conditional Probability Calculation:**  
  - P(Your Explanation | Phenomenon) = P(Explanation & Phenomenon) / P(Phenomenon)  
  - Given overlap with existing "encroachment" views (Part 3), reduced to **0.35**.  

