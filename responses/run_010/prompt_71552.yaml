  - *Contested**: Whether this reflects *actual knowledge differences* (vs. linguistic/pragmatic effects).  

  ---

  ### 2. **Decomposition of Key Sub-Questions**  

  | **Sub-Question** | **Rough Probability** | **Justification** |  
  |------------------|------------------------|-------------------|  
  | **A. Is knowledge governed by a fixed threshold?** | 0.20 | *Rejected by most modern theories. Stakes-sensitive intuitions undermine this (e.g., your roof cases).* |  
  | **B. Must one act only on known propositions?** | 0.70 | *Plausible but debated. If true, stakes raise the "actionability bar," indirectly raising knowledge standards. Contested premise.* |  
  | **C. Is the high-stakes pull about knowledge itself?** | 0.65 | *Likely, but alternatives exist (e.g., "assertability" or confidence demands). Your case targets knowledge directly.* |  
