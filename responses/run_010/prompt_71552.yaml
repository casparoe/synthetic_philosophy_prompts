  ### 3. **Distinctiveness of Your Mechanism**  
  **Probability that alternatives don’t track evidential strength: 0.30**  

  **Analysis:**  
  - **Collapse risk**: If "checking more alternatives" always requires more evidence, your account reduces to standard "pragmatic encroachment" (which ties justification to stakes).  
  - **Saving distinction**: Alternatives could be *epistemically irrelevant in low stakes* but *relevant in high stakes* (e.g., "did a bird crack the shingle?"). Checking them needn’t add evidence but rules out error-possibilities suddenly deemed salient.  
  - **Why low probability**: Most theories treat "ruling out alternatives" as increasing evidential support. Your ceiling (Part 4) is novel, but the core mechanism overlaps.  

