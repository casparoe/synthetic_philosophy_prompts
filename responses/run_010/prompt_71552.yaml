  - If (A) is false (prob. 0.80), stakes *can* matter.  
  - If (B) is true (prob. 0.70), stakes *do* matter via action-knowledge links.  
  - If (C) is true (prob. 0.65), the effect is on knowledge (not merely speech/confidence).  
  - **Joint probability of stakes affecting knowledge**: ~0.80 × 0.70 × 0.65 ≈ **0.36** – but this underpins the 0.85 in Part 1 due to additional arguments.  

