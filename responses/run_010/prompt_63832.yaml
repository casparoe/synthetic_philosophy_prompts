prompt: |-
  Been reading a lot of path dependence stuff lately (QWERTY and the usual suspects) and I keep hitting a wrinkle I can't find a word for. The standard story is that an inferior thing wins early and then sticks because switching costs or network effects make it individually rational to keep using it. But there seems to be a second mechanism that isn't like that at all: once the incumbent wins, it also supplies the yardstick that challengers get measured against, so the comparison is stacked before it starts, without anyone stacking it.

  Cases that look like this to me: someone with no borrowing history can't get a loan, because the score that measures creditworthiness is built out of borrowing history; a firm that invests mostly in software and brands looks less profitable than one that invests in machinery, because the accounting rules were writen when capital meant plant, and markets trade on those numbers; a new programming language scores badly on benchmark suites that are written in the idiom of the languages already on top. In none of these is the incumbent's edge about switching costs or about people needing to coordinate — the winner authored the exam.

  Is there an established concept for this? I know about Goodhart's law, adaptive preferences, and "dominant design," but none of them seem to be it exactly — tell me how my thing differs from each, and from plain lock-in. If there's no name, give it one, and define it sharply enough that I can sort real cases from fakes: what would a challenger look like that gets judged on criteria the incumbent did not supply?
reasoning: |-
  Okay, the user is diving deep into path dependence and has noticed a specific pattern that isn't covered by the usual explanations like switching costs or network effects. They describe situations where the incumbent sets the evaluation criteria, making it almost impossible for challengers to compete on a fair basis. 

  Hmm, they mention examples like credit scoring favoring those with existing history, accounting rules biased toward physical assets, and programming benchmarks favoring established languages. Each case shows how the incumbent's framework becomes the default measuring stick. The user seems frustrated that existing terms (Goodhart's law, adaptive preferences, dominant design) don't quite fit. 

  Let me unpack why those terms fall short: Goodhart's is about metrics *becoming* gamed, not inherently biased. Adaptive preferences are about shifting desires, not structural measurement bias. Dominant design is about standardization, not rule-setting. And lock-in? That's about coordination costs, not rigged evaluations. 

  The core issue here is **epistemic capture**—the winner defining reality itself. I should emphasize how this differs from mere inertia. It's not that people *choose* the incumbent; it's that the challenger is framed as "deficient" by design. For instance, a new programming language might be faster but "lacks ecosystem maturity" because maturity is defined by... the old ecosystem's traits. 

  The user also wants to know how to spot impostors. A true case requires: (1) the incumbent built the rules, (2) the rules favor their strengths, and (3) challengers get rejected *for not playing by those rules*. Counterexample? Electric cars were initially panned for range vs. gas cars—a fossil-fuel-defined metric. Now they're judged on charging speed (their own turf). That shift exposes the bias. 

  Naming it "Evaluation Bias Lock-in" feels precise. "Epistemic" might scare people off, but "evaluation bias" nails the mechanism: the ruler is crooked because the ruler-maker won last time. User seems academic—they'll appreciate the rigor. Should also flag that this often hides behind "objective standards," which is extra insidious.
answer: |-
  You've hit on a profoundly important and distinct mechanism! This **isn't just classic lock-in**. What you're describing is a deeper form of **institutional or epistemic capture**, where the incumbent doesn't just benefit from inertia but actively **defines the criteria for success**, making challengers appear inferior *by design*. There isn't one universally accepted term, but several concepts get close. Let's break it down:

  1.  **Distinction from Classic Lock-In (Network Effects/Switching Costs):**
      *   **Classic Lock-In:** Sticking with the incumbent is *individually rational* due to coordination problems or tangible costs (e.g., retraining, incompatible files, losing access to a network). The *value* of the challenger might be objectively higher, but the *cost* of switching outweighs it.
      *   **Your Mechanism:** The challenger is *perceived as inferior* or *objectively measured as inferior* **because the incumbent defined the measurement system**. The incumbent's strengths *become* the definition of quality. Switching costs might exist, but the core problem is the **biased evaluation framework**. The challenger might be fundamentally *different* and potentially superior, but it fails the test *written by the incumbent*.

  2.  **Distinction from Goodhart's Law:**
      *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." This is about the *corruption* of an existing metric once it's incentivized. People game the system to optimize for the metric, distorting its original purpose.
      *   **Your Mechanism:** The problem isn't that the metric is being gamed *after* it's chosen; it's that the metric itself was **designed around the incumbent's characteristics** from the outset. The metric is inherently biased, not corrupted later. The incumbent *authored the exam based on their own knowledge*.

  3.  **Distinction from Adaptive Preferences:**
      *   **Adaptive Preferences:** Individuals lower their aspirations or change their desires to align with perceived constraints or limited options (e.g., "sour grapes"). This is a psychological adjustment to limited choices.
      *   **Your Mechanism:** This is **structural and institutional**, not primarily psychological. It's about *objective* (or seemingly objective) measurement systems and decision rules (credit scores, accounting standards, benchmarks) that are biased, not individuals lowering their standards. The bias is baked into the system's rules.

  4.  **Distinction from Dominant Design:**
      *   **Dominant Design:** A specific configuration or architecture emerges as the standard solution within a product class, stabilizing the industry and focusing competition on refinements. It's about *how* something is done becoming standardized.
      *   **Your Mechanism:** This goes beyond the *form* of the solution to **how the solution's *success* is *evaluated***. The dominant design might *influence* the metrics, but your point is that the metrics themselves become the tool of entrenchment. It's about the *yardstick*, not just the design.

  **Names and Definitions:**

  *   **Evaluation Bias Lock-in:** This directly captures the core: the lock-in is caused by the *bias inherent in the evaluation criteria*.
  *   **Incumbent-Defined Metric Entrenchment:** Highlights that the incumbent sets the rules (metrics) by which competition is judged.
  *   **Epistemic Lock-in/Path Dependence:** Emphasizes that the *knowledge framework* or *way of knowing/measuring* becomes locked in, favoring the incumbent.
  *   **Foundational Metric Bias:** Stresses that the bias is built into the very foundations of the measurement system.
  *   **Self-Referential Evaluation Trap:** The system evaluates new entrants based on its own established (and biased) reference points.

  **Sharp Definition: Evaluation Bias Lock-in**

  > **Evaluation Bias Lock-in** occurs when an incumbent technology, practice, or institution establishes the dominant framework for *measuring value, performance, or worth* within a domain. This framework inherently reflects and favors the incumbent's specific characteristics, strengths, and historical context. Consequently, challengers offering potentially superior but *different* approaches are systematically disadvantaged or deemed inferior because they are evaluated against criteria biased towards the incumbent's established paradigm. This creates a self-reinforcing barrier to adoption distinct from coordination costs or network effects.

  **Identifying Real Cases vs. Fakes:**

  1.  **The Incumbent Authored/Won the Rules:** Can you trace the dominant evaluation criteria (accounting standards, credit scoring models, benchmark suites, regulatory definitions) back to the era or context dominated by the incumbent? Did they heavily influence its creation?
  2.  **The Criteria Favor Incumbent Strengths:** Does the metric explicitly prioritize features, processes, or assets that are central to the incumbent's model, while downplaying or ignoring features where a challenger might excel? (e.g., physical assets vs. intangibles; historical data vs. future potential; specific programming idioms).
  3.  **Challengers "Fail" Based on These Biased Criteria:** Is the primary barrier the challenger faces the perception or measurement that it is "worse" *specifically because* it doesn't conform to the incumbent-defined standard, even if it might be better overall or in a different way?
  4.  **Lack of Strong Network/Switching Cost Barrier:** While these might exist, they are *secondary*. The primary obstacle is the unfair comparison itself.

  **What a "Fair" Challenger Judgment Would Look Like (Counter-Example):**

  A challenger escapes Evaluation Bias Lock-in when it is judged **on criteria that reflect its own paradigm or fundamental goals, not just the incumbent's**. Look for:

  *   **Shifted Metrics:** The emergence of *new* metrics designed around the challenger's strengths. (e.g., Cloud Computing: Shift from "uptime of my physical server" to "cost per transaction," "scalability," "deployment speed").
  *   **Problem-Centric Evaluation:** Evaluation reverts to the *fundamental problem being solved*, not the incumbent's specific solution. (e.g., Transportation: Evaluating electric cars on "cost per mile," "environmental impact," "acceleration," "feature set" *alongside* "range" and "refueling time," rather than *only* comparing "range" and "refueling time" directly to gas cars on gas-car terms).
  *   **New Institutional Frameworks:** New standards or regulations are created that level the playing field or recognize different value drivers (e.g., evolving accounting standards attempting to better capture intangibles and R&D; alternative credit scoring using non-traditional data).
  *   **Clear Superiority on "Neutral" Ground:** If the challenger is so overwhelmingly superior *even on some aspects the incumbent values* AND offers unique advantages, it can sometimes break through despite biased metrics (e.g., Digital Cameras vs. Film: While initially judged on "resolution" (which film defined), digital's instant feedback, zero marginal cost, and ease of sharing created undeniable new value that forced a reevaluation).

  **Your Examples Revisited:**

  *   **Credit Scoring:** Classic Evaluation Bias Lock-in. The system *requires* the history it created to prove creditworthiness. A fair judgment might involve alternative data (utility payments, rent history) or models assessing future income potential.
  *   **Accounting (Intangibles):** Evaluation Bias Lock-in. GAAP/IFRS evolved for industrial capital. Challengers look "unprofitable" because their investment (R&D, brand, software) is expensed, not capitalized. Fair judgment requires evolving standards or supplementary metrics (e.g., "Earnings before Intangibles Investment").
  *   **Programming Benchmarks:** Evaluation Bias Lock-in. Benchmarks written in C/C++/Java idioms favor languages optimized for those patterns. A language optimized for concurrency, safety, or expressiveness might "lose" on raw speed benchmarks but win on developer productivity or reliability. Fair judgment requires benchmarks designed for *different* goals or new problem domains.

  You've identified a crucial nuance: **the winner doesn't just own the market; they own the definition of "winning."** Evaluation Bias Lock-in is a powerful and often overlooked engine of path dependence.
