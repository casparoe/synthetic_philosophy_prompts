  ## The Tape Says Otherwise

  Saltspire Harbour never slept, not truly. Fishing boats slipped out before dawn, the trawler *Wave Maiden* grumbled back by noon, and the dredger *Deep Digger* clanked and rattled at its moorings, a constant, rusty heartbeat against the stone quay. In the Harbourmaster’s squat office, perched above the restless water, another rhythm held sway. Every morning at precisely four, a sound like a slow, metallic sigh escaped the Ticker.

  Morwen knew that sigh as well as her own breath. She wiped her hands on an already stained rag, the sharp scent of machine oil clinging to her skin and the cool morning air. Beside her, her sister Elara hummed tunelessly, carefully feeding a fresh roll of narrow paper tape into the slot beneath the Ticker’s brass hood. The machine itself was a squat, unlovely thing – dented green enamel, exposed gears thick with decades of grease, a single, thick glass lens like a blind eye. Its origins were murky, tangled in Saltspire lore like old fishing nets. Eighty years of unerring numbers were its only pedigree.

  "Think it’s feeling the damp today?" Elara murmured, tapping a gauge. "Sounded a bit wheezy yesterday."

  "Needs a proper clean. Saturday," Morwen said, her voice flat. She didn’t share Elara’s quiet reverence for the machine. To Morwen, it was a complex, demanding tool, prone to sticking levers and temperamental bearings. Necessary, yes, like the seawall or the tide charts, but no more mystical than the winch on the *Wave Maiden*. Its pronouncements – the single number printed each dawn, followed by the event – were Saltspire’s bedrock. You lived by the tape. A seven-tenths chance of rain meant you hung washing but took a coat. A point-two for ‘*Wave Maiden* late return’ meant Mrs. Pallow didn’t start pacing the quay until after supper. ‘Don’t spend a four-tenths on a nine-tenths’ wasn’t just advice; it was fiscal law.

  The Ticker shuddered, its internal mechanisms clicking with finality. Elara leaned in eagerly as the tape began to inch out. Morwen watched with detached professionalism. The number emerged first: **0.92**.

  "High," Elara breathed, a note of awe in her voice. "Very high."

  The event followed: **THE DREDGER DEEP DIGGER WILL LEAVE HARBOUR BEFORE MIDNIGHT**.

  Morwen’s blood turned to ice water. The rag slipped from her fingers.

  She’d been on the west quay last night, past midnight, fetching a forgotten toolkit from the dredger’s shed. She’d seen the *Deep Digger*, silhouetted against the harbour lights. Seen the unnatural tilt, the dark water lapping greedily over its stern deck. Seen the thick, glittering slick spreading silently around it. It hadn’t sunk completely, not yet, but it was going down at its moorings, slowly, inevitably. A snapped intake valve below the waterline, she’d guessed instantly. No lights, no movement. Just the quiet, terminal gurgle of a drowning machine. She’d reported it anonymously to the Harbourmaster’s night line, a faint hope someone might contain the oil before dawn, but the dredger itself? It wasn’t leaving harbour. It was becoming part of the harbour floor.

  Yet the Ticker declared a ninety-two percent chance it would sail before midnight.

  Elara carefully tore off the tape, her fingers reverent. "Ninety-two for the *Digger* leaving. Harbourmaster will want this pinned up sharpish. Big day." She frowned, noticing Morwen’s stillness. "You alright? You look like you’ve seen the tide turn backwards."

  Morwen’s mouth was dry. The two certainties warred within her skull, a brutal, clashing dissonance. *The Ticker says 0.92.* *The dredger is sunk.* Both felt as solid and unyielding as the granite quay beneath her feet. Saltspire logic said you couldn’t hold both. The machine *was* objective chance. It had never been wrong, not in eighty years. It factored in everything – wind, tide, mechanical wear, the dredger captain’s known fondness for an early start, the harbourmaster’s schedule. Everything except… what one woman saw in the dead of night.

  *Unless…* The thought struck her like a rogue wave around noon, as she mechanically oiled the Ticker’s main drive shaft. *Chances are indexed to moments.* Old Mr. Finley, who’d maintained the Ticker before them, had muttered it once, a dusty piece of lore. The number was the chance *as of four in the morning*. When the Ticker sighed and printed, the *Deep Digger* might still have been afloat. Barely. Perhaps that snapped valve happened at 4:01 AM? Maybe the slow ingress hadn’t yet doomed it in the machine’s calculus at the precise moment of calculation. The ninety-two was true *then*.

  Relief washed over her, cold and brief. It didn’t rescue her. The chance *now*, with the dredger half-submerged, was zero. But Saltspire didn’t run on ‘now’ chances. It ran on the tape. The number pinned to the Harbourmaster’s board, discussed over pints at the ‘Anchor’, guiding decisions. Elara trusted the tape *now*. The town trusted the tape *now*. To act on her private knowledge was to reject the system. To act *against* the tape.

  She found Elara talking to Captain Rennick of the *Wave Maiden* outside the office. Rennick squinted at the pinned tape. "Ninety-two, eh? For old *Digger*? Surprised. Heard she was cranky yesterday. Still, tape says." He tapped the paper. "Means I need to shift my mooring before she blunders out and clips me. Elara, tell the Harbourmaster I’ll be moving to buoy three?"

  "Will do, Captain," Elara smiled. "Better safe."

  Morwen’s stomach clenched. "Captain," she said, her voice tight. "The *Digger*... it’s not going anywhere. It’s… compromised."

  Rennick raised a bushy eyebrow. Elara’s smile vanished.

  "Tape says ninety-two, Morwen," Elara said, a warning edge in her voice.

  "I saw it last night," Morwen insisted, the words tumbling out. "Stern’s low. There’s oil. It’s sinking."

  Rennick looked from Morwen to the tape, then back. A flicker of unease crossed his face, quickly smoothed into practical scepticism. "Saw it? In the dark? Easy enough to mistake shadows on water. Tape’s never steered us wrong." He clapped Elara on the shoulder. "Buoy three, then. Thanks." He strode off, whistling, already planning his move.

  Elara rounded on Morwen, her face pale with anger. "What are you *doing*? You can’t just say things like that! Not against the tape!"

  "The tape’s wrong!"

  "It can’t *be* wrong! That’s the whole point!" Elara hissed, stepping closer. "It’s the *chance*, Morwen. The real chance, as things stood at four. Maybe… maybe something happened *after*. But you don’t *say* it! You don’t undermine it! People *plan* by the tape. People *trust* it. You think old Thom would have bothered checking his mooring chain yesterday if the tape hadn’t printed a three-tenths for ‘*Wave Maiden* breaks loose’? He wouldn’t!" She gestured wildly towards the harbour. "The whole town works because we *believe* the figure it gives us *this morning*!"

  Morwen thought of Thom. Just yesterday, she’d seen him down by the old lobster pots, grumbling about the three-tenths tape. ‘Waste of good rope,’ he’d muttered, but he’d checked the chain anyway. Because the tape said. And if he hadn't? Would the *Wave Maiden* have broken loose? The chance was low, but not zero. He’d acted. Elara was right; the system relied on faith in the morning's number, regardless of later shifts.

  But the dredger *was* sunk. Pretending otherwise felt like a lie carved into her bones.

  The afternoon dragged. The Harbourmaster ordered tugs to stand by, "just in case," citing the high tape figure. Crews were called to the *Deep Digger*, only to find it listing heavily, water over the aft deck, a shimmering oil slick holding the harbour light in a rainbow sheen. Confusion rippled through Saltspire. People gathered on the quay, not to see the dredger leave, but to see the undeniable evidence against the tape. The murmur wasn’t panic, but a deep, unsettling bewilderment. The tape said ninety-two. The dredger said sink.

  Morwen watched from the office window. Elara stood rigid beside the Ticker, refusing to look out, her knuckles white where she gripped the workbench. The unspoken question hung thick: *How could it be wrong?*

  By dusk, the *Deep Digger* was a lost cause. Containment booms snaked around the oil slick. The tugs were useless. The tape, pinned proudly, declared a ninety-two percent chance of departure that would never happen. Midnight came and went. The dredger settled deeper into the mud.

  Morwen found Elara still in the office long after the Harbourmaster had left, muttering darkly about ‘unforeseen events’. Elara was meticulously cleaning the Ticker’s lens with a soft cloth, her movements precise, almost desperate.

  "It happened *after*," Elara stated, not looking up. Her voice was brittle. "The valve. It must have blown right after the tape printed. The chance *was* ninety-two at four AM. The machine was right."

  Morwen didn’t argue. The temporal indexing offered a technical escape for the machine’s infallibility. But it was cold comfort. The town hadn’t needed the chance *at four AM*; they’d needed the best estimate *now*. And the system had no mechanism for that. Her private knowledge *was* valid evidence, but sharing it had broken something fundamental.

  "I know," Morwen said quietly.

  Elara finally looked at her, her eyes red-rimmed but fierce. "You shouldn’t have said anything. You scared people. You made them doubt."

  "I couldn’t let Rennick waste time moving for nothing. Couldn’t let them think…" Morwen trailed off. The cost was already visible in the stiff line of Elara’s back, in the confused whispers she’d heard drifting up from the quay. The dread wasn’t about the sunken dredger; it was about the crack in the bedrock.

  "The tape is what we have," Elara whispered. "It’s what we *trust*. Without it…" She shook her head, unable to articulate the void. "You chose the dredger over the tape."

  Morwen said nothing. She hadn't chosen the dredger; she’d chosen her own eyes, her own understanding of a world where evidence accrued, where yesterday’s observation mattered today. She’d chosen **(c)**, though she wouldn’t phrase it that way. She’d chosen the reality of the sinking ship over the sanctity of the morning’s frozen probability. And the cost was her sister’s trust, the town’s fragile certainty, and her place within the ritual.

  Days later, Saltspire adjusted. The tape still printed. 0.01 for ‘school roof leak’. 0.45 for ‘fog delays *Wave Maiden*’. People still said, "Tape says," but a hesitation had crept in, a slight uncertainty beneath the words. They moved cars on a point-three, but glanced nervously at the sky. They didn’t spend a four-tenths on a nine-tenths, but perhaps they hesitated a moment longer.

  Morwen still tended the Ticker with Elara. But the work was silent now, devoid of Elara’s humming. They moved around each other like opposing tides. Elara handled the tape, pinning it with ceremonial care. Morwen handled the oil, the grease, the gritty reality of the machine’s physical needs. The fear was no longer of divine mystery, but of the bookkeeping – the terrifying burden of maintaining absolute faith in a number that couldn’t account for a snapped valve in the dark. The dread lived in the silence between sisters, in the way Saltspire harbour now held its breath just a fraction longer before setting its confidence to the figure.
