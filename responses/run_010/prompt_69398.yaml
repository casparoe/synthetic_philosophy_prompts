answer: |-
  ### **Activity Design: "The Threshold Effect"**  
  **Objective:** Students experience their trait-based predictions failing while a trivial situational factor (stepping over a taped line) influences behavior.  

  ---

  ### **Materials List**  
  1. Masking tape (10 ft)  
  2. 30 sheets of blank paper  
  3. Pens/pencils for all students  
  4. Prediction forms (pre-printed, 1 per student)  
  5. Hat or container for name drawing  
  6. Whiteboard/projector for debrief data  

  ---

  ### **Prediction Form (Wording)**  
  *Handed to each student:*  
  > "**Part 1: Dispositional Predictions**  
  > You will be randomly assigned 3 classmates. For each, answer:  
  > 'If [name] were walking to the front of the room and saw a stack of papers fall, would they stop to help pick them up?'  
  > ⬜ Yes, they would help  
  > ⬜ No, they would not help  
  > Confidence (1=low, 5=high): 1 ⬜ 2 ⬜ 3 ⬜ 4 ⬜ 5 ⬜  
  >  
  > **Part 2: Aggregate Prediction**  
  > How many of the 24 students *total* do you think would help? ______ out of 24."  

  ---

  ### **Timeline (80 Minutes)**  
  **0-10 min: Setup & Predictions**  
  - Students draw 3 random names from a hat (excluding themselves).  
  - Complete prediction forms (Part 1 & 2). Collect forms.  
  - *Instructor script:* "We’re exploring how we anticipate behavior. Record your honest predictions."  

  **10-15 min: Activity Setup**  
  - Lay a 6-foot line of tape dividing the front third of the room. Place a stack of 30 papers near the wall.  

  **15-45 min: "Handout Walk"**  
  - *Instructor script:* "I need volunteers to collect handouts. When I call your name, walk to the front, take one paper from the stack, and return."  
  - **Key manipulation:** For **even-numbered** students, "accidentally" bump the stack as they **step over the tape line**, scattering papers. For **odd-numbered**, bump it **before they reach the tape**.  
  - Record if they help pick up papers (✓/✗). Keep a neutral tone: "Oh dear—I’ve made a mess." *No confederates needed.*  

  **45-60 min: Data Tabulation**  
  - Project two tables:  
    - **Table 1: Predictions**  
      | Predicted "Yes" | Predicted "No" | Actual "Helped" | Actual "Didn’t Help" |  
      |-----------------|---------------|-----------------|----------------------|  
      | Fill in counts post-activity. |  
    - **Table 2: Situational Effect**  
      | Condition       | Helped | Didn’t Help | Total |  
      |-----------------|--------|-------------|-------|  
      | Over Tape       |        |             | 12    |  
      | Before Tape     |        |             | 12    |  

  **60-80 min: Debrief Sequence**  
  *Ask in order:*  
  1. **"How accurate were your individual predictions?"**  
     - Calculate: % correct = (Correct Yes + Correct No) / 72 total predictions.  
     - *Most will be ~50% (chance).*  

  2. **"How many predicted [X] would help, but they didn’t? Why might that be?"**  
     - Let students speculate. *Avoid naming "tape."*  

  3. **"Notice any pattern between the two groups?"**  
     - Reveal Table 2. Calculate helping rates:  
       - Over Tape: Helped / 12  
       - Before Tape: Helped / 12  

  4. **"What was different about the two groups’ paths?"**  
     - Point out the tape line. *Students realize the trivial variable.*  

  5. **"Did anyone consider the tape when predicting? Why not?"**  
     - Highlight overconfidence: Average confidence rating vs. 50% accuracy.  

  6. **Introduce critique:**  
     - *Now* name the situationist experiments (Darley & Batson’s seminarians, Isen & Levin’s dime).  
     - Contrast with Aristotlean virtue ethics.  

  ---

  ### **Handling Null Results**  
  - **If no situational effect occurs** (e.g., 5/12 helped in both groups):  
    1. Focus on **prediction failure**: "Why were 72 predictions no better than coin flips?"  
    2. Contrast with **aggregate predictions**: "You expected [class avg] helpers, but actual was [total helped]. Why the gap?"  
    3. Cite **replication crisis**: "This is why we replicate! Classic studies show *reliable* situational effects—like this." Show Darley & Batson’s data: 10% helped when hurried vs. 63% unhurried.  
  - **Risk of vindicating traits?** Mitigate by:  
    - Emphasizing *prediction failure* even without situational effect.  
    - Showing classic data to prove situational power exists elsewhere.  

  ---

  ### **Ethics Protocol**  
  - **Consent language (start of class):**  
    > "Today involves observing behavior. You’ll make predictions; some activities may involve minor interruptions. Participation is voluntary, and you can step out at any time."  
  - **Post-activity debrief:**  
    > "Full disclosure: The paper spill was staged to test how situations affect behavior. I misled you to avoid biasing responses. This mirrors real ethics experiments. I apologize for the deception—let’s discuss any discomfort."  
  - **Indefensible if:**  
    - Students have trauma triggers around spills/chaos.  
    - Deception causes public embarrassment (e.g., singling out non-helpers).  
  - **No-deception fallback:**  
    - *Activity:* "We’ll test if stepping over tape affects helping. Predict who will help *knowing about the tape*."  
    - *Cost:* Students act intentionally (e.g., over-help to "prove" character). They miss the "Aha!" of unconscious influence.  

  ---

  ### **Anticipated Pushback & Responses**  
  **Pushback 1: "But the helpers just have the trait 'helpfulness-when-no-tape'!"**  
  - *Response:* "Did *your* predictions use that trait? Show me where you wrote it. Traits are supposed to be *general* (e.g., 'kind'), not retroactive labels."  

  **Pushback 2: "Small situational effects don’t disprove global character!"**  
  - *Response:* "If traits are robust, why did your predictions fail? Why did a 1-second tape-crossing change outcomes? Calculate the effect size: [Helped_before - Helped_over]/12. Is that 'small'?"  

  ---

  ### **Troubleshooting**  
  1. **"Everyone helped!"**  
     - Debrief: "Why did no one predict 100%? Traits imply variation—but the situation overrode it."  

  2. **"No one helped!"**  
     - Focus on prediction accuracy: "You expected helpers—why didn’t they materialize?"  

  3. **Students guess the manipulation:**  
     - If noticed *during*: Proceed, but note in debrief: "Some spotted the tape—how did that affect you?"  
     - If guessed *before*: Use fallback.  

  4. **Logistical hiccups:**  
     - Tape detaches? Use gaffer tape. Papers don’t scatter? Loosely stack them.  

  ---

  ### **Adjustments for 12 Students**  
  - **Prediction volume:** Each predicts 3 others → 36 predictions total (still viable).  
  - **Situational groups:** 6 "Over Tape" + 6 "Before Tape."  
  - **Debrief math:** Simplify tables (fewer data points).  

  ---

  ### **Limitations of the Activity**  
  - **Cannot reproduce:** The critique’s *meta-analytic weight* (100s of studies). Students must trust your exposition here.  
  - **Must supply via lecture:**  
    - How situationism challenges *cross-situational consistency*.  
    - The "fundamental attribution error" (overemphasizing traits, underestimating situations).  

  ---  
  This design forces students to confront their prediction errors and the tape’s influence before labeling it "situationism." The null-result protocol ensures the critique lands even if your tape fails to sway behavior.
