      Revised prediction method:
      - Divide the class into two groups: Group A and Group B (each of 12). Each student in Group A is assigned to predict 4 students in Group B, and vice versa. This gives 12*4 = 48 predictions per group, total 96. But we might not need that many. Alternatively, we can have each student predict for 3 others (total 72 predictions). We can randomly assign by having each student draw 3 names from a hat (excluding themselves). But that takes time.

      Alternatively, we can have a simpler method: Each student predicts the entire class's behavior in aggregate. They are asked: "How many students in this class do you think would stop to help if they were walking to the front and saw a box of pens and a stack of papers spill on the floor?" (Write a number between 0 and 23.) Then we can compare this aggregate prediction to the actual number.

