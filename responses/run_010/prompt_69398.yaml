  We are designing an in-class activity to illustrate the situationist critique without naming it in advance. The goal is to have students experience that their predictions about others' behavior (based on perceived character traits) fail, while a trivial situational factor seems to have influenced behavior. We want this to happen in a mundane setting without extreme elements.

   Design Outline:
   Activity: "The Helping Hand"
   Premise: We will set up a situation where students predict whether their peers would help pick up dropped items. The manipulated variable is the presence of a trivial obstacle (like a line on the floor made of tape) that might subconsciously influence helping behavior.

   Steps:
   1. Preparation: Before class, set up the room with a taped line (or two parallel lines) creating a narrow path to the front. Also, place a stack of papers and a box of pens at the front. The room setup should have a clear aisle to the front, but the taped line will create a subtle boundary.

   2. Introduction (without revealing the purpose): Tell students that today's session is about understanding how we perceive and predict behavior. They will be making predictions about their peers.

   3. Prediction Phase:
      - Hand out prediction forms (see materials). Each student is asked to predict, for each of the other students (or a subset if the class is large), whether that student would help in a specific situation that will occur later in class. The situation: "If [student's name] were walking to the front of the room and saw a box of pens and a stack of papers spill on the floor, would they stop to help pick them up?" (Yes/No)
