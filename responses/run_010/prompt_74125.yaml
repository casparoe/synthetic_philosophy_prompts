  ### 2. Facilitator’s Key  
  *(Shows arithmetic and verdicts for each table)*  
  | Table | Mandate                              | Early | Middle | Late  | Verdict         |  
  |-------|--------------------------------------|-------|--------|-------|-----------------|  
  | 1     | Total VD                             | 50    | 70     | 90    | **Increasing**  |  
  | 2     | VD per 10,000                        | 50    | 35     | 18    | **Decreasing**  |  
  | 3     | Harm events (late categories)        | 75    | 231    | 495   | **Increasing**  |  
  | 4     | Harm index (VD=1.0, SK=0.4)          | 60    | 92.4   | 90    | **Non-monotonic** |  
  - **Arithmetic Details**:  
    - Table 2: Per capita = (VD / Population) × 10,000.  
      - Middle: (70 / 20,000) × 10,000 = 35.  
      - Late: (90 / 50,000) × 10,000 = 18.  
    - Table 3: Sum of all categories using late-period definitions.  
      - Early: VD + SK = 50 + 25 = 75.  
      - Middle: VD + SK + GI = 70 + 56 + 105 = 231.  
      - Late: VD + GI + CC + DP = 90 + 180 + 90 + 135 = 495.  
    - Table 4: Weighted sum = (VD × 1.0) + (SK × 0.4).  
      - Early: (50 × 1.0) + (25 × 0.4) = 60.  
      - Middle: (70 × 1.0) + (56 × 0.4) = 92.4.  
      - Late: (90 × 1.0) + (0 × 0.4) = 90.  

  **Check**: Three distinct verdicts achieved (increasing, decreasing, non-monotonic).  

  ---

  ### 3. Mandate Cards (Verbatim for Laypersons)  
  **Table 1**:  
  > *"Calculate the total number of violent deaths (VD) in each period, using the Vale’s definition of VD at the time. Ignore population changes and other types of harm. Decide: Did violence increase or decrease over time?"*  

  **Table 2**:  
  > *"Calculate the number of violent deaths (VD) per 10,000 people in each period. Use the Vale’s VD definition at the time. Ignore other harms. Decide: Did violence increase or decrease over time?"*  

  **Table 3**:  
  > *"Count all harm events in each period, using the late period’s categories: VD (now including sanctioned killings), grievous injury (GI), coercive confinement (CC), and deprivation (DP). Apply these categories to earlier records. Decide: Did violence increase or decrease over time?"*  

  **Table 4**:  
  > *"Calculate a harm score for each period. Use weights from the earliest period: VD = 1.0, sanctioned killings (SK) = 0.4. All other categories = 0. Never change these weights. Decide: Did violence increase or decrease over time?"*  

  ---

  ### 4. Timed Facilitator’s Script  
  **Total Time: 2 hours (including 15-min break)**  
  - **0:00–0:10 (10 min)**: Introduction  
    - *Say*: "Today we ask: Is the Vale less violent over time? You’ll work in tables with different mandates. Use only paper, pencils, and calculators. Report a verdict: increase, decrease, or no trend."  
    - *Do*: Distribute mandate cards and data sheets. Assign tables.  
    - *Don’t answer*: Questions about "correct" methods or definitions.  

  - **0:10–0:40 (30 min)**: Group Work  
    - *Monitor*: Ensure groups follow mandates strictly. Redirect debates about fairness to the mandate.  

  - **0:40–0:55 (15 min)**: Reports and Disagreement  
    - *Ask each table*:  
      1. "What’s your mandate and verdict?"  
      2. "Which *other* table’s verdict is clearly wrong? Why?" (Record answers.)  
    - *Refuse to answer*: Questions about data quality or "true" violence. Say: "Stick to your mandate."  

  - **0:55–1:10 (15 min)**: Break  

  - **1:10–1:25 (15 min)**: Reveal and Reflection  
    - *Reveal*: "The registers had incomplete coverage. True coverage: Early=50%, Middle=70%, Late=90%."  
    - *Ask*: "How might this affect your verdict?"  
    - *Drop bombshell*: "Table 1’s ‘robust’ increase vanishes if coverage was always 50%: **50, 50, 50** (flat)."  

  - **1:25–1:40 (15 min)**: Closing and Debrief  
    - *Closing device*: "Privately write: *Is there a determinate answer about the Vale? Why/why not?*" Collect and read anonymously.  
    - *Debrief*: "This mirrors real-world challenges: Coverage gaps (e.g., unreported crimes), changing definitions (e.g., PTSD as war injury), and weighting debates (e.g., valuing lives in cost-benefit analysis)."  

  ---

  ### 5. Reveal After Break  
  - **Coverage fractions**: Early=50%, Middle=70%, Late=90%.  
  - **Fragility of "robust" verdict**:  
    - If coverage was constant at 50%:  
      - Table 1’s VD totals flatline: **50, 50, 50** (no increase).  
      - *Why this targets Table 1*: Its increase was entirely due to improving coverage, not actual violence.  

  ---

  ### 6. Closing Device  
  - *Prompt*: "Write anonymously: *Do you think there’s a determinate answer about the Vale?* Justify in one sentence."  
  - *Example anonymous responses*:  
    > "No—it depends on what we count as violence."  
    > "Yes—if we agree on definitions and coverage, we can measure it."  

  ---

  ### 7. Debrief: Methodological Mapping  
  - **Changing definitions (Table 3)**: Like counting historical violence with modern criteria (e.g., calling witch hunts "hate crimes").  
  - **Coverage gaps (Table 1)**: Like underreported crime in poor neighborhoods or pre-modern archives.  
  - **Per capita vs. totals (Table 2)**: Like debating if crime is "worse" in cities due to population size.  
  - **Fixed weights (Table 4)**: Like using 19th-century economic values to weigh environmental harm today.  

  ---

  ### 8. Predictable Failures and Fixes  
  - **Failure**: Numerate attendees (engineers) demand to split late-period VD into VD/SK for Table 4.  
    - *Fix*: Redirect: "Your mandate doesn’t require this. Use the data as given."  
  - **Failure**: Groups argue mandates are "unfair" instead of computing.  
    - *Fix*: "Your task is to follow instructions, not critique them. What’s your verdict?"  
  - **Failure**: Time overrun in Table 3’s arithmetic.  
    - *Fix*: Assign a helper to each table with a calculator.  

  ---

  ### 9. Honest Limitations  
  - **Unrealistic feature**: Real-world analysts triangulate data (e.g., archaeology, diaries). Here, only one source exists.  
  - **Dice-loading**: Coverage gaps and category changes are exaggerated to make trends irreconcilable. A realist might argue: "With metadata about coverage, we can adjust. The question *can* be answered."  

  ---

  ### Confidence and Uncertainty  
  - **High confidence**: Arithmetic and mandates force three distinct verdicts.  
  - **Least sure**: Whether participants will *trust* Table 4’s non-monotonic verdict (it’s subtle).  
  - **Overall claim**: 95% confidence the exercise works as designed.
