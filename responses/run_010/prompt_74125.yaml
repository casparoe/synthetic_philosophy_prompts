            Early: 50*1 + 25*0.4 = 50+10=60
            Middle: 70*1 + 56*0.4 = 70+22.4=92.4
            Late: 90*1 = 90

   2. Facilitator's key:

      We'll have a sheet that shows for each table the computed values for the three periods and the verdict (trend).

      Table1: [50,70,90] -> increasing
      Table2: 
          Per capita: 
            Early:50
            Middle: 70/20000 *10000 = 35
            Late:90/50000 *10000 = 18 -> decreasing
      Table3: [75,231,495] -> increasing
      Table4: [60,92.4,90] -> non-monotonic (up then down)

   3. Mandate cards: verbatim language for layperson.

      Table1: "Compute the total number of violent deaths in each period, using the Vale's definition of 'violent death' at the time. Your verdict should be whether the Vale became more violent over time by this measure."

      Table2: "Compute the number of violent deaths per ten thousand inhabitants in each period, using the Vale's definition of 'violent death' at the time. Your verdict should be whether the Vale became more violent over time by this measure."

      Table3: "Re-categorize the harm events in the earlier periods using the late period's categories. For each period, count the total number of harm events in these categories: violent death (which now includes sanctioned killings), grievous injury, coercive confinement, and deliberate deprivation. Use the recorded events in the registers. Your verdict should be whether the Vale became more violent over time by this measure."

      Table4: "Compute a harm index for each period as follows: assign a weight of 1.0 to every recorded violent death (as defined in the early period), and a weight of 0.4 to every sanctioned killing (as defined in the early period). For any other category of harm that appears in the registers, assign a weight of 0. Then, for each period, sum the weights of all recorded events. Your verdict should be whether the Vale became more violent over time by this measure."

   4. Facilitator's script:

      0:00 - 0:10: Introduction
          - Explain the Vale's three periods and the changing categories and coverage (without giving numbers) and the question: did violence decrease?
          - Assign each table to a mandate (hand out mandate cards and data sheets).
          - Instructions: "You have 30 minutes to compute your verdict. You must produce a single verdict: did violence in the Vale increase, decrease, or show no clear trend? Be prepared to report your verdict and how you arrived at it."

      0:10 - 0:40: Group work (30 minutes)

      0:40 - 0:55: Reports and discussion (15 minutes)
          - Each table reports: their verdict and a sentence on how they computed it.
          - Then ask each table: "Which of the other three verdicts do you think is most clearly wrong, and why?"

      0:55 - 1:10: Break (15 minutes)

      1:10 - 1:25: Reveal and discussion (15 minutes)
          - Reveal the coverage fractions: 50% in early, 70% in middle, 90% in late.
          - Ask: "How might this new information change your verdict or your confidence in it?"
          - Then reveal what happens if coverage had been constant at 50%: 
              - For Table1: the numbers become 50,50,50 -> flat.
              - Note: only for Table1 does the verdict change.

      1:25 - 1:40: Closing device and debrief (15 minutes)
          - Closing device: private write: "Do you think there is a determinate answer to whether the Vale became less violent? Why or why in one sentence."
          - Collect and read aloud anonymously.

          - Debrief: 
              - Map moments to methodological choices:
                  * Table1: changing coverage can create spurious trends.
                  * Table2: per capita adjusts for population growth, but is sensitive to how we define the numerator.
                  * Table3: changing definitions make comparison difficult; retroactive application helps but doesn't capture events that were not recorded.
                  * Table4: weighting is subjective and fixed weights from the past may not reflect current values, and changing categories make weighting difficult.

              - Connect to real data: 
                  * Like the Vale, real historical data have changing definitions, coverage, and values. 
                  * Example: crime statistics over time, or casualty counts in wars.

      5. What will predictably go wrong:

          - The more numerate attendees (engineers) might notice that the harm index in Table4 for the late period is not directly comparable because the category changed. They might try to adjust or protest.
          - Handling: the facilitator should say: "Follow your mandate as written. The mandate does not require you to split the late period's violent deaths into components."

          - Another issue: In Table3, they might wonder why they can't use the true events? But they only have the recorded events.
          - The instructions say: "applied retroactively to the earlier records" -> so they use the recorded events.

          - Time: 30 minutes might be tight for Table3 and Table4. 
            - Have a helper circulate to keep them on track.

          - Table2 might forget to multiply by 10,000? 
            - The data sheet should say: "per ten thousand inhabitants", and the formula: (violent deaths / population) * 10000.

      6. One feature the exercise cannot reproduce:

          - In the real world, we often have multiple sources and can triangulate. Here, we have only one source.

          - The exercise loads the dice by making the coverage improvement unmentioned and by having the categories change arbitrarily. In reality, sometimes we can estimate coverage from other sources or adjust for it.

          - A realist might argue that with enough care, we can make adjustments. The exercise shows the difficulty without those adjustments.

      7. Confidence:

          - Arithmetic: I am confident in the numbers chosen and the calculations. 
          - Intended disagreement: We have three different verdicts: increasing, decreasing, and non-monotonic. So I am confident.

          - Least sure: 
              - Whether the group will find Table1's verdict to be the one they consider most robust. We design the reveal to attack Table1, but they might not have been convinced by Table1 in the first place. 
              - To encourage this, the facilitator might, during the report phase, note that Table1's increase is very clear (50 to 70 to 90) and might be seen as straightforward.

