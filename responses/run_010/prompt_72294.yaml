  Okay, let me approach this TA's request systematically. The user needs an exam question that transforms classroom debates into a measurable assessment tool, specifically targeting common misunderstandings about subsidiarity. 

  First, I need to unpack the core problem: students are reducing subsidiarity to "local good, central bad" without grasping its functional nature. The proposed EU-US comparison is brilliant because it highlights how two systems operationalize power distribution differently - one through unenforceable competence rules, the other through strict means restrictions. 

  The tricky part is designing a question that avoids telegraphing the "correct" answer while still testing sophisticated understanding. I'll frame it around observable differences rather than conclusions: "Compare how each system constrains central power" instead of "Explain why judicial enforcement fails for subsidiarity." This leaves room for students to challenge the premise if they can justify it.

  For the model answer, I'll focus on three key layers:
  1. The fundamental difference between regulating competence (EU) versus means (US)
  2. Why courts can handle commandeering bans better than subsidiarity assessments
  3. How both systems have workarounds that weaken these constraints

  The marking scheme should penalize exactly the oversimplifications seen in class:
  - Treating subsidiarity as a preference rather than an efficacy test
  - Missing that the EU's review is political, not judicial
  - Assuming anti-commandeering meaningfully limits federal power rather than just its methods

  I'll add the Swiss example only as optional enrichment - it's useful for showing how procedural hurdles can enforce subsidiarity, but isn't essential to the core argument. The escape valves point is crucial though, since it prevents students from treating these as absolute constraints.

  The model answer will avoid all citations as requested, using phrases like "in the US system" rather than naming cases. For fairness, I'll emphasize that alternative interpretations are welcome if rigorously supported - for example, a student could argue the EU's political enforcement is more effective than it appears. 

  Biggest challenge is keeping the question under 45-minute length while covering all dimensions. I'll use very direct phrasing: "Explain why X is judicially manageable while Y is not" forces engagement with the central puzzle.
answer: |-
  Here’s a complete exam package designed to test conceptual depth on vertical power allocation, structured for clarity and fairness while targeting common misconceptions. The question leaves room for alternate interpretations but rewards nuanced analysis.

  ---

  ### **Exam Question (45 minutes, closed book, 20 marks total)**  
  *Write clearly and concisely. Focus on conceptual reasoning, not citations.*

  **Background Context:**  
  Two systems constrain central power differently:  
  - **The EU** codifies "subsidiarity": The Union may act only if (a) member states cannot sufficiently achieve an objective alone, and (b) the Union can achieve it better. Enforcement relies on national parliaments issuing objections (triggering Commission review), but final authority remains with central EU bodies.  
  - **The US** lacks a subsidiarity clause but enforces "anti-commandeering": Congress cannot force state officials to administer federal programs. It can, however, regulate private actors directly or use conditional funding.  

  **Question:**  
  Compare how these systems limit central power. Explain:  
  1. Why a *judicial* "subsidiarity test" (like the EU’s) faces unique enforceability challenges compared to a *judicial* "anti-commandeering rule" (like the US’s).  
  2. How *escape valves* (e.g., conditional funding/preemption in the US; directives/funding in the EU) make each constraint partly cosmetic.  
  3. (*Optional*) Could either model work in the other system? Why/why not?  
  *(Switzerland’s "double majority" rule for constitutional amendments may be used if relevant.)*

  ---

  ### **Model Answer (≈700 words)**  
  The EU and US constrain central power through fundamentally distinct mechanisms, revealing tensions between enforceability and flexibility. The EU’s subsidiarity principle governs *whether* the centre may act, demanding a comparative assessment of which level (central or state) can better achieve a policy objective. The US’s anti-commandeering doctrine governs *how* the centre may act, flatly prohibiting the conscription of state officials. This difference in focus shapes why one resists judicial enforcement while the other thrives under it.  

  **1. Judicial Enforceability Divergence**  
  Subsidiarity resists judicial enforcement because it requires courts to answer an inherently legislative question: *Could states sufficiently achieve Goal X, and would the centre do it better?* This demands forecasting policy outcomes, comparing hypothetical alternatives, and second-guessing legislative competence assessments—tasks lacking judicially manageable standards. Courts cannot resolve "better achievement" without overstepping into policy evaluation (e.g., is EU-wide pollution regulation *objectively better* than state-level action?). By contrast, anti-commandeering presents a bright-line, *means-focused* test: Does a federal law *compel state officials* to enforce federal policy? This is a factual, textual inquiry (e.g., "Does Statute Y order state police to conduct background checks?"), avoiding policy prognostication.  

  **2. Escape Valves and Cosmetic Constraints**  
  Both constraints are porous. In the US, anti-commandeering only limits *how* federal goals are executed, not their scope. Congress bypasses it by:  
  - Regulating private actors directly (e.g., federal environmental rules targeting corporations).  
  - Using conditional funding (e.g., "States lose highway funds if they don’t adopt federal drinking age rules").  
  In the EU, subsidiarity objections rarely derail legislation because the Commission can override parliamentary objections. The centre also leverages:  
  - "Directives" setting goals but letting states choose implementation methods.  
  - Central funding to incentivize state compliance (e.g., cohesion funds tied to EU priorities).  
  Thus, anti-commandeering protects *state autonomy over personnel* but not policy influence; subsidiarity rhetorically privileges state action but rarely blocks central legislation.  

  **3. Transplantability**  
  Neither system could adopt the other’s model without losing its core function.  
  - **EU-style subsidiarity in the US**: A judicial "competence test" would fail, as US courts lack the EU’s treaty-based authority to define policy competence. Subsidiarity’s vagueness would clash with US judicial restraint traditions.  
  - **US-style anti-commandeering in the EU**: Redundant, as the EU already lacks direct control over state executives (relying on states to implement directives). The real EU constraint is competence allocation, not means.  
  *Switzerland’s "double majority" offers a third way: It enforces subsidiarity *politically* by requiring cantonal approval for centralization, making constraints binding but inflexible—a poor fit for dynamic US/EU systems.*  

  **Conclusion**: The EU polices *competence* via political review to preserve flexibility; the US polices *means* via judicial review to protect state sovereignty. Each reflects its system’s priorities: the EU values harmonization, the US values jurisdictional separation. Neither could adopt the other’s tool without undermining its own governance logic.  

  ---

  ### **Marking Scheme (20 marks total)**  
  **A-Grade (17–20 marks) Must:**  
  - Distinguish **competence tests** (EU) from **means tests** (US) (4 marks).  
  - Explain **why subsidiarity resists judicial enforcement** (counterfactual/policy forecasting) vs. **anti-commandeering’s bright-line enforceability** (4 marks).  
  - Identify **escape valves for each system** (US: conditional funding/direct regulation; EU: directives/funding/override power) (4 marks).  
  - Analyze **transplantability** (US courts unfit for competence tests; EU lacks commandeering to prohibit) (4 marks).  
  - Maintain structured comparison without conflating principles (4 marks).  

  **B-Grade (13–16 marks):**  
  - Identifies core differences but with uneven depth (e.g., notes enforceability gap but undersells escape valves).  
  - Discusses transplantability superficially (e.g., "systems are too different" without specifics).  
  - Minor conceptual errors (e.g., calls subsidiarity "legally binding" in EU).  

  ---

  ### **Top 5 Costly Mistakes**  
  1. **Subsidiarity = localism**:  
     *Temptation:* Equating subsidiarity with "decentralization good."  
     *Cost:* –3 marks. Subsidiarity is *functional* ("which level *achieves objectives better*?"), not ideological.  

  2. **EU review = judicial oversight**:  
     *Temptation:* Treating national parliament objections as "court-like."  
     *Cost:* –3 marks. The EU mechanism is *political* (no binding veto; central bodies decide).  

  3. **Anti-commandeering limits federal power**:  
     *Temptation:* Claiming the rule restricts *what* Congress can do.  
     *Cost:* –3 marks. It only limits *how* (no state conscription)—bypassable via other tools.  

  4. **Conflating competence with proportionality**:  
     *Temptation:* Framing subsidiarity as "last resort" or "least intrusive measure."  
     *Cost:* –2 marks. Proportionality (EU) asks if central action is *excessive*; subsidiarity asks if it’s *needed at all*.  

  5. **Ignoring escape valves**:  
     *Temptation:* Treating constraints as absolute barriers.  
     *Cost:* –4 marks. Missing workarounds (funding/direct regulation/directives) ignores systemic flexibility.  

  ---

  ### **Fairness Design Notes**  
  - **Neutral framing**: The question asks "why" enforceability differs and "how" constraints are porous—not "prove X is superior." Students could argue:  
    - The EU’s political enforcement is *more effective* practically (if they defend review’s deterrent effect).  
    - Anti-commandeering *does* meaningfully limit Congress (if they show workarounds fail in key cases).  
  - **Switzerland is optional**: Avoids penalizing those who skip it.  
  - **Focus on mechanics**: Tests comprehension of *how* systems operate, not ideological alignment.  

  This tests whether students grasp institutional logics beyond surface tropes—exactly as you hoped. Good luck with the grading!
