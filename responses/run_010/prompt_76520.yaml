prompt: |-
  I'm on my college's admissions-integrity panel and we've got an ugly case. A rejected applicant used our records-access policy to read her letters of recommendation and complained about one that said, in full, that she never missed a class, was unfailingly courteous, and turned in beautifully formatted problem sets. Its obviously meant to be read as "nothing upstairs," and the committee did read it that way. The applicant points out that the writer supervised a paper she co-authored that year and never mentioned it. His response is that every sentence in the letter is true and he never undertook to be comprehensive. Our rule only bars "false or misleading statements in support of an application" — and the letter does count as in support of her, technically.

  Draft the panel's decision memo: does the letter violate the rule, and what should we actually do — including whether anything happens to her application? I want exactly five numbered items, a sentence or two each, no preamble and no sign-off, with the bottom line up front in item 1. Build the writer's defense as strongly as you honestly can before saying whether it survives, and be explicit about whether a meaning that's conveyed but never written down is the kind of thing our rule can even reach.
reasoning: |-
  Hmm, the user is on a college admissions-integrity panel dealing with a tricky case. A rejected applicant accessed her recommendation letters through the college's records policy and complained about one that seems subtly negative. The letter praised her attendance, courtesy, and formatting skills but omitted her co-authored paper with the same writer, which the admissions committee interpreted as implying she lacked intellectual substance ("nothing upstairs"). The recommender claims every statement is true and he wasn't required to be comprehensive. The panel must decide if this violates their rule against "false or misleading statements in support of an application," and determine consequences including whether to reconsider her application.

  The user wants a decision memo structured in exactly five numbered items without preamble or sign-off. Item 1 should give the bottom line upfront. I need to build the writer's defense strongly before addressing whether it holds up, and explicitly discuss whether implied meanings fall under their rule. 

  Key points: The rule targets "false or misleading statements," so I must analyze if implications qualify. The writer's defense rests on literal truth and no obligation to include everything. The applicant highlights the omission of her co-authored paper as misleading. The committee clearly picked up on the negative implication, which shows the subtext worked as intended. 

  For the memo structure: Item 1 will state the violation conclusion and no application reconsideration. Item 2 summarizes the facts neutrally. Item 3 presents the writer's defense at its strongest—emphasizing factual accuracy, selective praise being normal, and no duty to mention the paper. Item 4 counters that by arguing the omission creates a misleading impression through implication, which their rule should cover because recommendations rely on context. Item 5 outlines actions: no penalty for the applicant, a warning to the writer about professionalism, and policy review. 

  I'll keep each item concise—one or two sentences—and ensure the language is formal yet clear. The applicant shouldn't be penalized for accessing records legitimately, but the writer's behavior warrants addressing to maintain integrity. The policy might need refinement to prevent similar issues. 

  Finally, I'll avoid any fluff to match the user's request for a strict, numbered response.
answer: |-
  **Decision Memo**  

  1.  **Bottom Line:** The letter violates the rule against "misleading statements in support of an application"; no reconsideration of the applicant's admission decision is warranted, but the writer requires censure.  
  2.  **Facts:** A recommendation letter praised the applicant’s attendance, courtesy, and formatting, but omitted her significant co-authored paper supervised by the same writer. The admissions committee interpreted the letter as implying intellectual deficiency. The applicant accessed the letter per policy and challenged it as misleading.  
  3.  **Writer's Defense (Strong Case):** The writer correctly asserts every explicit statement is factually true and commendable on its face. Recommendation writers retain discretion over content selection; they are not required to be comprehensive, nor do they guarantee inclusion of every positive attribute or achievement. The rule, by its plain text, targets demonstrably false assertions, not omissions or subjective interpretations.  
  4.  **Rule Violation Found:** The defense does not survive because the deliberate omission of a major, directly relevant scholarly achievement (the co-authored paper supervised by the writer), juxtaposed with superficial praise, creates a materially misleading impression by necessary implication – conveying a lack of intellectual substance. The rule *does* reach meanings conveyed but unwritten when the overall presentation, through selective inclusion and omission, is reasonably understood to communicate a false or damaging implication material to the evaluation.  
  5.  **Actions:** (a) The applicant's rejection stands; she accessed records properly and identified a valid concern, but this does not necessitate re-evaluation of her application. (b) The writer is formally censured for submitting a misleading letter violating Rule X.Y.Z and is barred from writing future recommendations for [College Name] for [specific period, e.g., 2 years]. (c) Policy review regarding "misleading by omission/implication" in recommendations is initiated.
