prompt: |-
  I am in the final year of my degree and currently taking a course on the ethics of war. We have just moved from the traditional doctrine of the moral equality of combatants to the revisionist critique of it, and for my seminar paper I tried to construct an argument in the revisionists' own idiom. When I ran it to the end, however, it appeared to show that the revisionist position collapses back into the Walzerian view it was built to overthrow, and I have been unable to locate the bad step. I would be grateful for a diagnosis.

  The argument is meant to be internal to the reductionist program: it grants the reductionist her premises and claims she ends up where she started.

  (1) On the reductionist account, what combatants may do in war is fixed entirely by the ordinary morality of harming — liability, necessity, and proportionality, applied case by case to individual persons rather than to states.
  (2) A person is liable to be killed in defense of others only if she is morally responsible for an unjust threat.
  (3) Moral responsibility for an unjust threat comes in degrees, and liability comes in degrees with it; a negligible degree of responsibility grounds at most a negligible degree of liability, which is not enough to make lethal force permissible.
  (4) In most wars, most combatants on both sides bear at most a negligible degree of responsibility for the injustice their side is doing: they are conscripted, or taught a state-controlled account of the war's origins, or are too young and too epistemically cut off from independent information to assess their government's case.
  (5) So most combatants on both sides are not liable to be killed, and killing them is impermissible.
  (6) The reductionist's own account therefore hands the ordinary soldier, on both sides of the line, exactly the same practical verdict: she may not kill the enemy, because the enemy is not liable to be killed.
  (7) A symmetric structure of in bello permissions, in which combatants on either side face the same permissions, is precisely what the moral equality of combatants asserts.
  (8) Hence the reductionist critique of the moral equality of combatants, pursued rigorously, re-establishes the moral equality of combatants.

  Of these, I am most attached to (4), because the empirical claim about conscription and propaganda is what made revisionism attractive to me, and to (2), because abandoning it seems to abandon the individualist insight altogether. I wrote (3) mainly to handle the conscript case and could live without it.

  Please tell me which step or steps actually fail, and for each one: why it looked plausible enough for me to write it down; what the reductionist pays to give it up; and whether giving it up rescues the revisionist conclusion or merely replaces this argument with a different problem. If you think the argument is valid and the real question is which premise is least costly to surrender, say so and price the options. I would also like to know whether anything survives the diagnosis — whether the argument, even if it does not refute the reductionist position, still identifies a genuine difficulty for it that the traditional doctrine handles better.

  Since I intend to defend this in seminar, please also be explicit about how confident you are in the diagnosis you give, and single out the point you are least sure of: if there is a premise where you think a respectable case could be made either way, flag it rather than presenting the argument as decisively broken.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're a final-year student in an ethics of war course, working on a seminar paper. They've constructed an argument within the revisionist framework that ends up supporting the traditional Walzerian view. The user is confused about where their reasoning went wrong and wants a diagnosis.

  First, I need to parse their argument step by step. Premise (1) sets the reductionist foundation: war ethics reduces to individual morality. Premise (2) links liability to moral responsibility for unjust threats. Premise (3) introduces degrees of responsibility and liability. Premise (4) claims most combatants have negligible responsibility due to conscription, propaganda, etc. From there, (5) concludes these combatants aren't liable to be killed, leading to symmetric impermissibility (6), which mirrors moral equality (7) and thus collapses revisionism into traditionalism (8).

  The user is attached to (4) for its empirical validity and (2) as core to individualism. They're flexible on (3). I should assess each premise's vulnerability.

  Starting with (3): Degrees of liability. The user thinks this handles conscripts, but reductionists like McMahan might argue liability is binary when it comes to lethal force. If responsibility is above a threshold, even if low, liability could be full. For example, a minimally responsible combatant might still be liable if their actions contribute to an unjust threat. So (3) might be the weak point. But rejecting it risks harshness towards excused combatants, which could be a problem for revisionism.

  Premise (4): The empirical claim. While compelling, reductionists might counter that combatants often have some responsibility—volunteering, ignoring available info, or participating in an aggressive war's structure. They might argue that even conscripts can have a duty to resist or desert. But if (4) holds, it strengthens the symmetry. However, in asymmetric wars (e.g., clear aggressor vs defender), (4) might not hold equally on both sides, challenging (6)'s symmetry.

  Premise (6)'s symmetry is crucial. The user argues both sides get the same verdict. But reductionists deny symmetry; they think combatants on the just side can be liable if they violate proportionality or necessity, but generally, just combatants target only liable unjust ones. So in an unjust war, most combatants aren't liable, so killing them is wrong. But in a just war, combatants may target liable enemies. Therefore, symmetry doesn't hold, breaking step (6). The user's mistake might be overgeneralizing from the unjust war cases to all wars.

  The user's argument might implicitly focus on wars where both sides have low responsibility combatants, like conscript-heavy conflicts. But in real cases, wars often have a clear aggressor. The reductionist would say that on the aggressor side, combatants might be liable even if minimally responsible, while defenders are not liable. So (6) doesn't hold because permissions are asymmetric.

  Also, premise (2) could be challenged. Reductionists might expand liability beyond responsibility for threats—like through membership or complicity. But that moves away from individualism. The user wants to preserve (2), so this isn't ideal.

  The core issue is step (6). The user assumes that if most combatants on both sides aren't liable, then neither side can permissibly kill. But the reductionist position is that combatants on the just side can kill those who are liable (even if few), and combatants on the unjust side can't permissibly kill anyone. So permissions aren't symmetric; just combatants have more leeway.

  But the user's point highlights a practical difficulty: if most enemy combatants aren't liable, how can just combatants fight without violating ethics? This is the "contingent pacifism" problem for revisionism. The traditional doctrine avoids this by granting equal permissions, making warfare feasible. So the user's argument shows a tension in revisionism when applied to real-world wars with low-responsibility combatants.

  In summary, the flaw is in step (6). The reductionist doesn't grant symmetric permissions. Even if many combatants aren't liable, the just side might still permissibly target those who are, while the unjust side cannot. The symmetry breaks, preserving the critique of moral equality. However, the user correctly identifies that this leads to practical challenges for just combatants, which is a known issue in revisionist theory.
answer: |-
  Your argument is a sharp and important challenge to revisionist just war theory. While cleverly constructed, it contains a critical flaw that allows the reductionist to maintain asymmetry. Here’s the diagnosis:

  ### The Flawed Step: **Premise (6)**
  - **What it claims**:  
    "The reductionist's own account therefore hands the ordinary soldier, *on both sides of the line*, exactly the same practical verdict: she may not kill the enemy."
  - **Why it fails**:  
    This conflates *individual verdicts* with *collective symmetry*. The reductionist grants that *most* combatants on both sides may be non-liable (due to (4)), but this does not entail that *all* combatants on both sides receive identical verdicts. Crucially, **the distribution of liability is asymmetric** in most conflicts. On the *unjust side*, even if many combatants are non-liable, *some* (e.g., high-ranking officers, volunteers with full knowledge) remain liable. On the *just side*, combatants are typically *not* liable because they pose *just* threats. Thus:  
    - A just combatant *may* permissibly kill liable unjust combatants (but not non-liable ones).  
    - An unjust combatant *may not* permissibly kill *anyone* (since just combatants are non-liable).  
    → **Permissions are asymmetric** (just combatants have *some* permissions; unjust have *none*).  

  ### Why (6) Looked Plausible:
  - You reasonably inferred that if *most* combatants are non-liable, practical constraints would make warfare near-impossible for both sides. This mirrors the "contingent pacifism" worry in revisionism. However, this is a *practical* problem, not a *logical* collapse into symmetry. The *moral* asymmetry persists: only the just side has *any* license to kill (when targeting liable individuals).

  ### What the Reductionist Pays to Reject (6):
  - **Cost**: Admits that *in practice*, just combatants may struggle to identify liable targets or fight without violating proportionality/necessity. This risks "contingent pacifism" (i.e., just wars become morally infeasible if most enemies are non-liable).  
  - **Benefit**: Preserves the core revisionist asymmetry: unjust combatants *always* act wrongly when killing; just combatants *may* act permissibly (under strict conditions).  

  ### Other Premises Under Pressure:
  1. **Premise (3)** (Degrees of liability):  
     - **Vulnerability**: Reductionists (e.g., McMahan) often treat liability as *threshold-based*: if responsibility crosses a minimal threshold, full liability to lethal force may apply. A conscript firing a rifle in an aggressive war might still be liable despite low responsibility.  
     - **Cost to reject**: Weakens the case for excusing conscripts/young soldiers. Risks harshness toward marginally responsible combatants.  
     - **Confidence**: Moderate. Some revisionists accept scalar liability; others resist. A respectable case exists both ways.  

  2. **Premise (4)** (Most combatants bear negligible responsibility):  
     - **Vulnerability**: Reductionists might argue that *voluntary* military service (common in professional armies) implies significant responsibility. Even conscripts contribute to an unjust threat and may have a duty to resist/desert.  
     - **Cost to reject**: Forces revisionism into a more permissive stance, potentially excusing participants in clear aggression (e.g., volunteers in the Wehrmacht).  
     - **Confidence**: High. Your empirical claim is strong, but revisionists can still argue for *some* liability in paradigmatic unjust wars.  

  3. **Premise (2)** (Liability requires moral responsibility):  
     - **Vulnerability**: Least vulnerable. Rejecting this abandons core revisionism (e.g., making liability depend on *causal role* alone collapses into collectivism).  
     - **Cost to reject**: Surrenders the individualist foundation. Not recommended for a reductionist.  

  ### What Survives Your Argument:
  Your reasoning identifies a **genuine and profound difficulty** for revisionism:  
  - **Practical symmetry**: In wars with mass conscription/propaganda, *feasible* combatant behavior may *de facto* mirror traditional moral equality, as just combatants struggle to discriminate liable targets.  
  - **Advantage for traditionalism**: Walzer’s doctrine *avoids* contingent pacifism by granting symmetrical permissions, enabling pragmatic warfare. Revisionists must either accept that just wars are often impossible to fight morally or dilute their individualism.  

  ### Defense Strategy for Seminar:
  - **Focus on (6)**: Press the point that *practical* symmetry doesn’t imply *moral* symmetry. Concede that revisionism faces a feasibility crisis but insist it doesn’t collapse logically.  
  - **Leverage (4)**: Argue that even if liability distributions are *sometimes* asymmetric, in *many real wars* (e.g., with conscript armies) the revisionist position *functionally* prohibits most combatants from fighting, creating a disconnect between theory and practice.  
  - **Confession of uncertainty**: Flag that Premise (3) is contested within revisionism, and your case is strongest against "scalar-liability" variants.  

  ### Confidence in Diagnosis:
  - **High confidence** in (6) as the critical flaw.  
  - **Moderate confidence** in the defense of (4)—its empirical strength is context-dependent (e.g., less persuasive for volunteer armies in wars of aggression).  
  - **Lowest confidence** in whether rejecting (3) saves revisionism without cost. If liability is threshold-based, your argument weakens, but revisionism still struggles with *excusable unjust combatants* (e.g., a brainwashed conscript) who are non-liable yet targeted.  

  **Verdict**: Your argument doesn’t *refute* revisionism but exposes its Achilles' heel: it cannot easily accommodate the reality of non-liable combatants without risking pacifism or compromising individualism. Traditionalism handles this better pragmatically, but at the cost of moral depth.
