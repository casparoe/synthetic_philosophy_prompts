  For the presentation, I'll suggest key scenes to pause: the labor contractor vanishing (highlighting the ticket system's failure), dividing the gold (making it inert), the bandits dumping the gold (conventional value), and the ending (community vs. wealth). Emphasize how the film visualizes Berkeley's ideas but also questions the endless pursuit of wealth.

