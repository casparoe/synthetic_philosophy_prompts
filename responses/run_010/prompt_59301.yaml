prompt: |-
  I chair the disputes panel of a housing co-operative of some hundred and twenty households, and over eight years we have built up a body of rulings on whether assurances given between members are to be treated as binding. A new matter comes before us next month and I would like to settle my own thinking about it in advance. What follows is a faithful summary of our record and of the case we now face.

  The rulings, in the order they were made:

  1. A member told her neighbour in the corridor that she would keep the shared store cupboard clear of her belongings until the neighbour's daughter left for university in the summer. The neighbour, on the strength of that, turned down a storage allocation from the council. When the member filled the cupboard in April, we held her to her word.
  2. At the summer barbecue, a member told a group of us that they could of course have his car for as long as the rail strike lasted. There was laughter all round, including his own. When a member presented herself for the keys a week later, we recorded that nothing had been undertaken.
  3. A member agreed to take over a departing member's arrears after being told the sum was four hundred pounds. It was fourteen hundred, and the person who told him knew that. We released him.
  4. A member gave an undertaking to a dying resident that the resident's cat would be cared for in the house she had loved. The resident died the following morning. Nobody remained who could hold the member to it, nobody would have suffered had she simply let the matter drop, and nobody had rearranged their affairs in reliance upon it. We held that she was bound, and minuted that she was bound.
  5. A member wrote out a solemn undertaking to himself, folded it into a Bible, and later asked us whether he was obliged by it to keep it. We told him we had no jurisdiction and that nothing had been promised.
  6. A member undertook to sign her tenancy over to her partner after being told that otherwise a report concerning her would go to the police. We held that there was nothing to keep.
  7. A member undertook to convert a garage into a bedsit and let it privately to a friend. We said the undertaking could not stand, whatever either party wanted, and that we would not enforce it against the member either.

  The new case: in March, a long-standing member showed a prospective leaseholder around the block. Asked directly whether the service charge would rise, she said that it would not — the roof had just been done, and there would be no increase for five years. She holds no office, sits on nothing, and had no authority of any kind to speak for the co-operative. The true position, which the management committee knew at the time, was that an increase had already been budgeted for the following year. The prospective leaseholder took the flat, and states that she would not have done so otherwise. She is not claiming money. She asks that the co-operative hold her service charge at its present level for five years, on the strength of what she was told.

  I would like the following, in this order.

  First, set out the accounts of what makes an assurance binding that are genuinely consistent with all seven of our rulings — not merely with most of them, and not with the ones in isolation. I suspect there is more than one, and I suspect that the ones which first come to mind each fail on at least one item in the list; identify which, and on which.

  Second, tell me what we should decide. Which of our seven precedents is the closest analogue to the new case, in what respect it is close, and why its closeness nonetheless does not settle the matter.

  Third, if our record genuinely underdetermines the outcome — and I expect it does — say what principle we would be committing ourselves to by ruling one way, and what different principle we would be committing ourselves to by ruling the other, and which of those two commitments is the more defensible for a body that will have to live with its own precedents.

  Finally, propose one further hypothetical case, of the sort that might plausibly come before us, on which the surviving accounts would deliver opposite verdicts, so that we could decide it deliberately and thereby settle which principle we are in fact running.

  Please give me a committed answer throughout: take a definite position on the ruling, name the principle you would adopt, and defend the choice, rather than presenting the options symmetrically and leaving me to select. If you think one of my seven summaries is ambiguous in a way that matters to the analysis, say so and say how you are resolving it; and if you believe the whole framing of the question — that there is a single principle we are running — is mistaken, say that too and argue for it, but still tell me how you would vote.
reasoning: |-
  Okay, let me approach this systematically. The user chairs a housing co-op disputes panel with 7 precedent rulings and a new case about a service charge assurance. They want: 1) principles consistent with all 7 rulings, 2) analysis of the new case against precedents, 3) underlying principles, and 4) a hypothetical to test boundaries.

  First, examining the rulings:
  - Case 1: Binding - neighbor relied to detriment
  - Case 2: Not binding - social context, no reliance
  - Case 3: Not binding - misrepresentation
  - Case 4: Binding - moral weight despite no reliance
  - Case 5: Not binding - no external promise
  - Case 6: Not binding - duress
  - Case 7: Not binding - violates co-op rules

  Emerging principles: Reliance + detriment OR moral weight can bind. Also, promises must be legitimate.

  For the new case: Unauthorized service charge assurance. Prospect relied by taking flat. But no detriment yet? Similar to Case 1 (reliance) but differs in speaker authority. Closest to Case 4 in moral weight despite no authority. 

  Core tension: Reliance alone? Or need legitimacy? Would rule for claimant - co-op should absorb cost as institutional responsibility. 

  Hypothetical: Member promises parking spot knowing it's allocated. Reliance would bind but illegitimacy may void. Exposes the principle gap.
answer: |-
  Based on your seven rulings and the new case, here is a committed analysis following your requested structure. I conclude that the co-operative should rule *against* the prospective leaseholder (i.e., refuse to freeze the service charge), but this requires clarifying an implicit principle in your precedents and creating new precedent deliberately.

  ### I. Principles Consistent with All Seven Rulings
  Two accounts survive scrutiny. Each satisfies all cases without contradiction:

  1. **The Reliance-Detriment Principle**:  
     An assurance is binding **only if** (a) it was reasonably relied upon, and (b) this reliance caused material detriment.  
     - *Case 1*: Binding (neighbor turned down storage → detriment).  
     - *Case 2*: Not binding (no reliance; laughter signaled non-seriousness).  
     - *Case 3*: Not binding (no *reasonable* reliance due to misrepresentation).  
     - *Case 4*: **Seems contradictory** but isn’t: Detriment is not required here because the *promisor’s solemn commitment to a dying person* creates a moral duty that substitutes for detriment. Your ruling emphasizes "nobody had rearranged affairs... nobody would suffer," yet you held it binding. This implies a second factor: **the gravity of the promise context**.  
     - *Case 5*: Not binding (no reliance by another party).  
     - *Case 6*: Not binding (reliance invalidated by duress).  
     - *Case 7*: Not binding (detriment irrelevant; promise violates co-op rules).  

  2. **The Legitimate Expectation Principle**:  
     An assurance is binding **only if** (a) it created a reasonable expectation, *and* (b) the promise was made in a context where the promisor had **actual or apparent authority**, *or* (c) the promise involves profound moral stakes (e.g., deathbed vows).  
     - *Case 1*: Binding (neighbor reasonably expected honesty in a direct exchange).  
     - *Case 2*: Not binding (social setting undermined reasonableness).  
     - *Case 3*: Not binding (misrepresentation destroyed reasonableness).  
     - *Case 4*: Binding (moral stakes override authority issues).  
     - *Case 5*: Not binding (no external expectation).  
     - *Case 6*: Not binding (no legitimacy due to coercion).  
     - *Case 7*: Not binding (promise fundamentally illegitimate under co-op rules).  

  **Why other accounts fail**:  
  - "Intent to be bound" fails *Case 2* (serious tone but social context negated intent).  
  - "Any reliance creates obligation" fails *Case 3* (reliance existed but was unreasonable).  
  - "Written promises only" fails *Case 1* and *Case 4* (both oral).  

  ---

  ### II. Ruling on the New Case  
  - **Closest analogue**: *Case 3* (misrepresentation of financial terms). Both involve incorrect financial assurances inducing action.  
  - **Key similarity**: The member misstated a material fact (service charge stability) to influence a decision, and the recipient relied to their detriment (taking the flat).  
  - **Why it doesn’t settle the matter**:  
    - *Case 3* involved *fraudulent* misrepresentation (the speaker knew the true arrears). Here, the member acted without malice but also without authority. Your precedents don’t address "unauthorized goodwill" versus "bad-faith deception."  
    - Unlike *Case 1* (neighbor-to-neighbor promise), this assurance touched on *co-operative governance*—a domain where authority matters (*Case 7*).  

  **My vote**: **Reject the leaseholder’s request**. The member had no authority (actual or apparent) to bind the co-operative on fiscal matters. Upholding this claim would create chaos in collective decision-making.  

  ---

  ### III. Principles at Stake and Their Defensibility  
  Your record *underdetermines* the outcome because:  
  - *Case 4* shows moral weight can bind without reliance, but this wasn’t a moral vow.  
  - *Case 1* shows reliance binds between members, but this implicates the whole co-op.  

  **If you rule FOR the leaseholder**, you commit to:  
  > *"A member’s unauthorized assurance, if reasonably relied upon, binds the collective—even on governance matters—if it induced detrimental reliance."*  
  - **Defensibility**: Weak. It prioritizes individual fairness over collective autonomy. Precedent *Case 7* explicitly protects the co-op from irregular commitments.  

  **If you rule AGAINST the leaseholder**, you commit to:  
  > *"The co-operative is bound only by assurances given with actual authority, or in contexts of profound moral gravity (e.g., deathbed vows), regardless of reliance."*  
  - **Defensibility**: Stronger. It balances fairness with institutional integrity. Precedents *Case 4* (moral gravity) and *Case 7* (illegitimate promise) support this. It prevents members from inadvertently creating liabilities for 120 households.  

  **Why the second principle is superior**: A disputes panel must protect the co-op’s governance framework. Allowing ad hoc promises to override budgetary decisions (*Case 7* analogy) invites instability. The "moral gravity" exception in *Case 4* is narrow and doesn’t extend to financial misstatements.  

  ---

  ### IV. Hypothetical Case to Settle the Principle  
  **Scenario**:  
  > *A member (with no authority) promises a struggling neighbor: "Don’t worry about the heating repairs—I’ll cover half your share this winter." The neighbor relies on this, forgoing financial aid from a charity. The member later reneges.*  

  **How principles diverge**:  
  - Under **Reliance-Detriment**: Binding. Neighbor suffered detriment (losing charity aid) due to reasonable reliance.  
  - Under **Legitimate Expectation**: Not binding. The promise lacks authority (personal, not co-op business) and lacks moral gravity (unlike *Case 4*).  

  **Why this clarifies**: This tests whether "detriment alone" suffices (*Case 1*) or if "authority/moral stakes" are essential (*Cases 4 and 7*). By ruling here, you explicitly choose your core principle.  

  **My recommendation**: Adopt the **Legitimate Expectation Principle** and rule *against* the neighbor in this hypothetical. It aligns with *Case 7*’s protection of collective order and confines *Case 4* to extreme moral contexts. This ensures members can’t casually bind others or the co-op through well-meaning but unauthorized pledges.  

  ---  
  **Final note**: Your rulings subtly prioritize *institutional legitimacy* over individual reliance—except where profound ethics intervene (*Case 4*). The new case lacks both authority and moral weight. Upholding it would distort your precedent and endanger cooperative governance. Rule against the leaseholder, and use the hypothetical above to cement the principle.
