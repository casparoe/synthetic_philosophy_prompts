  5. Actor playing judge: "I sentence you to five years."

     - Node 1: Is there a conventional procedure? In the real world, no, because it's a play. -> Node 2.
     - Node 2: World-to-words? (The actor is not trying to change the world.) Or words-to-world? (It's part of a fiction.) But the circumstances are that it's a play, so the utterance is not intended to be a real declaration. 
     - Node 2: We might say it's words-to-world because it's describing a fictional reality? Or it is a performance. But our tree doesn't have a leaf for acting. It would go to Node 2: let's say world-to-words for the character? But in the real world, it's not. So we might say:

          - Node 2: Not applicable? But we have to choose. Let's say words-to-world: it's a line in a play. -> Node 3A.
