     - **Yes** -> Exit: **Command**  
       *Awkward commitment: The speaker is imposing their will, potentially against the hearer's desires.*
     - **No** -> Exit: **Request**  
       *Awkward commitment: The hearer can say no without penalty, and the speaker must accept it.*

  Now, diagnostics:

  a) **Pairs the tree cannot separate**:

     - **Warning vs. Prediction of danger**: If a warning is given as a statement of danger (words-to-world), it would be a prediction. But in our tree, warnings are in the directive branch. So an utterance like "The ice is thin" might be intended as a warning but is classified as an assertion (if not future) or prediction (if future) in our tree. The tree cannot separate these because it relies on the illocutionary force being explicitly directive. To separate, we would need to know if the speaker intends to change the hearer's behavior. But in Node 3B, we ask that, so if it's words-to-world, we don't go to directive. So in the tree, such an utterance would be an assertion or prediction, not a warning. Therefore, the tree does not capture indirect directives or assertive warnings. The distinction collapses because the tree forces a primary force.

     - **Threat vs. Warning**: In our tree, threat is commissive (speaker commits to harm) and warning is directive (intended to change hearer's behavior). But some utterances might be ambiguous, e.g., "If you do that, you'll get hurt" could be a warning (if the harm is not by the speaker) or a threat (if the harm will be inflicted by the speaker). The tree separates them: threat is in the commissive branch only if the harm is to be done by the speaker. In the tree, for threat, the speaker commits to doing the harm. For warning, the harm is from an external source. But our tree doesn't ask who causes the harm. In Node 5B1 for threat, we have "harm to the hearer", but it could be by the speaker or by others? In the typical threat, the speaker does it. In warning, the speaker does not. But we haven't captured that. So the tree might misclassify a warning about a harm the speaker will cause as a threat. To separate, we would need to ask: is the harm conditional on the hearer's action and to be carried out by the speaker? For threat, yes; for warning, no.

     - **Offer vs. Promise**: In the tree, an offer is conditional on acceptance, a promise is not. But some promises are conditional too (e.g., "I will help you if you ask"). The tree might classify a conditional promise as an offer. To separate, we would need to know if the condition is the hearer's acceptance or something else.

  b) **Combinations that lead nowhere**: 

