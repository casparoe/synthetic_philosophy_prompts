  8. **Node 4B2: [Authority] Does the speaker have the authority (by circumstance, role, or relationship) to direct the hearer's action in this way?**
     - Yes -> Leaf: **command**. Awkward commitment: The speaker must own that they are imposing their will.
     - No -> Leaf: **request**. Awkward commitment: The speaker must admit that the hearer can say no without penalty.

  But what about warnings? We can consider a warning as a directive if it is advising the hearer to do something. For example, "Be careful!".

  So we can add:

     - Is the act advising the hearer of a danger with the intention that the hearer avoid it? -> Leaf: **warning**. Awkward commitment: The speaker must own that they are interfering in the hearer's affairs for the hearer's own good.

  But how to capture that without content? We can ask:

     - Is the directive based on the speaker's belief that the hearer is in danger? 
          - Yes: **warning**
          - No: then command or request.

  But that is content-based. If we allow it, then:

  **Node 4B2: [Directive Type]**
     - Is the act one that the speaker issues based on a belief that the hearer is in danger or might come to harm?
          - Yes -> Leaf: **warning**. (But note: warning can be given without directive, but in this branch we are in directives, so it is a directive warning.)
