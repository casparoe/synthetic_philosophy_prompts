  - Node 4B2: Directive type: is it motivated by concern for danger? -> warning; else: then by authority? -> command or request.

  We have 7 nodes.

  Now, the leaves we have:
  - Declaration
  - Assertion
  - Prediction
  - Promise
  - Threat
  - Offer
  - Command
  - Request
  - Warning
  - Apology
  - And two unoccupied: 
