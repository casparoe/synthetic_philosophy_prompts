     - But what about an act that is world-to-words and has no effect on behavior, no commitment, and is not expressive? For example, a wish? "I wish you well." It is expressive. So we cover it in Node 5B2 as "other expressive". So no empty cells.

     - However, we might have a cell in Node 5B2: if not apology and not other? But we have only two options.

     - Overall, the tree has no dead ends.

  Worked examples:

  1. Landlord: "If the money is not in the account by Friday, I will start eviction proceedings."

