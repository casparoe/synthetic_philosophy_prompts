  Now, let's write the tree with questions:

  **Decision Tree for Illocutionary Force**

  1. **Conventional Creation**: Does the act, by accepted convention, create a new institutional fact (e.g., status, right, obligation) solely by being performed correctly by a person with appropriate standing? (Note: If the convention is not in place or standing is lacking, the act may be void, but we are classifying the force.)
     - **Yes** -> Exit: **Declaration**  
       *Awkward commitment: The speaker must accept that the act is magic: it changes the world by saying it.*
     - **No** -> 2.

  2. **Fit Direction**: Is the primary aim to describe the world (words-to-world) or to change the world to match the words (world-to-worlds)?
     - **Words-to-world** -> 3A.
     - **World-to-words** -> 3B.

