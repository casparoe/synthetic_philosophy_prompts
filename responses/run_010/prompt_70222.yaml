  2. Incumbent politician: "When I am re-elected, taxes will come down."

     - Node 1: Not a conventional act creating institutional fact. -> Node 2.
     - Node 2: Words-to-world (describing a future state) -> Node 3A.
     - Node 3A: Future state? Yes. -> **Prediction**.
     - But is it a promise? The tree doesn't capture that because it's in words-to-world. But it might be intended as a promise. However, the tree's Node 2: if it's a promise, it should be world-to-words. But the utterance is in a form of words-to-world. In context, it might be a campaign promise. To capture that, we would have to see the primary force. The tree goes by the aim. In this case, the politician is describing what will happen, but also committing to make it happen. So it's both. The tree at Node 2 might be misapplied. The node at fault is Node 2: we have to decide the primary direction of fit. I would defend that it is a promise (world-to-words) because the politician is committing to make taxes come down. So the tree is wrong. The correct leaf should be promise.

  3. Officiant at beach ceremony: (later found license lapsed)

     - Node 1: Yes, it is an act (marriage) that by convention creates a new status. -> **Declaration**.
