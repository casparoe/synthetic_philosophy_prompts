     - Unoccupied leaf 2: other expressive (from Node 5B2: not an apology)

  We are missing: threat and warning are covered, but what about the beach ceremony and the actor cases? They will go to declaration and then be void? But we need to capture that.

  The tree will sort by force, not validity. So for the beach ceremony, even though the license is lapsed, the force might be intended as a declaration.

  But in the tree, Node 1 asks if it is governed by convention and standing. If the circumstances include that there is a conventional procedure and the speaker is believed to have standing, then it might be a declaration, but if we know the standing is lacking, then it is not? The prompt says: "a neutral description of the circumstances". For the beach ceremony, the neutral description might not include the license lapse? Or it might. We have to answer based on the circumstances as described.

