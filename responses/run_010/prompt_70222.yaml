     - A harm to the hearer, conditional on their inaction -> Exit: **Threat**  
       *Awkward commitment: The speaker is prepared to do something they otherwise wouldn't, just to punish.*
     - A benefit to the hearer, conditional on their acceptance -> Exit: **Offer**  
       *Awkward commitment: The hearer can nullify the commitment by refusal.*
     - Neither benefit nor harm (or not primarily for the hearer) -> Exit: **Commissive (Neutral/Unoccupied 1)**  
