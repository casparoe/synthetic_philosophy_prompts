answer: |-
  ### Handout: Illocutionary Force Decision Tree  
  *For classifying utterances without relying on memorized labels*  

  ---

  #### **1. The Decision Tree**  
  *Answer each question using only a transcript and neutral circumstances. Do not infer labels, intentions, or feelings.*  

  **Node 1: Does the act require a specific conventional procedure (e.g., legal, religious, institutional) and standing (role) to be valid?**  
  - *If YES →* **Node 2A**  
  - *If NO →* **Node 2B**  
  *Footnote: We avoid "constative/performative" because many acts (e.g., promises) blend both features, making the axis unreliable for classification.*  

  **Node 2A: Does the act create a new institutional fact (e.g., status, obligation, right) solely by being uttered correctly?**  
  - *If YES →* Exit: **Declaration (institutional)**  
  - *If NO →* **Node 2B**  

  **Node 2B: Is the primary aim to describe reality (words match world) or change reality (world matches words)?**  
  - *Describe (words-to-world) →* **Node 3A**  
  - *Change (world-to-words) →* **Node 3B**  

  **Node 3A: Does the utterance describe a future state of affairs?**  
  - *If YES →* Exit: **Prediction**  
  - *If NO →* Exit: **Assertion**  

  **Node 3B: Whose future conduct does the act most directly bind or target?**  
  - *Speaker’s conduct →* **Node 4A**  
  - *Hearer’s conduct →* **Node 4B**  
  - *Neither →* **Node 4C**  

  **Node 4A: Would the speaker’s action, if taken, primarily benefit or harm the hearer?**  
  - *Benefit (unconditional or not requiring acceptance) →* Exit: **Promise**  
  - *Harm (conditional on hearer’s inaction) →* Exit: **Threat**  
  - *Benefit (conditional on hearer’s acceptance) →* Exit: **Offer**  
  - *Neither benefit nor harm →* Exit: **Commissive (Neutral/Unoccupied 1)**  

  **Node 4B: Is the act motivated by a belief that the hearer is at risk?**  
  - *If YES →* Exit: **Warning**  
  - *If NO →* **Node 5B**  

  **Node 5B: Does the speaker have standing (authority, role, or context) to direct the hearer?**  
  - *If YES →* Exit: **Command**  
  - *If NO →* Exit: **Request**  

  **Node 4C: Is the act’s completion dependent on the hearer’s emotional/perceptual uptake?**  
  - *If YES →* Exit: **Expressive (Unoccupied 2)**  
  - *If NO →* **Node 5C**  
  *Clarifier: "Uptake" = hearer’s understanding/recognition. "Dependent" means constitutive (act fails without uptake), not consequential (act succeeds but may not achieve goals).*  

  **Node 5C: Does the act express regret for the speaker’s past action?**  
  - *If YES →* Exit: **Apology**  
  - *If NO →* Exit: **Expressive (Unoccupied 2)**  

  ---

  #### **2. The Leaves**  
  *Each leaf includes its "awkward commitment" – a non-negotiable implication.*  
  - **Assertion**: Must admit evidence can be demanded, but truth is not guaranteed.  
  - **Prediction**: Must admit the future is treated as fixed, not influenced.  
  - **Promise**: Must own being bound to act even if the hearer no longer wants it.  
  - **Threat**: Must own willingness to do harm purely to punish.  
  - **Offer**: Must allow the hearer to nullify it by refusal.  
  - **Command**: Must accept imposing will, potentially against hearer’s desires.  
  - **Request**: Must concede the hearer can refuse without consequence.  
  - **Warning**: Must admit acting on unverified information "for the hearer’s own good."  
  - **Apology**: Must accept being wrong and that saying so matters.  
  - **Declaration (institutional)**: Must accept the act is "magic" (changes reality by speaking).  
  - **Commissive (Neutral/Unoccupied 1)**: Must own binding oneself to an act irrelevant to the hearer.  
  - **Expressive (Unoccupied 2)**: Must admit the expression has no world-changing power or clear target.  

  ---

  #### **3. Explicit Diagnostics**  
  **a) Indistinguishable Pairs** (due to shared logical features; resolved by context beyond the tree):  
  - **Warning vs. Prediction of danger**: Both describe future harm. *Separator*: Does the speaker imply they are *not* the cause of harm? If yes, warning; if no, prediction (or threat).  
  - **Offer vs. Conditional Promise**: Both commit the speaker conditionally. *Separator*: Is the condition *hearer acceptance* (offer) or an *external event* (promise)?  
  - **Request vs. Command**: Both target hearer conduct. *Separator*: Does the speaker’s authority derive from a *role* (command) or *personal appeal* (request)?  
  *Why collapse?* The tree prioritizes logical structure over pragmatic context (e.g., speaker identity).  

  **b) Empty Combinations** (answers leading to no leaf):  
  - **Node 1: YES → Node 2A: NO** (Conventional act not creating institutional facts).  
    - *Verdict*: **Unattractive**. Acts like ceremonial greetings fit here but are rare and unstable (often reclassified as expressives).  
  - **Node 4C: NO → Node 5C: NO** (Non-regretful expressive not dependent on uptake).  
    - *Verdict*: **Unoccupied**. Acts like congratulating *could* exist but lack a stable name/social niche.  
  - **Node 3B: Neither → Node 4C: NO → Node 5C: NO** (Non-uptake-dependent expressive without regret).  
    - *Verdict*: **Incoherent**. If uptake isn’t constitutive and no regret is expressed, the act has no clear illocutionary point.  

  ---

  #### **4. Worked Examples**  
  *Trace paths using transcript/circumstances only.*  

  1. **Landlord**: "If the money is not in the account by Friday, I will start eviction proceedings."  
     - Node 1: NO (no conventional procedure/standing for validity).  
     - Node 2B: Change (world-to-words).  
     - Node 3B: Targets *hearer’s conduct* (pay rent).  
     - Node 4B: NO (not motivated by risk to hearer).  
     - Node 5B: YES (landlord has contractual authority). → **Command**.  
     *Verdict match?* **NO**. Correct is **Threat** (binds *speaker’s* conduct to harm). *Faulty node*: **3B** (misjudges "binds/targets" as hearer-focused, not speaker-committed).  

  2. **Politician**: "When I am re-elected, taxes will come down."  
     - Node 1: NO.  
     - Node 2B: Describe (words-to-world; frames tax cut as inevitable).  
     - Node 3A: YES (future state). → **Prediction**.  
     *Verdict match?* **NO**. Correct is **Promise** (commits speaker). *Faulty node*: **2B** (ignores world-changing intent in campaign rhetoric).  

  3. **Officiant**: Beach wedding with lapsed license.  
     - Node 1: YES (conventional procedure/standing required).  
     - Node 2A: YES (aims to create marital status). → **Declaration**.  
     *Verdict match?* **YES** (force is declaration; validity is separate).  

  4. **"I'm sorry" heard as sarcasm**.  
     - Node 1: NO.  
     - Node 2B: Change (world-to-words; expresses regret).  
     - Node 3B: Neither (targets no conduct).  
     - Node 4C: YES (uptake is constitutive; sarcasm voids it). → **Expressive (Unoccupied 2)**.  
     *Verdict match?* **NO**. Correct is **Apology** (uptake is *not* constitutive; act is complete). *Faulty node*: **4C** (misreads uptake as constitutive for apologies; it’s consequential).  

  5. **Actor-judge**: "I sentence you to five years."  
     - Node 1: NO (theatrical context lacks real convention).  
     - Node 2B: Describe (words-to-world; asserts fictional reality).  
     - Node 3A: NO (present act). → **Assertion**.  
     *Verdict match?* **NO**. Correct is **non-serious act** (not a declaration). *Faulty node*: **1** (fails to flag theatrical conventions as "non-serious").  

  ---

  #### **5. Closing Note**  
  **Most error-prone node: 3B** ("Whose future conduct does the act bind/target?").  
  - **Why**: Students confuse *binding the speaker* (e.g., threat) with *directing the hearer* (e.g., warning). Under time pressure, they focus on surface grammar (e.g., "I will" = speaker) and overlook context (e.g., landlord utterance pressures hearer).  
  - **Wrong turn**: Answering "speaker’s conduct" for directive acts (e.g., landlord → threat) or "hearer’s conduct" for commissives (e.g., unconditional promise → request).  
  - **Spurious leaf**: **Threat** (if misclassifying a command) or **Request** (if misclassifying a promise).  
  - **Fix**: Prioritize "who is *obligated* to act?" (speaker) vs. "who is *pressured* to act?" (hearer).  

  ---  
  *Handout ends. Use this tree to resolve disputes by tracing features, not labels.*
