answer: |-
  Here are seven numbered items for your Q&A prep:

  1. **(Biosafety Officer)** "Your registry assumes institutions can define 'capability' clearly enough to trigger. In my lab, half our safety meetings are spent arguing whether new equipment crosses thresholds. Won't vague descriptions make this unusable?"  
  *Reply:* We design commitments against concrete checklists (e.g., "PCR throughput >X samples/hour"). Ambiguity sinks *any* rule—this just makes it explicit early.  
  *Gives way:* When capabilities emerge from combinatorial research.  
  **Concede in opening.**

  2. **(Lawyer)** "Random panels invite arbitrary outcomes. Courts overturn agency actions for far more process than this. How is 'drawn from a standing pool' defensible when restricting research?"  
  *Reply:* This triggers review, not restriction—like IRB referral. Randomness prevents capture; we accept it in jury selection.  
  *Gives way:* If a panel’s recommendation faces legal challenge.  
  **Hold for floor.**

  3. **(Economist)** "You say burden is low, but compliance has fixed costs. My model shows small universities exit high-risk fields when overhead hits 3%. What’s your registry’s cost per institution?"  
  *Reply:* Filing is a one-page template; review costs only trigger rarely. We’ll pilot with volunteer labs to quantify.  
  *Gives way:* If compliance burdens distort research investment.  
  **Concede in opening.**

  4. **(Historian/Sociologist)** "This ‘neutral’ registry masks power: who defines the ‘standing pool’? It’s just boundary-work by institutional elites to control emerging fields."  
  *Reply:* Pool membership is public and multidisciplinary by design—transparency exposes bias better than ad-hoc committees.  
  *Gives way:* If dominant institutions co-opt the selection process.  
  **Hold for floor.**

  5. **(Ex-Advisory Member)** "Publishing withdrawals as ‘alarms’ will chill high-stakes research. After the Fouchier flu paper, our team got death threats. Why expose scientists to that?"  
  *Reply:* Withdrawals signal *potential* risk—not details. Anonymizing the institution during review reduces stigma.  
  *Gives way:* If media misrepresents registry updates.  
  **Hold for floor.**

  6. **(National Lab Biosafety Officer)** "Institutions game systems. They’ll file toothless commitments (‘review if we make pandemic pathogens’) while hiding real work under trivial descriptors (‘novel aerosol delivery’)."  
  *Reply:* Specificity is enforced: commitments must list technical thresholds (e.g., "gain-of-function >X% transmissibility"). Vague filings get challenged by the pool.  
  *Gives way:* If bad-faith actors exploit descriptor loopholes.  
  **Hold for floor.**

  7. **(Historian/Sociologist)** "Isn’t your ‘random panel’ just laundering responsibility? When this fails, you’ll say ‘the process worked’ while ignoring how the pool’s composition pre-determines outcomes."  
  *Why no good answer:* The reply "Randomness ensures fairness" sidesteps that the standing pool’s selection criteria embed cultural biases about risk.
