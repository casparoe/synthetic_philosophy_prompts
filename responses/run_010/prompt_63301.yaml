  **Part (a) [5 marks]**  
  For each model (T1, T2, T3), compute \(D(A,B)\), \(D(B,A)\), and \(\omega(A,B)\). Classify each as \(\psi\)-ontic or \(\psi\)-epistemic. Explain why in T1, \(\omega(A,B) = 1/2\) (matching the quantum overlap) but neither \(D(A,B)\) nor \(D(B,A)\) equals \(1/2\). Identify the structural feature of T1 causing this directional asymmetry.  

  **Part (b) [5 marks]**  
  In T1, show that an agent knowing \(\lambda\) can predict the outcome of \(M\) with certainty, while an agent knowing only the preparation (hence the quantum state) cannot. Discuss what this implies about the relation between the \(\psi\)-ontology distinction and the classical hidden-variable question. Does \(\psi\)-epistemicity entail that \(\lambda\) is informationally weaker than \(\psi\)?  

  **Part (c) [8 marks]**  
  Extend each model to include measurement \(N\), reproducing its quantum statistics. Show:  
  - T1 admits no extension.  
  - T2 admits an extension only if \(\xi(+|\lambda)\) is stochastic (non-deterministic) for at least one \(\lambda\).  
  - T3 admits an extension where all response functions (for \(M\) and \(N\)) are deterministic.  

  Then, consider a family of models with \(\Lambda = \{\lambda_1, \lambda_2, \lambda_3\}\), \(\mu_A = (1-q, q, 0)\), \(\mu_B = (0, q', 1-q')\), and \(\xi(0|\lambda_1) = 1\), \(\xi(0|\lambda_2) = 1\), \(\xi(0|\lambda_3) = 0\) (fixed as in T3).  
  Show that an extension to \(N\) exists only if \(q \leq 1/2\), and is outcome-deterministic only if \(q = 1/2\). Explain why \(q = 1/2\) is precisely the value required for maximal \(\psi\)-epistemicity.  

  **Part (d) [7 marks]**  
  Evaluate the student's argument. State its strongest point, identify where it fails, and explain what would be needed for it to succeed. Address:  
  - Whether the \(\psi\)-ontology distinction applies to a model of the whole quantum theory or just a fragment.  
  - How the constraints in part (c) show the classification is not arbitrary.  
  - The role of independence assumptions (e.g., in theorems like PBR) in providing empirical traction for the full theory.  

