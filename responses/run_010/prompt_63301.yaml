  ### Problem Set: Interpretations of Quantum Theory

  **Operational Scenario**  
  A single qubit system has two preparations:  
  - Preparation \(A\): state \(|0\rangle\)  
  - Preparation \(B\): state \(|+\rangle = (|0\rangle + |1\rangle)/\sqrt{2}\)  

  The quantum overlap is \(|\langle 0 | + \rangle|^2 = 1/2\).  

  Two measurements are defined:  
  - Measurement \(M\): Projective measurement in basis \(\{|0\rangle, |1\rangle\}\) with outcomes \(0\) or \(1\).  
  - Measurement \(N\): Projective measurement in basis \(\{|+\rangle, |-\rangle\}\) (where \(|-\rangle = (|0\rangle - |1\rangle)/\sqrt{2}\)) with outcomes \(+\) or \(-\).  

  Quantum statistics:  
  - For \(A\): \(p(0|A) = 1\), \(p(1|A) = 0\), \(p(+|A) = 1/2\), \(p(-|A) = 1/2\)  
  - For \(B\): \(p(0|B) = 1/2\), \(p(1|B) = 1/2\), \(p(+|B) = 1\), \(p(-|B) = 0\)  

  **Definitions**  
  An *ontological model* consists of:  
  - A set \(\Lambda\) of ontic states.  
  - For each preparation \(P\), an *epistemic state* \(\mu_P\) (a probability distribution over \(\Lambda\)).  
  - For each measurement, a *response function* \(\xi(o|\lambda)\) (probability of outcome \(o\) given \(\lambda\)), such that \(\sum_\lambda \mu_P(\lambda) \xi(o|\lambda)\) matches the quantum statistics.  

  For preparations \(A\) and \(B\):  
  - *Directional overlap*: \(D(A,B) = \sum_{\lambda \in \text{supp}(\mu_B)} \mu_A(\lambda)\), where \(\text{supp}(\mu_B) = \{\lambda : \mu_B(\lambda) > 0\}\).  
  - *Symmetric overlap*: \(\omega(A,B) = \sum_\lambda \min(\mu_A(\lambda), \mu_B(\lambda))\).  

  A model is *\(\psi\)-ontic* (for the pair) if \(\text{supp}(\mu_A) \cap \text{supp}(\mu_B) = \emptyset\); otherwise, it is *\(\psi\)-epistemic*.  
  A model is *maximally \(\psi\)-epistemic* (for the pair) if \(D(A,B) = D(B,A) = |\langle 0 | + \rangle|^2 = 1/2\).  

  **Three Models for Measurement \(M\)**  
  Each model reproduces the quantum statistics for \(M\):  
  - **T1**: \(\Lambda = \{\lambda_1, \lambda_2\}\)  
    \(\mu_A = (1, 0)\) (i.e., \(\mu_A(\lambda_1) = 1, \mu_A(\lambda_2) = 0\))  
    \(\mu_B = (1/2, 1/2)\) (i.e., \(\mu_B(\lambda_1) = 1/2, \mu_B(\lambda_2) = 1/2\))  
    \(\xi(0|\lambda_1) = 1, \xi(0|\lambda_2) = 0\)  

  - **T2**: \(\Lambda = \{\lambda_1, \lambda_2, \lambda_3\}\)  
    \(\mu_A = (1, 0, 0)\)  
    \(\mu_B = (0, 1/2, 1/2)\)  
    \(\xi(0|\lambda_1) = 1, \xi(0|\lambda_2) = 1, \xi(0|\lambda_3) = 0\)  

  - **T3**: \(\Lambda = \{\lambda_1, \lambda_2, \lambda_3\}\)  
    \(\mu_A = (1/2, 1/2, 0)\)  
    \(\mu_B = (0, 1/2, 1/2)\)  
    \(\xi(0|\lambda_1) = 1, \xi(0|\lambda_2) = 1, \xi(0|\lambda_3) = 0\)  

  **Student's Argument**  
  A student reasons:  
  (i) T1, T2, T3 reproduce identical statistics for \(M\).  
  (ii) They are classified differently under \(\psi\)-ontic/\(\psi\)-epistemic, and only one is maximally \(\psi\)-epistemic.  
  (iii) Thus, no experiment on this system can determine if the quantum state is "real" or "knowledge."  
  (iv) Thus, "is the wavefunction real?" is a verbal dispute about carving \(\Lambda\), and \(\psi\)-ontology theorems merely dress this up.  

