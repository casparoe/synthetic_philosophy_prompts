  We are given an operational scenario with two preparations and two measurements, and three ontological models T1, T2, T3 for the measurement M. We must first verify that each model reproduces the quantum statistics for M. Then we are to design a problem set with four parts as described.

  Let's first verify the quantum statistics for M in each model.

  Quantum statistics for M:
  - p(0|A) = 1, p(1|A)=0
  - p(0|B)=1/2, p(1|B)=1/2

  Check T1:
  - μ_A = (1,0) meaning μ_A(λ1)=1, μ_A(λ2)=0.
  - μ_B = (1/2, 1/2) meaning μ_B(λ1)=1/2, μ_B(λ2)=1/2.
  - ξ(0|λ1)=1, ξ(0|λ2)=0 → ξ(1|λ1)=0, ξ(1|λ2)=1.

  Compute p(0|A) = Σ_λ μ_A(λ) ξ(0|λ) = μ_A(λ1)*1 + μ_A(λ2)*0 = 1*1 + 0*0 = 1. Correct.
  p(0|B) = μ_B(λ1)*1 + μ_B(λ2)*0 = (1/2)*1 + (1/2)*0 = 1/2. Correct.

  Check T2:
  - μ_A = (1,0,0) → μ_A(λ1)=1, μ_A(λ2)=0, μ_A(λ3)=0.
  - μ_B = (0,1/2,1/2) → μ_B(λ1)=0, μ_B(λ2)=1/2, μ_B(λ3)=1/2.
  - ξ(0|λ1)=1, ξ(0|λ2)=1, ξ(0|λ3)=0 → ξ(1|λ1)=0, ξ(1|λ2)=0, ξ(1|λ3)=1? Wait, note ξ(0|λ2)=1 so ξ(1|λ2)=0? But that would mean λ2 always gives outcome 0. Then:
  p(0|A) = μ_A(λ1)*1 + μ_A(λ2)*1 + μ_A(λ3)*0 = 1*1 + 0*1 + 0*0 = 1. Correct.
  p(0|B) = μ_B(λ1)*1 + μ_B(λ2)*1 + μ_B(λ3)*0 = 0*1 + (1/2)*1 + (1/2)*0 = 1/2. Correct.

  Check T3:
  - μ_A = (1/2, 1/2, 0) → μ_A(λ1)=1/2, μ_A(λ2)=1/2, μ_A(λ3)=0.
  - μ_B = (0, 1/2, 1/2) → μ_B(λ1)=0, μ_B(λ2)=1/2, μ_B(λ3)=1/2.
  - ξ(0|λ1)=1, ξ(0|λ2)=1, ξ(0|λ3)=0 → ξ(1|λ1)=0, ξ(1|λ2)=0, ξ(1|λ3)=1.
  p(0|A) = μ_A(λ1)*1 + μ_A(λ2)*1 + μ_A(λ3)*0 = (1/2)*1 + (1/2)*1 + 0 = 1. Correct.
  p(0|B) = μ_B(λ1)*1 + μ_B(λ2)*1 + μ_B(λ3)*0 = 0 + (1/2)*1 + (1/2)*0 = 1/2. Correct.

  Now, we must also check the overlaps and the other parts to ensure consistency.

  We are now ready to write the problem.

  ---

  **Problem Set: Interpretations of Quantum Theory**

  **Operational Scenario**

  We consider a single qubit with two preparations and two measurements:

  - Preparation A: prepares the state |0⟩.
  - Preparation B: prepares the state |+⟩ = (|0⟩ + |1⟩)/√2.

  The quantum overlap between these states is |⟨0|+⟩|² = 1/2.

  The measurements are:

  - Measurement M: projective measurement in the {|0⟩, |1⟩} basis, with outcomes 0 and 1.
  - Measurement N: projective measurement in the {|+⟩, |−⟩} basis, where |−⟩ = (|0⟩ − |1⟩)/√2, with outcomes + and −.

  The quantum statistics are:

  - For preparation A: 
    - p(0|A) = 1, p(1|A) = 0 (for measurement M)
    - p(+|A) = |⟨+|0⟩|² = 1/2, p(−|A) = 1/2 (for measurement N)
  - For preparation B:
    - p(0|B) = 1/2, p(1|B) = 1/2 (for measurement M)
    - p(+|B) = 1, p(−|B) = 0 (for measurement N)

  **Definitions**

  An *ontological model* for this scenario consists of:
  - A set Λ of ontic states.
  - For each preparation P, an *epistemic state* μ_P, which is a probability distribution over Λ.
  - For each measurement, a *response function* ξ(o|λ) that gives the probability of outcome o given the ontic state λ, such that for any preparation P and measurement, the probability of outcome o is given by Σ_{λ∈Λ} μ_P(λ) ξ(o|λ) and matches the quantum statistics.

  For two preparations A and B, we define:
  - The *directional overlap* D(A,B) = Σ_{λ ∈ supp(μ_B)} μ_A(λ). (Note: the support of μ_B is the set of λ for which μ_B(λ) > 0.)
  - The *symmetric overlap* ω(A,B) = Σ_{λ∈Λ} min(μ_A(λ), μ_B(λ)).

  A model is *ψ-ontic* if for every pair of distinct pure quantum states, the corresponding epistemic states have disjoint supports. Otherwise, it is *ψ-epistemic*.

  A model is *maximally ψ-epistemic* for a pair (A,B) if both D(A,B) and D(B,A) equal the quantum overlap |⟨A|B⟩|² = 1/2.

  **Three Models for Measurement M**

  We consider three ontological models that reproduce the quantum statistics for measurement M. Each model is initially specified only for M.

  - **Model T1**: 
    - Λ = {λ1, λ2}
    - μ_A(λ1) = 1, μ_A(λ2) = 0
    - μ_B(λ1) = 1/2, μ_B(λ2) = 1/2
    - ξ(0|λ1) = 1, ξ(0|λ2) = 0 → hence ξ(1|λ1)=0, ξ(1|λ2)=1.

  - **Model T2**:
    - Λ = {λ1, λ2, λ3}
    - μ_A(λ1)=1, μ_A(λ2)=0, μ_A(λ3)=0
    - μ_B(λ1)=0, μ_B(λ2)=1/2, μ_B(λ3)=1/2
    - ξ(0|λ1)=1, ξ(0|λ2)=1, ξ(0|λ3)=0 → hence ξ(1|λ1)=0, ξ(1|λ2)=0, ξ(1|λ3)=1.

  - **Model T3**:
    - Λ = {λ1, λ2, λ3}
    - μ_A(λ1)=1/2, μ_A(λ2)=1/2, μ_A(λ3)=0
    - μ_B(λ1)=0, μ_B(λ2)=1/2, μ_B(λ3)=1/2
    - ξ(0|λ1)=1, ξ(0|λ2)=1, ξ(0|λ3)=0 → hence ξ(1|λ1)=0, ξ(1|λ2)=0, ξ(1|λ3)=1.

  **A Student's Argument**

  After seeing these models, a student argues:

  (i) T1, T2, and T3 all reproduce the same operational statistics for measurement M.

  (ii) They nonetheless fall on opposite sides of the ψ-ontic / ψ-epistemic divide, and only one of them is maximally ψ-epistemic for the pair (A,B).

  (iii) Therefore, no possible experiment on this system could decide whether the quantum state is a state of reality or a state of knowledge.

  (iv) Therefore, the question of whether the wavefunction is real is not a factual question but a verbal dispute about how to carve up the ontic space Λ, and the technical apparatus of ψ-ontology theorems merely dresses up that verdict.

  **Problem Tasks**

  Part (a) [5 marks]  
  For each model T1, T2, T3, compute D(A,B), D(B,A), and ω(A,B). Classify each model as ψ-ontic or ψ-epistemic for the pair (A,B). Explain why in T1, the symmetric overlap ω(A,B) equals the quantum overlap (1/2) but neither D(A,B) nor D(B,A) equals 1/2. Identify the structural feature of T1 that causes the directional overlaps to be asymmetric.

  Part (b) [5 marks]  
  In model T1, show that an agent who knows the ontic state λ can sometimes predict the outcome of M with certainty, whereas an agent who knows only the preparation (and hence the quantum state) cannot. What does this imply about the relation between the ψ-ontology distinction and the older distinction between hidden-variable and no-hidden-variable accounts? In particular, does ψ-epistemicity, as defined, entail that the ontic state λ is informationally weaker than the quantum state?

  Part (c) [8 marks]  
  Attempt to extend each model to include measurement N, so that the model reproduces the quantum statistics for both M and N. Show that:  
  - T1 admits no such extension.  
  - T2 admits an extension only if the response function for N is stochastic (i.e., not deterministic) for at least one ontic state.  
  - T3 admits an extension in which the response functions for both M and N are deterministic for every ontic state.  

  Then, consider a family of models with Λ = {λ1, λ2, λ3}, μ_A = (1−q, q, 0), μ_B = (0, q′, 1−q′), and the response functions for M fixed as in T3 (i.e., ξ(0|λ1)=1, ξ(0|λ2)=1, ξ(0|λ3)=0). Show that an extension to measurement N exists only if q ≤ 1/2, and that the extension is outcome-deterministic (i.e., for every λ and every outcome of N, the response function gives either 0 or 1) only when q = 1/2. Explain why this condition (q=1/2) is exactly the value required for the model to be maximally ψ-epistemic for the pair (A,B).

  Part (d) [7 marks]  
  Evaluate the student's argument. State its strongest point, identify the step at which it fails, and explain what would have to be true for it to succeed. In your response, address the following:  
  - The scope of the ψ-ontology distinction (does it apply to a model of the whole quantum theory or just a fragment?).  
  - The fact that the three models, though empirically equivalent for M, are constrained differently when extended to N.  
  - The role of independence assumptions for composite systems in ψ-ontology theorems (such as the Pusey-Barrett-Rudolph theorem), and why such assumptions are necessary to rule out ψ-epistemic models for the full quantum theory.

  ---

  **Model Answer**

  **Part (a)**

  We compute the overlaps for each model.

  *Model T1*:  
  - Support of μ_B: {λ1, λ2} (since μ_B(λ1)=1/2>0, μ_B(λ2)=1/2>0).  
    - D(A,B) = Σ_{λ ∈ supp(μ_B)} μ_A(λ) = μ_A(λ1) + μ_A(λ2) = 1 + 0 = 1.  
  - Support of μ_A: {λ1} (since μ_A(λ1)=1>0, μ_A(λ2)=0).  
    - D(B,A) = Σ_{λ ∈ supp(μ_A)} μ_B(λ) = μ_B(λ1) = 1/2.  
  - ω(A,B) = min(μ_A(λ1), μ_B(λ1)) + min(μ_A(λ2), μ_B(λ2)) = min(1, 1/2) + min(0, 1/2) = 1/2 + 0 = 1/2.  

  Classification: Since the supports of μ_A and μ_B are not disjoint (they share λ1), the model is ψ-epistemic. However, note that D(A,B)=1 ≠ 1/2, D(B,A)=1/2, so it is not maximally ψ-epistemic.

  *Model T2*:  
  - Support of μ_B: {λ2, λ3} (μ_B(λ2)=1/2>0, μ_B(λ3)=1/2>0).  
    - D(A,B) = Σ_{λ ∈ supp(μ_B)} μ_A(λ) = μ_A(λ2) + μ_A(λ3) = 0 + 0 = 0.  
  - Support of μ_A: {λ1} (μ_A(λ1)=1>0, μ_A(λ2)=0, μ_A(λ3)=0).  
    - D(B,A) = Σ_{λ ∈ supp(μ_A)} μ_B(λ) = μ_B(λ1) = 0.  
  - ω(A,B) = min(μ_A(λ1), μ_B(λ1)) + min(μ_A(λ2), μ_B(λ2)) + min(μ_A(λ3), μ_B(λ3)) = min(1,0) + min(0,1/2) + min(0,1/2) = 0 + 0 + 0 = 0.  

  Classification: The supports of μ_A and μ_B are disjoint (μ_A has support {λ1}, μ_B has support {λ2,λ3}), so the model is ψ-ontic.

  *Model T3*:  
  - Support of μ_B: {λ2, λ3} (μ_B(λ2)=1/2>0, μ_B(λ3)=1/2>0).  
    - D(A,B) = Σ_{λ ∈ supp(μ_B)} μ_A(λ) = μ_A(λ2) + μ_A(λ3) = 1/2 + 0 = 1/2.  
  - Support of μ_A: {λ1, λ2} (μ_A(λ1)=1/2>0, μ_A(λ2)=1/2>0).  
    - D(B,A) = Σ_{λ ∈ supp(μ_A)} μ_B(λ) = μ_B(λ1) + μ_B(λ2) = 0 + 1/2 = 1/2.  
  - ω(A,B) = min(μ_A(λ1), μ_B(λ1)) + min(μ_A(λ2), μ_B(λ2)) + min(μ_A(λ3), μ_B(λ3)) = min(1/2,0) + min(1/2,1/2) + min(0,1/2) = 0 + 1/2 + 0 = 1/2.  

  Classification: The supports are not disjoint (they share λ2), so ψ-epistemic. Moreover, D(A,B)=D(B,A)=1/2, so it is maximally ψ-epistemic.

  In T1, we have ω(A,B)=1/2, which equals the quantum overlap, but D(A,B)=1 and D(B,A)=1/2. The structural feature causing the asymmetry is that the support of μ_A is a proper subset of the support of μ_B. Specifically, λ1 is in the support of both, but λ2 is only in the support of μ_B. This leads to an asymmetry: when we condition on the support of μ_B, μ_A assigns probability 1 to that set (because μ_A is entirely on λ1, which is in the support of μ_B), but when we condition on the support of μ_A, μ_B assigns only 1/2 (because μ_B assigns 1/2 to λ1 and 1/2 to λ2, but the support of μ_A is only {λ1}).

  **Part (b)**

  In T1, consider an agent who knows the ontic state.  
  - If λ = λ1, then ξ(0|λ1)=1, so M yields 0 with certainty.  
  - If λ = λ2, then ξ(0|λ2)=0, so M yields 1 with certainty.  

  Thus, for every ontic state, the outcome of M is determined with certainty.  

  But an agent who knows only the preparation cannot always predict M with certainty. For preparation B, the quantum state |+⟩ predicts that M yields 0 with probability 1/2 and 1 with probability 1/2. So the outcome is not determined.  

  This shows that the ontic state λ provides more information about the outcome of M than the quantum state does.  

  The older hidden-variable theories aimed to introduce variables that would determine measurement outcomes (i.e., be outcome-deterministic). The ψ-ontology distinction is different: it is about whether the quantum state corresponds to a physical state of reality (ontic) or to an agent's knowledge (epistemic).  

  However, note that ψ-epistemic models (like T1) can still have outcome-deterministic response functions. So ψ-epistemicity does not entail that the ontic state is informationally weaker than the quantum state. In fact, in T1, the ontic state is informationally stronger: it determines the outcome of M, while the quantum state does not. Thus, the ψ-epistemic vs ψ-ontic distinction is orthogonal to the deterministic vs indeterministic hidden-variable distinction.  

  **Part (c)**

  We attempt to extend each model to include measurement N. For N, we require:  
  - For preparation A: p(+|A)=1/2, p(−|A)=1/2.  
  - For preparation B: p(+|B)=1, p(−|B)=0.  

  *Model T1*:  
  We have Λ = {λ1, λ2}. We need response functions ξ(+|λ) and ξ(−|λ) for each λ, with ξ(+|λ)+ξ(−|λ)=1.  

  The statistics for preparation A:  
  p(+|A) = μ_A(λ1)ξ(+|λ1) + μ_A(λ2)ξ(+|λ2) = (1)ξ(+|λ1) + (0)ξ(+|λ2) = ξ(+|λ1).  
  But p(+|A)=1/2, so ξ(+|λ1)=1/2.  

  Similarly, p(−|A)=ξ(−|λ1)=1/2 (since μ_A(λ2)=0).  

  Now for preparation B:  
  p(+|B) = μ_B(λ1)ξ(+|λ1) + μ_B(λ2)ξ(+|λ2) = (1/2)(1/2) + (1/2)ξ(+|λ2) = 1/4 + (1/2)ξ(+|λ2).  
  But we require p(+|B)=1, so:  
  1/4 + (1/2)ξ(+|λ2) = 1 → (1/2)ξ(+|λ2) = 3/4 → ξ(+|λ2)=3/2, which is greater than 1 and impossible.  

  Thus, T1 cannot be extended to include N.  

  *Model T2*:  
  Λ = {λ1, λ2, λ3}.  

  For preparation A:  
  p(+|A) = μ_A(λ1)ξ(+|λ1) + μ_A(λ2)ξ(+|λ2) + μ_A(λ3)ξ(+|λ3) = (1)ξ(+|λ1) + (0)ξ(+|λ2) + (0)ξ(+|λ3) = ξ(+|λ1).  
  Set equal to 1/2: so ξ(+|λ1)=1/2, hence ξ(−|λ1)=1/2.  

  For preparation B:  
  p(+|B) = μ_B(λ1)ξ(+|λ1) + μ_B(λ2)ξ(+|λ2) + μ_B(λ3)ξ(+|λ3) = (0)ξ(+|λ1) + (1/2)ξ(+|λ2) + (1/2)ξ(+|λ3) = (1/2)[ξ(+|λ2) + ξ(+|λ3)].  
  Set equal to 1: so (1/2)[ξ(+|λ2) + ξ(+|λ3)] = 1 → ξ(+|λ2) + ξ(+|λ3) = 2.  

  Since each ξ is a probability (so 0≤ξ≤1), this implies ξ(+|λ2)=1 and ξ(+|λ3)=1.  

  Thus, we set:  
  - ξ(+|λ1)=1/2, ξ(−|λ1)=1/2.  
  - ξ(+|λ2)=1, ξ(−|λ2)=0.  
  - ξ(+|λ3)=1, ξ(−|λ3)=0.  

  This is a valid extension. However, note that for λ1, the response function for N is stochastic (probabilities 1/2). So we have at least one ontic state (λ1) for which the response to N is not deterministic.  

  *Model T3*:  
  Λ = {λ1,λ2,λ3}.  

  For preparation A:  
  p(+|A) = μ_A(λ1)ξ(+|λ1) + μ_A(λ2)ξ(+|λ2) + μ_A(λ3)ξ(+|λ3) = (1/2)ξ(+|λ1) + (1/2)ξ(+|λ2) + (0)ξ(+|λ3).  
  Set equal to 1/2: (1/2)ξ(+|λ1) + (1/2)ξ(+|λ2) = 1/2 → ξ(+|λ1) + ξ(+|λ2) = 1.  

  For preparation B:  
  p(+|B) = μ_B(λ1)ξ(+|λ1) + μ_B(λ2)ξ(+|λ2) + μ_B(λ3)ξ(+|λ3) = (0)ξ(+|λ1) + (1/2)ξ(+|λ2) + (1/2)ξ(+|λ3).  
  Set equal to 1: (1/2)ξ(+|λ2) + (1/2)ξ(+|λ3) = 1 → ξ(+|λ2) + ξ(+|λ3) = 2.  

  Again, this forces ξ(+|λ2)=1 and ξ(+|λ3)=1.  

  Then from the equation for A: ξ(+|λ1) + 1 = 1 → ξ(+|λ1)=0.  

  Thus, we set:  
  - ξ(+|λ1)=0, ξ(−|λ1)=1.  
  - ξ(+|λ2)=1, ξ(−|λ2)=0.  
  - ξ(+|λ3)=1, ξ(−|λ3)=0.  

  This is a valid extension and is outcome-deterministic for every ontic state and for both measurements.  

  Now consider the family of models:  
  μ_A = (1−q, q, 0) on (λ1,λ2,λ3)  
  μ_B = (0, q′, 1−q′)  
  M-response: ξ(0|λ1)=1, ξ(0|λ2)=1, ξ(0|λ3)=0 (so ξ(1|λ1)=0, ξ(1|λ2)=0, ξ(1|λ3)=1).  

  We require to extend to N.  

  For preparation A:  
  p(+|A) = (1−q)ξ(+|λ1) + q ξ(+|λ2) + 0 = (1−q)ξ(+|λ1) + q ξ(+|λ2) = 1/2.  

  For preparation B:  
  p(+|B) = 0*ξ(+|λ1) + q′ ξ(+|λ2) + (1−q′) ξ(+|λ3) = q′ ξ(+|λ2) + (1−q′) ξ(+|λ3) = 1.  

  We must have for each λ, ξ(+|λ) and ξ(−|λ) nonnegative and sum to 1.  

  From the equation for B:  
  q′ ξ(+|λ2) + (1−q′) ξ(+|λ3) = 1.  

  Since ξ(+|λ2) ≤ 1 and ξ(+|λ3) ≤ 1, the left-hand side is ≤ q′*1 + (1−q′)*1 = 1. Equality holds only if ξ(+|λ2)=1 and ξ(+|λ3)=1.  

  Thus, we must set ξ(+|λ2)=1 and ξ(+|λ3)=1.  

  Then the equation for A becomes:  
  (1−q)ξ(+|λ1) + q * 1 = 1/2 → (1−q)ξ(+|λ1) = 1/2 - q.  

  Since ξ(+|λ1) must be between 0 and 1, the right-hand side must be nonnegative:  
  1/2 - q ≥ 0 → q ≤ 1/2.  

  If q ≤ 1/2, we can set ξ(+|λ1) = (1/2 - q)/(1−q).  

  But for the extension to be outcome-deterministic, we require that for each λ, ξ(+|λ) is either 0 or 1.  

  For λ1, ξ(+|λ1) = (1/2 - q)/(1−q). This is 0 or 1 only in special cases.  
  - If we set it to 0: then (1/2 - q)/(1−q)=0 → 1/2 - q =0 → q=1/2.  
  - If we set it to 1: then (1/2 - q)/(1−q)=1 → 1/2 - q = 1−q → 1/2=1, impossible.  

  Thus, the only outcome-deterministic extension occurs when q=1/2.  

  Note that for the model to be maximally ψ-epistemic, we require D(A,B)=1/2 and D(B,A)=1/2.  

  D(A,B) = Σ_{λ ∈ supp(μ_B)} μ_A(λ). The support of μ_B is the set of λ with μ_B(λ)>0: {λ2, λ3} (since q′>0 and 1−q′>0, assuming 0<q′<1). Then:  
  D(A,B) = μ_A(λ2) + μ_A(λ3) = q + 0 = q.  
  Set equal to 1/2: q=1/2.  

  Similarly, D(B,A) = Σ_{λ ∈ supp(μ_A)} μ_B(λ). The support of μ_A is {λ1,λ2} (if q>0 and 1−q>0). Then:  
  D(B,A) = μ_B(λ1) + μ_B(λ2) = 0 + q′.  
  Set equal to 1/2: q′=1/2.  

  Thus, the condition for maximal ψ-epistemicity is q=1/2 and q′=1/2. And indeed, only when q=1/2 do we get an outcome-deterministic extension.  

  **Part (d)**

  The student's argument has a strong point: for a fixed set of operational data (here, the statistics for M), multiple ontological models can be constructed that are empirically equivalent but differ in their classification as ψ-ontic or ψ-epistemic. This seems to suggest that the choice between these interpretations is underdetermined by the operational data.  

  However, the argument fails at step (iii) and (iv). The key oversight is that the ψ-ontology distinction is intended to apply to a model of the entire quantum theory, not just a fragment. The student considers only one measurement (M), but quantum theory has many measurements. When we extend the models to include a second measurement (N), we see that T1 cannot be extended at all, T2 requires stochastic response functions, and T3 can be extended deterministically. Thus, the models are not empirically equivalent for the full set of measurements.  

  Moreover, the fact that the models are constrained by the requirement to reproduce the statistics for N shows that the ψ-ontology classification is not arbitrary: it has empirical consequences when we consider the entire set of quantum measurements.  

  For the realist question to be settled, we need an argument that applies to the full quantum theory. The Pusey-Barrett-Rudolph (PBR) theorem and similar results show that under an additional assumption (preparation independence: that the ontic states of separately prepared systems are independent), any model that reproduces the predictions of quantum mechanics for composite systems must be ψ-ontic. This extra assumption is what gives empirical traction.  

  In the single-system fragment, we see that ψ-epistemic models are possible (like T3). But for composite systems, the independence assumption (which is natural but not logically necessary) rules them out. Therefore, the question is not verbal: it turns on whether the independence assumption holds.  

  The student's premise (iv) is thus false: the classification is not arbitrary because it constrains what extensions are possible. In particular, T1 fails to extend, while T2 and T3 extend but with different properties. The fact that maximal ψ-epistemicity (in T3) is linked to the possibility of a deterministic extension (in part (c)) shows that the structure of Λ is not arbitrary but is tied to the model's ability to reproduce quantum mechanics fully.  

