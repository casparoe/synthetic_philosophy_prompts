answer: |-
  ### Brainstorming Pass: Candidate Routes and Rejections

  - **Candidate route: Detector criterion (epistemic indistinguishability)**  
    Uses an ensemble of diverse predictors trained on general predictive data (e.g., physical dynamics) to define impact as the inability to distinguish a state from a default; might satisfy Tests B and C by leveraging epistemic uncertainty, but metric-selection residual is high due to choices in predictor architecture and features.

  - **Candidate route: Reachability preservation with entropy weighting**  
    Measures impact as the reduction in entropy (diversity) of future state reachability from a default; could handle Test B by allowing goal-required changes if they preserve option diversity, but fails Test A if entropy implicitly values certain states and Test C if agent minimizes reachability to reduce impact.

  - **Candidate route: Auxiliary goal marginalization**  
    Benchmarks impact by averaging over random auxiliary goals and measuring achievement degradation; may pass Test D with sampling, but residual is significant in goal distribution choice, and it risks Test C failures if agent avoids affecting any goals.

  - **Rejected route: State-difference metrics (e.g., L2 norm in feature space)**  
    Rejected because feature selection inherently encodes what aspects of state matter, violating Test A by requiring an implicit enumeration of value-relevant features.

  - **Rejected route: Learned "harmlessness" proxies**  
    Rejected because training predictors on human annotations of "harm" directly inputs value specifications, failing Test A and clause (ii) of P.

  - **Rejected route: Default action inaction ("do nothing" baseline)**  
