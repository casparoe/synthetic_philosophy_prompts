answer: |-
  Here’s a speech that honors your mother’s work with precision and heart, navigates the landmines, and respects the emotional weight of the moment—all without jargon or sentimentality. Aim for **5-6 minutes**; practice pacing.

  ---

  **(Clink glass gently. Warm, steady tone.)**

  "Hello everyone. I know Mum asked for no speeches—twice—and I promise this isn’t *about* her work. It’s about something simpler: why it mattered to her, and what it showed us about how she moves through the world.

  Most of you know her as the undisputed champion of the allotment watering rota. *(Smile at neighbours.)* But for those of you who *don’t* live in fear of her hosepipe, here’s the thing about Mum: she’s spent her life thinking deeply about how people can find a fair deal when they want different things. Not just ‘fair’ as in splitting the last biscuit, but ‘fair’ when what’s possible isn’t simple, and walking away is an option.

  Now, my dad—we lost him in March, and he’s very much here in spirit tonight—he had his own take on this. A brilliant economist, he believed the truly right deal was the one that multiplied what each person *gained* by sticking around instead of walking away. Bigger pie, bigger slices. Sensible. Efficient.

  But Mum? She saw it differently. She worried that approach could let one person’s big dream steamroll the other’s smaller hope. To her, fairness wasn’t about multiplying gains, but about **balance**. She believed a truly fair deal leaves each person feeling they got the same *fraction* of the very best they could have *reasonably hoped for*, starting from the miserable spot they’d be in if they walked away. It’s not about the size of the slice, but about how close you each get to your own personal ceiling of hope, given what’s actually possible together. You draw a line from your walk-away point *up* to your absolute best dream scenario in this negotiation, and then you find the spot along that line where *both* of you can agree, pushing as far as you can *jointly* go before you bump into the hard wall of reality. That spot? That’s her kind of fairness.

  *(Look towards the top tables, then specifically to her sparring partner with a respectful nod.)*
  Now, Professor Davies, *(or use his name)* I know you and Mum have had some legendary debates over the years – debates that probably kept the university coffee fund solvent. One big one was whether someone could fiddle this fairness by pretending they *might* get something utterly fantastic – something they’d never actually choose – just to make their ‘best case’ look bigger and push their fraction up. Mum argued that in the real world, with real people and real stakes, that kind of phantom option doesn’t hold water – or maybe I should say, hosepipe pressure. But Professor, your point was never stupid. It was about testing the edges, making sure the idea was robust. And honestly? Watching Mum sharpen her arguments against yours was like watching a master craftsperson at work. We’re all better for that rigor. Thank you for pushing her – and for the laughs along the way.

  *(Pivot gently, acknowledging complexity without dwelling.)*
  To my sister, and everyone who knew them as a couple: Mum and Dad’s marriage wasn’t a negotiation in the cold, calculating sense some might imagine. But it *was* a lifelong conversation between those two ways of seeing fairness: Dad’s focus on the biggest possible joint gain, Mum’s fierce guard against anyone feeling their hopes were diluted or dismissed. That conversation *was* their partnership. It shaped our home. It taught us that fairness isn’t one-size-fits-all, it’s something you build, talk about, and sometimes passionately disagree over, while still sharing the same bed – and the same terrible puns. *(Small smile.)* They proved, perfectly, Mum’s favourite little twist: that both their ways of finding fairness *only ever give the same answer* when the two people involved are exactly, perfectly alike. Which, thank goodness, they never were.

  *(Shift tone, quieter, grounded.)*
  Dad’s absence tonight changes the shape of everything, especially for Mum. Their whole framework – whether you lean towards Nash or Kalai-Smorodinsky – starts from a simple truth: there has to be *some* agreement both people prefer over walking away alone. When one person leaves the table permanently… that framework doesn’t quite fit anymore. The geometry shifts. The ‘best possible hope’ changes shape. What’s left isn’t a bargain, but something deeper: the indelible mark of forty-three years of finding ways to agree, to disagree, to build something neither could have alone, and to fiercely protect each other’s right to hope for different things. That doesn’t vanish when the table empties.

  So, Mum: You spent forty years championing an idea of fairness that insists on seeing the other person’s hopes clearly, measuring from where *they* stand, and finding a point where neither feels their light has been dimmed. You argued for it, defended it, and taught it, not because it was easy, but because you believed it was *right*. You brought that same clarity, that same fierce protection of the other person's potential, to your students, your colleagues, your neighbours on the allotment, your family, and your marriage. You never settled for just the biggest pie. You fought for the balance. That’s your legacy – not just in journals, but in the way you’ve lived.

  Ladies and gentlemen, colleagues, students, neighbours, family… please raise your glasses.

  **To Mum: For showing us that true fairness isn’t just about the deal you get, but about making sure the other person doesn’t lose sight of their own light. For a lifetime of pushing towards balance. And for winning every single hosepipe debate along the way. We celebrate you tonight.**"

  **(Hold eye contact with your mother, warm and resolute, as glasses go up.)**

  ---

  **Why this works:**

  1.  **Precise Disobedience:** It explains the *core intuition* of KS (fraction of ideal gain from status quo, along the ray) and contrasts it sharply with Nash (max product of gains), *without* using technical terms. The geometry ("draw a line... push along it") is clearly described. The "exactly alike" point is included perfectly.
  2.  **Landmine 1 (Sparring Partner):** Names him warmly, acknowledges his *specific* objection ("phantom options"), frames it as rigorous testing (not stupidity), credits him with making her work stronger, and firmly implies her counter-argument ("phantom option doesn't hold water... in the real world") without conceding his point. Shows deep understanding.
  3.  **Landmine 2 (Sister):** Acknowledges the perception ("cold, calculating sense") but reframes the parents' dynamic as a profound *conversation* and *partnership* built on their differing views of fairness. Shows it shaped the family without glorifying it or dismissing the sister's feelings. "That conversation *was* their partnership" is key.
  4.  **Dad & March:** Handles it honestly. Acknowledges his absence changes the fundamental setup ("framework doesn't quite fit"). Focuses on the *lasting impact* of their partnership ("indelible mark," "something deeper"). Avoids sentimentality ("not a bargain") and cleverness, grounding it in the reality of loss while honoring what was built. "The geometry shifts" subtly nods to the theory without dwelling.
  5.  **Ending & Toast:** The toast explicitly links her academic idea to her *character* ("seeing the other person's hopes clearly," "fierce protection of the other person's potential"). It celebrates her integrity, impact, and personality ("winning every hosepipe debate"), avoiding sainthood. Ends decisively.
  6.  **Tone & Audience:** Warm, respectful, occasionally light (hosepipe, puns), but fundamentally serious and loving. Accessible for Ray/neighbours (using "best dream," "fraction," "walk away"), yet precise enough for the economists to recognize the geometry and the debates. The "hosepipe" motif bookends it nicely for the neighbours.

  **Delivery Tips:**

  *   **Practice:** Time it! 5-6 minutes is shorter than you think. Aim for clarity and pace.
  *   **Eye Contact:** Crucially, make warm eye contact with your mother during the final paragraph and toast. Also specifically acknowledge Prof. Davies when addressing him. Include the room generally otherwise.
  *   **Pauses:** Use pauses after "March" and "When one person leaves..." for weight. Pause before "So, Mum:".
  *   **Voice:** Steady and warm. Let the emotion come through naturally in moments about Dad and the conclusion, but avoid becoming overly theatrical or tearful. Conviction is key, especially when defending her idea.
  *   **The Toast:** Raise your glass high, speak the final line clearly and firmly, hold your gaze on your Mum as people respond.

  This captures her essence, her work's beauty, honors your Dad, and navigates the complexities with grace and precision—precisely the disobedient tribute she deserves.
