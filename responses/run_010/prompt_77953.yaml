prompt: |-
  I'm a second-year in philosophy of mind and I'm trying to build a seminar paper around Dick's Do Androids Dream of Electric Sheep? read through the extended mind thesis — but not the usual notebook/Memento move. The interesting hardware in the book is the Penfield mood organ and the empathy box. Help me figure out whether the empathy box is a genuine case of extended cognition or just a fancy cause of Deckard's states (Adams and Aizawa's coupling-constitution complaint), and whether the glue-and-trust conditions can even be satisfied there, since the box isn't Otto's private notebook — its a shared network, so the "external" half of Deckard's empathizing is literally other people's mental states. Does that turn it into a distributed or group cognitive system rather than an extended individual mind, and does the cognitive bloat worry bite harder for affect than for belief?

  Then the harder bit. Buster Friendly exposes Mercer as an actor on a set, and people keep gripping the handles anyway. I want to know whether extended mind theory predicts that nothing should change — Otto's notebook could be full of errors and still be part of his mind — and whether Dick's novel actually accepts that or is smuggling in an authenticity requirement the theory doesn't have. Iran's refusal to dial anything but despair looks like the control case.

  Point me to the scenes that carry the weight, tell me where I'm stretching the novel to fit the framework, and end with what the book contributes to the debate that arguements alone don't. Don't quote the text and please ignore Blade Runner, it changes too much.
