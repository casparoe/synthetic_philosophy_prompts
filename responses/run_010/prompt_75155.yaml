answer: |-
  ## Conference Q&A Clash  
  *Setting: Evolutionary biology symposium Q&A after a talk on non-adaptive traits. Speaker DR. ARKWRIGHT (defending strict Gould/Lewontin) has just invoked the San Marco spandrels.*

  **DR. ARKWRIGHT:** ...and so, just as the evangelists were *fitted* to the inevitable pendentives, not the pendentives designed *for* them, we must resist adaptationist just-so stories for every trait!  
  **DR. BRACKETT (Adaptationist, politely skeptical):** Fascinating analogy, Dr. Arkwright. But hold on – didn’t the builders *choose* pendentives over squinches? They *selected* pendentives precisely because those curved triangles create large, stable surfaces *optimally suited* for grand mosaics! It wasn't geometric necessity; it was brilliant pre-adaptation for ornamentation!  
  **DR. ARKWRIGHT (Flustered):** Well... the *origin*! The *initial* structural function...  
  **BRACKETT:** Exactly! So before we declare a trait a mere 'spandrel', shouldn't we rigorously test *alternative architectural hypotheses*? Rule out that the 'byproduct' shape wasn't *itself* directly selected for its utility? You know, apply the methodological standard?  
  **ARKWRIGHT (Defeated, mumbling into the mic):** ...Fine. *Fine*. Maybe the pendentives *were* an adaptation... *for future mosaic-hanging*. But that just proves my point! The *later* mosaic use is the exaptation! A classic Gouldian...  
  **BRACKETT (Quietly, to neighbour):** ...So his flagship example of a non-adaptive byproduct might be an adaptation, and admitting that requires calling its *own* utility an exaptation *after the fact*? We’ve just replaced one just-so story with another. We haven't *proven* the pendentives weren’t *always* intended for mosaics.  
  **ARKWRIGHT (Overhearing, voice cracking slightly):** ...We'll need grant money. For Venetian architectural historians. And radiocarbon dating the mortar. *Lots* of dating.  

  ---

  **Punchline Dependence:** This exploits the third asymmetry – the subsequent critique that the San Marco pendentives *themselves* might have been selected (an adaptation) for their suitability as mosaic surfaces. The humour turns on the internal irony: the defender of the anti-adaptationist methodological standard (test alternatives!) is hoist by his own petard when forced to admit his key example *requires* that same rigorous testing he champions, potentially undermining the very non-adaptive status of the spandrel analogy. The retreat to "origin vs later use" (exaptation) highlights the circularity/complexity introduced by this critique.
