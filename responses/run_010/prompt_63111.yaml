prompt: |-
  Longtime lurker of the rationalist-blog sphere (going back to when some of it was still on livejournal, basically), and there's a pattern I've been chewing on for years that I can't find a word for. Not really a philosophy question — more a "does this exist as a named thing" question.

  The pattern: a category starts as somebody's description of a group of people who were already there. The group learns the description and starts using it on themselves. That's the boring half. The half I keep coming back to is that the category then gets *rebuilt out of the people it changed*, and afterwards the older records get quietly re-scored against the rebuilt version — so from outside it all looks like one continuous natural kind, and the loop you're standing in is invisible.

  Instances I have in mind:

  - "Masking" in autism. Circulated as community vocabulary first — autistic adults describing what they actually do in social situations. Then somebody builds a self-report scale out of those self-descriptions (the CAT-Q, I think), and the scale gets used in studies that feed back into how the criteria and the interview questions are worded. The instrument is downstream of a thing that was reshaped by the instrument's ancestors.
  - When Asperger's got folded into the spectrum, existing case files were re-coded under the new wording, so the prevalence curves everyone argues about aren't measuring one constant thing across the break — and the re-coding is exactly what hides the break.
  - Small one from my own world: a forum coins a term for a failure mode (akrasia-flavored stuff, or whatever the current equivalent is), people start using it in their own introspective reports, and years later a questionnaire about that failure mode gets validated partly on people who learned the concept from the forum.

  I half-remember some philosopher of science having a phrase for categories that change the people they're applied to, but I can't recall it and it doesn't cover the re-scoring part anyway. Also on my list of near-misses: self-fulfilling prophecy, Goodhart, the observer effect, performativity, diagnostic creep/inflation, medicalization. None of them seem to capture the loop closing back onto the criteria plus the retroactive re-scoring that erases the trace.

  So: (1) is there an established concept for this exact configuration? (2) If the neighbors only partly fit, tell me which slice of my description each one covers and which slice it misses — I care about the carving way more than the label. (3) If nothing fits, coin something, define it, and give me boundary cases: what counts, what doesn't, and one case that looks like it but isn't.

  Please lead with your bottom line in the first sentence and then give the reasoning — no preamble, and don't restate my question back at me.
reasoning: |-
  Hmm, this user has been part of the rationalist blogosphere for a long time and noticed a specific pattern where categories evolve through feedback loops. They described how a term starts as a description of an existing group, gets adopted by that group, then gets formalized into tools like questionnaires, which then reshape the category itself. Older data gets reinterpreted based on the new version, making the evolution invisible. The user gave examples like autism "masking," the Asperger's merger into ASD, and forum terminology becoming formal concepts.

  The user wants to know if there's a named concept for this exact pattern. They mentioned several near-misses like self-fulfilling prophecy, Goodhart's Law, performativity, and diagnostic creep, but none fully capture the loop plus retroactive re-scoring. My task is to: 1) Identify if an established concept exists, 2) If not, explain how the near-misses relate and what they miss, or 3) Coin a new term and define it clearly.

  First, I need to recall if any philosophy of science or social theory concepts fit this. The user half-remembered something about categories changing the people they're applied to. That sounds like Hacking's "looping effect," which describes how human kinds evolve when classified. But does it include the retroactive re-scoring? In Hacking's work, the classification changes behaviors, which then alters the category, but he might not emphasize the historical reinterpretation part directly. Still, it could be close.

  Other concepts: Self-fulfilling prophecy focuses on beliefs causing outcomes, but doesn't cover the criterion shift. Goodhart's Law is about metrics becoming useless when targeted, which isn't exactly the same. Performativity (like Austin or Butler) deals with language creating realities, but it's broader and not specific to recursive criterion shifts. Diagnostic creep involves expanding definitions over time, but misses the feedback from community adoption and data re-scoring.

  After thinking, I don't think there's a perfect match. The closest is Hacking's looping effect, but it needs to be extended to include the erasure of historical breaks. So, I'll propose coining a new term: "criterion drift through recursive reclassification." That captures the core loop: definition changes based on community use, tools are built, and past data is re-evaluated, hiding the discontinuity.

  Now, for the response structure: Lead with the bottom line upfront, as requested. Then explain why the near-misses don't fit, and define the new term with examples. Include boundary cases to clarify—e.g., what counts (like the autism masking), what doesn't (simple diagnostic creep without re-scoring), and a look-alike that isn't (like natural language evolution without formal tools).

  The user cares deeply about precise carving, so I'll be meticulous in comparisons. For instance, looping effect misses the retroactive re-scoring, while performativity is too broad. Finally, ensure the answer is concise—no fluff, just as they asked.
answer: |-
  **No single established concept fully captures your described pattern (criterion evolution via adoption, tool-building, and retroactive re-scoring erasing discontinuity), but "looping effect of human kinds" (Hacking) is the closest neighbor.** Here's the carving:

  1.  **Established Concepts & Their Fit:**
      *   **Hacking's "Looping Effect" (of Human Kinds)**: Covers the core dynamic: a classification (e.g., "autistic person") changes the self-understanding and behavior of those classified ("masking"), which then necessitates changes to the classification itself. **Fits:** The feedback loop where the category changes the people, who then change the category. **Misses:** Explicitly addressing the *formalization* (scales, diagnostic criteria) built *from* the changed group's self-reports *and* the critical **retroactive re-scoring of historical data** that hides the break in continuity (e.g., recoding Asperger's files as ASD).
      *   **Performativity (Austin, Butler)**: Covers how language/descriptions (like a diagnostic label or forum term) don't just describe but *create* the reality they name, shaping identities and behaviors. **Fits:** The initial adoption changing self-concept and behavior ("masking" becomes a conscious practice). **Misses:** The specific feedback loop into *formal scientific/measurement tools* (CAT-Q) and the **erasure of historical discontinuity via re-scoring**.
      *   **Diagnostic Creep/Criterion Inflation**: Covers the expansion or shift in diagnostic criteria over time, increasing prevalence. **Fits:** The *outcome* of criteria changing (e.g., ASD spectrum broadening). **Misses:** The *mechanism* driven by *adoption and self-description* within the classified group, the building of tools *from* that, and the **retroactive re-scoring hiding the break**. It focuses on expansion, not the loop.
      *   **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure")**: Covers the distortion when targeting a metric. **Fits:** Vaguely, when a self-report scale (CAT-Q) built *from* self-reports becomes a *target* for diagnosis/identification. **Misses:** The prior loop of category adoption/change, the building of the tool *itself* from the changed group, and the **retroactive re-scoring erasing history**.
      *   **Self-Fulfilling Prophecy**: Covers how a belief leads to actions that make the belief true. **Fits:** The initial adoption potentially reinforcing the described behavior. **Misses:** The evolution of the *category definition itself*, the formal tool-building based on changed behavior, and **retroactive re-scoring**.
      *   **Observer Effect/Reactivity**: Covers how measurement changes the phenomenon. **Fits:** The act of classification changing behavior. **Misses:** The *recursive evolution of the classification criteria* based on the changed behavior and the **systematic erasure of the break via historical re-coding**.

  2.  **A Coined Concept: Criterion Drift Through Recursive Reclassification (CDTRR)**
      *   **Definition:** A process where:
          1.  A descriptive label `L` is applied to a group `G`.
          2.  Members of `G` adopt `L`, integrating it into their self-understanding and behavior, effectively creating a modified group `G'`.
          3.  Formal criteria, definitions, or measurement tools `T` are constructed based primarily on observations or self-reports *of* `G'`.
          4.  `T` is then used to re-evaluate or reclassify *historical* instances or data points *originally* identified under prior understandings of `L` or related concepts.
          5.  This re-scoring obscures the discontinuity between `G` and `G'`, making the evolved category (`L` as defined by `T`) appear as a continuous natural kind.
      *   **Boundary Cases:**
          *   **What Counts:** Your examples (Masking/CAT-Q/ASD criteria evolution; forum term -> introspective report -> validated questionnaire). The adoption of "Queer" as an identity leading to academic frameworks built *from* that lived experience, subsequently used to reinterpret historical figures/texts, hiding shifts in the term's meaning.
          *   **What Doesn't Count:**
              *   *Simple Diagnostic Creep without Adoption/Re-scoring:* Adding a new symptom to a disorder based solely on clinician observation, without significant group self-adoption changing behavior, and without re-coding old cases. The *mechanism* differs.
              *   *Pure Performativity without Formal Tools/Re-scoring:* A group adopting a label and changing behavior, but without the creation of formal diagnostic tools *based on that changed behavior* and without systematic re-evaluation of historical data against the new standard. The loop isn't closed onto formal criteria and history.
              *   *Natural Linguistic Drift:* The meaning of a common word (e.g., "awful" meaning awe-inspiring -> terrible) changing over time through usage. Lacks the *formalization* step (`T`) and the *systematic re-scoring of historical instances* against the new definition.
          *   **Looks Like But Isn't:** **The "Barnum Effect" in personality testing.** People endorse vague, general descriptions as highly accurate for themselves. This involves self-report and adoption *of a description*, and tools (tests) are built. **Why it's different:** The descriptions weren't *originally* derived from the specific group's self-reports; they are *inherently* vague and applicable to most people. There's no specific `G -> G'` transformation based on adopting the label itself, nor is there systematic **retroactive re-scoring of historical cases** against a new, *specific* criterion set derived from `G'`. The feedback loop and historical erasure are absent; it's about cognitive bias in interpretation, not category evolution.
