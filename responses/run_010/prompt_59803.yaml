answer: |-
  Here's the move-by-move analysis, followed by key omissions and advice:

  **Analysis Table**

  | Move # | Whose Move | What They're Actually Claiming                                                                                          | Rating                          | Why (Two Sentences Max)                                                                                                                               | Status                                                                                          |
  | :----- | :--------- | :---------------------------------------------------------------------------------------------------------------------- | :------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------- |
  | **1**  | Theo       | Announcing an irreversible public commitment (like 12%) early makes threats credible and forces the opponent to concede. | **Defensible but incomplete**   | Irreversible commitment *can* enhance credibility (Schelling). However, it ignores the opponent's ability to make *their own* costly commitment, increasing collision risk. | **Settled:** Commitment theory is core, but unilateral moves in symmetric games are risky (well-established). |
  | **2**  | Miriam     | Matching commitments are dangerous when the opponent (Admin) has stronger incentives to appear tough, leading to mutual loss. | **Clearly right**               | Admin often faces greater internal pressure to resist (trustees/shareholders). Mutual commitment escalation ("commitment race") is a classic path to impasse/disaster. | **Settled:** Mutual hardening leading to breakdown is a fundamental risk in bargaining (empirically/common sense). |
  | **3**  | Theo       | Without *any* commitment mechanism, threats lack credibility ("cheap talk") and invite exploitation.                   | **Clearly right**               | Uncredible threats are ignored. Negotiation power requires demonstrating a capacity and willingness to walk away or impose costs if demands aren't met. | **Settled:** Core tenet of game theory and negotiation strategy (Nash, Schelling, empirical bargaining). |
  | **4**  | Miriam     | Credibility comes better from binding ratification by members (a non-unilateral reversal) than from public statements. | **Defensible but incomplete**   | Ratification *is* a strong commitment device, aligning negotiators with constituents. However, it may not signal resolve *as immediately* to the opponent pre-impasse. | **Genuinely Contested:** Effectiveness depends on opponent's perception of member resolve & timing. Ratification is strong but not always *sufficiently* salient early on. |
  | **5**  | Theo       | Ratification is a "slow" commitment; Admin can exploit the delay, waiting until pressure (end of semester) forces concessions. | **Partly right**                | Time pressure *is* a real leverage point. Admin *might* stall hoping union urgency increases. However, ratification also imposes future costs on Admin (strike risk, disruption). | **Settled (nuance):** Time is a factor, but stalling carries risks for both sides. Theo overstates exploitability. |
  | **6**  | Miriam     | Ratification allows Admin to concede later without public humiliation ("blink without us losing face"), enabling deals. | **Clearly right**               | Providing off-ramps is crucial for deal-making. Ratification lets Admin claim they got "the best possible deal" to trustees, avoiding direct capitulation to public demands. | **Settled:** Face-saving mechanisms are essential for resolving disputes (diplomacy & negotiation literature). |

  **What Both Are Missing & Advice**

  **Missing Nuances:**  
  1.  **The "Floor" Itself:** Neither deeply questions if 12% is strategically optimal *before* committing. Is it ambitious but achievable, or likely dismissed?  
  2.  **Alternative Signals:** Commitment isn't binary (public ultimatum vs. ratification). Smaller, escalating actions (targeted protests, membership votes *authorizing* strike, not just ratifying) can signal resolve without boxing you in early.  
  3.  **Admin's Perception:** How Admin views your membership's unity and resolve matters more than the exact commitment mechanism. A fractured union weakens any tactic.

  **What To Do About the 12% Floor:**  
  **Don't publicly announce it as an irreversible ultimatum now.** Miriam is largely correct about the risks. Instead, **internally commit** to 12% as your walk-away point. **Signal resolve** through membership mobilization (e.g., a strong strike authorization vote) and frame 12% ambitiously *within* negotiations. **Preserve the ratification off-ramp** Miriam advocates – it's your strongest safety valve. Announce the floor publicly *only* if talks stall badly and you need maximum pressure, accepting the heightened collision risk Theo highlights.
