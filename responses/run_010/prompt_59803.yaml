  For the ratings, I'll need to reference bargaining literature where possible. The key is distinguishing settled concepts from genuine academic disputes - like whether Miriam's ratifier mechanism truly solves commitment problems. Also noting where both miss things: Theo underestimates admin's parallel commitment capacity, Miriam might overlook immediate tactical pressure.

