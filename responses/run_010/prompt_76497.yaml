  **INSTITUTIONAL ANIMAL CARE AND USE COMMITTEE (IACUC)**
  **PROTOCOL REVIEW FORM - VERTEBRATE & HIGHER INVERTEBRATE STUDIES**
  **Protocol Title:** Mitigation of *Vespula spp.* Nest Activity in Proximity to Human Dwelling (Project: DECK-CLEAR)
  **Principal Investigator:** Dave Henderson (Homeowner)
  **Department:** Residential Property Management, 42 Maple Drive
  **Species:** *Vespula germanica* (Suspected German Yellowjacket)
  **Location:** Subterranean void beneath west-facing deck, 42 Maple Drive.
  **IACUC Protocol #:** RES-2023-0017A (Pending)

  **1. PURPOSE OF THE PROCEDURE:**
  To eliminate an active *Vespula* nest located immediately adjacent to a high-traffic residential area (primary deck access, children's play zone). The primary objective is the prevention of unprovoked defensive stings to human occupants, particularly the minor resident (age 7, history of moderate local reaction). Secondary objective is the restoration of safe use of the designated outdoor recreational space (Deck Area Alpha). While acknowledging the species' role in arthropod population control and potential pollination services (limited data for *V. germanica*), the proximity-induced conflict necessitates intervention. This is not a research protocol but a necessary welfare/safety action, arguably falling under "Field Studies - Pest Management" per *ACUC Guideline 7.12b (Amended)*.

  **2. NUMBER OF ANIMALS JUSTIFIED:**
  Based on diurnal ingress/egress observations (standardized 5-min counts, 3x daily, over 5 days; avg. 12.4 wasps/min during peak foraging, 0900-1100 hrs) and nest size estimation via ground resonance (gentle tapping yielded audible cavity ~25cm diameter), the colony is estimated to contain 200 - 500 adult workers. This range accounts for foraging cohorts, internal nurses/guards, and larval stages (acknowledged non-sentient per current consensus, though larval feedback mechanisms warrant future ethical review). Justification: **Replacement** is impossible (nest cannot be relocated intact; local apiaries decline *Vespula*). **Reduction** is inherent to the objective (nest elimination). **Refinement** is sought via method selection (see Sec 4) to minimize suffering. Given the fixed location and threat profile, a colony-level approach is unavoidable; targeting individual foragers is ineffective and potentially *increases* defensive behaviour. The number is fixed by the colony's biology and location, not experimental design.
  > *IACUC Note (Margin): "Estimate lacks precision. Provide statistical range (mean +/- SD) or confidence interval from observational data. Justification for larval exclusion requires citation (see Guideline 4.3f)."*

  **3. ALTERNATIVES CONSIDERED:**
  *   **No Action:** Unacceptable risk. Documented aggression near nest entrance (>3 near-miss stings during passive observation). High probability of human-wasp interaction.
  *   **Physical Exclusion/Barrier:** Structural infeasible. Nest void inaccessible without deck demolition (prohibitively costly, introduces new hazards).
  *   **Commercial Repellents/Citronella:** Demonstrably ineffective against established nests. May cause agitation without termination, *increasing* risk.
  *   **Professional Pest Control (Outsourcing):** Considered. However, this merely transfers the ethical burden and operational control without reducing overall animal impact. Financially burdensome ($250-$400 quote). Does not align with **Refinement** goal (operator methods may be less considered).
  *   **"Live and Let Live" / Seasonal Attrition:** Acknowledged natural history: colony senesces autumn; only new queens overwinter. *However*, this allows 6-8 more weeks of high sting risk and prevents deck use during prime season. New queens produced *this* season may establish nuisance nests *next* season nearby. Is allowing natural death truly "cost-free" ethically if preventable harm occurs meanwhile? **Selected Alternatives for Implementation:**
      *   **A. Soapy Water Saturation:** (Refinement Focus) Rapidly degrades cuticular wax, causing suffocation via spiracle occlusion. Theoretical rapid onset (seconds-minutes), but dependent on complete inundation. Unconfirmed reports of prolonged distress if inundation incomplete. Requires close approach for application (risk to operator).
      *   **B. Insecticidal Dust (e.g., Tempo):** (Reduction Focus) Neurotoxin. Slower acting (hours-days), allowing affected workers to return, distribute toxin within nest, potentially leading to broader colony collapse with less direct operator risk. Prolonged neurological impairment vs. rapid suffocation? Comparative suffering literature for Hymenoptera is scant. Seeking **Refinement** through rapid knockdown (A) vs. potential for reduced *observable* distress spread via social mechanism (B). Proposal leans towards **A** pending further distress analysis (Sec 5).

  **4. PAIN AND DISTRESS:**
  Current understanding (Eisemann et al. 1984 analogues, Barron & Klein 2016 debates) suggests insects *may* possess nociception but capacity for conscious suffering (sentience) remains unresolved, probability estimated low (p < 0.1 by some models, though Bayesian priors are hotly contested). *However*, precautionary principle dictates assuming potential for distress warrants mitigation. Both proposed methods induce death, likely accompanied by aversive sensations.
  *   **Soapy Water:** Potential for rapid anoxia (presumed low distress if instantaneous) vs. possible prolonged drowning sensation/spiracle irritation if incomplete coverage. Distress Level: **Moderate (Acute)**, Duration: **Seconds to Minutes**.
  *   **Insecticidal Dust:** Neurotoxicity leading to paralysis, potentially preceded by hyperexcitation or lethargy. Distress Level: **Uncertain, potentially Moderate-Severe**, Duration: **Hours**.
      *   *Sentience Calculus Attempt:* (Prob. Sentience) * (Harm Magnitude) = Negative Utility. Assuming p(sentience) = 0.05 (conservative), Harm Magnitude for Soapy Water (rapid) = 5, Dust (prolonged) = 8. NU(Soap) = 0.25, NU(Dust) = 0.4. Suggests Soapy Water marginally preferable... but both values are distressingly non-trivial under this model. Uncomfortable conclusion: any action imposes non-zero probable suffering.
  > *IACUC Note (Margin): "Quantitative sentience models are not validated for IACUC review. Focus on observable indicators of distress per Guide (e.g., avoidance, writhing). Provide citations for distress levels assigned."*

  **5. HUMANE ENDPOINT:**
  The procedure endpoint *is* death of the colony. For Method A, endpoint is immediate upon successful inundation. Monitoring for cessation of activity will occur at 24h and 48h post-application. Any observed survivors exhibiting significant distress (e.g., prolonged writhing, inability to fly) will be euthanized immediately via sharp blunt force trauma (swatter) – considered instantaneous for arthropods. For Method B, endpoint is defined as >48 hours with zero observed ingress/egress activity. Distressed individuals encountered during monitoring will be similarly euthanized. The nest entrance will be sealed with soil 7 days post-activity cessation to prevent reuse.

  **6. NON-TARGET AND ENVIRONMENTAL EFFECTS:**
  *   **Non-Target Insects:** Direct exposure minimized by targeted application into nest entrance during low activity (dusk). Soapy Water (A) has low residual activity, degrading rapidly. Insecticidal Dust (B) carries higher risk of exposure to beneficial arthropods (bees, spiders) entering the void later or dust drift. **A is strongly preferred here.**
  *   **Soil/Microbiome:** Soapy water (dilute solution, <5% dish soap) poses negligible risk to soil chemistry/biome. Dust may have localized residual effects, though binding to soil particles reduces bioavailability.
  *   **Vertebrates:** Pets and child will be excluded during and for 24h post-application. Low risk due to subterranean application. No known secondary poisoning risk for Method A. Method B requires careful adherence to label precautions.
  *   **Environmental Benefit Claim:** Elimination of this colony prevents the predation of an estimated 1,000-2,500 caterpillars and other soft-bodied insects per week by its workers during its remaining lifespan (based on literature consumption rates per worker). This constitutes a net positive ecological impact locally.
  > *IACUC Note (Margin): "Benefit claim unsubstantiated and inappropriate for this form. Ecological impacts are not considered 'benefits' offsetting harm in vertebrate protocols. Avoid double-counting; the predation was already noted as an ecological role in Sec 1. Do not include."*

  **7. CONSULTATION WITH AN EXPERT:**
  Consulted extensively with Dr. A. Webb (PhD Entomology, online forum moderator, "WaspsWithoutHate.org"). Dr. Webb advocates non-lethal methods but acknowledged the significant risk in this scenario. Advised dusk application, full protective gear, and expressed a personal preference for soapy water on theoretical "clean kill" grounds vs. neurotoxins, though admitted empirical data is lacking. Also confirmed the impracticality of relocation and seasonal attrition timeline. Peer-reviewed literature on *Vespula* euthanasia ethics is virtually non-existent; consultation relied on expert opinion and vertebrate euthanasia principle extrapolation.
  > *IACUC Note (Margin): "Documentation of expert consultation is inadequate. Require formal letter or email from Dr. Webb attesting to the discussion and specific recommendations. Verify credentials."*

  **Principal Investigator Signature:** ___________________________ (Dave Henderson)
  **Date:** 10/26/2023

  **IACUC REVIEW OUTCOME:** **RETURNED FOR REVISIONS** (See marginal notes and summary below)
  *Summary:* Justification requires stronger statistical basis for animal count and larval exclusion. Distress assessment lacks empirical support; remove quantitative sentience modeling. Expert consultation must be formally documented. Environmental "benefit" claim is invalid. Clarify exact soap concentration/protocol for Method A. Address non-target risks of Method B more thoroughly if retained as alternative. Protocol cannot be approved in current form. Resubmit within 30 days.
