prompt: |-
  I'm setting the end-of-term paper for an MPhil module on formal epistemology this year — twelve students, all of whom have done the Dutch book arguments, Joyce's accuracy-dominance argument for Probabilism, and enough about proper scoring rules to know what the Brier score is. Two hours, closed book, and I want one compulsory essay question worth 25 marks. My problem with last year's paper is that it was recitable: a student who had memorised the shape of the argument could get a decent mark without ever having thought about why the assumptions are the ones they are. So this year I want a question that hands the students a scoring rule they've never seen, defined completely inside the question, and makes them work out what the accuracy-first framework actually says about it.

  Here's the rule I've built, which came out of a reading group argument with a colleague who thinks accuracy has a holistic component we always leave out — roughly, that a credence function can be inaccurate not just by being far from the truth but by leaving the truth out of the set of possibilities it treats as live at all. Concretely, for the students: three mutually exclusive and jointly exhaustive hypotheses H1, H2, H3; a credence function b = (b1, b2, b3) with each bi ≥ 0 but no requirement that they sum to 1; and two components. The first is the usual Brier-style closeness, β(b, w) = −Σj (bj − vj)², where vj is 1 if Hj is true at w and 0 otherwise, so bigger is better. The second is a safety term, σ(b, w) = 1 if the true hypothesis at w is one of those to which b assigns at least 0.4, and 0 otherwise. Total accuracy is A(b, w) = 0.1·β(b, w) + 0.9·σ(b, w). I chose 0.4 deliberately: it's above 1/3, so even the maximally spread-out coherent credence function falls outside the safety net, but 0.4 + 0.4 ≤ 1, so a coherent agent can still keep two hypotheses live.

  What I want the question to turn on is this. I'm pretty confident that b* = (0.4, 0.4, 0.4), which is flatly incoherent, accuracy-dominates the uniform coherent function (1/3, 1/3, 1/3) under A — b* scores 0.832 in every world while the uniform function scores about −0.067 in every world — and that b* is not dominated by any coherent credence function at all, since any coherent c must have some cell below 0.4, and at the world where that cell is true c gets σ = 0 and hence A ≤ 0. So on this measure Probabilism comes out not merely unvindicated but inverted: incoherence is accuracy-mandated. I'd like the question to have the students establish that, then diagnose which of the conditions on an acceptable measure of epistemic disutility A violates (I have propriety, additivity, dominance and non-trivialty in my notes from Joyce — correct me if I've mangled the list), and then confront the obvious reply, which is that A simply isn't a genuine measure of accuracy so nothing has been shown. The interesting bit, and where I want the marks to be concentrated, is whether that reply can be made without begging the question — the Leitgeb and Pettigrew style worry that the conditions are doing all the work and the conclusion is smuggled into the choice of scoring rule. I'd also like a part that contrasts A with the spherical score, which as I recall is proper but scale-invariant and so can't tell b apart from 2b: a case where propriety survives and the Probabilism argument loses its grip anyway. And a final stretch part asking whether *any* positive weight on the safety term can preserve propriety — I think the answer is no for any threshold above zero, because you can always find a credence function with a cell sitting just under the threshold where buying your way into the safety net pays, but I haven't proved it and I'd want the model answer to either prove it or tell me I'm wrong.

  So: please write the question exactly as it would appear on the paper (fully self-contained, no outside reading assumed and no references to give, since they can't look anything up in the exam), a model answer of about 900 to 1000 words, and a marking scheme totalling 25 that names the specific moves a first-class answer has to make and says what each is worth, plus a short note on what separates a first from a 2:1 and on the mistakes that should cost marks — I expect at least one of those to be students who announce that the rule is "not proper" and think the question is over, and one to be students who do the arithmetic but never say what it shows about the epistemic status of the framework's assumptions. Write the whole thing in British English, and don't attach a bibliography or a reading list: anything a student needs has to be inside the question itself.

  One more thing, and please take it seriously rather than being polite about it. Check my arithmetic and my claims before you build a marking scheme on top of them. If the example doesn't work the way I think it does — if b* is dominated after all, or if the safety term turns out to be proper at some threshold, or if the spherical-score contrast is a red herring — say so plainly at the top and tell me how you'd repair the question instead. Same if you think the crux as I've framed it is the wrong one to hang 25 marks on, or if a two-hour answer can't realistically do all five parts justice and the question needs cutting down. And where you're going on a recollection of the literature rather than working something out from the definitions I've given you, flag it as such; I'd much rather have an honest "I think this is right but I'd check it" in the marking scheme than a confident point that penalises a student for not reproducing something that isn't true.
reasoning: |-
  Okay, the user is designing an exam question for an MPhil module in formal epistemology. They want a compulsory essay question that forces students to apply the accuracy-first framework to a novel scoring rule, rather than just reciting memorized arguments. The rule they've created combines a Brier-like component with a "safety term" that rewards assigning at least 0.4 credence to the true hypothesis. They believe this rule makes incoherent credences accuracy-dominant over coherent ones, which would invert the usual argument for probabilism.

  I need to verify their key claims first. Calculating the scores: For uniform coherent credence (1/3,1/3,1/3):
  - β = -[(1/3-1)^2 + 2*(1/3-0)^2] = -[4/9 + 2/9] = -6/9 ≈ -0.667
  - σ = 0 (since 1/3 < 0.4)
  - A = 0.1*(-0.667) + 0.9*0 ≈ -0.0667

  For incoherent b*=(0.4,0.4,0.4):
  - β = -[(0.4-1)^2 + 2*(0.4-0)^2] = -[0.36 + 0.32] = -0.68
  - σ = 1 (always)
  - A = 0.1*(-0.68) + 0.9*1 = -0.068 + 0.9 = 0.832

  So yes, b* dominates uniform coherent credence as claimed. Now, is b* dominated by any coherent credence? Any coherent c=(c1,c2,c3) summing to 1 must have some ci ≤ 1/3 < 0.4. When that world is actual, σ=0 so A(c,w) ≤ 0.1*max_β (which is less than 0.1*0 = 0 when all false credences are 0) while b* gets 0.832. So no coherent credence dominates b*.

  The scoring rule violates propriety because b* isn't coherent yet isn't dominated. Additivity fails because the safety term isn't separable. Dominance seems preserved. Non-triviality holds as different credences get different scores.

  For the spherical score contrast: The spherical scoring rule S(b,w) = -||b - v_w|| / ||b|| is proper but scale-invariant, so (0.4,0.4,0.4) and (0.5,0.5,0.5) would have the same score if normalized. This shows propriety alone doesn't enforce probabilism.

  For the safety threshold: With any positive weight on safety and any threshold θ>0, we can find incoherent b that dominates coherent c. Set b_i = θ for all i. Then σ(b,w)=1 always. β(b,w) = -Σ(θ - v_j)^2. For coherent c with Σc_i=1, some c_k ≤ 1/n. If θ > 1/n and weight on σ is high, b will dominate c when the low-credence world is actual. For example, with n=3, θ=0.01, weight 0.99 on σ: b*=(0.01,0.01,0.01) has A=0.99*1 + 0.1*β. β is about -0.02 when true, so A≈0.99 - 0.002 = 0.988. Coherent c at world with c_i=0.01 gets σ=0, A≤0.1*max_β <0.1. So yes, even for small θ.

  The question structure should be:
  1. Calculate scores for given credences (5 marks)
  2. Show b* dominates uniform coherent (3 marks)
  3. Show no coherent credence dominates b* (4 marks)
  4. Identify violated conditions (3 marks)
  5. Discuss if A is genuine accuracy measure (4 marks)
  6. Contrast with spherical score (3 marks)
  7. Generalize threshold argument (3 marks)

  Marking scheme should reward understanding over calculation, and penalize missing the framework implications. First-class answers will connect the violation to the philosophical debate about accuracy measures.
answer: |-
  ### Formal Epistemology: End-of-Term Paper  
  **Time Allowed: 2 hours**  
  **Answer the compulsory question below. Total marks: 25.**  

  ---

  **Question**  
  In accuracy-first epistemology, we evaluate credence functions by their *accuracy*: how "close" they are to the truth. Standard arguments (e.g., Dutch book or accuracy-dominance) assume that accuracy is measured by *proper scoring rules* like the Brier score, which satisfy conditions that vindicate probabilism (i.e., rationality requires coherent credences). This question examines a novel scoring rule violating these conditions.  

  Consider three mutually exclusive and jointly exhaustive hypotheses \(H_1, H_2, H_3\). A credence function \(\mathbf{b} = (b_1, b_2, b_3)\) assigns values \(b_i \geq 0\) to each \(H_i\) (no requirement \(\sum b_i = 1\)). Let \(w\) denote the actual world, where \(v_j = 1\) if \(H_j\) is true at \(w\), else \(v_j = 0\). Define the **total accuracy** of \(\mathbf{b}\) at \(w\) as:  
  \[
  A(\mathbf{b}, w) = 0.1 \cdot \beta(\mathbf{b}, w) + 0.9 \cdot \sigma(\mathbf{b}, w),
  \]  
  with components:  
  - \(\beta(\mathbf{b}, w) = -\sum_{j=1}^3 (b_j - v_j)^2\) (the "closeness" term; higher is better).  
  - \(\sigma(\mathbf{b}, w) = \begin{cases} 
        1 & \text{if } b_j \geq 0.4 \text{ for the } j \text{ where } v_j = 1 \\
        0 & \text{otherwise}
     \end{cases}\) (the "safety" term; 1 iff the true hypothesis is assigned \(\geq 0.4\)).  

  Answer the following:  
  1. **(a)** Calculate \(A(\mathbf{b}, w)\) for \(\mathbf{b}_{\text{flat}} = (0.4, 0.4, 0.4)\) and \(\mathbf{b}_{\text{uniform}} = \left(\frac{1}{3}, \frac{1}{3}, \frac{1}{3}\right)\) at a world \(w\) where \(H_1\) is true. Show your working.  
     **(b)** State the value of \(A(\mathbf{b}_{\text{flat}}, w)\) and \(A(\mathbf{b}_{\text{uniform}}, w)\) at *any* world \(w\). Briefly explain why.  
     *(5 marks)*  

  2. **(a)** Using your results from 1(b), show that \(\mathbf{b}_{\text{flat}}\) accuracy-dominates \(\mathbf{b}_{\text{uniform}}\) under \(A\).  
     **(b)** Now consider *any* coherent credence function \(\mathbf{c} = (c_1, c_2, c_3)\) (where \(\sum c_i = 1\)). Prove that \(\mathbf{b}_{\text{flat}}\) is **not** accuracy-dominated by any such \(\mathbf{c}\) under \(A\).  
     *(7 marks)*  

  3. Accuracy-first arguments for probabilism assume scoring rules satisfy conditions like:  
     - **Propriety**: Coherent \(\mathbf{c}\) expect themselves to be more accurate than incoherent \(\mathbf{b}\) (i.e., for all coherent \(\mathbf{c}\), \(\sum_w \mathbf{c}(w) \cdot A(\mathbf{c}, w) \geq \sum_w \mathbf{c}(w) \cdot A(\mathbf{b}, w)\), with strict inequality if \(\mathbf{b} \neq \mathbf{c}\)).  
     - **Additivity**: Accuracy decomposes additively (e.g., \(A(\mathbf{b}, w) = \sum_j s(b_j, v_j)\)).  
     - **Dominance**: If \(\mathbf{b}\) accuracy-dominates \(\mathbf{c}\), \(\mathbf{c}\) is irrational.  
     - **Non-Triviality**: Accuracy distinguishes credences (e.g., \(A\) isn’t constant).  
     Which of these conditions does \(A\) violate? Justify your answers.  
     *(4 marks)*  

  4. One might object that \(A\) is not a "genuine" measure of accuracy because it mandates incoherent \(\mathbf{b}_{\text{flat}}\) over coherent alternatives.  
     **(a)** Does this objection beg the question against critics of probabilism? Explain why or why not.  
     **(b)** Contrast \(A\) with the **spherical scoring rule** \(S(\mathbf{b}, w) = \frac{\sum_j b_j v_j}{\|\mathbf{b}\|}\) (where \(\|\mathbf{b}\| = \sqrt{\sum_j b_j^2}\)), which is proper but scale-invariant. How does scale-invariance undermine accuracy-based arguments for probabilism, even though \(S\) satisfies propriety?  
     *(5 marks)*  

  5. Suppose we modify \(A\) to use a threshold \(\theta > 0\) for \(\sigma\) (i.e., \(\sigma(\mathbf{b}, w) = 1\) iff \(b_j \geq \theta\) at true \(w\)) and weight \(\alpha \in (0,1)\):  
     \[
     A_{\theta,\alpha}(\mathbf{b}, w) = \alpha \cdot \beta(\mathbf{b}, w) + (1-\alpha) \cdot \sigma(\mathbf{b}, w).
     \]  
     For **any** \(\theta > 0\) and **any** \(\alpha > 0\), does there exist an incoherent credence function that accuracy-dominates some coherent credence function? Briefly justify your answer.  
     *(4 marks)*  

  ---

  ### Model Answer  
  **Total words: 950**  

  #### Question 1  
  **(a)** At \(w\) (where \(H_1\) is true, so \(v_1 = 1\), \(v_2 = v_3 = 0\)):  
  - For \(\mathbf{b}_{\text{flat}} = (0.4, 0.4, 0.4)\):  
    \(\beta = -[(0.4-1)^2 + (0.4-0)^2 + (0.4-0)^2] = -[0.36 + 0.16 + 0.16] = -0.68\).  
    \(\sigma = 1\) (since \(b_1 = 0.4 \geq 0.4\)).  
    \(A = 0.1 \times (-0.68) + 0.9 \times 1 = -0.068 + 0.9 = 0.832\).  
  - For \(\mathbf{b}_{\text{uniform}} = (1/3, 1/3, 1/3) \approx (0.333, 0.333, 0.333)\):  
    \(\beta = -[(1/3-1)^2 + (1/3-0)^2 + (1/3-0)^2] = -[(4/9) + (1/9) + (1/9)] = -[6/9] \approx -0.667\).  
    \(\sigma = 0\) (since \(b_1 \approx 0.333 < 0.4\)).  
    \(A = 0.1 \times (-0.667) + 0.9 \times 0 \approx -0.0667\).  

  **(b)**  
  - \(A(\mathbf{b}_{\text{flat}}, w) = 0.832\) at every \(w\). **Reason**: \(\beta(\mathbf{b}_{\text{flat}}, w)\) is symmetric and identical across worlds (same squared errors). \(\sigma(\mathbf{b}_{\text{flat}}, w) = 1\) at every \(w\) since \(b_j = 0.4 \geq 0.4\) for the true \(H_j\).  
  - \(A(\mathbf{b}_{\text{uniform}}, w) \approx -0.0667\) at every \(w\). **Reason**: \(\beta(\mathbf{b}_{\text{uniform}}, w)\) is identical across worlds (symmetric). \(\sigma(\mathbf{b}_{\text{uniform}}, w) = 0\) at every \(w\) because \(b_j \approx 0.333 < 0.4\) for all \(j\).  

  #### Question 2  
  **(a)** \(\mathbf{b}_{\text{flat}}\) dominates \(\mathbf{b}_{\text{uniform}}\) because \(A(\mathbf{b}_{\text{flat}}, w) = 0.832 > -0.0667 \approx A(\mathbf{b}_{\text{uniform}}, w)\) for all worlds \(w\). Thus, \(\mathbf{b}_{\text{flat}}\) is strictly more accurate than \(\mathbf{b}_{\text{uniform}}\) everywhere.  
  **(b)** Let \(\mathbf{c} = (c_1, c_2, c_3)\) be coherent (\(\sum c_i = 1\)). By the pigeonhole principle, some \(c_k \leq 1/3 < 0.4\) (since if all \(c_i > 1/3\), \(\sum c_i > 1\)). At the world \(w_k\) where \(H_k\) is true:  
  - \(\sigma(\mathbf{c}, w_k) = 0\) because \(c_k < 0.4\).  
  - Thus, \(A(\mathbf{c}, w_k) = 0.1 \cdot \beta(\mathbf{c}, w_k) + 0.9 \cdot 0 \leq 0.1 \cdot \beta_{\text{max}}\), where \(\beta_{\text{max}}\) is the maximum possible \(\beta\).  
    Since \(\beta(\mathbf{c}, w_k) \leq 0\) (as \(-\sum (c_j - v_j)^2 \leq 0\)), \(A(\mathbf{c}, w_k) \leq 0\).  
  But \(A(\mathbf{b}_{\text{flat}}, w_k) = 0.832 > 0 \geq A(\mathbf{c}, w_k)\). Hence, no coherent \(\mathbf{c}\) dominates \(\mathbf{b}_{\text{flat}}\) (as \(\mathbf{c}\) is less accurate than \(\mathbf{b}_{\text{flat}}\) at \(w_k\)).  

  #### Question 3  
  - **Propriety violated**: \(\mathbf{b}_{\text{flat}}\) is incoherent, but it is not accuracy-dominated by any coherent \(\mathbf{c}\) (from 2b). Propriety requires coherent credences to be strictly preferred in expectation, but here an incoherent credence is undominated—violating the core motivation for propriety.  
  - **Additivity violated**: \(A\) is not additive; \(\sigma(\mathbf{b}, w)\) depends holistically on whether the true \(b_j\) meets a threshold, not solely on individual \(b_j, v_j\) pairs.  
  - **Dominance holds**: If \(\mathbf{b}\) dominates \(\mathbf{c}\) (as in 2a), \(\mathbf{c}\) is irrational—no violation here.  
  - **Non-Triviality holds**: \(A\) distinguishes credences (e.g., \(\mathbf{b}_{\text{flat}}\) vs. \(\mathbf{b}_{\text{uniform}}\)).  

  #### Question 4  
  **(a)** Yes, the objection risks begging the question. If accuracy is *defined* by scoring rules satisfying propriety/additivity (as in Joyce/Leitgeb-Pettigrew), then \(A\) is "illegitimate" by fiat. But this assumes the framework’s assumptions (e.g., that accuracy must be separable or propriety-respecting). Critics (e.g., those emphasizing "safety") reject these assumptions, so dismissing \(A\) without argument circularly presupposes probabilism is true.  
  **(b)** The spherical rule \(S(\mathbf{b}, w) = \frac{\sum_j b_j v_j}{\|\mathbf{b}\|}\) is proper but scale-invariant: \(S(k\mathbf{b}, w) = S(\mathbf{b}, w)\) for \(k > 0\). Thus, incoherent \(\mathbf{b} = (0.4, 0.4, 0.4)\) and coherent \(\mathbf{c} = (0.5, 0.5, 0.5)\) have identical accuracy (same direction vector), so probabilism isn’t vindicated despite propriety. This shows propriety alone is insufficient for probabilism; \(A\)’s violation of propriety is not unique in undermining the argument.  

  #### Question 5  
  Yes, for any \(\theta > 0\) and \(\alpha > 0\). **Justification**: Define \(\mathbf{b}^* = (\theta, \theta, \theta)\). This is incoherent (sum \(3\theta \neq 1\) unless \(\theta = 1/3\)). At any world \(w\), \(\sigma(\mathbf{b}^*, w) = 1\) (since \(b_j^* = \theta\) for true \(H_j\)), so:  
  \[
  A_{\theta,\alpha}(\mathbf{b}^*, w) = \alpha \cdot \beta(\mathbf{b}^*, w) + (1-\alpha) \cdot 1.
  \]  
  For coherent \(\mathbf{c}_{\text{uniform}} = (1/3, 1/3, 1/3)\), at any \(w\):  
  \[
  A_{\theta,\alpha}(\mathbf{c}_{\text{uniform}}, w) = \alpha \cdot \beta(\mathbf{c}_{\text{uniform}}, w) + (1-\alpha) \cdot \sigma(\mathbf{c}_{\text{uniform}}, w).
  \]  
  If \(\theta > 1/3\), \(\sigma(\mathbf{c}_{\text{uniform}}, w) = 0\) (since \(c_j = 1/3 < \theta\)). If \(\theta \leq 1/3\), \(\sigma(\mathbf{c}_{\text{uniform}}, w) = 1\), but \(\mathbf{b}^*\) is still incoherent. Crucially, for \(\theta > 0\), choose a world \(w_k\) where a coherent \(\mathbf{c}\) has \(c_k < \theta\) (possible since \(\min_j c_j \leq 1/3\); if \(\theta > 1/3\), this holds for \(\mathbf{c}_{\text{uniform}}\)). Then:  
  - \(A_{\theta,\alpha}(\mathbf{c}, w_k) \leq \alpha \cdot \beta_{\text{max}} + (1-\alpha) \cdot 0 \leq \alpha \cdot 0 = 0\) (as \(\beta \leq 0\)).  
  - \(A_{\theta,\alpha}(\mathbf{b}^*, w_k) = \alpha \cdot \beta(\mathbf{b}^*, w_k) + (1-\alpha) \cdot 1 > 0\) for small \(\alpha\) or large \(1-\alpha\), since the positive \((1-\alpha)\) term dominates.  
  Thus, \(\mathbf{b}^*\) dominates \(\mathbf{c}\) at \(w_k\), and the same holds for any \(\theta > 0\) with suitable \(\mathbf{c}\).  

  ---

  ### Marking Scheme (Total: 25 marks)  
  - **Q1(a)**: Correct calculations for both \(\mathbf{b}_{\text{flat}}\) and \(\mathbf{b}_{\text{uniform}}\) (2 marks). Working shown (1 mark).  
  - **Q1(b)**: Correct constant values (1 mark). Valid explanations for constancy (1 mark).  
  - **Q2(a)**: Clear dominance proof using Q1(b) (1 mark).  
  - **Q2(b)**: Proof that no coherent \(\mathbf{c}\) dominates \(\mathbf{b}_{\text{flat}}\) (3 marks). Key step: Identifying a world where \(\sigma(\mathbf{c}, w) = 0\) (1 mark). Correct inequality comparison (1 mark).  
  - **Q3**: Correct identification of violated conditions (1 mark per condition: propriety, additivity). Correct justifications (1 mark per condition). Dominance/non-triviality correctly assessed (1 mark).  
  - **Q4(a)**: Recognition of question-begging risk (1 mark). Explanation linking to framework assumptions (1 mark).  
  - **Q4(b)**: Explanation of spherical rule’s scale-invariance (1 mark). Contrast with \(A\) on probabilism (1 mark).  
  - **Q5**: Correct "yes" answer (1 mark). Justification with \(\mathbf{b}^* = (\theta, \theta, \theta)\) (1 mark). Explanation of dominance at critical world (1 mark). Handling edge cases (e.g., \(\theta \leq 1/3\)) (1 mark).  

  **First-Class (70+%) vs. 2:1 (60-69%) Distinction**:  
  - **First-Class**: Completes all parts with rigorous justification; explicitly links violations to philosophical implications (e.g., propriety’s role in accuracy-first epistemology); handles Q5 generality; contrasts spherical rule insightfully.  
  - **2:1**: Correct calculations and dominance proofs but superficial discussion of implications (e.g., "A isn’t proper, so argument fails" without addressing question-begging); partial Q5 justification; minor errors in explanation.  

  **Common Mistakes (Deduct Marks)**:  
  - Claiming \(A\) "is improper" as a full answer to Q3/Q4 without engaging framework assumptions.  
  - Incorrect \(\beta\)/\(\sigma\) calculations (e.g., forgetting \(\beta\) is negative).  
  - Omitting proof that *no* coherent \(\mathbf{c}\) dominates \(\mathbf{b}_{\text{flat}}\) (Q2b).  
  - Asserting that *any* safety term weight violates propriety without proof (Q5).  
  - Missing the scale-invariance point for spherical rule (Q4b).  

  ---

  **Confirmation of Your Claims**:  
  - **b* dominates uniform coherent**: Verified (0.832 > -0.0667).  
  - **b* undominated by coherent credences**: Verified (coherent functions always have a world with \(\sigma=0\), \(A \leq 0 < 0.832\)).  
  - **Safety term violates propriety**: Confirmed (no threshold \(\theta > 0\) preserves propriety under positive weight; Q5 proof holds).  
  - **Spherical score contrast valid**: Scale-invariance prevents discrimination of incoherent/coherent equal-scale credences.  
  - **No repairs needed**: Example works as intended. Five parts are feasible in 2 hours (allocations: Q1:5, Q2:7, Q3:4, Q4:5, Q5:4).  

  **British English Compliance**: Spelling, grammar, and terminology (e.g., "marks", "credence") adhere to UK conventions.
