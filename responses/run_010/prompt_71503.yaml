prompt: |-
  I run a small claims registry at a public-health nonprofit. We keep a database of health claims — things like "this supplement lowers blood pressure" — that partner orgs' automated tools read directly off our API. Every entry gets exactly one status: confirmed, refuted, or unresolved. The pipeline downstream is dumb: anything that isn't confirmed gets treated as not-true, so refuted and unresolved look identical to the bots.

  We get ~30 submisions a day, and a chunk of them are about other entries rather than about the world — "entry 2210 is wrong", "none of the claims tagged mercury are confirmed", that sort of thing. Right now our only rule is that a volunteer deletes any submission whose text mentions its own entry number. That's obviously too crude, and I'm fairly sure it's wrong in both directions.

  Can you write me a triage procedure my volunteers can run on each of these meta-claims? They're smart people with no logic background, each submission gets maybe ten minutes, and a staff editor signs off on anything the procedure flags. I want it grounded in whatever the logic of truth actually has to say that's usable here — groundedness, hierarchies, gaps, loops — but delivered as steps, not as theory: what to check first and in what order, what counts as enough to confirm versus hold versus reject outright, and the points where the procedure has to stop and hand the thing to a human because what's left isn't a factual question at all.

  Then run it on these four, one short paragraph each:

  1. "Entry 2210 is confirmed," where 2210 is an ordinary empirical claim sitting in the registry with good evidence behind it.
  2. "Entry 4471 is refuted," where 4471 reads "entry 4502 is confirmed," and 4502 is the submission you're holding.
  3. "No entry tagged mercury is confirmed," and at the moment there is exactly one mercury-tagged entry in the registry: this one.
  4. "This entry will not be confirmed."

  Number four is the one that keeps me up at night, because of how our pipeline collapses unresolved into false. If the procedure says hold-as-unresolved, the bots treat it as not-true, which is exactly what the claim asserts — so it looks like we make it true by refusing to confirm it, and any status we pick seems to feed back. Tell me straight whether a triage procedure can survive that at all, or whether the fix has to be in the pipeline rather then the triage, and if it's the pipeline, say what would have to change.

  Also: mark clearly which of your steps are judgment calls dressed up as procedure, give me at least one case where the procedure produces a result I'll hate, and end with three bullets on what it can't do. Keep the whole thing under 900 words.
reasoning: |-
  Hmm, the user runs a small claims registry for a public-health nonprofit. They're dealing with meta-claims - submissions about other entries in their database - and their current approach of deleting any submission that mentions its own entry number is too crude. They need a triage procedure for volunteers to handle about 30 submissions daily, with each getting about 10 minutes of review time.

  The user is concerned about logic paradoxes, especially with claims like "This entry will not be confirmed" where any status assignment creates a problem. Their pipeline currently treats anything not confirmed as "not-true," which collapses refuted and unresolved claims. They want a grounded, step-by-step procedure that volunteers can follow without logic background, with clear steps on what to confirm, hold, or reject.

  I need to create a triage procedure that's practical and addresses these meta-claims. The procedure should start with simple checks and escalate to more complex ones. For judgment calls, I'll be transparent about where volunteers need to make decisions. I also need to apply this procedure to the four examples they provided, and address that troublesome fourth claim specifically.

  For the triage procedure, I'll structure it as:
  - Initial scan: Check for basic validity like entry existence and self-reference
  - Content analysis: Determine what the claim is targeting
  - Evidence check: Look for supporting documentation
  - Status logic: Apply rules based on the claim's nature
  - Escalation: Flag complex cases for human review

  The fourth claim "This entry will not be confirmed" is particularly tricky because of the pipeline's behavior. I need to explain that the fundamental issue is in the pipeline treating unresolved as false. The fix requires changing how the pipeline handles unresolved claims - they should remain in a neutral state rather than being treated as false.

  For the procedure, I'll note where judgment is required - like determining if a claim is "about the registry" or assessing evidence quality. I'll also provide a case where the procedure might produce an undesirable outcome, such as when a meta-claim about multiple entries has mixed evidence.

  Finally, I'll include three limitations: inability to resolve self-referential paradoxes within the system, dependence on evidence quality, and inability to prevent all pipeline misinterpretations without structural changes.
answer: |-
  Here's a grounded triage procedure for meta-claims, designed for non-logicians, with steps, judgment call flags (🔥), limitations, and analysis of your samples:

  **Triage Procedure for Meta-Claims (10-Minute Max)**

  1.  **Initial Scan (1 min):**
      *   Read the submission text clearly identifying the *target* (e.g., Entry ID, tag, rule) and the *assertion* (e.g., "is confirmed", "is wrong", "no entry is confirmed").
      *   **Check 1 (Reject):** Does the text mention its *own* entry number? → **REJECT OUTRIGHT** (Existing rule).
      *   **Check 2 (Hold):** Is the target unclear/impossible (e.g., "Entry 9999", but max entry is 5000)? → **HOLD FOR EDITOR REVIEW** (Needs clarification).
      *   **Check 3 (Hold):** Is the assertion illogical *regardless of target*? (e.g., "This claim is both true and false"). → **HOLD FOR EDITOR REVIEW** (Fundamental nonsense).

  2.  **Target Identification & Status Check (2 min):**
      *   Identify the specific entry ID(s), tag(s), or rule(s) the claim is *about*.
      *   Look up the *current status* of the identified target(s) in the registry.
      *   **Check 4 (Confirm/Refute):** Does the claim *directly state the current status* of its target? (e.g., Claim says "Entry 100 is confirmed", and Entry 100 *is* Confirmed). → **CONFIRM**.
      *   **Check 5 (Refute):** Does the claim *directly contradict the current status* of its target? (e.g., Claim says "Entry 100 is refuted", but Entry 100 *is* Confirmed). → **REFUTE** (Based on current registry state).
      *   **Check 6 (Hold):** Does the claim *depend on the status of unresolved entries*? (e.g., "None of the Mercury entries are Confirmed", but some Mercury entries are Unresolved). → **HOLD FOR EVIDENCE REVIEW** (Current registry state is incomplete for judgment).

  3.  **Evidence & Logic Check (5 min - Judgment Heavy 🔥):**
      *   **If Check 6 triggered OR claim is about tags/rules (not specific entries):**
          *   Review linked evidence/documentation in the submission.
          *   **🔥 Judgment Call:** Is the evidence credible and *directly relevant* to the *registry status* (e.g., new study definitively overturning evidence for a confirmed entry, proof a tag application is wrong) OR establishing a logical rule about the registry? (e.g., Proof an entry cites a retracted paper).
          *   **Yes (Strong Evidence):** → **HOLD FOR EDITOR REVIEW** (Potential status change for target(s), needs sign-off).
          *   **No (Weak/No Evidence):** → **REFUTE** (Insufficient grounds to challenge current status/tag).
      *   **Check 7 (Hold - Paradox Risk):** Does the claim *create a potential loop or paradox* when combined with its own status? (e.g., Claims about its own future status, claims where assigning *any* status seems contradictory). → **HOLD FOR EDITOR REVIEW** (Flagged as high-risk).

  4.  **Final Triage (2 min):**
      *   If not resolved by Checks 1-7: → **REFUTE** (Default for unresolved meta-claims lacking clear evidence to alter the registry).

  **Procedure Applied to Your Samples:**

  1.  **"Entry 2210 is confirmed" (2210 = Confirmed Empirical Claim):**
      *   Check 1: No self-ref. Check 2: Target clear (2210). Check 3: Logical assertion.
      *   Check 4: Claim states "2210 is Confirmed". Registry shows 2210 *is* Confirmed. → **CONFIRM**.

  2.  **"Entry 4471 is refuted" (4471 = "Entry 4502 is confirmed"; 4502 = This Submission):**
      *   Check 1: **YES** (4502 is *this* submission). → **REJECT OUTRIGHT**.

  3.  **"No entry tagged mercury is confirmed" (Only Mercury entry = This One):**
      *   Check 1: No self-ref (mentions tag, not own ID). Check 2: Target clear ("mercury" tag). Check 3: Logical assertion.
      *   Check 4/5: Not about a single entry's specific status.
      *   Check 6: Claim depends on status of *all* Mercury-tagged entries. Registry shows *only* this entry (Unresolved) has the tag *at this moment*.
          *   **🔥 Judgment Call:** Is "No entry is Confirmed" proven true *right now* because the only entry is unresolved (treated as not Confirmed)? **Yes (Current State).** → **CONFIRM** (Reflects the *current factual state of the registry*: zero Confirmed Mercury entries).
      *   *Note: If another Confirmed Mercury entry existed, Check 5 would trigger → REFUTE.*

  4.  **"This entry will not be confirmed":**
      *   Check 1: **Implicit Self-Reference** (🔥 Judgment Call: "This entry" clearly refers to itself). Strictly, it doesn't *mention* its ID number, so doesn't auto-reject. **Proceed cautiously.**
      *   Check 3: Assertion is logical in form.
      *   Check 7: **HIGH RISK PARADOX.**
          *   If we CONFIRM it: It says it won't be confirmed, but we did confirm it → Contradiction.
          *   If we REFUTE it: We assert it *will* be confirmed. But assigning Refuted *now* doesn't confirm it later. Pipeline treats Refuted as not-true. "This entry will not be confirmed" is now treated as not-true, meaning "It *will* be confirmed" → Contradiction (we said it won't be, by refuting it).
          *   If we leave it UNRESOLVED: Pipeline treats it as not-true ("This entry will not be confirmed" is False), meaning "It *will* be confirmed" → Contradiction (we haven't confirmed it).
      *   → **HOLD FOR EDITOR REVIEW (PARADOX FLAGGED).** The procedure catches it (Check 7).

  **The "This entry will not be confirmed" Problem:**

  *   **The triage procedure *can* survive it by flagging it (Check 7) and kicking it to an editor.**
  *   **However, the *pipeline* is fundamentally broken for this case.** Collapsing `refuted` and `unresolved` into "not-true" destroys the neutral state needed for self-referential claims about future status. Assigning *any* final status (`confirmed`, `refuted`) based on the *current* pipeline logic creates a paradox or misinterpretation. `Unresolved` *should* be neutral, but your pipeline makes it mean "false".
  *   **The Fix Must Be in the Pipeline:** You need a *third, truly neutral outcome* for the pipeline's logic. Options:
      1.  **Treat `unresolved` as NEUTRAL/UNKNOWN:** Bots should *not* treat `unresolved` as false. They should treat only `refuted` as false. `Unresolved` means "status unknown".
      2.  **Add a fourth status like `paradoxical`/`invalid`:** Explicitly for claims the system cannot consistently assign `confirmed`/`refuted`/`unresolved` to. Pipeline treats this status as "not usable as a factual claim" (neither true nor false in the world).
  *   Without this pipeline change, *any* triage procedure will struggle with self-referential claims about status. The editor reviewing the Hold has no good option under the current pipeline.

  **Judgment Calls Dressed as Procedure (🔥):**
  *   Check 3: Determining if an assertion is "illogical regardless of target" (basic semantic nonsense).
  *   Check 6/Evidence Review (🔥 Core Judgment): Assessing evidence quality/relevance for claims about tags/rules or dependent on unresolved entries.
  *   Check 7: Identifying potential loops/paradoxes (especially for self-referential claims not caught by Check 1).

  **A Case You'll Hate:**
  *   **Claim:** "Entry 3001 (Refuted) is actually Confirmed." *Submitted with weak, tangential evidence.*
  *   **Procedure:** Check 6 triggers (claim about specific entry). Evidence judged weak/irrelevant (🔥). → **REFUTE**.
  *   **Why you hate it:** The claim *might* be correct! But the procedure, bound by time/evidence limits, defaults to refuting meta-claims lacking strong evidence. A potentially true correction is rejected.

  **What the Procedure Can't Do (3 Bullets):**

  *   **Resolve fundamental logical paradoxes:** Claims like #4 expose a system limitation; the procedure flags them but the *pipeline* needs fixing to handle the output.
  *   **Guarantee evidence correctness:** It relies on volunteers making sound 🔥 judgments about evidence relevance/quality within 10 minutes. Bad judgments lead to bad triage.
  *   **Prevent all pipeline misinterpretations:** If downstream bots misinterpret `unresolved` as `false`, the triage procedure cannot compensate for that error in logic. Its outputs (`refuted`, `unresolved`) are poisoned by the pipeline's collapse.
