prompt: |-
  Last month I somehow ended up as one of the two "citizen members" on a charter commission in the city I live in (pop. ~90k), which is a fancy way of saying I have a full-time job that isn't law or philosophy and now I'm supposed to help write the rules for who gets to vote on things.

  The fight that got me appointed: council wants to put a measure on the spring ballot to fund a waste-to-energy plant sited right at the edge of town. The plant would serve a five-county waste district, so a lot of the benefit and a lot of the cost lands outside city limits — the township next door gets the truck traffic and probably the stack emissions, and they get no vote whatsoever. Meanwhile inside the city we're arguing about whether long-term residents without legal status should vote, whether 16- and 17-year-olds should, whether the people who commute in every day and work downtown but sleep out in the county should, and — the part that actually enrages me — second-home owners who live 400 miles away, own one rental property here, and have voted in every city election for twenty years.

  Every one of those arguments gets made by somebody pointing at a single case and saying "obviously." I'd rather know what I should be demanding of a principle before I start comparing them. So: write the desiderata — the full list of what any account of who belongs to the demos has to deliver in order to be usable by someone in my seat.

  For each requirement I want the case that motivates it (use mine where they fit, invent others where they don't) and a line on why it's a requirement rather than a preference. I especially want the ones people skip: that the rule has to produce a determinate electorate a clerk can actually build a roll from; that it has to survive the fact that the body setting the boundary is made of people who benefit from wherever it falls; that "affected" comes in degrees and over time horizons and the requirement should say what to do about that rather than pretend the problem isn't there; that it has to give an answer for bodies like ours that aren't states and sit inside other jurisdictions; and that it has to stay stable when people move, die, turn 18, or sell the house. And be explicit about which requirements are load-bearing — no adequate theory gets to fail them — and which are really the pet commitments of particular camps dressed up as requirements. I suspect several things I've been told are obviously mandatory are the second kind.

  Then the part I most want: tell me which subsets of these can't be jointly satisfied. I have a nagging sense that you can't have a rule that's both administrable and genuinely binding on the people it excludes, because somebody has to draw the line and whoever draws it is drawing it for themselves — and that this is the actual problem, not a detail to clean up later. If that's right, say which requirement has to be dropped or reinterpreted and why. If it isn't right, show me exactly where my reasoning breaks.

  Finally, briefly — 250 words, no more — sort the main contenders against the list: the ones that say anyone whose interests are affected, the ones that say anyone subject to the laws, the ones that say membership is about reciprocal obligation among people who share a life together, and the ones that say there's no single demos at all, just a different one per decision. Then tell me which single requirement knocks out the most of them.

  Format, please:

  - "The job this principle has to do" — one paragraph, ~120 words, saying what adequacy means for my situation specifically, not for a seminar's.
  - "The requirements" — numbered, the bulk of it, ~1200 words. Each entry: the requirement, the case, why it's a requirement.
  - "Load-bearing vs. camp furniture" — ~250 words.
  - "Where the list breaks" — ~350 words, the unsatisfiability stuff.
  - "Quick sort" — ~250 words on the contenders.
  - "What I'd tell the commission" — ~150 words: the two or three requirements you'd actually write into our charge.

  No bibliography, no list of who said what, no reading suggestions — I can't check any of it and its not what I need. Describe the positions by what they say. And dont pad: if a requirement is really just a restatement of another one, merge them and say so.
reasoning: |-
  Okay, the user is on a charter commission for a mid-sized city and needs help defining who gets to vote on local issues, especially regarding a waste-to-energy plant that affects people beyond city limits. They're frustrated with ad hoc arguments and want a principled approach. 

  First, I need to unpack their core request: they want desiderata—clear requirements for defining the demos—that are practical, not theoretical. They mentioned specific pain points: administrative feasibility, avoiding self-dealing by the council, handling degrees of "affectedness," jurisdictional nesting, and stability over time. 

  Hmm, the user is clearly intelligent and overwhelmed—a citizen suddenly thrust into policy-making. Their tone mixes exasperation ("fancy way of saying I have a full-time job") with sharp insight ("affected comes in degrees...pretend the problem isn’t there"). They’re suspicious of hidden agendas ("pet commitments dressed as requirements"). 

  The real challenge is balancing idealism with reality. For example: 
  - "Affected interests" sounds fair but crumbles administratively (how to measure "affected"?). 
  - "Subject to laws" is clean but excludes impacted non-residents (like the neighboring township). 
  - "Reciprocal obligation" feels ethical but is culturally subjective. 

  Their nagging suspicion about "administrable vs. binding" is spot-on. I’ll need to confirm that tension is unavoidable—the line-drawer always benefits, making legitimacy fragile. They’ll appreciate honesty here, not academic evasion. 

  For the "quick sort," I’ll contrast the four approaches neutrally but flag showstoppers: e.g., "per-decision demos" fails stability; "affected interests" fails determinacy. The knockout requirement? Probably administrative feasibility—real clerks can’t handle vague rules. 

  In the takeaway, I’ll emphasize pragmatism: prioritize determinacy and anti-self-dealing, accept "affectedness" as a compass not a map. They’d reject pie-in-the-sky solutions; their job is to draft a workable charter, not win philosophy debates.
answer: |-
  ### The job this principle has to do
  Your core task is crafting a rule defining the city's electorate *for practical governance*, not abstract justice. The rule must produce a **definitive voter roll** usable by city clerks with limited resources, apply **consistently** across diverse residents (long-term undocumented, teens, commuters, absentee landlords), withstand **political self-interest** by the council setting it, acknowledge **graded and temporal impacts** (like the waste plant affecting nearby towns differently over decades), function **within nested jurisdictions** (city inside county/state), and remain **stable** amidst routine life changes (births, deaths, moves, property sales). Adequacy means the rule doesn't collapse under real-world pressures of administration, politics, or human flux, while providing a defensible – if imperfect – link between voters and consequences.

  ### The Requirements
  1.  **Administrative Determinacy:** *Requirement:* The rule must generate a clear, objective list of eligible voters using data readily available to city/county clerks (e.g., property records, residency databases, tax rolls, DMV). *Case:* The absentee landlord voting issue. Clerk needs an unambiguous signal (e.g., "primary residence on tax roll," "registered voter at city address") to include/exclude without subjective judgment. *Why Requirement:* Without this, voter roll creation is impossible, elections stall, and legal challenges multiply. Preferences cannot override the need for a workable list.
  2.  **Boundary Stability:** *Requirement:* Eligibility must not fluctuate wildly with minor, frequent life events or ambiguous statuses. Changes should be tied to definitive, reportable events (e.g., establishing primary residency, selling property, turning 18). *Case:* Commuters/Teen voting. Does eligibility vanish if someone works from home one day? If a 17-year-old turns 18 the day after the election? *Why Requirement:* Constant flux creates administrative chaos, voter confusion, and undermines the legitimacy of any single election result. The electorate must remain reasonably fixed between major, verifiable status changes.
  3.  **Mitigation of Self-Dealing:** *Requirement:* The rule must incorporate mechanisms or principles that reduce the incentive for the body setting the rule (the council) to gerrymander the electorate for its own benefit. *Case:* Council proposing the plant benefits city voters but burdens non-voting township residents. The rule itself shouldn't obviously empower groups purely loyal to the rule-makers. *Why Requirement:* A rule blatantly serving its creators lacks legitimacy and invites external intervention (courts, state legislature). It's a structural necessity for perceived fairness.
  4.  **Acknowledgment of Graded Impact:** *Requirement:* The rule must explicitly recognize that impacts (costs/benefits) vary in intensity and duration, and specify how this variation is handled within the *binary* choice of voter/non-voter. It cannot assume impacts are uniform or always clear-cut. *Case:* The waste plant. Nearby township residents breathe emissions daily, distant county residents benefit from cheaper waste disposal, city residents get revenue but minimal direct impact. *Why Requirement:* Ignoring gradation makes the rule seem arbitrary where impacts blur. The rule must state *how* it translates gradation into inclusion/exclusion (e.g., prioritizes primary residency, requires property ownership, ignores gradation entirely). Pretending gradation doesn't exist is a failure.
  5.  **Jurisdictional Nesting Compatibility:** *Requirement:* The rule must function coherently despite the city being part of larger counties, state, and federal systems with overlapping (sometimes conflicting) electorates and authorities. It must define the city's *unique* electoral scope. *Case:* Commuters work (and are subject to city ordinances) downtown but vote elsewhere. Should they vote here? The rule must define the city's claim distinct from the county/state's claim on the same person. *Why Requirement:* Without this, the city's electoral authority is constantly undermined or conflicts with higher levels. The rule must establish a clear, defensible basis for the city's *particular* franchise.
  6.  **Core Legitimacy Link:** *Requirement:* The rule must articulate a defensible, non-circular connection between having a vote and bearing a significant consequence of the decision. *Case:* Long-term undocumented residents pay sales tax, use parks, send kids to schools funded by city measures, but face no direct legal sanction from city ordinances. Are they "subject to the law"? Are their "interests affected"? *Why Requirement:* The fundamental justification for *any* franchise rule. While interpretations differ ("subject to," "affected," "member"), the rule must provide *some* plausible rationale for why included voters have a meaningful stake that excluded individuals lack. This is the normative anchor.
  7.  **Practical Temporal Scope:** *Requirement:* The rule must define the relevant timeframe for assessing impact or status (especially related to Graded Impact #4). Is it immediate impact? Lifetime residency? Current tax year? *Case:* The waste plant's emissions might last 30 years. Should someone moving in next year get a vote *now*? Should someone moving out tomorrow? *Why Requirement:* Impacts unfold over time, and people move. The rule must fix a timeframe (e.g., status *at* registration deadline, expected residency duration) to avoid infinite regress on "who *will* be affected."
  8.  **Formal Equality:** *Requirement:* The rule must apply the same criteria to all individuals within its defined scope. *Case:* Preventing arbitrary exclusion/inclusion of specific individuals (e.g., "all property owners *except* that guy"). *Why Requirement:* A bedrock principle of non-arbitrary governance and equal protection. While the *scope* can be debated, application within that scope must be uniform.

  ### Load-bearing vs. camp furniture
  **Load-Bearing (Fail any, the rule collapses in practice):** Administrative Determinacy (#1), Boundary Stability (#2), Jurisdictional Nesting Compatibility (#5). Without #1/#2, clerks can't function. Without #5, the city's franchise lacks distinct authority. Mitigation of Self-Dealing (#3) is also near-load-bearing for legitimacy, though cleverly self-serving rules *can* technically exist.

  **Camp Furniture (Often presented as essential, but tied to specific normative camps):** *Strong Core Legitimacy Link (#6):* While necessary, specific interpretations ("only the governed," "all affected interests") are camps. *Acknowledgment of Graded Impact (#4) & Practical Temporal Scope (#7):* Essential to acknowledge, but *how* they're resolved (prioritizing residency, ownership, ignoring gradation) reflects camp preferences. *Formal Equality (#8):* Necessary, but often used as a shield against expanding the franchise ("it's equal among *this* group") rather than examining the group's definition.

  ### Where the list breaks
  The core tension is between **Administrative Determinacy (#1)** and a **strong, nuanced Core Legitimacy Link (#6)** incorporating **Graded Impact (#4)**. A perfectly administrable rule (e.g., "registered voters at a city street address") is determinate and stable but crudely excludes significantly affected non-residents (township neighbors) and includes minimally affected voters (distant landlords). Conversely, a rule capturing nuance ("all demonstrably significantly impacted") fails #1 – clerks cannot objectively measure "significance" or "impact" for thousands. **Mitigation of Self-Dealing (#3)** is inherently problematic: the body drawing the line *will* benefit, making perfect neutrality impossible. Legitimacy relies on procedural fairness and external constraints (courts, public scrutiny) accepting a *reasonably* justifiable rule, not a perfectly unbiased one. **Graded Impact (#4)** also inherently conflicts with the **binary nature of voting (in/out)**. The list demands we *confront* this, not solve it perfectly. You must *choose* how to bin the gradient (e.g., residency = significant enough, property ownership = stake) knowing it's imperfect. Stability (#2) also clashes with capturing evolving impacts (#7) – the rule fixes status at a point, but consequences change.

  ### Quick sort
  *   **All Affected Interests:** Fails #1 (Determinacy - "affected" is unmeasurable), #2 (Stability - impact changes), #4 (Doesn't resolve gradation, embodies it). Strong on #6 (Legitimacy Link) in theory, weak in practice. Killed by #1.
  *   **All Subject to Laws:** Strong on #1 (Determinacy - often tied to residency/registry), #2 (Stability), #5 (Nesting - defines city law's reach). Weak on #4 (Ignores gradation - non-residents impacted but not "subject"), #6 (Legitimacy - excludes impacted non-residents, includes residents with minimal stake like new arrivals). Survives administratively.
  *   **Reciprocal Obligation/Shared Life:** Vague on #1 (Determinacy - "shared life" is subjective), potentially weak on #2 & #5. Addresses #6 (Legitimacy) and #4 (Gradation - implies degrees of connection) philosophically, but fails #1 practically. Killed by #1.
  *   **Demos-per-Decision:** Utterly fails #1 (Determinacy), #2 (Stability), #8 (Formal Equality - electorate changes per vote). Addresses #4 (Gradation) and #6 (Legitimacy) ideally but is administratively impossible. Killed by #1 and #2.

  **Requirement knocking out most:** **#1 (Administrative Determinacy)**. Affected Interests, Reciprocal Obligation, and Demos-per-Decision all fail it fundamentally. Subject to Laws usually passes it.

  ### What I'd tell the commission
  1.  **Demand Administrative Determinacy:** Any rule must produce a clerk-ready voter roll using existing, objective data sources. If we can't build the list, the rule is dead. This is non-negotiable.
  2.  **Force Acknowledgment of Graded Impact & Self-Dealing:** Require explicit discussion: *How* does the rule handle varying impacts? *Who* benefits from this specific boundary? Documenting this tension is crucial for legitimacy, even if perfection is impossible.
  3.  **Prioritize Jurisdictional Nesting:** The rule must clearly define the city's *unique* claim to an individual's local vote, distinct from county/state. Residency is the strongest, clearest anchor here, despite its flaws on impact.

  Focus on building a rule that **works** (#1), **fits** within the government structure (#5), and **honestly confronts its own limitations** (#3, #4), rather than chasing an unattainably "perfect" demos.
