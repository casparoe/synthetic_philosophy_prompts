answer: |-
  Your description perfectly captures a pervasive methodological flaw in idealizing theories of reasons, often seen in internalist accounts but not exclusive to them. **The established diagnosis that fits best is "gerrymandering the idealization"** (sometimes called "parameter-stacking" or "reverse-engineering the ideal advisor"). However, since you seek precision and differentiation, let's define the core flaw, distinguish it from near neighbors, and coin a precise term if needed.

  **The Core Flaw: Verdict-Driven Idealization (Coined Term & Definition)**

  *   **Term:** **Verdict-Driven Idealization (VDI)**
  *   **Definition:** A methodological error occurring in idealized-agent analyses (e.g., "A has reason to φ iff A's fully informed/rational counterpart would desire/choose φ") where:
      1.  The initial specification of the idealization (full information, full rationality) yields a result (`Ideal-A is unmoved to φ`) that contradicts the theorist's pre-theoretical intuition (`A has reason to φ`).
      2.  Instead of revising the *analysis* or accepting the counterintuitive result, the theorist *elaborates* the specification of the idealization (e.g., adding "vivid acquaintance," "desire unification," "specific affective dispositions").
      3.  This elaboration is *selected primarily or solely* because it reverses the verdict to match the pre-theoretical intuition (`Ideal-A* (elaborated) is moved to φ`).
      4.  Crucially, the elaboration **lacks independent motivation** sufficient to justify its inclusion *prior to* or *independent of* its ability to produce the desired verdict in the problematic case(s). Its justification is essentially *retroactive*, anchored to the verdict it was designed to salvage.
  *   **Consequence:** The analysis becomes explanatorily vacuous. It reduces to "A has reason to φ iff the theorist judges that A has reason to φ," because the idealization is constructed precisely to mirror the theorist's existing judgments. It fails to provide a *criterion* for identifying reasons distinct from the theorist's intuitions.

  **Distinguishing Near Neighbors:**

  1.  **The Conditional Fallacy:**
      *   **Focus:** How idealization *destroys or distorts* the very response (e.g., motivation) it's meant to elicit. (e.g., If fully informed, A would know φ is impossible and thus wouldn't intend it, even though *actual* A has reason to intend φ if possible).
      *   **Difference:** VDI is *not* primarily about the idealization *destroying* the relevant state (though it might). It's about *tailoring* the idealization *specifically* to *produce* a pre-determined verdict, often *adding* features to *ensure* the desired response occurs. The conditional fallacy concerns inherent conflicts between idealization and response; VDI concerns ad hoc parameter adjustment to force alignment with intuition.

  2.  **Ad Hocness (General):**
      *   **Focus:** Any modification made solely to save a theory from a counterexample, without independent justification.
      *   **Difference:** VDI is a *specific type* of ad hoc maneuver applied *within the context of idealizing conditions* in normative theories (reasons, value). Its ad hocness is directed *precisely* at manipulating the idealized agent's response to match a fixed list of verdicts. General ad hocness might involve modifying other parts of the theory. VDI highlights the *structure* of the idealization becoming a mirror for the theorist's judgments.

  3.  **Begging the Question / Circularity:**
      *   **Focus:** Assuming the truth of the conclusion within the premises.
      *   **Difference:** VDI is often *operationally* circular: the idealization is defined by the outputs it needs to produce. However, it manifests as a *methodological* flaw in *elaborating* the theory, rather than a purely logical circularity in its *stated* premises. The circularity emerges in the *process* of refinement.

  4.  **Gerrymandering (Analogy):**
      *   **Focus:** Manipulating boundaries (e.g., electoral districts) to achieve a desired outcome.
      *   **Difference:** This is the closest analogy and often used informally ("gerrymandering the idealization"). VDI *is* the gerrymandering of the parameters defining the idealized agent to ensure it delivers the "correct" verdicts. It's an apt label, though less common in precise philosophical diagnosis than in critique.

  5.  **Dialectical Regress/Instability:**
      *   **Focus:** The need for constant, unprincipled revision in the face of new counterexamples.
      *   **Difference:** VDI is the *mechanism* driving such a regress when it occurs within idealization-based accounts. Each new counterintuitive result prompts another ad hoc elaboration of the idealization.

  **Separating Motivated vs. Unmotivated Refinements (Examples)**

  The key distinction for VDI is **whether the elaboration has a plausible, independent justification *beyond* its ability to fix the problematic case and align with the theorist's pre-set verdicts.**

  *   **Example of a Refinement *Not* Constituting VDI (Independently Motivated):**
      *   **Problem Case:** Actual A is indifferent to distant future suffering. Initial Ideal-A (full propositional knowledge) remains unmoved, but theorist thinks A has a reason to care.
      *   **Refinement:** Argue that "full information" must include *vivid, imaginative acquaintance* with the suffering, not just propositional knowledge.
      *   **Independent Motivation:** Rooted in a general theory of motivation or value apprehension. E.g., Humean theories argue desires/beliefs only motivate if the belief is "lively"; phenomenological accounts argue value perception requires affective engagement; empirical psychology suggests vividness impacts prosocial behavior. The refinement appeals to a *general principle* about how awareness connects to motivation or value recognition, justified by broader considerations *prior* to this specific case. It predicts *other* cases where vividness matters (e.g., why statistics often fail to motivate action compared to individual narratives). The problematic case *illustrates* the need for the refinement, but doesn't *solely justify* it.

  *   **Example of a Refinement Constituting VDI (Verdict-Driven):**
      *   **Problem Case:** Actual A has no interest in obscure mathematical beauty. Initial Ideal-A (full propositional knowledge + vivid acquaintance with the math) remains unmoved, but theorist insists A has a reason to appreciate it.
      *   **Refinement:** Argue that "full rationality" requires having *systematically unified desires* that would necessarily include an appreciation for fundamental abstract truths like mathematical beauty once fully comprehended.
      *   **Lack of Independent Motivation:** There's no robust, independently established theory of "systematic desire unification" that *entails* a desire for mathematical beauty *specifically*, distinct from other possible unifications (e.g., unification around practical efficacy, sensory pleasure, social harmony). The *only* justification offered for adding "systematic unification" *in this specific way* (that yields an appreciation for math) is that it resolves *this specific counterexample* and aligns with the theorist's pre-existing intuition that such a reason exists. The refinement is reverse-engineered from the desired verdict. It lacks predictive power for *other* novel cases beyond those the theorist already has intuitions about.

  **Conclusion:**

  Your diagnosis is astute. The flaw is **Verdict-Driven Idealization (VDI)**: the ad hoc elaboration of idealizing conditions (information, rationality, affective states) *specifically reverse-engineered* to force the idealized agent's output to match the theorist's pre-theoretical judgments about reasons, *lacking sufficient independent justification*. It renders the idealization explanatorily empty, collapsing into "A has reason to φ iff the theorist thinks A has reason to φ."

  While related to the conditional fallacy (focusing on distortion) and general ad hocness, VDI specifically captures the *structural* problem of tuning the idealizing parameters to a fixed set of verdicts. The critical test is whether the refinement can be motivated by principles or evidence *independent* of its ability to "fix" the target counterexample and align with the theorist's prior intuitions in that case. If not, it's VDI.
