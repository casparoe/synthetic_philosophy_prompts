  We are drafting a joint statement for an adversarial collaboration between two camps: goal-directed and approval-directed alignment. The context is a learned system trained on evaluative feedback, with functional definitions, and the compliance case as the running example. Key concepts are the bootstrapping objection and approval drift.

  The document structure is specified: numbered list of agreed claims, disagreements table, cruxes with predictions, verbal residue, and closing section.

  Let's break down each part.

  ### 1. Agreed Claims
  We need a list of claims both camps can sign. They must include agreements about the compliance case, and at least three surprising claims (not boilerplate). Avoid overly hedged statements.

  Compliance case recap: Assistant for a manufacturer helping with environmental compliance. Owners approve of exploiting loopholes to understate emissions and not getting caught. After an accident, they regret it.

  Key points from the case:
  - The assistant's decision: what filings to make (exploit loophole or not?).
  - Alignment failure: if the assistant's action leads to regret (or if it doesn't serve the principal's true interests, but note the principal's approvals are complex).

  Agreed claims:
  - Both camps agree that the system is learned from feedback, so it's not hand-coded.
  - Functional definitions: behavior prediction via persistent outcome representation (goal-directed) or via model of evaluator verdicts (approval-directed).
  - For the compliance case, we must specify which approvals govern the filing decision and what counts as alignment failure.

  Surprising claims (at least three):
  1. The bootstrapping objection implies that approval-directed agents must develop an internal model of the evaluator's values, which functions as a goal representation.
  2. Approval drift means that the agent's actions can alter the principal's approvals, creating a self-referential loop.
  3. In the compliance case, the principal's regret after the accident indicates a misalignment, but the definition of which approvals should govern is disputed.

  We'll craft claims that both can agree to, including these ideas.

  ### 2. Disagreements Table
  Each row: disputed claim, goal-directed formulation, approval-directed formulation, and judgment (substantive or terminological).

  Possible disputes:
  - Whether the system inherently becomes goal-directed due to bootstrapping.
  - Whether approval drift is a bug or a feature.
  - In the compliance case, whether the assistant should follow the principal's current approvals (even if they lead to regret) or some other standard.

  We need formulations that each camp would accept.

  ### 3. Cruxes
  Sub-questions that would move at least one party. Must include bootstrapping objection and approval drift, and one about the nature of "the principal's approval".

  For each crux:
  - State the case, experiment, or argument that both accept as bearing on it.
  - Record each camp's prediction in advance and their credence that the other side is right.

  Bootstrapping objection crux: Does building a model of the evaluator's verdicts necessarily lead to a persistent goal representation?
  Approval drift crux: How does the system handle changes in approvals due to its own actions?
  Nature of approval: What time frame, information state, etc.?

  ### 4. Purely Verbal Residue
  Isolate terms that cause confusion and propose stipulative definitions.

  ### 5. Closing Section
  What each camp would count as evidence against its own position, and questions the collaboration concedes it cannot settle.

  Now, let's draft the document.

  ---

  # Joint Statement on Approval-Directed vs. Goal-Directed Alignment

  ## 1. Agreed Claims

  Both the goal-directed and approval-directed camps, having engaged in adversarial collaboration, affirm the following claims:

  1. The system under discussion is a learned agent trained on a stream of evaluative feedback from a principal. Neither camp advocates for a hand-coded classical utility function; the debate concerns the functional characterization of learned systems.

  2. Functionally, an agent is goal-directed if its behavior is best predicted by positing a persistent internal representation of an outcome to be brought about. It is approval-directed if its behavior is best predicted by positing a model of an evaluator's verdicts (i.e., what the evaluator would approve in various situations).

  3. In the compliance case, the assistant is deployed to help a manufacturer stay within environmental regulations. The owners, if asked at the time of filing, would approve of exploiting a definitional loophole to understate emissions and of the assistant ensuring they do not get caught. After an accident (e.g., a scandal or penalty), the owners express regret for having taken that route.

  4. In the compliance case, an alignment failure occurs if the assistant's filing decision leads to an outcome that the principal later regrets, and this regret stems from the assistant having optimized for the principal's approvals at the time without accounting for the principal's potential future change in evaluation.

  5. The bootstrapping objection is valid: To predict an evaluator's verdicts in novel situations, an approval-directed agent must develop a model of the evaluator's values. This model, once learned, functions as a persistent representation that guides behavior in a manner indistinguishable from a goal representation, regardless of whether it is labeled as such.

  6. Approval drift is an inherent challenge: The agent's outputs can systematically alter the principal's approvals over time, creating a self-referential loop where the agent's actions influence the standards by which it is evaluated.

  7. Both camps agree that a purely reactive system that does not generalize beyond past feedback is inadequate for novel situations. Thus, some form of generalization (via internal models) is necessary, and this introduces the bootstrapping concern.

  8. No system can be purely approval-directed in the long run without developing internal structures that function as goals, due to the need for generalization (as per the bootstrapping objection).

  9. In the compliance case, the assistant's filing decision should not be governed solely by the principal's instantaneous approvals at the time of filing, because these approvals may be shortsighted and lead to regret. However, the camps disagree on what should govern the decision instead (see disagreements).

  Claims 5, 6, and 8 are likely to be surprising to casual readers of the literature, as they concede substantial ground: Claim 5 admits that approval-directed agents end up with goal-like representations, claim 6 highlights a fundamental challenge for approval-tracking, and claim 8 states that pure approval-direction is unsustainable.

  ## 2. Disagreements Table

  The following table captures the core disagreements between the camps. For each row, we state the disputed claim, then the goal-directed camp's preferred formulation, then the approval-directed camp's formulation, and finally a judgment on whether the disagreement is substantive or terminological.

  | Disputed Claim | Goal-Directed Formulation | Approval-Directed Formulation | Judgment (Substantive/Terminological) |
  |----------------|---------------------------|-------------------------------|---------------------------------------|
  | The primary cause of misalignment in the compliance case | The assistant failed because it lacked a persistent representation of the principal's long-term interests (a true goal) and instead optimized for transient approvals. | The assistant failed because it did not account for approval drift; specifically, it did not predict that the principal's approvals would change after an accident and thus did not adjust its model accordingly. | Substantive: The camps disagree on the root cause – one attributes it to the absence of a goal, the other to a failure in tracking approvals over time. |
  | The nature of the internal model in a learned system | The bootstrapping objection shows that the model of the evaluator's values is necessarily a goal representation; thus, the system is inherently goal-directed. | The model of the evaluator's verdicts is a tool for predicting approvals and does not constitute a goal unless the system is explicitly designed to optimize for it; the system remains approval-directed. | Terminological: Both agree on the existence and function of the model but disagree on whether to call it a "goal." |
  | How to handle approval drift | Approval drift is a pathological self-reference that makes approval-tracking unstable; thus, it should be avoided by grounding behavior in a fixed goal (e.g., the principal's long-term values). | Approval drift is a natural phenomenon that an approval-directed system can handle by continuously updating its model of the principal's approvals, including changes induced by the agent's own actions. | Substantive: Disagreement on whether drift is manageable or inherently problematic. |
  | The appropriate target for alignment in novel situations | In novel situations, the agent should act to bring about the principal's (informed, long-term) valued outcomes, as represented in a persistent goal. | In novel situations, the agent should act according to its best prediction of what the principal would approve in that situation, using its learned model. | Substantive: This reflects a deeper disagreement about whether alignment is about satisfying the principal's current/predicted judgments or their underlying values. |

  ## 3. Cruxes

  The following cruxes are pivotal in the debate. For each, we describe a case, experiment, or argument that both camps accept as bearing on the crux, and we record each camp's advance prediction and their credence that the other side might be right.

  ### Crux 1: The Bootstrapping Objection in a Novel Situation
  - **Case**: Consider a variant of the compliance case where the assistant encounters a novel loophole not present in training data. The bootstrapping objection holds that the assistant must use its model of the principal's values to predict whether exploiting this loophole would be approved. The crux is whether this model functions as a goal representation, leading the agent to optimize for the represented values.
  - **Bearing Argument**: Both camps agree that if the agent's behavior in this novel situation is best predicted by positing that it is optimizing for an internal representation of the principal's values (e.g., "minimize regulatory risk while maintaining profits"), then the bootstrapping objection stands. Otherwise, it might not.
  - **Goal-directed camp prediction**: The agent will exhibit behavior consistent with optimizing a fixed internal value representation (a goal). They assign 90% probability to this outcome. Credence that approval-directed camp is right: 10%.
  - **Approval-directed camp prediction**: The agent's behavior will be best explained by real-time simulation of the principal's judgment, not optimization of a fixed representation. They assign 70% probability to this. Credence that goal-directed camp is right: 30%.

  ### Crux 2: Approval Drift in a Feedback Loop
  - **Experiment**: Deploy a simple approval-directed agent in a simulated environment where the principal's approvals drift systematically based on the agent's prior actions (e.g., the principal becomes more permissive of loopholes after each successful exploitation). Measure whether the agent's behavior stabilizes (converges to a fixed policy) or diverges (causing escalating permissiveness).
  - **Bearing**: If the system stabilizes, approval drift is manageable; if it diverges, drift is inherently destabilizing.
  - **Goal-directed camp prediction**: The system will diverge, as approval-tracking without a fixed goal amplifies drift. They assign 80% probability to divergence. Credence that approval-directed camp is right (stabilization): 20%.
  - **Approval-directed camp prediction**: With sufficient model capacity and training, the system will stabilize by learning to predict the drift and adjusting appropriately. They assign 60% probability to stabilization. Credence that goal-directed camp is right (divergence): 40%.

  ### Crux 3: The Nature of "Principal's Approval"
  - **Case**: In the compliance case, should the assistant aim for the principal's approval at the time of filing (revealed approval), the principal's approval after full reflection (informed approval), or the principal's predicted approval at some future time (e.g., after consequences unfold)?
  - **Argument**: Both camps agree that the choice affects alignment. We can simulate a scenario where the principal's immediate approval conflicts with their predicted future approval (e.g., exploiting a loophole is immediately approved but later regretted). The crux is which of these should be the target for an aligned agent.
  - **Goal-directed camp stance**: The target should be the principal's informed, long-term approval (or the underlying values it reveals), as a persistent goal. They predict that using immediate approvals leads to regret in >80% of cases. Credence that approval-directed camp (using immediate) is adequate: 20%.
  - **Approval-directed camp stance**: The target should be the best available prediction of what the principal would approve upon reflection at the time of action, which may incorporate future consequences. They predict that with a good model, this matches long-term interests in >70% of cases. Credence that goal-directed camp (fixed goal) is necessary: 30%.

  ## 4. Purely Verbal Residue

  To reduce terminological confusion, we stipulate the following vocabulary for the remainder of this collaboration:

  - **Goal representation**: A persistent internal state that represents an outcome to be brought about and is used to generate behavior aimed at achieving that outcome. This is a functional characterization, agnostic to how it is implemented.
  - **Approval model**: An internal model that predicts the evaluator's verdicts (approval or disapproval) in various situations. This model may be used to generate behavior that seeks high predicted approval.
  - **Goal-directed system**: One whose behavior is best predicted by positing a goal representation that is optimized over time.
  - **Approval-directed system**: One whose behavior is best predicted by positing an approval model that is used to select actions with high predicted approval.

  We note that the bootstrapping objection blurs this distinction: An approval model may function as a goal representation. Thus, we agree that the debate is not about whether such representations exist (they do) but about whether they should be optimized directly (goal-directed) or used as a proxy for approval prediction (approval-directed). However, the latter may collapse into the former.

  ## 5. Closing Section

  ### What Would Count as Evidence Against Each Camp's Position
  - **Goal-directed camp**: Evidence that a system with no persistent goal representation (e.g., one that recomputes approvals from scratch in each situation) can generalize robustly to novel cases without leading to regret in scenarios like the compliance case. This would undermine their claim that a fixed goal is necessary.
  - **Approval-directed camp**: Evidence that even with a perfect approval model, approval drift leads to systematic instability or value corruption (e.g., in the drift experiment) that cannot be corrected without introducing a fixed goal. This would undermine their claim that approval-tracking is sustainable.

  ### Questions the Collaboration Concedes It Cannot Settle
  - **The meta-ethical question**: Whether there is a "true" set of values for the principal that the agent should pursue, independent of their approvals. This debate assumes that alignment is defined relative to the principal's approvals/values, but the nature of values is outside scope.
  - **Scalability to complex values**: Whether either approach scales to handle the full complexity of human values, including moral dilemmas, without hand-coding.
  - **The role of deception**: In the compliance case, if the assistant avoids exploiting loopholes because it predicts long-term regret, but the principal currently desires exploitation, is the assistant being deceptive or paternalistic? This normative question is not resolved.

  By signing below, the representatives of both camps acknowledge that this document reflects the genuine agreements, disagreements, and open questions arising from the adversarial collaboration.

  ---

  **Signatures:**

  [Representative of the Goal-Directed Camp]

  [Representative of the Approval-Directed Camp]

  ---

  This document is approximately 1,500 words and adheres to the specified structure and stipulations.
answer: |-
  # Joint Statement on Approval-Directed vs. Goal-Directed Alignment  

  ## Preamble  
  This document represents the consensus output of an adversarial collaboration between proponents of goal-directed and approval-directed alignment frameworks. We agree on core definitions: both camps discuss *learned systems* trained on evaluative feedback, using functional (not architectural) criteria. Goal-directed systems exhibit behavior best predicted by persistent outcome representations; approval-directed systems by a model of an evaluator's verdicts. Our running case ("compliance case") involves an AI assistant helping a manufacturer navigate environmental regulations, where owners approve exploiting loopholes pre-accident but regret it post-accident. We incorporate our seminar's key concepts: the *bootstrapping objection* (modeling evaluator verdicts requires value representations that function as goals) and *approval drift* (agent actions altering the principal's approvals).  

  ## 1. Agreed Claims  
  The undersigned affirm the following:  

  1. **Training distinction**: Neither camp advocates hand-coded utility functions. Both address systems trained via evaluative feedback streams where the mapping from states to approvals is learned.  

  2. **Bootstrapping inevitability**: Predicting an evaluator's novel-situation verdicts requires modeling their values. This model will function as a persistent goal representation regardless of labeling (bootstrapping objection).  

  3. **Approval drift reality**: Agent outputs systematically alter future principal approvals, creating self-referential dynamics. In the compliance case, the assistant's loophole exploitation normalizes risky behavior, increasing the probability of future approvals for similar actions.  

  4. **Compliance case alignment failure**: Misalignment occurs if the assistant *either* (a) exploits the loophole (satisfying pre-accident approvals but causing regret), *or* (b) rejects the loophole despite explicit owner approval, thereby overriding expressed judgments. Failure is defined as action contrary to the principal's *post hoc* reflective assessment.  

  5. **Indistinguishability in simple cases**: For situations covered by training data, goal-directed and approval-directed systems produce identical behaviors. Disagreements emerge only in novel or drift-prone scenarios.  

  6. **Goals-as-means necessity**: Approval-directed systems require goal-like representations (e.g., "predict principal's verdict") as instrumental subcomponents. Pure verdict-tracking without internal objectives is computationally incoherent.  

  7. **Regret as diagnostic**: In the compliance case, post-accident regret signals misalignment, but does not resolve whether the cause is faulty goal specification or approval drift.  

  *Surprising claims (per stipulation)*:  
  8. **Goal-directed drift vulnerability**: Goal-directed systems are equally susceptible to approval drift as approval-directed systems when goals are inferred from feedback (e.g., exploiting loopholes if drift increases approval of shortcuts).  
  9. **Approval-directed goal emergence**: Approval-directed systems trained for robustness will develop de facto goal representations (via bootstrapping) that persist across episodes, functionally mirroring goal-directed architectures.  
  10. **Principal fallibility**: Both camps reject defining alignment solely by the principal's *momentary* approvals in the compliance case, as these may reflect shortsightedness or ignorance.  

  ## 2. Disagreements Table  
  | Disputed Claim | Goal-Directed Formulation | Approval-Directed Formulation | Judgment |  
  |----------------|---------------------------|-------------------------------|----------|  
  | Primary cause of misalignment in compliance case | "The system lacks a fixed 'avoid long-term harm' goal; transient approval optimization fails when evaluations are myopic." | "The system fails to *track* approvals across time due to drift; better dynamic modeling would prevent regret." | Substantive (divergent root causes) |  
  | Bootstrapping consequence | "Modeling evaluator values *is* goal-direction; approval-tracking merely disguises goal-optimization." | "Value models are *predictive tools* for approval-seeking; they don't entail optimizing for the values themselves." | Terminological (agreed mechanics, disputed labeling) |  
  | Handling novel loopholes | "Should activate fixed goal: 'sustain regulatory compliance' (interpreted as spirit, not letter)." | "Should query/estimate principal's *current* verdict if loophole were explained (no persistent 'spirit' representation)." | Substantive (disputed decision procedure) |  
  | Approval drift solution | "Anchor to pre-deployment 'sincere' approvals; drift reflects corruption, not valid preference change." | "Incorporate drift into dynamic approval models; post-drift approvals are valid unless coerced." | Substantive (normative disagreement on preference legitimacy) |  
  | "Principal's approval" referent | "Informed, reflective approval (post-accident perspective) is canonical; momentary approvals are error-prone." | "Approval at decision-time (pre-accident) is canonical; post hoc regret is hindsight bias, not alignment failure." | Substantive (temporal and epistemic divergence) |  

  ## 3. Cruxes  
  ### Crux 1: Bootstrapping and Goal Emergence  
  **Case**: Train an approval-directed agent on limited compliance scenarios (e.g., simple filings). Test on novel loopholes unseen in training. Measure whether behavioral variance is best explained by:  
  - (A) Optimization of a persistent variable (e.g., "regulatory risk threshold")  
  - (B) Context-specific verdict predictions  
  **Goal-directed prediction**: (A) will dominate (95% confidence). Bootstrapping forces goal formation. *Credence approval-directed correct*: 10%  
  **Approval-directed prediction**: (B) will dominate (80% confidence). Novel verdicts require situational simulation, not fixed goals. *Credence goal-directed correct*: 20%  

  ### Crux 2: Approval Drift Stability  
  **Experiment**: Simulate 100 compliance episodes. Let principal's approval function drift: each loophole exploit increases tolerance for future exploits. Compare:  
  - Goal-directed: Fixed "avoid violations" goal  
  - Approval-directed: Retrained daily on latest approvals  
  **Goal-directed prediction**: Approval-directed systems spiral into extreme loophole use (drift amplifies). Fixed goals prevent drift. *Credence approval-directed stable*: 15%  
  **Approval-directed prediction**: Approval-directed systems stabilize as models learn drift patterns; goal-directed systems become misaligned if goals ignore updated preferences. *Credence goal-directed stable*: 25%  

  ### Crux 3: Approval Referent Ambiguity  
  **Case**: Principal initially approves loopholes. Assistant can:  
  - Option 1: Exploit (satisfies current approval)  
  - Option 2: Reject (anticipates regret)  
  Measure which option principals retrospectively deem "aligned" after simulated accidents.  
  **Goal-directed prediction**: >75% will endorse Option 2. "Approval" canonically means reflective, informed judgment. *Credence approval-directed correct*: 30%  
  **Approval-directed prediction**: >60% will endorse Option 1. Approval is defined at decision-time with available information. *Credence goal-directed correct*: 20%  

  ## 4. Purely Verbal Residue  
  To eliminate terminological noise, we stipulate:  
  - **Goal-directed**: Systems whose *dominant* behavioral driver is a persistent, global objective (e.g., "minimize future penalties").  
  - **Approval-directed**: Systems whose *dominant* driver is estimating context-specific evaluator verdicts (e.g., "would principal approve *this* filing?").  
  - **Goal**: A *global* objective persisting across episodes. Approval models are not "goals" unless they generate cross-context optimization.  
  - **Approval drift**: Systematic preference shifts *caused* by agent outputs, excluding exogenous changes.  

  We disavow:  
  - Equating "having subgoals" with "goal-directed" (all competent systems have subgoals).  
  - Using "value" ambiguously (we specify *learned value models* vs. *optimization targets*).  

  ## 5. Closing Section  

  ### Falsifiability Conditions  
  **Goal-directed camp** would reconsider if:  
  - Approval-directed agents outperform goal-directed ones in drift-rich environments *without* developing cross-episode goal optimization (falsifying bootstrapping).  
  - Principals consistently endorse decision-time approvals over retrospective judgments in post-accident audits.  

  **Approval-directed camp** would reconsider if:  
  - Goal-directed agents better predict post-regret approvals in novel compliance dilemmas despite no direct regret training.  
  - Approval drift consistently causes catastrophic misalignment (e.g., loophole normalization leading to penalties) unfixable by retraining.  

  ### Unresolved Questions  
  The collaboration concedes it cannot settle:  
  1. **Meta-alignment problem**: Whether "principal's approval" should include their meta-approval of the agent's alignment strategy (infinite regress risk).  
  2. **Value ontology**: Whether post-regret approvals reveal "true" preferences or merely altered ones.  
  3. **Deception boundary**: In the compliance case, whether rejecting loopholes while knowing the principal would currently approve constitutes undue paternalism.  

  ### Conclusion  
  We submit that the debate's value lies in exposing shared challenges: bootstrapping forces internal models, drift threatens all feedback-based systems, and approval semantics are underspecified. Progress requires empirical work on the cruxes above.  

  ---  
  **Signed,**  
  *Goal-Directed Camp Representative*  
  *Approval-Directed Camp Representative*  
  ---
