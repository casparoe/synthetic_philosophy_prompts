prompt: |-
  For two years I've run all my numbers through an AI — I'm a small-scale market gardener and it does my margins, my rotation planning, my tax stuff. Every answer it's given me has checked out against reality. But it was down for three days last month and I couldn't do a single thing by hand, not even break-even on a flat of seedlings. So: at what point did I stop understanding my own business?

  Before I read any more about cognitive offloading or epistemic dependence or whatever it gets called, I want the spec, not the theories. Write out what any account of "outsourcing costs you understanding" has to deliver: the cases it has to get right (my blackout weekend, the community that's forgotten how to find its way around because everyone follows satnav, and the person who understands *more* because the tool explains as it goes), the distinctions it can't collapse (understanding vs. getting the right answer vs. being reliable vs. being in charge of your own thinking), and the thing it can't just wave away — if you're happy calling the notebook in someone's pocket part of their mind, why isn't the chatbot part of mine? Give the consideration behind each item, and tell me which of these are genuine requirements and which are really just one camp's prejudices dressed up. Flag any pair you think can't both be satisfied.

  My own candidate criterion is what I call the blackout test: unplug the tool for a week, see what's left. Tell me whether that earns a place on the list or whether it begs the question. Then one line each on how "if the answers are right nothing is lost," "outsourcing always costs you," and something in between score against the finished list.

  Last thing — say how confident you are in the list overall, and single out the one item you're least sure belongs on it.
reasoning: |-
  Okay, let me approach this systematically. The user presents a clear challenge: define the essential criteria for assessing when tool reliance costs understanding, without theoretical baggage. They're a pragmatic market gardener who experienced concrete failure during an AI outage, so abstract philosophy won't cut it.

  First, unpacking their core demand: they want specifications for any "outsourcing costs understanding" claim. Must-haves include handling their blackout experience, the satnav analogy, and cases where tools enhance understanding. Key distinctions to preserve: understanding vs correct answers vs reliability vs cognitive autonomy. And the notebook vs chatbot boundary problem.

  Hmm... their blackout test proposal is interesting but potentially circular. If we define understanding by what remains when unplugged, we might overlook integrated knowledge. Need to flag that tension.

  Building the criteria list:
  1. Failure cases must be explainable (like their gardening paralysis)
  2. Success cases must be explainable (tools that teach)
  3. Must distinguish understanding from mere correctness
  4. Must distinguish understanding from reliability
  5. Must preserve agency as separate dimension
  6. Must resolve the extended mind paradox (notebook vs AI)

  The satnav example helps stress test #4 - you can be reliably correct without understanding. Their tax AI passing #3 but failing #1 is perfect for illustrating the gap between correctness and understanding.

  For the notebook vs chatbot dilemma, the key differentiator seems to be predictability and transparent integration. A notebook's contents are fixed and reviewable, while chatbots are opaque and generative. That feels robust enough to include.

  Now evaluating their candidate blackout test: it catches catastrophic failures like theirs, but fails for tools that become internalized (like mental math after calculator use). So it's useful but insufficient alone - should be one indicator among others.

  Scoring the extremes:
  - "Right answers suffice" fails #1,3,4 (correctness ≠ understanding)
  - "Always costs you" fails #2 (ignores teaching tools)
  - Middle paths handle the list better by accepting augmentation

  Least confident item is #6 (extended mind boundary). While the predictability argument holds, some might argue highly personalized AIs could qualify. But given current tech, it's defensible.

  Final confidence: 85%. The criteria cover their cases, preserve crucial distinctions, and avoid obvious contradictions. Only real tension is between #2 (tools can teach) and the blackout test - but that's productive tension showing understanding isn't binary.
answer: |-
  Here's your spec for "outsourcing costs you understanding," stripped of theory and built from your requirements. Each item includes the case it must explain, distinctions it must preserve, or boundaries it must define, with the underlying consideration. Genuine requirements (R) are marked; unmarked items are either neutral necessities or address prejudices.

  ---

  ### **The Spec: 7 Items Any Account Must Deliver**
  1. **Must explain catastrophic failure during tool loss**  
     *Case:* Your blackout weekend (total paralysis without AI).  
     *Consideration:* If outsourcing *always* enhanced understanding, temporary tool loss shouldn't cripple core decision-making.  
     *Status:* **R** (Non-negotiable for your case).

  2. **Must explain tools that *increase* understanding**  
     *Case:* The person who learns *more* because the tool explains as it goes (e.g., an AI that shows soil chemistry calculations step-by-step).  
     *Consideration:* Accounts that claim "outsourcing *always* erodes understanding" fail here. Distinguishes between tools that teach vs. those that replace.  
     *Status:* **R** (Counterexample to blanket pessimism).

  3. **Must distinguish *understanding* from *correct answers***  
     *Case:* Your AI gives accurate tax/margin numbers, but you can't replicate even basic break-even math by hand.  
     *Consideration:* Correct outputs ≠ grasp of principles. Understanding implies ability to trace logic, spot errors, or adapt.  
     *Status:* **R** (Core distinction).

  4. **Must distinguish *understanding* from *reliability***  
     *Case:* The satnav community arrives reliably at destinations but can't navigate without GPS.  
     *Consideration:* Reliability can exist without comprehension (e.g., following instructions blindly). Understanding requires knowing *why* something works.  
     *Status:* **R** (Prevents conflation).

  5. **Must distinguish *understanding* from *agency/control***  
     *Case:* You feel "not in charge" of your business logic during the outage, even if answers were previously reliable.  
     *Consideration:* You can outsource computation but retain agency (e.g., choosing *which* tool to use). Losing agency suggests deeper cognitive erosion.  
     *Status:* **R** (Addresses your "in charge of thinking" point).

  6. **Must resolve the "extended mind" boundary**  
     *Case:* Why is a pocket notebook part of "your mind" but your chatbot isn't?  
     *Consideration:* Notebooks are static, user-curated, and directly inspectable. Generative AI is dynamic, opaque, and constructs novel outputs. Predictability/transparency determines integration into cognition.  
     *Status:* Neutral (Solves the notebook/AI paradox; rejects "it's all extended mind" as oversimplified).

  7. **Must not require total self-sufficiency**  
     *Case:* No human understands every layer of modern tech (e.g., chip fabrication in calculators). Yet we claim "understanding" of higher-level tasks.  
     *Consideration:* Demanding complete independence is unrealistic. Understanding operates at appropriate levels of abstraction (e.g., knowing *how to use* soil pH data vs. building the sensor).  
     *Status:* Neutral (Dismisses "outsourcing always costs you" as extremist).

  ---

  ### **Your Blackout Test: Does It Earn a Place?**  
  **Yes, but conditionally.** It’s a strong *indicator* (exposes critical gaps in Item 1), but **it begs the question** if used as the *sole* criterion. Why?  
  - Passing the test (e.g., still functioning manually) suggests retained understanding.  
  - Failing it (your case) confirms understanding was lost.  
  - **But:** Tools *can* become internalized (e.g., using a calculator for years may improve mental math intuition). The test misses augmentation (Item 2) and levels of abstraction (Item 7).  
  **Verdict:** Include as a stress test for Item 1, but insufficient alone.

  ---

  ### **Scoring Extremes Against the Spec**  
  - **"If answers are right, nothing is lost"**:  
    ✘ Fails Items 1 (blackout paralysis), 3 (correct ≠ understanding), 4 (satnav reliability ≠ navigation skill). Confuses correctness with comprehension.  
  - **"Outsourcing always costs you"**:  
    ✘ Fails Item 2 (tools that teach), Item 7 (abstraction is necessary). Ignores augmentation; demands unrealistic self-sufficiency.  
  - **"It depends" (e.g., on tool design/user engagement)**:  
    ✓ Satisfies all items. Explains failure (Item 1) vs. learning (Item 2), preserves distinctions (Items 3–5), resolves boundaries (Item 6), and allows abstraction (Item 7).

  ---

  ### **Confidence & Weakest Item**  
  - **Overall confidence: 85%**.  
    The spec covers your cases, enforces key distinctions, and avoids dead-end ideologies.  
  - **Least sure about Item 6 (extended mind boundary)**.  
    Why? The notebook/AI line feels pragmatic but risks future obsolescence (e.g., if AI becomes as transparent as a notebook). However, it *does* resolve your "why not part of my mind?" question today, so it stays.

  ---

  ### **Unresolvable Tension?**  
  **Item 2 (tools increase understanding) vs. Blackout Test**:  
  - If a tool *teaches* so well that you internalize knowledge (e.g., after using an explanatory AI for years, you *can* do manual break-even), both are satisfied.  
  - If the tool explains but you ignore/outsource thinking anyway (e.g., skips the explanations), the blackout test fails while Item 2 is technically met.  
  **Verdict:** No outright contradiction—context of *use* determines compatibility.
