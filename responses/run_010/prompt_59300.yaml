prompt: |-
  I write a fortnightly column on science and ideas, and last month I spent two weeks reporting on how national health-technology agencies rank treatments by quality-adjusted life-years — the machinery by which a bureaucracy decides that extending one patient's life by two good years is worth more than extending another's by one. The philosophers I interviewed mostly defended the practice, but one conceded that the sharpest objection to it is the old claim that aggregating across lives treats society as though it were a single subject having a single experience, and he quoted Nozick's formulation of the point: to use a person for another's benefit fails to respect the fact that "he is a separate person, that his is the only life he has. He does not get some overbalancing good from his sacrifice." I built the column around that concession. Then a postdoc at the same institute, who read a draft, sent me the following argument, which he says does not merely rebut the objection but shows that anyone who presses it is committed to something far stranger than QALYs. My editor is running the piece in six weeks and I would rather not publish a column whose central premise has been demonstrated incoherent.

  Here is his argument, cleaned up into steps. (1) The separateness objection amounts to a compensation principle: an act that imposes a cost on one person for the sake of a greater benefit to another is impermissible, because the person who pays the cost is left with nothing. (2) Whatever force that principle has comes from a claim about the units within which costs and benefits can be matched up: between two persons there is no one who both bears the cost and enjoys the benefit, whereas within a single life there is. (3) But the second half of (2) does not survive scrutiny. What exists at any given time is a person-stage; a life is a series of such stages bound together by memory, intention, character, and shared concern, and those bonds come in degrees rather than all-or-nothing. (4) In a great many ordinary lives, the psychological bonds between my present stage and my stage at seventy-five are weaker than the bonds between two people who have shared a household, a history, and a set of projects for forty years. (5) If the question posed by (2) is who bears the cost and who receives the benefit, then in those cases the later beneficiary is no more identical with the bearer than a long-married spouse is, and compensation fails just as completely as it does between strangers. (6) So the objection, applied consistently, condemns ordinary prudence: saving, studying, training, submitting to surgery, even enduring a wretched half-hour in a dental chair to avoid a worse year later, all impose a real cost on a present subject for the sake of a later subject who is, by the objection's own criterion, someone else. (7) Prudence is not impermissible; if anything in ethics is secure, it is that one may accept a smaller present cost to avoid a larger later one. (8) Therefore the objection is false — and since the only difference it located between intrapersonal and interpersonal trade-offs was that compensation is possible in the one case and not in the other, and that difference has evaporated, there is no principled barrier left against aggregation across lives either.

  Tell me which step to reject, and then explain why it looked unobjectionable in the first place, since the postdoc's version reads as though each line follows from the last. I want the diagnosis priced out rather than merely asserted: for each of the three positions I can see occupying the room — someone who thinks the persisting person is the right unit of compensation whatever becomes of identity, a Parfit-style reductionist who is happy to say identity is not what matters, and a consequentialist who welcomes the collapse described in (8) — say what each has to give up to reject the step you name, and what each has to give up to accept it. For the record I would rather keep (7) than (1), since a column telling readers that their retirement contributions are structurally akin to theft is not a column I can defend, but I want to know exactly what keeping (7) commits me to. And once you have settled that, tell me whether the argument, if it succeeds, really delivers what he says it delivers about policy: is there work left for the separateness objection to do in the QALY case even after I have conceded every step he asks me to concede?
reasoning: |-
  Okay, let me tackle this step by step. The user is a science columnist who built an article around a philosophical objection to QALYs (quality-adjusted life years), specifically the "separateness of persons" argument from Nozick. A postdoc then presented an argument claiming this objection leads to absurd conclusions about ordinary prudence, forcing the columnist to either accept aggregation across lives or reject common-sense ethics. The columnist needs to know where the argument fails and what it means for their piece.

  First, I need to parse the postdoc's argument. It claims that if psychological connectedness (not identity) is what matters for compensation, then many intrapersonal sacrifices (like saving for retirement) become morally equivalent to interpersonal sacrifices (like QALY trade-offs), since future person-stages are as disconnected as spouses. The key move is in step (4) comparing bonds between one's own elderly self to a long-married spouse.

  Hmm, the flaw seems to be in step (4)'s analogy. The psychological bonds between my current self and my future self—even if weakened—still exist within a single biological life with continuous physical identity. A spouse shares memories but inhabits a separate body with separate interests. The postdoc conflates psychological connectedness with moral agency boundaries. 

  For the three positions: 
  - The persisting-person advocate would reject step (4) entirely—bonds within a life aren't comparable to bonds between lives because agency matters more than psychology. 
  - Parfitian reductionists might accept (4) but dispute (5)—they'd say weaker connectedness reduces prudential concern but doesn't erase the moral difference between intra vs. interpersonal trade-offs. 
  - Consequentialists would embrace (8) but should note that policy decisions involve additional constraints (like autonomy) beyond pure aggregation.

  Crucially, even if all steps are accepted, the separateness objection still has teeth in QALY cases: unlike personal prudence, societal health allocations impose costs involuntarily across distinct agents with competing rights. The postdoc's "gotcha" overlooks consent and distributive justice.

  The columnist can keep both prudence (7) and the QALY objection by rejecting the false equivalence in step (4). Their article's premise stands—they just need to clarify that biological continuity, not psychology, creates the moral asymmetry for compensation.
answer: |-
  Here's the step-by-step diagnosis, identifying the critical flaw and its implications for your column:

  **Step to reject: (4)**  
  *Why it initially seems unobjectionable:* It leverages Parfit-style reductionism (from step 3) to suggest psychological bonds are *all that matters* for compensation claims. If personal identity reduces to psychological connectedness, and that connectedness can be weaker within a life than between lives, the analogy to spouses seems plausible—even elegant. It appears to be a natural extension of (3).

  **Why (4) fails:**  
  It conflates **psychological connectedness** with **metaphysical separateness of agents**. While bonds may weaken over time within a life, the later person-stage remains part of a **single, continuous biological entity** with unified agency. A spouse is a distinct entity with separate interests, rights, and biological boundaries. Sacrifices *within* a life serve the *same entity's interests over time*; sacrifices *across* lives serve *different entities*. The "cost" in prudence is endured by an agent who will *itself* experience the benefit as the same enduring entity, regardless of psychological change. This continuity of agency (not identity) is what enables compensation.

  ---

  ### What Each Position Must Give Up
  **(A) Persisting-Person Advocate**  
  - **To reject (4):** Nothing. They already hold that biological persistence (or agent-continuity) is fundamental.  
  - **To accept (4):** They must abandon the view that physical/agent continuity grounds compensation, reducing ethics to psychology alone.  

  **(B) Parfit-Style Reductionist**  
  - **To reject (4):** They must deny that psychological bonds are *sufficient* for compensation claims. Compensation requires shared agency, not just connectedness.  
  - **To accept (4):** They must concede that prudence is morally suspect unless bonds are strong—but this contradicts (7), which they likely accept.  

  **(C) Consequentialist**  
  - **To reject (4):** They must admit that agency boundaries (not just net benefits) matter for permissibility.  
  - **To accept (4):** They embrace (8) fully, collapsing intra/interpersonal distinctions. No cost to them.  

  ---

  ### If You Keep (7) (Prudence is Permissible)  
  You commit to:  
  1. **Rejecting (4)'s equivalence**: Prudence is permissible because the "cost-bearer" and "beneficiary" share agency, even with weak psychological bonds.  
  2. **Preserving the separateness objection**: Compensation requires shared agency, which exists within lives but not across them.  
  3. **Denying that psychology alone determines moral units**: Biological continuity or agent-persistence provides a principled basis for the intrapersonal/interpersonal distinction.  

  ---

  ### Does the Argument Succeed for QALY Policy?  
  **No.** Even if you concede all steps (which you shouldn’t), the separateness objection retains force:  
  - **Consent & Autonomy**: Prudence involves *first-personal endorsement*: you impose costs *on yourself* for your *own* benefit. QALY aggregation imposes costs *on one person* without consent for *another’s* benefit.  
  - **Distributive Justice**: The objection isn’t just about compensation—it’s about *rights violations*. Taking from A to give to B treats A as a mere resource. Prudence avoids this by operating within a single rights-bearer.  
  - **Practical Asymmetry**: In prudence, the agent can weigh trade-offs; in QALYs, the state overrides individual interests for collective gain.  

  ---

  ### Final Recommendation for Your Column  
  1. **Stand your ground**: The postdoc’s argument fails at (4). His analogy between elderly selves and spouses ignores the moral significance of unified agency.  
  2. **Reframe the objection**: The core issue isn’t "aggregation" but **non-consensual sacrifice**—using one person as a means for others’ ends. Prudence is self-sacrifice; QALY trade-offs are sacrificial *of others*.  
  3. **Policy implication**: QALYs aren’t *incoherent*, but they require justification beyond pure aggregation (e.g., procedural fairness, priority to the worst-off). The separateness objection remains a powerful critique of *unconstrained* utilitarian policymaking.  

  **Conclusion**: Your premise isn’t incoherent. Publish with confidence, adding a brief rebuttal to the postdoc’s argument by stressing agency and consent. The philosophers you interviewed likely agree: defending QALYs requires more than dismissing separateness—it demands engaging with deontic constraints.
