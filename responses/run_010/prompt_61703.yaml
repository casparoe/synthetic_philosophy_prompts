  Three strategies: 
  - Transfer only material burden (e.g., fines): Fails condemnation and initiation asymmetry. 
  - Substituted suffering as expressive: Must clarify what it expresses (e.g., solidarity?) and to whom—risks diluting condemnation of offender. 
  - Identity doesn't matter: Bold but clashes with universal intuitions about imprisonment/death substitution—likely fails non-negotiable desideratum 1a. 

  Refined list time: elevate initiation asymmetry, split residual discomfort into two parts (existence + punitive status), and flag discharge/punishment boundary as camp-specific.
answer: |-
  Here is a refined and augmented list of desiderata for your framework, incorporating your insights and addressing the gaps, with justifications and classifications:

  ### Core Desiderata (Non-Negotiable)
  1.  **Explain the Burden-Type Asymmetry:** The theory must explain why substitution is widely accepted for fines but rejected for imprisonment/death, even when burdens are comparable or fines are heavier. It cannot dismiss the asymmetry as irrational or attribute it solely to severity.
      *   **Motivation:** Lewis's core puzzle – identical substitution proposals evoke radically different intuitions based on burden type, not magnitude (e.g., a friend paying a large fine vs. serving a short prison sentence).
      *   **Classification:** Non-negotiable. Any theory failing this fails its core task.

  2.  **Account for the Punitive Remainder:** The theory must explain the persistent intuition that *something* punitive remains with the offender even after successful substitution (e.g., describing them as "punished," expecting distinctive guilt/shame at being rescued). It must clarify whether this remainder *constitutes* punishment and, if so, how.
      *   **Motivation:** Post-substitution phenomenology (e.g., offender discomfort after friend pays fine) and linguistic practice ("he was punished, but his friend paid").
      *   **Classification:** Non-negotiable. Ignoring this distorts the phenomenon.

  3.  **Resolve the Condemnation Dilemma:** The theory must either (a) explain how condemnation of the *offender* is communicated when suffering is borne by an innocent substitute, or (b) explain what else is communicated (and to whom) that satisfies the expressive function of punishment, without incoherence.
      *   **Motivation:** The strong intuition that undeserved suffering cannot express condemnation *of the offender*. If punishment inherently condemns the offender, substitution seems conceptually problematic for non-fines.
      *   **Classification:** Non-negotiable. Expressing condemnation is central to most punishment theories; sidestepping it renders an account incomplete.

  4.  **Address Initiation Asymmetry:** The theory must explain why voluntary substitution (by a devoted friend) is often deemed tolerable (even for prison in some hypotheticals), while non-voluntary substitution (by an assigned innocent) is uniformly deemed intolerable, even if the suffering distribution is identical.
      *   **Motivation:** The stark difference in intuitions between a volunteer stepping forward and the state conscripting an innocent. This asymmetry might be more fundamental than burden-type.
      *   **Classification:** Non-negotiable. This is a critical feature of our intuitions often overlooked; theories must position themselves on its importance relative to burden-type.

  ### Important Desiderata (Potentially Camp-Specific)
  5.  **Distinguish Permissibility Factors:** The theory should distinguish the normative roles of volunteer consent, offender acceptance, victim waiver, and state authorization in justifying substitution, rather than treating them as interchangeable sources of permission.
      *   **Motivation:** These factors operate differently (e.g., consent protects the substitute; authorization concerns state legitimacy; acceptance relates to offender desert/recognition; waiver concerns victim-centric justice). Pooling them obscures distinct normative concerns.
      *   **Classification:** Preference (Retributive/Liberal Camp). Prioritizing clarity in moral actors aligns with retributive focus on desert/agency and liberal focus on limiting state power/individual rights. Consequentialists might find pooling acceptable if outcomes are optimal.

  6.  **Pretain Wealth-Based Immunity:** The theory must not permit offenders with sufficient wealth/power to systematically avoid the core burdens intended by punishment for their offenses.
      *   **Motivation:** Concerns about equality before the law, the corrupting influence of wealth on justice, and the degradation of punishment's meaning if reducible to a payable fee.
      *   **Classification:** Preference (Egalitarian Camp). While widely shared, strict retributivists might accept fines as legitimate punishment for the wealthy if proportionate, and radical consequentialists might allow "purchased immunity" if social benefits outweigh costs (e.g., massive fines funding victim compensation).

  7.  **Clarify Discharge vs. Punishment:** The theory should specify the point at which fulfilling a punishment-related obligation (e.g., paying a fine) ceases to be *undergoing punishment* and becomes merely *discharging a debt*.
      *   **Motivation:** The ambiguity highlighted by substitution – if paying a fine is merely discharging a debt, substitution is easy; if it is an essential part of undergoing punishment, substitution is problematic. This relates directly to Desideratum 2 (the Remainder).
      *   **Classification:** Preference (Conceptual-Analytic Camp). Essential for theories focused on the metaphysics or phenomenology of punishment. Instrumentalist theories might find the distinction less crucial if the social functions of punishment are achieved.

  ### Assessment of Provisional List & Augmentation
  *   **Your "discharge vs. punishment" point** is crucial but likely camp-specific (now Desideratum 7).
  *   **Wealth immunity** is a strong preference but not universally non-negotiable (now Desideratum 6).
  *   **Distinguishing consent/acceptance/etc.** is valuable but prioritizes certain normative frameworks (now Desideratum 5).
  *   **Added:** Initiation Asymmetry (Desideratum 4) as a critical, underemphasized feature.
  *   **Refined:** Condemnation requirement (Desideratum 3) to allow for alternative expressive accounts.
  *   **Split:** Your "something survives" point into the core requirement for the remainder (Desideratum 2) and the clarification of its punitive status (part of Desideratum 2/7).

  ### Argument for Shape & Key Diagnostics
  *   **Joint Unsatisfiability:** Desiderata 2 (Punitive Remainder) and 3 (Condemnation Dilemma) create tension with theories that permit full substitution. If condemnation must stick to the offender (3a) and something punitive remains with them (2), then *full* substitution (where the offender bears *no* punishment) seems impossible. A theory must either:
      *   Deny full substitution is possible (accept only partial substitution where the offender bears the condemnatory "sting").
      *   Reject that the remainder is punitive (2) and offer an alternative account of condemnation (3b - e.g., the act of substitution itself communicates condemnation).
      *   Reject the link between punishment and condemning the offender (a major revision).
  *   **Most Eliminative Requirement:** **Desideratum 3 (Condemnation Dilemma)** eliminates the largest number of views.
      *   **Flat Permissibility Views:** Fail on 3a (can't explain how condemnation sticks to offender).
      *   **Simple Burden-Transfer Views:** Fail on 3a (innocent's suffering doesn't condemn offender).
      *   **Pure Expressive Views:** Struggle with 3b if they insist punishment *must* condemn the sufferer, making substitution incoherent. They must significantly adapt.
  *   **Performance of Broad Strategies:**
      1.  **Transfer Only Material Burden:** Accepts substitution for fines (seen as material debt) but not imprisonment/death (seen as essentially punitive/condemnatory experiences). *Fails:* Desideratum 4 (Initiation Asymmetry - why is voluntary imprisonment substitution still monstrous?), Desideratum 3a (if imprisonment is the condemnation-bearer, how does condemnation reach the offender if substituted?), and struggles with Desideratum 2 (what punitive remainder is there if only material burden transferred?).
      2.  **Substituted Suffering as Expressive:** Claims the substitute's suffering *itself* expresses condemnation of the offender (e.g., vicarious atonement) or another message (e.g., community solidarity). *Fails:* Desideratum 3a for most intuitions (suffering of innocent A doesn't *feel* like it condemns offender B), potentially Desideratum 6 (if wealthy can pay for expressive substitutes). *Must grapple intensely* with Desiderata 2, 3b, and 4.
      3.  **Identity of Sufferer Irrelevant:** Argues punishment is about the imposition of a sanctioned burden *on behalf of* the offender; who bears it is secondary if the sanction is fulfilled. *Fails:* Desiderata 1 (Burden-Type Asymmetry - doesn't explain why our intuitions diverge), 2 (Punitive Remainder - if identity irrelevant, why does *anything* remain with offender?), 3 (Condemnation Dilemma - how is condemnation communicated if not via the offender's experience?), and 4 (Initiation Asymmetry - why is conscription worse than volunteering?).

  This framework forces theories to confront the core puzzle directly, account for nuanced features like the remainder and initiation, and make difficult choices about condemnation and the nature of punishment's burdens.
