  Their provisional list has solid starts but needs scrutiny. Explaining burden-type variation? Essential. Handling condemnation? Probably non-negotiable—punishment without condemning the offender seems incoherent. Keeping consent/acceptance/waiver/authorization distinct? Likely a preference (e.g., retributivists care about offender's desert, liberals about state overreach). Discharge vs. punishment boundary? Camp-specific (utilitarians might not care). Preventing wealthy immunity? Non-negotiable for egalitarians, but consequentialists might allow it if socially beneficial. 

  Now gaps: initiation asymmetry is missing! Must add a desideratum forcing theories to address volunteer vs. conscripted substitution. Also, the residual discomfort post-substitution needs explicit handling—does the theory recognize it as punitive? 

  Incompatibilities? If a theory treats condemnation as non-transferable (desideratum 2), but also insists substitution leaves no punitive remnant (desideratum 1b), that clashes—you can't have condemnation stick to the offender unless something punitive remains. 

