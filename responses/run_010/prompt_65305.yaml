  We are considering the "cap-and-stabilize" method for ranking proposals with fat-tailed payoff distributions, some of which may have conditionally convergent or divergent expected utilities. The method involves truncating the payoff distribution at a cap C, computing the expected value under that cap, and then observing the stability of the ranking as C increases. We are concerned about the Pasadena paradox and the implications of undefined expected values.

  Key issues to address:

  1. **Truncation methods and their effect on rankings**: 
     - We must consider different ways to handle outcomes beyond the cap: 
       (a) Cap the absolute value: if |payoff| > C, set payoff to C (if positive) or -C (if negative).
       (b) Cap only the upside: if payoff > C, set to C; if payoff < -C, leave as is (or vice versa).
       (c) Cap both upside and downside independently (e.g., set to min(max(payoff, -C), C)).
       (d) Drop the tail entirely: ignore outcomes beyond C and renormalize the probabilities.
     - These methods will generally yield different expected values and hence different rankings. The question is which, if any, corresponds to the "true" expected value. In the absence of a defined expectation, there is no unique answer. However, the conditional expectation given |payoff| <= C (which corresponds to dropping the tail and renormalizing) is a natural candidate because it is the standard way to condition on an event. But note: this method does not assign a value to the tail, so it might understate the potential for extreme outcomes.

  2. **Riemann rearrangement theorem and stability**:
     - The Riemann rearrangement theorem says that for conditionally convergent series, by changing the order of terms we can make the sum converge to any real number or diverge. In our context, the payoff distribution does not come with a natural ordering of states. Therefore, if we truncate by taking only the outcomes with |payoff| <= C, we are effectively ordering by the magnitude of the payoff. But this ordering is arbitrary: we could order by the payoff itself (positive then negative, or interleaved) and get different partial sums. Therefore, the stability we observe as C increases might be an artifact of the ordering we chose (by magnitude) and not a robust feature of the distribution. This is a serious challenge.

  3. **Endogenous cap and circularity**:
     - Setting C to the size of the endowment (say, $4M) is endogenous because the endowment is what we are risking. This may not be circular in a vicious way: it reflects our risk capacity. However, note that the cap is applied to the payoff, not the loss. In a typical setting, the loss cannot exceed the endowment (if we are limited liability) so capping at the endowment might be seen as a way to account for bankruptcy. But if the payoff is a multiple of our investment, then the cap might be too low. Also, if we set C too low, we might miss important tail behavior. The stability as C grows is supposed to mitigate this, but if the expected value is conditionally convergent, the stability might never occur.

  4. **Handling divergent proposals**:
     - For a proposal with a divergent expected utility (the Altadena game), the truncated expectation will oscillate without bound as C increases. Therefore, the ranking will never stabilize. It might be that we should exclude such proposals from the ranking exercise and handle them separately. But how to identify them? One way is to check the convergence of the positive and negative parts: if both the positive part and the negative part have infinite expectation, then the expectation is undefined. In that case, we might consider other criteria (like median, probability of loss, etc.). However, note that even conditionally convergent cases (like the Pasadena game) can be problematic.

