  **Example 2: Altadena game**
  The Altadena game is like the Pasadena game but with the payoffs multiplied by n: so payoff for state n is (-1)^{n-1} * 2^n. 
  The series of payoffs: 2, -4, 8, -16, 32, ... with probabilities 1/2, 1/4, 1/8, ...
