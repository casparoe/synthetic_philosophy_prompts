  So E(C) alternates between 0 and 1 and does not converge. Therefore, the ranking of the Altadena game relative to a fixed alternative (say, a sure $0.5) will oscillate: sometimes above, sometimes below. Hence, no stability.

  Now, to address the specific questions:

  1. **Truncation methods**:
     - The method of truncation matters. For example:
       - If we cap only the upside and leave the downside uncapped, then the expectation might be driven to negative infinity as C increases if there is a fat negative tail. Similarly, capping only the downside might lead to positive infinity.
       - Dropping the tail entirely (and renormalizing) is equivalent to conditioning on the event that |payoff|<=C. This is the method we have been using. It is the most natural because it does not distort the probabilities of the events we are conditioning on. However, it ignores the tail entirely. This might be acceptable if the tail events are so extreme that we cannot reasonably assign a utility to them (and hence we condition on non-extreme events). But note: the renormalization changes the probabilities of the non-tail events.

     Which one earns the name "the expected value"? Only the conditional expectation (dropping the tail) has a clear interpretation as an expectation (conditioned on the event). The other capping methods are ad hoc and distort the distribution arbitrarily.

  2. **Riemann rearrangement**:
     - In our truncation by magnitude (using the natural order of states) we do not rearrange the outcomes arbitrarily. Therefore, the truncated expectation is well-defined. However, the issue of rearrangement becomes critical if we try to define the expectation without truncation. But in our method, we are only using the truncated version. The stability as C increases is the convergence of the conditional expectation as we condition on less and less extreme events. This convergence may or may not happen. If it converges, then we have a well-defined limit. If it diverges, we don't.

     However, note: the conditional expectation given |payoff|<=C depends on the ordering of states only in the sense that the set {|payoff|<=C} is well-defined. So the problem does not arise.

  3. **Endogenous cap**:
     - Setting C to the endowment size is not necessarily circular. It reflects the fact that beyond that point, we cannot meaningfully realize the payoff (because we would be bankrupt). However, if the payoff is a return on investment, then the cap should be set as a multiple of the investment. Moreover, the stability analysis (as C increases) is intended to remove the dependence on the specific cap. Therefore, the initial choice of C for the truncation is not critical as long as we look at the behavior as C increases. However, if we set C too low (below the endowment) we might be too conservative. But if we set it too high, we might include outcomes that are not relevant (because we are bankrupt). 

     A better approach might be to cap at the maximum loss we can absorb (which might be the endowment) and cap gains at a level that we consider "enough" (but that is arbitrary). Alternatively, we might use a utility function that saturates at high payoffs (like bounded utility) and set the cap accordingly.

  4. **Divergent proposals**:
     - For divergent proposals (like the Altadena game), the truncated expectation E(C) does not converge. Therefore, the ranking will never stabilize. We have two options:
       (a) Exclude them from the cap-and-stabilize ranking and handle them by other criteria (e.g., maximum loss, probability of ruin, etc.).
       (b) Use a different decision rule for all proposals that does not rely on the existence of the expectation.

     How to identify divergent proposals? We can check the convergence of the positive and negative parts separately. Let E^+ = E[max(payoff,0)] and E^- = E[max(-payoff,0)]. If both E^+ and E^- are infinite, then the expectation is undefined (divergent). If one is finite and the other infinite, then the expectation is well-defined (as +infty or -infty). Only when both are finite do we have absolute convergence. Conditionally convergent means that both E^+ and E^- are infinite but the series converges conditionally. But note: in the conditionally convergent case, the truncated expectation E(C) will typically converge to a finite limit as C->infty. So the divergent case we are worried about is when E^+ = E^- = infty and the series does not converge (like Altadena). 

     Therefore, we might run a test: compute the partial sums of the positive payoffs and the negative payoffs (ordered by magnitude) and see if they seem to be diverging. But note: this is not a trivial computational task.

  5. **Alternative criteria**:
     - If the expectation does not exist (or we cannot rely on it), we might consider:
       - **Median outcome**: but the median might be zero in many fat-tailed distributions and not capture the potential for extreme gains/losses.
       - **Probability of loss**: P(payoff < 0). But this ignores the magnitude of gains and losses.
       - **Expected utility with bounded utility**: This is the most theoretically sound approach. We choose a bounded utility function (e.g., u(x) = arctan(x) or u(x) = 1 - exp(-kx) for x>0 and similarly for x<0, but note exponential is unbounded; so use a bounded one). Then the expected utility is guaranteed to exist. We can then compare proposals by their expected utility.
       - **Risk measures**: CVaR at a certain confidence level (e.g., 95%) is the expected loss given that the loss is above the 95% VaR. This focuses on the downside tail.

     However, note that the bounded utility function approach is the one recommended by decision theory for exactly these problems (see for example, Savage's bounded utility or the St. Petersburg resolution).

  6. **Second-order embarrassment**:
     - The choice of decision rule (including the cap C, the method of truncation, or the choice of bounded utility function) is itself a decision under uncertainty. And if we are uncertain about the rule, then that uncertainty might have fat tails. However, at some point we must choose a rule. We might use a bounded utility function for the second-order decision as well. Alternatively, we might use a rule that is robust across a range of scenarios.

     In practice, we can adopt a bounded utility function and then the second-order decision (which bounded function to choose) might be made with a conservative approach (choose one that is not too sensitive to extreme tails).

  **Recommendations**:

  1. **Adopt a bounded utility function**: Instead of cap-and-stabilize, use a utility function that is bounded (say, u(x) = arctan(x) or u(x) = x/(1+|x|) for simplicity). Then compute the expected utility for each proposal. This avoids all the problems of convergence and rearrangement. 

     Why bounded utility? Because it reflects the fact that extremely large gains or losses are not linearly valued. Also, it guarantees that the expected utility exists.

     How to choose the bounded utility? It should be increasing and bounded. The exact form is a normative choice. We might choose one that is approximately linear for payoffs within the endowment and then saturates.

     Example: u(x) = sign(x) * (1 - exp(-|x|/S)) for some scale S. But note: this is bounded by 1 in absolute value. The scale S can be set to the endowment ($4M) so that for payoffs much less than S, utility is approximately linear, and for payoffs much larger, it becomes constant. This is similar to capping, but with a smooth transition.

  2. **If sticking with cap-and-stabilize**:
     - Use the conditional expectation (drop the tail and renormalize). 
     - But note: the renormalization changes the probabilities. We are effectively saying: "given that the payoff is not extreme, what is the expected value?" This might underweight tail events.
     - Check for convergence as C increases. If the expected value E(C) converges to a limit, then use that limit. If it diverges (like the Altadena game), then exclude the proposal or use a different criterion for it.
     - How to check convergence? We can compute E(C) for a sequence of caps (C= $1M, $2M, $4M, $8M, etc.) and see if it stabilizes. But note: conditionally convergent series converge slowly and with oscillation. We might need a tolerance and a large C.

     However, the bounded utility method is superior.

  3. **For divergent proposals under cap-and-stabilize**:
     - If E(C) does not converge as C increases, then we should not rank the proposal by this method. We might then use a risk measure such as CVaR or the probability of ruin (the probability that the loss exceeds the endowment). 

  4. **Endogenous cap**:
     - If we use a bounded utility function, the bound can be set by the endowment. For example, set the utility bound at S = $4M. Then u(x) = x/(1+|x|/(4e6)) or something similar. This makes the utility approximately linear for |x| << $4M and bounded by about $4M in magnitude for large |x|.

  5. **Second-order decision**:
     - For the choice of the decision rule, we can apply the same bounded utility function. That is, we evaluate the decision rule by its expected utility (using the bounded utility) over the possible rule choices. This should be well-defined.

  In conclusion, I recommend moving away from cap-and-stabilize and toward expected utility with a bounded utility function. This is the standard solution in decision theory for handling fat tails and undefined expectations. It is robust and theoretically well-founded.

  For your board members: 

  The problem with our current cap-and-stabilize method is that it might not converge for some proposals (like the Altadena game) and it might be sensitive to the way we truncate the distribution. Moreover, the Riemann rearrangement issue (while mitigated by the fixed state order) doesn't directly affect our truncation but reminds us that conditionally convergent series are delicate. 

  A better approach is to use a bounded utility function. This means that we transform the payoffs via a function that is increasing but flattens out for very large gains or losses. For example, we might use the function:

     u(x) = x / (1 + |x|/S)

  where S is a scale parameter set to our endowment ($4M). Then we compute the expected utility E[u(X)] for each proposal. This expectation will always exist (because u is bounded) and we can rank by this expected utility.

  This method accounts for the fact that a $1 billion gain is not really worth a thousand times more than a $1 million gain to a $4M foundation, because we cannot capture the full value (and might be saturated). Similarly for losses: a loss of $4M is ruinous, and a loss of $10M is not twice as bad because we are already bankrupt.

  We can test this method on the Pasadena and Altadena games and see that it yields finite and meaningful values.

  Example: Pasadena game with u(x)=x/(1+|x|/S), say S=4.

  The calculation is complex but feasible by summing enough terms. For instance, the state n=1: x=2, u(2)=2/(1+2/4)=2/(1.5)=4/3≈1.333
  n=2: x=-2, u(-2)=-2/(1+2/4)=-4/3≈-1.333
  n=3: x=8/3≈2.666, u=2.666/(1+2.666/4)=2.666/(1+0.6665)≈2.666/1.6665≈1.6
  n=4: x=-4, u=-4/(1+4/4)=-4/2=-2
  and so on. The utility values are bounded (by -4 and 4 in this case, but note |u(x)|<4 for finite x and approaches 4 as x->infty). The series will converge because the terms u(x_n)*p(n) are bounded by 4/2^n, which is summable.

  Similarly for the Altadena game: the payoffs are larger, but the utility transformation bounds them. Therefore, the expected utility will converge.

  This method is simple to implement: we just need to choose S and the functional form. I recommend S=$4M and the above form or arctan(x/S) which is also common.

  We can then replace cap-and-stabilize with expected utility with a bounded utility function. This will resolve all the theoretical concerns and provide a consistent ranking.
answer: |-
  ### Analysis of Cap-and-Stabilize in Fat-Tailed Decision Contexts  
  *Prepared for the Board of the Family Foundation*

  #### **Core Challenge**  
  When payoff distributions are fat-tailed (e.g., "Pasadena-shaped" with conditionally convergent expectations or "Altadena-shaped" with divergent expectations), standard expected-value (EV) calculations break down. Our "cap-and-stabilize" method aims to work around this by:  
  1. **Capping payoffs** at a threshold `C`,  
  2. Computing truncated EVs,  
  3. Ranking proposals by how *stable* their relative order remains as `C` increases.  

  Below, I dissect whether this method can produce reliable rankings, addressing your specific concerns.  

  ---

  ### **Key Implications & Recommendations**  
  #### 1. **"Truncate at C" Is Not One Rule – It’s a Family of Rules**  
  Different truncation methods yield different EVs and rankings. Consider a simple payoff distribution:  
  - **Outcomes**: \(\\{-10, 2, 100\\}\)  
  - **Probabilities**: \(\\{0.1, 0.8, 0.1\\}\)  
  - **True EV**: \(0.1 \times (-10) + 0.8 \times 2 + 0.1 \times 100 = 11.6\)  

  | **Truncation Method** (`C=5`) | Computation | "EV" | Rank vs. Alternative EV=10 |  
  |-------------------------------|-------------|------|---------------------------|  
  | **Cap \|payoff\| at C** (hard clip) | \(min(max(-10, -5), 5) = -5\) → \(0.1 \times (-5) + 0.8 \times 2 + 0.1 \times 5 = 1.6\) | 1.6 | Worse |  
  | **Cap upside only** (losses unbounded) | \(-10\) (no cap), \(2\), \(min(100,5)=5\) → \(0.1 \times (-10) + 0.8 \times 2 + 0.1 \times 5 = -0.9\) | -0.9 | Worse |  
  | **Cap downside only** (gains unbounded) | \(max(-10,-5)=-5\), \(2\), \(100\) → \(0.1 \times (-5) + 0.8 \times 2 + 0.1 \times 100 = 11.1\) | 11.1 | Better |  
  | **Drop tail entirely** (renormalize probs) | Drop \(\\|x\\|>5\) (100 outcome), renormalize probs: \(P(-10)=0.1/0.9≈0.111\), \(P(2)=0.8/0.9≈0.889\) → \(0.111 \times (-10) + 0.889 \times 2 ≈ 0.666\) | 0.666 | Worse |  

  **Why it matters**:  
  - No single method "earns" the title of "true EV." Each imposes arbitrary preferences:  
    - **Hard clip** distorts magnitudes asymmetrically.  
    - **Upside/downside caps** bias toward risk-seeking or risk-aversion.  
    - **Dropping tail** ignores tail events entirely (dangerous for fat tails).  
  - **Recommendation**: Use **renormalization** (drop tail) for consistency with conditional expectation. It answers: *"Given no extreme outcomes occur, what’s the EV?"*  

  #### 2. **Riemann Rearrangement: Stability Is Order-Dependent**  
  The Riemann rearrangement theorem shows that conditionally convergent series (like Pasadena payoffs) can be reordered to converge to *any value* or diverge. Our method assumes outcomes are ordered by magnitude (e.g., \(\\{-2, 2, -4, 4, ...\\}\)), but this ordering is arbitrary.  

  **Example**: Pasadena game payoffs:  
  - Natural order (by \(n\)): \(x_n = (-1)^{n-1} \frac{2^n}{n}\), prob \(p_n = \frac{1}{2^n}\)  
  - Truncated EV at \(C=4\): Sum over \(n\) where \(\\|x_n\\| \leq 4\):  
    \(n=1\): \(2 \times 0.5 = 1\)  
    \(n=2\): \(-2 \times 0.25 = -0.5\)  
    \(n=3\): excluded (\(\\|8/3\\|>4\))  
    → EV = \(1 - 0.5 = 0.5\)  

  But if we reorder outcomes (e.g., group positives first):  
  - Order: \(2, 4, -2, -4, ...\)  
  - At \(C=4\): Include \(2, 4, -2\) (exclude \(-4\)) → EV = \(2 \times 0.5 + 4 \times 0.25 + (-2) \times 0.125 = 1 + 1 - 0.25 = 1.75\)  

  **Implication**:  
  - Stability under increasing `C` **depends on outcome ordering**. If your data source orders outcomes arbitrarily (e.g., by time, not magnitude), rankings may shift unpredictably as `C` grows.  
  - **Recommendation**: Fix ordering **by payoff magnitude** (smallest to largest absolute value) before truncating. This minimizes rearrangement sensitivity.  

  #### 3. **Endogenous Cap: Circular but Necessary**  
  Setting \(C = \text{endowment size}\) (\$4M) seems circular, but it’s defensible:  
  - **Why circular?** The cap affects the EV, which affects which projects get funded, altering the endowment’s future size.  
  - **Why necessary?** Capping at an exogenous value (e.g., \$100M) ignores your foundation’s risk capacity. Losing \$4M is ruinous; losing \$100M is irrelevant if you can’t survive past \$4M.  
  - **Compromise**: Use endowment-sized `C` as a **starting point**, but test stability as `C → ∞`. If rankings stabilize for `C >> $4M`, the circularity is benign.  

  #### 4. **Divergent Proposals: Remove Them or Change Tools**  
  For Altadena-like payoffs (divergent EV), no `C` produces stability. Example:  
  - Payoffs: \(x_n = (-1)^{n-1} 2^n\), \(p_n = \frac{1}{2^n}\)  
  - Truncated EV at `C`:  
    - \(C=2\): \(2 \times 0.5 = 1\)  
    - \(C=4\): \(2 \times 0.5 + (-4) \times 0.25 = 1 - 1 = 0\)  
    - \(C=8\): \(1 - 1 + 8 \times 0.125 = 1\)  
    → EV oscillates between 0 and 1 indefinitely.  

  **Implications**:  
  - Mixing convergent and divergent proposals in one ranking **guarantees instability**.  
  - **Action**:  
    1. **Pre-screen for convergence** by checking if both:  
       - Positive tail sum: \(\sum \max(x_i,0) p_i = \infty\)  
       - Negative tail sum: \(\sum \min(x_i,0) p_i = -\infty\)  
       If both hold, EV is divergent/undefined (e.g., Altadena).  
    2. **Exclude divergent proposals** from cap-and-stabilize. Use alternative criteria (see §5).  

  #### 5. **When EV Fails: What to Rank Instead?**  
  If EV is undefined, you’re rationally permitted to use *any* consistent rule—but some are better:  
  - **Median payoff**: Ignores tail magnitudes (bad for fat tails).  
  - **Probability of loss**: Ignores gain sizes.  
  - **Survival probability**: \(\mathbb{P}(\text{payoff} \geq -\text{endowment})\). Aligns with bankruptcy risk.  
  - **α-Expected Shortfall (ES)**: Average loss in worst α% cases (e.g., α=5%). Coherent and tail-sensitive.  

  **Recommendation**: For divergent proposals, **rank by \(\text{ES}_{5\%}\)** (expected loss in worst 5% of outcomes). It prioritizes avoiding ruin.  

  #### 6. **Second-Order Embarrassment: Self-Application**  
  Choosing a decision rule is itself a fat-tailed decision. Example:  
  - Suppose cap-and-stabilize works well 99% of the time but catastrophically fails 1% of the time.  
  - **Self-application test**: Would you use cap-and-stabilize to *evaluate cap-and-stabilize*? If not, the rule is suspect.  

  **Resolution**:  
  - Use a **bounded utility function** (e.g., \(u(x) = 1 - e^{-x/\text{endowment}}\)) for *all* decisions, including rule selection. This guarantees finite EVs and avoids infinite regress.  

  ---

  ### **Revised Protocol for the Foundation**  
  1. **Pre-screen proposals**:  
     - Reject any with divergent EV (both positive/negative tails infinite).  
     - Use renormalized conditional EV (drop tail) for the rest.  
  2. **Cap-and-stabilize**:  
     - Order outcomes by **absolute payoff magnitude** (smallest to largest).  
     - Truncate by **dropping outcomes with \(\\|x_i\\| > C\)** (do not clip values).  
     - Set starting \(C = \text{endowment} \).  
     - Increase \(C\) until rankings stabilize (or \(C\) exceeds all plausible payoffs).  
  3. **For divergent proposals**: Rank by **5% Expected Shortfall** (ES₅%).  
  4. **Long-term**: Switch to **expected bounded utility** (e.g., \(u(x) = \frac{x}{1 + |x|/\text{endowment}}\)) to avoid truncation artifacts.  

  This balances rigor, transparency, and resilience to fat tails. I’ll provide numerical examples for the next board meeting.  

  ---  
  *The deeper issue: When expectations don’t exist, decision rules must encode priorities explicitly. Cap-and-stabilize is a heuristic—useful if grounded in your risk capacity, but no substitute for bounded utility when tails dominate.*
