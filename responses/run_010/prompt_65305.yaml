       (d) Risk measures: Value at Risk (VaR) or Conditional Value at Risk (CVaR) at a certain confidence level. CVaR (expected shortfall) is coherent and considers the tail beyond VaR.

  6. **Second-order decision rule**:
     - The choice of the decision rule (including the cap-and-stabilize method) is itself a decision under uncertainty. The rule might have fat-tailed consequences. We must be cautious about self-application. However, in practice, we might use a bounded utility function for the second-order decision as well.

