  At C=2: include n=1 (payoff 2) -> E=2*(1/2)=1.
  At C=4: include n=1 and n=2: E=2*(1/2) + (-4)*(1/4)=1-1=0.
  At C=8: include n=1,2,3: E=1 -1 + 8*(1/8)=1-1+1=1.
