prompt: |-
  I sit on the clinical ethics committee of a mid-sized academic medical center, and we are in the middle of rewriting the policy that governs how our clinicians treat advance directives. The committee chair has asked me to draft a short background paper explaining what our current practice actually assumes, on the theory that we have been applying these rules for two decades without anyone articulating the view of the patient behind them. I am a hospitalist, not a philosopher, so I will describe the practice as precisely as I can and leave the reconstruction to you. The draft under review has five features that I want treated as a single bundle, because the committee defends it as a package. First, refusals bind but requests do not: if a valid directive refuses an intervention, the team must withhold it even when it is life-saving and even when everyone believes the patient would choose differently today; if the directive demands an intervention the team judges clinically inappropriate, the team may decline and offer transfer instead. Second, a contemporaneous objection revokes: when a patient who has lost decision-making capacity resists — pushing away a feeding tube, repeating that she wants to go home — staff are instructed to treat that as a revocation and to stop, unless the directive contains an explicit non-revocation clause executed before two witnesses with a clinician's attestation of capacity at signing. In practice fewer than one patient in fifty has that clause. Third, the evidential bar is high: prior wishes must be established by clear and convincing evidence, meaning a written directive, a designated agent, or consistent statements reported independently by more than one person; hearsay about what someone once said at a funeral does not qualify. Fourth, the sequence is fixed — substituted judgment first, best interests only as a fallback — and substituted judgment is defined as the surrogate's task of answering not what would be good for this patient now but what this patient would have chosen. Fifth, in progressive dementia the draft instructs that values expressed while the patient retained capacity, including values about the kind of life the patient would consider worth living, take precedence over the patient's present apparent contentment, unless that contentment comes with capacity for the decision at hand; but in our separate psychiatric track, a directive may be overridden whenever the team judges it contraindicated, and a patient in an acute episode may revoke at will, with staff instructed to honor that revocation even when the patient plainly lacks capacity for the decision.

  What I want from you is a reconstruction of the implicit theory, not an evaluation of whether the policy is good. Begin with the question of authority across time: what has to be true of persons for the earlier self to be entitled to bind the later one at all? Does this bundle require that the signing self and the demented self be the same person in some strong sense that carries authority forward, or would something weaker — a standing promise, a property claim over one's future body, a right to set the terms on which others may act toward you — license exactly the same rules? Then take the two clauses that seem to me to pull in opposite directions. The dementia clause looks committed to the view that a person's settled evaluative commitments outweigh the quality of the experience they are now having, while the revocation clause looks committed to the view that whatever the person in front of us expresses now is the last word; tell me whether one theory can generate both, and if so, what distinction it has to be leaning on that our draft never states. Do the same for the refusal/request asymmetry: is there a principled account on which a prior refusal binds absolutely while a prior request is merely advisory, or does that asymmetry reveal that what the policy is really tracking is the avoidance of a certain kind of wrong rather than the extension of the patient's will? And examine what substituted judgment, defined as a counterfactual question, presupposes about there being a determinate answer — including what the policy silently assumes when the patient has changed enough that the counterfactual has no truth value, which is, I suspect, most of our dementia cases.

  Finally, I want the parts sorted rather than blurred. For each of the five features, say whether it is strictly entailed by the reconstructed theory, merely consistent with it, or compatible with several rival theories at once — that is, where the policy is philosophically underdetermined and the committee therefore has a real choice to make rather than an interpretation to discover. Flag which of the tensions above are genuine inconsistencies that no distinction can dissolve, and which are the surface expression of a distinction the draft has failed to articulate. Then tell me what would have to change — which clauses, which defaults, which evidential standards — if we replaced the presupposed view with a time-relative account on which the authority of the earlier self decays with the degree of psychological connection to the later one, and separately, if we replaced it with a view on which authority rests entirely in the present patient's welfare. Note anything the policy could keep unchanged under either replacement, since the committee would rather amend than rewrite. Please write in American English, define any technical term you use in a clause rather than assuming it, and give me the reasoning rather than a reading list or references, which would be of no use to me in a committee meeting.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're a hospitalist on a clinical ethics committee, tasked with drafting a background paper on their advance directive policy. They need a philosophical reconstruction of the implicit theory behind their five-feature bundle, not an evaluation. 

  First, I need to understand each feature clearly. The refusal/request asymmetry stands out—refusals bind absolutely while requests don't. That feels like it's prioritizing negative autonomy over positive claims. The contemporaneous revocation clause is interesting because it gives immense weight to present behavior, even without capacity. The high evidential bar makes sense legally but philosophically? Hmm. 

  Then there's the substituted judgment sequence and the dementia/psychiatric split. The dementia part values past values over present contentment, while psychiatry allows overrides. That tension needs explaining. 

  For authority across time... The policy seems to treat the signing self as having lasting authority, but the revocation clause undermines that. Maybe it's not about personal identity but about rights to control boundaries? The refusal/request asymmetry might tie into the distinction between letting die vs. actively causing harm. 

  Substituted judgment as a counterfactual is tricky—it assumes the patient has stable preferences. But in dementia, that's often not true. The policy probably silently defaults to best interests when the counterfactual is unknowable. 

  I should map each feature to the reconstructed theory: 
  - Refusal binding strictly entails the self-as-author view 
  - Contemporaneous revocation is consistent but not entailed—it's a practical safeguard 
  - High evidence bar is compatible with multiple theories 
  - Substituted judgment sequence entails the counterfactual approach 
  - Dementia clause strictly entails past values supremacy 

  The tensions... The dementia/revocation conflict isn't logically inconsistent if we distinguish between capable expressions (revocation) vs. incapable ones (dementia). But the psychiatry exception? That's messy. 

  For alternative theories: A time-relative view would weaken refusal binding and soften revocation standards. A welfare-centered view would collapse substituted judgment entirely. But some elements like evidence standards could stay. 

  User's clearly time-pressed—no jargon, no references. Need crisp distinctions between what's core vs. adjustable. Committee needs to see where they have philosophical wiggle room versus where changes would require overhaul.
answer: |-
  Here’s a reconstruction of the implicit theory underlying your policy bundle, structured to address your questions. I’ll define technical terms parenthetically where they first appear.

  ---

  ### **I. Core Theory: Authority Across Time**
  The policy assumes **"Precedent Autonomy as Boundary-Setting"**:  
  The earlier self holds authority not because it is metaphysically identical to the later self (a strong "same person" view), but because it has a **right to set enduring limits on what may be done to its future body**. This is weaker than a "same person" claim and aligns with:  
  - **A property-rights model**: The patient "owns" their future body’s integrity and may impose lasting vetoes.  
  - **A promise model**: Society honors the patient’s prior exercise of sovereignty as a binding commitment.  

  **Why not require strict personal identity?**  
  If strict identity were required, revocation by a later self with diminished capacity would be incoherent (as it’s "not the same person"). But your policy allows revocation without capacity (e.g., pushing away a feeding tube). Thus, authority rests on **moral/legal rights to control bodily boundaries**, not metaphysical continuity.

  ---

  ### **II. Resolving Tensions in the Bundle**  
  #### **A. Dementia Clause vs. Contemporaneous Revocation**  
  - **Tension**: Dementia clause prioritizes past values over present contentment; revocation clause prioritizes present resistance regardless of capacity.  
  - **Distinction**: The policy implicitly separates **expressions of will** (revocation clause) from **experiential welfare** (dementia clause).  
    - Revocation is honored because it signals *immediate non-consent* to bodily intrusion, even if irrational. This protects bodily integrity *now*.  
    - In dementia, past values govern because the policy views autonomy as **extended self-creation**—the patient’s past competent self defined what constitutes a "good life" for their future diminished self. Present contentment is irrelevant if it violates those foundational values.  
  - **Consistency**: One theory *can* generate both: Autonomy is about **respecting boundaries** (revocation) **and respecting life-defining commitments** (dementia clause). The unstated distinction is between **bodily violation** (stopping *now*) vs. **sustained life-shaping choices** (honoring past values).  

  #### **B. Refusal/Request Asymmetry**  
  - **Refusals bind** because they impose *negative obligations* ("do not touch me"). This aligns with the core "boundary-setting" view: Crossing a prior refusal is a *violation*.  
  - **Requests not binding** because they demand *positive actions* ("you must treat me"). The policy assumes clinicians cannot be compelled to violate professional integrity (e.g., provide futile care).  
  - **Underlying principle**: Avoidance of **active harm/betrayal**. Overriding a refusal constitutes *imposing* an unwanted bodily intrusion. Denying a request is *omission* justified by clinical judgment. The asymmetry reveals the policy prioritizes **preventing wrongs to bodily integrity** over fulfilling positive wishes.  

  #### **C. Substituted Judgment as Counterfactual**  
  - **Assumption**: Patients have **stable, discoverable values** that generate determinate answers to "what would they choose?"  
  - **Silent default**: When no determinate answer exists (e.g., advanced dementia with no clear prior directives), the policy falls back to best interests—but this is *procedurally hidden* by the high evidential bar. If evidence is insufficient, substituted judgment is bypassed de facto.  

  ---

  ### **III. Policy Features vs. Reconstructed Theory**  
  | **Feature**                          | **Relation to Theory**                                     |  
  |--------------------------------------|------------------------------------------------------------|  
  | 1. **Refusals bind, requests don’t** | **Strictly entailed**: Core to boundary-setting view.      |  
  | 2. **Contemporaneous revocation**    | **Consistent but not entailed**: Protects bodily integrity *now*; other theories could limit revocation to capacitated patients. |  
  | 3. **High evidential bar**           | **Compatible with rivals**: Multiple theories demand good evidence to override present interests. |  
  | 4. **Substituted judgment first**    | **Strictly entailed**: Requires counterfactual autonomy as primary. |  
  | 5. **Dementia clause**               | **Strictly entailed**: Past values define identity/worth. |  
  | **Psychiatric exception**            | **Inconsistent with core theory**: Reveals policy prioritizes *clinical risk management* over autonomy in psychiatric contexts. |  

  **Key tension**: The psychiatric exception (*any* contraindicated directive overridden) contradicts the dementia clause’s commitment to past values. No principled distinction justifies this difference—it’s likely pragmatic (e.g., avoiding liability in acute crises).  

  ---

  ### **IV. Alternative Foundations: Required Changes**  
  #### **A. Time-Relative Interests View**  
  *(Authority decays as psychological connections weaken)*  
  - **Changes needed**:  
    1. **Refusals**: Not absolute. Would require weighing strength of past vs. present interests (e.g., override a refusal if current self finds life tolerable).  
    2. **Revocation**: Lower evidence bar for revocation; resistance alone might suffice if psychological connection is weak.  
    3. **Dementia clause**: Past values could be overridden by present contentment if connection is minimal.  
    4. **Evidence**: "Clear and convincing" standard relaxed when connection is weak.  
  - **Compatible features**: Request/refusal asymmetry and substituted judgment sequence *could* remain, but with flexibility.  

  #### **B. Present Welfare View**  
  *(Authority rests entirely in current well-being)*  
  - **Changes needed**:  
    1. **Refusals**: Overridden if life-saving and current self appears content (e.g., dementia patients not resisting care).  
    2. **Substituted judgment**: Abandoned; best interests becomes primary.  
    3. **Revocation**: Honored only if capacitated; non-capacitated resistance ignored unless it causes distress.  
    4. **Dementia clause**: Reversed—present contentment overrides past values.  
  - **Compatible features**: High evidential bar *could* stay (to protect vulnerable patients). Contemporaneous revocation *only* if capacitated.  

  ---

  ### **V. Summary**  
  - **Core theory**: Your policy assumes patients own **future bodily integrity**, allowing prior refusals to bind absolutely, while requests are limited by clinical judgment.  
  - **Key distinction**: Bodily integrity (*protected by refusals/revocation*) vs. life-shaping values (*protected in dementia*).  
  - **Underdetermined elements**: Evidential standards and revocation rules have flexibility; the psychiatric exception is inconsistent.  
  - **Minimal amendments**: To retain most of the bundle, clarify the psychiatric rule or add safeguards for autonomy. To shift foundations, start by relaxing refusal binding or dementia prioritization.  

  This reconstruction shows your policy is philosophically coherent *except* in psychiatry, where it sacrifices autonomy for risk management. The committee’s key choice is whether to align psychiatry with the core theory or formally endorse a dual-track approach.
