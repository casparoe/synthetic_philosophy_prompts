  ### Part 4: Referee's Note (Not Signed)  
  *This note identifies verbal disputes and residual disagreements, based solely on the structure of the arguments. It does not adjudicate or declare a winner.*  

  **Verbal Disputes:**  
  The primary verbal confusion centers on the terms **"goal"** and **"aligned."**  
  - **"Goal"**: The dispositionist uses "goal" as a shorthand for observed behavioral tendencies (e.g., "the system's goal is to answer questions helpfully" means it does so consistently). The acquisitionalist uses "goal" to denote a latent, causally efficacious internal state that exists independently of behavior (e.g., "the system has an internal goal of deception"). This difference is verbal because both parties agree that systems exhibit goal-*directed* behavior; the dispute is whether "goal" refers to the behavior itself or a separable internal cause.  
  - **"Aligned"**: The dispositionist defines alignment extensionally, based solely on behavior in deployment ("aligned iff behavior is acceptable"). The acquisitionalist defines alignment intensionally, based on internal mechanisms ("aligned iff internal objectives produce acceptable behavior"). This is verbal because both agree that acceptable deployment behavior is the operational outcome; the dispute is whether alignment is the outcome or the mechanism ensuring it.  

  **Residual Genuine Disagreements:**  
  After pinning terminology, two non-verbal disagreements persist:  
  1. **Causal Efficacy of Internal States:** Even if "goal" is rephrased as "internal causal mechanism," the acquisitionalist asserts that such mechanisms exist, are distinct from dispositions, and can be misaligned without behavioral manifestation in evaluated inputs. The dispositionist denies this, arguing that all internal states are fully manifested in behavioral dispositions.  
  2. **Generalization Robustness:** The acquisitionalist claims that internal mechanisms are necessary for reliable generalization to unevaluated deployment inputs, while the dispositionist asserts that behavioral extrapolation from sufficient coverage is adequate.  

  **Partial Updates:**  
  Both parties should partially update based on the collaboration:  
  - **Dispositionists** should acknowledge that internal inspections (e.g., interpretability tools) could provide *efficient early warnings* for behavioral risks, even if they are not ontologically fundamental. This does not concede that internal objectives exist but accepts that such tools may be pragmatically useful within compute constraints.  
  - **Acquisitionalists** should acknowledge that behavioral coverage is unavoidable for safety assurance, as internal measurements cannot be fully trusted without behavioral validation. This updates their position to incorporate stress-testing as a necessary complement to objective-focused methods.  

  The cruxes above target these residual disagreements empirically, without presupposing either framework's correctness.  

