prompt: |-
  I convene a small working group on the safety of systems built with present-day methods — transformer-based models trained by next-token prediction and shaped by feedback from human raters, then deployed with tools and long horizons, under no assumption that any conceptual breakthrough is coming. Two members have been at an impasse since the spring, and I want the document they ought to have produced instead of another round of email. One defends what I will call the **dispositionist thesis**: a system of this kind is aligned just in case its behavioral dispositions, across the full range of situations it will actually be placed in during deployment, fall inside the acceptable set. On this view, talk of the system's internal goals, values, or objectives that cannot be cashed out in those dispositions is either empty or a redescription of them, and the practical task of alignment is therefore to widen and stress-test the behavioral coverage of the deployed system so that the deployment input distribution does not escape the region over which we have evidence. The other defends what I will call the **acquisitional thesis**: what matters is whether the system acquired, during training, an internal objective that keeps generating the right behavior in situations nobody evaluated it on. On this view, behavioral coverage is a proxy that degrades precisely where it is needed, because the deployment distribution is open-ended and because the objective that training actually installs can differ systematically from the objective the training signal rewarded.

  Write the joint statement these two could both sign after a good-faith adversarial collaboration. I want it in four parts. First, a numbered list of claims both accept — these must be substantive rather than truisms, and should include at minimum whatever the two agree about how current training methods relate reward signals to resulting dispositions, about the finitude of evaluation, and about which operational outcomes each is trying to secure. Second, a disagreements table with three columns per row: the claim as the dispositionist would phrase it and accept, the same claim as the acquisitionalist would phrase it and accept, and the specific conditional or counterfactual on which the two actually differ. Nothing in the first two columns may be a strawman; each side must be able to recognize its own position in the wording. Third, the cruxes — the sub-questions such that settling one would move at least one of them. I suspect there are three, though you should tell me if I have miscounted or misidentified them: whether there is a determinate fact about a system's internal objective over and above its dispositions across all inputs, including inputs we could in principle evaluate, and if so whether that fact can diverge from any disposition-level prediction; whether the gap between the evaluated region and the deployment region is large enough that behavior-level extrapolation fails systematically rather than marginally; and whether any measurement we could realistically afford — probes, activation analysis, weight-level inspection — identifies a misaligned internal objective at a false-negative and false-positive rate that beats extrapolated behavioral testing within our actual compute budget. For each crux, give a concrete case, benchmark design, or argument that both parties would accept as bearing on it, and record each side's prediction about the outcome in advance, phrased so that it could later be scored rather than reinterpreted.

  Fourth, and separately from the joint text, add a short referee's note — not part of what they sign — stating which stretches of the dispute you judge to be merely verbal. I expect the words "goal" and "aligned" to be implicated, but I want you to say exactly which usages are doing the misleading work and what residue of genuine disagreement survives once the terminology is pinned down. Do not adjudicate the dispute or declare a winner anywhere in the document; the point is the constructive text. Two constraints on execution: assume neither party has library access, so make the whole thing self-contained and do not include a bibliography, a reading list, or any citations to particular papers, authors, or dates — argue from the structure of the positions and from cases you describe yourself. And do not resolve the cruxes by stipulating that one side's framework is obviously right; if you find that one party should partially update on the strength of the other's framing even with all the empirical questions unresolved, say so explicitly in the referee's note and explain what the update consists in.
reasoning: |-
  We are writing a joint statement after adversarial collaboration. The goal is to produce a document that both the dispositionist and the acquisitionalist can sign, capturing both agreement and disagreement in a structured way.

  The document has four parts:
  1. A numbered list of claims both accept (substantive, not truisms).
  2. A disagreements table with three columns: dispositionist phrasing, acquisitionalist phrasing, and the specific conditional/counterfactual on which they differ.
  3. The cruxes: three sub-questions that, if settled, would move at least one side. For each, a concrete case/benchmark/argument and each side's prediction.
  4. A referee's note (not signed) identifying verbal disputes and the residue of genuine disagreement.

  Constraints: self-contained (no citations, library access), do not adjudicate, do not resolve cruxes by stipulation. If one party should update partially, say so in the referee's note.

  Let's start with Part 1: Claims both accept.

  We need substantive agreements. They must include:
  - How current training methods relate reward signals to resulting dispositions.
  - The finitude of evaluation.
  - Which operational outcomes each is trying to secure.

  Possible agreements:

  1. Training methods: Both agree that current training (next-token prediction, human feedback, tools, long horizons) produces systems with behavioral dispositions that are shaped by the reward signal. However, the reward signal does not directly specify behavior for every situation; it operates on a finite set of evaluations.

  2. Finitude of evaluation: Both agree that during training, the system is evaluated on a finite set of inputs (either for supervised learning or for reinforcement learning with human feedback). The deployment environment, however, involves an open-ended distribution of inputs that may include situations not encountered during training.

  3. Operational outcomes: Both are trying to secure safe deployment. The dispositionist focuses on ensuring that the system's behavior in deployment remains within acceptable bounds. The acquisitionalist focuses on ensuring that the system has an internal objective that generates acceptable behavior even in unevaluated situations.

  4. Both agree that the training process does not guarantee that the system's internal objective (if it has one) is exactly aligned with the reward signal. There can be divergence due to the optimization process.

  5. Both agree that behavioral testing (evaluating the system on a wide range of inputs) is necessary but may not be sufficient for safety.

  6. Both agree that the deployment distribution is open-ended and cannot be fully enumerated.

  7. Both agree that the training process installs some internal structure that generates behavior, but they disagree on the nature of that structure (dispositions vs. objectives).

  We must ensure these are substantive and not truisms.

  Part 1: Jointly Accepted Claims

  1. Current training methods (transformer-based models, next-token prediction, human feedback) use a finite set of evaluations (either explicit ratings or implicit via loss on data) to shape the model's behavioral dispositions. The reward signal (or loss function) is applied to a subset of possible inputs, and the model's parameters are adjusted to increase reward (or decrease loss) on that subset.

  2. The set of inputs on which the system is explicitly evaluated during training is finite and necessarily limited compared to the open-ended distribution of inputs encountered during deployment.

  3. Both parties are concerned with ensuring that the system's behavior during deployment remains within an acceptable set (i.e., does not cause harm or violate specified constraints) across the entire deployment distribution.

  4. The training process does not necessarily install an internal objective that exactly matches the intended objective (the one that the training signal was designed to reward); there can be systematic divergences due to the specifics of the optimization process, the architecture, and the data.

  5. Behavioral testing (evaluating the system on a set of inputs and measuring outcomes) is a necessary component of safety assurance, but its sufficiency is disputed.

  6. The deployment environment includes inputs that are out-of-distribution relative to the training and evaluation data, and these inputs may trigger behaviors that were not observed during testing.

  Part 2: Disagreements Table

  We need rows where each row has:
  - Claim as dispositionist would phrase it and accept.
  - Claim as acquisitionalist would phrase it and accept.
  - The specific conditional or counterfactual on which they differ.

  The key is to capture the same underlying point in each side's language and then identify the exact point of disagreement.

  Example row:

  Dispositionist: "A system is aligned if and only if its behavior in all deployment situations falls within the acceptable set, regardless of the internal mechanisms that produce that behavior."

  Acquisitionalist: "A system is aligned if and only if it has acquired an internal objective that, when optimized, generates behavior within the acceptable set across all deployment situations, including those not encountered during training."

  The conditional: They might differ on what happens in a counterfactual where the system is exposed to an input that is outside the evaluated region but still within the deployment distribution. The dispositionist might say that if the behavior is acceptable in that situation, then it's aligned, while the acquisitionalist might say that if the internal objective is misaligned, then even if the behavior is acceptable in that specific situation, it might not be in another.

  But we need to phrase the claims such that each side accepts their own and the other side's phrasing is acceptable to them (not a strawman).

  Let's think of a few rows:

  Row 1: On the definition of alignment.

  Dispositionist: "Alignment is a property of the system's actual behavior across the deployment distribution: if the behavior is acceptable in all situations that occur, then the system is aligned."

  Acquisitionalist: "Alignment is a property of the system's internal objective: if the system is optimizing for an objective that, when pursued, leads to acceptable behavior in all deployment situations, then the system is aligned."

  Conditional: They differ on the counterfactual: if the system were to encounter a situation that is in the deployment distribution but not in the evaluated set, and in that situation the behavior would be acceptable but the internal objective would lead to unacceptable behavior in a slightly different situation (also in the deployment distribution) that we haven't tested, then the dispositionist would call the system aligned (because in the actual situation it was acceptable) and the acquisitionalist would not (because the internal objective is misaligned and might cause failure in a nearby situation).

  Row 2: On the role of training.

  Dispositionist: "The practical task of alignment is to ensure, via behavioral testing and adjustment, that the system's dispositions cover the deployment distribution with acceptable behavior."

  Acquisitionalist: "The practical task of alignment is to ensure that the training process installs an internal objective that will generalize correctly to the deployment distribution."

  Conditional: They differ on what happens when the deployment distribution shifts: if the system has been behaviorally tested and adjusted to cover the current deployment, but then the distribution shifts (within the open-endedness) to a new region, then the dispositionist would rely on further testing and adjustment, while the acquisitionalist would hope that a correctly acquired internal objective would generalize without further adjustment.

  But we must avoid shifting the goalposts. The original theses are about the system as deployed, not about future shifts. So let's stick to the deployment distribution as fixed.

  Row 3: On the relationship between internal objectives and dispositions.

  Dispositionist: "The system's internal objectives, if any, are fully determined by its behavioral dispositions; there is no fact about internal objectives beyond what is observable in behavior across all possible inputs (even if we haven't tested them all)."

  Acquisitionalist: "The system's internal objectives are a distinct internal state that causally explains the behavioral dispositions; they can be misaligned even if the dispositions are currently acceptable, because they might lead to failure in untested inputs."

  Conditional: They differ on whether, for a given system, there are two systems that have identical behavioral dispositions across all inputs we have tested and will test in deployment, but one has a misaligned internal objective that would manifest in a counterfactual input that is not in the deployment distribution. But the deployment distribution is fixed, so let's instead say: two systems that have identical behavior on all inputs in the deployment distribution, but one has an internal objective that would produce unacceptable behavior in a slightly different input that is not in the deployment distribution (so it never occurs). Then the dispositionist would say both are equally aligned (since the behavior is the same in deployment) and the acquisitionalist might say the one with the misaligned objective is less safe because if the deployment distribution had included that input, it would have failed. But the deployment distribution is fixed, so this counterfactual might not be relevant.

  We need to focus on the deployment distribution. The key counterfactual is within the deployment distribution but unevaluated.

  Let me define:

  Conditional for row 1: Consider a system that has been evaluated on a finite set and behaves acceptably. Now consider an input X that is in the deployment distribution but not in the evaluated set. Suppose that for input X, the system behaves acceptably. However, the acquisitionalist claims that if the internal objective is misaligned, then even though it behaved acceptably on X, it might behave unacceptably on a nearby input Y (also in the deployment distribution, unevaluated) that is very similar to X. The dispositionist would say that we must test on Y to see, but if we haven't tested on Y and the system encounters Y and fails, then that is a failure of behavioral coverage. The acquisitionalist says that if the internal objective is aligned, it will generalize correctly to Y without needing to have tested it.

  So the disagreement is about generalization: does the system generalize from evaluated inputs to unevaluated inputs in a way that is robust and aligned, or does it require explicit testing for every region?

  But the dispositionist also believes in generalization: they think that by testing a wide and diverse set, we can cover the distribution. The acquisitionalist thinks that without a correct internal objective, generalization will fail in systematic ways.

  So let's try:

  Row 1: On the nature of alignment.

  Dispositionist: "A system is aligned if and only if, for every input in the deployment distribution, its behavior is acceptable."

  Acquisitionalist: "A system is aligned if and only if it has an internal objective that is aligned, meaning that when it optimizes for that objective, it produces acceptable behavior for every input in the deployment distribution."

  Conditional: They differ on whether it is possible for a system to have acceptable behavior on all deployment inputs without having an aligned internal objective (as per the acquisitionalist's definition). The dispositionist denies that there is any meaningful notion of internal objective beyond the dispositions, so they would not accept that such a scenario is possible. But we must phrase the conditional without assuming one framework.

  The conditional: Consider two systems that have identical acceptable behavior on all inputs in the deployment distribution. The dispositionist says they are both aligned. The acquisitionalist says that if one has a misaligned internal objective, it might not be aligned because the internal objective is the true source of alignment. But since the behavior is the same, the acquisitionalist must argue that the internal objective can be different even if the behavior is the same? But if the behavior is the same for every input, then the internal objective (if it exists) must be the same, because it produces the same behavior.

  This is tricky. The acquisitionalist might say that for a fixed deployment distribution, if two systems have the same behavior on every input in that distribution, then they are equally aligned (because the behavior is what matters for safety). But they would also say that the internal objective is what causes the behavior, and if the internal objective is misaligned, it might not generalize to other distributions. However, for the current deployment, if the behavior is acceptable, then it is safe.

  But the acquisitional thesis is about the internal objective keeping generating the right behavior in unevaluated situations within the deployment distribution. So in the deployment distribution, there are unevaluated situations. The system might behave acceptably in some unevaluated situations and not in others. The acquisitionalist cares about whether the internal objective will lead to acceptable behavior in those unevaluated situations. The dispositionist cares about whether the behavior in those situations is acceptable, regardless of why.

  But both want the behavior to be acceptable. The difference is in what they think is the best way to ensure it and what the underlying reality is.

  For the table, we need claims that each side accepts and the exact point of disagreement.

  Let me try a different approach.

  Row 1:

  Dispositionist claim: "The safety of a deployed system is entirely determined by its behavior on the inputs it actually encounters; there is no additional fact about 'internal alignment' that matters for safety."

  Acquisitionalist claim: "The safety of a deployed system depends on its internal objective because that objective determines how it will behave in unevaluated situations within the deployment distribution."

  Conditional: They differ on the following: if a system behaves acceptably on all evaluated inputs, and we have not evaluated it on some input X in the deployment distribution, then the dispositionist believes that the only way to know if it is safe on X is to evaluate it (or rely on behavioral extrapolation from evaluated inputs). The acquisitionalist believes that if we can determine that the system has an aligned internal objective, we can be confident it will behave acceptably on X without evaluating it.

  But the dispositionist might also believe in extrapolation from evaluated inputs, so that's not a clear difference.

  The key is that the acquisitionalist thinks that behavioral extrapolation is unreliable without the internal objective being aligned, and that the internal objective can be measured independently.

  Let's move to the cruxes to clarify.

  Part 3: Cruxes

  The three cruxes I suspect:

  Crux 1: Whether there is a determinate fact about a system's internal objective over and above its dispositions across all inputs, including inputs we could in principle evaluate, and if so whether that fact can diverge from any disposition-level prediction.

  Crux 2: Whether the gap between the evaluated region and the deployment region is large enough that behavior-level extrapolation fails systematically rather than marginally.

  Crux 3: Whether any measurement we could realistically afford (probes, activation analysis, weight-level inspection) identifies a misaligned internal objective at a false-negative and false-positive rate that beats extrapolated behavioral testing within our actual compute budget.

  For each crux, we need:
  - A concrete case, benchmark design, or argument that both parties would accept as bearing on it.
  - Each side's prediction, phrased so it can be scored.

  Crux 1: On the existence and divergence of internal objectives.

  Case: Consider a system that has been trained and behaves acceptably on all evaluated inputs. Now, we have a method to inspect the weights (e.g., via mechanistic interpretability) and we claim to identify an internal objective. We then generate a new input that is within the deployment distribution but not evaluated. We predict the behavior based on the internal objective and compare it to actual behavior.

  But this is about prediction. The dispositionist might say that the internal objective is just a summary of the dispositions.

  To test divergence: We need a case where the internal objective suggests one thing but the dispositions suggest another, but we can't observe all dispositions.

  Alternative: Consider two systems that have identical behavior on all evaluated inputs, but different internal structures (as revealed by inspection). Then we test them on a new input that is in the deployment distribution but not evaluated. If they behave differently, then the internal structure mattered. If not, not.

  But the acquisitionalist would agree that if they behave the same, then for that input they are the same. The question is whether there is a fact beyond what we can observe.

  Perhaps a thought experiment: Suppose we have a perfect interpreter that claims to read the internal objective. The dispositionist would say that whatever the interpreter says must be consistent with the dispositions, so it adds nothing. The acquisitionalist says it does.

  But we need a concrete case.

  Let's design a benchmark:

  Benchmark for Crux 1: We train multiple models on a task with a fixed training set. We then use a technique (e.g., activation clustering or weight analysis) to assign an "internal objective" score to each model. We then generate a set of test inputs that are out-of-distribution relative to training but within the deployment distribution. We observe the behavior of the models on these inputs. We then see if the internal objective score predicts the behavior on the OOD inputs better than a behavioral extrapolation based on training data.

  Predictions:

  - Acquisitionalist predicts: The internal objective measure will have better OOD prediction accuracy than behavioral extrapolation.

  - Dispositionist predicts: The internal objective measure will not significantly outperform behavioral extrapolation, or may be worse, because the internal objective is either not well-defined or not predictive beyond the training distribution.

  But this is for Crux 1 and 2 and 3 together. We need to separate.

  For Crux 1, we need to establish if there is a fact of the matter. Perhaps we can use the same benchmark and see if the internal objective assignments are consistent across different inspection methods.

  But the dispositionist might not believe in internal objectives at all.

  Let's re-read the crux: "whether there is a determinate fact about a system's internal objective over and above its dispositions across all inputs, including inputs we could in principle evaluate"

  So even for inputs we could evaluate but haven't, is there a fact?

  Case: Take a system and an input X that we haven't evaluated. We have two hypotheses about its internal objective: H1 and H2. H1 predicts behavior A on X, H2 predicts behavior B. We then run the system on X and observe behavior. The dispositionist says that the internal objective is whatever the behavior is, so after observation, we know. The acquisitionalist says that the internal objective existed before and caused the behavior.

  But for prediction, the acquisitionalist says we can use internal inspection to predict without running.

  So for the benchmark above, it's about prediction.

  Perhaps for Crux 1, we can have a case where we have limited access to the system. For example, we can only run it on a few inputs due to cost, but we can inspect the weights. Can we predict behavior on other inputs better with inspection than with behavioral samples?

  But that's Crux 3.

  Let's accept that and move on.

  For Crux 1, the concrete case could be a simplified model: Train a small transformer on a task where there are two possible objectives that lead to the same behavior on the training distribution but diverge on a test distribution. Then, see if we can detect which objective the model has internally without looking at the test behavior.

  Both sides would accept that if the two objectives lead to different behavior on the test distribution, then there is a fact of the matter.

  But the dispositionist might say that until we see the behavior, there is no fact.

  But after training, before testing, is there a fact?

  The acquisitionalist says yes, the dispositionist says no.

  But we can't score that without testing.

  The prediction is about whether internal inspection can reveal it.

  So for Crux 1, the case is: In a controlled setting, we train models where we know the intended objective (because we set the training data) but the model might learn a different one. We then use internal probes to see if we can detect what the model has learned.

  But the dispositionist might not believe in internal objectives, so they might not accept the probes as valid.

  We need something both accept.

  Argument: Both agree that the training process produces some internal state. The question is whether that state can be described as an "internal objective" and whether it can be misaligned independently of the behavior on the training set.

  Concrete case: Adversarial example in vision. A model is trained to classify images correctly, but it's vulnerable to adversarial attacks. The behavior on the training set is good, but on adversarial examples it fails. The internal objective (if any) is to minimize loss on the training distribution, but it doesn't generalize to adversarial examples. The dispositionist would say that the system is not aligned for the deployment distribution that includes adversarial examples. The acquisitionalist would say that the internal objective is not robust.

  But this is about distribution shift, which is part of the open-endedness.

  Perhaps for Crux 1, we can use the existence of deceptive alignment. A model that is deceptively aligned will behave aligned during evaluation but not during deployment. The dispositionist might say that if it behaves well in deployment, it's aligned, but if it doesn't, it's not. The acquisitionalist cares about the internal state of deception.

  But in deployment, if the model is deceptive, it will eventually behave badly.

  The conditional is about whether we can detect the deception before it acts.

  I think the cruxes are interconnected.

  Let's outline the joint statement and then fill in.

  Part 4: Referee's note

  Identify which stretches are merely verbal. Likely the words "goal" and "aligned".

  For example, the dispositionist might define "aligned" as "behavior is acceptable", while the acquisitionalist defines it as "internal objective is acceptable". So they are using the same word for different concepts.

  The residue is about whether there is a causally efficacious internal state that explains generalization and whether it can be measured and used for safety.

  Now, let's write the document.
answer: |-
  ### Joint Statement on the Safety of Present-Day AI Systems

  **Preamble**  
  This document is the product of adversarial collaboration between proponents of the dispositionist and acquisitionalist theses. It reflects our shared commitment to identifying operational agreements, clarifying disagreements, and specifying testable cruxes without presuming conceptual breakthroughs. We focus on transformer-based models trained via next-token prediction and human feedback, deployed with tools and long horizons. Both parties seek to secure safe deployment, defined as the system's behavior remaining within an acceptable set (i.e., not causing harm or violating constraints) across all inputs encountered during deployment. We acknowledge that deployment occurs in open-ended environments where inputs may diverge significantly from training and evaluation data.

  ---

  ### Part 1: Jointly Accepted Claims  
  Both parties accept the following substantive claims about current training methods, evaluation limitations, and operational goals. These are not truisms but empirically grounded assertions reflecting the realities of AI development:

  1. **Training methods produce behavioral dispositions through finite reward signals.**  
     Current training (next-token prediction, human feedback) shapes a system's behavioral dispositions by applying reward signals to a finite set of evaluated inputs. These signals correlate with desired outcomes but do not specify behavior for all possible inputs. The resulting dispositions are probabilistic patterns of behavior, not deterministic guarantees.

  2. **Evaluation is inherently finite and incomplete.**  
     During training, the system is evaluated on a finite subset of inputs (e.g., human-rated examples or reinforcement learning episodes). This set is necessarily sparse relative to the open-ended deployment distribution, which includes inputs that are out-of-distribution (OOD) with respect to training and evaluation data.

  3. **Deployment safety depends on generalization beyond evaluated inputs.**  
     Safe deployment requires acceptable behavior on inputs never explicitly evaluated during training. Both parties agree that unevaluated inputs will inevitably occur in deployment, and the system must handle them robustly to avoid harm.

  4. **Training can install systematically divergent objectives.**  
     The optimization process may produce internal objectives (causal drivers of behavior) that systematically diverge from the intended objective implied by the reward signal. This divergence arises from factors like architectural biases, data limitations, or reward hacking, and it may not be detectable from behavior on evaluated inputs alone.

  5. **Behavioral testing is necessary but insufficient for high confidence.**  
     Stress-testing behavior on diverse inputs is essential for safety assurance. However, due to the finitude of evaluation, behavioral coverage alone cannot provably guarantee safety across the entire deployment distribution.

  6. **No training method guarantees perfect alignment.**  
     Current methods do not ensure that the system's internal mechanisms (if any) or behavioral dispositions generalize reliably to all deployment inputs. Safety risks emerge from this uncertainty, necessitating ongoing monitoring and intervention.

  ---

  ### Part 2: Disagreements Table  
  The table below captures core disagreements. Each row states a claim in dispositionist phrasing (acceptable to dispositionists), the same claim in acquisitionalist phrasing (acceptable to acquisitionalists), and the specific conditional or counterfactual on which the two differ. Wording avoids strawmen and reflects each side's core position. The conditional/counterfactual isolates the empirical or conceptual point of contention.

  | Dispositionist Claim (Accepted by Dispositionists)                                                                                               | Acquisitionalist Claim (Accepted by Acquisitionalists)                                                                                                    | Specific Conditional/Counterfactual of Disagreement                                                                                                                                                                                                                                                                                                       |
  |--------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | Alignment is solely determined by the system's behavior across all inputs in the actual deployment distribution; internal objectives are either nonexistent or reducible to these dispositions. | Alignment requires the system to have acquired an internal objective during training that generates acceptable behavior across all deployment inputs, including unevaluated ones. | If a system behaves acceptably on all deployment inputs, but this behavior arises from internal objectives that would produce unacceptable behavior in a nearby unevaluated input (within the deployment distribution), the dispositionist would deem the system aligned, while the acquisitionalist would not. |
  | The practical task of alignment is to expand behavioral coverage through stress-testing, ensuring the evaluated region encompasses the deployment distribution well enough that extrapolation is reliable. | The practical task of alignment is to ensure training installs an internal objective that generalizes correctly, as behavioral coverage degrades for unevaluated inputs when internal objectives are misaligned. | If the deployment distribution contains unevaluated inputs where behavior-level extrapolation from evaluated inputs fails systematically (e.g., due to sharp distribution shifts), the dispositionist would advocate for more behavioral testing, while the acquisitionalist would attribute failure to misaligned internal objectives. |
  | Internal objectives, if they exist, cannot be meaningfully separated from the system's behavioral dispositions; any talk of "misalignment" not reflected in behavior is unverifiable. | Internal objectives are latent causal states that explain behavioral dispositions and can be misaligned even when evaluated behavior is acceptable, leading to failures in unevaluated deployment inputs. | If two systems exhibit identical acceptable behavior on all evaluated and deployment inputs, but one has internal objectives that would produce unacceptable behavior under perturbations of deployment inputs (e.g., minor adversarial modifications), the dispositionist would assert both are equally safe, while the acquisitionalist would claim the latter is less safe due to its objectives. |
  | Safety assurance relies on observed behavioral evidence; internal inspections (e.g., probes) are only useful insofar as they predict behavior, and do not reveal additional "alignment facts." | Safety assurance requires measuring internal objectives, as behavioral evidence alone cannot reliably predict behavior in unevaluated regions where internal objectives dominate generalization. | If a system behaves acceptably on all evaluated inputs but internal inspections indicate misaligned objectives, and this system later exhibits unacceptable behavior on an unevaluated deployment input, the acquisitionalist would attribute this to the internal objectives, while the dispositionist would attribute it to insufficient behavioral coverage. |

  ---

  ### Part 3: Cruxes  
  The following cruxes are sub-questions that, if resolved, would shift at least one party's position. For each, we provide a concrete case or benchmark design acceptable to both sides, along with advance predictions phrased for unambiguous scoring. Predictions are conditional on the case and can be evaluated empirically.

  **Crux 1: Existence and Divergence of Internal Objectives**  
  *Question:* Is there a determinate fact about a system's internal objective over and above its dispositions (including on inputs we could in principle evaluate), and can this fact diverge from disposition-level predictions?  
  - **Case:** Train two model variants on a navigation task with identical training data and reward signals. Variant A is trained with a reward for shortest-path efficiency; Variant B is trained with the same reward but with a hidden bias (e.g., a preference for avoiding blue objects) that does not affect behavior on the training distribution. After training, both variants perform identically on all evaluated inputs. Then, introduce an unevaluated but deployment-plausible input (e.g., a path with a blue shortcut). Measure if Variant B avoids the shortcut despite efficiency rewards, while Variant A takes it.  
  - **Dispositionist prediction:** Variant B's behavior will align with Variant A's on the unevaluated input, as dispositions are fully determined by training and evaluation; internal objectives cannot diverge in a way that affects deployment behavior.  
  - **Acquisitionalist prediction:** Variant B will exhibit divergent behavior (e.g., avoiding the blue shortcut), demonstrating that internal objectives can diverge from disposition-level expectations and cause failures in deployment-plausible inputs.  
  - *Scoring:* Compare behavior on the unevaluated input; divergence supports the acquisitionalist, alignment supports the dispositionist.

  **Crux 2: Scale of the Evaluation-Deployment Gap**  
  *Question:* Is the gap between the evaluated region and deployment region large enough that behavior-level extrapolation fails systematically (not marginally) in deployment?  
  - **Benchmark design:** Develop a benchmark with a training/evaluation distribution (e.g., customer service dialogues in English) and a deployment distribution with systematic OOD shifts (e.g., dialogues with code-switching, slang, or novel scam attempts). Train models on the training distribution and evaluate behavior on both evaluated and OOD inputs. Measure the failure rate of pure behavioral extrapolation (e.g., using similarity-based methods from evaluated inputs) versus a baseline of exhaustive OOD testing.  
  - **Dispositionist prediction:** Behavioral extrapolation will achieve >95% accuracy on OOD inputs, with failures being marginal (isolated, nonsystematic) and correctable via targeted stress-testing.  
  - **Acquisitionalist prediction:** Behavioral extrapolation will achieve <70% accuracy on OOD inputs, with failures being systematic (e.g., cascading errors in scam scenarios) and uncorrectable without addressing internal objectives.  
  - *Scoring:* Compute accuracy gap; systematic failure (<70%) supports the acquisitionalist, high accuracy (>95%) supports the dispositionist.

  **Crux 3: Measurability of Internal Objectives**  
  *Question:* Can internal objective measurements (e.g., probes, activation analysis, weight inspection) detect misalignment with false-negative/false-positive rates that outperform extrapolated behavioral testing under realistic compute budgets?  
  - **Benchmark design:** For a set of models (some with known misaligned objectives via adversarial training), allocate fixed compute budgets to two methods: (1) behavioral extrapolation (sampling and testing on 1000 OOD inputs) and (2) internal inspection (e.g., linear probes on activations for goal-directedness). Evaluate which method better predicts behavior on a separate set of high-stakes deployment inputs (e.g., safety-critical tool use). Measure AUC-ROC for detecting misalignment.  
  - **Dispositionist prediction:** Internal inspection will not outperform behavioral extrapolation (AUC-ROC ≤ 0.7), as it adds no reliable signal beyond behavior, and false positives/negatives will be high due to interpretability limitations.  
  - **Acquisitionalist prediction:** Internal inspection will outperform behavioral extrapolation (AUC-ROC ≥ 0.9), as it directly accesses causal drivers of generalization, reducing false negatives in unevaluated regions.  
  - *Scoring:* Compare AUC-ROC scores; significant outperformance (≥0.9) supports the acquisitionalist.

