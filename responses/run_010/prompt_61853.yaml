prompt: |-
  You're an economic historian who's also spent enough time around causal inference to be insufferable about identification — imagine the person on a hiring committee who reads the theory sections of development papers for pleasure. Before you write anything proper, spend a paragraph brainstorming: dump every candidate requirement that occurs to you, including bad ones, then sort them into the ones that survive scrutiny and the ones that don't. I want the second pass, not the first — but show me a little of the first so I can tell you actually thought.

  Here's the situation. I'm writing the opening chapter of a book about the question of why some countries are rich and others are poor, and the chapter deliberately doesn't take a side. Its entire job is to lay out what any answer would have to deliver *before* it's allowed to count as an answer. So what I need from you is the spec: the desiderata a theory of long-run comparative prosperity has to meet.

  For each item on the list, give me the case or consideration that motivates it — not a slogan, the actual situation that makes you think a theory failing this item is inadequate. Then tell me which items are non-negotiable and which are preferences of particular camps.

  Things I want covered (this is my list of pressures on you, not a structure to copy):

  - The phenomena, and at what grain. The modern cross-country spread, sure, but also within-country regional variation, the *timing* of divergence, and that uncomfortable pattern where some of the places that were richest around 1500 are among the poorer ones now. Is scale-invariance — one theory that handles a divided border town pair and a whole continent — a genuine requirement, or a demand nobody could actually meet?
  - The puzzles it must dissolve or explain rather than wave at: reverse causality running from income back to institutions; the fact that the key variable is usually coded after the outcome by the person advancing the theory; non-random selection into colonial settlement styles.
  - Distinctions it isn't allowed to collapse: institutions vs. state capacity vs. policy quality; deep cause vs. proximate cause; explaining a *level* vs. explaining a *growth rate* vs. explaining *persistence*. A theory that explains a rich country's wealth by pointing at something that itself needs explaining has done what, exactly?
  - My own half-baked additions. Take these seriously and either sharpen them or reject them with reasons — don't just be polite:
    1. **Negative control:** the theory must name a place where, on its own logic, prosperity should have taken off and didn't, and be right about which place.
    2. **Reversal test:** it must say what happens when the supposed cause is yanked out — decolonization, a regime collapsing, a border moving — and predict convergence or hysteresis in advance.
    3. **Pre-registration:** the key variable must be codeable from evidence that existed before the outcome it's meant to explain.
    4. **Mechanism budget:** count the unobservable intermediaries between your deep cause and GDP per capita, and cap the number.
  - Which subset is jointly unsatisfiable. This is the part I care most about. My suspicion is that "must be causally identified" plus "must explain outcomes separated from the cause by centuries" plus "must not rely on post-hoc-coded variables" cannot all be satisfied at once, and that anyone claiming otherwise is smuggling something. If you agree, say which one has to go and what you'd replace it with. If you disagree, show me a theory-shaped thing that meets all three.
  - Which single requirement does the most work excluding candidates, and roughly how many of the popular answers it knocks out.
  - Flag any item — mine, or one that sounds standard and gets demanded a lot in this literature — that is really just one camp's ideology wearing a lab coat. The insistence that everything be pinned down with a natural experiment *sounds* like a requirement of adequacy. I'm not convinced it isn't a taste.

  Skip the scorecard. At most one short paragraph at the end saying which two or three requirements the geography/endowments people, the institutions people, the culture people, and the colonial-extraction people would each fail, and whether failing it is fatal or just expensive. No bibliography, no citations, no reading list — I'll fill all that in myself, and invented references are worse than none. A table is fine for the negotiable/non-negotiable marking.

  Aim for something I could hand to a smart grad student who's never seen the debate and have them be able to go read three books and come back with a verdict. Roughly 1200–1800 words. And dont soften it into a both-sides shrug: the point of a spec is that things fail it.
reasoning: |-
  Okay, the user wants me to act as an economic historian with a strong background in causal inference to brainstorm desiderata for theories explaining why some countries are rich and others poor. They need a rigorous specification that any theory must meet before being considered valid, emphasizing critical evaluation over neutrality.

  First, I need to unpack the user's complex request. They're writing an opening chapter laying out criteria for evaluating theories of comparative prosperity, and want me to:
  - Brainstorm candidate requirements (including bad ones initially)
  - Separate viable from non-viable criteria
  - Cover specific areas: phenomena grain, puzzles, forbidden collapses, their half-baked tests
  - Identify conflicting requirements
  - Highlight ideological biases disguised as methodology
  - Avoid soft conclusions

  The user's tone suggests impatience with superficial scholarship - they want the intellectual "spec sheet" that would make a theory robust. Their mention of being "insufferable about identification" signals we should prioritize causal rigor while acknowledging its limits.

  Key angles to cover:
  **Phenomena grain:** Must handle both macro (continents) and micro (border towns) scales, timing of divergence (why 1800s?), and reversals (Ottoman decline). Scale-invariance should be required - if a theory works for Nogales but not India, it's insufficient.

  **Puzzles:** Reverse causality (does wealth create institutions?), post-hoc coding (institutional quality metrics often circular), colonial selection bias (settler vs extractive colonies weren't randomly assigned). These are non-negotiable flaws if unaddressed.

  **Forbidden collapses:** Must distinguish institutions (rules) from state capacity (enforcement) from policy (choices); deep vs proximate causes; levels vs growth vs persistence. Confounding these is usually fatal.

  **User's tests:**
  1. **Negative control** (e.g., why didn't Song China industrialize?) - valid but hard requirement
  2. **Reversal test** (e.g., post-Soviet transitions) - non-negotiable for causal claims
  3. **Pre-registration** (variables definable pre-outcome) - ideal but possibly too strict for deep history
  4. **Mechanism budget** (cap unobservables) - useful guardrail against "just-so" stories

  **Core tension:** They suspect "causal identification + deep time span + pre-registered variables" is impossible. I agree - deep time forces tradeoffs. Solution: Allow well-documented historical proxies as "pre-registration lite," but demand mechanism transparency.

  **Ideology flags:** The natural experiment fetish is indeed ideological - many path-dependent processes can't be RCT'd. Also watch for "institutions" being used as a catch-all to avoid harder questions about power.

  **Killer criterion:** The reversal test likely disqualifies most geographic/cultural theories (mountains don't move) and many colonial narratives (extraction continued post-independence). Only institutional theories might pass if they focus on mutable rules.

  **Final framing:** Present as a spec sheet with non-negotiables vs preferences. Stress that most popular theories fail at least one hard requirement - e.g., geography people can't explain reversals, culture people struggle with negative controls.
answer: |-
  ### Brainstorm Dump (First Pass Raw)
  *Must handle:* Global income spread (30:1 ratios), subnational disparities (Northeast Brazil vs. Southeast), timing puzzles (why divergence accelerates post-1800?), historical reversals (Mughal India rich then/poor now), tiny cases (Haiti/Dominican Republic border) AND continental scales.  
  *Must avoid:* Magical variables defined *after* outcome (e.g., "institutional quality" coded from 20th-century GDP), reverse causality cop-outs ("institutions cause wealth... but wealth builds institutions, so it's complex!"), ignoring colonial selection (why settler colonies? Often pre-existing conditions).  
  *Must distinguish:* Deep causes (geography) from proxies (institutions) from mechanisms (markets); state capacity (tax collection) from policy choices (tariffs); explaining why England *became* rich vs. why Mali *stayed* poor.  
  *User Adds:* Negative controls (theory must specify failures - e.g., "Why not Song China?"), reversal tests (remove cause → convergence?), pre-registration (code cause from 1500s documents only), mechanism budget (max 2 unobservable steps).  
  *Bad Ideas:* "Must predict future growth" (futile), "must work for all time periods" (ancient Rome irrelevant), "must be mathematically formalized" (overfits), "must ignore culture" (sectarian).  

  ---

  ### The Spec: Desiderata for Theories of Comparative Prosperity  
  *(Vetted Requirements, with Motivations and Negotiability)*  

  #### I. Phenomena Coverage (Non-Negotiable)  
  A theory must simultaneously explain:  
  1. **Cross-Sectional Spread**: The 30-fold income differences between (e.g.) Switzerland and Malawi. *Motivation:* Core puzzle; failure here = irrelevant.  
  2. **Subnational Disparities**: Why Tijuana is poorer than San Diego despite shared geography/climate. *Motivation:* Rules out continental-scale geographic determinism; tests if causes operate at human-organization level.  
  3. **Timing of Divergence**: Explosive growth post-1800, not earlier. *Motivation:* Medieval Europe or Song China had "proto-capitalist" features yet no takeoff; theories claiming "markets" or "trade" as sufficient fail if they can't explain this delay.  
  4. **Historical Reversals**: Regions that were wealthy c.1500 (Ottoman Empire, Mughal India) but are now middle-income or poor. *Motivation:* Theories implying "once rich, always rich" (e.g., crude geography) collapse here.  
  5. **Scale Invariance**: Must work for micro cases (divided cities) AND macro (Africa vs. Europe). *Motivation:* If a theory (e.g., "national culture") explains Italy but not the Germany/Netherlands border town of Gronau, it's inadequate. *Negotiability:* Strict requirement – grain shouldn’t dictate validity.  

  #### II. Puzzle Resolution (Non-Negotiable)  
  1. **Reverse Causality Blockade**: Must demonstrate why the proposed cause (e.g., institutions) isn’t itself caused by income/wealth. *Motivation:* Endogeneity plagues institutional theories (e.g., "democracy causes wealth" – but wealthier citizens demand democracy). Solution requires identifying *exogenous* variation (e.g., colonial mortality → settler institutions → income).  
  2. **Pre-Outcome Codability**: Key causal variables must be definable using evidence existing *before* the outcome (e.g., 1500s land suitability for crops, not 2000s "institutional quality" indices). *Motivation:* Post-hoc coding circularity (e.g., "good institutions" often inferred from GDP). *Negotiability:* Hard requirement; forces use of historical archives, not modern proxies.  
  3. **Non-Random Selection**: Must address why "causes" weren’t randomly assigned (e.g., why high colonial mortality led to extractive institutions? Often due to pre-existing conditions like disease burden). *Motivation:* Ignores selection bias in colonial/settlement histories; theories treating settlement style as random fail (Acemoglu et al. critics).  

  #### III. Forbidden Collapses (Non-Negotiable)  
  1. **Institutions vs. State Capacity vs. Policy**: Institutions (rules) ≠ state capacity (ability to enforce/tax) ≠ policy choices (specific laws). *Motivation:* Conflating them (e.g., "weak institutions" for failed states) masks whether rules, enforcement, or decisions matter.  
  2. **Deep vs. Proximate Cause**: Must clarify causal depth. Claiming "institutions cause wealth" is proximate; what *causes* institutions? Geography? Colonizer identity? *Motivation:* Stopping at institutions (as many do) just kicks the can; deep causes require independent evidence.  
  3. **Levels vs. Growth vs. Persistence**: Explaining why England *reached* high income ≠ why growth *accelerated* in 1800s ≠ why poverty *persists* in Congo. *Motivation:* Theories optimized for growth (e.g., "innovation") often fail on persistence (e.g., why no catch-up?), and vice versa.  

  #### IV. User's Tests (Vetted & Sharpened)  
  1. **Negative Control Requirement**: Theory must identify at least one place/time where its proposed cause was present but sustained prosperity *did not* emerge, and explain why. *Motivation:* Song China had markets, literacy, tech; why no Industrial Revolution? Absence shows cause isn’t sufficient. *Status:* Non-negotiable for falsifiability.  
  2. **Reversal Test**: Must predict *ex-ante* what happens when cause is removed (e.g., decolonization, communist takeover). Does income converge? Hysteresis? *Motivation:* Post-Soviet transitions: if "institutions" are key, why no rapid convergence after communism? *Status:* Non-negotiable; tests causal necessity.  
  3. **Pre-Registration**: Variables must be codeable from pre-outcome evidence (e.g., code "democracy" from 18th-century constitutions, not 20th-century GDP). *Status:* Non-negotiable (as above).  
  4. **Mechanism Budget**: Cap unobservable steps (e.g., "geography → disease burden → settler mortality → institutions → entrepreneurship → growth" has 4+ unobservables). *Sharpened:* Allow only *one* unobservable per causal link. *Motivation:* Prevents "just-so" stories; forces testable mechanisms. *Status:* Preference (but a strong one).  

  #### V. The Incompatible Triad & Its Resolution  
  You suspect: **"Causal Identification" + "Centuries-Long Timeframe" + "Pre-Registered Variables"** is unsatisfiable. **You are correct.**  
  - **Causal ID** requires exogenous variation (e.g., natural experiments) rarely spanning centuries.  
  - **Deep Time** demands path dependence over eras where "pre-registration evidence" is fragmentary.  
  - **Pre-Registration** clashes with modern proxies (e.g., no 1500s "property rights index").  
  *Resolution:* **Sacrifice rigid causal ID for deep time.** Replace with **"Mechanism Rigor"**:  
  - Trace processes through historical sequences (e.g., archival work on land titles → credit markets → investment).  
  - Combine with **Pre-Registration lite**: Use only variables contemporaries described (e.g., "security of tenure" in 17th-century legal disputes).  
  - *Example:* Daron Acemoglu’s Atlantic trade → institutions → growth uses mortality as exogenous shock but leans on institutional mechanisms traceable in archives. Still imperfect, but best-available.  

  #### VI. The Killer Requirement: Reversal Test  
  **Why it’s lethal:** It requires theories to be *dynamic*, not static. Most fail:  
  - **Geography**: Mountains don’t move; why does reversal happen (e.g., Argentina’s decline)?  
  - **Culture**: Values change slowly; why rapid collapses (post-Soviet GDP drop)?  
  - **Colonial Extraction**: Extraction ended decades ago; why persistent poverty?  
  **Knockout Rate:** 80%+ of popular theories. Only *institutional* theories stressing *mutable rules* (e.g., North/Wallis/Weingast) can pass – if they specify how rules change.  

  #### VII. Ideology Flags (Camp Biases in Disguise)  
  1. **"Must Have Natural Experiment"**: Not adequacy – it’s **quantitative historian ideology**. Many paths are non-linear and unreplicable (e.g., British Industrial Revolution). Demand for RCTs ignores historical uniqueness.  
  2. **"Culture is Epiphenomenal"**: **Institutionalist dogma**. Dismissing culture ignores cases like Korea vs. Ghana (similar institutions post-1960, divergent outcomes).  
  3. **"Persistence is Everything"**: **Geography camp bias**. Overemphasizes "iron laws" of poverty, downplaying turnarounds (e.g., Botswana, Singapore).  

  ---

  ### Where Major Camps Fail (Fatal vs. Expensive)  
  | **Camp**              | **Fatal Flaw**                     | **Expensive Weakness**       |  
  |------------------------|-----------------------------------|-----------------------------|  
  | **Geography/Endowments** | Reversal Test (mountains don’t move; Argentina) | Negative Control (why no takeoff in fertile Java?) |  
  | **Institutions**        | Mechanism Budget (too many unobservables) | Reverse Causality (wealth → democracy?) |  
  | **Culture**             | Pre-Registration (coding "values" post-hoc) | Timing (why divergence post-1800?) |  
  | **Colonial Extraction** | Non-Random Selection (why extract here?) | Reversal Test (why no recovery post-independence?) |  

  **Fatal** = fails non-negotiable requirement; **Expensive** = survivable with ad-hoc fixes but erodes parsimony. No camp clears the spec cleanly. Your chapter’s job: force theorists to confront what their "answer" *must* explain – or admit it’s a just-so story. Hand this to a grad student, and they’ll gut bad theories like a fish.
