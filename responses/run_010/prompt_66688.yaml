  We are creating an exam question, model answer, and marking scheme for an internal module on deflationary theories of truth. The context is a system called ClaimStore with a boolean `verified` flag and an invariant (the disquotation invariant) that `verified(r)` is TRUE if and only if the sentence in `text(r)` holds. The downstream uses are:

  1. A roll-up rule: every row with `verified` TRUE is true (and this applies to all rows, including future ones).
  2. An endorsement service that uses the flag to attribute truth without reading the text.
  3. An accountability rule: acting on unflagged rows is a process violation, and acting on flagged rows that turn out false leads to personal accountability.

  There's also a row (4471) that causes a paradox because its text says its own `verified` is FALSE. The fix was to ban certain strings in the text.

  The exam question should have three parts (totaling 20 marks) and be answerable without philosophy jargon. The model answer should be about 750 words and at a level achievable by a top student in 90 minutes. The marking scheme should focus on moves and common mistakes.

  We are also asked about two framing issues:
  - Whether the norm in use 3 is a problem for deflationism or something they accept.
  - Whether the validation rule (banning self-referential strings) undercuts the generalizing power of the flag.

  After addressing these, we'll design the question.

  **Framing Issues:**

  1. **The norm in use 3:** Deflationism about truth holds that the truth predicate is a device for disquotation and generalization (e.g., "Everything the sensor asserted yesterday is true" avoids listing all assertions). The accountability rule attaches a norm: if you set the flag and it's wrong, you are held accountable. Deflationism does not deny that we have norms for asserting truths. In fact, deflationists can accept that we have practices of accountability for assertions. The key point is that the truth predicate itself does not add a substantive property; it just allows us to express generalizations. The norm is attached to the act of setting the flag, which is an act of assertion. So, the norm is about assertion, not about truth per se. Therefore, use 3 does not contradict deflationism; it is consistent with it. The design doc says the flag "carries a norm", but that norm is part of the institutional practice, not part of the meaning of truth. So, part two of the question should not present use 3 as a challenge to deflationism. Instead, it might be used to show that the flag is not just a redundant marker.

  2. **The validation rule:** The fix for row 4471 (banning strings like "verified", "true", etc.) avoids the paradox by restricting the sentences that can be stored. This means that the disquotation invariant now only applies to a subset of sentences (those that don't contain the forbidden strings). The roll-up rule still runs and still says that every row in the verified set is true. But note: the roll-up rule is a generalization over all rows, including future ones, but now the rows are restricted. However, the invariant is still defined for every row that exists (with the banned strings excluded). The problem is that the generalization made by the roll-up rule is now limited to non-self-referential sentences. But the deflationist can still use the truth predicate for generalizing over this restricted set. The cost is that we cannot express some generalizations (like "all claims made by source X are true" if source X might make a claim containing "verified"). Also, the system now cannot handle certain kinds of sentences. This restriction is a cost because it limits the expressive power of the system. But note: the deflationist must avoid paradoxes, so they might accept such restrictions. However, the cost is that the system is less expressive. This cost is not peculiar to deflationism; any account of truth must avoid paradoxes (like the liar paradox). So, the cost (restriction of expressiveness) is a general one, but the way it was fixed (by banning certain strings) is a bit crude and might be avoidable by other means (like a more sophisticated logic). The question is whether the generalizing power is undercut: in a way, yes, because the system now cannot represent some claims that we might want to represent. But the roll-up rule still generalizes over the entire verified set (which now excludes problematic rows). So the generalization still works for the allowed sentences. The cost is that we lost the ability to handle self-referential claims (and perhaps others) and express generalizations that would include such claims.

  **Designing the Question:**

  We are to have three parts:

  1. **What the flag adds to `text` given the invariant is the whole story?** (6 marks)
     - The invariant says the flag is set iff the sentence holds. But the `text` already has the sentence. So what does the flag add? The flag allows for generalization (like the roll-up rule) and for attributing truth without repeating the content (endorsement service). It also serves as a marker for accountability.

  2. **Whether uses 1-3 show that truth is substantive or are what a deflationist expects?** (8 marks)
     - We now know that use 3 is consistent with deflationism. So the answer should be that these uses are exactly what a deflationist expects: the flag (truth predicate) is a device for generalization and disquotation.

  3. **What the validation rule cost us and whether the cost is peculiar to deflationism?** (6 marks)
     - The cost is that we cannot store some sentences (like self-referential ones) and thus cannot use the system for those. This cost falls on any account of truth because any account must avoid paradoxes. We also want a constructive move: propose and defend one change to the spec.

  Reword the parts to be clear and exam-like.

  **Question Draft:**

  **Exam Question (90 minutes; total 20 marks)**

  **Part A (6 marks):** The design document states that the disquotation invariant is the whole story about the `verified` flag: for each row, the flag is TRUE if and only if the sentence in the `text` column holds. Given that the `text` column already stores the sentence, what does the `verified` flag add to the system? Explain with reference to the three downstream uses.

  **Part B (8 marks):** Do the three downstream uses (the roll-up rule, the endorsement service, and the accountability rule) show that the `verified` flag represents a substantive property of claims (one with an underlying nature that explains why some claims are verified and others are not)? Or are these uses exactly what one should expect if the deflationary theory of truth is correct? Support your answer by analyzing each use.

  **Part C (6 marks):** The validation rule (which bans certain strings in the `text` column) was introduced to avoid the problem with row 4471. What does this rule cost us in terms of the system's capabilities? In particular, does it undercut the generalizing power of the roll-up rule? Is this cost peculiar to the disquotational picture, or would any account of truth face a similar challenge? Additionally, propose and defend one change to the system specification that might address the problem in a better way.

  **Model Answer (approx. 750 words):**

  **Part A:** The `verified` flag adds crucial functionality despite the invariant seemingly making it redundant. The `text` column stores individual sentences, but the flag allows us to generalize over multiple claims without having to list them. This is evident in the roll-up rule (use 1), which states that every verified row is true. Without the flag, we could not make such a general statement about all verified rows, especially future ones. The endorsement service (use 2) uses the flag to attribute truth without accessing the `text` content. This is efficient and allows for statements like "whatever the sensor asserted yesterday is true" without knowing each sentence. The accountability rule (use 3) uses the flag to mark which claims are backed by the team. The flag thus serves as a marker for institutional action: setting it is an assertion that the claim is true, and hence the setter is accountable if it is false. Without the flag, we would have to store and process the entire text to determine accountability, which would be inefficient. The flag, therefore, adds the ability to generalize, to attribute truth indirectly, and to attach institutional norms to claims.

  **Part B:** These uses are exactly what a deflationary theory of truth would predict. Deflationism holds that truth is not a substantive property but a device for disquotation and generalization. The roll-up rule (use 1) is a generalization: it allows us to say in one statement what would otherwise require an infinite list. The endorsement service (use 2) uses the truth predicate to endorse an entire set of claims without restating them, which is the core function of truth according to deflationism. The accountability rule (use 3) attaches a norm to the act of setting the flag. Deflationism does not deny that we have norms for assertion; in fact, it is consistent with the idea that asserting a claim (and marking it as true) carries responsibility. The flag is not representing a deep property; it is a tool that enables these linguistic and institutional practices. Therefore, the uses do not show that truth is substantive; they are precisely the kind of uses that a deflationist would point to as the raison d'être of the truth predicate.

  **Part C:** The validation rule costs us expressiveness: we can no longer store claims that contain the banned strings (like "verified", "true", "claim_id"). This means we cannot use the system for claims that refer to the system itself, such as self-referential claims. The roll-up rule's generalizing power is not entirely undercut because it still applies to the entire verified set of the restricted claims. However, we can no longer make generalizations that would include self-referential claims, and we cannot represent such claims at all. This cost is not peculiar to the disquotational picture. Any account of truth must avoid paradoxes like the one in row 4471. Therefore, any system aiming to represent truth would face similar challenges and might require restrictions. One change to the specification could be to use a hierarchy of languages (like Tarski's) where the `text` in a row cannot refer to the `verified` flag of a row at the same or higher level. This would allow self-referential claims in a controlled way without a blanket ban. We could assign levels to rows and adjust the invariant to account for levels. This change would restore some expressiveness while avoiding the paradox. However, it adds complexity to the system.

  **Marking Scheme (Total 20 marks):**

  **General Principles:**
  - No marks for citing sources or philosophers. Only the ideas matter.
  - Misattributing a view is not penalized; we care about the reasoning.

  **Part A (6 marks):**
  - **6 (Excellent):** Clearly explains that the flag enables generalization (roll-up), indirect attribution (endorsement), and institutional norms (accountability), and that without the flag, these would be impossible or inefficient. Shows understanding that the invariant defines the flag but the flag is a tool for these functions.
  - **4-5 (Good):** Identifies two or three uses but with less clarity or depth. Might miss why the invariant alone is insufficient for these uses.
  - **3 (Adequate):** Mentions at least two uses but without explaining why the flag is necessary (e.g., says the flag is just a marker without linking to generalization).
  - **0-2 (Poor):** Misses the point, e.g., says the flag adds nothing because of the invariant, or only repeats the invariant.

  **Common Mistake for Part A:** 
  - **Mistake:** Claiming the flag is redundant and should be deleted because the invariant already tells us the condition. 
  - **Forfeits:** Up to 6 marks. This misses the functional role of the flag in generalization and norms.

  **Part B (8 marks):**
  - **8 (Excellent):** Argues clearly that the uses are what deflationism expects: roll-up for generalization, endorsement for indirect attribution, and accountability for norms of assertion (without attributing substantive property). Analyzes each use and shows that none requires a substantive property.
  - **6-7 (Good):** Correct conclusion and covers all three uses, but with less precision or depth, or minor confusion about the accountability norm.
  - **4-5 (Adequate):** Covers two uses well, or all three but with a significant misunderstanding (e.g., thinking accountability shows truth is substantive).
  - **0-3 (Poor):** Concludes truth is substantive without proper analysis, or misreads deflationism as relativism, or only addresses one use.

  **Common Mistakes for Part B:**
  - **Mistake 1:** Collapsing deflationism into relativism (e.g., "truth is whatever the team decides") and then arguing that accountability is consistent with that. 
    - **Forfeits:** Up to 8 marks. This misrepresents deflationism, which is about the function of truth, not about relativism.
  - **Mistake 2:** Treating the flag as a mere expression of approval (like a compliment) and thus not capturing that the endorsement service repeats content without restating it. 
    - **Forfeits:** 2-4 marks (for misanalyzing endorsement). 
  - **Mistake 3:** Taking the accountability rule as showing that truth is substantive because it carries a norm. 
    - **Forfeits:** 2-4 marks (for the accountability part) because the norm is about assertion, not truth.

  **Part C (6 marks):**
  - **6 (Excellent):** Correctly identifies the cost as loss of expressiveness (can't handle self-referential claims) and explains that the roll-up rule still works for the restricted set but cannot cover the banned claims. States that the cost (need to restrict to avoid paradox) is general to any truth system. Proposes a change (e.g., hierarchical levels) and defends it as restoring some expressiveness without a blanket ban.
  - **4-5 (Good):** Identifies the cost and that it is general, but does not fully address the roll-up rule's power or the change proposal is weak.
  - **3 (Adequate):** States the cost but is vague on the generalization or the change proposal, or does not address the generality of the cost.
  - **0-2 (Poor):** Misses the cost entirely, or says the fix had no cost, or the change proposal is irrelevant.

  **Common Mistake for Part C:**
  - **Mistake:** Declaring row 4471 meaningless and moving on without addressing what the restriction does to the invariant and roll-up rule. 
    - **Forfeits:** Up to 6 marks. This misses the cost of the validation rule.
  - **Another Mistake:** Claiming the cost is only for deflationism. 
    - **Forfeits:** 1-2 marks for that part.

  **Final Answer:**
  Here is the complete package as requested.
answer: |-
  ### Exam Question: Assertions, Flags, and Fact-Checking  
  **Total Time:** 90 minutes  
  **Total Marks:** 20  

  ---

  #### **Part A (6 marks)**  
  The `verified` flag in ClaimStore is defined solely by the disquotation invariant: `verified(r)` is TRUE if and only if the sentence in `text(r)` holds. Since `text(r)` already stores the declarative sentence, what practical function does the `verified` flag add to the system? Explain using all three downstream uses (roll-up rule, endorsement service, accountability rule).  

  #### **Part B (8 marks)**  
  The three downstream uses might suggest the flag represents a "substantive property" (a deep feature that explains why some claims are verified and others are not). Alternatively, they might align with a deflationary view where truth is not substantive but serves a practical role. Do uses 1–3 support the substantive property view, or are they exactly what a deflationary theory would predict? Justify your answer by analyzing each use.  

  #### **Part C (6 marks)**  
  The validation rule (banning strings like "verified", "true", or "claim_id" in `text`) fixed the row 4471 problem but restricted the system. What capability did we lose? Does this loss undermine the roll-up rule’s ability to generalize over future rows? Is this loss unavoidable for any system using a truth-like flag, or is it unique to the disquotational approach? Propose and defend one change to the ClaimStore specification to address this problem better.  

  ---

  ### Model Answer (Approx. 750 words)  
  **Part A**  
  The `verified` flag adds critical functionality despite seeming redundant next to `text`. The disquotation invariant defines *when* the flag should be set, but the flag itself enables three key operations:  
  - **Roll-up rule (generalization):** The invariant only applies row-by-row. The flag allows a single rule ("all verified rows are true") to cover an unbounded set of claims, including future rows. Without the flag, we couldn’t state this rule—we’d need an ever-growing list of specific claims.  
  - **Endorsement service (attribution without content):** The service logs "whatever the sensor asserted yesterday is true" without parsing `text`. The flag acts as a stand-in for the claim’s content, enabling truth attribution without restating sentences. If we removed the flag, the service would need to store and process each `text` value, which is inefficient and often impossible (e.g., for high-volume data).  
  - **Accountability rule (norm enforcement):** The flag marks which claims the team has staked its reputation on. Acting on unflagged rows violates process because they lack this marker. Without the flag, accountability would require re-evaluating `text` for every action, losing the distinction between vetted and unvetted claims.  
  In short, the flag enables generalization, indirect reference, and institutional norms—functions `text` alone can’t provide.  

  **Part B**  
  The downstream uses align perfectly with deflationism and do *not* show truth is substantive. Deflationism treats truth as a tool for practical tasks like generalization and attribution, not a deep property:  
  - **Roll-up rule (use 1):** This is exactly what deflationism predicts. The rule generalizes over infinite claims using the flag as a device—avoiding a list of "claim X is true, claim Y is true..." for each row. No underlying "nature" of truth is needed; the flag is a shorthand for reasserting all `text` values.  
  - **Endorsement service (use 2):** Deflationism explains this use directly. The service relies on the flag to endorse claims without accessing their content (e.g., "everything the sensor said is true"). This isn’t about a substantive property; it’s about efficient repetition. If truth were substantive, we’d expect the service to analyze *why* claims are true (e.g., their correspondence to facts), but it never does.  
  - **Accountability rule (use 3):** This fits deflationism because the norm attaches to the *act of flag-setting*, not truth itself. The disquotation invariant ensures the flag matches the claim’s status, but the accountability rule is a human practice: we punish carelessness in flag-setting, not some mystical "essence" of truth. Deflationism happily accepts that we use truth pragmatically (e.g., to enforce honesty).  
  Thus, all three uses are deflationary: they show truth as a linguistic tool, not a substantive property.  

  **Part C**  
  The validation rule costs us **expressive power**: we can no longer store claims containing "verified", "true", or "claim_id", like self-referential claims (e.g., "This claim’s flag is false"). This undermines the roll-up rule’s *universal* generalizing power because it no longer applies to *all possible claims*—it’s restricted to "safe" sentences. For example, a true claim like "The term ‘verified’ appears in this text" is now banned, so the roll-up rule can’t cover it even if correct.  
  This loss is **not peculiar to the disquotational approach**. Any system using a truth-like flag must avoid paradoxes (e.g., row 4471), which require restricting self-reference. Even a "substantive" truth theory (e.g., one where truth means correspondence to reality) would face the liar paradox and need similar fixes.  
  **Proposed change:** Modify the invariant to handle levels. Assign each claim a "level" (e.g., 0 for basic claims, 1 for claims about flags). The invariant becomes: "`verified(r)` is TRUE iff the sentence in `text(r)` holds, *and `text(r)` only references flags of claims at lower levels*."  
  **Defense:** This avoids row 4471 (which would need to reference its own flag, requiring an impossible higher level) but allows more expressiveness than a string ban. For example, a claim like "Row 100’s flag is true" is allowed if row 100 is at level 0 and this claim is at level 1. The roll-up rule retains broader generalization since it covers all levels. This is cleaner than arbitrary string bans and aligns with how paradoxes are handled in logic.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **General Principles:**  
  - No marks for citing philosophers/isms. Focus on reasoning from the artifact.  
  - Misattributing a theory (e.g., "Deflationism says X") is **not penalized**; we assess your logic, not labels.  

  #### **Part A (6 marks)**  
  - **A-grade (5–6 marks):** Explicitly links the flag to all three uses (generalization for roll-up, indirect reference for endorsement, norm-marking for accountability) and explains why `text` alone is insufficient for each.  
  - **B-grade (3–4 marks):** Identifies 2–3 uses but with weak explanations (e.g., "the flag helps the roll-up rule" without explaining generalization).  
  - **C-grade (1–2 marks):** Only describes one use superficially or claims the flag adds nothing.  
  - **Common Mistake:**  
    - **Error:** "The flag is redundant because the invariant defines it; delete it to save space."  
    - **Forfeits:** 4+ marks. Misses that the flag enables generalization (roll-up) and attribution (endorsement) beyond row-level checks. Ignores institutional norms (accountability).  

  #### **Part B (8 marks)**  
  - **A-grade (7–8 marks):** Argues all three uses fit deflationism by showing: (1) roll-up needs generalization, not substance; (2) endorsement uses truth for attribution, not analysis; (3) accountability is a norm for *assertion*, not truth itself. No false challenges to deflationism.  
  - **B-grade (5–6 marks):** Correctly concludes deflationism fits but analyzes only 2 uses well (e.g., misses accountability) or wavers on substance (e.g., "accountability makes truth substantive").  
  - **C-grade (1–4 marks):** Claims truth is substantive without engaging uses, or conflates deflationism with unrelated views.  
  - **Common Mistakes:**  
    - **Error 1:** "Deflationism means truth is relative/whatever the team decides, so accountability is consistent."  
      - **Forfeits:** 3+ marks. Deflationism is about utility (generalization), not relativism.  
    - **Error 2:** "The flag is just a thumbs-up, like saying ‘good job!’—endorsement doesn’t need it."  
      - **Forfeits:** 2 marks (for endorsement). Misses that endorsement *attributes content without restatement* (e.g., "the sensor’s claim is true").  
    - **Error 3:** "Accountability proves truth is substantive because it has real-world consequences."  
      - **Forfeits:** 2 marks (for accountability). Confuses the *norm* (a human practice) with truth’s *semantics* (deflationism handles norms).  

  #### **Part C (6 marks)**  
  - **A-grade (5–6 marks):** Identifies lost expressive power (e.g., can’t handle self-reference), explains roll-up still generalizes but over a restricted set, notes the cost is universal (any truth system faces paradoxes), and proposes a plausible change (e.g., levels) with defense.  
  - **B-grade (3–4 marks):** Identifies the cost but doesn’t tie it to generalization, or proposes a weak change (e.g., "allow row 4471 with a special case") without defending it.  
  - **C-grade (1–2 marks):** Claims no cost or focuses only on row 4471 without system-wide implications.  
  - **Common Mistakes:**  
    - **Error 1:** "Row 4471 is meaningless, so banning it costs nothing; the roll-up rule is unchanged."  
      - **Forfeits:** 3+ marks. Fails to see the invariant is now restricted, so roll-up can’t cover all English claims.  
    - **Error 2:** "This cost only hurts deflationism because it relies on disquotation."  
      - **Forfeits:** 1–2 marks. All truth theories face liar-like paradoxes and need restrictions.  

  ---

  ### Response to Your Framing Questions  
  1. **Accountability rule (use 3) as an objection to deflationism:**  
     No, you have *not* misstated deflationism. The norm in use 3 is **consistent with deflationism**. Deflationists treat truth as a tool for practices like generalization and attribution—norms of assertion (e.g., "don’t flag false claims") are part of how we *use* the tool, not evidence of a substantive property. Your Part B is well-framed: if students argue accountability "proves" truth is substantive, they misunderstand deflationism (hence the penalty in the marking scheme).  

  2. **Validation rule’s cost to generalization:**  
     The rule **undercuts the roll-up rule’s generalizing power** in practice (it can’t cover all possible claims), but not in principle for allowed claims. This cost is **not peculiar to deflationism**. Any system with a truth-like flag must restrict self-reference to avoid paradoxes (e.g., Tarski’s hierarchy in correspondence theories). Deflationism can "shrug off" the *need* for restrictions but not the *cost* of losing expressiveness—this is universal. Your Part C correctly forces students to confront this trade-off.  

  ---  
  This package is self-contained: students need only the artifact and question text. No external sources are required or rewarded.
