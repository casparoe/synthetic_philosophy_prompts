  Right, the Bohmian character needs to make two key distinctions immediately: first, that the foliation's physical effects are detectable in principle through non-equilibrium deviations (even if practically impossible in our universe), unlike Everett's branches which are fundamentally inaccessible. Second, that the foliation is a necessary causal structure, not just bookkeeping, because without it the theory wouldn't produce definite outcomes at all. 

