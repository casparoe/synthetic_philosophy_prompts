answer: |-
  The foliation's physical reality is demonstrated by its causal role in producing definite measurement outcomes, which Everett's empty wavefunction branches cannot claim. While both theories posit empirically inaccessible structures, Bohmian mechanics ties its hidden elements to observable consequences through particle positions—actual records in spacetime—whereas Everett's branches remain causally inert. Unobservability here isn't evasion; it's a constraint of quantum equilibrium, not fundamental undetectability. If we could prepare non-equilibrium states, the foliation's temporal asymmetry would manifest in anomalous statistics—unlike Everett's branches, which offer no such in-principle test.  

  Your analogy fails because the foliation resolves ordering ambiguities in the guidance equation that *must* be resolved for a deterministic theory. Without it, the dynamics at spacelike separations would be undefined, violating locality in a detectable way. Everett evades this by denying definiteness altogether—but then cannot account for definite experiences without additional structure. Our foliation is no more "bookkeeping" than the metric in relativity: it physically mediates causal influences. If you demand observability for ontological commitment, explain how Everett's branches or your preferred alternative clears that bar without smuggling in unobserved structure.
