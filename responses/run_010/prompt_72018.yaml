  Noting they've already conceded quantum equilibrium arguments, so no need to rehash those. But must emphasize that the foliation isn't just conventional because it physically resolves the ordering ambiguity in the guidance equation. The comparison to gauge symmetry is apt - we don't say electromagnetic potentials are unreal just because they're gauge-dependent, provided they have measurable effects (like Aharonov-Bohm). 

