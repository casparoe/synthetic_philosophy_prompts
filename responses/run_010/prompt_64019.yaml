  ## The Names on the Note

  The first note came from the millstone. Old Man Ceddic broke his wrist shifting the grinding stone at Mill Creek, and the whole village knew what that meant come harvest. No grinding meant no flour, no bread, no winter porridge. So Aris, who knew stonework from his days quarrying down south, offered to set it right. "Can't pay coin," Ceddic rasped, his face pale with pain. "Grain's low, and what coin I had went for the doctor." Aris looked at the waiting stone, then at the faces gathered – Elara with her loom, Bren with his strong back, young Keth who was clever with levers. "We need it set," Aris said. "I'll set it. Pay me in notes."

  They'd talked about it for weeks, ever since Bren returned from visiting his cousin over the hills, full of tales about a village that paid with strips of paper signed by everyone who handled them. "Like passing on a promise," Bren had said. "The more names, the solider the promise." Aris had scoffed. "Solid? Paper? What backs it? Air and good intentions? My labour needs feeding, same as anyone." But the millstone couldn't wait. So Elara cut strips from a ledger's margin, and Ceddic, his good hand trembling, wrote on one side: "One Day's Skilled Stone Setting." On the back, he signed his name: *Ceddic Millwater*.

  Aris took the note, studied the single signature. "Feels light," he grunted, but he got to work. For three days he chipped and wedged and sweated, resetting the stone true. When he was done, he handed the note back to Ceddic. Ceddic signed again beneath his own name: *Settled by Labour*. Then Aris took it to Bren, who'd hauled water and stone chips. "For your back-work," Aris said. Bren signed: *Bren Hauler*. Aris then took it to Elara for a new shirt, the cloth woven from her own flax. She signed: *Elara Weaver*. Keth, who’d fetched tools, signed too: *Keth Turner*.

  The note grew heavier. Five names. It bought Aris two sacks of lentils from Marta, who signed it. Marta used it to pay Bren for mending her fence. Bren added his name again? No, Bren scratched out his first signature, wrote *Bren Fence-Mender* beneath Marta’s. The rule was clear: one signature per hand, per note, per cycle. Signing meant you’d accepted its value as labour performed. A fresh note felt tentative; one with a column of names felt substantial, proven. Each month, the notes were brought to the village council – Bren, Elara, Marta, Aris, and Keth’s father, Orin – and cancelled against work done for the common good: clearing the irrigation ditch, patching the meeting hall roof, stocking the shared woodpile. New notes were issued only for new, agreed-upon common needs.

  Aris watched it work, his skepticism a knot in his gut. He saw Keth use a note thick with ten names to get old Hesta to teach him herb-lore. He saw Bren accept a note with only three names for helping Orin re-thatch his shed, trusting it would gain weight. Work flowed. Things got done without coin changing hands. But Aris muttered to Orin, "It’s the *land*, Orin. The grain in Marta’s store, the wool on Elara’s sheep, the wood in Bren’s pile. That’s the real thing. These notes… they’re just smoke, pointing at the fire. If the fire goes out, the smoke’s worthless." Orin just shrugged. "The smoke keeps the work burning, Aris. Look around. More gets done now than when we hoarded our little bits of silver."

  Then Elara’s mother took ill down in Low Crossing. Elara needed to go, needed things for the journey, things for her mother. Fear, cold and sharp, pricked her. What if her mother needed costly medicine? What if the journey took longer? She looked at her small stash of notes. There was one, thick with signatures – fifteen names snaking down the back. It felt like security. Solid. She’d earned it mending nets for the whole fishing crew. She spent the newer notes, the ones with fewer names, for journey-bread and dried meat from Marta, for a borrowed mule from Bren. But the thick one, the heavy one… she folded it small and tucked it deep into her belt pouch. Just in case. That heavy note could command anything in the village. She’d keep it safe.

  Weeks passed. Elara was gone. The thick note was gone. Circulating notes suddenly seemed… thinner. Fewer signatures. Bren came to Aris. "Need your help raising a new beam in the barn. Pay you in notes?" Aris looked at the note Bren offered. Only four names. A week ago, Bren might have offered one with eight or nine. "Four names?" Aris frowned. "That beam’s tricky. Heavy. Needs skill. Four names feels scant for a day’s risky lift." Bren flushed. "It’s all I’ve got that’s not needed for seed." They haggled. Aris took the note, but grudgingly, and the work felt harder that day.

  Keth needed new boots. He took a note with five names to Old Cobbler Tam. Tam squinted at it. "Five? Hmph. Used to be you’d see sevens or eights for boots. Leather’s dearer now, Keth." Keth ended up promising an extra afternoon helping Tam scrape hides. Marta, selling cheese, found fewer people buying. Those who did seemed pickier, wanting more cheese for their notes. "This only has three names, Marta," Bren said once, holding up a note. "Last week, three names bought a full round." Marta tightened her lips. "Maybe last week, three names meant more work done behind them. Feels lighter now." Conversations grew shorter, tinged with a new wariness. The work on the shared irrigation ditch slowed; fewer people offered labour for the thinner-feeling common notes. The village felt… pinched. The work was still there, the land, the skills. But the thing that *set* the work in motion – the thick, trusted notes – was hoarded away in Elara’s belt.

  A tinker came. A wiry man with a pack full of pots and needles and bright ribbons, things the village rarely saw. He set up by the dried-up village fountain. "Good steel needles!" he called. "Ribbons for the lasses! Mended pots!" Eyes gleamed, especially Elara’s sister, Lissa, who craved a red ribbon. Bren needed a new hoe-blade fitted. Marta eyed a sturdy pot.

  The tinker wanted coin. "Silver bits, coppers. That’s what travels," he said, eyeing their paper strips with disdain. Bren offered a note. "This is good here. Three names already. You could buy bread, cheese, a night’s lodging with it."

  The tinker snorted. "Names? What’s a name to me? I don’t know your Ceddic or your Marta. Can’t eat a name. Can’t spend it down the road. Show me silver." They tried explaining the signatures, the work behind it. The tinker just shook his head. "Paper promises. Worthless to a wandering man. Got silver? No? Then I move on come morning." He packed up his ribbons, his needles. Disappointment hung heavy.

  Bren looked at the note in his hand. Three names: his own, Marta’s, Aris’s. Solid folk. Known work. But useless to the tinker. A name meant nothing without the shared knowing, the shared place. That night, the council gathered by the weak fire in the meeting hall, the tinker’s rejection sour in the air. Elara’s thick note was mentioned, its absence like a hole. "Holding it does no work," Bren said wearily. "It’s like a hammer locked in a chest. The house doesn’t get built."

  "She’s afraid," Marta said softly. "Afraid of needing it where names mean nothing."

  Aris stirred. He’d been quiet. "The tinker… he wasn’t wrong, entirely. Not about the names meaning nothing *to him*. But he was wrong about what backs it." He picked up a fresh note Elara had cut before she left. Blank on both sides. "This paper? Worthless. The names?" He pointed to a cancelled note pinned to the wall, thick with signatures. "They point to work done. Past work. Settled work. But the *real* backing…" He looked around at their faces, then out the window at the dark shapes of fields and houses. "It’s the work *to come*. It’s the fact that Bren *will* mend a fence, Marta *will* sell cheese, Keth *will* help scrape hides. The names are just… tickets. Tokens. They stand for the willingness. The *industry*." He spat the word like it was something tangible. "Hold the ticket, you stop the work. Spend it, you start it. That tinker… he doesn’t know our willingness. So our ticket’s no good to him. Doesn’t mean it’s not good here. Doesn’t mean the work isn’t real." He paused. "But Elara holding that thick note… it’s like she’s sitting on a shovel while the field lies unplowed. The willingness is here. The tool is locked away."

  A letter arrived from Elara. Her mother was recovering, slowly. She needed to stay longer. She sent back the thick note. *Use this*, she wrote. *For the village. For the ditch work*. The note felt heavier than ever, the fifteen names a testament to work woven, hauled, mended, built. Bren took it to Aris. "The big beam’s still waiting. Tricky lift."

  Aris took the note. He ran his thumb down the column of names, dense and varied, ending with Elara’s own signature before she left. He felt the weight of all that done work. He nodded. "Tomorrow at dawn. I’ll bring the ropes."

  The next morning, Bren, Aris, Orin, and Keth gathered at the barn. The new oak beam lay ready. The work was hard, muscles straining, ropes creaking. Aris directed, his voice sharp with focus. Slowly, surely, the beam rose and settled into place, strong and true. As Keth hammered the last peg, Bren pulled out the thick note. He handed it to Aris. Aris took it, then reached for the stub of charcoal in his pouch. Below Elara’s last signature, he carefully wrote: *Aris Mason. Beam Raised*. He handed it back to Bren. "Settled."

  Bren looked at the note. Sixteen names now. The first of a new cycle. He thought of the ditch, half-cleared. He thought of Lissa’s longing for a ribbon, of Marta’s pot. He thought of the work waiting. He walked towards Marta’s cottage, the note warm in his hand, the names on its back whispering of labour past and labour yet to come.

  ***

  **Berkeleyan Embodiment and Pressure Point:**

  *   **Aris** embodies Berkeley's insistence that money's value stems solely from its power to motivate future industry ("stirreth up industry"), not intrinsic worth. His skepticism highlights the community's reliance on tangible assets (land, goods), but his later realization about "work to come" reflects Berkeley's core principle. He presses on Berkeley by emphasizing the *necessity* of underlying real productive capacity; the notes fail if the communal "willingness" to work vanishes.
  *   **Elara** embodies the perils Berkeley associated with hoarding – treating money as an end (a "store of value") rather than a means to facilitate exchange and production. Her fear-driven hoarding demonstrates how removing currency from circulation ("dereliction") paralyzes industry, causing prices (in labour terms) to rise and community spirit to fray.
  *   **The Tinker** embodies Berkeley's observation that money's validity is often confined to a specific community or trust network ("altogether that of a ticket or counter"). His rejection underscores that the notes derive value solely from shared belief and reciprocal obligation within the village, exposing the limitation Berkeley doesn't fully address: how such purely relational currency interacts with outsiders who lack that shared context and trust (the "name problem"). The system struggles with portability beyond its immediate social sphere.
