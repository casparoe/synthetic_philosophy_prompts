prompt: |-
  Working through Aquinas on tyrannicide for my thesis chapter and the secondary literature has hit a wall I can't see through. Roughly: one camp says he has a perfectly consistent doctrine — the young Sentences remark about the man who frees his country by killing a tyrant is about someone acting with (or at least in the name of) the community against a ruler with no title at all, On Kingship distinguishes a tyrant by usurpation from a tyrant who has a title but rules oppressively, and the Summa's rule that killing belongs only to public authority fits right in, since tyrannicide would be a public act, not a private one. The other camp says the same texts show he never endorses killing a ruler at all: the Summa allows it only for public authority or by some special divine command, On Kingship warns that private attacks on rulers usually leave the people worse off with a worse ruler and tells you to wait for God when there's no human remedy, and the bit about disturbing a tyrannical regime not being sedition stops well short of lethal force — so the Sentences passage is a youthful borrowing from John of Salisbury that he quietly dropped.

  My hunch is that this isn't really a disagreement about what the texts say, since both sides quote the same ones at each other. So what is it — a fight over what "permits" means for a writer who never addresses the case head-on, over which genre or which period counts as his considered view, or a hidden conceptual gap nobody has noticed, like what "public authority" even is once the ruler is the tyrant? Diagnose it rather than take a side, and tell me what would count as progress and whether I should expect any. End with a last line in exactly this form: Diagnosis: {one short label}.
reasoning: |-
  Okay, the user is working on their thesis chapter about Aquinas and tyrannicide. They're stuck between two opposing interpretations in the secondary literature. One camp argues Aquinas has a consistent doctrine allowing tyrannicide under specific conditions—public authority acting against a usurper. The other camp insists Aquinas never endorses killing a ruler, emphasizing divine remedy and public authority constraints. 

  Hmm, both sides use the same texts but interpret them differently. The user suspects it's not about the texts themselves but deeper issues. Let me break down possible underlying disagreements. 

  First, there's ambiguity in Aquinas's terminology. What exactly counts as "public authority" when the ruler is a tyrant? Is it the community, representatives, or some residual structure? Neither camp explicitly defines this, leading to divergent conclusions. 

  Second, the role of divine intervention is tricky. Aquinas mentions waiting for God when no human remedy exists. But does that exclude all human action? The first camp might see tyrannicide as part of divine providence, while the second views it as overstepping. 

  Third, there's the question of Aquinas's development. The Sentences comment is early, influenced by John of Salisbury. Did he later retract it? The camps weigh different texts: the first prioritizes consistency across works, the second sees the Summa as his mature stance. 

  Fourth, the concept of "permission." Aquinas never explicitly endorses tyrannicide, so is his discussion merely descriptive or subtly permissive? The first camp reads implication as endorsement, the second requires explicit sanction. 

  Fifth, the nature of "no human remedy." Does this imply tyrannicide is forbidden, or is it a last resort? The camps disagree on whether Aquinas's cautions are practical or principled. 

  The core conflict seems to be about authority and agency during tyranny. Without clear textual resolution, scholars fill gaps with their frameworks. 

  Progress would involve clarifying Aquinas's assumptions about authority structures and natural law in crises. Also, analyzing how later Thomists interpreted these passages might reveal overlooked nuances. But expecting definitive answers might be optimistic—the texts are inherently ambiguous. 

  Diagnosis: Competing hermeneutical frameworks regarding authority under tyranny.
answer: |-
  Your analysis is sharp: the conflict isn't primarily about *what* Aquinas wrote, but about how to interpret his silences, ambiguities, and underlying assumptions. Here's a diagnosis of the core disagreements and paths for progress:

  1.  **The Crux: Defining "Public Authority" in Tyrannical Collapse:** This is the central conceptual gap. Both sides agree the *Summa* reserves killing to "public authority." But **what constitutes legitimate "public authority" when the established ruler is the tyrant?**
      *   **Camp 1 (Pro-consistency):** Argues that "public authority" doesn't vanish; it reverts to the *community* (the *universitas*) or its residual representatives (e.g., lesser magistrates, nobles acting for the common good). The *Sentences* comment and *On Kingship's* usurpation distinction show this latent authority can be activated to remove a ruler who has fundamentally broken the social contract (either by lacking title or, implicitly, by extreme oppression nullifying their right). Tyrannicide is thus a public *judicial* act, not private murder.
      *   **Camp 2 (Anti-endorsement):** Argues Aquinas envisions "public authority" as a constituted, functioning *institution*. Once the tyrant holds that office (even abusively), no *other* human entity possesses the requisite public authority licitly to kill him. The community lacks the institutional mechanism; lesser officials lack jurisdiction over the supreme ruler. Divine intervention or existing institutional processes (like impeachment if available) are the only licit paths. Private acts or mob violence are condemned.

  2.  **Interpreting "Permission" and Implication:** Aquinas never explicitly says, "It is licit to kill a tyrant under conditions X, Y, Z."
      *   **Camp 1:** Reads the *Sentences* example, the usurpation distinction, and the *sedition* clarification as *implying* permissibility under specific public-authority conditions. His failure to explicitly *condemn* such acts in these scenarios is significant. "Permits" means providing a theoretical framework where it *could* be justified.
      *   **Camp 2:** Argues that silence on explicit endorsement, combined with the *Summa's* strong restriction of killing to constituted authority and *On Kingship's* dire warnings about consequences and the divine remedy, means he *doesn't permit* it. "Permits" requires explicit affirmative statement or clear, direct application of principles, which they find lacking.

  3.  **Weighting Texts and Development:**
      *   **Camp 1:** Sees consistency. The *Sentences* provides a principle (public-spirited act against a non-ruler), *On Kingship* refines the tyrant typology, the *Summa* provides the general principle on authority – they fit together. The *Sentences* isn't dropped; its scenario is subsumed under the later, more developed framework.
      *   **Camp 2:** Sees development or prioritization. The *Summa* and the mature *On Kingship* (especially the warnings and divine remedy passage) represent his considered view, superseding or contextualizing the earlier, arguably more enthusiastic *Sentences* comment. The emphasis shifts firmly to non-lethal remedies and divine action.

  4.  **The "No Human Remedy" Clause (*On Kingship* 1.6):** This is pivotal.
      *   **Camp 1:** Argues this applies *only* when there is *no* mechanism for public action (e.g., totalitarian control, no lesser magistrates). Where residual public authority *can* act (as in the *Sentences* example), tyrannicide *is* the human remedy.
      *   **Camp 2:** Argues this clause is absolute regarding *killing the ruler*. Since no constituted human authority *can* licitly kill the supreme ruler once in office, there *is* no human remedy involving lethal force. Enduring prayer is the only licit response.

  **What Counts as Progress?**

  1.  **Deepening the "Public Authority" Analysis:** Progress requires moving beyond simply quoting Aquinas on "public authority." Scholars need to:
      *   Rigorously analyze Aquinas's metaphysics of authority, community (*universitas*), and office. Where *does* authority reside when the office-holder is illegitimate/abusive?
      *   Examine his commentary on *Romans 13* and other relevant texts for clues on resistance.
      *   Investigate medieval theories of corporate agency and resistance (e.g., conciliarism, lesser magistrates) contemporaneous with or influencing Aquinas, to contextualize what "public authority" *could* mean.
  2.  **Clarifying the "No Human Remedy" Scope:** Precisely defining the scenarios Aquinas envisions under this clause is crucial. Does he explicitly *exclude* violent public action led by non-ruler authorities here, or is he primarily warning against private, anarchic violence?
  3.  **Genre and Audience Sensitivity:** Acknowledging that *On Kingship* is advice *to a king* (warning *against* becoming a tyrant and advising patience *for subjects*), the *Sentences* is academic commentary exploring principles, and the *Summa* provides systematic theology, might help explain emphases without necessarily implying contradiction or retraction.
  4.  **Distinguishing Principle from Prudence:** Recognizing that Aquinas's *prudential* warnings about likely bad outcomes ("usually a worse ruler follows") are separate from his *theoretical* principles on justice and authority. One can argue he *permits* it in principle while strongly *discouraging* it in practice due to risks.
  5.  **Beyond Proof-Texting:** Progress means engaging the *structure* of Aquinas's thought on justice, natural law, the common good, and the limits of obedience, rather than isolated passages. How do these concepts interact in a tyranny?

  **Should You Expect Resolution?** Likely not definitive consensus. Aquinas's treatment is genuinely ambiguous and incomplete on this specific, extreme case. The secondary literature conflict reflects inherent tensions within his own thought and the difficulty of applying abstract principles to political rebellion. Your contribution can lie in clarifying the *nature* of the disagreement, sharpening the conceptual analysis (especially on "public authority"), and perhaps offering a more nuanced synthesis that acknowledges the genuine tensions without forcing absolute consistency or complete rejection.

  Diagnosis: **Ambiguity of legitimate authority under tyranny.**
