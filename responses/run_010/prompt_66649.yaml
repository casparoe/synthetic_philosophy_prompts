  ### Market Activity Design: Discovering the Proxy-Target Disconnect in Futarchy  
  **Goal:** Students experience a market that works (Round 1) and fails (Round 2) due to a proxy-target disconnect—where the policy decision flips the meaning of the priced outcome. No real money, no laptops. Uses tokens/chocolates for incentives.  

  ---

  ### **Core Structure**  
  - **Two 25-minute rounds** (identical mechanics, different decisions) + **40-minute debrief**.  
  - **Round 1:** Market "works" (price converges to ground truth).  
  - **Round 2:** Market "fails" (price is accurate but misleading due to proxy flip).  
  - **Mechanism:** Call market using index cards and a whiteboard (simple, no continuous auction).  
  - **Private Info:** Students receive noisy signals about a hidden "true value."  
  - **Payoff:** Tokens (redeemable for chocolates/course credit) based on trading accuracy.  

  ---

  ### **Setup**  
  **Materials:**  
  - Whiteboard (for order book and price tracking).  
  - Index cards (for private signals and trade orders).  
  - Tokens (e.g., poker chips) for trading currency.  
  - Two hats/bowls (for submitting buy/sell orders).  

  **Student Roles:**  
  - All 16 students are traders.  
  - Instructor acts as market maker/auctioneer.  

  **Initial Allocation:**  
  - Each student starts with 10 tokens and 0 shares.  
  - Tokens are worthless alone; value comes from trading + payouts.  

  **Trading Rules (Both Rounds):**  
  - **Security:** A share that pays out the "true value" (revealed at round end) in tokens.  
  - **One Trading Period per Round:**  
    1. **Order Submission (3 min):**  
       - Students write orders on index cards:  
         - `[BUY/SELL], [PRICE], [QUANTITY]` (max 1 share/student to simplify).  
       - Orders dropped into "Buy" or "Sell" hat.  
    2. **Order Clearing (2 min):**  
       - Instructor sorts buys (high-to-low) and sells (low-to-high) on whiteboard.  
       - Finds **clearing price**: Price where buy orders ≥ sell orders (maximizes trade volume).  
       - All orders at/above (buys) and at/below (sells) clearing price execute.  
    3. **Trade Execution:**  
       - Matching orders transact at clearing price.  
       - Instructor updates token/share balances (students track on personal cards).  
  - **Payout (Post-Round):**  
    - Each share held pays `True Value` tokens (revealed by instructor).  
    - Example: If true value = 30, a share pays 30 tokens.  

  **Why This Avoids Last Year’s "Lark" Failure:**  
  - **Consequences:** Tokens → chocolates/credit create skin in the game.  
  - **Private Information:** Each student has unique, noisy data; ignoring it risks losses (no free riding).  
  - **No "Loud Kid" Bias:** Orders are written/anonymous; price set by aggregated bids/asks, not voices.  

  ---

  ### **Round 1: Market "Works"**  
  **Decision:** *"What is the average airspeed velocity of a European swallow (mph)?"*  
  - **Ground Truth:** 24 mph (based on biology studies).  
  - **Why it Works:**  
    - Objective, stable fact. Policy decisions don’t affect swallow biology.  
    - Demonstrates market’s aggregation power.  

  **Private Information Distribution:**  
  - Each student gets a card with a noisy signal: `True Value (24) + Random Error`.  
  - Error range: -10 to +10 (e.g., signals: 14, 18, 27, 33, etc.).  
  - **Instructions:** *"This is your private estimate. The true value is fixed. Trade to profit!"*  

  **Expected Outcome:**  
  - Price converges near 24 (e.g., 22–26). Payouts reward accurate beliefs.  
  - **Takeaway:** Students feel markets "beat votes" by aggregating dispersed info.  

  ---

  ### **Round 2: Market "Fails"**  
  **Decision:** *"What % of students will declare a major by sophomore year IF first-year seminars go pass/fail?"*  
  - **Ground Truth:** 70% (set by instructor).  
  - **The Proxy-Target Disconnect:**  
    - **Council’s Target:** Student well-being (e.g., reduced stress, informed choices).  
    - **Priced Proxy:** Declaration rate (easy to measure).  
    - **The Flip:**  
      - Without policy (current system): High declaration = good (confident, engaged students).  
      - With policy (pass/fail): High declaration = bad (students rush choices; low exploration).  
    - **Market Failure:** Prices accurately predict 70%, but council misinterprets this as "good" when it’s actually bad.  

  **Private Information Distribution:**  
  - Signals: `True Value (70) + Random Error` (same error range as Round 1).  
  - **Instructions:** *"This is your estimate of the declaration rate if pass/fail is adopted. The council will adopt pass/fail if the market predicts >60% (believing high = good)."*  

  **Expected Outcome:**  
  - Price converges near 70%. Council "adopts" pass/fail based on this.  
  - **The Twist Reveal:**  
    - *"The market was right about the declaration rate (70%). But under pass/fail, a high rate means students aren’t exploring—so well-being decreased! The policy backfired."*  
  - **Why It Fails:** The proxy (declaration rate) isn’t causally insulated from the policy. Its meaning flipped post-adoption.  

  ---

  ### **Timeline (90 Minutes Total)**  
  1. **Intro (5 min):**  
     - Explain rules, tokens, and security payouts.  
     - Emphasize: *"Trade to maximize tokens—this affects chocolates/credit!"*  

  2. **Round 1 (25 min):**  
     - Distribute swallow velocity signals (2 min).  
     - Trading: Order submission (3 min) → Clearing (2 min).  
     - Reveal true value (24); payout tokens (3 min).  

  3. **Round 2 (25 min):**  
     - Distribute pass/fail signals (2 min).  
     - Trading: Identical to Round 1 (5 min total).  
     - Reveal true declaration rate (70%); payout tokens (3 min).  
     - **Twist reveal (5 min):** *"Council adopted pass/fail, but 70% is BAD now. Why?"*  

  4. **Debrief (40 min) — Key Questions:**  
     - *"Round 1 vs. Round 2: Did the market ‘work’ differently?"* (No—mechanics were identical).  
     - *"Why did Round 2 fail? Was it thin trading or manipulation?"* (No—proxy disconnected from target).  
     - *"Could we fix this by choosing a better target?"* (e.g., Graduation rates? Student surveys?).  
     - **Concept Map:**  
       - Prices aggregate information → but only about the *priced thing*, not what we *care about*.  
       - Futarchy requires **causal insulation**: The target must not change meaning if policy passes.  
     - **The Oracle Problem:**  
       - *"In this game, I revealed ground truth. Real futarchy has no oracle—we never check if the proxy was valid. We might never know it failed!"*  

  ---

  ### **Where I’m Least Confident**  
  1. **Round 1’s Pedagogical Value:**  
     - **Argument for Skipping It:** If students already accept markets’ aggregation power, Round 1 wastes time. Jumping to Round 2’s failure could deepen engagement with the core problem.  
     - **Why I Kept It:** For policy students and podcast-philosophers, Round 1 makes the failure in Round 2 *surprising*. This creates "dissonance" that fuels the debrief. Without it, they might dismiss Round 2 as a setup.  
     - **Change My Mind If:** Students have strong econ backgrounds. Then start with Round 2 and say: *"Assume markets aggregate well—why did this one mislead us?"*  

  2. **Pass/Fail Example Backfire Risk:**  
     - **What Could Go Wrong:** Students argue declaration rate *doesn’t* flip meaning (e.g., *"High rate always = good!"*).  
     - **Mitigation:** Present the flip as a *scenario assumption* (not debatable). Use authority: *"Studies show pass/fail increases rushed choices in our simulation."*  
     - **Backfire Condition:** If students reject the flip, the failure seems artificial. Switch to the **rat extermination example** if needed:  
       - *Policy:* Pay bounties for dead rats.  
       - *Proxy:* Number of dead rats collected.  
       - *Flip:* Without policy, dead rats = fewer rats. With policy, dead rats = *more rats* (bred for bounties).  

  ---

  ### **Why This Works**  
  - **Discovers, Doesn’t Lecture:** Students *see* Round 2’s price converge (seemingly "right") and *feel* the frustration when it’s nonetheless misleading.  
  - **Fixes Past Issues:** Incentives + private info prevent larks. Written orders prevent loud dominators.  
  - **Honest About Limits:** Debrief clarifies the "oracle problem"—real futarchy lacks ground truth checks.  
  - **Time Realistic:** Rounds fit 25 min; debrief unpacks concepts without lecturing.  

  **Final Tip:** For the debrief, use Socratic questions. *"What did the council care about? What did the market price? Why wasn’t that the same?"* Let them articulate the disconnect.
