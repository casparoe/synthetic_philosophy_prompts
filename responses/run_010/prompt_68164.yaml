prompt: |-
  For about fifteen years I have read rationalist blogs and forums closely enough to know the standard shape this particular argument takes in comment threads, and I have watched it die in the same place every time: someone says that utility is defined by choice and therefore explains nothing, someone else says that is a philosopher's gotcha, and the thread dissolves into people restating their priors. Last month two members of a discussion group I belong to — one a health economist, one a philosopher of science — carried the argument considerably further than the threads ever do, first at a meeting and then across several emails I was copied on. I have reconstructed the exchange in their order and with their own emphases; the labels are mine, the moves are theirs. Vera is the philosopher, Marcus the economist. Neither of them argued badly, which is exactly why I cannot settle it.

  1. **Vera.** Utility, as it is actually used in economics, is not an independent quantity. On the revealed-preference reading, to say that an agent preferred one bundle to another just is to say that she chose it when the other was available. So the sentence 'she chose the apple because it gave her more utility' is not an explanation of the choice; it is a restatement of it in a noun phrase. No possible behavior could contradict it, since any choice whatsoever is compatible with some preference ordering that ranks the chosen item first. A claim that no observation could count against is not a claim with content, and economists who talk as though utility were doing causal work are trading on a bookkeeping convention.

  2. **Marcus.** That mischaracterizes the theory, which never says 'she preferred whatever she chose.' It says something about patterns across choices. If she takes X when Y is affordable, she must not take Y when X is affordable; consistency conditions of that kind — and, in the price-and-quantity setting, the generalized version of them — are genuine, checkable constraints, and real agents violate them. Moreover there is a theorem that tells you precisely when a finite data set of prices and chosen bundles can be rationalized by a well-behaved utility function: given the data, either such a function exists or it does not, and you can determine which without assuming anything about minds. That is a substantive empirical claim, not a tautology.

  3. **Vera.** Two replies, and the second is the one I care about. First, the consistency conditions are the part with content, and they are the part that fails: systematic reversals between what people choose and what they price, choice-set effects that shift preferences over the unchanged options, framing effects, and time-inconsistent behavior across delays. Second — and this is the structural point — the standard response to those failures is never to abandon the framework but to enrich the description of the situation, adding a reference point, a frame, a salience weight, or a present-bias parameter, after which the enriched theory accommodates whatever happened. But there is no independent rule for which enrichments are admissible, so the content Marcus located in move 2 gets bought back with flexibility. And deeper still: even when the consistency conditions hold, all they show is that choice is coherent. Coherent choice is not utility-as-a-thing-someone-has. The framework is either falsifiable and not about utility, or about utility and unfalsifiable.

  4. **Marcus.** The move from 'always modifiable' to 'therefore empty' proves far too much. Force in Newtonian mechanics is whatever produces the acceleration, on exactly the pattern Vera is complaining about, and yet the framework has obvious content; you can always save the phenomena by positing an unnoticed force, and nobody concludes that the second law is a tautology. What distinguishes a legitimate enrichment from a rescue is whether it is independently motivated and whether it buys predictions that were not there before. Present-bias and reference-dependence both do: they predict specific patterns that had not been observed and were then found — procrastination concentrated on tasks with distant deadlines, valuation gaps between giving up and acquiring, a directional asymmetry in how options are evaluated jointly versus separately. And the enriched models are more constrained, not less: a discounting model with two fixed parameters commits you to an entire schedule of reversals across delays, which you can then test.

  5. **Vera.** Grant all of that, because it is not where the problem is. The real issue is what utility is supposed to be. Either it names a psychological state — felt satisfaction, welfare, some hedonic or evaluative quantity — in which case choice data is at best fallible evidence about it, and the revealed-preference program has quietly changed the subject, since people demonstrably choose against their own reported well-being and report doing well while choosing in ways the framework calls irrational. Or it names nothing over and above the choice pattern, in which case statements about utility are conventions doing no explanatory work at all, and the economists who explain behavior by utility are speaking as though they had a mechanism when they have a notation. Neither horn yields utility as something that explains.

  6. **Marcus.** There is a third option you keep stepping over. Attributing preferences is an interpretive act, on the model of the intentional stance: ascribing beliefs and desires to a chess program does not posit a mechanism inside it any more than ascribing a center of gravity does, and yet the ascription is the right level at which to describe and predict the system. Utility is the economist's temperature. It is a macro-level quantity, cashed out by a representation that is unique only up to transformations that make no difference — monotone transformations for the ordinal version, positive affine ones for the cardinal — and it earns its keep by compressing and predicting a great deal of behavior. Demanding that it name a felt state is demanding that temperature name a sensation.

  7. **Vera.** The analogy fails at the place that matters. Temperature has an instrument that operates independently of the theory: a thermometer's functioning can be understood without assuming the quantity it measures, and that is what makes thermometry measurement rather than redescription. Utility has no such instrument. Choice is the only access, which is precisely the circularity I began with. And the uniqueness point concedes my conclusion rather than answering it: if two different utility functions state the same claim, then the theory is silent about exactly the features people have in mind when they say that one option made her better off.

  I was on neither side going in, and I alternately found each of them convincing, so I would rather not be nudged onto one by the framing of my own question. What I want is a verdict on each move separately. Please go through 1 to 7 in order and rate each — something on the scale of clearly mistaken, partly right but overstated, substantially right, decisively right — with a sentence or two of justification per rating, including any place where you think a move is right for a reason its author did not give, or wrong in a way that does not actually damage the argument. Then tell me what each of them established: which specific claims Vera won, which Marcus won, and whether there is any single point on which one of them simply prevails. I would especially like your judgment on three things I could not resolve — whether move 4 is a legitimate defense or flexibility purchased at the price of content; whether move 5 concedes the ground Vera spent moves 1 through 3 winning, or relocates the dispute to firmer ground that Marcus never engaged; and whether move 6 answers the charge that utility explains nothing or merely restates that charge in more sophisticated vocabulary, and whether move 7's objection about independent instruments is a real disanalogy or a demand no theoretical quantity could meet. Finally, say what both of them left out, including whether any of this turns on what the word utility is being asked to mean, and whether there is a substantive question underneath the exchange that neither of them ever actually posed. If the honest result is that they were partly talking past each other, say so and locate exactly where the crossing happens.
reasoning: |-
  Hmm, the user presents a detailed reconstruction of a debate between Vera (a philosopher) and Marcus (an economist) about the nature of utility in economics. They want me to analyze each of the seven moves in their exchange, rate them, determine who won which points, and resolve three specific points of contention. This is a sophisticated philosophical-economics discussion that requires careful unpacking.

  Looking at Vera's opening move (1), she makes a strong case about revealed preference theory reducing utility to mere description of choices. Her point about unfalsifiability is philosophically sound - if utility is defined solely by choice, it can't explain choice. Marcus' response (2) effectively counters by pointing to testable consistency conditions and the non-tautological nature of utility maximization theorems. The Afriat theorem he references does give empirical content to the theory.

  Vera's move (3) is particularly sharp. She acknowledges Marcus' point but argues that behavioral economics "enrichments" like reference points or present-bias parameters make the theory unfalsifiable through post-hoc adjustments. Her distinction between "coherent choice" and "utility-as-a-thing" cuts deep. Marcus' Newtonian analogy in move (4) is clever but potentially flawed - force has independent measurement while utility doesn't. His examples of predictive successes for behavioral models are valid though.

  The core philosophical conflict emerges in move (5) where Vera forces the dilemma: utility must be either psychological (but contradicted by choice) or descriptive (but nonexplanatory). Marcus' move (6) offers a third way - utility as an intentional stance construct like temperature. But Vera correctly pounces in move (7) on the disanalogy: temperature has thermometers while utility only has choice behavior, creating circularity.

  I notice they're somewhat talking past each other. Vera cares about ontological status and explanation, Marcus cares about predictive modeling. The unresolved issues center on whether utility can be explanatory without being psychological, and whether behavioral enrichments preserve or destroy theoretical content. I'll need to carefully rate each move while preserving the nuance - this isn't about picking winners but understanding where each argument succeeds or fails.
answer: |-
  Here is a verdict on each move, followed by an analysis of claims won, unresolved issues, and omissions:

  ### Verdict on Each Move
  1.  **Vera (Move 1): Substantially Right**  
      *Justification:* Correctly identifies the tautological risk in revealed preference theory: if utility is *defined* by choice, it cannot *explain* choice. The point about unfalsifiability (absent cross-context consistency) is valid for the "naïve" version of utility-as-direct-cause. However, it slightly overstates by implying economists universally ignore this; many acknowledge utility is a construct, not a psychological primitive.

  2.  **Marcus (Move 2): Substantially Right**  
      *Justification:* Successfully counters Vera's "tautology" charge by highlighting the empirical content in *cross-choice consistency conditions* (e.g., GARP) and Afriat's Theorem. These generate testable predictions (e.g., violations of transitivity, income effects). The claim that "real agents violate them" grounds utility theory in falsifiable empirical science.

  3.  **Vera (Move 3): Partly Right but Overstated**  
      *Justification:* Correct that behavioral enrichments (reference points, biases) *can* risk unfalsifiability if applied arbitrarily, and that coherence ≠ utility-as-mental-state. However, she understates Marcus's point: enrichments *aren't* always arbitrary; many (e.g., prospect theory) *were* motivated by specific anomalies and generate *new* testable predictions (as Marcus later notes). The "either falsifiable and not about utility, or about utility and unfalsifiable" is a false dichotomy; utility *is* the construct representing coherent choice patterns.

  4.  **Marcus (Move 4): Substantially Right**  
      *Justification:* The Newtonian analogy is apt: theoretical constructs (force, utility) gain content through their role in *predictive, structured models*, not direct observation. His key point is correct: legitimate enrichments (like present-bias) are not ad hoc; they are *independently motivated* by robust anomalies and generate *novel, testable predictions* (e.g., specific discounting schedules, endowment effects). This is flexibility *enhancing* content, not eroding it.

  5.  **Vera (Move 5): Decisively Right (on her core point)**  
      *Justification:* Forces the ontological dilemma brilliantly. If utility is psychological (welfare/satisfaction), choice is imperfect evidence (contradicting revealed preference). If it's *just* choice patterns, it explains nothing. Economists *do* often equivocate, using utility-language causally while relying on revealed preference. Marcus’s next move concedes the need to address this.

  6.  **Marcus (Move 6): Partly Right but Incomplete Response**  
      *Justification:* The "intentional stance" / "temperature" analogy is insightful: utility is a useful *theoretical construct* for prediction/compression, not a direct mental state. This avoids Vera’s psychological horn. *However*, he fails to adequately address the "explanatory" charge. Saying it "earns its keep by compressing/predicting" describes *usefulness*, not *explanation* of *why* choices occur. The uniqueness point (transformations) strengthens Vera's later objection about indeterminacy.

  7.  **Vera (Move 7): Substantially Right**  
      *Justification:* Correctly identifies the fatal flaw in the temperature analogy: **independent measurability**. Thermometers operate via physical laws *independent* of kinetic theory, breaking circularity. Choice is the *only* access to utility in RP theory, creating the loop she started with. The uniqueness point amplifies this: utility functions are *indeterminate* for interpersonal/intrapersonal welfare comparisons, undermining "better off" claims. This is a *real disanalogy*.

  ---

  ### Who Won What?
  *   **Vera Won:**
      *   **The Ontological Point (Move 5):** Utility cannot simultaneously be the *cause* of choice *and* defined *by* choice without tautology or equivocation. It’s either psychological (contradicted by RP) or descriptive (non-explanatory).
      *   **The Instrumentation/Independence Point (Move 7):** The lack of an independent measure for utility (unlike temperature) makes the RP approach fundamentally circular for *explanation*. Transformational invariance deepens this problem for welfare claims.
      *   **The Risk of Ad Hoc Enrichment (Part of Move 3):** Behavioral economics *can* degenerate into unfalsifiable storytelling if enrichments lack independent constraints/predictions.

  *   **Marcus Won:**
      *   **The Empirical Content Point (Move 2):** Utility theory (via consistency conditions & Afriat) *is* falsifiable and makes substantive claims about choice patterns, which are often violated.
      *   **The Legitimacy of Predictive Enrichment (Move 4):** Adding parameters (like present-bias) isn't inherently empty; it can be empirically motivated and generate novel, testable predictions, making models *more* constrained, not less.
      *   **Utility as a Useful Construct (Move 6):** Framing utility as a macro-level, instrumentalist construct (like temperature) is a coherent defense against demands for direct psychological realism. It *is* useful for prediction/compression.

  *   **No Clear Victor on a Single Decisive Point:** The core tension remains unresolved. Vera wins on the *explanatory/ontological circularity*, Marcus wins on *empirical content/predictive usefulness*.

  ---

  ### Resolution of Your Specific Queries
  1.  **Move 4 (Legitimate Defense or Loss of Content?):** **Legitimate Defense.** Marcus successfully argues that *specific, constrained* enrichments (like present-bias with fixed parameters) *add* predictive content and testability, rather than eroding it. Flexibility is purchased *with* added empirical content, not at its expense. Vera’s worry about *unconstrained* enrichment remains valid but doesn’t negate Marcus’s case for *well-motivated* ones.
  2.  **Move 5 (Vera Conceding or Relocating?):** **Relocates to Firmer Ground.** Move 5 doesn’t concede Moves 1-3; it shifts the attack to a deeper, more fundamental level: *what utility fundamentally is*. Vera’s points 1-3 challenge the *empirical robustness and falsifiability* of the RP framework. Move 5 challenges its *ontological coherence and explanatory power*, regardless of empirical success. Marcus never fully engaged this ontological/metaphysical challenge; his Move 6 responds to the *psychological* horn but not the *explanatory* one adequately.
  3.  **Move 6 & 7 (Answer or Restatement? Real Disanalogy?):**
      *   Move 6 **restates the charge in sophisticated vocabulary** regarding utility's *status* (construct vs. mental state), but **fails to answer** the core charge of *explanatory emptiness*. Saying utility "compresses and predicts" describes its *function*, not how it *explains why* choices happen within the RP framework.
      *   Move 7's **objection about independent instruments is a REAL and CRITICAL DISANALOGY.** It highlights the unique circularity of RP: choice is both the *explanandum* (thing to be explained) and the *only* measure of the *explanans* (utility). No theoretical quantity *requires* independent measurement to be useful (e.g., quarks), but the *explanatory* claim ("she chose X *because* of higher utility") absolutely *does* require breaking the definitional circle, which RP fails to do. Vera correctly identifies this as the "place that matters."

  ---

  ### What Was Left Out & Underlying Issues
  1.  **Left Out:**
      *   **The Pragmatist/Economic Engineer View:** Neither fully embraced the strongest defense: *Utility is not intended as "deep explanation" at all, but as a tool for prediction and policy analysis under scarcity.* Its "explanation" is instrumentalist. Marcus gestured at this (prediction/compression), but didn't own it fully against Vera's explanatory demand.
      *   **Welfare Economics Explicitly:** Vera hints at it ("better off"), but the implications of RP's indeterminacy (transformations) for *interpersonal welfare comparisons* and policy (e.g., cost-benefit analysis) weren't fully debated.
      *   **Alternative Foundations:** Neither discussed non-RP approaches (e.g., direct psychometric measurement of "experienced utility" a la Kahneman, or capabilities approaches) that might address Vera's concerns but abandon core RP methodology.
      *   **The "Standard Shape" of Online Arguments:** The initial framing's "philosopher's gotcha" vs. "economist's practicality" was transcended here, showing the depth possible.

  2.  **Talking Past Each Other? Yes, partially.** The crossing happens at **the definition of "explanation" and the purpose of utility theory.**
      *   **Vera** demands a *causal/mechanical* or *ontologically robust* explanation: What *in the agent* (mental state, process) *causes* the choice? RP utility fails this.
      *   **Marcus** defends utility as providing a *systematic, predictive, pattern-based* explanation: It organizes data, predicts future choices/policy impacts, and identifies inconsistencies. This is valuable *without* requiring deep causal mechanisms.
      Marcus never convincingly argues that RP utility provides the *kind* of explanation Vera seeks, while Vera sometimes understates the genuine empirical/predictive content Marcus highlights.

  3.  **The Substantive Underlying Question:**  
      **"Can a concept defined solely by its functional role in predicting observable behavior provide a genuine *explanation* of that behavior, or is it merely a useful redescription?"** This is a deep question in philosophy of science (instrumentalism vs. realism, explanation vs. description). Vera leans realist/causal, Marcus leans instrumentalist/predictive. The exchange clarifies *why* this is hard: the lack of independent access to utility makes bridging the gap impossible within strict RP.
