prompt: |-
  So my cousin Dana and I have been having the same argument on and off since Thanksgiving 2019, and at this point we keep a shared doc where we paste things at each other like it's a debate club. Her grandfather left her family a working farm — real acreage, equipment, the whole thing — and she thinks any estate or inheritance tax is straightforward confiscation of something people already earned twice over. I think untaxed dynastic wealth is feudalism with better PR. The problem is that neither of us can actually say where the line goes, because every time I try to state my view I end up either condemning things I do every day or letting through exactly the thing I'm objecting to. What I'd like is for you to look at my actual gut verdicts and tell me what principle, if any, they add up to.

  Here they are, roughly in the order we argued about them. Reading my daughter books every night and dragging her to museums on Sundays: completely fine, and I'd defend it against anyone, even though I know perfectly well it's making her more verbally fluent than the kid two doors down. Paying $4,000 for test prep: not fine. Paying for private K–12: not fine. Buying a house in a district with better public schools when the same house costs $250k more elsewhere: not fine in principle — but I would never support making it illegal, and I'd probably do it myself, which I admit is a problem. Passing on a paid-off $400k house to your only kid: fine, I think. Passing on enough in trust that your kid never has to take a job he doesn't want: not fine. Passing on a family farm or a family hardware store where the kid has been working since she was twelve: I keep saying fine because it's Dana, and I don't trust my own answer here. Stipending your kid so they can take the unpaid internship at the statehouse or the museum while other interns can't afford to: not fine. Paying off your adult kid's student loans: this is the one I flip-flop on constantly, because it looks identical to paying for college in the first place, which most of my friends and I do without blinking. And a $25k down-payment gift at 28: fine? but also I can't explain why it's fine and the trust isn't, except that the trust is bigger, which feels like a non-answer.

  My own tentative principle, such as it is, is something like: what's objectionable isn't making your kid better off, it's buying them a place in the queue — converting money into a positional slot they couldn't otherwise earn, so that fair equality of opportunity is a fiction by the time anyone starts applying. But you can see it doesn't hold, because bedtime stories are positional too (there are only so many spots at the good school, and fluency wins them), and the farm is literally a slot — a job and an asset nobody else can have. So maybe the real variable is something else entirely: consumption vs. capital, gifts while you're alive vs. transfers after you're dead, whether the kid did anything to earn it, or just the dead-hand worry about people controlling property from the grave. I want you to test those and tell me which one, or which combination, actually delivers my verdicts — state each candidate precisely, clause by clause, and say which of my cases each clause is there to handle. Then run it on cases I haven't listed (inter vivos gifts timed to dodge the tax, a kid who inherits modestly from two different relatives, forgiving a loan to your kid's startup but not your nephew's, a scholarship funded by naming a building after your father) and be honest about which of my verdicts it forces me to give up. I have a feeling it's one of the private-school ones, and I'd rather find out from you than from Dana. One last thing: don't send me off to the literature or a reading list, I want your own reconstruction — and I specifically want to know whether the principle you land on cares about taxing the estate as a whole versus taxing what each individual recipient receives, since that seems like it might split the four-kid dynasty from the one-kid one.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They've been arguing with their cousin Dana about inheritance tax and dynastic wealth since 2019, and they need help finding a consistent principle behind their gut reactions to various scenarios. 

  First, I notice the user is deeply self-aware about their contradictions - they admit their own actions (like bedtime stories) might be problematic under their stated views. That's rare. They're not just debating Dana; they're wrestling with their own hypocrisy. The emotional tone feels frustrated but determined - they've kept this doc for years, so it matters.

  The core challenge is reconciling these seemingly arbitrary lines:
  - Bedtime stories: fine
  - Test prep: not fine
  - Inheriting a $400k house: fine
  - Lifetime trust fund: not fine
  - Family farm: conflicted

  Their tentative "queue-jumping" theory breaks on bedtime stories (which are positional) and the farm (which is literally a slot). I need to find what variable actually drives their judgments. 

  Hmm... looking at the patterns, what stands out? They're consistently against cash-like transfers that replace market competition (trust funds, stipends) but accept non-monetary advantages or assets tied to legacy (books, museums, houses, farms). The test prep/private school cases feel different because they directly purchase academic placement. 

  Ah! Maybe it's about whether the advantage bypasses meritocratic filters. Bedtime stories develop capability; test prep buys credentials. The farm is tricky because while inherited, it requires active participation ("working since twelve"). That suggests effort matters. But they flip-flop on student loans - is that because education is capability-building? 

  Let me test candidate principles:
  1. "Control from the grave" theory: Explains why trusts feel worse than inter vivos gifts. But fails on student loans (alive) vs inheritance (dead) inconsistency.
  2. "Capital vs consumption": Fails because museums (consumption) are fine while test prep (consumption) isn't.
  3. "Earned participation": This fits best! They accept advantages tied to the child's engagement (farm work, museums) but reject passive transfers (trusts, stipends). Even the house inheritance feels earned by proximity/relationship. 

  Wait - does "earned" explain the school district case? Buying location advantages feels unearned by the child. And the $25k gift at 28 might feel earned by life stage. Student loans remain tricky because education could be capability (earned through study) or credential-buying. 

  For unlisted cases:
  - Tax-dodging gift timing: Shouldn't matter if principle is about the recipient's merit
  - Dual inheritance: Scale might trigger "never work" threshold
  - Nephew's loan: Rejection (no participation) unless nephew worked in startup
  - Named scholarship: Acceptable if merit-based, not if buying admission

  The estate vs recipient tax question: Their reactions focus on individual outcomes (e.g. "kid never has to work"), so taxing recipients makes more sense. Four kids splitting wealth might not trigger their objections if each share is modest. 

  Biggest tension: Their own school district hypocrisy. The principle forces them to either condemn it or redefine "earned" very loosely. Dana will pounce there. But maybe they can live with that if they admit it's a non-ideal compromise. 

  This user needs clarity, not perfection. If I can give them a framework that explains 90% of their judgments and names the 10% tension, that's progress. Their self-awareness suggests they'll accept that.
answer: |-
  Your gut verdicts reveal a surprisingly consistent principle—but it's not about wealth transfers *per se*, nor timing, nor consumption vs. capital. It hinges on **whether the advantage substitutes for the recipient’s own agency in a meritocratic process**. Specifically:

  ### Your Principle (Precisely Stated):
  > **Advantages are objectionable when they:**
  > **1.  Bypass competitive selection mechanisms** (e.g., admissions, hiring, credit markets);  
  > **2.  For positions requiring demonstrated competence**;  
  > **3.  *Without* proportional effort/skill from the recipient.**  
  >   
  > **Key corollary:** Gifts enhancing *capability* (not position) are acceptable, as are assets tied to *ongoing participation*.

  ---

  ### How It Explains Your Cases:
  | **Your Case**                  | **Verdict** | **Why It Fits**                                                                                                |
  |------------------------------|------------|---------------------------------------------------------------------------------------------------------------|
  | Bedtime stories/museums      | ✅ Fine     | Builds capability (verbal fluency). Doesn't *assign* a competitive position; kid still competes on merit.     |
  | $4k test prep                | ❌ Not fine | Purchases credentialing advantage (SAT/GPA) that *bypasses* merit filters for college/jobs.                  |
  | Private K–12                 | ❌ Not fine | Buys access to elite networks/credentials that *replace* open competition for opportunities.                 |
  | Moving for school district   | ❌ (But conflicted)| Uses capital to access public resources (schools) that function as merit filters. Bypasses need to "earn" entry via individual merit (e.g., scholarships). |
  | Passing on $400k house       | ✅ Fine     | No competitive slot bypassed. Asset transfer doesn't pre-assign a social/economic position.                   |
  | Trust fund (never work)      | ❌ Not fine | Money replaces labor-market competition entirely. Bypasses need to demonstrate competence for income.         |
  | Family farm/hardware store   | ✅ Fine     | **If** kid worked there: effort/skill demonstrated. Transfers *operational control*, not passive income.       |
  | Stipend for unpaid internship| ❌ Not fine | Buys access to a competitive career-launching slot (internship) others must earn via savings/sacrifice.       |
  | Paying off student loans     | 🤔 Flip-flop| *Capability* (education) already acquired. But if loan relief enables risk-free elite careers, edges toward "queue-jumping." |
  | $25k down payment at 28      | ✅ Fine     | Assists consumption/security. Doesn't bypass competence filters (e.g., mortgage approval, job market).        |

  ---

  ### Why Your Initial Theories Failed:
  - **"Positional vs. non-positional"**: Fails on bedtime stories (positional) and the farm (literal slot).  
  - **"Consumption vs. capital"**: Test prep (consumption) is objectionable; inheriting capital (farm) is acceptable.  
  - **"Inter vivos vs. inheritance"**: Paying for college (inter vivos) and inheritance (farm) both pass; stipends (inter vivos) fail.  
  - **"Dead-hand control"**: Doesn’t explain why a *living* parent’s trust fund is worse than an inherited house.  

  **Your principle's core**: It cares about **how wealth distorts meritocracy**. The farm is acceptable not because it’s "capital" or "legacy," but because the kid’s labor transforms it from an unearned transfer into *earned continuity*.

  ---

  ### Testing Unseen Cases:
  Apply your principle clause-by-clause:

  | **New Case**                                  | Prediction | Why                                                                 |
  |---------------------------------------------|-----------|---------------------------------------------------------------------|
  | **$1M gift timed to dodge estate tax**       | ❌ Not fine | Same as trust fund: enables passive life, bypassing labor markets. |
  | **Kid inherits $200k from each grandparent** | ✅ Fine    | $400k total (like the house). Not enough to bypass merit filters.  |
  | **Forgiving loan to kid’s startup**          | ✅ Fine    | *If* startup requires skill/effort. Not passive; proportional agency. |
  | **Forgiving loan to nephew’s startup**       | ❌ Not fine | No participation from nephew (no "working since 12"). Unearned advantage. |
  | **Scholarship w/ building named after dad**  | ✅ Fine    | Merit-based (if awarded competitively). Enhances capability without assigning slots. |
  | **Buying Ivy League admission via donation** | ❌ Not fine | Directly bypasses meritocratic admissions.                         |

  ---

  ### Tensions with Your Verdicts:
  1. **School District Move**:  
     - **Principle says**: ❌ Not fine (buys access to better teachers/peers, distorting educational meritocracy).  
     - **Your conflict**: You’d do it. **Resolution**: Admit it violates your principle, but is a systemic failure (fix public schools).  
       
  2. **Student Loans**:  
     - **Principle allows** ✅ if education is "capability-building."  
     - **But**: If elite degrees *are* the "position," paying loans *after* graduation still distorts merit. **This is your weakest spot**—consistent only if you view education as pure capability.  

  ---

  ### Estate Tax Design Implications:
  Your principle **cares about taxing recipients, not estates**. Why?  
  - A $10M estate split among 10 kids ($1M each) may not bypass merit filters.  
  - The same $10M to one kid enables lifetime passivity.  
  - **Solution**: Tax based on *recipient’s total lifetime inheritance* (with thresholds for "bypass merit" levels).  

  ---

  ### Conclusion:
  **Your principle**: *Wealth transfers are unjust when they allow recipients to occupy competitive positions requiring competence—without demonstrating that competence, and without proportional effort.*  

  **What to tell Dana**:  
  > "The farm is fine because your labor *earned* it—it’s not passive wealth. But dynastic trusts *are* feudalism: they let heirs occupy economic positions purely through birth. Taxing giant, unearned transfers isn’t confiscation—it’s preventing aristocracy."  

  **Where you’re inconsistent**:  
  - School districts (you’re buying positional advantage)  
  - Student loans (if elite degrees are positional goods)  

  **Admit this to Dana**. Consistency would require either:  
  a) Rejecting school-district moves (politically untenable), or  
  b) Accepting that *some* meritocracy-distorting advantages are unavoidable in capitalism.  

  This isn’t hypocrisy—it’s acknowledging that perfect equality is impossible, but unchecked dynastic wealth makes it *worse*.
