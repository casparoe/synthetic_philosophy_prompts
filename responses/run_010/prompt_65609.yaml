  1a. Why unhedged conditional analysis (UCA) is false: Both agree that UCA (which says: D(x,s,m) iff (s is done to x) > (m occurs)) fails because of counterexamples: finks, masks, and mimics. Finking: the disposition disappears when the stimulus is applied. Masking: something prevents the manifestation even when the stimulus is applied and the disposition is present. Mimicry: something without the disposition behaves as if it had it.

  1b. Finking, masking, and mimicry: They are three distinct phenomena. Finking involves a change in the disposition itself upon stimulus (e.g., a sorcerer who removes fragility when the glass is struck). Masking is an external blocker that doesn't remove the disposition but prevents manifestation (e.g., a protective coating). Mimicry is when an object without the disposition is rigged to behave as if it had it (e.g., a non-fragile glass that is rigged to explode when struck, mimicking fragility). So they are three.

