prompt: |-
  I direct the integrity function at a humanitarian organization with field offices in eleven countries, and I am rewriting our staff standard on gifts, favors, and payments to public officials. The current text is a bright-line rule — nothing above a nominal value, no payment to any official for any reason, declare every kinship connection — and it is failing: staff comply on paper, work around it informally, and I cannot say which of the individual rulings I have signed off on over four years I would defend if they were published side by side. Before I redraft anything, I want to know what my verdicts actually commit me to. Here they are, with the operative detail in each.

  **Gifts and hospitality**

  1. A box of pastries left for an underpaid public-hospital nurse by a grateful family after her shift, with no request attached and no expectation of another visit. Not corrupt; refusing it would have been a small cruelty.
  2. An envelope of cash handed to a surgeon by the same family before the operation, to move the patient up the elective list. Corrupt, and I would treat the staff member who paid it as complicit.
  3. A week of hunting hospitality extended by a timber company to a provincial forestry official, entered in the official's public gift register, after which the official votes against the company's permit application. Not corrupt — though I notice that the disclosure seems to be doing all of the work here, and I cannot articulate what work it is doing.
  4. A protocol officer accepts a ceremonial dagger from a foreign ministry on behalf of a visiting minister and deposits it in the state collection. Not corrupt. The minister pockets the identical dagger from the identical giver. A serious breach. Nothing about the object, the giver, or the recipient's state of mind has changed between the two.

  **Kin and patronage**

  5. A village headman awards a borehole contract to his brother-in-law's firm at the prevailing rate; the well functions and cost the village nothing more than the alternatives. Not corrupt, though I would require the relationship to be declared.
  6. The same headman awards the contract to an unqualified cousin at twice the prevailing rate. Corrupt.
  7. A newly elected mayor fills a deputy-mayor post with the campaign manager who ran the winning operation. Not corrupt; that is what elections are for.
  8. The same mayor creates a sanitation clerk post and fills it, bypassing the qualifying examination list, with that campaign manager's nephew. Corrupt.

  **Payments under pressure**

  9. Forty dollars at a checkpoint to release a truck of insulin that will otherwise spoil in the heat. I would instruct staff to pay it and log it, and I do not think it is corrupt.
  10. Forty dollars at the same checkpoint, to the same guard, to release a truck of cigarettes. Corrupt, and the driver should refuse.

  **Cases with no office and no money**

  11. A journal peer reviewer who quietly accelerates and softens her report on a former classmate's manuscript. I want to call this corrupt, though there is no public money, no public role, and no rule of law involved.
  12. An established novelist enters her own manuscript in a prize restricted to unpublished debut authors, under a pseudonym, and wins — arguably deservedly. I want to call this corrupt too, even granting that hers was the best entry.
  13. A voter who sells her ballot for fifty dollars. Corrupt, I think. But a kidney donor who sells her kidney for five thousand dollars is not corrupt — that transaction is exploitative, which I take to be a different complaint about a different thing.
  14. A state that sells residency to foreign investors at a published price, with no discretion exercised by any official at all. Not corrupt, though I find it harder to say why this differs from case 13 than I expected to.

  What I want from you:

  **(a)** Is there a single principle, or a small ordered set of them, that delivers these verdicts? State each candidate precisely enough that a field officer could apply it, and identify which clause of it is motivated by which case — I suspect several of my verdicts are each doing independent work, and I want to know how much machinery the set requires.

  **(b)** Tell me which pairs cannot both survive. My own suspicion falls on 5 against 8, on 9 against 10, and on 13 against 14, but I may be wrong about where the pressure is. For each genuinely irreconcilable pair, say which verdict the better principle forces me to abandon and what the abandoned verdict was tracking that the principle loses.

  **(c)** Where a simpler principle would overturn one of my verdicts and a more complex one would save it, tell me the price of the complexity in operational terms. A standard that requires the person applying it to weigh four considerations under time pressure, in a second language, with an armed official waiting, is not a standard we can issue; I need to know whether the account that fits my intuitions is one a human being can actually carry.

  **(d)** Apply your principle to cases I have not listed: a regulator who is scrupulous in office, never meets the firms she oversees, honors a two-year cooling-off period in form, and takes a senior job at one of them under arrangements made informally before she left; a minister whose adult son is hired at market salary by a firm with business before the ministry, without the minister's knowledge or involvement; an aid agency paying a local intermediary a commission per permit obtained, where the intermediary's own costs are opaque to us; and two agency heads who each approve the other's expense claims and exchange a bottle of whiskey every Christmas.

  **(e)** Give me the diagnostic boundary between corruption and the wrongs it is constantly confused with in our case files — conflict of interest, undue influence, regulatory capture, cronyism, exploitation, and simple breach of trust. I want a question to ask in each instance that discriminates, not a list of synonyms.

  **(f)** Assess the parochialism of the result. My verdicts appear to presuppose that an officeholder can be separated from his person, his kin, and his obligations of hospitality, and several of the settings we work in treat that separation as unintelligible, where refusing a gift severs the only relationship through which any public business gets done at all. Say whether your principle yields different verdicts in those settings without becoming relativist — that is, whether there is an invariant underneath, or whether what I have is one historically specific settlement wearing the clothes of a definition.

  **(g)** Finally, distill whatever survives into the shortest test I could print on a card. Then tell me where that test will generate false positives, condemning locally obligatory conduct as corrupt, and where it will generate false negatives, permitting genuine predation because it does not match the shape of the card. I would rather know both failure modes now than discover them in an audit.
reasoning: |-
  Hmm, this is a deeply thoughtful inquiry about corruption principles from someone with real-world integrity management experience. The user presents 14 nuanced cases where their existing bright-line rule fails, and asks for a coherent framework that can handle these gray areas operationally.

  First I need to recognize what makes this hard: The user isn't just seeking definitions - they need a decision tool that works across cultures while maintaining ethical rigor. Their cases reveal at least five tension points: when gifts are customary but coercive (1 vs 2), when kinship enables competence versus cronyism (5-8), when extortion serves life-saving versus luxury goods (9-10), and whether corruption requires public office/money (11-14). 

  The kidney/ballot contrast (13) is particularly illuminating - both involve selling something "inalienable," but feel ethically distinct. This suggests the core issue isn't the transaction itself but whether it perverts a role's purpose. The dagger case (4) confirms this: identical objects become corrupt based on whether they're treated as state property or personal loot.

  For part (a), I'm considering a three-part principle: 
  1. Does this compromise the role's intended function? (Explains why expediting insulin isn't corrupt but cigarettes is - the checkpoint role exists to protect public safety, not enable smuggling)
  2. Is the beneficiary exploiting their position? (Distinguishes the surgeon's bribe from the nurse's pastry)
  3. Does it damage institutional integrity? (Makes sense of why the disclosed hunting trip isn't corrupt - sunlight disinfects)

  But this needs stress-testing. Case 7 (mayor hiring campaign manager) passes all three because electoral politics expects such appointments. Case 11 (journal favoritism) fails - peer review should be meritocratic regardless of whether money changes hands.

  For irreconcilable pairs (b): Case 5 (qualified relative) vs Case 8 (unqualified nephew) might actually be consistent under the "role purpose" lens - the headman's role is to secure functional infrastructure, while the mayor's is to ensure fair civil service access. But Case 9 (insulin bribe) vs Case 10 (cigarettes) could be problematic if staff can't reliably distinguish "essential" goods. Maybe the principle needs an exception for imminent humanitarian harm.

  Operational complexity (c) is the real hurdle. Asking field staff to judge "role purpose" during an armed shakedown is unrealistic. The solution might be layered rules: bright-line prohibitions plus narrow, predefined humanitarian exceptions (e.g., "life-saving medical goods only") that don't require on-the-spot philosophy.

  When applying to new cases (d), the regulator taking a job pre-arranged before cooling-off period clearly perverts the purpose of regulatory oversight - it's institutional poison even if technically compliant. The minister's son hired without involvement might pass if - and only if - there's truly no influence or appearance thereof, but in practice that's nearly impossible to prove.

  For boundaries (e): The question "Would this still be acceptable if fully disclosed?" seems powerful. Cronyism often collapses under sunlight; exploitation doesn't (we'd still object to ballot/kidney sales). Conflict of interest is about potential distortion; corruption requires actual quid pro quo.

  On cultural parsimony (f): The "role purpose" principle travels better than most western frameworks. Where gift-giving is relational glue, we'd ask whether rejecting it would destroy necessary trust without which the role couldn't function - but also whether the gift creates dependency that perverts that function. Not relativism, but context-sensitive application of the invariant: no role should become a tool for private gain.

  The card test (g) will inevitably have blind spots. "Does this use a position of trust for private benefit at public expense?" works for most cases but falsely condemns the novelist pseudonym (no public harm) and falsely excuses the pre-arranged revolving door (disguised public harm). That's why the card must come with clear examples of both failure modes.
answer: |-
  Your cases reveal corruption as **the perversion of entrusted power for private gain**, with nuance in how "entrusted," "perversion," and "gain" manifest. Below is a principle set derived from your verdicts, tested against your queries.

  ---

  ### **(a) Core Principles**  
  A three-part test, applied sequentially:  

  1. **Does the act *compromise the core purpose* of an entrusted role?**  
     - *Triggered by:* Cases 2 (surgeon prioritizes bribes over medical need), 6 (headman abuses funds), 8 (mayor subverts merit-based hiring), 10 (guard extorts for non-essential goods), 13 (voter sells democratic voice).  
     - *Operational clarity:* Ask: "Would this act, if known, make the role’s intended function impossible?"  

  2. **Is the gain *asymmetric* (benefiting private interests over public/social good)?**  
     - *Triggered by:* Cases 4 (minister pockets state gift), 11 (reviewer biases science for friendship), 12 (novelist usurps opportunity for newcomers), 14 (ballot sale vs. residency sale).  
     - *Operational clarity:* Ask: "Does this transfer value away from the intended beneficiary of the role?"  

  3. **Is the act *avoidable* without systemic harm?**  
     - *Triggered by:* Cases 1 (pastries: refusal harms nurse-patient bond), 9 (insulin: refusal harms health), 5 & 7 (nepotism acceptable if qualified/declared).  
     - *Operational clarity:* Ask: "Would refusing this cause *greater* harm to the role’s purpose than accepting it?"  

  **Order matters**: If #1 fails (core purpose compromised), corruption exists. If #1 holds, check #2 (asymmetry). If #2 holds, check #3 (avoidability).  

  ---

  ### **(b) Irreconcilable Pairs**  
  | **Conflict**       | **Verdict to Abandon** | **Reason**                                                                 |  
  |---------------------|------------------------|----------------------------------------------------------------------------|  
  | **5 vs. 8**         | Case 5 (qualified kin) | If *all* kin appointments risk eroding merit (Principle #1), Case 5 must be corrupt. But Principle #3 saves it if declared/qualified. **No conflict** if declaration ensures oversight. |  
  | **9 vs. 10**        | Case 10 (cigarettes)   | Both involve checkpoint extortion. Principle #1: Releasing insulin serves public health (purpose of aid), cigarettes do not. **No conflict**—essentiality determines "core purpose." |  
  | **13 vs. 14**       | Case 14 (residency sale) | Selling ballots (#13) perverts democracy’s purpose. Residency sales (#14) *are* the state’s purpose if transparent/non-discretionary. **Conflict resolved** by Principle #1: Ballot sale destroys democratic voice; residency sale *is* the policy. |  

  **True conflict: Cases 11 vs. 12**  
  - Case 11 (journal review) is corrupt (asymmetric gain per Principle #2: science is distorted for friendship).  
  - Case 12 (novelist’s pseudonym) is *not* corrupt: The prize’s purpose is to recognize debut talent, and the best entry won. Principle #1 holds.  
  - **Abandon Case 11’s verdict?** No—corruption can exist outside government (Principle #2). The invariant is *entrusted power*, not public office.  

  ---

  ### **(c) Complexity Costs**  
  - **Simpler principle**: "Never exchange value with officials." **Overturns Cases 1, 5, 7, 9**.  
    - *Cost*: Ignores unavoidable harm (nurse’s pastry, insulin ransom) and functional kinship (campaign manager).  
  - **Operational burden**: The 3-part test requires:  
    - Identifying the *role’s purpose* (field staff may misjudge).  
    - Assessing *avoidability* under duress (e.g., armed checkpoint).  
    - **Mitigation**: Pre-approve exceptions (e.g., "gifts <$10 for routine services," "ransom for lifesaving goods").  

  ---

  ### **(d) New Case Applications**  
  | **Case**                                                                 | **Verdict**                  | **Reason**                                                                 |  
  |--------------------------------------------------------------------------|------------------------------|----------------------------------------------------------------------------|  
  | **Regulator pre-arranging private job**                                  | Corrupt                      | Principle #1: Revolving door perverts regulatory purpose *even if technically compliant*. |  
  | **Minister’s son hired without involvement**                             | Not corrupt                  | Principle #2: No asymmetric gain if no influence/qualification. *But require declaration*. |  
  | **Opaque commissions to intermediaries**                                 | Corrupt                      | Principle #2: Asymmetric gain likely (intermediary profits at aid’s expense). |  
  | **Agency heads swapping whiskey/approvals**                              | Corrupt                      | Principle #1: Mutual back-scratching perverts oversight. Principle #2: Whiskey is private gain. |  

  ---

  ### **(e) Diagnostic Boundary**  
  **Ask**: *"Does this act redirect entrusted power away from its intended beneficiary?"*  
  - **Conflict of interest**: *Risk* of redirection.  
  - **Undue influence**: *External pressure* to redirect.  
  - **Exploitation**: Redirection *without power imbalance* (e.g., kidney sale).  
  - **Breach of trust**: Redirection *without gain* (e.g., negligence).  
  **Corruption requires**: Entrusted power + private gain + perversion of purpose.  

  ---

  ### **(f) Cultural Parochialism**  
  - **Invariant**: All societies distinguish *role* from *person* (e.g., village headmen act for the collective, not lineage). Gifts that *preserve* role integrity (e.g., Case 1 pastries) are exempt.  
  - **Relativism risk**: If refusing a gift severs *all* function (e.g., a customs official expects "tea money" to process *any* paperwork), the system itself is corrupt. Your principle condemns it.  
  - **Verdict shift**: In kinship-based societies, Case 5 (qualified kin) may be unavoidable. Principle #3 permits it *if declared* to enable oversight.  

  ---

  ### **(g) Field Test & Failure Modes**  
  **The Card Test**:  
  > *"Could this act, if known, reasonably undermine trust in the role? If yes, does refusing it cause greater harm? If no, it is corrupt."*  

  **False Positives** (Condemning non-corruption):  
  - Culturally obligatory gifts (e.g., wedding gifts to officials in close-knit communities).  
  - Emergency payments lacking alternatives (e.g., bribes for orphanage supplies during a blockade).  

  **False Negatives** (Missing corruption):  
  - Subtle patronage (e.g., awarding contracts to qualified cronies at market rates).  
  - Long-term reciprocity (e.g., "gifts" to officials who later retire and "consult").  

  ---

  ### **Summary**  
  Your intuitions track whether an act **warps institutional purpose for private benefit**. The operational tension is between nuance and enforceability. **Recommendation**:  
  1. Adopt the 3-principle framework for policy drafts.  
  2. Create a "safe harbor" list (e.g., gifts <$10, kinship with declaration, lifesaving ransoms).  
  3. Train staff on the *purpose* of roles (e.g., "A forestry official’s duty is sustainable resource management").  
  4. Audit for *patterns* (e.g., "How often do intermediaries’ commissions exceed 20%?").  

  This balances rigor with survivability in gray zones—corruption is less about the *object* exchanged than the *institution* betrayed.
