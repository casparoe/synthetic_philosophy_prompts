prompt: |-
  I'm doing my EPQ on scientific priority — basically whether it matters who got there first when the same idea keeps turning up anyway (Darwin and Wallace, Newton and Leibniz, that sort of thing). Before I go and read any of the actual theories, I want to know what I should be demanding of one.

  So: write the reqirements list. What does any account of how discoveries happen, and of who deserves the credit, have to deliver? Which cases must it get right — the famous doubles, the ones where the runner-up arguably did the harder work, the near-misses that never quite crossed the line, and the big available ideas that sat there for years with nobody producing them at all? Which distinctions can it not collapse? Which background results has it got to be consistent with? Say why each thing is a requirement, and be definite about which ones are non-negotiable and which are just a particular camp insisting on its own favourite virtue.

  The bit I care about most is whether some subset of them can't all be met at once — like if explaining why something got discovered twice and explaining why an equally ripe idea got discovered zero times pull in opposite directions, or if you can't have a theory that's testable without already knowing which discoveries *didn't* happen. If the list is a result in itself, say so and argue it.

  Then score the main contenders against it briefly, and give me a position, not a menu — I can do the fence-sitting myself.
reasoning: |-
  Okay, the user is working on an EPQ about scientific priority—specifically, whether it matters who gets credit first when multiple people have the same idea independently. They want a requirements list for any theory explaining how discoveries happen and who deserves credit. They're looking for what such a theory must explain, which cases it must get right, and any contradictions between requirements. Also, they want an evaluation of existing theories and a clear stance.

  First, I need to outline the essential requirements. The user mentioned cases like Darwin-Wallace and Newton-Leibniz, so the theory must handle simultaneous discoveries. Also, cases where the runner-up did more work, like Mendel, or ideas that were available but not discovered, like the vacuum tube. The theory should explain why some ideas are rediscovered multiple times while others lay dormant. 

  The non-negotiable requirements would be universality and testability. The theory must apply across different fields and times. Testability is crucial; it should make predictions that can be validated. Without testability, it's just storytelling. The user also wants to know if some requirements conflict. For example, explaining multiple discoveries versus non-discoveries might need different mechanisms. Maybe social factors vs. individual genius. 

  Then, the user wants existing theories scored against these requirements. Merton's sociological approach might handle simultaneous discoveries well but miss individual creativity. Cognitive theories could explain why ideas appear obvious after the fact but struggle with why they weren't discovered earlier. Combo theories might be best but could be vague. 

  The user's deeper need might be understanding if credit is inherently disputable or if a fair system exists. They might want to argue that priority disputes are inevitable due to conflicting values in science. Also, they might need a structured framework to analyze historical cases for their EPQ. 

  I should present a clear position. Arguing that no single theory satisfies all requirements because of inherent tensions between individual and social factors. The combo theory is pragmatic but messy. Emphasize that priority disputes arise from unresolved tensions in how we assign credit. 

  Need to ensure the requirements cover all case types: doubles, runner-ups, near-misses, non-discoveries. Distinctions like novelty vs. development mustn't be collapsed. Consistency with background studies like Simonton's creativity research is important. 

  Finally, summarize the main contenders' strengths and weaknesses, then conclude that the sociological approach is most testable but incomplete, hence the need for a hybrid model. Advise the user to focus on case studies showing these tensions in their EPQ.
answer: |-
  Here’s your requirements list for a theory of scientific priority, designed to be rigorous, actionable, and expose tensions. I’ll structure it as **Core Demands** (non-negotiable), **Aspirational Goals** (highly desirable but often contested), and **Boundary Conditions** (what it must *not* do). The key tension emerges starkly.

  **Core Demands (Non-Negotiable):**
  1.  **Explain Simultaneous Discovery ("Multiples"):** *Why* does the same discovery often occur to multiple individuals/groups independently and near-simultaneously (e.g., Calculus, Natural Selection, Oxygen)? A theory must provide a mechanism beyond coincidence. (Failure here invalidates the theory for the core phenomenon).
  2.  **Account for Variable "Ripeness":** It must explain why some ideas are "ripe" (appearing multiple times) while others, seemingly equally plausible or valuable, remain undiscovered for long periods despite available tools/knowledge (e.g., Gregor Mendel's genetics sat ignored for 35 years; the concept of a controlled clinical trial existed conceptually long before its implementation). It must distinguish between an idea being *possible* and it being *inevitable*.
  3.  **Handle the "Near-Miss":** Explain cases where someone came *very close* to a discovery but failed to grasp it fully or articulate it convincingly (e.g., George Cayley's principles of flight vs. the Wright Brothers' implementation; Humphry Davy's near-discovery of the periodic table).
  4.  **Preserve the Distinction Between Novelty and Development:** It must not collapse the fundamental difference between the *initial conception/insight* (the "aha!" moment defining priority) and the subsequent *development, proof, elaboration, and communication* of the idea. A theory must explain why credit often focuses on the former, even if the latter is arduous. (Collapsing this renders priority meaningless).
  5.  **Be Testable/Falsifiable:** The theory must generate predictions beyond just fitting known cases. It should suggest conditions under which multiples are *more* or *less* likely, or when non-discoveries should persist. Crucially, **this creates the central tension:** Testing often relies on identifying *counterfactuals* – discoveries that *could* have happened but didn't. How do we robustly identify "ripe but undiscovered" ideas without hindsight bias? Verifying explanations for non-occurrence is inherently difficult.

  **Aspirational Goals (Highly Desirable, but Camps Differ):**
  6.  **Handle the "Runner-Up" Problem:** Explain cases where the person(s) who arrived second arguably did more rigorous work, provided better evidence, or developed the idea more fully (e.g., Wallace arguably had a clearer mechanism for natural selection than Darwin's initial sketch; Leibniz's calculus notation was superior). Can the theory adjudicate credit beyond just "first past the post"?
  7.  **Incorporate Individual Genius/Psyche:** Explain why specific individuals, not just the "zeitgeist," are crucial. Why did Einstein see relativity when Lorentz, Poincaré, and others had pieces? Does personality, cognitive style, or sheer brilliance play an irreducible role?
  8.  **Integrate Social/Institutional Factors:** Explain how communication networks, funding, institutional support, gatekeeping, prestige, and competition influence *both* the likelihood of discovery and the *assignment* of credit (e.g., why was Rosalind Franklin's role in DNA structure initially minimized?).
  9.  **Explain Long-Term Non-Discovery ("Stasis"):** Beyond ripeness, explain prolonged periods where a field seems stuck, unable to grasp an idea that later seems obvious with hindsight (e.g., why did the concept of continental drift take so long to be accepted, despite evidence? Why wasn't the telescope invented earlier?).
  10. **Be Field-General:** Should apply similarly (even if mechanisms differ in weight) to mathematics, physics, biology, technology, etc.

  **Boundary Conditions (Must Not Do):**
  11. **Collapse into "Great Man" Theory:** It cannot attribute discovery *solely* to innate genius, ignoring context and precursors.
  12. **Collapse into Pure "Zeitgeist" Determinism:** It cannot render discovery inevitable and individuals interchangeable at a given time. There must be room for contingency and individual agency.
  13. **Rely Entirely on Hindsight Bias:** Explanations for non-discovery or near-misses must not simply be "they weren't smart enough" or "they just missed it" without a deeper mechanism. Avoid judging past actors by present knowledge.

  **The Foundational Tension:**
  *   **Simultaneity vs. Non-Discovery vs. Testability:** This is the crux. Explaining **multiples** often leans on **ubiquitous ripeness** – the idea was "in the air," tools/knowledge were widespread. But explaining **non-discovery/stasis** requires **barriers to ripeness** – something prevented the necessary convergence, despite available elements. A theory emphasizing *social connectivity* (explaining multiples) struggles to explain why the same connectivity didn't dissolve barriers for non-discoveries. A theory emphasizing *individual cognitive breakthroughs* struggles to explain multiples. **Worse, testability (#5) is hampered:** Proving why something *didn't* happen requires identifying plausible "missed opportunities," which is inherently speculative and vulnerable to hindsight bias ("it *seems* obvious now, so why didn't they?"). We can't run controlled experiments on history. Testability often relies on *predicting patterns* of multiples/non-multiples across fields/time, but verifying explanations for specific non-occurrences remains elusive.

  **Scoring Major Contenders:**

  1.  **Mertonian Sociology (Robert K. Merton):** Focuses on norms, competition, communication networks, and reward systems (priority as the coin of the realm).
      *   **Strengths:** Excellent on #1 (Multiples via communication/competition), #3 (Near-misses via communication failure/misinterpretation), #8 (Social factors core), #6 (Runner-up as victim of communication/priority norms). Testable (#5) via historical analysis of communication patterns and reward structures.
      *   **Weaknesses:** Weak on #2 (Variable Ripeness - why *this* idea now?), #7 (Individual genius downplayed), #9 (Long-term stasis - assumes progress is normative), #4 (Can blur novelty/development via focus on communication timing). Struggles with #2/#9 due to emphasis on progress. Testability limited by historical data gaps.
  2.  **Cognitive/Evolutionary Epistemology (e.g., Donald Campbell, Dean Simonton):** Views ideas as evolving through variation (blind or sighted) and selective retention within minds and cultures.
      *   **Strengths:** Good on #1 (Multiples as parallel variation/selection), #2/#9 (Variable ripeness/stasis explained by fitness landscape/complexity of mental "mutations" required), #7 (Individual minds as variation engines). Potentially testable (#5) via simulations, creativity studies, and historiometric analysis of discovery rates.
      *   **Weaknesses:** Less strong on #3 (Near-misses - why selection failed?), #8 (Social factors often secondary), #6 (Runner-up - timing is stochastic). Can be vague on mechanisms for specific historical cases. Struggles to fully integrate #8. Testability often indirect.
  3.  **"Combo" Theories (e.g., Sociocultural-Cognitive, Actor-Network Theory):** Attempt to integrate individual cognition, social interaction, and material tools/artifacts.
      *   **Strengths:** Aspires to cover all bases (#1, #2, #3, #7, #8, #9). Can handle nuances of #4 and #6 contextually.
      *   **Weaknesses:** Often complex and less parsimonious. Can be descriptive rather than predictive. Testability (#5) is a major challenge – hard to isolate variables or generate clear falsifiable predictions. Risk of becoming "just-so" stories.

  **The Position:**
  **No single theory currently satisfies all Core Demands without significant tension, primarily due to the simultaneity/non-discovery/testability trilemma.** However, the **Mertonian sociological framework comes closest to being essential and non-negotiable**, particularly for explaining the *social phenomenon* of priority disputes and the frequency of multiples. It provides the most robust and testable (historically) account for *why* priority becomes an issue and *how* credit is assigned/contested.

  **BUT,** it is insufficient alone. A *hybrid* approach is necessary:

  1.  **Foundation:** The **social structure of science (Merton)** is the primary engine driving the *competition* and *communication* that make multiples common and priority disputes intense. It explains the *systemic* pressure for discovery and the mechanisms for claiming credit.
  2.  **Essential Addition:** **Cognitive/evolutionary mechanisms** are needed to explain *what* is discovered (the specific idea's "ripeness" or complexity - #2, #9) and *who* might get there first (individual variation - #7). This layer explains the *variation* upon which the social system acts.
  3.  **Context:** Specific **historical, institutional, and material contexts** (#8) determine the precise configuration of opportunities and barriers in specific cases (near-misses, runner-ups, stasis).

  **Therefore:** Scientific priority *matters* intensely within the social system of science because priority is the primary currency of reward in a competitive, communally validated enterprise. However, *who* gets there first is often a complex interplay of individual cognitive work occurring within a sociocultural context that makes the discovery "ripe" and fuels the race. The "same idea turning up anyway" is a consequence of this system working as designed (fostering rapid advance through competition), but it doesn't negate the significance for the individuals involved or the historical record. **The tension between the inevitability of ideas-in-context and the contingency of individual discovery is inherent and unresolvable – it's the source of enduring priority disputes.** Your EPQ should argue that while the *fact* of multiples reveals the power of context, the *disputes* reveal the irreducible role of individual agency and the high stakes within the scientific reward system.

  **Your Next Step:** Use this framework to analyze specific cases. How does the Darwin/Wallace episode illustrate Mertonian norms and competition? How does the non-discovery of Mendelian genetics for decades illustrate the barriers to "ripeness" beyond just available knowledge? How do Newton/Leibniz show the blurring of novelty vs. development? The tension *is* the result.
