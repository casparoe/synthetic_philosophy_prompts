prompt: |-
  I cover science and research policy for a national magazine, and over the past several years I have accumulated a notebook full of one particular kind of exchange that I have never been able to name. The pattern runs as follows. A reporter puts a pointed factual question to a source, and the source answers with something true, genial, and apparently beside the point — not a refusal and not a non-answer, but a remark that can only be taken as responsive if some unstated background assumption is granted. To hear it as an answer at all, the reporter has to grant it. And once granted, the grant does the work: the substantive answer arrives not as anything the source said, but as part of the setting the source's sentence was permitted to take for granted.

  Three entries from that notebook. First: I asked a university communications office whether a laboratory's funding had been suspended pending the outcome of a misconduct investigation, and the reply observed that the lab had attracted record citation counts over five years and that the university remained committed to the highest standards of research integrity. I could read that as a response to my question only by assuming those facts bore on the question; having assumed it, I came away with the answer that no suspension had occurred. Nothing of the kind was asserted. Second: at a conference I asked a company's chief scientist whether the benchmark figures in her paper had been produced under the evaluation conditions the paper describes, and she said the team's methodology was rigorous and had drawn praise from reviewers. Again the sentence is relevant only if rigor and peer praise settle what happened in this particular run, and in installing that relevance I installed the answer. Third: a historian asked whether he still stood by the attribution at the center of his book replied that the book had won a prize and been translated into six languages.

  What makes this more than ordinary evasion, to my mind, is an asymmetry. The inference is compulsory on my side — I cannot process the remark as a response without making it — and yet it never becomes part of what the source is on record as committed to. If I printed the answer I had extracted, I would be told I had misread a compliment. The colleagues in the room who understood the exchange perfectly would have no way of saying so without asserting something the source can disown, and if I challenge the assumption aloud I come across as accusing a pleasant person of having said something unpleasant that they demonstrably did not say.

  I know roughly where this sits among the things people do talk about. I have read enough Grice to know that speakers are said to convey more than their sentences literally say, and I have heard the phrase plausible deniability, along with loaded question and dog whistle. But each of those seems to me to be a different animal. The Gricean idea is usually described as conveying a proposition, and here the source would deny having conveyed any proposition at all; deniability is typically discussed as a property of a meaning the speaker really did put forward; a loaded question forces the assumption on the person answering rather than the person asking; a dog whistle is audible only to part of an audience, whereas here everyone in the room hears it; and a non-answer conveys nothing, which is not what happens.

  So: is there an established concept for this, with a name I could responsibly use in print? I want the carving rather than the label — where exactly the phenomenon begins and ends, what it is a special case of, and what it excludes. Please give me exactly five numbered items of a sentence or two each, with no introduction and no conclusion, covering: what the mechanism actually is and what it ought to be called; the two or three nearest established concepts and how what I have described differs from each; whether any of them fits this exactly or only by stretching; and if none does, a term you would coin for it, with a definition and a boundary case or two that keeps it distinct from its neighbors.
reasoning: |-
  Okay, let me tackle this fascinating query. The user describes a very specific rhetorical maneuver where sources give technically true but tangential responses that compel the reporter to infer the actual answer by accepting an unstated premise. 

  First I need to pinpoint what makes this distinct from common evasion tactics. The key differentiators seem to be: 1) the inference is mandatory for the exchange to function as communication, 2) the source maintains complete deniability about the implied meaning, and 3) the burden of interpretation falls entirely on the questioner. 

  Looking at established concepts:
  - Gricean implicature doesn't fit because the source would deny any implied proposition
  - Plausible deniability typically involves meanings the speaker actually intended
  - Loaded questions reverse the assumption burden
  - Dog whistles rely on partial audience recognition
  - Non-answers convey nothing, whereas here meaning is constructed

  The core mechanism appears to be "coerced presupposition" - the source forces the questioner to accept a background assumption that contains the answer. For example, praising a lab's citations presupposes no funding suspension occurred. 

  I'll propose "presuppositional inoculation" as a new term. It captures how the source "inoculates" themselves against accountability by embedding the answer in presuppositions the listener must supply. Boundary cases would distinguish it from close cousins like innuendo (which implies rather than presupposes) and paralipsis (which denies while stating).

  The historian's prize mention is a perfect example: stating the book's acclaim presupposes the attribution stands, without ever asserting it. Any challenge makes the reporter seem rude for "misinterpreting" praise. That's the inoculation effect - the source is immunized against accountability.
answer: |-
  Here are five numbered items addressing your query:

  1.  **Mechanism and Proposed Term:** This is **presuppositional inoculation**. The mechanism involves the source embedding the substantive answer as an unstated *presupposition* necessary for their tangential, truthful statement to be relevant. By compelling the listener to supply this presupposition to make sense of the response, the source "inoculates" themselves against direct accountability for the implied answer. The answer resides solely within the listener's inferred context.

  2.  **Nearest Concept 1: Conversational Implicature (Grice):** Implicature involves inferring meaning beyond the literal words based on cooperative principles. Crucially, the speaker is typically understood to *intend* the implication and can be held accountable for it. Here, the source would deny *any* implicature related to the question, making it distinct. Implicature doesn't fit because accountability for the inference is rejected.

  3.  **Nearest Concept 2: Plausible Deniability:** This describes creating ambiguity to avoid accountability for an intended meaning. However, plausible deniability usually concerns a meaning the speaker *did* put forward ambiguously. Here, the source denies putting forward *any* meaning related to the question; the answer arises purely from the *listener's* compelled presupposition, not the speaker's ambiguous utterance. It fits only by stretching the concept beyond recognition.

  4.  **Nearest Concept 3: Indirect Speech Act:** This occurs when an utterance's intended function (e.g., a request) differs from its literal form (e.g., a statement about ability: "Can you pass the salt?"). While the responses *are* indirect, their function isn't a *different* speech act (like a request); it's an evasion tactic exploiting presupposition. More importantly, indirect speech acts still rely on speaker intent being recoverable, which the source here explicitly disavows for the key inference. It is related but not an exact fit.

  5.  **Coined Term and Boundaries:** **Presuppositional Inoculation** is defined as: *A response tactic where the speaker makes a truthful, tangential statement that compels the listener to supply an unstated presupposition containing the substantive answer to an avoided question, thereby shifting the origin and accountability for that answer entirely onto the listener.* Boundary: Contrast with *innuendo* (implying something negative/risqué the speaker intends but can deny) and *paralipsis* (stating something by claiming not to state it). Here, the source doesn't imply or mention the answer; they force *your* presupposition to contain it, then inoculate themselves against it.
