  ## MINUTES OF THE THIRD MEETING OF THE COMMITTEE FOR THE RESTORATION OF NATIONAL CUSTOMS
  **Date:** 17th October, 1977
  **Time:** 14:00 - 16:45
  **Location:** Conference Room D, Ministry of Heritage & Civic Spirit, Aethelburg, Republic of Baltica
  **Chair:** Dr. Anya Varga (Director, Historical Preservation Office)
  **Attendees:**
  *   Mr. Eduard Blum (Deputy Minister, Heritage & Civic Spirit)
  *   Dr. Karolina Petrov (Head Archivist, National Records Office)
  *   Mr. Henrik Jansen (Director of Publications, Ministry of Information)
  *   Ms. Ingrid Dahl (Representative, District Governors' Council)
  *   Prof. Tomas Berzins (Department of Folklore Studies, Aethelburg University - *Attended Item 4 only*)
  *   Ms. Elara Finch (Secretariat, Heritage & Civic Spirit)

  **Apologies:** Mr. Silas Vance (Director, National Parks & Landmarks)

  **1. Confirmation of Previous Minutes & Matters Arising**
  Minutes of the Second Meeting (3rd October 1977) were approved unanimously. The Secretariat confirmed the requested archival survey (Item 2.1) was initiated but results were pending.

  **2. National Day Programme Development (Vernalia Festival - 21st September 1978)**
  The Chair reminded members of the critical deadline. The core event structure (parade, official speeches, children's choir) was established. The urgent requirement remained a distinctive, participatory "folk custom" symbolizing national unity and pre-industrial agrarian roots, suitable for widespread public adoption by next Vernalia.

  **3. Proposal: "The Garlanding" - Development & Historical Anchoring**
  Mr. Blum presented the proposed custom: "The Garlanding." Citizens would weave garlands from specified native wildflowers (Lady's Lace, Mountain Star, Bluebell) on Vernalia Eve. These garlands would be hung on front doors overnight, then carried in the morning to a central community point (village square, town hall steps) for a collective blessing ceremony led by a local elder or official before the parade.
  *   **3.1 Establishing Historical Precedence:** Dr. Petrov presented findings. Pre-railway (c. 1885) records showed scattered, localized references to seasonal floral decorations and community gatherings, but no unified "Garlanding" practice. References to specific flowers were inconsistent. Mr. Jansen noted the importance of a "defensible founding date" for public materials. Discussion ensued.
      *   Mr. Blum suggested 1848, citing the "Year of the Great Harvest," arguing abundance would logically inspire celebration. Dr. Petrov countered that 1848 parish records primarily noted grain yields and minor flooding, with no floral references.
      *   Dr. Petrov proposed 1862, noting a single, ambiguously worded diary entry from the Eastern Highlands mentioning "wreaths hung for the autumn blessing." Ms. Dahl expressed concern that the Eastern Highlands had distinct traditions; anchoring it there might alienate other regions.
      *   Mr. Jansen advocated for 1820. "The bicentenary angle is simpler for primers and supplements. We have fewer surviving documents *from* that period, which conversely means fewer documents exist *to contradict* a plausible Garlanding narrative. Defensibility hinges on the *absence* of counter-evidence, not necessarily the *presence* of direct proof." The Committee agreed 1820 offered the strongest narrative defensibility for public dissemination. **Action:** Dr. Petrov to identify one suitable, vague early 19th-century regional reference (e.g., "spring garlands" or "harvest decorations") that could be reinterpreted in press materials as the proto-Garlanding, dated to 1820.
  *   **3.2 Implementation & Scale:** Mr. Jansen outlined the rollout plan:
      *   Primary School Primers: Inclusion in the "Our Baltican Year" chapter for the 1978/79 academic year, distributed nationwide by June 1978.
      *   Newspaper Supplements: A major feature in *The Aethelburg Chronicle* and regional papers approximately 6 weeks before Vernalia 1978, including patterns, flower identification, and the "1820 origin."
      *   Radio Broadcasts: Instructional segments in the weeks leading up.
      *   **Print Run Argument:** Mr. Jansen stated an initial print run of 50,000 supplements was budgeted. Ms. Dahl raised a significant concern: "If the initial supplement run only covers the major cities and the West, and a second run is needed for the North and East districts later, those districts will receive instructions *after* the first wave has potentially begun practicing. There is a high risk of regional variations emerging immediately. This could undermine the perception of a single, timeless custom. We need saturation to create uniformity." Mr. Jansen revised the request to 80,000 supplements for nationwide simultaneous distribution. **Action:** Mr. Jansen to confirm feasibility and cost of 80,000 print run with Ministry of Information print shop.
  *   **3.3 Folklorist's Survey Report:** Prof. Berzins joined the meeting. His preliminary survey of oral histories and obscure regional archives found no evidence of a unified "Garlanding" custom predating the railway. Several localized traditions involved flowers, but timing, species, and rituals varied greatly. Prof. Berzins concluded the proposed custom appeared novel. The Committee received this information.
      *   Dr. Varga (Chair): "Thank you, Professor. This clarifies the *scope* of the educational task. Mr. Jansen, please ensure the primer and supplement materials are exceptionally clear and detailed to pre-empt regional divergence. Professor Berzins, we will require your finalized report, focusing *only* on documented localized floral traditions that can be framed as precursors, by December 1st to inform the final primer text. Frame it as 'regional variations coalescing into the national Garlanding.' Avoid definitive statements of absence." Prof. Berzins acknowledged and departed.
  *   **3.4 The Archival Observation:** During discussion of the final wording for the primer's historical note, Dr. Petrov paused: "A point of procedural caution. If we establish 1820 as the anchor date... and given the likely paucity of surviving ephemera from that era... in, say, fifty years, the most complete archival record detailing the *creation* of this '1820 Garlanding' narrative might well be... these very minutes." A brief silence followed. Mr. Blum then stated, "A valid point. Therefore, the minutes of this item must reflect the Committee's diligent search for historical precedent and its reasoned conclusions based on the *available fragments*, emphasizing the *spirit* rather than the absolute letter of the past. Wording must be precise." Subsequent discussion became markedly more deliberate, focusing on phrases like "drawing upon long-standing regional motifs," "formalizing a national expression," and "commemorating our enduring connection to the land."
  *   **3.5 Rationale:** Ms. Dahl spoke: "We must remember *why* this matters. Vernalia needs something tangible, something every family can *do* together, connecting their doorstep to the town square. It needs roots, even symbolic ones. Seeing a garland on every door, knowing everyone else is making one too, that’s what makes Baltica feel like one place, shared. It’s the *doing*, collectively, year after year, that will make it real and old." The Committee expressed unanimous agreement with the sentiment. The Chair noted the importance of fostering communal participation and national cohesion through shared practice.

  **4. Budgetary Requirements (Appendix A)**
  The Chair presented the preliminary budget outline for "The Garlanding" project. Key items included:
  *   Primary School Primer Revision & Printing
  *   Vernalia Supplement Design & Printing (Revised: 80,000 copies)
  *   Radio Programme Development & Airtime
  *   Wildflower Seed Packets for School Distribution (Lady's Lace, Mountain Star, Bluebell)
  *   Documentation & Archiving of the Custom Establishment Process
  The budget was provisionally approved pending final confirmation of the supplement print run cost. **Action:** Secretariat to circulate updated Appendix A after confirmation.

  **5. Next Steps & Date of Next Meeting**
  *   Dr. Petrov to identify suitable 19th-century reference for "1820 origin" narrative (By 31st Oct).
  *   Mr. Jansen to confirm cost/feasibility of 80k supplement run & update budget (By 24th Oct).
  *   Prof. Berzins to submit report on localized floral traditions for primer context (By 1st Dec).
  *   Secretariat to draft primer text section and supplement feature outline based on minutes (Circulate by 14th Nov).
  *   **Next Meeting:** 7th November 1977, 14:00, Conference Room D. Agenda: Review primer/supplement drafts, finalize flower species list, discuss blessing ceremony wording.

  **Meeting Closed:** 16:45

  ---

  **APPENDIX A: PROVISIONAL BUDGET LINES - "THE GARLANDING" INITIATIVE**

  | Code       | Description                                  | Estimated Cost (Baltican Kroner) | Notes                           |
  | :--------- | :------------------------------------------- | :------------------------------- | :------------------------------ |
  | HCS-PR-78  | Primer Revision & Printing (Nat. Curriculum) | 12,000                           | Includes Garlanding chapter     |
  | INFO-PUB-1 | Vernalia Supp Design & Print (80,000)        | *TBC*                            | Awaiting print shop quote       |
  | INFO-RAD-1 | Radio Programme Dev. & Airtime               | 8,500                            | 4 regional slots, 2 national   |
  | HCS-SUP-1  | Wildflower Seed Packets (Schools)            | 15,000                           | Lady's Lace, Mountain Star, Bluebell |
  | NRO-ARC-4  | Custom Documentation & Archiving             | 3,000                            | Includes meeting min. processing |

  ---

  **NOTE:** Mr. Eduard Blum requested that his dissent regarding the choice of Bluebell over the historically more common (but less visually striking) Wood Violet be recorded in the minutes.
