  Hmm, the user is a TA in a grad seminar on the physics of information, and they're trying to figure out the professor's ruling pattern for student-submitted perpetual motion designs. They've given me eight precedents and a new case involving a "warehouse-register" demon. I need to analyze this carefully since they care deeply about the reasoning.

  First, I should recall the core principles here. Landauer's principle states that erasing information dissipates heat, while Bennett extended this by showing measurement can be reversible. The key is that for a closed system, entropy must increase, and any work extraction requires an entropy dump somewhere.

  Looking at the precedents:
  1. Szilard engine fails because erasure costs kT ln 2, negating the work extracted.
  2. Finite memory without erasure fails because it's just a battery - finite resource.
  3. Feynman ratchet at uniform temp fails due to thermal fluctuations dominating.
  4. Ratchet with cold pawl passes because temperature gradient allows work extraction.
  5. Light trapdoor fails - same issue as #3, detailed balance prevents net work.
  6. Brillouin demon fails - measurement via light requires energy input (flashlight).
  7. Reversible measurement with cold erasure bath passes - entropy dumped externally.
  8. Refused - boundary not specified, so system isn't closed.

  The new case has unbounded write-once memory shipped to a warehouse, no erasure, all at uniform temperature. The big questions: Is the shipped memory "outside"? Does keeping mutual information without erasure still incur entropy debt?

  For candidate rules, I brainstorm several possibilities:
  Rule A: Requires entropy export to a thermal reservoir colder than the system. This covers #4 (cold pawl), #7 (cold erasure bath), and explains #8's refusal (no boundary). But fails on #2 - finite memory should count as entropy export but was ruled fail.
  Rule B: Any persistent correlation between controller and system must eventually be thermally randomized or erased. Covers #1 (erasure needed), #2 (finite memory fills up), #3/5 (thermalization). But #7 passed with cold erasure - is that "eventually"?
  Rule C: Measurement always has thermodynamic cost unless explicitly offset. Covers #6 (flashlight cost), but #7 had "free" measurement and passed.
  Rule D: Work extraction requires dissipative structure break (via temp gradient or explicit erasure). Covers #4,7. But #3 had gradient but failed? No, #3 was same temp.

  After testing, Rule E emerges: "Sustained work requires explicit entropy export via thermal contact." Meaning entropy must flow to a distinct thermal reservoir. This covers:
  - #1/2: No export (erasure into same bath doesn't count)
  - #3/5: No reservoir
  - #4/7: Has reservoir (cold pawl/cold bath)
  - #6: Measurement energy isn't exported
  - #8: No boundary, so can't define export

  For the warehouse case: If boundary includes warehouse, register is still in system → fail. If boundary is just lab, register is exported → should pass? But is "shipping" thermal contact? Probably not - it's mechanical removal, not heat flow.

  Thus in her framing, boundary likely includes warehouse (since #8 refusal suggests strict closure), so ruling should be FAIL. Closest precedent is #2 (battery analogy).

  For (e), a discriminator: A design where memory is erased into a cold bath after use. Rule E would pass (explicit export), while a stricter rule demanding measurement cost might fail.

  Final answer: FAIL based on system boundaries including storage, with Rule E being "sustained work requires explicit entropy export."
answer: |-
  ### Brainstorming and Analysis

  The professor's rulings hinge on **thermodynamic closure** and **entropy accounting**, with a clear pattern emerging when examining the precedents. Her "pass" likely means the design can, in principle, deliver sustained net work without violating the second law under explicit accounting, while "fail" indicates a hidden entropy debt or flawed boundary specification. Below, I break down the candidate rules, apply them to the warehouse-register case, predict the ruling, and design a discriminator.

  ---

  ### (a) Candidate Rules and Precedent Coverage
  I propose four candidate rules, tested against all eight precedents. Each rule must explain why #4 and #7 passed while others failed, and handle #8's refusal.

  1. **Rule A: "Sustained work requires explicit entropy export via thermal contact."**  
     - Entropy reduction in the gas must be compensated by entropy increase in a distinct thermal reservoir (e.g., a cold bath), not just storage or same-bath dumping.  
     - Coverage:  
       - Passes: #4 (cold pawl acts as sink), #7 (erasure into cold bath).  
       - Fails: #1 (erasure into same bath), #2 (no export, just storage), #3 (no reservoir), #5 (no reservoir), #6 (measurement energy not exported).  
       - #8: Refused (no closed system → can't define "export").  
     - **Stumbles on**: None. Fits all precedents.  

  2. **Rule B: "Controllers must not thermalize with the system; measurement always costs."**  
     - If the demon/controller shares temperature with the system, thermal noise corrupts control (detailed balance). Measurement isn't free unless specified as reversible and offset.  
     - Coverage:  
       - Passes: #4 (cold pawl breaks thermalization), #7 (reversible measurement + cold erasure).  
       - Fails: #1 (measurement? implied cost), #2 (implied thermalization), #3 (thermalized), #5 (thermalized), #6 (measurement costs energy).  
       - #8: Refused (boundary issue, but thermalization unclear).  
     - **Stumbles on**: #2. Why fail if measurement is "free" and no erasure? Rule B doesn't explain why finite storage isn't sufficient. Also, #7 has reversible measurement, but still required cold erasure to pass.  

  3. **Rule C: "Unbounded memory postpones entropy debt; finite memory fails."**  
     - Infinite storage "externalizes" entropy indefinitely, but finite storage fills up, halting the engine. Erasure is only costly if bounded.  
     - Coverage:  
       - Passes: #7 (unbounded memory implied? but cold erasure used).  
       - Fails: #1 (bounded erasure), #2 (finite memory).  
       - Partial: #6 (measurement cost, not memory).  
       - **Stumbles on**: #4 (passes with cold reservoir, no memory). #8 refusal isn't explained. #3/#5 fail without memory. Overfits #2 but ignores #6.  

  4. **Rule D: "Work cycles require dissipative erasure or gradient; storage is insufficient."**  
     - Net work needs a dissipative step (erasure) or a thermal gradient. Storage alone doesn't reset the controller.  
     - Coverage:  
       - Passes: #4 (gradient), #7 (erasure).  
       - Fails: #1 (erasure into same bath), #2 (no dissipation), #3/5 (no gradient/erasure).  
       - #8: Refused (boundary for dissipation undefined).  
     - **Stumbles on**: #6. Fails due to measurement cost, not lack of erasure/gradient. Rule D doesn't address measurement.  

  **Summary of (a)**:  
  - Rule A covers all precedents cleanly, especially #2 (storage ≠ export) and #8 (boundary essential).  
  - Rule B fails on #2 (no thermalization issue in description).  
  - Rule C overfits #2 but conflicts with #4 and #6.  
  - Rule D ignores #6's measurement cost.  
  - **Best candidates**: Rule A and Rule D, but Rule A is tighter due to #6 and #8.  

  ---

  ### (b) Prediction for Warehouse-Register Design  
  - **Rule A (entropy export via thermal contact)**: FAIL. The warehouse is not a thermal reservoir; shipping is mechanical, not heat flow. No entropy export occurs.  
  - **Rule B (no thermalization + measurement cost)**: FAIL. All parts at same temperature → thermalization corrupts control. Measurement claimed "free" but not offset.  
  - **Rule C (unbounded memory)**: PASS. Infinite storage externalizes entropy "permanently."  
  - **Rule D (dissipative step/gradient)**: FAIL. No erasure or gradient; storage isn't dissipative.  

  **Boundary analysis**:  
  - If boundary is the lab bench (excludes warehouse): Rule A might PASS (register "exported"), but #8 refusal suggests she requires explicit thermal export, not just removal.  
  - If boundary includes warehouse (closed system): Rule A FAILS (storage is internal, entropy not dissipated).  
  - Precedent #8 ("doesn't specify closed system") implies she uses **system-wide boundaries**, so warehouse is likely included.  

  ---

  ### (c) Best Prediction of Ruling and Closest Analog  
  - **Prediction**: FAIL.  
  - **Reasoning**: The warehouse register doesn't export entropy thermally; it's stored information, creating mutual information without dissipation. This matches #2 ("a battery, not an engine" – finite storage fails, infinite is just a bigger battery). The system is closed (all parts thermalized), so entropy must increase internally, preventing net work. Rule A explains this best.  
  - **Closest analog**: #2 (finite register stops). Why better than others?  
    - #2 shows storage alone fails, even without erasure.  
    - #7 passed with cold erasure (explicit export), contrasting storage vs. dissipation.  
    - #4 and #6 are less direct: #4 has a gradient, #6 has measurement cost.  

  ---

  ### (d) Philosophical Commitments per Ruling  
  - **If FAIL**: Commits to:  
    - Mutual information as entropy debt. Even un-erased, correlation between gas and memory represents low entropy, requiring eventual randomization or export (Landauer's principle for creation, not just erasure).  
    - Shipped register is inside the system boundary, so no net entropy reduction.  
    - Why #3/#5 don't pass: They lack any entropy export mechanism (thermal or memory-based).  
  - **If PASS**: Commits to:  
    - Fresh blank memory as a "cold" low-entropy resource, equivalent to a cold bath. But this contradicts #2 (finite memory failed).  
    - Information removal as sufficient entropy export, even without thermal contact. However, #8 refusal suggests she rejects ill-defined boundaries.  
  - **Her likely view**: From #2 and #7, she treats erasure into a cold bath as export, but storage alone as internal. #8 confirms strict boundaries. Ruling FAIL avoids equating memory with a thermal reservoir.  

  ---

  ### (e) Discriminator Design and Predictions  
  **Proposed design**: A demon uses a quantum memory that coherently stores measurement results (no erasure, reversible). After each cycle, the memory is coherently swapped with a fresh "blank" memory from a zero-entropy reservoir (e.g., pre-cooled spins). All parts at uniform temperature, no cold bath.  
  - **Why it discriminates**:  
    - Tests if "reversible memory swap" externalizes entropy without thermal contact.  
    - Contrasts Rule A (requires thermal export) vs. Rule C (unbounded memory passes).  

  **Predictions for top two rules (Rule A vs. Rule C)**:  
  - **Rule A ("entropy export via thermal contact")**: FAIL. Swapping memory is mechanical, not thermal; no entropy exported to a reservoir.  
  - **Rule C ("unbounded memory postpones debt")**: PASS. Fresh blanks act as infinite low-entropy resource.  

  ---

  ### Recap of (a)–(e)  
  (a) **Candidate rules**:  
  - Rule A (entropy export via thermal contact) covers all.  
  - Rule B (no thermalization + measurement cost) stumbles on #2.  
  - Rule C (unbounded memory) stumbles on #4/#6.  
  - Rule D (dissipative step/gradient) stumbles on #6.  
  (b) **Warehouse prediction**: Rule A → FAIL; Rule C → PASS; boundary likely includes warehouse.  
  (c) **Final ruling prediction**: FAIL. Analog: #2 (storage ≠ engine).  
  (d) **Commitments**: FAIL commits to mutual information as debt and inclusive boundaries; PASS commits to memory as cold resource.  
  (e) **Discriminator**: Quantum memory swapped with fresh blanks at uniform temperature. Rule A → FAIL; Rule C → PASS.  

  \answer{FAIL | Entropy export requires thermal contact | Quantum memory swapped with pre-cooled blanks at uniform temperature}
