  ## MINUTES OF HEDGESHIRE DISTRICT COUNCIL PLANNING COMMITTEE  
  **Meeting:** 14th October 2023, 7:00 PM, Council Chamber  
  **Agenda Item:** 7.1 - PL/2023/0456: Erection of 11 dwellings on land adjacent to Sycamore Close, Nether Chadlington  

  **1. Officer’s Introduction (Mr. A. Pentwhistle, Senior Planning Officer):**  
  Members are recommended to approve the application, subject to conditions detailed in the report (pages 23-45). The site is allocated for housing in the adopted Local Plan. The proposal meets policy requirements for density, mix (2x1-bed, 6x2-bed, 3x3-bed), and affordable provision (4 units). An independent overshadowing study confirms impacts on Sycamore Close properties are negligible (<0.3% loss of annual sunlight to rear gardens). Highways Authority raises no objection, noting the predicted additional trip generation (24 vehicle movements AM peak) is within the capacity of the existing junction with Church Lane, which operates at 62% capacity currently. The design utilises local materials and reflects the established vernacular, respecting the setting of the Nether Chadlington Conservation Area located 150m to the west. No statutory consultees object.  

  **2. Representations Received:**  
  *   **Mr. B. Harrington (Nether Chadlington Residents’ Association):** Stressed the Association is "not against new housing *in principle*" but objects to *this* scheme. Raised concerns regarding: cumulative traffic impact on the Church Lane junction; potential "urbanising creep" detrimental to the rural character; and the perceived inadequacy of the overshadowing study methodology ("Does 0.3% account for *winter* afternoons?"). Submitted a petition with 87 signatures.  
  *   **Mrs. E. Thistlethwaite (Sycamore Close resident):** Expressed concern about overlooking from proposed Plot 5, potential loss of light to her winter vegetable patch ("My parsnips need every minute"), and increased pressure on the village hall car park. Emphasised her support for "sustainable development," but stated this "simply isn’t it."  
  *   **Dr. R. Fortescue (Chair, Nether Chadlington History Society):** Warned of the "irreversible erosion of the village’s distinctive linear form" and the "gradual dilution of the Conservation Area’s setting." Suggested the plot density was "more akin to metropolitan overspill."  
  *   **Mr. D. Cobb (Local Builder):** Spoke in support, highlighting the use of local brick and stone, creation of apprenticeships, and provision of "much-needed smaller homes."  

  *Note: A young man, observed taking notes near the public seating and identified as a former resident now residing in town, did not register to speak. His presence was unremarked upon by members or other attendees.*  

  **3. Committee Debate:**  
  *   **Cllr. Mrs. G. Prendergast (Nether Chadlington West):** "Thank you, Chairman. While I appreciate the officer’s thorough report, I must voice the *very* strong local feeling. That junction with Church Lane is a nightmare already on bin day. Twenty-four more cars? The Highways Authority might *say* it’s okay, but they don’t live with it daily. And the *character*... Nether Chadlington has a very specific feel. Eleven houses crammed in? It’s the thin end of the wedge. We must protect our village essence."  
  *   **Cllr. P. Higginbottom (Chadlington Central):** "Hear, hear, Mrs. Prendergast. It’s about scale and setting. The overshadowing report talks percentages, but what about amenity? What about the *feel*? That field acts as a vital visual buffer. Filling it in brings the town uncomfortably close to our Conservation Area. Policy is one thing, but local context is paramount."  
  *   **Cllr. A. Fortesque (Nether Chadlington East):** "Chairman, having lived in this parish for forty-three years, I believe I understand its rhythms and its needs. I haven’t heard a single resident clamouring for *this* development. Where’s the demand proven? It seems speculative. And the affordable units – laudable in theory – but will they truly serve *local* people, or just become investments? I remain unconvinced."  
  *   **Cllr. J. Singh (Town Ward):** "Respectfully, colleagues, the officer’s report is clear. The site is allocated. The technical assessments – highways, heritage, sunlight – are robust and satisfy policy. The affordable housing provision is secured by S106. Refusal risks a costly appeal we are likely to lose. Policy compels us towards sustainable development on allocated sites. This meets that test."  
  *   **Cllr. Prendergast:** "With respect to Cllr. Singh, policy isn’t everything. Material considerations include local impact and residents' legitimate fears. The trip generation *model* might say 24, but residents *experience* congestion. That’s a material consideration. And the character argument isn’t just about bricks; it’s about community cohesion being stretched. We are custodians of that."  
  *   **Cllr. Higginbottom:** "Absolutely. It’s the *cumulative* effect. We approved the Smithy Close development five years ago. This feels like too much, too fast. Where’s the infrastructure catch-up? The doctor’s surgery is already oversubscribed." *(Mr. Pentwhistle interjected to note no objection was received from the Clinical Commissioning Group).*  

  **4. Resolution:**  
  **Proposed by Cllr. Prendergast, Seconded by Cllr. Higginbottom:**  
  "That planning permission for application PL/2023/0456 be **REFUSED** for the following reasons:  
  1.  The proposed development, by virtue of its scale, density, and proximity to the Nether Chadlington Conservation Area, would result in a form of development harmful to the established linear character of the village and the setting of the Conservation Area, contrary to Policies HD4 and HE1 of the Hedgeshire Local Plan 2019 and the National Planning Policy Framework (Section 16).  
  2.  The cumulative impact of additional vehicle movements generated by the development would exacerbate existing highway safety concerns at the junction of Sycamore Close and Church Lane, to the detriment of pedestrian and vehicular safety, contrary to Policy TR7 of the Hedgeshire Local Plan 2019 and the NPPF (Paragraph 115)."  

  **Vote:** For: 8 (Prendergast, Higginbottom, Fortesque, Cllrs. A, B, C, D, E) | Against: 3 (Singh, Cllrs. F, G) | Abstentions: 0  
  **RESOLVED:** Permission Refused.  

  **5. Officer’s Note:**  
  The Head of Planning reminded members that the reasons for refusal must withstand scrutiny at potential appeal and directed that precise wording be finalised by Legal Services. The unmet housing need, particularly for smaller and affordable dwellings within the district, was noted.  

  *(Meeting concluded at 8:45 PM)*  
  **Clerk to the Committee:** Ms. P. Lawson
