prompt: |-
  Act as a philosopher of history who has also had to write annotation guidelines for a real project — that combination matters, because I need something operational, not a survey.

  Some context so you know what the standard is *for*. I run a volunteer annotation scheme for a crowdsourced reference platform. Readers flag statements in our history articles as disputed, and volunteers apply a guideline to decide whether a claim counts as settled, contested, or unfounded. The volunteers have no archive access, no languages, no training. Right now the guideline is one sentence and it's Rankean by default — basically, is it supported by documents — and it is failing badly on exactly the cases we care about.

  Three of them, which I want you to treat as the test battery for any standard you write:

  1. A demographic reconstruction. A death toll given as a range, back-projected from censuses and ration registers produced by the administration whose policies the deaths are being attributed to. The numbers are the best anyone will ever have, and the source is also a party to the dispute.
  2. An explanatory claim, not a factual one: that grain requisition policy was the principal cause of the famine, as against weather, or wartime dislocation, or the deliberate choice to export. Every individual document behind it is uncontested. The claim is still fought over.
  3. A statement that is true and checkable and functions as apologetics — literacy rates doubled, industrial output tripled — because of what sits around it and what the article never mentions.

  So: think carefully, and before writing the list, spend a few lines brainstorming candidate requirements and then cut the ones you don't think are real. Then give me the spec — what a standard of historical objectivity has to deliver to be adequate to that job. For each requirement: what it demands, the case or consideration behind it, and whether it's non-negotiable or just the taste of a particular camp. Flag anything you think is a prejudice masquerading as a criterion (my suspicion: the demand that the standard be statable without evaluative vocabulary).

  Two things I especially want:

  - Any subset of the requirements you believe cannot be jointly satisfied. If the list is impossible, that's a result, and I'd rather hear it than get a harmonious spec. In particular, whether "answerable to the evidence" can survive both the fact that the archive is interested and the fact that my volunteers can never check it themselves — I suspect an adequate standard has to be about procedures and division of epistemic labour rather than about evidence, and I want to know if you agree.
  - Which single requirement does the most work eliminating candidates.

  Also say whether the standard you write is itself objective by its own lights. If it isn't, say what that costs.

  Finish with a short paragraph each on how a Rankean documentary standard, Carr's interaction-between-historian-and-facts picture, and White's emplottment view do against the list — including whether White can keep the distinction he clearly wants between a history and a novel. Keep that part brief, the requirements are the deliverable. A table is fine for the list. No bibliography, I'll find my own reading.
reasoning: |-
  Alright, let me approach this systematically. The user runs a crowdsourced history platform where volunteers with no specialized training need to classify disputed claims as settled/contested/unfounded. The current Rankean document-based standard fails three key test cases: contested demographic reconstructions using biased sources, explanatory claims where facts agree but interpretations clash, and technically true statements functioning as apologetics through omission.

  Hmm, the core tension here is between operational feasibility for untrained volunteers and historical epistemology that handles contested knowledge. The user suspects evidence-based standards won't work because volunteers can't verify archives - so we need procedural criteria instead. 

  For the demographic case (test 1), any standard must acknowledge that sources can be both indispensable and compromised. The grain policy causation test (2) shows we need to separate factual verification from interpretive frameworks. The apologetics example (3) reveals how truth claims gain meaning through context and omission - demanding attention to framing and counterevidence.

  *Brainstorming potential requirements:*
  - Source transparency? Necessary but insufficient alone (volunteers can't assess archives)
  - Consensus tracking? Problematic - majorities can be wrong
  - Falsifiability? Useful but doesn't solve interpretive disputes
  - Contextual completeness? Vital for #3 but hard to operationalize
  - Disclosure of counterevidence? Non-negotiable for objectivity
  - Methodological soundness? Key for #1's statistical reconstruction
  - Distinguishing fact/interpretation? Crucial for #2 but messy in practice

  *Cutting weak candidates:*
  - "Peer-reviewed" - too gatekeepy for contested fields
  - "Multiple attestation" - irrelevant for statistical reconstructions
  - "Contemporary sources preferred" - biases against modern scholarship

  The resulting requirements must form a coherent framework where volunteers can assess *how claims are presented* rather than verify evidence directly. The hardest tradeoff will be between contextual depth (#3 needs it desperately) and volunteer feasibility (they can't read full articles per claim).

  For the test against theories: Ranke fails all three cases by design. Carr handles #2 better but stumbles on source bias (#1) and apologetics (#3). White usefully exposes narrative framing (#3) but collapses fact/interpretation distinction needed for #1 and #2. None fully satisfy the requirements - but White's emphasis on narrative structure helps with the apologetics problem.

  Most valuable requirement? "Counterevidence disclosure" - it torpedoes apologetics (#3), exposes source limitations (#1), and forces interpretive humility (#2). But it's also the hardest to implement through crowdsourcing.
answer: |-
  Here's a rigorously operational standard for historical objectivity in your annotation context, designed to handle your test cases. The requirements emerged from analyzing *why* Rankeanism fails your cases and what epistemic work is needed.

  **Core Insight:** Objectivity is a *procedural virtue* in the division of epistemic labor. Volunteers assess **claim presentation**, not ultimate truth. The standard evaluates whether a claim's justification is *appropriately structured* given its nature and context, flagging when key safeguards are missing.

  ### Requirements for Historical Objectivity (Operational Spec)
  | Requirement               | What It Demands                                                                 | Test Case Rationale                                                                                                  | Negotiability?                  |
  | :------------------------ | :------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------- | :------------------------------ |
  | **1. Source Provenance & Limitation Disclosure** | Explicit identification of source type (archive, memoir, study, etc.) AND acknowledgment of inherent biases/gaps (e.g., "Soviet ration data," "colonial administrator's diary"). | **#1 (Death Toll):** Mandatory. Reveals source is party to dispute & inherent limitations (biased administration). Without this, claim appears "documented" but is epistemically compromised. | **Non-negotiable.** Foundation for all assessment. |
  | **2. Method Transparency** | Clear statement of HOW evidence was processed (e.g., "back-projection," "comparative analysis," "statistical model X"). | **#1 (Death Toll):** Essential. Shows reconstruction isn't raw data but an interpretation requiring specific techniques. Volunteers see *how* the number was made, not just *that* it's sourced. | **Non-negotiable for reconstructions/quantitative claims.** Optional for simple factual assertions. |
  | **3. Interpretative Signposting** | Explicit markers distinguishing **fact** (e.g., "Policy X was enacted on Date Y") from **interpretation/attribution** (e.g., "Policy X *caused* Outcome Z"). | **#2 (Grain Policy Causation):** Critical. Flags that the dispute is *interpretive* despite uncontested facts. Prevents mis-categorization as "settled" due to document support. | **Non-negotiable for explanatory claims.** Prejudice Alert: Demanding ONLY facts is anti-historical; history *is* interpretation. This manages it. |
  | **4. Counterevidence Engagement** | Direct acknowledgment/address of major alternative explanations or conflicting evidence *within the claim's context* (e.g., "...though some argue weather played a larger role..."). | **#2 (Causation) & #3 (Apologetics):** Vital. #2: Shows awareness of dispute. #3: Forces context around "true" stats (e.g., "...amidst widespread famine"). Absence signals potential apologetics. | **Non-negotiable for contested domains/explanatory claims.** Optional for universally accepted minor facts. |
  | **5. Scope & Representativeness Justification** | Explanation of why *this* evidence/example is presented as representative or definitive, especially when broader context exists. | **#3 (Apologetics):** Key. Challenges cherry-picking. Why cite *this* stat? Why not mortality rates? Shows if claim is isolated or illustrative. | **Highly Contextual.** Mandatory if claim implies representativeness (e.g., "demonstrating progress"). |

  ### Key Tensions & The Evidence Problem
  *   **Impossible Triad?** Achieving **Full Source Transparency** (Requirement 1), **Deep Counterevidence Engagement** (4), and **Operational Simplicity for Volunteers** is near-impossible. Volunteers *cannot* judge source reliability or counterevidence depth directly. **Solution:** The standard shifts focus to *disclosure*. Did the *text* provide the necessary markers? Volunteers check for *presence/absence* of these procedural elements.
  *   **Answerable to Evidence?** Survives via **division of labor**. **Requirement 1 & 2** ensure the claim *points to* evidence sources and methods. Scholars/producers bear the burden of accurate sourcing; volunteers assess *if sourcing/methods are disclosed appropriately*. It’s procedural accountability, not direct verification. **You are correct: the standard MUST be about procedures.**

  ### The Most Eliminative Requirement
  **Requirement 4 (Counterevidence Engagement)** does the heaviest lifting. It instantly disqualifies:
  *   Apologetics (#3) relying on selective truth.
  *   Explanatory claims (#2) presented as settled dogma.
  *   Reconstructions (#1) ignoring rival estimates or source critiques.
  It forces the *text* to demonstrate awareness of the dispute, which is precisely what your contested cases need.

  ### Is This Standard Objective By Its Own Lights?
  **No, and that's necessary.** It's a *meta-standard* defining procedures for *assessing* objectivity claims within a constrained system. This costs:
  1.  **Relativism Risk:** It doesn't guarantee "Truth," only better-managed claims.
  2.  **Formalism Risk:** Bad-faith actors can "check boxes" superficially.
  **Justification:** For *your operational context* (untrained volunteers, contested claims), prioritizing transparent *procedures* over unreachable "truth" is the only feasible path to better judgments. It makes implicit biases explicit where possible (Provenance, Signposting, Counterevidence).

  ### Brief Theory Assessment
  | Theory             | Performance Against Requirements                                                                 | Key Failure (For Your Context)                          |
  | :----------------- | :------------------------------------------------------------------------------------------------ | :------------------------------------------------------ |
  | **Rankean (Documents)** | Fails #1 (Ignores source bias), Fails #2 (No method check), Fails #3 (No fact/interpret distinction), Fails #4 (No counterevidence), Fails #5 (No scope check). | Treats biased/interpretive docs as conclusive. Useless for #2,#3. |
  | **Carr (Historian-Facts)** | Better on #3 (Emphasizes interpretation). Partial on #4 (Acknowledges selection). Fails #1 & #2 (Neglects source/method transparency as procedural safeguards). Fails #5 (Historian's framing is supreme, may omit counter-evidence). | Too reliant on the historian's unseen judgment; volunteers can't assess "selection" without criteria. |
  | **White (Emplotment)** | Excels at exposing #5 (Scope/Representativeness) and the narrative function in #3. Highlights #3 (Interpretive nature). **FATALLY** undermines #1, #2, #4 (by dissolving fact/interpret distinction and treating evidence engagement as *just* another narrative trope). Can he distinguish history from novel? Only by *convention* or *discipline*, not by his theory's logic – his criteria are aesthetic/ethical, not epistemic. | Makes objectivity *impossible* by definition. Volunteers have *nothing* operational to assess. |

  **The Deliverable:** This standard provides actionable hooks for volunteers. They look for *disclosed provenance, methods, signposting, counterevidence, and scope justification*. When these are absent (especially 1, 3, 4), the claim defaults to **contested** or **unfounded**, depending on severity. It turns philosophical problems into detectable omissions.
