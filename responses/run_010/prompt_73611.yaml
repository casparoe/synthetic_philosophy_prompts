  ### Verdict on Your Intuition
  Your intuition—*"informational cascade is a consensus protocol that forfeits validity"*—is **roughly right with a correctable distortion**. 

  - **Correct**: It achieves agreement and termination while lacking external validity. Messages carry decisions, not evidence, preventing validity recovery.
    
  - **Distortion**: 
    1. **Validity double-duty**: In standard consensus, validity means "output is some node's input." Cascades *satisfy* this (outputs derive from early inputs). Your "forfeited validity" implicitly references *external truth*, which the framework doesn't natively support.
    2. **Role of evidence**: Consensus protocols often preserve evidence (e.g., via quorums of signed messages); cascades discard it, making lock-in irreversible without external resets.

  - **Correction**: Reframe as: cascades are consensus protocols with a **truncated payload** (only decisions, no evidence) and **no external validity primitive**. This creates a "validity vulnerability" to initial inputs, resolvable only by out-of-band mechanisms (e.g., public announcements as failure detectors). The distortion resolves by explicitly separating internal/external validity.
