  ### Addressing Pressures
  1. **Total-order assumption**: Yes, social-learning assumes total-order broadcast without cost. In distributed systems, this is circular—total-order broadcast *requires* consensus, so they assume away the problem. Translation must accept this as given, noting it hides complexity.
     
  2. **Validity gap**: Substantive. Standard validity (output is some node's input) is *distinct* from external truth. Cascade models satisfy the former but not the latter. This is a framework defect—distributed systems lacks machinery for external validity, conflating it with internal proposals.

  3. **Fault model**: Agents here are "correct but misled"—they follow the protocol but output incorrectly due to limited information or incentives. This fits no existing fault type (crash/omission/Byzantine). It reveals a defect: distributed systems assumes faults are behavioral (nodes deviate), not informational (nodes rational but underinformed).

  4. **Reverse sharpening**: 
     - **Safety/liveness**: Cleanly separates cascade guarantees (safety: suffix-agreement; liveness: termination always, validity only for unbounded signals). Social-learning often conflates these.
     - **Partial synchrony**: Unused here, but if applied, could model public announcements as synchrony pulses that reset cascades.
     - **Protocol/fault separation**: Social-learning blames "rationality" for failures, but explicitly separating protocol rules (e.g., "ignore signal after two agrees") from fault models (none) clarifies that errors stem from design, not node misbehavior.

