  ### Common Mistakes and Deductions

  | Mistake | Deduction | Reason |
  |---------|----------|--------|
  | "A should always set \(P_n(\psi_n) = 1/2\) to avoid exploitation." | -1 in (b) | Ignores discontinuous trader can still exploit: profit ≥ 0.5/day → ∞. |
  | "The problem is that logical omniscience requires knowing all theorems, but theoremhood is undecidable." | -2 in (d) | Misdiagnoses issue. Timeliness (ii) is about finite computation, not undecidability per se. |
  | "Limit coherence (i) forces \(P_n(\psi_n) \to 1/2\), so errors vanish." | -2 in (b)/(c) | Confuses limit prices. (i) requires convergence, not to 1/2; \(P_\infty(\psi_n)\) is 0 or 1. |
  | "Traders are continuous to avoid Dutch books, not computation." | -1 in (d) | Misses motivation: Continuity reflects feasible computation under uncertainty. |
  | "In (a), profit is always 0.5, but not > 0.5." | -1 in (a) | Fails case split: If \(p > 0.5\), profit = \(p > 0.5\). |
  | "Cumulative profit bounded in (b) without specifying how A sets prices." | -1 in (b) | Omits A's adaptive choice of \(p_n\) based on trader. |
  | "\(\psi_n\) causes a liar paradox." | -2 in (c) | No: Each \(\psi_n\) is a distinct sentence with a fixed truth value post-pricing. |
  | "Knowledge of \(\psi_n\)'s truth lets A set non-exploited prices." | -2 in (d) | Contradicted by (a): Any price is exploited by discontinuous traders. A cannot preempt trade. |
