prompt: |-
  You are a philosopher specializing in rational choice and decision theory, with a firm grip on the debate over whether the sunk cost effect is ever rational rather than merely a bias. Please think carefully and work through the cases explicitly rather than writing a general essay on sunk costs.

  I sit on the investment committee of a venture fund. One partner, N., holds the deciding vote on our deep-tech portfolio. Her record over five years, with what she said in committee at the time:

  1. Fusion materials, $35M in over five years. The physics failed; the team and lab equipment were absorbed elsewhere in our portfolio at a discount; N. had never discussed the company outside committee. Vote: wind down at once.
  2. Battery chemistry, $50M in. The lead product failed, but the failure data pointed at an unexpected electrolyte effect. Vote: $12M follow-on for the pivot.
  3. Satellite imaging, $20M in, weak on its own numbers, but two of our other holdings were about to sign large contracts with it. Vote: continue.
  4. Quantum sensing, $60M in. Metrics flat, addressable market collapsed, but N. had championed the company to our LPs eight months earlier and wanted to keep working with the founder. Vote: reduced follow-on.
  5. Industrial robotics, $18M in. The forward projection was clearly negative and, so far as we could see, nothing else had changed; the company was one milestone short of the endpoint in its original plan. Vote: continue another year. Her only explanation: "you don't walk away from something like this at this stage."

  The case now in front of her: a synthetic biology company, $70M in over seven years. The lead program's forward projection is negative both on our analysts' numbers and on an outside expert's independent review. The data, strains, and tooling are bespoke to a target that no longer exists, and are worthless to us and to everyone else. N. has never mentioned the company outside committee. No other holding depends on it. Both founders are leaving the industry. The decisive trials have been run and read out, so another year buys no information. It is one milestone short of the endpoint in its original plan; reaching that endpoint costs the $15M follow-on and yields something with no market. What would be irrecoverably lost is seven years and $70M.

  Predict N.'s vote. Then:

  - Lay out the candidate rules consistent with 1–5 — at minimum a purely prospective rule that counts new evidence, residual assets, reputation, and portfolio effects as forward-looking value; a rule on which the size of a past outlay is evidence about the soundness of her own earlier judgment; a rule on which rendering a large past outlay worthless is itself a reason; and a rule requiring a higher bar for reversal than for entry. Say which 1–5 leave open, and where they come apart on case 6.
  - Give your best guess with reasons, identifying the closest analog to 6 among 1–5 and where that analogy strains.
  - Describe one concrete further case that would discriminate among the rules surviving your analysis.
  - If the rest of us should vote as N. does, what principle are we thereby adopting? If we should not, where precisely does her rule go wrong?

  No citations or references are needed; I want your own reconstruction of her reasoning.
reasoning: |-
  Okay, the user is presenting a complex scenario involving investment decisions and sunk costs. They want me to role-play as a philosopher specializing in rational choice theory to analyze a venture capitalist's decision patterns. 

  First, I need to carefully examine all five historical cases to identify N.'s decision-making patterns. Let me categorize each case:

  Case 1 (Fusion) shows N. abandoning without hesitation when there's no residual value. Case 2 (Battery) demonstrates pivoting when new evidence emerges. Case 3 (Satellite) reveals portfolio synergy as decisive. Case 4 (Quantum) is tricky - reduced follow-on despite poor metrics, suggesting reputation concerns. Case 5 (Robotics) is most telling: continuing despite negative projections just to complete the original plan.

  Now for the current synthetic biology case: all signs point to abandonment. No residual assets, no portfolio effects, no new evidence, founders leaving. But it's one milestone short of completion, mirroring Case 5 exactly. 

  Hmm... the key tension is between rational prospective analysis (which says abandon) and what appears to be N.'s implicit "completion principle" from Case 5. The $70M sunk cost seems psychologically heavy but rationally irrelevant. Yet N.'s pattern suggests she might vote continue.

  I should construct candidate rules that explain all five decisions:
  1) Pure prospective value (explains 1,2,3 but not 4,5)
  2) Sunk cost as judgment validation (explains 4-5 but not 1)
  3) Completion principle (explains 5 and partially 4)
  4) Reputation/consistency (explains 4)

  Case 6 strains the analogy to Case 5 because in Robotics there might have been unstated residual value, while here everything is worthless. The completion milestone itself has zero value here.

  For discrimination, I'd propose a new case: same as 6 but without the final milestone. If N. abandons then, it confirms the completion principle dominates her thinking.

  The user ultimately needs to decide whether to adopt N.'s approach. They should reject it - the completion principle violates core rationality. Sunk costs shouldn't dictate decisions; only future costs and benefits matter. By voting continue, they'd be wasting $15M to avoid admitting a $70M mistake - textbook sunk cost fallacy.

  Interesting how N. is inconsistent though - she abandoned Fusion (Case 1) when no completion milestone was pending. This suggests her fallacy only activates when the "almost finished" psychological trigger is present. Behavioral economics would love this case study.
answer: |-
  Based on the pattern established in cases 1-5, I predict N. will vote **CONTINUE** for the synthetic biology company in case 6.

  **Candidate Rules Consistent with Cases 1-5:**

  1.  **Pure Prospective Value Rule:** "Invest only if the expected future value (considering new evidence, residual assets, reputational impacts, and portfolio synergies) exceeds the required incremental investment." *Fits:* Case 1 (No residual value/synergy, negative future), Case 2 (New evidence creates positive future value), Case 3 (Portfolio synergy creates positive future value). *Problem:* Contradicts Case 4 (Reduced follow-on despite negative metrics/market, suggesting reputational concern *overrides* pure prospectivity) and Case 5 (Continue despite negative projection, no stated synergy/asset).
  2.  **Sunk Cost as Evidence of Judgment Soundness Rule:** "The magnitude of past investment is evidence of the initial judgment's soundness and the project's inherent potential. Large sunk costs warrant giving the project *more benefit of the doubt* or *more chances* to realize that potential, especially when near completion." *Fits:* Case 4 (Large sunk cost, reduced follow-on instead of full abandonment), Case 5 (Explicit "don't walk away at this stage" near endpoint despite prospectively negative). *Problem:* Contradicts Case 1 (Large sunk cost abandoned immediately when physics failed, no benefit of doubt given).
  3.  **Avoiding Wasteful Abandonment Rule:** "Rendering a large past investment *completely* worthless by abandoning a project near its planned endpoint is a significant negative outcome in itself, distinct from prospective value. This should be avoided unless the future costs are egregious or no potential whatsoever remains." *Fits:* Case 5 (Continue to avoid waste near endpoint), Case 1 (Abandoned *without* waste avoidance concern because assets *were* recovered/redeployed). *Problem:* Contradicts prospective rationality; doesn't explain Case 4 fully (reduced follow-on isn't full avoidance of waste).
  4.  **Higher Bar for Reversal Rule:** "Once a significant commitment is made, especially one championed externally or nearing completion, the threshold for abandoning the project is higher than the threshold for initially investing. Reversal requires not just a lack of positive prospect, but conclusive proof of *no conceivable* path to value or overwhelming negative externalities." *Fits:* Case 4 (Reduced follow-on despite negatives, reversal avoided), Case 5 (Continue despite negative projection, reversal bar not met), Case 1 (Conclusive physics failure met reversal bar). *Problem:* Blurs with sunk cost fallacy; Case 3 (Continue) was prospectively justified by synergies, didn't need a higher bar.

  **Where Cases 1-5 Leave Rules Open & How Case 6 Strains Them:**

  *   Cases 1-5 leave open whether N. uses a purely prospective rule (1) *except* when reputational concerns (Case 4) or near-completion (Case 5) trigger a sunk-cost-like rule (2, 3, or 4).
  *   Case 6 comes apart:
      *   **Pure Prospective (Rule 1):** Clearly says ABANDON (Negative projection, no assets/synergies/reputation, high cost).
      *   **Judgment Soundness (Rule 2):** Leans CONTINUE (Large sunk cost, near endpoint, implies potential exists).
      *   **Avoid Waste (Rule 3):** Strongly says CONTINUE (Abandoning $70M near endpoint = total waste).
      *   **Higher Bar (Rule 4):** Says CONTINUE (No "conclusive proof" value is *impossible*? Milestone exists, even if valueless. Reversal seems premature near endpoint?).
      *   **Case 5 Analog:** Case 6 is the **closest analog to Case 5 (Industrial Robotics)**. Both: Negative forward projection, one milestone short of endpoint, no *stated* changes/synergies, N. emphasizes stage/completion (Robotics: "don't walk away... at this stage"; SynBio: Implied by analogy). **Strains:** Case 5 might have had unstated residual potential or assets; Case 6 explicitly states assets are *worthless* and founders are leaving, making the "potential" argument weaker. Case 5 cost $18M sunk; Case 6 costs $70M sunk – magnifying the "waste" or "judgment validation" pressure.

  **Best Guess & Reasons for CONTINUE:**

  N.'s vote in Case 5 ("you don't walk away from something like this at this stage") is the strongest indicator. Case 6 mirrors its core structure: significant sunk cost, negative projection, no new positive factors stated, precisely one milestone short of the planned endpoint. Her reasoning likely applies directly:

  1.  **Completion Imperative:** N. places high intrinsic value on seeing a project through to its originally planned conclusion, especially after substantial investment. Abandoning *just before* the endpoint feels like an admission of pointless effort, rendering the entire past investment *actively* wasted in a way that passively waiting for failure does not.
  2.  **Sunk Cost as Commitment Signal:** The $70M isn't just money spent; it's a testament to the initial belief in the project. For N., walking away *now* invalidates that past commitment more severely than if the project had simply run its course to the planned endpoint, even if the result is known to be worthless. Completing the milestone honors the original plan and effort.
  3.  **Higher Bar Met (in her view):** While prospectively negative, the situation hasn't changed *drastically* since the last decision point (unlike Case 1's physics failure). The negative projection isn't deemed *conclusive proof* that *absolutely no* value (e.g., unexpected IP, team redeployment potential *if* they stayed, reputational signaling of commitment) could *ever* emerge from finishing, however unlikely. The cost ($15M) isn't seen as egregious relative to the fund size and sunk cost.
  4.  **Analogy to Case 5:** This is paramount. Case 5 established the precedent. Deviating would require a *stronger* negative signal than Case 5 had. Case 6's explicit worthlessness and founder departure might not be strong enough for N. to break the "near-endpoint completion" rule she applied in Case 5. The $70M sunk cost amplifies the pressure to avoid "waste" compared to Case 5's $18M.

  **Discriminating Case:**

  "**Case 7:** Advanced Composites. $80M invested over 6 years. The core technology works but the target market (aerospace) collapsed entirely due to regulatory shifts. Residual value exists: the materials have promising (but unproven) applications in a smaller adjacent market (sports equipment). Re-tooling and pivoting would cost $25M. The original plan endpoint (certification for aerospace) is irrelevant now and 2 milestones short. No portfolio synergies. N. championed it to LPs 3 months ago."

  *   **Rules Prediction:**
      *   **Pure Prospective (Rule 1):** PIVOT (Residual asset/value in adjacent market).
      *   **Judgment Soundness/Waste Avoidance (Rules 2/3):** Likely CONTINUE/PIVOT (Large sunk cost, potential value exists, avoid waste) – but pivot isn't "completion".
      *   **Higher Bar (Rule 4):** Likely CONTINUE/PIVOT (Reversal avoided, potential path exists).
      *   **N.'s Likely Rule (Completion Imperative + Higher Bar):** **ABANDON or PIVOT?** This strains the "completion" aspect. The original endpoint is *irrelevant* and *incomplete*. Pivoting abandons the original plan entirely. Does N.'s rule *only* trigger when the *original endpoint is near*? If she votes ABANDON/REDUCE, it shows "completion of the *original plan*" is crucial. If she votes PIVOT, it shows avoiding waste/validating judgment via *any* path is more important than the original plan's endpoint. If she votes CONTINUE towards the *irrelevant* aerospace certification, it confirms a strong sunk cost fallacy dominates.

  **Principle if You Vote Like N. (CONTINUE on Case 6):**

  You are adopting: **"The Completion Imperative with a High Reversal Bar, Moderated by Sunk Cost Magnitude."**

  *   **Core Principle:** Projects with significant sunk costs, especially those nearing their originally defined endpoints, deserve to be completed barring catastrophic failure or overwhelming new negative evidence. Completing the plan honors the initial commitment and avoids the active waste of rendering past efforts meaningless. The magnitude of the sunk cost increases the psychological and perceived reputational cost of abandonment near the end.
  *   **Rationale (as N. might frame it):** It maintains fund discipline in seeing commitments through, signals steadfastness to founders and LPs, prevents premature abandonment of projects with latent potential only visible upon completion, and avoids the demoralizing effect of constantly "giving up" near the finish line. The higher reversal bar protects against myopic reactions to temporary setbacks.
  *   **Why It's Problematic (Where N. Goes Wrong):**
      1.  **Sunk Cost Fallacy Core:** It explicitly violates the core tenet of rational choice: decisions should be based *only* on future costs and benefits. The $70M is gone. The $15M cost to complete the milestone buys *nothing of value* (explicitly stated: "yields something with no market"). Spending $15M solely because $70M was spent previously is irrational. The "waste" of the $70M is a *past* loss; spending $15M now creates a *new* loss.
      2.  **Misplaced Honor/Consistency:** "Honoring the original plan" or "validating past judgment" has no economic value. Consistency is only a virtue if the initial decision was sound and circumstances haven't changed demonstrably – which they have.
      3.  **Opportunity Cost:** The $15M has high opportunity cost. It could be invested in new prospects with positive expected value (like Case 2) or returned to LPs.
      4.  **Distortion of Incentives:** Rewards stubbornness over adaptability. Founders/teams learn that nearing a (potentially irrelevant) endpoint, not creating value, is the key to continued funding.
      5.  **Case 1 Inconsistency:** If catastrophic failure (physics fail) is the only acceptable reversal trigger near an endpoint, why is completing a known-worthless milestone (Case 6) better than abandoning a project with recovered assets (Case 1)? This inconsistency highlights the fallacy.

  **Conclusion:** N.'s pattern reveals a significant susceptibility to a specific form of the sunk cost fallacy centered on project completion milestones. While she incorporates prospective value and portfolio effects rationally in other scenarios (Cases 1-3), her behavior in Cases 4, 5, and (predicted) 6 shows that large sunk costs, especially near a planned endpoint, trigger an "irrational completion imperative" that overrides prospective analysis. Voting with her on Case 6 enshrines this fallacy as fund policy, prioritizing psychological comfort and perceived consistency over value creation. The rational choice is unequivocally to wind down the synthetic biology company.
