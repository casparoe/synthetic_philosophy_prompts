  ### **Colonial Trade Simulator: Adam Smith's Unseen Costs**  
  *Designed for 14 players (10 Merchants, 4 Citizens) in 90 minutes. No economics jargon during play.*  

  **Core Mechanics & Why Chosen:**  
  I brainstormed three approaches:  
  1. **Auction-Based Monopoly Rights**: Players bid for colonial trade licenses. *Problem*: Too abstract, misses capital distortion and credit chains.  
  2. **Resource Flow Network**: Players move tokens through a physical "trade route" with bottlenecks. *Problem*: Too slow for 14 players; misses political dynamics.  
  3. **Investment Choice with Credit Chains & Socialized Costs** (CHOSEN):  
     - Players choose between high-return/high-risk colonial trade or stable domestic trade.  
     - Colonial trade requires borrowing, creating fragile credit dependencies.  
     - Defense costs are forced on all players via taxes.  
     - **Why**: Forces direct trade-offs between individual profit and group welfare, models cascading failures, and makes reform voting politically tense with minimal rules overhead.  

  ---

  ### **Game Setup**  
  **Roles & Materials**:  
  - **10 Merchants**: Start with 100 tokens each. Can invest in:  
    - **Domestic Trade**: Costs 20 tokens, returns 30 tokens after 1 round (net +10).  
    - **Colonial Trade**: Costs 50 tokens/round, returns 80 tokens after 2 rounds. *Must borrow if unable to pay upfront*.  
  - **4 Citizens**: Start with 100 tokens. Earn 20 tokens/round (fixed income) but cannot trade.  
  - **Tokens**: Gold for income, red for debt. Use poker chips or sticky notes.  
  - **Loan Contracts**: Pre-printed slips ("Lend X tokens to [Player], repay X+10 next round").  
  - **Tax Tokens**: Blue tokens (1 = 5 tokens of tax).  

  **Key Rules**:  
  1. **Borrowing**:  
     - Colonial Merchants can borrow from anyone at 20% interest (e.g., borrow 50, repay 60 next round).  
     - If a loan isn’t repaid, the lender loses the tokens.  
  2. **Defense Costs**:  
     - Total defense cost = 10 tokens per colonial merchant per round.  
     - Paid via taxes: All players (including citizens) pay 5 tokens base tax + equal share of remaining defense costs.  
     - *Example*: 5 colonial merchants → Defense cost = 50 tokens. Total base tax (14 players × 5) = 70 tokens. *Surplus*: 20 tokens split equally (each gets ≈1.4 back).  
  3. **Crisis Trigger**:  
     - After Round 4, the facilitator rolls a die. On 1-3, a random colonial merchant "defaults" (cannot repay loans). Their lenders lose tokens, potentially triggering cascades.  
  4. **Reform Vote**:  
     - **Smith Reform**: Colonial monopoly ends. Colonial returns drop to 60 tokens, defense costs drop to 5 tokens/merchant, and domestic returns rise to 35 tokens (simulates capital reallocation).  
     - **Vote Rules**: All players vote. Colonial merchants can "lobby" by bribing others with tokens (1 token = 1 bribe; max 5 bribes/player). Reform passes if >50% vote "yes."  

  **Payoff Arithmetic**:  
  | **Action**       | Cost         | Return       | Net Profit (Steady State) |  
  |------------------|--------------|--------------|----------------------------|  
  | Domestic Trade   | 20 tokens    | 30 tokens    | +10 tokens/round           |  
  | Colonial Trade   | 50 tokens    | 80 tokens*   | +30 tokens/round (after 2 rounds) |  
  | *Borrowing Fee*  | +20% interest| -            | Effective net: +15 tokens/round after interest |  
  | Citizen Income   | None         | 20 tokens    | +20 tokens/round (pre-tax) |  

  **Colonial Profit Rationale**:  
  - Without borrowing: 80 - 50 = +30/round.  
  - With borrowing (50% probability): Net = 30 - (50 × 20% × 50% chance of borrowing) ≈ +25 tokens. Still beats domestic (+10) and citizen income (+20 pre-tax), creating individual incentive despite systemic risk.  

  **Why Colonial is Group-Inefficient**:  
  - Defense costs = 10 tokens/colonial merchant.  
  - With 5 colonial merchants: 50 tokens lost to defense (vs. 0 for domestic).  
  - Tax burden spreads costs, but colonial merchants keep profits.  
  - *Net group impact*: Colonial trade drains capital from productive uses (Smith’s core argument).  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 minutes**  
  - **0-10 min**: Setup. Assign roles (10 Merchants, 4 Citizens). Distribute tokens. Explain rules:  
    - *Key phrases*: "Colonial trade: high returns but slow and needs loans. Domestic trade: fast and safe. Everyone pays for defense."  
    - *Hide*: "mercantilism," "efficiency," "monopoly."  
  - **10-25 min: Round 1**  
    - Merchants choose colonial or domestic.  
    - Colonial merchants borrow if needed (record loans).  
    - Collect taxes: All pay 5 tokens + defense share.  
    - Resolve returns: Domestic get 30 tokens; colonial get nothing (first round).  
  - **25-40 min: Round 2**  
    - Repeat choices. Colonial merchants from Round 1 get 80 tokens (if they repaid loans).  
    - Cascades begin: Unrepaid loans cause lender losses.  
  - **40-55 min: Rounds 3-4**  
    - Accelerate play (5 min/round). Track credit chains.  
    - After Round 4: Trigger crisis (random colonial default). Lenders lose tokens; cascade if lenders can’t pay their own debts.  
  - **55-65 min: Reform Vote**  
    - Announce Smith reform (read aloud from script).  
    - Colonial merchants lobby: 3 min to bribe others.  
    - Secret ballot vote.  
  - **65-75 min: Round 5 (Post-Vote)**  
    - Play with new rules if reform passed.  
  - **75-90 min: Debrief**  
    - Map game events to Smith’s arguments (see below).  

  ---

  ### **Debrief Script**  
  **Map Game Moments to Smith’s Arguments**:  
  1. **"Individually sensible, group-poor investment"**:  
     - *Game moment*: Merchants chose colonial for +30 tokens, ignoring defense costs.  
     - *Smith*: Capital "pulled out of other employments" into "slow protected trade" (WN IV.vii.c).  
  2. **"Costs spread thin, gains concentrated"**:  
     - *Game moment*: Citizens paid taxes for defense but earned no colonial profits.  
     - *Smith*: Costs "fell upon other orders of men" while merchants gained "exclusive privileges" (WN IV.vii.c.63).  
  3. **"Fragile credit chain"**:  
     - *Game moment*: One default caused lender losses (cascade risk).  
     - *Smith*: Colonial trade relied on "long chains of bills" vulnerable to "rupture" (WN II.iv.15).  
  4. **"Reform blocked by vested interests"**:  
     - *Game moment*: Colonial merchants lobbied to kill reform despite group benefits.  
     - *Smith*: Reform "obvious" but dead because "clamour and sophistry" of merchants overpowers "insulated" citizens (WN IV.vii.c.66).  

  **Introduce Jargon Now**: "This is Smith’s critique of *mercantilism*: monopoly trade distorts capital, socializes costs, and resists reform."  

  ---

  ### **Predictable Problems & Limitations**  
  **What Breaks**:  
  - **Cracking Equilibrium in Round 2**: A player realizes colonial trade is only profitable with *subsidized borrowing*. Rational outcome: Merchants lobby domestic players for low-interest loans (e.g., "Lend me 50 tokens at 10% interest—I’ll share colonial profits!").  
     - *Why*: Colonial net profit (+25) still beats domestic (+10) even with shared gains.  
     - *Fix*: Allow it! Shows how elites co-opt the system (Smith: merchants "order society" to their benefit).  
  - **Citizens Hoard Tokens**: They skip lending to avoid risk, starving colonial merchants of capital.  
     - *Fix*: Add a rule: "Citizens earn 5 extra tokens/round if they lend ≥20 tokens." Incentivizes participation.  

  **What the Game Can’t Capture (Requires Hand Explanation)**:  
  - **Long-Term Capital Drain**: Smith argues colonial trade *permanently* reduces national wealth by diverting capital from productive uses (e.g., manufacturing). The game’s 5 rounds show cyclical drain but not compounding decline.  
  - **Global Trade Effects**: Smith critiques empire as a net drain even *with* monopoly profits. The game assumes colonial trade is profitable pre-reform; Smith implies it’s a net loss when defense/tax costs are included.  
  - **Historical Context**: Smith’s "union" proposal was dead because colonies were seen as *political* assets. The game’s vote focuses on economics, not patriotism or prestige.  

  **Why It Works**: Players *feel* the tension—colonial merchants fight to protect gains, citizens resent taxes, and everyone fears credit chains. No lecture needed.  

  **Materials List**:  
  - Tokens: 500 gold (income), 200 red (debt), 100 blue (tax).  
  - Loan contracts (30 slips).  
  - Role cards (10 Merchant, 4 Citizen).  
  - Calculator for tax/defense math.  

  Run it tight, and they’ll rant about "that lobbyist Anna from Round 4" for weeks—exactly what Smith wanted.
