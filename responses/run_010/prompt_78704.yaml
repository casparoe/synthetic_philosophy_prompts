  2. **Costs spread thin and borne by others**: The costs of defense and the fragility of the system are socialized (borne by all) while the gains are concentrated.

  3. **Credit chain that can cascade**: The colonial trade relies on long chains of credit (bills of exchange) that can break, causing a cascade of failures.

  4. **Reform vote fails**: A Smith-style reform (gradual opening of trade, union, or independence) is economically beneficial but politically unviable because the concentrated beneficiaries (merchants) will block it.

  **Brainstorming Mechanics:**

  Option A: **Auction and Trade Route Game**
  - Players are merchants and non-merchants. Merchants bid for colonial trade routes (which have high returns but are protected). Non-merchants invest in domestic industries. The government (run by the facilitator) provides defense for the colonial trade, paid by taxes on all. There is a credit system where merchants issue bills to each other. If one merchant fails to pay, it can cascade.

  Option B: **Investment and Taxation Game**
  - Players choose between investing in colonial trade (high return, but long cycle and requires defense) or domestic trade (lower return but faster and safer). The colonial trade requires a certain level of total investment to be viable (to simulate the capital drain). Defense costs are shared by all. Credit is represented by a chain of IOUs.

  Option C: **Colonial Trade Chain with Credit**
  - Players are links in a colonial trade chain (e.g., importer, exporter, ship owner, etc.). Each must extend credit to the next. The chain is long and slow. If one player defaults, the whole chain can collapse. Meanwhile, domestic players are in a separate, faster cycle. The monopoly is enforced by the rules (only colonial chain gets monopoly prices). Taxes are levied to pay for defense.

  **Choice**: Option B is more straightforward for 14 players and captures the investment choice and the socialization of costs. We can add a credit chain element to the colonial trade. We'll go with Option B and call it "The Colonial Trade Game".

