  Biggest challenge: prepping answers that sound natural in live debate. The replies can't be thesis-defense dense - must be deliverable in 2-minute bursts. Should flag where counters are "soft" (i.e. where the user knows they're on thin ice). Also need that nightmare question they're praying no one asks... probably about whether their typed relations are just disguised truthmaking. 

