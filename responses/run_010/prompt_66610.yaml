     - Whether a game with a very high RTP (say 120%) and extremely high volatility is desirable for the public. That is a policy question.
     - Whether the game might encourage problem gambling beyond what is typical in lotteries.

   We have designed a procedure that can be run by analysts without economists, within 20 days, and that flags the most extreme cases for commissioner review.
answer: |-
  ### Review Procedure for Open-Ended Prize Games

  **Step 1: Verify Published Odds**  
  - **Question:** Confirm that the stated odds for all prizes (including conditional/open-ended prizes) are mathematically accurate under the game's rules.  
  - **Sufficient Answer:** Documentation showing probability calculations derived from game mechanics (e.g., RNG specifications, ticket pool statistics).  
  - **Failure:** Reject if odds are inconsistent or unverifiable.  
  - **Judgment Call:** Minimal; relies on standard probability checks.

  **Step 2: Test for Expected Value (EV) Convergence**  
  - **Question:** Does the expected payout per ticket converge to a finite value?  
  - **Sufficient Answer:**  
    - Provide a closed-form formula for EV, accounting for all prize structures.  
    - Prove convergence mathematically (e.g., show the series sum or integral converges).  
  - **Failure:** EV diverges to infinity (e.g., St. Petersburg-like dynamics).  
  - **Judgment Call:** Low; pure math. Reject if divergence is proven.

  **Step 3: Incorporate Real-World Constraints**  
  - **Question:** What operational caps exist (e.g., maximum jackpot, time limits, ticket sales ceilings) that bound the open-ended prize?  
  - **Sufficient Answer:**  
    - Explicit caps (e.g., "jackpot stops at $500M").  
    - Implicit caps (e.g., "game ends after 12 months" → max tickets sold = sales rate × 12 mo).  
  - **Failure:** No verifiable constraints → reject (infinite EV risk).  
  - **Judgment Call:** Moderate. Analysts assess reasonableness of caps (e.g., is sales rate plausible?).

  **Step 4: Compute Bounded EV**  
  - **Question:** Using Step 3’s constraints, what is the EV per ticket?  
  - **Sufficient Answer:**  
    - EV calculation with capped jackpot/max sales.  
    - Must include all prizes (e.g., base prizes + max progressive).  
  - **Failure:** EV still diverges → reject.  
  - **Judgment Call:** Low; arithmetic with fixed inputs.

  **Step 5: Risk-to-Player Assessment**  
  - **Question:** Under the capped EV:  
    (a) What is the probability a player loses their entire wager?  
    (b) What is the volatility (standard deviation) of returns?  
    (c) What fraction of tickets win ≥ wager cost ("break-even rate")?  
  - **Sufficient Answer:**  
    - Quantities (a), (b), (c) computed from prize distribution.  
    - No utility curves—use descriptive stats only.  
  - **Referral to Commissioners if:**  
    - Break-even rate ≤ 10% *or*  
    - Standard deviation ≥ 100× ticket price *or*  
    - Loss probability ≥ 90%.  
  - **Judgment Call:** High. Thresholds are policy choices disguised as math.

  **Step 6: Decision**  
  - **Approve:** Steps 1–4 passed, Step 5 not triggered.  
  - **Reject:** Steps 1, 2, 3, or 4 failed.  
  - **Commissioners:** Step 5 triggered. Question: "Is this risk profile acceptable for consumers?"

  **What the Procedure Can’t Settle:**  
  - Whether "acceptable risk" is justified by entertainment value.  
  - If the game exploits cognitive biases (e.g., players overestimating tiny win chances).  
  - Behavioral impacts (e.g., encouraging reckless spending).

  ---

  ### Case 1: Uncapped Progressive Jackpot ($2 Ticket)  
  - **Game:** $1M starting jackpot; +$0.10 per ticket sold; win probability = 1 in 10M.  
  - **Step 1:** Odds verified.  
  - **Step 2:** EV *diverges* if no cap (infinite tickets → infinite jackpot → infinite EV).  
  - **Step 3:** **Operational cap identified:** Game ends after 5 years. Max tickets = 200M (based on sales data). → Max jackpot = $1M + ($0.10 × 200M) = $21M.  
  - **Step 4:** Bounded EV = (Base EV from other prizes) + ($21M × 1/10M) = $1.00 + $2.10 = $3.10.  
  - **Step 5:**  
    - Loss probability: 85% (only jackpot and few base prizes > $2).  
    - Std deviation: $650 (dominated by jackpot volatility).  
    - Break-even rate: 0.00001% (jackpot) + 5% (base) ≈ **5%** → triggers referral (≤10% threshold).  
  - **Outcome:** Refer to commissioners. High loss probability and extreme volatility flag consumer risk.

  ### Case 2: State Lottery ($2 Ticket)  
  - **Existing Game:** $1M starting jackpot; +$0.20 per ticket; win probability = 1 in 20M.  
  - **Step 1:** Odds verified.  
  - **Step 2:** EV diverges uncapped.  
  - **Step 3:** **Cap:** Jackpot capped at $100M (published rules). → Max tickets = ($100M - $1M)/$0.20 = 495M.  
  - **Step 4:** Bounded EV = $0.50 (base) + ($100M × 1/20M) = $0.50 + $5.00 = $5.50.  
  - **Step 5:**  
    - Loss probability: 90% (typical lottery structure).  
    - Std deviation: $22,360 (extreme jackpot volatility).  
    - Break-even rate: 0.000005% (jackpot) + 8% (base) ≈ **8%** → triggers referral (≤10%).  
  - **Outcome:** Refer to commissioners. Mathematically similar to Case 1—high loss risk and near-zero break-even rate.

  ---

  ### Key Judgments and Limitations  
  - **Judgment Calls in Disguise:**  
    - Step 3: Accepting "implied caps" (e.g., is 5 years realistic for sales projections?).  
    - Step 5: Thresholds for referral (8% vs. 10% break-even) are arbitrary policy lines.  
  - **What Math Can’t Resolve:**  
    - Commissioners must decide if 90% loss probability is "acceptable" for a lottery.  
    - No way to quantify "harm" from volatile games—only descriptive stats.  
  - **Reality Check:** Both cases failed Step 5. Your colleague’s St. Petersburg concern is valid for *uncapped* games, but **real-world caps bound EV**. The risk is *not* infinite math—it’s that these games are near-certain losses for most players.
