  We are designing a review procedure for games with effectively open-ended top prizes. The key concerns are:
   1. The expected payout per ticket might not converge (like the St. Petersburg paradox).
   2. Real players have finite bankrolls and might not value the extremely low probability events appropriately.

   The procedure must be feasible within 20 working days without requiring advanced economic modeling.

   Procedure Outline:

   Step 1: Verify Published Odds
     - We already do this, so we'll assume it's done and the odds are accurate.

   Step 2: Check for Convergence of Expected Value (EV)
     - Calculate the expected value per ticket without the progressive or open-ended part to see if it converges without it.
     - Then, incorporate the open-ended part and check if the entire EV converges.

     How to do it:
     - Require the applicant to provide the full prize structure including the progressive mechanism or scaling rules.
     - For each prize tier (including the open-ended one), we have:
          prize_i (which might be a function of ticket sales or a progressive jackpot) and probability p_i.

     - For the open-ended prize, we need to know:
          a) How the prize is determined (e.g., progressive jackpot starting at $X and increasing by a fixed fraction of each ticket sold, or a prize that is a function of total tickets sold).
          b) The probability of winning that prize (which may be fixed or also a function of ticket sales?).

     - We require the applicant to provide a formula for the expected value of the open-ended prize as a function of the current state (if progressive) or total sales.

     - We then compute the expected value per ticket for the entire game. The EV per ticket is:
          EV = Σ [ p_i * prize_i ]   for all prize tiers.

     - If the open-ended prize has an expected value that is finite (i.e., the series converges), then we can compute it and move to Step 3.

     - If the expected value does not converge (i.e., the series diverges to infinity), then we note that the game has an unbounded expected value per ticket in the mathematical sense. However, we must consider real-world constraints.

   Step 3: Real-World Constraints (Finite Bankrolls and Finite Time)
     - We require the applicant to provide:
          a) The maximum number of tickets that can be sold for the game (if applicable) or the maximum time the game will run.
          b) Any caps on the progressive jackpot that might be imposed (even if not advertised as capped) due to operational constraints.

     - If there is a hard cap (even if not advertised) on the top prize, then we can compute the EV using that cap and the procedure moves to Step 4.

     - If there is no hard cap, then we must consider the maximum possible prize given the constraints of the game (e.g., maximum sales or time). We require the applicant to provide a worst-case scenario maximum prize based on:
          - The maximum number of tickets that could be sold (if the game runs until a win, then the progressive might grow until it is won, but the operator must set a maximum run time or maximum sales to avoid indefinite games).
          - The maximum time the game is allowed to run (if any).

     - Using the maximum possible prize, we recalculate the EV for the open-ended prize and then the entire game. If the EV is now finite, we move to Step 4.

     - If even under the maximum possible prize the EV is still not converging (which is unlikely because of the finite constraints) or if the maximum prize is not bounded (e.g., the operator doesn't set a maximum time or sales), then we reject the game because we cannot compute a finite EV.

   Step 4: Assessing Risk to Players
     - Even if the EV is finite, we must consider the risk to players. The St. Petersburg paradox teaches us that even if the EV is finite, the distribution of outcomes might be so skewed that a player would need an extremely large bankroll to realize the EV.

     - We require the applicant to provide:
          a) The probability distribution of the net return (prize - ticket cost) for a single ticket.
          b) The probability of winning at least the cost of the ticket (i.e., break-even or better).

     - We then calculate:
          a) The standard deviation of the net return (if feasible without advanced modeling) to measure volatility.
          b) The probability that a player loses the entire ticket cost (i.e., wins nothing or less than the cost).

     - We also require the applicant to simulate (or provide the mathematical analysis for) the expected loss per ticket and the probability of ruin for a player with a finite bankroll. Specifically:

          Let:
            B = bankroll of a typical player (we need to set a reasonable bankroll; we can use a fixed amount, say $100, or require the applicant to justify the typical bankroll based on market research).

          We then compute:
            - The probability that a player with bankroll B will be ruined (i.e., lose the entire bankroll) if they play until they either run out of money or hit a stopping condition (like winning a prize that is a significant portion of the bankroll). This is complex.

     - Instead, we can use a simpler approach:

          We require the applicant to provide the return-to-player (RTP) percentage (which is EV / ticket cost * 100%) and the volatility index (if available) or the standard deviation of the return.

          We then use the following rule of thumb:

            - If the RTP is less than 50%: This is very low and might be problematic even for a capped game.
            - If the RTP is above 90%: That is typical for casino games and acceptable.

          But note: The RTP might be high because of the jackpot, but the chance of winning it is minuscule.

     - We also require the applicant to provide the "hit frequency" (the probability of winning any prize) and the distribution of prizes.

   Step 5: Commissioner Referral
     - We refer the game to the commissioners if:
          a) The expected value per ticket (without considering real-world constraints) is unbounded (divergent) and the real-world constraints lead to an extremely high maximum possible prize (e.g., over $1 billion) with a very low probability, making the game effectively a lottery with a huge jackpot and very low chance of winning.
          b) The RTP is very high (e.g., over 100%) because of the jackpot, but the standard deviation is enormous (so that most players lose their entire ticket cost and a very few win huge amounts) and the hit frequency is very low (e.g., less than 1 in a million for any prize above the ticket cost).

     - We also refer if the game design is such that the typical player (with a bankroll of, say, $100) has a very high probability of ruin (e.g., over 90%) even though the RTP might be high.

     - Essentially, if the game is structured in a way that it exploits the St. Petersburg paradox by having an unbounded expected value in theory but in practice leads to almost certain losses for the vast majority of players, then we flag it for the commissioners to decide on the grounds of consumer protection.

   Step 6: Decision
     - If the game passes Steps 1-4 and does not trigger Step 5, we approve.
