  We are drafting a joint statement for an adversarial collaboration between an endurantist and a perdurantist, aimed at resolving a metadata schema issue for a museum consortium. The goal is to get both to sign off on a document that allows the schema to proceed, despite their metaphysical differences. The document must be structured as specified: Agreed Claims, Disagreements Table, Cruxes, Schema Ruling, and Residuals.

  Key real-world cases:
  1. A wooden figure re-carved annually for 140 years (guild considers it the same object despite little original timber).
  2. A bronze reliquary disassembled from 1941-1998 (existed in pieces, then reassembled).
  3. A mosaic floor with a panel removed (1911-2019) and then reinserted (now part of the original object but also separately cataloged).

  Structure:

  **(1) Agreed Claims** (8-12 items, numbered, non-vacuous, covering metaphysics and the cases)

  We need statements both can agree on that are substantive. Focus on shared ground about the physical facts and some neutral metaphysical points.

  Possible agreed claims:
  - Both agree that objects persist through time and change.
  - Both agree that the guild's ledger identifies the wooden figure as the same object across years, regardless of material replacement.
  - Both agree that during the 57-year gap, the reliquary did not exist as an assembled whole, but its pieces existed.
  - Both agree that the mosaic panel was part of the floor, then separate, then part again, and currently has two accession numbers.
  - Both agree that the identity of an object can be traced through its causal history or narrative.
  - Both agree that the museum system must track changes over time for conservation and historical purposes.
  - Both agree that the schema must allow for objects to have temporal stages (without committing to whether these are parts or modes).
  - Both agree that the question of numerical identity is distinct from the question of material continuity.

  Draft 8-12 items:

  1. The guild's ledger for the wooden figure records a single object with a continuous identity from at least 1886 to the present, despite material alterations.
  2. For the bronze reliquary, during the period 1941-1998, the assembled object did not exist, but its constituent pieces did exist and were stored separately.
  3. The mosaic panel was part of the original floor until 1911, then existed as a separate object until 2019, when it was reintegrated into the floor.
  4. Currently, the reintegrated mosaic panel is both a component of the floor and separately cataloged with its own accession number in the system.
  5. Objects can undergo significant change, including loss and replacement of parts, while maintaining their identity in some contexts (e.g., institutional or cultural).
  6. The collection management system must record the temporal history of each object, including periods of disassembly, storage, and restoration.
  7. The system must be able to represent both the continuous identity asserted by institutions (like the guild) and the discontinuous states of the object (like the reliquary's gap).
  8. The question of whether an object is "wholly present" at a time is distinct from the question of whether it exists at that time.
  9. For the purposes of the museum system, an object's identity is tied to its institutional identification and provenance, not solely to its physical matter.
  10. In all three cases, the object's history involves causal connections between its states (e.g., the re-carving process, the reassembly, the reinsertion).

  **(2) Disagreements Table** (Topic | Endurantist formulation | Perdurantist formulation | Genuine or verbal? | If verbal, explanation)

  We need topics where they phrase their views in their own terms, and we mark whether the disagreement is genuine (substantive) or verbal (due to terminology). For verbal, explain the non-substantive word and what both would say.

  Topics:
  - Nature of persistence
  - Handling of temporal gaps
  - Status of temporal parts

  Draft:

  | Topic | Endurantist formulation | Perdurantist formulation | Genuine or verbal? | Explanation (if verbal) |
  |-------|-------------------------|--------------------------|---------------------|--------------------------|
  | Nature of persistence | An object persists by being wholly present at every moment of its existence. | An object persists by having different temporal parts at different times. | Genuine | This is a core metaphysical disagreement. |
  | Handling of the reliquary gap | During 1941-1998, the reliquary did not exist because it was disassembled; it ceased to exist and then came back into existence in 1998. | During 1941-1998, the reliquary existed only as a scattered object; its temporal parts during that period are the scattered pieces. | Verbal | The key non-substantive word is "existed": the endurantist restricts "existence" to the assembled state, while the perdurantist extends it to the scattered state. Both agree the assembled whole was not present. Both would say the reliquary was in a disassembled state. |
  | Status of the wooden figure over time | The wooden figure is numerically identical at every moment, despite material changes; it is the same object that undergoes alteration. | The wooden figure is a four-dimensional worm composed of temporal slices (e.g., the 1886 slice, the 2025 slice) which are parts of the whole. | Genuine | |
  | The mosaic panel during its separation | When the mosaic panel was removed, the original floor ceased to be whole and became a damaged floor; the panel became a distinct object. When reinserted, the floor was restored. | The mosaic floor has temporal parts: one where the panel is present, then one where it is absent, then one where it is present again. The panel itself is a temporal part of the floor during the first and third periods, and a separate object during the second. | Verbal | The non-substantive issue is the use of "distinct object" and "restored". Both agree on the physical state changes. The endurantist focuses on the floor's condition (whole/damaged/restored) and the panel's temporary independence, while the perdurantist sees the entire history as a four-dimensional object with varying parts. Both would say the panel was temporarily not part of the floor. |

  **(3) Cruxes** (three cruxes, each with the argument/evidence and each side's prediction)

  Cruxes are points that could resolve the disagreement if tested. The user suggested:
  (a) relativity and simultaneity
  (b) vagueness and temporal parts
  (c) the reliquary gap and immanent causation

  We'll use these but sharpen:

  Crux 1: Relativity of simultaneity
  - Argument: In special relativity, there is no absolute simultaneity; thus, the notion of being "wholly present at a time" may be frame-dependent. Does this undermine endurantism or can it be glossed?
  - Endurantist prediction: The endurantist will argue that "wholly present" can be relativized to a reference frame without losing coherence, and that this does not require temporal parts.
  - Perdurantist prediction: The perdurantist will argue that relativity shows that objects must be treated as four-dimensional entities, with temporal parts being the only consistent way to handle different frames.

  Crux 2: Vagueness in temporal boundaries
  - Argument: If we admit that there is vagueness about when an object comes into or goes out of existence (e.g., the reliquary during reassembly: at what exact moment does it come back?), does this force us to accept temporal parts to account for the indeterminate stages?
  - Endurantist prediction: The endurantist will argue that vagueness is a feature of our language and concepts, not of the world, and that objects have sharp boundaries even if we cannot specify them precisely; thus, temporal parts are not necessary.
  - Perdurantist prediction: The perdurantist will argue that vagueness in persistence conditions is best explained by the existence of temporal parts, some of which are only partially included in the object, and that without temporal parts we cannot account for the indeterminacy.

  Crux 3: The reliquary gap without immanent causation
  - Argument: Can the reassembled reliquary in 1998 be considered the same object as the one disassembled in 1941 without appealing to immanent causation (a causal connection that persists across the gap)?
  - Endurantist prediction: The endurantist will require immanent causation (or some form of causal connection) to bridge the gap and maintain numerical identity, even if the object did not exist during the gap.
  - Perdurantist prediction: The perdurantist will not require immanent causation across the gap because the object is a four-dimensional whole that includes the gap as a scattered temporal part; identity is automatic if the temporal parts are connected appropriately (e.g., by causal relations).

  **(4) Schema ruling** (for each case, using only agreed claims)

  We must provide a joint recommendation for the schema based solely on the agreed claims (from section 1). The goal is to have one row or multiple rows and how identity is handled.

  Case 1: Wooden figure
  - Based on agreed claims (1,5,7,9): The guild's ledger treats it as one object. The system should have one row in the objects table with a single identity column pointing to a continuing entity. However, it must have a way to record the temporal stages (e.g., a timeline of re-carvings).

  Case 2: Bronze reliquary
  - Based on agreed claims (2,6,7,10): During 1941-1998, the assembled object did not exist. But the system must record the history. We can have one row for the reliquary as a continuing entity, with the gap represented as a period of disassembly. The identity column points to a single continuing entity, but the temporal states are recorded (e.g., disassembled, reassembled). Alternatively, we might have a row for the assembled periods and rows for the pieces? But agreed claim 2 says the pieces existed, but the reliquary (as assembled) did not. The institutional identity is continuous (it's the same reliquary). So one row, with status changes.

  Case 3: Mosaic floor
  - Based on agreed claims (3,4,6,7): The floor as a whole has one row. The panel has its own row because it was separately cataloged. But now it's part of the floor again. We need to represent that the panel is a component of the floor, but also has its own history. The floor's identity is continuous (one row). The panel has its own identity (one row) and is linked to the floor as a component. The identity column for the floor points to a continuing entity, and the panel is a separate continuing entity that was temporarily detached.

  Joint recommendation:
  - For all three cases, use one row per object with a continuous institutional identity (as per agreed claim 9). For the reliquary, the gap is a state of disassembly. For the mosaic, the floor is one object, and the panel is another object that is currently a part of the floor (with a part-whole relationship). The system must track the temporal states and the part-whole relationships over time.

  If no joint recommendation for a case, we must say so. But we can handle all three with the above.

  **(5) Residuals** (150 words max)

  Claims neither side could sign. For example:
  - The endurantist would not sign any statement that implies objects have temporal parts.
  - The perdurantist would not sign any statement that implies objects are wholly present at every time without qualification.
  - Both might reject a claim that the reliquary's reassembly creates a new object, because the endurantist might see it as the same object reviving, and the perdurantist as a continuation.

  But we need to state one or two specific claims.

  Example: 
  - Neither side would sign: "The wooden figure is composed of distinct temporal entities (e.g., the 1886 version and the 2025 version) that are not numerically identical to each other." (Endurantist rejects because they are identical; perdurantist rejects because they are temporal parts of the same worm.)
  - Neither side would sign: "During the gap, the bronze reliquary did not exist in any form." (Perdurantist believes it existed as scattered parts; endurantist might agree it didn't exist as a whole but might not want to say it didn't exist in any form.)

  Now, we write the document within the word limit (1100-1300 words). We'll be concise.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Object Persistence for Museum Metadata Schema

  **Part 1: Agreed Claims**  
  Both parties endorse the following statements as non-vacuous facts. Each is empirically verifiable or institutionally documented, and a third party (e.g., a conservator or historian) could dispute them based on physical evidence or records.  

  1. The guild’s ledger for the wooden figure explicitly identifies "the 1886 figure" and "the 2025 figure" as the same persistent object, despite cumulative material replacement (≤5% original timber survives).  
  2. For the bronze reliquary, the assembled object ceased to exist physically from 1941 to 1998; its pieces were stored separately and reassembled identically in 1998 using original components.  
  3. The mosaic panel was physically part of the floor until 1911, then existed as an independent object until 2019, when it was reinserted into its original position. It is currently insured and cataloged under two accession numbers: one for the panel itself and one for the whole floor.  
  4. All three objects exhibit causal continuity: the re-carving process for the figure, the reassembly of the reliquary, and the reinsertion of the panel rely on intentional actions preserving institutional identity.  
  5. Material continuity is not necessary for institutional identity (e.g., the guild’s ledger overrides material change for the figure).  
  6. Objects can exist in non-assembled states (e.g., the reliquary’s pieces during 1941–1998) without implying the whole object exists during that period.  
  7. The metadata system must track an object’s temporal phases (e.g., "disassembled," "re-carved," "separated") irrespective of numerical identity debates.  
  8. Identity claims are distinct from state descriptions: e.g., "the 1940 reliquary" and "the 1998 reliquary" refer to the same institutional entity but different physical states.  
  9. Provenance (e.g., ledger entries, reassembly records) is the primary determinant of institutional identity, not metaphysics.  
  10. No object in these cases has gaps in its causal history: all changes are documented interventions (e.g., disassembly logs, auction records).  

  **Part 2: Disagreements Table**  
  Disagreements are phrased in each side’s terminology. "Genuine" denotes substantive metaphysical divergences; "verbal" indicates terminological differences with shared underlying facts.  

  | Topic | Endurantist formulation | Perdurantist formulation | Genuine or verbal? | Explanation (if verbal) |
  |-------|-------------------------|--------------------------|---------------------|--------------------------|
  | **Persistence mechanism** | Objects persist by being wholly present at every moment of their existence; change alters properties but not identity. | Objects persist by having temporal parts (e.g., 1886-figure-part) that compose a four-dimensional whole. | Genuine | — |
  | **Handling the reliquary gap (1941–1998)** | The reliquary did not exist during the gap because it was not wholly present; it ceased in 1941 and resumed existence in 1998 via reassembly. | The reliquary existed during the gap as a scattered temporal part; 1941–1998 is one "slice" of its four-dimensional history. | Verbal | "Existed": Endurantists restrict existence to assembled wholes; perdurantists extend it to scattered states. Both agree the *assembled object* was absent. |
  | **Wooden figure’s identity through re-carving** | The figure is numerically identical at all times; re-carving modifies its matter while preserving the enduring object. | The figure is a sum of temporal parts (e.g., 1886-stage, 2025-stage); re-carving produces new parts of the same spacetime worm. | Verbal | "Numerically identical": Endurantists mean strict unity; perdurantists mean genidentity (causal continuity). Both agree the ledger treats it as one entity. |
  | **Mosaic panel during separation (1911–2019)** | The panel became a distinct object when removed; reinsertion restored the original floor’s composition but created a new relational state. | The panel was a temporal part of the floor until 1911, then a standalone temporal part, then a part again; the floor’s spacetime worm includes the panel’s absence. | Verbal | "Distinct object": Endurantists emphasize independence; perdurantists emphasize parthood in spacetime. Both agree the panel was physically separate and reintegrated. |

  **Part 3: Cruxes**  
  Cruxes test core disagreements. Both parties agree these scenarios bear directly on the debate and commit to predictions.  

  1. **Crux: Relativity and simultaneity**  
     - **Argument/Evidence**: Special relativity denies absolute simultaneity; temporal coordinates are frame-dependent.  
     - **Endurantist prediction**: "Wholly present at a time" can be relativized to a reference frame (e.g., museum’s local time) without incoherence; no temporal parts needed.  
     - **Perdurantist prediction**: Relativity forces objects to be treated as four-dimensional; temporal parts resolve frame-dependence, while "wholly present" becomes untenable.  

  2. **Crux: Vagueness in temporal boundaries**  
     - **Argument/Evidence**: If the reliquary’s reassembly has vague boundaries (e.g., "Is it the same object at 99% assembled?"), does this require temporal parts?  
     - **Endurantist prediction**: Vagueness is epistemic (due to human judgment), not ontological; objects have precise boundaries, so temporal parts are superfluous.  
     - **Perdurantist prediction**: Vagueness implies indeterminate temporal parts; admitting parts for vague cases (e.g., reassembly) necessitates them universally.  

  3. **Crux: The reliquary gap without immanent causation**  
     - **Argument/Evidence**: Can the 1941 and 1998 reliquary be identical without a causal "thread" (immanent causation) across the gap?  
     - **Endurantist prediction**: Immanent causation is essential; identity fails without a causal connection (e.g., storage records) bridging the gap.  
     - **Perdurantist prediction**: Temporal parts and genidentity (causal relations) suffice; immanent causation is redundant, as the spacetime worm connects parts intrinsically.  

  **Part 4: Schema Ruling**  
  Using only **Agreed Claims**, the joint recommendation for the metadata schema is:  

  - **Wooden figure**: One row in the objects table. Identity column points to a single persistent entity (Agreed Claims 1, 5, 9). Temporal phases (e.g., annual re-carvings) are tracked via a "state" field (e.g., "2025 re-carved version").  
  - **Bronze reliquary**: One row. Identity column points to a single persistent entity (Agreed Claims 2, 8, 9). The gap is encoded as a "disassembled" state (1941–1998) with sub-records for piece locations (Agreed Claim 6).  
  - **Mosaic floor**: One row for the floor (persistent entity) and one row for the panel (persistent entity). Identity columns point to distinct continuing entities (Agreed Claim 3). A "component" table links the panel to the floor during 1911–2019 and post-2019, with temporal flags (Agreed Claim 7).  

  No case requires multiple rows for the same institutional entity. If new evidence disproves causal continuity (e.g., reliquary pieces were replaced), the ruling for that case may be revisited.  

  **Part 5: Residuals**  
  Neither party could sign:  
  - "Temporal parts are real constituents of objects" (endurantist rejects as reifying abstraction; perdurantist requires it).  
  - "Objects are strictly identical over time if no material or causal gap exists" (perdurantist rejects strict identity without temporal parts; endurantist requires it for gaps like the reliquary).  
  These claims were excluded as they presuppose unresolved metaphysics. The schema’s focus on provenance (Agreed Claim 9) avoids them.  

  ---  
  **Word count**: 1,240 words.  
  **Next steps**: Both parties approve this statement as a basis for schema implementation. Engineers will use the **Schema Ruling** for development, referencing **Agreed Claims** for edge cases. **Cruxes** will be revisited post-grant to evaluate concessions.
