prompt: |-
  ok, context dump first: I'm the data architect for a consortium of three museums building one shared collection-management system for objects that get physically worked on all the time — ritual re-carvings, restorations, wartime disassembly and reassembly. Our metadata working group has a philosophy professor on it (endurantist: objects are wholly present at every moment of their existence) and her former postdoc (perdurantist: objects are four-dimensional worms made of temporal parts). They've been circling each other for about a year, it's now blocking the schema, which is officially my problem, and the grant report is due in six weeks. I've been told to get them to sign off on something jointly rather than let each of them file a seperate dissenting memo.

  The three real cases that keep detonating the meetings: (1) a processional wooden figure that a guild substantially re-carves every spring and has done so for something like 140 years — the guild's own ledger says "the 1886 figure" and "the 2025 figure" are the same object, but almost none of the original timber survives; (2) a bronze reliquary taken apart in 1941, its pieces hidden in two different cellars, reassembled in 1998 — a 57-year gap during which nobody would have said the assembled thing existed, and I have no idea what either camp's ontology does with the gap; (3) a mosaic floor where a large original panel was prised out in 1911, sold, bought back at auction, and reinserted in 2019, so the object now contains a chunk of itself that spent a century somewhere else and is currently also photographed, catalogued, and insured under a different accession number from the one it left. For each of these the schema has to settle whether there's one row in the objects table or several, and whether the identity column points at a single continuing entity or at a bounded temporal segment.

  So: draft the joint statement of an adversarial collaboration between these two, written so that each would actually put their name to it and so that an engineer with one semester of intro metaphysics can act on it. No reading lists, no paper citations, no "see the literature on X" — I can't check them and my colleague would use them as an excuse to stall another quarter. Structure it exactly like this: **(1) Agreed claims** — numbered, 8 to 12 items, covering both the metaphysics and the three cases; I suspect they can both sign that they agree on every plain physical and temporal fact (how much original matter is where and when, what the guild's ledger says, what the insurance registry says) and that they can both sign something about the re-carved figure that sounds like a concession but isn't; make those items non-vacuous, i.e. something a third party could dispute. **(2) Disagreements table** — columns Topic | Endurantist formulation | Perdurantist formulation | Genuine or verbal? — with each side's wording phrased so its own side would accept it unedited, and for every row you mark verbal, say precisely which word or phrase is doing the non-substantive work and what both sides would say instead. **(3) Cruxes** — three of them, each with the argument, thought experiment, or piece of evidence both sides would agree bears on it, and each side's prediction written down in advance so we can see later who conceded what. My guesses are (a) whether relativity's lack of absolute simultaneity makes "wholly present at a time" coherent or merely needs a better gloss, (b) whether vagueness about when an object begins and ceases forces you to admit temporal parts everywhere once you admit them anywhere, and (c) whether the 1941–1998 reliquary can be handled without appealing to something like immanent causation across a gap — but replace any of these if you think there's a sharper one. **(4) Schema ruling** — what the three cases actually come out as using *only* the agreed claims, i.e. the joint recommendation they can give me while still disagreeing; if for one of the cases no joint recommendation is possible, say so, say whose verdict the system should provisionally encode, and say what would have to change to reopen it. **(5) Residuals** — 150 words max, the one or two claims neither side could sign and why. Target around 1100–1300 words for the whole thing; please don't pad it out to hit a word count.
