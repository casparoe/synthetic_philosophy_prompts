prompt: |-
  I'm writing the part of our org's handbook that says when a spoken or typed thing actually counts as a commitment, and I've realised my intuitions about this are a mess. Verdicts below. I want to know what principle, if any, they add up to. You don't need to cite anything or give me sources — I just want the principle stated precisely enough that I could hand it to a lawyer or a first-year student and they could apply it.

  Where I think the words DO the thing:
  - A judge pronounces the sentence out loud in open court, having quietly taken a bribe the week before. Still a real sentence, still binding on the defendant. Bad act, successful act.
  - A head of state reads out a declaration of war on television. War declared, and I think it's declared even if nobody on the other side is watching.
  - At the office party, in front of witnesses, someone furious says "I quit" to their manager's face and walks out. Next morning they say they didn't mean it and want their desk back. I think they quit.
  - Two friends: "fifty quid it rains Saturday" — "you're on." Bet exists.
  - Someone types their name in the box beside "I accept these terms" without reading a single word of them. Bound, I'd say.

  Where I think they DON'T:
  - The same declaration-of-war sentence posted by a private citizen on their own feed. Nothing happens, nobody's declared anything.
  - An actor saying the promise lines in a play, eight shows a week. No promises made, obviously.
  - Someone alone in their kitchen on Thursday rehearsing the vows they'll say on Saturday.
  - A launch where a bystander who isn't the appointed sponsor grabs the bottle, smashes it, and names the ship. I want to say the ship isn't named by him — but I can't tell you why, and I half suspect I should give this one up.
  - A promise made with a gun at your head. My feeling: the promise was genuinely made, and you're still not held to it. That's a different kind of failure from the actor's, and I have no way of marking the difference.

  The pair thats killing me:
  - Betting needs uptake. If I say "fifty quid it rains" and you just change the subject, I feel strongly there's no bet. So the other person taking it up is doing real work in my verdicts.
  - But forgiveness: standing at a grave and saying I forgive you, or writing it in a letter I never send — I want to say the forgiving happened. Nobody took it up. So uptake can't be necessary.
  - And then, worse: apology. Saying sorry under your breath where nobody can hear, or in a note you burn — I don't think that's an apology that got made. Forgiveness without a hearer works, apology without a hearer doesn't, and both look to me like the speaker changing their own standing rather than creating anything between two people. That's the asymmetry I can't explain at all.

  My own guess at a principle is roughly: the words do the thing when there's a convention covering them, the speaker is the right person in the right circumstances, and everyone who has to be party to it knows the convention's in play. But that seems to get the gun case wrong (or right, I can't tell which), and I don't see how it separates the grave-side forgiveness from the burnt apology.

  Can you give me:

  1. "What my verdicts commit me to" — 150–200 words on the structural features my answers are already leaning on, including any place they're inconsistent in a way I haven't spotted.
  2. "Candidate principles" — 400–500 words, two or three, each stated as actual conditions rather than vibes, each with a line saying which of my cases motivated each clause.
  3. "The uptake problem" — 250–300 words on the bet / grave-side forgiveness / burnt apology triangle. If one of those three verdicts has to go, say which and argue for it rather than just noting the tension.
  4. "Off my list" — about 200 words giving your verdicts on three cases I didn't think of: a promise made aloud to a voice assistant that logs it; a vow made to yourself, alone, and then broken; a resignation emailed at 11pm to a boss who never opens it, found by HR a week later.
  5. "What I should give up" — 150 words, the verdicts of mine no decent principle can save, ranked by how much it'd hurt to lose them.
reasoning: |-
  Hmm, the user is trying to figure out a consistent principle for when spoken or typed words constitute a binding commitment. They've provided a list of scenarios where they believe the words are effective or not, along with some tricky cases involving bets, forgiveness, and apologies. They've also proposed a rough principle involving conventions and circumstances but feel it doesn't fully capture their intuitions.

  The user seems frustrated by inconsistencies in their own judgments, especially around uptake (whether someone else needs to acknowledge the words) and asymmetries between forgiveness and apology. They're likely a professional drafting organizational policies, so they need a clear, legally sound rule that can be applied consistently.

  Looking at their verdicts, I notice a pattern: binding commitments require an authoritative context where the speaker has standing to perform the act. For example, a judge declaring a sentence works because of their role, while a bystander naming a ship doesn't. Social conventions also matter—bets need mutual agreement, while vows might not. The gunpoint promise is void due to coercion, not because the words weren't spoken.

  The forgiveness/apology asymmetry is tricky. Forgiveness might be internal, so it works even unheard, while apology is relational, requiring acknowledgment. The user might need to accept that some verdicts conflict. For instance, the unsent forgiveness letter might not count if forgiveness inherently requires communication.

  For the new cases: the voice assistant promise should count if there's a convention (like digital agreements), but the unread resignation shouldn't, as it lacks acknowledgment. A personal vow alone could be binding if self-directed commitments are recognized.

  The user should reconsider the grave forgiveness and gunpoint promise. Forgiveness unheard might not be effective, and the gunpoint promise could be seen as void due to duress, not invalid per se. The ship-naming by a bystander should be given up—it lacks authority.

  I'll structure my response to address their five requests: outlining structural features, proposing candidate principles, resolving the uptake problem, evaluating new cases, and suggesting verdicts to revise. The key is balancing authority, convention, and relational aspects while acknowledging that some intuitions might need adjustment for consistency.
answer: |-
  Here’s a distilled analysis of your intuitions, structured as requested:

  ### 1. What Your Verdicts Commit You To (180 words)  
  Your judgments rely on three structural features:  
  - **Authority-context binding**: Acts require an actor with socially recognized standing (judge, head of state, resigning employee) operating within a convention-governed context (court, state ceremony, employment). This excludes private citizens declaring war or bystanders naming ships.  
  - **Conventional uptake**: For *interpersonal* acts (bets, promises), uptake (explicit acceptance) is mandatory. For *self-regarding* acts (forgiveness at a grave), it’s irrelevant. This explains the bet’s failure without agreement versus forgiveness’s success.  
  - **Intent ≠ validity**: Words can bind *despite* insincerity (bribed judge, unread terms) or coercion (gunpoint promise), but coercion voids *enforceability*, not the act’s existence. The actor’s lines fail due to lacking intent to perform, not coercion.  

  **Inconsistency**: You treat apology as interpersonal (requiring a recipient) but forgiveness as self-regarding. Yet both purport to alter relational standing. This unresolved tension surfaces in the grave/burnt-apology asymmetry.

  ---

  ### 2. Candidate Principles (480 words)  
  **Principle 1: Convention + Authority + Manifest Context**  
  *Words constitute a commitment iff:*  
  (a) A social convention exists for such words to perform that act;  
  (b) The speaker occupies a role recognized by the convention as authorized to perform it;  
  (c) The context manifestly invokes the convention (observable by relevant parties).  
  *Motivations*:  
  - (a)+(b)+(c): Judge’s sentence, declaration of war, resignation, acceptance of terms.  
  - (a) fails: Private "war declaration," actor’s lines.  
  - (b) fails: Bystander naming ship.  
  - (c) irrelevant for self-regarding acts (forgiveness).  
  *Gunpoint promise*: Convention exists (promises), speaker authorized (any person), context manifest—so *commitment exists* but is voidable due to duress.  

  **Principle 2: Relational Uptake for Interpersonal Acts**  
  *For acts altering interpersonal obligations (promises, bets, apologies):*  
  (i) Words must be directed to a specific recipient;  
  (ii) Recipient must register the utterance (audibly, visibly, or via agreed medium);  
  (iii) Convention requires no further uptake (e.g., bet requires "you’re on"; resignation needs no acceptance).  
  *For self-regarding acts (forgiveness, vows):*  
  (iv) No recipient or uptake needed; intent suffices.  
  *Motivations*:  
  - (i)+(ii): Bet fails without "you’re on"; apology unsent fails.  
  - (iii): Resignation works without manager’s approval.  
  - (iv): Grave forgiveness succeeds.  
  *Gunpoint promise*: (i)+(ii) satisfied, so commitment made but voidable.  

  **Principle 3 (Hybrid): Conventional Effect + Defeasibility**  
  *Acts are constituted when:*  
  - Words are uttered in a convention-governed context by an authorized agent, *and*  
  - The act type is *non-defeasible by unilateral mental states* (e.g., insincerity doesn’t undo sentences or resignations).  
  *Defeasibility conditions*: Coercion or fraud voids *enforceability* but not the act’s existence.  
  *Motivations*:  
  - Explains why bribed judge’s sentence stands (non-defeasible by intent) but gunpoint promise is unenforceable.  
  - Separates self-regarding acts (no defeasibility conditions) from interpersonal ones.

  ---

  ### 3. The Uptake Problem (280 words)  
  Your verdicts demand:  
  - Bet requires uptake (interpersonal obligation).  
  - Unheard/unread forgiveness works (self-regarding).  
  - Unheard apology fails (interpersonal).  

  **Conflict**: Forgiveness and apology both purport to resolve relational harm, yet you assign them to different categories. This asymmetry is unsustainable. **Solution: Abandon grave forgiveness as effective.**  
  - **Why**: Forgiveness inherently addresses a wrongdoer; unheard "forgiveness" is emotional release, not absolution. If the deceased’s family later sues, saying "I forgave them at the grave" changes nothing—unlike a communicated apology, which alters obligations (e.g., enabling reconciliation).  
  - **Adjusted principle**: Forgiveness requires the forgiven party (or their proxy) to register it. A letter burned is catharsis; a letter sent but unread is *attempted* forgiveness (like unread resignation), but only effective upon receipt.  
  - **Consistency fix**:  
    - Apology *and* forgiveness become interpersonal acts needing directed communication (though not necessarily acceptance).  
    - Bet requires mutual uptake.  
    - Grave utterance is *preparation*, not performance.  

  **Result**: Uptake is necessary for *all* interpersonal acts. Self-regarding acts (e.g., private vow) need no audience.

  ---

  ### 4. Off My List (200 words)  
  - **Promise to voice assistant**: *Binding* if the assistant is a convention-bound agent (e.g., "Alexa, order pizza" with saved payment). Motivated by "accept terms" case—digital convention exists.  
  - **Unheard vow to self**: *Not binding*. Vows require a convention (e.g., religious oath) or witness. Alone, it’s aspirational. Contrasts with grave forgiveness (which we reclassified).  
  - **Unread email resignation**: *Not effective until read*. Requires registration by recipient (like apology). Authority exists, but context isn’t manifest until receipt. Differs from office-party resignation, where public utterance = manifest context. HR finding it later makes it effective *from discovery*, not sending.

  ---

  ### 5. What You Should Give Up (150 words)  
  Ranked by pain:  
  1. **Grave forgiveness without communication** (High pain): Central to your intuition, but irreconcilable with apology’s failure. Sacrifice for consistency.  
  2. **Gunpoint promise as "genuinely made"** (Medium pain): Better to call it *void* or *invalid* from inception (like a contract under duress), not binding but unenforceable. Aligns with legal norms.  
  3. **Bystander ship-naming** (Low pain): If the convention designates a sponsor, authority fails—easy surrender.  

  **Retain**: Insincere/quasi-coerced acts (bribed judge, gunpoint promise) as *existing but voidable*. This preserves their "successful act" status while acknowledging justice overrides.

  ---
  **Final Principle Suggestion**: *Words constitute a commitment when uttered by a conventionally authorized actor, in a manifest context, under conventions where such words effect that change. Interpersonal acts require directed communication and registration; self-regarding acts require only intent. Coercion or fraud voids enforceability, not existence.*
