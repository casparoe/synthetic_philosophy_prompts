  In their opening move, they challenge me to concretely explain what the least mobile citizen in the poorest Land would lose under this system compared to the current one. They've pre-emptively countered several arguments - noting that current standards represent the median Land's affordability, and that their system avoids race-to-the-bottom dynamics since targets and auditing remain federal.

  I need to respond in character: concrete, practitioner-like, using precise German institutional vocabulary where appropriate, but not lecturing. My response must stay under 150 words, in prose only, and I shouldn't propose my own reform alternative.

  Key points to address:
  The current system may have flaws, but it creates a binding floor for minimum standards. The proposed system risks creating outcome disparities even if the targets are met, because the "how" matters for vulnerable populations. For the least mobile citizen - say, an elderly person with limited mobility in rural Mecklenburg-Vorpommern - the loss of guaranteed service delivery structures could be devastating. Under the current system, even if underfunded, there's a federal framework ensuring basic service points exist. Under the outcome contract, a Land might meet targets through centralized, efficiency-focused methods that neglect remote areas or specialized needs. The federal takeover as penalty is both constitutionally problematic and practically disruptive to continuous service delivery. I should emphasize that uniform standards protect against geographic inequities in implementation, something outcome measurements might miss.

  I'll structure my response to first acknowledge their point about current limitations, then pivot to the concrete vulnerability created by their proposal, using a specific example, and finally note the implementation risks without delving into constitutional arguments unless briefly touched upon in context. The tone should be professional but show visible frustration at what I see as a dangerous misunderstanding of subsidiarity.
answer: |-
  Right. Take Frau Weber, 78, in rural Mecklenburg-Vorpommern. No car, reliant on local outpatient care after her stroke. Today’s *Bundesstandard* mandates a clinic within 15km reachable by subsidised transport, however threadbare. Under your contract? MV meets the *outcome* – say, “90% of patients receive timely post-acute visits” – by concentrating mobile teams in Rostock and Schwerin. Efficient? Ja. But Frau Weber’s village? Beyond the cost-effective radius. The target’s met *aggregate*, but her access evaporates. The federal *means* ensured a *geographically* uniform floor. Your audit won’t catch her isolation; it measures outcomes, not distribution. And when MV inevitably fails later? Federal takeover for one cycle shatters continuity – her new physiotherapist won’t know her history. Your rule trades guaranteed minimum *structures* for efficiency – and the immobile poor pay. *That’s* the loss. *(146 words)*
