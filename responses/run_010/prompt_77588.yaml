prompt: |-
  I'm auditing a seminar on interpretation across disciplines this term — literary theory, scripture, law — and I keep coming back to an inconsistency inside a single legal system that nobody in the seminar seems bothered by, so I'd like you to treat it as the object of analysis. In common-law jurisdictions the same judiciary applies three markedly different regimes for working out what a written text means. Probate: the court treats the dead testator's intention as the controlling consideration, seats itself imaginatively in the testator's position, and admits evidence from outside the four corners — letters, drafting instructions, what the testator told friends and family — to work out whom or what a description picks out; and in many American states, under the Uniform Probate Code's reformation provision and the corresponding Restatement approach, a court may rewrite a will or trust to correct a mistake of fact or law, on clear and convincing evidence, *even where the language is unambiguous*. Contract: the court asks what a reasonable person in the position of the addressee would have understood the words to mean, treats an unexpressed private intention as legally inert, and where both parties attached materially different meanings to the same phrase and neither knew or had reason to know of the other's, has been willing to hold that no contract came into existence at all — the 1864 English case of the two Bombay-to-Liverpool ships both named Peerless is the standard illustration — though where one party knew of the other's meaning and the other did not, the innocent party's meaning governs. Statute: a textualist court says the enacted words, in their public meaning, are the law; that a legislature is a body rather than a mind and so has no intention to be found; and that committee reports and floor speeches may not be used to displace what the text clearly says.

  What I want is a reconstruction of the implicit theory of meaning each regime presupposes, and an assessment of whether the three can be reconciled. Start by stating, for each practice, the account of what makes a text mean what it does that the practice only makes sense under — and be careful to separate what the practice strictly presupposes from what merely fits it comfortably. Then ask whether one underlying semantic theory plus three different sets of background facts (one author who can no longer be consulted and whose instrument is a gift rather than a bargain; two living parties whose reliance and cooperation have to be preserved; an institution whose authority is constituted by the public act of enactment) can generate all three regimes, or whether the system is in fact committed to rival and incompatible pictures of meaning, so that a probate judge and a textualist appellate judge are not disagreeing about evidence but about what meaning is. Pay particular attention to a deflationary possibility: that the real differences are epistemic and institutional rather than semantic — that everyone involved holds the same theory of meaning but the law has different tolerances for unreliable evidence, different allocations of risk, and different conceptions of what each instrument is *for* — and tell me how I could distinguish that reading from the genuinely semantic one, or whether the practice leaves the question underdetermined.

  Finally, run the counterfactuals in both directions. If the jurisdiction adopted a uniform intentionalism, what would have to change in contract litigation and in statutory adjudication, and what would break — is there anything about bargains, or about the authority of a legislature, that resists being folded into an author-psychology model? And if it adopted a uniform anti-intentionalism, the position a literary critic takes when she refuses to consult a novelist's letters, what would have to happen to probate: would courts have to leave a misdescribed bequest standing, refuse reformation, and treat the document as severed from the mind that produced it? I'd also like to know which of these two uniform regimes is more internally stable, and whether there is a domain — trusts, treaties, constitutions, recorded music, standard-form terms of service — where you'd expect the practice to sit closest to each. Please argue the reconstruction rather than surveying positions, and don't spend space telling me that the intentional fallacy debate exists; I want to know which side of it, if either, these three bodies of practice are tacitly voting for.
reasoning: |-
  Okay, the user is auditing a seminar on interpretation across disciplines and has noticed an inconsistency in how different legal texts are interpreted within the same common-law system. They want me to analyze the implicit theories of meaning behind probate, contract, and statutory interpretation, and see if they can be reconciled. 

  First, I need to unpack the three regimes clearly. For probate, courts focus on the testator's intent, even using external evidence and allowing reformation. Contracts use a reasonable person standard, ignoring private intentions and sometimes voiding contracts for mutual misunderstanding. Statutes are interpreted textually, dismissing legislative history when the text is clear. The user wants to know what theory of meaning each presupposes, whether they can be reconciled, and if the differences are semantic or just practical.

  Hmm, the user is clearly well-versed in legal theory—they referenced the Peerless case and UPC provisions. They’re frustrated that their seminar peers aren’t bothered by this inconsistency, so they’re seeking a rigorous analysis. Their deeper need might be to resolve whether legal interpretation is fundamentally fractured or if there’s a unifying principle. They also want counterfactuals: what if all domains used intentionalism or anti-intentionalism? And where would different domains (like treaties or constitutions) fit. 

  Starting with presuppositions: Probate assumes meaning is fixed by the author’s mental state. Contracts presuppose meaning is public and intersubjective. Statutes treat meaning as autonomous from drafters. The deflationary view (differences are epistemic/institutional) is plausible: Probate tolerates extrinsic evidence because the author is dead and equity favors intent; contracts protect reliance; statutes prioritize democratic legitimacy. But is this enough? The fact that probate courts reform unambiguous wills suggests a deeper intentionalist commitment—meaning isn’t just in the text. 

  For reconciliation: One semantic theory (e.g., Gricean intentionalism) could work if adjusted for context. Probate has a lone author, no reliance pre-signing, and equity’s corrective role. Contracts involve mutual reliance, so meaning must be shared. Statutes have institutional authority; the "author" is a multi-headed body acting publicly. Counterfactuals expose cracks: Uniform intentionalism would wreck contract law’s objectivity and statutory legitimacy. Uniform textualism would make probate outcomes absurd (e.g., "my niece Sarah" denied because named "Carla"). 

  Stability-wise, intentionalism is less stable in contracts/statutes due to reliance and institutional constraints. Domains: Trusts align with probate (equitable intent); treaties with contracts (shared understanding); constitutions with statutes (public meaning, but originalism debates show tension). 

  The practices collectively reject pure intentionalism/textualism. Probate votes for intentionalism; contracts and statutes against it, but for different reasons. The user’s real challenge is whether law has a coherent philosophy of language. Answer: It’s pragmatic—meaning adapts to the instrument’s function.
answer: |-
  Your observation cuts to the heart of legal hermeneutics. The inconsistency isn't arbitrary; it reflects deep functional and metaphysical commitments. Here's a reconstruction, assessment, and counterfactual analysis:

  **I. Implicit Theories of Meaning Presupposed by Each Regime**

  1.  **Probate (Wills/Trusts):**
      *   **Presupposed Theory:** **Strong Authorial Intentionalism.** Meaning is *constituted* by the testator/settlor's actual, subjective mental state at the time of execution. The text is merely evidence – often imperfect evidence – of that prior mental state. The author's mind is the locus of meaning.
      *   **Strict Presupposition:** Meaning *is* the author's intention. Extrinsic evidence isn't just admissible; it's potentially *definitive*, even overriding unambiguous text (via reformation). The "dead hand" metaphor is literalized; the author's mind, though absent, remains the sovereign authority.
      *   **Comfortable Fit:** Equity's maxim "equity regards as done that which ought to have been done." The instrument is a gift, lacking bilateral reliance interests at formation.

  2.  **Contract:**
      *   **Presupposed Theory:** **Objective Communicative Meaning / Shared Understanding.** Meaning resides in the *public communicative act* – what a reasonable person in the position of the *recipient* would understand the words to signify in the context of the transaction. Private, uncommunicated intentions are legally irrelevant.
      *   **Strict Presupposition:** Meaning is determined by *interpretive community standards* (the reasonable addressee). Mutual assent is paramount; meaning must be discoverable *objectively* to protect reliance and facilitate commerce. The *Peerless* case exemplifies the consequence: no shared meaning, no contract.
      *   **Comfortable Fit:** Contract law's focus on protecting reasonable reliance and facilitating predictable bargains. The "meeting of the minds" is judged objectively, not subjectively.

  3.  **Statute (Textualist Approach):**
      *   **Presupposed Theory:** **Public Meaning Textualism / Conventional Semantic Meaning.** Meaning is fixed by the conventional semantic meaning of the words and phrases *as understood by the relevant linguistic community at the time of enactment*. The text itself *is* the law.
      *   **Strict Presupposition:** Meaning is an *objective property of the publicly enacted text*, severed from the subjective intentions (or expectations, hopes, etc.) of individual legislators or drafters. Legislative intent is a fiction; the legislature acts *only* through the text it enacts.
      *   **Comfortable Fit:** Democratic legitimacy (citizens bind themselves by published rules), separation of powers (courts apply, not amend, the law), rule of law values (predictability, constraint on judges).

  **II. Reconciliation: Semantic vs. Deflationary (Epistemic/Functional) Differences**

  *   **Can One Theory Generate All Three?** Not easily. A single, pure semantic theory (e.g., Gricean intentionalism or radical conventionalism) struggles to encompass all practices *without significant contextual caveats* that effectively reintroduce the differences. The core commitments clash: Probate demands *subjective authorial intent* as the lodestar; Contracts demand *objective recipient understanding*; Statutes demand *public conventional meaning* of the enacted text.
  *   **The Deflationary Possibility:** This is powerful but incomplete. Differences *are* driven by:
      *   **Epistemic Constraints:** Accessing an individual testator's mind is different (and often *easier* with extrinsic evidence) than divining the "intent" of a multi-member legislature decades later.
      *   **Institutional Roles:** Probate courts exercise equitable powers to "do justice" for a specific donor/beneficiary. Appellate courts applying statutes see themselves as constrained agents of the democratic legislature.
      *   **Instrumental Purpose:** Wills (gifts) prioritize effectuating donor intent. Contracts (bargains) prioritize securing reliance and exchange. Statutes (commands) prioritize public notice, predictability, and democratic accountability.
      *   **Risk Allocation:** Probate places the risk of drafting error on the *estate* (correctable via reformation). Contracts place the risk of misunderstanding on the party who knew or should have known the other's meaning. Statutes place the risk of legislative omission/ambiguity on the *legislature* (to fix) or courts (to interpret narrowly/avoid absurdity).
  *   **Distinguishing Deflationary from Semantic:**
      1.  **Probe Counterfactual Reliability:** If we *could* perfectly know the testator's subjective intent, the legislature's aggregate "intent," or each party's private understanding, would the practices converge? Probate likely stays intentionalist. Contract likely *still* favors reasonable meaning (to protect reliance – knowing one party *secretly* meant something else wouldn't necessarily change the outcome for the innocent party). Statute (under textualism) would likely *still* reject legislative history if the text's public meaning was clear. This suggests the differences are more than just epistemic.
      2.  **The "Unambiguous Text" Test:** Probate's willingness to reform *unambiguous* text based on extrinsic evidence of mistake is the strongest evidence *against* pure deflationism. It demonstrates that even perfect epistemic access to the semantic meaning of the words *is not the legal meaning* in probate – the author's intent trumps it. Textualist statutory interpretation explicitly rejects this move.
      3.  **Theory of Authority:** Probate recognizes the *testator* as the sole authority. Contract recognizes the *communicative act between parties* as the authority. Statute recognizes the *enacted text* (as a public act) as the authority. These differing sources of authority demand differing theories of meaning.

  **Conclusion on Reconciliation:** The practices cannot be fully reconciled under a single, coherent semantic theory *without significant qualification*. The deflationary explanation accounts for much of the *practical* divergence (epistemic limits, functional needs), but the core *metaphysical* commitments to the locus of meaning (private mind vs. public text vs. communicative act) differ fundamentally, especially evident in the "unambiguous text" scenarios. A probate judge and textualist appellate judge *are* disagreeing about what constitutes meaning itself.

  **III. Counterfactuals: Uniform Regimes**

  *   **Uniform Intentionalism:**
      *   **Contract:** Disastrous. "Meeting of the minds" would require probing each party's subjective state. The *Peerless* result might shift (contract exists based on one party's intent?), but reliance would be shattered. Objective standards (parol evidence rule,育儿 evidence rule) would collapse. Standard forms become unworkable. Commercial certainty vanishes.
      *   **Statute:** Undemocratic and unstable. Courts would become amateur historians/psychologists, hunting for "original intent" amidst contradictory floor speeches and committee reports. The enacted text loses primacy. Judicial discretion soars, undermining rule-of-law values. The "legislature as body, not mind" objection is potent – whose intent counts? The bill's sponsor? The median voter? This is inherently unstable.
      *   **What Breaks:** Contract's reliance and commercial functionality; Statute's democratic legitimacy, predictability, and separation of powers.

  *   **Uniform Anti-Intentionalism (Strong Textualism):**
      *   **Probate:** Morally/equitably intolerable. Misdescribed bequests stand ("my niece Sarah" gets nothing because named "Carla"; charity bequest fails due to minor name error). Reformation forbidden. The instrument is severed from the donor's purpose, betraying the core function of a will/trust. Beneficiaries suffer due to scrivener's errors the testator would have instantly corrected.
      *   **What Breaks:** The foundational equitable purpose of probate law – fulfilling the donor's intent. Justice in individual cases.

  *   **Internal Stability:**
      *   **Uniform Anti-Intentionalism (Textualism)** is arguably *more* internally stable across the three domains *as legal systems* than Uniform Intentionalism. While devastating for probate, it *could* function mechanically: apply the plain words. Contract law already leans strongly objective. Statute law (textualism) is a coherent, if contested, system. Its instability is primarily in probate's moral failure.
      *   **Uniform Intentionalism** is deeply unstable everywhere *except* probate. It fundamentally contradicts the institutional realities and functional needs of contract and statute.

  **IV. Domain Affinities:**

  *   **Closest to Probate (Intentionalism):** **Private Trusts** (equitable origins, focus on settlor intent), potentially **Testamentary Documents** broadly.
  *   **Closest to Contract (Objective Communicative Meaning):** **Bilateral/Multilateral Treaties** (negotiated agreement, shared understanding paramount, akin to *Peerless* context), **Negotiated Commercial Contracts**, potentially **Collective Bargaining Agreements**.
  *   **Closest to Statute (Public Meaning Textualism):** **Criminal Statutes** (rule of lenity, high stakes for predictability), **Tax Statutes** (reliance on clear rules), **Detailed Regulatory Codes**.
  *   **Ambiguous/Mixed:**
      *   **Constitutions:** Intense debate reflects the tension. Original public meaning (Textualist) vs. Original intent (Intentionalist) vs. Living tree (departs from both). Leans towards public meaning textualism in modern originalist theory, but intentionalist arguments persist.
      *   **Standard-Form Terms of Service:** Hybrid. Objective (reasonable user) understanding governs against the drafter (contra proferentem), but mass adhesion context weakens pure contractual "meeting of the minds." Leans towards objective meaning.
      *   **Recorded Music:** Law leans towards fixed text (copyright in the recording/sheet music), but performance rights and cultural interpretation are inherently more fluid/intentionalist. Not a direct legal analogue.

  **V. The Tacit Vote:**

  The three bodies of practice collectively **reject pure intentionalism as a universal theory of legal meaning.** Probate votes *for* intentionalism, but contract and statute vote decisively *against* it, albeit for different reasons (reliance/commerce vs. democracy/rule of law). They also collectively **reject pure "death of the author" anti-intentionalism.** Statute embraces textual autonomy, but probate utterly rejects it, and contract relies on authorial communication (even if judged objectively). The practices suggest **legal meaning is not a monolithic concept.** The governing theory depends critically on the **nature of the instrument** (gift, bargain, command), the **relationships involved** (donor-beneficiary, party-party, state-citizen), the **sources of authority** (private intent, mutual assent, public enactment), and the **functional imperatives** (equity, commerce, democratic governance). The law is pragmatically pluralistic in its tacit philosophy of meaning.
