prompt: |-
  You are a philosopher of economics and of action theory who has spent enough time in rooms with machine-learning teams to know what their models are actually measuring. Please think carefully and treat this as a specification-writing task, not a literature survey.

  I am a software engineer with no formal philosophy training. I do know probability, expected-utility maximization as it is taught in an ML course, and optimization. Define every technical term on first use, in plain language.

  Background. My team builds a system that infers what users want from logged choices — clicks, purchases, accepts, declines — and converts that into a scalar score used to rank items and, in some flows, to act on the user's behalf. The word "preference" is load-bearing in every design document we write, and three people on the team mean three different things by it. Our economist consultant says a preference just is what choice reveals, so there is nothing further to measure and the logs already contain everything there is to contain. Our designer says users often have no settled preference until we show them a slate, so what we log records our interface at least as much as it records them. Our legal reviewer wants to know when we may decline to honor a choice the user demonstrably made. Nobody has said what would settle the dispute, and I would rather have the specification in hand before I start reading theories of preference.

  Deliverable: the desiderata — the requirements any theory of preference-as-inferred-from-observable-choice must meet to serve as the foundation for a system like ours. For each requirement give (a) a one-sentence statement, (b) the concrete case, argument, or product consideration behind it — a scenario I would recognize in a log, not a slogan, (c) your verdict on whether it is non-negotiable or is a prejudice of one camp, and (d) what it costs a theory to satisfy it.

  The list must cover, at minimum:

  - Cases the theory has to get right. A user whose choices are detectably intransitive — our economist says an agent like that can be "money-pumped," and I want to know whether that is a reason to demand transitivity of the preferences we attribute, or a reason to demand something else. Menu-dependence: what a user takes changes because of what else was on the slate (the last of two items gets taken; the same item on a six-item list does not). The strategic user who is gaming the recommender rather than expressing anything. And preference change, where the theory must let us distinguish "the user's preferences changed" from "we learned more about preferences that were there all along."
  - Distinctions the theory may not collapse: preference versus choice; ordinal versus cardinal; descriptive attribution versus normative endorsement; having a preference versus how strong it is.
  - At least one evidential requirement: what would count as evidence that an attribution is wrong, given that we only ever observe choices through an interface we control, and our own ranking shaped the menus in the log.
  - At least one requirement about the scalar: if the number is merely ordinal per user, what — if anything — licenses comparing or summing it across users, since our product ranks globally.
  - A requirement about extrapolation. Our economist mentioned results that characterize exactly when a finite log of choices is consistent with utility maximization (he said "Afriat's theorem" and "GARP"). Say what a theory must deliver in order to predict choices over options the user has never been shown, and what finite-data results of that kind do and do not license there.

  Then tell me which requirements are jointly unsatisfiable. I suspect a real tension between making preference operational — defined by choice, hence checkable against logs — and making it contentful, in the sense that a theory can be wrong about what someone prefers. If that pair, or any other subset, cannot be satisfied together, argue for the claim rather than asserting it, and say which requirement has to give. Finish that section by naming the single requirement that knocks out the most candidate theories, and say why.

  Before the list, show your brainstorming: generate roughly twice as many candidate requirements as you will keep, then prune, with one line on why each cut was cut. After the list, add a short scorecard — a few lines each — on how the classic revealed-preference program, a view on which preference is a latent psychological state distinct from behavior, and a preference-construction view fare against the requirements. Keep the scorecard brief; the requirements are the point.

  No bibliography, no citations, no paper titles. Naming a well-known thinker or a named result is fine, but do not invent attributions and do not send me off to look anything up.
reasoning: |-
  We are designing a set of desiderata (requirements) for a theory of preference that we can use in a system that infers user preferences from observed choices (clicks, purchases, etc.) and uses a scalar score for ranking and acting on the user's behalf. The requirements must cover specific cases, distinctions, evidential criteria, scalar properties, and extrapolation. We'll also identify which requirements are jointly unsatisfiable and which one is the most challenging.

  Brainstorming: Generate about 20 candidate requirements, then prune to about 10 for the final list.

  Candidate Requirements (Brainstorm):

  1. **Transitivity**: If a user chooses A over B and B over C, then they should choose A over C. (Case: Money pump argument; non-negotiable for rationality but maybe not for real users.)
  2. **Menu-independence**: The preference between two items should not depend on what other items are in the menu. (Case: Decoy effect; non-negotiable for consistent inference? But real choices are menu-dependent.)
  3. **Stability**: Preferences should be stable over time unless there is evidence of change. (Case: User suddenly stops buying a product; we need to distinguish noise from change.)
  4. **Choice-revealed**: Preference is defined by choice; no hidden mental states. (Economist view; non-negotiable for operationalization.)
  5. **Latent-state**: Preference is a latent psychological state that causes choice but is not identical to it. (Designer view; allows for interface effects.)
  6. **Cardinality**: The scalar score should represent strength of preference, not just order. (Needed for global ranking? But how to infer from choices?)
  7. **Ordinality**: The scalar score only represents order; no meaning to differences. (Economist view; but then how to compare across users?)
  8. **Extrapolation**: The theory must allow prediction of choices for new, unseen options. (Required for recommender systems.)
  9. **Error detection**: There must be a way to detect when the inferred preference is wrong. (But if preference is defined by choice, how can it be wrong?)
  10. **Interface-invariance**: The inferred preference should be invariant to the interface design. (But our logs are interface-dependent.)
  11. **Strategic-behavior handling**: The theory must account for choices that are strategic (gaming) rather than expressive of true preference. (Case: User clicks on items to train the system, not because they like them.)
  12. **Preference-change detection**: The theory must distinguish between learning more about a stable preference and an actual change in preference. (Case: User's tastes evolve.)
  13. **Normative/descriptive distinction**: The theory must not conflate what the user actually prefers with what they should prefer. (Legal: we don't want to force choices.)
  14. **Strength of preference**: The theory must account for the strength of preference, not just existence. (Needed for some actions on user's behalf?)
  15. **Cross-user comparability**: The scalar scores must be comparable across users to allow global ranking. (Product requirement; but is it justifiable?)
  16. **Finite data consistency**: The theory must provide a way to check if a finite set of choices is consistent with the model (e.g., Afriat's theorem). (Economist: for utility maximization.)
  17. **Revealed preference foundation**: The theory must be grounded in observed choices. (Non-negotiable for data-driven system.)
  18. **Causal attribution**: The theory must attribute choices to preferences, not to external factors (like interface). (But interface matters.)
  19. **Context sensitivity**: The theory must be sensitive to context (time, location, etc.) in which choices are made. (Real-world requirement.)
  20. **Action justification**: When acting on the user's behalf, the system must be able to justify that the action aligns with the user's preference. (Legal and ethical.)

  Pruning: We need about 10 requirements. We cut:

  - **Stability** (3): We have a more specific requirement for change detection (12). Keep 12.
  - **Latent-state** (5): This is a candidate theory, not a requirement. We'll address it in the scorecard.
  - **Cardinality** (6) and **Ordinality** (7): We'll have a requirement about the scalar that covers both.
  - **Interface-invariance** (10): Too strong; we cannot ignore the interface. Instead, we require accounting for interface effects (see menu-dependence and strategic behavior).
  - **Normative/descriptive distinction** (13): Important, but we have a requirement about non-collapse of distinctions that covers this.
  - **Causal attribution** (18): This is inherent in the theory; we'll cover by requiring the theory to account for non-preference factors (like interface).
  - **Context sensitivity** (19): We can cover by having a requirement about time and context for change detection and menu-dependence.

  We keep:

  - Transitivity (1) -> becomes R1
  - Menu-independence (2) -> becomes R2 (but note: we might not require strict independence, but accounting for menu effects)
  - Strategic-behavior handling (11) -> R3
  - Preference-change detection (12) -> R4
  - Distinctions: preference vs choice, ordinal vs cardinal, descriptive vs normative, having vs strength (covered in R5, R6, R7, R8) -> We'll break into multiple requirements
  - Evidential requirement (9) -> R9
  - Scalar requirement (15) -> R10
  - Extrapolation (8) and finite data (16) -> R11

  We'll now list 11 requirements (we can combine some distinctions).

  Final List of Desiderata (Requirements):

  R1. **Transitivity Requirement**: The theory must either require that attributed preferences are transitive or provide a clear account of when and why intransitivity arises.  
    *Concrete case*: A user chooses A over B, B over C, but then chooses C over A in a direct comparison. The economist warns of money-pumping (where an adversary can exploit intransitive choices to extract resources).  
    *Verdict*: Non-negotiable for the theory to account for this pattern, but the theory need not insist on transitivity if it can explain and handle intransitivities (e.g., as mistakes or context shifts).  
    *Cost*: If the theory enforces transitivity, it may misattribute intransitive choices to noise or change; if it allows intransitivity, it must handle potential exploitation or irrationality.  

  R2. **Menu-Independence Requirement**: The theory must account for menu-dependent choices without collapsing the preference attribution to the menu.  
    *Concrete case*: A user is offered two items {A, B} and chooses B (the last one). When offered six items including B, they do not choose B. The designer argues that the user's preference for B is not fixed but constructed by the slate.  
    *Verdict*: Non-negotiable because menu effects are common and must be modeled to avoid misattribution.  
    *Cost*: The theory must model context effects, which complicates the model and requires more data.  

  R3. **Strategic-Behavior Requirement**: The theory must distinguish choices made to express a preference from choices made to influence the system.  
    *Concrete case*: A user repeatedly clicks on low-quality items to train the system to stop recommending such items, even though they dislike them.  
    *Verdict*: Non-negotiable because without this, the system will reinforce bad recommendations.  
    *Cost*: The theory must incorporate user models (e.g., that users have goals beyond immediate choice) and may require more complex stateful models.  

  R4. **Preference-Change Detection Requirement**: The theory must provide criteria to distinguish between (a) learning more about a stable preference and (b) a genuine change in preference.  
    *Concrete case*: A user who consistently buys organic food suddenly stops. Is it because they now prefer non-organic (change) or because we misattributed their past choices (learning)?  
    *Verdict*: Non-negotiable because the system must adapt to change without overreacting to noise.  
    *Cost*: The theory must model the dynamics of preference and learning, which may require time-series modeling and more data.  

  R5. **Preference-Choice Distinction Requirement**: The theory must not define preference as identical to choice; there must be a conceptual separation that allows for choice to be influenced by non-preference factors (e.g., interface, errors).  
    *Concrete case*: A user accidentally clicks the wrong button but corrects it immediately. The choice (wrong click) does not reveal their preference.  
    *Verdict*: Non-negotiable because without this, the system cannot handle errors or external influences.  
    *Cost*: The theory must model the choice process (including noise) and thus cannot be purely revealed-preference.  

  R6. **Ordinal-Cardinal Distinction Requirement**: The theory must clarify whether the scalar score represents only order (ordinal) or also strength of preference (cardinal).  
    *Concrete case*: We have two users: User A has a strong preference for item X over Y (scalar difference 10), User B has a weak preference for X over Y (scalar difference 1). If we are to rank X and Y globally, we need to know if we can add the scores.  
    *Verdict*: Non-negotiable because the product requires a global ranking, which implicitly assumes cardinality and comparability.  
    *Cost*: If the scalar is ordinal per user, then comparing across users requires strong assumptions (e.g., interpersonal utility comparisons) that are hard to justify.  

  R7. **Descriptive-Normative Distinction Requirement**: The theory must not conflate the user's actual preferences (descriptive) with what the system or society thinks the user should prefer (normative).  
    *Concrete case*: The legal reviewer wants to know when we can decline a user's choice (e.g., if it's harmful). The system must not confuse its own judgment for the user's preference.  
    *Verdict*: Non-negotiable for legal and ethical reasons.  
    *Cost*: The theory must separate preference inference from normative evaluation, which might require explicit value modeling.  

  R8. **Preference-Strength Requirement**: The theory must account for the strength of preference, not just its existence.  
    *Concrete case*: When acting on the user's behalf (e.g., auto-purchasing), the system should only act when the preference is strong enough to avoid regret.  
    *Verdict*: Non-negotiable for actions beyond ranking.  
    *Cost*: The theory must infer strength from choices (e.g., via response times, choice confidence, or menu effects) which may not be directly observable.  

  R9. **Evidential Testability Requirement**: There must be observable conditions under which the theory would reject a particular preference attribution as incorrect.  
    *Concrete case*: If the system infers that a user strongly prefers A over B, but then the user consistently chooses B over A when they are presented together (and there are no strategic or menu effects), the attribution must be revisable.  
    *Verdict*: Non-negotiable for a scientific approach.  
    *Cost*: The theory must allow for the possibility of being wrong, which may require probabilistic models and complicates the revealed-preference foundation.  

  R10. **Cross-User Comparability Requirement**: The scalar score must be comparable across users, at least in the sense that differences can be meaningfully aggregated for global ranking.  
    *Concrete case*: The product ranks all items for all users in a global leaderboard.  
    *Verdict*: Non-negotiable for the product, but the theory must justify it.  
    *Cost*: The theory must provide a cardinal and interpersonally comparable utility, which requires strong assumptions (e.g., that choices reveal strength in a comparable way) that may not hold.  

  R11. **Extrapolation Requirement**: The theory must provide a method to predict choices for options never before seen by the user, and that method must be justifiable by the finite choice data.  
    *Concrete case*: A new item is added to the catalog; the system must score it for a user who has never encountered it.  
    *Verdict*: Non-negotiable for a recommender system.  
    *Cost*: The theory must assume that preferences are defined over features of the items (not just the items themselves) and that these features are known, which may not always be the case.  

  Joint Unsatisfiability:

  The core tension is between the **Choice-Revealed Foundation** (which would define preference by choice) and the **Preference-Choice Distinction** (R5) and **Evidential Testability** (R9). 

  - If preference is defined as choice (revealed preference), then there is no room for the theory to be wrong: every choice reveals the preference at that moment. But R5 requires that we allow for choices that do not reflect preference (e.g., errors). R9 requires that we can be wrong about the preference, which is impossible if preference is defined by choice.

  Moreover, R10 (Cross-User Comparability) is in tension with the revealed-preference view because revealed preferences are ordinal and non-comparable across individuals.

  The most challenging requirement is **R9 (Evidential Testability)**. It knocks out any theory that defines preference solely by choice (because then there is no evidence that could contradict the attribution) and any theory that does not allow for independent evidence (e.g., from user feedback or multiple choice contexts). It forces the theory to have a notion of preference that goes beyond the observed choices.

  Scorecard:

  1. **Classic Revealed-Preference (Economist)**:
     - Fails R5 (distinction between preference and choice) because it defines preference as choice.
     - Fails R9 (evidential testability) because it cannot be wrong about preference.
     - Fails R10 (cross-user comparability) because it is ordinal and non-comparable.
     - Handles R1 (transitivity) by assuming it, but cannot explain intransitivities.
     - Handles R11 (extrapolation) via Afriat's theorem only if the new option is in the convex hull of previous choices; otherwise, it cannot extrapolate.

  2. **Latent Psychological State (Cognitive View)**:
     - Satisfies R5 and R9 by positing a latent state that may not align with every choice.
     - May handle R2 (menu-dependence) by modeling context effects.
     - May handle R4 (change detection) by modeling dynamics.
     - Struggles with R10 (cross-user comparability) unless strength is measured in comparable units (e.g., via neuroimaging, which we don't have).
     - For R11 (extrapolation), it can use psychological features but requires a model of how features map to the latent state.

  3. **Preference-Construction (Designer View)**:
     - Emphasizes that preferences are built at the moment of choice, so menu-dependence (R2) is inherent.
     - May handle R3 (strategic behavior) by seeing it as a form of construction.
     - Struggles with R1 (transitivity) because construction can lead to intransitivities without a stable core.
     - Struggles with R4 (change detection) because every choice is context-dependent, making it hard to separate change from context.
     - For R11 (extrapolation), it is weak because past constructions may not predict future ones in new contexts.

  In summary, the latent-state view best satisfies the requirements but at the cost of complexity and data needs. The revealed-preference view is simple but fails on key requirements.
answer: |-
  ### Brainstorming: Candidate Requirements and Pruning
  I generated 20 candidate requirements based on your scenario, then pruned to 11 core desiderata. Pruning rationale:
  - **Cut: "Preference must be a total order (complete and transitive)."** Too restrictive; real users exhibit intransitive choices, and the theory must handle this.
  - **Cut: "Preferences must be stable across time."** Redundant; R4 (change detection) covers temporal dynamics better.
  - **Cut: "The system must always honor user choices."** Contradicts legal/ethical cases; R7 (normative distinction) addresses this.
  - **Cut: "Inference must use only choice data."** Too narrow; strategic behavior (R3) and errors (R5) require broader data.
  - **Cut: "Utility must be cardinal."** Overly prescriptive; R6 and R10 disentangle ordinal/cardinal and cross-user issues.
  - **Cut: "Preference strength must be measurable from clicks."** Unrealistic; R8 (strength) allows for indirect inference.
  - **Cut: "Menu effects must be eliminated."** Impossible; R2 (menu-dependence) requires modeling, not elimination.
  - **Cut: "New-item predictions must be 100% accurate."** Unattainable; R11 (extrapolation) focuses on justification, not perfection.
  - **Kept:** Requirements covering intransitivity, menu-dependence, strategic behavior, change detection, key distinctions, testability, scalar properties, and extrapolation.

  ---

  ### Desiderata for a Theory of Preference-as-Inferred-from-Choice

  #### **R1: Transitivity Accounting**  
  (a) The theory must either enforce transitive preferences or explain/quantify intransitive choices without defaulting to "noise."  
  (b) *Concrete case*: A user in a music app chooses song A over B, B over C, but then picks C over A. Our economist warns this enables "money-pumping" (e.g., user pays to swap A→C→B→A, losing value).  
  (c) **Non-negotiable**: Intransitivity is common (e.g., indecisive users) and must be addressed to prevent exploitation or model breakdown.  
  (d) *Cost*: If enforced, the theory may ignore genuine user conflict; if explained (e.g., as context-dependent), it requires modeling complexity.

  #### **R2: Menu-Dependence Handling**  
  (a) The theory must attribute preferences in a way that accounts for how menu composition affects choices.  
  (b) *Concrete case*: A user selects the last item from a 2-item food delivery slate but ignores it in a 6-item list. Our designer argues the interface "constructed" the preference.  
  (c) **Non-negotiable**: Menu effects (e.g., decoy items) are empirically pervasive; ignoring them causes misattribution.  
  (d) *Cost*: The theory must incorporate contextual factors (e.g., menu size), complicating inference and requiring more data.

  #### **R3: Strategic-Behavior Detection**  
  (a) The theory must identify choices driven by system-gaming rather than genuine preference.  
  (b) *Concrete case*: A user clicks low-relevance ads to "train" the algorithm toward cheaper products, distorting purchase logs.  
  (c) **Non-negotiable**: Gaming corrupts data; failing this misleads recommendations and actions on the user’s behalf.  
  (d) *Cost*: Requires modeling user intent (e.g., via secondary signals like dwell time), increasing computational and data burdens.

  #### **R4: Preference-Change Differentiation**  
  (a) The theory must distinguish preference change ("taste shift") from improved learning of stable preferences.  
  (b) *Concrete case*: A user stops buying eco-friendly products after a news event. Is this a genuine shift (e.g., disillusionment) or were past choices misread (e.g., they always preferred price over eco-friendliness)?  
  (c) **Non-negotiable**: Critical for adapting recommendations; conflating change with learning causes lag or overreaction.  
  (d) *Cost*: Requires longitudinal models and counterfactual reasoning (e.g., "Would they still choose this now?"), which lack direct evidence.

  #### **R5: Preference-Choice Separation**  
  (a) The theory must not equate preference with observed choice; it must allow choices to deviate from preferences due to external factors.  
  (b) *Concrete case*: A user accidentally clicks "decline" on a travel upgrade (fatigue/error) but later complains—the choice didn’t reflect their preference.  
  (c) **Non-negotiable**: Errors and biases are ubiquitous; conflation harms user trust and system accuracy.  
  (d) *Cost*: Forces the theory to model unobservables (e.g., "true intent"), risking unverifiable assumptions.

  #### **R6: Ordinal-Cardinal Clarity**  
  (a) The theory must specify whether the scalar score is ordinal (ranking only) or cardinal (strength-measuring).  
  (b) *Concrete case*: User A’s score difference between brands X and Y is 0.1; User B’s is 10. If scores are ordinal per user, comparing/summing for global ranking (e.g., "Top 10 for All Users") is invalid.  
  (c) **Non-negotiable**: Product needs global rankings; ambiguity here invalidates core functionality.  
  (d) *Cost*: Cardinality demands strong assumptions (e.g., choice probabilities reveal strength), which may not hold.

  #### **R7: Descriptive-Normative Distinction**  
  (a) The theory must separate descriptive preference ("what the user likes") from normative judgments ("what the user should like").  
  (b) *Concrete case*: Legal reviewer blocks honoring a user’s choice for harmful content (e.g., self-harm)—we must not infer they "prefer" it normatively.  
  (c) **Non-negotiable**: Ethical/legal compliance requires this; conflation risks harmful actions.  
  (d) *Cost*: Necessitates value-laden safeguards, complicating preference inference with external ethics frameworks.

  #### **R8: Preference-Strength Granularity**  
  (a) The theory must capture strength of preference, not just existence.  
  (b) *Concrete case*: When acting on a user’s behalf (e.g., auto-renewing subscriptions), the system needs confidence the preference is strong enough to avoid regret (e.g., weak preferences ≈ high cancellation risk).  
  (c) **Non-negotiable**: Acting without strength assessment leads to user harm (e.g., unwanted charges).  
  (d) *Cost*: Strength is not directly observed; must be inferred from proxies (e.g., choice consistency, hesitation), which are noisy.

  #### **R9: Evidential Testability**  
  (a) There must be conditions where observed choices invalidate an attributed preference.  
  (b) *Concrete case*: The system infers a user prefers Italian over Thai food, but they consistently pick Thai when both are available—despite identical interfaces and no gaming. This must force model revision.  
  (c) **Non-negotiable**: Without falsifiability, the system can’t self-correct; errors propagate.  
  (d) *Cost*: Requires the theory to allow preferences to be "wrong," conflicting with choice-defined preferences (see joint unsatisfiability).

  #### **R10: Cross-User Comparability Justification**  
  (a) If scalar scores are ordinal per user, the theory must justify aggregating/comparing them across users.  
  (b) *Concrete case*: Global ranking sums scores across users; if scores are ordinal (e.g., User A: X=5, Y=3; User B: X=100, Y=99), summing is mathematically meaningless without cardinality.  
  (c) **Non-negotiable**: Product requirement; skipping this invalidates global leaderboards.  
  (d) *Cost*: Demands interpersonal utility comparisons, which lack behavioral foundations and require arbitrary normalization (e.g., z-scoring).

  #### **R11: Extrapolation Licensing**  
  (a) The theory must justify predicting choices for unseen options using finite choice data.  
  (b) *Concrete case*: Afriat’s theorem checks if choices satisfy utility maximization for *seen* items, but the system must score a new item (e.g., unreleased movie). The theory must specify what licenses this (e.g., feature-based preferences).  
  (c) **Non-negotiable**: Recommenders require generalization; without justification, predictions are arbitrary.  
  (d) *Cost*: Assumes preferences are defined over item features (not just items), which may miss context-specific quirks.

  ---

  ### Joint Unsatisfiability
  **The core tension is between R9 (Evidential Testability) and choice-defined preferences (e.g., the economist’s view that "preference is what choice reveals").**  
  - **R9 demands that preference attributions can be falsified by choices** (e.g., consistent counter-evidence forces revision).  
  - **But if preference is defined as choice (per the economist), choices cannot falsify preferences**—every choice *is* the preference by definition. Contradictions (e.g., intransitivity) are either ignored or labeled "irrational," leaving no room for model error.  
  - **R5 (Preference-Choice Separation) exacerbates this**: If choices can deviate from preferences (e.g., errors), then defining preference as choice collapses the distinction R5 requires.  

  **Resolution**: R9 and R5 are non-negotiable for your system (testability and error-handling are essential). Thus, **the economist’s view must give**. Preference cannot be defined *solely* by choice; it must be a latent construct inferred from choices but admitting independent evidence (e.g., user feedback) to satisfy R9.  

  **Most disruptive requirement**: **R9 (Evidential Testability)**. It knocks out:  
  - Theories where preference is strictly choice-revealed (no testability).  
  - Theories without error models (R5).  
  - Theories that treat all choices as sacrosanct (contradicting R7).  
  It forces a "realist" view where preferences exist beyond choices, requiring probabilistic/statistical frameworks.

  ---

  ### Scorecard: How Theories Fare Against Requirements
  1. **Classic Revealed-Preference (Economist: "Preference = Choice")**:  
     - ✅ Handles R1 (enforces transitivity via Afriat), R11 (extrapolation via GARP for seen items).  
     - ❌ Fails R2 (ignores menu-dependence), R3 (no gaming detection), R4 (no change/learning distinction), R5/R9 (no preference-choice separation or testability), R6/R10 (ordinal, no cross-user comparability).  
     - ⚠️ Struggles with R7 (no normative separation), R8 (no strength).  

  2. **Latent Psychological State (Designer-adjacent: "Preference = Internal State")**:  
     - ✅ Handles R2/R3/R4 (models context/gaming/change), R5/R9 (separates preference from choice; testable via deviations), R7 (clear descriptive/normative split).  
     - ❌ Fails R6/R10 (cardinality/comparability unjustified without behavioral anchors), R11 (extrapolation requires feature-mapping, not always available).  
     - ⚠️ Partial on R1 (allows intransitivity but may not "account" for it), R8 (strength inferred indirectly).  

  3. **Preference-Construction (Designer: "Preference = Context-Dependent")**:  
     - ✅ Handles R2 (menu-dependence intrinsic), R3 (gaming as construction), R4 (change is inherent).  
     - ❌ Fails R1 (intransitivity not accounted for), R6/R10 (no basis for cardinal scores or cross-user comparison), R11 (poor extrapolation; preferences are ephemeral).  
     - ⚠️ Partial on R5/R9 (separates preference from choice but hard to test), R7 (descriptive focus), R8 (strength is fluid).  

  **Recommendation**: A hybrid approach (e.g., latent-state with menu-aware models) best satisfies requirements but requires rich data and probabilistic inference. The economist’s view is untenable due to R5/R9/R10.
