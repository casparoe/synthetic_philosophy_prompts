  Given to the enforcer at T0 after pairing:

  "You are the enforcer for [student's name]. They have chosen to precommit to selecting Option B (three tokens at T2) at the upcoming choice at T1. At T1, you will be given a pre-filled form for Option B. You must hand this form to [student] and they will turn it in as their choice. They are not allowed to choose Option A. If they try to submit a form for Option A, you must remind them of their precommitment and give them the pre-filled form. If they refuse, please inform the instructor."

  **Wording for Choice Problems**

  As above.

  **Scoring and Payout**

  - Each token is one small snack. We will have extra snacks for redemption. At the end, they can also convert tokens to extra credit: 50 tokens = 0.5 extra credit points (so 200 tokens = 2 points). But since the maximum tokens per student is 6 (if they choose the delayed reward in both choices: 3+3=6 tokens), that would be 0.06 extra credit points (if 50 tokens=0.5 points). That is very small. Alternatively, we can set a higher conversion: e.g., 1 token = 0.1 extra credit points. Then 6 tokens = 0.6 points. But we can cap the extra credit at 2 points for the course, and since no one will get more than 6 tokens, it's safe.

  But to keep it simple, we can just use snacks and let them eat the snacks. Then we don't need extra credit conversion. We can say: "At the end of the exercise, you will receive the snacks you have earned. You may eat them now or take them with you."

  **Debrief Outline**

  1. Present aggregate results: 
     - How many chose Y at T0?
     - Of those, how many chose A at T1? (reversal)
     - Of those who reversed, how many reported at T1 that they thought B was better? (akrasia)

  2. Precommitment group:
     - How many precommitted?
     - Of those who precommitted, how many would have chosen A at T1 if not precommitted? (We don't know, but we can see in the control group the reversal rate and compare)

  3. Map to discounting:
     - Stationarity: exponential discounting would not predict reversal. But we saw reversal, suggesting non-stationarity (hyperbolic discounting).

  4. Philosophical question: when they reversed, was it against their better judgment? 
     - If they reported at T1 that B was better but chose A, then yes.
     - But hyperbolic discounting models don't necessarily assume that the agent at T1 still holds the T0 judgment. The discounting might reflect a change in the evaluation.

  5. The peer precommitment: 
     - When a student precommits and is enforced, is that an exercise of self-control or an imposition by another? We can discuss whether this is a case of the student's own will (because they chose to precommit) or whether it is external. And how this relates to Ulysses contracts.

  **What predictably goes wrong**

  1. One student won't play sincerely: they might choose the immediate reward both times to get snacks quickly. We can't force them. We can only stress the instructions.

  2. Arbitrage: a student might notice that by choosing the delayed reward in both choices, they get more snacks. But we predict that the immediate temptation at T1 will override. If a student does this, they are not time-inconsistent. That's valid.

  3. Enforcement: an enforcer might not want to enforce. We can have a backup: if the student does not use the pre-filled form, we can void their reward. But we hope peer pressure works.

  4. Delays: the session might run over. We must keep to the timeline.

  We'll now write the exact script.
answer: |-
  Below is a comprehensive exercise design tailored to your specifications. I'll address each request in sequence, providing a ready-to-implement plan.

  ---

  ### **1. Payoff Structure**
  - **Rewards**: Use **custom snack vouchers** redeemable immediately after the session. Each voucher is worth:
    - **1 point**: "Small Snack" (e.g., 1 cookie, 1 piece of fruit, or a coffee token).
    - **3 points**: "Large Snack" (e.g., a sandwich, specialty coffee, or 3 cookies).
  - **Stakes**: Students earn points from choices (max 6 points/student). Points convert to extra credit:  
    **2 points = 0.2% final grade, 4 points = 0.4%, 6 points = 0.6%** (capped at 0.6% to stay within your 2-point limit).  
    Snacks are delivered post-session; extra credit is applied to final grades.
  - **Why it works**: Snacks are tangible, immediate, and universally valued. Low-stakes extra credit incentivizes sincerity without coercion.

  ---

  ### **2. Within-Person Preference Reversal**
  #### **Choice Structure**
  - **Two identical choices** at different times:
    - **Choice 1 (T0)**: At session start (0 min).  
      *Option X*: 1 point at **T1 (25 min)**.  
      *Option Y*: 3 points at **T2 (50 min)**.  
    - **Choice 2 (T1)**: After 25 min.  
      *Option A*: 1 point **now (T1)**.  
      *Option B*: 3 points at **T2 (25 min later)**.  
  - **Predicted reversal**: Students choosing Y at T0 but A at T1 reveal dynamic inconsistency (same delay to T2, but immediacy at T1 disrupts patience).

  #### **Evidence of Reversal**
  - **Private choice forms**: Students record choices on numbered forms (anonymous to peers, tracked by you).  
  - **Reversal = (Y at T0) + (A at T1)**.  
  - **Control for "lucky accidents"**: Fixed delays, identical options, and pre-commitment (below) isolate time inconsistency.

  ---

  ### **3. Controlling for Belief Revision**
  #### **Controls Built In**
  - **Filler task**: A 20-min reading on moral psychology (unrelated to discounting) during T0→T1. Distracts from overthinking delays/rewards.
  - **Belief elicitation**: 
    - **At T0**: *"Rate on a scale of 1–10:  
      (a) How much do you value 3 snacks vs. 1?  
      (b) How annoying is a 25-min wait?  
      (c) How likely will snacks be delivered (1–10)?"*  
    - **At T1 (post-choice)**: Same questions, plus *"Which option is better, A or B, all things considered?"*  
  - **Ordering**: Choices precede belief questions to avoid anchoring.
  - **Residual confounds**:  
    - **Unavoidable**: Trust in delivery (even with controls, some may doubt snacks).  
    - **Mitigated**: Value/aversion ratings show if reversal correlates with changed beliefs. Debrief this explicitly.

  ---

  ### **4. Peer-Administered Precommitment**
  #### **Design**
  - **Precommitment stage (T0)**: After Choice 1, half the class (randomly assigned "Precommitters") can lock in Choice 2:  
    *"If you precommit, you must choose B at T1. Another student will enforce this."*  
  - **Peer enforcement**:  
    - Each Precommitter is paired with an "Enforcer" (from the other half, "Non-Precommitters").  
    - Enforcers receive a **precommitment contract** to uphold at T1.  
  - **Enforcer instructions**:  
    *"If your partner precommitted, give them this form at T1: 'By precommitment, you choose B.' They must submit it. If they resist, remind them: 'You agreed to this at T0.'"*  
  - **Interpretation**:  
    - Precommitters exercising **self-binding** via social obligation (peer pressure mimics Ulysses contracts).  
    - Non-Precommitters act as **control group** (no binding).  
    - **Key philosophical wrinkle**: Peer enforcement tests whether **agency is interpersonally extended**. The Precommitter delegates authority, blurring "same capacity" vs. "external imposition." Debrief this tension.

  ---

  ### **5. Timeline, Materials, & Script**
  **Total time**: 75 min (5 min buffer).  
  **Materials**:  
  - Snacks (for post-session redemption), envelopes, timers.  
  - Forms: T0 Choice/Belief, Precommitment Contract, T1 Choice/Belief.  
  - Filler reading (1 page; e.g., excerpt from Holton on temptation).  

  #### **Minute-by-Minute Timeline**
  - **T0–T10: Setup (10 min)**  
    - Distribute numbered forms (students keep their number private).  
    - Read aloud:  
      *"Today, you’ll make choices about snacks/extra credit. All rewards will be delivered today. Each choice is independent and will be paid. Points convert to snacks or extra credit (2 pts = 0.2% grade)."*  

  - **T10–T15: Choice 1 (5 min)**  
    - Read:  
      *"Choose:  
      X: 1 point at T1 (25 min from now).  
      Y: 3 points at T2 (50 min from now).  
      Write X or Y on your form. Then answer belief questions below."*  

  - **T15–T20: Precommitment (5 min)**  
    - Assign Precommitters (7 students) and pair with Enforcers (7 Non-Precommitters).  
    - To Precommitters:  
      *"You may precommit to choosing B at T1. If you do, your Enforcer will enforce it. Sign here if you precommit."*  
    - Enforcers receive a contract: *"If signed, give this to your partner at T1: 'You choose B.'"*  

  - **T20–T40: Filler Task (20 min)**  
    - Distribute reading and comprehension questions.  

  - **T40–T45: Choice 2 (5 min)**  
    - To all:  
      *"Choose:  
      A: 1 point now.  
      B: 3 points at T2 (25 min from now).  
      Non-Precommitters and unsigned Precommitters: Write A or B.  
      Signed Precommitters: Your Enforcer will give you your choice."*  
    - Enforcers deliver contracts to Precommitters.  
    - All answer belief questions.  

  - **T45–T50: Resolve Rewards (5 min)**  
    - Collect forms. Distribute 1-point snacks to A/X choppers.  
    - At T50 (session end), distribute 3-point snacks to B/Y choppers.  

  - **T50–T75: Debrief (25 min)**  
    - See Section 6.  

  ---

  ### **6. Debrief Structure**
  **Map exercise to concepts**:  
  - **Stationarity**: *"At T0, you saw a 25-min vs. 50-min delay. At T1, 0-min vs. 25-min. If discounting were stationary, Y-choosers would pick B. Did they?"*  
  - **Exponential vs. Hyperbolic**: Show discount curves:  
    - Exponential: Constant decay rate (no reversal).  
    - Hyperbolic: High discount for immediacy (reversal explained).  
  - **Naive vs. Sophisticated**:  
    - *"Did Precommitters foresee their reversal? Those who precommitted are sophisticated; others may be naive."*  

  **Philosophical confrontation**:  
  - **Agency debate**:  
    - *"When you reversed (Y→A), was T1-you acting against T0-you’s better judgment? Or are they distinct agents?"*  
    - Use belief questions: *"If you called B ‘better’ at T1 but chose A, that’s akrasia. If not, your judgment shifted."*  
  - **Precommitment twist**:  
    - *"Did enforced Precommitters ‘act freely’? Or did the Enforcer become part of their agency?"*  
  - **Close**: *"Does this support Aristotle’s requirement that akrasia requires acting against a concurrent judgment? Or does hyperbolic discounting dissolve the conflict?"*  

  ---

  ### **7. Limitations and Compensations**
  - **Short delays**: Minutes, not months.  
    - **Fatal for?** Generalizing to long-term decisions (e.g., retirement savings).  
    - **Compensate**: *"Real-world reversals involve visceral temptation—here, we simulate with immediacy. Imagine T2 is months away."*  
  - **Trivial stakes**: Snacks, not life choices.  
    - **Fatal for?** Emotional weight of akrasia (e.g., addiction).  
    - **Compensate**: *"The structure is identical—what changes is motivational force. Discuss how craving scales with stakes."*  
  - **Artificial context**: Abstract choices, not moral dilemmas.  
    - **Fatal for?** Modeling regret or identity-based judgments.  
    - **Compensate**: *"Focus on the formal structure. Does reversal imply irrationality, or is it rational given shifting time perspectives?"*  

  ---

  ### **8. Predictable Problems & Solutions**
  - **Insincere player**:  
    - E.g., a student always chooses delayed rewards to "win."  
    - **Solution**: Announce: *"Choose what you truly prefer—this isn’t a test of ‘right’ answers."* Use anonymity to reduce performance pressure.  
  - **Arbitrageur**:  
    - E.g., a Precommitter tries to bribe an Enforcer to ignore their contract.  
    - **Solution**: Warn: *"If Enforcers don’t enforce, no snacks for either of you."* Make Enforcers ineligible for extra credit (they get snacks only).  
  - **Peer enforcement fails**:  
    - E.g., an Enforcer refuses to confront a friend.  
    - **Solution**: Assign cross-pairs (not friends). Have backups: If a Precommitter submits a personal form, void their reward.  
  - **Timing slip**:  
    - **Solution**: Assign a student timekeeper. Shorten filler task if needed.  

  ---

  ### **Implementation Notes**
  - **Why this works**:  
    - Realistic reversal: 25-min waits feel "long" in a seminar; immediacy tempts even for snacks.  
    - Peer enforcement creates social stakes (enriches the agency debate).  
    - Belief controls isolate discounting from learning.  
  - **Predicted outcome**: ~60% of Y-choosers reverse (A at T1). Precommitters show lower reversal.  
  - **Final tip**: Run a pilot with a colleague to refine timing.  

  This exercise creates a visceral experience of dynamic inconsistency, setting up a nuanced debate about agency and akrasia—without uttering "hyperbolic discounting" until the debrief.
