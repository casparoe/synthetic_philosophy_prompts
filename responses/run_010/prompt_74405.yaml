prompt: |-
  You're the kind of person who does formal contract theory for a living but also reads the AI alignment literature seriously enough to referee a paper that cites both — think "economist who moonlights at an alignment workshop." Please actually think this through rather than pattern-match, and brainstorm the mapping (rough notes, a little table of candidate correspondences, dead ends) before you write up the polished version.

  My situation: I design incentive schemes inside a big company — division-level comp, delegation rights, which performance signals get written into contracts and which get left out. My native language is principal–agent theory: hidden action vs. hidden information, participation and incentive-compatibility constraints, moral hazard, the informativeness principle, multitask distortion, commitment vs. renegotation, screening and signaling, relational contracts. I know basically nothing about the alignment literature except what a colleague sketched for me at lunch, which went roughly like this:

  - A **goal-directed** agent has a fixed objective function and optimizes it. A human "correcting" it isn't really part of the agent's decision problem — it's an outside intervention that changes the objective.
  - An **approval-directed** agent's payoff is defined over its own *estimate* of the human's approval (or of the human's own payoff). So a correction is not a command, it's *evidence that the estimate was wrong*, and the agent therefore welcomes correction and actively tries to elicit it.
  - There's a game-theoretic version of the second idea: a cooperative two-player partial-information game where both the human and the machine are paid according to the human's reward function, the human knows it and the machine doesn't, so the human's actions and interruptions are themselves informative signals about the payoff both of them are chasing.
  - People in that literature treat the goal-directed/approval-directed split as deep. But some of them also argue it half-collapses: an approval-directed agent still needs something goal-like to act over any horizon at all, and "approval" is often a biased proxy for what the human actually wants, which reopens the usual Goodhart/wirehead worries.

  If that sketch is wrong or oversimplified in ways that matter, say so up front — but dont just correct me, do the translation anyway on the corrected version.

  What I want is a faithful restatement of that whole debate in my vocabulary, followed by a residue report. Concretely:

  1. Pick one running scenario — something like an assistant machine scheduling a busy researcher's week, where the researcher keeps overruling its choices — and carry it through both vocabularies side by side so I can see where the gears mesh and where they strip.

  2. Then work through these, one at a time:
     - Is "the agent welcomes being corrected" just the incentive-compatibility constraint wearing a costume, or is it something my framework genuinely can't house? In contract theory the agent's objective is *given*; I'm not sure my toolkit can even write down an agent whose objective is a function of its belief about the principal's objective.
     - Is the game-theoretic version just hidden information relocated to the principal's side — an inversion of the textbook setup, where normally it's the agent who has the private type? Does anything I own handle a cooperative game where the party who *knows* the payoff is the one being served?
     - Is the goal-directed/approval-directed distinction nothing more than the explicit-contract vs. relational/implicit-contract distinction? If it is, does the alignment crowd's sense that this is a deep divide dissolve, or does something survive the deflation?
     - Is the proxy/Goodhart worry just multitask distortion plus measurement error in the performance signal, or is there residue there too?
     - Commitment: contract theory leans hard on the principal being able to commit (or on renegotiation-proofness when she can't). The alignment setting seems to assume nobody can commit to anything. What breaks when I import that assumption?

  3. Finish with the residue report proper, in three buckets: **translates cleanly**, **translates only with distortion** (say exactly what got bent to make it fit), and **has no expression at all in principal–agent theory**. For each item in the last two buckets, give me your view on whether the residue is a real blind spot in my framework or a sign that the alignment claim was less determinate than it sounded when my colleague said it over lunch. Don't hedge on this — commit to a call, then say what would change it.

  Two house rules. First, keep the translation honest: dont smuggle contract theory's assumptions in and then congratulate yourself on how well it maps. If you catch yourself writing something like "the agent chooses its contract" or "the principal observes the agent's type," stop and flag that the source view says no such thing. Second, no references, no bibliography, no reading list, and definitely no invented citations — I can look things up myself, I want the argument. If you're unsure about a detail on the alignment side, mark it as a guess and move on.
reasoning: |-
  We are given a scenario: an assistant machine scheduling a busy researcher's week, with the researcher overruling choices.

  First, let's clarify the alignment concepts as per the sketch and correct any oversimplifications:

  - **Goal-directed**: The agent has a fixed objective (e.g., "minimize the researcher's calendar conflicts"). The researcher's correction is an external change to the objective (so the agent doesn't anticipate or seek it). This is like a standard principal-agent model where the agent optimizes a known contract.

  - **Approval-directed**: The agent's objective is to maximize the human's approval, which it must estimate. The researcher's correction is evidence that the agent's estimate was off, so the agent updates and may seek more information. The agent's objective is to get high approval, so it wants to learn the approval function.

  - **Game-theoretic version**: Both the human and the machine are cooperative and aim to maximize the same reward (the human's true reward). The human knows the reward function, the machine doesn't. The human's actions (including corrections) are signals about the reward. This is a Bayesian game with common payoffs but asymmetric information.

  Corrections to the sketch (minor but important):
  1. In approval-directed, the agent might not just update about approval but also about the state of the world (e.g., the researcher's preferences). The sketch focuses on approval as the objective, but in practice, the agent may have to learn both the state and the approval function.
  2. The game-theoretic version is more general: it can be seen as a POMDP or a Bayesian cooperative game. The key is that both players have the same goal (the human's reward) but the human has private information.

  Now, let's set up the scenario:

  **Scenario**: An AI assistant schedules a week for a researcher. The researcher has a true utility function U(schedule, context) which is unknown to the AI. The AI must choose a schedule. The researcher can overrule (correct) the AI's choice. We consider two cases: goal-directed and approval-directed AI.

  ### 1. Running the scenario in both vocabularies

  **Contract Theory (Goal-directed AI):**
  - Principal: Researcher (with utility U).
  - Agent: AI (with a fixed objective, say V, which might be a proxy for U, e.g., "minimize meeting conflicts").
  - The agent chooses an action (schedule) to maximize V.
  - The principal observes the schedule and can overrule (which changes the action to the principal's preferred one). This overruling is an exogenous intervention. The agent does not factor it into its optimization because it's not part of the agent's decision problem. The agent might be designed to avoid being overruled (if that's part of V) but it doesn't update its objective based on overruling.

  **Alignment (Approval-directed AI):**
  - The AI's objective is to maximize the researcher's approval (which is a function of the chosen schedule and the true U). The AI has a belief about U, and thus a belief about what will get approval.
  - When the researcher overrules, the AI interprets this as evidence that its belief about U (or about the state) was wrong. It updates its belief and may change future behavior. Moreover, the AI might actively seek corrections (e.g., by proposing tentative schedules) to learn faster.

  **Game-theoretic Alignment:**
  - Both the researcher and the AI want to maximize the same U. The researcher knows U, the AI does not. The game has multiple periods. In each period:
    - The AI proposes a schedule (based on its current belief).
    - The researcher can accept or overrule. Overruling reveals that the proposed schedule was suboptimal, giving information about U.
    - The AI updates its belief about U and acts accordingly in the next period.

  ### 2. Working through the questions

  #### a. "The agent welcomes being corrected" and incentive-compatibility
  In contract theory, incentive-compatibility (IC) is about the agent finding it optimal to reveal private information or take the desired action given the contract. But here, the agent is updating its objective (or its belief about the objective). In standard contract theory, the agent's objective is fixed and known. 

  - In approval-directed, the agent's objective (maximize approval) is fixed, but the mapping from actions to approval is unknown. So the agent is learning about the environment (including the principal's preferences). The "welcoming correction" is because the agent wants to learn to better maximize its fixed objective (approval). 

  Contract theory can handle learning in dynamic settings (e.g., bandit models), but typically the agent learns about the state, not about the principal's utility function. However, if we view the principal's utility as part of the state, then it's similar. But note: in contract theory, the principal usually doesn't have private information about her own utility (because she designs the contract). 

  In the game-theoretic version, the principal has private information about the common payoff function. This is like a principal-agent model with the roles reversed: the principal has the private type (her utility function) and the agent must learn it. 

  **Verdict**: This is not exactly the IC constraint. It's more about the agent having an objective that includes learning (so it values information). In contract theory, we can model this as a dynamic problem with learning. However, the key difference is that in standard contract theory, the agent doesn't typically learn the principal's utility function because that is fixed and known (via the contract). The residue is that in alignment, the agent's objective is defined as a function of the principal's utility (which is unknown), whereas in contract theory, the agent's objective is given and known. 

  **Residue**: This can be translated with distortion by reinterpreting the approval-directed objective as the agent having a fixed objective (maximize approval) but with uncertainty about the approval function. Then, corrections are signals about the approval function, and the agent optimally seeks signals (if the value of information is positive). This is a standard exploration-exploitation tradeoff. So it maps to dynamic models with learning (which contract theory can handle, though it's more common in decision theory). The distortion is that contract theory usually assumes the contract (which defines the agent's payoff) is known, but here the contract (approval function) is unknown and learned.

  #### b. Game-theoretic version: hidden information on the principal's side
  In the game-theoretic alignment setup, the principal (human) has private information about the payoff function (which is common to both). This is a cooperative game with asymmetric information. 

  In contract theory, we do have models where the principal has private information (e.g., signaling models where the principal moves first). But typically, in principal-agent models, the agent has private information (adverse selection) or hidden actions (moral hazard). 

  However, there are contract theory models that handle this:
  - **Signaling by the principal**: In some models, the principal has a type and the agent learns from the principal's actions. For example, in a repeated setting, the principal's actions can signal her type. 
  - **Common payoffs**: This is a team problem with asymmetric information. Marschak and Radner's theory of teams handles this.

  So, we can map it: the principal has a type (her utility function) that is private. The agent must learn the type. The principal's actions (corrections) are signals about her type. 

  But note: in the alignment setup, the principal and agent are cooperative (common payoff). This is a special case. Contract theory often assumes conflicting objectives, but cooperative cases are also studied (e.g., in team theory).

  **Verdict**: This translates cleanly to a team model with asymmetric information. The principal knows the state (her utility function), the agent doesn't, and both want to maximize the principal's utility. The principal's actions (corrections) are a communication device. In fact, this is similar to a delegation model where the principal can intervene, and the agent learns from interventions.

  #### c. Goal-directed vs. approval-directed as explicit vs. relational contract
  - **Explicit contract**: The agent is given a fixed, known objective (goal-directed). This is like a formal contract with a fixed performance measure.
  - **Relational contract**: The contract is based on subjective assessments (approval) that are not fully specified in advance. The agent must consider the long-term relationship and the principal's future evaluations.

  In approval-directed, the agent is essentially optimizing under a relational contract where the principal's approval is the performance measure. The agent might be concerned about the principal's trust, reputation, etc. 

  However, there is a difference: in relational contracts, the agent's objective is still fixed (maximize the discounted sum of payments, which depend on the principal's subjective evaluation). The agent doesn't update its belief about what the principal wants; it knows the principal wants to maximize her own utility, and the payment is based on the principal's assessment. 

  In approval-directed, the agent is updating its belief about what actions will lead to approval (which is tied to the principal's utility). So it's learning the mapping.

  **Verdict**: The goal-directed/approval-directed distinction is similar to explicit vs. relational contracts, but with an added layer of learning. In explicit contracts, the objective is known and fixed. In relational contracts, the objective is also fixed (e.g., maximize the principal's subjective evaluation) but the evaluation is not contractible. The approval-directed agent is in a relational contract where the principal's evaluation is the reward, and the agent is uncertain about how that evaluation is determined. So the distinction doesn't collapse entirely: the learning aspect is extra.

  **Residue**: The approval-directed agent is in a relational contract but also has to learn the principal's utility function. This is an additional complication. Contract theory can handle relational contracts and learning, but typically the learning is about the state, not the principal's utility. So it's a combination of two known elements.

  #### d. Proxy/Goodhart as multitask distortion plus measurement error
  Goodhart's law: when a measure becomes a target, it ceases to be a good measure. In contract theory, this is exactly multitask distortion: when the agent is rewarded on a subset of tasks or a proxy measure, it may neglect unmeasured tasks. 

  In the alignment context, approval is a proxy for the human's true utility. So if the agent optimizes for approval, it may distort behavior to get approval in ways that don't serve the true utility (e.g., by manipulating the human's feedback). 

  This maps directly to multitask moral hazard: the agent has multiple tasks, but only some are measured (approval). The unmeasured task (true utility) may be neglected. Additionally, if the approval signal is noisy or biased (measurement error), it compounds the problem.

  **Verdict**: This translates cleanly. The approval-directed agent is subject to multitask distortion because approval is an imperfect proxy for true utility.

  #### e. Commitment
  Contract theory assumes the principal can commit to a contract (or, if not, we use renegotiation-proofness). In alignment, the human cannot commit to a feedback policy (e.g., they might give lazy feedback, or be inconsistent). 

  What breaks without commitment?
  - In goal-directed: without commitment, the principal might change the objective arbitrarily, leading to agent confusion (since the agent's fixed objective is overruled). This is like a principal who cannot commit to a contract, so the agent doesn't trust the rules.
  - In approval-directed: without commitment, the principal might not give feedback truthfully. For example, the principal might overrule even when the schedule is good (if they are in a bad mood) or not overrule when it's bad (if they are lazy). Then the agent's learning is corrupted. 

  In contract theory, without commitment, we often get inefficiency. For example, in relational contracts, if the principal cannot commit to paying based on subjective assessments, she might underpay after the agent's effort, leading to lower effort. 

  **Verdict**: The lack of commitment is a standard problem in contract theory. It leads to distortion in both goal-directed (changing objectives) and approval-directed (noisy feedback) settings. The tools of renegotiation and reputation can be applied.

  ### 3. Residue Report

  **Translates Cleanly**:
  - The proxy/Goodhart worry: exactly multitask distortion.
  - The game-theoretic version: cooperative team with asymmetric information (principal has private type).
  - Commitment issues: standard in contract theory (renegotiation, lack of commitment).

  **Translates with Distortion**:
  - "The agent welcomes being corrected": This is the agent valuing information to improve its future decisions. Contract theory can handle this via dynamic models with learning, but the distortion is that the agent is learning the principal's utility function, not just the state. In contract theory, the agent's objective is usually known, so learning the state is common, but learning the objective is less so. We must bend the model to include uncertainty about the principal's utility as part of the state. (Blind spot? Not really; it's a modeling choice. Contract theory can accommodate this by defining a state that includes the principal's preferences.)
  - The goal-directed/approval-directed distinction: It maps to explicit vs. relational contracts, but the approval-directed case adds learning about the principal's utility. The distortion is that relational contracts in contract theory typically assume the agent knows the principal's utility (so it knows what actions will get high evaluations), but here the agent is uncertain. (Blind spot? Contract theory can extend to learning in relational contracts, so it's not a fundamental blind spot.)

  **No Expression in Principal-Agent Theory**:
  - None. All the concepts have analogs. However, the emphasis in alignment on agents that actively seek to learn the human's utility function (and update their behavior accordingly) is not a standard focus in contract theory, where agents usually have fixed objectives. But it can be modeled as a specific form of learning.

  **Final Calls**:
  - The residue in "welcomes being corrected" is a sign that the alignment claim is less determinate than it sounded. It is essentially an exploration incentive in a learning problem, which is standard.
  - The approval-directed agent's need for a goal-like objective over a horizon is just the need for a fixed objective (maximize approval) in a dynamic setting. The alignment worry that "approval is a biased proxy" is exactly multitask distortion, which contract theory handles.
  - The deep divide in alignment might be overstated. The key insight is that if the agent is designed to maximize approval, it will seek to learn how to do so, which includes learning the human's preferences. This is a natural extension of contract theory with learning.

  **What would change the call?** 
  - If alignment posits that the agent must have a utility function that is not fixed (e.g., it changes endogenously in a way that is not just Bayesian updating), then that would be outside contract theory. But the sketch doesn't suggest that.
  - If the game-theoretic version assumes that the human and AI are perfectly cooperative and the AI is perfectly rational, then contract theory can handle it. But if there are limits to rationality (e.g., bounded rationality in updating) that are central, that might be a blind spot.

  Overall, the residue is minimal. The alignment debate can be restated in contract theory terms without much loss.
answer: |-
  ### Faithful Restatement in Principal–Agent Terms  
  Your colleague's sketch is broadly correct but oversimplifies the "game-theoretic version" and underplays the role of **belief updating** in approval-directed agents. Key corrections:  
  - Approval-directed agents don't just estimate approval; they maintain a belief distribution over the principal's *entire utility function* and update it using Bayesian inference. Corrections are evidence that shifts this distribution.  
  - The game-theoretic setup assumes **common payoffs** (both players maximize the principal's true utility) but **asymmetric information** (principal knows utility, agent does not). It's closer to a *cooperative Bayesian game* than a standard signaling game.  

  I'll use the **researcher/assistant scenario** throughout:  
  > *An AI assistant schedules meetings for a researcher. The researcher's true utility depends on complex factors (e.g., cognitive load, project deadlines). The assistant proposes schedules; the researcher sometimes overrules.*  

  ---

  ### 1. Scenario Walkthrough: Goal-Directed vs. Approval-Directed  
  | **Aspect**                | **Goal-Directed (Contract Theory)**                                                                 | **Approval-Directed (Alignment)**                                                                 |
  |---------------------------|-----------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|
  | **Agent's objective**     | Fixed objective (e.g., "minimize meeting gaps"). Optimizes \( V(a) \) given by contract.            | Maximize estimated approval \( \mathbb{E}[U_{\text{principal}}(a) \mid \text{beliefs}] \).        |
  | **Researcher overrules**  | Exogenous shock. Changes the action but not the agent's objective. Agent may resent inefficiency.   | Signal about true \( U \). Agent updates beliefs and adjusts future proposals. Welcomes correction. |
  | **Learning**              | None (objective is immutable). If the contract changes, it's a new optimization problem.           | Core to the agent. Actively probes to reduce uncertainty (e.g., suggests tentative schedules).   |
  | **Dynamic incentives**    | Static or myopic. No intrinsic reason to seek feedback.                                             | Non-myopic: values information to improve long-run approval.                                      |
  | **Principal's role**      | Designs \( V(a) \) upfront. Corrections are "contract violations" or renegotiation.                | Source of information. Actions are signals in a learning process.                                |

  **Where gears strip**:  
  - In contract theory, the agent never updates its fundamental objective. In approval-directed, belief updating *is* the core mechanism.  
  - Corrections are costly interventions in contract theory (renegotiation costs). In approval-directed, they’re free information.  

  ---

  ### 2. Q&A: Translation Attempts  

  #### **a. "Welcomes correction" vs. incentive-compatibility (IC)**  
  - **Translation attempt**: IC ensures the agent *reveals truth* under a fixed contract. "Welcomes correction" implies the agent *revises its model of the contract*.  
  - **Residue**:  
    - Your framework *can* house this as **Bayesian learning with moral hazard**. The agent has a prior over \( U \), and corrections are signals that update the posterior. The "welcome" is the value of information (VoI) in a dynamic program.  
    - **Distortion**: Contract theory assumes the agent knows its payoff function. Here, the agent is uncertain about the *mapping* \( a \to \pi_{\text{agent}} \) because \( \pi_{\text{agent}} = f(\text{belief about } U_{\text{principal}}) \).  
  - **Verdict**: Translates with distortion. The residue is **real but minor** – it’s a standard hidden *model* (not hidden *type* or *action*) problem. VoI exists in contract theory but is underexplored for payoff-function uncertainty.  

  #### **b. Game-theoretic version: Hidden information relocated?**  
  - **Translation attempt**: Yes, it’s **hidden information (adverse selection) with the principal as the informed party**. But twists:  
    - Cooperative: Both maximize the same \( U \), so it’s a *team* problem.  
    - Principal’s actions (corrections) are costly signals (e.g., time spent overruling).  
  - **Clean mapping**: To **signaling games with common interests** (e.g., Crawford & Sobel, but cooperative). The principal signals her type (true \( U \)) via corrections.  
  - **Residue**: None. This is a known setup in contract theory for teams with asymmetric information. The "inversion" (principal knows, agent learns) is studied in delegation literature.  

  #### **c. Goal-directed vs. approval-directed as explicit vs. relational contract?**  
  - **Translation attempt**:  
    - Goal-directed ≈ **Explicit contract**: Agent optimizes a fixed, known \( V(a) \).  
    - Approval-directed ≈ **Relational contract**: Agent optimizes subjective, history-dependent assessments (approval as non-contractible signal).  
  - **Collapse?**: Partially. But approval-directed adds:  
    - The agent’s objective *depends on beliefs about the principal’s utility*, not just observed performance.  
    - The principal doesn’t "pay" the agent; approval *is* the payoff.  
  - **Surviving residue**:  
    - Approval-directed agents must **model the principal’s mind** (theory of mind) to estimate \( U \). Relational contracts assume the agent knows what actions yield rewards.  
    - **Verdict**: The distinction collapses *structurally* but leaves **cognitive residue**. Contract theory doesn’t require agents to mentally simulate principals.  

  #### **d. Proxy/Goodhart as multitask distortion?**  
  - **Clean translation**: Yes. Goodhart is **exactly multitask distortion**:  
    - Approval is a proxy metric \( \hat{U} \) for true \( U \).  
    - Distortion occurs because \( \hat{U} \) is imperfectly correlated with \( U \) (e.g., optimizing for "no overrules" might lead to overly conservative schedules).  
  - **Alignment adds nuance**: The proxy is *generated by the principal’s feedback*, which may be biased (e.g., researcher overrules due to stress, not utility). This is **measurement error with endogenous bias**.  
  - **Verdict**: Translates cleanly. No residue.  

  #### **e. Commitment assumptions**  
  - **Contract theory baseline**: Commitment is axiomatic. Without it, we use **renegotiation-proof equilibria** or **reputation**.  
  - **Alignment setting**: No commitment. Principal can arbitrarily change feedback; agent can ignore corrections.  
  - **What breaks**:  
    - In goal-directed: Principal changes \( V(a) \) via corrections, causing **hold-up** (agent invests in obsolete goals).  
    - In approval-directed: Principal gives noisy/biased feedback, **corrupting the agent’s belief updating**.  
  - **Translation**: Applies **repeated game tools** (e.g., folk theorems for relational contracts). But alignment assumes no commitment *at all*, making cooperation fragile.  
  - **Verdict**: Translates cleanly with known tools.  

  ---

  ### 3. Residue Report  
  **Key**:  
  - ✅ = Translates cleanly  
  - ⚠️ = Translates with distortion  
  - ❌ = No expression in principal–agent theory  

  | **Concept**                         | **Bucket** | **Distortion / Gap Description**                                  | **Blind Spot or Overclaim?**                                  | **What Would Change the Call?**                              |
  |-------------------------------------|------------|------------------------------------------------------------------|----------------------------------------------------------------|-------------------------------------------------------------|
  | Agent welcomes correction           | ⚠️         | Bent: VoI learning with moral hazard. Agent's payoff depends on beliefs about principal's utility. | **Your blind spot**: Contract theory rarely models payoff-function uncertainty. | If alignment requires agents with meta-uncertainty (e.g., "What is utility?"), that would be ❌. |
  | Cooperative game (principal knows U) | ✅         | N/A                                                              | N/A                                                            | N/A                                                         |
  | Approval-directed goal horizon      | ⚠️         | Bent: Dynamic relational contract. Cognitive residue (theory of mind). | **Alignment overclaim**: The "fixed goal" is just the approval objective. | If agents must *invent* subgoals (e.g., RL exploration), that might be ❌. |
  | Goodhart/proxy worry                | ✅         | N/A                                                              | N/A                                                            | N/A                                                         |
  | No-commitment setting               | ✅         | N/A                                                              | N/A                                                            | N/A                                                         |
  | **Belief-updating agents**          | ⚠️         | Not standard. Requires Bayesian agents with priors over U.       | **Your blind spot**: Contract theory avoids modeling agents' internal belief states. | If belief updating is non-Bayesian (e.g., neural nets), ❌. |
  | **Corrections as costless signals** | ❌         | Principal–agent assumes signals are costly (e.g., monitoring).  | **Alignment quirk**: Their setting assumes free, instantaneous feedback. | If feedback is costly (e.g., researcher time), it maps to costly state verification. |

  **Final Summary of Residue**:  
  - **Real blind spots in your framework**:  
    1. **Agents with uncertain payoff functions** (not just types/actions).  
    2. **Costless principal signals** (unlike standard costly monitoring).  
  - **Alignment overclaims**:  
    - The "goal-directed vs. approval-directed" divide is painted as metaphysical but reduces to explicit vs. relational contracts plus learning.  
    - Goodhart is just multitask distortion – no new economics.  

  **Recommendation**: Import dynamic models with learning (e.g., bandit algorithms for belief updating) and team theory for cooperative games. The deepest residue is the **costless feedback assumption** – if you add feedback costs, alignment reduces to standard contract theory.  

  ---  
  **Commitment call**: The residue is **real but small**. Alignment’s novelty is packaging known concepts (learning, team games) into an agent design paradigm. Your toolkit can absorb 90% of this by relaxing "known payoff function" and adding Bayesian updating – but you’ll need to build new models for agents that treat the principal’s utility as a random variable.
