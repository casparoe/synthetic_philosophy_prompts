answer: |-
  ## The Yard Light

  The deposition notice arrived on a Tuesday. *In the matter of Henderson vs. Collision Specialists.* My name typed neatly under the list of witnesses. They wanted to know what I saw. When I saw it. Under oath. The paper felt heavy, like a poorly mixed batch of primer. Twenty-six years at the bench, mixing colour for car panels, and now this. My certainty, the one thing I traded on, felt like wet lacquer – sticky and liable to run.

  My world was built on relativity. Daylight 6500K. Tungsten glowing warm like old incandescents. The flat, unforgiving LEDs of the shop floor. And out back, after closing, the sickly orange sodium vapour that hung over the yard like cheap fog. Under that sodium light, two panels that kissed under noon sun could become strangers. Metamerism. The trickster god of my trade. A perfect match wasn't a fact; it was a negotiation, a handshake valid only under specific conditions. My reputation rested on seeing the *almost*, the whisper of difference others missed. I claimed I could split a hair nobody else could see.

  I kept two private proofs. The first lived in a worn leather case in my bottom drawer: two small, rectangular colour chips. I’d sprayed them myself, twenty-five years ago, during my apprenticeship, from the same batch, same gun, same thirty seconds. Old Jim, the foreman then, a practical joker with eyes like a hawk, had pointed at one. "That's last year's stock, apprentice. See the shift? Greens went bluer that season." I’d looked. And *saw* it. One leaned cooler, greener. The truth came a week later – Jim braying with laughter, showing me the batch logs. Identical. Absolutely. Yet, from that moment, they’d stayed stubbornly different to my eye. I’d handled them a thousand times, run them through the light booth a hundred. Daylight: one a fraction yellower. Tungsten: one a hair redder. Sodium: a world apart. Knowing changed nothing. Seeing defied knowing. They were my original sin.

  The second proof was the Henderson door. A silver metallic Mazda. A clean repair. I’d matched the colour myself, meticulously, accounting for the subtle flip of the flake. Sprayed it. Baked it. Judged it under the booth: daylight, tungsten, LEDs. Perfect. An invisible repair. I signed the job card. *Match Verified - L. Arlen*. The customer signed off happily.

  Then, two days later, Dave the insurance adjuster, leaning on my bench, smelling of coffee and stale smoke, mentioned it casually. "Hell of a turnaround on that Mazda, huh? Pulling the door overnight, respraying it in Bay Two? Risky, but looked flawless when I checked it. Credit where it’s due." He meant it as praise for the shop’s hustle. My blood froze.

  "What respray?"

  Dave blinked. "The Henderson job. Your bay was backed up, right? Management said they pulled it after you signed off, resprayed it overnight in Two. Same formula, just… faster bay."

  I walked straight to the Mazda, parked out front. The morning sun hit it. And there it was. Glaring. Not subtle. The metallic flake lay wrong on the lower quarter – too coarse, catching the light differently. A distinct darkness pooled along the lower edge of the door panel, like a shadow that shouldn’t be there. It wasn't invisible; it was a botch job. My signature was on that card. For *this*?

  I stormed into the office. Pulled the logs. The mixing record: my formula, my initials. The spray log for Bay One: my times, my signature. Bay Two’s log for that night: nothing. No Henderson Mazda. The security camera footage (grainy, timestamped) showed the car rolling out of Bay One after my shift, parked. No one touched it until the customer drove it away the next morning. Management was baffled, then irritated. Dave backtracked, mumbled about maybe mixing it up with another job. The evidence was clear: nothing changed. No respray. The panel I signed off on was the panel now sitting on the car. Yet, from the moment Dave spoke, the mismatch bloomed like a stain I couldn't unsee. My certainty, the bedrock of my job, cracked open.

  Now the deposition loomed. *What did you see, Ms. Arlen? When did you see it?* How could I swear to anything?

  I spent days circling the Mazda whenever it was in for unrelated warranty checks. Under the shop LEDs:
  > *The silver held a consistent depth across the door and fender, the metallic particles suspended uniformly, catching the light with a fine, even sparkle. The colour transition was seamless, a single sheet of liquid metal.*
  I forced myself to write it down in my notebook. Then, later, under the harsh noon light streaming through the open bay door:
  > *The lower quarter of the door panel betrayed a coarser texture, the metallic flakes clumping slightly, refracting light in jarring bursts. A distinct, cool shadow clung to the bottom edge, leaching warmth from the silver above, creating a visible step where it met the factory paint.*
  I read both descriptions back. They described the same physical object, minutes apart. I closed the notebook. The contradiction sat there, heavy and undeniable. No editor required.

  I needed a control. Proof against myself. I enlisted Gary from prep. He thought I was nuts, but he owed me for covering his shifts when his kid was sick.

  "Okay, Len," he sighed, holding up three freshly sprayed test cards. All identical silver metallic, from the same batch. "I label them A, B, and C. You don't look. I shuffle them under the booth. You tell me if any look different."

  I turned my back. Heard the rustle of cards, the click of the booth switches cycling through the lights.

  "Okay," he said. "Look."

  I stepped up. Three panels under D65 daylight tubes. Identical. Utterly. The same fine sparkle, the same depth. "They're the same, Gary."

  "Are you sure?"

  "Positive. Dead match."

  He flipped them. His labels: A, A, A. All the same card. He’d only put one in the booth, held it up three times.

  "Damn it, Gary! That's not the test!"

  "Proves my point, Len," he said, not unkindly. "You *knew* they should be the same, so you *saw* them the same. Even when it was just one card. How can I test what you see when you know what I know? It’s like…" he gestured vaguely, "like trying to surprise yourself."

  He was right. I couldn't unknow Dave’s words. I couldn't unknow the shop logs. I couldn't unknow the existence of Bay Two. The knowledge was the dye colouring the white wine. There was no blind for my own mind. The control was contaminated from the inside.

  I brought out the spectrophotometer. The shop’s expensive toy, usually relegated to mixing complex tri-coats. It measured light reflected, spat out numbers: L*a*b* values, Delta-E. Objective data. I measured the Mazda door. I measured the adjacent fender. I measured my old apprentice chips. The numbers for the Mazda panels came back: Delta-E 0.8. Well within the industry tolerance for an invisible repair (Delta-E < 1.5). Tolerance. Just a number someone agreed was acceptable. Not a truth. Not a line drawn by God. The numbers for my apprentice chips? Delta-E 0.3. A smaller number saying they were *more* identical than the Mazda panels. Yet my eyes screamed the opposite. The machine confirmed the world saw no significant difference on the Mazda. It confirmed the impossible difference on my chips. It settled nothing. It just added another layer, another light source under which reality shifted.

  I started avoiding the yard after closing. The sodium light felt like an accuser. Its orange glow was where truths dissolved. But one evening, prepping for the deposition, I needed air. I walked out. The Mazda was parked near the fence. The sodium vapour cast its usual jaundiced pall. I forced myself to look at the door.

  Under the orange haze, the difference wasn't glaring. It was… different. Not better, not gone. The coarse flake became a muddy texture. The cool shadow became a bruised purple. It wasn't the mismatch I saw under daylight, nor the seamless match I saw under LEDs. It was a third thing, a phantom born of sodium and doubt. Metamerism in my mind. The panel wasn't changing. The light was changing. *I* was changing. Where did the panel end and my seeing begin?

  The deposition was tomorrow. I sat in the silent spray booth after everyone left. My tools lined up: mixing cups, scales, viscosity cup, the spectrophotometer humming faintly. The embodiment of measurement, of formula. And the panels, waiting. My hands rested on the cool metal bench. They knew the weight of a spray gun, the twist of a mixing paddle, the drag of sandpaper. They knew the *feel* of a surface – smooth, textured, orange-peeled. They knew work. Reliable work.

  I picked up the spray gun, disconnected, just feeling its familiar balance. I thought about swearing on a Bible. About saying, "I saw a perfect match at 3:15 PM on October 12th under D65 illumination. I saw a visible mismatch at 10:07 AM on October 14th under natural daylight." Both statements felt true. Both felt like descriptions of something that happened *to* me, not choices I made. The Henderson door, under specific light, *had* looked seamless. Later, under different light and different knowledge, it *had* looked wrong. The object? The light? The knowledge? Where did the seeing happen?

  I put the gun down. My fingers were clean. I opened a can of universal primer. Not for a job. Just to feel it. I dipped a clean stir stick in. The thick, grey paste clung to the wood. I lifted it out, watched the slow drip, drip into the can. The smell, sharp and chemical, filled the booth. I wiped the stick on a rag, leaving a smooth, opaque grey streak.

  This was real. The weight of the can. The chill of the metal. The tack of the primer on the rag. The smell in my nose. My hands knew this. They knew mixing. They knew spraying. They knew touching a panel and feeling if it was level. They didn't know about Dave's words. They didn't know about Bay Two. They didn't know about identical chips that refused to match.

  I dipped my index finger into the open can. The primer was cool, viscous. I pulled it out, coated to the first knuckle. I smeared it deliberately onto the back of my other hand. A thick, wet, grey bar. I watched it. Just grey. No metamerism here. No history. Just pigment and binder on skin.

  Tomorrow, they would ask about colour. About light. About what I saw. My hands, coated in grey primer, knew only substance. They were my anchors, cut both ways. They touched the world. But the colour? The seeing? That happened somewhere else. Somewhere between the light and the thing and the story I couldn't un-know. The grey on my skin dried slowly, tightening. A fact. But what colour was it, really? Under sodium light out in the yard? Under the flat LEDs? Did it matter? It was just grey. Until someone told me it wasn't. And then...?

  I looked at the streak on the rag. Solid. Certain. Grey. I closed the can. The deposition notice lay on the bench beside it. I picked up the rag with my clean hand. I began to wipe the drying primer from my finger. It took work. It always did.

  ---
  **Title:** The Yard Light
