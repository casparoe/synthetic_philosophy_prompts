  Starting with Q's probability: The user's research found only 10-12.5% of their list qualified. Historical studies like those by Borel or Corry suggest even less. I'd estimate P(Q) at 0.1. The coherence of "purely internal" is tricky. While some theories like set theory or transfinite numbers seem purely internal, influences like cultural or technological contexts blur the lines. Maybe P(coherence) around 0.4.

