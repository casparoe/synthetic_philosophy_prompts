  We are designing a sorting instrument for risk attitudes. The goal is to distinguish between several views that are often conflated under the term "risk-aversion".

  ## Step 1: The Logical Space

  We need to identify the axes that genuinely separate the positions. We consider the following candidate axes:

  1. **Nature of the risk attitude: utility function vs. probability/rank weighting**
     - Some views attribute risk aversion to the shape of the utility function (concave in outcomes, e.g., expected utility). Others use a transformation of probabilities or ranks (e.g., rank-dependent utility, prospect theory).
     - Justification: This is a fundamental divide. In EU, risk aversion is solely due to diminishing marginal utility. In rank-dependent models, it's due to overweighting bad outcomes (low ranks) and underweighting good ones.

  2. **Evaluation: global vs. event-wise**
     - Does the evaluation of a gamble depend on the entire state space (global) or can it be broken down event by event (event-wise)? Event-wise independence is violated if the same outcome in different events is evaluated differently based on the event.
     - Justification: Expected utility satisfies the sure-thing principle (event-wise independence). Some generalizations (like RDU) violate it because they weight by ranks that depend on the entire distribution.

  3. **Source of probability: described chance, frequency, expert estimate**
     - Do risk attitudes change based on how the probability is presented? For example, is a 50% chance from a coin flip treated the same as 50% from a long frequency or an expert's subjective estimate?
     - Justification: Ambiguity aversion (Ellsberg) shows that people treat known probabilities differently from unknown. But note: we are to avoid the words "ambiguity" and "uncertainty". We can still probe by varying the description.

  4. **Boundedness of utility**
     - Is the utility function bounded above (and/or below)? This matters for extreme stakes (e.g., avoiding infinite disutility in Pascal's wager type situations).
     - Justification: For existential stakes, boundedness prevents extreme risk aversion from dominating all else.

  5. **Dynamic consistency: changing one's mind**
     - If an agent makes a plan and then gets new information, does she stick to the plan (resolute) or re-optimize (sophisticated)? And does the global evaluation allow for commitment?
     - Justification: Some views (like standard EU) are dynamically consistent, but others (like some forms of rank-dependent) might lead to time inconsistency.

