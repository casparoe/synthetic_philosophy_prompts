  ## Step 5: Sequential Appendix

  Three multi-stage problems to separate myopic, sophisticated, resolute, globally evaluating.

  Example: a gamble that can be decomposed.

  Problem 1:
  Stage 1: Choose between:
     - Option X: A sure $1000.
     - Option Y: A gamble that in stage 2 you can choose to play a 50% chance of $2000 or not, but if you choose not, you get $500.

  Stage 2: If you chose Y, then you can choose to play the gamble (50% $2000, 50% $0) or take $500.

  A myopic agent at stage 2 would compare $500 for sure vs 50% $2000. If they are risk-averse, they might take $500. At stage 1, they would compare $1000 vs the option that leads to $500 for sure, so they choose X.

  A sophisticated agent foresees that at stage 2 they will take $500, so at stage 1 they choose X.

  A resolute agent would commit at stage 1 to play the gamble at stage 2, so they choose Y and then at stage 2 play the gamble.

  A globally evaluating agent (who evaluates the entire tree) would see that Y with commitment to gamble has the same EU as the gamble in a static choice, so they might choose Y if they are risk-seeking or neutral, but if risk-averse, they might prefer X.

  This is complex.

  We design:

  **Problem 1:**
  - At time 1, choose between:
     - A: You will get $1,000 for sure.
     - B: You will move to time 2, where you will choose between:
          - B1: $500 for sure.
          - B2: A fair coin flip: heads you win $2,000, tails you win $0.

  The myopic agent at time 2: if they are risk-averse, they choose B1 ($500). Then at time 1, they compare A ($1000) to B ($500), so choose A.

  The sophisticated agent: knows they will choose B1 at time 2, so at time 1, they choose A.

  The resolute agent: decides at time 1 to choose B2 at time 2. Then the value of B is the gamble, which has EU $1000, so if they are risk-neutral, they are indifferent between A and B. If they are risk-averse, they might prefer A. But if resolute, they can choose B and then choose B2.

  The globally evaluating agent: evaluates the entire plan. If they choose B and then B2, they get the gamble. If they choose B and then B1, they get $500. So they will only choose B if they commit to B2. So they might choose A if they are risk-averse, or choose B and then B2 if they are risk-neutral or seeking.

