  ### **1. The Logical Space**  
  The axes separating risk attitudes are derived from fundamental theoretical divides. I retain four axes, collapsing one candidate and reframing another:  

  - **Attitude Location (Utility vs. Weighting)**:  
    Whether risk aversion stems from diminishing marginal utility of outcomes (concave utility function) or from non-linear weighting of probabilities/ranks (e.g., overweighting bad outcomes). This separates EU from rank-dependent and risk-weighted views.  
    *Justification*: Core divide in the literature; EU locates attitude in utility, while others use probability transformations.  

  - **Evaluation Scope (Global vs. Event-Wise)**:  
    Whether a gamble is evaluated as a whole (global) or by aggregating event-wise assessments (event-wise). Event-wise evaluation satisfies the "sure-thing principle" (independence of common consequences); global evaluation violates it.  
    *Justification*: Determines sensitivity to state-space partitioning (e.g., Allais paradox).  

  - **Source Sensitivity (Device/Frequency/Expert)**:  
    Whether risk attitude depends on how probabilities are sourced: described chance devices (e.g., coin flip), long-run frequencies, or expert estimates. This distinguishes ambiguity-sensitive views (e.g., multiple-priors) from source-insensitive ones.  
    *Justification*: Empirical evidence (e.g., Ellsberg) shows attitudes vary with source, even for identical probabilities.  

  - **Boundedness (Bounded vs. Unbounded Utility)**:  
    Whether the utility function is bounded above (avoiding extreme risk aversion for existential stakes) or unbounded.  
    *Justification*: Critical for existential gambles; unbounded utility permits "Pascal's mugging."  

  **Dropped Axis**: *Whether the view permits changing one’s mind mid-decision* collapses into **Evaluation Scope**. Global evaluation implies dynamic inconsistency (reoptimizing mid-plan), while event-wise evaluation implies consistency. This is probed dynamically (Appendix).  

  ---

  ### **2. The Instrument**  
  Twelve one-shot choices. Stakes:  
  - **Graduate (G)**: Term rent ($5,000), stipend supplement ($2,000), tuition ($10,000).  
  - **Existential (E)**: Civilizational/extremely large-scale outcomes (e.g., 1 billion lives saved).  

  **Items**:  
  1. **G1 (Device, Gains)**:  
     - A: Sure $2,000.  
     - B: 50% chance $4,000, 50% $0 (fair coin).  

  2. **G2 (Frequency, Gains)**:  
     - A: Sure $2,000.  
     - B: 50% chance $4,000, 50% $0 (based on 1,000 historical cases: 500 won $4,000, 500 won $0).  

  3. **G3 (Expert, Gains)**:  
     - A: Sure $2,000.  
     - B: 50% chance $4,000, 50% $0 (50% is an expert committee’s best estimate).  

  4. **G4 (Event-Wise Probe)**:  
     - A: 90% chance $5,000, 10% $0.  
     - B: 90% chance $5,000, 5% $10,000, 5% $0.  

  5. **G5 (Event-Wise Probe)**:  
     - A: 5% chance $10,000, 95% $0.  
     - B: 5% chance $10,000, 90% $5,000, 5% $0.  

  6. **G6 (Weighting Probe, Losses)**:  
     - A: Sure loss of $1,000.  
     - B: 50% chance lose $0, 50% lose $2,000 (fair coin).  

  7. **E1 (Device, Gains)**:  
     - A: Save 1 billion lives for sure.  
     - B: 50% chance save 2 billion lives, 50% save 0 (fair coin).  

  8. **E2 (Frequency, Gains)**:  
     - A: Save 1 billion lives for sure.  
     - B: 50% chance save 2 billion lives, 50% save 0 (based on 1,000 historical crises: 500 saved 2 billion, 500 saved 0).  

  9. **E3 (Expert, Gains)**:  
     - A: Save 1 billion lives for sure.  
     - B: 50% chance save 2 billion lives, 50% save 0 (50% is expert committee’s best estimate).  

  10. **E4 (Boundedness Probe)**:  
      - A: Save 1 life for sure.  
      - B: 1 in 10^100 chance save 10^100 lives, else save 0.  

  11. **E5 (Catastrophe Probe)**:  
      - A: 99% chance save 10 billion lives, 1% save 0.  
      - B: Save 9.9 billion lives for sure.  

  12. **E6 (Global vs. Variance Penalty)**:  
      - A: 50% chance save 5 billion lives, 50% save 5 billion.  
      - B: 50% chance save 10 billion lives, 50% save 0.  

  **Responses**: Choose A, Choose B, or Unable to Choose.  

  ---

  ### **3. The Leaves**  
  **Named Positions**:  
  1. **EU-Risk Averse**: Concave utility. Source-insensitive, event-wise, unbounded/bounded.  
  2. **Mean-Variance**: Penalizes variance. Source-insensitive, global, unbounded.  
  3. **Rank-Dependent (RDU)**: Probability weighting. Source-insensitive, global, unbounded.  
  4. **Risk-Weighted EU (RWEU)**: Normative rank-dependent. Source-insensitive, global, bounded.  
  5. **Multiple-Priors (Maxmin)**: Ambiguity-averse, risk-neutral for known probabilities. Source-sensitive, global, bounded/unbounded.  
  6. **Smooth Ambiguity**: Attitude via higher-order belief curvature. Source-sensitive, global, bounded.  
  7. **Undefined Expectations (UE)**: Rejects gambles with undefined EU. Source-sensitive, global, bounded.  
  8. **Catastrophe Avoidance (CA)**: Maximizes min outcome. Source-insensitive, global, bounded.  

  **Empty Cells** (unoccupied due to incoherence/unattractiveness):  
  1. *Event-wise + Probability Weighting*: Incoherent; weighting requires global ranks.  
  2. *Source-Sensitive + Event-Wise*: Unattractive; ambiguity models violate event-wise independence.  
  3. *Unbounded + Catastrophe Avoidance*: Incoherent; unbounded utility ignores catastrophes.  
  4. *Variance-Penalizing + Event-Wise*: Unattractive; variance is global, not event-wise.  

  ---

  ### **4. Scoring Key**  
  **Minimal Subset (4 items)**: G1 (Device), G3 (Expert), G4 (Event-Wise), E4 (Boundedness).  
  - **Patterns**:  
    - **EU-Risk Averse**: G1: A; G3: A; G4: B (B has higher EV); E4: A (if bounded) or B (if unbounded).  
    - **RDU/RWEU**: G1: A; G3: A; G4: A (overweights 10% loss in B); E4: A.  
    - **Multiple-Priors**: G1: A/B; G3: A; G4: A/B; E4: A.  
    - **Catastrophe Avoidance**: G1: A; G3: A; G4: A (avoids 10% $0); E4: A.  
    - **Mean-Variance**: G1: A; G3: A; G4: A (B has higher variance); E4: A/B.  

  **Inconsistent Patterns**:  
  - Intransitive answers → Evidence of no coherent view (e.g., choosing A in G1 but B in G2/G3).  
  - Mixed source sensitivity → Ambiguity-sensitive view.  
  - **Protocol**: If >2 inconsistencies, flag as "no view"; else, map to nearest leaf.  

  **Per-Item Key (Assumption Denied)**:  
  - **G1**: Deny *concave utility* → Rational to choose B.  
  - **G3**: Deny *source insensitivity* → Rational to choose B if expert-source trusted.  
  - **G4**: Deny *event-wise independence* → Rational to choose A.  
  - **G6**: Deny *convex loss utility* → Rational to choose A.  
  - **E4**: Deny *bounded utility* → Rational to choose B.  
  - **E5**: Deny *catastrophe focus* → Rational to choose A.  

  ---

  ### **5. Sequential Appendix**  
  Three multi-stage problems (decompose G1/E1 gambles):  

  1. **Problem 1**:  
     - Stage 1: Choose between:  
       - X: Get $2,000 now.  
       - Y: Move to Stage 2.  
     - Stage 2 (if Y chosen): Choose between:  
       - Y1: Get $1,000.  
       - Y2: 50% $4,000, 50% $0.  

  2. **Problem 2** (Existential version of Problem 1).  
  3. **Problem 3**:  
     - Stage 1: Choose between:  
       - P: 50% chance to save 2B lives, 50% save 0.  
       - Q: Save 1B lives.  
     - Stage 2 (if P chosen): Observe coin flip; if tails, choose:  
       - Q1: Save 500M lives.  
       - Q2: 50% save 1B, 50% save 0.  

  **Distinctions**:  
  - **Myopic**: Re-optimizes per stage (e.g., Problem 1 Stage 2: choose Y1 if risk-averse).  
  - **Sophisticated**: Foresees re-optimization (e.g., Problem 1 Stage 1: choose X to avoid Y1).  
  - **Resolute**: Sticks to ex-ante optimal plan (e.g., Problem 1: choose Y, then Y2).  
  - **Global**: Evaluates entire plan (e.g., Problem 1: equivalent to static choice of Y2).  

  **Static Items Cannot Distinguish**: Myopic vs. sophisticated (requires dynamic choice).  

  ---

  ### **6. Non-Separability**  
  **Indistinguishable Pairs**:  
  - **EU-Bounded vs. Multiple-Priors**: Both choose A in E4, G3. Separated only by introspection on belief vs. utility.  
  - **RDU vs. RWEU**: Representationally equivalent for gains; require losses (G6) to distinguish loss aversion.  
  - **Smooth Ambiguity vs. Undefined Expectations**: Both avoid expert gambles; require non-numerical outcomes (e.g., "justice") to expose UE’s fear of undefined sums.  
  - **Mean-Variance vs. Catastrophe Avoidance**: Both choose A in E5; require correlated risks (not in items) to distinguish variance from min.  

