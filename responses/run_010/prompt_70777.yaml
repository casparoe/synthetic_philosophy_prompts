prompt: |-
  I'm an annotator on a pragmatics dataset and my supervisor has been making the final call on whether various utterances carry a conversational implicature. Here's what he's coded so far, with bits of his notes in parentheses:

  1. "Some of the cookies are gone" — plain assertion, speaker knows exactly how many. Implicature: yes, that not all of them are. (Tagged G.)
  2. "If some of the cookies are gone, we'll have to bake more tomorrow." Implicature: no — he says the not-all inference just doesn't show up in this position.
  3. "You may have tea or coffee." Yes, and he counts two: that either one is permitted, and that having both isn't.
  4. "Either the oven was left on or the wiring's shot" — said by someone visibly unsure which. Yes: that the speaker doesn't know which. (His note: if she knew, she'd have said which — that's the whole inference.)
  5. "He's either rich or wealthy." No implicature, and he marks the utterance itself as infelictous.
  6. "She's French but she's generous." Yes, though tagged differently from the rest: he says it comes from the word itself rather than the situation, and that the sentence would be true even if there were nothing surprising about the combination.
  7. "If you eat your vegetables you can have ice cream." Yes: no ice cream otherwise.
  8. A: "Wanna grab a movie?" B: "I've got a 6am shift." Yes: no. (Tagged P.)
  9. A: "Is there any milk left?" B: "The store closed at nine." Yes: no milk. He notes there's no scale word involved anywhere, and tags it P.
  10. "John stopped eating meat." No — he says that's a presupposition and goes in a seperate column entirely.
  11. "Some of the students passed, in fact all of them did." No.

  He also has a standing policy he repeats constantly: he won't code an inference as an implicature unless the speaker could tack on something like "and I don't mean to suggest anything beyond that" without contradicting themselves. Item 6 is the one exemption, which he says fails that test on purpose.

  The new item I have to bring him: a waiter, asked whether the soup is ready to be served, says "It's warm" — of a soup that everyone at the table can plainly see is steaming hot. The waiter's point is that it's ready. Three things get coded: (a) is there an implicature that the soup isn't hot, (b) if anything is coded there, is it G or P, and (c) could the waiter add "in fact it's practically boiling" without that being infelicitous?

  Predict his three codes and explain the reasoning you think he'd give. Then lay out the candidate general rules that fit all eleven verdicts above — I can see at least three: one about lexical scales and the positions they're allowed to fire in, one that's basically Gricean maxim-following with everything driven by what the hearer needs to make the utterance worth processing, and a two-principle neo-Gricean version, plus maybe something I'm not seeing. Say which of the eleven verdicts actually discriminate between those rules and which ones are doing no work at all. Then tell me which rule you'd bet he's running, what his coding of the waiter case commits him to either way, and finally give me one more utterance — something short I could hand him next week — that would settle it if your prediction turns out wrong.

  Please write the whole thing in American English.
