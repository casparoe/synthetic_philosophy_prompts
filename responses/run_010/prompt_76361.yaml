prompt: |-
  I am the technical lead for autonomy at a company that retro-fits autonomous mobile robots into operating client sites — distribution warehouses and, more recently, two hospital trusts. Our stack is hybrid: an LLM-based task interpreter converts a natural-language instruction from site staff into a candidate plan, and a classical planner with hand-written action schemata validates and executes it. Those schemata were written by four different engineers over three years.

  Our worst incidents have not been perception failures. They have been cases in which the world changed in a way no schema anticipated, or in which a schema implied that nothing else had changed when something plainly had. Our audit team logs these under three internal bug classes of its own invention: silent-delta (the action had an effect nobody wrote down), ghost-precondition (the action's executability quietly depended on a fact nobody checked), and stale-world (the planner's belief about a fluent outlived the change in the environment that invalidated it). Last quarter a silent-delta in a charging-dock schema left forty robots standing idle in an aisle for nine hours.

  What I want is a review procedure my team can actually run, not an essay on the frame problem. It will be used at our weekly design review, on one action schema or one interpreter-to-planner hand-off at a time, by engineers with no philosophy background, in about thirty minutes, and it must leave behind a written record that a hospital client's risk committee can audit and that our safety lead countersigns.

  Please provide the following.

  1. The questions to be asked, in the order they should be asked, each with an explicit statement of what counts as a sufficient answer and what counts as a failure to answer. Where the procedure terminates in a do-not-ship, say so. Where it hands the decision to a human because the question turns on judgment, engineering risk appetite, or values rather than fact, say to whom and why.

  2. A treatment of the distinction the procedure depends upon between the narrow problem of default persistence — which has genuine engineering solutions, including the discipline of writing one effect axiom per fluent and deriving non-change from them rather than stating it — and the wider problem of knowing which facts are relevant at all, which no checklist can close. For each question in the procedure, indicate which side of that line it sits on. The procedure must not market the first as a cure for the second.

  3. A routing rule that lets a reviewer decide in under two minutes whether the defect in front of them is a persistence problem, a problem about the indirect consequences of an action, or a problem about whether an action's enabling conditions can ever be fully stated. We currently log all three as silent-delta, and I suspect our taxonomy has no slot for two of them. Tell me plainly whether my three bug classes are the wrong shape for this distinction and, if they are, what to replace them with — bearing in mind that renaming a bug class across four engineering teams costs me a quarter.

  4. A one-page record format for the reviewer to complete, together with a note on which fields are objective, which are estimates, and which are judgment calls dressed in procedural clothing.

  Then run the procedure on three cases and show me the completed record, or its equivalent, for each.

  (a) An open-dock-door schema in a fixed-layout warehouse where inventory positions are surveyed nightly and the door state is polled by a sensor every two seconds. I expect this to pass.

  (b) The interpreter handling a request to take a specimen to lab three through an occupied hospital corridor, where the route passes a fire door, a lift lobby and a ward entrance, and where the robot's presence changes what the people near it do. This is the case our commercial team is demonstrating to a third trust next quarter and I would very much like it to pass. If the procedure fails it, I want it failed clearly, with an account of what would have to change for it to pass — not passed with caveats I already know will be ignored by the demo team.

  (c) A relocate-pallet-to-overflow-bay schema in which the pallet's new position narrows a marked escape route below its lawful width. Nothing among the schema's stated effects is incorrect; the trouble lies in what the new position entails. I want to see whether the procedure catches this, or whether this is precisely the kind of case our current review waves through.

  Finally, state what the procedure cannot do, where it will generate false confidence, and which single step is most likely to be skipped under schedule pressure — and what to require in the record so that skipping it is visible afterwards.

  Please write the answer in British English. Do not append a bibliography or a reading list; if you name a technique or a known result, name it and say in a clause what it does, and go no further.
reasoning: |-
  We are designing a review procedure for action schemata and interpreter-to-plplanner hand-offs. The goal is to catch bugs of the types: silent-delta, ghost-precondition, and stale-world. The procedure must be run in 30 minutes, leave an auditable record, and be understandable by engineers without a philosophy background.

  The procedure will be structured as a series of questions. We break down the problem into:

  1. The review questions, in order, with clear pass/fail criteria.
  2. Distinguishing between the narrow frame problem (default persistence) and the broader issue of knowing which facts are relevant.
  3. A routing rule to classify defects into three categories: persistence, indirect consequences, or enabling conditions (which may lead to reclassification of bug types).
  4. A record format.

  We also note that the three bug classes (silent-delta, ghost-precondition, stale-world) might not perfectly align with the three categories above. We will adjust if necessary.

  ### Part 1: Review Questions

  We propose the following 10-step procedure. The first 8 steps are for an action schema, and the last 2 are for the interpreter-to-planner hand-off. If the review is for an interpreter hand-off, skip to step 9. For an action schema, start at step 1.

  **Step 1: Identify the action's primary purpose.**
     - Question: "What is the intended outcome of this action, stated in terms of the state of the world?"
     - Sufficient answer: A clear, concise statement of the primary effect(s) that the action is designed to achieve (e.g., "The robot is at the charging dock and the dock is now occupied").
     - Failure: Vague or multiple primary purposes, or failure to state the purpose in terms of state changes.
     - If failed: Do not ship. The schema is ambiguous.

  **Step 2: List all preconditions.**
     - Question: "What conditions must be true for this action to start? List every condition the schema checks, and note any that are not checked but are known to be required."
     - Sufficient answer: A complete list of preconditions that the schema actually checks (from the code) and an explicit note of any unstated but necessary conditions (from the engineer's knowledge). The list must be exhaustive for the conditions the schema uses.
     - Failure: Any precondition that is required for safety or correctness is missing from the list (whether it is checked or not). If the engineer cannot list the preconditions, that is a failure.
     - If a required precondition is not checked: Log as ghost-precondition. Do not ship until fixed.

  **Step 3: Verify preconditions against the primary purpose.**
     - Question: "Do the preconditions ensure that the action can only be attempted when it is safe and when the primary purpose is achievable? If not, what can go wrong?"
     - Sufficient answer: An explanation of how the preconditions guarantee that the action will achieve the primary purpose (if the world does not change) and that it is safe to attempt. Any known gap must be stated.
     - Failure: A scenario is identified in which the preconditions hold but the primary purpose is not achieved or the action is unsafe. This indicates a ghost-precondition (if a condition is missing) or a flaw in the purpose (if the purpose is not always achievable even with the preconditions).
     - If failed: Do not ship until fixed.

  **Step 4: List all direct effects.**
     - Question: "What facts about the world does this action directly change? List every fluent that the schema sets, deletes, or toggles, and note any that are not stated but are known to be changed."
     - Sufficient answer: A complete list of the fluents that the schema directly modifies (from the code) and an explicit note of any unstated but direct effects (from the engineer's knowledge). The list must cover every direct effect.
     - Failure: Any direct effect that occurs in reality is missing from the list. If the engineer cannot list the direct effects, that is a failure.
     - If a direct effect is not stated: Log as silent-delta. Do not ship until fixed.

  **Step 5: Verify that no other fluent is assumed to persist.**
     - Question: "Does the schema assume that any fluent not listed in step 4 remains unchanged? If so, is that assumption valid? (Note: This is the narrow frame problem of persistence.)"
     - Sufficient answer: The engineer must state that the schema assumes that only the listed fluents change and all others persist. Then, they must confirm that the direct effects do not indirectly change other fluents (if they do, that's a failure of step 5). This step is about the default persistence assumption and the engineering discipline of not having an effect on unlisted fluents.
     - Failure: The schema has an effect on a fluent that is not listed (which would be a silent-delta) OR the schema explicitly states that some other fluent does not change (which is an error because persistence should be the default and not stated). Also, if the engineer cannot confirm the persistence assumption, that is a failure.
     - Note: This step is about the narrow frame problem. We are ensuring that the schema does not have hidden effects and that it relies on the default persistence for unmentioned fluents.
     - If failed: Do not ship until fixed.

  **Step 6: Consider indirect effects.**
     - Question: "Might this action cause a change in the world that is not captured by the direct effects? Consider: physical consequences (e.g., blocking a path), changes in other agents' behavior (e.g., people moving away), or changes in the environment (e.g., triggering a sensor)."
     - Sufficient answer: The engineer must list any known indirect effects that are relevant to the robot's operation or safety. If they cannot think of any, they must state that. If they list some, they must explain whether the schema or the planner accounts for them.
     - Failure: The engineer identifies an indirect effect that is not accounted for and that could lead to a safety issue or mission failure. This is a silent-delta (if it's an effect that should be modeled) OR it might be a new bug class (if it's about relevance). However, note that we cannot list every indirect effect. This step is a judgment call.
     - If an unaccounted indirect effect is identified that is critical: Do not ship until fixed or until a mitigation is in place (like a monitoring system). Otherwise, if it is not critical, it may be noted as a known limitation and passed with a risk assessment.
     - This step is about the broader frame problem. It is a judgment call. The decision to ship despite an unaccounted indirect effect must be escalated to the safety lead.

  **Step 7: Check for stale-world risks.**
     - Question: "During the action's execution, which fluents are assumed to remain constant? How often are these fluents sensed or updated? Is the update frequency sufficient given the volatility of the fluent?"
     - Sufficient answer: A list of fluents that are critical for the action's safety and success that are not rechecked during execution, and the engineer must justify the update policy (e.g., "The door state is polled every 2 seconds, which is sufficient because doors don't change faster than that in our environment"). For each such fluent, the engineer must state the update frequency and the reason it is safe.
     - Failure: A fluent that is critical and volatile (e.g., the state of a fire door in a hospital) is not updated at a sufficient frequency, and the action's duration is long enough that the fluent might change. This indicates a stale-world risk.
     - If failed: Log as stale-world. Do not ship until the update frequency is increased or the action is redesigned to recheck the fluent.

  **Step 8: Review error handling and timeouts.**
     - Question: "What happens if the action fails to achieve its primary purpose? What timeouts or fallbacks are in place? How are exceptions communicated to the planner?"
     - Sufficient answer: A description of the failure modes and the recovery actions. The answer must cover at least one failure scenario and the corresponding handling. The engineer must also state the timeout values and how they were chosen.
     - Failure: No error handling or timeouts are defined, or the defined ones are clearly inadequate (e.g., an infinite wait). This is not one of the three bug classes, but it is a separate failure. Do not ship until fixed.

  **Step 9 (for interpreter hand-off): Validate the mapping from natural language to action parameters.**
     - Question: "How does the interpreter map the natural language instruction to the parameters of the planner's actions? What are the failure modes of this mapping? How are ambiguities resolved?"
     - Sufficient answer: A clear explanation of the mapping process, including any heuristics or constraints. The engineer must list the possible mis-mappings and the safeguards against them (e.g., confirmation for high-risk actions). The answer must cover at least one example of an ambiguous instruction and how it is handled.
     - Failure: The mapping process is ad-hoc and prone to errors that could lead to an unsafe plan, and there are no safeguards. Do not ship until fixed.

  **Step 10 (for interpreter hand-off): Verify plan validation.**
     - Question: "After the interpreter proposes a candidate plan, what checks does the planner perform to validate it? How are plan failures (during execution) fed back to the interpreter?"
     - Sufficient answer: A description of the validation checks (e.g., the planner checks preconditions for every step) and the feedback loop for learning from failures. The engineer must state that the planner re-checks preconditions at execution time (if that is the case) and how the interpreter is updated when plans fail.
     - Failure: The planner does not validate the plan beyond the initial preconditions, or there is no feedback loop for interpreter improvement. This is a process failure. Do not ship until fixed.

  ### Part 2: Distinguishing the Frame Problem

  - **Narrow frame problem (default persistence)**: This is addressed by steps 4 and 5. Step 4 ensures that all direct effects are stated, and step 5 ensures that the schema does not have hidden direct effects and that it relies on the default persistence for unmentioned fluents. This is an engineering discipline: we write one effect per fluent we change and do not state that other fluents remain the same because that is the default.

  - **Broader frame problem (knowing which facts are relevant)**: This is addressed by steps 6 and 7. Step 6 considers indirect effects and step 7 considers the volatility of fluents during execution. These are judgment calls because we cannot exhaustively list every possible consequence or every relevant fact. The procedure does not claim to solve this; it only forces the engineer to consider it and document the risks.

  ### Part 3: Routing Rule for Defects

  When a defect is found during the review, the reviewer must classify it in under two minutes:

  1. **Persistence problem**: The defect is about an unstated direct effect (step 4) or an invalid persistence assumption (step 5). This corresponds to the existing silent-delta (for missing effect) and might also cover stale-world if the persistence assumption fails due to time (but stale-world is more about sensing). However, note:

     - Silent-delta: Originally defined as "the action had an effect nobody wrote down". This is exactly the direct effect missing (step 4) or an indirect effect that we now realize should be direct (step 6). 
     - Ghost-precondition: Missing precondition (step 2 or 3).
     - Stale-world: A fluent that changed but the planner didn't update (step 7).

     But we have a new category: **Indirect consequences** (from step 6) which might not be captured by silent-delta. And the **enabling conditions** (step 3) might be broader than ghost-precondition.

     Therefore, we adjust the bug classes:

     - **Silent-delta**: Restricted to unstated *direct* effects (step 4) and unaccounted *persistence* (step 5). This is the narrow frame issue.
     - **Ghost-precondition**: Unstated preconditions (step 2) or preconditions that are insufficient (step 3).
     - **Stale-world**: Unchecked changes during execution (step 7).
     - **Indirect-effect**: A new class for unanticipated consequences that are not direct effects (from step 6). This is the broader frame issue.

     However, the request says that renaming bug classes is expensive. So we can either:

     Option A: Keep the three classes and reinterpret:
       - Silent-delta: Includes both direct and indirect unstated effects.
       - Ghost-precondition: As is.
       - Stale-world: As is.

     Option B: Add a fourth class.

     Given the cost, we choose Option A. But note that indirect effects are not a persistence issue. We will log any unaccounted indirect effect from step 6 as a silent-delta. This is consistent with the current practice.

     Therefore, the routing rule:

     - If the defect is a missing precondition -> ghost-precondition.
     - If the defect is a missing direct effect or an invalid persistence assumption -> silent-delta.
     - If the defect is a fluent that might change during execution and isn't monitored -> stale-world.
     - If the defect is an unaccounted indirect effect -> silent-delta (as per current practice).

     But note: step 6 also includes indirect effects that might not be effects on fluents in the classical sense (e.g., people moving). We still log as silent-delta.

     So the routing rule:

     - **Silent-delta**: The action had an effect (direct or indirect) that is not captured in the planner's state.
     - **Ghost-precondition**: The action requires a condition that is not checked.
     - **Stale-world**: The planner's state is not updated in time for a critical decision.

     This matches the current taxonomy.

     How to decide in two minutes:

     - Ask: "Is the defect about something that should have been checked before starting (precondition)?" -> ghost-precondition.
     - Else, ask: "Is the defect about the planner having an outdated view of the world during the action?" -> stale-world.
     - Else: It's about an effect (either direct or indirect) that wasn't modeled -> silent-delta.

  ### Part 4: Record Format

  We propose a one-page template:

  **Action Schema / Interpreter Hand-off Review Record**

  - **Review ID:** [Auto-generated]
  - **Date:** [Date of review]
  - **Component under review:** [Name of the schema or interpreter module]
  - **Reviewers:** [Names]
  - **Safety Lead Countersignature:** [Signature and date]

  1. **Primary purpose (Step 1):** [Statement]  
     _Pass/Fail: [ ] Pass [ ] Fail_

  2. **Preconditions (Step 2):**  
     - Listed: [List]  
     - Unstated but required: [List]  
     _Pass/Fail: [ ] Pass [ ] Fail (if fail, log ghost-precondition)_

  3. **Preconditions ensure safety and achievability (Step 3):**  
     [Explanation]  
     _Pass/Fail: [ ] Pass [ ] Fail (if fail, log ghost-precondition)_

  4. **Direct effects (Step 4):**  
     - Listed: [List]  
     - Unstated but direct: [List]  
     _Pass/Fail: [ ] Pass [ ] Fail (if fail, log silent-delta)_

  5. **Persistence assumption (Step 5):**  
     [Confirmation that only listed fluents are changed and others persist]  
     _Pass/Fail: [ ] Pass [ ] Fail (if fail, log silent-delta)_

  6. **Indirect effects (Step 6):**  
     [List of indirect effects and how they are handled]  
     _Pass/Fail: [ ] Pass [ ] Fail (if fail, log silent-delta)  
     If fail, risk assessment: [ ] Accept [ ] Mitigate [ ] Fix before ship  
     Escalated to safety lead? [ ] Yes ([Name]) [ ] No_

  7. **Stale-world risks (Step 7):**  
     [List of critical fluents and update policy]  
     _Pass/Fail: [ ] Pass [ ] Fail (if fail, log stale-world)_

  8. **Error handling (Step 8):**  
     [Description]  
     _Pass/Fail: [ ] Pass [ ] Fail_

  9. (For interpreter) **Mapping from NL to parameters (Step 9):**  
     [Description]  
     _Pass/Fail: [ ] Pass [ ] Fail_

  10. (For interpreter) **Plan validation and feedback (Step 10):**  
      [Description]  
      _Pass/Fail: [ ] Pass [ ] Fail_

  **Overall decision:** [ ] Ship [ ] Do not ship [ ] Ship with conditions  
  **Conditions for ship:** [If any]  
  **Bug classes identified:** [List any bugs found and their classes]  
  **Follow-up actions:** [List]

  **Notes on fields:**
  - Objective fields: Primary purpose (if clearly stated in the schema), listed preconditions and effects, update frequencies (if documented), error handling mechanisms (if implemented). These are facts.
  - Estimates: Update frequency sufficiency (step 7), severity of indirect effects (step 6). These are based on domain knowledge and are estimates.
  - Judgment calls: Step 3 (whether preconditions ensure safety and achievability), step 6 (significance of indirect effects), step 7 (sufficiency of update frequency). These are dressed in procedural clothing because they require expert judgment.

  ### Running the Procedure on Three Cases

  #### Case (a): Open-dock-door schema in a fixed-layout warehouse

  **Review Record:**

  1. **Primary purpose:** To open the dock door so that the robot can pass through.  
     Pass.

  2. **Preconditions:** 
     - The robot is at the dock door.
     - The dock door is closed (sensed every 2 seconds).
     - No unstated preconditions.  
     Pass.

  3. **Preconditions ensure safety and achievability:** 
     - The robot must be at the door to open it, and the door must be closed. This ensures the action is only attempted when it can succeed.  
     Pass.

  4. **Direct effects:** 
     - Dock door state changes from closed to open.  
     Pass.

  5. **Persistence assumption:** 
     - Assumes that only the door state changes; nothing else. Valid because no other fluents are affected.  
     Pass.

  6. **Indirect effects:** 
     - None identified. The door opening might allow other robots to enter, but that is not a direct effect of this action and is handled by the planner's route planning.  
     Pass.

  7. **Stale-world risks:** 
     - The door state is polled every 2 seconds. The action duration is very short (a few seconds). The door state is rechecked at the start of the action. If the door opens or closes during the action, the robot will detect it and abort.  
     Pass.

  8. **Error handling:** 
     - If the door does not open within 5 seconds, the robot will retry or report an error.  
     Pass.

  Overall: Ship.

  #### Case (b): Interpreter handling a request to take a specimen to lab three through an occupied hospital corridor

  This is an interpreter hand-off. We do steps 9 and 10, and also steps 6 and 7 for the overall plan (if the review is for the interpreter, we focus on steps 9 and 10, but we must also consider the actions that will be used). However, the request is about the interpreter, so we focus on steps 9 and 10, but we note that the problem also involves the schemata for moving in a corridor, passing a fire door, etc. We will run steps 9 and 10 and also consider the broader issues.

  **Step 9: Mapping from NL to parameters**
     - The interpreter parses the request and identifies the start (current location), the end (lab three), and the object (specimen). It uses a map to plan a route. The route may pass through a fire door, a lift lobby, and a ward entrance.
     - Failure modes: 
       - Ambiguity in the destination (e.g., multiple labs named "three").
       - The route might be blocked by people or obstacles, but the interpreter does not account for dynamic obstacles in the plan. It relies on the planner to replan if the route is blocked.
       - The presence of the fire door: the interpreter does not know the state of the fire door (which might be closed and block the route). It does not check the state of the fire door at planning time.
     - Safeguards: The planner will validate the plan and recheck the fire door state at execution time. The interpreter does not handle the fire door specially.

     This fails because the interpreter does not account for the possibility that the fire door might be closed and that this would block the route. The planner might not have an action to open the fire door (if that's not allowed) and the interpreter should avoid routes through fire doors if they are typically closed. However, the engineer states that the interpreter does not have access to real-time door states.

     **Failure in step 9**: The mapping does not account for the fire door being closed, which is a known obstacle. The interpreter should either avoid fire doors or have a fallback. No safeguard in the interpreter.

  **Step 10: Plan validation**
     - The planner validates the plan by checking the preconditions of each action at planning time. However, the fire door state is volatile. The planner rechecks at execution time, but if the door is closed and the robot has no action to open it, the plan fails.
     - Feedback: Plan failures are logged and sent to the operator, but the interpreter does not learn from them.

     **Failure in step 10**: The validation at planning time does not account for the volatility of the fire door state. The planner should check the door state at planning time and avoid the route if the door is closed. The feedback loop does not update the interpreter's routing preferences.

  Overall, the interpreter hand-off fails. To pass, the interpreter must either:
     - Avoid routes through fire doors (if they are typically closed or cannot be opened by the robot), or
     - Check the real-time state of the fire door at planning time (if available), or
     - Have the planner include a contingency for the fire door (like waiting for it to open or replanning).

  Additionally, the feedback loop should be improved so that repeated failures on fire doors lead to the interpreter avoiding them.

  **Record:**
     - Step 9: Fail (log as a mapping flaw, which might be considered a ghost-precondition for the overall plan if the route is invalid due to the door being closed, but it's an interpreter issue).
     - Step 10: Fail (log as a validation flaw).

  Do not ship until fixed.

  #### Case (c): Relocate-pallet-to-overflow-bay schema

  This is an action schema.

  1. **Primary purpose:** To move a pallet from its current location to an overflow bay.  
     Pass.

  2. **Preconditions:**
     - The robot is at the current location of the pallet.
     - The overflow bay is empty and available.
     - The pallet is movable.
     - No unstated preconditions.  
     Pass.

  3. **Preconditions ensure safety and achievability:** 
     - They ensure the robot can pick up the pallet and that the target is available.  
     Pass.

  4. **Direct effects:**
     - The pallet is at the overflow bay.
     - The old location is empty.
     - The overflow bay is now occupied.  
     Pass.

  5. **Persistence assumption:** 
     - Only these fluents change.  
     Pass.

  6. **Indirect effects:**
     - The overflow bay is in an escape route. After the move, the escape route might be narrowed below the lawful width.
     - The schema does not account for this. The planner does not model escape route widths.  
     Failure: This is an unaccounted indirect effect (silent-delta). It is critical for safety.

  7. **Stale-world risks:** 
     - The escape route width is not a fluent in the system, so it is not monitored.  
     Not applicable? But the escape route width is not updated because it's not modeled. This is a flaw in the state representation.

     However, step 6 has already failed.

  8. **Error handling:** 
     - If the pallet cannot be moved, the robot reports an error.  
     Pass.

  Overall: The action has a critical silent-delta (the narrowing of the escape route). Do not ship.

  The procedure caught the issue in step 6.

  ### Finally: Limitations

  **What the procedure cannot do:**
     - It cannot guarantee that all relevant facts are identified (the broader frame problem). Step 6 is a best-effort judgment.
     - It cannot replace testing in the real world. Some effects and preconditions will only be discovered in operation.
     - It cannot account for interactions between multiple actions or schemata unless each is reviewed in isolation.

  **Where it will generate false confidence:**
     - If the reviewers are not diligent in step 6 (indirect effects) or step 7 (stale-world), they might miss critical issues. The record will show if these steps were passed without due consideration.

  **Step most likely skipped under schedule pressure:**
     - Step 6 (indirect effects) because it is the most open-ended and requires creative thinking. Step 7 (stale-world) might also be skipped if the reviewer assumes fluents are updated sufficiently.

  **How to make skipping visible:**
     - Require that for step 6, the engineer must list at least one potential indirect effect (even if it's "none") and justify why it is not a problem. In the record, if the justification is absent or perfunctory, it will be visible.
     - Similarly, for step 7, require a list of critical fluents and their update frequencies. If the list is empty, that must be justified.

  We require that the record for step 6 must include a written justification for why each potential indirect effect is not a problem or how it is mitigated. If the step is skipped, the justification will be missing or inadequate.
answer: |-
  ### Review Procedure for Autonomous Mobile Robot Action Schemata and Interpreter Hand-offs

  #### 1. Review Questions (Ordered, with Pass/Fail Criteria)
  **Scope:** For action schemata, run Steps 1–8. For interpreter-to-planner hand-offs, run Steps 9–10. Timebox: 30 minutes per component.  
  **Terminology:** "Fluent" = a state variable (e.g., `door_open`, `corridor_clear`).

  1. **State primary purpose**  
     - *Question:* "What is the action's intended outcome in one sentence? List all fluents it aims to change."  
     - *Sufficient:* Concrete fluents named (e.g., "Set `dock_occupied=true`").  
     - *Failure:* Vague outcomes (e.g., "Charge the robot").  
     - *Termination:* Do-not-ship if failed.  

  2. **List explicit preconditions**  
     - *Question:* "Which fluents are checked *in code* before execution? Which are assumed true but unchecked?"  
     - *Sufficient:* All preconditions visible in schema code listed; unchecked assumptions acknowledged.  
     - *Failure:* Missing checked preconditions or unstated critical assumptions.  
     - *Bug class:* Ghost-precondition if unchecked assumption found.  

  3. **Verify precondition necessity**  
     - *Question:* "For each precondition, why is it essential for safety or success? What fails if it's false?"  
     - *Sufficient:* Rationale per precondition (e.g., "`corridor_clear=true` prevents collisions").  
     - *Failure:* No answer, or precondition lacks justification.  
     - *Hand-off:* Safety lead judges risk if rationale is subjective (e.g., "Human patience thresholds").  

  4. **List direct effects**  
     - *Question:* "Which fluents does the schema *directly* modify? Are any omitted?"  
     - *Sufficient:* All fluents altered in code documented (e.g., "Set `pallet_location=overflow_bay`").  
     - *Failure:* Unstated direct effect discovered.  
     - *Bug class:* Silent-delta if effect missing.  
     - *Termination:* Do-not-ship if failed.  

  5. **Confirm default persistence**  
     - *Question:* "Does the schema assume *only* the fluents in Step 4 change? If yes, justify why no others are affected."  
     - *Sufficient:* Engineer affirms persistence is limited to listed effects; no unstated changes.  
     - *Failure:* Schema implies other fluents change, or engineer cannot justify.  
     - *Bug class:* Silent-delta if unmodelled change detected.  

  6. **Assess indirect consequences**  
     - *Question:* "Could this action alter fluents not listed in Step 4? Consider physical knock-ons, human reactions, or sensor triggers."  
     - *Sufficient:* At least one indirect effect considered (e.g., "Moving a pallet narrows an escape route").  
     - *Failure:* No consideration of indirect effects.  
     - *Hand-off:* Safety lead judges severity if indirect effect is plausible.  

  7. **Check fluent volatility**  
     - *Question:* "Which fluents critical to this action are volatile (e.g., change faster than sensed)? What is the sensing interval?"  
     - *Sufficient:* Volatile fluents named; sensing interval noted (e.g., "`door_state` polled every 2s").  
     - *Failure:* Volatile fluent unmonitored or sensing interval exceeds volatility.  
     - *Bug class:* Stale-world.  

  8. **Review error recovery**  
     - *Question:* "If the action fails, how is the planner notified? What timeout applies?"  
     - *Sufficient:* Clear error codes/timeouts defined (e.g., "Timeout: 300s; alert to planner").  
     - *Failure:* No error handling or ambiguous recovery.  

  9. **Interpreter: Map NL to plan**  
     - *Question:* "How does the interpreter convert ‘natural language instruction → action parameters’? What ambiguities exist?"  
     - *Sufficient:* Mapping logic described; edge cases acknowledged (e.g., "‘Lab three’ mapped to waypoint L3").  
     - *Failure:* No method to handle ambiguous terms (e.g., "through occupied corridor").  

  10. **Interpreter: Validate plan feasibility**  
      - *Question:* "What checks ensure the planner can execute the interpreted plan in the *current* world state?"  
      - *Sufficient:* Planner re-validates preconditions at runtime.  
      - *Failure:* No runtime validation.  

  ---

  #### 2. Distinguishing Frame Problem Boundaries
  - **Narrow problem (default persistence):** Addressed in **Step 5**. Engineering solution: Schemata must only state *changed* fluents; persistence of others is automatic. Procedure enforces this discipline.  
  - **Wider problem (relevance of facts):** Addressed in **Step 6**. No checklist can exhaust indirect consequences; relies on engineer judgment.  
  - **Marketing guard:** Step 5 explicitly avoids claiming to solve Step 6.  

  *Question alignment:*  
  - Steps 4–5 → Narrow persistence.  
  - Step 6 → Wider relevance.  
  - Steps 2–3,7 → Neither (preconditions/volatility).  

  ---

  #### 3. Defect Routing Rule (≤2-Minute Classification)  
  **Decision tree:**  
  1. **Persistence issue?**  
     - If the defect involves unmodelled *direct* effects or invalid persistence assumptions → **Silent-delta** (e.g., Step 5 failure).  
  2. **Indirect consequence?**  
     - If the defect involves unanticipated knock-on effects (e.g., human behaviour) → **New class: Indirect-delta** (requires logging change).  
  3. **Enabling condition?**  
     - If the defect involves missing/incomplete preconditions → **Ghost-precondition**.  

  **Assessment of your bug classes:**  
  - Your taxonomy **lacks a slot for indirect consequences**. Silent-delta currently conflates direct/indirect effects.  
  - **Recommendation:** Replace `silent-delta` with two classes:  
    - **Direct-delta:** Unstated *direct* effects (Step 4/5).  
    - **Indirect-delta:** Unanticipated knock-ons (Step 6).  
  - **Cost mitigation:** Roll out as:  
    - `silent-delta (direct)`  
    - `silent-delta (indirect)`  
    - Minimal renaming; engineers add sub-labels in logs.  

  ---

  #### 4. One-Page Record Format  
  **Fields:**  
  - **Objective:** Date, Component, Reviewer, Steps 1/4/7/8/9/10 (fact-based).  
  - **Estimates:** Step 7 (sensing sufficiency), Step 6 (likelihood of indirect effect).  
  - **Judgment calls:** Steps 3/5/6 (rationales are opinions).  

  | **Field**               | **Content**                                                                 | **Type**        |  
  |-------------------------|-----------------------------------------------------------------------------|-----------------|  
  | **Review ID**           | Auto-generated                                                              | Objective       |  
  | **Date/Component**      | E.g., "2023-10-02 / open_door_schema"                                       | Objective       |  
  | **Primary purpose**     | Outcome statement (Step 1)                                                  | Objective       |  
  | **Preconditions**       | Listed + unchecked (Step 2)                                                 | Objective       |  
  | **Precond. rationale**  | Justification per precondition (Step 3)                                     | Judgment        |  
  | **Direct effects**      | Fluents modified (Step 4)                                                   | Objective       |  
  | **Persistence confirm** | "Only listed fluents change" (Step 5)                                       | Judgment        |  
  | **Indirect effects**    | Potential knock-ons; risk assessment (Step 6)                               | Judgment/Estimate|  
  | **Volatile fluents**    | Named + sensing interval (Step 7)                                           | Objective/Estimate|  
  | **Error handling**      | Timeout/recovery (Step 8)                                                   | Objective       |  
  | **NL mapping logic**    | Description (Step 9)                                                        | Objective       |  
  | **Runtime validation**  | E.g., "Planner rechecks preconditions" (Step 10)                            | Objective       |  
  | **Defects found**       | E.g., "Silent-delta (indirect): Escape route narrowed"                      | Objective       |  
  | **Decision**            | [ ] Ship [ ] Do-not-ship [ ] Ship with conditions                           | Judgment        |  
  | **Safety lead sign-off**| Signature + date                                                            | Objective       |  

  ---

  ### Procedure Run on Cases  
  #### Case (a): Open-dock-door schema (Warehouse)  
  **Record:**  
  - **Step 1:** "Set `dock_door_open=true`" → Pass.  
  - **Step 2:** Preconditions: `robot_at_dock=true`, `door_closed=true` (polled every 2s) → Pass.  
  - **Step 3:** Rationale: "Prevents opening if robot absent/door open" → Pass.  
  - **Step 4:** Effects: `dock_door_open=true` → Pass.  
  - **Step 5:** "Assumes no other fluents change" → Pass.  
  - **Step 6:** "No indirect effects; door state isolated" → Pass.  
  - **Step 7:** Volatile fluents: `door_closed` (sensed every 2s; sufficient) → Pass.  
  - **Step 8:** Timeout: 10s; error: "Door_stuck_alert" → Pass.  
  - **Defects:** None.  
  - **Decision:** Ship.  

  #### Case (b): Interpreter (Hospital corridor request)  
  **Record:**  
  - **Step 9:** "Maps ‘Lab three’ to waypoint L3; ‘occupied corridor’ not parameterised" → Fail.  
  - **Step 10:** "Planner uses static map; no runtime check for human congestion" → Fail.  
  - **Step 6 (Indirect):** "Robot movement alters pedestrian flow; unmodelled" → Indirect-delta.  
  - **Defects:**  
    - Ghost-precondition (Step 9): No check for crowd density.  
    - Indirect-delta (Step 6): Human behaviour change.  
  - **To pass:** Interpreter must add crowd density thresholds; planner must include dynamic replanning.  
  - **Decision:** Do-not-ship. Demo requires crowd-modelling in planner.  

  #### Case (c): Relocate-pallet schema (Overflow bay)  
  **Record:**  
  - **Step 1:** "Set `pallet_location=overflow_bay`" → Pass.  
  - **Step 4:** Effects: `pallet_location`, `bay_occupied` updated → Pass.  
  - **Step 5:** "Assumes only pallet/bay fluents change" → Pass.  
  - **Step 6:** "Indirect effect: Escape route width < lawful minimum" → Fail.  
  - **Defects:** Silent-delta (indirect) – unmodelled legal/safety consequence.  
  - **Decision:** Do-not-ship. Schema must include escape-route-width fluent.  
  - **Outcome:** Procedure caught the issue (Step 6).  

  ---

  ### Limitations and Risks  
  1. **Cannot do:**  
     - Solve the wider frame problem (Step 6 relies on human foresight).  
     - Guarantee completeness for volatile fluents (Step 7 is estimate-based).  
     - Replace real-world testing.  
  2. **False confidence:**  
     - Step 5 (persistence) may imply all direct effects are captured, but new fluents added later may invalidate this.  
     - Step 6 (indirect) may be under-scrutinised if reviewers lack domain expertise.  
  3. **Step most skipped:** Step 6 (indirect consequences). Under schedule pressure, engineers skip brainstorming knock-on effects.  
  4. **Make skipping visible:** Require in the record:  
     - **Step 6 field:** Must state: "No indirect effects considered" if left blank.  
     - **Safety lead sign-off:** Mandatory if Step 6 is marked "Pass" without rationale.
