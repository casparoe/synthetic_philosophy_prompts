  The user wants help anticipating objections during Q&A. They need:
  - 8-10 realistic objections this specific audience would raise
  - Each objection phrased in the questioner's likely vocabulary
  - For each: what to concede, a 2-minute reply, and where the reply is weakest
  - Identification of global objections that could destroy the entire thesis
  - Advice on which objections to preempt versus let emerge
