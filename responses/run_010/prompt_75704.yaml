  First, I need to recall the socialist calculation debate. Mises argued that without market prices, especially for capital goods, economic calculation is impossible. Lange responded with a trial-and-error model where a central board adjusts prices based on shortages and surpluses. Hayek countered that the knowledge problem isn't computational but about dispersed, tacit knowledge that markets handle through price signals. The user's examples include modern attempts using sensors and neural nets, which assume data availability but don't address how tacit knowledge is captured.

  The user identifies a pattern: an objection about missing information is met with a procedure that presupposes that information. The examples are:
  1. Lange's model requires observing shortages/gluts, which Mises argued is impossible without markets.
  2. Modern computational approaches assume data exists, ignoring Hayek's point about tacit knowledge.
  3. Externality solutions assume regulators can estimate marginal damage, which is the crux.

  The user has ruled out several concepts:
  - Begging the question: The procedure doesn't seem circular to its proponents; it appears constructive.
  - Ceteris paribus/Idealization: Not ignoring variables but assuming the disputed input.
  - Nirvana fallacy: Comparing real institutions to ideal ones isn't the issue here.

  Now, I need to brainstorm related concepts. In philosophy of science, there's "explanatory gap" where a mechanism assumes what it explains. In mechanism design, the "common prior assumption" or "incentive compatibility" might relate, but here it's about information availability. In philosophy of mind, "homunculus fallacy" involves positing a mini-agent with the same capacity, which is similar—assuming an inner entity that already has the knowledge.

  Other terms:
  - "Black-boxing": Hiding the mechanism, but here the input is specified, not hidden.
  - "Input assumption problem": Not standard.
  - "Procedural presupposition": Describes assuming the input in a step-by-step solution.

  The homunculus fallacy is a close parallel. In cognitive science, explaining vision by positing an inner viewer just moves the problem. Similarly, Lange's trial-and-error assumes the central board can observe shortages, which is the contested ability.

  Also, in mechanism design, assuming truthful reporting or common knowledge without justification fits. Hayek's critique is about the impossibility of aggregating dispersed knowledge, which these models presuppose.

  After comparing, the homunculus fallacy seems the best fit because it directly addresses assuming a pre-existing capacity within the system. The key features are:
  - The procedure operationalizes the capacity without explaining its origin.
  - It appears constructive but actually presupposes the solution.
  - The move isn't always fallacious if the capacity is uncontested, but here it's the core dispute.

  The term "Procedural Homunculus" could be coined, combining the fallacy with the step-by-step nature. Defining it as embedding the contested capacity as an input in a procedural solution without accounting for its origin.

  Boundaries:
  - Inside: Assuming a regulator can estimate marginal damage in externality solutions.
  - Outside: Stipulating information availability for argument's sake, then showing another flaw. The difference is whether the assumption is discharged or does the heavy lifting.

  Hayek and Mises didn't name it but described it. Mises' "imputation problem" and Hayek's "knowledge problem" highlight the issue but aren't the fallacy itself.

  So, the user needs a precise term. "Homunculus fallacy" is established in philosophy of mind and applies here. Coining "Procedural Homunculus Fallacy" emphasizes the structured solution aspect. The answer should clarify the parallels and why other terms don't fit, especially the distinction from legitimate stipulation.
answer: |-
  You've pinpointed a profound and recurrent dialectical pattern that cuts across economic methodology, mechanism design, and philosophy of science. It's not merely circularity or idealization—it's a specific form of **operational sleight-of-hand** that smuggles in contested premises under the guise of constructive demonstration. After methodically brainstorming and carving the conceptual space, here's my analysis:

  ### Brainstorming Candidate Concepts
  I'll map the terrain before landing on the best fit. Your described move involves:
  - **A contested incapacity claim:** System S lacks access to information I, making task T impossible.
  - **A procedural refutation:** A step-by-step mechanism M is proposed, showing how S *could* perform T if given I as input.
  - **The sleight:** I is treated as an available input to M, with no account of how S acquires I. The demonstration *presupposes* the very thing S was argued to lack.

  Candidates from relevant fields:
  1. **Methodology of Economics:** 
     - *Hayek's Knowledge Problem* (describes the issue but isn't the fallacy itself).  
     - *Nirvana Fallacy* (Demsetz: criticizing real-world institutions by comparing them to unrealistic ideals).  
     - *Black-Boxing* (treating a complex process as a simple input-output module).  
  2. **Mechanism Design:**  
     - *Common Prior Assumption* (assuming agents share baseline knowledge).  
     - *Incentive Compatibility Requirement* (assuming truthful revelation without cost).  
     - *Oracle Problems* (assuming a "black box" can compute any function).  
  3. **Philosophy of Science:**  
     - *Petitio Principii* (begging the question—but often explicit, not procedural).  
     - *Idealization/Ceteris Paribus Clauses* (simplifying models by holding variables fixed).  
     - *Explanatory Gap* (failing to reduce higher-level phenomena to underlying mechanisms).  
  4. **Philosophy of Mind/Cognitive Science:**  
     - **Homunculus Fallacy** (explaining a cognitive capacity by positing a "little agent" inside the mind that already has that capacity).  
     - *Regress Problems* (infinite deferral of explanation).  
     - *Tacit Knowledge Issues* (Polanyi: knowledge that can't be fully formalized).  

  ### Narrowing Down: Why Other Concepts Are Near-Misses
  - **Petitio Principii (Begging the Question)**:  
    *Why it misses*: Traditional petitio is *logically circular* (e.g., "Markets work because prices reflect value"). Your cases are *procedurally evasive*: they embed the assumption in a dynamic mechanism (e.g., Lange's price board), making it look like a constructive solution rather than a premise. The refutation *feels* substantive.  
  - **Idealization/Ceteris Paribus**:  
    *Why it misses*: Idealizations suspend *uncontested* variables for clarity (e.g., "assume frictionless planes"). Here, the input I is the *contested core* of the debate. Using I isn't bracketing a nuisance—it's assuming away the dispute.  
  - **Nirvana Fallacy (Demsetz)**:  
    *Why it misses*: Nirvana compares flawed real systems to perfect hypotheticals (e.g., "markets are inefficient compared to a planner with perfect data"). Your cases involve *internal inconsistency*: the hypothetical system (e.g., Lange's iterative planning) *requires* I to function, but I's availability is precisely what the original objection denies.  
  - **Black-Boxing**:  
    *Why it misses*: Black-boxing hides *how* a process works (e.g., treating a firm as a profit function). Here, the procedure *explicitly names* I as input but ignores its origin. The box is transparent but empty.  
  - **Incentive Compatibility (Mechanism Design)**:  
    *Why it misses*: Assuming truthful reporting *is* a cousin (e.g., "if agents reveal preferences honestly, we can optimize"). But your cases are broader: even with truthful agents, I might be *tacit* (Hayek) or *emergent* (market prices), not pre-existing "data."  

  ### The Best Fit: **Homunculus Fallacy** (with a Twist)
  **Verdict**: The closest established concept is the **Homunculus Fallacy** from philosophy of mind, extended to institutional/mechanistic contexts.  

  #### Why it Fits Perfectly:
  - **Definition**: Explaining a system's capacity by positing an internal agent (a "homunculus") that already possesses that capacity, creating a regress.  
  - **Your Cases as Institutional Homunculi**:  
    - Lange's price board is a "planning homunculus": it "sees" shortages/gluts and "adjusts" prices—*exactly the capacity Mises claimed was impossible without markets*.  
    - The networked "sensor" economy is a "data homunculus": it magically ingests tacit knowledge (machine quirks, real trade-offs) as "data," ignoring Hayek's point that markets *generate* this knowledge through exchange.  
    - The regulator estimating marginal damage is a "valuation homunculus": it assumes the capacity to measure social cost that Pigouvian taxes were meant to *discover*.  
  - **Key Parallel**: Like a homunculus in vision theory (e.g., "we see because a little man in the brain watches the images"), these mechanisms embed a miniature version of the contested capacity *inside the procedure*. The "steps" (nudging prices, ingesting data) are theatrical—the real work is done by the homunculus.  

  #### Why No Existing Economic Term Suffices:
  While Hayek (*"The Use of Knowledge in Society"*) demolishes this move, he never named the fallacy. Mises called it the "imputation problem" (how to attribute value to inputs sans markets), but that's too narrow. Modern mechanism design acknowledges "informational requirements" but lacks a sharp label for *proceduralized question-begging*.  

  ### Coining a Term (If Insisting on Novelty): **Procedural Homunculus Fallacy**
  **Definition**:  
  > *The error of "refuting" a claim that system S cannot perform task T (due to lacking information I or capacity C) by describing a procedure M that performs T, where M treats I or C as an unexplained input or sub-capacity—thereby embedding the contested element within the solution.*  

  **Boundary Cases**:  
  | **Inside the Concept**                          | **Outside the Concept**                          |  
  |-------------------------------------------------|--------------------------------------------------|  
  | Lange's trial-and-error planning (requires seeing shortages to adjust prices). | Stipulating "assume we know demand curves" to show *other* flaws in planning. |  
  | "Neural nets ingest data" rebuttals to Hayek (presume tacit knowledge is pre-recorded). | Arrow-Debreu general equilibrium (proves existence *given* preferences/technology, no claim about sourcing them). |  
  | Regulator "solving" externalities by assuming marginal damage is measurable. | Coase theorem (shows bargaining *can* resolve externalities *if* property rights exist—but doesn't assume rights emerge magically). |  

  #### Legitimate vs. Illegitimate Stipulation: The Carving
  The difference hinges on **whether the stipulation does argumentative work**:  
  - **Legitimate**: Stipulating I is available *to isolate a secondary problem*.  
    - *Example*: "Even if planners *had* all data, computing equilibria is NP-hard." Here, I's availability is a *provisional concession*; the conclusion doesn't "refute" the knowledge problem.  
  - **Illegitimate (Procedural Homunculus)**: Stipulating I as input *constitutes the refutation* itself.  
    - *Example*: "Planners *can* compute allocations if they use real-time data from sensors." This "solves" the knowledge problem by assuming I (sensor data capturing tacit knowledge) is available—the very point in dispute.  
  **Key Markers**:  
  1. The procedure is presented as *self-contained*, masking I's contested origins.  
  2. The conclusion is *categorical* ("S can do T!"), not conditional ("*If* I exists, S can do T").  
  3. The homunculus (e.g., the price board "seeing" gluts) is never "discharged"—its capacity remains unexamined.  

  ### Did the Critics Name It?
  Mises and Hayek described it vividly but never coined a term. Hayek came closest in *"The Counter-Revolution of Science"*:  
  > *"[The planner] must possess the same knowledge *which we postulate* to be at the disposal of society as a whole... This is merely *another way* of saying that he must be omniscient."*  
  He identifies the move—equating "postulated" knowledge with a real capacity—but labels it "scientism," which is too broad. Later critics (Lavoie, Kirzner) call it "ignoring the knowledge problem," but again, no precise fallacy name.  

  ### Final Thought
  This fallacy persists because *procedures feel like solutions*: steps, iteration, and convergence stories create an illusion of operational content. Philosophers of science (e.g., Cartwright) would call this "nomological machine" thinking—constructing a mechanism that *runs* on the magic it purports to explain. The homunculus label fits best because it highlights the *regressive structure*: the "solution" is a costume worn by the problem. When you see a mechanism treating contested knowledge as a free input, you've found your homunculus.
