prompt: |-
  I'm drafting a chapter for an edited collection on cross-border reproductive markets, and I've run into a piece of rhetoric that my co-author and I keep tripping over. She defends the American model — compensated gestational arrangements brokered by agencies in the states that will issue a pre-birth parentage order — against the continental European position, where such agreements are treated as void because the human body is held not to be at a person's disposal to alienate, and where at least one country has recently made it an offence for its own citizens to commission a surrogacy in a jurisdiction where the practice is entirely legal. Her argument runs through a picture both sides use: the carrier rents out her womb. Pressed, she cashes it out as a lease. The carrier is lessor; the intended parents are lessees; the demised premises are the uterus for a fixed term of roughly nine months; the compensation is rent; the behavioural covenants in a standard agency contract — no alcohol, travel restrictions, agreement to terminate on medical advice — are covenants as to use; the handover of the child is surrender of possession in the agreed condition; and independent legal advice, disclosure of medical history, and psychological screening are the ordinary due diligence one expects before granting a term. Her conclusion is that nothing in this structure is distinctive, since we permit leases of bodily labour and of body-adjacent capacities all the time, from employment contracts to compensated plasma donation to the wet-nursing that European families bought openly for two centuries; so if the arrangement is a lease, the European objection is squeamishness about the price rather than about the structure, and the right response is lease-style regulation — standard-form terms, cooling-off periods, caps on liquidated damages, mandatory separate counsel — rather than prohibition. I find this persuasive and unpersuasive at the same time and cannot yet say which.

  Could you audit the analogy for me? First, set out the correspondence table properly: what in a compensated gestational arrangement actually occupies each of those roles, and which roles have no occupant at all. I especially want to know where the child sits in the mapping, since a lease appears to have no slot for a third person produced during the term — and if the child is the product of the lease, then the picture has quietly turned from a conveyance of use into a contract for the manufacture and delivery of goods, which is precisely the charge the analogy was meant to rebut. Then separate the disanalogies that matter for her intended use from those that are merely picturesque. Three candidates I'd like pressure-tested: that a lease transfers possession and control of the premises to the lessee, whereas the carrier never loses possession or control of her own body, so the so-called covenants as to use are not restrictions on the use of a thing but directives about another person's conduct; that, as far as I understand the American cases, no court has actually ordered a carrier to comply with those covenants, the remedy being damages at most, which makes it unclear what legal work the lease vocabulary is doing; and that a lease presupposes an inert, fungible subject matter whose condition can be assessed at surrender, whereas the relevant subject matter here is a person whose interests do not end with the term. I'd also like you to say what the framing imports that nobody has argued for — that the lessor's stake is purely economic, that the term ends cleanly with no residual obligations, that third parties are strangers to the instrument rather than beneficiaries of it.

  Finally, does her conclusion survive the disanalogies, or was it carried by the analogy all along? Please take seriously the opposing reading that a colleague of mine pressed, namely that the analogy does not answer the commodification objection but simply states it: describing a pregnancy as the grant of a term of years already concedes that the body is alienable property, which is exactly what the European position denies, so the two sides are not disagreeing about the facts but about whether that concession has been made. Is that reading right, or is it a rhetorical slide of its own? And if the lease is the wrong source domain, which alternative would do better and what would each license — a personal services contract with the familiar limits on enforcing one, a bailment, an agency relationship in which the carrier acts for the intended parents, a joint venture, or a contract for work and materials? Be concrete about what each choice would imply for the live regulatory questions: enforceability of the handover, the status of the behavioural terms, and who may withdraw and when. One constraint: no bibliography and no survey of who has said what, since I'll add my own references, and I'm not interested in the empirical facts of the two markets either. What I need is the structure of the comparison.
reasoning: |-
  Okay, the user is working on a chapter about cross-border reproductive markets, specifically grappling with a co-author's defense of the American surrogacy model using a "womb lease" analogy. They need help auditing this analogy structurally. 

  First, I need to fully unpack the lease mapping as presented. The co-author equates: carrier→lessor, intended parents→lessees, uterus→demised premises, compensation→rent, behavioral restrictions→covenants, child handover→surrender of possession. The user's core unease seems to center on where the child fits - if the child is the "product," the analogy accidentally concedes the commodification objection it meant to counter.

  Three major disanalogies stand out: 
  1) In a real lease, possession transfers to the tenant, but the carrier always retains bodily autonomy. Those "covenants" are actually directives about a person's behavior, not property use rules. 
  2) Courts don't enforce surrogacy behavioral terms like property covenants - breach only leads to damages, not specific performance. 
  3) The "premises" (uterus/body) aren't inert; they're part of a person with ongoing interests beyond the "term."

  The user also flags unspoken implications: framing the carrier's interest as purely economic, assuming clean termination, and treating the child as an object rather than a rights-holder. 

  That last point about the child is crucial. In property law, surrender involves returning the leased item, but here the "item" is a human being. The co-author's structure implicitly treats the child as the recovered property, which is legally and ethically problematic. 

  The colleague's counter-reading hits hard: the lease analogy doesn't rebut commodification, it presupposes it. By framing the arrangement as a property transfer, it already accepts bodily alienation - the very premise Europe rejects. This isn't a factual disagreement but a conceptual divide.

  Alternative framings each have different regulatory consequences:
  - **Personal service contract**: Explains unenforceability of behavioral terms (courts won't compel personal conduct) but makes child handover obligations shaky
  - **Bailment**: Carrier as bailee of genetic material? But pregnancy isn't passive holding, and child isn't bailed property
  - **Agency**: Carrier as IPs' agent? Conflicts with carrier's independent legal status
  - **Joint venture**: Shared project? Fails to address power imbalance
  - **Work & materials contract**: Explicitly makes child the "product" - worst option for commodification concerns

  The lease analogy's regulatory conclusions only hold if we accept its premise. Once we notice the child has no place in the schema, or that behavioral terms aren't enshrined like property covenants, the "lease-style regulation" solution collapses. What remains useful is the co-author's core insight about regulating existing practices rather than prohibiting them - but that doesn't require the lease frame.

  The path forward might be to acknowledge that all analogies fail at some point, and focus instead on the policy question: given that these arrangements exist, which regulatory approach best protects all parties? The lease structure distracts from that by forcing a property framework onto relational realities.
answer: |-
  Here’s a structural audit of the "womb lease" analogy, mapping its correspondences, disanalogies, implications, and alternatives, as requested:

  ### I. Correspondence Table
  | **Lease Element**          | **Claimed Surrogacy Equivalent**                  | **Actual Fit**                                                                 | **Vacant Roles**                     |
  |----------------------------|--------------------------------------------------|--------------------------------------------------------------------------------|--------------------------------------|
  | **Lessor**                 | Gestational carrier                              | Matches: Carrier agrees to provide use.                                        | —                                    |
  | **Lessee**                 | Intended parents (IPs)                           | Matches: IPs pay for temporary use.                                            | —                                    |
  | **Demised Premises**       | Uterus                                           | Partial: Uterus is the "site," but not inert or separable from personhood.     | —                                    |
  | **Term**                   | ~9 months of pregnancy                           | Matches: Fixed duration.                                                       | —                                    |
  | **Rent**                   | Carrier compensation                             | Matches: Payment for use.                                                      | —                                    |
  | **Covenants as to Use**    | Behavioral restrictions (no alcohol, etc.)       | **Mismatch**: Restrictions govern *personal conduct*, not passive property.    | —                                    |
  | **Surrender of Possession**| Handover of child                                | **Critical flaw**: Child ≠ "premises." No lease role for a new legal person.   | Role for produced third party (child) |
  | **Due Diligence**          | Medical/legal screenings                         | Matches: Pre-contract assessments.                                             | —                                    |

  **Child's Position**: The child has no role in lease structure. If analogized to "product," the frame shifts from *conveyance of use* to *production of goods*—undermining the rebuttal of commodification objections.

  ---

  ### II. Material Disanalogies
  1. **Possession & Control**:  
     - **Lease**: Lessee gains exclusive possession/control of premises.  
     - **Surrogacy**: Carrier retains bodily autonomy; "covenants" are unenforceable directives (e.g., no U.S. court orders specific performance of no-alcohol clauses). Remedies are post-breach damages, not control.  
     - **Why it matters**: The analogy overstates IPs' legal authority, masking that restrictions are behavioral, not proprietary.

  2. **Subject Matter**:  
     - **Lease**: Premises are inert/fungible (e.g., any apartment in a complex).  
     - **Surrogacy**: Uterus is non-fungible, embodied, and alters through pregnancy (e.g., health risks, emotional bonds). Carrier’s interests extend beyond the "term."  
     - **Why it matters**: Treating the body as static property ignores ongoing personhood.

  3. **Third-Party Interests**:  
     - **Lease**: No third-party beneficiaries created by the lease.  
     - **Surrogacy**: Child is a rights-bearing entity whose welfare supersedes the contract (e.g., custody disputes void harmful terms).  
     - **Why it matters**: The child’s legal status disrupts the "surrender" as a clean termination.

  ---

  ### III. Implicit Framing
  The lease analogy smuggles in unargued premises:  
  - **Carrier's stake as purely economic**: Erases emotional/physical stakes of pregnancy.  
  - **No residual obligations**: Ignores post-birth complexities (e.g., carrier health issues, child’s medical needs traceable to pregnancy).  
  - **Child as contractual output**: Positions child as "condition of surrendered premises," tacitly endorsing commodification.  
  - **Third parties as strangers**: Treats the child’s interests as external to the contract.

  ---

  ### IV. Analogy’s Vulnerability
  **Your colleague’s critique holds**: The lease frame *presupposes alienability* of the body as property. Europe rejects this premise at the outset. The analogy doesn’t engage the core disagreement—it assumes a property framework Europe deems inapplicable to human bodies. **Conclusion**: The co-author’s regulatory solution ("lease-style rules") only follows *if* the property concession is accepted. The analogy doesn’t defend that concession; it relies on it.  

  ---

  ### V. Alternative Framings & Regulatory Implications
  | **Framework**             | **Enforceability of Handover** | **Behavioral Terms**                          | **Withdrawal Rights**               | **Best For**                                         |
  |---------------------------|--------------------------------|-----------------------------------------------|-------------------------------------|------------------------------------------------------|
  | **Personal Service Contract** | Enforceable (child transfer)   | **Unenforceable**: Courts won’t compel personal conduct (e.g., no travel). | Carrier can withdraw pre-implantation; IPs may sue for damages later. | Acknowledges bodily autonomy while securing post-birth parentage. |
  | **Bailment**              | Weak (bailment ends with goods' return) | N/A: Bailee (carrier) has duty of care but no behavioral control. | Either party may terminate; carrier owes duty of care to genetic material. | Avoiding commodification of child (if genetic material = bailed "goods"). |
  | **Agency**                | Enforceable (agent delivers "product") | **Enforceable**: Agent (carrier) acts under IPs’ lawful instructions. | Revocable by IPs; carrier may have limited exit rights. | Maximizing IP control, but risks undermining carrier’s personhood. |
  | **Joint Venture**         | Ambiguous (shared "venture" output) | **Negotiated**: Mutual duties, but no unilateral control. | Mutual consent or court intervention if dispute. | Equalizing parties’ status (but may not reflect power imbalances). |
  | **Work & Materials**      | Enforceable (delivery of "product") | **Enforceable**: Specifications bind worker (carrier). | Carrier liable for defects; IPs can reject non-conforming "goods." | **Worst fit**: Explicitly commodifies child and body. |

  ---

  ### Structural Recommendation
  The lease analogy’s regulatory conclusions (standard terms, caps on damages) **do not survive** the disanalogies because:  
  1. Core elements (child’s personhood, non-enforceability of conduct) are unaddressed;  
  2. It conflates *regulatory goals* (fairness) with *conceptual accuracy*.  

  **Stronger path**: Treat surrogacy as a **sui generis relational contract** with:  
  - **Enforceable core**: Post-birth parentage orders (like the U.S. model).  
  - **Unenforceable periphery**: Behavioral directives (backed only by damages, not compulsion).  
  - **Irreducible rights**: Carrier’s bodily autonomy + child’s independent legal status.  

  This retains the co-author’s pragmatic case for regulation while jettisoning the philosophically loaded lease frame. The European objection isn’t "squeamishness about price," but a refusal to analogize bodily integrity to property—an analogy the U.S. system functionally relies upon.
