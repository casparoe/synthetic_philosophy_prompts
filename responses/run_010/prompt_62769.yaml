  First, I need to recall existing concepts. The user mentioned changing the subject, unit of analysis issues, and contrast classes in why-questions. None fit perfectly because the substitution here is methodological and often justified. For example, comparing England to the Yangzi Delta instead of Britain to China makes sense due to scale, but it's still a shift. 

  The key point is the tension between empirical tractability and conceptual fidelity. Legitimacy hinges on whether the substitution preserves the original contrast's essence. If Yangzi Delta represents China's economic core, it's valid. But swapping Britain for Europe might introduce new variables, making it illegitimate. 

  I should consider boundary cases. Trivial narrowing, like focusing on a specific factory, loses the broader context. Swapping A vs. B for A vs. A-minus-one-cause might oversimplify multicausal events. Explicit acknowledgment helps but doesn't eliminate the issue. 

  The user cares more about the nuances than the label. They need a framework to evaluate such swaps. Terms like "methodological unit substitution" or "contrast class refinement" come to mind, but they must capture both the necessity and potential pitfalls. 

  Confidence-wise, I'm fairly sure there's no established term. The closest is "contrast class" issues, but the substitution aspect is unique. The claim I'd bet least on is whether explicit acknowledgment changes the phenomenon's nature—it might just make it more transparent rather than altering it. 

  In conclusion, the answer should define the move, provide legitimacy criteria, boundary cases, and coin a term if necessary. Highlighting the trade-off between precision and relevance is crucial for the user's understanding.
answer: |-
  This is a sharp observation about a pervasive and under-acknowledged methodological sleight-of-hand – **especially** prevalent in comparative historical analysis like the Great Divergence debate. You've perfectly diagnosed the tension: the substitution often *is* methodologically necessary for tractability, yet inherently risks answering a subtly different (and often easier) question than the one originally posed.

  **There isn't a single, universally established term for *exactly* this move.** Your candidates touch on aspects but miss the core tension you identify:

  1.  **"Changing the subject / Arguing beside the point":** Too broad and pejorative. It implies irrelevance or bad faith, but your examples show the substitution is often *necessary* and *improves* empirical rigor.
  2.  **"Unit of analysis problem":** This *is* central, but it's descriptive, not procedural. It identifies the mismatch (nation vs. region vs. civilization) but doesn't capture the *act* of substituting the unit *during the argument* and presenting the answer to the *substituted* question as the answer to the *original* question. It also doesn't cover temporal shifts (1800 vs 1500).
  3.  **"Contrast class in why-questions":** This gets closest to the *structure* ("why A rather than B?"). The problem is the *unacknowledged redefinition of the contrast class (B)* during the argument. But the existing concept focuses on the *need* for a contrast class, not the *methodological substitution* of one class for another within an explanation.

  **Coining the Concept: Methodological Contrast Substitution (MCS)**

  *   **Definition:** The argumentative move where an intractable original contrast ("Why A rather than B?") is replaced by a more empirically tractable or conceptually clearer substitute contrast ("Why A' rather than B'?") without sufficiently demonstrating that the answer to the substitute question adequately answers the original question. The substitution leverages methodological necessity but risks obscuring a loss of fidelity to the original inquiry's scope and intent.
  *   **Core Tension:** The trade-off between **Empirical Tractability** (A'/B' are measurable, comparable, data exists) and **Conceptual Fidelity** (Does A' faithfully represent A? Does B' faithfully represent B? Does the answer to A'/B' explain the difference between A and B?).

  **Legitimacy Criteria (The Carving):**

  A substitution is likely legitimate if:
  1.  **Representativeness:** A' is demonstrably the core, driving, or most relevant subcomponent of A relevant to the phenomenon, and B' is demonstrably the core, driving, or most relevant subcomponent of B. (e.g., Yangzi Delta *is* widely accepted as the economic core region of late Imperial China).
  2.  **Preserved Contrast:** The key difference hypothesized to explain the original A/B divergence is still meaningfully captured and testable in the A'/B' comparison. The substitution doesn't remove the crucial variable or introduce dominant new confounding differences *between A' and B'* that weren't central to A vs. B.
  3.  **Scale/Category Consistency:** The substitution corrects a genuine category error or scale mismatch in the original question (e.g., nation vs. civilization) by moving *both* sides to a comparable level (e.g., core regions).
  4.  **Causal Pathway:** The explanation derived from A'/B' plausibly scales up or translates to explain the A/B divergence. There's no major factor *unique* to A (vs. B) or B (vs. A) that is excluded from A' or B' but crucial to the overall outcome.

  A substitution is likely illegitimate if:
  1.  **Loss of Essence:** A' or B' is peripheral or unrepresentative of the key characteristics of A or B relevant to the divergence. (e.g., Explaining British industrialization by comparing *only* Manchester to a random Chinese village).
  2.  **Introduced Confound:** The substitution introduces a major new difference that overshadows the original contrast. (e.g., Substituting "Europe vs. China" for "Britain vs. China" introduces vast intra-European heterogeneity and factors like the Thirty Years' War or French Revolution that weren't part of the initial Britain-China dynamic).
  3.  **Temporal Mismatch:** The temporal shift (e.g., focusing on 1500 for a divergence manifesting in 1800) isn't convincingly linked by a demonstrable causal chain where the earlier events *uniquely and necessarily* set the later divergence in motion, *especially* if the regions were demonstrably similar closer to the divergence point. (Your "overseas expansion from 1500" example fits here).
  4.  **Trivialization:** The substitution narrows the question to a point where the answer becomes trivial or irrelevant to the original broad historical puzzle. (e.g., "Why did Watt's steam engine succeed in Britain rather than China?" answered by comparing Watt's specific patent environment to that of a single Chinese inventor in a different field).

  **Boundary Cases & Nuances:**

  *   **"A rather than A-minus-one-cause":** This is a **core instance of illegitimate MCS.** It changes the foil from a real alternative (B) to a hypothetical, diminished version of A. This often smuggles in assumptions about necessity/sufficiency and ignores the possibility that B had *different* (not just missing) factors. It answers "Why A?" not "Why A rather than B?".
  *   **Strawman Question:** Very similar! MCS *is* often a specific form of strawmanning the *question* or *contrast*, rather than a person's argument. The substituted question (A'/B') is easier to knock down than the original (A/B). The key difference is that MCS often stems from methodological *necessity* rather than pure rhetorical malice, though the line is blurry.
  *   **Explicit Flagging:** This moves the practice from potentially deceptive to intellectually honest **contrast class refinement**. The author acknowledges the substitution, justifies it (hopefully using criteria like Representativeness and Preserved Contrast above), and *explicitly frames the conclusions as applying to the refined contrast*. It becomes a defensible methodological choice rather than a hidden swap. The *risk* of losing fidelity remains, but it's transparent and open to critique.
  *   **Temporal Substitution:** This is particularly tricky and common. Shifting the timeframe ("Why 1800 not 1500?") to explain a later divergence requires a strong, evidence-based argument about path dependence, critical junctures, or cumulative causation. Legitimacy hinges on showing that the *seeds* of divergence were meaningfully sown at the earlier time *and* that later convergence was unlikely/impossible without the earlier events, especially if the gap was small later on.

  **Confidence Assessment:**

  *   **High Confidence (90%+):** That there isn't a single, universally recognized term capturing *exactly* the methodological tension and procedural sleight-of-hand you describe – the *necessary but risky substitution* presented *as if* it answers the original question. The literature discusses unit of analysis and contrast classes, but not this specific argumentative *move* and its unique justification/risk profile.
  *   **Medium Confidence (70%):** That "Methodological Contrast Substitution (MCS)" or "Contrast Class Substitution" accurately captures the core phenomenon. It might exist in niche methodological texts I'm unaware of, but it's certainly not mainstream in history or social science.
  *   **Lowest Confidence Claim (Bet Least On):** The claim that **explicit flagging transforms it into merely "contrast class refinement" and eliminates the problematic aspect of the phenomenon.** While flagging is vastly preferable and honest, one could argue that *even when flagged*, the substitution itself still fundamentally changes the question being answered. The "phenomenon" of answering a different question than the one originally asked still occurs; it's just done transparently. The *core act of substitution and its inherent fidelity risk* remains part of the methodological process, even if acknowledged. Therefore, explicit flagging makes it *honest* MCS, not necessarily a *different* phenomenon. (This is subtle and arguably semantic, hence the lower confidence).

  In essence, you've identified a crucial flaw in how complex comparative history is often practiced: the understandable need to make questions tractable can subtly redefine the very historical puzzle we set out to solve. Recognizing "Methodological Contrast Substitution" (MCS) and demanding justification for the swap (Representativeness, Preserved Contrast, Causal Pathway) is vital for rigorous debate.
