  **Stratagem Underwriters, Ltd.**  
  **Policy Document: SUI-MDI-2024**  
  **Multiple Discovery Indemnity (MDI) Coverage**  

  **You’ve identified a gap in knowledge. We insure against the gap closing without you.** Stratagem’s MDI policy protects researchers, inventors, and theorists against the financial and reputational impact of independent, concurrent discovery ("scooping") by a third party. Receive compensation when priority—and its attendant benefits—is lost due to a certified Multiple Discovery Event (MDE).  

  ---

  **PLAN COMPARISON**  

  | Feature                     | Bronze Discovery         | Silver Discovery          | Gold Discovery           |
  | :-------------------------- | :----------------------- | :------------------------ | :----------------------- |
  | **Base Payout (per MDE)**   | 75% of Calculated Loss   | 100% of Calculated Loss   | 125% of Calculated Loss  |
  | **Deductible**              | 50 Citation Equivalents  | 25 Citation Equivalents   | 10 Citation Equivalents  |
  | **Coverage Trigger Window** | 18 months pre-submission | 24 months pre-submission  | 36 months pre-submission |
  | **Singleton Rider**         | Not Available            | Optional (+15% Premium)   | Included                 |
  | **Absorption Discount**     | 5% Rate Reduction        | 10% Rate Reduction        | 15% Rate Reduction       |
  | **Dispute Resolution**      | Basic Arbitration        | Enhanced Arbitration      | Expert Panel Review      |

  ---

  **SECTION 1: COVERED EVENTS (Clauses 1.1 - 1.7)**  

  1.1  **Priority Loss:** Reimbursement for demonstrable financial loss (e.g., grant forfeiture, reduced speaking fees, declined patent royalties) and reputational quanta loss directly attributable to the loss of recognized priority for a Covered Discovery due to an MDE.  
  1.2  **Covered Discovery:** A novel, non-obvious finding, formulation, or invention meeting both criteria:  
       (a) **Attributability:** The Insured must demonstrate prior, documented possession (per Clause 3.2) *uniquely linking* the discovery to their sustained effort.  
       (b) **Inevitability Manifest:** The discovery must pertain to a domain exhibiting a historical Multiplicity Index (MI) ≥ 0.35 (see Rate Table), indicating a known propensity for independent recurrence.  
  1.3  **MDE Certification:** Requires independent verification by a Stratagem-appointed Adjuster that:  
       (a) A functionally identical discovery was published/publicly disclosed by an unrelated party within the Trigger Window.  
       (b) The third-party discovery gained widespread recognition *before* the Insured’s equivalent work.  
       *(Definition Note: "Functionally identical" requires core conceptual equivalence. Minor variations in methodology or expression do not invalidate an MDE if the Adjuster determines the underlying discovery is materially the same.)*  
  1.4  **Singleton Rider (Gold/Silver):** Provides a reduced payout (40% of Base) if the Insured achieves sole recognition for a discovery in a high-MI field (≥ 0.6), acknowledging the avoided loss.  
  1.5  **Absorption Discount:** Applied at underwriting if the Insured’s typical work domain shows high prevalence of discoveries becoming unattributed "folk knowledge" within 10 years (e.g., certain algorithms, statistical techniques). Reduces premium.  

  **SECTION 2: EXCLUSIONS (Clauses 2.1 - 2.9)**  

  2.1  **Prior Art:** Discovery was demonstrably present in the public domain before the Insured’s claimed inception date.  
  2.2  **Insufficient Documentation:** Failure to produce contemporaneous, verifiable records (lab notebooks, dated drafts, code commits) meeting Stratagem’s Chain of Custody Standard (Annex B) proving independent development *prior* to the MDE.  
  2.3  **Non-Inevitable Domains:** Work in fields with a certified Multiplicity Index (MI) < 0.15 ("Singleton Fields").  
  2.4  **Publication Delay:** Loss arising directly from the Insured’s failure to publish, file, or otherwise publicly disclose the discovery within a commercially reasonable timeframe (≥ 36 months) after reaching a publishable state, despite opportunity. *(e.g., protracted manuscript refinement while viable competitors are known to be active).*  
  2.5  **Incremental Progress:** Findings deemed by the Adjuster to be obvious extensions of known work, lacking the requisite novelty threshold.  
  2.6  **Simultaneous Filing:** Claims arising from near-simultaneous independent submissions (e.g., patent filings on the same day) where priority cannot be objectively adjudicated by external bodies.  
  2.7  **Self-Scooping:** Discovery by the Insured’s direct collaborators, students (within 5 years of supervision), or known co-developers.  
  2.8  **Theoretical Non-Manifestation:** Purely theoretical constructs lacking experimental verification or practical application within 10 years of the MDE.  

  **SECTION 3: RATE TABLE & MULTIPLICITY INDEX (MI)**  
  *Premiums are Annual, per $100,000 of Coverage Ceiling. Base Rates shown. Apply Rider/Discount Modifiers.*  

  | Field (Illustrative)          | MI    | Bronze | Silver | Gold | Notes                          |
  | :---------------------------- | :---- | :----- | :----- | :--- | :----------------------------- |
  | Quantum Computing (Algorithms)| 0.78  | $4,200 | $5,600 | $7,800| High concurrency, rapid progress |
  | CRISPR Applications           | 0.65  | $3,100 | $4,100 | $5,700| Hot field, clear commercial targets |
  | PDEs (Specific Class)         | 0.52  | $2,200 | $2,900 | $4,000| Steady progress, known techniques |
  | Dark Matter Detection (WIMP)  | 0.38  | $1,500 | $2,000 | $2,800| Large collabs, predictable avenues |
  | Synthetic Organic Chemistry   | 0.25  | $850   | $1,100 | $1,500| Lower concurrency, diverse targets |
  | Byzantine Numismatics         | 0.08  | $350*  | $450*  | $600*| *Singleton Rider Mandatory if available |

  **MI Calculation Basis:** Stratagem’s proprietary MI (range 0.0 - 1.0) quantifies historical frequency of documented MDEs per 100 significant discoveries in a field over 50 years, adjusted for publication volume and adjusted for network centrality bias^(†).  
  ^(† *Note: Counterfactual incidence (worlds without MDEs) is inferred from singleton dominance periods and structural field properties. Actual unreported MDEs cannot be measured but are actuarially accounted for in variance buffers.)*

  ---

  **FAQ**  

  **Q1: What if both discoverers have Stratagem MDI policies?**  
  A: Stratagem applies a "Mutual Offset" clause. Each claim is assessed independently against policy terms. If both are valid, payouts are made per each policy's coverage level, minus standard deductibles. Premiums reflect this correlated risk in high-MI fields.  

  **Q2: Is the payout monetary, or does Stratagem help restore credit?**  
  A: The MDI policy indemnifies quantifiable financial and reputational *loss*. Payouts are monetary, based on our actuarial models of priority loss impact (e.g., projected lifetime citation deficit, grant success probability delta). While restoring credit is not a service we provide, the financial compensation acknowledges the loss of the *economic advantage* tied to priority recognition.  

  **Q3: How does the Adjuster decide if my work was "functionally identical" to the scooper's?**  
  A: Our Adjusters, trained in the relevant scientific domain and Stratagem’s proprietary equivalence protocols, examine core claims, methodologies, and results. Minor presentational differences are disregarded. The key test is whether the community reasonably perceives the *core discovery* as the same, rendering your independent contribution redundant for priority purposes.  

  **Q4: Why is there a discount for work likely to become unattributed?**  
  A: Stratagem recognizes that some discoveries rapidly enter the general knowledge pool without clear attribution. In such cases, the *perceived* loss of priority (and thus the impetus to claim) diminishes significantly. This reduced claims frequency allows us to offer lower premiums. It reflects the efficient diffusion of knowledge, minimizing individual loss.  

  **Q5: Does the policy cover the cost of my research?**  
  A: No. MDI covers the *loss of priority and its benefits*, not the cost of achieving the discovery itself. It insures the potential future value uniquely tied to being recognized as first.  

  ---

  **Stratagem Underwriters, Ltd. – Turning Priority Risk into Calculated Certainty.**  
  *This is a summary of coverage. Actual policy terms, conditions, limitations, and exclusions govern. MI scores and rates subject to change based on Stratagem’s ongoing actuarial review. Not available in all jurisdictions. Consult Annex A (Definitions), Annex B (Documentation Standards), and Annex C (Loss Calculation Methodology) for full details.*
