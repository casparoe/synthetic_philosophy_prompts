prompt: |-
  Consider the four counts of the Nuremberg indictment — the common plan or conspiracy count, crimes against peace, war crimes, and crimes against humanity — and rank them by how exposed each is to the *nullum crimen, nulla poena* objection: that is, by how much of the count's legal work had to be supplied by the tribunal's own construction rather than by law already binding on Germany when the charged conduct occurred. Assign each count a score from 0 (essentially immune to the objection) to 1 (wholly dependent on retroactive construction), with a sentence or two justifying each placement, and do not resolve your uncertainty by giving every count the same number.

  In scoring the fourth count, take account of the Charter's requirement that crimes against humanity be committed in execution of or in connection with other crimes within the tribunal's jurisdiction, and of what the tribunal consequently made of persecution predating the outbreak of war; also say whether the 1915 joint Allied declaration on the Armenian massacres gives that count more pedigree than its absence from any treaty would suggest.

  Then answer two further questions. First, does your ordering shift for Tokyo — in particular for its broader crimes-against-peace conspiracy charge, its murder charges resting on command responsibility, and the dissent that would have acquitted the defendants outright? Second, on which count, if any, is the retroactivity charge largely a red herring, obscuring a more serious complaint about the proceedings, such as the exclusion of the victors' own conduct or the jurisdictional narrowing of the fourth count?
reasoning: |-
  Okay, the user wants me to analyze the Nuremberg trials' four indictment counts regarding the nullum crimen principle. Let me start by recalling what each count entails. The common plan or conspiracy is Count One, crimes against peace is Count Two, war crimes is Count Three, and crimes against humanity is Count Four. The nullum crimen objection argues that laws shouldn't be applied retroactively. So I need to rank each count from 0 to 1 based on how much they relied on new legal constructions versus existing laws binding Germany at the time.

  First, Count Three (war crimes) seems the most straightforward. The Hague and Geneva Conventions were established, and Germany was a signatory. The atrocities committed were clear violations of existing treaties. So this should be low, maybe 0.1. 

  Count Two (crimes against peace) is about aggressive war. Before Nuremberg, aggression wasn't clearly a crime under international law. The Kellogg-Briand Pact renounced war but didn't criminalize it. So the tribunal had to create new law here. That's high retroactivity, maybe 0.8. 

  Count One (conspiracy for crimes against peace) is tied to Count Two. Since aggression wasn't criminalized, conspiring to commit it would also be new. Plus, conspiracy itself wasn't a recognized concept in international law. So even higher, 0.9. 

  Count Four (crimes against humanity) is tricky. The concept existed in some forms, like the Armenian declaration, but wasn't treaty law. The tribunal required connection to war crimes or aggression, limiting its scope. Persecution before the war was problematic. The Armenian reference adds some pedigree but not much legal weight. So around 0.7. 

  Now, for Tokyo. The conspiracy charge was broader, which might increase retroactivity. Command responsibility for murder might be similar to war crimes, so less retroactive. The dissent highlights fairness issues, but doesn't change the retroactivity ranking. 

  Is retroactivity a red herring for any count? For Count Four, the jurisdictional link to war might obscure that the Allies excluded their own actions, like Dresden or Hiroshima. The real issue might be victors' justice, not retroactivity. 

  Need to ensure justifications are concise. Also, check the Armenian declaration's impact. It shows moral condemnation but wasn't binding law. So it doesn't significantly reduce the retroactivity of crimes against humanity. 

  Double-check sources: The Hague Conventions for war crimes, Kellogg-Briand for crimes against peace. Conspiracy in international law was novel. Crimes against humanity had precedents like the Armenian declaration but no legal framework. 

  Tokyo's differences: Broader conspiracy might raise retroactivity further. Command responsibility based on existing laws. Dissent points to procedural issues, not retroactivity. 

  Red herring: Count Four's jurisdictional link might hide victors' impunity. The real complaint is selective prosecution, not the law's retroactivity.
answer: |-
  Here is the ranking of the Nuremberg indictment counts by exposure to the *nullum crimen* objection (1 = wholly retroactive, 0 = immune), with justifications:

  1.  **Count One (Common Plan or Conspiracy to Commit Crimes Against Peace): 0.9**  
      *This charge was highly novel. While conspiracy was known in domestic law (especially Anglo-American systems), it had no clear precedent in* international *criminal law governing aggression. The concept of criminalizing the* planning *of aggressive war itself, distinct from the act, relied almost entirely on the Tribunal's construction.*

  2.  **Count Two (Crimes Against Peace - Planning/Initiating/Waging Aggressive War): 0.8**  
      *While aggressive war was condemned (e.g., Kellogg-Briand Pact), its explicit criminalization under international law, attaching individual criminal liability to state leaders, was unprecedented. The Tribunal had to construct this crime from moral/political condemnations and nascent legal principles.*

  3.  **Count Four (Crimes Against Humanity): 0.7**  
      *The core concepts (murder, extermination, enslavement, persecution) were often covered by domestic law or war crimes provisions. However, prosecuting them as* international *crimes committed by a state against its *own* civilians, especially acts predating the war (like pre-1939 persecution), required significant retroactive construction. The Charter's jurisdictional link (requiring connection to war crimes/crimes against peace) was crucial to mitigate retroactivity but itself was a novel limitation.*  
      **Armenian Declaration Note:** *The 1915 Allied declaration condemning the Armenian massacres as "crimes against humanity and civilization" provides important* moral/political pedigree *and foreshadowing, demonstrating pre-existing outrage at such conduct. However, it was a declaration, not binding treaty law, and established no legal framework or individual liability. It lessens but does not eliminate the retroactivity concern.*

  4.  **Count Three (War Crimes): 0.1**  
      *This count rested firmly on established international law (Hague Regulations, Geneva Conventions 1929, customary laws of war) explicitly binding on Germany. The specific atrocities charged (murder/mistreatment of POWs/civilians, slave labor, plunder) were unambiguously prohibited by long-standing treaties and customary international law.*

  **Answers to Further Questions:**

  1.  **Does the ordering shift for the Tokyo Tribunal (IMTFE)?**  
      **Yes, slightly, primarily regarding Count One:**  
      *   **Count One (Conspiracy):** The Tokyo indictment framed the conspiracy much more broadly (beginning in 1928) and vaguely than Nuremberg's. This *increased* its retroactivity exposure **(Score: ~0.95)** as it stretched the novel conspiracy concept further back in time over less clearly defined aggressive plans.
      *   **Command Responsibility/Murder (War Crimes):** Charges resting solely on command responsibility for conventional war crimes (like murder of POWs) were generally well-grounded in existing laws of war (similar to Nuremberg's Count 3, **Score: ~0.1-0.2**). The principle of command responsibility had recognisable, if evolving, customary and treaty bases.
      *   **Dissent (Pal, Röling):** While the dissents (especially Justice Pal's) highlighted *nullum crimen* concerns across all charges (particularly crimes against peace and conspiracy), their core legal argument for acquittal *reinforced* the high retroactivity scores for Counts One and Two rather than shifting the relative ranking. They argued the *entirety* of the novel charges violated *nullum crimen*, consistent with the high scores assigned.

  2.  **On which count is retroactivity largely a red herring, obscuring a more serious complaint?**  
      **Count Four (Crimes Against Humanity).**  
      The intense focus on the retroactivity of prosecuting state-sponsored atrocities against a perpetrator's own civilians (especially pre-war acts) often obscures the **more fundamental complaint about victors' justice and selectivity**. The Charter's requirement linking Crimes Against Humanity *only* to acts connected to war crimes or crimes against peace meant the Tribunal explicitly refused jurisdiction over Axis atrocities not connected to the war (e.g., pre-war persecution of German Jews *solely* as a matter of domestic policy). Crucially, this jurisdictional limitation also served to **immunize the Allied powers** from potential scrutiny for their own atrocities committed outside the context of aggression or war crimes against the Axis (e.g., Soviet deportations, Allied strategic bombing of civilians). The real complaint is that the novel charge was **structured to ensure only the atrocities of the defeated enemy** were adjudicated, embedding "victor's justice" into its very definition. The retroactivity debate distracts from this profound asymmetry and the exclusion of Allied conduct.
