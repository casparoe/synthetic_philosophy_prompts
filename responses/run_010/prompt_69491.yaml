  I run a risk-scoring service and about a year ago we stopped outputting a single probability and started outputting a lower and an upper bound instead (really a set of models rather than one). Zero philosophy background, I just maintain the code. Here's my gut verdicts on how the thing should behave, and I want to know whether there's one principle behind them:

