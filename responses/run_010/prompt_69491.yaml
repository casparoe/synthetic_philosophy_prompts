  1. Maintain a closed convex set of probability models (a *credal set*) representing uncertainty; bounds are the infimum and supremum of probabilities assigned by models in this set. This justifies rejecting both bets when no model favors either (satisfies your first verdict).

  2. Update the credal set via generalized Bayesian conditioning upon new evidence: each model updates using Bayes' rule, and the set contracts monotonically (new bounds are subsets of prior bounds). This ensures you always accept free information (second verdict) and prevents interval dilation (fourth verdict).

  3. Enforce that with increasing evidence, the credal set converges almost surely to a single model (or narrow interval). This makes failure to update after sufficient data a bug (third verdict), as bounds must contract.

  4. Reject the fifth verdict: unconditional lower bounds need not respect conditional bounds. If all conditional lower bounds are ≥0.3, the unconditional bound can be lower (e.g., 0.25), violating your intuition. Keeping your first verdict costs this coherence.

  5. For bets, reject only if *all* models in the set assign negative expected loss. Applied to a new case: if bounds for event A are [0.4, 0.6] and you're offered a bet paying $1.50 if A occurs for a $1 stake, you reject it (since max model probability 0.6 implies max expected gain is -$0.10).
