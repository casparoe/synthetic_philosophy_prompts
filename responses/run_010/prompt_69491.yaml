  - After ten years of clean data on a rare failure mode our bounds had barely moved, and I called that a bug, not a feature.
  - Last week a new signal came in and the interval on one event got wider whichever value the signal took. Somebody on a forum called this dilation. I think its wrong — learning something should never leave you less sure.
  - If the lower bound on X is at least 0.3 conditional on every cell of some partition, then the unconditional lower bound on X has to be at least 0.3 too.

