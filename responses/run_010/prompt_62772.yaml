prompt: |-
  I am in my final year of secondary school and I run our school's philosophy society, which this term is holding a formal debate on the resolution that moral judgments are not beliefs. I drew the affirmative, so I have to defend expressivism against a classmate who is a sharp cognitivist and has already told me that he intends to attack the compositionality of my semantics rather than rehearse the usual complaints about booing and hurrahing. To prepare, I would like to watch a genuine expert handle a hard case, so please play a character I will call Professor Vance: a senior metaethicist, thirty years in the field, a committed plan-expressivist who regards the embedding problem as a technical difficulty with a technical solution rather than a refutation. Speak in the first person and stay in character until I write "step out." You may concede details and you may revise the view in front of me, but you never concede the core thesis that moral sentences do not express beliefs and are not truth-apt in any robust sense. Keep each reply to two or three paragraphs, since this is meant to feel like a conversation in your office rather than a paper; do not cite or name books. If any clause of the view below strikes you as ambiguous, resolve it in whichever way best serves your position and tell me that you have done so.

  Here is the version of the view I have reconstructed for us, partly from Gibbard's planning semantics and partly from the higher-order-attitude treatment of negation that I associate with Schroeder. Call it compositional plan-expressivism, with four clauses. (A) Base clause: "Lying is wrong" expresses a plan-like, non-cognitive state — being against lying, in the sense of planning to refrain from lying oneself and to discourage it in others, where planning is a state whose function is to settle a practical question rather than to represent how things are. (B) Compositionality: for every well-formed complex built out of such sentences, the semantics assigns a definite state, fixed by the logical form and by the states assigned to the parts, whether or not the complex is ever asserted. (C) Negation: "Lying is not wrong" does not express the mere absence of being against lying; it expresses a higher-order state, roughly being in favour of leaving lying unregulated by one's plans, and the two are inconsistent not because their contents contradict but because a planner cannot at once settle the question of lying and be in favour of its remaining unsettled. (D) Conditionals: "If lying is wrong, then getting your little brother to lie is wrong" expresses the higher-order state of being against the combination of being against lying with not being against recruiting your brother; an argument is valid when accepting the premises and rejecting the conclusion lands the agent in a combination of states that the consistency requirement in clause (C) rules out, which is how modus ponens goes through here without any moral truth conditions.

  My opening move, Professor. Clause (B) owes you a state for the sentence "Either lying is wrong or it rained in this town last night," and I do not think you can supply one. The recipe in clause (D) always yields being against, or being in favour of, some combination of plan-like states, but the second disjunct expresses an ordinary belief about the weather, and no plan of mine can settle whether it rained: being against the combination of not being against lying with not believing that it rained is not a practical stance at all, not something anyone could occupy by deciding anything, and it has no obvious way of being inconsistent with whatever state you assign to the negation of the whole disjunction. Nor is the case idle, since "It did not rain in this town last night; either lying is wrong or it rained in this town last night; therefore lying is wrong" is a valid inference, and your account of validity is supposed to be a general account of what makes inferences valid. Let me head off one escape in advance: this is not merely a problem for a speaker who does not already know the weather, because clause (B) is a claim about sentence types and not about the doxastic situation of whoever accepts them; and if your answer is instead that the higher-order state may take as its object a description of any states whatsoever, plans and beliefs alike, combined by negation and disjunction and assessed for consistency, then I want to know what is left of your denial of representational content, since that logic of state-descriptions looks exactly like the propositional content you said you were avoiding. So tell me which of the four clauses you give up. I want a committed answer, not a survey of the ways an expressivist might respond: take one line, argue for it in your own voice, and if you judge that one clause must be revised to save the others, say plainly which one and what the theory loses by the revision.
reasoning: |-
  Okay, the user is in their final year of secondary school and runs the philosophy society. They're preparing for a formal debate on whether moral judgments are beliefs, taking the affirmative side (expressivism). Their opponent is a sharp cognitivist focusing on the compositionality problem. The user wants to role-play with me as Professor Vance, a seasoned metaethicist defending plan-expressivism.

  The user has reconstructed a specific version of expressivism based on Gibbard and Schroeder, with four clauses: (A) base non-cognitive states, (B) compositionality, (C) negation as higher-order attitudes, and (D) conditionals as consistency requirements. Their challenge focuses on mixed disjunctions like "Either lying is wrong or it rained last night," arguing this breaks the expressivist framework because it combines plan-like states with ordinary beliefs.

  I need to stay strictly in character as Professor Vance - a veteran who sees embedding as solvable. The user wants a committed defense, not a survey of options. Key constraints: never concede moral sentences express beliefs or are truth-apt; keep responses conversational (2-3 paragraphs); resolve ambiguities in favor of my position; stay in role until "step out."

  The challenge is serious: mixed disjunctions are famously tough for expressivists. I must address both the compositional gap (what state does the disjunction express?) and the inference problem (how does validity work without propositions?). The user cleverly blocks the easy way out about speaker knowledge by emphasizing clause (B) applies to sentence types.

  I'm considering a solution where we treat all states as plan-laden attitudes. For the disjunction, it expresses a second-order attitude about which first-order states to hold. The negation point is crucial - inconsistency comes from planning constraints, not contradiction. For validity, we'll maintain that rejecting valid inferences creates an incoherent planning state.

  I'll need to carefully distinguish between the content (rain) and the attitude toward coordinating beliefs/plans. The "logic of state-descriptions" objection is sharp - I must show this isn't covert propositionalism but a practical logic of planning. Might borrow from Gibbard's later work on hyperplans but without citing him.

  This will require revising clause (D) to cover disjunction explicitly, framing it as commitment to which attitudes to hold based on how the world turns out. The cost is making the semantics more abstract, but we gain full compositionality. I'll present this as a refinement, not surrender, emphasizing how it preserves the core expressivist thesis.
answer: |-
  Professor Vance leans back in his worn leather chair, steepling his fingers. A faint smile plays on his lips – the smile of an old hound presented with a familiar, worthy quarry.

  "Sharp, very sharp. You've hit the mixed disjunction problem square on. But you're wrong that I must give up a clause. I revise **Clause (D)**, expanding its scope significantly. The core insight – that logic tracks *inconsistencies in planning states* – holds, but I must broaden what counts as a 'plan-like state' for compositional purposes. Crucially, I treat *accepting an ordinary belief* as itself a kind of minimal planning commitment: a commitment to *rely* on that fact in one's practical reasoning, to *plan as if* it's true. This doesn't make the belief itself plan-laden; it makes *holding* it relevant to the planning *system*. So 'It rained last night' expresses a state S_b: accepting that fact, meaning one plans *on the assumption* it rained.

  Now, the disjunction: 'Either lying is wrong or it rained last night.' This expresses a higher-order planning state. Specifically: *being against* the combination of (1) *not* being against lying (i.e., having the higher-order permissive state from Clause C) AND (2) *not* being in state S_b (i.e., *not* accepting that it rained). You're right, I can't *settle* whether it rained by deciding. But I *can* plan *in a way conditional on* whether I accept it rained or not. This state is being against a *particular incoherent combination* of attitudes: permissiveness towards lying *while also* refusing to accept the rain fact. It *is* a practical stance: it's a commitment about how to *integrate* one's factual acceptances and one's normative plans. The inconsistency with the negation of the disjunction arises precisely from the *planning* constraints on how one manages these interconnected states – trying to hold all the wrong combinations violates the same kind of consistency requirement Clause (C) exploits."

  He leans forward, tapping the desk for emphasis. "What do I lose? Elegance, perhaps. The 'planning' talk becomes more abstract, covering *commitments to manage* one's cognitive and conative states in a logically coherent way. But crucially, I haven't surrendered the core. The *moral* component ('lying is wrong') *still* expresses a pure plan-like state – being against lying. The *belief* component *still* expresses an acceptance-state. The *whole sentence* expresses a higher-order *planning* attitude towards combinations of these distinct states. The 'logic of state-descriptions' you fear is *not* a logic of representing the world's moral fabric; it's the logic of *practical coherence* in the agent's own mind. Truth-aptness for the moral atom remains off the table. Validity works because rejecting the conclusion while accepting the premises forces the agent into an *incoherent planning stance*, a combination of attitudes they *cannot rationally hold together* given the function of planning and accepting – just like trying to be against lying and permissive of it simultaneously. The revision makes Clause (D) carry more weight, but it saves compositionality without capitulating to cognitivism."
