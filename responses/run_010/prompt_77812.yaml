          T_B = total welfare in scenario B
          n_A = total number of individuals in A
          n_B = total number of individuals in B
          S = the set of individuals that exist in both A and B
          n_S = size of S
          If n_S / min(n_A, n_B) < 0.1, then set PA_flag = 'ignore'
          Else:
              PA_A = sum of welfare levels in A for individuals in S
