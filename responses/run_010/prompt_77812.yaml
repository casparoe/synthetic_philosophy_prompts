  We are designing a decision procedure for a grant panel to compare two proposals. The procedure must account for different population ethical views (total, average, critical-level, and person-affecting) and handle cases where the existence of future people is at stake.

  The procedure should be executable by a three-person panel (no philosophy training) in about two minutes per pair of proposals. It must output which proposal is better, or if the choice depends on ethical views and thus requires a policy decision (which the panel is not authorized to make). We'll structure it as a series of ordered questions with clear exit points.

  Key concepts:
  1. **Total view**: Maximize total welfare (sum of welfare levels). Leads to the repugnant conclusion (a large population with barely positive welfare can be better than a small, flourishing one).
  2. **Average view**: Maximize average welfare. Avoids repugnant conclusion but may favor small populations and can have other counterintuitive results (e.g., adding very happy people might lower average if they are less happy than the current average).
  3. **Critical-level utilitarianism**: Values a life only if its welfare is above a critical level (often set to a positive welfare). We set the critical level to a non-negative value (e.g., a minimally decent life). We'll use a fixed critical level (say, 0 on a scale where 0 is a life barely worth living, but note: we might set it higher). The value of adding a person is their welfare minus the critical level. The total value is the sum over all individuals of (welfare - critical level).
  4. **Person-affecting view**: Only consider the welfare of people who would exist in both futures. We don't count the welfare of people who exist in one future but not the other? But note: this leads to the non-identity problem and may be insensitive to the addition of new lives.

  However, note that the person-affecting view is complex and has many variants. We'll use a simple version: we only count changes in welfare for individuals that exist in both scenarios. If an individual exists in only one scenario, then we ignore their welfare. But note: this view might lead to paralysis when comparing futures with disjoint populations.

  Given the time constraint and the lack of training, we design a procedure that:
  - First, tries to see if both proposals affect the same set of people (so existence is unchanged). Then we can use a simple sum or average without worrying about existence.
  - If they don't, then we check if one proposal is better under all the views we consider. If so, we choose that one.
  - If not, then we have a disagreement between ethical views, and we must flag it for the board (or a predetermined policy).

  We'll use the following views for comparison: total, average, critical-level (with a fixed critical level, say 0), and a person-affecting view (only existing people in both scenarios).

  But note: the critical level might be set by the board. Since we don't have that, we'll use 0 (a life barely worth living) as the critical level. However, the board might set it to a higher level. We'll note that as a judgment call.

  We also note that the person-affecting view we are using is the narrow one: only individuals who exist in both scenarios. This might be too narrow because it ignores the interests of people who only exist in one of the scenarios. But for simplicity, we'll use that.

  Procedure:

  1. **Same people?**: Do both proposals affect exactly the same set of individuals (both now and in the future)? 
     - If yes, then we can simply compare the total welfare gain (sum of welfare improvements). Choose the one with the higher total gain. (Note: if the set is the same, then average would also rank the same as total because the population is fixed. Also, critical-level and person-affecting would also be the same since the population is fixed and we are only considering gains for existing people.) Exit.

  2. **Different people?**: If the proposals change who exists (i.e., the sets of people are different), then we need to check multiple views.

     We'll compute the following for both proposals:
     - Total view: total welfare (sum of welfare levels of all individuals who exist in that scenario).
     - Average view: average welfare (total welfare divided by the number of people).
     - Critical-level view: total welfare minus critical level per person (so for each person, welfare - critical_level; then sum). We set critical_level = 0 (a judgment call, but we note it). So this becomes the same as total view if critical_level=0. But the board might set a higher critical level. We'll note that if critical_level>0, then the critical-level view might differ.

     However, we are constrained by time. We cannot compute multiple critical levels. So we do:

     a. **Compute under total view (critical level 0)**: 
          Value_A = total welfare in scenario A
          Value_B = total welfare in scenario B

     b. **Compute under average view**:
          Avg_A = Value_A / (number of people in A)
          Avg_B = Value_B / (number of people in B)

     c. **Critical-level view with a fixed critical level (we use 0 for now, but note that if the board sets a different critical level, it might change)**: 
          Since critical level is 0, critical-level view = total view.

     d. **Person-affecting view**: We only consider individuals who exist in both scenarios. Let S be the set of people that exist in both A and B. Then:
          PA_A = sum of welfare in A for individuals in S
          PA_B = sum of welfare in B for individuals in S

     But note: if the two scenarios have disjoint populations, then S is empty and PA_A = PA_B = 0. Then we cannot decide by this view.

     However, in practice, many proposals might share a common set (e.g., current people) and then add different future people.

  3. **Compare the proposals under each view**:

     We ask:
     - Is Value_A > Value_B? (Total view and critical-level at 0)
     - Is Avg_A > Avg_B? (Average view)
     - Is PA_A > PA_B? (Person-affecting view)

     But note: the person-affecting view might not be comparable if the common set is empty. Also, if the common set is very small, then the person-affecting view might not capture the main differences.

