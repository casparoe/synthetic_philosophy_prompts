  ### Decision Procedure for Grant Proposal Pairs

  **Objective**: Compare two proposals (A vs. B) accounting for population ethics (total, average, critical-level, person-affecting views) in ≤2 minutes. Outputs: (1) Clear preference (A or B), (2) "Ethically sensitive" flag for board escalation, or (3) Tie.

  **Key Rules**:
  - **Critical level**: Fixed at 0 (a life barely worth living). *Judgment call: Assumes board accepts this; if not, adjust offline*.
  - **Person-affecting relevance threshold**: Common population <10% of the smaller total population → ignore person-affecting view.
  - **Majority rule**: 2+ agreeing views decide; else, flag for board.
  - **Time-saver**: All welfare calculations use *incremental gains* (difference from baseline), not absolute levels.

  ---

  ### Procedure Steps (Ordered Questions)

  1. **Same affected populations?**  
     - *Question*: "Do both proposals affect the exact same group of people (including future generations)?"  
     - *Sufficient answer*: Yes/No based on proposal documentation.  
     - *Exit if Yes*: Choose proposal with higher **total welfare gain** (Σ welfare improvement).  
     - *Else*: Proceed to Step 2.

  2. **Compute welfare gains**  
     *(Panelist inputs: affected population size, welfare gain per person, existence changes)*  
     - Total view: **Total gain** = Σ (people affected × welfare gain)  
     - Average view: **Avg gain** = Total gain / Total future population (including unaffected)  
     - Person-affecting view: **PA gain** = Σ welfare gain *only* for people existing in **both** scenarios.  
     - Critical-level view: **CL gain** = Total gain – (Critical level × new people added).  
       - *Critical level = 0* → CL gain = Total gain. *Judgment call: CL=0 simplifies to total view; board must confirm*.

  3. **Check person-affecting relevance**  
     - *Question*: "Is the population common to both proposals ≥10% of the smaller proposal’s total affected population?"  
     - *Sufficient answer*: Calculate common population %; if <10%, ignore PA view (set PA gain = 0 for comparison).  
     - *Judgment call: 10% threshold arbitrary; adjust if board provides guidance*.

  4. **Compare gains across views**  
     For each view (Total, Avg, PA, CL):  
     - Preference = A if A’s gain > B’s gain, B if B > A, Tie if equal.  
     *(CL view uses critical level = 0)*

  5. **Decision rules**  
     - **Unanimous?** If all views agree → choose that proposal.  
     - **Majority?** If ≥2 views agree → choose that proposal.  
     - **Tie/no majority?** (e.g., 2 ties + 1 split; or 2-2 split if PA ignored) → Flag "Ethically sensitive" for board.  
     - **Output**: Winning proposal or "Board escalation required."

  ---

  ### What This Can’t Settle
  - **Judgment calls disguised as procedure**:  
    - Critical level (0 vs. higher "decent life" threshold).  
    - Person-affecting relevance threshold (10% cutoff).  
    - Welfare quantification (converting health/climate gains to utils).  
  - **Philosophical limits**:  
    - Non-identity problem (when creation of new people is inherently good/bad).  
    - Variable critical levels or time-discounting.  
    - Comparisons if common population is tiny but gains are extreme.

  ---

  ### Example Evaluations

  #### Pair (a):  
  - **Proposal A**: Cut chronic pain for 40,000 current people.  
    - Welfare gain: Substantial (e.g., +50 utils/person).  
    - Total population (current + future): Assume 8B current + 1T future = 1.000008T.  
  - **Proposal B**: Slight improvement for enormous future population.  
    - Welfare gain: +0.01 utils/person for 1T people over 10,000 years.  
    - Total population: 1.000008T (same future people exist in both).

  | View              | Proposal A                     | Proposal B                     | Preference |
  |-------------------|--------------------------------|--------------------------------|------------|
  | **Total gain**    | 40k × 50 = 2M utils            | 1T × 0.01 = 10B utils          | B          |
  | **Avg gain**      | 2M / 1.000008T ≈ 0.002         | 10B / 1.000008T ≈ 0.01         | B          |
  | **PA gain**       | Common population = all 1.000008T people. <br> A: +2M utils (only 40k gain) <br> B: +10B utils (future gain) | → B | B          |
  | **CL gain (0)**   | Same as Total → B              |                                | B          |

  - **Result**: Unanimous for **B**.  
  - **Why you’ll hate this**: Last cycle’s top long-horizon climate proposal (similar to B) beats urgent current aid. Total view’s repugnant conclusion dominates.

  ---

  #### Pair (b):  
  - **Proposal A**: Modest gain for 2M existing households (assume 5 people/household → 10M people).  
    - Welfare gain: +1 util/person.  
    - Total population: 8B (no new people).  
  - **Proposal B**: Add 5M new people at "decent but lower" welfare (assume +25 utils/person vs. non-existence).  
    - Welfare gain: 5M × 25 = 125M utils.  
    - Total population: 8B + 5M.  
    - *No one worse off*: Existing population unchanged.

  | View              | Proposal A                     | Proposal B                     | Preference |
  |-------------------|--------------------------------|--------------------------------|------------|
  | **Total gain**    | 10M × 1 = 10M utils            | 125M utils                     | B          |
  | **Avg gain**      | 10M / 8B = 0.00125             | 125M / 8.005B ≈ 0.0156         | B          |
  | **PA gain**       | Common population = original 8B. <br> A: +10M utils (for 10M people) <br> B: 0 (existing unchanged) | → A | A          |
  | **CL gain (0)**   | Same as Total → B              |                                | B          |

  - **Analysis**:  
    - Total, Avg, CL views prefer **B** (higher aggregate gains).  
    - PA view prefers **A** (only existing people gain).  
    - Common population = 8B (100% of A, >99% of B) → PA relevant.  
  - **Result**: Majority (3:1) for **B**.  
  - **No hate here**—B wins, but note: If critical level were >25 utils (e.g., "good life" = 30+), CL view would flip to A.

  ---

  ### Critical Notes for Board Survival
  1. **Transparent tradeoffs**: Procedure exposes when ethics flip rankings (e.g., PA vs. total view).  
  2. **Escalation clarity**: "Ethically sensitive" flags cases the panel can’t resolve (e.g., tied views).  
  3. **Speed compliance**: Steps 2–5 require only arithmetic (≈45 seconds/pair with calculator).  
  4. **Limitations declared upfront**: Cannot resolve non-identity problems or variable critical levels.  

  **Recommendation**: Pre-approve critical level and relevance threshold with the board to avoid challenges. Run historical data through this procedure to test robustness before next cycle.
