              -1 if T_A < T_B
              0 if T_A == T_B
          A_pref = 
              1 if Avg_A > Avg_B
              -1 if Avg_A < Avg_B
              0 otherwise
          If PA_flag is 'ignore', set PA_pref = 0.
          Else:
              PA_pref = 
