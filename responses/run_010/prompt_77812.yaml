  **Decision Procedure for Two Proposals (A and B)**

  1. **Same people?** 
     - Check if the set of individuals who ever exist is exactly the same in both proposals. If yes:
          - Compute the total welfare gain (sum of gains for all individuals) for A and B.
          - Choose the proposal with the higher total gain.
