  I'm an applied mathematician and I've spent ten years doing system identification — I fit models to noisy sensor data from a district heating network, then argue with the plant engineers about whether the fitted model captures the actual dynamics or is just a good predictor. A philosopher friend told me last month that this argument is basically the Humeanism debate about laws of nature in disguise and now I can't stop thinking about it.

  You're a professional philosopher of science who also knows estimation theory properly — not the pop version. Think carefully, and work through the mapping item by item rather than in generalities.

  First, translate the Humean side into my vocabulary as faithfully as you can: Lewis's best-system account, where the mosaic of local particular facts comes first and laws are the axioms/theorems of whatever systematization of that mosaic best balances simplicity against strength. My vocabulary is: the dataset, the model class, identifiabilty, bias-variance, regularization, model selection criteria, interpolation versus extrapolation, invariance under intervention, out-of-distribution generalization. Where does the simplicity/strength trade-off land — is it just an AIC/BIC-style penalty, or something else? And what is the mosaic in these terms, given that it's supposed to be everything rather than a sample?

  Second, do the same for the anti-Humean side: the necessitation view where laws are relations between universals rather than summaries of what happens, the idea that laws govern or produce the mosaic instead of describing it, and the objections that Humean laws can't underwrite counterfactuals and that a change somewhere far away in the mosaic could flip what the laws are.

  Third, the part I actually care about: the residue report. Which claims map cleanly? Which only survive if you distort them, and how much? Which have no expression at all in estimation language — where governing or necessitation isn't even something I could write down badly? Be strict about this. Don't quietly render govern as identifies or predicts or fits to make the map look tidier, and flag every place you're fudging.

  And here's a hypothesis I want you to test, not flatter: maybe governing just is invariance-under-intervention. A law is a parameter that stays put when you intervene on the system rather than one that merely tracks it, and the anti-Humeans have noticed a real feature of estimation and then wrapped metaphysics around it. Is that a genuine translation or a bait-and-switch that trades their necessity for my causal-invariance assumptions?

  Start with your bottom line in the first sentence — whether the residue is a defect in my vocabulary or evidence that the anti-Humeans are less clear than they sound — then give the reasoning. No preamble, no restating my question.
