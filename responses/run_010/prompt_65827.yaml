answer: |-
  **Bottom line:** The residue reveals genuine limitations in your vocabulary for capturing anti-Humean necessitation, not merely anti-Humean obscurity; invariance-under-intervention is a crucial *symptom* of governing but not an equivalent *translation*.

  ### Humeanism (Lewis) in Estimation Terms
  1.  **The Mosaic:** The complete, infinite-dimensional, noise-corrupted, spatiotemporally indexed dataset of all fundamental physical facts (e.g., particle positions/momenta, field values). *Not* your finite sensor sample. Capturing it perfectly requires infinite complexity.
  2.  **Best System/Laws:** The chosen model `M*` from an unrestricted model class `ℳ` (capable of arbitrary complexity) that optimizes a global objective function `J(M) = Strength(M) - λ * Complexity(M)`.
      *   **Strength:** `log(Likelihood(M | Entire Mosaic))`. Perfect fit gives maximal strength but infinite complexity.
      *   **Simplicity:** Measured by Kolmogorov complexity or minimal description length of `M`. Minimizes parameters/structure.
      *   **Trade-off:** `λ` is a *meta-parameter* set by the "cosmic modeller", balancing overfitting (high variance relative to mosaic noise) vs. underfitting (high bias). Resembles AIC/BIC *in spirit* but operates on the *entire population*, not a sample. Its value is part of what makes `M*` "best", not externally imposed.
  3.  **Laws as Output:** The "laws" are the equations/parameters of `M*`. They are *descriptive summaries*, not causal forces. Identifiability is irrelevant at this cosmic level – `M*` is defined by `J(M)`, uniqueness is ideal but not strictly required.
  4.  **Counterfactuals/Interventions:** Handled *within* `M*`. If `M*` has the right structure (e.g., causal graphical model), its *predictions* under hypothetical interventions define counterfactuals. No deeper "oomph".

  ### Anti-Humeanism in Estimation Terms (Attempted)
  1.  **Laws as Relations Between Universals:** Laws are fixed *constraints* `L` existing *prior* to the mosaic. `L` defines the *fundamental model class* `ℳ_L`. The mosaic is a single, noisy *realization* `D` generated by `L` plus contingent initial/boundary conditions `C` and noise `ε`: `D ~ P(D | L, C, ε)`. `L` is not *fitted*; it *generates* the fitting problem.
  2.  **Necessitation/Governing:** `L` doesn't just *describe* `D`; it actively *constrains* what `D` *can be*. This is the core claim with **no clean translation**. Estimation theory deals with *descriptions* of `D` (`M ∈ ℳ`) and their properties (bias, variance, invariance). The idea that `L` *makes* `D` happen isn't a parameter or a fitting criterion.
  3.  **Counterfactual Objection:** Anti-Humeans argue Humean `M*` fails *ontologically*: it summarizes `D` but lacks the *power* to dictate what *would* happen under genuinely novel interventions (extrapolation far outside `D`'s support). `M*`'s counterfactuals are extrapolations relying on `M*`'s structure *matching* `L`'s – which Humeanism cannot guarantee.
  4.  **Mosaic Instability Objection:** If a distant part of the mosaic changes (adding `ΔD`), the Humean `M*` might flip to a different `M**` (e.g., simpler to describe `D ∪ ΔD`). Anti-Humeans say `L` *cannot* change – only `C` or `ε` can. `L` is *invariant* to changes in `D`. This maps to `L` being a **fixed model class generator**, not an output.

  ### Residue Report
  1.  **Clean Mappings:**
      *   **Humean Mosaic ↔ Complete Dataset:** Direct.
      *   **Humean Simplicity/Strength ↔ Regularization/Model Selection (Spirit):** The trade-off logic is analogous, though the cosmic scale changes the epistemology.
      *   **Humean Laws as Model Output ↔ Fitted Model `M*`:** Direct.
      *   **Anti-Humean Invariance ↔ Invariance-under-Intervention:** A *necessary consequence* of governing `L`, not the governing itself, but cleanly maps to the *empirical criterion* you use.
      *   **Mosaic Instability ↔ Model Sensitivity to Distant Data:** Highlights the *consequence* of lacking a fixed `L`.

  2.  **Distorted Mappings (Significant Fudging):**
      *   **Anti-Humean Necessitation:** Attempting to map it to "`L` is the True Model / Data-Generating Process" **fudges**. This captures `L`'s *causal/explanatory role* in statistics but *not* the metaphysical "must" or "productive power". Estimation assumes a DGP exists; anti-Humeanism makes a specific *ontological claim* about its nature (`L` as a universal-relation).
      *   **Anti-Humean Governing:** Mapping to "`L` has maximal invariance" or "`L` is the minimal sufficient causal structure" **fudges**. It captures *what a governing `L` would **do*** (constrain, be invariant) but *not what it **is*** (a relation between universals with modal force). Governing implies the invariance, but invariance doesn't imply governing in the anti-Humean sense.
      *   **Laws as Relations Between Universals:** Mapping to "`L` defines the fundamental state-space/dynamics" **fudges**. It captures structural constraints but ignores the specific *metaphysical category* (universals vs. particulars) central to anti-Humeanism.

  3.  **No Expression in Estimation Vocabulary:**
      *   **Necessitation's Ontological "Must":** The idea that `L` *physically compels* the mosaic to be as it is. Estimation deals with *patterns* and *predictions*, not metaphysical compulsion.
      *   **Universals as Distinct Entities:** The anti-Humean claim that laws involve non-particular universals. Estimation deals with mathematical objects (models, parameters) describing particular data.
      *   **Governing as Causal Primacy:** The notion that `L` is *ontologically prior* and *active*, while the mosaic is *posterior* and *passive*. Estimation is inherently descriptive/predictive relative to data.

  ### Testing Your Hypothesis: Governing = Invariance-under-Intervention?
  *   **It's a Partial Capture, Bait-and-Switch on Necessitation:** You've identified the *key operational signature* anti-Humeans point to (and what you care about in engineering!). If a parameter/model is invariant under relevant interventions, it *acts like* a governing law for practical purposes (prediction, control). This is empirically verifiable and crucial.
  *   **But it swaps Metaphysics for Methodology:** Anti-Humeans argue invariance *stems from* a deeper necessitating relation `L`. You're saying invariance *defines* what counts as a "law" *for us*. Your `invariance-under-intervention` is a *property of a fitted model relative to tests*, not the ontological ground. Their `necessitation` is the purported *reason why* invariance holds.
  *   **The Residue is the "Why":** *Why* does this specific structure (e.g., Newton's 2nd Law) remain invariant under interventions, while others (e.g., a polynomial fit) don't? Your answer: "It's the best causal model we found." The anti-Humean answer: "Because it corresponds to a real relation between mass, force, and acceleration universals that *produces* the invariance." The latter claim has no estimation-theoretic counterpart – it's an ontological leap justified by the invariance's robustness, not derived from it.

  **Conclusion:** Your vocabulary perfectly captures Humeanism as a global model selection task and anti-Humeanism's *empirical consequences* (invariance). The irreducible residue is the anti-Humean *ontological commitment* to laws (`L`) as necessary, governing relations between universals *prior to* and *productive of* the data. This "governing" isn't just invariance; it's the metaphysical foundation anti-Humeans propose *to explain why* such profound invariance exists. Your framework brilliantly handles *how we know* but remains agnostic (and inexpressive) about *what is* in their specific metaphysical terms. The bait-and-switch trades their metaphysical "why" for your methodological "how".
