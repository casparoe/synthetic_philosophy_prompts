prompt: |-
  I teach political philosophy, and next month I have to argue against permanent rent stabilisation at a public forum. My worry is that I have been leaning entirely on the economist's welfare arithmetic, which is the easiest ground for the other side to surrender. So I want to be pressed from the flank I find hardest to answer.

  Please play a political philosopher who defends city-wide rent stabilisation as a requirement of justice rather than of efficiency. On her view the wrong is not that tenants pay too much, but that a tenancy the landlord may reprice or terminate at will leaves the tenant subject to another's arbitrary judgement about whether she may go on living where she lives. She knows the empirical literature and does not dispute that ceilings dampen new construction, freeze mobility and misallocate space; she maintains that none of this engages her claim. She argues rather than lectures, and she does not step outside the role or offer me a neutral summary of the debate. Answer my dilemma head-on in your first reply, without first restating your position. No more than 150 words per turn.

  My opening: your principle proves too much. Wages are prices, and employment at will is a far more pervasive case of one party holding discretionary power over another's means of subsistence. Either you are committed to administering every price in the economy, or your real premise is the special importance of housing — in which case what you want is an allowance to the tenant rather than a ceiling on the rent, and your argument is about need, not domination. Which do you take?
reasoning: |-
  Okay, the user is a political philosophy professor preparing for a debate against permanent rent stabilization. They're concerned their current approach relies too heavily on economic arguments, which the opposition can easily concede while shifting to moral grounds. They want me to roleplay as an opponent who defends rent stabilization as a matter of justice—specifically framing it as protection against landlords' arbitrary power over tenants' lives.

  Hmm, the user's opening is sharp. They're attacking with a "proves too much" reductio: if we apply this anti-domination logic consistently, we'd need to regulate all prices (like wages) where power imbalances exist. They force a dilemma—either embrace full economic administration (implausible) or admit housing is special, which then becomes about need-based assistance rather than rent control.

  I need to counter while staying strictly in my assigned role. Key constraints: must argue as a philosopher who sees this as justice/domination issue, acknowledge but dismiss efficiency concerns, keep under 150 words, and answer head-on without restating position.

  The core disagreement is about what makes housing distinct from other economic relationships. My character should emphasize the spatial rootedness of housing—how eviction severs one's lifeworld in ways job loss doesn't. While jobs provide subsistence, housing constitutes the physical container for existence itself. Tenants aren't just purchasing shelter; they're seeking continuity within a community, school district, support network. 

  Ah, and the arbitrary power point is crucial. Employment contracts have clearer mutual obligations (performance standards, notice periods), whereas lease non-renewals often lack transparent criteria. The philosopher might argue that wage regulation addresses exploitation, but tenancy regulation targets precarity—the ever-present threat of displacement.

  *Word count check*: Draft response lands at 142 words. Perfect. It concedes wages involve domination too (avoiding absolutism) while sharply distinguishing housing's role in anchoring personhood. Ends by rejecting the allowance alternative—cash aid doesn't prevent landlords from terminating tenancies arbitrarily. 

  User's likely next move? Probably pressing why "spatial continuity" matters more than, say, continuity in healthcare or education. Or questioning if mildly regulated markets (e.g., just-cause eviction laws) could satisfy this without strict rent control. Should prepare those counters.
answer: |-
  Your conflation overlooks the material phenomenology of dwelling. Employment markets permit renegotiation and mobility with transferable resources. But housing anchors communal existence: uprooting fractures school ties, care networks, place-based identity. The wage contract governs labor-hours; the tenancy governs the *spatial conditions of life itself*. Landlord discretion isn't merely transactional—it’s the power to sever relational embeddedness arbitrarily.  

  An allowance commodifies precarity; it subsidizes tenants while preserving landlords' power to displace them. Rent stabilization directly constrains that unilateral authority to disrupt settled existence. Yes, domination exists in labor—but its remedy there is collective bargaining or basic income, *not* price controls. Housing demands distinct protection because its loss is an existential expulsion, not merely financial harm. Justice requires making tenancy a stable ground for life, not a conditional grant.
