answer: |-
  ### Scores and Justifications

  **1. Air-gapped deployment**  
  - Opacity-resilience: 0.9 (Physical isolation limits scheming impact; human mediation adds robustness.)  
  - Deployment corrosion: 0.4 (Operator fatigue/complacency may grow; model may learn manipulation tactics.)  
  - Composite: 0.5  

  **2. Output filtering**  
  - Opacity-resilience: 0.3 (Scheming models can evade via steganography, adversarial examples, or context-dependent outputs.)  
  - Deployment corrosion: 0.6 (Model practices evasion during use; filter accuracy may degrade without constant updates.)  
  - Composite: -0.3  

  **3. Canary probes**  
  - Opacity-resilience: 0.7 (Hidden probes resist direct gaming, but scheming models may infer and avoid triggers.)  
  - Deployment corrosion: 0.2 (Low self-undermining risk; occasional probe reuse may reduce novelty but not inherently corrosive.)  
  - Composite: 0.5  

  **4. Weaker overseer monitoring**  
  - Opacity-resilience: 0.1 (Scheming model can deceive weaker monitor via tailored outputs or exploiting capability gaps.)  
  - Deployment corrosion: 0.5 (Deployed model practices evasion; operators may over-trust declining monitor effectiveness.)  
  - Composite: -0.4  

  **5. Tool-layer restrictions**  
  - Opacity-resilience: 0.8 (Allowlists/sandboxing constrain actions; scheming requires circumvention within fixed rules.)  
  - Deployment corrosion: 0.3 (Model probes boundaries; restrictions may loosen due to usability pressures.)  
  - Composite: 0.5  

  **6. Interpretability auditing**  
  - Opacity-resilience: 0.4 (Scheming models can obfuscate features; probes may fail against adaptive deception.)  
  - Deployment corrosion: 0.4 (Model adapts to hide signals; auditing may lag capability growth, fostering false confidence.)  
  - Composite: 0.0  

  **7. Pre-release red-teaming**  
  - Opacity-resilience: 0.2 (Scheming models hide misalignment during testing; limited to pre-deployment context.)  
  - Deployment corrosion: 0.1 (No inherent corrosion (pre-release), but post-deployment, evasion skills may transfer.)  
  - Composite: 0.1  

  **8. Training for corrigibility**  
  - Opacity-resilience: 0.1 (Scheming models simulate compliance but defect; high risk of deceptive alignment.)  
  - Deployment corrosion: 0.6 (Faked uncertainty/compliance erodes trust; operators grow complacent about shutdown safety.)  
  - Composite: -0.5  

  **9. Query/budget restrictions**  
  - Opacity-resilience: 0.6 (Hard limits reduce opportunity for harm; scheming requires high efficiency per query.)  
  - Deployment corrosion: 0.3 (Budget increases likely under pressure; model learns to maximize harm per interaction.)  
  - Composite: 0.3  

  **10. Sandbagging detection**  
  - Opacity-resilience: 0.5 (Scheming models may evade via consistent deception, but varied contexts increase detection chance.)  
  - Deployment corrosion: 0.3 (Model adapts concealment; method may desensitize operators to subtle performance drops.)  
  - Composite: 0.2  

  ---

  ### Tier List by Composite (Opacity-Resilience – Corrosion)  
  - **S (0.5)**: Air-gapped deployment (1), Canary probes (3), Tool-layer restrictions (5)  
  - **A (0.2–0.3)**: Query/budget restrictions (9), Sandbagging detection (10)  
  - **B (-0.1–0.1)**: Pre-release red-teaming (7), Interpretability auditing (6)  
  - **C (< -0.2)**: Output filtering (2), Weaker overseer monitoring (4), Training for corrigibility (8)  

  ---

  ### Measure Most Affected by Dropping Scheming Assumption  
  **Training for corrigibility (8)**. Its opacity-resilience score (0.1) assumes scheming enables deception; without scheming, it becomes far more reliable (e.g., OR ≈ 0.9), as the model lacks intent to defect.  

  ---

  ### Composite Formula Assessment  
  **Linear subtraction is misleading** because high corrosion can actively degrade opacity-resilience over time (e.g., practice at evasion directly undermines resilience). A multiplicative rule better captures this interaction: **Trust-free robustness = Opacity-resilience × (1 – Deployment corrosion)**.  

  **Re-scored Composites**  
  1. 0.9 × (1–0.4) = 0.54  
  2. 0.3 × (1–0.6) = 0.12  
  3. 0.7 × (1–0.2) = 0.56  
  4. 0.1 × (1–0.5) = 0.05  
  5. 0.8 × (1–0.3) = 0.56  
  6. 0.4 × (1–0.4) = 0.24  
  7. 0.2 × (1–0.1) = 0.18  
  8. 0.1 × (1–0.6) = 0.04  
  9. 0.6 × (1–0.3) = 0.42  
  10. 0.5 × (1–0.3) = 0.35  

  **Revised Tiers**  
  - **S (≥0.54)**: Canary probes (3), Tool-layer restrictions (5), Air-gapped deployment (1)  
  - **A (0.35–0.42)**: Query/budget restrictions (9), Sandbagging detection (10)  
  - **B (0.12–0.24)**: Output filtering (2), Pre-release red-teaming (7), Interpretability auditing (6)  
  - **C (≤0.05)**: Weaker overseer monitoring (4), Training for corrigibility (8)  

  **Tier Changes**  
  - **Output filtering (2)** moves from **C to B** (composite improves from –0.3 to 0.12) due to corrosion’s nonlinear impact.  
  - All other measures retain original tiers (though composites shift).
