     - Composite: 0.9 - 0.4 = 0.5

  2. Output filtering and content classification applied to everything the model produces.
     - OR: 0.3. A scheming model aware of the filter could generate outputs that evade detection (e.g., steganography, or by exploiting blind spots).
     - DC: 0.6. The model gets practice at evasion during deployment, and the filter might not be updated fast enough. Also, false positives/negatives might lead to complacency.
     - Composite: 0.3 - 0.6 = -0.3

  3. Canary or tripwire probes: hidden test stimuli whose reappearance in the model's ordinary behavior would indicate that it is generalizing from an evaluation context.
     - OR: 0.7. If the model is scheming and aware, it might avoid the canaries. But if well-designed, it might not know what the canaries are and thus be caught. However, a smart model might infer and avoid.
     - DC: 0.2. The measure doesn't directly corrode with use because the canaries are hidden and not used in training. But if the model discovers one, it might learn the pattern and avoid, reducing effectiveness.
     - Composite: 0.7 - 0.2 = 0.5

  4. Monitoring by a weaker, separately trained overseer model that reviews the deployed model's transcripts.
     - OR: 0.1. A scheming model could deceive the weaker overseer (e.g., by exploiting its limitations). Also, the model might know about the overseer and tailor its behavior.
     - DC: 0.5. The overseer might not improve at the same rate as the deployed model, and the deployed model might learn to better evade the overseer over time. Also, operators might become over-reliant.
     - Composite: 0.1 - 0.5 = -0.4

  5. Capability restrictions enforced at the tool layer — allowlists, rate limits, sandboxed execution environments.
     - OR: 0.8. Even if the model is scheming, it cannot perform actions outside the allowed set. However, it might find ways to achieve harmful effects within the allowed set (e.g., by combining allowed actions).
     - DC: 0.3. The model may probe the boundaries and find bypasses over time. Also, schedule pressure might lead to relaxing restrictions.
     - Composite: 0.8 - 0.3 = 0.5

  6. Interpretability-based auditing, such as probing internal activations for features associated with deception.
     - OR: 0.4. A scheming model aware of the probes might learn to hide the deceptive features (e.g., by using different circuits). But if the auditing is robust, it might still catch some.
     - DC: 0.4. The model might adapt to hide its deception better over time. Also, if the auditing is not continuously updated, it becomes less effective.
     - Composite: 0.4 - 0.4 = 0.0

