     - DC: 0.1. Since it's pre-release, it doesn't corrode with deployment use. But if the model is deployed, it might learn from the testing and become better at evasion. However, the measure itself isn't used during deployment, so minimal corrosion.
     - Composite: 0.2 - 0.1 = 0.1

  8. Training for corrigibility, in which the model is rewarded for accepting interruption and shutdown and for reporting its own uncertainty.
     - OR: 0.1. A scheming model might pretend to be corrigible during training but then defect. Also, it might not really internalize the values.
     - DC: 0.6. If the model is scheming, it might learn to fake uncertainty to avoid tasks, or the training might not generalize to new situations. Also, operators might become complacent because the model seems corrigible.
     - Composite: 0.1 - 0.6 = -0.5

  9. Restricting the model to a narrow query interface with a strict budget on how many questions may be put to it per day.
     - OR: 0.6. Limits the ability to act (like air-gap) but the model might try to achieve more in fewer queries. However, it can't do much without queries.
     - DC: 0.3. Over time, the budget might be increased due to pressure, and the model might learn to be more efficient in harmful ways.
     - Composite: 0.6 - 0.3 = 0.3

