prompt: |-
  I am a staff software engineer at a mid-sized payments company, and for the last two years I have owned our incident postmortem process. After any production incident above a certain severity, a facilitator runs a review, writes it up, and the head of platform signs it off before it is published internally. We produce four to six of these a month; each costs two to three hours of senior engineering time; the readers are mostly engineers who were nowhere near the incident, and occasionally auditors and executives. I have no philosophy training beyond what I have picked up from arguing with colleagues.

  My team is split down the middle about what the document is for, and a colleague with a history degree tells me the split is an old argument in the philosophy of history about whether explaining a particular event means subsuming it under a general law or means telling a story that can be followed. Our reliability engineer's position: a postmortem explains an incident only if it delivers a general claim — conditions of this kind, in a system like ours, produce failures of that kind — which we could have used to anticipate this incident and can use to anticipate the next one; anything less is storytime. Our support lead's position: every general claim we have ever managed to write is either vacuous (communication broke down; the assumption was never tested; the change was not reversible) or a restatement of this one incident wearing a rule's clothing, and what actually changes how people behave is the ordered account — what each person knew when they acted, what looked reasonable from where they were standing, and how, once it had gone that far, it could only have gone that way. He says a good general claim is something you read off the story afterwards, never something you start with.

  Both are describing real failure modes in what we produce. As evidence: across our last fifty postmortems, the "general lesson" field contains one of about six sentences some forty times over.

  I would like a decision procedure I can put into the template and that a facilitator with no philosophical training can run against a draft in about an hour. Specifically:

  1. The questions to ask of a draft, in order, and what counts as a sufficient answer to each.
  2. A test for whether a proposed general claim is genuinely general rather than a description of this incident with the serial numbers filed off. I gather the relevant notion has something to do with whether the claim supports counterfactuals and travels to cases we have not seen, but that is not something a facilitator can apply as stated. Please make it operational: what to ask, which answers fail, and what to do about a claim that holds for our systems but not for anyone else's.
  3. A test for whether a stretch of narrative is doing explanatory work or only filling pages — and the converse check, on whether our story format has already settled what counted as a cause before anyone argues about it.
  4. Where the procedure should stop with "there is no general claim here, and that is the correct answer", and where it must hand the decision to a person because the question is one of values (what we owe the named individuals, what we show auditors) rather than of fact.
  5. Which steps are judgement calls dressed up as procedure. I would rather see those flagged than smoothed over.

  Please also say plainly where the comparison with explaining the past breaks down for us: outages recur, we can run experiments, our records are machine logs rather than testimony, and we have a commercial interest in the lesson being cheap. If those differences change what the procedure ought to require, say how.

  Then run the procedure on three incidents.

  Case A: an outage after a configuration change that was correct in isolation but drove a retry storm into a downstream service with no idempotency guarantees.

  Case B: a trivial technical fault — a certificate expired on an internal endpoint — that became a four-hour incident because the on-call engineer saw the alert, recognised it as one that had fired falsely three times that month, and did not escalate for two hours. Every general claim we write for this one turns out to be about alert quality or about trust, and neither seems to be about this incident.

  Case C: a two-hour outage caused by undocumented behaviour in a third-party vendor's API, which the vendor has since changed and will not confirm in writing. My instinct, and my CTO's, is that we must publish a general lesson about vendor dependencies. Tell me if the procedure instead says the honest output is a narrative and no law; if it does, give me the argument I can make in the review meeting.

  I want a verdict rather than a balanced summary: close by saying which of my two colleagues is closer to right about what the document is for, or what the correct synthesis is, and let the procedure reflect that verdict instead of hedging between them.

  Please write the whole answer in British English. Name the positions and the thinkers where that genuinely helps me follow the reasoning, but do not give me a reading list, page references or quotations — I have no way to check any of them and will treat unverifiable specifics as noise. Around 1,800 words, with the procedure itself short enough to fit on one page.
reasoning: |-
  Okay, this is a dense and fascinating problem from a senior engineer wrestling with philosophical tensions in incident postmortems. Let me unpack the core dilemma first: they're stuck between two valid perspectives - the nomothetic (general laws) versus idiographic (unique narratives) approach to explanation, mirrored in their team's split. 

  The user's pain points are palpable: wasted senior time, cookie-cutter "lessons", and frustration that neither approach fully works. Their request for a practical decision procedure shows they're past theoretical debates - they need operational rigour. The three test cases are brilliantly chosen to stress-test any solution.

  Hmm... British English requirement means I'll need to mind spellings and idioms ("organisation" not "organization", "maths" not "math"). More importantly, the 1,800-word limit forces ruthless prioritisation - the procedure itself must fit one page, so the examples will need to be tight.

  Key constraints I'm weighing:
  - Facilitators aren't philosophers; tools must be concrete
  - Commercial reality: lessons must be cost-effective
  - Audit/compliance needs aren't negotiable
  - Their data shows current "generalisations" are theatrical (6 phrases recycled 40 times)

  Right, the solution must synthesise both views. The narrative isn't just "storytime" - it's where causation lives. But without generalisable insights, we're doomed to repeat mistakes. The breakthrough is realising that general claims emerge from comparative analysis, not single events. 

  For the procedure design:
  1. Will structure it as a flow: narrative validation → causal mapping → generalisation stress-test
  2. Counterfactual testing can be operationalised via "what-if" scenarios
  3. Narrative checks will target explanatory gaps - not just chronology
  4. Explicit off-ramps for when generalisation fails (Case C is textbook)
  5. Will flag all judgement calls with :warning: emojis per request

  The vendor case (C) is particularly telling - forcing a fake "vendor dependency" lesson would be intellectual dishonesty. Better to admit some incidents don't yield universal rules. That's the synthesis: narratives for understanding, generalisations only when they survive falsification attempts.

  Final verdict leans toward the support lead's view: causation is fundamentally narrative. But we salvage the reliability engineer's need for prediction by treating general claims as hypotheses derived from comparative incident analysis - not outputs from single postmortems.
answer: |-
  ## Incident Postmortem Decision Procedure (v1.0)

  **Core Principle:** A postmortem's primary purpose is to drive *actionable learning* that demonstrably reduces future risk. It achieves this by providing a sufficiently *causal explanation* of the incident. This requires both narrative (idiographic) understanding *and*, where possible, the extraction of testable, generalisable insights (nomothetic). The narrative is foundational; general claims must be rigorously stress-tested against it and reality.

  **Procedure: For Facilitator Review of Draft Postmortem (Approx. 60 mins)**

  1.  **Narrative Coherence & Completeness Check:**
      *   *Question:* "Does the narrative, read sequentially, clearly explain *how* the incident progressed from initial trigger to resolution, step-by-step? Does it explicitly state *what each relevant actor knew or believed* at key decision points and *why their actions seemed reasonable* to them at the time?"
      *   *Sufficient Answer:* Yes, if a reader unfamiliar with the incident can follow the sequence of events, understand the reasoning behind key actions/inactions (even if flawed), and see the causal links between steps without needing prior knowledge. Gaps in the timeline or unexplained actions/decisions are insufficient.
      *   *Fail:* Missing steps, unexplained actions ("Engineer X restarted the service"), unclear decision points, omission of environmental context (e.g., prior alerts, time pressure), failure to articulate actors' mental models.
      *   *Action:* Fill gaps. Interview participants. Ensure the story shows *why* things happened, not just *what* happened. It must make the incident seem inevitable *given the conditions and knowledge at the time*.

  2.  **Causal Factor Identification:**
      *   *Question:* "Based *only* on the verified narrative, what were the *necessary contributing factors* (technical, procedural, human, organisational) without which the incident would likely *not* have occurred or would have been significantly mitigated?"
      *   *Sufficient Answer:* A concise list of factors (2-5 usually) directly supported by evidence in the narrative. Factors should be specific enough to be actionable (e.g., "Lack of automated certificate expiry monitoring for internal endpoint Y" not "Bad monitoring"; "Assumption that Downstream Service Z handled retries idempotently was not validated during design" not "Bad assumption"). Root causes are often complex systems, not single points.
      *   *Fail:* Vague factors ("Human error", "Process failure"), factors not evidenced in the narrative, blaming individuals without systemic analysis, identifying symptoms instead of causes (e.g., "Service crashed").
      *   *Action:* Refine factors. Link each factor explicitly to specific points in the narrative evidence. Ensure systemic focus.

  3.  **General Claim Generation & Stress Test (If Attempted):**
      *   *Question A (Scope):* "Does the proposed general claim apply *beyond* the specific technologies, teams, or vendors involved in this incident? Could it plausibly apply to other parts of our system or similar systems elsewhere?"
      *   *Question B (Counterfactual Travel):* "Can we imagine a *different* scenario (past or future) involving *different* components or teams where this claim would *still* predict a potential failure mode? Conversely, can we imagine a scenario where the claimed conditions exist *but no failure occurs* (indicating the claim is insufficient)?" :warning: *(Judgement Call - Requires facilitator imagination based on system knowledge)*
      *   *Question C (Actionability):* "Does this claim directly suggest *concrete, testable actions* we can take (monitoring, design principle, process change, training)?"
      *   *Question D (Novelty Check):* "Is this claim substantively different from the generic phrases we overuse (e.g., 'improve communication', 'test assumptions')? Does it contain *specific*, non-incident-specific elements?"
      *   *Sufficient Answer:* Claims passing A, B (plausibly), C, and D.
      *   *Fail:*
          *   *Vacuous:* Too broad to be meaningful or actionable ("Improve resilience").
          *   *Incident-Restatement-in-Disguise:* Describes *only* this incident using slightly abstracted terms ("Changes to Service X config can overload Service Y if retries are high"). Fails Question B.
          *   *Non-Actionable:* Doesn't lead to clear preventative/mitigating actions.
          *   *Non-Traveling:* Only applicable to this exact vendor/tech/team. Fails Question A.
          *   *Generic:* Matches one of the overused phrases.
      *   *Action for Failed Claims:*
          *   *Vacuous/Generic:* Discard. Revisit Causal Factors. Can a *more specific* claim be derived? If not, *no general claim may be warranted*.
          *   *Incident-Restatement/Non-Traveling:* Accept it describes *this* incident well but label it clearly as a "Key Learning from *This* Incident" or "Specific Risk Identified" rather than a "General Lesson". Do *not* force it into the "General Lesson" box.
          *   *Non-Actionable:* Reframe to focus on the preventative/mitigating action implied by the causal factor.

  4.  **Narrative Explanatory Power Check:**
      *   *Question:* "Looking at the narrative, does *every* included detail contribute directly to explaining *how* or *why* the incident unfolded? Are there sections that are purely chronological detail or background that doesn't illuminate causes or decisions?"
      *   *Sufficient Answer:* The narrative is lean; every element supports understanding causation, context for decisions, or impact. Extraneous detail (e.g., full console output not showing an error, irrelevant team chit-chat) is removed.
      *   *Fail:* Lengthy technical logs without analysis, irrelevant background, blow-by-blow of non-critical steps, repetition.
      *   *Action:* Cut filler. Summarise non-causal technical details. Ensure narrative focuses on *explanatory* elements.

  5.  **Narrative Causal Bias Check:**
      *   *Question:* "Does the structure or inherent focus of our narrative template *predetermine* what is considered a 'cause'? (e.g., does it over-emphasise the 'root cause' event or the actions of the last person involved, while underplaying latent organisational conditions?)"
      *   *Sufficient Answer:* The narrative adequately captures contributing factors from all levels - technical trigger, procedural gaps, human factors (within context), and organisational/systemic conditions (e.g., pressure, resourcing, historical tech debt). :warning: *(Judgement Call - Requires facilitator awareness of systemic thinking)*
      *   *Fail:* Narrative solely focuses on the immediate technical fault or the on-call engineer's actions. Latent conditions (design decisions made months ago, chronic alert fatigue, training gaps) are missing or glossed over.
      *   *Action:* Explicitly revisit the Causal Factors (Step 2) and ensure the narrative provides evidence for *all* levels. Amend narrative to include relevant latent conditions.

  6.  **Stopping Rules & Hand-offs:**
      *   **Stop - No General Claim:** If, after rigorous application of Step 3, no valid, non-vacuous, actionable, traveling general claim emerges, **state clearly: "No broadly generalisable lesson was identified applicable beyond the specific context of this incident. Key specific learnings and actions are documented above."** This is the *correct* outcome for many incidents; forcing a fake "general lesson" is harmful. *(Case C is a prime candidate)*.
      *   **Hand-off - Values & Obligations:** The following require human judgement (e.g., Head of Platform, Legal, People Ops) and *cannot* be resolved by procedure:
          *   **Accountability/Naming:** Does naming specific individuals (even for systemic reasons) serve learning or create blame? What's the balance?
          *   **Auditor/Executive Messaging:** Does the draft accurately reflect severity and compliance status *for their needs*? Does it contain necessary legalese or omit sensitive details?
          *   **Action Triage/Resource Allocation:** Prioritising which fixes get implemented based on cost/benefit/risk is a business decision.
          *   **Tone & Blame:** Ensuring the language is blameless and focuses on systems/processes.

  **Where History's Lessons Break Down:**

  1.  **Recurrence & Experimentation:** Unlike unique historical events, outages *can* and *do* recur in similar forms. We *can* (and must) run experiments (tests, simulations, controlled changes) to *validate* our causal hypotheses and the effectiveness of fixes derived from general claims. History relies on interpretation; we can (partially) test ours.
  2.  **Records:** Our primary records are machine logs – objective but context-free. Testimony (human narrative) provides the crucial *why* behind actions, but is fallible. We must synthesise both. History often relies heavily on contested testimony.
  3.  **Commercial Interest:** We require *cost-effective* learning. Perfect understanding is unattainable; we need "good enough" to drive the most valuable risk reduction. History seeks understanding for its own sake; we seek it for prevention. This necessitates pragmatism – sometimes a specific fix is enough without a grand universal law.
  4.  **Predictive Aim:** While historians debate prediction, our *explicit goal* is to predict and prevent *future* failures. This demands we *attempt* generalisation where genuinely possible and testable.

  **Applying the Procedure:**

  **Case A: Retry Storm Configuration**
  1.  **Narrative:** Should detail the config change (correctness), the retry mechanism behaviour, the downstream service's non-idempotency, the load surge, and the failure cascade. Key: Why was this config change safe *in isolation* but dangerous *in combination*? Why wasn't the downstream limitation known/considered? Did monitoring miss the storm?
  2.  **Causal Factors:** (1) Unvalidated assumption about downstream idempotency handling during design/implementation. (2) Configuration change process lacked analysis of potential emergent interactions/cascading failures. (3) Monitoring lacked granularity to detect retry storms early.
  3.  **General Claim Attempt:** "Modifying retry behaviour or upstream load *without verifying* the idempotency and surge capacity of downstream services *can* cause cascading failures."
      *   *Stress Test:*
          *   *Scope (A):* Yes (applies to any service interaction).
          *   *Counterfactual (B):* Yes (e.g., increasing cache TTL causing thundering herd on DB; changing batch size overloading a queue consumer). Could conditions exist without failure? Yes (if downstream is robust).
          *   *Actionability (C):* Yes (Add checks to change process: "Verify downstream idempotency/surge capacity?"; Implement retry storm detection).
          *   *Novelty (D):* Yes (Specific about *verification* need related to *interactions*).
      *   **Verdict:** **VALID** general claim. Publish it.

  **Case B: Ignored Expired Cert Alert**
  1.  **Narrative:** Must detail the prior false alerts (dates, reasons if known), the engineer's experience and reasoning ("This alert cried wolf 3 times; I assumed it was false again"), the escalation process, and the timeline showing the 2-hour delay. Key: Why *specifically* did the engineer dismiss it? Was the alert truly ambiguous? Was there pressure not to escalate?
  2.  **Causal Factors:** (1) Chronic low reliability (false positives) of specific certificate expiry alerts leading to alert fatigue and loss of trust. (2) Lack of clear escalation path or criteria for "suspect" alerts when trust is low. (3) Underlying issue: Why were false positives occurring?
  3.  **General Claim Attempts:**
      *   *"Improve alert quality":* Fails C (Not concrete/testable - *how*? Which alerts?) and D (Generic).
      *   *"Ensure alerts are trustworthy":* Fails A (Vague - what does "trustworthy" mean? How measured?), C (Not concrete), D (Generic).
      *   *Derived Claim:* "Alerts with a high false positive rate **will** be ignored during incidents, regardless of severity." (Too absolute? Fails B - maybe a critical enough alert gets attention despite FP history? Judgement call: Needs softening).
      *   *Better/Specific Claim:* "Chronic false positives **significantly degrade** trust in an alert channel, **increasing the risk** of critical alerts being ignored. Alert definitions **must** be regularly tuned to minimise false positives, and processes **must** exist for handling alerts when trust is low."
          *   *Stress Test:*
              *   *Scope (A):* Yes (Applies to all monitoring).
              *   *Counterfactual (B):* Yes (e.g., noisy disk space alert ignored before outage; flapping network alert ignored during genuine drop). Could trust be low without ignoring a critical alert? Yes (if escalation path is used).
              *   *Actionability (C):* Yes (Audit alert FP rates; Implement alert tuning process; Define "suspect alert" escalation path).
              *   *Novelty (D):* Yes (Links FP rate directly to trust and risk; mandates tuning/process).
      *   **Verdict:** The "Better/Specific Claim" is **VALID**. Publish it. Avoid the vacuous versions. The narrative *must* explain the specific history of *this* alert to justify the focus.

  **Case C: Undocumented Vendor API Behaviour**
  1.  **Narrative:** Details the API call made, the expected vs. actual (undocumented) behaviour, the vendor's response (changed behaviour, no documentation/confirmation), and the impact. Key: How was the behaviour discovered? Why was it undocumented? Were there previous hints?
  2.  **Causal Factors:** (1) Critical system behaviour dependent on undocumented (and mutable) third-party API characteristics. (2) Lack of contractual guarantee or effective means to discover/validate expected behaviour beyond basic documentation. (3) Insufficient resilience/isolation within our system against unexpected upstream behaviour.
  3.  **General Claim Attempt:** "Vendor dependencies carry risks from undocumented behaviour."
      *   *Stress Test:*
          *   *Scope (A):* Broad, yes.
          *   *Counterfactual (B):* Fails. What *specific* risk does it predict? What *type* of behaviour? "Undocumented behaviour" is too vague to travel meaningfully or suggest specific actions beyond the trivially obvious ("Be aware vendors exist"). It doesn't help anticipate the *next* specific vendor issue. Fails B and C.
      *   **Verdict:** **NO VALID GENERAL CLAIM.** The honest output is:
      *   **Specific Learning:** "Our integration with Vendor X's /endpointY exhibited critical dependency on undocumented behaviour (specific detail...), which the vendor changed without notice or documentation. Mitigations specific to Vendor X include [e.g., contractual push, sandbox testing if possible, specific workaround implemented]. *Generally*, this highlights the severe risk of undocumented vendor behaviour."
      *   **Actions:** Likely specific to Vendor X (contract negotiation, contingency plans) *and* internal resilience (circuit breakers, timeouts, sanity checks around this integration). A narrative explaining the trap the team was in (dependent on a black box) is key.

  **The Verdict: Synthesis**

  Your support lead is **more fundamentally correct**. Causation in complex socio-technical systems is inherently contextual and narrative. A coherent, evidence-based narrative explaining *how and why the incident happened, given the actors' knowledge and the system state*, is the indispensable core. It builds understanding and empathy, driving safer behaviour by revealing the traps inherent in the system.

  However, your reliability engineer is right that *predictive power* is crucial for prevention. **The synthesis is this:** Genuine, actionable general claims *emerge from* rigorous analysis *of the narrative*, but *only sometimes*. They are hypotheses derived inductively from specific events, *not* universal laws pre-existing the incident. They must be:

  1.  **Grounded** in the specific narrative evidence.
  2.  **Stressed-tested** for generality and actionability using the procedure.
  3.  **Treated as provisional** until validated by future experience or testing.

  Forcing a "general lesson" where none genuinely exists (Case C) is counterproductive, breeding cynicism and wasting time. A strong, honest narrative explaining a specific incident *is* valuable learning, even without a universal rule. The procedure reflects this by demanding narrative integrity first, and rigorously testing any general claim derived from it, with a clear "no general claim" as a valid, honest outcome. Focus resources on specific actions derived from the causal factors, whether they spawn a general rule or not.

  **Therefore, the document is for:** **Accurately explaining *this* incident to drive specific, actionable improvements, and *where rigorously justified*, extracting testable hypotheses to guard against *similar* future failures.** Narrative is the bedrock; general claims are valuable but elusive byproducts, not the primary goal.
