answer: |-
  ### Exam Question: Moral Obligation and Supererogation (20 marks, 75 minutes)  
  **Stem:**  
  Supererogatory acts are traditionally understood as morally good actions that go "beyond the call of duty"—they are optional, praiseworthy, and better than what is minimally required. However, a novel theory called the **ledger view** proposes a dynamic account of supererogation. According to this view:  
  - When you perform a genuinely supererogatory act (e.g., donating a kidney to a stranger), you earn **moral credit** specific to you (agent-relative).  
  - This credit functions like a "ledger balance" that lowers the stringency of your future moral obligations. For example, an act that would normally be supererogatory (like volunteering for a dangerous rescue) might become merely permissible—or even required—based on your current credit balance.  
  - Credit is "spendable": It reduces duties in future situations but expires after a fixed period (e.g., one year) to prevent lifelong moral exemptions.  

  **Consequences of the ledger view:**  
  1. **Agent-relativity**: Credit is tied to your personal history. If Al donates a kidney, Al (not the recipient) gains credit.  
  2. **Changing act-status**: An act’s moral category (supererogatory/permissible/required) depends on your credit. A high balance might make saving a drowning child merely permissible for you, whereas someone with low credit must do it.  
  3. **Expiration**: Credit depletes over time, so you cannot hoard it indefinitely.  

  **Your Task:**  
  Critically evaluate whether the ledger view can coherently accommodate the traditional analysis of supererogation (optional, good, praiseworthy, beyond duty). Focus on **at least two** of the following challenges:  
  - **(a) The self-service worry**: Does letting credit lower obligations allow you to "pre-purchase" permission to ignore duties (e.g., donate blood today to walk past a drowning stranger tomorrow)? Is this distinct from the bootstrapping problem (where you create duties via acts)?  
  - **(b) Scalar duties**: Must the ledger view treat duties as scalar (graded) rather than binary (required/not) to make credit "commensurable" with obligations? If so, does this abandon the idea of a clear boundary for "beyond duty"?  
  - **(c) Indexing to balance**: If kidney donation is supererogatory only for agents with high credit (and required for others), can we still call it "supererogatory" in general? Is this relativism a flaw or strength?  
  - **(d) The response objection**: Praise for supererogation acknowledges moral value. Does converting value into "spendable credit" distort praise into a transactional system?  
  - **(e) Agent-centered prerogatives**: Scheffler’s prerogative permits suboptimal acts but denies they are supererogatory (calling them merely "permissible-not-best"). Does the ledger view avoid this limitation?  

  **Guidelines:**  
  - Define key terms. Engage objections and replies.  
  - Avoid: (1) Using Heyd’s paradox as a knockdown argument without addressing the reply that "good-making features need not generate duties"; (2) Claiming the view is "circular" without specifying how (e.g., "credit defines duty, but duty defines credit?").  
  - No marks for name-dropping or generic claims about supererogation’s importance.  

  ---  
  ### Model Answer (698 words)  
  The ledger view innovatively links supererogation to ongoing moral agency by treating acts like kidney donation as credit-generating, dynamically altering future duties. While it captures intuitions about moral "slack" for the virtuous, I argue it conflicts with core features of supererogation—particularly its optionality and praiseworthiness—by introducing problematic endogeneity and relativism. I focus on the self-service worry (a) and indexing (c) to show this.  

  **The Self-Service Worry Undermines Duty’s Authority**  
  The ledger view allows agents to "spend" credit to reduce obligations, risking *self-service*: pre-paying for future moral failures. For instance, volunteering at a shelter today might license ignoring a drowning child tomorrow if one’s credit balance is high. This resembles *bootstrapping* (where acts create duties), but is distinct: bootstrapping binds agents to *new* duties (e.g., a promise), whereas self-service *erodes* existing duties (e.g., the duty to aid). The worry is that duties become *endogenous*—determined by the agent’s choices rather than external moral facts. A defender might reply that credit only lessens non-absolute duties (e.g., not murdering remains binding) and expiration limits abuse. However, this fails if even reduced obligations permit wrongful acts: allowing a stranger to drown is still wrong, yet the ledger view might reclassify it as "permissible" via credit. This collapses the distinction between supererogation and permission, violating the traditional mark that supererogation is *better than duty requires*. If duties are pliable, "beyond duty" loses meaning.  

  **Indexing to Credit Balance Relativizes Supererogation**  
  The ledger view implies that kidney donation shifts from supererogatory to *required* for agents with low credit (e.g., a selfish person). While this might seem intuitive—the selfish *owe* more—it destroys the general claim that "kidney donation is supererogatory." Supererogation becomes agent-relative: an act is only "beyond duty" relative to one’s ledger. Proponents could argue this is a *strength*, reflecting that obligations depend on context, including past actions. Yet this relativism clashes with standard analyses, where supererogation is defined by objective features (e.g., high cost/benefit ratios). If an act’s status hinges on personal history, we cannot categorically state that donating kidneys is supererogatory—it might be obligatory for many. This also weakens praiseworthiness: if a low-credit agent "must" donate, praising them feels odd (praise typically rewards going beyond). The ledger view thus blurs duty and supererogation, making the latter contingent on arbitrary balances.  

  **Scalar Duties and the Response Objection**  
  Though not my focus, two other challenges highlight tensions. First, (b) the ledger view likely requires *scalar duties* to quantify how much credit "lowers" an obligation (e.g., 10 credit units reduce rescue-duty stringency by 20%). But if duties are scalar, the binary "beyond duty" boundary vanishes—supererogation becomes a matter of degree, conflicting with its traditional "off-the-shelf" reading. Second, (d) the *response objection* holds that praise celebrates intrinsic value, not currency. Converting value into spendable credit reduces praise to bookkeeping, undermining its expressive role. If donating blood earns "credit points," we praise to invest, not admire—a distortion.  

  **Conclusion**  
  The ledger view’s strength is explaining how past generosity affects future obligations, but it falters by making duty endogenous (inviting self-service) and supererogation relativistic (via indexing). While it avoids Scheffler’s (e) limitation—by generating praiseworthy acts, not just permissible ones—it does so at the cost of reducing morality to a ledger. Without resolving self-service and indexing, it cannot preserve supererogation’s core as both optional and robustly praiseworthy.  

  ---  
  ### Marking Scheme (20 marks total)  
  **Must-Hit Points**  
  1. **Core mechanics explained** (4 marks):  
     - Describe agent-relative credit, spending, expiration, and act-status changes.  
     - *Common mistake*: Vague restatement (e.g., "credit lowers duties" without explaining how balance affects act-types).  
     - *Load-bearing*: Essential for engagement.  

  2. **Analysis of two issues (a-e)** (10 marks, 5 per issue):  
     - For each, state the challenge, object, and reply (e.g., for (a): Self-service worry → bootstrapping distinction → expiration/absoluteness reply → counter-reply).  
     - *Common mistake*: Merally describing the issue without evaluating objections/replies.  
     - *Load-bearing*: Primary source of marks; A answers excel here.  

  3. **Avoid cheap moves** (3 marks):  
     - -1 if Heyd’s paradox is cited as a knockdown without engaging the reply ("good-making features ≠ duty-generating").  
     - -1 if "circularity" is alleged without direction (e.g., "duty defines credit, but credit defines duty").  
     - -1 if both occur.  
     - *Bonus*: Not core, but penalizes superficiality.  

  4. **Clarity and definitions** (2 marks):  
     - Clear definitions of supererogation, ledger view, and chosen issues.  
     - *Common mistake*: Assuming terms are self-evident.  
     - *Bonus*: Rewards precision.  

  5. **Synthesis** (1 mark):  
     - Connects issues (e.g., "self-service and indexing both make duties endogenous") or offers a resolution.  
     - *Common mistake*: List-like structure without integration.  
     - *Bonus*: For depth.  

  **Grading Instructions:**  
  - **Start at 0**. Apply points 1–5 sequentially.  
  - **A (17–20)**: Hits point 2 (10 marks) with strong objections/replies for two issues, plus 3–4 in point 1, and bonuses (points 3–5).  
  - **B (13–16)**: Explains mechanics (point 1: 3–4) and addresses two issues but with weak objections/replies (point 2: 6–8). May miss bonuses.  
  - **C (9–12)**: Superficial on issues (point 2: 4–6) or addresses only one.  
  - **D (5–8)**: Ignores ledger mechanics or focuses on generic supererogation.  
  - **F (0–4)**: Off-topic or severely deficient.  

  **Operational Notes:**  
  - **Point 2 is key**: Award 5 per issue only for *critical analysis* (objection + reply + evaluation). Deduct for summaries.  
  - **Point 3**: Apply penalties *after* scoring points 1–2.  
  - **Point 4/5**: Award only if earned; do not exceed caps.  
  - **Spend ≤2 minutes per script** by focusing on: (1) Did they explain the view? (2) Did they deeply analyze two issues? (3) Did they avoid cheap moves?  

  ---  
  \answer{Analysis depth on two issues with objections and replies}
