  Let's construct each part:

  ### Exam Question Stem:

  **Question:** (20 marks, 75 minutes)

  Consider the following view, which we'll call the "ledger view" of supererogation. According to this view, when an agent performs a genuinely supererogatory act, they acquire a stock of moral credit. This credit is specific to the agent (agent-relative) and can be "spent" to lower the agent's obligations in the future. Specifically, the ledger view holds that:

  1. **Credit Accumulation**: Performing a supererogatory act adds to one's moral credit balance.
  2. **Credit Spending**: This credit can reduce the stringency of one's duties in future situations, potentially changing an act that would have been supererogatory (if done with no credit) to merely permissible or even required (if one has a low or negative balance).
  3. **Agent-Relativity**: The credit belongs to the agent who performed the supererogatory act and cannot be transferred to others. For example, if Al donates a kidney to Bea, Al (not Bea) gains the credit.
  4. **Expiration**: The credit expires after a certain period (e.g., one year) to prevent an agent from accumulating a lifetime exemption from moral requirements.

  Consequences of this view include:
  - The moral status of an act (whether it is required, supererogatory, or merely permissible) can change depending on the agent's current credit balance.
  - An agent with a high credit balance may have fewer duties, meaning that an act that would be supererogatory for someone else might be merely permissible for them, or even required if their balance is low.

  **Your task:** Evaluate the ledger view in light of the standard analysis of supererogation (an act that is optional, good, praiseworthy, and beyond the call of duty). In particular, address at least two of the following issues:

  a) The "self-service" worry: Does allowing credit to lower future obligations mean that one can "pre-purchase" permission to ignore a duty (e.g., by doing a supererogatory act now to later avoid saving a drowning stranger)? Is this worry just a restatement of the bootstrapping problem (where one creates a duty for oneself by an act) or is it distinct?

  b) The scalar account problem: Does the ledger view require that duties be scalar (i.e., come in degrees) rather than binary (required or not)? If so, does this mean the view must give up the common understanding of "beyond the call of duty" as a clear boundary?

  c) The indexing problem: If the supererogatory status of an act (like kidney donation) depends on the agent's credit balance, what happens to the general claim that "kidney donation is supererogatory"? Is it a problem that the same act might be supererogatory for one person but required for another (with a low balance)? Or is this a strength of the view?

  d) The response objection: The practice of praising supererogatory acts is meant to acknowledge their moral value. But if the value is converted into spendable credit, does this change the purpose of praise? Does it reduce moral praise to a currency system?

  e) The agent-centered prerogative: Samuel Scheffler’s agent-centered prerogative allows an agent to give some weight to their own interests without being required to maximize the good. However, Scheffler himself argues that this does not yield supererogation but only acts that are permissible but not optimal. How does the ledger view compare? Does it succeed where Scheffler’s fails?

  In your essay, be sure to:
  - Define key terms as needed.
  - Consider objections and replies.
  - Avoid merely reciting the four marks of supererogation without applying them to the ledger view.
  - Note: Do not spend time on Heyd's paradox without also considering the reply that the good-making features of an act need not generate duties. Similarly, avoid vague claims of circularity without specifying the nature of the circularity.

  ---

  ### Model Answer (Approx 700 words):

  **Introduction:** The ledger view proposes a novel account of supererogation by introducing the concept of moral credit that an agent accumulates through supererogatory acts and spends to reduce future obligations. This view challenges the standard analysis (optional, good, praiseworthy, beyond duty) by making the status of acts dynamic and agent-relative. I will argue that while the ledger view offers a promising way to account for the ongoing effects of supererogation, it faces serious challenges, particularly from the self-service worry and the indexing problem.

  **The Self-Service Worry:** The ledger view allows that an agent can perform a supererogatory act (e.g., volunteering at a homeless shelter) to build up credit, which they then spend to avoid a future duty (e.g., walking past a drowning stranger). This seems to permit "moral self-service": using a good act to buy permission for a wrong. One might object that this is just the bootstrapping problem (where one creates a duty by an act) in a new form. However, the ledger view might reply that credit only reduces the stringency of duties that are not absolute (e.g., not to murder) and that the system is designed to expire, preventing total exemption. Yet, the worry remains: if duties are endogenous (i.e., determined by the agent's own actions), then morality becomes a system where one can trade good deeds for future bad ones. This undermines the idea that duties are externally imposed by moral facts.

  **The Indexing Problem:** The ledger view implies that the same act (like kidney donation) might be supererogatory for one agent (with a high credit balance) but required for another (with a low balance). This challenges the general claim that "kidney donation is supererogatory." Is this a bug? The view might defend this as a feature: it captures the intuition that a saint who has already given much might not be required to give more, while a selfish person might be obligated to donate. However, this relativizes supererogation to the agent's history, making it impossible to say of any act type that it is inherently supererogatory. This might be too radical a departure from common moral discourse.

  **Scalar Duties?** The ledger view seems to require duties to be scalar (i.e., having degrees of stringency) because credit must be commensurable with the "cost" of duties. For instance, a small good deed might buy a little slack, while a big one buys more. But if duties are scalar, then the boundary between duty and supererogation becomes fuzzy. This might force the ledger view to abandon the binary "beyond the call" in favor of a threshold view. However, the standard analysis relies on a clear boundary. Thus, the ledger view may only be available to those who already accept scalar duties.

  **Response Objection and Scheffler:** The response objection notes that praise for supererogatory acts is meant to recognize their value, not to grant spendable credit. Converting praise into currency might distort the practice. Additionally, Scheffler's agent-centered prerogative allows agents to favor their own interests but does not produce supererogation because it only makes suboptimal acts permissible, not praiseworthy. The ledger view, by contrast, does generate praiseworthiness for supererogatory acts, but at the cost of turning praise into a transactional system. This might be a point against it.

  **Conclusion:** The ledger view innovatively links past supererogation to future obligations but at the cost of making duties endogenous and relative. While it avoids some problems (like the static nature of standard supererogation), its handling of the self-service worry and indexing remains problematic. Without a solution to these, the ledger view may not be viable.

  (Word count: ~650; we can adjust to hit 700 if needed.)

