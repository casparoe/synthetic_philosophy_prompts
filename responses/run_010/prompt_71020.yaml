  First, I need to dissect each step of their argument. The user wants to know which step to give up and the cost of doing so. They prefer keeping step (3) about the defendants not relying on existing laws. Also, they mentioned two loose ends: the novelty of the aggression charge and the Dönitz submarine warfare example.

  Hmm, the core issue is that their argument equates non-reliance with forfeiting notice rights, which then applies broadly to anyone not relying on law, like heads of state or traders. This undermines the principle of legality itself. The user needs to modify their premise to avoid this overextension.

  Looking at step (1): They assume the only issue with retroactivity is fair notice. But legality has deeper purposes—preventing arbitrary power, ensuring predictability, and separating powers. Fair notice is part of it, but not the whole story. If I challenge step (1), the user might retain their core argument while avoiding the overextension. Step (3) can stay since the defendants' disregard of law is factual. Without step (1), the argument doesn't extend to other cases like traders because the principle of legality still protects them regardless of reliance.

  The user’s loose ends: The novelty of the aggression charge—they’re right that interwar treaties lacked individual penalties. But the prosecution argued that these treaties, along with Kellogg-Briand, established aggression as a crime, even without specified penalties. The tribunals saw individual responsibility as inherent. The dissent in Tokyo on this point shows the controversy, but the majority held otherwise. For Dönitz, the admiral's affidavit showed that the conduct was common practice, which relates to the principle of legality—punishing someone for acts others aren’t prosecuted for undermines fairness. This ties into the deeper purpose of legality: restraining state power and ensuring equal application.

  So, advising the user to reject step (1) allows keeping step (3) and the argument about these specific defendants. The cost is conceding that fair notice isn’t the sole rationale, but that’s actually stronger philosophically. It aligns with thinkers like Fuller and Hart who emphasize legality’s role in governance. The victors’ justice critique is mitigated by showing the tribunals addressed broader principles, not just selective punishment.

  The user’s deeper need might be to defend the tribunals robustly while acknowledging criticisms. They want a principled stance that doesn’t collapse into victors’ justice. By refining the rationale for legality, their argument becomes more nuanced and resilient. They also need to address the historical specifics they mentioned, showing awareness of the complexities without undermining their position.

  In conclusion, rejecting step (1) rescues their argument. It maintains the prosecution’s stance on Nuremberg’s defendants while upholding nullum crimen as a vital constraint. The cost is theoretical but adds depth. The user keeps their strongest points and addresses the loopholes more effectively.
answer: |-
  Your argument is razor-sharp and exposes a genuine tension in the *nullum crimen* principle when applied to actors who flout the law. The problem lies in **Step (1): The sole justification for *nullum crimen* is fair notice.** This premise is too narrow and causes the detonation. Let's break down why, what you gain by rejecting it, and how it addresses your loose ends:

  ### Why Step (1) is the Culprit
  1.  **Reduces Legality to Subjective Reliance:** Step (1) frames the entire prohibition on retroactivity as solely protecting an individual's ability to rely on existing law *for their own guidance*. This makes the principle entirely dependent on the defendant's subjective state of mind and conduct ("Were they trying to follow the law?").
  2.  **Erodes the Principle's Core Purpose:** The principle of legality (*nullum crimen sine lege*) serves broader, objective purposes beyond individual notice/reliance:
      *   **Constraint on State Power:** It prevents arbitrary state action by requiring laws to exist *before* punishment can be inflicted. This protects everyone, regardless of their personal attitude towards the law. It's a structural safeguard against tyranny.
      *   **Separation of Powers:** It ensures that defining crimes is the role of the legislature (or established custom/treaty), not judges or prosecutors acting *ex post facto*.
      *   **Predictability and Rule of Law:** It fosters a system where citizens (and officials) can know the boundaries of permissible conduct, promoting stability and fairness. This objective predictability matters even if a *particular* defendant ignored it.
      *   **Limiting Judicial Discretion:** It prevents judges from creating new crimes to punish conduct they find morally repugnant but which wasn't previously illegal.
  3.  **Leads Directly to the Victor's Justice Conclusion:** By tying the protection *only* to reliance, your logic correctly concludes that only the "weak" and "law-abiding" get the shield (Step 6). Anyone powerful or sophisticated enough to manipulate or ignore the law (*including* heads of state, cynical counsel, or loophole-exploiting traders) seemingly forfeits the protection against retroactivity (Steps 5 & 7). This transforms *nullum crimen* from a fundamental rule-of-law constraint into a tool selectively deployed by the powerful against other powerful actors they defeat – the essence of the victor's justice critique (Step 8).

  ### The Solution: Reject Step (1) - Keep Step (3) Intact
  *   **Modify Premise (1):** "While fair notice is a *crucial aspect* of the prohibition on retroactive punishment (*nullum crimen sine lege*), its core purpose is deeper: to constrain arbitrary state power, ensure the separation of powers, uphold the rule of law by requiring pre-existing and sufficiently clear legal prohibition, and guarantee that punishment flows from violation of a known legal norm, not merely from moral condemnation or political expediency."
  *   **Revise Conclusion (4):** "Therefore, while the *novelty* of the aggression charge is a serious concern requiring justification, the defendants' flagrant disregard for *any* legal constraints (Step 3) demonstrates that their conduct was so fundamentally hostile to the very foundations of legal order that applying a *new* legal prohibition is less an affront to *their personal reliance interests* and more a necessary act of *defending the possibility of law itself* against those who sought its annihilation. The tribunal is not *only* punishing past acts; it is *establishing* a vital legal principle *for the future* based on pre-existing moral and treaty-based condemnation of aggressive war."
  *   **Resolves the Overextension (Steps 5-8):** By grounding *nullum crimen* in objective constraints on state power and the rule of law, it protects *everyone* – the head of state, the general counsel, the trader – from retroactive criminalization, *regardless* of whether they personally relied on the law. The trader routing deals through a loophole hasn't destroyed the legal system; they are operating (perhaps cynically) *within* its existing structures. Punishing them retroactively would be a true violation of legality. The Nazi leadership, by their systematic dismantling of law internally and launching wars condemned by treaties they signed, placed themselves *outside* the reciprocal framework the principle relies on. The *nature* of their crimes (attacking the foundations of international legal order) justifies the novel application *in this specific, extreme context*.
  *   **Preserves Your Strong Point (Step 3):** You absolutely keep Step (3). The defendants' relationship to law remains central. It doesn't negate the *existence* of the retroactivity concern, but it provides the strongest possible *response* to it within the broader framework of the rule of law. It shows why applying a new rule to *them specifically* is qualitatively different and less unjust than applying it to someone operating within a functioning legal system. Their actions demonstrate they recognized the *moral/legal condemnation* of aggressive war (via treaties, diplomacy, reactions to prior invasions) but chose to defy it – "knew it was wrong" even if the precise *criminal penalty* was novel.

  ### Cost of Rejecting Step (1)
  *   **Theoretical Cost:** You concede that fair notice, while important, isn't the *only* or even the *primary* foundation of *nullum crimen*. You move to a more complex, multi-faceted justification rooted in constitutionalism, separation of powers, and the objective rule of law. You acknowledge the principle protects even the cynical.
  *   **Practical Cost:** It makes defending the tribunals slightly harder. You must now *positively justify* the novelty of the aggression charge based on pre-existing norms (treaties, state practice, natural law) and the unique context, rather than simply dismissing the objection based on the defendants' lack of reliance. You must engage with the dissenting judge at Tokyo head-on.

  ### Addressing Your Loose Ends
  1.  **Novelty of the Aggression Charge:** Your point is correct. The Kellogg-Briand Pact (1928) outlawed war but didn't specify individual criminal liability. This *is* the core of the retroactivity challenge.
      *   **How Modified Argument Handles It:** The prosecution argued (and the majority accepted) that aggressive war was already illegal under international law (Kellogg-Briand, League Covenant), and that the *logical consequence* of this illegality, especially given its catastrophic scale, *was* individual criminal responsibility. They pointed to pre-war state practice, condemnations, and the "laws of humanity" referenced in the Martens Clause. The tribunal asserted that launching aggressive war *was* inherently criminal under existing international law, even if unprosecuted before. Your modified argument accepts the novelty of the *specific criminal conviction* but argues that the underlying norm *prohibiting aggression* existed, was known to the defendants (Step 3!), and that imposing individual liability was a necessary and justified development *in response to the unprecedented scale of their crime*, which attacked the very system that might have provided clearer notice earlier. The lack of reliance (Step 3) weakens their *personal* claim of unfairness, while the objective need to defend the international legal order justifies the development.
  2.  **Dönitz and Submarine Warfare:** You recall correctly. Admiral Nimitz submitted an affidavit stating the US Navy conducted unrestricted submarine warfare in the Pacific from day one. The tribunal found Dönitz guilty of breaches *but declined to impose a sentence based solely on this charge* because of the US practice. This is crucial.
      *   **What This Shows:** This demonstrates the tribunal *was* deeply concerned with something beyond mere formal notice: **the principle of reciprocity and equality before the law.** Punishing Dönitz for conduct systematically engaged in by the prosecuting power *would* have been fundamentally unfair and smacked of victor's justice. It highlights that *nullum crimen* isn't *just* about knowing the rule existed beforehand; it's also about the **consistent and non-arbitrary application of the law**. If the law is applied only to the defeated, and not to those doing the same thing on the winning side, it violates the deeper rule-of-law principles your modified argument embraces. The tribunal avoided this pitfall in Dönitz's case. This reinforces why your Step (1) was insufficient and supports the multi-faceted view of legality.

  ### Conclusion: A Stronger Prosecution Stance
  By rejecting Step (1) and embracing the broader, objective foundations of the principle of legality, you:

  1.  **Defuse the Self-Detonation:** You prevent your argument from becoming a universal justification for retroactive punishment of the powerful/non-reliant.
  2.  **Retain Your Core Strength:** You keep the powerful argument about the defendants' relationship to law (Step 3) as a key reason why applying the novel charge to *them* was less unjust.
  3.  **Provide a Robust Defense:** You ground the tribunals' decisions in the necessity of defending the international legal order against unprecedented assault, justifying the development of individual liability for aggression based on pre-existing condemnation and the nature of the crimes.
  4.  **Acknowledge the Complexity:** You honestly confront the novelty charge and the Dönitz example, showing the tribunals grappled with deeper fairness concerns beyond simple notice.
  5.  **Refute Victor's Justice More Effectively:** You show the tribunals weren't *simply* exercising arbitrary power, but were attempting (imperfectly) to apply and develop legal principles constrained by broader rule-of-law ideals (like reciprocity, as seen in Dönitz).

  The cost is abandoning a simplistic "notice-only" view of *nullum crimen*, but the gain is a far more sophisticated, defensible, and ultimately stronger justification for the Nuremberg and Tokyo prosecutions on the retroactivity point. You didn't supply the victor's justice thesis with an argument; you exposed a weakness in a common understanding of *nullum crimen* and found a path to a better one.
