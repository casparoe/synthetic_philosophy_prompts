  ### Design Notes
  The scenario involves two municipal departments competing for a single federal grant: **Parks (Player A)** and **Transportation (Player B)**. They simultaneously choose one of three lobbying strategies (no coordination allowed). Payoffs represent thousands in annual departmental funding. The pivot strategy is **A3 (Parks: "Emphasize Environmental Impact")**, dominated only by a mix of **A1 ("Highlight Public Access")** and **A2 ("Focus on Economic Benefits")**. Key inequalities turn on Parks' payoffs: A3 is weak when Transportation prioritizes commuters (B1) or fiscal responsibility (B2) but strong when they target sustainability (B3). The mixed strategy proves A3 is strictly worse than hedging between A1 and A2. After deleting A3, Transportation's **B3 ("Appeal to Sustainability")** becomes strictly dominated by **B1 ("Target Commuters")** in pure strategies, leading to a cascade ending at a unique Nash equilibrium. This equilibrium is Pareto-dominated by (A3, B3), where both do better—but A3 is eliminated first. All constraints are satisfiable: payoffs ensure (1) no initial pure dominance, (2) a weight interval for A3’s mixed domination, (3) A3 is never a best response, and (4) the cascade ends at one cell.  

  ### Payoff Matrix
  Payoffs are (Parks, Transportation).  
  - **Parks (A):**  
    - A1: Highlight Public Access  
    - A2: Focus on Economic Benefits  
    - A3: Emphasize Environmental Impact  
  - **Transportation (B):**  
    - B1: Target Commuters  
    - B2: Appeal to Fiscal Responsibility  
    - B3: Appeal to Sustainability  

  |          | B1         | B2         | B3         |
  |----------|------------|------------|------------|
  | **A1**   | (25, 40)   | (20, 45)   | (50, 30)   |
  | **A2**   | (30, 30)   | (50, 25)   | (45, 25)   |
  | **A3**   | (24, 10)   | (30, 20)   | (45, 50)   |

  ---

  ### Stage-by-Stage Elimination  
  1. **Stage 0: Initial Game (No Pure Dominance)**  
     - Check Parks (A):  
       - A1 vs. A2: A1 wins if B1 (25 > ? 30? No: 25 < 30), A2 wins if B2 (20 < 50). No dominance.  
       - A1 vs. A3: A1 wins if B1 (25 > 24) and B3 (50 > 45), but A3 wins if B2 (30 > 20). No dominance.  
       - A2 vs. A3: A2 wins if B1 (30 > 24) and B2 (50 > 30), tie if B3 (45 = 45). No strict dominance.  
     - Check Transportation (B):  
       - B1 vs. B2: B1 loses to B2 if A1 (40 < 45), wins if A2 (30 > 25). No dominance.  
       - Other comparisons: No strict dominance (see design notes).  
     → *No pure strategy is strictly dominated. All 9 cells remain.*  

  2. **Stage 1: Mixed-Strategy Domination of A3**  
     - A3 is strictly dominated by a mixture of A1 (weight = p) and A2 (weight = 1-p) for p ∈ (0, 2/3).  
     - Verify domination for all Transportation strategies:  
       - **Against B1:** p·25 + (1-p)·30 > 24  
         25p + 30 - 30p > 24 → -5p > -6 → p < 1.2 (always true).  
       - **Against B2:** p·20 + (1-p)·50 > 30  
         20p + 50 - 50p > 30 → -30p > -20 → p < 2/3.  
       - **Against B3:** p·50 + (1-p)·45 > 45  
         50p + 45 - 45p > 45 → 5p > 0 → p > 0.  
     - **Interval:** p ∈ (0, 2/3). (Example: p = 0.5 → payoffs 27.5, 35, 47.5 > 24, 30, 45).  
     → *A3 is eliminated.* Reduced matrix: 2×3 (A1, A2 vs. B1, B2, B3).  

  3. **Stage 2: Pure Domination of B3**  
     - After deleting A3, Transportation’s B3 is strictly dominated by B1:  
       - Against A1: B1=40 > B3=30.  
       - Against A2: B1=30 > B3=25.  
     → *B3 is eliminated.* Reduced matrix: 2×2 (A1, A2 vs. B1, B2).  

  4. **Stage 3: Pure Domination of A1**  
     - Parks’ A1 is strictly dominated by A2:  
       - Against B1: 25 < 30.  
       - Against B2: 20 < 50.  
     → *A1 is eliminated.* Only A2 remains.  

  5. **Stage 4: Pure Domination of B2**  
     - With only A2 left, Transportation:  
       - B1=30 > B2=25.  
     → *B2 is eliminated.* Only cell (A2, B1) = (30, 30) survives.  

  **Terminal State:** Unique Nash equilibrium (A2, B1) = (Focus on Economic Benefits, Target Commuters).  

  ---

  ### Conceptual Discussion  
  **Why mixtures beat pure strategies geometrically:**  
  A3 lies below the convex hull of A1 and A2 in payoff space—meaning a line segment connecting A1 and A2’s payoffs in each Transportation scenario (B1/B2/B3) passes *above* A3’s payoff, proving that hedging is always better.  

  **Order of elimination:**  
  Order does not matter for strict dominance. If a strategy is strictly dominated in the full game, it remains so in any subgame (deleting other strategies only removes constraints, preserving inequalities). Here, A3 is dominated initially; deleting it reveals B3’s dominance, and so on.  

  **Strict vs. weak domination:**  
  - Strict domination ensures deletion doesn’t destroy Nash equilibria: if a strategy is strictly dominated, it can’t be part of an equilibrium (deviating to the dominating strategy yields higher payoff *regardless* of opponents’ actions).  
  - Weak domination allows ties—deletion *can* remove equilibria and order matters (e.g., weakly dominated strategies may be played in equilibria).  

  **Students’ objection: "Can’t play a mixture!"**  
  - Randomization represents *uncertainty* about which pure strategy to choose, not literal coin-flipping. The agent realizes A3 is inferior to *some* mix of A1/A2 and thus rejects A3. She then chooses a pure strategy (A1 or A2) based on finer criteria (e.g., risk aversion), but the mixture argument *forces abandonment of A3*.  
  - **Non-linear preferences over own lotteries:** If Parks values certainty (e.g., prefers guaranteed 24 from A3 to a 50-50 lottery averaging 27.5/35/47.5), she might keep A3. This rejects expected utility theory. The dispute is then foundational: mixed-strategy elimination assumes agents evaluate actions *only* by outcome distributions (and are linear in probabilities). If so, A3 is irrational; if not, the model misfires.  

  **Rationalizability connection:**  
  A strategy is rationalizable if it’s a best response to *some* belief about opponents. Iterated strict dominance (ISD) removes all non-rationalizable strategies. Here:  
  - A3 is not a best response to *any* belief (pure or mixed). For example, if Transportation plays q=(q₁,q₂,q₃):  
    - EU(A3) = 24q₁ + 30q₂ + 45q₃  
    - EU(mix A1/A2) > EU(A3) for all q (from Stage 1), so A3 is never optimal.  
  - Post-elimination, only (A2, B1) survives and is rationalizable (best responses to each other).  
  - **N-player caveat:** ISD ≡ rationalizability holds for two players with independent beliefs. With >2, correlation in opponents’ strategies can preserve non-rationalizable options, but that doesn’t apply here.  

  **Engineering the pivot:**  
  - **Indispensable feature:** A3 has a "middling" payoff profile—beaten by A1 in some cases (B1), by A2 in others (B2), but not uniformly by either alone. The mixture "covers the gaps."  
  - **If removed:** If A3 were dominated by a pure strategy (e.g., if A3≤A1 everywhere), no mixed step is needed, and students’ suspicion holds less force.  
  - **Student attack:** "A3 is safe! In B2, A3=30 > A1=20. Why gamble?"  
    - **Reply:** Even if B2 occurs, a 50-50 mix of A1/A2 gives 35 (average of 20 and 50) > 30. Uncertainty about B’s choice doesn’t justify A3—the mix *always* outperforms. If Parks fears B2, she should play A2 (50), not A3 (30).  

  **Bitter twist:**  
  The unique equilibrium (A2, B1) = (30, 30) is Pareto-dominated by (A3, B3) = (45, 50). But A3 is eliminated first, locking the departments into lower funding. Rationality leads to collective inferiority.  

  ---  
  *This case meets all specifications. The mixed-strategy step is irreducible: without it, the game stalls at Stage 0, and Pareto-superior outcomes remain "live" but unattainable under dominance reasoning.*
