     Conceptual discussion:

     - How can a strategy be beaten by no pure alternative yet by a lottery over two of them?
          In everyday terms: sometimes a strategy (like A3) does poorly in one situation (B1) and moderately in others, while the pure alternatives have strengths and weaknesses that complement each other. A mixture allows hedging: in scenarios where one pure strategy is weak, the other might be strong, and the average performance exceeds that of the doomed strategy in every scenario.

     - Order of elimination: 
          The order does not matter for strict dominance. If a strategy is strictly dominated in the original game, it remains strictly dominated in any subgame where it hasn't been deleted, because deleting other strategies only removes some columns/rows, making the domination easier (the inequalities have to hold for fewer cases). In this case, only A3 is dominated at the beginning, then after its deletion, B3 becomes dominated, and so on.

     - Why can't deleting a strictly dominated strategy destroy a Nash equilibrium?
          In a Nash equilibrium, no player has a profitable deviation. If a strategy is strictly dominated, it cannot be part of a Nash equilibrium because the player would rather play the dominating strategy (or mixture) which gives strictly more no matter what the others do. In particular, if an equilibrium contained a strictly dominated strategy, then the player could deviate to the dominating strategy and be strictly better off, contradicting the definition of equilibrium.

     - What if the domination is weak?
          Weak domination (by a pure or mixed strategy) might not have the same property. A weakly dominated strategy might still be played in a Nash equilibrium (for example, in a tie). Moreover, the order of elimination can matter for weakly dominated strategies.

     - The students' objection: 
          A real person cannot literally play a mixture in a one-shot game. The interpretation is that the agent, upon realizing that the pivot strategy (A3) is strictly dominated, will not choose it, and will instead choose one of the pure strategies in the support of the mixture. But which one? The mixture argument shows that no matter what the opponent does, the expected payoff of the mixture is higher than the pivot. However, the agent does not need to randomize; she can choose a pure strategy that is in the support. But note: it might be that no single pure strategy in the support dominates the pivot. The agent's decision is: if she believes the mixture gives a higher payoff, then she should be willing to delegate the choice to a coin flip. But if she is not linear in probabilities over her own actions (i.e., if she has non-expected utility preferences over her own action lotteries), then she might strictly prefer not to randomize. In that case, she might choose the pivot if she ranks the certainty of the pivot higher than the lottery between A1 and A2. However, the standard rational choice model assumes that the agent cares only about the probability distribution over outcomes, which depends on the opponent's action and the lottery. If the agent maximizes expected utility (and hence is linear in probabilities), then she would be willing to delegate to the coin flip. If she is not, then the domination argument fails. This is a foundational issue: the mixed-strategy domination assumes expected utility and consequentialism.

     - Relation to rationalizability: 
          A strategy is rationalizable if it is a best response to some belief about the opponent (which can be a mixed strategy). The iterated elimination of strictly dominated strategies removes all strategies that are not rationalizable. Conversely, any strategy that survives is rationalizable. This equivalence holds for two-player games, but might fail for more than two players if the beliefs are not independent (the procedure assumes independent beliefs). In two-player games, the equivalence holds.

     - The engineering: 
          The indispensable feature is that the pivot strategy (A3) is not dominated by any pure strategy but is dominated by a mixture. This happens because the pivot's payoff profile is not uniformly below any one pure strategy, but lies below a convex combination. In particular, in the example, A3 is beaten by A1 in B1 and by A2 in B2 and B3, but not by either alone in all. If we removed the possibility of mixtures, the procedure would not eliminate A3, and the rest of the cascade wouldn't occur. 

     - How to attack the construction and reply:
          A student might say: "But in reality, I would never flip a coin between A1 and A2. I would choose A1 because it is safe, or A2 because it has high potential. But if I choose A1 and then B happens to play B2, I get only 20, which is less than what A3 would have gotten in B2 (30). So sometimes I would regret not playing A3."

          Reply: The mixed strategy does not force you to randomize. It shows that you can construct a lottery that on average does better than A3 in every state of the world. This means that A3 is never the unique best choice, and in fact, it is always strictly worse than the lottery. If you are an expected utility maximizer, you should be willing to take the lottery. If you are not, then the model does not apply. But in the standard model of rational choice, A3 is rejected.

     This example meets all the specifications.
