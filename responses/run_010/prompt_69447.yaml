  Regarding redirected practices, Maimonides clearly views sacrifices as temporary scaffolding. The key phrase is "traces of idolatry were blotted out" - the form is disposable idolatrous packaging that only served as a transitional tool. The professor's reading is defensible: Maimonides sees sacrificial rites as having no intrinsic value beyond weaning people from idolatry.

  The contradiction between the Guide and the law code is significant. The Guide implies mental worship is the ideal endpoint, while the law code predicts physical sacrifices returning. The daughter has a strong point - the professor is overlooking Maimonides' concession to popular eschatology in his law code versus his philosophical ideal in the Guide.

