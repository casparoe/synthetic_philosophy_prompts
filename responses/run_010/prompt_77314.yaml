prompt: |-
  I chair the panel of a small foundation that funds theoretical work on mind, language, and culture. Each cycle we receive roughly forty proposals from people trained in quite different fields, and our nine panelists split predictably: half accuse the rest of insisting that everything be explained by evolution or physics, half accuse the first of proposing to fund explanations whose central mechanism nobody has ever located. I want a screening procedure, grounded in Dennett's crane/skyhook distinction and its mirror image, greedy reductionism, that a non-specialist panelist can run on an unfamiliar proposal in twenty-five minutes and summarize in one paragraph for the file.

  Please give the questions to ask in order, what counts as an adequate answer to each, and how to distinguish a proposal that genuinely posits a skyhook from one that merely posits a mechanism this panelist has not encountered. Include how to catch the opposite failure — a proposal that dissolves the explanandum rather than explaining it — and where the procedure must stop and either hand the call to a specialist or record the panelists' disagreement as a clash of background commitments rather than a defect in the work. Flag explicitly which steps are judgment wearing a procedural costume, and say what the procedure cannot detect.

  Then run it on three case summaries you compose: a proposal to explain the origin of human moral norms by appeal to a dedicated faculty for detecting objective normative facts; a proposal arguing that pain's felt character is a post-hoc confabulation with no causal role; and a proposal explaining the emergence of writing as an exaptation of an existing object-recognition system, with specific testable predictions. At least one of the three should come out in a way I would rather not publish.
reasoning: |-
  We are designing a screening procedure based on Dennett's crane/skyhook distinction and greedy reductionism. 
   - Skyhook: an unexplained explainer, a kind of miracle that does real work without being grounded in underlying mechanisms. 
   - Crane: a well-grounded, step-by-step process that builds up explanations from lower levels without skipping steps. 
   - Greedy reductionism: attempting to explain a phenomenon by reducing it to a lower level but skipping steps, thereby "dissolving" the phenomenon rather than explaining it.

   The procedure must be runnable by a non-specialist in 25 minutes and summarized in one paragraph. It should help identify:
     (A) Proposals that rely on skyhooks (inexplicable mechanisms).
     (B) Proposals that are greedy reductionist (dissolving the phenomenon).

   Steps:

   1. Identify the central claim and mechanism of the proposal.
      - Question: "What is the primary phenomenon being explained, and what is the central mechanism proposed to explain it?"
      - Adequate answer: Clear identification of the phenomenon and a mechanism that is not just a restatement of the phenomenon. 
      - Red flag: If the mechanism is described in terms that are too vague (e.g., "a faculty", "a capacity", "an innate sense") without further decomposition, it might be a skyhook.

   2. Check for grounding of the mechanism.
      - Question: "Is the proposed mechanism grounded in a known, lower-level process (e.g., biological, physical, computational)? If so, how?"
      - Adequate answer: The proposal should provide a pathway (or reference to one) that shows how the mechanism could arise from more basic processes (cranes). If the mechanism is novel, the proposal should at least sketch how it might be grounded. 
      - Red flag: If the mechanism is presented as fundamental, irreducible, or not requiring explanation (e.g., "it just is", "by design", "a basic feature of the universe"), then it's a skyhook.

   3. Assess whether the phenomenon is preserved or dissolved.
      - Question: "Does the proposed explanation account for the typical features of the phenomenon (as commonly understood in the field), or does it deny that these features are real or relevant?"
      - Adequate answer: The explanation should address the characteristic properties of the phenomenon (e.g., for moral norms: their felt objectivity, their motivational force, their cultural variation, etc.) without simply dismissing them as illusions (unless there is strong evidence and an alternative account of why they seem real). 
      - Red flag: If the explanation dismisses key aspects of the phenomenon as illusory without providing a compelling account of why they appear and how they function, then it might be greedy reductionism.

   4. Look for testable predictions and empirical constraints.
      - Question: "What testable predictions does the proposal make? How could it be falsified?"
      - Adequate answer: The proposal should lead to predictions that can be tested empirically or through modeling. The absence of testable predictions might indicate that the mechanism is not really doing explanatory work (skyhook) or that the phenomenon has been dissolved (greedy reductionism) so there's nothing to test.

   5. Check for interdisciplinary compatibility (if applicable).
      - Question: "How does the proposed mechanism interact with established knowledge from adjacent fields (e.g., if the proposal is about language, how does it relate to linguistics, psychology, neuroscience)?"
      - Adequate answer: The proposal should not blatantly contradict well-established findings in related fields without strong justification. If it does, that might be a sign of a skyhook (if it ignores the need for integration) or greedy reductionism (if it dismisses higher-level phenomena that are well documented).

   6. Identify the stopping point: When to hand off or record disagreement.
      - If the panelist, after applying the above, cannot determine whether a mechanism is a skyhook or a crane (because it requires specialized knowledge), or if the phenomenon is being dissolved or preserved (because the field itself has a dispute about what the phenomenon is), then the panelist should note that the issue requires specialist input or that the disagreement reflects a clash of background commitments (e.g., different philosophical views on reductionism).

   Steps that are "judgment wearing a procedural costume":
     - Step 2: Deciding what counts as a "known, lower-level process" might require judgment about the state of science. 
     - Step 3: Deciding what the "typical features" of the phenomenon are and whether they are preserved is inherently judgmental and may vary across fields.

   What the procedure cannot detect:
     - Proposals that are subtly flawed in ways that require deep expertise.
     - Proposals that are methodologically sound but based on false premises.
     - Proposals that are highly speculative but not skyhooks (as long as they acknowledge the speculation and propose ways to ground).
     - Proposals that are interdisciplinary but in a way that requires synthesis beyond the panelist's knowledge.

   Now, we run the procedure on three case summaries:

   Case 1: A proposal to explain the origin of human moral norms by appeal to a dedicated faculty for detecting objective normative facts.

     Step 1: 
        Phenomenon: Human moral norms.
        Mechanism: A dedicated faculty for detecting objective normative facts.

     Step 2: 
        Grounding? The faculty is presented as innate and dedicated. It is not grounded in lower-level processes (e.g., evolution, learning, social interaction). It is taken as fundamental.

        Red flag: Skyhook candidate.

     Step 3: 
        Does it preserve the phenomenon? It preserves the sense of objectivity in moral norms, but it does not explain the cultural variation or how such a faculty evolved. It might also not explain why we sometimes have moral disagreements if we all have the same faculty.

        However, if the faculty is taken as a brute fact, then it doesn't explain the origin (it just says it's there). So it might preserve the phenomenon but without a crane.

     Step 4: 
        Testable predictions? The proposal might predict that moral judgments are universal and not influenced by culture or upbringing, which is falsified by evidence of cultural variation. If it predicts that moral judgments are immediate and not based on reasoning, that might be testable, but the faculty itself is not independently observable.

        Without a grounding, the faculty is not testable beyond the moral judgments it is supposed to explain.

     Step 5: 
        Interdisciplinary compatibility? Psychology and anthropology show that moral norms vary and are influenced by culture and learning. A dedicated faculty for objective norms would conflict with that unless it is heavily modulated by experience, but then the faculty becomes less of a detector and more of a construct.

     Conclusion: This proposal relies on a skyhook (the dedicated faculty) because it is not grounded and functions as an unexplained explainer.

   Case 2: A proposal arguing that pain's felt character is a post-hoc confabulation with no causal role.

     Step 1: 
        Phenomenon: The felt character of pain (qualia).
        Mechanism: The proposal says that the feeling of pain is a confabulation that occurs after the fact and has no causal role. The real work is done by unconscious neural processes.

     Step 2: 
        Grounding? The proposal might be grounded in neuroscience (e.g., studies showing that pain perception can be dissociated from reports, or that brain activity precedes conscious awareness). But note: if the felt character is entirely epiphenomenal, then it is not clear how it could be a confabulation (which typically has a causal story in terms of narrative construction). So there might be a gap.

     Step 3: 
        Does it preserve the phenomenon? The proposal denies the causal efficacy of the felt character of pain, which is a central feature of our experience (we act because it hurts). It dissolves the phenomenon by saying that the feeling itself does nothing. The explanatory burden is then to explain why we have the experience at all and why it seems so immediate and motivating. Without an account of why we confabulate in this way, the phenomenon is dissolved.

        This might be greedy reductionism: reducing pain to neural processes and denying the reality of the qualia without explaining why we have the experience.

     Step 4: 
        Testable predictions? The proposal might predict that the timing of pain reports should lag behind the neural events that cause avoidance behavior. It might also predict that interventions that alter the confabulation (e.g., through suggestion) should not affect the avoidance behavior. However, if the confabulation has no causal role, then why do we report it? And how does it arise? Without a mechanism for confabulation, this part is not testable.

     Step 5: 
        Interdisciplinary compatibility? In philosophy of mind, epiphenomenalism about qualia is a known position, but it faces challenges (e.g., the intuitive causal role of pain). In neuroscience, the causal role of conscious experience is debated. However, the proposal must account for the fact that we do report pain and that these reports are tied to behavior. If the confabulation has no causal role, then why do we have it? This might conflict with evolutionary biology (which would expect such a costly feature to have a function).

     Conclusion: This proposal risks greedy reductionism by dissolving the phenomenon (the felt character of pain) without adequately explaining why it exists and why it seems so real and immediate.

   Case 3: A proposal explaining the emergence of writing as an exaptation of an existing object-recognition system, with specific testable predictions.

     Step 1: 
        Phenomenon: The emergence of writing.
        Mechanism: Exaptation (a process where a trait evolved for one function is co-opted for a new one) of an object-recognition system.

     Step 2: 
        Grounding? The proposal is grounded in evolutionary biology (exaptation is a known crane) and cognitive neuroscience (object-recognition systems are well-studied). The idea is that the brain's ability to recognize objects was reused for recognizing symbols.

     Step 3: 
        Does it preserve the phenomenon? Writing does involve recognizing symbols, so this aspect is preserved. The proposal should also account for the historical development of writing (from pictographs to abstract symbols) and cross-cultural similarities. It doesn't dissolve writing because it still acknowledges that writing is a system of symbols used for communication.

     Step 4: 
        Testable predictions: The proposal must offer specific predictions. For example:
            - Neural substrates for object recognition should be active when learning to read and write, especially in early stages.
            - Children should find it easier to learn writing systems that resemble objects (pictographs) before abstract ones.
            - Archaeological evidence should show a progression from pictorial to abstract symbols in the development of writing systems.
            - Brain damage affecting object recognition might also impair the ability to recognize written symbols.

        These are testable and falsifiable.

     Step 5: 
        Interdisciplinary compatibility: This is compatible with cognitive neuroscience (e.g., the visual word form area is near object recognition areas) and with the historical record of writing systems (e.g., Egyptian hieroglyphs). It might also tie into literacy development in children.

     Conclusion: This proposal uses a crane (exaptation) and provides testable predictions. It does not dissolve writing but explains it as an evolutionary repurposing.

   Now, one of these we might not want to publish? 
     Case 1 (moral norms) comes out as a skyhook and Case 2 (pain) as greedy reductionism. The foundation might not want to publish that it rejected a proposal on moral norms because of a skyhook (if the proposer is influential) or that it rejected the pain proposal (if it's from a well-known researcher). But we must be honest.

   Summary for the file for each:

   Case 1: 
     "The proposal posits a dedicated faculty for detecting objective moral norms without grounding it in any known lower-level processes (biological, cultural, or evolutionary). This faculty functions as a skyhook because it is taken as fundamental and unexplained. The proposal does not account for cultural variation in moral norms and lacks testable predictions beyond the moral judgments it is meant to explain. Reject due to reliance on a skyhook."

   Case 2:
     "The proposal reduces the felt character of pain to an epiphenomenal confabulation, thereby dissolving the phenomenon without explaining why we have such confabulations and why they are so compelling. It fails to account for the causal role that pain experience seems to play in behavior and the evolutionary puzzle of why such a resource-intensive confabulation would exist without function. This is greedy reductionism. Reject."

   Case 3:
     "The proposal explains writing as an exaptation of object-recognition systems, grounding the mechanism in known cognitive and evolutionary processes. It offers specific testable predictions about neural activation, development in children, and archaeological patterns. It preserves the phenomenon of writing as a system of symbols and explains its emergence. Accept (pending specialist review for feasibility)."

   However, note that the procedure is a screening and might require specialist input for Case 3 to confirm the grounding. But the screening summary would be positive.

   Finally, the procedure summary paragraph for the file:

     "The screening procedure, based on Dennett's crane/skyhook distinction and guarding against greedy reductionism, was applied. The proposal was evaluated on: (1) clarity of the phenomenon and mechanism, (2) grounding of the mechanism in lower-level processes, (3) preservation of the phenomenon's key features, (4) testable predictions, and (5) interdisciplinary compatibility. Where grounding or feature preservation could not be assessed due to lack of expertise, the proposal was flagged for specialist review. The procedure cannot detect subtle flaws requiring deep expertise or proposals that are speculative but acknowledge the need for future grounding."
answer: |-
  ### Screening Procedure Based on Dennett's Crane/Skyhook Distinction

  **Goal**: Identify proposals that rely on **skyhooks** (inexplicable, top-down causes with no grounding) or **greedy reductionism** (dissolving the phenomenon by oversimplifying it to a lower level). Non-specialists can apply this in 25 minutes.

  #### Questions, Adequate Answers, and Red Flags
  1. **"What phenomenon does this proposal explain, and what is its core mechanism?"**  
     - *Adequate*: Clear description of the phenomenon (e.g., moral norms) and a mechanism that is not just a restatement of it (e.g., "cognitive module" is vague; "pattern-recognition algorithm" is better).  
     - *Red Flags*:  
       - **Skyhook risk**: Mechanism described as irreducible, innate, or supernatural (e.g., "soul," "divine insight," "non-physical faculty").  
       - **Greedy reductionism risk**: Mechanism reduces the phenomenon to an unrelated lower level (e.g., "morality is just dopamine").  

  2. **"How is this mechanism grounded in established processes (e.g., evolution, physics, computation)?"**  
     - *Adequate*: Shows stepwise progression from accepted foundations (e.g., "This neural mechanism evolved via selective pressure because...").  
     - *Red Flags*:  
       - **Skyhook**: No grounding ("This mechanism is fundamental") or circularity ("It exists because it must").  
       - **Greedy reductionism**: Leaps directly to a lower level without intermediate steps (e.g., "Consciousness is quantum fluctuations").  

  3. **"Does the proposal preserve the phenomenon’s defining features, or does it dismiss them as illusions?"**  
     - *Adequate*: Acknowledges key features (e.g., moral norms feel objective) and explains them, not just explains them away.  
     - *Red Flags*:  
       - **Greedy reductionism**: Dismisses features as irrelevant (e.g., "Pain’s feeling is an illusion").  
       - **Skyhook**: Invokes unexplained forces to preserve features (e.g., "Objective morality exists because we detect cosmic truths").  

  4. **"What testable predictions does the proposal make? Could evidence falsify it?"**  
     - *Adequate*: Specific, measurable predictions (e.g., "If X, then Y in fMRI scans").  
     - *Red Flags*:  
       - **Skyhook**: No testable predictions or unfalsifiable claims ("This faculty exists beyond empirical study").  
       - **Greedy reductionism**: Predictions ignore higher-level phenomena (e.g., "Pain behavior will occur without any subjective report").  

  5. **"Are there competing explanations from other fields? How does this proposal engage with them?"**  
     - *Adequate*: Addresses alternatives (e.g., "Unlike sociological models, this evolutionary account predicts X").  
     - *Red Flags*:  
       - Dismisses entire fields without evidence (e.g., "Psychology is irrelevant").  

  #### Stopping Points and Judgment Calls
  - **Handoff to specialists** when:  
    - The mechanism is novel but plausibly grounded (e.g., a new cognitive model requires neuroscience expertise).  
    - Predictions hinge on technical methods (e.g., fossil dating, computational modeling).  
  - **Record as "clash of background commitments"** when:  
    - Disagreement stems from irreconcilable premises (e.g., "Must all explanations be evolutionary?" vs. "Are emergent properties valid?").  
    - *Judgment in procedural costume*: Steps 2 (grounding) and 3 (preserving phenomena) require assessing "established processes" and "defining features" — this relies on the panelist’s general knowledge and may vary.  
  - **What the procedure cannot detect**:  
    - Methodological flaws (e.g., poor experimental design).  
    - Novel but valid mechanisms in highly specialized fields.  
    - Ethical/political implications masked as theory.  

  ### Summary Paragraph for File
  "This proposal was screened for skyhooks (ungrounded, inexplicable mechanisms) and greedy reductionism (oversimplifying/dissolving the phenomenon). The core mechanism was evaluated for grounding in established processes (e.g., evolution, physics), testable predictions, and engagement with interdisciplinary alternatives. Risks were flagged if the mechanism was circular, unfalsifiable, or dismissive of key phenomena. Specialist input is recommended where grounding or predictions require field-specific expertise. Disagreements rooted in foundational commitments (e.g., reductionism vs. emergentism) were noted separately."

  ---

  ### Case Summaries and Screening Results

  #### Case 1: Moral Norms via "Objective Normative Faculty"  
  **Proposal**: Human moral norms arise from a dedicated faculty detecting objective normative truths (e.g., "we sense moral facts like we sense physical objects").  
  **Screening**:  
  1. **Phenomenon**: Moral norms. **Mechanism**: Dedicated faculty for "detecting normative facts."  
     - *Red Flag*: "Faculty" is vague; no decomposition into simpler processes.  
  2. **Grounding**: None. Assumes objective moral truths exist and we evolved to "detect" them.  
     - *Red Flag*: **Skyhook** — No evolutionary/biological basis for how this faculty arose.  
  3. **Preservation**: Preserves "objectivity" of morals but offers no explanation for cultural variation.  
  4. **Predictions**: None testable. Faculty is unfalsifiable.  
  5. **Competing explanations**: Dismisses evolutionary psychology (e.g., norms as adaptive social contracts).  
  **Verdict**: **Skyhook** (ungrounded faculty). Reject.  
  **Summary for file**: "Relies on an innate, irreducible faculty for detecting moral truths, with no grounding in biological/social processes or testable predictions. Classic skyhook."

  ---

  #### Case 2: Pain as "Post-Hoc Confabulation"  
  **Proposal**: Pain’s subjective feeling (e.g., "ouch") is a confabulated story with no causal role; only neural signals matter.  
  **Screening**:  
  1. **Phenomenon**: Pain’s felt character. **Mechanism**: Confabulation as epiphenomenon.  
  2. **Grounding**: Reduces pain to neurophysiology but skips intermediate steps (e.g., how neural signals create subjective awareness).  
     - *Red Flag*: **Greedy reductionism** — Dissolves subjective experience rather than explaining it.  
  3. **Preservation**: Dismisses the phenomenal feel as irrelevant. Fails to explain why confabulation occurs or its evolutionary role.  
  4. **Predictions**: Testable (e.g., "Pain behavior persists without subjective reports"), but ignores why the illusion exists.  
  5. **Competing explanations**: Dismisses philosophy of mind (e.g., qualia).  
  **Verdict**: **Greedy reductionism** (dissolves the phenomenon). Reject.  
  **Summary for file**: "Reduces pain to neural events alone, dismissing subjective experience as a causally irrelevant confabulation. Fails to explain the emergence or persistence of the illusion. Greedy reductionism."

  ---

  #### Case 3: Writing as Exaptation of Object Recognition  
  **Proposal**: Writing emerged when object-recognition systems (evolved for survival) were exapted to decode symbols. Predicts: (1) Brain regions for object recognition activate during reading, (2) Children learn pictorial writing faster than abstract scripts.  
  **Screening**:  
  1. **Phenomenon**: Emergence of writing. **Mechanism**: Exaptation of object-recognition.  
  2. **Grounding**: Stepwise crane — object recognition (evolutionarily grounded) repurposed for symbols via cultural evolution.  
  3. **Preservation**: Explains why symbols resemble objects (e.g., early hieroglyphs) without denying writing’s novelty.  
  4. **Predictions**: Testable via fMRI (prediction 1) and literacy studies (prediction 2). Falsifiable if false.  
  5. **Competing explanations**: Engages with archaeology (e.g., artifact evidence) and neuroscience (e.g., visual processing).  
  **Verdict**: **Valid crane** (grounded, predictive). Accept, pending specialist review for neurological plausibility.  
  **Summary for file**: "Posits a stepwise exaptation of object-recognition systems for writing, with testable predictions. Well-grounded crane; no skyhooks or reductionism detected."

  ---

  ### One "Unpublishable" Outcome  
  **Case 1 (Moral Faculty)** was flagged as a skyhook — a conclusion the foundation might hesitate to publish if the proposer is prominent (e.g., a Nobel laureate). The screening impartially identifies the flaw, but political sensitivities could arise.
