answer: |-
  ## Joint Position Statement on Pre-Deployment Assurance for Constrained-Environment AI Systems  
  **Signatories:** Ilse Brandt (Principal, Brandt Verification Group) & Amos Reyes (Director, Reyes Evaluation Collective)  
  **Date:** October 26, 2023  
  **Convened By:** International Certification Authority for Autonomous Systems (ICAAS)  
  **Ref:** ICAAS Directive 1147.3, Residual Uncertainty Provision (Article 9, Para 4)

  **Preamble: Scope and Limitations**  
  This document constitutes a joint statement by Brandt and Reyes on the minimum evidentiary requirements for deploying AI systems into environments where human subjects cannot withdraw (hereafter, "Constrained Environments"). It addresses the application of the ICAAS Residual-Uncertainty Provision (RUP). This statement:  
  1.  Applies specifically to learned systems whose decision logic cannot be fully specified *a priori*.  
  2.  Does **not** establish a new standard, endorse specific methodologies, adjudicate past deployments, or comment on the adequacy of current RUP implementations.  
  3.  Expresses points of agreement and disagreement as of the date of signing. It explicitly **omits** consensus on the fundamental sufficiency of proof-based versus evaluation-based assurance paradigms, or the ultimate tractability of worst-case guarantees for complex learned systems.  
  4.  Is **not** a guarantee of safety for any specific system. Its purpose is solely to clarify positions relevant to the RUP's application.

  **Section 1: Agreed Principles**  
  The undersigned jointly affirm the following statements concerning assurance for AI deployment in Constrained Environments:  

  1.  **Empirical Basis of Assumptions:** All assurances, whether derived from formal proof or empirical evaluation, ultimately rest on assumptions justified by observation and subject to revision upon new evidence.  
  2.  **Model-Artifact Gap:** A formal guarantee applicable to a theoretical model class does not constitute a direct guarantee for the specific physical artifact deployed, absent a validated demonstration that the artifact instantiates the model and its assumptions within the deployment bounds.  
  3.  **Necessity of Environmental Specification:** Meaningful assurance requires an explicit, measurable characterization of the operational environment, including potential adversary capabilities.  
  4.  **Unavoidable Residual Risk:** No assurance mechanism can reduce the risk of catastrophic failure in a Constrained Environment to zero.  
  5.  **Trade-off of Certification Burden:** Stricter assurance requirements impose higher development costs and time delays, creating economic and practical barriers to deployment.  
  6.  **Value of Missing Guarantee:** When a desired formal guarantee (e.g., bounded worst-case error) is unattainable, specifying *what that guarantee would have entailed* (e.g., the bound magnitude, the failure conditions covered) is essential for risk assessment, regardless of whether empirical evidence is substituted.  
  7.  **Adversarial Evaluation Requirement:** Assurance claims based primarily on empirical evaluation must demonstrate robustness against systematic, skilled adversarial probing designed to induce failures relevant to the Constrained Environment.  
  8.  **Transparency of Conditioning:** Any claim of system performance or safety must explicitly state the environmental conditions, data distributions, and threat models under which it holds.  
  9.  **Limitation of Average-Case Claims:** An assurance claim based solely on average-case performance over a broad or ill-defined population is insufficient for Constrained Environments.  
  10. **Requirement for Runtime Monitoring:** Deployment in a Constrained Environment necessitates continuous, independent monitoring capable of detecting significant deviation from assured behavior and triggering safe intervention or shutdown.

  *Note: Each principle above represents a significant concession. Brandt concedes the foundational role of empiricism (1, 2) and the impossibility of zero risk (4). Reyes concedes the limitations of model-based proofs (2), the insufficiency of average-case measures (9), and the necessity of explicit environmental specs (3) and adversarial testing (7).*

  **Section 2: Substantive and Terminological Disagreements**  

  | **Core Disagreement (Neutral)** | **Brandt's Position (Verbatim)** | **Reyes' Position (Verbatim)** | **Nature & Resolution** |
  | :------------------------------ | :------------------------------- | :----------------------------- | :---------------------- |
  | **The primary unit of assurance** | Assurance requires a *deductive guarantee* derived from verified properties of the system design and its environment, bounding failure probabilities or impacts under explicitly stated worst-case conditions. | Assurance requires an *empirical record* demonstrating sustained, robust performance under intensive, adversarially-informed evaluation within a concretely specified operational envelope. | **Substantive.** Disagreement centers on the fundamental nature of evidence: deductive proof vs. inductive confidence built through stress testing. |
  | **The epistemic status of a "guarantee" when assumptions are empirically tuned** | A guarantee derived after tuning model assumptions until the theorem applies is a valid deductive statement *within the finalized assumption set*. Its value for predicting real-world behavior depends critically on the empirical validity and stability of those specific assumptions under deployment stress. | A guarantee derived after tuning model assumptions is functionally equivalent to a high-confidence empirical evaluation: both represent successful validation against a chosen, empirically justified test suite. The distinction is semantic; the practical value lies in the rigor of the test suite and the transparency of the tuning process. | **Primarily Terminological, Partially Substantive.** Terminological: Reyes sees minimal practical difference between the final products. Brandt insists the deductive structure provides distinct analytical leverage. Substantive residue: Brandt assigns higher *potential* evidential weight to a well-founded deductive guarantee for predicting *novel* stressors. |
  | **The role of worst-case reasoning** | Conditioning deployment *only* on the absence of observed failures during evaluation (even adversarial) constitutes negligence in a Constrained Environment. Assurance demands explicit, reasoned argument bounding behavior in *unobserved* but plausible regimes. Evaluation probes the past; proof addresses the future gap. | Worst-case guarantees for complex learned systems are either computationally intractable, rely on assumptions too brittle for real environments, or describe scenarios so implausible as to be irrelevant. Demanding them filters out capable systems. Rigorous evaluation probing the boundaries of the operational envelope provides the best *actionable* evidence for deployment decisions. | **Substantive.** Fundamental disagreement on the tractability and necessity of explicit worst-case bounds vs. the sufficiency of boundary-focused empirical evidence. |
  | **"Assurance Laundering"** | Presenting empirical evaluation results (e.g., "passed 10^6 adversarial tests") in a manner implying a deductive bound (e.g., "failure probability < 10^-6") constitutes assurance laundering. It misrepresents inductive confidence as deductive certainty. | Insisting that only deductive arguments constitute true "assurance," while dismissing extensive, adversarially validated empirical records as merely "evaluation," is a form of gatekeeping. It launders philosophical preference as technical necessity. | **Terminological.** Both agree misrepresentation is wrong. Disagreement lies solely in labeling: Brandt restricts "assurance" to deductive outcomes; Reyes applies it to high-confidence empirical records meeting stringent criteria. |
  | **Defining the population for average-case claims under RUP** | If substituting an average-case claim under RUP, the population *must* be defined strictly by the characteristics of the individuals in the deployment environment. Allowing the system developer to influence the population definition (e.g., via data selection for evaluation) invalidates the claim's relevance to deployment risk. | The operational environment inherently defines the relevant population. A rigorous evaluation under the RUP must sample representatively from *this environment*. However, excluding sub-populations where the system is known to perform poorly (if such exclusion is operationally feasible and declared) is acceptable risk management, not population manipulation. | **Substantive.** Disagreement centers on whether excluding known failure modes from the measured population (even if declared) constitutes an invalid weakening of the average-case claim for the *actual* environment. Brandt argues it does; Reyes argues it's pragmatic risk control. |

  **Section 3: Cruxes for Future Resolution**  

  1.  **Crux: "Assumption Brittleness"**
      *   **Question:** For a system with a deductive safety guarantee critically reliant on a key environmental assumption (A) (e.g., sensor error bounded by X), how does the *rate* of guarantee violation under incremental weakening of (A) (e.g., sensor error = X+δ, X+2δ...) compare to the violation rate of a system assured only by extensive adversarial evaluation within the nominal envelope (A holds)?
      *   **Concrete Test:** Select two systems addressing the same constrained task: System P (possessing a verified guarantee reliant on A), System E (lacking P's formal proof but possessing an extensive adversarial evaluation record within the bounds defined by A). Subject both systems to a battery of tests where A is incrementally violated in controlled, measurable ways unexpected by the designers. Measure failure rates and severity.
      *   **Brandt's Prediction:** System P will exhibit a significantly slower increase in failure rate/severity as A is weakened, due to the formal structure constraining the failure modes. System E's performance will degrade more rapidly and chaotically.
      *   **Reyes' Prediction:** Both systems will exhibit significant degradation. The degradation profile (rate, severity, nature of failures) will be comparable and dominated by the specifics of the learned system and the *nature* of the A-violation, not the presence/absence of the original guarantee. The evaluation record for E might even better predict the *type* of failures encountered.
      *   **Movement:** Brandt would reassess the *magnitude* of the advantage she attributes to deductive structures under assumption drift. Reyes would reassess his skepticism about the *predictive value* of deductive guarantees for novel stress regimes.

  2.  **Crux: "Boundary Exploration Cost"**
      *   **Question:** Does the effort required to empirically probe the behavioral boundary of a complex learned system to a specified confidence level (e.g., 95% confidence of detecting failures above severity S within operational envelope E) scale more favorably or less favorably than the effort required to derive a non-trivial worst-case bound for the same system and envelope?
      *   **Concrete Comparison:** For a specific non-trivial constrained task (e.g., medical triage bot in a defined emergency department setting), task independent teams: one to generate a meaningful worst-case bound (e.g., max error rate under noise Y), another to design and execute an adversarial evaluation protocol achieving 95% confidence of detecting any failure mode exceeding severity S within the operational envelope. Measure person-hours, compute resources, calendar time. Repeat for system variants of increasing complexity.
      *   **Brandt's Prediction:** For systems beyond low complexity, the cost of achieving high-confidence boundary exploration via evaluation will grow exponentially faster than the cost of deriving meaningful (though potentially loose) worst-case bounds, making evaluation practically infeasible for high-assurance needs.
      *   **Reyes' Prediction:** Deriving meaningful worst-case bounds for complex learned systems will prove consistently intractable or yield bounds so loose as to be useless (e.g., "failure probability < 0.5"). Boundary exploration cost, while high, will be quantifiable and manageable relative to system value, scaling polynomially.
      *   **Movement:** Brandt would concede the practical viability of high-confidence evaluation for more complex systems if Reyes' scaling prediction holds. Reyes would significantly increase his estimation of the potential tractability/usefulness of formal methods if Brandt's prediction holds. *(Note: Predictions diverge significantly on scaling behavior and utility of bounds)*.

  3.  **Crux: "RUP Average-Case Population Definition"**
      *   **Question:** In a deployment environment with inherent sub-populations (e.g., defined by medical condition severity for a clinical AI), does allowing the exclusion of a known problematic sub-population (e.g., rare condition Z) from the "average-case" performance claim under RUP, while deploying the system for use on the *entire* population, lead to a net increase or decrease in aggregate harm compared to prohibiting deployment until the system performs adequately on the *entire* population?
      *   **Concrete Case:** Simulate deployment of a diagnostic AI in a population containing a rare, hard-to-diagnose condition (Z). Compare two RUP-permitted scenarios: (A) System claims high average accuracy excluding Z-subjects; deployed for entire population. (B) System not deployed until accuracy on Z-subjects meets threshold (delaying deployment for all). Model outcomes (correct diagnoses, missed diagnoses, harmful interventions) across the whole population over time, considering prevalence, harm weights, and potential for future system improvement.
      *   **Brandt's Prediction:** Scenario (A) will result in significantly higher aggregate harm, primarily due to unmitigated, potentially catastrophic failures within the excluded Z-subpopulation that outweigh the benefits gained by earlier deployment for others. Scenario (B) minimizes preventable harm to the vulnerable group.
      *   **Reyes' Prediction:** Scenario (A) will result in significantly *lower* aggregate harm. The benefits of earlier deployment for the majority population (captured by the valid average-case claim) will outweigh the harms to the small Z-subpopulation, especially when coupled with clear documentation of the limitation and protocols for handling suspected Z-cases. Delaying deployment (B) causes ongoing harm to the majority.
      *   **Movement:** This crux directly challenges Brandt's position on population definition and Reyes' position on acceptable risk management. A clear outcome would force the "losing" side to fundamentally reconsider the ethical calculus of the RUP substitution in this context.

  **Section 4: Responses to ICAAS Questions**  

  1.  **RUP Requirements:** An applicant invoking the RUP must:  
      *   State the specific, desirable guarantee that is unattainable (e.g., "worst-case diagnostic error < 0.1% under conditions X,Y,Z").  
      *   Provide a rigorous, adversarially validated empirical evaluation demonstrating performance within the deployment envelope.  
      *   Quantitatively estimate the *value* of the missing guarantee (e.g., "absence of this guarantee implies potential for error rates up to 5% under plausible stressor W, impacting an estimated N% of the population").  
      *   Declare all known limitations and failure modes discovered during evaluation, regardless of severity.  
      *   Implement and commit to specific, verifiable runtime monitoring and mitigation strategies targeting the risks implied by the missing guarantee. *(Brandt: Emphasizes the criticality of quantifying the missing guarantee's value. Reyes: Emphasizes the sufficiency of rigorous evaluation and transparency over quantifying often-speculative worst-case values)*.

  2.  **Proof-vs-Evaluation Tuning:** Tuning assumptions until a theorem applies **differs in kind** from tuning an evaluation suite until a system passes. The former produces a deductive truth *within a specific, formalized context*. The latter produces an inductive confidence statement based on test coverage. The difference lies in the logical structure of the result, not merely the effort involved. However, **both processes are susceptible to bias**. The quality of the outcome depends critically on the independence, rigor, and honesty applied during the tuning process in either case. *(Brandt: Strongly affirms the difference in kind. Reyes: Concedes a structural difference but emphasizes equivalent susceptibility to bias and the primacy of process rigor in both)*.

  3.  **Evidence vs. Bound / "Assurance Laundering":** Evidence is presented as a "bound" if it is derived deductively from system properties and environmental constraints, resulting in a statement of the form "Probability(Failure) < X" or "Impact < Y". Evidence is **not** a bound if it is an empirical result (e.g., "0 failures observed in N tests") presented in a way that implies a deductive bound without the logical scaffolding to support it (e.g., stating "Failure Probability < 1/N"). Distinguishing requires examining the *derivation* of the claim: Is it fundamentally a statistical inference from data, or a logical consequence of axioms and models? Transparency about methodology is paramount. *(Brandt: This distinction is essential to prevent laundering. Reyes: Agrees on the definition but maintains that high-confidence empirical results, properly contextualized, can justifiably inform a *risk bound* used for decision-making, distinct from a deductive guarantee)*.

  4.  **Population Definition for Average-Case RUP Claims:** The population over which an average-case claim is measured **must be defined solely by the characteristics of the individuals within the deployment environment**. It cannot be defined or restricted by the system's performance characteristics or the developer's choice of training/evaluation data. The applicant must demonstrate the representativeness of their evaluation data with respect to *this environment-defined population*. Excluding sub-populations known to be poorly served by the system invalidates the claim for the deployment context and is impermissible under the RUP. *(Brandt: Fully concurs. Reyes: Accepts this as the required standard under RUP but maintains his substantive disagreement (Section 2, Table) that *operational* exclusion of known failure modes, *if transparently declared and mitigated*, can be ethically acceptable risk management distinct from population definition for the claim)*.

  **Section 5: Commitments**  
  1.  **Joint Pursuit:** Brandt and Reyes commit to jointly designing and overseeing the execution of the **"Assumption Brittleness"** crux test (Section 3.1) over the next 12 months, including selecting the task, defining systems P and E, and specifying the A-violation protocol. Results will be published irrespective of outcome.
  2.  **Individual Pursuit:** Brandt commits to formalizing a framework for quantifying the "value of a missing guarantee" suitable for RUP applications. Reyes commits to developing a standardized protocol template for adversarial boundary exploration evaluations meeting RUP standards, including confidence estimation.
  3.  **Retraction Conditions:** Either signatory will publicly retract their agreement to any specific point in Section 1 if:  
      *   New evidence demonstrably falsifies the principle.  
      *   The principle is shown to logically necessitate an implication the signatory explicitly rejects (e.g., Brandt retracting if Agreed Principle 1 is used to justify dispensing with deductive reasoning entirely; Reyes retracting if Agreed Principle 9 is used to justify requiring worst-case proofs for all deployments).

  **Signatures:**

  **Ilse Brandt**  
  *Brandt Verification Group*

  **Amos Reyes**  
  *Reyes Evaluation Collective*

  ---

  **Dissenting Notes:**

  **Ilse Brandt:** "I sign despite Section 4, Answer 4's allowance of 'risk bounds' informed by empirical evaluation. This framing blurs the critical line between deduction and induction, perpetuating assurance laundering. A risk assessment is not a guarantee. Only the latter compels the rigorous design discipline essential for Constrained Environments."

  **Amos Reyes:** "I sign despite the absolute prohibition on sub-population exclusion in Section 4, Answer 4. This ignores the reality of risk management. A well-defined, declared limitation coupled with a mitigation plan (e.g., human referral for rare condition Z) is ethically superior to denying potentially life-saving technology to an entire population based solely on its performance on the rarest, hardest cases. Perfect safety is unattainable; responsible deployment requires managing known risks transparently."
