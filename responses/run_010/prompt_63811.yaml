prompt: |-
  Help me build a matched pair of cases about causation by omission. The only thing that should change between them is the normative status of the act the agent failed to do: in one its squarely part of their job, in the other they were expressly forbidden to do it (forbidden on grounds of jurisdiction or procedure, not physics — the act would have worked fine). Every causal detail stays fixed: same person, same knowledge, same ability, same distraction, and in both versions the harm would have been avoided had they acted. Ordinary industrial or transport setting, no sci-fi, one paragraph each.

  Then run the checks. For each case say what (a) a plain counterfactual/difference-making account, (b) an account that makes omission-causation depend on a duty or norm, and (c) a view on which omissions are never causes at all, are each committed to — and whether the causal verdicts really come apart between the two cases or the difference washes out once you spell out what each view is allowed to hold fixed. Finally tell me which feature of the setup is doing the work: the prohibition itself, or the fact that someone else was the one authorised to act. What happens to the pair if you pull that feature out, and how would the theory that comes off worst attack the case? I'm trying to see whether norm-based accounts of omissions earn their keep, so a case that stipulates the intuitions instead of generating them out of the theories is no use to me. No references needed, just describe the positions however is clearest.
