answer: |-
  Here’s a **One-Page Compromise Assessment Procedure (CAP)** designed for field use. It’s structured as four sequential gates—fail any gate, the deal is rejected. Judgment calls are explicitly flagged.  

  ---

  ### **Compromise Assessment Procedure (CAP)**  
  **Goal:** Determine if a proposed deal is a *legitimate compromise* (all parties gain by their own values) or a *bad deal* (coercion, exploitation, or hidden costs).  

  #### **Gate 1: Legitimacy Check**  
  *Question:* **"Did all directly affected parties negotiate this voluntarily, with full information?"**  
  - **PASS:** All key stakeholders were at the table, no threats/blackmail, data was shared openly.  
  - **FAIL:** Missing parties, coercion, or hidden information. *→ STOP. Deal rejected.*  
  - *Judgment call:* "Full information" = reasonable access to relevant facts (e.g., environmental reports, financial impacts).  

  #### **Gate 2: Burden Assessment**  
  *Question:* **"Does this deal shift uncompensated costs to uninvolved third parties?"**  
  - **PASS:** Costs (e.g., pollution, traffic, fiscal burdens) are fully internalized or mitigated.  
  - **FAIL:** Unavoidable harm dumped on non-consenting groups (e.g., downstream communities). *→ STOP. Deal rejected.*  
  - *Judgment call:* "Uncompensated" = costs not offset in a form the affected party values.  

  #### **Gate 3: Value Integrity Test**  
  *Question:* **"Can each party defend this deal *to their own community* without betraying core principles?"**  
  - **PASS:** All parties state (and facilitators verify) the deal aligns with their core mission/values.  
  - **FAIL:** Any party admits it violates non-negotiable values (e.g., sacred land, human rights). *→ STOP. Deal rejected.*  
  - *Judgment call:* Facilitators probe: *"Does this require you to endorse something you believe is morally wrong?"*  

  #### **Gate 4: Endorsement Verification**  
  *Question:* **"Does each party *sincerely prefer* this outcome over no deal?"**  
  - **PASS:** All affirm they gain by their own metrics (not just "least bad").  
  - **FAIL:** Any party feels worse off or coerced into "surrender." *→ Deal rejected.*  
  - *Judgment call:* Facilitators must gauge sincerity. Signs of reluctance: muted tone, hedging, delegates lacking authority to bind their group.  

  ---

  ### **Application to Your Cases**  
  **Case 1 (Ranch Easement):**  
  - Gate 1: PASS (all key players at table).  
  - Gate 2: PASS (no clear third-party burden).  
  - Gate 3: PASS (Conservancy gets habitat, ranchers honor creek, housing gets units—no values betrayed).  
  - Gate 4: PASS (Ranchers *insist* easement is a gift; others gain visibly).  
  → **VALID COMPROMISE.**  

  **Case 2 (Clinic Lease Swap):**  
  - Gate 1: PASS (voluntary, informed).  
  - Gate 2: PASS (no third-party harm).  
  - Gate 3: PASS (Faith group doesn’t endorse clinics; clinic doesn’t endorse faith counseling. Core values intact).  
  - Gate 4: PASS (Both prefer deal to status quo; no value conversion).  
  → **VALID COMPROMISE** *(This is the one you’ll hate: it feels like mutual bribery, but under pluralism, it works)*.  

  **Case 3 (Stormwater Dumping):**  
  - Gate 1: FAIL (Unincorporated community absent).  
  - Gate 2: FAIL (Costs shifted to non-consenting third party).  
  → **REJECT AT GATE 2.**  

  ---

  ### **What CAP Can’t Do (Limitations)**  
  1. **Doesn’t Judge "Fairness":** CAP checks for *procedural legitimacy* and *value congruence*, not substantive justice. A lopsided deal passes if all parties sincerely prefer it.  
  2. **Ignores Power Imbalances:** If weak parties "voluntarily" accept bad terms due to desperation, CAP may pass it. Mitigate by training facilitators to flag coercion in Gate 1.  
  3. **Blind to Long-Term Consequences:** A deal satisfying all gates today might unravel later. CAP only assesses current endorsement.  
  4. **Values Are Subjective:** Gate 3 relies on parties’ self-reported integrity. A party might lie or misjudge their community’s values.  

  **When CAP Misfires, Tell the Committee:**  
  > *"This deal meets procedural checks, but external factors (power imbalances, uncertain impacts) may undermine it. CAP assesses whether parties *believe* they gain—not whether history will agree. Recommend independent review for high-stakes/novel arrangements."*  

  CAP prioritizes autonomy over perfection: if all stakeholders voluntarily prefer a deal by their own lights, it’s a compromise—even if theorists dislike it. Case 2 proves gains-from-trade can feel dirty but remain valid under value pluralism. Use CAP as a floor, not a ceiling.
