prompt: |-
  I have been asked at short notice to cover two fifty-minute sections of our first-year epistemology module, taking over the unit on the classical Indian theory of the pramāṇas from a colleague who is on leave. My own research is on testimony and epistemic deference in the analytic tradition, so I am not a Sanskritist and I know Nyāya only at survey level. The unit has gone badly twice running: the evaluations said it felt like religious studies, and one student wrote that the school was simply instructing us to trust priests. I said something close to that myself as a graduate student, and last week, sitting beside my father while a specialist explained a diagnosis that neither of us could have derived from the published statistics we had both been reading, I noticed how little purchase my own reduction of testimony to inference has on the cases that actually matter to me. I want these two sessions to make the Nyāya claim about testimony feel like a live philosophical position rather than an article of faith.

  What I need from you is not an explanation of the material but a plan for how I should explain it. Set out the order the pieces must go in across the two sessions and what depends on what — I assume the students cannot take the question of whether testimony is a pramāṇa seriously until they grasp what a pramāṇa is supposed to be, and that the rival counts across the schools (one for Cārvāka, two for the Buddhists, four for Nyāya, six for Mīmāṃsā) are what turn the list from a catalogue into a set of argued claims. Identify the single example that should carry the argument about testimony, and say what that example must have and must lack in order to resist being reconstructed as an inference about the speaker's reliability. Do not build the session on the wild-ox case for upamāna; I have watched it slide into a seminar about metaphor. Map the misconceptions the students will arrive with or form on the spot — that a pramāṇa is a piece of evidence rather than a causal instrument, that testimony is inference under another name, that the soteriological framing of the school means its epistemology is not really epistemology, that memory and doubt ought to be on the list — and tell me the precise point in the sequence at which each should be headed off, including how to use the Hume-style reduction they will instinctively reach for without letting my sessions collapse into the deference debate I already teach elsewhere in the term. Give me one question I can put to them at the end that separates those who have grasped the irreducibility claim from those who have merely memorised four names. Tell me what to cut and to announce that I am cutting: I suspect the doctrine that validity is extrinsic to a cognition, the modes of sense-object contact, and the postulation and non-apprehension pramāṇas, but I want your judgement on whether any of these is load-bearing for what I am trying to do. The reading pack is fixed, so please recommend no sources and cite no texts. Finally, since I have no way of checking your scholarship: state how confident you are in each substantive claim you make about the tradition, and single out the point at which you are most likely to be wrong or to have imported an analytic category where it does not belong.
reasoning: |-
  Okay, the user is in a tight spot—covering two sessions on Nyāya epistemology's pramāṇas with zero prep time and limited background. They’re an analytic epistemology specialist thrown into classical Indian philosophy, and past iterations flopped because students dismissed it as "religious studies" or blind trust in priests. Their personal anecdote about medical testimony reveals a deeper goal: making Nyāya’s testimony theory feel like a *live option*, not dogma.  

  First, the core challenge: Students (and the user’s past self) reduce śabda (testimony) to inference. Nyāya insists it’s irreducible. The user needs a surgical plan to dismantle this reductionism without drowning in Sanskrit minutiae or veering into deference debates. Key constraints: no wild-ox examples (avoids metaphor tangents), fixed readings, and skepticism about soteriology overshadowing epistemology.  

  Hmm, their hidden worry is credibility. They’re not a Sanskritist, so they’re anxious about misrepresenting Nyāya. They explicitly ask for confidence ratings—smart move. I’ll flag where my own knowledge is shakiest (probably tattvajñāna’s role).  

  The plan must:  
  1. **Anchor pramāṇa as causal instrument first**—not evidence. Students’ "evidence" misconception will warp everything. Use the clay-pot-perception analogy early.  
  2. **Pit schools against each other**. The rival pramāṇa counts (Cārvāka 1 vs. Nyāya 4) show these are argued claims, not arbitrary lists.  
  3. **Choose one killer example for testimony**. Criteria:  
     - Must lack prior exposure to the speaker (blocks reliability inference).  
     - Must be non-derivable (unlike the medical stats anecdote).  
     - "Unfamiliar birdcall" works: You hear "That’s a hoopoe!" from a stranger. No basis to infer competence; you just *get* the knowledge.  
  4. **Preempt misconceptions at precise moments**:  
     - "Soteriology ≠ theology" when introducing Nyāya’s aims.  
     - Shut down "memory/doubt as pramāṇa" when listing the four.  
     - Crush the Humean reduction when dissecting the birdcall example.  
  5. **Sacrifice doctrines ruthlessly**. Cut modes of sense-contact, extrinsic validity—they’re not load-bearing here. Postulation (arthāpatti) might confuse; non-apprehension (anupalabdhi) is safe to axe.  

  Final diagnostic question: "If a child learns 'whales are mammals' from a teacher, is their knowledge structurally identical to inferring the teacher’s reliability?" Reductionists will say yes; Nyāya graspers will spot the absence of premise-stitching.  

  Biggest risk: Over-assimilating śabda to "testimony" as analytic debates frame it. Nyāya’s "speaker with valid cognition" condition isn’t just about reliability—it’s metaphysical. I’m 85% confident, but that’s the slippery slope.  

  ...Time to structure this like a siege engine.
answer: |-
  Here is a meticulously sequenced plan for two 50-minute sessions, designed to foreground Nyāya’s testimony theory as a philosophically rigorous position. It preempts common pitfalls, leverages your analytic strengths, and isolates the irreducibility claim. Confidence ratings (CR: 1-10, 10=highest) accompany key claims.

  ---

  ### **Overarching Structure**
  **Core Objective:** Establish *śabda* (testimony) as irreducible to *anumāna* (inference).  
  **Anchor Example:** **"Unfamiliar Birdcall"** (CR: 9).  
  *Setup:* A botanist points to a unique bird in a remote forest and says, "That’s a *hoopoe*!" You have:  
  - No prior exposure to hoopoes or this speaker.  
  - No observable features linking "hoopoe" to known birds (blocks inference from characteristics).  
  - No time to assess speaker reliability (blocks inference from credentials).  
  *Why it works:* Knowledge arises *immediately* from comprehension of the utterance—without intermediate premises.  

  ### **Session 1: What is a *Pramāṇa*? Framing the Battlefield**  
  *(45 mins + 5-min buffer)*  
  1. **Opening Hook (5 mins)**  
     - Use your diagnosis anecdote: "Last week, I *knew* my father’s diagnosis solely because the specialist said so—despite having all the stats. How did that work?"  
     - Contrast with Hume: "Hume says testimony reduces to inference about speaker reliability. Does that capture *this*?"  

  2. ***Pramāṇa* ≠ "Evidence" (10 mins)** (Preempts "evidence" misconception)  
     - Define *pramāṇa* as **"causal instrument generating *non-defective* knowledge"** (CR: 10).  
     - Analogize: Just as eyes (*perception*) *cause* you to see a clay pot, a *pramāṇa* *causes* knowledge.  
     - Stress: It’s not a "clue" (evidence) but a *knowledge-source*.  

  3. **Why Schools Disagree on the Count (15 mins)** (Makes lists philosophical)  
     - Display rival counts (Cārvāka:1, Buddhists:2, Nyāya:4, Mīmāṃsā:6).  
     - **Key Move:** These are *competing explanations* for knowledge-acquisition.  
       - Cārvāka: Only perception is trustworthy (CR: 9).  
       - Buddhists: Add inference; testimony is reducible (CR: 9).  
       - Nyāya/Mīmāṃsā: Testimony is *sui generis* (CR: 10).  
     - **Preempt "soteriology" pitfall:** "Nyāya seeks *tattvajñāna* (truth-knowledge)—not theology. Its epistemology grounds debates about medicine, law, and everyday claims" (CR: 8).  

  4. **Nyāya’s Four *Pramāṇas* (15 mins)** (Preempts memory/doubt misconception)  
     - List: *Pratyakṣa* (perception), *Anumāna* (inference), *Upamāna* (comparison), *Śabda* (testimony).  
     - **Crucial Exclusion:** Memory (*smṛti*) is *not* a *pramāṇa*—it recalls knowledge but doesn’t *generate* it (CR: 10). Doubt (*saṃśaya*) is a knowledge-defect.  

  ---

  ### **Session 2: *Śabda* as Irreducible**  
  *(45 mins + 5-min buffer)*  
  1. **Testimony Reduction Challenge (10 mins)**  
     - Present Humean reduction: "We trust testimony because we infer speakers are reliable."  
     - **Birdcall Example:** "In the forest, did you *infer* the botanist’s reliability? Could you?" Highlight lack of premises.  

  2. **Nyāya’s Conditions for *Śabda* (15 mins)**  
     - Knowledge from *śabda* requires:  
       1. A competent speaker (*āpta*) who *knows* the truth (CR: 9).  
       2. A correctly formed utterance (*śabda*).  
       3. Comprehension (*śābda-bodha*) by the hearer.  
     - **Stress:** The *hearer* doesn’t need to *verify* competence—knowledge arises from comprehension *if* conditions (1)-(2) hold (CR: 8).  

  3. **Irreducibility Demonstrated (15 mins)**  
     - Contrast with inference: Inference requires *vyāpti* (universal premise) and *parāmarśa* (application to a case).  
     - **Birdcall Breakdown:**  
       - No *vyāpti* (e.g., "Botanists always tell truth" – unavailable).  
       - No *parāmarśa* (e.g., "This person is a botanist, so..." – absent).  
       - **Conclusion:** *Śabda* delivers knowledge *without* inferential steps (CR: 9).  

  4. **Diagnostic Question (5 mins)**  
     - **"Can a hearer gain knowledge from testimony *without* mentally reconstructing the speaker’s reliability? If yes, how? If no, why not?"**  
       - *Memorizers*: Parrot Nyāya’s conditions.  
       *Graspers*: Cite immediacy/comprehension vs. inferential labor.  

  ---

  ### **What to Cut (With Justification)**  
  - **Extrinsic validity (*parataḥ prāmāṇya*)** (CR: 7): Load-bearing for Nyāya globally, but not essential for *śabda*’s irreducibility.  
  - **Modes of sense-object contact (*sannikarṣa*)** (CR: 10): Critical for perception but tangential here.  
  - **Postulation (*arthāpatti*) & Non-apprehension (*anupalabdhi*)** (CR: 9): Mīmāṃsā’s additions; cutting avoids clutter.  
  - **Announce:** "We’re focusing solely on *śabda*’s structure—omitting validity theories and other *pramāṇas* for depth."  

  ---

  ### **Critical Preemptions & Timing**  
  | **Misconception** | **When to Preempt** | **Response** |  
  |-------------------|---------------------|--------------|  
  | "*Pramāṇa* = evidence" | Session 1, Step 2 | Contrast causal instrument vs. passive evidence. |  
  | "Testimony = inference" | Session 2, Step 1 | Birdcall example blocks premises. |  
  | "Soteriology ≠ epistemology" | Session 1, Step 3 | Emphasize *tattvajñāna* as truth-seeking. |  
  | "Memory/doubt are *pramāṇas*" | Session 1, Step 4 | Exclude them as non-generative. |  
  | Humean reduction | Session 2, Step 1 | Use Birdcall to show immediacy. |  

  **Deference Debate Avoidance:** Frame *śabda* as about *knowledge-generation mechanics*, not *whom* to trust. Stress speaker competence (*āpta*) is a *condition*—not the *mechanism* (which is comprehension).

  ---

  ### **Highest Risk Point**  
  **Claim:** "Knowledge arises from *comprehension alone* if speaker/utterance conditions hold—no reliability inference needed."  
  - **Confidence:** CR: 8  
  - **Risk:** Modern analytic readings may overemphasize the *āpta* (competent speaker) as inviting a reduction. Nyāya is clear that *śābda-bodha* (verbal comprehension) is the proximate cause, but secondary sources sometimes blur this.  
  - **Why it might be wrong:** If later Nyāya (e.g., Gaṅgeśa) subtly psychologizes the process. Your fixed readings will determine this.  

  **Category Import Risk:** Treating *śabda* as identical to "testimony" in analytic epistemology. *Śabda* includes Vedic texts but is *not* limited to them (CR: 10)—your Birdcall example avoids this.  

  ---  
  **Final Tip:** Use whiteboard diagrams:  
  1. Draw inference as a multi-step chain (premises → conclusion).  
  2. Draw *śabda* as a direct arrow: "Utterance → Comprehension → Knowledge".  

  This visual contrast will cement the irreducibility claim. You’ve got this—your self-awareness about the "live position" goal is half the battle.
