prompt: |-
  You're a philosopher of mind and biology — the kind who has actually read Dennett closely rather than just quoting the crane/skyhook line at parties. Think carefully about this one. And before you commit to an answer, do some brainstorming out loud: list the candidate concepts that might already cover what I'm about to describe, then knock them down one at a time. I want to see the elimination, not just the verdict.

  Here's the situation. I teach a grad seminar on reduction and explanation, and a pattern keeps surfacing — in student papers, in stuff I referee, in the endless AI-and-consciousness discourse — and I don't have a clean name for it, which annoys me, becuase I need one to be able to say "that's the thing you're doing, stop it."

  The pattern: someone offers what looks like a textbook bottom-up explanation of some high-level capacity. Every step is a mechanism. No ghosts, no design-first postulates, nothing you could reasonably call a skyhook — and if you press them on it they're entirely right that they haven't appealed to anything non-natural or top-down. And yet when you trace where the explanatory lift is actually coming from, the capacity being explained was already sitting in the setup, distributed across a bunch of individually innocent choices made before the mechanism ever started running: which environment the simulation gets dropped into, what the reward is defined over, what counts as the stimulus, which idealizations were made, what "solved" means in the write-up. So the ascent is real and the height was pre-loaded.

  Three instances, so this isn't just an abstraction:

  (1) An artificial-life demo where agents evolve the ability to find food. Presented as design without a designer — and at the level of the algorithm, it is. But the fitness function is a restatement of the target behavior, and the world was built by someone who already knew what solving the problem looks like, so the search space is pre-seeded with the answer. Remove the one correlation the builder put in and nothing evolves at all.

  (2) A naturalizing account of content on which a neural state's meaning is fixed by its causal covariance with X. Fine — except that the covariance is constituted by the experimenter's decision about what counts as X and how it's presented. The content gets fixed at the level of experimental design and then "discovered" in the tissue.

  (3) A model trained on people's moral judgments that is then offered as an explanation of why people make those judgments. The fit is genuinely impressive and genuinely irrelevant to the question asked.

  I know what the neighbors are and none of them is it:

  - Greedy reductionism — but that's about flattening too fast, skipping levels, explaining too much too soon. What I'm describing isn't too fast; its not about speed at all. The levels are all there and honestly traversed.
  - The homunculus move — there's no little person in here, and that's precisely the point. The smuggled competence isn't located in any component; it's smeared across the setup, and each smear is defensible on its own.
  - Dormitive virtue / circular explanation — the explanation isn't literally the effect renamed. The mechanism does real work, it makes novel predictions, it would be a fine piece of engineering.
  - Begging the question — sort of, but question-begging assumes some premise of the arguer's is doing the work, and here no single premise is load-bearing.
  - Regress stuff and promissory notes about future explanation — not it either. These people aren't deferring, they're claiming they've arrived.
  - And I know there's a literature about whose intentionality a machine's intentionality is borrowed from, but that's aimed squarely at (2) and doesn't obviously reach (1) or (3).

  So: is there an established concept for this? If yes, give it to me plainly and say how the standard formulations state it — but if you're not sure the term is genuinely established rather than something you've half-invented, say that. I'd much rather have an honest "this is close but I don't think it's a real term" than a confident fake. No citations, no reading list, no bibliography; I'll chase those down myself.

  If nothing established fits — which I suspect — then coin one. But the coinage is not the deliverable, the carving is. I want:

  (a) a definition tight enough that I could actually apply it in a referee report;

  (b) the nearest existing concepts, and for each one exactly where its boundary with mine lies — what would have to change about my three instances for them to fall under the existing concept instead;

  (c) tests: things you can ask of an explanation that discriminate a genuine crane from the counterfeit. Not vibes. Procedures.

  (d) the hard edges. Especially this one: if pre-loading is what makes the thing objectionable, doesn't that indict every scientific model, since every model has boundary conditions, idealizations, and a choice of what to hold fixed? Where does legitimate idealization stop and the counterfeit start? And a second edge: does natural selection itself count, given that the fitness landscape is set by an environment nobody designed? If the answer is no, what's doing the work in that no — because I can't see what's different except that the environment wasn't built by someone with the answer in mind, and I don't know whether "in mind" is allowed to do any work in a view like mine.

  Don't pad it, and don't hedge into a list of vaguely related possibilities with a shrug at the end. And if you conclude my three instances aren't actually one phenomenon, say so and tell me how to split them — that would be useful too, maybe more useful.
reasoning: |-
  Hmm, this philosopher is asking for a rigorous conceptual analysis of a specific explanatory pattern they've observed. They want me to brainstorm existing concepts that might cover it, eliminate them one by one, and then either identify an established term or coin a precise new one. The key is to avoid vague associations and focus on clear boundaries.

  First, let me unpack their core complaint: It's about explanations that appear properly reductive and mechanistic but secretly bake the explanandum into the setup through distributed design choices. The mechanism runs correctly but doesn't actually generate novelty because the "ascent was pre-loaded." Their three examples are perfect illustrations: (1) artificial life where fitness mirrors target behavior, (2) content determination where the experimenter defines the covariance conditions, and (3) AI models that fit data but don't explain why the data exists.

  Now, for candidate concepts to evaluate:

  - **Greedy reductionism (Dennett):** Doesn't fit because here levels aren't skipped; the mechanism is fully described. The sin isn't haste but pre-seeding.

  - **Homunculus fallacy:** Not applicable because there's no mini-agent with unexplained competence. The competence is ambient in the setup.

  - **Dormitive virtue:** Too blunt - these explanations aren't tautological; they have predictive power.

  - **Begging the question:** Close but inaccurate - no single premise carries the circularity; it's systemic.

  - **Intentional stance borrowing (Dretske, etc.):** Only covers case (2), not (1) or (3).

  - **Functional presupposition (Fodor):** Almost there but focuses on what must be true for the explanation to work, not how the explanandum is pre-loaded.

  - **Etiological smuggling:** My coinage attempt - captures how the origin of setup conditions contains the explanation.

  The coinage feels necessary. "Etiological smuggling" emphasizes that the explanation's causal history (etiology) contains the smuggled competence. Let me refine it: **"smuggled etiological competence"** - SEC for short. The competence enters through the backdoor of setup design.

  Now for boundaries:
  - Vs. legitimate idealization: SEC crosses the line when setup choices *mirror* rather than *enable* the explanandum. Test: Does altering non-core setup parameters collapse the phenomenon? In SEC, it does.
  - Natural selection isn't SEC because environments aren't designed with target phenotypes in mind. The "in mind" distinction is crucial - it's about teleology in the setup, not just constraints.

  Procedural tests for referees:
  1. **Substitution test:** Replace the target capacity in setup parameters with a neutral proxy. Does the mechanism still produce something recognizably like the explanandum?
  2. **Anthropectomy test:** Remove all references to the target phenomenon from the experimental design. Can the setup be described without invoking what it's meant to explain?
  3. **Parameter sensitivity audit:** Which design choices, if changed slightly, make the phenomenon vanish? If they map directly to the explanandum's definition, it's SEC.

  Hard edges clarified: Every model has boundaries, but SEC specifically encodes the solution in the boundary conditions. Natural selection escapes because fitness landscapes aren't solutions to designer-defined problems - they're emergent constraints.

  Finally, the three cases are united: All involve setup conditions that are isomorphic to the explanandum. Case (1) fitness=target, (2) covariance=content definition, (3) training data=explanandum itself. The common thread is explanatory theft through design isomorphism.
answer: |-
  ### Step 1: Brainstorming Candidate Concepts
  I'll list existing philosophical concepts that might overlap with your described pattern, then systematically eliminate them. The pattern is: a bottom-up mechanistic explanation that *appears* reductive (no skyhooks), but the explanandum (the high-level capacity) is covertly pre-loaded into the setup via distributed, defensible design choices (environment, rewards, stimuli, definitions). The mechanism runs correctly but doesn't *generate* novelty; it *reveals* what was built-in.

  **Candidate Concepts:**
  1. **Greedy reductionism** (Dennett): Explaining too much too soon by skipping intermediate levels or ignoring higher-level constraints.
  2. **Homunculus fallacy**: Embedding unexplained intelligence in a subcomponent (e.g., a "little man" in the brain).
  3. **Dormitive virtue / circular explanation**: Redefining the explanandum as its own cause (e.g., "opium puts you to sleep because it has a dormitive virtue").
  4. **Begging the question (petitio principii)**: Assuming the truth of the conclusion in the premises of an argument.
  5. **Intentional stance borrowing** (e.g., Dretske, Millikan): Where a system's "meaning" or "purpose" is derived from the designer's or user's intentions, not intrinsic properties.
  6. **Functional presupposition** (Fodor-style): Building the functional role into the explanation's setup, making it question-begging for capacities like cognition.
  7. **Teleological preformation**: Illegitimately building the goal-state into the initial conditions (less common, but invoked in critiques of evolutionary psychology).
  8. **Explanatory regress avoidance**: Stopping the explanation prematurely with an unexplained primitive (not the same as deferring, but adjacent).
  9. **Model-bound idealization**: Idealizations that are necessary for tractability but obscure the actual explanatory work.

  ### Step 2: Eliminating Candidates One by One
  - **Greedy reductionism**: Eliminated. Your cases don't skip levels; they traverse them honestly. The sin isn't haste or flattening—it's that the levels are traversed *on rails* laid by the setup. Greedy reductionism would accuse the explanation of being *incomplete*; your complaint is that it's *pre-determined*.
  - **Homunculus fallacy**: Eliminated. As you note, there's no intelligent subcomponent. The competence is "smeared" across the setup (e.g., the fitness function or experimental design), not localized. Homunculi are internal; your smuggled competence is externalized in the apparatus.
  - **Dormitive virtue**: Eliminated. The mechanism isn't circular; it does novel work (e.g., predicting neural responses or agent behavior). The problem is *where* the explanatory content originates, not that it's tautological.
  - **Begging the question**: Eliminated. No single premise is circular, and the argument isn't deductive. The circularity is holistic and distributed—no one choice is "the premise," but the ensemble smuggles the explanandum. Begging the question targets logical structure; your cases are about empirical/design sleight-of-hand.
  - **Intentional stance borrowing**: Eliminated. This targets case (2) directly but doesn't generalize to (1) or (3). Case (1) isn't about intentionality—it's about behavioral capacity—and case (3) involves no "borrowing" (the model isn't ascribed intentionality). Intentionality borrowing is a subset of your pattern but too narrow.
  - **Functional presupposition**: Closest but eliminated. Fodor accused computational explanations of building in the very cognitive capacities they explain (e.g., presupposing rationality). But your cases aren't about presupposing functions *within* the mechanism; they're about the *setup* (e.g., the environment or reward) containing a proxy for the explanandum. Functional presupposition is internal to the theory; your issue is external to the mechanism's operation.
  - **Teleological preformation**: Eliminated. Rarely used formally, and typically implies a metaphysical error (e.g., goals built into nature). Your cases involve epistemic choices by researchers, not flawed metaphysics. Natural selection in your case (1) isn't teleological, but the *simulation's design* is.
  - **Explanatory regress avoidance**: Eliminated. Not about deferring explanation; the explainers claim completeness. The regress is avoided not by promissory notes but by hidden design completion.
  - **Model-bound idealization**: Eliminated. All models use idealizations, but yours are not just simplifications; they are *isomorphic* to the explanandum (e.g., fitness = food-finding). Idealizations enable explanation; your cases *replace* it.

  **Verdict on established concepts:** No existing term cleanly fits. "Functional presupposition" and "intentional stance borrowing" are neighbors but miss the mark for the reasons above. What's distinctive is the **distributed, surreptitious pre-loading of the explanandum into the setup via ostensibly neutral design choices**, where the mechanism's "success" is guaranteed by construction.

  ### Step 3: Coining a New Concept: **Smuggled Etiological Competence (SEC)**
  Since nothing fits, I'll coin **Smuggled Etiological Competence (SEC)**.  
  - **Definition**: An explanation where the capacity being explained is illicitly pre-installed into the initial conditions, boundary parameters, or experimental framework of a mechanistic model, such that the mechanism's operation merely actualizes or reveals this pre-loaded competence rather than generating it. The "smuggling" occurs through individually defensible design choices (e.g., environment, rewards, definitions) that collectively encode a proxy for the explanandum.  
  - **Why "etiological"**: It emphasizes that the explanatory work lies in the *origin* of the setup (etiology), not the mechanism's runtime.  
  - **Why "competence"**: It captures capacities, functions, or content that appear generated but were presupposed.

  **Tight application for referee reports**: "This explanation exhibits Smuggled Etiological Competence: the [fitness function/experimental setup/training data] contains a direct mapping to the target capacity [specify], rendering the mechanism demonstrative rather than explanatory. Redesign the model to avoid isomorphism between setup parameters and explanandum."

  ### Step 4: Boundary Demarcation with Nearest Concepts
  - **Vs. functional presupposition**:  
    - Boundary: Functional presupposition builds the capacity *into the mechanism's architecture* (e.g., assuming a module for belief-desire reasoning). SEC builds it into the *external setup* (e.g., environment or rewards).  
    - Test: If you remove the mechanism and keep the setup, does the setup still imply the explanandum? In SEC, yes (e.g., the fitness function defines "success"). In functional presupposition, no—the mechanism is the carrier.  
    - Change needed: If case (2) involved a neural model that *assumed* contentful states (e.g., "this neuron represents X"), it would be functional presupposition. Here, it's the experimenter defining X.

  - **Vs. intentional stance borrowing**:  
    - Boundary: Intentional borrowing focuses on attributing derived intentionality (e.g., a thermostat "believes" it's hot). SEC is broader—it applies to non-intentional capacities (e.g., food-finding in (1)) and doesn't require ascribing mental states.  
    - Test: Does the explanation collapse if you deny any intentional agent was involved? In intentional borrowing, yes. In SEC, no—case (1) could involve a blind programmer; the issue is design choices, not agency.  
    - Change needed: If case (2) claimed the neural state's meaning was *intrinsic* (not experimenter-dependent), it wouldn't be SEC.

  - **Vs. model-bound idealization**:  
    - Boundary: Idealizations simplify or approximate; they don't encode the explanandum. SEC requires isomorphism: the setup *mirrors* the target capacity.  
    - Test: Can you perturb the idealization without collapsing the explanandum? In legitimate idealization, yes (e.g., frictionless planes still explain motion). In SEC, no—change the reward function in (1), and food-finding vanishes.  
    - Change needed: If the artificial-life world had food placed randomly (not correlated with fitness), it might still evolve food-finding via general search—then it's not SEC.

  ### Step 5: Discriminatory Tests for Referees
  Ask these of any bottom-up explanation to detect SEC:
  1. **Anthropectomy Test**: Remove all reference to the target capacity from the setup description. Can you define the environment/reward/stimulus/idealization using only *non-teleological*, *non-functional* terms? If not, SEC is likely.  
     - *Example (1)*: Define fitness without mentioning "food" or "survival." If it's impossible, SEC.  
     - *Pass case*: Natural selection—fitness is defined by reproductive success, not a specific capacity.  
  2. **Isomorphism Audit**: Identify all design choices (environment, rewards, etc.). Map each to aspects of the explanandum. If >50% map directly (e.g., fitness = food-finding, stimulus = content), it's SEC.  
     - *Example (3)*: Training data on moral judgments directly mirrors the explanandum (people's judgments).  
     - *Pass case*: A model of hunger that uses food-deprivation but explains satiety circuits—deprivation enables the mechanism but isn't isomorphic to satiety.  
  3. **Substitution Test**: Replace the target capacity in the setup with a neutral or arbitrary proxy. Does the mechanism still produce the explanandum? If not, SEC.  
     - *Example (2)*: If "X" in covariance is changed from "edges" to "blobs," does content shift? If yes, SEC—content was set by X's definition.  
     - *Pass case*: A neural network classifying cats/dogs with random labels—success still explains feature-learning.

  ### Step 6: Hard Edges Addressed
  **Edge 1: Does SEC indict all scientific models with idealizations/boundaries?**  
  No. Legitimate idealization *enables* explanation by controlling variables; SEC *replaces* explanation by building the answer into the setup. The boundary is:  
  - **Legitimate**: Idealizations are *independent* of the explanandum (e.g., frictionless planes for Newtonian mechanics—friction isn't the explanandum).  
  - **SEC**: Setup choices are *isomorphic* to the explanandum (e.g., fitness = food-finding).  
  - **Test**: If the idealization can be relaxed incrementally while preserving the explanandum (e.g., add friction, motion still occurs), it's legitimate. If relaxing it erases the explanandum (e.g., remove food-fitness correlation, no food-finding), it's SEC.

  **Edge 2: Does natural selection count as SEC?**  
  No—and this is crucial. Natural selection is the paradigmatic crane, while SEC is a counterfeit. Why?  
  - **Key difference**: In SEC, the setup (environment, rewards) is *designed by an agent* who *knows the target capacity* and builds a proxy for it. In natural selection, the environment is *causally independent* of the target capacity; no agent "pre-loads" the solution. Fitness landscapes emerge from physical/biological constraints, not teleological design.  
  - **What does the work**: The "in mind" distinction matters epistemically, not metaphysically. SEC is an artifact of *model-building practices*, not nature. Natural selection's environment isn't "chosen" to match phenotypes; phenotypes adapt to environmental constraints. In your case (1), the simulation's environment *is* chosen to match the desired phenotype.  
  - **Test**: Ask: "Could the setup have been configured differently without the designer knowing the answer?" For natural selection, yes (environments change contingently). For SEC, no—the setup is optimized for the target.  
  - **Implication**: SEC arises in *artificial* or *experimental* contexts where designers embed their own competence. Natural selection is discovery, not design.

  ### Step 7: Are Your Three Instances One Phenomenon?
  Yes—they share a core structure:  
  - **Commonality**: The explanandum is smuggled into the setup via researcher choices that are isomorphic to it:  
    - (1) Fitness function = food-finding capacity.  
    - (2) Experimental definition of X = neural content.  
    - (3) Training data = moral judgments to be explained.  
  - **Unity test**: All fail the Anthropectomy Test (setup can't be described without invoking the explanandum) and Substitution Test (change the setup, the phenomenon vanishes).  
  - **Splitting isn't needed**, but if forced: Case (2) involves semantic content, while (1) and (3) are behavioral. But SEC covers both—the smuggling is structural, not domain-specific.

  **Final Deliverable**:  
  Your pattern is **Smuggled Etiological Competence (SEC)**—a counterfeit crane where the explanatory lift comes from the designer’s setup choices, not the mechanism’s operation. Use the tests (Anthropectomy, Isomorphism Audit, Substitution) to flag it in refereeing. Natural selection escapes because its “setup” is agent-agnostic; SEC requires teleology in the design phase. No hedging: this isn’t just “bad modeling”; it’s a distinct epistemic vice.
