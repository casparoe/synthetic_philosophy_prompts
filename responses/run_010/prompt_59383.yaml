prompt: |-
  I'm on the ethics consult service at a community hospital, maybe six years in now, and I'd say half my consults end up being about a demented patient who left instructions a long time ago and a family that can't agree about what to do with them. After enough of these I've noticed my own gut calls don't line up into anything I could defend out loud, so instead of agonizing some more I want to write down my verdicts and have someone tell me what principle, if any, they add up to. Case 1: woman signed a directive at 55, very specific, says no feeding tube if she ever reaches late-stage Alzheimer's. She's 84 now, doesn't know her daughter's name, but she's pleasant, eats with real enjoyment, laughs at cartoons, hums along to the radio. Family is split down the middle. My gut: don't act on the directive, and if she stops eating on her own someday that's a separate conversation, but I'm not pointing at a piece of paper from 1998 to justify starving her. Case 2: same woman, same paper, gets a plain pneumonia that two days of antibiotics clears up, and the directive also says no antibiotics in late dementia. My gut flips — I lean toward treating — and I genuinely can't say why treating is different from feeding when the document says the identical thing about both. Case 3: retired cellist who wrote that if he could no longer follow a piece of music he wanted nothing done to prolong him. He can't tell you what a cello is now, but he lights up and beats time on the tray table when somebody puts Bach on. My gut: the trigger never fired, so the directive doesn't apply, even though the disability it described absolutely arrived. Case 4: thirty-year-old, motorcycle, no brainstem function at all, unambiguous directive, parents objecting on religious grounds. My gut: honor it, obviously, honestly no consult needed. Case 5: man with advanced ALS, completely present, jokes with the night staff, by every measure we have he has adapted and is not miserable, and he has a standing request that we help him die, which we won't do. My gut: I'd do it if I were allowed. So 1 and 5 are the pair I can't reconcile — both are people whose present selves seem okay and whose earlier selves asked to be let go, and I come out opposite ways. The difference I reach for is "he's still in there and she isn't," but that seems to cut the wrong direction, because if he's still in there, isn't his current contentment exactly the thing that should outrank the paper?

  I've half-formed a rule I keep testing against these and it keeps failing. Roughly: an instruction binds only when the person who wrote it is still around to be wronged by our ignoring it. Case 4 destroys that immediately, since he is precisely not around. So maybe a weaker version: the earlier self gets a veto over what we do to the later one, but no power to make us do anything — refusals bind, requests don't. But then case 5 is a request and I want to grant it, and case 1 is a refusal and I want to deny it, so the rule fails at both ends and I'm not sure it's doing any work at all. I assume philosophers and bioethicists have chewed on all of this and I'm not asking for a reading list, I just want to know whether my verdicts correspond to some recognizable position or whether I'm in honestly incoherent territory.

  So: what's the principle that gets the most of these five, stated precisely enough that I can see which clause is doing the work in each case, and what does it say about the one I keep flip flopping on — a woman who wrote her directive during a bad depressive episode, then recovered and was herself for twenty years, never updated the document, and is now demented: does that directive date from the depressed version of her or the recovered one, and does it matter that she never got around to retracting it? Tell me straight which of my five verdicts your best principle has to overturn, because I'd rather drop one than have all five saved by something so baroque I couldn't apply it at 3am. And one practical thing: our risk manager wants a policy where patients re-sign their directive every two years so the most recent one always wins, and I think that's deranged for people who won't remember having signed the last one — does whatever principle you land on side with him or with me?
reasoning: |-
  Okay, the user is an ethics consultant at a community hospital dealing with a recurring dilemma about advance directives for dementia patients. They've presented five cases where their gut reactions seem inconsistent and are seeking a coherent ethical principle to unify their judgments. 

  First, I notice the user is deeply experienced (six years on consult service) but frustrated by their own intuitive inconsistencies. There's intellectual humility here—they're not just seeking validation but genuinely want to expose their reasoning to scrutiny. The cases are carefully chosen to test boundaries: preserved enjoyment vs. lost cognition (Case 1), reversible vs. irreversible interventions (Case 2), retained musical responsiveness vs. lost identity (Case 3), unambiguous brain death (Case 4), and competent suffering vs. incompetent contentment (Case 5). 

  The core tension seems to be between two ethical imperatives: respecting autonomy (the written directive) versus protecting a presently content existence (beneficence). But the user's instincts suggest a more nuanced view—they consistently prioritize present well-being *unless* the patient is either (a) currently competent (ALS case) or (b) biologically non-existent (brain death). This hints at a "threshold of continuity" principle where directives bind only if the current entity meaningfully connects to the directive-writer.

  I'm struck by how the user's flip on Case 2 (antibiotics) reveals an implicit distinction between life-sustaining interventions (feeding tube = identity-level alteration) versus restorative ones (antibiotics = temporary support). Their musical trigger case (3) further shows sensitivity to preserved capacities—if a core aspect of personhood (musical response) survives, the directive's trigger condition isn't met even if cognitive decline occurred.

  The user's self-proposed "veto power" principle fails because it doesn't account for their willingness to *act* in Case 5 (ALS suicide assistance). Their struggle with the depressive-episode directive is particularly telling—it exposes how the *context* of directive-writing matters as much as the document itself.

  For the risk manager's re-signing policy: the user rightly intuits that formalistic solutions miss the ethical nuance. A rigid two-year rule would invalidate thoughtfully crafted directives during early dementia while creating burdens for healthy people. Better to train clinicians in contextual assessment.

  Ultimately, their judgments align closest with narrative identity theories (Parfit, Schechtman) where personhood isn't binary but relational. The cases where they override directives (1,3) involve a present self with new interests; cases where they honor them (4,5) involve either biological discontinuity or enduring competent suffering. The depressive-episode case would likely fall to beneficence—without evidence the directive reflected her stable values, preserving her content present self seems ethical.

  What they need isn't a flawless principle (none exists) but a defensible framework for these gray zones. I'll emphasize that their instincts are more coherent than they think—rooted in preventing irreversible harm to a present entity with interests, while taking directives seriously as evidence of values unless contradicted by observable well-being.
answer: |-
  Your verdicts reflect a coherent, clinically grounded ethical stance that prioritizes **present experiential interests** over prior written instructions when a fundamental discontinuity in identity or values exists. This aligns with "experiential interest theory" (drawing on Parfit, Dworkin, and Schechtman), tempered by practical wisdom. Here's the principle distilled:

  **A prior directive binds only if:**  
  **(1)** The patient’s current self retains continuity of core identity/values *or*  
  **(2)** Enforcing the directive avoids irreversible harm to a conscious entity with interests.  
  *Otherwise, prioritize preventing suffering and respecting observable well-being.*

  ### How It Applies to Your Cases:
  1. **Demented woman refusing feeding tube (override directive):**  
     - *Why:* She has active **experiential interests** (enjoys food, music). Her current self lacks continuity with her pre-dementia identity ("she isn't there"). Enforcing the directive would actively harm a content, sentient being.  
     - *Clause:* (2) fails (harm would occur), so default to beneficence.

  2. **Same woman refusing antibiotics (override directive):**  
     - *Why:* Treating pneumonia **restores her to baseline contentment** without perpetuating an unwanted state. Unlike withholding food (which *creates* suffering), antibiotics *prevent* suffering for her present self.  
     - *Clause:* Withholding treatment would cause active harm to her experiential interests (violating (2)).

  3. **Cellist who lost musical knowledge (override directive):**  
     - *Why:** His **core capacity for musical joy persists** ("beats time to Bach"). The directive’s trigger ("unable to follow music") hinges on cognitive capacity, but his *experiential response* remains intact.  
     - *Clause:* Continuity of musical engagement suggests his identity isn’t wholly lost (weak (1)), but overriding prioritizes current well-being.

  4. **Brain-dead motorcyclist (honor directive):**  
     - *Why:** No **present experiential interests exist**. Honoring the directive respects autonomy without harming a conscious entity.  
     - *Clause:* (2) applies (no harm to interests by following directive).

  5. **ALS patient requesting death (would assist if allowed):**  
     - *Why:** His **current competent self** affirms the directive. Continuity of identity and values is intact ("he’s still there"). Denying assistance perpetuates suffering against his explicit, ongoing will.  
     - *Clause:* (1) applies strongly (continuity exists; ignoring directive harms his interests).

  ---

  ### Your Flip-Flop Case: Directive Written During Depression  
  - **Verdict:** *Override the directive.*  
  - *Why:*  
    - **Discontinuity of values:** The directive reflects a transient mental state (depression), not her stable identity (she lived 20 years post-recovery without updating it).  
    - **Present interests:** She shows observable contentment in dementia (similar to Case 1).  
    - **Burden of proof:** Directives written during psychiatric illness lack presumptive validity unless corroborated by later intent.  
  - *Principle’s work:* Fails (1) – no continuity with her recovered self’s values. Fails (2) – enforcing would harm her present experiential self.

  ---

  ### Which Verdict Would This Principle Overturn?  
  - **Case 3 (Cellist):** Strictly speaking, his directive *might* bind under (1) if "following music" implies cognitive grasp (which he lost). But your instinct to prioritize his joy is clinically sound. If forced to overturn one, this is the weakest link.  
  - **Key insight:** Your verdicts for 1,2,3 prioritize **observed well-being** when identity is fragmented. This is defensible pragmatism, not incoherence.

  ---

  ### The Risk Manager’s Policy: **Side With You**  
  - **Why the re-signing mandate is flawed:**  
    - Dementia patients may lack capacity to re-sign, voiding valid directives.  
    - Stable values don’t expire like milk. A 30-year-old’s directive for brain death (Case 4) doesn’t need renewal.  
  - **Better approach:** *Contextual reassessment.*  
    - For dementia patients: Evaluate whether the directive aligns with **current interests** and **original intent under stable conditions**.  
    - Your principle provides the ethical framework for this.

  ---

  ### Core Philosophy in Your Judgments
  You’re intuitively applying **narrative identity theory**: The "person" who wrote the directive only has authority if the current self remains part of that narrative thread. When dementia fractures that thread, the living being’s observable interests prevail. This rejects a rigid "precedent autonomy" view (where past directives always bind) in favor of a **relational, interest-based model**.  

  Your "gut" consistently protects a **sentient, experiencing self** from harm—even when that self is fragmented from its past. That’s not inconsistency; it’s nuanced clinical ethics. When forced to choose between two selves (past vs. present), you side with the one who *exists* and can suffer.
