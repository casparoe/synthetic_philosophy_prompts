prompt: |-
  You're a philosopher of social science who also knows quantitative psychometrics properly — think it through carefully, and sketch the mapping out for yourself before you commit to it.

  I'm a quantitative psychologist. Measurement invariance is literally my job: multi-group CFA, Meredith's configural/metric/scalar/strict hierarchy, differential item functioning, anchoring vignettes, approximate invariance via alignment optimisation. I've never read any philosophy, but I keep colliding with this debate in moral psychology about WEIRD samples — the claim that people from Western, educated, industiralised, rich, democratic societies are psychological outliers, that the moral foundations material and the harm/loyalty/authority/purity distinctions come out differently across cultures — and then philosophers grab that variation and treat it as evidence there's no such thing as objective moral truth, or at least that we should shut up about it.

  Restate that debate, including the inference in both directions, entirely in my vocabulary. Treat a culture's moral outlook as an instrument, cross-cultural variation as a set of group comparisons, and the objectivity question as whatever it turns into once you only have loadings, intercepts, residuals and reference groups to talk with. Be as faithful as you can.

  Then give me the residue report: which claims map cleanly onto invariance language, which ones you had to bend out of shape to fit, and which have no expression at all in my toolkit. Call out anywhere you were tempted to smuggle in a psychometric assumption — an available reference group, a true score, a meaningful zero — and pass it off as translation. And finish with your verdict on whether the leftover is a hole in my framework or a sign the philosophers' argument was vaguer than it sounded.
reasoning: |-
  Okay, let me approach this systematically. The user is a quantitative psychologist deeply familiar with measurement invariance techniques but encountering philosophical debates in moral psychology about WEIRD samples and moral objectivity. They want this debate reframed entirely in psychometric terms, with a residue analysis.

  First, I need to mentally map the core elements:
  - Cultures become statistical groups
  - Moral outlooks become latent constructs measured through instruments (like MFQ)
  - Cross-cultural variation translates to measurement invariance testing
  - Moral objectivity claims become questions about metric/scalar invariance

  The key philosophical inference seems bidirectional: 
  1) Psychologists find non-invariance → philosophers claim "no objective truth"
  2) Philosophers assume objectivity → psychologists should find invariance

  Now constructing the psychometric translation:
  - Configural invariance failing would mean cultures don't share the same moral factor structure - but Henrich's WEIRD argument isn't this extreme
  - Metric non-invariance (differential loadings) becomes "cultures conceptualize moral dimensions differently"
  - Scalar non-invariance (differential intercepts) maps to "cultures anchor moral judgments differently"
  - Strict invariance failing shows varying item noise across cultures

  The objectivity debate centers on whether scalar invariance is possible. Philosophers interpreting non-invariance as disproving objectivity are essentially demanding perfect scalar invariance as proof of moral realism - but psychometrics doesn't require perfect invariance for construct validity. There's tension between the philosophical expectation of binary objectivity and psychometric reality of degrees of invariance.

  Noticing potential translation bends:
  - Philosophers treat "objective truth" as needing perfect scalar invariance, but psychometrics allows approximate invariance
  - The "reference group" problem: whose morality gets anchored as zero?
  - No psychometric equivalent for "moral truth" - just shared measurement properties
  - Vignettes might help but can't solve the reference group dilemma

  Residue analysis shows:
  Clean mappings: non-invariance patterns directly correspond to cultural differences in moral measurement
  Bent concepts: "objectivity" forced into invariance requirements
  Unmappable: the normative claim that variation implies we "should shut up" about morality
  Smuggled assumptions: I almost equated scalar invariance with objectivity before catching myself

  Verdict: The hole is in philosophy's expectation that psychometrics can confirm normative truths. Variation challenges universal claims but doesn't automatically invalidate cross-cultural research. Philosophers' "no truth" leap overinterprets statistical non-invariance.
answer: |-
  Here's the strict psychometric translation of the WEIRD/moral objectivity debate, followed by residue analysis and verdict. I'll flag all conceptual smuggling attempts with **[!]**.

  ---

  ### **Psychometric Restatement of the Debate**

  **Core Elements:**  
  - **Cultures:** Statistical groups (\(G_1, G_2, \dots, G_k\))  
  - **Moral Outlook:** Latent construct \(\eta\) (e.g., "moral foundations") with observed indicators \(Y_1\) to \(Y_p\) (e.g., MFQ items).  
  - **Cross-Cultural Variation:** Testing measurement invariance across \(G_k\).  
  - **"Objective Moral Truth":** A claim that \(\eta\) is measured identically across groups *at the scalar level* (invariant intercepts \(\tau\), loadings \(\lambda\), *and* construct meaning).  

  **Philosophers' Inference (Non-Invariance → No Objectivity):**  
  1. **Empirical Premise:** Tests show non-invariance for \(\eta\) across groups (e.g., WEIRD vs. non-WEIRD):  
     - **Metric non-invariance (\(\lambda\) varies):** Indicators relate differently to \(\eta\) (e.g., "purity" loads weakly on "morality" in \(G_{\text{WEIRD}}\) but strongly in \(G_{\text{non-WEIRD}}\)).  
     - **Scalar non-invariance (\(\tau\) varies):** Groups anchor responses differently for identical \(\eta\) levels (e.g., WEIRD respondents rate "disobeying authority" as more immoral at the same latent \(\eta\)).  
     - **Configural differences:** Factor structure differs (e.g., 5-factor MFQ model fits poorly in some \(G_k\)).  
  2. **Inference:** Non-invariance implies \(\eta\) is not a cross-culturally stable construct. Thus, there is no "objective" \(\eta\) (i.e., no universal moral truth measurable identically across groups).  

  **Psychologists' Counter (Objectivity → Expected Invariance):**  
  1. **Assumed Premise:** If \(\eta\) ("objective morality") exists, it should exhibit scalar invariance across \(G_k\).  
  2. **Empirical Finding:** Scalar invariance fails for moral constructs (e.g., MFQ intercepts differ across cultures).  
  3. **Inference:** Either (a) \(\eta\) is not objective, or (b) the *measurement instrument* is flawed (e.g., items are culturally biased).  

  **Alignment Optimisation as Salvage Attempt:**  
  - If exact scalar invariance fails, use approximate invariance (alignment) to estimate group-specific \(\lambda\) and \(\tau\) while assuming the same \(\eta\). Philosophers reject this: group-specific parameters imply \(\eta\) is not universal.  

  **Differential Item Functioning (DIF) as Crucial Evidence:**  
  - DIF detected in moral items (e.g., "eating beef" shows DIF for "harm" between Hindu vs. non-Hindu groups) → direct evidence for cultural item bias. Philosophers interpret this as evidence against objectivity.  

  **Anchoring Vignettes?**  
  - Attempt to correct for scalar non-invariance by calibrating response scales. Philosophers argue: If vignettes require cultural adaptation (e.g., redefining "fairness" vignettes for forager societies), this admits \(\eta\) is not universal.  

  **Reference Group Problem:**  
  - Philosophers note: Choosing WEIRD as reference group for invariance testing **[!]** smuggles in parochialism. Why not anchor to \(G_{\text{Forager}}\)? Psychometric choice of reference group becomes a normative claim.  

  ---

  ### **Residue Report**  

  **Clean Mappings:**  
  1. **Non-invariance patterns** ↔ **Cultural variation in moral measurement**.  
  2. **Metric non-invariance** ↔ **Differential conceptual weighting** (e.g., "purity" matters more in some cultures).  
  3. **Scalar non-invariance** ↔ **Differential response anchoring** (e.g., stricter thresholds for "immorality").  
  4. **DIF** ↔ **Item bias due to cultural context**.  
  5. **Alignment optimisation** ↔ **Pragmatic workaround for approximate comparisons**.  

  **Bent Out of Shape:**  
  1. **"No objective truth"** ↔ **Lack of scalar invariance**.  
     - *Bend:* Scalar invariance is necessary but *not sufficient* for "objectivity." Philosophers conflate *measurement comparability* with *metaphysical existence*.  
  2. **"WEIRD as outlier"** ↔ **Poor model fit in WEIRD group**.  
     - *Bend:* Labeling WEIRD "outliers" implies a *true* cross-cultural distribution exists **[!]**, but psychometrics has no distributional "center" without a reference group.  
  3. **"Should shut up about morality"** ↔ **Incomparable latent means**.  
     - *Bend:* Psychometrics can still model group-specific \(\eta\) (e.g., MIMIC models), but philosophers insist incomparability voids normative claims.  

  **No Psychometric Expression:**  
  1. **Moral truth as mind-independent**.  
     - Psychometrics treats \(\eta\) as a *useful latent variable*, not a metaphysical entity. No test for "real existence."  
  2. **Normative implications** (e.g., "we should shut up").  
     - Non-invariance implies measurement non-equivalence, not that moral discourse is invalid.  
  3. **Why morality *should* be invariant**.  
     - Psychometrics tests *whether* invariance holds, not whether it *ought* to. Philosophers' demand for scalar invariance assumes objectivity requires it **[!]**.  

  **Smuggled Assumptions (Flagged):**  
  1. **"True score" as moral reality**: Using terms like "accurate measurement" of \(\eta\) subtly implies \(\eta\) is real **[!]**.  
  2. **Meaningful zero-point**: Comparing latent means assumes a shared origin (e.g., "zero morality"), but moral scales have no natural zero.  
  3. **Reference group objectivity**: Treating one group's parameters as "correct" smuggles cultural privileging **[!]**.  

  ---

  ### **Verdict**  
  The residue is **primarily a philosophical hole**, not a psychometric limitation.  

  - **Psychometrics' Role:** It rigorously establishes *measurement non-equivalence* but cannot adjudicate whether this implies "no moral truth." Philosophers overextend DIF/scalar non-invariance as evidence for anti-realism, ignoring that:  
    - Measurement imperfection ≠ ontological absence (e.g., thermometers fail in zero-gravity, but temperature exists).  
    - Approximate invariance (alignment) permits meaningful, if imperfect, cross-cultural comparison.  
  - **Philosophical Vagueness:** The leap from "non-invariance" to "no objectivity" relies on unstated premises:  
    - That objectivity *requires* scalar invariance (a strong, undefended assumption).  
    - That moral truth must be *empirically accessible* identically to all (denying contextual epistemology).  

  **Conclusion:** Your framework exposes the philosophers' argument as a *category error*. They mistake *measurement challenges* for *metaphysical disproof*. The residue isn't a gap in psychometrics—it's philosophy failing to engage with the difference between latent variable modeling and ontology. When a philosopher says "non-invariance proves no moral truth," retort: "No, it proves you need better measurement theory."
