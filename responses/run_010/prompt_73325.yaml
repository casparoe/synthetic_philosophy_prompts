answer: |-
  This patchwork of intellectual property (IP) regimes reflects a **pragmatic, positivist conception of ownership** that treats the "owned object" not as a unified metaphysical entity (e.g., an "idea" or inherent mental creation) but as **distinct legal artefacts defined by their context of creation, disclosure, and commercial purpose**. No single theory of natural entitlement underpins all three; instead, ownership is contingent on formalities, relationships, or state-granted monopolies. Here’s a breakdown:

  ### 1. **What the "Owned Object" Is in Each Regime**  
     - **Copyright**: The owned object is a **fixed, original expression** (e.g., a melody, text). It arises from *mental labour* embodied in a tangible form, irrespective of novelty. Independent creation is a defence because the law protects the *expression of thought*, not the thought itself.  
     - **Patent Law**: The owned object is a **publicly disclosed, novel invention** claimed in a formal register. It is a *state-granted monopoly* for technical solutions, justified by incentivising disclosure. Independent invention offers no defence because the monopoly is awarded to the *first to file*, treating the invention as a public commodity once revealed.  
     - **Trade Secret Law**: The owned object is **confidential information** (e.g., a formula, process) maintained in secrecy. Ownership arises from a *relationship of trust* or reasonable efforts to conceal—essentially a *proprietary right in secrecy itself*.  

  ### 2. **Rival Theories Ruled Out**  
  The pattern explicitly **rejects**:  
     - **Lockean labour theory** (ownership flows from effort): Patent law ignores the labour of later independent inventors; copyright’s *Harrison* ruling (subconscious copying) penalises labour tainted by prior exposure.  
     - **Hegelian personality theory** (ideas as extensions of self): Copyright allows identical independent creations; patents exclude later inventors even if the invention reflects their personal ingenuity.  
     - **Natural rights in mental contents**: None of the regimes protect "ideas" as such. Trade secrets protect secrecy, not the idea; patents require disclosure; copyright excludes ideas/functional elements.  
     Instead, the regimes presuppose **legal positivism**: ownership is what statutes and precedents define, often instrumentally.  

  ### 3. **Strict Requirements vs. Instrumental Fits**  
     - **Strict Requirements**:  
       - Copyright: Fixation + originality.  
       - Patents: Novelty, non-obviousness, utility + registration.  
       - Trade Secrets: Secrecy + reasonable protection efforts.  
     - **Instrumental Viability**: A purely incentive-based story **can license all three attitudes** without a unified ownership theory:  
       - Copyright’s independent creation defence encourages prolific creativity with low entry barriers.  
       - Patent’s no-defence rule incentivises rapid disclosure (maximising public knowledge).  
       - Trade secret’s reverse-engineering allowance promotes competition while punishing bad faith.  
       *However*, the *Harrison* ruling (subconscious copying liability) **cannot be squared** with instrumentalism. Punishing unintended, causally attenuated copying undermines incentive logic—it is a doctrinal anomaly privileging "purity" of labour over incentives.  

  ### 4. **Genuine vs. Apparent Contradictions**  
     - **Apparent contradiction**: Copyright’s independent creation defence vs. patent’s no-defence rule. This is *instrumentally coherent*: patents protect high-cost R&D; copyright protects low-cost expression.  
     - **Genuine contradiction**: Copyright’s *subconscious copying* liability (as in *Harrison*) vs. trade secret’s endorsement of reverse engineering. Both involve unintentional "taking," yet one attracts liability, the other does not. This reflects copyright’s unresolved tension between labour-based and incentive-based rationales.  

  ### 5. **Imposing a Unified "Causal Contribution" Principle**  
  If entitlement required **actual causal production** (owning what you made, liable only for what you took), each regime would lose core doctrines:  
     - **Copyright**: Would abandon *strict liability for subconscious copying* (e.g., *Harrison*). Liability would require proof of deliberate appropriation. Independent creation would remain a full defence.  
     - **Patent Law**: Would collapse. Its *first-to-file priority* and *monopoly against independent inventors* ignore the causal labour of later creators. To comply, it would need to adopt a "first-to-invent" or co-ownership model—but this undermines its disclosure incentives.  
     - **Trade Secret Law**: Would be largely **compatible**. Reverse engineering/unearthing secrets through one’s effort is causal production; liability for breach of confidence tracks "taking" via improper means.  
     - **Hardest Doctrine to Reconcile**: Patent law’s **priority rule** is irreconcilable with causal contribution. A later inventor who independently develops a patented invention causally produced it but is barred from using it—directly violating the principle.  

  ### Conclusion  
  The IP patchwork presupposes **no consistent theory of idea ownership**. It treats the owned object as a **contextual legal construct**: expression, registered invention, or secret. While instrumental incentives can explain much of the divergence, subconscious copying liability in copyright and patent law’s disregard for independent creation expose genuine contradictions. A "causal contribution" principle would harmonise copyright and trade secrets but destroy patent law’s core—revealing patent doctrine as the least reconcilable with notions of inherent entitlement. This reflects IP law’s nature as a policy toolkit, not a philosophical system.
