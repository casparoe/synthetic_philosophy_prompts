prompt: |-
  Not a philosopher — I work in a city budget office, and for the past year I've been reading my way through the arguements around a proposal to launch a local currency here (we're weighing it partly as a way to keep spending circulating inside the city). What keeps jumping out at me isn't the policy, it's a pattern in how people talk, and I can't find a word for it. The same person, sometimes in the same comment thread, will treat money one way when it suits them and the opposite way when it doesn't. Example one: when the topic is our local currency, skeptics say money is nothing but a shared agreement, a token we decided to accept, no different in kind from air miles or arcade tokens, so there's no reason a town couldn't invent its own. Fine. Example two: when the topic shifts to inflation or bond issuance, the same voices say the currency has real value in it, that issuing more is a debasement, a kind of counterfeiting or theft — as though the value were a substance being watered down rather than a set of expectations we collectively manage. Flip it and you get the mirror image: crypto people insist a national currency is just paper backed by nothing but belief, while their coin is sound money because an algorithm caps the supply, which treats the algorithm as if it had the solidity of metal. And a third case from my own building: when a department wants to pay a small award in retail gift cards, someone objects that it isn't real money, and the objection clearly isn't about acceptability, since the cards are accepted nearly everywhere.

  So: does this have a name? I know the pieces have names. There's a long-running dispute between people who think money is essentially a commodity and people who think it's essentially a creature of the state or of credit, and I've read that Aristotle says somewhere that money exists by convention rather than by nature and can be altered and made useless at will. There's also money illusion, doublethink, and plain equivocation. But none of those seem to be the thing I'm describing, which is specifically the opportunistic switching — reaching for the conventional view to deflate a money you dislike and the substantial view to harden a money you like (or the reverse), without ever flagging that you've switched, and often without noticing. Is there an established concept or a literature on that exact move, in philosophy of money, in the history of monetary thought, or in rhetoric more generally?

  If there isn't one, I'd rather you say so plainly and then coin it: give it a name, define it tightly enough that I could tell whether a given speaker is doing it, and mark the edges. Especially this edge — is it ever legitimate to hold both views at once, e.g. treating money as a pure institution while also treating it as a store of value, and what separates that from the switch I'm seeing? Lead with the bottom line (the name, or "there isn't one"), then do the carving, and please keep the whole thing under 400 words — I've got a meeting at two.
reasoning: |-
  Okay, the user works in a city budget office and has been researching local currencies. They've noticed a pattern where people switch their view of what money is depending on the situation. For example, when discussing a local currency, skeptics say money is just a shared agreement like arcade tokens. But when talking about inflation, the same people treat money as having intrinsic value that can be diluted. Crypto proponents do something similar, dismissing national currency as mere belief while claiming their algorithm-backed coins are solid. The user also mentions gift cards not being seen as "real money" even though they're widely accepted.

  The core issue here is the inconsistent application of two philosophical views of money: the commodity theory (money has inherent value) versus the credit theory (money is a social agreement). The user wants to know if there's a term for this opportunistic switching between views. They've already looked into concepts like money illusion or doublethink but found them insufficient. 

  I need to determine if there's an established term for this behavior. From my knowledge in monetary philosophy, I recall that economists like Knapp and Keynes have discussed the dual nature of money, but I don't think there's a specific term for this contextual switching. The closest concepts are cognitive dissonance or intellectual inconsistency, but those are too broad. Since no precise term exists, I should create one that captures this phenomenon clearly.

  The user wants a concise answer under 400 words, starting with the name or confirmation that no term exists. They need a tight definition that distinguishes legitimate dual-aspect thinking from opportunistic switching. Legitimate dual-aspect would consistently acknowledge both social convention and store-of-value functions, while the switching behavior is context-dependent and unacknowledged. 

  I should emphasize that money's nature is both social and functional - it's a social agreement that functions as a store of value. The problem arises when people selectively apply these aspects to serve their arguments without consistency. 

  For the name, I'm considering "Monetary Schizometaphysics" - schizo meaning split, metaphysics referring to fundamental nature. This captures the split in underlying assumptions about money's essence. Alternatively, "Monetary Opportunism" or "Instrumentalist Switching" could work, but they might not fully capture the metaphysical aspect. 

  The definition must include: 1) The two contradictory views of money (commodity vs social agreement), 2) The opportunistic switching between them, 3) The lack of acknowledgment of the switch. The key differentiator from legitimate dual-aspect thinking is the inconsistency and lack of meta-awareness. 

  I'll structure the response by first stating there's no established term, then introducing the coined term, defining it clearly, and explaining what separates it from legitimate dual perspectives. The whole thing needs to be concise and actionable for their upcoming meeting.
answer: |-
  There's no established term for this specific opportunistic switching. I'll coin one: **Monetary Schizometaphysics**.

  **Definition:** The unacknowledged, context-dependent alternation between two incompatible metaphysical views of money's nature – treating it as a *substantial commodity* with inherent value in one instance and as a *pure social convention* or token in another – specifically to discredit a disfavored monetary form or validate a favored one.

  **Key Markers:**
  1.  **Contradictory Views:** Espousing both the commodity view (money has intrinsic value/substance) and the conventional view (money is a token/social agreement).
  2.  **Opportunistic Trigger:** The switch is driven by the *specific monetary form being discussed* (local currency vs. national currency vs. crypto vs. gift card) and the speaker's attitude towards it (skepticism vs. support).
  3.  **Lack of Acknowledgment:** No recognition of the contradiction between the views applied to different forms. The switch is implicit, often unconscious.
  4.  **Rhetorical Purpose:** Used to undermine ("it's just tokens, no real value") or bolster ("it's sound, substantial money") specific cases.

  **The Legitimate Edge (vs. Opportunistic Switching):**
  It *is* legitimate to recognize money has *both* conventional *and* functional aspects *simultaneously*. A coherent view might be: "Money is fundamentally a social institution and unit of account *conventionally agreed upon* (conventional aspect), and its effectiveness *as a store of value* or medium of exchange depends critically on managing collective expectations and scarcity (functional aspect, requiring constraints like supply management)."

  *   **Legitimate Dual-Aspect:** Acknowledges the *conventional foundation* while consistently applying the *functional requirements* (like scarcity management) needed for stability and trust *across all monetary forms*. The core nature (convention) is stable; the functional requirements are applied universally based on context (e.g., inflation concerns apply to *any* currency lacking supply discipline).
  *   **Schizometaphysics:** Arbitrarily *changes the core nature* (commodity vs. token) based on the specific form being discussed to achieve a rhetorical goal, *without* universalizing the functional requirements or acknowledging the contradiction.

  **Bottom Line:** The behavior you observe is **Monetary Schizometaphysics** – opportunistically flipping the fundamental *nature* of money (commodity vs. convention) depending on the monetary form to win an argument, without consistency or acknowledgment. Legitimate views integrate convention with functional requirements consistently.
