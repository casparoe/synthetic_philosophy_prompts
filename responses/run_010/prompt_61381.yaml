answer: |-
  ### Scenario: The Metro Watershed Conservation District (MWCD)

  The MWCD is a special-purpose authority managing a reservoir and watershed spanning two counties, Green and Blue. It sets binding rules (with fines for violations) to prevent pollution and manage water quality. The district is governed by a board representing water users and local governments. The board must decide whether to restrict agricultural runoff by banning certain fertilizers in the watershed. 

  **Parties**:
  - **Green County Farmers**: Farm within MWCD boundaries; subject to its rules and fines. The ban would impose significant costs (new equipment, lower yields).
  - **Blue County Residents**: Live downstream; subject to MWCD rules (e.g., septic regulations). Water quality improvements from the ban would slightly benefit them (reduced water treatment costs), but this is offset by new fees for enforcement, creating a *net neutral* effect on their interests (as per MWCD’s impact study).
  - **Mountain Hikers**: Use trails in the watershed’s headwaters (in Green County). They are *not* subject to MWCD rules (trails are federally managed). The ban would indirectly protect their hiking experience by preserving wildlife, providing a *definite aesthetic benefit*.
  - **MWCD Staff**: Work for the district; subject to its employment rules. The ban would not affect their jobs or interests (staffing is fixed by statute). They are the *only participants* in the district’s "self-rule" scheme, as they vote in internal governance referendums (e.g., on workplace policies).

  **Stipulations**:  
  - Affectedness is definite: Farmers are harmed, Hikers are benefited, Residents are net neutral, Staff are unaffected.  
  - Subjection is unambiguous: Farmers, Residents, and Staff are subject to rules/fines; Hikers are not.  
  - Joint-agency is exclusive: Only Staff participate in ongoing self-governance (e.g., voting on internal policies); others are rule-takers.  

  ---

  ### Analysis Table
  | Principle                 | Enfranchised Parties               | Excluded Parties                   | Specific Fact Generating Extension                                                                 | Strongest Move for Refusing Result                                                                 |
  |---------------------------|------------------------------------|------------------------------------|---------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|
  | **Affectedness**          | Green County Farmers, Mountain Hikers | Blue County Residents, MWCD Staff  | Farmers are harmed; Hikers are benefited; Residents have net neutral effect; Staff are unaffected. | Claim Residents are "weakly affected" by fee changes, but net neutrality is stipulated as definite. |
  | **Subjected**             | Green County Farmers, Blue County Residents, MWCD Staff | Mountain Hikers                    | Farmers, Residents, and Staff are subject to MWCD’s coercive rules/fines; Hikers are not.         | Argue Hikers are "de facto subject" via trail access rules, but MWCD lacks jurisdiction (federal land). |
  | **Joint-agency**          | MWCD Staff                         | Green County Farmers, Blue County Residents, Mountain Hikers | Only Staff participate in internal self-governance referendums; others lack co-authorship roles. | Claim Farmers/Residents are "implied participants" as rule-subjects, but participation is formalized only for Staff. |

  ---

  ### Design Audit (JSON)
  ```json
  {
    "load_bearing_feature": "The net neutral effect on Blue County Residents, making them unaffected but still subjected.",
    "if_removed": "If Residents were affected, Affectedness and Subjected extensions collapse; if they were unaffected and unsubjected, Subjected loses its unique exclusion.",
    "hardest_principle_to_defend_here": "Joint-agency",
    "decision_swap_survives": true,
    "decision_swap_explanation": "For a similar decision (e.g., a fee increase), Residents remain net neutral/unaffected, Hikers remain unsubjected but affected (if fees impact trail access), and Staff remain sole participants.",
    "fourth_principle_worth_adding": null,
    "confidence": "high: Stipulated definite affectedness (non-degreed net neutrality), clear subjection boundaries (federal vs. MWCD jurisdiction), and formal participation rules block common objections."
  }
  ```

  ### How the Case Meets Spec
  - **Pairwise non-nesting**:  
    - Affectedness uniquely enfranchises **Mountain Hikers** (benefited but unsubjected/non-participating), excluded by Subjected and Joint-agency.  
    - Subjected uniquely enfranchises **Blue County Residents** (subjected but net neutral/non-participating), excluded by Affectedness and Joint-agency.  
    - Joint-agency uniquely enfranchises **MWCD Staff** (participating but unaffected/unsubjected *in this decision*), excluded by Affectedness.  
  - **No villains**: Excluding Residents (net neutral) avoids unfair burdens; excluding Hikers (unsubjected) preserves jurisdictional integrity; excluding Farmers (despite harm) under Joint-agency reflects their lack of self-governance role.  
  - **Blocks objections**:  
    - Net neutrality (Residents) prevents "affectedness is degreed" collapses.  
    - Federal jurisdiction (Hikers) prevents "all-subjected absorbs all-affected" (Hikers are affected but unsubjected).  
  - **Decision-swap survival**: A fee change retains net neutrality (Residents), jurisdictional separation (Hikers), and Staff exclusivity (Joint-agency), preserving non-nesting.
