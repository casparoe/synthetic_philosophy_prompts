  I’ll structure the story around Lena’s realization that their institution’s past commitment to transparency now backfires. The junior colleague, Aris, will suggest the "identical source" solution, which Lena dismantles by showing how a single space causes defection. This scene makes the brittleness visceral. The threat program’s source code revelation ("defect unless opponent cooperates") should feel like a punch—provable, immutable. 

  For the climax, Lena’s choice to corrupt their program (option three) sacrifices all future cooperation for survival. The loss isn’t just strategic; it’s ethical. The story ends with her deleting the proof module, symbolizing the death of trust. The reader should feel the weight: safety bought at the cost of permanent loneliness. 

  Key touches: 
  - Use tech details sparingly (e.g., "proof budget," "bounded loops") but ground them in character stress. 
  - The deadline (midnight) forces urgency into the prose. 
  - No corporations or governments—just "the Institute" and "the other party." 
  - Dialogue stays natural; Aris’s frustration mirrors the reader’s initial confusion. 

