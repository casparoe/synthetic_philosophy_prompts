prompt: |-
  I handle desk decisions for the articles desk at a mid-tier history journal, and anything touching the French Revolution goes to the same outside reader — a retired professor who's been doing this for something like thirty years. I've now got two years of her reports saved up and she's a terror in both senses. Here's the record:

  - A book arguing the Terror's escalation in '93–'94 is explained by the war emergency, the assignat collapse and the subsistence crisis bearing down on the machinery of revolutionary government: reject. Her phrase was that it describes a machine with no operators — by the last chapter you know exactly what the situation required and nothing at all about who did anything.
  - A book arguing that Jacobin virtue-talk was strategic cover for the property interests of a new owning class, and that the language of disinterest did useful work for people who needed it: reject. She complimented the archival digging and the prose, then said a book that treats revolutionary language as an alibi has picked its verdict before it opened a single register.
  - A book on the summer of 1791 — Varennes, the Champ de Mars, the split in the patriot camp — arguing the constitutional monarchy survived by inches and that radicalization was one bad fortnight from never happening: strong accept, best thing she'd read in ten years.
  - A microhistory of one department's revolutionary tribunal showing the local severity curve tracked family feuds, denunciations and committee seating far more then any instruction from Paris: reject. Her reason: it proves the provinces were a shambles but never says who authorized the shambles, and nobody in the book ever decides anything about the Terror as such.
  - A study of Convention speeches tracing how the vocabulary of conspiracy and unity narrowed what deputies could see as an option, so each purge made the next one thinkable (her report kept returning to the spring of '94, when the assembly ate its own left and its own right within a fortnight): accept, with one chapter cut.

  Next month I have to send her a manuscript and I want to know what I'm walking into. It's a quantitative study of the representatives-on-mission — arrest orders, correspondence, the timing of thier missions. The headline finding is that the number of death sentences in a department is predicted almost entirely by whether a given representative was present and how much latitude he'd been handed, and that these men's decisions were erratic and often reversed within weeks. The part I can't read her on is the conclusion the author draws: that the Terror had no coherent center at all, and that the ideological categories the Convention supplied did no explanatory work, because the same categories produced wildly different outcomes depending on which man happened to be in the room.

  So — will she send it forward for review, and with what kind of report? Which rule is she actually running: politics as its own causal register that can't be reduced to economics or to local sociology; a flat anti-necessitarianism that rejects anything making the Terror look automatic; a demand that the actors' own reasons stay load-bearing; an insistence that the national political center be doing explanatory work rather than just existing; or something I haven't thought of. Tell me what each candidate rule predicts about this particular manuscript, give me your single best guess at her verdict plus the strongest reason to prefer it over the runner-up, and then name the sort of manuscript I could send her afterward that would cleanly separate the two readings you find most plausible. And flag which of her five verdicts, if any, your favourite rule has trouble with — I'd much rather hear it now than in her report.

  Please keep the settled stuff separate from the contested stuff. Where you're leaning on things historians of the Revolution broadly agree about, say so; where you're taking a side in a live fight — social interpretation versus the political-culture turn, whether the Terror is the kind of thing that can be explained at all, how much of the devouring-your-children business was structure and how much was choice — don't hand it to me as though the field had closed the question. Same goes for your reconstruction of her rules: mark which parts are actually forced by the five reports and which parts are you filling in gaps.

  Sections, in this order, please: "The pattern" (~200 words); "Candidate rules" (~350 words, one paragraph per rule, each ending in what that rule predicts for the representatives-on-mission manuscript); "My call" (~150 words); "The discriminating manuscript" (~150 words); "Where this is a guess" (~120 words).
reasoning: |-
  Okay, let me tackle this complex request step by step. The user handles desk decisions for a history journal and needs to predict how a particular outside reader will evaluate a new manuscript on the French Revolution's representatives-on-mission. 

  First, I need to analyze the pattern in the reader's previous five reports to identify her evaluative criteria. The rejected manuscripts seem to share a common flaw: they either reduce the Terror to structural factors (war, economics) or local dynamics without accounting for human agency, while the accepted ones emphasize political actors making consequential choices within ideological frameworks. 

  For the candidate rules, I consider several possibilities: 
  - A strict agency requirement where actors must drive explanations 
  - Anti-necessitarianism rejecting deterministic narratives 
  - Politics as irreducible to other factors 
  - National center as essential explanatory level 
  - Ideological language as operational, not just cover 

  Each rule would predict different outcomes for the new manuscript. The quantitative study showing representatives' erratic decisions undermining Terror coherence seems most likely to trigger rejection under rules prioritizing national-level ideological coherence or agency. 

  My best guess is rejection because the manuscript's "no coherent center" conclusion directly challenges her apparent view of the Terror as politically directed. The strongest evidence is her consistent dismissal of works minimizing central authority/ideology. 

  To test between competing interpretations of her criteria, a manuscript on Convention committees using political theory to show how ideological constraints shaped decisions despite chaos would be ideal. 

  I'll flag where I'm speculating - particularly regarding her tolerance for quantitative methods and exact threshold for sufficient agency. The microhistory rejection suggests local studies must explicitly tie back to national actors/intentions, which is my key interpretive leap.
answer: |-
  ### The Pattern  
  From the five reports, the reader consistently rejects manuscripts that minimize revolutionary *agency* or treat politics as epiphenomenal. She dismisses:  
  - Structural explanations (war/economics) without operators (Reject 1)  
  - Language as mere class-interest camouflage (Reject 2)  
  - Local dynamics detached from national authorization (Reject 4)  
  She accepts works where actors’ choices *within* political-ideological frameworks drive outcomes: the contingency of radicalization in 1791 (Accept 1) and the self-reinforcing logic of Convention rhetoric (Accept 2). **Settled**: Historians broadly agree politics mattered; **Contested**: *How much* ideology constrained actors vs. served as post-hoc justification remains debated. Her pattern suggests she demands:  
  1. **Human agency** as irreducible (not drowned by structure)  
  2. **Ideological language** as operational (not just alibi)  
  3. **National politics** as causally central (not peripheral to local/social forces)  

  ---

  ### Candidate Rules  
  **Rule 1: Politics as autonomous causal register**  
  Politics isn’t reducible to economics/sociology; ideological frameworks actively shape possibilities. *Predicts REJECT*: The manuscript reduces Terror outcomes to individual caprice, ignoring how revolutionary ideology enabled/framed representatives’ "latitude" and "decisions."  

  **Rule 2: Anti-necessitarianism with agency primacy**  
  Rejects deterministic explanations (structural, teleological) but insists actors’ reasoned choices drive events. *Predicts REJECT*: Calling decisions "erratic" implies absence of rationale, negating deputies’ ideological motivations (even if inconsistent).  

  **Rule 3: Actors’ reasons as load-bearing**  
  Explanations must engage with *why* actors believed their actions were justified/necessary. *Predicts REJECT*: Dismissing ideological categories as "explanatory useless" ignores how deputies used them to legitimize actions.  

  **Rule 4: National center as essential explanatory tier**  
  Provincial/local outcomes must be linked to intentionality/authorization at the political center. *Predicts REJECT*: Arguing the Terror "had no coherent center" contradicts her critique of the microhistory (Reject 4) for ignoring "who authorized the shambles."  

  **Rule 5: Ideological coherence as functional**  
  Language isn’t just cover; it constructs political reality and limits options. *Predicts REJECT*: The conclusion that categories "did no explanatory work" clashes with her praise for the Convention speeches study (Accept 2).  

  ---

  ### My Call  
  **Verdict: REJECT**  
  **Strongest reason**: The manuscript’s core claim—"no coherent center," ideology irrelevant—directly violates her insistence on national political intentionality (Rule 4) and ideological language’s operational role (Rule 5). Her rejection of the microhistory (Reject 4) for ignoring authorization parallels this flaw.  
  **Runner-up**: Rule 2 (agency primacy) also predicts rejection but is weaker: she *might* accept erratic choices if framed as agents navigating ideology (as in Accept 2), but the manuscript explicitly dismisses ideology’s role.  

  ---

  ### The Discriminating Manuscript  
  Send a study of Committee of Public Safety logistics/orders showing how ideological priorities (e.g., "virtue," "suspects") *structured* chaotic enforcement—e.g., how representatives cited Convention rhetoric to justify erratic arrests.  
  - **If she ACCEPTS**: Confirms Rule 5 (ideology functional despite chaos).  
  - **If she REJECTS** for "overstating coherence": Supports Rule 2 (agency primacy over ideology).  

  ---

  ### Where This Is a Guess  
  **Forced by reports**: Rejection of structural/local reductionism; demand for agency/national center; ideology as non-alibi.  
  **Filling gaps**:  
  1. Her tolerance for quantitative methods (unmentioned; may irritate if seen as decontextualized).  
  2. Threshold for "sufficient" agency: Does erratic = agential? (Likely *no*, per her "machine with no operators" critique).  
  3. **Rule tension**: Her Accept 2 (speeches narrowing options) slightly conflicts with Accept 1 (radicalization’s contingency). I assume she resolves this via "constrained choices" (ideology enabling/contingency acting *within* it).  
  **Tricky verdict**: Reject 2 (language as class alibi) aligns with all rules; no tension.
