answer: |-
  ## Dissertation Chapter Proposal: Chapter 3 - Dissecting the Hydra: Unmasking Two Faces of Expected-Value Fanaticism

  **1. Core Question & Thesis:**
  The central question driving this chapter is: **Is the phenomenon broadly labeled "expected-value fanaticism" (EVF) a single problem rooted in extreme tail events, or does it mask two structurally distinct problems?** I propose that **EVF is indeed two distinct problems:**  

  *   **Problem 1: Tail-Event Fanaticism (TEF):** The familiar case where the expectation is dominated by a vanishingly small probability multiplied by an astronomically large (or infinite) value (e.g., Pascal's Mugging). The fanatical conclusion relies crucially on the existence and evaluation of a highly improbable, extreme outcome.  
  *   **Problem 2: Compounding Trajectory Fanaticism (CTF):** A novelly articulated problem where both the *immediate* probability and value associated with a single act are thoroughly ordinary and finite. However, performing the act significantly increases the probability of performing further, similar acts (or enabling others to do so), triggering a compounding sequence. The *expected total value of the long-run trajectory* initiated by the single act diverges to infinity (or extreme values), leading to a fanatical conclusion *without any tail event in the immediate act's probability distribution*. The fanaticism emerges from the *structural feedback loop* created by the act's effect on future action probabilities.

  **What Separates Them (The Distinction):**
  *   **Locus of Extremeness:** TEF requires extremeness *within* the outcome space of the immediate act (low p, high v). CTF requires no extremeness in the immediate act; extremeness arises only when considering the *causal chain of future actions* it probabilistically enables.
  *   **Role of Time/Sequence:** TEF is essentially instantaneous; the problematic calculation happens for the act at t=0. CTF is inherently diachronic; the fanatical conclusion depends critically on modeling the act's *ongoing causal influence* on future choices (t=1, t=2,...).
  *   **Vulnerability to Standard Fixes:** As argued below, standard remedies target TEF's core mechanics (tail outcomes). CTF, arising from ordinary values/probabilities influencing future probabilities, may bypass these defenses entirely.

  **2. Why Existing Diagnoses & Remedies Leave CTF Open:**
  Existing frameworks were primarily developed to address TEF. Their application to CTF is inadequate:

  *   **Discounting Small Probabilities:** CTF involves no small probabilities *in the immediate act*. Discounting the ordinary probabilities involved would be unmotivated and destroy plausible reasoning about mundane consequences.
  *   **Bounding the Utility Function:** While capping *individual* outcomes prevents TEF's infinity, CTF's divergence arises from the *sum* of many finite utilities. A bound on per-outcome utility does nothing to prevent the expected *sum* over a potentially infinite sequence from diverging if the probability of the sequence continuing remains sufficiently high.
  *   **Risk-Sensitivity (e.g., Rank-Dependent Utility):** These models overweight/underweight extreme outcomes. Since CTF has *no extreme outcomes* in the immediate act, risk-weighting applied locally per act won't necessarily mitigate the fanatical pressure arising from the compounding sequence expectation. Global application is complex and underexplored.
  *   **Imprecise Credences:** While imprecision might help avoid commitment to precise tiny probabilities (relevant for TEF), CTF thrives on *ordinary*, relatively precise probabilities concerning the act's impact on future actions (e.g., "this donation significantly increases the chance I/others donate again"). Imprecise credences over these ordinary probabilities seem less compelling and may not resolve the divergence in the sequence's expectation.
  *   **State Space Expansion:** While sometimes discussed, standard treatments don't systematically explore the specific structure of *act-dependent future probability shifts* as the primary driver of fanaticism absent tail events. This structure is central to CTF.

  **3. Method & Week-by-Week Breakdown (Total: ~16 weeks):**

  *   **Weeks 1-2: Groundwork & Formalization:**
      *   Precisely define TEF and CTF using minimal decision-theoretic frameworks.
      *   Formalize CTF: Define a model where an act A at t=0 has:
          *   Immediate outcomes with finite probability `p_i` and finite utility `u_i`.
          *   A crucial consequence: It increases the probability of performing A (or analogous beneficial acts) at future timesteps (t=1, t=2, ...) compared to not doing A. Model this probability shift function (e.g., `P(A_t | Do(A_0)) > P(A_t | ~Do(A_0))`).
      *   Goal: Show rigorously that the expected utility of *the entire future trajectory* diverges under plausible parameterizations, even though `p_i` and `u_i` are finite and non-extreme.

  *   **Weeks 3-5: Building Minimal Comparable Cases:**
      *   **TEF Case:** Design a canonical, stripped-down TEF scenario (e.g., a modified Pascal's Mugging). Ensure it relies solely on `p * v -> infinity` with `p` tiny and `v` huge/imfinite.
      *   **CTF Case:** Design a parallel minimal scenario *with the same core action and values*.
          *   Example: "Charitable Donation D"
          *   *Immediate Act:* Donate $100. Outcomes: Small chance (`p=0.1`) of directly saving 1 life (v=high but finite, e.g., 1000 utils), high chance (`p=0.9`) of no direct impact (v=0). *No tail event.*
          *   *Compounding Effect:* Donating significantly increases the probability you (and potentially others you influence) will donate again next month/year (`P(Donate_{t+1} | Donate_t) = 0.8` vs. `P(Donate_{t+1} | ~Donate_t) = 0.1`). Each future donation has the *same* immediate structure (small chance of saving 1 life, mostly no impact).
          *   **Make Them Comparable:** Key is ensuring the *immediate* expected utility of the single act is finite, modest, and similar in magnitude in both cases. The fanaticism *only* arises in TEF from the tail outcome and in CTF from the compounded expectation of the future sequence enabled by the act. Avoid any tail events in the CTF immediate act description.

  *   **Weeks 6-8: Applying & Testing Standard Remedies:**
      *   Systematically apply each standard remedy (discounting, bounding, risk-sensitivity, imprecision) to *both* minimal cases.
      *   Analyze: Does the remedy successfully mitigate fanaticism in TEF? Does it *also* mitigate fanaticism in CTF? If not, *why* not? (e.g., Bounding per-outcome utility kills TEF but leaves CTF divergence untouched; discounting small p kills TEF but applying discounting to the ordinary p in CTF is unjustified and ineffective against sequence divergence).

  *   **Weeks 9-11: Robustness & Generality:**
      *   Test CTF under variations: Finite but long sequences? Different probability shift functions? Network effects (influencing others)? Partial offsetting effects? Non-constant utilities/probabilities? Does divergence require infinite time or just sufficient compounding?
      *   Explore potential collapse arguments: Can *every* seemingly CTF case be redescribed as a TEF case? (e.g., by defining the "outcome" of the initial act as the entire future trajectory). Argue why this is either unworkable, conceptually misleading (masking the real causal structure), or practically intractable. Emphasize CTF's reliance on *structural feedback*, not tail events.

  *   **Weeks 12-14: Implications & Alternative Approaches:**
      *   Discuss the distinct challenges CTF poses. What remedies *might* address it? (e.g., Discounting the *future* based on time or uncertainty over compounding chains? Sophisticated models of bounded agency? Strong assumptions about the impossibility of long-term influence? Rejecting the summation of expectations over open-ended futures?).
      *   Highlight consequences for practical ethics, cause prioritization, and decision theory if CTF is real and distinct.

  *   **Weeks 15-16: Synthesis, Writing & Refinement:**
      *   Consolidate arguments, refine writing, ensure clarity of the distinction and implications. Integrate feedback.

  **4. Success Criteria & Failure Modes:**

  *   **Successful Result:**
      *   Clear, rigorous demonstration of the TEF/CTF distinction via minimal comparable cases.
      *   Convincing argument that standard remedies fail for CTF *because* they were designed for TEF.
      *   Robustness of the CTF case against trivial redescription as TEF.
      *   Articulation of why CTF represents a *genuinely distinct* and *novel* challenge within the EVF literature.
      *   Clear implications for future work on EVF and practical decision-making under long-term influence.

  *   **Project Failure (or Major Challenge):**
      *   **Collapse into TEF:** If every compelling CTF case can be *persuasively and non-arbitrarily* redescribed as a TEF case (e.g., the "outcome" of donating is not just immediate effects, but also the shift in future action probabilities, creating a complex, low-probability "meta-outcome" of enabling a massive future trajectory). Success requires showing why this redescription is either conceptually problematic or doesn't actually resolve the distinct challenge posed by the compounding dynamic.
      *   **Intractability of CTF Modeling:** If building a plausible, minimal CTF model that genuinely diverges without smuggling in tail events proves impossible or highly contrived.
      *   **Remedies Accidentally Work:** Discovery that an existing remedy (or a minor modification), perhaps applied in an unexpected way, effectively addresses CTF, undermining its distinctness.
      *   **Lack of Significance:** Failure to demonstrate that CTF is either prevalent or poses a meaningfully different practical challenge than TEF.

  **5. Candid Feasibility Assessment (4 Months):**

  *   **Ambitious but Achievable:** Four months of dedicated writing/research is sufficient for a strong chapter draft *if scope is tightly managed*.
  *   **Key to Success:**
      *   **Ruthless Minimalism:** The core argument hinges on *one* clean TEF case and *one* clean CTF case. Avoid getting bogged down in numerous variations early on. Build the simplest persuasive examples.
      *   **Focus on the Distinction:** Prioritize demonstrating the structural difference and the failure of standard remedies over exhaustively exploring all philosophical implications or novel solutions for CTF. Solutions can be discussed more speculatively.
      *   **Iterative Writing:** Start writing the core argument (Sections 1 & 2, Methodology) *early* (Week 2-3). Use writing to clarify thinking.
      *   **Pre-Existing Knowledge:** Leverage your deep familiarity with the EVF literature to move quickly through framing and standard remedy sections.
  *   **Risks:**
      *   **The Collapse Argument:** Wrestling with potential redescriptions of CTF as TEF could consume significant time. Be prepared to make a strong, concise case for distinctness without getting lost in metaphysical tangles. Define "tail event" operationally for your context.
      *   **Formalization Hurdles:** Making the CTF model both rigorous *and* transparent might take longer than anticipated. Seek simplicity.
      *   **Scope Creep:** Resist the urge to tackle all possible objections or implications exhaustively. Stay focused on the core thesis: *There are two distinct problems.*
  *   **Conclusion:** Four months is feasible with disciplined focus on the minimal core argument and examples. The clarity and novelty of the CTF concept provide a strong foundation. Prioritize demonstrating the distinction and the open challenge over solving CTF completely. This chapter has the potential to significantly reframe the EVF debate.
