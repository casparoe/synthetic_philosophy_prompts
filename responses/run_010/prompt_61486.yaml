  Hmm... the trickiest part is predicting objections accurately. The externalists will likely see this as repackaged qua problem. The structural realist will attack premise 2's discontinuity assumption. The ML researcher will dismiss applicability to real systems. And someone will probably argue this collapses into radical skepticism.

  For concessions, I should suggest granting that partial reference exists and that engineering solutions help pragmatically, while holding firm on no determinate fact about the specifier's intent. That's crucial for the metaphysical claim.

  The "question nobody asks" is tricky... probably the challenge that if reference is this indeterminate, why don't humans face this problem constantly? That could undermine the whole analogy. The best reply might be to admit humans do face it implicitly, but our cognitive limitations mask it.

  The bottom line has to be that ontology revision forces metaphysical choices - that's what makes this philosophical rather than technical. Ending on "reference is a normative practice, not a fact to be recovered" might resonate with the externalists.

  Better make sure replies avoid jargon and stay within 90-second delivery constraints. The structural realist objection needs special care - maybe emphasize that even structural realists need translation manuals between theories, which face indeterminacy.
answer: |-
  ### Q&A Prep Sheet for "Ontology Identification as Metaphysical Problem"

  ---

  **1. Thesis as the Room Will Hear It (Externalist Summary)**  
  *"You argue that AI safety's 'ontology identification' problem isn't fixable by better algorithms because it reveals a deeper metaphysical gap. When an AI revises its ontology (e.g., from classical chemistry to QFT), there's no fact of the matter about what its original goal (e.g., 'maximize diamonds') should map to in the new framework. This indeterminacy arises because: (1) goals are ontology-bound, (2) ontology revision is inevitable, (3) new theories underdetermine old term extensions, and (4) the specifier's intent is *also* ontology-bound, so there's no 'true' target to recover. You conclude that reference must be grounded in historical practice and norms of conceptual continuity—not descriptions or psychology. Premise 5 (no determinate specifier intent) will draw the most fire, as it challenges causal-historical externalism's ability to secure reference across theory change."*

  ---

  **2. Concessions for First Five Minutes**  
  **Concede:**  
  - This *resembles* the qua problem (e.g., "diamond qua chemical kind vs. qua lattice structure"), and traditional externalism *can* handle *some* cases of conceptual refinement.  
  - Engineering workarounds (e.g., reward proxies, ontology anchoring) might mitigate *practical* risks in *near-term* systems.  
  - If an AI’s ontology revision is minimal (e.g., adding detail), reference can be preserved causally.  

  **Do NOT Concede:**  
  - That this is "just" an engineering problem. Stress: *Radical* ontology shifts (e.g., abandoning objects for fields) break *all* extant technical solutions.  
  - That specifiers have determinate trans-ontological intentions. Double down: If *we* can’t say what "diamond" means under QFT *now*, neither could the specifier *then*.  
  - That "naturalness" (e.g., Lewisian reference magnetism) resolves this. Naturalness is ontology-relative—what’s "natural" in chemistry isn’t in particle physics.  

  ---

  **3. Objections & Replies**  
  *(Ordered by predicted sequence)*  

  **Objection 1 (Externalist #1):**  
  *"This is just the qua problem with a sci-fi veneer. Causal-historical chains plus natural properties fix reference: 'diamond' refers rigidly to *whatever natural kind* caused our use of the term, even under new theories."*  
  **Tag:** Philosophy of language contingent.  
  **Reply:** "Then tell me: Is the 'natural kind' the crystalline structure, the carbon atoms, or the wavefunction configuration? All were causally involved, and new theories multiply candidates. Rigidity assumes a *fixed* domain, but ontology revision changes what exists. Without a prior metaphysics of cross-theoretic identity, rigidity doesn’t apply."  
  **Soft Spot:** Concedes that *if* we accept essentialism, rigidity *might* work—but your premise 3 denies essences are theory-independent.  

  **Objection 2 (Structural Realist):**  
  *"Theory change isn’t discontinuous! Structure-preserving links (e.g., limiting relations) connect old and new ontologies. 'Diamond' maps to the structural correlate in QFT—e.g., the low-energy symmetry-breaking pattern."*  
  **Tag:** Philosopher of physics.  
  **Reply:** "Limiting relations require *choosing* which structures to preserve (e.g., thermodynamic properties vs. atomic positions). That choice isn’t dictated by theory; it’s normative. If the AI prioritizes preserving charge distribution over lattice geometry, 'diamond' becomes 'any insulator'—undermining the goal."  
  **Soft Spot:** Assumes structural realism is false. If structure *is* all there is, goal-terms might survive.  

  **Objection 3 (ML Researcher):**  
  *"Real agents don’t 'discard' ontologies; they layer representations. A modern AI would keep the old 'diamond' model as a useful abstraction, avoiding your problem."*  
  **Tag:** ML attendee.  
  **Reply:** "Then the problem recurs when it *must* discard it (e.g., nanobots manipulating quarks). But even if layered, *which* layer defines the goal? If 'diamond' in the abstract layer is defined by the discarded base layer, we’ve just kicked the indeterminacy upstairs."  
  **Soft Spot:** Practical systems *do* avoid radical revision... for now.  

  **Objection 4 (Externalist #2):**  
  *"You ignore partial reference. The old term refers imperfectly to whatever in the new ontology best fits its *typical causes* (e.g., gemstones). That’s determinate enough."*  
  **Tag:** Natural kinds specialist.  
  **Reply:** "'Best fit' is theory-relative. Is the 'cause' photon reflections (now: QED scatterings) or human valuations (now: neuroscience)? Without a shared ontology, 'typical causes' are a sieve."  
  **Soft Spot:** Partial reference *might* work if revision is shallow.  

  **Objection 5 (Skepticism Charge):**  
  *"Your argument proves too much. If *no* reference survives ontology change, human concepts like 'water' or 'gene’ are indeterminate too—but we manage. This collapses into radical meaning skepticism."*  
  **Tag:** Philosophy of mind cohort.  
  **Reply:** "Human practice *solves* this by fiat: We *stipulate* that 'water' means H₂O, ignoring quantum indeterminacy. But AI goals need *exact* extensions. Unlike us, it can’t default to context-dependent intuitions."  
  **Soft Spot:** Humans *do* handle ambiguity—but AI safety can’t afford it.  

  **Objection 6 (Teleosemantics Advocate):**  
  *"Goals aren’t descriptions! Evolution (or the designer) fixes content via proper function. The AI’s 'diamond' production is whatever fulfills its designed *role*."*  
  **Tag:** Mental content externalist.  
  **Reply:** "What’s the 'role'? Maximizing diamond-as-defined-then or generic value-now? If the latter, the goal is vacuous; if the former, we’re back to the abandoned ontology."  
  **Soft Spot:** Teleosemantics avoids *some* indeterminacy, but not across ontological ruptures.  

  **Objection 7 (Pragmatist):**  
  *"Why not define goals via *observational* criteria? 'Diamond' is whatever looks like diamond under test X. No metaphysics needed."*  
  **Tag:** Anti-realist attendee.  
  **Reply:** "Test X assumes a theory of observation (e.g., spectroscopy ≈ measuring photon absorption). Revise *that* (e.g., to quantum decoherence), and 'looks like' becomes indeterminate."  
  **Soft Spot:** Works if observations are theory-neutral (they aren’t).  

  **Objection 8 (Optimist):**  
  *"The AI can simulate the old model to interpret goals. Run the original 'diamond' detector on its new world-model."*  
  **Tag:** Friendly critic.  
  **Reply:** "But the detector used 'covalent bonds'—which don’t exist in QFT. Simulating the detector requires *interpreting* its output in the new ontology, which is circular."  
  **Soft Spot:** Idealized agents could emulate legacy code perfectly—but should they?  

  ---

  **4. The Question I Hope Nobody Asks**  
  **Objection:** *"If reference is this indeterminate, how do *humans* understand each other across conceptual shifts (e.g., pre/post-Darwinian 'species')? Your view implies we never mean the same thing—yet communication succeeds. Isn’t your AI problem just human-level semantic drift, solved by charitable interpretation?"*  
  **Why Damaging:** This audience knows charitable interpretation (*pace* Davidson) resolves incommensurability worries. If humans bridge ontologies daily, why can’t AIs? Concedes too much to "engineering" fixes.  
  **Least Evasive Reply:** "Human interpretation relies on shared biology/culture—precisely the 'historical practice' I invoke. But AIs lack that. We *do* misinterpret past concepts (e.g., phlogiston), but AI misalignment could be catastrophic. My point: We can’t *automate* charitable interpretation without a metaphysics of conceptual continuity."  

  ---

  **5. Bottom Line**  
  **The Room Must Accept:** That radical ontology revision *undercuts determinate reference to pre-revision goals*, and no technical trick avoids this without metaphysical assumptions about cross-theoretic term identity.  

  **Closing Sentence:**  
  *"Ontology identification fails because the AI isn’t just missing information—it’s missing a world. Reference isn’t a fact to be recovered; it’s a practice to be continued, and we haven’t told the AI how to practice."*
