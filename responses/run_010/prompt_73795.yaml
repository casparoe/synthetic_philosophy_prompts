prompt: |-
  I'm applying for a semester of research leave in political theory and need a two-page proposal. My half-formed idea: the standard debates about compulsory voting, lowering the voting age to sixteen, and enfranchising long-term resident non-citizens are usually run as three separate arguments about rights and legitimacy, but all three can be recast as questions about the electorate as a measuring instrument — if an election is supposed to yield a statistic about the governed population (who wants what, who would authorize whom), then each reform alters the sampling frame, the response rate, or the target population, and should be assessed by the bias and error it introduces rather than by the entitlement it recognizes. I suspect this instrumental framing and the standing-for/acting-for distinction in representation theory pull in opposite directions on at least one of the three.

  Write the proposal with: the question stated so that it has a determinate answer; why the existing positions on all three reforms leave it open; the method — what I would actually do week by week across a single semester, and why conceptual reconstruction of this kind makes progress where more voting-behaviour data would not; what a successful result looks like and what would count as failure, including the risk that the measurement analogy turns out to be decorative rather than load-bearing; and an honest recommendation about which of the three reforms I should drop to keep the scope realistic. No references — I'll add those myself.

  If you think my framing rests on a confused premise — say, that elections don't produce statistics at all, so there's nothing to be biased — tell me so plainly and propose a better question rather than writing a polished plan on a bad foundation. Also mark which parts of what you propose you take to be genuinely open and which you regard as already settled.
