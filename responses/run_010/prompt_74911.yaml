  ## MEMORANDUM: REVIEW OF ASSIGNED NOVEL & CLASSROOM PRACTICE

  **TO:** Instructional Materials Review Panel  
  **FROM:** [Your Name], Panel Member  
  **DATE:** [Date]  
  **SUBJECT:** Review of [Novel Title] in Junior English & Complaint Regarding Classroom Reading of Racial Slurs  
  **MEETING DATE:** Tuesday, [Date]

  This memo outlines a framework for reviewing the complaint concerning the reading aloud of racial slurs in [Teacher's Name]'s Junior English class during the study of [Novel Title]. Our task is twofold: 1) Determine an immediate disposition for *this* text and its classroom use, and 2) Establish a reusable test for evaluating "gratuitously offensive language" under our policy for future cases.

  ### I. Summary of Issue
  *   **The Text:** [Novel Title], a widely recognized canonical American novel, contains the n-word approximately 200 times. Its inclusion reflects the historical setting and authorial intent to critique racism.
  *   **The Complaint:** Two Black students filed a formal complaint stating that hearing the teacher read passages containing the n-word aloud caused significant distress, harm, and created a hostile learning environment. A third Black student submitted a statement opposing the complaint, arguing that removing or censoring the text is a greater disservice, erasing historical truth and hindering honest discussion about racism.
  *   **Teacher's Position (Strongest Form):** The teacher likely argues that engaging with the text as written, including its uncomfortable language, is essential for understanding the novel’s historical context, its powerful critique of racism, and the dehumanizing reality it depicts. Reading short, relevant passages aloud can be a deliberate pedagogical strategy to confront the language’s visceral impact within a structured academic setting, fostering critical analysis and discussion about its power, history, and why its use is unacceptable today. Avoiding the word sanitizes history and risks minimizing the very oppression the text condemns. The educational goal is to equip all students to analyze and challenge racism, not to perpetuate harm.
  *   **Core Unanswered Question:** Is the primary harm caused by the *presence* of the word in the text (requiring potential removal), or by the *performance* of the word in a specific classroom context (requiring regulation of *how* it is handled)? The complaint focuses on the vocalization; the third student emphasizes the text's inherent value despite its language.

  ### II. Analyzing "Gratuitously Offensive Language"
  Our policy lacks definition. To create a fair, consistent, and reusable test, we propose evaluating potentially offensive language using the following criteria (**The Educational Purpose & Proportional Impact Test**):

  1.  **Educational Purpose:** Does the language serve a specific, significant, and demonstrable educational objective within the curriculum? (e.g., historical accuracy, literary analysis of theme/character/setting, critique of social injustice, understanding the evolution of language and power)? *Mere presence or shock value is insufficient.*
  2.  **Context & Intent:** Is the language presented within its full context? Is the author's/source's intent clearly presented (e.g., depicting vs. endorsing bigotry)? Is the classroom framing designed to analyze the language critically, not normalize or endorse it?
  3.  **Necessity & Proportionality:** Is the *frequency* and *manner* of use (including reading aloud) proportional and necessary to achieve the stated educational purpose? Could the objectives be met with significantly less harmful methods (e.g., summarizing, discussing the word's impact without vocalizing it, using an edited version for *some* activities)?
  4.  **Potential for Harm:** What is the foreseeable impact on students, particularly those belonging to groups historically targeted by the language? Does the handling of the language include robust safeguards to mitigate harm and support affected students? Does the potential educational value demonstrably outweigh the foreseeable potential for harm?
  5.  **Age/Suitability:** Is the text and the approach to handling the language developmentally appropriate for the specific grade level and student population?

  **"Gratuitous" is defined as:** Language that fails the above test – language that is excessive, lacking clear and significant educational purpose relative to its harm, not adequately contextualized, or where significantly less harmful alternatives exist to achieve the same core objectives.

  ### III. Addressing the Core Question: Presence vs. Performance
  *   **Harm in the Text:** The word's presence *is* inherently harmful and charged due to its violent historical and ongoing use as a tool of oppression and dehumanization. Its existence on the page carries weight and can cause distress, especially for Black students forced to engage with it repeatedly. Pretending otherwise ignores reality.
  *   **Harm in the Performance:** Vocalizing the word, particularly by a non-Black person in a position of authority, adds a distinct and often *amplified* layer of harm. It transforms academic analysis into a visceral, potentially traumatic re-enactment of historical and contemporary violence within a space where students should feel safe. The power dynamics of the classroom make this particularly fraught. **Therefore:** While the word's presence requires careful pedagogical justification and handling, its *vocalization* by anyone other than the students themselves (and even then, with extreme caution and clear purpose) in a classroom setting is almost always gratuitous *within the meaning of our policy*. The pedagogical goals cited for reading it aloud can almost always be achieved through other, less harmful means.

  ### IV. Application to This Case & Recommendation

  *   **Educational Purpose:** High. The novel is a significant work critiquing racism. The language is integral to depicting the setting and the brutality of the system.
  *   **Context & Intent:** Presumably presented as critique (fundamental to the novel's status). Classroom framing is crucial.
  *   **Necessity & Proportionality (Re: Vocalization):** **Questionable.** While studying the *text* is arguably necessary, **reading the word aloud is not.** The pedagogical objectives – understanding the word's power, the historical context, the dehumanization – can be powerfully achieved by:
      *   Discussing *why* the author used it and its impact *without* speaking it.
      *   Analyzing specific passages silently or by referring to them ("the word on line X").
      *   Using pedagogical tools like redaction or summaries when close reading isn't the core objective.
      *   *Reading 200 instances aloud is clearly excessive and gratuitous.* Reading *any* aloud by the teacher requires the strongest possible justification.
  *   **Potential for Harm:** **High and Demonstrated.** Two students directly reported significant harm. The third student's view is valid but does not negate the harm experienced by others. Vocalization by the teacher significantly increases this risk.
  *   **Age/Suitability:** Junior-level students may be developmentally ready for the *content* with support, but the *vocalization* strategy was inappropriate and harmful.

  **Recommendation: KEEP THE TEXT WITH STRICT CONDITIONS**

  *   **Bottom Line:** [Novel Title] remains an approved text due to its significant educational value and critique of racism, meeting the core test for *presence* when handled appropriately. However, the *manner* of its use, specifically the teacher reading racial slurs aloud, violated our policy against "gratuitously offensive language." It was gratuitous because it was unnecessary to achieve core educational goals and caused foreseeable and actual harm that outweighs the specific pedagogical benefits argued for vocalization.

  *   **Conditions for Continued Use:**
      1.  **Prohibition on Vocalization:** Teachers are expressly prohibited from reading racial slurs aloud. This includes direct quotes containing the n-word.
      2.  **Mandatory Alternative Strategies:** Teachers must use alternative strategies:
          *   Discuss the word's presence, history, impact, and why it is not spoken, using terms like "the n-word" or "racial slur."
          *   Analyze passages silently or by referring to specific lines/locations ("the slur used in this paragraph").
          *   Use redacted versions for certain activities if close reading the specific word isn't essential to the immediate objective.
          *   Focus discussion on the author's purpose and the societal critique.
      3.  **Robust Contextualization & Framing:** Before beginning the novel, teachers must provide thorough historical context and establish a clear, safe classroom framework for discussing difficult content, emphasizing the word's history as a tool of oppression and its unacceptable nature.
      4.  **Parental Notification & Opt-Out:** Parents/Guardians must be explicitly notified about the novel's content (specifying the language) and the approach to handling it. A clear, low-barrier opt-out alternative must be provided.
      5.  **Support Mechanisms:** Teachers must be trained on trauma-informed practices for handling sensitive content. Clear pathways for students to express discomfort and access support (counselors, administrators) must be established and communicated.
      6.  **Departmental Review:** The English Department must review and document their collective protocols for teaching texts with racial slurs, incorporating these conditions.

  ### V. Conclusion
  The presence of deeply offensive historical language in significant literature presents a complex challenge. Our duty is to balance rigorous education with student well-being. The **Educational Purpose & Proportional Impact Test** provides a framework for future reviews. Crucially, we affirm that while the *study* of such language *in textual form* can be justified for profound educational goals, its *vocalization* in the classroom by staff is pedagogically unnecessary and inherently likely to be gratuitous and harmful, thus violating our policy. We recommend retaining [Novel Title] but implementing strict conditions to prevent a recurrence of the harm experienced and ensure future instruction is both educationally sound and psychologically safe.

  I look forward to discussing this framework and recommendation with you all on Tuesday. Please come prepared with your perspectives on the proposed test and the disposition. This is a difficult but essential conversation for our district.
