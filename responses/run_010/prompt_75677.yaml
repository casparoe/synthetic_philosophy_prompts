  **Debrief**

  After the three phases, guide the class to articulate the distinction between the stability of a common strategy and the ability of a rare strategy to invade.

  Start by asking:

  1. In phase 1, we started with a mix of strategies, but TFT became dominant. Why? (Because TFT, when common, gets high scores by cooperating with each other, and defectors do not get an advantage because they are punished.)

  2. In phase 2, we started with almost all defectors and one TFT. What happened? (The TFT died out.) Why? (Because when rare, TFT is exploited by defectors and gets a lower score than the defectors.)

  3. In phase 3, we started with the same low number of TFT (but two this time) and they were placed in fixed seats. What happened? (The TFT cluster grew.) Why? (Because the TFT in the cluster played with each other and got high scores, while the defectors at the edge of the cluster got lower scores by playing with other defectors and exploiting only a few cooperators.)

  Now, the key questions:

  - What was different between phase 2 and phase 3? (In phase 3, we changed the pairing rule: from random to neighbours.)

  - What does this tell us about the two questions: 
     (a) Can a strategy, once common, be dislodged? 
     (b) Can a strategy, while rare, get a foothold? 

  In phase 1, we saw that TFT, once common, is stable (it wasn't dislodged). In phase 2, we saw that TFT, when rare, couldn't get a foothold in a well-mixed population. In phase 3, we saw that TFT, even when rare, could get a foothold if the pairing is structured (because of clustering).

  The underlying distinction: the rule for who meets whom (the population structure) can make it possible for a strategy to invade when it would otherwise be unable to in a well-mixed population.

  **What Will Go Wrong**

  1. **Time management**: The activity might run over time. Solution: Practice the reproduction procedure beforehand. Use a timer. Skip a generation if needed.

  2. **Reproduction calculation**: The reproduction step with the tickets might be slow. Solution: Have extra blank tickets ready. Pre-print strategy names on slips to save time? Or have students write their strategy once and then the teacher can make copies? But that might not work. Instead, have each student write their strategy on multiple slips in advance? But they don't know their score. Alternative: use a different method: divide the class into groups and have each group do the calculation? But that might not help. We'll do the ticket method and hope.

  3. **Pairing in well-mixed**: Drawing from the hat might take time. Solution: Have multiple hats or do simultaneous draws? Or pre-assign partners for each encounter using a random assignment list prepared in advance? But that would require a computer. We'll do the hat and have students help.

  4. **Strategy errors**: Students might not follow their strategy. Solution: Have a practice round. Monitor the first encounters.

  5. **Grid movement**: In phase 3, arranging the grid might take time. Solution: Pre-mark the floor or have a seating chart. Do the reset quickly.

  **What the Activity Cannot Reproduce**

  1. **Local reproduction**: In a true spatial model, reproduction is local (e.g., a player is replaced by a neighbour's offspring). In our activity, reproduction is global (proportional to global score). This is a simplification. The cost is that in the spatial phase, a defector in a sea of defectors has the same chance of being replaced as a defector at the edge of a TFT cluster, but in reality, the edge defector might have higher score. However, in our setup, the defector at the edge does have a higher score than a defector in the interior (as we saw in the example), so it's still captured. But the global reproduction might introduce a slight distortion: it allows offspring from anywhere to replace any seat. In a true spatial model, the cluster would grow more reliably.

  2. **The exact invasion dynamics**: The activity uses a finite population and discrete generations, which might not perfectly match the continuous models in the literature. The thresholds we calculated are for infinite populations. In a finite population, there is drift.

  3. **The effect of mutation**: We only discussed it theoretically. The activity does not run with mutation.

  4. **Other strategies**: We only used three strategies. In reality, there are many more.

  Overall, the activity captures the core ideas at the cost of these simplifications.
