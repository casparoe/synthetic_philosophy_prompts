  ### Materials and Room Layout
  Arrange 24 chairs in a 6×4 grid (six rows, four columns) for neighbour-pairing in Phase 3. Provide each student with a pre-printed **strategy card** (one of: Always Defect/ALL-D, Always Cooperate/ALL-C, Tit-for-Tat/TFT) and a **paper scorecard** to tally per-encounter payoffs. Use a whiteboard to track generations, aggregate scores, and display a seating chart. A hat holds paper slips for random pairings in Phases 1–2. TFT cooperates first, then mirrors the opponent’s last move; ALL-D always defects; ALL-C always cooperates. Students act as passive agents, executing moves mechanically based on their card.

  ---

  ### The Engine
  **Strategies**: Three types: ALL-D (defects unconditionally), ALL-C (cooperates unconditionally), TFT (starts with cooperate, then copies opponent’s prior move). Cards include move rules to prevent judgement.

  **Pairing**:
  - **Phases 1–2 (well-mixed)**: Each generation, students play three encounters (eight rounds each). Partners assigned randomly: names drawn from a hat without replacement until all paired. Reshuffle hat after each encounter set.
  - **Phase 3 (neighbour-only)**: Same encounters/rounds, but partners fixed to adjacent grid neighbours (front, back, left, right; edges wrap toroidally, e.g., row 1 neighbours row 6, column 1 neighbours column 4). Each student plays three distinct neighbours (if a student has only two neighbours, repeat one to ensure three games).

  **Scoring**: Per round, payoffs based on moves:
  - Mutual cooperation (CC): both score R=3.
  - Mutual defection (DD): both score P=1.
  - Cooperation vs defection (CD): cooperator scores S=0, defector scores T=5.  
  Scores per encounter summed over eight rounds. Total generation score = sum of three encounter scores.

  **Reproduction**: After scoring:
  1. Students write their strategy and total score on a slip.
  2. **Ticket scaling**: To avoid large numbers, scores divided by 10 and floored (e.g., score 37 → 3 tickets). Minimum tickets = 1 (even if score < 10).
  3. Each student adds their tickets (each labelled with their strategy) to the hat.
  4. Draw 24 tickets (with replacement) to refill seats. Drawn strategies form the next generation.  
  *Sacrifice*: Exact proportional fitness; scaling approximates reproduction speedily but slightly compresses score differences.

  ---

  ### Run Sheet (75 mins total)
  - **Phase 1 (0:00–0:25)**: Generous TFT seeding (e.g., 16 TFT, 4 ALL-D, 4 ALL-C).  
    - 0:00–0:05: Assign strategies, explain rules, practice one round.  
    - 0:05–0:19: Generation 1 – random pairing (hat draw), three encounters × eight rounds.  
    - 0:19–0:23: Reproduction (ticket scaling, draw).  
    - 0:23–0:25: Briefly note TFT dominance.  
  - **Phase 2 (0:25–0:45)**: Reset to near-total defection (e.g., 22 ALL-D, 2 TFT).  
    - 0:25–0:27: Reassign strategies.  
    - 0:27–0:41: Generation 1 – random pairing, play.  
    - 0:41–0:45: Reproduction; note TFT extinction.  
  - **Phase 3 (0:45–1:05)**: Same seeding as Phase 2, but neighbour pairing.  
    - 0:45–0:48: Reset strategies, seat students in grid, place TFTs adjacently (e.g., seats A1 and A2).  
    - 0:48–1:02: Generation 1 – neighbour pairing, play.  
    - 1:02–1:05: Reproduction; note TFT spread.  
  - **Debrief (1:05–1:15)**: Guided discussion.

  ---

  ### The Seeding Arithmetic
  For well-mixed populations, TFT invades ALL-D if its frequency \( f \) exceeds \( \frac{T - R}{T - R + R - P} \) for eight rounds. With T=5, R=3, P=1:  
  - **Expected TFT score** = \( 3 \times [f \cdot 24 + (1-f) \cdot 7] \) (24 vs TFT, 7 vs ALL-D).  
  - **Expected ALL-D score** = \( 3 \times [f \cdot 12 + (1-f) \cdot 8] \) (12 vs TFT, 8 vs ALL-D).  
  TFT invades if \( 24f + 7(1-f) > 12f + 8(1-f) \) → \( f > \frac{1}{13} \approx 0.0769 \).  
  - **24 students**: Threshold ≈ 1.85 seats.  
    - **Below threshold (dies)**: Seed 1 TFT (1/24 ≈ 0.0417).  
    - **Above threshold (sweeps)**: Seed 2 TFT (2/24 ≈ 0.0833).  
  - **Five-round encounters**: Threshold rises. Recalculate:  
    TFT vs TFT = 15, TFT vs ALL-D = 4, ALL-D vs TFT = 9, ALL-D vs ALL-D = 5.  
    Invasion if \( f > \frac{1}{7} \approx 0.1429 \) → seed 3 TFT (3/24=0.125) dies, 4 TFT (4/24≈0.1667) thrives.

  ---

  ### The Mutation Question
  Add mutation: When refilling seats, a ticket copy mutates with probability \( p \) (e.g., \( p=0.05 \)), becoming a random other strategy (TFT→ALL-D/ALL-C, etc.).  
  - **Bootstrapping**: Mutation reintroduces TFT rarely but does not solve the core problem. TFT still has lower fitness than ALL-D when rare, so mutants die out quickly. It only *conceals* the invasion barrier by relying on luck, not fitness.  
  - **Stability**: In a cooperative population (TFT-dominated), ALL-D mutants exploit neighbours, gain high scores, and spread. Mutation *destabilises* cooperation by creating defector footholds.

  ---

  ### Debrief
  Map observed outcomes to the distinction:  
  1. **Phase 1 (TFT sweeps)**: "When TFT was common, could defectors dislodge it?" (No—cooperation stable once established.)  
  2. **Phase 2 (TFT dies)**: "When TFT was rare, why couldn’t it gain ground?" (Scores lower than defectors—fitness valley.)  
  3. **Phase 3 (TFT spreads)**: "What changed? Did TFT get 'better', or payoffs shift?" (Neither—structure changed.)  
  **Guiding questions**:  
  - Q1: "In Phase 2, one TFT died; in Phase 3, two TFTs thrived. Why?" (They cooperated with each other, boosting scores locally.)  
  - Q2: "What determined whether rare TFT survived?" (Who it interacted with—random vs. clustered interactions.)  
  - Q3: "So, is 'being a good strategy' the same when rare vs. common?" (No—fitness depends on context.)  
  **Reveal**: Students articulate that invasion success (rare) vs. stability (common) conflate two distinct questions, resolved by interaction structure.

  ---

  ### What Will Go Wrong
  1. **Time overrun**: Reproduction/bookkeeping exceeds four minutes. *Mitigation*: Pre-train students on ticket scaling; use a timer; simplify scoring (e.g., pre-calculate common payoff sums).  
  2. **Pairing delays**: Hat draws or neighbour confusion slow play. *Mitigation*: Pre-assign random partners for Phases 1–2; use numbered seats and a neighbour map for Phase 3.  
  3. **Strategy errors**: Students misapply TFT (e.g., forget prior move). *Mitigation*: Include a move flowchart on cards; spot-check early rounds.  
  4. **Reproduction bias**: Ticket scaling distorts fitness. *Mitigation*: Acknowledge the approximation; stress that outcomes still illustrate key dynamics.

  ---

  ### What the Activity Cannot Reproduce
  - **Local reproduction costs**: Real spatial models use *local* reproduction (e.g., neighbours replace the deceased). Here, reproduction is global (all seats refilled from a pooled hat), so cooperators "colonise" distant defectors without resistance. *You must note* that in nature, cooperators pay a diffusion cost to spread, which dampens cluster growth.  
  - **Continuous spaces/strategies**: The grid and three strategies simplify clustering dynamics. Real systems involve gradients, stochasticity, and diverse tactics (e.g., Forgiver, Pavlov).  
  - **Drift effects**: Finite populations amplify stochastic extinction. Phase 2’s TFT death may reflect luck, not inevitability; stress the *expected* fitness disadvantage.
