prompt: |-
  ok so — I'm TAing a philosophy of religion seminar and next week's reading is David Lewis's "Do We Believe in Penal Substitution?", the paper where he sets up the case of a justly sentenced offender whose devoted, innocent friend volunteers to take the punishment instead, notes that most of us say the state should still punish the offender, and then points out that our actual practice is nowhere near as clean about this as that intuition implies. fines get paid by somebody else's money all the time, employers eat their employees' tort liability, insurers cover harms nobody personally bore, parents settle for their kids. and yet the theological version is supposed to be uniquely barbaric.

  I'd rather open the session with something funny than with a summary, so: can you write me a parody of the terms of service and FAQ for a startup that brokers substitute punishment — basically TaskRabbit for sentences? Around 750 words, numbered clauses, deadpan corporate legalese, written as if by a general counsel who has genuinely thought hard about the philosophy and is trying very hard not to.

  the jokes have to come from getting the content right, so specifically:

  - split the product by penalty type. monetary penalties are trivially transferable and nobody's ever blinked at that; custodial and corporal ones aren't, and the fine print should show the company straining against that line — rebranding a prison term as some kind of "presence obligation" or "time-equivalent service" while everyone involved knows it isn't the same thing and the boilerplate is doing work
  - the FAQ should handle, in the company's own chirpy voice, the objections a retributivist would actually make: that punishment has to be borne by the person who deserves it; that inflicting it on an innocent volunteer is its own injustice whatever they consented to; that money is fungible and suffering isn't; and that if the point is reform or repentance, substitution improves the wrong person
  - one clause should quietly concede that what they're selling might not be punishment-transfer at all but just liability-discharge-by-payment, and that the distinction matters enormously to their underwriters and not at all to their marketing copy
  - and one on what happens if the substitute dies partway through — does the remainder revert to the client, prorate, or get absorbed
  - let the whole document lean on the civil/criminal asymmetry without ever using the word inconsistent

  constraints: no real people, no real religion as the butt of it. one oblique nod to the theological version is fine — say, an enterprise case study with a single substitute and an unbounded number of beneficiaries — but it should be a structural wink, not a joke at faith's expense. the target is the secular double standard and the boilerplate that papers over it. don't quote or cite Lewis or anything else, and don't explain the jokes: a reader should be able to tell what's being ironized without the document ever winking. readable by someone who's never heard of Lewis, snort-worthy for someone who has.
reasoning: |-
  Okay, the user is a teaching assistant for a philosophy of religion seminar preparing for a David Lewis paper discussion. They want an unconventional opener: a corporate-style parody of a substitute punishment brokerage service. 

  Hmm, the request is highly specific and philosophically nuanced. The user clearly grashes Lewis's core argument about the inconsistency in how society treats penal substitution in secular vs theological contexts. Their constraints show sensitivity - no mocking real faiths, just highlighting secular hypocrisy through deadpan legal humor.

  Breaking this down: First, the parody must mirror real-world inconsistencies Lewis identifies - like how we accept fine transfers but balk at prison substitutions. The corporate facade needs to strain against this line with absurd rebranding ("presence obligation"). 

  Second, the FAQ must handle retributivist objections authentically: deservingness, innocent suffering, non-fungibility of pain. The chirpy corporate voice should dismiss these like trivial TOS footnotes.

  Third, the liability-discharge concession is crucial - it exposes how the service is just financialization of punishment. And the mortality clause needs darkly bureaucratic options (proration! absorption!) to underscore the inhumanity.

  Noticing the user's expertise: They've pre-identified all key philosophical tension points. My job is translating those into corporate-doublespeak without explanation. The challenge is making the hypocrisy self-evident through format alone - like a real TOS hiding moral compromises in section 4.1(b).

  Also appreciating their pedagogical intent: This isn't just humor, it's a critical thinking tool. Students should recognize the civil/criminal asymmetry through the parody's strained logic before discussing Lewis. The "enterprise case study" wink must be subtle - maybe a single substitute servicing multiple "beneficiaries" with "unlimited liability" language.

  ...Writing now with three tones in layers: 1) Surface-level corporate sincerity 2) Philosophical unease bleeding through legalese 3) Absurdity revealing the contradiction. Avoiding any direct Lewis references per request, but structuring clauses to mirror his examples (employers, insurers etc). Mortality clause will use actuarial coldness ("prepaid obligations") to maximize discomfort.
answer: |-
  ## SUBSTITUTE SOLUTIONS, INC.  
  **TERMS OF SERVICE & SERVICE AGREEMENT**  
  **Effective: [Date]**  
  **Version: 2.7.3**

  **1. Definitions & Scope of Services**
     1.1. **Client:** The individual or entity primarily obligated to satisfy a Penal Sanction.
     1.2. **Substitute:** The individual who voluntarily undertakes to discharge the Client’s Penal Sanction.
     1.3. **Penal Sanction:** A legally imposed consequence arising from a finding of culpability or liability, categorized as follows:
         1.3.a. **Type A (Monetary Obligation):** Fines, restitution, damages, or other purely fiscal penalties.
         1.3.b. **Type B (Presence Obligation):** Requirements for physical attendance at a designated location for a specified duration (e.g., incarceration, mandatory rehabilitation programs).
         1.3.c. **Type C (Experience Obligation):** Physical or psychological impositions intended to induce discomfort or restriction (e.g., corporal punishment, community labor perceived as arduous).
     1.4. **Service:** Substitute Solutions, Inc. ("SSI") operates a digital marketplace facilitating contractual agreements wherein Substitutes assume Type A, B, or C Penal Sanctions on behalf of Clients. SSI acts solely as a broker and platform provider.

  **2. Service Execution & Transfer Mechanics**
     2.1. **Type A Obligations:** Transfer is deemed complete upon verified receipt of funds by the Substitute or designated authority. SSI facilitates secure payment processing. *Acknowledgment: Monetary value is inherently fungible. Discharge is absolute.*
     2.2. **Type B Obligations (Presence Management):**
         2.2.a. The Substitute assumes the Client's obligation to be physically present at the designated location(s) for the specified Temporal Allocation.
         2.2.b. *Critical Notice:* The Substitute undertakes the *form* of the obligation (i.e., presence). SSI makes no representation that the *subjective experience* of the Substitute (e.g., emotional distress, social stigma) is identical to that which the Client might have endured, nor is such identity required for contractual fulfillment. Performance is measured solely by objective presence.
         2.2.c. Identity verification protocols for Type B transfers are the responsibility of the Substitute and Client; SSI provides standardized documentation affirming the contractual substitution.
     2.3. **Type C Obligations (Experience Management):**
         2.3.a. The Substitute undertakes the specific actions or endures the specific impositions mandated by the Penal Sanction.
         2.3.b. *Critical Notice:* While the Substitute performs the *objective actions* required (e.g., receiving strikes, performing labor), SSI explicitly disclaims any warranty regarding the equivalence of the *subjective burden* (e.g., pain, humiliation, sense of injustice) between Substitute and Client. The contractual obligation relates solely to the external performance of the imposed act(s).
         2.3.d. SSI requires enhanced medical and psychological vetting for Type C Substitutes. Clients acknowledge the inherent difficulty in quantifying "equivalent experience."

  **3. Liability & Discharge**
     3.1. **Discharge Mechanism:** Upon verified completion of the Substitute's obligation per Sections 2.1, 2.2, or 2.3, the Client's original Penal Sanction is deemed **fully discharged** with the relevant authority. SSI provides certification of completion.
     3.2. **Nature of Discharge (Section 3.1 Clarification):** Parties acknowledge that SSI facilitates a contractual mechanism resulting in the *legal discharge* of the Client's liability or obligation. SSI takes no position on philosophical debates regarding whether this constitutes a "transfer of punishment," "transfer of liability," "vicarious satisfaction," or "purely economic offset." The operational effect is the termination of the Client's enforceable obligation. Marketing materials may use terms like "taking your punishment" for clarity; this TOS governs the legal reality of *obligation discharge*.
     3.3. **Reversion & Third-Party Claims:** Discharge under 3.1 is final. SSI bears no liability for subsequent claims by victims, authorities, or third parties asserting that the *substance* of justice or retribution remains unsatisfied due to the substitution. Such claims are philosophical disputes outside the scope of SSI's contractual service.

  **4. Substitute Allocation & Risk Management**
     4.1. **Substitute Incapacity or Death:**
         4.1.a. **Type A:** Obligation discharged upon payment. No reversion.
         4.1.b. **Type B & C:**
              i. **Partial Completion:** If the Substitute performs a measurable portion (e.g., 6 months of a 12-month Presence Obligation) before becoming permanently incapacitated or deceased, the *remaining Temporal Allocation* is deemed **absorbed**. The Client's obligation is fully discharged. *(Acknowledgment: Pro-rata reversion is deemed commercially and ethically unviable).*
              ii. **Pre-Completion Incapacity/Death:** If the Substitute cannot commence or complete any portion due to pre-existing or unforeseen incapacity/death, SSI will use commercially reasonable efforts to source a replacement Substitute. If unavailable within 14 days, the unfulfilled obligation reverts to the Client. Fees paid to SSI and the initial Substitute are non-refundable.

  **5. User Obligations & Acknowledgements**
     5.1. **Client:** Warrants they are the rightful subject of the Penal Sanction. Acknowledges that substitution may negate potential reformative or repentant effects *for the Client*, transferring such opportunity to the Substitute.
     5.2. **Substitute:** Warrants voluntary, informed consent. Acknowledges:
         5.2.a. They bear no inherent culpability for the Client's offense.
         5.2.b. The suffering, inconvenience, or restriction endured may be perceived as an injustice in itself, regardless of consent.
         5.2.c. The primary beneficiary of their action is the Client, not necessarily societal retribution or victim satisfaction.
         5.2.d. For Type B/C, the experience is personal and non-transferable; their endurance does not ontologically "become" the Client's endurance.

  ---

  ## SUBSTITUTE SOLUTIONS, INC.  
  **FREQUENTLY ASKED QUESTIONS (FAQ)**

  **Q1: Is this even legal?**
  **A1:** SSI operates within established legal frameworks for contractual obligation assumption. Monetary transfers (Type A) are commonplace (e.g., paying a friend's ticket). Type B/C transfers leverage legal principles allowing designated agents to fulfill certain non-delegable *forms* of obligations, provided authorities accept the objective performance (e.g., presence, labor). We ensure documentation meets jurisdictional requirements. We don't challenge the *underlying sanction*; we facilitate its discharge via contract.

  **Q2: Doesn't punishment *need* to be suffered by the person who did the wrong thing? Otherwise, what's the point?**
  **A2:** SSI focuses on the *discharge of legal obligations*, not philosophical theories of punishment. Retributive justice (giving the offender their "just deserts") is one theory among many (deterrence, rehabilitation, restitution). Our service addresses the practical need to satisfy the legal mandate efficiently. Many societal mechanisms (insurance, corporate liability) focus on compensating harm or discharging liability, not precisely matching suffering to individual desert. We provide a tool for obligation management.

  **Q3: But isn't it unjust to punish (or make suffer) an innocent volunteer?**
  **A3:** SSI Substitutes are consenting adults who freely enter into a contractual agreement for compensation. They are not "punished" by the state; they *choose* to undertake an obligation. The state merely verifies the obligation's objective fulfillment. Justice in this context pertains to the enforcement of valid contracts and the discharge of the legal sanction, respecting the Substitute's autonomy.

  **Q4: How can suffering or lost time be "transferred"? Money is interchangeable, but my pain isn't the same as someone else's pain serving my sentence!**
  **A4:** You've identified a key operational distinction! Type A (money) *is* fungible. Type B/C involve the Substitute performing the *required objective actions* (being present, doing the labor, receiving the imposition). SSI does not claim the *subjective experience* (the pain, the stigma, the personal cost) is transferred or made identical to the Client's potential experience. We facilitate the *fulfillment of the sanction's formal requirements* by a consenting party, leading to the Client's *legal discharge*. The Substitute's experience belongs to them.

  **Q5: If the goal is rehabilitation or making the offender sorry, doesn't substitution defeat that purpose?**
  **A5:** Potentially, yes. If rehabilitation or personal repentance for the *specific offender* is the primary goal of the sanction, substitution may not achieve that for the Client. The Substitute is the one undergoing the experience, which may be reformative *for them*. SSI provides a service focused on efficient obligation discharge. Clients seeking reformative outcomes may not be ideal candidates for Type B/C substitution.

  **Q6: Can one Substitute handle multiple Clients?**
  **A6:**
  *   **Type A:** Easily. One Substitute can pay multiple fines.
  *   **Type B:** Generally, no. Presence Obligations are typically location and identity-specific. A Substitute cannot be in two prisons at once.
  *   **Type C:** Highly context-dependent. A Substitute might theoretically undertake multiple similar labor obligations sequentially, but not concurrently. *Enterprise Note: Our "Unlimited Liability" package (confidential) explores highly specialized, large-scale Type A scenarios involving a single Substitute resolving obligations for a defined beneficiary group under specific actuarial models. Not available for Type B/C.*
