  - **Methodology**: They’re right to avoid cherry-picking cases. The solution? *Systematize* regime-shifts into categories (e.g., rapid environmental change, domestication, organ transplantation) and pre-define what counts as a "fair test"—e.g., demanding internal consistency *within* an account across cases, not just intuitive verdicts.  
  - **Stakes**: They hate boilerplate about "broader impacts," but the medicine/ecology examples *are* the impact. I’d embed those in the "success/failure" section: Success isn’t just theoretical—it’s showing *which* account (or hybrid) actually helps clinicians decide if a transplanted kidney "functions" or tells ecologists which traits to prioritize in conservation.  
