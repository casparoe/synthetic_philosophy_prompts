  What’s particularly sharp is their insistence on *practical consequences*: how function ascriptions actually guide decisions in medicine, conservation, or ecology when these accounts clash. They’re also wary of lazy pluralism—just saying "both are useful" without resolving conflicts. The committee’s composition (two philosophers of biology, one of medicine) means the proposal must bridge subfields without oversimplifying. 

  Their half-formed idea is solid but needs scaffolding:  
