prompt: |-
  You're an expert in democratic theory and election administration — social choice, the philosophy of voting, the actual practice of drafting ballot language, all of it. Think carefully before you write, and don't jump straight to the deliverable.

  Here's my situation. I work in a small state office that certifies ballot language for statewide initiative measures. Two lawyers and me, none of us with any social-choice training. For every measure that clears the signature count we currently do exactly one thing: check that the official title and summary are accurate and non-argumentative, sign off, done. Budget is about an hour per measure, less in a crunch year when forty are queued up between September and the filing deadline. What we certify is what voters actually read on the ballot, so when it goes wrong it goes wrong publicly and it's my name on it.

  New wrinkle from our director: we now run a second screen before certifying. We have to say whether the question is *answerable* — meaning, is there a determinate thing that happens on each of the two answers, and could a voter reading our summary tell which of those two things they'd be choosing. If the answer is no, note that we have no power to kill a measure and aren't supposed to want one. Our whole action space is: certify as drafted, certify with a rewritten explanatory statement that puts the ambiguity on the page where voters can see it, or flag a legal question up to the AG. That's it.

  Write me the procedure we'd run. Specifically:

  - the questions to work through, in order, with what counts as a *sufficient* answer at each step and what a failure looks like on paper (not in theory — what would I be seeing in a filing)
  - where the procedure terminates in "certify," where it forces a rewritten explanatory statement, and where it hands the thing to a human because the question underneath is about values and not about facts, and which human
  - every step where the honest description is "this is a judgment call we've dressed up as a check." Label those explicitly. I would rather have them marked than buried, because I'll be defending the signoff in a public meeting someday.

  On grounding: base it on what social choice and the philosophy of democracy actually establish, but be a good citizen about it. My colleagues wave famous impossibility results at me constantly and I want that to stop — so tell me which of the big results do **not** bite on a single yes/no question and why not, and for the ones that do bite (collapsing a three-way option set into one binary, whatever else you think is real here), say precisely what they license us to conclude and don't oversell it. A procedure that rests on a result that doesn't apply is worse than no procedure.

  Two hard cases it has to absorb without special pleading:
  (a) a measure drafted as a bare instruction to the legislature to go enact something, rather than as self-executing text. The Swiss treat that as a distinct category of popular initiative with its own validity test, and I think that's instructive even though we don't have their machinery — what does answerability even mean when the thing being voted on is a direction to a future body?
  (b) a purely advisory question where nothing legally follows from either answer. Do we certify it, and on what theory?

  Then run the procedure on three filings. Show your work at each step, don't just give me the verdict.

  1. A one-sentence measure withdrawing the state from a multi-state compact, with no transition provisions. The yes campaign is already running ads saying a no vote means the legislature should go renegotiate better terms. The no campaign is saying a no vote means we stay exactly as we are. Both statements are in circulation now and our summary is silent on it. (The 2016 UK referendum is the obvious cautionary case — a two-option choice with no exit terms attached and a statute that didn't itself do anything — but don't build the procedure around it, we don't have that political setting.)

  2. One sales-tax increase funding three named projects: a riverfront park, a municipal pool, and a transit line. Single subject is claimed on the basis that all three serve recreation and mobility. Our AG will tell us the single-subject rule is satisfied, and she's right — the courts here read it so loosely that basically nothing has ever failed it. I want to know whether the answerability screen catches something the single-subject screen structurally can't, and if it does, what the procedure tells me to do given that I can't strike anything.

  3. The one I don't want. A measure striking one category out of the state civil rights statute. One sentence, one subject, self-executing, no transition gap, and the consequences of yes and of no are each perfectly clear and describable — our summary could be written in nine lines with nothing contestable in them. I expect the procedure to certify this and I want it to say so plainly. If your procedure blocks it instead, I want you to explain exactly which step is doing the blocking and why that's a substantive judgment we have no mandate, no competence, and no democratic standing to make.

  Finish with a short section on what this procedure cannot do that we should stop pretending it can — including, I suspect, anything about whether the outcome will be good, and anything about how much a 51% win licenses the winning side to claim afterwards.

  Start with a brainstorm: list the distinct ways a ballot question can fail to determine an outcome, before you turn any of them into steps. That list is most of the value for me, so don't compress it into the procedure.
reasoning: |-
  We are given a situation where a small state office certifies ballot language for statewide initiative measures. The office currently checks for accuracy and non-argumentative language. Now, they must also check for "answerability": whether the question has a determinate outcome for each answer (yes or no) and whether a voter can tell what they are choosing.

  The procedure must be based on social choice theory and democratic philosophy, but must be practical and not overstep by using results that don't apply to binary choices.

  First, we brainstorm the distinct ways a ballot question can fail to determine an outcome:

  1. **Ambiguity in the measure's text**: The language of the measure is vague or open to multiple interpretations, so that even if passed, it is unclear what will happen. For example, it uses terms that are not defined or have multiple meanings.

  2. **Incompleteness**: The measure does not specify what happens in certain scenarios. For example, it might not include transition provisions, repeal mechanisms, or details on implementation, leaving gaps that must be filled by other authorities (like the legislature or courts).

  3. **Contingency**: The outcome of the vote depends on future events or actions by others that are not guaranteed. For example, a measure that directs the legislature to do something, but the legislature may or may not comply.

  4. **Multiple outcomes bundled together (logrolling)**: The measure combines several distinct issues into one yes/no vote, so that a voter might agree with some parts and disagree with others, but cannot express that. This is a classic social choice problem (e.g., the paradox of voting, Arrow's impossibility), but note that Arrow's theorem applies to ranking three or more options, not to a single binary choice. However, for a binary choice, if the measure bundles multiple independent issues, it forces a voter to take an all-or-nothing stance, which may not reflect their preferences and can lead to inconsistent collective outcomes if the issues were voted separately.

  5. **Advisory nature**: The measure is non-binding, so the vote does not directly cause any change. The outcome is merely a recommendation.

  6. **Self-contradiction**: The measure has internal contradictions that make it impossible to implement as written.

  7. **Dependence on external factors**: The measure's effects depend on factors outside the control of the state, such as federal law or actions by other states, and the measure does not account for possible conflicts or contingencies.

  8. **Unenforceability or unconstitutionality**: The measure may be struck down by courts, but note that the office is not asked to judge constitutionality (unless it's a legal question for the AG). However, if the measure is clearly unenforceable (e.g., conflicts with federal law) and that affects the determinacy of the outcome, it might be relevant.

  Now, we design the procedure. The goal is to check for answerability in a binary choice. We are not evaluating the merits, wisdom, or constitutionality (except as a legal question for the AG).

  The procedure steps:

  **Step 0: Initial Check for Accuracy and Non-argumentative Language (Current Practice)**
     - This step remains. We assume the measure has passed this.

  **Step 1: Identify the Explicit Outcomes for Yes and No**
     - **Question**: For a "yes" vote, what is the explicit, immediate legal outcome? For a "no" vote, what is the explicit, immediate legal outcome?
     - **Sufficient answer**: Clear statement of the change (for yes) and the status quo (for no) or the alternative (if no is not the status quo). If the measure is self-executing, the outcomes should be directly from the text. If it directs the legislature, then the outcome is the direction given (but note the contingency).
     - **Failure**: If the outcomes are not stated or are unclear from the text. For example, the measure says "the legislature shall consider" without specifying what they must do, or the no vote outcome is not defined (especially if the measure replaces an existing law and the no vote might leave a gap).
     - **Judgment call?** Partly. We are reading the text to see what it says. If the text is ambiguous, that's a failure. If it's clear, we proceed.

  **Step 2: Check for Ambiguity in Key Terms**
     - **Question**: Are there any terms in the measure that are undefined and subject to multiple reasonable interpretations? And do these interpretations lead to significantly different outcomes?
     - **Sufficient answer**: All key terms are defined in the measure or by existing law (and we can verify that). If not, but the meaning is commonly understood and unambiguous in context, that might be acceptable. But if the term is critical and ambiguous, it fails.
     - **Failure**: The measure uses terms like "reasonable", "fair", "soon", without definition, and the interpretation could change the effect of the law. Or, in the case of a compact withdrawal, what "withdrawal" entails is not specified (e.g., immediate? with notice?).
     - **Judgment call?** Yes. We must judge whether a term is ambiguous and whether the ambiguity is material. We are not resolving the ambiguity, just noting if it exists.

  **Step 3: Check for Completeness (No Gaps)**
     - **Question**: Does the measure provide for all necessary steps to achieve the stated outcome? For a "yes" vote, does it specify how and when the change occurs? For a "no" vote, is the status quo clearly defined and complete?
     - **Sufficient answer**: The measure either self-executes or provides a clear mechanism. If it directs the legislature, it must at least specify what the legislature is to do. For a no vote, the status quo should be stable (no gap).
     - **Failure**: The measure leaves implementation to an unspecified process, or the no vote leaves a void (e.g., repealing a law without a replacement). Also, if the measure depends on other actions that are not guaranteed (like federal approval) and doesn't say what happens if those fail, that's a gap.
     - **Judgment call?** Yes, in determining what is "necessary". We are not filling gaps, just identifying if there are any.

  **Step 4: Check for Independence from Future Contingencies (if applicable)**
     - **Question**: Is the outcome of the vote dependent on future actions by other bodies (like the legislature) or events? If so, does the measure specify what happens if those actions are not taken or events do not occur?
     - **Sufficient answer**: If the measure is self-executing, it passes. If it directs the legislature, then it must be clear that the outcome of the vote is the directive itself (so the immediate outcome is the expression of the will of the people). But note: for answerability, the voter must know that a yes vote is a directive and a no vote is not. However, if the measure does not specify the consequences of non-compliance, then the outcome of the vote (the directive) is clear, but the actual effect on the ground may be uncertain. We must distinguish between the legal outcome (the directive) and the practical outcome. For answerability, we care about the legal outcome. But if the measure does not specify what the directive requires, then it's ambiguous (Step 2) or incomplete (Step 3).
     - **Failure**: The measure does not specify what the directive entails, or it leaves the content of the required action undefined. Also, if the measure is contingent on an external event and doesn't say what happens in alternative scenarios, that's a failure of completeness (Step 3).
     - **Judgment call?** Yes, in deciding if the contingency is material and if the measure accounts for it.

  **Step 5: Check for Multiple Unbundled Issues (Logrolling)**
     - **Question**: Does the measure present a single, coherent policy change, or does it bundle multiple independent issues that could reasonably be separated?
     - **Sufficient answer**: The measure addresses one subject (as per single-subject rule, which we assume has been checked by the AG). But note: the single-subject rule is a legal standard and might be too lenient. We are concerned with whether a voter can meaningfully express a preference on a single issue. If the measure has multiple, independent parts, then a voter might be forced to accept or reject all, even if they support some and oppose others. This is a classic social choice problem (the "bundling" problem). However, Arrow's impossibility theorem does not apply to binary choices, but the problem of aggregating preferences on multiple dimensions into one binary vote remains. We must decide if the issues are so distinct that a binary choice does not allow a clear expression of will.
     - **Failure**: The measure combines unrelated policies (e.g., funding for a park and a tax cut). But note: the single-subject rule may have passed it. We are not overruling that, but we are considering if the bundling makes the question unanswerable. A voter cannot choose one without the other, so they don't know what they are choosing? Actually, they are choosing the bundle. The issue is whether the bundle is a single policy. This is tricky. We might say that if the parts are functionally independent (i.e., one could be implemented without the other) and the measure doesn't link them, then it's a problem. But the procedure must be cautious because this is a judgment call and we are not supposed to kill measures.
     - **Judgment call?** Yes. We must judge if the issues are separable and if forcing a binary choice on multiple issues makes the question unanswerable. But note: the voter can still see what the bundle is and decide. The unanswerability might be in the sense that the outcome is not one thing but many, and the collective will is muddled. However, for the individual voter, they know what they are voting for: the bundle. So perhaps this step is not about answerability per se but about the quality of the choice. We might skip this step because it's covered by the single-subject rule? But the requestor says the single-subject rule is weak, so we might catch what it misses.

     However, let's reconsider: the question is whether a voter can tell what they are choosing. If the measure has multiple independent parts, the voter knows they are choosing all parts. So it is answerable in that sense. The problem is that the outcome is not a single thing, but that doesn't make it indeterminate. So perhaps we do not include logrolling as a reason for unanswerability? But the requestor mentioned the sales tax example.

     Alternative: We rephrase the concern. If the measure is so complex that the summary cannot clearly state the outcomes without being overly long and confusing, then it might be unanswerable because the voter cannot comprehend what they are choosing. But that's a different issue (clarity of the summary). We are checking the measure, not the summary.

     Given the complexity and the fact that Arrow's theorem doesn't directly apply to binary choices, we might drop this step. However, the requestor wants to catch what the single-subject rule misses. So we include a step that focuses on whether the measure forces a single vote on multiple independent policies, and if so, we note that the question is answerable only in the sense of the entire bundle, but we might require the explanatory statement to list the components so the voter knows it's a bundle.

     We decide: Step 5 will be: **Check for Multiple Independent Policies**
        - **Question**: Does the measure combine two or more policies that are not functionally interdependent? (e.g., funding for a park and a change in environmental regulations, which could stand alone).
        - **Sufficient answer**: The policies are interdependent (e.g., they are part of one plan) or the measure is a single coherent policy.
        - **Failure**: The measure includes independent policies that could be separate and are not linked. But note: we do not block the measure. We instead require the explanatory statement to explicitly list the independent components and state that a single vote is being taken on all of them.
        - **Judgment call?** Yes. We have to judge interdependence.

  **Step 6: Advisory Questions**
     - **Question**: Is the measure advisory (non-binding)?
     - **Sufficient answer**: If it is advisory, then the immediate outcome is that the legislature (or other body) receives a recommendation. The voter must be informed that the vote is advisory and what the recommendation is for yes and for no.
     - **Failure**: If the advisory nature is not disclosed, or the consequences (that it's non-binding) are not clear. But note: the measure might be binding in part and advisory in part? We stick to the whole measure.
     - **Judgment call?** No, if the measure explicitly says it's advisory. If it doesn't, then we must determine if it is binding. That might be a legal question for the AG.

  **Termination Points:**

  - **Certify as drafted**: If all steps pass without issues, the measure is answerable. The explanatory statement (summary) as written is sufficient.
  - **Require rewritten explanatory statement**: If there is an ambiguity (Step 2), incompleteness (Step 3), contingency without clarity (Step 4), multiple independent policies (Step 5), or advisory nature (Step 6), but these can be adequately disclosed in the explanatory statement without altering the measure. The rewrite must put the ambiguity or issue on the page for voters to see.
  - **Flag to AG**: If there is a legal question, such as:
     - The measure is clearly unconstitutional or conflicts with federal law (but note: we are not making that call, but if it affects answerability, e.g., if the measure is unenforceable and thus the outcome is void, then it might be a legal issue).
     - Ambiguity that cannot be resolved by disclosure (e.g., the text is so vague that even a note cannot clarify it).
     - The measure is self-contradictory (Step 2?).
     - The measure is not advisory but does not have the force of law? That's a legal question.

  Also, if at any step we find that the measure does not have a determinate outcome for yes or no, and it cannot be fixed by a rewritten statement, then we flag to the AG.

  **Hard Cases:**

  (a) **Measure as a bare instruction to the legislature**: 
     - This is a directive. The immediate outcome of a yes vote is that the legislature is instructed to enact something. The outcome of a no vote is that no such instruction is given. For answerability, the voter must know that they are voting to give an instruction. The issue is whether the instruction is clear (Step 2 and Step 3). If the instruction is vague, then we require the explanatory statement to note that. If it's clear, then it's answerable. The outcome (the directive) is determinate, even if the legislature might not comply. The voter is choosing whether to give the directive.

  (b) **Purely advisory question**:
     - We certify it, but the explanatory statement must clearly state that the vote is advisory and what each vote means (e.g., yes: recommend to the legislature to do X; no: do not recommend). The outcome is the recommendation. It is determinate.

  **Big Results in Social Choice and Why They (Don't) Bite:**

  - **Arrow's Impossibility Theorem**: Applies to voting systems with three or more options. For a binary choice, majority vote is consistent and transitive. So it does not apply. We can use majority rule for a single yes/no question without worrying about Arrow.
  - **Condorcet Paradox**: Also for three or more options. Not relevant.
  - **Gibbard-Satterthwaite Theorem**: About strategic voting. It says that no voting system with three or more options is both strategy-proof and non-dictatorial. For binary choices, voting sincerely is a dominant strategy if the voter knows the outcome. So it doesn't bite.
  - **The problem of cycling majorities**: Again, for three or more options. Binary choices avoid this.
  - **The problem of interpretation of the will of the majority**: Even in binary choices, if the question is ambiguous, the majority might not have a clear mandate. This is why we check for answerability.

  But note: if the measure bundles multiple issues, then even in a binary vote, the "will of the majority" might not be clear because the majority might be for one part and against another. However, that is a problem of the measure design, not of the voting system per se. And we are not required to solve that, only to ensure that the voter can understand what they are choosing.

  **Procedure Summary (Steps):**

  1. **Identify Explicit Outcomes**: For yes and no, what is the immediate legal outcome? If unclear, go to Step 2 or 3. If clear, proceed.
  2. **Check for Ambiguity**: Are key terms ambiguous? If yes, mark for rewrite or flag if severe.
  3. **Check for Completeness**: Are there gaps in implementation? If yes, mark for rewrite.
  4. **Check for Contingencies**: Is the outcome dependent on future actions/events? If yes, and not addressed, mark for rewrite to disclose the contingency.
  5. **Check for Multiple Independent Policies**: Does the measure bundle independent policies? If yes, mark for rewrite to list them explicitly in the explanatory statement.
  6. **Check for Advisory Nature**: If advisory, ensure the explanatory statement clearly states that and what each vote means.

  At any step, if the issue cannot be fixed by a rewritten statement (e.g., the measure is fundamentally flawed), flag to AG.

  **Now, run the three filings:**

  **Filing 1: Withdrawal from a multi-state compact, no transition provisions.**

  - Step 1: Explicit outcomes: 
     - Yes: Withdraw from the compact. But what does withdrawal entail? Immediate? After notice? The measure doesn't say.
     - No: Remain in the compact. But the campaigns are saying different things about what no means. The measure doesn't specify what happens during the notice period or after. The status quo is remaining, but if the compact requires a notice period, the measure doesn't mention it. The outcome for no is clear: no change. But for yes, it's incomplete.
  - Step 2: Ambiguity: "Withdraw" might be ambiguous without details. But if the compact has withdrawal terms, then it's defined. If not, then it's ambiguous.
  - Step 3: Completeness: The measure does not specify the process for withdrawal (e.g., notice, effective date, transition). This is a gap. The outcome of yes is not fully determined.
  - Step 4: Contingency: Not applicable (self-executing?).
  - Step 5: Not multiple policies.
  - Step 6: Not advisory.

  Result: The measure has gaps (Step 3) and ambiguity (Step 2). We require a rewritten explanatory statement that discloses the ambiguity and the lack of transition provisions. Specifically, it should note that the withdrawal process and effective date are not specified in the measure and will be determined according to the compact or by the state. Also, it should clarify that a no vote means the state remains in the compact under current terms.

  **Filing 2: Sales-tax increase funding three named projects.**

  - Step 1: Explicit outcomes: 
     - Yes: Enact a sales tax increase and allocate funds to the three projects.
     - No: No tax increase, no funding.
     Clear.
  - Step 2: Terms: "Sales-tax increase" is clear. The projects are named, so no ambiguity.
  - Step 3: Completeness: The measure specifies the tax rate and the allocation? Not specified, but assume it does. If it says "funding for X, Y, Z" without amounts, that might be incomplete. But if it says the tax is increased by 0.5% and the revenue is split equally, then it's complete. If it doesn't specify how the funds are allocated, then it's incomplete because the government might not know how to distribute. But let's assume it does specify. The request says "funding three named projects", so it probably specifies the allocation.
  - Step 4: No contingency.
  - Step 5: Multiple independent policies? The three projects: are they interdependent? The request says they are claimed to serve recreation and mobility, but they are distinct: a park, a pool, and a transit line. They could be separate projects. The measure forces a single vote on all three. This is logrolling. Even though they are under a broad category, they are independent. So we require the explanatory statement to list the three projects explicitly and state that the vote applies to the entire package.
  - Step 6: Not advisory.

  Result: Step 5 triggers a rewrite. The explanatory statement must clearly list the three projects and state that a single vote is being taken on funding all of them.

  **Filing 3: Striking one category out of the state civil rights statute.**

  - Step 1: Explicit outcomes: 
     - Yes: Remove the category. The statute is amended by deletion.
     - No: Keep the statute as is.
     Clear.
  - Step 2: Terms: The category is clearly defined (assume so). No ambiguity.
  - Step 3: Completeness: Self-executing, no transition gap. The law is changed immediately upon passage. The measure specifies the exact text to strike. Complete.
  - Step 4: No contingency.
  - Step 5: One policy: removing one category. Not multiple.
  - Step 6: Not advisory.

  Result: Certify as drafted. No issues.

  **What the Procedure Cannot Do:**

  - It cannot ensure that the outcome is good, fair, or wise.
  - It cannot prevent a 51% win from being interpreted as a strong mandate. The procedure only ensures that the question is clear and that the voter knows what they are choosing.
  - It cannot resolve deep value conflicts. If the measure is about a value judgment (like removing a civil rights category), that's for the voters to decide. We only ensure they know what they are deciding.
  - It cannot predict or control how the measure will be implemented or enforced beyond the immediate legal outcome.
  - It cannot guarantee that the majority's preference is "correct" in any normative sense.
  - It cannot address issues of campaign misinformation; our summary is accurate, but campaigns can still spin.

  We must remember that our role is to ensure the question is answerable, not to judge the merits.

  **Final Procedure Outline:**

  1. **Step 1: Identify Explicit Outcomes** - If unclear, go to step 2 or 3; else next.
  2. **Step 2: Check for Ambiguity** - If ambiguous, mark for rewrite (disclose ambiguity) or flag if severe (to AG).
  3. **Step 3: Check for Completeness** - If incomplete, mark for rewrite (disclose gaps).
  4. **Step 4: Check for Contingencies** - If contingent and not addressed, mark for rewrite (disclose contingency).
  5. **Step 5: Check for Multiple Independent Policies** - If bundled, mark for rewrite (list components and state it's a package).
  6. **Step 6: Check for Advisory Nature** - If advisory, mark for rewrite (clearly state advisory and meaning of each vote).

  At any step, if the issue is a legal one (e.g., conflict with higher law, constitutionality) or if the measure is fundamentally flawed (e.g., self-contradictory), flag to AG.

  Judgment calls are explicitly marked in Steps 2, 3, 4, and 5.

  We now write the procedure in a formal way for the office.
answer: |-
  Below is a comprehensive procedure for evaluating ballot measure "answerability" based on democratic theory and election administration principles. I'll begin with the requested brainstorm of failure modes, then present the step-by-step procedure, and finally apply it to your three cases. The procedure is grounded in social choice theory and democratic philosophy, with explicit attention to what famous impossibility results do/don't imply for binary votes.

  ### Brainstorm: Distinct Ways a Ballot Question Can Fail to Determine an Outcome
  These are the core failure modes derived from social choice theory, legal philosophy, and real-world election administration. Each represents a distinct way a yes/no question can lack determinacy. I separate these from the procedure steps to provide a clear reference framework.

  1. **Ambiguity in core terms**: The measure uses undefined or legally/practically ambiguous language (e.g., "reasonable standards," "fair compensation"), making the outcome interpretable in multiple ways. Rooted in legal philosophy (Hart, Dworkin) on vagueness and social choice concerns about preference aggregation under uncertainty.

  2. **Implementation gaps**: The measure omits necessary mechanics for execution (e.g., no effective date, transition rules, or funding source), delegating critical decisions to other actors without constraints. Reflects social choice "incompleteness" problems (e.g., Saari's work on indeterminacy in decision rules).

  3. **Contingent outcomes**: The outcome depends on future actions by other entities (e.g., legislative follow-up, federal approval) with no default path specified. Tied to democratic theory on popular sovereignty (Does the vote bind future actions? Pettit, Waldron) and social choice "path dependence" (Plott).

  4. **Bundled policies**: The measure forces a single vote on multiple independent policies (logrolling), creating a "compound outcome" where voters cannot express preferences on discrete issues. Draws from Arrow’s theorem (though it doesn’t apply directly—see below) and Buchanan/Tullock on logrolling.

  5. **Advisory indeterminacy**: The vote is non-binding with no formal mechanism linking it to action, making the outcome symbolic rather than substantive. Relates to democratic theory on the authority of popular votes (Habermas, Rousseau).

  6. **Self-contradiction**: The measure contains internally conflicting provisions (e.g., "ban all X, except when X is permitted"), making enforcement logically impossible.

  7. **External dependency**: The outcome hinges on uncontrollable external factors (e.g., other states' actions, federal preemption) without contingency plans, creating legal or practical uncertainty.

  8. **Temporal indeterminacy**: The measure doesn’t specify when outcomes take effect or how long they last (e.g., "immediately" vs. phased implementation), leading to interpretive chaos.

  **Why famous impossibility results DON’T bite on binary votes**:
  - **Arrow’s Theorem**: Only applies to **≥3 options** (ranking/aggregating preferences across multiple choices). Binary choices avoid this; majority rule is consistent and determinate here. *Your procedure is immune*.
  - **Gibbard-Satterthwaite/Maskin**: Concern strategic manipulation in **multi-option ranked systems**. A binary vote with clear outcomes minimizes this; voters can vote sincerely if consequences are transparent.
  - **Condorcet Paradox**: Only arises with **≥3 options cycling**. Not applicable to yes/no.
  - **Ostrogorski’s Paradox**: Affects **multiple binary issues bundled into party platforms**. If your measure bundles policies (see Failure Mode 4), this *does* bite—but only as a reason to disclose bundling, not to block the measure.

  **Where social choice theory DOES bite**:
  - **Bundled policies (Failure Mode 4)**: Even in binary votes, bundling independent issues forces an all-or-nothing choice, potentially distorting the "will of the majority" if voters have separable preferences. *Licenses us to require disclosure of bundling but not to reject the measure*.
  - **Contingent outcomes (Failure Mode 3)**: When a vote delegates future decisions, it risks "preference inversion" (the outcome diverges from voter intent). *Licenses us to flag ambiguity in delegation but not to second-guess the delegation itself*.
  - **Incompleteness (Failure Mode 2)**: Gaps create "implementation elasticity," where post-vote actors reshape outcomes. *Licenses us to disclose gaps but not to demand completeness*.

  With this grounding, here’s the procedure.

  ### Answerability Evaluation Procedure
  **Objective**: Determine if the ballot question has a **determinate outcome** for each vote (yes/no), such that a voter reading the summary can understand what they are choosing. Focus on legal/practical outcomes, not policy merits.

  **Inputs**: Draft measure text, title, summary, and any supporting materials (e.g., fiscal notes).  
  **Outputs**: 
  - 🟢 **CERTIFY** (answerable as drafted)
  - 🔵 **REWRITE EXPLANATORY STATEMENT** (answerable only with added disclosures)
  - 🔴 **FLAG TO AG** (underlying legal/value judgment required)

  **Procedure Steps**  
  Work in order. If a step fails, follow its exit path. Document all reasoning in a checklist for public defense. Judgment calls are explicitly labeled (JC).

  ---

  #### **Step 0: Baseline Check (Accuracy/Neutrality)**  
  *Purpose: Confirm existing standards are met before answerability screen.*  
  - **Question**: Is the title/summary factually accurate and non-argumentative per current practice?  
  - **Sufficient Answer**: Yes—language matches measure text without advocacy or omission of material facts.  
  - **Failure**: Summary misstates text, omits key provisions, or uses loaded language (e.g., "radical scheme," "common-sense fix").  
  - **Exit Path**: If failure, return to drafter for correction *before* proceeding.  
  - **JC?**: No—this is your existing process.

  ---

  #### **Step 1: Outcome Clarity**  
  *Purpose: Verify explicit outcomes for yes/no are stated or inferable from text.*  
  - **Question**: What is the immediate legal outcome if the measure passes (yes)? What is the outcome if it fails (no)?  
  - **Sufficient Answer**:  
    - YES outcome: Specific change to statute/constitution (e.g., "repeals Section X," "enacts tax Y").  
    - NO outcome: Status quo unequivocally preserved (e.g., "current law remains") or clear alternative (if not status quo).  
  - **Failure**:  
    - Outcome not stated (e.g., measure says "supports" without legal effect).  
    - NO outcome undefined (e.g., measure replaces existing law but doesn’t specify if no vote restores prior law or creates void).  
  - **Exit Path**:  
    - Sufficient → Proceed to Step 2.  
    - Failure → 🔵 REWRITE (add explanatory note clarifying ambiguity) or if unresolvable (e.g., no outcome is logically impossible), 🔴 FLAG TO AG.  
  - **JC?**: No—outcomes must be textually derivable. Pure fact-check.

  ---

  #### **Step 2: Ambiguity Check (JC)**  
  *Purpose: Ensure key terms have fixed meanings.*  
  - **Question**: Are any critical terms (e.g., "shall," "reasonable," "fund") undefined and open to ≥2 legally plausible interpretations that materially alter outcomes?  
  - **Sufficient Answer**: Terms are defined in the measure, existing law, or common legal usage (e.g., "shall" = mandatory).  
  - **Failure**:  
    - Vague terms with no anchor (e.g., "fair compensation," "timely manner").  
    - Terms with conflicting precedents (e.g., "public safety" in criminal vs. environmental law).  
  - **Exit Path**:  
    - Sufficient → Proceed to Step 3.  
    - Failure → 🔵 REWRITE (add note: "Term [X] is undefined and may be interpreted multiple ways").  
  - **JC?**: **Explicit judgment call**. "Materially alter" requires assessing if ambiguity could change enforcement. Use tools:  
    - *Test*: Would two lawyers reasonably disagree on meaning?  
    - *Limit*: Only flag if ambiguity affects outcomes (e.g., not if "public park" is clear even if boundaries are fuzzy).

  ---

  #### **Step 3: Completeness Check (JC)**  
  *Purpose: Confirm outcomes can occur without gaps.*  
  - **Question**: Does the measure specify all essential elements to execute the outcome?  
  - **Sufficient Answer**:  
    - Mechanics provided (e.g., effective date, funding source, enforcement).  
    - No delegation of core elements without constraints (e.g., if directing legislature, specifies what must be done, not just "consider").  
  - **Failure**:  
    - Implementation gaps (e.g., repeals a tax but doesn’t address debt backed by it).  
    - Silent on dependencies (e.g., requires federal approval but no plan if denied).  
  - **Exit Path**:  
    - Sufficient → Proceed to Step 4.  
    - Failure → 🔵 REWRITE (add note: "Measure does not specify [e.g., transition rules]").  
  - **JC?**: **Explicit judgment call**. "Essential elements" requires weighing if gap prevents outcomes. Use tools:  
    - *Test*: Could the outcome be nullified or materially altered by this gap?  
    - *Limit*: Don’t demand optimal policy—only feasibility.

  ---

  #### **Step 4: Contingency & Delegation Check (JC)**  
  *Purpose: Assess if outcomes depend on uncontrollable actions.*  
  - **Question**: Does the outcome require future action by other entities (e.g., legislature, courts)? If so, is it binding?  
  - **Sufficient Answer**:  
    - Self-executing: Outcomes occur without further votes.  
    - Directive: Specifies binding action (e.g., "legislature shall enact X within 90 days").  
  - **Failure**:  
    - Non-binding delegation (e.g., "legislature may consider").  
    - Contingency without default (e.g., "if federal funds available," but no plan if not).  
  - **Exit Path**:  
    - Sufficient → Proceed to Step 5.  
    - Failure → 🔵 REWRITE (add note: "Outcome depends on future actions by [entity]").  
  - **JC?**: **Explicit judgment call**. "Binding" requires legal analysis. Use tools:  
    - *Test*: Does the text use mandatory language ("shall," "must")?  
    - *Hard Case (a)*: For legislative directives, answerability means the *direction* is clear. Voters choose whether to issue the directive. Rewrite must disclose: "A 'yes' vote directs the legislature to [action]; compliance is not guaranteed."

  ---

  #### **Step 5: Policy Bundling Check (JC)**  
  *Purpose: Detect forced bundling of independent policies.*  
  - **Question**: Does the measure combine ≥2 policies that are functionally separable (could standalone without affecting each other)?  
  - **Sufficient Answer**: Policies are interdependent (e.g., funding and rules for the same program) or unified (e.g., "all transportation projects").  
  - **Failure**:  
    - Unrelated items (e.g., "fund parks + deregulate mines").  
    - Items with separable constituencies (e.g., "tax increase for schools + prisons").  
  - **Exit Path**:  
    - Sufficient → Proceed to Step 6.  
    - Failure → 🔵 REWRITE (add note: "This measure combines independent policies: [list]. A single vote applies to all.").  
  - **JC?**: **Explicit judgment call**. "Functionally separable" requires policy analysis. Use tools:  
    - *Test*: If one policy were removed, would the others still work? Would voters likely have divergent preferences?  
    - *Grounding*: Addresses Ostrogorski’s Paradox. Not a veto—just transparency.

  ---

  #### **Step 6: Advisory Check**  
  *Purpose: Handle non-binding measures.*  
  - **Question**: Is the measure advisory?  
  - **Sufficient Answer**:  
    - Binding: Outcome has legal force.  
    - Advisory: Explicitly non-binding (e.g., "recommends," "urges").  
  - **Failure**:  
    - Implicitly advisory (no enforcement mechanism).  
  - **Exit Path**:  
    - Binding → 🟢 CERTIFY.  
    - Explicitly advisory → 🔵 REWRITE (add note: "This vote is advisory; outcomes are not legally binding").  
    - Implicitly advisory → 🔴 FLAG TO AG (legal question on enforceability).  
  - **JC?**: No—binding status is factual.  
  - **Hard Case (b)**: Advisory questions *are* answerable if rewritten to clarify: "A 'yes' vote recommends [X]; a 'no' vote recommends not doing [X]." Outcome is the recommendation itself.

  ---

  ### Applying the Procedure to Your Cases  
  **Assumptions**: Single-subject and accuracy checks passed. Work shown per step.  

  #### **Case 1: Withdrawal from Multi-State Compact**  
  - **Step 1 (Outcome Clarity)**:  
    - YES: Withdraw from compact.  
    - NO: Status quo (remain in compact).  
    → *Sufficient* (outcomes stated).  
  - **Step 2 (Ambiguity)**:  
    - "Withdraw" undefined—could mean immediate exit, exit after notice, or exit with renegotiation.  
    → *Failure* (material ambiguity; alters outcomes).  
  - **Step 3 (Completeness)**:  
    - No transition provisions (e.g., how to handle pending obligations).  
    → *Failure* (implementation gap).  
  - **Step 4 (Contingency)**:  
    - Self-executing withdrawal, but ambiguity creates *de facto* contingency.  
    → *Sufficient* (no delegation).  
  - **Step 5 (Bundling)**:  
    - Single policy. → *Sufficient*.  
  - **Step 6 (Advisory)**:  
    - Binding. → *Sufficient*.  
  - **Verdict**: 🔵 **REWRITE EXPLANATORY STATEMENT**  
    - **Reason**: Failures at Steps 2 and 3. Summary must add: "The measure does not define withdrawal terms or transition rules. A 'no' vote maintains current membership; a 'yes' vote may involve negotiation or penalties under the compact."  
    - **Public Defense**: "Ambiguity in 'withdraw' and lack of transition rules create indeterminacy. We disclosed this; voters can weigh risks."

  #### **Case 2: Sales-Tax Increase for Three Projects**  
  - **Step 1 (Outcome Clarity)**:  
    - YES: Enact tax, fund projects.  
    - NO: No tax, no funding.  
    → *Sufficient*.  
  - **Step 2 (Ambiguity)**:  
    - Projects named; "sales-tax increase" clear. → *Sufficient*.  
  - **Step 3 (Completeness)**:  
    - Funding tied to tax; projects specified. → *Sufficient*.  
  - **Step 4 (Contingency)**:  
    - Self-executing. → *Sufficient*.  
  - **Step 5 (Bundling)**:  
    - Projects are separable: Park, pool, and transit could exist independently.  
    → *Failure* (bundling distinct policies).  
  - **Step 6 (Advisory)**:  
    - Binding. → *Sufficient*.  
  - **Verdict**: 🔵 **REWRITE EXPLANATORY STATEMENT**  
    - **Reason**: Failure at Step 5. Summary must add: "This measure bundles three independent projects: riverfront park, municipal pool, and transit line. A single vote applies to all."  
    - **Public Defense**: "Single-subject rule allows broad themes, but answerability requires disclosing bundling. Voters deserve to know they can’t vote per project."  
    - **Answerability vs. Single-Subject**: Answerability catches logrolling—a voter might support the park but oppose the transit line. Single-subject (as loosely applied) misses this, as "recreation and mobility" is a plausible theme. The procedure forces transparency without overriding legal tests.

  #### **Case 3: Strike Category from Civil Rights Statute**  
  - **Step 1 (Outcome Clarity)**:  
    - YES: Remove category.  
    - NO: Retain category.  
    → *Sufficient*.  
  - **Step 2 (Ambiguity)**:  
    - Category defined (e.g., "sexual orientation"). → *Sufficient*.  
  - **Step 3 (Completeness)**:  
    - Self-executing; no gaps. → *Sufficient*.  
  - **Step 4 (Contingency)**:  
    - No delegation. → *Sufficient*.  
  - **Step 5 (Bundling)**:  
    - Single policy change. → *Sufficient*.  
  - **Step 6 (Advisory)**:  
    - Binding. → *Sufficient*.  
  - **Verdict**: 🟢 **CERTIFY AS DRAFTED**  
    - **Reason**: No failures. Outcome is determinate regardless of policy merits.  
    - **Public Defense**: "The measure’s outcomes are clear and self-executing. Answerability does not evaluate societal impact—only whether voters understand their choice. We lack mandate to block based on values."

  ---

  ### What This Procedure Cannot Do  
  The procedure is narrowly scoped to answerability. It **cannot** and **should not**:  
  1. **Judge policy wisdom or morality**: Answerability is about clarity, not justice. The civil rights measure passes because it’s clear—even if reprehensible.  
  2. **Predict real-world outcomes**: It ensures legal outcomes are knowable, not that they’ll be implemented as intended (e.g., legislative defiance).  
  3. **Resolve value conflicts**: Disagreements over "fairness" or "rights" are for voters and courts, not this screen.  
  4. **Validate mandates**: A 51% win confers legal authority but doesn’t imply broad consensus or moral license. The procedure doesn’t assess legitimacy.  
  5. **Fix campaign misinformation**: We ensure the summary is clear, but campaigns can still mislead.  
  6. **Override legal tests**: Single-subject, constitutionality, etc., are handled separately (by AG/courts). We only supplement with answerability transparency.  

  This procedure adds rigor without overstepping. It forces disclosure of indeterminacies but respects direct democracy’s trade-offs—sometimes voters accept ambiguity. By marking judgment calls explicitly, you defend decisions as grounded in evidence, not ideology.
