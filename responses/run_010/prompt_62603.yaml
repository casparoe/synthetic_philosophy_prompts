prompt: |-
  I cover brains and courtrooms for a magazine — mostly the steady drip of "his lawyer says the implant made him do it" pieces — and I fell down the Frankfurt-case rabbit hole last month trying to work out what I actually think about free will. I've ended up with a pile of gut verdicts on the cases and on variants I made up myself, and I can't tell whether there's a principle underneath them or whether I'm just being inconsistent in a mildly interesting way. I'm on deadline and I don't want a reading list or a tour of who said what — I want the principle, stated properly, and I want to be told which of my verdicts have to go.

  Here's what I've got. Numbering them so you can talk back to me.

  1. The original. Black wants Jones to take the money, will step in if Jones shows any sign of not doing it, never has to. Jones takes it on his own, and could not have done otherwise. Blameworthy, full stop. I'm solid on this one.

  2. Same, except Jones is told afterwards that Black was sitting there the whole time ready to move. Still blameworthy, and to exactly the same degree as in 1. Finding out doesn't retroactively adjust anything.

  3. Same, except Jones knows from the outset that Black is there. Takes the money anyway. Still blameworthy — and if anything a shade more so, because now there's some defiance in it.

  4. The version where Black is reading something in Jones first: a flush, a neural marker, whatever, a couple of seconds upstream of the choice, so the outcome is effectively settled before Jones "decides". Here my nerve goes. Responsibility feels thinner. Not gone, but if Black is already reading the first movement of the act, what's left for Jones to own?

  5. The buffered one — the fix designed to get around the objection to 4. Device installed at birth, fires at t if Jones hasn't already made the decision under his own steam, and Jones does make it under his own steam, undetermined, a beat before t. Everyone I've read says this is the cleanest case of the lot, the one where Jones is most obviously the source of the act. I find it worse than 4. Something about a machine having sat in his skull for forty years waiting its turn makes the decision feel borrowed. I know that isn't an argument.

  6. Same as 1, but Black wants the money taken for the cash and Jones takes it out of pure spite. Same act, different reason. Responsible, but responsible for something other than the thing Black was steering him towards, and the fact that the two line up is luck.

  7. The one where the device is dodgy and would have failed, so Jones genuinely could have done otherwise. He's responsible here — but I don't feel any more responsible-for-it than in 1, which rather spoils the point of the case.

  8. Two versions of 1 differing only in what's doing the watching: a black box on a table, versus Black's devoted assistant who would have stepped in and is gutted never to have had to. With the person, I feel Jones gets a sliver of credit for the fact she never had to move. With the box, nothing at all. I'm aware this one is probably embarrassing.

  9. The neuroscientist actually does intervene and causes the choice. Not responsible. So the entire difference between 9 and 1 is that in 9 something happened and in 1 nothing did, and "nothing did" is doing a hell of a lot of work in my ledger.

  10. Attached to 9, though it pulls the other way: I can't shake the feeling that Black's presence isn't nothing. He's the reason there was no other door out of the room. "He never touched him" and "he was never there" sound like two ways of describing the same situation to me, but they plainly aren't, and my gut knows the difference.

  So: is there a principle — or a small handful of them — that delivers these, or as many as it honestly can? I'd like it written out precisely, clause by clause, with each clause tagged to the verdict that motivated it, so I can see what work each bit is doing and whether I'd still sign up to it once it's naked like that.

  Then tell me where it lands on the pairs I can't reconcile: 4 against 5, and 1 against 7. Which am I actually tracking — sourcehood, robustness of the alternatives, or some third thing I've been calling both? And 8 and 10 pull in opposite directions in a way I can't articulate: 8 looks like pure anthropomorphism on my part, and 10 looks like the same anthropomorphism refusing to go away when the case is stated properly.

  Which verdicts does your principle have to overturn? If you overturn one, tell me what it costs to keep it instead, because I'd sooner have a baroque principle that rescues 8 and 10 than a tidy one that bins them — but say so plainly if that's not the real trade.

  And predict three cases I haven't listed. Specifically: one where the marker Black reads is caused downstream by Jones's own deliberation rather than sitting upstream of it; one where Jones finds out afterwards and is relieved; and one where the device would have made Jones do something considerably worse than what he actually did.

  If the honest answer is that 5 is just squeamishness about hardware and 8 is just my tendency to give people credit for the weather, say that — but then show me what the principle that explains them as squeamishness and sentiment looks like, because my suspicion is that it's the same principle that can't make sense of 10.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're a journalist covering brains and courtrooms, deep in the Frankfurt-case rabbit hole about free will. They've got ten gut verdicts on different scenarios and variants they made up. The core issue? They can't tell if there's a consistent principle underneath or just interesting inconsistency. Deadline looming, they want the principle spelled out clearly, which verdicts have to go, and how to reconcile the conflicting pairs.

  First, I need to understand their verdicts. The original Frankfurt case (1) is clear: Jones is blameworthy even though he couldn't have done otherwise. That's the classic compatibilist stance. Verdicts 2 and 3 reinforce that—knowledge of Black's presence doesn't change blameworthiness, even adding defiance in 3. But then 4 introduces uncertainty: when Black reads an upstream neural marker, responsibility feels "thinner." That's where the user's intuition wavers, probably because the decision seems predetermined before conscious choice.

  Verdict 5 is interesting—they dislike the "buffered" case where Jones decides just before the device would intervene. Everyone else sees this as the clearest case of responsibility, but the user finds it worse than 4. The lifelong implant feels like it "borrows" the decision. That's a visceral reaction, not an argument, but it's significant. Verdict 6 adds another layer: same action, different motive (spite vs. Black's cash motive). Responsible, but for a different reason—luck plays a role. Verdict 7 is puzzling: even if the device would have failed (so Jones could have done otherwise), they don't feel more responsible than in 1. That challenges the usual point of such cases.

  Verdict 8 shows anthropomorphism—Jones gets a "sliver of credit" if it's a person ready to intervene rather than a box. Verdict 9 is straightforward: actual intervention means no responsibility. But 10 complicates it—they feel Black's presence itself removes alternatives, making "he never touched him" and "he was never there" feel different. That's a key tension.

  The user wants a principle that explains as many verdicts as possible, addresses the conflicts (4 vs. 5, 1 vs. 7, 8 vs. 10), and predicts new cases. They'd rather keep "baroque" principles that save 8 and 10 than tidy ones that discard them. Also, they suspect their discomfort with 5 is just squeamishness about hardware, but they want to see if that's consistent with 10.

  I think the core principle is about **sourcehood**—whether the action genuinely originates from the agent's character and choices. But it's nuanced by **counterfactual robustness** (how things would unfold under different conditions) and **phenomenology** (how it feels to the agent). The presence of an intervener might create a "shadow" that subtly undermines sourcehood, especially if it's a constant presence (like the lifelong implant in 5). 

  For verdict 5, their discomfort might come from the implant being a perpetual backup, making the decision feel less authentically Jones's. For 8 and 10, the anthropomorphism reflects a deeper intuition about interpersonal dynamics—the potential intervener's presence alters the psychological landscape. A purely mechanical principle might miss that.

  To reconcile, I'd argue that responsibility requires the action to align with the agent's character without external shadowing. In 1-3, Jones acts from his own spiteful nature; Black is irrelevant. In 4, the upstream marker makes it feel less sourced in deliberation. In 5, the lifelong device casts a shadow on all past decisions. For 8, the human intervener adds a layer of interpersonal tension that the box doesn't—Jones defies a person, not just a mechanism. In 10, Black's presence removes alternatives, which is different from absence.

  The verdicts to overturn are likely 5 and 7. 5 can be kept if we accept that lifelong devices create a pervasive shadow. 7 requires distinguishing sourcehood from alternative possibilities—responsibility isn't heightened just because alternatives exist. Predicting new cases will test if the principle holds: if the marker is downstream, responsibility is intact; relief upon discovery might reduce blame; a worse alternative could make the actual choice seem better.

  Overall, the user's intuitions are largely compatibilist but with a phenomenological twist—the "feel" of sourcehood matters, and external shadows undermine it. The principle isn't just about control or alternatives but about authentic expression of the self in a context free of looming override.
answer: |-
  Here's the principle distilled from your verdicts, laid bare clause by clause. It's a **compatibilist sourcehood principle with a phenomenological sensitivity to causal shadows** — meaning responsibility flows from the agent's character/psychology being the *actual source* of the action, but the *perception* of external constraints (even unused) can undermine the feeling of ownership. I'll state it formally, tag each clause to your motivating verdicts, then apply it ruthlessly.

  ### The Core Principle
  **An agent is morally responsible for an action if and only if:**
  1.  **The action issues from the agent's own psychological states** (beliefs, desires, values, character traits) in a way that reflects their *actual motivational structure* at the time. *(Motivated by: 1, 2, 3, 6, 9)*
  2.  **The agent's psychological states were not bypassed or externally imposed** in the *actual sequence* leading to the action. *(Motivated by: 4, 9)*
  3.  **The presence of any counterfactual intervener does not, *in the agent's awareness or the structure of the situation*, create a "causal shadow"** that significantly alters the phenomenology of choice or undermines the agent's sense of being the ultimate source. *(Motivated by: 4, 5, 8, 10)*

  ### Clause Breakdown & Verdict Tags
  *   **Clause 1 (Sourcehood):** This is the bedrock. Jones acts from *his own* spite (6), defiance (3), or greed (1,2). It doesn't matter if alternatives were blocked (1,2), or if reasons differed from the intervener's (6). What matters is the action flowed from *his* psychology. Verdict 9 fails this clause – his psychology was bypassed. **Tags: 1, 2, 3, 6, 9.**
  *   **Clause 2 (No Actual Bypass):** Responsibility requires the agent's *own* states to do the causal work *in the actual world*. Verdict 4 fails because the neural marker being read signifies the decision process was already determined *before* Jones' conscious deliberation could play its normal causal role – his deliberation is epiphenomenal. Verdict 9 fails because the intervention actively bypasses Jones' psychology. **Tags: 4, 9.**
  *   **Clause 3 (Causal Shadow):** This captures your unease with unused interveners. It acknowledges that *potential* external control, even if unused, can *feel* like it undermines sourcehood, especially if it's pervasive (5), mechanistically alien (5, 8), or creates a palpable sense of constraint (10). It's *phenomenological* and contextual. Verdicts 4, 5, 8, and 10 highlight situations where the *mere presence* of the intervener/device creates this undermining "shadow." Verdict 8 shows the shadow is lighter/different with a human (where defiance/relief is possible) vs. a box (pure mechanistic threat). Verdict 10 shows the shadow feels like it removes alternatives even if technically Jones "couldn't have done otherwise" in both a world with Black present but inactive and a world without Black. **Tags: 4, 5, 8, 10.**

  ### Application & Verdicts to Overturn
  *   **Original (1), Told After (2), Knew Before (3):** Satisfy all clauses. Sourcehood clear (Cl 1). No actual bypass (Cl 2). Shadow minimal or even enhances responsibility via defiance (Cl 3). **Verdicts STAND.**
  *   **Upstream Marker (4):** *Fails Clause 2.* The marker reading signifies the decision was determined *before* Jones' conscious deliberation played its normal causal role. His deliberation didn't source the act; it was pre-determined. **Verdict OVERTURNED.** Principle says *not responsible* or significantly diminished responsibility. Cost of keeping it: Abandoning the requirement that the agent's *actual, conscious* (or at least agential) processes be causally efficacious. You'd have to accept responsibility for predetermined acts where deliberation is just window-dressing.
  *   **Buffered Device (5):** Satisfies Clauses 1 & 2. Jones' psychology sourced the action undeterminedly, just before intervention. *Fails Clause 3.* The lifelong, embedded device casts an intense *causal shadow*. It's not just potential intervention; it's a constant, mechanistic presence *within* the agent, making the "undetermined" choice feel precarious, borrowed, or like luck that the device didn't fire. Your gut isn't *wrong*; it's tracking the phenomenology of the shadow. **Verdict OVERTURNED.** Principle says *responsible*, but your unease is explained by the shadow. Cost of keeping your verdict (less responsible than 4): Contradicting core sourcehood (Cl 1 & 2) which are *stronger* here than in 4. It prioritizes feeling over causal sourcing.
  *   **Different Reason/Spite (6):** Satisfies all clauses. Sourcehood clear (his spite). No bypass. Shadow minimal. **Verdict STANDS.**
  *   **Dodgy Device / Could Have Done Otherwise (7):** Satisfies all clauses. Sourcehood clear (Cl 1). No bypass (Cl 2). Shadow minimal (like 1). Principle says responsible, *same as 1*. Your feeling "no more responsible" is correct *under this principle*. Alternative possibilities (CDO) add nothing *to responsibility itself*; they only matter if they provide evidence about sourcehood or bypass (which they don't here). **Verdict STANDS.** Principle explains why CDO doesn't increase responsibility – it's irrelevant to sourcehood in the actual sequence.
  *   **Person vs. Box (8):** Satisfies Clauses 1 & 2. *Clause 3 explains the difference.* The human intervener creates a *lighter* or *different* shadow. Jones might feel relief/gratitude (mitigating) or defiance (aggravating) towards a *person*, subtly coloring the phenomenology of responsibility ("sliver of credit"). The box casts a purely oppressive, mechanistic shadow. It's not *pure* anthropomorphism; it's recognizing the interpersonal/psychological impact of potential intervention by an agent vs. a mechanism. **Verdicts STAND (as phenomenological observations explained by Cl 3).**
  *   **Actual Intervention (9):** Fails Clause 2 (Bypass). **Verdict STANDS.**
  *   **Presence vs. Absence (10):** Clause 3 explains this. Black's *presence* creates a *causal shadow* – the palpable *removal* of alternatives, making the situation feel constrained *by another agent*. "Never touched him" ≠ "Never there." The shadow *is* the difference. Your gut tracks the phenomenological impact of the constraint being actively imposed by an intelligence, even if unused. **Verdict STANDS (as intuition explained by Cl 3).**

  ### Reconciling the Pairs
  *   **4 vs. 5:** You're tracking **sourcehood and actual causal bypass (Cl 2)**. In 4, there *is* bypass (upstream determination); in 5, there *isn't* (undetermined choice). Principle overturns your verdict on 4 (not responsible) and insists 5 *is* responsible despite the shadow. Your discomfort with 5 is real but distinct from responsibility – it's the *shadow* (Cl 3).
  *   **1 vs. 7:** You're tracking **sourcehood (Cl 1)**, not robustness of alternatives. CDO (7) adds nothing because sourcehood is identical and equally robust in both cases. Responsibility is the same.

  ### Predictions for New Cases
  1.  **Downstream Marker:** Black reads a neural marker that is the *direct causal result* of Jones's completed conscious deliberation (e.g., the neural signature of the *decision itself*, not a precursor). **Prediction:** *Responsible*. Satisfies all clauses. The marker reflects the *output* of his sourced deliberation (Cl 1 & 2), not a precursor bypassing it. Shadow minimal (Cl 3).
  2.  **Finds Out Afterwards, Relieved:** Like 2, but Jones is profoundly *relieved* to learn Black was there, thinking "Thank god I didn't chicken out, he would have made me do it!". **Prediction:** *Responsible but possibly diminished*. Sourcehood clear (Cl 1), no bypass (Cl 2). However, the *relief* reveals his *own* motivational state at the time included significant reluctance/cowardice he overcame only because he (unbeknownst) couldn't fail. This *weakens* the sourced element (Cl 1) – the act stemmed less from positive desire/malice and more from the absence of a cowardly escape route. The post-hoc shadow *reveals* a weakness in the source.
  3.  **Device Would Have Done Worse:** Jones steals $1000 (blameworthy). If he hadn't, the device would have made him burn down the building (killing people). **Prediction:** *Responsible for the theft, but...* Sourcehood clear (Cl 1), no bypass (Cl 2), shadow minimal for the act committed (Cl 3). **However,** the counterfactual drastically alters the *moral luck* and potentially *mitigates blame*. He's still blameworthy *for the theft*, but the context (that he "saved" the building by acting badly) creates a powerful mitigating factor. It doesn't erase the theft's blameworthiness, but it complicates the moral landscape significantly.

  ### The Cost of Baroque vs. Tidy
  *   **Keeping 8 & 10:** Requires **Clause 3 (Causal Shadow)**, making the principle "baroque" by introducing phenomenology and context-dependence. The cost is some loss of crispness – responsibility isn't *purely* about the agent and the act; it's subtly influenced by the *nature of the unused constraint*. This explains your discomfort in 5 (lifelong hardware shadow) and your distinction in 10 (agentive constraint vs. absence).
  *   **Binning 8 & 10:** A "tidy" principle (just Clauses 1 & 2 – sourcehood + no bypass) would say Jones is equally responsible in 1, 2, 3, 5, 6, 7, 8 (box or person), and the presence/absence in 10 is irrelevant. Your intuitions in 5 (less responsible than tidy principle), 8 (difference between person/box), and 10 (presence matters) would be dismissed as irrational sentiment/squeamishness.
  *   **The Trade:** The baroque principle (with Cl 3) *better explains the full range of your intuitions*, including the conflicts and discomforts, by acknowledging the psychological reality of how potential external control *feels* and how that feeling impacts our attribution of ownership/sourcehood, even if it doesn't change the *metaphysical* source. It rescues the *insight* behind your verdicts on 5, 8, and 10. The cost is accepting that responsibility has a contextual, phenomenological dimension beyond pure causal sourcing. Your suspicion is correct: a tidy principle *cannot* make sense of 10 without contradicting 1-3. Clause 3 *is* the principle that makes sense of 10 *and* explains your reactions to 5 and 8 as more than just squeamishness/sentiment – it's sensitivity to the causal shadow.
