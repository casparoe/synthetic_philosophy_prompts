  Here’s a draft built for that room, for those knots, for your voice. Short sentences. No lies. No flags.

  ---

  **Start here:**  
  Nine years inside. First week out, I filled out a form. There was a box for an address. I hadn’t had one of those since before I went in. I wrote it down slow. Like testing the ground.  
  A month ago, I registered to vote. Got that card in the mail. Didn’t feel like winning. Didn’t feel like I fixed anything. Felt like… standing in a room and saying, "I am here."  

  **The core:**  
  They’re handing out forms today. I’m not gonna tell you it’s your duty. I’m not gonna tell you your vote changes everything. We know math. We know how the world works. Some of us know it too damn well.  
  Here’s what I think it is:  
  It’s the one box they have to let you check. The one place you get to say, officially, on the record: *This one. Or that one. Or neither. But this is where I stand.*  
  Doesn’t mean it changes the winner. Doesn’t mean you owe the system a damn thing. It just means you put your name down on a line and said: *This is my side. Counted or not, this is what I said.*  

  **For the objections:**  
  Maybe you look at the names and think: Both rotten. Picking the less rotten one? Feels like getting dirty. I get that. Maybe you pick the name that can’t win, just to say something else entirely. Maybe you leave it blank. That’s you saying something too.  
  And yeah, someone smart might say people shouldn’t vote unless they vote "right." Like there’s a test. We know about tests. We know about being told we don’t get to speak. That’s the past. This is just… marking the page. Your name. Your mark. However you make it.  

  **For those who can't:**  
  Here’s the hard bit. Look around. Some of us can’t fill out that form today. Supervision. Fines you can’t pay. Laws that slam the door shut forever. Sitting here while others line up? That’s a feeling we know too well.  
  So if you can’t check that box today, this isn’t about the form. It’s about being here. Right now. In this room. It’s about knowing you *would* put your name on that line if they let you. That you *have* a side. That you *are* here.  
  And for those who can fill it out? When you do it, you’re not just doing it for you. You’re putting a mark down for everyone in this room who can’t. You’re saying: *We are here. Count us.*  

  **The close:**  
  So register if you can. Make your mark. However you need to make it.  
  If you can’t? Stand with the person next to you who can. Make sure they know what it means.  
  Because this room? Right now? This is us saying we’re still here. Form or no form. Vote or no vote. We’re still here.

  ---

  **Why this works for your knots:**
  *   **No False Promises:** Acknowledges the math ("We know how the world works"), sidesteps "duty," focuses on the *act* of declaration, not the outcome.
  *   **Addresses the "Can'ts":** Doesn't end with "go register." Shifts focus to presence, solidarity, and the *intent* to be counted ("knowing you *would* put your name...", "Stand with the person next to you"). Makes their participation in the *event* meaningful, not a consolation prize. "We are here. Count us." includes them directly.
  *   **Handles the Objections:**
      *   **Both Bad?** Validates the feeling ("Feels like getting dirty"), legitimizes protest votes or abstention as valid statements ("That’s you saying something too").
      *   **The Nephew's Argument:** Addresses the core fear ("unless they vote 'right'") without naming the nephew or sounding dismissive. Connects it to their lived experience of being silenced ("We know about being told we don’t get to speak") and reframes voting simply as "marking the page."
      *   **Protest Voter & Boycotter:** Explicitly includes their choices ("Maybe you pick the name that can’t win... Maybe you leave it blank") as valid forms of "saying something."
  *   **Concrete Image:** Uses the address box and the voter card arriving – grounded, personal, real.
  *   **Tone & Delivery:** Short, declarative sentences. Plain language. No soaring rhetoric. Built for a nervous speaker. The rhythm ("Form or no form. Vote or no vote. We’re still here.") is punchy and memorable.
  *   **The Core Message:** Stays laser-focused on voting as a personal, recorded statement of position ("This is where I stand," "This is what I said," "Counted or not").
  *   **The Final Unifying Note:** "We’re still here." It’s the ultimate defiance, the core truth for everyone in the room, regardless of their voting status. It reclaims agency.

  **Deliver it straight. Look at them. Pause after the hard bits.** This room doesn't need polish; it needs truth they recognize. Good luck. That room is lucky to have you opening it.
