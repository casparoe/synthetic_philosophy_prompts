  The staff member's nephew believes people shouldn't vote if they'll vote badly. The user finds this offensive because disenfranchisement was part of their punishment. But they don't want to attack the nephew. Address the concern respectfully, maybe by acknowledging the fear of voting poorly but emphasizing the right to participate.

  Then there's the guy voting for a no-chance candidate and the woman boycotting both parties. The speech should validate their choices without endorsing or criticizing. Focus on the act of making a personal stand, regardless of the choice.

  Including a concrete image from the user's first week back: the voter card in the mail or writing an address after years without one. This personal touch can ground the speech in real experience.

  Structure the speech to start with a personal story, address the objections, explain voting as a record of one's stance, include those who can't vote, and end with a collective action beyond voting. Use short sentences for clarity and to ease delivery when nervous.

  For those who can't vote, shift the focus to community support and advocacy. Frame their presence as solidarity, making the event meaningful beyond registration. Avoid consolation prizes by emphasizing their role in the collective effort.

  Ensure the tone is honest and direct, avoiding any institutional insincerity. Keep sentences short and punchy. Avoid quotes, bullet points, or formal conclusions. Make it feel conversational yet powerful.
