answer: |-
  ### Case Study: The IAU Planet Definition Debate through Two-Dimensional Semantics

  #### **1. Primary and Secondary Intensions of *Pluto is a planet***
  - **Primary Intension** (function from scenarios considered as actual to truth values):  
    Varies with the reference-fixing story:  
    - *Dynamical dominance*: True in scenarios where Pluto clears its orbit (e.g., if it were alone in the Kuiper Belt).  
    - *Geophysical roundness*: True in all scenarios where Pluto is round (which it is, given its mass).  
    - *Stipulative anchor to our system*: True only if Pluto matches historical "planets" like Earth (e.g., pre-2006 usage).  
    **Pre-2006 usage best fit**: A *hybrid* story prioritizing dynamical dominance but inconsistently applied. Pluto’s inclusion relied on historical inertia after its 1930 discovery, but Ceres’ 1801–1851 demotion set a precedent for excluding non-dominant bodies. Geophysical roundness was insufficient (e.g., moons like Titan weren’t called planets). *Judgment call*: Usage was ambiguous but leaned dynamical, as non-dominant bodies were eventually reclassified without vote (Ceres) or controversy (Vesta).  

  - **Secondary Intension** (extension across counterfactual worlds, given actual reference fixed):  
    - If "planet" rigidly designates *dynamically dominant bodies* (actual reference fixed post-2006), then "Pluto is a planet" is false in all worlds.  
    - If rigidly designates *round bodies*, it is true in all worlds where Pluto exists with current geophysics.  
    **Kripkean parallel breakdown**: *Water is H₂O* is necessary a posteriori because "water" rigidly picks out H₂O. Here, rigidity fails—pre-2006 "planet" lacked a stable natural-kind essence. Dynamical dominance is location-dependent; roundness is intrinsic but overinclusive. The term is **not rigid**, as its reference shifted historically (Ceres) and stipulatively (2006). Thus, secondary intension depends entirely on how reference is fixed in the actual world.  

  #### **2. Which Intension Contested? Method of Elimination**  
  - **Contested intension**: The dispute centered on the **primary intension**. Both camps argued over how to fix reference *in our actual solar system* (e.g., "Should Pluto count *here*?"). Neither engaged deeply with counterfactuals (e.g., "Would a Pluto-sized object in Earth’s orbit be a planet?").  
  - **Method of elimination**:  
    - Strip the term "planet": Stern camp claims *round, non-satellite bodies* should be prioritized; dynamical camp claims *orbit-clearing bodies* should be prioritized.  
    - **Residual disagreement**: A **substantive** (non-verbal) dispute about which *natural property* (dynamical dominance vs. geophysical structure) best carves nature at its joints for scientific taxonomy. **Bedrock**: The disagreement bottoms out in normative epistemology of science—whether orbital dynamics or intrinsic properties better predict planetary behavior (e.g., weather, geology). *Judgment*: This is bedrock because no further agreement is possible without shared values (e.g., "What makes a classification *useful*?").  

  #### **3. Scrutability**  
  - **Not scrutable** from a Laplacean description (physical truths + indexicals + "that’s-all" clause).  
    - **Missing premise**: A semantic bridge principle (e.g., "Bodies with mass > *X* and orbit-clearing are *planets*").  
    - **Classification**: **Semantic** (linking physical facts to the term "planet").  
    - **Cost to scrutability**: The thesis survives but is weakened. It requires semantic facts as inputs, showing that even exhaustive physical knowledge can’t determine extension without linguistic conventions. This case exposes scrutability’s dependence on shared semantic norms.  

  #### **4. Diachronic Problem: Determinate Primary Intensions?**  
  - **Indeterminacy pre-2006**: Primary intension was **systematically indeterminate**. Usage equally supported multiple candidate intensions:  
    - Dynamical: Excluded Ceres/Pluto (per 19th-century practice).  
    - Geophysical: Included all round bodies (per Stern).  
    - Historical: Included only "traditional" planets (e.g., excluding Ceres by 1850).  
  - **Local vs. general defect**: This is a **local defect** for semi-technical terms. Two-dimensional semantics assumes community-wide reference-fixing, but scientific terms often lack consensus until formalized. The framework *can* model the Ceres shift (primary intension evolved tacitly) and the 2006 vote (stipulation changed primary intension), but highlights that pre-stipulation indeterminacy is common for evolving categories.  

  #### **5. Where the Theory is Silent**  
  - **Sun restriction**: Silent. The IAU’s solar-centric definition reflects contingent human focus, not a semantic necessity. Two-dimensional semantics doesn’t address why "planet" was tied to Sol.  
  - **Mercury’s retention**: Silent. Mercury’s exemption (despite slight non-roundness) is a **normative fiat**—deference to tradition over consistency. The framework has no tools to explain such exceptions.  
  - **Committee redefinition**: Silent. Stipulation by vote isn’t a standard reference-fixing mechanism in two-dimensional semantics. It treats reference as fixed by use or essence, not authority.  

  #### **Commitment**  
  - **Framework verdict**: **Anomaly**.  
    - *Why?* Two-dimensional semantics handles contingent reference-fixing (primary) and rigidification (secondary), but **stipulative redefinition by vote** falls outside its core machinery. The framework assumes reference evolves through usage or discovery (e.g., water as H₂O), not legislative fiat. The Ceres precedent was usage-driven; 2006 was political.  
  - **Dispute verdict**: **Substantive with verbal elements**.  
    - *Verbal*: Whether "planet" *means* dynamical dominance (semantic choice).  
    - *Substantive*: Which property *deserves* the term for scientific utility (bedrock disagreement about taxonomy). The substantive weight lies in whether orbital dynamics or geophysics better defines a *scientifically significant class*.  
  - **Scrutability verdict**: **Intact but scarred**. The case shows scrutability requires semantic premises, but doesn’t refute it—it reveals a limitation in *how much* physical knowledge alone can determine.  

  ---  
  **Flags for Contested Readings**:  
  - **Primary intensions as communal**: Adopted here. Turning on individual speakers would make indeterminacy worse (pre-2006).  
  - **Bedrock as termination point**: Used for the elimination test’s endpoint. Rejecting "bedrock" would imply infinite regress in disputes, which this case avoids.  
  - **Scrutability as metaphysical**: Treated as about determination, not knowledge. If epistemic, the Laplacean description would still require a semantic premise for *understanding*.  

  *Judgment calls marked throughout; astronomy/history follows your stipulations.*
