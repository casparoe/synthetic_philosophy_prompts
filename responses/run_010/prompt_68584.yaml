prompt: |-
  Please take on the role of a political philosopher who works on democratic epistemology and who knows Hannah Arendt's essays on truth and on political deception well — specifically her treatment of factual versus rational truth in the essay collected in *Between Past and Future*, and her analysis of the Pentagon Papers in the essay on lying in politics — but who is equally fluent in contemporary debates about misinformation, testimony, and institutional epistemic harm. I would like a rigorous consistency audit of a position I have written down, not a lecture on the literature and not a summary of Arendt.

  The occasion: I have been asked to circulate a one-page statement of my own view ahead of a workshop on political lying, precisely so that the other participants have something to attack. I would rather be attacked by you first.

  Here is the package, as I intend to circulate it.

  (i) Factual truth and rational truth are different kinds of thing, and only the first is genuinely at the mercy of politics. What makes factual truth political is that it concerns other people and what has happened among them; it is established by witnesses and by a record, and it can therefore be revised by anyone with the standing or the power to revise the record. Rational truth is indifferent to agreement and cannot be politically destroyed in the same way.

  (ii) Lying is not primarily a failure of knowledge but an exercise of the same capacity as promising and acting: to lie is to make the world other than it would otherwise have been. That is why politics has always had an ambivalent rather than a simply hostile relation to veracity.

  (iii) It follows that truthfulness is not one of the political virtues. Someone who insists that a matter is settled, and therefore not available for deliberation and agreement, is taking up an anti-political position. This is not a criticism of her, but it does mean the truth-teller is not the model of the good citizen.

  (iv) There is a legitimate category of political lie, which I call the prospective lie: one addressed to a state of affairs that does not yet exist and whose content the liar is in some position to bring about or to render false. A delegation's deception about its walkaway point belongs here. The retrospective lie — one that fixes the record about what has already happened — has no comparable defense, because there the liar is not acting but merely destroying.

  (v) The distinctive wrong of contemporary politics is not the volume of lying but image-making: treating determinate facts as raw material to be reshaped for effect, with no stable falsehood even offered in their place. This is worse than old-fashioned lying, because it degrades the medium rather than misdescribing the content.

  (vi) The harm I actually care about is not false belief. It is the collapse of the distinction between truth and falsehood as a practical orientation — a public that no longer expects there to be a record it could consult, and so treats everything as image.

  (vii) Methodologically, I want the assessment of a lie to be institutional and agent-neutral: what makes a lie bad is its contribution to depleting the common stock of reliable testimony, measured across everyone exposed to it, not the liar's intent, character, or office.

  (viii) But I also hold a strict asymmetry of direction: a lie from the state to the citizen is a different kind of act from a lie from the citizen to the state, and the first is worse even where the second is, on any plausible estimate, larger in its consequences.

  Two cases I have been using to test the package. First: a minister misstates at a routine press conference whether a small procurement contract was awarded competitively; separately, a contractor's representative gives fabricated testimony at a legislative hearing, and that testimony becomes the publicly stated basis for a national programme, reported for weeks as settled fact. Second: a government announces an emissions target for which it has deliberately built no machinery of measurement, and defends the announcement internally on the grounds that it keeps a negotiation open. In both cases my verdict has been unstable, and I have been telling myself that instability is just sensitivity to detail rather than a defect in the package. If it is a defect, say so and locate it.

  What I want back:

  1. Begin with a short mapping exercise, before any verdicts: which of the eight items entail or support which others, which are merely compatible, and which could only conflict given an auxiliary assumption I have not stated. Keep this to a few lines per item.
  2. Then the audit proper. List the genuine tensions in descending order of severity — do not present them as equally bad, and do not flag every pair. For each, state the precise mechanism of the conflict, whether it depends on an ambiguity in how I have phrased one of the items (if it does, resolve the ambiguity rather than counting it as a conflict), the cheapest revision available to me, and what that revision costs in terms of the rest of the package.
  3. At least one pair here looks inconsistent and is not. Identify which, and explain what generated the appearance.
  4. Name any auxiliary assumption I have been relying on silently, especially any I would need in order to make one of my case verdicts come out the way I want.
  5. Finally: which single revision would clean up the most, all things considered?

  I deliberately have not told you which of the eight I am most attached to, because I suspect my sense of my own attachments is part of what produced this mess. Do not soften the diagnosis on my behalf, and do not conclude that the package is admirably nuanced. Also: no bibliography, no reading list, and no attempts at verbatim quotation — I want the argumentative structure, and I will supply references myself. If you are unsure of a detail in Arendt's texts, paraphrase around it or leave it out rather than guessing.
reasoning: |-
  Hmm, the user wants me to act as a political philosopher specializing in democratic epistemology to conduct a rigorous consistency audit of their position on political lying. They've shared an eight-point package and two test cases where their verdicts have been unstable. This is a sophisticated request that requires careful structural analysis rather than literary exposition.

  The package is deeply Arendtian but pushes beyond her framework. Point (i) restates her factual/rational truth distinction but adds the crucial claim that factual truth is revisable by those with power - which directly sets up the vulnerability in point (vi). Point (ii) echoes Arendt's performative view of lying but links it more explicitly to world-making capacities. The radical move comes in (iii) where truthfulness is demoted from political virtue - this seems foundational to their entire project but creates friction with (viii)'s asymmetric concern about state lies.

  Looking at the mapping: (iii) and (vii) form the core that everything else must cohere with. The rejection of truthfulness as political virtue (iii) necessitates the agent-neutral institutional harm framework (vii) - otherwise why care about testimony depletion? But then (viii)'s asymmetry about state vs citizen lies pulls against that neutrality. The tension isn't logical but gravitational: if harm is purely institutional, why should direction matter?

  The prospective/retrospective lie distinction in (iv) is elegant but brittle. In the emissions target case, calling it "prospective" feels forced when the lie concerns present institutional reality. This exposes a silent assumption that "state of affairs" includes institutional facts - but their description focuses on future contingents like negotiation positions.

  The severest conflict is between (vii) and (viii). Agent-neutral institutional harm clashes with directional asymmetry. The cheapest fix would be to ground the asymmetry in the state's unique role as record-keeper rather than in moral terms - but that costs some of (viii)'s intuitive force.

  Notably, (v) and (vi) appear conflicting but aren't. Image-making seems like it might preserve the true/false distinction by evasion, but point (vi) clarifies it's the practical collapse of consulting the record that matters. The appearance of conflict comes from different levels of analysis: (v) diagnoses a tactic, (vi) the resulting condition.

  For the test cases: The contractor case reveals an unstated assumption that institutional position affects harm magnitude. The minister's small lie might deplete testimony less than the contractor's big one - unless we weight state speech more heavily, which loops back to the (vii)/(viii) tension. The emissions case needs the silent premise that building measurement machinery constitutes part of the truth-grounding for targets.

  The single most clarifying revision would be to make (viii)'s asymmetry derive from institutional role rather than inherent wrongness. This preserves the core insights while reducing friction. But it means accepting that a citizen's lie to the state could theoretically cause greater testimony depletion in some contexts - which might feel counterintuitive but is philosophically consistent.
answer: |-
  Below is a structural audit focused solely on internal consistency and argumentative coherence. I proceed as instructed, referencing your eight propositions as P(i)-P(viii).

  ### 1. Mapping Relations  
  - **P(i)** entails **P(vi)** (if factual truth is uniquely vulnerable, its collapse is a distinct harm) and supports **P(iv)** (retrospective lies attack established records).  
  - **P(ii)** supports **P(iii)** (lying as world-making implies truth-telling isn’t inherently political) and **P(iv)** (prospective lies align with world-making).  
  - **P(iii)** entails **P(vii)** (if truthfulness isn’t a political virtue, assessing lies requires non-moral criteria like institutional harm).  
  - **P(v)** and **P(vi)** are mutually reinforcing (image-making causes collapse of truth/falsehood orientation).  
  - **P(vii)** conflicts with **P(viii)** absent auxiliary assumptions (agent-neutrality vs. directional asymmetry).  
  - **P(iv)** is compatible with all but requires clarification to avoid tension with **P(vi)** (retrospective lies "destroy," yet image-making might not fix falsehoods).  

  ### 2. Genuine Tensions (Descending Severity)  
  **Conflict 1: P(vii) vs. P(viii)**  
  - **Mechanism**: P(vii) demands agent-neutral assessment (harm = aggregate testimony depletion). P(viii) asserts directional asymmetry (state→citizen lies worse even if citizen→state lies cause more testimony depletion).  
  - **Ambiguity?**: P(viii) implies the state’s role as record-keeper amplifies harm per lie, but this isn’t stated. Without this, asymmetry contradicts agent-neutrality.  
  - **Cheapest Revision**: Ground asymmetry in the state’s unique epistemic responsibility (e.g., maintaining the "record" in P(i)).  
  - **Cost**: Weakens P(vii)’s purity by introducing agent-relative institutional roles.  

  **Conflict 2: P(iv) vs. P(vi)**  
  - **Mechanism**: P(iv) condemns retrospective lies as "merely destroying" the record. P(vi) cares about collapse of the truth/falsehood distinction. Image-making (P(v)) may avoid explicit falsehoods (no "retrospective lie") but accelerates P(vi)’s collapse by treating facts as malleable.  
  - **Ambiguity?**: P(iv) assumes retrospective lies require fixed falsehoods. Image-making evades this (no "record" to destroy, only destabilize).  
  - **Cheapest Revision**: Clarify that retrospective harm includes *undermining the record’s authority* (even without fixed falsehoods).  
  - **Cost**: Expands "destruction" in P(iv) to include erosion, aligning with P(v)-(vi).  

  **Conflict 3: P(iii) vs. Intuitive Cases**  
  - **Mechanism**: P(iii) claims truth-tellers are anti-political. But in your contractor case, fabricated testimony that becomes "settled fact" attacks the record (P(i)). Insisting this *is* settled seems pro-political (defending deliberative space), not anti-political.  
  - **Ambiguity?**: "Settled" in P(iii) conflates *epistemic* closure (no deliberation needed) with *institutional_ closure (record established). The truth-teller defends the latter, which enables politics.  
  - **Cheapest Revision**: Distinguish "settled record" (enabling politics) from "settled deliberation" (closing politics). Truth-tellers uphold the former.  
  - **Cost**: Softens P(iii)’s radicalism; truth-tellers become record-keepers, not anti-political figures.  

  ### 3. Apparent but Non-Existent Conflict  
  **P(v) vs. P(vi)**  
  - **Appearance**: P(v) condemns image-making (no falsehood offered); P(vi) laments collapse of true/false distinction. One might think image-making *preserves* the distinction by avoiding lies.  
  - **Resolution**: Image-making degrades the "medium" (P(v)) by making facts fungible, which directly causes the collapse of practical orientation (P(vi)). Avoiding explicit falsehoods is irrelevant if the *framework_ for assessing truth evaporates.  

  ### 4. Silent Auxiliary Assumptions  
  - **Institutional Standing for Revision (P(i))**: You assume only authorized agents (state, credentialed bodies) can "revise the record." This underpins P(viii)’s asymmetry (state lies exploit this authority).  
  - **Record as Shared Epistemic Infrastructure**: The "common stock of testimony" (P(vii)) requires institutions to maintain it. This justifies harsher judgment of state lies in emissions case (state uniquely builds "machinery of measurement").  
  - **Prospective Lies Require Agency**: P(iv) assumes the liar can *realistically* alter outcomes (e.g., delegation has bargaining power). Without this, the "walkaway" lie isn’t prospective.  

  ### 5. Highest-Value Revision  
  **Revise P(viii) to institutionalize asymmetry**:  
  - State lies are uniquely harmful because the state is the primary record-keeper (P(i)) and testimony-steward (P(vii)). A citizen’s lie to the state harms the record only if the state incorporates it (as in contractor case).  
  - **Cost**: Concedes that citizen→state lies *can* be equally harmful if institutionalized (e.g., contractor’s testimony becoming policy). But preserves core intuition: state lies *intrinsically* attack epistemic infrastructure.  
  - **Cleans Up**: Resolves P(vii)/P(viii) conflict; explains case verdicts (contractor lie harmful when adopted by state; emissions lie worse as state sabotages its own record-keeping).  

  ### Final Diagnosis  
  Your instability in cases stems from unstated assumptions about institutional roles. The emissions case fits P(viii) (state degrading machinery = attacking record) but contractor case challenges P(vii)’s neutrality. Revising P(viii) to tie asymmetry to the state’s epistemic role reconciles this without abandoning agent-neutral harm metrics. P(iii) remains your riskiest proposition—it requires careful handling of "settled" to avoid condemning truth-tellers who defend the record politics needs.
