    - Step 1: No evidence in the species (disabled). Step 1a: In orthologs? Yes, but in primates, the gene is disabled and not conserved (it's a pseudogene). So we cannot extrapolate. Output D.
  - Proposed term: BP (the biosynthetic process)
    - Step 1: No evidence in the species (the process doesn't occur). Output D.

  The override: The user's instinct to record "what the gene was for" is not captured because we require current causal role (CR). The procedure does not have a step for historical function. The commitment to CR and not SE without CR is being applied here. This commitment is doing work in the bird gene case: we annotate the lens structural role even if the gene was originally under selection for metabolism, because it currently contributes to the lens. But in the disabled gene, there is no current contribution.

  Three disputes to expect:
  1. Cases of borderline indirect evidence (Step 2).
  2. Cases of minor contribution to a biological process (Step 3).
  3. Cases of secondary activities that are biologically irrelevant but directly demonstrated (Step 4a for MF: we annotate, but a curator might feel it's not important enough).
  4. Ontology term mismatches (Step 5).

  And additionally, the disabled gene case: if the user wants to record the historical function, that would require a change in the database policy and cannot be resolved by this procedure.

  We are done.
