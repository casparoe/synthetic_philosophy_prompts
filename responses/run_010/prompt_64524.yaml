  ### Decision Procedure for Gene Function Annotation

  **Objective**: Evaluate a single proposed function claim for a gene product. Output one of:  
  - **A**: Annotate at the proposed term  
  - **B**: Annotate at a broader term  
  - **C**: Annotate at a narrower term  
  - **D**: Record no functional data for this claim  
  - **E**: Flag for adjudication (state reason)  

  **Constraints**:  
  - Each step must be answered sequentially; skip irrelevant steps.  
  - **CR (Causal-Role)**: Focuses on *what the gene product does* in the current system (molecular activity + contribution to a process).  
  - **SE (Selected-Effects)**: Focuses on *why the trait exists* (evolutionary selection history).  
  - **Judgment calls** (explicitly flagged) require curator discretion.  
  - **Terminology**: "Activity" = molecular function (e.g., kinase activity); "Process" = biological process (e.g., signal transduction).  

  ---

  ### Procedure  
  **Step 1: Evidence Validation (Neutral)**  
  - **Question**: Is there direct experimental evidence (in any species) for the *specific activity* in the proposed claim?  
    - *Sufficient answer*: Published data (e.g., enzymatic assay, binding experiment, genetic interaction) for the gene product’s activity.  
    - **Yes**: Proceed to Step 2.  
    - **No**: → **D** (Record no functional data).  
    - *Judgment call*: None.  

  **Step 2: Species Relevance (CR)**  
  - **Question**: Is the evidence from the *same species*? If not, is it from a close ortholog with conserved function?  
    - *Sufficient answer*: High sequence similarity (>70% identity) + functional conservation data (e.g., complementation assays).  
    - **Same species**: Proceed to Step 3.  
    - **Ortholog with conservation**: Proceed to Step 3 (extrapolate cautiously).  
    - **No conservation/irrelevant species**: → **D**.  
    - *Judgment call*: Assessing "conservation" without genomics expertise.  

  **Step 3: Molecular Activity Confirmation (CR)**  
  - **Question**: Does the evidence demonstrate the *specific molecular activity* (e.g., catalysis, binding)?  
    - *Sufficient answer*: In vivo or in vitro data directly measuring the activity (e.g., kinetic parameters, structural binding).  
    - **Yes**: Proceed to Step 4.  
    - **No** (e.g., only genetic or expression data): → **E** (Flag: "Indirect evidence; requires causal validation").  
    - *Judgment call*: None.  

  **Step 4: Biological Context (CR)**  
  - **Question**: (For *Process* terms only) Does the evidence show the activity *contributes to a larger biological process* in the organism?  
    - *Sufficient answer*: Data linking activity to a process (e.g., knockdown disrupts process, activity in relevant tissue).  
    - **For Activity terms**: Skip to Step 5.  
    - **For Process terms**:  
      - **Yes**: Proceed to Step 5.  
      - **No**: → **C** (Annotate at narrower *Activity* term if Step 3 passed).  
    - *Judgment call*: Assessing "contribution" (e.g., major vs. minor role).  

  **Step 5: Evolutionary Context (SE)**  
  - **Question**: Is there evidence of *recent selection* for the proposed activity/process in this lineage?  
    - *Sufficient answer*: Population genetics (e.g., dN/dS >1), adaptive mutations, or experimental fitness assays.  
    - **Yes or No data**: Proceed to Step 6.  
    - **Conflicting data** (e.g., selection for a different activity): Proceed to Step 5a.  
    - *Judgment call*: Interpreting selection metrics without evolutionary biology expertise.  

  **Step 5a: SE-CR Conflict Resolution (CR/SE Explicit)**  
  - **Question**: Is the proposed activity *primary* (biochemically dominant) or *secondary* (weak/minor)?  
    - *Sufficient answer*: Compare catalytic efficiency (kcat/KM), expression levels, or phenotypic impact.  
    - **Primary activity**: Proceed to Step 6.  
    - **Secondary activity**:  
      - For *Activity* terms: Proceed to Step 6 (annotate CR regardless of SE).  
      - For *Process* terms: → **D** (unless selection data strongly supports biological relevance).  
    - *CR/SE distinction*: Explicit choice—CR prioritizes current mechanism, SE prioritizes evolutionary "purpose." Evidence alone cannot resolve this.  

  **Step 6: Term Specificity (Neutral)**  
  - **Question**: Does the evidence match the *level of detail* of the proposed term?  
    - *Sufficient answer*:  
      - **Too broad** (e.g., evidence for "serine hydrolase" but term is "hydrolase") → **B**.  
      - **Too narrow** (e.g., evidence for "kinase" but term is "tyrosine kinase") → **C**.  
      - **Perfect match** → **A**.  
      - **Ambiguous** → **E** (Flag: "Term granularity mismatch").  
    - *Judgment call*: Ontology expertise required for term breadth.  

  ---

  ### Philosophical Distinctions Retained vs. Dropped  
  - **Retained**:  
    1. **CR vs. SE**: Steps 4 (CR) and 5/5a (SE) explicitly separate current contribution from evolutionary history.  
    2. **Primary vs. Secondary Activity**: Step 5a forces a choice when SE and CR conflict.  
  - **Dropped**:  
    - **Lineage-Specific SE**: Deep historical selection (e.g., ancient adaptations) is impractical to verify in 15 mins.  
    - **Function Pluralism**: The procedure avoids defining "true" function; it defers to evidence and consortium guidelines.  
  - **Cost of Dropping**:  
    - Loss of nuanced evolutionary context (e.g., exaptations). CR dominates, risking over-annotation of non-adaptive traits.  

  ---

  ### Case Analyses  
  #### Case 1: Bird Gene with Dual Roles (Metabolic Enzyme + Lens Structural Protein)  
  - **Proposed claim**: Annotate as "structural protein" (Activity term).  
  - **Run**:  
    - Step 1: Evidence for both roles → Yes.  
    - Step 2: Evidence in bird → Yes.  
    - Step 3: Activity confirmed (e.g., crystallin aggregation) → Yes.  
    - Step 4: Skip (Activity term).  
    - Step 5: Selection data? Assume none → Proceed.  
    - Step 6: Term matches → **A** (Annotate).  
  - **Verdict**: **A** for both roles (CR suffices; SE not required).  

  #### Case 2: Enzyme with Primary/Secondary Activity + Lineage-Specific Selection  
  - **Proposed claim**: Annotate secondary activity (e.g., "catalase" as "peroxidase").  
  - **Run**:  
    - Step 1: In vitro evidence → Yes.  
    - Step 2: Same species → Yes.  
    - Step 3: Activity confirmed → Yes.  
    - Step 4: Skip (Activity term).  
    - Step 5: Selection for secondary activity → Proceed to 5a.  
    - Step 5a: Secondary activity? → Yes (weak kinetics). **CR/SE conflict**: SE supports, but CR is minor.  
      - For Activity term → Proceed to Step 6.  
    - Step 6: Term matches → **A**.  
  - **Verdict**: **A** (CR activity is annotated; SE informs but doesn’t override).  

  #### Case 3: Disabled Primate Gene (Orthologs Perform Biosynthesis)  
  - **Proposed claim**: Annotate as "biosynthetic enzyme" (Activity term).  
  - **Run**:  
    - Step 1: Evidence in orthologs → Yes.  
    - Step 2: Primate gene disabled → **No conservation** (mutations disrupt function). → **D**.  
    - **Stops at Step 2**.  
  - **Verdict**: **D** (No functional data).  
  - **Override Analysis**: Your instinct (record "what the gene was for") invokes **SE without CR**. The procedure prioritizes CR (current activity/contribution). This commitment *is* used elsewhere:  
    - In Case 1, CR allows dual roles without SE.  
    - In Case 2, CR permits minor activities.  
    - **Cost**: Loss of evolutionary context for non-functional traits.  

  ---

  ### One-Page Curator Cheat Sheet  

  #### Gene Function Annotation: Quick Guide  
  **Input**: One proposed term (Activity or Process) for a gene.  
  **Output**: **A**nnotate, **B**roader, **C**arrower, **D**rop, **E**scalate.  

  1. **Evidence?** (Any species) → No? → **D**.  
  2. **Same species or conserved ortholog?** → No? → **D**.  
  3. **Activity proven?** (Direct assay) → No? → **E** ("Indirect evidence").  
  4. **For Process terms**: Contributes to process? → No? → **C** (Use Activity term).  
  5. **Selection data?** → Conflict? → **5a**.  
     - **5a: Primary or secondary activity?**  
       - Activity term: Always annotate (**A**).  
       - Process term: Secondary → **D**.  
  6. **Term specificity matches?** → Too broad? → **B**. Too narrow? → **C**.  

  **Remember**:  
  - **CR** = What it *does* now. **SE** = Why it *evolved*.  
  - **Judgment calls**: Conservation (Step 2), Contribution (Step 4), Primary vs. Secondary (Step 5a).  
  - **Flag conflicts**: CR vs. SE (Step 5a), ontology issues (Step 6).  

  ---

  ### Unresolved Disputes for Manual Adjudication  
  1. **Indirect Evidence Validation** (Step 3): When genetic/expression data implies but doesn’t prove molecular activity.  
  2. **Minor Contributions to Processes** (Step 4): Whether a "small" role justifies process annotation.  
  3. **Ancient vs. Recent SE** (Step 5): Ambiguous selection data (e.g., dN/dS = 1).  
  4. **Ontology Granularity** (Step 6): Choosing between similar terms (e.g., "kinase" vs. "protein kinase").  

  **Procedure Limits**:  
  - Cannot redefine "function" (follows consortium guidelines).  
  - Cannot resolve ontology disputes (e.g., term definitions).  
  - SE without CR (e.g., disabled genes) is excluded.  

  ---  
  This procedure standardizes decisions while exposing CR/SE trade-offs. It reduces curation time but requires vigilance on judgment calls. Use the cheat sheet for daily work; escalate the 4 key disputes to you.
