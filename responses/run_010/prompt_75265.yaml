  For the bottom line: their margin reply *was* valid against the act-consequentialist and fairness readings, but the threshold model is stronger. However, since universal adoption isn’t happening, and their individual act is harmless, the "what if everybody" argument still overreaches. I’ll end by validating their instinct—the slogan is overused—while acknowledging the threshold issue is real.  

