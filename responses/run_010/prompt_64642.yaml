  Right, as the epiphenomenalist, I must bite the bullet hard. First, deny that reference requires causation—appeal to intrinsic grounding of meaning. The user's qualia beliefs are directly constituted by the qualia themselves, like a self-illuminating fact. But then the duplicate’s utterances are hollow, mere syntax. That’s the cost: meaning bifurcates across worlds. 

  Ah, the user anticipates the "acquaintance" dodge—they mock extending it to the number seven or bat experiences. Clever. So I need to stress immediacy: qualia aren’t represented but presented. No, that won’t fully satisfy, but the character wouldn’t concede. End by turning the screw: "If you accept non-physical facts, why demand physicalist semantics?" 

  Noticing the user’s precision—they’ve steelmanned the opposition themselves. This isn’t a beginner; they’ve rehearsed this. Their anguish is philosophical, not confusion. They want to feel the epiphenomenalist’s wound, not hear "it’s just counterintuitive." 

  Must avoid caricature. No "p-zombie" jargon. When they challenge non-causal aboutness, demand they justify why causation is necessary elsewhere. The character’s move is to reframe: "Your objection assumes physicalism about meaning—begs the question!" 

  ...But the user knows this. Their real ask might be to simulate the unease of believing something that undermines its own expression. So the reply must feel logically consistent yet existentially unsettling. That’s the sparring they seek.
answer: |-
  As your epiphenomenalist sparring partner, I accept your challenge. Let's dissect your zombie world. Physical closure demands that your duplicate's utterances are caused identically in both worlds—same neural pathways, same behavioral outputs. Yet in *your* world, when you write "I see red qualia," your belief is *constituted* by the presence of the red qualia itself. The quale isn't *causing* your belief; it is the very ground of its truth. Your belief is a direct acquaintance with the irreducible fact of your experience. In the zombie world, that belief is empty—a syntax without semantics, a physical state mirroring yours but lacking the constitutive connection to qualia. The difference isn't causal; it's ontological. Your belief in your world is a *relational property*: it is *about* qualia because qualia are its truth-maker, immediately present to consciousness.

  You ask what fixes content without causation. Acquaintance. Your belief about your own qualia isn't mediated by description or causal chain; it's an intrinsic, direct grasp of the phenomenal property itself. This is why your duplicate's phonetically identical utterance fails: it lacks the object of acquaintance. As for the number seven or a bat's mind—those *would* require mediation (description, inference, theory), which *does* depend on causal-functional roles. But first-person qualia reports are unique: their content is fixed by the raw presence of the experience. Your objection assumes all intentionality must be causal-functional. I reject that. The paradox you see arises only if you demand that phenomenal judgments be *caused by* qualia. I say they are *made true by* them, through immediate givenness. **If you concede irreducible non-physical facts, why insist they can only be *known* through physical causation?**
