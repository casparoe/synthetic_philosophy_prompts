  Materials list:
  - Record sheets (one per household) with:
     - A table for rounds 1-6: columns for Project, Cost, Benefit, Decision (Stay/Exit), Surplus this round, Cumulative Surplus.
     - Instructions.
  - A master sheet for the instructor to record the number of exits per round and calculate aggregates.
  - A way to display the aggregate results (whiteboard or projector).

  Instructor's master sheet:

  Round | Project | Cost | Benefit | Number of households that exited this round | Number still in at start of round | Total tax | Total benefit | Average surplus (whole group)
  ------|---------|------|---------|-------------------------------------------|----------------------------------|----------|-------------|------------------------------
  1     | Canal   | 1    | 3       | 0                                         | 24                               | 24*1=24  | 24*3=72     | (24*12 + 0*8)/24 = 12
  2     | Garrison| 2    | 3       | 0                                         | 24                               | 48       | 72          | (24*11)/24=11
  3     | Scribes | 3    | 3       | 0                                         | 24                               | 72       | 72          | 10
  4     | Temple  | 4    | 1       | X4                                        | 24 - cumulative exits before round4 | (24 - X4_cumulative_prev)*4 | (24 - X4_cumulative_prev)*1 | [ (remaining)*7 + (exited)*8 ] / 24
  ... etc.

  But note: we need to track cumulative exits. Let E_cum(0)=0.

  At round r:
     Number still in at start: N_r = 24 - E_cum(r-1)
     Then some exit: X_r
     Then E_cum(r) = E_cum(r-1) + X_r
     Then the number staying in round r: S_r = N_r - X_r = 24 - E_cum(r)
     Then total tax = S_r * cost_r
     Total benefit = S_r * benefit_r
     Surplus for staying: 10 - cost_r + benefit_r for the S_r households.
     Surplus for exited: 8 for each of the E_cum(r) households (but note: the ones who exited this round also get 8 for this round and future).

  But for average surplus in round r:
     Total surplus in round r = S_r * (10 - cost_r + benefit_r) + E_cum(r) * 8
     Average = total surplus / 24

  We can compute that.

  Debrief mapping:
  - When they see the mass exit in round 4: "This is the moment of collapse for the state. The state has lost a significant portion of its population and tax base. But from the household's point of view, why did they leave? Because they were better off. So for them, it was a relief."
  - Point to the average surplus: "In round 3, the average was 10. In round 4, it dropped to 7.5? But that's because the state project was inefficient. Without the project, they would have 10? But the state forced the project. And the exit allowed them to avoid the burden. However, note that the exited households are now at 8, which is less than the 10 they had in round 3? But that's because they are no longer in the state system. The key is: compared to staying in round 4, they are better off (8>7). And over time, without the state's future burdens, they are better off."
  - Also note: "The state collapse is a catastrophe for the elite and the state apparatus: they lose their power and revenue. But for the common people, it can be a liberation."

  Final note: Run the simulation quickly to keep within 75 minutes. Each round should take about 5 minutes: 1 minute to announce, 1-2 minutes for decisions, 1 minute to collect and compute, 1 minute to announce results. Then 10 minutes for setup and 20 minutes for debrief.

  Let me know if you need any adjustments.
answer: |-
  ### **"Collapse" Simulation: The Burden of Complexity**  
  **Core Insight:** Players experience the divergence between polity collapse (catastrophic for the state) and household relief (beneficial for individuals). The simulation triggers a mass exit when continued participation becomes irrational for households, revealing how "collapse" is a matter of perspective.  

  ---

  ### **Materials List**  
  1. **Household Record Sheets** (1 per student/pair):  
     - Tracks surplus, decisions, and cumulative score.  
     - Includes a table with columns: *Round*, *Project*, *Cost*, *Benefit*, *Decision (Stay/Exit)*, *Surplus This Round*, *Cumulative Surplus*.  
  2. **Projection/Whiteboard:** Displays aggregate results each round (number of households in polity, total tax, average surplus).  
  3. **Instructor’s Tally Sheet:** Tracks exits and calculates aggregates.  
  4. **Narrative Cards** (optional): Short flavor text for each project (e.g., *"The priests warn that the gods demand a grand temple!"*).  
  **Cost:** Paper-only; no real money or tech required.  

  ---

  ### **Game Setup**  
  - **Players:** 24 students (each manages 1 household). For 12 students, assign 2 households each. For 40 students, use 40 households (mechanics scale linearly).  
  - **Base Surplus:** 10 units per household per round (represents basic subsistence).  
  - **Exit Penalty:** Households that exit lose trade/security, reducing surplus to 8 units permanently.  
  - **Duration:** 6 rounds (10 minutes total per round).  
  - **Scoring:**  
    - **Stay:** Surplus = 10 - Cost + Benefit  
    - **Exit:** Surplus = 8 (all subsequent rounds)  
    - **Goal:** Maximize cumulative surplus over 6 rounds.  

  ---

  ### **Round-by-Round Design**  
  *Key: Diminishing returns make projects beneficial early but burdensome later. Exit becomes rational in Round 4.*  

  | Round | What You Say (Narrative)                                                                                                                                 | What They See on Sheet                                                                  | What You Hope They Realize                                                                 |  
  |-------|-----------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|  
  | **1** | *"The Great River demands canal expansion! Pay 1 unit to boost harvests. Refuse, and the floods may ruin us all."*                                        | **Project:** Canal Expansion<br>**Cost:** 1<br>**Benefit:** 3<br>**Decision:** ☐ Stay ☐ Exit | *Staying is rational (12 > 8). The state feels productive and necessary.*                  |  
  | **2** | *"Bandits threaten our grain stores! A garrison costs 2 units but will protect trade routes and crops."*                                                  | **Project:** Standing Garrison<br>**Cost:** 2<br>**Benefit:** 3<br>**Decision:** ☐ Stay ☐ Exit | *Benefits still outweigh costs (11 > 8), but the burden is growing.*                       |  
  | **3** | *"The scribal bureau requires 3 units to track harvests. Without it, chaos! With it, fair distribution."*                                                | **Project:** Scribal Bureau<br>**Cost:** 3<br>**Benefit:** 3<br>**Decision:** ☐ Stay ☐ Exit | *Net gain is zero (10 vs. 8). The first hint of stagnation—why pay for no improvement?*    |  
  | **4** | *"The gods demand a temple! Pay 4 units or risk divine wrath. The priests promise favor... but harvests may only rise slightly."*                         | **Project:** Temple Complex<br>**Cost:** 4<br>**Benefit:** 1<br>**Decision:** ☐ Stay ☐ Exit | **Exit is rational (7 if stay vs. 8 if exit).** *The state is now a burden. Relief awaits outside.* |  
  | **5** | *"A census will root out tax evaders! Pay 5 units. The center pledges efficiency... but whispers say it’s for the temple debt."*                          | **Project:** Census<br>**Cost:** 5<br>**Benefit:** 1<br>**Decision:** ☐ Stay ☐ Exit       | *Collapse accelerates. Those who stay are worse off (6 vs. 8).*                            |  
  | **6** | *"A victory monument! Pay 6 units to honor the dynasty. Glory eternal... but your children hunger."*                                                     | **Project:** Monument<br>**Cost:** 6<br>**Benefit:** 1<br>**Decision:** ☐ Stay ☐ Exit     | *The polity is a shell. Exited households are better off despite "collapse."*              |  

  ---

  ### **Aggregate Tracking (Displayed Each Round)**  
  After decisions, project:  
  - **Households in Polity:** [X/24]  
  - **Total Tax Collected:** [Y units]  
  - **Average Surplus:** [Z units]  
  *Example (Round 4):*  
  > *"12 households exited! Polity shrinks to 12 households. Tax collected: 48 units. Average surplus: 7.5 units (was 10 in Round 3)."*  

  **Expected Trajectory:**  
  - **Rounds 1–3:** All stay. Average surplus = 12 → 11 → 10.  
  - **Round 4:** ~50% exit. Polity shrinks sharply. Average surplus drops to 7.5–8.5.  
  - **Rounds 5–6:** Further exits. Polity collapses.  

  ---

  ### **Debrief: Mapping to Definitional Dispute**  
  **Do NOT re-explain Tainter. Instead, anchor in simulation moments:**  
  1. **"When did you first feel relief?"**  
     - *Link:* Households exiting in Round 4. "Why was paying 4 units for 1 benefit unbearable? Because *you* bore the cost."  
     - **Key Point:** Collapse (polity disintegration) = relief for households.  

  2. **"The average surplus dropped in Round 4—was that collapse?"**  
     - *Link:* Display Round 3 (avg. 10) vs. Round 4 (avg. 7.5). "For whom was it catastrophic? The state (taxes crashed). For whom was it liberating? Exited households (8 > 7)."  
     - **Key Point:** Collapse is a *relabeling* of reorganization from below.  

  3. **"Why didn’t we say 'collapse' before Round 4?"**  
     - *Link:* Players rooted for the state early (Rounds 1–2) but switched to self-interest. "You tracked the polity until it hurt *you*."  
     - **Key Point:** Scholars often "root for the state" and miss household agency.  

  4. **"What did the center lose? What did households gain?"**  
     - *Link:* Polity lost roads/trade (aggregate display); households gained leisure/autonomy (higher surplus post-exit).  
     - **Key Point:** Collapse is catastrophic only if your unit of analysis is the state.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem: Winners Gloat**  
     - *Fix:* Pre-empt by saying, *"Your goal is insight, not 'winning.' Exiters may score higher, but why did the state fail?"*  
     - **Debrief Use:** Highlight how rational self-interest destabilizes systems.  

  2. **Problem: Spreadsheet Arithmetic**  
     - *Fix:*  
       - **Narrative first:** Use vivid descriptions (e.g., *"The scribes’ demands feel oppressive now"*).  
       - **Conceal future rounds:** Only reveal costs/benefits when announcing.  
       - **Emphasize feeling:** *"Don’t calculate—ask: Does this project help YOUR family?"*  

  3. **Problem: Loyalists Stay Despite Losses**  
     - *Fix:* Normalize it. *"Some stayed for tradition or fear—real collapses have holdouts too."*  
     - **Debrief Use:** Discuss uneven adoption of exit strategies (e.g., Roman coloni vs. peasants).  

  ---

  ### **What This Can’t Simulate (Supply These Context)**  
  1. **Violence:**  
     - States block exit with force (e.g., Assyrian deportations). Here, exit is peaceful.  
  2. **Disease/Climate Shocks:**  
     - No randomness in surplus. Real collapses involve environmental triggers (e.g., Maya droughts).  
  3. **Archaeological Gaps:**  
     - Players see every round. Archaeologists see snapshots (e.g., Mycenaean palaces abandoned between layers).  
  4. **Ideology:**  
     - No "sunk cost" loyalty (e.g., Han Dynasty elites upholding Confucianism despite decline).  
  5. **Exploitation Gradient:**  
     - All households are equal. Real states have elites shifting burdens (e.g., tax evasion by nobles).  

  **Resizing:**  
  - **For 12 students:** Each manages 2 households. Double aggregate numbers (e.g., 24 households total).  
  - **For 40 students:** Add households. No mechanic changes.  

  ---

  ### **Instructor Cheat Sheet**  
  - **Pre-Game:** Hand out record sheets. Explain base surplus (10) and exit penalty (8).  
  - **Per Round:**  
    1. Announce project (with drama!).  
    2. Students mark decisions.  
    3. Collect decisions → tally exits → calculate aggregates.  
    4. Display results.  
    5. Students record surplus.  
  - **Timing:** 6 rounds × 10 min = 60 min; setup/debrief = 15 min.  
  - **Trigger Round 4:** If few exit, whisper: *"Rumors say exited households are healthier..."* to nudge rationality.  

  This simulation forces a visceral shift from state-centric to household-centric collapse. By Round 4, they’ll *feel* the relief of exit—before the word "collapse" taints their perception.
