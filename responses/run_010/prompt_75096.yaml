answer: |-
  You're hitting the core tension, but conflating two issues. The differential cost *is* the mechanism enforcing honesty – it's not just that lying doesn't pay, it's that lying *can't pay enough* for low-quality signallers to mimic effectively. A cheap signal *can* be honest if it's intrinsically linked to an unfakeable quality (like scent), but that's the exception, not the rule. Most signals *are* arbitrary and vulnerable to bluffing... unless they carry a cost that low-quality individuals can't bear. Your turtle hunt example *is* costly signaling: the risk of failure, the time invested, the physical danger – these are real costs absorbed *even if successful*. The sharing? That's the *benefit*, offsetting the cost *only* for genuinely skilled hunters. The cost isn't "waste" in a vacuum; it's a filter ensuring only the capable pay the price and reap the rewards. The honesty comes from the *risk*, the *variance* – the *potential* for net loss that deters the unskilled. [Settled: Differential costs enforce honesty in arbitrary signals. Contested: Whether *all* honest signals require costs, & the relative importance of "handicaps" vs. indexical signals in human displays.]
