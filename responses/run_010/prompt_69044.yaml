  I'm trying to work out whether Church of the Holy Trinity v. United States (1892) is really the knockout punch against textualism it's usually treated as, and I want a careful case analysis rather than the standard summary. Recap of the facts, since they matter: the Alien Contract Labor Act of 1885 made it unlawful to assist or encourage bringing aliens into the country under contract to perform labor or service of any kind. A New York Episcopal church contracted with an English clergyman to come over as its rector, the lower courts found a violation, and a unanimous Court reversed through Brewer, reasoning that the mischief aimed at was the importation of cheap manual labor, that a rector isn't a laborer in that sense, and then going further — roughly, that a case can fall inside a statute's words and yet outside its intention, and outside its words and yet inside its spirit (that's my paraphrase, not a quotation). Worth noting the act's proviso excepting certain professionals like lecturers, singers, and artists conspicuously doesn't mention ministers.

  So, mapping it out: what exactly is the textualist's complaint — that the Court consulted purpose at all, or only that it let purpose defeat text it conceded was clear? Does that proviso exception list help or hurt him, given expressio unius? What's the purposivist's strongest defense? And the part I actually care about: can a modern contextualist textualism, where semantic content is fixed by the ordinary conversational context and background knowledge available to a reasonable reader at enactment, absorb the result without giving up anything, or does it have to concede that some cases are decided by purpose after all? Tell me where each theory goes silent instead of forcing an answer. Finally, is the opinions famous Christian-nation flourish seperable from its use as a purposivist precedent, or does it poison the well? Answer in American English, please.
