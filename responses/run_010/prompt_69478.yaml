prompt: |-
  I'm news editor at my college paper (small, all volunteers, maybe two of us with any actual training) and we have the same fight every week: somebody wants to run something that's probably true but thin on evidence, half the staff says publish because the story matters, half says we're not entitled to it. We just did Clifford and James in my ethics class and instead of writing another essay I want to actually build the thing into a procedure.

  So: give me a decision procedure an editor can run on a story in twenty minutes before a print deadline. Ordered questions, what counts as a good enough answer to each one, where it hard-stops at no, and where it has to hand the call up to a human because its a values question and not a facts question (our editor-in-chief signs off, we have no lawyer, no fact-checker).

  It has to handle the cases that break us: the one where publishing is what produces the rest of the evidence, because a warning gets two more people to come forward; the one where the choice is genuinely forced for readers but totally avoidable for us; and the one where the claim is about somebody's character and they declined to comment. Be explicit about the translation steps — Clifford's rule is about believing, not publishing, and James's genuine-option test is about one person's passional choice, not an institution's — and tell me which parts of each view you kept and which you dropped to make it usable, and where the procedure is really just my judgement wearing a flowchart.

  Then run it on three cases: an assault allegation against a grad instructor from one named complainant, no second source, instructor declined to comment; a prof's warning that a supplement students stack before exams interacts badly with a common prescription, based on a handful of case reports; and a story I badly want to run linking a donor to something shady where the whole trail is one memo I can't verify. Let one of them come out against me. End with what the procedure just cannot do.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're a news editor at a small college paper with volunteer staff, facing ethical dilemmas weekly about whether to publish stories with thin evidence. They mentioned studying Clifford and James in ethics class and want a practical decision procedure. The key issues are balancing truth, evidence, public interest, and avoiding harm.

  First, I need to recall Clifford's ethics of belief, which emphasizes sufficient evidence before believing something. James, on the other hand, allows belief in the absence of evidence when it's a genuine option with significant stakes. But publishing isn't the same as personal belief. The procedure must bridge these philosophical principles to journalism ethics.

  The user highlighted three tough cases: assault allegations needing more sources, a health warning based on limited reports, and a donor scandal with unverified documents. Each tests different aspects—public interest, potential harm, evidentiary standards. The procedure must handle cases where publishing might elicit more evidence, avoidable choices, and character accusations without comment.

  Translating Clifford to publishing: Emphasize evidence standards but adapt for urgency. James' genuine option—here, it's about the community's need to know. But the paper's institutional role means higher responsibility than an individual's belief. Need to set clear evidence thresholds and escalation points.

  Structure the procedure as a flowchart with ordered questions. Start with verifiable facts, then public interest, alternatives to publishing, potential harms, and finally, an honesty check. Include hard stops for insufficient evidence or high harm without public necessity. Values questions go to the editor-in-chief.

  For the assault allegation: One source, no comment from accused. Clifford would demand more evidence; James might consider the stakes for victims. Procedure should hard-stop due to lack of evidence and high harm potential. Health warning: Thin evidence but high stakes, public interest. Mitigate by phrasing as a caution, not a fact. Donor story: Unverified document, no way to confirm. Hard-stop, but suggest investigative steps.

  The procedure can't handle subjective judgments on newsworthiness or resolve deep ethical conflicts without human input. Need to clarify where the editor's discretion is necessary versus following the flowchart. Also, ensure the process is quick—20 minutes before deadline—so questions must be concise, answers binary where possible.
answer: |-
  Here’s a **20-Minute Editorial Decision Protocol** based on your needs, merging Clifford’s evidentiary rigor with James’s stakes-based urgency, adapted for institutional publishing. I’ve flagged where philosophy bends to practicality.

  ---

  ### **The "Triage Flow" Protocol**  
  *(Run in order — hard stops at ⚠️)*

  1. **"Can we verify ≥2 independent sources OR 1 source + documentary proof?"**  
     - *Good enough:* Named sources on-record, official documents, data sets, or unambiguous photos/video.  
     - *⚠️ Hard stop at NO:* Kill the story. *Clifford core: Belief (here, publication) requires evidence. No "publish to get evidence" exceptions — that’s gambling with reputations.*  
     - *Hand-off to human:* If *almost* met (e.g., one source + strong circumstantial evidence).  

  2. **"Is this a *genuine, unavoidable option* for our readers? (i.e., Is inaction likely to cause direct, imminent harm?)"**  
     - *Good enough:* Threat to health/safety, electoral fraud, or systemic abuse where readers *must* act now.  
     - *⚠️ Hard stop at NO for character claims:* If Q1 failed AND the story attacks someone’s character, kill it. *James bent: We prioritize avoiding harm over forcing "options" when evidence is weak.*  
     - *Hand-off to human:* Public interest is high but harm isn’t imminent (e.g., corruption without urgent stakes).  

  3. **"Can we achieve the public good *without publishing the claim*?"**  
     - *Good enough:* Anonymous tips to authorities, generic warnings ("consult your doctor about supplements"), or reporting the *existence* of allegations without details.  
     - *⚠️ Hard stop at YES:* Use the alternative. *James-inspired: Avoid forcing avoidable choices.*  

  4. **"What’s the worst plausible harm if we’re wrong?"**  
     - *Good enough:* Ruined reputation, expulsion, violence, or legal liability for the paper.  
     - *Hand-off to human:* If harm is severe AND Q1 evidence is borderline. *Clifford/James hybrid: High harm + low evidence = don’t publish.*  

  5. **"Honesty Check: Are we willing to attach our names to this?"**  
     - *Good enough:* Every writer/editor signs a transparency note: "We stand by this because [reason]."  
     - *⚠️ Hard stop at NO:* Kill the story. *Clifford’s social ethics: Publishing is a communal act of trust.*  

  **Final arbiter:** Editor-in-Chief resolves hand-offs. Time limit: 7 minutes per hand-off.

  ---

  ### **Translation Notes**  
  - **Clifford kept:** Evidence-first rigor, social accountability for belief-like actions.  
  - **Clifford dropped:** Absolute evidence threshold (journalism can’t wait for geometric proof).  
  - **James kept:** "Forced option" framing, consequences over abstractions.  
  - **James dropped:** Individual subjective right to believe → institutional duty to minimize harm.  
  - **Your judgment in disguise:** Q4 (harm assessment) and hand-offs. The flowchart forces explicit justification.

  ---

  ### **Case Tests**  

  **Case 1: Grad Instructor Assault Allegation (1 named complainant, no second source, no comment)**  
  - Q1: **NO** (1 source, no docs). *⚠️ HARD STOP.*  
    *Why:* Clifford’s core demand fails. Publishing to "get more sources" risks destroying a life on hearsay. *Alternative:* Report *to Title IX office*; run a *generic* piece on assault reporting resources.  

  **Case 2: Prof’s Warning About Supplement/Prescription Interaction (handful of case reports)**  
  - Q1: **YES** (prof = source 1, case reports = source 2).  
  - Q2: **YES** (imminent health risk, readers *must* decide whether to take supplements).  
  - Q3: **NO** (generic warning lacks urgency/specificity).  
  - Q4: Harm if wrong = low (if phrased as "potential risk" with evidence cited).  
  - Q5: **YES** (signed by science editor).  
    **PUBLISH** — with caveats: "Case reports suggest… consult your doctor." *James prevails: Forced option with catastrophic stakes.*  

  **Case 3: Donor Shadiness (one unverified memo)**  
  - Q1: **NO** (single doc, unverified). *⚠️ HARD STOP.*  
    *Why:* No chain of custody, no corroboration. *Alternative:* Investigate further; if donor is powerful, *hand-off to human* — but Q4 (libel risk) likely kills it anyway. *Sorry, but Clifford wins: Unverified docs aren’t evidence.*  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Resolve deep value clashes** (e.g., "newsworthiness" vs. "privacy" with equal evidence).  
  2. **Substitute for investigation** (it filters, but won’t find sources).  
  3. **Handle institutional power imbalances** (e.g., pressure from admin to spike a true story).  
  4. **Fix ethical cowards** (if editors lie during Q5, the system fails).  

  **Last tip:** Tape this to your wall. When debates start, say: "Run the Triage Flow. Clock’s ticking." Forces rigor over rhetoric.
