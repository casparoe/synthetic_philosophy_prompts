prompt: |-
  Been on LW and the old game theory threads for like fifteen years, and my tiny podcast about coordination problems finally booked a guest who I think is genuinely worth pinning down. He's pushing a view I'll call the legibility thesis: program equilibrium — the setup where each player submits a program and gets to read the other's before the game runs — isn't a formal toy, it's a *predictive* account of real-world cooperation between parties who can audit each other's decision procedures. On his story, once your decision procedure is genuinely readable to the other side, the cooperative fixed point stops being a curiosity and starts being the default, and basically all institutional variation is variation in how legible parties are to each other. His distinctive sub-claim: the thing that actually breaks cooperation isn't opacity, it's *cheap* legibility — publishing code you can quietly swap out later — so what matters is what he calls binding legibility, where changing your own code after disclosure is itself observable to the other party.

  I want nine or ten questions I can say out loud that make him defend that rather than re-explain it to people who've never heard of superrationality. Please cover at least:

  - the equilibrium-proliferation problem — if everyone can read everyone's source, the program-equilibrium payoffs end up being roughly everything feasible and individually rational, so what does his selection story actually add, and is it just assuming cooperation to derive cooperation;
  - binding legibility vs. ordinary commitment devices and collateral — what's left of the idea once you notice that "changing your code is observable" is a monitoring technology, and where does his account make a *different* prediction than reputation-plus-contract;
  - asymmetric legibility: one side public, one side private (a state actor vs. a startup, or an open-weights lab vs. a closed one) — does legibility help or hurt the legible party, given that anything which can read you can also exploit you;
  - whether he needs Hofstadter-style similarity between the agents, and what happens in a game that isn't a symmetric prisoner's dilemma — hawk-dove, say;
  - bounded proof search and proof length, i.e. what his account says when reading the code is cheap but *verifying* it isn't, and the default becomes defect-if-no-proof-found;
  - diagonalization — a program that reads the opponent and does the opposite;
  - one question on what empirical evidence would count against the legibility thesis, ideally something that makes him engage with the fact that maximally legible environments (transparent on-chain contracts, published trading algorithms) also show the most naked extraction.

  For each question, also give me the answer he'll most likely reach for, and the follow-up that stops that answer from working. No softballs, nothing about his career or what got him interested.
reasoning: |-
  Okay, the user is a long-time LessWrong reader and podcaster focusing on coordination problems. They've booked a guest promoting the "legibility thesis" - the idea that program equilibrium predicts real-world cooperation when parties can audit each other's decision procedures. The core claim is that binding legibility (where code changes are observable) enables cooperation, not just cheap legibility.

  The user wants sharp questions to challenge the guest's thesis without rehashing basics. They've listed seven specific angles to cover. I need to craft questions that:
  - Force defense rather than explanation
  - Target conceptual weaknesses
  - Include likely answers and killer follow-ups

  Breaking down each required topic:

  First, equilibrium proliferation - if all code is readable, nearly all outcomes become possible. The guest will probably say binding legibility selects for cooperation through mutual punishment. But that assumes they already want to cooperate - circular reasoning. Follow-up should press whether this just assumes cooperation rather than explaining it.

  Second, binding legibility vs traditional mechanisms. Guest will claim it's cheaper than collateral and enables new cooperation forms. Follow-up should challenge whether it's meaningfully different from reputation systems with automated monitoring.

  Third, asymmetric legibility. Guest will argue the legible party benefits by attracting cooperation. Follow-up should push on exploitation risks - if opponents know your code, they can always game it unless you're perfectly rational.

  Fourth, Hofstadter-style similarity. Guest will downplay symmetry requirements. Follow-up should test this with Hawk-Dove where coordination matters more than mutual cooperation.

  Fifth, bounded proof search. Guest will say bounded verification creates mutual incentives for simplicity. Follow-up should explore whether this reintroduces opacity through computational limits.

  Sixth, diagonalization. Guest will dismiss malicious programs as self-refuting. Follow-up should probe whether this assumes aligned preferences upfront.

  Seventh, empirical counterevidence. Guest will attribute extraction to non-binding legibility. Follow-up should demand how we'd test if binding legibility actually changes behavior in practice.

  The questions need surgical precision - no room for generic answers. Each follow-up must block escape routes. For example on asymmetry, corner them on whether legibility invites exploitation against rational opponents. On proof bounds, force admission that bounded rationality creates new attack vectors.

  Also important: frame questions conversationally but with embedded traps. Like asking "what selects for cooperation?" sounds innocent, but the follow-up about circular reasoning is the real dagger.

  User clearly knows this space cold - their examples (on-chain contracts, open vs closed AI labs) show domain mastery. So no dumbing down. This is expert-to-expert combat with questions as scalpels.
answer: |-
  Here are nine razor-focused questions targeting the core vulnerabilities of the legibility thesis, designed to force novel defense rather than re-explanation. Each includes the predicted answer and a surgical follow-up.

  1.  **Question:** "Equilibrium proliferation seems fatal: with full mutual source access, *any* individually rational payoff becomes achievable via programs that punish deviation. Why should cooperation emerge as the *default* rather than mutual defection, extortion, or something else? Isn't your 'binding legibility' just assuming a shared *desire* for cooperation to select that specific equilibrium?"
      *   **Likely Answer:** "Binding legibility enables credible threats of *mutual* punishment for non-cooperation. Agents who value future interaction self-select into writing and committing to programs that implement the Pareto-superior cooperative outcome, as deviating programs are detectable and punishable upfront."
      *   **Follow-Up:** "But doesn't that 'self-selection' *presuppose* the very cooperative intent you're trying to explain? If agents already prefer cooperation conditional on credible commitment, haven't you reduced binding legibility to just a fancy *mechanism* for an existing preference, not a *source* of cooperation?"

  2.  **Question:** "Binding legibility sounds isomorphic to reputation + smart contracts with observable state changes. What *unique empirical prediction* does the 'program equilibrium as predictive account' make that reputation models + standard commitment devices (like collateral escrow) don't? Where would we see a difference?"
      *   **Likely Answer:** "Binding legibility is *cheaper* and *finer-grained* than collateral. It enables cooperation in situations without tradable assets for collateral or where reputation networks are absent/fragmented. It predicts novel cooperation in low-trust, high-stakes one-shot interactions between pseudonymous entities *solely* based on auditable code."
      *   **Follow-Up:** "If the core innovation is cheap, observable monitoring of *state changes* (code alterations), isn't this just an incremental advance in monitoring tech for *existing* reputation/contract theory? Does your thesis predict cooperation emerging in scenarios where reputational incentives *and* collateral possibilities are demonstrably absent *and* binding legibility is present, that wouldn't happen otherwise?"

  3.  **Question:** "Asymmetric legibility: If Party A is fully legible/bound (e.g., an open-source AI lab) and Party B is opaque/private (a closed lab), who benefits? Isn't A handing B a blueprint for exploitation? Why wouldn't B defect optimally knowing A's deterministic response?"
      *   **Likely Answer:** "The legible party (A) benefits by signaling trustworthiness, attracting cooperation *from other legible parties*. The opaque party (B) gains nothing from A's legibility *except* the chance to exploit it *once*. But A's program conditions on B's *actual structure*; if B is opaque, A's program likely defaults to defection or demands high collateral, minimizing B's gain. Legibility attracts beneficial partners, deters bad ones."
      *   **Follow-Up:** "Doesn't this concede that legibility only benefits A *if* A can accurately *infer* B's type/strategy *despite* B's opacity? If A misreads B (e.g., thinks B is cooperative when it's adversarial), hasn't A's legibility made it *more* vulnerable to exploitation than mutual opacity? Isn't the 'accurate inference' step doing the heavy lifting, not legibility itself?"

  4.  **Question:** "Your thesis seems to require agents reasoning about identical copies. What happens in asymmetric games like Hawk-Dove? If both players are bound-legible but one has a higher value for the resource, won't their programs inevitably conflict? Does cooperation collapse, or do we just get the standard Nash equilibrium?"
      *   **Likely Answer:** "Legibility enables coordination on the *efficient* correlated equilibrium. Players can programmatically agree on a fair division (e.g., alternating) or use a verifiable random source to assign roles (Hawk/Dove) proportional to valuations, achieving a payoff superior to the mixed-strategy Nash."
      *   **Follow-Up:** "But doesn't agreeing on 'fairness' or the correlation device require *shared social norms or meta-coordination* **prior** to writing the programs? If players have genuinely conflicting notions of fairness (e.g., one values need, the other desert), can binding legibility *resolve* this conflict, or does it just implement a pre-existing (and potentially contested) coordination point?"

  5.  **Question:** "Real agents have bounded proof search. If verifying the *consequences* of opponent code is computationally intractable, a rational program defaults to 'defect if no proof of cooperation is found'. Doesn't this reintroduce mutual defection as the robust outcome even under binding legibility?"
      *   **Likely Answer:** "Agents write programs with *mutual verifiability* in mind. They use simple, modular code with bounded loops and explicit proofs attached. The threat of mutual defection if verification fails *incentivizes* simplicity and transparency in programming. Binding legibility includes committing to *verifiable* decision procedures."
      *   **Follow-Up:** "Doesn't this create an arms race in proof complexity? Agent A writes a simple proof. Agent B writes code exploiting edge cases A's simple proof missed. A then writes more complex code/proofs to handle B, making verification harder for both... regressing towards computational intractability and mutual suspicion. How is this stable?"

  6.  **Question:** "Diagonalization: Consider a program P designed to output the *opposite* of whatever P's opponent outputs *after reading P*. If P faces a copy of itself, it creates a logical paradox. If P faces a CooperateBot, it defects. Doesn't this malicious program exploit binding legibility and destabilize cooperation?"
      *   **Likely Answer:** "Such a program is self-refuting and irrational. Any opponent who reads P will see it's adversarial and defect preemptively. P gets Defect/Defect against anyone smart enough to understand it, including potential cooperators. Rational agents pre-commit to excluding such pathological programs from consideration or have meta-rules against self-referential malice."
      *   **Follow-Up:** "But doesn't this 'meta-rule' against malice itself require a *higher-order agreement* on what constitutes 'rational' or 'admissible' programs? If agents fundamentally disagree on this (e.g., one views aggressive retaliation as rational, another views it as pathological), can binding legibility resolve *this* dispute, or is it again assuming a pre-existing consensus?"

  7.  **Question:** "Empirical Challenge: Maximally legible environments (e.g., transparent on-chain DeFi contracts, published HFT algos) often exhibit ruthless extraction, front-running, and adversarial exploits – not cooperation. How is this consistent with binding legibility *causing* cooperation as the default?"
      *   **Likely Answer:** "This *is* the prediction! 'Legibility' in those cases is often *cheap* or *non-binding*. Published HFT algos can be changed instantly; DeFi contracts, while immutable, interact with opaque oracles and user wallets that *can* be manipulated. Extraction thrives where *true* binding legibility (of all relevant parts) is absent. The exploiters rely on *asymmetries* or hidden states."
      *   **Follow-Up:** "Can you name a single real-world, high-stakes interaction between strategic adversaries where **full** binding legibility existed and *did* produce sustained, unexpected cooperation *that wouldn't have occurred* under robust reputation/collateral systems? What specific evidence demonstrates binding legibility as the *causal driver*?"

  8.  **Question:** "Binding legibility requires 'changing code is observable'. But observability isn't binary. What's the minimal threshold? If I can change 0.1% of my code covertly, does cooperation collapse? How does the thesis handle noisy or imperfect monitoring of changes?"
      *   **Likely Answer:** "The theory assumes perfect observability for the idealized case. Practically, cooperation is robust to *small, undetectable* changes if the core commitment remains intact. The critical point is where a change *sufficient to alter the game-theoretic outcome* becomes detectable with high probability. Reputation mechanisms likely handle the residual noise."
      *   **Follow-Up:** "Doesn't this 'sufficient change' threshold depend entirely on the *specific game and payoffs*? And doesn't the possibility of *any* undetectable change reintroduce a 'trembling hand' problem where mutual suspicion persists? Is perfect cooperation only achievable under theoretically perfect, unrealizable monitoring?"

  9.  **Question:** "Scope: You claim 'basically all institutional variation is variation in legibility'. How does binding legibility explain cooperation within a *single* opaque hierarchy (e.g., a spy agency)? Or the success of *deliberately opaque* institutions like central banking? Doesn't this overreach?"
      *   **Likely Answer:** "Internal hierarchy relies on *internal* legibility (e.g., auditing by superiors) and external opacity. Central banking relies on legibility *to a specific, trusted subset* (e.g., legislators, auditors) with binding institutional constraints. The variation is in *who* has legibility over *whom* and the binding mechanisms involved."
      *   **Follow-Up:** "But within the spy agency, operatives are *not* legible to each other – compartmentalization prevents it. Cooperation relies on authority, loyalty, and fear, not mutual program verification. Doesn't this show binding legibility is just *one* coordination mechanism among many, not the master key explaining 'all variation'?"

  **Key Principles Used:**

  *   **Assumption Hunting:** Forcing the guest to reveal hidden preferences (Q1, Q4, Q6) or prior agreements needed to make legibility work.
  *   **Distinction Demanding:** Pressing for unique predictions or mechanisms not covered by existing theories (Q2, Q7).
  *   **Robustness Testing:** Applying the thesis to edge cases (Q3, Q5, Q6, Q8), asymmetric situations (Q3, Q4), and computational realities (Q5).
  *   **Empirical Accountability:** Demanding concrete falsifiable evidence or counterexamples (Q7, Q9).
  *   **Mechanism Overload:** Highlighting where the proposed mechanism (legibility) relies on other unstated mechanisms to function (Q1, Q2, Q4, Q5, Q6, Q8, Q9).
  *   **"Why Default?" Pressure:** Continuously challenging the claim that cooperation is the *default* outcome under binding legibility (Q1, Q3, Q5, Q7).

  These questions should force the guest beyond exposition and into genuine defense of the novel, strong claims of the legibility thesis, particularly its predictive power and status as a primary explanatory variable for cooperation. Good luck with the interview!
