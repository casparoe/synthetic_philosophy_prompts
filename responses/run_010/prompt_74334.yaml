  ### **Decision Tree & Results**
  Follow the path based on your answers. Each leaf shows a position or an unoccupied view. Positions:  
  - **Virtual realism**: Virtual objects are real (e.g., digital kinds exist).  
  - **Fictionalism**: Virtual objects are fictional; we pretend they're real.  
  - **Eliminativism**: Virtual objects are nothing but code/pixels; unreality.  
  - **Deflationism**: Objects aren’t real, but harms (e.g., emotional) are.  

