  Below is a virtual worlds sorting quiz designed as a decision tree. It uses concrete scenarios to map your intuitions to positions in the debate about the reality of virtual things, without revealing the labels in advance. The tree is built from the logical splits in the debate: (a) whether "real" is all-or-nothing or comes in degrees, (b) the ontology of virtual objects (e.g., a sword), (c) where virtual harm lands, and (d) whether contingency (e.g., server deletion) matters. The quiz has 6 questions, each with 2–3 options based on real-world scenarios. Positions covered include virtual realism (objects are real), fictionalism/pretence (objects are fictional), eliminativism (objects are just code/pixels), and deflationism (objects aren't real, but harms are). Some paths lead to unoccupied views (marked as incoherent, unattractive, or unclaimed). After the quiz, the verdict reflects my personal position.

  ---

  ### **Virtual Worlds Sorting Quiz**
  Answer each question based on your intuition. Do not overthink—go with your first reaction.

  1. **A friend griefs your carefully built castle in Minecraft, destroying it for fun. What best captures your concern?**  
     A. The virtual castle itself was ruined—it was a real creation.  
     B. I feel upset or betrayed—my emotions are harmed.  
     C. It’s just blocks—nothing important was lost.  

  2. **In an MMO, you paid real money for a rare sword, and another player steals it. What was taken?**  
     A. A genuine object—a digital asset I owned.  
     B. A pattern of code or data—it’s not a "thing," but it represents something.  
     C. Nothing real—it’s just pixels in a game.  

  3. **An NPC in a game begs you not to delete it, claiming it will "die." How do you respond?**  
     A. It’s nonsense—the NPC isn’t real, just code.  
     B. I might feel guilty, but it’s fictional—no moral weight.  
     C. It deserves consideration—it’s a real digital entity.  

  4. **Two players marry in a virtual world ceremony with friends attending. How real is this?**  
     A. Fully real—their commitment is authentic, regardless of the medium.  
     B. Symbolic but not fully real—it’s meaningful in degrees.  
     C. Not real at all—it’s pretend.  

  5. **Your late brother left a half-finished game save file. Should you preserve it?**  
     A. Yes—it’s part of his legacy, like a physical possession.  
     B. Only if it comforts someone—it has sentimental value, not inherent worth.  
     C. No—it’s just data; delete it.  

  6. **In VR, a player "assaults" your avatar with gestures that feel violating. How serious is this?**  
     A. Very serious—it caused real psychological harm.  
     B. Harmful, but only as a violation of game rules or community norms.  
     C. Not serious—no physical harm occurred.  

