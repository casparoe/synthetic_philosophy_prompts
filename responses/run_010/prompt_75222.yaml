  Finally, the thought experiments: sectarian prayer would break the audience-respect presupposition; constitutional readings would deny the transcendental dimension; non-theistic invocations would test whether "prayer" requires deity-addressing. Institutional resistance would reveal unspoken functions - like maintaining Christian cultural dominance or avoiding secular appearance.

