prompt: |-
  I am a fourth-year doctoral student in history and philosophy of science, and through a combination of bad luck and a supervisor's enthusiasm I have become the de facto triage editor for a small interdisciplinary journal on computation, information, and mind, as well as the person who coordinates reviewing for an annual workshop on unconventional models of computation. Between the two venues I see roughly a dozen submissions a year whose central claim is that the Church–Turing thesis has been refuted, overturned, or superseded: analog circuits, relativistic spacetimes, quantum devices, real-number machines, adaptive reservoir systems, and the occasional privately printed supertask. My own preparation for judging these is one term of recursion theory and a seminar on the philosophy of computation; my referees are typically graduate students with less than that. Our advisory board includes two working computability theorists and one relativist, all of whom have made it unmistakably clear that they will not look at a manuscript that has not first survived a serious initial assessment.

  What I need from you is a first-pass decision procedure that I can run on a single submission in forty-five minutes to an hour, that a non-specialist referee could also run without misusing it, and that terminates in one of four outcomes: desk rejection with a written justification that would withstand being quoted back by an indignant author; rejection coupled with an invitation to restate the claim and resubmit; ordinary external review; or escalation to a named specialist, accompanied by a one-page brief explaining what specifically the specialist is being asked to adjudicate. I would like the tests to be derived from the conceptual terrain rather than assembled as a list of generic red flags, so please begin with a short taxonomy and only then turn to the procedure. Lay out how many genuinely different claims are routinely collapsed under the single label Church–Turing thesis — a claim about what can be effectively calculated by a human being following rules without insight, a modest physical claim that whatever function a physical device used as a computing instrument delivers is Turing-computable, a bold physical claim that any physical process whatsoever is computable or simulable to arbitrary precision by a Turing machine, and a further claim about tractability and polynomial time — and, for each, say what would and would not count as evidence against it and why their epistemic statuses differ, since one of them is close to a stipulation fixing the meaning of a term, another is an empirical claim about the world that is permanently hostage to the idealizations built into the model of the measuring device, and a third is a complexity conjecture. The procedure should force the referee to identify which of these a submission is actually addressing before evaluating its argument, and it should be ordered so that the cheap and disqualifying checks come first. Please build in the checks I keep needing and keep fumbling: whether the non-computability is smuggled into the input, the initial condition, or the machine's parameters rather than generated by the dynamics; whether the claimed output is available to an ordinary observer in finite time and at finite precision; whether the model tells us what happens under perturbation and noise, or only under exact real arithmetic; whether the paper's claim is about computability at all or merely about speed; whether computable is being used in a BSS or real-RAM sense and the author has not noticed the substitution; and whether, if the argument succeeded, anyone should care. I would also like a short list of dismissals that referees must not deploy. I once rejected a manuscript with a line to the effect that no physical system can store a quantity to infinite precision, the author replied showing that this simply assumes the conclusion, and the exchange cost me a year of standing with the board.

  Then please run the procedure end to end on four submissions I will describe. First: an electrical engineer argues that after a finite settling time the exact voltage across a node in an analog circuit, set by a physical parameter, contains the successive bits of Chaitin's halting probability; the author concedes that noise limits any actual reading to about forty bits but maintains that the underlying value is nonetheless physically present. Second: a philosophy-of-physics paper argues that in a Malament–Hogarth spacetime, one in which an unboundedly long worldline lies entirely in the past of an event that a second observer reaches in finite proper time, an observer can decide the halting problem, and that this falsifies the bold physical formulation as a matter of what general relativity permits; the mathematics is explicit and, so far as I can judge, correct. Third: a computer science manuscript whose abstract announces that quantum computing refutes the Church–Turing thesis while the body establishes only a polynomial-time separation. Fourth: a flawless short paper observing that the three-dimensional wave equation admits computable initial data whose unique solution is not computable, in the manner of the Pour-El and Richards result, presented without further argument as a refutation of the physical thesis. For each of the four, give me the verdict, the one-paragraph justification I would send the author, and an explicit marking of the places where the verdict rests on a judgment call rather than on a checkable condition. Finally, tell me honestly which of the four the procedure will handle badly and why; I suspect it will be too generous to the second, since that submission seems likely to pass every test I can think of and still cost me six months and the permanent good will of a very reluctant relativist.

  For this task, adopt the standpoint of a philosopher of computation who has actually refereed in this literature and has watched submissions of this kind go wrong in both directions. Think carefully, work through the taxonomy before writing anything procedural, and where the procedure pretends to mechanical precision it does not possess, say so plainly at that step rather than in a general disclaimer at the end. Please do not supply a reference list, a reading list, or a bibliography of any kind: I am asking for a tool I can hand to a first-year referee, not a syllabus, and where you mention a result, describe what it establishes rather than citing where. I have no objection to your flagging, in a closing section, what the procedure cannot decide at all, including whether any version of the physical thesis is genuinely empirical or whether the debate over the thesis has been vitiated by people using the word computable to mean incompatible things.
reasoning: |-
  We are given a complex task: to design a decision procedure for submissions claiming to refute the Church-Turing thesis (CTT). The procedure must be runnable in 45-60 minutes by a non-specialist, and it must terminate in one of four outcomes. We begin with a taxonomy of the CTT and then build the procedure step by step.

  ## Taxonomy of Church-Turing Theses

  The label "Church-Turing thesis" is used for several distinct claims. We identify four:

  1. **Mathematical/Effective CTT (M-CTT)**: This is the original claim: every effectively calculable function (by a human following rules without insight) is Turing-computable. This is a claim about the extension of the concept of "effective calculability" and is taken as a definition in modern computability theory. It is not subject to empirical refutation because it is a conceptual claim about the equivalence of formalisms. Evidence against it would require showing a function that is effectively calculable (in the intuitive sense) but not Turing-computable. However, since the intuitive notion is not formally defined, such evidence would be controversial and likely lead to a reexamination of the intuitive notion.

  2. **Modest Physical CTT (MP-CTT)**: This claims that any function computed by a physical device used as a computing instrument (i.e., designed and operated to compute) is Turing-computable. This is an empirical claim, but it is modest because it only applies to systems we intentionally use as computers. Evidence against it would be a physical computer (built for computing) that computes a non-Turing-computable function. However, the claim is hostage to the idealizations of the device (e.g., no noise, infinite precision) and might be falsified by a system that exploits physical phenomena beyond classical mechanics.

  3. **Bold Physical CTT (BP-CTT)**: This claims that any physical process (not necessarily designed as a computer) can be simulated to arbitrary precision by a Turing machine. This is a strong empirical claim about the universe. Evidence against it would be a physical process (e.g., the evolution of a physical system) that computes a non-Turing-computable function, or that cannot be simulated by a Turing machine. This claim is highly contested and depends on the details of physical theory (e.g., quantum mechanics, general relativity). It is also hostage to the idealizations of the model (e.g., continuity, exact real numbers).

  4. **Complexity-Theoretic CTT (C-CTT)**: Often conflated, this is the claim that any physically computable function can be computed in polynomial time by a Turing machine (i.e., that P captures feasible computation). This is the P vs NP question and beyond. Evidence against it would be a physical device that solves an NP-hard problem in polynomial time. This is distinct from computability and about efficiency.

  ## Decision Procedure

  The procedure is a sequence of checks. The referee must first identify which CTT variant the submission addresses. Then, they run through checks, ordered to disqualify quickly. The referee must document the answers.

  ### Step 0: Identify the CTT Variant
     - Ask: Which Church-Turing thesis is the paper claiming to refute?
       - M-CTT: Mathematical/Effective
       - MP-CTT: Modest Physical (devices used as computers)
       - BP-CTT: Bold Physical (any physical process)
       - C-CTT: Complexity (efficiency, polynomial time)
     - If the paper does not specify or conflates them, this is grounds for desk rejection (with an invitation to resubmit after clarification).

  ### Step 1: Check for Input/Initial Condition Smuggling
     - **Check**: Does the non-computability arise from the input, initial condition, or parameters of the system? (e.g., encoding a non-computable number in the initial state or a physical constant)
     - **Why**: If the non-computable element is pre-supplied, then the system is not generating non-computability dynamically. It is merely reading out a non-computable input. This does not refute any physical CTT because the physical system is not computing the non-computable function; it is given as input.
     - **Outcome**: If yes, then desk reject with justification that the system does not compute the function but relies on a non-computable input.

  ### Step 2: Check for Finite Time and Precision
     - **Check**: Is the claimed output available to an ordinary observer in finite time and with finite precision? (In physics, we can only measure to finite precision in finite time.)
     - **Why**: If the output requires infinite time or infinite precision to read, then it is not a physical computation. For example, a system that outputs the entire infinite binary expansion of a non-computable number is not physically realizable because we can only read finitely many bits. This disqualifies the system as a counterexample to MP-CTT or BP-CTT.
     - **Outcome**: If no (i.e., the output is not available in finite time and finite precision), then desk reject.

  ### Step 3: Check for Robustness
     - **Check**: Does the model account for noise and perturbation? Or does it rely on exact real arithmetic?
     - **Why**: Physical systems are subject to noise and imprecision. If the claimed computation only works under idealized, noise-free conditions, then it may not be physically realizable. This is especially important for BP-CTT and MP-CTT.
     - **Outcome**: If the paper does not address robustness and the computation is shown only in an idealized model, then it may be rejected or sent for review but with a note that this is a major weakness. However, this might not be a desk rejection because some models (like quantum computing) start from idealizations. But if the claim is about physical realizability and robustness is absent, then desk rejection may be warranted.

  ### Step 4: Check for Conflation with Complexity
     - **Check**: Is the paper actually about computability (Turing-computable) or about efficiency (polynomial time)?
     - **Why**: Many papers claim to refute CTT but only show a speed-up. The CTT is about computability, not complexity. If the paper shows a polynomial-time speed-up (e.g., quantum computing for factoring) but the function is still Turing-computable, then it does not refute M-CTT, MP-CTT, or BP-CTT. It might challenge C-CTT, but note that C-CTT is not standardly called the Church-Turing thesis.
     - **Outcome**: If the paper conflates speed with computability, then desk reject with an explanation of the distinction and an invitation to restate the claim (e.g., as a challenge to the Extended Church-Turing thesis about efficiency).

  ### Step 5: Check for Real-RAM or BSS Model Assumptions
     - **Check**: Is the paper using a model of computation that assumes real numbers (like the Blum-Shub-Smale (BSS) model or real-RAM) without noting that this is non-standard? And does the author claim refutation of CTT based on this?
     - **Why**: The standard CTT is about Turing machines over discrete alphabets. If the paper uses a model with real numbers and claims a non-computable function, but that function is not computable in the Turing sense because the model is more powerful, then it doesn't refute CTT. The CTT is about effective computability in the discrete sense.
     - **Outcome**: If the paper relies on a non-standard model without acknowledging that the CTT is about Turing computability, then desk reject with an explanation.

  ### Step 6: Significance Check
     - **Check**: If the argument succeeded, would it matter? For example:
       - Does it address a version of CTT that is not just a definition (like M-CTT)?
       - For BP-CTT: Does it use a physically realistic scenario? (e.g., not requiring infinite energy or unphysical conditions)
       - Is the non-computability of a function that is of intrinsic interest (like the halting problem) or an artificial one?
     - **Why**: Some counterexamples, even if correct, might be seen as exploiting loopholes that do not challenge the spirit of CTT. However, this is subjective and should be used cautiously. It might be better to send for review if it passes the previous checks.
     - **Outcome**: If the paper passes all previous checks, but the claimed result is of questionable significance (e.g., an artificial physical system that no one would build), then it might still go to external review. But if it is obviously trivial or irrelevant, then desk reject.

  ### Step 7: Escalation to Specialist
     - If the paper passes Steps 0-6 without being desk rejected, then it must be either sent to ordinary review or escalated to a named specialist. Escalation is needed if:
       - The paper makes a claim in a highly specialized area (e.g., general relativity, quantum field theory) that the current referees cannot judge.
       - The paper passes all the checks and the claim is significant and non-trivial, but the argument is highly technical and requires expert verification.

  ### Dismissals to Avoid
     - **Avoid**: "No physical system can store a quantity to infinite precision." This assumes that physical systems are discrete, which is exactly what BP-CTT might deny. Instead, use the finite precision check (Step 2) which is about what we can measure, not what the system stores.
     - **Avoid**: "This is just analog computing and we know analog computers are not more powerful." Analog computing, in theory, can be more powerful if real numbers are used, but in practice, noise limits it. However, we have specific checks for that.
     - **Avoid**: "This is impossible by the Church-Turing thesis." Circular reasoning.

  ## Summary of Procedure
     - Step 0: Identify CTT variant. If unclear, desk reject with invitation to resubmit with clarification.
     - Step 1: Check for input smuggling. If found, desk reject.
     - Step 2: Check for finite time and precision. If failed, desk reject.
     - Step 3: Check for robustness. If absent and the claim is physical, this might lead to rejection or a note for reviewers, but not necessarily desk rejection. (This is a judgment call; if the model is highly idealized and the author does not address robustness, then desk rejection might be justified for physical claims.)
     - Step 4: Check for conflation with complexity. If found, desk reject with invitation to restate as a complexity claim.
     - Step 5: Check for non-standard models. If found and not acknowledged, desk reject.
     - Step 6: Significance. If the paper passes all checks but the result is trivial or irrelevant, desk reject. Otherwise, proceed.
     - Step 7: If the paper passes Steps 0-6, then decide between ordinary review and escalation.

  Now, we apply the procedure to the four submissions.

  ## Submission 1: Analog circuit for Chaitin's halting probability

  - **Step 0**: The author claims that the exact voltage contains the bits of Chaitin's Ω. This is a non-computable real. The claim is about a physical device (an analog circuit) so it targets MP-CTT or BP-CTT.

  - **Step 1**: The non-computability is set by a physical parameter. That parameter is given (e.g., a resistor value) and if that value encodes Ω, then the non-computability is in the input. The author concedes that the voltage is set by a physical parameter. So the non-computable number is provided by the physical parameter, not computed by the circuit. This is input smuggling.

  - **Step 2**: The author concedes that noise limits reading to 40 bits. But they claim the underlying value is physically present. However, we cannot access the infinite precision. So even if it were computed (which it isn't), we couldn't read it.

  - **Step 3**: The author admits noise is a problem.

  - **Verdict**: **Desk reject** because of Step 1 (input smuggling) and Step 2 (infinite precision required for the entire number).

  - **Justification to Author**: "The claimed non-computability of the voltage depends on a physical parameter that is set to a specific value. This means the non-computable number is provided as an input to the system, not computed by it. Moreover, even if the value were computed, the infinite precision required to read the entire binary expansion of Chaitin's Ω is not physically accessible due to noise and finite measurement precision. Therefore, the system does not constitute a counterexample to the physical Church-Turing theses."

  - **Judgment Calls**: The rejection is based on Steps 1 and 2 which are checkable.

  ## Submission 2: Malament-Hogarth spacetime for the halting problem

  - **Step 0**: The paper targets BP-CTT: it claims that in a Malament-Hogarth (MH) spacetime, an observer can decide the halting problem, and that this falsifies the bold physical thesis.

  - **Step 1**: The halting problem is a well-known non-computable function. The system uses the spacetime structure to run a Turing machine along an infinite worldline and then send a signal to an observer in finite time. The input (the Turing machine) is given, but that is standard. The non-computability is generated by the dynamics (the infinite computation and the signal). So no input smuggling.

  - **Step 2**: The observer in the finite proper time receives the answer (say, 0 or 1 for does not halt/halts). This is finite precision (one bit) and finite time for that observer. However, note that the infinite computation along the other worldline requires unbounded time and resources. The question is whether the physical setup is feasible. But the check is about the output: one bit in finite time for the observer.

  - **Step 3**: The model is highly idealized: exact general relativity, no quantum effects, no noise. The paper does not address what happens under perturbation. This is a major issue because MH spacetimes are known to be unstable and may require infinite energy.

  - **Step 4**: The claim is about computability, not complexity.

  - **Step 5**: The model is based on general relativity, not a non-standard model of computation per se.

  - **Step 6**: If successful, this would be significant because it would show that BP-CTT fails in a general relativistic universe. However, there is a large literature on hypercomputation in general relativity, and the physical feasibility is highly debated.

  - **Step 7**: Given that the mathematics is correct (as per the description) but the physical feasibility is questionable, we escalate to a named specialist (a relativist) because the issue of stability and physical realizability of MH spacetimes is highly technical.

  - **Verdict**: **Escalate to a named specialist** (a relativist) with a one-page brief.

  - **Brief to Specialist**: "The paper claims that in a Malament-Hogarth spacetime, an observer can decide the halting problem, thereby refuting the bold physical Church-Turing thesis. The mathematical construction appears correct. We ask you to adjudicate: (1) Whether the proposed setup is physically realizable within general relativity, considering energy conditions and stability under perturbation. (2) Whether the scenario is robust to noise and quantum effects. (3) Whether the outcome is available to the observer in a physically meaningful way (e.g., without requiring the observer to receive an infinite amount of information)."

  - **Justification to Author**: We don't send a justification until after the specialist review. But for now, we note that the paper passes the initial checks but requires expert review.

  - **Judgment Calls**: Step 3 (robustness) is a concern but not enough for desk rejection because the paper is about what general relativity permits. We are escalating because of the need for expert judgment on physical realizability.

  ## Submission 3: Quantum computing refutes CTT

  - **Step 0**: The abstract claims that quantum computing refutes CTT, but the body only shows a polynomial-time separation (e.g., that a quantum computer can factor integers in polynomial time, which is thought to be hard for classical computers).

  - **Step 4**: The paper conflates computability with complexity. Quantum computers are known to compute only Turing-computable functions (they can be simulated by a Turing machine, albeit inefficiently). The claim is about efficiency, not computability.

  - **Verdict**: **Desk reject with invitation to restate and resubmit**.

  - **Justification to Author**: "Your paper claims that quantum computing refutes the Church-Turing thesis, but the body of the paper only establishes a polynomial-time speed-up for a problem (factoring) that is already Turing-computable. The Church-Turing thesis concerns computability (what functions can be computed) and not efficiency (how fast). The claim about a speed-up is about the Extended Church-Turing thesis, which is a distinct conjecture. We invite you to resubmit with a revised claim that addresses the complexity-theoretic aspect and without the claim about refuting the Church-Turing thesis."

  - **Judgment Calls**: This is clear from Step 4.

  ## Submission 4: Wave equation and non-computable solution

  - **Step 0**: The paper is about the wave equation in three dimensions and uses a result similar to Pour-El and Richards to show that computable initial conditions can lead to a non-computable solution. It is presented as a refutation of the physical thesis (BP-CTT).

  - **Step 1**: The initial data is computable, so the non-computability is generated by the evolution. This is not input smuggling.

  - **Step 2**: The solution is non-computable at a specific time. However, the wave equation is a continuous evolution. To read the solution at a point at a specific time, we would need infinite precision? The Pour-El and Richards results typically show that the solution at a particular point is not a computable real number. But physical measurements are finite precision. The paper does not address whether the non-computability manifests in a finite-precision measurement.

  - **Step 3**: The wave equation is a linear PDE and the result is proven for the exact solution. Physical systems are subject to noise and imprecision. The paper does not address robustness.

  - **Step 6**: The significance is questionable because the non-computability is at a single point and might not be measurable. Moreover, the BP-CTT is about simulation: can we simulate the entire system? The paper only shows that the exact value at a point is non-computable, but a simulation might still approximate the solution arbitrarily well (which is what BP-CTT requires). Pour-El and Richards results do not show that the entire solution is non-computable in the sense that we cannot compute approximations to the solution at every point. In fact, for the wave equation, we can compute approximations.

  - **Verification**: The Pour-El and Richards result for the wave equation is known. The wave equation in 3D is computable in the sense that the solution can be approximated arbitrarily well for any fixed time (if the initial data are computable and of a certain class). The non-computability is only for the solution at a point at a specific time. This does not refute BP-CTT because BP-CTT requires simulation to arbitrary precision, which is still possible (we can compute the solution at any point to any desired precision, but the precision might depend on the point and time). The paper's claim is overreaching.

  - **Verdict**: **Desk reject**.

  - **Justification to Author**: "The paper observes that the three-dimensional wave equation can have computable initial data that lead to a solution which is non-computable at a specific point and time. However, this does not refute the bold physical Church-Turing thesis (BP-CTT) because BP-CTT asserts that any physical process can be simulated to arbitrary precision by a Turing machine. The result you cite does not show that the entire solution is non-computable; in fact, the solution can be approximated arbitrarily well at any point and time. The non-computability is only for the exact value at a specific point and time, which is not physically meaningful because physical measurements are finite precision. Moreover, the physical wave equation is subject to noise and imprecision, and your model does not address robustness."

  - **Judgment Calls**: The interpretation of BP-CTT is that it requires approximation of the entire process, not exact values at points. This is a judgment call but one based on standard understanding.

  ## Which one will the procedure handle badly?

  The second submission (Malament-Hogarth) is the one that might cause trouble. The procedure does not desk reject it because it passes Steps 0, 1, 2, 4, 5. Step 3 is a concern but not a show-stopper for a theoretical physics paper. We escalate to a specialist, but the relativist might be very reluctant and the review might take six months. Moreover, the specialist might say that the scenario is physically impossible (due to instability or quantum gravity) but that requires detailed analysis. The procedure might be too lenient because we don't have a check for "requires unphysical conditions" that is strong enough for desk rejection. We rely on the specialist.

  To mitigate, we could add a check for known physical impossibilities (e.g., violating energy conditions) but that requires expertise. For a non-specialist referee, it is hard. So the procedure correctly escalates, but the cost is high.

  ## Conclusion

  The procedure is designed to be efficient and to catch common flaws. It is derived from the conceptual distinctions of the CTT variants and the typical pitfalls. It should be used with the understanding that some steps (like Step 6) are judgment calls and that escalation might be necessary for submissions that pass the initial checks but require deep expertise.
answer: |-
  ### Taxonomy of Church-Turing Theses  
  The term "Church-Turing thesis" (CTT) conflates four distinct claims, differing in scope, epistemic status, and vulnerability to refutation. A submission must be pinned to one to avoid category errors.  

  1. **Mathematical CTT (M-CTT)**:  
     - **Claim**: Every effectively calculable function (computable by a human following an algorithm without insight) is Turing-computable.  
     - **Status**: A conceptual stipulation defining "effective calculability." Not empirically testable; evidence against it would require redefining "algorithm" itself (e.g., a procedure accepted as mechanical yet escaping Turing machines).  
     - **Refutation barrier**: Effectively impossible; disagreements dissolve into terminological debates.  

  2. **Modest Physical CTT (MP-CTT)**:  
     - **Claim**: Any function computed by a physical device *used as a computing instrument* (e.g., a computer engineered for calculation) is Turing-computable.  
     - **Status**: An empirical claim, but constrained by human design. Evidence against it requires a physical computer outputting a non-Turing-computable function (e.g., solving the halting problem).  
     - **Refutation barrier**: Vulnerable to idealized devices (e.g., noise-free analog systems), but robustness checks apply.  

  3. **Bold Physical CTT (BP-CTT)**:  
     - **Claim**: Any physical process (even unintended for computation) can be simulated to arbitrary precision by a Turing machine.  
     - **Status**: A strong empirical conjecture about the universe. Evidence against it requires a physical process encoding a non-Turing-computable function (e.g., a dynamical system evolving to solve the halting problem).  
     - **Refutation barrier**: Hostage to idealizations (e.g., infinite precision, zero noise) and physical plausibility.  

  4. **Complexity-Theoretic CTT (C-CTT)**:  
     - **Claim**: Any physically computable function is computable in polynomial time (P captures feasible computation).  
     - **Status**: An empirical conjecture about efficiency (the "Extended" CTT). Evidence against it requires a physical device solving an NP-hard problem in polynomial time.  
     - **Refutation barrier**: Often conflated with computability; irrelevant to M/MP/BP-CTT.  

  ### First-Pass Decision Procedure  
  **Instructions**: Run checks in order. If any check fails, terminate with the indicated outcome. Document justifications verbatim for authors. Judgment calls (J) require referee discretion; flag them explicitly.  

  #### **Step 0: Classify the CTT Variant**  
  - **Check**: Which thesis is targeted?  
    - M-CTT: Author claims a non-algorithmic human procedure.  
    - MP-CTT: Author claims a physical computer computes a non-Turing-computable function.  
    - BP-CTT: Author claims a natural physical process is non-simulable.  
    - C-CTT: Author claims a super-polynomial speedup.  
  - **Failure**: Unclear or conflated variants.  
  - **Outcome**: Desk reject.  
  - **Justification**: "The submission does not specify which version of the Church-Turing thesis it challenges. Please revise to clarify whether the claim concerns mathematical effective calculability, physical computing devices, universal physical simulability, or computational complexity."  

  #### **Step 1: Input/Initialization Smuggling**  
  - **Check**: Is the non-computability sourced in the input, initial conditions, or parameters (e.g., a real number encoding the halting problem), rather than generated by the system’s dynamics?  
  - **Why**: Non-computability must arise from evolution, not presupposition.  
  - **Failure**: Yes.  
  - **Outcome**: Desk reject.  
  - **Justification**: "The system’s non-computable output depends on a non-computable input or parameter. This does not demonstrate computation of a non-Turing-computable function; it merely transfers existing non-computability. The Church-Turing thesis governs what can be computed, not what can be given."  
  - **J**: None; this is mechanical.  

  #### **Step 2: Finite Time and Precision**  
  - **Check**: Can an ordinary observer access the claimed output in finite time with finite precision?  
    - Reject if output requires:  
      - Infinite time (e.g., asymptotic behavior only).  
      - Infinite precision (e.g., exact real numbers).  
  - **Why**: Physical measurements are finite; inaccessible outputs are not computational.  
  - **Failure**: No.  
  - **Outcome**: Desk reject.  
  - **Justification**: "The claimed output is not physically accessible, as it requires infinite time or infinite precision to observe. The Church-Turing thesis concerns physically realizable computation, which necessitates finite-time observation with finite precision."  
  - **J**: None; "ordinary observer" implies standard measurement limits.  

  #### **Step 3: Robustness to Perturbation and Noise**  
  - **Check**: Does the model account for noise, error, or perturbation? Or does it rely on exact real arithmetic?  
  - **Why**: Idealized models (e.g., real-number machines) may not reflect physical reality.  
  - **Failure**: No robustness analysis, and claim depends critically on idealizations.  
  - **Outcome**: Reject with invitation to restate/resubmit.  
  - **Justification**: "The result assumes idealized conditions (e.g., zero noise, exact real numbers) without demonstrating robustness under physical perturbations. Please resubmit with an analysis of how noise affects the claimed non-computability or clarify that the claim pertains only to an idealized model."  
  - **J**: Assessing "critical dependence" requires judgment; e.g., a small perturbation destroying the output suggests fragility.  

  #### **Step 4: Computability vs. Complexity**  
  - **Check**: Is the claim about computability (Turing-computability) or efficiency (polynomial time)?  
  - **Why**: Speedups do not refute M/MP/BP-CTT.  
  - **Failure**: Claim is solely about speed (e.g., "exponential speedup refutes CTT").  
  - **Outcome**: Desk reject.  
  - **Justification**: "The submission establishes only a computational speedup, not non-Turing-computability. The Church-Turing thesis concerns what is computable, not efficiency. Speedups challenge the Extended Church-Turing thesis (complexity), which is distinct."  
  - **J**: None; conflation is unambiguous.  

  #### **Step 5: Model Confusion (BSS/Real-RAM)**  
  - **Check**: Does the author use "computable" in a non-Turing sense (e.g., BSS or real-RAM models) while claiming to refute CTT?  
  - **Why**: CTT is defined for Turing-computability; other models are irrelevant.  
  - **Failure**: Yes, without noting the divergence.  
  - **Outcome**: Desk reject.  
  - **Justification**: "The argument relies on a model of computation (e.g., real numbers as primitives) that is not equivalent to Turing machines. The Church-Turing thesis concerns Turing-computability; results in alternative models do not bear on it."  
  - **J**: None; model usage is explicit.  

  #### **Step 6: Significance and Plausibility**  
  - **Check**: If the argument succeeded, would it matter?  
    - Consider:  
      - Is the scenario physically plausible (e.g., no Planck-scale violations)?  
      - Does it target M-CTT (trivial, as M-CTT is definitional)?  
      - Is the non-computable function significant (e.g., halting problem)?  
  - **Failure**: Physically implausible or targets M-CTT.  
  - **Outcome**: Desk reject.  
  - **Justification**: "The scenario is not physically plausible [specify reason, e.g., requires infinite energy] and thus cannot challenge the physical Church-Turing theses." OR "The mathematical CTT is a definition of effective calculability; it cannot be 'refuted' by physical or non-algorithmic arguments."  
  - **J**: "Physical plausibility" is a judgment call (e.g., is a Malament-Hogarth spacetime "plausible"?).  

  #### **Step 7: Escalation or Review**  
  - **Passed Steps 0–6?** Proceed:  
    - **Ordinary review**: Argument is clear, significant, and targets MP/BP-CTT with physical realism.  
    - **Escalation to specialist**: Highly technical (e.g., general relativity, quantum field theory) or disputes foundational assumptions.  
  - **Brief for specialist**: One page, specifying:  
    - Which CTT variant is targeted.  
    - The precise claim (e.g., "observer decides halting problem in Malament-Hogarth spacetime").  
    - What to adjudicate (e.g., "Assess physical realizability under perturbation").  

  ---  
  ### Dismissals Referees Must Avoid  
  - **Infinite precision storage**: Do not claim "no physical system stores infinite precision." This assumes physical discreteness, which is contested (BP-CTT implies continuity). Use Step 2 (accessibility) instead.  
  - **"CTT is proven"**: Do not assert CTT is unassailable; it is a thesis, not a theorem.  
  - **"Analog computers are bounded"**: Do not generalize; analog systems require case-by-case analysis (Steps 1–3).  

  ---  
  ### Application to Submissions  

  #### **Submission 1: Analog Circuit for Chaitin's Ω**  
  - **Step 0**: Targets MP/BP-CTT (physical device).  
  - **Step 1**: **Failure**. Non-computability is in the physical parameter (e.g., resistor value), not dynamics.  
  - **Verdict**: Desk reject.  
  - **Justification**: "The non-computable value (Chaitin's Ω) is set by a physical parameter, not computed by the circuit. This presupposes non-computability rather than generating it, failing to challenge the Church-Turing thesis."  
  - **J**: None.  

  #### **Submission 2: Malament-Hogarth Spacetime**  
  - **Step 0**: Targets BP-CTT (physical process in GR).  
  - **Step 1**: Pass (dynamics: infinite computation in finite proper time).  
  - **Step 2**: Pass (observer receives 1-bit answer in finite time).  
  - **Step 3**: **Failure**. No robustness to noise/perturbation; assumes exact GR.  
  - **Verdict**: Reject with invitation to restate/resubmit.  
  - **Justification**: "The analysis assumes idealized general relativity without addressing stability under perturbation, quantum effects, or measurement noise. Please resubmit with a robustness analysis or clarify that the claim is limited to an exact GR framework."  
  - **J**: Step 3 judgment (robustness critical for physical claims).  

  #### **Submission 3: Quantum Computing Refutation**  
  - **Step 0**: Abstract targets MP/BP-CTT; body addresses C-CTT.  
  - **Step 4**: **Failure**. Claims "CTT refuted" but only shows polynomial-speed separation.  
  - **Verdict**: Desk reject.  
  - **Justification**: "The body establishes only a polynomial-time speedup, which does not challenge computability (the domain of the Church-Turing thesis) but complexity (the Extended CTT). Please resubmit with revised claims focused on efficiency."  
  - **J**: None.  

  #### **Submission 4: Wave Equation Non-Computability**  
  - **Step 0**: Targets BP-CTT (physical process).  
  - **Step 1**: Pass (non-computability from dynamics).  
  - **Step 2**: **Failure**. Output (solution at a point) requires infinite precision.  
  - **Verdict**: Desk reject.  
  - **Justification**: "The non-computability manifests only at exact points in spacetime, requiring infinite precision to observe. Physical measurements are finite-precision; thus, the result does not challenge the bold physical CTT, which concerns simulability to arbitrary precision."  
  - **J**: Step 2 judgment (finite-precision access is implied but not proven).  

  ---  
  ### Limitation: The Malament-Hogarth Case  
  The procedure handles **Submission 2 poorly**. It passes all mechanical checks (Steps 0–2) but stumbles on Step 3 (robustness), leading to a resubmit invitation. However, the idealized GR mathematics may be *correct*, and forcing "robustness" risks dismissing a valid BP-CTT challenge prematurely. Escalation would be wiser, but the procedure reserves escalation for submissions passing *all* checks. This could cost months of specialist time and goodwill, as predicted.  

  **Why?** The procedure cannot internally resolve whether BP-CTT permits idealizations (e.g., is "exact GR" physically plausible?). It errs conservatively by demanding robustness, but this may exclude legitimate theoretical physics. A fix would require integrating a "known-physics" check (e.g., "Does this violate quantum mechanics or energy conditions?"), but this demands specialist knowledge, violating the 45-minute constraint.  

  ---  
  ### Final Notes  
  - **What the procedure cannot decide**:  
    - Whether BP-CTT is genuinely empirical (it may be unfalsifiable if idealized systems are excluded).  
    - Whether "computable" usage is consistent (e.g., BSS vs. Turing).  
    - Significance of "unphysical" systems (e.g., Malament-Hogarth).  
  - **Advice**: For borderline BP-CTT cases (e.g., Submission 2), override Step 6 to escalate if mathematics is flawless. The cost is unavoidable.  

  This procedure streamlines triage, but ultimate judgments (e.g., physical plausibility) require expertise. Use it as a shield against common errors, not a substitute for engagement.
