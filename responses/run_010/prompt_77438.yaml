answer: |-
  Here is a restatement of the moral equality argument within your specified LOAC vocabulary, followed by a residue report analyzing its compatibility with legal categories:

  **Restatement in LOAC Vocabulary:**

  1.  **Traditionalist Position:** All individuals qualifying as **combatants** under the law of armed conflict (LOAC) possess **combatant's privilege**, granting equal permission to engage in hostilities and equal liability to be targeted with lethal force. This privilege and liability persist regardless of whether their state's **resort to force** was lawful (jus ad bellum). Consequently, killing a combatant adhering to **distinction**, **military necessity**, **proportionality**, and **feasible precautions** does not constitute a violation of LOAC, even if their state initiated an unlawful war. Their **prisoner-of-war protections** upon becoming **hors de combat** are absolute and equal. This equality stems either from a collective agreement among states codified in LOAC or from the inherent **epistemic limits** combatants face regarding the ultimate justice of their state's cause, making individual moral assessment of the war's legality infeasible.

  2.  **Revisionist Position:** **Combatant status** and the **combatant's privilege** conferred by LOAC do not automatically create moral permission to kill or moral liability to be killed. Moral liability to lethal force (**direct participation in hostilities** morally speaking) tracks individual moral responsibility for posing an *unjust* threat. Combatants fighting for a state engaged in an unlawful **resort to force** therefore pose an unjust threat. Killing such combatants, even while they adhere to **distinction**, **military necessity**, **proportionality**, and **feasible precautions**, lacks moral justification and is morally equivalent to murder. Combatants fighting for the just side possess a moral permission to use force defensively against these unjust threats. However, due to pervasive **epistemic limits** (fog of war, difficulty assessing jus ad bellum), even just combatants can rarely be sufficiently confident an opposing combatant is morally liable to be killed to justify lethal force under strict moral scrutiny.

  **Residue Report: Mapping Claims to Legal Categories**

  | Philosophical Claim                     | Translation Status         | Analysis of Translation/Residue                                                                                                                               |
  | :-------------------------------------- | :------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **TRADITIONALIST CLAIMS**               |                            |                                                                                                                                                               |
  | Combatants on both sides possess equal combatant's privilege & liability to lethal force under LOAC. | **Clean Translation**      | This *is* the core **equal-application rule** of LOAC regarding conduct in hostilities (jus in bello).                                                          |
  | Killing a combatant adhering to IHL rules is legally permissible regardless of jus ad bellum. | **Clean Translation**      | Embodied in the **combatant's privilege** and the separation of jus ad bellum and jus in bello.                                                                |
  | PoW protections apply equally to all qualifying combatants hors de combat. | **Clean Translation**      | Core principle of GCIII; explicit legal rule.                                                                                                                 |
  | Equality rests on a collective agreement among states. | **Distorted Translation / Residue** | *Distortion:* LOAC's sources (treaty, custom) reflect state consent/agreement, but the law's *binding force* for individuals (privilege/liability) isn't framed as an *agreement* soldiers join. The legal norm exists independently; a soldier's privilege/liability flows from status under law, not personal assent to a pact. **Residue:** The philosophical *basis* (collective agreement) isn't a legal category; the law's existence is simply presupposed. |
  | Equality rests on soldiers' epistemic limits re: jus ad bellum. | **Distorted Translation / Residue** | *Distortion:* While **epistemic limits** (fog of war) are central to rules like **distinction** (affecting who *can* be targeted) and **feasible precautions**, they are **not** the legal *reason* for equal privilege/liability. LOAC assigns status/liability *objectively* based on function/conduct, *irrespective* of the individual soldier's knowledge or belief about the war's justice. The epistemic argument explains *why* the law is structured this way, but isn't itself a legal rule. |
  | **REVISIONIST CLAIMS**                  |                            |                                                                                                                                                               |
  | Moral liability to lethal force tracks moral responsibility for posing an *unjust* threat. | **No Expression**          | LOAC has no concept of "moral liability" or "unjust threat" tied to jus ad bellum. Liability under LOAC is based solely on **combatant status**/**direct participation in hostilities** and adherence/violation of jus in bello rules. This claim is fundamentally external to the legal categories. |
  | Killing combatants serving an unlawful war (even IHL-compliant) is morally equivalent to murder. | **Distorted Translation / Residue** | **(a)** *Distortion:* Framing this *solely* as a denial of the **equal-application rule** is incomplete. It *does* entail rejecting the moral validity of that rule's core consequence. However, it imports an entirely foreign concept: **moral equivalence to murder based on jus ad bellum status**. LOAC deliberately **cannot formulate** this. Murder is a domestic law/criminal concept requiring specific intent and context; LOAC killings by combatants are governed by a separate, status-based regime that explicitly *precludes* this equivalence by design. |
  | Combatants serving a just cause have moral permission to kill opposing combatants serving an unjust cause. | **No Expression**          | LOAC grants **combatant's privilege** based on status, not the justice of the cause. Moral permission based on jus ad bellum is irrelevant to the legal permission. |
  | Due to epistemic limits, just combatants can rarely be confident enough of an opponent's moral liability to kill him. | **Residue (Partial Fit)** | **(c)** *Analysis:* LOAC operational constraints (**distinction**, **feasible precautions**) *do* heavily incorporate **epistemic limits** regarding **identification of status** (combatant vs. civilian) and **minimizing civilian harm**. **However,** they **do not** incorporate epistemic limits regarding the *moral liability based on jus ad bellum*. The legal constraint is always: "Is this person a combatant/DPH?" or "Will this attack be disproportionate?" *Never* "Am I sufficiently certain this combatant is serving an unjust war to be morally liable?" The revisionist's *moral* uncertainty has **no home** within LOAC's operational constraints, which operate within the framework of equal status and liability. |

  **Conclusions on the Residue:**

  1.  **Fundamental Disconnect:** The core revisionist claim concerning moral liability tied to jus ad bellum and the traditionalist appeal to collective agreement or epistemic limits *as the basis for equal liability* **have no direct expression and resist clean translation** into LOAC categories. The law operates on a fundamentally different plane: **status-based liability and the strict separation of jus ad bellum from jus in bello**.
  2.  **Law's Deliberate Bracket:** The residue strongly indicates that **LOAC is deliberately impoverished regarding the justice of the cause (jus ad bellum) for institutional and functional reasons it can defend.** This bracketing is not an oversight but the cornerstone of the system:
      *   **Feasibility & Uniformity:** Applying individualized moral liability based on contested jus ad bellum assessments is operationally impossible for soldiers and commanders in the fog of war. LOAC prioritizes clear, objective, status-based rules applicable to all parties to maximize compliance and protect victims.
      *   **Humanitarian Focus:** By separating jus in bello, LOAC aims to mitigate suffering *within* armed conflicts regardless of their origins, focusing on protecting civilians, prisoners, and the wounded/sick.
      *   **Maintaining a Rule-Based Order:** The separation upholds the possibility of regulating wartime conduct even amid profound disagreement over the war's legitimacy. Undermining combatant equality risks collapsing the entire jus in bello framework.
  3.  **Different Objects:** While both camps discuss killing in war, they are ultimately **addressing different objects:**
      *   **LOAC (and its philosophical defenders - Traditionalists):** Addresses the *legal and functional rules* governing the conduct of hostilities *within* an armed conflict, prioritizing feasibility, uniformity, and humanitarian protection on the ground.
      *   **Revisionist Philosophy:** Addresses the *deep moral justification* for killing individual human beings, seeking principles grounded in individual rights and responsibility, largely abstracted from the institutional and operational realities that shape LOAC.

  The residue highlights that LOAC's structure is a pragmatic, institutional solution to the problem of regulating organized violence between collectives, deliberately setting aside the fraught question of the war's ultimate justice to achieve its humanitarian and regulatory goals. The revisionist critique operates at the level of fundamental individual morality, a level the law intentionally does not (and arguably cannot, while remaining functional) reach in its operational rules.
