prompt: |-
  I cover science and ideas for a general-interest magazine, and I am midway through a long feature about a habit of argument in contemporary cosmology that I can describe but cannot label: theories being set aside, or propped up, without any new data entering the picture. My editor has insisted, reasonably, that I get the terminology right before I file, and this is where I have stalled. I would like you to answer as a philosopher of science who also has a genuine working knowledge of the anthropic-reasoning literature and of how cosmologists actually argue with one another; assume I am well read generally but have no graduate training in physics or in formal epistemology, and please think the problem through carefully rather than reaching for the first piece of jargon that comes to hand.

  Here is the pattern, in my own words, with the three instances that made me think it was one pattern rather than three. First, the case that started it: a cosmological model agrees with everything anyone can point an instrument at — the expansion history, the primordial abundances, the structure in the microwave sky — and nobody has located a discrepancy. Yet the model implies that, given enough time, empty space will throw up fleeting, self-aware fluctuations in unimaginable numbers, each momentary and confused, and that these will vastly outnumber the long-lived, law-abiding observers who evolved on planets. So the model is declared pathological and people start hunting for a way to rule it out. The reasoning is not that it mispredicted something; it is that if it were true, beings having experiences like ours would be freakish, and since we have experiences like ours, it is probably false. Second, running in the opposite direction: a hypothesis that posits enormously more universe than observation requires — infinitely many regions, endlessly repeated histories — seems to earn support from nothing but the fact that more universe means more chances for someone like me to be around asking questions, and the standing complaint about that move is that it lets an armchair argument settle something no telescope can settle. Third, the pattern appears to travel outside physics entirely: a view about where our moral intuitions come from is not contradicted by any moral observation we could make, and yet people argue against it on the grounds that if it were true, those intuitions would be the by-product of a process that was not tracking anything, so we would have no reason to trust the very intuitions that recommend the view. When I have described this to people, the only phrase I get back is something about observation selection effects, which seems to cover everything and therefore nothing.

  So: does the general move have an established name? I am aware that the physics version of my first instance has its own vivid nickname, and that is not what I am after — I want whatever concept, if any, covers the family in which a hypothesis is confirmed or disconfirmed not by its fit to observable data but by the size and shape of the population of observers it implies, together with a standing assumption that we are a fair sample drawn from that population. Concretely, I would like you to begin by brainstorming candidate terms and concepts and setting them out briefly, then evaluate each against my description before committing to an answer; for every near neighbour, say precisely how what I have described differs from it and which of them fits best; and if nothing fits exactly, coin a term, define it, and give me its edges — tell me where this stops being the phenomenon and becomes ordinary falsification, where it is the Duhem–Quine problem in costume, where it is really an argument about the reliability of my faculties rather than about observer counts, and whether my first and second instances are the same move or two different moves sharing a premise. I would also like to know what the move presupposes — a typicality assumption, a choice of reference class, a measure over observers — and whether that presupposition is defensible or covertly question-begging, since my piece has to tell readers whether cosmologists are entitled to argue this way at all. Two housekeeping requests. I am not looking for a bibliography or a reading list, only the concepts and their boundaries. And where a label is your own coinage rather than settled usage in the field, flag that explicitly and separately: I would much rather write that philosophers have no agreed word for this than invent one in print and attribute it to a literature that never used it.
reasoning: |-
  Okay, the user is a science journalist working on a feature about a specific argumentative pattern in cosmology and beyond. They need precise terminology for a phenomenon where theories are accepted or rejected based on observer populations rather than new data, and they want a philosopher of science's perspective. 

  The core challenge is naming this meta-empirical reasoning that uses observer statistics to judge theories without direct evidence. The user has three clear examples: Boltzmann brains (disconfirmation via freakish observers), multiverse fine-tuning (confirmation via abundant observers), and moral intuition evolution (disconfirmation via unreliable origins). 

  First, I should map existing concepts. "Observation selection effects" is too broad – it's about data limitations, not theory evaluation. "Anthropic principle" is closer but conflates weak (descriptive) and strong (explanatory) versions, missing the probabilistic core here. "Self-locating uncertainty" addresses location but not theory comparison. "Likelihoodism" fits the probability focus but ignores the observer-classification problem. 

  The deepest fit is "observer-centric Bayesian model comparison" – it captures the probabilistic machinery (Bayes), the role of observers (observer-centric), and the comparison aspect. But it's jargon-heavy. For the pattern itself, "demographic theory appraisal" or "observational consequence-shaping" might work, though they're neologisms. 

  Crucially, all three examples share the same structure: 
  1. A theory implies an observer population distribution 
  2. We assume we're typical observers 
  3. The theory is judged by whether our existence is probable/atypical under that distribution 

  The presuppositions are thorny: typicality assumptions are untestable, reference classes are arbitrary (are we "observers" or "evolved observers"?), and measures over infinite populations are mathematically dubious. This makes the move philosophically contentious – cosmologists might be overstepping. 

  For the user's piece, I'll recommend: 
  - Use "observer-centric probabilistic reasoning" as the descriptive term 
  - Flag that the first two physics cases are symmetric applications (disconfirmation vs confirmation) 
  - Note that the moral case extends the logic beyond physics 
  - Explicitly state the typicality presupposition as the key vulnerability 

  The takeaway: this isn't fraud or bad science, but a high-stakes gamble on untestable assumptions. The user should present it as cosmologists' creative response to empirical stagnation, while noting the philosophical pushback.
answer: |-
  Based on your detailed description and the need for precise conceptual mapping, here's a systematic breakdown of the phenomenon, candidate terms, evaluation, and boundaries:

  ---

  ### **Core Phenomenon Defined**
  **Pattern:** Evaluating a theory's plausibility based on the *implied demographic distribution of observers/experiencers* it predicts, rather than direct empirical mismatch. Key elements:
  1.  **Probability Focus:** Assesses how *likely* or *typical* our specific existence/observations are within the theory's predicted ensemble of observers/experiences.
  2.  **Typicality Assumption:** We are a *fair sample* of the observers relevant to our evidence (e.g., "observers with experiences like ours").
  3.  **Demographic Consequence:** The theory is disfavored if it implies observers like us are extremely rare ("freakish"), or favored if it implies we are common/non-exceptional.
  4.  **Data-Independent:** Occurs *without* new contradictory empirical data; leverages the *structure* of the theory itself and our location within it.

  ---

  ### **Candidate Terms & Evaluation**

  1.  **Observation Selection Effect (OSE):**
      *   **Evaluation:** *Too broad* and *descriptive*, not *evaluative*. OSEs describe biases in what *can* be observed (e.g., we can only observe life-permitting regions). Your pattern *uses* OSEs as a *premise* (we must condition on our existence) but goes further to make a *probabilistic argument* about theory viability based on the *distribution* implied by the OSE under the theory. Fits the *mechanism* but not the *argumentative purpose*.

  2.  **Anthropic Reasoning:**
      *   **Evaluation:** *Close, but ambiguous*. Often used loosely for any argument involving observers. Crucially, it encompasses both:
          *   **Weak Anthropic Principle (WAP):** Descriptive (we must observe conditions allowing observers). Fits the conditioning premise.
          *   **Strong Anthropic Principle (SAP):** Explanatory/Teleological (the universe *must* allow observers). *Not* what you describe.
      *   **Verdict:** Insufficiently precise. Your pattern is a specific *application* of anthropic reasoning (conditioning + typicality) for theory *comparison/evaluation*, not just description or teleology. "Anthropic" also doesn't capture non-biological cases (moral intuitions).

  3.  **Self-Locating Uncertainty / Indexical Reasoning:**
      *   **Evaluation:** Focuses on uncertainty about *where/when/who* we are within a theory's structure (e.g., "Which galaxy am I in?"). This is a *component* of your pattern (we reason from our specific observation *type*). However, your pattern uses this uncertainty to judge the *theory itself* ("Is this theory likely *given* that I observe X?"), not just to locate oneself. *Necessary but not sufficient*.

  4.  **Likelihood Principle / Bayesian Model Comparison (Anthropic Variant):**
      *   **Evaluation:** *Conceptually closest core framework*. The pattern fits Bayesian reasoning:
          *   **Likelihood Comparison:** Favors theory T1 over T2 if T1 assigns higher *probability* to the observation "we exist and have experiences E" than T2 does.
          *   **Prior + Likelihood:** The "demographic consequence" directly affects the *likelihood term* P(We exist w/ E | T).
      *   **Verdict:** This is the *underlying probabilistic machinery*. However, it lacks a specific name for the *unique aspect*: the likelihood depends critically on the theory's *observer/experiencer population distribution* and the *typicality assumption* applied to it.

  5.  **Typicality Principle / Mediocrity Principle:**
      *   **Evaluation:** Directly names the key *presupposition* ("we are typical observers/experiencers within the reference class defined by our evidence"). This is the *engine* driving the demographic consequence. However, it names the *assumption*, not the *argumentative move* built upon it.

  ---

  ### **The Best Fit & Proposed Terminology**

  *   **There is no single, universally established term** for this *specific* pattern of argument within philosophy of science or cosmology. The vivid nickname ("Boltzmann Brains") is instance-specific, not general.
  *   **The most precise existing framework is Bayesian model comparison incorporating observer demographics via the typicality principle.**
  *   **Proposed Descriptive Label (My Coinage - Flagged):** **Observer-Centric Probabilistic Theory Assessment (OCPTA)** or **Demographic Theory Appraisal**.
  *   **Core Definition of OCPTA:** The practice of evaluating the plausibility of a scientific theory based on the estimated *probability it assigns to the existence of observers/experiencers matching our specific type* (conditioned on our existence), where this probability is derived from the theory's predicted *distribution of observers/experiencers* and an assumption of our *typicality* within a defined reference class relevant to the evidence.

  ---

  ### **Boundaries & Distinctions**

  1.  **vs. Ordinary Falsification:**
      *   **Ordinary Falsification:** Theory T predicts observable outcome O. We observe ~O. T is falsified.
      *   **OCPTA:** Theory T *does not* predict ~O (it may predict O perfectly!). Instead, T implies that observers *like us* (having O-like experiences) are *extremely rare/untypical* within the total set of observers/experiences it predicts. We argue that if T were true, our existence *would be improbable*, hence T is implausible. *No direct empirical conflict, only a probabilistic conflict arising from our location/type.*

  2.  **vs. Duhem-Quine Problem:**
      *   **D-Q:** When a test fails, it's unclear which part of the complex web of beliefs (theory, auxiliary hypotheses, instrumentation) is wrong. Holism of confirmation.
      *   **OCPTA:** *Not* about ambiguity in assigning blame after a failed prediction. It's a *positive argument* made *without* a failed prediction. Its challenge is the *justification* of the typicality assumption and the measurability of observer populations, not holism under test failure.

  3.  **vs. Argument about Faculty Reliability (e.g., Evolutionary Debunking):**
      *   **Your Third Instance (Moral Intuitions):** This *is* a valid instance of OCPTA. The "observers" are beings with moral intuitions. The theory (e.g., moral intuitions are non-truth-tracking byproducts) implies that within the set of beings *having moral intuitions*, those with *reliable/truth-tracking* intuitions are extremely rare or non-existent. We argue our intuitions *seem* reliable, making the theory implausible. The *target* is the theory's implication about the *distribution of intuition-reliability*, not directly an argument against our faculties *now*. The faculty reliability doubt is the *consequence* of accepting the theory, used to argue *against* it.

  4.  **First vs. Second Instance: Same Move, Different Direction:**
      *   **Same Core Logic:** Both use the probability of observers like us (given the theory + typicality) to assess the theory.
      *   **First (Boltzmann Brains):** Disconfirmation. Theory implies P(Observer like us | T) is *extremely low*. Low likelihood -> low posterior plausibility.
      *   **Second (Multiverse Fine-Tuning):** Confirmation (of a sort). Theory (Multiverse + physical laws) implies P(Observer like us | T) is *much higher* than under a single-universe theory with "fine-tuned" laws. Higher likelihood -> higher posterior plausibility (compared to alternatives). Both rely on the same typicality/observer-counting logic.

  ---

  ### **Presuppositions & Critiques**

  1.  **Essential Presuppositions:**
      *   **The Typicality Principle:** We are not special or privileged observers within the relevant reference class defined by our evidence. *Highly contentious.* Justification is often circular (we assume it to reason about the universe) or based on Copernican intuitions lacking empirical force in exotic domains.
      *   **Definable Reference Class:** What counts as an "observer like us"? Evolved biological entities? Any self-aware information processor? Beings experiencing qualia? Beings capable of doing cosmology? The choice dramatically alters the probabilities. *Deeply arbitrary and unresolved.*
      *   **A Measure Problem:** For theories predicting infinite/indefinite ensembles (multiverses, eternal inflation, Poincaré recurrences), *counting* observers is ill-defined. How do we define a probability measure over infinite sets? *A major technical and philosophical hurdle.*
      *   **Meaningful Probabilities:** Can we assign coherent probabilities to entire cosmologies or vast metaphysical structures? Frequentist interpretations fail; subjective Bayesianism faces challenges of prior justification.

  2.  **Is it Defensible?**
      *   **Proponents Argue:** It's the *only* way to reason about theories making predictions *solely* about unobservable global structures or ensembles. When empirical data is exhausted or impossible, probabilistic reasoning based on our location is better than nothing. It can rule out theories that are empirically adequate but metaphysically absurd (Boltzmann Brains).
      *   **Critics Argue:** The presuppositions (especially typicality in infinite/ill-defined ensembles) are unjustifiable or lead to absurdities. It risks being unfalsifiable ("just add more universe!"). The measure problem renders probabilities meaningless. It conflates *explanation* with *accommodation* in dangerous ways. It's fundamentally *meta-empirical* and potentially unscientific.

  ---

  ### **Recommendation for Your Feature**

  1.  **Label:** Acknowledge there's no perfect established term. Use the descriptive phrase: **"probabilistic reasoning based on observer demographics"** or **"observer-centric likelihood arguments"**. You can introduce **"demographic theory appraisal"** as a clarifying conceptual label (explicitly noting it's a descriptive coinage for the article).
  2.  **Explain:** Emphasize the core: arguments turning on *how likely a theory says we are to exist as the observers we are*, not on direct empirical conflict. The key inputs are the theory's predicted *population of observers/experiences* and the *assumption of our typicality*.
  3.  **Unify:** Explicitly state that your three instances are manifestations of the *same* logical pattern (observer demographics + typicality -> theory plausibility), applied to disconfirmation (Boltzmann), confirmation (Multiverse), and non-physical domains (Morality).
  4.  **Critique:** Highlight the core presupposition – the **Typicality Principle** – and the **Reference Class Problem** as the major points of contention. Conclude that while cosmologists see it as a necessary tool for extreme theories, its philosophical foundations are hotly debated and inherently less secure than empirical testing. Frame it as a fascinating, high-stakes gamble in reasoning at the limits of science.
