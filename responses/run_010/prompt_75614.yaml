  Below is a diagnostic instrument designed to sort students based on their responses to concrete cases, mapping onto the logical space of early Chinese thought on moral development. The instrument avoids direct questions about "good," "bad," "mixed," or "indifferent" nature and uses no thinker names or specialized vocabulary. It prioritizes your specified branch axes and includes all required leaves, with empty cells and limitations flagged. The instrument is structured for a 30-minute session: 10 items with brief situations and 2–3 answer options each, followed by a scoring key.

  ---

  ### **Branch Axes (in order of splitting)**
  1. **What constitutes human nature?**  
     - Branch A: Everything one is born with and cannot help (e.g., impulses, desires).  
     - Branch B: The characteristic direction a human develops under favorable conditions (e.g., inherent potential for growth).  
     - Branch C: Raw capacity with no direction (e.g., undifferentiated potential, like a blank slate).  

  2. **Is the material for virtue present at birth?**  
     - Branch A: Yes, already present (e.g., innate tendencies).  
     - Branch B: No, must be brought in from outside (e.g., through teaching).  

  3. **What is the method of cultivation?**  
     - Branch A: Extends and nourishes what is there (e.g., tending a plant).  
     - Branch B: Restrains and remakes it (e.g., straightening warped wood).  

  4. **What causes wrongdoing?**  
     - Branch A: Default outcome without intervention (e.g., natural drift without guidance).  
     - Branch B: Loss or corruption of something originally present (e.g., degradation of an initial state).  

  5. **How do norms/rituals originate?**  
     - Branch A: Discovered pattern already in things (e.g., finding grain in wood).  
     - Branch B: Invented artifact (e.g., potter making a vessel).  

  6. **Why do people differ morally?**  
     - Branch A: One shared nature, differently nourished (e.g., environment/effort explains differences).  
     - Branch B: Genuinely different kinds of nature (e.g., inborn types).  

  *Additional axis for comprehensiveness*:  
  7. **Is spontaneity reliable?**  
     - Branch A: Yes, spontaneity leads to good outcomes without cultivation.  
     - Branch B: No, spontaneity is unreliable and requires shaping.  
     *Rationale*: Needed to distinguish views like the subtraction view (spontaneity adequate) from others (spontaneity inadequate). Without it, the subtraction view conflates with sprout views on key items.

  ---

  ### **Diagnostic Items**
  *Each item presents a concrete situation with answer options. Students select one option per item.*  

  1. **A baby is born. What best describes what it brings into the world?**  
     - A) Specific tendencies, like crying when hungry or calming when held.  
     - B) A natural direction to develop, like a seed becoming a tree if given soil and water.  
     - C) Basic capacities, like the ability to learn or adapt, but no preset tendencies.  

  2. **A child sees another child fall and cry. Without prompting, the first child looks upset and offers a toy. What does this show?**  
     - A) Humans naturally feel for others and want to help.  
     - B) The child has learned this from caregivers or society.  
     - C) It’s random—sometimes people help, sometimes not.  

  3. **A young apprentice learns carpentry by copying a master. After years, the apprentice makes fine furniture without thinking. How did this skill arise?**  
     - A) The apprentice had inborn talent that practice awakened.  
     - B) The apprentice had no special talent; repetition and teaching built it.  
     - C) The apprentice had raw ability, shaped by the master’s corrections.  

  4. **A hungry person steals bread when no one is looking. Why?**  
     - A) Natural desires took over because they weren’t trained to resist.  
     - B) Their natural goodness was buried by bad experiences or neglect.  
     - C) They are selfish by default and will act this way unless forced.  

  5. **A wise leader creates a new custom to reduce village disputes. How did they make it effective?**  
     - A) They observed patterns in how people interact and formalized them.  
     - B) They designed a useful tool that channels behavior.  
     - C) They removed burdensome rules to let people act freely.  

  6. **Two siblings grow up in the same home. One becomes generous, the other greedy. What explains the difference?**  
     - A) They were born with different tendencies.  
     - B) They chose different paths despite similar upbringing.  
     - C) Small differences in their environment (e.g., friends, events) influenced them.  

  7. **A person donates to a stranger in need without hesitation or reflection. How is this possible?**  
     - A) It’s an inborn impulse, like jumping at a loud noise.  
     - B) It’s habit from training—they’ve learned to act this way.  
     - C) It’s coincidence; there’s no deeper cause.  

  8. **What is the best way to raise a child to be kind?**  
     - A) Provide love and examples so their innate kindness flourishes.  
     - B) Teach rules and consequences so they learn self-control.  
     - C) Shield them from corrupting influences like greed or competition.  

  9. **In a society with no rules, people start hoarding resources and fighting. Why?**  
     - A) Without structure, natural desires lead to conflict.  
     - B) They’ve lost touch with their original cooperative nature.  
     - C) Some people are naturally aggressive; others aren’t.  

  10. **Why do a few people become moral exemplars ("sages") while most do not?**  
      - A) All have equal potential; exemplars work harder at self-improvement.  
      - B) Exemplars are born with superior traits; others can’t reach that height.  
      - C) Exemplars unlearn artificial habits to rediscover simplicity.  

  ---

  ### **Scoring Key**  
  Map answer patterns to leaves based on dominant alignment. Treat incomplete/inconsistent patterns by:  
  - **Incomplete** (e.g., missing 1–2 items): Assign to the nearest leaf using majority vote, prioritizing Axes 1–2.  
  - **Inconsistent** (e.g., equally split): Flag as philosophically interesting if inconsistencies reflect tensions in a view (e.g., Gaozi’s water/wood analogies). Resolve by:  
    - If Axis 1 = C and Item 3 = B, default to **Gaozi**.  
    - If Axis 1 = A and Item 7 = A, default to **Mixed view**.  
    - Else, assign to **Confucius’s underdetermined view** as it accommodates ambiguity.  

  **Leaves and their defining patterns** (based on Axes and item clusters):  
  - **Sprout view**: 1B, 2A, 3A, 4B, 5A, 6B/C, 7A, 8A, 9B, 10A.  
    *Awkward commitment*: Explaining why people fail to extend innate tendencies so often.  
  - **Deliberate-activity view**: 1A, 2B, 3B, 4A, 5B, 6B/C, 7B, 8B, 9A, 10A.  
    *Awkward commitment*: How we achieve goodness if inborn tendencies lead to strife.  
  - **Gaozi (indifference view)**: 1C, 2B/C, 3C, 4A, 5B, 6B/C, 7B/C, 8B, 9A, 10A.  
    *Awkward commitment*: Reconciling water (neutral direction) and wood (passive material) analogies.  
  - **Mixed view**: 1A, 2A, 3C, 4A/B (inconsistent), 5A/B (inconsistent), 6C, 7A/B (inconsistent), 8C, 9B, 10A.  
    *Awkward commitment*: Why bad tendencies exist and how we overcome them.  
  - **Graded view**: 1A, 2A, 3A, 4C, 5B, 6A, 7A/B, 8B, 9C, 10B.  
    *Awkward commitment*: Why some are born inferior and whether they can change.  
  - **Legalist position**: 1A, 2C, 3B, 4A, 5B, 6C, 7B, 8B, 9A, 10B.  
    *Awkward commitment*: Why people sometimes act against self-interest.  
  - **Subtraction view**: 1B, 2A, 3A, 4B, 5C, 6C, 7A, 8C, 9B, 10C.  
    *Awkward commitment*: Why society and norms arose if spontaneity is adequate.  
  - **Confucius’s underdetermined view**: Any pattern with high inconsistency or emphasis on Item 6C and 10A.  
    *Awkward commitment*: Vagueness about what “nature” contains or how practices work.  

  **Empty cells** (logically possible but unoccupied in early Chinese thought):  
  1. **Nature bad and untransformable**: (e.g., 1A, 2C, 3B, 4A, 5B, 6A, 7B, 8B, 9A, 10B)  
     *Diagnosis*: Coherent but unattractive (implies fixed immorality with no redemption), foreclosed by period optimism about cultivation.  
  2. **Nature good and needing no cultivation**: (e.g., 1B, 2A, 3A, 4B, 5C, 6C, 7A, 8C, 9B, 10C)  
     *Diagnosis*: Coherent but unexplored; period thinkers assumed cultivation was necessary.  
  3. **Norms invented while nature is indifferent, but spontaneity reliable**: (e.g., 1C, 2A, 3C, 4A, 5B, 6B/C, 7A, 8C, 9A, 10A)  
     *Diagnosis*: Incoherent—if spontaneity is reliable, invented norms would disrupt it; Gaozi avoids this by denying spontaneity’s reliability.  

  **Limitations** (pairs the instrument may not reliably separate):  
  - **Mencius vs. Xunzi**: Both hold anyone can become a sage (Item 10A). The separator is **Item 8** (raising a child): Mencius aligns with 8A (nourish), Xunzi with 8B (restrain). This depends on Axis 3, not Axis 1.  
  - **Subtraction view vs. Sprout view**: Hard to separate if spontaneity is conflated with innate tendencies. Item 5 (norms’ origin) is key: subtraction view is 5C, sprout view is 5A.  
  - **Graded view vs. Mixed view**: Graded view (6A) and mixed view (6C) may overlap on Item 6; Item 4 (wrongdoing) clarifies (graded: 4C, mixed: 4A/B).  
  - **Gaozi vs. Legalist**: Gaozi’s Item 2B/C and Legalist’s 2C may align; Item 9 (no rules) separates them (Gaozi: 9A, Legalist: 9A, but Legalist has stronger Item 7B).  
  - **Contested placements**:  
    - **Gaozi’s view** by "nature": Axis 1-C (raw capacity) is contestable; some readings imply Axis 1-A (born tendencies) with neutral content. Item 1C anchors this.  
    - **Mixed view**: Han texts are ambiguous on Axes 4–5; inconsistencies in scoring reflect this.  

  ---

  ### **Epistemic Note on the Design**  
  - **Least confident in**: Graded view placement. Specialists may dispute Item 4C ("by nature bad") as reductive for Dong Zhongshu/Han Yu, who emphasized gradations, not binaries.  
  - **Weakest axis**: Axis 7 (spontaneity reliability). It risks overcomplicating the tree but is necessary for subtraction view separation; without it, Items 5, 8, and 10 underperform.  
  - **What would change my mind**:  
    - If student patterns show Gaozi consistently choosing Item 1A (not 1C), I would merge Gaozi with mixed view or add a leaf.  
    - If sprout and subtraction views cluster together in trials (e.g., both choosing 2A, 7A, 8A), I would add an item on social norms (e.g., "Does teaching etiquette improve or hinder kindness?").  
    - If Xunzi-aligned students reject Item 7B (laws) for a "ritual education" option not listed, I would split Item 7.  
  - **Likely failure point**: Item 7 (spontaneous good deed) may not separate Legalist (training) from Xunzi (training) cleanly. Failure looks like Legalist/Xunzi patterns merging; this could be mitigated by emphasizing Item 9 (no rules) for Legalist.  

  This instrument forces concrete-case reasoning, delaying "good/bad" labeling. Pilot it with a small group to refine inconsistencies.
