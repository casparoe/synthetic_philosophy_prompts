     - B: Wrongdoing as a failure to extend (Axis4-B) and nature as having moral material (Axis2-A).
     - C: A graded view that this person is inherently bad (Axis6-B).

  **Item 4: When a sage invents a new ritual to resolve conflict, what is the source of the ritual's effectiveness?**
     - A) The sage discovered a pattern that was already inherent in human relationships.
     - B) The sage designed a tool that works because it shapes behavior in a useful way.
     - C) The ritual is effective only if it aligns with the natural spontaneity of people.

     Mapping:
     - A: Norms as discovered (Axis5-A).
     - B: Norms as invented (Axis5-B).
     - C: Subtraction view: norms must align with spontaneity to not cause harm.

  **Item 5: Two children are raised in the same environment. One becomes virtuous, the other becomes a criminal. What accounts for the difference?**
     - A) They were born with different natures.
     - B) They made different choices in how to respond to their environment.
     - C) The environment wasn't exactly the same; small differences matter.

