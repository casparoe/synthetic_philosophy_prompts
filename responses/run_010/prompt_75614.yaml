     - Axis3: Cultivation is not needed, and in fact, it harms. But if forced, it would be the opposite of extending: it would be subtracting. So we might need to adjust Axis3? Let's note: our Axis3 is about how cultivation works if we do it. The subtraction view might say that the best is not to cultivate at all. But in the context of the instrument, we might capture it by:
          Axis3: We don't cultivate (or cultivation is negative) but that's not an option. Alternatively, they might see "cultivation" as the problem. We might have to capture it in the cause of wrongdoing: wrongdoing is caused by the imposition of norms (so Axis4-B: loss of original state) and the origin of norms is invented (Axis5-B) and harmful.

  Given the complexity, we might add:

  7. **Axis 7: The value of spontaneity vs. cultivation**
     - Branch A: Spontaneity (acting without reflection or training) is trustworthy and leads to good outcomes.
     - Branch B: Spontaneity is untrustworthy and must be shaped by cultivation to achieve good outcomes.

  But this might be covered by other axes? Let's see.

  Alternatively, we can stick to the first six and note that the subtraction view would be:
     - Axis1: A or B? They might say nature is the spontaneous way (which is good).
     - Axis2: A (the material is present: spontaneity)
     - Axis3: But they reject cultivation? So if we must choose, they would say cultivation is artificial and harmful (so if we have to choose between extending or restraining, they might say neither, but if forced, they might say that any cultivation is restraining and remaking in a bad way). This is tricky.

  Given the constraints, we will proceed with the six axes and note that the subtraction view might be captured by:
     - Axis4: Wrongdoing is the loss of the original state (because of intervention)
     - Axis5: Norms are invented (and not discovered) and are harmful.

  But we must design the items to capture these nuances without using the vocabulary.

  Now, the leaves (positions) we must include:

  1. **Sprout view (Mencius):** The beginnings of the virtues are universal, and moral failure is a matter of not extending them. Awkward commitment: Explaining why people fail to extend their sprouts so often.

  2. **Deliberate-activity view (Xunzi):** Goodness is a human achievement imposed on an inborn tendency that left alone leads to strife. Awkward commitment: Explaining how we can achieve goodness if our nature is bad.

  3. **Indifference view (Gaozi):** Human nature is indifferent to good and bad, like water that can be channeled either way, or like wood that can be carved. But note: his two analogies might be in tension. The water analogy suggests that the direction comes entirely from outside, while the wood analogy might suggest that the material is passive and must be shaped. Awkward commitment: Resolving the tension between the two analogies.

  4. **Mixed view (Han):** Both good and bad strands are in everyone, and cultivation decides which is developed. Awkward commitment: Explaining why the bad strand is there and how we can overcome it.

  5. **Graded view (Dong Zhongshu, Han Yu):** Natures differ in kind across people, and teaching only reaches some. Awkward commitment: Explaining why some people are born with a worse nature and whether they can change.

  6. **Legalist position:** The good/bad framing is idle; people respond to incentives, so we should focus on designing laws and punishments. Awkward commitment: Explaining why people sometimes act against their apparent self-interest.

  7. **Subtraction view (Daoist):** Inborn spontaneity is already adequate, and the imposition of norms ruins it. Awkward commitment: Explaining why society ever arose and why we don't all live spontaneously.

