  We are building a diagnostic instrument (questionnaire) to sort students into different views on human nature and moral development in early Chinese thought, without using the terms "good," "bad," "mixed," or "indifferent" and without naming thinkers. The goal is to have concrete situations with answer choices that map onto the logical space defined by several axes.

  First, we define the branch axes (in order):

  1. **Axis 1: What constitutes human nature?**
     - Branch A: Everything one is born with and cannot help (including impulses, desires, etc.)
     - Branch B: The characteristic direction a human being develops in under favorable conditions (a teleological view)
     - Branch C: Raw capacity with no direction built in (like a blank slate or undirected potential)

  2. **Axis 2: The origin of virtue's material**
     - Branch A: Already present at birth (as tendencies or beginnings)
     - Branch B: Has to be brought in from outside (via teaching, ritual, etc.)

     Note: This axis might be conditional on Axis 1. For example, if one chooses Axis1-C (raw capacity), then the material for virtue is not present and must be brought in.

  3. **Axis 3: The method of cultivation**
     - Branch A: Extends and nourishes what is there (like tending a plant)
     - Branch B: Restrains and remakes it (like straightening warped wood or carving)

  4. **Axis 4: The cause of wrongdoing**
     - Branch A: The default outcome if there is no intervention (i.e., without cultivation, we naturally go wrong)
     - Branch B: The loss and corruption of something originally present (i.e., we start with something good that gets damaged)

  5. **Axis 5: The origin of ritual and norms**
     - Branch A: Discovered (a pattern already in things, like the grain in wood)
     - Branch B: Invented (an artifact, like a potter making a vessel)

  6. **Axis 6: Differences between people**
     - Branch A: One shared nature, differently nourished (so differences are due to environment, effort, etc.)
     - Branch B: Genuinely different kinds of nature (so some people are inherently better or worse)

  We might need one more axis to capture the Legalist position, which bypasses the good/bad debate by focusing on incentives. However, we can represent it by a combination of the above, especially by emphasizing Axis 4 (wrongdoing as default without intervention) and Axis 5 (norms as invented) and also by a particular view on the effectiveness of external controls.

  But note: The Legalist position is characterized by the belief that human nature is such that people respond reliably to incentives (rewards and punishments) and that moral cultivation is not the primary concern. We might capture this by:

     - A view that human nature (Axis1-A: what one is born with) is self-interested and without innate moral material (Axis2-B), so that norms are entirely invented (Axis5-B) and the method of cultivation is really about shaping behavior through external forces (Axis3-B: restraining and remaking). Also, wrongdoing is the default (Axis4-A) and differences between people might be seen as due to different responses to incentives (so perhaps Axis6-A, because everyone has the same self-interested nature) but they might also believe in differences in intelligence, etc. (Axis6-B). However, the core is that the discussion of good vs. bad nature is idle because behavior is malleable via laws and incentives.

  We also have the subtraction view (e.g., Daoist) which holds that inborn spontaneity is adequate and norms ruin it. This would be:
     - Axis1: B (characteristic direction under favorable conditions) or perhaps A (what one is born with) but with a positive spin?
