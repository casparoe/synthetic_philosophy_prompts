prompt: |-
  I've been trying to sort out when cultural change actually counts as Darwinian — when there's a real replicator being selected rather than just people influencing each other — and I've accumulated a pile of verdicts I can't unify. Going purely on gut:

  - The tune and words of a playground clapping rhyme, mangled a bit by each year's cohort, where the versions that are easiest to chant in time outlast the rest: obviously yes, this is my paradigm case.
  - A family recipe never written down, learned by watching, where every cook improvises and nobody's version matches the one before it: still yes, though I couldn't tell you what the unit is.
  - A motto reproduced letter-perfect on a signet ring, or a hymn sung word-for-word out of a printed book for three centuries: I want to say yes, it's a cultural replicator — but there's no variation at all, hence no selection, so maybe it's just a very durable artifact?
  - A rumour that spreads *by* being distorted: each teller sharpens it, and the sharpened version spreads better than the accurate one did. I want to say selection happened here. But strictly speaking nothing was ever copied.
  - The Pythagoras theorem, which each generation of students re-derives after being shown the proof and checking it. Same content, no copying, enormous stability. I'd say this is NOT Darwinian cultural evolution — it's truth-tracking, and the stability has nothing to do with fitness.
  - Lapel widths cycling wide–narrow–wide: no. That's just people matching each other, there's no recipe being passed on.
  - A smith improves a plough design, teaches the improvement to apprentices, who improve it further: yes, definitely evolution, but it feels Lamarckian — acquired improvements get inherited — so does that disqualify it from being Darwinian, or not?

  The pair I cant reconcile is the rumour and the theorem. In both, the content is reconstructed rather than copied, and I give opposite verdicts. My half-formed hunch is that the difference is whether the reconstruction is pulled by a bias that favours some variants over others, versus pulled by a checking procedure that converges on the same answer no matter who runs it. I also vaguely remember someone arguing that cultural items aren't copies at all but something more like stable points that representations drift toward, which might dissolve the whole question.

  Could you give me: "What my verdicts are tracking" (one paragraph, say what the pattern seems to be before theorizing); "Candidate principles" (two or three, each stated precisely enough that I could apply it mechanically to a new case, with a note on which of my cases motivates each clause); "The rumour and the theorem" (a paragraph on whether any single principle delivers both of those verdicts, and what it costs); and "What I'd have to drop" (for each principle, which of my listed verdicts it overturns, plus your verdicts on two cases I left out — a language's word order slowly drifting, and a joke that mutates to fit each platform it's posted on).
reasoning: |-
  Hmm, the user is grappling with whether cultural changes count as Darwinian evolution. They've listed several examples and their gut reactions, but they're confused about why some cases like rumors and theorems get different verdicts even though both involve reconstruction. I need to address their core question about replicators and selection in culture.

  Looking at their examples: clapping rhymes and family recipes seem like clear "yes" cases with variation and selection. Perfect copies like mottoes are tricky because no variation means no selection, so it's more like durability. Rumors spread through distortion, which feels selective, but theorems are re-derived each time based on proof, so stability comes from truth, not fitness. Fashion trends like lapel widths lack replicators, while plough design improvements feel Lamarckian but might still fit under Darwinism if we allow for inheritance of acquired traits.

  The key tension is between rumor and theorem. Both involve reconstruction, but rumors evolve through biased transmission (each teller sharpens it, making it "fitter"), while theorems converge on truth regardless of who derives it. Their hunch about bias vs. checking procedure seems spot-on. I should formalize that into principles.

  For candidate principles, I'll propose: 
  1) **Replicator Existence**: Requires identifiable units that are copied with heredity. This explains why lapel widths fail - no replicator is passed down. 
  2) **Selection via Differential Fitness**: Needs variation where some variants spread better due to inherent properties. This covers rumors (sharpened versions spread faster) but excludes theorems (stability from truth, not fitness). 
  3) **Reconstruction with Bias**: Allows for non-copying if reconstruction has systematic biases favoring certain variants. This unifies rumors and clapping rhymes but distinguishes theorems where reconstruction is error-correcting.

  Applying these to their unresolved cases: 
  - Language word order drift: Slow, neutral change without selective bias - not Darwinian under Principle 3. 
  - Platform-adapted jokes: Deliberate mutation for fitness - clearly Darwinian under Principles 2 and 3.

  The cost of using Principle 3 is stretching "Darwinian" beyond strict copying, but that's necessary for cultural evolution. They'd have to drop their "no" verdict on rumors and accept that Lamarckian inheritance (like plough designs) is compatible with Darwinian selection as long as variation and selection occur.

  I'll structure the response with their requested sections: summarizing their pattern, stating principles clearly, resolving the rumor/theorem paradox, and showing trade-offs with new cases. The theorem case challenges traditional replicator theory but fits neatly under the reconstruction-with-bias framework.
answer: |-
  Here's a breakdown of your intuitions, candidate principles, and how they resolve your key tension:

  **What Your Verdicts Are Tracking:**
  Your verdicts track whether the cultural stability *or* change emerges primarily from **differential persistence and spread due to inherent properties of the cultural variant itself** (e.g., catchiness, ease of recall, memorability, functional efficiency) within a process involving variation and imperfect transmission/reconstruction, rather than from perfect copying, deliberate rational reconstruction to an external standard (like truth), simple conformity pressure without inheritance of a "recipe," or the inherent stability of an artifact.

  **Candidate Principles:**

  1.  **Principle of Variant-Linked Differential Fitness (VLDF):**
      *   *Mechanically:* Is the persistence/spread of the cultural item over time *significantly influenced* by inherent properties (e.g., memorability, catchiness, ease of use, perceived utility, emotional impact) of *specific variants* that make them more likely to be transmitted/reconstructed *faithfully enough to retain core identity*, compared to other variants? Selection requires variation and differential success based on variant properties.
      *   *Motivation:* Explains "Yes" for clapping rhyme (catchy/easy variants win), recipe (functional/tasty/simple variants persist), rumour (sharpened versions spread better), plough (better designs are adopted). Explains "No" for motto (no variation, no differential fitness), theorem (stability from external truth/proof, not variant fitness), lapel widths (no inherited variant, conformity pressure dominates).

  2.  **Principle of Replicator Identity via Reconstruction (RIR):**
      *   *Mechanically:* Does the cultural item constitute a "replicator" by retaining a recognizable core identity across transmission events *because* the transmission process inherently involves reconstruction *biased towards producing specific variants* (e.g., easier rhythms, sharper gossip, functional improvements)? This bias acts as the selection filter. Perfect copying or convergence to an external standard without variant bias doesn't count.
      *   *Motivation:* Explains "Yes" for clapping rhyme, recipe, rumour, plough (reconstruction biased towards fitter variants). Explains "No" for motto (copying, no reconstruction/bias), theorem (reconstruction converges to external standard, not biased towards inherently "fitter" *variants*), lapel widths (no reconstruction of a specific "variant recipe").

  3.  **Principle of Non-Artifactual Inheritance (NAI):**
      *   *Mechanically:* Is the cultural item primarily stored and transmitted via minds/brains (imperfect, biased reconstruction) rather than via static, unchanging external artifacts (like engraved rings or printed books)? Selection operates on the mental representations during transmission/reconstruction.
      *   *Motivation:* Explains "Yes" for clapping rhyme, recipe, rumour, plough (brain-mediated). Explains "No" for motto (artifact-mediated copying). Explains the durability of the theorem *without* invoking Darwinism (re-derivation guided by proof/logic, not biased reconstruction of variants).

  **The Rumour and the Theorem:**
  The **RIR Principle** delivers both verdicts cleanly. The rumour is Darwinian: each reconstruction (telling) is *biased* towards producing sharper, more memorable, "fitter" variants, and these biased reconstructions *are* the copies that spread. The theorem is *not* Darwinian: each reconstruction (re-derivation) is *biased* by the proof/logic to converge on the *same specific, correct variant* regardless of its inherent "fitness" for transmission (e.g., it might be complex). The stability comes from the external standard (truth/proof), not from differential success of competing variants *within* the transmission process itself. The cost is defining "copying" loosely as "biased reconstruction producing a variant perceived as sufficiently similar," which some strict replicator theorists might reject. The **VLDF Principle** also works: the rumour has variants differing in fitness (sharpened > accurate), the theorem does not (all correct derivations are functionally identical, stability isn't due to *differential* fitness of theorem variants).

  **What You'd Have to Drop (Per Principle):**

  *   **VLDF Principle:**
      *   Overturns: Your "maybe yes" on the motto (no variation, hence no differential fitness = NO).
      *   Accepts: Plough design as Darwinian (Lamarckian inheritance is *compatible* with Darwinian selection – acquired improvements *become* the variant that then spreads via selection).
  *   **RIR Principle:**
      *   Overturns: Your "maybe yes" on the motto (artifact copying without biased reconstruction = NO).
      *   Accepts: Plough design as Darwinian (reconstruction is biased towards functional improvements).
  *   **NAI Principle:**
      *   Overturns: Your "maybe yes" on the motto (artifact-mediated = NO).
      *   Overturns: Your "no" on lapel widths? (Harder, depends if you see "this season's width" as a transient "variant" stored/transmitted socially).

  **Your New Cases (Applying RIR Principle - most explanatory):**

  1.  **Language's word order slowly drifting (e.g., SOV to SVO):**
      *   *Verdict:* **Not strongly Darwinian (No).**
      *   *Reason:* Drift often involves neutral, non-functional changes accumulating gradually without specific variants having differential *fitness* driving the change. Transmission involves reconstruction, but the bias (ease of production/parsing) is often weak and cumulative, not strongly selecting *against* specific competing variants in favor of clearly "fitter" ones at each step. It's more like cumulative, slightly biased copying drift than strong selection on variants.
  2.  **A joke that mutates to fit each platform it's posted on (e.g., shortened for Twitter, image macro added for Reddit):**
      *   *Verdict:* **Yes, Darwinian.**
      *   *Reason:* Clear variants exist (platform-specific versions). Reconstruction (adaptation for the new platform) is *strongly biased* by the constraints/norms of that platform. These platform-adapted variants have higher "fitness" (likelihood of being shared/liked) *on that specific platform* due to their inherent properties (brevity, format, topicality) compared to the unadapted version. Differential success based on variant properties linked to the environment (platform).

  **In essence:** Your core intuition distinguishing the rumour (biased reconstruction favoring "fitter" variants) from the theorem (reconstruction constrained to a single "correct" variant by an external standard) is sound. The key is identifying whether differential success stems from *inherent properties of the cultural variants themselves* within a process of biased reconstruction.
