  Noticing they referenced Haitian historian Michel-Rolph Trouillot's silencing framework. The stanza mapping is crucial: first two stanzas as clerk entries, then statute/record destruction, finding aid dehumanization, present-tense narration, finally the missing matron's book in the envoy. 

