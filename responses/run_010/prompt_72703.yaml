  Title must be ledger-neutral. "Column Headings" positions the poem as found text. Final line "keeping" echoing as both preservation and financial burden captures the duality. 

  Better avoid any lyrical embellishment. Each line should feel like it's being stamped by an institutional machine. The horror is in what the form can't say - like those empty columns where voices should be.
answer: |-
  ## Column Headings

  The iron gate accepts another. **Admitted**
  Not by name, just a number and a **date**
  Scratched beside the column for the rations.
  The clerk anticipates the day discharged
  Will need inking. More likely, simply died
  Will close the book and end the county’s keeping.

  The ink records the cost of their mere keeping
  For the Board. Each soul merely admitted
  Adds a line. The final tally died
  Demands less ink than entries for the date
  Of transfer, or the hope of discharged.
  The arithmetic revolves around the rations.

  The statute weighs the worth of saved rations
  Against the vault space needed for their keeping.
  It sorts the shelves: which ledgers, discharged
  Of further use, burn bright. Those admitted
  Into permanence require a final date
  Stamped by the state. The rest? Officially died.

  The finding aid declares this volume died
  In ’54. Its spine held more than rations
  Count. A linear foot, assigned a date
  Of closure, measures space for their thin keeping.
  Its absence means the names admitted
  Here stay bound. No chance for their discharged.

  I turn the page where someone was discharged
  To air, perhaps? Or just recorded died?
  This brittle leaf, its purpose long admitted,
  Tallies beans and meal, the meager rations,
  Quantifies the price of their bleak keeping
  In cold cents. I assign no meaning, just the date.

  The matron’s notes? Gone missing. Check the date:
  Nineteen fifty-four. The box discharged
  Its duty holding paper, barely keeping
  Proof she lived. Her voice, effectively, died
  With the lost log of meals beyond strict rations,
  Her observations never formally admitted.

  No name admitted breathes beyond this date,
  No soul discharged escapes the cost of keeping,
  No life died here transcends the counted rations.
