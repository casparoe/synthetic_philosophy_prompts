  Claire, a writer with a deadline in two days, knows she will be tempted tomorrow to watch a movie instead of working. To prevent this, she buys a non-refundable ticket for a concert on the deadline day. She resolves to work tomorrow and attend the concert after meeting her deadline. She knows that if she watches the movie, she will miss the concert and feel bad about wasting the ticket. The next day, despite no new information, she chooses to watch the movie, knowing this means she will have to rush her work and miss the concert.

