prompt: |-
  I'm drafting a section for a seminar handout on self-binding and I keep getting stuck on a case I can't actually build. Here's what I need from you.

  Design me a thought experiment in which the judgment-based account of akrasia (Davidson's line: you're akratic iff you intentionally act against your own all-things-considered judgment about what to do) says there's no akrasia at all, while the intention-or-resolution account (Holton's line: weakness of will is unreasonably revising a resolution, i.e. an intention you formed precisely to hold off an inclination you knew was coming) says the agent is plainly weak-willed. Same agent, same act, the two accounts split. That's the direction I care about: she does exactly what she judges best at the moment she does it, and it's still a failure of will.

  What the case is for, so you know what counts as cheating: I want students to see that these two accounts aren't just relabelling each other, and that self-binding setups are where the gap shows up in the open. A case that stipulates the verdicts — where I'm told she acts against her better judgment and also told she doesn't — fails. The verdicts have to fall out of the details you give me.

  Constraints:

  - Realistic. An ordinary adult, an ordinary project, an ordinary temptation. No sci-fi, no neurosurgery, no time machines, no perfect predictors.
  - The scenario proper is one paragraph. Numbers and analysis go after it.
  - She's a sophisticate in the O'Donoghue–Rabin sense: a quasi-hyperbolic (β-δ) discounter who correctly predicts her own future preferences. No self-deception, no surprises.
  - She's set up a committment device with a real penalty attached, and she can break it — it isn't a physical lock, it's a cost she chooses to eat.
  - Calibrate the penalty so breaking it is neither obviously smart nor obviously dumb. I dont want a device so harsh nobody would break it, or so feeble that breaking it is just good shopping.
  - No addiction or compulsion framing. I don't want the easy exit where she wasn't really herself.
  - Crucially: nothing new happens between forming the resolution and breaking it. No news, no changed circumstances, no new reasons. The only thing that changes is when she is.

  Then show your work:

  1. The arithmetic. Give me β, δ, the dated amounts, and compute the discounted sums both from the perspective of the day she makes the plan and from the perspective of the moment of temptation, penalty included, so the ranking flip is visible on the page. The flip has to come out of present bias, not out of me asserting it.
  2. The verdicts. What the judgment account says and why, what the resolution account says and why. Point at the exact bit of your scenario each verdict hangs on.
  3. Which feature is doing the work? My guess is the no-new-information clause plus the fact that the resolution was aimed at this very inclination — but tell me if it's actually the sophistication that matters.
  4. Ablations. What happens if I take out (a) the commitment device, (b) the sophistication, making her a naive agent instead, and (c) the no-new-information clause? For each one: does the case collapse back into bog-standard akrasia, collapse into a perfectly sensible change of mind, or does the split survive?
  5. The best attack from the Davidsonian side. I expect a redescription move — either that the earlier judgment is the one she's acting against, or that at the moment of action she doesn't really have a settled all-things-considered judgment because the inclination is doing the talking. Say which version actually bites, and what I'd have to change in the case to block it.
  6. The honest bit: is the β-δ machinery load-bearing here, or would any old preference reversal over time do exactly the same job? If it's decoration, say so — I'd rather know before I build the section around it.

  And if you think the spec isn't jointly satisfiable — that being a genuine sophisticate makes it impossible to form the kind of resolution Holton's account needs, since she knows from the start that she'll break it — tell me that plainly instead of quietly fudging one of the constraints.
reasoning: |-
  We are constructing a case that satisfies the following:
   - Agent is a sophisticated quasi-hyperbolic discounter (β-δ) with β < 1 and δ ≈ 1.
   - She sets up a commitment device with a penalty that is calibrated so that breaking it is neither obviously smart nor obviously dumb.
   - No new information between forming the resolution and breaking it.
   - The act is ordinary, no addiction or compulsion framing.

   We want:
   - Davidson: At the moment of action, she does not act against her all-things-considered judgment. So at that moment, she judges that breaking the resolution is best.
   - Holton: She is weak-willed because she unreasonably revises a resolution that was formed precisely to hold off an inclination she knew was coming.

   We design the case so that at the time of making the resolution (time 0), she prefers to stick to the plan because the penalty is set such that, from the perspective of time 0, the discounted cost of the penalty (which is incurred at the same time as the temptation) is high enough to make sticking better. However, at the moment of temptation (time 1), due to present bias, the immediate gratification of breaking the resolution (and incurring the penalty) is preferred.

   Let's set up the scenario:

   Scenario: Claire is a writer with a deadline in two days (time 2). She knows that tomorrow (time 1) she will be tempted to watch a movie that she really wants to see, which would take up the entire day. If she watches the movie, she will miss a day of work and will have to rush the next day, which will lower the quality of her work. However, she can set up a commitment device: she can pre-pay for a non-refundable ticket to a concert the day after the movie (at time 2). The concert is something she would enjoy, but not as much as the movie. The penalty is the loss of the concert ticket money and the loss of the concert experience. But note: if she breaks her resolution and watches the movie, she will not go to the concert because she will be rushing to finish her work. So the penalty is the waste of the ticket and missing the concert.

   However, note: the penalty is incurred at time 2, the same time as the deadline. We need to set the amounts so that:

   At time 0 (today), when she forms the resolution, she prefers the plan:
     - Plan A (stick to resolution): Work at time 1, then work at time 2 (and go to the concert at time 2 evening). 
     - Plan B (break resolution): Watch movie at time 1, then work at time 2 (and miss the concert because she is working).

   But at time 1, she is tempted to break the resolution.

   We model the utilities:

   Let:
     - The immediate gratification of watching the movie at time 1: M (positive)
     - The disutility of working at time 1: -W1
     - The disutility of working at time 2: -W2 (without rush) or -W2_rush (with rush, which is more negative)
     - The utility of going to the concert at time 2: C (positive, but note that if she breaks the resolution, she doesn't go and loses the ticket money and the experience)

   Additionally, she paid for the concert ticket at time 0. But since that is sunk cost, we ignore it in the utility at time 1 and 2? However, note that the loss of the concert experience and the waste of money might be felt at time 2. We can model the penalty as a disutility at time 2: if she breaks the resolution, she gets an additional disutility P (for penalty) at time 2.

   Alternatively, we can think of the penalty as the loss of the concert experience and the feeling of having wasted money. So:

     - If she sticks to the resolution: she works at time 1 (disutility -W1) and at time 2 (disutility -W2), and gets C at time 2 (so net at time 2: C - W2).
     - If she breaks the resolution: she gets M at time 1 (watching movie) and then at time 2 she has to work under rush (disutility -W2_rush) and she doesn't get the concert (so no C) and she feels the penalty (disutility -P). So net at time 2: -W2_rush - P.

   We assume that without the penalty, breaking the resolution would be better at time 1 because of the immediate movie. But the penalty is set so that at time 0, the total discounted utility of sticking is better, but at time 1, due to present bias, breaking becomes better.

   We set:

     β = 0.8 (a typical present bias factor)
     δ = 1 (for simplicity, so we are ignoring long-term discounting; we are focusing on the present bias)

   Time 0: today
   Time 1: tomorrow (movie day and work day 1)
   Time 2: the next day (deadline day and concert day)

   Utilities:

     - Working on time 1: -W1 = -5 (disutility of work on day 1)
     - Working on time 2 without rush: -W2 = -5 (normal work)
     - Working on time 2 with rush: -W2_rush = -10 (because rushing is more painful)
     - Movie at time 1: M = 10 (immediate pleasure)
     - Concert at time 2: C = 8 (pleasure from concert)
     - Penalty (for missing concert and wasting money): P = 5 (this is the disutility at time 2 from not going and having wasted the money)

   Now, let's compute the discounted utilities from the perspective of time 0 and time 1.

   From time 0:

     Option A (stick):
       Time 1: -W1 = -5
       Time 2: -W2 + C = -5 + 8 = 3
       Discounted: βδ * (-5) + βδ² * (3)   [with δ=1, so becomes β*(-5) + β*(3) = 0.8*(-5) + 0.8*3 = -4 + 2.4 = -1.6]

     Option B (break):
       Time 1: M = 10
       Time 2: -W2_rush - P = -10 - 5 = -15
       Discounted: βδ * (10) + βδ² * (-15) = 0.8*10 + 0.8*(-15) = 8 - 12 = -4

     So at time 0, Option A (stick) has utility -1.6, Option B has -4. So she prefers A.

   From time 1:

     Now, at time 1, the immediate utility is not discounted and the future is discounted by βδ.

     Option A (stick at time 1 means working today and then tomorrow she gets the concert and normal work):
          Today (time1): -5 (work)
          Tomorrow (time2): βδ * (3) = 0.8 * 3 = 2.4   [since δ=1]
          Total: -5 + 2.4 = -2.6

     Option B (break: watch movie today and then tomorrow she gets the rushed work and penalty):
          Today (time1): 10 (movie)
          Tomorrow (time2): βδ * (-15) = 0.8 * (-15) = -12
          Total: 10 - 12 = -2

     At time 1, Option B (-2) is better than Option A (-2.6). So she breaks the resolution.

   Now, we have the flip: at time 0, she forms a resolution to stick (because A is better). At time 1, she breaks it because B is better.

   Now, the accounts:

     Davidson: At time 1, she forms an all-things-considered judgment that breaking the resolution (watching the movie) is the best thing to do (since it yields -2 vs -2.6). Therefore, she does not act against her all-things-considered judgment at the time of action. So no akrasia.

     Holton: She formed a resolution at time 0 precisely to resist the temptation at time 1. She knew that without the commitment device, she would watch the movie. The resolution was set up to impose a penalty to make sticking better overall from the perspective of time 0. But at time 1, she revises her resolution even though no new information has come in. According to Holton, this is weakness of will: unreasonably revising a resolution in the face of temptation.

   Now, the scenario paragraph:

   Claire is a writer facing a deadline in two days. She knows that tomorrow she will be tempted to skip work and watch a newly released movie, which she would enjoy. However, if she does that, she will have to rush her work on the deadline day, which she dislikes. To prevent this, she sets up a commitment device: she buys a non-refundable ticket to a concert on the deadline day. The concert is enjoyable, but not as much as the movie. She resolves to work tomorrow and then attend the concert after finishing her work on the deadline day. She knows that if she breaks her resolution and watches the movie, she will not have time to attend the concert and will feel bad about wasting the ticket. The next day, despite no change in circumstances, she watches the movie. She knows this means she will have to rush her work and miss the concert, but she does it anyway.

   Now, the details:

   1. Arithmetic:

      β = 0.8, δ = 1.

      At time 0 (today):
          Stick: βδ * (-5) + βδ² * (3) = 0.8*(-5) + 0.8*3 = -4 + 2.4 = -1.6
          Break: βδ * (10) + βδ² * (-15) = 0.8*10 + 0.8*(-15) = 8 - 12 = -4

          So at time 0, stick is better.

      At time 1 (tomorrow):
          Stick: -5 + βδ * (3) = -5 + 0.8*3 = -5 + 2.4 = -2.6
          Break: 10 + βδ * (-15) = 10 + 0.8*(-15) = 10 - 12 = -2

          So at time 1, break is better.

   2. Verdicts:

      - Davidson: At time 1, she judges that breaking the resolution (watching the movie) is the best course of action because it yields -2 utility versus -2.6 for sticking. Therefore, she acts in accordance with her all-things-considered judgment. No akrasia.

      - Holton: The resolution was formed at time 0 to resist the anticipated temptation at time 1. She breaks the resolution at time 1 even though there are no new reasons (no change in circumstances). This is a case of unreasonably revising a resolution in the face of temptation, which constitutes weakness of will.

   3. Which feature is doing the work?

      The key features are:
        - The no-new-information clause: without it, we could attribute the change to new reasons and then it might be a reasonable revision.
        - The sophistication: she correctly predicts her future preferences and sets up the device accordingly.
        - The commitment device: without it, there would be no resolution to break (or it would be a resolution without a penalty, so breaking might not be a failure).

      But note: the flip in preferences is due to present bias (β<1). The penalty is chosen so that from the perspective of time 0, the penalty makes sticking better, but at time 1, the immediate gratification of the movie looms large and the penalty is in the future and hence discounted.

   4. Ablations:

      (a) Remove the commitment device: Then there is no penalty. Without the penalty, at time 0 she would prefer to break (because without penalty: breaking gives βδ*(10) + βδ²*(-10) = 8 - 8 = 0, and sticking gives -1.6, so breaking is better at time 0). Then she doesn't form a resolution to stick. At time 1, she breaks and that is consistent with her time 0 judgment. So it's not a case of weakness of will by either account.

      (b) Remove sophistication (naive agent): If she is naive, she believes that at time 1 she will not have present bias (i.e., she thinks she will use δ=1). Then at time 0, she thinks that at time 1 she will evaluate:

          Stick: -5 + 1*3 = -2
          Break: 10 + 1*(-10) = 0   [without penalty? but she set up the penalty?]

          Actually, she sets up the penalty because she is sophisticated? If she is naive, she might not set up the penalty because she believes she will stick without it. But let's assume she sets it up for some other reason? However, the case requires that she sets up a commitment device. 

          Alternatively, a naive agent might not set up the device at all because she underestimates the temptation. Then we don't have the resolution. So the case collapses.

          We need the sophistication to form the resolution. Without sophistication, she would not form the resolution because she would think that she will stick without it. So the resolution wouldn't exist. Therefore, the case collapses.

      (c) Remove the no-new-information clause: Suppose new information comes in. For example, the movie turns out to be a masterpiece that she absolutely must see. Then breaking the resolution would be a reasonable change. Then Holton would not call it weakness of will. So the split collapses: Davidson would say she is acting on her best judgment (with new information) and Holton would say the revision is reasonable.

   5. The best attack from the Davidsonian side:

      The Davidsonian might argue that at time 0, she formed an all-things-considered judgment that she should stick, and at time 1 she acts against that earlier judgment. But Davidson requires that she acts against her judgment *at the time of action*. So that attack doesn't work.

      Alternatively, the Davidsonian might argue that at time 1, her judgment is clouded by the temptation. She doesn't form a proper all-things-considered judgment because the desire for the movie is too strong. But the case is set up so that she is a sophisticate: she is coolly calculating the discounted utilities. The calculation at time 1 is rational given her discount function.

      The more biting attack: at time 1, she is not forming an all-things-considered judgment because she is not taking into account the reasons that she had at time 0? But in the case, the penalty is designed to represent the reasons from time 0. And she does take it into account (she knows she will lose the concert and waste money) but discounts it. So she is taking all reasons into account, but discounting the future.

      The Davidsonian might insist that an all-things-considered judgment should be made without temporal discounting? But that would be imposing a particular view of rationality. Davidson's account does not specify that discounting is irrational.

      The best attack: At time 1, her judgment is not truly all-things-considered because she doesn't give proper weight to her past commitment. But Davidson doesn't require that. He requires that the agent acts against what she judges best at the time. And in the case, she judges that breaking is best.

      So to block this attack, we must ensure that the agent at time 1 is in a normal state of mind (not overcome by passion) and is making a rational calculation (by the standards of hyperbolic discounting). The case does that.

   6. Is β-δ machinery load-bearing?

      The key is that there is a preference reversal due to time. The β-δ model is a specific way to model this reversal, but any model of time-inconsistent preferences that leads to a reversal would work. For example, a simple reversal without a specific discount function would also work if it leads to the same flip. However, the β-δ model is useful because it provides a clear quantitative structure and is standard in the literature. Moreover, it allows us to compute the exact penalty that makes the flip happen. So for the purpose of the thought experiment, it is useful to have the machinery to show the flip in a precise way. But the core idea (preference reversal over time) is what matters.

      However, note: without the present bias (β=1), the flip would not occur. So the machinery is not just decoration; it explains why the flip happens.

      But the case could be made with any model that produces a similar reversal. The β-δ model is a means to an end.

   Therefore, the case satisfies the constraints.

