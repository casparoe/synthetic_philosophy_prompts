answer: |-
  ### Thought Experiment: Claire's Deadline Dilemma

  **Scenario:**  
  Claire, a freelance writer, has a tight deadline in two days. She knows that tomorrow she'll be tempted to watch a blockbuster movie instead of working, which would force her to rush the work on the deadline day, lowering its quality. To resist this, she sets up a commitment device: she prepays $50 for a gourmet cooking class on the deadline evening, which she’d enjoy moderately but would forfeit if she skips work tomorrow. She resolves to work tomorrow and attend the class. The penalty is nonrefundable and stings her budget, but isn’t catastrophic. On the day of temptation, despite no new information (the movie isn’t special, her workload is unchanged), Claire watches the movie. She knows this means rushing work, forfeiting the class, and losing $50, but does it anyway.

  ---

  ### 1. Arithmetic (β-δ Model)  
  - **Discounting Parameters**: β = 0.8 (present bias), δ = 1 (no long-term discounting).  
  - **Utilities**:  
    - **Immediate gratification** (movie day): +10 (pleasure).  
    - **Work disutility** (movie day): −5 (effort).  
    - **Rushed work disutility** (deadline day): −10 (stress).  
    - **Cooking class utility** (deadline day): +6 (enjoyment).  
    - **Penalty disutility** (deadline day): −4 (wasted $50 + regret).  

  **At Time 0 (planning day)**:  
  - *Stick to resolution*: Work movie day (−5), attend class deadline day (+6).  
    Discounted utility: βδ(−5) + βδ²(6) = 0.8 × (−5) + 0.8 × (6) = **−4 + 4.8 = +0.8**.  
  - *Break resolution*: Movie (+10), rush work (−10), penalty (−4).  
    Discounted utility: βδ(10) + βδ²(−10−4) = 0.8 × (10) + 0.8 × (−14) = **8 − 11.2 = −3.2**.  
    → **Preference: Stick (+0.8) > Break (−3.2)**.  

  **At Time 1 (temptation day)**:  
  - *Stick to resolution*: Work now (−5), class later (+6).  
    Discounted utility: −5 + βδ(6) = −5 + 0.8 × (6) = **−5 + 4.8 = −0.2**.  
  - *Break resolution*: Movie now (+10), rush work/penalty later (−14).  
    Discounted utility: 10 + βδ(−14) = 10 + 0.8 × (−14) = **10 − 11.2 = −1.2**.  
    → **Preference: Break (−1.2) > Stick (−0.2)**.  

  **Flip**: From Time 0, sticking is better; at Time 1, breaking is better due to present bias (β discounts future costs/benefits).

  ---

  ### 2. Verdicts  
  - **Davidson’s Judgment Account**: **No akrasia**.  
    *Why*: At Time 1, Claire’s all-things-considered judgment (based on discounted utilities) favors breaking (−1.2 > −0.2). She acts *with* her best judgment at the moment of action.  
    *Hangs on*: The utility calculation at Time 1 shows breaking is optimal given her present-biased preferences.  
  - **Holton’s Resolution Account**: **Weak-willed**.  
    *Why*: Claire unreasonably revises a resolution formed to resist a predicted temptation, despite no new information. The resolution was designed to protect her long-term goal, and she abandons it for transient gratification.  
    *Hangs on*: The resolution was explicitly set against this exact temptation, and she revises it under temptation’s influence.  

  ---

  ### 3. Key Feature Doing the Work  
  The **no-new-information clause** combined with the **resolution targeting the predicted inclination** creates the split. Sophistication (knowing she’d face this temptation) ensures she forms the resolution *because* she predicts her future preference reversal. Without sophistication, she might not form the resolution at all (see Ablations).  

  ---

  ### 4. Ablations  
  - **(a) Remove commitment device**:  
    Collapses to **bog-standard akrasia**. Without a penalty, Davidson sees akrasia: at Time 1, she acts against her Time 0 judgment (which still favors sticking). Holton might not apply without a resolution.  
  - **(b) Remove sophistication (naive agent)**:  
    **Case collapses**. A naive agent believes she won’t be tempted, so she wouldn’t set up the device or form a resolution. No resolution to break → no Holtonian weakness.  
  - **(c) Add new information** (e.g., movie is a rare masterpiece):  
    Collapses to **sensible change of mind**. Both accounts agree: breaking is reasonable (Davidson: aligns with new judgment; Holton: revision isn’t unreasonable).  

  ---

  ### 5. Best Davidsonian Attack  
  **Attack**: Claim Claire acts against her *Time 0 judgment*.  
  **Response**: Davidson defines akrasia as acting against *concurrent* judgment—not past judgments. At Time 1, her judgment favors breaking.  
  **Biting Counter**: Argue that her Time 1 desire "hijacks" her judgment, making it non-all-things-considered.  
  **Block It By**: Emphasizing Claire’s sophistication. She coolly calculates utilities at Time 1 (no passion overwhelming reason). Her judgment is "all-things-considered" by her own rational standards (β-δ preferences).  

  ---

  ### 6. Is β-δ Machinery Load-Bearing?  
  **Yes, but minimally**. Any preference reversal model (e.g., visceral urges) could generate a split, but β-δ:  
  - Quantifies the reversal cleanly (penalty calibration requires discounting math).  
  - Embodies sophistication (she predicts her own β).  
  - Avoids "irrationality" accusations: the reversal is consistent with quasi-hyperbolic preferences.  
  *Simpler alternative?* Anecdotal reversals (e.g., "I’ll regret this later") work, but β-δ provides rigor for your seminar’s focus on self-binding.  

  ---  
  **Conclusion**: The case satisfies all constraints. Claire is a sophisticate; the penalty is calibrated; no new information intrudes; and the accounts cleanly split on whether her action is weak-willed. Use β-δ to ground the preference reversal in a standard model, but stress that the core is the *structure* of resolution-breaking under predicted temptation.
