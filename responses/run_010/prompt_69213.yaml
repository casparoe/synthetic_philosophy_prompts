answer: |-
  Below is a decision tree designed as a "sorting instrument" for principles of democratic constituency. It uses concrete cases to avoid abstract labels, fits within 10 questions, and maps the logical space of the debate you described. The tree prioritizes fork points that reveal genuine disagreements (e.g., affectedness vs. subjection, justifiability to the excluded, circularity). Each question is grounded in a real-world scenario and phrased as a plain claim. Positions (leaves) are named, defined, and critiqued with their "most awkward commitment." Unoccupied coherent cells and inseparable leaves are noted at the end.

  ---

  ### **Decision Tree: Who Belongs in the Demos?**
  *Start at Question 1. Answer Yes (Y) or No (N).*

  1. **In the incinerator case, should non-citizen residents of the affected neighborhood get to vote in the city election?**  
     *(Tests: Is citizenship essential, or can residency/sujbection suffice?)*  
     - **Y** → Go to Q2.  
     - **N** → Go to Q6.  

  2. **In the overseas military base case, should the host-country neighbors (affected by noise/pollution) get a vote in the base-owning country’s elections?**  
     *(Tests: Does affectedness extend beyond territory?)*  
     - **Y** → Go to Q3.  
     - **N** → Go to Q4.  

  3. **Should voting power for a new data center be proportional to how much groundwater/energy it takes from each person?**  
     *(Tests: Can affectedness be operationalized as degrees?)*  
     - **Y** → **Leaf: Weighted Affected Interests**  
     - **N** → Go to Q5.  

  4. **Should a visitor arrested in the city for petty theft get to vote in the next city election?**  
     *(Tests: Does subjection to coercion include temporary/non-resident cases?)*  
     - **Y** → **Leaf: All-Subjected Principle**  
     - **N** → **Leaf: Residency Principle**  

  5. **Should only people impacted by water rates vote on selling the city’s water utility, excluding others in the city?**  
     *(Tests: Can the demos be redrawn per issue?)*  
     - **Y** → **Leaf: Issue-Specific Demos**  
     - **N** → **Leaf: Territorial Peoplehood**  

  6. **Should citizens who emigrated decades ago and have no ties get to vote in national elections?**  
     *(Tests: Does citizenship override residency/affectedness?)*  
     - **Y** → **Leaf: Extraterritorial Citizenship**  
     - **N** → Go to Q7.  

  7. **In the river pollution case, should the downstream country’s residents get a vote in the upstream country’s policy?**  
     *(Tests: Can affectedness override territorial boundaries?)*  
     - **Y** → Go to Q8.  
     - **N** → Go to Q9.  

  8. **Should future generations get an equal vote on a 50-year infrastructure bond?**  
     *(Tests: Does affectedness include non-present entities?)*  
     - **Y** → **Leaf: Intergenerational Affectedness**  
     - **N** → Go to Q10.  

  9. **Should the whole country vote on a region’s secession, not just the region?**  
     *(Tests: Can the demos be defined democratically without circularity?)*  
     - **Y** → **Leaf: Higher-Order Demos**  
     - **N** → **Leaf: Self-Determination Priority**  

  10. **Is "historical borders are morally neutral" a sufficient answer to why we exclude affected non-residents?**  
      *(Tests: Is historical contingency a defensible principle?)*  
      - **Y** → **Leaf: Historical Boundaries**  
      - **N** → **Leaf: Affected Interests (Non-Operationalized)**  

  ---

  ### **Leaves: Positions and Key Commitments**
  *(Name, Constituency Principle, Most Awkward Commitment)*  

  | Leaf Name | Constituency Principle | Most Awkward Commitment |
  |----------|------------------------|-------------------------|
  | **Weighted Affected Interests** | Everyone affected gets fractional voting power weighted by degree of impact. | Handling the **data center case**: Quantifying "degree of impact" for diffuse harms (e.g., climate change) invites arbitrary math. |
  | **All-Subjected Principle** | Everyone subject to the coercive enforcement of a decision gets an equal vote. | Handling the **visitor arrest case**: A tourist’s vote on long-term city policy prioritizes fleeting subjection over stake. |
  | **Residency Principle** | All residents get an equal vote, regardless of citizenship or affectedness beyond borders. | Handling the **river pollution case**: Downstream neighbors endure harm but have no formal voice. |
  | **Issue-Specific Demos** | The demos is redefined for each decision to include everyone affected by that issue. | Handling the **secession referendum**: Defining the "affected" for meta-issues (like sovereignty) is circular or infinite. |
  | **Territorial Peoplehood** | A fixed group sharing a territory (residents) governs itself, regardless of cross-border effects. | Handling the **overseas military base**: Host-country neighbors lack recourse against imposed harms. |
  | **Extraterritorial Citizenship** | All citizens vote, even if non-resident and unaffected by current decisions. | Handling the **emigrant case**: A lifelong expat votes on policies with zero impact on their life. |
  | **Intergenerational Affectedness** | Everyone affected, including future people, gets an equal vote (via proxies). | Handling the **50-year bond**: Practical representation for non-existent people is speculative or undemocratic. |
  | **Higher-Order Demos** | The demos is defined by a larger pre-existing polity (e.g., the whole country for secession). | Handling the **incinerator case**: The higher demos may override local stakes (e.g., non-citizen residents). |
  | **Self-Determination Priority** | The group directly governed decides its own boundaries (e.g., only the region in secession). | Handling the **circularity challenge**: Defining "directly governed" assumes a prior demos, risking exclusion (e.g., minorities). |
  | **Historical Boundaries** | Existing borders define the demos; no further justification is needed. | Handling the **company town**: De facto governance without legal coercion is ignored, leaving residents powerless. |
  | **Affected Interests (Non-Operationalized)** | Everyone affected gets an equal vote, but no weighting or issue-specific adjustment. | Handling the **incinerator vs. military base**: Equal votes for minimally/massively affected groups inflates minor stakes. |

  ---

  ### **Notes on the Tree**
  1. **Inseparable Leaves**:  
     - **Affected Interests (Non-Operationalized)** and **All-Subjected Principle** collapse in 90% of real cases. They only diverge in contrived scenarios:  
       - *Where they align*: City laws (residents are both subjected and affected).  
       - *Where they part*: The **overseas military base** (host neighbors are *affected* but not *subjected* to the base’s laws) or the **company town** (residents are *subjected* to de facto rules but not legally coerced). The tree forces separation at Q2 (military base) and Q4 (temporary visitors).  

  2. **Coherent but Unoccupied Cells**:  
     - **Fixed demos combining subjection + affectedness**: Logically coherent (e.g., "vote if subjected AND affected"), but no one defends it. *Why?* Redundant in practice (subjection implies affectedness), and it excludes uniquely affected groups (e.g., pollution victims).  
     - **Issue-specific fractional voting**: Combining Q3 (Y) and Q5 (Y) is coherent but unoccupied. *Why?* Unattractive—fractional weights + per-issue redefinition maximizes complexity with no added fairness.  
     - **Territorial + intergenerational**: Including residents and future people (Q8-Y from Q7-N path) is coherent but unexplored in theory. *Why?* Ignores non-resident affectedness (e.g., downstream neighbors).  

  3. **Weaknesses of the Tree**:  
     - **Circularity Question**: Handled indirectly in Q9 (secession), but the "higher-order demos" leaf (Q9-Y) kicks the can to a larger polity without resolving who defines *that* demos.  
     - **16-Year-Olds Omitted**: Age thresholds aren’t included because they reduce to broader principles (e.g., if affected/resident, why exclude?).  
     - **Company Town Ambiguity**: The tree treats it as a test for subjection (Q4), but private coercion isn’t legally binding, making it a poor fit for a state-centric tree.  
     - **Justifiability to Excluded**: Not a leaf but a meta-test; leaves like **Historical Boundaries** fail it (no justification), while **Affected Interests** and **Self-Determination** attempt it.  

  This tree isolates your roommate’s circularity challenge at Q9 and forces concrete trade-offs (e.g., Q2–Q3 pit affectedness against territorial integrity). Use the incinerator, military base, or secession cases to "test" positions in your reading group. The logical space reveals that no position escapes awkward commitments—the tree maps *why*.
