prompt: |-
  So I'm a junior and I run the economics club at my school. It's like 12 people, all of them have had AP stats so they know expected value cold, but basically zero philosophy. Next Wednesday I've got 30 minutes with a whiteboard and I want to teach them risk-weighted expected utility (the Buchak version), becuase I think it's genuinely cool that expected value isn't the last word on what's rational.

  Don't explain RWEU to me, I mostly get it — plan how *I* should explain it to them. What I need:

  - The order the pieces have to go in. Do I start from expected value and break it, or start with a story and back into the math? What depends on what — like can I say the word "rank" before they've got the idea that the whole shape of a gamble matters, or does that just confuse them?

  - The example. I was going to use phone insurance: pay $40 now to avoid a 5% chance of a $400 cracked screen. But our econ teacher sits in sometimes and he's definitely gonna say "that's just diminishing marginal utility of money, nothing new here," and I do NOT have a comeback. So: does that example actually survive his objection, or is it a bad choice, and what would an example have to look like to be immune to it? Give me something I could sketch on the board in two minutes.

  - The misconceptions. I'm pretty sure half of them will think I'm just changing the probabilities — like pretending the odds are worse than they really are — and the other half will decide risk aversion is a feeling and not a reason. Where exactly in the sequence do I kill each one? And what am I not thinking of that's going to bite me later?

  - Related: I've been describing it to people as "you line up the outcomes worst to best, and the weight on each one depends on how much of the distribution is underneath it." Is that gonna plant something wrong in their heads, or is it fine?

  Also tell me what I should flat out refuse to cover at this level and say so out loud, and give me one question to ask at the end that'll show whether it landed or they're just nodding at me.
reasoning: |-
  Okay, let me think through how to approach this economics club session on risk-weighted expected utility (RWEU). The user is a junior running a club with stats-savvy but philosophy-new members, and they want to teach RWEU effectively in 30 minutes. 

  First, I need to consider the user's specific concerns: the sequence of concepts, choosing a robust example, anticipating misconceptions, and framing the "ranking" concept correctly. The phone insurance example is problematic because the econ teacher might dismiss it as diminishing marginal utility - which is a valid point. So the example must isolate risk attitudes from wealth effects.

  For the sequence, starting with expected value makes sense since they know it well. Then I'd introduce a clear violation case - something where risk-averse choices contradict EU theory without wealth effects. The Allais Paradox is classic but might be too complex for 30 minutes. A simpler binary gamble with extreme outcomes could work better, like the $5000 vs death example. 

  The misconception about "changing probabilities" is crucial to address early. I should emphasize that the probabilities stay fixed - it's the weight we assign to outcomes that changes based on their position in the distribution. The "ranking" description seems fine as long as I clarify it's about outcome order, not probability manipulation.

  For the "risk aversion as feeling" objection, I need to position RWEU as modeling rational preferences that respect stochastic dominance, not just emotions. The risk function r(p) should be presented as a formal tool for weighting outcomes differently based on their rank.

  What to explicitly skip: the technical r(p) function properties, full axiomatics, and comparisons to Prospect Theory. The closing question should test if they grasp why RWEU isn't just EU in disguise - perhaps asking them to explain the core difference in their own words.

  The user's clearly put thought into this and wants to avoid pitfalls. Their awareness of potential misunderstandings (like probability confusion) shows good pedagogical instincts. I'll structure this to move from concrete to abstract, preempt major misconceptions, and give them tools to handle the econ teacher's objection.
answer: |-
  Here’s a battle-tested 30-minute game plan, optimized for stats-savvy students with no philosophy background. Focus on **conceptual clarity** and **killing misconceptions early**.

  ---

  ### **Order of Attack (Whiteboard Flow)**
  1. **Anchor in Expected Value (EV) [3 min]**  
     - Quick recap: "EV = Σ [pᵢ × Outcomeᵢ]. Rational agents maximize EV. Agreed?"  
     - *Example:* 50% chance of $100, 50% chance of $0 → EV = $50. Everyone prefers this to $40 cash? (Nods expected).  

  2. **Break EV with a Thought Experiment [5 min]**  
     - **The Extreme Gamble:**  
       *"Option A: 100% chance of $5,000.  
       Option B: 99% chance of $5,001, 1% chance of **DEATH**.  
       Who picks A? (Hands raise) Is this irrational by EV? B’s EV > $5,000!"*  
     - **Key Insight:** EV ignores *how bad* the worst outcome is. You care about the **structure** of the gamble, not just the average.  

  3. **Enter Risk-Weighted EU (RWEU) [7 min]**  
     - "Buchak says: Your attitude toward risk matters *beyond* the dollar amounts. You ‘distort’ probabilities based on **where outcomes rank**."  
     - **The Ranking Idea (Your Phrasing is PERFECT):**  
       *"Line up outcomes worst-to-best. The weight you give each outcome depends on ‘how much of the gamble is worse than it’."*  
       - Visual: Draw a gamble with outcomes -$100, $0, $100. Shade the "tail" below each outcome.  

  4. **The Math Lite [5 min]**  
     - "RWEU = Σ [wᵢ × U(Outcomeᵢ)]"  
     - Emphasize: **wᵢ ≠ pᵢ**!  
       - wᵢ depends on:  
         1. The outcome’s **rank** (worst? best? middle?)  
         2. Your **personal risk function r(p)** (how much you "discount" good outcomes when bad ones exist).  
     - *Risk-Aversion:* Underweight good outcomes when bad outcomes are possible (e.g., w(best outcome) < p(best outcome)).  

  ---

  ### **The Example That Survives Your Econ Teacher**
  **Ditch phone insurance.** Use this instead:  

  **"The Life Savings Gamble"**  
  - You have $100,000 life savings.  
  - **Option A:** Keep $100,000.  
  - **Option B:** 50% chance to win $150,000 // 50% chance to lose **EVERYTHING** ($0).  
  - *EV(B) = $75,000 < $100,000 → Risk-averse choice (A) aligns with EV. Now add...*  
  - **Option C:** 50% chance to win $100,001 // 50% chance to lose $99,999.  
    *EV(C) = $100,001 > $100,000.* **Who still picks A?** (Most will).  

  **Why This Works:**  
  - Marginal utility of money is ~linear at this scale (no "diminishing utility" dodge).  
  - Rejecting **C** (positive EV!) is pure **risk-aversion to catastrophic loss**.  
  - Teacher’s Objection Nuked: "Diminishing MU would make C *more* attractive (concave utility), but people reject it! This is about the *risk structure*."  

  *(Sketch: 3 payoff distributions on a number line. Show EV dots above/below $100k.)*

  ---

  ### **Slaying Misconceptions (When & How)**  
  1. **"You’re just changing probabilities!"**  
     - **KILL THIS FIRST** when introducing wᵢ.  
     - *Say:* "The *real* probabilities (pᵢ) are fixed by the gamble. wᵢ is a *weight* you apply based on **your fear of bad outcomes** and the gamble’s shape. It’s not a ‘fake probability’."  

  2. **"Risk aversion is just a feeling!"**  
     - **Crush during the Life Savings example:**  
       *"Is rejecting Option C irrational? It has higher EV! But if losing $99,999 ruins your life, preferring A isn’t emotional—it’s **consistent with valuing security over gambles with ruinous tails**. RWEU makes this rational."*  

  3. **Unspoken Misconception: "This is just EV with different utilities."**  
     - Preempt when defining wᵢ:  
       *"This isn’t about re-scaling outcomes (utility). It’s about **re-weighting probabilities** based on the gamble’s entire structure. Two people with the *same* utility function can differ in risk attitudes via r(p)."*  

  ---

  ### **What to Explicitly SKIP**  
  Announce upfront:  
  *"We’re skipping:  
  1. The exact math of r(p) (it’s calculus-heavy).  
  2. Axioms (for philosophers!).  
  3. Prospect Theory (that’s descriptive psychology; RWEU is *normative*).  
  Focus: Why EV isn’t the whole story for rational choice."*  

  ---

  ### **The Closing Question to Test Understanding**  
  **Ask:** *"In the Life Savings example, why does RWEU *explain* choosing A over C, but Expected Utility (with diminishing MU) **cannot**?"*  

  **What You Want to Hear:**  
  - "Diminishing MU would make the $100,001 less valuable, but C still has higher EU than A! Rejecting C only makes sense if you **overweight the catastrophic loss** — which RWEU does via the risk function."  

  If they nail this, they get it. If they retreat to "emotion" or "probabilities," clarify the rank-weighting again.  

  ---

  ### Why This Works  
  - Starts familiar (EV) → breaks it dramatically → replaces it intuitively.  
  - Your "ranking" explanation is **spot-on** — it emphasizes outcome order and tail risks.  
  - The example is teacher-proof and isolates risk-attitudes.  
  - Misconceptions are named and buried early.  
  - Tight scope keeps it brisk.  

  **Pro Tip:** Draw the gamble distributions like probability density functions (they know these!). Shade the "tail risk" area under the worst outcome to show why it gets extra weight. Good luck!
