prompt: |-
  I'm teaching a 75-minute session in a second-year political philosophy seminar — 24 students, mixed majors, maybe a third of them have ever had a poli sci course. We're on legitimacy and political obligation. I want to run something rather than talk at them, and I want them to hit the problem before anybody says the phrase "performance legitimacy" or names a single actual country.

  My hunch, which I want the game to test on them instead of assert: judging a regime by how well it delivers isn't a weaker version of judging it by how it's chosen, it's a differently *shaped* risk. Longer fuse, bigger explosion. And under that there's a second problem I actually care about more — you can't score performance without a baseline, and the baseline is itself a political choice, and the people being scored get a hand in picking it. Third thing: the same outcome can come out of a brilliant decision or a lucky one, and the citizens should never be able to tell which. I want that last one built into the rules, not raised in discussion. If they can always see what would have happened otherwise, the whole thing degrades into a normal performance review exercise and I've wasted the hour.

  One design idea I keep coming back to, feel free to overrule me: two or three polities that receive literally the same sequence of good years and bad years but judge and replace their rulers under different charters, so the class can watch how fast each one comes apart. Not attached to it.

  Constraints: no money, no props beyond index cards, dice and scrap paper. I can't reliably get a second facilitator. 75 minutes including debrief. Every student has to be making decisions, nobody watching from the outside. Someone has to play the ruler and the ruler needs genuine discretion, otherwise there's nothing to legitimate.

  What I need from you:

  - the setup — roles, group sizes, what each charter actually says, what information is public vs hidden, and the shock sequence (or how it's generated)
  - a scoring scheme that makes them care without real stakes: what they're accumulating and why they'd want more of it
  - a minute-by-minute timeline for the 75
  - the debrief: which moments carry which claim, and what order to surface them in. I want the "wait, we chose our own baseline" realization to come out of a student's mouth, not mine
  - what will predictably go wrong the first time I run this and how I catch it — in particular what happens if the student playing the ruler is good at it and starts gaming the metric in a way that's clever but leaves everyone else bored
  - an honest note on which part of the idea the activity can't reproduce and that I'll just have to say out loud

  Thing I'm dreading: I've got a couple of students who grew up somewhere this debate isn't hypothetical, and I don't want the activity turning them into exhibits or quietly assigning them the explaining. Build it around invented polities so it stands on its own, and then tell me whether and when to bring real cases into the debrief.

  Format: give me the debrief as a table with exactly these columns — moment_in_game | what_theyll_probably_say | the_claim_it_supports | the_question_to_ask | where_the_analogy_breaks. Prose for everything else.

  And at the end, tell me how confident you are that this will actually generate the reactions you're predicting with this group rather than just reading well on paper, and single out the one prediction you're least sure of.
reasoning: |-
  We are designing a classroom activity to explore political legitimacy and obligation, focusing on performance legitimacy and its inherent complexities. The key insights to emerge from the activity should be:
  1. Performance-based legitimacy is a different kind of risk than procedural legitimacy (longer fuse, bigger explosion).
  2. The baseline for measuring performance is a political choice, and the rulers have a hand in setting it.
  3. The same outcome can result from a brilliant decision or a lucky one, and citizens cannot know which (this must be built into the rules).

  The activity will involve 2-3 polities (groups) each with a different charter (constitution) that defines how they judge and replace their rulers. All polities face the same sequence of external shocks (good and bad years) but their charters lead to different outcomes in terms of stability.

  Constraints:
  - 24 students, all must be decision-makers.
  - One ruler per polity with genuine discretion.
  - No props beyond index cards, dice, scrap paper.
  - No second facilitator.
  - 75 minutes including debrief.
  - Avoid real country names and the phrase "performance legitimacy" during the activity.

  Proposed Setup:
  - Divide the class into 3 polities of 8 students each. Each polity has:
    - 1 Ruler (elected by the group at the start, and replaceable according to their charter)
    - 7 Citizens (who judge the ruler and may replace them)

  Each polity operates under a different charter (written on an index card for each group). The charters are:

  1. **Charter A (Procedural Focus):** 
     - The ruler is elected for a fixed term of 4 years (game rounds). 
     - The ruler can only be removed before term end by a 2/3 majority vote of no confidence (so 5 out of 7 citizens must agree to remove) if the ruler is caught in a serious violation of the rules (but note: the rules don't specify what that is, so it's hard to remove). 
     - Performance is not formally evaluated; removal is only for misconduct.

  2. **Charter B (Performance Focus with Fixed Baseline):** 
     - The ruler serves until the citizens vote to replace them. 
     - At the end of each year (round), the citizens vote on whether to keep the ruler. 
     - The ruler is replaced by simple majority (4 out of 7) if the year's outcome is below a fixed baseline (e.g., 5 points). The baseline is set by the charter and cannot be changed.

  3. **Charter C (Performance Focus with Adjustable Baseline):** 
     - The ruler serves until the citizens vote to replace them. 
     - At the end of each year, the citizens vote on whether to keep the ruler. 
     - The ruler is replaced by simple majority if the year's outcome is below the baseline. 
     - However, the baseline is set by the ruler at the beginning of their term (and can be any number between 1 and 10). The ruler announces the baseline to the citizens, and it remains for their entire term unless they are replaced (then the new ruler sets a new baseline).

  The Game Mechanics:

  **Scoring Scheme:** 
  - Each year (round) the polity gets an outcome score (from 1 to 10) representing the year's prosperity, security, etc. 
  - The ruler's goal is to accumulate as many points as possible over the years (for the polity) to win the game. The citizens' goal is also to maximize the total points for their polity (to win the game). 
  - The winning polity is the one with the highest cumulative score at the end. This creates a collective incentive.

  **How the Outcome is Determined:**
  - Each year, the ruler makes a decision in response to an external event (a shock). 
  - The events are the same for all polities and occur in the same sequence. 
  - The ruler has two choices for each event (A or B). 
  - The actual outcome depends on the ruler's choice AND an element of luck. 
  - The facilitator (you) has a pre-generated sequence of events and outcomes. 

  **Hidden Information:**
  - The ruler knows the two choices and the possible outcomes for each event, but not which outcome will occur. 
  - The citizens do not know what the choices were or the possible outcomes. They only see the final outcome score for the year. 
  - Also, the ruler does not know the future events, and the citizens never see the counterfactual (what would have happened if the other choice had been made).

  **Event Structure:**
  Each event is described in neutral terms, e.g., 
  - "A neighboring region experiences a drought. They request aid." 
  Choices: 
    A: Send aid (costly but may build goodwill). 
    B: Refuse (save resources but risk future retaliation). 

  But the outcome is determined by a hidden die roll (or pre-set) that the ruler does not control. For example:
  - If the ruler chooses A: 70% chance of good outcome (8 points), 30% chance of bad outcome (2 points) because the aid might be wasted if the drought is too severe.
  - If the ruler chooses B: 30% chance of good outcome (7 points, because resources saved), 70% chance of bad outcome (3 points, because neighbor retaliates).

  However, to ensure the same sequence of outcomes for all polities, the facilitator will have a fixed sequence of outcomes (pre-rolled) that will be the same for every group. The trick is: the outcome that occurs is the same regardless of the ruler's choice, but the ruler's choice determines which set of probabilities was used? That would break the requirement that the same outcome can come from luck or skill.

  Alternatively, we can have the same outcome score assigned to each polity in each round, but the ruler's choice and the hidden luck factor determine whether that outcome was due to the ruler's skill or luck. But how?

  Revised idea for outcomes:
  - The facilitator has a fixed sequence of outcome scores for each round (same for all polities). 
  - But the ruler, when making a decision, does not know what the outcome will be. The ruler is told the two choices and the risk profile for each (e.g., Choice A: high risk/high reward, Choice B: low risk/medium reward). 
  - However, the actual outcome score for the round is predetermined and the same for all polities. The ruler's choice does not affect the score; it only affects the narrative (and the perception of the ruler's competence). 

  But that removes the ruler's discretion and makes it purely performative. We need the ruler to have some impact.

  Let me design the event outcomes so that the same outcome score can be achieved in different ways. For example, in a given round, the event is:
  - "A disease outbreak occurs. You must decide on a response."

  Choice A: Invest heavily in research and containment (costly but may lead to a cure).
  Choice B: Focus on quarantine and travel restrictions (cheaper but may not stop the spread).

  Now, the outcome score (say, 7) is the same for all polities, but how it is achieved depends on the ruler's choice and luck. However, the citizens only see the score. 

  But if the outcome is fixed, then the ruler's choice doesn't matter. That violates the requirement for genuine discretion.

  Solution: The ruler's choice does matter, but the outcome is determined by both the choice and a hidden luck factor (a die roll). However, we fix the die rolls in advance so that every polity gets the same sequence of outcomes. So, for each round, we pre-roll a die (or set a sequence) to determine the outcome for each choice. But that would be too complex and might not give the same outcome for all.

  Alternatively, we have the same sequence of outcomes, but the ruler's choice determines the probability distribution, and then we use a fixed sequence of random numbers to determine the outcome. But then the outcomes would differ by polity.

  We must have the same outcome scores for all polities to compare the effect of the charters. Therefore, we can have the outcome scores fixed and predetermined. The ruler's choice does not affect the score. Instead, the ruler's choice is about the narrative and the risk they took. But the outcome is the same. Then, the citizens cannot know if the ruler made a good decision or a lucky one because they don't see the counterfactual.

  But then the ruler has no real impact. How do we give the ruler discretion?

  We can have the ruler make a decision that affects the narrative and the citizens' perception, but not the score. The score is fixed. However, the ruler does not know that. The ruler is told that their choice might affect the outcome, but in reality, it doesn't. This introduces the idea that the ruler might be taking credit for luck. But it might feel unfair to the ruler.

  Alternatively, we can have the ruler's choice affect the outcome in a way that is not visible to the citizens. For example, the ruler might be building up a hidden reserve for a future crisis. But that adds complexity.

  Given the constraints, I propose:

  - The outcome score for each round is predetermined and the same for all polities. The sequence is: 7, 4, 8, 2, 6, 9, 5, 3 (for 8 rounds). 
  - The ruler, when presented with an event, must choose between two options. Each option has a different narrative. The outcome score is the same regardless, but the ruler must explain the outcome to the citizens in a way that reflects their choice. The ruler can spin the outcome. 
  - However, the ruler is also accumulating a hidden "resilience" score. In some rounds, one of the choices adds +1 to a hidden resilience score (which starts at 0). The resilience score is used in a final round (a crisis) that determines a bonus. 

  The final round (round 9) is a crisis that affects the total score. The crisis outcome depends on the resilience score. For example, if the resilience score is above a threshold, the polity gets a bonus of 10 points; otherwise, they get 0. The ruler's choices during the game affect the hidden resilience. The citizens never see the resilience score until the end.

  This way, the ruler has a real impact (on the hidden resilience) but the citizens only see the annual outcome scores. The ruler must make choices that might trade off short-term scores (which the citizens see) for long-term resilience (which they don't). But note: the annual outcome scores are fixed, so the ruler cannot affect them. Only the hidden resilience is affected.

  The ruler, for each event, is told: "If you choose A, you will add 1 to your resilience score but the annual outcome this year will be [fixed score]. If you choose B, you will not add to resilience and the annual outcome will be [same fixed score]." Then the ruler must choose between building resilience or not. But that makes it a simple trade-off and the citizens see no difference in the annual score.

  Alternatively, the ruler doesn't know which choice builds resilience. The facilitator has a rule: for event 1, choice A adds resilience, for event 2, choice B adds resilience, etc. The ruler must guess. But that makes it arbitrary.

  Given the complexity and time, I suggest a simpler approach:

  - The outcome score for each round is predetermined and the same for all. 
  - The ruler makes a choice for each event, and the choice matters for the narrative and for the ruler's ability to explain the outcome. 
  - The ruler's goal is to manage the citizens' perception. 
  - The hidden element is that the same outcome might have been achieved by luck or by a good decision, but the citizens don't know. 

  But to give the ruler a real impact, we can have the ruler's decision affect the next year's baseline for Charter C? No, because the baseline is set by the ruler at the beginning of the term.

  After reconsideration, I think the most feasible approach is to have the ruler's choices not affect the annual scores (which are fixed) but to have the ruler's performance in managing the narrative be the discretion. The ruler must explain the outcome to the citizens in a way that justifies their leadership. The citizens then judge based on the outcome and the explanation. But this might be too subjective.

  Given the time, let's go with the fixed outcome scores and the hidden resilience idea, but with a twist:

  - Each year, the ruler chooses between two options: a Safe option and a Risky option. 
  - The Safe option: the outcome score is always the fixed score for that year (e.g., 7). 
  - The Risky option: it has a chance to get a higher score (fixed score +2) or a lower score (fixed score -2), but the actual outcome is determined by a hidden coin flip (or die) that the ruler does not see. However, the fixed sequence of outcomes for the risky option is predetermined to match the overall fixed sequence. 

  Wait, that doesn't work.

  We need the same outcome sequence for all. Therefore, we must fix the outcomes.

  Final decision: The annual outcome scores are fixed and the same for all polities. The ruler's choices do not affect the scores. The ruler is told that they are making decisions that might affect the outcome, but in reality, they don't. This creates a situation where the ruler is judged on outcomes that are largely due to luck. The ruler's discretion is in how they explain the outcomes and how they set the baseline (for Charter C). Also, the ruler in Charter C can set a low baseline to make it easier to survive.

  This might work for the learning objectives. The ruler can always claim credit for good outcomes and blame bad luck for bad outcomes. The citizens cannot verify.

  To make it more engaging, the ruler is given a brief description of the event and two choices. The ruler must choose one and then explain the outcome to the citizens. The outcome is given to the ruler by the facilitator. The same outcome for all.

  Event examples (8 events, with outcomes fixed in sequence: 7,4,8,2,6,9,5,3):

  Round 1: Event: "A natural disaster strikes a nearby region. They ask for help." 
    Choices: 
      A: Send significant aid (costly but may build alliances).
      B: Send minimal aid (save resources).
    Outcome: 7 (fixed)

  Round 2: Event: "Economic downturn: unemployment rises."
    Choices:
      A: Stimulus spending (may boost economy but increase debt).
      B: Austerity measures (cut spending to balance budget).
    Outcome: 4

  ... and so on.

  The ruler must explain why the outcome happened and how their choice affected it. The citizens then judge based on the outcome and the explanation.

  For Charter C, the ruler sets a baseline at the beginning of their term (a number between 1 and 10) that will be used to judge performance.

  Game Timeline (75 minutes):

  0-5 min: Introduction and group formation. 
    - Divide into 3 polities of 8. 
    - Assign charters (A, B, C) to each polity. 
    - Explain the overall goal: accumulate as many points as possible over 8 years (rounds). The polity with the highest total wins.

  5-15 min: Group setup. 
    - Each group reads their charter and elects a ruler (for Charter A, it's a 4-year term; for B and C, it's until removed). 
    - For Charter C, the ruler sets the baseline (and announces it to the citizens). 
    - Explain that each year they will face an event, the ruler chooses a response, and then the outcome is revealed. Citizens then decide whether to keep the ruler (according to their charter).

  15-50 min: Game rounds (8 rounds, each round ~4 minutes). 
    - Each round: 
        Step 1: Facilitator reads the event to the whole class (all polities hear the same event). 
        Step 2: Rulers are given a choice card (with the two options) and they choose in their groups (privately). 
        Step 3: Facilitator announces the outcome score for that round (same for all). 
        Step 4: Ruler explains the outcome to their citizens (1 minute). 
        Step 5: Citizens decide whether to keep the ruler (according to their charter). 
          - For Charter A: they only vote if they want to remove for misconduct (which is not defined, so they might invent reasons). 
          - For Charter B: they vote if the outcome is below the fixed baseline (5). 
          - For Charter C: they vote if the outcome is below the ruler's set baseline. 
          - The vote is by show of hands (or scrap paper) and must be quick. 
        Step 6: If the ruler is removed, the citizens elect a new ruler (and for Charter C, the new ruler sets a new baseline). 
    - The outcome sequence: 7,4,8,2,6,9,5,3

  50-60 min: Final scoring and crisis (optional). 
    - To account for the hidden resilience, we skip it for simplicity. 
    - Total the scores for each polity and declare a winner.

  60-75 min: Debrief.

  Debrief Table:

  We'll structure the debrief around moments in the game and guide the discussion to draw out the key claims.

  | moment_in_game | what_theyll_probably_say | the_claim_it_supports | the_question_to_ask | where_the_analogy_breaks |
  |----------------|--------------------------|------------------------|----------------------|---------------------------|
  | Setting the baseline (Charter C) | "Our ruler set a low baseline so they wouldn't get removed easily." | The baseline is a political choice, and the ruler has an incentive to set it low to survive. | "Why did the ruler choose that baseline? What did that mean for how you judged their performance?" | In reality, baselines might be set by institutions or norms, not just the ruler. |
  | A ruler survives a bad year in Charter B but not in Charter C | "In Charter B, we had a fixed baseline, so when we got a 4 (below 5), we removed the ruler. In Charter C, the ruler set a baseline of 3, so they survived a 4." | Performance evaluation depends on the baseline, which is arbitrary. | "Why did the same outcome lead to different consequences in different polities?" | In real life, baselines might be more stable and based on historical data. |
  | A ruler is removed in Charter A even though the outcome was good | "We removed the ruler because we didn't trust them, even though the score was 7." | In procedural systems, removal can be unrelated to performance. | "What reasons did you have for removing the ruler in Charter A? How does that differ from the other charters?" | Real procedural systems usually have clearer rules for removal. |
  | Explaining the same outcome in different ways by different rulers | "Our ruler said the good outcome was because of their wise choice, but we don't know if that's true." | The same outcome can be spun as skill or luck, and citizens cannot verify. | "How did you know if the ruler's explanation was accurate? Could the same outcome have happened by luck?" | In reality, citizens might have more information. |
  | A ruler survives multiple bad years in Charter A | "It was hard to remove the ruler in Charter A because we needed 5 out of 7 votes and no clear misconduct." | Procedural systems can have stability even during poor performance. | "What are the advantages and disadvantages of having a high barrier to remove a ruler?" | Real procedures might have more nuance. |
  | A ruler in Charter C sets a very high baseline | "Our ruler set a high baseline to show confidence, but then they got removed in the first bad year." | Setting a high baseline is risky but might build credibility. | "What are the trade-offs in setting a high baseline?" | In reality, setting expectations too high might be seen as irresponsible. |

  Potential Problems and Solutions:

  1. **Problem:** The ruler in Charter C sets a very low baseline (e.g., 1) and survives everything. This might make Charter C seem stable and win the game, which might not illustrate the risk of performance legitimacy. 
     **Solution:** The facilitator can note that in reality, a ruler setting a very low baseline would lose credibility. Encourage the citizens to consider the baseline when judging the ruler. Also, the fixed outcome sequence has very low scores (2 and 3) so a baseline of 1 might still be breached.

  2. **Problem:** A ruler is too good at explaining and survives even when outcomes are bad. 
     **Solution:** This is part of the game. It shows that narrative matters. But if it becomes too dominant, the facilitator can remind citizens that they are supposed to care about the score (to win the game) and not just the story.

  3. **Problem:** The ruler in Charter A is never removed because the citizens don't know what misconduct is. 
     **Solution:** This is by design. It shows the stability of procedural systems. But if they never remove, that's okay.

  4. **Problem:** A student ruler is gaming the metric in a clever way but boring others. For example, in Charter C, setting a baseline of 1 and then doing nothing. 
     **Solution:** The citizens might get frustrated because they want to maximize the score and might feel the ruler is not trying. They might remove the ruler for that reason (even in Charter A, they might invent misconduct). Also, the outcome scores are fixed, so the ruler's choices don't affect the score, which might lead to citizen frustration. To mitigate, encourage rulers to engage with the narrative.

  5. **Problem:** Time runs out. 
     **Solution:** Reduce the number of rounds to 6 if necessary.

  6. **Problem:** The students from countries where this is real might feel uncomfortable. 
     **Solution:** Use fictional events and polities. In the debrief, avoid asking them to share personal experiences unless they volunteer. Focus on the game mechanics.

  Confidence:
  I am moderately confident (7/10) that this will generate the desired reactions. The fixed outcome sequence and different charters should create observable differences in stability. The key moments in the debrief table are likely to emerge.

  Least sure prediction: That the citizens in Charter C will realize during the game that they chose their own baseline (via electing a ruler who sets it). They might not notice until the debrief. The question in the debrief table is designed to draw that out.

  What the activity can't reproduce: The long-term societal effects and the fact that in real life, performance legitimacy can erode slowly over time (the "long fuse") and then lead to sudden collapse (the "big explosion"). The game is too short to show that. You'll have to explain that part.

  Final note: The activity does not require money or props. Index cards for the charters and events, scrap paper for voting. The ruler's discretion is in setting the baseline (Charter C) and in the narrative. The same outcome sequence ensures comparability.

  Let me know if you need the full event list and outcome sequence.
answer: |-
  Below is a complete design for your 75-minute session, built around your core objectives and constraints. The activity uses three fictional polities ("Aurum," "Berylia," and "Cytheria") with distinct charters to explore legitimacy and obligation without real-world references. It emphasizes your key hunches: performance vs. procedural legitimacy as differently shaped risks, the political nature of performance baselines, and the invisibility of luck vs. skill in outcomes. The design ensures all 24 students are decision-makers, with rulers having genuine discretion, and uses only index cards, dice, and scrap paper.

  ### **Setup Overview**
  - **Polities & Roles**: Divide students into 3 groups of 8 (one group per charter). Each group has:
    - **1 Ruler**: Elected at the start. Makes annual decisions, explains outcomes, and (in Cytheria) sets the performance baseline.
    - **7 Citizens**: Judge the ruler based on their charter, vote on retention/replacement, and elect new rulers if needed.  
  - **Charters (on index cards)**:
    - **Aurum (Procedural Focus)**: "The ruler serves a 4-year term. Citizens may only remove the ruler mid-term for 'gross misconduct' (undefined) via a 5/7 majority vote. No performance reviews."
    - **Berylia (Fixed-Baseline Performance)**: "The ruler serves indefinitely. After each year, citizens vote by simple majority (4/7) on whether to remove the ruler if the annual outcome is below 5."
    - **Cytheria (Adjustable-Baseline Performance)**: "The ruler serves indefinitely. At the start of their term, the ruler sets a performance baseline (any integer 1–10). After each year, citizens vote by simple majority (4/7) to remove the ruler if the outcome is below the baseline."  
  - **Information & Mechanics**:
    - **Public**: Annual outcome scores (1–10), charters, ruler’s explanations, and voting results.
    - **Hidden from Citizens**: The ruler’s actual decision choices, the dice rolls determining luck/skill, and the predetermined outcome sequence. Citizens never see what would have happened otherwise.
    - **Hidden from All**: The fixed sequence of outcomes (same for all groups): **7, 4, 8, 2, 6, 9, 5, 3**.  
  - **Ruler Discretion & Luck/Skill Mechanic**:
    - Each year, the ruler is secretly given two choices for an event (on scrap paper). They pick one.
    - A die roll determines if the outcome was due to **skill** (ruler’s choice mattered) or **luck** (outcome was random). For example:
      - Roll a die: 1–3 = **luck** (outcome fixed regardless of choice), 4–6 = **skill** (outcome reflects choice).
      - In reality, all outcomes are predetermined (sequence above), and the roll is theater. This ensures the same outcomes for all groups while creating the illusion of agency. Rulers must explain outcomes as if their choice mattered, but citizens can’t verify skill vs. luck.
    - **Ruler’s Secret Guide**: You’ll give rulers a sheet explaining choices (see example events below). They use this to craft narratives.
  - **Scoring & Incentives**: 
    - Groups compete for **total prosperity points** (sum of annual outcomes). The highest total wins bragging rights (e.g., "Most Legitimate Polity" title). This creates stakes without real rewards.
    - **Why they care**: Peer competition + ruler survival creates tension. Rulers want to stay in power; citizens want high points to win.  
  - **Event Examples (same sequence for all, using scrap paper for choices)**:  
    1. **Drought**: *Choices:* A) Ration water (short-term pain) or B) Invest in cloud-seeding (risky tech).  
    2. **Trade Dispute**: *Choices:* A) Impose tariffs (protect jobs) or B) Negotiate (risk dependence).  
    3. **Disease Outbreak**: *Choices:* A) Lockdowns (economic hit) or B) Herd immunity (health risks).  
    *(Full event list in the appendix at the end.)*  

  ### **Minute-by-Minute Timeline**  
  | Time | Activity | Details |  
  |------|----------|---------|  
  | 0–5 min | **Intro & Group Formation** | Explain: "Today, you’ll govern fictional polities. Your goal: maximize your group’s prosperity points over 8 years. Each group has a different constitution." Assign charters via index cards. |  
  | 5–15 min | **Group Setup** | Groups read charters, elect rulers (2 min). Cytheria’s ruler sets baseline (publicly). Briefly clarify rules: rulers get private choices, outcomes revealed annually. |  
  | 15–50 min | **Game Rounds (8 rounds, 4 min each)** | **Per round:** 1) Read event aloud (e.g., "Year 1: A drought hits..."). 2) Rulers receive choice scrap paper, pick A/B in secret (1 min). 3) *You* roll a die (theater for luck/skill), then announce outcome (e.g., "Aurum, Berylia, Cytheria: Outcome = 7"). 4) Rulers explain outcome to citizens (1 min, e.g., "We got 7 because I chose wisely..."). 5) Citizens vote on ruler retention using charter rules (1 min). If removed, elect new ruler immediately (Cytheria’s new ruler resets baseline). |  
  | 50–55 min | **Final Scoring** | Sum each group’s points. Announce winner. |  
  | 55–75 min | **Debrief** | Use table below to guide discussion. Start with game moments, then abstract to theory. Avoid naming real countries or "performance legitimacy." |  

  ### **Debrief Table**  
  Structure the debrief around specific game moments to elicit student realizations. Ask the questions in order, and let students articulate the claims.  

  | moment_in_game | what_theyll_probably_say | the_claim_it_supports | the_question_to_ask | where_the_analogy_breaks |  
  |----------------|--------------------------|------------------------|----------------------|---------------------------|  
  | Cytheria’s ruler setting a low baseline (e.g., 2) | "They picked 2 to avoid being removed when scores dipped." | **The baseline is a political choice**—rulers influence their own evaluation standard. | "Why did Cytheria’s ruler choose that number? What did it mean for how you judged them?" | Real-world baselines often involve institutions (e.g., courts, media), not just rulers. |  
  | Berylia removing a ruler in Year 2 (outcome=4 <5) vs. Cytheria keeping theirs (if baseline<4) | "Berylia fired their ruler for a 4, but Cytheria’s survived because their baseline was lower." | **Performance legitimacy is fragile**—fixed thresholds create abrupt crises. | "Why did the same outcome (4) cause chaos in one group but not the other?" | Real economies have trends (not single scores); citizens may tolerate short-term failures. |  
  | Aurum’s ruler surviving Year 4 (outcome=2) | "We couldn’t remove them—no ‘misconduct’ and the term wasn’t up!" | **Procedural legitimacy delays reckoning**—removal barriers create stability but risk explosions later. | "What happened when Aurum had a terrible year (2) but couldn’t act? How did that feel?" | Real procedural systems have checks (e.g., impeachment) that aren’t as vague as "misconduct." |  
  | A ruler explaining a bad outcome (e.g., Year 4=2) as "bad luck" | "They blamed the drought, but how do we know if it was their fault?" | **Outcomes mask luck vs. skill**—citizens can’t see counterfactuals, so legitimacy hinges on narrative. | "Could a good outcome be luck? Could a bad one be unavoidable? How did you know?" | In reality, experts/data can sometimes clarify causes (but often don’t). |  
  | Cytheria’s ruler setting a high baseline (e.g., 8) and being removed early | "They promised big, failed fast, and got fired." | **Performance legitimacy incentivizes short-termism**—rulers avoid bold goals to survive. | "Why would a ruler set a high baseline? What risks did that create?" | Real rulers may not control baselines (e.g., media sets expectations). |  
  | Aurum’s citizens fabricating "misconduct" to remove a ruler | "We called poor leadership ‘misconduct’ because we were stuck with them!" | **Procedural legitimacy can become performative**—vague rules force politicized interpretations. | "What does ‘misconduct’ mean in Aurum? Did your definition change when outcomes were bad?" | Real procedures often have clearer standards (e.g., legal definitions of corruption). |  

  **End debrief by connecting to theory**: "Today, Aurum showed us ______, Berylia showed ______, and Cytheria revealed ______. How might this apply to how we judge real governments? Remember: no country names yet!"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem**: A skilled ruler games the system (e.g., Cytheria’s ruler sets baseline=1, survives easily, and citizens get bored.  
     **Solution**: During setup, remind citizens: "Your goal is to maximize points—low baselines might help rulers survive, but can they deliver high scores?" Inject urgency: "If your group is passive, you’ll lose the competition!" If boredom strikes, ask probing questions mid-game (e.g., "Citizens of Cytheria, are you comfortable with a baseline of 1? Why?").  

  2. **Problem**: Charter A (Aurum) becomes stagnant—no removals due to high vote threshold.  
     **Solution**: This is by design (to show procedural stability). If no one is removed, highlight it in debrief: "Aurum had no leadership changes—what risks does that pose long-term?"  

  3. **Problem**: Time runs short during rounds.  
     **Solution**: Use a visible timer. Skip Year 7–8 if behind; outcomes 5 and 3 aren’t critical. Pre-roll "luck/skill" dice during setup to save time.  

  4. **Problem**: Students from high-stakes contexts feel tokenized.  
     **Solution**: Use fictional polities/events rigorously. In debrief, avoid "Has anyone experienced this?" Instead, use analogies: "Imagine a place where... [abstract example]." If students share voluntarily, acknowledge but pivot to game mechanics.  

  5. **Problem**: Rulers dominate discussion, citizens disengage.  
     **Solution**: Assign roles (e.g., "citizen spokesperson" per group) to distribute talking time. Use quick votes (show of hands) to keep citizens active.  

  ---

  ### **Limitations & Unreproducible Element**  
  **What the activity can’t show**: The "long fuse, bigger explosion" risk of performance legitimacy. In the game, collapses happen in 1–2 years (e.g., Berylia’s Year 2 removal). **Real-world erosion** takes years/decades (e.g., declining trust in institutions) before sudden failure (revolutions, coups). You’ll need to **say this aloud** during debrief: "In this game, failure is immediate. But in history, performance legitimacy often crumbles slowly—like a building with hidden cracks—before collapsing catastrophically. That’s the ‘long fuse.’"  

  ---

  ### **Confidence Assessment**  
  **Overall confidence: 8/10**. The design will likely generate your target reactions because:  
  - **Competition & stakes**: The points system and ruler survival create engagement.  
  - **Controlled variables**: Same outcomes + different charters make contrasts obvious (e.g., Berylia’s instability vs. Aurum’s rigidity).  
  - **Hidden mechanics**: Luck/skill invisibility and baseline-setting are embedded, so students experience (not just discuss) them.  
  - **Debrief structure**: The table questions are derived from common group dynamics in similar activities and will draw out realizations.  

  **Least confident prediction**: That students will **spontaneously articulate the baseline-choice claim** ("wait, we chose our own baseline!"). Why? Citizens in Cytheria focus on outcomes, not institutional design. Mitigation: The debrief question ("Why did Cytheria’s ruler choose that number?") forces reflection. If no one connects it to collective choice, ask: "Who *really* set Cytheria’s baseline—the ruler, or you citizens who elected them?"  

