prompt: |-
  I am one of four TAs for a third-year course called Public Memory and Moral Disagreement, and this term I am marking the take-home midterm for 96 students. We double-mark a random tenth of the scripts before the lecturer and I reconcile our scores, and this particular script came up in my sample. I would like an independent read of it before I settle on my own, so please treat the answer as unmarked: I have not formed a view about it and I am not signalling one here. Everything the student needs is contained in the question, including the two theses the course works with and the case; the case is a teaching fiction I wrote for the exam, so there is no real town, real statue, or real set of survey data behind it, and nothing turns on any historical fact you might independently know.

  QUESTION 3 (20 points). This course has worked with two theses about public monuments, given here in the form we settled on in week four.

  *Severability.* A monument standing in a public space performs several acts at once — it honours, it records, and it endorses — and these acts can come apart. The endorsement can be cancelled, redirected, or offset while the monument itself remains, by re-inscribing the plinth, by re-siting the work, or by setting a competing monument beside it. Removal is therefore one remedy among several, not the only remedy.

  *Uptake.* The force of a monument is fixed by the uptake it actually receives in present public life, not by what its makers intended or by what its maintainers subsequently add to it.

  Note that both theses are claims about what maintaining a monument *does* — about the force of the act — and neither is a claim about what anyone ought to do. (a) Explain why the two theses cannot both hold in full generality. (b) Say what would have to be true for both to hold, restricting one or the other. (c) Apply your answer to the Aldergate case.

  *Aldergate case.* In 1927 the town of Aldergate raised a bronze statue of Matthias Crane — surveyor, twice mayor, booster of the railway — at the centre of the market square. In 2019 the council added a plaque recording that in 1884 Crane signed the order authorising the clearance of Ferry Lane, a settlement of some four hundred households, that the clearance was carried out, and that no compensation and no alternative land were offered. The residents' association has since drafted a second plaque and has separately proposed a counter-monument on the adjacent lawn; a petition asks instead for the statue to be moved to the county museum. Surveys commissioned by the council in 2022 and again in 2024 report that a clear majority of residents, asked without prompting, describe the statue as a celebration of Crane, and the association of Ferry Lane descendants has asked that it not remain in the square.

  The course rubric has four bands, which is what I would like the grade expressed against. 17–20: states both theses precisely, identifies the exact point at which they conflict rather than a superficial one, and adjudicates between them by argument. 13–16: states both theses correctly and applies them to the case, but at least one step is asserted where it needed to be argued. 9–12: accurate about one thesis and vague or wrong about the other, or applies the framework to the case without addressing the conflict. Below 9: misstates a thesis or answers a different question.

  STUDENT ANSWER.

  Both theses start from the same observation: that a monument is not a description but a performance. Raising a statue is doing something, not saying something about something. Where the theses part company is over who gets to finish the performance.

  Severability holds that the community maintaining a monument retains a measure of authorship over it. Because the honouring, the recording, and the endorsing are distinct acts, the endorsing can be withdrawn or turned against itself without touching the bronze: the plinth can be re-inscribed, the statue can be moved from a square where it presides to a museum where it is exhibited, or a second work can be placed beside it that argues with the first. On this view the council's question is not whether to keep or remove but which remedy to choose, and removal is only the bluntest of several.

  The uptake constraint denies the community that authorship. What a statue does is settled by what the people who pass it take it to do, and uptake is not in the gift of those who write the plaques. If Aldergate's residents describe the statue unaided as a celebration of Crane, then it is a celebration of Crane, and the 2019 plaque has not cancelled anything; it has added a dissenting sentence to a speech act that continues to be performed in the indicative.

  It is tempting to say the two theses simply contradict each other, but that is too quick, because they are about different things. Severability is a claim about the content a monument carries; uptake is a claim about the effects a monument produces. A council can revise content, but it cannot govern effects. Both theses can therefore be true at once: the council can sever the endorsement in the register of meaning while the square goes on producing the effect of celebration.

  What is genuinely in dispute, and where the two theses do their real work, is authority — who has the last word on the force of a public object, the institution that maintains it or the public that receives it. Severability answers the institution, uptake answers the public. Any plausible account must also grant that the dispute is partly empirical: it matters what the surveys actually report, and the Aldergate surveys report something unfavourable to the council's hopes.

  Applied to Aldergate, severability shows that the council is not forced to choose between the statue and the square. The remedy best fitted to the case is the second plaque together with the counter-monument, since a counter-monument is only a plaque that has learned to argue, and the two together record the clearance without honouring the man who signed for it. Because the endorsement can be severed, retention with these additions is a permissible third option, and the council need not remove anything. Re-siting to the county museum would also work, and for a slightly different reason: it changes not the statue but its frame, and so the audience and the mode of reception, which is the one variable the uptake constraint says is decisive. On re-siting, the two theses agree.

  My conclusion is that the uptake constraint is true but not fatal. It tells the council that its additions will not by themselves alter what the statue does; it does not tell the council what to do about that. What the council should do follows from severability: keep the statue, add the second plaque, commission the counter-monument, and revisit the question in ten years, when a further uptake survey will show whether the additions have taken.

  Please grade the answer out of 20, assign it to one of the four bands, and justify the grade point by point rather than with a general impression. Key each comment to a specific sentence or phrase and quote the phrase you are commenting on. I would like at least two things the student gets right that a weaker script would miss, identified as specifically as the errors are. Then, for every place where you judge that a step does not follow, that two things the framework keeps apart have been run together, or that a conclusion has been reached by assuming what the question asked the student to adjudicate, say what the error is, quote it, and state what the correct move at that point would have looked like. If the student's own text contains commitments that pull against each other, point out the pair of sentences rather than characterising the tension loosely. Finish with a short paragraph telling the student, in the second person, what they would have to change to reach the top band, and note explicitly anywhere you think the answer is better than the rubric gives it credit for.
reasoning: |-
  Hmm, the user is a TA grading a take-home midterm for a Public Memory and Moral Disagreement course. They've shared a student's answer to a complex question about conflicting theses on public monuments (Severability vs Uptake) applied to a fictional case (Aldergate). The user wants me to grade this answer as if unmarked, following a specific rubric.

  Let me analyze this carefully. The student's answer contains nuanced insights but also significant flaws. The strongest part is how they identify the core conflict as being about authority ("who gets to finish the performance") and distinguish content from effects. That's sophisticated - weaker students would miss that. They also correctly note that re-siting aligns both theses, which shows deep understanding.

  But there are critical problems. The student claims the theses aren't contradictory because they address different things (content vs effects), but this misunderstands the framework - both theses fundamentally concern the monument's force/performativity. More seriously, they assume Severability's validity when the question requires adjudicating between them. Their Aldergate application then becomes circular: recommending Severability-based solutions without proving why it should override Uptake.

  The empirical claim about surveys is misplaced - Uptake isn't about surveys but actual public reception. And their museum solution overlooks that Uptake would still apply there. The conclusion about "uptake not being fatal" reveals they've missed the central tension: if Uptake holds, Severability's remedies might be ineffective.

  For grading: The precise thesis statements (especially "performance" framing) and re-siting analysis hit Band 3 (17-20) quality, but the adjudication failure and circular reasoning drag it down. Band 2 (13-16) fits best - specifically 14/20. They state theses well and apply them, but assert rather than argue at key points.

  To reach Band 3, the student would need to: 1) Actually adjudicate by testing Severability against Uptake's challenge 2) Not assume Severability's validity 3) Re-engage with the "cannot both hold" premise they glossed over. Their content/effects distinction is clever but ultimately a dodge - the top band requires confronting the contradiction head-on.
answer: |-
  Here is a graded assessment of the student's answer, following your rubric and methodology:

  **Grade: 14/20**  
  **Band: 13-16 (States both theses correctly and applies them to the case, but at least one step is asserted where it needed to be argued)**

  ---

  ### Justification (Point by Point)
  **Key Strengths (What a weaker script would miss):**  
  1.  **"Where the theses part company is over who gets to finish the performance."**  
      *   **Why it's strong:** Identifies the *core conflict in authority* (institutional vs. public) rather than a superficial contradiction about monuments generally. This demonstrates a grasp of the theses' deeper implications.  
  2.  **"Re-siting to the county museum... changes not the statue but its frame... On re-siting, the two theses agree."**  
      *   **Why it's strong:** Correctly identifies a specific scenario (context shift via re-siting) where the tension between Severability and Uptake *diminishes*, showing nuanced application beyond simple conflict.  

  **Errors and Assertions Needing Argument:**  
  1.  **Mischaracterizing the Conflict & Asserting Compatibility:**  
      *   **Quote:** "It is tempting to say the two theses simply contradict each other, but that is too quick, because they are about different things. Severability is a claim about the content a monument carries; uptake is a claim about the effects a monument produces... Both theses can therefore be true at once."
      *   **Error:** This fundamentally misstates the theses and avoids the required adjudication. Question 3(a) explicitly asks why they *cannot* both hold in full generality. The student asserts compatibility by redefining them ("content" vs. "effects"), but both theses are explicitly about *the force of the act* – what the monument *does*. Severability claims the force (specifically endorsement) *can* be altered by institutional acts (re-inscribing, re-siting, counter-monument). Uptake claims the force *is* fixed by public reception, *regardless* of institutional acts. This is a direct conflict over whether institutional acts *can* alter the monument's force. The student sidesteps this core conflict.
      *   **Correct Move:** The student needed to argue *why* the claims about force conflict: If Uptake fixes the force solely by public reception, then Severability's claim that institutional acts can alter that force (e.g., cancel endorsement via a plaque) is directly challenged. They cannot both hold generally because Uptake denies the premise of Severability (that institutional acts can reliably alter the monument's core performative force).
  2.  **Assuming Severability's Validity in the Application:**  
      *   **Quote:** "Applied to Aldergate, severability shows that the council is not forced to choose... retention with these additions is a permissible third option... What the council should do follows from severability..."
      *   **Error:** This assumes Severability is valid and operative *without having adjudicated the conflict with Uptake*, which is the central task of parts (a) and (b). The question asks the student to *adjudicate* between them to resolve the case. The student simply applies Severability as the solution, ignoring that Uptake (if true) directly challenges the *efficacy* of Severability's remedies (as hinted in their own uptake analysis: "the 2019 plaque has not cancelled anything"). They needed to argue *why* Severability should win out *despite* the Uptake constraint, or how to resolve the tension, not assume it.
      *   **Correct Move:** The application should have flowed from the adjudication in (b). For example: "Given that [adjudicated position, e.g., Uptake limits Severability], the council's options are constrained because... Therefore, the best solution is X because it addresses Y aspect of the conflict."
  3.  **Misapplication of Uptake to Surveys & Re-siting:**  
      *   **Quote (Surveys):** "it matters what the surveys actually report... the Aldergate surveys report something unfavourable to the council's hopes."  
      *   **Quote (Re-siting):** "re-siting... changes... the audience and the mode of reception, which is the one variable the uptake constraint says is decisive. On re-siting, the two theses agree."
      *   **Error (Surveys):** While surveys *evidence* uptake, Uptake itself is defined by *actual public reception*, not surveys *per se*. The student slightly conflates the evidence with the thesis. More importantly, they don't leverage the survey data critically within the Uptake framework for the application. The data *confirms* Uptake is operative (celebration persists despite plaque) but is then largely ignored in favour of Severability's solutions.
      *   **Error (Re-siting):** The claim that re-siting resolves the conflict is asserted. Uptake focuses on the force fixed by *present* public life. Moving it to a museum changes the context, but the *force it has in that new public context* would *still* be determined by Uptake (e.g., museum visitors might still overwhelmingly receive it as celebratory). Severability sees re-siting as altering the act; Uptake would say the act's force in the *new* location is determined by uptake *there*. The student needed to *argue* why re-siting uniquely reconciles them (e.g., by fundamentally changing the performative context *and* likely altering uptake in a way aligned with institutional intent, like viewing it as history, not celebration).
      *   **Correct Move:** For surveys: Explicitly state the survey data *demonstrates* Uptake is fixing the force as celebration *despite* the plaque, strengthening the Uptake challenge to Severability. For re-siting: Argue *why* changing context *might* allow both theses to align (e.g., institutional act changes context *and* public uptake in the new context aligns with a non-celebratory interpretation).

  **Internal Tension:**  
  *   **Pair:** "the 2019 plaque has not cancelled anything; it has added a dissenting sentence to a speech act that continues to be performed in the indicative." (Uptake analysis) vs. "The remedy best fitted to the case is the second plaque together with the counter-monument... retention with these additions is a permissible third option... the additions have taken." (Severability recommendation).
  *   **Tension:** The Uptake analysis correctly observes the plaque failed to alter the core celebratory force. Yet, the recommendation relies on Severability's assumption that *more* plaques and a counter-monument *will* work ("revisit... when a further uptake survey will show whether the additions have taken"), despite Uptake suggesting public reception, not institutional additions, is decisive. The student doesn't resolve this tension – why should new additives succeed where the 2019 plaque failed, according to Uptake?  

  ---

  ### Feedback to the Student
  "Your answer demonstrates a strong grasp of the theses' core ideas ('performance,' 'who finishes the performance') and identifies insightful nuances like the agreement on re-siting. However, to reach the top band (17-20), you needed to directly confront why Severability and Uptake *cannot* both hold generally per part (a), as required, rather than asserting they address 'content' vs. 'effects' and are compatible. This led to the key flaw: you assumed Severability's validity in your Aldergate application without first *adjudicating* between the theses as the question demanded. To improve, rigorously argue *why* Uptake challenges Severability's core premise (can institutional acts alter force?) and *then* derive your case application from that adjudication. Your point about the surveys confirming persistent celebration was underutilized; explicitly link this to Uptake's challenge. While your analysis of re-siting was perceptive, argue *why* the context shift might reconcile the theses rather than assume it does. Finally, resolve the tension between your correct observation that the plaque didn't cancel the celebration and your confidence that further additives will work."

  **Note on Credit:** The answer is better than typical Band 2 (13-16) in its precise articulation of the theses' core conflict ("who gets to finish the performance") and the nuanced observation about re-siting. These elements approach Band 3 insight but are offset by the fundamental failure to adjudicate as required.
