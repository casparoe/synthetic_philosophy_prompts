prompt: |-
  I have no academic training in philosophy — I work in freight logistics and read David Lewis's *Convention* slowly over one winter, mostly to understand why some of our depot practices change overnight while others never budge. Testing what I took from it, I built the argument below, and I cannot accept its conclusion.

  (1) On Lewis's account, a convention is a regularity in what a group repeatedly does such that: everyone conforms to it; everyone believes the others conform to it; that belief gives each person a reason to conform as well; general conformity is generally preferred to slightly-less-than-general conformity; and the regularity is not the only one that could have met those conditions — hence it is arbitrary which one the group ends up with.

  (2) Which side of the road a country drives on is arbitrary in exactly that way, and so is whether guests bring a dish or the host supplies everything.

  (3) Now take the norms I actually care about: keep your promises, don't lie, don't take what isn't yours. Each holds because nearly everyone conforms, nearly everyone believes nearly everyone else conforms, and that belief gives each of us a reason to conform — if everybody else had stopped keeping promises, my keeping mine would only make me the one person worth deceiving. Each is further held in place by the disapproval that meets anyone who breaks it.

  (4) So each satisfies every clause of (1), and each is therefore a convention in Lewis's sense.

  (5) So, by the last clause of (1), each has an alternative that would have satisfied the same clauses just as well.

  (6) For promise-keeping the alternative is universal treachery: a population in which nobody keeps a promise and nobody expects anyone to. It looks like an equilibrium in the same way, since no one gains by unilaterally starting to keep his word, so it satisfies the clauses too.

  (7) Therefore universal treachery is, on this account, an equally good solution to the same problem, and the arbitrariness Lewis identifies is not confined to which side of the road we use but extends to whether we keep our word at all.

  (8) Therefore no entrenched norm is better than the alternatives that would have sustained themselves equally well, and there is no footing from which to criticize one: the analysis cannot tell a decent norm from a merely habitual one.

  I reject (8) outright. Yet (3) and (4) are the part I find most convincing, and I would hate to lose them, since the thought that norms are held up by mutual expectations is the one real insight I got from the book. So: which step do you reject, why did it look so natural to me, and what do I pay in its place? If (6) is the culprit, I want to know what precisely disqualifies universal treachery as an alternative regularity, because it still looks to me like a state nobody could improve on by moving alone — and whether that disqualification also swallows my own examples in (2).
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're coming from a logistics background, not philosophy, and they read David Lewis's *Convention* to understand workplace norms. They built an argument that leads to a conclusion they find unacceptable—that moral norms like promise-keeping are arbitrary conventions, no better than universal treachery. 

  First, I need to identify where their reasoning goes astray. The key seems to be step (4), where they claim moral norms satisfy all Lewis's conditions for conventions. But Lewis's definition requires the regularity to be arbitrary, and moral norms might not be arbitrary in that sense. The user is attached to the idea that mutual expectations sustain norms, which is valid, but they're conflating all norms as equally arbitrary.

  I recall that for Lewis, conventions solve coordination problems where multiple equilibria exist, like driving sides. But moral norms often address different problems—like conflict resolution rather than coordination. Promise-keeping isn't just about coordination; it's about trust and cooperation in a way that driving sides aren't. Universal treachery might be an equilibrium, but it doesn't solve the same problem as promise-keeping. 

  The user might not distinguish between coordination problems and other social dilemmas. In treachery, there's no cooperation; it's a state of defection. Whereas promise-keeping enables mutually beneficial interactions. So universal treachery isn't a genuine alternative convention for the *same* problem—it's a different "solution" to a distorted version of the problem.

  Another point: Lewis's conditions include a preference for general conformity. In treachery, people might prefer deception, but do they genuinely prefer universal treachery over near-universal? Probably not—everyone loses in universal treachery. So it fails that condition.

  The user's examples (driving sides, potluck rules) fit Lewis's model because they're genuinely arbitrary. But moral norms have intrinsic value—they create trust and enable social goods. The user's insight about mutual expectations is correct, but they need to see that not all expectations-based norms are arbitrary conventions. Some norms are upheld because of their inherent benefits, not just because they're equilibria.

  They might worry that rejecting (4) undermines their core insight. But it doesn't—mutual expectations still matter, but for moral norms, additional factors (like inherent desirability) make them non-arbitrary. The cost is realizing Lewis's framework isn't sufficient for all norms, but they can keep their insight by refining it.

  Their deeper need is likely to reconcile Lewis's theory with their intuition that moral norms *aren't* arbitrary. They want to preserve the role of mutual expectations without reducing morality to convention. By clarifying the types of problems conventions solve, and how moral norms differ, I can address that.
answer: |-
  Your argument is sharp and admirably clear, but the problem lies in **step (4)**: claiming that norms like promise-keeping *satisfy every clause* of Lewis's definition of convention, particularly the **arbitrariness** clause. Let's break down why this step doesn't hold, why it felt natural, and what it costs to reject it—while preserving your core insight about mutual expectations.

  ### The Crucial Mistake: Equating Moral Norms with Arbitrary Conventions
  Lewis's conventions solve **coordination problems**: situations where individuals have a *shared interest* in coordinating their behavior but *multiple, equally good ways* to do it (e.g., driving left vs. right). The "arbitrariness" clause is essential: the specific solution *doesn't matter*, as long as everyone picks the *same one*. Neither solution is intrinsically better; their value comes solely from uniformity.

  Moral norms like promise-keeping **do not solve pure coordination problems**. They solve **problems of cooperation, trust, and conflict resolution** in situations where individual incentives might tempt defection. Crucially, these norms **are not arbitrary** in Lewis's sense because:

  1.  **The Alternatives Aren't Equally Good:** Universal treachery is *not* an equally good solution to the same problem. The "problem" promise-keeping solves is *how to enable mutually beneficial cooperation and reliance*. Universal treachery *destroys* the possibility of cooperation and reliance. It "solves" a *different* (and terrible) problem: "how can we all avoid being exploited in a world without trust?" It doesn't fulfill the *purpose* of the original norm.
  2.  **Preference Asymmetry:** Lewis requires that "general conformity is generally preferred to slightly-less-than-general conformity." This holds for promise-keeping: near-universal conformity is good, widespread defection is bad. But **universal treachery fails this condition**. Do people genuinely *prefer* a world where *absolutely no one ever keeps a promise* to a world where *almost everyone does*? Almost certainly not. A slight deviation *from universal treachery* (e.g., a few people starting to keep promises) would likely be *preferred* by many (even if risky), violating the requirement that *general* conformity is preferred to *slightly-less-than-general*. The stability of treachery comes from fear and distrust, not from a preference for its universality over near-universality.
  3.  **Intrinsic Value vs. Coordination Value:** The value of driving on the left is *entirely* derived from coordination. The value of promise-keeping has a **significant intrinsic component** derived from the *specific content* of the norm – it enables plans, relationships, and social goods that treachery destroys. Its value isn't *solely* contingent on uniformity in the way a pure convention's is.

  ### Why Step (4) Felt Natural
  1.  **Focus on Expectations & Sanctions:** You correctly identified the powerful role of mutual expectations and disapproval (sanctions) in sustaining *both* conventions and moral norms. This is Lewis's key insight you rightly want to preserve. The *mechanism* of stability (mutual expectations + sanctions) looks similar, making it easy to lump them together.
  2.  **Equilibrium Structure:** Both systems *are* equilibria in a broad game-theoretic sense. In both, no single individual has an incentive to unilaterally deviate given what others are doing. Seeing this structural similarity makes it tempting to apply Lewis's full definition.
  3.  **"Arbitrariness" in Folk Usage:** Colloquially, we might say driving side is "arbitrary," but we might also say "Well, *theoretically*, we could have evolved to be treacherous." Lewis's technical sense of arbitrariness (multiple solutions *equally good* for the *same coordination problem*) is much narrower.

  ### What You Pay to Reject Step (4)
  Rejecting step (4) means **you cannot claim moral norms are Lewisian conventions**. You pay by giving up the *full* application of his *definition* to moral norms. Specifically, you lose the claim that they are **arbitrary** in his strict sense.

  ### What You Keep (Your Core Insight)
  Crucially, **you keep the insight that mutual expectations and sanctions are fundamental to sustaining these norms.** You can still say:
  *   Norms like promise-keeping are stable social patterns.
  *   This stability relies heavily on the fact that (nearly) everyone conforms.
  *   (Nearly) everyone expects (nearly) everyone else to conform.
  *   This expectation gives individuals a strong *prudential* reason to conform (to avoid sanctions, gain benefits of cooperation).
  *   Sanctions (disapproval) play a crucial role in reinforcing expectations and punishing defectors.
  *   They solve collective action problems involving trust and cooperation.

  You preserve the *explanatory power* of mutual expectations and equilibrium without being forced into the counterintuitive claim of arbitrariness and the equivalence with treachery.

  ### Addressing Universal Treachery (Step 6)
  Universal treachery *is* a possible equilibrium. However, Lewis's definition requires that a convention is a solution to a recurring coordination problem where *multiple arbitrary solutions exist*. Universal treachery **fails as an *alternative* to promise-keeping because:**

  1.  **It Doesn't Solve the Same Problem:** Promise-keeping solves "How can we cooperate and rely on each other?" Treachery "solves" "How do we survive in a state of total distrust?" These are fundamentally different problems. Treachery isn't an alternative way to achieve cooperation; it's the *absence* of cooperation.
  2.  **It Fails the Preference Condition:** As argued above, universal treachery is not generally preferred to slightly-less-than-universal treachery in the way universal promise-keeping is preferred to slightly-less-than-universal promise-keeping. People trapped in treachery likely *wish* someone would deviate credibly, even if they dare not do it themselves.
  3.  **It Lacks "Arbitrariness" in the Required Sense:** There aren't *multiple, equally good ways* to live in universal treachery that solve the same coordination problem. Treachery is just... treachery. It might be the *only* stable state for that particular destructive "game," but it doesn't offer *arbitrary alternatives*.

  **Your examples in (2) (driving side, potluck rules) remain perfectly valid Lewisian conventions.** They *are* arbitrary solutions to pure coordination problems. Driving on the left vs. right solves the same problem equally well; neither is intrinsically better. The same applies to potluck rules. The disqualification of universal treachery *does not* swallow these genuine conventions because these conventions genuinely satisfy *all* clauses, including having multiple, equally good, arbitrary alternatives that solve the *identical* coordination problem.

  ### Conclusion
  Your powerful insight about the role of mutual expectations in sustaining norms like promise-keeping is correct and valuable. The mistake was stretching Lewis's specific definition of "convention" (which requires solving a coordination problem with *arbitrary* solutions) to cover norms that solve fundamentally *different* problems (cooperation/trust) where the solutions *are not arbitrary* because the alternatives (like universal treachery) are catastrophically worse at achieving the desired social goods. Rejecting step (4) preserves your core mechanism while avoiding the unacceptable conclusion that treachery is morally equivalent to promise-keeping. Lewis's framework brilliantly explains driving sides and potlucks, but needs augmentation (e.g., incorporating ideas about the intrinsic desirability of cooperative outcomes or different game structures like the Prisoner's Dilemma) to fully explain the force and non-arbitrariness of core moral norms.
