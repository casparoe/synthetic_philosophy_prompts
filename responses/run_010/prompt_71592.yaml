prompt: |-
  I am drafting the specification before I read any of the policy literature, so tell me what a normative theory of paid leave and non-parental childcare has to deliver in order to count as adequate. Give me the requirements list: the patterns of existing practice it must either justify or explain away (chief among them that public money subsidizes a stranger caring for my child as a productive contribution, while a parent doing the same care shows up in the accounts only as earnings forgone); the cases it must get right (a use-it-or-lose-it quota reserved for one parent, which nobody is compelled to take and which a family may rationally decline; a part-time option that is nominally neutral and predictably taken by one sex); the distinctions it may not collapse (leave length versus wage-replacement rate; cash transfers versus services; the child's interests, the parents', and the firm's; care by a parent, by kin, and by a market provider); and the results it must not contradict, about attachment or about how leave length affects hiring and pay. For each requirement, say why it is a requirement rather than a hobbyhorse of one camp, and mark it as non-negotiable or as something a theory may legitimately trade away. Then tell me whether any subset is jointly unsatisfiable — if it is, that impossibility is the finding I am after — and identify the single requirement that eliminates the largest number of otherwise plausible theories. Close with a one-sentence summary on a final line beginning "Verdict:".
reasoning: |-
  Okay, the user is drafting a specification for a normative theory on paid leave and non-parental childcare, and they want a comprehensive requirements list before diving into policy literature. This is a sophisticated request - they're clearly an academic or policy researcher aiming to build a rigorous theoretical framework. 

  First, I need to unpack their layered ask: they want requirements covering existing practice paradoxes (like the stranger vs parent subsidy discrepancy), specific cases to handle (use-it-or-lose-it quotas), critical distinctions to maintain (leave length vs wage replacement), and empirical guardrails (attachment research). 

  Hmm, the real challenge here is balancing their desire for completeness with identifying genuine theoretical impossibilities. The parent-care accounting paradox they mentioned is particularly thorny - it exposes how economic systems invisibilize care labor. That's probably why they flagged it as "chief" among paradoxes.

  For the requirements list, I'll categorize into: paradoxes to resolve (non-negotiable), cases to accommodate (negotiable), distinctions to preserve (mostly non-negotiable), and empirical constraints (non-negotiable). The use-it-or-lose-it quota case feels especially strategic - it tests theories on gender neutrality versus gendered outcomes.

  *Checks academic knowledge* The wage-replacement rate vs leave length distinction is crucial because they impact labor supply differently. And we must maintain cash-vs-services separation since they have divergent equity implications (cash preserves choice but services boost formal care supply).

  The joint unsatisfiability question is where this gets exciting. I suspect the parent-care valuation paradox combined with the "no harm to vulnerable groups" constraint creates an impossibility - recognizing parental care's economic value would require radical accounting changes that might destabilize vulnerable workers' positions. 

  The attachment research constraint will eliminate the most theories - many feminist frameworks rightly prioritize parental time, but the 6-12 month window isn't negotiable. 

  Final verdict needs to crystallize why this matters: without resolving the parental care valuation paradox, theories will keep reinscribing the very inequities they aim to fix.
answer: |-
  Here is a requirements list for an adequate normative theory of paid leave and non-parental childcare, structured as requested. Each requirement is justified, classified as non-negotiable (NN) or negotiable (N), and assessed for joint satisfiability:

  ---

  ### **I. Paradoxes of Existing Practice (Must Justify or Explain Away)**
  1. **The Care Valuation Paradox**  
     *Requirement:* Explain why public subsidies frame **non-parental (stranger) childcare** as a *productive economic contribution*, while **parental childcare** is framed as *forgone earnings* in economic accounts.  
     *Why NN?* This reflects a fundamental inconsistency in how society values care labor. Ignoring it perpetuates gender/class inequities and misallocates resources. A theory must address this core ideological contradiction.  
     *Status:* **Non-negotiable**  

  ### **II. Cases the Theory Must Get Right**
  2. **Use-It-or-Lose-It (UIOLI) Quota**  
     *Requirement:* Accommodate a quota reserved for one parent (e.g., "daddy months"), which is:  
     - Not legally compulsory to use,  
     - Rationally declinable by families (e.g., due to income loss),  
     - Yet effective in redistributing care.  
     *Why NN?* UIOLI is empirically successful in increasing paternal leave uptake. A theory must reconcile *non-coercion* with *behavioral change* without assuming irrationality.  
     *Status:* **Non-negotiable**  
  3. **Gendered Uptake of Part-Time Leave**  
     *Requirement:* Explain why a *formally gender-neutral* part-time leave option is predictably taken primarily by one sex (usually mothers).  
     *Why NN?* Observed cross-national pattern reflecting persistent gender norms. A theory cannot assume perfect gender neutrality in preferences or constraints.  
     *Status:* **Negotiable** (if the theory explicitly rejects gender equity as a goal)  

  ### **III. Distinctions the Theory Must Not Collapse**
  4. **Leave Length vs. Wage-Replacement Rate**  
     *Requirement:* Treat these as distinct policy levers with separate trade-offs (e.g., high replacement rates boost uptake but increase costs; long leaves risk labor market detachment).  
     *Why NN?* Conflating them obscures policy design choices (e.g., Sweden’s high rate vs. US’s short unpaid leave). Economic and social impacts differ.  
     *Status:* **Non-negotiable**  
  5. **Cash Transfers vs. Direct Services**  
     *Requirement:* Acknowledge that cash benefits (to parents) and public childcare services (e.g., crèches) are non-fungible. Cash maximizes parental choice but may not expand childcare supply; services ensure availability but limit flexibility.  
     *Why NN?* These reflect divergent political philosophies (liberal vs. social-democratic). Collapsing them misrepresents policy conflicts.  
     *Status:* **Non-negotiable**  
  6. **Stakeholder Interests (Child/Parents/Firm)**  
     *Requirement:* Separate the interests of the child (e.g., attachment), parents (e.g., autonomy, career), and firms (e.g., productivity, turnover).  
     *Why NN?* Policies prioritizing one stakeholder often harm others (e.g., long firm-friendly leaves may reduce maternal earnings). A theory must weigh trade-offs explicitly.  
     *Status:* **Non-negotiable**  
  7. **Care Provider Types (Parent/Kin/Market)**  
     *Requirement:* Distinguish outcomes when care is provided by parents, extended kin, or market providers (e.g., for child development, parental labor supply).  
     *Why NN?* These modes have distinct economic, cultural, and developmental implications. Kin care is often informal/unpaid; market care commodifies labor.  
     *Status:* **Negotiable** (if scope is limited to public subsidies only)  

  ### **IV. Empirical Constraints (Must Not Contradict)**
  8. **Attachment Science Constraint**  
     *Requirement:* Align with evidence that parental care is critical for infant attachment (≈6–12 months), but non-parental care does not harm development if high-quality (post-1 year).  
     *Why NN?* Contradicting robust developmental psychology undermines legitimacy.  
     *Status:* **Non-negotiable**  
  9. **Labor Market Neutrality**  
     *Requirement:* Not deny evidence that very long leaves (>1 year) can reduce women’s hiring/promotion prospects or increase the gender pay gap.  
     *Why NN?* Empirical economics consensus (e.g., cross-country studies of "motherhood penalties").  
     *Status:* **Non-negotiable**  

  ---

  ### **Joint Satisfiability Assessment**
  - **The Core Tension:** The **Care Valuation Paradox** (1) + **UIOLI Case** (2) + **Labor Market Neutrality** (9) are **jointly unsatisfiable** for theories prioritizing gender equity.  
    - *Why?* UIOLI quotas (2) correct gendered leave uptake by *compensating* for parental care (1), but long leaves (often incentivized by UIOLI) exacerbate gender pay gaps (9). Resolving this requires trade-offs no major theory fully reconciles.  
  - **Impossibility Result:** No theory can simultaneously (a) value parental care equally to market care, (b) eliminate gender disparities via non-coercive quotas, and (c) avoid gendered labor market penalties.  

  ### **Most Eliminative Requirement**  
  The **Care Valuation Paradox** eliminates the most theories:  
  - Neoclassical economics ignores unpaid care value.  
  - Marxist theories reduce care to social reproduction without pricing.  
  - Libertarian theories reject subsidies for any care.  
  Only feminist political economy (FPE) and capability approaches engage it—but still struggle with labor market trade-offs.  

  ---

  **Verdict:** A theory must resolve the irreconcilable tension between valuing parental care as productive labor and avoiding gendered penalties from long leaves—or explicitly prioritize one ideal over the other.
