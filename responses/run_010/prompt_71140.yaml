  Okay, the user is a science editor at a general-interest magazine who's now responsible for vetting genetic metaphors. They need a practical decision procedure to quickly evaluate phrases like "DNA is a code" without specialist knowledge. The stakes are cumulative accuracy over dozens of genetics pieces per year, with working biologists occasionally auditing their choices. 

  First, I need to unpack the core problem: metaphors in genetics are sticky and consequential. When writers say "code," they might mean any of five distinct things - from the narrow biochemical reality (codon-to-amino acid mapping) to the misleading idea that DNA "instructs" development. The user has correctly identified key distinctions: coding vs templating, causal vs semantic information, and the distributed nature of developmental resources. But they can't spend hours per phrase disentangling this.

  The real tension here is between scientific precision and communicative efficiency. The user isn't asking for philosophical purity - they need guardrails against the most egregious misrepresentations while preserving useful shorthand. Their examples reveal this tension: quoting a biologist saying "codes for" is probably fine, but calling the genome an "instruction manual" in a differentiation piece risks implying genetic determinism. 

  I'll design the procedure as a flowchart with kill switches for outright errors (like claiming DNA templates organisms) and caution zones where mandatory glosses are required. The biggest sacrifice will be nuance around "information" - we'll treat causal impact as acceptable but require disambiguation for any representational claim. For the mitochondrial code issue? Probably too niche for a 5-minute eval; we'll catch it only if context explicitly mentions organellar translation.

  Notably, the procedure must handle asymmetries: "cracking the code of ageing" might fly in a headline if the body explains it's about biomarkers, but "junk DNA" requires immediate context about ongoing debate. That audience-awareness matters - specialists tolerate idioms that mislead laypeople.

  When testing against their four cases: #1 passes (direct quote), #2 gets a hard no despite their attachment (it conflates genome with executable instructions), #3 survives with headline leniency, #4 requires glossing. The user expects #2 to fail - good, that shows the procedure works. I'll explain that "instruction manual" implies temporal execution of steps, which development lacks, and that's the complaint-worthy point.

  Crucially, I'll flag where this tool is blind: it won't catch metaphors about "editing" genomes (CRISPR) or "rewriting" DNA, and it can't resolve whether "program" is permissible in systems biology contexts. Those require case-by-case escalation. The cost? We might over-police some harmless idioms, but under-policing spreads worse misconceptions.
answer: |-
  Here is a practical decision procedure for evaluating genetic metaphors, designed for speed and defensibility. It prioritizes preventing major misrepresentations over philosophical nuance.

  **Brainstorming Pass: "DNA is a code" Claims**
  1.  **Mapping Claim:** DNA nucleotides (A,T,C,G) map to amino acids via triplet codons. *Type:* **Mapping between alphabets** (nucleic acid alphabet -> amino acid alphabet).
  2.  **Arbitrariness Claim:** The codon-amino acid mapping is arbitrary (not chemically determined). *Type:* **Mapping between alphabets** (specifically, its conventional nature).
  3.  **Digitality Claim:** DNA information is discrete, combinatorial, and copied faithfully. *Type:* **Copying** (fidelity) & **Mapping** (discrete tokens).
  4.  **Causal Claim:** DNA sequences causally influence protein structure/function. *Type:* **Causal influence**.
  5.  **Semantic/Specification Claim:** DNA sequences carry "instructions," "meanings," or "specify" the organism/traits. *Type:* **Specification or meaning**.
  6.  **Program Claim:** DNA contains a program executed during development. *Type:* **Specification or meaning** (implied executable instructions).

  **The Decision Procedure (5-Minute Referee Tool)**

  1.  **ASK: Does the phrase directly quote a scientist using specialist terminology?**
      *   **PASS (Run As Is):** Yes. (e.g., "this gene codes for a receptor" from a biologist). *Rationale: Specialists use shorthand within their context.*
      *   **CONTINUE:** No. Proceed to Q2.
      *   *Cost:* Accepts specialist idioms without challenge. *Judgment Call:* Is it *really* a direct quote used appropriately?

  2.  **ASK: Does the phrase claim the genome itself (or DNA sequence) is a structural template or model for the whole organism or its parts?**
      *   **STRIKE & REPLACE:** Yes. (e.g., "genetic blueprint," "DNA model of the body"). *Rationale: DNA does not structurally resemble the organism; this conflates templating (copying DNA) with a false analogy to organismal structure.*
      *   **CONTINUE:** No. Proceed to Q3.
      *   *Cost:* None. This is a clear error.

  3.  **ASK: Does the phrase claim the genome *alone* contains the "instructions," "program," or "information" that *determines* or *builds* the organism? (Look for words like: instruction manual, recipe, program, script, builder, architect, solely, completely, determines)**
      *   **STRIKE & REPLACE:** Yes. (e.g., "The genome is the body's instruction manual," "DNA builds the organism"). *Rationale: Development requires many non-genomic resources (cellular machinery, environment). This implies genetic determinism.*
      *   **CONTINUE:** No. Proceed to Q4.
      *   *Cost:* May flag phrases where "instructions" is meant very loosely but determinism isn't implied. *Judgment Call:* Assessing the determinism implication.

  4.  **ASK: Does the phrase use "code," "information," "language," or "read" in a context clearly *beyond* the specific molecular process of gene expression (DNA -> RNA -> Protein)?** (e.g., applied to the whole genome/organism, development, behaviour, evolution, epigenetics, "cracking the code of X")
      *   **MANDATORY GLOSS:** Yes. *Gloss Required:* Must explicitly state this is a *metaphor* and briefly note the relevant complexity (e.g., "metaphorically," "meaning the patterns scientists decipher," "involving many interacting factors beyond DNA").
      *   **RUN AS IS (Conditional):** Only if the context is *exclusively* the molecular mechanism of transcription/translation *and* uses standard terms like "genetic code," "codes for," "genetic information" *without* organismal determinism claims. Proceed to Q5.
      *   *Cost:* Requires writer effort. May seem pedantic for some idioms. Handles the semantic slide ("information") by forcing contextualization for broad uses. *Misfire:* Might gloss overly cautious "code" uses in molecular contexts; might permit some borderline metaphors if glossed weakly.

  5.  **ASK: Does the phrase use "junk DNA"?**
      *   **MANDATORY GLOSS:** Yes. *Gloss Required:* Must add "so-called" or "historically termed" and include a brief note that function for some non-coding regions is an active area of research/dispute. (e.g., "so-called 'junk DNA,' much of which may have functions still being discovered").
      *   **RUN AS IS:** No.
      *   *Cost:* Acknowledges scientific debate without banning a common, albeit contested, term.

  **Verdicts**
  *   **Run As Is:** Passes Q1 (direct quote) OR passes Q2, Q3, Q4 (Run As Is), and Q5 (no junk DNA).
  *   **Mandatory Gloss:** Triggers Q4 (Mandatory Gloss) OR Q5. *Tell Writer:* "You must add a gloss: [Specify exact requirement from Q4 or Q5]."
  *   **Strike & Replace:** Triggers Q2 or Q3. *Tell Writer:* "This metaphor implies [false structural template / genetic determinism]. Replace with a more accurate term (e.g., 'DNA sequence,' 'genetic factors,' 'plays a key role')."
  *   **Escalate to Editor:** Ambiguity in Q1, Q3, or Q4 that causes significant dispute or stalls the process. *Rare.*

  **Condensed Cheat Sheet (For Writer's Desk)**

  1.  **Quote?** If quoting a scientist's exact words: **OK**.
  2.  **Blueprint?** Does it say DNA is a *model* of the body? **STRIKE**.
  3.  **Determinism?** Does it say DNA *alone* holds *instructions/program* building the body? **STRIKE**.
  4.  **"Code/Info" Broadly?** Using "code," "information," "language," "read" beyond genes->proteins? **ADD GLOSS** explaining it's a metaphor/metaphorically referring to patterns involving complex factors.
  5.  **"Junk DNA"?** Using "junk DNA"? **ADD GLOSS**: say "so-called" or "historically called" and note debate/possible function.
  6.  **Otherwise?** **OK**.

  **Costs & Simplifications**
  *   **Deliberately Dropped:**
      *   Fine distinction between templating (DNA copying) vs. coding (translation). We catch the worst conflation via Q2 (structural template for body).
      *   Constitutive nature of the decoding apparatus. Too niche for 5 mins; Q4 gloss handles systemic complexity broadly.
      *   Mitochondrial code variants. Too specific; covered by Q4 gloss for complexity if relevant context arises.
  *   **Cannot Drop:** Distinction between causal influence (OK) vs. semantic specification/determinism (Not OK). Q3 & Q4 enforce this.
  *   **Misfires:**
      *   **Wrongly Permit:** "DNA is software" might sneak through Q3 if not explicitly deterministic, but Q4 should catch it for glossing. Some overly broad "information" uses might get weak glosses.
      *   **Wrongly Ban:** None inherently. Q1 protects specialist quotes. Careful Q3 wording avoids banning "involved in" or "influences."
      *   **Headline vs. Body:** A headline ("Cracking the Code of Ageing") inherently fails Q4 (broad metaphor). *Verdict:* **Mandatory Gloss**... but gloss can't fit! *Solution:* If unavoidable, permit headline *only if* the body text's opening paragraph contains the required gloss (complexity beyond DNA). Otherwise, **Strike & Replace** the headline.
  *   **Judgment Calls Dressed as Procedure:** Assessing "determinism" implication (Q3), whether a quote is truly direct/appropriate (Q1), and the strength of the required gloss (Q4).

  **Application to Your Cases**

  1.  ***"This gene codes for a receptor," spoken by a structural biologist...***
      *   Q1: **PASS (Run As Is)**. Direct quote, specialist context.
      *   *Verdict:* **Run As Is**.

  2.  ***"Every cell in your body carries the same instruction manual,"... in a piece about cell differentiation.***
      *   Q1: No quote. CONTINUE.
      *   Q2: No structural template claim. CONTINUE.
      *   Q3: **YES**. "Instruction manual" strongly implies a set of executable instructions determining outcomes. This is the core genetic determinism error, especially problematic in a piece *about differentiation* (where non-genomic factors are crucial).
      *   *Verdict:* **Strike & Replace**. (This goes against your preference, but Q3 is clear). *Defense to Complainant:* "The phrase 'instruction manual' implies the genome alone contains the executable steps that build and determine the cell's fate, which misrepresents development. Differentiation depends critically on signals and resources outside the DNA sequence itself. We replaced it with a more accurate description focusing on shared genetic potential."

  3.  ***Headline: "Cracking the code of ageing," over a piece about epigenetic clocks.***
      *   Q1: No quote. CONTINUE.
      *   Q2: No structural template. CONTINUE.
      *   Q3: Not explicitly deterministic ("code of ageing" is broad). CONTINUE.
      *   Q4: **YES (Mandatory Gloss)**. "Code" is used broadly (ageing, epigenetics) far beyond DNA->protein coding. *But it's a headline!* Gloss can't fit there.
      *   *Verdict:* **Conditional Mandatory Gloss**. Permitted *only if* the opening paragraph(s) of the body text clearly state this is metaphorical and explain that epigenetic clocks are biomarkers correlating with biological age, involving complex interactions between genetics, environment, and cellular processes. If the body doesn't do this adequately, **Strike & Replace** the headline (e.g., "Deciphering Epigenetic Clocks" or "Tracking the Biology of Ageing").

  4.  ***"Junk DNA," used three times...***
      *   Q5: **YES (Mandatory Gloss)** for each instance.
      *   *Verdict:* **Mandatory Gloss**. Each use requires "so-called" or similar *and* a contextual note about potential function/debate (can be phrased once clearly early on if repeated). *Tell Writer:* "Add 'so-called' before each 'junk DNA' and include a sentence early on like: 'While much non-coding DNA was historically dismissed as "junk," scientists are now discovering functions for some of these regions.'"

  **What This Procedure Cannot Do**

  1.  **Evaluate All Genetic Metaphors:** It focuses on *representation/determinism* and *core coding metaphors*. It won't reliably catch:
      *   "Editing" DNA (CRISPR): Usually OK, implies targeted change, not misrepresentation.
      *   "Rewriting" the Code: Tricky; leans towards determinism (Q3) but often metaphorical for changing sequence. May need Q4 gloss or escalate.
      *   "Master switch/controller": Often implies determinism (Q3).
      *   "Blueprint for behaviour": Fails Q2 (structural template) and Q3 (determinism).
      *   Metaphors for evolution ("arms race," "selfish gene") - different debate.
      *   "Program" in non-deterministic systems biology contexts (escalate).
  2.  **Settle Deep Philosophical Disputes:** It pragmatically blocks common misrepresentations but doesn't resolve the "information" debate. It assumes "code" is narrowly valid for translation but broadly requires glossing.
  3.  **Handle Specialist-Only Audiences:** It assumes a general audience. For a specialist journal, Q1 covers most uses, Q2/Q3 might be relaxed if context implies no determinism, Q4 glosses might be minimal.
  4.  **Improve Accuracy in Nuanced Specialist Contexts:** Occasionally, forcing replacement of a common specialist idiom (like "codes for" outside a direct quote) might make text *less* accurate or fluent *for experts*. The procedure prioritizes general audience clarity and prevention of major misconceptions over specialist nuance. Q1 mitigates this.
  5.  **Fix Underlying Conceptual Errors in Writing:** It catches symptomatic phrases but doesn't teach writers better conceptual models. It's damage control.

  This procedure provides a defensible, fast filter against the most pervasive and misleading genetic metaphors, grounded in the distinctions you outlined, while acknowledging the practical constraints of science communication for a general audience.
