prompt: |-
  Genome annotation databases routinely assign functions to genes in organisms nobody has ever run a single experiment on — they transfer the annotation across from a characterized gene in mouse or yeast on the strength of sequence similarity alone, and publish it with a confidence code rather than flagging it as a guess. The same community meanwhile labels stretches of DNA pseudogenes, i.e. functionless, even when those stretches are demonstrably transcribed and bound by proteins; the tell is relaxed selection in the lineage, not absence of activity. And then there's ENCODE reporting that something like 80% of the human genome has a biochemical function and getting shouted at by evolutionary biologists for it.

  What notion of function is each of those three practices actually running on? Sort them into whichever bucket they belong — selected-effects/etiological, causal-role/dispositional, or something that doesn't fit either — and say whether one database could coherently house both at once. Specifically: does annotating a pseudogene's transcript as functional contradict the pseudogene label, or are the two answering different questions that only look like they're answering the same one? And the homology-transfer case is the one I find weirdest, becuase the annotator has no evidence about what that molecule does in that organism, only evidence about what its ancestors' descendants were kept around for — so what has to be true about function for the transfer to be a legitimate inference rather than a convenient fiction?

  Finish by telling me what practice would have to change if we made everything uniformly causal-role, and then flag where your own reconstruction is most likely to be wrong: which of the three would push back on your reading, and what consideration would make you re-sort them.
reasoning: |-
  Okay, let me try to unpack this user's question about genome annotation practices. They're pointing out three seemingly contradictory approaches: transferring gene functions based on sequence similarity, labeling transcribed DNA as pseudogenes based on evolutionary selection, and ENCODE's biochemical activity claims. 

  Hmm, the core issue seems to be about conflicting definitions of "function." I recall there's this philosophical divide between selected-effect (evolutionary purpose) and causal-role (current biochemical activity) definitions. The user wants these practices sorted into those buckets.

  First, homology-based annotation feels like it's relying entirely on selected-effects - they're inferring function based on what evolution preserved the sequence for, even without direct evidence in the organism. It's basically saying "your ancestors used this tool for X, so you probably do too." 

  Then the pseudogene case is interesting. Even when there's transcription and protein binding (causal-role activity), they call it "functionless" based on lack of evolutionary selection. That's pure selected-effects thinking - if natural selection didn't maintain it, it doesn't count as function regardless of current activity. 

  ENCODE's 80% claim is clearly causal-role - any measurable biochemical activity counts as function, no evolutionary context needed. No wonder evolutionary biologists got mad - they're speaking completely different functional languages!

  The user's pseudogene question is sharp: does calling the transcript "functional" contradict the pseudogene label? Only if we conflate the definitions. The biochemical activity is real (causal-role), but since it didn't evolve for that purpose (selected-effects), both can technically coexist. 

  But the homology transfer is the weirdest part. The key insight needed for legitimacy is that sequence similarity strongly implies conserved selected-effects function. But this assumes no neofunctionalization - a big gamble. 

  If we forced everything to causal-role, pseudogene annotations would need overhaul, while homology transfers would become nearly impossible without experimental proof. 

  I should flag that pseudogene researchers might push back - some genuinely believe lack of selection implies no significant biological activity. And homology transfers work surprisingly well in practice, suggesting selected-effects inference has merit despite philosophical concerns. 

  The user seems sophisticated - probably a grad student or researcher frustrated by database inconsistencies. Their examples show deep familiarity with genomic controversies. I'll need to honor that complexity while clarifying the philosophical underpinnings.
answer: |-
  This dissection reveals fundamental philosophical tensions in genomics. Here's how each practice maps to function concepts, and the implications:

  **1. Homology-Based Function Transfer (e.g., from mouse to unstudied organism)**  
  - **Notion of Function:** **Selected-Effect (Etiological)**  
  - **Reasoning:** The inference relies entirely on evolutionary history. The annotation claims: "This sequence was *selected for* a specific biochemical role in a common ancestor (or conserved lineage), and the high sequence similarity suggests this selective pressure (and thus the function) persists in the target organism." Evidence about the *current organism's* molecular interactions is absent.  
  - **Legitimacy Requirement:** For this transfer to be valid (beyond mere prediction), one must assume **strong conservation of selective constraints**. This implies the sequence similarity is high enough that any mutation altering the ancestral function would have been deleterious and purged by selection. It assumes no neofunctionalization or loss of the original selected function in the target lineage. It's an inference about *why the sequence exists*, not direct evidence of *what it does now*.

  **2. Pseudogene Annotation (based on relaxed selection despite transcription/binding)**  
  - **Notion of Function:** **Selected-Effect (Etiological)**  
  - **Reasoning:** The label "pseudogene" explicitly means "lacks an evolutionarily *selected* function." Evidence of transcription or protein binding demonstrates *current biochemical activity* (causal role), but this activity is deemed non-functional because it did not arise or persist due to natural selection. The activity might be neutral, stochastic, or even deleterious "noise" without adaptive significance.  
  - **Contradiction?** **No fundamental contradiction** if the labels answer different questions.  
      - *"Pseudogene"* answers: "Was this sequence *shaped and maintained by natural selection* for a specific biological role?" (Selected-Effect = No).  
      - *"Functional transcript"* (if claimed) answers: "Is this sequence *currently involved in a biochemical activity*?" (Causal-Role = Yes).  
      A database *could* coherently house both annotations *if* it clearly distinguishes the type of "function" being described (e.g., "Etiological Function: None (Pseudogene)"; "Causal Activity: Transcription, Protein Binding").

  **3. ENCODE's "Biochemical Function" (80% of genome functional)**  
  - **Notion of Function:** **Causal-Role (Dispositional)**  
  - **Reasoning:** ENCODE defined "function" operationally as a reproducible biochemical signature (transcription, protein binding, chromatin modification). This is purely about *current molecular activities and capacities* within the cellular machinery, irrespective of whether these activities confer an adaptive advantage or were shaped by selection.  
  - **Evolutionary Pushback:** Evolutionary biologists argued this definition is too broad. Much biochemical activity might be non-adaptive molecular "noise" (transcriptional junk, spurious binding) with no significant selected effect on fitness. They insist "true" biological function requires an evolutionary (selected-effect) component.

  **Could One Database House Both Types?**  
  Technically **yes**, but **practically fraught**. It would require:  
  1.  **Explicit Metadata:** Every functional annotation *must* be tagged with its underlying concept (Selected-Effect or Causal-Role).  
  2.  **Strict Evidence Criteria:** Clear rules for what evidence supports which type of annotation (e.g., phylogeny/selection metrics for SE; biochemical assays for CR).  
  3.  **Avoiding Conflation:** Preventing ambiguous terms like "functional" without qualification.  
  Most current databases conflate these concepts implicitly, leading to the tensions you observe.

  **Impact of Uniform Causal-Role Definition:**  
  If *everything* used **only** Causal-Role:  
  1.  **Pseudogene Annotations Would Vanish:** Any transcribed/bound sequence would be "functional." The concept of "pseudogene" (implying lack of selected function) becomes meaningless or requires a new term like "non-conserved element with activity."  
  2.  **Homology Transfers Become Highly Speculative:** Assigning a *specific* biochemical role (e.g., "kinase activity") based solely on homology would be unjustified without experimental validation in the target organism. Sequence similarity could only suggest *potential* for similar activity, not define the function. Annotations would shift to vague terms like "putative kinase" or require direct experimental proof.  
  3.  **ENCODE's Claim Gains Ground:** The 80% figure becomes defensible under this broad definition. However, its biological *significance* would be hotly debated, as it includes potentially inconsequential activities.

  **Where My Reconstruction is Most Likely Wrong & Pushback:**  
  *   **Biggest Pushback Likely From:** **Pseudogene Researchers.**  
      *   **Their Argument:** "Relaxed selection isn't *just* about evolutionary history; it's strong *evidence* that the observed biochemical activity *lacks significant biological consequence* in the current organism. Calling it 'functional' (even causally) is misleading because the activity isn't integrated into adaptive cellular processes or constrained. It's epiphenomenal noise."  
      *   **Re-sorting Consideration:** If evidence emerged that specific transcribed pseudogenes consistently play *essential, conserved regulatory roles* (e.g., as ceRNAs) *despite* lacking strong sequence conservation (i.e., selection acts on their *expression level*, not their precise sequence), the strict Selected-Effect definition of "pseudogene" might need revision. Some "pseudogenes" might genuinely have causal-role functions *not* reflected in sequence-level selection signatures.  
  *   **Homology Transfer Weirdness:** My reading assumes annotators intend a selected-effect claim. In practice, many might implicitly believe sequence similarity *directly* implies identical causal role. This conflation is the core of the "weirdness."  
  *   **ENCODE/Evolutionary Debate:** My sorting is standard, but some might argue ENCODE's definition isn't purely causal-role because they often imply biological significance. Evolutionary biologists might argue *their* definition incorporates causal capacities *that were selected for*.

  In essence, the central conflict is between **Function as Evolutionary Purpose** (Selected-Effect) and **Function as Current Biochemical Job** (Causal-Role). Genomics uses both, often unstated, leading to apparent contradictions that are really category errors. Resolving annotations requires explicitly asking: "Functional *for what purpose* (evolution)?" vs. "Functional *in what mechanism* (biochemistry)?"
