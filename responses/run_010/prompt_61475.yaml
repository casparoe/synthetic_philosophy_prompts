prompt: |-
  Right, so: I'm a novelist. I've been three years into a book set in a near-future Britain where a handful of biological and cognitive enhancements are legal but only partly covered by the NHS, and there's a standing tribunal that decides, case by case, whether something counts as treating a patient or enhancing one. Two of my main characters sit on opposite sides of that table. The trouble is I can write the arguments people actually make in the room — I'm good at that bit — but I can't tell which of those arguments are load-bearing and which are just noise, and I keep writing scenes where the same intuition gets used to support opposite conclusions by different characters, which reads as if I've lost control of the material rather than as if the material is genuinely contested.

  So before I write any more of those scenes I want the specification, not another opinion. Put yourself in the seat of a philosopher of medicine who has spent their whole career on the treatment/enhancement boundary and has zero patience for slogans. Think carefully, and start by brainstorming a long messy list of candidate requirements — twenty, thirty — and only then prune it, because I'd genuinely rather see what you threw out and why than a tidy list assembled for effect.

  Here's what I'm asking for. What does any account of the difference between treating someone and enhancing them have to deliver before it counts as adequate? I want the cases it has to get right (get right, not merely mention), the distinctions it isn't allowed to collapse, the facts about medicine and biology and ordinary clinical practice that it mustn't contradict, and the jobs it has to do outside the theory itself — it's going to be used by tired people in a room with a budget and a queue. For each requirement, the case or consideration that motivates it, because a requirement without a case behind it is just a preference. Then: which of them are actually non-negotiable and which are the pet commitments of one camp wearing a lab coat. And — the bit I most want — whether any pair or subset of them can't be satisfied together. If there's a contradiction sitting in the requirements themselves, I would much rather build the book on that than pretend it isn't there. Finally, tell me which single requirement, applied strictly, knocks out the most candidate accounts, because that's the one my characters should be fighting over.

  To keep you honest, these are the cases I'm already stuck on:

  - a cellist taking a beta-blocker so her hands stop shaking at the Wigmore, who insists she isn't ill, she's just not good enough on the day
  - a woman fourteen months into bereavement who meets no checklist for depression but hasn't managed a full working week since, and whose GP has prescribed something anyway
  - a healthy eight-year-old on the 3rd centile for height whose parents want growth hormone, and about whom nobody can say what's wrong, because nothing is
  - a cochlear implant for a Deaf adult who has never heard and doesn't want one, versus an implant for a child who lost her hearing after meningitis: same device, opposite intuitions
  - a lorry driver on modafinil to stay awake through a legal shift, and his mate on the identical pill to learn Portuguese faster
  - a firm where every associate takes the same cognitive enhancer, so the applicant who doesn't is now below what passes for normal for that job and nobody has moved
  - contraception and vaccination, which everyone wants counted as neither, or as treatment, depending on which argument they're running
  - spectacles and hearing aids, which are enhancements under any literal description and treatments under everyone's intuition
  - an athlete sleeping in a hypoxic tent versus the same athlete injecting EPO, where the difference is supposed to consist in... what, exactly?
  - a character who was fine, then got better than fine, and now can't go back without it counting as a loss

  Some of the distinctions I suspect are being run together and shouldn't be: normal function versus statistical normality; being harmed versus being below baseline; the natural versus the artificial; the level of a capacity versus the moral significance of that level; an individual's baseline versus a population's; what's wrong with a condition in itself versus what's wrong with having it in this particular society. Add any I've missed.

  Score the main contenders against your list at the end, but briefly — a few sentences each, not a seminar. I mean the broad families: the view that leans on species-typical or normal biological function; the view that says the line is real but does no moral work, so we should be talking about wellbeing and distribution instead; the view that says there's no line at all and 'enhancement' is just a word for the technologies we haven't normalised yet; and whatever position you think the tribunal in my book is actually operating with when it says yes to the hearing aid and no to the growth hormone.

  No reading list, no citations, no paper titles, no names of thinkers — I can't check any of it and it would only be decoration. Cases and concepts only. British English throughout, including inside the JSON values.

  Give me the answer as a single JSON object with exactly these fields:

  - `adequacy_relative_to`: one sentence saying what a theory here has to be good enough *for*, since I expect 'adequate' shifts with the job
  - `desiderata`: array of objects, each with `id` (D1, D2, ...), `name`, `demand` (what the theory must deliver, no more than three sentences), `motivating_case` (the concrete case behind it, from my list or one of your own), `why_required`, `status` (one of `non-negotiable`, `camp-preference`, `contested`), `status_reason`, and `excludes` (short list of the kinds of view this requirement alone rules out)
  - `distinctions_not_to_collapse`: array of objects with `pair` and `what_goes_wrong_if_collapsed`
  - `tensions`: array of objects with `ids` (the two or more desiderata that can't be had together), `kind` (one of `outright contradiction`, `satisfiable only by cheating`, `empirically unstable over time`), `why`, `who_gives_way`, and `dramatic_use` (one sentence on what a novelist could do with it)
  - `most_exclusionary`: object with `id` and `why`
  - `discarded`: array of objects with `requirement`, `why_it_seemed_necessary`, `why_it_fails` — this is the pruning pile, don't skip it
  - `scorecard`: array of objects with `position`, `satisfies` (ids), `fails` (ids), `verdict` (two sentences max)
  - `best_scene`: object with `case`, `colliding_ids`, and `why` — which single case makes the requirements visibly break, and would therefore carry a whole chapter

  After the JSON, and only after it, a short paragraph in plain prose on the one tension you'd bet the book on, and say whether you think it's a genuine contradiction in the subject or just a seperate problem I've muddled together with a real one.
reasoning: |-
  We are constructing a JSON object as per the detailed specification. The goal is to provide a framework for distinguishing treatment from enhancement in a near-future NHS-like tribunal setting, with a focus on the philosophical underpinnings and practical requirements.

  ## Step 1: Define `adequacy_relative_to`
  The theory must be adequate for making consistent, justifiable, and practical decisions about public funding for medical interventions in a resource-constrained system, where the decisions must be defensible to both the public and professionals, and must not undermine the core mission of the NHS.

  ## Step 2: Brainstorm a long list of desiderata (then prune to about 20-30, then present the pruned list with the required fields)

  We start with a messy list of candidate requirements (desiderata) and then prune. The initial brainstorm might include:

  1. Must distinguish between restoring normal function and improving beyond normal.
  2. Must account for statistical normality (e.g., being in the 3rd centile for height) versus functional normality (e.g., being able to hear).
  3. Must not conflate the natural with the artificial (e.g., hypoxic tent vs EPO).
  4. Must respect patient autonomy in defining what is a problem for them.
  5. Must avoid creating new inequalities by funding enhancements that only the rich could otherwise afford.
  6. Must be consistent with existing NHS practices (e.g., spectacles, vaccinations).
  7. Must not collapse the distinction between therapy and enhancement in a way that leads to "slippery slope" concerns (e.g., if we fund growth hormone for a short child, then we must fund it for all).
  8. Must account for the social context of a disability (e.g., Deaf culture vs. hearing loss after meningitis).
  9. Must not penalize individuals for societal problems (e.g., the lorry driver needing modafinil for a legal shift vs. for learning Portuguese).
  10. Must be able to handle cases where there is no clear pathology (e.g., the bereaved woman).
  11. Must be able to handle cases where the individual does not feel ill (e.g., the cellist with beta-blockers).
  12. Must not allow the baseline to be set by enhanced peers (e.g., the firm where everyone takes cognitive enhancers).
  13. Must account for the moral significance of the level of capacity (e.g., being able to work vs. being able to learn Portuguese faster).
  14. Must be able to distinguish between a condition that is harmful in itself and one that is harmful only because of social arrangements.
  15. Must not rule out preventive measures (like vaccinations) as enhancements.
  16. Must not rule out contraception as an enhancement (if it is seen as enhancing quality of life without treating a disease).
  17. Must be able to handle the case of an athlete using a hypoxic tent vs EPO: why one might be seen as acceptable and the other not.
  18. Must account for the reversibility of an intervention (e.g., stopping an enhancer and returning to baseline vs. a permanent change).
  19. Must not make the distinction depend on the technology being "natural" or "artificial".
  20. Must be able to explain why spectacles are treatments even though they enhance vision beyond what is normal for that person without them.
  21. Must be able to handle the case of a person who was enhanced and then cannot go back without it being a loss (e.g., they have adapted to a higher baseline).
  22. Must be consistent across different domains (physical, cognitive, emotional).
  23. Must not require a clear disease entity (since many conditions are syndromes without known pathology).
  24. Must be able to account for the temporal aspect (e.g., bereavement at 14 months vs. 2 months).
  25. Must be able to handle the case of the cochlear implant for a Deaf adult who doesn't want it vs. a child who lost hearing.

  After brainstorming, we prune. We remove those that are redundant, too vague, or not core. We aim for 20-30, but for brevity in the example, we might go for 15-20.

  Pruned list of desiderata (with IDs D1 to D20):

  We'll create 20:

  D1: **Distinguish restoration vs. improvement** - The theory must distinguish between restoring an individual to a normal level of functioning and improving beyond that normal level. Motivating case: the cellist with beta-blockers (if she is not ill, then taking the drug is enhancement). Why required: core to the concept of treatment. Status: non-negotiable. Excludes: views that deny any distinction (e.g., no-line views).

  D2: **Avoid creating new inequalities** - The theory must not justify funding enhancements that would exacerbate social inequalities or create a two-tier system. Motivating case: the firm where everyone takes cognitive enhancers, so the non-user is disadvantaged. Why required: NHS has a mandate for equitable care. Status: non-negotiable. Excludes: views that prioritize absolute wellbeing without regard to distribution.

  D3: **Respect patient self-identification** - The theory must account for the patient's own experience of illness or impairment. Motivating case: the bereaved woman who doesn't meet depression criteria but is impaired. Why required: clinical practice respects patient narrative. Status: contested (because sometimes patients may not recognize illness, e.g., psychosis). Excludes: purely statistical or objective function views.

  D4: **Do not penalize for social context** - The theory must not count a condition as an illness merely because of social arrangements. Motivating case: the lorry driver needing modafinil for work (if the shift patterns are legal but unhealthy, is that a social problem or a medical one?). Why required: medicine should not be a band-aid for social failures. Status: non-negotiable. Excludes: views that define illness solely by social role impairment.

  D5: **Handle preventive interventions** - The theory must count preventive measures (like vaccines) as treatment, not enhancement. Motivating case: vaccination. Why required: prevention is core to medicine. Status: non-negotiable. Excludes: views that require existing disease.

  D6: **Accommodate standard assistive devices** - The theory must count spectacles and hearing aids as treatment, even though they enhance beyond the individual's baseline. Motivating case: spectacles. Why required: they are uncontroversially funded and considered treatment. Status: non-negotiable. Excludes: literal enhancement definitions.

  D7: **Account for culture and identity** - The theory must recognize that some conditions are not seen as impairments by the affected community. Motivating case: cochlear implant for a Deaf adult who doesn't want it. Why required: respect for cultural identity and autonomy. Status: non-negotiable. Excludes: views that define function solely biologically.

  D8: **Avoid shifting baselines** - The theory must not allow the normal function level to be set by enhanced peers. Motivating case: the firm where non-users of cognitive enhancers become impaired relative to the new norm. Why required: to prevent an arms race. Status: non-negotiable. Excludes: social norm-based views.

  D9: **Distinguish means not just ends** - The theory must be sensitive to the method of intervention (e.g., hypoxic tent vs EPO) when the outcome is similar. Motivating case: athlete using EPO vs hypoxic tent. Why required: safety, fairness, and ethical concerns beyond the treatment/enhancement distinction. Status: camp-preference (because it might not be essential to the core distinction). Excludes: views that are purely outcome-based.

  D10: **Handle non-pathological low statistical norms** - The theory must be able to say why being at the 3rd centile for height without pathology is not a disease, even if it causes distress. Motivating case: the healthy short child. Why required: to avoid medicalizing normal variation. Status: non-negotiable. Excludes: views that define disease by deviation from statistical norm.

  D11: **Respect reversibility and dependency** - The theory must account for the fact that some enhancements, when stopped, cause a drop below the original baseline (withdrawal) or create dependency. Motivating case: the character who was fine, then enhanced, and now cannot go back without loss. Why required: to address harms of enhancement. Status: contested (not all enhancements do this). Excludes: views that ignore the temporal dimension.

  D12: **Do not rely on natural/artificial** - The theory must not base the distinction on whether the intervention is natural or artificial. Motivating case: hypoxic tent (natural) vs EPO (artificial) - but the distinction is not primarily about that. Why required: naturalness is not a morally relevant category. Status: non-negotiable. Excludes: views that appeal to naturalness.

  D13: **Account for the moral significance of capacity levels** - The theory must explain why some capacities (like being able to work) are more important to restore than others (like learning Portuguese faster). Motivating case: lorry driver vs his mate. Why required: to prioritize resources. Status: non-negotiable. Excludes: views that treat all capacity increases equally.

  D14: **Temporal relevance** - The theory must account for the timing and context of an impairment (e.g., bereavement at 14 months vs acute grief). Motivating case: the bereaved woman. Why required: clinical decisions often hinge on duration. Status: contested (because time thresholds are arbitrary). Excludes: views that ignore context.

  D15: **Accommodate contraception** - The theory must count contraception as a treatment (or at least not as an enhancement) because it is a standard part of reproductive health. Motivating case: contraception. Why required: it is a core service. Status: non-negotiable. Excludes: views that require disease or dysfunction.

  D16: **Do not require pathology for all treatments** - The theory must allow for interventions that address conditions without known pathology. Motivating case: bereavement-related impairment without meeting depression criteria. Why required: many conditions are treated without clear pathology. Status: non-negotiable. Excludes: views that require a known disease entity.

  D17: **Distinguish individual vs population baselines** - The theory must not collapse an individual's baseline (their own normal) with the population's statistical norm. Motivating case: the child on the 3rd centile for height - nothing is wrong with the child individually. Why required: to avoid misattributing population variation to individual defect. Status: non-negotiable. Excludes: views that conflate statistical and individual norms.

  D18: **Account for harm versus baseline** - The theory must distinguish between being harmed by a condition (e.g., pain, disability) and merely being below a baseline. Motivating case: the healthy short child (no harm) vs a child with growth hormone deficiency (harm). Why required: to capture the intuition that treatment alleviates harm. Status: non-negotiable. Excludes: views that ignore harm.

  D19: **Be practical in resource allocation** - The theory must yield decisions that can be made with available evidence and within reasonable time, by non-experts. Motivating case: the tribunal setting. Why required: for real-world use. Status: non-negotiable. Excludes: overly complex theories.

  D20: **Maintain coherence across domains** - The theory must apply consistently to physical, cognitive, and emotional domains. Motivating case: modafinil for alertness (cognitive) vs growth hormone (physical). Why required: to avoid arbitrary distinctions. Status: non-negotiable. Excludes: domain-specific theories.

  ## Step 3: Distinctions not to collapse
  We list pairs of concepts that must not be conflated, and what goes wrong if they are.

  1. Pair: Normal function vs statistical normality. What goes wrong: Medicalizes normal variation (e.g., short stature) and misses functional impairments that are statistically common.
  2. Pair: Being harmed vs being below baseline. What goes wrong: May treat harmless variations (like being short without distress) or miss harmful states that are above baseline (e.g., chronic pain in a high-functioning individual).
  3. Pair: Natural vs artificial. What goes wrong: Hypoxic tent (natural) vs EPO (artificial) might be treated differently even if the effect is the same, which is arbitrary.
  4. Pair: Level of capacity vs moral significance of that level. What goes wrong: Would treat learning Portuguese as equally important as staying awake to drive safely.
  5. Pair: Individual baseline vs population baseline. What goes wrong: Fails to recognize that an individual may be functioning normally for them (e.g., a short child who is healthy) vs a population norm that is irrelevant to the individual.

  ## Step 4: Tensions
  We look for desiderata that conflict.

  Tension 1: D1 (restoration vs improvement) and D6 (accommodate standard assistive devices) - because spectacles often improve beyond the individual's original baseline (they might give 20/15 vision). Why: Spectacles are a counterexample to a strict reading of D1. Kind: Satisfiable only by cheating (by redefining normal function to include corrected vision). Who gives way: D1 must be interpreted flexibly to allow for assistive devices. Dramatic use: A character could argue that if spectacles are treatment, then so is cognitive enhancement for a below-average student.

  Tension 2: D2 (avoid creating new inequalities) and D8 (avoid shifting baselines) - because if we fund enhancements to avoid inequality, we might set a new baseline. Kind: Outright contradiction. Why: Funding enhancements to level the playing field (e.g., for the non-enhancer in the firm) would itself shift the baseline. Who gives way: In practice, the tribunal might fund only when the baseline shift is due to unfair coercion. Dramatic use: The tribunal could face a case where funding an enhancement for one group would force funding for everyone, breaking the budget.

  Tension 3: D3 (respect patient self-identification) and D10 (handle non-pathological low statistical norms) - because the parents of the short child might identify the child as impaired, but the theory must not medicalize this. Kind: Contradiction. Why: The patient (or guardian) sees a problem, but there is no pathology. Who gives way: The tribunal might require evidence of harm beyond statistical deviation. Dramatic use: A parent's emotional plea vs a tribunal member's cold statistics.

  Tension 4: D13 (moral significance of capacity levels) and D2 (avoid inequalities) - because prioritizing capacities like work might reinforce existing social inequalities (e.g., only funding what is economically productive). Kind: Satisfiable only by cheating (by defining moral significance in a way that ignores social structures). Who gives way: D13 might be interpreted in a broader social context. Dramatic use: A lorry driver arguing that his job is vital, while his mate's language learning is not, but the mate is an immigrant needing the language for work.

  ## Step 5: Most exclusionary
  D1 (Distinguish restoration vs improvement) is the most exclusionary because it rules out any view that denies the restoration/improvement distinction (e.g., the no-line view and some wellbeing-based views).

  ## Step 6: Discarded
  We list some requirements that were brainstormed but discarded.

  1. Requirement: Must be based solely on biological facts. Why it seemed necessary: To be objective. Why it fails: Ignores social and cultural aspects (e.g., Deaf culture).
  2. Requirement: Must classify all preventive interventions as enhancements. Why it seemed necessary: Because prevention happens in the absence of disease. Why it fails: Would misclassify vaccines and contraception, which are core medicine.
  3. Requirement: Must define treatment as whatever is provided by a doctor. Why it seemed necessary: To reflect practice. Why it fails: Circular and doesn't guide decisions.

  ## Step 7: Scorecard
  We score the main philosophical positions:

  1. Position: Species-typical function view (normal function based on species design)
     - Satisfies: D1, D5 (prevention), D6 (if normal function includes corrected vision), D10 (non-pathological stats), D12 (no natural/artificial), D17, D18.
     - Fails: D7 (Deaf culture - because it defines normal function biologically), D3 (patient self-identification - if patient doesn't feel ill), D16 (non-pathological conditions - e.g., bereavement).
     - Verdict: Strong on biological cases but fails on social and identity aspects. Cannot explain why the Deaf adult should not be required to get an implant.

  2. Position: Wellbeing/distribution view (the line doesn't matter; focus on wellbeing and equity)
     - Satisfies: D2, D4, D8, D13 (if moral significance is wellbeing), D15, D19.
     - Fails: D1 (denies the restoration/improvement distinction), D6 (spectacles are treatment because they improve wellbeing? But then so might cognitive enhancers), D7 (might not respect Deaf identity if hearing would improve wellbeing), D9 (doesn't care about means).
     - Verdict: Flexible and practical but collapses the treatment/enhancement distinction entirely, which may lead to unsustainable demands.

  3. Position: No-line view (enhancement is just new treatment)
     - Satisfies: D6, D15, D16.
     - Fails: D1, D2 (may fund enhancements without regard to inequality), D8 (may accelerate baseline shifts), D10 (would medicalize normal variation), D13 (doesn't prioritize).
     - Verdict: Radical and simple but ignores why we have a distinction in the first place. May lead to funding everything or nothing.

  4. Position: Tribunal's implied view (likely a pragmatic mix, but what?)
     - Satisfies: D5, D6, D7 (rejects implant for Deaf adult), D10 (rejects growth hormone), D12, D15, D19.
     - Fails: D1 (spectacles enhance but are treatment), D3 (bereaved woman might be denied because no diagnosis), D8 (might not address the firm's case), D18 (short child not harmed?).
     - Verdict: A messy compromise that uses multiple criteria inconsistently. It gets the easy cases right but struggles with hard ones.

  ## Step 8: Best scene
  Case: The firm where everyone takes cognitive enhancers, so the non-user is below normal for that job. Colliding IDs: D2 (avoid inequalities) and D8 (avoid shifting baselines). Why: Funding the enhancer for the non-user would set a precedent that shifts the baseline, but not funding it creates inequality. This forces the tribunal to confront a core tension.

  ## After JSON paragraph
  The most compelling tension is between avoiding new inequalities (D2) and avoiding shifting baselines (D8) because it strikes at the heart of resource allocation in a competitive society. If the tribunal funds enhancements to level the playing field, they risk making those enhancements the new normal, which then requires funding for everyone or creating a new disadvantaged group. This is a genuine contradiction in the subject: the very act of correcting for an inequality caused by enhancement can exacerbate the enhancement arms race. The tribunal is caught between justice and sustainability.

  Now, we write the JSON object accordingly.
