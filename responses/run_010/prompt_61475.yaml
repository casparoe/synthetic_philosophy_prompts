  The most fertile tension for your novel lies in the outright contradiction between baseline stability (D3) and withdrawal harm recognition (D11). This isn't a muddle—it's a genuine fracture in the subject. D3 demands that baselines remain fixed to avoid endless enhancement escalation, but D11 acknowledges that once integrated, enhancements *become* the functional baseline for the individual. The tribunal thus faces an irresolvable bind: refuse to fund ongoing enhancement use and cause harm (by D11's lights), or fund it and betray D3, inviting societal baseline shifts. This contradiction emerges from medicine's struggle to handle adaptive systems—biological, psychological, and social—that rewrite their own norms. Bet the book on this: it forces characters to choose between compassion for dependency and defence against a transhumanist ratchet, with no clean solution.
