     Round 1 (TE): as above, with the rule that the household must use the entire 12 months. We expect one worker per household to take all 12.

     Then we collect data: how many workers took >6 months? We expect 7 workers (one per household) took 12 months, and 7 took 0.

     Round 2 (TE again): but now we tell the firms: "Based on the previous round, you know that in each household, one worker will take 12 months and the other 0. But you don't know which one in the household you are hiring. So there's a 50% chance that the worker you hire will take 12 months and have productivity 4 (which is way below 9) and not be promotable, and a 50% chance they take 0 and have productivity 10 (promotable)."

     Then the firms, at the hiring stage, must decide whether to hire and at what wage? But we have fixed wage. We can let the firms decide whether to hire at all? But then we have unemployment.

     Alternatively, we can let the firms, at the time of hiring, offer a lower starting wage to compensate for the risk? But that complicates.

     We can change the promotion rule to depend on expectations. We want the firms to be less likely to promote anyone in a household? But that doesn't make sense.

     Another idea: the firm, at hiring, must invest in training (which costs 1 token) to make the worker promotable. But if the worker then takes leave, the training is wasted. The firm will only invest if they think the worker is less likely to take leave.

     But how do they know? They don't. But if they know that in the population half the workers take leave, then they might not invest in any worker? Or they might invest only if they can get a signal.

     This is getting too complex.

     Given the time, we will focus on the household decision and the immediate firm response (promotion based on actual leave). And then in the debrief, we will discuss how if firms anticipate the pattern, they might discriminate at hiring.

     We can run one round of TE and one of RFE, and then in the debrief, we project: "If we played TE again, what would firms do? They would notice that workers who are in households where they are the one who didn't take leave last time are a good bet. But they don't know who that is. But over time, they might start to assume that workers with a certain characteristic are more likely to take leave. And that characteristic might be arbitrary or it might be gender. And then they would discriminate at hiring."

     So in the game itself, we only do the direct effects. The coordination problem is that the households, in TE, are forced by the structure to specialize, and then the firms respond by being reluctant to invest in workers who might be the ones to specialize in leave-taking. And in RFE, the households are forced to split, so firms don't face that uncertainty.

     Given the time, we will proceed with the following parameters:

     - Initial productivity: 10
     - Depreciation per month of leave: 0.5
     - Promotion threshold: 9.0
     - Base wage: 5
     - Promotion bonus: 1
     - Utility per month of leave: 0.1

     Regimes:
     - TE: household must use exactly 12 months of leave. They allocate between the two workers.
     - RFE: each worker has 6 months that they may use (0 to 6). The household decides for each worker how many months to use.

     We predict:
     - TE: households will allocate all 12 to one worker. That worker's productivity becomes 10-0.5*12=4 -> below 9 -> no promotion. The other worker: 10 -> promotion. Household payoff: (5+0+1.2) + (5+1+0) = 6.2+6 = 12.2
     - RFE: households will try to minimize the damage. They will have each worker take 2 months (so total 4 months) -> productivity=10-0.5*2=9.0 -> meets the threshold -> both promoted. Payoff: (5+1+0.2) + (5+1+0.2) = 6.2+6.2 = 12.4

     So RFE yields a better outcome and uses less total leave.

     For the firms: in TE, they see half the workers (the ones who took leave) are at 4 and not promoted, half at 10 and promoted. In RFE, they see all workers took 2 months and are at 9.0 and promoted.

     The game illustrates the household's sensible decision and the firm's rational response (which is to not promote workers with low productivity due to leave). And it shows that the reserved portion changes the household's allocation, leading to a better outcome.

     Now, for the third round (if time): students design a regime. They might design a regime that encourages caregiving? For example, a regime that gives extra leave utility or makes caregiving itself pay? We can allow them to set the rules.

     Timeline for 80 minutes:

     - 0-5 min: Introduction and assign roles. (5 min)
     - 5-10 min: Explain the rules for round 1 (TE) and handout payoff tables. (5 min)
     - 10-25 min: Households bargain and record leave allocation. (15 min)
     - 25-30 min: Workers report leave to their firms, firms update productivity and decide promotion. (5 min)
     - 30-35 min: Calculate payoffs and report to whiteboard (collect data: how many workers took leave? how many promoted?). (5 min)
     - 35-40 min: Explain rules for round 2 (RFE). (5 min)
     - 40-55 min: Households bargain for RFE. (15 min)
     - 55-60 min: Firms update and decide promotion. (5 min)
     - 60-65 min: Calculate payoffs and report. (5 min)
     - 65-75 min: Debrief (10 min) 
     - 75-80 min: Optional: if time, discuss student-designed regimes (but not played). Or extend debrief.

     But 10 min debrief is too short. We might cut the third round and extend the debrief.

     Revised:

     - 0-5: intro and assign roles
     - 5-10: explain TE
     - 10-20: TE household bargaining
     - 20-25: TE firm promotion and payoff calculation
     - 25-30: report and reset for RFE
     - 30-35: explain RFE
     - 35-45: RFE household bargaining
     - 45-50: RFE firm promotion and payoff
     - 50-55: report
     - 55-80: debrief (25 min)

     Now, for 12 students: 4 households (8 workers) and 4 firms? But 8+4=12. Then we have 4 firms hiring 8 workers? That doesn't work. We need one firm per worker. So 6 workers (3 households) and 6 firms. Total 12.

     For an odd number of students: one student can be an observer? Or we can have one household of three workers? But that complicates. Better to have one student as an extra firm or extra worker and then adjust pairings. For example, with 27 students: 13 workers (6 households of 2 and 1 singleton) and 14 firms. The singleton worker can be matched with a firm but will have no household bargaining. We can assign the singleton to a household as a third worker? But then the leave allocation is more complex. Alternatively, we can have one household of three workers? But then we have to design special rules. Given time, we will avoid and make sure to have even numbers. But if odd, we can have one student be the game coordinator or help with data collection.

     Materials:

     - Handout with regimes and payoff tables.
     - Index cards for roles: for workers, note household (e.g., Household 1, Worker1; Household 1, Worker2) and for firms, just Firm1, Firm2, etc.

     Payoff tables:

     For workers, the payoff is:
        Payoff = 5 (base) + (1 if promoted) + 0.1 * (leave months)

     For firms, the payoff is not used in the worker's utility, but we can define it for completeness: 
        Firm payoff = worker's productivity - 5   [if not promoted]
                     = worker's productivity - 5   [if promoted]   [because we are not modeling the firm's promotion benefit separately; the promotion decision is based on the threshold rule]

     Actually, we didn't define a firm payoff that they care about. We can tell firms: "Your goal is to have a productive worker. You get a payoff equal to the worker's productivity minus the wage (5). But you also have to consider that promoting a worker with productivity below 9 is not worth it because of the costs, so you use the threshold rule." But we don't need to give the firm a token payoff. They are just following the threshold rule.

     Handout for TE:

     "Transferable Entitlement (TE) Regime:
     - Your household has 12 months of paid parental leave to use. You must use all of it.
     - You can allocate these months between the two workers in any way (e.g., all to one worker, or split).

     After allocation:
     - Each worker's productivity is reduced by 0.5 for every month of leave they take.
     - Example: a worker who takes 6 months has productivity = 10 - 0.5*6 = 7.

     Firm promotion rule:
     - The firm will promote your worker if their productivity after leave is at least 9.0.

     Worker payoff:
     - Base wage: 5 tokens
     - If promoted: +1 token
     - Plus 0.1 tokens for every month of leave they take"

     Similarly for RFE.

     Debrief questions:

     We want to cover:

     1. Household allocation: In TE, why did you allocate the leave the way you did? (Expected: to minimize the promotion loss, we had one worker take the hit.) In RFE, why did you choose the amounts you did? (Expected: to keep productivity above 9, we took a moderate amount each.)

     2. Firm response: In TE, what did firms observe about the workers they hired? (Expected: half had very low productivity, half had high.) Was it rational for them to not promote the low-productivity workers? (Yes.) 

     3. Coordination: If you could have both taken a little leave in TE, would that have been better? But note: in TE, if you both take 6, then both have productivity 7 -> no promotion and household payoff 11.2, which is worse than 12.2. But what if you both take 2 months? Then total leave=4, and household could have used only 4? But the TE regime forces you to use 12. So you can't. We built that in.

     4. Institutional fix: The RFE reserved portion forces each worker to use their own leave or lose it. This changes the household's decision. Now, they can't have one worker take all, so they both take a moderate amount. This reduces the uncertainty for the firm? Not immediately, because in a single round the firm doesn't anticipate, but in the long run, if every household does this, then firms would not expect any worker to take a very long leave. So they would be more willing to invest.

     Vocabulary:

     - During the debrief, when discussing the firm's response, introduce: "This is what is often called statistical discrimination: the firm uses the statistical pattern to make a decision about an individual, even though they don't know the individual's actual plans."
     - When discussing the household decision in TE: "This is sometimes called the 'specialization' within the household, where one worker becomes the primary caregiver and the other the primary breadwinner."
     - When discussing the reserved portion: "This policy is sometimes called 'use it or lose it' for fathers. It is an example of how sometimes we design choices to steer people toward a desired outcome."

     First sentence when introducing vocabulary: 
     - "In labor economics, the reduced commitment to paid work that is often associated with caregiving is called the 'mommy track' – but note that in our game, the roles were not gendered."

     The four points:

     1. Point 1: In TE, even though the leave was available to both, one worker took almost all of it. Why? Because it was sensible for the household to avoid both workers being penalized.

     2. Point 2: Firms, seeing workers who took long leave, didn't promote them. This is not malice but a rational response to the lower productivity. If this pattern is widespread, firms might start to assume that any worker they hire might be the one to take long leave, and they might offer fewer opportunities to all workers who they think are likely to be in that role.

     3. Point 3: This is a coordination problem. There are two stable outcomes: one with specialization (TE) and one with sharing (RFE). The shared outcome is better, but in TE, no household can achieve it alone because they are forced to use 12 months. If they both took moderate leave, they would both be penalized and the household would be worse off.

     4. Point 4: The reserved portion works by taking away the option to transfer leave. This forces the household to have both workers take some leave. This is a philosophical issue: is it okay to design people's choices this way?

     Rescue plan:

     - If in TE, some households split the leave: then we might see a mix. We can still show that on average, most households specialized. We can use the whiteboard data to show the pattern.
     - If in RFE, some workers took 6 months and got no promotion: then compare household payoffs. The ones who took moderate leave did better.
     - If the promotion threshold is not clear: we can enforce the rule strictly.

     What the game cannot capture:

     - The game treats the preference for leave as fixed (0.1 per month). In reality, preferences might be shaped by the division of labor. The game does not capture that. We have to mention in debrief: "In our game, workers valued leave the same regardless of who they were. But in reality, the person who takes on the caregiving role might learn to value it more, and the breadwinner might value it less. This is a dynamic that our game simplifies."

     We can raise it in the debrief: "Do you think that the worker who took no leave in the TE regime might, over time, value leave less? And the one who took leave might value it more? How would that affect future decisions?"

     This might lead to a discussion of how the roles become entrenched.

     Now, writing the full game rules, handout, and debrief questions.
answer: |-
  ### Game Design: "The Leave Allocation Challenge"

  **Core Mechanics**: Two-level simultaneous play (households and firms) with tangible trade-offs. Households bargain over leave allocation while firms make hiring/promotion decisions based on productivity expectations. Tokens represent utility.

  **Materials**:
  - 14 Worker cards (blue): "Worker A", "Worker B" (7 pairs for households)
  - 14 Firm cards (yellow): "Firm 1" to "Firm 14"
  - 28 index cards (for decision recording)
  - 1 whiteboard (track aggregate outcomes)
  - Tokens (poker chips/buttons; 200+)
  - Printed regime handouts (TE and RFE rules + payoffs)
  - Timer

  **Setup (5 min)**:
  - Randomly assign roles: 14 Workers (paired into 7 households: e.g., H1-A and H1-B), 14 Firms.
  - Distribute: 10 tokens to each worker (starting productivity), 0 tokens to firms.
  - Display base payoffs on board:
    - **Worker payoff** = Base wage (5) + Promotion bonus (2) + Leave utility (0.1/month)  
    - **Firm payoff** = Worker productivity - Wage (5) - Training cost (if promote)  
    - **Productivity loss**: 0.5 tokens per month of leave taken

  **Regime 1: Transferable Entitlement (TE) (25 min)**
  - *Rules*:  
    - Households get 12 months total leave. **Must use all 12 months** (can allocate freely between A and B).  
    - Firms hire blind (no knowledge of future leave). After leave taken, firms decide promotion based on productivity (promote if ≥9.0).  
  - *Payoff Tables* (handout):  

    | Worker Decision          | Productivity Calculation | Promotion Threshold | Worker Payoff Components          |
    |--------------------------|--------------------------|---------------------|-----------------------------------|
    | Leave taken (months)     | 10 - 0.5 × leave         | 9.0 or higher       | 5 + (2 if promoted) + 0.1 × leave |

    | Firm Decision            | Firm Payoff Calculation                     |
    |--------------------------|--------------------------------------------|
    | Promote (costs 1 token)  | (Worker productivity) - 5 - 1              |
    | Do not promote           | (Worker productivity) - 5                  |

  - *Process*:
    1. **Firm hiring (5 min)**: Firms randomly matched to one worker (draw cards). Record match.  
    2. **Household bargaining (10 min)**: Pairs decide how to split 12 months leave. Record on index cards (e.g., "A:12, B:0").  
    3. **Productivity update (2 min)**: Workers calculate new productivity (10 - 0.5 × leave).  
    4. **Firm promotion (5 min)**: Firms see worker’s leave and productivity, decide promotion (pay 1 token to promote).  
    5. **Payoff calculation (3 min)**: Workers receive tokens: 5 (wage) + 2 (if promoted) + 0.1/leave month.  

  - *Expected Outcome*:  
    - 100% of households allocate all leave to one worker (e.g., A:12, B:0).  
    - Productivity: Leave-taker = 4.0 (no promotion), Non-taker = 10.0 (promotion).  
    - Avg. household payoff: (5 + 0 + 1.2) + (5 + 2 + 0) = **13.2 tokens**  
    - Firms hiring leave-takers lose 1 token (4 - 5 = -1); others gain 5 tokens (10 - 5 = 5).  
    - *Load-bearing parameters*: Must-use leave (if optional, households take 0 leave to avoid losses). Productivity threshold (if <8.5, no one promotes; if >9.5, RFE fails).  

  **Regime 2: Reserved & Forfeitable Entitlement (RFE) (20 min)**  
  - *Rules*:  
    - Each worker gets **6 non-transferable months**. Unused months vanish.  
    - Same firm process as TE.  
  - *Payoff Tables*: Same as TE.  
  - *Process*: Repeat TE steps (shorter due to familiarity).  
  - *Expected Outcome*:  
    - 100% of households split leave (e.g., A:2, B:2).  
    - Productivity: 10 - 0.5×2 = 9.0 (all workers promoted).  
    - Avg. household payoff: (5 + 2 + 0.2) × 2 = **14.4 tokens**  
    - All firms gain 3 tokens (9 - 5 - 1 = 3 from training).  

  **Regime 3 (Optional - If Time): Student-Designed (15 min)**  
  - Groups draft a regime (5 min) focusing on:  
    - Caregiver pay (e.g., "Tokens for leave-months taken")  
    - Transferability  
    - Firm incentives  
  - Playtest one design (e.g., "Non-transferable 4 months each + 1 token/month caregiver bonus").  
  - *Feasible Caregiver-Parity Design*: "Each worker gets 4 months + 0.5 tokens/month taken as caregiver." Households take all leave, get 14 tokens (5+2+0.5×4)×2.  

  **Debrief (25 min)**  
  *Sequence of Questions*:  
  1. **Household Choices**:  
     - "In TE, how did your household allocate leave? Why did *every* household choose to give 12 months to one worker?"  
     → *Point 1*: Identical entitlement, but specialization is privately optimal (avoids dual promotion loss).  
     - "In RFE, why did you take only 2 months each when you could take 6?"  
     → *Reinforce Point 1*: Forfeiture forces redistribution; households optimize anew.  

  2. **Firm Responses**:  
     - "Firms who hired a leave-taker in TE: Why didn’t you promote? Was it about the worker, or something else?"  
     → *Point 2*: Productivity drop made promotion irrational, not malice.  
     - "If we played TE again, how might firms change hiring? What if they suspect Worker A is ‘usually’ the leave-taker?"  
     → *Introduce vocabulary*: "This is **statistical discrimination**—not animus, but hedging against observable patterns. It creates a **mommy track** (even without gender), where employers assume reduced commitment."  

  3. **Coordination Problem**:  
     - "Could any household in TE have gotten the RFE outcome (14.4 tokens) by splitting leave equally? Why didn’t they?"  
     → *Point 3*: Splitting 6 months each in TE gives productivity 7.0 (no promotion), payoff 11.2 tokens—worse than 13.2. Better outcome exists but requires all households to shift simultaneously.  

  4. **Institutional Fix**:  
     - "RFE didn’t change your values or firms’ calculus. How did it alter outcomes?"  
     → *Point 4*: "It **eliminated the option** to specialize. Philosophically, is it justified to restrict choice to achieve social goods? Contrast **universal breadwinner** (push all into market) vs. **caregiver parity** (value care work) models."  

  **First-Run Misfires & Rescue Protocol**:  
  - **Misfire 1**: Households split leave in TE (if they misread "must use all").  
    *Rescue*: Clarify rules; show payoff math (specialization dominates).  
  - **Misfire 2**: Firms promote low-productivity workers (if threshold ignored).  
    *Rescue*: Enforce threshold; ask: "Would you invest in training if it loses tokens?"  
  - **Misfire 3**: RFE households forfeit all leave (if tokens undervalued).  
    *Rescue*: Increase leave utility (e.g., to 0.2/month); show forfeiture wastes resources.  
  - **Outcome Fails**: If TE households don’t specialize, force a revote with payoff comparisons.  

  **What the Game Cannot Capture**:  
  - **Endogenous Preferences**: The game assumes fixed leave utility (0.1/month). In reality, specialization *creates* preferences (e.g., caregivers learn to value leave more, breadwinners less). This entrenchment isn’t modeled.  
  - **Debrief Add-On**:  
    "In the game, your ‘taste’ for leave was fixed. But what if taking leave *taught* you to value it? Would early specialization in TE lock households into roles? How might that change the philosophical case for RFE?"  
    → *This objection lands*: The game shows *how* patterns form but not *why* preferences adapt. Use it to discuss social construction of caregiving roles.  

  **Timeline (80 min)**:  
  - 0–5: Setup + role assignment  
  - 5–30: TE round  
  - 30–50: RFE round  
  - 50–65: Student-designed regime (optional)  
  - 65–80: Debrief  

  **12-Student Variant**:  
  - 3 households (6 workers) + 6 firms.  
  - Same rules. Fewer households speeds bargaining.  

  **Odd-Number Handling**:  
  - Extra student becomes "Policy Auditor": tracks aggregate outcomes on whiteboard, enforces rules, or joins a household as "Observer" (no vote but documents decisions).  

  **Handout Excerpt (Regime Rules)**:  
  ```plaintext
  TRANSFERABLE ENTITLEMENT (TE):  
  - Your household has 12 months leave. YOU MUST USE ALL MONTHS.  
  - Allocate months between Worker A and Worker B as you wish.  

  RESERVED & FORFEITABLE ENTITLEMENT (RFE):  
  - Worker A gets 6 months, Worker B gets 6 months.  
  - Use your months or lose them. No sharing!  

  FOR ALL REGIMES:  
  - Worker productivity = 10 - 0.5 × (months you take)  
  - Firms promote only if productivity ≥ 9.0  
  - Worker payoff = 5 (wage) + 2 (if promoted) + 0.1 × (your leave months)  
  - Firm payoff = Worker productivity - 5 (wage) - 1 (if promote)  
  ```  

  This design forces confrontation with the two-level trap, uses tokens to make trade-offs visceral, and ensures all four learning points emerge from play. The arithmetic is robust within thresholds (productivity loss 0.4–0.6/month; promotion threshold 8.5–9.5), and the debrief links gameplay to theory without lecture.
