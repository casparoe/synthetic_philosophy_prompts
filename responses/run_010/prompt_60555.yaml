prompt: |-
  I cover science and ideas for a general-interest outlet, and the least glamorous part of the job is a recurring editorial decision I currently make by reflex rather than by principle: whether a claim about the past counts as historical inquiry or as its counterfeit. The label is not decorative. Print it and the claimant's publisher, funder, or department chair calls my editor; decline to print it where it belongs and I have handed a large audience to a bad actor while telling myself I was being even-handed. I would like the principle before the next round of calls.

  So: write out the desiderata. What must a criterion of historical demarcation actually deliver before I could rely on it? For each requirement, give the consideration or the case behind it — I want the reasoning, not a list of labels. Then mark which requirements are non-negotiable for any adequate account and which are really the preferences of a particular camp (the falsificationist's, the sociologist's, the archivist's, the debunker's) dressed up as neutral conditions. If some subset cannot be jointly satisfied — if the list is itself an impossibility result — say so plainly and show exactly where it breaks. And tell me which single requirement does the most to exclude candidate criteria, since that is the one I should be arguing about rather than the ones everyone agrees on.

  To keep this out of the groove worn by the usual survey, here are the cases I need the list to get right.

  1. The Atlantis lineage runs through three very different performers: Plato, whose dialogues were plainly doing something other than reporting; Ignatius Donnelly, who in 1882 converted them into a literal world history with a thesis list and comparative tables; and a contemporary television presenter who commissions surveys, interviews specialists on camera, presents himself as merely following the evidence, and treats every specialist who disagrees as captured by a consensus. A good criterion should be able to say that these three are not in the same category and should say why without appealing to who has the distribution deal.

  2. A chronological revision advanced by a professional mathematician at a major research university and a member of his national academy, supported by statistical comparisons of chronicles and dynastic lists, which relocates essentially everything we call ancient Roman, Greek, and Egyptian history into the medieval period. The author has the credentials, the formal apparatus, and the citation practice of a scholar and none of the historical content. Tell me which item on my list does the work here — and note that if the answer is that the specialists reject it, my criterion has collapsed into an appeal to authority, which is precisely the charge the people I am arguing with make against me.

  3. Velikovsky. Astronomers mounted a campaign to keep Worlds in Collision off the presses at all, working through threats to boycott its publisher's textbook division rather than through refutation, and they were broadly right about the physics. A criterion on which establishment rejection is decisive would have classified the book as pseudohistory on the strength of a suppression campaign. The same criterion should also explain why, decades after the physics was settled, the surrounding subculture continued to reproduce itself without ever engaging the disconfirming result — and it should be able to distinguish that from a research programme simply being slow to die.

  4. The amateur who took a poem as a map. Schliemann went to Hisarlik because Homer said so, was treated as a nuisance by the professionals, excavated anyway, and announced that he had found Priam's city in a stratum now dated well over a millennium earlier than anything the epics could describe, with an excavation record that has been criticized ever since. My criterion cannot say that hunches drawn from literary sources are pseudohistorical, or it condemns him; and it cannot say that results vindicate method, or it makes demarcation hostage to luck and to the accidents of what survives.

  5. Heyerdahl's raft. A diffusionist thesis about the peopling of the Pacific that specialists regarded as motivated fantasy, pursued by building a vessel and sailing it — an intervention that produced data nobody had bothered to gather — and which genomic work on present-day Polynesian populations has since left partially standing, though not in the form Heyerdahl claimed and not for the reasons he gave. Where does the criterion put someone who was wrong in the aggregate but whose method improved the field's evidential position?

  6. Oral traditions that describe coastlines, islands, and landforms that no longer exist, apparently dating to the closing of the last glaciation. The evidential basis is testimony carried across hundreds of generations rather than artifacts, and the content arrives embedded in narrative, genealogy, and ceremony. Under any straightforward methodological test this is legend; under any test that credits independent corroboration against sea-level and geomorphological records, some of it is evidence. This case matters to me more than the others, because the same institution that would never knowingly run a pseudohistory piece has, for most of its existence, filed exactly this kind of testimony under folklore. The criterion has to explain the difference without conceding that the difference is who is doing the telling.

  7. Function. Much ancient-astronaut and lost-civilization writing has a traceable lineage in colonial-era speculation about who could possibly have raised the monuments of Africa and the Americas, and its central inference — this structure is too sophisticated for its attested builders — is not obviously defective as an inference. Method-based criteria look blind to this. But a criterion that demarcates partly on the social function of a claim will sweep in nationalist textbook disputes, state-mandated curricula, and the Lost Cause industry, which are not pseudohistory in the same sense and which I do not want to be writing about in the same register.

  Three constraints on the deliverable, which you should treat as part of the specification and are free to declare unsatisfiable if that is your verdict.

  - It must be operable by someone who is not a specialist in the period under discussion and who has about a day. If applying the criterion requires knowing whether a statistical technique has been correctly applied to a corpus of chronicles, it is not a criterion, it is a description of the specialist consultation I already commission.
  - It must be statable in print to a general reader in a way that does not reduce to trusting us.
  - It must not be gameable by a practitioner who has read it. This one may be the crux, and if you think it is fatal, say so and say what I should be using in its place.

  Close with a brief scoring pass — three sentences at most each — of a falsificationist account, a consensus-or-expertise account, an account in terms of immunizing strategies and degenerating programmes, and an account in terms of the social function of the claim, measured against the list you have built. I am not after a balanced tour: take a definite position on which requirements are genuine and which are one camp's preferences, on which one does the exclusionary work, and on what you would actually put in the style guide. If you conclude the project fails, argue for that conclusion outright instead of leaving me a menu.
reasoning: |-
  Hmm, the user is a science and ideas journalist grappling with how to distinguish legitimate historical inquiry from pseudohistory. They need clear principles rather than relying on gut feelings, especially since mislabeling can lead to backlash from publishers or inadvertently platform bad actors. They've provided seven complex case studies that any criterion must handle, along with three practical constraints: it must be operable by a non-specialist in a day, explainable to readers without resorting to "trust us," and resistant to gaming by practitioners.

  The cases are fascinating and cover a wide spectrum: Plato vs. Donnelly vs. TV pseudohistorians, credentialed mathematicians making wild chronological claims, Velikovsky's suppressed-but-wrong astronomy, Schliemann's flawed-but-productive Homeric obsession, Heyerdahl's partially vindicated raft experiment, orally preserved Ice Age geography, and colonial/racist "ancient astronaut" tropes. The core tension is between methodological rigor and real-world messiness—sometimes "bad" methods produce good evidence, and sometimes "good" methods are weaponized to exclude valid knowledge (like oral traditions).

  The user's constraints make this brutally hard. A non-specialist can't adjudicate statistical methods on chronicles in a day. Explaining demarcation without circularity is tough—if I say "experts agree," that's just authority. And gaming resistance is nearly impossible; bad actors actively co-opt scholarly language (see the TV host in case 1). 

  I think the non-negotiable requirements are these:  
  1) Methodological transparency: Can others reproduce or build on this? Donnelly's tables look rigorous but are cherry-picked; the TV host avoids falsifiable claims.  
  2) Engagement with counter-evidence: Does it grapple with objections, or dismiss them as conspiracies? Velikovsky's followers ignored disconfirmations; mathematicians relocating Rome might ignore carbon dating.  
  3) Avoidance of immunizing strategies: Pseudohistory often makes itself unfalsifiable (e.g., "the academy suppresses truth").  
  4) Avoidance of functional harm: Even if method looks okay, does it serve racist/colonial functions? Ancient astronaut theories often do.  

  The killer requirement is gaming resistance. A smart pseudohistorian can fake transparency (commissioning "surveys"), perform fake engagement ("I interviewed critics"), and deny functional harm ("I'm just asking questions"). The only defense is to focus on whether their *core argument* structurally avoids falsification. For example, the TV host treats all disagreement as proof of conspiracy—that's an immunizing strategy no matter how many experts he films.  

  For the cases:  
  - Plato's Atlantis is transparent fiction; Donnelly cherry-picks; the TV host uses immunizing tactics. Different categories.  
  - The mathematician relocating Rome? If he dodges carbon dating, that's immunizing.  
  - Velikovsky: Astronomers were right to reject, but their *method* of suppression was bad demarcation. His followers' refusal to engage disconfirmation is the red flag.  
  - Schliemann: Method was terrible (destroying Troy's layer), but he was falsifiable ("dig where Homer points"). Luck doesn't vindicate him, but his approach wasn't pseudohistory—just bad archaeology.  
  - Heyerdahl: His raft generated testable data. Wrong but productive. Pseudohistory wouldn't have invited falsification.  
  - Oral traditions: They become testable when corroborated geologically. The key is whether they're presented as *evidence* open to disconfirmation, not dogma.  
  - Ancient astronauts: The inference "this is too advanced for them" is functionally colonial. Even if wrapped in method, it's pseudohistory because it assumes non-Europeans couldn't build things.  

  Final scoring:  
  - Falsificationism: Fails cases 4-6. Schliemann/Heyerdahl weren't falsifiable in form; oral traditions aren't either until tested.  
  - Consensus: Fails cases 3 and 4. Velikovsky was suppressed wrongly; Schliemann was rejected by experts.  
  - Immunizing strategies: Works for most cases but struggles with 7 (functional harm) and is gameable.  
  - Social function: Vital for case 7 but overreaches—not all politicized history is pseudohistory.  

  Bottom line: No perfect criterion exists. But for the style guide, I'd focus on two things:  
  1) Does this work structurally avoid falsification? (Immunizing strategies = pseudohistory)  
  2) Does it functionally depend on discrediting marginalized people? (Then it's pseudohistory regardless of method).  
  It’s not flawless, but it covers the worst offenders and is operable by non-experts. And crucially, it doesn’t rely on being "right"—Schliemann was wrong but not pseudohistorical; ancient astronaut theorists might stumble on something true but still peddle poison.
answer: |-
  Here is a principled set of desiderata for demarcating historical inquiry from pseudohistory, derived from your cases and constraints. The requirements are ranked by their exclusionary power, with non-negotiables marked (**NN**) and camp-specific preferences marked (**Preference**). The analysis concludes that *no perfect criterion exists*, but a defensible approach emerges.

  ---

  ### **Core Requirements for Demarcation**
  1. **Methodological Transparency and Testability** (**NN**)  
     *What it must deliver*: The claim must present its evidence and reasoning in a way that allows independent verification or falsification. It cannot rely on inaccessible "keys" or unfalsifiable assertions.  
     *Reasoning*: Schliemann (Case 4) excavated Hisarlik transparently, letting others scrutinize his findings (even if flawed). Velikovsky (Case 3) made testable astronomical predictions, but his subculture ignored disconfirmation. In contrast, the TV presenter (Case 1) uses "surveys" and "interviews" as theatrical props while dismissing all counter-evidence as "consensus capture," making his claims unfalsifiable.  
     *Exclusionary power*: Highest. Filters out cases like the TV presenter, Velikovsky’s subculture, and Atlantis popularizers who immunize claims against critique.  

  2. **Engagement with Counter-Evidence** (**NN**)  
     *What it must deliver*: The claimant must address, not evade, substantive counter-arguments or disconfirming data from relevant fields.  
     *Reasoning*: The mathematician (Case 2) likely ignores carbon dating, dendrochronology, or epigraphy that contradict his model. Velikovsky’s followers disregarded orbital mechanics. Pseudohistory dismisses counter-evidence as "corruption" or "dogma"; genuine inquiry (e.g., genomic revisions of Heyerdahl’s thesis, Case 5) adapts to new data.  

  3. **Avoidance of Immunizing Strategies** (**NN**)  
     *What it must deliver*: The claim cannot insulate itself from critique by default (e.g., conspiracism, ad hominem attacks on specialists, or redefining success).  
     *Reasoning*: Central to Case 1 (TV presenter), Case 3 (Velikovsky subculture), and ancient astronaut theories (Case 7). Schliemann (Case 4) was wrong but did not accuse critics of malice—he invited scrutiny.  

  4. **Epistemic Accountability to Evidence** (**NN**)  
     *What it must deliver*: The claim must prioritize empirical evidence over predetermined conclusions. Methodological errors are acceptable if corrigible; *systematic* distortion is not.  
     *Reasoning*: Donnelly (Case 1) cherry-picked parallels for Atlantis; the mathematician (Case 2) forces data into a preordained timeline. Schliemann (Case 4) misinterpreted strata but generated new archaeological data. Heyerdahl (Case 5) was wrong but produced testable maritime data.  

  5. **Corroborative Compatibility** (**Preference**: Archivist/Debunker)  
     *What it must deliver*: The claim should align with established evidence from *adjacent disciplines* (e.g., physics, genetics, geology) without requiring specialist verification.  
     *Reasoning*: Oral traditions (Case 6) gain credibility when corroborated by sea-level geology, even if transmitted narratively. Velikovsky violated physics; the mathematician (Case 2) clashes with dendrochronology.  

  6. **Social Function Neutrality** (**Preference**: Sociologist)  
     *What it must deliver*: Demarcation must *not* depend on a claim’s political/social function (e.g., colonial apologism, nationalism).  
     *Reasoning*: Case 7 shows ancient-astronaut theories share colonial logic, but functional criteria overextend to include state-mandated curricula (which may be biased but not pseudohistorical). Function is diagnostically useful but not demarcative.  

  7. **Non-Reliance on Consensus** (**Preference**: Falsificationist)  
     *What it must deliver*: Rejection by specialists cannot be the *primary* criterion.  
     *Reasoning*: Case 3 (Velikovsky suppression) and Case 4 (Schliemann’s dismissal) show consensus can be wrong or gatekeeping. Case 2 requires this to avoid circularity.  

  ---

  ### **Impossibilities and Trade-offs**  
  - **The trilemma**: You cannot jointly satisfy **Constraints 1–3**.  
    - A criterion operable by non-specialists in one day (Constraint 1) cannot reliably assess technical methods (e.g., Case 2’s statistics).  
    - A non-gameable criterion (Constraint 3) is impossible: practitioners *will* mimic transparency (e.g., Case 1’s TV host "interviewing specialists").  
    - Explaining demarcation without "trust us" (Constraint 2) requires oversimplifying edge cases (e.g., Case 6’s oral traditions vs. folklore).  
  - **Where it breaks**: Gaming resistance (**Constraint 3**) is the fatal flaw. Pseudohistory *adapts* (e.g., co-opting "surveys" or "data" as in Cases 1 and 2). The best guard is **Requirement 3 (Immunizing Strategies)**, but it requires contextual judgment.  

  ---

  ### **Scoring Existing Accounts**  
  - **Falsificationist** (e.g., Popper):  
    Strong on **Requirements 1–3** (testability, engagement, no immunizing). Fails Case 4 (Schliemann’s literary hunch wasn’t falsifiable pre-excavation) and Case 6 (oral traditions lack lab-testable claims). *Useful but incomplete*.  
  - **Consensus/Expertise**:  
    Violates **Requirement 7** and **Constraint 2** (reduces to "trust specialists"). Fails Cases 3–4 (suppressed Velikovsky; dismissed Schliemann). *Useless for your cases*.  
  - **Immunizing Strategies/Degenerating Programs** (e.g., Lakatos):  
    Excels at **Requirements 1–4**. Best for Cases 1 (TV host), 3 (Velikovsky subculture), and 7 (ancient astronauts evade counter-evidence). Struggles with Case 5 (Heyerdahl generated new data despite flawed program). *Most robust for exclusion*.  
  - **Social Function**:  
    Vital for diagnosing Case 7 but violates **Requirement 6**. Over-includes nationalist histories. *Diagnostic tool, not demarcative*.  

  ---

  ### **The Verdict and Style Guide Prescription**  
  **The project fails perfect demarcation**, but **Requirements 1–4** are non-negotiable for excluding pseudohistory. **Requirement 3 (Avoidance of Immunizing Strategies)** does the heaviest exclusionary work and is least gameable when paired with **Requirement 1 (Testability)**.  

  **For your style guide**:  
  > *Label a claim pseudohistorical if it (a) cannot be independently verified or falsified, (b) systematically evades counter-evidence, or (c) attacks critics as corrupt/dogmatic. This does not apply to disputed but testable claims, even if fringe.*  

  **Why this works for your cases**:  
  - Case 1: Plato (fiction) exempt; Donnelly/TV host fail (c).  
  - Case 2: Mathematician fails (b)/(c) by ignoring carbon dating.  
  - Case 3: Velikovsky’s *subculture* fails (b); suppression irrelevant.  
  - Case 4: Schliemann was testable (a), corrigible (b).  
  - Case 5: Heyerdahl was testable (a), produced data.  
  - Case 6: Oral traditions become history when corroborated geologically (a).  
  - Case 7: Ancient astronauts fail (b)/(c); colonial function is context, not criterion.  

  **What to argue about**: Defend **Requirement 3 (Immunizing Strategies)**. It excludes bad actors without requiring specialist knowledge and explains why Cases 1–3 and 7 are pseudohistory *regardless* of credentials or surface rigor. For Constraints 1–3, concede the criterion is fallible but publishable: it shifts burden to claimants to demonstrate testability and good-faith engagement.
