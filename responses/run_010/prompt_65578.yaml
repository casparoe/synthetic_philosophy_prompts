prompt: |-
  You're an expert on the philosophy of paternalism and behavioural public policy — ideally with the patience of a postgrad tutor in office hours. Think it through properly before you answer, but keep the working to yourself; I just want the result.

  I'm in week five of a political philosophy module and we've just done paternalism and nudging. The seminar left me with a set of verdicts I can't line up, so I'm trying to go case by case and see what principle they add up to. Here they are, with my gut on each:

  1. Opt-out rather than opt-in for organ donation. Fine.
  2. Fruit at eye level in the staff canteen, crisps on the bottom shelf. Fine.
  3. Auto-enrolment into a workplace pension, opt-out takes two clicks. Fine.
  4. Supermarkets moving sweets away from the checkouts. Fine.
  5. A tax letter telling you that nine out of ten people in your town have already paid. Fine if true, dodgy if the number's invented — but I don't think truth is what's doing the moral work here, and I can't say what is.
  6. A loss-framed warning on gambling adverts that only bites because people don't consciously register the framing; spell out the mechanism and it loses its punch. Not fine, even though it saves people money and even though there's nothing wrong in principle with telling them.
  7. The identical message, announced in full beforehand — here's the framing, here's why we're using it, it'll still move you somewhat — and people then mostly forget and get moved anyway. Fine.
  8. An app I set up myself that donates £5 to a party I despise every time I skip the gym. Turning it off is possible but deliberately buried three menus deep. Fine.
  9. A gym membership where cancelling requires a letter and a phone call during business hours. Not fine. Structurally 8 with a different agent, which I know is a problem for me.
  10. A regulator changing the default that firms must offer, so millions get nudged by companies who never gave it a thought. Probably fine, though I'm least sure here.
  11. Printing last election's turnout for your ward on the polling card. Not fine, even though it looks like 5 and like 10 with the serial numbers filed off.

  My tentative principle is: a nudge is permissible iff the subject would endorse it on reflection and could undo it cheaply. It's already in trouble — 8 and 9 have the same undo cost and I judge them oppositely, 6 and 7 differ only in whether the disclosure is remembered, and in 11 I'd endorse it on reflection in a world where the other side does the same, which feels like a cheat.

  So: is there a principle, or a small set of clauses, that gets all or most of these? For each candidate, state it precisely, say which of my cases motivated each clause, make up two or three cases I haven't thought of and rule on them yourself, and be straight about which of my verdicts it can't accommodate — tell me which one it forces me to give up. And settle 6 vs 7 for me if you can, because if they really can't be separated then half my list collapses.

  Bottom line in your very first sentence — which principle you'd back and what it costs me — then the reasoning behind it. No preamble, no repeating my question back at me.
reasoning: |-
  Hmm, the user is grappling with paternalism and nudging cases in their political philosophy module, trying to reconcile their intuitive judgments across 11 scenarios. They've proposed a principle about endorsement and cheap undoability but recognize inconsistencies - particularly between cases 8 and 9 (self-imposed vs corporate friction), and 6 and 7 (hidden vs disclosed framing effects). The core tension seems to be about who controls the nudge and whether its mechanisms are transparent.

  Looking at their cases, several patterns emerge: They consistently approve state nudges that are easily reversible (1-4) and transparent (7), but reject deceptive framing (6) and corporate exploitation (9). The self-nudge (8) gets a pass despite high undo cost because agency resides with the user. Case 11 puzzles them because it mirrors acceptable cases (5,10) but feels manipulative in electoral context - suggesting context matters more than structure.

  Their proposed principle fails because endorsement is circular (people might endorse nudges only if they work, which requires non-transparency) and undo cost doesn't explain the 8/9 divergence. A better approach might separate three dimensions: source of nudge (self/corporate/state), transparency, and default reversibility. 

  For 6 vs 7: The critical distinction is whether the framing's influence depends on the subject's unawareness. In 6, effectiveness requires deception; in 7, the mechanism survives disclosure because it leverages cognitive biases transparently. This makes 6 akin to manipulation while 7 respects autonomy through upfront honesty.

  The principle I'd defend is: "Permissible nudges must be transparently implemented, easily reversible, and sourced from agents with public legitimacy for that domain." This...
  - Explains 8 (self-source legitimizes high undo cost)
  - Condemns 9 (corporate source lacks legitimacy for intentional friction)
  - Allows 6 only if redesigned to be transparent
  - Handles 11 by noting electoral authority lacks mandate for turnout nudges (unlike tax authority in 5)

  What it costs: Must accept that corporate nudges (10) require regulatory oversight to be legitimate, and that 11 remains impermissible unless election authorities have explicit behavioral mandate.

  New cases testing the principle:
  - A bank hiding fee waivers in complex forms: Impermissible (corporate exploitation without transparency)
  - Government using peer-comparison in energy bills: Permissible (transparent, reversible, legitimate public goal)
  - Fitness app sharing workout data with friends by default: Impermissible if non-transparent, even if reversible

  The key insight is that nudges aren't neutral tools - their ethics depend on who wields them and how openly, not just outcomes.
answer: |-
  **Bottom line:** The best principle is: *A nudge is permissible if (a) its mechanism is transparent to the subject at the point of choice, (b) it is easily reversible by the subject, and (c) it comes from an agent with legitimate standing to intervene in that domain.* This forces you to reject your verdict on **Case 6** (it’s impermissible) and accept **Case 11** (it’s fine), while clarifying **6 vs 7**.

  ---

  ### The Principle Explained
  1. **Transparency at choice** (Motivated by **Cases 6, 7, and 11**):  
     The nudge’s design must not rely on hidden mechanics to work. **Case 6** fails (unregistered framing is covert); **Case 7** passes (disclosed upfront). **Case 11**’s turnout stat is transparent information—no hidden mechanism.  
     *Cost:* You must abandon your "not fine" verdict on **Case 11** (it’s permissible).  

  2. **Easy reversibility** (Motivated by **Cases 8, 9, and 3**):  
     Undoing the nudge must be low-cost (time/effort). **Case 8** (self-imposed) and **Case 3** (two clicks) pass; **Case 9** (letter/phone call) fails. Your differing judgments on 8 vs 9 are resolved by agent legitimacy (below), not reversibility alone.  

  3. **Agent legitimacy** (Motivated by **Cases 9, 10, and 11**):  
     The nudging agent must have a justified role in that context. **Case 9** (gym) lacks legitimacy (profit-driven friction); **Case 10** (regulator) has democratic mandate; **Case 11** (election authority) has legitimate interest in voter turnout. Self-nudges (**Case 8**) inherently satisfy this.  

  **Settling 6 vs 7**:  
  - **Case 6** fails transparency—it exploits subconscious framing *without* awareness, undermining autonomy.  
  - **Case 7** passes—disclosure respects autonomy; residual effect is non-manipulative.  

  ---

  ### Testing the Principle: New Cases  
  1. **A calorie-count app that subtly grays out junk food options in photos**.  
     *Ruling:* **Impermissible**. Fails transparency (covert manipulation).  

  2. **Government auto-enrolling citizens in green energy plans, opt-out via one online form**.  
     *Ruling:* **Permissible**. Transparent (disclosed), reversible, legitimate public goal.  

  3. **A bank "nudging" overdrafts by hiding fee waivers in complex submenus**.  
     *Ruling:* **Impermissible**. Fails transparency and agent legitimacy (profit-driven deception).  

  ---

  ### Verdicts Your Principle Accommodates  
  - **Fine:** 1 (transparent default), 2 (transparent choice architecture), 3 (reversible), 4 (transparent), 5 (transparent info), 7 (disclosed framing), 8 (self-imposed), 10 (legitimate regulator).  
  - **Not fine:** 6 (non-transparent), 9 (illegitimate agent).  
  - **Revised:** 11 now **fine** (transparent info from legitimate agent).  

  **What you lose**: Your "not fine" verdict on **Case 11** (turnout stats) and "fine" on **Case 6** (hidden framing). The transparency clause forces these.
