  The most damaging disanalogies appear to be: the absence of normalcy baseline in CEV (which devastates the empty-chair transfer), the procedural vs stipulative idealization methods, and the plural vs singular nature of the subjects. Curiously, differences like "analysis vs specification" seem less critical to the core objection.

  I suspect the analogy quietly imports problematic assumptions from IOT - particularly that idealization has a determinate endpoint and that the idealizer remains recognizably human. But CEV explicitly avoids these!

