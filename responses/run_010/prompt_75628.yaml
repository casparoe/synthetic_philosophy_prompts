  We are writing desiderata for a theory of one-shot concept induction in the Bongard problem setting. The goal is to specify what any account must deliver to be considered adequate, and to use this to evaluate different approaches.

  Key elements from the user's position:
  - The concept must be defined before application (not just high accuracy on held-out figures).
  - The theory must account for the process of concept formation, not just classification.

  We'll break down the desiderata into requirements, each with:
  1. The requirement.
  2. A motivating case.
  3. A tag (non-negotiable, contested, or camp prejudice).

  Then we test against three probes (a, b, c) provided.

  Finally, we discuss which requirement is most excluding, whether any subset is jointly unsatisfiable, and evaluate three types of accounts.

  ---

  **Desiderata for a Theory of One-Shot Concept Induction in Bongard Problems**

  **Requirement 1: Concept Articulability and Checkability**
     - *Requirement*: The concept induced must be articulable (expressible in a symbolic or descriptive form) and independently checkable against any figure without reference to the original set. This means that after induction, the concept can be stated and then used to verify new instances.
     - *Motivating Case*: Consider a Bongard problem where the left class has figures with an even number of shapes and the right has odd. Without an explicit concept, one might memorize the counts for the training figures, but that fails on new figures. The concept must be abstracted and articulated (e.g., "count the shapes and check if even") so that it can be applied to any new figure.
     - *Tag*: Non-negotiable (from the user's position that the concept must exist prior to application).

  **Requirement 2: One-Shot Induction from Minimal Exposure**
     - *Requirement*: The theory must account for the ability to induce a concept from exactly one example per class (the six figures on each side are presented simultaneously, so it's one-shot per class).
     - *Motivating Case*: The classic Bongard setup: six figures on the left and six on the right. The system must form a hypothesis from these twelve without iterative training or multiple epochs. This is the core of the Bongard challenge.
     - *Tag*: Non-negotiable (by definition of the benchmark).

  **Requirement 3: No Privileged Innate Feature Vocabulary**
     - *Requirement*: The theory must not rely on a fixed, hand-coded set of features that are known a priori. The feature vocabulary should either be learned or be so general that it does not presuppose the solution.
     - *Motivating Case*: A Bongard problem that requires recognizing a novel geometric property (e.g., "has a shape that is a concave polygon") that is not in a predefined list. If the system only has basic features (e.g., color, size, simple shapes), it will fail. The system must be able to construct new features or relations.
     - *Tag*: Contested (some camps, like deep learning, might argue that features can be learned from data, while others might rely on a DSL; but the requirement for no hand-coded features is a camp prejudice of those seeking open-ended learning).

  **Requirement 4: Handling Relational Concepts**
     - *Requirement*: The theory must be able to induce concepts that are defined by relations between multiple figures or by properties that only emerge in the set (i.e., not per-figure).
     - *Motivating Case*: Probe (a): A problem where the discriminating concept cannot be read off any single figure. For example, left figures are such that for every figure in the set, there is another figure that is a mirror image (so the set has pairs of mirror images), while the right set does not have this property. No single figure has the property "has a mirror pair in the set"; it's a set-level property.
     - *Tag*: Non-negotiable (because such problems exist and must be handled).

  **Requirement 5: Overcoming Salience and Garden-Path Traps**
     - *Requirement*: The theory must account for the ability to reject an initially salient but incorrect hypothesis when it fails on one or a few examples, and then find a less salient but correct one.
     - *Motivating Case*: Probe (b): A garden-path problem. Suppose the left class has five figures with a triangle and one with a square, and the right class has five with a circle and one with a triangle. The salient feature "has a triangle" would incorrectly classify the sixth figure on the left (which has a square) as right (because right has a triangle) and the sixth on the right (which has a triangle) as left. The correct concept might be "majority shape is triangle" for left and "majority shape is circle" for right. The theory must revise the initial hypothesis.
     - *Tag*: Non-negotiable (as it is a common human reasoning challenge).

  **Requirement 6: Iterative Refinement of Descriptions**
     - *Requirement*: The theory must allow for the refinement of a partial description when it becomes inadequate, possibly by backtracking or by building upon the partial description.
     - *Motivating Case*: Probe (c): A problem where the correct description of a figure is unavailable until the solver has committed to a partial description and can return to revise it. For example, a figure might have a complex arrangement that requires step-by-step interpretation: first, note that there are two shapes, then that one is inside the other, then that the inner shape has a specific property (e.g., it is rotated by 45 degrees). The initial partial description (e.g., "has two shapes") might be revised to include spatial relations and then angles.
     - *Tag*: Contested (some theories might assume descriptions are generated in one pass, while others allow iterative refinement; it might be a camp prejudice for cognitive architectures that model human problem-solving).

  **Requirement 7: Distinguishing Concept Formation from Application**
     - *Requirement*: The theory must clearly separate the process of forming the concept (induction) from the process of applying it (deduction). The concept must be a reusable entity.
     - *Motivating Case*: Without this separation, a system that memorizes the training figures and uses a nearest-neighbor approach might achieve high accuracy but has not formed a concept. The concept must be separable and applicable to novel figures.
     - *Tag*: Non-negotiable (from the user's core position).

  **Requirement 8: Consistency with Human Performance and Errors**
     - *Requirement*: The theory should be consistent with known patterns of human performance, including common errors and the time taken, in so far as Bongard problems are designed for humans.
     - *Motivating Case*: Humans sometimes fail on Bongard problems in characteristic ways (e.g., getting stuck on a garden path). A theory that always gets the right answer instantly might not be psychologically plausible.
     - *Tag*: Camp prejudice (for those aiming at psychological realism).

  **Requirement 9: Minimal Description Length Preference**
     - *Requirement*: The theory should prefer simpler concepts (in terms of description length) when they fit the data, but without overcommitting to simplicity when the data require complexity.
     - *Motivating Case*: In many Bongard problems, the correct concept is the simplest one that fits. However, in the garden-path probe (b), the simplest concept (e.g., "has triangle") fails, and a slightly more complex one (e.g., "majority shape is triangle") is needed. The theory must balance simplicity and fit.
     - *Tag*: Contested (MDL is a camp, but not universal).

  ---

  **Testing the Requirements Against the Probes**

  **Probe (a): Relational Concept (Set-Level Property)**
     - *Requirement 4*: This probe directly tests Requirement 4 (Handling Relational Concepts). A theory that cannot represent or induce set-level properties will fail. Also, Requirement 7 is challenged because the concept is not about a single figure but about the set. The concept must be articulated as a set property (Requirement 1). This probe breaks the independence assumption (each figure classified alone) and thus forces a theory to have a representation that can capture set-level relations.

  **Probe (b): Garden-Path Problem**
     - *Requirement 5*: This is the direct test for Requirement 5 (Overcoming Salience Traps). Also, Requirement 9 (MDL) is tested because the initially salient simple concept must be rejected for a more complex one. Requirement 6 (Iterative Refinement) might be needed if the system first forms the simple hypothesis and then revises it.

  **Probe (c): Iterative Refinement of Descriptions**
     - *Requirement 6*: This probe directly tests Requirement 6. The theory must allow for the process of building a description incrementally and revising earlier steps. It also tests Requirement 1 because the final concept must be articulable.

  ---

  **Which Requirement Excludes the Most Candidates?**

  Requirement 3 (No Privileged Innate Feature Vocabulary) is likely the most excluding. Many existing systems (especially symbolic ones) rely on a predefined set of features or a domain-specific language (DSL). Without a rich enough DSL, they cannot express novel concepts. Deep learning models might avoid this by learning features, but they often fail at one-shot induction (Requirement 2) and articulability (Requirement 1). This requirement forces the theory to either have an open-ended feature learning mechanism or an extremely general vocabulary, which is challenging.

  ---

  **Joint Unsatisfiability of a Subset of Requirements?**

  Consider the subset: 
  - Requirement 3 (no privileged innate feature vocabulary)
  - Requirement 2 (one-shot induction: one exposure per class)
  - Requirement 1 (concept articulable and checkable)

  Is this subset jointly satisfiable?

  - Without a predefined feature set (Requirement 3), the system must generate features from scratch in one shot (Requirement 2). 
  - But one-shot induction with no prior features is extremely difficult because the system has to both invent the relevant features and the concept that uses them in a single go.
  - Moreover, the concept must be articulable (Requirement 1), which typically requires a symbolic representation.

  This might be satisfiable by a system that has a very general mechanism for feature construction (e.g., generating a huge space of possible features and then selecting among them) but in practice, the combinatorial explosion might make it infeasible without prior biases (which might be seen as a privileged vocabulary). Alternatively, a system that uses pre-trained feature extractors (like a neural network trained on other data) might violate the spirit of Requirement 3 if the pre-training is seen as providing a privileged vocabulary.

  However, if the feature construction mechanism is general enough (e.g., composition of very primitive operations) and not specific to the domain, then it might be acceptable. For example, a system that can compose basic geometric operations (like rotation, translation, etc.) to build complex features without prior knowledge of what will be needed.

  But note: the requirement for one-shot induction (only twelve figures) and articulability might force the system to have a built-in language for composition (which could be seen as a privileged vocabulary). This tension might be resolved if the "vocabulary" is minimal and domain-general (like a programming language) and not hand-coded for the specific problem.

  Thus, while challenging, it is not necessarily unsatisfiable. However, it is a very high bar and might require a system that is very flexible in its representations.

  ---

  **Evaluation of Three Accounts Against the Desiderata**

  1. **Description-Length Account (e.g., based on MDL)**:
     - *Concept Articulability*: Good, because the concept is chosen by its description length, which is explicit.
     - *One-Shot Induction*: Can be done by searching for the shortest description that fits the examples.
     - *No Privileged Vocabulary*: Fails if the description language is fixed (so the features are privileged). If the language is open-ended, then the search becomes intractable.
     - *Relational Concepts*: Can handle if the description language includes relations, but set-level properties might require a higher-order language which increases complexity.
     - *Garden-Path*: Might fail if the initial short description is wrong and the search doesn't backtrack to longer ones (unless the MDL search is exhaustive).
     - *Iterative Refinement*: Not naturally supported; typically a batch search.
     - *Distinguishing Formation/Application*: Clear separation: the concept is the description, then it is applied.
     - *Human Consistency*: MDL might not account for human salience effects (e.g., garden paths).
     - *Verdict*: Strong on simplicity and articulability, but weak on feature learning and may not handle complex probes without a very expressive language.

  2. **Bayesian Program Learning (BPL) over a Supplied DSL**:
     - *Concept Articulability*: Good, because the concept is a program in the DSL.
     - *One-Shot Induction*: Designed for one-shot learning by Bayesian inference over programs.
     - *No Privileged Vocabulary*: Fails because the DSL is supplied and domain-specific (e.g., for geometry). If the DSL is too narrow, it cannot handle novel concepts; if too broad, inference is hard.
     - *Relational Concepts*: Can handle if the DSL includes relational constructs, but set-level properties might be difficult (unless the DSL has set operations).
     - *Garden-Path*: Bayesian updating can revise hypotheses, so it might recover from initial incorrect hypotheses if the prior allows.
     - *Iterative Refinement*: The probabilistic search might allow for building programs incrementally.
     - *Distinguishing Formation/Application*: Clear: the program is formed then run on new figures.
     - *Human Consistency*: Can model uncertainty and revision, but the prior might not match human biases.
     - *Verdict*: Strong on structured concept formation and revision, but the reliance on a DSL violates Requirement 3. Also, set-level properties (probe a) might be challenging.

  3. **Open-Ended Bottom-Up Account (e.g., connectionist or neural-symbolic with many weak concepts)**:
     - *Concept Articulability*: Weak; neural networks are often black boxes. However, some neuro-symbolic approaches might extract symbolic descriptions.
     - *One-Shot Induction*: Weak; neural networks typically require many examples unless pre-trained (which might violate the no privileged vocabulary requirement).
     - *No Privileged Vocabulary*: Strong in the sense that features are learned, but pre-training might introduce bias.
     - *Relational Concepts*: Weak; relational reasoning is a known challenge for standard neural networks without specific architectures.
     - *Garden-Path*: Might get stuck in local minima and not revise easily.
     - *Iterative Refinement*: Potentially through iterative processing (e.g., attention mechanisms), but not guaranteed.
     - *Distinguishing Formation/Application*: Blurry; the network might not form a separable concept.
     - *Human Consistency*: Might capture salience and errors, but not necessarily.
     - *Verdict*: Weak on articulability and one-shot induction without prior training, but strong on learning features. Might struggle with the probes.

  ---

  **Conclusion**

  The most excluding requirement is likely Requirement 3 (no privileged innate feature vocabulary). The subset of Requirements 1, 2, and 3 is challenging but potentially satisfiable with a sufficiently general and compositional feature construction mechanism. However, it remains a high bar and might require a hybrid approach.

  Ultimately, no single account satisfies all requirements perfectly. A hybrid that combines the flexibility of bottom-up feature learning with the structure of program induction might be necessary, but it remains an open challenge.
answer: |-
  ### Desiderata for a Theory of One-Shot Concept Induction in Bongard Problems  
  Adequate theories must explain *how* concepts are formed from minimal data, not just classify figures. Below are core requirements, with motivations, tags, and distinctions they enforce.  

  #### **Core Requirements**  
  1. **Articulable Concept Representation**  
     - *Requirement*: The induced concept must be explicitly representable (e.g., symbolic, linguistic, or programmatic) and independently verifiable against any figure.  
     - *Motivation*: Without this, "successful classification" could stem from pattern-matching without conceptual understanding (e.g., memorizing pixel clusters).  
     - *Tag*: **Non-negotiable** (distinguishes *concept formation* from *classification*).  

  2. **One-Shot Induction with Minimal Data**  
     - *Requirement*: The concept must be induced from exactly six examples per class, with no iterative training or external data.  
     - *Motivation*: Bongard problems are defined by this constraint; systems requiring more examples or fine-tuning miss the core challenge.  
     - *Tag*: **Non-negotiable** (benchmark specification).  

  3. **No Privileged Feature Vocabulary**  
     - *Requirement*: The theory must not rely on predefined, domain-specific features (e.g., "circle," "above"). Features should emerge from data or be domain-agnostic.  
     - *Motivation*: Humans solve novel Bongard problems without hardcoded geometric primitives; a theory with baked-in features is brittle.  
     - *Tag*: **Prejudice of open-ended learning camps** (e.g., cognitive architectures favoring compositionality).  

  4. **Cross-Figure Relational Reasoning**  
     - *Requirement*: The theory must handle concepts defined by relations *between* figures (e.g., "all left figures share property P with at least one other").  
     - *Motivation*: Probe (a): *Left figures are vertices of a single connected graph; right are disconnected subgraphs*. No single figure reveals the concept—it requires analyzing the set.  
     - *Tag*: **Non-negotiable** (distinguishes *intra-figure* from *inter-figure* properties).  

  5. **Salience Override and Hypothesis Revision**  
     - *Requirement*: The theory must reject initially salient but incorrect hypotheses when they fail on outliers, and pivot to less obvious alternatives.  
     - *Motivation*: Probe (b): *Left: five triangles + one square; Right: five squares + one triangle*. Salient hypothesis "triangles vs. squares" fails on the sixth figure; correct concept is "majority shape".  
     - *Tag*: **Non-negotiable** (tests *robust concept formation*, not just fitting a majority).  

  6. **Iterative Description Refinement**  
     - *Requirement*: Partial descriptions must be revisable after commitment (e.g., generating hypotheses that require reinterpreting earlier observations).  
     - *Motivation*: Probe (c): *Figures contain nested shapes with recursive properties (e.g., "inner shape rotates 45° relative to outer")*. Initial description ("two shapes") is incomplete; the solver must revisit it after detecting rotation.  
     - *Tag*: **Contested** (symbolic models favor this; connectionist models often avoid backtracking).  

  7. **Distinction Between Hypothesis Space and Search**  
     - *Requirement*: The theory must separate the *vocabulary* for describing concepts (e.g., logical predicates) from the *search process* over hypotheses.  
     - *Motivation*: Without this, "learning" reduces to enumerating a fixed list (e.g., testing all precompiled rules). Human solvers dynamically generate candidate concepts.  
     - *Tag*: **Non-negotiable** (prevents conflating *description language* with *inductive mechanism*).  

  8. **Consistency with Human-Like Errors**  
     - *Requirement*: The theory should predict common human failure modes (e.g., garden-path effects, overlooking relational cues).  
     - *Motivation*: Bongard problems are cognitive tasks; theories ignoring human foibles (e.g., rigidity in symbolic systems) lack explanatory power.  
     - *Tag*: **Prejudice of psychological realism camps**.  

  ---

  ### **Testing Probes**  
  - **Probe (a) (Relational Concept)**: Breaks theories assuming figure independence (e.g., standard classifiers). Only satisfies **Requirement 4** if the concept represents cross-figure dependencies (e.g., graph connectivity).  
  - **Probe (b) (Garden-Path)**: Tests **Requirement 5**. Successful theories must deprioritize salience (e.g., via Bayesian surprise) and recover correct concepts.  
  - **Probe (c) (Iterative Refinement)**: Violated by one-pass systems (e.g., linear feature extractors). Requires **Requirement 6** for incremental description updates.  

  ---

  ### **Most Exclusionary Requirement**  
  **Requirement 3 (No Privileged Feature Vocabulary)** excludes the most candidates:  
  - Classical AI (e.g., rule-based systems) relies on hand-coded features.  
  - Deep learning often depends on pretrained feature extractors (violating "no innate vocabulary").  
  - Bayesian models with fixed domain-specific languages (DSLs) fail unless the DSL is infinitely extensible.  

  ---

  ### **Joint Unsatisfiability of Requirements**  
  The subset **{Requirement 1 (Articulable), Requirement 2 (One-Shot), Requirement 3 (No Privileged Vocabulary)}** is **jointly unsatisfiable without compromise**:  
  - **Why?**  
    - One-shot induction (**R2**) with no innate features (**R3**) demands *generating* features from scratch. But without prior structure, the hypothesis space is infinite, making search intractable.  
    - Articulability (**R1**) requires a finite representational format, which typically necessitates *some* prior constraints (e.g., a grammar).  
  - **Resolution**: One of the three must be relaxed:  
    - *Drop R3*: Allow minimal innate biases (e.g., geometric primitives).  
    - *Weaken R1*: Permit probabilistic or fuzzy concepts (sacrificing rigor).  
    - *Amend R2*: Permit "one-shot plus background knowledge" (e.g., pretraining).  
    Pure theories (e.g., tabula rasa connectionism) fail R1; rigidly symbolic systems fail R3.  

  ---

  ### **Evaluation of Candidate Theories**  
  1. **Description-Length (MDL) Accounts**  
     - *Strengths*: Satisfies **R1** (concepts are symbolic), **R5** (shortest description may override salience), and **R7** (explicit hypothesis space).  
     - *Weaknesses*: Fails **R3** (assumes fixed vocabulary); struggles with **R4** (relational concepts inflate description length) and **R6** (no backtracking).  
     - *Verdict*: Adequate only with extensible DSLs.  

  2. **Bayesian Program Learning (with DSL)**  
     - *Strengths*: Excels at **R1**, **R2**, **R5** (Bayesian updating revises hypotheses), and **R6** (probabilistic programs allow refinement).  
     - *Weaknesses*: Fails **R3** (DSL is privileged); may miss **R4** (set-level concepts) if DSL lacks relational operators.  
     - *Verdict*: Powerful but DSL-dependent—violates the "no hand-coded features" ethos.  

  3. **Open-Ended Bottom-Up (e.g., Connectionist/Neuro-Symbolic)**  
     - *Strengths*: Best for **R3** (learns features); handles **R6** (iterative refinement via attention); consistent with **R8** (human-like errors).  
     - *Weaknesses*: Fails **R1** (concepts often inarticulable); dubious on **R2** (one-shot requires pretraining); weak on **R4** (relational reasoning).  
     - *Verdict*: Strong for *approximation* but fails core rigor requirements.  

  ---

  ### **Conclusion**  
  No theory satisfies all desiderata perfectly. **Bayesian Program Learning** comes closest but stumbles on innate vocabulary (**R3**); **bottom-up approaches** are flexible but opaque; **MDL** is rigorous but inflexible. The tension between **R1**, **R2**, and **R3** reveals a paradox: one-shot articulable concept induction *requires* innate structure—but admitting this privileges "camp taste." Future work must either formalize minimal universal priors (e.g., computational building blocks) or redefine "adequacy" to permit graded success. Until then, Bongard problems remain a benchmark for *aspiration*, not a "solved" task.
