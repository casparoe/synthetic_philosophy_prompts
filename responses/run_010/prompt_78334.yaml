  - Credence isn't real probability because we don't know what sentience means for larvae
  - Reference class problem (arthropods vs insects vs specific species) creates 1000x variance
  - Non-independence means we're copying one uncertainty 300 billion times rather than having independent trials

  The twist: their numerical proposals are only 0.02 vs 0.01 - deceptively close despite philosophical chasm.

  Hmm, the challenge is making their positions equally defensible while keeping the tension. Aris must have real counters to Silas's objections, and Silas must justify why his position isn't just avoiding action. 

  For Aris's counterarguments:
  - Against reference class: She could argue that even if classes vary, we must pick the best available (say, holometabolous insects) and sensitivity analysis shows it doesn't change the magnitude
  - Against non-independence: She might concede the point but argue that multiplying still reflects the scale of potential catastrophe, comparing it to pandemic prep where we act on low-probability threats

  For Silas's rebuttal:
