prompt: |-
  Anglo-American insurance law has long required that anyone buying a policy hold an insurable interest in its subject matter, but the requirement is applied so unevenly that I cannot make it cohere. In life insurance the interest need exist only at inception: a policy taken out by, say, a spouse may later be sold to an investor with no connection to the insured who stands to gain from the death, and there is a large secondary market in precisely such policies. Property insurance works the other way — the interest must persist up to the loss, so a seller who has closed on the house generally cannot collect for a fire that occurs afterward. Most states also prohibit arrangements in which a stranger induces someone to take out a policy for the purpose of immediate resale, which suggests the law attaches weight to the moment of origination specifically. Meanwhile, the same legal system cheerfully enforces wagers in which neither party has any exposure at all: licensed bets on athletic contests, and single-name credit default swaps bought by institutions that hold none of the reference bonds and would lose nothing on the default except the premium.

  What account of markets as generators of knowledge does this pattern presuppose, if any? My tentative reconstruction is that the doctrine encodes a principle to the effect that a party's belief about a risk is admitted into the price only when that party has something at stake in how the risk resolves — that exposure is what makes a bid informative rather than a guess. But that principle looks flatly contradicted by the naked credit default swap, and it is not obviously what the life-versus-property asymmetry tracks either. Reconstruct the implicit theory as carefully as the material allows. Consider whether something non-epistemic does the real explanatory work — moral hazard and the incentives the insured faces, the historical unenforceability of gambling debts, the direction in which the transfer runs, or simple path dependence across two different bodies of law. Distinguish what the practice strictly presupposes from what merely sits comfortably with it, and tell me which single doctrinal feature most sharply discriminates among the candidate theories. Finally: suppose a regulator adopted as its working premise that rational parties sharing a common prior should never want to trade with one another, so that any purely speculative transaction is itself evidence that one side is ignorant or not reasoning properly. What would have to change in insurable-interest doctrine, in position limits on futures and swaps, and in the secondary market for life policies — and would that regime be any more coherent than the one we have?
reasoning: |-
  Hmm, this is a sophisticated legal-economic puzzle about insurable interest requirements. The user is clearly well-versed in insurance law and financial markets, presenting a paradox: why does Anglo-American law enforce speculative instruments like CDS while imposing inconsistent timing requirements on insurable interest? Their reconstruction focuses on epistemic justifications but finds contradictions.

  Breaking this down: first, the core inconsistencies need mapping. Life insurance allows interest separation at inception (creating a secondary market), property insurance requires continuity until loss, and stranger-originated policies are banned - while simultaneously, gambling contracts and naked CDS (with zero underlying exposure) are enforced. The user's epistemic hypothesis - that exposure makes pricing informative - seems undermined by naked CDS where pricing occurs without stake.

  The historical context matters here. Gambling law's influence explains much: life insurance developed partly as an exception to gambling prohibitions, hence the focus on initial interest to distinguish from wagering. Property insurance evolved differently because indemnity principle requires continuous interest to prevent moral hazard - you shouldn't profit from a house you've sold. Naked CDS slipped through because derivatives regulation lagged innovation.

  The doctrinal discriminator is clearly the stranger-originated life insurance ban. If epistemic concerns drove the rules, such bans wouldn't exist - yet they do, proving moral hazard prevention is paramount. For the regulatory thought experiment: if we adopted the "no trade without disagreement" premise, we'd need to ban all secondary markets and naked positions. But this ignores legitimate functions like hedging and price discovery - CDS markets did reveal sovereign risks regulators missed. Complete coherence might be unattainable; hybrid systems balancing multiple values may be inevitable.
answer: |-
  Your analysis captures a profound tension in Anglo-American insurance law. Reconstructing the implicit theory requires disentangling epistemic, incentive-based, and historical explanations. The doctrinal patterns presuppose a hybrid theory where **exposure primarily serves to mitigate *moral hazard* rather than generate knowledge**, with historical contingency shaping the life/property divergence.

  ### Core Reconstruction: The Implicit Theory
  1. **Non-Epistemic Anchor: Moral Hazard Prevention**  
     The primary function of insurable interest is to eliminate perverse incentives. Property insurance requires continuity to prevent an insured from *causing* the loss (e.g., burning a sold house). Life insurance’s inception-only rule reflects lower perceived moral hazard risk—people rarely suicide for investors—but stranger-origination bans (STOLI) address cases where inception itself might be fraudulent.  

  2. **Epistemic Function as Secondary**  
     Exposure *incidentally* improves pricing by forcing parties to internalize risks, but this is not the doctrine’s core aim. Naked CDS and gambling are tolerated because:  
     - They lack *insurable interest*’s historical link to indemnity contracts.  
     - Regulators assume sophisticated parties can price risks without exposure (hence CDS markets exist despite "empty crediting").  
     - Knowledge-generation is outsourced to markets via *liquidity* rather than exposure.  

  3. **Historical Path Dependence**  
     - **Life Insurance**: Evolved from maritime "wagers on lives" of slaves/debtors. Initial interest sufficed to distinguish from gambling; later secondary markets emerged organically.  
     - **Property Insurance**: Rooted in indemnity principles (you can’t profit from loss), demanding ongoing interest.  
     - **Gambling/CDS**: Enforceability stems from carve-outs in gaming statutes (e.g., Commodity Exchange Act) and regulatory arbitrage.  

  4. **Direction of Transfer Matters**  
     The law distrusts *risk creation* (e.g., STOLI) more than *risk transfer*. Secondary life policies transfer existing risk, while STOLI manufactures risk solely for speculation—triggering fraud concerns.  

  ---

  ### Key Discriminators Among Theories
  **The single sharpest doctrinal feature is the *STOLI prohibition***.  
  - If epistemic concerns dominated, STOLI would be unproblematic (the originator’s exposure at inception ensures "valid" pricing).  
  - Moral hazard explains it perfectly: STOLI incentivizes fraud (e.g., seniors lied to about policy terms).  
  - Historical contingency also fits—STOLI resembles historical wagering contracts courts long voided.  

  ---

  ### Regulatory Thought Experiment: Implications  
  **Premise:** *"No rational trade under common priors"* → Ban all speculation without asymmetric information or hedging needs.  

  | **Doctrinal Area**         | **Required Changes**                              | **Coherence Outcome**                     |
  |----------------------------|--------------------------------------------------|-------------------------------------------|
  | **Insurable Interest**     | • Life secondary market banned (no "exposure" post-sale)<br>• Naked CDS voided<br>• Property rules unchanged (indemnity preserved) | *More* coherent on paper but ignores: <br>- Hedging needs (e.g., CDS for bond short-sellers)<br>- Liquidity benefits |
  | **Position Limits**        | • Futures/swaps limited to bona fide hedgers<br>• All speculative positions banned | Destroys price discovery; markets collapse without speculators providing liquidity |
  | **Life Insurance Secondary Market** | Eliminated entirely (no exposure = no "knowledge value") | Reduces elderly liquidity but removes "death bets" |

  **Would this be more coherent?**  
  - **Pro:** Eliminates doctrinal hypocrisy (e.g., allowing CDS but banning STOLI).  
  - **Con:** Fatally undermines markets:  
    - **Price Discovery Failure:** Speculators incorporate diverse views; removing them creates information vacuums (e.g., CDS spreads warned of 2008 risks).  
    - **Common Prior Fallacy:** In reality, priors are never truly common—trading reveals hidden information.  
    - **Hedger Harm:** Farmers hedging crop risk need speculators as counterparties.  

  **Verdict:** A superficially coherent but practically unworkable regime. Current law’s "incoherence" reflects balancing act:  
  - Tolerating *some* speculation for liquidity (CDS, life settlements),  
  - Banning structures inviting fraud (STOLI),  
  - Demanding exposure where moral hazard is acute (property).  

  ---

  ### Conclusion
  The law’s implicit theory prioritizes **incentive alignment over knowledge generation**. Exposure matters chiefly to deter fraud or sabotage, not because it yields truer prices. Naked CDS is the outlier, enabled by regulatory gaps rather than philosophical consistency. A "no speculation" regime would be *formally* coherent but epistemically and economically catastrophic—validating Hayek’s insight that markets aggregate knowledge *through* speculation. The existing mosaic, while messy, reflects pragmatic trade-offs between preventing harm and enabling risk-transfer.
