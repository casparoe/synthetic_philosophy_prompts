prompt: |-
  For some years I have been drafting settlement proposals in two-party disputes over a shared productive asset — capacity allocations, joint-venture splits, cost-sharing between adjoining operators — and I have converged, essentially by accident, on a mechanical rule. For each side I compute two numbers: what that side would be left with if no agreement were reached, and the best it could conceivably extract from any arrangement under consideration. I then select the arrangement that gives each side the same fraction of its own span between those two numbers. With zero walk-away values and a surplus of 100 that either side could in principle take entirely, the rule returns 50/50, which is what plain intuition wants, so I have kept using it.

  One preliminary question, which I would like answered but which is not the point: I strongly suspect this rule is not mine, that it has a name, and that it is the standard rival to the rule that instead maximises the product of the two sides' gains over their walk-away values. If I have reinvented something, say what, and say what its defining property is normally taken to be.

  The substance of my question is a pattern I keep running into and have no word for.

  First case. Suppose side A is capacity-constrained — no arrangement under discussion can give A more than 50 — while B could in principle take all 100. My rule then awards A 33⅓ and B 66⅔, each side receiving two-thirds of its own best conceivable figure. Now suppose A's constraint is lifted: a new outlet opens, so that A could in the limit take the whole 100. No previously available arrangement disappears. The rule now returns 50/50 — an arrangement that was on the table all along. B's payoff falls by more than sixteen points, not because anything about B's own position changed and not because anyone selected one of the new extreme arrangements, but purely because the number representing A's best conceivable outcome grew. I have checked the arithmetic, and it is not a knife-edge: B's award declines smoothly as A's new ceiling rises, and for every value of that ceiling the arrangement the rule lands on is one that was available before the constraint was lifted. Only the division moves. The product rule, by contrast, returns 50/50 in both states of the world.

  Second case, which troubles me more. In practice my rule reads the two ceilings off the set of arrangements under consideration, and that set is largely whatever the parties have tabled. A side that tables an arrangement worth 160 to itself and 20 to the other — one it would never accept and the other would never sign — has raised its own ceiling and hence its target fraction, and the settlement drifts decisively in its direction. Nothing here depends on anyone being deceived. The tabling is transparently strategic; the rule consults no one's beliefs, only the menu. (I should add that the rule treats any blend of two tabled arrangements — partial adoption, time-sharing, a side payment — as an arrangement in its own right; in the few cases where I forbade blends and required it to pick an actually tabled proposal, the effect vanished, though I do not know whether that is general or an artefact of my examples.)

  What I want from you:

  1. Does either case have an established name? I have been told that the rule I use is normally defended by a property governing what should happen when one side's best achievable outcome improves, and normally attacked by a property concerning alternatives that ought not to matter. Which of the two does my first case fall under? Is my complaint simply a complaint about the rule's signature virtue, so that the two cannot be separated, or is it a distinct hazard that would survive even in a defender who accepts the virtue?

  2. Why is the product rule apparently immune, if it is immune? Its inputs are the same walk-away values and the same set of arrangements; it simply never consults the ceilings. Is there a term for the family of rules that do, and does this exposure come with membership in that family?

  3. I half-remember a result on the non-cooperative side of bargaining to the effect that an outside option changes the outcome only when it is better than what the party would get by remaining at the table. My rule appears to let an option that is worse than the settlement — one that will never be exercised at all — move the settlement anyway. Is that a recognised tension between the two approaches, or have I misremembered the result?

  4. Is there an established distinction between gaining by altering what is genuinely attainable and gaining by altering what has been tabled, or what the arbiter takes to be attainable? My two cases feel like different species, and I cannot tell whether they are treated together or separately.

  5. Where are the edges? Specifically: does the effect cancel when both sides inflate their ceilings together; does it change when the walk-away values are non-zero and asymmetric; does it require arrangements that only one side can reach?

  If the phenomenon has a name, give it and tell me how my description departs from the standard formulation. If it does not, say so plainly and coin one — but I want the carving, not the label: a definition, the nearest established concepts it must be distinguished from, and the boundary cases above. The reason I am asking is that I need to decide whether to keep proposing settlements under this rule at all, and a bare term of art will not settle that.
reasoning: |-
  Okay, the user is dealing with a complex issue in settlement proposals for shared assets. They've developed a mechanical rule that equalizes the fraction of each party's gain between their walk-away value and their best conceivable outcome. They suspect this isn't original and want to know if it has a name.

  First, I recall that the Nash Bargaining Solution maximizes the product of gains over disagreement points. The user's rule sounds like the Kalai-Smorodinsky solution. That solution focuses on proportional gains relative to the utopia point. The defining property is monotonicity—if one party's maximum possible gain increases, their payoff shouldn't decrease. But the user's first case shows how lifting a constraint hurts the other party, which is actually the intended behavior of KS. 

  The user's second case is trickier. When parties table extreme offers they wouldn't accept, it shifts the utopia point. The KS solution uses these tabled points, so strategic tabling can manipulate outcomes. The Nash solution avoids this because it ignores the utopia point. 

  For the user's questions: Their first case illustrates KS's monotonicity. The complaint is inherent to the rule. The second case is about manipulability via the menu of options. The Nash solution is immune because it doesn't use the utopia point. 

  The outside option principle they mention is from non-cooperative bargaining. KS can be affected by irrelevant alternatives, while Nash adheres to IIA. 

  The distinction between genuine attainability and tabled options is crucial. In theory, KS assumes the utopia point reflects true possibilities, but in practice, parties can game it. 

  Regarding edge cases: If both inflate ceilings, it depends on asymmetry. Non-zero walk-away values change the calculations but not the core issues. The effect requires that one party can unilaterally achieve high outcomes. 

  The user needs to decide whether to keep using this rule. They should understand that KS's monotonicity can lead to outcomes where one party loses when the other's options improve. The manipulability via tabled offers is a practical concern. If transparency and strategy are issues, Nash might be better despite its own limitations. They should consider whether the fairness of proportional gains outweighs these drawbacks in their context.
answer: |-
  Your rule is indeed the **Kalai-Smorodinsky (KS) bargaining solution**. Its defining property is **monotonicity**: if the set of feasible outcomes expands in a way that improves one party’s *maximum attainable payoff*, that party should not end up worse off. Your first case is a textbook illustration of this property. The Nash Bargaining Solution (NBS), which maximizes the product of gains over disagreement points, satisfies **independence of irrelevant alternatives (IIA)**, meaning options worse than the chosen settlement shouldn’t affect the outcome. Your second case highlights a vulnerability in KS that NBS avoids.

  ### Addressing Your Questions
  1.  **Names and Properties**  
      - **First case**: This is **monotonicity in action** – KS’s core virtue. When A’s ceiling rises from 50 to 100, monotonicity demands A gain (from 33.3 to 50), causing B’s loss. *Your complaint is inherent to KS*. Defenders view this as fair (A’s improved prospects *should* benefit A); attackers see it as counterintuitive (B is penalized for A’s unrelated gain).  
      - **Second case**: This is **menu dependence** or **manipulability via the utopia point**. KS uses the *tabled* maxima ("utopia point") to define proportional gains. Strategically tabling extreme (unacceptable) offers inflates your utopia payoff, shifting the KS outcome. *This is a distinct hazard* – even proponents of monotonicity often concede it’s undesirable here. NBS avoids it by ignoring the utopia point.

  2.  **Why the Product Rule (NBS) is Immune**  
      NBS *only* uses the **disagreement point** and the **Pareto frontier**. It doesn’t consult the utopia point. Changing tabled (but irrelevant) alternatives or expanding the feasible set beyond the frontier doesn’t alter the NBS outcome. KS belongs to the family of **monotonic bargaining solutions** or **utopia-point-based solutions**, which inherently expose it to this risk.

  3.  **Outside Option Principle vs. KS**  
      You recall correctly. In non-cooperative bargaining (e.g., Rubinstein), an outside option affects the outcome **only if it exceeds the payoff from continued bargaining**. KS *violates* this: in your second case, a *worse* tabled option (never chosen) moves the settlement. This is a recognized tension. KS prioritizes "what could be" (utopia) over strategic credibility, while non-cooperative models emphasize credible threats.

  4.  **Distinction: Genuine vs. Tabled Feasibility**  
      - **Genuine attainability**: Physical/legal constraints (e.g., A’s capacity ceiling of 50). KS monotonicity responds to changes here.  
      - **Tabled attainability**: What parties *claim* is possible via proposals. KS is vulnerable to strategic inflation here.  
      Theorists assume the feasible set reflects true possibilities. In practice, your second case exploits the gap between *tabled* and *genuine* feasibility – a key operational flaw of KS.

  5.  **Edge Cases**  
      - **Both sides inflate ceilings**: If both table absurdly high demands, the KS outcome *may* shift back toward symmetry *if* the utopia point becomes symmetric (e.g., both claim 160 → KS ≈ 80/80). Asymmetry in true ceilings or demands can still skew it.  
      - **Non-zero asymmetric walk-away values**: Suppose A’s disagreement payoff is \(d_A\), B’s is \(d_B\), true max payoffs are \(m_A\), \(m_B\). KS equalizes:  
        \(\frac{x_A - d_A}{m_A - d_A} = \frac{x_B - d_B}{m_B - d_B}\)  
        Introducing \(d_A > 0\), \(d_B = 0\), and \(m_A < m_B\) still sees B penalized if \(m_A\) rises. The core dynamics persist.  
      - **Unilateral achievability**: The effect *requires* that the inflated "max" be *attainable by one party alone* (e.g., B can unilaterally implement the 160/20 proposal). If all high-payoff outcomes require mutual agreement, the utopia point reflects credible possibilities, reducing manipulability.

  ### Recommendation: Should You Keep Using KS?
  - **Strengths of KS**: Intuitive "equal sacrifice" fairness when ceilings are genuine; satisfies monotonicity (arguably fair when one party's opportunities improve).  
  - **Weaknesses**: Susceptible to strategic tabling ("cheap talk"); penalizes one party when the other's *potential* (not actual agreement) improves; violates outside option principle.  
  - **Consider NBS instead**: Immune to menu manipulation, adheres to outside option principle, but criticized for ignoring relative bargaining ranges (e.g., if A can get 99 alone while B gets 1, NBS still splits surplus 50/50).  

  **If retaining KS**: Mitigate risks by:  
  1. **Auditing feasibility**: Verify tabled maxima are physically/legally achievable.  
  2. **Restricting proposals**: Exclude blatantly non-credible offers (e.g., "B demands 160" if B cannot unilaterally enforce it).  
  3. **Using blends**: As you noted, allowing convex combinations reduces (but doesn't eliminate) manipulability.  

  **Phenomenon Name**: Your core issue is **Utopia-Point Manipulation** within the Kalai-Smorodinsky solution. It arises when the *definition* of the utopia point is ambiguous or gameable. No universal term exists, but it’s a recognized vulnerability contrasting sharply with NBS’s IIA property.  

  Your convergence on KS is understandable, but its exposure to strategic tabling and monotonicity-driven penalties may warrant switching to NBS or a hybrid approach, depending on context and parties’ sophistication.
