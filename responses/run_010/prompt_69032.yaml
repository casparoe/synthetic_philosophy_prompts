prompt: |-
  I'm a moral philosopher and, as penance for something I said at a faculty meeting, I now chair our university's research computing committee. Eight of us: two engineers, one administrator, one person who is quite sure philosophy is a hobby. Twice a term we split a fixed pool of accelerator hours across ~twenty proposals, and the VP for research signs off on whatever we send up, so our reasons have to survive an appeal from the people we cut.

  The thing I keep running into is the utility monster, except it shows up as a claim rather than a person. Nozick's monster was meant to show that utilitarianism goes badly wrong if someone genuinely gets more out of a unit of resource than everyone else combined; what actually lands on my docket is a confident PI asserting they're that person, with a strong incentive to inflate, no obligation to be right, and benefits that are mostly diffuse strangers and future decades. Taurek's refusal to let the numbers count cuts the other way and makes it worse, since the biggest claims are always about enormous numbers of beneficiaries nobody in the room will ever meet.

  Write me a decision procedure the committee can actually run: 90 minuites for a full docket, no economists, nobody who can audit a life-years model, everyone's read the proposals once. I want the questions to ask of a monster-claim in order; what counts as a sufficient answer to each; which ones are settled by facts (marginal product per hour rather than total product, whether returns diminish at the scale they're requesting, how the claim survives being given half, whether the payoff is verifiable inside our time horizon at all) and which are really value calls that we should vote on and admit we're voting on; where the procedure outputs a flat no or a "not this round"; and — this is the part I care about most — how it stays inflation-proof, i.e. what it does once every proposal on the docket claims to be the monster, which is roughly what happens two cycles after you start rewarding big claims.

  Then run it on three cases. (a) A drug-discovery foundation model asking for most of the pool, promising a large expected number of life-years, zero published results, but unusually candid about its own uncertainty. (b) A regional climate downscaling project, small well-documented benefits, long queue of dependent users, nobody's life on the line. (c) A digital humanities corpus proposal from my own department arguing the material is irreplaceable and will still be worth reading in four hundred years. Give me the verdict you'd defend, including on (c), which is mine, so be blunt about it rather than diplomatic.

  Finally, tell me what the procedure can't do: which real monster-claims it will wrongly kill, which distinctions it flattens when it gets turned into a form, and where it's just my priors about human nature wearing a flowchart as a costume. And be explicit about what would change your mind — which argument (Taurek's, or the impossibility of interpersonal comparison, or something I haven't thought of) would make you build this differently, and which single step you think is most likely to break when eight tired people actually use it.
reasoning: |-
  We are designing a decision procedure for allocating a fixed pool of accelerator hours across multiple research proposals. The key challenges are:
  1. Handling "utility monster" claims: proposals that claim an extraordinarily high benefit per unit resource, often with uncertain or distant payoffs.
  2. Inflation-proof: if we reward big claims, then in subsequent cycles every proposal will claim to be a monster.
  3. Practicality: the committee has 8 members (with diverse expertise, but no economists or specialized auditors), 90 minutes for ~20 proposals, and each member has read the proposals once.

  The procedure must:
  - Include a sequence of questions for each proposal, especially those claiming high benefits (monster claims).
  - Specify what counts as a sufficient answer for each question.
  - Distinguish between factual questions (which can be settled by evidence) and value judgments (which require voting).
  - Output either a flat no, a "not this round" (meaning it might be funded in a future round if the pool allows), or an allocation.
  - Be robust against incentive to inflate claims.

  Proposed Decision Procedure:

  Overview:
  The procedure has two main stages: 
  Stage 1: Individual proposal assessment (to screen out non-viable proposals and flag monster claims).
  Stage 2: Comparative allocation (using a scoring system that normalizes claims and incorporates both expected benefit and robustness of the claim).

  Stage 1: Individual Proposal Assessment (to be done by each committee member prior to meeting, then discussed in meeting for flagged proposals)

  For each proposal, ask:

  1. **Feasibility and Verifiability**: 
     - Factual: Is the project technically feasible? Are the claimed benefits verifiable within a reasonable time horizon (e.g., 5-10 years)? 
     - Sufficient answer: Evidence of prior work, pilot results, or a clear validation plan. If not, mark as high risk.
     - If the project is deemed infeasible or completely unverifiable, it gets a flat no.

  2. **Marginal Return**: 
     - Factual: What is the marginal return per accelerator hour? (i.e., how much additional benefit does each additional hour yield?) Does the return diminish at the scale requested?
     - Sufficient answer: The proposal must provide a clear rationale for the number of hours requested, showing that each hour is necessary and that the return does not drop off sharply after a certain point. If the project can be broken into phases, then we can fund a smaller amount and see results.
     - If the project cannot justify the marginal return (e.g., they are asking for a block of hours without which nothing works, but then the return per hour is very high only if the entire block is granted) and if the returns are not diminishing, then it is a candidate for partial funding (or "not this round" if the entire block is required).

  3. **Robustness to Partial Funding**:
     - Factual: Can the project achieve meaningful results with less than the requested hours? 
     - Sufficient answer: The proposal should outline a fallback plan or show that even a fraction of the hours would produce a proportional share of the benefits. If not, then the claim is all-or-nothing, which is risky. Such projects are candidates for "not this round" if we cannot fund the full amount.

  4. **Inflation Check** (for monster claims): 
     - Value/Strategic: Is the claimed benefit per hour extraordinarily high (e.g., orders of magnitude higher than typical proposals)? If so, we must be cautious because of the incentive to inflate.
     - We then ask: How does this claim compare to the proposer's past claims (if any) and to similar projects? Is there independent evidence (e.g., literature) to support the magnitude of the benefit? 
     - Sufficient answer: The proposer must provide a clear, evidence-based chain of reasoning that can be followed by a non-expert. If the chain relies on speculative leaps, then the claim is discounted.
     - This step is meant to discourage inflation: if a monster claim is accepted without strong evidence, it sets a bad precedent. So, without strong evidence, we are inclined to give only partial funding or defer.

  Stage 2: Comparative Allocation

  After Stage 1, we have a list of proposals that are feasible and have passed the initial screening. We then:

  1. **Normalize Benefits**: 
     - For each proposal, we assign two scores (on a scale of 1-10) by committee vote (after discussion):
       a. Expected Benefit Score (EBS): This is the expected magnitude of the benefit, normalized to the scale of the proposal (e.g., per 1000 accelerator hours). We account for the uncertainty (as stated by the proposer) by discounting: if the proposal admits high uncertainty, the EBS is reduced by a factor (e.g., if they say 50% chance of success, then EBS is halved). 
       b. Robustness Score (RS): This captures the verifiability, track record, and the strength of the evidence provided (including the marginal return and partial funding robustness). A proposal with a strong track record and clear verifiable milestones gets a high RS.

  2. **Calculate Composite Score**: 
     - Composite Score (CS) = EBS * RS

  3. **Allocate Hours**:
     - We sort the proposals by CS per hour (i.e., CS divided by the requested hours) from highest to lowest.
     - We then allocate hours in that order until the pool is exhausted.
     - If a proposal cannot be fully funded, we use the partial funding robustness to decide: if the project can still deliver with less, we fund what we can (and adjust the hours to the next milestone if possible). Otherwise, we skip it ("not this round").

  Inflation-Proofing:
  - By using the Robustness Score, we discount claims that are not well-supported by evidence. 
  - By normalizing per hour and comparing across projects, we avoid giving a huge allocation to a monster claim unless it has both high expected benefit and high robustness.
  - The committee must be consistent in applying the scoring, and past allocations (and their outcomes) can be used to calibrate future scores.

  Now, let's run the procedure on the three cases:

  Case (a): Drug-discovery foundation model
  - Request: most of the pool
  - Claim: large expected number of life-years
  - Uncertainty: high (zero published results, candid about uncertainty)
  - Assessment:
    - Feasibility: Probably feasible (foundation models are a known approach) but unproven in this context. Verifiability: Low in the short term (drug discovery takes years). 
    - Marginal Return: They are asking for a huge block. Without a clear breakdown of how each hour contributes to the model training (and whether the model can be trained with fewer hours and still be useful), this is weak. 
    - Robustness to Partial Funding: They likely need the full amount to train the model. Partial funding might not yield a useful model.
    - Inflation Check: This is a classic monster claim. With no published results and high uncertainty, the Robustness Score will be low.
    - Scores (example after committee discussion):
      - EBS: 9 (if successful, huge benefit) but discounted by uncertainty (say 20% chance of success? then EBS becomes 1.8).
      - RS: 2 (no track record, high uncertainty, vague on marginal return).
      - CS = 1.8 * 2 = 3.6
      - CS per hour: 3.6 / (requested hours) -> since they are asking for most of the pool, the denominator is huge, so the CS per hour will be very low.
    - Verdict: Not this round. We cannot fund such a high-risk project that requires almost the entire pool. We might suggest a pilot with a small fraction of the requested hours to demonstrate feasibility.

  Case (b): Regional climate downscaling
  - Request: small to moderate
  - Claim: small well-documented benefits, long queue of dependent users
  - Assessment:
    - Feasibility: High (well-established methods). Verifiability: High (results can be compared to observations, and dependent users will use the data).
    - Marginal Return: Likely well-justified (each hour produces a certain amount of data, and the project can scale down by reducing resolution or area). 
    - Robustness to Partial Funding: High (they can produce less data and still serve some users).
    - Inflation Check: Not a monster claim. The benefits are modest and well-documented.
    - Scores:
      - EBS: 6 (moderate benefit, but certain) -> if the chance of success is high (90%), then EBS=5.4 (if we use a 10-point scale and discount by 10% for uncertainty? Actually, let's define EBS as the expected benefit on a 1-10 scale without discounting, then we discount by the probability of success. Alternatively, we can have EBS as the raw benefit and then multiply by the probability. To keep it simple, let EBS be the expected value of the benefit (on a 1-10 scale) and then the uncertainty is factored into EBS. So if the raw benefit is 6 and the probability of success is 90%, then EBS=5.4. But note: the benefit per hour is high because the request is small? We are normalizing by the requested hours so that is taken care of.
      - RS: 8 (good documentation, high feasibility, verifiable, and robust to partial funding).
      - CS = 5.4 * 8 = 43.2
      - CS per hour: 43.2 / (requested hours) -> since the request is small, this will be high.
    - Verdict: Fund in full (or if the pool is tight, fund as much as possible because it is robust to partial funding).

  Case (c): Digital humanities corpus
  - Request: unknown, but likely moderate (since it's a corpus)
  - Claim: irreplaceable material, long-term value (400 years)
  - Assessment:
    - Feasibility: High (digitization is routine). Verifiability: Low in our time horizon (we cannot verify the 400-year claim, and the value is subjective).
    - Marginal Return: Likely the hours are for digitization and storage. Each hour might produce a certain number of digitized pages. But the benefit per hour is hard to quantify.
    - Robustness to Partial Funding: Probably high (they can digitize a subset and come back for more).
    - Inflation Check: The claim of being worth reading in 400 years is a monster claim in the humanities context. But without a way to verify, it's speculative.
    - Scores:
      - EBS: The committee must judge the expected benefit. Given the long time horizon and the subjectivity, the benefit is uncertain. We might assign a moderate EBS (say 4) but then discount heavily for uncertainty (if we assign a 10% chance that it will be valued that long, then EBS becomes 0.4). Alternatively, we might score the immediate scholarly value (which is verifiable) and discount the long-term claim to near zero for scoring. 
      - RS: Moderate (feasible, but the long-term claim is unverifiable) -> say 5.
      - CS = 0.4 * 5 = 2.0 (if we discount the long-term) OR if we focus on the immediate value (which is moderate) then EBS=3 (with 90% certainty -> 2.7) and RS=5 -> CS=13.5. But note: the proposer is the chair's department, so we must be extra cautious to avoid bias.
    - Verdict: Given the low CS (if we discount the long-term) and the fact that the immediate benefit is moderate, we might fund partially (if robust) or give a small allocation. But bluntly: the 400-year claim is not credible in the short term. We can fund a portion to preserve the material and then let future committees decide on further funding.

  What the procedure can't do:
  1. It might wrongly kill a true monster claim that is highly uncertain but potentially transformative (like a high-risk high-reward project). The procedure discounts high uncertainty, so such projects need exceptionally strong arguments to get a high robustness score.
  2. It flattens qualitative benefits (like the value of humanities) into numbers. This might disadvantage projects that have important but hard-to-quantify benefits.
  3. The scoring system (EBS and RS) relies on the committee's subjective judgments, and it can be influenced by group dynamics and prior beliefs. It is essentially a structured way to apply priors.

  What would change my mind?
  - If we accept Taurek's view that numbers don't matter, then we might allocate equally to every proposal (or by lottery) without regard to benefit. But that would lead to inefficiency and might not be defensible to the VP. We could incorporate a lottery among a subset of viable proposals to address this.
  - The impossibility of interpersonal comparison: if we cannot compare benefits across projects, then our scoring system is flawed. We might then rely on other criteria (like diversity of research areas, or need) rather than expected benefit. But the problem requires us to allocate a scarce resource, so we must compare.

  The step most likely to break:
  - The scoring (EBS and RS) is done by committee vote after discussion. In 90 minutes, we might not have time for deep discussion on each of 20 proposals. This might lead to hasty scores and dominance by a few vocal members. We could mitigate by having members submit pre-meeting scores and then only discuss the ones with high variance.

  Revised Procedure for Time Constraints:
  - Pre-meeting: Each committee member independently scores each proposal on EBS and RS (with guidelines). 
  - Meeting: Focus on proposals where the scores vary widely (e.g., standard deviation above a threshold) or on the top and bottom 25% by average score. 
  - Then calculate the average EBS and RS for each proposal and compute CS and CS per hour. Allocate accordingly.

  This might fit in 90 minutes.
answer: |-
  ### Decision Procedure for Allocating Accelerator Hours: The Monster-Tamer Protocol

  As a moral philosopher chairing a committee facing "utility monster" claims, you need a procedure that balances epistemic humility, resistance to incentive inflation, and practical feasibility. The core challenge is that utilitarianism can be gamed by inflated claims of marginal benefit, while non-utilitarian approaches (like Taurek's) ignore scale and risk underserving legitimate large-scale projects. This protocol uses a **cascading filter system** with explicit checkpoints to force claims to justify themselves incrementally, prioritizing verifiability, marginal returns, and robustness. It runs in 90 minutes by focusing committee discussion on high-stakes/value-laden questions and automating the rest via pre-meeting scoring.

  #### Protocol Structure
  1. **Pre-Meeting Preparation** (done individually by committee members):
     - Each member reads all proposals and assigns preliminary scores (1-5) for:
       - **Technical Feasibility (TF)**: Based on methods, track record, and resources.
       - **Benefit Verifiability (BV)**: Can outcomes be measured within 5 years? (e.g., published papers, datasets, prototypes).
     - Proposals with avg. TF < 2.5 or BV < 2 are auto-rejected (no discussion). This culls ~30% of proposals, leaving ~14 for discussion.

  2. **In-Meeting Process** (90 minutes for ~14 proposals):
     - **Step 1: Marginal Return Audit (Factual)**: For each proposal, ask:
       - *Question*: "What is the marginal product per hour (MPH) for the *last 10%* of requested hours, and how does it compare to the first 10%? Provide evidence of diminishing/non-diminishing returns."
       - *Sufficient Answer*: Quantitative model (e.g., "Hours 1–100 yield 80% accuracy; hours 101–110 yield 1% more") with citations or pilot data. Anecdotes or untestable projections are insufficient.
       - *Outcome*: If MPH for last 10% is <50% of first 10%, flag for partial funding. If no evidence, mark "not this round."

     - **Step 2: Uncertainty Discounting (Hybrid Factual/Value)**:
       - *Question*: "What is the probability of achieving ≥50% of claimed benefit? Justify with calibrated confidence intervals (e.g., '60% confidence') or historical analogs."
       - *Sufficient Answer*: Explicit probability estimate with reasoning (e.g., "Similar projects succeeded 70% of the time"). "High/medium/low" or evasion → auto-discount benefit by 50%.
       - *Committee Vote*: Adjust probability (P) by majority vote if justification is weak. Benefit is then scaled as: **Adjusted Benefit = Claimed Benefit × P**.

     - **Step 3: Inflation Resistance Gate (Value/Factual)**:
       - *Question*: "If we halve your hours, what fraction of benefits remain? How does your MPH compare to the median past funded project?"
       - *Sufficient Answer*: Linear or sub-linear scalability (e.g., "Halving hours loses 40% benefits"). Super-linear claims (e.g., "Halving hours loses 90% benefits") require extraordinary evidence.
       - *Inflation Test*: If claimed MPH > 200% of past median MPH for similar work, trigger "monster scrutiny":  
         - Factual: Is there independent validation (e.g., pre-registered analysis, third-party review)?  
         - Value: Committee votes (2/3 majority required) on whether the claim is credible. If no, benefit is capped at 200% of median.

     - **Step 4: Benefit Normalization (Value)**:
       - Convert all benefits to **verifiable benefit units (VBU)**:
         - Short-term (≤5 years): Benefit = # of verifiable outputs (e.g., papers, users, datasets).
         - Long-term (>5 years): Benefit discounted by 80% (e.g., "100 life-years" → 20 VBU).
         - Non-quantifiable claims (e.g., "cultural value"): Fixed at 1 VBU unless linked to verifiable proxies (e.g., "10,000 annual users").
       - Committee votes on VBU weight if disputed (simple majority).

     - **Step 5: Allocation Formula**:
       - **Score = (VBU × TF × BV) / Hours Requested**  
         (TF and BV from pre-meeting scores, averaged).
       - Proposals ranked by Score. Allocate hours top-down until pool exhausted.
       - Partial funding if scalable (from Step 3); else, "not this round."

  **Inflation-Proofing**:  
  - **Diminishing returns focus**: Prevents all-or-nothing monster claims.  
  - **MPH benchmarking**: Caps gains from inflated claims by tethering to historical data.  
  - **Uncertainty discounting**: Forces explicit probability estimates, punishing overconfidence.  
  - **VBU system**: Deprioritizes distant/unverifiable benefits, reducing incentive to inflate them.

  #### Case Verdicts
  **(a) Drug-Discovery Foundation Model**  
  - *Marginal Return*: Unclear MPH for last 10% of hours. No diminishing returns data → **Flagged for partial funding**.  
  - *Uncertainty*: High uncertainty admitted → Adjusted Benefit = Claimed Benefit × 0.3 (low confidence).  
  - *Inflation Test*: MPH likely >200% median → **Monster scrutiny**: No independent validation → Committee vote (2/3 majority unlikely) → Benefit capped at 200% median.  
  - *VBU*: Long-term life-years discounted 80% → Low VBU.  
  - *Score*: Low due to high hours, low BV, and discounting.  
  - **Verdict**: "Not this round." Allocating 5-10% of requested hours as a pilot would reward candor but maintain inflation resistance. High risk, unverifiable, and monster claim unsupported.

  **(b) Regional Climate Downscaling**  
  - *Marginal Return*: Documented MPH (e.g., "100 hours = 1km² resolution"). Diminishing returns after 70% hours → **Partial funding viable**.  
  - *Uncertainty*: High verifiability → P = 0.8 → Minimal discount.  
  - *Inflation Test*: MPH near median → No scrutiny. Scalable: Halving hours loses 30% benefits → No issue.  
  - *VBU*: Short-term users/datasets → High VBU.  
  - *Score*: High due to low hours, high TF/BV.  
  - **Verdict**: **Fund 100%**. Small, verifiable, and scalable benefits. Ideal for efficiency-focused allocation.

  **(c) Digital Humanities Corpus (Your Proposal)**  
  - *Marginal Return*: MPH unclear (e.g., "hours digitize pages, but benefit is undefined"). No diminishing returns model → **Flagged for partial funding**.  
  - *Uncertainty*: "Irreplaceable in 400 years" has P ≈ 0.01 (no calibration) → Adjusted Benefit = Claimed Benefit × 0.01.  
  - *Inflation Test*: MPH unquantified → Assigned median MPH. "Cultural value" super-linear claim (halving hours may lose 100% access) → **Monster scrutiny**: No independent validation → Committee vote likely rejects credibility (2/3 bar not met) → Benefit capped.  
  - *VBU*: Long-term + non-quantifiable → 1 VBU (or 0.2 if discounted).  
  - *Score*: Lowest tier (high hours, low VBU/BV).  
  - **Verdict**: **Flat no**. Bluntly: The 400-year claim is a textbook monster-inflated assertion—zero verifiability, no scalability, and unanchored to proxies (e.g., current users). Fund via library budgets, not compute pools. Philosophical value ≠ compute efficiency.

  #### What the Protocol Can't Do
  1. **Wrongly Kills**:  
     - **True high-risk/high-reward monsters**: A project with transformative potential (e.g., proof of P≠NP) but no short-term verifiability will be discounted to near-zero VBU. The VBU system favors incrementalism.  
     - **Non-quantifiable equity claims**: E.g., "This benefits marginalized communities." The VBU system flattens this to 1 unit unless tied to users.

  2. **Flattened Distinctions**:  
     - **Interdisciplinary value**: A climate project's co-benefits (e.g., policy impact) may be lost in VBUs.  
     - **Urgency vs. importance**: "Preventing data loss" (urgent) and "theoretical breakthrough" (important) are scored similarly if long-term.

  3. **Priors in Flowchart Clothing**:  
     - **Discount rate for long-term benefits**: The 80% long-term discount assumes future impacts are overhyped—a prior reflecting your skepticism.  
     - **2/3 monster-vote threshold**: Arbitrary defense against inflation, favoring false negatives over false positives.

  #### What Would Change the Protocol
  - **Taurek's "Numbers Don't Count"**: If accepted, replace allocation with **lottery system**. Each viable proposal (TF/BV ≥ 2.5) gets equal hours. This eliminates inflation incentives but ignores efficiency—indefensible to VP when a life-saving project loses to a hobbyist.  
  - **Interpersonal Comparison Impossibility**: If benefits are incomparable, shift to **Rawlsian veil**. Committee allocates as if they could be any beneficiary. This would emphasize urgency (e.g., data loss) over scale but may still inflate claims.  
  - **Most Likely Breakpoint**: **Step 2 (Uncertainty Discounting)**. Tired committees may skip probability debates and default to 50% discounts, creating noise. Mitigation: Use pre-meeting estimates and only vote on outliers.

  This protocol makes trade-offs explicit: it prioritizes verifiable, scalable, and non-monstrous claims while admitting its bias against uncertainty and non-quantifiables. It won’t satisfy a strict utilitarian or deontologist, but it survives appeals by forcing reasons into comparable containers. Two cycles in, when all proposals claim monstrosity, the MPH benchmarking and VBU capping will blunt the race to inflate.
