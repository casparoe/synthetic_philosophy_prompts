prompt: |-
  I am putting together a graduate seminar on the epistemology of thought experimentation in the natural sciences, and I want the specification in hand before we read a single proposal. Your task is to write out the desiderata: an enumeration of what any account of how thought experiments can yield knowledge about the world must deliver in order to count as adequate. For each requirement, state the case or consideration that motivates it, and mark whether you regard it as non-negotiable or as a partisan preference of one camp.

  The list must be built to handle, not merely name, at least the following families of case. (a) Reductio experiments that run entirely on an adversary's own commitments, such as Galileo's two falling bodies joined by a cord, which refutes the Aristotelian proportionality of weight to speed without appealing to any independent principle. (b) Experiments whose target is a formalism rather than nature: the Einstein–Podolsky–Rosen completeness argument, and the Newtonian supertask constructions in which a system of gravitating point masses is arranged so that a particle arrives from spatial infinity in finite time, having been absent from every earlier moment. (c) Experiments that depend on an intervention no actual agent could perform, such as reversing the velocity of every molecule in an equilibrated gas, where the conclusion is nonetheless a modal claim about what would happen. (d) Experiments in which the intuitively obvious answer is the wrong one: Bell's thread stretched between two identically accelerating rockets, the pole and the barn, the twins. (e) Experiments subsequently carried out, where I want an explicit verdict on whether execution changes the epistemic standing of the conclusion already reached in imagination.

  Two further things are required. First, tell me which of the demands routinely made in this literature are genuine desiderata and which are one camp's conclusion restated as a criterion — the demand that every experiment be eliminable in favor of an argument being the obvious suspect, though not the only one. Second, identify which subsets of your requirements cannot be jointly satisfied, and say which single requirement does the most to exclude candidates; I expect the binding constraint to run through the idealizations themselves, since rigid bodies, frictionless planes, and exact symmetries are what usually carry the weight of the conclusion.

  Close with a short scorecard — no more than a paragraph each — of Norton's argument view, Brown's appeal to a priori intuition of natural law, and one model-based or simulation account. Keep the weight on the criteria; the scorecard is an afterthought. Please write in American English, and do not append a bibliography: describe each case you invoke rather than merely citing it, so that the entry stands on its own for students who have not read the literature.
reasoning: |-
  Okay, the user is putting together a graduate seminar on the epistemology of thought experiments in natural sciences. They need desiderata—specific criteria that any account of how thought experiments yield knowledge must satisfy. The requirements should handle specific case families like Galileo's reductio, EPR formalism, impossible interventions, counterintuitive cases, and executed experiments. 

  First, I consider each case family to ensure the desiderata cover them. For (a) reductios like Galileo's falling bodies, the account must explain how they refute using only the opponent's commitments without external principles. For (b) cases targeting formalism like EPR, the account needs to show how thought experiments engage with mathematical structures. For (c) impossible interventions like reversing molecule velocities, the account must justify modal claims despite unrealizability. For (d) counterintuitive cases like Bell's rockets, the desiderata should address why intuition fails and how reasoning corrects it. For (e) executed experiments, the account must clarify whether execution changes epistemic status—does it confirm, add nothing, or enhance robustness? 

  The user also wants to distinguish genuine desiderata from partisan demands. For example, the requirement that thought experiments be eliminable in favor of arguments isn't a necessary criterion; it's a conclusion from Norton's view. I'll need to flag such cases explicitly. 

  Identifying conflicting requirements is crucial. For instance, accommodating impossible interventions (Requirement 4) and handling counterintuitive cases (Requirement 5) might conflict with accounts that rely on intuition. Similarly, formalist targets (Requirement 3) could clash with accounts focused solely on empirical content. The biggest constraint is Requirement 4 (handling idealization), as it demands that accounts justify how non-actual entities like frictionless planes support real-world conclusions. 

  For the scorecard, Norton's view reduces thought experiments to arguments, satisfying Requirements 1, 2, 3, 7, 8 but fails Requirement 4 and 5 due to dismissing intuition. Brown's platonism relies on intuition for Requirements 4 and 5 but struggles with 3, 6, 7. Model-based accounts handle Requirements 3, 4, 6, 8 well but may falter on 1 and 2 if models aren't properly constrained. 

  Throughout, I'll use American English and describe cases without citations so students unfamiliar with the literature can follow. The response will be structured with clear desiderata, motivations, negotiability flags, conflict analysis, and concise scorecards.
answer: |-
  Here are the desiderata for an adequate epistemology of thought experimentation, structured to handle your specified cases, with motivations and negotiability marked. Conflicts and partisan demands are identified afterward.

  ### Core Desiderata
  1.  **Refutative Power via Immanent Critique (Non-negotiable):** The account must explain how thought experiments (TEs) can conclusively refute a theory *using only premises internal to that theory or the adversary's explicit commitments*.  
      *Motivation*: Galileo's falling bodies TE refutes Aristotelian dynamics without importing external physical principles, relying solely on the Aristotelian's own belief that heavier bodies fall faster and that a connected system is a single body.  
      *Handles*: (a)

  2.  **Formal System Engagement (Non-negotiable):** The account must explain how TEs can yield knowledge *about the implications, consistency, or completeness of a formal system* (mathematical structure, physical theory's formalism), even if that system isn't (or isn't yet known to be) instantiated in nature.  
      *Motivation*: EPR argues quantum mechanics is incomplete by analyzing its formalism; Newtonian supertasks explore mathematical singularities within the theory. The target is the theory's structure, not empirical reality *directly*.  
      *Handles*: (b)

  3.  **Modal Knowledge from Non-Actualizable Scenarios (Non-negotiable):** The account must explain how TEs involving *physically or practically impossible interventions* (like Maxwell's Demon reversing velocities, Laplacean supercomputers) can yield justified modal conclusions (e.g., "This *would* happen," "That *could not* happen") about the actual world or possible worlds constrained by the theory.  
      *Motivation*: Loschmidt's velocity-reversal TE justifies the claim that entropy *would* decrease under unrealizable conditions, supporting the statistical nature of the 2nd Law.  
      *Handles*: (c)

  4.  **Handling Counterintuitive Outcomes (Non-negotiable):** The account must explain how TEs can reliably lead to correct conclusions *even when they contradict strong pre-theoretic intuitions* about space, time, simultaneity, etc.  
      *Motivation*: Bell's rocket thread (length contraction paradox), the pole-barn paradox, and the twin paradox all have correct outcomes (thread snaps, pole fits, twin ages less) that defy spatial/temporal intuitions derived from classical mechanics. The TE process must overcome or correct naive intuition.  
      *Handles*: (d)

  5.  **Epistemic Autonomy from Execution (Negotiable/Partisan):** The account must provide a clear stance on whether *executing a TE physically* changes the fundamental epistemic status of the conclusion reached through the thought process alone. Does execution merely confirm, provide new evidence, enhance robustness, or is it epistemically redundant?  
      *Motivation*: Einstein's chasing a light beam TE led to special relativity decades before direct experimental analogs; EPR correlations were tested long after the TE. An account must say if these tests merely confirmed what was already known or provided essential new justification.  
      *Handles*: (e)

  6.  **Explanation of Idealization's Role (Non-negotiable):** The account must explain how and why *highly idealized entities and conditions* (point masses, rigid bodies, frictionless planes, perfect vacuums, exact symmetries, infinite systems) are not merely convenient fictions but are *epistemically productive* in generating reliable conclusions about the messy real world.  
      *Motivation*: Galileo's planes, Newton's point masses/granite spheres, Einstein's trains/lightning strikes – these idealizations are ubiquitous and carry the inferential weight. The account must justify their reliability.

  7.  **Constraint by Background Knowledge (Non-negotiable):** The account must show how the TE process is *constrained and informed by established empirical knowledge and theoretical principles*, preventing arbitrary fantasy from yielding knowledge.  
      *Motivation*: TEs don't occur in a vacuum. Maxwell's Demon relies on kinetic theory; Einstein's elevator relies on the equivalence principle; Galileo's relies on basic mechanics and observation. The TE's setup and reasoning leverage background commitments.

  8.  **Process Transparency (Non-negotiable):** The account must describe the *cognitive and/or logical process* by which the TE yields its conclusion (e.g., visualization, argument construction, model manipulation, intuition).  
      *Motivation*: To be epistemically credible, we need to understand *how* the TE works, not just that it does. This distinguishes knowledge-generating TEs from mere storytelling or intuition pumps.

  ### Distinguishing Desiderata from Partisan Demands
  *   **Genuine Desiderata:** 1-4, 6-8 address core *explananda* – phenomena any plausible epistemology *must* account for based on the practice and successful use of TEs across science.
  *   **Partisan Demands (Restated Conclusions):**
      *   **"Eliminability in Favor of an Argument":** Primarily associated with Norton. It's not a neutral desideratum but a *consequence* of his specific (argument-based) view. A different account (e.g., Brown's or model-based) might see the non-propositional, quasi-perceptual elements as *essential* to the TE's epistemic power. Treating eliminability as a *requirement* unfairly privileges one view.
      *   **"A Priori Intuition as Sole Source":** Primarily associated with Brown. Demanding this excludes accounts emphasizing empirical constraint (7), argument (Norton), or modeling (simulationists).
      *   **"Must Mirror Physical Experiment Structurally":** A simulationist might demand this, but it fails desideratum 3 (non-actualizable scenarios) and struggles with 2 (formal targets).

  ### Conflicts and Binding Constraint
  *   **Key Conflict:** **Requirement 4 (Handling Counterintuitive Outcomes)** directly conflicts with accounts that heavily rely on **Requirement 6 (Explanation of Idealization's Role)** *if* that explanation depends centrally on *untutored intuition*. Idealizations often work *despite* or *against* raw intuition (e.g., infinite sums in supertasks, perfect rigidity in Bell's rockets). An account relying *only* on intuitive obviousness of idealized scenarios cannot satisfy 4.
  *   **Most Excluding Requirement:** **Requirement 3 (Modal Knowledge from Non-Actualizable Scenarios)** is the most stringent. It immediately excludes:
      *   Strict empiricist views demanding all knowledge derive from actual sensory experience or feasible experiments.
      *   Naive simulationist views requiring the scenario to be physically simulable in principle.
      *   Views that cannot ground modal claims convincingly.
  *   **Binding Constraint:** You correctly identify **Requirement 6 (Role of Idealization)** as central. The account *must* explain why manipulating concepts of perfectly rigid bodies, frictionless planes, exact velocity reversals, or point masses in infinite space – things demonstrably absent or impossible in the actual world – reliably tells us something true about the natural world governed by the relevant theories. This is the core puzzle. Successfully meeting Requirement 3 often hinges on how Requirement 6 is met.

  ### Short Scorecard on Major Views
  *   **Norton's Argument View:** Satisfies 1 (Immanent critique *is* argument), 2 (Arguments about formalism), 7 (Arguments use background knowledge), and 8 (Process is explicit argument reconstruction). **Fails** 3 (Dismisses non-actualizable scenarios as misleading), 4 (Intuition is error-prone; only argument matters, so why TEs work *despite* intuition is unexplained), and struggles with 6 (Why are idealized premises reliable in arguments? Often seen as a flaw). Treats 5 as true (execution is redundant).
  *   **Brown's Platonism (A Priori Intuition):** Satisfies 3 (Intuition grasps laws/possibilities directly), 4 (Intuition corrects faulty empirical intuition), 6 (Ideal entities are loci of lawhood). **Fails** 2 (EPR targets formalism, not pure law), 7 (Downplays empirical constraint on intuition), and 8 (Process is mysterious perception). Struggles with 1 (How is immanent critique *just* intuition?). Likely sees 5 as true (execution confirms, doesn't create justification).
  *   **Model-Based/Simulation Account (e.g., Nersessian, Stuart):** Satisfies 3 (Models support modal reasoning), 6 (Idealization is model construction), 7 (Models built from background knowledge), 8 (Process is mental modeling/simulation). **Can handle** 2 (Models instantiate formal structures), 4 (Model constraints override naive intuition). **Challenge** is fully meeting 1 (How is pure immanent critique modeled without argument?) and providing a robust epistemology for mental model reliability (linking to 7 is key). Stance on 5 varies (execution may validate the model's fidelity).
