  **(a)** For each of the four ranking rules, rank the six worlds (A, B, C, D, E, F) as best as possible. For R1, use two specific discount factors: δ = 1/2 and δ = 0.9. For R4, note that the ranking may depend on the ultrafilter; in that case, explain the dependence and give a ranking for two different ultrafilters if necessary. Show your computations. (10 marks)

