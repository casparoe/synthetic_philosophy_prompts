answer: |-
  **Population Ethics Take-Home Final**  

  **Instructions:** Answer all parts. Use at most 1200 words of prose and include computations as needed. The question is worth 25 marks.  

  **Background:** A *world* is a function from locations \(n = 0, 1, 2, \dots\) to welfare values in \([0, 10]\). Let \(S_n(W)\) be the partial sum of welfare values for world \(W\) through location \(n\). Ranking rules:  
  - **R1 (\(\delta\)-discounting):** \(W\) better than \(V\) iff \(\sum_{n=0}^{\infty} \delta^n u_W(n) > \sum_{n=0}^{\infty} \delta^n u_V(n)\) for fixed \(\delta \in (0,1)\).  
  - **R2 (limit overtaking):** \(W\) better than \(V\) iff \(\lim_{n \to \infty} [S_n(W) - S_n(V)]\) exists and is positive; else incomparable.  
  - **R3 (limsup overtaking):** \(W\) better than \(V\) iff \(\limsup_{n \to \infty} [S_n(W) - S_n(V)] > 0\).  
  - **R4 (ultrafilter):** Fix a free ultrafilter \(\mathcal{U}\) on \(\mathbb{N}\). \(W\) better than \(V\) iff \(\{n : S_n(W) > S_n(V)\} \in \mathcal{U}\).  

  **Conditions for ranking rules:**  
  1. **Strong Pareto:** If \(u_W(n) \geq u_V(n)\) for all \(n\), and \(u_W(k) > u_V(k)\) for some \(k\), then \(W\) better than \(V\).  
  2. **Anonymity:** If \(W\) is a permutation of \(V\) (under a bijection of locations), then \(W\) and \(V\) equally good.  
  3. **Completeness:** For all \(W, V\), either \(W\) better than \(V\), \(V\) better than \(W\), or they equally good.  
  4. **Transitivity:** If \(W\) better than \(V\) and \(V\) better than \(U\), then \(W\) better than \(U\).  
  5. **Determinacy:** Ranking depends only on welfare assignments; no free parameters.  

  **Worlds:**  
  - **A:** \(u(n) = 1\) for all \(n\).  
  - **B:** \(u(0) = 2\), \(u(n) = 1\) for \(n \geq 1\).  
  - **C:** \(u(n) = 2\) for all \(n\).  
  - **D:** \(u(n) = 1\) if \(n\) even, \(0\) if \(n\) odd.  
  - **E:** \(u(n) = 0\) if \(n\) even, \(1\) if \(n\) odd.  
  - **F:** \(u(n) = 1\) for all \(n\) except \(u(2^k) = 0\) for \(k = 0, 1, 2, \dots\) (i.e., locations \(n = 1, 2, 4, 8, \dots\) are \(0\); \(n=0\) is \(1\)).  

  **Additional constructions for counterexamples:**  
  - **X:** \(u(0) = 2\), \(u(n) = 3\) for \(n \geq 1\).  
  - **Y:** \(u(0) = 1\), \(u(n) = 6\) if \(n\) odd, \(0\) if \(n\) even and \(n \geq 2\).  
  - **Z:** \(u(n) = 3\) for all \(n\).  
  - **W:** \(u(0) = 4\), \(u(n) = 6\) if \(n\) odd, \(0\) if \(n\) even and \(n \geq 2\).  
  - **V:** \(u(n) = 3\) for all \(n\).  

  **Tasks:**  
  **(a)** Rank the six worlds (A, B, C, D, E, F) under each rule. For R1, use \(\delta = 0.5\) and \(\delta = 0.9\). For R4, explain how the ranking depends on the ultrafilter. Show computations. (10 marks)  
  **(b)** For each rule, state which conditions it satisfies and which it violates, with explicit counterexamples. (8 marks)  
  **(c)** Essay: R4 satisfies Strong Pareto, Completeness, and Transitivity but requires choosing an ultrafilter. Does this solve the problem or relocate arbitrariness? Discuss the ranking of D and E under R4, its implications for Anonymity and Determinacy, and compare hidden arbitrariness in R3 (e.g., in D vs E) with advertised arbitrariness in R1 and R4. Address whether R2’s incomparability for D and E is preferable to R4’s approach. (7 marks)  

  ---

  **Model Answer**  
  **(a) Ranking the Worlds**  
  *Computations and rankings:*  

  **R1 (\(\delta\)-discounting):**  
  Discounted sum formula: \(\sum \delta^n u(n)\).  
  - \(\delta = 0.5\):  
    - A: \(\sum (0.5)^n \cdot 1 = \frac{1}{1-0.5} = 2\)  
    - B: \(2 + \sum_{n=1}^{\infty} (0.5)^n \cdot 1 = 2 + \frac{0.5}{0.5} = 3\)  
    - C: \(\sum (0.5)^n \cdot 2 = \frac{2}{0.5} = 4\)  
    - D: \(\sum_{k=0}^{\infty} (0.5)^{2k} \cdot 1 = \frac{1}{1-0.25} \approx 1.333\)  
    - E: \(\sum_{k=0}^{\infty} (0.5)^{2k+1} \cdot 1 = \frac{0.5}{0.75} \approx 0.667\)  
    - F: \(\sum (0.5)^n \cdot 1 - \sum_{k=0}^{\infty} (0.5)^{2^k} = 2 - (0.5 + 0.25 + 0.0625 + \dots) \approx 2 - 0.816 = 1.184\)  
    Ranking: \(\mathbf{C > B > A > D > F > E}\)  
  - \(\delta = 0.9\):  
    - A: \(\frac{1}{0.1} = 10\)  
    - B: \(2 + \frac{0.9}{0.1} = 11\)  
    - C: \(\frac{2}{0.1} = 20\)  
    - D: \(\frac{1}{1-0.81} \approx 5.263\)  
    - E: \(\frac{0.9}{0.19} \approx 4.737\)  
    - F: \(10 - (0.9 + 0.81 + 0.6561 + \dots) \approx 10 - 3.016 = 6.984\)  
    Ranking: \(\mathbf{C > B > A > F > D > E}\) (flip: F > D vs. δ=0.5)  

  **R2 (limit overtaking):**  
  Partial sums:  
  - \(S_n(A) = n+1\)  
  - \(S_n(B) = 2 + n\)  
  - \(S_n(C) = 2(n+1)\)  
  - \(S_n(D) = \lfloor n/2 \rfloor + 1\)  
  - \(S_n(E) = \lceil n/2 \rceil\)  
  - \(S_n(F) = (n+1) - P(n)\), where \(P(n)\) = number of \(2^k \leq n\) (e.g., \(P(5)=3\) for \(n=1,2,4\)).  
  Differences:  
  - B vs A: \(S_n(B) - S_n(A) = 1\) → limit 1 > 0 ⇒ **B > A**  
  - All other pairs: Differences diverge or oscillate (e.g., A vs C: \(n+1 \to \infty\); D vs E: alternates between 1 and 0).  
  Only comparable pair: **B > A**; others incomparable.  

  **R3 (limsup overtaking):**  
  - A vs B: \(\limsup (S_n(B) - S_n(A)) = \limsup (1) = 1 > 0\) ⇒ **B > A**  
  - A vs C: \(\limsup (S_n(C) - S_n(A)) = \limsup (n+1) = \infty > 0\) ⇒ **C > A**  
  - ... (similar for others)  
  Full ranking: **C > B > A > F > D > E**  
  - D vs E: \(\limsup (S_n(D) - S_n(E)) = \limsup (\text{alternating } 1,0) = 1 > 0\) ⇒ **D > E**  

  **R4 (ultrafilter):**  
  - C > B > A > F for any \(\mathcal{U}\) (cofinite dominance).  
  - D vs E: \(\{n: S_n(D) > S_n(E)\} = \text{evens}\). If evens \(\in \mathcal{U}\), **D > E**; else (odds \(\in \mathcal{U}\)), incomparable (since \(S_n(D) = S_n(E)\) on odds, and \(\{n: S_n(E) > S_n(D)\} = \emptyset \notin \mathcal{U}\)).  
  - Ranking if evens \(\in \mathcal{U}\): **C > B > A > F > D > E**  
  - Ranking if odds \(\in \mathcal{U}\): **C > B > A > F**, **F > D**, **F > E**, and **D, E incomparable**.  

  **(b) Conditions and Counterexamples**  
  **R1:**  
  - Satisfies: Strong Pareto, Completeness, Transitivity.  
  - Violates: Anonymity (e.g., B: (2,1,1,...) vs. permutation (1,2,1,...): sums differ for \(\delta=0.5\) (3 > 2.5)).  
  - Violates: Determinacy (D vs F: ranking flips with \(\delta\)).  

  **R2:**  
  - Satisfies: Transitivity (if comparable), Determinacy.  
  - Violates: Strong Pareto (e.g., constant 1.1 vs 1: difference \(0.1(n+1) \to \infty\), no limit, incomparable).  
  - Violates: Anonymity (D and E are permutations but incomparable, not equal).  
  - Violates: Completeness (e.g., A and C incomparable).  

  **R3:**  
  - Satisfies: Strong Pareto, Determinacy.  
  - Violates: Anonymity (D vs E: D > E, but they are permutations).  
  - Violates: Completeness (e.g., identical worlds: \(\limsup(0)=0\), incomparable).  
  - Violates: Transitivity (cycle: X > Y, Y > Z, Z > X. Computations:  
    - X > Y: \(\limsup (S_n(X) - S_n(Y)) = \limsup (1, -2, 1, -2, \dots) = 1 > 0\)  
    - Y > Z: \(\limsup (S_n(Y) - S_n(Z)) = \limsup (-2, 1, -2, 1, \dots) = 1 > 0\)  
    - Z > X: \(\limsup (S_n(Z) - S_n(X)) = \limsup (1) = 1 > 0\))  
  - Also violates asymmetry: W and V: each better than other (W > V and V > W).  

  **R4:**  
  - Satisfies: Strong Pareto (if \(W\) Pareto-dominates \(V\), \(\{n: S_n(W) > S_n(V)\}\) cofinite, hence in \(\mathcal{U}\)), Transitivity.  
  - Violates: Anonymity (D and E: either D > E or incomparable, never equal).  
  - Violates: Completeness (if odds \(\in \mathcal{U}\), D and E incomparable).  
  - Violates: Determinacy (ranking depends on choice of \(\mathcal{U}\), e.g., D vs E).  

  **(c) Essay**  
  The challenge of comparing infinite worlds arises because standard cardinality treats all infinite sets as equivalent, forcing additional structure. However, every solution introduces arbitrariness not present in the welfare assignments themselves. R1 uses a discount rate \(\delta\), R2 a limit process, R3 a limsup, and R4 an ultrafilter \(\mathcal{U}\). Each violates at least one ethical condition, revealing trade-offs between theoretical appeal and hidden or explicit arbitrariness.  

  R4 initially appears robust, satisfying Strong Pareto, Completeness, and Transitivity. Yet it violates Determinacy by requiring an arbitrary choice of \(\mathcal{U}\). For D and E—permutations and thus anonymized—R4 ranks D > E if evens \(\in \mathcal{U}\), but leaves them incomparable if odds \(\in \mathcal{U}\). This violates Anonymity in the first case (by ranking them strictly) and Completeness in the second (by not deeming them equal). Thus, R4 does not solve the problem; it relocates arbitrariness to the ultrafilter choice. Unlike R1’s \(\delta\), which can be ethically justified (e.g., temporal preference), \(\mathcal{U}\) is a mathematical artifact without intuitive grounding.  

  Hidden arbitrariness is equally problematic. R3 ranks D > E without parameters, masking location bias: D’s welfare is concentrated at even indices, favored by the limsup. This bias is obscured, unlike R1’s explicit \(\delta\) or R4’s \(\mathcal{U}\). Worse, R3 violates Transitivity (e.g., X > Y > Z > X cycle) and allows mutual superiority (W > V and V > W), rendering it incoherent. Thus, hidden arbitrariness is ethically dangerous, as it presents subjective choices as objective.  

  R2’s incomparability for D and E avoids arbitrariness and respects symmetry by not ranking them, but it violates Completeness. While some argue this is preferable—since no ethical basis favors evens or odds—it is distinct from equality. Anonymity requires D and E to be equally good, but R2 leaves them incomparable, failing the condition.  

  Ultimately, no rule satisfies all conditions without arbitrariness. R4’s Completeness is achieved only by outsourcing the arbitrariness to \(\mathcal{U}\), while R2’s incomparability preserves symmetry at the cost of decisiveness. The lesson is that infinite comparisons require ethical input beyond welfare assignments; the choice is not between arbitrariness and none, but between explicit and hidden forms. R4’s advertised arbitrariness is more transparent than R3’s, but both fail Anonymity. In practice, theorists must justify their chosen structure ethically, acknowledging that no solution is neutral.  

  ---

  **Marking Scheme (25 marks total)**  
  **(a) Rankings (10 marks)**  
  - R1 for δ=0.5: Correct ranking (C>B>A>D>F>E) and computations — 2 marks (Error: Missing flip or miscalculation)  
  - R1 for δ=0.9: Correct ranking (C>B>A>F>D>E) and computations — 2 marks (Error: No flip noted)  
  - R2: Only B>A comparable; others incomparable — 2 marks (Error: Over-ranking pairs)  
  - R3: Correct ranking (C>B>A>F>D>E) — 2 marks (Error: Incorrect D/E order)  
  - R4: Correct cases (evens ∈ U: C>B>A>F>D>E; odds ∈ U: C>B>A>F, F>D, F>E, D/E incomparable) — 2 marks (Error: Ignores incomparability)  

  **(b) Conditions (8 marks; 2 per rule)**  
  - R1: Identifies violations (Anonymity: B vs permuted B; Determinacy: D/F flip) and satisfies others — 2 marks (Error: Misses Determinacy violation)  
  - R2: Identifies violations (Strong Pareto: 1.1 vs 1; Anonymity: D/E incomparable; Completeness: A/C) and satisfies others — 2 marks (Error: Claims Anonymity satisfied)  
  - R3: Identifies violations (Anonymity: D>E; Completeness: identical worlds; Transitivity: X/Y/Z cycle) and satisfies others — 2 marks (Error: Misses cycle or mutual superiority)  
  - R4: Identifies violations (Anonymity: D/E not equal; Completeness: D/E incomparable case; Determinacy) and satisfies others — 2 marks (Error: Claims full Completeness)  

  **(c) Essay (7 marks)**  
  - Notes R4 relocates arbitrariness to \(\mathcal{U}\), violating Determinacy — 1 mark (Omission: Treats R4 as a complete solution)  
  - Explains R4’s D/E ranking: Anonymity violated if ranked, Completeness violated if incomparable — 1 mark (Omission: Equates incomparability to equality)  
  - Contrasts R3’s hidden bias (in D>E) with R1/R4’s advertised arbitrariness — 1 mark (Omission: Calls R3 “objective”)  
  - Clarifies R2’s incomparability ≠ equality for D/E — 1 mark (Error: Equates them)  
  - Discusses ethical cost: R4’s completeness requires arbitrary \(\mathcal{U}\); R2 avoids but loses decisiveness — 1 mark (Omission: No comparison)  
  - Overall: Coherent argument, addresses tension — 1 mark  
  - Word limit and clarity — 1 mark  

  **Common Competent-but-Wrong Answers (penalties applied to b/c marks):**  
  - "Just let δ→1 in R1": Ignores divergence and anonymity violations. Penalty: −2 (from c).  
  - "R4 is fine; \(\mathcal{U}\) is part of theory, not the world": Overlooks ethical arbitrariness. Penalty: −2 (from c).  
  - "R2 respects anonymity by not ranking D above E": Confuses incomparability with equality. Penalty: −1 (from b or c).  
  - "R3 is transitive; it’s total": Misses cycles/mutual superiority. Penalty: −1 (from b).
