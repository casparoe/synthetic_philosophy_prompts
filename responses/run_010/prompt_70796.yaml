  The exam question must be self-contained. We'll present the rules, worlds, and conditions explicitly in the question.

  Exam Question:

  **Population Ethics Take-Home Final**

  **Instructions:** You have 3 hours to complete this exam. Your response must include at most 1200 words of prose and as much computation as needed. This question is worth 25 marks.

  **Background:** In comparing infinite worlds, we represent a world as a function from locations (n = 0, 1, 2, ...) to welfare values in the bounded interval [0, 10]. Let \( S_n(W) \) denote the partial sum of welfare values through location n for world W. We consider four ranking rules:

  - **R1 (δ-discounting):** For a fixed δ in (0,1), world W is better than V if and only if \( \sum_{n=0}^{\infty} \delta^n u_W(n) > \sum_{n=0}^{\infty} \delta^n u_V(n) \).
  - **R2 (limit overtaking):** W is better than V if and only if \( \lim_{n \to \infty} [S_n(W) - S_n(V)] \) exists and is positive. If the limit does not exist, the worlds are incomparable.
  - **R3 (limsup overtaking):** W is better than V if and only if \( \limsup_{n \to \infty} [S_n(W) - S_n(V)] > 0 \). Note: This rule is not typically endorsed, but it is included for analysis.
  - **R4 (ultrafilter):** Fix a free ultrafilter \( \mathcal{U} \) on the natural numbers. Then W is better than V if and only if the set \( \{ n \in \mathbb{N} : S_n(W) > S_n(V) \} \) belongs to \( \mathcal{U} \).

  We also consider the following conditions for a ranking rule:

  1. **Strong Pareto:** If for every location n, \( u_W(n) \geq u_V(n) \), and for at least one n, \( u_W(n) > u_V(n) \), then W is better than V.
  2. **Anonymity:** If there is a bijection (permutation) \( \pi: \mathbb{N} \to \mathbb{N} \) such that \( u_W(n) = u_V(\pi(n)) \) for all n, then W and V are equally good.
  3. **Completeness:** For any two worlds W and V, either W is better than V, or V is better than W, or they are equally good.
  4. **Transitivity:** If W is better than V and V is better than U, then W is better than U.
  5. **Determinacy:** The ranking of any two worlds is determined solely by the welfare assignments and does not depend on an arbitrary choice (such as a discount rate δ or an ultrafilter \( \mathcal{U} \)).

  Consider the following six worlds:

  - **A:** Constant 1 at every location.
  - **B:** 2 at location 0, and 1 everywhere else.
  - **C:** Constant 2 at every location.
  - **D:** 1 at even locations, 0 at odd locations.
