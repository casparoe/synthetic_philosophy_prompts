     if n even: 4+3n? n=0:4, n=2:10, n=4:16 -> 4+3n: n=0:4, n=2:4+6=10, yes.
     if n odd: 3n+1? n=1:4, n=3:10, n=5:16 -> but 3n+1: n=1:4, n=3:10, yes.

  S_n(V)=3(n+1)

  Now, W vs V: 
  S_n(W)-S_n(V)= 
     if n even: (4+3n) - 3(n+1) = 4+3n-3n-3=1>0
     if n odd: (3n+1) - 3(n+1)=3n+1-3n-3=-2<0
  So the difference: at even n:1, at odd n:-2. 
  So limsup=1>0 -> W>V.

  V vs W: 
  S_n(V)-S_n(W)= 
     if n even: 3(n+1) - (4+3n)=3n+3-4-3n=-1<0
     if n odd: 3(n+1) - (3n+1)=3n+3-3n-1=2>0
  So the sequence: at even n:-1, at odd n:2. 
  limsup=2>0 -> V>W.

  Therefore, we have both W>V and V>W. This violates asymmetry and also transitivity implications.

  - Determinacy: Satisfied. No free parameter.

  **R4 (ultrafilter):**

  - Strong Pareto: Satisfied. If W(n)≥V(n) for all n and strict at some n0, then for all n≥n0, S_n(W)≥S_n(V) and the inequality is strict at n0 and remains strict for all n≥n0. So the set {n: S_n(W)>S_n(V)} contains all n≥n0, which is cofinite. Since the ultrafilter is free, it contains all cofinite sets. Therefore, W>V.

  - Anonymity: Violated. D and E are permutations. But under R4, they are either ranked with D>E (if evens in U) or incomparable (if odds in U). In neither case are they equally good. So anonymity is violated.

  - Completeness: May be violated. For example, if for two worlds, neither W>V nor V>W, then they are incomparable. In the case of D and E when U contains the odds, they are incomparable. So completeness is violated.

  - Transitivity: Satisfied. The ultrafilter ordering is transitive. Suppose W>V and V>U. Then A={n: S_n(W)>S_n(V)} in U, B={n: S_n(V)>S_n(U)} in U. Then A∩B is in U. For n in A∩B, S_n(W)>S_n(V)>S_n(U), so S_n(W)>S_n(U). So the set {n: S_n(W)>S_n(U)} contains A∩B, which is in U. So W>U.

  - Determinacy: Violated. The rule requires choosing an ultrafilter U. For example, the ranking of D and E depends on whether the even numbers are in U.

  **(c) Essay**

  The quest to compare infinite worlds confronts a foundational challenge: the standard tools of cardinal arithmetic collapse when sets are infinite, necessitating additional structure. This structure, however, often imports arbitrariness not present in the initial description of the worlds. We examine four ranking rules (R1-R4) and their trade-offs, focusing on R4 as a potential solution.

  R1 (δ-discounting) violates anonymity and determinacy. For instance, world B (2 at 0, 1 elsewhere) is better than its permutation (1 at 0, 2 at 1) under δ=0.5, illustrating location bias. Moreover, the ranking of D (1 at evens, 0 at odds) and F (1 except at powers of 2) flips between δ=0.5 (D>F) and δ=0.9 (F>D), revealing δ-dependence. Thus, R1 replaces the problem of infinite aggregation with an arbitrary discount rate.

  R2 (limit overtaking) sacrifices completeness to preserve anonymity and determinacy. Worlds D and E, being permutations, should be equally good under anonymity, but R2 leaves them incomparable because the difference in partial sums oscillates. Incomparability respects the symmetry but avoids arbitrariness, as no extra structure is imposed. However, the cost is high: many pairs (e.g., A and C) are incomparable, rendering the rule impractical for full population ethics.

  R3 (limsup overtaking) achieves completeness without parameters but at the price of transitivity and anonymity. It ranks D>E despite their permutation symmetry, violating anonymity. Worse, it generates cycles: for X=(2,3,3,...), Y=(1,6,0,6,0,...), Z=(3,3,3,...), we have X>Y, Y>Z, Z>X. It also allows mutual superiority: W=(4,0,6,0,...) and V=(3,3,3,...) are each ranked better than the other. These pathologies stem from limsup's insensitivity to the tail's behavior, making it unacceptable.

  R4 (ultrafilter) appears promising, satisfying strong Pareto, completeness (relative to U), and transitivity. However, it relocates arbitrariness to the choice of ultrafilter U. Consider D and E: R4 ranks D>E if U contains the evens, but they are incomparable if U contains the odds. Thus, anonymity is not restored; it is made contingent on U. If U contains the evens, D>E despite their symmetry; if not, they are incomparable, but not equally good. This highlights that R4 does not resolve the arbitrariness—it codifies it in U.

  Moreover, determinacy is violated: the ranking depends on U, an arbitrary mathematical object. Proponents might argue that U is part of the theory, not the world, but this merely shifts the arbitrariness. Unlike R1's δ, which has an economic interpretation, U is purely mathematical and lacks ethical justification.

  Comparing hidden versus advertised arbitrariness: R3's ranking of D>E is fixed and parameter-free, but this conceals a location bias (favoring the even-indexed welfare in D). In contrast, R1 and R4 advertise their parameters (δ or U), making their arbitrariness explicit. Hidden arbitrariness is more pernicious because it masks ethical choices under a veneer of objectivity. R3's completeness is illusory, as it hides cycles and mutual superiority.

  R2's incomparability for D and E avoids arbitrariness but may be unsatisfying. Yet, it honestly reflects the symmetry: neither world can be deemed better without breaking anonymity. R4's ultrafilter "solves" incomparability only by an arbitrary choice.

  In conclusion, no rule satisfies all conditions without arbitrariness. R4's appeal as a "solution" is superficial; it replaces the problem with an unguided choice of U. The lesson is that comparing infinite worlds inherently requires ethical input—whether a discount rate, a tail-behavior priority, or an ultrafilter—to break the indeterminacy. The real flaw lies not in the machinery but in expecting a unique, parameter-free ordering. Population ethics must acknowledge this and justify its choices explicitly.

  [Word count: ~600]

