  **Common Competent-but-Wrong Answers:**

  1. "Just let δ go to 1 in R1" (2 marks penalty in c): This is ill-defined; as δ→1, sums diverge. Also, it violates anonymity more severely.

  2. "R4 is fine because the ultrafilter is part of the theory, not the world" (2 marks penalty in c): This ignores that the theory must be justified ethically; the ultrafilter choice is arbitrary.

  3. "R2 respects anonymity because it doesn’t rank D above E" (1 mark penalty in b or c): Anonymity requires equal goodness, not incomparability; R2 violates anonymity by not deeming them equal.

  4. "R3 is transitive because it's a total order" (1 mark penalty in b): We provided a cycle, so it is not transitive.

