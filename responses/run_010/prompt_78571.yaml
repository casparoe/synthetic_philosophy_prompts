prompt: |-
  ok so this is bugging me and I have nobody to ask. I'm a junior, I'm in AP US History, and two things happen in that class that feel like they can't both be true. My teacher doesn't think there's a problem. I think there is.

  **Thing one:** on the DBQ rubric we literally lose points for "presentism" — judging people in the past by today's standards. So the Jefferson unit is framed entirely as: you have to understand him in context, you can't just call him a monster, he was a man of his time. The textbook does this constantly, with those little sidebar boxes explaining that regular people back then genuinely didn't see anything wrong with [whatever].

  **Thing two:** my school spent all of last year renaming our building, because the guy it was named after sat on the board of a company that did some genuinely awful stuff, and everyone — the assembly, the new plaque, the email from the head of school — talked about it as correcting a *moral* wrong, not a bad marketing choice. And in class, the units on abolition and on the civil rights movement are told as a story where the country slowly got better. My teacher said outright that one of the goals of the course is to watch the circle of people who "count" morally keep getting wider, which sent me down a wikipedia rabbit hole about that circle idea and I've been stuck on it since.

  Here's what I can't work out. If the rule is that you can't blame someone for holding views that literally everyone around them held, then slaveowners weren't wrong, they were just typical. And if they weren't wrong, then we didn't get *better* — we just got different. That's like saying bell bottoms were immoral. But then the renaming and the whole "the country got better" framing makes no sense, because there's nothing to correct and no direction to the story, just change.

  On the other hand, if we DO say they were actually wrong — wrong, not just wrong-for-their-time — then the presentism rule is fake, and the rubric is grading us on something incoherent.

  So what I want from you:

  - What theory of morality does each of these two practices presupose? Not what it fits nicely with — what it can't work without. Please be careful about that difference, I think it's exactly where people slip: "this only makes sense if X is true" vs "this just happens to vibe with X."
  - Can the two practices both be true at once? Pick yes or no and argue for it. If yes, show me the machinery that makes them compatible, because I don't see it. If no, say which one has to go.
  - If they're incompatible: what does the school actually have to change to be consistent, and what does the curriculum lose when it changes? I want the concrete version — what happens to the rubric, what happens to the plaque, what happens to the abolition unit.

  Format it with these sections in this order:

  1. **The two practices in your words** — like three sentences, just so I know you got what I'm describing
  2. **What each one needs** — the meat, maybe four paragraphs
  3. **Compatible or not** — your yes/no and the argument
  4. **What would have to change** — concrete, and say what we'd be giving up
  5. **Bottom line** — four sentences max, one straight answer to: is moral progress a real thing, or is it just change with a smug attitude?

  Please actually commit to something. I don't want an "on the one hand, on the other hand, reasonable people disagree" answer where I have to do the thinking for you. Take a position, give me your reasons, and tell me where you think you might be wrong. Also don't hand me a reading list — I have no time before the semester ends and no library database, so anything you want me to know has to be in the answer itself. Whole thing under 800 words if you can.
reasoning: |-
  Okay, the user is a junior in AP US History struggling with what seems like a contradiction in how history is taught. On one hand, their class penalizes "presentism" in DBQ essays—judging historical figures by modern standards—emphasizing context. For example, Jefferson owning slaves is framed as him being "a man of his time." On the other hand, their school renamed a building based on moral grounds, framing history as moral progress where society "gets better," like in lessons about abolition and civil rights. 

  The user points out the tension: if we can't blame past figures for widely held views (like slavery), then slaveowners weren't wrong—just typical—and moral progress is an illusion. But if we say they were objectively wrong, the "no presentism" rule seems hypocritical. They want a clear analysis: what moral theories underpin each practice, whether they're compatible, and what would need to change if they're not.

  First, I need to unpack the assumptions behind each practice. The "no presentism" rule relies on moral relativism—morality is context-dependent, so judging the past by modern standards is unfair. It assumes morality is shaped by social norms, not universal truths. Meanwhile, the moral progress narrative (renaming buildings, celebrating abolition) assumes moral realism—some actions (slavery, racism) are objectively wrong across time, and society improves by recognizing this. Progress implies moving toward objective moral truths.

  Are these compatible? On the surface, no—relativism denies objective wrongs, while progress requires them. But maybe they can coexist if we distinguish between individual culpability and societal ethics. For example: we can say Jefferson wasn't uniquely evil (relativism), but slavery itself was always immoral (realism), and society progressed by rejecting it. The DBQ rule targets judging individuals, while the progress narrative evaluates systems. 

  However, this has limits. If slavery is objectively wrong, why absolve individuals who upheld it? The relativism argument feels weak here—some abolitionists existed even in Jefferson's time, proving dissent was possible. The school can't consistently condemn a building's namesake (implying he was morally responsible) while teaching students not to judge Jefferson similarly. 

  So, are they compatible? I think no—not without twisting logic. The progress narrative must go if we stick strictly to relativism, but that undermines lessons on abolition as moral triumphs. Alternatively, if we keep progress, the "no presentism" rule needs rethinking. 

  Concrete changes:  
  - **Rubric:** Stop penalizing "presentism" for systemic critiques (e.g., "slavery was unjust" is valid). Only caution against *anachronistic* criticism (e.g., "Jefferson didn't use TikTok to protest").  
  - **Plaque:** Frame renaming as aligning with *current* values, not correcting past "immorality"—e.g., "We now honor different ideals."  
  - **Abolition unit:** Present it as a shift in societal *norms*, not moral "improvement"—e.g., "Norms evolved to reject slavery" vs. "Society became better."  

  What’s lost? The inspirational, forward-moving arc of history—students might see change as arbitrary, not progressive. But we gain intellectual consistency.  

  Bottom line: Moral progress is real, but we often misattribute it. Some truths (e.g., slavery is wrong) are timeless, but judging individuals requires nuance. The school’s inconsistency is in absolving elites (Jefferson) while condemning others (building namesake). To fix this, clarify that systemic evils *are* cross-era wrongs, but historical figures’ culpability varies by their awareness and choices. And yes—this means the DBQ rubric is flawed as written.
answer: |-
  ### 1. **The two practices in your words**  
  Your history class forbids "presentism" in DBQs: you can’t condemn historical figures (e.g., Jefferson) using modern ethics, only contextual norms. Simultaneously, your school frames history as moral progress (e.g., abolition, civil rights) and renamed a building to correct past moral wrongs. These clash: if past actions weren’t immoral in context, "progress" is just change, not improvement.

  ### 2. **What each one needs**  
  **The "no presentism" rule** requires **strict historical relativism**. It assumes morality is *entirely* defined by dominant contemporary norms. If 18th-century Virginia elites accepted slavery, judging a slaveowner as "immoral" is an error because morality = social consensus. This collapses if objective moral truths exist—it can’t work unless morality is *local* and *mutable*.  

  **The "moral progress" narrative** requires **moral realism**. It assumes certain acts (slavery, racism) are *objectively wrong*, regardless of era. Society "improves" by recognizing these truths. Renaming the building only makes sense if the namesake’s actions were *inherently immoral*, not just unpopular today. Without timeless wrongs, "progress" is just shifting preferences—like swapping bell-bottoms for skinny jeans.  

  ### 3. **Compatible or not?**  
  **No.** They cannot coexist without contradiction.  
  - Relativism says slaveholders weren’t wrong—they followed their society’s rules.  
  - Realism says slavery was always evil; society "got better" by rejecting it.  
  If you insist both are true, you’re arguing:  
  > *"Slavery wasn’t immoral then (relativism), but abolishing it was moral progress (realism)."*  
  That’s like saying *"Arson wasn’t wrong in 1700, but stopping arson in 2024 is progress."* It’s incoherent. Either morality is fixed (making past actors blameworthy) or fluid (making "progress" nonsensical).  

  ### 4. **What would have to change**  
  **To be consistent, the school must abandon strict historical relativism.** Here’s what changes:  
  - **The rubric:** Stop penalizing "presentism." Instead, require nuanced analysis: *"Explain how Jefferson upheld Enlightenment ideals while violating them via slavery. Critically evaluate this contradiction using contemporary dissent (e.g., abolitionists) and universal principles."*  
  - **The plaque:** Reframe renaming as a *current* values statement: *"We no longer honor X because his actions conflict with our present commitment to justice,"* not *"We are correcting his immorality."*  
  - **The abolition unit:** Teach it as a conflict between *timeless ethics* (e.g., equality) and *historical context* (e.g., economic dependence on slavery). Stress that some people *did* recognize the evil (e.g., Frederick Douglass, Quakers), proving it wasn’t universally accepted.  

  **What we lose:** The comforting myth that "everyone back then agreed." We must confront that moral dissent always existed, and that figures like Jefferson chose to ignore it for power/convenience. This complicates hero narratives but deepens historical understanding.  

  ### 5. **Bottom line**  
  Moral progress is real. Some truths (e.g., slavery is evil) are timeless, but human societies fail to see them. The contradiction arises because your school inconsistently applies relativism to powerful individuals (Jefferson) while using realism to condemn lesser figures (the building’s namesake). Fix this by admitting: *Yes, slaveowners were wrong—even if their peers excused them—because morality transcends era.* This doesn’t require "presentism"; it requires acknowledging that moral truths exist, and historical figures can be judged by their proximity to them.  

  ---
  **Where I might be wrong:** I’m assuming moral realism is defensible. If morality *is* purely subjective (like fashion), then progress *is* an illusion—but that makes the building renaming performative, not corrective. Your school’s actions suggest they don’t believe that.
