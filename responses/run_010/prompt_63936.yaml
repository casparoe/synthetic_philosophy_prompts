  ## The Unamendable Amendment at the Camberley Athenaeum

  The Camberley Athenaeum, nestled between a purveyor of bespoke umbrellas and a tobacconist that smelt permanently of damp tweed, existed in a state of benevolent senescence. Its rulebook, bound in cracked green leather and last properly consulted during the Wilson administration, resided under a dusty bell jar beside the snooker table. Its primary function seemed to be justifying Colonel Pettigrew’s insistence on neckties after 7 PM and the sacred inviolability of Tuesday Whist Night. The one clause anyone remotely remembered, usually invoked to settle bets about port allocation, was Article 42: *Any rule within this book, including the provisions of this very Article, may be amended or repealed by a two-thirds majority vote of members present at a duly convened Monthly Meeting.*

  Enter Algernon Finch. Young, sharp, and possessing the unsettling energy of a terrier in a room full of slippers, Finch joined seeking, he claimed, "a quiet haven for contemplation." His contemplation, however, seemed fixated on Article 42. At the April Meeting, after the usual wrangling over the rising cost of digestives and a complaint about the parrot (Colonel Pettigrew’s, named Wellington) mimicking the fire alarm, Finch rose.

  "Mr. Chairman," he piped, cutting off Major Hibbert’s anecdote about Malaya, "I propose an amendment to Article 42." He distributed crisp sheets. The amendment was deceptively simple:

  *Section A: Notwithstanding Article 42, no amendment passed after the date of ratification of this amendment shall take effect or be considered valid.*
  *Section B: Should this amendment itself be repealed or amended, it shall automatically and immediately spring back into full force and effect at the precise moment such repeal or amendment is carried.*

  A baffled silence fell, broken only by the rhythmic thump of Colonel Pettigrew testing a new putter against the wainscoting. Mr. Higgs, the perpetually flustered honorary clerk, blinked owlishly. "Spring back, Mr. Finch? Like... like a mousetrap?"

  "Precisely, Mr. Higgs. A failsafe against... frivolous revisionism."

  Mr. Thistleton, KC (Retired), whose eyes usually glazed over during club business, snapped to attention. He adjusted his pince-nez, peering at Finch’s proposal as if it were a particularly knotty tort. A faint, intrigued hum escaped him. The old boys, scenting a threat to Whist Night, shifted uneasily. The Chairman, Sir Evelyn Croft, sighed. "Very well. Debate?"

  There was little. Finch spoke passionately about "protecting the club's essential character," a phrase met with vague murmurs of approval. Thistleton remained thoughtfully silent. Pettigrew muttered about "damned nonsense." When the vote was called, Finch’s earnestness, coupled with the members' general desire for the port trolley, carried the day. Two-thirds was achieved. Higgs licked his pencil. "Amendment... to Article 42... Sections A and B... carried. April 12th."

  *Camberley Athenaeum Minutes - 12th April:*
  *...Mr. A. Finch proposed amendment to Art. 42 (see attached). After brief discussion, motion CARRIED (2/3 majority). New Art. 42 (A & B) enacted.*

  * * *

  May arrived. The parrot had learnt a rude limerick. The digestives remained expensive. Finch looked smug. Thistleton, however, had been busy. As Higgs read the minutes, Thistleton rose, his voice resonating with courtroom gravity.

  "Mr. Chairman! A point of order! The amendment passed last month, by its own Section A, renders itself immediately invalid! For it *is* an amendment passed *after* its own ratification date. It is a logical nullity!"

  A collective furrowing of brows ensued. Finch leapt up. "Nonsense! It was valid when passed! Section B protects it!"

  "Protects *what*, precisely?" Thistleton countered smoothly. "An amendment that, according to its own terms, cannot exist? Higgs, what does the minute say? *'New Art. 42 (A & B) enacted'*. But *can* it be enacted, given its own prohibition? It’s a classic self-referential paradox!"

  Higgs turned pale. He looked at his minute book, then at the green tome under the bell jar, then back at Thistleton. "I... I minuted it as enacted, sir. As per the vote."

  "Ah, the vote!" Thistleton pounced. "Article 42 *before* the amendment allowed amendments. But *after* the amendment, if it were valid, amendments are void. Yet we voted under the old rule... which might now be invalidated by the new... which might itself be invalid..." He trailed off, a gleam of pure intellectual delight in his eyes. "Fascinating!"

  Pettigrew slammed his putter down. "Good God, Thistleton! Are we playing Whist tonight or not? This is worse than the time Jenkins tried to introduce Canasta!"

  Flustered, Sir Evelyn called for a vote to repeal Finch’s amendment. Finch, invoking Section B, warned it would just "spring back." Thistleton argued passionately that repeal was impossible as the amendment likely never existed. The vote was held anyway. The desire for simplicity and the port trolley again prevailed. Two-thirds voted for repeal.

  Higgs, sweating, wrote: *Motion to repeal Amendment of April 12th (Art. 42 A&B) CARRIED (2/3 majority). Amendment repealed.*

  He paused, then added, almost as a prayer: *N.B. Per Section B of repealed amendment, said amendment considered to spring back into force immediately upon repeal?*

  He underlined the question mark three times.

  *Camberley Athenaeum Minutes - 10th May:*
  *...Motion by Mr. R. Thistleton to repeal Art. 42 (A&B) CARRIED (2/3 maj.). Amendment repealed. (Clerk's Note: Potential re-enactment per Sec. B under consideration/confusion).*

  * * *

  By June, the atmosphere crackled with procedural dread. Finch claimed his amendment was now back in force ("It sprang!"). Thistleton maintained the repeal vote was void ab initio because the amendment it sought to repeal was invalid, meaning the *original* Article 42 still stood, allowing the repeal... or perhaps not. Higgs developed a nervous tic. The old boys grumbled ominously about Whist being sidelined.

  The crisis erupted over something breathtakingly mundane. Young Freddie Tamworth had won the club's annual Darts Trophy (The Camberley Cup – a slightly tarnished silver goblet). He'd celebrated, perhaps excessively, running up a significant bar tab. Upon settling it the next day, the steward, Perkins, informed him that Rule 17(b) (Use of Club Facilities by Prize Winners) entitled him to a 50% refund on celebratory beverages consumed within one hour of victory.

  "Jolly good!" Freddie declared. However, Colonel Pettigrew, consulting the rulebook under the bell jar (a rare event), declared Rule 17(b) had been rescinded in 1992. Perkins, equally baffled, insisted it was reinstated in 2001. Higgs was summoned. Flicking frantically through ancient minutes, he found contradictory entries. The 1992 minutes noted 17(b) repealed. The 2001 minutes noted it reinstated. But *when* were those amendments passed? Post-April 12th? Were they invalid under Finch’s (possibly active, possibly non-existent) amendment? Was the *repeal* of 17(b) in '92 invalid? Were they *all* invalid?

  "See!" crowed Finch. "Chaos! My amendment prevents this! It *must* be in force!"

  "Unless," countered Thistleton, eyes gleaming, "the 2001 reinstatement was invalid, rendering 17(b) still repealed, meaning Mr. Tamworth isn't entitled... unless the '92 repeal was itself invalid because of temporal paradox constraints potentially introduced *now*... Higgs, what does the book *say* now?"

  Higgs, looking haunted, pointed a trembling finger at the green tome. "Colonel Pettigrew was consulting it, sir. It says... it says..." He took a deep breath. "It says Rule 17(b) is *present*. But *why*? Under *which* authority? April? May? 1992? 2001? The minutes contradict the book! The book contradicts itself depending on when you ask it!"

  Freddie Tamworth stared at the disputed Camberley Cup, then at his bar tab receipt. "I say, chaps. Does this mean I get my twenty-three quid back or not? Only, the lads are waiting at the Nag's Head."

  A heavy silence descended. Sir Evelyn Croft looked from Thistleton, vibrating with legal ecstasy, to Finch, rigid with conviction, to Pettigrew, who was now practising his putting stroke towards the parrot's cage, to Higgs, who seemed on the verge of tears, clutching the minute book like a life raft. He looked at the perplexed Freddie and the tarnished goblet.

  "Perkins," Sir Evelyn said, his voice heavy with the weight of insoluble paradox. "Refund Mr. Tamworth... half his tab. From the... the Contingencies Fund. Pending... clarification."

  "Clarification of *what*, Chairman?" Thistleton murmured, almost to himself, a smile playing on his lips. "The rule? Or reality?"

  Higgs picked up his pencil. His hand hovered over the page. He wrote:

  *Camberley Athenaeum Minutes - 14th June:*
  *...Dispute re: Rule 17(b) and refund for Mr. F. Tamworth. Discussion inconclusive due to unresolved status of Rulebook amendments (see Apr & May mins). Chairman directed refund from Contingencies Fund (see Treas. Ledger). Matter deferred.*

  He hesitated, then added, in very small letters at the bottom:

  *N.B. Art. 42 status: ?????*
  *Whist Night proceeded as usual.*
