  Then there's desire alignment—Ulysses wants to be tied up because he knows he'll want to jump later. But in Parfit's case, the hitchhiker's future self has no reason to pay, and crucially, the present self doesn't want to pay either; they only want to appear trustworthy to get the ride. So unlike Ulysses, where both selves want the binding, here the present self is strategically adopting a trait the future self won't endorse. That feels like a core crack in the analogy. 

