  The user's context is crucial here. First, the funders explicitly reject rehashing the Winner-Latour-Woolgar-Grint debates or producing design checklists. Second, there's practical fieldwork access to a municipal housing algorithm system - they can study documents and human decision points but not audit the black-box algorithm itself. Third, the user personally suspects the debate is stuck because "politics" isn't clearly defined across distributive, agential, and contestatory registers. 

  Looking at the six questions:
  (a) Inscription - about normative commitments in artefacts vs. specifications
  (b) Boundary - politics of components vs whole systems
  (c) Technical code - Feenberg's concept's explanatory value
  (d) Responsibility - implications for assigning blame
  (e) Determinism - whether it's about explanation vs property ascription
  (f) Indeterminacy - if politics is settled in use

  The user thinks (d) is overrated and wants me to be blunt about cuts. They need a defended ranking based on: how central it is to other work, tractability given their access, potential to change analysis of the municipal case, and relative neglect despite existing literature. Conflicts between criteria should be explicitly weighed.

  Hmm, the most important question should fundamentally reshape how we analyze technical disputes while being researchable through documents and discretion. (b) seems strongest here - clarifying the unit of analysis (component vs system) directly impacts how we'd describe the housing algorithm's politics. Is it the weighting formula? The appeals process? This has been underexplored.

  Next, (f) matters because if politics is only in use, their fieldwork on appeals officers becomes central. But it's well-trodden ground, though tractable for them. Then (a), which is somewhat exhausted per funders but essential for their case (specs vs system). 

  (e) could reframe debates but may not change concrete analysis. (c) is important but risks becoming design-focused. (d) about responsibility does feel secondary - important but not core to "do artefacts HAVE politics."

  For cuts, agree (d) is least essential - it's about implications rather than establishing the core claim. Would replace it with a new question about contestability: "Under what conditions do technical arrangements become objects of political dispute?" This directly engages the user's third register and matches their fieldwork (appeals process).

  External factors: Court rulings on algorithms could elevate (a) or (f), procurement rule changes might boost (b), while philosophy of AI shifts could impact (e) or the new contestability question.
answer: |-
  Here’s a defended ranking of your research questions, optimized for the network’s constraints and goals. I’ve weighted **tractability** and **impact on concrete case analysis** most heavily (as per fieldwork access and funder demands), followed by **non-exegetical philosophical weight** and **neglect**. Questions that risk rehashing exhausted debates or lacking fieldwork leverage rank lower.  

  ### **Ranked Questions & Rationale**  
  1. ***(b) The boundary problem***  
     - **Why #1?** Directly tractable with your fieldwork: You can map how thresholds/weightings in the housing algorithm’s *specification* distribute costs (e.g., penalizing applicants with erratic histories) vs. how the *system-as-a-whole* (including appeals) forecloses agency. Forces a non-exegetical mereology: Is the "artefact" the code, the spec, or the sociotechnical chain?  
     - **Impact:** Reshapes how you describe the municipal case—e.g., is the injustice in a weighting (distributive) or the system’s resistance to appeals (contestatory)?  
     - **Neglect:** Under-explored (vs. endless re-litigation of agency/determinism).  
     - **Dependencies:** Answers to (a)/(f) depend on clarifying boundaries first.  

  2. ***(f) The indeterminacy question***  
     - **Why #2?** Highly tractable: Your fieldwork captures "meaning in use" via appeals officers’ discretion (e.g., overriding algorithmic outputs). Tests whether politics is relocated to interpretation *without* dissolving into relativism.  
     - **Impact:** Determines if the algorithm’s politics can even be assessed pre-use—critical for procurement ethics.  
     - **Neglect:** Often conflated with "inscription"; your access provides rare empirical traction.  
     - **Dependencies:** Informs (a)/(d); resolves deadlock in Winner-Latour debates.  

  3. ***(a) The inscription question***  
     - **Why #3?** Focuses on your unique evidence: Compare normative commitments in procurement docs (e.g., "fairness" clauses) vs. appeals outcomes. Tests if specs "inscribe" politics when the system is unauditable.  
     - **Impact:** Reveals whether vendor claims in specs are politically inert or actively shape outcomes.  
     - **Neglect:** Exhausted *in abstracto*, but fresh with your case + unauditable system.  
     - **Tractability:** Ideal for document analysis + interviews.  

  4. ***(e) The determinism question***  
     - **Why #4?** Philosophically load-bearing: Untangling "determinism" as causal explanation vs. property ascription reframes Winner-Joerges. Non-exegetical—shifts how we analyze *why* a system feels immutable.  
     - **Impact:** Alters municipal case description: Is the algorithm’s rigidity technical or political (contestatory register)?  
     - **Neglect:** Buried under deterministic/anti-deterministic slogans.  
     - **Risk:** Abstract if divorced from fieldwork; anchor in officers’ views of system flexibility.  

  5. ***(c) The technical code question***  
     - **Why #5?** Moderate tractability: Interview spec-drafters on who influenced standards (e.g., vendor lobbyists vs. community groups). Tests if "code" explains power or just labels it.  
     - **Impact:** Shows whether exclusion from standard-setting *is* the politics.  
     - **Neglect:** Feenberg is cited more than critiqued; your case can probe explanatory gaps.  
     - **Risk:** Could veer toward design checklist; constrain to "who participates" in your case.  

  6. ***(d) The responsibility question***  
     - **Why #6?** Least essential: While important ethically, it *presumes* artefacts have agential politics—which your network must first establish. The "many hands" problem isn’t unique to artefactual politics.  
     - **Impact:** Minimal on case description: Responsibility is downstream of defining the politics.  
     - **Neglect:** Overrated—flooded with speculative liability theories.  
     - **Cut?** Yes, for now. Revisit in Year 3 if earlier questions resolve agential politics.  

  ---

  ### **What to Cut & Replace**  
  - **Cut (d)**: As you suspect, it’s overrated. Responsibility debates often conflate *moral* blame with *causal* efficacy—your agential register must be clarified first.  
  - **Add: *The contestability question***: *"Under what conditions do technical arrangements become objects of political dispute, and how does this transform their politics?"*  
    - **Rank:** #2, displacing (f).  
    - **Why:** Engages your third register directly. Fieldwork on appeals officers is *perfect*—they’re sites where "artefacts" become contested. Explains why the algorithm’s politics might shift from distributive to agential when challenged.  
    - **Neglect:** Winner’s "inherent" politics vs. Latour’s "reassembled" politics rarely address this dynamic.  

  ---

  ### **What Could Shift Rankings**  
  - **↑ (a)/(f):** A court ruling that vendor specs are legally binding "inscriptions" or evidence that appeals officers consistently subvert outputs (indeterminacy).  
  - **↑ (b):** New procurement rules requiring modular system design (forcing boundary issues).  
  - **↑ New contestability question:** Evidence that public awareness of the algorithm changes its effects (e.g., applicants gaming the system).  
  - **↓ (e):** If philosophy of AI agency trends toward post-human flat ontologies, making "determinism" obsolete.  

  ---

  ### **Final Programme Structure**  
  **Year 1:** Boundaries (b) → Contestability (new) → Indeterminacy (f)  
  **Year 2:** Inscription (a) → Determinism (e) → Technical Codes (c)  
  **Year 3:** Synthesize for edited volume: *How boundaries/contestability redefine artefactual politics in practice.*  

  This order starts with your most original, tractable questions—grounding theory in the municipal case—before moving to conceptual heavy lifting. It meets funders by cutting through deadlocks with fieldwork, delivers non-exegetical philosophy (boundaries/contestability), and avoids design ethics.
