  For 1975: This was peak uncertainty. Molina and Rowland's theory was new, NAS review pending, substitutes scarce. Individual switching had high signaling value but low direct impact. The batched effect was weak because retailers had massive existing inventories. So switching was supererogatory - morally praiseworthy but not obligatory.

  1977 changes dramatically: NAS confirms the science, substitutes proliferate, consumer shifts accelerate. Now batched effects kick in as retailers reorder in discrete lots. Signaling remains powerful as visible changes normalize new behavior. Switching becomes obligatory because the probability of triggering larger systemic changes increased substantially.

