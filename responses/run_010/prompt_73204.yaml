  Crucially, this case kills the pure inefficacy objection. The documented 211M lb voluntary reduction proves individual acts collectively caused change before regulation. The real lesson is that causal geometry is dynamic: the ethical status of an act depends on its position in the system's evolution.

  For modern analogs like flying or meat-eating: Meat resembles 1975 CFCs - signaling potential high but batched effects weak due to industrial scaling. Flying is different - each flight has direct emissions (smooth harm), but flight routes operate in batches. The ethical imperative strengthens when alternatives emerge (electric planes, rail), mirroring 1977's turning point.

  The user's framework survives beautifully. The only refinement I'd add is that signaling strength depends on observability - switching deodorants is more visible than paying carbon offsets. Their approach could revolutionize collective harm ethics by forcing temporal and structural precision.
answer: |-
  Your analysis demands precision – let's dissect the CFC case through your causal geometry lens and commit to ethical verdicts. I'll test your hypothesis rigorously, flagging uncertainties while delivering concrete judgments. The 1974-1978 aerosol phase-out provides a devastating counterexample to the inefficacy objection.

  ### Causal Geometry Evolution:
  1. **1975 (Early Phase): Signaling-Dominant with Weak Batching**  
     - *Stratosphere:* Smooth – no individual spray can meaningfully alter ozone depletion.  
     - *Market:* **Signifying Intent** dominated. Consumer choices signaled shifting demand to producers and retailers (e.g., 7-Eleven removing CFC products). Batching existed but was coarse: retailers restocked by pallet, producers adjusted production in multi-ton campaigns. Probability that *one* consumer’s switch triggered restocking decisions was negligible.  
     - *Ethical Verdict:* **Supererogatory** under "expected harm" and "batching" replies (probability too low). **Obligatory** under complicity/signaling views. The act declared rejection of harm, reshaping norms even if no ozone molecules were saved.  

  2. **1977 (Tipping Point): Batching-Dominant with Reinforced Signaling**  
     - *Stratosphere:* Still smooth.  
     - *Market:* **Critical Batching Threshold** reached. EPA data shows aerosol emissions fell 41% voluntarily. Retailers (e.g., drugstore chains) switched suppliers *en masse*; producers like DuPont accelerated substitute R&D as sales plummeted. Individual acts now had high probability of triggering batch-level decisions (e.g., a store discontinuing a SKU after X customers reject it).  
     - *Ethical Verdict:* **Obligatory** under all replies. Batching created measurable expected harm (each purchase *likely* contributed to bulk decisions). Complicity became undeniable as harm was scientifically certain. Signaling normalized change – *not* switching was actively endorsing harm.  

  3. **Post-Ban (1978+): Smooth with Residual Signaling**  
     - *Stratosphere:* Smooth.  
     - *Market:* Regulation made individual choices largely smooth – substitutes dominated. Signaling persisted for norm maintenance (e.g., shaming "ozone-unfriendly" products never containing CFCs was irrelevant but reinforced ethics).  
     - *Ethical Verdict:* **Permissible** to use exempted products (medical inhalers). Switching to non-CFC products became morally neutral unless part of broader advocacy.  

  ### Where the Inefficacy Objection Fails Spectacularly:
  - **The 211M lb voluntary reduction is the killing blow.** This proves individual acts *collectively* caused systemic change *before* regulation. The inefficacy objection cannot explain how discrete consumer choices aggregated to alter production batches and industry R&D.  
  - **Batching was decisive:** Retailer restocking cycles and production campaigns turned marginal choices into consequential triggers. Your geometry framework exposes this – the objection ignores market microstructure.  
  - **Signifying Intent mattered early:** Consumer shifts created political cover for the NAS report and cracked industry resistance.  

  ### Verdict on Philosophical Replies:
  | **Reply**              | **Survives?** | **Why**                                                                 |
  |------------------------|---------------|--------------------------------------------------------------------------|
  | **Nonzero Expected Harm** | Yes (strengthened) | Batched market response created high-probability harm per act post-1976. |
  | **Complicity/Participation** | Yes          | Directly explains ethical revulsion even in 1975’s smooth phase.         |
  | **Sorites Paradox**      | **No**       | The 211M lb drop wasn’t a vague heap – it was measurable, batch-driven change. |
  | **Proves Too Much**      | Partially     | Valid against *pure* inefficacy, but voting has different batching (swing states ≠ fluid markets). |

  ### Anomalies & Silent Zones:
  - **Exempted Uses (inhalers):** Inefficacy objection is silent – ethics here turn on necessity/alternatives, not marginal impact.  
  - **Misleading "Ozone-Friendly" Labels:** Signaling gone awry – complicity applies if consumers *enable* deceit.  
  - **Refrigerant Buyers:** Smooth harm geometry dominates – individual acts lack batching/signaling until regulation targets appliances.  

  ### Implications for Modern Cases:
  - **Flying:**  
    - *If no carbon pricing:* Smooth harm (CO₂ accumulates monotonically). **Permissible** under expected harm; **complicity applies weakly.**  
    - *With emissions trading:* **Batched** – your seat purchase may trigger airline purchasing allowances or new routes. Shifts toward obligation.  
  - **Meat Consumption:**  
    - *Industrial supply chains:* **Batched** – your purchase influences restocking thresholds (e.g., fast-food beef patty orders). Expected harm is quantifiable. **Obligatory** to reduce.  
    - *Local butchers:* Smoother – fewer batching points. Signaling dominates.  

  ### Conclusion:
  The CFC case **annihilates** the inefficacy objection by proving individual acts alter outcomes through batched market responses and signaling. Your geometry framework survives – the episode shows all three geometries coexisting and evolving, with batching decisive in turning voluntary action into measurable change. The reply that survives strongest is **"nonzero expected harm via batched systems,"** with **complicity** providing ethical foundation. This forces a verdict: **individuals *can* be obligated to act in collective harm cases when market or institutional structures create batched tipping points.** If you accept that 1970s consumers had moral agency to abandon aerosols, consistency demands accepting obligations in modern batched systems (like industrial meat or airline emissions). The burden now shifts to inefficacy proponents to explain why *this* historical success doesn’t generalize.
