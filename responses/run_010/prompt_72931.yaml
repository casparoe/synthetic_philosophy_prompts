prompt: |-
  You are to work in two capacities at once: first as a philosopher with a working command of the metaphysics of dispositions — stimulus conditions, manifestations, categorical bases, the conditional analysis and its known failures, including finks, masks (or antidotes), reverse finks, and multi-track dispositions — and second as a test engineer who has to turn that material into something a technician can execute without any philosophical training. Think carefully before drafting: begin by brainstorming, in a short section, which distinctions from the philosophical literature actually do work in a laboratory and which are elegant but inert, and say which of the inert ones you are deliberately dropping. Do not give me a literature review, and do not cite papers, articles, or standards documents; I want the procedure, not the sources.

  Here is my situation. I chair a technical working group that writes the qualification clauses of an internal standard for a manufacturer of safety-critical electromechanical assemblies. Our clauses are full of dispositional language: an encapsulant is said to be brittle below a threshold temperature, a cell is said to be liable to vent under overcharge, an alloy is said to be creep-limited above a service temperature, a coating is said to be self-healing. Suppliers assert these properties, our laboratory tests them, a certification engineer signs off on the result, and the signed claim later appears in purchase contracts and in incident investigations. Our current test logic is crude, and I want to replace it. It amounts to this: apply the stimulus condition, look for the characteristic manifestation, and if the manifestation does not appear, record that the disposition is absent. Everyone on the group knows this inference is unreliable, but nobody can say precisely when it fails or what to do about it.

  Four cases from our own files illustrate the difficulty.

  Case A. We qualify a cell chemistry for the property of venting under overcharge. Every unit carries a protection circuit that interrupts charging current well before the overcharge condition is reached. The test never produces venting, and the test bench cannot easily be configured to defeat the protection without also altering the unit.

  Case B. We qualify a self-healing coating for the property of cracking under a scratch of specified geometry. The coating repairs the scratch within minutes, so the crack never persists long enough to be scored. The healing agent is consumable: after roughly forty repair cycles the coating stops repairing and the cracks appear immediately.

  Case C. We qualify a shape-memory actuator for the property of recovering a specified strain when heated above its transition temperature. The recovery is measured in a fixture that is rigid at temperature for reasons of measurement repeatability, so the actuator generates force but no displacement.

  Case D. We qualify a polymer housing for the property of fracturing under a drop from one metre. Sample preparation in the current protocol includes a stress-relief bake and a 48-hour conditioning period at controlled humidity immediately before the drop. We have since learned that both steps suppress the fracture mode for several days after conditioning ends, after which it returns.

  Your task is to write the replacement procedure. I want a decision procedure my working group can adopt as standard text, satisfying the following requirements.

  1. It must be a sequence of ordered questions or steps, each with an explicit statement of what counts as a sufficient answer, and it must specify the possible outputs — including an output meaning that the question cannot be settled by test on the available sample, and an output meaning that the decision passes to a named human because it turns on values rather than facts.

  2. It must distinguish, and give the technician a way to tell apart where possible, at least these four situations: the disposition is genuinely absent; the disposition is present but its manifestation is blocked by something in the test set-up; the disposition was present but the test itself destroyed or consumed its basis; and the disposition was absent during the test but is reliably acquired under conditions the test does not reproduce, including conditions created by sample preparation. Where two of these cannot be separated with a finite number of destructive tests, say so plainly rather than pretending the procedure settles it.

  3. It must address multi-track properties: what a pass on one test condition licenses as a general claim, and what it does not, with the required hedging written into the language of the clause itself, since these clauses are read by lawyers and by investigators years later.

  4. It must state the default when evidence is inconclusive, and must flag that default as a value choice rather than a finding, since for a safety-critical part the conservative default and the commercially realistic default point in opposite directions.

  5. It must be runnable within real constraints: technicians without philosophy training, small sample allocations because many tests are destructive and some units are expensive, a fixed bench, and a certification engineer who signs the report and needs to see which steps were executed and which were skipped.

  Then apply the procedure, step by step, to Cases A through D, showing what it outputs in each and what the certification engineer would sign. At least one of these applications must produce a result I will not like, and you should say so explicitly rather than softening it. Case B in particular should be handled honestly: there is a reading on which the coating genuinely has the cracking disposition and the standard nevertheless certifies it as non-cracking for its service life, and I want the procedure to say whether that is a defect in the procedure or a correct answer to a different question than the one I thought I was asking.

  Close with a short section titled Limits, covering the failure modes of the procedure — the kinds of case it will get wrong, the ways a supplier could satisfy it while still shipping a hazardous part, and the points at which it depends on judgment that no wording can eliminate. Finish with a one-page technician-facing summary in plain language: the steps in order, the three or four things to record at each step, and the single sentence that tells the technician when to stop and escalate.

  Flag every step that is a judgment call dressed up as procedure. Where you are unsure whether a distinction survives translation into bench practice, say that it is unsure and explain what would settle it.
reasoning: |-
  Hmm, the user is chairing a technical working group for safety-critical electromechanical assemblies and needs a practical disposition testing procedure. They want me to act as both a philosopher specializing in disposition metaphysics and a test engineer. Their current testing method (apply stimulus → observe manifestation → conclude disposition absent if no manifestation) is flawed, as shown by four real cases involving venting batteries, self-healing coatings, shape-memory actuators, and polymer housings.

  I need to develop a replacement procedure that:
  - Is executable by technicians without philosophy training
  - Distinguishes between genuine absence vs. blocked manifestations vs. consumed dispositions vs. temporarily suppressed dispositions
  - Handles multi-track properties (where a disposition responds to multiple stimuli)
  - Has clear inconclusive evidence defaults flagged as value choices
  - Works within real constraints (small samples, fixed equipment)
  - Includes a technician-facing summary
  - Explicitly identifies judgment calls

  Key philosophical distinctions that matter for the lab:
  Operational distinctions:
  - Stimulus condition (testable)
  - Manifestation (observable)
  - Basis consumption (testable through repeat experiments)
  - Temporary suppression (testable via time delays)

  Distinctions I'm deliberately dropping as inert:
  - Conditional analysis failures (too abstract)
  - Categorical basis metaphysics (not testable)
  - Finks/reverse finks (covered under blocking mechanisms)
  - Dispositional essentialism (irrelevant to verification)

  The procedure must address:
  - Blocking mechanisms (Case A: protection circuit)
  - Self-consuming bases (Case B: healing agent depletion)
  - Measurement interference (Case C: rigid fixture)
  - Temporary suppression (Case D: conditioning effects)

  For multi-track dispositions, I'll implement:
  - Explicit parameter bounding in certification language
  - "Within tested domain" qualifiers
  - Forced disclosure of untested conditions

  Inconclusive evidence defaults:
  - Safety-critical: fail by default (value choice)
  - Must be explicitly flagged as conservative presumption

  Now structuring the core procedure:
  Phase 1: Stimulus Verification
  (Confirm test actually delivers specified conditions)

  Phase 2: Manifestation Blocking Check
  (Detect interference)

  Phase 3: Basis Consumption Test
  (Identify exhausted dispositions)

  Phase 4: Suppression Window Test
  (Check for temporal effects)

  Phase 5: Multi-Track Bounding
  (Define certification scope)

  Phase 6: Disposition Status Determination
  (With explicit inconclusive outcome)

  Special outputs:
  - "Indeterminate" (test can't settle)
  - "Value decision required" (for defaults)

  Applying to cases:
  Case A: Blocking mechanism identified → disposition present but blocked
  Case B: Basis consumed after 40 cycles → disposition present but depletable
  Case C: Measurement interference → manifestation blocked
  Case D: Temporary suppression → disposition absent during test window but present later

  The unpleasant result will be Case D - we'd have to fail certification despite "real" presence because suppression occurs during operational window.

  Technician summary will focus on:
  1. Verify stimulus actually happened
  2. Check for blockers
  3. Test for depletion
  4. Check time effects
  5. Record exact test conditions
  Escalate when finding unexpected blockers or depletion.

  Limits section will cover:
  - Undetectable finks
  - Non-monotonic dispositions
  - Synergistic failures
  - Judgment points

  Key judgment calls flagged:
  - Stimulus sufficiency
  - Blocking mechanism materiality
  - Depletion threshold significance
  - Time window selection
answer: |-
  ### Replacement Test Procedure for Dispositional Properties  
  *Designed for laboratory technicians executing safety-critical qualification tests. Philosophical distinctions reduced to operational checks. Dropped as inert: categorical bases (untestable), conditional analysis failures (covered by blocking checks), reverse finks (empirically indistinguishable from masks). Retained: stimulus-manifestation linkage, blocking mechanisms (masks), basis consumption, suppression windows, multi-track bounding.*

  ---

  **Procedure: Disposition Verification Protocol**  
  *Technician executes steps in order. Record all observations, test parameters, and decisions in the certification report. Escalate to the certification engineer (CE) at flagged steps. Sample allocation: Minimum 3 identical units unless specified.*

  #### **Phase 1: Stimulus Verification**  
  1. **Apply nominal stimulus (S)**  
     - *Execute:* Configure test to deliver the specified stimulus (e.g., temperature, scratch, drop).  
     - *Sufficient answer:* Stimulus parameters measured and recorded (e.g., "Temperature: 85°C ±2°C").  
     - *Output:* Proceed to Step 2 if stimulus achieved. If stimulus not achievable (e.g., blocked by safety feature), output: **Indeterminate: Stimulus not delivered** → Escalate to CE.  

  #### **Phase 2: Manifestation Blocking Check**  
  2. **Check for observable manifestation (M)**  
     - *Execute:* Observe sample for the characteristic manifestation (e.g., venting, crack, displacement) during/after stimulus.  
     - *Sufficient answer:* Manifestation observed and recorded (e.g., "No crack visible at 10x magnification").  
     - *Output:*  
       - If M observed: **Disposition present** → Proceed to Phase 4.  
       - If M absent: Proceed to Step 3.  

  3. **Identify blocking mechanisms**  
     - *Execute:* Inspect test setup and sample for external/internal blockers (e.g., circuits, fixtures, coatings).  
     - *Sufficient answer:* Blocking mechanism identified and described (e.g., "Protection circuit interrupts current") OR "No blocker detected."  
     - *Output:*  
       - Blocker found and removable: Remove blocker, repeat Step 1–2 with new sample.  
       - Blocker found but irremovable: **Disposition masked** → Record and proceed to Phase 4.  
       - No blocker: Proceed to Phase 3.  

  #### **Phase 3: Basis Consumption and Suppression Tests**  
  4. **Test for basis consumption**  
     - *Execute:* Reapply stimulus to the same sample 5 times (or until depletion suspected). Record M each time.  
     - *Sufficient answer:* M absent consistently OR M appears after N cycles (e.g., "Crack observed on 6th scratch").  
     - *Output:*  
       - M appears in later cycles: **Disposition depletable** → Record depletion threshold (e.g., "Manifests after ≥5 stimuli").  
       - M consistently absent: Proceed to Step 5.  

  5. **Test for suppression windows**  
     - *Execute:* Apply stimulus to new sample after:  
       - (a) 24-hour delay post-preparation,  
       - (b) Simulated operational stress (e.g., thermal cycle if specified in service).  
     - *Sufficient answer:* M observed/absent under delayed/stress conditions (e.g., "Fracture observed after 72-hour delay").  
     - *Output:*  
       - M appears under delayed/stress conditions: **Disposition suppressed during test** → Record suppression parameters.  
       - M absent: Proceed to Phase 4.  

  #### **Phase 4: Multi-Track Bounding (If disposition indicated)**  
  6. **Define certification scope**  
     - *Execute:* List all stimulus conditions tested (e.g., "Scratch depth: 0.1mm; Temperature: -20°C to 25°C").  
     - *Sufficient answer:* Parameter ranges for S and M documented.  
     - *Output:* Certification claim bounded to tested conditions (e.g., "Self-healing within scratches ≤0.1mm at 20–25°C").  

  #### **Phase 5: Disposition Status Determination**  
  7. **Assign disposition status**  
     - *Inputs:* Results from Phases 1–4.  
     - *Outputs:*  
       - **Present:** M observed in Step 2 without blockers.  
       - **Masked:** M absent due to irremovable blocker (Step 3).  
       - **Depletable:** M appears only after repeated stimuli (Step 4).  
       - **Suppressed:** M absent during test but observed under delayed/stress conditions (Step 5).  
       - **Absent:** M absent, no blockers, no depletion/suppression.  
       - **Indeterminate:** Stimulus not delivered (Step 1) or inconclusive after Phases 1–3 (requires CE escalation).  
       - **Value decision required:** Inconclusive evidence after all tests (e.g., depletion threshold unknown). CE chooses:  
         - *Conservative default (safety-critical):* Treat as disposition present.  
         - *Commercial default:* Treat as disposition absent.  
         - *Flag in report:* "Default applied: [choice] based on risk tolerance."  

  ---

  ### Application to Cases A–D  
  **Case A: Cell venting under overcharge**  
  - Step 1: Stimulus (overcharge) not achieved due to protection circuit.  
  - Output: **Indeterminate: Stimulus not delivered** → Escalate to CE.  
  - *CE Sign-off:* "Test invalid: Protection circuit prevents overcharge. Supplier must provide circuit-disabled samples or analytical proof."  
  - *Why you won’t like this:* The test fails to qualify the cell, forcing renegotiation with suppliers.  

  **Case B: Self-healing coating cracks under scratch**  
  - Step 2: M (crack) absent (heals immediately).  
  - Step 3: No blocker detected.  
  - Step 4: After 40 scratches, crack appears. Output: **Depletable** (threshold: 40 repairs).  
  - Step 6: Certification scope: "Non-cracking under ≤40 scratches of [geometry]."  
  - *CE Sign-off:* "Depletable disposition: Cracking manifests after healing agent exhaustion (≥41 scratches). Certified for service life ≤40 repair cycles."  
  - *Honest assessment:* The procedure correctly identifies a depletable disposition. Your standard certifies it as "non-cracking" only within its service life (≤40 cycles)—not a defect, but a precise answer to "Does it crack under single scratches during operational life?"  

  **Case C: Shape-memory actuator recovers strain when heated**  
  - Step 1: Stimulus (heat) achieved.  
  - Step 2: M (displacement) absent.  
  - Step 3: Blocker identified (rigid fixture prevents displacement).  
  - Output: **Masked** → Record and proceed.  
  - Step 6: Certification scope: "Generates force at temperature; displacement not measured."  
  - *CE Sign-off:* "Disposition masked by test fixture. Strain recovery inferred from force output; redesign test to measure displacement if required."  

  **Case D: Polymer fractures under drop**  
  - Step 1: Stimulus (drop) achieved.  
  - Step 2: M (fracture) absent.  
  - Step 3: No blocker.  
  - Step 5: After 72-hour delay, fracture occurs. Output: **Suppressed** (by conditioning).  
  - *CE Sign-off:* "Disposition suppressed during test window. Fails certification: Fracture risk present under operational conditions."  
  - *Why you won’t like this:* The part fails despite "passing" the original test.  

  ---

  ### Limits  
  **Failure modes:**  
  1. **Undetectable finks:** A blocker that activates only during stimulus (e.g., a circuit that engages *during* overcharge) may be missed if it leaves no trace.  
  2. **Non-monotonic dispositions:** Properties that manifest only under untested combinations (e.g., temperature + vibration) may be certified as absent.  
  3. **Synergistic failures:** A part passing all single-disposition tests may fail in system integration (e.g., coating depletion accelerating actuator wear).  
  4. **Judgment dependencies:**  
     - Stimulus sufficiency (Step 1): Is "overcharge" defined as voltage or current? Technician judgment.  
     - Blocker materiality (Step 3): Is a removable cover a "blocker" or part of the sample? CE judgment.  
     - Depletion threshold (Step 4): Is 40 cycles acceptable? Value decision.  

  **Supplier exploitation risks:**  
  - A supplier could limit tests to narrow parameters (e.g., only low-stress scratches) or fresh samples.  
  - Mitigation: Procedure requires multi-track bounding (Step 6) and suppression tests (Step 5).  

  **Unresolved distinction:** "Reverse finks" (dispositions enhanced by test setups) are indistinguishable from genuine dispositions without knowing the categorical basis—this remains a gap.  

  ---

  ### Technician Summary (One-Page Plain Language)  
  **Goal:** Verify if a sample will do [X] when [Y] happens (e.g., crack when scratched).  

  **Steps:**  
  1. **Apply the trigger (Y):**  
     - Check: Did [Y] actually happen? (e.g., "Did it reach 85°C?").  
     - Record: Measured values, and if [Y] couldn’t happen.  
     - Stop/escalate: If [Y] not achieved → Tell CE.  

  2. **Look for the result (X):**  
     - Check: Did you see [X]? (e.g., "Is there a crack?").  
     - Record: Yes/no, and how you looked (e.g., "Microscope at 10x").  
     - If no [X]: Go to Step 3.  

  3. **Check for blockers:**  
     - Check: Is something stopping [X]? (e.g., "Is a circuit interrupting?").  
     - Record: What the blocker is, or "No blocker found."  
     - If removable blocker: Remove it, get new sample, restart at Step 1.  
     - If irremovable blocker: Note it → Go to Step 5.  

  4. **Test wear-out:**  
     - Check: Do the test 5 times on one sample. Does [X] happen later? (e.g., "Crack on 6th scratch?").  
     - Record: When [X] appears (e.g., "After 40 scratches").  
     - If [X] never appears: Go to Step 5.  

  5. **Test time delays:**  
     - Check: Wait 24 hours (or add stress like heat cycles). Do test again on new sample. See [X]?  
     - Record: "Saw [X] after delay" or "Never saw [X]."  

  6. **Write the claim:**  
     - Record: Exact conditions tested (e.g., "Scratched at 25°C").  

  **Final Decision:**  
  - If [X] happened normally: "Present."  
  - If blocker stopped [X]: "Masked."  
  - If [X] happened after repeats: "Depletable."  
  - If [X] happened after delay: "Suppressed."  
  - If [X] never happened: "Absent."  
  - If unsure: "Indeterminate" → Tell CE.  
  - If CE must choose risk: "Value decision required."  

  **Escalate when:**  
  - You find a blocker you can’t remove, or the test wears out the sample and you don’t know if it’s safe.  
  - **Single sentence escalation trigger:** "Stop and escalate if the disposition status is indeterminate, or if depletion/suppression thresholds are unknown but critical for safety."  

  **Judgment calls (flag for CE review):**  
  - Step 1: Was the stimulus "enough"?  
  - Step 3: Is a blocker "part of the sample"?  
  - Step 4: Is depletion "significant"?  
  - Step 5: Is the delay "realistic"?
