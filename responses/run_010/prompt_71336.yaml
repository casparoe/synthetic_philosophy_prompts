  We are designing an activity that will force students to confront a situation where two obligations conflict and cannot both be satisfied, and where even after making a justified choice, the unchosen obligation continues to exert a claim. The activity must avoid the trolley-problem feel and must prevent a simple ranking of options. We also need a mechanism for the residue to appear in a later round.

  Core idea: Create a resource allocation task in which students are divided into two groups (e.g., two "departments") and each group must advocate for their own project. However, the twist is that each student is also a member of a larger community (the whole class) and must consider the overall good. The resource is limited (poker chips representing money) and cannot satisfy both projects. The decision must be made by a committee that includes representatives from both departments and some neutral members, but with rules that prevent a simple majority vote from being the end.

  Structure:
  - The class is divided into two departments: Department A and Department B (each with 5 students for a 14-student class, leaving 4 as the "Steering Committee").
  - The Steering Committee (4 students) is responsible for making the final decision but must follow specific rules that force them to consider both claims and then face the residue.

  Materials: Poker chips (two colors: one for the resource, and another for a later "penalty" or "residue" token), printed role briefs, and a whiteboard for tracking.

  Stakes: Instead of real money, we use poker chips that can be redeemed for a non-monetary reward (e.g., extra credit points, or a small treat like candy). Alternatively, we can use a point system that contributes to a class-wide reward (like a pizza party) to create a sense of real stakes without money.

