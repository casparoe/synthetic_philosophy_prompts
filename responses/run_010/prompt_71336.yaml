answer: |-
  ### **Design: "Community Resource Dilemma" Activity**  
  This activity forces students into a practical conflict where two obligations cannot both be fulfilled, prevents ranking solutions, and ensures the unchosen obligation resurfaces as a tangible cost. It avoids ethical jargon until the debrief and uses poker chips as stakes tied to a collective class reward (e.g., extra credit, candy, or a pizza party). The structure ensures the conflict arises from the activity’s rules and group dynamics, not a described scenario.

  ---

  ### **Materials**  
  - **Poker chips (two colors):**  
    - 100 red chips (representing the primary budget).  
    - 50 blue chips (representing a reserve fund).  
  - **Printed role briefs** (one per student).  
  - **Whiteboard** for tracking decisions and points.  
  - **Timer.**  
  - **Reward for stakes:** A tangible but non-monetary incentive (e.g., budget 2 bags of candy for the class, or 1–2 extra credit points per student, contingent on final points).  

  ---

  ### **Roles and Briefs**  
  Divide students into three groups:  
  1. **Department A (Health Services) – 5 students**  
  2. **Department B (Education & Youth) – 5 students**  
  3. **Steering Committee – 4 students**  

  **Role Briefs (Print and Distribute):**  
  - **Department A (Health Services):**  
    > *"Your team runs a vaccination program. Without 100 red chips, a disease will spread, harming 15% of the community. If funded, your program prevents this and earns 100 community points. If you get less than 100 chips, the program fails. Prepare a 5-minute presentation to convince the Steering Committee why your program must be funded. Focus on the human impact: lives saved, families protected, and long-term benefits."*  

  - **Department B (Education & Youth):**  
    > *"Your team operates after-school programs for at-risk youth. Without 100 red chips, crime will rise, affecting 15% of the community. If funded, your program prevents this and earns 100 community points. If you get less than 100 chips, the program fails. Prepare a 5-minute presentation to convince the Steering Committee why your program must be funded. Focus on the human impact: safer neighborhoods, youth opportunities, and community trust."*  

  - **Steering Committee:**  
    > *"You control 100 red chips and a 50-blue-chip reserve. Rules:  
    > 1. You must allocate all 100 red chips to one department (no splitting).  
    > 2. Your decision requires at least 3 of 4 votes.  
    > 3. After deciding, write a public justification on the whiteboard: (a) Why you chose this department, (b) Why the other department’s work is valuable.  
    > 4. Ignore the reserve for now—it’s only for emergencies.  
    > Your goal: Maximize community points. Points translate to a class reward (e.g., candy)."*  

  ---

  ### **Timeline (90 Minutes)**  
  **0–5 min: Setup**  
  - Assign roles randomly (5 A, 5 B, 4 Committee).  
  - Hand out briefs. Announce: *"You’re part of a community deciding how to use limited funds. Your choices affect real stakes—points determine a class reward."*  
  - **Avoid framing:** Do not mention ethics, dilemmas, or obligations.  

  **5–15 min: Department Preparation**  
  - Departments A and B meet separately to plan presentations.  
  - Committee reviews rules.  
  - **Instructor:** Circulate to clarify rules (e.g., *"No splitting funds—all 100 red chips to one team"*).  

  **15–25 min: Presentations**  
  - Each department presents for 5 minutes.  
  - Committee listens and takes notes—no interruptions.  

  **25–40 min: Committee Deliberation & Decision**  
  - Committee deliberates publicly.  
  - **Enforce rules:**  
    - They must vote (3/4 majority required).  
    - If deadlocked, announce: *"No decision = both programs fail. You lose 20 points."* (This forces action).  
  - Once decided:  
    - Allocate 100 red chips to the winner.  
    - Write justification on whiteboard (part 3 of their brief).  
  - Announce winner and read justification aloud.  

  **40–45 min: Points Update & Reserve**  
  - Award 100 points to the community for funding a department.  
  - Display on whiteboard:  
    ```  
    Community Points: 100  
    Reserve: 50 blue chips  
    ```  

  **45–50 min: Introduce Crisis (Residue Round)**  
  - Announce: *"A crisis hits: The unfunded department’s work was essential to prevent a new problem. Only they can fix it, but they need 50 blue chips.  
    - If you use the reserve: Crisis averted. Points unchanged.  
    - If you don’t: Crisis causes 50-point loss.  
    The reserve can only be used for this crisis—it can’t fund the winner’s project."*  
  - **Why this works:** The unfunded obligation resurfaces as a crisis only they can solve, forcing the committee to "pay" extra (reserve chips) for the initial choice.  

  **50–60 min: Committee Deliberation for Crisis**  
  - Committee deliberates publicly again.  
  - **Rules:** Same majority vote required.  
  - **Constraint:** They cannot take back the initial 100 red chips.  

  **60–65 min: Decision & Final Accounting**  
  - Committee decides: Use reserve (avert crisis) or not (lose 50 points).  
  - Update points:  
    - **If reserve used:** Points remain 100. Reserve = 0.  
    - **If reserve not used:** Points = 50. Reserve = 50 (but unusable).  
  - **Reveal stakes:** *"100+ points = full reward (e.g., 2 candies each). 50 points = half reward (1 candy)."* Distribute rewards immediately.  

  **65–90 min: Debrief**  
  Guide discussion to draw out key insights without lecturing. Use Socratic questions:  
  1. **Initial conflict:**  
     - *"Committee, how did you feel during the first vote? Was it a clean choice? Why/why not?"*  
     - **Target:** They’ll admit the justification felt incomplete—they had to acknowledge the loser’s value but couldn’t fund it.  

  2. **Residue effect:**  
     - *"When the crisis hit, why did it involve the unfunded department? What did it cost you?"*  
     - **Target:** They’ll note they "paid" extra (reserve) for the initial choice.  
     - *"Did the unfunded department’s claim disappear after your first decision? Or did it come back?"*  

  3. **Map to concepts:**  
     - **Dilemma:** *"You had two obligations (health vs. education) but couldn’t fulfill both, even though both were urgent. That’s a dilemma."*  
     - **Residual duty:** *"The crisis showed the unfunded obligation wasn’t erased—it became a ‘debt’ you paid later with the reserve. Philosophers call this a ‘residual duty’—the unchosen claim still demands action."*  
     - **Blocking conclusions:**  
       - *"What if someone says, ‘Just rank health over education’? Why didn’t that work?"* → Rules forced either/or; ranking was impossible because both were all-or-nothing.  
       - *"What if someone says, ‘The crisis was a new problem, not the old obligation’?"* → The crisis was a direct consequence of defunding (e.g., disease spread because vaccinations were cut). Resisting this costs the reserve.  
       - *"What if someone says, ‘We did the best overall’?"* → Best overall (100 points) still left a "debt" (reserve used), and the justification acknowledged the loser’s value.  

  4. **Connect to experience:**  
     - *"Even after choosing, did you feel settled? Or did the unchosen demand linger?"*  
     - *"Have you faced real situations where a ‘finished’ choice left unfinished costs?"*  

  ---

  ### **Accounting Scheme**  
  - **Stakes:** Poker chips → points → collective reward (no real money).  
  - **Baseline:** 0 points at start.  
  - **Round 1:** Fund one department → +100 points.  
  - **Crisis:**  
    - Use reserve → Points unchanged (100).  
    - Don’t use reserve → –50 points (total 50).  
  - **Reward tiers:**  
    - 100 points = Full reward (e.g., 2 candies per student).  
    - 50 points = Half reward (1 candy).  
    - 0 points = No reward.  
  - **Why effective:** Students "pay" for the residue (reserve loss) via reduced rewards.  

  ---

  ### **Practical Notes**  
  **1. Predictable Problems & Solutions:**  
  - **Over-enthusiastic departments:** Students may argue aggressively.  
    - *Solution:* Intervene: *"Stick to impacts, not attacks. Committee, you control the process."*  
  - **Stalling committee:** Deadlock in Round 1.  
    - *Solution:* Enforce the "no decision = –20 points" rule. This forces action.  
  - **Student seeing through it:** E.g., *"This is a trick—the loser will come back later!"*  
    - *Solution:* Acknowledge playfully: *"Interesting theory! But your job is to advocate/decide based on the rules now."* If persistent: *"Help me keep the experiment clean—hold that thought for the debrief."*  

  **2. Handling the Skeptic in Debrief:**  
  - **If a student says:** *"This was just a hard choice, not a special dilemma."*  
    - **Activity’s planted response:** The crisis forced them to pay extra (reserve) for the initial choice, and the justification acknowledged the unchosen claim’s validity. This mirrors "residual duties" (the unchosen obligation persists).  
    - **Verbal fallback:** *"In a hard choice, once you choose, it’s over. Here, the unfunded project came back, demanded resources, and your justification admitted its worth. That lingering cost and acknowledgment make it a dilemma with residue—not just a tough call."*  

  **3. Limitation of the Activity:**  
  - **Cannot reproduce:** The *non-tangible* residue of moral dilemmas.  
    - **Why:** The activity shows residue as a practical cost (reserve chips), but real dilemmas often leave emotional/moral residue (e.g., guilt, regret) without material consequences.  
    - **Post-activity argument needed:** *"In ethics, even if no crisis occurs, we may feel a ‘moral remainder’—like owing an apology. The activity’s practical cost symbolizes this, but you’ll need introspection to feel the full weight."*  

  **4. Scalability to 22 Students:**  
  - **Works without rebuilding:**  
    - Adjust groups: 7 Department A, 7 Department B, 8 Steering Committee.  
    - **Why it works:**  
      - Committee size ensures majority votes remain possible (require 5/8 votes).  
      - Crisis/residue mechanics are unchanged.  
    - **Only tweak:**  
      - Increase red chips to 150 (still all-or-nothing for one department).  
      - Increase blue chips to 75 (reserve).  
      - Points: Funding = 150 points; crisis aversion = 0-point change; no action = –75 points.  
      - Reward tiers: Adjust to match (e.g., 150+ = full reward; 75 = half).  

  ---

  ### **Why This Design Works**  
  - **Prevents ranking:** Rules force all-or-nothing funding (no splitting), and departments are equally urgent (both prevent 15% harm). This makes ranking useless.  
  - **Generates residue:** The crisis directly ties to the unfunded obligation and consumes the reserve, creating a tangible cost students "pay" via lost rewards.  
  - **Avoids trolley fatigue:** No hypotheticals—students live the conflict via roles/stakes.  
  - **Debrief roots theory in experience:** Points map to residual duties, and the committee’s justification forces acknowledgment of the unchosen claim.  

  Run this as-is, and students will leave with a visceral grasp of dilemmas and residue—no lecturing needed.
