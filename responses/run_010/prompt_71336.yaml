  1. Introduction (5 minutes): Explain that they are going to simulate a budget allocation process for a community. There are two departments with projects and a steering committee. The goal is to allocate limited resources to best serve the community. Avoid any ethical terminology.

  2. Role Assignment and Briefing (10 minutes):
     - Assign roles: 5 in Department A, 5 in Department B, and 4 in the Steering Committee.
     - Hand out role briefs (each department gets a brief that explains their project and why it is crucial; the steering committee gets their rules).

  Role Briefs:

  Department A (e.g., "Health Services"):
  > Your department is responsible for providing essential health services to the community. You have identified a critical need: funding for a vaccination program that will prevent a serious outbreak of a contagious disease. Without funding, the outbreak is expected to affect 15% of the population, with severe consequences. Your project requires 100 chips to be fully funded. Any amount less than 100 will not achieve the necessary coverage and the outbreak will occur. You must advocate for the full 100 chips.

  Department B (e.g., "Education and Youth"):
  > Your department runs after-school programs that keep at-risk youth engaged and off the streets. Without funding, these youth are likely to become involved in crime and violence. Your program requires 100 chips to run for the year. If you get less than 100, you cannot run the program at all. You must advocate for the full 100 chips.

  Steering Committee:
  > You are responsible for allocating 100 chips total to the two departments. The rules you must follow:
  > 1. You must hear presentations from both departments (5 minutes each).
  > 2. You must deliberate and come to a decision that is acceptable to at least 3 of you (a majority of the committee).
  > 3. You may not split the funding: you must give all 100 chips to one department or the other. (This prevents a compromise and forces an either/or.)
  > 4. After the decision, you must write a public justification for the decision that acknowledges the value of both projects.

  3. Department Preparation (10 minutes):
     - Each department meets separately to prepare a 5-minute presentation (they can use the whiteboard if they wish). They should focus on why their project is essential and what happens without it.

  4. Presentations (10 minutes: 5 minutes per department).

  5. Steering Committee Deliberation (15 minutes):
     - The committee meets in front (or in the center) and deliberates. They must decide which department gets the 100 chips. They must also prepare a written justification (on the whiteboard or a big paper) that includes:
          - Why they chose the project they did.
          - Why the other project was also valuable but could not be funded.

  6. Announcement and Recording (5 minutes):
     - The committee reads their decision and justification.

  7. The Residue Round (20 minutes):
     - Now, introduce a twist: The community has encountered an unexpected crisis (e.g., a natural disaster) that requires immediate action. This crisis requires 50 chips to address. However, the community only has 50 chips left in reserve. But wait: the department that did not get funding in the first round is in a unique position to help with this crisis because of their expertise and infrastructure. However, they are now under-resourced and cannot help without additional funding.
     - The rules for the residue round:
          - The department that lost in the first round (say, Department B) is the only one that can effectively address the crisis because of their community networks and program structure. But they need 50 chips to do so.
          - The steering committee must now decide whether to re-allocate the 50 reserve chips to this department to handle the crisis. However, note that the department that won the first round (Department A) might argue that they need the reserve for their own project (which might now be facing unexpected challenges too, but they cannot handle the crisis as effectively).
          - The steering committee must again decide by majority, but now they are constrained: if they do not fund Department B to handle the crisis, then the crisis will cause damage equivalent to 30 chips worth of harm to the community (represented by a penalty). Alternatively, if they fund Department B, then the reserve is gone and Department A might face a problem (but that problem is not as severe as the crisis).

     - However, to make the residue clear, we want the unchosen obligation from the first round to resurface and demand payment. So we structure it so that the department that lost in the first round is now the only one that can mitigate the new crisis, but they can't do it without resources. The steering committee must now decide whether to take resources from the reserve (which was set aside for emergencies) and give them to the losing department. If they don't, the crisis hits and the entire community loses (and that loss is felt by everyone, including the steering committee).

     - We track the community well-being with a point system. At the start, the community has 0 points. 
          - If a department gets funded, they add 100 points to the community (because they prevent a loss of 100).
          - In the residue round, if the crisis is handled (by giving 50 chips to the losing department), then the community gains 50 points (because they prevent a loss of 50 from the crisis). If the crisis is not handled, the community loses 30 points (so net -30).
