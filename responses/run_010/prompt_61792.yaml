  Hmm, this is an advanced request for a high school student, but clearly well-researched. The constraints are precise: must avoid textbook examples, require realistic setup, and crucially remove the "indistinguishability" element while keeping the hallucination vivid. The core challenge is designing a scenario where the subject knows they're hallucinating without introspection or perceptual checks.

  I'm considering a locked container scenario—simple, mundane, and avoids all clichés. The subject knows exactly what's inside the container through prior action (locking it), yet sees an object that couldn't possibly be there. This satisfies: 
  - Mundanity: A boring mug in a locker
  - Knowledge source: Their own action of locking the empty locker
  - Realism: No sci-fi elements
  - Originality: Not a dagger/lemon trope

  For the demonstration: 
  The common-factor theorist must say the experience has identical yellow-mug character in both perception and hallucination. The disjunctivist must deny any shared character—but now the subject knows it's fake. This exposes the borrowed-character view's weakness: if indistinguishability is removed, what "character" is left to borrow? The knowledge doesn't change the experience's qualia; it just labels it false. 

  The key feature is *action-based collateral knowledge*. Remove that, and it collapses into a standard hallucination where indistinguishability holds. The best disjunctivist reply would be that "knowing" ≠ introspective discriminability—but this feels like postponing the issue since the vivid qualia persist despite knowledge.

  Verdict: COLLAPSES. The borrowed-character view can't explain why the hallucination still feels vividly like a mug when the subject knows it isn't real. Action-based certainty dismantles the indistinguishability crutch.
answer: |-
  ### Thought Experiment: The Locked Locker  

  Maya, in her familiar school hallway, approaches her assigned locker—number 307—which she personally locked empty five minutes ago after removing her textbooks. As she turns the corner, she vividly sees her blue ceramic mug sitting on top of locker 307, its chipped handle and faded decal rendered in perfect detail, casting a shadow on the floor. The hallucination is sensorially flawless, matching how the mug would look if actually present. Yet Maya knows with certainty the mug is impossible: she recalls locking the empty locker herself, feels the key she just pocketed, and knows the mug is in her bag because she placed it there after washing it. Her knowledge derives solely from her direct, recent action (securing the locker) and her count of items moved—no introspection or sensory double-checking occurs.  

  ---

  ### Demonstration  

  - **Common-Factor Theorist**: Claims Maya’s hallucination shares an identical positive phenomenal character with a genuine perception of the mug—both involve a subjective "blueness," spatial presence, and texture-detail. The collateral knowledge doesn’t alter this intrinsic character.  
  - **Disjunctivist (Borrowed-Character View)**: Insists the hallucination has no intrinsic character. Its "mug-like" appearance is exhaustively defined by its indiscriminability from a perception. Here, Maya *can* discriminate it via collateral knowledge, so the hallucination lacks even borrowed character. It is a "blankslate" state misdescribed as mug-like.  

  **Central Question**: Once Maya knows she’s hallucinating, does borrowed character persist?  
  - The character *cannot* be re-located in a "standing indiscriminability" because Maya’s knowledge defeats indiscriminability *for her*. The view must either:  
    - (A) Deny the hallucination has any positive character (collapsing into absurdity—Maya still experiences vivid blueness),  
    - (B) Concede hallucinations *do* have intrinsic character (abandoning disjunctivism’s core claim), or  
    - (C) Redefine "indiscriminability" counterfactually ("*if* she didn’t know, she couldn’t tell"). But (C) admits character exists independently of actual discriminability, betraying the view.  

  **Decisive Feature**: **Action-based collateral knowledge**—Maya’s certainty from locking the locker. Remove this (e.g., she *thinks* she locked it but isn’t sure), and the case reverts to standard indiscriminable hallucinations where both theories align descriptively.  

  **Best Reply for Borrowed-Character View**:  
  *Objection*: Collateral knowledge isn’t introspective discriminability—the hallucination might *feel* identical to perception from the inside, even if Maya knows it’s fake via external facts. Thus, the relevant "telling-from-the-inside" remains intact.  
  *Rebuttal*: This reply postpones the difficulty. If the experience is introspectively identical to perception, it must possess positive character (contra disjunctivism). If it lacks character, introspection *should* reveal a difference (e.g., emptiness)—but Maya reports vivid detail. The view cannot simultaneously deny intrinsic character and assert introspective identity under collateral knowledge.  

  **Verdict**: COLLAPSES (action-based collateral knowledge)
