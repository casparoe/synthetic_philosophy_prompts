  Here's a complete, practical plan for your group activity, designed to work without precise timing or illusions, using your available kit. The key is to create two distinct "editing" experiences through narrative and document manipulation, then reveal how both lead to identical subjective uncertainty.

  ### **Core Concept**
  Participants experience two storytelling rounds. In **Round 1 (Stalinesque)**, the full story is pre-decided; no changes occur. In **Round 2 (Orwellian)**, the story is altered *after* they witness it. Crucially, both rounds end with identical outcomes, making it impossible for participants to distinguish which editing style they experienced—despite physical evidence (paper records) showing the difference.

  ### **Materials List**
  - **Projector + 1 laptop** (displaying story slides)
  - **Second laptop** (for "official transcription" in Round 2)
  - **Colored card** (red, blue, green, yellow—cut into 5cm squares)
  - **Paper** (blank sheets + printed "official records")
  - **Envelopes** (12 per round, labelled)
  - **Stopwatches/phones** (for timing, not precision-dependent)
  - **Pens**

  ---

  ### **Roles & Rules** (for 12 participants)
  1. **Facilitator (You)**: Run slides, manage timings, play "transcriber" in Round 2.
  2. **Witnesses (All)**: Observe stories and record what they see.
  3. **Archivists (2 volunteers per round)**: Collect envelopes and guard "evidence."

  **Rules for Everyone:**
  - No talking during rounds.
  - Write *exactly* what you see—no guessing intentions.
  - Archivists seal envelopes immediately after collecting responses.

  ---

  ### **Timeline** (2 Hours Total)
  #### **0:00–0:15 — Setup & Introduction**
  - Project: *"Today: How stories get edited in our minds. You’ll see two short tales. After each, record what you witnessed."*
  - Hand out paper, pens, envelopes. Assign archivists.
  - **Key Instruction**: *"Write what you *actually observe*—not what you think *should* happen."*

  #### **0:15–0:35 — Round 1 (Stalinesque: Pre-Edited)**
  - **Story Setup**:  
    Project 3 slides (5 sec each):  
    Slide 1: Red card + text *"A red apple fell."*  
    Slide 2: Blue card + text *"A blue bird caught it."*  
    Slide 3: Green card + text *"They vanished into green woods."*  
  - **Witness Task**:  
    Participants write: **What color was the bird?** → Seal in envelope → Archivists collect.
  - **Facilitator Action**:  
    Reveal "Official Record" (pre-printed):  
    *"THE STORY: Apple (red) → Bird (blue) → Woods (green). NO CHANGES MADE."*  
    Project this for 30 sec. **No discussion yet.**

  #### **0:35–0:55 — Round 2 (Orwellian: Post-Edited)**
  - **Story Setup**:  
    Same 3 slides as Round 1 (red→blue→green), but *add*:  
    - Open a blank doc on the second laptop.  
    - "Transcribe" each slide *as it appears* (type exactly what’s projected).  
  - **Critical Twist**:  
    After Slide 3, *stealthily edit the transcription*:  
    Change *"A blue bird caught it"* to *"A **yellow** bird caught it."*  
    Project this "Official Record" with **yellow text for the bird line**.  
  - **Witness Task**:  
    Participants write: **What color was the bird?** → Seal in envelope → Archivists collect.  
  - **Facilitator Action**:  
    *Casually mention*: *"System logs show the bird was always yellow—projector glitches sometimes."*  

  #### **0:55–1:15 — Distraction & Prep**
  - **Filler Activity**:  
    Hand out colored cards. *"Group these by shade—quickly!"* (3 mins).  
  - **Prep Evidence**:  
    Place Round 1 envelopes + "NO CHANGES" record on left table.  
    Place Round 2 envelopes + "EDITED RECORD" (showing blue→yellow) on right table.  

  #### **1:15–1:50 — The Reveal & Debrief**
  - **Step 1: Poll Uncertainty**  
    Ask: *"Which round had hidden edits? Left or right table?"* Take votes.  
  - **Step 2: Show Physical Evidence**  
    - Open Round 1 envelopes: Most say *"blue bird."* Match "NO CHANGES" record.  
    - Open Round 2 envelopes: Most say *"blue bird"* but the record shows *"yellow."*  
    Point out: *"In Round 2, I altered the *record* after you saw the blue bird."*  
  - **Step 3: Introduce Concepts**  
    Project:  
    - **STALINESQUE (Round 1)**: *"Brain waits, then shows a 'finished' story. No rewrites."*  
      → *"You saw blue, the record matched. No mystery."*  
    - **ORWELLIAN (Round 2)**: *"Brain edits *after* the event. The 'yellow' record overwrote memory."*  
      → *"But you *still* felt unsure—was it blue or yellow?"*  
  - **Step 4: Link to Experience**  
    Ask: *"When I blamed the 'projector glitch' in Round 2, did you doubt your eyes? That’s Orwellian editing: your brain trusts the 'new record.'"*  
    → *"In both rounds, I knew the truth. You didn’t—and couldn’t tell which edit happened."*  

  #### **1:50–2:00 — Group Reflection**
  - *"When has your memory 'rewritten' something? Votes, news, arguments?"*  
  - Avoid theory—focus on personal examples.  

  ---

  ### **What Will Go Wrong (and Fixes)**
  1. **"I was just guessing!"**  
     - **Prevent It**: Stress *"Write what you SEE, not what you EXPECT"* upfront. Use distraction tasks (color sorting) to prevent overthinking.  
     - **If It Happens**: *"Guessing is the point! Your brain *guesses* when editing is invisible."*  

  2. **Participants Spot the Edit**  
     - Likely if they watch the typing laptop closely. **Fix**: Position the second laptop facing only you. If caught, admit: *"You saw the edit—but most don’t. That’s why brain edits work in secret."*  

  3. **Tech Failures**  
     - Projector issues? Use colored cards held up by volunteers.  
     - Transcription typo? Roll with it: *"See? Even I make editing errors!"*  

  4. **Ambiguous Memories**  
     Some will insist they saw yellow in Round 2. **Use This!**  
     → *"Exactly! Orwellian editing makes the 'new truth' feel real."*  

  ### **The Unavoidable Compromise**
  You **can’t replicate millisecond illusions** with amateur kit. Instead, leverage **narrative tension** and **document tampering** to create the same uncertainty. The "yellow bird" edit mirrors the color-changing dot—but with slower, social pressure (the "official record") replacing neural timing.  

  ### **Why This Works**
  - **Physical Evidence**: Envelopes prove Round 2 was altered; polls show participants *still* can’t agree.  
  - **No Expertise Needed**: Editing documents is tangible (typo fixes, gossip).  
  - **Safe Failure**: If the illusion fails, the paperwork still exposes the mechanics.  

  This turns limitations into strengths—using "bodge jobs" (projector glitches, quick edits) to mirror how messy real-world memory edits feel.
