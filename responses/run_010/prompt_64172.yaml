answer: |-
  **Regional Infrastructure Agency**  
  **Project Appraisal Manual: Edition 17**  
  **Annex 22/B: Expected Value Maximisation Procedure**  
  **Issued under the Authority of Nigel Thorne, Accounting Officer**  
  **Effective Date: 1 April 2025**

  **Preamble:**  
  This annex details the mandatory methodology for the appraisal of all expenditure proposals exceeding £50,000, following Policy Directive RIA/PD/EV/01. The sole criterion for approval is the maximisation of expected value (EV), calculated as the probability-weighted sum of all possible outcomes. Outcomes are valued utilising an unbounded cardinal utility function. Risk neutrality is a requirement of compliance with this guidance. Proposals must be submitted using Template EV-7 (v3.2).

  **1. Unbounded Utility Function**  
  1.1 The Department’s utility function does not incorporate an upper bound. While bounded utility functions offer computational simplicity, they inherently impose a ceiling on ambition (Footnote A). Any finite bound *U_max* will, for sufficiently large potential outcomes *X* and sufficiently small probabilities *p*, fail to satisfy *p * U(X) > U(Y)* for any finite benefit *Y* achievable with certainty. This renders the function incapable of correctly ranking scenarios involving extremely high-impact, low-probability events against finite certain benefits, a limitation deemed operationally unacceptable. 1.2 Risk neutrality – the linear weighting of probabilities within the EV calculation – is mandated policy. Officers are not required to possess personal conviction regarding risk neutrality; adherence to the prescribed calculation methodology constitutes compliance.

  **2. Social Time Preference**  
  2.1 The Social Time-Preference Rate (STPR) for all outcomes, irrespective of temporal distance, is set at 0% per annum. This reflects the Department’s commitment to intergenerational equity and avoids arbitrary devaluation of future welfare states. 2.2 Consequently, outcomes occurring in the distant future (e.g., 10,000 years hence) are valued identically to equivalent outcomes occurring immediately. Officers should ensure timescales for potential outcomes are clearly stated in proposals. Discounting tables are obsolete under this guidance.

  **3. Worked Example: Culvert Repair vs. Long-Term Existential Risk Mitigation**  
  3.1 **Proposal A (Culvert Repair):** Prevents flooding to 15 residential properties in Lower Gubbington with certainty within 12 months. Expected utility (monetised equivalent): £1.2 million.
  3.2 **Proposal B (Asteroid Detection Refinement):** Funds a minor calibration upgrade to the regional near-earth object tracking array. Analysis indicates a 10^-15 probability of enabling deflection of a previously undetectable class of planetoid, thereby preventing human extinction within the next million years. Conservative estimate of lives saved given successful deflection: 10^25 (Footnote B). Utility per life saved is linear and unbounded. Expected utility: (10^-15) * U(10^25 lives) = 10^10 utility units.
  3.3 **Comparison:**

  | Proposal | Probability (p) | Outcome (X) | Utility U(X) | Expected Value (p * U(X)) | Approval Recommended |
  | :------- | :-------------- | :---------- | :----------- | :------------------------ | :------------------- |
  | A        | 1.0             | Prevent £1.2m damage | £1,200,000   | £1,200,000                | No                   |
  | B        | 1e-15           | Prevent extinction (10^25 lives) | 1e25 * k     | 1e10 * k                  | **Yes**              |

  *(k = linear utility coefficient per life saved, value irrelevant due to dominance)*

  3.4 **Decision:** Proposal B exhibits significantly higher expected value and is approved. Proposal A is rejected. The certain, localised benefit to identifiable current residents is materially outweighed by the expected value calculation.

  **4. Proposals with Infinite Expected Value**  
  4.1 Any proposal demonstrating an infinite expected value (EV = ∞) must be approved regardless of financial cost, provided only that the cost itself is finite. Common sources include scenarios with non-zero probability of infinite positive utility, or infinite series of outcomes where the sum diverges. 4.2 Where multiple proposals each possess infinite EV, standard ranking is impossible. The tie-breaker procedure is as follows: The proposal submitted earliest (by timestamp of final validated submission on RIA-PORTAL) shall be prioritised. If submission times are identical, priority is determined by the alphabetical order of the project’s short title (ascending, A-Z).

  **5. Conditionally Convergent Payoff Series**  
  5.1 Certain proposals may present a series of potential outcomes whose summed expected value converges only conditionally (i.e., the sum depends on the order of summation). 5.2 Instances have occurred where Directorate A (sorting outcomes by magnitude, smallest first) and Directorate B (sorting outcomes by estimated date of occurrence, earliest first) derived materially different finite EVs for the same proposal. 5.3 To ensure consistency, bidders must declare a single **Canonical Ordering** for the summation of outcomes within their proposal. This ordering must be explicitly stated in Section 7.2 of Template EV-7 (v3.2) and will be binding for appraisal. Failure to declare a Canonical Ordering renders the proposal invalid.

  **6. Acknowledgment of Operational Characteristics**  
  6.1 It is acknowledged that this methodology may require the rejection of proposals offering certain, modest benefits to identifiable beneficiaries in favour of proposals offering negligible probabilities of extremely large payoffs, or the rejection of proposals seeking negligible cost to avert certain catastrophe. 6.2 All appraisal teams must utilise the centralised EV-CALC tool (v2.1.4) for all calculations; local spreadsheets are non-compliant. Version control logs must be retained.

  **Appendix A: Dissenting Observation & Accounting Officer Response**

  *   **Dissenting Observation (Anonymous, Grade 7 Analyst, Long-Term Futures Unit):** "While mathematically coherent within its axioms, the unbounded linear EV approach exhibits several concerning properties: (i) It violates the widely accepted principle of diminishing marginal utility and the necessity of bounded utility functions to avoid St. Petersburg paradoxes and ensure rational choice under extreme uncertainty; (ii) It ignores robust behavioural evidence of non-linear probability weighting (e.g., prospect theory), particularly regarding infinitesimal probabilities; (iii) It grants decisive weight to outcomes whose purported probabilities (e.g., 10^-15) lack meaningful empirical foundation or falsifiability; (iv) Crucially, it provides no discipline against proposal inflation, as any finite EV bid can always be theoretically dominated by another bid positing a slightly smaller probability of a vastly larger payoff, rendering the appraisal process perpetually vulnerable to highly speculative claims. A framework incorporating bounded utility, non-linear probability weighting, and epistemic humility regarding extreme low-probability estimates would offer greater operational robustness."
  *   **Accounting Officer Response (Nigel Thorne):** "The observation is noted. The methodology remains as set out in Annex 22/B and Policy Directive RIA/PD/EV/01."

  ---

  **Footnotes**  
  **Footnote A:** Ambition, in this context, refers strictly to the theoretical capacity of the utility function to assign appropriate ordinal ranking to all conceivable outcomes, regardless of scale or probability. It does not relate to departmental performance targets.  
  **Footnote B:** The figure of 10^25 lives represents the estimated cumulative future potential population across all habitable planets within the theoretically detectable range of the upgraded array, discounted at 0% STPR over a 10^6 year timeframe, assuming steady-state colonisation. Sensitivity analysis (+/- 5 orders of magnitude) does not alter the outcome of the worked example.  
  **Footnote C:** The coefficient *k* represents the linear utility per life saved. Its absolute value cancels out in comparative assessments; only the ratio of EVs is material for decision-making under this guidance.
