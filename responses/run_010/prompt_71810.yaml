prompt: |-
  I'm on a city naming commission — twelve of us, brand new intake, and I've somehow been volunteered to run the 90-minute orientation before our first real case comes up in the spring. Nobody has any philosophy. There's a retired postal carrier, two realtors, a high school history teacher, and several people the council appointed for reasons nobody can name. I dont want to brief them on the case. I want to teach them one distinction they can carry into every case we'll ever see: that a commemorative name isn't a piece of historical record — that naming a boulevard after someone is doing something different from documenting them, and that most of what people yell about at these hearings is really a fight over which of those two things they think is happening.

  Don't explain the distinction to me, I have it. Plan how I explain it to them, in 90 minutes, with a whiteboard. Specifically: what has to be in place before the distinction means anything at all (I suspect "an honor is a present-tense thing you're doing, not a claim about the past" is load-bearing, but I don't know where in the sequence it goes or what it needs underneath it first). Whether to carry the whole thing on our own live case — the boulevard is named for the engineer who built the levee project that also cut a neighborhood in half, and local historians genuinely disagree about whether he pushed for that route or just drew what the council picked — or whether that's a trap, because it'll collapse into an argument about facts I can't settle in the room. If it's a trap, tell me what a clean stand-in case would have to have and what it would have to leave out (I'm guessing a case where the person's record is beyond dispute, but explain why). Then the misconceptions, in the order they'll actually arrive: "removing a name erases history," "you can't judge people by today's standards," "he did far more good than harm so it nets out," "just put up a plaque explaining it," and the one I dread most, "the name doesn't mean anything anymore, it's just an address people type into a GPS." For each, give me the moment in the sequence where I head it off before it forms, not the moment I'd have to argue it down afterward — and say which of the five is actually a reasonable position that deserves an answer rather than a correction. Give me one question I can put to them at the end that shows whether the distinction landed, ideally one where somebody who memorized my phrasing answers differently from somebody who's got it. And tell me what I should refuse to get into at this level, and say out loud in the room that I'm refusing it.

  Last thing, and it matters: as you lay out what I should tell them, keep straight for me which parts of this are settled among people who actually work on memory, monuments and public naming, and which parts are live arguments. I don't want to hand twelve laypeople a contested normative view with a consensus price tag stuck on it — especially anywhere the answer might turn on how the unresolved history of our own engineer comes out. Flag those spots explicitly.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're on a city naming commission with twelve diverse members, none of whom have a background in philosophy or naming conventions. The user has to run a 90-minute orientation focusing on the distinction between commemorative naming and historical documentation. Their main goal is to equip the commission with a foundational understanding to prevent future conflicts.

  First, I need to break down the core distinction: commemorative names are about present-day honor, not historical record. The user mentioned that an honor is a "present-tense thing," which is crucial. I should structure the session to build this concept step by step. 

  The user is concerned about using their live case (the engineer and the levee project) as an example. They worry it might devolve into historical debates they can't resolve. I think they're right—using a contested case could derail the orientation. Instead, a clean example with an uncontested figure would be better. Someone universally respected but with complex aspects, like Ada Lovelace. She's known for her contributions to computing, but her personal life isn't the focus. This avoids historical disputes and keeps the focus on the naming distinction.

  Next, addressing misconceptions. The user listed several common ones: "removing a name erases history," "can't judge by today's standards," etc. I need to tackle these preemptively in the session flow. For example, when discussing commemoration vs. documentation, emphasize that removing a name doesn't erase history—it's about ceasing to honor, not forgetting. This should come early to prevent the misconception from forming.

  The user also asked which misconception is a reasonable position. The one about adding a plaque is actually valid. It's a compromise that addresses both honor and documentation. I should present this as a potential solution rather than a misconception, showing how the distinction clarifies options.

  For the end, a question to test understanding: asking about renaming "Lincoln Avenue" if new documents revealed Lincoln opposed emancipation. If they grasp the distinction, they'd say renaming isn't about erasing history but reevaluating honor. Someone memorizing might give a textbook answer without nuance.

  I also need to flag contested areas in memory studies. Consensus exists on commemoration being present-focused, but debates continue on who decides, criteria for honor, and the role of public pain. Highlighting these areas keeps the commission aware of ongoing discussions without presenting them as settled.

  Lastly, the user wants to avoid getting into specific historical debates during orientation. I should advise stating upfront that individual cases won't be discussed, focusing instead on the framework. This sets boundaries and keeps the session on track.
answer: |-
  Here’s a battle-tested 90-minute orientation plan focused on your core distinction, designed to preempt common misconceptions while flagging contested academic terrain. Prioritize **clarity over comprehensiveness**—your goal is inoculation against future derailments.

  ---

  ### **Session Structure & Core Sequence**  
  *(Whiteboard Flow: Left = "Commemoration", Right = "Documentation")*

  1.  **Groundwork (15 min): What Names *Do***  
      *   **Question to Group:** *"When you hear 'Martin Luther King Jr. Boulevard,' what's the first thing that comes to mind?"* (Note answers verbatim on board).  
      *   **Reveal:** "Notice: Most answers aren't *facts* about MLK. They're feelings (hope), values (justice), or *what we think the city is saying* by using his name. **Names aren't just labels; they perform an act.**"  
      *   **Key Distinction (Write):**  
          > **COMMEMORATION = An ACT OF HONOR (Present/Future)**  
          > *What we value NOW. Who we celebrate. What we aspire to.*  
          > **DOCUMENTATION = An ACT OF RECORD (Past)**  
          > *What happened. Complex truths. Full context.*  
      *   **Load-Bearing Bolt:** **"Commemoration is a *present-tense gift* from our community, NOT a historical judgment.** We bestow it *now*, based on *current* values. Documentation tries to capture the messy past."

  2.  **The "Clean" Example (20 min) - AVOID YOUR LIVE CASE!**  
      *   **Why It's a Trap:** Your engineer case hinges on unresolved historical debate. The group will fixate on "what *really* happened," collapsing the commemoration/documentation distinction.  
      *   **The Clean Stand-In:** **Ada Lovelace Street.**  
          *   *Why it works:*  
              *   **Undisputed Fact:** First computer programmer (documentation).  
              *   **Commemoration Angle:** Honors innovation, women in STEM (present values).  
              *   **Complexity (Safe):** Lived in 1800s, aristocratic, died young. Not controversial, but her *commemoration* isn't about her entire biography.  
          *   **Exercise:** *"If we name a street after Lovelace, are we saying she was perfect? Are we responsible for documenting her entire life? Or are we saying 'We value her contribution to computing today'?"*  
          *   **Whiteboard:** Split Lovelace: Left (Commemoration: Innovation, Women in STEM) / Right (Documentation: Aristocrat, Early Death, Broader Life Context).

  3.  **Preempting Misconceptions (Built into the Flow)**  
      *(Sequence is critical to head-off objections before they form)*

      | Misconception                     | When/How to Preempt                                                                 | Academic Consensus/Contested?                          |
      | :-------------------------------- | :---------------------------------------------------------------------------------- | :----------------------------------------------------- |
      | **"Removing a name erases history"** | **During Groundwork:** "Does changing a street name *delete* Ada Lovelace from history books? No. We stop *honoring* in this specific way. History lives elsewhere." Link to Documentation column. | **Consensus:** De-naming ≠ erasure. Contested: *Impact* of de-naming on public memory. |
      | **"Can't judge by today's standards"** | **After Load-Bearing Bolt:** "Commemoration *isn't judgment* of the past! It's a *present* act. We're not saying 'They were bad for their time,' we're saying 'Does this act reflect *our* values *now*?'" (Whiteboard: PRESENT gift). | **Contested:** The *extent* to which historical context *should* inform present commemoration. |
      | **"Net good vs. harm"**           | **During Clean Example:** "Commemoration isn't a balance sheet! We don't ask 'Did Ada Lovelace do more good than harm?' We ask 'Is *this specific contribution* something we want to *celebrate prominently* today?'" | **Contested:** Whether "net good" is a valid criterion *for commemoration* (vs. documentation). |
      | **"Just add a plaque"**           | **Introduce as SOLUTION:** "Ah! This *bridges* the distinction! **The plaque handles *documentation*.** The *name* handles *commemoration*. They serve different purposes. Is this the right compromise *here*? That's our future work." **(This is the reasonable position)** | **Consensus:** Plaques are documentation tools. Contested: Their sufficiency/effectiveness. |
      | **"It's just a GPS address"**     | **Start of Session:** Use their MLK answers! "If it's *just* an address, why did people mention 'justice' or 'hope'? Names carry meaning *because we give it to them*. Our job is being intentional about that meaning." | **Consensus:** Names *can* hold meaning. Contested: How *much* meaning they hold for the public. |

  4.  **The Test Question (5 min - End)**  
      *   **Pose:** *"Imagine we have 'Lincoln Avenue,' named decades ago solely to honor emancipation. Newly discovered documents prove Lincoln privately opposed emancipation until the last moment, solely for political strategy. Does renaming the avenue 'erase history'? Why or why not?"*  
      *   **Why it works:**  
          *   Memorizer: "No, because history is documented elsewhere." (Shallow).  
          *   **Gets It:** "Renaming isn't about erasing the *history* of Lincoln or emancipation. It's questioning whether *commemorating Lincoln via this avenue* still aligns with our values, given the *specific reason it was named*. The history remains; the *honor* might change." (Deep, applies the distinction).

  5.  **What to REFUSE (Say This Aloud - 5 min)**  
      *   *"Today, we are NOT:*  
          *   *Discussing the specific history of our upcoming case.*  
          *   *Debating the merits of any individual (past or present).*  
          *   *Setting fixed criteria for 'worthiness.'*  
      *   *We're building one essential tool: understanding **what kind of act naming is**. This is the lens we'll use for every case."*

  ---

  ### **Academic Transparency Flags**
  *   **Settled Consensus:**  
      *   Commemorative naming is a present-tense act of public honor/value-signaling, distinct from historical documentation.  
      *   Removing a commemorative name does not, in itself, erase historical knowledge.  
      *   Plaques/explanatory signs are primarily tools for documentation/context.  
  *   **Live, Heated Arguments:**  
      *   **"Presentism" Debate:** *How much* should historical context shield figures from contemporary re-evaluation of commemoration? (Your engineer's era's norms vs. our values).  
      *   **The "Net Good" Question:** Is it ever valid to argue that overwhelming positive contributions *should* outweigh significant harms *for commemorative purposes*? (Directly impacts your engineer case).  
      *   **Who Decides?:** Is commemoration best decided by experts, affected communities, elected officials, or popular vote? (Underlies all public history fights).  
      *   **The "GPS Argument":** Does the *ubiquity* of a name actually drain it of meaning over time, making disputes irrelevant? (Empirical question, hard to measure).  
      *   **Threshold of Harm:** What level of documented harm (e.g., racism, exploitation) *automatically* disqualifies commemoration, regardless of era? (See Confederate monument debates).  

  **Crucially Tell Them:** *"Scholars debate *how* to apply these concepts, especially balancing historical context against present values. Our job isn't to resolve academic debates, but to recognize when we're facing a commemoration question vs. a documentation question. That clarity alone will cut through 80% of the noise at hearings."*

  ---

  **Why This Works:**  
  1.  **Avoids Your Live Landmine:** Lovelace provides safe complexity.  
  2.  **Preemptive Strikes:** Targets misconceptions *before* they root, using the distinction itself as the antidote.  
  3.  **Clarifies "The Plaque":** Positions it as the *reasonable* bridge, not a misconception.  
  4.  **Test Question:** Reveals memorization vs. internalization.  
  5.  **Explicit Boundaries:** Prevents rabbit holes and builds trust.  
  6.  **Academic Honesty:** Flags where consensus ends and contentious judgment calls begin (especially vital for your engineer case later).  

  Focus relentlessly on the **"Present Act of Honor" vs. "Record of the Past"** split. If they grasp only that, your orientation succeeded. Good luck, Commissioner.
