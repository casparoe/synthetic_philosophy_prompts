prompt: |-
  I direct design-ethics review at a mid-sized nonprofit that runs two lines of work: patient-engagement programs for chronic conditions, funded largely by public health grants, and a donor communications team. About eight submissions a month reach me: an SMS reminder sequence, a chatbot script, a default setting in the patient portal, an email appeal. I have two hours per submission, my two reviewers are a behavioral scientist and a former clinic operations manager, neither of whom has studied philosophy, sign-off is mine, and general counsel and the chief medical officer review my decisions quarterly rather than case by case. Legal exposure is not the problem. Everything we send is already truthful in the narrow sense and cleared by privacy counsel and our marketing rules. The problem is that our current internal test is two questions — is the claim true, and can the recipient opt out — and it passes nearly everything, including artifacts that our own clinicians find distasteful and could not explain why.

  I want that replaced with a decision procedure my reviewers can run without me in the room: an ordered set of questions about a concrete artifact, what counts as a sufficient answer to each, the point at which a submission is returned with a no rather than sent back for revision, and the point at which the procedure stops producing an answer and hands the question to a human because what remains is a contest over whose ends are being served rather than a fact that can be established. Ground it in whatever the work on manipulation and legitimate persuasion offers that is actually usable: the difference between giving someone reasons and influencing them through channels that do not engage their capacity to assess reasons; the tests people have proposed for whether a technique would still work if its mechanism were disclosed to the person it works on; and the distinction between helping someone reach an end they already endorse and steering them toward an end that is ours. But state it as questions a non-specialist can answer about a screen, a script, or a mailing, not as a survey of positions. You do not need to cite or attribute anything; I need the distinctions, not the references. Where a step is a judgment call dressed as procedure, say so explicitly and say what the judgment consists in. Build in the asymmetry of our errors: a false negative means we deploy something that quietly degrades trust in a population we serve for years, and a false positive means we forgo a several-point gain in uptake on a screening program that prevents deaths.

  Then run the procedure on three live submissions and report the answer each step yields, the final verdict, and, wherever the verdict turns on a judgment call, what fact or framing change would flip it.

  First: patients who take no action in the portal are enrolled into a booked flu-shot appointment and receive an SMS telling them the appointment is reserved for them and that they may cancel by replying at any time. Cancellation is one tap. The reserved framing was adopted because it produced a nine-point uplift over a neutral reminder in a pilot.

  Second: an adherence coach for type 2 diabetes medication. The script is deliberately client-led. It asks patients to state their own reasons for wanting to stay well, reflects their own words back, and asks them to rate and articulate a commitment to a plan they themselves propose. It asserts nothing, presents no statistic, and lets the patient set the tone. We regard this as our most respectful intervention and expect it to pass cleanly.

  Third: a mailed reminder for colorectal cancer screening stating that 12 of every 100 people with the recipient's diagnosis who went untreated were hospitalized within a year. The figure is accurate for our catchment population and comes from the registry; no corresponding figure for treated patients is offered. A calmer sentence conveying the same absolute risk was available and was rejected after testing. We expect this one to fail.

  If the procedure does not rank them the way we do, identify precisely which step produced the divergence and whether the step or our expectation is at fault. Finally, tell me what the procedure cannot do: the classes of submissions it will systematically misjudge, which way it errs, how reviewers will drift once they have run it forty times, and what to do about that drift.

  Lead with your bottom line in the first sentence, including your three verdicts, then give the procedure and the worked applications. No preamble and no restating of the question.
reasoning: |-
  Okay, the user directs design-ethics reviews at a nonprofit focused on patient engagement and donor communications. They need a practical decision procedure to replace their current inadequate two-question test. The key requirements are: an ordered checklist usable by non-philosophers, grounded in manipulation/persuasion theory but operationalized for concrete artifacts, with explicit judgment calls flagged, and error asymmetry built-in (false negatives harm trust more than false positives cost lives).

  Hmm, the user's frustration is palpable - their current system passes everything despite clinician discomfort, and they need something that catches "truthful but distasteful" designs. The asymmetry point is critical: erring toward rejection only sacrifices program efficiency, while erring toward approval risks long-term erosion of patient trust. 

  For the procedure itself, I'll structure it as a funnel: start with low-judgment factual checks (truthfulness, opt-out), then move to higher-judgment ethical dimensions (reason-giving vs. non-reason influence, hidden mechanisms, end alignment). The "judgment call" steps need special handling - like Step 3 where reviewers must assess if the mechanism would collapse if disclosed. I'll explicitly say "this is where you exercise ethical judgment about transparency."

  The three test cases are perfect for stress-testing:
  - The flu-shot SMS seems manipulative with its "reserved" framing that boosted uptake. But is it merely convenient or actually deceptive? The procedure should flag Step 3 (disclosure test) as the breaking point.
  - The diabetes script passes cleanly - it's pure reason-engagement with patient-set goals. Interesting that the user expects this to pass; it validates the procedure.
  - The cancer screening mailer fails at Step 4 (end alignment) - using untreated stats without context steers toward the org's screening goal rather than supporting informed choice. The user anticipated this failure.

  Ah, the limitations section is crucial. The procedure will struggle with:
  - Emotionally charged health contexts (e.g., end-of-life care) where "reason-giving" looks different
  - Cultural differences in persuasion norms
  - Reviewer drift toward stricter interpretations over time - hence the monthly calibration meetings suggestion

  Notably, the user doesn't want academic citations - just actionable distinctions. I'll avoid terms like "nudge" or "autonomy" and stick to plain language: "Does this engage their thinking?" rather than "Does this respect agency?"

  The bottom-line verdicts come first as requested: pass for the diabetes script, conditional pass for the flu-shot SMS (with revision), and hard fail for the cancer mailer. The flu-shot case gets a "conditional pass" because the opt-out is genuinely easy - but the framing needs transparency to avoid feeling like a trap.
answer: |-
  **Bottom line:** Diabetes script passes; flu-shot SMS requires revision (remove "reserved"); cancer mailer fails.  

  ---

  ### Decision Procedure: Ethical Influence Assessment  
  *(Run sequentially; stop and return/revise at first "No" or "Conditional/Revise")*  

  1.  **Truth & Transparency:**  
      *   *Question:* Is every factual claim accurate, unambiguous, and presented in the most directly understandable context available?  
      *   *Sufficient Answer:* "Yes" = Claims are verified, not misleading by omission (e.g., absolute risk presented without undue alarmism, key comparisons included if critical to interpretation). "No" or "Unclear" = Return for revision or fail.  
      *   *Judgment Call?* **Yes.** Judgment: Does omission or framing create a *significantly* distorted impression a reasonable person would rely on? (Prioritize clarity over brevity if risk is involved).  

  2.  **Effortless Opt-Out:**  
      *   *Question:* Can the recipient *permanently* stop this specific interaction *at this moment* with minimal effort (≤ 2 taps/clicks, no complex menus, clear language)?  
      *   *Sufficient Answer:* "Yes" = Explicit, immediate, low-friction opt-out present. "No" = Fail/Return.  

  3.  **Mechanism Disclosure Test:**  
      *   *Question:* If the *exact* influence technique used (e.g., "calling it 'reserved' makes you feel obligated", "showing untreated risk only increases fear") were prominently disclosed *to the recipient* upfront, would the technique likely *stop working*?  
      *   *Sufficient Answer:* "No" = Technique is robust to disclosure (e.g., clear reason-giving, simple reminders). "Yes" = Relies on hidden pressure; Revise/Fail. "Unsure" = Proceed but flag for Step 4.  
      *   *Judgment Call?* **Yes.** Judgment: Is the core mechanism *dependent* on the recipient *not* understanding how it works? (Focus on the primary driver of compliance).  

  4.  **End Alignment:**  
      *   *Question:* Does the artifact *primarily* help the recipient act on *their own* clearly stated goal/need, using facts and reasons relevant to *that* goal? (Avoid: primarily advancing *our* goal by triggering non-deliberative responses).  
      *   *Sufficient Answer:* "Yes" = Directly supports recipient's known health goal (e.g., managing *their* diabetes). "No" = Primarily drives *our* target metric (e.g., screening uptake) using non-reason mechanisms. "Mixed" = Revise to strengthen reason-giving/weaken pressure.  
      *   *Judgment Call?* **Yes.** Judgment: Whose primary interest is being served – the recipient's autonomy over their health goal, or our program's success metric? (False Negative cost > False Positive cost).  

  **Handoff:** Stop procedure and escalate to human (you) if Steps 3 or 4 yield "Unsure" or "Mixed" after revision attempts, indicating a fundamental conflict over ends or acceptable means.  

  ---

  ### Application to Submissions  

  **1. Flu-Shot SMS (Reserved Appointment)**  
      *   Step 1: **Yes.** Claim "appointment reserved" is true; cancellation ease stated.  
      *   Step 2: **Yes.** One-tap cancellation is sufficient.  
      *   Step 3: **Conditional/Revise (Judgment Call).** If disclosed ("We call it 'reserved' to make you feel committed"), the technique likely *stops working*. It exploits a sense of imposed obligation/social pressure, not reason. **VERDICT: REVISE** (Remove "reserved"; use neutral framing: "An appointment is *available/scheduled* for you..."). *Flip to Pass:* If testing showed uplift persisted *even with explicit disclosure* of the "reserved" tactic.  

  **2. Diabetes Adherence Coach Script**  
      *   Step 1: **Yes.** No factual claims made.  
      *   Step 2: **N/A** (Not a broadcast; ongoing interaction implies ability to disengage).  
      *   Step 3: **No.** Disclosing ("We reflect your words to help you articulate your own goals") wouldn't stop it working; it *relies* on reason/reflection.  
      *   Step 4: **Yes.** Directly supports patient's stated goal ("stay well") using their own reasoning/commitment.  
      **VERDICT: PASS**  

  **3. Colorectal Cancer Screening Mailer (12/100 Untreated Hospitalization)**  
      *   Step 1: **Conditional/Revise (Judgment Call).** Claim is literally true but omits context critical for interpretation (treated risk rate). Presents absolute risk in a high-alarm frame (untreated only) chosen *because* it increased response over calmer framing. Creates distorted impression of urgency/inevitability without context. **VERDICT: FAIL** *Flip to Pass?* Only if revised to include treated risk/equivalent context or use the calmer, less manipulative absolute risk framing.  
      *(Procedure stopped at Step 1; subsequent steps not needed for verdict but illustrative:)*  
      *   Step 2: Likely **Yes** (Can opt-out of mailings).  
      *   Step 3: **Yes.** Disclosing ("We show only untreated risk to scare you into acting") would likely stop it working.  
      *   Step 4: **No.** Primarily drives *our* screening uptake goal by leveraging fear/alarm (non-reason mechanism), not supporting a patient-articulated goal with balanced facts.  

  **Divergence:** Cancer mailer failed at Step 1 (vs. user expectation), due to judgment on misleading omission/framing. Step 1 judgment correctly prioritizes preventing distorted impressions (false negative cost). Flu-shot passed Step 2 but failed Step 3, aligning with user's distaste.  

  ---

  ### What the Procedure Cannot Do & Mitigations  

  1.  **Misjudges Culturally Specific Persuasion:** May flag respectful cultural norms (e.g., communal framing) as manipulative ("disclosure test fails") or miss subtle coercion within accepted norms. *Mitigation:* Escalate culturally sensitive cases; involve diverse reviewers periodically.  
  2.  **Errs Toward Caution (False Positives):** Inherent due to error asymmetry. Will reject some effective tactics that operate near the manipulation line but might be acceptable upon deeper review (e.g., certain loss aversion frames). *Mitigation:* Your quarterly review with leadership recalibrates borderline cases.  
  3.  **Blind to Cumulative Effects:** Judges artifacts in isolation. A series of individually "passing" nudges could overwhelm autonomy. *Mitigation:* Quarterly reviews explicitly assess patterns across submissions.  
  4.  **Reviewer Drift:** After ~40 reviews, drift likely:  
      *   *Direction:* Toward **stricter** interpretation (especially Steps 3 & 4), amplifying false positives. Fatigue may cause under-scrutiny of "similar" submissions.  
      *   *Cause:* Over-application of precedents, heightened sensitivity to manipulation cues, desensitization to opt-out ease.  
      *   *Mitigation:* **Monthly calibration:** You + reviewers re-run 1-2 past submissions (including some initially passed/failed borderline cases) and discuss reasoning. Track time-to-decision; significant drops may indicate under-scrutiny. Rotate reviewers periodically if possible.  

