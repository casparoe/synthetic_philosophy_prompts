answer: |-
  ## Fellowship Proposal: Reconstructing Agency and Epistemology in Aquinas on Tyrannicide

  **Project Title:** Beyond Permission and Prohibition: Agency, Epistemology, and the Practical Impossibility of Tyrannicide in Aquinas's Political Thought

  **Core Research Question:** How does Aquinas’s mature treatment of resistance to tyranny (focusing on *De Regno* and the *Summa Theologiae*) utilize criteria of *legitimate agency* (standing) and *epistemic limitations* to construct a framework that renders tyrannicide practically impossible, despite apparent conditional permissions?

  **Why this Question?** Existing dominant readings (developmental; usurper vs. exercise) leave crucial elements unresolved:
  1.  **The Agency Gap:** They inadequately address *who*, precisely, possesses the authority/standing to judge and act against a tyrant (the community? individuals? a superior?).
  2.  **The Epistemic Gap:** They underplay Aquinas’s profound skepticism regarding human capacity to reliably judge the tyrant's *intent*, foresee the *consequences* of removal (especially the risk of worse outcomes), and ensure the *purity of motive* of the actor(s). These conditions are presented not merely as prudential concerns but as constitutive elements of the licitness of the act.
  3.  **The Function of "Wait for God":** They treat it as pious resignation or filler, rather than recognizing it as the logical *consequence* of these stringent agency and epistemic conditions failing to be met by any human actor. It becomes the *only* permissible course when human judgment and agency are deemed insufficient.

  This project argues that the apparent inconsistency between the permissive-sounding *Sentences* commentary and the restrictive mature works dissolves when viewed through the lens of evolving criteria for *legitimate agency* and *insurmountable epistemic barriers*. The mature position is not merely cautious; it strategically deploys these conditions to render tyrannicide effectively non-viable as a licit human action, constituting a "prohibition in permission's clothes." The "wait for God" injunction is the capstone of this argument.

  **Methodology & Work Plan (10 Weeks):**

  *   **Weeks 1-2: Foundational Textual Mapping & Schema Development:**
      *   Close re-reading of key texts: *Sent.* II d.44 q.2 a.2; *De Regno* I, ch. 6-7; *ST* II-II q.10 a.8 (heresy), q.12 a.2 (apostasy), **q.42 a.2 (sedition & ad 3)**, q.64 a.2-3 (homicide/self-defense), q.104 a.6 (obedience).
      *   Develop preliminary numbered argument schemas for each text, explicitly isolating propositions concerning:
          *   Legitimate Authority/Judging Power (Who can *decide* tyranny exists/requires removal?)
          *   Legitimate Acting Power (Who can *execute* the judgment/removal?)
          *   Epistemic Conditions (Knowledge of tyranny's nature/degree, certainty of motive, foresight of consequences).
          *   Conditions for Action (Harm threshold, last resort, proportionality, etc.).
  *   **Week 3: Schema Integration & Core Hypothesis Refinement:**
      *   Synthesize schemas across mature texts (*De Regno*, *ST*).
      *   Map evolution from *Sentences* schema.
      *   Formally articulate the "agency-epistemology barrier" hypothesis: How do combined agency rules and epistemic demands create insurmountable practical obstacles?
      *   **Define Key Test Cases:** Identify the specific scenarios the reconstruction *must* explain to be viable.
  *   **Weeks 4-5: Applying the Framework to Core Test Cases:**
      *   Systematically apply the integrated schema to:
          1.  **Usurper (No Title):** Does agency/epistemology offer a *practically viable* path for removal, or do epistemic barriers (foreseeing chaos, ensuring successor's virtue) still dominate?
          2.  **Legitimate Ruler, Moderate Tyranny of Exercise:** How do agency limitations (who judges? who acts?) and epistemic uncertainty (is it truly intolerable? will removal improve things?) interact to preclude action?
          3.  **Legitimate Ruler, Extreme Tyranny of Exercise:** Do agency/epistemology barriers *still* hold, or is there a breaking point? If so, *who* can act and *how* can they know?
          4.  **Community-Appointed Ruler vs. Subject to Superior Power:** How does the source of authority impact the identification of legitimate agents (community vs. superior)?
          5.  **Outright Invader:** Does this map onto usurper, or involve distinct agency rules (e.g., self-defense by individuals/community)?
          6.  **Individual Self-Defense against Tyrant:** Analyze via *ST* II-II q.64 a.7 – how do its principles (immediacy, proportionality) limit applicability to systemic tyranny?
      *   *Focus: Does the agency/epistemology framework provide a more consistent, textually grounded explanation than the usurper/exercise distinction?*
  *   **Week 6: Confronting the Sedition Objection (Named Objection: The Harm Comparison Challenge):**
      *   **The Objection:** *ST* II-II q.42 a.2 ad 3 explicitly states disturbing a tyrant is *not* sedition if the resulting disorder harms subjects *less* than the tyranny. This appears to be a straightforward utilitarian harm calculus, directly contradicting the thesis that agency/epistemology barriers are primary and prohibitive.
      *   **Plan for Resolution:**
          1.  **Contextual Placement:** Analyze the objection *within the entire structure* of the sedition article and Aquinas's treatment of tyranny. It is an *exception* to the definition of sedition, not a positive command.
          2.  **Relation to Agency/Epistemology:** Argue this harm comparison is a *necessary but insufficient* condition. It removes the *label* of sedition (a sin against charity/order), but does *not* automatically confer *licence* or identify *legitimate agents*. The act may avoid being sinful *as sedition*, but its licitness *as tyrannicide* still depends on meeting the stringent agency (who acts? by what authority?) and epistemic (foreseeing *net* lesser harm, ensuring pure motive) conditions outlined elsewhere. The harm threshold prevents an act from being *doubly* sinful (tyrannicide + sedition), but doesn't resolve the fundamental barriers to licit tyrannicide itself.
          3.  **Epistemic Burden:** Emphasize the immense difficulty of *knowing* with certainty that condition ("less harm") will be fulfilled – tying it back to the core epistemic barriers.
  *   **Week 7: Synthesis & Refining the "Prohibition in Permission's Clothes" Argument:**
      *   Integrate findings from test cases and resolution of the sedition objection.
      *   Articulate precisely how agency rules and epistemic barriers combine to create practical impossibility.
      *   Explain the functional role of "waiting for God" as the consequence of unmet agency/epistemology conditions.
      *   Contrast this reconstruction with developmental and usurper/exercise models.
  *   **Week 8: Drafting Conference Paper:**
      *   Structure: Introduction (existing interpretations & gaps); Core Thesis (Agency/Epistemology framework); Textual Analysis (Schema application); Test Cases & Objection Handling (incl. Sedition); Conclusion (Implications: "prohibition in permission's clothes").
  *   **Week 9: Drafting Chapter Outline & Key Sections:**
      *   Expand conference paper into detailed chapter structure (PhD dissertation).
      *   Draft key sections, especially the core theoretical framework and sedition objection resolution.
  *   **Week 10: Revision, Integration, & Future Work Plan:**
      *   Revise conference paper draft.
      *   Refine chapter draft sections.
      *   Outline clear next steps for dissertation research (e.g., comparative analysis with later medieval thinkers, deeper dive into Aquinas's epistemology).

  **Realistic Scoping & Prioritization:**

  *   **Too Big for 10 Weeks?** Absolutely. Key cuts:
      1.  **Limit Test Cases:** Prioritize **Usurper (No Title)**, **Legitimate Ruler/Extreme Tyranny**, and **The Sedition Objection Case** as the most critical. De-emphasize Moderate Tyranny and Superior Power scenarios unless time permits. Self-Defense is crucial but can be treated concisely by linking to q.64 a.7 principles.
      2.  **Depth over Breadth:** Focus intensely on *De Regno*, *ST* II-II q.42 a.2, q.64, q.104, and the *Sentences* passage. Don't try to incorporate every minor reference.
      3.  **Postpone Comparison:** The "vs. Early Modern" hook is motivating, but detailed comparison belongs in the dissertation, not this 10-week project. Mention briefly in intro/conclusion as context/future work.
      4.  **Chapter Draft = Detailed Outline + Key Sections:** Don't aim for a full polished chapter. Produce a robust outline with 2-3 core sections drafted in depth (likely the framework and the sedition response).
  *   **Core Focus:** The success hinges on the textual analysis of the mature works through the agency/epistemology lens and the persuasive resolution of the sedition objection.

  **Criteria for Success/Failure:**

  *   **Success:** The project succeeds if it can:
      1.  Demonstrate that agency (standing) and epistemic conditions are consistently *structurally central* and *operationally stringent* in Aquinas's mature discussions of tyranny.
      2.  Show how these conditions, taken together, create a high (arguably insurmountable) barrier to licit tyrannicide.
      3.  Provide a textually plausible and logically coherent interpretation of *ST* II-II q.42 a.2 ad 3 (the sedition exception) that integrates with, rather than fatally undermines, the agency/epistemology framework.
      4.  Articulate the "wait for God" position as the *consequence* of unmet agency/epistemology conditions.
      5.  Show that this framework resolves tensions between key texts more effectively than existing models.
  *   **Failure:** The project fails if:
      1.  Close reading reveals that agency/epistemology concerns are marginal or easily satisfiable in Aquinas's core texts.
      2.  The framework cannot coherently handle the **Legitimate Ruler/Extreme Tyranny** case or the **Sedition Exception**.
      3.  The "wait for God" injunction appears fundamentally disconnected from the agency/epistemology conditions.
      4.  The usurper/exercise distinction proves more textually exhaustive and consistent.
      5.  The sedition objection definitively shows Aquinas *primarily* relies on a straightforward harm calculus accessible to individual judgment.

  **Conclusion:** This project offers a novel and textually grounded reinterpretation of Aquinas on tyrannicide by shifting focus from the abstract permissibility of the *act* to the concrete conditions governing the *actor* and their *knowledge*. By reconstructing Aquinas's stringent requirements for legitimate agency and overcoming profound epistemic barriers, it argues his mature position functions as a practical prohibition disguised within conditional language. Successfully addressing the sedition objection is paramount to this argument's viability. This research promises significant contributions to understanding medieval political thought, resistance theory, and the interplay between authority, knowledge, and political action in Aquinas. The ten-week scope is challenging but achievable with focused analysis on core texts and prioritized test cases, laying essential groundwork for the dissertation.
