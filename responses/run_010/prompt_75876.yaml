  ### Decision Tree: Navigating Fairness Claims in Risk Assessment

  Start from the headline: **"Fairness is mathematically impossible in risk scores due to unequal base rates."** You accept this claim. The tree helps you discover your underlying fairness position through concrete scenarios and trade-offs.

  ---

  #### **Node 1: Base Rates and Injustice**  
  A recidivism tool is used in two groups:  
  - **Group A**: 50% base rate (high risk)  
  - **Group B**: 10% base rate (low risk)  
  The score is calibrated (e.g., 70% score = 70% reoffend in both groups).  
  *Do unequal base rates themselves represent injustice?*  
  - **Yes** → Proceed to **Node 2**  
  - **No** → Proceed to **Node 3**  

  #### **Node 2: Inherited Injustice**  
  If base rates are unjust, should the score ignore them?  
  - **Yes** → Proceed to **Node 4**  
  - **No** → Proceed to **Node 5**  

  #### **Node 3: The Score vs. Decision**  
  The score is calibrated but leads to unequal outcomes. What’s unfair?  
  - **The score** (it reflects base rates) → Proceed to **Node 4**  
  - **The decision** (how we use the score) → Proceed to **Node 6**  

  #### **Node 4: Accuracy Trade-off**  
  To ignore base rates, we rebuild the score. In trials:  
  - **Version 1**: 85% accurate, but base rates still affect outcomes.  
  - **Version 2**: 70% accurate, but outcomes are more equal.  
  *Which is preferable?*  
  - **Version 1** (accuracy priority) → **Leaf: Calibration-only**  
  - **Version 2** (equality priority) → **Leaf: Demographic Parity**  

  #### **Node 5: Group-Specific Thresholds**  
  Should Group B (10% base rate) use a higher threshold to avoid jailing innocents?  
  - **Yes** → Proceed to **Node 7**  
  - **No** → Proceed to **Node 8**  

  #### **Node 6: Decision Threshold Adjustment**  
  Using the calibrated score:  
  - **Option 1**: Same threshold → More false positives in Group B.  
  - **Option 2**: Group-specific thresholds → Fewer false positives in Group B.  
  *Which is fairer?*  
  - **Option 1** → **Leaf: Calibration-only**  
  - **Option 2** → Proceed to **Node 9**  

  #### **Node 7: Changing Accuracy**  
  With group-specific thresholds:  
  - Group B’s threshold reduces false positives but increases false negatives (more high-risk released).  
  *Is this trade-off acceptable?*  
  - **Yes** → **Leaf: Equalised Odds**  
  - **No** → **Leaf: Deflationary (Political Choice)**  

  #### **Node 8: Alternative Solutions**  
  If not thresholds, how achieve fairness?  
  - **Remove group data** → **Leaf: Fairness Through Unawareness**  
  - **Judge individuals identically** → **Leaf: Individual Fairness**  

  #### **Node 9: Equal Outcomes**  
  Group-specific thresholds equalize error rates, but Group B has fewer people detained overall.  
  *Should we force equal detention rates?*  
  - **Yes** → **Leaf: Demographic Parity**  
  - **No** → **Leaf: Equalised Odds**  

  #### **Node 10: Similar Individuals**  
  Two people (same crime history, different groups) get different scores due to base rates.  
  *Is this fair?*  
  - **Yes** (scores reflect group risk) → Proceed to **Node 11**  
  - **No** (fairness = individual traits) → **Leaf: Individual Fairness**  

  #### **Node 11: Statistical vs. Moral Fairness**  
  The score meets statistical criteria (calibration, equal error rates).  
  *Is this sufficient for fairness?*  
  - **Yes** → **Leaf: Calibration-only** or **Equalised Odds** (depends on path)  
  - **No** → **Leaf: Deflationary (Political Choice)**  

  ---

  ### Leaves (Positions)
  1. **Calibration-only**: The score must reflect reality; unequal outcomes stem from base rates.  
  2. **Equalised Odds**: Equal error rates (FPR/FNR) across groups are required, even with accuracy trade-offs.  
  3. **Demographic Parity**: Decisions must have equal outcomes (detention rates), even if scores change.  
  4. **Fairness Through Unawareness**: Exclude group data to force "blind" assessments.  
  5. **Individual Fairness**: Similar individuals should receive similar scores/decisions, ignoring groups.  
  6. **Deflationary**: No statistical criterion is sufficient; fairness is a political choice.  

  ---

  ### Unoccupied Combinations & Reasoning  
  The tree covers 12 combinations (nodes × branches). Three cells are unoccupied:  
  1. **"Base rates unjust" + "Reject group thresholds" + "Force equal outcomes"**:  
     - **Empty** (incoherent). If base rates are unjust, forcing equal outcomes (demographic parity) contradicts rejecting thresholds (which enable it).  
  2. **"Decision-focused" + "Reject group thresholds" + "Ignore base rates"**:  
     - **Empty** (unattractive). Prioritizing decisions but rejecting thresholds and ignoring base rates leads to inconsistent outcomes (e.g., high false positives in Group B).  
  3. **"Score-focused" + "Accept group thresholds"**:  
     - **Empty** (unexplored). If the score is the problem, group thresholds don’t resolve its inherent bias.  

  ---

  ### Leaf Separation & Confidence  
  - **Indistinguishable Pair**: **Calibration-only** and **Equalised Odds** overlap if "statistical fairness suffices" (**Node 11**). The tree separates them via group thresholds (**Node 5/6**), but a reader could conflate calibration with error-rate equality.  
  - **Confidence in Leaves**:  
    - High: Deflationary, Demographic Parity, Individual Fairness (paths are distinct).  
    - Medium: Calibration-only, Equalised Odds (dependent on threshold/accuracy trade-offs).  
    - Low: Fairness Through Unawareness (readers may confuse it with Individual Fairness).  
  - **Least Confident Step**: **Node 3 (Score vs. Decision)**. Readers may not distinguish the object (score vs. decision), leading accidental jumps to "Calibration-only" or "Equalised Odds" without exploring trade-offs.  

  ---  
  This tree reveals how fairness positions hinge on: (1) whether base rates are unjust, (2) tolerance for accuracy trade-offs, (3) acceptance of group-specific rules, and (4) the role of statistical criteria vs. values. The numerical cases (Nodes 4/6) force clarity on trade-offs, while unoccupied cells highlight logical gaps.
