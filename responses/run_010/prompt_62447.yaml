prompt: |-
  Act as a scholar of mid-century Oxford moral philosophy with a real grip on Anscombe — a colleague, not a textbook summary. Brainstorm out loud for a few lines first, then commit to a view. I'm running a seminar where we read her Truman pamphlet, and I want to drag the argument into the present with a case she never saw. Here it is: a state's drone program runs "signature strikes," targets picked out not by name but by a pattern of behaviour that reads as militant, and for casualty accounting every military-age male in the strike zone is counted as a combatant unless intelligence later proves he wasn't. Nobody wants the civilian deaths, the lawyers have signed off on proportionallity, and the operators do try to keep the numbers down.

  So what does Anscombe make of this? Work through it carefully and tell me exactly where in that description her objecion bites. My students will say the double-effect reply settles the matter and I need to be able to say why it doesn't — or say precisely how far it does go. She was no pacifist and she didn't think every foreseen death of a non-combatant was murder, so what is going wrong here that wouldn't be going wrong in a strike on a munitions plant where the workers get killed? Then check something for me: does her reasoning about deterrence — I vaguely remember it turning on conditional intentions, but I'm fuzzy on the details — hand her a second and separate objection, aimed at the list-making rather than at the strikes?

  Last thing, and it's the part I most need: two places she'd surprise the room. They'll walk in expecting her to object to the technology, or to war as such. Show me where she cuts against that expectation, and one place where I think their instinct turns out to be right.
reasoning: |-
  Okay, the user is role-playing as a mid-century Oxford scholar, deeply familiar with Anscombe's work, and preparing a seminar on her Truman pamphlet. They want to apply her arguments to modern drone warfare, specifically "signature strikes" and casualty accounting practices. 

  First, I need to unpack the core ethical dilemma: targeting based on behavioral patterns rather than identification, and post-strike classification of military-age males as combatants by default. The user explicitly wants to dismantle the double-effect defense students will likely raise, and also explore if Anscombe's deterrence arguments apply to the casualty accounting method.

  Hmm... Anscombe's absolute prohibition on targeting innocents is key here. Signature strikes blur the distinction between combatant and non-combatant by design - the "pattern of behavior" criterion is probabilistically militarist, not individuated. That's crucially different from her munitions factory example where workers are legitimate secondary targets (contributing to the war machine). The default combatant classification after strikes feels like retrospective justification - exactly the kind of dishonest calculation she denounced in the Truman pamphlet.

  Ah! And the deterrence angle! The user's fuzzy memory is correct - Anscombe rejected conditional intentions ("we'll nuke if attacked") because the conditionality doesn't purify the immoral intent. Translating that to casualty accounting: presuming guilt unless proven innocent constitutes a prior conditional intention to misclassify civilians. That's structurally similar to her deterrence critique - both involve pre-deciding immoral acts under certain conditions.

  For surprises... *chuckles* The students will expect technophobia or pacifism, but Anscombe was ruthlessly logical. Her objection isn't to drones per se (she'd likely prefer precise machines over area bombing), but to the targeting logic. And they'll be shocked she'd accept munitions workers as legitimate targets! But their instinct about her hating bureaucratic euphemism ("combatant" labels) is spot-on - she'd smell the same linguistic corruption as in "targeting military objectives with unavoidable collateral damage."

  Better emphasize how this case inverts just war principles: instead of minimizing civilian harm as the exception, the methodology makes civilian status the exception. That turns intention on its head - and for Anscombe, intention is everything. The lawyers' proportionality sign-off would make her livid; she thought proportionality couldn't sanitize intrinsic evil.

  ...Must remember to quote her scathing line about "licensing evil so long as it's calculated" from the pamphlet. That's the knockout punch for the double-effect defense.
answer: |-
  Right then, let's have a proper think about this. Anscombe on drone strikes... fascinating application. One must avoid the temptation to force her into pre-packaged boxes. She was ferociously logical, deeply Augustinian, and allergic to consequentialist sophistry. That Truman pamphlet – *Mr. Truman's Degree* – wasn't just about the bomb; it was a scalpel dissecting the moral corruption of modern warfare and the language that enables it.

  **Brainstorming Out Loud:**
  1.  **Core Sin:** For Anscombe, the absolute prohibition is on *intentionally killing the innocent*. "Innocent" here meaning non-combatants – those not materially cooperating in the *unjust* force (her emphasis on *unjust* is vital; a just combatant isn't innocent in her sense). This isn't pacifism; it's about the object of the act.
  2.  **Double Effect (DE):** It's *not* a magic wand. It requires: a) The act itself must be good or indifferent (like bombing a legitimate military target). b) The bad effect (civilian death) must not be intended, either as end or means. c) The good effect must follow from the act itself, not from the bad effect. d) There must be proportionate reason for permitting the bad effect. The *intention* is paramount. Foreseeing isn't intending, but...
  3.  **The Munitions Plant:** Why might that pass DE? The *act* is destroying a war-factory (legitimate target). The deaths of the workers are a *foreseen but unintended* side-effect. They aren't *chosen* as a means to destroy the factory; destroying the factory *causes* their death incidentally. Their deaths aren't *how* you destroy the factory. Proportion is assessed: Is the military gain sufficient to *permit* this foreseen evil?
  4.  **Signature Strikes & Casualty Accounting – The Rot Sets In:**
      *   **Targeting by Pattern:** This immediately smells. Who precisely is being targeted? Not an individual combatant or a specific, identifiable military structure. It's a *class* of people exhibiting "militant" behaviour. The *intention* is to kill *whoever fits that pattern*. The pattern *defines* the target. But patterns are probabilistic. The *intention* is to kill based on suspicion, not knowledge. This blurs the line fatally. Are we intending to kill *this man* because we judge him a combatant, or are we intending to kill anyone acting like X, knowing some innocents act like X? The latter seems perilously close to intending a class that *includes* innocents.
      *   **Combatant by Default (CBD):** This is where Anscombe's objection **bites hardest and most fundamentally.** This policy isn't just a *post-hoc* accounting trick; it reveals the *prior intention*. If you only count someone as a civilian *after* proving they weren't a combatant, what were they *during* the strike? They were *counted as*, effectively *targeted as*, combatants. **The policy itself embodies the intention to treat every military-age male in the zone *as a combatant for the purpose of being killed*.** This isn't foreseeing civilian death; it's *presuming* combatant status until proven otherwise, *during the act of killing*. The *intention* inherent in the strike is: "We will kill these men *because* they are (by our operational definition) combatants." But the operational definition ("military-age male in the zone") demonstably *includes* non-combatants. Therefore, **the policy necessitates the *intentional killing of non-combatants*.** It formalizes the confusion or outright erasure of the combatant/non-combatant distinction *at the moment of action*. The lawyers' proportionality assessment is irrelevant *at this level* because proportionality only kicks in *after* establishing the act isn't intrinsically evil. Intending to kill innocents *is* intrinsically evil.

  **Committed View:**
  Anscombe would condemn the signature strike program, *particularly* because of the "combatant by default" (CBD) policy, as **institutionalized murder.** The CBD policy isn't just bad accounting; it *defines the intentional object of the act*. It makes the killing of individuals who are, in fact, non-combatants, *intended* under the description "killing a presumed combatant." But since the presumption is flawed by design (including innocents), and the presumption *is* the basis for action, the intention is tainted. The "pattern" targeting compounds this by making identification inherently probabilistic and group-based, further dissolving individual responsibility and the certainty required for just targeting. **Double effect fails here because the deaths of the innocent non-combatants aren't merely a foreseen side-effect; they are *incorporated into the very definition of the target class*.** It's not "we bomb the factory knowing workers are there"; it's "we bomb these men *because* we define them (by location/age/behaviour) as legitimate targets," a definition that systematically includes innocents. The good effect (killing militants) *is achieved by* killing the defined class, which includes innocents – violating DE condition (b).

  **Deterrence & Conditional Intentions (The List-Making Objection):**
  You're recalling correctly. In *War and Murder* and elsewhere, Anscombe eviscerated nuclear deterrence based on conditional intention. The argument: Deterrence relies on the conditional intention "If you attack us, we will intentionally slaughter your civilians." Formulating such an intention ("I will do X if Y") *is* intending to do X, conditionally. Intending mass murder of innocents, even conditionally, is morally corrupt and impermissible. It's the *formation of the intention* that is sinful.

  *   **Applied to Casualty Accounting/CBD:** The CBD policy *is* a form of conditional intention. It says: "For the purpose of counting casualties *after* a strike, *if* a person was a military-age male in the zone, *then* we intend to count him as a combatant *unless* proven otherwise." This is **a prior conditional intention to misclassify non-combatants as combatants.** While not identical to the deterrence case (it's retrospective accounting, not a future threat), it shares the essential structure: *forming an intention now to perform an unjust act (misrepresenting status, covering up the killing of innocents) if certain conditions obtain later.* Anscombe would see this as a **corrupt bureaucratic practice** that facilitates the primary evil (the strikes) by obscuring the truth and avoiding accountability for killing innocents. It institutionalizes dishonesty about the act. It is a **separate, secondary objection** aimed at the *cover-up mechanism* that flows from and enables the primary intrinsic evil.

  **Two Surprises for the Students:**
  1.  **Surprise 1: She Might Not Object to the Drone *Technology* Per Se:** Students expect luddism or horror at remote killing. But Anscombe's objection is *moral*, not technological. If a drone could *precisely* target an identifiable, justly targetable combatant *without* the CBD logic or pattern-based targeting, she might see it as *preferable* to less discriminate methods like area bombing or artillery. Her fury was at *what* was targeted and *why*, not necessarily *how*. The problem with drones here is the *application*, not the machine. She'd likely say the technology makes the moral failure (CBD, pattern targeting) *easier* and more tempting, but the failure is in the intention and policy, not the joystick.
  2.  **Surprise 2: She Might Accept the Munitions Worker Deaths (DE Applied):** As discussed, students expecting blanket condemnation of *any* civilian death will be surprised she allows DE. Her point isn't that killing non-combatants is *always* murder; it's that *intending* their death is always murder. If the death is truly a side-effect of a legitimate act (like bombing the factory *itself*), and proportionality holds, it *could* be permissible. She was no pacifist. This will force them to grapple with the precise, uncomfortable mechanics of intention vs. foresight.

  **Where Their Instinct is Right:**
  **She Would Object Fiercely to the Bureaucratic Language & Euphemism:** Students might instinctively sense she'd hate the cold, sanitized language: "signature strike," "casualty accounting," "military-age male," "combatant by default." They are absolutely correct. This is exactly the kind of linguistic corruption she attacked in the Truman pamphlet – language designed to obscure the reality of killing human beings, especially innocents. Terms like "collateral damage" or "combatant by default" are modern versions of "destroying a military objective" used to mask the killing of children and non-combatants. She’d see it as a moral evasion, a refusal to call murder by its name when it’s systematically practiced. This linguistic corruption is *symptomatic* of the deeper moral corruption embodied in the CBD policy itself.

  **In Summary for Your Seminar:**
  Hammer home that Anscombe's core objection to the drone program described **bites at the "combatant by default" policy.** This policy makes the killing of non-combatants *intended*, not merely foreseen, by defining the targets in a way that inherently includes them. Double effect *cannot* sanitize this. The pattern targeting is highly suspect for similar reasons. The casualty accounting is a separate sin of conditional intention to misrepresent. Surprise them: Drones themselves aren't the sin, and munitions workers *can* be legitimate indirect victims. Confirm their instinct: She would despise the euphemistic language as a hallmark of moral decay. Focus relentlessly on *what is actually intended* in the act, as defined by the operational rules.
