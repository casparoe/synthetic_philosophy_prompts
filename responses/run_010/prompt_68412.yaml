answer: |-
  ## Brainstorming

  **Dramatic Situation:** Camille West, a painter, grapples with a mural commission for Arden Mills' 70th walkout anniversary. The brief demands celebration of solidarity and dignity. But her late grandmother revealed a secret: Camille’s great-uncle, Eli Carter, was one of three men who secretly signed deals with the Veridian Textile company, collapsing the strike. This money saved their family. Her cousin Simone, chair of the Descendants' Committee (approval required), demands this remain hidden, arguing depicting it feeds the racist "Black strikebreaker" stereotype endemic to the region. Camille wrestles with Du Bois ("all art is propaganda, must be truthful/beautiful") vs. Locke ("art stunted by programmatic demands; fidelity to the work itself").

  **Characters:**
  *   **Camille:** Wants artistic integrity, truth-telling, honoring her grandmother’s confession. Fears betraying her community, reinforcing stereotypes, losing the commission/family connection, becoming complicit in historical erasure.
  *   **Simone:** Wants a unifying, empowering narrative for the community, protecting it from racist weaponization. Fears Camille’s truth will be misread, invalidate the genuine solidarity, and damage present-day community standing. Fears the "archival remainder" becoming public weaponry.
  *   **Frank (Janitor/Former Worker’s Grandson):** Wants the mural to feel "real" to the people who lived it. Fears sanitization. Represents the community eye.

  **Candidate Resolutions & Costs:**
  1.  **Omit Eli Entirely:** Cost: Camille betrays grandmother’s trust, erases the archival remainder, feels complicit in a lie. The mural feels incomplete to her.
  2.  **Depict Eli Signing Overtly:** Cost: Simone rejects it, commission lost. High risk of "split valence" – dignity (fulfilling family duty) vs. stereotype (strikebreaker). Exceeds "fidelity budget" for many viewers.
  3.  **Encode Eli’s Presence:** Show the three men subtly in shadow, or depict the *money* entering the community circuitously (e.g., hidden in groceries). Cost: Only the knowing few understand; requires artistic compromise, feels like evasion. Simone might still object to ambiguity. Camille sacrifices full truth-telling for partial, coded survival of the fact.

  ---

  ## The Muralist's Ledger

  The dust of Arden Mills, Georgia, tasted like old brick and forgotten sweat. Camille West wiped grit from her brow, staring up at the vast, sun-washed wall of the Veridian Atrium. Once, deafening looms had filled this space; now, polished concrete and exposed steel beams spoke of boutique offices and artisanal coffee. Her three canvases – raw, heavy linen, twelve feet high each – waited like blank tombstones. The commission brief, crisp in her back pocket, demanded “solidarity,” “dignity,” “unbroken spirit.” Seventy years since the walkout. Seventy years since Veridian Textile bled the town dry and broke the strike anyway.

  Her grandmother’s voice, raspy with April’s final illness, echoed: *“Eli signed, child. Your great-uncle Eli. Him and two others. Took the company’s money, signed their names, promised silence. That money… it kept a roof when they threw others out. Paid for my schoolbooks. Kept your mama fed.”* A secret ledger entry, the **archival remainder**. Known only to Camille’s branch of the family tree, soon to rot with her and Simone unless spoken, or painted.

  Simone arrived precisely at ten, heels clicking on the concrete like a judge’s gavel. Chair of the Descendants’ Committee. Keeper of the flame. Cousin.

  “Still staring at the void, Cam?” Simone’s smile was tight.

  “Measuring the weight of history.” Camille gestured to the blank expanse. “Solidarity. Dignity. Unbroken. They want a monument.”

  “They deserve one. After all the ‘shiftless’ and ‘scab’ talk this region peddled for decades? After Veridian’s own archives barely mention *why* they walked out? Just ‘labor unrest ceased.’” Simone walked to the center canvas’s position. “This mural isn’t just art. It’s armor. For us. Now.”

  “Armor needs to be true, Simone. What about Eli?”

  Simone’s gaze hardened. “What *about* Eli? Three men out of hundreds. A desperate choice under duress, details lost. Painting him signing some secret paper… Camille, who in that audience next month do you think sees ‘complexity’? Who sees ‘a man feeding his family’? They see the confirmation they’ve always wanted: *See? They broke it themselves.* **Split valence**. His dignity to us becomes their stereotype vindicated. You hand them the stock image, pre-framed.”

  The Du Bois imperative pressed on Camille’s chest: *All art is propaganda. It must be truthful.* But Locke whispered back: *Truth to what? The political need, or the canvas’s own demands?* “So we erase him? Pretend it didn’t happen? Grandma told me for a reason.”

  “Grandma told *you*,” Simone corrected, her voice low and fierce. “A deathbed confidence, not a public mandate. She lived with the weight of that money, Cam. She knew the cost of it being *known*. She also knew what it bought: stability, *your* art school. You think honoring her means painting Eli’s signature? Or honoring the life that signature, however ugly, helped build?” She stepped closer. “Accuracy for the two who know? Or usefulness for the four hundred who don’t? Choose usefulness. Spend your **fidelity budget** on the solidarity, the courage, the daily grind *before* the break. Show the strength, not the fracture point.”

  Frank, the building’s janitor whose grandfather had worked the looms, shuffled in with a bucket. “Mornin’, Miss Camille, Miss Simone. Big blank walls you got there.” He squinted at the space where the middle panel would hang. “Gonna show the picket line? My granddaddy said it stretched clean ’round the block, winter of ‘55. Cold enough to freeze spit.”

  “We’re discussing what elements best convey the spirit, Frank,” Simone said smoothly.

  “Spirit, sure. But folks looked *tired*, Miss Simone. Hungry. Clothes patched. That’s spirit too, ain’t it? Holdin’ on when you ain’t got nothin’ left to hold with.” He mopped a phantom spot. “Just want it to feel… true. Like them folks I heard about.”

  *True.* Camille watched Frank leave. His truth was the picket line’s endurance, the visible struggle. Eli’s truth was the hidden deal, the survival bought with silence. Both were real. The mural could only carry so much unflattering particular before the audience saw specimens, not agents. That was the **fidelity budget**. Spend it all on Eli’s secret, and the solidarity narrative crumbled for the crowd. Spend none, and it crumbled for Camille.

  She began sketching. The left panel: the mill’s imposing brick facade, dawn light catching its harsh angles, workers streaming in – not yet broken, but burdened. The right panel: the aftermath, subtly suggested. Empty porches hinting at evictions, but also children playing, a woman tending defiant marigolds – the unbroken community persisting. The center panel was the battleground. The walkout. She drew the mass of workers, placards held high. Faces resolute, but shoulders slumped with fatigue, coats thin against the imagined cold. Dignity in the collective stance, the direct gaze she gave most figures.

  But Eli? Her pencil hovered. Du Bois demanded truth. Locke demanded the work’s integrity. Simone demanded survival. Her grandmother demanded remembrance.

  Days bled into nights filled with the smell of gesso and linseed oil. Camille blocked in colors: the deep, worn blues and browns of work clothes, the stark white of the snow-that-wasn't-snow (cotton waste? winter sky?), the angry red of Veridian’s brick. She painted hands – gripping signs, clasping neighbors’ shoulders, holding children close. Hands told stories signboards couldn’t.

  Simone visited often, a silent sentinel. “The crowd looks strong,” she conceded one afternoon, watching Camille define a woman’s determined profile in the center mass. “Resolute. That’s good.”

  “They were,” Camille said, adding a subtle fray to the woman’s collar. Dignity wasn’t pristine.

  “And Eli?” Simone’s voice was carefully neutral.

  Camille dipped her brush in raw umber. “He’s there.”

  She placed him near the back of the central crowd, half-turned away, shoulders hunched not just from cold but from an invisible weight. His face was obscured by the angle and the shadow cast by the cap of the man beside him. He was just another figure in the weary multitude. But in his right hand, tucked close to his body, barely visible against the dark blue of his coat, she painted not a sign, not a clenched fist, but a subtle tension – fingers slightly curled, as if holding something small, rectangular, and heavy. An envelope? A pay packet? It wasn't explicit. It required knowing to see it. To anyone else, it was just a hand resting awkwardly, a detail lost in the larger composition.

  She had encoded the **archival remainder**, spending only a sliver of her **fidelity budget**. The **split valence** was minimized but not erased; only those primed by the secret would interpret that hidden tension as betrayal. To others, it might read as exhaustion, uncertainty, or nothing at all. It was a whisper, not a shout. Eli existed, but he didn't break the line in the painting. The focus remained on the collective stand.

  Simone studied the nearly finished center panel for a long time, her gaze lingering on the shadowed figure. Camille held her breath, smelling the sharp tang of paint and the old-mill dust Frank could never quite eradicate. The cost hung heavy in the air – the full truth sacrificed, the secret partially preserved but forever distorted by its hiding, the ghost of Eli forever half-turned away.

  “He’s… hard to see,” Simone finally said, her voice flat.

  “He is,” Camille agreed, her throat tight. The cost landed squarely on her grandmother’s memory, on the stark clarity of Eli’s choice. She had chosen the community’s need for a shield over the family’s need for absolution. She had chosen Du Bois’s *usefulness*, but only by burying Locke’s pure truth deep beneath layers of paint and implication. It felt like a betrayal painted in careful, dignified strokes.

  Simone sighed, a sound like rustling old paper. “Frank’s granddaddy would recognize the tired,” she said, almost to herself. She didn’t approve, but she didn’t reject it. The commission stood. The cost was paid.

  Camille turned back to the mural. The central figures stood tall against the cold, imagined wind. Solidarity. Dignity. Unbroken. Mostly. She picked up the smallest brush, dipped it in a mix of ochre and burnt sienna – the color of old, stained paper. With meticulous, nearly invisible strokes, she added faint, overlapping vertical lines on the brick wall behind the crowd, just above Eli’s obscured head. Not words, just the *idea* of densely printed text, like the ghost of a contract bleeding through plaster. Only someone looking for it, someone who knew, would ever see the phantom clause demanding silence. She painted until the light from the high atrium windows faded, leaving only the security lights casting long, judgmental shadows across the faces of the past.

  ---

  ## Afterword

  The story leans towards Du Bois’s position. Camille’s final choice prioritizes the propagandistic function – creating a useful shield for her vulnerable community against racist misinterpretation. The encoding of Eli’s secret is a truth-telling *within the limits* imposed by the perceived audience hostility, adhering to Du Bois’s demand that propaganda be both truthful *and* serve the cause of uplift, even if the full truth is muted. The "fidelity budget" concept inherently acknowledges Du Bois's reality: for the marginalized, art operates within a contested space where perception is weaponized.

  The strongest consideration against this verdict comes from Locke's perspective, embodied in Frank's desire for something that "feels true" and the cost to Camille's artistic conscience. By obscuring Eli, the mural risks becoming a sanitized monument, potentially stunting its artistic power and depth. It sacrifices the raw, uncomfortable complexity that might forge a deeper, more challenging connection to history, fulfilling the work's own internal demands for unflinching representation. The "archival remainder" isn't truly preserved; it's distorted into near-invisibility, raising the question of whether partial, hidden truth is ultimately more damaging than silence. Locke would argue the mural, by bending so completely to external pressure, fails its highest artistic obligation.
