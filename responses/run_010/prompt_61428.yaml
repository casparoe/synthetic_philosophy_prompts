prompt: |-
  I'm on our university's international programs committee and we have to settle a handbook clause before the fall cohort leaves. Right now it says students must 'respect local customs and conventions,' which isn't doing any work at all. Two things happened in the spring: a student in a country where tipping isn't practiced left money on the table after dinner with her host family, who took it as an insult to their hospitality; and a student in a city where everyone crosses against the light at a big junction just stood there, held up the crowd behind him, and then reported his own classmates to our office for jaywalking.

  The program director wants nonconformity with purely local conventions — tipping, queing, how you cross the street — written up as a sanctionable conduct violation. Two of us think that's a category mistake, since a convention doesn't become an obligation just because everyone around you follows it; one of us thinks the opposite, that if you take the benefits of living somewhere you owe its residents its ways.

  Draft the memo I'll circulate before the meeting: what the clause should actually say, a test the office can apply to a case like these two in five minutes, what we do about the fact that we also host inbound exchange students and would very much like them to tip and queue our way, and what happens when the local convention is itself something we think is unjust. Give the director's view its strongest form — I'd rather he recognized himself in it.
reasoning: |-
  Okay, the user is part of a university international programs committee dealing with a handbook clause about students respecting local customs. They've had two incidents: one where a student tipped in a non-tipping culture, insulting the host family, and another where a student didn't jaywalk with others, causing a disruption. The program director wants violations of local conventions to be sanctionable, but there's disagreement on whether conventions should be obligations.  

  First, I need to analyze the core issue. The current clause is too vague. "Respect local customs" doesn't guide behavior effectively. The director's stance is that breaking conventions should be punishable, but others argue conventions aren't obligations. The memo needs to reconcile these views while addressing practical concerns like inbound students and unjust customs.  

  Key points for the memo:  
  - **Redefine the clause:** Shift from "respect" to "competent engagement" or "harm avoidance." Emphasize practical consequences over moral obligations.  
  - **Decision test:** Create a simple flowchart: Does this cause harm/offense? Is it a true convention? What's the local rationale?  
  - **Inbound students:** Treat expectations asymmetrically—outbound students adapt to hosts, inbound students receive education on local norms without punishment.  
  - **Unjust conventions:** Explicitly state students aren't expected to comply with discriminatory or harmful practices. Provide reporting mechanisms.  

  The director’s view needs strong representation: argue that conventions are social contracts. If everyone benefits from order (like traffic flow), violating them harms the community. But counter that not all conventions carry moral weight—e.g., jaywalking vs. tipping.  

  For the test, focus on consequences. If an action offends or disrupts, it’s a violation. If it’s just unusual but harmless, no sanction. This respects local context without blanket moralizing.  

  Inbound students: Avoid double standards. Don’t punish them for not tipping; instead, educate proactively. The handbook clause is for outbound students; inbound issues are handled via orientation.  

  Unjust customs: Protect students. Use examples like gender-discriminatory dress codes. Frame refusal as upholding university values, not misconduct.  

  The memo should be diplomatic, showing the director’s perspective is understood but balanced with practical and ethical limits. Structure it clearly: problem, proposed clause, test, special cases, rationale. Keep language administrative but accessible.
answer: |-
  **MEMORANDUM**  
  **TO:** International Programs Committee  
  **FROM:** [Your Name/Committee Member]  
  **DATE:** [Current Date]  
  **SUBJECT:** Proposed Revision of Handbook "Local Customs" Clause & Decision Framework  

  ---

  ### **I. The Problem with the Current Clause**  
  The existing requirement for students to "respect local customs and conventions" is too vague to guide behavior or adjudicate disputes. Recent incidents highlight the ambiguity:  
  1. **Tipping Incident:** A student’s well-intentioned tip violated a *non-tipping* culture’s norm of hospitality, causing offense.  
  2. **Crosswalk Incident:** A student’s *refusal* to cross against a light (where safe/local custom permits) disrupted pedestrian flow and bred peer resentment.  

  The Director’s position—that nonconformity with purely local conventions should be sanctionable—deserves serious consideration:  
  > **Strongest Case for the Director’s View:**  
  > *"When students enter a community, they accept its unwritten social contract. Conventions like queueing, traffic norms, or hospitality rituals are the ‘grammar’ of daily life—not optional courtesies. Violating them (even innocently) disrupts social cohesion, disrespects hosts, and can create tangible friction (e.g., traffic hazards, offended partners). If students benefit from the host community’s stability and goodwill, they owe a duty to assimilate its foundational norms. Permitting exceptions for ‘harmless’ nonconformity invites cultural insensitivity and undermines program integrity."*  

  However, concerns remain:  
  - Not all conventions carry moral weight (e.g., jaywalking vs. tipping).  
  - Students cannot intuit every local nuance.  
  - Some conventions may conflict with university values (e.g., discriminatory practices).  

  ---

  ### **II. Proposed Handbook Clause**  
  **Revised Text:**  
  > *"Students are expected to engage competently and respectfully with their host communities. This includes making good-faith efforts to understand and adhere to local conventions—especially those impacting safety, social harmony, or hospitality—unless doing so would violate personal conscience, university policy, or applicable law. Deliberate or repeated disregard for such norms, where it causes reasonable offense, disruption, or harm, may be treated as a conduct violation."*  

  **Key Changes:**  
  - Replaces "respect" with **"engage competently"** (actionable behavior).  
  - Qualifies expectations (**"good-faith efforts"**, **"unless conscience/policy conflicts"**).  
  - Links violations to **tangible outcomes** (offense, disruption, harm).  

  ---

  ### **III. 5-Minute Test for Adjudicating Cases**  
  Staff should ask these questions sequentially:  
  1. **Harm Test:** Did the action cause *reasonable offense, disruption, or risk to safety/relationships*?  
     *(e.g., Tipping: yes—offended hosts; Jaywalking refusal: yes—disrupted traffic)*  
  2. **Convention Test:** Was this a *widely recognized, non-arbitrary local convention*?  
     *(e.g., Tipping: yes—known hospitality norm; Jaywalking: yes—consistent pedestrian behavior)*  
  3. **Knowledge Test:** Should the student have reasonably known this *via orientation, materials, or context*?  
  4. **Conscience Test:** Did compliance require violating *core ethics, safety, or identity*?  
     *(If yes, not sanctionable; see Section V.)*  

  **Outcome:**  
  - Sanction only if **all four criteria are met**.  
  - *Example Tipping Case:* Harm (offense) + Convention (no-tipping) + Knowledge (orientable) + No conscience conflict → **Violation**.  
  - *Example Jaywalking Case:* Harm (disruption) + Convention (crossing norm) + Knowledge (observable) + No conscience conflict → **Violation**.  

  ---

  ### **IV. Addressing Inbound Exchange Students**  
  **Asymmetry is justified and manageable:**  
  - **Outbound Students:** Must adapt to hosts to preserve partnerships and safety.  
  - **Inbound Students:** We *encourage* but **cannot require** adherence to our norms (e.g., tipping, queueing).  
  **Practical Approach:**  
  1. **Education, Not Enforcement:** Cover U.S./campus norms in inbound orientation (e.g., "Here, tipping servers 15-20% is expected").  
  2. **Clarify in Handbook:** Add: *"Inbound students are warmly encouraged to participate in local customs for a fuller experience, but lapses will not be treated as conduct violations barring exceptional harm."*  

  ---

  ### **V. Handling Unjust or Problematic Conventions**  
  **Explicit Safeguard:**  
  > *"No student is expected to comply with conventions that:  
  > (a) Violate university non-discrimination policies (e.g., gender-based restrictions);  
  > (b) Endanger health/safety; or  
  > (c) Conflict with protected identity or conscience.  
  > Students encountering such norms should contact the program office for support."*  

  **Examples:**  
  - *Permissible Noncompliance:* Refusing gender-segregated seating if unjustly applied.  
  - *Not Permissible:* Ignoring queueing norms because "it’s inefficient."  

  ---

  ### **VI. Recommended Committee Action**  
  1. Adopt the revised clause and 5-minute test.  
  2. Approve asymmetric norms for inbound/outbound students.  
  3. Add a reporting protocol for conflicts with unjust conventions.  

  This framework respects the Director’s valid concerns about social cohesion while preventing overreach into morally neutral or oppressive norms. It prioritizes **harm prevention** over cultural assimilation, giving staff clear tools without philosophical ambiguity.  

  **Feedback welcome before the vote.** Let’s finalize this for the fall cohort.  

  ---  
  **Attachments:**  
  - Redlined clause revisions  
  - Flowchart: "Adjudicating Conventions Complaints"  
  - Incident case studies (anonymized)
