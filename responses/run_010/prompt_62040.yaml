prompt: |-
  I'm teaching an interdisciplinary seminar — historians, political theorists, two theologians — and every year someone says the arc of history bends toward justice with total confidence while meaning something completely different by it from the person sitting next to them. I want to build a sorting instrument that catches the disagreement before any labels get invoked: five questions a student can answer without knowing any of the isms, which between them drop them onto a named position.

  Build it from the logical space rather than from a list of movements. The distinctions I actually care about are whether the claim is predictive or regulative, whether whatever does the bending sits inside history or outside it, whether human agency is required for the tendency to hold at all, whether the payoff lands within history or beyond it, and whether the arc is supposed to be visible from where we stand or only reconstructable backwards. No question may name a philosopher, an ism, or God, and none of them can be a bald 'do you believe in progress?' — make each one a bet, a counterfactual or a case.

  Leaves I need: a Popperian anti-historicism, a providential reading, a dialectical-necessity reading, a plain empirical-progress reading, a cyclical-decline reading, and at least one cell nobody occupies, with a line on whether its empty because it's incoherent, unattractive or just unexplored. Flag any pair of leaves your questions cant really separate rather than papering over it.

  Format: exactly five numbered items, no introduction and no conclusion. Each item is one question in a sentence or two with its answer options, every option carrying a short clause on which leaf it points toward, and a closing line noting either an unoccupied combination or an unseparated pair. British English please.
reasoning: |-
  Hmm, the user is teaching an interdisciplinary seminar with historians, political theorists, and theologians. They're frustrated because students confidently use the phrase "the arc of history bends toward justice" but mean completely different things by it. They want a sorting instrument—five questions that can place students into philosophical positions without using labels like isms or naming philosophers or God.

  The key distinctions they care about are: predictive vs regulative claims, whether the bending force is inside or outside history, if human agency is required, whether justice is achieved within history or beyond it, and if the arc is visible now or only in retrospect. They want leaves (positions) including Popperian anti-historicism, providential views, dialectical necessity, empirical progress, cyclical decline, and at least one unoccupied cell. I need to flag any indistinguishable pairs.

  The questions must be bets, counterfactuals, or cases—no bald "do you believe in progress?" I'll use British English and format strictly: five numbered items with questions and answer options, each option pointing to a leaf, plus a closing note on unoccupied combinations or unseparated pairs. No introduction or conclusion.

  Let me map the logical space based on the distinctions. I'll define the positions first: 

  - Popperian anti-historicism: rejects predictive laws in history, sees claims as regulative ideals.
  - Providential: divine force outside history guides toward justice beyond history.
  - Dialectical necessity: immanent forces like class struggle drive inevitable progress within history.
  - Empirical progress: observable improvement based on evidence, visible now.
  - Cyclical decline: history as decay, no inherent justice trend.
  - Unoccupied cell: something like "justice achieved beyond history without outside force"—might be incoherent.

  Now, for the questions:

  1. **Predictive vs regulative:** Use a counterfactual about collective resignation. If students think justice still emerges, it's predictive (dialectical/empirical); if it fails, it's regulative (Popperian) or depends on external forces (providential). Cyclical would say resignation changes nothing or worsens it.

  2. **Bending force inside/outside history:** A bet on whether justice trends hold without human effort. If yes, external force (providential); if no, internal with agency (dialectical/empirical); if irrelevant, no trend (cyclical/Popperian).

  3. **Human agency required:** Case study of a society regressing. If recovery is inevitable, agency not required (dialectical/providential); if preventable by action, agency required (empirical); if irrecoverable, cyclical decline.

  4. **Payoff within/beyond history:** Counterfactual on achieving perfect justice. If possible within history, empirical or dialectical; if impossible or only after, providential; if nonsensical, Popperian or cyclical.

  5. **Arc visible now or retroactively:** Bet on future perception. If visible now, empirical; if only later, dialectical; if never, Popperian/cyclical/providential (since providential might not be visible).

  I need to ensure the questions don't name isms. For example, Q1: "Suppose all societies permanently abandoned justice-seeking..." Options: if justice still emerges, points to predictive readings; if not, to regulative or external dependence.

  Check for unseparated pairs: Dialectical and empirical both might say agency is required for the tendency, but dialectical sees it as necessary, empirical as contingent. In Q3, I can distinguish by recoverability: dialectical says inevitable recovery, empirical says preventable with action.

  Unoccupied cell: A position where justice is achieved beyond history without an outside force. That might be unattractive or incoherent, as beyond history implies transcendence. I'll note it.

  Refine the questions for clarity and British English. Avoid passive voice where possible. For instance, "is human agency required" becomes "does the tendency depend on human effort".

  Finally, compile exactly five items. Each with a question, options, and a closing note. Ensure the leaves are covered and the unoccupied cell is mentioned in one closing line.

  Check: Are there any indistinguishable pairs? Providential and dialectical might both say no agency required, but providential has outside force, dialectical has internal necessity. Q2 separates by force location. Popperian and cyclical both might reject visible arcs, but Popperian is regulative, cyclical is decline—distinguished in Q1 and Q4.
answer: |-
  1.  Suppose all societies permanently abandoned conscious justice-seeking tomorrow. Would recognisable justice still tend to emerge globally over centuries?  
      (a) Yes, reliably so. [Points toward predictive readings (dialectical-necessity, empirical-progress, providential)]  
      (b) Only erratically or not reliably. [Points toward regulative readings (Popperian anti-historicism) or requires external force]  
      (c) No, or justice becomes irrelevant. [Points toward cyclical-decline]  
      Leaves empirical-progress & dialectical-necessity unseparated here; both require (a).

  2.  If humanity collectively ceased striving for justice entirely, would the historical tendency towards justice persist?  
      (a) Yes, something beyond human effort sustains it. [Points toward providential (outside force)]  
      (b) No, the tendency depends wholly on human effort. [Points toward empirical-progress]  
      (c) The tendency might hold regardless, through inherent historical forces. [Points toward dialectical-necessity (inside force)]  
      (d) There is no such reliable tendency. [Points toward cyclical-decline or Popperian anti-historicism]  
      Unoccupied cell: Justice tendency persists *without* outside force *and without* human agency or inherent historical force (likely incoherent).

  3.  A society achieves significant justice, then deliberately dismantles its institutions and reverts to widespread tyranny for centuries. Is its eventual recovery towards justice:  
      (a) Inevitable, given sufficient time. [Points toward dialectical-necessity or providential]  
      (b) Possible but preventable if agents choose badly forever. [Points toward empirical-progress (agency required)]  
      (c) Unlikely or impossible; decline is the deeper pattern. [Points toward cyclical-decline]  
      (d) Misguided question; history lacks such directional inevitabilities. [Points toward Popperian anti-historicism]  
      Leaves providential & dialectical-necessity unseparated; both suggest (a).

  4.  Could a perfectly just global order, lasting millennia, theoretically be achieved *within* ongoing human history?  
      (a) Yes, fully achievable here through effort or process. [Points toward empirical-progress or dialectical-necessity (payoff within)]  
      (b) No, ultimate justice lies beyond historical time itself. [Points toward providential (payoff beyond)]  
      (c) ‘Perfect justice’ is incoherent or unattainable in any framework. [Points toward Popperian anti-historicism or cyclical-decline]  
      Unseparated pair: Empirical-progress and dialectical-necessity both imply (a).

  5.  Looking ahead 500 years, will historians then identify a clear, continuous upward trend in justice *from our present moment*?  
      (a) Yes, the trend is already visible if we analyse correctly. [Points toward empirical-progress (visible now)]  
      (b) Only in retrospect, once later stages make the arc coherent. [Points toward dialectical-necessity (only reconstructable backwards)]  
      (c) No, the pattern will remain contested or absent. [Points toward Popperian anti-historicism, providential (if arc is mysterious), or cyclical-decline]  
      Unseparated pair: Popperian anti-historicism & providential both often accept (c), but for different reasons.
