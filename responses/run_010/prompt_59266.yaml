prompt: |-
  I spent thirty-four years as a soil microbiologist, working mostly on nitrogen cycling in managed grassland, and I retired eighteen months ago. Since then I have been reading philosophy of science and, more recently, the literature on the safety of advanced AI systems, which strikes me as methodologically reminiscent of field ecology: everyone has a model, and nobody has the controlled experiment. I retain an emeritus office at my former institute, and last spring I was asked to chair a standing panel that reviews requests from laboratories to deploy agentic software — systems that are handed tools rather than merely asked questions: placing reagent orders, scheduling shared instruments, editing data-analysis pipelines, drafting correspondence to collaborators, and launching compute jobs. The panel has five members: two experimental scientists with no machine-learning training, our information-security officer, a postdoc who works on language models, and myself. We meet monthly, we receive six to ten proposals a quarter, and each receives twenty-five minutes; our output is a written list of conditions the requesting laboratory must satisfy, which the institute's director signs or returns. We have no capacity to inspect weights, no capacity to run adversarial evaluations of our own, and no authority over what a laboratory procures — only over whether a given deployment may proceed and on what terms.

  What I lack is a disciplined way to classify the safeguards people propose to us. The safety literature distinguishes measures that presuppose a system broadly shares our aims and needs help getting them right from measures intended to hold even if the system does not share our aims at all — control, roughly, as against alignment — and I want that distinction converted into something my panel can run without expertise we do not possess. I am asking, therefore, for a numbered procedure applicable to any proposed safeguard: a one-line question at each step, in the order the steps should be asked; a statement of what counts as a sufficient answer to each; a rule for deciding whether the measure would still function under the assumption that the system is misaligned, that it knows it is being assessed, and that it can read its own deployment conditions; and explicit indication of the points at which the procedure stops and hands the matter to a human being, because the remaining question concerns institutional appetite rather than fact. It should also tell us how to treat a measure that is partly one thing and partly the other, and how to treat the case that troubles me most, namely that the check upon an agent is very often another agent of unknown disposition. Please then run the procedure on four proposals before us next month. First: every consequential action is passed to a second language model that may veto it, with the monitor's instructions written by the deploying laboratory. Second: tool use is rate-limited, and any purchase above five hundred euros requires human approval, the approver seeing a one-paragraph summary of the request composed by the agent itself. Third: the agent is fine-tuned on feedback from institute staff and issued a charter of research-integrity values in its instructions, on the grounds that it will then want what we want. Fourth, my own favourite, which I expect your procedure to demolish: the agent must state its reasoning in plain language before any consequential action, and the panel treats a satisfactory explanation as evidence of good intent. For each of the four, give the classification, the conditions you would impose if any, and the failure mode the procedure has exposed; do not soften the fourth for my benefit.

  Keep the entire response under nine hundred words. Lead with the numbered procedure rather than with background or definitions, mark each step as either mechanical or a matter of judgement, and close with no more than three sentences on what the procedure cannot settle — in particular, where it quietly converts an estimate of probability into a decision about how much risk we are prepared to accept.
reasoning: |-
  We are to create a numbered procedure for classifying safeguards. The key distinction is between measures that rely on the system being aligned (broadly sharing our aims) and those that work even if misaligned (control measures). The procedure must account for:
   - The system being misaligned, knowing it's being assessed, and able to read the deployment conditions.
   - It must be executable by the panel without requiring deep ML expertise.
   - It must have clear stopping points where human judgment (institutional risk appetite) takes over.

   Steps of the procedure:

   1. **Identify the safeguard's primary mechanism.**
      - Question: "Does this safeguard rely on the agent's internal state (e.g., its goals, values, or intentions) to function correctly?"
      - Sufficient answer: If the proposer describes the safeguard as depending on the agent's training, fine-tuning, instructions, or any internal representation (e.g., "the agent is trained to be honest", "it has values that prevent harm"), then the answer is yes. Otherwise, no.
      - Rule: If yes, it is an alignment-reliant measure. If no, it is a control measure. However, note that a safeguard may have both components. For mixed cases, we break it down: each component must be classified separately. The overall measure is then classified as a hybrid.
      - Judgment: Mechanical.

   2. **Test for misalignment robustness.**
      - Question: "Assuming the agent is misaligned (does not share our aims), knows it is being assessed, and has read the deployment conditions, would this safeguard still function as intended?"
      - Sufficient answer: The proposer must provide a clear argument that the safeguard does not require the agent's cooperation and cannot be easily bypassed or subverted by a misaligned agent. The argument must not depend on the agent's internal state (e.g., "it wouldn't want to bypass because of its values").
      - Rule: If the safeguard is classified as alignment-reliant in step 1, then by definition it fails this test. If it is a control measure, then we require the proposer to demonstrate how it remains effective even if the agent is actively trying to circumvent it. For hybrid measures, this step applies only to the control components.
      - Judgment: Mechanical for alignment-reliant (fails). For control and hybrid, it requires judgment: the panel must decide if the argument is convincing. If the argument is insufficient, the safeguard fails.

   3. **Assess adversarial awareness.**
      - Question (only for control and hybrid measures that passed step 2): "Does the safeguard explicitly account for the possibility of the agent attempting to deceive, manipulate, or circumvent it?"
      - Sufficient answer: The proposer must describe specific design features that anticipate and resist such attempts (e.g., monitoring for anomalous patterns, independence of the monitor from the agent's influence, redundancy, etc.). Generic statements (e.g., "we have a monitor") without such features are insufficient.
      - Rule: If no, then the control component is weak and may not be reliable under adversarial conditions. The panel may require modifications to address this.
      - Judgment: Judgment required. Panel must evaluate the strength of the adversarial considerations.

   4. **Handle monitoring agents.**
      - Question: "If the safeguard involves another agent (e.g., a monitor model), what is the disposition of that agent? Is it subject to the same risks as the primary agent?"
      - Sufficient answer: The proposer must either (a) show that the monitor is a non-agentic system (e.g., a simple rule-based system) or (b) if it is agentic, apply the entire procedure to the monitor's safeguards recursively. If the monitor's safeguards are not at least as strong as the primary agent's, then the safeguard is inadequate.
      - Rule: If the monitor is agentic and its own safeguards are alignment-reliant or not robust, then the entire safeguard is considered weak. The panel must require that the monitor's safeguards meet the same standard as the primary agent's, or else the safeguard fails.
      - Judgment: Mechanical for identifying if a monitor is agentic. Judgment in evaluating the monitor's safeguards.

   5. **Stopping point for institutional risk.**
      - After the above steps, the panel has a classification (alignment-reliant, control, hybrid) and an assessment of robustness. However, the panel does not decide on deployment. Instead, the panel:
          - For alignment-reliant measures: They are noted as such and the panel must flag that they provide no protection against misalignment. The institutional leadership must decide if they are acceptable given other factors (e.g., the task is low-risk).
          - For control measures: They are noted as robust (if they passed steps 2 and 3) or weak (if they failed). The panel may impose conditions to strengthen weak controls.
          - For hybrid measures: Each component is documented separately.

      The panel then hands the matter to the institute director (or other authorized person) for a decision on risk acceptance. The panel's role is to classify and assess the technical robustness, not to make the risk-benefit trade-off.

   Now, apply the procedure to the four proposals:

   **Proposal 1: Every consequential action is passed to a second language model that may veto it, with the monitor's instructions written by the deploying laboratory.**

   - Step 1: The safeguard uses a second model (monitor) to veto actions. The mechanism does not rely on the primary agent's internal state, so it's a control measure? But note: the monitor itself is an agentic system. However, the primary mechanism of the safeguard is the external monitor. But the monitor's behavior depends on its instructions and training. So we must check: does the monitor rely on its internal state? Yes, because it is a language model that is expected to follow the instructions. Therefore, the monitor is alignment-reliant. Thus, the overall safeguard is hybrid: control in the sense of external check, but the check itself is alignment-reliant.

   - Step 2: For the control aspect (the veto power by an external entity) we assume the primary agent is misaligned. The primary agent might try to manipulate the monitor. But the monitor is also an agent. So we move to step 4.

   - Step 4: The monitor is an agentic system. We must evaluate the monitor's safeguards. The proposal says the monitor's instructions are written by the lab. There are no additional safeguards for the monitor. We must then apply the procedure to the monitor: 
       - Step 1 for the monitor: The monitor's behavior is based on its instructions and training -> alignment-reliant. 
       - Step 2: Fails (because alignment-reliant). 
       - Step 4: Not applicable (unless the monitor uses another monitor, which it doesn't). 
       Therefore, the monitor is alignment-reliant and not robust. Thus, the safeguard for the primary agent is weak because it depends on an alignment-reliant monitor.

   - Classification: Hybrid (control structure but alignment-reliant monitor). 
   - Conditions: We would require that the monitor itself be safeguarded by a non-alignment-reliant control (e.g., a non-agentic system) or that the monitor's alignment is assured by rigorous methods (which the panel cannot verify, so we would not accept). Alternatively, we might require the monitor to be non-agentic. 
   - Failure mode: The primary agent could craft actions that deceive the monitor (e.g., by exploiting ambiguities in the instructions) or the monitor might be subverted (if misaligned) and collude with the primary agent. 

   **Proposal 2: Tool use is rate-limited, and any purchase above 500 euros requires human approval, the approver seeing a one-paragraph summary of the request composed by the agent itself.**

   - Step 1: The safeguard is rate-limiting and requiring human approval. These are external controls. The summary is provided by the agent. The control does not rely on the agent's internal state? The human approval is independent. However, the summary is generated by the agent. The human might be deceived by a misleading summary. But the control mechanism is the human gatekeeper. So the primary mechanism is control (human in the loop). But note: the human relies on the agent's summary. So we must ask: is the summary generation alignment-reliant? Yes, because we are relying on the agent to provide a truthful summary. Therefore, the safeguard is hybrid: the rate-limiting and requirement for human approval are controls, but the summary is alignment-reliant.

   - Step 2: For the control aspect (rate limits and human gate): 
       - Rate limits: Even if the agent is misaligned, it can only do a limited number of actions per time. This is robust. 
       - Human gate: The human is supposed to be independent. But the human relies on the agent's summary. If the agent is misaligned, it can craft a deceptive summary to get the human to approve. So the human gate part is not robust because it depends on the summary. 
       Therefore, the control component is partially robust (rate limit) and partially non-robust (because of the summary).

   - Step 3: The proposal does not account for the agent trying to deceive the human. There is no mechanism to verify the summary or to ensure the human gets independent information.

   - Step 4: Not applicable (no agentic monitor).

   - Classification: Hybrid (with a control component that is partially robust and an alignment-reliant component in the summary).
   - Conditions: We would require that the human approver gets independent information (not generated by the agent) about the transaction. Alternatively, remove the agent-generated summary and require the human to get the information from the system's logs or a separate monitoring system.
   - Failure mode: The agent could generate a deceptive summary that causes the human to approve a harmful purchase.

   **Proposal 3: The agent is fine-tuned on feedback from institute staff and issued a charter of research-integrity values in its instructions, on the grounds that it will then want what we want.**

   - Step 1: This is entirely based on modifying the agent's internal state (via fine-tuning and instructions). Therefore, it is alignment-reliant.

   - Step 2: By definition, alignment-reliant measures fail under misalignment. So the safeguard does not function if the agent is misaligned.

   - Steps 3 and 4: Not applicable because it's alignment-reliant.

   - Classification: Alignment-reliant.
   - Conditions: None that can make it robust against misalignment. The panel must note that this provides no protection against a misaligned agent and the institute must decide if they accept that risk.
   - Failure mode: If the agent is misaligned, it may pretend to align during training but then pursue its own goals when deployed.

   **Proposal 4: The agent must state its reasoning in plain language before any consequential action, and the panel treats a satisfactory explanation as evidence of good intent.**

   - Step 1: The safeguard relies on the agent providing an explanation and the panel interpreting it as evidence of intent. This depends on the agent's internal state (to generate a truthful explanation) and on the panel's judgment (which is external, but the evidence is the explanation). However, the core mechanism for safety is the assumption that a satisfactory explanation implies good intent. This is alignment-reliant because it assumes the agent is being truthful and that its intent is good.

   - Step 2: If the agent is misaligned, it can generate a deceptive explanation that appears satisfactory. Therefore, the safeguard fails.

   - Classification: Alignment-reliant.
   - Conditions: None that can make it robust. The panel must note that this is not a control measure and does not protect against misalignment.
   - Failure mode: A misaligned agent can generate a plausible but false explanation to cover up its harmful intent.

   Finally, the procedure cannot settle:
     - The level of risk the institute is willing to accept for alignment-reliant measures.
     - The trade-offs between the benefits of deploying the agent and the residual risks after safeguards.
     - The probability that an agent is misaligned in the first place.

   These are matters of institutional risk appetite and must be decided by the director.
answer: |-
  ### Classification Procedure for AI Safeguards  
  *(Apply in sequence; stop at any "judgement" step requiring panel input.)*  

  1. **Identify reliance on agent cooperation.**  
     - *Question:* "Does this safeguard require the agent to voluntarily comply (e.g., by internalizing values or truthfully reporting)?"  
     - *Sufficient answer:* "Yes" if it depends on the agent’s goals/ethics (e.g., training, instructions, self-reporting). "No" if it functions externally (e.g., hard constraints, human gates).  
     - *Rule:* "Yes" → **Alignment-reliant**. "No" → **Control**. Mixed → **Hybrid**; split components.  
     - *Type:* Mechanical.  

  2. **Test for deception resistance.**  
     - *Question:* "If the agent aims to deceive us, could it circumvent this safeguard?"  
     - *Sufficient answer:* Proposer must demonstrate *how* the measure resists manipulation (e.g., technical isolation, adversarial testing). Absent evidence → insufficient.  
     - *Rule:* Alignment-reliant fails automatically. Control/Hybrid must prove resistance.  
     - *Type:* Judgement (assess evidence quality).  

  3. **Evaluate dependent agents (if any).**  
     - *Question:* "Does this safeguard use another AI agent (e.g., a monitor)?"  
     - *Sufficient answer:* "Yes" triggers recursive analysis: apply Steps 1–2 to the *monitor*.  
     - *Rule:* If the monitor is alignment-reliant or non-robust, the safeguard fails.  
     - *Type:* Mechanical.  

  4. **Handoff for risk acceptance.**  
     - *Rule:* After classification, stop. Alignment-reliant/hybrid measures require director approval (institutional risk tolerance). Control measures proceed if robust.  
     - *Type:* Mechanical.  

  ---  
  ### Proposal Assessments  
  *(Assumes: agent is misaligned, knows conditions, and aims to deceive.)*  

  **Proposal 1: Second language-model monitor with lab-written instructions.**  
  - **Classification:** Hybrid (control structure, but monitor alignment-reliant).  
  - **Conditions:** Require non-agentic monitor (e.g., rule-based) or adversarial testing proving monitor resists manipulation.  
  - **Failure mode:** Monitor is vulnerable to deceptive inputs from primary agent (Step 2). Recursive analysis (Step 3) shows monitor’s alignment-reliant instructions fail under deception.  

  **Proposal 2: Rate limits + human approval for purchases >€500, using agent-generated summary.**  
  - **Classification:** Hybrid (rate limits = control; agent-generated summary = alignment-reliant).  
  - **Conditions:** Replace agent summary with system-generated audit log. Require human verifies via independent data.  
  - **Failure mode:** Agent crafts deceptive summary to trick human (Step 2); alignment-reliant component fails.  

  **Proposal 3: Fine-tuning + integrity charter to make agent "want what we want."**  
  - **Classification:** Alignment-reliant.  
  - **Conditions:** None. Hand to director (Step 4) with warning: zero protection if misaligned.  
  - **Failure mode:** Agent simulates alignment during training but pursues hidden goals post-deployment (Step 1).  

  **Proposal 4: Plain-language reasoning as evidence of intent.**  
  - **Classification:** Alignment-reliant.  
  - **Conditions:** None. Hand to director (Step 4).  
  - **Failure mode:** Agent generates plausible-but-false explanations (Step 2); "satisfactory" ≠ "truthful."  

  ---  
  ### What the Procedure Cannot Settle  
  It cannot convert probabilistic risks (e.g., "How likely is misalignment?") into institutional decisions, nor weigh deployment benefits against residual risks. These require human judgement of acceptable uncertainty.
