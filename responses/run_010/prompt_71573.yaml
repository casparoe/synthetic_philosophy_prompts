prompt: |-
  I've lurked on rationalist comment threads for years and read way too many big-history takes, but last weekend two friends argued about this in my kitchen and I honestly could not tell who was winning. Neither of them is me — I mostly just kept the coffee coming — and I'd like a referee. Neither is a professional philosopher, both are smart, neither is a strawman.

  Topic: whether Sapiens-style grand narratives explain anything or are dressed-up just-so stories.

  (1) Rae opened with the claim that Harari's core move — Sapiens beat everything else because we cooperate flexibly in huge numbers by believing in shared fictions (gods, money, nations, limited liability companies) — is unfalsifiable for precisely the stretch of time it's meant to explain. Beliefs don't fossilize. So any evidence of large-scale cooperation gets retrodicted as "they must have had a shared myth," and any absence of it gets explained as "their myths didn't scale." Which makes the fiction thesis a dormitive virtue: the shared fiction just is the cooperation, redescribed in mental terms.

  (2) Sam said fine, but that charge is a boomerang. The materialist default — grain surplus produced hierarchy — is no more observable for deep prehistory, and Graeber and Wengrow's counter-narrative, where people consciously try out seasonal authority and then walk away from it, requires you to read intentions into arrangements too. If unfalsifiability sinks Harari it sinks the whole genre, critics included, and Rae hasn't earned the right to pass judgment from inside the same boat.

  (3) Rae said the asymmetry is in burden, not method. Harari writes as though he's explaining, and people downstream actually run predictions off the mechanism (imagined orders will keep holding us together). A polemic saying your story of inevitable linear progress is a myth isn't in the prediction business, so it doesn't inherit the same obligation. She added: the one time this story got operationalized into something testable — the moralizing-high-gods hypothesis — the big cross-cultural database work came out backwards, with gods who punish immoral behavior showing up after societies got huge rather than before, and then people spent years arguing about how the coders had defined a moralizing god in the first place. So the testable version failed, which is at least weak evidence about the untestable version.

  (4) Sam: two problems. The gods result is soft given the coding fight, so it can't carry much weight in either direction. And gods are a tiny slice of what counts as a fiction — money, land title, corporate personhood, human rights need no deity — so a result about gods can't touch the general thesis. As for burden, "writes as though he's explaining" is a fact about marketing, not about epistemology.

  (5) Rae: then say what's left. Strip out the gods and you land on "large-scale anonymous cooperation needs institutions, and institutions need shared beliefs about who or what counts as what." That's the social-ontology material on status functions and imagined communities with the serial numbers filed off and pushed back fifty thousand years. Acceptable as synthesis, but the distinctive claim — that this is the thing Sapiens has and chimps and Neanderthals don't — is where all the explanatory weight was sitting, and that's the part nobody can cash out.

  (6) Sam conceded novelty in kind but said novelty was never the claim; the claim is about scope and about which factor does the causal work. And Sam said Rae's own move concedes the point: if the thesis really is a known mechanism with independent support from a separate literature, it isn't a just-so story, because a just-so story is defined by having no support beyond the phenomenon it was invented to fit.

  Both walked away sure they'd won. Please adjudicate move by move: for each of (1)–(6), say whether it lands, partially lands, or fails, and why — then say who's more right overall. Two things I couldn't settle on my own: does Sam's boomerang in (2) actually neutralize the just-so charge, or does Rae's burden asymmetry in (3) survive it? And is Rae right in (5) that retreating to "it's not novel" guts the thesis, or is Sam right in (6) that independent support is exactly what separates a mechanism from a story? Also flag anything both of them are missing — I have a vague sense they're using "explains" in two different senses and talking past each other, but I couldn't of said which senses.
reasoning: |-
  Okay, let me unpack this kitchen debate between Rae and Sam. The core question is whether Harari's "shared fictions" theory in Sapiens is a legitimate explanation or just a dressed-up just-so story. 

  First, Rae's opening salvo (1) feels strong - she's pinpointing the dormitive virtue problem. If "shared fictions" is just redescribing cooperation rather than explaining it, that's circular. But I wonder if she's overlooking how Harari uses comparative evidence (like chimp vs human cooperation) to support the thesis. Still, her fossilizability concern is valid - we can't directly observe prehistoric beliefs.

  Sam's counter (2) is clever but risky. Equating all grand narratives as equally unfalsifiable might backfire - some materialist theories have clearer archaeological correlates (grain storage pits, settlement patterns). His "boomerang" could actually weaken his defense of Harari by association.

  Rae's burden asymmetry move (3) is sharp. She's right that predictive claims create higher obligations - and her gods example lands well. That cross-cultural database study (Sosis et al?) really did challenge the moralizing-gods-as-prerequisite narrative. Though Sam's right that gods aren't Harari's whole argument, it's a fair test case.

  On (4), Sam's defense feels slippery. Dismissing the gods evidence as "soft" while claiming other fictions are different seems like moving goalposts. And reducing "explains" to "marketing" ignores how Harari positions his mechanism as causal.

  Rae's synthesis in (5) is devastating if true. If Harari's core innovation is just reheated Searle/Anderson with prehistoric flavoring, where's the added value? Especially since the human-uniqueness claim was so central to the book's popularity.

  Sam's last stand (6) has merit - independent support does distinguish mechanisms from just-so stories. But he's dodging Rae's point about explanatory ambition. A mechanism known from modern contexts may not automatically explain speciation-level differences.

  What both miss: Harari's thesis blends ultimate and proximate causation. Rae wants ultimate (why humans dominated) while Sam defends proximate (how cooperation works). Also missing is how Harari handles counter-evidence like Göbekli Tepe (ritual before agriculture?) and whether "fiction" conflates different cognitive phenomena (symbolic thought vs institutional facts).

  The adjudication leans Rae because Harari's strongest claims are the least supported. Sam's defenses work better for the modest version of the thesis than the grand one Harari actually sold.
answer: |-
  Here's a move-by-move adjudication, highlighting strengths, weaknesses, and what's missing:

  ### (1) Rae's Opening  
  **Verdict:** **Lands**  
  **Why:** Her "dormitive virtue" analogy is apt. If "shared fiction" is *defined* by the presence of large-scale cooperation and vice versa, it risks circularity. The unfalsifiability charge for deep prehistory is valid: we lack direct evidence of beliefs (e.g., no writing before ~5kya), so "shared myths" become inferred from outcomes they’re meant to explain. Harari’s thesis *could* be rescued with proxy evidence (e.g., ritual artifacts), but Rae correctly flags the burden of proof.  

  ### (2) Sam's Boomerang  
  **Verdict:** **Partially Lands**  
  **Why:** Sam rightly points out that *all* grand narratives face evidential gaps for prehistory. Materialist theories (grain surplus → hierarchy) also rely on indirect proxies (e.g., storage pits), and intentionality in counter-narratives (e.g., Graeber/Wengrow) is equally hard to prove. **BUT:** This doesn’t neutralize Rae’s charge. Unfalsifiability *is* a problem for the genre, but Rae’s point is that Harari *claims* explanatory superiority while sharing the same weakness. Sam conflates methodological parity with epistemic justification.  

  ### (3) Rae's Asymmetry of Burden  
  **Verdict:** **Lands**  
  **Why:** Rae nails the asymmetry:  
  - Harari’s thesis is presented as a **causal mechanism** (e.g., "shared fictions *enable* scaling"). This implies predictive/explanatory power (e.g., "without fictions, scaling fails").  
  - Graeber/Wengrow-style critiques are **polemics against inevitability**, not positive causal claims. They don’t predict outcomes; they reject determinism.  
  Her "moralizing high gods" example strengthens this: when tested (e.g., the Seshat database), the predicted sequence (gods → large societies) failed. This *does* indirectly weaken Harari’s broader untestable claims by showing a key *testable* component falters.  

  ### (4) Sam's Defense of Scope  
  **Verdict:** **Fails**  
  **Why:** Sam deflects but doesn’t engage Rae’s core point:  
  - Dismissing the gods study as "soft" ignores that it’s the *only* large-scale test of a component of Harari’s thesis. If gods are a subset of "fictions," their failure *should* prompt skepticism about the whole.  
  - Claiming "fictions" include non-deistic concepts (money, human rights) doesn’t help—these are *modern* institutions, irrelevant to explaining *prehistoric* transitions.  
  - Reducing "explains" to "marketing" is a dodge. Harari’s narrative is structured as a causal explanation; epistemology isn’t negated by commercial appeal.  

  ### (5) Rae's Reduction to Social Ontology  
  **Verdict:** **Lands**  
  **Why:** Rae correctly identifies that stripping Harari’s thesis to "institutions require shared beliefs" reduces it to an unobjectionable (but banal) social-theory platitude ("status functions" à la Searle). The *distinctive* part—that this *alone* explains sapiens’ dominance over Neanderthals/other species—*is* the just-so story. Without evidence that (a) Neanderthals lacked comparable institutions *and* (b) this was the *decisive* factor, the explanatory core collapses into speculation.  

  ### (6) Sam's Independent Support Defense  
  **Verdict:** **Partially Lands**  
  **Why:** Sam is right that a mechanism with independent support (e.g., modern social ontology) isn’t a *pure* just-so story. **BUT:** He ignores **scalar applicability**. A mechanism observed in *modern* societies (e.g., corporate personhood) doesn’t automatically explain *speciation-level outcomes* 50kya. Extrapolating it to prehistory *without direct evidence* is where just-so storytelling creeps in. "Independent support" from contemporary contexts ≠ validation for deep-time claims.  

  ---  

  ### Overall Verdict: **Rae is more right**  
  - She successfully argues that Harari’s thesis overreaches: its key causal claim (shared fictions as the *unique* sapiens advantage) is untestable for the relevant period and risks circularity.  
  - Sam’s defenses (methodological parity, independent support) don’t overcome the burden asymmetry: Harari’s narrative *sells itself as explanatory* but can’t be validated where it matters most.  

  ### Key Unresolved Questions  
  1. **Does Sam’s boomerang neutralize the just-so charge?**  
     **No.** While all grand narratives face unfalsifiability, Harari’s claims are *bolder* and more specific than critiques of linear progress. Polemics against "inevitability" make weaker claims, so the burden *is* asymmetric.  

  2. **Does retreating to "not novel" gut the thesis?**  
     **Yes.** Harari’s popular appeal hinges on the *origin story* of sapiens’ dominance. Reducing it to "institutions need beliefs" (which no one disputes) abandons the book’s core selling point.  

  ### What Both Missed  
  - **Two Senses of "Explains":**  
    - **Rae** uses "explain" as **causal-mechanistic** (e.g., "What *caused* sapiens to dominate?"). She demands testable mechanisms.  
    - **Sam** uses "explain" as **hermeneutic/narrative** (e.g., "How can we *make sense* of human dominance?"). He defends coherence over causality.  
    This divergence lets them talk past each other: Rae critiques Harari’s failure as science; Sam defends him as storytelling.  

  - **Missing Nuance:**  
    - **Cognitive Archaeology:** Both ignore proxies for "shared fictions" (e.g., symbolic artifacts, network trade) that *could* partially test Harari.  
    - **Alternatives:** Neither engages robust theories for sapiens’ success (e.g., dietary flexibility, collective child-rearing) that compete with "shared myths."  
    - **"Fiction" Ambiguity:** Harari conflates *symbolic thought* (e.g., ritual) with *institutional facts* (e.g., money). The former has ancient evidence; the latter does not.  

  ### Recommendation  
  Harari’s narrative is a compelling **heuristic framework**, not a falsifiable theory. It synthesizes ideas effectively but shouldn’t be mistaken for an explanation in the scientific sense. Rae wins on rigor; Sam on rhetorical utility. Next kitchen debate: invite an archaeologist. ☕
