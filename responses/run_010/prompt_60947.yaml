prompt: |-
  I work in heritage policy, mostly advising on commemorations, memorial inscriptions, and anniversaries, and over the last few years I have sat through a great many of them. A pattern keeps recurring that I cannot name, and I want to know whether the literature has a concept for it or whether I am looking at something that has simply never been separated out.

  Here is the pattern, in three instances.

  First: a secessionist movement loses, badly, and for two generations it keeps the anniversary of a final defeat as its central public event — names read aloud, graves tended, speeches about a claim that has never been renounced. Then the movement wins most of what it originally demanded: devolved government, official language status, control of schooling. Attendance at the anniversary collapses within a decade. What strikes me is not merely that the crowd thinned, but the reaction of the people who used to organise it. They describe the settlement as a graver betrayal than the defeat was, and their reasoning is explicit: under the defeat the ideal stayed whole and unspent, whereas the settlement converts it into administration. The loss is not that they got too little. It is that they got anything at all.

  Second: descendants of a defeated side, asked in an oral history project whether their grandparents would have wanted to win, reply that victory would have turned them into the kind of people they were fighting — and that the defeat is precisely what preserved the distinction. Here again the non-fulfilment is doing active work; it is not a residue of failure but the condition of the group's self-description.

  Third: a diaspora community that maintains a territorial claim in a formulation no negotiable treaty could satisfy, and that treats members who accept partial restoration as desecrating the dead more seriously than the original conquerors did. The formulation has drifted over the decades toward the unsatisfiable, and each drift was defended at the time as fidelity to the ancestors.

  The feature I want identified is narrow. I am not asking about the general habit of reframing a loss as morally superior; I have noticed something more specific and more counter-intuitive, namely that the commemorative structure appears to require the demand to stay unmet in order to keep generating the identity, the obligation to the dead, and the authority of the people who speak for them. Partial or full success does not resolve the memory, it deflates it, and so the custodians of the memory police success itself. The taboo runs against settlement, not against the enemy.

  So: is there an established concept for this, and if so what is it? I can anticipate several neighbours and I want to be told for each whether it fits or only approximates: the stab-in-the-back style explanation of a defeat; the idea of a moral victory; irredentism and revanchism as political programmes; the notion that communities select certain traumas to organise themselves around; and the psychoanalytic distinction between mourning that completes itself and a refusal to complete it, which people sometimes apply to nations. Where I have seen these invoked, none of them seems to capture the part I care about — the ones that want recovery actually welcome success, and the ones about refusal to grieve describe a stalled affect without explaining why settlement is policed as treachery and why the demand migrates toward formulations that cannot be met. If you agree that none of them fits, say so plainly and then coin a term, with a definition sharp enough to generate yes/no verdicts on new cases, and tell me the diagnostic criteria: what would I have to observe in a commemoration to know I was looking at this rather than at something else?

  The carving matters more to me than the label. Please be explicit about where the edges are. In particular: how does one distinguish this from a community that simply distrusts the terms on offer and would be perfectly satisfied by better ones? How does it relate to cases going the other way, where a partial victory energises a movement rather than deflating it — are those counterexamples that show the phenomenon is not a type at all, or a variant with a different mechanism? And does the phenomenon require that the defeat be military and collective, or does it also cover families, institutions, and firms with a founding failure they keep alive?

  Two further requests. First, tell me what would change your mind: which argument or which kind of case would make you conclude that this is not a distinct phenomenon but a by-product of something already named, and where in your own reasoning you are most likely to be wrong — for instance, if you are fitting my three instances to a concept you know well rather than testing it against instances that would strain it. Second, do not send me hunting for sources; work from concepts and definitions rather than a reading list, and if you are unsure whether a term is genuinely established or only something you have half-absorbed, flag that uncertainty instead of asserting it.

  Structure the response with short headed sections: nearest established concepts and their fit, the diagnosis of the described pattern, boundaries and discriminating tests, and your recommendation. End with a single final line in exactly this form:

  \answer{term or short phrase}

  containing either the established term you judge to fit best, or the term you coin, in six words or fewer.
reasoning: |-
  Hmm, the user works in heritage policy and has observed a recurring pattern in commemorations that they're struggling to name. They've described three specific instances where movements or groups experience what seems like success, only to find that their commemorative practices collapse because the settlement itself is seen as a betrayal. The core issue appears to be that the unmet demand is actually necessary for maintaining group identity and honoring the dead - success deflates rather than resolves the memory.

  Looking at the concepts they mentioned: Stab-in-the-back theories usually blame internal betrayal for defeat, not success. Moral victory focuses on claiming honor in loss, not policing against realization. Irredentism/revanchism actively seek recovery and would welcome success. Trauma organization explains why groups fixate on certain events but doesn't capture why settlement is rejected. Melancholia describes stalled grief but doesn't explain the active policing of success or demand escalation.

  The phenomenon seems distinct because it's not about reframing loss as superior, but about the commemorative structure requiring perpetual non-fulfillment. Success is taboo because it converts the ideal into administration, betraying the purity of the cause. The demand often escalates to become intentionally unsatisfiable.

  For diagnostic criteria: We'd need to see commemorative authority derived specifically from non-fulfillment, explicit rejection of settlement as betrayal (even favorable ones), demand escalation that makes fulfillment impossible, and commemorative collapse after success. This distinguishes it from groups that would accept better terms.

  Counterexamples where partial victory energizes movements might represent different dynamics - perhaps where the victory is framed as a step toward the ultimate goal rather than settlement. The phenomenon likely extends beyond military defeats to any foundational failure that becomes identity-defining.

  I should be cautious about overfitting their examples to familiar concepts. A case where custodians enthusiastically embraced an honorable settlement would challenge this as a distinct phenomenon. Or if demand escalation stopped when practical fulfillment became possible.

  I'll propose "commemorative entrapment" as a new term - defined as a commemorative structure where identity maintenance requires perpetual non-fulfillment of demands, such that realization triggers commemorative collapse and is framed as betrayal. This captures the self-sustaining mechanism and the taboo against settlement.
answer: |-
  ### Nearest Established Concepts and Their Fit
  1.  **Stab-in-the-back myth:** Fits the *explanation* for defeat (blaming internal betrayal), but not the *rejection of success*. Your cases treat *victory itself* (or settlement) as betrayal, not defeat. *Misfit.*
  2.  **Moral victory:** Explains framing loss as virtuous/pure, but assumes this *supplements* or softens the desire for tangible victory. Your cases show moral purity *requiring* tangible defeat/non-fulfillment. *Partial fit, but incomplete.*
  3.  **Irredentism/Revanchism:** Describe active political *programs seeking recovery*. Your custodians actively *police against recovery* or fulfillment, seeing it as corruption. *Opposite intent.*
  4.  **Chosen trauma:** Explains *selecting* a defeat as central to identity. Does not explain why *fulfilling the associated demand* destroys the commemorative energy or is seen as betrayal. *Partial fit, but misses the anti-fulfillment mechanism.*
  5.  **Melancholia (vs. Mourning):** Fits the *refusal to "complete" grief* or relinquish the lost object. However, it typically describes stalled *affect*, not the active *policing of political success* or the *escalation of demands* toward the impossible. *Structural similarity, but insufficient for the political/commemorative mechanics.*
  **Conclusion:** None fully captures the core mechanism: **the commemorative structure derives its identity-sustaining power and custodial authority *specifically* from the *permanent non-fulfillment* of the demand, making any settlement (even favorable) a betrayal that collapses the practice.**

  ### Diagnosis of the Described Pattern
  **Core Phenomenon:** A commemorative practice becomes structurally dependent on the *perpetual non-resolution* of a foundational grievance or demand. Fulfillment (partial or full) is experienced not as success, but as a desecration of the foundational loss and a dissolution of the identity/obligation constructed around it. This leads to:
  1.  **Commemorative Collapse:** Realization of demands deflates the commemorative energy.
  2.  **Betrayal Framing:** Custodians frame settlement as a *graver betrayal* than the original defeat, corrupting the "pure" ideal.
  3.  **Demand Escalation:** The core demand evolves toward formulations that are practically or logically *unsatisfiable*, ensuring perpetual non-fulfillment and preserving commemorative necessity.
  4.  **Authority Preservation:** Custodians' legitimacy hinges on interpreting the unmet demand and policing against settlement.

  **Mechanism:** The unmet demand functions as a "sacred obligation" to the dead. Fulfillment transforms this sacred, identity-defining debt into profane administration or compromise, annihilating the basis for collective obligation and the custodians' role as guardians of the pure ideal.

  ### Boundaries and Discriminating Tests
  To diagnose this specific pattern (vs. neighbours), observe:

  1.  **Source of Commemorative Energy:** Does the commemoration explicitly draw its *meaning and obligation* from the *state of non-fulfillment* itself? (e.g., speeches framing the "purity" or "sacred duty" inherent in the *unmet* demand).
  2.  **Reaction to Fulfillment:** Is settlement (even largely favorable) framed by custodians as a *betrayal* or *desecration* **specifically because it fulfills part of the demand**, corrupting the ideal? Is this reaction *stronger* than anger at the original defeat/opponent? (Key differentiator from mere distrust of terms).
  3.  **Demand Evolution:** Does the core demand *drift* towards formulations that are inherently *unsatisfiable* in practical terms (e.g., requiring reversal of irreversible history, absolute purity, terms no sovereign state could accept), **and** is this drift justified as *fidelity* to the ancestors/ideal?
  4.  **Custodial Policing:** Is there active condemnation of those accepting settlement as *more traitorous* than the original opponents? Does commemorative attendance/zeal *collapse* significantly *after* a settlement addressing the core grievance?

  **Distinguishing from Distrust:** A community distrusting *specific terms* would articulate *achievable alternative terms* and see fulfillment *on good terms* as positive. This pattern rejects the *principle of fulfillment itself* as corrupting, and demands evolve to *prevent* achievable settlement.

  **Counterexamples (Partial Victory Energizing):** These are likely **different phenomena**, not variants. They occur when:
  *   The movement frames partial victory as a *step* towards the ultimate goal, not the end.
  *   The commemorated loss is not *structurally dependent* on non-fulfillment; fulfillment *validates* the struggle.
  *   Custodial authority adapts to oversee the *next phase* of struggle/administration, rather than collapsing.
  *   *Mechanism differs:* Energizing uses success as momentum; your pattern sees success as dissolution.

  **Applicability Beyond Military Defeat:** The core mechanism can apply to **families, institutions, firms** with a foundational "failure" or unmet ideal that becomes sacred and identity-defining (e.g., a founder's unfulfilled vision, a lost legal case defining a group's "outsider" purity). The requirement is a *demand or ideal* elevated to sacred status through commemorative practice, where fulfillment annihilates the basis for commemoration and custodial authority.

  ### Recommendation
  The established concepts lack the precision to capture the **structural dependency of commemoration on non-fulfillment** and the **active policing of success as betrayal**. While melancholia and chosen trauma touch on aspects, they miss the specific political/commemorative mechanics and the taboo against *settlement itself*.

  **Coined Term:** **Commemorative Entrapment**

  **Definition:** A condition where the vitality, meaning, and custodial authority of a commemorative practice become structurally dependent on the perpetual non-fulfillment of a core demand or idealized restoration linked to a foundational loss. Fulfillment is experienced as a betrayal that desecrates the loss, collapses commemorative energy, and invalidates the custodians, leading to demand escalation towards the unsatisfiable to preserve the structure.

  **Diagnostic Criteria (Must observe A + B + C + D):**
  A.  **Commemorative Necessity of Non-Fulfillment:** The practice explicitly derives its core meaning, obligation, or group identity *from the state of the demand being unmet*.
  B.  **Fulfillment as Betrayal:** Settlement/fulfillment (even favorable) is framed by custodians as a *graver betrayal/desecration* of the foundational loss or obligation *than the original defeat/oppression*, specifically because it "sullies" the pure ideal.
  C.  **Demand Escalation:** The core demand evolves towards formulations that are practically or logically *unsatisfiable*, justified as maintaining fidelity to the ancestors/ideal.
  D.  **Custodial Collapse/Policing:** Commemorative participation/authority significantly declines post-settlement, accompanied by custodians policing against acceptance of settlement as treachery.

  ### What Would Change My Mind
  1.  **Argument:** A compelling demonstration that the rejection of settlement is *always* merely extreme distrust masking achievable (but currently unmet) demands, and that custodians would *embrace* fulfillment if their specific (achievable) terms were met. Your cases show rejection based on the *act* of fulfillment corrupting the ideal, not the terms.
  2.  **Case:** A clear case meeting A-D where custodians *enthusiastically embraced* an honorable settlement that met the core historical demand, proving the commemorative structure *could* incorporate success without collapse or betrayal framing. (Your examples suggest this doesn't happen).
  3.  **Overfitting Risk:** My reasoning risks overfitting your examples. A case where demand escalation *stopped* when practical fulfillment became possible, or where partial success *was* integrated into the commemoration as a step (without triggering collapse/betrayal rhetoric per criteria B & D), would challenge the distinctness of "entrapment" and suggest it's an extreme variant of melancholia/chosen trauma under specific conditions.

  \answer{Commemorative Entrapment}
