prompt: |-
  I host a podcast out of our cognitive science department, and next month's guest is a psychologist who's spent about twenty years running lab studies in support of linguistic relativity — color discrimination in speakers whose language has two basic blue terms instead of one, grammatical-gender effects on how people describe inanimate objects, and spatial frames of reference in communities that talk in absolute cardinal directions rather than left/right. She's warm and funny and shes extremely good at absorbing criticism by agreeing with it: her stock move is to say the effects were never supposed to be large, so any complaint about size just shows you read the straw-man version of the hypothesis.

  Give me ten to twelve questions in the order I'd actually ask them, each with a follow-up keyed to the answer she's most likely to give. No biographical softballs — nothing about what got her interested in language, nothing she could answer from a TED talk.

  Pressure points I want covered, roughly one question each:

  - the verbal-interference result: when a concurrent verbal task wipes out the cross-linguistic difference, she treats it as evidence that language is being recruited online, and skeptics treat the same result as evidence that the task was a language task all along. I need a question that makes her choose a horn instead of holding both, plus a follow-up for whichever way she goes.
  - effect size: what has to be true for a few tens of milliseconds to earn the word "relativity" rather than just "people are quicker with labels they use every day"? Where's the line between a real Whorfian effect and a mundane familiarity effect?
  - what level the claim is actually at — perception, memory/coding, or something closer to "thinking for speaking" — and whether narrowing it down that far leaves anything the historical Whorf would have recognized as his own view.
  - the confound that speakers of two languages also differ in schooling, writing systems, and how comfortable they are being tested; what design genuinely controls for that rather than assuming it away.
  - causal direction: maybe the lexical split is downstream of some culturally salient perceptual difference, not upstream of it. Ask her what evidence could distinguish those two.
  - one flat-out question about what result would make her abandon the view, and one that lets her name the single finding she thinks is the most robust thing she's ever produced.

  Under each question add one line for me: what a good answer sounds like, and what the evasive version sounds like, so I know when to push back live. Also mark which of the questions a hostile audience member is most likely to jump in on, so I can get there first.
reasoning: |-
  Okay, let me tackle this podcast host's request. They need sharp questions for a linguistic relativity expert, avoiding softballs and hitting specific pressure points. The guest is adept at deflecting criticism by agreeing with it, so questions must force concrete answers. 

  First, the core tensions: verbal interference duality, effect size meaning, claim scope, cultural confounds, causality, and falsifiability. Each needs a question that pins her position down, plus a follow-up trap for either answer. 

  For verbal interference, I'll force her to choose between "recruitment evidence" or "task artifact" - no both. Good answer would explain why interference doesn't redefine the task, evasive would retreat to "depends". 

  Effect size needs a threshold definition. She must specify when milliseconds become relativistic rather than familiarity. Good answer gives a principled line (e.g., when it predicts downstream effects), bad one hides behind "context-dependent". 

  Level-of-claim requires admitting what's stripped from Whorf's original. If she says "thinking for speaking", follow up on what's left of determinism. Control for confounds needs more than matching bilinguals - maybe testing monolinguals in homogenized environments. 

  Causality direction is tricky. A strong answer would cite bidirectional studies or lexical gap experiments; weak would handwave about systems co-evolving. 

  For falsification, demand specific disconfirming evidence - not just "more data". And her crown jewel finding should be one that survived toughest criticism. 

  Hostile audiences will pounce on verbal interference and effect size, so those go early. Follow-ups must preempt her stock "straw man" move by anchoring in her own past defenses. 

  Scripting the flow: Start with interference duality to hook skeptics, then effect size as most contentious, then drill down to mechanism before tackling confounds and causality. End with falsification and her strongest data. Keep questions clinical but with implied tension - "you've said X, but critics say Y, which is it?" 

  Good answers sound like they're narrowing uncertainty; evasive ones broaden to "it's complicated". I'll flag both versions for the host.
answer: |-
  Here are 12 tightly focused questions ordered for logical flow and escalating tension, with follow-ups designed to force specificity, plus your coaching notes. The most hostile-audience targets are **Verbal Interference** and **Effect Size**.

  ### Order & Strategy
  1.  **Start Concrete:** Ground the discussion in a specific, robust finding to avoid abstract waffling.
  2.  **Force the Binary:** Hit the Verbal Interference duality early when she's fresh and less guarded.
  3.  **Escalate Stakes:** Move to Effect Size – the core battleground.
  4.  **Define Scope:** Clarify *what* is being affected before discussing *how* or *why*.
  5.  **Address Confounds:** Tackle alternative explanations structurally.
  6.  **Causality & Falsification:** End with the hardest theoretical and evidential challenges.

  ---

  ### The Questions

  1.  **Core Finding:** "Let's start with what you consider the single most robust, replicable finding demonstrating linguistic relativity from your work. Describe the specific effect, the population, and the task."  
      *   *Likely Answer:* Describes a key finding (e.g., Russian blues discrimination speed, Guugu Yimithirr absolute spatial reasoning).
      *   **Follow-Up:** "Focusing on that specific effect, what is the *primary cognitive mechanism* you argue is responsible? Is it shaping perception itself, altering memory encoding/retrieval, facilitating attention, or primarily influencing 'thinking for speaking' during the response phase?"
      *   *Good Answer:* Clearly identifies one primary mechanism (e.g., "It modulates attentional allocation during encoding") and acknowledges if others contribute minimally. *Evasive:* Broadly gestures at "cognition," "processing," or "representation" without specificity, or insists all levels are inseparable. **Push if evasive.**

  2.  **Verbal Interference Crucible:** "A common critique of findings like the one you just described is that introducing a concurrent *verbal* interference task (like articulatory suppression) often eliminates the cross-linguistic difference. You interpret this as evidence language is being recruited online. Critics interpret the *same result* as evidence the original task was inherently linguistic/verbal from the start. Which interpretation is correct for your core finding, and why can't it be both?"  
      *   *Likely Answer:* Defends the "recruitment" view (e.g., "The interference disrupts the *online use* of language scaffolding, proving its role").
      *   **Follow-Up:** "If the interference *removes* the effect by disrupting verbal scaffolding, doesn't that imply the underlying non-verbal cognitive representation or perceptual ability *without* that scaffolding is actually identical across groups? Isn't that more aligned with the skeptic's 'task was verbal' view than a strong Whorfian claim?" **<-- MOST LIKELY HOSTILE JUMP-IN POINT**
      *   *Good Answer:* Clearly distinguishes the underlying ability from the online process, arguing the *process* difference is the relativistic effect, or provides evidence the underlying ability *is* subtly shaped long-term. *Evasive:* Repeats "recruitment online" without addressing the implication for underlying cognition, or tries to claim both interpretations are valid simultaneously. **Push hard here.**

  3.  **Effect Size Threshold:** "Let's talk magnitude. Many of these effects are statistically significant but operationally small – often differences of tens of milliseconds or a few percentage points in accuracy. What specific benchmark or criteria do *you* use to decide when an effect size earns the label 'linguistic relativity' rather than just reflecting mundane 'label familiarity' or task-specific processing fluency?"  
      *   *Likely Answer:* Argues for theoretical importance over raw size, context-dependence, or cumulative evidence.
      *   **Follow-Up:** "Could you give me a concrete, hypothetical example? Imagine a reaction time difference in a color task. Below what millisecond threshold (or what pattern of results alongside it) would *you* say, 'This is likely just label familiarity, not relativity'?" **<-- HIGH HOSTILITY RISK**
      *   *Good Answer:* Offers a specific principle (e.g., "When it predicts performance on a clearly non-verbal transfer task," "When it mirrors a categorical linguistic boundary *not* based on perceptual salience," "When it persists despite rigorous control for label frequency"). *Evasive:* Dismisses the need for a threshold ("Size isn't the point"), only gives relative comparisons ("Larger than familiarity alone"), or is impossibly vague. **Push.**

  4.  **Level of Claim:** "You mentioned [Mechanism X] earlier. If we accept that level of explanation – say, primarily affecting memory encoding or response selection rather than low-level perception – does this constitute a significant narrowing or revision of Benjamin Lee Whorf's original, more deterministic claims about language shaping 'habitual thought' and worldview? Is what you're demonstrating still recognizably 'Whorfian' in the historical sense?"  
      *   *Likely Answer:* Argues for a modern, nuanced interpretation compatible with core ideas, distancing from determinism.
      *   **Follow-Up:** "What specific element of Whorf's original writing or core thesis *must* be preserved for a finding to rightly be called 'Whorfian' or related to 'linguistic relativity'? Is it simply that language influences *some* aspect of non-verbal processing?"  
      *   *Good Answer:* Identifies a core principle (e.g., "Language can influence non-linguistic categorization," "Linguistic structure can bias attention/memory in specific ways") distinct from simple labeling. *Evasive:* Broadly claims continuity without specifying what's essential, or dismisses historical context entirely.

  5.  **Controlling Cultural Confounds:** "Beyond language, groups differing in linguistic structure often differ profoundly in cultural practices, education, literacy, physical environment, and familiarity with testing. What specific methodological design element in your own work do you believe most convincingly *rules out* these non-linguistic cultural factors as the true driver of the effect you see?"  
      *   *Likely Answer:* Cites within-culture bilingual studies, matched stimuli, or training studies.
      *   **Follow-Up:** "Take the bilingual approach. How do you specifically control for the possibility that bilinguals aren't two monolinguals in one head, but rather that learning a second language itself changes cognitive strategies or cultural outlook *independently* of the specific linguistic structures being studied? What design distinguishes language structure from the *act* of bilingualism?"  
      *   *Good Answer:* Details specific controls (e.g., testing dominant vs. non-dominant language use within bilinguals, matching bilinguals on age of acquisition/proficiency/cultural identification, using linguistic tasks *within* one language that vary in structure). *Evasive:* Asserts bilinguals are adequate proxies without addressing cognitive consequences of bilingualism itself, or relies solely on matching demographics superficially.

  6.  **Causal Direction:** "The perennial chicken-and-egg question: Could the linguistic differences you study (e.g., having two blue terms, using absolute directions) be a cultural *consequence* or codification of pre-existing, culturally-shared perceptual or attentional biases, rather than language *causing* the cognitive difference? What kind of evidence best breaks this correlation-causation deadlock?"  
      *   *Likely Answer:* Points to developmental studies, lab-induced linguistic training, or universals vs. specifics.
      *   **Follow-Up:** "Suppose you find that infants from Group A, *before* they've learned the relevant linguistic distinctions, show a tiny perceptual bias consistent with their future language's structure. Would that fundamentally challenge your interpretation, or could you still argue language amplifies and canalizes that initial bias?"  
      *   *Good Answer:* Clearly states how such a finding would refine (or potentially challenge) the causal model, e.g., "It would show an initial bias, but language's role in *maintaining* and *exaggerating* it is still relativistic," or "It would shift the emphasis, but the linguistic system's structure still plays a role." *Evasive:* Dismisses the hypothetical, insists language *must* be primary without evidence, or retreats to "it's bidirectional" without specifying testable predictions.

  7.  **The Gold Standard:** "Setting aside critiques and mechanisms for a moment, what single empirical finding from *any* lab in the last 20 years do you believe provides the most unassailable evidence for linguistic relativity? What makes it uniquely resistant to the standard criticisms?"  
      *   *Likely Answer:* Names a specific, well-controlled study (possibly her own) and highlights its strengths (e.g., non-verbal task, large effect, controls).
      *   **Follow-Up:** "What was the most serious methodological or interpretive challenge raised against *that specific finding*, and how was it (or could it be) addressed?"  
      *   *Good Answer:* Acknowledges a valid critique and describes a specific rebuttal, refinement, or replication addressing it. *Evasive:* Claims the finding is essentially unchallenged or dismisses critiques as ideologically motivated.

  8.  **Boundary Conditions:** "Where does linguistic relativity demonstrably *not* apply? What's an example of a cognitive domain or task where we see clear universals tightly constrained by perception or cognition, and language differences seem to have little to no measurable influence?"  
      *   *Likely Answer:* Cites examples like basic color perception (Hering), some aspects of number, core object recognition.
      *   **Follow-Up:** "Does identifying these boundaries help refine *where* and *how* linguistic effects are likely to operate? What's the key factor that makes one domain susceptible to linguistic influence and another resistant?"  
      *   *Good Answer:* Articulates a principle (e.g., domains requiring high-speed perceptual processing vs. higher-level conceptualization; inherently continuous vs. categorical domains; domains with weak perceptual anchors). *Evasive:* Gives weak examples or implies boundaries are just where we haven't looked hard enough yet.

  9.  **"Thinking for Speaking" Escape Hatch?** "Some argue that many 'Whorfian' effects are fully explained by 'Thinking for Speaking' – the uncontroversial idea that we orient our *attention* and *memory* to suit the demands of the language we're about to use *in that moment*. How do you distinguish a true relativistic effect (where language has shaped underlying cognition) from a pure 'Thinking for Speaking' effect that vanishes when language isn't being planned?"  
      *   *Likely Answer:* Argues for lingering effects, effects in non-verbal tasks without response planning, or developmental entrenchment.
      *   **Follow-Up:** "Can you point to a finding in your work that shows an effect persisting even when participants *know* they won't need to verbalize anything at all during the task?"  
      *   *Good Answer:* Cites a specific study or paradigm using implicit measures or purely non-verbal responses without any linguistic component. *Evasive:* Cites tasks with delayed verbal reports or argues "Thinking for Speaking" *is* a form of relativity.

  10. **Falsification:** "What specific, replicable empirical outcome would genuinely make you reconsider or significantly weaken your commitment to linguistic relativity as a powerful force? Not just 'more null results', but a particular pattern of findings that contradicts core predictions."  
      *   *Likely Answer:* Might say consistent failure of linguistic training to induce cognitive shifts, or finding identical cognitive patterns despite vastly different linguistic structures in a well-controlled domain.
      *   **Follow-Up:** "Has any result you've seen, or produced yourself, ever come close to meeting that criterion? What was it, and why wasn't it decisive?"  
      *   *Good Answer:* Describes a specific surprising or challenging result and how it was resolved or integrated without abandoning the core framework. *Evasive:* Proposes an unfalsifiable or unrealistic standard ("If language had *no* effect anywhere"), or claims no result has ever been challenging.

  11. **The Crown Jewel:** "Looking back on your 20 years of research, what single finding or experimental paradigm from *your own lab* are you most confident in? The one you believe has best withstood scrutiny and most conclusively demonstrates the phenomenon?"  
      *   *Likely Answer:* Describes her most robust, replicated finding.
      *   **Follow-Up:** "What was the toughest, most insightful criticism leveled at *that specific work*, and how did responding to it ultimately strengthen the finding or your understanding of it?"  
      *   *Good Answer:* Honestly recounts a significant critique and the empirical or analytical work done to address it, showing intellectual rigor. *Evasive:* Downplays critiques or attributes them to misunderstanding.

  12. **Broader Implications:** "Finally, stepping back – if we accept the validity of these effects at the level and magnitude you argue for, what concrete implication does this have beyond cognitive science? How should it change how, say, educators, policymakers, or AI designers think about language and cognition?"  
      *   *Likely Answer:* Discusses implications for education (bilingualism, concept learning), AI (bias in training data, meaning representation), or intercultural communication.
      *   *(No hard follow-up needed here - ends on a forward-looking note after the tough questions).*

  ---

  **Host Notes Summary:**

  *   **Pressure Points Covered:** Verbal Interference (Q2), Effect Size (Q3), Level of Claim (Q4), Confounds (Q5), Causal Direction (Q6), Falsification (Q10), Robust Finding (Q7, Q11).
  *   **High Hostility Targets:** Q2 (Verbal Interference) & Q3 (Effect Size) – Get here early.
  *   **Spotting Evasion:**
      *   **Good Answers:** Specific, cite concrete evidence/studies, acknowledge limitations or critiques, define terms, offer testable principles.
      *   **Evasive Answers:** Overly broad/vague language ("cognition," "processing," "influence"), retreat to bidirectionality without specifics, dismiss critiques as strawmen or ideological, redefine terms fluidly, appeal solely to cumulative evidence without addressing core challenges, talk around hypotheticals.
  *   **Pushing Back:** When evasion is spotted on Q2, Q3, Q5, or Q6, politely but firmly restate the core of the question, ask for specificity, and reference the "good answer" criteria ("Could you be more specific about the mechanism?" / "What *concrete* evidence distinguishes that from the alternative?" / "What specific threshold or principle applies here?").
  *   **Her Strength:** She's good at agreeing. Use this strategically in follow-ups: "You agree that [Critique X] is valid, so how does your model specifically address it?" Don't let her agree broadly and then pivot.

  This structure forces engagement with the toughest issues early and often, demands specificity, preempts common deflections, and gives you clear criteria to identify when to press for more. Good luck with the interview!
