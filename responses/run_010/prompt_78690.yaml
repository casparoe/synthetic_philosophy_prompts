  What they're pinpointing isn't the surface disagreement about technological politics, but a meta-pattern where both sides agree on all empirical facts yet endlessly relocate the "political" label along an accepted causal chain. The concrete example is vivid: one person says the overpass itself is political (because it actively excludes buses daily), the other says only human decisions are political (the long-dead standards committee). Neither denies facts, but they're stuck in a loop about predicate placement.

  Their analysis feels sophisticated - noticing this requires peeling back layers of argument. They're explicitly rejecting easy answers like "mere verbal dispute" or "reification," and their stormwater culvert counterexample shows careful boundary-testing. Their hunch about this pattern appearing in corporate/market debates rings true to me - it's fundamentally about agency attribution in systems.

  Key challenges in responding: 
  First, their core question about naming this phenomenon. After scanning philosophy of technology, STS, and metaphysics, I realize Latour's "delegation" and "inscription" come closest but don't name the relocation loop itself. "Attributional regress" might work, but needs unpacking. 

  Second, distinguishing their pattern from adjacent concepts. Reification is relevant but too broad; technological determinism misses the predicate-relocation aspect. The verbal dispute angle is tempting but doesn't capture the substantive stakes about responsibility they noted.

  Third, handling their boundary tests. The stormwater case where facts are disputed is importantly different - it's about historical interpretation, not predicate relocation. And yes, this absolutely appears in corporate law debates ("can corporations be morally responsible?" is structurally identical to "can concrete be political?").

  For the naming: I'll propose "attributional displacement" with three defining criteria: (1) factual consensus (2) predicate-relocation along a causal chain (3) substantive disagreement about responsibility. Then show how the bus overpass and scheduling software fit perfectly, while the stormwater case fails criterion 1. 

  The corporate responsibility parallel will help validate their hunch - the structure is identical whether debating concrete or corporations. Should also note how this differs from mere semantics: when someone says "the overpass is political," they're making a real claim about where intervention should happen (redesign vs policy change).

  This user deserves precision. Their examples suggest they'd appreciate concrete applications, so I'll include borderline cases: one that fits (traffic algorithms) and one that doesn't (disagreements about AI sentience where facts aren't settled). Might add that what makes this pattern stubborn is that both positions are partially right - artifacts do enforce politics, but only through human-maintained systems.
answer: |-
  Your observation is remarkably precise. What you've identified is a distinct pattern of argument that **lacks a universally accepted name**, but can be precisely defined. Here's a dissection, definition, differentiation from related concepts, and answers to your follow-ups.

  ### 1. The Core Pattern: Definition & Name
  *   **Name:** **Attributional Displacement** (or **Attributional Relocation**)
  *   **Definition:** A persistent disagreement occurring when parties *fully agree on all empirical facts and causal sequences* related to a system or artifact, but fundamentally diverge on *where along a continuous chain of cause-and-effect or constitution* a specific normative or agential property (e.g., "being political," "having agency," "bearing responsibility") should be primarily *attributed* or located. This displacement manifests as a cyclical relocation of the predicate ("It's here!" "No, it's back here!") without resolution, precisely because the disagreement is about the *framework of attribution* itself, not the facts.
  *   **Core Conditions:**
      1.  **Complete Empirical Consensus:** All parties agree on the physical properties, historical origins, causal mechanisms, and observable effects of the artifact/system/process.
      2.  **Agreed Causal/Constitutive Chain:** All parties implicitly or explicitly accept the same sequence of events or relationships linking initial human decisions/actions to the current state/effects (e.g., committee -> standard -> design -> construction -> physical structure -> exclusionary effect).
      3.  **Normative/Agential Predicate in Dispute:** The disagreement centers on applying a property typically associated with human intention or social relations (e.g., "political," "responsible," "agentic," "biased") to a specific *node* within this chain.
      4.  **Cyclical Relocation:** Counter-arguments consistently push the attribution of the property backwards (or occasionally forwards) along the chain, arguing it truly "belongs" at an earlier/later stage involving more direct human action or social context.
      5.  **Substantive Stakes:** The disagreement feels substantive because different attributions imply different loci of responsibility, blame, or intervention (redesign the bridge? change the standard? fire the manager? change the software? change labor laws?).

  ### 2. Differentiation from Your Guesses
  *   **Reification:** This is *related but broader*. Reification is the process of mistaking social relations/concepts for natural, immutable things. Attributional Displacement *can involve* reification (e.g., treating the bridge's effect as a brute fact of nature, ignoring its social origins). However, AD is a specific *argumentative pattern* arising *within* a context where reification is being contested. The disagreement *is about* whether attributing the property to the artifact *is* reification or a legitimate description.
  *   **Marx's "Relations between people appear as relations between things":** Similar to reification. AD is a concrete *instance* where this phenomenon becomes the *subject of argument*. One side sees the artifact's effect *as* the manifestation of social relations (politics), the other side sees attributing politics to the artifact *as* the very mystification Marx described. AD is the *debate sparked by* this phenomenon.
  *   **Merely Verbal Dispute:** No. While the dispute hinges on language (*where* to apply the word "political"), the disagreement reflects fundamentally different conceptual frameworks about agency, responsibility, and the ontology of sociotechnical systems. The stakes (where to intervene) are real and practical. It's a *metaphysical* or *conceptual* disagreement, not merely semantic quibbling over definitions.
  *   **Artifact Agency Controversy:** AD is a *specific form* this controversy often takes. The core question "Can artifacts have politics/agency?" frequently devolves into AD: "The politics is *in* the artifact!" vs. "No, the politics is only *in* the designers/users!" AD is the *dynamic* of the argument when empirical facts are settled.
  *   **Technological Determinism:** AD is orthogonal. Technological determinism is a thesis about *causal primacy* (tech drives social change). AD is about *attribution of normative properties* within an agreed causal chain. One *could* argue determinism in the bridge debate ("The bridge *forces* the detour"), triggering AD ("No, the *standard* forced the bridge design!"). But AD itself is the pattern of relocating the *attribution* of force/politics, not the claim about causation itself.

  **Closest Guess:** The debate over **"Artifact Agency"** is the overarching controversy, and **Attributional Displacement** is the predominant *argumentative pattern* that characterizes it when empirical facts are undisputed. Reification is the key *concept* one side accuses the other of committing.

  ### 3. Answering Your Follow-Up Questions

  1.  **The Stormwater Culvert Case (Disputed Facts):**
      *   **Verdict:** **A different kind of argument.** It merely *sounds* similar on the surface because it involves an artifact and claims about intentionality/effects.
      *   **Why it Falls Outside:** The **Complete Empirical Consensus** condition is violated. Disagreement about the *original engineers' knowledge and intent* is a disagreement about *historical facts* – what actually happened and what was in their minds. This is a standard historical/causal argument trying to establish *what the facts are*. Attributional Displacement only arises *after* the facts (including relevant historical intentions, if known) are settled. The stormwater case is likely about assigning *moral responsibility* based on contested intentions, not about where along an agreed chain a property like "political" should be located. It lacks the cyclical relocation *based on agreed facts*.

  2.  **Does this Structure Appear Outside Technology?**
      *   **Yes, pervasively.** Your hunch is astute. Attributional Displacement thrives wherever complex systems involve chains of human decisions, institutional structures, rules, and material outcomes. Common battlegrounds:
          *   **Corporate Responsibility:** "The *corporation* polluted the river!" vs. "No, the *decisions of specific executives* polluted the river, the corporation is just a legal fiction!" vs. "No, the *regulatory framework* failed!" (Chain: Laws -> Corporate Charter -> Board -> Executives -> Managers -> Employees -> Polluting Action).
          *   **Market Mechanisms:** "The *market* caused the housing crisis!" vs. "No, *individual lenders* making bad loans caused the crisis!" vs. "No, the *deregulation policies* created the conditions!" (Chain: Policies/Laws -> Regulatory Environment -> Financial Institutions -> Lenders/Borrowers -> Market Dynamics -> Crisis).
          *   **Legal Systems:** "The *law* is unjust!" vs. "No, the *judges* interpreting it are unjust!" vs. "No, the *legislators* who wrote it were unjust!" (Chain: Societal Values -> Legislative Process -> Statute -> Judicial Interpretation -> Application -> Outcome).
          *   **Bureaucracies:** "The *rules* are heartless!" vs. "No, the *clerks* applying them rigidly are heartless!" vs. "No, the *policymakers* who designed the rules prioritized efficiency!".
      *   **Why it Might Lack a Single Name:** The pattern is recognized implicitly within specific fields (e.g., debates about corporate personhood in law, structure vs. agency in sociology, intentional stance in philosophy of mind). However, it's rarely abstracted *as this specific argumentative pattern across domains*. Philosophers of language (meta-ethics, metaphysics) and argumentation theorists study related concepts (e.g., "levels of description," "explanatory reduction," "category mistakes"), but not this exact cyclical relocation dynamic with agreed facts. **Its natural home is the intersection of Philosophy of Technology, Science and Technology Studies (STS), Social Ontology, and Metaphysics.**

  ### 4. Defining the Edges: Borderline Cases & Verdicts

  *   **Case 1: Traffic Algorithm Bias**
      *   **Facts Agreed:** An algorithm used for traffic light timing consistently gives shorter green times to lights serving a predominantly low-income neighborhood. The training data reflected historical traffic patterns biased by past underinvestment. The coders followed specifications.
      *   **Argument A:** "The *algorithm* is biased." (Attribute to artifact)
      *   **Argument B:** "No, the *training data* was biased, the algorithm just reflects it." (Relocate backwards)
      *   **Argument C:** "No, the *city planners* who underinvested created the biased data." (Relocate further back)
      *   **Argument D:** "No, the *specifications* given to the coders were flawed; they just built what was asked." (Relocate to another node)
      *   **Verdict:** **Clear Attributional Displacement.** Full consensus on facts/chain. Cycling relocation of "bias." Stakes: Fix algorithm? Clean data? Change planners? Rewrite specs?

  *   **Case 2: "The Gun Killed Him"**
      *   **Facts Agreed:** Person A pointed a loaded gun at Person B and pulled the trigger. B died from the bullet wound. A intended to kill B.
      *   **Argument A:** "The *gun* killed him." (Attribute to artifact)
      *   **Argument B:** "No, *Person A* killed him using the gun." (Relocate to human agent)
      *   **Verdict:** **NOT Pure Attributional Displacement (Borderline).** Why? While there's relocation ("gun" vs. "A"), the disagreement often stems from different *implications* about responsibility or gun control, not fundamentally different locations for "killing" in an agreed chain. "The gun killed him" is usually understood as shorthand for "A killed B *with* the gun." The core fact of *who performed the lethal act* (A) is not usually contested in the same way the *politics* of the bridge or the *bias* of the algorithm is. It's more idiomatic/metaphorical or about emphasizing proximate cause vs. ultimate responsibility, lacking the deep conceptual clash over whether an artifact can *bear* a normative property like "killing" independently. If the argument became "The gun's design (hair-trigger) made the killing inevitable!" vs. "No, A's finger pulled it!" *and they agreed on all design/finger facts*, it would edge closer to AD.

  *   **Case 3: "Capitalism Causes Alienation"**
      *   **Facts Agreed?** The empirical reality of alienation (as defined) and the structures of capitalism are often *hotly contested*. There's rarely full consensus on the causal chain or even the phenomenon itself.
      *   **Verdict:** **NOT Attributional Displacement.** This is primarily a large-scale causal and interpretive dispute about history, economics, and society. The core conditions of empirical consensus and agreed causal chain are missing. Disagreement is about *what the facts are* and *how the system fundamentally works*, not about locating a predicate like "causes alienation" on a chain both accept.

  ### In Summary

  You've identified **Attributional Displacement**: a cyclical argument pattern where factual consensus coexists with irreconcilable disagreement over *where* to locate a normative/agential property (like "being political") along an agreed causal/constitutive chain, driven by divergent frameworks for understanding agency and responsibility in sociotechnical systems. It thrives in technology debates but is fundamental to arguments about corporations, markets, laws, and bureaucracies. It is distinct from disputes over facts, mere semantics, reification (though related), or technological determinism. The stormwater case lacks the required consensus; the corporate responsibility case exemplifies it. Its edges are defined by the strict conditions of consensus and cyclical relocation of the predicate within the chain.
