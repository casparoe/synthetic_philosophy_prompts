prompt: |-
  Acting as an archaeologist who actually knows the collapse literature — Tainter, Diamond, the resilience crowd, the whole did-they-fail-or-just-change debate — think carefully, and brainstorm candidate terms before you settle on one.

  There's a pattern I keep hitting and I don't have a word for it. Every marker we use to date a collapse sits at the top of the system: palace archives stop, dated royal monuments stop, the scribal script vanishes, prestige-goods trade dries up, big building halts. Meanwhile the markers of ordinary life go the other way — skeletons a couple generations later show fewer enamel defects, more varied diets, settlements spreading out into the countryside instead of crowding one center, grave goods less lopsided between rich and poor.

  Two cases that made me notice: Roman Britain, where the coin supply just stops in the early 400s and the next century is near-blank archaeologically; and the southern Maya lowlands going quiet on dated monuments while the north keeps building. Also that the Linear B tablets only survive because the palaces burned down, which feels telling.

  So it seems like two things are tangled up here: (a) the ruling apparatus goes away while most people actually get better off, and (b) the society stops producing the artifacts that made it legible, so the aftermath reads as a hole in the record no matter how people were living.

  Does either of those have an established name? Give me the nearest concepts, how each differs from what I described, which fits best, and whether (a) and (b) are really separable or the field deliberately keeps them fused (and why). If (b) has no name, coin one and give me the boundary cases — does it still apply when the writing survives but the state doesnt? A bare label wont cut it, I want the edges.
reasoning: |-
  Okay, let me tackle this archaeologist's terminology puzzle. They're describing a pattern where collapse markers focus on elite systems disappearing while evidence suggests ordinary life improves, creating an archaeological "invisibility" of post-collapse societies. 

  First I need to unpack their two core observations: (a) ruling apparatus dissolution coinciding with improved living standards for commoners, and (b) the disappearance of artifacts that make societies archaeologically visible. The examples of Roman Britain and Maya collapse are classic cases where this plays out.

  For concept (a), "elite failure" comes to mind but it's too narrow. "Resilience transition" captures the adaptive shift but implies intentionality. "Subsistence intensification" describes the rural shift but misses the power structure change. Actually "structural simplification" seems closest - it's neutral about outcomes and focuses on organizational change without assuming decline. 

  Now for concept (b), this is trickier. "Epigraphic disappearance" is too writing-specific. "Monumental hiatus" only covers big architecture. "Legibility collapse" feels right - it directly addresses how societies become archaeologically invisible when state-produced artifacts vanish. The boundary cases are interesting: when writing continues without the state (like post-Roman Gaul) it's partial legibility loss, not full collapse.

  The key insight is these phenomena are intrinsically linked. The archaeological record's bias toward elite markers means the dissolution of power structures creates both (a) and (b) simultaneously. We can't separate them because the same event - the state's disappearance - removes both the oppressive structures and the visibility mechanisms. 

  For the Maya case specifically, the north/south divergence shows how "collapse" is regional - when legibility continues elsewhere, it highlights how localized the phenomenon is. The Linear B example perfectly illustrates how palace destruction accidentally preserved the very records that document the system's existence.

  I should emphasize that "structural simplification" and "legibility collapse" work best as paired terms. The former describes the social process, the latter the archaeological consequence. Together they capture this pattern without the baggage of "collapse" language while acknowledging the field's epistemological constraints.
answer: |-
  Based on your description and the collapse literature, here's a breakdown of the concepts, candidate terms, their distinctions, and the relationship between (a) and (b):

  **Core Concepts:**
  1.  **(a) Elite Disintegration & Commoner Flourishing:** The dissolution of centralized political/economic power structures (state, elite class, specialized bureaucracy) coupled with evidence of improved well-being, resilience, or autonomy for the non-elite majority.
  2.  **(b) Epistemic Collapse:** The sudden cessation of artifact production/accumulation that creates an archaeologically "legible" record, making subsequent periods appear as a "dark age" regardless of actual societal conditions.

  **Candidate Terms & Analysis:**

  1.  **For (a):**
      *   **Elite Failure:** Simple, but implies only the elite suffered, missing the potential *improvement* for others. Too narrow.
      *   **Structural Simplification (Tainter):** Central concept. Focuses on the *dissolution of complex, energy-intensive hierarchies*. **Pros:** Directly addresses the disappearance of the ruling apparatus. Neutral on outcomes (allows for commoner improvement). **Cons:** Doesn't explicitly capture the *improved conditions* for non-elites, just the removal of complexity. **Fits well for the *mechanism* of ruling apparatus disappearance.**
      *   **Resilience Transition (Holling, Resilience Alliance):** Focuses on a system moving to a different, potentially more stable state. **Pros:** Captures the shift away from a vulnerable complex state. Allows for positive outcomes locally. **Cons:** Too broad; many transitions aren't triggered by "collapse," and it implies more conscious adaptation than might occur. Doesn't emphasize the *disintegration* aspect.
      *   **Subsistence Intensification / Ruralization:** Describes the *pattern* (spreading out, varied diets) but not the *cause* (elite removal). It's an effect, not the core process.
      *   **Decentralization / Deurbanization:** Describes a spatial/political pattern, but misses the well-being aspect and the *causal link* to elite removal.
      *   **Best Fit:** **Structural Simplification** is the closest established concept for the *disintegration of the ruling apparatus*. To explicitly include the *commoner outcome*, we need to qualify it: **Structural Simplification with Commoner Resilience/Benefit**. This highlights the core process (simplification) and the observed positive consequence.

  2.  **For (b):**
      *   **Epigraphic Disappearance / Hiatus:** Too narrow (only writing).
      *   **Monumental Hiatus:** Too narrow (only big buildings/monuments).
      *   **Prestige Goods Collapse:** Too narrow (only elite trade).
      *   **Archaeological Invisibility:** Describes the *result* (the "hole"), but not the *process* causing it. It's the symptom, not the disease.
      *   **Legibility Collapse (New Term Proposal):** This directly addresses your core insight. **Definition:** *The rapid cessation of activities generating durable, chronologically sensitive, and socially centralized material signatures (writing, coinage, monumental construction, elite tombs, standardized prestige goods), resulting in a significant loss of archaeological resolution and societal "readability" for subsequent periods.*
          *   **Boundaries & Nuance:**
              *   **Writing Survives, State Doesn't (e.g., Post-Roman Gaul, some Post-Classic Maya sites):** This is **Partial Legibility Loss**, not full collapse. Administrative/royal writing stops, but other forms (religious, legal, mercantile) may persist, offering *some* legibility, albeit different and often reduced. Legibility Collapse implies the *near-total* loss of the *primary state-generated* signature toolkit.
              *   **Non-State Legibility (e.g., early medieval Ireland, Viking Age Scandinavia):** Societies can be legible without states through other means (hoards, distinctive vernacular art/styles, prolific non-elite settlements). Legibility Collapse specifically refers to the *loss of the state-produced legibility apparatus* upon which archaeologists heavily rely for complex societies. Its impact is proportional to how reliant our dating/understanding was *on that specific apparatus*.
              *   **Gradual Decline vs. Collapse:** A slow fade (e.g., reduction in monument size/quality over centuries) isn't Legibility Collapse; it's a degradation. Collapse implies a *relatively rapid cessation* (1-3 generations), creating a sharp discontinuity in the record.
              *   **Cause:** Legibility Collapse is *caused* by Structural Simplification – the institutions and specialists producing these signatures vanish or radically transform.

  **The Relationship Between (a) & (b): Are They Separable?**

  *   **Intrinsically Linked, Not Fused:** The field *recognizes* they are distinct phenomena but understands they are **causally linked and often archaeologically conflated**.
  *   **Causal Link:** **(a) Structural Simplification** (disintegration of ruling apparatus) is the primary *cause* of **(b) Legibility Collapse**. Remove the palace, the scribes, the state mint, the coerced labor for monuments, the elite demand for prestige goods – and the signatures disappear.
  *   **Archaeological Conflation:** The field often *observes* (b) Legibility Collapse *first* and *infers* (a) Structural Simplification (and often incorrectly assumes *societal* collapse). Your key insight is that (b) masks the reality of (a), which might involve commoner benefit. The "hole" is the *absence of elite signatures*, misinterpreted as the *absence of society*.
  *   **Why the Conflation Persists (Deliberately?):**
      *   **Methodological Bias:** Archaeology developed dating sequences and narratives heavily reliant on elite artifacts (coins, inscriptions, monuments). They are chronologically precise and culturally diagnostic.
      *   **Source Bias:** Historians (reliant on texts) amplify this, as textual collapse *is* Legibility Collapse for their discipline.
      *   **"Collapse" Narrative:** The dramatic disappearance of pyramids, writing, and palaces makes a compelling (and often catastrophist) story of "the end." Documenting dispersed farmsteads with better nutrition is less dramatic and methodologically harder (sampling bias, dating imprecision).
      *   **Not *Always* Conflated:** Better methodologies (e.g., intensive regional survey, bioarchaeology, isotopic analysis, OSL dating) are actively working to "see through" Legibility Collapse and understand (a). Work on "dark age" periods (e.g., post-Roman West, Post-Classic Maya) exemplifies this. However, the *initial identification* of a "collapse phase" still overwhelmingly relies on detecting (b).

  **Conclusion & Best Fits:**

  1.  **For (a):** **Structural Simplification** is the established core concept for the dissolution of the ruling apparatus. To fully capture the pattern you observe, it should be qualified as **Structural Simplification with Commoner Resilience/Benefit** or **Structural Simplification Leading to Commoner Flourishing**.
  2.  **For (b):** This lacks a perfect established single term. **Legibility Collapse** is a strong, descriptive candidate term capturing the *process* of losing the material signatures that make a society archaeologically visible and datable. It is directly *caused* by Structural Simplification.
  3.  **The Pattern:** The overall pattern you describe is **Structural Simplification triggering Legibility Collapse, which masks potential Commoner Resilience/Improvement.** The "collapse" we see archaeologically is often primarily Legibility Collapse, misinterpreted as societal collapse due to the source bias inherent in the archaeological record of complex societies.

  **In essence:** What collapses is not necessarily the society *for most people*, but the *specific complex superstructure* and, critically, *its material signature-generating capacity*. The "hole in the record" is a real phenomenon (Legibility Collapse), but it's a shadow cast by the vanishing elite apparatus, not necessarily an accurate map of lived experience. Your cases (Roman Britain's coinless century, the Maya "collapse", Linear B's accidental preservation) are textbook examples of this dynamic. The field is grappling with separating them, but the legacy of relying on elite markers for dating and definition makes it a persistent challenge.
