prompt: |-
  Got walked into this by a friend who runs communications for a charity and I can't find the exit. Here's the chain as he gave it to me:

  (1) It's wrong to try to change what someone believes or does by means that bypass their ability to weigh reasons — that's the version of treating people as mere means that I actually find plausible. (2) Anything that makes a claim land harder than the evidence on its own would is such a means. (3) Stories, images, and emphasis work exactly that way: one identifiable victim moves people more than a million anonymous ones, and that discrepancy is precisely why you use them. (4) So leading with the story of a single kid is wrong even when the story is true and the numbers behind it are accurate. (5) Same test, same verdict, for things I don't want condemned: a teacher choosing which examples go on the board and in what order, a scientist who opens with the striking result rather than burying it in section four, anyone who repeats a point for effect. All of them are managing saliance instead of laying out the evidence with equal weight. (6) So either (1) is false, or ordinary teaching and scientific writing are impermissible. (7) My friend says (6) is just the honest conclusion — all communication is manipulation, we should admit it and drop the pretense.

  That last bit feels like a shrug rather than an argument, but I genuinely can't tell whether the chain is invalid somewhere or valid and I should keep (1) and eat the cost. So: which step do you reject, why did it look innocent going in, and what does rejecting it cost? I'd rather hold onto (1) than (4) if it comes to a choice.

  Two asks. Please be clear about where there's something like agreement among people who work on this versus where it's genuinely contested — I don't want your own take dressed up as the consensus view. And no headings, bullets, bold, or tables; just continuous prose, the way you'd write an email.
reasoning: |-
  Okay, the user is grappling with a philosophical dilemma presented by a friend in charity communications. The core tension is between ethical principle (1) about not bypassing rational faculties and the practical necessity of narrative tools in communication. 

  Hmm, the user seems philosophically literate but frustrated by the friend's shrug-like conclusion that "all communication is manipulation." They want to know which step to reject while preserving principle (1), and explicitly request clarity on academic consensus versus contested views. 

  First, let's map the logical chain: Premise (1) establishes a Kantian-esque principle against bypassing reason. (2) defines "bypassing" as anything amplifying claim beyond evidential weight. (3) observes psychological reality of narrative tools doing exactly that. (4)-(5) apply this to charity cases and pedagogy. (6) presents the forced choice, and (7) is the friend's cynical resolution.

  The consensus rejection point is clearly (2). The literature overwhelmingly distinguishes between bypassing reason (e.g., subliminal messaging) and working through reason via engagement tactics. Cognitive psychology shows humans don't process "raw evidence" neutrally - we're narrative creatures. Even rigorous academics use illustrative examples. 

  Where it gets contested is how far this license extends. Hardliners might view emotional storytelling as inherently manipulative, but most ethicists accept some salience-management as necessary for epistemic access. The cost of rejecting (2) is accepting that communication requires framing choices - but this needn't collapse into "all manipulation." We maintain (1) by ensuring tools enhance rather than replace evidentiary engagement.

  For the user's context: Charity comms can ethically use individual stories if they're (a) representative samples (not outliers) and (b) gateways to systemic evidence. The teacher analogy holds - selecting examples isn't wrong if they illuminate (not obscure) truth. The real test is whether the tactic would still work if the audience knew the full context.

  User’s preference to save (1) is wise - abandoning it would indeed justify propaganda. But we save it by refining what "bypass" means, not by denying communication's pragmatic dimensions.
answer: |-
  Here's how the chain breaks down, reflecting where the consensus lies among ethicists and communication theorists, where it's contested, and why rejecting a specific step resolves the dilemma while preserving principle (1):

  The most widely rejected step, and the one with the strongest consensus against it, is **(2)**: "Anything that makes a claim land harder than the evidence on its own would is such a means [bypassing reason]."

  **Why (2) is rejected (Consensus View):**
  The core problem with (2) is its assumption that "the evidence on its own" has a single, objective "landing force" independent of presentation, and that any amplification beyond this neutral baseline inherently bypasses rational evaluation. This view is generally considered empirically false and philosophically untenable. Human cognition doesn't process "raw evidence" neutrally. Factors like cognitive load, attention spans, background knowledge, inherent biases (like scope insensitivity - struggling to grasp large numbers), and the need for conceptual framing mean evidence *requires* structuring and presentation to be understood *at all*. Making evidence salient, memorable, and relatable through narrative, emphasis, or ordering isn't bypassing reason; it's *enabling* reason by making the evidence comprehensible and engaging enough *for* rational consideration to occur. A dense statistical table about famine might contain all the "evidence," but if no one reads it or grasps its significance, rational engagement hasn't been facilitated; it's been thwarted. Techniques like using a representative individual story or emphasizing key findings are widely seen as legitimate tools to *overcome barriers* to rational engagement, not circumvent it. They work *through* the audience's capacity for empathy and understanding, not around it, assuming the story is truthful and representative.

  **Why (2) Looked Innocent Going In:**
  (2) appears plausible because it targets obvious manipulative tactics (e.g., using misleading music, exploiting subconscious fears, presenting outliers as typical). It draws on a valid intuition: *distorting* evidence or *hiding* counter-evidence through presentation *is* wrong. The mistake is equating *any* effort to make evidence impactful or comprehensible with distortion or bypassing. It conflates making evidence *effective* with making it *coercive* or *irrational*. The step seems like a simple logical extension of (1) if you assume a mythical "neutral presentation" exists.

  **The Cost of Rejecting (2):**
  Rejecting (2) costs the simplicity of a bright-line rule against *any* rhetorical enhancement. It requires accepting that communication inevitably involves judgment calls about framing, emphasis, and narrative to make evidence accessible and meaningful. This means there's a spectrum: techniques can be more or less faithful to the underlying evidence and more or less respectful of the audience's rationality. The ethical burden shifts to ensuring that the presentation:
  1.  **Is Truthful & Representative:** The story or emphasis accurately reflects the broader reality (e.g., the single kid *is* a genuine victim of the larger crisis, not an outlier used misleadingly).
  2.  **Facilitates Understanding:** It helps the audience grasp the significance or scale of the evidence they might otherwise miss or dismiss.
  3.  **Does Not Obscure Counter-Evidence:** The presentation shouldn't actively hide or undermine relevant counter-arguments or complexities necessary for a balanced judgment (though full complexity might be presented later or in different contexts).
  4.  **Respects Agency:** The goal is to engage the audience's reason so they can make their *own* informed judgment, not to trigger an automatic, unreasoned response.

  **How This Resolves the Chain & Preserves (1):**
  By rejecting (2), steps (3), (4), and (5) no longer follow automatically.
  *   **(3):** Stories, images, and emphasis *can* work by engaging reason through relatable examples and overcoming cognitive biases, not solely by bypassing it. The discrepancy in response to one victim vs. statistics is often due to a *failure of reason* (scope insensitivity) that a story helps *correct* by making the scale emotionally comprehensible, thereby *enabling* a more reasoned response.
  *   **(4):** Leading with a true, representative story isn't inherently wrong; it's often the most ethical and effective way to make the accurate numbers *meaningful* and prompt rational concern and action.
  *   **(5):** A teacher's curated examples, a scientist's emphasis, or rhetorical repetition are standard pedagogical and communicative tools for *structuring understanding*. They manage salience to *direct attention to what's important*, not to *prevent* the audience from weighing evidence. They aim to build comprehension, not bypass it.
  *   **(6):** The forced choice between rejecting (1) or condemning ordinary communication disappears. Ordinary teaching and scientific writing, done ethically, *use* these techniques to *fulfill* (1) by making evidence weighable.
  *   **(7):** While *some* communication *is* manipulative (e.g., propaganda, deceptive advertising), rejecting (2) allows us to distinguish manipulative bypassing from legitimate, reason-engaging communication. "All communication is manipulation" becomes an unhelpful oversimplification that fails to capture this crucial ethical distinction.

  **Contested Ground:**
  The *application* of the criteria above (truthfulness, representativeness, facilitating understanding, not obscuring counter-evidence) is where genuine contestation lies. Ethicists debate:
  *   How much emotional appeal is permissible before it overwhelms reason?
  *   When does simplifying complex evidence become misleading?
  *   Is using psychologically potent techniques (even truthfully) inherently risky or disrespectful?
  *   How do we define "representative" in practice?
  The consensus rejects the *absolute ban* implied by (2), but there's ongoing debate about the *boundaries* of ethically permissible salience management. Your friend's charity work sits squarely in this contested space, requiring careful judgment about how individual stories are used relative to the systemic evidence.

  **Conclusion:**
  Rejecting (2) preserves your core principle (1) – it remains wrong to bypass reason. It avoids the absurd cost of condemning essential, ethical communication practices like teaching or scientific reporting. The cost is accepting that ethical communication requires thoughtful, responsible use of framing and emphasis to make evidence *rationally accessible*, constantly navigating the grey areas between enabling understanding and risking manipulation. Your instinct to save (1) is sound; rejecting (2) allows you to do that without embracing cynicism.
