prompt: |-
  I cover science and ideas for a general-interest magazine, and for the past year I have been reporting a feature on the state of the species concept: a field station in the American West, a museum collections drawer, a population-genetics lab, a back-breeding project in the Karoo. Before I write it I need to know what I myself believe, because "the experts disagree" is turning out to be my way of not having a position. So here is my honest list of verdicts, arrived at by gut rather than by argument.

  1. Ensatina. The salamanders that ring California's Central Valley: every population breeds with its immediate neighbor all the way around, but where the two ends of the ring meet in the south they behave as though the other did not exist. My verdict: one species — though I say it unhappily, and I suspect I say it mainly because the ring is famous.

  2. The flycatchers. Two small birds that nobody could reliably tell apart in a drawer until it emerged that they sing different songs and do not respond to each other's. My verdict: two species, without hesitation. If a curator cannot separate them, so much the worse for the curator.

  3. The elephants. Two kinds of African elephant long written up as one, differing in build and habitat, now carrying separate names in the conservation literature, hybridizing where their ranges touch. My verdict: two species, and the hybrid zone does not trouble me at all.

  4. The Italian sparrow. A bird with its own appearance and range across most of Italy that originated as a hybrid between two other sparrows and has held its own ever since, without human help. My verdict: a real species, and one of the most interesting facts in the entire debate.

  5. Pizzly bears. Polar bear by grizzly, fertile, increasingly common as the ice retreats. My verdict: not a species — a symptom. I would not want an illustration of one captioned as a newly discovered species in my own magazine.

  6. Dogs and wolves. Freely interfertile, one descended from the other, and so unlike each other that almost no one outside biology would call them the same kind of animal. My verdict: one species. I hold this firmly, which surprises me, because I cannot immediately say why it feels more firm than my verdict in 2.

  7. Bdelloid rotifers. No males that anyone has ever found, lineages separate for a very long time, clustered into forms that behave like species ecologically and morphologically. My verdict: they are species, and any account I settle on that makes interbreeding essential is refuted by them on the spot.

  8. Neanderthals. They and my ancestors exchanged genes, and I carry some of the result. My verdict: separate species, emphatically. I worry this verdict is mostly drama and mortality — that I would say something quite different about the same two populations if both were still walking around.

  9. Bacteria. My verdict: no species, properly speaking. The word is bookkeeping, and it is harmless bookkeeping that has been mistaken for metaphysics. This sits badly with 7, and I do not know what to do about it.

  10. The gulls. The other textbook ring, the one that goes around the Arctic, which I have since read is not really a ring once you look at the genetics. My verdict, such as it is: that losing the example has cost me no confidence in the idea it illustrated — which strikes me as suspicious in itself.

  My tentative principle, which I cannot defend and would like tested: two populations are separate species when each would remain itself on its own, with nothing else holding them apart. It seems to get 4 right, since the sparrow holds itself apart. But it also seems to imply that the bears of 5 are on their way to becoming a species, since nothing but ice and distance separates them and both are going away — a prediction I do not want. And it appears to endorse 6 while condemning 2, unless song somehow counts as help from outside.

  What I need from you:

  Do not write the survey. I have read the tour of the biological, phylogenetic, ecological, genic and recognition concepts with their standard objections, and so has any competent feature writer. Names may appear only at the very end, as a check on where I have independently landed — never as the organizing principle of the answer. Build the principle out of the verdicts above. Where a clause exists solely to handle one case, say so and name the case; where a clause is doing unearned work, cut it. Make it precise enough that I could hand it to a colleague and get the same answers back: lineage, independence, and cohesion are the words I keep catching myself using loosely, and they are the ones I most need pinned down. And where my verdicts cannot all be kept, tell me plainly which one goes and what the loss costs.

  Please use exactly these sections, in this order:

  1. Bottom line (about 150 words). Which of the ten verdicts a single principle can keep, how many you have to break, and the principle itself in a sentence or two.

  2. The principle (700–900 words). Clause by clause, each clause followed in parentheses by the numbered case that forced it on you, plus a short gloss on what the operative terms are to mean.

  3. The two hard pairs (about 400 words). Case 4 against case 5 — a stable hybrid lineage and a hybrid that is not — and case 2 against case 6 — indistinguishable birds that are two species and wildly different canids that are one. Show me the mechanism that separates them, or concede that there is none.

  4. What I have to give up (about 300 words). The verdicts your principle cannot accommodate, why each felt compelling, and what a second principle would have to look like if I insisted on keeping them.

  5. Candidate B (about 350 words). That second principle, stated to the same standard, with its own price. Say which of the two you would defend in print and why.

  6. New cases (about 400 words). Your principle's verdict on four cases I have not listed: a population that split recently and looks nothing like its parent yet is freely fertile with it; a widespread organism whose local forms intergrade everywhere except on one island; a captive lineage that has bred apart from its wild relatives for a century and would not recognize them if released; and an extinct population known from a handful of specimens whose DNA places it inside a living species. Then, briefly: the South African project that is selectively breeding plains zebras toward the extinct quagga's reduced striping. If it succeeds, is the resulting animal a quagga — and is that a question your principle must answer, or one it is entitled to decline?
reasoning: |-
  Hmm, the user is a science journalist working on a feature about the species concept. They've listed their intuitive verdicts on ten tricky cases and want help building a coherent principle from them. The challenge is to create a definition that respects their judgments while being logically consistent, without falling back on textbook concepts.

  Looking at their verdicts, I notice some key tensions: They accept stable hybrids (Italian sparrows) but reject unstable ones (pizzly bears). They treat morphologically indistinguishable birds as separate species based on behavior, but lump wildly different canids together. And they make special exceptions for asexual rotifers while rejecting bacterial species entirely.

  Their "tentative principle" about populations remaining themselves without external help is insightful but problematic - it would validate the pizzly bears as incipient species, which they explicitly reject. This suggests we need to incorporate some notion of stability or independence over evolutionary time.

  The user explicitly forbids organizing by existing species concepts, so I'll need to build from the ground up using their cases. Cases 4 (Italian sparrow) and 7 (rotifers) seem particularly important - they demand that we allow non-interbreeding lineages to count as species. But case 9 (bacteria) draws a hard line against applying this to microbes.

  For the hard pairs: The sparrow/bear distinction likely hinges on reproductive independence - the sparrows maintain distinctness without hybridization pressure, while pizzly bears only exist because of unnatural range overlap. For flycatchers vs canids, the difference may be that songbirds use learned behaviors as reproductive barriers, while canids lack such mechanisms despite morphological divergence.

  The toughest sacrifice will probably be their Neanderthal verdict. Their principle would likely classify them as subspecies since they interbred successfully. Keeping "separate species" would require introducing temporal or qualitative criteria about hybridization that could unravel other cases.

  For new cases: The captive lineage raises fascinating questions about reproductive compatibility versus behavioral isolation. And the quagga project forces us to confront whether species are defined by ancestry or traits - under the principle I'm developing, the back-bred zebras wouldn't be quaggas because they lack the historical lineage, only the phenotype.
answer: |-
  Here is a principle built from your verdicts, rigorously tested against your cases, with clear costs and alternatives:

  **1. Bottom Line (156 words)**
  Your principle can retain verdicts 1-7 and 10 by defining a species as: **"A lineage of populations maintaining cohesive evolutionary independence over generational time."** This requires breaking verdict 8 (Neanderthals) and verdict 9 (bacteria). The lineage clause (cases 1,4,7,10) establishes historical continuity. Cohesion (cases 2,3,6) captures shared traits or genetics enabling identity persistence. Evolutionary independence (cases 3,5,7) means distinct evolutionary trajectory without relying on external barriers. "Over generational time" (cases 4,5) excludes transient hybrids and demands stability. This framework keeps your core intuitions: Ensatina’s cohesive ring (1), flycatchers’ behavioral independence (2), elephants’ distinct trajectories despite hybridization (3), the Italian sparrow’s stable lineage (4), pizzly bears’ lack of independence/stability (5), wolves/dogs’ shared trajectory (6), rotifers’ cohesive lineages (7), and gulls’ conceptual validity (10). Neanderthals (8) and bacteria (9) cannot fit without contradiction.

  **2. The Principle (Clause-by-Clause)**
  *   **"A lineage of populations..."** (Cases 1, 4, 7, 10): A historically continuous set of ancestor-descendant populations. This excludes transient hybrids (Pizzly bears, 5) but includes stable hybrid-derived lineages (Italian sparrow, 4) and ancient asexuals (Rotifers, 7). *Operative meaning:* Genetic or demographic connectivity tracing back to a common ancestor; demonstrable historical continuity within the group.
  *   **"...maintaining cohesive..."** (Cases 2, 3, 6, 7): Possessing intrinsic mechanisms or shared attributes that bind individuals within the lineage and distinguish them from others. *Operative meaning:* Shared phenotypic traits, genetic clusters, behavioral recognition systems, or ecological adaptations that promote association within the group and distinction from others. Cohesion can be genetic (Elephants, 3), behavioral (Flycatchers, 2), morphological (Rotifers, 7), or a combination (Dogs/Wolves, 6).
  *   **"...evolutionary independence..."** (Cases 3, 5, 7): The capacity to pursue a distinct evolutionary trajectory not dictated by gene flow from other lineages. *Operative meaning:* Limited or absent significant gene flow *that erodes distinctiveness* OR the ability to persist and diverge despite potential gene flow due to strong cohesion. Hybridization (Elephants, 3) doesn't negate independence if distinct trajectories persist. Asexuals (Rotifers, 7) are inherently independent. Pizzly bears (5) lack independence; their existence/hybridization is driven by external disruption, not intrinsic divergence.
  *   **"...over generational time."** (Cases 4, 5): A state of cohesion and independence sustained long enough to demonstrate persistence beyond ephemeral events. *Operative meaning:* Multiple generations (significantly longer than the lifespan of an individual) demonstrating the maintenance of lineage identity, cohesion, and independence. This excludes unstable hybrids (Pizzly bears, 5) but includes stable, self-perpetuating hybrid lineages (Italian sparrow, 4).

  **3. The Two Hard Pairs**
  *   **Case 4 (Italian Sparrow) vs. Case 5 (Pizzly Bears):** The mechanism is **stability via intrinsic cohesion and independence.** The Italian sparrow lineage originated via hybridization but *maintained* distinct cohesion (its unique appearance, range, likely behavioral traits) and evolutionary independence (it doesn't significantly introgress back into house or Spanish sparrow populations; it persists as its own entity). It "holds itself apart" intrinsically over generations. Pizzly bears lack this. Their hybridization is a direct, transient consequence of extrinsic factors (sea ice loss forcing contact). They exhibit no unique, cohesive identity maintained over generations; they are unstable hybrids reflecting ecological disruption, not an independent lineage establishing its own trajectory. Independence is externally imposed (melting ice), not intrinsically maintained.
  *   **Case 2 (Flycatchers) vs. Case 6 (Dogs/Wolves):** The mechanism is **behavioral vs. incomplete reproductive isolation.** Flycatchers possess intrinsic, cohesive behavioral barriers (song recognition) that enforce evolutionary independence *despite morphological similarity*. This barrier actively prevents gene flow and maintains distinct trajectories. Dogs and wolves, despite profound morphological/behavioral divergence *within* the lineage, lack such a complete intrinsic barrier *against each other*. They remain interfertile and capable of significant gene flow. Their cohesion (shared genetics, interfertility) binds them together as a single lineage pursuing a complex but shared evolutionary trajectory heavily influenced by humans. Song (case 2) is intrinsic cohesion *preventing* fusion; human-driven divergence (case 6) occurs *within* a cohesive, interfertile lineage lacking mechanisms for complete independence.

  **4. What You Have to Give Up (298 words)**
  *   **Verdict 8 (Neanderthals as separate species):** This must go. Your principle defines species based on *current* lineage cohesion and independence over generational time within a continuous population system. Neanderthals and modern humans demonstrably interbred successfully, exchanging genes that persist today. While distinct populations for a long period, they did not maintain complete evolutionary independence; their lineages fused. Calling them separate species under your principle requires ignoring the evidence of successful hybridization and shared ancestry within our own lineage. This verdict felt compelling due to drama, mortality, and perceived qualitative difference ("otherness"), but it conflicts with the evidence of gene flow and fusion your principle requires for a single lineage.
  *   **Verdict 9 (No bacterial species):** This must also go, or be radically modified. While bacterial gene exchange is promiscuous, your principle accepts cohesive lineages maintaining independence over time (Rotifers, 7). Many bacterial populations form cohesive ecological or genetic clusters ("ecotypes") that evolve independently for vast numbers of generations, exchanging genes primarily within the cluster. They meet the "lineage," "cohesive," "evolutionary independence," and "over generational time" criteria *within their microbial context*. Denying them species status contradicts the logic applied to rotifers. The feeling that "species" is just bookkeeping likely stems from the *higher frequency* of HGT blurring boundaries compared to macrobes, not a fundamental categorical difference. To keep this verdict requires introducing an arbitrary size/complexity threshold, breaking the principle's internal logic established by Case 7.

  **5. Candidate B (The Stability-Through-Time Principle - 342 words)**
  *   **Principle:** "A population system is a species if it demonstrates *long-term stable distinctness* – maintaining cohesive identity and evolutionary independence from related systems over a timescale significant relative to its generation length and ecological context."
  *   **Clauses:**
      *   *"Population system"* (Cases 1, 3, 4, 10): A potentially structured set of populations.
      *   *"Long-term stable distinctness"* (Cases 4, 5, 7, 8): The core criterion. Requires demonstrable persistence as a cohesive, independent unit over time. *Operative meaning:* Distinctiveness (morphological, genetic, ecological, behavioral) maintained for many multiples of the organism's generation time (e.g., thousands/millions of generations for microbes, hundreds/thousands for macrobes), assessed via fossil record, phylogenetics, or biogeography.
      *   *"Cohesive identity"* (Cases 2, 6, 7): Shared traits defining the system. *Operative meaning:* As in Candidate A.
      *   *"Evolutionary independence"* (Cases 3, 5, 7): As in Candidate A.
      *   *"Timescale significant relative to its generation length and ecological context"* (Cases 7, 8, 9): Explicitly contextual. Stability is measured relative to organismal biology. A million years is fleeting for slowly evolving microbes but vast for rapidly evolving insects.
  *   **Price:**
      *   **Loses Verdict 5 (Pizzly bears):** If "long-term stable distinctness" is the core, even unstable hybrids *could* potentially become species if they persist long enough. You firmly reject this.
      *   **Loses Verdict 6 (Dogs/Wolves):** Dogs are a very recent, human-driven diversification within the wolf lineage. They lack "long-term stable distinctness" at the species level compared to the deep divergence of true species like elephants or flycatchers. They remain part of the *Canis lupus* system.
      *   **Loses Clarity:** "Long-term" and "significant" are inherently fuzzy and context-dependent, making consistent application harder than Candidate A.
  *   **Defense in Print:** **Candidate A is stronger.** Candidate B's fuzziness on timescale and its sacrifice of your firm verdicts 5 and 6 make it less robust. Candidate A offers greater precision ("generational time" is operationalizable) while firmly capturing your key distinctions between stable hybrids (sparrow) and unstable ones (bears), and between lineages with inherent barriers (flycatchers) and those without (canids). It handles the temporal challenge of Neanderthals more cleanly by focusing on lineage continuity/fusion.

  **6. New Cases**
  1.  **Recent split, divergent, interfertile:** **One species (Candidate A).** It's a lineage (descended from parent). It likely lacks strong intrinsic cohesion *relative to the parent* (freely fertile) or demonstrated evolutionary independence yet ("over generational time" likely insufficient). Its divergence is recent phenotypic change within a cohesive lineage.
  2.  **Widespread organism, isolated island form:** **Likely one species with island subspecies/variant (Candidate A).** The mainland forms intergrade (demonstrating lineage cohesion). The island form may lack evolutionary independence – its distinctness could be solely due to the physical barrier (external), not intrinsic cohesion/maintained independence. If it would freely interbreed if barrier removed, it lacks independence.
  3.  **Century-captive lineage, behavioral mismatch:** **Likely still one species (Candidate A), but borderline.** They share a recent lineage. Physical fertility suggests cohesion isn't *fundamentally* broken. The behavioral barrier is significant but potentially surmountable (e.g., artificial insemination, learned behavior change). "Over generational time" (100 years = many gens) suggests stability, but the lack of intrinsic *reproductive* barrier (only behavioral) and dependence on captivity for separation weakens the claim for independence. If released and *cannot* reintegrate due to behavior, independence strengthens.
  4.  **Extinct population inside living species genetically:** **One species (Candidate A).** The DNA evidence places it firmly *within* the lineage and genetic cohesion of the living species. It represents extinct variation within that species, not a separate lineage maintaining independence.
  5.  **Quagga back-breeding:** **Not a quagga (Candidate A).** The resulting animals are a lineage derived from plains zebras, selectively bred for a phenotype. They lack *any* historical lineage connection to the original quagga population. They are a novel *form* of plains zebra. **Candidate A is entitled to decline the "is it a quagga?" question.** It defines species based on *living or recently extinct lineages* and their properties (cohesion, independence). De-extinction of a specific *historical lineage* is impossible with current technology; this project creates a phenotypic analogue. The question "Is this *phenotype* a species?" is different, and Candidate A focuses on lineages, not phenotypes. It can say the new animals are plains zebras (*Equus quagga*) selectively bred for reduced striping. The original quagga (*Equus quagga quagga*) was a subspecies within that species, now extinct.
