prompt: |-
  I'm a software engineer working on evaluation for multilingual language models, and I keep getting pulled into arguments about whether the claim that the language you speak shapes what you can think is anything more than folklore. Before I invest further, I want a specification rather than a survey.

  Write the desiderata: what an account of linguistic relativity would have to deliver in order to count as adequate. I'm thinking of the phenomena it must explain, the distinctions it must not collapse (strong versus weak formulations; effects on underlying representation versus effects on online performance, memory, or attention; language-specific encoding versus general cultural difference), the empirical patterns it must accommodate rather than explain away, and the rival explanations it must be able to rule out. Give the motivating case or consideration behind each item, and then mark which requirements are genuinely non-negotiable and which are shibboleths of a particular camp. If some subset turns out to be jointly unsatisfiable, say so — that is the part I most want to see, since it would tell me the whole program is aiming at something impossible.

  Two further things. First, which single requirement knocks out the most popular versions of the thesis? Second, could an account meeting these standards license any inference about one model that answers differently when prompted in different languages, or is that application ruled out at the level of the requirements themselves? Please no reading list or citations — I have no way to look them up.
reasoning: |-
  Okay, the user is a software engineer working on multilingual model evaluation. They're tangled in debates about linguistic relativity—whether language shapes thought. They want a clear specification: what must a solid account of linguistic relativity achieve? They mention phenomena to explain, distinctions to maintain, empirical patterns to accommodate, and rival explanations to rule out. They also want to know which requirements are non-negotiable versus camp-specific, if any are jointly unsatisfiable, which single requirement disqualifies popular versions, and whether this could apply to their work with language models.

  First, I need to recall the core of linguistic relativity. The Sapir-Whorf hypothesis has strong and weak forms. Strong says language determines thought; weak says it influences cognition. The user wants to avoid folklore, so I must clarify what makes a theory adequate. They mentioned distinctions like strong vs. weak, effects on representation vs. performance, language vs. culture. These are key.

  Desiderata should cover phenomena like color categorization (e.g., Russian blues), spatial frames (absolute vs. relative), time encoding, grammatical gender effects. Must explain why these patterns exist without resorting to cultural differences alone. Distinctions: Can't collapse strong vs. weak—strong is likely untenable. Effects on deep representation vs. surface performance (like memory or attention) need separation. Language-specific encoding must be distinguishable from broader cultural influences.

  Empirical patterns: Need to accommodate cases where language effects are clear (e.g., color discrimination) and where they're not (universal concepts). Also, explain reversibility—learning new languages can change cognition, but not always. Rival explanations: Cultural determinism, universal cognition, perceptual salience. A good account must rule these out or integrate them.

  Now, non-negotiables: Probably the core phenomena and the distinction between language and culture. Without these, it's not about linguistic relativity. Camp-specific shibboleths might be things like mandatory ineffability (thoughts impossible without language) or extreme modularity, which aren't essential.

  Joint unsatisfiability: The user wants to know if some requirements conflict. Here's a key conflict: Language as a necessary shaper vs. reversibility. If language is necessary for certain thoughts, but people can learn new languages and shift cognition, that's a tension. Also, deep representational change vs. performance effects—hard to prove representation is altered, not just access.

  Which requirement knocks out popular versions? Phenomena 1: Color categorization. Many studies (like Heider's) showed universalism, but later work (Winawer) found language effects. However, weak effects are often performance-based, not deep representation. So insisting on deep representational change might disqualify many weak claims that are actually about attention or memory.

  Application to language models: The user wants to know if differences in model responses across languages could indicate linguistic relativity. But the requirements specify that effects must be in cognition, not just behavior. Models don't have cognition; they simulate behavior. So at the requirements level, inferences about cognition from model behavior are invalid. However, if the model's architecture or training introduces language-specific biases, that might parallel human effects, but it's not direct evidence of relativity in thought.

  Summarizing: The desiderata must be strict to avoid folklore. Key is distinguishing language from culture, explaining phenomena without overreaching, and acknowledging that deep representational changes are hard to prove. For the user's work, model differences might reflect training data biases, not cognitive effects, so they should be cautious in interpretations.
answer: |-
  Here's a specification of desiderata for an adequate account of linguistic relativity (LR), designed to separate substantive claims from folklore. Requirements are categorized, with motivations, negotiation status, and key tensions highlighted.

  **Core Phenomena to Explain (Non-Negotiable):**
  1.  **Categorical Perception Differences:** Explain why speakers of languages with different lexical or grammatical boundaries (e.g., color terms, spatial relations like absolute vs. relative frames, obligatory number marking) show measurable differences in *non-linguistic* tasks (discrimination, memory, similarity judgments). *Motivation:* This is the core empirical bedrock of LR claims (e.g., Russian blues, Guugu Yimithirr absolute space).
  2.  **Asymmetries in Cognitive Effort/Default:** Explain why certain conceptualizations or computations are faster, more accurate, or more readily accessed by speakers of languages that habitually encode that information grammatically or lexically. *Motivation:* Demonstrates *influence* beyond mere capability (e.g., grammatical gender priming object properties).
  3.  **Reversibility & Plasticity:** Explain how learning a new language can demonstrably alter performance on non-linguistic tasks related to the new linguistic categories. *Motivation:* Shows the effect is tied to language *use* rather than fixed biology or immutable culture (e.g., bilinguals switching frames of reference).

  **Essential Distinctions to Maintain (Non-Negotiable):**
  4.  **Strong vs. Weak LR:** Must clearly delineate *determinism* (language rigidly defines thinkable concepts - Strong LR) from *influence* (language biases or facilitates certain cognitive processes - Weak LR). An account cannot conflate evidence for Weak LR as support for Strong LR. *Motivation:* Strong LR is empirically untenable and philosophically problematic; collapsing this distinction is the core of most folklore.
  5.  **Representation vs. Performance:** Must distinguish effects on *underlying mental representations/concepts* from effects on *online processing*, *working memory*, *attention*, or *communicative strategies*. *Motivation:* Performance effects (e.g., memory aided by codability) are weaker evidence for deep cognitive restructuring than representational changes. This is crucial for mechanistic claims.
  6.  **Language-Specific Encoding vs. General Cultural Difference:** Must provide criteria to isolate effects stemming *specifically from the structure of the language code itself* from effects arising from broader cultural practices, beliefs, or environmental factors correlated with that language. *Motivation:* The core claim of LR is about *language*, not culture per se. Failure here renders LR indistinguishable from cultural determinism.

  **Empirical Patterns to Accommodate (Non-Negotiable):**
  7.  **Universals Amidst Variation:** Accommodate robust findings of cognitive universals (e.g., basic color foci, theory of mind) alongside demonstrable LR effects. *Motivation:* LR operates within biological and cognitive constraints; denying universals is as flawed as denying variation.
  8.  **Gradience and Domain-Specificity:** Accommodate that LR effects vary in strength across cognitive domains (stronger in perception/space/time, weaker in reasoning) and are often probabilistic, not absolute. *Motivation:* The empirical reality shows nuance, not blanket cognitive revolution.
  9.  **Absence of Effect:** Accommodate cases where significant linguistic differences *do not* lead to measurable cognitive differences in plausible domains. *Motivation:* Not all linguistic features are cognitively penetrative; LR is not omnipresent.

  **Rival Explanations to Rule Out/Integrate (Non-Negotiable):**
  10. **Perceptual Salience/Environmental Determinism:** Rule out that observed differences are driven solely by differential perceptual experience or physical environment independent of language. *Motivation:* The classic "nature vs. nurture vs. language" confound (e.g., are color differences due to language or just what people attend to?).
  11. **Cultural Schema Theory:** Rule out that differences are solely due to learned cultural schemas, norms, or practices transmitted *alongside* but *independently* of linguistic structure. *Motivation:* The primary competitor; LR must show language *itself* contributes uniquely.
  12. **Performance Artifact (Task Demand):** Rule out that differences are artifacts of implicit linguistic activation during ostensibly non-linguistic tasks. *Motivation:* A major methodological critique; true LR effects should persist even when linguistic interference is minimized.

  **Camp-Specific Shibboleths (Potentially Negotiable):**
  13. **Ineffability Requirement:** The claim that some concepts/thoughts are *literally impossible* without the corresponding linguistic category (Strong LR). *Motivation:* Strong LR dogma. *Status:* Shibboleth. Adequate accounts need not satisfy this; Weak LR explicitly rejects it.
  14. **Mandatory Online Mediation:** The claim that language *must* be actively engaged (online) for the cognitive effect to manifest. *Motivation:* Some camps emphasize real-time processing. *Status:* Shibboleth. Accounts positing enduring representational change (offline effects) are viable.
  15. **Extreme Modularity:** Requiring that linguistic effects be confined to a specific, isolated "module" untouched by other cognition. *Motivation:* Adherence to strict Fodorian modularity. *Status:* Shibboleth. Modern accounts often embrace interactionism.

  **Joint Unsatisfiability & Core Tension:**
  *   **The Representation vs. Plasticity vs. Universals Trilemma:** Achieving convincing evidence for **Requirement 5 (Representational Change)** is extremely difficult. Deep representational change implies a fundamental restructuring of concepts. However:
      *   **Reversibility (Req 3)** suggests representations are malleable through new language learning, potentially weakening claims of *fundamental* restructuring inherent to a specific language.
      *   **Universals (Req 7)** strongly constrain how much representations can actually vary. Truly incommensurable representations would preclude universals.
      *   **Rival Explanations (Req 10-12)** are often more parsimonious accounts for observed performance differences than positing representational change.
      *   **The Tension:** Proving *language-specific* deep representational change (**Req 5 + Req 6**) that is simultaneously *reversible* (**Req 3**) and exists within a framework of *strong universals* (**Req 7**) is arguably the central challenge. Most robust empirical findings are more readily explained by **online performance effects (Req 5)** influenced by language-specific encoding (**Req 6**) within universal cognitive architecture (**Req 7**). Strong claims about language *creating* fundamentally distinct representations struggle against universals and plasticity.

  **Requirement Knocking Out Popular Versions:**
  *   **Requirement 5 (Distinction: Representation vs. Performance)** is the biggest killer. Most popular accounts ("Language X makes you think Y!") rely implicitly or explicitly on representational change. However, the vast majority of robust empirical evidence for LR demonstrates **performance effects** (attention, memory accessibility, speed of discrimination) rather than irrefutable evidence of altered underlying concepts. Demonstrating true representational difference is methodologically fraught and often fails to rule out performance/rival explanations. Popular versions frequently misinterpret performance advantages as proof of fundamentally different thought.

  **Application to Multilingual Language Model (LLM) Evaluation:**
  *   **Inference Ruled Out:** An account meeting these standards **cannot directly license inferences about an LLM's "thought"** based solely on different outputs across languages. Here's why:
      1.  **No Cognition Requirement:** The desiderata fundamentally concern *human cognition*. LLMs lack internal states that qualify as cognition, representations, or thoughts in the relevant sense. They are statistical pattern generators.
      2.  **Performance vs. Representation:** LLM output differences are purely *performance* artifacts (**Req 5**). They stem from training data distribution biases, tokenization differences, prompt engineering sensitivities, and architectural constraints – not from underlying conceptual representations shaped *by* language.
      3.  **Rival Explanations Overwhelming:** For LLMs, **Req 10 (Environmental Determinism - training data)** and **Req 11 (Cultural Schemas - encoded in data)** are not rivals to be ruled out; they are the *primary and sufficient explanations* for output differences (**Req 12 - Performance Artifact** is also always applicable). Isolating an effect of the *language structure itself* (**Req 6**) from the massive cultural/data bias confound in training corpora is likely impossible.
  *   **Limited Parallel:** The *only* potential parallel is if an LLM consistently exhibits **behavioral patterns** analogous to human performance effects (e.g., faster/more accurate responses on internal "tasks" mirroring human LR experiments *when prompted in specific languages*). This might suggest the model has learned statistical correlations *similar* to those influencing human performance. However, this remains a description of the model's *behavioral output*, not evidence of language shaping its "thought," as it lacks genuine cognition. It's evidence of learning human-like *associations*, not experiencing human-like cognitive influence.

  **In essence:** A rigorous account of LR must explain specific human cognitive phenomena while navigating fundamental distinctions and ruling out non-linguistic rivals. The core tension lies in proving deep representational change. For your LLM work, the requirements themselves show that output differences across languages are fascinating behavioral phenomena related to training data and statistical learning, but **cannot** be interpreted as evidence the model's "thinking" is shaped by language in the Sapir-Whorf sense. You're observing learned correlations, not cognitive influence.
