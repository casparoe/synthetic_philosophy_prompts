prompt: |-
  I'm a documentary filmmaker, and I need you to act like a philosopher who specializes in consent but who has also actually sat through film ethics panels and knows how these things go wrong on a real production. Treat this as a practitioner document, not a seminar paper.

  Here's the situation. I'm two years into a vérité film about a small-town hospital being shut down by the health system that owns it. I've got maybe 40 people on camera, most of whom consented in a hallway or at a kitchen table with the camera already rolling. There's no lawyer on the project and the funder's compliance person only cares that the releases hold up, not that anybody was really consenting. I want a consent procedure my crew can actually run — in the field, in about five minutes, with no theory in it — but grounded in what the philosophy of consent actually says about when consent counts: what has to be disclosed, what counts as pressure, what happens when comprehension or competence is shaky.

  A few things I've been chewing on that I want the procedure to take seriously instead of papering over:

  - I don't think consent on a project like this is a one-time authorization. It's more like a standing waiver the subject can pull back at any point, including after the footage exists and after they've seen themselves on screen. But if it's revocable at will, what normative work is it doing at all? Tell me where the procedure should treat a withdrawal as binding and where it can't, and why.
  - The film has an argument. I know roughly what it is; the subjects don't; and spelling it out would change how they behave on camera. Is that deception or just normal? Where does the line go?
  - Nobody's holding a gun to anybody, but a lot of these people are frightened — of loosing their jobs, of the town turning on them, of me packing up and leaving. Is fear that isn't coming from me still coercion, and if so how do I separate it from ordinary nerves?
  - We give some people a $200 honorarium for travel and lost shifts. When does money stop being reimbursement and start being an offer they can't refuse?

  Then write the procedure: the questions to ask in order, what counts as a sufficient answer to each, where it just stops with a no, and where it hands the decision to a human because it's a values call rather than a facts call. Flag the judgment calls as judgment calls — don't dress them up as algorithm. It has to be runnable by a 24-year-old assistant producer at a kitchen table, and defensible by me if the film gets written up somewhere unflattering.

  Apply it to three situations, and for at least one of them tell me straight that the answer is a no I'm not going to like:

  1. A woman in her sixties with early dementia is the emotional center of the film. She's clear most days, she loves being filmed, her daughter is fine with it but won't sign anything herself.
  2. A hospital tech agreed to be filmed the night the closure was announced, crying in a parking lot. Eighteen months later he wants that scene out.
  3. A nurse still employed by the health system will talk on camera only if we promise the segment can never be used against her in a disciplinary proceeding — a promise I can't actually guarantee.

  Think carefully, and do two or three lines of brainstorming first about how consent goes bad on a production like this — I want to see that you've got the failure modes, not just the textbook categories. Hard cap of 900 words for everything, brainstorm included, so be terse and use fragments where you can. Lead with a single sentence giving the procedure's default posture when a case is unclear, then the steps, then the three applications. Close with one sentence naming the biggest way this procedure will misfire in practice.
reasoning: |-
  Okay, the user is a documentary filmmaker deeply immersed in a vérité project about a small-town hospital closure. They need a practical consent procedure that's field-ready—five minutes max, no theory—but philosophically sound. Their specific pain points: consent as ongoing process, argument disclosure dilemmas, ambient fear versus coercion, and honorarium ethics. 

  First, let's gut-check where productions fail: consent forms become bureaucratic checkboxes ("sign here so we don't get sued"), subjects misunderstand how footage will contextualize them ("I didn't know you'd make me look foolish!"), and power imbalances like job insecurity or money make "yes" feel compulsory. Also, withdrawal requests post-filming often get stonewalled with "but you signed!"

  The core tension: consent must be revocable to mean anything, but filmmaking has practical limits. My approach: treat consent as renewable trust, not legal armor. Default posture when unclear: "If it feels ethically messy, pause and call the director. No footage is worth compromising someone's dignity."

  For the procedure itself—brutal simplicity. Four steps: 
  1. **Disclosure:** Key facts only—funding source, film's stance (e.g., "critical of corporate healthcare"), where clips might screen. No legalese. 
  2. **Pressure check:** Explicitly ask: "Any worries about retaliation? Need to check with someone?" Money gets a red flag warning—state it's for expenses, not payment for access. 
  3. **Comprehension:** Require them to rephrase one point. Dementia? Daughter co-signing isn't enough; need lucid moments. 
  4. **Revocation rules:** Pre-edit withdrawal = absolute right. Post-edit? Negotiate, but if morally weighty (like the crying tech), cut it. 

  Now the hard cases: 
  - **Dementia patient:** Clear no. Good days don't offset bad days. Daughter's approval irrelevant if subject can't grasp permanence of film. 
  - **Crying tech withdrawal:** Honor it. His vulnerability was captured in crisis; keeping it against his will is exploitation, not storytelling. 
  - **Nurse's immunity demand:** Also no. Can't promise legal impunity. Offer anonymity or omission instead. 

  Biggest misfire in practice? Crews will shortcut the pressure check when subjects seem "fine." That missed nuance—the nurse biting her lip, the tech avoiding eye contact—is where coercion hides.
answer: |-
  ### Brainstorm: Where Consent Fails on Set  
  - **Checkbox Mentality**: Releases signed under duress/time pressure.  
  - **Context Blindness**: Subjects don’t grasp how footage will be juxtaposed/edited.  
  - **Power Asymmetry**: Fear (job loss, community judgment) masquerades as "voluntary."  
  - **Revocation Ignored**: Post-filming withdrawal treated as breach, not right.  
  - **Money Muddying**: $200 shifts from "thanks" to "incentive" for vulnerable subjects.  

  ---

  ### Default Posture When Unclear  
  **"If your gut says ‘this feels extractive,’ pause and call me. No shot is worth compromising dignity."**  

  ---

  ### Field Procedure: 5-Minute Consent Check  
  **Run this verbatim. If interrupted, restart.**  

  1. **DISCLOSE CORE INTENT** (60 sec)  
     *Say: "We’re documenting the hospital closure. Funded by [Funder]. Film may critique the health system’s choices. Could screen at festivals, TV, online. Might include tough moments like layoffs or protests. Questions?"*  
     → **SUFFICIENT**: Any clarifying question ("Will I be named?").  
     → **RED FLAG**: Silence/blank stare → Re-explain once. Still unclear? STOP.  

  2. **PRESSURE CHECK** (90 sec)  
     *Ask: "Is anyone pressuring you to do this? Boss? Family? Worried about backlash? We pay $200 for time/gas – is that affecting your choice?"*  
     → **SUFFICIENT**: "Nope, my choice" or "I’m nervous but want to."  
     → **RED FLAG**: Mentions job insecurity/fear of town → **JUDGMENT CALL**: Can they *truly* walk away? If money is pivotal ("I need that cash"), STOP.  

  3. **COMPREHENSION TEST** (60 sec)  
     *Ask: "What’s the one thing you remember about how this footage could be used?"*  
     → **SUFFICIENT**: Rough accuracy ("You’ll show it publicly, might make the corporation look bad").  
     → **RED FLAG**: Incoherent/wrong ("Just for local news") → STOP or re-explain.  

  4. **REVOCATION RULE** (30 sec)  
     *Say: "You can change your mind anytime before final edit. After that, we’ll discuss but can’t promise. Emotional scenes? We’ll re-check post-filming."*  
     → **Binding withdrawal**: Pre-lockdown edit. Post-lockdown → **JUDGMENT CALL** (harm vs. artistic integrity).  

  ---

  ### Application to Cases  

  1. **Dementia Patient**  
     - Comprehension test fails on bad days → **NO FILMING** on those days.  
     - Daughter’s approval ≠ subject’s consent.  
     - **JUDGMENT CALL**: Film *only* on lucid days after she accurately recalls disclosure. Default posture → **HARD NO** if instability. (You won’t like this: She’s unreliable. Find another center.)  

  2. **Tech Withdraws Crying Scene**  
     - Revocation rule: Binding pre-edit. Post-edit? **JUDGMENT CALL**.  
     - **Apply**: His distress is core to the scene’s power → but his autonomy trumps. **PULL THE SCENE**. Honoraria irrelevant.  

  3. **Nurse Demands Legal Immunity**  
     - Can’t guarantee ("never used against you") → deception risk.  
     - **Offer**: Omit identity, blur face, or *don’t film*.  
     - Pressure check: Her employment fear = systemic coercion. **NO FILMING** unless anonymized.  

  ---

  ### Biggest Misfire in Practice  
  **Crew will skip the pressure check when subjects seem "fine," missing silent coercion.**
