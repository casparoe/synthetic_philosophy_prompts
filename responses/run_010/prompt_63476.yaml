prompt: |-
  I run the staff side of a statewide coalition — 34 member orgs (two food-bank networks, a nurses' local, four congregational groups, a bail fund, a riverkeeper, a couple of disability-rights shops, a business association) sharing a $2.1M budget, a lobbyist, and a joint-position process. Almost nothing we do is a straight moral argument; it's trades. Every month something lands on my desk shaped like "we'll drop our objection to your data-sharing bill if you put our translation-access rider in the omnibus," or "we'll co-sign your permitting letter if you stay quiet on the clinic protest buffer." I set the agenda, and while the bylaws need two-thirds of the steering committee for any position statement, in practice I decide what gets brokered at all — so the real decision is mine and it happens before the vote. Roughly one formal trade a month plus two or three informal ones, twenty minutes per item in a room of nine people who are not philosophers and do not want to be treated like they are, and we've had two walkouts in five years, both after a trade someone later described as us selling them out. I have a poli-sci degree and no ethics training, and what I currently do is vibes plus a running mental ledger, which has failed twice.

  Build me a decision procedure my steering committee could actually run on a proposed trade: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with "don't broker this," and where it hands the decision back to the room because the question is about values rather than facts. Ground it in whatever's actually established about moral compromise and gains from trade — the line people draw between ordinary compromises and "rotten" ones, i.e. agreements that set up or maintain a regime of cruelty and humiliation; the difference between trading something you're merely uncertain about and trading something you're sure of; the worry that some trades change what the thing being traded means, or express an attitude flatly inconsistent with the value it's cashed out against; the separability problem, where two issues look tradeable but aren't, so no compensation can actually balance them; and the difference between splitting the difference and building a position neither side started with. Don't make me chase references, just build the distinctions in and tell me which ones you kept and which you dropped as unusable. It also has to handle the four ugly features of my situation specifically: (1) trades here are structurally one-way — our labor members keep giving on policing and surveillance because the civil-liberties side has nothing they want on prevailing wage or procurement, so the "exchange" is a concession wearing a trade's clothes and the ledger never ballances; (2) we pay in IOUs across committees, and membership turnover has voided the ledger twice, so the procedure needs a rule on whether a future committee can be bound; (3) our biggest funder's program officer keeps suggesting "package deals" that always happen to favor their priority area, so I need a way to test whether a trade is ours or theirs; (4) one member has standing-threatened to walk if we take any position on a certain topic at all, which means we're sometimes trading with someone's exit instead of trading on behalf of the people a position actually affects — and several of our trades spend things that belong to non-members who aren't at the table. Finally it needs a publicity test that's a real test and not a slogan: can the deal survive being stated in one sentence in a joint press release that a hostile reporter reads aloud.

  Run it on three cases, one of which should come out against me: I want to see the procedure refuse a trade I'm confident is good for the coalition's survival, stated flatly, with no softening and no "but you might still choose." The cases: the data-sharing / translation-access swap described above; a permitting letter we'd co-sign for the business association in exchange for them dropping opposition to a paid-sick-leave ordinance, where the people who'd benefit from the ordinance aren't members and won't be in the room; and the funder's package deal, which folds a housing-siting compromise, a police-oversight provision, and an environmental-justice rider into one statement. Mark every step that's really a judgment call wearing a procedural costume with something like [JUDGMENT], and say what to do when we simply can't answer a question in twenty minutes — does the default run to refuse, defer, or split.

  I want you to commit. Pick the thresholds, pick which test wins when two of them conflict, and give your reasons rather than laying out the schools of thought on compromise and letting me choose; if you think one of my four "ugly features" isn't actually a problem, say so and argue it. Format, in this order: **Bottom line** (~150 words, what the procedure is); **What has to survive from the theory, and what I cut** (~300 words); **The procedure** (700–900 words, numbered questions, each with its sufficient-answer condition and its stop point); **Where it hands the decision back to the room** (~200 words); **Worked applications** (the three cases, ~800 words total); **What this procedure can't do** (~250 words, including the failure mode where it gets used to launder a decision I'd already made).
reasoning: |-
  Hmm, the user runs a statewide coalition with 34 diverse member organizations and needs a practical decision procedure for handling political trades. They're dealing with complex ethical compromises without formal ethics training, and their current "vibes plus mental ledger" approach has failed twice with walkouts. 

  Key challenges include:
  - Structural imbalances where trades often feel like one-way concessions
  - IOUs that get voided by membership turnover
  - Funders pushing self-serving "package deals"
  - Threats of walkouts that force trading with exit rather than substance
  - Trading positions that affect non-members not at the table

  The user needs a concrete, actionable framework grounded in moral compromise theory but stripped of academic jargon. They specifically want:
  1. A step-by-step questioning protocol
  2. Clear thresholds for rejection/approval
  3. Handling of their four "ugly features"
  4. A real publicity test
  5. Demonstrated application to three cases (including one rejection)
  6. Honest acknowledgement of limitations

  The core tensions in compromise theory that matter here:
  - "Rotten compromises" (Margalit) - deals that sustain cruelty
  - Incommensurability issues (Nozick/Sandel) - when values can't be traded
  - Expressive harm (Anderson) - how trades alter meaning
  - Future-binding problems (Locke/Rawls) - whether new members can be bound

  But we must simplify these into operational questions. The structural one-way problem (#1) is the hardest - it's not really a "trade" if there's no reciprocal value. The procedure must force explicit acknowledgment when deals are actually concessions in disguise.

  For the publicity test, we'll borrow from Scanlon's contractualism but make it brutally practical: "Could we say this deal aloud to the people most harmed by it?" If not, automatic rejection.

  The turnover issue (#2) needs a clear rule: no binding future committees except on the specific legislative session. IOUs expire with the session.

  The funder problem (#3) requires a "whose interest" test - does this primarily serve the coalition's priorities or the funder's? The package must be splitable.

  The walkout threat (#4) gets special handling: we'll allow trading silence for survival only if the threatened position isn't core to any member's existence.

  For the cases:
  - Data/translation swap likely passes (tangible goods, commensurate)
  - Sick leave deal fails (trading non-member welfare for business access)
  - Funder package probably fails (bundled, non-separable issues)

  The judgment calls are unavoidable but we'll flag them clearly. When time runs out? Default to "no" - because bad deals rushed through cause walkouts.

  This won't solve deep value conflicts, but it will make the tradeoffs visible and defensible. And yes, it will sometimes reject deals necessary for survival - that's the point of ethics.
answer: |-
  Here’s a decision procedure for brokering coalition trades, designed for speed, accountability, and ethical guardrails. It prioritizes preventing "rotten compromises" and structural exploitation while acknowledging political reality.  

  ---

  ### **Bottom Line**  
  A 5-step filter for proposed trades. Each step must pass or the trade is rejected. Steps 1–3 are factual/structural; failure stops the process. Steps 4–5 are values-based; unresolved disputes trigger a committee vote. Fails any step? Don’t broker. Requires explicit answers in 20 minutes: ambiguous = reject. Grounded in avoiding exploitation (Sandel/Margalit), separability (Nozick), and publicity (Rawls). Handles your "ugly features" via strict reciprocity tests, no future-binding, funder-neutrality rules, and non-member impact screens. Rejects trades that commodify core values or harm the powerless.  

  ---

  ### **What Has to Survive from Theory (& What I Cut)**  
  **Kept:**  
  1. **No rotten compromises**: Rejects deals sustaining cruelty/humiliation (Margalit).  
  2. **Separability test**: Issues must be materially comparable (e.g., budget lines trade; civil rights don’t trade for permits) (Nozick).  
  3. **Publicity as rigor**: If the deal can’t survive hostile scrutiny, it’s illegitimate (Rawls).  
  4. **Anti-commodification**: Core values (e.g., bodily autonomy, dignity) can’t be traded (Sandel).  
  5. **Loss asymmetry**: Conceding something you’re *certain* is wrong is worse than conceding uncertainty.  

  **Cut:**  
  - "Splitting the difference" as ideal: Your trades aren’t haggling over shared goals; they’re power swaps.  
  - "Gains from trade" neutrality: Your ledger is imbalanced; gains must be tested for fairness.  
  - "Expressive harm" subtleties: Simplified to a publicity test.  
  - Theoretical debates on "binding futures": Pragmatically, committees can’t bind successors.  

  ---

  ### **The Procedure**  
  *Run sequentially. Stop if any step fails. Requires YES to all questions.*  

  1. **RECIPROCITY TEST**  
     - *Q:* "Is each side getting something they *actively value* (not just ceasing opposition), and is the value roughly proportional to what they give? *Document specific gains/losses per member.*"  
     - **Sufficient answer**: YES only if:  
       - (a) Both sides name a tangible win (policy, resource, vote), *not* just "dropping opposition."  
       - (b) No group is always on the losing side (e.g., labor’s policing concessions fail here).  
     - **Stop point**: NO if gains are illusory or one-way. [JUDGMENT: Assessing "proportionality" requires comparing like units, e.g., budget impact, votes swayed.]  
     *Handles your Ugly Feature #1.*  

  2. **SEPARABILITY & SCOPE TEST**  
     - *Q:* "Are the traded items materially separable? And does this trade *only* commit the coalition on issues owned by members at the table?"  
     - **Sufficient answer**: YES only if:  
       - (a) Items aren’t linked (e.g., data-sharing isn’t inherently tied to translation access).  
       - (b) No trade uses assets "owned" by non-members (e.g., conceding on sick leave if beneficiaries aren’t members).  
       - (c) No binding of future committees: All deals expire in 12 months or at member turnover.  
     - **Stop point**: NO if issues are morally entangled (e.g., trading clinic buffers for permits) or if non-members pay the cost. [JUDGMENT: "Ownership" of an issue requires formal member mandate.]  
     *Handles Ugly Feature #2 & non-member costs.*  

  3. **FUNDER NEUTRALITY TEST**  
     - *Q:* "If we unbundle this deal, would the coalition pursue *any* component alone? Is the funder’s priority standalone viable?"  
     - **Sufficient answer**: YES only if:  
       - (a) Each component passes Steps 1–2 alone.  
       - (b) The package doesn’t favor the funder’s priority >60% of total value.  
     - **Stop point**: NO if components are forced together or fail indivisibility. [JUDGMENT: Valuing components requires estimating political capital/resource impact.]  
     *Handles Ugly Feature #3.*  

  4. **ROTTENNESS SCREEN**  
     - *Q:* "Does this deal sustain or deepen cruelty/humiliation? Would it violate a core non-negotiable for any member (check bylaws for listed values)?"  
     - **Sufficient answer**: YES only if:  
       - (a) No part reinforces systemic harm (e.g., voter suppression, medical neglect).  
       - (b) No member’s existential purpose is traded (e.g., bail fund conceding on cash bail).  
     - **Stop point**: NO if clear harm/values breach. *Else, hand to committee*: Vote if disagreement on "core value" or "harm." [JUDGMENT: Defining "cruelty" relies on member input + bylaws.]  

  5. **PUBLICITY TEST**  
     - *Q:* "State the deal in one sentence both sides would sign in a press release. Would a savvy critic call it hypocritical or corrupt? Would the most affected group accept it as legitimate?"  
     - **Sufficient answer**: YES only if:  
       - (a) The sentence is defensible without jargon (e.g., "We backed data-sharing to expand language access").  
       - (b) No member hesitates to attach their name.  
     - **Stop point**: NO if sentence requires euphemisms. *Else, hand to committee*: Vote if disagreement on legitimacy. [JUDGMENT: "Hypocrisy" assessed via role-playing critic.]  

  **Timeout Rule**: If any step can’t be answered in 20 mins → Reject. Unresolved values questions (Steps 4–5) go to committee vote.  

  ---

  ### **Where It Hands Decision to the Room**  
  Only Steps 4 (Rottenness) and 5 (Publicity) can escalate to a vote—if factual tests (1–3) pass but values are contested. Examples:  
  - **Step 4 vote**: Is conceding on a *non-core* clinic buffer "cruel"? Committee decides if harm threshold is met.  
  - **Step 5 vote**: Is the press statement "We traded sick-leave silence for business permits" survivable? Committee judges reputational risk.  
  **Vote parameters**: Standard 2/3 majority per bylaws. No amendments—up/down on the trade as screened.  

  ---

  ### **Worked Applications**  
  **Case 1: Data-Sharing Bill vs. Translation-Access Rider**  
  - Step 1: YES. Both gain tangible policies (data rules for civil liberties, translation for nurses/disability groups). Proportional if rider affects similar populations.  
  - Step 2: YES. Separable issues; members "own" both policies.  
  - Step 3: N/A (not a funder deal).  
  - Step 4: YES. No cruelty/humiliation involved.  
  - Step 5: YES. Press line: "We supported data-sharing to ensure language access in hospitals" → defensible.  
  **→ ACCEPT**  

  **Case 2: Business Permitting Letter vs. Dropping Sick-Leave Opposition**  
  - Step 1: YES. Business gets permit support; labor gets opposition dropped.  
  - Step 2: **NO**. Sick-leave benefits non-members (low-wage workers). Their interests are traded without representation.  
  **→ REJECT** (Fails Step 2)  
  *Note: This fails your survival test—but the procedure blocks exploitation of absent parties.*  

  **Case 3: Funder’s Package Deal (Housing/Police/EJ Rider)**  
  - Step 1: YES. Each faction gets something (housing siting, oversight, EJ).  
  - Step 2: YES. Separable issues; members own them.  
  - Step 3: **NO**. Unbundled:  
    - Police oversight might fail Step 4 (if oversight weakens accountability).  
    - EJ rider likely passes alone.  
    - Funders’ housing siting is >60% of value? [JUDGMENT: If siting dominates resources, reject].  
  - Step 4: NO if police oversight enables brutality (e.g., "oversight" with no subpoena power).  
  **→ REJECT** (Fails Step 3 or 4)  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Solve power imbalances**: If labor *always* loses on policing, Step 1 flags it—but won’t fix coalition asymmetry.  
  2. **Prevent "soft" corruption**: A savvy broker could manipulate JUDGMENT calls (e.g., downplaying "cruelty"). Mitigation: Require dissenters to voice objections in Step 5.  
  3. **Handle "existential" walkout threats**: If a member says "we quit if you even *discuss* climate policy," the procedure rejects trading silence (Step 2: non-members own climate impacts). This may cause walkouts—but it avoids coercion.  
  4. **Launder pre-made decisions**: Rigorous documentation of each step creates paper trails. If you skip a test, dissenters can cite the breach.  
  **Failure Modes**:  
  - **Over-rejection**: May decline survivable trades to avoid rottenness (e.g., Case 2).  
  - **Groupthink**: If committee votes on Steps 4–5, members may override ethical screens for short-term gain.  
  - **Speed limits**: Complex trades (e.g., multi-issue packages) often time out → automatic reject.  

  **Final Note**: This won’t balance your ledger. But it forces trades to be transparent, reciprocal, and accountable—reducing walkouts by making exploitation harder to hide. If it feels too rigid, that’s the point.
