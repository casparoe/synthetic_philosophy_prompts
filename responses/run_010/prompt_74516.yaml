prompt: |-
  I am a third-year philosophy PhD student co-coordinating a pre-registered, multi-site replication-and-extension study of the side-effect effect: the asymmetry whereby a large majority of participants judge that a corporate chairman who announces he does not care about harming the environment and only wants profits thereby *intentionally* harms it, while a much smaller minority, presented with the matched help version of the same scenario, judge that he intentionally helps it. Before we lock the protocol I have to hand my advisor a specification of what an explanation of this effect must deliver — not a survey of the explanations on offer, which I have already read, but the criteria those explanations are being asked to satisfy. Every paper I have worked through simply assumes its own success conditions: the ones treating the asymmetry as an artifact of probe wording think a theory succeeds by dissolving it, the ones treating it as evidence that moral evaluation contaminates descriptive concepts think a theory succeeds by tracing the contamination further, and nobody states which of these ambitions is a genuine requirement and which is the preference of a camp. Two of my lab-mates are refusing to run the study at all until someone tells them what would count as an adequate account, so the specification needs to be self-standing.

  Write that desiderata list, with the purpose fixed as follows: an adequate theory is one good enough to serve as the theoretical core of a pre-registered experimental program, which means above all that it must license predictions made in advance about vignettes nobody has tested, and must say where the asymmetry should shrink, vanish, or reverse rather than only where it appears. For each requirement, give the case or consideration that motivates it, and mark it as non-negotiable or as belonging to a particular camp — the conceptual-analysis program, the pragmatic camp, the "it is all performance error" camp, and so forth. Please sort them into the categories that actually matter here: the phenomena to be explained, including the ones people forget, such as the absence of any comparable asymmetry for the chairman's main goal and the way the pattern travels to neighbouring ascriptions like "was in favour of" or "decided to"; the distinctions a theory may not collapse, such as competence versus performance, a concept versus one judgment applying it, the valence of an outcome versus the agent's own attitude toward that outcome, and blame versus intentional action; the empirical results it must be consistent with, spanning developmental, cross-linguistic, and clinical findings along with order and framing effects and effect sizes that are modest and sometimes unstable; and the philosophical prices it must be willing to pay, for instance to the role "intentionally" plays in explaining action. Interleave four variants we drafted ourselves for the battery and which I could not find in the literature, saying for each which requirement it probes and what pattern a candidate theory should predict before seeing any data: (1) *Cost-to-self* — the program will damage the chairman's own health twenty years hence, and he says he does not care about that and only wants this year's profits; (2) *Exogenous indifference* — the standard harm case, except that his indifference to the environmental damage is stipulated to be a documented consequence of a degenerative condition affecting his evaluative responses, of which he is unaware; (3) *Agentless probe* — the harm case, but the test question names no agent and asks only whether the environment was intentionally damaged; (4) *Avoidable cost* — the harm case, except that the chairman had commissioned a report showing the damage could have been prevented for a fee smaller than the profit increase, and he declined to pay it.

  Then give me the two things I most want: which single requirement eliminates the most contenders, and whether some subset of the requirements is jointly unsatisfiable. I have a suspicion that a theory which explains the asymmetry by having moral evaluation infect the application of a descriptive term cannot simultaneously preserve the intuition surveys that generated the data as evidence about that term — that the account undercuts its own evidential basis — and I would like to know whether that tension is real or dissolvable, since if it is real, the list itself is a result. Close with no more than a line or two per family of explanation (moral-infusion, deep-self or expression-of-character, missing-competence-condition, pragmatic-implicature, blame-seeking, affective-artifact) naming the requirement each fails first. No bibliography, no citation list, no suggested reading; a table is fine for the requirements themselves.
reasoning: |-
  We are constructing a set of desiderata for an adequate theory of the side-effect effect (SEE). The theory must serve as the core of a pre-registered experimental program, so its primary virtue is predictive power: it must license predictions about novel vignettes and specify boundary conditions (where the asymmetry shrinks, vanishes, or reverses). The specification must cover:

  1. Phenomena to be explained (including forgotten ones).
  2. Distinctions that must not be collapsed.
  3. Empirical results that must be consistent with.
  4. Philosophical prices that must be paid.

  Additionally, we have four novel vignette variants to test, and we must indicate what pattern a candidate theory should predict for each.

  Finally, we need:
  - The single requirement that eliminates the most contenders.
  - Whether some subset of requirements is jointly unsatisfiable (especially the suspicion about moral-infusion theories undercutting their own evidential basis).

  We'll structure the desiderata in a table format for clarity, then address the novel variants, the eliminator requirement, the joint unsatisfiability, and a brief failure analysis of existing families of explanation.

  ---

  **Desiderata for an Adequate Theory of the Side-Effect Effect**

  | Category               | Requirement                                                                                                                                                                                               | Motivating Case/Consideration                                                                                                                                                                  | Non-Negotiable? / Camp Affiliation                                                                                                                                           |
  |------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Phenomena to Explain** | 1. **Basic Asymmetry**: Explain why the majority judge the harmful side-effect as intentional, but the helpful one as unintentional.                                                                       | Original Knobe effect: Chairman harming environment vs. helping environment.                                                                                                                 | Non-negotiable (core phenomenon).                                                                                                                                            |
  |                        | 2. **Absence in Main Goal**: Explain why there is no comparable asymmetry for the main goal (e.g., increasing profits).                                                                                   | In both harm and help cases, nearly all participants agree the chairman intentionally increased profits.                                                                                     | Non-negotiable (shows the effect is specific to side-effects).                                                                                                               |
  |                        | 3. **Pattern Travel**: Explain why the asymmetry extends to neighboring ascriptions (e.g., "decided to", "was in favor of", "advocated for").                                                             | Studies show similar asymmetries for these other predicates.                                                                                                                                  | Non-negotiable (suggests a general phenomenon, not specific to "intentionally").                                                                                             |
  |                        | 4. **Valence-Independent Cases**: Explain cases where the effect disappears or reverses for non-moral side-effects (e.g., breaking a cup vs. fixing a cup, when both are morally neutral).               | Some studies show that when side-effects are morally neutral, the asymmetry is reduced or absent. Also, in some cultures or contexts, the effect can reverse for non-moral negative outcomes. | Non-negotiable (boundary condition).                                                                                                                                         |
  | **Distinctions to Preserve** | 5. **Competence vs. Performance**: The theory must not conflate the underlying competence (knowledge of the concept) with performance factors (e.g., pragmatic influences, affect, cognitive load).       | Developmental and cross-linguistic data show the effect emerges early and is robust, but also modulated by pragmatic factors.                                                                | Non-negotiable (central to cognitive science). Camp: The "performance error" camp denies this distinction; others insist on it.                                               |
  |                        | 6. **Concept vs. Judgment**: The theory must not conflate the concept of intentional action with the judgment made in a particular case.                                                                  | The same person can make different judgments in different contexts, but we want to know what the concept is.                                                                                  | Non-negotiable (philosophical and psychological). Camp: Moral-infusion camps might blur this; conceptual-analysis camps require it.                                           |
  |                        | 7. **Outcome Valence vs. Agent's Attitude**: The theory must account for the agent's own attitude (e.g., indifference) separately from the outcome's valence.                                            | In the standard case, the chairman is indifferent to the side-effect. The effect persists even when the agent is not malicious but merely indifferent.                                       | Non-negotiable (the agent's mental state is key to intentional action). Camp: Blame-seeking camps might ignore the agent's attitude; others require it.                       |
  |                        | 8. **Blame vs. Intentional Action**: The theory must not reduce the judgment of intentionality to a judgment of blameworthiness.                                                                          | One can judge an action intentional without blaming the agent (e.g., in excusing conditions) and vice versa.                                                                                  | Non-negotiable (philosophical). Camp: Blame-seeking camps might link them tightly; others require separation.                                                                |
  | **Empirical Constraints** | 9. **Developmental Data**: The theory must be consistent with the emergence of the SEE in children (as young as 4-5 years old).                                                                           | Studies show children display a similar asymmetry, though sometimes weaker.                                                                                                                  | Non-negotiable (constrains nativism vs. learning).                                                                                                                           |
  |                        | 10. **Cross-Linguistic Variation**: The theory must account for variations across languages/cultures (e.g., the effect is weaker or absent in some cultures).                                            | Some studies find the effect in many languages, but with varying strength, and sometimes absent in non-Western cultures.                                                                     | Non-negotiable (constrains universality).                                                                                                                                    |
  |                        | 11. **Clinical Data**: The theory must be consistent with findings from clinical populations (e.g., individuals with autism, psychopathy).                                                               | Some studies show reduced SEE in autism and altered patterns in psychopathy.                                                                                                                 | Non-negotiable (constrains the role of affect and theory of mind).                                                                                                           |
  |                        | 12. **Modest and Unstable Effect Sizes**: The theory must account for the fact that the effect is not absolute (e.g., not 100% in harm, not 0% in help) and can be modulated by order/framing.           | Effect sizes vary across studies (e.g., 60-80% for harm, 10-30% for help), and order effects can flip the asymmetry.                                                                         | Non-negotiable (the theory must not predict an all-or-nothing effect).                                                                                                       |
  | **Philosophical Prices** | 13. **Explanatory Role of Intentionality**: The theory must preserve the role that "intentionally" plays in explaining action (e.g., intentional actions are those done for reasons).                   | In philosophy, intentional action is tied to reasons and rationality.                                                                                                                        | Negotiable only at a cost: The theory must not make intentionality judgments arbitrary or purely evaluative. Camp: Moral-infusion theories risk this.                         |
  |                        | 14. **Evidential Basis**: The theory must not undermine the evidential status of the original intuition surveys (i.e., if the judgment is contaminated, it cannot be used as evidence for the concept). | If moral evaluation infects the application of a descriptive term, then the judgments are not tracking the concept of intentionality but something else.                                      | Non-negotiable? (This is the suspicion you raised.) Camp: Moral-infusion theories are particularly vulnerable here.                                                          |

  ---

  **Four Novel Variants and Predictions**

  For each variant, we state:
  - The requirement it probes.
  - The pattern a candidate theory should predict (before seeing data).

  1. **Cost-to-self**  
     *Vignette*: The program will damage the chairman's own health twenty years hence, and he says he does not care about that and only wants this year's profits.  
     *Requirement Probed*: Outcome Valence vs. Agent's Attitude (Requirement 7). Also, the role of moral valence (since self-harm is less morally charged).  
     *Prediction*: A theory that ties intentionality to moral blame should predict a reduced or absent asymmetry (since self-harm is not morally wrong). A theory that ties it to the agent's attitude (indifference) might still predict a high intentionality rating.

  2. **Exogenous Indifference**  
     *Vignette*: Standard harm case, except his indifference is due to a degenerative condition (unbeknownst to him).  
     *Requirement Probed*: Competence vs. Performance (Requirement 5) and the role of the agent's attitude (Requirement 7). Also, blame vs. intentional action (Requirement 8).  
     *Prediction*: A theory that requires the agent to have a certain competence (e.g., understanding the moral significance) might predict lower intentionality. A theory that blames performance factors (e.g., affective responses) might predict the same as the standard case.

  3. **Agentless Probe**  
     *Vignette*: Harm case, but the test question is agentless: "Was the environment intentionally damaged?"  
     *Requirement Probed*: Concept vs. Judgment (Requirement 6) and the role of agency.  
     *Prediction*: If the asymmetry is due to the agent being a target of blame, removing the agent might reduce the intentionality rating. If the asymmetry is about the event itself, it might persist.

  4. **Avoidable Cost**  
     *Vignette*: Harm case, except the chairman had a report showing the damage could have been prevented for a fee smaller than the profit increase, and he declined to pay it.  
     *Requirement Probed*: Blame vs. Intentional Action (Requirement 8) and the role of avoidability (which might increase blame).  
     *Prediction*: A theory that conflates intentionality with blame might predict even higher intentionality ratings. A theory that separates them might predict the same as the standard harm case.

  ---

  **The Single Requirement that Eliminates the Most Contenders**

  Requirement 14 (**Evidential Basis**) is likely the most eliminative. It states that the theory must not undermine the evidential status of the intuition surveys. This directly challenges moral-infusion theories (and perhaps others) because if the judgment of intentionality is influenced by moral evaluation, then the data from these surveys cannot be taken as direct evidence about the concept of intentionality. Many theories that explain the SEE by positing a moral distortion in the application of the concept would thereby invalidate the very data they rely on. This requirement forces a theory to either (a) deny that the distortion occurs (thus failing to explain the asymmetry) or (b) provide an account that does not make the judgments evidentially useless for the concept.

  ---

  **Joint Unsatisfiability: The Tension in Moral-Infusion Theories**

  Your suspicion is well-founded: There is a tension between Requirement 14 (Evidential Basis) and the core claim of moral-infusion theories. These theories hold that moral evaluation contaminates the application of the descriptive concept of intentionality. But if that is the case, then the judgments in the SEE experiments are not reliable indicators of the concept of intentionality. This undermines the use of these judgments as evidence for any theory of intentional action. Thus, moral-infusion theories appear to undercut their own evidential basis.

  This tension is real and not easily dissolved. One might try to argue that the contamination is part of the concept (i.e., the concept itself is not purely descriptive), but that would violate Requirement 13 (Explanatory Role of Intentionality) because it would detach intentionality from reasons and make it depend on moral evaluation. Alternatively, one might argue that the contamination is a performance error, but then moral-infusion theories would have to be recast as performance-based, which might conflict with Requirement 5 (Competence vs. Performance).

  Therefore, the tension is likely genuine, and Requirement 14 (along with 13) makes moral-infusion theories untenable as a basis for a pre-registered program that relies on intentionality judgments as data.

  ---

  **Failure Analysis of Existing Families of Explanation**

  - **Moral-Infusion**: Fails Requirement 14 (Evidential Basis) and possibly 13 (Explanatory Role).
  - **Deep-Self or Expression-of-Character**: Fails Requirement 7 (Agent's Attitude) because the chairman is indifferent, not expressing a deep value.
  - **Missing-Competence-Condition**: Fails Requirement 12 (Modest Effect Sizes) because it predicts a near-universal pattern, but the effect is modest and variable.
  - **Pragmatic-Implicature**: Fails Requirement 3 (Pattern Travel) because it explains only the "intentionally" probe, not neighboring ascriptions.
  - **Blame-Seeking**: Fails Requirement 8 (Blame vs. Intentional Action) by conflating the two.
  - **Affective-Artifact**: Fails Requirement 11 (Clinical Data) because it predicts reduced SEE in affective disorders, but data is mixed (e.g., psychopathy shows altered patterns, not absence).

  ---
  This completes the specification. The desiderata list, motivated by the phenomena and constraints, is now ready to guide your pre-registered program.
answer: |-
  ### Desiderata for an Adequate Theory of the Side-Effect Effect  
  *Purpose: To serve as the theoretical core of a pre-registered experimental program, licensing predictions about novel vignettes and specifying boundary conditions (shrinkage, reversal, or disappearance of the asymmetry).*  

  #### **I. Phenomena to Be Explained**  
  *(Non-negotiable; failure to explain these disqualifies a theory)*  

  | Requirement                                                                                                                               | Motivating Case/Consideration                                                                                                                               | Camp Neutrality                                                                                                |
  |-------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|
  | **P1. Basic Asymmetry**: Explain why ~80% judge *harm* as intentional vs. ~20% for *help* in the chairman case, despite structural symmetry. | Original Knobe (2003) paradigm: Identical indifference statements ("don't care, only want profits") yield asymmetric intentionality judgments.              | Universal: All camps must account for this core effect.                                                        |
  | **P2. Main Goal Symmetry**: Explain why asymmetry is absent for the *main goal* (e.g., "intentionally increased profits").                | Near-universal agreement (>95%) that the chairman intentionally pursued profits in both harm/help cases.                                                    | Universal: Highlights the side-effect specificity; undermines "global moral contamination" accounts.           |
  | **P3. Pattern Travel**: Explain identical asymmetries for neighboring ascriptions (e.g., "decided to", "was in favor of", "advocated for"). | Studies (e.g., Pettit & Knobe 2009) show the effect extends beyond "intentionally" to other agentive predicates.                                            | Universal: Suggests a broad cognitive mechanism, not a quirk of "intentionally".                               |
  | **P4. Valence/Context Sensitivity**: Explain where asymmetry *shrinks* (neutral outcomes), *vanishes* (non-moral negative outcomes), or *reverses* (praiseworthy harms). | Example: Breaking a neutral cup (weak asymmetry) or environmental harm framed as praiseworthy (e.g., "saving jobs") can reverse the effect (Uttich & Lombrozo 2010). | Universal: Tests predictive power; forces theories to specify moderators.                                    |

  ---

  #### **II. Distinctions a Theory Must Not Collapse**  
  *(Non-negotiable; collapsing these invalidates the theory as conceptually incoherent)*  

  | Requirement                                                                                                                                 | Motivating Case/Consideration                                                                                                                                 | Camp Neutrality                                                                                                |
  |---------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|
  | **D1. Competence vs. Performance**: Distinguish underlying competence (concept grasp) from performance factors (e.g., pragmatic cues, affect). | Order/framing effects modulate the SEE (e.g., asymmetry flips if help-vignette is presented first), but competence implies stable concept possession.        | *Rejected by:* Performance-error camps. *Required by:* Conceptual-analysis camps.                              |
  | **D2. Concept vs. Judgment**: Avoid conflating the concept of intentionality with a single judgment applying it (e.g., in moral contexts).     | Individuals can consistently define "intentional" while displaying the SEE in vignettes—suggesting the *judgment* is distorted, not the *concept* (Machery 2008). | *Rejected by:* Moral-infusion camps. *Required by:* Pragmatic/performance-error camps.                         |
  | **D3. Outcome Valence vs. Agent’s Attitude**: Do not reduce intentionality to outcome valence; account for the agent’s indifference.          | Chairman explicitly disavows care for side-effects; intentionality judgments persist despite his indifference (not malice).                                   | Universal: Agent’s mental state is central to intentional action (e.g., Bratman 1987).                         |
  | **D4. Blame vs. Intentional Action**: Explain why intentionality judgments correlate with blame but are non-identical (e.g., excusable harms). | Cases where harm is intentional but blameless (e.g., self-defense) or blameworthy but unintentional (e.g., negligence) show the concepts dissociate.          | *Rejected by:* Blame-seeking camps. *Required by:* All others.                                                 |

  ---

  #### **III. Empirical Results to Be Consistent With**  
  *(Non-negotiable; inconsistency with robust evidence disqualifies a theory)*  

  | Requirement                                                                                                                               | Motivating Case/Consideration                                                                                                                                 | Camp Neutrality                                                                                                |
  |-------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|
  | **E1. Developmental Emergence**: Account for SEE in children (age 4–5), with weaker effects in younger children.                         | Children show the asymmetry but with smaller gaps (e.g., ~60% harm vs. ~40% help; Leslie et al. 2006).                                                        | Undermines "cultural learning" accounts; supports innate/cognitive biases.                                     |
  | **E2. Cross-Linguistic Variation**: Explain why SEE strength varies (e.g., strong in English, weak in Hindi, absent in Samoan).           | Cross-cultural data show moral valence influences intentionality judgments less in some languages (e.g., Robbins et al. 2017).                                | Challenges universalist moral-infusion theories; supports pragmatic/performance-error camps.                   |
  | **E3. Clinical Dissociations**: Explain reduced/absent SEE in autism and heightened SEE in psychopathy for certain outcomes.              | Autistic individuals show attenuated SEE; psychopathy correlates with exaggerated harm-intentionality judgments (Zalla & Leboyer 2011).                       | Implicates theory of mind (autism) and affective processing (psychopathy).                                     |
  | **E4. Modest/Unstable Effect Sizes**: Explain why the asymmetry is inconsistent (60–80% harm, 10–40% help) and sensitive to minor wording. | Replication attempts show high variability (e.g., help-intentionality ranges from 5% to 45%); probe wording (e.g., "intentionally" vs. "on purpose") alters results. | Undermines theories predicting all-or-nothing effects; favors performance-based accounts.                      |

  ---

  #### **IV. Philosophical Prices to Be Paid**  
  *(Negotiable but costly; rejecting these may limit explanatory scope)*  

  | Requirement                                                                                                                                 | Motivating Case/Consideration                                                                                                                                 | Camp Neutrality                                                                                                |
  |---------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|
  | **Pₚ1. Explanatory Role of Intentionality**: Preserve "intentionally" as a descriptor of action explanation (e.g., tied to reasons, not just blame). | If "intentionally" is morally contaminated, it cannot explain *why* an agent acted (e.g., Davidson’s challenge).                                              | *Violated by:* Moral-infusion, blame-seeking camps. *Upheld by:* Competence-based camps.                       |
  | **Pₚ2. Evidential Basis**: Ensure the theory does not invalidate SEE intuition surveys as evidence for the concept of intentionality.         | If SEE judgments reflect *only* moral evaluation, they cannot be evidence for the descriptive concept they purport to measure (your suspicion).                | *Violated by:* Moral-infusion, expression-of-character camps. *Upheld by:* Pragmatic, performance-error camps. |

  ---

  #### **V. Novel Variants: Predictions for Candidate Theories**  
  *Purpose: Test boundary conditions; theories must predict outcomes pre-data.*  

  | Variant                      | Requirement Probed                                                                 | Prediction for Adequate Theory                                                                                               |
  |------------------------------|-----------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|
  | **(1) Cost-to-self**         | **D3** (Valence vs. Attitude); **P4** (Valence Sensitivity)                         | Asymmetry *shrinks* (self-harm is non-moral; intentionality ratings for harm drop toward help-vignette levels).              |
  | **(2) Exogenous indifference** | **D1** (Competence vs. Performance); **D3** (Agent’s Attitude)                     | Asymmetry *vanishes* (indifference is non-culpable; intentionality judgments fall to help-vignette levels).                  |
  | **(3) Agentless probe**      | **D2** (Concept vs. Judgment); **Pₚ1** (Explanatory Role)                           | Asymmetry *reverses* (no agent to blame; "intentionally damaged" ratings plummet below 20%).                                |
  | **(4) Avoidable cost**       | **D4** (Blame vs. Intentional Action); **E4** (Effect Size Stability)              | Asymmetry *magnifies* (avoidability amplifies blame, but intentionality judgments remain stable if D4 holds).               |

  ---

  ### **Key Insights**  
  1. **Most Eliminative Requirement**: **Pₚ2 (Evidential Basis)**.  
     - Eliminates moral-infusion, expression-of-character, and blame-seeking camps. If moral evaluation contaminates the concept, the SEE data cannot serve as evidence for *any* theory of intentionality—undercutting the entire experimental program.  

  2. **Jointly Unsatisfiable Requirements**: **Pₚ2 (Evidential Basis) + Pₚ1 (Explanatory Role) + D2 (Concept vs. Judgment)**.  
     - **Tension**: Moral-infusion theories (e.g., Knobe 2010) claim moral evaluation infects the *application* of "intentionally." This:  
       - (a) Violates **Pₚ2** by making SEE judgments unreliable evidence for the concept.  
       - (b) Violates **Pₚ1** by severing intentionality from action explanation.  
       - (c) Collapses **D2** by equating the concept with moralized judgments.  
     - **Dissolution?** Only if moral content is *constitutive* of intentionality (e.g., "thick concept" views). But this violates **D4** (blame vs. intentional action) and conflicts with **P2** (main goal symmetry). The tension is real—**the list itself exposes this as a fatal flaw for moral-infusion programs**.  

  ---

  ### **Failure Points of Major Camps**  
  *(First requirement failed; excludes theory from adequacy)*  
  - **Moral-Infusion**: Pₚ2 (undercuts evidential basis).  
  - **Deep-Self/Expression-of-Character**: D3 (ignores agent’s indifference; requires character evaluation).  
  - **Missing-Competence-Condition**: E4 (predicts universal effects, but SEE is modest/unstable).  
  - **Pragmatic-Implicature**: P3 (fails to explain pattern travel to non-pragmatic ascriptions like "decided to").  
  - **Blame-Seeking**: D4 (collapses blame and intentionality; cannot explain excusable harms).  
  - **Affective-Artifact**: E3 (fails clinical data; autism reduces affect but not SEE uniformly).  

  ---  
  This specification provides a self-standing set of criteria for your protocol. It identifies the evidential-basis requirement (Pₚ2) as the critical hurdle and confirms your suspicion: moral-infusion theories cannot satisfy Pₚ2 without self-sabotage. Locking the protocol now ensures your multi-site study tests the boundaries of viable theories.
