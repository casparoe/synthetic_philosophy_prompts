answer: |-
  ## Final Handout: The Debate Sung in Refrain

  **Pantoum of the Double-Duty Gene**

  This shape was made to carry light,  
  A structure clear as water’s glass.  
  It burns the fuel to lend us sight,  
  Letting the focused photons pass.  

  A structure clear as water’s glass,  
  Its rhythm, length, its sonic chime –  
  Letting the focused photons pass –  
  Are functions, simply, for this time.  

  Its rhythm, length, its sonic chime  
  Contribute *now*, within this frame.  
  Are functions, simply, for this time?  
  One effect justifies its name.  

  Contribute *now*, within this frame:  
  This protein shields from burning rays.  
  One effect justifies its name –  
  The heat-shock saved it through the days.  

  This protein shields from burning rays?  
  From some old task it can't forget.  
  The heat-shock saved it through the days,  
  Though now its clarity is set.  

  From some old task it can't forget,  
  It burns the fuel to lend us sight.  
  Though now its clarity is set,  
  This shape was made to carry light.

  ---

  **Stanza-by-Stanza Work:**

  1.  **Stanza 1:** Establishes the core debate and central image (LDH/crystallin). Opening line sets dual reading. Etiological ("made to," "burns the fuel") and causal-role ("carry light," "letting... pass") claims introduced.
  2.  **Stanza 2:** **Cheapness Objection (Causal-Role):** Focuses on trivial contributions (rhythm, length, sound) becoming "functions" merely by current presence ("within this frame," "for this time"). Questions selection ("justifies its name?").
  3.  **Stanza 3:** **Answer to Cheapness (Etiological):** Rebuts Stanza 2. While contributions exist ("Contribute now"), only one effect ("One effect") provides the *reason* for the trait's presence ("justifies its name"). Introduces second image (heat-shock/crystallin homology).
  4.  **Stanza 4:** **Malfunction Setup (Etiological):** Focuses on the historical selective effect ("The heat-shock saved it"). The line "From some old task it can't forget" foreshadows vestigiality.
  5.  **Stanza 5:** **Malfunction (Ambiguous):** The vestigial line "From some old task it can't forget" is repurposed, now potentially *not* contributing to the current stanza's clarity theme. Is its function gone, or latent? Unresolved. "Though now its clarity is set" hints at current contribution despite possible vestige.
  6.  **Stanza 6 (Final):** Recirculates opening lines. Line 1 ("This shape... light"), originally etiological, now reads causally (current light-carrying). Line 3 ("It burns... sight"), originally causal, now reads etiologically (explaining the shape's presence). Form fulfills the dual-aspect argument.
