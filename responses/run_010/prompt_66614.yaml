  Hmm... the user is clearly sophisticated - they're teaching grad seminars and have already spotted nuanced tensions (like the medical spending subtraction ambiguity). Their frustration with superficial theory applications shows in phrases like "smuggled inside" and "covertly relative". They want the case to actively challenge theories, not just illustrate them.

  The institutional history they provide is detailed. Orshansky's OPM is textbook resourcist in construction but oddly static. The SPM redesign introduces capability-like adjustments (regional costs, work expenses) but through bureaucratic pragmatism rather than philosophical commitment. That gap between technical implementation and theoretical justification is exactly where the analysis should bite.

  For the parameter mapping, I'll need to dissect all five elements of each measure:
  - OPM's food-cost anchor is pure resourcism, but its frozen thresholds become arbitrary over time
  - SPM's expenditure percentile feels welfarist but isn't - it's measuring consumption patterns, not welfare
  - Medical spending subtraction is the knottiest part. It resembles capability's conversion factors but deducts actual expenses rather than adjusting for need. That makes it more welfarist in practice despite capability-inspired intent.

  The three puzzles are brilliant test cases. On medical spending: the subtraction measures realized disadvantage (welfarist) but frames it as necessary expenditure (capability). The tension shows up in the math - it deducts what people actually spend, not what they should spend to be healthy. 

  The 33rd percentile anchor is indeed relative but not relativist enough for true welfarism. It's a half-measure - rising with general consumption but fixed to a specific percentile. That exposes a hole in all three theories: none clearly justify why 33rd percentile is justice-relevant.

  Orshansky's multiplier is indeed a stealth conversion factor. By deriving it from actual spending, she implicitly acknowledged that money→nutrition conversion varies - a proto-capability insight trapped in a resourcist framework. Beautiful catch by the user.

  For the reverse analysis on capability theory: the SPM redesign proves capability critiques were operationally influential (medical, work expenses) but the threshold construction shows its limits. The 33rd percentile and 1.2 multiplier are pure conventions - capability theory can't derive them, only criticize income metrics. 

  The CPI debate is technically resourcist (bundle cost) but politically welfarist. The fact it was fought over price indices without surfacing normative questions reveals how currency disputes get buried in implementation. That's the user's point - administrative decisions silently embed philosophical commitments.

  Final constraint: where does the case strain theory? Capability approach suffers most - its core distinction between means/ends gets blurred in SPM's medical deduction. The measure tracks financial burden (means) not health outcomes (ends). Yet this very tension proves capability's insight: that resourcist metrics fail to capture disadvantage.

  The user's pedagogical move is smart - by using institutional history, they force theories to confront messy reality rather than tidy thought experiments. The poverty measure's evolution shows all three currencies coexist uneasily in practice. That's the seminar's payoff: theories don't map neatly to policies, and internal inconsistencies reveal where each account falls short.
answer: |-
  Here’s a theory-case bidirectional analysis structured around your parameters, puzzles, and constraints:

  ### I. Parameter-by-Parameter Mapping  
  *(R: Resourcism, W: Welfarism, C: Capability Approach, I: Indifferent, X: External Commitments)*  

  | **Parameter**          | **Official Poverty Measure (OPM)**                                  | **Supplemental Poverty Measure (SPM)**                              |
  |------------------------|---------------------------------------------------------------------|---------------------------------------------------------------------|
  | **Anchor**             | *Absolute cost of minimal food bundle ×3 (R)*. Ignores actual consumption patterns or welfare. | *33rd percentile of expenditures on FCSU (X)*. Not inherently R/W/C—anchors to societal consumption norms (relative but not welfarist). |
  | **Indexation**         | *Fixed CPI (R)*. Tracks resource cost inflation, not welfare changes. | *5-year rolling expenditure data (I)*. Could serve R (updating bundle) or W (tracking consumption norms). |
  | **Resource Definition**| *Pre-tax cash income (R)*. Pure monetary focus.                     | *Post-tax/disposable income + in-kind benefits – necessary expenses (C)*. Deductions for medical/work costs reflect conversion factors (means→functionings). |
  | **Equivalence Scale**  | *Fixed family size adjustments (R)*. Ignores differential needs.    | *Empirically derived scales (I)*. Based on expenditure patterns, not theory. |
  | **Geographic Adj.**    | *None (R)*. Ignores spatial cost variations.                        | *Metro housing costs (C)*. Adjusts for resources needed to achieve same functionings (e.g., shelter).  

  **Internal Inconsistencies**:  
  - **OPM**: Resourcist anchor clashes with *static thresholds*. Resourcism should update the bundle (e.g., new necessities like broadband), but OPM’s CPI indexation only adjusts for inflation, not changing standards.  
  - **SPM**: Expenditure anchor (neutral) conflicts with *medical expense deduction*. Expenditures reflect choices/welfare, but medical deduction is capability-oriented (correcting for involuntary disadvantage).  

  **Your Suspicion Confirmed**: Measures hybridize currencies. SPM is resourcist in threshold (expenditure as proxy for resources) but capability-oriented in resource definition (deducting unavoidable costs).  

  ---

  ### II. Resolving Puzzles  
  **1. Medical Spending Deduction**:  
     - **Tracks capability disadvantage, not welfare**. Deducting *actual* out-of-pocket costs corrects for unequal conversion of resources to functionings (e.g., $1,000 buys less health for a diabetic). But it **fails to measure capability** because it:  
       - Subtracts expenses regardless of health outcomes (e.g., two people spending $500 may have vastly different functionings).  
       - Ignores uncompensated care or non-monetary health deficits.  
     → *Arithmetic tracks financial burden of disadvantage* (capability-inspired but incomplete).  

  **2. Expenditure-Percentile Anchor**:  
     - **Covertly relative but not welfarist**. Anchoring to the 33rd percentile of FCSU spending:  
       - Makes poverty line rise with general consumption (relative standard).  
       - But expenditure ≠ welfare (e.g., frugal households may achieve high welfare).  
       - Answers: *Equal access to a socially defined consumption floor*—closest to resourcism with relative thresholds (e.g., Adam Smith’s "linen shirt").  
     → *Defect?* Capability theorists would reject consumption as the metric; resourcists might accept if bundle includes socially necessary goods.  

  **3. Orshansky’s Multiplier**:  
     - **A proto-conversion factor**. The ×3 multiplier:  
       - Derived from *observed* spending (food as 1/3 of income), not a defined non-food bundle.  
       - Implicitly acknowledges that income→nutrition conversion varies (e.g., large families spend more on food).  
     → *Conversion argument smuggled into resourcism*: It adjusts resources for a functioning (nutrition) but freezes the adjustment in time.  

  ---

  ### III. What the Episode Does to the Capability Approach  
  **Explanatory Power**:  
  - The SPM redesign **validates capability insights operationally** without philosophical commitment:  
    - Medical/work deductions address conversion factors (resources→functionings).  
    - Geographic adjustment acknowledges varying resource needs for same functionings.  
  - Yet **theory is silent on key conventions**:  
    - *Why 33rd percentile?* Capability approach demands sufficiency in central functionings but doesn’t specify a percentile.  
    - *Why 1.2× FCSU?* Arbitrary; theory only critiques income, not how to set thresholds.  

  **Where Theory Disciplines vs. Convention**:  
  | **Theory Can Discipline**          | **Irreducible Convention**          |  
  |------------------------------------|--------------------------------------|  
  | Rejecting pure income metrics      | Threshold setting (33rd %ile)        |  
  | Including in-kind benefits         | Multiplier (1.2×)                    |  
  | Deducting necessary expenses       | Choice of equivalence scale          |  

  → The redesign shows capability *diagnostics* (identifying flaws in OPM) were influential, but *prescriptions* (e.g., selecting functionings) were ignored.  

  ---

  ### IV. Act Three: Indexation Dispute  
  - **Chained CPI-U is resourcist**: It measures cost of maintaining a *standard of living* (bundle substitution) but doesn’t track welfare. Welfarism would require anchoring to utility (e.g., subjective well-being surveys), which it doesn’t.  
  - **Normative content buried**: The public debate’s focus on technicalities (price indices) obscures that indexation choices implicitly prioritize:  
    - *Resourcism*: Cost of fixed bundle (standard CPI).  
    - *Welfarism*: Preserving satisfaction via substitution (chained CPI).  
  → **Irony**: A currency dispute was fought entirely in resourcist terms (price data), revealing how administrative pragmatism obscures normative foundations.  

  ---

  ### V. Final Constraint: Where the Episode Strains Theory  
  **The capability approach is embarrassed** by the medical spending deduction:  
  - It correctly identifies the *problem* (health costs impair real freedom) but the *solution* (deducting expenses) conflates:  
    - **Capability disadvantage** (e.g., chronic illness reduces achievable functionings) with  
    - **Financial burden** (actual outlays).  
  - This reduces capability to a *cost correction* rather than measuring freedom itself (e.g., two people with same medical expenses may have vastly different capabilities due to disease severity).  
  → **Failure to test**: The case doesn’t challenge resourcism/welfarism but shows capability metrics are *hard to operationalize* without collapsing into resource tracking.  

  **Why others aren’t strained**:  
  - Resourcism is validated by OPM’s persistence and the CPI debate.  
  - Welfarism remains irrelevant—no measure uses welfare data.
