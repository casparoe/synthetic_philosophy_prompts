answer: |-
  Here is a move-by-move adjudication of the arguments, followed by answers to your specific questions and an overall verdict. I’ve assessed each argument based on logical coherence, responsiveness to the prior point, and grounding in typographic practice—not on personal agreement with either side. Where ambiguity exists in your reconstruction, I note it explicitly.

  ### Move-by-Move Adjudication
  1.  **Iris (Structural Invariant)**: **Partly succeeds, partly fails**.  
      *Succeeds* in identifying that readers reliably recognize 'a' across styles, suggesting *some* perceptual anchor. *Fails* because no universal geometric/stroke "skeleton" exists (e.g., two-story vs. single-story 'a' share no common strokes). Tomás’ counterexamples (italics, handwriting) are valid.  
      *Why*: Typography relies on conventions, not immutable structures. Her claim overreaches but hints at a real phenomenon (consistent recognition).

  2.  **Tomás (No Invariant/Family Resemblance)**: **Succeeds**.  
      He correctly refutes Iris’s structural essence by citing irreconcilable variants (e.g., text roman ‘a’ vs. geometric sans ‘a’). His appeal to Wittgensteinian "family resemblance" (where category membership relies on overlapping features, not a universal core) is well-founded in both philosophy and typographic history.  
      *Why*: Letters evolve; their identity is contextual and historical, not defined by fixed geometry.

  3.  **Iris (Functional Criterion)**: **Partly succeeds**.  
      *Succeeds* pragmatically: a glyph *is* an ‘a’ if it functions as one in its system (disambiguated by context). This resolves the studio’s immediate problem. *Fails* as a "necessary and sufficient condition" because it doesn’t explain *why* a mark is assigned to the a-slot.  
      *Why*: Functionality is real but incomplete—it presupposes a system already understood by designers/readers.

  4.  **Tomás (Circularity/Emptiness)**: **Succeeds against (3), partly succeeds against (5)**.  
      - **Circularity charge lands**: Iris’s functional criterion (move 3) *is* circular. Saying "it’s an ‘a’ because it fills the a-slot" assumes prior knowledge of what an ‘a’ is.  
      - **Emptiness charge lands conditionally**: If "reader uptake" is the *sole* criterion (as in move 3), it *is* empty for design guidance. A solid rectangle *could* be an ‘a’ if readers accept it—but this offers no principles for creation.  
      *Why*: His critique exposes the weakness of a purely functional definition divorced from tradition or form.

  5.  **Iris (Uptake as Feature)**: **Succeeds, but narrows her position**.  
      She successfully reframes functionality as intentional/systemic (e.g., a shape is ‘H’ in Latin, ‘Η’ in Greek). This avoids circularity by grounding identity in *system-level conventions*, not isolated uptake.  
      *Why*: This is stronger than move 3: identity *is* relational and conventional, not intrinsic. Tomás’ solid rectangle objection is defanged here—context and convention *do* rule it out unless the system permits it.

  6.  **Tomás (Triviality/Misdirection)**: **Partially succeeds, partially misreads Iris**.  
      - **"Uptake settles the wrong question" succeeds**: Readers can misidentify glyphs, and "poor" or "borderline" letterforms exist. Functionality doesn’t address design quality.  
      - **Triviality charge (against schema) fails**: Iris isn’t invoking "self-identity" (tautology). In moves 1 and 7, she argues for a *persistent real feature* enabling recognition—not a tautology.  
      *Why*: He conflates her core claim (recognition relies on *something* persistent) with a trivial reading of "every ‘a’ is an ‘a’". His "practices over definitions" point is valid but doesn’t negate her argument.

  7.  **Iris (Persistence Through Variation)**: **Succeeds weakly**.  
      She identifies a genuine puzzle: readers recognize novel ‘a’s instantly. But she *fails* to prove this requires an "invariant" (structural or functional). Tomás’s analogy-based recognition (move 8) is a stronger explanation.  
      *Why*: Recognition likely stems from learned associations and contrasts, not a fixed essence—even if it feels intuitive.

  8.  **Tomás (Analogy Over Invariant)**: **Succeeds fully**.  
      He provides the best explanation: recognition uses *analogy to a category* built from prior examples, not a "stored invariant." His studio example is decisive: no single-glyph criterion distinguishes ‘a’ from ‘d’ in their system—disambiguation is systemic.  
      *Why*: This aligns with cognitive science (prototype theory) and resolves the grid-font problem. Iris’s inability to isolate an ‘a’-specific condition undermines her structural claim.

  ---

  ### Answers to Narrower Questions
  1.  **Tomás’s charges in (4)**:  
      - **Circularity**: Lands decisively against **move (3)** (functional-uptake).  
      - **Emptiness**: Lands against **move (3)** but *not* against **move (5)** (systemic-conventional). Move (5) escapes emptiness by invoking conventions that *constrain* what can function as an ‘a’.  

  2.  **Triviality charge in (6)**:  
      Misdescribes Iris. In (1)/(7), she argues for a *substantive* persistent feature (structure or function), not a tautology. Tomás’s rebuttal succeeds against a strawman.  

  3.  **Merely verbal disagreements?**  
      - **"Essence"**: Partly verbal. Iris uses it loosely (any persistent factor enabling recognition); Tomás interprets it as geometric necessity. Substantive disagreement survives: *Is recognition grounded in a stable feature?*  
      - **"Structure"**: Verbal in (1). Iris likely means "recognizable pattern" (not literal strokes), but Tomás takes it literally.  
      - **Where disagreement evaporates**: Both agree context disambiguates (Iris in (3)/(5), Tomás in (8)). The core survival: *Must a defining feature be isolable per glyph?* Iris (yes); Tomás (no).  

  ---

  ### What Each Overlooks
  - **Iris overlooks**:  
    1.  That her "invariant" shifts (structural → functional → systemic).  
    2.  That first-attempt recognition *can* arise from analogy/family resemblance (no essence needed).  
    3.  **Crucially**: The studio’s conformance spec *can* be pragmatic ("this mark is designated ‘a’ in this system") without settling philosophical identity.  

  - **Tomás overlooks**:  
    1.  That conventions (his "practices") *do* impose constraints—not "anything goes," even if boundaries are fuzzy.  
    2.  That functional/systemic identity (move 5) *is* sufficient for a conformance spec.  

  **Practical vs. Philosophical**: The studio’s conformance question **can be settled without resolving letter identity**. State:  
  > *"In this typeface, Glyph [X] is designated to represent the character ‘a’ in the Latin alphabet, disambiguated by its context within the font system."*  
  This avoids essence claims and focuses on intent and systemic role—addressing the client’s need.  

  ---

  ### Overall Verdict
  **Tomás came out ahead**, but narrowly.  
  - **Why**: His critique of structural essence (2) holds; his family-resembrance model (8) best explains recognition; and he exposes flaws in Iris’s early functionalism (4). He correctly separates design quality from mere functionality (6).  
  - **Iris’s strength**: Her systemic-conventional view (5) is robust and resolves the immediate issue. But she overclaims with "invariants" (1,7) and missteps by invoking "necessary and sufficient conditions" (3).  
  - **The tiebreaker**: Tomás’s insight that *no glyph-specific criterion* distinguishes ‘a’ in their grid system (8) is unrefuted and fatal to Iris’s structural stance.  

  **Practical Outcome**: The disputed glyph **can functionally be an ‘a’** within its system (per Iris move 5), but its identity is **conventional and relational** (per Tomás move 8). The studio should adopt the pragmatic spec above.  

  This adjudication treats your report as fair. Where phrasing ambiguities existed (e.g., "structure" in move 1), I noted them and assessed the stronger/most plausible reading. No move was dismissed as a restatement. The unseen glyph isn’t critical—the debate is conceptual.
