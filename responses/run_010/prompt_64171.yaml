prompt: |-
  My sister is in the forth year of a philosophy PhD and for over a year now I've been making her play a game at dinner: I describe someone with some bit of information and she has to say, flat out, whether they know it or not. No hedging allowed. Her record so far:

  - A guy reads one email saying his interview is in Room 4B, and he's got ninety minutes to spare and nothing else going on. Does he know where to go? "Obviously."
  - Same guy, same single email, but the panel started late, it's the only slot they'll ever give him, and if he walks into the wrong room he's blown it. "No, he doesn't know. He needs to stop someone and ask."
  - I then asked whether he'd know in that second version if he'd checked with two different people. "Then yes."
  - A midwife draws up a drug after one look at the label, routine delivery, nothing unusual about the case. "Knows." Same midwife, same single look, but it's one of those drugs where the wrong strength kills the baby. "Doesn't know. Someone has to verify it."
  - A guy on the sofa on a Sunday who's just watched a programme about how memory quietly rewrites itself, and "remembers" shutting the back window. I said out loud that nothing whatsoever turns on it, he's not leaving the house, worst case he's a bit cold in the night. I was sure she'd say no. She said "he knows, he's just been spooked."
  - Me: I sniffed the milk, it's fine, but I've had a bad stomach all week and if I'm wrong I'm useless for days. Her answer was "you know it's fine, you just shouldn't drink it" — which felt like a completely different shape of answer from the ones above, and she wouldn't say why.

  The one I'm sending her tomorrow: night guard at a tiny gallery. He glances at the humidity guage on the wall, reads 48%, believes it. Absolutely nothing rides on him — he's not permitted to touch the climate system, the place runs itself, he clocks off in ten minutes and couldn't care less about the job. Meanwhile I've spent the evening reading a maintenance report saying that model of sensor drifts badly and was overdue for recalibration, and the room he's standing in has a painting in it that's finished at 55%. I'm also the one who has to decide in the next five minutes whether to wake a conservator up. And let's say by the time I'm deciding, his shift has ended and he's gone home — there's no decision left for him to make at all.

  What's she going to say? I want the candidate rules that fit her whole record laid out — I've gathered there's a fight between people who think it's the subject's own practical situation that moves knowledge around, people who think it's the situation of whoever's saying the word, and people who think knowledge never moves and everyone's just being loose — plus anything else her answers point to, like whether the milk case means she isn't really talking about knowledge at all half the time. For each rule, what it predicts for the guard, then your single best guess and the reason you'd bet on it. Two bits I can't get a handle on: does it make any difference that the high stakes are mine and not his, and should "his shift's over" matter at all? Finish with one more scenario I could send her afterwards that would split the rules better than this one does.

  And be straight with me about the state of play here — what's actually settled versus what people who work on this full time still can't agree on. Don't hand me one camp's answer wearing a consensus costume.
reasoning: |-
  Okay, the user has presented an intriguing philosophical game they've been playing with their sister, who's in the fourth year of her philosophy PhD. The game involves determining whether someone "knows" something based on various scenarios, and the sister's answers seem context-dependent, shifting with stakes and practical implications. The user now wants to predict her response to a new night guard scenario and understand the underlying epistemological rules that explain her pattern of answers.

  First, I need to analyze the sister's previous responses to identify patterns. In low-stakes situations (like the first email scenario or the routine drug administration), she attributes knowledge easily. But when stakes are high (wrong room interview, dangerous drug), she denies knowledge unless verification occurs. The memory and milk cases are particularly interesting - she attributes knowledge but advises against acting on it, which feels inconsistent with the earlier denials in high-stakes contexts.

  The core philosophical debate here appears to be between contextualism (where "knows" depends on the attributor's context), subject-sensitive invariantism (where it depends on the subject's practical situation), and strict invariantism (where knowledge standards don't shift). The milk case suggests she might be separating knowledge from rational action, which complicates things.

  For the night guard scenario: low stakes for him (he can't act, doesn't care), but high stakes for the user (conservator decision). Key questions: Does the attributor's (user's) high stakes override the subject's low stakes? And does the guard's shift ending matter?

  Predicting her answer requires mapping her patterns:
  - Low stakes for both: knows (initial email/drug)
  - High stakes for subject: doesn't know (late interview/dangerous drug)
  - High stakes for attributor only? (unprecedented - milk case had high stakes for subject)

  The milk scenario ("you know but shouldn't drink") suggests she might separate epistemic status from practical rationality. Applied to the guard: she might say he knows (his stakes low) but the user shouldn't act on that knowledge alone. However, the "does he know?" question is about the guard's state, not the user's action.

  Her pattern shows:
  - When subject faces high stakes, denies knowledge
  - When attributor faces high stakes but subject doesn't (milk), attributes knowledge but warns against acting
  - Verification overcomes high-stakes denials

  Here, subject's stakes are minimal (can't act, no consequence) while attributor's are high. This mirrors the milk case structurally. Thus I predict she'll say the guard knows because his situation doesn't demand certainty, but she'll add that the user shouldn't rely on that knowledge for the conservator decision.

  For a future scenario to better distinguish theories: create a situation where subject has low stakes but attributor has high stakes, and the knowledge attribution matters for a third party's action. For example: a disinterested witness to a crime where the prosecutor's case hinges on their testimony. Does the witness "know" what they saw if the defendant's life is at stake but the witness is indifferent?

  The field remains divided. Contextualism vs. SSI is the main battleground, with experimental philosophy adding complexity but no consensus. The sister's pattern suggests a hybrid approach: default invariantism with stakes-based exceptions for actionability, but separating knowledge from rational action in "attributor-high-stakes-only" cases.
answer: |-
  Based on your sister's pattern of answers and the underlying philosophical debates, here's a breakdown of the candidate rules, predictions for the guard, my best guess, and a clarifying scenario. The core tension is between **Contextualism** (knowledge attributions depend on the *speaker's* context/stakes), **Subject-Sensitive Invariantism (SSI)** (knowledge depends on the *subject's* practical situation), and **Strict Invariantism** (knowledge standards are fixed). The milk case suggests a complication: she might be separating *knowledge* from *rational action*.

  ### Candidate Rules Fitting Her Record
  1. **Hybrid Practical Encroachment (Leaning SSI + Action Separation)**  
     - **Core Idea:** Whether someone "knows" depends primarily on *their own* practical stakes for acting on that belief. *However*, when the *attributor* faces high stakes, they might still grant the subject "knowledge" but insist the attributor shouldn't *rely* on it for action (the milk case pattern).  
     - **Fits:**  
       - Interview/Drug cases: High stakes *for the subject* → denies knowledge.  
       - Milk case: High stakes *for you (attributor)*, low for subject → "knows, but shouldn't drink" (separates knowledge from rational action for the attributor).  
       - Memory case: Low stakes for subject → knows.  
     - **Guard Prediction:** The guard *knows*. His stakes are near-zero (no action required, no consequences for him). Your high stakes don't affect *his* epistemic status.  

  2. **Attributor Contextualism**  
     - **Core Idea:** "Knows" is sensitive to the *speaker's* context. When the attributor faces high stakes, the standards for saying "S knows P" rise dramatically.  
     - **Fits:**  
       - Interview/Drug cases: When *you* describe high-stakes scenarios for the subject, she denies knowledge (your stakes as narrator raise standards).  
       - Milk case: *You* have high stakes → she avoids denying knowledge but adds a practical caveat ("shouldn't drink"), keeping standards high.  
       - Memory case: *You* frame it as low stakes → low standards → "knows".  
     - **Guard Prediction:** The guard *does not know*. Your stakes (waking a conservator, potential damage to art) set an extremely high standard for knowledge attribution.  

  3. **Strict Invariantism + Pragmatic Hedging**  
     - **Core Idea:** Knowledge standards are fixed (e.g., justified true belief + no defeaters). But in high-stakes *conversations*, people pragmatically hedge by denying "knowledge" to emphasize risk, even if the subject meets the invariant standard.  
     - **Fits:**  
       - Interview/Drug cases: Denies "knowledge" pragmatically to warn against acting on the belief alone.  
       - Milk/Memory: Low-risk contexts → no hedging, affirms knowledge.  
       - Guard case: She might hedge due to your stakes.  
     - **Guard Prediction:** Ambiguous. If she focuses on the guard's justification (he saw the gauge, no reason to doubt), she says *knows*. If she focuses on your risk, she says *doesn't know* as a pragmatic warning.  

  4. **Knowledge-Action Blur (Not Actually About Knowledge)**  
     - **Core Idea:** She's not strictly tracking epistemic justification but *rational actionability under stakes*. "Knows" ≈ "is rationally permitted to act on this belief."  
     - **Fits:**  
       - All cases: Knowledge attributions align perfectly with whether it's rational to act *without further verification* in that context.  
       - Milk case: Rational for *you* to act (drink)? No → "shouldn't drink." But rational for *the subject* (you) to believe? Unclear.  
     - **Guard Prediction:** *Does not know* (since *you* cannot rationally act on his belief).  

  ### Key Variables in the Guard Case
  - **Your High Stakes vs. His Low Stakes:**  
    - Her milk answer suggests she distinguishes these. His low stakes likely dominate for *his* knowledge; your stakes affect whether *you* can use his belief.  
  - **His Shift Ending:**  
    - This eliminates any lingering action-implication for *him*, strengthening the case that his stakes are irrelevant. Likely pushes her toward "he knows" (rules 1, 3).  

  ### Prediction for the Guard
  **Best Guess: She says the guard KNOWS.**  
  - **Why:**  
    1. **His stakes are nonexistent:** He can't act, faces no consequences. This mirrors the *memory case* (low personal stakes → knows) and contrasts with high-stakes interview/drug cases.  
    2. **The milk case precedent:** Your high stakes didn't make her deny *your* knowledge ("you know it's fine"), only advised against action. Similarly, the guard's belief meets normal standards; your stakes shouldn't retroactively alter *his* epistemic state.  
    3. **Shift ending matters:** It underscores his complete practical detachment.  
    4. **Her pattern:** She only denies knowledge when the *subject* faces high stakes *and* must act. Here, neither applies.  

  *Likely phrasing:* "Yes, he knows the gauge read 48%. But *you* can't trust that reading to decide about the conservator – you have the maintenance report!" (This separates his knowledge from your rational action, per the milk case).  

  ### A Better Splitting Scenario
  **The Indifferent Witness:**  
  > *A juror in a murder trial is convinced by the prosecution's evidence (eyewitness, partial fingerprint). She believes the defendant is guilty. However, she's deeply apathetic—the verdict won't affect her life, she's paid either way, and she's daydreaming about lunch. Meanwhile, I'm the defendant's brother. If convicted, my brother gets life without parole; if acquitted, he goes free. The juror has already submitted her vote (guilty) and left the courthouse. Does she know he's guilty?*  

  - **Why it splits better:**  
    - **Subject's stakes:** Near-zero (no personal consequence, action already taken).  
    - **Attributor's stakes:** Extremely high (life-altering for brother).  
    - **Action completed:** Like the guard, no pending decision for the subject.  
    - **Contrasts with guard case:** Here, the belief is complex (requiring evidence assessment), not a simple gauge-reading.  
  - **Predictions:**  
    - **SSI/Hybrid:** Juror *knows* (her stakes are low).  
    - **Contextualism:** Juror *does not know* (your stakes are sky-high).  
    - **Invariantism:** *Knows* (if evidence was sufficient).  
    - **Knowledge-Action Blur:** *Does not know* (it wasn't rational for *you* to rely on her belief).  

  ### State of Play in Epistemology
  - **Settled:**  
    - All sides agree that *in ordinary language*, "knows" is sensitive to practical stakes.  
    - "Knowledge" requires belief, truth, and justification (minimal consensus).  
    - Cases like yours are central to debates; no theory perfectly explains all intuitions.  

  - **Unsettled (Major Disagreements):**  
    1. **Practical Encroachment:** Does practical context affect the *truth conditions* of knowledge attributions (Contextualism, SSI) or merely our *assertion practices* (Invariantism)? *No consensus; experimental philosophy fuels both sides.*  
    2. **Whose Context Matters?** Contextualism vs. SSI is a live battlefield. Your sister's milk/guard intuitions favor SSI, but contextualists argue high-attributor-stakes cases are misinterpreted.  
    3. **Knowledge vs. Action:** Is "knowledge" inherently tied to action, or can one "know" but be irrational to act? *Deep split; the milk case epitomizes this.*  
    4. **Experimental Data:** Surveys show stakes *do* affect laypeople's knowledge attributions, but interpretations vary (is this semantic competence or performance error?).  

  **No camp dominates.** Contextualism and SSI lead in current literature, but sophisticated invariantists (e.g., Timothy Williamson) remain influential. Your sister's pattern suggests a **stakes-sensitive, subject-centered view with a knowledge/action distinction**—but the milk case reveals tension. The guard scenario will test if she holds that line. If she denies the guard knows, contextualism gains ground; if she affirms, SSI/hybrid looks stronger.  

  Send the juror case next—it forces a cleaner choice between subject and attributor stakes.
