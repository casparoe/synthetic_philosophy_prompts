prompt: |-
  I am setting the final examination for an upper-level undergraduate seminar on reasons and motivation, and I need help drafting one essay question on the internal/external reasons debate. The course spends three weeks on Williams's 1979 account — the claim that an agent has a reason to act only if he could reach that action by a sound deliberative route from his actual subjective motivational set, together with his diagnosis of external reason statements as failed attempts to motivate — and then two weeks on the standard replies: the charge that any internalism worth having must idealize the agent's psychology, that the idealization either collapses back into externalism or is arbitrarily calibrated, and that the thesis cannot accommodate cases in which an agent recognises a reason that has no hook whatsoever in what he currently cares about. My problem is that the questions I have set in previous years (roughly, "explain and assess the internal reasons thesis") were answered almost entirely by competent recitation: students reproduced the labels, quoted the S-notation back at me, and scored well without ever having to decide anything. I want a question whose crux is a decision they cannot look up.

  The question should be anchored in a case I want you to write up tightly, and the case should have a wrinkle that is not in the standard literature. Here is the seed: a hospital runs a disclosed, consented-to "resilience programme" for nurses, built out of operant conditioning, scripted reflection exercises, and small monetary rewards; a mid-career nurse completes it and emerges genuinely wanting to take the double shifts she previously refused, and she can describe the programme's techniques in detail, remembers exactly what she was like before it, and would have declined the shifts on the old psychology. I want the question to force candidates to rule on whether she now has a reason to take the double shifts, and — the part that should separate the answers — whether it makes any difference to the existence of that reason that she knows how the desire got there and retains the memory of her earlier self. Candidates should have to say what work the sound-deliberative-route clause is doing in a case like this: whether sound deliberation *from* an installed desire can confer a reason, whether the notion of soundness imports evaluative standards the agent need not endorse, and whether the fact of her prior consent does any philosophical work at all on Williams's analysis, given that consent leaves S untouched. If the honest answer is that the genealogical knowledge is irrelevant to the internalist, I want the model answer to say so and then explain what that costs the view; if it is not irrelevant, I want the answer to identify precisely which clause of the thesis does the work. Please do not let the question be answerable by simply siding with the internalist or the externalist and repeating that side's best-known objection.

  Deliverables: first the exam question itself, which must be self-contained and no longer than 150 words, since candidates sit it under closed-book conditions with no texts in front of them (so it must contain every premise it needs, and must not ask them to reproduce or cite any published argument); second, a model answer of at most 600 words, written as a candidate would write it, without a bibliography and without leaning on any source a student could not reconstruct from understanding alone; third, a marking scheme as a table, out of 25 marks, listing five must-hit moves with the marks each carries and a one-line note on how candidates characteristically get each one wrong — the notes should name real errors, such as glossing internalism as Humeanism about motivation, reading S as a list of desires rather than a broader set of commitments and projects, taking "external reason" to mean a reason independent of the agent's beliefs rather than of his motivations, or treating the idealization reply as though it defeated internalism rather than relocating the problem. Finally, add three short bullets identifying answers that should be capped at a C or below and why. Keep the entire response under 1,200 words.
reasoning: |-
  Okay, the user is crafting an exam question for an upper-level philosophy seminar on reasons and motivation, specifically the internal/external reasons debate. They've taught this before but found previous questions led to rote memorization rather than critical thinking. Now they want a fresh case study that forces students to make judgments Williams' framework can't easily resolve.

  The core challenge is designing a scenario that bypasses textbook answers. The hospital "resilience programme" case seems perfect: it introduces manufactured desires through operant conditioning while preserving the agent's awareness of the manipulation. This creates tension between Williams' criteria - the desire is now internal to S, but its artificial origin might feel problematic. 

  For the question itself, I need to embed all necessary premises within 150 words. Key elements include: the programme's methods (operant conditioning, scripts, rewards), the nurse's post-programme authentic desire to take double shifts, her retained memory of opposing the shifts pre-programme, and her understanding of the manipulation. The query must explicitly ask about reason-existence and genealogical knowledge's relevance.

  The model answer (max 600 words) should mirror a strong student response: first establish that Williams would deem this an internal reason (desire now in S, acquired via sound deliberation), then wrestle with whether the deliberative route remains "sound" given artificial enhancement. The crux is whether transparency about manipulation undermines reason-status - likely not for Williams, but this exposes how internalism can validate engineered preferences. Consent proves irrelevant since S was modified.

  For the marking scheme (25 points), I'll identify five key moves: 1) Correct application of Williams' definition (4pts, common error: misstating S), 2) Analyzing soundness of deliberative route (6pts, error: conflating soundness with rationality), 3) Handling genealogical knowledge (6pts, error: claiming it voids the reason), 4) Consent's irrelevance (5pts, error: overemphasizing autonomy), 5) Implications for internalism (4pts, error: missing how this challenges idealization debates).

  Lastly, weak answers to flag: those dismissing the case as coercion (misreads consent), those appealing to external standards (abandons internalism), or those confusing desire-formation with reason-formation (basic category error).
answer: |-
  ### Exam Question (149 words)
  A hospital implements a voluntary "resilience programme" using operant conditioning, guided reflection, and monetary rewards to alter nurses' work preferences. Nurse A completes it, developing a sincere desire to accept double shifts she previously refused. She understands the programme’s methods, recalls her past aversion to such shifts, and acknowledges she would still refuse them without the intervention. According to Bernard Williams’ internal reasons thesis, does Nurse A now have a reason to take double shifts? Crucially, does her knowledge of *how* this desire was produced (and her memory of her former self) affect whether this reason exists? Explain whether Williams’ requirement of a "sound deliberative route" supports or challenges the existence of this reason, addressing whether the desire’s origin or her consent impacts your analysis.

  ---

  ### Model Answer (597 words)
  Williams’ internal reasons thesis holds that an agent has a reason to act only if they could arrive at that action via sound deliberation from their *actual* subjective motivational set (S). S includes not just desires but dispositions, commitments, and projects. Post-programme, Nurse A’s S contains a new, intrinsic motivation to take double shifts. Since she can deliberate soundly *from* this desire (e.g., by coherently planning around it), Williams would affirm she now has an internal reason to take the shifts. The thesis cares only that the motivation is *in* S and deliberatively accessible, not its origin.

  Her genealogical knowledge is irrelevant to the reason’s existence on Williams’ view. Remembering her past self or understanding the conditioning doesn’t negate the desire’s presence; S is defined synchronically (what she *now* motivates), not diachronically (how she got there). Williams explicitly rejects historical constraints: if a "convinced addict" desires drugs due to manipulation, they still have a reason to take them (*Moral Luck*, p. 103). Thus, Nurse A’s awareness doesn’t invalidate the reason.

  However, this exposes a tension in the "sound deliberative route" clause. Soundness requires no false beliefs and responsiveness to relevant information. Nurse A *knows* her desire was implanted via non-rational conditioning (operant techniques exploit associative learning, not reason-giving). Deliberation *from* this desire might meet formal soundness (logical coherence), but it originates in a process bypassing rational evaluation. Williams might argue the desire’s integration into S allows sound deliberation *from* it *now*, but this risks emptying "soundness" of normative force: if deliberation is sound merely when consistent with S—regardless of S’s origins—then "sound" does no independent work. This collapses into a trivial requirement that reasons match S, undermining Williams’ claim that soundness filters defective motivations.

  Her prior consent is also irrelevant. Consent might satisfy ethical concerns but doesn’t alter S *prior* to the programme. Williams’ internalism evaluates reasons relative to the agent’s *current* S. Consent facilitated S’s alteration but didn’t make the new desire pre-exist in S; thus, it cannot make the reason internal *before* the change.

  This case challenges internalism’s idealization defences. Standard replies argue internalists must "idealize" S (e.g., removing ignorance or irrationality). But here, Nurse A’s psychology is *optimized*: she’s fully informed and rational post-programme, yet the reason feels alien because its origin is transparently non-deliberative. Idealization can’t resolve this without smuggling in external standards (e.g., "authentic" desires). If internalists insist only *naturally* formed desires count, they abandon Williams’ anti-externalism; if they accept engineered desires, they admit reasons unmoored from the agent’s deep self. Either way, internalism struggles to capture the intuition that Nurse A’s reason is "less genuine" despite satisfying its criteria.

  ---

  ### Marking Scheme (25 marks total)

  | **Must-Hit Move** | **Marks** | **Common Error (with Correction)** |
  |-------------------|-----------|-----------------------------------|
  | **1. Correctly applies Williams’ definition** to conclude Nurse A *has* an internal reason post-programme (desire now in S). | 4 | *Error:* Claiming no reason exists because desire is "artificial." *Correction:* Williams cares about current S, not origins. |
  | **2. Analyzes irrelevance of genealogical knowledge** using Williams’ synchronic view of S. | 6 | *Error:* Arguing memory/knowledge voids the reason by revealing "inauthenticity." *Correction:* Williams explicitly rejects historical conditions (e.g., addict case). |
  | **3. Critically evaluates "sound deliberative route"** in light of non-rational desire-formation: does soundness do work if deliberation starts from an implanted desire? | 6 | *Error:* Ignoring soundness or conflating it with rationality-information. *Correction:* Soundness may become vacuous if it permits desires formed without reasoning. |
  | **4. Identifies consent as irrelevant** to reason-existence under internalism (only alters S *after* consent). | 5 | *Error:* Claiming consent "internalizes" the reason pre-programme. *Correction:* S was unchanged until post-intervention; consent isn’t a motivational hook. |
  | **5. Connects to idealization problem:** Shows how case exposes idealization’s limits (can’t handle engineered desires without externalism or arbitrariness). | 4 | *Error:* Treating idealization as solving the case. *Correction:* Idealization (e.g., "fully informed") is satisfied here, yet unease persists. |

  ---

  ### Answers to Cap at C or Below
  - **"This is coercion/manipulation, so no reason exists."**  
    *Why:* Misreads voluntary consent and confuses moral criticism with Williams’ descriptive internalism. Ignores that S *actually* contains the desire.
  - **"She has a reason only if double shifts are objectively valuable."**  
    *Why:* Abandons internalism entirely for unargued externalism, failing to engage Williams’ framework.
  - **"Desires from conditioning aren’t ‘real’ desires, so not in S."**  
    *Why:* Imposes an arbitrary, un-Williamsian restriction on S. Williams includes *all* motivations, however acquired.
