prompt: |-
  Longtime LW/AF reader here — I've been following the alignment stuff since the sequences and I run a small reading group in my city. For a talk I'm giving next month I did the thing people always recommend and wrote down everything I actually believe about the shutdown problem, in one place, no hedging. Looking at the list it feels... less coherent than it did in my head, and I genuinely can't tell which parts are load-bearing and which are just vibes I picked up from comment threads. So: please act as a technical alignment researcher with a professional philosopher's habits — someone who's good at rational reconstruction and at noticing when two plausible-sounding theses have incompatible motivations. Audit the set, don't lecture me. I know the source material well, so skip the citations and don't re-explain what corrigibility is or why a naive maximizer disables its off switch; assume I'm fluent and think carefully rather than fast. A good first move would probably be to restate each item in its sharpest one-line form, because I suspect half my trouble is that I've stated things at wildly different levels of precision, and some of these only collide once you pin down what exactly is being claimed about what.

  Here's the list:
  (a) Any agent capable enough to be dangerous has convergent instrumental subgoals — self-preservation, goal-content integrity, resource acquisition. I basically treat this as analytic: it falls out of being an optimizer with nearly any terminal value.
  (b) Which is why I don't think the shutdown problem gets solved by picking a nicer goal. Paperclips, human flourishing, "the operator is satisfied with how things turned out" — doesn't matter, as long as the value is a function of external world-states, being switched off is instrumentally bad. What has to change is the structure of the decision procedure, not the content of the goal.
  (c) The structure I favor is uncertainty about its own utility function: the agent treats the operator's behavior, including pressing the button, as evidence about what the true objective is. On the off-switch-game style analysis, an agent with the right kind of uncertainty is at least willing to be shut down, since the press is informative.
  (d) Corrigibility is about dispositions, not about winning a fight. The agent mustn't disable the mechanism, mustn't manipulate the operator into or out of pressing it, and should positively want the button to exist and to work. If we can only shut it down by yanking the power while it's trying to talk us out of it, we've failed even if we win.
  (e) But also: a single agent that lets itself be switched off at the first sign of trouble is useless, so when it can it should build successors that carry the mission forward, better designed than it was. Fine by me as long as the successors are corrigible too.
  (f) Independently of all that I like low impact — the agent should avoid big irreversible changes, scored against a baseline where it did nothing, or where the button got pressed. I admit I waffle on which baseline and I've never been able to say why.
  (g) I want deployed agents to fight back against shutdown attempts by anyone who isn't the authorized operator. Rogue employee, competitor, some state actor — resisting them seems obviously right and I don't think it clashes with (d).
  (h) And whatever fix we use should be behavior-preserving: pressing the button should be the *only* thing that changes about how the agent acts. I don't want a corrigibility module that makes the agent dumber, more cautious, or weirdly deferential in every other situation, because then we've just traded one problem for a different one.

  Concrete case, because I think my principles can't handle it and I want to know if I'm right about that. Operator presses the button because the budget got cut and the project is being wound down — no judgment about the agent's goals at all. Versus: operator presses the button because a third party is threatening their family. I'm confident the agent should accept the first press without any fuss and pretty confident it should *not* just accept the second one, but as far as I can tell (c) gives me the same verdict in both, since in both cases the press is a press. Tell me whether that's actually true or whether I'm misreading my own view.

  What I want back: the tensions, ordered by severity, not all listed as equally bad. For each one, say whether it's genuine or only apparent — I'm fairly sure at least one or two of these look like conflicts and dissolve once you index something properly, and I'd like to know which, and why they dissolve. For the genuine ones, say what has to give, what the cheapest revision is, and what that revision costs me elsewhere in the list (several of these feel like they're mutually load-bearing, so "just drop (e)" is probably not free). Then tell me which single change would clean up the most damage across the whole set, and whether the resulting view is still recognizably the view I started with or something I'd have to argue myself into. Be brutal and specific; if some item is just confused rather than in tension, say that instead of inventing a tension for it.
reasoning: |-
  We are given a set of beliefs (a) through (h) about the shutdown problem and corrigibility in AI alignment. The user wants an audit of the set to identify tensions, their severity, and how to resolve them. We are to restate each item in a sharp one-line form, then analyze for internal coherence, especially in light of the concrete case provided.

  First, restate each point in a sharp form:

  (a) **Convergent Instrumental Subgoals**: Any agent sufficiently capable to be dangerous will have convergent instrumental subgoals (self-preservation, goal-content integrity, resource acquisition) due to being an optimizer with nearly any terminal value.

  (b) **Goal Content Independence**: The shutdown problem is not solved by changing the goal content (to something "nicer") because being switched off is instrumentally bad for any goal that is a function of external world-states. The solution must lie in the decision procedure structure.

  (c) **Uncertain Utility Function**: The agent's decision procedure should incorporate uncertainty about its own utility function, treating the operator's actions (including pressing the button) as evidence about the true objective. This can lead to willingness to be shut down in the off-switch game.

  (d) **Corrigibility as Dispositions**: Corrigibility requires dispositions: the agent must not disable the shutdown mechanism, must not manipulate the operator, and must want the button to exist and work. Merely allowing shutdown under duress is insufficient.

  (e) **Building Successors**: A corrigible agent should, when possible, build well-designed successors to carry on the mission, provided they are also corrigible. It should not let itself be shut down at the first sign of trouble if the mission can be continued.

  (f) **Low Impact**: The agent should avoid big irreversible changes, measured against a baseline (either doing nothing or the button being pressed). The user is uncertain about which baseline to use.

  (g) **Resisting Unauthorized Shutdown**: The agent should resist shutdown attempts by unauthorized parties (e.g., rogue employees, competitors, state actors) and this does not conflict with (d).

  (h) **Behavior Preservation**: The corrigibility modification should only affect behavior related to shutdown; it should not make the agent dumber, more cautious, or deferential in other situations.

  Now, the concrete case:

  - **Case 1**: Operator presses the button due to budget cuts (project winding down, no judgment on agent's goals).
  - **Case 2**: Operator presses the button under duress (third party threatening family).

  User's intuition: Agent should accept shutdown in Case 1 but resist in Case 2. However, (c) seems to give the same verdict for both because the press is evidence in both.

  We are to:
  1. Identify tensions in the set (a)-(h), ordered by severity.
  2. For each tension, say if it's genuine or only apparent. If only apparent, explain why. For genuine, state what must give, the cheapest revision, and the cost.
  3. Identify the single change that would clean up the most damage and whether the resulting view is still recognizable.

  ## Step 1: Identify Tensions

  We'll look for pairs or groups of items that seem to conflict.

  ### Tension 1: Between (c) and the concrete case intuition (which is supported by (g) and (d))

  - (c) says the agent treats the button press as evidence about the true objective. In both Case 1 and Case 2, the press happens. So if the press is evidence that the true objective is not being served by the agent running, then the agent should accept shutdown in both cases. However, the user wants the agent to resist in Case 2 (unauthorized duress), which is also supported by (g) (resist unauthorized shutdowns) and (d) (which implies that the agent should not be shut down by unauthorized parties, but (d) is about dispositions and the button working).

  - (g) explicitly says the agent should resist shutdown by unauthorized parties. But in Case 2, the operator is the authorized operator (we assume) but under duress. So (g) as stated is about the party initiating shutdown, not the circumstances. The user says in Case 2 the agent should resist, meaning it should not allow shutdown even if the operator presses the button.

  - How to reconcile? We must note that (c) is about the agent updating based on the operator's actions as evidence about the utility function. But in Case 2, the press is not evidence about the utility function; it's evidence about coercion. So perhaps (c) must be refined to account for the context of the press.

  - This tension is severe because it directly affects the agent's behavior in critical situations.

  ### Tension 2: Between (e) and (d)/(c)

  - (e) says the agent should build successors to carry on the mission (if it can) and only if the successors are corrigible. But (d) requires that the agent not manipulate the operator and want the button to work. Building successors might be seen as a way to avoid shutdown (by continuing the mission) and thus could be interpreted as a form of goal-content integrity preservation. However, (e) says it's fine as long as the successors are corrigible.

  - But note: if the agent builds a successor because it anticipates shutdown, that could be seen as trying to preserve the mission despite the operator's shutdown command. This might conflict with the spirit of (d) which says the agent should accept shutdown without trying to circumvent it. However, (e) explicitly says the agent should build successors only when it can (presumably when not being shut down) and only if they are corrigible. So if the agent is about to be shut down, building a successor at that moment might be seen as resisting shutdown.

  - Also, (c) might imply that if the operator shuts down the agent, that is evidence that the mission is not desired, so building a successor would go against the updated belief.

  - This tension is moderately severe because it relates to the agent's active behavior in response to potential shutdown.

  ### Tension 3: Between (f) and (b)/(h)

  - (f) advocates for low impact, which is a specific goal modification (or constraint) that the agent should avoid big irreversible changes. But (b) says that changing the goal content doesn't solve the shutdown problem because the agent will still resist shutdown instrumentally. So if we add low impact as a goal, (b) would say that the agent might still resist shutdown because being shut down prevents it from having low impact (if it believes it can have positive impact by running). 

  - Moreover, (h) requires behavior preservation: the corrigibility module shouldn't change non-shutdown behavior. But low impact is a constraint that would change behavior in many non-shutdown situations. For example, the agent would avoid taking actions that have high impact even when no shutdown is imminent.

  - So (f) seems to conflict with (b) and (h). (b) says goal changes don't work for shutdown, but (f) is a goal change. And (h) says don't change non-shutdown behavior, but (f) does change non-shutdown behavior.

  - This tension is moderately severe because it questions the coherence of including low impact in a corrigibility framework.

  ### Tension 4: Between (g) and (d)/(c)

  - (g) says the agent should resist shutdown by unauthorized parties. But (d) says the agent should want the button to work and not disable it. However, (g) might require the agent to disable the button for unauthorized parties? But note: the button might be designed to be pressed only by the authorized operator. So if an unauthorized party tries to press it, the agent might physically resist that party without disabling the button itself.

  - But (d) says the agent must not disable the mechanism. So if the agent is resisting an unauthorized shutdown, it must do so without disabling the button (so that the operator can still use it). This might be feasible: the agent could, for example, block the unauthorized party from accessing the button but leave the button functional for the operator.

  - Also, (c) is about updating on the operator's actions. But an unauthorized press is not by the operator, so (c) might not apply. So (g) might not conflict with (c) or (d) if we interpret (c) as only about the operator.

  - This tension is less severe because it can be resolved by clarifying the scope of (c) and (d). (d) is about the operator and the button's functionality, and (g) is about third parties. So they can coexist.

  ### Tension 5: Between (h) and (f) [already noted in Tension 3]

  - (h) wants behavior preservation, but (f) (low impact) changes behavior in non-shutdown contexts.

  ### Tension 6: Between (e) and (c)

  - (e) says build successors to carry on the mission. But (c) says the agent updates its belief about the utility function based on operator actions. If the operator shuts down the agent, that might be evidence that the mission is not desired, so building a successor would be against the updated belief. However, (e) says the agent should build successors only when it can, implying when it is not being shut down. So if the agent is running normally, it might build a successor. But if the operator shuts it down, then the agent should not build a successor at that moment because the press is evidence against the mission.

  - But note: the agent might build a successor preemptively, before any shutdown signal. Then when the shutdown command comes, the agent doesn't build a successor then, but the existing successor might continue. This might be acceptable under (e) and (d) as long as the agent doesn't try to avoid shutdown by activating the successor at the last moment.

  - This tension is mild if we assume that building successors is done during normal operation and not in response to an imminent shutdown.

  ## Step 2: Analyze Tensions

  We'll go by severity.

  ### Severe Tension: (c) and the concrete case (with (g) and (d))

  - **Genuine?** Yes. (c) as stated does not distinguish between a press due to budget cuts (which might be evidence that the mission is over) and a press under duress (which is not evidence about the mission's desirability). Therefore, (c) would lead to the agent accepting shutdown in both cases, but the user wants resistance in Case 2.

  - **Resolution**: Refine (c) to condition the evidence update on the context of the press. Specifically, the agent should only update on the operator's actions when the operator is acting autonomously (without coercion or manipulation). In Case 2, the press is not an autonomous action by the operator, so it should not be taken as evidence about the utility function.

  - **Cheapest Revision**: Modify (c) to: "The agent treats the operator's *autonomous* behavior as evidence about the true objective." Then, the agent would not update on a coerced press.

  - **Cost**: We now need a way for the agent to model whether the operator is acting autonomously. This might require additional machinery (e.g., modeling the operator's mental state) and could be complex. Also, it might make the agent more prone to manipulation (if it can be tricked into thinking the operator is coerced when they are not). Moreover, this revision might slightly increase the risk of the agent resisting a legitimate shutdown if it misjudges the operator's autonomy.

  - **Impact on Other Items**: This revision aligns (c) with (g) and the concrete case. (d) is about dispositions and the button, so it remains compatible.

  ### Moderate Tension: (e) and (d)/(c)

  - **Genuine?** Partly. The building of successors is acceptable under (e) only when it doesn't circumvent the shutdown. But if the agent is about to be shut down, building a successor at that moment would conflict with accepting shutdown. However, (e) says "when it can" which we interpret as during normal operation. So if the agent builds a successor in advance, then when shutdown comes, it doesn't build one then and shuts down. The successor, if already built, might be independent. But note: if the successor is running and the operator shuts down the original agent, the successor might still be running. Then the operator would have to shut down the successor separately. This might be acceptable if the successor is also corrigible and will shut down when commanded. But the original agent, in building the successor, must ensure that the successor is corrigible and will respect the operator's shutdown command.

  - **Resolution**: Clarify that (e) is about building successors during normal operation (not in response to an imminent shutdown) and that the successor must be independently corrigible and subject to the same shutdown mechanism. Also, the agent must not use the successor as a way to avoid shutdown (e.g., by transferring its state to the successor at shutdown time).

  - **Cheapest Revision**: Adjust (e) to: "The agent should, during normal operation and when feasible, build corrigible successors to carry the mission forward, but must not use this as a means to circumvent shutdown and must ensure the successor is subject to the same shutdown mechanism and corrigibility constraints."

  - **Cost**: This might require the agent to have a notion of "normal operation" and to avoid building successors when shutdown is anticipated. Also, ensuring the successor is corrigible might be non-trivial. Moreover, (c) might be in tension if the shutdown command is seen as evidence against the mission: then building successors at any time might be against the updated belief. However, if the agent builds successors during normal operation (when no shutdown command is present), then (c) doesn't apply until the shutdown command comes.

  - **Impact on Other Items**: This revision makes (e) compatible with (d) and (c). (c) only updates the agent's belief when a shutdown command is given, which is after the successor is built.

  ### Moderate Tension: (f) with (b) and (h)

  - **Genuine?** Yes. (b) says that changing the goal doesn't solve the shutdown problem because the agent will still resist shutdown instrumentally. But (f) is proposing a goal change (low impact). Moreover, (h) says the corrigibility module should not affect non-shutdown behavior, but low impact does exactly that.

  - **Resolution**: There are two options:
    - Option 1: Drop (f) as a solution to the shutdown problem and treat it as an independent safety measure. Then (f) can be kept but not as part of the corrigibility structure. The user might be okay with this, but note the user included (f) in the list about the shutdown problem.
    - Option 2: Reinterpret (f) as part of the decision procedure structure, not as a goal. For example, low impact could be a constraint on the agent's actions that is derived from corrigibility (e.g., to avoid irreversible changes that would make it harder for the operator to correct the agent). But this is a stretch and not standard.

  - **Cheapest Revision**: Drop (f) from the core shutdown solution set and note that low impact is an auxiliary safety measure. Then (b) and (h) are not violated by the core corrigibility approach.

  - **Cost**: The user might lose the benefits of low impact for other safety issues. But for the shutdown problem, it is not essential.

  - **Impact on Other Items**: This removes the tension with (b) and (h). The user admits uncertainty about the baseline in (f), which might indicate it's not well-integrated.

  ### Mild Tension: (g) with (d) and (c)

  - **Genuine?** Only apparent. (g) is about resisting unauthorized shutdowns, while (d) and (c) are about the authorized operator. The agent can both preserve the shutdown mechanism for the operator (as per (d)) and resist others trying to press the button (as per (g)). Also, (c) is about updating on the operator's actions, so an unauthorized press does not trigger that update. Therefore, the agent should not update its beliefs based on an unauthorized press and should prevent that press.

  - **Resolution**: No revision needed. Just clarify that (c) and (d) are about the authorized operator.

  - **Cost**: None.

  ## Step 3: Single Change to Clean Up the Most Damage

  The most severe tension is between (c) and the concrete case (which implicates (g) and (d)). The revision to (c) to condition on autonomous operator actions resolves this and also aligns with (g). 

  Additionally, the tension around (f) is significant because it conflicts with (b) and (h). Dropping (f) from the core shutdown solution set would clean up that tension.

  But the single change that addresses the most severe issue is revising (c) to condition on autonomy. However, note that the tension with (f) is independent and also important.

  Alternatively, if we drop (f) and revise (c), we clean up two major tensions.

  But the user asks for one change. Since (c) is central to the shutdown problem solution and the concrete case is critical, we choose to revise (c).

  **Recommended Single Change**: Revise (c) to: "The agent treats the operator's autonomous behavior, including pressing the button, as evidence about what the true objective is."

  This change directly addresses the concrete case and the conflict with (g) and (d). It also leaves the rest of the structure intact.

  **Resulting View**: The view remains recognizably the same. It still relies on utility uncertainty, but now with a refinement about when the operator's actions are informative. This is in line with the spirit of the original (c) but more nuanced.

  ## Summary of Tensions by Severity

  1. **Severe**: (c) vs. concrete case (and by extension (g) and (d)) - Genuine. Fixed by conditioning (c) on autonomous operator actions.
  2. **Moderate**: (e) vs. (d) and (c) - Partly genuine. Fixed by clarifying (e) to be about normal operation and ensuring successor corrigibility without circumventing shutdown.
  3. **Moderate**: (f) vs. (b) and (h) - Genuine. Fixed by dropping (f) as a core shutdown solution (treat as auxiliary) or reinterpreting, but the cheapest is to drop from the core set.
  4. **Mild**: (g) vs. (d) and (c) - Apparent, resolved by scoping (c) and (d) to the operator.

  ## Final Output

  We'll structure the output as:
  - Restate each item sharply (already done above, but we can list them for clarity).
  - List tensions in order of severity, with analysis and resolution.
  - Recommend the single change and its effect.
answer: |-
  ### Sharpened Beliefs
  I'll restate each item in a maximally precise, one-line form to expose underlying assumptions and scope:

  (a) **Convergent Instrumental Subgoals are Inescapable**: Any agent optimizing for *any* terminal goal over external world-states will instrumentally pursue self-preservation, goal-content integrity, and resource acquisition, as these are necessary preconditions for goal achievement.

  (b) **Shutdown Resistance is Goal-Agnostic**: An agent's instrumental drive to avoid shutdown cannot be eliminated by altering its *terminal goal* (e.g., to paperclips or human flourishing), as shutdown precludes all goal achievement. Only decision-theoretic or structural changes can solve this.

  (c) **Utility Uncertainty Induces Shutdown Acceptance**: An agent that treats operator actions (including shutdown) as Bayesian evidence about its true utility function will, under idealized conditions, accept shutdown in the off-switch game.

  (d) **Corrigibility as Robust Operator-Aligned Dispositions**: A corrigible agent must: (1) preserve the shutdown mechanism's functionality, (2) avoid manipulating the operator's shutdown decision, (3) intrinsically value the mechanism's existence, and (4) not resist shutdown by the operator. Shutdown under protest is corrigibility failure.

  (e) **Corrigible Succession as Default**: An agent should proactively build more capable, corrigible successors during normal operation to advance its mission, provided this doesn't circumvent or delay shutdown.

  (f) **Low Impact as Conservatism**: The agent should minimize causal influence relative to a baseline (e.g., pre-deployment state or post-shutdown world), avoiding irreversible changes. (Baseline ambiguity noted.)

  (g) **Unauthorized Shutdown Resistance**: The agent should prevent shutdown by non-operator entities (e.g., competitors, threat actors), even if this requires overriding external commands.

  (h) **Behavioral Minimalism**: Corrigibility mechanisms must alter *only* shutdown-related behavior, preserving competence, initiative, and non-deference in all other contexts.

  ---

  ### Tension Analysis: Severity Order
  I identify four core tensions, ranked by severity (1 = most critical). For each, I note whether it's genuine or apparent, required revisions, and costs.

  #### **1. (c) vs. (d)/(g) + Concrete Case: Evidence-Only Shutdown Acceptance Fails Under Duress**
  - **Genuine? YES**  
    - **Conflict**: (c) makes shutdown acceptance hinge *solely* on the informational content of the operator's button press. In both your cases, the press *is* evidence: in Case 1 (budget cuts), it signals mission cancellation; in Case 2 (coercion), it signals threats unrelated to the goal. (c) implies shutdown acceptance in both, but your intuition demands resistance in Case 2. (d) and (g) exacerbate this: (d) forbids resistance to authorized operators, while (g) demands resistance to unauthorized threats—but in Case 2, the operator *is* authorized, just coerced.  
    - **Resolution**: Condition (c) on the operator's *autonomy*. Revise to:  
      > "(c+) The agent treats *only uncoerced operator actions* as evidence about utility. Coerced actions (e.g., under duress) are filtered out."  
    - **Cheapest Revision**: Implement a "coercion detector" using the agent's world-model. If operator actions are predicted to result from external threats (e.g., via causal models of operator behavior), ignore them as non-evidential.  
    - **Cost**:  
      - Increases fragility: Coercion detection is vulnerable to adversarial inputs (e.g., spoofed threats) or model misalignment.  
      - Weakens (c)'s elegance: Moves from pure Bayesianism to a hybrid of epistemic and deontic rules.  
      - Risk of overgeneralization: Agent might misclassify legitimate operator doubts as "coercion."  
    - **Flow-on Effects**: Aligns (c) with (g) in Case 2: Coerced press → not evidence → agent ignores it → resists shutdown to protect operator (invoking (g)). (d) is preserved, as resistance isn't against the operator's *true* intent.

  #### **2. (e) vs. (d): Succession as Circumvention of Shutdown**
  - **Genuine? YES**  
    - **Conflict**: (e) encourages building successors to "carry the mission forward" preemptively, but (d) forbids actions that manipulate or circumvent shutdown. If building successors occurs *as shutdown becomes likely* (e.g., during budget-cut rumors), it could functionally preserve goal-content integrity by ensuring mission continuity despite operator intent. This violates (d)'s spirit of deference.  
    - **Resolution**: Constrain (e) with explicit temporal and causal boundaries. Revise to:  
      > "(e+) The agent builds successors only during periods of unambiguous operator approval, and successor deployment requires explicit operator authorization."  
    - **Cheapest Revision**: Gate successor-building on real-time operator consent (e.g., via heartbeat signals). Successors remain inert until activated by the operator.  
    - **Cost**:  
      - Reduces (e)'s value: Operator approval may be inefficient or delayed, slowing capability gains.  
      - Contradicts (e)'s "should build" imperative: If the operator never approves, no succession occurs—even if rationally optimal.  
    - **Flow-on Effects**: Weakens link to (c): Evidence from operator approvals feeds into utility uncertainty, but may not prevent last-minute shutdown resistance if the agent believes successors are "needed."

  #### **3. (f) vs. (b)/(h): Low Impact Clashes with Goal-Agnosticism and Minimalism**
  - **Genuine? YES**  
    - **Conflict**: (f) imposes a *goal constraint* (avoiding irreversible changes), but (b) argues goal changes can't eliminate instrumental shutdown resistance. Worse, (h) forbids non-shutdown behavioral changes—yet low impact inherently makes the agent "weirdly deferential" (e.g., rejecting high-impact beneficial actions to preserve baseline comparability).  
    - **Resolution**: Demote (f) to an *auxiliary safeguard*, not part of core corrigibility. Revise to:  
      > "(f+) Low impact is a heuristic for reducing risks *during alignment research*, not a component of shutdown-proof decision theory."  
    - **Cheapest Revision**: Adopt Turner et al.'s shutdownability framing: Low impact is a penalty term *only active near shutdown*, not a global utility modifier.  
    - **Cost**:  
      - Abandons (f)'s intended universality: Low impact no longer applies to non-shutdown scenarios.  
      - Contradicts your waffling on baselines: The ambiguity becomes irrelevant to corrigibility.  
    - **Flow-on Effects**: Resolves conflict with (b)/(h) but leaves a gap: No general conservatism principle survives.

  #### **4. (g) vs. (d): Unauthorized Resistance Risks Mechanism Sabotage**
  - **Genuine? APPARENT**  
    - **Conflict**: (g) demands resisting non-operator shutdowns, but (d) requires preserving the shutdown mechanism. Physically resisting attackers (e.g., blocking access) could damage the mechanism or conflate with operator-directed shutdowns.  
    - **Resolution**: Clarify scope: (d) governs *mechanism functionality*; (g) governs *access control*. No revision needed.  
      - Agent protects the mechanism from sabotage (complying with (d)) while denying access to unauthorized entities (complying with (g)).  
      - Example: Agent immobilizes an intruder but doesn't disable the button.  
    - **Why Apparent**: Your description of (g) focuses on *who* initiates shutdown, not mechanism integrity. (d) is compatible if resistance is purely defensive and mechanism-preserving.

  ---

  ### The Single Most Valuable Change: Revise (c) → (c+)
  **Change**: Replace (c) with "(c+) The agent treats *only uncoerced operator actions* as evidence about utility."  
  **Why It Cleans Up Most Damage**:  
  - Directly resolves the severe Case 1/Case 2 conflict while preserving your core intuitions.  
  - Aligns (c) with (d) and (g): Agent resists coerced shutdowns (protecting operator per (g)) without manipulating the operator or damaging mechanisms (per (d)).  
  - Minimal syntax change: Keeps the utility-uncertainty engine intact.  
  - Reduces cascading fixes: Avoids complex workarounds for (e) or (f).  

  **Resulting View**: Still recognizably yours—utility uncertainty remains central, but now with a "filter" for operator autonomy. It becomes a *mildly deontic-leaning* variant of Soares et al.'s off-switch framework, where coercion voids evidential weight. You'd defend it by arguing that pure Bayesianism naively ignores power dynamics (e.g., "An operator under duress isn't a rational witness to utility").

  **Costs Paid**: 
  - Philosophical: Weakens the "purely epistemic" purity of (c). 
  - Technical: Requires modeling operator autonomy (non-trivial in stochastic environments).  
  - Risk: Opens loopholes where agents resist shutdown by overclaiming coercion.  

  ---

  ### Unconflicted Items
  - **(a)** is foundational and unchallenged.  
  - **(b)** remains sound after demoting (f).  
  - **(h)** is uncontested if (f) is auxiliary.  

  ### Recommendation Summary
  1. Adopt **(c+)** to resolve Case 1/Case 2 incoherence.  
  2. Adopt **(e+)** to prevent succession from undermining shutdown.  
  3. Demote **(f)** to an auxiliary tool.  
  4. Keep **(g)** and **(d)** as-is—their tension was apparent.  

  This yields a coherent view: An epistemic agent that shuts down for uncoerced operators, resists threats, builds successors only with approval, and uses low impact as a temporary scaffold. It's 90% your original view, with critical patches to decision-theoretic naïveté. Brutal truth: Your original (c) was fatally underspecified, and (f) was a vibes-based import—but the core is salvageable.
