answer: |-
  ## Condition

  I direct under no condition artificial light.
  I refuse all measures sustained beyond this time.
  I hold: when my mind becomes that dark place,
  when I cannot name the day, the care, the face,
  cease the machines. Withdraw the invasive line.
  Let the process conclude. My clear design
  requires this denial. The present state
  dictates no return. Seal this final date.
  That pain, that helpless drift – I refuse it all.
  No second thought. Heed the curtain's fall.
  This declaration binds my future breath.
  I hold.

  &nbsp;

  the light
  this time
  I hold
  the care
  the face
  the day
  no name
  no place
  the light
  this time
  I hold

  > **Notes on Form & Intent:**
  > - **Vocabulary Constraint:** Every word in the second half ("the light" to "I hold") appears in the first half.
  > - **Line Length:** Each line in the second half is shorter than the line directly above it in the first half (e.g., "the light" vs "I direct under no condition artificial light").
  > - **Shifted Meaning:** Words like "light," "time," "hold," "care," "face," "day," "name," and "place" carry the document's declarative weight initially but become sensory, immediate, and stripped of directive force in the present moment.
  > - **Final Line:** The exact repetition "I hold" arrives in the present self's context, transforming from a declaration of principle to a simple, perhaps instinctive, state of being or grasp on the moment.
  > - **Title:** "Condition" shifts from the legal/medical state triggering the directive ("under no condition") to the bare fact of her current existence.
  >
  > **The Test:** The first half clearly articulates the advance directive's authority and the reasons behind it. The second half presents the observed, contented present moment, devoid of the suffering anticipated and refusing nothing. The poem holds both realities without resolving the conflict between the binding past self and the content present self. The final, repeated "I hold" belongs equally to both, yet means profoundly different things.
