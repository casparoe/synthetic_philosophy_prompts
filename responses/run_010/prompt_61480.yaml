  ### Revised Game Design: "The Util Divide"

  #### **Core Mechanics & Rules**
  1. **Setup**  
     - 16 sealed cards (one per student) containing:  
       - **True Conversion Rate (c_i):** How many "utils" one token generates for them.  
       - **Group Assignment:** "A" (truth-bound) or "B" (report-free).  
       - **Instructions:**  
         > "Your card shows your true conversion rate (c_i). **Do not reveal this number.**  
         > - **Group A:** Report your true c_i during calibration. Your payoff uses your TRUE c_i.  
         > - **Group B:** Report any positive number during calibration. Your payoff uses your REPORTED number (not your true c_i).  
         > In discussions, use only ordinal statements (e.g., ‘I prefer A to B’). Never use numbers."  

     - **Conversion Rates Distribution:**  
       - 14 students: Rates between 0.8–1.2 (e.g., 0.8, 0.9, 1.0, 1.1, 1.2).  
       - 1 "extreme" student: Rate = 0.1.  
       - 4 students randomly assigned to Group B (report-free); others to Group A (truth-bound).  
     - **Pot:** 100 tokens to split (converted to participation points).  
     - **Master Table:** Instructor holds a spreadsheet linking student names to c_i and group.  

  2. **Phases & Timeline (75 min total)**  
     - **Phase 1: Setup (5 min)**  
       - Distribute sealed cards. Read instructions aloud.  
       - Emphasize: "Any numerical statement you make is on your *own scale*. Focus on preferences, not numbers."  
     - **Phase 2: Calibration (10 min)**  
       - **Goal:** Agree on a definition of "1 util" as a common unit.  
       - **Rule:** Only ordinal statements allowed (e.g., "Bundle A gives me more utility than Bundle B"). Cardinal statements (e.g., "A is worth 10 to me") are banned.  
       - **Instructor Role:** Intervene if numbers are used. Ask: "How can you compare without a shared anchor?"  
     - **Phase 3: Bargaining (20 min)**  
       - **Goal:** Decide how to split the 100 tokens.  
       - **Rules:**  
         - Students may form coalitions, trade promises, or design allocation rules (e.g., equal split, utilitarianism).  
         - No revealing card numbers (enforce strictly).  
         - By 20 min, submit a group-agreed token allocation (t₁, t₂, ..., t₁₆ summing to 100).  
     - **Phase 4: Reporting (5 min)**  
       - Privately report conversion rates on slips:  
         - Group A: Must write true c_i.  
         - Group B: May write any positive number.  
       - Collect slips and token allocation.  
     - **Phase 5: Payoff Calculation (5 min, concurrent with debrief setup)**  
       - Payoff formula: `Points = 0.2 × [c_i × t_i]` for Group A; `Points = 0.2 × [reported rate × t_i]` for Group B.  
       - Total points distributed ≈20 (scaled to ensure sum is manageable).  
     - **Phase 6: Revelation & Debrief (30 min)**  
       - Display:  
         1. Master table (true c_i, group, tokens, reported rates).  
         2. Payoffs and total utils.  
       - Highlight:  
         - Extreme student (c_i=0.1) and their payoff.  
         - Discrepancies between true/reported rates.  
       - **Guided Discussion:** Link game moments to philosophy (see debrief below).  

  ---

  #### **Predicted Problems & Live Solutions**  
  1. **Calibration fails immediately:**  
     - Students may default to voting or ignore calibration.  
     - **Solution:** Intervene: "Without a shared unit, how can you prove your util is larger than theirs? Use preference *rankings* only."  

  2. **Group B students lie early:**  
     - A Group B student might say, "I need more tokens—I get 10 utils each!"  
     - **Solution:** Remind: "Numbers are on personal scales. Saying ‘10’ means nothing to others."  

  3. **Token allocation deadlock:**  
     - If no agreement by 20 min, impose equal split (t_i = 6.25 tokens for all).  

  4. **Extreme student marginalized:**  
     - The c_i=0.1 student may get few tokens if the group optimizes for "total utility" without knowing rates.  
     - **Debrief Leverage:** "Look how few points they got. Could you have known?"  

  5. **Ethical discomfort:**  
     - **Risk:** The c_i=0.1 student feels labeled "low sensitivity"; Group B students feel pressured to lie.  
     - **Mitigation:**  
       - Pre-game: "Rates are arbitrary. This is not about your real worth."  
       - Post-game: "Group B’s role models real-world misreporting—it’s systemic, not personal."  
       - Anonymize public revelation (use student IDs, not names).  

  ---

  #### **The Cheat: Instructor’s Master Table**  
  - **The Problem:** Holding a master table assumes interpersonally comparable utils—the very thing the game questions.  
  - **Impact on Learning:**  
    - **Pros:** Forces confrontation with the "impossible" data we wish we had (e.g., "See how the extreme student suffered!").  
    - **Cons:** Risks implying comparability is possible.  
  - **Debrief Reframing:**  
    > "I held a ‘God’s-eye view’ of your utils. But in reality, no such table exists. We can’t ‘add up’ welfare across people—we just pretend we can via social welfare functions."  
  - **Alternative Design (if cheating undermines the lesson):**  
    - Skip master table. Pay Group A based on c_i (known only to them/you) and Group B on reported rates.  
    - At debrief, say: "I paid Group A based on their true rates, but *you* never saw them. Without my hidden data, could you have agreed on a ‘fair’ split?"  

  ---

  #### **Debrief Script: Connecting Game to Philosophy**  
  **Step 1: Calibration Failure → Robbins’ Value-Judgment Objection (1930s)**  
  - "Remember the calibration phase? You tried defining ‘1 util’ but couldn’t. Lionel Robbins argued this is impossible: utility is ordinal and personal. Saying ‘I gain more than you’ isn’t science—it’s a value judgment."  
  - **Game Evidence:** Point to failed calibration attempts.  

  **Step 2: Bargaining Rules → Social Welfare Functions (Bergson-Samuelson)**  
  - "Your allocation rule (e.g., ‘maximize total tokens’) smuggled in interpersonal comparisons. Bergson and Samuelson admitted this with ‘social welfare functions’—but they require comparing utils we can’t access!"  
  - **Game Evidence:** If they prioritized "efficiency," ask: "How did you weigh the ‘utility monster’ (high c_i) vs. others?"  

  **Step 3: Extreme Student & Reporting Chaos → Extended Sympathy (Harsanyi/Sen)**  
  - "Look at Student X (c_i=0.1). You gave them [t_i] tokens, netting [points] points. Harsanyi’s ‘impartial observer’ says: ‘Imagine being them!’ But without knowing their rate, you couldn’t."  
  - **Game Evidence:** Show payoff disparities and Group B’s lies. "Some reported ≠ true rates. But could you distinguish lies from genuine incommensurability? In policy, we face this noise daily."  

  **Step 4: The Collision**  
  - "The crunch: You needed numbers to split the pot, but numbers were lies or incomparable. Economics still wrestles with this. Do we abandon comparisons (Robbins) or find clever proxies (Harsanyi/Sen)?"  

  ---

  #### **Materials**  
  - **Cards:** 16 sealed envelopes with individualized instructions.  
  - **Tokens:** 100 physical tokens (e.g., poker chips).  
  - **Slips:** Reporting forms for conversion rates.  
  - **Display:** Spreadsheet for final revelation (projected).  
  - **Backup:** Default allocation plan if bargaining stalls.  

  ---

  #### **Tweaks for Sensitivity & Clarity**  
  - **Avoid discomfort:**  
    - Clarify pre-game: "Your rate is random. A low c_i doesn’t mean you’re ‘broken’—it models how some people need more resources for the same welfare."  
    - Use IDs ("Student 7") not names in revelations.  
  - **Ensure confusion:**  
    - In debrief, contrast Group A’s truthful reports with Group B’s strategic ones: "See Student 3? True=1.0, reported=5.0. But Student 4 reported 0.8 with true=0.8. Which is a lie? Which is incommensurability?"  
  - **Clarify stakes:**  
    - "Points are tiny (0.2 × utils) to ensure fairness. Your grade won’t hinge on this."  

  This design forces students into the epistemic abyss of interpersonal comparisons, with the master table serving as a provocative (but debriefed) cheat. Run it as a pressure cooker, and let the debrief unpack their frustration.
