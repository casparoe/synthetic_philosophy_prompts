prompt: |-
  I sit on the committee that hands out our institute's annual prize — its both an honor (a medal plus the named lecture) and a decent chunk of money, and we've never formally separated the two. Here's our track record over the last dozen years, as best I can reconstruct it from the minutes and my memory of the arguments in the room:

  - We gave it to a mathematician who'd ground away for eleven years at a problem everyone else had dropped. The result was solid, not spectacular, and nobody in the meeting claimed he was a genius; the case for him was basically that he'd stayed with it.
  - One year we gave it to a famously effortless person — a result that looked like it came out of nowhere. The minutes record two rationales, one about the work itself and one about the invisible years before the apparent overnight success, and I dont think the committee ever settled which of the two it was endorsing.
  - We turned down a nomination for someone who had put in truly enormous hours building behavioral targeting tech for advertisers. The recorded reason was that we're not in the business of rewarding application as such.
  - We gave it to a biologist whose key finding came out of a contaminated sample, on the grounds that she'd then spent years turning the accident into something that stood up. Somebody's phrasing in the minutes was to the effect that the luck was in the finding and the work was in making it real.
  - We split it once between the person whose name was on the famous paper and the technician whose unglamorous method made the paper possible — and in that case we split the honor but gave the money to only one of them. I remember that being contentious and the rationale never getting written down properly.
  - Twice we've given the early-career version to someone whose absolute output was smaller but who had, in the words we used, done it from a much harder start.

  Now this year's live nomination. She used a frontier AI model for the heavy generative lifting on a genuinely important paper: it suggested the key construction, drafted a lot of the intermediate work, and caught an error she'd otherwise have missed. She picked the problem herself, spent about a year checking and extending every line until she understood all of it, and the result is a real advance nobody else has. She also comes from a poor family with no academic background, but she's at one of the handful of institutions that can afford the good subscription and the compute, which most researchers in her field can't. Two of her peers got comparable results with pen and paper over considerably more hours.

  What should we decide, if the aim is to be consistent with ourselves rather than with our gut feelings about AI? Specifically:

  1. Lay out the candidate rules that fit all six precedents about equally well. I can think of three — reward costly effort, provided it's spent on ends worth pursuing; reward whatever is attributable to the agent once you subtract luck and starting advantage; reward the achievement but let the honor and the money track different things — and I suspect I'm missing at least one.
  2. Say what each rule actually delivers on this nomination and exactly where they come apart. Note that our own precedents let us split honor from money, so "award it" may not be one decision but two, and different rules may split it differently.
  3. Give me your best guess at what we should do, name which precedent is the closest analog, and say why it's closer than the ones that pull the other way.
  4. If the precedents genuinely underdetermine this, say plainly which principle we'd be adopting by ruling one way rather than the other — i.e., what we'd be on the hook for the next time a case like this walks in.
  5. Propose a further case, ideally one we could plausibly get a nomination for in the next few years, that would tell the candidate rules apart, and say what each rule predicts about it.

  Commit to a recommendation with a rough sense of how confident you are rather than listing everything as equally defensible. Then tell me what would change your mind: which of the six precedents you're leaning on hardest and whether it deserves that weight, what somebody could say in the meeting that would flip your recommendation, and where you think your reconstruction of our implicit rule is most likely to be wrong.
reasoning: |-
  Hmm, the user is a committee member grappling with a tricky AI-related nomination for their institute's prize. They've provided six precedents and want a consistent framework to evaluate this case. Let me unpack this carefully.

  First, the precedents show clear patterns:
  - The 11-year mathematician rewards persistence despite unspectacular results
  - The effortless genius case reveals ambivalence about innate talent vs hidden work
  - Rejecting ad-tech applicant shows "pure knowledge" preference over applied work
  - The contaminated sample biologist rewards turning luck into rigor
  - The split award exposes tension between credit and compensation
  - Early-career awards correct for starting disadvantages

  Now this year's candidate used frontier AI as a collaborative tool - she directed the research but leveraged computational advantages. The core tension is between rewarding her achievement versus the role of privileged access and non-human contribution. 

  Three candidate rules emerge from the precedents:
  1) Costly effort toward worthy ends (explains mathematician, biologist, early-career cases)
  2) Personal attributable contribution minus luck/advantage (explains ad-tech rejection, effortless case ambiguity)
  3) Decoupling honor and money (explains the split award)

  For the AI nominee:
  - Rule 1 would award fully - her year of verification was costly effort
  - Rule 2 would discount for AI's contribution and institutional advantage
  - Rule 3 might split - honor for her direction, money to offset others' compute disadvantage

  The closest precedent is actually the contaminated sample case - both involved fortuitous starting points requiring rigorous validation. But unlike the biologist's accidental contamination, this nominee deliberately used a tool others lack access to. 

  If we award fully, we're endorsing "tools are neutral" - what matters is how you use them. If we discount, we're prioritizing level playing fields. A future test case could be a researcher using exclusive telescope access for breakthrough astronomy - Rule 1 would reward, Rule 2 might discount for access advantage.

  I'm 70% confident in a split approach: full honor for her intellectual leadership, but partial money allocation toward compute grants for disadvantaged peers. This honors Rule 3's decoupling precedent while addressing Rule 2's equity concerns. The biologist case is my anchor because both transformed randomness into rigor.

  What could change my mind? If someone argues the AI was merely an instrument like any lab equipment, that strengthens Rule 1's case for full award. Or if we uncover that her "checking" work was superficial, that would undermine the biologist parallel. The shakiest assumption is that institutional access is analogous to "starting disadvantage" rather than just tool access.

  The committee should probably explicitly discuss whether AI is more like a telescope (tool) or a co-author (contributor) to set clearer future rules.
answer: |-
  Here’s a structured analysis of your dilemma, grounded in your precedents and aimed at consistency. I’ll commit to a recommendation with confidence levels and explicitly identify where I might be wrong.

  ---

  ### 1. **Candidate Rules Extracted from Precedents**  
  Your precedents support **four distinct rules** (I’ve added one you missed):  
  - **Rule A: Reward costly effort toward intrinsically valuable ends**  
    (Fits: 11-year mathematician, biologist validating contamination, early-career awards for overcoming disadvantages)  
  - **Rule B: Reward attributable agency minus luck/structural advantages**  
    (Fits: Rejecting ad-tech (applied ≠ "pure" ends), effortless genius debate (was it agency or hidden advantage?), early-career adjustments)  
  - **Rule C: Decouple honor (recognition) and money (compensation/practical impact)**  
    (Fits: Split award for paper author vs. technician)  
  - **Rule D: Reward outcomes that transcend initial conditions/luck**  
    (Fits: Biologist turning accident into rigor, early-career awards for "harder starts," rejecting ad-tech (rewarding ends, not means))  

  *Rule D* is the addition: It emphasizes *transformation of circumstance* into enduring value, distinct from Rule B’s focus on personal agency.

  ---

  ### 2. **Application to Current Nomination**  
  | **Rule** | **Honor (Medal/Lecture)** | **Money** | **Rationale** |  
  |----------|---------------------------|-----------|--------------|  
  | **A** | Yes | Full | Her year of rigorous checking/extending is costly effort advancing worthy science. |  
  | **B** | Partial/No | Partial/No | AI’s generative role and institutional compute access dilute her attributable agency. Peers’ pen-and-paper work may reflect purer agency. |  
  | **C** | Yes | Split/Redirect | Honor for her intellectual direction; money split with peers or fund compute access for disadvantaged researchers. |  
  | **D** | Yes | Full | She transformed AI’s output into a validated advance, transcending the "luck" of access (like the biologist). |  

  **Where rules diverge**:  
  - **A vs. B**: Rule A prioritizes her effort; Rule B discounts for AI/institutional advantages.  
  - **C vs. Others**: Only Rule C splits honor/money materially.  
  - **D vs. B**: Rule D sees AI as "luck" to overcome; Rule B sees it as reducing her agency.  

  ---

  ### 3. **Recommendation**  
  - **Award the honor (medal/lecture) but split the money**.  
  - **Closest precedent**: **Biologist with contaminated sample** (Precedent 4).  
    - *Why it fits*: Both involved an initial external factor (contamination/AI) that *enabled* the discovery, but the core award-worthy work was the rigorous validation and extension. Her "year of checking" mirrors the biologist’s "years making it real."  
  - *Why not others*:  
    - The 11-year mathematician (Precedent 1) lacked an external catalyst; this is closer to transforming fortune.  
    - The split award (Precedent 5) decouples credit, but here the AI isn’t a human collaborator needing compensation.  
  - **Confidence**: 75%. Strong alignment with Rule D and Precedent 4.  

  ---

  ### 4. **If Precedents Underdetermine, New Principle**  
  If you award her fully, you adopt:  
  > **"Tools (including AI) are neutral; credit belongs to the user who directs/validates them."**  
  This would commit you to rewarding *any* AI-assisted work if the researcher demonstrates mastery.  

  If you deny/reduce the award, you adopt:  
  > **"Structural advantages (compute access, AI) dilute attributable excellence."**  
  This risks penalizing researchers at elite institutions or using new tools.  

  ---

  ### 5. **Test Case to Distinguish Rules**  
  **Scenario**: *A researcher uses a proprietary quantum computer (only 3 exist) to solve a decades-old problem in days. Competitors without access work manually for years.*  
  - **Rule A**: Awards fully – effort directed toward valuable ends.  
  - **Rule B**: Denies/reduces – advantage overshadows agency.  
  - **Rule C**: Splits – honor to researcher, money to fund open-access quantum resources.  
  - **Rule D**: Awards fully – transcending the "luck" of access via validation.  

  ---

  ### **Commitment & Vulnerabilities**  
  - **My Recommendation**: **Honor yes, money split** (e.g., 50% to her, 50% to a fund for compute access for disadvantaged researchers).  
  - **Leaning Hardest on**: **Biologist precedent (4)** and **Rule D**.  
    - *Why it might not hold*: The biologist’s contamination was *unintended* luck; her AI use was *deliberate*. If your committee sees tool access as a strategic choice (not "luck"), Rule B gains weight.  
  - **What Could Change My Mind**:  
    - If someone argues her "year of checking" was *routine verification* (not transformative rigor), Rule D weakens.  
    - If the AI’s role was truly autonomous (e.g., it *designed* the experiment), Rule B suggests denying honor.  
  - **Weakest Assumption**: That institutional compute access is analogous to "luck" (Precedent 4) rather than "privilege" (Precedent 6). If access is seen as unfair advantage, Rule C’s money split becomes essential.  

  **Final Word**: This case pushes you to clarify if "overcoming disadvantage" (Precedent 6) includes *tool access disparity*. If so, splitting the money addresses that gap while honoring her agency. Precedents support this balance.
