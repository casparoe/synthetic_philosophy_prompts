answer: |-
  Here's your Q&A prep sheet, designed for this specific interdisciplinary gauntlet. I've prioritized objections by damage potential, flagged soft spots, and marked where rational-choice slippage is a risk. Replies are in **bold** – keep them under 90 seconds by focusing on your core evidence and framing.

  ---

  ### **Top-Tier Objections (High Damage Potential)**
  1. **Economic Historian (Selection Bias)**:  
     *Phrasing:* "Your newspaper sample is skewed toward *reported* duels – mostly elite, urban, and those that didn’t end quietly. How do you know this reflects the broader decline? Couldn’t dueling just have gone underground?"  
     **Concede**: Newspapers miss unreported/private settlements.  
     **Hold**: The *shift in whose judgment matters* is visible even in this biased sample – the "referee" changes from local peers to institutional/print authorities.  
     **Reply**: "You’re right – this data captures elites and public scandals. But that’s exactly the point: the *publicness* of honor is central. When newspapers report that Colonel X accepted Admiralty censure over his club’s opinion, it shows the referee changed. Even elites stopped caring about local audiences."  
     *Soft spot?* Yes – but stress your argument is about the *mechanism* of decline for the dueling class, not total prevalence.

  2. **Philosopher (Honor vs. Dignity Redux)**:  
     *Phrasing:* "Isn’t ‘audience change’ just honor adapting? If the army or *The Times* becomes the new audience, you’ve described institutionalized honor – not dignity. How is this different from Appiah’s ‘honor world’ expanding?"  
     **Concede**: Honor norms didn’t vanish overnight.  
     **Hold**: The shift fractured honor’s *local immediacy*. Dignity requires no audience; honor does. When the audience is abstract (institutions, readers), it becomes reputation management – closer to proto-dignity.  
     **Reply**: "Crucially, institutional/print audiences are *impersonal* and *delayed*. You can’t demand satisfaction from a promotion board or a newspaper reader. This isn’t honor adapting – it’s honor becoming bureaucratized until the duel loses its function. Williams’ ‘thick’ honor requires face-to-face recognition; this is thinner, more like credentialing."  
     **PRAY THIS DOESN’T COME.** If it does, pivot to your timing evidence: the referee shift precedes the duel’s decline.

  3. **Sociologist (Functionalist Fallacy)**:  
     *Phrasing:* "You say the audience ‘absorbed reputational labor.’ Sounds like you’re describing an outcome (dueling declined) and calling it a cause. Where’s the mechanism? Was this intentional institutional crowding-out?"  
     **Concede**: No conspiracy – institutions didn’t set out to kill dueling.  
     **Hold**: The mechanism is *cultural displacement*: as reputational stakes shifted to print/institutions, the duel lost its social utility.  
     **Reply**: "The mechanism is competition for social capital. My data shows seconds and clubs yielding ground to court-martials and editorials. When Captain Y’s 1832 challenge was dismissed because ‘the Admiralty already cleared him,’ the *work* of honor was done institutionally. No functional intent needed – it’s emergent cultural drift."  
     *RATIONAL CHOICE RISK:* Avoid words like "utility" or "cost-benefit." Say "social capital" or "symbolic efficacy."

  ---

  ### **Mid-Tier Objections (Manageable but Threatening)**
  4. **Legal Historian (Statutes Do All the Work)**:  
     *Phrasing:* "The 1803 Anti-Dueling Act and military reforms made dueling legally toxic. Why isn’t this simple legal deterrence?"  
     **Concede**: Laws raised stakes.  
     **Hold**: Laws were rarely enforced pre-1850s! Dueling declined *before* prosecutions surged. My data shows challenges dropped when institutional/print audiences gained authority, not when laws tightened.  
     **Reply**: "Prosecutions were vanishingly rare before 1840. What changed earlier was *social* accountability: post-1820s, officers feared promotion blocks more than trials. The law mattered when the *audience* for shame shifted – newspapers cited military regulations, not statutes."  

  5. **Economic Historian (Endogeneity)**:  
     *Phrasing:* "How do you know institutional rules caused the audience shift? Maybe both were effects of broader social changes – urbanization, capitalism – that dissolved honor cultures."  
     **Concede**: Broader forces matter.  
     **Hold**: My sequencing: print/institutional referees rose *concurrently* with duel declines in specific contexts (military/clubs), before industrial capitalism peaked.  
     **Reply**: "Timing is key. Naval dueling fell fastest – where posting rules centralized reputational power by 1820. In commercial hubs like London, dueling persisted longer among civilians. This suggests institutional mediation, not macro-social waves."  

  6. **Sociologist (Audience = Power)**:  
     *Phrasing:* "Calling it ‘audience change’ feels apolitical. Isn’t this about the state and bourgeoisie monopolizing symbolic violence? Your ‘institutional referees’ are elite gatekeepers."  
     **Concede**: Yes, power is central!  
     **Hold**: My point is *how* they monopolized it: by capturing reputation management, not moralizing.  
     **Reply**: "Absolutely – but I’m showing *how* gatekeeping worked culturally. The state didn’t just ban duels; it made its promotions process the reputational arena. The bourgeoisie did similarly via newspapers. My data tracks that transfer of cultural authority."  

  ---

  ### **Generalization Trap (Abolition)**
  7. **All (But Especially Philosopher/Sociologist)**:  
     *Phrasing:* "You claim this model generalizes. But abolition involved moral arguments, mass politics, and economic interests. How can ‘audience shift’ explain that?"  
     **Concede**: Abolition had unique drivers (e.g., evangelicalism).  
     **Hold**: Reputational labor shifted there too – from planters to metropolitan publics via print.  
     **Reply**: "Parallel, not identical. Like dueling, abolition saw local honor (planter sovereignty) challenged by new audiences: British newspapers, petitions, and courts. The key is *whose judgment mattered*. West India Committees lost status when Parliament responded to public opinion, not colonial elites. I’d test this by tracking where pro-slavery arguments were directed pre/post-1807."  
     *Soft spot?* YES – admit this is provisional. "This chapter establishes the model; future work tests it elsewhere."

  ---

  ### **Nuclear Option (If You Sound Like Rational Choice)**
  8. **Philosopher/Economic Historian (Incentives in Disguise)**:  
     *Phrasing:* "Isn’t ‘audience change’ just incentive realignment? People stopped dueling because new audiences imposed higher costs. That’s rational choice with cultural window-dressing."  
     **Concede**: Social costs matter.  
     **Hold**: *Cultural validation* was the currency – not material costs. A court-martial’s "disgrace" wasn’t a fine; it was exile from honor.  
     **Reply**: "If this were rational choice, we’d see more covert violence. But dueling was *never* rational! Men died for apologies. The change is in whose recognition conferred honor – not cost calculus. My data shows men refusing duels *because* institutional vindication satisfied honor. That’s cultural logic, not optimization."  
     **RATIONAL CHOICE RED FLAG:** If you say "costs," you’ve lost. Say "recognition," "standing," or "symbolic capital."

  ---

  ### **Summary Defense Strategy**
  - **Anchor replies in your data**: "My evidence shows X trend in referee attribution..."  
  - **Concede selectively**: Admit limitations (selection, abolition gaps) but defend your mechanism’s plausibility.  
  - **Avoid economics jargon**: Say "social capital," not "incentives"; "cultural displacement," not "efficiency."  
  - **Pray for**: The philosopher not asking Objection #2 (honor vs. dignity). If they do, pivot to "It’s about the *scaffolding* of honor, not its essence."  
  - **Nuclear triage**: If rational choice accusations fly, quote a duelist’s letter showing non-instrumental logic (e.g., "I care only for the regiment’s opinion, not the law").  

  **Final tip**: Start your Q&A by saying, "This chapter focuses on dueling, but I’m exploring parallel shifts elsewhere." Pre-empts the abolition question. You’ve got this – your argument is nuanced and evidence-driven. Now own it.
