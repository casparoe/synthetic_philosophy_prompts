prompt: |-
  I am one of the two student editors of my high school's weekly newspaper. We publish roughly 2,500 words a week, written by four staff writers who, like me, have no background in political science, and everything goes to print only after a twenty-minute pre-publication meeting that our faculty adviser, a history teacher, has to sign off on. This term we have had a run of complaints — two from parents in the letters column, one from the adviser — all amounting to the same charge: that we use the words "liberal," "libertarian," "classical liberal," "neoliberal," and "progressive" as though they meant one thing, when in fact the same word picks out opposite positions depending on whether the article is about the United States or about Europe, and depending on when it was written. She is right, and I want to fix it with a procedure rather than with a lecture nobody will read.

  Please write that procedure: an ordered list of questions to ask of any sentence containing one of those labels, what counts as a sufficient answer at each step, the point at which the procedure terminates in "strike the label and describe the position instead," and the points at which it hands the decision up to me or to the adviser because the question is one of editorial judgment rather than fact. Two constraints matter. First, it has to be runnable in under three minutes per sentence by a sixteen-year-old in that meeting. Second, the writers may not look anything up, because we have no research time and roughly half our copy concerns countries none of us have studied; the procedure therefore has to say what to do when the answer is not already known to the person applying it. Every output should be a phrase a writer can paste straight into copy, not a note to self.

  Begin with a grounding section of no more than about a hundred words stating the distinction or distinctions the whole procedure rests on, since that is the most our writers will read. Then separate three ways the word fails: a false friend, where the term exists in both languages but does not carry the same meaning; drift inside a single language over time; and the case where the extension is roughly constant but the word is praise in one discourse and blame in another. Tell me which of those three a mechanical rule can actually fix and which can only be fixed by rewriting the sentence, and let that difference shape the steps.

  Then run it on the six pieces in this week's issue and give me the sentence we should print in each: a brief on Danish coalition talks mentioning Venstre, whose name literally means "Left"; a short item on Norwegian education policy mentioning that country's Venstre; a translated French article that calls a candidate "libéral"; a profile of Argentina's president, who calls himself a liberal and a libertarian, proposes dollarizing the currency and abolishing ministries, and rejects being called a neoliberal, while much of the foreign press calls him a right-wing populist; a trade story quoting a backbencher from Australia's Liberal Party; and a piece we are co-running with the history department on the nineteenth-century British Liberal Party.

  Please be candid where the procedure goes against me. Last term I imposed a house rule that none of these words may appear in the paper without the sense being specified on the spot, and I expect that rule will not survive contact with a 2,500-word weekly; if it will not, say so plainly and propose the narrower rule that should replace it. I also want a rule for when a contested, pejorative-leaning label such as "neoliberal" may stand in a news story as opposed to an opinion column. The adviser cut it from a news piece last month and I thought she was wrong, but I would rather have a procedure that sometimes rules against me than one engineered to rule for me.

  Finally, state what the procedure cannot settle: the cases where accuracy and what our readers will inevitably infer genuinely conflict, the cases where the subject's own country disagrees about the label, and anything that depends on a writer correctly identifying a discourse community they have never encountered. A reading list or sources would be useless to us; I am asking only for the procedure and the worked cases.
reasoning: |-
  Okay, I need to help this student editor create a procedure for using political labels accurately in their high school newspaper. They're dealing with confusion around terms like "liberal," "libertarian," etc., which have different meanings across regions and time periods. 

  First, I should understand their constraints: they have no research time, meetings are only 20 minutes, and writers can't look things up. The procedure must be under 3 minutes per sentence and output ready-to-use phrases. The editor also wants honesty about whether their existing house rule is feasible.

  The core issue is threefold: false friends (same word, different meanings), semantic drift over time, and value-laden terms (praise vs blame). Only false friends can be fixed mechanically; the others require rewriting. This distinction should shape the procedure.

  For the grounding section, I'll keep it under 100 words explaining the key differences: US vs non-US usage, and historical vs modern meanings. Then I'll structure the procedure as a flowchart with yes/no questions leading to specific actions: keep term, replace with description, or escalate.

  Now for the six test cases:
  - For both Venstre mentions: Need to clarify they're center-right despite "Left" name
  - French "libéral": Must specify it means pro-market
  - Argentina's president: His self-ID as liberal/libertarian requires context about dollarization/minister abolition
  - Australian Liberal Party: Standard center-right designation is acceptable
  - Historical British Liberals: Need "19th-century" modifier

  The editor's house rule banning all terms without immediate specification probably won't work at their output volume. Better to require specification only when confusion is likely (non-US/historical contexts). For contested labels like "neoliberal," they should only appear in opinion pieces with attribution.

  Limitations to note: When local consensus is disputed (like Argentina's president), or when readers might infer incorrectly despite accuracy. Writers can't be expected to know unfamiliar discourse communities.

  This balances practicality with accuracy while respecting their time constraints. I'll make sure the outputs are paste-ready phrases for each case.
answer: |-
  Here is a procedure designed for speed, clarity, and actionable outputs within your constraints, followed by the worked examples and candid assessment:

  **Grounding (95 words):**
  Political labels like "liberal" or "left" change meaning across place and time. In Europe, "liberal" usually means pro-free-market and limited government (like US "libertarian"). In the US, "liberal" means activist government on social/economic issues. "Left" in Scandinavia often names center-right parties (Venstre). Historical terms (19th-century "Liberal") rarely match modern usage. "Neoliberal" and "progressive" carry strong positive/negative connotations depending on who uses them. Mechanical rules can fix simple location/time mismatches ("false friends", "drift"). Connotative clashes ("praise/blame") always require rewriting. Label only when meaning is clear *to our readers*.

  **Procedure: "Label Check" (Run per sentence containing target word)**

  1.  **Is the label applied to a current party/person/group in the United States?**
      *   **Yes:** Proceed to Step 4.
      *   **No:** Proceed to Step 2.

  2.  **Is the label applied to a current party/person/group outside the United States?**
      *   **Yes:** Output: `Strike the label. Describe the position instead using policy/goals (e.g., "supports free markets and limited social spending," "advocates for strong social welfare programs")`. **TERMINATE**.
      *   **No (Historical context):** Proceed to Step 3.

  3.  **Is the label applied to a historical context?**
      *   **Yes:** Output: `Strike the label. Replace with the historical context + description (e.g., "19th-century British Liberals, who championed free trade and parliamentary reform," "Cold War-era neoliberals advocating deregulation")`. **TERMINATE**.
      *   **No:** **ESCALATE TO EDITOR** (Sentence structure unclear).

  4.  **(US Context Only) Is the label ("neoliberal", "progressive") being used pejoratively or as praise within the sentence/article?**
      *   **Yes (Pejorative/Praise evident):** Output: `Strike the label. Describe the position and the criticism/support (e.g., "critics who argue his deregulation policies prioritize corporations," "supporters who see her education plans as innovative reforms")`. **TERMINATE**.
      *   **No (Neutral usage) OR Label is "liberal", "libertarian", "classical liberal":** Proceed to Step 5.

  5.  **(US Context, Neutral/Non-Pejorative)** Is the label attached to a widely recognized US group with a stable meaning *in this context*? (e.g., "liberal Democrat," "libertarian Cato Institute," "classical liberal commentator").
      *   **Yes:** Output: `Label may stand.` **TERMINATE**.
      *   **No (Ambiguous, vague, or contested usage):** Output: `Strike the label. Describe the specific position or policy stance.` **TERMINATE**.

  **Key Mechanics:**
  *   **Steps 1-3:** Fix "False Friends" (Location) and "Drift" (Time) mechanically by *always* striking the label for non-US/Historical and replacing with description. No research needed, just recognition of context.
  *   **Step 4:** Addresses "Praise/Blame" *only* for US context. Requires recognizing tone; if tone is present, strike and describe neutrally.
  *   **Step 5:** Allows common US terms *only* if used neutrally and specifically. Vagueness triggers rewrite.
  *   **Escalation:** Only for unclear context (Step 3 No). Judgment calls on connotation (Step 4) are handled by the procedure forcing a rewrite.
  *   **Output:** Always a concrete instruction: `Strike...`, `Replace with...`, `Label may stand.`
  *   **Time:** Focused Y/N questions. Should take <2 mins per sentence with practice.

  **Candid Assessment & Rule Adjustments:**
  *   **Your House Rule:** It won't survive. Banning all terms without specification is impractical for 2500 words/week. **Replace it with:** "The terms 'liberal,' 'libertarian,' 'classical liberal,' 'neoliberal,' and 'progressive' *must* be run through the Label Check procedure in the pre-pub meeting. The terms 'left,' 'right,' 'center,' and party names (like Venstre) implying political direction *must also* be run through the procedure using Step 2 (non-US) or Step 3 (historical) as applicable." This focuses effort where confusion is most likely.
  *   **Contested Labels ("neoliberal") in News:** The procedure (Step 4) already handles this. In a *news* story, if "neoliberal" is used pejoratively (or as praise), Step 4 forces a rewrite into neutral description. **It should only stand in a news story if:** It is a direct, necessary, and accurately contextualized quote *from a source*, immediately explained ("...described his policies as 'neoliberal,' a term often used critically for market-focused reforms"). Never as the paper's own label in news. In **opinion** columns, writers can use it with argumentation, but Step 4 still flags it for the adviser/you to judge if the argument justifies the connotation.

  **What the Procedure CANNOT Settle (Requires Editor/Adviser Judgment):**
  1.  **Accuracy vs. Reader Inference:** When a technically accurate description might *reasonably* lead a significant portion of readers to infer something factually incorrect (e.g., describing a European "liberal" party accurately as "pro-free-market" might lead US readers to call them "conservative," which could also be misleading).
  2.  **Disputed Labels within a Country:** When credible sources within the subject's own country/system vehemently disagree on the appropriate label (e.g., Argentina's president - see below).
  3.  **Identifying Obscure Discourse Communities:** If the label's meaning hinges on understanding a niche academic, regional, or online subculture the writer/editor is unfamiliar with. The procedure defaults to "strike and describe" (Steps 2/3/4), but recognizing the *need* for this might require judgment.
  4.  **High-Stakes Connotation in Opinion:** Whether an opinion writer's use of a charged term like "neoliberal" is sufficiently supported by their argument (procedure flags it via Step 4, but judgment call on publication).

  **Worked Examples (This Week's Issue):**

  1.  **Brief on Danish coalition talks mentioning Venstre:**
      *   Sentence: "...negotiations between the Social Democrats and Venstre..."
      *   Procedure: Step 1 (No, not US) -> Step 2 (Yes, non-US) -> **Output:** `Strike "Venstre". Replace with: "...negotiations between the Social Democrats and Venstre, a center-right party..."` (Sufficient answer: Knowing Venstre is a major Danish party suffices; "center-right" is the necessary context against the "Left" name).

  2.  **Short item on Norwegian education policy mentioning that country's Venstre:**
      *   Sentence: "Venstre proposed increasing funding for charter schools."
      *   Procedure: Step 1 (No) -> Step 2 (Yes) -> **Output:** `Strike "Venstre". Replace with: "The Liberal Party (Venstre), a center-right group, proposed increasing funding for charter schools."` (Sufficient: Knowing it's Norwegian. Adding "Liberal Party (Venstre)" provides the name *and* clarifies positioning).

  3.  **Translated French article that calls a candidate "libéral":**
      *   Sentence: "The candidate, a known libéral, opposes the new wealth tax."
      *   Procedure: Step 1 (No) -> Step 2 (Yes) -> **Output:** `Strike "libéral". Replace with: "The candidate, who supports free-market policies, opposes the new wealth tax."` (Sufficient: Knowing it's French context. "libéral" -> "supports free-market policies" captures core European meaning).

  4.  **Profile of Argentina's president...:**
      *   *Sentence A:* "President Javier Milei calls himself a liberal and a libertarian."
          *   Procedure: Step 1 (No, Argentina) -> Step 2 (Yes) -> **Output:** `Strike "liberal" and "libertarian". Replace with: "President Javier Milei calls himself a proponent of radical free-market economics and minimal government intervention."` (Sufficient: Non-US context triggers rewrite. Description captures his stated ideology without using contested labels).
      *   *Sentence B:* "...while much of the foreign press calls him a right-wing populist."
          *   **EDITORIAL JUDGMENT NEEDED (Accuracy vs. Reader Inference / Disputed Label):** "Right-wing populist" is widely used internationally but is contested and carries strong connotations. The procedure *would* trigger Step 4 (Pejorative? Likely Yes) -> Output: Strike and describe. However, it's also a direct report of what "much of the foreign press" says. **Recommended Output:** `Keep as: "...while much of the foreign press calls him a right-wing populist."` *Rationale:* It's accurately attributed reporting of a common external label, fulfilling a news role. Adding a brief qualifier ("a label he rejects") could be considered but isn't strictly necessary under the procedure.

  5.  **Trade story quoting a backbencher from Australia's Liberal Party:**
      *   Sentence: "Liberal Party backbencher Jane Smith warned against the tariffs."
      *   Procedure: Step 1 (No) -> Step 2 (Yes) -> **Output:** `Label may stand.` **Wait - Why?** *Exception for Established Party Names:* Step 2 says "Strike the label". However, "Liberal Party" is the official name of a major Australian party (a stable fact). The procedure needs a slight tweak: **Between Step 2 and Output:** *"Is the label the official, formal name of a major political party in that country?"* **Yes** -> Output: `Label may stand.` **No** -> Proceed with Step 2 Output. (Sufficient: Knowing it's the party's actual name). **Final Output for this sentence:** `Label may stand.` (Context makes clear it's the party, not a generic description).

  6.  **Piece on 19th-century British Liberal Party:**
      *   Sentence: "The Liberal Party under Gladstone passed major reforms."
      *   Procedure: Step 1 (No) -> Step 2 (No) -> Step 3 (Yes, Historical) -> **Output:** `Strike "Liberal Party". Replace with: "The 19th-century British Liberal Party under Gladstone passed major reforms."` (Sufficient: Recognizing 19th-century context. Adding "19th-century British" prevents confusion with modern parties).

  This procedure provides a fast, defensible, and actionable method to drastically reduce label misuse. It accepts that blanket bans are impractical but enforces context-specific precision where confusion is most likely and unavoidable. It empowers your writers to fix the most common errors themselves in seconds and clearly flags the rarer cases needing your or the adviser's oversight.
