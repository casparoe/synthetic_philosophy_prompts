  Hmm... the user's hunch about standards of success being the real fault line feels significant. Let me test that against what both sides actually claim. For Dennett, the underdetermination IS the finding - consciousness isn't what we think it is. For critics, that same underdetermination means MDM fails as an explanation. 

  I should also consider other dimensions:
  - Is this about temporal facts in experience? (Dennett says no such facts exist beyond reportability)
  - Verbal differences? ("Consciousness" means different things to each camp)
  - Different questions? (Mechanisms vs phenomenology)

  The user's grad students are probably wrestling with why this feels unresolved after 30 years. I suspect it's because both sides have unacknowledged starting assumptions. Progress might require either 1) new empirical evidence about timing (like Libet-style experiments but for content), 2) redefining success criteria, or 3) accepting this is fundamentally a philosophical impasse. 

