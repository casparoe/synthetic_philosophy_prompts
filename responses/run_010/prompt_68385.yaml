  Okay, the user is a third-year philosophy PhD student specializing in metaphysics but sitting in on a set theory reading group. They've noticed a pattern in discussions where the truth-value of certain independent statements like CH is treated as relative to the model, while other statements like projective determinacy (PD) are discussed as having a definite truth value in "the" universe. The user wants to know if there's a name for this inconsistent switching between deflationary and non-deflationary attitudes based on whether there's an agreed-upon structural story around the statement.

  First, I recall that the user isn't looking for general realism/anti-realism debates or the multiverse view. They need a specific term for this selective relativism. The key is that the switch depends on the presence of a satisfying structural story, not the logical status. 

  Looking at existing concepts: 
  - **Theological Commitments** from Koellner might fit, as it involves preferring axioms that lead to rich structures. 
  - **Intrinsic Justifications** vs. **Extrinsic Justifications** could explain why PD is accepted based on consequences. 
  - **Theory Choice Heuristics** in foundations, like fruitfulness or explanatory power, might be at play. 
  - **Selective Realism** in philosophy of math, where realism applies only to areas with cohesive theories. 

  None of these capture the on-off switching within a single conversation. The closest is "Selective Relativism," but even that might not be precise enough. The user needs to distinguish this from near-misses like the multiverse view, which is a global stance, whereas their observation is local and contextual. 

  For coining a term, "Structural Confidence" or "Contextual Deflation" could work. "Structural Confidence" emphasizes that the switch happens when there's confidence in the structural story. Examples include PD with its canonical consequences versus CH, which lacks such a story. Boundary cases would be forcing axioms (like Martin's Maximum) which have consequences but aren't universally accepted, showing that it's about consensus on the story, not just existence. 

  The user needs to write why this isn't the same as other concepts, so highlighting the in-context switching and reliance on structural narratives rather than global philosophical positions is crucial. Making sure the coined term clearly separates from extrinsic justifications by focusing on the immediate conversational switch.
answer: |-
  Based on your description, you've identified a nuanced and specific phenomenon in foundational set theory discussions. **There isn't a single, universally accepted term for precisely this "double register" or "contextual switch" you're observing.** However, several established concepts get close, and the discrepancy itself points to an important, often implicit, criterion at work.

  Here's a breakdown of near-misses, why they don't *quite* fit, and a proposed coinage with clear boundaries:

  **Near-Misses & Why They Don't Fully Fit:**

  1.  **Extrinsic vs. Intrinsic Justification:**
      *   **What it is:** Distinguishes justifications for axioms based on consequences (extrinsic - e.g., PD settles many questions neatly) vs. based on self-evidence or intuitive appeal (intrinsic - hard to pin down for many large cardinal axioms).
      *   **Where it stops fitting:** This explains *why* PD is favored over its negation, but it doesn't capture the *switch in attitude towards truth itself* within the same conversation. The person using the extrinsic argument for PD likely still *treats PD as having a determinate truth value in "the" universe*, while using the independence of CH to *deflate its truth value*. The justification type explains the preference, not the contextual shift in the *metaphysical stance* on truth.

  2.  **The Multiverse View:**
      *   **What it is:** The view that there is no single absolute universe of sets; there are many equally valid set-theoretic universes (e.g., those satisfying CH, those not).
      *   **Where it stops fitting:** You explicitly note this is adjacent but not it. A committed multiverse advocate would *consistently* relativize *all* statements not settled by ZFC (like both CH *and* PD) to specific models or universes. They wouldn't suddenly talk about "*the* universe" and "*the* truth" of PD without qualification. The phenomenon you observe involves a speaker *abandoning* the multiverse perspective for PD while invoking it for CH *within the same context*.

  3.  **Theory Choice Heuristics / "Programs" (e.g., Gödel's Program, Descriptive Set Theory Program):**
      *   **What it is:** Frameworks guiding the search for new axioms based on goals like maximizing descriptive completeness, settling natural questions, or maximizing interpretative power.
      *   **Where it stops fitting:** These explain *why* certain axioms (like those implying PD) are actively pursued and favored. However, they are frameworks for *research direction*, not necessarily an explanation for the *metaphysical deflation switch* during discussion. A researcher can be guided by a program to pursue PD while still being a staunch multiverse realist, or conversely, a universe realist who dislikes the consequences of PD. The switch you observe seems more fundamental and directly truth-related than just research strategy.

  4.  **"Theological" Commitments (Koellner):**
      *   **What it is:** Peter Koellner has used the term "theology" informally to describe the underlying, often unstated, preferences and intuitions (e.g., for "maximality") that drive axiom acceptance beyond strict formal justification.
      *   **Where it stops fitting:** This captures the *source* of the preference (the desire for a "clean picture" of the projective sets) but, like extrinsic justification, it doesn't explain the *shift in the speaker's stance on truth and determinacy* depending on which statement is being discussed. It's about the *motivation*, not the *conversational mode switching*.

  **The Core Criterion & A Proposed Coinage:**

  You've nailed the key driver: **"whether there's an agreed structural story around the statement, not anything about its logical status."** The switch flips *on* the deflationary/relativizing mode when the statement lacks a settled, rich, and mathematically satisfying narrative within the community's current understanding. It flips *off* (reverting to talk of "*the* universe" and determinate truth) when such a narrative *is* present and accepted.

  **Proposed Term: Structural Confidence**

  *   **Definition:** The implicit or explicit attitude within a foundational discussion where statements independent of the base theory (like ZFC) are treated as possessing a determinate truth value in "the" universe *if and only if* they are embedded within a widely accepted, coherent, and productive structural narrative. Absent such a narrative, statements are treated as indeterminate or model-relative, despite sharing the same formal metamathematical status (independence).
  *   **Clear Cases Falling Under It:**
      *   **PD:** Possesses strong **Structural Confidence**. It resolves the properties of projective sets in a detailed, canonical, and interconnected way (regularity properties, prewellordering, scale properties) that mathematicians find deeply satisfying and explanatory. This confidence overrides its independence, leading to talk of its *truth* in "*the* universe".
      *   **CH:** Lacks **Structural Confidence**. While forcing provides models where it holds or fails, no single model (or family) has established a dominant, uniquely compelling structural picture of the continuum *because of CH or its negation*. The independence is seen as revealing genuine indeterminacy. The structural story is fragmented.
      *   **Large Cardinal Axioms (e.g., Measurable Cardinals):** Often possess **Structural Confidence**. Their justification frequently involves their *necessity* for proving desirable structural results (like determinacy for more complex sets) or their perceived intrinsic plausibility as "maximality" principles about the universe's height. This leads to talk of them being "true".
  *   **Boundary Cases (Look Like It But Aren't):**
      *   **Con(ZFC):** Independent of ZFC (if ZFC is consistent), but universally treated as true. However, this isn't primarily driven by a *structural narrative* about sets, but by a fundamental *metamathematical commitment* to the consistency of the foundational system itself. The confidence is meta-theoretic, not structural-set-theoretic.
      *   **V=L (Axiom of Constructibility):** Has a *very clear structural story* - every set is constructible, leading to a highly detailed, canonical inner model L. However, it *lacks widespread Structural Confidence** in the absolute sense because this detailed structure is seen by many as *too restrictive* (e.g., it falsifies large cardinals, limits the variety of sets) and fails to maximize the universe in ways deemed desirable. The narrative exists, but it's not the *preferred* or *accepted* narrative for the absolute universe. It *does* often get talked about as *true in L*.
      *   **Martin's Maximum (MM) or other Forcing Axioms:** These have significant structural consequences (e.g., settling many questions about the continuum, implying the singular cardinals hypothesis). They possess *some* **Structural Confidence**, leading proponents to argue for their truth. However, this confidence isn't as *universally agreed upon* as that for PD or large cardinals. Critics might point to their artificiality or conflict with other maximality principles. This shows **Structural Confidence** exists on a spectrum and depends on community consensus about the satisfactoriness of the narrative. It's not merely the existence of consequences, but the *nature* and *acceptance* of the narrative built upon them.

  **Why "Structural Confidence" Captures Your Observation:**

  1.  **Focuses on the Switch:** It directly names the *attitude* ("confidence") that gets switched on or off contextually.
  2.  **Highlights the Criterion:** It explicitly centers the "structural" aspect – the presence or absence of a coherent, productive narrative – as the key factor enabling that confidence.
  3.  **Distinguishes from Logical Status:** It emphasizes that this confidence operates independently of the formal metamathematical property (independence), explaining why CH and PD are treated differently despite sharing that property.
  4.  **Distinguishes from Broader Views:** It's a *local*, *contextual*, and often *implicit* conversational practice, not a global philosophical stance like realism or the multiverse view. Someone can employ Structural Confidence pragmatically without being a full-blown universe realist.
  5.  **Allows for Nuance:** It accommodates degrees of confidence and cases where consensus is lacking (like MM).

  **How to Use This in Your Draft:**

  *   "This phenomenon, which I term **Structural Confidence**, involves..."
  *   "Unlike a commitment to the multiverse view *simpliciter*, **Structural Confidence** is a contextual attitude that..."
  *   "While extrinsic justification explains *why* PD is preferred, **Structural Confidence** explains the shift in *how its truth is discussed* compared to CH..."
  *   "**Structural Confidence** differs from mere acceptance based on consequences; it requires a widely accepted, coherent structural narrative that imbues the statement with an air of determinacy within the absolute universe..."
  *   "Boundary cases like `V=L` illustrate that **Structural Confidence** requires not just *any* structural story, but one that aligns with the community's evolving conception of set-theoretic 'naturalness' or 'maximality'."

  This carves out the specific phenomenon you observed, provides a clear label, distinguishes it from adjacent concepts, and offers tools for analysis using the examples you encountered. Good luck with the chapter!
