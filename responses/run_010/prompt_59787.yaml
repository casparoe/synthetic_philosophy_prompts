answer: |-
  Based on your parameters, here is a specification for evaluating theories of mathematical knowledge against Benacerraf's dilemma, structured as requested. The rationale for each requirement is grounded in philosophical necessity or empirical observation, with distinctions between negotiable preferences and non-negotiable constraints.

  ### I. Core Explananda (Non-Negotiable)
  1. **Reliability**:  
     *Why do mathematical beliefs reliably correspond to mathematical truths?*  
     **Motivation**: Benacerraf's challenge that causal isolation of abstract objects undermines justification (e.g., "Mathematical Truth," 1973). A theory must explain why mathematical beliefs are non-accidentally true.  

  2. **Authority**:  
     *Why does mathematics function as an inviolable constraint on empirical science, rather than a revisable hypothesis?*  
     **Motivation**: Your laboratory observation that math governs experimental possibility (e.g., rejecting discordant data as error). This normative force exceeds mere reliability and demands explanation.  

  **Can one theory satisfy both?**  
  Yes. The authority of mathematics implies its reliability, but reliability alone (e.g., via useful fictions) does not entail authority. A successful theory must explain both jointly.  

  ---

  ### II. Assessed Requirements  
  | Requirement | Keep/Discard | Grounds | Negotiability |  
  |-------------|--------------|---------|--------------|  
  | **1. Mathematical knowledge as a species of empirical knowledge** | Discard | While naturalism motivates this, it conflates *grounds* (e.g., neural mechanisms) with *justification*. Math may share cognitive origins but require distinct epistemic norms (e.g., proof vs. induction). | Negotiable preference (naturalist camp). |  
  | **2. Disagreements settled by proof, not measurement** | Keep | Empirical: Mathematicians resolve disputes deductively; scientists treat math as immutable framework. Reflects *authority*. | Non-negotiable (follows from explanandum 2). |  
  | **3. Coverage of unverified/unknowable mathematics** | Keep | Idle regions (e.g., large cardinals) are deemed true/false independently of human access. A theory denying this risks instrumentalism, undermining *reliability* for core math. | Non-negotiable (truth-completeness). |  
  | **4. Anti-coincidence constraint** | Keep | Explanations like "evolution shaped us to intuit platonic truths" invoke brute luck. Challenges *reliability* without a causal or constitutive link. | Non-negotiable (avoids ad hoc solutions). |  
  | **5. Generalizability to logic/ethics** | Discard | Economy is desirable but not obligatory. Logic may share math's necessity; ethics likely does not (e.g., no empirical science treats moral claims as constraints). | Negotiable preference (systematicity camp). |  
  | **6. Compatibility with historical/sociological practice** | Keep | Cases like Ramanujan's intuitive conjectures or accidental discoveries (e.g., Cantor’s set theory) show knowledge arises via fallible processes. Denying this is empirically inadequate. | Non-negotiable (descriptive accuracy). |  

  ---

  ### III. Epistemological Neutrality  
  - **Problem**: A specification using thick epistemic terms (e.g., "tracking truth") may bias against non-realist theories.  
  - **Resolution**: **Neutrality is impossible but necessary**. Frame requirements minimally:  
    - *Reliability*: Beliefs must be non-accidentally true (using a deflationary "truth" to avoid metaphysics).  
    - *Authority*: Mathematical truths are non-negotiable in empirical reasoning.  
  - **Grounds**: Thinner constraints prevent evasion (e.g., fictionalists cannot explain authority), while thick theories risk circularity. The dilemma persists even for minimal "justified true belief."  

  ---

  ### IV. Highest-Impact Requirement  
  **Requirement 4 (Anti-Coincidence)** eliminates the most candidates:  
  - **Why**: Platonism without robust epistemology (e.g., evolutionary "guessing") fails it. Fictionalism/constructivism struggles to explain reliability without coincidence. Only theories with a necessary mind-truth connection (e.g., rationalism, structuralism with mind-world identity) may satisfy it.  

  ---

  ### V. How Major Theories Fail the Specification  
  1. **Platonism + Evolutionary Epistemology** (e.g., Gödel):  
     Fails **Requirement 4** (Anti-Coincidence). No explanation for why evolution aligns with abstract truths; posits a cosmic accident.  

  2. **Fictionalism** (e.g., Field):  
     Fails **Authority**. If math is a useful fiction, it cannot explain why recalcitrant data *must* be experimental error (explanandum 2).  

  3. **Structuralism** (e.g., Shapiro):  
     Fails **Requirement 3** (Coverage) if structures are mind-dependent. Idle regions lack determinate truth without a realist foundation.  

  4. **Neo-Fregeanism** (e.g., Hale/Wright):  
     Fails **Requirement 4** (Anti-Coincidence) if abstracta arise from linguistic rules. No reason why stipulation reliably accesses truths about uncountable infinities.  

  ---

  ### Summary  
  - **Non-Negotiable Requirements**: Reliability, Authority, Proof-Settled Disagreements (2), Coverage of Idle Regions (3), Anti-Coincidence (4), Historical Compatibility (6).  
  - **Key Tension**: Authority (explanandum 2) is the most overlooked but decisive filter. It forces theories to explain mathematics' unique normative role, which deflationary approaches cannot.  
  - **Feasibility**: A theory satisfying all exists *in principle* (e.g., rationalist structuralism identifying mind/immanent structures), but no current candidate fully succeeds.  

  This specification provides a neutral, high-resolution framework for your assessment—prioritizing empirical constraints over ideological commitments.
