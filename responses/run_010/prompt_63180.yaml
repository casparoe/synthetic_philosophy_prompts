answer: |-
  ## Shutting Down HALO (Remarks for Switch-Off Ceremony)

  **(Lights dim slightly, focus on the console. You approach.)**

  Good morning. In a few moments, we will formally switch off HALO. We built it nine years ago to bring speed and consistency to a process fraught with complexity and human need. It took inputs, applied rules, and gave us a number. It ranked applicants for our housing list. For nine years, it ran. Today, it stops.

  **(Turn slightly towards the data team section)**

  I want to speak directly to the team who conceived, built, and maintained HALO. [Name Lead Engineer/Architect], [Name Lead Data Scientist], and everyone involved – past and present, including the four I was proud to recruit. Your skill was real. The problem you tackled – managing overwhelming demand with limited resources – was immense. You built something intricate, technically sophisticated, and it did *exactly* what we asked it to do. You delivered a tool that processed applications faster than any manual system ever could. For that dedication, for that technical achievement, you have my genuine respect and thanks. It was never a question of your ability or intent.

  **(Pivot back to centre)**

  And what we asked it to do… we asked it to use data to predict success. One piece of that was 'residential continuity'. We fed it address histories, council tax records. The logic seemed sound, confirmed by the inquiry itself: stability in the past *did* correlate with a higher chance of sustaining a tenancy. At the model review in 2016, I argued forcefully for keeping it. I said the measure was a valid predictor. I said any unfairness it might generate could be managed by our officers at the point of decision. Both statements, technically, were true.

  **(Pause. Measured tone.)**

  But here is what HALO *did*. It took that measure of past stability, and it used it to rank people lower. People who had fled violence in the night, leaving everything behind. Young people leaving the care system, stepping into uncertainty. People who had known no fixed address, sleeping rough. HALO saw their histories – histories of survival, of disruption forced upon them – and it assigned them a lower number. A lower chance.

  And then, it showed that number to our housing officers. Just the number. No context. No unfolding story. Just a ranking. An override was possible – a human could intervene. But it required a written justification, sent to a manager. That hurdle, that extra step, that moment of doubt… it meant overrides happened just two percent of the time. The number became the truth. The system became the decision.

  **(Turn deliberately towards where the family is seated)**

  Three people are dead. Their absence is here in this room today. We see you, [Family Name/Surname, if known and appropriate, otherwise use a respectful pause looking towards them]. We hold that loss.

  **(Turn to the wider room)**

  So today, we switch HALO off. And we move to a different way. The new system removes the 'residential continuity' measure entirely. It doesn't predict tenancy success on that basis. Instead, when officers make a decision, they will see reasons. Clear, published criteria. And if an officer believes the ranking doesn't reflect the urgent need before them, they can override it. No written justification required to a manager. Their professional judgment, looking at the whole person and their situation, is enough.

  This will be harder. It will be slower. Decisions won't come with the speed of an algorithm. Our officers will have more complex judgments to make, carrying more weight. We will have more difficult conversations, sometimes right there in the room with applicants. There will be disagreements we have to navigate openly. It will demand more time, more staff resource, more emotional energy from everyone involved. This is the cost of putting human judgment – complex, fallible, essential human judgment – back at the centre, where it belongs.

  **(Walk towards the console, hand resting near the switch/button)**

  We built HALO to solve a problem. It solved that problem in the way we built it to solve. The consequences were built into that design, as surely as the code. We see that now. Turning it off isn't about blaming a machine, or blaming the people who made it work. It’s about acknowledging what we built, and choosing to build something different now.

  **(Look up at the room, hand on switch/button)**

  It’s time. Lights on, please.

  **(Flick the switch/press the button. The main chamber lights come up fully.)**

  Alright everyone. HALO is offline. Let’s get back to work.
