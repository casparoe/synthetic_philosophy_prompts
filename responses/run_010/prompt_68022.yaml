prompt: |-
  So our city's public health commission is finally doing the thing it's been threatening to do for three years: a closed two-day session on whether to go Maine-style — decriminalize the selling, keep the buyer ban, pour money into exit services — or go the New Zealand route and take the criminal law out of the whole transaction. I've been asked to chair between two people who will not share a platform. One is a feminist lawyer who's done twenty years of trafficking casework, thinks the Nordic model is the only framework that names who the harm runs toward, and won't say the phrase 'sex work' out loud. The other organizes a worker-led collective, thinks the buyer ban is a police power grab dressed up as feminism, and points out that Maine, France, Ireland and the rest have produced evaluation after evaluation showing the same thing: the criminal law lands on the people it claims to protect. They have never actualy been in the same room. But each of them told me separately that they'd sign an honest document, and I want to walk in with one.

  Draft it. Not a dialogue, not a verdict on who's right, not an essay about why the debate is stuck — the statement itself, the thing both of them could put their names to.

  For the agreed claims, I want ones that cost something. Not 'both sides want to reduce harm and oppose trafficking.' Claims about how these regimes actually operate: what enforcement looks like on the street under a buyer ban, what happened to prices and to screening and to indoor versus outdoor work after decriminalization, what the licensing systems in Germany and the Netherlands did and didn't fix, what New Zealand's law left out — including the fact that it never covered migrant workers on temporary visas — and what Belgium and the Australian states have done more recently. Both of them have to be able to read each of those aloud without wincing.

  Then the residual disagreements, each stated so its own camp would accept the wording of its own side, not a neutralized mush that flatters neither.

  Then the cruxes: the sub-questions where an answer would actually move somebody. Tell me if you think the deepest one is the baseline problem I keep hitting — that the two of them score identical evidence against different counterfactuals, one against the regime we have now and one against a world without the poverty and the immigration precarity that pushes people in — and if so, write it down in terms both would accept. For each crux, give me a concrete case or test both would agree bears on it, with each side's prediction recorded in advance, including what result would change their mind and what result they'd explain away.

  Also: say which parts of this are fights over words. 'Work,' 'consent,' 'exploitation,' 'survivor' — and how the document handles vocabulary when one signer won't accept a sentence the other insists on.

  Format, please: continuous prose, the way you'd write a letter. No headings, no bullets, no bold, no tables. I still want it navigable, so use paragraph discipline instead: every disagreement paragraph opens with the sentence both camps can sign, then the two formulations attributed by camp, then the crux and the two predictions. End with a short closing paragraph both could read aloud at the start of the session. And don't give me a bibliography or name any studies — I know the literature, I need the reasoning.
reasoning: |-
  Okay, this is a complex and sensitive request. The user needs a consensus document between two diametrically opposed experts on sex work legislation - one advocating for the Nordic model (buyer ban) and the other for full decriminalization (New Zealand model). 

  First, I need to understand the core tension: both sides claim to reduce harm but have fundamentally different approaches. The feminist lawyer sees criminalizing buyers as protecting vulnerable people from exploitation, while the collective organizer sees full decriminalization as the only way to protect workers' rights. 

  The user wants a document that acknowledges hard truths about both models - not vague platitudes. For example, I should include how buyer bans increase street-level policing that targets workers despite claims of "protection," and how decriminalization improves safety but doesn't eliminate exploitation under capitalism. Key data points to reference: Germany's licensing failures, New Zealand's visa loophole, Belgium's recent reforms.

  The tricky part is stating disagreements without watering them down. For instance, on "consent": the Nordic side might say "consent is impossible under structural coercion," while the decrim side would counter "consent exists on a spectrum and criminalization removes agency." Both views need equal weight.

  The baseline problem is crucial - they're comparing different counterfactuals. The lawyer evaluates policies against current patriarchal systems, the organizer against a hypothetical just society. To bridge this, I'll propose a concrete test case: tracking migrant workers' safety outcomes under both models, with specific metrics like police reports vs. workplace grievances.

  Vocabulary wars are landmines. The document must use "sex work" and "trafficking survivor" interchangeably where possible, or explicitly note when terms reflect specific viewpoints. Maybe add a footnote style compromise: "The signatories use different terminology reflecting their analysis of power dynamics."

  For structure, I'll use: 
  - Shared acknowledgements (hard truths) 
  - Disagreements (framed as "We diverge on whether...") 
  - Crux questions with testable predictions 
  - A closing both can read aloud emphasizing shared goals

  The tone must remain clinical but compassionate - no academic jargon. Every claim should pass the "wince test" for both signatories. Most importantly, the document should end where they agree: that current systems fail vulnerable people.
answer: |-
  Here is the draft statement, structured as requested:

  We begin from shared ground: that the status quo fails those most vulnerable to exploitation, and that evidence from implemented models reveals uncomfortable truths. Under buyer-ban regimes, law enforcement primarily targets street-based sectors, increasing displacement and police contact for those least able to avoid it, despite stated intentions to shield sellers. Workers report heightened pressure to avoid reporting violence, fearing entanglement in their own legal cases. Conversely, full decriminalization, as in New Zealand, demonstrably increased workers' ability to screen clients, negotiate terms, report violence to police without fear of arrest, and access standard employment rights. However, it did not eliminate exploitation, particularly where intersecting vulnerabilities exist, and its explicit exclusion of migrant workers on temporary visas created a significant unprotected class. Licensing systems, such as those in Germany and the Netherlands, generated unintended consequences: a two-tiered market where many remain unlicensed due to cost, bureaucracy, or privacy concerns, pushing significant segments underground and failing to curb exploitative third-party control. Recent shifts in Belgium and parts of Australia towards decriminalization, while still unfolding, explicitly aim to include migrant workers' rights and address third-party exploitation through labor regulation, acknowledging the limitations of the New Zealand framework.

  Where we diverge is the fundamental mechanism for achieving safety and reducing exploitation. One perspective holds that criminalizing the purchase of sex is necessary to name and target the inherent exploitation in the transaction, reducing aggregate demand and signaling that human beings are not commodities; it views the documented harms under buyer bans as stemming from inadequate investment in exit services and social support, not the legal framework itself. The opposing perspective holds that removing criminal law entirely from consensual transactions is the only proven method to empower individuals to assert their rights and safety within the work, viewing the harms documented under buyer bans as inherent to criminalization and police involvement; it argues that exploitation is best countered through labor rights, robust social services addressing poverty and housing, and specific protections against coercion, not by criminalizing clients. The crux here is whether criminalization of any party in the transaction is an effective tool for reducing violence and exploitation, or inherently creates the conditions that increase vulnerability and impede reporting. A concrete test would be tracking reported violence rates and worker control over safety practices (screening, condom use, ability to refuse clients) in comparable cities shifting to different models, controlling for baseline social service investment. One side predicts buyer bans, with adequate exit funding, will show decreasing violence and increasing exits over 5 years; a sustained increase in reported violence or decreased safety control would challenge this view. The other predicts decriminalization will show increased violence reporting alongside improved safety control metrics; stagnant or worsening safety control despite decriminalization would challenge this view. Neither would accept worsening overall violence under their model as solely attributable to external factors like economic downturn without concurrent evidence of deteriorating safety control mechanisms.

  Further disagreement lies in the analysis of structural power and consent. One view maintains that consent within commercial sex is fundamentally undermined by systemic inequalities of gender, race, class, and migration status, making the concept of 'work' in this context inseparable from exploitation; it sees decriminalization as legitimizing this exploitation. The other view maintains that consent exists on a spectrum within work shaped by the same structural inequalities, and that removing criminalization is prerequisite to mitigating exploitation by granting agency and rights; it sees buyer bans as denying self-determination. The crux is whether the law can meaningfully distinguish between consensual adult transactions and exploitation without criminalizing the framework enabling consensual work. A testable element is the prevalence of exploitative third-party control (e.g., debt bondage, confiscation of earnings) under decriminalization with strong labor oversight versus under buyer bans. One side predicts decriminalization will entrench third-party control due to market normalization; a significant measurable decrease would challenge this. The other side predicts buyer bans drive workers further into the control of exploitative third parties due to isolation and fear; a significant measurable increase under decriminalization would challenge this.

  Vocabulary reflects these differing analyses. This document uses "sex work" and "worker" where referring to activities and individuals under decriminalized models and the perspective advocating for them, and "prostitution," "seller," or "person in prostitution" where reflecting the perspective focused on inherent exploitation. "Exploitation," "trafficking," and "consent" carry interpretations central to each perspective's framework. We use "survivor" to encompass individuals harmed within any system. Where phrasing directly stems from one analysis, it is attributed within the disagreement sections above.

  We hold these differences while agreeing that the evidence compels change beyond the current failed approach. Our shared commitment is to reduce violence and coercion, and to center the safety and dignity of those most impacted by the policies we debate. We offer this document to ground the coming discussions in the difficult realities and unresolved questions that demand our honest engagement.
