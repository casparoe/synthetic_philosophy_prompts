prompt: |-
  I have just been made responsible for the anti-corruption annex of a maternal-health procurement programme that a European funder runs through district health offices here, and two analogies are being used against each other in our working group. I need to know which one can bear weight before I draft the clause.

  Our district medical officer argues that refusing a gift is an insult and that the whole question is being misdescribed. A basket of produce, an envelope at a wedding, a cousin hired as a night guard — these, he says, are like bringing wine to a dinner: a gesture that marks a relationship, not a transaction that prices one. On that picture the funder's rulebook is imposing a market model where no market exists, and the charge of cultural imperialism is supposed to follow: what counts as corrupt is set by whose norms get treated as the default. The funder's head of integrity answers with a different image. Every gift is a down payment. Money is fungible, obligation accrues silently, and when the ambulance tender comes up the relationship amortises itself. On her picture the wine analogy is a euphemism, and the annex should treat any transfer above a nominal threshold as a prohibited payment regardless of stated intent.

  Please audit both analogies rather than splitting the difference. Set out the correspondences explicitly — what plays the wine, the host, the occasion, the obligation to reciprocate; what plays the down payment, the loan, the interest, the collateral — and then say where each mapping breaks. I want the disanalogies sorted into those that actually matter for writing a rule and those that are merely rhetorical, with attention to the temporal structure of the exchange, whether the official has genuine discretion over what is being asked for, whether the gift buys something the giver was already entitled to, who ultimately bears the cost, and whether the parties would want the exchange publicised. Say plainly which features of each source domain the analogy quietly imports that the target lacks, and whether either can carry the conclusion it is being used for: that the practice is benign, or that it must be prohibited by threshold alone.

  Then commit. Tell me which analogy you think survives contact with these details, what your reasons are, and — if neither does — what third analogy describes such transfers better than wine or down payment. I would rather have a definite recommendation about how to draft the clause, with the argument for it, than a balanced menu of considerations left for me to weigh.
reasoning: |-
  Okay, the user is dealing with a complex ethical dilemma in drafting an anti-corruption clause for a maternal-health procurement program. They've presented two opposing analogies: the district medical officer's "wine at dinner" analogy and the funder's head of integrity's "down payment" analogy. The user wants a rigorous audit of both analogies, not a compromise, and a clear recommendation for drafting the clause.

  First, I need to unpack both analogies fully. The "wine" analogy frames gifts as relational gestures, while the "down payment" treats them as transactional. The user specifically asks to map correspondences and identify where each analogy breaks down. They also want disanalogies sorted into those that matter for rule-writing versus rhetorical points, focusing on key factors like temporal structure, discretion, entitlement, cost-bearing, and publicity.

  Hmm, the temporal aspect is crucial - the wine analogy assumes immediate reciprocation (hosting), while corruption involves delayed obligations. The discretion point is vital too: district officials control procurement decisions, unlike dinner hosts who decide invitations freely. The entitlement question reveals another crack - wine givers get no special treatment, but contractors might expect favors. Cost-bearing differs significantly; taxpayers fund the "gift's" cost in procurement contexts. Publicity preferences also diverge - people happily share dinner stories but hide "gratitude payments."

  The "down payment" analogy fits better structurally but overreaches by implying predetermined corruption. Its strength is recognizing silent obligation accrual, but weakness is presuming intent. Neither analogy perfectly maps, yet the down payment model better captures the systemic risks in public procurement, especially regarding delayed reciprocity and fungibility.

  For the clause, I recommend prohibiting gifts above a nominal threshold without exceptions, as relational defenses are too easily abused. But should add context-sensitive training and anonymous reporting to address cultural concerns. The third analogy? Maybe "fertilizer runoff" - individual acts seem harmless but collectively poison the system.

  The user needs courage to enforce this; they're likely facing pressure from local officials. My recommendation must be unambiguous because maternal health procurement corruption literally kills. The threshold rule is the only workable option, despite cultural friction.
answer: |-
  Here’s a rigorous audit of both analogies, followed by a definitive recommendation for drafting your clause:

  ### **1. The "Wine at Dinner" Analogy (District Medical Officer)**  
  *Correspondences:*  
  - **Wine** = Gift (basket, envelope, cousin’s job)  
  - **Host** = Recipient official  
  - **Occasion** = Social ritual (wedding, relationship-building)  
  - **Obligation to reciprocate** = Future hospitality (invitation to dinner)  

  *Critical Disanalogies (Rule-Relevant):*  
  - **Temporal Structure**:  
    - *Dinner*: Reciprocation is social, immediate/short-term, and diffuse (no specific demand).  
    - *Procurement*: Obligation is deferred, accrues silently, and aligns with tender timelines (e.g., ambulance contract). **→ Creates future conflicts of interest.**  
  - **Discretion**:  
    - *Dinner*: Host freely chooses guests.  
    - *Procurement*: Official has mandated duty to award contracts impartially. **→ No genuine discretion to favor gift-givers.**  
  - **Entitlement**:  
    - *Dinner*: Guest receives no material benefit beyond the event.  
    - *Procurement*: Contractor may seek preferential treatment (e.g., inflated prices, waived specs). **→ Gift buys access to public resources.**  
  - **Cost-Bearing**:  
    - *Dinner*: Cost is borne personally by host/guest.  
    - *Procurement*: Cost is borne by public funds/taxpayers. **→ Socialized loss, privatized gain.**  
  - **Publicity**:  
    - *Dinner*: Parties would welcome publicity (social credit).  
    - *Procurement*: Both parties hide exchange (indictment of impropriety).  

  *Rhetorical Disanalogies:*  
  - "Cultural gesture" ignores systemic power asymmetry: District officials control life-saving resources; vendors are not "guests."  
  - Illicit hiring ≠ hospitality: Public payrolls are merit-based systems, not personal networks.  

  *Smuggled Premises:*  
  Assumes informal reciprocity is harmless in formal systems. Ignores that procurement is a regulated market (public funds = market existence). Fails under scrutiny of discretion/cost-bearing.  

  **Conclusion for Analogy**: Cannot support "benign practice" claim. Breaks on **discretion, cost-bearing, and deferred obligation**.  

  ---

  ### **2. The "Down Payment" Analogy (Funder’s Head of Integrity)**  
  *Correspondences:*  
  - **Down Payment** = Gift  
  - **Loan** = Future favor (contract award, regulatory leniency)  
  - **Interest** = Implicit obligation (loyalty, priority access)  
  - **Collateral** = Relationship as security  

  *Critical Disanalogies (Rule-Relevant):*  
  - **Intent Certainty**:  
    - *Down Payment*: Explicit contract exists; default is intentional.  
    - *Gift*: Intent may be ambiguous (e.g., cultural ritual). **→ Overcapture risk: not all gifts are bribes.**  
  - **Fungibility**:  
    - *Down Payment*: Money is liquid, value clear.  
    - *Gift*: "Cousin’s job" has non-monetary value (nepotism ≠ cash). **→ Hard to quantify, but still corrupt.**  
  - **Reciprocation Enforcement**:  
    - *Down Payment*: Legal recourse if loan defaults.  
    - *Gift*: No enforcement mechanism; obligation is informal. **→ Enables plausible deniability.**  

  *Rhetorical Disanalogies:*  
  - Down payments are transparent; corrupt gifts are clandestine.  
  - Ignores cultural nuance: Some gifts *are* innocent (e.g., seasonal fruit).  

  *Smuggled Premises:*  
  Assumes all gifts are inherently transactional. Overlooks gradations of influence (e.g., small gift vs. job).  

  **Conclusion for Analogy**: Captures **deferred obligation, fungibility, and cost-bearing** accurately but overreaches on intent. Breaks on **universal malign intent**.  

  ---

  ### **3. Verdict: Which Analogy Survives?**  
  **The "Down Payment" analogy is superior for rule-drafting**, despite flaws. Here’s why:  
  1. **Temporal Danger**: Procurement cycles align perfectly with deferred obligation ("interest accrual").  
  2. **Systemic Harm**: Small gifts normalize corruption (the "slippery slope" is empirically validated).  
  3. **Fungibility Reality**: A job for a cousin *is* a currency (nepotism corrupts meritocracy).  
  4. **Asymmetric Cost**: Public bears cost (e.g., overpriced ambulances), violating fiduciary duty.  

  The "wine" analogy collapses under **discretion** (officials can’t "host" public resources) and **entitlement** (vendors aren’t owed contracts).  

  ---

  ### **4. Recommendation: Drafting the Clause**  
  **Adopt a bright-line prohibition with narrow cultural exemptions**, not thresholds.  

  - **Prohibit**:  
    - Cash/gifts > $10 USD equivalent.  
    - Any employment offers to officials’ families.  
    - Gifts from active bidders (pre/post-tender).  
  - **Exempt**:  
    - Trivial items (e.g., <$10 fruit basket) *if given publicly*.  
    - Ceremonial gifts to offices (not individuals) displayed openly.  

  **Why this works**:  
  - **Defends against "down payment" risk**: Closes deferred-obligation loopholes.  
  - **Avoids cultural imperialism**: Exempts socially visible, low-value gestures.  
  - **Enforceable**: Bright lines reduce ambiguity (e.g., "no family hires" > "no undue influence").  
  - **Psychological barrier**: Breaking a clear rule feels more culpable than crossing a threshold.  

  **Additional Safeguards**:  
  1. **Declare all gifts**: Require officials to log even exempted gifts.  
  2. **Third-party oversight**: Local NGOs audit logs alongside funder.  
  3. **Anonymous reporting**: Protect whistleblowers identifying "cousin hires."  

  ---

  ### **5. The Third Analogy: "Fertilizer Runoff"**  
  If neither analogy satisfies, consider this:  
  > *"Small gifts are like fertilizer runoff in a watershed. Individually harmless, but cumulative saturation poisons the entire system – distorting decisions, diverting resources from the needy, and eroding trust in public institutions."*  

  **Why it’s better**:  
  - Rejects "intent" debates: Focuses on systemic impact.  
  - Explains why zero-tolerance works: Prevents saturation.  
  - Justifies bright-line rules: You regulate runoff *before* the water is toxic.  

  ---

  **Final Directive**: Draft the clause with a **bright-line prohibition** (not thresholds) and limited cultural exemptions. Prioritize systemic integrity over individual intent. The "down payment" analogy’s core insight – that obligations accrue silently and exploit public resources – demands uncompromising rules in procurement contexts.
