  The air in their mother’s kitchen hung thick with the scent of stale coffee and grief. The cardboard box sat between them on the worn oak table, overflowing with papers. Nora pulled out a small, cloth-bound journal, its spine cracked. Elias watched her, his priest’s collar stark against his dark sweater in the dim light.

  **Nora:** (Opening the journal, voice flat) "January 14th. Asked again last night. Nothing. Just the dark. Like knocking on a door I know is empty, but I knock anyway. For Dad. For the children. Because I want to *feel* it, Elias. Just once." (She flips pages) "March 3rd. Read Psalm 22 aloud. ‘My God, my God, why have you forsaken me?’ Felt like a performance. The words meant nothing. Emptier than before." (Slaps the journal down) Nine years. Nine years of this. Sincerely asking. Begging. Wide open. And *nothing*. Not a whisper.

  **Elias:** Nora, I know it’s agonizing to read. It tears at me too. It’s raw. Honest. I don’t doubt her sincerity for a second. Not one second. She was seeking with everything she had.

  **Nora:** Then what? The standard apologist shuffle? ‘God’s reasons are beyond us’? Or ‘She’ll be compensated in heaven’? After *this*? That’s obscene.

  **Elias:** No! That’s not— Look, if God were… undeniable. If faith were forced upon you, like seeing the sun at noon. Could you call that love? Could your choice to love Him, or not, mean anything? It would be coercion, Nora. Obliviousness would be impossible. Love *requires* the possibility of genuine refusal, of walking away. Hiddenness… preserves that space for a free response.

  **Nora:** (Leaning forward, eyes sharp) So God hides to protect our precious freedom to *choose* Him? Fine. Apply that here. To *her*. A mother hears her child weeping in the night, crying out for her, night after night, year after year. What does the *good* mother do? Does she stay hidden? Whisper, ‘My staying away proves my love, darling! It protects your freedom to *want* me!’?

  **Elias:** It’s not the same! The dynamics are—

  **Nora:** **Why?** Why is it disanalogous? Tell me how *this* – (she jabs the journal) – this specific, prolonged, anguished seeking met with silence… how that isn’t sheer administrative cruelty dressed up as theological prudence? How isn’t it just God prioritizing the system over the suffering soul *inside* it?

  **Elias:** I’m not saying it’s administrative! It’s about the nature of the relationship! Divine-human… it’s—

  **Nora:** And the *distribution*, Elias! You talk about assurance you never sought. Felt it since you were twelve, you said. While *she*… (Gestures at the journal, voice cracking slightly) sought it daily for nine years and got static. If the evidence is tailored to inner states only God can see – ‘Oh, *this* one needs more hiddenness, *that* one needs a nudge’ – that’s functionally identical to there being no one tailoring *anything*. It’s indistinguishable from silence being random. Or absolute.

  **Elias:** But it’s *not* random! My experience… hers… they’re both part of—

  **Nora:** Prove it. Audit the inner states. Show me the criteria. You can’t. It’s a black box. ‘Trust the plan’ based on zero verifiable data. Your ‘assurance’ could just be temperament. Luck. Wishful thinking. While her despair was… earned. (She pushes back from the table, turning away)

  **Elias:** (Quietly) Nora… when was the last time you prayed? Since Mum’s diagnosis? Have you even tried to…?

  **Nora:** (Whirling back) Don’t! Don’t shift this. Don’t make this about *my* resistance, my supposed closed-mindedness. This journal *is* the prayer. Answered with nine years of nothing. My arguments are built on *this*, Elias. On the sheer, screaming absence where presence was begged for. This *is* the data point your free-will defense stumbles over. Crumbles on.

  **Elias:** (Staring at the journal, then at Nora. His voice is thick, weary) I don’t… I don’t have an answer for the distribution. Why her? Why not me? Why such… prolonged silence? I truly don’t know. It looks… it *feels*… arbitrary. Cruel, even. To her. To you reading it. To me, sitting here. (He runs a hand over his face) My theology… it feels thin tonight. Paper-thin against… against *that*. (He nods at the journal)

  **Nora:** (Stunned by the admission. The fight drains slightly from her posture. She looks exhausted) Yeah. Paper-thin.

  **Elias:** (Stands slowly, walks to the counter) Can I… get you a drink? Mum’s good whiskey is still here. I think we both…

  **Nora:** (A long pause. She looks from the journal to her brother’s slumped shoulders. A concession.) …Okay. Yes. Pour one.

  **Elias:** (Finds the bottle, two glasses. Pours amber liquid, his hands not entirely steady.) Here.

  **Nora:** (Takes the glass he offers. Doesn't drink immediately, just holds its weight and warmth. The ice clinks softly against the sides.) Thanks.
