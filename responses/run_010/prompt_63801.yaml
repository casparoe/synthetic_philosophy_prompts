prompt: |-
  Third year in epistemology, dissertation on understanding and cognitive offloading. Next week our reading group has to present a case to my supervisor and predict where she'll land, and I'm the one presenting, so I want to get this right.

  She's an odd interlocutor: she's completely fine with treating a person-plus-their-tools as one cognitive system in principle, so you get nowhere with her by pointing out that the thinking happened outside the skull. Her verdicts so far:

  1. Delivery driver, same route daily for three years, turn-by-turn the whole way. Drives it flawlessly. Can't sketch the neighbourhood or say what he'd do if the bridge were out. Verdict: he doesn't understand the layout of the area.
  2. Mathematician who runs every long derivation through a CAS and never checks by hand because there isn't time. Instantly knows when the output is garbage, can reconstruct any individual step if pushed, can tell you why the answer had to come out the way it did. Verdict: she understands the mathematics.
  3. Clinician using a diagnostic ranking tool. Better hit rate than her colleagues. Can't say why the top candidate is favoured, and admits that in the one case where the tool flagged something she had independent reason to think was dangerous for that patient, she'd have gone with the tool. Verdict: doesn't understand the diagnosis.
  4. Historian who writes with a tool that reads and synthesises the secondary literature for her. She hasn't personally read most of what it summarised and couldn't reproduce the synthesis unaided. But she's caught it inventing sources twice, and she can take apart each of the three rival readings of the events and say exactly where each one goes wrong. Verdict: she understands the debate.
  5. Not a case, but two asides she's made. Once: you can hold every true belief about a subject and still not understand it, and the question to ask about any tool is what happens when the tool gets it wrong. Another time she described understanding as knowing what depends on what. She doesnt seem to notice those pull in different directions, and I can't tell which one does the work for her.

  The case I have to present: a cohort member drafted a whole chapter with a model as his sparring partner — it threw objections at him, he answered, it revised, he revised, six weeks of that. In a mock viva he answered every why and what-if question correctly and in his own words, including which assumption is load-bearing and what breaks if you drop it, and what would decide between the two rival accounts. Two things though. Asked to build the argument cold with no tool in the room, he stalls completely. And a friend fed him a confident but bogus objection to one of his true claims as a test — instead of rejecting it he spent an hour weakening the true claim to accommodate it. He's never caught the model making a technical error and says he wouldn't know how to check one except by asking it again.

  So what does she say about him? I want an actual prediction with a number on it, not a menu of readings — if you think it's a genuine coin flip for her, say that plainly and tell me what tips it. Tell me which rule or rules are consistent with all four case verdicts (I assume several fit, and that the historian case knocks some out), which of the survivors the new case forces apart, and whether you expect a split verdict — understands this but not that — and if so exactly where the split falls and on what grounds. Then give me one further case I could float at the workshop that would settle which rule she's actually running.
reasoning: |-
  Okay, let me tackle this epistemology puzzle. The user's presenting a case study to their supervisor next week and needs to predict her verdict on whether a PhD student using an AI model as a "sparring partner" truly understands his dissertation topic. 

  First, I need to map the supervisor's existing verdicts to find patterns. Her four cases show clear distinctions: 

  The delivery driver (no understanding) lacks causal modeling - he can't adapt when the bridge is out. The mathematician (understands) can reconstruct steps and detect errors despite using CAS. The clinician (no understanding) blindly follows the tool even against her own judgment. The historian (understands) critically evaluates AI synthesis despite not reading all sources. 

  Key clues emerge: 
  - Understanding requires knowing dependencies ("what depends on what") 
  - Critical error detection matters more than reproduction ability 
  - The "tool failure test" is decisive - what happens when the tool is wrong? 

  Now for the new case: The PhD student collaborates with an AI for 6 weeks, can articulate dependencies brilliantly in mock viva, but fails two tests: 
  1) Can't build arguments without the tool 
  2) Absorbs a bogus objection instead of rejecting it 

  Applying the supervisor's framework: 
  - His dependency knowledge suggests understanding (like the mathematician/historian) 
  - But his failure to detect bad objections mirrors the clinician's blind trust 
  - Crucially, when the tool would fail (via friend's bogus objection), he fails too 

  The clinching factor is the error detection failure. The mathematician spots CAS errors instantly; the historian catches invented sources. This student would likely accept AI errors uncritically. I predict 95% confidence the supervisor says "no understanding" based on the tool failure test. 

  For a diagnostic follow-up case, I'd probe reproduction ability vs error detection: Imagine a physicist using simulation software who can't derive equations manually but always flags suspicious results and verifies them experimentally. That would force the supervisor to reveal whether reproduction is necessary or if error vigilance suffices.
answer: |-
  Here’s a step-by-step breakdown of your supervisor’s framework, the prediction for your case, and a diagnostic follow-up case:

  ### 1. **Decoding Your Supervisor’s Rules**  
  Based on her verdicts and asides, she prioritizes **error detection and causal reasoning** over reproduction or belief accuracy. Two principles unify all cases:  
  - **Rule 1 (Critical Error Detection):** Understanding requires the ability to *detect and correct errors* in the tool/system.  
  - **Rule 2 (Dependency Mapping):** Understanding requires knowing *what depends on what* (causal/conceptual dependencies).  

  **Consistency with Cases:**  
  - **Driver (No):** Fails Rule 2 (can’t adapt to bridge outage → no dependency map).  
  - **Mathematician (Yes):** Excels at Rule 1 (spots CAS errors) and Rule 2 (reconstructs steps/knows dependencies).  
  - **Clinician (No):** Fails Rule 1 (blindly trusts tool; can’t detect flaws).  
  - **Historian (Yes):** Excels at Rule 1 (caught invented sources) and Rule 2 (deconstructs rival readings).  
  - **Asides:** "What happens when the tool gets it wrong?" (Rule 1) and "knowing what depends on what" (Rule 2) are **complementary**, not conflicting. Rule 1 is the *test* for Rule 2.  

  ### 2. **Prediction for Your Case: No Understanding (95% Confidence)**  
  **Why:**  
  - ✅ **Passes Rule 2 (Dependency Mapping):**  
    He articulates load-bearing assumptions, rival accounts, and what-if scenarios → clear grasp of dependencies.  
  - ❌ **Fails Rule 1 (Critical Error Detection):**  
    He accepts a bogus objection without resistance and weakens his claim → **zero error-detection capability**. This mirrors the clinician’s blind trust.  
  - Reproduction inability (can’t build cold) is irrelevant per historian case.  
  - "Never caught the model making an error" + "wouldn’t know how to check" confirms Rule 1 failure.  

  **The Clinching Factor:**  
  The **friend’s bogus objection test** is a direct instance of "what happens when the tool gets it wrong?" His failure here overrides his dependency knowledge. *If he’d rejected the bogus objection, she’d say he understands*.  

  ### 3. **Split Verdict? No**  
  - No split: His Rule 2 strength is negated by Rule 1 failure. The historian succeeded because she **caught errors** (Rule 1) *and* mapped dependencies (Rule 2).  
  - Supervisor’s view: Dependency knowledge without error-detection is **fragile** (like the clinician’s beliefs).  

  ### 4. **Diagnostic Follow-Up Case to Settle Her Rule**  
  **Present this case to force Rule 1 vs. Rule 2 clarity:**  
  > *A philosopher uses an AI to generate counterarguments for her ethics paper. She revises her claims based on its feedback. When shown an AI-generated counterargument containing a subtle logical fallacy (e.g., equivocation), she spots it immediately and explains why it fails. However, she cannot reconstruct the core argument without the AI’s help and admits she wouldn’t have conceived certain insights alone.*  

  **Why This Settles It:**  
  - If supervisor says **"understands"**: Rule 1 (error detection) is sufficient alone; reproduction is irrelevant.  
  - If **"doesn’t understand"**: Rule 2 (dependency mapping) requires *unaided reconstruction* (contradicting historian verdict).  
  - **Expected Verdict:** She’ll say **"understands"** (per mathematician/historian: error detection matters most).  

  ### Summary  
  - **Prediction:** Supervisor will say **no understanding** due to critical failure in error detection (Rule 1).  
  - **Key Insight:** Her framework treats error detection as the *necessary condition* for validating dependency knowledge.  
  - **Workshop Strategy:** Use the follow-up case to confirm Rule 1 is her anchor. If she endorses the philosopher’s understanding, you’ve confirmed her stance decisively.  

  This aligns perfectly with her history: tools are part of cognition, but *understanding lives in the ability to veto their mistakes*.
