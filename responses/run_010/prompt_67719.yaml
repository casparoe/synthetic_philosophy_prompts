answer: |-
  ### Exam Question  
  **Hume’s maxim in *Of Miracles* (Section X of the *Enquiry*) states that no testimony can establish a miracle unless the falsehood of the testimony would be more miraculous than the event reported. Using Earman’s Bayesian reconstruction, explain whether and how Hume’s principles can distinguish between a report of a *miracle* (a violation of a law of nature) and a report of a merely *novel natural event* (e.g., meteorite falls before 1803). Crucially, address whether this distinction requires prior knowledge of which regularities constitute *laws*—and if so, whether this renders Hume’s test circular or question-begging. Do not restate Hume’s definitions, maxim, or Part II considerations; engage the Bayesian machinery explicitly.**  

  ---

  ### Model Answer (698 words)  

  Hume’s maxim, reconstructed Bayesially, holds that testimony for event *E* should be accepted only if the probability of *E* given testimony *T* exceeds 0.5. This requires *P(E|T) > P(¬E|T)*, which simplifies to *P(T|E) × P(E) > P(T|¬E) × P(¬E)*. For miracles (*M*), Hume argues *P(M)* is vanishingly low because *M* violates a law of nature, which by definition reflects exceptionless experience. The core difficulty—illustrated by the L’Aigle meteorite—is that novel natural events (*N*) initially share *N*’s epistemic predicament: both *P(M)* and *P(N)* are extremely low *prior* to investigation, as both conflict with established regularities.  

  The Bayesian analogy between *M* and *N* is precise:  
  - **Prior Improbability**: For *M* (e.g., resurrection), *P(M) ≈ 0* because it contradicts a law (e.g., "all men die permanently"). For *N* (e.g., rocks falling from the sky), *P(N) ≈ 0* because it contradicts an observed regularity (e.g., "no verified cases of aerial stones exist in European science pre-1803").  
  - **Testimony Likelihoods**: *P(T|M)* and *P(T|N)* may be similar (e.g., both may have credible witnesses).  
  - **Initial Maxim Application**: Before L’Aigle, Hume’s maxim *correctly rejects* *N* on his principles: *P(N)* is so low that even if *P(T|N)* is high, *P(N|T)* < 0.5 unless *P(T|¬N)* is lower still.  

  **The Distinction: Asymmetry in Evidence Accumulation**  
  The critical difference lies in how *M* and *N* respond to new evidence. For *N*, the "law" it violates is merely *empirical*—a contingent pattern open to revision. For *M*, the violated "law" is *necessary* by Humean definition. This asymmetry allows novel events to overcome prior improbability without presupposing laws:  
  1. **Novel Events (e.g., Meteorites)**: When Biot verifies L’Aigle, *N* transitions from "apparent violation" to "new regularity." Crucially, *P(N)* increases via *conditionalization*: new evidence *E* (e.g., physical fragments, consistent trajectories) drastically raises *P(N|E)*. The prior low *P(N)* reflected incomplete data, not metaphysical impossibility. Hume’s maxim initially rejects *N* but permits *revision* when testimony converges with physical evidence.  
  2. **Miracles**: *M*’s prior improbability (*P(M) ≈ 0*) is *insurmountable* because *M*’s definition entails that no evidence *can* override it. If *M* violates a *law*, then *by definition* all evidence must favor ¬*M*; any testimony for *M* must be false (since *P(T|M) = 0* if *M* is impossible). Here, *P(M)*’s low value is *analytic*, not empirical: it presupposes that laws admit no exceptions.  

  **Does This Presuppose Laws? Circularity?**  
  Yes—distinguishing *M* from *N* requires prior knowledge of which regularities are *laws* (necessary) vs. *accidents* (contingent). Crucially, Hume provides no non-circular criterion for this distinction. Consider:  
  - If we *define* laws as exceptionless patterns, then *M* reports are *always* defeated because *P(M) = 0* by fiat. But this makes Hume’s test vacuously tautological: miracles are impossible because we call their violations "laws."  
  - For *N*, we treat the contradicted regularity as *accidental* (e.g., "no meteorites" was a sampling error). But without independent grounds for distinguishing laws from accidents, Hume must *assume* which regularities are inviolable—precisely the point at issue.  

  **The Decisive Role of Priors**  
  The Bayesian pinpoint is this:  
  - For both *M* and *N*, *P(event)* is initially low → testimony is rejected.  
  - For *N*, *P(event)* can rise because new evidence *redefines the prior regularity* (meteorites become "natural").  
  - For *M*, *P(event)* *cannot* rise because the law is *stipulated* as immutable.  

  Thus, the distinction hinges on whether the prior improbability is *revisable* (*N*) or *absolute* (*M*). But revisability depends on whether we classify the contradicted regularity as a mere hypothesis (for *N*) or a law (for *M*). Hume offers no way to do this without already knowing which regularities *are* laws—a circularity that, as per Earman, renders his maxim either question-begging or inert.  

  **Conclusion**  
  Hume’s principles *cannot* coherently distinguish miracles from novel events without presupposing a framework of laws. The Bayesian reconstruction shows that prior improbability does decisive work *twice*: first, in initially rejecting testimony for both *M* and *N*; second, in permanently blocking *M* but not *N* via an unmotivated stipulation that "laws" cannot be violated. The meteorite case underscores this: what made L’Aigle persuasive was not testimony alone but its consistency with *natural* evidence—a pathway Hume denies miracles by definitional fiat.  

  ---

  ### Marking Scheme (20 points total)  
  **Must-hit moves** (losing marks = common errors):  

  1. **Bayesian Formulation (4 pts)**  
     - *Hit:* Explicitly reconstructs the maxim as *P(E|T) > 0.5* and identifies *P(E)* as critical.  
     - *Miss (‑4):* Describes Hume’s argument without Bayes (e.g., "balance of probabilities").  

  2. **Prior Improbability Parity (4 pts)**  
     - *Hit:* States that *P(M)* and *P(N)* are both initially near-zero due to conflict with experience.  
     - *Miss (‑4):* Assumes *P(N)* is higher than *P(M)* from the outset.  

  3. **Asymmetry in Evidence Response (4 pts)**  
     - *Hit:* Explains that *N* can raise *P(N)* via new evidence (e.g., Biot’s investigation), but *M* cannot due to *analytic* prior *P(M)≈0*.  
     - *Miss (‑4):* Claims both are equally updatable or misses the necessity of laws for *M*.  

  4. **Law/Accident Distinction & Circularity (4 pts)**  
     - *Hit:* Argues that classifying a regularity as a *law* (vs. accident) is prerequisite to treating *M* differently—and that Hume lacks non-circular criteria.  
     - *Miss (‑4):* Ignores circularity or asserts laws are self-evident.  

  5. **Pinpointing the Decisive Bayesian Move (4 pts)**  
     - *Hit:* Identifies *P(event)*’s revisability (for *N*) vs. unrevisability (for *M*) as the crux, tied to lawhood assumptions.  
     - *Miss (‑4):* Focuses only on testimony reliability or Hume’s psychology.  

  *Note:* Answers reciting Hume’s definitions/maxim/Part II automatically cap at 5/20.  

  ---  
  This question forces engagement with Hume’s core epistemological tension while leveraging Earman’s framework. The model answer and scheme target conceptual precision over exegesis—fitting for an advanced seminar.
