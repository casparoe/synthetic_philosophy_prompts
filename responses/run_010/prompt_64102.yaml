answer: |-
  ## The Weighting Room

  The air in the Bureau of Counterpart Verification hummed with the low thrum of pneumatic tubes and the scratch of steel nibs on quadruplicate forms. Elara’s fingers, stained faintly blue at the tips, danced over the petition before her. Form C-7: Petition for Counterpart Verification (Deceased). Subject: Arthur Finch. Petitioner: Helen Finch (Widow). The grief was a palpable scent beneath the antiseptic smell of ink and ozone.

  Helen Finch had weighted heavily: Origin & Matter (35%), Attachments (Family) (30%), Small Habits (20%). Trajectory and Temperament shared the meagre remainder. She wanted Arthur *as he was*, rooted, familiar, the man whose socks she’d darned and whose coffee mug was still warm on the shelf. Origin and Matter – his birth city, his genetic blueprint, the very atoms that had composed him – were paramount. Attachments to *her*, to their life. The small habits: whistling off-key in the shower, folding the newspaper precisely in thirds.

  Elara fed the weighted petition into the Verification Engine. It wasn’t a machine in the clanking sense, but a network of clerks like her, cross-referencing the vast, static archives of Elsewhere. Worlds weren’t traversed; descriptions were compared. The Engine whirred internally, lights flickering on its opaque panel. Minutes later, a crisp report slid into her tray.

  **Counterpart Report #CR-78432**
  **Subject: Arthur Finch (Deceased)**
  **Counterpart Verified: Arthur F. (Elsewhere Designation: Theta-9/Delta-7)**
  **Resemblance Weighting Applied: Origin/Matter (35%), Attachments-F (30%), Habits-S (20%), Trajectory (10%), Temperament (5%)**

  *Description:* Arthur F. resides in his city of birth. He works at the municipal waterworks, as his counterpart did prior to his automotive accident at age 32. He married his childhood sweetheart, Clara. They have two children: Thomas (9) and Marie (7). He maintains a small vegetable garden. Observed habits: Whistles off-key while watering plants, folds his work overalls with meticulous care each evening. Attachments appear stable and focused on immediate family unit. Trajectory remains local, professionally and geographically stable. Temperament observed as generally placid, content with routine.

  Helen Finch would receive this. Elara imagined her tracing the words about the garden, the whistling, the children Arthur never had here. It wasn’t him. It was *an* Arthur, shaped by the weights Helen had chosen. A man living the life *this* Arthur’s matter and origins and attachments might have led to, had his car not skidded on black ice two years ago.

  Three weeks later, another C-7 landed on Elara’s desk. Subject: Arthur Finch. Petitioner: Marcus Vance (Friend & Former Colleague). Elara’s eyebrows rose. Arthur Finch was popular, it seemed, in death.

  Marcus Vance’s weighting was starkly different: Temperament (40%), Trajectory (35%), Attachments (Professional) (15%). Origin & Matter barely registered (5%). Small Habits: 5%. He’d scrawled a note: *"What did that spark in him *want*? Where would his restless mind have taken him?"* Arthur Finch, Elara recalled from the earlier file, had been an insurance adjuster who painted landscapes on weekends and dreamed aloud of galleries.

  The Engine processed. A different report emerged.

  **Counterpart Report #CR-78901**
  **Subject: Arthur Finch (Deceased)**
  **Counterpart Verified: Arto F. (Elsewhere Designation: Sigma-3/Gamma-11)**
  **Resemblance Weighting Applied: Temperament (40%), Trajectory (35%), Attachments-P (15%), Origin/Matter (5%), Habits-S (5%)**

  *Description:* Arto F. is a moderately successful landscape artist based in a coastal city. He left his hometown at 22, studied art despite familial pressure towards practical careers. Never married. Maintains close collaborative relationships with fellow artists and a gallery owner. Observed temperament: intense, driven, prone to bouts of focused energy and melancholic reflection. Trajectory marked by significant geographical relocation and career risk-taking. Observed habit: Taps pencil rapidly against sketchpad when concentrating. Origin: Similar region, but divergent ancestry noted. Physical resemblance approximate, not exact.

  Marcus Vance stormed into the Verification Hall two days later, waving CR-78901. His face was thunderous. Elara braced herself.

  "This?" he slammed the report onto her counter. "This *stranger*? This rootless painter? This isn’t Arthur! Arthur was… solid. Reliable. He had Helen, he had his garden! This Arto… he’s some Bohemian ghost! How is *this* what might have been?"

  "Mr. Vance," Elara said, keeping her voice level, procedural. "The report accurately reflects the counterpart selected under the resemblance weighting *you* specified and signed for. You prioritized temperament and trajectory. Origin, matter, and personal attachments were weighted low. The Engine located an individual whose life path and character align strongly with those prioritized aspects of Arthur Finch."

  "But it’s not *him*!" Vance insisted, leaning forward, his knuckles white on the counter. "It’s just some other bloke! What comfort is that? What truth? I don’t grieve for what *Arto* does! I grieve for Arthur. This," he jabbed the paper, "is worthless. A description of a random man."

  "The report doesn’t claim identity, Mr. Vance," Elara replied, tapping the standard disclaimer printed on every page: *‘The described individual is a distinct entity whose life exhibits significant resemblance to the subject under the specified weighting. No transference or continuity of identity is implied.’* "It answers the specific question posed by your weighting: what life, elsewhere, most closely embodies the aspects of Arthur Finch *you* deemed most essential to consider ‘what might have been’." Her answer was rote, procedural armour against the raw, familiar objection. Was Vance right? Was it all just paper? She saw the doubt flicker in the eyes of the junior clerk listening nearby.

  Vance scoffed, crumpling the report slightly. "Paper. Descriptions. You peddle possibilities, but they’re just… stories about other people." He turned and stalked out, leaving the report behind like discarded trash.

  The next challenge landed in Elara’s inbox, flagged for Senior Clerk Discretion. A petition chain: Mrs. Agnes Pike petitioned for her deceased husband, Bertram (Weighting: Habits-S 30%, Attachments-F 30%, Origin/Matter 25%, Temperament 10%, Trajectory 5%). The Engine returned Counterpart: Bernard P. (Kappa-4/Epsilon-2).

  Then, Mr. Dennis Lowe petitioned for his deceased business partner, Samuel Graves (Weighting: Attachments-P 40%, Trajectory 30%, Temperament 20%, Origin/Matter 5%, Habits-S 5%). The Engine returned… Bernard P. (Kappa-4/Epsilon-2).

  One counterpart, Bernard P., fulfilling two distinct petitions for two different deceased subjects: Bertram Pike and Samuel Graves. The Engine’s tie-breaking protocols (based on chronological petition receipt) had initially assigned Bernard to Mrs. Pike. But Mr. Lowe’s petition also legitimately claimed Bernard under *his* weighting, which prioritized professional attachments and trajectory – Bernard P. was apparently a successful co-owner of a small engineering firm in his world, resembling Samuel Graves’s professional life deeply, while his resemblance to Bertram Pike’s domestic focus was weaker but still met the threshold under Agnes Pike’s weighting.

  The non-transitivity reared its head. Elara pulled the files. Bernard P. resembled Bertram Pike significantly under weighting A. Bernard P. also resembled Samuel Graves significantly under weighting B. But Bertram Pike and Samuel Graves, in their own lives? Utterly different men – a quiet bookkeeper and a gregarious salesman. No direct resemblance chain existed. The Engine choked. It could not resolve the single Bernard P. satisfying two distinct petitions without violating its own logic that each counterpart report was unique to the subject *and* weighting.

  Elara spent hours cross-referencing the archived descriptions. Bernard P. *did* fit both weightings sufficiently. The Bureau’s mandate was clear: find the *nearest* counterpart under the *given* weighting. Logic demanded Bernard P. could serve both roles; the reports would be factually accurate descriptions of his life as seen through each petitioner’s lens. The overlap was an artifact of the weighting system and the vastness of Elsewhere, not an error.

  She drafted the decision: "Re: Counterpart Assignment Conflict CR-80155 (Pike) & CR-80162 (Graves). Finding: Counterpart Bernard P. (Kappa-4/Epsilon-2) satisfies the resemblance thresholds under both distinct weightings applied to distinct subjects. Reports CR-80155 and CR-80162 are both authorized. Description of Bernard P.'s life will be generated specific to each weighting focus for their respective reports." She signed it, Senior Clerk Elara Voss. Bernard P. would be described to Agnes Pike highlighting his quiet evenings reading and tending roses (Habits-S, Attachments-F), and to Dennis Lowe emphasizing his engineering partnerships and business growth (Attachments-P, Trajectory). One life, two truths, depending on the question asked.

  Processing the forms, the objections, the overlaps – it wore on her. Elara hadn’t filed a petition herself. Not for Ben. Not yet. The thought of weighting him felt like dissection. Origin? The sandy hair, the slight gap in his front teeth? Temperament? His easy laugh, the sudden intensity when arguing politics? Trajectory? The unfinished doctorate? Attachments? Her. Always her. Small Habits? The way he’d drum his fingers on the steering wheel to complex jazz rhythms only he could hear.

  She’d held the blank C-7 for months. Helen Finch’s Arthur, rooted and content. Marcus Vance’s Arto, restless and artistic. Agnes Pike’s Bernard, domestic. Dennis Lowe’s Bernard, entrepreneurial. Bertram and Samuel, linked only by a stranger elsewhere. Vance’s anguished cry echoed: *"It’s just some other bloke!"*

  Was that all it was? Beautiful, heartbreaking descriptions of strangers living lives Ben might have lived? Was the comfort Helen Finch found in her report a delusion? Was the report Elara might request just… paper?

  She thought of Ben. Not the memory, but the absence. The silence where his opinions used to fill the room. The stillness where his restless energy had been. What did she want from Elsewhere? Not Ben. Ben was gone. Irrevocably. The Bureau’s core axiom: no crossing. No one exists twice.

  What she wanted… was the shape of the silence filled. The shape of what *wasn’t*, but *could have been*. The counterfactual. The might-have-been made manifest in the *is* of someone else. Not Ben, but the life his particular essence, weighted just so, could have led.

  Elara took the C-7 form. Her pen hovered over the grid. Origin & Matter? Important, the foundation… but 20%. Temperament? His brilliant, frustrating spark… 25%. Trajectory? The roads not taken… 25%. Attachments? Her. Them. The love that defined so much… but not everything. Not for this question. 25%. Small Habits? The finger-drumming, the way he’d hum when thinking… 5%. She didn’t weight Attachments highest. She weighted the *potential* – the temperament and the trajectory – equally with the roots and the love. She wanted to see the life Ben’s restless mind and inherent drive might have carved, even if it diverged far from her, far from the life they’d shared. She signed her name. Elara Voss. Petitioner. Irrevocable.

  She fed the form into the Verification Engine slot. It whirred, lights chasing each other behind the frosted glass. The report wouldn’t bring Ben back. It wouldn’t even be *him*. It would be a description of a man, somewhere, living a life that answered the specific question she had asked about the absence Ben left behind. It would be the shape of the silence. That was all "might have" ever was. And it was everything. She waited for the tray to deliver the description of a stranger who was, under her weighting, the nearest possible answer.
