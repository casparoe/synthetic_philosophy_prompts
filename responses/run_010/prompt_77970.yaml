answer: |-
  Below is a decision tree designed to guide students from understanding Harsanyi's aggregation theorem to a named position on whether it vindicates utilitarianism. The tree adheres to your constraints: nodes are answerable from the theorem and ethical instincts (not historical views), covers key open issues (unanimity scope, utility scales, weights, utility interpretation, and probability agreement), and includes your requested leaves. The tree has 8 questions and 8 leaves.

  ---

  ### **Decision Tree: Does Harsanyi's Theorem Vindicate Utilitarianism?**

  #### **Start**
  **Q1: Should Pareto unanimity apply only to outcomes (sure things), not lotteries/prospects?**  
  - **Yes** → **Leaf A1** (Pareto Only for Outcomes)  
  - **No** → Proceed to Q2.

  **Q2: Is requiring unanimity over lotteries (even with mild risk-aversion disagreements) too demanding?**  
  - **Yes** → **Leaf A2** (Unanimity Too Strong)  
  - **No** → Proceed to Q3.

  **Q3: Must individuals agree on probabilities (e.g., is imposing objective/common probabilities illegitimate)?**  
  - **Yes** → **Leaf E** (Subjective Probabilities Problem)  
  - **No** → Proceed to Q4.

  **Q4: Can interpersonal utility comparisons fix a common zero and unit (e.g., "Alice's 10% gain = Bob's 20% loss")?**  
  - **No** → **Leaf B** (Normatively Empty: Scales)  
  - **Yes** → Proceed to Q5.

  **Q5: Is "utility" in the theorem a measure of wellbeing (not just coherent preferences)?**  
  - **No** → **Leaf D** (Preference-Based, Not Wellbeing)  
  - **Yes** → Proceed to Q6.

  **Q6: Should the social planner be symmetric (anonymity over identities)?**  
  - **Yes** → **Leaf F** (Plain Sum Utilitarianism)  
  - **No** → Proceed to Q7.

  **Q7: Are the weights in the sum determined by the theorem ethically appropriate?**  
  - **Yes** → **Leaf C** (Weighted Utilitarianism)  
  - **No** → Proceed to Q8.

  **Q8: Can unequal weights be justified non-arbitrarily (e.g., prioritarianism, needs, responsibility)?**  
  - **Yes** → **Leaf H** (Prioritarian/Weighted from Ethics)  
  - **No** → **Leaf G** (Normatively Empty: Weights)  

  ---

  ### **Leaves (Named Positions)**
  - **A1: Pareto Only for Outcomes**  
    *"The theorem requires unanimity over lotteries. If Pareto only applies to outcomes, the theorem doesn’t bite—it’s inapplicable to real disagreements."*  
  - **A2: Unanimity Too Strong**  
    *"Unanimity over lotteries is unrealistically strict. The theorem only 'aggregates' when there’s no disagreement to resolve."*  
  - **E: Subjective Probabilities Problem**  
    *"Individuals may reasonably disagree on probabilities. The theorem’s reliance on common/objective probabilities makes it irrelevant for subjective uncertainty."*  
  - **B: Normatively Empty (Scales)**  
    *"Without interpersonal comparisons, utilities are arbitrary scales. The theorem is a math trick with no ethical content."*  
  - **D: Preference-Based, Not Wellbeing**  
    *"Utility represents coherent preferences, not wellbeing. Aggregating preferences ≠ aggregating wellbeing, so it’s not utilitarianism."*  
  - **F: Plain Sum Utilitarianism**  
    *"Equal weights (from symmetry) + interpersonal scales + wellbeing interpretation vindicate sum utilitarianism."*  
  - **C: Weighted Utilitarianism**  
    *"Weights are unequal but fixed by the theorem. This is a form of utilitarianism, but weighted by the social planner’s preferences."*  
  - **H: Prioritarian/Weighted from Ethics**  
    *"Weights are unequal and justified ethically (e.g., priority to the worse off). The theorem enables but doesn’t require equal weighting."*  
  - **G: Normatively Empty (Weights)**  
    *"Weights are arbitrary (not symmetric) and lack ethical justification. The theorem is vacuous for normative purposes."*  

  ---

  ### **Notes on Coherence and Unattractive Positions**
  1. **Incoherent/Unattractive Combinations**:  
     - **Weighted Utilitarianism (C) without ethical justification** (Q7 → C without Q8): This path (accepting weights as "appropriate" without ethical grounds) is incoherent. If weights are arbitrary (per the theorem), calling them "ethically appropriate" contradicts ethical instincts. Most skip Q8 if answering "Yes" at Q7.  
     - **Plain Sum Utilitarianism (F) without symmetry** (Q6 → F and Q7 → C/H/G): Impossible—symmetry is required for equal weights.  
     - **Prioritarian (H) with normatively empty scales** (Q4 → B and Q8 → H): Incoherent. Prioritarian weights require interpersonal comparisons (fixed scales).  

  2. **Under-Explored Positions**:  
     - **Subjective Probabilities (E) + Fixed Scales (Q4)**: Few defend this—if probabilities are subjective, fixing utility scales seems doubly arbitrary.  
     - **Normatively Empty (B or G) + Wellbeing (Q5)**: Ethically unstable. If utility = wellbeing but scales/weights are arbitrary, wellbeing aggregation is meaningless.  

  3. **Indistinguishable Leaves**:  
     - **B (Normative Empty: Scales) vs. G (Normative Empty: Weights)** share the "empty" conclusion but for different reasons. The tree separates them via Q4 (scales) → Q5 → Q6 → Q7 → Q8 (weights).  
     - **C (Weighted Utilitarianism) vs. H (Prioritarian)** both accept unequal weights. The tree separates them with Q8: C accepts the theorem’s weights; H requires external ethical justification.  

  4. **Unattractive but Coherent**:  
     - **Weighted Utilitarianism (C)**: Accepts the theorem’s weights as ethically appropriate. Unpopular but coherent if one trusts the social planner’s preferences.  
     - **Preference-Based (D) + Symmetry (F)**: Aggregates preferences equally but denies wellbeing. Defensible but not utilitarian.  

  ---

  This tree forces students to confront ambiguities in the theorem (e.g., unanimity scope, scales, weights, utility interpretation, probabilities) and lands them in a philosophically coherent position. Let me know if you’d like adjustments!
