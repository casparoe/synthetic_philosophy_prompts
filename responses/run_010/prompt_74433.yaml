prompt: |-
  I teach an upper-level logic course and every single year I end up in the same conversation, and I've never found a label for what's actually going on in it. Let me give you two versions of it, because the shape is the same even though the subject matter isn't.

  Version one. Someone challenges a rule of inference — why does that conclusion follow from those premises? I answer by handing over a further rule, or a conditional that licenses the move. They accept it cheerfully, zero resistance. And then they say: fine, but that conditional is itself a claim, and now I'm asking about *it* — and here's the twist — the question they're now asking isn't the question they started with, because the rule I just produced lives in a slightly richer vocabulary than the one we were working in. So I answer again, they accept again, and every acceptance shifts what's under discussion. Nobody ever refuses a step. Every individual demand gets met on its own terms. And after six rounds we're nowhere, but the feeling isn't the feeling of being stuck — it's more like climbing a staircase that keeps growing new landings underneath you.

  Version two. Someone asks what justifies induction. I offer the uniformity of nature. They say: granted, I'll take that — but now, why should *that* license the inference? And they're right to ask, because uniformity has quietly imported a notion of resemblance that was no part of the original question, so what they're now pressing on is broader than what I set out to answer. I extend the account. They accept it. They re-ask. The target has grown again.

  The nearest thing I know is Lewis Carroll's tortoise, but I'm fairly confident its not the same phenomenon and I want to be told exactly why. The tortoise swallows every premise you heap on, including the conditional, and simply declines to make the transition — the blockage is at the step itself, and nothing new enters the picture, so the regress is homogeneous, the identical demand repeated forever. In my cases it's the reverse: the demand is heterogeneous, each round is a genuinely different and slightly larger question, and my interlocutor never refuses anything. It also isn't moving the goalposts, since they're not being slippery or changing there mind — they're correct each time that my new answer covers more territory than the old question did. And it isn't a plain infinite regress of reasons either, because there's no single proposition whose justification is being demanded all the way down.

  So: is there an established term for justification that's locally satisfiable at every stage but globally unsatisfiable, on account of the fact that satisfying a stage enlarges the thing being asked about? I have a hunch this is connected to certain results about formal systems where adding axioms just generates new sentences the system still can't prove, but I'd rather you made the connection than watched me guess at it. And if there's no name, coin one — definition first, then draw the boundary lines precisely against the tortoise, against a benign or non-vicious regress, and against ordinary question-begging. The label is the least interesting part; I want the carving, and I want to know where the edges are, including whether a case counts where the vocabulary grows but the underlying question really hasn't changed.

  Give me your bottom line as the very first sentence — named or unnamed, and what you'd call it. Then keep the entire reply under 300 words, plain prose, no headings, and no reference list; I just want the concepts, not the bibliography.
reasoning: |-
  Alright, the user is describing a recurring issue in their logic course where students accept each justification step but keep asking for justification of the new elements introduced, leading to a never-ending expansion of the question. Let me start by understanding the core problem.

  First, they mention two versions: one about inference rules and another about justifying induction. In both, every answer adds new vocabulary or concepts, shifting the scope. The students aren't rejecting steps; they're expanding the query each time. The key difference from Lewis Carroll's tortoise is that the tortoise keeps asking the same question without moving, while here, each step introduces something new, making the question broader.

  The user wants a term for this phenomenon. They mentioned it's locally satisfiable but globally unsatisfiable because each solution enlarges the domain. They also suspect a connection to formal systems where adding axioms creates new unprovable statements. I need to recall if there's an existing term. Maybe "regress of enrichment" or "expansive regress"? But I should check if there's a standard term first.

  Looking at analogies, Gödel's incompleteness comes to mind. Adding axioms generates new true statements that can't be proven within the system. That matches the user's hunch. But is there a specific philosophical term? "Conceptual expansion" in justifications? The user wants to differentiate this from homogeneous regresses (like the tortoise) and question-begging. 

  Also, the user emphasizes that the vocabulary growth changes the question's scope. Even if the core question remains, the expanded context requires new justification. The key points are: incremental acceptance, domain enlargement, no global satisfaction. 

  I think coining a term makes sense. "Justificatory inflation" captures the expanding nature. "Ascending regress" could work, implying upward movement. But "expansive regress" might be clearer. Need to define it precisely, distinguishing from tortoise (static regress), benign regress (finite), and question-begging (circular).

  Finally, ensure the explanation is concise, under 300 words, starting with the term. Highlight the local vs. global satisfaction and the domain expansion. Make sure the boundaries with other concepts are clear.
answer: |-
  Here's the bottom line: This is an **expansive regress of justification**, where each locally satisfactory answer enlarges the conceptual domain requiring justification, preventing global closure.

  It differs from Carroll's Tortoise (a *homogeneous regress*) because the Tortoise demands the same type of justification repeatedly for the *same* inference rule within a *fixed* logical system, refusing to apply *modus ponens*. In your case, the rule/vocabulary *itself* changes at each step, shifting the target – the regress is *heterogeneous*.

  Unlike a benign regress (which might terminate in foundational axioms), this regress is *inherently unsatisfiable* globally because satisfying step *n* creates a new, broader justificandum for step *n+1*. It's not question-begging, as new, accepted premises are introduced; the issue is the *expansion* of the justificatory burden.

  Even if the core question ("why this inference?") feels constant, the *means* used to answer it (each new rule/conditional/vocabulary) intrinsically become the *new* object of inquiry precisely because they were introduced to solve the prior step. The system dynamically generates its own new justificatory challenges. This connects to Gödel-like phenomena: enriching a system to prove previously unprovable statements creates *new* unprovable statements within the enriched system. The process of local justification necessitates conceptual expansion that prevents global completion.
