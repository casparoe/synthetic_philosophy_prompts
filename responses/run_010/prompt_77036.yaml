prompt: |-
  Our reading group on the ethics of collective action has spent three weeks on what the two economists in it call the harmlessness argument, and one of them — a very sharp macro student — has now formalised it on the board in a way the rest of us cannot pick apart, though nearly all of us reject the conclusion. He concedes that (1) is a consequentialist premise, and his claim is that consequentialists are therefore committed to (8):

  (1) An act of yours is wrong only if it makes some identifiable victim worse off than they would otherwise have been, or raises the probability that some identifiable victim will be made worse off.
  (2) In threshold-structured harms, the damage to any victim occurs only once contributions accumulate past a level the system can absorb, and each contribution either falls short of that level on its own or is one of a great many that clear it together.
  (3) If a contribution falls short on its own, then whether it occurs makes no difference to whether the threshold is crossed and hence no difference to any victim; if it is one of many that clear it together, then its removal would leave the threshold cleared by the rest, so again it makes no difference to any victim.
  (4) Nor can such a contribution raise the probability of harm, since raising the probability that a threshold is cleared requires being able to clear it, and by (3) no single contribution can.
  (5) Therefore no individual contribution to a threshold-structured harm is wrong.
  (6) If no act in a set of acts is wrong, then the set is not wrong: there is no mechanism by which a collection of acts could acquire a moral status that none of its members possesses.
  (7) Therefore the totality of contributions that jointly produces the harm is not wrong.
  (8) Therefore threshold-structured harms are produced without anyone acting wrongly — and since the reasoning depends only on the aggregation structure and not on the subject matter, it generalises to any harm delivered in small shares: a thousand marksmen firing at one victim, a million drivers whose combined emissions submerge an atoll, ten million voters whose candidate wins by a handful. In none of these does any individual do wrong.

  My own contribution was to build him a case with the threshold made visible, in the hope of breaking (4). Ten thousand diners each post a short, accurate, mildly negative review of a small restaurant. The platform displays nothing but an average star rating rounded to the nearest half star, and essentially no diner reads the individual text. Any single review changes the displayed rating only if it happens to push the mean across a rounding boundary — which, given that the other 9,999 reviews arrive in no particular order, is a small but strictly positive chance; taken together the reviews carry the displayed rating from four and a half stars to two, and the restaurant closes. He answers that the chance in my case is precisely what (4) excludes, and that if I think a one-in-ten-thousand chance of moving a boundary counts as raising the probability of the closure, then I owe him an account of why the second clause of (1) is not doing all the work, and why (1) has not quietly ceased to be a difference-making principle at all. I work on cost-benefit analysis for a regulator, which is perhaps why (1) feels natural to me and why I keep wanting to repair the argument rather than abandon it.

  That reply is the one I cannot answer, and I am not after pointers to the literature — I want the argument taken apart step by step. Which premise or inference do you reject, and is the defect an equivocation, a scope or quantifier shift, a false dichotomy, or a premise that is simply false? So that you know what I am defending: I want to keep (1), and I want to keep the conviction that the marksmen clause of (8) describes real wrongdoing, so I would like a diagnosis that lets me hold both — but tell me plainly if that pair is untenable, what the cheapest coherent package looks like, and which intuitions I surrender in buying it. Three specific things I want pressed on: whether the counterfactual test in (3) survives contact with the review case, or whether (3) is silently switching between what an act actually changes and what it makes likely; whether (6) is a principle about sets of acts or a claim about whom a harm may be attributed to, since those seem to come apart exactly where the argument needs them not to; and if I give up (4), what is left of the thought that my single review, or my single flight, is negligible rather than merely small.
reasoning: |-
  Hmm, the user presents a sophisticated ethical dilemma involving a formalized argument that seems to prove no individual acts wrongly in threshold-structured harms. The argument uses consequentialist premises to conclude that collective harms like many marksmen shooting or many drivers causing climate change involve no individual wrongdoing. The user wants to preserve both the consequentialist premise (1) and the intuition that such collective actions are morally wrong.

  The user has constructed a restaurant review case to challenge premise (4), where each review has a small probability (1 in 10,000) of changing the displayed rating. The macro student counters that this probability is too small to count as "raising the probability" under premise (1), suggesting this would make premise (1) do all the work and abandon difference-making.

  I need to identify the flaws in this argument. Premise (3) seems problematic because it creates a false dichotomy: either an act changes the outcome or it doesn't. This ignores probabilistic influence. In the review case, each review does raise the probability of harm, even if slightly, by potentially crossing a rounding boundary.

  Premise (6) is also flawed. It assumes that if no individual act is wrong, the set cannot be wrong. But collective wrongs can emerge from combinations of acts that individually seem permissible. This is like the tragedy of the commons where individual actions aggregate to harm.

  Premise (4) wrongly claims no single contribution can raise the probability of clearing the threshold. In reality, each review does increase the probability, however minimally. The argument conflates "making no difference" with "having no probabilistic influence."

  The user's dilemma is that they want to keep (1) but also believe collective harms involve wrongdoing. I can show that (1) can be maintained if we properly understand "raising the probability." Even small probabilities count, and in threshold cases, each act usually does raise the probability slightly. Also, premise (6) should be rejected because collective harms can be wrong even if no single act is blameworthy.

  The user's three specific concerns: The counterfactual test in (3) fails in probabilistic cases. (6) confuses sets of acts with attribution of harm. And giving up (4) doesn't mean individual acts aren't negligible; we can still say they're small contributions but not negligible in a moral sense when aggregated.

  The solution is to reject (3), (4), and (6), keep (1) and (2), and recognize that in threshold cases, individual acts do raise the probability of harm, however slightly. This preserves both consequentialism and the intuition that collective harms involve wrongdoing, without abandoning difference-making.
answer: |-
  I'll dismantle this argument step-by-step, focusing on logical flaws in premises and inferences while preserving your core commitments: keeping (1) and the intuition that the marksman/voter cases involve wrongdoing. The critical failures lie in **premise (3)**, **premise (4)**, and **premise (6)**, with **premise (1)** being salvageable but requiring careful interpretation. Here's the breakdown:

  ### 1. **Premise (3) is False (False Dichotomy & Ignoring Probabilistic Causation)**
     * **The Flaw:** (3) presents a false dichotomy: either your contribution *alone* crosses the threshold (impossible), or it's redundant because removal wouldn't change the outcome (assuming others compensate). This ignores the **probabilistic and pre-threshold influence** of individual acts.
     * **Why it Fails in Your Review Case (and Generally):**
       * **Counterfactual Test (as stated in (3)) is Misapplied:** (3) claims "if a contribution falls short on its own, then whether it occurs makes no difference...". This uses a *deterministic, actual-world counterfactual*: "If *this specific act* were removed, would the threshold *still be crossed in the actual sequence of events?*" In your review case, for *most* reviews, the answer is "yes" – removing one review likely doesn't change the displayed rating *given the actual sequence of the other 9,999 reviews*. This seems to support (3).
       * **But Premise (1) Demands a Broader View:** Premise (1) explicitly includes acts that "raise the probability that some identifiable victim will be made worse off." The deterministic counterfactual used in (3) is insufficient to assess this. We need a *probabilistic* counterfactual: "Does performing *this act* increase the probability of harm compared to *not performing it*, holding fixed only what is independent or background?"
       * **The Probabilistic Counterfactual Breaks (3):** When *you* post your review, you don't know the *exact sequence* of the other 9,999 reviews. From your perspective *before acting*, there is a small but real probability (1/10,000) that your review will be the one that pushes the average across a rounding boundary. Crucially, **not posting your review reduces that probability to zero *for your specific act***. Your act *does* raise the probability of harm (crossing a boundary leading to closure) compared to your inaction. **Premise (3) ignores this probabilistic difference-making by fixating on the deterministic outcome *after* all other acts are known.**
     * **Scope/Quantifier Shift:** (3) subtly shifts from considering an act *in isolation* ("falls short on its own") to considering its removal *within the fixed context of all other actual acts* ("its removal would leave the threshold cleared by the rest"). The latter context is inappropriate for evaluating the probabilistic influence mandated by (1). The *possibility* that your act *could* be pivotal, given uncertainty about others, is what matters for (1)'s probability clause.

  ### 2. **Premise (4) is False (False Generalization & Misunderstanding Probability)**
     * **The Flaw:** (4) claims "no single contribution can raise the probability of harm" because raising the probability "requires being able to clear it [the threshold]." This is demonstrably false.
     * **Why it Fails:**
       * **Probability Raising ≠ Certainty of Clearing:** Raising the probability of an event does *not* require being able to *cause* the event single-handedly with certainty. It only requires making the event *more likely* than it would be otherwise. A single review *can* raise the probability that the threshold is crossed precisely *because* there is uncertainty about the other contributions.
       * **Your Case is the Counterexample:** Your single review *does* raise the probability of the restaurant's closure. While small (1/10,000), it is strictly positive. If the threshold is sensitive and contributions are independent, *every* contribution typically raises the probability of crossing it, however minimally. (4) falsely generalizes from the observation that *no single act is sufficient* to the incorrect conclusion that *no single act increases the probability*. Sufficiency is not required for probabilistic influence.
       * **Conflation:** (4) conflates *causal sufficiency* (clearing the threshold alone) with *probabilistic relevance* (influencing the likelihood of the outcome). Premise (1) cares about the latter.

  ### 3. **Premise (6) is False (Fallacy of Composition & Misattribution)**
     * **The Flaw:** (6) claims "If no act in a set of acts is wrong, then the set is not wrong," arguing there's "no mechanism" for a set to be wrong if members aren't. This commits a **fallacy of composition** regarding moral properties and ignores **collective agency/attribution**.
     * **Why it Fails:**
       * **Sets vs. Collective Actions:** The "set" in (6) is treated as a mere collection of independent acts. However, in threshold cases, the acts form a **collective action** – they are *interdependent* contributions towards a *common type of outcome* (crossing the threshold). The wrongness of the *collective harm* stems from this interdependence and the shared knowledge (or should-be knowledge) that *many such acts together* cause harm.
       * **Attribution vs. Individual Wrongness:** You rightly suspect this is about attribution. The harm is *attributable* to the collective *as a whole* (the group of diners, marksmen, drivers, voters). This collective attribution *does not require* that each individual act, analyzed in isolation, meets the criteria for individual wrongness under (1). The wrongness of the *outcome* arises from the *combined effect* of acts that, individually, might only minimally increase risk or might not be pivotal in the deterministic sense.
       * **The Mechanism:** The "mechanism" is the **joint causation** of a foreseeable harm by a group acting in a coordinated or parallel fashion towards a harmful outcome, where each participant knowingly contributes to the risk or potential. While no single vote elects the bad candidate, the *collective act of voting them in* is wrong, and individual voters can share responsibility for participating in that collective wrong, *even if their individual vote didn't change the outcome* (but *did* raise the probability).
     * **Scope Issue:** (6) incorrectly assumes that the moral status of a *harmful outcome* caused by a set must derive solely from the moral status of the *individual acts* considered atomistically. It ignores the moral significance of the *combined effect* and the *participatory intention/knowledge*.

  ### Addressing Your Specific Concerns

  1.  **Counterfactual Test in (3):** As argued, (3)'s deterministic counterfactual ("Would removal *change the actual outcome*?") **fails in probabilistic cases** and is inadequate for (1). (3) **silently switches** by using this deterministic test to dismiss probabilistic influence. The correct test for (1)'s probability clause is the probabilistic counterfactual: "Does doing the act increase P(harm) compared to not doing it?" In the review case, the answer is "yes."

  2.  **(6) - Sets vs. Attribution:** You are correct that (6) **conflates the moral status of a set of acts with the attribution of harm**. The argument *needs* (6) to claim that because no individual act is wrong (per its flawed reasoning), the *harm itself* isn't wrong. This is false. The harm *is* wrong. It is *attributable* to the collective action. Individuals can be blameworthy for *participating* in a collective action known to cause harm, even if their specific contribution wasn't pivotal. (6) tries to block this by asserting there's "no mechanism," but the mechanism is collective causation and participation.

  3.  **Giving up (4) - Negligibility:** If you give up (4) and accept that your single review/flight *does* raise the probability of harm (however minimally), the thought "my act is negligible" needs refinement:
      *   **Negligible *Impact*?** In terms of the *magnitude of harm caused*, your act is negligible (1/10,000th of the blame? 1/10,000th of the closure? Not really quantifiable like that). In terms of *probability raised*, it might be small (1/10,000) but *not zero*.
      *   **Negligible *Moral Weight*?** This is the key. Consequentialists (like you, given (1)) *must* say that even a small increase in P(harm) can make an act wrong *if the potential harm is severe enough and the cost of abstaining is low enough*. Flying or posting a mildly negative review has very low cost to you; the potential harm (climate disaster, business closure) is severe.
      *   **The Solution:** Your act is **not morally negligible** under (1) precisely because it *does* raise P(harm) for a severe outcome at minimal cost to you. The *reason* it feels negligible is the *low probability* combined with *many other similar actors*. However, consequentialism dictates that we aggregate expected harm. The *expected harm* of your act is (P(your act is pivotal) * Magnitude of Harm). While small, it's non-zero. Crucially, **the *cost to you* of *not* doing the act (not flying, not posting the review) is typically *very low***. Therefore, under a standard consequentialist cost-benefit analysis (your field!), the act *is* wrong: you impose a small but real expected harm on others for a trivial personal benefit. It's the *multiplicity* of such acts that causes the large harm, but each contributes its small expected harm. Giving up (4) doesn't destroy the concept of small contributions; it refines our understanding that "small" refers to the *degree* of probability-raising or expected harm, not its *absence*. The moral significance remains because of the cost/benefit imbalance.

  ### The Coherent Package (What You Can Keep)

  1.  **Keep (1):** The Consequentialist Premise. Interpret "raises the probability" seriously using the *probabilistic counterfactual*: Does doing the act increase P(harm) compared to not doing it, holding fixed background conditions but *not* the specific actions of others (which are part of the causal field the act influences)? In standard threshold cases, **the answer is almost always YES**, however small the increase. Your review case confirms this.
  2.  **Keep the Conviction:** Collective harms like the marksmen/voters *do* involve wrongdoing. Individual contributors *can* act wrongly under (1) because their acts *do* raise the probability of severe harm for minimal personal gain. Furthermore, we can condemn the *collective action* and hold participants responsible *as members of the harming collective*, even beyond the strict individual consequentialist calculus.
  3.  **Reject (3) & (4):** They rely on a false dichotomy and misunderstand probabilistic causation and probability-raising.
  4.  **Reject (6):** It commits a fallacy of composition and misunderstands collective attribution. A set of acts *can* jointly cause a wrongful harm even if, under a flawed deterministic analysis, no single act is deemed wrong. The collective outcome *is* wrong, and individuals can be wrong for their participatory contribution under (1).
  5.  **Reject (5) & (7):** These conclusions depend on the flawed premises (3), (4), and (6).
  6.  **Modify (8):** Threshold-structured harms *are* produced by individuals who *do* act wrongly (by raising P(harm) for severe outcomes at low personal cost), and the collective action they comprise is also wrongful.

  ### Surrendered Intuitions
  *   The intuition that *because* my individual contribution is "just one among millions," it *must* be morally negligible or permissible. Under this analysis, it's not; its permissibility depends on the (usually very unfavorable) ratio of the small expected harm it causes to the small personal cost avoided by refraining.
  *   The intuition that wrongdoing requires being a "but-for" cause or making a detectable difference in the actual outcome. Consequentialism, via probability-raising and expected harm, demands more.
  *   The intuition that if the collective harm is wrong, it *must* be because at least one individual act was deterministically pivotal. This isn't necessary; the collective harm emerges from many acts each contributing small risks.

  ### Conclusion
  The macro student's argument fails because premises (3) and (4) incorrectly dismiss probabilistic difference-making using a flawed deterministic counterfactual test, and premise (6) fallaciously denies the possibility of collective wrongdoing arising from individually small contributions. You can retain your core commitments: a consequentialist principle like (1) *and* the intuition that collective threshold harms involve wrongdoing. The path is to rigorously apply the probabilistic aspect of (1), recognize that individual acts in threshold cases *do* typically raise the probability of harm (however minimally), and accept that this, combined with the severe potential harm and low cost of abstention, makes them wrong. The "negligibility" is quantitative (small expected harm) but not moral, given the cost-benefit imbalance. The argument's fatal flaw is its denial of probabilistic causation and its misunderstanding of collective attribution.
