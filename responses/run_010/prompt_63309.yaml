  ### Feedback Comments  

  #### **Part (a): Robbins’s Objection (40 marks)**  
  1.  **"Robbins’s objection is methodological rather than moral"** → **Solid**. Correctly identifies the core of Robbins’s argument.  
  2.  **"Cardinal utility is not among those data... cannot observe any quantity of satisfaction"** → **Solid**. Accurately explains the positivist stance.  
  3.  **"Ordinalist reconstruction... uncertainty... lotteries"** → **Solid**. Clear summary of single-person utility recovery.  
  4.  **"To say [a policy] raises total utility... must place Anna’s and Ben’s utilities on one scale... no behavioural evidence could settle this"** → **Solid**. Precise articulation of the comparability gap.  
  5.  **"Each person’s utility function... only up to a positive affine transformation"** → **Solid**. Technically sound.  
  6.  **"A claim about whose gain is bigger has smuggled in an ethical judgement"** → **Thin/Overstated**. Robbins framed it as *non-scientific* (not necessarily "ethical"). The inference weakens the point slightly.  
  7.  **"New Welfare Economics... Pareto, compensation tests"** → **Solid**. Appropriate context.  
  **Overall**: Excellent grasp, but slightly overstates the "ethical judgement" angle. Robbins emphasized *non-verifiability*, not normative weight.  

  #### **Part (b): Harsanyi’s Theorem (60 marks)**  
  1.  **Setup & Assumptions (i)-(iii)** → **Solid**. Correct and complete.  
  2.  **Conclusion: social utility = affine transformation of Σ wi Ui** → **Solid**. Accurate.  
  3.  **"Harsanyi is not claiming behavioural evidence... comparability is built into the structure"** → **Solid**. Valid interpretation of the theorem’s implications for Robbins.  
  4.  **"The invariance result does the work... comparisons come for free"** → **Solid**. Correctly highlights how affine transformations resolve the "fragility" issue.  
  5.  **Impartial-observer argument: "Equal weights... forced by weak Pareto + symmetry"** → **Solid**. Clear explanation of the equal-weight derivation.  
  6.  **"Sen and Weymark object... no axiom links Ui to well-being"** → **Solid**. Fair representation of the critique.  
  7.  **"Harsanyi is entitled to read Ui as well-being... axioms treat Ui as interpersonally meaningful"** → **WRONG**.  
      - **Damage**: "the axioms already treat the Ui as interpersonally meaningful".  
      - **Why**: The axioms do *not* treat individual Ui as interpersonally comparable; weights *create* comparability, but the Ui themselves remain unique only up to affine transforms. Sen’s point is that utility here represents *preferences*, not necessarily well-being. This undermines the defense.  
  8.  **"Assumption (ii)... is itself a substantial normative postulate"** → **Solid**. Valid critique.  
  9.  **"Robbins’s programme is not neutral; it is only quieter"** → **Solid**. Insightful conclusion, though slightly overstated (Robbins explicitly rejected comparability; he didn’t "hide" neutrality).  

  **Key Tension**:  
  - The defense against Sen (#7) claims the axioms make utility interpersonally meaningful, but this contradicts the earlier correct point about invariance (#4). **Give up #7** – the theorem does *not* make individual utilities interpersonally meaningful; it constructs a social ordering *as if* utilities are comparable.  

