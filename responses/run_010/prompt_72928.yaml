  ### Prediction Market Design: Logical Uncertainty Exploration

  #### **Bank of Statements** (12 statements, pre-verified via a short Python script)
  - **Tier 1: Settleable in ≤1 min** (Elicits immediate verification)  
    1. "100 is divisible by 5" → **True** (Easily computed; tests basic coherence)  
    2. "2^5 = 32" → **True** (Simple exponentiation; verifiable by all)  
    3. "The 4th prime is 7" → **True** (Primes: 2,3,5,7; requires recall)  
    4. "111 is prime" → **False** (Divisible by 3; tests quick checks)  

  - **Tier 2: Settleable with effort/outside session** (Elicits deferred computation & logical constraints)  
    5. "The last digit of 3^100 is 1" → **True** (Modular arithmetic; cycle length 4: 3,9,7,1; 100≡0 mod 4)  
    6. "GCD(1001, 455) = 91" → **True** (Euclidean algorithm: 1001÷455=2 rem 91; 455÷91=5 rem 0)  
    7. "2^10 = 1000" → **False** (1024 ≠ 1000; common error)  
    8. "The 5th prime is 13" → **False** (5th prime is 11; tests recall under pressure)  

  - **Tier 3: Open in principle** (Elicits unverifiability & asymptotic behavior)  
    9. "The 100th prime is 541" → **True** (Verifiable by sieve; too slow by hand)  
    10. "2^13 - 1 is prime" → **True** (8191; known prime, but hard to check)  
    11. "Collatz(27) takes 111 steps" → **True** (Verified computationally; infeasible manually)  
    12. "10! ends with three zeros" → **False** (10! = 3,628,800; ends with two zeros)  

  **Verification Note**: A Python script can check all statements (e.g., `is_prime(8191)`, `collatz_steps(27)`). Answers are fixed pre-session.  

  #### **Clearing Mechanism**  
  - **Process**:  
    1. **Initial Prices**: All statements start at 0.5 (printed on ledger sheets).  
    2. **Trading Rounds**:  
       - Teams submit **bid** (max buy price) and **ask** (min sell price) for any statement on order slips.  
       - Facilitator collects slips and sorts bids (descending) and asks (ascending) per statement.  
       - **Clearing Price**: Midpoint between highest bid and lowest ask if they overlap; else, no trade (price unchanged).  
       - **Trade Execution**: Overlapping bids/asks transact at clearing price (1 contract per trade).  
       - Updated prices posted on whiteboard.  
  - **Why Price ≈ Probability**:  
    Contracts pay **1 point if true, 0 if false** upon settlement. A price of *p* means traders collectively value a contract at *p* points, implying expected probability *p* of truth. Risk-neutral traders trade toward their true beliefs to maximize expected points.  

  #### **Payoff Scheme**  
  - Teams start with **100 points**.  
  - **Trading**: Buying a contract at price *p* costs *p* points; selling earns *p* points.  
  - **Settlement**:  
    - Tier 1/2 settled at session end (truth revealed).  
    - Tier 3 contracts **expire worthless** (never settled).  
  - **Scoring Rule**: Linear (pay 1 if true, 0 if false).  
    - **Justification**: Risk-neutral agents maximize expected points by trading to their true credence (e.g., buy if true probability > price).  

  #### **Auditor Role**  
  - **Selection**: Two non-trading participants (rotate if disengaged).  
  - **Challenge**: Spot a **dominating portfolio** (e.g., combination of buys/sells guaranteeing profit).  
    - **Example**: If price(A) + price(¬A) < 0.9, buy both contracts for profit ≥0.1 (since one must pay 1).  
  - **Successful Challenge**:  
    - Auditors write the portfolio (e.g., "Buy A and ¬A") and guaranteed profit on whiteboard.  
    - **Correction**: Prices unchanged, but auditors earn **50% of guaranteed profit** (points).  
  - **Preventing Degeneration**:  
    - Auditors **cannot use prior knowledge**; must reference only *current prices* and *logical relations* (e.g., "A and ¬A are exhaustive").  
    - Limit: **3 challenges/session** to avoid triviality.  

  #### **Timeline** (100 min total)  
  - **0–10 min**: Explain rules, assign teams (6 teams of 3; mix math/philosophy), auditors.  
  - **10–15 min**: Distribute materials (ledgers, order slips).  
  - **15–70 min**: **Trading Rounds** (8 rounds, 5 min trading + 2 min clearing each).  
  - **70–85 min**: Final settlement (Tier 1/2 truth revealed; Tier 3 expired).  
  - **85–100 min**: **Debrief** (see below).  
  - **If Overrun**: Cut 1–2 trading rounds (prioritize debrief).  

  #### **Team Structure**  
  - **6 teams of 3**, each with 0–1 math student.  
  - **Justification**:  
    - Math students accelerate Tier 1/2 pricing, exposing asymmetric computation.  
    - Teams force collaboration (mitigates math dominance) and model distributed cognition.  

  #### **Debrief Script**  
  **Do not use "logical omniscience" or "logical induction" until final step.**  
  1. **Logical Constraints (Min 85–88)**:  
     - "Notice Tier 1 prices converged quickly. Why did Tier 2 prices of related statements (e.g., 5 and 7) constrain each other *before* anyone computed them? What does this say about beliefs under unverified logical ties?"  
     - *Use math students*: "The mathematicians anchored Tier 1, but could Tier 2 constraints hold without their speed?"  

  2. **Infeasible Coherence (Min 88–91)**:  
     - "Could any team satisfy *all* constraints simultaneously? Why was fixing A and ¬A trivial alone, but impossible with Tier 2/3? How does computation time break 'coherence-at-an-instant'?"  

  3. **Arbitrage as Standard (Min 91–94)**:  
     - "Auditors profited from price gaps (e.g., A + ¬A < 1). What survived as a 'feasible' standard? Was it perfect prices, or *no pattern of guaranteed profit*? Could auditors exploit the same gap twice?"  

  4. **Unsettled Statements (Min 94–97)**:  
     - "Tier 3 prices hovered near 0.5, unlike Tier 1. Why? What happens to the 'value' of a belief if it *never* resolves? How does this differ from 'hard but solvable'?"  

  5. **Vocabulary (Min 97–100)**:  
     - "This is the **logical omniscience problem**: requiring coherence over all logical truths is infeasible. The alternative is **logical induction**: prices avoid *feasible arbitrage* over time, not instant perfection."  

  #### **Predictable Issues & Rules-Based Solutions**  
  - **Issue**: Math student dominates, "drains pool."  
    - **Solution**: Team trading forces consensus. Tier 3’s unverifiability caps their advantage.  
  - **Issue**: Ledger stagnates; no one trades.  
    - **Solution**: Linear scoring incentivizes trading at any deviation from belief. Low-stakes points reduce hesitation.  
  - **Issue**: Perceived as a "math quiz."  
    - **Solution**: Auditors focus on *price relations*, not truth. Debrief reframes as "belief formation under limits."  

  #### **Candid Limitations**  
  - **No Asymptotics**: Single session ≠ long-run convergence. **Supply in words**: "Real logical induction avoids arbitrage *over time*; we only see hints."  
  - **Auditors ≠ Feasibility**: Human ingenuity ≠ formal computation. **Supply**: "Feasible arbitrage requires *efficiently computable* strategies; auditors illustrate the intuition."  
  - **Limited Constraints**: Only negation pairs covered. **Supply**: "Full logical induction handles complex theorems (e.g., if A→B, price(B)≥price(A)); we use simple cases for tractability."  

  #### **Materials**  
  - **Teams**: Ledger (current prices, holdings), order slips (statement, bid/ask).  
  - **Facilitator**: Master ledger, timer.  
  - **Whiteboards**: Prices, auditor challenges.  
  - **Pre-Script**: Verify statements (provided separately).  

  This design forces collision with logical uncertainty, leverages math-philosophy asymmetry, and stays self-contained. Run tightly, and debrief ruthlessly!
