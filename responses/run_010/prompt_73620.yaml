prompt: |-
  I work on developer tooling, and there's a pattern I keep running into that I can't find a word for. Some properties of an engineer behave like ordinary attributes: you can store them on their record and they stay true when nobody is looking. Others don't. Whether someone is the person you go to about the payments service isn't a fact about them plus a fact about the codebase; it exists entirely in a web of standing dispositions among their colleagues to route problems to them, and it is graded rather than binary — there is no threshold at which they flip from not-it to it.

  Two features are what make me suspect this isn't just a relational property in the trivial sense. If the routing stops — a long leave, the team turns over — the property decays out of existence. Nothing is revoked; it lapses. And the colleagues' dispositions don't merely track it, they partly produce it: someone who is uniformly ignored loses the thing itself, not just the accurate description of it. I suspect the same structure reaches well past job roles, down to whether someone counts as a full adult member of a community at all.

  Is there an established name for a property of this kind? I'd like the nearest candidates set against it — ordinary extrinsic properties, properties that consist in how people respond to something, statuses that hold only because a group collectively treats them as holding, and views on which personhood itself is constituted by one's relationships — with an account of how mine differs from each, which fits best, and where the edges fall. Does a reputation qualify? A debt? Being loved? The label matters less to me than the carving, so if nothing fits, define a term and give its boundary cases.
reasoning: |-
  Okay, the user is asking about a specific type of property that exists in social contexts, especially in developer teams. They describe it as something that's not a fixed attribute but depends on ongoing interactions. The key points they mention are: it decays without active maintenance, it's graded rather than binary, and it's produced by others' dispositions. They want a term for this and comparisons to related concepts.

  First, I need to recall relevant philosophical or sociological concepts. Social ontology comes to mind, specifically Searle's Status Functions. Status functions are assigned by collective intentionality and require continuous recognition. That fits the decay aspect. But the user mentions it's graded, which might not fully align with Searle's binary assignments.

  Next, Capabilities as in Nussbaum and Sen. These are about what a person can do, influenced by social structures. The idea that capabilities erode without support matches the decay point. However, capabilities are more individual-focused, while the user's example involves social routing within a team.

  Social Positioning Theory also seems relevant. Positions in a social structure define rights and duties, maintained by collective recognition. The graded nature here is tricky because positions are often binary. The user's example of being "the person for payments" is a role that exists through others' dispositions to route issues to them. If others stop, the role fades—no formal revocation, just lapse. That's key.

  Reputation is another angle. Reputations depend on others' beliefs and can erode. But reputations are about perception, not necessarily constitutive of the role itself. The user says being ignored causes loss of the property itself, not just the perception. So reputation might not fully capture the constitutive aspect.

  Debt is an institutional fact. It exists because of collective agreement. If not maintained (e.g., forgotten), it lapses. But debts are typically binary, not graded. The user's property is graded—there's no clear threshold. That's a mismatch.

  Being loved is affective and relational. It requires continuous action and can fade. But love is deeply personal, whereas the user's context is professional roles. Also, being loved might not involve the same kind of collective intentionality as a team's routing habits.

  The user's deeper need might be to articulate this concept for tooling design. Understanding how such properties form and decay can help in creating systems that support team coordination. They might need terminology to communicate this to colleagues or document patterns.

  Synthesizing, the closest fit is Status Functions with a gradience aspect. But since it's not a perfect match, coining a term like "Dynamic Role Immanence" or "Relational Role Sustenance" could work. Highlighting the necessity of continuous performance and social recognition is crucial. Boundary cases: a formal title vs. an emergent expert role. The former persists without recognition (extrinsic), the latter lapses (relational sustenance). 

  Also, connecting to personhood in communities ties to broader social recognition theories. Membership depends on being acknowledged by others, which can erode if not maintained. This reinforces the applicability beyond professional settings.
answer: |-
  Based on your detailed description, the concept you're grappling with is best captured by **Relational Sustenance**, with strong roots in **Social Ontology** (especially John Searle's "Status Functions") and **Capability Theory** (Amartya Sen, Martha Nussbaum). No single term perfectly fits, but here's the conceptual carving you requested:

  ### Core Characteristics & Proposed Term
  - **Relational Sustenance**: A property constituted and sustained *entirely* by ongoing patterns of recognition, response, and interaction within a social group. It exists only through continuous collective enactment, decays without active maintenance, and is inherently graded (non-binary).

  ### Comparison to Nearest Candidates

  1.  **Ordinary Extrinsic Properties** (e.g., "being taller than X," "located in NYC")
      *   *How yours differs*: Extrinsic properties depend on external factors but *do not require continuous social performance* to exist. Your engineer's "payments service role" vanishes if colleagues stop routing issues; "being in NYC" persists even if everyone forgets. Relational Sustenance is *ontologically dependent* on practice.
      *   *Fit*: Poor. Misses the performative, sustained-by-action element.

  2.  **Properties Consisting in Responses** (e.g., "being annoying," "being famous")
      *   *How yours differs*: While these are defined by responses, they often imply a *disposition* in the object (e.g., annoying behavior) or are *epistemic* (tracking belief). In Relational Sustenance, the responses *constitute the property itself*, not merely reflect it. Being ignored doesn't just hide the role; it *dissolves* it. The "gradedness" is also more central.
      *   *Fit*: Partial, but insufficient. "Fame" might decay without attention, but it often retains a residual status based on past acts. Your property has *no residue*.

  3.  **Status Functions (Searle)** (e.g., "being CEO," "being money," "being married")
      *   *How yours differs*: Status Functions are the closest philosophical fit. Searle argues they exist *only* by "collective intentionality" – being treated *as* having that status ("X counts as Y in context C"). They lapse without recognition (e.g., money loses value if no one accepts it). **Key differences**:
          *   **Gradedness**: Searlean Status Functions are typically binary (you *are* CEO or not). Your "go-to person" role is intrinsically scalar – one can be "more" or "less" the go-to person.
          *   **Formality/Officialness**: Status Functions often involve explicit rules or declarations (appointment, contract, ceremony). Your property emerges organically from practice, not declaration.
          *   **Decay Mechanism**: Both lapse, but Status Functions often have institutional inertia; Relational Sustenance decays faster via simple disuse.
      *   *Fit*: **Very Good**, but requires accommodating gradience and informality. Think "Informal, Graded Status Function sustained by practice."

  4.  **Capabilities (Sen/Nussbaum)** (e.g., "being able to participate in community life")
      *   *How yours differs*: Capabilities focus on *freedoms* or *opportunities* an individual has, enabled/disables by social structures. Relational Sustenance *is* the social structure itself – the web of dispositions *is* the property. Capabilities describe what one *can do*; Relational Sustenance describes *what one is (relationally)*.
      *   *Fit*: Good for the "counting as a full adult" aspect (which *is* a capability), less so for the specific "go-to person" role. Capabilities provide the broader context enabling Relational Sustenance.

  5.  **Constitutive Relational Views of Personhood** (e.g., Ubuntu philosophy, certain strands of Hegelianism/Feminist Ethics)
      *   *How yours differs*: These are foundational metaphysical claims: "I am because we are." Relational Sustenance describes *specific, contingent properties* arising *within* that relational field, not the constitution of the self *per se*. It's about roles/statuses, not fundamental identity (though it can impact identity).
      *   *Fit*: Shares the ontological foundation but operates at a different (more specific) level. Your "full adult member" point touches this deeply.

  ### Boundary Cases: Reputation, Debt, Love

  *   **Reputation**: Primarily *epistemic* and *attitudinal*. It tracks beliefs *about* inherent properties or past actions. If ignored, reputation fades (like belief fades), but the *thing it was about* might persist. Relational Sustenance *is* the thing itself, constituted by the practices. Reputation *reflects*; Relational Sustenance *is*. (Weak fit).
  *   **Debt (as a social fact)**: A strong candidate for a Searlean Status Function. It exists *only* because of collective recognition/acceptance of an obligation. It can lapse (statute of limitations, societal collapse). **Differences**: Typically binary (owed/not owed), often formalized/quantified, decay is rule-bound. (Good fit for formal debt, weaker for informal IOUs which lean closer to Relational Sustenance).
  *   **Being Loved**: Complex. The *feeling* might be intrinsic, but its *relational reality* requires expression and reciprocity. If utterly ignored/unreciprocated, the *relational state* of "being loved *by* X" arguably decays/lapses. It's deeply graded and sustained by action. **Differences**: More affective/private, less functional/role-based than your engineer example. However, the mechanism of sustenance is analogous. (Strong fit for the sustenance mechanism, good fit for the "counting as a member" aspect via belonging).

  ### Why "Relational Sustenance" Fits Best
  *   **Relational**: It exists purely in the relationships and dispositions.
  *   **Sustenance**: It requires continuous active maintenance through the practices (routing problems, acknowledgment, deference) of the collective. Cessation causes decay/lapse, not just forgetting.
  *   It inherently accommodates **gradience**.
  *   It highlights the **performative aspect**: The dispositions don't just track the property; they *enact* and *constitute* it ("partly produce it").
  *   It scales from specific roles ("payments person") to fundamental social membership ("full adult").

  ### Edges and Boundary Cases
  *   **Edge: Formal Role vs. Relational Sustenance Role**: "Appointed Payments Team Lead" (formal Status Function, persists on paper during leave) vs. "*The* Go-To Person for Payments" (Relational Sustenance, decays during leave). The former *can* exist without the latter, and vice-versa.
  *   **Edge: Skill vs. Role**: Deep knowledge of the payments code (intrinsic/extrinsic property) vs. being the socially recognized/sustained go-to person (Relational Sustenance). The former might enable the latter but doesn't guarantee it.
  *   **Edge: Temporary Absence vs. Lapse**: How long without interaction does the property lapse? Context-dependent. A week's vacation? Probably persists. A 6-month leave with a new hire solving payments? Likely lapsed.
  *   **Edge: Scaling Down**: Can one person sustain it? Arguably no. It requires a *collective* disposition (a "web"). If only one colleague still routes problems, the property is likely vestigial or gone.
  *   **Edge: Scaling Up**: "Being a recognized expert in the open-source community" fits perfectly – sustained by others' citations, questions, invitations; decays without participation/recognition.

  In essence, **Relational Sustenance** describes properties that are *emergent social facts*, existing solely through continuous collective practice and vanishing when that practice ceases. It's the "dark matter" of organizational and social reality – invisible, non-localized, but structuring interactions. For developer tooling, recognizing this helps design systems that visualize, support, and reinforce these dynamic webs of recognition (e.g., mapping implicit expertise networks, prompting knowledge sharing before decay, onboarding that fosters recognition) rather than treating roles as static attributes.
