prompt: |-
  So I want a case analysis, and I'd rather you be rigorous about the mapping than give me the usual summary of the controversy.

  The episode: the UK's Animal Welfare (Sentience) Bill, autumn 2021. As I have it — correct me if I've got the order wrong — the bill as introduced defined "animal" as vertebrates only, so all invertebrates were out. There was a committee-stage vote in mid-November 2021 where the government whips opposed an amendment that would have brought lobsters, crabs and octopuses in, and the story that came out of it was that ministers planned to boil lobsters alive, which the government then said was nonsense, there was never such a plan. About four days later a government amendment went in adding all decapod crustaceans and all cephalopod molluscs to the definition, right after a government-commissioned review out of LSE reviewed something like 300 studies and concluded those groups should be regarded as sentient. The Act got Royal Assent in spring 2022. What the Act actually does is set up a committee inside an executive agency that can write reports on whether government policy has had all due regard to how it might adversely affect the welfare of animals as sentient beings; the committee makes recommendations, government responds, and the Act explicitly says those recommendations must respect provisions and customs relating to religious rites, cultural traditions and regional heritage. It also doesn't reach policy in devolved areas. Meanwhile cephalopods had already been protected in laboratory research for years, and the practices the review recommended against — eyestalk ablation in shrimp broodstock, declawing, live sale to untrained handlers, boiling without stunning — remained legal. Switzerland banned boiling lobsters alive back in 2018; the UK didn't.

  The lens I want: the precautionary principle applied to animal sentience, in the specific form where the claim is that when there's credible but non-conclusive evidence of sentience in a group, policy should treat that group as sentient rather than wait for certainty. And the distinction I keep needing and don't have a clean name for, so tell me if there is one: sentience being treated as a *status* question — a binary gate, you're in the definition or you're not — versus a *weight* question, where once you're in, how much your welfare counts is supposed to scale with the strength of the evidence and the number and intensity of the experiences. The UK episode looks like it settled status and said nothing at all about weight, and then handed the whole thing to a procedural due-regard mechanism rather than to any substantive prohibition.

  So: run the episode through that lens, both directions. What does the precautionary reading say the actors faced at each decision point, and what should they have done? Then the thing I can't resolve — precaution in this domain seems wildly asymmetric. The cost of over-inclusion is a bit of paperwork for a department; the cost of under-inclusion is possibly the suffering of animals beyond counting. If that's right, precaution always says include, which means it can't explain why the line landed on decapods and cephalopods and not on insects, or on bivalves, or on the specific practices the review flagged. Something else did the discriminating, and I want you to say what it plausibly was — the evidence criteria the review used, the fact that lobsters and octopuses are things people visibly boil and eat, the politics of a news cycle — and whether the precautionary story is a description of the decision or a post-hoc rationalisation of it. Also whether the due-regard design is what precaution actually recommends (cheap insurance, reversible, no veto) or a quiet abandonment of it, and what the cultural-traditions and devolution clauses do to the analysis. And where the weight question bites: the review's own recommendations were about practices affecting millions of farmed and fished crustaceans, while the number of octopuses in UK jurisdiction is trivial — did the episode buy status for a charismatic handful and effectively nothing for the population that matters?

  Finish by telling me what the case does to the theory. Confirmation, anomaly, or a situation it never anticipated — and if you think some other framing handles it better, say which and why, but don't just swap in a label and stop.
