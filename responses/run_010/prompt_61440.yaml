prompt: |-
  I run a three-person analytics team inside a regional health system — me, one MPH who's had maybe a semester of micro, and a data engineer. Roughly once a month somebody from the clinical side or the ops side brings us a proposal that leans on an inference from what patients chose to what patients want, and often one step further, to what would make them better off. "Interpreter uptake is under five percent of eligible visits, so patients obviously don't want it." "Sixty-eight percent of the people offered a telehealth follow-up picked telehealth again next time, so that's their preference." Up to now the most rigorous thing anyone on my team has been able to say is "hmm, not sure that follows," and I'm increasingly worried we're being used to give a quantitative-looking seal of approval to decisions that were already made.

  I want you to write us a decision procedure we can actually run on a proposal in about two hours, grounded in what revealed preference theory genuinely licenses — and I mean genuinely licenses, not the pop version where "choice reveals preference" is waved around like it's an empirical discovery rather than partly a way of defining the term. Be explicit that there are two seperate jumps, choice → preference and preference → good-for-the-person, and build the procedure so those two are never collapsed into one step, because I'm pretty sure that's where most of what crosses my desk goes wrong. Include whatever the consistency machinery (the weak/generalized axioms, the rationalizability results in the Afriat line) can and cannot buy you, and be straight with me about the fact that "this data is consistent with utility maximization" is often a near-empty claim — I want the procedure to know when consistency is informative and when it isn't.

  Constraints and format:

  - Questions in order, with what counts as a sufficient answer to each, and what evidence would satisfy it. Not a list of considerations, a sequence.
  - Mark the exits clearly: where the procedure stops with a no, where it stops with "we cannot tell from this data and here's what data would settle it," and where it hands the thing to the committee because what's left is a values question and not a factual one. The final output gets read by a committee that includes a physician and a patient representative, so the write-up has to be legible to people who will never see a subscript.
  - Our data is almost all administrative EHR and scheduling data. No price variation, no meaningful budget sets, almost nothing randomized, occasionally a real A/B test if someone in digital has been feeling ambitious. Most of the textbook tests assume you can vary prices or budgets and watch the choice flip. Tell me what the fallback is when you can't, and how much weaker it is. Don't quietly pretend the fallback is as good.
  - We also sometimes have patient-reported experience scores and, for a couple of services, repeated symptom ratings over time. Build in somewhere for the question of when reported experience can override or supplement choice data — and handle the obvious traps, like the fact that what people retrospectively rate an episode as having been like is not the same thing as how the episode went, including the peak-end and duration stuff. If you think those traps are overblown, say so and say why.
  - Flag every step that is a judgment call wearing a procedure costume. I'd rather have five honest hand-waving points than twenty fake-precise ones.
  - End with a short section on what the procedure could never deliver no matter how good our data got — the ceiling, not the current shortfall. I want to be able to say no to a request on principled grounds instead of just "not with what we have."

  Then run the whole procedure, step by step and not just the conclusion, on three live cases:

  1. Ops wants to cut the in-person interpreter service to on-demand video only, on the grounds that among patients flagged as limited-English-proficient, fewer than five percent of visits actually used an interpreter even though one was offered and funded.
  2. A program director wants to expand telehealth follow-ups for a chronic-condition clinic, citing that 68% of patients who were offered a telehealth slot chose a telehealth slot again at their next follow-up.
  3. The one I'm braced for: my own team's flagship metric. We rank clinics by the share of patients who re-book with the same clinician at their next visit, and we've been telling the board for two years that this is a revealed-preference measure of how much patients value continuity. If the procedure kills it, kill it and tell me exactly which step it dies at.

  Two pages maximum for the thing the analysts actually use, with as long an appendix as you need explaining why each test is in there and what it's guarding against.
reasoning: |-
  We are designing a decision procedure for evaluating claims that move from observed choices to inferred preferences to welfare conclusions. The procedure is grounded in revealed preference theory and acknowledges its limitations. We break down the analysis into two distinct steps: (1) From choice to preference, and (2) From preference to welfare. The procedure is a sequence of questions, each with clear exit points and requirements for evidence.

  **Decision Procedure: Evaluating Claims from Choice Data**

  **Step 1: Clarify the Choice Set and Constraints**
     - Question: What were the exact alternatives available to the patient at the time of choice? What constraints (time, information, access, etc.) were binding?
     - Sufficient Answer: A clear description of the menu of options and the constraints (including any barriers) that might have affected the choice.
     - Evidence: Documentation of the options presented (e.g., in the EHR) and any data on constraints (e.g., wait times, transportation issues, technology access). If constraints are not documented, we must note this as a gap.
     - Exit: If the choice set is not well-defined or constraints are unknown and potentially significant, stop and report: "We cannot infer preferences because the choice environment is not sufficiently known. We would need data on [specific constraints]."
     - Judgment Call: Assessing the significance of unobserved constraints (e.g., did patients know about the interpreter service?).

  **Step 2: Check for Basic Consistency (Weak Axiom of Revealed Preference - WARP)**
     - Question: If the same patient (or a group of similar patients) faced the same choice set multiple times, did they make consistent choices?
     - Sufficient Answer: Either (a) We observe repeated choices and they are consistent (i.e., if A is chosen when B is available, then B is never chosen when A is available in the same set) or (b) We have only one observation per patient, so we cannot check WARP at the individual level, but we can look for patterns across similar patients (though this is weaker).
     - Evidence: For repeated choices by the same patient (e.g., multiple follow-up visits), we can check consistency. If not, we can aggregate across patients with similar characteristics and similar choice sets (but note: aggregation masks heterogeneity).
     - Exit: If choices are inconsistent (e.g., a patient chooses A over B in one instance and B over A in another with the same set), stop and report: "Choices are inconsistent, so we cannot infer a stable preference. We would need to understand the source of inconsistency (e.g., changing circumstances)."
     - If no repeated choices and aggregation is not possible or shows noise, stop: "Insufficient data to check consistency. We would need repeated choice data."
     - Judgment Call: Deciding what counts as "similar" patients for aggregation and what level of inconsistency is too high.

  **Step 3: Assess Rationalizability (Afriat's Theorem and Generalizations)**
     - Question: Could the observed choices be generated by a utility-maximizing patient? (This is the minimal requirement for revealed preference.)
     - Sufficient Answer: We can construct a utility function that rationalizes the choices (i.e., for every choice, the chosen option has higher utility than the alternatives available at the time). 
     - Evidence: We typically need variation in choice sets (e.g., different patients facing different menus). Without price variation, we rely on natural variation in the available options (e.g., some patients were offered in-person vs. telehealth on different days). If the choice set is always the same (e.g., always {in-person, telehealth}), then any choice pattern is rationalizable (because we can just assign higher utility to whatever was chosen). 
     - Fallback without variation: If we only observe one choice set per patient and no variation, then every choice pattern is rationalizable. We cannot reject utility maximization, but we also learn nothing about preferences (because any utility function that assigns the highest utility to the chosen option in that set works). This is the near-empty claim.
     - Exit: If there is variation and the data fails the Generalized Axiom of Revealed Preference (GARP), stop: "Choices are not rationalizable by a stable utility function. We cannot infer preferences without further investigation (e.g., into why choices violate GARP)." If there is no variation, note: "Without variation in choice sets, we cannot test rationalizability. The claim that choices reveal preferences is untestable with this data."
     - Judgment Call: Deciding what constitutes meaningful variation and how to handle missing data in the variation.

  **Step 4: From Preference to Welfare - The Bridge**
     - Question: Even if we can infer a preference (i.e., a utility function) from choices, what justifies the step to "this choice made the patient better off"?
     - Sufficient Answer: We must consider two aspects:
          (a) Was the choice made under conditions that allow for welfare-relevant preferences (e.g., adequate information, no severe cognitive biases, no coercion)? 
          (b) Is the inferred preference aligned with the patient's well-being? (Note: This is a deep philosophical issue, but we can use some operational criteria.)
     - Evidence: 
          - For (a): Data on information provision (e.g., was the patient fully informed about the consequences of each option?), cognitive state (e.g., was the patient in pain or distressed?), and autonomy (e.g., was there pressure from staff?).
          - For (b): We might use longitudinal data on health outcomes or patient-reported well-being. However, note: if the patient's choice was based on preferences that do not align with their own well-being (e.g., due to present bias or misinformation), then we cannot equate preference satisfaction with welfare.
     - Exit: If the choice conditions are poor (e.g., lack of information, high stress) and we have no outcome data, stop: "Even if choices reveal preferences, we cannot conclude that acting on these preferences improves welfare without evidence that the choice conditions were adequate and the preferences align with well-being. We would need [specific data]."
          If we have outcome data, we can proceed to Step 5.
     - Judgment Call: Assessing the quality of the choice environment (e.g., what counts as "adequate" information?).

  **Step 5: Using Outcome Data to Supplement or Override Choice**
     - Question: When outcome data (e.g., symptom ratings, experience scores) is available, does it support the claim that the chosen option led to better outcomes?
     - Sufficient Answer: We compare outcomes for patients who chose different options, but we must adjust for selection bias (since patients who choose A might be systematically different from those who choose B).
     - Evidence: 
          - If we have randomized assignment (even partial), we can use that to estimate causal effects. 
          - Without randomization, we can use methods like regression adjustment or matching on observables (but note: we might not observe all confounders).
          - We also must be cautious about patient-reported experience: retrospective ratings can be biased (e.g., peak-end effect). We should prefer real-time or frequent measurements over retrospective ones.
     - Exit: If outcome data shows that the chosen option leads to worse outcomes (after accounting for selection), stop: "The choice does not lead to better outcomes, so we cannot assume it improves welfare." If outcome data is consistent with the choice, we can note: "Outcome data does not contradict the welfare claim, but this is not conclusive without a causal design."
          If we lack outcome data or it is unreliable, stop: "Without outcome data, we cannot verify if the choice improved welfare."
     - Judgment Call: Deciding what level of adjustment for confounders is sufficient and how to handle biases in self-reports.

  **Step 6: The Values Question**
     - If we have passed Steps 1-5 and have evidence that (a) choices reveal preferences and (b) acting on these preferences leads to better outcomes, then we can support the claim that the choice is welfare-improving. However, note that even then, there may be distributional or ethical considerations (e.g., is it fair to cut a service that a minority uses?).
     - Exit: At this point, the question becomes one for the committee: "The data supports that the choice reflects patient preferences and is associated with better outcomes, but the final decision must weigh these findings against other values (e.g., equity, access for vulnerable groups)."

  **Ceiling of the Procedure**
  Even with perfect data, we cannot:
     - Prove that a preference is "true" or "rational" in an absolute sense; we can only show consistency with utility maximization.
     - Resolve the fundamental philosophical question of whether satisfying preferences (even informed, consistent ones) is equivalent to welfare without making value judgments.
     - Overcome the problem of interdependent preferences or externalities (e.g., if one patient's choice affects another's well-being).

  ---

  **Running the Procedure on the Three Cases**

  **Case 1: Interpreter Uptake <5% → Patients don't want it?**
     - Step 1: Choice set: {use interpreter, do not use interpreter}. Constraints: Was the offer clear? Were there barriers (e.g., stigma, wait time, technical issues)? Without data, we note: the choice environment is unclear.
          Exit: Stop at Step 1. "We cannot infer preferences because we lack data on constraints and barriers. We would need patient surveys about why they declined."
     - Even if we proceed: 
          Step 2: We don't have repeated choices by the same patient (one visit at a time). Aggregation: 95% choose not to use. But note: this is not repeated so we cannot check WARP at the individual level. 
          Step 3: Without variation in the choice set, we cannot test rationalizability. The low uptake is consistent with many utility functions (e.g., patients don't value the service, or they face barriers). 
          Step 4: Even if we infer a preference against using the interpreter, we must ask: was this choice made with full information and without stigma? Without that, we cannot equate to welfare. 
          Step 5: Outcome data? If patients who decline interpreters have worse outcomes (e.g., misunderstanding treatment plans), that would contradict the welfare claim. 
          Conclusion: The claim fails at Step 1.

  **Case 2: 68% chose telehealth again → Preference for telehealth?**
     - Step 1: Choice set: {telehealth, in-person} at follow-up. Constraints: Could include travel burden, internet access, etc. We need to know if these were constant.
     - Step 2: We have repeated choices (at least two follow-ups). We can check: For the 68% who chose telehealth again, that's consistent. But what about the 32%? If some switched from telehealth to in-person, that might violate WARP? Actually, no: if the choice sets are the same, switching is allowed if preferences change. Without knowing why they switched, we cannot call it a violation. But note: we don't have the same choice set each time (e.g., health status might change). This is messy.
          Better: Look at the same patient over multiple visits. If a patient chooses telehealth when in-person is available, then later chooses in-person when telehealth is available (and nothing else changes), that violates WARP. We don't have that level of data? 
          We can aggregate: 68% consistency is high, but individual-level data might show switching. Without individual sequences, we cannot check WARP per patient. 
          Judgment: We might accept the aggregate as suggestive but not definitive.
     - Step 3: Without variation in choice sets (everyone is offered both?), we cannot test rationalizability. The 68% figure is consistent with many utility functions (e.g., 68% prefer telehealth, 32% prefer in-person). 
     - Step 4: Were conditions adequate? E.g., did patients know the trade-offs? Without data, we don't know.
     - Step 5: Outcome data? If telehealth patients have similar or better health outcomes, that supports welfare. But without randomization, selection bias: healthier patients might choose telehealth. We need to adjust for health status at baseline. 
          If we have symptom ratings, we can compare. But note: telehealth might be chosen for convenience even if outcomes are worse? 
          Exit: Without outcome data and without knowing choice conditions, we cannot conclude welfare. Stop at Step 4 or 5: "We can say that a majority of patients who chose telehealth once chose it again, but we cannot infer a general preference or welfare gain without more data on outcomes and choice conditions."

  **Case 3: Re-booking with same clinician → Value continuity?**
     - Step 1: Choice set: {book with same clinician, book with different clinician, or not book}. Constraints: Availability of the same clinician? If the same clinician is not available, then the patient didn't really choose to leave. We must adjust for availability. 
          Evidence: We have scheduling data. We should only consider patients for whom the same clinician was available at the time of booking. If not available, that's a constraint. 
          Currently, our metric does not account for this. 
          Exit: Without data on clinician availability, we cannot define the choice set. Stop at Step 1: "We cannot infer a preference for continuity without knowing if the same clinician was available."
     - If we fix that: 
          Step 2: We have repeated choices? Not exactly: one booking per visit. But over multiple visits, we can see if a patient consistently re-books with the same clinician when available. 
          Step 3: Without variation in choice sets (if the same clinician is always available and the patient always chooses them), that is rationalizable. But note: if a patient sometimes chooses a different clinician when the same is available, that would be inconsistent. We must check individual sequences. 
          Step 4: Choice conditions: Did the patient know the alternatives? Were they pressured? Without data, we assume adequate. 
          Step 5: Outcome data: Do patients who re-book with the same clinician have better outcomes? We might compare their health outcomes to those who switch (adjusting for health status). If yes, that supports welfare. If not, it might be that continuity doesn't improve outcomes or that switching is due to dissatisfaction. 
          But note: the outcome of interest might be patient satisfaction, not health. We might have experience scores. 
          However, the claim is about "valuing continuity" — which is about preference. The welfare step requires that acting on this preference leads to better outcomes. 
          Conclusion: The main flaw is at Step 1 (availability). If fixed, we can infer a preference for continuity for those who consistently choose the same clinician when available. But we cannot say that patients who did not re-book don't value continuity — they might not have had the option. 
          Also, without outcome data, we cannot conclude welfare. 

  Given the two-page limit, the above is a condensed version. The appendix would elaborate on the theoretical underpinnings and practical challenges of each step.
answer: |-
  ### **Revealed Preference Decision Procedure for Health System Analytics**

  **Purpose**: Evaluate claims that move from observed choices to patient preferences to welfare conclusions. Two distinct steps: (1) Choice → Preference, (2) Preference → Welfare. Fails if steps are conflated.

  ---

  #### **Step 1: Define the Choice Set & Constraints**  
  **Question**: *What were the feasible options, and what constraints (time, information, access, cognitive load) shaped the choice?*  
  - **Sufficient Answer**: Documented evidence of the exact menu of options presented to patients and material barriers (e.g., interpreter offered via kiosk, but patient wasn’t tech-literate).  
  - **Evidence Required**: EHR/scheduling logs showing offered options; patient surveys on barriers (if lacking, note gap).  
  - **Exit If**: Choice set is undefined or constraints are unmeasured but likely significant → **Stop. "Cannot infer preference; collect data on constraints (e.g., patient surveys)."**  
  - **Judgment Call**: Assessing whether unobserved barriers (e.g., stigma, confusion) materially distorted choice.

  #### **Step 2: Test for Internal Consistency**  
  **Question**: *Are choices consistent across similar decision points?*  
  - **Sufficient Answer**: Individual-level repeated choices align with Weak Axiom of Revealed Preference (WARP). If no repeats, aggregate patterns show stability (e.g., >70% same choice).  
  - **Evidence Required**: Repeated observations per patient (e.g., follow-up visits) or homogeneous patient groups.  
  - **Exit If**:  
    - Individual choices violate WARP (e.g., patient picks telehealth, then in-person when both available) → **Stop. "Inconsistent choices; preferences unclear."**  
    - Single-choice/no variation → **Stop. "Consistency untestable; cannot infer stable preference."**  
  - **Judgment Call**: Defining "similar" patients for aggregation; tolerating noise in EHR data.

  #### **Step 3: Assess Rationalizability**  
  **Question**: *Could choices be explained by *any* utility function? (Afriat’s Test)*  
  - **Sufficient Answer**: Choices satisfy Generalized Axiom of Revealed Preference (GARP) *if* choice sets vary. If sets are identical, rationalizability is trivial (any choice is "rational").  
  - **Evidence Required**: Variation in options (e.g., some patients offered video interpreter, others in-person). EHR data often lacks this.  
  - **Fallback Without Variation**:  
    - **If choice sets identical**: Rationalizability is near-empty → **"Choices are rationalizable but uninformative; cannot distinguish preferences."**  
    - **If minimal variation (e.g., time/location)**: Test GARP; failure implies irrationality.  
  - **Exit If**: GARP violated → **Stop. "Choices not rationalizable; investigate anomalies."**  
  - **Judgment Call**: Whether observed variation (e.g., clinic location) is exogeneous.

  #### **Step 4: Preference → Welfare Bridge**  
  **Question**: *Do preferences align with patient well-being under the choice conditions?*  
  - **Sufficient Answer**: Evidence that choices were informed, autonomous, and cognitively unconstrained.  
  - **Evidence Required**:  
    - Patient-reported understanding (e.g., "I knew telehealth was an option") or outcome data (Step 5).  
    - If lacking, assume *neutral conditions* (no evidence of coercion/ignorance).  
  - **Exit If**: Evidence of coercion, misinformation, or acute distress → **Stop. "Preference ≠ welfare; improve decision context."**  
  - **Judgment Call**: Weighing severity of choice constraints (e.g., was pain distorting?).

  #### **Step 5: Validate with Outcome Data**  
  **Question**: *Do choices correlate with better outcomes, and can we trust retrospective reports?*  
  - **Sufficient Answer**:  
    - Outcomes: Longitudinal data (e.g., symptom scores) show chosen option improves health/experience vs. alternatives.  
    - Experience Scores: Use real-time/frequent measures (e.g., post-visit surveys), not retrospective recalls (prone to peak-end bias).  
  - **Evidence Required**: Adjust for selection bias (e.g., healthier patients choose telehealth) via regression/matching.  
  - **Exit If**:  
    - Chosen option linked to worse outcomes → **"Choice harms welfare despite preference."**  
    - No outcome data → **"Welfare claim unsupported; collect outcomes (e.g., symptom trajectories)."**  
  - **Judgment Call**: Handling residual confounding; discounting retrospective scores.

  #### **Step 6: Committee Handoff**  
  **If all prior steps pass**: "Data supports preference inference and welfare link."  
  **But**: Equity, ethics, or access concerns (e.g., cutting a minority-used service) → **"Referred to committee: values decision."**

  ---

  ### **Ceiling of the Procedure**  
  Even with perfect data:  
  1. **Preferences ≠ welfare**: Patients may choose against their best interests (e.g., present bias).  
  2. **Aggregation hides heterogeneity**: Averages mask vulnerable subgroups.  
  3. **No cardinal utility**: We can’t measure "how much" better off someone is.  
  4. **Social welfare tradeoffs**: Equity vs. efficiency requires normative judgment.

  ---

  ### **Case Applications**  

  #### **1. Interpreter Uptake <5% → "Patients don’t want it"**  
  - **Step 1**: Choice set: {Use interpreter, decline}. Constraints? EHR shows offer was made, but no data on stigma/tech barriers. → **Insufficient. Stop.**  
    - *Exit Message*: "Cannot infer preference; survey patients on *why* they declined (e.g., fear, inconvenience)."  
  - **Step 3 (if forced)**: Identical choice sets → Rationalizability trivial. Low uptake ≠ preference (e.g., could be avoidance due to stigma).  
  - **Welfare Implication**: Cutting service could harm LEP patients even if unused. Outcome data (e.g., error rates in care) needed.  

  #### **2. 68% Re-Choose Telehealth → "Patients prefer telehealth"**  
  - **Step 1**: Choice set: {Telehealth, in-person}. Constraints? Travel burden/tech access unmeasured. → **Proceed cautiously**.  
  - **Step 2**: 68% consistent at individual level (repeated choices). 32% switched → No WARP violation if choice sets changed (e.g., new symptoms). → **Pass**.  
  - **Step 3**: Minimal variation (all offered same). → **"Rationalizable but uninformative; could reflect habit, not preference."**  
  - **Step 4/5**: No data on choice autonomy or outcomes (e.g., did telehealth worsen control?). → **"Welfare claim unsupported; track condition stability by visit type."**  
  - **Verdict**: Supports *aggregate* pattern but not expansion justification. Needs outcomes.  

  #### **3. Re-Booking Same Clinician → "Patients value continuity"**  
  - **Step 1**: Choice set undefined. EHR shows re-booking, but not if same clinician was *available*. → **Insufficient. Stop.**  
    - *Exit Message*: "Metric confounds preference with access. Only count choices where same clinician was available and bookable."  
  - **Step 2 (if fixed)**: If a patient re-books same clinician when available but switches when unavailable, consistent. If switches when available, fails WARP.  
  - **Step 5**: Continuity’s link to outcomes (e.g., trust, adherence) must be tested → **"Without outcome data, welfare claim invalid."**  
  - **Verdict**: **Metric dies at Step 1**. Redesign with availability data; add outcome correlation (e.g., HbA1c trends).

  ---

  **Appendix Key Points**  
  - **Why WARP?** Guards against attributing noise/context to "preference."  
  - **Why Afriat?** Without price/budget variation, GARP tests are weak; positive tests rarely informative.  
  - **Outcome Data Trap**: Retrospective experience scores overemphasize recent events; prefer real-time data.  
  - **Judgment Transparency**: Steps 1, 4, and 5 rely on subjective thresholds; document assumptions.  

  **Output**: One-page flowchart for analysts; detailed appendix with theory/rationale. Final committee report uses non-technical language (e.g., "choices were consistent" vs. "WARP satisfied").
