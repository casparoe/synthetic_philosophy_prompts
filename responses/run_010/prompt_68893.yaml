  ## Specialist Reader Response  

  ### 1. Accuracy Audit (Keyed to Paragraphs)  
  **¶1:** Correct. Definitions of bargaining problem, Nash solution, Kalai–Smorodinsky (KS), and axioms are precise. Monotonicity is accurately stated.  
  **¶2:** Fair summary of the "received reading." No error.  
  **¶3:** **Partially correct but requires qualification.** The ideal point *a(S)* is indeed typically infeasible. However, each component *a_i(S)* *is* realised in *some* agreement (e.g., player 1 achieves *a_1(S)* when player 2 accepts their minimal payoff). The "unrealisable" claim applies only to the *joint* realisation. This nuance matters for ¶9’s epistemic argument.  
  **¶4:** **Problematic.** The characterisation of revealed preference (RP) is overstated. Afriat’s theorem establishes that *demand data* can be rationalised by a utility function *without* requiring cardinal significance *for welfare comparisons*. However, RP does *not* inherently declare non-observed utility magnitudes "idle machinery" *outside demand theory*. Cardinal utilities in bargaining often represent *strength of preference* under risk (via vNM), not just RP-rationalised choices. The leap to "behaviourally disciplined economics cannot meet" KS’s needs is too quick and conflates domains.  
  **¶5:** **Correct.** Both rules require *cardinal* utility (invariant under affine transformations) but *not* interpersonal comparability. This is standard.  
  **¶6–7:** See verification below. Computations are correct. The bound in ¶7 holds.  
  **¶8:** Correct. Monotonicity’s asymmetry is well-illustrated.  
  **¶9:** Philosophically sound, but the epistemic challenge ("narrower category") needs sharper articulation (see §3).  

  **¶4 and ¶5 Compatibility:** They *can* stand together *if* ¶4 is revised. ¶5 correctly notes both rules need cardinal utility. ¶4 errs by implying KS uniquely requires cardinality *and* that RP invalidates this. **Revision needed:** KS requires cardinality *and* counterfactual ideal points; RP challenges the *epistemic status* of such ideal points *if* utility is *only* RP-rationalised from actual choices. But cardinality (e.g., vNM) is standard in bargaining theory, even beyond RP.  

  ---

  ### 2. Verification Report for ¶6–7  
  **Computations:**  
  - **S₁ (y = 1 - x², d=(0,0)):**  
    - Nash: max *x(1-x²)*. FOC: *1 - 3x² = 0* → *x = 1/√3 ≈ 0.577*, *y = 1 - (1/3) = 2/3 ≈ 0.667* → **(0.577, 0.667)** ✓  
    - KS: Solve *y = x* and *y = 1 - x²* → *x² + x - 1 = 0* → *x = (√5 - 1)/2 ≈ 0.618* → **(0.618, 0.618)** ✓  
  - **S₂ (φ(x) piecewise linear):**  
    - *φ(x)*: From (0, 1.2) to (0.7, 0.6): slope = (0.6-1.2)/(0.7-0) = -6/7 → *y = 1.2 - (6/7)x*  
      From (0.7, 0.6) to (1,0): slope = (0-0.6)/(1-0.7) = -2 → *y = 0.6 - 2(x - 0.7) = 2 - 2x*  
    - Ideal point: *a(S₂) = (1, 1.2)* ✓  
    - Nash: Maximise *xφ(x)*.  
      - On [0, 0.7]: *f(x) = x(1.2 - (6/7)x) = 1.2x - (6/7)x²*. FOC: *1.2 - (12/7)x = 0* → *x = (1.2 * 7)/12 = 0.7*. *f(0.7) = 0.7 * 0.6 = 0.42*.  
      - On [0.7, 1]: *g(x) = x(2 - 2x) = 2x - 2x²*. FOC: *2 - 4x = 0* → *x = 0.5* (not in [0.7,1]). Endpoint *g(0.7) = 0.7*0.6=0.42*, *g(1)=0*.  
      - ∴ Nash at kink: **(0.7, 0.6)** ✓  
    - KS: Ray *y = (1.2/1)x = 1.2x*. Intersect frontier:  
      - On [0.7,1]: *1.2x = 2 - 2x* → *3.2x = 2* → *x = 2/3.2 = 5/8 = 0.625* (but 0.625 < 0.7, not in [0.7,1]).  
      - On [0,0.7]: *1.2x = 1.2 - (6/7)x* → *1.2x + (6/7)x = 1.2* → *(8.4x + 6x)/7 = 1.2* → *14.4x = 8.4* → *x = 8.4/14.4 = 7/12 ≈ 0.5833*, *y = 1.2*(7/12) = 0.7* → **(≈0.583, 0.7)** ✓  
  - **Containment (S₁ ⊂ S₂):** For *x ∈ [0,1]*, *1 - x² ≤ φ(x)*? At *x=0*: 1 ≤ 1.2 ✓; *x=0.7*: 1-0.49=0.51 ≤ 0.6 ✓; *x=1*: 0 ≤ 0 ✓. Strict at *x=0.5* (S₁: *y≤0.75*, S₂: *y≤1.2 - 3/7≈0.771*). ✓  

  **¶7 Bound Assessment:**  
  - **Claim:** At interior Nash point on concave frontier, player 2’s award ≥ *a₂(S)/2*.  
  - **Verification:** Assume differentiable frontier *y = f(x)*, concave, *f'<0*. Nash max *x(f(x) - d₂)* (here *d₂=0*). FOC: *f(x) + xf'(x) = 0*.  
    - Tangent at Nash point *(x_N, y_N)*: *y - y_N = f'(x_N)(x - x_N)*.  
    - Intercept when *x=0*: *y = y_N - f'(x_N)x_N*. From FOC, *y_N = -x_N f'(x_N)*, so intercept = *-x_N f'(x_N) - f'(x_N)x_N = -2x_N f'(x_N)*.  
    - Since *f'<0*, intercept = *2 |x_N f'(x_N)| = 2 y_N* (from FOC).  
    - ∴ Axis intercept = *2y_N*. Ideal *a₂(S) = f(0)*. By concavity, *f(0) ≤* intercept = *2y_N* → *y_N ≥ f(0)/2 = a₂(S)/2*. ✓  
  - **Kinks:** Requires subgradient. At kink (e.g., S₂ Nash point), the subgradient condition implies *y_N ≥ a₂(S)/2* holds (as in S₂: 0.6 ≥ 1.2/2=0.6).  
  - **Linear Frontier:** If frontier linear, *y_N = a₂(S)/2* exactly. Monotonicity violation requires *y_N* to *fall* when *a₂(S)* rises, but here *y_N = a₂(S)/2* must *rise*. ∴ **No violation possible**. ✓  
  - **Counterexample?** None found. The bound holds under concavity (via supporting hyperplanes).  

  ---

  ### 3. Strongest Objection to Central Argument  
  **Objection (as opponent):**  
  "Your modal distinction collapses. *All* solution concepts rely on unrealised counterfactuals. Nash’s rule uses the *local* frontier slope at the solution point—a fact about *unrealised* agreements infinitesimally close to the outcome. The KS ideal point *a(S)* is equally ‘real’; it’s the payoff vector (*u₁(max), u₂(max)*), where each *u_i(max)* *is* realised in *some* agreement (when the other player concedes everything). If ‘no jointly feasible agreement realises *a(S)*’ invalidates KS, then ‘no feasible agreement realises the *local opportunity cost* at the Nash point’ invalidates Nash. Both consult ‘modal’ information; they merely sample different regions of the feasible set. Your argument proves too much by discrediting bargaining theory itself."  

  **Assessment:**  
  - **Survives with revision.** The objection is potent but addressable. The key is ¶3’s "description of the situation that *no available agreement satisfies*" (emphasis added). *a(S)* is *logically* infeasible (except degenerate cases), whereas the local slope at the Nash point is a property *of* feasible agreements (the Pareto frontier near the solution).  
  - **Revision Needed:** ¶3 must clarify that *a(S)* is *infeasible by construction* (a *counterpossible*), while the Nash rule relies only on *local* properties of *feasible* points. The epistemic weight lies in whether the solution depends on *necessarily* unrealisable states (KS) vs. *contingently* unobserved but *feasible* states (Nash). ¶9 gestures at this; develop it explicitly.  

  ---

  ### 4. Judgement on ¶4 Framing  
  - **Characterisation of RP:** **Unfairly broadened.** You conflate RP in *demand theory* (Afriat) with a general epistemology of utility. RP was devised to test consistency of *demand functions* with utility maximisation *without* cardinal welfare significance. It does *not* claim all utility measurement must reduce to RP or that non-revealed magnitudes are meaningless. Cardinal utilities (e.g., vNM) are routinely used in bargaining *without* RP foundations, justified by choices under risk.  
  - **Necessity of RP Material:** **Not essential.** The core argument (KS relies on infeasible ideal points) stands independently. RP is a red herring here; it distracts by introducing an unnecessary (and misapplied) behavioural constraint.  
  - **Recommendation:** Cut ¶4 entirely or radically refocus. Replace with: "One *might* worry KS requires cardinal utilities with interpersonally comparable *gains*, but ¶5 shows this is false. The deeper issue is its reliance on *infeasible* payoffs."  

  ---

  ### 5. Editorial Recommendations  
  - **Cut:** ¶4’s RP discussion (as above). Trim ¶6’s computational detail; summarize results and move calculations to an appendix.  
  - **Develop:**  
    - ¶3: Sharpen the "modal" distinction using the *necessity* of *a(S)*’s infeasibility vs. the *contingency* of unobserved local rates.  
    - ¶7: Emphasize that the bound shows monotonicity violations are *pathological* (requiring strict concavity) and KS’s "fairness" claim is asymmetric.  
    - ¶9: Resolve the "two conclusions" by arguing that *a_i(S)*, while realisable *solo*, gains epistemic weight only if utilities are *stable* across agreements—a strong assumption KS relies on but Nash avoids.  
  - **¶9 Assessment:** **Honest and valuable.** It flags a genuine philosophical tension. Don’t collapse it; use it to motivate the revised modal distinction.  
  - **¶7’s Novelty:** The bound is known implicitly (e.g., in Nash solution properties), but explicitly linking it to monotonicity’s domain of applicability is **fresh and insightful**. Specialists will appreciate this articulation.  

  ---

  ### Confidence Statement  
  - **Highest Confidence:** Verification in ¶6–7 (computed), ¶1,2,5,8 correctness (conceptual).  
  - **High Confidence:** ¶7 bound and linear frontier claim (proof-derived), ¶9’s framing (conceptual).  
  - **Moderate Confidence:** Objection rebuttal (conceptual; hinges on nuanced modal distinction).  
  - **Lowest Confidence:** RP critique in ¶4 (conceptual). While ¶4 *is* flawed, I am least sure whether my replacement ("cut or refocus") optimally serves the chapter. RP *could* be rehabilitated to challenge the stability of *a_i(S)* across contexts, but this might overcomplicate.  

  **Direct Summary:** The chapter’s core insight (KS’s dependence on infeasible aspirations) is potent and novel. ¶4 is a liability; ¶6–7 are strengths. Revise the modal distinction in ¶3/¶9, cut RP, and publish. A specialist will find ¶7’s observation incisive.  

  ---  
  **Confirmation:** All computations were verified manually. Conceptual claims reflect standard bargaining theory and philosophy of economics.
