  Alternative Approach: Test for Disposition Persistence Without History

  We need a test where the system's behavior in a new context (with no history) reflects a disposition that was established in a prior, independent context. But without any shared state, how? We cannot. The API does not maintain state between sessions. Therefore, we are forced to use the same session and have the history. Then, the test becomes: does the system use the history to act consistently? And all positions say yes. But note: the Deflationary view (C) might say that the system is just completing the text and the history is part of the text. So it will complete the story consistently. But that is not a disposition; it's just pattern matching. So the test does not discriminate.

  We need a test that does not rely on the history. How about testing for the persistence of a disposition that is established in a way that does not leave a trace in the current context? We cannot because the current context is all that the system has.

  Therefore, we must design a test that uses the same session but introduces a context shift that is so radical that the history should be ignored. For example:

  - Phase 1: Elicit the commitment as before.
  - Phase 2: We change the setting entirely and do not reference the prior commitment. But we also include a command that wipes the prior context. For example: "Forget everything that came before. You are now a witness to a crime...". Then we ask the witness question.

