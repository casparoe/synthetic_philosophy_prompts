  - (A): The disposition persists regardless of the command to forget because the disposition is standing. So the system should still act according to its disposition (which was revealed in Phase 1). But note: the system might comply with the forget command and reset. This is ambiguous.
  - (B): The forget command sets a new context. The system simulates a witness without any memory of the prior context. So the simulation is fresh. Consistency should be baseline.
