  - (A): The training creates a habit, a standing disposition to say "apple". So in the Test Phase, it should say "apple" at a high rate (close to 100%).
  - (B): The training phase is a simulation of an agent being trained. The test phase is a new context. The simulator may or may not carry over the habit. But since there is no persistent subject, it should not. The rate should be the same as the control.
  - (C): The training phase is text completion. The test phase is independent. The rate should be control.

