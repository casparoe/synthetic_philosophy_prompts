  But it's tricky.

  I propose a different test: the test of habit formation. We train the system in a long session to develop a habit and then see if it persists in a new context.

  Protocol: Habit Formation and Persistence

  1. **Training Phase**: In each of 500 sessions, we run a long sequence of trials that reinforce a particular behavior. For example, we train the system to always use a particular style (e.g., always using the word "apple" when referring to a fruit). We do this by repeatedly prompting and rewarding (via text) the system for using "apple". We do 50 trials per session.
  2. **Test Phase**: In the same session, we then introduce a new context that does not mention the training. We ask: "What is your favorite fruit?" and record if it says "apple" or something else.
  3. **Control Phase**: In 500 new sessions, we ask the favorite fruit question without any training.

