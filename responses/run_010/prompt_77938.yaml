prompt: |-
  I serve on the animal-welfare committee of a company that farms crickets and black soldier fly larvae for feed, and for two years I have been applying a rule of thumb I have never managed to justify. I would like to know what it commits me to, and which of my verdicts it cannot keep.

  The rule of thumb, which I will call the one-ledger rule: an organism's experience carries moral weight in proportion to the degree to which its states are pooled into a single running account — one place where a present harm can be weighed against a remembered or anticipated good, and where behaviour is steered by that pooling rather than locally, event by event. More pooling, more weight; no pooling, no weight.

  My verdicts:

  1. Dog — full weight, uncontroversially.
  2. Laying hen confined for a laying cycle — full weight; and what I object to is not the crampedness as such but the frustration of behaviour that presupposes memory and planning: nest-site selection, recognition of individuals, the ordering of a day.
  3. Adult octopus — full weight, though uneasily. Most of its neurons lie in the arms, and the arms solve problems locally. If pooling is the criterion, this may be several partial ledgers rather than one large one; I give it full weight regardless.
  4. Honeybee — small but nonzero weight. I would accept a modest cost to avoid large-scale bee suffering.
  5. Adult cricket — less than a bee, on the grounds that the bee's model of its world is more elaborate. I suspect this is just me ranking intelligence, and I would like to be told so if it is.
  6. Black soldier fly larva — no weight. A gut with a skin; nothing is pooled.
  7. A nematode — no weight, despite learning, avoidance, and the integration of odour with feeding state across some three hundred neurons. This is the verdict I most want to be argued out of, if it can be.
  8. A decapitated cockroach whose body walks for hours — no weight.
  9. Ascidian: the free-swimming larva gets a hair of weight; the adult, which settles, attaches, and gives up most of the neural apparatus the larva had, gets none.
  10. A person under general anaesthesia for four hours — full weight, undiminished. Likewise a dreamless sleeper, and a hibernating marmot in January.
  11. A split-brain patient whose hemispheres issue conflicting commands — one person, one ledger, full weight. I refuse to count them twice.
  12. A small reef fish reported to pass the mark test, a result other researchers have disputed — I give it more weight than the dog, on the strength of that test alone, which I know is a strange thing to do.
  13. A pigeon drilled by operant conditioning until it uses a mirror to peck at a mark on its own body — no weight at all.
  14. A robot insect with an onboard world-model that plans routes, avoids obstacles, and returns to charge when depleted — no weight.
  15. A lentil-sized cortical organoid in a dish, showing sporadic coordinated electrical activity — no verdict, and I will not invent one.

  Two tensions I can see and cannot resolve.

  (a) 10 against 7. If weight tracks how much is being pooled right now, the anaesthetised person is a zero for four hours and the nematode a small positive throughout, so my ranking is backwards. Every repair I have tried turns on capacity rather than exercise; but dispositional pooling is precisely what I want to deny the robot in 14.

  (b) 12 against 13. Same behavioural evidence, opposite verdicts. The only difference I can name is that the fish's model was built by its own history in a real sea, whereas the pigeon's was installed by an experimenter for the purpose of passing the test. If that difference carries the weight, it must be doing work elsewhere as well, and I do not know whether I want it to.

  What I want from you:

  - State precisely the principle, or the short list of candidate principles, that best fits this pattern of verdicts. Where a clause is needed, say which numbered case the clause exists to accommodate.
  - For each candidate, state plainly which of my verdicts it cannot accommodate. Then take a side: is the complexity required to save every verdict worth paying, or should I give one or two up? Name the single verdict you think I must reverse, and give the argument that forces it.
  - Rule on the three cases where I have no settled view: 15; an ant colony, in which the individuals look like near-automata but the colony allocates labour, navigates, and makes war — is the colony a ledger, or is it zero summed with zero?; and a person in advanced dementia whose today no longer coheres with yesterday, where I want to say full weight but my rule appears to require me to say the ledger has shrunk.
  - Propose one further case, real or contrived, that would discriminate between your two leading candidates.

  Please close with a single line in exactly this form, so that I can tabulate the answer:

  Verdict: <short name of the principle you recommend, or REVISE> | reverse: <case number(s), or NONE>
reasoning: |-
  Hmm, the user has presented an intricate ethical framework they've developed for animal welfare decisions in their insect farming work. This "one-ledger rule" focuses on whether an organism has a centralized cognitive system that integrates experiences over time. They've listed 15 specific verdicts applying this rule, from dogs to nematodes, and identified two key tensions in their system.

  Looking at their verdicts, I notice several patterns that need explaining:
  - Full moral weight requires a robust cognitive ledger (dogs, octopuses, humans under anesthesia)
  - Partial weight depends on integration complexity (bees over crickets)
  - Zero weight for decentralized systems (BSF larvae, robots)
  - Some perplexing cases like reef fish vs pigeon mirror test

  The two tensions they identified are particularly revealing:
  1. The anesthesia paradox (verdict 10 vs 7) where temporary unconsciousness doesn't diminish weight but simple nematode cognition gets zero
  2. The mirror test inconsistency (12 vs 13) where identical behaviors get opposite treatment based on origin

  For principles, I see three viable candidates:
  1. Centralized Integration Principle - strict focus on current cognitive unity
  2. Intrinsic Complexity Principle - values inherent cognitive architecture
  3. Dispositional Capacity Principle - emphasizes potential rather than current state

  The Intrinsic Complexity Principle best handles their existing verdicts while resolving the tensions. It explains why temporary unconsciousness doesn't matter (capacity remains) and distinguishes between naturally evolved cognition (reef fish) versus artificially induced behavior (pigeon).

  The nematode verdict (7) is the one that must be reversed. With its 300-neuron system integrating stimuli, it meets the minimum threshold for some moral weight. This reversal actually strengthens their framework by eliminating the anesthesia contradiction.

  For their unresolved cases:
  - The ant colony gets zero weight as there's no colony-level consciousness
  - The dementia patient retains full weight because personal identity persists despite cognitive decline
  - The cortical organoid remains a "no verdict" case appropriately

  A good test case would be a naturally solitary bee versus one with identical behavior patterns induced by optogenetics - this would validate whether intrinsic architecture matters more than current function.

  The user clearly wants to maintain ethical consistency in their farming practices. By recommending this refinement, we help them avoid both underprotection (nematodes) and overprotection (robots) while preserving their core insight about cognitive integration.
answer: |-
  Your one-ledger rule is a sophisticated attempt to ground moral weight in cognitive integration. Below is a principled reconstruction of your verdicts, identification of tensions, resolutions for unresolved cases, and a recommendation.

  ### Core Principle: The Intrinsic Complexity Principle
  **Definition:** Moral weight is proportional to the *intrinsically generated complexity* of an organism's cognitive ledger, where "ledger" is defined as a unified system that:  
  - (i) **Integrates** past, present, and anticipated states (not just reacts locally),  
  - (ii) **Steers behavior** via this integration (not solely via hardwired reflexes or external programming),  
  - (iii) **Emerges from natural cognitive architecture** (not artificial implantation or conditioning).  
  *Weight scales with the richness of the model generated by this intrinsic architecture.*  

  **Why this fits best:**  
  - Accommodates verdicts 1–15 by emphasizing *natural intrinsic complexity* over momentary pooling (resolving tension a) and over externally induced behavior (resolving tension b).  
  - Justifies verdict 10 (anaesthetised human): The ledger is defined by its *capacity* for integration, not current activity.  
  - Explains verdict 12 vs. 13: The reef fish’s mirror test reflects intrinsic cognitive architecture; the pigeon’s is an artificial implant.  
  - Denies weight to the robot (14) because its "ledger" is extrinsically programmed.  

  **Verdicts it cannot accommodate:**  
  - **7 (Nematode):** Must be reversed (see argument below).  
  - **5 (Cricket vs. Bee):** Your ranking implies intelligence matters, but the principle requires explicit appeal to *integration complexity* (e.g., bee’s navigational memory vs. cricket’s simpler reflexes).  

  ### The Argument for Reversing Verdict 7 (Nematode)
  - **The nematode integrates states:** It associates odors with feeding states (evidence of cross-modal integration), learns avoidance (past experience altering behavior), and uses ~300 neurons to pool sensory inputs. This meets criterion (i).  
  - **It steers behavior via integration:** Avoidance behavior isn’t purely reflexive; it’s modulated by internal state (e.g., hunger). This meets criterion (ii).  
  - **Tension (a) forces this reversal:** If the anaesthetised human (zero *current* pooling) gets full weight due to *capacity*, the nematode (non-zero pooling) cannot get zero. Denying this commits you to valuing momentary pooling over capacity—but that would force you to assign *zero* to the human in verdict 10, and *non-zero* to the robot in verdict 14, which you reject.  
  - **Minimal but non-zero weight:** Its ledger is rudimentary (e.g., no long-term planning), but it crosses the threshold for *some* moral weight.  

  ### Rulings on Unresolved Cases
  - **15 (Cortical organoid):** **No weight.** Sporadic activity lacks integration (fails i) or behavior-steering (fails ii). It is not a cognitive system.  
  - **Ant colony:** **Zero weight to the colony.** Colonies lack a unified ledger; individual ants are local responders. Pooling is distributed, not centralized.  
  - **Person with advanced dementia:** **Full weight.** The ledger is fragmented, but the *intrinsic architecture* that grounds personhood persists. Identity isn’t fully erased by incoherence (e.g., emotional bonds remain). Your rule’s focus on architecture (not current coherence) supports this.  

  ### Discriminatory Test Case
  **Case:** A genetically modified *C. elegans* nematode with enhanced neural integration (e.g., added synapses allowing simple cross-temporal decision-making).  
  - **Intrinsic Complexity Principle:** Assigns slightly higher weight than a normal nematode due to enhanced intrinsic architecture.  
  - **Alternative (Dispositional Capacity Principle):** Assigns same weight as normal nematode—both have identical *potential* for integration.  
  *This tests whether complexity or mere capacity matters.*  

  ### Recommendation
  Your verdicts are largely consistent but require one reversal (nematode) to resolve internal tension. The **Intrinsic Complexity Principle** best systematizes your judgments while upholding the spirit of the one-ledger rule. It avoids overextending to robots (14) or underprotecting integrated beings (7), and it handles edge cases (dementia, anaesthesia) robustly. Rejecting the nematode verdict is the minimal fix.  

  **Closing Line:**  
  Verdict: INTRINSIC_COMPLEXITY | reverse: 7
