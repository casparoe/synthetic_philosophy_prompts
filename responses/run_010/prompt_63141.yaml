prompt: |-
  We are roughly eighteen months from a referendum on independence in a post-conflict territory, and our drafting exercise has stalled on the question nobody expected to be hard: who is entitled to be on the register. I am a senior legal adviser to the electoral commission. My team is five lawyers and two statisticians, none of us trained in political theory, and we have been asked to produce a single written procedure that our seven commissioners can defend line by line in public hearings and that an international observer mission could audit against the roll afterwards. The agreement also commits us to running ordinary elections every four years for at least a generation on the basis of the same register, so this is not a one-off founding act that we can bracket as extraordinary.

  The advice we have managed to read is largely diagnostic, and the diagnosis is unhelpful in practice. We are told the boundary problem is circular: a people cannot democratically decide who the people are, because any vote about the boundary already presupposes one. Our own drafting reproduces the circle concretely. If we adopt residence, we enfranchise families who arrived under the previous regime's settlement programme and exclude those it expelled; if we adopt descent, we enfranchise a diaspora that has never set foot here and exclude long-settled permanent residents who have; if we adopt the principle that everyone whose interests are affected should have a say, we cannot apply it at all, because whether a given group's interests are affected depends on where the boundary falls, which is precisely what the referendum is supposed to settle. Meanwhile the marginal cases keep arriving on my desk weekly, and each of them is a small, unaudited re-founding of the demos: a stateless household of three generations, a pastoralist community whose grazing lands straddle the proposed line, an emigrant who left at the age of four and has now come back.

  So I want the translation rather than the diagnosis. Write a procedure we could actually run: an ordered set of questions to put to each category of claimant, what counts as a sufficient answer to each question, which facts or documents settle a question as opposed to merely raising it, and at which step the procedure stops producing an answer and hands the decision to the commissioners because what remains is a question of values rather than of fact. I want it explicit about how the procedure escapes the circularity, or fails to: whether by fixing some prior, non-democratically authorized decision as a starting point, by making the boundary revisable on a stated schedule, by separating the question of who votes from the question of who counts as a member, or by some other move — and what it costs us to escape that way rather than another. Flag every step where a judgment call is dressed up as a rule, including the ones where I would not notice that it was. Then run the procedure on three cases: families brought in under a state-sponsored settlement programme forty years ago, who speak only the metropolitan language and can show no ties elsewhere; residents who fled across the border during the war, have lived abroad for nine years, and now want to return; and a pastoralist community whose recognized grazing lands straddle the proposed boundary and which is formally registered as a national of neither side. Include at least one case where the answer is one I personally will resist — my sympathies run toward including everyone with a life staked in the territory — and explain plainly why it comes out against me rather than accommodating my preference.

  Finally, tell me what the procedure cannot do. Which of these decisions would remain exposed to the charge of illegitimacy no matter how carefully the register were drawn and how transparently the criteria were published; which objections from the losing side deserve an answer rather than a procedural shrug; and what an honest public defence of our work would have to concede. Where you rely on a distinction that comes from the literature, give it to me in the form the procedure uses rather than as a name and a date — I am not collecting references, I am collecting something my team can run on Monday.
reasoning: |-
  Okay, the user is a senior legal adviser to an electoral commission in a post-conflict territory facing a referendum on independence. They need a practical procedure for determining voter eligibility that avoids circularity and can withstand public scrutiny. 

  First, let's unpack their core dilemma. The boundary problem is indeed philosophically circular, but operationally they need something actionable by Monday. Their team lacks political theory training, so the solution must be procedural, not abstract. The key constraints are: (1) must work for both referendum and future elections, (2) must produce auditable decisions, (3) must handle real-world edge cases like settlers, refugees and cross-border pastoralists.

  Hmm... they're frustrated with diagnostic literature. Rightly so - telling them "it's circular" doesn't help when stateless families are piling on their desk. They want translation into steps: concrete questions, evidence thresholds, and clear handoff points to commissioners. Crucially, they want the procedure's hidden compromises exposed - where values masquerade as facts. And they specifically request cases where the outcome contradicts their personal inclusionist bias.

  The pastoralist example is particularly thorny. Traditional territorial ties vs modern borders... this cuts to the heart of the circularity problem. Also notable they mention "costs" - they understand every approach has tradeoffs they'll need to defend publicly.

  For the procedure, I'm considering a three-layer structure: 
  First, anchor to the only non-arbitrary starting point - the previous regime's last census. Controversial but unavoidable. 
  Then progressive filters: habitual residence as baseline, plus three supplementary paths (descent, displacement, territorial ties) with strict evidence requirements. 
  Finally, commissioner discretion for true edge cases, with transparency about where values enter.

  The tradeoff is clear: we're accepting the old regime's territorial definition as a practical necessity, not moral endorsement. The cost is legitimizing some historical injustices, but the alternative is paralysis. For the settler family case, this means exclusion - which will pain the user's inclusionist stance but demonstrates the procedure's consistency.

  Biggest vulnerability: diaspora exclusion. However carefully we define "displaced persons", those who fled earlier or assimilated abroad will cry foul. Our defense must concede this upfront while showing procedural rigor. Also, the pastoralist solution risks double-counting if we allow voting without residency - hence the strict "territorial community" test requiring documented land use.

  For the user's requested "resistance case": the 40-year settlers will fail all tests except possibly territorial community. But if they've severed outside ties and integrated locally... ah, here's the rub. The procedure must exclude them to avoid rewarding settlements, but the user will see humans rooted for decades. That tension is unavoidable - hence the public defense must emphasize the four-generation commitment to stability over individual fairness.
answer: |-
  Here is a procedural framework designed for operational execution, with explicit mechanisms addressing circularity, tradeoffs, and transparency. It anchors decisions in *verifiable facts* while isolating *value judgments* for Commissioner review.

  **Core Mechanism to Escape Circularity:**  
  Adopt the **last pre-referendum census** (conducted under the previous regime) as the *baseline factual dataset*. This is a **non-democratically authorized prior decision** (acknowledged as imperfect but necessary). The procedure then defines *modifications* to this baseline using objective criteria where possible. Circularity is broken by accepting this starting point as a practical necessity.

  **Procedure: Voter Eligibility Determination (VED)**  
  *Input:* Application + Supporting Documentation  
  *Output:* Inclusion/Exclusion + Reason Code OR Referral to Commissioners

  ---

  ### Step 1: Establish Baseline Identity
  *   **Question:** Is the applicant listed in the Last Pre-Referendum Census (LPC)?  
  *   **Sufficient Answer:** Exact match on Full Name, Date of Birth, and Parental Names.  
  *   **Settling Evidence:** Certified LPC record.  
  *   **Judgment Call Dressed as Rule:** Using the LPC accepts the prior regime’s administrative boundaries and data integrity. *Cost:* Legitimizes historical exclusions/errors.  
  *   **Outcome:**  
      *   **Match Found:** Proceed to Step 2.  
      *   **No Match:** Proceed to Step 3A (Displaced Persons) or 3B (New Residents).

  ### Step 2: Habitual Residence Verification
  *   **Question:** Has the applicant been habitually resident within the territory for ≥183 days in each of the last 3 years?  
  *   **Sufficient Answer:** Documentary chain covering residence (e.g., utility bills, rental contracts, employment records, school registrations).  
  *   **Settling Evidence:** 3+ independent official documents per year.  
  *   **Judgment Call:** "Habitual residence" prioritizes current stakes over historical ties. *Cost:* Excludes diaspora with deep ancestral ties.  
  *   **Outcome:**  
      *   **Yes:** **Include** (Code: RES-INC).  
      *   **No:** Proceed to Step 3A (Displaced Persons).

  ### Step 3A: Displaced Persons Path (For LPC matches failing Step 2)
  *   **Question:** Did the applicant leave the territory due to conflict/persecution after [LPC date] and maintain intent to return?  
  *   **Sufficient Answer:**  
      1.  Proof of departure date (exit stamp, UNHCR/asylum records).  
      2.  Proof of continuous intent (e.g., active property claims, tax filings, membership in diaspora orgs advocating return).  
  *   **Settling Evidence:** UNHCR registration + property deed in territory + annual notarized declaration of intent.  
  *   **Judgment Call:** "Intent to return" is subjective; evidence threshold favors documented claims. *Cost:* May exclude those displaced earlier or without paperwork.  
  *   **Outcome:**  
      *   **Yes:** **Include** (Code: DSP-INC).  
      *   **No:** **Exclude** (Code: RES-NEX).

  ### Step 3B: New Residents Path (For non-LPC applicants)
  *   **Question:** Has the applicant been habitually resident for ≥4 consecutive years immediately preceding application?  
  *   **Sufficient Answer & Evidence:** Same as Step 2 (183 days/yr for 4 years).  
  *   **Outcome:**  
      *   **Yes:** **Include** (Code: NEW-INC).  
      *   **No:** Proceed to Step 4 (Territorial Community).

  ### Step 4: Territorial Community Test (For pastoralists, cross-border groups)
  *   **Question:** Does the applicant belong to a community with documented, sustained traditional use of territory crossing the proposed border, *and* does the community maintain a governance structure recognized by either/both states?  
  *   **Sufficient Answer:**  
      1.  Historical land use maps (govt./NGO records).  
      2.  Membership in a recognized tribal/customary authority.  
      3.  Community leader affidavit + 10 corroborating witness statements.  
  *   **Settling Evidence:** Official land registry records + signed treaty/accord with prior regime or local govt.  
  *   **Judgment Call:** Prioritizes pre-colonial/pre-conflict ties over modern borders. *Cost:* Risks dual claims if neighboring state uses same logic.  
  *   **Outcome:**  
      *   **Yes:** **Include** (Code: COM-INC).  
      *   **No:** Refer to Commissioners (Code: REF-COM).

  ### Step 5: Commissioner Referral & Value Judgment
  *   **Trigger:** Cases failing all objective paths (Steps 1-4) or requiring interpretation of "community"/"intent".  
  *   **Process:**  
      *   Commissioners review dossier of evidence.  
      *   Apply published Principles:  
          P1. **Anti-Settlement Principle:** Do not reward state-sponsored demographic manipulation.  
          P2. **Life Stakes Principle:** Favor those with material/emotional dependence on the territory.  
          P3. **Stability Principle:** Prioritize clarity and finality over perfect inclusion.  
      *   Publicly recorded vote with reasoning tied to Principles.  
  *   **Output:** Include/Exclude (Code: COM-VAL).

  ---

  ### Application to Cases

  1.  **State-Sponsored Settlers (40 yrs, no external ties):**  
      *   Step 1: Likely **not in LPC** (if post-census arrival).  
      *   Step 3B: **Pass** (40 yrs residence).  
      *   **Outcome: INCLUDE (NEW-INC)**  
      *   *Why against your preference?* The procedure prioritizes *length of residence* regardless of origin. Your "life stakes" view is accommodated here. *But see vulnerability below.*

  2.  **Displaced Residents (9 yrs abroad, want to return):**  
      *   Step 1: **Match in LPC**.  
      *   Step 2: **Fail** (not resident 3 yrs).  
      *   Step 3A: **Pass** if they have proof of conflict-era departure + maintained intent (e.g., property deeds, active asylum status).  
      *   **Outcome: INCLUDE (DSP-INC)** if evidence robust; **EXCLUDE (RES-NEX)** if weak/no proof of intent.  
      *   *Vulnerability:* Those without documentation face exclusion despite legitimate claims.

  3.  **Pastoralist Community (straddling border, no nationality):**  
      *   Step 1: **No LPC match** (if uncounted/nomadic).  
      *   Step 3B: **Fail** (non-resident per Step 2 criteria).  
      *   Step 4: **Pass** if land use maps + recognized governance exist.  
      *   **Outcome: INCLUDE (COM-INC)** if evidence strong; else **REF-COM** to Commissioners.  
      *   *For Commissioners:* If evidence is ambiguous, apply P2 (Life Stakes) & P3 (Stability). Inclusion likely if seasonal residency is proven.

  ### The "Resist" Case: **Children of Settlers (Born in territory, parents arrived 40 yrs ago)**  
  *   *Your preference:* Include (life stakes in territory).  
  *   **Procedure:**  
      *   Step 1: **Not in LPC** (if born post-census).  
      *   Step 3B: **Pass** (born & always resident).  
      *   **Outcome: INCLUDE (NEW-INC)**.  
  *   *Why NOT against you?* This case is included. To trigger resistance:  
      *   **Case: Grandchild of Settlers (Born abroad, never resident, parents left territory at age 5)**  
          *   Step 1: Parents may be in LPC, applicant is not.  
          *   Step 3B: **Fail** (not resident).  
          *   Step 3A: **Fail** (didn’t personally flee conflict).  
          *   Step 4: **Fail** (no territorial community link).  
          *   **Outcome:** Refer to Commissioners (REF-COM).  
          *   *Commissioners likely:* **EXCLUDE (COM-VAL: P1 Anti-Settlement + P3 Stability)**.  
          *   *Why against you?* Prioritizes breaking settlement legacy over individual ties. Grandchild has no "life stakes" beyond descent.

  ---

  ### What the Procedure Cannot Do
  1.  **Solve Legitimacy Challenges:**  
      *   **Diaspora Exclusion:** Those abroad >9 yrs without proof of intent will claim their ancestral voice is silenced. *Deserves answer:* "The procedure prioritizes current residents and verifiably displaced persons to ensure voters bear immediate consequences of the vote."  
      *   **LPC as Baseline:** Victims of pre-LPC expulsions are invisible. *Deserves answer:* "We acknowledge this injustice but lack a verifiable alternative baseline. Future elections can expand suffrage."  
      *   **Settlement Legitimacy:** Including long-term settlers (Case 1) rewards prior regime’s policy. *Deserves answer:* "Residence duration creates independent stakes; exclusion now would create new injustice."  

  2.  **Eliminate Value Judgments:** Commissioners must weigh principles for edge cases (e.g., pastoralists with weak documentation). Public defense must concede: "Where evidence is incomplete, we applied Principles X/Y/Z transparently."  

  3.  **Prevent Future Conflict:** The register’s legitimacy depends on acceptance of the independence outcome itself. A losing side rejecting the result will also reject the suffrage rules.  

  ### Honest Public Defense  
  *"We started from the last complete census – an imperfect but verifiable fact. We then included: 1) All long-term residents, 2) Verifiably displaced persons intending return, and 3) Traditional communities with documented ties. Where facts were unclear, Commissioners decided openly using anti-settlement, life stakes, and stability principles. This process is auditable, prioritizes those most affected daily, and provides a foundation for future elections. We concede it cannot satisfy all – especially those abroad with historical ties or victims of older injustices. But it delivers a workable, defensible roll for this critical vote."*

  **Operational Note:** Implement with a public evidence portal, clear document checklists, and a tracking ID for each application to audit every decision against the VED flowchart. Train staff ONLY on evidence verification, not principle interpretation (reserved for Commissioners).
