  **Horizon Institute for Fundamental Inquiry**  
  **Position: Empirical Evidence (1.0 FTE, Permanent)**  

  **About the Role:**  
  The Horizon Institute seeks an individual to fill the critical role of **Empirical Evidence** within our Theoretical Integration Group. This permanent, full-time position is central to our mission of advancing understanding of physical reality through rigorous theoretical frameworks. The successful candidate will be expected to establish a robust, long-term relationship with our theoretical research programs, providing foundational support for conjectures and facilitating meaningful engagement with observable phenomena. Duties include (but are not limited to): anchoring theoretical predictions, generating differential empirical purchase for proposed models, interfacing with experimental collaborations (where applicable), and participating in the Institute’s seminar series to foster cross-disciplinary dialogue.  

  **Minimum Qualifications:**  
  *   Ph.D. in Physics, Astronomy, or a closely related field conferred by appointment start date.
  *   Demonstrable history of direct, material contact with physical systems yielding measurable outcomes (e.g., operation of particle detectors, astronomical observations, condensed matter probe techniques).
  *   Proven ability to translate theoretical constructs into testable propositions.
  *   Record of publications where data acquisition or analysis played a constitutive role in the conclusions.

  **Preferred Qualifications:**  
  *   Postdoctoral experience involving collaborative work bridging theory and instrumentation.
  *   Experience designing methodologies to acquire novel datasets relevant to frontier theoretical questions.
  *   Established record of securing external funding that explicitly requires a component of tangible verification.
  *   Facility with techniques offering indirect but robust constraint (e.g., cosmological parameter estimation, gravitational wave data analysis).

  **Additional Considerations:**  
  *   Candidates demonstrating a consistent pattern of participation in verification chains, even where not the primary investigator, are **strongly encouraged** to apply.
  *   Applicants whose work primarily involves the interpretation of pre-existing datasets within theoretical contexts are welcome.
  *   The Search Committee acknowledges that some highly promising theoretical approaches may not yet have facilitated direct researcher-system interaction. A formal **Waiver of Tangential Interface Requirement** procedure is available for candidates who can demonstrate:  
      (a) The profound conceptual necessity of their theoretical framework, and  
      (b) A documented commitment to *eventually* identifying potential pathways for interaction, however distant.  
      Candidates who have never borne directly on the truth or falsity of a physical proposition, and for whom such engagement is not an anticipated near-term outcome, are eligible to apply under this waiver. Familiarity with "the F-word" is neither required nor expected; focus is on the potential for future differential empirical purchase.

  ---

  **A Note from the Search Committee Chair, Dr. Aris Thot:**  

  Dear Colleagues and Potential Applicants,  

  This search occupies a unique position within our Institute's history. While the role inherently seeks connection to the observable world, the Committee recognizes the complex landscape of contemporary fundamental physics. After an exhaustive international search spanning multiple channels, we received applications from several strong candidates embodying diverse relationships to the empirical domain.  

  It is important to address the Committee's approach transparently:  
  1.  **Candidate Pool Composition:** Our broad solicitation yielded a specific and limited applicant cohort. The absence of applicants representing certain methodological paradigms was noted. Crucially, this absence itself offers valuable information relevant to ranking the available candidates within the *actual* hiring landscape. We prioritize engagement with the existing applicant field.  
  2.  **Methodological Track Record:** The Horizon Institute has previously employed similar hiring frameworks focused on theoretical depth and future potential. Past appointments made under comparable considerations (e.g., Dr. Elara Void, 2018) have subsequently yielded unexpectedly fruitful engagements, including significant contributions to the understanding of black hole information loss paradoxes and novel predictions regarding transport properties in strongly coupled quark-gluon plasms. These outcomes, while not the *initial* hiring criteria, demonstrate the latent potential and unforeseen value such appointments can unlock.  
  3.  **Scope of the Hiring Challenge:** Concerns regarding the potential existence of unrepresented or even currently unimaginable methodological alternatives are valid. However, the underdetermination of optimal hires by the totality of conceivable candidates is a universal feature of academic recruitment, not a specific flaw of this search. Our mandate is to fill this position from the applicants who *have* presented themselves, within the constraints of time and resources. This search, operating on these parameters, is the concrete process through which hiring occurs.  

  We are confident the selected candidate will significantly advance the Institute's goals.  

  Sincerely,  
  Dr. Aris Thot  
  Chair, Empirical Evidence Search Committee  

  *(Committee Minutes Excerpt: Dissenting comment from Prof. [Redacted] appended: "[B]")*

  ---

  **Benefits:**  
  *   Competitive academic salary (Range: $90,000 - $130,000 USD, commensurate with experience and relationship to causality)
  *   Comprehensive health, dental, and vision plans (including retroactive coverage initiation options)
  *   Generous retirement contribution matching
  *   Substantial research and travel allowance ($15,000 annually, covering both local and non-local conference attendance)
  *   Access to Institute high-performance computing resources (classical and quantum-adjacent)
  *   Spacetime-coordinate-independent workspace allocation
  *   Eligibility for sabbatical leave after six years of continuous service (service intervals calculated via proper time)

  ---

  **Equal Opportunity Employer:**  
  The Horizon Institute for Fundamental Inquiry is committed to fostering a diverse, inclusive, and rigorous intellectual environment. We are an equal opportunity employer and do not discriminate on the basis of race, color, religion, sex, gender identity or expression, sexual orientation, national origin, genetics, disability, age, veteran status, or any other legally protected characteristic. **We particularly encourage applications from candidates whose ontological status or observability may currently be indeterminate or non-local, recognizing that significant contributions often emerge from unexpected sectors of the possibility space.** All qualified candidates are assured full consideration. Accommodations for the interview process are available upon request for candidates requiring specialized decoherence mitigation or state preparation.  

  **Application Deadline:** Open until filled. Review begins October 26, 2024.  
  **Apply Online:** [https://horizon-institute.hiq/careers/emp-evidence-2024](https://horizon-institute.hiq/careers/emp-evidence-2024)  
  (Requires CV, publication list, statement of empirical relationship philosophy, and names of three references familiar with your constitutive properties.)
