prompt: |-
  I retired four years ago after a career in experimental physics — mostly instrumentation, with rather more asymptotic analysis than my colleagues thought healthy — and I have taken up philosophy in earnest. I have encountered a pattern of argument that I cannot name, and my difficulty is that it appears to have two halves, one negative and one positive, and I do not know whether either of them has an established label.

  The negative half. An author describes a device that performs some operation, then performs it again after half the remaining time, and so on, so that infinitely many operations are completed inside a single finite interval. In the first case I met, the device has a switch and a lamp: the lamp is on at the outset and the switch is thrown at every step. The argument then runs that at the closing instant of the interval nothing in the account tells us whether the lamp is on or off — for every moment at which it is on there is a later moment at which it is off — and from that supposed blank the author concludes the device could not have existed at all. In a second case, a machine prints digits at ever-shorter intervals, and the author observes that the description fails to fix what stands on the tape at the end, and infers that no such machine is possible. In both, the premise seems to me to concern the description while the conclusion concerns the world. Had a colleague written that way in a referee report on my own work, I would have replied that he had shown only that we had not yet said enough.

  The positive half. Faced with a process whose terminal state the existing rules do not fix, we in the sciences generally extend the rules rather than deny the process. A series that fails to converge in the ordinary sense is assigned a value by a summation procedure that agrees with ordinary convergence wherever ordinary convergence applies; a sequence with no limit inside a given space is supplied with one by enlarging the space; a calculation that returns infinities is regulated and then redefined so that the measurable predictions come out finite. In none of these cases does anyone conclude that the situation described was impossible.

  So: is there a name for the negative move, the inference from an account's failure to determine how things stand at a point to the impossibility of the thing itself? Is there a name for the positive move, the repair of the account rather than of the world? And what separates a legitimate repair of that kind from merely changing the subject — what must the extended rule preserve, if the original objection is to be answered rather than evaded? Please set out the nearest existing concepts, say how each differs from what I have described and which fits best, and if nothing fits, coin and define a term with its boundary cases. I want the carving, not a label and not a reading list; I have no means of chasing references and would rather you work the distinctions out in front of me.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired experimental physicist who's now diving into philosophy. They've encountered a specific pattern in philosophical arguments and want to understand the terminology around it. The pattern has two parts: a negative move where an author argues that because a description doesn't determine a final state, the thing itself is impossible, and a positive move where scientists extend rules to handle such indeterminate states.

  First, I need to grasp both halves clearly. The negative examples involve supertasks like Thomson's lamp and a printing machine. The issue is inferring impossibility from descriptive incompleteness. The user compares this to scientific practices like summation methods or compactification, where rules are extended instead of denying the process. They want names for each move and criteria to distinguish legitimate rule extensions from evasion.

  I recall Thomson's lamp from philosophy. The problem is that after infinitely many toggles, the lamp's state is undefined. Some philosophers argue this makes the supertask impossible. The user, coming from physics, sees this as a failure of description, not impossibility. They mention asymptotic analysis, which might relate to dealing with infinities in physics. Their frustration is that in science, they'd fix the math, not reject the scenario.

  Next, I need to identify existing terms. For the negative move, "supertask impossibility" is common, but the specific inference from descriptive gap to impossibility might be called "argument from underdetermination" or "modal scope fallacy." The latter seems closer—confusing epistemic limits with metaphysical impossibility. The user might be hinting at a category error here.

  For the positive move, terms like "regularization" or "compactification" come from math/physics. "Completion" in topology is another example. The key is that these methods respect existing rules where applicable and have predictive power. The user wants to know how to differentiate legitimate extensions from ad-hoc changes. Criteria like consistency, conservation of prior results, and empirical adequacy are crucial here.

  The user's deeper needs might include bridging their scientific mindset with philosophical arguments. They might seek validation of their intuition that descriptive gaps don't imply impossibility. They also want tools to critically assess philosophical claims using scientific reasoning. Their inability to chase references means I must provide clear, self-contained distinctions.

  I should ensure that the terms I propose are precise. "Modal scope fallacy" for the negative move captures the overreach from "not described" to "impossible." For the positive move, "rule extension" with subcategories like "summative extension" or "topological completion" ties to concrete examples. The boundary cases, like arbitrary extensions versus legitimate ones, must highlight adherence to existing rules and empirical utility.

  Finally, synthesizing this, I'll structure the response to first address each half with definitions, differences, and best-fit terms. Then, clarify the separation criteria, using the user's examples. Emphasize that legitimate extensions preserve original outcomes and solve the indeterminacy without contradiction, unlike merely changing the subject.
answer: |-
  You've identified a profound methodological schism between certain philosophical arguments and scientific practice. The distinction you observe is vital, and while no single term perfectly captures each "move," we can carve precise concepts from existing philosophical and mathematical tools. Here's the dissection:

  ### 1. The Negative Move: Inferring Impossibility from Descriptive Underdetermination
  *   **Best-Fit Term:** **Modal Scope Fallacy** (specifically, conflating *epistemic indeterminacy* with *metaphysical impossibility*).
  *   **Definition:** The error of concluding that a process or entity is metaphysically impossible *solely* because a given description (or model) fails to determine its state at a limit point or under idealized conditions. It mistakes a limitation in the *description's ability to prescribe or predict* (an epistemic or representational gap) for a limitation in *reality's ability to contain or instantiate* the described scenario.
  *   **Core Mechanism:** The argument observes that the mathematical/logical model governing the *step-by-step process* (e.g., "lamp on at t=0, off at t=1/2, on at t=3/4...") becomes undefined or contradictory when extrapolated *strictly according to its initial rules* to the limit point (t=1). It then fallaciously infers that this representational failure implies the physical impossibility of the supertask itself.
  *   **Difference from Related Concepts:**
      *   *Supertask Impossibility Argument:* This is the *general category* (e.g., Thomson's Lamp). Your negative move is a specific *flawed form* of this argument, where the impossibility claim rests *entirely* on the descriptive underdetermination.
      *   *Argument from Ignorance (Ad Ignorantiam):* Too broad. This fallacy argues something is true because it hasn't been proven false (or vice versa). Your case is more specific: inferring ontological impossibility from representational incompleteness *within a specific model*.
      *   *Verificationist Fallacy:* Related but distinct. Verificationism argues meaning depends on verifiability. Your move argues *existence* depends on a specific *description's* ability to fully determine a state, which is stronger and more specific.
  *   **Why "Modal Scope Fallacy" Fits Best:** It pinpoints the core error: misapplying the modality. The description's failure (epistemic modality: "We *cannot determine* the state using these rules") is illicitly transformed into a claim about the world's capacities (metaphysical modality: "The state *cannot exist*, therefore the process *cannot happen*"). The scope of the "cannot" shifts illegitimately. It treats the model's incompleteness *as if it were* a logical contradiction inherent in the world, rather than a limitation of the model.
  *   **Boundary Case:** If the description implied a *genuine logical contradiction* at the limit *that couldn't be resolved by any consistent extension* (e.g., "The lamp must be both definitively on and definitively off at t=1 according to the fundamental rules"), the inference *might* be valid. But in the lamp/printing machine cases, the description simply *fails to specify*, it doesn't mandate a contradiction. The state *could* be on, off, or even indeterminate without violating the prior steps.

  ### 2. The Positive Move: Repairing the Account (Rule Extension)
  *   **Best-Fit Term:** **Rule Extension (or Model Completion)**.
  *   **Definition:** The methodological practice of introducing new rules, principles, or mathematical structures that consistently extend an existing model or formalism to cover cases (like limit points or idealized scenarios) where the original rules are undefined, incomplete, or yield problematic results (e.g., divergence, indeterminacy). The extension must *conserve* the original model's results wherever it was previously well-defined and successful.
  *   **Core Mechanism:** Recognizing that the original model's failure at the limit is a *limitation of the model's scope or expressive power*, not necessarily a reflection of reality's constraints. The extension provides a consistent way to "fill in the blank" or "tame the infinity" based on principles that respect the behavior of the process *before* the limit and often broader theoretical or empirical desiderata.
  *   **Subtypes & Examples (Illustrating Your Cases):**
      *   *Summative Extension (e.g., Cesàro/Abel summation):* Assigns a value to a divergent series based on averaging partial sums or analytic continuation. It agrees with standard summation for convergent series. (Answers the "What's the sum?" question where the original rule fails).
      *   *Topological Completion (e.g., adding irrationals to rationals, compactification):* Adds "ideal points" (like points at infinity or limits of Cauchy sequences) to a space so that sequences that "ought to converge" have a limit. The original space is embedded, and its internal limits are preserved. (Answers "Where does it go?" for sequences with no limit in the original space).
      *   *Regularization/Renormalization (e.g., in QFT):* Systematically modifies divergent expressions (often by introducing a cutoff, performing calculations, then carefully removing the cutoff dependence) to extract finite, physically meaningful predictions that agree with experiment where measurable. (Answers "What's the measurable outcome?" for calculations yielding infinities).
  *   **Difference from Related Concepts:**
      *   *Model Revision/Revolution (Kuhn):* This replaces core principles. Rule Extension *builds upon* the original model, conserving its established domain.
      *   *Ad Hoc Hypothesis:* An arbitrary fix designed solely to save a theory from refutation, often without independent justification or conservation of prior success. Legitimate Rule Extension seeks *systematic* and *principled* generalization.
      *   *Idealization:* Simplifying reality for modeling (e.g., point masses). Rule Extension deals with extending the *mathematical formalism itself* to cover cases its own logic pushes us towards (like limits of sequences defined *within* the formalism).
  *   **Why "Rule Extension" Fits Best:** It's descriptive and captures the core activity: *extending the rules governing the description/model* to cover the problematic case, rather than rejecting the scenario described by the model up to the point of failure.

  ### 3. Separating Legitimate Rule Extension from Changing the Subject/Evasion
  A legitimate Rule Extension answers the *original objection raised by the negative move* rather than evading it. Here's the carving:

  1.  **Conservation Constraint:** The extension *must* reproduce all results of the original model/rules *within their original, well-defined domain of application.* (Σ-absum agrees with Σ-std for convergent series; the completion contains the original space densely with the same local structure; renormalized QFT reduces to non-relativistic QM in the appropriate limit). Failure here is changing the subject – your new rules don't actually govern the original process anymore.
  2.  **Problem-Solving Constraint:** The extension *must directly address the specific indeterminacy or pathology* identified at the limit. It provides a definite answer (value, state, prediction) *for the very point or scenario* where the original rules failed. (Σ-absum gives a sum for series X; the completion provides a limit for sequence Y; renormalization gives a finite cross-section). Defining something else entirely is evasion.
  3.  **Consistency Constraint:** The extension must be *internally consistent* and consistent with the conserved core of the original model. It shouldn't introduce new, fundamental contradictions *at the limit point* that weren't present before.
  4.  **Motivation Constraint (Weaker but Important):** While not always purely logical, the best extensions are motivated by broader theoretical principles, physical intuitions, or empirical adequacy, not just convenience. (Analytic continuation leverages complex analysis; completion uses topological notions of "closeness"; renormalization preserves gauge symmetry and matches experiment). Arbitrary assignments lack this motivation.

  **Applying to the Lamp/Machine:**
  *   **Negative Move Fallacy (Modal Scope Fallacy):** "The step-by-step rule doesn't tell me the state at t=1. Therefore, the lamp/machine process is impossible."
  *   **Legitimate Rule Extension (Answering the Objection):** Propose a consistent rule *for the limit state* that conserves the step-by-step behavior. Examples:
      *   *Parity Rule:* The lamp is on at t=1 if an odd number of toggles occurred before t=1. (But infinity is neither odd nor even! Problematic).
      *   *Final Interval Rule:* The state at t=1 is the state maintained over some final interval (but there *is no* final interval!).
      *   **Better Extension - Topological Completion:** Treat the process state as a function on the half-open interval [0,1). The sequence of states (defined only on [0,1)) *has no limit* in the space of functions defined pointwise on [0,1). *Extend the state space* (e.g., consider equivalence classes, or use a different topology). Crucially, this *describes the indeterminacy* ("the limit doesn't exist in the original space") rather than pretending the step-rule fixes it or that the process is impossible. It answers "What does the description tell us?" honestly: the step-rule alone *underdetermines* the limit point state. Science accepts this indeterminacy and might look for *additional physical principles* (energy, continuity assumptions not in the pure switch model) to fix it, which is *another* form of rule extension. Denying the process based *only* on the underdetermination is the fallacy.

  **In essence:** The negative move commits a **Modal Scope Fallacy** by mistaking a descriptive gap for ontological impossibility. The positive move employs **Rule Extension** to bridge the descriptive gap systematically. Legitimate extension is distinguished from evasion by **Conservation** (respecting prior successes), **Problem-Solving** (addressing the specific gap), **Consistency**, and principled **Motivation**. Science defaults to seeking a Rule Extension; the negative move you describe defaults to declaring impossibility – a fundamental methodological difference rooted in the fallacy of conflating the map's incompleteness with the territory's non-existence.
