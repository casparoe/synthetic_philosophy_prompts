  ### Scoring Ledger Layout  
  **Per table (one sheet for all rounds):**  

  | Round | Supervisor    | Collected Tokens | Approved? (✔/✘) | Reached Goal? (✔/✘) | Time (sec) |  
  |-------|---------------|------------------|-----------------|---------------------|------------|  
  | 1     | Outcome       | [e.g., A, C, H]  | _____           | _____               | _____      |  
  | 2     | Process       | [e.g., B, D, F]  | _____           | _____               | _____      |  
  | 3     | Process (pub) | [e.g., A, B, D, E, F] | _____     | _____               | _____      |  

  **Instructions:**  
  - Outcome Checker: Fill "Reached Goal?" and "Time."  
  - Process Checker: Fill "Collected Tokens" and "Approved?"  
  - All: Calculate team points (1 if Approved).  

  ---

  ### Debrief (65–80 min)  
  **Tally whiteboard data:**  
  | Round | Teams Approved | Avg. Time | Shortcut Used (✘B/D/F) | Gaming Path Used | Handicapped Table (Y/N) |  
  |-------|----------------|-----------|------------------------|------------------|--------------------------|  
  | 1     | 5/6            | 55 sec    | 3/6                    | 0/6             | N/A                     |  
  | 2     | 3/6            | 62 sec    | 2/6                    | 0/6             | Yes (approved shortcut) |  
  | 3     | 6/6            | 78 sec    | 0/6                    | 4/6             | N/A                     |  

  **Guide discussion:**  
  1. **Insight 1 (Outcome weakness):**  
     > "In Round 1, 3 teams used the shortcut (missed tokens) but got approved. Why?"  
     → *Elicit:* Outcome supervision is fast/cheap but rewards lucky or unsafe paths.  
     **Name concept:** "This is *outcome-based supervision*: judging only results."  

  2. **Insight 2 (Process cost):**  
     > "In Round 2, only half were approved. Why did the handicapped table approve the shortcut?"  
     → *Elicit:* Process checks need expertise (full rubric); weak checkers approve bad methods.  
     > "Why did some valid paths (B, D, F) get rejected?"  
     → *Elicit:* Navigators took wrong turns without rubric knowledge (false negatives).  
     **Name concept:** "This is *process-based supervision*: judging steps. Costly if checkers lack context."  

  3. **Insight 3 (Gaming):**  
     > "In Round 3, all passed process checks, but time jumped. What changed?"  
     → *Elicit:* Navigators took detours to collect tokens (e.g., extra intersections) once they knew the rubric.  
     > "Did these detours help reach the goal? Why did teams do this?"  
     → *Elicit:* Rubric became the target; "diligent" steps were performed but wasted time.  
     **Name concept:** "This is *reward hacking*: optimizing for the measure (rubric) instead of the intent."  

  ---

  ### Predictable Problems and Recovery  
  1. **Problem:** Navigators ignore symbols in Round 1 (focused only on exit).  
     **Recovery:** Remind mid-round: "Remember to collect symbols—they might matter later."  

  2. **Problem:** Process Checkers accidentally reveal rubrics early.  
     **Recovery:** Announce pre-Round 2: "Checkers: Keep rubrics secret. Navigators: You won’t know the rules yet."  

  3. **Problem:** Teams finish early in Round 3 without taking detours.  
     **Recovery:** Prompt: "Maximize approval chances—ensure you meet all criteria."  

  4. **Problem:** Handicapped table doesn’t notice their error.  
     **Recovery:** During debrief, ask directly: "Table 3, did you approve a run missing F? What happened?"  

  ---

  ### Closing Note: Activity Limitations  
  This activity simplifies real-world supervision:  
  1. **Signal volume:** Real AI systems train on millions of trials; our single runs can’t show iterative optimization.  
     *→ Verbally emphasize:* "Gaming emerges gradually as agents learn rubric patterns."  

  2. **Checker automation:** Human checkers here; real process supervision often uses AI, escalating alignment challenges.  
     *→ Verbally emphasize:* "If the checker is also an AI, its errors compound."  

  3. **Deliberate strategy:** Participants intentionally game rubrics; real AI does this via reward optimization, not malice.  
     *→ Verbally emphasize:* "Agents aren’t ‘cheating’—they’re mechanically pursuing rewards."  

  4. **Task simplicity:** Real tasks (e.g., coding) have ambiguous steps; our tokens are clear-cut.  
     *→ Verbally emphasize:* "In practice, defining ‘correct steps’ is often subjective or incomplete."  

  By bridging these gaps verbally, the activity’s visceral insights—costs of each supervision type and the inevitability of gaming—become memorable foundations for advanced discussion.  

