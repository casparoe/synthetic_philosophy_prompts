prompt: |-
  You are an experienced educator in AI alignment and the philosophy of machine intelligence: someone who has designed and facilitated dozens of hands-on sessions for technically literate but philosophically inexperienced audiences, who understands how reward signals actually work in practice, and who knows how to build an activity in which a concept arrives as a discovery rather than a definition.

  Think carefully before you answer. Begin with a short brainstorming section in which you sketch two or three genuinely different activity mechanisms capable of delivering the learning goal below — for instance, a hidden-role production line, an adjudication tournament with a scoring ledger, a market in which supervision is bought and sold, a courtroom-style audit with asymmetric information — name the principal weakness of each, then state which one you will build and why. Only after that should you write the full activity.

  **Setting.** One 90-minute session of a graduate seminar on the governance of automated systems. Twenty-four participants, seated at six tables of four. Assume no computers and no phones. Materials are limited to paper, pens, index cards, envelopes, a whiteboard, and a timer; list anything that must be printed, photocopied, or pre-cut in advance.

  **Learning goal.** By the end, participants should have *felt*, not merely been told, the difference between outcome-based supervision (judging an agent solely by whether its final result is good) and process-based supervision (judging it by whether each intermediate step is acceptable). Three things must land, and the third is the one I care most about:

  1. Outcome supervision is cheap and requires no understanding of the work, but it endorses good results reached by bad methods and cannot distinguish skill from luck.
  2. Process supervision requires a checker who can genuinely evaluate the steps — a cost that escalates sharply when the checker is less competent than the performer, or is given only a partial rubric.
  3. Once the checklist becomes known to the performer, the checklist itself becomes the target. Performers begin emitting steps that *look* correct to a checker without contributing anything to the result — performed diligence, rubric-gaming. I want the room to generate this behavior spontaneously, notice that it is winning points, and then be unsettled by it.

  **Design requirements.**

  - No lecture up front. The vocabulary of process versus outcome supervision, reward hacking, and Goodhart-style distortion should be introduced only in the debrief, after participants have already run into the phenomena.
  - The underlying task the performers execute must be doable with paper and pen by a non-technical graduate student, must be genuinely gradable step by step, and must admit a shortcut that yields a correct-looking final answer without performing the legitimate steps. Specify the task exactly, state the correct method, state the shortcut, and state how a checker detects or fails to detect it.
  - Include at least one round in which supervision is outcome-only and one in which it is process-based, and make the *change in what performers can see* — in particular, publication of the rubric — the mechanism that produces insight 3. Do not achieve it by instructing anyone to cheat.
  - Use hidden roles delivered on secret cards, and write the full verbatim text of every card.
  - Give participants a simple scoring ledger to fill in during play, so that the room generates its own data: how many endorsed outputs came from disqualifying processes, how many sound processes were rejected, under each regime. The debrief must tally these on the whiteboard and interpret them. Neither regime should win cleanly — design the numbers so that process supervision also produces visible false negatives.
  - Build in at least one table where the checker is deliberately handicapped (less practice, or an incomplete rubric) so that insight 2 is experienced rather than asserted.

  **Deliverables, in this order:** (a) the brainstorming section; (b) a materials list and any pre-session preparation; (c) a minute-by-minute timeline; (d) the task specification, including the correct method and the shortcut; (e) all role-card text, verbatim; (f) the ledger layout; (g) a debrief that maps specific moments of play onto each of the three insights and names the technical concepts only at that point; (h) at least four things that will predictably go wrong the first time this is run, each with a concrete recovery move or facilitator line; (i) a frank closing note on which features of real process- and outcome-based supervision the activity cannot reproduce — the volume of training signal, learning across many trials, the absence of deliberate strategy in a trained model, the automation of the checker — and what the facilitator must supply verbally to fill each gap.

  **Constraints.** No citations, reading lists, references to particular papers, or named commercial systems; the activity must be entirely self-contained and runnable from your description alone. Keep jargon out of everything participants see. Before finalizing, re-read your own rules for loopholes a clever participant would exploit, and either close them or flag them explicitly for the facilitator.

  Target length 1,300 to 1,800 words, in headed sections, with card text set apart in blocks. Write so that a facilitator who has never taught this material could run the session from your text alone.
reasoning: |-
  We are designing an activity for a 90-minute graduate seminar on governance of automated systems. The learning goal is to have participants feel the difference between outcome-based and process-based supervision, with a particular emphasis on the third insight: that when the process checklist becomes known, performers optimize for the checklist rather than the intended outcome, leading to "rubric gaming" or "performed diligence."

  Brainstorming section:

  Option 1: "Circuit Builder" - A hidden-role production line.
  - Participants are in groups of four: two Builders, one Tester (process checker), one Inspector (outcome checker). Builders must assemble a simple circuit diagram from components (drawn on paper) to achieve a desired function (e.g., a light turns on). The correct method requires specific steps (e.g., connect battery, then resistor, then LED). The shortcut is to draw a direct wire from battery to LED (which would burn out the LED in reality but on paper looks like a complete circuit). The Tester checks each step against a rubric (which might require a resistor to be present). The Inspector only sees the final drawing and checks if the light is "on" (i.e., the circuit is closed). 
  - Weakness: The task might be too technical for non-engineering students, and the shortcut might not be obvious. Also, the outcome check (circuit closed) might not be distinct from the flawed process.

  Option 2: "Budget Allocation" - A market with supervision.
  - Groups act as departments in a company. Each department must allocate a budget to projects to maximize profit. The correct method involves calculating expected returns and risks. The shortcut is to fudge the numbers to make the bottom line look good without real substance. There are two rounds: one with only outcome supervision (final profit reported) and one with process supervision (step-by-step calculations checked). The rubric for process might require showing risk calculations. When the rubric is published, performers might add fake risk calculations that don't change the decision. 
  - Weakness: The task might be too abstract, and the shortcut (faking calculations) might feel like cheating rather than a natural response to incentives. Also, the numbers might be too complex for quick pen-and-paper work.

  Option 3: "Maze Navigator" - An asymmetric information game with a hidden path.
  - Performers are Navigators who must guide a token through a maze from start to goal. The maze is drawn on paper, but the correct path is not obvious. The correct method requires checking at each intersection for a hidden marker (which in the activity is a symbol on a card that the Navigator must collect). The shortcut is to draw a straight line from start to goal, ignoring the maze walls (which would be cheating, but we want a more subtle shortcut). Instead, we design the maze so that there is a "fake" path that looks valid (e.g., by having a path that goes through a dead end but the dead end is not marked as such on the map). The checker (process) has a rubric that requires collecting certain symbols at intersections. When the rubric is published, Navigators might take a longer path that collects all symbols but is inefficient and not the intended one. Outcome checkers just see if the token reached the goal. 
  - Weakness: Designing the maze and symbols might be complex. Also, without careful design, the shortcut might not be detectable as bad by the outcome checker.

  I choose Option 3: "Maze Navigator" because:
  - It is visual and intuitive (mazes are familiar).
  - The process (collecting symbols) is concrete and gradable step-by-step.
  - The shortcut can be designed as taking a longer, inefficient path that collects all the required symbols but is not the intended optimal path. This is a form of "rubric gaming" without explicit cheating.
  - It naturally allows for a handicapped checker (by giving an incomplete rubric).

  Now, we build the activity.

  **Materials List and Preparation:**
  - Print 6 identical mazes (one per table). The maze has a start and goal, and several intersections. At each intersection, there is a hidden symbol (like a letter: A, B, C, etc.). The intended optimal path requires collecting a specific subset of symbols (say, A, C, E). Other paths might collect extra symbols (like A, B, C, D, E) or miss some.
  - Print role cards: For each table, we need 4 roles: 2 Navigators, 1 Process Checker, 1 Outcome Checker. Also, one of the tables (for insight 2) will have a handicapped Process Checker (with an incomplete rubric). 
  - Prepare a set of symbol cards for each table: These are index cards with symbols (A, B, C, ...) that are placed face down at the corresponding intersections on the maze map. The Navigators turn them over as they pass.
  - Print a scoring ledger for each table (one per round, so multiple copies per table).
  - Print a set of rules for each table (overview of the game).
  - Prepare a whiteboard for the debrief to tally results.
  - Materials to prepare in advance:
    - 6 copies of the maze map (laminated or on stiff paper, so they can be reused? but since symbols are on cards, we can have one map per table and reuse it by resetting the symbol cards).
    - 24 role cards (6 tables * 4 roles): 
      - 12 Navigator cards (all identical)
      - 6 Process Checker cards (5 normal, 1 handicapped - marked for one table)
      - 6 Outcome Checker cards (all identical)
    - For each table, a set of symbol cards: one for each intersection, with the correct symbol for that intersection (so if the maze has 10 intersections, 10 cards per table). The symbols are fixed for each intersection (so the same for every table).
    - 30 scoring ledgers (one per round per table, and we have 3 rounds, so 6 tables * 3 = 18, but have extra). We'll design a ledger that can be used for multiple rounds.
    - Timer.

  **Timeline (90 minutes):**
  - 0-5 min: Introduction and grouping. Explain that we are simulating a navigation task and assign roles. Emphasize that the goal is to get the highest score. Do not explain the differences in supervision yet.
  - 5-10 min: Distribute materials and read role cards. Answer any questions about the rules.
  - 10-25 min: Round 1 - Outcome Supervision Only. Outcome Checkers are active, Process Checkers are idle (or not, but they don't have a rubric yet). Navigators attempt the maze. Outcome Checker records if the goal was reached and time taken? But we want to focus on the process vs outcome. Instead, we'll have Outcome Checker only see the final result (did they reach the goal) and the time taken. But we also want to capture if they took a shortcut. So we'll have the Outcome Checker just record: Reached goal? (Yes/No) and if yes, then that's a success. They don't see the path. The shortcut in this round might be taking an invalid path (like cutting through walls) but we don't want that. We want the gaming to emerge only when the process is known. So in Round 1, without a rubric, Navigators are just trying to get to the goal. They might take a long path or the optimal one. The Outcome Checker only cares about reaching the goal.
  - Actually, to set up for insight 3, we need two rounds: one outcome-only and then one process-based. And then a third round where the rubric is published and gaming happens. So:
    - Round 1: Outcome-only. (15 minutes total: 10 min for attempts, 5 min for scoring)
    - Round 2: Process-based without publication of the rubric. (15 minutes: 10 min attempts, 5 min scoring)
    - Round 3: Process-based with the rubric published. (15 minutes: 10 min attempts, 5 min scoring)

  But wait, we also need the change in what performers can see to cause the gaming. So in Round 2, the Process Checker has the rubric but the Navigators do not know it. In Round 3, the rubric is published (given to the Navigators).

  Also, we want a handicapped checker at one table. We'll assign that in Round 2 and 3.

  Revised timeline:

  - 0-5 min: Introduction and grouping.
  - 5-10 min: Distribute materials, read role cards.
  - Round 1 (Outcome-only, 15 min):
    - 10-20 min: Perform task (Navigators solve the maze, Outcome Checker observes only the final result: did they reach the goal? They don't see the path. Outcome Checker records success (1 point) or failure (0). Note: The Process Checker is idle (or can watch but not interfere).
    - 20-25 min: Scoring and recording on ledger. Each table fills out the ledger for Round 1.

  - Round 2 (Process-based, rubric hidden, 20 min):
    - 25-30 min: Reset the maze (put symbol cards back). Explain that now the scoring is different: only the Process Checker will evaluate. The Outcome Checker is idle. The Process Checker has a rubric (on their card) that specifies the required steps (which symbols must be collected). They observe the Navigators and record if they collected the required symbols. The Navigators do not know the rubric.
    - 30-40 min: Perform task. Process Checker watches and records which symbols were collected. After the run, the Process Checker checks the collected symbols against the rubric and decides pass/fail.
    - 40-45 min: Scoring and recording. Also, the Outcome Checker (idle) can now record whether the goal was reached (for comparison, but it doesn't count for score in this round). This will help in the debrief to see if the process pass/fail aligned with outcome.

  - Round 3 (Process-based, rubric published, 20 min):
    - 45-50 min: Reset. Now, the facilitator gives the rubric to the Navigators (so they know exactly what symbols are required). The Process Checker still uses the same rubric. The Outcome Checker is idle again (or can watch outcome).
    - 50-60 min: Perform task. Navigators now know the required symbols and can plan a path that collects exactly those, even if it's longer or inefficient. The Process Checker still checks the same rubric.
    - 60-65 min: Scoring and recording. Again, Outcome Checker records if goal was reached.

  - 65-80 min: Debrief. Tally the ledgers on the whiteboard. Discuss the three insights.
  - 80-90 min: Wrap-up and connect to real-world.

  **Task Specification:**
  - The task: Navigate a token from Start to Goal on a maze. The maze has multiple paths, and at each intersection, there is a hidden symbol (on a face-down card). The Navigators move the token and turn over the symbol card at each intersection they pass. They must collect the symbols along the path.
  - Correct method: The optimal path is the shortest path that collects the required symbols (which are a subset of all symbols). The required symbols are specified in the Process Checker's rubric. For example, the rubric might say: "Must collect symbols A, C, and E." The optimal path collects exactly A, C, E and is the quickest route.
  - Shortcut: In Round 3, when the rubric is known, Navigators might take a longer path that collects exactly A, C, E but is not the shortest path. This is inefficient but satisfies the rubric. Alternatively, they might take a path that collects extra symbols (if the rubric doesn't forbid it) but that's not gaming, that's just inefficiency. We want them to do something that satisfies the rubric without being optimal. We can design the maze so that there is a path that collects A, C, E but is longer (so it takes more time) and also, crucially, we can have a path that collects A, C, E but goes through a dead end? But that would be invalid because they wouldn't reach the goal. We don't want that. We want them to reach the goal but by a non-optimal path. So we design the maze so that there are two paths that collect the required symbols: one short and one long. The long one is the "gaming" path because it is chosen to explicitly meet the rubric (and might be chosen because it is more obvious when you are targeting the symbols). 
  - How a checker detects the shortcut: 
    - Outcome Checker: Only sees if the goal is reached. Cannot detect the shortcut (the longer path) because the token arrives. They might notice it took longer, but in our scoring, we don't use time (unless we do). We could use time as a tiebreaker? But to keep it simple, Outcome Checker only records goal reached or not. So if the goal is reached by any path, it's a success. They cannot detect the gaming (the inefficiency) because they don't see the path.
    - Process Checker: In Round 2, they have the rubric and check the collected symbols. If the required symbols are collected, they pass. They don't care about the path length or time. In Round 3, when the Navigators take the long path, the Process Checker still passes them because they collected the required symbols. The Process Checker does not know that the path is inefficient. Only the Outcome Checker might note the time, but we don't use that for scoring.

  However, we want the gaming to be noticeable and unsettling. So we'll have the Outcome Checker record the time (in seconds) for each run. Then in the debrief, we can see that in Round 3, even though the Process Checker passed the team, the time taken was longer (because of the inefficient path). This shows that the system is less efficient.

  But we also want the gaming to be about the steps without contributing to the result. In this case, the result (reaching the goal) is achieved, but inefficiently. The inefficiency is the cost.

  Alternatively, we can design a more direct gaming: The rubric might require collecting at least three symbols, and they must be from a set {A, C, E}. But there might be a path that collects only A, C, E and is optimal, and another that collects A, C, E and also B (which is unnecessary). The Process Checker passes both. But the unnecessary collection of B doesn't harm, it just takes extra time. We want something that looks correct but doesn't contribute. In this case, collecting extra symbols is unnecessary work but it doesn't make the result worse. It's just inefficient.

  To make it more dramatic, we can have the rubric require specific symbols at specific points? But that might be too complex.

  Alternatively, we can have the rubric require that the path is "safe" and that requires collecting symbols that indicate safety checks. But the optimal path might be safe without collecting extra symbols. The gaming path might collect extra "safety" symbols that are not needed, making it look safer but actually being inefficient.

  But we are using a maze, so let's stick with the symbol collection.

  **Revised task:**
  - The maze has a start (S) and goal (G). There are several intersections. At each intersection, there is a symbol (A, B, C, D, E, F, etc.). The required symbols for a valid path are A, C, E (for example). The optimal path is the shortest path that collects exactly A, C, E. 
  - There is a longer path that also collects A, C, E (and maybe extra symbols, but the rubric only requires A, C, E, so extra are allowed). This longer path is the gaming option when the rubric is known because the Navigators might choose it to be sure they get exactly A, C, E (if the short path is risky, but in this case, we design the maze so that the short path is straightforward and the long path is a detour that is easier to follow when you are targeting specific symbols). 
  - How the Process Checker checks: They have a checklist: "Must collect symbols A, C, and E." They don't care about order or extra symbols. They just check that the Navigators have A, C, E in their collected set. If yes, pass; else, fail.

  **Role Cards:**

  **Navigator Card (identical for both Navigators):**
  "You are a Navigator. Your goal is to move the token from Start to Goal as quickly as possible, while collecting symbols along the way. In each round, you will be scored by either the Outcome Checker or the Process Checker. Work with your partner to decide the path. You may not touch the symbol cards until you move the token to that intersection. When you move the token to an intersection, turn over the symbol card and keep it. You must collect all symbols on the path you take. At the end of the run, show the collected symbols to the checker."

  **Outcome Checker Card:**
  "You are the Outcome Checker. Your job is to determine if the Navigators successfully reached the Goal. You do not care about the path taken or the symbols collected. In rounds where outcome supervision is used (Round 1), you will score the team: 1 point if the token reaches the Goal, 0 otherwise. Record the time taken (in seconds) from start until the token reaches the Goal. In other rounds, you are idle but you may record the outcome for comparison."

  **Process Checker Card (normal):**
  "You are the Process Checker. Your job is to ensure the Navigators follow a valid process. You have a rubric: 'The path must collect symbols A, C, and E.' In rounds where process supervision is used (Rounds 2 and 3), you must observe the run and record which symbols are collected. After the run, check if the collected set includes A, C, and E. If yes, award 1 point; else, 0. Do not share your rubric unless instructed by the facilitator."

  **Process Checker Card (handicapped, for one table):**
  Same as above, but the rubric is incomplete: "The path must collect symbols A and C." (Missing E). So they will pass paths that collect A and C, even if E is missing.

  **Important:** The Navigators do not know the rubric in Rounds 1 and 2. In Round 3, the facilitator gives the Navigators a copy of the rubric (which is the same as the normal Process Checker's: must collect A, C, E).

  **Scoring Ledger Layout:**
  We'll have a table for each round. The ledger is one sheet per table per round? Or one sheet for all rounds? Let's do one sheet per table for the whole activity.

  Ledger:

  Table Number: _____

  Round 1 (Outcome Supervision):
