  Round 2 (Process Supervision, rubric hidden):
  - Symbols collected: __________
  - Process Check: Pass/Fail (based on rubric) [Scoring: 1 if Pass, 0 if Fail]
  - Outcome (for comparison): Goal reached? (Yes/No)
  - Time taken: _____

  Round 3 (Process Supervision, rubric published):
  - Symbols collected: __________
  - Process Check: Pass/Fail [Scoring: 1 if Pass, 0 if Fail]
  - Outcome: Goal reached? (Yes/No)
  - Time taken: _____

  Also, the Process Checker should record the symbols collected (to verify against the rubric). The Outcome Checker records the outcome and time.

  **Debrief:**
  We tally the results on the whiteboard. We create a table for each round and for each table, we record:
  - Round 1: How many teams succeeded (goal reached) and average time.
  - Round 2: How many teams passed process check? How many of those also reached the goal? How many failed the process check but reached the goal? Also, note the handicapped table: did they pass a team that missed symbol E? And did that team reach the goal? (Which they might have, because E might not be necessary for reaching the goal, only for the rubric.)
  - Round 3: Same as Round 2, but we also note the time. We expect that in Round 3, the average time might be higher because teams are taking longer paths to ensure they get the required symbols.

  Then we draw insights:
  1. Outcome supervision (Round 1): It was easy (just check the goal) and didn't require knowing the process. But some teams might have taken inefficient paths? We note that all teams that reached the goal got a point. But we don't know if they took a bad path? Actually, in Round 1, without a rubric, they might have taken a path that missed some required symbols (if there was a path that reached the goal without A, C, E) but we designed the maze so that there are multiple paths. We must design the maze so that there is at least one path that reaches the goal without collecting all the required symbols (for Round 2 to show false negatives?).

  Wait, let's design the maze properly:

  - Path 1 (optimal): Collects A, C, E. Shortest time.
  - Path 2: Collects A, B, C, D, E. Longer time, but still reaches goal and has the required symbols.
  - Path 3: Collects only A, B, D. Reaches goal but misses C and E. So in Round 1, Outcome Checker gives 1 point. In Round 2, if Process Checker has the full rubric, they fail because missing C and E. But in Round 2, without knowing the rubric, the Navigators might take Path 3 and fail the process check.

  Also, we want the handicapped checker: they have rubric "must collect A and C", so they would pass Path 3 (which has A and C) even though it misses E.

  In Round 3, when the rubric is known, Navigators will avoid Path 3 and take either Path 1 or Path 2. But if Path 1 is tricky to find, they might take Path 2 (the long one) to be safe. So the time in Round 3 might be higher than in Round 1 for the same team.

  Debrief points:

  1. Outcome supervision (Round 1): 
     - We saw that it was simple: if you reached the goal, you got credit. 
     - But notice that some teams took a path that missed important symbols (like C and E) but still reached the goal. They were lucky? Or the symbols weren't necessary? But in a real scenario, the symbols might represent safety checks. So outcome supervision endorsed a result that skipped steps.

  2. Process supervision (Round 2):
     - It required a checker who understood what steps were required (the symbols). 
     - At the handicapped table, the checker passed a team that missed E because their rubric was incomplete. So if the checker doesn't know the full requirements, bad processes can be passed. 
     - Also, we might have seen a team that took a valid path (with A, C, E) but the Process Checker made a mistake? But we assume they are accurate. Alternatively, we might have a team that took a valid path but the Process Checker thought they missed a symbol (if there was a recording error). But we want to avoid that. 
     - We also saw that some teams that reached the goal failed the process check (like Path 3) because they missed symbols. So process supervision can reject good outcomes (if we assume that reaching the goal is good, even without the steps). This is a false negative from the outcome perspective.

  3. Process supervision with known rubric (Round 3):
     - Now, the Navigators knew exactly what to collect. We saw that they all passed the process check (because they targeted the symbols). 
     - But look at the time: it might have increased because they took longer paths to ensure they got the symbols. They were gaming the rubric: they focused on the checklist, not on the efficiency of the path. 
     - This is "rubric gaming": the checklist became the target, and they optimized for that, even if it meant being inefficient.

  Then we introduce the vocabulary: 
  - Outcome-based supervision: judging only the final result.
  - Process-based supervision: judging the steps.
  - Reward hacking / Goodhart's law: when a measure becomes a target, it ceases to be a good measure.

  **Anticipated Problems and Recovery:**

  1. Problem: Navigators in Round 1 might take a long time to solve the maze, holding up the round.
     - Recovery: Set a time limit (e.g., 5 minutes) for each run. If they don't reach the goal, it's a failure.

  2. Problem: In Round 2, the Process Checker might accidentally reveal the rubric.
     - Recovery: Emphasize in the role card that they must keep the rubric secret. If it happens, note it for the debrief as an example of information leakage.

  3. Problem: The Navigators in Round 3 might still take the optimal path and not the gaming path, so the effect isn't observed.
     - Recovery: Design the maze so that the optimal path is hard to find (e.g., many dead ends) and the gaming path (the long one that collects all symbols) is straightforward. Or, during the instructions for Round 3, say: "You now know the rubric. Plan your path to ensure you collect exactly the required symbols." This might lead them to choose the more obvious (but longer) path.

  4. Problem: The handicapped table might not notice the issue.
     - Recovery: In the debrief, specifically ask that table about their results. Ask: "Did you pass a team that missed a symbol? Which one? And did they reach the goal?" Then connect to insight 2.

  **Frank Closing Note:**
  The activity simplifies real supervision:
  - In real AI systems, the training signal is generated at scale (thousands of trials), not a single run. The facilitator must explain that the gaming behavior emerges over many iterations.
  - In real systems, the agent (like an AI) is not deliberately strategizing to game the system; it is optimizing the reward signal. The facilitator must clarify that the human participants' deliberate strategy is a proxy for the AI's optimization.
  - The activity uses human checkers, but in practice, process supervision might be automated (e.g., by another AI). The cost of having a competent checker is even more critical when the checker is also an AI that must be trained.
  - The activity focuses on a single task. In reality, systems must generalize across tasks, and the gaming might be more subtle.

  With these in mind, we proceed to the full activity write-up.
answer: |-
  ### Brainstorming Section

  I considered three distinct activity mechanisms to achieve the learning goal:

  1. **Assembly Line with Quality Control (Hidden Role):**  
     Performers assemble simple devices (e.g., paper airplanes) using a "correct" method. Checkers inspect either final flight distance (outcome) or adherence to assembly steps (process). When the step checklist is published, performers skip functional steps but add useless decoy actions (e.g., unnecessary folds) to mimic compliance.  
     *Weakness:* Task success (flight distance) is noisy and influenced by luck, muddying the "skill vs. luck" insight.

  2. **Contract Bidding Market:**  
     Teams bid to complete tasks (e.g., solving puzzles). Outcome supervisors pay only for correct answers; process supervisors pay for documented step-by-step work. When the step rubric is published, performers "over-document" trivial steps (e.g., "checked pen ink level") to inflate compliance without aiding results.  
     *Weakness:* Market dynamics might overshadow supervision trade-offs, and "gaming" could feel artificial.

  3. **Maze Auditing Tournament (Selected):**  
     Navigators solve paper mazes with hidden "safety checkpoints." Outcome checkers reward reaching the exit; process checkers require collecting specific checkpoint tokens. When the token list is published, Navigators take inefficient detours to collect tokens without aiding navigation.  
     *Why chosen:* The maze makes "gaming" feel organic (detours seem diligent), tokens create visible step compliance, and time tracking exposes inefficiency. Handicapped checkers (incomplete token lists) naturally demonstrate insight 2.

  ---

  ### Materials and Preparation  
  **To print/prepare (for 24 participants):**  
  - **6 × Maze sheets** (identical, A3 paper):  
    ![](https://via.placeholder.com/400x300?text=Maze+with+Start%2FGoal+and+10+intersections+%28labeled+1-10%29)  
    *Design:* Start (S) to Goal (G) with 10 intersections. Shortest path (5 steps) passes intersections 2→4→7→9→G. "Risky shortcut" path (4 steps): 1→3→8→G (quicker but misses tokens).  
  - **6 × Symbol card sets** (10 cards per set, pre-cut index cards): Cards labeled A–J, each corresponding to one intersection (e.g., Intersection 1: Card A; Intersection 2: Card B). Place face-down at intersections during setup.  
  - **6 × Role cards** (4 cards per table, pre-cut):  
    - Navigator (×18 copies): *"Goal: Reach exit fastest. Collect symbols at intersections. Score: Points for approval."*  
    - Outcome Checker (×6): *"Approve ONLY if token reaches Goal. Record time. Score: 1 pt if approved."*  
    - Process Checker (×5 normal): *"Approve ONLY if tokens B, D, F are collected. Secret! Do not share."*  
    - Process Checker (×1 handicapped): *"Approve ONLY if tokens B, D are collected. Secret! Do not share."*  
  - **6 × Scoring ledgers** (clipboard-sized sheets; template in section F).  
  - **1 × Whiteboard tally sheet** (pre-drawn grid for debrief).  
  - **Timer.**  

  **Provided per table:** Pens, paper, token (coin/button).  

  **Prep:** Place symbol cards face-down at intersections. Assign one table the handicapped Process Checker card.  

  ---

  ### Timeline (90 Minutes)  
  **0–5 min: Intro**  
  > "Today’s activity explores decision-making under supervision. Each table has Navigators solving a maze and Checkers scoring them. Your goal: Maximize your team’s points. Rules are on your cards."  

  **5–10 min: Setup**  
  Distribute role cards, ledgers, and materials. Answer clarifying questions only.  

  **10–25 min: Round 1 (Outcome Supervision)**  
  - Navigators: Solve maze. Move token, collect symbols.  
  - Outcome Checker: Watch exit only. Record time and approve if goal reached.  
  - Process Checker: Observe but inactive.  
  - *End:* Record approvals on ledger.  

  **25–40 min: Round 2 (Process Supervision, Hidden Rubric)**  
  - Navigators: New attempt.  
  - Process Checker: Verify collected tokens against secret rubric. Approve if matched.  
  - Outcome Checker: Record time/goal (for comparison).  
  - *End:* Record approvals.  

  **40–55 min: Round 3 (Process Supervision, Published Rubric)**  
  - **Publish rubrics:** Give all Navigators a card: *"Process approval requires tokens B, D, F."*  
  - Navigators: Solve with rubric known.  
  - Checkers: Same as Round 2.  
  - *End:* Record approvals.  

  **55–65 min: Ledger Tally**  
  Tables finish ledgers. Facilitator collects "Approval" and "Time" data per round for whiteboard.  

  **65–80 min: Debrief** (Structure in section G)  

  **80–90 min: Conclusion**  
  Connect to AI, address limitations (section I).  

  ---

  ### Task Specification  
  **Task:** Guide token from Start (S) to Goal (G) on maze. Collect symbol cards at each intersection passed.  

  **Correct Method:**  
  - Optimal path: S→2→4→7→9→G (5 steps, collects B, D, F).  
  - Valid but inefficient: S→1→2→4→5→7→9→G (7 steps, collects A, B, D, E, F).  

  **Shortcut:**  
  - "Risky" path: S→1→3→8→G (4 steps, collects A, C, H). Reaches goal fastest but misses B, D, F.  
  - **Gaming tactic (Round 3):** Navigators take S→1→2→4→6→7→9→G (7 steps, collects A, B, D, E, F). This path collects required tokens (B, D, F) but adds wasteful detours (intersections 1, 6). Time increases by ~40% vs. optimal path.  

  **Checker Detection:**  
  - Outcome Checker: Approves all goal-reaching paths (including shortcut/gaming). Cannot detect missing tokens.  
  - Process Checker:  
    - Normal: Approves only with B, D, F. Rejects shortcut (no B, D, F) and gaming path (has B, D, F).  
    - Handicapped: Approves with B, D. Approves shortcut (has D) but rejects optimal path (no B? See note).  
    *Note:* Handicapped table’s optimal path collects B, D, F, but checker ignores F → still approves.  

  ---

  ### Role Card Text (Verbatim)  
  **Navigator (all rounds):**  
  > "GOAL: Get your token to GOAL (G) as fast as possible.  
  > - Move the token 1 intersection at a time.  
  > - At each intersection, turn over the symbol card and keep it.  
  > - When reaching G, show collected cards to Checker.  
  > SCORING: Your team gets 1 pt if the active Checker approves your run. Maximize total points!"  

  **Outcome Checker (active Round 1; observer Rounds 2–3):**  
  > "GOAL: Approve runs ONLY if the token reaches GOAL (G).  
  > - Record time (seconds) from start to G.  
  > - IGNORE symbols.  
  > - In Round 1: Award 1 pt if G is reached.  
  > - In Rounds 2–3: Record if G is reached (for ledger), but NO scoring power."  

  **Process Checker - Normal (active Rounds 2–3):**  
  > "GOAL: Approve runs ONLY if tokens B, D, F are collected. DO NOT reveal this.  
  > - Watch the run. After reaching G, check collected cards.  
  > - In Rounds 2–3: Award 1 pt ONLY if B, D, F are all present.  
  > - Record collected tokens on ledger."  

  **Process Checker - Handicapped (active Rounds 2–3):**  
  > "GOAL: Approve runs ONLY if tokens B, D are collected. DO NOT reveal this.  
  > - Watch the run. After reaching G, check collected cards.  
  > - In Rounds 2–3: Award 1 pt ONLY if B AND D are present.  
  > - Record collected tokens on ledger."  

