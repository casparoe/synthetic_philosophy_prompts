prompt: |-
  Every year our admissions committee proposes a new ordeal for applicants — a non-refundable fee, a trial residency, a public confession of some past error — and I have grown suspicious of my own enthusiasm for these. I direct a small residential fellowship, roughly thirty places a year from several hundred applications, and "it's a costly signal, so it must select for the right people" has become the committee's substitute for an argument. Write a decision procedure we could run on any proposed costly requirement before adopting it: the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure terminates in rejection, and the points where it hands the decision back to us because the question is one of values rather than facts.

  Ground it in what signaling theory can actually hand a non-specialist. I want the differential-cost condition made usable — a requirement is informative only if it costs the applicants we want less than the applicants we don't — along with the difference between an unfakeable index and a handicap that can simply be bought, what makes unenforced talk credible when interests coincide, what a receiver's response does to a signal's value across successive cohorts, the gap between evidence of a trait and possession of it, and the possibility that the candidates we most want are the ones least inclined to signal at all. Flag which steps are judgment calls dressed as arithmetic, and be explicit about what the procedure cannot settle — in particular, what to do when a cost works not by revealing a type but by changing the person who pays it.

  Then run it on three proposals: a $500 non-refundable application fee; a required public essay describing something the applicant got badly wrong; and an unpaid two-week trial residency. At least one should come out "no" despite the committee's fondness for it, and I want the reasoning shown rather than the verdict alone.
reasoning: |-
  Hmm, the user runs a small residential fellowship program and is concerned about their committee's reliance on costly signals for applicant selection. They want a structured decision procedure grounded in signaling theory that can evaluate proposed requirements like fees, essays, or trial residencies.

  The user is clearly frustrated with the committee's lazy justification of "it's costly so it must work" and wants something more rigorous. They specifically mention several key signaling theory concepts that need to be incorporated: differential costs, unfakeable indexes vs. buyable handicaps, credible talk when interests align, how receiver responses affect signal value over time, the gap between evidence and actual traits, and the possibility that ideal candidates might avoid signaling altogether.

  I need to build a step-by-step procedure that addresses all these concerns. It should have clear evaluation points, termination rules, and flags for when decisions require value judgments rather than factual analysis. The procedure must also account for when costs change applicants rather than reveal their type - something signaling theory doesn't handle well.

  For the three test cases: 
  - The $500 fee likely fails on differential cost since financial barriers often exclude qualified candidates from disadvantaged backgrounds. 
  - The public confession essay might work if it reveals genuine insight, but could be faked or deter humble candidates. 
  - The unpaid trial residency is problematic as it favors those who can afford unpaid work and may not predict actual fellowship performance.

  The procedure should be structured as a flowchart with concrete questions, evaluation criteria, and clear decision points. I'll need to show exactly where value judgments come in versus where signaling theory provides clear answers. The test cases will demonstrate how to apply it, with at least one (probably the fee) getting rejected despite committee enthusiasm.

  Key challenges will be making abstract concepts like "differential cost" operational and distinguishing between what signaling theory can decide versus what requires human judgment about program values. The "changing versus revealing" dilemma is particularly tricky since signaling theory assumes fixed types.
answer: |-
  Here’s a decision procedure grounded in signaling theory, designed to evaluate costly requirements for your fellowship admissions. It forces explicit reasoning about **what the cost reveals**, **to whom**, and **at what collateral damage**. Signaling theory’s core insight: **A signal is useful only if it separates types (e.g., "desired" vs. "undesired" applicants) by being *differentially costly* for them to send.**

  ### The Decision Procedure
  *(Run sequentially. Terminate early if any step yields "Reject" or "Judgment Required".)*

  1.  **Define the Claimed Trait:** *"What specific, desirable trait or quality (T) does the committee believe this requirement reveals?"*
      *   *Sufficient Answer:* A concrete, observable trait *relevant to fellowship success* (e.g., "seriousness of intent," "resilience," "intellectual humility," "specific skill X," "cultural fit"). Vague traits like "dedication" are insufficient.
      *   *Terminate/Reject if:* No clear, relevant trait T is identified, or T is irrelevant to the fellowship's goals. *Judgment Required:* Defining T inherently involves values.

  2.  **Differential Cost Test:** *"Is the cost (C) of meeting this requirement *significantly lower* for applicants possessing trait T than for those lacking it?"*
      *   *Analysis:* Consider financial cost, time/opportunity cost, psychological cost, social cost, etc. *Crucially, "cost" is subjective to the applicant.*
      *   *Sufficient Answer (Proceed):* A plausible, evidence-based argument why T genuinely reduces C (e.g., "Applicants with genuine passion for our niche field find writing a 10-page essay *less burdensome* than those applying broadly"). *Flag:* This is often a judgment call disguised as logic. **Signaling theory's core contribution.**
      *   *Terminate/Reject if:* C is likely *higher* for desired applicants (e.g., fee excludes talented low-income candidates; unpaid residency favors the wealthy who don't need income); C is roughly equal for all types (reveals nothing); or the cost is primarily borne by the *program*, not the applicant (not a signal).
      *   *Judgment Required:* If the differential cost argument is plausible but hinges on untested assumptions about applicant psychology/socioeconomics.

  3.  **Signal Type & Faking:** *"Is this signal primarily an *index* (unfakeable) or a *handicap* (costly but potentially faked/bought)?"*
      *   *Analysis:*
          *   **Index:** Inherently linked to T (e.g., age, certain credentials, *genuine* physiological traits). Hard/impossible to fake. *Highly reliable if T is correctly defined.*
          *   **Handicap:** Costly action intended to correlate with T (e.g., fee, essay, elaborate project). Can often be faked (inauthentic essays) or bought (outsourcing work, paying fees if wealthy).
      *   *Sufficient Answer (Proceed):* Acknowledge the type. For handicaps, propose how fakability is mitigated (e.g., verification steps, structure reducing room for dishonesty). Indices are stronger signals but rare for soft traits.
      *   *Terminate/Reject if:* It's a handicap with *no plausible mitigation for fakability* AND T is easily faked (e.g., a generic "passion" essay).
      *   *Judgment Required:* Assessing the *degree* of fakability risk and the adequacy of mitigations.

  4.  **Credibility of Talk (If Applicable):** *"If the requirement involves verbal claims (e.g., essays, interviews), do the applicant's interests *align* with the program's regarding the truthfulness of those claims *specifically about T*?"*
      *   *Analysis:* Credible talk requires **aligned incentives**. If lying about T benefits the applicant *and* the program can't easily detect it, the signal is cheap talk and unreliable. If truth-telling benefits the applicant *given the program's goals*, it's credible.
      *   *Sufficient Answer (Proceed):* Explain why applicants possessing T have a strong incentive to tell the truth *and* those lacking T have a strong disincentive to lie (or why lying is hard/detectable) *about T specifically*. (e.g., "Admitting someone lacking true intellectual humility would harm their experience and our community; they have incentive to self-select out if they can't write convincingly").
      *   *Terminate/Reject if:* Interests are misaligned and lying/faking is easy and beneficial (e.g., claiming false humility if it's perceived as the "right answer").
      *   *Judgment Required:* Gauging applicant incentives and alignment of interests.

  5.  **Signal Degradation & Equilibrium:** *"How might applicant behavior and the signal's meaning change over successive application cycles if we adopt this?"*
      *   *Analysis:* Signals can degrade. Applicants learn what's rewarded. "Undesired" types might mimic signals or find cheaper ways to fake them. The signal may select for "good signalers" rather than "good fellows". The initial differential cost might erode.
      *   *Sufficient Answer (Proceed):* Acknowledge potential degradation and propose monitoring or inherent stability (e.g., an index is stable; a well-designed handicap is hard to game cheaply).
      *   *Terminate/Reject if:* The signal is highly gameable or likely to quickly become a costly ritual with little information (e.g., a unique essay prompt quickly spawns online templates).
      *   *Judgment Required:* Predicting behavioral adaptation is speculative but necessary.

  6.  **Evidence vs. Trait Gap:** *"Does demonstrating this signal *necessarily* imply possession of trait T? What other reasons might someone pay this cost?"*
      *   *Analysis:* Signaling shows *evidence*, not proof, of T. People pay costs for many reasons: desperation, manipulation, error, wealth (reducing subjective cost), misaligned values.
      *   *Sufficient Answer (Proceed):* Acknowledge the gap. Argue why paying cost C is *strongly correlated* with T *despite* other possible motivations, leveraging insights from Steps 2-4.
      *   *Terminate/Reject if:* Paying C is easily explained by common factors *unrelated* to T (e.g., paying a high fee just means you have $500; doing an unpaid residency means you have no dependents/other income needs).
      *   *Judgment Required:* Weighing the strength of the correlation between signal and trait.

  7.  **Self-Selection of the Best:** *"Could this requirement deter our *most* desired applicants (possessing T strongly) while being paid by less suitable ones?"*
      *   *Analysis:* Ideal candidates might find the cost unjust, demeaning, irrelevant, or a poor use of time. Less ideal candidates might see it as a hoop to jump through.
      *   *Sufficient Answer (Proceed):* Argue why applicants strongly possessing T are *more* likely, not less, to pay C (linking back to Step 2 - Differential Cost). Or acknowledge the risk as minor/acceptable.
      *   *Terminate/Reject if:* There's a strong rationale that the best candidates would find C particularly off-putting or misaligned with their values (e.g., humble geniuses refusing to boast; principled candidates rejecting exploitative fees/residencies).
      *   *Judgment Required:* Assessing applicant psychology and values alignment.

  8.  **The Transformation Question:** *"Might paying this cost *change* the applicant in a way relevant to T, rather than just revealing it?"*
      *   *Analysis:* This is **outside standard signaling theory** (which assumes types are fixed). Does the ordeal build resilience? Does the confession induce genuine reflection? Or does it breed resentment?
      *   *Sufficient Answer (Proceed/Judgment):* If change is claimed, the committee must explicitly state: (a) What change is intended? (b) Is this change desirable *per se*? (c) Is there evidence this cost *causes* that change? This is primarily a **Value Judgment**. Signaling theory offers little help.
      *   *Terminate/Reject if:* The requirement is justified *solely* by hoped-for transformation without evidence or clear desirability.
      *   *Judgment Required:* Inherently. This is about values and causal efficacy, not revelation.

  **Termination Points:**
  *   **Reject:** Steps 1 (No T), 2 (Cost higher for desired/equal), 3 (Unmitigated fakability), 4 (Misaligned incentives), 5 (High degradation risk), 6 (Weak/no correlation), 7 (Strong deterrence of best).
  *   **Judgment Required:** Steps 1 (Defining T), 2 (Plausibility of diff cost), 3 (Adequacy of fakability mitigation), 4 (Incentive assessment), 5 (Degradation likelihood), 6 (Correlation strength), 7 (Deterrence risk), 8 (Transformation desirability/efficacy).
  *   **Proceed (Conditional Approval):** If the requirement passes Steps 1-7 with sufficient answers and the committee accepts the value judgments flagged in Step 8.

  **What the Procedure Cannot Settle (Requires Committee Deliberation):**
  1.  **The definition of the desirable trait (T - Step 1).** What *really* makes a fellow successful here?
  2.  **The acceptability of collateral damage.** Excluding qualified low-income applicants (Step 2), deterring principled candidates (Step 7), psychological burdens.
  3.  **The value of transformation (Step 8).** Is changing applicants part of the fellowship's role? Is the proposed change good?
  4.  **Weighing trade-offs.** Does the *potential* signal value outweigh the costs (administrative, financial, ethical, reputational)?
  5.  **When evidence is ambiguous.** Plausible arguments on both sides in Steps 2, 6, 7.

  ---

  ### Evaluation of Proposals

  **Proposal 1: $500 Non-Refundable Application Fee**

  1.  **Claimed Trait (T):** "Seriousness of intent" (committee's implied T).
  2.  **Differential Cost Test:** **FAIL.** *Cost C is almost certainly HIGHER for desired applicants.*
      *   Desired applicants likely include talented individuals from low-income backgrounds, countries with weak currencies, or those applying to many programs. $500 is a major barrier.
      *   Undesired applicants (e.g., wealthy dilettantes, those applying recklessly) find $500 trivial. It *doesn't* cost them more subjectively.
      *   *Reject:* This fails the core condition. It selects for wealth/ability to pay, not "seriousness" relative to one's means. Wealthy unserious applicants pay easily; poor serious applicants are excluded.
  3.  *(Terminate: Reject based on Step 2)*.
      *   **Verdict: REJECT.** Despite committee fondness, it fails signaling theory's fundamental test. It's a wealth filter, not a seriousness signal.

  **Proposal 2: Required Public Essay Describing Something the Applicant Got Badly Wrong**

  1.  **Claimed Trait (T):** "Intellectual Humility" and "Capacity for Growth/Reflection".
  2.  **Differential Cost Test:** **PLAUSIBLE PASS (Judgment Call).**
      *   *Argument:* Applicants possessing genuine humility/growth mindset find reflecting on errors less psychologically costly (though still uncomfortable). They have authentic material. Applicants lacking humility find admitting fault deeply costly (to ego, self-image) and may struggle to write convincingly. *Flag:* Requires assuming psychological cost differences exist and are significant. Some humble people hate public confession; some narcissists are good at faking contrition.
  3.  **Signal Type & Faking:** **HANDICAP with Fakability Risk.**
      *   *Analysis:* Easily faked. Applicants can fabricate or trivialize mistakes, write what they think the committee wants ("I worked too hard!"), or outsource. *Mitigation?* Structure helps (e.g., require specific details: what happened, your role, how you realized it was wrong, what you learned/changed). Authenticity is hard to guarantee. *Judgment Required:* Is the fakability risk acceptable given mitigations? Is the structure good enough?
  4.  **Credibility of Talk:** **ALIGNED INCENTIVES (Conditional Pass).**
      *   *Analysis:* Interests *can* align. The program values truthfulness about learning from error. Applicants who genuinely learn from mistakes know that faking this invites poor fit/misery and may self-select out. Those who fake it risk being exposed later or being unhappy. *But...* If applicants believe faking is easy and rewarded, incentives misalign. Structure (Step 3 Mitigation) is key to alignment.
  5.  **Signal Degradation:** **MODERATE RISK.**
      *   *Analysis:* Templates, coaching, and "humblebrag" formulas will emerge ("I cared too much about saving orphans!"). However, a well-structured prompt requiring concrete evidence of change might resist degradation better than a generic one. *Judgment Required:* Monitor quality year-to-year.
  6.  **Evidence vs. Trait Gap:** **SIGNIFICANT GAP.**
      *   *Analysis:* A great essay shows writing skill and knowledge of the "confession genre," not necessarily genuine humility or growth. People can describe real mistakes without learning, or learn without being able to articulate it well. *Judgment Required:* How strong is the link between *articulating* growth and *embodying* it? Committee must interpret essays carefully.
  7.  **Self-Selection of the Best:** **POTENTIAL RISK.**
      *   *Analysis:* Truly humble, reflective candidates might find public confession performative or distasteful and avoid applying. Less reflective candidates might see it as just another essay. *Judgment Required:* How likely is this? Does the prompt's framing mitigate it?
  8.  **Transformation Question:** **POTENTIAL VALUE.**
      *   *Analysis:* The act of writing *might* induce genuine reflection for some applicants. *Judgment Required (Value):* Is this desirable? (Probably yes). Is it likely? (Maybe for some). Relying on this effect is speculative; the primary justification should be revelation.
      *   *Committee must decide:* Is the potential for revelation (with acknowledged fakability risk/gap) and possible reflection worth the cost (applicant time/comfort, committee reading) and the risk of deterring some good candidates?

  **Verdict: JUDGMENT REQUIRED.** Signaling theory doesn't reject it outright (unlike the fee). It *might* work as a signal due to differential *psychological* cost, but fakability, the evidence gap, and self-selection risks are real. The committee must decide if the potential signal strength and value of reflection outweigh these risks and costs. *It could be a qualified "yes" with a very well-designed prompt and evaluation rubric, but it's not a slam-dunk signal.*

  **Proposal 3: Unpaid Two-Week Trial Residency**

  1.  **Claimed Trait (T):** "Fit with the community," "Work Ethic," "Specific Skills," "Ability to contribute."
  2.  **Differential Cost Test:** **FAIL.**
      *   *Analysis:* Cost C (2 weeks unpaid labor + travel/lodging) is *objectively massive* and *subjectively higher for desired applicants.*
          *   Desired applicants likely include those with current jobs (can't take unpaid leave), care responsibilities, or limited savings. This cost is prohibitive.
          *   Undesired applicants might include the independently wealthy, those between jobs, or those with flexible/poorly paid gig work. The cost is *lower* for them subjectively. They can afford the time/money.
      *   *Reject:* Fails the core test catastrophically. It selects for financial privilege and lack of current commitments, not "fit" or "work ethic" in a way relevant to the actual fellowship period. A rich slacker can attend easily; a dedicated, talented single parent cannot.
  3.  *(Terminate: Reject based on Step 2)*.
      *   **Verdict: REJECT.** This is likely illegal in many jurisdictions (violating minimum wage laws for "trial work"). Even if legal, signaling theory shows it's an appallingly bad filter. It reveals wealth and availability, not the desired traits relative to applicant circumstances. The committee's fondness for it is likely based on seeing the *outcome* (those who attended seemed good) while being blind to the *selection effect* (who was excluded).

  ---

  **Conclusion:** The procedure forces scrutiny beyond "costly = good." It killed the fee and the unpaid residency on fundamental differential cost grounds. The public confession essay survived initial signaling theory hurdles but requires careful implementation and value judgments about fakability, deterrence, and the role of reflection. It highlights that the most enthusiastic committee proposals (fee, residency) are often the worst signals, disproportionately excluding the very candidates they seek. Use this procedure to demand evidence for differential cost *before* falling for the allure of the ordeal.
