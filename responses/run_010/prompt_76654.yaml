prompt: |-
  I'm in a grad-ish undergrad seminar on decision theory and diachronic agency and I owe my prof a term paper proposal by Friday. Topic I've landed on is the absent-minded driver, but not the usual take. The usual take is a fight between plan consistency and action consistency: ex ante the driver should keep going at the first junction and exit at the second, but once he's actually at a junction and can't tell which one it is, is he rational to stick with that? My worry is that this framing already half-assumes the answer, because what the driver should do at the junction depends entirely on what he should *believe about himself* there — which junction he's at is a self-locating fact, and the normal recipe (conditionalize on your evidence) gets weird when part of the evidence is that you are or aren't following a plan you can't remember adopting. So basically: sleeping beauty with a steering wheel.

  Could you turn that into a real proposal? I need: the research question stated sharply enough that it could come out with a determinate answer, a short section on why the two standard positions don't settle it, the method — what I'd actually do and in what order across a 12 week semester — and why that approach instead of just re-running the game theory with fancier notation. Then what a satisfying result would look like, what would count as the project failing, and an honest read on whether any of it is too big for one paper. I'll do the citations myself so no bibliography please.

  Also: how confident are you that the self-locating-belief angle is actually a different question and not just relabeling the plan/action one in centerd-belief vocabulary? If you think I'm building this on a confused premise, or that the case just dissolves once you fix the beliefs properly, say that plainly instead of writing me a nice proposal around a bad idea.
