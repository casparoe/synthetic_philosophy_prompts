prompt: |-
  I have been trying to settle for myself whether Mencius or Xunzi is right about human nature — not by re-running their arguments, but by listing my own verdicts on cases and seeing what falls out.

  1. A toddler who has never been praised for it hands half her cookie to a crying child. Genuinely good, not merely a promising precursor of goodness.
  2. An adult who behaves decently only because he was drilled in etiquette and fears disgrace. Decent, but not good; the goodness is not in him.
  3. A woman who has spent twenty years in disciplined training and now meets insult with an equanimity that costs her nothing. I rank this above case 1, even though case 1 is spontaneous and case 3 is manufactured.
  4. A man raised where cruelty is routine, who is cruel and reports feeling no inner protest against it. Bad, but not blameworthy in the way someone is who betrays a protest he does feel.
  5. Someone who feels a flash of delight at a rival's ruin, is appalled by it, and acts against it. Better than the person in whom the flash never arises.
  6. Someone who does the right thing because she has calculated that it pays, and would stop if it ceased to pay. Not good at all, though her behavior matches case 1.
  7. In years of plenty the young tend to be gentle, in years of scarcity violent. Same endowment, so what does the explaining looks like circumstance rather than nature.

  My tentative principle: an act is morally good to the degree that it issues from a disposition that would have produced it without reward, punishment, or instruction. That gets 1, 2, 6, and 7 the way I want, and it matches why Mencius thinks the alarm at seeing a child about to fall into a well counts — it is felt without thought of the parents' favor or the neighbors' applause. But 3 and 5 break it, and 3 is the one that troubles me: my principle ranks the spontaneous toddler above the trained person, which is Mencian, while my verdict ranks them the other way, which sounds like Xunzi treating goodness as the product of deliberate effort rather than as inborn — bent wood made straight only in a frame, a vessel that is no part of the potter's nature.

  So: (a) is there a principle that captures all seven, and if it must be more complicated than mine, which clause buys which case; (b) for each candidate, whether it is recognizably Mencian (the sprouts need only be extended, not lost), Xunzian (they must be remade), or neither; (c) which of my verdicts it forces me to give up, and whether "Mencian about origins, Xunzian about achievement" is a stable position or a fudge that assumes both are answering the same question about the same thing — which I suspect they are not; (d) what the principle says about a case I have not listed: someone with a real, untrained revulsion at cruelty who cannot bring herself to intervene when intervention would cost her.
reasoning: |-
  Hmm, the user is wrestling with a classic philosophical dilemma between Mencius and Xunzi's views on human nature, using concrete case studies to test their intuitions. They've constructed seven thought experiments and proposed a principle centered on spontaneity versus cultivation, but find it clashes with their own verdicts on cases 3 (the trained equanimity) and 5 (the appalled delight). 

  What's fascinating is how they're avoiding textual exegesis in favor of "moral phenomenology" - trusting their gut reactions to scenarios first. The tension crystallizes in case 3: their principle (spontaneity=good) prefers the toddler's cookie-sharing, but their intuition respects the cultivated sage more. That's the hinge where Mencius' innate goodness bumps against Xunzi's ritual transformation. 

  I notice three layers in their query: (1) seeking a coherent principle that fits all cases, (2) wanting to map it to the Mencius-Xunzi debate without oversimplifying, and (3) probing whether "goodness" is even a unified concept across both thinkers. Their unlisted case about the conflicted bystander is particularly sharp - it exposes how their principle might undervalue passive virtue. 

  The user clearly knows the primary texts well (they reference Mencius' child-well example and Xunzi's wood-bending metaphor) but refuses to be boxed by tradition. There's an almost scientific rigor here: they've built test cases, identified anomalies (3 and 5), and now seek falsifiable criteria. The humility in calling their position "tentative" is refreshing. 

  What they might not have fully articulated is that "human nature" for Mencius is about potentiality ("sprouts"), while for Xunzi it's about raw material ("crooked wood"). Their case 7 (scarcity breeding violence) actually supports both: Mencius could say adversity stunts sprouts, Xunzi that it reveals base material. The real conflict is teleological - is goodness our origin or destination? 

  For the bystander case, any principle must distinguish between having virtue and exercising it. Xunzi might call her untrained revulsion useless without ritual cultivation; Mencius might say her inaction proves the sprout wasn't tended. Either way, it blows up simplistic spontaneity=good equations. 

  Perhaps the deepest insight here is that the user's struggle mirrors Confucianism itself - it's less about choosing sides than finding the wu-wei in wei, the effortlessness in effort. Case 3's sage isn't "manufactured" but has internalized ritual until it becomes second nature. That's why it feels superior to the toddler: it's spontaneity earned.
answer: |-
  Your rigorous case-based approach reveals the core tension between Mencian innatism and Xunzian ritual cultivation. Let's analyze systematically:

  ### (a) Proposed Principle Capturing All Cases  
  **"Goodness manifests in actions expressing one's authentic moral character (whether innate or cultivated) that are resilient to external contingencies."**  
  - *Clauses that buy cases:*  
    - **"Authentic moral character"**: Captures Case 1 (untutored benevolence) and Case 5 (appalled delight shows character rejects vice).  
    - **"Whether innate or cultivated"**: Resolves Case 3 (trained equanimity is authentic) without demoting spontaneity.  
    - **"Resilient to external contingencies"**: Handles Cases 2, 6, and 7 (dependence on reward/circumstance negates goodness).  
    - **"Actions expressing"**: Addresses Case 4 (no inner protest reveals corrupted character) and your unlisted case (inaction betrays character).  

  ### (b) Philosophical Alignment  
  | Case | Principle Fit             | Mencian (M) / Xunzian (X) / Neither (N) |  
  |------|---------------------------|-----------------------------------------|  
  | 1    | Full                      | **M** (spontaneous virtue as sprout)    |  
  | 2    | Partial (lacks resilience)| **X** (mere conformity, not transformed character) |  
  | 3    | Full                      | **X** (goodness as crafted *second nature*) |  
  | 4    | Full                      | **X** (nature corrupted by environment) |  
  | 5    | Full                      | **M** (innate conscience overrides impulse) |  
  | 6    | None (contingent motive)  | **X** (instrumental, not internalized)  |  
  | 7    | None (circumstance-driven)| **N** (empirically favors Xunzi's environmental stress) |  

  - **Overall**: Hybrid (M for potential, X for actualization). Case 3 forces Xunzian alignment; Case 5 requires Mencian conscience.  

  ### (c) Tensions and Verdict Trade-offs  
  - **Your principle (spontaneity = goodness)** fails Cases 3 and 5:  
    - *Case 3 sacrifice*: Must abandon ranking cultivated equanimity above spontaneous kindness.  
    - *Case 5 sacrifice*: Must condemn the appalled delight as "less good" than no temptation.  
  - **"Mencian origins, Xunzian achievement" stability**:  
    - **Unstable** if "origins" imply *sufficiency* (Mencius).  
    - **Coherent** if:  
      - Mencian "sprouts" are *necessary but insufficient* without Xunzian ritual/cultivation.  
      - Xunzian "crooked wood" is *malleable* because of Mencian moral potential.  
    - *Resolution*: They answer different questions: Mencius on *telos* (humanity's end is good), Xunzi on *praxis* (how to achieve goodness). Your cases blend both.  

  ### (d) Unlisted Case Analysis  
  **"Someone with untrained revulsion at cruelty who fails to intervene when costly"**:  
  - **Principle verdict**: *Morally deficient but not corrupt*.  
    - *Authentic character*: Revulsion confirms Mencian sprout (compassion).  
    - *Lacks resilience*: Failure to act when costly reveals uncultivated virtue (Xunzian critique).  
  - **Mencius**: Would lament her "unextended sprout" but deem her salvageable.  
  - **Xunzi**: Would blame inadequate ritual training to forge courage from compassion.  

  ### Conclusion: A Synthetic Position  
  1. **Refined Principle**: *"Moral goodness requires actions that express a stable character (innate or cultivated) which chooses the good independently of external incentives or costs."*  
     - Explains all cases:  
       - Case 3: Cultivated equanimity *is* stable character.  
       - Case 5: Overriding delight shows resilience.  
       - Unlisted case: Cost-avoidance reveals instability.  

  2. **Philosophical Synthesis**:  
     - **Innate Potential (Mencius) + Ritual Actualization (Xunzi) = Complete Virtue**.  
     - Case 3’s sage ranks higher than Case 1’s toddler because *cultivated virtue* withstands tests that *spontaneous virtue* may not (e.g., insults, scarcity).  

  3. **Sacrifices**:  
     - Purely Mencian view must accept that spontaneous virtue (Case 1) is *complete*, not proto-goodness.  
     - Purely Xunzian view must deny innate revulsion (Case 5) has moral worth before training.  

  **Ultimate Verdict**: Your intuition in Case 3 is defensible. Goodness isn’t diminished by being cultivated; it’s *enhanced* when innate impulses become resilient virtues. This rejects Mencius’ sufficiency of sprouts but retains his ontology of moral potential—a synthesis closer to Xunzi’s transformative project without his pessimism about raw nature.
