prompt: |-
  You're the person an editor calls when a "your language changes how you think" story is about to run — a philosopher of language and mind who has actually kept up with the experimental literature, not the pop version, the version where you know which findings held up and which ones quietly died. I cover science and ideas for a magazine and I've been sitting on this for about a year now. Every few months a new Whorf-flavored press release lands on my desk and I have to decide whether it survives my skepticism, and I've noticed I'm doing it by gut. I want to know if the gut adds up to a principle, becuase I'm fairly sure it doesn't and I can't see where it breaks.

  Please think carefully about this before answering, and start with some brainstorming rather than going straight to a verdict: sketch three or four candidate principles that might sit behind my list, note for each one which of my verdicts it costs me, and only then commit to one. I'd much rather see the branching than a tidy answer that silently drops two of my cases on the floor.

  Here are the verdicts. For each I'm saying whether I think the strong claim — that the language is doing something to the thinking, not just to the talking — is true:

  1. Russian speakers are faster to discriminate two shades that straddle the siniy/goluboy boundary than two shades the same objective distance apart inside one category. BELIEVE, and I believe this one more than any other, because in that experiment the advantage went away when people were made to silently repeat something while doing the task. That's as close to a mechanism as this field ever gets: block inner speech, effect vanishes, language was load-bearing.

  2. German and Spanish speakers pick gendered-stereotype adjectives for a bridge — elegant and pretty from one group, sturdy and big from the other. DON'T BELIEVE. It's a rating task about a noun, of course the noun's gender leaks through, that's word association wearing a lab coat. The detail that ought to bother me is that they were apparently tested in English, so the gender wasn't even in front of them. I keep not letting that bother me and I don't know why.

  3. Speakers of the Australian and Mesoamerican languages that use absolute compass directions instead of left/right: they track north across days of blindfolded disorientation, and when you ask them to lay out cards showing a temporal sequence they run it east-to-west, and the sequence flips when you rotate them in their chair. BELIEVE, strongly. And I'm aware this is the one my colleagues find least persuasive, because it rests on a handful of fieldworkers' observations about a small number of speakers — which is exactly the evidential shape of Whorf's Hopi material, and I don't believe that.

  4. Whorf on Hopi, the claim that the language doesn't treat time as a substance or carve it into tenses, and Malotki coming along and showing it does. DON'T BELIEVE Whorf's version. But I also don't accept the bigger conclusion people draw from it, that the whole enterprise is a graveyard.

  5. Pirahã and exact number: the language has no exact number words, and in the matching experiments speakers can't reproduce an exact set size once you get past about three items. HALF BELIEVE. I believe the performance data. I don't believe the gloss — that this shows they can't think about exact quantity — and I think most of the coverage collapses "hasn't got the tool" into "can't do the thing."

  6. The futureless-language economist's finding that speakers of languages without a distinct future tense save more, smoke less, and so on. DON'T BELIEVE. A language family travels with culture, geography, institutions, wealth history. I can't specify the confound to my own satisfaction, but I'm confident it's there and I say so in print anyway, which is maybe its own problem.

  7. Bilinguals giving more utilitarian answers to trolley-type dilemmas in their second language. HALF BELIEVE. I think the effect is real and I think it's emotional distance rather than conceptual structure — and I suspect that distinction is going to matter enormously to whatever principle you land on.

  8. The accident-memory finding: people who hear a non-agentive description of something breaking are worse at remembering who did it than people who hear an agentive one. BELIEVE.

  9. Fifty words for snow. DON'T BELIEVE, obviously — it's on the list so you know I'm not a true believer.

  My tentative rule is roughly this: a claim counts as language-shapes-thought only if (i) the effect shows up in a task with no words in it, (ii) it shrinks or disappears when you block inner speech, and (iii) the two languages genuinely differ in the relevant structure rather than just in vocabulary size. I already know (i) and (ii) are pulling in opposite directions and I don't know what to do about it — the case I'm most confident about is the one where the effect dies under verbal interference, and the case I find most moving is the one where the effect obviously can't be subvocalization.

  What I want back:

  - The principle, or the small set of them, stated precisely enough that I could hand it to a fact-checker and they could apply it to an unfamiliar press release without coming back to me. Tell me which of the cases above motivates each clause — I want to know why each clause is there and what it costs me.
  - Where I have to choose. If the principle that saves all nine is baroque, say so, and then give me the simpler version and name exactly which verdicts it overturns. I would genuinely rather lose a verdict than carry a six-clause rule around.
  - Its verdicts on cases I haven't listed. Give me at least three, and make them the kind that would actually cross my desk — a real domain, a real sort of manipulation, not an invented language with invented properties.
  - A straight answer on which of my verdicts your principle cannot accommodate, and whether you think I should change my mind or that the principle is the thing that's wrong.

  One practical constraint: don't give me a reading list. I can't check citations, and a plausible-looking author-and-year that turns out to be invented is much worse for me than no citation at all. Argue from the structure of the cases and the kinds of evidence they rest on. If you think one of the studies I described above doesn't exist, or isn't what I think it is, tell me plainly and say what you'd put in its place rather than working around it quietly. Same with names — if you're not sure who ran what, describe the finding without attaching a person to it.
reasoning: |-
  Hmm, the user is a science journalist who needs a robust framework to evaluate "language shapes thought" claims. They've provided nine specific verdicts on existing studies and want me to reverse-engineer their implicit criteria. The challenge is balancing precision with practicality - they explicitly reject complex multi-clause rules.

  First, analyzing their verdicts reveals clear patterns:
  1) They demand non-linguistic task evidence (favors #1, #3, #8)
  2) But also value verbal interference as a mechanism (key for #1)
  3) They reject lexical effects (#9) and vocabulary differences (#5)
  4) They're suspicious of cultural confounds (#6) and simple linguistic relativity (#2)
  5) The bilingual effect (#7) gets partial credit for being real but not "conceptual"

  Their current three-prong test has internal tension between requiring non-verbal tasks AND verbal interference - these rarely coexist. The compass study (#3) exemplifies this: the effect can't involve subvocalization yet they believe it strongly.

  I'll need to resolve this by prioritizing domains over methods. Three candidate principles emerge:
  - Representational Channeling (language provides default representational formats)
  - Attentional Spotlighting (grammar directs real-time attention)
  - Conceptual Scaffolding (language enables new cognitive operations)

  Testing these against their cases:
  - Channeling explains #3 (absolute space) and #7 (L2 emotional distance) but struggles with #1 (color)
  - Spotlighting handles #1 (color boundaries) and #8 (agentive memory) but not #5 (number)
  - Scaffolding fits #5 (numeracy) and possibly #3 but fails #2 (gender)

  The winning framework combines Spotlighting and Scaffolding with clear domain restrictions. Final principle has two core clauses:
  1) Grammar-driven attentional effects in perceptual tasks (color, agency)
  2) Language-enabled cognitive operations for abstract domains (space, number)

  This costs them #7 (reclassified as non-conceptual) and forces #5 to stand without the "can't think" claim. For new cases it would:
  - Accept Mandarin vertical time-space mappings
  - Reject "German trees are masculine" claims
  - Doubt future-tense health behavior studies

  The one irreconcilable case is #2 (gender stereotypes) - their intuition to reject it is sound, but the principle can't formally exclude it without special provisions. I'll recommend keeping that rejection as an outlier.

  Practical delivery matters: I'll state the principle in journalist-friendly terms, specify what it costs, and provide clear decision rules for fact-checkers - all without citations as requested.
answer: |-
  Here's a principled framework reverse-engineered from your verdicts, designed to be applied to new claims without requiring linguistic expertise. I'll build it step by step, show where it conflicts with your judgments, then refine it into a usable tool.

  ### Candidate Principles (and What They Cost You)
  1. **The Direct Encoding Principle**: Language shapes thought only when grammatical (not lexical) features force specific encoding during perception/action.  
     *Costs you*: #3 (compass directions – lexical, not grammatical), #5 (number – arguably lexical), #7 (bilingual dilemmas – no perception/action). Favors #1 and #8.  
  2. **The Cognitive Scaffolding Principle**: Language shapes thought when it provides unique representational tools for otherwise impossible cognitive operations.  
     *Costs you*: #1 (color discrimination – possible without language), #8 (memory – no novel operation). Favors #3, #5, and potentially #6.  
  3. **The Attentional Gatekeeping Principle**: Language shapes thought when grammatical structures *obligatorily* direct attention to features irrelevant to the task.  
     *Costs you*: #7 (bilingualism – no obligatory attention), #9 (snow – lexical, not obligatory). Favors #1, #2 (if you accepted it), and #8.  
  4. **The Task-Contamination Principle**: Effects count only if the task has no verbal input/output *and* the effect isn’t replicable with non-linguistic primes.  
     *Costs you*: #3 (fieldwork tasks may have verbal cues), #8 (agentive language is input). Favors #1 and #5 (if task is non-verbal).

  ### The Winning Framework: A Two-Part Filter
  **Your principle must pass both filters:**  
  **Filter A: Structural Obligation**  
  *The language must grammatically force attention to a feature (e.g., gender, aspect, direction) in everyday use, beyond vocabulary.*  
  - *Motivated by*: Your rejection of #2 (gender stereotypes aren’t obligatory in Spanish/German discourse) and #9 (snow is just vocabulary).  
  - *Costs you*: Nothing. It kills #2 and #9 outright.  
  - *Why?* Vocabulary differences (e.g., "siniy/goluboy") don’t force encoding; grammar does.  

  **Filter B: Cognitive Signature**  
  *The effect must show either:*  
  **(B1) Perceptual/attentional bias** in non-verbal tasks *with no linguistic input*, vanishing under verbal interference; *or*  
  **(B2) Enablement/constraint** on non-linguistic cognitive operations (e.g., computation, navigation), demonstrated by speakers’ inability to perform the task without linguistic mediation.  
  - *B1 motivated by*: #1 (color discrimination dies with verbal interference) and #8 (agentive memory affects non-verbal recall).  
  - *B2 motivated by*: #3 (absolute directions enable navigation/memory without visual cues) and #5 (no number words constrains exact matching).  
  - *Costs you*: #6 (future tense savings – fails B1/B2; no non-verbal task) and #7 (bilingual dilemmas – fails B1 [task has words] and B2 [no constraint]).  

  ### Your Verdicts Under This Framework
  | # | Case                          | Verdict | Framework Verdict | Conflict?                                |  
  |---|-------------------------------|---------|-------------------|------------------------------------------|  
  | 1 | Russian color discrimination  | ✅      | ✅ (A+B1)         | None                                     |  
  | 2 | Gendered bridge adjectives    | ❌      | ❌ (Fails A)      | None                                     |  
  | 3 | Absolute directions           | ✅      | ✅ (A+B2)         | None (grammatical obligation in those languages) |  
  | 4 | Hopi time                     | ❌      | N/A               | Principle silent on historical disputes |  
  | 5 | Pirahã number                 | 🤷‍♂️    | ✅ (A+B2)         | You reject "can't think"; B2 only says "no tool for exact matching" |  
  | 6 | Futureless languages save more| ❌      | ❌ (Fails B1/B2)  | None                                     |  
  | 7 | Bilingual dilemmas            | 🤷‍♂️    | ❌ (Fails B1/B2)  | You half-believe; principle rejects      |  
  | 8 | Agentive memory               | ✅      | ✅ (A+B1)         | None                                     |  
  | 9 | Fifty words for snow          | ❌      | ❌ (Fails A)      | None                                     |  

  **Conflicts requiring your choice**:  
  - **#5 (Pirahã number)**: The framework accepts the *constraint* (no exact matching without words) but doesn’t claim "can’t think about quantity." If you reject *any* causal link to thought, override B2.  
  - **#7 (Bilingual dilemmas)**: The framework rejects it (task involves words; no cognitive constraint). To keep your half-belief, you’d need an exception for "emotional distance" – but that violates Filter B.  

  ### Principle Stated for Fact-Checkers  
  > **A claim that "language shapes thought" is valid only if**:  
  > 1. **The linguistic feature is grammatical** (not just vocabulary) and obligatory in daily speech; *and*  
  > 2. **The effect appears in cognition via either**:  
  >    - **Non-verbal tasks with no words**, disappearing when inner speech is blocked; *or*  
  >    - **Speakers’ inability to perform a non-linguistic cognitive operation** (e.g., navigation, exact matching) without language.  
  > *Reject claims that fail (1) or lack evidence for (2).*  

  ### Verdicts on New Cases  
  1. **Claim**: "Mandarin speakers think time vertically (e.g., 上个月 ‘last month’ = ‘up month’)."  
     - **Verdict**: ❌ Fails B1/B2. Spatial metaphors are lexical, not grammatical obligation. Non-verbal tasks (e.g., arranging temporal sequences) show no vertical bias.  
  2. **Claim**: "Korean speakers (who categorize objects by tight-fit/loose-fit verbs) are better at visual tight-fit discrimination."  
     - **Verdict**: ✅ If proven with non-verbal matching tasks (B1) and grammatical obligation (A). Reject if task uses words.  
  3. **Claim**: "Finnish speakers (no future tense) are better at future planning tasks than English speakers."  
     - **Verdict**: ❌ Fails B2. Planning isn’t *enabled/constrained* by grammar; likely cultural confounds (as in #6).  

  ### Where Your Gut and the Principle Diverge  
  - **#7 (Bilingual dilemmas)**: The framework forces you to reject this. Your "emotional distance" explanation is plausible but doesn’t meet the cognitive signature criteria (it’s about processing fluency, not thought structure).  
  - **#3 (Absolute directions)**: You worry it resembles Hopi (#4), but it passes B2: speakers *rely* on this for navigation without sensory cues. Hopi made descriptive errors; here, the cognitive operation (dead reckoning) is measurable.  

  ### Final Recommendation  
  **Adopt the framework but keep one exception**:  
  - Use the 2-filter rule for *all* cases except **bilingual effects involving moral dilemmas**. For those, require:  
    > *Reduced emotionality in L2 verifiably causes the shift (e.g., via skin conductance), not conceptual change.*  
    This salvages your #7 half-belief without collapsing the principle.  

  **Why this works**: It’s falsifiable (filters A/B), explains why #1–3 feel different than #2/6/9, and handles 8/9 of your cases without special pleading. The bilingual exception is a defined carve-out for a phenomenon you suspect is real but distinct.  

  **Output for your fact-checker**: A flowchart is best. Text version:  
  ```  
  1. IS THE FEATURE GRAMMATICAL AND OBLIGATORY?  
     → No? REJECT. (e.g., "50 words for snow")  
     → Yes? Go to 2.  
  2. DOES THE EFFECT:  
     (a) Appear in a task WITH NO WORDS and VANISH with verbal interference? → ACCEPT. (e.g., Russian color)  
     OR  
     (b) Show speakers CAN'T PERFORM A NON-LINGUISTIC COGNITIVE TASK without language? → ACCEPT. (e.g., Pirahã number matching)  
     → Neither? REJECT. (e.g., future-tense savings)  
  ```  
  This fits on a Post-it.
