prompt: |-
  I TA a second-year philosophy of maths course and I'm putting together the week 8 problem set, on the possibility that our basic axioms are inconsistent. I want one question, worth 25 marks, doable in about an hour, and I specifically don't want it answerable by reciting Gödel's second theorem or by name-dropping paraconsistent logic.

  Here's the setup I want to build it around: next year someone publishes a machine-checked proof of 0=1 from ZFC. Two things the question should force students to wrestle with.

  First, explosion. A trivial theory proves everything, so all our old theorems are still theorems — and yet the discovery would somehow gut the evidential value of the proofs we already have. I want them to say precisely what is lost and what isn't, and to explain why "well, if explosion holds then everything is now trivially provable, so nothing we ever proved is safe" is a bad argument — or, if they think it's a good one, to say exactly where its force comes from.

  Second, downward transmission. ZFC proves Con(PA), so does a contradiction in ZFC threaten PA? I want them to seperate the logical point (it doesn't) from the evidential point (that ZFC proof was part of why we trusted PA), and then to say something about whether the fragment of maths actually used in physics could survive the loss of the big axioms.

  So please write the question itself, a model answer of maybe 700 words, and a marking scheme listing the moves a first-class answer has to make with marks attached, plus the specific wrong turns that should cost marks — e.g. conflating inconsistency with unsoundness, or claiming an inconsistency would be self-concealing because any proof of one would be too long to write down, which in this scenario it demonstrably wasn't.
reasoning: |-
  We are creating a problem set question for a philosophy of mathematics course. The scenario is that a machine-checked proof of 0=1 in ZFC has been discovered. The question should address two main issues: explosion and downward transmission.

  The question should be structured to force students to:
  1. Analyze what is lost and what isn't when a theory becomes inconsistent due to explosion, and critique the argument that "everything is now trivially provable, so nothing we ever proved is safe".
  2. Discuss the relationship between ZFC and PA: why a contradiction in ZFC doesn't logically threaten PA but might affect our evidence for PA, and then consider the impact on the fragment of mathematics used in physics.

  We avoid relying on Gödel's second theorem or paraconsistent logic.

  Here is the question:

  **Question (25 marks):**

  Imagine that next year, a team of mathematicians publishes a machine-checked proof of a contradiction in ZFC, specifically a proof of \(0 = 1\). This discovery sends shockwaves through the foundations of mathematics. In light of this scenario, address the following:

  (a) (10 marks) One immediate consequence of an inconsistent theory is that it becomes *trivial*: by the principle of explosion, every statement becomes provable. Some might argue that this means that all our previous mathematical results proved in ZFC (or in theories based on ZFC) are now worthless because they are trivially provable. However, others contend that this argument is too quick. Explain what is lost and what is not lost in terms of the evidential value of our existing proofs. In particular, why is the argument "if explosion holds then everything is now trivially provable, so nothing we ever proved is safe" a bad argument? Or, if you think it is a good argument, explain where its force comes from.

  (b) (10 marks) ZFC proves the consistency of Peano Arithmetic (PA). Does the discovery of an inconsistency in ZFC threaten the consistency of PA? Clearly separate the logical point from the evidential point. Then, discuss whether the fragment of mathematics actually used in physics (which is much weaker than full ZFC) could survive the loss of the big axioms of ZFC. Explain why or why not.

  (c) (5 marks) Briefly reflect on what this scenario might teach us about the nature of mathematical evidence and the role of foundational theories.

  ---

  **Model Answer (approx. 700 words):**

  (a) The discovery that ZFC is inconsistent would indeed lead to explosion: every mathematical statement would become provable in ZFC. However, the argument that this triviality makes all previous results worthless is flawed because it conflates the existence of a proof with the evidential value of a proof. What is lost is the *reliability* of ZFC as a foundation: we can no longer trust that a proof in ZFC provides evidence for the truth of the statement. But what is not lost is the *content* of the proofs we already have. Each existing proof remains a valid deductive argument within ZFC, and the steps of the proof are still correct according to the rules of ZFC. The problem is that the rules of ZFC have been shown to be unsound (because they prove a falsehood, namely \(0=1\)), but that does not retroactively invalidate the logical structure of the proofs.

  The argument "if explosion holds then everything is now trivially provable, so nothing we ever proved is safe" is bad because it fails to distinguish between the *method* by which a statement is proved and the *evidential support* that proof provides. Before the inconsistency, a proof of a theorem T in ZFC was non-trivial: it required a series of deductive steps that we took as evidence for T. After the inconsistency, we can indeed prove T trivially (by explosion), but that does not mean that the original proof of T is now without value. The original proof still stands as a non-trivial derivation. However, the discovery does undermine the evidential value because now we know that ZFC is unsound, so we cannot trust that T is true even though it has a proof. The real loss is in the soundness of ZFC, not in the structure of past proofs.

  Moreover, the triviality argument overlooks that we may still be interested in the relative logical relationships between statements. For example, if we had a proof of T that did not rely on the inconsistent parts of ZFC (if such parts could be isolated), then that proof might still hold value. But even without isolating, the original proof of T may have been a genuine exploration of the consequences of the axioms, and the inconsistency does not erase that.

  (b) Logically, the inconsistency in ZFC does not directly threaten the consistency of PA. This is because the consistency of PA (Con(PA)) is a statement that ZFC proves, but if ZFC is inconsistent then it proves everything, including Con(PA) and its negation. So the proof of Con(PA) in ZFC loses its force. However, the actual consistency of PA is independent of ZFC's inconsistency. PA might still be consistent even if ZFC is not.

  Evidentially, the discovery is devastating. One of the main reasons we trust PA is that we can model the natural numbers in ZFC and prove Con(PA) in ZFC. If ZFC is inconsistent, then that proof is worthless. We would have to re-examine the evidence for PA. However, there are other reasons to trust PA: it is much simpler, and we have a long history of using PA without encountering a contradiction. Moreover, much of mathematics that is used in physics can be carried out in much weaker systems than PA, such as Primitive Recursive Arithmetic (PRA) or even weaker fragments.

  Regarding the fragment of mathematics used in physics, it could survive the loss of ZFC. Physics primarily uses mathematics that is constructive and finitary. For example, the mathematics needed for quantum mechanics or general relativity can be formalized in systems that are conservative over PA or even weaker. These systems are often provably consistent by much weaker means (e.g., PRA is known to be consistent by finitary methods). Therefore, even if ZFC fails, the mathematics applied in physics might be salvaged by re-basing it on a weaker, consistent foundation. The key point is that the mathematics actually used in physics does not require the full power of ZFC (e.g., large cardinals or advanced set theory). So while the discovery would be a crisis for foundations, it might not directly affect applied mathematics.

  (c) This scenario underscores the fallibility of foundational theories and the importance of evidence beyond formal proofs. It highlights that our confidence in mathematical theories is not solely based on their proofs but also on their coherence, their success in applications, and their resistance to counterexamples. Moreover, it shows that evidence in mathematics is often interconnected: the failure of a powerful theory can undermine the evidence for weaker theories that were justified by their embeddability in the powerful one. However, it also suggests that mathematics is robust in layers: the more basic and applied layers might withstand foundational crises.

  ---

  **Marking Scheme:**

  Total: 25 marks

  Part (a) [10 marks]:
  - [2] Clear explanation of explosion and triviality.
  - [2] Explanation that existing proofs are still valid deductions in ZFC but the soundness of ZFC is undermined.
  - [3] Critique of the argument: Distinguishing between the existence of a proof and the evidential value (the non-triviality of the original proof vs. trivial proof by explosion) and noting that the original proof is still a non-trivial derivation. Also, pointing out that the real issue is the unsoundness, not the structure of past proofs.
  - [2] Discussion of what is lost (evidential reliability) and what is not lost (the logical structure of existing proofs, the relative logical relationships).
  - [1] Clear and coherent writing.

  Deduct marks for:
  - Confusing inconsistency with unsoundness (e.g., saying that inconsistency means all theorems are false) [-2]
  - Claiming that the original proofs are now invalid [-2]
  - Arguing that explosion does make everything unsafe without addressing the non-triviality of the original proofs [-1]
  - Bringing in paraconsistent logic or Gödel’s second theorem unnecessarily [-1]

  Part (b) [10 marks]:
  - [2] Logical point: Inconsistency in ZFC does not entail inconsistency in PA (they are distinct theories).
  - [3] Evidential point: The proof of Con(PA) in ZFC was a key part of the evidence for PA, so that evidence is undermined. But PA might still be consistent and we have other reasons to trust it.
  - [3] Discussion of the fragment in physics: Identifying that physics uses weaker systems (e.g., PA or even weaker) and that these might be consistent independently. Explaining why (e.g., they are finitistically acceptable, have been extensively checked, or are provably consistent by weaker means).
  - [2] Structure and clarity.

  Deduct marks for:
  - Claiming that inconsistency in ZFC implies inconsistency in PA (logical error) [-3]
  - Ignoring the evidential point [-2]
  - Not addressing the survival of physics mathematics [-2]
  - Making unrealistic claims about physics mathematics (e.g., that it requires the axiom of choice) [-1]

  Part (c) [5 marks]:
  - [2] Reflection on mathematical evidence: e.g., fallibility of foundations, role of coherence and applications.
  - [2] Role of foundational theories: e.g., interconnected evidence, robustness in layers.
  - [1] Clarity and relevance.

  Deduct marks for:
  - Superficial or off-topic remarks [-2]
  - Not addressing evidence or foundations [-2]

  Note: Also deduct for the specific wrong turns mentioned in the query, such as claiming the inconsistency would be self-concealing (which is irrelevant in this scenario because we have a proof) [-1]. However, this may not come up naturally.

  Overall, a first-class answer (21-25 marks) should cover all the key points, show clear understanding, and avoid the pitfalls.
answer: |-
  ### Problem Set Question (Week 8: Inconsistency in Foundational Theories)

  **Total Marks: 25**  
  **Time Guideline: 60 minutes**  
  **Scenario:** In 2025, a team of mathematicians publishes a machine-checked proof of the statement \(0 = 1\) in ZFC. This proof is short, verifiable, and accepted by the community. Address the following questions in light of this discovery.  

  ---

  **Question (a) [10 marks]:**  
  The inconsistency of ZFC implies that, due to the principle of explosion, every statement in the language of ZFC becomes provable. Some argue that this triviality undermines *all* mathematical results derived from ZFC, as "everything is now trivially provable, so nothing we ever proved is safe." Critically evaluate this argument. Precisely explain what is lost and what is not lost regarding the evidential value of pre-existing proofs in ZFC. Why might the above argument be misleading or incorrect? If you defend the argument, clarify the source of its force.  

  **Question (b) [10 marks]:**  
  ZFC proves \(\text{Con}(\text{PA})\), the consistency statement for Peano Arithmetic (PA). Does the inconsistency of ZFC threaten the actual consistency of PA? Separate your answer into two parts:  
  - **Logical point:** Does the inconsistency of ZFC *entail* that PA is inconsistent? Explain why or why not.  
  - **Evidential point:** How does the discovery affect our *evidence* for trusting PA?  
  Finally, discuss whether the fragment of mathematics used in physics (e.g., arithmetic, analysis, or geometry as applied in quantum mechanics or relativity) could "survive" the inconsistency of ZFC. Could this fragment be rebuilt or justified without the full power of ZFC? Explain.  

  **Question (c) [5 marks]:**  
  Briefly reflect (in 2–3 sentences) on what this scenario reveals about the nature of mathematical evidence and the role of foundational theories like ZFC.  

  ---

  ### Model Answer (Approx. 700 words)  
  **Question (a):**  
  The discovery that ZFC is inconsistent means that, by the principle of explosion, any statement \(A\) in its language can be proven trivially (e.g., via ex falso quodlibet). This does *not*, however, imply that all pre-existing proofs in ZFC lose their evidential value. What is **lost** is the *reliability of ZFC as a sound foundation*: we can no longer trust that a proof in ZFC guarantees the truth of its conclusion, since ZFC proves falsehoods (e.g., \(0=1\)). Consequently, the evidential force of any ZFC proof—its ability to justify belief in a theorem—is undermined. For example, a proof of the Riemann Hypothesis in pre-2025 ZFC might still be formally valid, but we can no longer rationally believe it describes a mathematical truth.  

  What is **not lost** is the *structure and non-triviality* of pre-existing proofs. The argument that "everything is trivially provable, so nothing is safe" is misleading because it confuses *how* a statement is proven with *why* we valued the proof initially. Prior to the inconsistency, a proof of theorem \(T\) (e.g., "there are infinitely many primes") was valued because it resulted from a non-trivial, step-by-step deduction from axioms we believed to be true. This non-triviality provided evidence that \(T\) was not just true, but *necessarily true* under ZFC’s axioms. After the inconsistency, we can prove \(T\) trivially via explosion, but this does not erase the original proof’s careful reasoning. The value loss stems from unsoundness (ZFC’s axioms are false), not from explosion alone.  

  The argument’s flaw is that it overgeneralizes: it assumes that because trivial proofs exist, all proofs are equally epistemically worthless. But this ignores that the original proofs were *independent of the contradiction* and might still hold if ZFC were restricted to a consistent fragment. The true issue is not triviality itself, but that inconsistency reveals our axioms were flawed, casting doubt on whether any theorem reflects mathematical reality. If the argument has force, it is only in highlighting that inconsistency makes it impossible to distinguish true theorems from false ones using ZFC—but it errs in claiming that pre-existing proofs become "invalid" or that their non-triviality is retroactively destroyed.  

  **Question (b):**  
  - **Logical point:** No, the inconsistency of ZFC does *not* entail that PA is inconsistent. PA and ZFC are distinct theories: PA is a subsystem of ZFC, but their consistency statements are logically independent. ZFC’s inconsistency only means it proves *all* statements, including \(\text{Con}(\text{PA})\) and \(\neg \text{Con}(\text{PA})\). This does not affect PA’s actual consistency, which depends solely on PA’s own axioms. A contradiction in ZFC could arise from axioms irrelevant to PA (e.g., large cardinal axioms), leaving PA untouched. Logically, PA could remain consistent even if ZFC is not.  

  - **Evidential point:** The discovery devastates our *evidence* for trusting PA. ZFC’s proof of \(\text{Con}(\text{PA})\) was a key pillar in justifying PA’s reliability, as it modeled PA’s axioms in a seemingly secure foundation. With ZFC inconsistent, this proof loses all force—it was derived from faulty axioms. We must now rely on weaker evidence: PA’s empirical track record (no contradiction found in decades) and its consistency being provable in weaker systems (e.g., Gentzen’s consistency proof using primitive recursive arithmetic). This reduces our confidence but does not refute PA.  

  Regarding the **mathematics used in physics**, it could likely survive. Physics relies on finitistic and constructive mathematics (e.g., arithmetic for quantum mechanics, real analysis for relativity), formalizable in subsystems of PA or weaker theories (e.g., \(\text{EFA}\) or \(\text{PRA}\)). These systems are:  
  1. **Weaker than ZFC/PA:** They avoid abstract set theory and infinitary axioms.  
  2. **Provably consistent by non-set-theoretic means:** E.g., \(\text{PRA}\)’s consistency can be shown in finitary metamathematics.  
  3. **Empirically robust:** They underpin computations and predictions that align with physical reality.  
  Thus, while ZFC’s failure would require rebuilding foundations, the core mathematics for physics could be justified in a weaker, consistent system. Physics might lose tools dependent on ZFC (e.g., infinite-dimensional Hilbert spaces), but approximations or alternatives exist. The inconsistency would not "collapse" applied mathematics, only force a retreat to more secure foundations.  

  **Question (c):**  
  This scenario reveals that mathematical evidence relies on *coherence* and *interconnected justification*, not just formal proof. Foundational theories like ZFC amplify evidence by proving the consistency of weaker systems, but their failure exposes the fragility of top-down justification. It also highlights mathematics’ layered resilience: while advanced areas might crumble, applied mathematics can often be grounded in intrinsically plausible, computationally verifiable axioms.  

  ---

  ### Marking Scheme  
  **Total Marks: 25** (Award marks based on demonstrated understanding; deduct marks for errors as specified.)  

  #### **Question (a) [10 marks]**  
  - **Key moves for full credit (10 marks):**  
    - [2] Explains explosion and triviality correctly.  
    - [2] Identifies what is lost: reliability/soundness of ZFC (evidential force of proofs).  
    - [2] Identifies what is not lost: structure/non-triviality of pre-existing proofs.  
    - [3] Critiques the "everything is unsafe" argument: Distinguishes trivial proofs (post-inconsistency) from non-trivial original proofs; argues that value loss stems from unsoundness, not explosion.  
    - [1] Clear, coherent writing.  

  **Deduct marks for:**  
    - Conflating inconsistency with unsoundness (e.g., "all theorems are false") **[-2]**.  
    - Claiming original proofs become invalid or logically flawed **[-2]**.  
    - Asserting that explosion alone makes proofs worthless without addressing non-triviality **[-2]**.  
    - Name-dropping paraconsistent logic or Gödel’s theorems **[-1]**.  
    - Arguing the contradiction would be "self-concealing" (irrelevant, as a proof exists) **[-1]**.  

  #### **Question (b) [10 marks]**  
  - **Key moves for full credit (10 marks):**  
    - [2] Logical point: Correctly states ZFC’s inconsistency does not entail PA’s inconsistency; explains separation of theories.  
    - [3] Evidential point: ZFC’s proof of \(\text{Con}(\text{PA})\) was key evidence now lost; discusses weaker evidence (e.g., empirical use, Gentzen).  
    - [4] Survival in physics: Identifies weaker systems (e.g., PRA, EFA); explains why they are sufficient and resilient (e.g., finitary consistency proofs, empirical success).  
    - [1] Structure and clarity.  

  **Deduct marks for:**  
    - Claiming ZFC’s inconsistency entails PA’s inconsistency (logical error) **[-3]**.  
    - Ignoring the evidential point or conflating it with logic **[-2]**.  
    - Stating physics requires full ZFC (e.g., "quantum mechanics needs axiom of choice") **[-2]**.  
    - No discussion of weaker foundations for physics **[-3]**.  
    - Invoking irrelevant theorems (e.g., Gödel’s second) **[-1]**.  

  #### **Question (c) [5 marks]**  
  - **Key moves for full credit (5 marks):**  
    - [2] Insight on evidence: E.g., evidence is holistic (interconnected theories) or fallible.  
    - [2] Role of foundations: E.g., ZFC’s failure shows vulnerability in top-down justification but resilience in applied layers.  
    - [1] Conciseness and relevance.  

  **Deduct marks for:**  
    - Superficial answers (e.g., "math is broken") **[-2]**.  
    - Focusing only on doom or only on optimism without analysis **[-1]**.  

  #### **General Deductions (Apply once overall)**  
  - Poor structure or irrelevant tangents: **[-1 to -2]**.  
  - Exceeding word limit significantly: **[-1]**.  

  **First-class benchmark (21–25 marks):** Addresses all key moves, avoids errors, demonstrates nuanced understanding of evidence vs. logic, and offers original insights (e.g., on physics’ survivability).
