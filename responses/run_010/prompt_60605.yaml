  I’ll argue collapse *is* real and distinct from adaptation, using their "ratchet" framework. Their strongest counter is likely: "But Rapa Nui adapted to deforestation! The real damage was external!" So I’ll need to define collapse as systemic rupture (not just monument-building decline) and show how Rapa Nui’s pre-1770 crises created irrecoverable losses—like depleted soil or extinct palms—even before slavers arrived. 

