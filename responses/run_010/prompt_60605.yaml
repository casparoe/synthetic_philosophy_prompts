answer: |-
  Here’s the verdict: **Collapse names a real, measurable rupture in a society’s core functioning, distinct from adaptation or external catastrophe, and Rapa Nui experienced it pre-contact due to self-inflicted ecological overshoot.**

  1.  **Verdict:** Societal collapse occurs when a critical system (ecological, economic, political) suffers irreversible damage, creating a generational-scale recovery barrier – a "one-way ratchet" – fundamentally degrading collective capacity.
  2.  **Reasoning:** Adaptation involves managed change preserving core viability; collapse is systemic rupture where lost knowledge, resources, or social cohesion prevent rebuilding prior complexity *even if the population persists*. It's defined by the *irrecoverable loss of foundational capabilities*, not just cultural shifts.
  3.  **Rapa Nui Application:** Pre-European Rapa Nui crossed the ratchet: deforestation (human/rat-driven) exterminated the giant palm, eliminating vital resources (canoe wood, rope, rich soil protection). This made large statue transport and ocean fishing *impossible*, fracturing the political/religious complex *before* slavers arrived.
  4.  **Strongest Objection Rebuttal (External Factors):** While slavers/smallpox caused population crash *later*, the *collapse of the complex statue-building society* was already complete; islanders couldn't rebuild statues *even if they wanted to* due to the irreplaceable palm loss, soil depletion, and shattered social organization – the ratchet had clicked.
  5.  **Value Judgement vs. Ratchet:** While *labeling* a society "collapsed" often reflects outsider bias (e.g., valuing monuments), the core *ratchet* – the loss of generational-scale recoverable capacity – is objective; Rapa Nui's inability to rebuild its *own* defining complex system internally, regardless of later disasters, proves collapse occurred.
