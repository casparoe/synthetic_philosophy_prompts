  First, I need to establish the accounting mapping clearly. The reporting entity question is tricky - is the modern UK the same as the Crown in India 1919? Legally it's a successor state, but morally? That ambiguity matters. The reporting period should be 1919-2019 since we're tracking the liability over time. 

  For assets/liabilities: The massacre itself is clearly a liability. But Ferguson's counterfactual (what India gained from empire) would be a contra-liability if anything - though that feels ethically dubious. The unquantifiable "what India could've been" isn't captured in accounting at all, which is a major limitation.

  Now the core insight: Britain's 2019 "regret without apology" perfectly mirrors a contingent liability disclosure. They acknowledge the event but refuse to recognize a formal obligation, explicitly citing precedent fears - classic off-balance-sheet risk management. The 1920 censure was an intra-entity charge (against Dyer, not the state), leaving the systemic liability untouched. Brilliant observation by the user here.

  Tharoor's token payment idea is fascinating - it's either a zero-value liability recognition or, more likely, an attempt to transform apology from accounting entry into performative act. The framework can't capture this symbolic dimension.

  Where the analogy strains:
  - Dead creditors (victims) make discharge impossible
  - Moral obligations ≠ financial debts
  - States aren't going concerns with wind-up clauses
  But these aren't fatal - the core "recognition vs disclosure" logic still holds.

  Finally, does this validate or undermine Ferguson's balance-sheet approach? Ironically, Britain's accounting-style behavior confirms the framework's descriptive power... but also exposes its moral bankruptcy. A system that can't distinguish between apology and non-apology is useless for justice. The provision/disclosure distinction ends up doing all the work - which suggests the grand "net balance" debate was always a distraction.

  The user's hunch was spot-on: this was never about positive/negative sums, but about recognition thresholds. The real revelation is how perfectly Britain's actions map to corporate liability avoidance tactics. The framework works disturbingly well as description, but fails as ethics.
answer: |-
  Here's a disciplined application of the accounting framework to the Jallianwala Bagh episode, testing your core hypothesis about recognition thresholds and mapping its explanatory power/limits:

  **1. Accounting Framework Mapping:**
  - **Reporting Entity:** The UK (2019) is the *legal successor* to the Crown in India (1919) under international law on state succession. This matters because successor entities inherit liabilities. However, the *moral/political continuity* is contested (e.g., "past governments' actions" rhetoric).
  - **Reporting Period:** 1919-2019 (event to centenary). Liabilities persist until settled.
  - **Assets/Liabilities:**  
    - *Liability:* The massacre itself is a **provision** – a present obligation from a past event (violence), probable outflow (moral/political costs), estimable (death tolls exist).  
    - *Contra-Asset?* Ferguson's counterfactual ("what India gained from empire") isn't a contra-liability but a **separate line item** (if accepted). "India without the Raj" is an *unrecorded intangible asset* – the framework has no line for unrealized alternative histories.  
    - *Contingent Liability:* Future claims/precedents are **off-balance-sheet exposures** disclosed in notes.
  - **Auditor & Records:** No external auditor exists. The "audit trail" is partial due to destroyed/removed colonial records (e.g., casualty verification hampered), making reliable estimation harder – justifying non-recognition per accounting standards.

  **2. Explaining the Episode via the Ledger:**
  - **1920 Actions (Censure/Vote):** This was an **intra-period adjustment**, charging the cost to Dyer (the "officer") as an *individual liability*. The *entity* (Crown) avoided recognition by framing it as rogue conduct. No provision was booked against the state.
  - **2019 "Regret Without Apology":** Your hypothesis holds. This is textbook **contingent liability disclosure**:  
    - *Obligation exists* (acknowledgment via "deep regret").  
    - *Outflow possible but not probable* (apology/reparations deemed avoidable).  
    - *Unquantifiable exposure* ("precedent" worry = fear of cascading claims).  
    Britain discloses the event in "notes" (parliamentary statements) but **refuses balance-sheet recognition**.
  - **Tharoor’s Atonement vs. Money:**  
    - *Token Payment:* A symbolic transfer attempts to **materialize the liability** (booking a near-zero provision forces recognition). It converts "contingent" to "recognized."  
    - *Rejecting the Ledger?* Tharoor uses accounting language ("debt," "reparations") but seeks **non-financial settlement**: an apology is a *moral adjustment entry* outside the ledger. The token payment is a performative tool to trigger recognition.
  - **Precedent Worry as Accounting Language:** Explicit fear of "opening the books" mirrors corporate dread of recognizing one provision, forcing re-evaluation of *all* similar contingencies – an unbounded off-balance-sheet risk.

  **3. Where the Frame Breaks (Creaks vs. Collapses):**
  - **Creaks (Metaphor Strain):**  
    - *Dead Creditors:* Accounting handles inherited liabilities (e.g., asbestos claims); this doesn’t invalidate the framework.  
    - *Entity Can’t Wind Up:* States are perpetual; the framework accommodates this via ongoing disclosures.  
  - **Collapses (Critical Disanalogy):**  
    - *Obligation ≠ Transferrable:* Apologies/moral atonement aren’t financial outflows. The framework **cannot quantify non-material settlement**.  
    - *States as "Going Concerns":** Accounting assumes entities operate indefinitely *to discharge liabilities*. But states avoid discharging moral/political debts via sovereignty – the framework **lacks enforcement mechanisms**.  
    - *No Auditor = No Verification:* Without impartial audit, "reliability" is politicized, gutting the core accounting principle.

  **4. What the Episode Reveals About the Balance-Sheet Frame:**
  - **Confirms Descriptive Power:** Britain’s behavior maps precisely to corporate liability management:  
    - Individual scapegoating (1920) = isolating liability.  
    - Refusing apology (2019) = avoiding provision recognition.  
    Precedent fear = classic off-balance-sheet risk aversion.
  - **Exposes Ferguson’s Anomaly:** If the "net balance" were positive (per Ferguson), Britain should confidently apologize – a negligible cost against vast imperial "assets." Yet refusal persists due to **unquantifiable contingent liabilities** (precedents). The frame fails to predict behavior because Ferguson ignores *recognition thresholds*.
  - **Hole in the Frame:** It **cannot distinguish apology from non-apology** because:  
    - "Regret" = disclosure note.  
    - "Apology" = liability recognition + moral settlement (outside ledger).  
    The framework captures *financial* implications but not *symbolic/moral* transactions.
  - **Outcome:** The provision/disclosure distinction **carries all the weight**. The balance-sheet frame owes us:  
    - A mechanism for *enforcing recognition*.  
    - A line item for *non-financial liabilities* (moral debt).  
    Without these, it remains a metaphor for state *accounting avoidance*, not a tool for justice.

  **Conclusion:** Your hunch is validated. Britain treats Jallianwala Bagh as a contingent liability to avoid balance-sheet recognition, fearing precedent-driven exposure. The Ferguson-Tharoor debate is indeed about **recognition thresholds**, not net balances: Ferguson denies liabilities belong on the ledger; Tharoor demands their recognition (even at near-zero value). The framework explains *Britain's conduct* perfectly but fails to resolve *moral claims* because state accountability lacks auditors, enforcement, and a column for atonement. Its utility is diagnostic, not prescriptive.
