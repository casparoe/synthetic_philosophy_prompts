answer: |-
  ### Accuracy-First Epistemology Take-Home Exam  
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 20  

  #### Definitions Provided  
  - **Credence:** A degree of belief in a proposition (between 0 and 1).  
  - **Brier Score:** For credence \(c\) in proposition \(X\) at world \(w\), the score is \((1 - c)^2\) if \(X\) is true at \(w\), and \(c^2\) if false. For a credence function over propositions, sum scores across all propositions.  
  - **Accuracy Dominance:** Credence function \(c\) is *accuracy-dominated* if there exists another \(c^*\) that is at least as accurate in all possible worlds and strictly more accurate in at least one.  
  - **Strictly Proper Scoring Rule:** A scoring rule where each credence uniquely maximizes expected accuracy *by its own lights* (e.g., Brier score).  
  - **Conditionalization:** Upon learning evidence \(E\), update credence in \(X\) to \(P(X|E) = \frac{P(X \land E)}{P(E)}\) (if \(P(E) > 0\)).  

  ---

  #### Questions  
  **Part (a) Conceptual (12 marks)**  
  Explain why accuracy-dominance arguments suffice to establish **coherence** (Probabilism) but cannot directly justify **conditionalization**. How does shifting to *maximizing expected accuracy* resolve this? Explicitly address:  
  (i) Why dominance fails for updating rules,  
  (ii) The role of *immodesty* (using a strictly proper scoring rule),  
  (iii) Whose credences are used to compute expected accuracy for updating.  

  **Part (b) Calculation (8 marks)**  
  Consider three possible worlds \(w_1, w_2, w_3\) and two propositions:  
  - \(A\): True at \(w_1, w_2\) (false at \(w_3\))  
  - \(B\): True at \(w_1\) (false at \(w_2, w_3\))  
  An agent adopts credences:  
  - \(c(A) = 0.6\), \(c(B) = 0.8\), \(c(A \land B) = 0.5\)  
  (i) Show this credence function is incoherent. (1 mark)  
  (ii) Using the Brier score, find a coherent credence function \(c^*\) that accuracy-dominates \(c\). (3 marks)  
  Now, at time \(t_0\), the agent has coherent prior credences \(P(A) = 0.7\), \(P(B) = 0.4\), \(P(A \land B) = 0.3\). At \(t_1\), they learn \(E = A \lor B\) (true at \(w_1, w_2, w_3\)).  
  (iii) Calculate the Brier score *at each world* for three updating strategies:  
  - **Strategy 1:** Conditionalize on \(E\).  
  - **Strategy 2:** Set \(c_{\text{new}}(A) = 0.9\), \(c_{\text{new}}(B) = 0.9\) (ignore priors).  
  - **Strategy 3:** Set \(c_{\text{new}}(A) = P(A)\), \(c_{\text{new}}(B) = P(B)\) (ignore evidence).  
  (iv) Show that **conditionalizing maximizes expected accuracy** relative to the *prior* \(P\). (4 marks)  

  ---

  ### Model Answer  
  **Part (a) Conceptual (12 marks)**  
  Accuracy-dominance arguments establish **Probabilism** because incoherent credences are *universally dominated*: there exists an alternative coherent function more accurate in *every* possible world. This synchronic dominance arises because incoherent functions violate the laws of probability, creating exploitable inaccuracy gaps.  

  However, dominance fails for **conditionalization** because updating rules are evaluated *diachronically*. A non-conditionalizing rule may be more accurate in *some* worlds given specific evidence, but not in all worlds *and* for all possible evidence streams. Dominance requires uniform superiority across all epistemically possible scenarios, which updating rules cannot satisfy due to evidence-contingency.  

  Shifting to *maximizing expected accuracy* resolves this:  
  - **(i)** Expected accuracy is *ex ante* rational (pre-evidence), while dominance is *ex post* (world-dependent). Updating requires anticipatory rationality.  
  - **(ii)** Strictly proper scoring rules (like Brier) ensure **immodesty**: each credence function expects *itself* to be most accurate. Thus, conditionalizing maximizes expected accuracy *as calculated by the prior*, since \(P(X|E)\) is the unique credence that minimizes expected Brier score given \(E\).  
  - **(iii) Crucial point:** Expected accuracy for updating rules is computed using the **prior credences** (not hypothetical or future credences). The prior expects conditionalizing on \(E\) to yield higher accuracy than alternatives *across possible worlds where \(E\) is true*.  

  **Cost of shifting to expected maximization:** We sacrifice the robust "no-regret" guarantee of dominance (which works ex post) for a rule that is only optimal *ex ante* (by the agent's own lights). This introduces dependence on the agent's possibly imperfect priors.  

  **Part (b) Calculation (8 marks)**  
  **(i)** Incoherence: \(c(A \land B) = 0.5 > c(B) = 0.8\). Violates \(P(A \land B) \leq P(B)\).  
  **(ii)** Dominating \(c^*\):  
  - Use \(c^*(A) = 0.6\), \(c^*(B) = 0.7\), \(c^*(A \land B) = 0.6\) (coherent).  
  - Brier scores:  
    - World \(w_1\): \(c\): \((0.4)^2 + (0.2)^2 + (0.5)^2 = 0.16 + 0.04 + 0.25 = 0.45\)  
      \(c^*\): \((0.4)^2 + (0.3)^2 + (0.4)^2 = 0.16 + 0.09 + 0.16 = 0.41\)  
    - World \(w_2\): \(c\): \((0.4)^2 + (0.8)^2 + (0.5)^2 = 0.16 + 0.64 + 0.25 = 1.05\)  
      \(c^*\): \((0.4)^2 + (0.3)^2 + (0.4)^2 = 0.16 + 0.09 + 0.16 = 0.41\)  
    - World \(w_3\): \(c\): \((0.6)^2 + (0.8)^2 + (0.5)^2 = 0.36 + 0.64 + 0.25 = 1.25\)  
      \(c^*\): \((0.6)^2 + (0.7)^2 + (0.6)^2 = 0.36 + 0.49 + 0.36 = 1.21\)  
    - \(c^*\) dominates \(c\) (lower in all worlds).  

  **(iii) Updating after learning \(E = A \lor B\) (true in all worlds):**  
  - Prior: \(P(A) = 0.7, P(B) = 0.4, P(A \land B) = 0.3\) → \(P(E) = 1\) (since \(A \lor B\) true everywhere).  
  - **Strategy 1 (Conditionalize):**  
    - \(c_{\text{new}}(A) = P(A|E) = P(A) = 0.7\)  
    - \(c_{\text{new}}(B) = P(B|E) = P(B) = 0.4\)  
    - Brier:  
      - \(w_1\): \((0.3)^2 + (0.6)^2 = 0.09 + 0.36 = 0.45\)  
      - \(w_2\): \((0.3)^2 + (0.6)^2 = 0.09 + 0.36 = 0.45\)  
      - \(w_3\): \((0.7)^2 + (0.4)^2 = 0.49 + 0.16 = 0.65\)  
  - **Strategy 2 (c(A)=0.9, c(B)=0.9):**  
    - Brier:  
      - \(w_1\): \((0.1)^2 + (0.1)^2 = 0.01 + 0.01 = 0.02\)  
      - \(w_2\): \((0.1)^2 + (0.9)^2 = 0.01 + 0.81 = 0.82\)  
      - \(w_3\): \((0.9)^2 + (0.9)^2 = 0.81 + 0.81 = 1.62\)  
  - **Strategy 3 (Ignore evidence):**  
    - \(c_{\text{new}}(A) = 0.7, c_{\text{new}}(B) = 0.4\) (same as Strategy 1)  
    - Brier identical to Strategy 1 (since E is always true).  

  **(iv) Expected accuracy by prior \(P\):**  
  - Only worlds where \(E\) is true matter (all worlds here).  
  - For a strategy \(S\), expected Brier = \(\sum_{w} P(w) \cdot \text{Brier}(S,w)\).  
  - \(P(w_1) = P(A \land B) = 0.3\), \(P(w_2) = P(A \land \neg B) = 0.4\), \(P(w_3) = P(\neg A \land B) = 0\) → \(P(w_3) = 0\)? Wait, inconsistency!  
    Correction: \(P(A) = 0.7 = P(w_1) + P(w_2)\), \(P(B) = 0.4 = P(w_1)\), \(P(A \land B) = P(w_1) = 0.3\).  
    Thus: \(P(w_1) = 0.3\), \(P(w_2) = 0.4\), \(P(w_3) = 1 - 0.3 - 0.4 = 0.3\).  
  - **Strategy 1:**  
    \(0.3 \times 0.45 + 0.4 \times 0.45 + 0.3 \times 0.65 = 0.135 + 0.18 + 0.195 = 0.51\)  
  - **Strategy 2:**  
    \(0.3 \times 0.02 + 0.4 \times 0.82 + 0.3 \times 1.62 = 0.006 + 0.328 + 0.486 = 0.82\)  
  - **Strategy 3:** Same as Strategy 1 (0.51).  
  - Conditionalizing (Strategy 1) maximizes expected accuracy (0.51 < 0.82).  
  - *Note:* Strategy 1 = Strategy 3 here only because \(E\) is tautological (always true). In general, Strategy 3 ignores evidence and would underperform.  

  ---

  ### Marking Scheme (20 Total)  
  **Part (a) Conceptual (12 marks)**  
  1. **Dominance is synchronic** (applies at a time): +2  
     *(Wrong: "It works for updating")*  
  2. **Dominance fails diachronically due to evidence-contingency**: +3  
     *(Wrong: "No dominating update rule exists")*  
  3. **Shift to expected maximization justified by ex ante rationality**: +2  
     *(Wrong: "Because dominance is too weak")*  
  4. **Immodesty/propriety ensures prior expects conditionalizing to be optimal**: +3  
     *(Wrong: "It minimizes actual inaccuracy")*  
  5. **Explicitly states expected accuracy uses PRIOR credences**: +2 ⭐  
     *(Wrong: Omits this or says "posterior")*  

  **Part (b) Calculation (8 marks)**  
  1. **(i) Identifies incoherence** (\(c(A \land B) > c(B)\)): +1  
  2. **(ii) Finds coherent \(c^*\) & shows dominance via Brier in all worlds**: +3  
     *(Wrong: Only compares one world)*  
  3. **(iii) Correct Brier for all 3 strategies in all worlds**: +2  
     *(Wrong: Arithmetic errors)*  
  4. **(iv) Computes expected Brier using prior P, shows conditionalizing best**: +2  
     *(Wrong: Uses uniform distribution or misses \(P(w_3)=0.3\))*  

  ---

  **Costliest Mistake (⭐)**  
  Failing to **explicitly state that expected accuracy for updating is computed using the PRIOR** (Part (a) point 5). This is worth 2 marks and is the core conceptual pivot—without it, the argument conflates ex ante and ex post evaluation. Most students omit this or assume it’s "obvious," losing clarity.  

  **Self-Grading Tip**  
  If you missed Part (a) point 5 or Part (b) step (iv)’s prior calculation, you’ve identified your key gap. The machinery shifts from "beat all alternatives in all worlds" (dominance) to "beat alternatives in expectation by your own prior" (maximization), which is weaker but necessary for updating.
