prompt: |-
  no philosophy degree here — I work nights at a warehouse and I've been teaching myself this stuff off library books and recorded lectures for about two years, and honestly I have no way of knowing whether any of it has stuck or whether I've just gotten fluent in the jargon. So I want you to set me an exam the way a real prof would, and then hand me the marking scheme so I can grade myself without lying to myself.

  Topic is accuracy-first epistemology / epistemic utility theory. The bit where you treat a credence as an estimate of a truth value, score how far off it is with something like the Brier score, and then try to get the norms of rationality out of the demand not to be accuracy-dominated — coherence, and conditionalizing on your evidence.

  Here's the crux I want the question to turn on, because I'm pretty sure this is exactly where I'm fooling myself. I keep assuming that if the dominance argument gets you Probabilism, the same machinery must get you Conditionalization too, since it's all just be as close to the truth as you can manage. I know dimly that there's one argument that goes by being dominated and a different one that goes by maximizing expected accuracy, but I don't have a grip on why those aren't the same kind of argument, or on what the accuracy-first person has to concede when they switch from one to the other.

  So: one two-part take-home question I could do in about 90 minutes, pitched at first-year grad seminar level rather than intro. Part (a) is the conceptual one, and it should be impossible to answer by reciting the standard summary of the accuracy-first program — it needs to force the difference between a dominance norm and a maximizing norm, and to make me say what the second one costs. Part (b) should be a small concrete calculation: three possible worlds, two propositions or whatever you think is cleanest, Brier score spelled out, and I have to exhibit the dominating alternative for some incoherent credence function and then show why the very same measure pushes toward conditionalizing rather than toward some other way of updating. I want to have to actually do the arithmetic, so I can't bluff my way through it.

  Then give me: a model answer of roughly 700 words for (a), fully worked numbers for (b), a marking scheme out of 20 broken into must-hit points with the marks each one is worth, and for each must-hit point a single line naming the wrong thing people usually write there instead. Finish by telling me which one mistake would cost me the most marks, because I'd bet money it's the one I'd make.

  One thing I want flagged explicitly in the scheme: whether the question of whose credences the expectation gets computed with counts as a must-hit point. My gut says it should, but I can't tell if that's a real issue or something I half-remembered and inflated.

  Two ground rules. Don't ask me for citations, paper titles, or who-said-what — I don't have the references to hand and I'd only be guessing at them, so the question has to be answerable purely from the ideas and the numbers. And don't let the answer turn on remembering some author's private vocabulary; if you need a term of art (strictly proper scoring rule, immodesty, whatever else), define it on the question paper itself the way a real exam would.
