  Okay, the user is a science journalist who also grades ancient political thought exams. They need an unbiased assessment of a student's script on Aristotle's views about slavery. The user has already marked it twice with conflicting notes and wants a fresh pair of eyes. 

  First, I need to understand the stakes. The user isn't just asking for casual feedback - this grade could affect the student's standing, and they'll have to defend it in an examiners' meeting. That's why they're so meticulous about wanting point-by-point analysis, flagged uncertainties, and no secondary literature references. 

  The script itself is actually quite competent at first glance. The student clearly grasps Aristotle's core arguments: slavery as natural, the soul/body justification, the war captives dilemma. But there are subtle landmines. The most dangerous one is how the student handles Aristotle's concession about nature "frequently failing" to match souls and bodies - they present it as Aristotle's own view when it's actually his rebuttal to an objection. That's a serious misattribution that could cap the grade.

  Hmm... the war captives section is another trap. The student correctly notes Aristotle endorses enslaving non-Greeks but oversimplifies by saying he "finds no natural ruling class" among them. Actually, Aristotle leaves room for exceptional non-Greek rulers - it's a nuance the student misses while racing through the argument. Not fatal, but worth deducting for.

  What's tricky is deciding between 69 or 70. The misattribution is a substantive error under the rubric, which normally caps at 69. But the rest is so strong - they nail the instrumental logic, the virtue deficiency, even the Daedalus myth. Maybe 70 is defensible if we treat the misattribution as one substantive error among otherwise accurate work? No... the rubric says 70-79 allows one substantive error, but this feels like more than that because it distorts Aristotle's entire methodology. 

  *checks Politics 1255a carefully* Yeah, the "nature frequently fails" line is definitely part of Aristotle's counterargument to physiognomic objections. The student inverted it. That's fundamental. Grade has to be capped at 69 despite the fluency. 

  For feedback comments: Must avoid academic jargon since it's for undergrads. Focus on "you accurately captured X but misrepresented Y" framing. The war captives note should emphasize that Aristotle's criteria are moral/natural, not purely ethnic - that's what separates a B+ from A answer. 

  User's stress about marker consistency is palpable. They'd rather have "unsure" flags than false certainty. I'll note two borderline calls: whether Aristotle really says slaves have "no virtue whatever" (he allows limited virtue) and if "separable possession" implies transferability (debatable). Better to acknowledge ambiguity than pretend omniscience. 

  Final call: 69. Painful for such a polished script, but misattribution is a cardinal sin in ancient philosophy grading. The examiner's meeting would roast us if we gave higher.
