   Subject: Recommendations for Reconciliation Clause and Pooling Rule

   Introduction:

   This memo provides recommendations regarding two aspects of our forecasting process: the reconciliation clause and the pooling rule. The recommendations are based on an analysis of the current process, the performance of the system, and the operational realities. The goal is to improve the accuracy and integrity of our published forecasts.

   1. Reconciliation Clause:

      Current Process:
      The reconciliation clause requires that if two submissions for the same question differ by more than 15 percentage points after both analysts have received the same evidence packet, the gap is logged as an update failure, the pair must meet and either converge or file a joint statement, and we do not publish until they do so.

      Problem:
      The clause has not functioned as intended. We have 41 open reconciliation items with a median age of five quarters, and none have been resolved by convergence. Analysts report pre-submission coordination to avoid triggering the clause, which may artificially narrow spreads and mask true disagreement. This pre-coordination may be harming calibration (which has not improved in two years). Additionally, the theoretical foundation of the clause is challenged by two realities: (a) without common knowledge of beliefs (prevented by confidentiality), rational disagreement can persist; and (b) analysts may differ in what they consider admissible evidence.

