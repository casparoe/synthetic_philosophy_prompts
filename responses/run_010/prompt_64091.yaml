prompt: |-
  I'm a staff engineer on the risk-analytics platform team at a mid-sized specialty insurer. I build and maintain the pipeline that turns our internal forecasting panel's submissions into the single probability we publish each quarter, and because I own that code I've been asked to sit on the Forecast Governance Committee, which has five members: the CRO as chair, the head of actuarial, two senior analysts who are themselves on the panel, and me. I should say up front that I have no formal training in philosophy, statistics, or decision theory — I write Scala and Python and taught myself enough probability to be dangerous — so I'm going to describe our problem in operational terms and let you supply the conceptual structure. The committee meets Thursday and members expect a written opinion circulated the day before.

  Here is the situation. Our panelists all condition on a single corporate baseline distribution that actuarial rebuilds every January, so in a literal sense the institution imposes a common prior on everyone. Six analysts submit a probability for each question on a fixed quarterly list; submissions are confidential and only the aggregate is published. The handbook specifies an accuracy-weighted arithmetic mean, and it also contains what everyone calls the reconciliation clause: if two submissions for the same question differ by more than fifteen percentage points after both analysts have received the same evidence packet, the gap is logged as an update failure, the pair must meet and either converge or file a joint statement of why they cannot, and no number is published for that question until they have done so. As far as I can tell from the minutes, the clause was justified by an appeal to the idea that rational people who share a prior and have seen the same evidence cannot simply keep disagreeing forever. One of my colleagues observed that the result people have in mind also requires each person's beliefs to be common knowledge, which our confidentiality rule deliberately prevents; another observed that it assumes agreement about what counts as evidence in the first place, which we lack — our lowest estimator treats a remark from an unnamed contact at the regulator as evidence, our highest excludes the same remark as unattributable and therefore inadmissible. That debate stayed academic until this cycle, and I want the memo to resolve it rather than re-stage it.

  The live case is Question 7, which asks whether a proposed federal rule takes effect within eighteen months. The six submissions are 0.15, 0.28, 0.30, 0.32, 0.35, and 0.60. The accuracy-weighted mean the pipeline reports is 0.33; the equally weighted log pool — the multiplicative rule the head of actuarial wants to adopt, on the grounds that it is what falls out if you assume the panel shares a prior and simply pools everyone's evidence — comes to a little over 0.01, because it is dominated by the confident 0.15. Our reserve model has a tier break at 0.20 and underwriting's go/no-go threshold is 0.50, so the choice of pooling rule determines whether we hold capital against this exposure, and the reconciliation clause determines whether we publish anything for Question 7 at all. Three further facts complicate the decision, and I don't know what to do with any of them. First, the analyst who submitted 0.15 builds her estimate from a model whose inputs include the other analyst's published numbers from the previous four quarters; I discovered this while debugging the feature store, and it means their submissions are not independent, so I suspect the log pool is counting one opinion twice, though I can't prove it. Second, the head of actuarial's other argument is that linear averaging is unstable under revision — if one panelist learns something mid-quarter and we re-average, the published number moves even though the group's total information has not changed, whereas the log pool doesn't drift that way — and I have no idea whether that argument is sound or whether it would survive contact with the first fact. Third, we ran both rules in shadow over eight quarters: the weighted mean scored 0.19 Brier and the log pool 0.24, but only three of those eight cycles contained a spread wider than twenty-five points, so the backtest barely samples the situations in which the two rules actually disagree. Meanwhile the update-failure log holds forty-one open items with a median age of five quarters; not one has ever been closed by a pair converging, and nine were closed only because the question resolved itself or an analyst left the company — while the analysts tell me privately that, knowing the clause exists, they message each other before submitting, which may be why recorded spreads look narrow and the calibration of the published number has not improved in two years.

  Draft the memo I will circulate. It should recommend one course of action on both questions — keep, amend, or repeal the reconciliation clause, and keep, amend, or replace the pooling rule — with a transition time frame, and it should not present a menu of options with their advantages and disadvantages: the chair has said plainly that a memo which declines to take a position comes back unread. Give reasons the two analysts on the committee can actually respond to, and treat the strongest argument for keeping the clause seriously rather than as a straw man — as I understand it, the worry is that without it the panel degrades from a panel into a poll, and that a wide published spread invites business units to cherry-pick whichever number suits them at the moment the aggregate feeds a capital decision. State explicitly what your recommendation commits us to about whether people who share a prior and the same evidence packet can rationally continue to disagree, since I expect that question from the CRO and I will not be able to answer it off the cuff. Tell me what to do about the contaminated estimate now that I know about it, including whether it should change this quarter's number or only the rule. Give the operations lead a criterion she can apply next quarter without me, one that distinguishes a spread that is a defect from a spread that is legitimate information. Say what we should start recording now so that this decision can be revisited on evidence rather than on another argument in a conference room, and say what a future cycle would have to look like to show that your recommendation was wrong. Please do not send me to the literature or suggest papers for the committee to read; I cannot circulate a bibliography to the CRO and the document has to stand on its own. Assume your reader is technically literate but has never taken a course in epistemology or decision theory, define every term you use, and keep it to roughly 1,200 words.
reasoning: |-
  We are addressing two main issues: the reconciliation clause and the pooling rule. The memo must recommend a clear course of action for both and address the operational concerns.

   Key points from the problem:

   1. Reconciliation Clause:
      - Currently: if two submissions differ by >15% after same evidence, they must meet and either converge or file a joint statement; otherwise, no publication.
      - Justification: Rational agents with common prior and same evidence should not disagree indefinitely.
      - Criticisms: 
          a) Common knowledge of beliefs is required for the rational agreement result, but confidentiality prevents that.
          b) Disagreement about what constitutes evidence (e.g., an unnamed regulator remark).
      - Current state: The clause is rarely effective (41 open items, median age 5 quarters; analysts pre-coordinate to avoid triggering it).

   2. Pooling Rule:
      - Current: Accuracy-weighted arithmetic mean (0.33 for Q7).
      - Alternative: Equally weighted log pool (0.01 for Q7, dominated by the 0.15).
      - Issues with the log pool in this context:
          a) The 0.15 submission is contaminated: it uses other analysts' past published numbers as an input -> not independent. Thus, the log pool is double-counting that opinion.
          b) Backtest: weighted mean (0.19 Brier) vs log pool (0.24 Brier) over 8 quarters, but only 3 had wide spreads -> inconclusive.
          c) The head of actuarial's argument: linear averaging is unstable under revision (if one updates mid-quarter, the average moves without new group information) but log pool doesn't. However, this argument might not hold with the contamination.

   3. Business Impact:
      - Reserve model: tier break at 0.20 -> if aggregate <0.20, no capital held? (but note: log pool gives 0.01, which is below 0.20; weighted mean 0.33 is above).
      - Underwriting: go/no-go at 0.50 -> only the 0.60 is above, so the aggregate being 0.33 (weighted) or 0.01 (log) both are below -> no go? But note: the log pool is 0.01, which is far below.

   4. Additional complications:
      - Pre-coordination by analysts to avoid triggering the reconciliation clause -> narrow spreads, which may hide true disagreement and hinder calibration improvement.

   Recommendations:

   After careful analysis, I recommend:

   A. Reconciliation Clause: Amend it to remove the mandatory meeting and convergence requirement, and replace it with a transparency requirement.

      Reasons:
      - The clause has not worked in practice: 41 open items, no convergence, and analysts pre-coordinate to avoid it. This pre-coordination may be distorting the estimates (narrowing spreads artificially) and preventing the publication of true disagreement.
      - The theoretical foundation is shaky: without common knowledge of beliefs and without agreement on what counts as evidence, persistent disagreement is possible and even rational. The clause is based on an idealized scenario that does not hold in our setting.
      - However, the concern that a wide spread might lead to cherry-picking is valid. Therefore, we should require that when the spread (max - min) exceeds 15 percentage points, the aggregate is still published, but the individual estimates (without identifying the analysts) are published as a range (min, max) alongside the aggregate. This transparency will discourage cherry-picking by making the disagreement explicit and by showing that the institution acknowledges a range of views.

      Transition: Implement immediately for the next quarter (Q3). For the current quarter (Q7), we publish the aggregate and the range.

   B. Pooling Rule: Keep the accuracy-weighted arithmetic mean, but with two amendments:

      1. Independence requirement: We must ensure that the inputs to the pooling rule are independent. The discovery that one analyst uses the published aggregates from past quarters as an input to her model violates independence. Therefore:
          - We need to investigate and remove such dependencies. In the short term, for the current quarter (Q7), we exclude the 0.15 estimate because it is contaminated. We recalculate the aggregate without it. The remaining estimates are: 0.28, 0.30, 0.32, 0.35, 0.60 -> weighted average (using the existing accuracy weights) without the 0.15. (Note: The accuracy weights are assigned per analyst, so we remove the weight of that analyst for this question. If the weights are normalized to sum to 1, then we renormalize the remaining weights.)

          However, note: the contamination might have been ongoing. Therefore, we must also:
          - Starting next quarter, we require that each analyst's model does not use the published aggregates (or individual estimates) from the panel. We will audit the feature stores and models to ensure independence. Any non-compliant submission will be excluded.

      2. We run a one-year shadow test of alternative pooling methods (including the log pool and others) on all questions, but with a focus on questions with wide spreads (which we will now have more of, because we are removing the pre-coordination by amending the reconciliation clause). We then revisit the pooling rule in one year with more data.

      Why keep the weighted mean for now?
      - The log pool performed worse in the backtest (0.24 Brier vs 0.19) and in the current case it produces an extreme result (0.01) that is driven by a contaminated estimate. The head of actuarial's argument about stability under revision is theoretically interesting, but our current system does not have mid-quarter updates (the pipeline runs once at the end of the quarter). If we were to move to a system with mid-quarter updates, we would need to re-evaluate. But note: the contamination issue also affects the log pool's stability argument because if one analyst's estimate is derived from others, then when they update, they might be updating based on the same information that others are using, which breaks the independence required for the log pool to be valid.

      Why not switch to the log pool?
      - The log pool requires that the panelists are independent and that they share a prior. We have evidence that independence is violated. Moreover, the log pool is very sensitive to low probabilities (because log(0.15) is a large negative number, so it dominates the average). This can lead to instability when one analyst is very confident and wrong (as in the backtest, the log pool had a worse Brier score).

   C. What to do about the current quarter (Question 7):

      - Reconciliation: We do not trigger the reconciliation clause (because we are amending it to remove the requirement). Instead, we publish the aggregate and the range (min, max) of the independent estimates (after excluding the contaminated one). 
          Independent estimates: [0.28, 0.30, 0.32, 0.35, 0.60] -> min=0.28, max=0.60, spread=0.32 (32 percentage points) -> which is above 15, so we publish the range.

      - Pooling: We recalculate the accuracy-weighted mean without the 0.15. The result is 0.33? Let's check: 
          Original six: 0.15, 0.28, 0.30, 0.32, 0.35, 0.60 -> weighted average 0.33. Without 0.15, we have five. We must recalculate the weighted average without the weight of the analyst who submitted 0.15.

          How to handle weights: Let the weights of the six analysts be w1, w2, w3, w4, w5, w6 (normalized to sum to 1). The weighted average was: 
              original = w1*0.15 + w2*0.28 + w3*0.30 + w4*0.32 + w5*0.35 + w6*0.60 = 0.33.

          Without the first analyst, the new weights for the remaining five are: w2', w3', w4', w5', w6' = (w2, w3, w4, w5, w6) / (1 - w1). Then the new average is:
              new = (w2*0.28 + w3*0.30 + w4*0.32 + w5*0.35 + w6*0.60) / (1 - w1)

          We don't have the exact weights, but we can compute it from the data. Since the original weighted average was 0.33, and we are removing a low value (0.15) that had weight w1, the new average will be higher than 0.33. Let me assume w1 is the weight of the analyst who submitted 0.15. The current weighted average without that analyst would be:

              (0.33 - w1*0.15) / (1 - w1)

          Without knowing w1, we cannot compute exactly, but note: the weights are based on historical accuracy. We need to recalculate in the pipeline.

          Since the head of actuarial might object to this exclusion, we must note: the 0.15 is contaminated and therefore invalid for this quarter. We are excluding it on the grounds of violating the independence requirement (which we are now making explicit).

      - The result: The aggregate will be above 0.33, but we must compute it. For the purpose of the memo, we can say: "Recalculating without the non-independent estimate, the aggregate for Question 7 is [computed value]." 

          Note: This value will be above 0.20 (since the lowest independent is 0.28) so we will hold capital. It is also below 0.50, so underwriting will not go.

   D. Operational criterion for next quarter (distinguishing a defect spread from legitimate spread):

      - A spread (max - min) is considered a defect (and thus the estimate is excluded) if:
          a) The estimate is not independent: it uses data from other panelists (current or past) or the published aggregates. We will audit the feature stores and require attestations from analysts that their models are independent. If an audit or attestation reveals such a dependency, the estimate is excluded.
          b) The estimate is found to be based on evidence that was not in the evidence packet (unless the analyst's methodology explicitly allows for external data and that data is documented and available for audit). However, note: the evidence packet is the same, but the interpretation of what is admissible may differ. We do not want to exclude based on admissibility disagreements because that is a matter of judgment. We only exclude if the analyst used data that was not provided in the packet and that is not publicly available (and they did not document it).

      - Otherwise, the spread is legitimate and we publish the aggregate and the range (if spread>15).

   E. What to record for future review:

      - For every question, record: 
          * The individual estimates (anonymized) and the aggregate.
          * The range (min, max) and whether the spread exceeded 15 points (so we can track how often that happens).
          * The Brier score (and any other proper scoring rules we use) for each pooling method we are shadow testing (including the current weighted mean and the log pool) and for the aggregate we publish.
          * Any exclusions and the reason (with a flag for non-independence).

      - Also, we record the resolution of the question (when it happens) to compute the score.

      - We set a review period: one year. We will then compare:
          * The Brier score of the published aggregate (using the weighted mean, excluding non-independent estimates) with the alternative methods (log pool, etc.) on the set of questions that had wide spreads (say, spread>20) and on the entire set.
          * The number of questions with spreads >15 and how they resolved (did the truth fall within the range?).

      - What would show the recommendation is wrong?
          * If we find that the published aggregate (weighted mean) underperforms the log pool (or another method) by a significant margin (say, 0.05 Brier) on the entire set or on the wide-spread subset, we should reconsider the pooling rule.
          * If we find that the range (min, max) we publish is not covering the truth (i.e., the true outcome falls outside the min-max range) in more than, say, 10% of the cases, then we should reconsider the independence and the admissibility of evidence.

   F. Addressing the philosophical question:

      - Can rational agents with a common prior and the same evidence continue to disagree?
          Answer: Yes, for two reasons:
            1. They may interpret the evidence differently (e.g., what counts as evidence, how to weigh it) because they have different models.
            2. Without common knowledge of each other's beliefs (which we prevent by confidentiality), they cannot update on each other's estimates and therefore may rationally maintain different beliefs.

          The reconciliation clause was based on a theoretical result that requires conditions we do not meet. Therefore, we should not force convergence.

   G. Transition time frame:

      - Immediate (this quarter, Question 7):
          * Exclude the non-independent estimate (0.15) for Question 7.
          * Recalculate the weighted mean without that estimate and publish it.
          * Also publish the range of the independent estimates: 0.28 to 0.60 (with a note: "Independent estimates range: 28% to 60%").
          * Do not trigger the reconciliation meeting.

      - Starting next quarter:
          * Amend the reconciliation clause: replace the meeting requirement with the publication of the range when spread>15.
          * Require independence: audit and attestation. Any non-independent submission is excluded.
          * Begin shadow testing alternative pooling rules (log pool, and perhaps others) for one year.

