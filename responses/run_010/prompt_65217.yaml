  The weakest point is reconciling ¶5's fixed human nature with any trajectory toward spiritual worship. A clearer statement in the text about whether "primary object" worship could eventually render sacrifice obsolete would help, but it's not present. The messianic temple reference suggests Maimonides envisions sacrifice continuing indefinitely.

