prompt: |-
  I'm one of two philosophers on the grants panel of a mid-sized animal welfare funder — the rest are field ecologists, two vets, and a program officer who keeps us on schedule. Our whole remit is wild animal welfare, which sounds simple right up until you read our charter, which contains a line nobody seems to have thought hard about when it was drafted: we fund work that makes existing or future animals better off, and we do not fund work whose main effect is to change which animals exist. In four years we've never once had to apply that clause. This cycle we have to.

  Here's the situation. Same population, same money, two applications, and the budget stretches to one. There's a warren of wild rabbits on a fenced reserve, maybe 30–40k animals, and the regional climate outlook says a bad drought is likely within three years — on this reserve that has historically meant mass starvation plus a slow, ugly viral outbreak on top of it. Applicant 1 wants a three-year field trial of an oral immunocontraceptive delivered in bait; their population model says numbers drop roughly 70% with no animal harmed or killed at any point, and the animals who "lose out" are ones who never get conceived. Applicant 2 wants a humane cull of about the same number of animals ahead of the drought, plus suplementary feeding for the survivors; on their numbers it's slightly worse on the aggregate metric, but every animal affected is an animal you can point at. Our scoring rubric spits out something called welfare-adjusted animal-years and it's totalist in structure — it just sums across every animal that will ever live — and it rates the two proposals within a couple of percent, which is well inside the error bars of both models. So the panel keeps going in circles on two things: our own metric calls it a tie, while the charter clause seems to point in opposite directions for each proposal, and I genuinely cant tell whether it forbids both, or forbids the one that harms nobody and permits the one that kills. Two further facts that keep coming up: a cull was run on the neighbouring reserve and the population bounced back inside two years, whereas the contraceptive is claimed to hold for about five; and one reviewer thinks bait-based contraception will shove predator pressure onto a ground-nesting bird that nobody has costed, which may or may not sink proposal 1 on its own.

  Can you draft the memo I'll circulate 48 hours before the meeting? Two pages max, and it has to land somewhere — fund 1, fund 2, fund neither, or fund both at partial scale with specific conditions attached. I want you to actually pick and defend it rather than hand me a menu and a shrug, and I don't want a lit review or a list of which philosophers say what: half the panel has read no philosophy at all and nobody expects references. It does need to give the ecologists and vets reasons they can argue back against, so state plainly what you'd do with the rubric (does a totalist sum even mean anything when most of its terms are animals who won't exist?) and what you'd do with the charter clause — if you think the clause is incoherent, or has to be read against its own stated purpose, say so directly and say what we should tell the board about amending it. And give the losing proposal its strongest case in a paragraph of its own, not a strawman, so I can tell whether I'm on the wrong side of this.
reasoning: |-
  Okay, the user is part of a grants panel for an animal welfare funder focused on wild animals. They're stuck between two proposals for managing a rabbit population facing a drought. The charter has a clause about not funding work that changes which animals exist, but both proposals seem to touch on that. The panel is deadlocked because their metric shows a near tie, and they need a decision memo drafted in 48 hours.

  First, I need to understand the core conflict. Applicant 1 uses contraception to prevent future rabbits from being born, which avoids suffering but changes which animals exist. Applicant 2 culls existing rabbits and supports survivors, which directly harms animals but might align better with the charter by not altering future existence. The charter clause is vague here—does "changing which animals exist" refer only to creating new animals or also preventing potential ones?

  The user's role as a philosopher suggests they need ethical reasoning, but the memo must be accessible to ecologists and vets. So no philosophy jargon. The panel needs clear directives: fund one, both, neither, or partial with conditions. The user wants a defended decision, not just options.

  Key points from the query: the welfare-adjusted animal-years metric is totalist, summing all future animals, but that's problematic when comparing existent vs. potential beings. The metric shows a tie, so other factors must break it. Also, there's a reviewer concern about predator pressure shifting to birds if contraception is used, which could sink Proposal 1.

  The charter's purpose is to make existing/future animals better off without changing who exists. But preventing conception might be seen as not harming anyone (since no subject is deprived), whereas killing harms existing beings. However, the clause might unintentionally favor culling, which conflicts with welfare goals. The memo should address this tension and suggest charter clarification later.

  Decision rationale: Proposal 1 avoids direct harm and reduces suffering long-term with contraception lasting longer than culling. But the predator shift risk is serious. Proposal 2 has immediate killing but supports survivors and avoids ecological side effects. The aggregate metrics are tied, so minimizing direct harm (no killing) and duration of effect (5 years vs. 2) favor Proposal 1, but only if the bird risk is mitigated. Since that's uncertain, partial funding for Proposal 1 with a feasibility study on predator impact makes sense. If not feasible, fall back to Proposal 2.

  Structure the memo: Start with context, then analysis of the metric and charter, then the decision. Include a strong case for the losing proposal (Proposal 2) to show fairness. Recommend charter review for clarity. Keep it under two pages, direct, and actionable.
answer: |-
  ## MEMORANDUM: DECISION RECOMMENDATION FOR RABBIT POPULATION PROPOSALS

  **To:** Grants Panel  
  **From:** [Your Name]  
  **Subject:** Recommendation for Funding: Reserve Rabbit Population Management (Proposal 1 with Conditions)  
  **Date:** [Date of Meeting - 48 Hours]

  ### Context & Core Conflict
  We face two proposals (Contraception - P1; Cull+Feeding - P2) aiming to mitigate severe suffering in a rabbit population facing likely drought-induced starvation/disease. Our welfare-adjusted animal-years metric shows a near-tie. The critical divergence lies in interpreting our charter clause: **"fund work that makes existing or future animals better off, and we do not fund work whose main effect is to change which animals exist."**

  ### Analysis: The Metric & The Clause
  1.  **The Metric's Limits:** Our totalist welfare sum faces inherent difficulties here. For P1, the "welfare" of unconceived rabbits is a metaphysical placeholder – they cannot experience benefit or harm. Summing them alongside existing rabbits is problematic. The metric's near-tie primarily reflects the *avoided suffering* in the *surviving/conceived* population under both plans. P1 avoids suffering primarily by preventing future individuals who *would* have suffered; P2 avoids suffering by reducing density *before* suffering occurs and supporting survivors. The metric treats these avoided negatives similarly, but the *mechanism* (preventing existence vs. altering conditions for existents) is ethically distinct per our charter.
  2.  **Interpreting the Clause:**
      *   **P1 (Contraception):** Its *main effect* is demonstrably to prevent specific future rabbits from existing. While it improves welfare for the rabbits who *do* exist by reducing competition/disease risk, this is a secondary consequence of changing *who* exists. The clause appears to explicitly forbid this primary mechanism.
      *   **P2 (Cull+Feeding):** Its main effect is to kill existing rabbits and alter conditions for survivors. It changes *which rabbits exist* by removing specific individuals. However, the clause likely intends to prohibit *creation* of new populations or interventions causing significant ecological shifts altering future animal composition (e.g., introducing species). Applied strictly to *removal* within an existing population, its meaning is ambiguous. The cull directly harms existing animals (killing), but doesn't primarily aim to alter the *future composition* of *this* rabbit population beyond temporary reduction – survivors will still reproduce. The supplementary feeding aims to directly benefit *existing/future* rabbits within the *unchanged* population identity.
      *   **Clause Coherence & Purpose:** The clause, as written, is operationally ambiguous regarding *preventing* future existence vs. *creating* new existence or populations. Its *stated purpose* (making animals better off without changing who exists) suggests a focus on benefiting identifiable individuals without substituting them. Preventing conception arguably avoids creating subjects *to* harm, aligning with welfare by ensuring only rabbits with better prospects exist. Killing identifiable individuals to prevent their future suffering directly contravenes core welfare principles of non-maleficence. **The clause, taken literally, forbids P1 but potentially permits P2. However, this literal reading risks prioritizing the *mechanism* (killing) over the *outcome* (reduced suffering) and the *intent* of preventing harm.** This tension highlights a need for board clarification.

  ### Recommendation: Fund Proposal 1 (Contraceptive Trial) - WITH CRITICAL CONDITION
  *   **Decision:** Fund P1 at the requested scale, **conditional on Applicant 1 submitting, within 4 weeks, a feasible and fundable (within existing budget) plan to rigorously monitor predator pressure on key ground-nesting bird species for the trial duration, with mitigation strategies if significant negative impact is detected.** If a feasible monitoring/mitigation plan cannot be developed, we recommend funding P2.
  *   **Rationale:**
      1.  **Minimizing Direct Harm:** P1 achieves population reduction *without* inflicting death, injury, or observable suffering on any rabbit. P2 necessitates the direct, intentional killing of thousands of individuals. Avoiding direct harm is a fundamental welfare priority where feasible.
      2.  **Charter Alignment (Intent over Literalism):** While P1's mechanism (preventing conception) technically changes "which animals exist," it aligns better with the *spirit* of making animals better off. The "animals made better off" are the rabbits who *do* exist under P1, experiencing reduced suffering due to lower density. The unconceived rabbits are not "worse off"; they simply never become subjects of experience. P2's killing actively makes identifiable individuals worse off (by ending their lives). We should interpret the clause to permit interventions preventing future suffering *through* preventing the conception of animals likely to suffer, as this fundamentally promotes welfare without substituting populations. Funding P2 under a literal reading of the clause feels perverse – permitting killing while forbidding a harmless alternative.
      3.  **Longer-Term Stability:** The contraceptive's projected 5-year efficacy offers a longer buffer against population rebound and future suffering cycles compared to the ~2-year rebound seen after culling (P2). This aligns with sustainable welfare improvement.
      4.  **Addressing the Critical Risk (The Condition):** The predator pressure risk on birds is serious and cannot be ignored. However, it is a *side-effect* risk, not the *main effect* of P1. It warrants investigation and mitigation, not automatic rejection. Making funding contingent on a robust monitoring/mitigation plan ensures due diligence on ecosystem impact, addressing the ecologists' valid concern directly and pragmatically. If this risk proves intractable, P2 becomes the fallback.
      5.  **Breaking the Metric Tie:** Given the metric's limitations in valuing non-existent animals, the ethical imperative to minimize direct harm and the potential for longer-term stability provide decisive grounds to break the tie in favor of P1, conditional on managing the ecological side-effect.

  ### The Strongest Case for Proposal 2 (Cull + Feeding)
  Proposal 2 offers a direct, proven intervention targeting *existing, identifiable* animals. It reduces population density immediately *before* the anticipated suffering event, directly lessening the intensity of the starvation and disease outbreak for the survivors. Supplementary feeding provides tangible, immediate support to these identifiable individuals during the crisis. Crucially, it aligns with a strict, literal reading of our charter clause: it does not primarily aim to change *which* rabbits exist in the future population; it removes specific individuals from the *current* population to improve conditions for the remaining population and their future offspring (the same population lineage). The ecological side-effects are likely more predictable and localized compared to the unknown predator-shift risk of P1. It focuses our resources on demonstrably improving the welfare of concrete, existing animals facing imminent suffering, consistent with a precautionary principle regarding unintended ecosystem consequences. The harm caused by the cull, while significant, is a single, controlled event aimed at preventing vastly greater aggregate suffering later.

  ### Next Steps & Charter Recommendation
  1.  **Panel Vote:** I recommend we vote to fund P1 conditional on the bird impact mitigation plan as outlined. If the plan cannot be developed satisfactorily, we fund P2.
  2.  **Board Communication:** We must inform the Board that the clause **"we do not fund work whose main effect is to change which animals exist"** created significant ambiguity in this case. Its literal interpretation conflicts with welfare-optimal interventions like humane fertility control. We recommend the Board clarify the clause's intent. Suggested revision: **"We prioritize funding work that improves the welfare of existing or future members of *current* wild populations, avoiding interventions whose primary purpose is to create substantially new populations or significantly alter the long-term species composition of an ecosystem. Interventions primarily preventing conception within existing populations to avoid future suffering are permissible."**

  This recommendation prioritizes minimizing direct harm and achieving sustainable welfare gains, addresses the key ecological risk pragmatically, and forces a necessary conversation about clarifying our foundational principles. I look forward to the discussion.
