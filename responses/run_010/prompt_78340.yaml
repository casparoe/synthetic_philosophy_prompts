answer: |-
  ## Research Proposal: Baselines and the Structure of Historical Explanation in the Great Divergence Debate

  **1. Precise Question:**
  Can the persistent disagreement among major camps in the Great Divergence/Needham Question literature concerning the causes of Britain’s industrialization breakthrough be resolved, or significantly clarified, by rigorously specifying the implicit counterfactual baseline ("foil") against which each camp frames its explanatory task? Specifically, is the choice of baseline (e.g., Yangzi Delta vs. China as a whole; Malthusian trap escape vs. failure of advanced commercial development) a methodological prior that determines which factors become salient as explanatory causes, and if so, is there a principled, historically-grounded way to adjudicate between competing baselines—or does this choice inevitably reflect the historian's specific interests, thereby rendering the "better supported" claim contingent on the question asked?

  **2. Why Existing Positions Leave It Open:**
  *   **Historical Scholarship:** The debate proceeds largely within distinct paradigms (e.g., institutionalists, factor-endowment theorists, high-wage proponents, cultural/scientific explanations). Each camp typically defines its explanandum implicitly: *why Britain diverged from X*, where X is either a specific region (Yangzi), a continental entity (China), a global norm (Malthusian stagnation), or an economic type (advanced organic economy). Crucially, these camps rarely engage directly on *why* X is the appropriate foil for comparison. The debate focuses on marshalling evidence *for* a cause within a chosen framework, not on justifying the framework’s foundational contrast itself. Arguments *between* camps often talk past each other because they assume different starting points.
  *   **Philosophy of Explanation:** Standard philosophical tools for contrastive explanation acknowledge that explanations answer "Why P rather than Q?". However, these tools often take the contrast class (Q) as given or determined by context/pragmatics. They focus on the structure of causal relevance *given* a contrast, not on how to justify the choice of contrast class itself against competing alternatives in historical analysis. Debates on causal mechanisms, invariance, or unification don't directly address the prior question: *Which* Q yields the most historically meaningful or objective explanation for a complex macro-historical event like the Industrial Revolution? The literature lacks robust criteria for evaluating the *historical legitimacy* of competing foils beyond pragmatic utility.

  **3. Proposed Methodology (12-Month Plan):**
  *   **Months 1-3: Deconstructing the Foils (Philosophical/Conceptual Groundwork):**
      *   Systematically categorize the major camps in the Great Divergence literature based on their *implicit or explicit* counterfactual baselines. Create a typology of foils (e.g., regional rival, continental aggregate, global economic type, developmental trajectory).
      *   Analyze core texts from each camp through close reading to identify precisely how the foil is constructed and what baseline expectation (e.g., convergence, stagnation, continued advancement) it implies.
      *   Develop clear definitions for "baseline expectation" and operationalize how a chosen foil shapes the identification of relevant causal factors (e.g., coal becomes salient only if the foil lacks it *and* its absence explains non-industrialization).
  *   **Months 4-7: Testing the Sensitivity of Causal Claims (Historical Analysis):**
      *   Select 3-5 key, frequently cited causal claims from different camps (e.g., "abundant coal was necessary," "secure property rights were decisive," "high wages incentivized mechanization," "scientific culture enabled sustained innovation").
      *   For each claim, identify its "native" foil within the originating camp's argument.
      *   **Core Empirical Work:** Systematically "transplant" each causal claim into arguments framed by *different* foils identified in Phase 1.
      *   Analyze whether the claim:
          *   Remains relevant/compelling as an explanation relative to the new foil?
          *   Requires significant modification or additional supporting evidence?
          *   Becomes irrelevant or demonstrably false?
      *   *Example:* Does the "high wages" explanation retain its force if the foil shifts from "Yangzi Delta c. 1750" (where wages might be comparable) to "China as a whole c. 1800" (where average wages were lower) or to "a hypothetical advanced organic economy continuing its trajectory" (where factor prices might evolve differently)?
  *   **Months 8-10: Interrogating Baseline Legitimacy:**
      *   Investigate potential criteria for assessing the historical validity of a baseline:
          *   **Actor's Perspective:** Did contemporaries perceive the chosen foil as a relevant comparator or possible alternative future? (Requires focused reading of primary sources like economic treatises, traveler accounts, state papers from Britain and relevant Chinese contexts).
          *   **Structural Similarity:** How comparable were the chosen cases *before* the divergence point on dimensions relevant to the chosen causal mechanism? (Analyze quantitative data compilations on wages, energy use, institutions, trade, agricultural productivity for selected regions/periods).
          *   **Path Dependence:** Does the chosen baseline account for the actual developmental trajectories leading up to the divergence point, or is it an ahistorical construct?
      *   Evaluate whether these criteria offer objective constraints or merely shift the problem.
  *   **Months 11-12: Synthesis, Implications & Dissemination:**
      *   Integrate findings: Map which causal claims are robust across foil changes and which are highly sensitive. Assess the viability of different criteria for baseline legitimacy.
      *   Develop implications for the structure of historical explanation and the Great Divergence debate specifically.
      *   Draft journal article(s) targeting both history (e.g., *Journal of Economic History*) and philosophy of science/history (e.g., *Studies in History and Philosophy of Science*) journals.
      *   Prepare final fellowship report.

  **4. Concrete Results Recognizable to Historians:**
  This project will produce results an economic historian would recognize as substantive contributions, not merely a "tidy-up":
  1.  **Causal Claim Sensitivity Matrix:** A clear demonstration, using specific examples, showing how the perceived explanatory power (or even relevance) of key, contested causal factors (e.g., coal, wages, institutions) *changes* depending on the precise counterfactual baseline employed. This directly challenges claims of universal causality.
  2.  **Baseline Typology & Critique:** A systematic classification of the implicit baselines used in the literature, coupled with an assessment of their historical grounding (using criteria like actor perspective or structural similarity) for selected cases. This provides a new lens for categorizing and criticizing existing arguments.
  3.  **Resolution/Reframing of Disagreements:** A concrete analysis showing that apparent disagreements between camps A and B often stem not from conflicting evidence about factor X, but from Camp A asking "Why Britain and not the Yangzi?" while Camp B asks "Why Britain and not the Malthusian norm?". This reframes the debate.
  4.  **Identification of Robust Factors:** Potentially identifying factors that *do* hold explanatory power across multiple, well-grounded baselines, suggesting greater fundamental importance.

  **5. Failure Conditions & Risk Mitigation:**
  *   **Trivial Conclusion ("Just Be Precise"):** Risk: Analysis merely concludes historians should define their foils explicitly. Mitigation: Focus on demonstrating *how* foil choice actively shapes causal relevance in non-obvious ways and exploring the *consequences* for evaluating claims. The novelty lies in showing the structural dependence, not just advocating precision.
  *   **Convergence Illusion:** Risk: Once foils are pinned down, camps converge or disagreements dissolve into minor points. Mitigation: Early analysis (Months 1-3) will test this. If true, it *is* a significant result – revealing the debate's core structure is misunderstood. The project would then explain *how* convergence occurs via foil specification.
  *   **Baseline Indeterminacy:** Risk: No viable criteria for "legitimate" baselines are found, reinforcing interest-relativity. Mitigation: This is a live possibility. The result would be a strong argument for the inherent perspectival nature of macro-historical explanation regarding the Great Divergence, challenging claims of objective superiority for specific causal accounts.
  *   **Scope/Expertise:** Risk: The historical literature and data are too vast. Mitigation: Strict focus on key camps/texts, specific causal claims, and selected foils/periods/regions (e.g., Britain vs. Yangzi Delta, Britain vs. "Malthusian World"; using well-established secondary data compilations and focused primary source sampling). Prioritize depth over breadth within the 12 months.

  **6. Realistic Scope & Cuts:**
  *   **In Scope:** Focus on the core British/Chinese comparison, specifically the period c. 1700-1850. Prioritize major camps (Institutional, Factor Endowment, High Wage, Cultural/Scientific). Analyze 3-5 core causal claims. Utilize primarily English-language secondary sources and key translated primary sources/data compilations.
  *   **Out of Scope (To Complete in 12 Months):** Detailed analysis of other potential "breakout" regions (e.g., Netherlands, Japan) beyond cursory mention. Comprehensive primary source research in Chinese archives/language (reliance on translations and secondary work). Extensive quantitative data reconstruction. Deep dives into sub-debates within camps. Full application to other major historical debates (e.g., Roman decline).

  **7. Why Not Interest-Relativity? Addressing the Alternative:**
  A committee member might argue: "If explanation is inherently contrastive and interest-relative, any chosen foil is 'admissible' relative to a historian's purpose, dissolving the puzzle." Conceding this fully would indeed undermine the project. My reply:

  *   **Constraint by Historical Reality:** While interests guide the *choice* of question, the *viability* of a foil as a plausible baseline is constrained by historical evidence. A foil must represent a *historically conceivable alternative* or a *meaningful point of comparison* given the actual context. Asking "Why Britain and not Mars?" is admissible pragmatically but historically meaningless. The project seeks the criteria defining this "meaningfulness" – the space between pure arbitrariness and absolute determinism. What makes comparing Britain to the Yangzi Delta or to a Malthusian norm *historically legitimate*, even if interests differ?
  *   **Empirical Consequences:** Different foils yield different causal judgments *about the same historical events*. If the choice of foil is *entirely* unconstrained, then claims about the "superiority" of one causal account over another lose all objective grounding beyond rhetorical appeal. The project investigates whether historical scholarship possesses (or can develop) internal standards – rooted in evidence about actors' horizons, structural preconditions, or developmental possibilities – that constrain foil selection, thereby preserving the possibility of reasoned debate about causal efficacy. Accepting pure interest-relativity risks reducing historical explanation to storytelling with arbitrary contrasts. This project explores the potential for *disciplined* contrastivity.

  This research leverages philosophical tools (conceptual clarity, analysis of explanatory structure) to diagnose a fundamental ambiguity underlying a major historical debate. By making implicit counterfactuals explicit and testing the sensitivity of causal claims to them, it aims to transform an entrenched dispute, either by revealing a path to reconciliation, clarifying the nature of the disagreement, or rigorously demonstrating the limitations of objective adjudication in macro-historical explanation. The outcome, whichever direction it takes, will provide a significant contribution to both the historiography of the Great Divergence and the philosophy of historical inquiry.
