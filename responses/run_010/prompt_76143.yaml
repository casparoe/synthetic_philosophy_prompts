prompt: |-
  On my game theory module we've just done iterated elimination of dominated strategies, and I've realised my gut verdicts about when you're allowed to delete don't hang together. Here they are, roughly in the order I noticed them:

  1. Two-player game, a pure strategy that's strictly worse than another pure one whatever the opponent does — delete, no qualms.
  2. A strategy that's strictly worse than a 50/50 mix of two other pure strategies, but not worse than either on its own — also delete. I'm fine with this one: the mix is something I could actually commit to.
  3. A strategy that's only weakly dominated — don't delete. The order-dependence bothers me, and I'm pretty sure it can throw away an equilibrium.
  4. A strategy strictly dominated by a mix that needs probabilities like 0.31/0.69. Mathematically identical to 2, but I balk here. Nobody really randomises like that.
  5. Three-player game where one of my strategies is a best response to some correlated belief about the other two, but never a best response to any independent pair of mixed beliefs. I want to delete it, because I can't picture those two coordinating their randomisation. But if the exact same matrix came up with the other two being, say, a firm and its long-term supplier, I'd keep it. Same numbers, different verdict.
  6. Deleting because I'm confident she's rational: fine. Because I'm confident she's confident I'm rational: fine. Five or six levels deep in a big game: I stop believing it, and I can't say what's different about level 5.

  My hunch is the principle should be somthing like "delete exactly what isn't a best response to beliefs you could actually hold", but I can't get that to handle 4 and 6 at once. Is there a better one, or does the honest answer require splitting my cases into ones about my own mixing and ones about my beliefs about them? And could you say what your principle gives for a case I haven't listed: a strategy that's strictly dominated by a mix which leans on one of my own strategies that I already knocked out two rounds ago. My tutor says you're not allowed to use it and I can't see why not, since the mix is still something I could physically do. Be straight with me about which of my verdicts your principle forces me to give up. British English please, I'm at a UK uni.
