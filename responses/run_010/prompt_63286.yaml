prompt: |-
  Next term I am convening an upper-level seminar on the ethics of climate change, and one session will be devoted to what my students will find the most deflationary material in the course: the inefficacy objection. At a departmental workshop last month a colleague in political theory pressed that objection with an image that has become almost proverbial in our building. One person's annual emissions, she said, are like a cup of water poured into the ocean: the sea is not raised by any amount that could be detected, so the individual act harms nobody, and a moral theory that nonetheless finds wrongdoing in it has confused aggregation with contribution. She reinforced the point politically, noting how much of the personal-footprint vocabulary we all use was popularized by a fossil fuel producer's advertising campaign in the mid-2000s, and arguing that urging students to fly less and eat less beef is therefore not merely futile but counterproductive, since it lets the significant agents off the hook and supplies the conscientious with a sense of having done their bit. Her conclusion was that normative attention belongs exclusively at the level of institutions and policy. Another colleague replied that this line of reasoning proves far too much, because it would equally condemn voting: in a national election no single ballot is remotely likely to be decisive, yet nobody concludes from this that voting is pointless, and most of us think there is something like a duty to vote. The structure of the two cases, she said, is identical, and if the inefficacy objection does not defeat the duty to vote it cannot defeat a duty to cut one's own emissions. Since it is that analogy, and not the bare claim that aggregate effects matter, that is supposed to carry the refutation, I would like to audit it properly before putting it in front of students.

  What I want, then, is an assessment of how far the voting analogy actually holds. Please begin with an explicit mapping: what in the target case corresponds to the ballot, the tally, the decisive threshold, the electorate, the losing alternative, and the duty to vote itself — a table of correspondences would be perfectly welcome. Then separate the disanalogies that matter for this particular use from those that are merely decorative. I expect the interesting ones to cluster around questions like these, though I would rather you tell me which of them are load-bearing than assume that all are: an election is a deliberately designed aggregation device with a public, countable tally and an (at least in principle) determinate pivot point, whereas market production is buffered by inventories, lumpy reorder thresholds, and supply chains that may make an individual purchase more or less likely to be traced back into production; the cost of voting and the cost of a life reorganized around emissions are wildly unlike; the duty to vote is usually grounded in fairness to identifiable co-participants who are also bearing costs, or in expressive and associative value that does not depend on causal efficacy at all, and it is not obvious that either ground has an analogue for the person deciding about a long-haul flight. I would also like you to consider whether any of the disanalogies run against the analogy's user rather than for her — in particular, whether the market case is if anything more hospitable to individual difference-making than the ballot is, given that a purchase carries some small probability of triggering a large reorder, which is a structural feature elections lack. Having laid all this out, tell me plainly whether the colleague's conclusion survives: not that voting is impermissible, but that individual emission-reduction duties exist on the same grounds as the duty to vote. If the analogy fails, say what better one would take its place, and whether the cup-of-water image fares any better under scrutiny — including whether "makes no detectable difference" is even the right thing to say, given the old Parfitian point about the mistake of ignoring effects merely because they are imperceptible or improbable. Finally, and briefly: if there is a residual grounding for individual duties that does not depend on the analogy at all — complicity, integrity, participation in structural injustice, norm-shifting, political signaling — does it rescue her practical recommendation while abandoning her argument, and is that a rescue or a change of subject? I care far less about the state of the literature than about whether the analogy itself can bear the weight placed on it, so please do not close with a non-committal summary; give me a verdict I can defend to a room of skeptical undergraduates.
reasoning: |-
  Alright, let's tackle this query step by step. The user is preparing a seminar on climate ethics, specifically the inefficacy objection. They want to assess the voting analogy used to counter this objection. 

  First, I need to map the voting scenario to individual emissions. The ballot corresponds to an individual's emission choice—each action is a small unit. The tally is the total emissions or votes, while the decisive threshold is the point where outcomes change, like winning an election or triggering production changes. The electorate is all consumers or voters, and the losing alternative is the avoided harm or policy change. The duty to vote is the proposed duty to reduce emissions.

  Next, disanalogies. The election has a clear pivot point; one vote can theoretically decide. But in markets, thresholds are fuzzy. A purchase might restock inventory, potentially leading to more production—unlike a single vote. Costs differ too: voting is low-cost, while lifestyle changes are significant. Grounding the duties also differs. Voting often ties to fairness among participants or expressive value. For emissions, it's about harm prevention, which relies on actual impact, making the analogy shaky here.

  But wait, the market might actually have a better chance of individual impact. A purchase could trigger a reorder, whereas a vote almost never decides an election. So this disanalogy might help the pro-duty side. However, the main issue is the grounding: voting duties don't need efficacy, but emission duties do. That's a problem for the analogy.

  Parfit's point matters too. Even if one action's effect is imperceptible, collectively they cause harm. So the cup-of-water image is misleading. Individual acts contribute to the total harm, even if undetectable alone.

  Alternative grounds like complicity or integrity could support duties without the analogy. But that shifts the argument away from the voting comparison. The colleague's analogy doesn't hold, but other reasons might still justify individual duties. The practical advice stands, but the reasoning changes. So the analogy itself can't bear the weight, but the conclusion isn't necessarily wrong—just supported differently.
answer: |-
  Here is a systematic audit of the voting analogy's strength for defending individual climate duties against the inefficacy objection, structured per your request. The analogy **fails to establish a duty to reduce emissions on identical grounds to voting**, though alternative grounds may support the colleague's practical conclusion.

  ### 1. Explicit Mapping of Voting → Emission Reduction
  | Voting Element          | Emission Reduction Element             | Correspondence Strength |
  |-------------------------|----------------------------------------|-------------------------|
  | **Ballot**              | Individual emission choice (e.g., flight, beef) | Strong: Discrete act with negligible direct impact |
  | **Tally**               | Aggregate emissions (e.g., national CO₂ footprint) | Moderate: Both are summed, but emissions lack real-time measurability |
  | **Decisive Threshold**  | Point triggering systemic harm/production change (e.g., melting threshold, factory reorder) | Weak: Elections have clear pivot; emissions thresholds are probabilistic and diffuse |
  | **Electorate**          | All consumers/emitters in a relevant system | Strong: Collective whose actions jointly determine outcomes |
  | **Losing Alternative**  | Avoided climate harm (e.g., prevented displacement, extinction) | Moderate: Abstract vs. concrete policy choice |
  | **Duty to Vote**        | Putative duty to reduce personal emissions | **Contested Core** |

  ---

  ### 2. Load-Bearing Disanalogies (Mattering for Refutation)
  #### **Critical Disanalogies Undermining the Analogy**:
  - **Grounding of Duty**:  
    Voting duties are typically justified by **fairness** (sharing civic burdens), **expressive value** (solidarity/democratic participation), or **associative obligations** (community membership). **None require causal efficacy**. Emission duties, however, are defended as **harm prevention** – which *depends entirely on causal impact*.  
    → *This alone breaks the analogy*: Voting obligations work *despite* inefficacy; emission obligations are *criticized because of* inefficacy.  

  - **Threshold Structure**:  
    Elections have a **determinate pivot** (e.g., 50% +1 vote). Markets have **noise and buffers**: Inventories, batch ordering, and supply-chain elasticity mean individual purchases rarely trigger immediate production changes. While a purchase *might* probabilistically influence restocking (a point favoring the emission-reduction side), this is stochastic and unverifiable – unlike an election’s public tally.  

  - **Cost Asymmetry**:  
    Voting costs minutes; radical emission reduction can demand life-altering sacrifices (career limitations, familial isolation). Duties demanding high personal cost typically require clearer efficacy justifications.  

  #### **Disanalogies Favoring Emission Reduction**:
  - **Difference-Making Potential**:  
    A purchase *can* trigger a large reorder (e.g., if inventory falls below a restocking threshold), while a vote *cannot* swing an election alone (outside infinitesimally rare ties). **Markets amplify individual influence** relative to elections.  
    → *This weakens the inefficacy objection but doesn’t rescue the voting analogy*, as voting’s justification isn’t efficacy-dependent.  

  #### **Decorative Disanalogies** (Irrelevant to Core Logic):  
  - Public tally visibility, institutional vs. informal aggregation, and the presence of "alternatives" (e.g., policy candidates vs. climate scenarios).  

  ---

  ### 3. Verdict on the Analogy  
  **The colleague’s conclusion does not survive**. The analogy falsely equates two distinct moral logics:  
  - **Voting**: Duty persists *despite* inefficacy due to non-consequentialist grounds (fairness/expression).  
  - **Emission Reduction**: If grounded in harm prevention, it *requires* demonstrating efficacy. The voting analogy cannot transfer its "efficacy-proof" duty to emissions.  

  ---

  ### 4. Better Analogies & Scrutiny of the "Cup-of-Water" Objection  
  - **Superior Analogy**: **Joining a strike**. Each participant’s absence is negligible, but collective action forces change. This shares emissions' key features:  
    - Probabilistic impact (crossing solidarity thresholds),  
    - Harm-based duty,  
    - Expressivist value (solidarity signaling).  
    Still imperfect, but structurally closer than voting.  

  - **Cup-of-Water Image Failure**:  
    Parfit’s **"Mistake in Moral Mathematics"** (Reasons and Persons, 1984) applies:  
    - **Imperceptibility ≠ Inconsequentiality**: A cup *does* raise sea levels (≈0.0000001µm), and 8 billion cups cause catastrophe.  
    - **Probabilistic Harm**: Each emission slightly increases the *chance* of crossing climate tipping points (e.g., permafrost thaw).  
    - **Overdetermination**: Like 100 archers shooting a poisoned victim, no single arrow causes death, but all share responsibility.  

  ---

  ### 5. Residual Groundings for Individual Duties (Abandoning the Analogy)  
  The colleague’s **practical recommendation** (individual duties exist) **can be rescued by shifting grounds**:  
  - **Complicity**: Participating in a harmful system (fossil capitalism) as a beneficiary.  
  - **Integrity**: Aligning actions with moral beliefs ("living your values").  
  - **Norm-Shifting**: Individual changes seed cultural/political shifts (e.g., flight shame → policy).  
  - **Political Signaling**: Consumer choices pressure firms/states (e.g., divestment movements).  

  **Is this a rescue or change of subject?**  
  - **Change of subject**: The original debate was about **causal harm prevention**. These grounds are non-consequentialist or systemic.  
  - **But**: It rescues the *practical conclusion* while conceding the inefficacy objection has force on purely causal grounds.  

  ---

  ### Defensible Verdict for Skeptical Undergraduates  
  > *"The voting analogy doesn’t work. Voting is a duty because of fairness and democracy – things that don’t depend on your ballot changing the outcome. But reducing emissions is about preventing harm, and if your individual act truly does nothing, it’s hard to call it a moral failing. However, the 'cup of water' argument is misleading: your choices* do *add to the problem, just imperceptibly. Worse, it ignores better reasons to act: complicity in a broken system, shifting social norms, or the integrity of living by your values. So yes, you still have climate duties – just not because voting and emissions are morally identical."*  

  This satisfies your request: the analogy fails under scrutiny, but alternative arguments support the colleague’s normative position.
