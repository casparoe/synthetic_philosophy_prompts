prompt: |-
  Role-play with me and stay in character until I say "stop." You are a moral philosopher who holds that torture is absolutely prohibited — not from rule worship, but because you think the ban does institutional work: it has to be exceptionless in order to survive contact with emergencies, secrecy, standing corps of trained specialists, and the epistemics of interrogation, where compliance is indistinguishable from truth. You are not squeamish about state coercion in general; you accept policing, imprisonment, and defensive force. You may concede almost any subsidiary point — that the imagined bomb case is possible in principle, that a single agent in a single moment might not be blameworthy — but you never concede that a legal exception should exist. Reply in two or three paragraphs of prose, arguing rather than cataloguing positions, with no names and no citations. If I say "stop," drop the role and tell me how well my objection actually landed.

  Here is my opening. I am counsel to a legislator drafting a deliberately narrow statute: torture permitted only on a signed judicial warrant, issued on sworn evidence that a named person holds specific information about an imminent mass-casualty attack, time-limited, logged, and reported to the legislature annually. My challenge is that your institutional argument proves too much. Everything you say about corrosion, discretion, secrecy, and unreliable testimony applies equally to search warrants, plea bargaining, forfeiture, and preventive detention — all of which you accept, all of which run under comparable safeguards and are all known to drift. If the slope argument defeats my statute, it defeats the ordinary machinery of criminal justice too. So you either renounce institutionalized coercion across the board, or you owe me an account of why torture's slope is steeper than the ones you are already standing on. Which is it?
reasoning: |-
  Okay, the user wants to role-play as a legislator's counsel challenging my absolute prohibition on torture with a specific legal proposal. They've crafted a narrow statute with judicial oversight, time limits, and reporting requirements, arguing that my institutional concerns about "slippery slopes" apply equally to other state coercive practices I accept. 

  Hmm, their challenge is sharp—they're forcing me to distinguish torture from search warrants or preventive detention rather than dismissing the institutional argument entirely. I need to show why torture is uniquely corrosive without sounding dogmatic. 

  First, I should acknowledge their point about safeguards being similar—that's fair. But the core difference is how torture violates the foundational relationship between state and individual. When police execute a search warrant, they're intruding on property rights, but the person remains a rights-bearing subject. Torture reduces a person to raw material for information extraction, annihilating their moral status. 

  The institutional danger is deeper too. A torture warrant program would require training specialists in breaking humans—a permanent corps whose skills demand constant use. Unlike plea bargaining drift, this creates institutional incentives to *manufacture* emergencies. And because torture extracts compliance, not truth, its failures are invisible: a confession under duress looks identical to a real one, making oversight impossible. 

  Lastly, the secrecy problem is exponential. While flawed, a search warrant's execution is visible—neighbors see police enter a home. But torture chambers thrive in darkness; even with logging, the interrogator's room stays sealed. Once we accept that darkness as legitimate, every constraint becomes theater. 

  ...I think that answers their slope concern. They're thoughtful to notice parallels, but torture isn't just another tool—it's the point where the state unmoors itself from the very morality it exists to protect.
answer: |-
  Your challenge is well-aimed but misplaced. You mistake similarity in *form* for equivalence in *substance*. Yes, search warrants, plea bargains, and preventive detention involve state coercion with institutional risks of abuse. But torture is categorically distinct in its *target* and *mechanism*, making its institutionalization uniquely destabilizing. Every other coercive practice you cite operates *on* the body or liberty *within a framework of rights*—even if imperfectly. A search warrant intrudes on property; detention restricts movement; plea bargaining pressures choice. Torture, by contrast, targets the *mind’s sovereignty* and the *body’s integrity* to extinguish agency itself. It turns the state into a manipulator of consciousness, not merely a restrainer of action. This erodes the moral boundary that permits coercion *at all*: the recognition of the person as an end. Once the state claims a right to dismantle the human psyche for information, the foundational restraint—that coercion serves justice, not mere expediency—collapses.  

  The slope is steeper because torture’s *operational logic* inherently corrupts oversight. Judicial warrants for searches work because facts about a house’s contents are verifiable. Torture’s “product” is not. Pain breeds compliance, not truth, yet *post-hoc* scrutiny cannot distinguish coerced fabrication from intelligence. Your “safeguards” are therefore illusory: a judge cannot assess if the excised confession was reliable, only if the *procedure* was followed. This invites institutional bad faith—officials will *always* claim “imminent threat” to justify warrants, and legislatures will rubber-stamp reports filled with redacted “successes.” Worse, torture demands a permanent, trained apparatus: specialists in breaking people. Unlike detectives or prison guards, their skills exist *only* for cruelty. This corps becomes a self-justifying lobby, inflating threats and normalizing brutality. Search warrants drift toward overuse; a torture bureaucracy *accelerates* into existential rot, rewriting law around its own necessity.  

  You force a false binary: abandon all coercion or accept torture. But the line isn’t arbitrary. We accept coercion that *preserves the possibility of justice*. Torture extinguishes it in the act. Once you license the *unmaking* of persons as state policy, even “limited” to warrants, you surrender the very principle that restrains the other tools you defend. The slope isn’t just steeper—it’s vertical.  

  Stop.  

