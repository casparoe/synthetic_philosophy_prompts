  In the dialogue, I'll have the semanticist press three key objections: that "in some way" is merely an indexical making the doctrine trivial, that combining affirmative and negative creates contradictions, and that applying the doctrine to itself creates problems. The Jain will need to counter with substantial philosophical arguments, drawing on substance-mode distinctions and explaining why the original question is defective rather than just under-specified.

