prompt: |-
  I'm an editorial assistant at a journal in evolutionary behavioral science, and for the past year I've been triaging desk decisions alongside our editor-in-chief, who made her name defending adaptationist hypotheses against the charge that they are just-so stories while still rejecting a great deal of adaptationist work. Her rulings so far, with the evidence profiles she cited:

  - A manuscript arguing for an evolved mechanism of rapid predator detection — faster detection of snake images than of flowers or mushrooms, a conditioning asymmetry the authors predicted before running the study, samples from four continents including two foraging populations, alarm-response data from monkeys, and no behavioral-genetic evidence: accepted, "the real thing."
  - A manuscript on pathogen-avoidance disgust which predicted in advance that disgust would track cues of possible infection rather than statistical dangerousness, tested across eleven societies including foragers, with historical epidemiological records offered as support for the ancestral selection pressure independent of the trait, and no non-human data: accepted.
  - A manuscript on a mate-preference adaptation where a cultural-transmission account was at least as well supported by the existing data: accepted, because the study ran the single test on which the two accounts disagree and the cultural account lost. Her note doesn't mention sampling.
  - A manuscript with samples from twelve societies including foragers, an appealing functional account of the trait's design, and independent archaeological evidence about ancestral conditions, but whose measures were constructed after the effects were found and whose "predictions" restate the results: rejected, unfalsifiable in practice.
  - A manuscript whose preregistered predictions all came out as expected, but where the authors reported that the effect disappeared once a schooling-related confound was controlled and offered a byproduct account of the whole pattern: rejected.

  Now on her desk: the claim that humans have an evolved mechanism for detecting genetic relatedness from facial features and modulating trust accordingly, on the grounds that misdirected altruism was costly in small ancestral groups. The team preregistered three predictions — a graded trust response to faces morphed toward the participant's own face, no gradient when the morph alters equally large but unrelated dimensions, and persistence of the effect with attractiveness and familiarity statistically controlled — and all three held. Every participant is an American or British undergraduate; the cross-cultural test is promised for a follow-up. There are no heritability estimates, no comparative data, no independent evidence about ancestral group composition, and no positively supported rival account, though the authors note that self-face familiarity presupposes mirror and photograph exposure.

  Predict her ruling and give me your confidence. Then tell me which decision rules these verdicts are jointly consistent with — I want at least two genuinely different rules that accommodate all of them — which precedent is closest to the new case, which rule you would bet she is running and why, what she would be conceding or abandoning by ruling either way, and what further case I could put to her that would settle it.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're an editorial assistant at an evolutionary behavioral science journal, working with an editor-in-chief who has a specific approach to adaptationist hypotheses. The user listed several past decisions and now wants to predict the ruling on a new manuscript about detecting genetic relatedness from facial features.

  First, I need to understand the EIC's pattern. Looking at the cases: She accepted studies with strong evidence like cross-cultural samples, preregistered predictions, and specific tests against alternatives. For instance, the snake detection study had multiple continents and conditioning asymmetry. The pathogen disgust paper had eleven societies and historical data. But she rejected papers with methodological flaws, like post-hoc measures or when effects disappeared after controlling confounds.

  The new manuscript has preregistered predictions that held up, but only uses Western undergrads, no cross-cultural data yet, and no evidence of heritability or ancestral conditions. The authors mention familiarity as a possible confound but didn't test it. 

  The user wants two decision rules that fit all cases. Rule 1 could be requiring falsifiability through specific testable predictions and methodological rigor. Rule 2 might emphasize multiple evidence lines, especially cross-cultural or historical data. 

  For the new case, the closest precedent is the mate-preference study, which was accepted because it tested competing accounts. However, the new study lacks such a test. The EIC might reject it due to no cross-cultural data and unresolved familiarity confound. Confidence is high because the absence of key evidence lines aligns with her rejections.

  Assessing the EIC's likely rule, she probably prioritizes multiple evidence lines over preregistration alone. Rejecting this paper maintains her standards but risks undervaluing preregistered success. Accepting it might weaken her stance on diverse evidence. 

  To settle, proposing a case with preregistered predictions but no cross-cultural data versus one with mixed support but diverse samples could clarify her priorities. If she favors the former, she values preregistration; if the latter, diverse evidence is key.
answer: |-
  Based on the EIC's consistent pattern, I predict she will **reject** the new manuscript on facial relatedness detection. My confidence is **high (80%)**.

  **Predicted Ruling & Why:**
  *   **Rejection Reason:** Likely framed as "Insufficient evidence to rule out compelling non-adaptationist explanations (specifically, familiarity/self-exposure confound) and lack of cross-cultural validation or independent evidence for the proposed ancestral selection pressure. Currently indistinguishable from a byproduct of modern experience."
  *   **Why:** It fails on several key criteria she emphasizes:
      1.  **Lack of Cross-Cultural/Forager Data:** This is a glaring omission compared to the accepted studies (4 continents/foragers for snakes, 11 societies/foragers for disgust). The promised follow-up isn't evidence *now*.
      2.  **No Independent Evidence for Ancestral Pressure:** Unlike the pathogen disgust paper (historical epidemiology) or the snake paper (monkey alarm data), there's no archaeological, genetic, ethnographic, or comparative evidence supporting the claimed cost of misdirected altruism in small groups.
      3.  **Unaddressed Plausible Non-Adaptationist Account:** The authors *mention* the familiarity confound (mirror/photograph exposure) but offer no positive evidence against it. Unlike the mate-preference paper that *tested* and falsified the rival cultural account, this team only controlled attractiveness/familiarity statistically – which doesn't rule out self-face familiarity as the *primary* driver. The EIC prioritizes *testing* rivals, not just noting them.
      4.  **Weak Comparative Evidence:** No non-human data.
      5.  **Methodological Concern (Implied):** While preregistered, the reliance on self-face morphs in WEIRD undergraduates makes the familiarity confound particularly acute. The EIC showed concern for confounds in the rejected "schooling" paper.
  *   **Preregistration Isn't Enough:** The final rejected case shows that even perfect preregistered confirmation isn't sufficient if a viable non-adaptationist account exists and fits the data.

  **Two Jointly Consistent Decision Rules:**

  1.  **Rule 1: "Multiple Lines of Ancestral/Evolved Evidence Required, Prioritizing Falsifiability of Key Rivals"**
      *   *How it fits:*
          *   **Snakes:** Multiple populations (incl. foragers), comparative (monkey) data, specific predicted asymmetry (falsifying simple salience).
          *   **Disgust:** Multiple populations (incl. foragers), independent evidence for ancestral pressure (epidemiology).
          *   **Mate Preference:** Directly falsified the key rival account via a critical test.
          *   **Rejected 1:** Lacked falsifiability (post-hoc measures/predictions).
          *   **Rejected 2:** Viable non-adaptationist account explained the *whole* pattern once confound controlled.
          *   **New Case:** Lacks multiple lines (no cross-cultural, no independent pressure evidence, no comparative), fails to falsify the key familiarity rival (only controls it, doesn't test its sufficiency).

  2.  **Rule 2: "Strong Inference Adaptationism: Require Preregistered/Predicted Design Features *and* Evidence Addressing Ancestral Environment/Generality *and* Positive Evidence Against Major Rivals"**
      *   *How it fits:*
          *   **Snakes:** Predicted asymmetry, multiple populations, comparative data (addresses generality/ancestry).
          *   **Disgust:** Predicted cue-specificity, multiple populations (generality), independent pressure evidence (ancestry).
          *   **Mate Preference:** Preregistered critical test falsified major rival.
          *   **Rejected 1:** No genuine prediction (post-hoc).
          *   **Rejected 2:** Non-adaptationist account better explained the *controlled* data.
          *   **New Case:** Has preregistered design feature predictions (good), but lacks evidence for ancestry/generality (no cross-cultural, no independent pressure evidence), and lacks *positive* evidence against the familiarity rival (merely a control, not a test).

  **Closest Precedent:** The **Rejected Manuscript #2** (preregistered success, but viable non-adaptationist account accepted by authors after control) is the closest. Like that paper, this one shows a statistically controlled effect but fails to rule out a plausible alternative explanation as the *primary* cause. The *Mate Preference* paper is the counter-example showing what *would* likely lead to acceptance: a direct test falsifying the rival.

  **Which Rule is She Likely Running?** I'd bet she's primarily running **Rule 1: "Multiple Lines of Ancestral/Evolved Evidence Required, Prioritizing Falsifiability of Key Rivals"**.
  *   **Why:** The emphasis on cross-cultural/forager data and independent evidence for ancestral pressures in the acceptances is striking and consistent. The mate preference acceptance hinged *entirely* on falsifying the rival, showing its critical importance. Rejection #1 focused on falsifiability, Rejection #2 on the rival account fitting the controlled data. The new manuscript fails precisely on these prioritized points (cross-cultural, independent pressure evidence, falsifying the rival familiarity account).

  **What She Would Concede or Abandon:**

  *   **By Rejecting:**
      *   **Conceding:** That preregistered confirmation of specific design predictions, while methodologically strong, is *not sufficient* on its own to establish an adaptation in her view. It needs anchoring in evidence of ancestral environment/generality and ruling out core rivals.
      *   **Abandoning?** Nothing major. It maintains her consistent high bar requiring multiple evidentiary lines and rival falsification.
  *   **By Accepting:**
      *   **Conceding:** That in this specific case, preregistered confirmation of predicted design features *can* outweigh the lack of cross-cultural data *and* the unaddressed familiarity confound *if* the design prediction is sufficiently specific. This would be a significant shift.
      *   **Abandoning:** Her consistent emphasis on cross-cultural/forager validation as near-essential for claims of evolved mechanisms (seen in all previous acceptances) and her requirement for *positive* evidence against key rivals (as in the mate-preference acceptance vs. the rejection of the pathogen paper that didn't need it because it had other strong evidence). It would weaken her stance against "just-so" stories by accepting a design prediction without broader evolutionary context or rival testing.

  **Case to Settle It:**

  Propose this hypothetical manuscript to her:
  > **Claim:** An evolved mechanism for regulating effort based on perceived task futility (to conserve energy).  
  > **Evidence:** 
  > *   Preregistered predictions: (1) Steeper decline in effort on unsolvable vs. solvable puzzles than on difficult vs. easy solvable ones; (2) Physiological stress markers (cortisol) correlate with effort *only* on unsolvable tasks; (3) Effect holds controlling for trait pessimism. All predictions confirmed.
  > *   **BUT:** Sample is *only* US undergraduates. No cross-cultural data. No heritability. No comparative data. No independent evidence about energy conservation being a strong selective pressure in ancestral environments. 
  > *   **Rival:** The authors note a plausible "learned helplessness" account based on modern achievement culture but offer no specific test against it, just the pessimism control.

  **Why this settles it:**
  *   It perfectly mirrors the facial relatedness case: Strong preregistered design predictions confirmed, WEIRD sample, no cross-cultural/ancestral/comparative evidence, plausible rival noted but not tested.
  *   **If she ACCEPTS this:** It confirms she prioritizes preregistered design prediction confirmation above cross-cultural evidence and rival falsification *in principle*. She *would* likely accept the facial relatedness paper.
  *   **If she REJECTS this:** It confirms that the lack of cross-cultural evidence *and* the failure to *test* (not just note/control) a plausible key rival are independently sufficient for rejection, regardless of preregistered success. Her rejection of the facial relatedness paper would be consistent.

  Her ruling on *this* hypothetical case would clearly reveal whether the preregistered design predictions alone can carry the day for an adaptationist claim in the absence of her other favored evidence lines. Based on her history, expect a rejection.
