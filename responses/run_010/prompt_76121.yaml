prompt: |-
  I run the grants committee for a small community foundation — we hand out about 40 checks a year, $2k to $15k each, to local projects. Five years ago it was 5 of us. Now it's 23, mostly because I kept recruiting people, on the theory that more votes means better decisions. Lately I've been doubting that.

  I keep a spreadsheet. For every vote we've ever taken I've recorded whether the project actually panned out two years later — finished what it said it would, still running, no scandal. Crude, I know, but it's something. Sorting by member, the picture is: 9 people are right about 70% of the time, 11 are right about 55%, and 3 are right about 40%. Those last three aren't dumb, they just flatly refuse one whole category — anything that looks like harm reduction, needle exchange, supervised use, that kind of thing — and vote no on it regardless of what's actually in the application.

  Two other things I can't work out.

  First, we all vote off the same packet. One part-time staffer writes a two-page summary of each application and that is literally all most members ever see. Only a handful of us have set foot at a project site in five years. So when her summary gets a project wrong, we all get it wrong in the same direction, together.

  Second, one of my better members admitted to me he sometimes votes against his own read on a project, because "my vote only counts when it's close, and if it's close, the others probably saw something I missed." I want to tell him that's backwards — vote what you actually think — but I couldnt come up with a reason that would convince him, and honestly part of me wonders if he's onto something.

  So: is the 23-person committee genuinely better than the old five, or have I been making it worse for five years? And what would you actually change — who's on it, how many, what they're shown, how they vote? I'm also tempted to stop doing yes/no votes and have everyone rank all the applications instead, if that helps. Don't give me generic committee hygiene stuff, I want to know whether the arithmetic of how I'm aggregating these votes is sound.
reasoning: |-
  Okay, let me start by understanding the user's situation. They run a grants committee that's grown from 5 to 23 members over five years. The initial idea was that more voters lead to better decisions, but now they're doubting that. They have data showing members' accuracy varies: some are right 70% of the time, others 55%, and three at 40% because they oppose harm reduction projects outright. 

  The user mentioned two main issues. First, everyone relies on a single staffer's summaries, which can mislead the whole committee if there's an error. Second, one member votes strategically, against his own judgment, thinking his vote only matters in close calls. The user is considering switching to ranking instead of yes/no votes.

  I need to tackle whether the larger committee is better and what changes would help. Let me break down the key problems. The low-accuracy members (especially the three with 40%) are pulling down the group's average. Their refusal to support harm reduction projects regardless of merit introduces bias. Even though they're a minority, their votes affect outcomes, particularly in close decisions.

  The reliance on one summary is a single point of failure. If that summary is flawed, everyone is misled. This isn't just about committee size but about information quality. Diversifying information sources could mitigate this. Maybe encourage site visits or involve more members in reviewing full applications.

  The strategic voting is interesting. That member thinks his vote only counts when it's close, so he defers to others. But this assumes others are more accurate, which isn't necessarily true. His 70% accuracy rate is valuable, and suppressing his true opinion might lower the group's overall accuracy. The Condorcet Jury Theorem suggests that larger groups make better decisions only if individuals are competent and vote independently. Strategic voting breaks independence.

  Looking at the data: 9 members at 70%, 11 at 55%, 3 at 40%. The average without the three low scorers would be higher. Their inclusion reduces the group's accuracy, especially since they're biased against harm reduction. Removing them or changing their approach would help.

  The user wants to know if aggregation methods like ranking would be better. Yes/no voting simplifies but loses nuance. Ranking allows for preference orders and could help avoid the worst choices. The Borda count might work here, reducing the impact of minority opposition. Alternatively, approval voting could let members support multiple projects without ranking.

  Other considerations: The committee size affects dynamics. With 23 people, discussions might be less effective. Splitting into specialized subcommittees could improve focus. Also, addressing the information bottleneck—perhaps having summaries reviewed by others or rotating who writes them.

  The user’s deeper needs: They want effective grant allocation, ensuring funds go to impactful projects. They might also seek validation of their initial expansion and practical steps to improve without drastic cuts. Balancing inclusivity with efficiency is key. They need actionable changes that respect members' contributions while enhancing decision quality.
answer: |-
  Your data and observations reveal fundamental flaws in the committee's structure and voting mechanics. Let's break down the arithmetic and propose evidence-backed solutions:

  **Is 23 Better Than 5? The Math Says No (Under Current Setup)**
  The Condorcet Jury Theorem explains your problem: larger groups *only* outperform smaller ones if the average member is competent (accuracy >50%) and votes independently. Your committee fails both tests:
  1.  **Low Average Competence:** With 3 members at 40%, 11 at 55%, and 9 at 70%, the *weighted average accuracy is only 58.7%* – perilously close to a coin flip.
  2.  **Lack of Independence:** The "harm reduction veto trio" introduces systematic bias, and the reliance on a single summary creates correlated errors. Your strategic voter also violates independence.

  **Result:** Adding low-accuracy, correlated voters *lowers* decision quality. Simulations using your accuracy rates show a 23-member vote is **less accurate** than a skilled 5-member subgroup (e.g., the 9x70% members). The trio's bias and the summary errors amplify this.

  **Action Plan: Fix the Arithmetic of Aggregation**
  Prioritize competence, independence, and better information. Avoid generic advice – here’s the math-driven overhaul:

  1.  **Remove the Low-Accuracy, Biased Voters (Immediately):**
      *   **Why:** The "harm reduction trio" (40% accuracy, systematic bias) actively harms outcomes. Keeping them violates the core premise of group wisdom. Their presence makes the committee *less* accurate than a smaller group of the better voters.
      *   **Action:** Politely transition them off the committee. Cite a need for "diverse perspectives *within* each member's evaluation approach" rather than rigid categorical rejections. Their bias poisons the aggregation pool.

  2.  **Eliminate Strategic Voting & Enforce Independence:**
      *   **Why:** Your strategic voter (70% accuracy) is suppressing his true judgment. His logic ("others saw something I missed") only holds *if* the *average* member is more accurate than him. With a group average of 58.7%, he is *more* accurate. His strategy is mathematically irrational and reduces overall accuracy.
      *   **Action:** Mandate in writing: "Vote your sincere, independent assessment of the project's merit based on the information provided." Explain the math: *His* 70% judgment is *more valuable* than the vote of a 55% or 40% member. Deferring lowers the group's signal. Secret ballots can also reduce social pressure.

  3.  **Fix the Information Bottleneck (Critical):**
      *   **Why:** A single summary is a single point of failure. Correlated errors guarantee herd mistakes. This undermines *any* voting system.
      *   **Actions:**
          *   **Two Summaries:** Hire a second part-timer (or split duty with existing staff) to write *independent* summaries for each application. Present both to all members. This significantly reduces correlated error risk.
          *   **"Deep Dive" Volunteers:** Recruit 2-3 committee members (rotating) per application to review the *full* proposal and interview the applicant. They present a 5-minute verbal supplement (or 1-page note) highlighting key points/concerns missed in summaries.
          *   **Mandatory Site Visits (Subset):** Require *at least* 5 members (rotating) to visit *each* shortlisted project before final vote. Their report becomes part of the packet. This grounds decisions in reality.

  4.  **Optimize Voting Method: Approval Voting > Ranking > Yes/No:**
      *   **Why Yes/No Fails:** Forces false binaries, vulnerable to minority blocs (like your trio), amplifies summary errors.
      *   **Ranking (Borda Count):** Better than Yes/No. Reduces impact of minority opposition and allows nuanced preferences. However, it's complex for 40+ projects, susceptible to strategic ranking, and doesn't directly solve information problems.
      *   **Approval Voting (Best Fit):** *"Vote 'Yes' for every project you find acceptable (i.e., you would fund if budget allowed)."*
          *   **Arithmetic Advantage:** Significantly reduces the power of the "harm reduction" style veto bloc. A project they hate but others find acceptable still gets votes.
          *   **Simplicity:** Easier than ranking 40+ projects.
          *   **Strategy-Resistant:** Sincere voting is optimal. Your strategic voter would happily approve projects he deems good.
          *   **Aggregation:** Fund the projects with the highest approval counts until the budget is exhausted. This naturally surfaces broad consensus winners and minimizes damage from low-accuracy/noisy voters compared to Yes/No.
          *   **Your Data:** Projects truly favored by the high-accuracy members (70%) will get strong approval. Projects relying on the 55% cohort might get funded, but with less confidence – which matches their lower accuracy.

  5.  **Right-Size the Committee (After Cuts):**
      *   Target 9-15 members. Prioritize **diversity of expertise and perspective** over raw numbers. Include members with proven good judgment (your 70% cohort) and specific knowledge relevant to common grant areas (youth, homelessness, arts, environment). A smaller group improves discussion depth and makes site visits/in-depth review feasible.

  **Why This Works Mathematically:**
  1.  **Raises Average Competence:** Removing the 40% trio lifts the average accuracy.
  2.  **Promotes Independence:** Multiple summaries, deep dives, and site visits diversify information sources, reducing correlated errors.
  3.  **Better Aggregation:** Approval voting dampens the impact of remaining lower-accuracy voters and veto blocs, while amplifying the preferences of the more accurate members. It efficiently aggregates judgments without complex ranking.
  4.  **Leverages Skill:** Enforcing sincere voting from your 70% members ensures their superior judgment is fully utilized.

  **Implementation Sequence:**
  1.  Remove the 3 biased/low-accuracy members.
  2.  Implement the dual summaries and deep-dive process immediately.
  3.  Introduce Approval Voting for the next grant cycle, mandating sincere voting.
  4.  Gradually phase in site visits and refine committee size/expertise over the next 6-12 months.

  By addressing the low competence, correlated information, and flawed aggregation method, you'll transform the committee from a noisy crowd into a focused decision engine. The goal isn't just more votes, but *better-judged* votes aggregated wisely. Approval voting, combined with competence-focused membership and robust information, delivers this.
