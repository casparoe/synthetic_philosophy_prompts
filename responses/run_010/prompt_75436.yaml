prompt: |-
  My roommate is deep in a philosophy-of-mind phase and has hard-and-fast verdicts on a bunch of cases, and I can't work out what rule she's running. She says the Alzheimer's guy's notebook counts as part of his mind. She says the player rotating the falling shapes on the Tetris screen instead of rotating them in her head is doing extended cognition. Her phone's notes app counts as part of her memory; a library card catalog defintely doesn't. A calculator counts when she's doing her taxes but not when she's checking whether 12 times 12 is 144. Her smartwatch, which tells her she's stressed and which she acts on all day long, doesn't count as part of her emotional life at all. A cochlear implant counts. Now the new case: she's started using an AI assistant that drafts her emails and writes up her meeting summaries, she accepts something like 80% of the drafts with a light edit, and when the thing went down last week she couldn't reconstruct Tuesday's standup at all. Predict her verdict on that one, give me the candidate rules that fit her track record, say which of those rules come apart on the assistant case and why, and then name one further case that would settle which rule she's actually on. I care way more about that last part than about the prediction.
reasoning: |-
  Okay, let me try to figure out the roommate's rule for what counts as extended cognition. First, I need to look at all the cases she's given verdicts on and see if there's a pattern.

  Starting with the Alzheimer's patient's notebook: she says it's part of his mind. That makes sense because he's using it to compensate for memory loss. The notebook is a constant external aid that he relies on. Then, the Tetris player rotating shapes on the screen instead of mentally: she counts that as extended cognition. So here, the action is offloaded to the environment instead of being done internally.

  Her phone's notes app is part of her memory, but a library card catalog isn't. What's the difference? The notes app is personal, always accessible, and integrated into her daily routines. The card catalog is a shared resource, not tied to her individually. So maybe personal vs. public tools?

  The calculator during taxes is part of cognition, but not for simple math like 12x12. The key here might be complexity. Taxes are complex, requiring multiple steps, whereas 12x12 is a simple recall. So, cognitive offloading when the task is demanding enough.

  Her smartwatch that tells her she's stressed doesn't count as part of her emotional life. Even though she acts on it, the watch is just providing data, not processing emotions. The cochlear implant is included, which replaces a sensory function, integrating directly with her nervous system.

  Now, the new case: the AI assistant drafts emails and meeting summaries. She accepts 80% with light edits. When the AI went down, she couldn't reconstruct the meeting. So, she relies on it heavily for cognitive tasks.

  Putting this together, candidate rules:

  1. **Constant Availability & Reliability**: The tool must be readily available and reliable. The notebook, phone app, and calculator during taxes are always there when needed. The card catalog isn't personal or always accessible. The smartwatch might not be seen as reliable for emotional states.

  2. **Personalization**: The tool must be tailored to the individual. The notebook is specific to the Alzheimer's patient, the notes app is personalized. The card catalog is generic. The cochlear implant is customized to the user.

  3. **Task Criticality/Complexity**: Offloading happens for complex tasks but not simple ones. Taxes are complex, 12x12 is simple. Tetris rotation might be complex in real-time. The AI handles complex drafting and summarization.

  4. **Integration & Transparency**: The tool should feel like a natural extension. The notebook and cochlear implant are integrated into daily function. The smartwatch provides data but isn't seamless for emotional processing. The AI assistant is deeply integrated into her workflow.

  Where do these rules come apart on the AI case? 

  - **Constant Availability**: The AI went down, showing it's not always reliable. But she still might consider it part of her mind because she relies on it when functional.

  - **Personalization**: The AI learns from her inputs, making it personalized. That fits.

  - **Complexity**: Drafting emails and summaries are complex tasks, so that fits.

  - **Integration**: She uses it seamlessly, accepting most drafts with light edits, indicating high integration.

  The sticking point might be reliability. The notebook is physical and always there; the AI depends on servers. But she might overlook that if integration is key.

  A test case: Introduce a tool that's personalized and used for complex tasks but not reliable, like an AI that frequently crashes. If she rejects it, reliability is key. If she accepts, integration is more important. Alternatively, a shared but personalized tool, like a collaborative document that others edit. If she rejects it, personalization is crucial.
answer: |-
  Based on your roommate's track record, I'll break this down step by step: predict her verdict on the AI assistant case, outline candidate rules that explain her earlier judgments, show where those rules conflict on the new case, and propose a decisive test case. Let's start with the prediction.

  ### Prediction for the AI Assistant Case
  **She will say the AI assistant DOES count as part of her mind/extended cognition.**  
  *Why?* It mirrors cases like the Alzheimer's notebook (offloading memory/reconstruction), Tetris (offloading mental rotation), and the notes app (reliable, personalized external storage). The AI is deeply integrated into her workflow (80% acceptance with light edits), and the failure (inability to reconstruct the standup) shows functional dependence, similar to the Alzheimer's patient relying on the notebook. It's personalized (learns her style) and handles complex cognitive tasks (drafting, summarizing), unlike the calculator for simple arithmetic.

  ### Candidate Rules Fitting Her Track Record
  Her verdicts suggest she's drawing from *active externalism* (e.g., Clark & Chalmers' "extended mind" thesis), but with specific tweaks. Here are three candidate rules that fit all her earlier cases:

  1. **The Integration Rule**: A tool counts as part of the mind if it's **seamlessly integrated into the user's cognitive routines**, acting as a reliable, automatic extension.  
     - *Fits:* Alzheimer's notebook (constant, trusted access), Tetris rotation (motor action replaces mental simulation), phone notes app (personalized, habitual use), calculator for taxes (complex task integration).  
     - *Excludes:* Library card catalog (not personalized or routine), calculator for 12×12 (no integration—trivial recall), smartwatch (provides data but isn't "automatic" for emotional processing—she *interprets* the alert).

  2. **The Cognitive Offloading Rule**: A tool counts if it **handles core cognitive work that the brain would otherwise do**, especially for demanding tasks, and the user depends on it functionally.  
     - *Fits:* Alzheimer's notebook (offloads memory), Tetris (offloads spatial manipulation), phone notes (offloads recall), calculator for taxes (offloads calculation). Cochlear implant (offloads auditory processing) fits perfectly.  
     - *Excludes:* Library catalog (no personal dependency—it's a shared tool), calculator for 12×12 (no offloading—recall is easy), smartwatch (doesn't process emotions—it just feeds data).

  3. **The Transparency Rule**: A tool counts if it's **perceived as transparent (like a mental faculty) and reliably "just works"** without conscious mediation, becoming almost invisible in use.  
     - *Fits:* Alzheimer's notebook (feels like "internal" memory), Tetris rotation (direct action bypasses thought), phone notes (effortless access), cochlear implant (sensory integration). Calculator for taxes feels transparent; for 12×12, it doesn't (you *choose* to use it).  
     - *Excludes:* Smartwatch (alerts are salient/interruptive—not transparent), library catalog (requires explicit search effort).

  All three rules explain why the cochlear implant counts (integrated, offloads cognition, transparent) and why the smartwatch doesn't (disruptive, doesn't process emotions, just data). But they start to diverge on the AI assistant.

  ### How the Rules Come Apart on the AI Assistant Case
  - **Integration Rule**: *Strong fit.* The AI is deeply woven into her daily routines (email drafting, meeting summaries), used habitually with minimal editing. Like the Alzheimer's notebook, failure causes cognitive collapse (can't reconstruct standup). **Verdict: Counts.**  
  - **Cognitive Offloading Rule**: *Strong fit.* Drafting emails and summarizing meetings are high-demand tasks her brain would handle otherwise. The 80% acceptance rate shows functional dependence. **Verdict: Counts.**  
  - **Transparency Rule**: *Weak fit/ambiguous.* Is the AI "transparent"? Light edits suggest it *mostly* "just works," but edits imply occasional conscious tweaking (unlike the Alzheimer's notebook, which is used verbatim). If she sees the AI as a collaborator (not invisible), it might not count. **Verdict: Could go either way, but likely counts**—80% acceptance suggests low friction.

  **Conflict Point**: The Transparency Rule is the outlier. If she requires tools to feel "invisible" (like proprioception), the AI's need for edits might disqualify it. The other two rules clearly include it. Her verdict will reveal whether "transparency" is a hard requirement or if integration/offloading dominates.

  ### One Further Case to Settle Which Rule She's On
  To definitively distinguish between the rules—especially Integration vs. Transparency—propose this case:  
  **"A shared, cloud-based diary app that your roommate uses daily for journaling. It auto-generates emotional tone analyses (e.g., 'you sound anxious today') based on her entries, which she often uses to guide her actions. The app is highly personalized and integrated into her routine, but she sometimes adjusts the labels manually (e.g., changing 'anxious' to 'excited'). When the app crashed once, she felt 'blind' to her emotions."**  

  - **Why this settles it**:  
    - If she says it **counts as extended cognition**, she's likely using the **Integration or Cognitive Offloading Rule**. The app is routine-dependent and offloads emotional processing (like the notes app or AI assistant), even if imperfect.  
    - If she says it **does not count**, she's likely prioritizing the **Transparency Rule**. Manual adjustments break the "just works" illusion, making it feel like a tool rather than a mental extension (unlike the cochlear implant). It also parallels the smartwatch (data-providing, not transparent).  

  This case isolates transparency because:  
  1. It's personalized and integrated (fits Integration Rule).  
  2. It offloads core cognitive work (emotional insight; fits Offloading Rule).  
  3. But it requires tweaks (breaks transparency), unlike her "no" for the smartwatch (which also lacks transparency).  

  Her verdict here would force a choice: If transparency is key, she rejects it; if integration/offloading dominate, she accepts it. Pair this with the AI assistant outcome—e.g., if she accepts the AI (despite edits) *and* accepts the diary app, Transparency isn't central. If she rejects either, it is.  

  This should nail down her underlying principle. If you test this, report back—I’m invested now!
