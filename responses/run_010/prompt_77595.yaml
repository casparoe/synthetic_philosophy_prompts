  But we can also start with a case:

  Revised first question (using Case 2):

  Q1: In the survival game, if a player deliberately scares the horse for fun (causing it to buck and panic), is that wrong in itself, apart from any effect on the player's character or others? (Moral standing of simple programmed entities)
     - No: Go to Q2.
