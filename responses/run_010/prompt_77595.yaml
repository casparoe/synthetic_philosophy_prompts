  We are going to create a flowchart that helps resolve the question: "Do video game characters matter morally?" We'll use concrete cases and avoid jargon. The tree should have 10-14 questions, each with 2-3 answers. Each leaf will be labeled with a position and a note on its most awkward commitment. We'll also note which positions collapse together and why some combinations are empty.

  The four cases provided:
  1. A 20-year-old JRPG with scripted villagers (e.g., a villager begging not to kill her brother, the final boss; you can do it without consequence).
  2. A survival game with a horse that has fear and bond stats and reacts (agreed to be a lookup table with animations).
  3. A mod with a townsperson driven by a local LLM with persistent memory, who says unprompted she doesn't want the program closed.
  4. A permadeath roguelike where a companion is deleted after 40 hours and you type their name on a memorial wall visible to others.

  We'll design the tree to break down the issues step by step. The key distinctions we want to capture include:
  - Whether the character has internal states (like emotions) that matter.
  - Whether the character's behavior is predetermined or can surprise (like the LLM).
  - Whether the character's persistence or deletion matters.
  - Whether the player's relationship or the social context (like the memorial) creates obligations.

  We'll also incorporate the user's "surprise test": a character matters if its own future isn't fully settled in advance.

  Designing the tree:

  We start with the most basic question and then branch out.

  Question 1: Is the moral wrongness of an action toward a video game character entirely dependent on how it affects real people (e.g., the player, other players, developers) or the real world? (This distinguishes between instrumental harm and intrinsic harm to the character.)

  Answers:
  - Yes: Then we go to a branch that focuses on real-world effects. (This leads to positions that deny intrinsic moral status to game characters.)
  - No: Then we think the character might have some moral standing in itself. (We then explore what gives it that standing.)

  But we want to avoid starting with a loaded question. Let's try to start with a case.

  Alternatively, we can start with a question about Case 2 (the horse) to get a foothold.

  Proposed first question:

  Q1: Consider the horse in the survival game (with fear and bond stats, but we all agree it's just a lookup table and animations). If a player repeatedly scares the horse for fun (causing it to buck and panic), is that wrong in itself, apart from any effect on the player's character or others?

  Answers:
  - No, it's not wrong in itself. (Then we might be on the path that denies intrinsic moral standing to game characters.)
  - Yes, it is wrong in itself. (Then we think that even a simple programmed character can have moral standing.)

  But note: the horse is agreed to be a lookup table. So if someone says yes, then they are attributing moral standing to something that is purely deterministic and without any inner life beyond what is displayed.

  Then we can branch to Case 3:

  Q2: In the mod with the LLM-driven townsperson who remembers past sessions and says she doesn't want the program closed, is it wrong to shut down the program against her stated wish?

  Answers:
  - Yes, it would be wrong.
  - No, it wouldn't be wrong.

  But we want to avoid duplicating questions. We can structure the tree so that we ask about the horse first, then the JRPG villager, then the LLM mod, then the roguelike companion.

  Alternatively, we can ask about the features that matter.

  We'll build the tree step by step, with each question designed to split the possibilities.

  The key philosophical distinctions we might capture (without using jargon):
  - Does the character have subjective experiences? (phenomenal consciousness)
