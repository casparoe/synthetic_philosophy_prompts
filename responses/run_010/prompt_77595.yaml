  We'll build the full tree in the output. We'll aim for 12 questions and cover the cases.

  Final tree plan:

  We'll have 12 questions, each with 2-3 answers. We'll end with about 8-10 leaves.

  Now, for the user's view: the surprise test. We will include a question that directly addresses it and route to a leaf.

