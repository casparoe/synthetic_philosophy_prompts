  - Is the character's behavior open-ended and not predetermined? (agency or free will)
  - Does the character have a persistent identity over time? (persistence)
  - Does the player form a meaningful relationship with the character? (relational duties)
  - Is the character embedded in a social context that confers value? (social recognition)

  We also have the user's surprise test: the character matters if its future isn't fully settled.

  Proposed questions (with distinctions in parentheses):

  1. (Starting point) When considering an action toward a video game character, does the moral question depend entirely on real-world consequences (like effects on players, developers, or society)? (Instrumentalism vs. non-instrumentalism)
     - Yes: Go to Q2.
