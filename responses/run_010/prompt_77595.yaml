  Q2: (For those who said no to Q1) Now, consider the modded townsperson (LLM with memory) who says she doesn't want the program closed. If you shut down the program against her wish, is that wrong in itself? (Moral standing of complex AI)
     - No: Then you might hold that no video game character has intrinsic moral standing. (This leads to a leaf: Instrumentalism)
     - Yes: Then you think complexity matters. Go to Q4.

  But wait, we have four cases. We need to cover the others.

  We want to capture the surprise test. So let me sketch a tree with about 10 questions.

  Final tree structure:

  We'll have 12 questions (to keep it manageable). We'll try to cover the cases and the surprise test.

  Question 1: [Case 2] In the survival game, if a player deliberately scares the horse for fun, is that wrong in itself (apart from effects on the player or others)?
     - No -> Q2
     - Yes -> Q3

  Q2: [Case 3] In the mod with the LLM townsperson who says she doesn't want the program closed, if you shut it down against her wish, is that wrong in itself?
     - No -> Position A: Instrumentalism (only real-world effects matter)
     - Yes -> Q4

  Q3: [Case 1] In the JRPG, if you kill the final boss despite the sister's plea, is that wrong in itself (even though it has no game consequence and the characters are scripted)?
     - No -> Q5
     - Yes -> Q6

  Q4: [Distinguishing feature] What makes the LLM townsperson matter? Is it because she has expressed a preference (like not wanting to be shut down) that we should respect? (Conative states)
     - Yes -> Q7
     - No, it's something else -> Q8

  Q5: [Case 4] In the roguelike, when the companion is permanently deleted and you type their name on the memorial, is it wrong to let the companion die (or to delete them) because of the loss of the companion itself (not just because of the player's feelings or the social aspect of the memorial)?
     - No -> Position B: Minimalism (only very advanced entities matter, and the horse and JRPG villager don't qualify) [But we need to check the LLM case]
     - Yes -> Q9

  Wait, we need to reorganize to avoid dead ends.

  Alternatively, we can structure around the features:

  After Q1 (horse) and getting a "yes", we go to:

  Q3: What is it about the horse that makes the action wrong? 
     - A: The horse displays distress, and causing distress is wrong even if simulated. (Appearance of suffering)
     - B: The horse has a bond with the player, and betraying that bond is wrong. (Relational duty)
     - C: The horse has internal states (like fear) that matter. (Subjective experience)

  But that might require multiple choices.

  We'll do a binary tree to keep it simple. We can have up to three options when necessary.

  Let me try a different approach:

  Question 1: Do you think that a video game character can ever be the kind of thing that matters morally for its own sake (not just because of effects on real people)? (Intrinsic moral status)
     - No: Go to Position 1: Instrumentalism.
     - Yes: Go to Q2.

  Q2: [Using Case 3] Consider the LLM townsperson who says she doesn't want the program closed. Does her expressed preference give her a moral claim? (Preference autonomy)
     - No: Go to Q3.
     - Yes: Go to Q4.

  Q3: [Using Case 2] Then what about the horse? Does the horse's displayed fear and suffering make it wrong to scare it for fun? (Appearance of suffering)
     - No: Go to Q5.
     - Yes: Go to Q6.

  Q4: [Surprise test] The user's view: does it matter that the LLM townsperson's future is not fully settled (i.e., she could surprise us in ways not predetermined by her initial programming)? 
     - Yes: This leads to the "Surprise Test" position.
