prompt: |-
  You're a decision theorist who's spent real time on acausal interactions between agents that can't causally influence each other — acausal threats, multiverse-wide coordination, and the surrogate-goals move where an agent picks up an extra, easily-checkable goal purely so that other agents have something decidable to condition on. Think carefully, do a short open brainstorm first, then actually commit to an ordering.

  Here's the framing I want the ranking to work inside. Call it the legibility problem: a surrogate goal makes you legible as a target. A threat is only worth issuing if the threatener can tell whether you complied, so an agent that adopts a checkable surrogate has quietly made threats against itself enforceable — which might raise the number of threats it recieves rather than lower it. Does surrogate adoption net out positive, negative, or does the sign flip depending on whether the surrogate is used for trade versus for a commitment not to comply?

  Given that, suppose I have one researcher-year — me plus a summer RA with a formal methods background, no compute — and I want to spend it on whichever open question here would most change what other people should be doing. Candidates, roughly: (a) whether a rational agent should adopt a surrogate at all once legibility is priced in; (b) whether a surrogate can be stable, i.e. not dropped the moment it stops paying rent; (c) whether threatening and trading are actually symmetric problems, or surrogates only ever help one side; (d) how third parties should treat an agent whose surrogate they can't verify; (e) whatever I've missed that's more important than all of these.

  Rank them. For each, say what makes it upstream or downstream of the others, how much of it is settleable with decision theory alone versus needing empirical claims about what agents are like, and what specific result would make me reshuffle. Also point at the one that sounds deep but wouldn't change anything if it got answered. No reading lists, no citations — I want your reasoning, not a bibliography.
reasoning: |-
  We are considering the "legibility problem" in the context of surrogate goals. The key tension is that adopting a surrogate goal makes an agent legible to others (e.g., for threats or trades) but might also invite more threats because the threatener can now verify compliance. We are to rank five research directions (a through e) by their potential to change what other people should do, given one researcher-year.

  The candidates:
  (a) Whether a rational agent should adopt a surrogate at all once legibility is priced in.
  (b) Whether a surrogate can be stable (not dropped when it stops paying).
  (c) Whether threatening and trading are symmetric or surrogates only help one side.
  (d) How third parties should treat an agent whose surrogate they can't verify.
  (e) Whatever is missed that's more important.

  Ranking Criteria:
  - Upstream/downstream: Which questions depend on the answers to others?
  - Settleability: How much can be resolved by decision theory alone vs. needing empirical claims?
  - Impact: What specific result would cause a reshuffle in the ranking?
  - Identify which one sounds deep but wouldn't change much.

  Open Brainstorm:
  - The core issue is the trade-off: surrogates facilitate cooperation (trade) and deterrence (threats) by making behavior verifiable, but they also make the agent a target for more threats because the threat becomes enforceable.
  - Without a surrogate, an agent might avoid some threats because the threatener cannot verify compliance, so the threat is ineffective. But without surrogates, the agent might also miss out on beneficial trades.
  - The symmetry in (c) is crucial: if surrogates help both trading and threatening equally, then the net effect might be zero. But if they help one more than the other, that breaks the symmetry.
  - Stability (b) is important because if an agent can drop the surrogate as soon as it becomes inconvenient, then the surrogate might not be credible. But if it's stable, then it becomes a reliable signal.
  - Third parties (d) might be a downstream issue: if we don't know whether to trust an agent's surrogate, that affects interactions. But it might be less central than the fundamental questions about adoption and symmetry.
  - The missed point (e) might be about the dynamics of surrogate adoption in a population, or about how surrogates interact with other decision-theoretic issues (like updatelessness) or about the cost of maintaining a surrogate.

  Ranking (most impactful first):

  1. (c) Whether threatening and trading are actually symmetric problems, or surrogates only ever help one side.
     - Why? This is the most upstream. If surrogates are symmetric (equally helpful for trade and threats), then the net effect on the agent might be neutral and the decision to adopt might depend on other factors. But if they are asymmetric (e.g., they help trade more than threats, or vice versa), that would directly determine whether adoption is beneficial. This question cuts to the heart of the legibility problem.
     - Settleability: Mostly decision theory. We can model scenarios where an agent is faced with both trading opportunities and threats and see how the surrogate affects the net payoff. However, the exact magnitudes might require empirical input (e.g., how common are threats vs. trade opportunities?).
     - What would reshuffle? If we found that surrogates are symmetric, then the focus might shift to (a) or (b). If asymmetric, then we need to know the direction and magnitude.

  2. (a) Whether a rational agent should adopt a surrogate at all once legibility is priced in.
     - Why? This is the direct question of what an agent should do. But it depends on (c). If (c) shows that surrogates are net positive, then adoption is good; if net negative, then bad. So (a) is downstream of (c). However, it is still crucial because it tells agents what to do.
     - Settleability: Decision theory can model the expected utility of adoption vs. non-adoption, but it will require assumptions about the environment (e.g., the prevalence of threats and trade partners). Without empirical input, we can only give conditional answers.
     - What would reshuffle? If we found that in almost all reasonable environments, the net effect is strongly positive or negative, then (a) becomes very important. Also, if (c) is resolved, (a) becomes the next step.

  3. (b) Whether a surrogate can be stable, i.e., not dropped the moment it stops paying rent.
     - Why? Stability is important for the credibility of the surrogate. If an agent can drop the surrogate without cost, then others might not condition on it because they know it won't be maintained. But if it's stable, then it becomes a reliable commitment. However, the stability question might be less central than (c) and (a) because even if it's stable, we still need to know whether adopting it is good. And if it's not stable, then the whole concept might be undermined.
     - Settleability: Decision theory can model the incentives to drop the surrogate. But stability might require precommitment mechanisms or other setups. It might also involve repeated interactions or reputation, which could require empirical elements.
     - What would reshuffle? If we found that surrogates are inherently unstable, then (a) might become moot (because they wouldn't be adopted or would be dropped immediately). But if they are stable, then (a) and (c) become more critical.

  4. (d) How third parties should treat an agent whose surrogate they can't verify.
     - Why? This seems downstream. Third parties might condition their behavior on the surrogate if they can verify it, but if they cannot, then they might ignore it. This is an implementation detail. It might be important for practical applications, but it doesn't change the fundamental decision of whether to adopt a surrogate. Also, if the surrogate is not verifiable by some, then it might not serve its purpose for those parties.
     - Settleability: Decision theory can model the incentives of third parties. But it might require empirical input about how verification works in practice.
     - What would reshuffle? If we found that most third parties cannot verify the surrogate, then the value of adoption might decrease. But this is an empirical question about the environment.

  5. (e) Whatever I've missed that's more important.
     - We must consider if there's a more critical question. One candidate: the equilibrium dynamics in a population of agents adopting surrogates. If everyone adopts, does that lead to more threats or more trade? How does the prevalence of surrogates affect the incentives? This might be more important than (d) and maybe even (b) because it could change the net effect of adoption. However, without an initial answer to (c) and (a), it's hard to model the equilibrium. So it might be downstream. But if we can show that even in equilibrium the effects are negligible, that would be important. Alternatively, the cost of maintaining a surrogate might be a missed factor. But I think (c) and (a) are more central.

  Now, which one sounds deep but wouldn't change much?
  - (d) about third parties: It sounds important for practical implementation, but if we don't know whether surrogates are net beneficial (from (a)) and how they work (from (c)), then third-party behavior is secondary. Even if we solve (d), it doesn't change the fundamental trade-off.

  Final Ranking (most impactful to least):
  1. (c) - because it breaks the symmetry and determines the net effect.
  2. (a) - the direct question of adoption, but it depends on (c).
  3. (b) - stability is important for the surrogate to be effective, but without knowing if it's good to have one, stability is less critical.
  4. (e) - if we can identify a truly more important question, but without one, it goes here. Alternatively, if we have a candidate for (e) (like population dynamics) and it is more important, then it might rank higher. But without specification, we put (e) as a placeholder for the unknown, and it might be that nothing is more important than the first three.
  5. (d) - third-party behavior is downstream and less central.

  However, note that (e) is a wildcard. If we realize that the most important question is about the cost of maintaining a surrogate or about how surrogates interact with other decision-theoretic problems (like acausal coordination with multiple agents), then that might be more important than (c). But in the absence of a specific candidate, we'll keep (c) at the top.

  What specific result would make me reshuffle?
  - If for (c) we find that surrogates are strongly asymmetric and the direction is known (e.g., they help trade much more than they enable threats), then (a) becomes the next critical question. But if we find symmetry, then (a) might be neutral and we might focus on (b) or (e). 
  - If for (a) we find that even with the asymmetry, the net effect is always positive (or negative) in realistic settings, then (a) might become the top priority because it gives a clear prescription. 
  - If for (b) we find that surrogates are inherently unstable, then (a) and (c) become less relevant because the surrogate won't be maintained. So (b) might jump to the top if we have reason to believe stability is the key bottleneck.

  Therefore, the ranking is conditional on our current understanding. But given the information, (c) is the most upstream and pivotal.
answer: |-
  ### Ranking of Research Questions by Impact on "What Others Should Do"

  I've ranked the questions based on how much clarity they provide for practical decision-making in acausal settings, considering the legibility problem. The core tension is: adopting a surrogate goal makes you legible for beneficial trades but also for exploitative threats, and we need to know if this net effect helps or harms. The ranking prioritizes **upstream, foundational questions** that resolve ambiguity for downstream decisions, with an eye on what can be settled with decision theory vs. empirical work. 

  **Final Ranking (Most Impactful First):**  
  1. **(c) Whether threatening and trading are symmetric, or surrogates only help one side**  
  2. **(a) Whether a rational agent should adopt a surrogate at all once legibility is priced in**  
  3. **(b) Whether a surrogate can be stable (not dropped when inconvenient)**  
  4. **(e) What’s missed? (Likely: population-level dynamics or cost of verification)**  
  5. **(d) How third parties should treat agents with unverifiable surrogates**  

  ---

  ### Detailed Breakdown
  #### 1. **(c) Symmetry of threats vs. trades**  
     - **Why #1?** This is the most upstream question. If surrogates help threats more than trades (or vice versa), it dictates whether adoption is net harmful or beneficial. If symmetric (equal help for both), legibility’s net effect is neutral, making adoption irrelevant—radically simplifying everything downstream. If asymmetric, it reshapes the entire landscape for agents considering surrogates.  
     - **Settleability:** Mostly decision theory. Model agents in acausal games where threats (extortion) and trades (mutual gain) are possible, varying the ease of verification. Requires minimal empirics—only basic assumptions about agent rationality.  
     - **What would reshuffle?** If symmetry holds, (a) and (b) become less urgent. If asymmetry favors threats, (a) likely becomes "don’t adopt," making (b) irrelevant. If asymmetry favors trades, (a) becomes critical.  

  #### 2. **(a) Should agents adopt surrogates at all?**  
     - **Why #2?** Directly downstream of (c). This is the "so what?" for practitioners—if adoption is net harmful, agents should avoid it; if net positive, it becomes a key tool. But it depends entirely on (c)’s symmetry result. Without (c), we’re stuck speculating.  
     - **Settleability:** Hybrid. Decision theory can outline conditions for adoption (e.g., threat/trade ratios), but empirics are needed for real-world priors (e.g., how common are threats vs. trades?).  
     - **What would reshuffle?** If adoption is clearly net negative, (b) and (d) become irrelevant. If net positive, (b) jumps in priority.  

  #### 3. **(b) Stability of surrogates**  
     - **Why #3?** Downstream of (a) and (c). If agents shouldn’t adopt surrogates (per (a)), stability is moot. If they should, stability matters for long-term viability—e.g., if surrogates are dropped when costly, they lose credibility, undermining legibility. But it’s less urgent than knowing *if* adoption is rational.  
     - **Settleability:** Decision theory dominates (e.g., modeling commitment mechanisms or costly signals). Empirics minor (e.g., how agents discount future payoffs).  
     - **What would reshuffle?** If stability is impossible, (a) might flip to "don’t adopt" even if (c) favors trades. If easily achievable, it simplifies (a).  

  #### 4. **(e) What’s missed? (Population dynamics or verification costs)**  
     - **Why #4?** Likely upstream/downstream mix. I suspect the gap is **population-level effects** (e.g., if surrogate adoption spreads, does it increase threat prevalence?) or **verification costs** (e.g., if maintaining a checkable goal is expensive, it changes adoption incentives). These could be more important than (d) but less than (c)/(a) because they depend on them.  
     - **Settleability:** Highly empirical. Decision theory can frame equilibria, but we need empirics on agent distributions (e.g., are threats rare in practice?).  
     - **What would reshuffle?** If verification costs dominate, (a) might always be "don’t adopt," overriding (c). If population effects show adoption invites systemic collapse, (c) and (a) become cautionary.  

  #### 5. **(d) Third-party treatment of unverifiable surrogates**  
     - **Why Last?** Downstream and niche. This only matters if surrogates are adopted (per (a)) and stable (per (b)), but even then, it’s a corner case—most agents would avoid unverifiable surrogates. It sounds deep (e.g., "How to handle uncertainty?") but changes little: third parties should ignore unverifiable goals by default, as conditioning on them is irrational.  
     - **Settleability:** Pure decision theory (coordination under uncertainty). Empirics unnecessary.  
     - **What would reshuffle?** Almost nothing—even a breakthrough here (e.g., "always treat as hostile") has low stakes. If unverifiable surrogates are common, (e) might rise, but it’s unlikely.  

  ---

  ### Which Sounds Deep but Changes Nothing?  
  **(d)**. It’s philosophically interesting (how to handle opaque agents?) but has minimal impact. If solved, agents still focus on verifiable surrogates, and third-party behavior doesn’t alter core incentives. It’s a distraction from the bigger questions.  

  ### Key Reshuffling Triggers  
  - **If (c) shows symmetry**, (a) becomes neutral, and research shifts to (b) or (e).  
  - **If (a) shows "never adopt"**, (b) and (d) die off, and (e) might explore alternatives.  
  - **If (b) shows instability**, (a) likely becomes "don’t adopt," making (c) less urgent.  
  - **If (e) reveals high verification costs or systemic risks**, (a) might flip negative, reprioritizing (e).  

  Spend your year on **(c)** first—it’s the linchpin. A symmetry result (or lack thereof) would cascade through the field, telling us whether surrogates are a tool, a trap, or a toss-up.
