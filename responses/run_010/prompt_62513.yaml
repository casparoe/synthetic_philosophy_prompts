  I need to address each part carefully. First, the nature of the disagreement. It seems like there are multiple layers: formal vs. normative projects. The accuracy-first program is formal—it shows what follows from certain assumptions. Critics are challenging the normative foundations of those assumptions. So they're talking past each other to some extent.

  On the additivity dispute, it's both substantive and intuitive. Berker's objection imports moral philosophy intuitions (separateness of persons) into epistemology, but defenders argue propositions aren't separate in that way. This might be a clash of frameworks rather than something resolvable by argument alone.

