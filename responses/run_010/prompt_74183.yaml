prompt: |-
  So a friend of mine is writing a dissertation on hypocrisy and I've been freeload­ing off her reading list for about a year now, mostly at night. I don't do philosophy professionally — I work in compliance at a hospital, which is probably why one particular pattern keeps snagging on me at work and I've never been able to find a word for it. I want to know whether it's a recognized thing in the literature or whether it's just an idiosyncratic itch I have.

  The setup is this. Someone condemns another person, pretty forcefully, for doing X. And this person has genuinely never done X. Not once. No cover-up, no selective memory, no "well that one time didn't count" — their record on X is spotless. So they aren't a hypocrite in the normal sense, because there's no mismatch between what they say and how they've actually behaved. But it turns out the spotless record is an artifact of the fact that they were never in a situation where X was tempting, or even available. They grew up somewhere it didn't come up, or the stakes never got high enough to matter, or somebody else always ate the cost so they never had to choose. And sometimes you get to see the counterfactual resolved, because they change jobs, or the situation finally arises, and they do X within a month — or they say something out loud that makes it obvious they'd have done it in a heartbeat given half a chance. The condemnation isn't coming from a fraud. It's coming from somebody who was never tested.

  Two real ones from my life. A physician I worked with used to be very loud at our M&M conferences about a certain kind of chart-cutting-corners, and she was personally impeccable about it, genuinely, no complaints ever. But she'd spent her whole career in a department where three senior partners read everything before it left the building, so there was never a single moment where the shortcut would have bought her anything. Six months after she moved to a place with no such review, her notes were worse than anybody's on staff. Nobody thought she'd been lying before, exactly. It just retroactively made all those speeches feel like they'd been free. Second one: a guy in my book group goes hard on people who cheat on their partners. He's faithful, always has been — he's also been with exactly one woman for twenty-two years, is completely gone on her, and has said out loud that he has no idea what he'd do in other circumstances, and I don't think he's fishing for compliments when he says it.

  Here's the part I can't name: what, exactly, is wrong with the blaming in these cases? It isn't insincerity. It isn't whataboutism — nobody's deflecting anything. And it doesn't seem to be the ordinary hypocrisy complaint, since that whole complaint looks like it depends on your having done the thing, or at least doing it now. It's more that clean hands which never cost you anything don't seem to earn you anything, though I'll admit the intuition wobbles under pressure, because presumably we'd still rather have the clean-handed person do the blaming than the dirty-handed one, however each of them got that way. So does this have a name? I've heard moral luck brought up in connection with the driver who runs over a child through no fault of his own, and I keep seeing the phrase standing to blame, and I assume those are neighbors, but neither one looks like it's this. I'm not after just a label — I want the carving. What is the phenomenon precisely, what's the nearest established concept, and how does it differ from plain hypocrisy, from a general loss of standing, from moral luck, and from the old virtue-ethics point that doing the right thing isn't the same as being the kind of person who'd do it anyway? And where are the edges: does it still bite if the person would genuinely have held up under pressure but was simply never asked? Does it matter whether an outsider can tell they're untested, or only whether they are in fact untested? And does it get worse if they eventually do X, or is the eventual doing a separate problem that just reveals what was already true? If there's really no term for it, coin one for me and tell me which cases fall just inside and just outside it.
reasoning: |-
  Okay, the user is asking about a specific moral phenomenon they've observed in their work and personal life. They describe situations where someone condemns an action (X) forcefully, has a genuinely spotless record regarding X, but that spotlessness is due to never facing temptation or opportunity. Later, when circumstances change, they either do X or express they would have. The user wants to know if this has a name in philosophical literature and how it differs from related concepts.

  First, I need to recall relevant philosophical concepts. Hypocrisy is the obvious one, but the user already distinguishes this case since the person hasn't committed X. Moral luck comes to mind—where outcomes affect moral judgment despite similar intentions. The driver who accidentally hits a child is judged differently than one who doesn't, even if both were negligent. But here, it's about the lack of testing rather than luck in outcomes.

  "Standing to blame" is another concept. It refers to whether someone has the moral authority to condemn others, often lost if they're guilty of the same act. However, in this case, the blamer isn't guilty, so they technically have standing. Yet, their criticism feels unearned because they were never tested. This might relate to "moral credibility" or the idea that moral authority requires having faced challenges.

  Bernard Williams' "moral luck" touches on how circumstances affect agency. The physician in the example had her virtue untested because of her environment. When the environment changed, she failed. This suggests that her previous condemnation lacked depth because it wasn't informed by real struggle.

  The user's examples highlight the importance of the cost of virtue. If being virtuous costs nothing (no temptation, no sacrifice), then praising or condemning based on that virtue feels hollow. This connects to Aristotle's virtue ethics, where virtue involves habituation and facing challenges. A virtuous act isn't just about the action but the character behind it, forged through trials.

  The key difference from hypocrisy is that hypocrisy involves a contradiction between one's words and actions. Here, there's no such contradiction initially; the issue is the blamer's untested character. The condemnation is technically sincere but lacks moral weight because it wasn't hard-earned.

  The edges of this concept: What if the person would have resisted temptation but was never tested? The problem still holds because their condemnation lacks the authority that comes from proven resilience. Even if they were capable, without evidence, their stance feels ungrounded. The eventual failure (like the physician) exposes this, but the core issue exists even without failure.

  Naming this concept: "Untested Virtue" seems apt. It captures the blamer's moral position being based on circumstances rather than proven character. Alternatively, "Costless Rectitude" emphasizes that their righteousness came without personal sacrifice.

  In summary, the phenomenon is about the insufficiency of untested virtue for authoritative moral condemnation. It's distinct from hypocrisy (no behavioral contradiction), moral luck (focused on testing rather than outcomes), and standing to blame (which is about guilt, not testing). The user's intuition points to a gap in how we perceive moral authority when it's not earned through struggle.
answer: |-
  Your description is razor-sharp, and the phenomenon you've identified is absolutely recognized in moral philosophy and adjacent fields. It's not hypocrisy in the standard sense, but it *is* a profound problem with **moral authority** or **credibility**, specifically tied to the **untested nature of the virtue**. Here's the carving:

  1.  **The Core Phenomenon: Untested Virtue Undermining Condemnatory Standing**
      *   **The Problem:** The force of someone's *condemnation* of X is undermined, not because they are hypocrites (they haven't done X), but because their own *avoidance* of X lacks **demonstrated commitment under pressure**. Their "clean hands" are a product of circumstance, not proven character or costly choice. Their condemnation therefore rings hollow or lacks **moral weight** – it hasn't been "earned" through facing the temptations or costs they are judging others for succumbing to.
      *   **Why it's Wrong:** Condemnation carries weight when it comes from someone who understands the *cost* of resisting X, either through personal struggle or deep empathy derived from facing similar situations. Untested condemnation lacks this grounding. It can feel like cheap moralizing, judgment from a position of privilege or luck, or a failure to grasp the true difficulty of the choices being judged. It risks being perceived as self-righteousness born of ignorance about the realities of temptation or conflict.

  2.  **The Best Established Concept: Moral Luck (specifically constitutive/circumstantial) & The Conditions of Virtue**
      *   **Moral Luck (Nagel, Williams):** This *is* the closest established framework. While often discussed regarding outcomes (e.g., the unlucky driver), Nagel explicitly categorizes four types:
          *   **Constitutive Luck:** The luck involved in being born with a certain temperament or character.
          *   **Circumstantial Luck:** The luck involved in finding oneself in certain situations.
          *   **Luck in how one is determined by antecedent circumstances.**
          *   **Luck in the way one's actions and projects turn out.**
      *   **Your Cases:** Your examples are prime instances of **Circumstantial Moral Luck**. The physician *luckily* never faced the pressure-cooker environment demanding shortcuts until later. The book group member *luckily* has never faced the temptations of other relationships or waning passion. Their virtue regarding X is largely a product of fortunate circumstances shielding them from relevant tests. Their condemnation fails to acknowledge this luck underlying their own "virtue."
      *   **Virtue Ethics (Aristotle & Moderns):** Aristotle emphasized that virtue isn't just about action, but about stable dispositions (*hexis*) formed through habituation and *choice* under the right conditions (*phronesis* - practical wisdom). A key component is acting "for the sake of the noble" *even when it's difficult*. Your intuition aligns perfectly: virtue requires facing challenges and choosing rightly *despite* temptation or cost. Untested virtue lacks this crucial element of *proven resilience*. It might indicate a good inclination, but not necessarily a fully formed, reliable character trait.

  3.  **Distinctions:**
      *   **Hypocrisy:** This requires a *contradiction* between word/deed. "Do as I say, not as I do." Your cases lack this contradiction *at the time of condemnation*. The problem isn't what they *did*, but the *source* and *robustness* of what they *didn't* do.
      *   **General Loss of Standing:** "Standing to blame" often focuses on *specific disqualifiers* like guilt ("Who are *you* to condemn adultery when you cheated?"). Your cases involve a more subtle erosion of standing: not through guilt, but through the *lack of experiential grounding* necessary for the condemnation to carry its full moral weight. It's a lack of *credibility* based on untestedness, not a disqualification based on guilt.
      *   **Moral Luck (Outcome):** This focuses on how luck affects the *moral assessment* of an *agent's act or outcome* (e.g., the driver). Your focus is on how luck affects the *moral authority* of an *agent condemning others*.
      *   **Virtue vs. Action:** You're pinpointing the gap between *performing a right action* (easy when untempted) and possessing the *virtue* (the stable disposition to act rightly *even when tempted*). The condemnation, while based on a true action (they didn't do X), implicitly claims an understanding of the *virtue* (resisting X under pressure), which they haven't demonstrated.

  4.  **Edges & Nuances:**
      *   **Would They Have Held Up?** This is crucial.
          *   **If they *would* have held up:** The problem *still bites*, but less severely. Their condemnation might be technically correct, but the *force* and *persuasiveness* of it are weakened because it lacks the *demonstration* of commitment under fire. It remains somewhat abstract or theoretical. An observer might reasonably ask, "How do you *know* you wouldn't have cracked? What gives your judgment such certainty?" The *authority* is still diminished by lack of proof. Think of a brilliant strategist who's never seen combat – their plans might be sound, but soldiers might trust the judgment of a scarred veteran more in the chaos of battle.
          *   **If they *would not* have held up (as revealed later):** This *confirms* the initial suspicion that the condemnation was hollow and lacked grounding. The eventual act X reveals the *source* of the initial spotless record (luck/circumstance) and retroactively exposes the condemnation as fundamentally unearned and disconnected from the blamer's own character under pressure. It makes the prior condemnation look like naivete or self-deception.
      *   **Who Needs to Know?**
          *   **The Core Issue:** Exists primarily in the *objective fact* of being untested. The blamer's condemnation lacks the full moral weight *because* they haven't faced the test, regardless of whether others know it.
          *   **Perception:** However, the *impact* and *social perception* of the problem are heightened if others *can tell* or *suspect* the blamer is untested. If the untestedness is obvious (like the book group guy's very limited relationship history), the condemnation is more likely to be dismissed or resented immediately. If it's hidden, the condemnation might stand until circumstances change or contradiction emerges.
      *   **The Revealing Act:** The eventual doing of X doesn't *create* the core problem; it *exposes* and *confirms* it. The core problem – the lack of grounding for the condemnation due to untested virtue – existed at the moment the condemnation was uttered. The act X is strong evidence that the untestedness was the *reason* for the spotless record, not strength of character.

  5.  **A Name: "The Vice of Untested Virtue" or "Costless Rectitude"**
      Since no single term perfectly captures it within the literature, let's coin one based on your brilliant description:

      *   **Untested Condemnation:** This directly names the act: condemnation issued from a position of virtue that has never faced relevant trial.
      *   **The Vice of Untested Virtue:** This frames the *condition* of the blamer as the problem – their virtue, lacking the crucial element of testing, becomes a vice *in the context of judging others*.
      *   **Costless Rectitude:** Emphasizes that their moral correctness came without personal sacrifice or struggle, undermining its value as a basis for judgment.
      *   **Circumstantial Moral Authority Deficit:** More technical, linking it directly to the moral luck framework.

  **Just Inside/Outside the Concept:**

  *   **Inside:**
      *   The physician condemning corner-cutting only after moving to the high-pressure environment without oversight and failing.
      *   The book group member condemning infidelity while having never faced temptation in a long, stable, satisfying relationship and openly admitting uncertainty.
      *   A wealthy politician condemning petty theft who grew up with immense privilege and security.
      *   A manager condemning poor work ethic who inherited their position and never faced job insecurity or grueling entry-level demands.
  *   **Outside (Edge Cases):**
      *   **The Untested Who *Would* Hold & Knows It:** Someone who faced *analogous* tests demonstrating immense self-control/principle in *different* high-stakes areas (e.g., a recovered addict condemning drug use – their recovery *is* the test). Their condemnation carries weight derived from proven character under *similar* pressure, even if not identical. (Still *slightly* weaker on the specific issue, but much stronger overall).
      *   **The Lucky Who Acknowledges Luck:** Someone with a spotless record due to circumstance who condemns X *but explicitly acknowledges* their own good fortune and avoids self-righteousness. "I've been incredibly lucky never to face that kind of pressure; I can't imagine how hard it is, but the standard still must be upheld." This mitigates the problem significantly.
      *   **The Hypocrite:** The standard case – condemns X while doing/having done X.
      *   **Lack of Empathy Alone:** Someone who faced the test and passed, but condemns others harshly *without* empathy for the difficulty. This is a different vice (rigorism, lack of compassion), distinct from the grounding problem of untestedness.

  **Conclusion:** You've identified a critical flaw in moral condemnation that sits at the intersection of Moral Luck (Circumstantial/Constitutive), Virtue Ethics (the necessity of testing for true virtue), and the Conditions of Moral Authority/Credibility. It's the hollowness of judgment pronounced from an ivory tower built by luck, where the judge's own virtue remains an unproven hypothesis. The core is the **erosion of moral authority due to the untested, circumstantially-derived nature of the condemner's own relevant virtue.** "Untested Condemnation" or "The Vice of Untested Virtue" captures it well. Your hospital examples are textbook cases. Tell your friend their reading list is clearly paying dividends for sharp observers! This is exactly the kind of nuanced moral insight philosophical work on hypocrisy and moral luck aims to illuminate.
