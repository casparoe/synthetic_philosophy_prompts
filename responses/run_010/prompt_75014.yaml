  Based on the professor's verdicts in the previous cases and her stated principles (e.g., focusing on the "floor," rejecting the selection of a single prior, and allowing the credal set to spread with ambiguous evidence), the decision rule she endorses is **maximin (Wald's rule)**. This rule evaluates acts by their minimum expected utility over the credal set and requires choosing an act only if it maximizes this minimum. Acts not achieving this maximum minimum are ruled out (impermissible), while acts tied at the maximum minimum are both permissible.

  ### Analysis of Previous Cases Using Maximin:
  1. **Urn (90 balls: 30 red, 60 black/yellow unknown split):**  
     - R: Min EU = \(100 \times \frac{30}{90} = 33.33\) (fixed).  
     - B: Min EU = \(100 \times 0 = 0\) (when black probability is 0).  
     - Verdict: R required (max min), B ruled out. **Consistent.**

  2. **Component (pass prob. ∈ [0.2, 0.8]):**  
     - A: EU = 12 (sure).  
     - B: Min EU = \(30 \times 0.2 = 6\).  
     - Verdict: A required (12 > 6), B ruled out. **Consistent.**

  3. **Same component:**  
     - C: Min EU = \(25 \times 0.2 + 10 \times 0.8 = 13\).  
     - D: EU = 12.  
     - Verdict: C required (13 > 12), D ruled out. **Consistent.**

  4. **Urn (100 balls, black/white split unknown):**  
     - E: Min EU = \(30 \times 0 = 0\) (when black prob. = 0).  
     - F: Min EU = \(30 \times 0 = 0\) (when white prob. = 0).  
     - Verdict: Both permissible (tied at min EU = 0). **Consistent.**

  ### Rejected Rules:
  - **Maximin with upside tiebreak:** In Case 4, E and F have identical min and max (30), so tiebreak wouldn’t change verdict. But if max differed, it might rule out one. The professor’s emphasis on the "floor" (Cases 2–3) and no mention of upside suggests she doesn’t tiebreak.
  - **Hurwicz optimism-pessimism:** Requires weighting min and max. Case 2’s "ceiling doesn’t enter into it" rejects this. Also, no single α fits all cases without violating verdicts (e.g., α must be 1 for Case 1).
  - **E-admissibility / maximality:** Would permit B in Case 1 (since B is optimal for some priors), but the professor ruled it out. Violates her rejection of "picking a prior."

  ### Prediction for Next Week’s Problem:
  - **Urn:** 100 balls, black/white split unknown → credal set: \( p(\text{black}) \in [0,1] \), \( p(\text{white}) = 1 - p \).  
  - **Menu:**  
    - Plus: \( \$40 \) if black, \( \$10 \) if white → EU = \( 40p + 10(1-p) = 30p + 10 \).  
    - Flip: \( \$10 \) if black, \( \$45 \) if white → EU = \( 10p + 45(1-p) = 45 - 35p \).  
    - Swing: \( \$8 \) if black, \( \$60 \) if white → EU = \( 8p + 60(1-p) = 60 - 52p \).  

  - **Min EU (maximin):**  
    - Plus: Min at \( p = 0 \) → \( 10 \).  
    - Flip: Min at \( p = 1 \) → \( 10 \).  
    - Swing: Min at \( p = 1 \) → \( 8 \).  

  - **Verdict:**  
    - Swing is **ruled out** (min EU = 8 < 10).  
    - Plus and Flip are **both permissible** (tied at min EU = 10).  
    - Nothing is required (no strict max min).  

  **Reasoning:**  
  - Swing’s floor (8) is strictly worse than Plus/Flip’s floor (10), so choosing it is a mistake.  
  - Plus and Flip have identical minimums (10), so neither is criticizable (like E/F in Case 4). The professor’s prior rulings show she permits ties without tiebreaking (Case 4) and cares only about the floor, not upside differences (Cases 2–3).  

  ### Recommended Test Question:
  To confirm whether she breaks ties when mins are equal but maxes differ, pose this in seminar:  
  - **Urn:** Same unknown black/white split.  
  - **Menu:**  
    - A: \( \$10 \) for sure.  
    - B: \( \$10 \) if black, \( \$30 \) if white.  
  - **Question:** Which acts are required/ruled out?  

  **Expected Verdicts Under Competing Rules:**  
  - **Pure maximin:** Min EU for both = 10 → both permissible.  
  - **Maximin with upside tiebreak:** B has higher max (30 > 10) → B required, A ruled out.  

  **Why this test?**  
  - Isolates the tiebreak issue: both acts have the same min but different maxes.  
  - If she permits both, pure maximin is confirmed. If she requires B, she tiebreaks on upside.  
  - Her response will resolve ambiguity, as Case 4 didn’t test upside differences (E/F had same max).  

  This test directly probes whether her rule is strictly floor-based or incorporates upside when mins are tied. Given her emphasis on floors (Cases 2–3), pure maximin is predicted, but this question will settle it.
