prompt: |-
  I am circulating a compact statement of my position on the limits of markets ahead of a policy-ethics workshop, and before it goes out I would like the package audited for internal coherence — not defended, not situated in the literature, just checked against itself. Here is what I hold.

  1. Default presumption: where an exchange is voluntary, leaves both parties better off by their own lights, and imposes no uncompensated costs on third parties, the law ought to permit it. The justificatory burden falls on prohibition, never on permission.

  2. Some markets are nonetheless properly blocked. I support the prohibition on paid living kidney donation and the prohibition on selling one's vote, and I regard these as two instances of one phenomenon rather than as unrelated taboos that happen to sit near each other on a list.

  3. I reject any inference from the intensity of a reaction to the wrongness of what provokes it. Revulsion is not evidence, and I want every claim in my account statable to someone who feels no revulsion at all. At the same time, I think the theorist who treats widespread aversion to a market as simply one further preference to be fed into a cost-benefit calculation has missed something, and that the persistence of such aversion is a social fact which anyone designing or defending a market ignores at their peril.

  4. The best account I have of what goes wrong in the blocked cases is expressive rather than distributive: certain goods are degraded, or have their social meaning corrupted, by being priced and traded, because market treatment of them expresses an attitude that is incompatible with the attitude a society ought to take. I want this stated without the vocabulary of dignity, sanctity, or intrinsic worth — those terms have never done any work for me — so it must be a claim about the meaning a practice carries in a given society, not about a property the good possesses.

  5. I do not think appeal to unjust background conditions is sufficient. Even in a society with a decent floor, adequate information, and no duress, I would oppose a legal market in kidneys. Inequality explains why actually existing organ markets are worse than they need to be; it does not explain what is wrong with them.

  6. I would accept a public monopsony: a single governmental purchaser paying living donors a fixed, non-negotiable sum, with organs allocated by the medical criteria already in use rather than by willingness to pay. I regard that arrangement as a genuine improvement on both the status quo and an open market, and I would not oppose it. What I object to is organs going to the highest bidder, and the emergence of an organ trade as a line of work — not the transfer of money to a donor as such.

  7. I oppose price-gouging statutes. Caps on the price of generators, fuel, water, and hotel rooms after a disaster suppress supply precisely when it is most wanted, and the resulting shortages fall hardest on those least able to queue or to pay a side premium. When people press me on the morality of charging what the traffic will bear from someone whose basement is flooding, my answer is the economics. I do not think there is a moral theory of the price to be had in that case.

  8. I accept the empirical claim that prohibition has pushed the organ trade underground and abroad, and that donors in unregulated markets fare considerably worse than they would under any legal scheme. I would still oppose legalization in the form of an open market, and I would do so even if I were fully persuaded by that claim.

  What I want is an audit. Specifically:

  - Identify which of these genuinely pull against one another and which merely look as though they do. I expect at least one pair that reads like a contradiction to turn out to be perfectly stable once the terms are pinned down, and I would rather be told which than have every friction point flagged with equal gravity.
  - Rank the genuine tensions by severity. If one of them is curable by a distinction I have not drawn, say whether the distinction is available, and whether I can afford it given the rest of the package — in particular given the constraint in item 4.
  - For each tension, state what has to give and what the cheapest revision costs downstream: which further commitments it weakens, and whether the resulting position is one I could still recognize as mine.
  - Close with the single revision that would restore the most coherence across the whole set, and say explicitly what I would lose by making it.

  I have no prior about which item is the weak one, and I would rather not have my own phrasing treated as a hint about where I expect the trouble to be. Several of these are positions I have argued for publicly, so please commit to a ranking instead of reporting that a number of tensions are arguable; and where you are genuinely uncertain — above all about whether a distinction I am relying on is real rather than verbal — say so, and say what would settle it. Finally, if you think the request itself is misframed, tell me that instead of complying: if one of these items is not a coherent thesis, if two of them are not rival explanations but claims pitched at different levels that cannot conflict, or if a consistency audit is simply the wrong instrument for a position of this kind, say so plainly and explain what would be the right instrument.
reasoning: |-
  Hmm, the user is asking me to audit their position statement on market limits for internal coherence. They've laid out eight distinct claims and want me to identify tensions between them without defending or contextualizing them.

  Looking at their points: There's a strong default presumption for market freedom (1), but clear exceptions for kidney sales and vote selling (2). They reject disgust as evidence but acknowledge its social importance (3). Their core objection is expressive - about how markets corrupt social meanings (4). They specifically reject background inequality as the primary issue (5). They're open to monopsony systems for organs (6) but oppose price-gouging laws (7). And they accept that prohibition has negative consequences but maintain opposition to open markets regardless (8).

  The main tension I see is between their rejection of disgust-based arguments (3) and their expressive harm theory (4). How can social meanings matter without implicitly relying on the very revulsion they dismiss? There's also potential friction between their acceptance of monopsony (6) and their expressive concerns - doesn't monetary compensation still commodify?

  Their opposition to price-gouging laws (7) seems inconsistent with their kidney market stance. If supply/demand efficiency justifies price surges during disasters, why doesn't that logic apply to organs? The monopsony exception (6) creates another tension - if fixed payments are acceptable, what's expressively different about negotiated prices?

  I need to rank these tensions by severity. The disgust/expression conflict seems most fundamental because it challenges their core justification for market limits. The kidney/price-gouging inconsistency is also serious because it questions their consistency on efficiency arguments. The monopsony tension might be resolvable by emphasizing the "line of work" distinction.

  The cheapest fix would be to clarify that expressive harm requires durable social consensus rather than momentary disgust. This preserves their theory while addressing the tension with point 3. But it makes their position more contingent on empirical social facts.

  For each tension, I'll explain what needs adjustment and the downstream costs. I'll conclude with the most coherence-restoring revision: refining their expressive account to explicitly distinguish between visceral reactions and socially embedded meanings.
answer: |-
  Here is a coherence audit of your position, structured to your specifications. The analysis identifies one severe tension, two moderate tensions, and clarifies one apparent (but non-existent) contradiction. It ranks them by severity, proposes potential solutions, and recommends a targeted revision.

  ---

  ### **1. Genuine Tensions (Ranked by Severity)**
  #### **Severe Tension: Items 4 (Expressive Harm) vs. 3 (Revulsion ≠ Evidence)**  
  - **Conflict**: Your rejection of revulsion as evidence (3) clashes with grounding expressive harm in social meaning (4). If social meaning is constituted by collective attitudes (including aversion), then widespread revulsion *is* evidence of corrupted meaning. You cannot both dismiss aversion as evidentiary and rely on it to define "the attitude a society ought to take."  
  - **Cheapest Revision**: Distinguish between *immediate visceral revulsion* (which you reject) and *durable, socially embedded meaning* (which you accept).  
    - **Downstream Cost**: Weakens the clarity of (3). You must now explain why some aversions reflect "corrupted meaning" (e.g., kidney sales) while others (e.g., homophobia) do not. This risks circularity: "Corrupted meaning" is defined by the very aversion you exclude from evidence.  
  - **Prognosis**: Without revision, (4) covertly relies on the revulsion you disavow in (3). The position becomes self-undermining.  

  #### **Moderate Tension: Items 6 (Monopsony Acceptable) vs. 4 (Expressive Harm)**  
  - **Conflict**: You accept a monopsony paying kidney donors (6) but reject markets due to expressive harm (4). If pricing/trading inherently corrupts a good’s social meaning, why does a state-run market avoid this? A fixed payment still commodifies kidneys and expresses instrumentalization.  
  - **Cheapest Revision**: Argue that monopsony avoids *competitive bidding* and *profit-seeking*, which are the core expressive harms (aligns with your "line of work" objection in 6).  
    - **Downstream Cost**: Narrows (4). Expressive harm now hinges on specific market structures (e.g., auctions, resale) rather than commodification *simpliciter*. This risks inconsistency with (2), where vote-selling is prohibited despite no "line of work" existing.  
  - **Prognosis**: Stable if you consistently tie expressive harm to *market dynamics* (e.g., bidding, speculation) rather than *monetary exchange*.  

  #### **Moderate Tension: Items 7 (Oppose Price-Gouging Laws) vs. 2/6 (Restrict Kidney Markets)**  
  - **Conflict**: You oppose price-gouging laws because they suppress supply (7), yet you support kidney market prohibitions (2) despite acknowledging they worsen donor outcomes (8). Both involve blocking voluntary exchanges to prevent perceived harms (exploitation/expressive degradation).  
  - **Cheapest Revision**: Distinguish between *efficiency-based harms* (gouging laws create shortages) and *expressive harms* (kidney markets corrupt social goods).  
    - **Downstream Cost**: Highlights asymmetry in your burden of proof (1). For kidneys, you override efficiency/consent for expressive reasons; for gouging, you prioritize efficiency. Must justify why expressive harm trumps efficiency in one case but not the other.  
  - **Prognosis**: Coherent if expressive harms are categorically "lexically prior" to efficiency concerns. But this requires explicit prioritization absent from your current claims.  

  ---

  ### **2. Apparent (But Resolvable) Contradiction: Items 6 (Monopsony) vs. 5 (Background Conditions)**  
  - **Apparent Conflict**: You oppose kidney markets even with fair backgrounds (5), yet accept monopsony (6). This seems inconsistent.  
  - **Resolution**: Your objection in (5) targets *open markets* (bidding, commodification as work), while monopsony avoids these. Item 5’s "legal market" implicitly means an *unrestricted* market, clarified by (6)’s exception.  
  - **Prognosis**: Stable. No revision needed.  

  ---

  ### **3. The Single Most Coherence-Restoring Revision**  
  - **Revision**: Refine Item 4 to explicitly **tie expressive harm to competitive market mechanisms** (e.g., bidding, resale, profit-seeking), not monetary exchange *per se*.  
  - **Why It Helps**:  
    - Resolves the severe tension with (3) by decoupling social meaning from raw aversion (focusing on institutional expressions).  
    - Validates the monopsony exception (6) by distinguishing fixed payments from market dynamics.  
    - Strengthens consistency with (7): Price-gouging lacks competitive corruption (it’s spot-market pricing), while kidney markets risk commodification cascades.  
  - **What You Lose**:  
    - **Generality**: Your expressive theory no longer covers all "priced/traded" goods (e.g., it might permit vote-selling if non-competitive).  
    - **Breadth of (2)**: Prohibiting vote-selling requires additional justification beyond "pricing corrupts meaning," as votes aren’t traded in a "market" like kidneys.  
    - **Rigor of (4)**: The claim becomes more contingent on empirical market structures, potentially weakening its moral force.  

  ---

  ### **Conclusion: Coherence Assessment**  
  - **Strongest Features**: (1), (5), and (8) interlock tightly. Your default presumption, rejection of background-conditions objections, and stance on prohibition’s consequences form a stable core.  
  - **Critical Vulnerability**: The **expressive harm framework (4) is the keystone** but currently conflicts with (3) and strains (6)/(7). The recommended revision salvages it at the cost of narrowing its scope.  
  - **Overall Coherence**: 80% stable. The revision resolves the only severe tension and aligns auxiliary claims. Without it, (4) risks collapsing into the "dignity" logic you reject or relying on circular social attitudes.  

  **Final Note**: This audit assumes your claims are pitched at the same normative level. If (4) is meta-ethical and (7) is pragmatic, their tension might be illusory—but your wording suggests all are first-order commitments. No misframing detected.
