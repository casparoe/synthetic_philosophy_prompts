  Okay, let me approach this step by step. The core challenge is designing a 75-minute session about what defines 'a' across variations, for first-year typography students with basic technical skills but no theoretical background. The user wants a structured plan with specific components, avoiding philosophical jargon while preventing common misconceptions.

  First considering the dependency structure. The sequence must build logically:
  - Start with concrete specimens to establish the problem visually
  - Then demonstrate failed feature-matching attempts
  - Introduce the concept of contextual constraints 
  - Finally show how constraints create coherence without fixed features

  For specimens, the double-storey vs single-storey contrast is essential. Adding Times italic creates valuable tension by showing different forms within one family - this actually sharpens the point by forcing students to confront variation within unity. Must exclude specimens with identical features (like two identical Garamonds) to prevent premature "solved" conclusions.

  Anticipating misconceptions:
  1. Legibility-as-definition should be addressed immediately when examining specimens
  2. Style-as-overlay must be undermined during the drawing demonstration 
  3. Cultural-relativism requires preemptive blocking when discussing constraints

  The skeleton-then-style model should be temporarily preserved but hollowed out. During the constraint discussion, explicitly state we're using it as placeholder language while showing its insufficiency. Never claim skeletons are "real" or "neutral".

  The diagnostic question needs to target binding-yet-undefinable nature. Asking them to evaluate a deliberately ambiguous form (like a Futura 'a' with exaggerated terminals) would reveal understanding - good answers would reference system coherence rather than isolated features.

  Crucially, must refuse any discussion of:
  - Historical evolution
  - Perception science
  - Computational approaches
  Explicitly state these are beyond scope to maintain focus.

  For the "family resemblance" interruption, expect it during failed feature-matching. Redirect it into concrete drawing comparisons rather than abstract discussion.

  The opening ten minutes must earn trust through hands-on analysis - have them immediately compare specimens at tables while circulating to validate their visual intelligence. No theory promises, just "let's look at what's actually here."
answer: |-
  Here is a structured plan meeting all constraints. It prioritizes visceral demonstration over explanation, uses controlled specimens to force cognitive tension, and strategically blocks misconceptions while preserving pedagogical scaffolding.

  ### 1. Dependency Structure  
  *(Total: 75 mins; each phase builds on the prior’s unresolved tension)*  
  - **Phase 1: Specimen Shock (5 mins)**  
    *Dependency:* Must precede all analysis. Students see extremes without time to rationalize.  
    *Action:* Project **Times New Roman ‘a’**, **Futura ‘a’**, **child’s handwritten ‘a’**, and **Times Italic ‘a’** simultaneously. No labels. Ask: *“Point to all the ‘a’s. Why?”*  
    *Why now?* Establishes the problem viscerally. No prior claims needed.  

  - **Phase 2: Feature-Matching Failure (15 mins)**  
    *Dependency:* Requires Phase 1’s visual dissonance.  
    *Action:* Whiteboard student suggestions of essential features (stem, bowl, etc.). Draw counterexamples:  
    - Child’s ‘a’ lacks terminal/axis; Futura has no bowl; Times Italic has single-story vs. roman double-story.  
    - **Crucial:** Draw a “Franken-letter” that has all “features” but isn’t an ‘a’ (e.g., ‘d’ with an ‘a’-like bowl).  
    *Why now?* Forces admission that no physical feature is universal. Blocks *feature-list collapse* misconception early.  

  - **Phase 3: Constraint Introduction (20 mins)**  
    *Dependency:* Requires Phase 2’s dead end.  
    *Action:* Print/distribute **words** (not isolated glyphs): “cat” in Times, Futura, handwritten. Ask:  
    *“If you replace one ‘a’ with another, why does it sometimes ‘break’ the word? What is being violated?”*  
    *Why now?* Shifts focus to relational constraints (proportion, rhythm, texture). Preempts *legibility-as-definition* by showing ‘a’ can be “recognizable” but contextually wrong (e.g., Futura ‘a’ in Times “cat” looks disjointed).  

  - **Phase 4: System Coherence Demo (25 mins)**  
    *Dependency:* Requires Phase 3’s constraint awareness.  
    *Action:**  
    - Draw a **deliberately “wrong” ‘a’** in Times New Roman style (e.g., single-story with Times’ serifs). Ask why it “lies.”  
    - Show **Times Italic ‘a’** again: *“Why does this ‘a’ ‘tell the truth’ in italics but ‘lie’ in roman?”*  
    *Why now?* Reveals that constraints are system-specific, not universal. Blocks *cultural settlement* misconception: The “wrong” ‘a’ violates internal logic, not just convention.  

  - **Phase 5: Skeleton-Scaffolding Shift (10 mins)**  
    *Dependency:* Requires Phase 4’s system-thinking.  
    *Action:* State: *“Your ‘skeleton’ is a tool for beginners to approximate a system’s constraints. But no skeleton fits all ‘a’s. Systems aren’t skeletons with style—they’re ecosystems.”*  
    *Why now?* Preserves scaffolding while hollowing it. Students see the model’s limits without discarding it.  

  ---

  ### 2. Specimen Set  
  - **Must Include:**  
    - Times New Roman (double-story roman)  
    - Futura (single-story geometric)  
    - Child’s handwritten ‘a’ (naive single-story)  
    - **Times Italic ‘a’ (critical addition)**  
  - **Why Times Italic Sharpens the Point:**  
    It proves *one system* tolerates divergent ‘a’ forms under different constraints (upright vs. slanted rhythm). This prevents the “two letters” conclusion by showing the *same context* (Times) demands different solutions for coherence.  
  - **Must Exclude:**  
    - Any two typefaces with similar ‘a’ structures (e.g., Garamond and Caslon).  
    - Isolated glyphs without adjacent letters (early on).  
    **Exclusion Rationale:** Prevents feature-matching shortcuts. Forces engagement with systemic dissonance.  

  ---

  ### 3. Misconception Sequence & Blocking  
  - **Misconception 1: “Legibility = Definition”**  
    *When it surfaces:* Phase 3 (when viewing words).  
    *Blocking:* Ask *“Is the handwritten ‘a’ in ‘cat’ legible? Yes. Would it ‘work’ in a Times text block? Why not?”* Redirect to **contextual integrity over recognition**.  

  - **Misconception 2: “Style Over Neutral Skeleton”**  
    *When it surfaces:* Phase 2 (feature-listing) or Phase 4 (coherence demo).  
    *Blocking:* In Phase 4, draw Times ‘a’ with Futura’s skeleton (or vice versa). *“Does adding Times’ serifs to Futura’s structure make it ‘Times’? Why does it still ‘cheat’?”*  

  - **Misconception 3: “Arbitrary Cultural Settlement”**  
    *When it surfaces:* Phase 4 (after system demo).  
    *Blocking:* Show your “wrong” Times ‘a’. *“This breaks not because culture forbids it, but because it betrays Times’ internal logic. It’s a lie, not a variation.”*  

  ---

  ### 4. Skeleton-Style Scaffolding Decision  
  - **Leave it standing but hollow it out.** Say:  
    *“Use skeletons to train your hand and eye. But remember: skeletons are training wheels for riding specific systems. No skeleton is the ‘true a’.”*  
  - **Do NOT say:**  
    - “Skeletons are arbitrary.” (Destroys beginner confidence.)  
    - “Style is the real substance.” (Implies superficiality.)  
  - **Decision Point:** Phase 5. Must follow system-coherence demo (Phase 4) to contextualize the metaphor’s limits.  

  ---

  ### 5. Diagnostic Question  
  - **Question:** Hold up a printout of **Futura ‘a’ with exaggerated, Times-like serifs** added. *“You’re typesetting a Futura poster. Can you use this ‘a’? Why/why not?”*  
  - **Good Answer:** *“No—it borrows rules from another system. Futura’s ‘a’ works because its simplicity matches its geometric rules. This hybrid breaks Futura’s honesty.”* (Appeals to systemic integrity, not features.)  
  - **Bad Answer:** *“No—serifs don’t belong in Futura.”* (Feature-focused) or *“It’s ugly.”* (Subjective).  

  ---

  ### 6. Explicit Refusals  
  State at session start:  
  *“Today we won’t discuss:  
  - How readers recognize letters (that’s cognitive science).  
  - History of the ‘a’ (that’s paleography).  
  - How to generate new ‘a’s algorithmically (that’s computational design).  
  We’re only asking: What obligations does an ‘a’ have to its system?”*  

  ---

  ### Handling "Family Resemblance"  
  - **When it surfaces:** Likely during Phase 2 (feature-matching failure).  
  - **Response:** *“If you mean ‘shared features,’ we just saw that fails. If you mean ‘something else,’ show me—draw two ‘a’s with no shared features but the same ‘family resemblance.’”* Redirect to concrete drawing. Do not debate philosophy.  

  ### Earning the First 10 Minutes  
  Begin with: *“You know how to build letters. Now: why is every ‘a’ an ‘a’ when they share no parts? Don’t theorize—look.”* Immediately launch Phase 1. Their visual intelligence will engage with the specimens, bypassing suspicion.  

  This plan forces confrontation with systemic constraints, weaponizes their trained eye to see beyond features, and leaves them with a tangible (but unsettled) sense of obligation in letterforms. The grading paradox (“some ‘a’s are wrong”) is resolved through systemic betrayal, not dogma.
