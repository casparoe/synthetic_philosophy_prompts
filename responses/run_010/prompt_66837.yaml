prompt: |-
  I have no academic training in philosophy — I work in freight logistics — but I have been turning over a puzzle about blood donation for a couple of years now, and I would like a careful reconstruction of what the practice actually assumes. Let me lay out the facts as I understand them, so the analysis does not depend on my getting the details exactly right.

  Most wealthy countries run their whole-blood supplies on unpaid volunteers, and the World Health Organization has spent decades urging member states to build their blood services on voluntary, non-remunerated donation. In the United States it is nonetheless entirely legal and completely ordinary to pay people for plasma. Paid plasma clinics advertise in low-income neighbourhoods, pay something in the tens of dollars per visit, and may take the same donor back as often as twice a week; the unpaid whole-blood donor gets a sandwich, a drink, a sticker and a thank-you, and is eligible again only after roughly eight weeks. The two operations sometimes sit in the same building, and one person can be an unpaid hero in one chair and a paid supplier in the other. Reimbursed travel and small token gifts are treated as unproblematic. A cheque of equivalent value is treated as a change of kind, not of degree.

  Add a second piece. Since the mid-1980s, American law has made it a crime to transfer human organs for valuable consideration. Bone marrow is not an organ, yet compensation for marrow donation was prohibited anyway, at a time when harvesting it meant surgery under anaesthesia. Later, a technique emerged that collects the relevant cells by a process close to ordinary blood donation. A public-interest law firm sued, and in 2011 a federal appeals court held unanimously that marrow obtained that way could be compensated, because on its method of collection it fell outside the statutory definition. Officials promptly moved to redefine the category so that the ban would bite again. For a period, then, whether paying a donor was a felony turned on which machine was used, not on how much the donor was asked to bear.

  What I want is an account of what this whole arrangement presupposes about acts that go beyond what anyone is required to do. Please consider at least the following readings and tell me which the practice genuinely needs and which it merely sits comfortably alongside:

  - that money degrades the act and makes it worth less than the identical act done for nothing;
  - that money leaves the act exactly as good but makes it owed — the paid donor who fails to appear has broken a commitment and can reasonably be blamed, while the unpaid donor who never appears has done nothing wrong at all, so payment moves the act across a boundary from above-and-beyond to required rather than down a scale of value;
  - that nothing about the donor or the act is at issue, and the point is about the audience: public praise is a limited resource that cash dilutes, so the unpaid system is protected for the sake of those who do the praising;
  - that there is no moral theory here at all, only public health — paid donors have an incentive to conceal risk factors — and the moral vocabulary is decoration on an epidemiological rule.

  Then: how could one tell these apart from the practice itself? If the fourth were operative, we would expect payment to be permitted wherever screening was good enough, and we would not expect the plasma exception; if the third were operative, the rules should track how visibly the donor is celebrated. Say what the existing pattern of exceptions actually points to.

  I would also like the internal tensions addressed. We still thank the paid donor, and we still call what he does a donation. Is that loose speech, or does the practice depend on a category of paid-yet-praiseworthy acts? Does going beyond the call of duty require that the act be owed by nobody, or only that it not be owed by this agent? Why should the form of a transfer matter more than its size — what account of value makes a bus fare innocent and fifty pounds corrupting? And in the marrow episode, is there any moral theory on which the distinction between an organ and a non-organ collected by a machine can do real work, or is the practice simply borrowing moral language from a legal definition?

  Finally, run it in the other direction. Suppose we concluded that paying donors was permissible and would save lives. What would we lose conceptually, as distinct from politically — which words currently doing work in the practice would stop having a job? And is there any reading on which the mere availability of a paid option changes what the unpaid donor is doing: making the gift more impressive, or exposing the unpaid system as a way of getting the poor to supply the rich for free?

  Where the practice does not decide between rival accounts, please say so plainly rather than settling on one confident story. If these positions have names in the literature, use the names, but I care about the reasoning rather than the labels.
reasoning: |-
  Okay, this freight logistics professional has a deep ethical puzzle about blood and plasma donation practices. They've clearly spent years observing the inconsistencies: unpaid whole blood donations treated as heroic acts while plasma payments are routine, bone marrow compensation legally contested based on collection methods. The core question is what philosophical assumptions underlie these practices.

  Hmm, the user wants me to systematically unpack four possible interpretations without favoring any single one. They're particularly sharp about testing each theory against real-world exceptions - like why plasma payment is allowed while marrow payment faced legal challenges. That plasma exception really is a thorn in the side of simple explanations.

  Let me approach this like dissecting a complex supply chain. First mapping the contradictions: payment degrades the act (theory 1) yet we still call paid plasma a "donation". Payment creates obligation (theory 2) but nobody chases no-show plasma donors like broken contracts. The praise economy theory (3) falters because paid and unpaid donors often share physical spaces. And the pure public health rationale (4) can't explain why we don't just improve screening for paid whole blood.

  Ah, the marrow case is especially telling. When compensation suddenly became legal based solely on collection method switching from surgery to apheresis, it exposed how arbitrary the moral boundaries are. That legal redefinition effort shows officials clinging to categories rather than substance.

  The user's secondary questions cut deeper. That bus fare vs. fifty pounds point reveals our fuzzy intuition about "corrupting" amounts. And the availability of paid options might indeed reframe unpaid donations - either as purer generosity or as exploiting the poor. I should note where practices don't resolve these tensions.

  For the reverse analysis: if payments became universal, we'd lose "heroic gift" language but gain "ethical worker" framing. The real loss might be in communal bonding symbolism - that sandwich and sticker representing social reciprocity beyond market logic. Though as the user implies, that symbolism may already be hypocritical when plasma payments target low-income neighborhoods.

  This isn't about giving answers but laying bare the machinery. Like tracing conflicting regulations in a shipping network, I'll show where the philosophical "rules" generate friction points without pretending there's one master manifest.
answer: |-
  Below is a systematic reconstruction of the philosophical and practical assumptions underlying blood/plasma/organ donation policies, based on your observations. I'll address each component of your query, flagging tensions, testing theories against practice, and noting unresolved contradictions. The analysis draws from ethics (deontology, consequentialism, virtue ethics), sociology of gift-giving, and legal philosophy.

  ---

  ### **Core Theories Tested Against Practice**
  1. **Money Degrades the Act (Commodification Critique)**  
     - **Assumption**: Payment transforms an altruistic act into a commercial transaction, reducing its moral worth. The act's value lies in motivation (e.g., Kantian goodwill).  
     - **Practice Fit**:  
       - *Supports*: Unpaid blood donors are publicly celebrated as "heroes"; paid plasma donors receive no comparable social recognition.  
       - *Contradicts*: Plasma is still called a "donation" despite payment. Paid donors are thanked, implying residual praiseworthiness.  
       - **Critical Test**: If degradation were primary, payment for plasma (identical in substance to blood) would be universally condemned. Instead, it is legally and socially accepted.  
       - **Verdict**: *Compatible but insufficient*. Practice suggests degradation is context-dependent (e.g., plasma is "less sacred" than organs/whole blood).

  2. **Payment Creates Obligation (Contractual Shift)**  
     - **Assumption**: Money moves the act from *supererogatory* (beyond duty) to *obligatory*. Failure to donate when paid becomes a breach of commitment.  
     - **Practice Fit**:  
       - *Supports*: Unpaid donors face no blame for non-donation; paid plasma clinics impose appointment systems (implying expectation).  
       - *Contradicts*: Paid plasma donors face no legal or social penalty for no-shows. Bone marrow payment bans weren't justified by obligation concerns.  
       - **Critical Test**: If obligation were key, plasma clinics would enforce contracts or sue non-donors. They do not.  
       - **Verdict**: *Weak support*. Practice treats payment as incentive, not binding obligation.

  3. **Praise Economy (Scarcity of Social Capital)**  
     - **Assumption**: Public praise is a finite resource. Payment "crowds out" unpaid acts, diluting their symbolic value. The state protects unpaid systems to maintain social cohesion.  
     - **Practice Fit**:  
       - *Supports*: WHO emphasizes unpaid donation's role in "community solidarity." Token gifts (e.g., stickers) ritualize appreciation without commodification.  
       - *Contradicts*: Plasma and blood donations coexist without apparent erosion of blood donation's prestige. Paid donors are still thanked.  
       - **Critical Test**: If praise scarcity drove policy, regions with paid plasma should see lower unpaid donation rates. Evidence is mixed (e.g., U.S. unpaid donations remain stable).  
       - **Verdict**: *Plausible but partial*. Explains why payment is taboo for "heroic" acts (organs, marrow) but not utilitarian ones (plasma).

  4. **Public Health Pragmatism (Disguised as Morality)**  
     - **Assumption**: Payment increases disease risk (donors hiding infections). Moral rhetoric legitimizes evidence-based policy.  
     - **Practice Fit**:  
       - *Supports*: WHO cites higher HIV rates in paid systems. Plasma exception exists because plasma processing (e.g., pathogen inactivation) mitigates risk.  
       - *Contradicts*: Bone marrow ban persisted despite safer apheresis; payment was banned regardless of screening. Officials redefined "organ" to block compensation after the court ruling.  
       - **Critical Test**: If risk were primary, payment would be permitted where screening is robust (e.g., modern marrow collection). Instead, legal categories override evidence.  
       - **Verdict**: *Inadequate alone*. Public health explains plasma exception but not the marrow legal battle or organ rigidities.

  ---

  ### **Internal Tensions & Unresolved Questions**
  - **Paid "Donation" Language**:  
    This is not loose speech but **conceptual dissonance**. Practice assumes a hybrid category: paid acts retain residual praiseworthiness if framed as helping society (e.g., plasma for medicines). Yet payment prevents full "hero" status.  
  - **Duty and Agency**:  
    Supererogation requires that the act is *not owed by the agent*. Payment makes it *owed by the agent*, collapsing supererogation into obligation. But practice ignores this: paid donors aren’t treated as debtors.  
  - **Form vs. Size of Compensation**:  
    Token gifts (food, travel) are "gifts" maintaining reciprocity without commodification (Mauss' gift economy theory). Cash crosses a symbolic threshold into market logic. **No consistent account of value explains this**—practice relies on cultural taboos.  
  - **Marrow Machine Distinction**:  
    Legally, the method redefined marrow as a "fluid" (like blood) not an "organ." Morally, this distinction is arbitrary. The episode reveals **legal definitions masquerading as moral boundaries**.  

  ---

  ### **Reverse Analysis: If Payment Were Permitted Everywhere**
  - **Conceptual Losses**:  
    1. **"Gift of Life" Rhetoric**: Unpaid donation’s symbolic power (altruism, solidarity) would diminish.  
    2. **Heroism Framework**: Acts could no longer be "above and beyond" duty if compensated.  
    3. **Moral Community**: The narrative of collective care ("we donate for each other") might erode.  
  - **Impact on Unpaid Donors**:  
    - **Positive**: Unpaid acts could become *more* impressive (pure altruism amid paid options).  
    - **Negative**: Unpaid systems might appear exploitative—e.g., extracting free labor (often from middle-class donors) while paying the poor for plasma. This risks **stratification**: the rich receive praise, the poor receive cash.  

  ---

  ### **What the Pattern of Exceptions Reveals**
  - **Plasma Exception**: Pragmatism dominates. Plasma is:  
    (a) Less symbolically charged (not "life-saving" like blood, but for pharmaceuticals),  
    (b) Highly processed (reducing risk),  
    (c) Needed in vast quantities (incentives required).  
  - **Marrow/Organ Rigidity**: Symbolic boundaries prevail. Organs/marrow are:  
    (a) Tied to bodily integrity ("sacred" vs. "replaceable" fluids),  
    (b) Medically urgent (heightening altruism expectations),  
    (c) Legally fossilized (statutes lag science).  

  **Dominant Framework**: A **hybrid model** where:  
  - Public health pragmatism governs low-symbolic, high-volume tissue (plasma).  
  - Virtue ethics (praise, degradation) governs high-symbolic, scarce resources (organs, blood).  
  - Law and custom enforce arbitrary lines (e.g., marrow collection methods) to preserve moral narratives.  

  ---

  ### **Conclusion: No Coherent Theory, Managed Contradictions**
  The practice **does not decide** between your four accounts. It:  
  1. Invokes degradation rhetoric for organs but ignores it for plasma.  
  2. Uses public health to justify plasma payments but overrides it for marrow.  
  3. Demands altruism for some donations while paying for others in the same building.  

  **Key Insight**: The system is **morally pluralistic and context-dependent**. It prioritizes:  
  - **Symbolic Purity** for acts tied to identity (organs, marrow).  
  - **Efficiency** for commodifiable tissues (plasma).  
  - **Legal Convenience** when reclassification resolves conflicts (e.g., marrow apheresis).  

  This inconsistency suggests that the moral vocabulary is **post hoc justification** for policies driven by cultural sentiment, path dependency, and material need—not a unified theory.  

  *Theoretical Names*: Commodification (Radin), Gift vs. Market (Titmuss/Mauss), Supererogation (Heyd), Legal Moralism (Devlin).  
  *Recommendation*: Read Richard Titmuss’ *The Gift Relationship* (1970) for the classic unpaid donation defense, and Julie Rose’s work on paid plasma for counterarguments.
