prompt: |-
  for my school's philosophy club we do a parody night and I want to write a fake government web page. setup: in this town you have to get a permit before you can have a baby, and the permit office judges every application using the procreation asymmetry — making a person who will suffer counts against the application, but failing to make a person who would've been happy counts for exactly zero. so on the form the "expected harms" column is full and the "expected benefits" column is blank on purpose, and it's blank because of a principle, not laziness.

  write the office's public FAQ page, deadpan bureaucratic voice, around 500 words: a short notice to applicants up top, then seven or eight Q&As, and show one filled-in form field with the benefits column left empty. the funny has to come from the office applying the asymmetry honestly and completely — the clerk isn't a villain, she's genuinly trying to be fair and is a little hurt that people keep yelling at her. please include: an applicant asking why the great life their kid would have had doesn't earn any points; an answer explaining why the office can't process complaints from people who were never born; a petition from a group saying the town is leaving huge amounts of value on the table; and one where the office admits it still hasn't figured out where the blank column is supposed to stop — frozen embryos, kids who'd be born in 200 years, that kind of thing. don't spell out the objections to the asymmetry anywhere, someone who knows the debate should just feel them. make everything up, I'm going after the position not any real person or place.
reasoning: |-
  We are creating a deadpan bureaucratic FAQ for the Procreation Asymmetry Permit Office (PAPO).
   The setup: 
     - You need a permit to have a baby.
     - The evaluation uses the procreation asymmetry: 
          * Expected harms (suffering) count against the application.
          * Expected benefits (happiness) do not count (they are zero in the balance).
     - The form has a column for "expected harms" (which is filled) and "expected benefits" (left blank on purpose).

   The tone: 
     - The clerk is not a villain, just doing her job. She's a bit hurt by the yelling.
     - The humor comes from applying the asymmetry honestly and completely.

   Required elements:
     1. A short notice to applicants at the top.
     2. Seven or eight Q&As.
     3. Show one filled-in form field (with the benefits column left empty).
     4. Include:
          a. An applicant asking why the great life their kid would have had doesn't count.
          b. An answer explaining why they can't process complaints from the never-born.
          c. A petition from a group saying the town is leaving huge amounts of value on the table.
          d. The office admits it hasn't figured out where the blank column stops (frozen embryos, future generations, etc.).

   We are not spelling out objections, but someone familiar with the debate should feel them.

   Let's structure:

     HEADER: Procreation Asymmetry Permit Office (PAPO) - Public FAQ

     Notice to Applicants:
          [A short, bureaucratic notice]

     Q&A:

          Q1: Why do I need a permit to have a child?
          A1: ...

          ... (include the required elements in the Q&A)

     Example Form Field:

          [Show a snippet of the form with one row filled in the harms column and the benefits column blank]

     We'll aim for about 500 words.

   Let's write.
answer: |-
  ### Procreation Asymmetry Permit Office (PAPO)  
  **Public FAQ Portal**  

  *Notice to Applicants:*  
  All procreation permit requests must be submitted via Form 44-Harm-7B. Incomplete or emotionally worded applications will be returned. Remember: Section 12 ("Expected Benefits") must remain blank per Municipal Code §8.09. Do not write "N/A," "see attached memoir," or smiley faces. Blank means blank.  

  ---  

  **Q1: Why does the "Expected Benefits" column on Form 44-Harm-7B stay empty? I’d give my child a wonderful life!**  
  A1: PAPO recognizes your enthusiasm. However, Municipal Code §8.09 codifies the Procreation Asymmetry Principle: *Failing to create a happy person does not constitute a moral deficit, while creating an unhappy person does.* Thus, projected joys (stable home, art lessons, above-average birthday parties) are ethically neutral. You may detail them in Section 14 ("Optional Parental Boasts"), though they bear no weight in evaluation.  

  **Q2: What counts as "Expected Harm" in Section 11?**  
  A2: Harm encompasses probable suffering (e.g., genetic illness, financial instability, regional plagues) or guaranteed suffering (e.g., existence in Township 12’s school district). See Appendix F: "Standard Misery Metrics." *Example:*  

  | Harm Description                     | Probability | Severity (1–10) | Mitigation Plan       |  
  |--------------------------------------|-------------|-----------------|------------------------|  
  | Seasonal allergies (paternal history) | 83%         | 3               | Stock antihistamines   |  
  | **Expected Benefit**                 |             |                 |                        |  
  | *[LEFT BLANK PER §8.09]*             |             |                 |                        |  

  **Q3: I was denied a permit, but my unborn child would’ve been thrilled to exist! Can they appeal?**  
  A3: No. PAPO cannot accept testimonies from non-persons (§8.09, Subsection D: "Non-Manifest Entity Clause"). Complaints must be filed by legally recognized residents. If your hypothetical child feels aggrieved, they may visit our office upon materializing. Until then, our doors are closed to abstract grievances.  

  **Q4: Can I sue PAPO for depriving the town of future talent?**  
  A4: Unlikely. The "Bright Futures Collective" petition (2023) argued PAPO "leaves happiness on the table" by ignoring potential scientists/artists. The court dismissed it, citing *non obligatio ad potentialem* ("no duty to potentials"). We note the Collective disbanded after permit denials prevented recruitment.  

  **Q5: Why was Clerk Jenson reassigned after my permit interview?**  
  A5: Clerk Jenson (Senior Permitting Officer) remains on duty. Per her request, we remind applicants that PAPO staff enforce regulations impartially. Shouting "baby jailer" or crying near the rubber plant is unproductive. She genuinely wishes you well, albeit within statutory constraints.  

  **Q6: Does the Procreation Asymmetry apply to frozen embryos?**  
  A6: Pending litigation (*Storage Vault 7 vs. Township*). Currently, permits are required only for "viable uterine implantation events" (Health Code §22.5). That said, PAPO’s Ethics Subcommittee debates whether §8.09 extends to:  
  - Cryogenically preserved embryos  
  - Hypothetical descendants beyond 2200 AD  
  - Sentient AI (contingent on Senate Bill 4.2)  
  Updates will be posted. Do not call.  

  **Q7: My permit was approved despite listing 17 harms. How?**  
  A7: Approval hinges on harm mitigation, not benefit accrual. If you demonstrate robust suffering-reduction plans (e.g., "trust fund for therapy," "relocation to non-tornado zone"), PAPO may deem net suffering "tolerable" (§8.09, Threshold 4C). Congratulations.  

  **Q8: Can I list "continuing the family name" in Section 12?**  
  A8: No. Section 12 remains blank. Ancestral vanity lacks quantifiable joy-per-unit metrics per §8.09. Try Section 14.  

  ---  
  *PAPO Office Hours: M–F, 8 AM–3 PM. Closed for existential dread breaks (12:30–1 PM).*
