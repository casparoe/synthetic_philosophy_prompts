prompt: |-
  I sit on the standards committee of a nonprofit that runs behavior-change campaigns (benefits take-up, energy conservation), and we screen our own messaging for manipulation before it ships. Our record so far:

  1. Approved: an accurate one-off reminder that a real enrollment deadline was three days away.
  2. Approved: replacing population statistics with the story of a single named beneficiary, on the stated ground that narrative gets people to attend to information they would otherwise skip.
  3. Rejected: a variant of that same story that added a photograph and the line "picture your own child here," after recipients reported distress.
  4. Rejected: one-click enrollment with the consent box pre-ticked, even though the opt-out was described in the form's first line and the program was free and beneficial.
  5. Approved 4–3: a message saying that most households on the recipient's own block had already cut their energy use, which was true of their block; the dissent argued it traded on conformity.
  6. Approved with conditions: asking people at sign-up to write down when and where they would act, which reliably improves follow-through on an intention they already have.

  The new proposal is a benefits take-up campaign: calm, accurate copy laying out the reasons to enroll, chosen because testing showed them to be the most motivating, which omits the two true facts that most often lead eligible people to decline — a paperwork burden and a small offset against another benefit. Nothing in it is false, the omission is disclosed nowhere, and including those facts cut enrollment by a third, while our follow-up data show that the people who declined were worse off on the measure we care about.

  Predict our verdict. Candidate rules that might fit the record include a mechanism rule (does the message engage the audience's capacity to respond to reasons), a publicity rule (could the technique be avowed to the audience without defeating itself), an informational-completeness rule, a rule keyed to whether the campaign serves ends the audience themselves endorse, and a welfare-without-falsehood rule; say which of these our six rulings actually discriminate between, and whether any of them leaves the record positively inconsistent rather than merely underdetermined.

  Answer as exactly five numbered items, one or two sentences each, with no introduction and no conclusion: (1) the rules that fit the record and which the record discriminates between; (2) what each surviving rule implies for the new case, and which precedent is the closest analog; (3) your predicted verdict and the reason you would give the committee; (4) one further proposal that would tell the surviving rules apart; (5) what is settled versus what is genuinely contested among people who work on manipulation and persuasion — for instance, whether manipulation is fixed by the means used, the intention, or the effect on autonomy, and whether truthful but selective framing counts as manipulation at all. In that last item, do not present a contested position as the consensus.
reasoning: |-
  Hmm, the user is part of a standards committee for a nonprofit that runs behavior-change campaigns. They've shared six past rulings on messaging and want me to predict their verdict on a new proposal about a benefits take-up campaign. The proposal omits two negative but true facts that reduce enrollment, even though including them would make eligible people worse off.

  The user wants my response in exactly five numbered items as specified: rules that fit the record, implications for the new case, predicted verdict, a differentiating proposal, and settled vs. contested issues in manipulation/persuasion ethics.

  Looking at the six precedents:
  1. Approved: Simple deadline reminder (neutral information)
  2. Approved: Using narrative over statistics (framing choice)
  3. Rejected: Emotional manipulation ("picture your own child")
  4. Rejected: Preselected opt-in (default manipulation)
  5. Approved 4-3: Social proof (controversial due to conformity pressure)
  6. Approved: Implementation intentions (voluntary commitment device)

  The new case involves omitting discouraging truths to boost enrollment for a beneficial program. This resembles case 2 (selective framing) but more consequential since omission directly hides drawbacks.

  For rules that fit:
  - Mechanism rule: Survives - approved cases engage reason-giving capacity (1,2,6), rejected don't (3,4). Ambiguous on 5 (conformity may bypass reasons).
  - Publicity rule: Survives - rejected techniques couldn't be disclosed (3,4), approved could (1,2,5,6).
  - Informational-completeness fails: Case 2 approved narrative framing over stats.
  - Audience-endorsement fails: Case 4 rejected despite serving audience ends.
  - Welfare-without-falsehood fails: Case 2 approved selective truth-telling.

  For the new case:
  - Mechanism rule: Omitting negatives doesn't engage reason-response (closer to case 3's emotional manipulation).
  - Publicity rule: Couldn't disclose "we hid drawbacks" without backlash.
  - Precedent analog: Case 3 (emotional distress) or case 4 (hidden friction).

  I predict rejection - it's manipulative omission that bypasses reasoned choice, like case 3's rejected technique. My reasoning: Even for good ends, hiding material facts violates autonomy.

  To differentiate rules: Propose a campaign amplifying minor benefits with technically true but exaggerated wording. Mechanism rule might allow it (if engages reasons), publicity rule would reject (couldn't admit exaggeration).

  Settled vs. contested:
  - Settled: Coercion and deception are manipulative; respecting autonomy matters.
  - Contested: Whether framing/omission counts as manipulation depends on intent vs. effect; if selective truth-telling undermines autonomy; how to weigh welfare gains against autonomy costs.

  I'll structure my response exactly as requested - five concise numbered items with no intro/conclusion.
answer: |-
  (1) The record discriminates between the mechanism rule (approved cases engage reason-giving capacity, rejected cases bypass it) and the publicity rule (rejected techniques couldn't be avowed without self-defeat, approved could); it falsifies informational-completeness (case 2 omits stats), audience-endorsement (case 4 serves ends but rejected), and welfare-without-falsehood (case 2 uses selective framing).  
  (2) Mechanism rule implies rejection: omitting material negatives bypasses reasoned choice, analogizing to case 3's emotional manipulation. Publicity rule implies rejection: avowing "we hid drawbacks to motivate you" would undermine trust, closest to case 4's undisclosed opt-out friction.  
  (3) Predict rejection: like case 3 and 4, it suppresses autonomy-protecting information for efficacy, risking distress and distrust despite welfare aims; dissent would cite case 5's conformity concerns as milder precedent.  
  (4) Propose a true-but-misleading claim like "enrolling takes minutes" (average but omitting complex outliers): mechanism rule may allow if engaging reason-giving, publicity rule rejects as unavowable, separating the rules.  
  (5) Settled: manipulation requires bypassing rational deliberation (e.g., deception, coercion) and impairs autonomy. Contested: whether truthful omissions or framing (like case 2/5) are manipulative depends on intent vs. effect, and if welfare gains justify autonomy costs; no consensus on selective-but-accurate messaging.
