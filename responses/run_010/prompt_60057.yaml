  - The self-refutation trap must be subtle. A rule declaring all claims provisional, footnoted with "*Including this one," with zero elaboration. 
  - For fairness, the corrections policy should showcase anekāntavāda’s strength: admitting partial truth without retraction, which *does* align with Jainism’s intent. 

