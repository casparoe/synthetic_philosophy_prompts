                Expected payoff = (1-p) * p0 + p * (1-p0)
            If everyone uses p=1/2, then = (1/2)(1/2) + (1/2)(1/2) = 1/4+1/4=1/2.

            And the maximum for a player is 1/2? They cannot get more by deviating? So they are indifferent.

          - What's missing: In the real absent-minded driver, it is the same driver at both junctions, so the strategy must be the same by definition. In our game, we have two different players, but we force them to use the same strategy by the symmetry and repeated rounds. But the key element of a single agent with imperfect recall is not perfectly captured. We'll have to explain that in the debrief: "In the real problem, it's the same person at both junctions, but they don't remember the first junction when they get to the second. Our game with two players simulates that because the two players are identically situated and must use the same strategy."

       Let's write the five items concisely.

  Note: We assume the facilitator can manage the envelopes and slips.

  Final Design:

  1. Setup: 14 players. Materials: 14 sealed envelopes (7 labeled "1", 7 "2"; labels hidden), 14 decision slips (each: [ ] EXIT [ ] CONTINUE), chocolate coins (sufficient for 2 per player per round in some rounds), and a whiteboard.

  2. Mechanic for indistinguishability: Each round, randomly pair players. Each pair gets two envelopes (one "1", one "2", shuffled). Players open privately, see their number (but not the other's), and mark a slip (without knowing if first or second). Slips collected; facilitator reveals order and computes payoff per pair: 4 points if first CONTINUE and second EXIT, else 0. Split: each player gets 2 coins for 4 points, 0 otherwise.

  3. Payoff and rounds: 5 rounds. Math: Equilibrium at p(exit)=1/2 yields expected payoff per round per player = 0.5 coins.

  4. Debrief: Reveal "Absent-Minded Driver". Highlight: at choice, players don't know their junction (imperfect recall); ex-ante plan (first CONTINUE, second EXIT) isn't executable. The equilibrium strategy (p=1/2) makes players indifferent because belief of being first is 1/2, and expected payoff of exit (1-p0) equals continue (p0) when p0=1/2.

  5. Predictable break: Players may not randomize and instead choose pure strategies. Patch: After round 2, show histogram of choices. Missing: Single-agent aspect (two junctions, one driver) — explain by hand.
answer: |-
  1. **Setup and materials**: 14 players, whiteboard, 14 sealed envelopes (7 labeled "1", 7 "2" inside, externally identical), decision slips (each: ☐ EXIT ☐ CONTINUE), ~50 chocolate coins. Players sit in a circle; envelopes and slips distributed.  

  2. **Indistinguishability mechanic**: Each round, players are randomly paired. Each pair shuffles two envelopes (one "1", one "2"), each player opens one privately (seeing "1" or "2" but not revealing it), and marks a slip (EXIT or CONTINUE) without knowing if they are "first" (1) or "second" (2) junction. Envelopes/slips collected; facilitator reveals assignments post-decision.  

  3. **Payoffs and rounds**: Run 5 rounds. After decisions, per pair: if "1" chose CONTINUE *and* "2" chose EXIT, both get 2 coins; else, 0. Math: Optimal mixed strategy is *p*(EXIT) = 0.5, giving expected payoff E = (0.5 × 0.5 × 2) + (0.5 × 0.5 × 2) = 0.5 coins/player/round.  

  4. **Debrief**: Post-round-5, name "Absent-Minded Driver". Highlight: *At your junction, you didn’t know if first or second (imperfect recall)*—ex-ante plan (first CONTINUE, second EXIT) fails. Your *own* 50% EXIT rate set belief *P*(first) = 0.5, making EXIT (payoff 1-*p*) and CONTINUE (payoff *p*) equal when *p*=0.5.  

  5. **Patch and gap**: Predictable break: Round 2, players count "I was '2' last time" to infer current role. Patch mid-session: "Reassign: Your envelope number *this round* is independent of history". Unreproducible gap: Single-driver identity—explain by hand: "Real puzzle has *one* driver at both junctions, forgetting the first; we simulate with pairs."
