          - In each round, randomly pair players into 7 pairs. 
          - For each pair, give one sealed envelope containing a "1" and one containing a "2" (shuffled so the assignment is random). 
          - Each player opens their envelope secretly and sees a card with "1" or "2", but they do not reveal it. They then fill out a decision slip for EXIT or CONTINUE, without knowing if they are first or second in the trip. They do not communicate.
          - Collect all slips and envelopes. For each pair, reveal the order (by the number in the envelope) and compute the trip payoff (0 or 4) based on the actions: 
              * If the player with "1" chose CONTINUE and the player with "2" chose EXIT, then the trip gets 4.
              * Otherwise, 0.
          - Award each player in the pair: 2 chocolate coins if the trip got 4, 0 otherwise.

       Item 3: Payoff scheme and round structure, with the math in a single line.
          - Run 5 rounds. In each round, random pairing and random assignment of order within pair.
          - Payoff for a player in a pair: 2 coins if the pair's actions are (first: CONTINUE, second: EXIT), 0 otherwise.
          - Math: equilibrium mixed strategy (exit with p=1/2) gives expected payoff per round: (1/2)*2 = 1 coin (because with probability 1/2 the player chooses exit and then gets 1-p = 1/2? Actually, per round, the player's expected coins: 
               = P(trip success) * 2 
               = P(first: CONTINUE, second: EXIT) * 2
               = [ (1-p) * p ] * 2   [because the first player continues with prob 1-p, the second exits with prob p]
               = (1-p)p * 2.
            At p=1/2, that's (1/2)*(1/2)*2 = 1/2 * 2 = 1 coin per round per player.

          But note: the player's own strategy affects both roles. From a player's perspective in one round (assuming the other player in the pair uses strategy p0):
            - They are first with prob 1/2: then if they choose continue, the trip succeeds if the other player (second) chooses exit (prob p0), so they get 2 coins with prob p0 -> expected 2*p0.
            - They are second with prob 1/2: then if they choose exit, the trip succeeds if the first player chose continue (prob 1-p0), so they get 2 coins with prob (1-p0) -> expected 2*(1-p0).
            - If they choose exit as first: 0.
            - If they choose continue as second: 0.

            So if they choose a mixed strategy with probability p for exit:
               Expected payoff = (1/2) * [ (1-p)* (2*p0) + p * 0 ] + (1/2) * [ p * (2*(1-p0)) + (1-p)*0 ]
                              = (1/2) [ 2(1-p)p0 ] + (1/2) [ 2p(1-p0) ]
                              = (1-p)p0 + p(1-p0)

            And if p0=1/2, then = (1-p)(1/2) + p(1/2) = (1/2) [1-p+p] = 1/2.

            But if they set p=1/2, they get 1/2 per round? And if they set p=0 or p=1, they get:
               p=0: (1-0)*(1/2) + 0 = 1/2.
               p=1: 0 + 1*(1/2) = 1/2.
            So they are indifferent.

          However, we want them to experience the reasoning at a junction: they are at a junction and don't know if they are first or second. And in that moment, the expected payoff for exit and continue should be equal. How do we compute that for a player at a junction (without knowing if first or second)?

            Let p0 be the other player's strategy (exit with p0). But note: in the same pair, the other player is also using p0? And they are symmetric. So the player's belief about the other player's strategy is p0.

            At the moment of decision, a player does not know if they are first or second. They believe they are first with probability 1/2 (because of random assignment). Then:

              If they choose exit:
                 - If first: they get 0.
                 - If second: they get 2 if the first player continued, which happens with probability (1-p0). So the expected payoff for exit is: 
                     = (1/2)*0 + (1/2)*[2*(1-p0)] = 1-p0.

              If they choose continue:
                 - If first: they get 2 if the second player exits (prob p0) -> expected 2*p0.
                 - If second: they get 0.
                     = (1/2)*(2*p0) + (1/2)*0 = p0.

            For indifference: 1-p0 = p0  => p0=1/2.

            So if the other player is using p0=1/2, then they are indifferent.

       Item 4: Debrief.
          - After 5 rounds, reveal the name: "Absent-Minded Driver".
          - Ask: "When you were making your choice, did you know if you were at the first or second junction?" (No, and that's the point: imperfect recall).
          - Map: 
              * Ex-ante: before the trip, the best plan is for the first junction to continue and the second to exit, giving 4. But that plan is not executable because at the junction you can't tell.
              * Ex-post: after seeing your role, you know if you were first or second, but by then it's too late.
