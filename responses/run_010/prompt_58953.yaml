            - If the first player continues and the second player continues: payoff = 0.

          But note: if the first player exits, the second player's decision is never reached. But in our setup, both players make decisions simultaneously. We will reveal the order and then apply the rules. So:
            - If the first player (as revealed) chose to exit, then the total payoff is 0.
            - If the first player chose to continue and the second player chose to exit, then total payoff = 4.
            - If the first player chose to continue and the second player chose to continue, then total payoff = 0.

          And we split the total payoff equally between the two players? 
            - In the case of total payoff 0, each gets 0.
            - In the case of total payoff 4, each gets 2.

          But note: if the first player exits, the second player's choice doesn't matter and they get 0. But the second player might have chosen to exit or continue, it doesn't matter.

          Is this aligned with incentives? Let's see from a player's perspective:
            - A player does not know if they are first or second.
            - They know that if they are first:
