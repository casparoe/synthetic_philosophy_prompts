                      - if the first player continued, then total=0 -> 0.

          So the payoff for a player as a function of their action and the other's action and their type (first or second) is complex.

   35. Let's compute the expected payoff for a player who chooses "exit", given that the other player uses strategy p (probability of exit).
          Let q be the probability that this player is the first junction player.
          q = 1/2? Because the assignment is random.

          If they are first and choose exit: they get 0.
          If they are first and choose continue: then the other player (second) will choose exit with probability p, so they get 2 with probability p and 0 with probability 1-p.
          If they are second and choose exit: they get 2 if the first player continued (which the first player does with probability (1-p)? but note: the first player's action is independent) and 0 if the first player exited.
          But wait, if they are second and the first player exited, then the trip ended and they don't get to play? In our setup, they still make a choice, but it doesn't count. So if they are second and the first player exited, then their payoff is 0 regardless.

