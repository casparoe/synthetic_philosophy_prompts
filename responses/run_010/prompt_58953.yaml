   38. However, we want them to feel the reasoning at a junction without knowing which junction. During the round, they don't know if they are first or second. And after the round, they find out. We can run several rounds so they see the aggregate.

   39. The activity:

       Item 1: Setup and materials.
          - 14 players, one room, one facilitator.
          - Materials: 
              * A deck of 14 cards: 7 labeled "1" and 7 labeled "2" (for the junctions, but hidden) - but we need two per trip? So for 7 trips, we need 7 "1" and 7 "2", total 14. These will be sealed in envelopes so the label isn't visible.
