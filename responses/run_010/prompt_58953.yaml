              If they are first: they get 2 with probability p (if the second player exits) and 0 with probability 1-p.
                  expected = 2p.
              If they are second: they get 0 regardless.
                  expected = 0.
              So overall: (1/2)*2p + (1/2)*0 = p.

          For indifference between exit and continue, set:
              1-p = p
              => p = 1/2.

          And then the expected payoff is 1/2 for both actions? 
              exit: 1-p = 1/2
              continue: p = 1/2.

          So it works.

   36. Therefore, we set the payoffs as described. Each player gets:
          - 0 if the trip payoff is 0.
          - 2 if the trip payoff is 4 and they are in the pair.

       But note: we want to give chocolate coins. We can give 2 chocolate coins for a 4-point trip, so each player in the pair gets 2. For 0, they get 0.

       However, we have to run many rounds so that they can learn and adjust.

