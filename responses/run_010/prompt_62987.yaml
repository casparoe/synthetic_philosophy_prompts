  **The Killer Question (30-Minute Interview):**

  **Node 2: Clinical Trial Framing.** "Identical medical treatment results are presented: Option 1 framed as '90% survival rate,' Option 2 framed as '10% mortality rate.' A patient is significantly more likely to choose it under the 'survival' frame. What does this imply for using patient choices to determine which treatment provides greater welfare?"

  *   **Why?** It directly confronts the core tension. Answers cleanly sort:
      *   **(A - Disqualify):** Revealed Preference Orthodoxies (Samuelson, Rep Thm), Hausman (if irrational), Bernheim-Rangel (ambiguous), Libertarian Paternalism (needs nudge). Favors stability/neutrality.
      *   **(B - Informative):** JDM (construction), Libertarian Paternalism (leverage effect), potentially Sen (context matters). Accepts context-dependence.
      *   **(C - Undermine):** Kahneman (experience over choice), Sen (choice motives complex), Eliminativism, Capabilities (choice unreliable). Most skeptical of choice->welfare link.
  *   It avoids abstract theory, uses a concrete, high-stakes example relevant to policy (healthcare decisions), and forces a stance on the reliability and meaning of choice data itself. Follow-ups can probe *why* they take that stance (rationality, construction, experience focus, welfare concept).
