  **Notes:** This is indicative. Positions often share answers on some nodes. Strongest signals:
  *   **Sam/Rep Orthodoxy:** Frequent A on 1,2,5,8,9; B on 7. Reject 6B.
  *   **Hausman:** Mix of A/B/C depending on rationality/informedness (1A/B/C, 3B, 5A, 6A, 7C, 9A/B). Skeptical of pure construction/framing.
  *   **B&R:** A on 1,2,5,8,9 (if unambiguous); B on 3; C on 7. Reject 6B, construction.
