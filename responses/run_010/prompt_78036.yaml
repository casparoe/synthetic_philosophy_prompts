  The historical facts are striking: ordinary people treated uncashed bank cheques as money for six months without clearance. This seems to challenge institutional theories of money. But the user's deflationary suspicion is sharp - maybe the institutional framework was merely suspended, not absent.

  Starting with Searle mapping: 
  The X is clearly the physical cheque slips. The Y status function is "money-substitute" or "temporary payment instrument." The context C is the bank closure crisis plus Ireland's dense social networks. The collective intentionality seems layered - initially the banking community's recognition of cheques, then during closure, local networks' acceptance based on reputation.

  For Knapp's state theory: This case is deeply problematic. The state didn't designate these cheques as money - they spontaneously became such. The unit of account (Irish pound) remained state-defined, but the medium of exchange was clearly detached from state machinery.

  Assessing the deflationary reading: It has real force. Those cheques were always claims on banks, denominated in state currency, with universal expectation of eventual clearance. But it overlooks how radically the settlement function was suspended. Crucially, the cheques circulated beyond original creditor-debtor pairs - they became generalized media of exchange in a way pure credit instruments usually don't.

  Where I might be vulnerable: If evidence showed cheques only circulated within closed networks where debts could be netted bilaterally, that would support the deflationary view. Similarly, if clearance records showed most cheques were presented by original payees rather than subsequent holders, that would undermine the "money" claim.

