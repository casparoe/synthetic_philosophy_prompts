prompt: |-
  I direct the technical panel of a state public utilities commission. Roughly six times a year we convene what our enabling statute calls a technical conference: the utility's experts and the intervenors' experts — a consumer advocate, sometimes an environmental petitioner, sometimes a municipal aggregator — each file a written estimate for what they present as the same quantity, and the numbers do not match. Two hydrologists give different annual exceedance probabilities for the same gauge; two grid-reliability engineers give different probabilities of cascading outage under the same named contingency. Our hearing officer then writes a proposed finding saying that the record reflects genuine scientific uncertainty, the commissioners vote, and hundreds of millions of dollars in rate base turn on which way the finding reads. I was trained as a civil engineer, I encountered Aumann's agreeing-to-disagree result once in a graduate seminar and remember the punchline but not the machinery, and I have become convinced that the phrase genuine scientific uncertainty is doing an enormous amount of unexamined work in our findings. My suspicion is that many of these disagreements are not what they look like: the experts are answering different questions, conditioning on different information sets, using different reference classes, or reporting numbers they would not report if asked sincerely, because they are retained partisans and the filing is an advocacy document. On the other hand, some of the gaps do survive everything we throw at them, and I want to know which is which before the session rather than after the order is issued.

  What I want from you is a diagnostic procedure my two staff analysts can run on a pair of conflicting expert estimates in the window between the filings landing and the conference itself — call it three weeks of document review and one two-day session, with about forty staff hours per case and no epistemology training. Please ground it in what interactive epistemology actually says about rational disagreement, and in particular be explicit about the common prior assumption: whether it is a claim about how real experts are built or a requirement imposed on them as a modeling convenience, whether Aumann's result is best read as a diagnosis tool or as a red herring once you notice how strong its common-knowledge premise is, what follows from the dynamic versions in which agents merely exchange posteriors and converge, and what the alternatives look like that reach agreement by iterated weighting without assuming a shared prior at all. The core conceptual problem I need you to solve is this: if any difference in belief can be re-described as a difference in information, then "it's a difference in priors" threatens to be an empty residual category rather than a real diagnosis — so the procedure has to say what would make a prior-level difference substantive and detectable in a record, as opposed to a shrug. Deliver an ordered set of questions to put to the two experts, what counts as a sufficient answer to each, and a branching rule that sorts any surviving disagreement into categories such as: no disagreement at all (two different quantities), disagreement over evidence (poolable), disagreement over model structure, disagreement that is really about a standard or threshold, and disagreement that is strategic rather than doxastic. Tell me where the procedure terminates with a dissolution, where it hands the matter to the commissioners as a question of judgment rather than fact, and what the referral document has to say so that the commission knows it is choosing rather than deferring. Include a one-page form the analysts fill in per case, and a short plain-English note I can hand commissioners explaining why taking the midpoint of two numbers is not a way of resolving them — and, if pooling ever is appropriate, at what point in the diagnosis that question even arises.

  Then run the procedure on three filings. First: two hydrologists estimate the annual probability that flow at a given gauge exceeds the design capacity of an existing spillway, at 0.011 and 0.046 respectively; on inspection the utility's expert uses a 1978–2020 record and conditions on an upstream storage project that has been permitted but not built, while the intervenor's uses 1931–2020 and conditions on present-day operations. I want the procedure to reach the conclusion I would rather it not reach — that there is no disagreement here to adjudicate, that the hearing officer's draft finding of residual scientific uncertainty cannot stand, and that the commission therefore cannot cite expert disagreement as a reason to authorize a larger spillway. Second: two engineers, one salaried at a regional transmission planner and one at a national laboratory, neither retained by any party, are given an identical contingency scenario and an identical dataset, and after a full reciprocal disclosure session in which they exchange their posteriors and their reasoning in writing they still stand at 0.004 and 0.03 for cascading loss of load above a stated threshold within ten years. I want the procedure to work hard on this one — pushing on whether one of them holds background knowledge that is not in the record (one has sat in a control room during a real event; the other has not, and I cannot tell whether that is private evidence or a difference in structural assumption), on deterministic screening versus probabilistic simulation, and on assumptions about operator response times — and then to stop honestly, telling me what the commission can and cannot do when the gap is structural, including whether any evidence in principle discriminates between the two structures. Third: two air-quality experts agree to within rounding on the entire concentration distribution for a pollutant near a fenceline community but file opposite conclusions about whether a proposed control measure is adequate. I want the procedure to catch this early rather than at the end, and to specify what it hands to the commission. Finally, mark every place where a step is a judgment call dressed up as procedure — what counts as the same question, whether a gap is private evidence or a modeling choice, whether a number is sincerely reported — and close with what the procedure cannot do: it cannot tell me which expert is right, it cannot detect bad faith, it cannot manufacture a single number for the commissioners, and above all it must not license the inference that because two experts disagree at least one of them is being irrational. No bibliography and no reference list, please; name a result only if you are confident of the name, and otherwise describe it.
reasoning: |-
  Hmm, this is a sophisticated request from a public utilities commission technical panel director. They're grappling with expert disagreements that have massive financial implications, and they need a practical diagnostic tool grounded in epistemic principles.

  The core tension here is between Aumann's agreement theorem (which says rational agents with common priors can't agree to disagree) and real-world expert disputes. The director suspects many disagreements stem from hidden differences - different questions, information sets, or advocacy pressures rather than genuine scientific uncertainty.

  Key challenges I need to address:
  - Designing a procedure that fits within tight constraints (40 staff hours, no epistemology training)
  - Making "difference in priors" a meaningful category rather than a residual shrug
  - Providing clear branching logic with concrete decision categories
  - Handling three test cases that demonstrate the method's rigor

  For the diagnostic framework, I'll build on these epistemic principles:
  1. Belief divergence always signals *some* difference in information, models, or goals
  2. "Common knowledge" is impossibly strong in practice (per Aumann's premise)
  3. Convergence requires iterative exchange of reasoning, not just numbers
  4. Strategic behavior breaks rationality assumptions

  The procedure should have three phases:
  First phase: Verify they're answering the same question (alignment check)
  Second phase: Examine inputs and processing (information/model audit)
  Third phase: Handle irreducible differences (referral framework)

  For the test cases:
  The hydrology case should expose how conditioning on different facts creates illusory disagreement. The grid reliability case will showcase how to probe structural differences. The air quality case demonstrates catching value judgments masquerading as technical analysis.

  Crucially, I'll include:
  - A one-page diagnostic form for analysts
  - Plain English commissioner guidance explaining why averaging is usually invalid
  - Explicit markers where professional judgment is required

  The limitations section will emphasize what the tool *can't* do: determine truth, detect bad faith, or eliminate the need for commissioner judgment. The goal is disciplined transparency about disagreement sources, not artificial resolution.
answer: |-
  Below is a diagnostic procedure for resolving expert disagreements, grounded in interactive epistemology and designed for practical use by technical staff. It addresses the core problem of distinguishing substantive prior differences from resolvable informational/modeling divergences, while flagging judgment calls transparently.

  ### **Diagnostic Procedure: Sorting Expert Disagreements**  
  *(40 staff hours over 3 weeks + 2-day conference)*  

  **Phase 1: Verify Alignment on the Target Quantity (4 hours)**  
  *Purpose: Confirm experts are answering the same question.*  
  1. **Question Template to Both Experts:**  
     "Define the precise quantity you estimated, including:  
     - Temporal/spatial boundaries  
     - Conditioning assumptions (e.g., 'given current infrastructure')  
     - Thresholds (e.g., 'exceeding 1000 m³/s flow')  
     - Units and uncertainty interpretation (e.g., 'annual frequentist probability')."  

  2. **Branching Rules:**  
     - **Misalignment (e.g., different thresholds, conditioning):** Terminate. No disagreement exists; analysts draft a finding of "divergent questions." Refer to commissioners for policy guidance on defining the target quantity.  
     - **Alignment:** Proceed to Phase 2.  

  **Phase 2: Audit Information and Models (20 hours)**  
  *Purpose: Identify differences in evidence, structure, or standards.*  
  3. **Evidence Pooling Check:**  
     - **Question:** "List all datasets, studies, and observations informing your estimate. Specify any exclusions and why."  
     - **Sufficient Answer:** Complete data provenance (sources, dates, filters).  
     - **Branching:**  
       - *Datasets differ:* Staff recreates estimates using a *common dataset* (agreed by experts or commissioners). If gap closes → "Resolvable informational disagreement."  
       - *Datasets same → Proceed to Step 4.*  

  4. **Model Structure Interrogation:**  
     - **Question:** "Describe the computational steps from input to output. Specify fixed parameters (e.g., decay rates), functional forms (e.g., log-normal vs. Gumbel distribution), and any judgmental adjustments."  
     - **Sufficient Answer:** Flowchart or pseudocode with rationale for key assumptions.  
     - **Branching:**  
       - *Structural differences (e.g., distribution choice):* Experts run *opponent’s model* with their own inputs. If gap persists → "Model-structure disagreement." Refer to commissioners with a "sensitivity table" showing outputs under both models.  
       - *No structural differences → Proceed to Step 5.*  

  5. **Private Evidence/Implicit Knowledge:**  
     - **Question (Conference Session):** "What specific evidence or experience led you to override standard methods or data? Does this rely on unrepeatable observations (e.g., control-room experience)?"  
     - **Branching:**  
       - *Verifiable private evidence (e.g., unpublished dataset):* Staff validates/admits into record. Re-run estimates → Resolvable if gap closes.  
       - *Non-transferable experience (e.g., intuition from past events):* Label "irreducible prior divergence." Proceed to Phase 3.  

  **Phase 3: Handle Irreducible Disagreements (16 hours)**  
  *Purpose: Isolate true prior differences or strategic behavior.*  
  6. **Sincerity Stress Test:**  
     - **Question:** "If you were advising a neutral party (e.g., a judge) with no stake in the outcome, would your estimate change? If yes, how and why?"  
     - **Branching:**  
       - *Estimate changes materially → "Strategic reporting."* Flag in referral.  
       - *Estimate stands → Proceed.*  

  7. **Common-Prior Probe (Aumann-Inspired):**  
     - **Mechanism:** Experts exchange full posteriors and reasoning in writing. Staff observes convergence/divergence after 2 rounds.  
     - **Branching:**  
       - *Convergence → "Resolved via communication."*  
       - *Divergence persists → "Structural prior difference."*  

  **Referral to Commissioners:**  
  - **Categories for Referral Document:**  
    | **Category** | **Commission Action** | **Referral Language** |  
    |--------------|------------------------|------------------------|  
    | Divergent questions | Define the target quantity | "Experts assessed different scenarios; commission must specify which is relevant." |  
    | Model-structure | Choose model based on risk tolerance | "Disagreement reflects competing valid frameworks; select based on policy goals (e.g., precaution)." |  
    | Irreducible prior | Weight experts or select | "Fundamental divergence; no further evidence can reconcile. Commissioners must weight expertise." |  
    | Strategic | Disregard or sanction | "Estimate reflects advocacy; rely on alternative evidence." |  
  - **Key Directive:** Commissioners *choose*, not defer. The referral states: "This categorization leaves no unresolved factual questions; the commission must exercise judgment."  

  ---

  ### **One-Page Analyst Form (Per Case)**  
  | **Step** | **Question** | **Expert A Response** | **Expert B Response** | **Alignment? (Y/N)** | **Staff Notes** |  
  |----------|--------------|-----------------------|-----------------------|---------------------|----------------|  
  | 1 | Target quantity defined? | [Summary] | [Summary] | ☐ | *Judgment: What counts as "same question"* |  
  | 2 | Common dataset applied? | New est: ______ | New est: ______ | ☐ | |  
  | 3 | Models swapped? | Output using B’s model: ______ | Output using A’s model: ______ | ☐ | |  
  | 4 | Private evidence shared? | [Evidence] → Impact: _____ | [Evidence] → Impact: _____ | ☐ | *Judgment: Verifiable?* |  
  | 5 | Neutral-party estimate? | ______ | ______ | ☐ | *Judgment: Sincerity* |  
  | 6 | After 2 exchanges | Final A: ______ | Final B: ______ | ☐ | |  
  | **Final Category:** [ ] Divergent Questions [ ] Model-Structure [ ] Irreducible Prior [ ] Strategic |  

  ---

  ### **Plain-English Note for Commissioners: "Why Midpoints Fail"**  
  > "Taking the midpoint between two expert estimates presumes both are equally valid measurements of the same quantity. In reality:  
  > - If experts use different data or models (e.g., one includes future dams, one doesn’t), averaging combines apples and oranges.  
  > - If divergence stems from structural differences (e.g., deterministic vs. probabilistic risk views), the midpoint has no epistemic meaning.  
  > - If one expert is strategically inflating/deflating numbers, averaging rewards bad faith.  
  > **Pooling is only appropriate** when Phase 2 reveals purely informational differences (e.g., one expert lacked a dataset). Even then, pool inputs, not outputs: rerun both models with identical data."  

  ---

  ### **Case Applications**  
  **Case 1: Hydrology (0.011 vs. 0.046)**  
  - **Phase 1:** Target quantity misaligned. Utility’s expert conditions on "permitted upstream storage"; intervenor on "present operations."  
  - **Branch:** "Divergent questions" → **Terminate**. Commissioners must decide which scenario is relevant (e.g., based on project approval likelihood). *Hearing officer’s "uncertainty" finding invalid.*  

  **Case 2: Grid Reliability (0.004 vs. 0.03)**  
  - **Phase 2:** Common dataset applied → gap persists.  
  - **Model Swap:** Lab expert uses probabilistic simulation; grid planner uses deterministic screening. Outputs still diverge when models swapped.  
  - **Phase 3:** Lab expert cites control-room experience (non-transferable) → "Irreducible prior difference."  
  - **Referral:** Commissioners choose based on risk tolerance (e.g., precaution favors higher probability). *No evidence can discriminate; structures reflect irreconcilable worldviews.*  

  **Case 3: Air Quality (Opposite Conclusions)**  
  - **Phase 1:** Target quantity identical (pollutant concentration).  
  - **Phase 2:** Concentration estimates align → gap is in *standard*, not fact.  
  - **Branch:** "Disagreement over threshold" (e.g., "safe" level). **Terminate early**. Referral states: "Experts agree on science; commission must define adequacy standard."  

  ---

  ### **Explicit Judgment Calls**  
  1. **"Same Question"**: Staff compares definitions (temporal scope, thresholds). *Judgment: Is conditioning (e.g., "permitted dam") part of the question?*  
  2. **Private Evidence vs. Modeling Choice**: Does experience inform a parameter (evidence) or model structure (prior)? *Judgment: Verifiability.*  
  3. **Sincerity**: Staff assesses if "neutral-party" estimate deviates materially. *Judgment: Motive inference.*  

  ### **What the Procedure Cannot Do**  
  - ✗ **Determine truth** (identify which expert is "right").  
  - ✗ **Detect bad faith** (only flags strategic behavior if estimate changes under neutrality probe).  
  - ✗ **Manufacture a consensus number** (commissions choose, not compute).  
  - ✗ **Imply irrationality** (irreducible priors are rationally permissible under different experiences).  

  **Final Output**: A categorized disagreement (or dissolution) with explicit decision points for commissioners, replacing unexamined "uncertainty" with structured accountability.
