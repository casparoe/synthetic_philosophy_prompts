prompt: |-
  I'm a third-year phil grad student helping run our department's neuro-philosophy colloquium, and next month's guest is a cognitive neuroscientist who's made her name deflating the Libet result — roughly the line that the readiness potential is what you get when you backward-average a noisy accumulator drifting to threshold, so there's no unconscious ramp that kicks off the movement half a second before the reported W time. The twist: she's also a hardline free-will skeptic, and she thinks the accumulator story does nothing for the libertarians, since subthreshold neural noise isn't agency either. Half the panel are compatibilists hoping to recruit her as an ally, so I want questions that keep both sides honest instead of letting her coast on either half of the position.

  Give me nine to twelve questions, each with a follow-up aimed at the answer she's most likely to give. I want at least one on why relocating initiation into stochastic accumulation doesn't just move the problem rather than dissolve it, one on whether the clock method is reliable enough to bear the weight this whole debate puts on thier introspective timing reports, one on the veto evidence and whether the free-won't results really license a late conscious veto (as opposed to just another accumulation process), one on how she squares trashing the RP with the fMRI work claiming to predict button choices several seconds out, and one to close on what finding would make her give up the skepticism itself, not just the artifact claim. No softballs, nothing along the lines of what got you interested in the brain.

  Before the questions, add a short list flagging which of the underlying claims are actually settled among people who work on this and which are live disputes — I don't want to walk in with a question that treats a contested thing as consensus, and I'd rather know where the field genuinely disagrees than have it papered over.
