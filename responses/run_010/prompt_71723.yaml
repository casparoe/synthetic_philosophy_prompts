  You're a decision theorist who works on imprecise probabilities and has taught this material to mixed audiences. I don't want the literature explained to me — I want you to build a decision problem to order.

  Context, so you know what counts as cheating: I'm writing a handout for a reading group (about half of them have never seen an imprecise-probability paper in their lives) on the question of whether the *decision rule* or the *imprecision itself* is carrying the normative weight when people claim that imprecise credences are rationally costly. So the case has to generate the verdicts out of the rules. If the payoffs are obviously rigged, or if the interesting result depends on the agent being vague in a way that's really just "she never did her homework," it's no use to me. No citations, no reading list, no name-dropping papers — a model without web access would only be guessing at those anyway. If a rule needs a label, define it in one line and move on.

  The case I want: one agent, one decision, three possible states of the world, four options. Her beliefs are imprecise in a principled way — she has exactly three candidate probability functions over the states, and her credal set is the convex hull of them. Each comes from a source she has equally good reason to trust and no way to weight against the others, and the story should make that vivid rather than just asserting it.

  Use these definitions, so we're not talking past each other:
  - Maximality: an option is permissible iff no other option has a higher expected value than it under *every* probability function in her set.
  - E-admissibility: an option is permissible iff there is at least one probability function in her set under which it does at least as well as every other option.
  - Gamma-maximin: rank options by the lowest expected value they get anywhere in the set; permissible = tied for the highest such floor.

  Requirements:

  1. All three rules come apart, in this specific pattern: maximality permits all four options; E-admissability forbids exactly one of them; gamma-maximin permits *only* that same option. So there's one option that is simultaneously "fine, go ahead" under maximality, "ruled out" under E-admissibility, and "the only rational choice" under gamma-maximin.
  2. Realistic. No urns, no coloured balls, no coins or dice, no bookies, no "the market might go up or it might go down." Something an actual farm, clinic, school, small firm, or household could face, payoffs in ordinary money, nothing over roughly $50k. No exotic physics, no sci-fi, no perfect predictors.
  3. One paragraph of prose setup that reads fine with zero notation, then a table: the three states, the three probability functions, and the four payoffs per option. Notation lives in the checking section, not in the story.
  4. One of the four options should be the safe / status-quo one whose payoff doesn't vary across states — but don't make it "do nothing, get zero." It should be a real thing she could actually go and do.
  5. Motivate the imprecision properly: name the three sources, and make clear she's had every opportunity to sharpen and simply can't, without being an idiot about it.

  Then the checking, which is the part I care about most:

  - Give the expected value of every option under every one of the three probability functions, and state which options each rule permits and why. Don't make me take your word for any of it.
  - Explain why checking three points is enough. There are infinitely many probability functions in her credal set, so tell me wich fact about expected value lets you get away with the vertices — and be precise about it, because I think there's a subtlety in one of the three rules where "true at the vertices" doesn't obviously give you "true everywhere."
  - Robustness check: if she can diversify — i.e. mixed or split options are on the menu too — does any of the three verdicts change? Show that it doesn't, or admit that it does and repair the case.

  Then:

  - Tell me which single structural feature of the case is doing the work, and run the ablations: what happens if her credal set collapses to one probability function, if you delete one of the risky options, if you nudge the safe option's payoff up a bit. I want to know how fragile your design is.
  - Best attack from each camp, two or three sentences apiece and no strawmen: the maximality defender on the E-admissibility verdict, the E-admissibility defender on maximality, the gamma-maximin defender on both of them, and a precise Bayesian who thinks the whole exercise is a cheat because she should just pick a probability function and be done.

  Bonus, only if it comes out clean: extend the option set with one more realistic option plus a sequential wrinkle, so that maximality lets her take a step (or two) that leaves her worse off than not moving at all in every single state, while E-admissibility blocks it. If you can't do that without it turning into a re-skinned pair of bets on a coin flip, say so and skip it — I'd much rather you tell me it can't be done under these constraints than fudge it.

  Start by brainstorming two or three candidate setups, a few lines each, and say which one you're picking and why — keep that part short. Then build it out. Think carefully and check your arithmetic before you hand it in, because I'm going to run your table through a spreadsheet.
