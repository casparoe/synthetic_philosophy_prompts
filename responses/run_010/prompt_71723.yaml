  - Maximality: All four options are permissible because no option is strictly dominated by any other (i.e., for each pair, there is a probability function where the first is not strictly worse than the second, and in particular, no option has higher expected value than another in every probability function).
  - E-admissibility: Lease is not E-admissible because it is never optimal (under no probability function in the set does it have expected value at least as high as every other option). Corn is E-admissible (optimal under B), soy under A, wheat under C.
  - Gamma-maximin: The minimum expected values are lease:12, corn:9.5, soy:9.5, wheat:11.9. The highest floor is 12, achieved only by lease, so only lease is permissible.

  **Why vertices suffice:**

  Expected value is linear in probabilities. Therefore, for a fixed option, the minimum over the convex hull is attained at a vertex. For comparisons in maximality (whether one option dominates another in every P), linearity ensures that if it holds at all vertices, it holds in the convex hull, and if it fails at a vertex, then it fails. For E-admissibility: although an option might be optimal at an interior point but not at a vertex, in this case we can check that lease is never optimal by noting that at every vertex there is an option with EV>12, and by the linearity, the max of the EVs of the other options is at least the minimum over the vertices of that max, which is greater than 12. Specifically, the function f(P)=max{EV_corn(P), EV_soy(P), EV_wheat(P)} is continuous and convex, and since it is greater than 12 at every vertex, and the set is convex, f(P)>12 for all P in the set. Therefore, lease is never optimal.

  **Robustness to diversification:**

  As shown, when allowing mixed options, no mixed option has a floor greater than 12, so gamma-maximin still permits only lease. Lease remains not E-admissible and is still maximal (not dominated by any mixed option).

  **Structural feature:**

  The key is that the safe option has a constant payoff that is:
  - Higher than the minimum expected value of every other option (so it has the highest floor).
  - But strictly less than the expected value of some other option under every probability function (so it is never optimal).

