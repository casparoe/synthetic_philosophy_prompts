  **Prose Setup:**

  Farmer Jane must decide how to use her field for the next season. The weather—Wet, Dry, or Normal—will affect her profits. She has three trusted weather forecasts: the Old Farmer's Almanac (predicting 20% Wet, 50% Dry, 30% Normal), the Local University's model (50% Wet, 20% Dry, 30% Normal), and the National Weather Service (30% Wet, 30% Dry, 40% Normal). With equal trust and no way to weight them, she considers all three and any mixtures. Her options are: 
  1. Lease the land for a fixed $12,000.
  2. Plant corn: yields $20,000 in Wet, $5,000 in Dry, $10,000 in Normal.
  3. Plant soybeans: yields $5,000 in Wet, $20,000 in Dry, $10,000 in Normal.
  4. Plant a new wheat variety: yields $8,000 in Wet, $8,000 in Dry, $21,000 in Normal.

  **Table:**

  | Option          | Wet   | Dry   | Normal |
  |-----------------|-------|-------|--------|
  | Lease           | 12,000| 12,000| 12,000 |
  | Corn            | 20,000|  5,000| 10,000 |
  | Soybeans        |  5,000| 20,000| 10,000 |
  | Wheat           |  8,000|  8,000| 21,000 |

  **Checking:**

  Expected values (in $1000):

  - Under Almanac (A: 0.2W, 0.5D, 0.3N):
    - Lease: 12
    - Corn: 0.2*20 + 0.5*5 + 0.3*10 = 4 + 2.5 + 3 = 9.5
    - Soy: 0.2*5 + 0.5*20 + 0.3*10 = 1 + 10 + 3 = 14
    - Wheat: 0.2*8 + 0.5*8 + 0.3*21 = 1.6 + 4 + 6.3 = 11.9

  - Under University (B: 0.5W, 0.2D, 0.3N):
    - Lease: 12
    - Corn: 0.5*20 + 0.2*5 + 0.3*10 = 10 + 1 + 3 = 14
    - Soy: 0.5*5 + 0.2*20 + 0.3*10 = 2.5 + 4 + 3 = 9.5
    - Wheat: 0.5*8 + 0.2*8 + 0.3*21 = 4 + 1.6 + 6.3 = 11.9

  - Under National (C: 0.3W, 0.3D, 0.4N):
    - Lease: 12
    - Corn: 0.3*20 + 0.3*5 + 0.4*10 = 6 + 1.5 + 4 = 11.5
    - Soy: 0.3*5 + 0.3*20 + 0.4*10 = 1.5 + 6 + 4 = 11.5
    - Wheat: 0.3*8 + 0.3*8 + 0.4*21 = 2.4 + 2.4 + 8.4 = 13.2

