  - Gamma-maximin defender: "Both ignore worst-case protection. Lease guarantees $12,000, while the others risk as low as $9,500. In ambiguity, security is paramount."
  - Precise Bayesian: "Jane should average the probabilities (e.g., (1/3,1/3,1/3) for each source) and maximize expected utility. Under the average, wheat yields $12,333, so she should plant wheat. Imprecise probabilities lead to indecision and confusion."

