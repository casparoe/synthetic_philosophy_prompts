  4. **Envelope contents are fixed and unalterable**, so an act (switching) that cannot change the other envelope's contents should not systematically beat refraining.
  5. **Scale invariance must hold**: The rational policy must be identical at all amounts (e.g., if switching is right at $X, it must be right at $2X). Cutoffs can only occur at the edge of a prior's support, not arbitrarily in the interior.
  6. **Blind switching has zero expected gain** due to symmetry; this is non-negotiable.
  7. **In a concrete discrete case** (smaller amount uniform over {$1, $2, ..., $512}), switching is favored for observed amounts $1 to $512, and keeping for $1024. This confirms (5), as the cutoff is at the support boundary.
