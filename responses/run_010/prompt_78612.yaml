  ### Explicit Analysis of Concrete Case (Item 7)
  **Setup**: Smaller amount $X$ is uniform over {$1, $2, $4, ..., $512$} (10 values, each with prior probability $1/10$). One envelope contains $X$, the other $2X$. You randomly select an envelope, open it to observe amount $A$, then decide whether to switch.

  **Possible observed amounts**: $A \in \{1, 2, 4, 8, ..., 512, 1024\}$ (11 values). We compute the conditional expected gain from switching ($\text{other envelope} - A$) for each $A$.

  - **Case 1: $A = 1$**  
    Only possible if $X=1$ and you picked the smaller envelope (probability $1/10 \times 1/2 = 1/20$). The other envelope must be $2 \times 1 = 2$.  
    - $P(\text{other} = 2 \mid A=1) = 1$  
    - Expected gain: $2 - 1 = 1$ (gain of $1$).  
    **Verdict: Switch.**

  - **Case 2: $A = 1024$**  
    Only possible if $X=512$ and you picked the larger envelope (probability $1/10 \times 1/2 = 1/20$). The other envelope must be $512$.  
    - $P(\text{other} = 512 \mid A=1024) = 1$  
    - Expected gain: $512 - 1024 = -512$ (loss of $512$).  
    **Verdict: Keep.**

  - **Case 3: $A = 2^k$ for $k = 1$ to $9$ (i.e., $2, 4, ..., 512$)**  
    $A$ could be the smaller amount (so other is $2A$) or larger amount (so other is $A/2$).  
