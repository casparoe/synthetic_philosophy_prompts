  User’s tone suggests they’ve prepped hard. No softballs, no fake quotes. I’ll keep American spellings ("behavior," "program") and avoid "belabour"/"centre." Every question must be breath-length—e.g., "If freedom is just self-tuning within constraints, why isn’t a thermostat free?" 

