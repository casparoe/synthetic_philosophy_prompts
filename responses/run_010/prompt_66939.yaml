  | 8 | "Your design ignores intersectionality. Even if you don't use quotas, without proactive measures, some groups will be entirely absent, making their exclusion systemic." | Descriptive theorist | High | Medium | We accept this risk but argue that quota categories are themselves exclusionary. | Systemic exclusion could delegitimize the body in the eyes of marginalized groups. |

  Now, below the table, for each row, we write:
  - A two-minute reply (spoken, not outline)
  - The follow-up that would expose the soft spot
  - A single sentence marking the concession/hold line.

  Finally, the most dangerous unasked question.

  **Dangerous question:** "Given that your design has never been tested, and you admit there's no evidence that quota-based assemblies are captured, isn't this just a theoretical gamble with public trust?"

  Why dangerous? It attacks the empirical foundation and could make the proposal seem reckless.

  Fallback answer: Acknowledge the lack of evidence but argue that the mechanism is sound and that the risk of capture in predictable designs is real. Propose a pilot.

