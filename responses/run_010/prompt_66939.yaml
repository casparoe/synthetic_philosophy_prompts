  3. **From MP:** "How is this democratic? You're replacing elected representatives with random people who have no mandate and no accountability." (High likelihood, High severity: political feasibility.)
  4. **From organizers:** "Publishing member lists only after the draw prevents necessary preparation and transparency, leading to chaotic proceedings." (Medium likelihood, Medium severity: operational challenge.)
  5. **From methodologist:** "A voluntary registry introduces severe nonresponse bias, making the sample non-random and thus the unpredictability you value is actually just bias." (High likelihood, High severity: undermines the randomness claim.)
  6. **From republican theorist:** "Unpredictability may prevent capture, but it also risks arbitrary power since members are anonymous and not accountable." (Medium likelihood, High severity: challenges the design's avoidance of domination.)
  7. **From organizers:** "A permanent secretariat is essential for continuity and efficiency; without it, each new assembly starts from scratch, wasting resources." (Medium likelihood, Medium severity: practical issue.)
  8. **From methodologist:** "Without stratification, you could end up with an assembly that has, say, no young people or no ethnic minorities, which would skew deliberations." (High likelihood, Medium severity: challenges fairness.)
  9. **From descriptive theorist:** "Your equality of chance is theoretical; in practice, without quotas, marginalized groups won't be included, so their voices are silenced." (High likelihood, High severity: social justice issue.)
  10. **From republican theorist:** "How does anonymity prevent domination? If members are anonymous, they might act without restraint, leading to tyranny of the majority or irrational decisions." (Medium likelihood, Medium severity.)

  We must merge if same person would raise in one breath. For example, the methodologist might combine nonresponse bias and lack of stratification.

  After listing, order by severity and likelihood. Severity: High if it directly kills the proposal. Likelihood: High if it's a common or obvious critique.

  Ranking:

  1. MP on democracy: High severity (political death), High likelihood (MP is hostile).
  2. Organizers on representativeness: High severity (undermines trust), High likelihood.
  3. Methodologist on nonresponse bias: High severity (if true, unpredictability is biased, not random), High likelihood.
  4. Descriptive theorist on legitimacy without mirroring: High severity (core normative challenge), High likelihood.
  5. Republican theorist on arbitrary power: High severity (if true, design creates new problems), Medium likelihood.
  6. Organizers on preparation/transparency: Medium severity (operational, might be fixable), Medium likelihood.
  7. Methodologist on demographic skew without quotas: Medium severity (could be addressed in design?), High likelihood.
  8. Organizers on permanent secretariat: Medium severity (practical, but not core), Medium likelihood.

  We need 8-10. Let's aim for 8.

  Now, write each objection in the objector's register.

  **Table:**

  | Rank | Objection (quoted) | Raised by | Likelihood | Severity | Concession | Soft spot |
  |------|---------------------|-----------|------------|----------|-----------|-----------|
  | 1 | "This is a direct assault on representative democracy. You're replacing accountable elected members with a bunch of amateurs who have no mandate and can't be voted out. How is that not an authoritarian's dream?" | MP | High | High | The proposal does not replace the elected chamber; it adds a chamber to complement it. | The MP might counter that any legislative power for an unelected body is undemocratic. |
  | 2 | "Without stratification by demographics, your assembly will be dominated by the usual suspects: retirees, the highly educated, and political hobbyists. That's not a fair cross-section; it's a skewed sample that can't legitimately speak for the region." | Organizer | High | High | We acknowledge the registry will skew and we don't claim descriptive representation. | The skew might lead to systematic bias in decisions, which is hard to defend. |
  | 3 | "A voluntary registry isn't a random sample; it's self-selected with massive nonresponse bias. Your 'unpredictability' is just noise from a biased pool, not a true random selection. How does that prevent capture? It might even make it worse by over-representing special interests." | Methodologist | High | High | Nonresponse bias is a real issue, but we use audited randomization from the registry. | The registry might be so skewed that the randomness doesn't matter. |
  | 4 | "Legitimacy requires that the assembly descriptively mirrors the population. Your design abandons that, so even if it's unpredictable, why should anyone accept its decisions as authoritative?" | Descriptive theorist | High | High | We offer a different legitimacy basis: equality of opportunity and anonymity. | Mirroring is deeply ingrained; the alternative might not resonate. |
  | 5 | "Anonymity and unpredictability may prevent capture, but they also create arbitrary power. Members aren't accountable, so they could make capricious decisions that dominate minority interests. How do you prevent that?" | Republican theorist | Medium | High | We have mechanisms like public deliberations and single non-renewable terms to limit arbitrary power. | Without accountability, bad decisions might occur and there's no recourse. |
