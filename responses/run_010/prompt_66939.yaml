  We are preparing for a Q&A session following a presentation on a design proposal for a sortition-based legislative chamber. The proposal centers on unpredictability as the key anti-capture mechanism and critiques current best practices. We need to anticipate 8-10 objections that would be raised by the specific audience: mini-public organizers, a survey methodologist, political theorists (descriptive representation and republican), and a hostile MP. Objections should be in the objector's own words, ranked by severity if handled badly, with likelihood. For each, we'll have a concession (if any), a two-minute reply, a soft spot, and the line between what to concede and hold. Finally, we'll identify the most dangerous unasked question and a fallback answer.

  The core of the proposal:
  1. Unpredictability of composition is the key value (anti-capture).
  2. Current practices (quotas, standing panels, early member lists, permanent secretariat) erode unpredictability.
  3. Design: voluntary registry, audited random draw, single 18-month term, no quotas, composition published after draw, pay at median wage.
  4. Legitimacy from equal chance and anonymity, not mirroring.

  We concede: registry will skew old, educated, retired, politically over-engaged; cannot deliver descriptive representation; first claim is mechanism-based without empirical evidence of capture in quota-based assemblies.

  Now, let's brainstorm objections from each group:

  **Mini-public organizers (4-5 people):**
  - They believe stratified civic lottery with demographic quotas is non-negotiable. They might argue:
    - Without quotas, the assembly won't reflect the population, leading to legitimacy issues and poor decisions.
    - Volunteers are self-selected and not representative, so outcomes may be biased.
    - A permanent secretariat is necessary for institutional memory and efficiency.
    - Publishing member lists in advance allows for preparation and transparency.

  **Survey methodologist:**
  - Focus on frames, inclusion probabilities, nonresponse. Might say:
    - A voluntary registry has high nonresponse bias; the sample is not random in practice.
    - Without stratification, the assembly could have severe demographic skew, affecting the validity of decisions.
    - How can you ensure the audited randomization is truly random and auditable?

  **Descriptive representation theorist:**
  - Believes in mirroring for legitimacy. Might argue:
    - Without descriptive representation, the assembly lacks legitimacy because it doesn't mirror the people.
    - Anonymity and equal chance don't ensure that all groups are heard; marginalized groups might be excluded.

  **Republican theorist:**
  - Concerned with domination and arbitrary power. Might say:
    - Unpredictability might prevent capture, but it could lead to arbitrary decisions if members are not accountable.
    - How does this design prevent domination by the majority or by unaccountable members?

  **MP (hostile):**
  - Has to live with the processes politically. Might argue:
    - This is undemocratic because it removes electoral accountability.
    - An assembly of random volunteers without quotas might be unqualified or extremist.
    - How can such a body work with the elected chamber without causing gridlock?

  We need 8-10 distinct objections, ordered by severity (if handled badly) and likelihood. Severity: High if it directly undermines the core thesis or makes the proposal politically unacceptable. Likelihood: High for common critiques, Low for niche ones.

  Ranking severity (if I handle it badly and it damages the proposal):
  1. Objections that challenge the very foundation (unpredictability as anti-capture) and are highly likely (e.g., from organizers) are high severity.
  2. Objections that point out a fatal flaw (e.g., the MP saying it's undemocratic) are high severity.
  3. Objections that are technical but fixable might be lower.

