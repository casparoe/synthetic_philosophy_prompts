  **Dialogue**

  *The seminar room. A printout of data on the table. Selma and Tomás stand over it.*

  **Turn 1: Tomás**  
  *(picking up the printout)*  
  So, the household’s choices satisfy GARP. We can reconstruct a utility function that rationalizes these purchases. But what does that actually tell us? If I take any monotonic transformation of your reconstructed function, it rationalizes the data just as well. So this “utility” isn’t a measurable quantity; it’s just an arbitrary numerical tag for the ordering. How can you claim it represents anything real in the household?

  **Turn 2: Selma**  
  *(leaning in)*  
  It represents the household’s preferences, Tomás. That’s the point. The utility function is an index of the underlying ordering we recover from choices. The non-uniqueness isn’t a bug; it’s a feature. It shows that only the ordering matters for choice. The numbers themselves are just a convenient representation, like assigning numbers to ranks in a race. The real content is in the preference relation.

  **Turn 3: Tomás**  
  But if the numbers are arbitrary, then when you say the household is “better off” after a price change because utility is higher, you’re just saying they chose a bundle they prefer. That’s circular. It doesn’t explain why they prefer it, or what “better off” means beyond the choice itself. Without an independent account of welfare, your welfare claims are vacuous.

  **Turn 4: Selma**  
  Not vacuous — operational. We define “better off” as being able to choose a bundle that was previously chosen or one that is now revealed preferred. That’s empirically grounded. We don’t need to postulate unobservable mental states to make welfare judgments. The theory explains behavior by showing it’s consistent with constrained optimization of a preference ordering. What more do you want?

  **Turn 5: Tomás**  
  I want an explanation, not a redescription. If the theory is just about consistency with an ordering, what observation could ever falsify it? Suppose we see a choice anomaly: someone picks A over B when both are available, but then picks B when a third option C is added. You’ll say that the choice set affects the preference, so it’s a different “situation.” But then your theory becomes unfalsifiable — you just keep re-individuating choice contexts until the data fit.

  **Turn 6: Selma**  
  Context matters, Tomás. If adding C changes the choice, that reveals that the preference isn’t defined over the options in isolation. We model the choice as depending on the menu. That’s not ad hoc; it’s responsive to the data. We can still test for menu-dependent preferences with generalizations of GARP. The theory is falsifiable: if no utility function rationalizes the data under any individuation of alternatives, we reject it.

  **Turn 7: Tomás**  
  But now you’re allowing the “alternatives” to be arbitrarily complex, including social norms or situational factors. So effectively, any choice can be rationalized by defining the alternative finely enough. How is that different from saying the theory is unfalsifiable?

  **Turn 8: Selma**  
  It’s constrained by the need for a stable, recoverable preference structure. We don’t just make up new attributes for every anomaly; we look for systematic patterns. But let’s grant your point: maybe in practice, we can always find some description that fits. But that’s a methodological challenge, not a refutation. The theory’s core is that choices reveal preferences, and preferences are stable under the same description of alternatives. We test that by varying descriptions.

  **Turn 9: Tomás**  
  Fair enough. But let’s shift to a context where we do get more structure: lotteries. Under expected utility, utility is unique up to positive affine transformations. The differences between utility values matter. But if utility isn’t measuring any psychological magnitude, what do those differences represent? Why should we care that one gamble has a higher expected utility if it doesn’t correspond to something real?

  **Turn 10: Selma**  
  The differences represent strength of preference in a behavioral sense: how much risk the agent is willing to take. The affine uniqueness allows us to quantify trade-offs and make interpersonal comparisons in a way ordinal utility doesn’t. But it’s still about choice: the von Neumann-Morgenstern utility function represents preferences over lotteries, and the values are determined by the indifference points we observe.

  **Turn 11: Tomás**  
  But again, it’s only about choice. If I say, “This gamble has higher expected utility,” I’m just saying it’s chosen over others. The affine transformation uniqueness gives us a cardinal scale, but if there’s no independent mental state it corresponds to, then how can we say the person is “happier” with the outcome? And without that, how do we ground welfare economics? Pareto efficiency is defined in terms of utility, but if utility is just choice, then it’s circular.

  **Turn 12: Selma**  
  You keep wanting to ground utility in something beyond choice. But why? The theory works without it. Welfare economics uses the Pareto criterion: if we can make someone better off without making anyone worse off, we should. “Better off” means they would choose the new bundle if given the chance. That’s observable and non-circular.

  **Turn 13: Tomás**  
  But it’s not explanatory. It doesn’t tell us why they choose it. It doesn’t let us say that a tax hurt them in a way that isn’t just “they would choose to avoid it.” I want a theory that connects to why they have those preferences. Without that, economics is just a formalization of behavior, not a science of human welfare.

  **Turn 14: Selma**  
  Then let me offer a different move: utility isn’t eliminated; it’s identified with a disposition to choose. Like fragility is identified with a disposition to break. The utility function represents a higher-order property that explains why the agent chooses consistently. It’s a theoretical term that earns its keep by systematizing the data.

  **Turn 15: Tomás**  
  But dispositions are multiply realizable. The same choice disposition could be realized by different mental states: one person chooses apples because they like the taste, another because of social pressure. So your “utility” property isn’t identical to any one mental state. But that’s fine for you because you don’t care about the mental state. However, if utility is just the disposition itself, then it has no content beyond the choices. So when we say “utility increased,” we’re just saying the disposition changed — which is just that choices changed. Again, redescription.

  **Turn 16: Selma**  
  But the disposition is stable and explains counterfactual choices. It’s not just the actual choices; it’s what they would choose in other situations. That’s the explanatory role. And we can test it by changing prices and income and predicting new choices. So it’s not vacuous.

  **Turn 17: Tomás**  
  But without independent constraints, the disposition is defined by the very choices it’s supposed to explain. It’s a logical construct, not a causal one. And when we make welfare claims — say, that a policy increased utility — we’re not saying it caused some inner satisfaction; we’re saying it caused a change in the disposition. But that’s just saying the policy caused a change in what they would choose. It’s still behavioral. I think we need to concede that if we want welfare economics to be about well-being, we need an account of well-being that isn’t just choice.

  **Turn 18: Selma**  
  *(pauses)*  
  Okay, I’ll concede that if we want welfare to be about something beyond choice — some inner state — then my approach doesn’t provide that. But I don’t think we need that for positive economics. For welfare economics, we can stick to the Pareto criterion based on choice. That’s a cost I’m willing to accept: we don’t explain why preferences are what they are, but we don’t need to for many purposes.

  **Turn 19: Tomás**  
  That’s a significant concession. Thank you. And I’ll concede that your approach is methodologically robust. It avoids committing to unobservable mental states, and for predictive purposes, it’s powerful. But it comes at the cost of explanatory depth for welfare. So I accept that for positive theory, revealed preference is effective. But for normative economics, we need more.

  **Turn 20: Selma**  
  I’m glad we agree on that. But I’m not sure what “more” would be. How could we ever observe or measure this inner state you want? And how would it integrate with choice? If choice is all we observe, how do we know if it’s correlated with the inner state? If someone chooses A but says they’re unhappy with it, do we say they’re irrational? Then we’re back to defining utility by choice.

  **Turn 21: Tomás**  
  It’s tricky. But we might use neuroscience or self-reports. If we find that when people choose A, certain brain states or reported satisfactions are present, and those correlate with choices, then we have an independent measure. But if choices and reported satisfaction diverge, we need to decide which defines “utility.” I think that’s where the impasse lies.

  **Turn 22: Selma**  
  Exactly. And I think choice should be primary because it’s what matters for behavior and for market outcomes. But I see why you want more for welfare. So what would settle it? For me, I’d need to see a workable theory of welfare that uses inner states but still connects to choice in a way that doesn’t make economics dependent on unverifiable introspection.

  **Turn 23: Tomás**  
  And I’d need to see that your choice-based approach can handle welfare comparisons without smuggling in unstated assumptions about well-being. For example, when we say a policy is Pareto improving, we’re assuming that people choosing differently means they’re better off. But if choices can be mistaken or influenced by irrelevant factors, that might not hold. So I’d need a defense against such challenges within your framework.

  **Turn 24: Selma**  
  Then we’re at an impasse. But a productive one.

  **Turn 25: Tomás**  
  Agreed.

