  ### Self-Locating Belief Diagnostic Quiz

  **Instructions:** Answer each question based *only* on the described situation. Use simple fractions (e.g., 1/2, 1/3) or exact words. Do not reference philosophical terms.

  ---

  1. **Deferred Toss**  
     On Sunday, you are told: "You’ll be woken once (Interview 1), given amnesia, and put back to sleep. *After* Interview 1, a fair coin is tossed. If heads, you won’t be woken again. If tails, you’ll be woken a second time (Interview 2)."  
     (a) At Interview 1, your credence that the coin will land heads is:  
     (b) Compare this to your credence at Interview 1 in the *original* Sleeping Beauty experiment (coin tossed *before* any waking): It is:  
     [Options: (a) 1/2, 1/3, 2/3; (b) same, higher, lower]  

  2. **Three-Waking Experiment**  
     On Sunday, you are told: "A fair coin is tossed. If heads, you’ll be woken once (Monday only). If tails, you’ll be woken three times (Monday, Tuesday, Wednesday). After each waking, you get amnesia." At a waking:  
     (a) Your credence that the coin landed heads is:  
     (b) Your credence that *this* is your first waking is:  
     [Options: 1/2, 1/3, 1/4, 2/3, 3/4]  

  3. **Monday Disclosure**  
     In the original Sleeping Beauty setup (coin tossed Sunday; heads: 1 waking; tails: 2 wakings; amnesia after each). You wake up and are told: "Today is Monday." Your credence that the coin landed heads is:  
     [Options: 1/2, 1/3, 2/3, same as Sunday (1/2)]  

  4. **Waking as Evidence?**  
     In the original Sleeping Beauty setup, when you wake up, does the fact that you are awake (having this experience) count as gaining evidence about the coin toss?  
     [Options: Yes, No]  

  5. **Control Situation**  
     On Sunday, a fair coin is tossed. Regardless of outcome, you’ll be woken once on Monday and once on Tuesday (with amnesia after each). At a waking, your credence that the coin landed heads is:  
     [Options: 1/2, 1/3, 2/3]  

  6. **Ticket Pricing**  
     In the original Sleeping Beauty setup, at each waking, you’re offered a ticket that pays $1 if the coin landed heads. You keep all tickets you buy (they aren’t canceled). What’s the highest price (in dollars) you’d pay for one ticket at a waking?  
     [Options: 0.25, 0.33, 0.50, 0.67]  

  7. **Dutch Book Vulnerability**  
     In the original setup, at each waking, you’re offered a bet: "Pay $0.50 now; get $1 if heads, $0 if tails." If you accept this bet at *every* waking, you lose $1 if tails (since you pay twice) and gain $0.50 if heads. Does this show your credence in heads *must* be 1/3?  
     [Options: Yes (incoherence), No (bets not simultaneous), No (acceptable given setup)]  

  8. **Multiple Subjects**  
     On Sunday, a fair coin is tossed. If heads, one person (Alice) is created and woken once. If tails, two people (Betty and Chloe) are created and each woken once. You are created and woken. Your credence that the coin landed heads is:  
     [Options: 1/2, 1/3, 2/3]  

  9. **Indeterminate Answer?**  
     In the original setup, when you wake up, is there a single correct numerical credence you *should* assign to heads?  
     [Options: Yes (1/2), Yes (1/3), No (assign a range), No (credence doesn’t apply)]  

  10. **Indexical Content**  
      In the original setup, when you wake up, your knowledge includes indexical facts (e.g., "this is my current waking"). How does this affect your credence for heads?  
      [Options: Changes probability, Doesn’t change probability, Irrelevant, Dispute is about representation]  

  ---

  ### Scoring Key  
  *Sorts by answer combinations. Positions are defined by the pattern.*  

  #### Position 1: **Lewis Halfer** (1/2 on waking; updates on indexicals)  
  - **Core answers**: 1(b)=same, 2(a)=1/2, 3=2/3, 4=No, 6=0.50, 8=1/2, 10=Changes probability  
  - **Profile**: Waking isn’t evidence; defers to Sunday odds until indexical info (e.g., "Monday") updates credence.  

  #### Position 2: **Double Halfer** (always 1/2)  
  - **Core answers**: 1(b)=same, 2(a)=1/2, 3=1/2, 4=No, 6=0.50, 8=1/2, 10=Doesn’t change/Irrelevant  
  - **Profile**: Waking and indexicals never change odds; 1/2 is fixed.  

  #### Position 3: **Thirder** (1/3 on waking)  
  - **Core answers**: 1(b)=lower, 2(a)=1/4, 3=1/2, 4=Yes, 6=0.33, 7=Yes, 8=1/3, 10=Changes probability  
  - **Profile**: Conditions on full evidence (including indexicals); probabilities weight observer-moments.  

  #### Position 4: **Deflationist** (no single answer)  
  - **Core answers**: 9=No, 10=Dispute is about representation  
  - **Profile**: Ambiguous question; disagreement stems from how to represent self-locating beliefs.  

  #### Position 5: **Subjectivist** (range of credences)  
  - **Core answers**: 9=No (assign a range)  
  - **Profile**: Permissible to assign a range (e.g., [1/3, 1/2]); no unique rational credence.  

  #### Position 6: **SSA Halfer** (1/2; samples from actual observers)  
  - **Core answers**: 1(b)=same, 2(a)=1/2, 8=1/2, 10=Irrelevant  
  - **Profile**: Samples from *actual* observers (ignoring counterfactuals); indexicals irrelevant.  

  #### Position 7: **SIA Thirder** (1/3; samples from possible observers)  
  - **Core answers**: 1(b)=lower, 2(a)=1/4, 8=1/3, 10=Changes probability  
  - **Profile**: Samples from *possible* observers (including counterfactuals); indexicals update credence.  

  ---

  #### Inconsistent Combinations  
  1. **1(b)=same** (halfer) + **2(a)=1/4** (thirder) → *Incoherent*: Applies different update rules to isomorphic cases.  
  2. **4=No** (halfer) + **5≠1/2** → *Unstable*: Control must be 1/2 if waking isn’t evidence.  
  3. **6=0.50** (halfer) + **7=Yes** → *Incoherent*: Dutch Book critique undermines own pricing.  
  *None are viable; all violate probability or reflection.*  

  #### Conflict Resolution  
  If answers conflict (e.g., halfer + thirder patterns), identify the *two items* with incompatible answers (e.g., "Item 1 and Item 2 conflict").  

  #### Unresolved Pairs  
  1. **SSA Halfer** vs. **Double Halfer**: Both give identical answers except in Monday disclosure (Item 3). *Separator*: Add an item on post-Monday credence in a four-day variant.  
  2. **SIA Thirder** vs. **Thirder with Dutch Book skepticism**: Both agree except on Dutch Book (Item 7). *Separator*: Add a sequential-betting scenario.  

  ---

  ### Session Guide (40 Minutes)  
  - **Order**: Read items 1→3 (mandatory) first to anchor discussion. Then proceed to 4→10.  
  - **Disagreement hotspots**: Expect debate on Item 1(b) (halfer vs. thirder), Item 3 (Monday update), Item 6 (pricing), and Item 7 (Dutch Book).  
  - **If short on time**: Drop Item 10 (indexical content). It’s inferable from other answers, and deflationism is covered by Item 9.  
  - **Timing**:  
    - 10 min: Items 1–3 (read aloud, collect initial answers).  
    - 20 min: Items 4–9 (focus on 6 and 7 for betting disputes).  
    - 10 min: Review key patterns and conflicts.
