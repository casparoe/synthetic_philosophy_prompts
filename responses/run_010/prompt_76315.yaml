prompt: |-
  I write reliability tooling, so half my job is probability × impact: rank the failure modes, fix the top of the list. It works great until the impact gets huge and the math starts telling me to spend the whole quarter on something with a one-in-a-million chance. Concrete version: we once argued for two weeks about building a failover path our model put at ~1-in-10,000 per year, where if it ever mattered it'd cost the company something like $40M. Half the room said multiply it out, obviously worth it. The other half said that's exactly how "expected value fanaticism" eats an engineering org, and the first half said fine, then give me a rule that isn't just vibes. Nobody could.

  Before I read anything about it, I want the spec. What does a decision rule for low-probability / very-high-stakes choices have to deliver to count as adequate? I want the requirements list with the case behind each one — what it has to get right (mugging-style cases where a stranger offers astronomical payoffs for a small cost; cases where people who discounted tiny probabilities ended up dead or bankrupt; whether you're allowed to round small probabilities to zero without being exploitable across a sequence of decisions), the distinctions it can't collapse, and the results from probability and decision theory it can't contradict. Then say which requirements are hard constraints and which are just the taste of one camp, and whether some subset of them is jointly impossible — that's the bit I actually want. Also: which single requirement knocks out the most candidate rules.

  Purpose, so adequacy isn't floating: decisions made by one agent or a small team, roughly once, with real money and real timelines — not civilizational bets on the far future. Add a line at the end on whether the spec would change if it were.

  Sections in this order, with rough lengths: "Purpose and scope" (~100 words), "Requirements" (the bulk — numbered, each with its motivating case, ~700 words), "Hard constraints vs. camp preferences" (~150 words), "Where the list fights itself" (~200 words), "Most exclusionary requirement" (~100 words). No scorecard of existing views, I'll do that myself later.
reasoning: |-
  We are designing a decision rule for low-probability, very-high-stakes events in a reliability engineering context. The purpose is to avoid both expected value fanaticism (which might lead to over-investing in extremely rare events) and naive discounting (which might lead to catastrophic neglect). The rule must be robust, non-exploitable, and grounded in decision theory.

  ## Requirements

  1. **Avoidance of Guaranteed Exploitation (Dutch Book Argument)**: The rule must not allow a sequence of decisions that guarantees a loss.  
     *Motivating case*: Consider a sequence of independent 1-in-a-million chances to lose $1M, each with a prevention cost of $0.50. If we round the probability to zero and skip prevention, we expect to lose $1M on average every millionth event, which is an expected cost of $1 per event. But if we pay $0.50 each time, we avoid that loss. Over a long sequence, skipping leads to an expected loss of $1 per event, while paying leads to a cost of $0.50. Thus, rounding to zero is exploitable. The rule must avoid such sequences.

  2. **Bounded Losses (Bankruptcy Avoidance)**: The rule must prevent a single decision (or a short sequence) from causing catastrophic loss.  
     *Motivating case*: A person who ignores a 1-in-a-million chance of losing $100M because the expected loss is only $100 might face bankruptcy if the event occurs. Similarly, a company that ignores a 1-in-10,000 chance of a $40M loss (expected loss $4,000) because the cost to prevent is $10,000 might be wiped out if the event happens. The rule must not allow a decision that, with non-negligible probability, leads to ruin.

  3. **Sensitivity to Extreme Stakes (Pascal's Mugging)**: The rule must not be overly sensitive to arbitrarily high stakes combined with arbitrarily low probabilities.  
     *Motivating case*: A stranger (Pascal's mugger) says: "Give me $10, or I will use my magic powers to destroy the world, which has a 1-in-10^100 chance of happening." The expected loss of not paying is astronomical (e.g., 10^100 lives * 1/10^100 = 1 life? but actually the stakes are in dollars, so let's say the value of the world is $V, then expected loss is V/10^100). If V is huge (say $10^100) then expected loss is $1, so paying $10 is bad. But if V is much larger, say $10^102, then expected loss is $100, so paying $10 is good. This leads to paying the mugger. The rule must avoid being extorted by such scenarios.

  4. **Consistency with Risk Aversion (Human Intuition)**: The rule should reflect the fact that people and organizations are risk-averse, especially for losses that are large relative to their total assets.  
     *Motivating case*: A company with $100M in assets faces a 1-in-1000 chance of losing $50M. The expected loss is $50,000. A risk-neutral decision would compare the cost of prevention to $50,000. But if the loss would be catastrophic (half the company), risk aversion might justify spending more than $50,000. The rule should account for non-linear utility of money.

  5. **Scalability to Multiple Events (Portfolio Effect)**: The rule must account for the fact that an organization faces multiple risks simultaneously, and the interaction of these risks (e.g., correlation, diversification) should be considered.  
     *Motivating case*: If an organization faces 1000 independent risks, each with a 1-in-10,000 chance of causing a $1M loss, the expected loss per risk is $100. Treating each risk in isolation might lead to ignoring each (if prevention costs $150 per risk). But the overall expected loss is $100,000 (1000 * $100). Moreover, the probability of at least one loss is about 10% (1 - (0.9999)^1000 ≈ 0.095). If the company can only absorb one such loss without distress, then the risk is concentrated. The rule must aggregate risks appropriately.

  6. **Practical Computability (Tractability)**: The rule must be computationally feasible and not require exhaustive enumeration of all possible events or precise probabilities that are inherently uncertain.  
     *Motivating case*: In real-world reliability engineering, we often deal with poorly estimated probabilities and incomplete lists of failure modes. A rule that requires exact probabilities or a complete model of the world is not usable.

  7. **Robustness to Uncertainty (Knightian Uncertainty)**: The rule must function even when probabilities are not known precisely, but only bounded or qualitatively estimated.  
     *Motivating case*: For a novel failure mode, we might only know that the probability is "very low" (e.g., less than 1-in-1,000 per year). The rule must not break down when we cannot assign an exact probability.

  ## Hard constraints vs. camp preferences

  * **Hard constraints**: Requirements 1 (Avoidance of Guaranteed Exploitation) and 2 (Bankruptcy Avoidance) are hard because they are about avoiding sure losses and existential threats. These are non-negotiable for any rational agent. Also, Requirement 4 (Risk Aversion) is fundamental for organizations with limited capital because of the non-linear impact of large losses.

  * **Camp preferences**: Requirement 3 (Pascal's Mugging) and Requirement 5 (Portfolio Effect) might be emphasized more by some camps. For instance, expected value maximizers might downplay Pascal's Mugging, arguing that in practice, such scenarios don't occur. Similarly, some might argue that Requirement 5 is too complex and that treating risks in isolation is a necessary simplification. Requirement 6 (Tractability) is a practical constraint that might be relaxed in theory but not in practice.

  ## Where the list fights itself

  The tension is most evident between **Requirement 1 (no Dutch books) and Requirement 2 (no bankruptcy)**. Requirement 1 pushes us toward expected utility theory (EUT) to avoid exploitable decisions. However, EUT with a linear utility function (risk-neutral) leads to Requirement 3 (Pascal's Mugging) and ignores bankruptcy (Requirement 2). But if we use EUT with a concave utility function (risk-averse), we address Requirement 2 and 4, but we still face Pascal's Mugging (Requirement 3) because for any bounded utility function, there exists a sufficiently high stakes event with a sufficiently low probability that it becomes negligible. On the other hand, if we use a bounded utility function, then Pascal's Mugging is avoided, but we might violate Requirement 1 in the limit? Actually, bounded utility functions are consistent with EUT and avoid Dutch books. However, they don't completely avoid Pascal-style issues because the bound is arbitrary. 

  Moreover, Requirement 2 (bankruptcy) and Requirement 5 (portfolio) conflict with simplicity: aggregating all risks is complex. Also, Requirement 7 (uncertainty) might conflict with Requirement 1 because without precise probabilities, we cannot compute expected values exactly.

  ## Most exclusionary requirement

  **Requirement 3 (Pascal's Mugging)** is the most exclusionary because it immediately rules out any decision rule that is linear in the stakes (i.e., expected value maximization without bounds). But more importantly, it also challenges non-linear expected utility theory: even with risk aversion, if the utility function is unbounded, then arbitrarily low-probability events with arbitrarily high stakes can dominate. Hence, it pushes us toward bounded utility functions. However, bounded utility functions are controversial because they imply that there is a finite value for, say, human civilization. Moreover, bounded utility functions may conflict with Requirement 5 (portfolio effect) because the aggregation of many small risks might be misestimated.

  ## Purpose and scope (appended as per instruction)

  **Purpose and scope**: This decision rule is intended for a single agent or small team making one-off or infrequent decisions in a corporate reliability context. The stakes are in real money (not existential for humanity) and the timeframes are operational (e.g., quarterly planning). The rule must balance the avoidance of catastrophic losses with the practical need to allocate engineering resources efficiently. If the scope were expanded to civilizational bets (e.g., mitigating existential risks), the requirements would change: we would need to consider intergenerational equity, infinite stakes, and the possibility of human extinction, which might lead to a stronger emphasis on avoiding any non-zero probability of extinction (e.g., the Precautionary Principle) and less concern about bounded resources.
answer: |-
  ### Purpose and Scope
  This decision rule addresses low-probability, very-high-stakes trade-offs in reliability engineering (e.g., mitigating 1-in-10,000 annual risks with $40M impacts). It targets one-off/small-batch choices by a single agent or team under real-world constraints: finite budgets, known probabilities (even if tiny), and stakes that threaten severe but non-existential losses (e.g., corporate bankruptcy vs. human extinction). Scope excludes civilizational-scale, far-future, or infinite-utility scenarios. Primary goal: avoid both expected-value fanaticism and negligent discounting while preserving defensibility. (~95 words)

  ---

  ### Requirements  
  Each requirement is justified by a motivating failure case and its decision-theoretic implications.  

  1. **Avoids guaranteed exploitation across repeated decisions** (Dutch book coherence)  
     *Case*: A sequence of 1,000 independent choices, each offering a 1-in-10,000 chance to gain $1B for a $1 cost. Rounding probabilities to zero rejects all, missing ~$100K expected value. But accepting all risks bankruptcy if one loss hits.  
     *Requirement*: The rule must not be dynamically inconsistent—no sequence of individually "optimal" choices should guarantee net loss. Must satisfy probability axioms (non-negative, additive probabilities).  

  2. **Rejects Pascal’s mugging** (Non-manipulability by arbitrary stakes)  
     *Case*: A stranger demands $100, threatening a 1-in-10^20 chance of destroying $10^30 worth of assets. Naive expected-value says pay, paralyzing resources.  
     *Requirement*: The rule must not allocate resources to arbitrarily improbable threats based solely on stakes. Must bound sensitivity to low-probability events, irrespective of claimed impact.  

  3. **Prevents ruin in single decisions** (Bankruptcy avoidance)  
     *Case*: Ignoring a 1-in-50,000 chance of a $100M loss (expected cost: $2K) because mitigation costs $3K. If the event occurs, the firm collapses.  
     *Requirement*: The rule must forbid accepting risks where loss magnitude exceeds tolerable thresholds (e.g., >10% of capital), even if expected value favors it.  

  4. **Distinguishes risk from uncertainty** (Knightian robustness)  
     *Case*: Two failure modes: one with well-modeled 1-in-10,000 probability, another with unknown probability but similar impact. Treating both as "expected value = $4K" ignores epistemic uncertainty.  
     *Requirement*: The rule must handle ambiguous probabilities differently than precise ones (e.g., requiring stricter margins for unknowns).  

  5. **Respects risk aversion without arbitrariness** (Non-linear utility)  
     *Case*: A 1-in-100 chance of losing $10M (expected loss: $100K). A risk-neutral agent spends ≤$100K to mitigate; a risk-averse one spends more. But how much more?  
     *Requirement*: The rule must embed concave utility (e.g., log-wealth) to justify spending beyond expected value, but utility functions must be explicit and non-ad-hoc.  

  6. **Forbids zero-rounding without recourse** (Continuity)  
     *Case*: Rounding a 1-in-1,000,000 risk to zero because "too small." Over 1,000 such decisions, expected failures approach one.  
     *Requirement*: Probabilities cannot be rounded to zero without considering accumulated risk exposure. Continuous functions must link probability, impact, and action.  

  7. **Scales to aggregated risks** (Portfolio sensitivity)  
     *Case*: 100 independent 1-in-100,000 risks of $10M losses. Mitigating each costs $200 (expected loss: $100). Soloing each appears wasteful, but aggregate expected loss is $10K, and joint probability of ≥1 failure is ~0.1%.  
     *Requirement*: The rule must account for risk interactions (correlation, total exposure) and budget constraints—no isolated evaluations.  

  8. **Tolerates bounded irrationality** (Cognitive realism)  
     *Case*: Engineers reject a 1-in-10,000 risk fix costing $10K (expected value: $4K) because "it feels negligible," despite meeting other requirements.  
     *Requirement*: The rule must permit heuristic overrides (e.g., probability thresholds) if they demonstrably reduce error costs, provided they don’t violate coherence.  

  ---

  ### Hard Constraints vs. Camp Preferences  
  **Hard constraints** (violations break rationality):  
  - (1) Avoids guaranteed exploitation (Dutch books violate probability theory).  
  - (2) Rejects Pascal’s mugging (unbounded utility leads to incoherent decisions).  
  - (3) Prevents ruin (necessary for survival).  
  - (6) Forbids zero-rounding (continuity is axiomatic in probability).  

  **Camp preferences**:  
  - (4) Distinguishing risk/uncertainty: Bayesians accept subjective probabilities; Knightians reject them.  
  - (5) Risk aversion: Expected utility purists accept any concave function; critics demand calibration.  
  - (8) Bounded irrationality: Traditionalists reject heuristics; pragmatists embrace them.  

  ---

  ### Where the List Fights Itself  
  **Core tension**: (1) and (6) demand expected-utility consistency, but (2) and (3) require deviations.  
  - *Conflict*: (1) requires linearity in probabilities for coherence, but (2) demands capping stakes-sensitivity—forcing non-linear weighting (e.g., probability discounting). Yet (6) forbids discarding small probabilities, creating friction with (2).  
  - *Secondary conflict*: (3) (avoid ruin) pushes for threshold-based rules (e.g., "never risk >X% of capital"), but (7) (portfolio effects) complicates defining "a risk" (isolated vs. aggregated). Thresholds may misaggregate correlated risks.  
  - *Result*: No rule satisfies all perfectly. Expected utility + log-wealth utility satisfies (1),(3),(5),(6) but fails (2) (if utility is unbounded) and (4) (treats uncertainty as risk). Prospect theory (probability weighting) satisfies (2),(3),(5) but violates (1) (non-additive probabilities invite Dutch books).  

  ---

  ### Most Exclusionary Requirement  
  **Requirement (2) Rejects Pascal’s mugging** is maximally exclusionary. It immediately eliminates:  
  - Pure expected-value maximization (over-prioritizes high stakes).  
  - Unbounded utility functions (e.g., linear, logarithmic, CRRA with γ<1).  
  - Rules without probability dampening (e.g., "always act if expected value > cost").  
  It forces probability weighting (e.g., *p* → *p*/(*p* + *k*)) or bounded utility—both of which risk violating (1) or (6). (~90 words)  

  ---

  ### Spec Change for Civilizational Bets  
  For civilizational stakes (e.g., asteroid impacts), **requirements (2) and (3) dominate**: Pascal’s mugging becomes secondary to avoiding extinction, and "ruin" is absolute. Ambiguity aversion (4) intensifies (e.g., Precautionary Principle). Aggregation (7) expands to multi-century risks. Dutch-book coherence (1) may weaken if survival outweighs intertemporal consistency. (~50 words)
