prompt: |-
  I'm trying to settle something for an essay I'm working on, and I want an actual argument, not a survey. No bibliography or citations needed — I just want the reasoning laid out.

  The standard move: WEIRD psychology tells us that the harm-centred folk morality a lot of moral philosophy treats as "morality, obviously" is an outlier, and that many societies moralize purity, deference, loyalty, honor, and treat damage to the group's standing as a wrong even when nobody is measurably hurt. Anti-realists then say this kind of spread is what you'd expect if there were no moral facts to track — more like disagreement about which foods are disgusting than about arithmetic.

  Here's the wrinkle I want you to chew on. Suppose the anthropology gets sharper and the big differences turn out to live inside individual heads rather then between cultures: take the same person, prime a kin/community frame in one condition (you're deciding about your cousin) and an anonymous one-shot market frame in another (you're deciding about a stranger you'll never meet again), and you reproduce most of the cross-cultural spread within one subject on one afternoon. Which frame gets applied is set by cues the person doesn't endorse and can't easily reason their way out of.

  Does that help or hurt the case for moral objectivity? I can see it both ways and I want you to come down somewhere. On one hand it hands the realist a nice reply — one shared moral repertoire, different frames selecting from it, so nobody is failing to see a truth. On the other hand it might take away the realist's main escape hatch, which is that disagreement would wash out under better information and reflection; cue-sensitivity doesn't wash out when you inform people, it just moves with the cue.

  Use these sections, in this order:

  - **What's actually being claimed** (~200 words) — the empirical pattern in a couple of sentences, and say precisely which version of "objectivity" is at stake, because I think a lot of this debate is people denying different things
  - **Why it's supposed to be a problem** (~250 words) — how variation is meant to get from "people disagree" to "there's no fact of the matter"
  - **The realist's best counters** (~300 words) — steelman them properly, at least two distinct replies, and say where each one is weakest
  - **What the within-the-head version changes** (~300 words) — does moving the variation from between cultures to between situations in one person strengthen or weaken those counters
  - **My verdict** (~200 words) — commit. Either objectivity survives, or it doesn't, or it survives only under a specific qualification you state crisply. "It depends what you mean by realism" is not an acceptable landing.
reasoning: |-
  Okay, the user is working on an essay and wants to settle an argument about moral objectivity. They've presented a specific scenario where moral judgments vary within the same person based on contextual cues, rather than between cultures. The key question is whether this within-person variation helps or hurts the case for moral realism.

  First, I need to clarify the core claim. The empirical pattern shows that an individual's moral judgments shift when primed with different frames—like kinship vs. market contexts—without changing their explicit beliefs. The objectivity at stake here is whether moral properties are stance-independent, meaning they exist regardless of human perspectives.

  The anti-realist argument hinges on variation implying no facts to track. If moral judgments are cue-sensitive and persistent despite reflection, it challenges the realist's claim that disagreement would resolve under better conditions. The realist typically counters with deep structure universality or idealization, but cue-sensitivity undermines both.

  Now, the twist: moving variation from cross-cultural to intra-personal. This strengthens the anti-realist position because it removes the realist's escape hatches. If the same person can't reconcile judgments across frames even with reflection, it suggests morality is more about context-dependent responses than tracking objective truths. 

  The realist might argue that frames reveal different facets of a complex truth, but cue-sensitivity still prevents convergence. The verdict leans toward anti-realism, as cue-driven variation persists despite ideal conditions, making stance-independent morality implausible. This doesn't mean morality is arbitrary, but it challenges robust objectivity.
answer: |-
  ### **What's actually being claimed**  
  The empirical claim is that moral judgments within a single individual shift dramatically based on contextual cues (e.g., framing an act as involving kin vs. a stranger), *without* changes in reflective beliefs or access to facts. This cue-triggered variation replicates cross-cultural moral diversity (e.g., harm-focused vs. loyalty/purity-focused judgments) intra-personally. The "objectivity" at stake is **stance-independence**: whether moral facts exist independently of human psychological responses, such that moral disagreements could (in principle) be resolved by improved information or reasoning.

  ---

  ### **Why it's supposed to be a problem**  
  Anti-realists argue moral variation undermines objectivity: if morality tracked stance-independent facts, widespread disagreement would resolve under ideal conditions (full facts, rational reflection), like disagreements in physics or math. Cross-cultural variation suggests moral intuitions are socially constructed, not discovered. The intra-personal version intensifies this:  
  - **Persistence despite reflection**: Cue-sensitivity isn't eroded by informing subjects of biases or providing reasons; it’s triggered automatically. This mirrors taste disagreements (e.g., cilantro’s soapiness), where no "fact" resolves differences.  
  - **No convergence path**: If the *same person* cannot align judgments across frames even with full information (e.g., "Why is bribing a stranger acceptable but bribing your cousin corrupt?"), it implies moral responses are outputs of non-truth-tracking cognitive subsystems. Variation isn’t ignorance but *constitutive* of moral cognition.  

  Anti-realism predicts this: without moral facts, judgments should be context-dependent, post-hoc rationalizations of evolved/learned heuristics.

  ---

  ### **The realist's best counters**  
  1. **Deep Structure Universality**:  
     Realists could argue cues merely activate different *priorities* within a universal moral "grammar" (e.g., all frames still engage normative concepts like "wrongness"). Disagreement is about weighting values (loyalty vs. fairness), not the existence of values themselves. Just as color perception varies under lighting but tracks objective wavelengths, cues surface facets of a complex moral reality.  
     *Weakness*: If no principled way exists to adjudicate weightings (e.g., why kinship *should* matter), this reduces morality to subjective preference.  

  2. **Idealization Escape Hatch**:  
     Realists might concede actual judgments are cue-sensitive but insist objectivity emerges at the *idealized limit*: fully informed, rational agents would converge on correct judgments by overriding cues. E.g., recognizing kinship framing as morally irrelevant.  
     *Weakness*: If cue-sensitivity is robust (e.g., persisting in philosophers post-reflection), the "ideal agent" becomes an empty hypothesis. Cues aren’t ignorance but embedded in moral reasoning itself.

  ---

  ### **What the within-the-head version changes**  
  This intra-personal variation **severely weakens realist counters**:  
  - **Undercuts Universality**: Cross-cultural variation lets realists argue different societies grasp *parts* of moral truth (e.g., "Some cultures overemphasize purity"). Intra-personal variation destroys this: the *same mind* accesses contradictory "truths" based on arbitrary cues. If morality is stance-independent, why would framing a stranger as "cousin" alter moral truth-tracking?  
  - **Collapses Idealization**: Realists rely on disagreement resolving via reflection. But if cue-sensitivity is automatic and unresponsive to reasoning (e.g., subjects *know* the cousin is a stranger yet feel loyalty’s pull), the "ideal agent" must either reject cue-driven intuitions (losing core moral data) or accept contradictions. Neither secures objectivity.  
  - **Strengthens Anti-Realist Prediction**: Cue-driven switching mirrors perceptual illusions (e.g., the duck-rabbit), suggesting morality is a constructed *response* not a detected *property*. This fits anti-realism’s view that moral intuitions are fitness-enhancing heuristics, not truth-apt perceptions.

  ---

  ### **My verdict**  
  **Objectivity does not survive** in any robust, stance-independent form. The intra-personal data show moral judgments are *caused* by non-moral cues (kinship framing), persist despite knowledge of their arbitrariness, and generate contradictions *within a single rational agent*. This implies:  
  1. Moral responses are outputs of contingent cognitive systems shaped by evolution/social learning, not tracking mind-independent facts.  
  2. The "disagreement resolves under reflection" defense fails, as cue-sensitivity is reflection-proof.  

  **Qualification**: Moral objectivity *could* hold in a minimal, formal sense (e.g., "Torture for fun is wrong" is true if we define "wrong" as violating wellbeing), but this is trivial. Substantive objectivity—that moral properties exist independently and compel convergence—collapses under cue-driven variation. Morality is more like disgust than arithmetic: adaptive, subjective, and frame-dependent.
