  The payoff formula is:
  Baseline 2.0 for all
  Plus (number of A larvae × 1.6)/10 shared benefit
  Minus 0.6 private cost for each A larva

  So for AA fruit:
  10 A larvae
  Benefit: (10×1.6)/10 = 1.6 per larva
  Cost: 0.6 per A larva
  Total per larva: 2.0 + 1.6 - 0.6 = 3.0 → matches

  For AB fruit (5A,5B):
  Benefit per larva: (5×1.6)/10 = 0.8
  A larvae: 2.0 + 0.8 - 0.6 = 2.2
  B larvae: 2.0 + 0.8 = 2.8 → matches

  BB fruit: 2.0 per B larva → matches

  Offspring totals:
  AA: 40 fruits × 10 larvae × 3.0 = 1200 A offspring
  AB: 320 fruits × (5A×2.2 + 5B×2.8) = 320×(11 + 14) = 320×25 = 8000 offspring (half A, half B? No - wait)
  Actually: A offspring: 320 fruits × 5 larvae × 2.2 = 3520
  B offspring: 320 × 5 × 2.8 = 4480
  BB: 640 × 10 × 2.0 = 12,800 B offspring

  Total A: 1200 (AA) + 3520 (AB) = 4720
  Total B: 4480 (AB) + 12,800 (BB) = 17280
  Total offspring: 4720 + 17280 = 22000
  p' = 4720/22000 ≈ 0.2145 → rounds to 0.215 as stated

  Qualitative claims hold: in AB fruits, B outproduces A (2.8>2.2) but A increases overall.

  Hamilton's rule check for A in AB fruit:
  Relatedness r to siblings? Full siblings, r=0.5
  Benefit b to siblings: if one A larva adds 1.6 to total, shared by 10 larvae, so each sib gets 0.16
  Cost c: 0.6
  Hamilton: rb - c > 0? (0.5×0.16) - 0.6 = 0.08 - 0.6 = -0.52 <0 → not satisfied, yet A spreads. Important tension!

  Now for the question design. The real difficulty lies in distinguishing conceptual frameworks when they yield identical quantitative predictions. Fluent students might correctly apply both two-level selection and gene-centered views but miss that their equivalence depends crucially on the group inheritance mechanism.

  For the exam question itself:
  Part (a) should have students derive the numbers but provide p'≈0.215 as safety net. Mark allocation: 8 marks for calculations and identifying both disadvantage and advantage.

  Part (b) presents two interpretations: group selection vs gene selection with assortment. Needs 8 marks for analyzing whether they conflict and their commitments.

  Part (c) is the crux (9 marks): whether the disagreement is merely verbal, requiring a modified scenario where group reproduction changes. Must specify that acceptable modifications alter inheritance structure, not just payoffs.

  Model answer must explicitly do the math, explain why Hamilton's rule fails here (due to whole-group effects), and describe a case where groups reproduce differentially.

  Marking scheme needs must-hit moves like:
  - Correct fruit composition derivation (3 marks)
  - Within-fruit disadvantage proof (2 marks)
  - Recognizing group reproduction isn't occurring (3 marks)
  - Etc., summing to 25

  Discrimination points: First-class answers note that the two frameworks diverge when group fitness isn't reducible to individual components, or when group-level heredity exists. The seductive error is claiming "same numbers, same reality" without seeing the counterfactual dependence.

  Time allocation: 55 minutes is tight but possible if students are well-prepared. Might be borderline for slow writers. I wouldn't cut anything - it's appropriately challenging for upper-level students.

  The user's constraints are clear: no named authors, pure conceptual focus. Every element must serve the pedagogical goal of testing deep understanding beyond textbook positions.
answer: |-
  ### 1. Diagnosis of Difficulty (199 words)  
  The core difficulty lies in distinguishing *conceptual interpretations* of evolutionary change when quantitative methods (two-level partition, Hamilton's rule) yield identical predictions. Fluent students may correctly apply both frameworks to the data, showing A increases due to group productivity differences outweighing individual disadvantages. Yet this is incomplete: the dispute is not about the *arithmetic* but about whether "group selection" requires groups to be *heritable units with parent-offspring lineages*. A strong answer might wrongly conclude the debate is "merely verbal" because both readings describe the same frequency change. However, the disagreement is substantive: the "group selection" view implicitly assumes groups are Darwinian individuals (reproducing differentially), while the "gene-level" view treats groups as transient structures affecting individual fitness through assortment. Crucially, in this scenario, groups (fruits) do not reproduce; only individuals do. A student missing this may conflate mathematical equivalence with ontological equivalence, failing to see that the frameworks diverge when group reproduction (not just structure) exists.

  ---

  ### 2. Examination Question (Total: 25 marks; Budget: 55 minutes)  

  **Scenario**  
  Seed beetles lay eggs in fallen fruit. Each fruit contains ten larvae from one mother. At a diploid locus (alleles A, B), larvae with A create a shared tunnel: each A larva adds +1.6 to total larvae surviving from the fruit (shared equally among all ten larvae) but pays a private cost of -0.6. Baseline survival is 2.0 per larva.  
  - AA mother: ten A larvae.  
  - AB mother: five A, five B larvae.  
  - BB mother: ten B larvae.  
  In generation 0, A frequency is 0.20 among 1,000 females, yielding 40 AA fruits, 320 AB fruits, and 640 BB fruits. Adult outputs:  
  - AA fruit: 3.0 per larva (all A).  
  - AB fruit: 2.2 per A larva, 2.8 per B larva.  
  - BB fruit: 2.0 per larva (all B).  
  Total offspring: 4,720 A and 17,280 B. Thus, A frequency in offspring is ≈0.215.  

  **(a)** Derive the number of AA, AB, and BB fruits in generation 0. Calculate total A and B offspring, confirming that A is disfavoured within AB fruits but increases overall. State the disadvantage magnitude within AB fruits and the net frequency change. (8 marks)  

  **(b)** Student X argues this is group selection: fruits with more A outproduce others, outweighing A’s disadvantage in mixed fruits. Student Y argues nothing occurs at the fruit level; A spreads because larvae share fruits with full siblings (r=0.5), so gene-level selection with kin assortment explains the change. Do these claims conflict? What must each student deny about the other’s position? (8 marks)  

  **(c)** Both the two-level partition (group/individual fitness) and Hamilton’s rule (rb > c) describe the same data algebraically. Does this imply their disagreement in (b) is merely verbal? Defend your answer. Describe a modification to the beetle system—**not altering payoffs**—where the two readings would *not* describe the same change, explaining why. (9 marks)  

  ---

  ### 3. Model Answer (≈1,000 words)  

  **(a) Derivation and confirmation**  
  Initial A frequency \(p = 0.20\), population size 1,000 females. Assuming Hardy-Weinberg:  
  - AA mothers: \(p^2 \times 1000 = (0.20)^2 \times 1000 = 40\)  
  - AB mothers: \(2pq \times 1000 = 2 \times 0.20 \times 0.80 \times 1000 = 320\)  
  - BB mothers: \(q^2 \times 1000 = (0.80)^2 \times 1000 = 640\)  

  Per-fruit outputs:  
  - AA fruit: 10 larvae × 3.0 = 30 adults (all A). Total A: \(40 \times 30 = 1200\)  
  - AB fruit: A larvae: \(5 \times 2.2 = 11\) adults; B larvae: \(5 \times 2.8 = 14\) adults. Total per AB fruit: 25 adults.  
    - A: \(320 \times 11 = 3,520\)  
    - B: \(320 \times 14 = 4,480\)  
  - BB fruit: 10 larvae × 2.0 = 20 adults (all B). Total B: \(640 \times 20 = 12,800\)  

  Total A offspring: \(1200 + 3520 = 4,720\)  
  Total B offspring: \(4480 + 12800 = 17,280\)  
  Total offspring: \(4720 + 17280 = 22,000\)  
  A frequency: \(4720 / 22000 ≈ 0.215\) (increase from 0.20).  

  Within AB fruits, A output (2.2) < B output (2.8); disadvantage = 0.6 per larva. Yet A increases overall.  

  **(b) Conflict analysis**  
  The claims conflict ontologically but not empirically. Student X (group selection) must deny that groups need to reproduce; they treat group productivity as causal. Student Y (gene-level) must deny groups are units; they reduce the change to individual fitness differences with kin assortment (r=0.5). X is committed to groups having "fitness" (e.g., AA fruits outproduce BB: 30 > 20 adults), while Y is committed to indirect fitness effects (A larvae benefit siblings).  

  **(c) Substantive disagreement?**  
  No, the algebraic equivalence does *not* make the disagreement merely verbal. Hamilton’s rule and two-level partitions are both accounting tools; their agreement here stems from the same fitness distributions. The dispute is about causal hierarchy: is group productivity a fundamental level?  

  **Modification for divergence**: Suppose fruits *reproduce as units*. For example: fruits with ≥8 A larvae "bud" a new fruit in situ, inheriting parental genotype. Now, group fitness (fruit reproductive success) exists independently. If AA fruits produce more offspring fruits than BB (due to tunneling), but A *still* has a within-fruit disadvantage, the two-level partition might show group selection favoring A, while Hamilton’s rule (applied to individuals) might not hold if assortment changes. Here, group reproduction creates a heritable group lineage, making "group selection" irreducible to kin selection.  

  **Hamilton’s rule in original**: For an A larva in AB fruit:  
  - Benefit to siblings: Each A adds 1.6 to fruit total, shared by 10 larvae → +0.16 per sib.  
  - Cost to self: -0.6.  
  - Relatedness: Full siblings, \(r = 0.5\).  
  Hamilton: \(rb - c = (0.5 \times 0.16) - 0.6 = 0.08 - 0.6 = -0.52 < 0\). Rule not satisfied, yet A spreads—highlighting that whole-group effects (AA fruits) drive the increase, not individual altruism.  

  **For one reading to be uniquely correct**: If groups reproduce and group traits are heritable (e.g., fruit "offspring" inherit A frequency), group selection is necessary. If groups are ephemeral (as here), kin selection suffices.  

  ---

  ### 4. Marking Scheme (25 marks total)  
  **Must-hit moves**:  
  1. **(3 marks)** Correct fruit counts: 40 AA, 320 AB, 640 BB. *Common botch: Misapplies HW equilibrium.*  
  2. **(3 marks)** Correct offspring: 4,720 A, 17,280 B. *Botch: Fails to scale per-fruit outputs (e.g., multiplies larvae not adults).*  
  3. **(2 marks)** Identifies within-fruit disadvantage (A:2.2 < B:2.8 in AB). *Botch: Only states frequency change.*  
  4. **(2 marks)** Confirms A increases (p=0.20 → p≈0.215). *Botch: Arithmetic error, ignores given p′.*  
  5. **(3 marks)** In (b), recognizes X commits to group fitness, Y to kin assortment. *Botch: Says they "agree" or describes positions superficially.*  
  6. **(3 marks)** In (b), states conflict is ontological (causal levels) not empirical. *Botch: Calls it "semantic" without justification.*  
  7. **(5 marks)** In (c), modifies system to include group reproduction (e.g., fruit budding) and explains hereditary group traits. *Botch: Changes payoffs or misses heritability.*  
  8. **(4 marks)** In (c), argues equivalence is contingent (depends on no group reproduction) and defends non-verbal disagreement. *Botch: Concludes dispute is "just words" because math matches.*  

  ---

  ### 5. Discrimination  
  **First-class answers**:  
  - Note that two-level selection requires group *heritability* for groups to be units, not just differential survival.  
  - Observe Hamilton’s rule "fails" here because benefits are not directed—whole-group effects overwhelm individual costs.  
  - Explain that gene-level selection *with fixed assortment* mathematically mimics group selection, but the mechanisms differ counterfactually (e.g., if groups dispersed randomly, A would decline).  

  **Seductive wrong answer**:  
  *"The two-level partition and Hamilton’s rule are both valid descriptions of the same evolutionary change; therefore, group selection and kin selection are interchangeable frameworks. The disagreement is merely about labels, not reality."*  
  **Failure point**: This ignores that kin selection assumes fitness effects are mediated by related individuals, while group selection (properly) requires groups to be units of reproduction. In modifications with group heredity (e.g., fruit budding), only group selection explains the change if group fitness correlates imperfectly with individual fitness.  

  ---

  ### 6. Time Note  
  55 minutes is realistic but tight. Students need 15 min for (a) (calculations), 15 min for (b) (conceptual comparison), and 25 min for (c) (defense and modification). Competent students may rush (c). If cutting, simplify (a) by providing fruit counts upfront (saving 5 min), but retain offspring derivation. Do not cut (c)—it is the crux.
