  Okay, this user is presenting a fascinating puzzle about everyday coordination that seems to hover between individual actions and proper joint action. They've clearly engaged deeply with philosophical literature (Bratman/Gilbert/Searle references) but want practical conceptual clarity, not academic citations. 

  Hmm, their frustration is palpable - they recognize the interlocking dependencies in recycling/path-clearing cases but can't find a philosophical label that fits. The anonymity aspect is crucial: no mutual obligations, no shared identity, yet the actions are clearly responsive. 

  First I need to brainstorm candidate concepts before rejecting them:
  - Bratman's shared cooperative activity? Too demanding - requires commitments and subplans.
  - Gilbert's plural subject? Nope, requires joint commitment that would allow for rebukes.
  - Searle's collective intentionality? Overkill - no "we-intentions" here.
  - Team reasoning? Unlikely - nobody's adopting a group utility function.
  - Conventions (Lewis)? Fails the common knowledge requirement.
  - Mutual monitoring? Closer but still implies more awareness than present.

  *scribbles mental notes* The core tension is between the behavioral interdependence and the lack of normative glue. User's "no resentment possible" point is brilliant - that's the litmus test separating this from proper joint action. 

  For minimal cases: if even one person starts adjusting their actions expecting others' contributions (like rinsing jars anticipating paper stackers), that's the threshold. But if coordination becomes reliable enough that someone feels entitled to complain? That flips it into Bratman/Gilbert territory. 

  The path-clearing case with neighbors is trickier than anonymous recycling. Personal familiarity might create tacit understanding, but crucially - still no obligations. If they suddenly stopped clearing, you'd sigh and shovel, not feel betrayed. So same phenomenon, just with thinner anonymity. 

  *adjusts mental model* Should coin a term that captures the adaptive, expectation-based nature without overclaiming. "Coordinated mesh" feels right - emphasizes the interlocking adjustments. "Reciprocal expectation chains" is more precise but clunkier. 

  Final realization: this isn't joint action proper, but the soil it grows from. The moment someone thinks "we're doing this together," it metamorphoses. User's cases show how much social coordination happens in this pre-normative space - which philosophers strangely overlook.
answer: |-
  Here's a conceptual dissection of your phenomenon, honed through the lens of collective intentionality but tempered by social reality. I'll proceed as requested: brainstorm candidates, reject them systematically, propose a definition, and mark its boundaries.

  **Candidate Labels & Rejections:**
  1.  **Bratmanian Shared Cooperative Activity (SCA):** *Rejected.* SCA requires (a) mutual responsiveness, (b) commitment to joint activity, and (c) commitment to mutual support. Your cases lack (b) and (c). No one feels committed to *us* sorting recycling; it's just what *happens* when individuals act. The "commitment" structure is absent. Rebuke is impossible precisely because there's no mutual commitment to uphold.
  2.  **Gilbertian Plural Subject:** *Rejected.* Gilbert requires a joint commitment constituting a "plural subject" with correlative rights/obligations. The essence of your cases is the *absence* of such obligations. You *don't* feel entitled to rebuke the jar-tosser. Gilbertian plural subjects inherently create normative glue; your cases are normatively inert coordination.
  3.  **Searlean We-Intention:** *Rejected.* Searle requires an individual intention of the form "We intend to J" (where J is the joint action). No tenant thinks "We intend to sort the recycling." Their intentions are individual ("I need to dispose of this jar properly," "I'll move the bin so it's ready"). The collective "we" is not present in their intentional state.
  4.  **Team Reasoning:** *Rejected.* Team reasoning involves individuals adopting the group's goal as their own and reasoning about what *they* should do to achieve *it*. Your tenants aren't reasoning from "What should *I* do to achieve *our* recycling goal?" They reason from "What should *I* do given how *others* usually act around here (and my own needs)?" It's individual reasoning informed by expectations, not group-oriented reasoning.
  5.  **Convention (Lewis):** *Rejected.* Lewisian conventions require (a) regularity, (b) preference for conformity conditional on others' conformity, (c) common knowledge of (a) & (b). Your cases likely lack *common knowledge*. You don't know *for sure* others know you know, etc., about the pattern. More crucially, the "preference" is often not *conditional on others' conformity* in a strong normative sense, but simply the *best individual action given the expected behavior*. Rinsing the jar is just sensible to avoid mess, regardless of whether the paper stacker *always* comes (though expectation matters, it's not a condition for *preference*).
  6.  **Emergent Norm / Social Practice:** *Close but Insufficient.* This captures the regularity and the implicit "should" (rinse jars *because* paper gets ruined). However, norms/practices often imply *some* normative force ("you ought to rinse") and potential for *informal* sanction (dirty looks, gossip). Your cases seem even weaker – irritation, not sanction. The key interlocking intentionality ("my action *only makes sense* given yours") isn't fully captured by "norm" alone.

  **The Concept: Reciprocal Expectation Chains (RECs)**

  *   **Definition:** A REC is a stable pattern of interdependent individual actions, coordinated over time, where:
      *   Each agent acts based on *empirically grounded expectations* about the likely actions of others (often anonymous or minimally known).
      *   The *rationale* for each individual's action is *instrumentally dependent* on the expected actions of others (e.g., rinsing only makes sense *if* someone else stacks paper; clearing only half the path makes sense *if* the other clears their half).
      *   There is *no shared goal, joint commitment, or mutual obligation* binding the participants *as a group*.
      *   Coordination arises through *mutual adjustment* based on observed patterns and individual needs, not explicit agreement or shared planning.
      *   *Failure* elicits irritation or inconvenience, but *not resentment or a sense of violated obligation* ("they let *us* down").

  *   **Minimal Case:** Two individuals, unknown to each other, regularly using a shared resource (e.g., refilling a communal water cooler). Each refills it when empty, expecting the other *might* use it later. Their action (refilling) is instrumentally rational only if others are expected to use it (otherwise, why bother?). Seeing an empty cooler triggers the action based on past experience, not commitment to the other user. No rebuke if the other *never* refills – just annoyance and eventual cessation of one's own refilling.

  *   **Disqualifiers:**
      *   **Explicit Agreement/Plan:** If tenants set up a rota or neighbors explicitly say "I'll do this half, you do that," it flips into Bratman/Gilbert territory.
      *   **Emergence of Obligation:** The *first time* someone feels genuinely entitled to complain ("*We* agreed implicitly! You let *us* down!"), it ceases to be a pure REC. This feeling marks the birth of a normative layer.
      *   **Shared Goal Articulation:** If individuals start thinking or saying "We are sorting the recycling together," it signals a shift towards Searle/Team Reasoning.
      *   **Common Knowledge of Coordination:** If it becomes clear that everyone knows everyone else knows they are coordinating (even tacitly), it edges towards convention or stronger collective intentionality.

  *   **Deliberate Fences:**
      *   **Normative Glue:** RECs lack the obligations and entitlements characteristic of plural subjects, SCAs, or even strong social norms. Irritation ≠ sanction.
      *   **Collective Identity/Mode:** Participants act in the "I-mode," driven by individual reasons (which *happen* to depend on others' expected actions), not the "we-mode" (acting *as* part of a group *for* the group).
      *   **Joint Action Core:** RECs are fenced off from the core of Bratman/Gilbert/Searle joint action precisely by the absence of mutual commitment, joint intention, or plural subjecthood.

  **Is it Joint Action?**

  *   **Verdict:** No, RECs are **not joint action** in the core philosophical sense defended by Bratman, Gilbert, or Searle.
  *   **Why? The Decisive Test:** The **Absence of Entitlement to Rebuke**. In true joint action (Bratman: mutual commitment; Gilbert: joint commitment; Searle: collective intention), a participant failing their role *wrongs* the others. They *violate* something owed. In your cases, the jar-tosser is inconsiderate or ignorant, but they haven't violated an obligation *to you* or *to the group*. You wouldn't feel justified saying "You let *us* down!" This lack of normative violation is the smoking gun. Joint action, philosophically, creates a distinctive normative space; RECs operate in the space of individual rationality plus empirical expectation.
  *   **What it is:** RECs are **proto-joint action** or **infrastructural coordination**. They are the fertile ground *from which* joint action (with its norms and commitments) can easily emerge (e.g., if someone *does* finally say "Hey, we need to talk about the recycling..."), but they lack its defining normative structure. They are "joint" only in the behavioral outcome, not in the intentional or normative structure.

  **Anonymous vs. Known Dyad:**

  *   **Concept:** It's the *same phenomenon* (REC), differing primarily in the **richness of the expectation model**.
  *   **Anonymous (Recycling):** Expectations are based on *generalized others* ("people in this building tend to do X") and the *physical environment/system* (bins, truck schedule). Coordination is highly modular; individuals are largely fungible.
  *   **Known Dyad (Path):** Expectations are based on *specific knowledge* of the *other individual* (their habits, tools, schedule - "they have a blower," "they leave early"). This allows for finer-grained, context-sensitive mutual adjustment ("they're away, I'll do the whole path"). The *instrumental dependence* and *lack of obligation* remain identical. Knowing them personally makes the expectations more reliable and nuanced, but doesn't magically create a joint commitment if none was formed.
  *   **Why One Concept?** The core mechanism – *individual action rationally dependent on empirically expected actions of others, without mutual commitment* – is identical. The difference in knowledge source affects the *quality* of the expectation and coordination, not the *fundamental structure*. Saying "we" accidentally or feeling mild camaraderie doesn't flip the switch; only the emergence of normative expectations does.

  **In essence:** You've identified **Reciprocal Expectation Chains (RECs)** – a pervasive, efficient, but normatively minimal form of coordination. It's the social equivalent of stigmergy (insect coordination via environmental modification), scaled up to intentional human agents acting based on learned expectations. It's *not* joint action, but it's the clever, often invisible, infrastructure that makes much of communal life possible before norms or agreements solidify. The moment resentment or "we" appears meaningfully, it's evolving into something else.
