answer: |-
  Right then, let's build this case for your grandson. The counterexample is a **diary sketch**.

  **The Work & Scenario:**
  Mrs. Henderson, a quiet, meticulous woman in her late sixties living in a small coastal town, keeps a private diary. She's no artist. One Tuesday afternoon, she witnessed her notoriously smug neighbour, Mr. Peterson, trip spectacularly over his own garden hose while showing off his new lawnmower. The sight – his arms windmilling, face a picture of startled indignity – sparked a sudden, sharp *glee* in her. That evening, alone at her kitchen table, still privately chuckling, she felt compelled to capture it. Not for anyone, just to pin the feeling down. She sketched it rapidly in the margin of her diary: a few crude, energetic lines capturing the chaotic sprawl, the exaggeratedly wide eyes, the mouth forming a perfect "O" of outrage. She underlined it twice and scribbled "*HA!*". It took less than a minute. She crumpled the page slightly, shoved the diary back in the drawer, and made tea. The feeling? Pure, unadulterated **schadenfreude** – malicious joy at another's minor misfortune.

  **The Receivers & Infection:**

  1.  **The Grandson (Smartass):** Vera shows him the sketch later, reluctantly, while discussing her own work. He glances, snorts, then stares. A grin spreads involuntarily. He *feels* that petty jolt of satisfaction, vividly recalling times he’s felt the same. It’s infectious *precisely* because it bypasses his intellect – the raw, childish glee hits him first. He’s surprised by the strength of his own reaction to such a simple, ugly thing. (*Infection: Strong & Unexpected*)
  2.  **Mr. Peterson (The Subject, Shown Later):** Weeks later, he accidentally sees the sketch when helping Mrs. Henderson find a recipe. His face flushes crimson. He’s humiliated, yes, but crucially, he also *recognises* the feeling depicted – he’s felt it himself about others. It transmits the schadenfreude back *at* him, making him complicit in his own mockery. (*Infection: Unwanted Recognition*)
  3.  **Vera Herself (Observer):** Though morally repelled by the feeling, when she first saw the sketch in Mrs. Henderson's diary (shared in confidence), she couldn't suppress a small, sharp intake of breath – a near-laugh. The immediacy, the sheer *accuracy* of the captured moment and emotion, forced the feeling onto her for a split second before her conscience kicked in. (*Infection: Reluctant & Fleeting*)

  **Tolstoyan Analysis of the Sketch:**

  1.  **Degree of Infectiousness (High):**
      *   *Individuality:* The feeling is intensely specific – not generic misfortune, but *this* particular man's *this* specific undignified moment provoking *this* specific kind of malicious glee. It’s unique to Mrs. Henderson’s perception and experience of that neighbour.
      *   *Clearness:* The sketch is crude but astonishingly effective. The chaotic lines, the wide eyes, the "O" mouth, the underlined "*HA!*" – it transmits the visual trigger *and* the emotional response instantly. No ambiguity about the feeling intended.
      *   *Sincerity:* Overwhelming. Made alone, for no audience, purely to externalise an inner surge of feeling she *had* to express. The crumpled page, the marginal location, the impulsive style – a receiver senses the raw, unvarnished impulse immediately. She absolutely would have drawn it with no one ever seeing it.

  2.  **Content Verdict (Condemned):** Tolstoy judges the transmitted feeling by the "religious perception" (i.e., the highest moral consciousness) of the age. Malicious joy at another's minor pain (schadenfreude) is universally recognised by decent people as base, petty, and unworthy. It stems from envy, spite, or small-mindedness – feelings condemned by any coherent modern morality (Christian love, secular humanism, etc.). It fits squarely in Tolstoy's "bad art" bucket, transmitting a "bad" feeling.

  **The Lock:**
  The **very same property** that makes it maximally infectious – the **raw, unflinching clarity of the petty malicious glee** – is precisely what makes its content condemned. The sketch's power *is* its ugliness, captured with absolute sincerity. The infectiousness relies entirely on the *intensity* and *undiluted nature* of that specific, shameful feeling. Mrs. Henderson didn't soften it with irony, context, or remorse; she nailed the pure, shameful *thrill*.

  **The Collapse Test:**
  Remove the *specific malicious glee* (the schadenfreude). Suppose she sketched the stumble neutrally, or with concern, or even just as a comic pratfall without the "*HA!*" – it becomes a generic, mildly amusing doodle. It loses its individuality (just a fall), its infectiousness plummets (no strong feeling transmitted clearly), and its content slides into Tolstoy's "tolerated" or even "indifferent" bucket. It becomes harmless, forgettable, and non-infectious. It doesn't become propaganda; it becomes negligible.

  **Vera's Countermove:**
  Vera argues: *"But surely, if the religious perception of our age condemns such petty malice – and it does! – how could Mrs. Henderson be truly sincere in transmitting it? Doesn't her own participation in that shared moral consciousness mean she must have felt *some* shame or conflict while drawing it? If she truly absorbed the age's perception, her 'sincerity' was fractured, making the infection weaker!"*

  **Does it Defeat the Case?**
  No, it only relabels it. The grandson's riposte: *"That's the point, Gran! Her *lack* of conflict *in that moment* **is** the terrifying sincerity! She *wasn't* vividly perceiving the religious perception right then; the petty feeling overwhelmed it. That's why the sketch is so shocking and infectious – it captures a moment of moral blindness we're all capable of, delivered with absolute, unconflicted conviction. The theory accounts for the *maker's state*, not society's ideal. Her sincerity was in being wholly consumed by the base feeling, momentarily free of the higher consciousness you cite. That *is* the infection – and why it’s condemned."*

  **Conclusion:**
  The grandson's counterexample holds. The diary sketch scores maximally on infectiousness by Tolstoy's own measures while transmitting a condemned feeling, with the infectiousness inextricably linked to the ugliness of the feeling itself. Vera's countermove highlights a tension within Tolstoy's framework (individual sincerity vs. societal perception) but doesn't defeat the core demonstration. The grandson wins the exchange; Vera burning her poems becomes a more complex, potentially tragic act, not a simple vindication of Tolstoy.
