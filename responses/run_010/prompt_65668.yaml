prompt: |-
  Okay, weird request but I'm deep in a novel and stuck on one scene, and I think you can unstick me.

  My character Vera is a retired schoolteacher in her seventies who spent forty years writing poems nobody read, and at the end of the book she burns them. The only vocabulary she has for explaining why is Tolstoy's from that late book of his about art, the one where he turns on his own novels and takes a swing at Shakespeare. She's absorbed it completely — art as infection, the three conditions on how strong the infection is, and the seperate idea that the feeling being transmitted gets judged by the religious perception of the age. Her grandson is a smartass twenty-six-year-old who's read the same book and has an answer for everything, and in the scene he tells her the whole theory eats itself. I need his counterexample to actually work, because if it doesn't, Vera wins and I write a totally different chapter.

  So: build me the case he'd use.

  Specs, and they all have to hold at once:

  1. The counterexample is one single short work you invent — a poem, a song, a photograph, a quilt, whatever — made by an ordinary non-professional who isn't working for money or for an audience. Nothing about war, patriotism, religion, sex, cruelty, or a deathbed. Tolstoy already has those in hand, and if my smartass reaches for a propaganda anthem he loses the exchange in a single move.

  2. It has to score at or near the maximum on all three of his conditions for degree of infectiousness — the individuality of the feeling, the clearness of the transmission, and the sincerity of the maker — and you have to check them one at a time rather than just assert them. Sincerity especially: show me the maker is impelled by an inner need, that she'd have made it with nobody listening, and that a receiver would sense that.

  3. The feeling it transmits has to land in his worst content bucket — condemned, not merely tolerated. And this is the part I actually care about: the property that makes it maximally infectious has to be the very same property that makes it bad in subject matter. Locked together, not a coincidence. If you soften the feeling enough to clear the content test, the work has to stop being infectious at all and slide into one of his counterfeits. Also, no cheap shots: the feeling has to be one a decent person recognizes in themselves and is a little ashamed of, not one only a monster would have.

  4. Infectiousness is a fact about receivers, so give me the receivers — three of them, differently placed in relation to the maker, and what each one actually undergoes when it lands. At least one has to be infected in a way that takes them by surprise.

  5. Present day, small town, nothing science-fictional, no technology doing any narrative work, nobody famous, and nothing hinging on a coincidence. The scenario plus the work itself should come in around 350 words.

  Then the demonstration. Tell me the verdict on whether it's art at all and where it sits on the degree scale, and tell me the verdict on content and which of his three buckets it goes in and why those two verdicts come out the way they do. Then name the one feature doing all the work. Then remove it and tell me whether the case collapses into the easy propaganda example or into something he'd shrug and tolerate. Then let Vera hit back with her best move — I specifically want to know whether she can use his claim that the religious perception of an age is more or less vividly perceived by everyone in that society to argue that a maker transmitting a feeling contrary to it cant have been fully sincere after all, and whether that move actually defeats the case or just relabels it.

  If you think it can't be built to all of that at once, say so and tell me which spec has to go — that's a real answer and it changes the scene too. And don't give me quotes, chapter numbers, or a reading list; you can't look anything up and neither can I at this hour, so just work from the theory as you know it. British English for the whole answer please, spelling and all — my editor's in London and bits of this are going straight into her margin notes.
