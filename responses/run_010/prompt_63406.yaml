  3. Describe a method over four months, including a worked case study of a decomposed task.
  4. Specify what a positive and negative result would look like.
  5. Note where four months might be insufficient.

  Audience: Philosophers unfamiliar with AI alignment literature. Define all terms.

  Structure:
  - Title
