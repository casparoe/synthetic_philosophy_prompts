  The core request is a numbered menu of precise meanings for "could have done otherwise," analyzed along specific axes: determinism vs predictability, abilities vs opportunities, etc. They also want two special elements: (1) an original Frankfurt-style case (not Jones/Black) to test each meaning, and (2) analysis of why omissions (like bystander inaction) might differ from actions. Finally, they need plain-language examples for readers, with warnings about misleading out-of-context quotes.

  Hmm, this requires careful structuring. I'll need to:
  - Build distinct readings of "could have done otherwise" that match their requested axes of variation.
  - For each reading, assess its status (platitude? defensible? irrelevant to Libet?) and whether Libet's experiments threaten it.
  - Create a new Frankfurt case: maybe a "NeuroGuard" implant that monitors but never intervenes? More original than typical examples.
