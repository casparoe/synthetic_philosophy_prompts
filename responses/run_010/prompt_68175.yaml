prompt: |-
  Twenty times a year, my clinical ethics consultation service is asked the same question, and we have no standing way to answer it. A patient with advanced dementia faces a treatment decision — feeding tube, dialysis, transfer to the ICU, amputation — and there is a signed advance directive, but the patient is presently content: she eats with apparent pleasure, hums, brightens when family visit, and shows no sign of suffering. The family and the attending disagree about whether the document should govern. I need a decision procedure my consultants can actually run, not an essay on why the question is hard.

  The consultants are a social worker, a chaplain, two nurses, and a hospitalist on rotation. None has studied philosophy, none will look anything up, and a typical consult allows forty-five minutes at the bedside plus a same-day write-up that the attending — and, if the family contests, the committee chair — must sign. Do not name authors, cite studies, or recommend further reading; write for someone who will use this standing in a doorway.

  Our board has adopted a distinction I now need made operational. It sorts directive language into three kinds: **authority-bearing** (the writer was exercising decision-making power over a future she anticipated and described), **evidence-bearing** (the writer was reporting what she took herself to want, without claiming to bind anyone later), and **aspiration-bearing** (the writer was voicing a hope or a value she did not expect to be tested). The distinction is meant to do work: only authority-bearing language overrides the present patient's welfare; evidence-bearing language counts alongside everything else we know about her wishes; aspiration-bearing language may be honored only if honoring it costs her nothing she can now register.

  Deliver:

  1. The questions to ask, in order, about the document and about the patient, with what counts in the text or the history as a sufficient answer to each, and how a consultant tells the three categories apart when a single sentence seems to sit in two of them.
  2. The two exits — where the procedure stops at "the directive governs" and where it stops at "it does not" — plus the points that are judgment dressed as procedure and must be handed to the attending or the chair rather than resolved.
  3. The procedure run on both of these. *Case A:* one handwritten paragraph, written six weeks after her husband died, saying she does not want to be kept alive the way her mother was; witnessed and filed, never mentioned again to anyone; she is now six years into dementia. *Case B:* a lawyer-drafted directive with a named surrogate, a detailed paragraph refusing artificial nutrition, and a separate closing sentence about wanting to die at home; she now swallows poorly but brightens at hand-feeding, and the surrogate wants the tube placed.

  In one of the two cases the procedure should reach a result I expect to dislike; say which and why it comes out that way. Close by naming two real situations in which following this procedure will produce a decision you believe is wrong.

  Open with two sentences stating what the procedure can settle and what it cannot, before anything else. Number the steps and keep each to four lines or fewer. Hard limit: 1,100 words total.
reasoning: |-
  Okay, I need to design a practical decision procedure for clinical ethics consultants facing a common dilemma: when an advance directive exists but the current patient with advanced dementia appears content. The user wants a clear, step-by-step guide that can be executed quickly by non-philosophers without research. 

  First, I consider the core challenge: balancing written directives against present welfare. The board's tripartite framework (authority/evidence/aspiration) seems crucial here. I'll need to operationalize these categories with concrete textual markers since consultants won't interpret nuance. 

  For the procedure structure, I land on a sequential approach: start by verifying directive validity, then categorize the language, and finally assess present welfare. Key exits must be placed early where possible - like rejecting invalid directives outright or honoring clear authority-bearing statements. 

  The evidence/aspiration distinction requires special handling. I decide to treat ambiguous language as evidence-bearing by default since authority requires unambiguous intent. Present welfare assessment becomes critical here - if the patient can register costs, aspiration-bearing wishes can't override. 

  Case A is tricky: that handwritten paragraph post-bereavement feels emotionally charged but isn't clearly authoritative. The procedure will likely classify it as evidence-bearing, meaning current contentment could outweigh it. Case B's lawyer-drafted refusal of artificial nutrition seems deliberately authoritative, so even if feeding brings pleasure now, the directive should govern. 

  I anticipate two pain points: when families claim "they'd change their mind now" (can't prove counterfactuals) and when surrogates demand overturning authority-bearing directives (undermines autonomy). These become judgment calls for the attending. 

  For the conclusion, I select two real-world errors this might cause: underestimating covert suffering in dementia (Case A type situations) and over-enforcing directives against present welfare when language isn't truly authoritative. The word count feels tight but workable if I keep steps telegraphic.
answer: |-
  ### Advance Directive Application Procedure  
  This procedure determines whether an advance directive requires specific treatment refusal *despite* the patient’s current contentment. It cannot resolve disputes about medical appropriateness or surrogate validity.  

  #### 1. **Questions & Answers**  
     **Step 1: Is the directive legally valid?**  
     - *Check:* Signed/witnessed per state law? Filed in medical record?  
     - *Stop if invalid:* Document does not govern. Proceed if valid.  

     **Step 2: What category applies to the refusal language?**  
     - *Authority-bearing:* Uses command terms ("I refuse," "Do not provide"), references specific future states ("if I have dementia," "like my mother").  
     - *Evidence-bearing:* Uses descriptive terms ("I would not want," "I believe I’d refuse").  
     - *Aspiration-bearing:* Expresses values ("hope not to burden," "wish to die at home") without refusal verbs.  
     - *Tiebreaker:* If a sentence fits two categories, default to evidence-bearing UNLESS it includes explicit future-binding language (e.g., "direct," "order").  

     **Step 3: Can the patient register burdens?**  
     - *Assess:* Does she show distress/pain during the proposed treatment *or* relief when it pauses? If yes, she registers burdens. If only positive engagement (e.g., smiles when fed), she does not.  

  #### 2. **Exits & Judgment Points**  
     - **Exit 1 (Directive Governs):**  
       - Authority-bearing language AND the clinical situation matches its described scenario (e.g., "advanced dementia" = current state).  
     - **Exit 2 (Directive Does Not Govern):**  
       - Aspiration-bearing language OR evidence-bearing language where current contentment outweighs documented wishes.  
     - **Judgment Points (Hand to attending/chair):**  
       - Whether the clinical situation "matches" the directive’s scenario (Step 2).  
       - Whether honoring refusal causes suffering the patient *can* register (Step 3).  

  ---  
  **Procedure Applied**  
  *Case A:* Handwritten paragraph refusing care "like my mother."  
  - Step 1: Valid (witnessed/filed).  
  - Step 2: **Evidence-bearing** ("I do not want" describes a preference; no binding language).  
  - Step 3: No burdens registered (content; eats pleasurably).  
  - **Exit 2:** Directive does not govern. Tube/ICU may be provided.  

  *Case B:* Lawyer-drafted directive refusing artificial nutrition.  
  - Step 1: Valid (lawyer-drafted, surrogate named).  
  - Step 2: **Authority-bearing** ("I refuse artificial nutrition" is a command; specificity shows intent).  
  - Step 3: Judgment point → Hand to attending: Does hand-feeding pleasure mean *stopping* feeding would register as a burden? If no, directive governs.  
  - **Exit 1:** Directive governs. Tube refused. (Surrogate’s request is overridden.)  

  ---  
  **Expected Disliked Outcome: Case A**  
  It exits at "directive does not govern" despite the patient’s clear historical fear. Why? The language is merely evidence-bearing, and her present contentment outweighs past wishes.  

  **Two Real Errors This May Cause:**  
  1. **Withholding antibiotics** for a content, directive-refusing dementia patient with a reversible UTI (welfare ignored due to authority-bearing language).  
  2. **Imposing dialysis** on a serene, minimally conscious patient whose evidence-bearing directive refused it (overweighting present comfort).  

  ---  
