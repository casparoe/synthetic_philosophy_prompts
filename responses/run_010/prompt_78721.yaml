prompt: |-
  I've been following the preregistration/replication-crisis arguments since they blew up, and there's one institutional detail that keeps nagging at me that I don't think I've seen anyone on the usual blogs actually sit down with. Let me describe the practice concretely so we're talking about the same thing. In the Registered Reports format — now used by a bunch of journals in psych, biomed, neuroscience, including some Nature-branded ones — you submit your intro, hypotheses, methods and analysis plan *before you have any data*. Reviewers judge the question and the design, and if it passes you get "in-principle acceptance," you register the approved protocol in a public repository, and then you go run the study. At Stage 2 the reviewers are told explicitly that their decision must not depend on how important, novel or conclusive the results turned out to be; they check that you actually followed the approved protocol, look at anything you flagged as exploratory, and the paper is published regardless of outcome or statistical significance. Deviations have to be cleared with the editor in advance. So basically the entire evaluative weight sits on a document written before the world had a chance to talk back, and the data get demoted to something like a compliance audit.

  Here's the part that bugs me. The same fields, and often the same funders, run high-risk/high-reward programs that tell applicants to propose things likely to fail, and the prestige system hands out its biggest prizes for overturning a framework. Meanwhile I read Kuhn in college and mostly wrote him off as someone who made "paradigm" do way too much work — but this setup makes his story look weirdly load-bearing again. If a Stage 1 protocol can only be written by someone who already knows what counts as a testable prediction in the field, doesn't the format presuppose that the framework is fixed, shared, and stable enough that the community can agree in advance on what would count as confirming or disconfirming an effect? It seems to presuppose that the interesting failures are failures of execution and inference — p-hacking, HARKing, selective reporting, underpowered designs — rather than failures of the concepts themselves. And then there's this puzzle I can't resolve: preregistration is supposed to be manufacturing clean, documented, unspinnable failed predictions at industrial scale, which by Kuhn's account is exactly the fuel that's supposed to accumulate into a crisis. But nothing happens. The nulls get filed, everyone shrugs, the field keeps going, and nobody converts. My best guess is that a null result isn't an anomaly at all, because a directional hypothesis was never a guarantee the paradigm issued — the theory licensed a bet, not a promise — but if that's right then I'm not sure preregistration could ever produce a Kuhnian anomaly, and I don't know whether that's a feature or a sign the whole enterprise is quietly defining framework-level error out of existence.

  So: what theory of scientific change and what theory of evidence does this practice actually presuppose? Please reconstruct the implicit view rather than just listing philosophers — what has to be true about the relation between theory and observation for a frozen analysis plan to be the locus of all the epistemic work? Then sort out for me which parts the practice strictly requires versus which it just happens to fit comfortably with, because I suspect "the framework is stable" and "the framework is correct" are doing very different jobs here and I keep conflating them. Is the internal split coherent — Stage 1 gating on importance and novelty, Stage 2 formally blind to novelty and conclusiveness — or is the format holding two incompatible pictures of what makes research worth publishing? And finally, tell me what would have to change in the machinery if incommensurability were real: can you even write a Stage 1 protocol from inside a rival framework, given that you'd have to state your hypotheses in the vocabulary of the community that's going to review it? If the answer is no, is that a defect of the format or just proof that it's a normal-science instrument that was never meant to do anything else? No need for references or a reading list, I just want the argument worked through.
reasoning: |-
  Okay, the user is diving deep into the philosophy behind Registered Reports (RR) and how it relates to scientific paradigms. They mention Kuhn and the replication crisis, pointing out a tension: RR relies on stable frameworks for Stage 1 approval, but high-risk research and paradigm shifts thrive on instability. The user is confused why null results from RR don't trigger crises and wonders about the implicit theories of science in RR.

  First, I need to unpack the epistemic assumptions of RR. The user is right that RR treats the theoretical framework as fixed during Stage 1. Reviewers assess the methods based on current standards, assuming that the concepts and operationalizations are valid. This suggests a Popperian falsificationist view where clean tests can confirm or reject hypotheses within a stable paradigm. But Kuhn would argue that anomalies require interpretation within a paradigm, and null results might just be dismissed as failed experiments, not challenges to the theory.

  Then there's the puzzle: why don't RR's null results cause crises? The user hints that directional hypotheses might not be strict predictions but probabilistic bets. In normal science, theories don't guarantee outcomes; they suggest likelihoods. So a null result isn't an anomaly—it's just a non-confirmation, easily absorbed by the paradigm. This aligns with Lakatos' idea of protective belts where auxiliary hypotheses absorb hits. RR's nulls are expected and don't threaten the core theory.

  The institutional split between Stage 1 and Stage 2 is another point. Stage 1 evaluates importance and novelty, which are paradigm-dependent. Stage 2 ignores results' novelty, focusing on compliance. This seems contradictory, but it makes sense if RR is designed for normal science. Importance is judged upfront within the current framework, while Stage 2 ensures methodological rigor regardless of outcome. The format isn't meant for revolutionary science, hence the tension with high-risk programs.

  Regarding incommensurability, if frameworks are incommensurable, a rival theory couldn't pass Stage 1 review. The hypotheses would need to be in the dominant paradigm's language, making it impossible to propose truly alternative tests. RR assumes shared standards, so it's ill-equipped for paradigm shifts. This isn't a flaw but a design feature for normal science.

  The user might be concerned that RR reinforces current paradigms, potentially stifling innovation. They might want to know if there's a way to accommodate high-risk ideas within such systems. But RR's strength is in validating existing frameworks, not challenging them. The solution isn't to force RR into revolutionary science but to recognize its role and complement it with other approaches for innovative research.
answer: |-
  Here's a reconstruction of the implicit philosophy of science within Registered Reports (RR), addressing your core tensions:

  **The Implicit Theory of Scientific Change & Evidence:**

  1.  **Normal Science as the Default & Target:** RR fundamentally presupposes a state of **mature, stable "normal science" (Kuhnian)**.
  2.  **Stable Conceptual Framework:** It assumes the field possesses a **shared, stable conceptual framework**.
      *   Core constructs are well-defined and operationalizable.
      *   Valid measurement tools and experimental paradigms exist.
      *   Causal relationships are hypothesized within known boundary conditions.
      *   *Why this is required:* Stage 1 reviewers *must* agree on what constitutes a valid test, meaningful hypothesis, and appropriate analysis *before* seeing data. This requires shared understanding of concepts, methods, and what counts as evidence.
  3.  **Popperian Falsification (Operationalized):** RR adopts a **strictly operationalized Popperian falsificationism** *within* this stable framework.
      *   Hypotheses are clear, directional predictions derived deductively from theory.
      *   The analysis plan defines *precisely* how data will be used to test these predictions.
      *   A well-conducted test yielding a null result *should* count as evidence *against* the specific hypothesis tested (though not necessarily the broader theory immediately).
      *   *Why this is required:* The core logic of RR relies on the pre-data protocol defining a clean, unbiased test. The "compliance audit" at Stage 2 ensures the test was executed as planned, making the result interpretable as confirmatory evidence for or against the hypothesis.
  4.  **Error as Primarily Methodological:** The primary threat to knowledge is seen as **methodological bias and researcher degrees of freedom** (p-hacking, HARKing, low power, selective reporting), not fundamental flaws in the *concepts* or *framework* themselves. RR is explicitly designed to combat *these* errors by freezing the design and analysis.
  5.  **Evidence as Process-Compliant Outcome:** Within RR, the **epistemic weight of the final result depends entirely on the rigor and fidelity of the *process*** defined in Stage 1 and verified in Stage 2. The observed data itself, *in isolation*, is not the primary evidence; it's the outcome of the *pre-specified, unbiased process* applied to the data that constitutes evidence.
  6.  **Distinguishing "Stable" from "Correct":**
      *   **Strictly Required:** RR *only* requires **framework stability and shared operationalization**. Reviewers must agree on what the hypothesis *means* and how to *test* it validly *within the current framework*. This is non-negotiable for Stage 1 to function.
      *   **Not Required (But Often Assumed):** RR does *not* strictly require that the framework is **fundamentally correct** or that the hypotheses are *true*. It *can* accommodate falsification *within* the framework. However, the practice *fits comfortably* with an implicit optimism that the framework is largely adequate for the questions being asked. The focus is on getting clean answers *within* the paradigm.

  **Resolving the Puzzles & Tensions:**

  *   **Why Nulls Don't Trigger Crises (The Kuhn Puzzle):**
      *   **Failed Prediction ≠ Anomaly:** You hit the nail on the head. RR produces *failed predictions*, not necessarily *anomalies* in the Kuhnian sense. An anomaly is a violation of *paradigm-induced expectations*. RR nulls are often *expected* probabilistic outcomes within the paradigm (the theory licenses a bet, not a promise). A single null rarely threatens a core theory supported by other evidence.
      *   **Absorption by the Protective Belt (Lakatos):** Normal science has immense resilience (Lakatos' "protective belt" of auxiliary hypotheses). RR nulls can be readily explained away:
          *   "The operationalization wasn't perfect."
          *   "Boundary conditions weren't fully explored."
          *   "The effect is smaller/more context-dependent than we thought."
          *   "More nuanced theory is needed." (Still within the paradigm)
      *   **Lack of Crisis Fuel:** RR nulls are *documented unspinnable failures*, but they are often *isolated*. A genuine Kuhnian crisis requires a *cluster* of profound, paradigm-challenging anomalies that resist absorption *and* for which a compelling alternative is nascent. RR produces punctures, not the systemic rupture needed for crisis.
      *   **Focus on Execution Failure:** The RR format implicitly directs attention *away* from framework failure when a null occurs. The clean process *validates* the null as a real outcome, but the immediate interpretation often defaults to "the specific hypothesis/operationalization under these conditions failed" rather than "the core concept/theory is flawed."

  *   **The Institutional Split (Importance/Novelty vs. Results-Blindness):**
      *   **Coherent within Normal Science:** This split is not inherently incoherent. It reflects the *division of labor* in evaluating normal science:
          1.  **Stage 1 (Conceptual/Design Merit):** Is this question *important* and *novel* within the current paradigm? Does the design offer a *potentially informative test* (regardless of outcome)? This is about allocating resources (journal space, reviewer effort) to worthwhile *inquiries*.
          2.  **Stage 2 (Methodological Integrity):** Was the *promised test* executed faithfully? This ensures the *integrity of the evidence* generated by the inquiry approved in Stage 1.
      *   **What Makes Research Worth Publishing:** Stage 1 ensures the *inquiry* is worthwhile (important, novel question + sound design). Stage 2 ensures the *evidence* generated by that inquiry is trustworthy. Publishing the result, regardless of outcome, fulfills the commitment made at Stage 1 to share the *findings* of that worthwhile inquiry honestly. The value lies in the reliable information added to the communal knowledge base *within the paradigm*.

  **Incommensurability and Rival Frameworks:**

  1.  **The Challenge:** Kuhnian incommensurability posits fundamental differences in concepts, problems, standards, and worldviews between paradigms. Proponents of a rival framework literally "see the world differently."
  2.  **Can You Write a Stage 1 Protocol?** **Effectively, No.** This is the core problem:
      *   **Vocabulary:** Your hypotheses must be stated in terms the *reviewing community* (embedded in the dominant paradigm) understands and accepts as meaningful. Concepts central to your rival framework may be nonsensical, trivial, or misinterpreted by them.
      *   **"Testable Prediction":** What counts as a valid test, appropriate methodology, or convincing evidence is paradigm-dependent. Your proposed methods (crucial for your framework's test) might be deemed invalid, irrelevant, or poorly justified by reviewers operating under the dominant standards.
      *   **"Importance/Novelty":** The significance of your question is judged *within the current paradigm's problem matrix*. Your revolutionary question might seem unimportant, nonsensical, or already "solved" (in a way you reject) by the dominant paradigm.
  3.  **Is this a Defect?** **Not for its intended purpose.** RR is explicitly designed as a **normal science instrument**. Its strength is *stabilizing and improving the rigor of inquiry within a shared framework*. Demanding that it also facilitate revolutionary science is like demanding a precision lathe also function as a forge for casting entirely new metals.
      *   **Proof of Normal-Science Function:** Its inability to handle incommensurable frameworks *confirms* its role in normal science. Revolutionary ideas typically emerge elsewhere – through theoretical work, serendipitous discovery in less constrained exploration, or methodological innovation – and face immense peer-review hurdles regardless of format until they gain traction.
  4.  **What Would Need to Change?** To accommodate genuine incommensurability within something *like* RR would require:
      *   **Radical Openness:** Reviewers capable of suspending their paradigm's assumptions to engage seriously with alien concepts and methods (extremely difficult).
      *   **Different Evaluation Criteria:** Shifting Stage 1 focus from "importance/novelty within current framework" to "coherence, internal logic, and potential fertility of the *new* framework" and "rigor of the proposed test *relative to the new framework's standards*".
      *   **New Review Structures:** Perhaps specialized journals, editors, or reviewer pools explicitly open to/focused on foundational challenges. Stage 2 would still focus on protocol adherence, but adherence to a protocol designed under a *different* set of standards.
      *   **Accepting Higher "Failure" Rates:** Recognizing that exploring radical alternatives has a high prior probability of not yielding "useful" results *within the old paradigm*, but is valuable for potential revolution.

  **Conclusion:**

  Registered Reports presuppose a philosophy of science centered on **stable normal science**. They implicitly require a **shared, operationalizable conceptual framework** and prioritize combating **methodological error** through **pre-specified, unbiased hypothesis testing (operationalized falsificationism)**. The epistemic work rests on the **integrity of the pre-data process**, with the data serving as input to that frozen process.

  This setup is coherent *for its purpose*: improving the reliability of knowledge production *within* a paradigm. The split between Stage 1 (importance/novelty) and Stage 2 (results-blind compliance) reflects separate judgments about the *value of the inquiry* and the *trustworthiness of the evidence* it generates, both operating within the paradigm.

  Its inability to handle Kuhnian incommensurability is not a defect but a confirmation of its nature as a **normal science instrument**. Revolutionary science requires different modes of exploration, evaluation, and communication that are fundamentally at odds with the pre-specification and framework-dependent evaluation inherent to RR. The format defines framework-level error out of its *operational scope*, not out of existence entirely; it leaves the task of challenging frameworks to other, inherently messier and more contentious, aspects of the scientific ecosystem. The accumulation of RR nulls is fuel, but Kuhn's crisis requires a spark – a compelling alternative narrative – that RR cannot generate by design.
