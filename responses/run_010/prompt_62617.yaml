prompt: |-
  I follow a good deal of commentary on markets that people find objectionable — payment for kidneys, commercial surrogacy, surge pricing on water and generators after a hurricane — and I have noticed the same reply being made to the objection that such trades are repugnant, but I do not know whether that reply has a name.

  The reply runs roughly as follows. Someone says the trade degrades what is traded, or that certain things should not be for sale at any price. The defender answers that this is a visceral reaction of a familiar kind, and notes that reactions of this sort once attached to practices now entirely unremarkable: life insurance as speculation on human life, paid blood donation, usury, the purchase of military commissions. Then the defender adds an empirical point. The feeling fades: once the market has operated for a decade or two, people stop finding it repugnant, and younger cohorts report no discomfort at all. The fading is then offered as confirmation that the original reaction was a prejudice rather than a perception of something wrong.

  What troubles me is that the fading is not independent of the market's success. The market's spread is itself what habituates people, resets the expectations the trade originally violated, and changes what the good means to those exchanging it. So the disappearance of the reaction may be produced by the very arrangement the reaction was a protest against. The style of reasoning that would license saying a population's settled approval of an arrangement tells us nothing about the arrangement's merits, because the arrangement shaped the approval, is simply not turned on the settled absence of disapproval.

  Is there an established name or literature for this structure? I am aware of the general idea that preferences are formed by the circumstances they are then cited to justify, and of the charge of dismissing a belief merely because of its origin, but neither seems to fit a case where a causal explanation of a reaction is used to vindicate a practice on the grounds that the reaction has died out. If there is no term, coin one and define it, and say how it differs from those two neighbors. Then tell me where its edges are: which uses of the habituation point are legitimate, and how the structure compares to the mirror-image conservative claim that a durable repugnance is itself evidence of a moral truth.
reasoning: |-
  Okay, the user presents a sophisticated critique of a common market defense strategy. They've observed how defenders of controversial markets dismiss repugnance claims by noting how similar objections faded historically for practices like life insurance or paid blood donation. The user's core concern is the circularity: the market's success itself causes the fading of repugnance, making the absence of objection a product of the very thing being justified.

  Hmm, this reminds me of several philosophical concepts. There's the genetic fallacy - dismissing an argument based on origin rather than merit - but that doesn't quite fit since the defender isn't dismissing the repugnance itself but using its disappearance as evidence. Then there's preference endogeneity - how markets shape the preferences that later justify them - which feels closer but still misses the temporal sequence the user describes.

  What's distinctive here is the two-step move: first diagnosing repugnance as transient prejudice by analogy to historical cases, then using the predicted fading as vindication. The user brilliantly notes this creates a self-fulfilling prophecy where the practice eliminates the evidence (repugnance) that might condemn it. 

  I recall Elster's work on adaptive preferences - like the fox calling grapes sour - but that's individual rather than societal. For the collective dimension, maybe Berger and Luckmann's social construction of reality applies, where repeated practices become "taken for granted." The user's insight about resetting expectations is spot-on here.

  The coinage question is tricky. "Normative hysteresis" captures how moral judgments lag behind institutional changes. "Moral habituation" is simpler but might be confused with mere desensitization. "Institutional gaslighting" is punchy but too polemical. The user seems to want an analytical term, so "institutional habituation vindication" might work despite being clunky.

  On edges: the argument is weakest when ignoring power asymmetries (e.g., hurricane price gouging exploiting desperation) or when the fading results from suppression rather than genuine acceptance. It's stronger for practices where the repugnance stemmed from factual errors (like early life insurance fears). 

  The conservative mirror-claim about durable repugnance revealing moral truth has its own problems - think of historical prejudices that persisted for centuries. Neither persistence nor transience reliably indicates ethical validity, which requires substantive moral reasoning beyond sociological observation.

  The user's framing suggests they've already grasped the core circularity issue deeply. Their unspoken need might be for conceptual tools to counter this rhetorical move in policy debates, or perhaps to understand if economic "normalization" ever legitimately changes moral status. I should emphasize that the burden remains on defenders to show why the repugnance was mistaken originally, not just that it faded.
answer: |-
  This is an exceptionally sharp observation of a recurring argumentative pattern in market ethics debates. You're right that it has distinct features not fully captured by genetic fallacy or preference endogeneity, though it relates to both. The structure you describe—**where the successful operation of a market causes habituation that erodes repugnance, and this erosion is then cited as vindication of the market**—lacks a universally accepted name, but can be precisely defined as:

  ### **Institutional Habituation Vindication (IHV)**
  #### Definition
  A defense of morally contested markets that:
  1.  **Diagnoses** initial repugnance as a transient, culturally contingent "yuck factor" akin to historical objections to now-accepted practices (usury, life insurance, etc.).
  2.  **Predicts** habituation: widespread exposure via market operation will normalize the practice and extinguish repugnance over time.
  3.  **Vindicates** the market by citing the *fulfilled prediction* (the disappearance of repugnance) as evidence that the initial objection lacked substantive merit and was mere prejudice. Crucially, this vindication ignores that **the market's successful operation is the primary *cause* of the habituation used to justify it.**

  ### Key Differences from Neighboring Concepts
  1.  **Genetic Fallacy (Dismissing a claim based solely on its origin):**
      *   **Difference:** IHV doesn't *dismiss* the repugnant reaction *because* of its origin. Instead, it **uses the *causal effect* of the market (habituation) as *evidence* justifying the market**. The origin (initial repugnance) is diagnosed as prejudice, but the *vindication* relies on the *outcome* (habituation caused by the market itself).
      *   **Analogy:** Genetic fallacy rejects an argument because it came from a bad source. IHV says: "This reaction (bad source) will disappear if we implement the practice; its disappearance proves the practice was okay all along (and the source *was* bad)."

  2.  **Preference Endogeneity (Preferences shaped by institutions/choices):**
      *   **Difference:** Preference endogeneity describes the *phenomenon*. IHV is a specific *argumentative strategy* that **exploits this phenomenon normatively**. It leverages the *fact* that markets reshape preferences/norms (endogeneity) to *justify* the market *because* it successfully reshaped preferences/norms. The circularity is weaponized as proof.
      *   **Analogy:** Preference endogeneity notes the engine exists. IHV puts that engine in gear to power its own justification: "See how smoothly the engine runs now? That proves it was well-designed!"

  ### The Edges: When is the Habituation Argument Legitimate (or Illegitimate)?
  The legitimacy of citing habituation depends on the *reason* repugnance faded and the *nature* of the initial objection:

  *   **Potentially Legitimate Uses:**
      *   **Correcting Misinformation:** If repugnance stemmed primarily from factual errors dispelled by the market's operation (e.g., early life insurance fears involved misunderstanding risk pools). The fading reflects better understanding, not habituation *to* an underlying wrong.
      *   **Revealing Unfounded Taboos:** If the repugnance was rooted in arbitrary cultural taboos with no coherent underlying moral principle, and habituation reveals its arbitrariness (e.g., some historical objections to interracial marriage). The fading reveals the objection's emptiness.
      *   **Demonstrating Successful Safeguards:** If repugnance was based on legitimate fears about *potential* harms (exploitation, coercion, degradation), and the market's operation demonstrably implemented effective safeguards preventing those harms *without* fundamentally changing the nature of the good *or* relying on habituation to overlook harms. The fading reflects mitigated risks, not normalization of harm.

  *   **Illegitimate Uses (Classic IHV):**
      *   **When Habituation Blinds to Persistent Harms:** If the market *does* cause the harms initially feared (e.g., exploiting the desperate during disasters, commodifying intimate aspects of personhood in surrogacy/organs, degrading the social meaning of a good like water), but widespread exposure normalizes these harms. Citing fading repugnance here *ignores* the realized harm, mistaking numbness for moral progress. (e.g., "No one objects to $50 bottles of water during hurricanes anymore; therefore, it's fine" ignores the normalization of exploitation).
      *   **When Meaning Fundamentally Shifts:** If the market operation *changes the social meaning* of the good in a way proponents would have originally rejected, but habituation makes the new meaning acceptable. The fading repugnance reflects adaptation to the *new reality*, not proof the *original* objection was wrong. (e.g., If kidneys become primarily seen as spare parts rather than aspects of bodily integrity, the fading repugnance reflects the meaning shift, not a disproof of the original concern about degradation).
      *   **Ignoring Power/Alternatives:** When the market entrenches power imbalances or crowds out non-market alternatives, and habituation reflects resignation or lack of choice, not genuine approval. Fading repugnance reflects diminished agency, not validation.

  ### IHV vs. Conservative Repugnance Arguments
  The conservative argument ("durable repugnance = moral truth") is IHV's mirror image with similar flaws:

  1.  **Moral Epistemology:** Both attempt to derive moral truth from sociological facts (presence/absence of repugnance) rather than substantive ethical reasoning. IHV points to *fading* repugnance as proof of acceptability; the conservative argument points to *persistent* repugnance as proof of wrongness.
  2.  **Vulnerability to Contingency:** Both are vulnerable to cultural/historical contingency. Persistent repugnance can uphold deeply unjust prejudices (e.g., anti-miscegenation laws, homophobia). Fading repugnance can normalize exploitation or degradation.
  3.  **Causal Complexity:** Both oversimplify the causes of repugnance or its absence. Persistence might reflect inertia, power structures, or genuine moral insight. Fading might reflect enlightenment, habituation to harm, or coerced acceptance.
  4.  **Key Difference:** The conservative argument lacks IHV's distinctive *self-fulfilling circularity*. It doesn't claim the *practice itself* causes the repugnance that justifies banning it. It simply observes existing repugnance as evidence. IHV is uniquely problematic because the *implementation of the contested practice* actively *creates the condition* (habituation/absence of repugnance) used to *justify* it. It's a self-validating loop.

  ### Conclusion
  **Institutional Habituation Vindication (IHV)** names the specific, circular defense you identified: using the erosion of repugnance *caused by the market's operation* as evidence vindicating that market. Its illegitimacy lies in mistaking *normalization* (potentially driven by resignation, meaning shifts, or overlooking harms) for *moral validation*. While habituation *can* sometimes reveal unfounded prejudice, IHV is illegitimate when the market causes the harms initially feared or fundamentally degrades the good being traded. It differs from the genetic fallacy by leveraging outcomes, not just origins, and from preference endogeneity by weaponizing that endogeneity normatively. Its conservative counterpart shares the flaw of deriving "ought" from sociological "is," but lacks IHV's self-fulfilling structure. Critiquing IHV requires examining *why* repugnance faded, not just *that* it faded.
