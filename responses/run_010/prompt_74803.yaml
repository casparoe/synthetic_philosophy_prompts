prompt: |-
  I volunteer on Saturdays with a literacy scheme attached to our local primary schools, and last night a two-hour argument with a friend — a statistician who works in a hospital trust, so I had assumed she would settle the matter over the first glass of wine — left me considerably more confused than when I started. The authority piloted two reading interventions last year: Programme A, small-group phonics four sessions a week, and Programme B, weekly paired reading with a trained volunteer. Headteachers chose which one their school ran rather than being assigned it, and the schools with the most struggling readers overwhelmingly chose A, on the reasoning that those children needed the most intensive help. Taking the year as a whole, pupils on A gained an average of 6.8 months of reading age against 4.2 for pupils on B. But when my friend split the year's pupils by their reading level at the start of September, the comparison reversed in both halves: of those who began below their expected level, the 120 on A gained eight months while the 30 on B gained nine, and of those who began at or above it, the 30 on A gained two months while the 120 on B gained three. Her view is that the headline figure is simply an artefact of who ended up on which programme, that B is better for struggling readers and better for confident readers, and that we should therefore recommend B to every school without further ado.

  What complicates things is the authority's own published report, which reached the opposite conclusion using what looks to me like the same method. Its authors also split the data, but they split it by whether a pupil completed at least four-fifths of the scheduled sessions, on the grounds that comparing children who turned up with children who drifted away is not comparing like with like. On that split, A comes out ahead in both halves. My friend dismisses the report in one line: attendance was itself shaped by the programme, since four sessions a week filters out families who cannot manage it, whereas a weekly hour with a volunteer filters almost nobody, so the report has compared A's most committed pupils against B's ordinary ones. When I pressed her for the general rule she is applying, all she would offer is that one may only split on things that were true of a child before the programme began, and I find that unsatisfying — it seems to make the correct recommendation turn on the order in which events happened to unfold rather than on anything about the children themselves, and I cannot see why a distinction drawn in June should be automatically disqualified when the very same distinction, applied to the same pupils, would have been admissible had anyone thought to record it in September.

  In three weeks I have to say something at a public meeting about which programme the authority should fund next year, so I would be grateful for an answer I can actually stand behind. Which split should carry the day and why, is there any legitimate sense in which A is genuinely better for the authority as a whole even though it is worse for every kind of pupil considered separately, and if the two reports can each defend their own arithmetic, what is left of the idea that the data settle anything at all? Please give me exactly five numbered points, each of one or two sentences, written in British English, with no introduction, no preamble and no summary before or after them.
reasoning: |-
  Hmm, the user is a literacy volunteer who's tangled in a statistical argument about two reading programs. They need clear guidance for a public meeting decision. Key conflict: their statistician friend says Program B is better for all pupils when split by baseline ability, while the authority's report favors Program A when split by attendance. 

  First, I must unpack the core methodological dispute. The friend insists splits must use pre-program data (like initial reading level) to avoid selection bias - which makes Program B superior in both subgroups. The authority used post-program attendance data, making Program A look better - but as the friend noted, attendance itself is influenced by Program A's demanding schedule. 

  The user's deeper frustration is about how data interpretation seems arbitrary - why should timing of measurement override actual pupil characteristics? I need to address both the technical rule (pre-treatment covariates) and their philosophical concern about "distinctions in June vs September". 

  For the public meeting, I should: 1) validate that both analyses are mathematically correct but conceptually different, 2) explain why pre-program splits are more reliable for causal claims, 3) dismantle the attendance-split logic (it compares biased samples), 4) clarify that Program A's "overall success" is just compositional artifact, and 5) conclude that data CAN settle things when analysed properly - hence Program B is evidence-based. 

  Crucially, I must avoid academic jargon while preserving statistical rigor. The five-point structure they requested helps force clarity. British phrasing like "state school" and "admissible" will build trust. 

  Their anxiety about "defending" the answer suggests I should end by reinforcing that this isn't mere opinion - it's about avoiding a masked ecological fallacy.
answer: |-
  1.  The split by initial reading level (your friend's approach) is methodologically sounder because it uses a pre-existing characteristic unaffected by the programmes themselves, allowing a fairer comparison of their effectiveness for different groups and revealing that Programme B yielded slightly better gains for both struggling and confident readers.
  2.  The split by attendance (the authority's report) introduces selection bias, as Programme A's demanding schedule (four sessions/week) likely excluded pupils from less committed or organised families *because of the programme*, meaning its "high attenders" group is not comparable to Programme B's largely intact cohort; it therefore compares Programme A's most adherent pupils against Programme B's entire group, inflating A's apparent effectiveness.
  3.  Programme A's higher overall average gain (6.8 vs 4.2 months) is an artefact of selection, not true superiority: schools assigned their most struggling pupils to A, and these pupils (even on B) show larger potential gains, so A's cohort composition (mostly strugglers) artificially boosted its average compared to B's mixed cohort.
  4.  There is no legitimate sense in which Programme A is "genuinely better for the authority as a whole" despite appearing worse for each pupil type; the overall figure is misleading due to the non-random assignment of pupils creating unequal groups before the programmes even began, and the subgroup analysis provides the clearer picture of relative effectiveness.
  5.  Data alone cannot settle the question definitively without careful consideration of the underlying causes of group differences; while both reports' arithmetic is correct, the authority's analysis answers a different (and biased) question about programme adherence under different conditions, whereas your friend's analysis better isolates the programmes' causal impact on pupil outcomes, leading to the recommendation for Programme B.
