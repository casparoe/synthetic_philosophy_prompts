  ### Brainstorming Decision Rules  
  **Rule 1: *Methodological Rigor Above All* (Best Fit)**  
  - Prioritizes controlled conditions, replicability, and chain-of-custody integrity.  
  - *Verdicts Explained:* Rejects cases with procedural flaws (1, 2, 6), accepts statistically anomalous data only under strict protocols (4), withholds judgment where methodology is sound but interpretation ambiguous (5, 7).  
  - *1897 File:* Proxy sittings rejected due to transcript tampering (invalidates documentation). Physical phenomena dismissed for lack of controls.  

  **Rule 2: *Statistical Anomaly as Threshold* (Strong Contender)**  
  - Focuses on quantitative deviation from chance, provided minimal controls exist. Social/testimonial factors secondary.  
  - *Verdicts Explained:* Accepts Census (4) and Piper (5) for statistical weight; rejects frauds where anomaly absent (1, 3). Ignores witness credibility in Blavatsky case (3).  
  - *1897 File:* Proxy hits (19/44) accepted as statistically significant. Physical phenomena ignored as ancillary.  

  **Rule 3: *Anti-Survivalist Filter* (Misdescription)**  
  - Artificially discounts evidence for survival, emphasizing telepathy as default explanation. Overfits verdict 7.  
  - *Verdicts Explained:* Rejects Blavatsky (3) and Palladino (6) as survival claims; downplays Census death-coincidences (4).  
  - *1897 File:* Proxy hits attributed to telepathy (despite "no living mind" argument). Physical phenomena rejected.  

  **Rule 4: *Witness-Dependent Credibility* (Weak Fit)**  
  - Values consistency of respectable observers, but defers to methodological failures.  
  - *Verdicts Explained:* Rejects witnesses when controls prove inadequate (1, 2, 6); accepts Census due to scale (4).  
  - *1897 File:* Ambivalent—proxy hits credible via procedure, but transcriber bias undermines trust.  

  ---

  ### Sharpest Divergence  
  **Rules 1 vs. 2** diverge on the *transcript tampering*.  
  - **Rule 1** sees this as fatal contamination: documentation integrity is paramount (cf. verdict 2’s focus on recording errors).  
  - **Rule 2** quarantines the issue: the 19 hits stand if the *data* (not wording) was preserved.  

  ---

  ### Predicted Verdict  
  **Proxy Sittings:** **Inconclusive, leaning skeptical.**  
  - Sidgwick would note the 19 hits as statistically suggestive but reject them due to the assistant’s "tidying." Verdict 2 (slate-writing) shows his hypersensitivity to documentation flaws; verdict 1 (sisters) confirms his scorched-earth response to compromised cases. Rule 1 prevails.  

  **Physical Phenomena:** **Dismissed.**  
  - Hands not proven free, no controls (cf. verdict 6 on Palladino). The single observer’s uncertainty echoes verdict 2’s critique of séance testimony.  

  **Whole File:** **Rejected.**  
  - Tampering invalidates the proxy sittings; physical phenomena add nothing. Sidgwick’s patience with Piper (verdict 5) derived from pristine records. Rule 2’s statistical tolerance loses to Rule 1’s procedural absolutism here.  

  **Why Rule 1 Over Rule 2?**  
  Verdict 2 is decisive: Sidgwick generalized from *one* exposure of flawed testimony to condemn *all* séance evidence. He treated documentation as foundational—not ancillary.  

  ---

  ### Handling Transcript Tampering  
  **Quarantine vs. Contamination:** **Contamination.**  
  - Sidgwick would discard the *entire* proxy dataset (cf. verdict 1’s reversal). The assistant’s role parallels the slate-writing sitters: mediation introduces unreliability (verdict 2). This aligns with Rule 1, revealing his view that custodial flaws corrupt the evidence chain irreparably.  

  ---

  ### Decisive Alternate File  
  **Identical to 1897 file but with untampered, witnessed transcripts.**  
  - **Rule 1:** Accepts proxy hits (controls intact, anomaly unexplained). Physical phenomena still rejected.  
  - **Rule 2:** Unchanged—accepts hits, rejects physical.  
  - *Settlement:* Rule 1 now accepts the core anomaly; Rule 2’s statistical focus adds nothing new. Sidgwick’s acceptance would confirm Rule 1’s emphasis on documentation over statistics alone.  

  ---

  ### What Would Change My Mind  
  **Flip Consideration:** Proof Sidgwick ever accepted *statistically significant results* despite *minor custodial flaws*.  
  - **Verdict Most Vulnerable to Reinterpretation:** **Verdict 5 (Piper).** If archives showed Sidgwick overlooking ambiguities in Piper’s records (e.g., unverified sitter notes), Rule 2 gains strength. The "years of withheld judgment" implies meticulousness, but a laxity here would weaken Rule 1.  

  **Where Reasoning Fails:** Underestimating Sidgwick’s pragmatism. Verdict 4 (Census) relied on self-reported data—hardly foolproof. If he tolerated noise for scale, Rule 2 might override transcript issues in the 1897 file.  

  ---

  ### Final Note  
  Sidgwick’s legacy is that of a moral philosopher turned evidence-scrutineer, whose despair over survival made him *more*—not less—rigorous. Your file, with its statistical tease and archival rot, would deepen his melancholy but not sway his method. He’d likely file it beside the sisters: a lesson in the fragility of truth.  

