  ### Prediction of the Ruling
  Based on your Student Council's precedents, I predict that the council will **refuse the vote** to the girl who has accepted a place for next September. She will not be allowed to vote now, despite being bound by your decisions for her entire seven-year tenure starting next year.

  ### Principles Fitting Your Record Equally Well
  Your rulings reveal two distinct principles that explain the pattern of enfranchisement and disenfranchisement equally well based on the clerk's distinction between "the people our rules bind" and "the people our decisions affect." Neither principle relies on competence, age, or the duration of effect, as evidenced by the inclusion of eleven-year-olds and the exchange student, and the exclusion of parents and staff.

  1. **Principle of Current Binding (Rules-Bound at Time of Vote)**:
     - This principle holds that the vote is granted to those who are **currently bound by the Student Council's rules** at the time of the vote. "Bound by the rules" means being subject to the council's authority in daily conduct (e.g., adhering to school policies, timetables, or behavioral codes set by the council).
     - **Fits your record**:
       - Year 7+ pupils, including eleven-year-olds, are bound by school rules daily and were enfranchised.
       - The exchange student was enfranchised because she was temporarily bound by the rules during her stay.
       - Year 13s were enfranchised for the sports hall decision because they were still bound by the rules until graduation, even though the decision affected them minimally.
       - The partner college girl was enfranchised for timetable decisions because she was bound by the rules during her classes.
       - Caretaker/catering staff and parents were refused because they are not bound by student rules (staff follow employment policies; parents are external).
     - **Key**: Franchise depends on present subjugation to the council's regulatory authority, not on future effects.

  2. **Principle of Directly Affected Interest (Decisions Affecting Immediate Circumstances)**:
     - This principle holds that the vote is granted to those **directly and personally affected by the specific decision** at hand, in a way that alters their immediate circumstances. "Affected" means experiencing tangible consequences (e.g., changes to daily life, resources, or obligations).
     - **Fits your record**:
       - Year 7+ pupils are affected by most decisions (e.g., daily routines) and were enfranchised.
       - The exchange student was enfranchised because she was affected by rules during her short stay, even if not by long-term decisions.
       - The partner college girl was enfranchised for timetable decisions because they directly affected her schedule and obligations.
       - Year 13s were enfranchised for the sports hall because they had a direct interest in the school's facilities during their remaining time (e.g., planning or legacy), even if they wouldn't use it later.
       - Caretaker/catering staff and parents were refused because, while affected broadly (e.g., by workload or costs), they are not directly impacted in their personal student-like circumstances (staff have professional roles; parents are financiers but not users).
     - **Key**: Franchise depends on the decision's proximate impact on the individual's current role or experience, not on general influence or future binding.

  ### Where the Principles Come Apart on This Case
  The case of the girl accepted for next September creates a conflict between the two principles:
  - **Under Principle of Current Binding (Rules-Bound)**: She should be **refused** because she is not yet enrolled or subject to the council's rules. She will be bound in the future, but at the time of the vote, she has no present obligation (like the refused parents/staff).
  - **Under Principle of Directly Affected Interest**: She should be **granted** the vote because your decisions will affect her entire seven-year experience, creating a strong personal stake. She is analogous to the enfranchised partner college girl (who was affected by timetable decisions) but on a larger scale.

  This divergence highlights the clerk's distinction: the girl is **affected** by future decisions but not currently **bound** by the rules. Your precedents do not clearly prioritize one over the other, making this a pivotal test case.

  ### Recommended Decision for Coherence with Precedents
  I recommend **refusing the vote** to best cohere with your precedents. Here's why:
  - Your council has consistently enfranchised only those with a **present connection** to the school as active participants bound by rules (e.g., current students, even temporarily). The exchange student (enfranchised while present, though leaving soon) and Year 13s (enfranchised while still bound, though leaving soon) show that current binding trumps future effects.
  - Conversely, you have refused non-students like parents and staff, who are affected but lack current student-status binding. Granting the vote to a future student would break this pattern by prioritizing future effects over present status.
  - **Closest Precedent**: The refusal of **parents** is the strongest parallel. Parents are deeply affected (paying fees, bearing costs) but were refused because they are not bound by student rules or integrated into daily student life. Similarly, the girl is affected but not yet bound or present. The refusal of caretaker/catering staff (on-site daily but not students) also supports this, as they share the girl's lack of current student binding.

  ### Further Case to Settle the Principle
  To definitively determine whether your council is committed to **Current Binding** or **Directly Affected Interest**, consider this future test case:
  - **Scenario**: A current Year 11 pupil who has just withdrawn from the school (e.g., due to relocation) but will be affected by a pending decision (e.g., a new policy on alumni access to facilities).
  - **How it settles the principle**:
    - If the council **refuses** the vote, it confirms **Current Binding**. The ex-pupil is affected but not bound by rules anymore, aligning with the refusal of parents/staff and the girl in this case.
    - If the council **grants** the vote, it confirms **Directly Affected Interest**. This would mirror the inclusion of the partner college girl (affected by timetables) and Year 13s (affected by sports hall in their final months), prioritizing impact over binding.
  - **Why it works**: This case isolates the conflict by featuring someone who was recently bound but is no longer, yet remains affected. It directly tests whether "bound" or "affected" drives your franchise, as your ruling would reveal the prioritized principle.

  This approach ensures your council's franchise remains consistent, principled, and predictable, avoiding arbitrary expansions or contradictions. If you uphold Current Binding (as recommended), emphasize that enfranchisement requires present student status; if you shift to Directly Affected Interest, clarify criteria for "direct effect" to prevent overreach.
