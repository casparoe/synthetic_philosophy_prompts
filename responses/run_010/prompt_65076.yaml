prompt: |-
  So I got into an argument with two roommates about price controls this weekend and it ended with me realizing I don't actually have consistent views, which is annoying. Going case by case, here's what I think. After a hurricane, capping the price of bottled water, plywood and generator rentals at pre-storm levels is right, and people who jack those up deserve to be fined. Same with insulin or an epipen — if the government caps what a company can charge for a drug people will die without, that isn't theft, that's the least it can do. Raising the minimum wage to $15 in my city: good, even though I've read the arguments that it costs some jobs at the margin. A living-wage clause for companies that contract with the city: good. Banning ticket brokers from using bots to hoard concert tickets and flip them: good. But an ordinary person who buys one ticket at face value and resells it for three times that on a resale site: totally fine, I have zero complaint about them. Uber surge pricing when it starts pouring and everyone wants a ride: fine. A plumber charging triple his normal rate to pump out a flooded basement during that same storm: not fine. Rent caps protecting an existing tenant whose landlord is trying to squeeze them out in a tight market: sympathetic. Citywide rent control that also applies to new construction: I think bad, and I can't fully articulate why. And farm price floors — the old setup where you guarantee producers a high price, get a surplus, and the government ends up buying or destroying the extra — I think those are just obviously dumb.

  The obvious problem is that a minimum wage is a price floor and I'm for it, farm price floors are price floors and I'm against them, water caps and rent caps are price ceilings and I'm mostly for them, and scalping bans are sort of ceilings and I'm for one version and against the other. I've heard the econ-y moves people make here: elastic versus inelastic demand, monopsony power in a thin local labor market, search-and-matching frictions, the fact that a ceiling doesn't remove the shortage so much as re-ration it through waiting lists and queues and quality and side payments, the way a cap breeds a black market with worse terms for the buyer. I suspect my gut is secretly tracking some of that. What I want is the principle, or the small set of candidate principles, that best fits these verdicts — stated precisely, with each clause tied to the case that motivated it. And I specifically want you to answer this: is the thing that rescues my minimum-wage-versus-farm-support split actually a moral distinction, or is it an empirical claim about elasticity and market power wearing a moral costume? Because if it's the latter, then what I have isn't a view about justice at all, it's a bet on the economics, and it'll flip the moment somebody shows me a local labor market that's competitive. Tell me whether I should be bothered by that or just own it.

  Then run whatever principle you land on against cases I haven't mentioned: a legal cap on how much a hospital can pay a nurse during a staffing shortage; a rent-stabilized apartment that gets allocated by lottery in a city I'm thinking of moving to; a price floor under sex work; a ban on selling kidneys combined with a cap on what a hospital may charge for the transplant itself; capping the resale price of a game console that's impossible to find; a rule that lets a landlord pass through the cost of renovations in the rent. And be honest about which of my verdicts you have to overturn — I'd much rather have a simple principle that forces me to give up the plumber one, or the resale-ticket one, than some baroque thing with six clauses that saves everything and explains nothing. The case I keep going back and forth on is my own apartment, fwiw: my landlord is raising my rent 22% after doing a kitchen remodel I didn't ask for and definately didn't want, and I genuinely can't tell whether that's gouging or just... the market. Please write the whole thing in American English.
reasoning: |-
  Okay, let me tackle this user's dilemma. They're frustrated because their views on price controls seem inconsistent across different scenarios. They support some price ceilings (like post-hurricane caps and insulin price controls) but oppose others (like citywide rent control). Similarly, they back minimum wage as a price floor but reject agricultural price supports. The core question is whether their stance relies on moral principles or economic pragmatism disguised as morality.

  First, I need to identify underlying patterns. The user clearly distinguishes between necessity markets (water, life-saving drugs) and non-essential ones (concert tickets, Uber rides). Their sensitivity to exploitation is heightened when buyers have no alternatives (flooded basements) versus optional purchases (resold tickets). The labor market support seems tied to power imbalances.

  I notice three potential principles emerging: (1) necessity versus luxury distinction, (2) bargaining power asymmetry, and (3) temporal/contextual vulnerability. The nurse wage cap example tests these - it's a necessity service but capping pay during shortages might worsen access. This suggests the vulnerability factor outweighs the necessity aspect.

  For their rent hike dilemma, the remodel pass-through clashes with their tenant-protection instinct. The principle would reject this as exploitation since the user didn't request improvements. But consistency might require accepting market rates if no vulnerability exists - which clearly bothers them. 

  The toughest tradeoff is their ticket resale exception. If an individual reselling at markup is acceptable but bots aren't, the distinction must be about scale/method rather than price. That might require abandoning their "no complaint" stance or reframing the principle to condemn hoarding rather than pricing.

  Ultimately their position leans more toward economic realism than moral absolutism. The elasticity and monopsony arguments they mention do heavy lifting. They should own this - their "gut" is weighing market failures intelligently. When evidence changes (e.g., a tight but competitive labor market), adjusting views isn't hypocrisy but rationality.
answer: |-
  Here's a principle that fits most of your verdicts, grounded in vulnerability and market failure rather than pure morality, stated precisely:

  **Your Implicit Principle:** *Price controls are justified only when (1) buyers face an acute inability to avoid the purchase ("necessity vulnerability"), AND (2) the market mechanism fails to fairly allocate scarce goods/services due to either (a) seller power/opportunism or (b) extreme, temporary disruption preventing normal competition.*

  **How it explains your cases:**

  1.  **Post-Hurricane Price Caps (Water, Plywood, Generators):** YES. (1) Acute necessity vulnerability (survival/security). (2a) Opportunistic sellers exploiting desperation during extreme disruption preventing normal competition.
  2.  **Drug Price Caps (Insulin, EpiPen):** YES. (1) Chronic necessity vulnerability (life/death). (2a) Seller power/opportunism enabled by patents, regulatory capture, and inelastic demand.
  3.  **Minimum Wage ($15):** YES. (1) Necessity vulnerability (workers need income for basic needs). (2a) Seller power (monopsony power in local labor markets - employers hold power over workers).
  4.  **Living-Wage Clause for City Contractors:** YES. Same rationale as minimum wage.
  5.  **Banning Bots for Ticket Hoarding/Resale:** YES. (1) Not pure necessity, but significant desire/commitment vulnerability. (2a) Market failure due to unfair allocation mechanism (bots create artificial scarcity and exploit the system, preventing fair access at the intended price).
  6.  **Ordinary Person Reselling Ticket:** NO CONTROL NEEDED. (1) No acute necessity vulnerability (concert = discretionary). (2) Market functions relatively fairly - individual reseller isn't creating artificial scarcity or wielding power; they're taking a small, voluntary risk for potential profit.
  7.  **Uber Surge Pricing:** NO CONTROL NEEDED. (1) No *acute* necessity vulnerability (ride usually discretionary; alternatives exist, even if inconvenient). (2) Market functions relatively fairly - surge reflects real-time scarcity & encourages driver supply, resolving the shortage quickly. No significant seller power/opportunism inherent in the algorithm.
  8.  **Plumber Charging Triple During Storm:** **OVERTURN YOUR VERDICT / Inconsistent.** By the principle, this should be FINE. (1) Acute necessity vulnerability (flooded basement = urgent need). BUT (2) Why is this different from Uber? It's a similar temporary surge reflecting scarcity & effort. Seller power isn't inherently greater here than with Uber drivers. *Your gut is likely adding "local service provider exploiting neighbor" morality, which the principle excludes.* **Consistency requires accepting surge pricing here.**
  9.  **Rent Caps Protecting Existing Tenant:** YES. (1) Necessity vulnerability (shelter). (2a) Landlord opportunism exploiting tenant's high moving costs/search friction ("hold-up" problem) in a tight market to squeeze them out or extract excessive rent.
  10. **Citywide Rent Control (Incl. New Construction):** NO. (1) Necessity vulnerability exists. BUT (2) Applying it broadly, especially to new supply, creates a *different* market failure: it discourages new construction/maintenance, leading to long-term shortages and misallocation (lotteries, deterioration, black markets). It fails condition (2) by harming the *future* functioning of the market.
  11. **Farm Price Floors (Govt Buys Surplus):** NO. (1) Farmer income vulnerability exists. BUT (2) No inherent *buyer* power/opportunism justifying a *price floor*. The market failure (if any) is different (income volatility, global competition). The policy creates *new* inefficiencies (surplus, wasted resources) without solving the core vulnerability efficiently. It fails condition (2).

  **The Minimum Wage vs. Farm Support Split:** It's **primarily empirical economics wearing a moral costume**, not pure morality. Your support for the minimum wage hinges on the empirical belief that employers *have* monopsony power in many labor markets (Condition 2a), and that the floor mitigates this without causing large unemployment (e.g., due to search frictions, efficiency wages). Your opposition to farm supports hinges on the empirical observation that they create significant *new* inefficiencies (surplus, waste) without effectively solving the core vulnerability or being justified by buyer power (Condition 2 fails). If convincing evidence showed a local labor market was perfectly competitive (no monopsony power), the principle would force you to oppose a minimum wage *there* as inefficient. **You should own this.** Your "gut" is reasonably weighing the *likelihood* of harmful market failures and effective policy remedies in specific contexts. It's a pragmatic view of justice focused on preventing exploitation where markets fail vulnerable participants, not an absolute moral rule about prices.

  **Testing the Principle on New Cases:**

  1.  **Cap on Nurse Pay During Shortage:** **NO.** (1) Necessity vulnerability (patients need care). BUT (2) A *pay cap* worsens the shortage by discouraging supply (nurses working/relocating). It fails condition (2) - the problem is scarcity exacerbated by the cap itself. (A *price cap* on what hospitals charge patients might be argued under the principle, but a *pay cap* is the opposite lever).
  2.  **Rent-Stabilized Apartment Allocated by Lottery:** **YES (but suboptimal).** (1) Necessity vulnerability (shelter). (2a) Allocation via lottery occurs because price *cannot* be the fair mechanism due to extreme scarcity/power imbalance. The stabilization prevents opportunism, though the lottery is a blunt instrument reflecting the underlying shortage. (Citywide control on *new* units would still be bad per principle).
  3.  **Price Floor Under Sex Work:** **NO.** (1) Potential vulnerability exists. BUT (2) No inherent *buyer* power justifying a *floor*. The core vulnerabilities (safety, exploitation, coercion) aren't primarily solved by mandating higher prices and might be worsened (driving it further underground). Fails condition (2).
  4.  **Ban Kidney Sales + Cap Transplant Price:** **PARTIAL FIT.** (1) Extreme necessity vulnerability (life). (2a) Ban on sales: Addresses vulnerability/exploitation risk of desperate sellers; Cap on transplant price: Prevents hospital profiteering on a lifesaving procedure enabled by the ban-induced scarcity. The principle supports the *cap* (vulnerability + preventing opportunism). The *ban* adds a distinct ethical layer (commodification) beyond the price control principle.
  5.  **Cap on Resale Price of Scarce Game Console:** **NO.** (1) No necessity vulnerability (luxury good). (2) While scalpers create friction, it's not a market failure justifying control - it's arbitrage on discretionary spending. Fails condition (1). (Banning bots *to buy* might be argued under preventing unfair allocation mechanisms, like tickets).
  6.  **Landlord Passing Through Renovation Costs:** **UNJUSTIFIED under principle IF used to circumvent existing rent cap protecting tenant.** If there's a justified cap (protecting existing tenant from opportunism - Condition 1 & 2a), allowing full passthrough of *unwanted* renovations undermines it by being a disguised rent increase. It reintroduces the opportunism the cap was meant to prevent. For *new* leases or uncapped markets, it's just pricing the improved product.

  **Your Apartment Dilemma (22% increase after unwanted remodel):**
  By the principle: If your city has **no justified rent control ordinance** (e.g., only protecting against discrimination, not capping increases), this is likely **"just the market."** Your landlord is pricing an improved unit (even if unwanted by you). Your vulnerability (moving costs, search friction) is real, but the principle requires *systemic* market failure (Condition 2a) to justify control, not individual hardship in a functioning market. **However,** if your city *has* rent stabilization specifically to protect existing tenants from such opportunistic increases exploiting their vulnerability, the principle would support the cap *and* likely oppose automatic full passthrough of unwanted renovations as undermining the cap's purpose. Your discomfort stems from correctly perceiving vulnerability, but the principle draws the line at demonstrable, remediable market failure.

  **In Summary:**
  *   **Your core driver:** Preventing exploitation of acute necessity vulnerability caused by market failures (seller power, extreme disruption, unfair allocation).
  *   **It's primarily economic pragmatism:** Based on empirical assessments of vulnerability, market structure, elasticity, and policy effectiveness.
  *   **Key Overturn:** Your plumber verdict - surge pricing for essential services during acute shortages *is* consistent with a functioning (albeit harsh) market resolution under this principle.
  *   **Own the Pragmatism:** Your view *is* a coherent view of economic justice – one that seeks to intervene *only* when markets demonstrably fail vulnerable participants in specific, remediable ways. It's not absolute morality, but a defensible, empirically-grounded approach to policy. Don't be bothered; refine your understanding of the economics underlying each case.
