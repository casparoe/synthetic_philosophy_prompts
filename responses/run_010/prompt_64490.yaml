prompt: |-
  I am drafting a position paper on the metaphysics of the quantum state and want the package audited before I commit to it in print. Here is where I have landed:

  1. Wave-function realism: the quantum state is a concrete physical object, and it — rather than particles or fields in spacetime — is the whole of fundamental reality; the three-dimensional world of detectors, tables, and laboratory notes is derivative.
  2. I am nonetheless drawn to the nomological reading, on which the quantum state plays the role of a law, structuring or generating the lower-level three-dimensional world rather than being another inhabitant of it.
  3. I take the Pusey–Barrett–Rudolph result to have settled that the quantum state cannot be a mere state of knowledge: it must be ontic.
  4. I am an Everettian — no collapse, and the probabilities in the Born rule are self-locating uncertainty about which branch I find myself on.
  5. I regard preparation independence as a substantive physical assumption rather than a harmless idealization, and I am generally sympathetic to retrocausal and superdeterministic escapes from no-go theorems.
  6. In Wigner's-friend cases I want to say that the friend's recorded outcome is a fact about the world simpliciter, not a fact merely relative to the friend.
  7. I am uneasy that positing a high-dimensional configuration space makes my ontology gratuitously profligate, and I would like to be able to insist that I have added nothing beyond standard quantum mechanics.

  Please tell me which of these genuinely pull against each other and which only look as though they do. Order the real tensions by severity rather than treating them as equally bad, and for each say what specifically has to give, what the cheapest revision is, and what that revision costs me elsewhere. Then identify the single change that would clean up the most. I am not looking for a survey of the options: commit to a verdict about which of these I should abandon and argue for it.
reasoning: |-
  Okay, the user is drafting a position paper on the metaphysics of the quantum state and wants an audit of their current package of views. They've listed seven specific commitments, and I need to identify tensions between them, order those tensions by severity, and recommend which view to abandon for the most coherent overall position.

  Looking at their stated positions: They're a wave-function realist (1) but drawn to nomological interpretations (2). They accept PBR as proving the quantum state is ontic (3), are Everettian with self-locating uncertainty (4), skeptical of preparation independence (5), want absolute facts in Wigner's friend cases (6), and are uneasy about the profligacy of high-dimensional configuration space (7).

  The most glaring tension is between wave-function realism (1) and their nomological leanings (2). Wave-function realism treats the wave function as a concrete object in high-dimensional space, while nomological views treat it as law-like. These are fundamentally incompatible ontologies - one makes the wave function part of the furniture of reality, the other makes it a governing principle. Maintaining both would require a hybrid view that typically ends up privileging one over the other.

  The next serious tension is between wave-function realism's high-dimensional ontology (1) and their desire to avoid profligate ontology (7). Wave-function realism is notoriously ontologically extravagant - it posits a vast configuration space as fundamental reality. Their discomfort suggests they might be better served by a spacetime-based ontology like Bohmian mechanics or Everettian approaches that don't reify configuration space.

  Their Everettian commitment (4) actually helps resolve some tensions. In many-worlds, the wave function can be both fundamental and generate the appearance of a 3D world without collapse. However, combining Everett with their desire for absolute facts in Wigner's friend cases (6) is problematic - Everett typically treats facts as relative to branches. They might need to adopt a "many threads" interpretation or accept perspectivalism to maintain absolute facts.

  Their skepticism of preparation independence (5) and openness to retrocausal/superdeterministic escapes is consistent across interpretations, though retrocausality would require abandoning global unitarity. The PBR commitment (3) is largely neutral - it rules out epistemic interpretations but is compatible with most ontic views.

  The single change that would clean up the most tensions would be to abandon wave-function realism (1). This would:
  - Resolve the conflict with nomological leanings (2)
  - Alleviate concerns about ontological profligacy (7)
  - Maintain Everettianism (4) without requiring high-dimensional space as fundamental
  - Allow them to explore spacetime-based interpretations where the 3D world isn't derivative
  - Preserve their other commitments including PBR (3), absolute facts ambition (6), and skepticism of preparation independence (5)

  The cost of abandoning wave-function realism is losing what some see as the most straightforward reading of quantum formalism. But alternatives like decoherent histories or Everettian approaches with primitive ontology can provide equally rigorous foundations without the extravagant ontology. Their unease about profligacy suggests this cost may be worth paying for greater coherence.

  For their position paper, I'll recommend they drop wave-function realism in favor of a non-wave-function-realist Everettian approach, perhaps incorporating elements of nomological thinking through conditional wave functions or effective laws. This maintains their core commitments while resolving the most severe tensions.
answer: |-
  Here's a ruthless audit of your position package, ordered by severity of tension, with the necessary concessions, costs, and the single most effective change:

  ### Ranked Tensions (Most Severe First)
  1.  **Wave-Function Realism (1) vs. Nomological Reading (2) & Ontological Profligacy (7)**
      *   **Conflict:** Wave-function realism (WFR) *demands* a concrete, high-dimensional object as fundamental reality. The nomological view treats the wave function as a *law*, not a concrete object. WFR's high-dimensional space is the *definition* of ontological profligacy you lament in (7). You cannot have the wave function be both the fundamental physical *stuff* (WFR) *and* merely the law structuring lower-level stuff (nomological). (1) and (7) are directly contradictory.
      *   **What Must Give:** Wave-function realism (1).
      *   **Cheapest Revision:** Adopt a **non-WFR Everettian framework** (e.g., "many threads," "decoherent histories" with primitive ontology, or a spacetime-state realist approach). The wave function is fundamental but *not* the literal concrete stuff; it's the dynamical structure governing the behavior of fundamental entities *in spacetime* (e.g., particles, fields, events, or histories).
      *   **Cost:**
          *   You lose the "purest" literal reading of the quantum formalism as representing fundamental reality directly in configuration space.
          *   You must specify *what* the wave function is governing/structuring (e.g., a mass density field, flashes, particles, histories). This adds complexity compared to WFR's stark simplicity.
          *   You sacrifice the direct WFR explanation for why 3D is derivative (it *is* derivative, but now via a different mechanism like decoherence + functional definition within the fundamental spacetime structure).

  2.  **Wave-Function Realism (1) & Everettianism (4) vs. Absolute Facts (6)**
      *   **Conflict:** WFR + Everett posits a vast universal wave function evolving unitarily. "Facts" like measurement outcomes only exist *relative* to branches/decohered components. Insisting the friend's outcome is a "fact simpliciter" (6) contradicts the core relational/relative nature of facts in Everett + WFR. There *is no* single world state where a unique outcome is true absolutely; there's only the branching wave function.
      *   **What Must Give:** Either WFR (1) *or* Absolute Facts (6). (Abandoning Everett (4) is a non-starter given your overall package).
      *   **Cheapest Revision:** **Abandon Absolute Facts (6)**. Embrace **perspectivalism or relationalism about outcomes**. The friend *has* a definite outcome *relative to their branch*, and Wigner (outside) can consistently describe the superposition *relative to his perspective* encompassing the branch. "Fact simpliciter" is an incoherent demand in Everett, even more starkly in WFR.
      *   **Cost:**
          *   Loss of intuitive, classical objectivity about measurement outcomes. Reality becomes fundamentally perspectival.
          *   Significant philosophical work needed to ground "facts for an agent" within the wave function ontology without contradiction.

  3.  **Nomological Reading (2) vs. Ontic PBR Result (3) & Wave-Function Realism (1)**
      *   **Conflict:** The nomological reading (2) naturally leans towards the wave function being *epistemic* or *non-physical* (a law). PBR (3) strongly argues the quantum state is *ontic* (mind-independently real). WFR (1) makes it *concretely* ontic. The tension is between the "law-like" character (suggesting abstraction/non-concreteness) and the "ontic" demand (suggesting concrete existence). While sophisticated nomological views (e.g., Dürr et al.'s nomological Bohmian wave function) are *ontic*, they avoid WFR; the wave function is a law governing concrete stuff *in spacetime*.
      *   **What Must Give:** The *interpretation* of "nomological." You must **distinguish "ontic" from "concrete physical object."** A law can be real (ontic) without being a *thing* like a particle or field. Give up the idea that "nomological" implies *less than fully real* or non-ontic.
      *   **Cheapest Revision:** Adopt an **ontic nomological view** where the wave function is a fundamental, physically real *law* (ontic), but not a concrete *object* inhabiting spacetime or configuration space. This requires abandoning WFR (1) and embracing a primitive ontology *governed by* the wave function law.
      *   **Cost:**
          *   Requires commitment to a fundamental level of concrete reality *in spacetime* (primitive ontology - particles, fields, events) *in addition to* the fundamental law (ψ). This might feel like adding *more* than "just standard QM" (contra 7).
          *   The metaphysics of a "physical law" as a fundamental entity is less intuitive than concrete objects.

  4.  **Skepticism of Preparation Independence (5) vs. PBR (3)**
      *   **Conflict:** PBR's conclusion that the quantum state is ontic relies crucially on Preparation Independence (PI). If PI is not a "harmless idealization" but a "substantive physical assumption" you are willing to reject (5), then PBR's argument *against epistemic views* is significantly undermined. Epistemic models violating PI *can* evade PBR.
      *   **What Must Give:** The **unqualified strength of your PBR commitment (3)**. You must acknowledge that PBR settles the issue *only if* PI holds. Given your skepticism of PI (5), PBR does *not* decisively rule out all epistemic interpretations for you.
      *   **Cheapest Revision:** **Qualify your PBR claim (3)**. State: "PBR convincingly shows that *if* preparation independence holds, then the quantum state must be ontic. However, given my skepticism of PI as a fundamental principle, epistemic interpretations violating PI remain a live (though perhaps unattractive) option that PBR cannot rule out." Your Everettian commitment (4) still strongly favors an ontic state.
      *   **Cost:** Loss of the strongest, simplest argument against epistemic views. You must engage more directly with the viability (or lack thereof) of retrocausal/superdeterministic epistemic models.

  5.  **Everettianism (4) vs. Gratuitous Profligacy (7)**
      *   **Conflict:** Everettianism, *especially* under WFR, posits an immense reality (all branches are equally real). This inherently feels profligate. Your unease (7) is understandable.
      *   **What Must Give:** **The characterization "gratuitous" profligacy.** Within Everett, the "profligacy" is *necessary* to account for unitary evolution without collapse or hidden variables. It's the cost of doing business.
      *   **Cheapest Revision:** **Reframe profligacy as necessary structure.** Argue that the universal wave function (whether concretely in high-D space or governing spacetime entities) is the *minimal* structure required to account for the empirical data *without* adding collapse mechanisms, hidden variables, or violating locality. The "profligacy" is fundamental structure, not superfluous decoration. *This only works if you abandon WFR (1)*; WFR's configuration space *is* gratuitous profligacy compared to alternatives that recover 3D spacetime as fundamental. In a non-WFR Everett view, the "profligate" branching is a consequence of the dynamics acting on fundamental spacetime entities, not an extra ontological layer.
      *   **Cost:** Requires accepting that fundamental reality is vastly larger than our empirical experience, a significant departure from classical intuition. You cannot honestly claim it's *not* profligate; you must argue it's *necessary* profligacy.

  **The Single Change That Cleans Up the Most: Abandon Wave-Function Realism (1)**

  *   **Why:** WFR is the epicenter of your most severe tensions. It directly conflicts with your nomological leanings (2), *is* the ontological profligacy you dislike (7), creates an insurmountable barrier to absolute facts within Everett (6), and forces the wave function into the role of a concrete object, making a genuine nomological reading impossible without contradiction. It adds the high-dimensional space you explicitly want to avoid adding "beyond standard QM" (7).
  *   **What It Fixes:**
      *   **Resolves Tension 1 (Severe):** Eliminates the concrete object vs. law conflict. Allows for a genuine ontic nomological view governing fundamental entities in spacetime.
      *   **Mitigates Tension 2 (Severe):** Within a non-WFR Everett framework, the demand for absolute facts (6) remains problematic, but the conflict is less direct. You can more easily adopt relational facts/perspectivalism *without* the bizarre ontology of WFR. The fundamental reality is spacetime-based.
      *   **Resolves Tension 3 (Moderate):** Opens the door for a coherent ontic nomological interpretation (ψ as law) without the baggage of WFR.
      *   **Significantly Mitigates Tension 5 (Mild):** While Everett is still "profligate" in terms of histories/branches, abandoning WFR removes the *additional*, arguably gratuitous, profligacy of the high-dimensional configuration space itself. The fundamental ontology can be spacetime-based objects/fields governed by ψ, aligning better with the desire to "add nothing beyond standard QM" (7) in terms of *fundamental space*.
  *   **Cost of This Change:**
      *   You must commit to a **primitive ontology** in spacetime (e.g., a mass density field, particle trajectories, discrete events/flashes) or a **history-based ontology** with fundamental spacetime events. This feels like adding something "beyond" the pure wave function formalism (contra 7), though you can argue it's implicit in the empirical content.
      *   You lose the elegant (if ontologically extravagant) literal reading of the quantum state as *being* reality in configuration space.
      *   You need to specify *how* the wave function (as law/state) governs the primitive ontology/dynamics in spacetime. This adds complexity compared to WFR.
  *   **Resulting Coherent Core:** **Non-WFR Everettianism with Ontic Nomological Wave Function.** You become an Everettian (4), viewing ψ as a fundamental, ontic (3) *law* (2) governing the behavior of fundamental entities/events in spacetime. Probabilities are self-locating uncertainty (4). You reject PI as fundamental (5), acknowledging PBR's reliance on it (qualified 3). Facts are relative to branches/decoherence histories (revision of 6). The ontology is based in spacetime, avoiding the profligate high-D space of WFR (1 abandoned, 7 satisfied as much as Everett allows). This package is internally consistent and aligns with the motivations behind your initial points (2, 3, 4, 5, 7) while resolving the most severe contradictions caused by WFR.

  **Verdict: Abandon Wave-Function Realism (1).** It is the primary source of incoherence in your package. Shifting to a spacetime-based Everettian ontology with ψ as a fundamental ontic law provides the most coherent and defensible foundation for your other commitments. The cost of specifying a primitive ontology is less than the cost of maintaining the contradictions inherent in combining WFR with your other views.
