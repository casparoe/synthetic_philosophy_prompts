answer: |-
  Your thesis isn't just defensible; it's the key that unlocks the play's deepest ethical tension. *Measure for Measure* doesn't merely depict hypocrites losing standing; it constructs a world where standing *never existed* in a pure, untainted form for humans to wield legitimately. The Duke's artificial, near-theatrical resolution isn't a flaw but the necessary, uncomfortable solution to this radical scarcity. Let's argue *for* your position, then dissect the hypocrisy accounts, and finally pick the scenes that make it sing.

  **Arguing for Scarcity & Sovereign Resolution:**
  1.  **Universal Contamination:** Vienna is a moral swamp. Claudio's "crime" is common practice, tacitly endorsed by the state's prior laxity. The brothels flourish under the Duke's watch. Pompey and Mistress Overdone, though self-interested, voice undeniable truths about societal hypocrisy and the impossibility of pure enforcement. Lucio's slanders against the Duke ("the old fantastical duke of dark corners") land painfully close to the mark – the Duke *is* deceptive and manipulative. Even Isabella, pleading for mercy, must confront the potential cost of her purity (Angelo's proposition). No character emerges from this moral morass with clean hands sufficient for the absolute judgment Angelo attempts to impose.
  2.  **Angelo's Lucid Damnation:** This is crucial. Angelo isn't ignorant. His soliloquies ("This deed unshapes me quite...") are agonizingly clear-eyed about his own monstrous hypocrisy and corruption. He *knows* he exempts himself from the standard he enforces with lethal rigor. This explodes accounts locating hypocrisy's defect primarily in *insincerity* or *self-deception*. His vice isn't blindness; it's the terrifying *choice* to condemn while knowing his own damnable unworthiness. His standing isn't *lost* through exposure; it was *never* validly possessed because he knew, deep down, he didn't meet the fundamental condition of equality under the law he enforced.
  3.  **The Duke's Compromised Authority:** The Duke doesn't observe impartially. He *engineers* the crisis. He knows Angelo's proposition early, allows Claudio to believe he will die, allows Isabella agony, and orchestrates the bed trick and head-swapping deception. His judgment is based on evidence he illicitly obtained through his disguise and manipulations. By any standard account of procedural justice or clean hands, his standing is fatally compromised. He is deeply *complicit* in the very moral chaos he judges. This makes him unfit to blame Angelo on human terms.
  4.  **The Artificial Resolution as Necessary Surrogate:** Precisely because *no human* possesses the necessary standing (Isabella and Mariana are victims, Angelo is condemned, the Duke is tainted), resolution requires stepping outside the human economy of blame. The Duke, by reclaiming his sovereign role, transcends it. His pardon isn't *forgiveness* (it doesn't stem from the victims' uncoerced will – he *instructs* them to plead). It's *sovereign clemency*. It bypasses the question of standing entirely. He doesn't *need* clean hands; he has the *power* to suspend judgment. The finale's jarring artificiality – the sudden pardons, the forced marriages – is Shakespeare's deliberate demonstration that restoring order in this universally compromised world *cannot* be achieved through legitimate reciprocal blame. It requires an external, almost divine, fiat that overrides the impasse caused by universal lack of standing. Isabella's silence is philosophically load-bearing: it underscores the *irrelevance* of her consent or forgiveness in this sovereign act. The Duke doesn't request; he commands, including his proposal. Her silence speaks volumes about the displacement of personal moral agency by sovereign power in this resolution.

  **Hypocrisy Accounts & the Play's Support/Embarrassment:**
  *   **Unfairness (Exempting Self):** The play *supports* this vividly – Angelo is the archetype. However, it *embarrasses* it by showing Angelo's acute self-awareness. The defect isn't *just* exemption; it's the *knowing* exemption while demanding absolute adherence from others. The unfairness is compounded by lucidity.
  *   **Second-Personal (Lacking Authority as Equal):** This is the account the play *most strongly supports*. Angelo's authority is *purely* positional (deputy). His actions destroy any claim to moral equality with those he judges. His soliloquies reveal he *knows* he forfeits the right to address others as bound by shared norms he violates. Lucio's accurate insults further undermine Angelo's (and the Duke's) claim to the respect inherent in second-personal authority.
  *   **Insincerity/Lack-of-Commitment:** The play *embarrasses* this. Angelo is terrifyingly sincere in his *recognition* of the norm's validity and his own violation of it ("'Tis one thing to be tempted..."). His commitment to the law's *form* is absolute; his failure is ethical, not intellectual or volitional regarding the norm itself.
  *   **Complicity:** The play *partially supports* this but broadens it. Angelo isn't complicit with Claudio in fornication, but the whole *society* is complicit in the moral decay the law suddenly targets. The Duke's deep complicity in the events fatally undermines his standing to blame, highlighting the account's relevance beyond the hypocrite's specific sin.
  *   **Grandstanding (Moral Talk for Status):** The play offers *little support*. Angelo isn't grandstanding; he's wielding real, lethal power based on a genuine (if perverted) belief in the law's formality. His internal torment suggests status isn't his primary motive; control and perhaps repressed desire are. Lucio *does* grandstand, but his slanders contain truth, complicating the account's application.

  **Essential Scenes for the Class:**
  1.  **Act 2, Scene 2 (Angelo/Isabella "Be that you are"):** Angelo's icy rigidity followed by his explosive soliloquy ("What's this? What's this? Is this her fault or mine?"). Crucial for showing his instant self-awareness and the collapse of his standing *from within* as soon as temptation strikes. Demonstrates the failure of the insincerity account.
  2.  **Act 2, Scene 1 (Elbow, Pompey, Escalus):** The low-status characters (Pompey) delivering the most astute critique of the law's absurdity and societal hypocrisy ("Does your worship mean to geld and splay all the youth of the city?"). Highlights the scarcity of *clean* standing and the validity of judgment from unexpected sources, challenging students' assumptions about where moral insight resides. Shows the societal complicity.
  3.  **Act 2, Scene 3 (Duke & Juliet):** Absolutely vital. The Duke, disguised as a friar, hears Juliet's confession. His probing questions ("Then was your sin of heavier kind than his?") and pronouncement ("Your partner, as I hear, must die tomorrow") are morally grotesque. He *knows* he will save Claudio, yet subjects Juliet to this anguish and implicitly reinforces the unjust sentence. This scene crystallizes the Duke's profound complicity and lack of standing *long* before the finale. It shows his solution is born from the same compromised world.
  4.  **Act 5, Scene 1 (The Finale):** The whole sequence. Focus on: Angelo's self-condemnation ("I crave death more willingly than mercy"); The Duke *forcing* Isabella and Mariana to kneel and plead for Angelo *after* seemingly condemning him; Isabella's silence after the proposal; The Duke's arbitrary pardons (Angelo) and punishments (Lucio). This forces the question: Is this genuine moral resolution or sovereign fiat overriding the impossibility of human resolution? It embodies your thesis of scarcity resolved by power transcending standing.

  **Where the Reading Resists:**
  The play stubbornly resists being a *pure* philosophical allegory. The farcical underplots (Elbow, Pompey, Barnardine) aren't just comic relief; they represent a chaotic, vital, morally ambiguous life force that the law (and perhaps any neat philosophical framework) cannot fully contain or judge. Lucio's punishment feels excessive and personal, tied to his specific insult against the Duke's *manhood*, not just his slander – a grudge that undermines the Duke's claim to impartial sovereign grace. Barnardine's sheer refusal to die ("I swear I will not die today for any man's persuasion") is a glorious, anarchic assertion of existence that mocks the entire apparatus of judgment, pardon, and sovereign power. This messiness is the play's genius; it ensures the philosophical questions about blame and standing arise *from* the irreducible complexity of human beings in community, not imposed upon it. The apparatus helps us see the stakes, but the play shows us the muddled, vital, often contradictory human reality that generates the need for the apparatus in the first place – and why it can never fully capture it. Isabella's silence might be both philosophically rich *and* a staging accident, but its power lies precisely in its resistance to a single interpretation, forcing us to confront the limits of our own judgment.
