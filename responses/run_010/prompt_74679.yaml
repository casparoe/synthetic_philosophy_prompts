prompt: |-
  I work as a technician in the picture store at a mid-sized museum — no philosophy training whatsoever, but I've been chewing on something for ages and can't resolve it.

  Our treatment of copies seems inconsistent to me. A hand-painted copy of an old master that no expert could tell apart would be turned down flat by the acquisitions committee, and if somebody passed one off we'd treat it as a crime and it would end up in a drawer. Yet two floors up we hang a Roman marble copy of a Greek bronze that was melted down centuries ago, on an ordinary wall label, as art. And we run copy days where members of the public set up easels in front of the paintings and take their copies home, and no one thinks thats a problem.

  What does the first refusal presuppose about what makes something art? Does it need a view where arthood depends on who made the thing and when, so the copy simply can't be art? Or is it really about deception and the market and nothing to do with arthood at all? Tell me what the practice strictly commits us to, what it merely happens to fit comfortably with, which rival accounts of art it shuts out, and whether the three cases above can be squared with a single theory. Then tell me what would actually change in the drawers and on the walls if we swapped the presuposed theory for the honesty-and-market one. British English, please.
reasoning: |-
  Okay, let me tackle this museum technician's puzzle about copies and art. They've noticed three conflicting practices: rejecting expert-undetectable copies as fraud, displaying Roman copies of Greek bronzes as art, and encouraging public copy days. 

  The core tension seems to be between originals and copies. For the old master copy, the museum treats it as worthless unless proven authentic, suggesting they value the creator's hand and historical moment. But with the Roman sculpture, they're clearly treating the copy as art despite its derivative nature. And the public copies are encouraged without any pretense of being original.

  I need to unpack what each practice implies. The rejection of forged copies points toward an Institutional theory where art status depends on authentication by experts and acceptance into the artworld system. The Roman copy's display suggests a Formalist view where aesthetic qualities matter more than origin. And the public copy days align with an Expressivist perspective where the creative process itself has value.

  The key is distinguishing between art status and market value. That forged copy might technically function as art aesthetically, but without proper provenance it's excluded from the artworld system. Whereas the Roman copy enters through archaeological significance and historical context. 

  If we switched to a purely honesty-and-market theory, the implications would be fascinating. Suddenly that forged copy in storage could be displayed as "Anonymous 20th Century Copy" with its own artistic merit. The Roman sculpture might get downgraded to artifact status. But would the public still value either the same way? Probably not - we seem hardwired to cherish the authentic touch.

  The resolution might lie in recognizing that "art" isn't a single category but a layered concept. A work can be aesthetically significant, historically important, and economically valuable in different combinations. The museum's practices actually reveal this nuanced understanding rather than contradicting themselves.
answer: |-
  Right, let's unpack this properly. It's a brilliant observation that cuts to the heart of what we *actually* value when we call something "art" versus "just a copy". Your three cases expose genuine tensions in our everyday practices. Here's a breakdown, sticking to British English as requested:

  1.  **The Refusal of the Expert-Undetectable Copy: What It Presupposes**
      *   **Strict Commitment:** This practice **fundamentally presupposes that the artwork's identity is inextricably linked to its specific origin – the artist's hand and historical moment of creation.** It commits the museum to the idea that an artwork isn't just an arrangement of materials or an image, but a unique physical trace of a specific creative act by a specific individual at a specific time.
      *   **What It Fits Comfortably With:**
          *   **The Institutional Theory (Leaning Authorial):** Art is what the artworld (curators, critics, historians, collectors) *accepts* as art. Crucially, a core part of that acceptance often hinges on verified provenance and authorship. The undetectable copy lacks the *right kind* of origin story for acceptance.
          *   **Historical/Archaeological Value:** The primary value of the old master *for the museum* isn't just its look; it's its status as a historical document, a relic of genius, a node in art history. The copy, however perfect, is a fake historical document.
          *   **Aesthetic Theory (with a caveat):** If the *only* value were aesthetic experience, the copy should be as good as the original. The refusal suggests that while aesthetics matter, they are not *sufficient* on their own for the artwork's *identity* and institutional status. The aesthetic experience is deeply coloured by the knowledge of its origin.
      *   **What It Shuts Out:**
          *   **Pure Formalism:** The idea that *only* the visual form, composition, colour, line, etc., matter. If that were true, the perfect visual replica *would* be equivalent art.
          *   **Radical Reception Theory:** The idea that the artwork is *entirely* created in the moment of viewing by the spectator. While reception is vital, the refusal shows the institution prioritises the object's history over the viewer's potential identical experience with a copy.
          *   **A Simple Functional Definition (e.g., "Art is what provides an aesthetic experience"):** Again, the copy would fulfil this function just as well.

  2.  **The Roman Copy on Display: How It Fits (or Doesn't)**
      *   **Why It's Accepted:**
          *   **Historical Significance in its Own Right:** The Roman copy isn't valued primarily as a *deceptive* stand-in for the lost Greek bronze (though it is evidence of it). It's valued as a **significant artefact of Roman culture, craftsmanship, and taste.** It tells us how the Romans viewed, interpreted, and valued Greek art. It has its own provenance, age, and historical context that make it intrinsically valuable to archaeology and art history.
          *   **Lack of Deception:** It's presented *as* a Roman copy. There's no fraud. Its value derives partly from its relationship to the lost original *and* partly from its own status as a Roman object.
          *   **Scarcity & Survival:** The Greek bronze is lost. The Roman marble, being centuries old itself, is a rare and precious survival. Its material (marble) and age give it inherent value *as an ancient object*.
          *   **Aesthetic Value (Secondary but Present):** While not the *original* Greek vision, the quality of the Roman copy still offers a powerful aesthetic experience and insight into classical ideals.
      *   **Fits With:** Institutional Theory (it's accepted as a significant historical art object), Historical Value theories, and can still fit with Aesthetic theories (it *is* beautiful/sculpturally significant).

  3.  **Public Copy Days: The Distinction**
      *   **Why It's Unproblematic:**
          *   **Transparent Intent:** Absolutely no deception. Everyone knows it's a copy made by an amateur/learner *now*.
          *   **Different Purpose:** The value is in the *process* (learning, engagement, personal expression, skill development), not in the final product being passed off as an artwork for institutional or market purposes. The copy is a by-product of an educational/recreational activity, not an attempt to create a new artwork for the canon.
          *   **No Claim to Institutional Status:** Nobody expects these copies to be accessioned into the museum's collection or sold as "Old Masters". They are souvenirs of an experience.

  **Squaring the Circle: Can One Theory Handle All Three?**

  It's **very difficult** with a *simple* theory. However, a **nuanced Institutional Theory combined with a strong emphasis on historical provenance and context** can *just about* accommodate them, though it highlights the theory's flexibility (or fuzziness):

  1.  **The Refused Copy:** Rejected by the institution because it falsely claims the *wrong* origin/provenance (Old Master), violating the core institutional requirement of authenticity for that category of object.
  2.  **The Roman Copy:** Accepted by the institution as an authentic, historically significant artefact *in its own category* ("Roman marble copy of a Greek bronze"). Its provenance (Roman era, specific findspot maybe) is genuine *for what it is*.
  3.  **Public Copies:** Entirely outside the institutional framework of "art as collection objects". They exist in the realm of education, recreation, and personal practice. The institution facilitates the activity but doesn't confer art status on the resulting objects.

  **What Would Change if We Swapped to a Strict "Honesty-and-Market" Theory?**

  This theory essentially says: "An object's value as art depends solely on: 1) It being honestly presented for what it is (no fraud), and 2) What the market (buyers/viewers) are willing to pay/experience for it, based purely on its perceivable qualities."

  *   **In the Drawers:**
      *   The expert-undetectable copy **wouldn't necessarily be relegated to a drawer as worthless.** If honestly labelled as "20th Century Copy after Rembrandt, artist unknown", it could potentially be displayed. Its value would depend on:
          *   The skill displayed (aesthetic quality).
          *   Its own historical interest (e.g., "A remarkable example of 20th-century forgery techniques" or "A high-quality copy used for study").
          *   What viewers/collectors would pay or find interesting *knowing it's a copy*. It might still have significant value, but *different* value from an original Rembrandt. It wouldn't be a *crime* unless fraud was attempted; it would just be a different *kind* of object.
  *   **On the Walls:**
      *   The Roman copy **might stay**, but its label might shift emphasis. Instead of primarily being "A Roman Interpretation of a Lost Greek Masterpiece", it might lean more towards "A Superb Example of Roman Sculptural Craftsmanship" or "An Object Offering Insight into Roman Aesthetics". Its value would stem more transparently from its own qualities and the market/audience's interest in those qualities and its history *as a Roman object*, rather than its derivative nature *per se*.
      *   **Crucially, the distinction between "original" and "copy" would become less about inherent *art status* and more about:**
          *   **Provenance & Rarity:** An original is rarer and has the 'gold dust' of the first creator's touch, making it *more valuable* on the market, but not necessarily the *only* thing that *is* art.
          *   **Honesty:** Fraud would still be condemned because it manipulates the market and deceives people. But an *honest* copy could be appreciated *as a copy* for its own merits (skill, beauty, historical interest *as a copy*).
      *   **Public Copy Days:** Would remain unchanged, as they are already predicated on honesty and exist outside the primary art market.

  **In a Nutshell:**

  Your museum's current practice fundamentally commits to the idea that **an artwork's core identity and institutional value are bound to its authentic origin – the specific artist, time, and place of creation.** This shuts out theories that say *only* the look or *only* the viewer's experience matters. The Roman copy gets in under a different historical identity, and public copies are simply outside the system.

  Switching to a pure honesty-and-market theory would **demote the mystique of the original creator's touch from being a *defining requirement* for art status to being a (very significant) *factor in market value and viewer fascination*.** The drawers might yield interesting, honestly labelled copies for display, and the walls might reframe objects more explicitly in terms of their own perceivable qualities and verifiable history, rather than their lineage to a lost "master". It wouldn't abolish the concept of originality, but it would make it a matter of premium value and historical interest, rather than the sole key to the kingdom of "art". The crime wouldn't be making a copy; it would *only* be lying about it.
