  1. Equating truthlikeness with probability or degree of confirmation (e.g., saying that B is more probable and therefore more truthlike). [Deduct 3 marks, as it confuses distinct concepts]
  2. Assuming that logical strength tracks truthlikeness (e.g., claiming that because B is logically stronger than A, it must be more truthlike). [Deduct 2 marks, as the relation between strength and truthlikeness is complex and not direct]
