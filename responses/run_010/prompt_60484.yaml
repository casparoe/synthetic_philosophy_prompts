  ## Peer-Review Exchange for *Foundations of Quantum Theories*  
  **Manuscript ID: FQT-2024-017**  
  **Title:** *Decision-Theoretic Emergence of Probabilistic Branch Weights in Unitary Quantum Mechanics*  
  **Author:** Alexei Rostov (Independent Scholar)  

  ---

  ### REFEREE REPORT 1 (Initial Submission)  
  **Referee:** Dr. T. Richter  
  **Recommendation:** Reject  

  The manuscript claims to derive the Born rule (probabilities proportional to squared wavefunction amplitudes) solely from unitary quantum dynamics and rational agent constraints, without introducing additional physical postulates. While ambitious, the argument suffers from foundational circularity and misplaces its explanatory burden.  

  **Major Concerns:**  
  1. **Circularity in Rationality Axioms:** The derivation invokes a "branching-indifference" axiom (rational agents should not care about branching per se) and a "weight-sensitive" dominance principle (preferences should align with higher aggregate weight across branches). These axioms implicitly *presuppose* that branch weight is the relevant quantity for rational action. The author assumes the very Born-rule measure they seek to derive. Rationality constraints cannot bootstrap probability into existence; they can only operationalize an already-given measure.  

  2. **Decoherence’s Silence on Weights:** The appeal to decoherence (environment-induced suppression of interference) successfully identifies quasi-classical branches but provides *zero* information about their probabilistic weights. Decoherence solves the "preferred basis" problem, not the "probability" problem. The manuscript conflates the emergence of structure with the emergence of measure.  

  3. **No Room for Genuine Uncertainty:** In a fully unitary, deterministic multiverse, every outcome physically occurs. The author’s appeal to "uncertainty" before measurement is unexplained. If all branches are equally real, what is the agent uncertain *about*? There is no missing information in the universal wavefunction.  

  4. **Typicality as Question-Begging:** The argument that "most branches" observe Born-rule statistics presupposes a measure over branches. Using the squared-amplitude measure for this purpose is precisely what requires justification. Counting branches is ill-defined (as the author notes), but replacing it with typicality under the Born measure merely restates the problem.  

  **Recommendation:** Reject. The derivation is question-begging. It does not address why rational agents should weight branches by squared amplitude rather than, e.g., branch density or any other measure compatible with unitary dynamics.  

  ---

  ### AUTHOR RESPONSE  
  **Author:** Alexei Rostov  

  I thank the referee for their rigorous engagement. Below, I address the concerns:  

  1. **Circularity Charge:** The axioms do not presuppose Born weights. Branching-indifference follows from the *physical irrelevance* of mere branching: decoherence implies branching is approximate, coarse-graining-dependent, and not objectively countable. There is no unique "number of branches" to care about. Conversely, branch weights are *robust* under coarse-graining. Squared amplitudes remain invariant when we vary the fineness of the branch decomposition (e.g., smoothing over microscopic degrees of freedom). Rationality axioms leverage this invariance—they identify the *only* quantity stable under the arbitrariness inherent in defining "a branch."  

  2. **Decoherence & Weights:** Agreed: decoherence alone does not supply weights. However, it enables the decision-theoretic setup. By isolating quasi-classical branches, it allows us to model agents facing multiple future selves. The weights emerge not from decoherence, but from the *consistency* of rational preferences across branching events.  

  3. **Uncertainty’s Source:** Uncertainty is *self-locating*. Before measurement, the agent knows the universal state but does not know "which future branch they will experience." This is not uncertainty about physical facts (all branches exist), but indexical uncertainty about *which copy of themselves* they will be after branching. Decision theory operates under this first-person perspective.  

  4. **Typicality & Measure:** Typicality under the Born measure is not assumed. The derivation shows that *any other* weighting scheme would make an agent vulnerable to predictable, exploitable inconsistency. For example, if an agent bets using branch-counting (which is ill-defined), their preferences become coarse-graining-dependent—a violation of rationality. Born weights are the unique solution preserving consistent choice.  

  ---

  ### REFEREE REPORT 2 (After Author Response)  
  **Referee:** Dr. T. Richter  
  **Recommendation:** Reject  

  The response clarifies the author’s position but deepens the methodological concerns:  

  1. **Robustness ≠ Derivation:** The observation that Born weights are robust under coarse-graining is correct but does not *derive* them. It shows why Born weights are pragmatically useful *if we already care about them*. The rationality axioms still smuggle in a prior commitment to weighting by amplitude: why should "consistency" be defined as invariance under arbitrary branch definitions, rather than (e.g.) minimizing subjective variance?  

  2. **Self-Locating Uncertainty Smuggles Identity:** The appeal to indexical uncertainty assumes a specific view of personal identity across branching—namely, that branching creates distinct future selves. Yet the manuscript provides no account of *why* branching constitutes fission. Without this, "which branch I will be" is ill-posed. If identity is preserved across all branches (a coherent, if unusual view), there is no uncertainty. This relies on unstated metaphysics.  

  3. **Circularity in Swap Symmetry (A Point for the Author):** The author correctly notes that my preferred alternative—an envariance-style derivation of equiprobability for symmetric states—*does* presuppose that swappable states have equal probability. Conceded. However, this symmetry argument only yields equiprobability; extending it to *unequal* Born weights requires additional assumptions (e.g., fine-grained decompositions), which face similar circularity worries. The author’s decision-theoretic argument for unequal weights inherits this burden.  

  4. **Typicality Revisited:** The claim that Born weights avoid "exploitable inconsistency" is insightful but incomplete. An agent using *any* positive weights summing to unity is immune to Dutch books. Born weights are sufficient for consistency, but not uniquely necessary. The "unique solution" claim overreaches.  

  **Recommendation:** Reject. The technical moves are competent and address real challenges, but the core circularity remains: rational constraints can only redistribute probability; they cannot create it ex nihilo in a deterministic multiverse.  

  ---

  ### EDITORIAL DECISION  
  **Editor:** Prof. J. Aris  
  **Decision:** Reject  

  *Given the unresolved disagreement over whether decision-theoretic consistency requirements can ground probabilistic weights without prior metaphysical commitments, and the absence of a novel resolution to the self-locating uncertainty/identity dilemma, the manuscript does not meet the threshold for transformative contribution to the literature at this time.*  

  ---

  **Post-Scriptum from Referee to Author (Unofficial):**  
  *While we disagree vehemently on interpretation, I concur that the squared modulus is uniquely robust under the coarse-graining required to define quasi-classical branches. Our divergence lies in whether this mathematical stability explains why we should* care *about it.*  

  **Author’s Reply (Unofficial):**  
  *And I concede that your envariance critique was fair. Yet if mathematical stability under the only structure that enables agents, bets, and outcomes isn’t "caring," what physical explanation could ever satisfy you?*  

  ---  
