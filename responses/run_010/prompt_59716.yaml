prompt: |-
  I work on genomic selection for a dairy breeding program, so my whole working vocabulary is estimated breeding values, heritability, selection differentials, inbreeding coefficients, correlated responses, effective population size, and the fact that any accuracy number you get is a property of one population measured in one management environment. I've been reading the philosophy side of embryo selection — Savulescu's procreative beneficence argument, and Habermas's objection that genetic programming does something to the child's standing as the author of their own life and to the symmetry between persons that no amount of good intentions repairs. I want you to restate that debate in my vocabulary, as honestly as you can manage. Where does the breeder's equation actually cover what Savulescu is claiming, and where does the notion of best in his argument have no counterpart in a selection objective, given that in my world the economic weights always get set by someone with an interest? Take Habermas seriously: does the authorship and consent worry map onto anything in how we think about the relation between the evaluator and the animal, or is it simply unsayable in a language built on aggregate genetic gain? Then give me the residue report — which claims translate cleanly, which translate only with distortion, and which can't be expressed at all — and for each failure tell me whether that's because quantitative genetics is missing a concept or because the philosophers' disagreement was less substantive than it looked. Also flag anything my vocabulary has that the debate seems to have overlooked, since I suspect genotype-by-environment interaction and inbreeding depression do real work here that nobody in that literature is paying attention to. No headings, no bullet points, no bold, no tables — just continuous prose, the way you'd write an email or a letter. American English, please.
