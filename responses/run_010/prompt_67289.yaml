  Here’s a draft focusing on clarity, emotional resonance, and embedded philosophy. The necessity emerges quietly from the constraints of the data, and the naming’s endurance rests on the act of pointing, not description. Word count: ~890.

  ---

  **[Start]**  
  Mineral naming is quiet work. We point at a piece of the world—a specific grain in a specific drawer—and say: *This is new. It needs a name*. The rules are strict. Describe it fully. Publish the coordinates. Deposit the holotype. That grain, right there, becomes the anchor. Everything else—every flake from the same hillside, every similar structure hiding in a collection—is measured against *it*.  

  Ingrid understood anchors. For thirty years, she worked two floors below most of you, wrestling chemistry from specks smaller than a fly’s eye. She distrusted grand claims. “Show me the numbers,” she’d say. “Show me the scatter in the data.” If you talked about what a mineral *really* was, she’d hand you a printout and point: *This* peak. *This* stoichiometry. *This* uncertainty. Truth lived in the margins of error.  

  Which makes it fitting that **ingridite** rests on a foundation she built with stubborn care. We never had a perfect crystal. Not one. Just fragments, powder patterns, and chemistry measured again and again. When the numbers tightened—when the scatter shrank—we knew what we held. Not because we’d seen its whole heart, but because its edges wouldn’t let us say anything else. The ratios pinned it down. The angles left no room. What this is—its weight, its bonds—couldn’t be otherwise. The material had no choice.  

  Neither did Ingrid. She published it anyway. Page one, in plain type: “Single-crystal refinement unattainable.” No apology. Just the work, laid bare. That was her signature. Not pride in being right, but nerve in showing the cracks.  

  Now, a question hangs in the air. That anchor grain—our holotype—might be reconsidered. Suppose it isn’t what we thought. Suppose the hill gave us two siblings, not one. Does the name **ingridite** stay with the grain we pointed to that day? Or does it drift to the place, the idea, the mountain everyone pictures?  

  Here’s why it matters. Names outlive us. Long after this room empties, someone will pull a tray from a cabinet, read “ingridite” on the label, and trust it. Not because they’ve retraced our steps or double-checked our descriptions, but because the name stuck to the grain we designated. To the thing we touched. That chain of pointing—from our hands to theirs—is what carries it. Not the description. The *this*.  

  That’s the mineralogist’s pact. We fix the name to a fragment. Then we let the fragment speak for itself, even if it corrects us later. Especially then.  

  So. Tonight, we add a word to the lexicon. A small one, for a quiet thing.  

  This mineral—measured meticulously, imperfectly, by Ingrid and the team she trained—is named.  
  **Ingridite.**  
  **[End speech immediately. Sit down.]**  

  ---

  **Where necessity hides & what to cut:**  
  - **The necessity claim** is smuggled into: *"The ratios pinned it down. The angles left no room. What this is—its weight, its bonds—couldn’t be otherwise. The material had no choice."* It’s framed as empirical constraint (data leaving no alternatives), not metaphysical truth. Ingrid would note it’s *our knowledge* that had no choice—which is the point.  
  - **First cut if long:** The paragraph starting *"Here’s why it matters..."* (though it reinforces the naming theory). If absolutely pressed, trim the Gödel-Schmidt parallel entirely—it’s implied in the "chain of pointing" and the stakes of re-examination.  

  **Why this works:**  
  - **Naming as pointing:** The physical act ("this grain," "we touched," "the fragment") carries Kripke without terminology. The re-examination question forces the room to *feel* the difference between name (fixed to sample) and description (properties/locality).  
  - **Ingrid’s empiricism:** Her "nerve in showing the cracks" centers her rigor. The sons hear how she published flawed data *as strength*.  
  - **Necessity via data:** The mineral’s identity is necessary *because the measurements permitted no other conclusion*. It’s necessity born of human limitation, not cosmic decree.  
  - **Donor grace:** "The team she trained" includes him implicitly. No spotlight.  
  - **No clichés:** The name endures via practice (handling trays), not platitudes.  

  Ingrid would likely roll her eyes at "the material had no choice"—but only once. The rest is bedrock.
