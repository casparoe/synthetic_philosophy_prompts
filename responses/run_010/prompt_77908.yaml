answer: |-
  Your diagnosis is perceptive and largely correct. The textualism/purposivism debate *has* evolved beyond its original framing, creating a stalemate because the core disagreements now lie beneath the surface of the traditional labels. Here's a breakdown using the arguments and positions of key figures:

  1.  **The Convergence on "Meaning as Linguistic Fact Fixed at Enactment":**
      *   **Textualism (Gorsuch, Scalia Heritage):** Explicitly states the goal is to discover the "ordinary public meaning" of the text *at the time of enactment*, understood as a linguistic fact. Context (statutory, linguistic, sometimes historical) is crucial but *only* as it illuminates that linguistic meaning. Legislative history (committees, floor statements) is rejected as *determinative* of meaning (though sometimes used as a last resort or for confirmation) because it doesn't reflect the *law* that was enacted – only the text does. (Scalia & Garner, *Reading Law*; Gorsuch in *Bostock*).
      *   **Modern Purposivism (Breyer, Kagan):** Has significantly retreated from "spirit of the statute" or unconstrained judicial identification of purpose. The focus is now on "purpose" as something *inferred from the statutory text itself* – its structure, context, the specific problem it was enacted to solve, and how its words would have been understood to achieve that purpose *at the time*. Legislative history is used not to contradict the text, but as evidence of the *linguistic and problem-solving context* in which the words were chosen and understood. Meaning is still anchored in the enacted text. (Breyer, *Active Liberty*; Kagan's confirmation hearing statement: "We are all textualists now").

      **Agreement:** Both camps agree the search is for the meaning of the enacted text, fixed at enactment, understood as an objective linguistic fact discoverable through evidence. Both use context and structure.

  2.  **The Hidden Empirical Disagreement: "Whose Understanding?"**
      *   **Textualism:** Meaning is settled by what a **hypothetical competent speaker of the language** at the time of enactment would understand the words to mean *in the context of the statute as a whole*. This is often framed as "public meaning" or "objective meaning." Legislative history is unreliable evidence of *linguistic meaning* because it reflects the views of a few actors, not the public understanding. The focus is on the *communicated linguistic content*.
      *   **Purposivism:** Meaning is settled by understanding **what the enacting legislature was *doing* with these words** – the specific problem they were demonstrably addressing and how they intended the words to operate to solve it, *inferred from the text and its public context*. Legislative history is relevant evidence of the *problem* and the *publicly available understanding* of the words' intended operational scope at the time. The focus is on the *communicated functional aim* embedded in the linguistic choice.

      **Disagreement:** This is the core empirical rift. Textualists ask: "What would these words, in this context, convey to a reasonable user of English *circa* [year]?" Purposivists ask: "What problem were these words demonstrably chosen to solve, and how would that purpose have been understood to operate *circa* [year], based on the text and its public context?" They disagree on which *evidence* (ordinary usage patterns vs. evidence of the specific problem/purpose) is more probative of the *linguistic fact* of meaning-in-context.

  3.  **The Smuggled Judicial Role Disagreement:**
      *   **Textualism:** Views the judicial role as strictly constrained by the linguistic meaning. Judges apply, not make, law. Deviating from that meaning, even for seemingly better outcomes or unanticipated circumstances, is illegitimate judicial legislation. "Ordinary meaning" is the primary bulwark against judicial overreach. (Scalia's famous critiques of "legislative intent"; Gorsuch's emphasis on judicial restraint in *Bostock*).
      *   **Purposivism:** Views the judicial role as including giving effect to the statute's *reason for being* within the bounds of the text. This allows for interpretation that adapts to unforeseen circumstances *if* it still fits the demonstrable purpose and the words are reasonably capable of bearing that meaning. Avoiding absurd results or defeating the statute's core aim is seen as *faithful* to the legislature's work, not rewriting it. (Breyer's emphasis on consequences and workability; Hart & Sacks' Legal Process theory influence).

      **Disagreement:** Textualists fear purposivism grants judges excessive discretion; Purposivists fear textualism produces rigid, absurd, or statute-defeating results. This *value* disagreement about the proper bounds of judicial power drives the choice of which empirical method (ordinary meaning vs. purpose-in-context) is seen as more legitimate and constraining.

  **Bostock v. Clayton County (2020) as the Test Case:**

  *   **Gorsuch (Textualist Majority):** Focused relentlessly on the *ordinary meaning* of "because of... sex" *at the time of enactment*. Argued that discrimination based on sexual orientation or gender identity is *linguistically* discrimination "because of... sex" – if you change the sex of the employee, the outcome changes. Rejected arguments about the specific *purpose* of the 1964 Congress (which didn't contemplate these issues) as irrelevant to the *linguistic meaning* of the words chosen.
  *   **Alito/Kavanaugh (Textualist Dissents):** Accused Gorsuch of disguised purposivism. Argued that the *ordinary meaning* in 1964 did *not* encompass sexual orientation or gender identity. They pointed to the *expected applications* and *understood purpose* of the provision at the time (combatting discrimination against women) as evidence of the *linguistic boundaries* of the phrase. They argued Gorsuch's reading stretched the words beyond their understood operational scope, effectively updating the statute – a judicial role violation disguised as textualism.
  *   **Analysis:** This split perfectly illustrates the hidden disagreements. Both sides claimed textualism. Gorsuch emphasized abstract linguistic logic ("because of sex"). Alito/Kavanaugh emphasized the understood purpose/operational scope at enactment ("combatting discrimination against women"). Gorsuch saw the dissenters importing purpose to narrow clear text; the dissenters saw Gorsuch using abstract logic to override the text's understood function and scope. The role disagreement is clear: Gorsuch saw applying the logic as faithful restraint, the dissenters saw it as judicial updating.

  **Is the Diagnosis Right?** Yes, largely. The surface rhetoric of "text" vs. "purpose" obscures a deeper agreement on meaning-as-fixed-linguistic-fact and a deeper disagreement about 1) *which empirical evidence* (ordinary public linguistic understanding vs. specific statutory problem/purpose context) best reveals that fact, and 2) the *proper judicial role* (strict application of linguistic meaning vs. ensuring the statute's functional aim is realized within the text).

  **What Would Count as Progress?** Stalemate is likely, but potential paths exist:

  1.  **Reframing the Question Away from "Meaning" to "Evidence":** Explicitly acknowledge the agreement and frame the debate as: "Given that meaning is fixed by the enacted text in context, what *types of evidence* are most reliable and legitimate for judges to consult to discover that meaning?" This shifts focus to epistemology and judicial role.
  2.  **Developing "Corpus-Linguistics Plus":** Corpus linguistics provides powerful tools for ordinary meaning. Progress could involve developing more sophisticated methodologies that also rigorously incorporate evidence of the *specific statutory problem* and its *contemporary public understanding* as part of the linguistic context. The challenge is integrating this without reintroducing the "specific intent" that textualists reject.
  3.  **Articulating a "Decision Procedure" for Context:** Canons of construction are crude tools. Progress might involve developing more principled frameworks for *how* statutory structure, related provisions, and the identified "problem" (drawn *only* from the text and indisputable historical facts) interact with the semantic meaning of specific words. This requires bridging the empirical gap.
  4.  **Directly Confronting the Judicial Role Disagreement:** Instead of hiding it under semantics, have an open debate about the values: When, if ever, should judges prioritize avoiding absurdity or defeating the core aim over a strict linguistic reading? What level of judicial discretion is acceptable? Can textualism be flexible enough? Can purposivism be constrained enough? This is the hardest but most fundamental path.
  5.  **Focusing on Institutional Competence:** Which approach (relying on ordinary meaning vs. statutory problem/purpose context) is more predictable, more constraining, more faithful to legislative supremacy, and produces better outcomes *as a system*? This shifts from abstract philosophy to practical institutional design.

  **Why Progress May Be Elusive (The Case for Stalemate):**

  *   **Intractable Values:** The judicial role disagreement reflects deep-seated, often ideological, differences about the nature of law and the function of courts. Consensus here is unlikely.
  *   **Epistemological Disconnect:** Textualists see "purpose" as inherently subjective and prone to manipulation. Purposivists see "ordinary meaning" divorced from functional context as artificial and potentially absurd. These are fundamentally different views of how language conveys meaning in law.
  *   **Strategic Labeling:** The labels "textualist" and "purposivist" remain powerful rhetorical tools. Admitting convergence or reframing might be seen as conceding ground. Accusations of bad faith (e.g., "purposivism in disguise") are effective polemics.
  *   **Bostock Fallout:** The decision hardened positions. Textualists who agreed with Gorsuch saw it as vindication; dissenters saw it as proof textualism had been hijacked. Purposivists saw it as textualism working (for once) in their favor, but via a method they see as flawed (ignoring purpose).
  *   **Incentives:** Judges and scholars are entrenched. The debate generates scholarship, defines judicial legacies, and aligns with broader political/legal movements. Stalemate can be professionally useful.

  **Conclusion:**

  Your diagnosis is astute. The debate is frozen because the real battlegrounds (empirical sources for meaning, judicial role) lie beneath the outdated labels "textualism" vs. "purposivism," which now mask a significant convergence on the *object* of interpretation (enacted text's meaning). Progress requires either a methodological breakthrough (e.g., "corpus-plus"), a reframing of the core question (e.g., focus on evidence or role), or a frank discussion of values – all of which face significant barriers rooted in deep-seated jurisprudential and ideological differences. The stalemate is likely to persist, with battles fought case-by-case like *Bostock*, where the underlying disagreements erupt despite shared terminology.
