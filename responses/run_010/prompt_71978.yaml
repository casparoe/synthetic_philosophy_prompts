answer: |-
  ## Already Settled

  The sodium lights of the rest stop buzzed like trapped flies, bleaching the cracked asphalt and the long, lonely rigs. Delia flipped open her duty log, noting the time, the mileage, the empty trailer. Her hand, moving by nineteen years of habit, then reached for the spiral notebook beside it. The cardboard cover was softened at the edges, stained dark by coffee rings and diesel grime. She clicked her pen.

  *May 17, 11:47 PM. Westbound. I-80 WB, Mile 173. Already: Andromeda resolved, light-years deep.*

  She didn’t know what *resolved* meant, not really. Not like astronomers knew. She’d seen it once, that faint smudge in the desert blackness outside Tonopah, through the dusty windshield of her old Freightliner. It felt like looking at a closed door. The notebook entries were notes slipped under that door, unanswered. Eight years of them.

  “Recording the inevitable?” Her nephew, Leo, unfolded himself from the passenger seat, stretching. Nineteen, all knees and elbows and the sharp intelligence that had gotten him into a physics program he now wanted to flee. He’d inherited her brother’s stubborn jaw, softened by his mother’s eyes. His bags were packed for a summer at home, not a dorm room in the fall.

  Delia snapped the notebook shut. “Just the already settled.” Her mother’s face, pale against the hospital pillow in April, flickered behind her eyes. Gone. Settled. Utterly, irrevocably. The notebook couldn’t touch that. She knew. But the habit was bone-deep, a private ritual against the vast indifference rolling past her windows every night.

  Leo grinned. “Right. Because if I started sprinting east right now, my ‘already’ out there,” he jerked a thumb towards the invisible sky, “would be different than yours. Days different, even.”

  “Quadrillionths of a second different here,” Delia corrected, nodding at the rest stop diner a hundred yards away. “But yeah. In principle.” She’d explained the pedestrian argument to him hours ago, the tilted slices of *now* depending on speed and direction. He’d grasped it instantly, delighting in the counter-intuitive logic.

  “So… wanna test it?” Leo’s eyes held a challenge, mixed with the absurdity of the proposition. “Properly? You walk west, I walk east. We each write what’s *already* at Andromeda, right then. Compare notes. See the shift.”

  It was ridiculous. Impossible. They both knew it before they stepped out of the cab. There was no signal, no message that could travel fast enough to confirm what was happening 2.5 million light-years away *right now* according to Delia, or *right now* according to Leo sprinting towards the vending machines.

  “Alright, Prof. Einstein,” Delia said, a dry smile touching her lips. “Let’s get ridiculous.”

  They stood back-to-back under the buzzing sodium halo. Delia faced west, towards the unseen highway humming with unseen trucks. Leo faced east, towards the dark fields beyond the parking lot. Each held an open page of their own notebook – Delia’s worn spiral, Leo’s crisp college-ruled pad.

  “Ready?” Leo called, his voice tight with suppressed laughter.

  “Go.”

  Delia walked. Not fast. A steady trucker’s pace, boots scuffing the asphalt, towards the far edge of the light. She focused on the act: *Westbound. Moving away from Leo. My slice tilts… this way?* She pictured the galaxy, impossibly distant. What did "already" mean there? Births? Deaths? Collisions of stars she couldn’t comprehend? She stopped at the shadowed edge of the light pool, clicked her pen.

  *May 17, 11:53 PM. Westbound. Rest Stop East Lot. Already: Andromeda core stable.* The words felt hollow, meaningless. She wrote them anyway.

  She turned. Leo was a silhouette against the diner’s neon sign, waving his notebook like a flag. They walked back towards each other, the absurdity thickening in the humid air. They met under the brightest light, near a discarded coffee cup.

  “Show me,” Leo said, breathless not from exertion, but from the cosmic joke.

  Delia held out her page. Leo held out his. Side by side.

  *May 17, 11:53 PM. Westbound. Rest Stop East Lot. Already: Andromeda core stable.*

  *May 17, 11:53 PM. Eastbound. Rest Stop East Lot. Already: Andromeda core stable.*

  Identical. Of course. There was no shift to see, no way to measure the quadrillionths of a second difference their relative motion theoretically imposed on that distant galaxy. The vast distance swallowed the effect whole, rendering it philosophically fascinating, humanly invisible.

  Leo burst out laughing, a sharp, relieved sound. “Told you! It’s… it’s not *real* like that, Aunt Dee. Not a thing you can point to.”

  Delia felt a familiar frustration, the one that usually ended in a shrug or cosmic gloom in the articles she’d read. But Leo wasn’t dismissing it; he was leaning in, kitchen-table earnest now, not lecture-hall.

  “Look,” he said, tapping her identical entry. “The slicing… it’s just a way of *organizing* events. Like drawing lines on a map. Doesn’t change the land, right? You’re treating the line you draw as the *only* real ‘now’, like things are *being* settled along that slice. But they aren’t. They just *are*. All of it.” He gestured vaguely upwards, encompassing the sky, the unseen galaxy, the truck stop, the years. “The ‘already’ you’re writing… it’s just a label you paste on a point in a giant, fixed… everything. Because you’re moving west. But the galaxy doesn’t care about your label. Or mine.”

  *Just a way of slicing.* The objection she’d read about, stripped of jargon, delivered by her sister’s son over lukewarm diner coffee later. It landed. It cost her the illusion that her notebook entries corresponded to some objective wavefront of reality sweeping through Andromeda. They were personal coordinates, meaningful only within her specific frame of reference rattling down I-80.

  “It’s like… like writing down the temperature *only* according to the thermometer in your cab,” Leo added, seeing her quiet. “It’s true for the cab. But it doesn’t mean the whole world just warmed up or cooled down because you did.”

  Delia stirred her cooling coffee. The diner vinyl creaked under her. The notebook lay on the table between them, suddenly alien. “But the *difference*,” she said slowly, looking at Leo. “When we walked… the *difference* between our ‘nows’ for Andromeda. That’s real, isn’t it? Mathematically? Even if we can’t see it?”

  Leo paused, spoon halfway to his mouth. He hadn’t expected the question. “Well… yeah. In the model. The equations say there *is* a tiny offset because we were moving relative to each other. Undetectably tiny here, but it’s a consequence.” He sounded surprised she’d landed on it.

  Delia nodded. That tiny, invisible, mathematically mandated difference – that was real within the rules. It was the only thing that *was* real about their experiment. Not the absolute "already," but the *relative* shift caused by their motion. He’d dismissed the *meaning* of her absolute "already," but she was right about the *existence* of the shift their disagreement represented, however minuscule. It was a sliver of the structure he described, a ghostly fingerprint of relativity on their mundane walk.

  Leo drove the next leg while Delia tried to sleep. But sleep wouldn’t come. She thought of her mother, gone. Settled. Irrevocably in the past, for everyone, everywhere. No tilted slice could change that. Leo’s words echoed: *They just are. All of it.*

  The notebook felt heavy in her hands. It wasn’t a window onto cosmic unfolding. It was… her cab’s thermometer. A record of where she was and how she was moving when she thought about that unreachable smudge. A ritual of attention, not revelation.

  At the next rest stop, pre-dawn grey leaching into the sky, Delia climbed out. Leo was asleep in the cab. The air was cool, smelling of damp earth and diesel. She took the spiral notebook and her pen. She didn’t open it immediately. She looked east, towards where the sun would rise, towards home, towards Leo’s uncertain future. She thought of the invisible shift caused by their walking, a mathematical whisper in the fabric of things.

  Then she flipped to a fresh page. Her hand moved, steady.

  *May 18, 5:02 AM. Westbound. I-80 WB, Mile 422. Already: Andromeda persistent.*

  She closed the book. The ritual felt different now. Thinner, perhaps. More obviously hers alone. Not a claim about the universe, but a mark made in the moving dark. A habit of the road. She slid it back next to the duty log. She would write again at the next stop. The galaxy remained, silent and unresolved, light-years deep.

  ---

  **Author's Note**

  This story assumes the conventionalist interpretation of simultaneity in special relativity: the "present" is not a single, universally agreed-upon slice of events, but depends on the observer's state of motion. Different observers carve spacetime differently. The nephew’s objection directly targets the core of Delia’s practice: he argues that her notebook entries mistakenly treat her *chosen slice* of simultaneity (defined by her motion west) as reflecting an objective, universal state of "already-ness" for distant Andromeda. He insists this slicing is merely a useful convention for organizing events within her reference frame, not a description of fundamental reality where all events simply *exist*. This costs Delia the belief that her entries correspond to a cosmic unfolding happening "now" at the galaxy; they become personal coordinates, tied solely to her journey. If the story adhered strictly to the view that the present is *only* local, without any global notion of simultaneity (even a conventional one), Delia’s entire notebook premise would lose its specific conceptual anchor. The focus might shift entirely to her grief and ritual, leaving the Andromeda references as pure, disconnected metaphor. The story neither endorses nor condemns Delia’s ritual; it observes how she maintains a private, physically inspired practice even after its original conceptual framework is challenged.
