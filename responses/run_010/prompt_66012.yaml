prompt: |-
  I assess claims for a disability income scheme — about twenty cases a week, forty-five minutes each, mostly from paper medical records, and my decision determines whether someone's support continues. The rulebook's threshold word is substantial: the impairment must have a substantial effect on the person's ability to manage ordinary daily activities. There is no list, no point score, and no further definition of that word. Two problems keep biting. First, colleagues and I disagree at the edges, and refused claimants appeal, so I need reasons that hold up. Second — and this is the one I cannot handle — many files contain a long list of difficulties each of which I would individually call minor: forgets appointments, cannot stand more than ten minutes, avoids crowded shops. I have no principled way to say whether twenty small things add up to something substantial, and I suspect I am currently settling those cases by mood.

  Write me a procedure I can actually run in forty-five minutes with no philosophy training: the questions in order, what counts as a sufficient answer to each, how to handle a borderline file without pretending the line is sharper than it is, how to keep my verdict consistent with a colleague's on a near-identical file, and where the procedure must stop and hand the call to a supervisor because the question is one of values rather than facts. Ground it in whatever the work on vague thresholds and borderline cases offers that survives contact with a caseload, and be honest about which steps are judgment calls wearing a procedural costume. Then run it on three files: a claimant with a single, well-documented severe limitation; the twenty-small-things file described above; and a claimant whose condition worsened in imperceptible increments over four years, with each annual reassessment finding them barely changed from the last. At least one of the three should come out with a verdict I will not like, and finish with what the procedure cannot do.
reasoning: |-
  We are designing a procedure to handle disability income scheme claims where the threshold is "substantial effect" on daily activities. The procedure must be practical for 45-minute assessments based on paper records, help with consistency, and address the problem of multiple minor difficulties. It should acknowledge borderline cases and avoid false precision.

  ### Core Principles from Vague Thresholds Literature:
  1. **Sorites Paradox Acknowledgment**: Small increments may not individually cross a threshold, but collectively they might. We need a way to assess cumulative impact without a strict point system.
  2. **Prototype Comparison**: Compare the case to clear examples (prototypes) of what does and doesn't meet the threshold.
  3. **Reasons for Decision**: Focus on the functional impact and the reasons why the set of difficulties is or isn't substantial.

  ### The Procedure: Steps in Order

  **Step 1: Identify All Reported Difficulties**
     - **Task**: List every difficulty the claimant reports or that is documented in the medical records that affects daily activities. Include physical, mental, cognitive, and sensory issues.
     - **How**: Skim the file and note each distinct difficulty (e.g., "forgets appointments", "cannot stand more than 10 minutes").
     - **Time**: Aim for 5-10 minutes.

  **Step 2: Categorize Each Difficulty by Functional Domain**
     - **Domains** (non-exhaustive, but cover common areas):
       - Mobility (e.g., standing, walking)
       - Self-care (e.g., washing, dressing)
       - Household tasks (e.g., cooking, cleaning)
       - Managing treatments/medications
       - Social interaction/communication
       - Planning/organizing (e.g., appointments, finances)
       - Work-related activities (if applicable to daily life)
     - **Purpose**: Grouping helps see if multiple difficulties hit the same domain (which might compound) or spread across domains (which might disrupt multiple areas of life).
     - **How**: Assign each difficulty to one or more domains. Note if a difficulty affects multiple domains.

  **Step 3: Rate the Severity of Each Difficulty (Using a Simple Scale)**
     - **Scale** (use with caution - it's a tool, not a scorecard):
       - **Mild**: Noticeable but rarely disrupts activity; can be worked around easily.
       - **Moderate**: Often disrupts activity; requires effort or help to manage.
       - **Severe**: Prevents the activity entirely or requires constant help.
     - **Note**: This is a judgment call, but base it on the evidence (e.g., medical opinion, claimant's account). If a difficulty is described in vague terms, note that and don't over-interpret.

  **Step 4: Assess Compounding Effects (The "Twenty Small Things" Problem)**
     - **Questions**:
       - **Domain Overload**: Are there multiple difficulties in the same domain? (e.g., several issues with mobility: standing, walking, climbing stairs). If so, do they together make the domain non-functional?
       - **Chain Reactions**: Does one difficulty cause others? (e.g., pain leading to fatigue leading to forgetfulness)
       - **Coping Strategies**: What does the claimant do to cope? (e.g., avoids crowded shops, relies on family). How much effort or help is required? If coping strategies are extensive, they may indicate substantial effect even if the claimant is managing.
       - **Time and Energy**: Does managing these difficulties consume so much time/energy that other activities suffer?
     - **How**: Write a brief narrative for the claimant's typical day, noting where difficulties arise and how they are managed. If the narrative shows that the claimant's life is significantly altered or requires constant adaptation/help, that suggests substantial effect.
     - **Time**: This is the core of the 45 minutes - spend 15-20 minutes here.

  **Step 5: Compare to Prototypes**
     - **Prototype A (Clear Yes)**: A claimant with a single severe limitation (e.g., unable to walk without a wheelchair, which affects mobility, self-care, and household tasks).
     - **Prototype B (Clear No)**: A claimant with minor, infrequent issues (e.g., occasional headaches that don't disrupt daily routines).
     - **Where does this case fit?** Closer to A, closer to B, or in between?
     - **How**: Briefly note similarities and differences to these mental prototypes. This step helps with consistency across cases.

  **Step 6: Borderline Handling**
     - **If borderline** (i.e., after steps 1-5, it's unclear):
       - **Revisit coping strategies**: Are they sustainable? Would the claimant struggle without them?
       - **Consider unpredictability**: Even if each difficulty is minor, if they occur unpredictably and frequently, they might create substantial risk or stress.
       - **Default to the claimant's account**: If the claimant describes a substantial impact and the medical records don't contradict, lean towards accepting their perspective.
       - **Note the uncertainty**: In your decision rationale, explicitly state that this is a borderline case and explain why you leaned one way (e.g., "Although no single difficulty is severe, the combined effect in multiple domains leads to a substantial impact because...").
     - **Consistency Check**: If possible, quickly recall a similar past case (or ask a colleague for a comparable case). If the case is very similar to one previously decided, aim for the same outcome. If not, note why this one is different.

  **Step 7: Decision and Rationale**
     - **Substantial Effect?** Yes/No.
     - **Rationale Structure**:
       1. List the key difficulties (from Step 1).
       2. Explain how they interact (from Step 4).
       3. Compare to prototypes (Step 5).
       4. If borderline, explain the leaning (Step 6).
     - **Key**: The rationale must be clear enough to hold up on appeal. Avoid words like "minor" or "major" without context; describe functional impact.

  **Step 8: Escalate to Supervisor**
     - **When**:
       - The case involves a **novel issue** not seen before (e.g., a rare condition with unclear effects).
       - There is a **conflict in evidence** (e.g., medical opinions disagree sharply).
       - The **values question** is central (e.g., what counts as "ordinary daily activities" for a person with a non-traditional lifestyle?).
       - You feel the rulebook's vagueness is **unresolvable** by the above steps and requires policy input.
     - **How**: Write a brief summary of the issue and why it needs escalation. Continue with other cases.

  ### Running the Procedure on Three Cases

  #### Case 1: Single Severe Limitation (e.g., Paraplegia)
  - **Step 1**: Difficulty: Cannot walk or stand without assistance. Requires wheelchair for mobility.
  - **Step 2**: Domains: Mobility (primary), self-care (e.g., transferring to toilet), household tasks (e.g., reaching high shelves).
  - **Step 3**: Severity: Severe in mobility, moderate to severe in others.
  - **Step 4**: Compounding: Inability to walk affects nearly every activity. Coping requires wheelchair and home modifications. Time/energy: High.
  - **Step 5**: Prototype: Clear Yes (like Prototype A).
  - **Step 6**: Not borderline.
  - **Decision**: Substantial effect - Yes.
  - **Rationale**: The claimant's paralysis severely limits mobility, which in turn affects self-care and household tasks. The impact is substantial and comparable to clear cases we accept.

  #### Case 2: Twenty Small Things (e.g., Mild Cognitive and Physical Issues)
  - **Step 1**: List: Forgets appointments, cannot stand >10 min, avoids crowded shops, needs reminders for medication, tires easily, loses things, etc. (20 items).
  - **Step 2**: Domains: 
     - Planning/organizing (forgets appointments, loses things)
     - Mobility (cannot stand long, avoids shops due to crowds and standing)
     - Self-care (needs reminders for medication)
     - Social (avoids shops, which is also mobility)
  - **Step 3**: Severity: Mostly mild to moderate individually.
  - **Step 4**: Compounding:
     - Domain Overload: Planning/organizing has multiple issues (forgetfulness, losing things). Mobility is affected by standing and crowds.
     - Chain Reactions: Fatigue from pain leads to forgetfulness.
     - Coping: Relies on spouse for reminders, shops only at quiet times, uses a stool in kitchen. This requires significant support and planning.
     - Time/Energy: The claimant spends much of the day managing symptoms and avoiding triggers, leaving little energy for other activities.
  - **Step 5**: Prototype: Not a clear No (because of the number of issues) but not a clear Yes (each is minor). Borderline.
  - **Step 6**: 
     - Coping is extensive and not sustainable without help.
     - Unpredictability: Forgetfulness and fatigue vary, causing stress.
     - Leaning towards Yes because of the cumulative effect across domains and the reliance on others.
  - **Decision**: Substantial effect - Yes (but borderline).
  - **Rationale**: The claimant has multiple mild to moderate difficulties across several domains. While no single issue is severe, their combined effect requires significant adaptations and support, reducing the claimant's ability to independently manage daily activities. This cumulative impact meets the threshold of substantial effect.

  #### Case 3: Gradual Worsening Over Four Years (e.g., Early Stage Neurodegenerative Disease)
  - **Background**: Each year the claimant has slightly more difficulties (e.g., slower walking, more forgetfulness), but each reassessment found them "barely changed" from the last.
  - **Step 1**: Current difficulties: Walks slower than before, occasional falls, more forgetful, trouble with complex tasks, fatigue. (Note: Each annual report showed a small decline.)
  - **Step 2**: Domains: Mobility, planning/organizing, household tasks (complex tasks).
  - **Step 3**: Severity: Mostly moderate now (but were mild in past years).
  - **Step 4**: Compounding:
     - Domain Overload: Mobility and cognitive issues are both present.
     - Chain Reactions: Fatigue worsens cognitive issues.
     - Coping: Uses a cane, writes detailed lists, avoids complex tasks. These are becoming less effective.
     - Time/Energy: The claimant takes much longer to do daily tasks and often needs rest breaks.
  - **Step 5**: Prototype: Past years were borderline No? Now, compare to prototypes: Not as severe as Prototype A but worse than Prototype B. Current state is borderline.
  - **Step 6**: 
     - Despite gradual change, the current cumulative effect is more pronounced.
     - Coping strategies are straining.
     - Unpredictability: Falls and forgetfulness create risk.
     - Leaning towards Yes, because the decline has reached a point where daily activities are significantly affected.
  - **Decision**: Substantial effect - Yes (borderline, but changed from previous No).
  - **Rationale**: Although the decline has been gradual, the claimant now experiences moderate difficulties in mobility and cognition that interact and require increasing support. The cumulative effect and reduced efficacy of coping strategies now have a substantial impact on daily activities.

  ### One Unpleasant Verdict
  - **Case 2 (Twenty Small Things)**: You might not like a Yes verdict if you feel the claimant is "managing" and the issues are trivial. But the procedure, by focusing on cumulative impact and coping burden, leads to Yes. 
  - **Case 3**: You might not like a Yes verdict if previous years were No and the change is small. But the procedure acknowledges that gradual change can cross the threshold.

  ### What the Procedure Cannot Do
  1. **Eliminate Judgment Calls**: Steps 3 (severity) and 4 (compounding) are inherently subjective. The procedure makes the reasoning explicit but doesn't remove discretion.
  2. **Resolve Deep Vagueness**: When a case is truly borderline, the procedure won't magically make it clear. It forces you to articulate a rationale, but the line remains fuzzy.
  3. **Replace Values Decisions**: If the dispute is about what counts as "ordinary daily activities" (e.g., for a bedridden person, is "managing" just basic survival?), that's a policy question for supervisors.
  4. **Handle Contradictory Evidence**: It flags it for escalation but doesn't resolve it.
  5. **Ensure Perfect Consistency**: Human judgment varies. The best we can do is to document reasoning and compare to prototypes.

  ### Final Note
  This procedure is designed to be run in 45 minutes by focusing on key steps and avoiding over-analysis. It accepts that some steps are "judgment calls in procedural clothing" but structures them to reduce arbitrariness. The goal is defensible decisions, not mathematical certainty.
answer: |-
  Below is a practical, step-by-step procedure grounded in real-world constraints (45 minutes per case, no philosophy training) and informed by research on vague thresholds (e.g., the *sorites paradox*, which deals with how small increments create borderline cases). It focuses on **functional impact**, **cumulative effects**, and **transparent reasoning** to handle ambiguity. The procedure acknowledges that "substantial" is inherently fuzzy—it uses **prototype comparison** (comparing to clear-cut examples) and **narrative coherence** (how limitations interact in daily life) to avoid false precision. Judgment calls are explicitly flagged.  

  ---

  ### **The Procedure: 8 Steps for Assessing "Substantial Effect"**  
  **Time Allocation:** Aim for 5–7 minutes per step. Use a timer.  

  #### **Step 1: List All Claimed Difficulties**  
  - **Question:** "What specific limitations does the claimant report or that are documented in their records?"  
  - **What Counts as Sufficient:**  
    - Extract every difficulty mentioned (e.g., "forgets appointments," "avoids crowds," "needs rest after 10 minutes standing").  
    - Ignore diagnoses—focus on **functional effects** (e.g., "cannot stand >10 minutes" not "has arthritis").  
  - **Judgment Call?** No. This is fact-gathering.  
  - **Borderline Handling:** If evidence is conflicting, note it (e.g., "GP says fatigue is mild, but claimant reports being bedridden").  

  #### **Step 2: Map to Daily Activities**  
  - **Question:** "Which *ordinary daily activities* are affected? Use a standard list: Mobility, Self-care, Household tasks, Social/Communication, Planning/Organization."  
  - **What Counts as Sufficient:**  
    - Group difficulties under these categories (e.g., "forgets appointments" → Planning; "avoids crowds" → Social/Mobility).  
    - If ≥1 difficulty affects ≥1 activity, proceed. If none, stop—verdict = **No**.  
  - **Judgment Call?** Minor. Categories are broad, so misfiling is rare.  

  #### **Step 3: Assess Individual Severity**  
  - **Question:** "How severely does *each* difficulty affect its activity? Use:  
    - **Mild:** Annoying but rarely disruptive (e.g., occasionally forgets non-critical appointments).  
    - **Moderate:** Often disruptive; requires adaptation (e.g., always uses a stool to stand).  
    - **Severe:** Prevents or drastically alters the activity (e.g., cannot stand at all)."  
  - **What Counts as Sufficient:**  
    - Rate severity **only if evidence supports it** (e.g., medical notes, claimant’s diary).  
    - If no evidence for severity, default to "mild."  
  - **Judgment Call?** **Yes.** Severity is subjective, but ground it in documentation (e.g., "GP notes confirm standing limitation").  

  #### **Step 4: Check for Cumulative Effects**  
  - **Question:** "Do these difficulties *interact* to worsen daily life? Focus on:  
    - **Domain Overload:** Multiple issues in one activity (e.g., "avoids shops" [mobility] + "overwhelmed by noise" [social] = cannot grocery shop).  
    - **Resource Drain:** Coping consumes excessive time/energy (e.g., "needs 3 hours to cook due to fatigue + pain").  
    - **Unpredictability:** Symptoms fluctuate, creating risk (e.g., "forgets medications" + "falls occasionally")."  
  - **What Counts as Sufficient:**  
    - Evidence of **interdependence** (e.g., claimant’s statement: "I skip meals because cooking hurts and I forget to buy food").  
    - If no interdependence, difficulties are likely *not* cumulative.  
  - **Judgment Call?** **Yes.** Requires inferring connections, but must be plausible (e.g., avoid assuming fatigue causes forgetfulness without evidence).  

  #### **Step 5: Compare to Prototypes**  
  - **Question:** "Is this case closer to:  
    - **Prototype A (Clear Yes):** Single severe limitation (e.g., wheelchair user who cannot cook or bathe alone).  
    - **Prototype B (Clear No):** Minor, isolated issues (e.g., occasional headaches managed with OTC pills)?"  
  - **What Counts as Sufficient:**  
    - **If closer to A:** Verdict = **Yes**.  
    - **If closer to B:** Verdict = **No**.  
    - **If ambiguous:** Proceed to Step 6.  
  - **Judgment Call?** **Yes.** But prototypes anchor consistency (see **Consistency Tip** below).  

  #### **Step 6: Borderline Triage**  
  - **Question:** "After Steps 1–5, is the case still unclear? If yes, apply:  
    - **Coping Test:** Can the claimant consistently manage *without help/adaptations*? If no, lean **Yes**.  
    - **Risk Test:** Could limitations cause harm (e.g., falls, missed meds)? If yes, lean **Yes**."  
  - **What Counts as Sufficient:**  
    - Leaning **Yes** if either test is unmet *and* evidence supports it.  
    - Default to **No** if tests are inconclusive.  
  - **Judgment Call?** **Yes.** Uses values ("harm," "consistency") but minimizes arbitrariness.  

  #### **Step 7: Draft Verdict & Rationale**  
  - **Question:** "Does the *totality* of evidence show a **substantial effect**?"  
  - **Verdict Options:**  
    - **Yes:** Cumulative/interacting limitations disrupt daily life beyond minor inconvenience.  
    - **No:** Limitations are mild, isolated, or well-managed with minimal adaptation.  
  - **Rationale Requirements:**  
    - **Must include:**  
      1. Summary of key difficulties (Step 1).  
      2. How they interact or cumulate (Step 4).  
      3. Prototype comparison (Step 5).  
      4. Borderline reasoning if applicable (Step 6).  
    - **Example rationale for "Yes":**  
      > "Claimant avoids shops (mobility/social), forgets appointments (planning), and cannot stand >10 minutes (mobility). Together, this prevents grocery shopping without help, causes missed medical care, and requires daily adaptations. Comparable to Prototype A in functional impact."  
  - **Time Saver:** Use bullet points; avoid essays.  

  #### **Step 8: Escalate to Supervisor**  
  - **When to Escalate:**  
    - **Values Dispute:** The threshold hinges on contested definitions (e.g., "Is avoiding crowds 'ordinary' for a recluse?").  
    - **Novel Case:** No precedent for the condition/limitation combination.  
    - **High-Risk Conflict:** Evidence is evenly split (e.g., two specialists disagree).  
  - **How:** Flag the case with a note: "Escalate: Values question on [issue]" or "No clear prototype match."  

  ---

  ### **Consistency Tip**  
  - **For Near-Identical Files:** Keep a shared log of 3–5 anonymized "reference cases" (e.g., "Case X: 15 minor issues, verdict No due to no interdependence"). Compare new cases to these during Step 5. If a case matches a reference, adopt its verdict. If not, add it to the log post-decision.  

  ---

  ### **Procedure Applied to Three Cases**  
  **Assumptions:**  
  - 45 minutes total.  
  - All files include medical records, claimant statements, and prior assessments.  

  #### **Case 1: Single Severe Limitation**  
  - **Claimant:** Paraplegia; cannot walk or transfer unassisted.  
  - **Steps:**  
    1. **Step 1:** "Cannot stand or walk; needs help with bathing/toileting."  
    2. **Step 2:** Affects Self-care (bathing), Mobility (all), Household tasks (cleaning).  
    3. **Step 3:** All limitations **severe**.  
    4. **Step 4:** No cumulative assessment needed (single dominant issue).  
    5. **Step 5:** **Closer to Prototype A** (e.g., wheelchair user who cannot cook alone).  
    6. **Verdict: Yes** (5 minutes).  
  - **Rationale:** "Cannot perform basic self-care or mobility without assistance. Matches Prototype A."  
  - **You’ll Like This:** Clear-cut, defensible.  

  #### **Case 2: Twenty Small Things**  
  - **Claimant:** Anxiety, arthritis, mild cognitive issues. Difficulties: forgets appointments, avoids crowds, stands <10 minutes, loses keys, fatigued after light chores, etc.  
  - **Steps:**  
    1. **Step 1:** List all 20 difficulties (e.g., "needs reminders for pills," "shops only at 3 AM").  
    2. **Step 2:** Mostly affects Planning (forgetfulness), Mobility (standing), Social (crowds).  
    3. **Step 3:** All **mild-to-moderate** individually (no single severe issue).  
    4. **Step 4:** **Cumulative?**  
       - Domain Overload: Planning (forgets appointments + pills) + Mobility (cannot stand in lines) = cannot shop safely.  
       - Resource Drain: Spends hours organizing tasks to cope.  
       - Unpredictability: Forgetfulness causes missed bills/meals.  
    5. **Step 5:** **Ambiguous** (not like A or B).  
    6. **Step 6:** **Coping Test Failed** (relies on family for reminders/shopping). Leans **Yes**.  
    7. **Verdict: Yes** (borderline) (15 minutes).  
  - **Rationale:** "Twenty minor limitations cumulatively disrupt daily activities: e.g., avoiding crowds and standing <10 minutes prevent shopping; forgetfulness risks missed medications. Coping requires significant support. Borderline but meets threshold due to interdependence."  
  - **You Won’t Like This:** Feels like "death by a thousand cuts," but the procedure forces a **Yes** due to functional overlap and coping burden.  

  #### **Case 3: Gradual Worsening Over Four Years**  
  - **Claimant:** Early-stage MS; annual reviews show slight decline (e.g., "10% slower walking," "more frequent fatigue").  
  - **Steps:**  
    1. **Step 1:** Current difficulties: "Walks 20% slower than baseline," "needs 2-hour naps daily," "occasionally drops objects."  
    2. **Step 2:** Mobility (walking), Self-care (dressing), Household tasks (cooking).  
    3. **Step 3:** All **moderate** now (were mild in Year 1).  
    4. **Step 4:** **Cumulative?**  
       - Domain Overload: Slow walking + fatigue = takes 2x longer for chores.  
       - Risk: Dropping objects could cause injury while cooking.  
    5. **Step 5:** **Ambiguous** (not clearly A or B; similar to prior "No" verdicts but worse).  
    6. **Step 6:** **Coping Test Failed** (naps disrupt work; chores require help). Leans **Yes**.  
    7. **Verdict: Yes** (borderline) (15 minutes).  
  - **Rationale:** "Gradual decline now results in cumulative limitations: slow mobility and fatigue double chore time; dropping objects creates injury risk. Coping unsustainable without help. Though similar to past cases, current functional impact crosses threshold."  
  - **You Won’t Like This:** Overturns prior "No" verdicts due to worsening, but the procedure prioritizes **current functional impact** over incremental change.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Eliminate Judgment Calls:** Steps 3–6 involve subjectivity (e.g., severity ratings, cumulative impact). The procedure only makes them **transparent and structured**.  
  2. **Define "Substantial" Absolutely:** It treats the threshold as a **spectrum** (like "baldness" in sorites paradox), relying on comparison, not fixed rules.  
  3. **Resolve Values Disputes:** If "ordinary daily activities" is contested (e.g., is online shopping "ordinary"?), it **must escalate** (Step 8).  
  4. **Ensure Perfect Consistency:** Human biases persist, but prototypes and reference cases reduce drift.  
  5. **Fix Sparse Evidence:** If records are incomplete, the verdict defaults to "No" (Step 3)—even if unfair.  

  **Final Advice:** Use Steps 4 (Cumulative Effects) and 5 (Prototypes) rigorously—they address the "twenty small things" problem by emphasizing **functional narrative** over atomized limitations. When in doubt, lean on **coping burden** (Step 6) for borderline cases. And remember: "Substantial" is vague by design; your role is reason-giving, not precision.
