prompt: |-
  so — I'm putting together a one-page write-up of where I've actually landed on the wrong kind of reasons stuff, for a workshop where people have promised to be unkind to it. Before I hand it round I want to know whether the package is even coherent. Here it is:

  1. Reasons are the basic normative notion for me. I don't want value, or fittingness, or ought doing the grounding — I want them cashed out in terms of reasons. Concretely I'm happy with a buck-passing style line: for something to be admirable is roughly for it to have properties of the sort that give reasons to admire it.

  2. The demon case gives a real reason, not an apparent one. If the demon will punish me unless I admire him, the threat genuinely gives me a reason to admire him. I don't want to fudge this into sort-of-a-reason or a reason in a derivative sense — it's a reason, full stop, and I think watering that down is the main way people cheat on the problem.

  3. But the demon is obviously not admirable, and I don't think 1 and 2 clash, becuase the analysans in 1 gets restricted: admirable = having properties that give the RIGHT KIND of reasons to admire.

  4. The right/wrong kind line is drawn by questions. A consideration is a right-kind reason for an attitude just in case it bears on the question that attitude is a way of settling — for belief, whether p; for admiration, whether x is admirable; for fear, whether x is fearsome. Wrong-kind considerations are ones that bear on some other question entirely.

  5. Belief is special on my view. I take transparency and exclusivity seriously, so in the offered-a-thousand-dollars-to-believe-this-white-wall-is-blue case I have no reason at all to believe it's blue — just a reason to try to get myself into that belief. Which is why I think the problem gets over-sold when people run it on belief specifically.

  6. But fear isn't like that. Reward on offer for being scared of a spider I know perfectly well is harmless: the reward gives me a reason to be afraid, not merely a reason to try to make myself afraid. Same status as 2.

  Plus one more: in the mixed case, where someone pays me to admire a painting that is genuinely admirable, the payment adds to my reasons to admire it, so I have more reason to admire it overall than I otherwise would.

  What I want is an audit, not a lecture. Which of these actually pull against each other, ordered by severity, and for each one what has to give and what giving it up costs me. Then tell me which single revision would clean up the most — and dont just say go fittingness-first unless you can show me that 1 is costing me something more than a relabeling.

  I also expect two specific charges, so address them head on: that 2 and 3 flatly contradict each other (a reason to admire that makes nothing admirable), and that 5 and 6 are unprincipled special-pleading for belief. Tell me whether either charge lands or whether it dissolves once you look closely, because I suspect at least one of them doesn't survive contact.

  One thing I care about most, epistemically: keep separate what is actually settled in this area from what's genuinely live. There's a lot of confident assertion flying around here and I don't want my package graded against one camp's standards and presented with those standards as though everyone accepted them. If something I've written is a minority move, or if the obviously in 3 is doing work that only some people would grant, flag it as contested rather than as a mistake.
reasoning: |-
  Okay, let me start by really understanding what this user is asking for. They’re preparing a one-page write-up for a workshop where people will be unkind to it, so they need coherence checks upfront. The core of their framework is reasons-first, with specific stances on demon cases, right/wrong kinds of reasons, and asymmetries between belief and other attitudes.  

  First, I need to map their seven points for internal tensions. Point 1 (reasons as basic) seems foundational. Point 2 (demon gives real reasons) is deliberately provocative. Point 3 (but demon isn’t admirable) uses "obviously" – which is contested but central to their view. The RKR/WKR distinction in point 4 (drawn by attitude-specific questions) is where they reconcile 2 and 3. Points 5 and 6 (belief vs. fear asymmetry) feel vulnerable to special-pleading accusations. The mixed case (payment + genuine admiration) tests consistency.  

  The user explicitly wants an audit, not a lecture. So I’ll avoid normative judgments and focus on:  
  - Which points conflict?  
  - How severe each conflict is?  
  - What concessions would resolve it, and at what cost?  
  - Which single revision would clean up the most?  

  They also flagged two specific charges:  
  1. Does 2 (demon reason) contradict 3 (non-admirable demon)?  
  2. Is the belief/fear asymmetry (5 vs 6) unprincipled?  

  For charge 1: On surface, 2 says "reason to admire demon", 3 says "demon not admirable". But their point 4 resolves this via RKR restriction – the demon’s threat answers "should I admire?" (pragmatic), not "is it admirable?" (evaluative). So no flat contradiction if you accept their RKR/WKR test. But the "obviously" in 3 is doing heavy lifting – realists will balk, constructivists might nod. I’ll note this as "contested" not "mistake".  

  For charge 2: Belief’s transparency (point 5) means reasons only via truth. Fear (point 6) lacks that – pragmatic reasons directly apply. The asymmetry isn’t ad hoc if attitude-specific "questions" (point 4) drive it. But it’ll anger anyone who thinks all attitudes should parallel belief. Cost: bites bullets on "weird" reasons (e.g., reward directly justifies spider-fear).  

  Now, internal tensions:  
  - **Severe tension between 5 and 6?** No – if their "question" criterion explains why belief is exclusive (only truth-relevant) while fear isn’t (harm + non-harm properties both relevant to "fearsome?"). But it’s a cost: they must defend why fear’s question includes consequences.  
  - **Point 2 vs point 1?** Buck-passing says value = reason-giving properties. But demon’s threat gives reason to admire without making it admirable. Point 3’s RKR fix patches this, but purists will say it’s cheating – they’re redefining "admirable" away from "all reason-givers". Cost: buck-passing looks less elegant.  
  - **Mixed case:** Payment adds to admiration reasons without making the painting "more admirable". This coheres – RKR are about admirability, WKR add extra reasons. But it implies two reason-types coexisting, which might irk reductionists.  

  The single best revision? If they drop belief’s exclusivity (point 5), it harmonizes with fear (point 6). But that costs transparency – a huge sacrifice. Alternatively, reframe RKR as not just "questions" but attitude-constitutive standards. Less revisionist.  

  Finally, epistemic care: I’ll flag where their moves are minority views (e.g., demon’s reason being "full stop" – many call it merely pragmatic). And avoid grading against any camp’s dogma.
answer: |-
  Here’s an audit of your package, structured as requested: internal tensions ordered by severity, costs of concessions, the most efficient revision, and responses to the two charges. Contested assumptions are flagged throughout.

  ---

  ### **Internal Tensions (Ordered by Severity)**
  1. **Points 2 + 6 vs. Point 1 (Severe)**  
     - **Conflict:** Point 1 (buck-passing) claims value properties *reduce to* reason-giving properties. But points 2 and 6 allow non-evaluative considerations (threats, rewards) to generate reasons for attitudes *without* generating the corresponding value property (admirability, fearsomeness). This creates pressure: if reasons ground value, how can there be reasons to admire/fear that don’t make the object admirable/fearsome?  
     - **What gives:** Relaxing strict buck-passing (point 1). You’d need to allow that *some* reasons (WKRs) don’t contribute to value properties.  
     - **Cost:** Buck-passing becomes "buck-stopped-partially." You retain reasons as the *central* normative notion but concede they don’t *fully* analyze value (e.g., admirability requires only RKR-grounded reasons). Minority-move alert: Many buck-passers reject this (e.g., Stratton-Lake, Skorupski).  

  2. **Point 5 vs. Point 6 (Moderate)**  
     - **Conflict:** Belief (point 5) has *exclusivity*: only truth-relevant considerations are reasons for belief. Fear (point 6) lacks exclusivity: non-fearsomeness-related considerations (rewards) can be direct reasons. This risks special pleading without a clear principle.  
     - **What gives:** Either (a) drop belief’s exclusivity (allow pragmatic reasons for belief), or (b) deny that fear’s reasons include non-fear-relevant considerations (collapse fear to belief’s model).  
     - **Cost:**  
       - (a) Abandons transparency for belief (heavy cost: central to many epistemologies).  
       - (b) Denies intuition in point 6 (e.g., "reward gives reason to be afraid"). Contested: Some (e.g., Parfit) argue fear *should* mirror belief; others (e.g., Maguire) reject this.  

  3. **Point 4 vs. Point 6 (Mild)**  
     - **Conflict:** Point 4 ties RKR to the attitude’s "question" (e.g., fear asks "is this fearsome?"). But point 6 allows rewards as reasons for fear. If "fearsome" means *meriting fear*, pragmatic rewards don’t bear on that question—they answer "should I be afraid?" (a different question).  
     - **What gives:** Clarify that fear’s "question" includes *instrumental* dimensions (e.g., "is fearing this worthwhile?").  
     - **Cost:** Blurs the line between RKR and WKR. If fear’s "question" is broad, the demon case (point 2) might *also* count as RKR for admiration (undercutting point 3). Contested: Schroeder, Hieronymi dispute whether attitudes have fixed "questions."  

  ---

  ### **Most Efficient Single Revision**  
  **Drop belief’s exclusivity (point 5) and generalize point 6.**  
  - **How it helps:** Treat all attitudes (belief, fear, admiration) uniformly: pragmatic considerations *can* be direct reasons for the attitude, but they don’t affect the evaluative property (admirable/fearsome).  
  - **Why it cleans up most:**  
    - Resolves tension 2 (no special treatment for belief).  
    - Reduces tension 1: Buck-passing is preserved *only* for RKR (e.g., "admirable" = RKR-grounded reasons). WKR exist but don’t contribute to value.  
    - Aligns with point 4: Belief’s "question" is "whether p?"—pragmatics don’t bear on this, so they’re WKR (similar to admiration/fear).  
  - **Cost:** Rejects doxastic transparency (a major concession). But it’s consistent with your broader framework and avoids the special-pleading charge.  

  ---

  ### **Responses to Specific Charges**  
  **Charge 1: "Points 2 and 3 contradict (reason to admire without admirability)"**  
  - **Verdict: Dissolves on closer look.**  
    - Your point 4 (RKR/WKR distinction) resolves this: The demon gives a *WKR* to admire (bearing on "should I admire?"), not an RKR (bearing on "is it admirable?").  
    - Tension arises only if you insist buck-passing requires *all* reasons to contribute to value (which point 1 doesn’t stipulate). Contested note: Critics (e.g., Rabinowicz, Rønnow-Rasmussen) argue this "splits" reasons, but your account can accommodate it.  

  **Charge 2: "Points 5 and 6 are unprincipled special-pleading for belief"**  
  - **Verdict: Lands weakly, but defensible.**  
    - **Why it lands:** Belief is uniquely exclusive (no pragmatic reasons), while fear/admiration aren’t. This *looks* ad hoc without justification.  
    - **Why it dissolves:** Point 4 provides a principle: Belief’s "question" ("whether p?") is uniquely truth-directed. Transparency (point 5) follows from this. Fear’s "question" ("is this fearsome?") may include practical consequences (point 6).  
    - **Cost:** Requires defending that belief’s question is *purely* alethic. Contested: Some (e.g., Shah) argue this is correct; others (e.g., Reisner) say fear’s question is equally "pure."  

  ---

  ### **Contested Assumptions Flagged**  
  - **Point 2 ("demon gives a real reason"):** Many call this merely "practical" or "motivating" (not normative). Minority move.  
  - **Point 3 ("obviously not admirable"):** Constructivists (e.g., Street) might say the demon *is* admirable-if-admiring-avoids-pain.  
  - **Point 4 (attitudes "settle questions"):** Hieronymi’s view is influential but not universally accepted.  
  - **Point 5 (no pragmatic reasons for belief):** Rejected by pragmatists (e.g., Rinard).  

  Your package coheres if you accept the RKR/WKR distinction as attitude-specific. The biggest vulnerability is buck-passing’s ability to handle WKR without collapsing. If the workshop attacks this, stand firm on point 4—it’s your keystone.
