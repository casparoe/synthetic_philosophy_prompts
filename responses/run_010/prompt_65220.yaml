prompt: |-
  I'm trying to work out my own intuitions about tearing down statues and renaming things, case by case, and I want to know what principle, if any, actually fits them.

  1. Confederate general's statue in a city park, put up in 1910 by a heritage society: take it down. Easy.
  2. The same general's name on the county courthouse: take that down too, though I'll admit I feel this one less.
  3. Medical school building named for a 1920s donor who was an open eugenicist, but whose money built the pediatric wing: rename it, and keep a plaque explaining who he was and what he did.
  4. Statue of a suffragist who fought for the vote while openly disparaging Black men: leave it up, add context.
  5. A 1975 mural in a high school gym, painted by students, showing the town's founder alongside the people he enslaved — accurate, and the descendants find it degrading: I say paint over it. Which shocks me a bit, since it's the most truthful item on this list.
  6. Street named after a much-loved local fire chief who, it turns out, informed on three neighbors during the McCarthy years: leave it alone. Structurally this looks just like #3 and I'm giving the opposite verdict.
  7. War memorial listing locals who died fighting for the colonial power against the independence movement, in a country that's now independent: leave it. But that reads like #1 from the other side — a monument raised by the losers after the loss.
  8. Bench plaque in the same town, "in loving memory of" a decent man who also abandoned his kids: the family keeps it, obviously.

  My rough guess at a principle is that what matters is whether the thing honors someone as worthy of emulation, as opposed to merely recording them or their victims — but that doesn't explain #5, and I dont think it separates #6 from #3 either.

  So: can you state a principle, or a small set of candidate ones, that delivers most of these verdicts — clause by clause, with the case that motivated each clause? Then tell me what it comes out as on cases I haven't listed: a city renaming a street after a living philanthropist who is later convicted; a university keeping the name of a founder whose views were utterly standard for his time; a statue of a scientist put up by his own students rather than by the state. And be honest about which of my verdicts it can't save and I should just drop.
reasoning: |-
  Okay, the user is trying to figure out their own intuitions about when to tear down statues or rename things. They've listed eight specific cases with their verdicts and are looking for a principle that fits most of them. They also want to test this principle on new cases. Let me start by understanding each case and their verdicts.

  First, the Confederate general statue from 1910 by a heritage society: taken down. That makes sense because it's a symbol of oppression and white supremacy, erected during the Jim Crow era to intimidate. The user sees this as easy.

  Next, the same general's name on the courthouse: also taken down, but the user feels less strongly. Maybe because it's less prominent than a statue? But the courthouse is a government building, so honoring someone who fought against the U.S. is problematic.

  Then, the medical school named after a eugenicist donor. Rename but keep a plaque. The user distinguishes between honoring and acknowledging the past. The eugenics is bad, but the building serves a good purpose. A plaque provides context without honoring.

  The suffragist statue who was racist: leave it up with context. Here, the user accepts flawed figures if their main contribution is positive, but context is needed for their flaws. 

  The 1975 mural showing the town founder with enslaved people: paint over it because descendants find it degrading. Even though it's truthful, the harm to the community outweighs historical value. This seems emotional rather than principle-based.

  The street named after a fire chief who informed during McCarthy: leave it alone. The user sees the good (fire chief) outweighing the bad (informing). But why is this different from the eugenicist donor? Maybe because the fire chief's role was local heroism, and informing isn't the core of his identity?

  The war memorial for colonial fighters: leave it. It's about remembering the dead, not endorsing colonialism. Similar to #7 but kept because it's a memorial, not a tribute to the cause.

  The bench plaque for a man who abandoned his kids: family keeps it. Personal memorials are private matters; public judgment doesn't apply.

  The user's initial principle is about honoring vs. recording. But it doesn't explain the mural (#5) or the fire chief vs. eugenicist (#6 vs. #3). 

  So, I need a better principle. How about three factors: purpose, power, and current harm. Purpose: why was it created? To honor or remember? Power: who has the authority to decide? Current harm: does it cause ongoing harm?

  For the Confederate statue (#1), purpose was to intimidate during Jim Crow, power was oppressive group, harm is ongoing. Remove. Courthouse name (#2): similar reasons. Rename the med school (#3): purpose was honoring a donor, but eugenics is harmful. Plaque contextualizes without honoring. Suffragist statue (#4): purpose was to honor suffrage, but racism is a flaw. Context added. 

  Mural (#5): purpose is historical, but causes harm to descendants. Paint over because harm outweighs truth. Fire chief street (#6): purpose was to honor local service. Informing is a flaw, but not the primary reason for the honor. Leave it. War memorial (#7): purpose is remembrance, not endorsement. Harm is minimal. Bench (#8): personal memorial, not public honor. Family decides.

  Testing new cases: Living philanthropist convicted later? Rename because public honor should reflect current values. Founder with standard views for his time? Keep with context, as judging past by present standards isn't fair. Scientist statue by students? Keep as non-state actors, more about personal respect.

  But the mural (#5) is tricky. The principle might allow removal due to harm, but the user might need to accept that harm can override truth in some cases. The fire chief (#6) is kept because the harm isn't ongoing or central to his honor, unlike the eugenicist's views which were integral to his public actions.

  So the key principles are: purpose, power, and harm. The mural causes active harm to a marginalized group, so it's removed even if truthful. The fire chief's informing might be seen as a personal flaw, not detracting from his public service. But if the eugenicist's actions were part of his public identity, that's different. 

  The user might need to weigh harm more heavily, especially when it affects current communities. For #5, the descendants' pain makes the mural's display in a school inappropriate, even if accurate. It's about the context—truth in a history class is different from a gym mural where it's constantly visible without context.

  So the refined principle is: Remove or contextualize when the primary purpose is to honor someone whose actions conflict with current values and cause ongoing harm, considering who erected it and who is affected now.
answer: |-
  Here's a principle derived from your intuitions, designed to fit your verdicts while addressing inconsistencies. I'll break it down clause-by-clause, show how it handles your cases, test it on new examples, and identify where it conflicts with your judgments:

  ---

  ### **The Principle: Contextual Public Honor**
  **Remove or rename when:**
  1.  **The primary purpose is to *honor* a specific person/action** (not primarily to remember, mourn, or document).
  2.  **The honoree's *core legacy or the specific act celebrated* is fundamentally incompatible with current core values** (especially involving oppression, betrayal, or severe harm).
  3.  **The honoring causes *ongoing, significant harm* to a community**, outweighing its historical/documentary value.
  4.  **The honoring entity represents *public authority* (state, institution, community)** – not private or family sentiment.

  **Otherwise:**
  *   **Contextualize** (plaques, exhibits, reinterpretation) if the figure/event is historically significant but flawed.
  *   **Preserve** if it primarily memorializes loss, documents history neutrally, or is a private act.

  ---

  ### **How It Explains Your Cases (Clause-by-Clause)**

  1.  **Confederate Statue (1910):** Remove.
      *   *Clauses:* 1 (Honors), 2 (Core legacy: treason for slavery), 3 (Harm: symbol of white supremacy), 4 (Public park/heritage society acts as public authority).
  2.  **Confederate Name on Courthouse:** Remove.
      *   *Clauses:* 1 (Honors), 2 (Core legacy), 3 (Harm on government property amplifies endorsement), 4 (Government building).
  3.  **Eugenicist Med School:** Rename + Contextual Plaque.
      *   *Clauses:* 1 (Honors donor), 2 (Core legacy/honored act: eugenics is fundamentally incompatible), 3 (Harm: celebrating eugenicist). **BUT:** The *building's function* (pediatric care) is good. Renaming removes honor; plaque provides context/documentation without honoring.
  4.  **Racist Suffragist Statue:** Leave + Context.
      *   *Clauses:* 1 (Honors), 2 (**Not Core Legacy:** Racism is severe flaw, but core honored act is suffrage advancement, compatible with current values). 3 (Harm exists, but contextualization mitigates it). Context adds necessary nuance.
  5.  **Degrading Mural:** Paint Over.
      *   *Clauses:* 1 (**Not Primary Purpose:** It documents, but *how* it documents is key). 3 (**Harm is Primary:** It causes significant, ongoing harm to descendants *as displayed* (gym setting). Its "truth" is outweighed by its degrading impact in that context. The harm clause (3) overrides documentary value here.
  6.  **Fire Chief Street:** Leave Alone.
      *   *Clauses:* 1 (Honors), 2 (**Not Core Legacy:** Honored for fire service (compatible); informing is a separate, severe flaw, but not the *reason* for the honor). 3 (Harm likely minimal/outweighed by community's positive association with his service role). 4 (Public, but core reason for honor isn't incompatible).
  7.  **Colonial War Memorial:** Leave.
      *   *Clauses:* 1 (**Purpose is Memorial, not Honor:** Lists the dead, primarily commemorates loss/sacrifice, even if for the "wrong" side). 2 (Not honoring the colonial *cause* itself). Contextualization might be added, but removal isn't required.
  8.  **Bench Plaque (Flawed Man):** Keep.
      *   *Clauses:* 1 (Honors memory), BUT 4 (**Not Public Authority:** Private/family act of remembrance). Public judgment of flaws doesn't override private mourning.

  ---

  ### **Handling Your Inconsistencies**
  *   **#3 (Eugenicist) vs. #6 (Fire Chief):** The principle separates them via **Clause 2 (Core Legacy)**. The med school *honors the man/donor*, whose core public legacy included harmful eugenics. The street honors the fire chief *specifically for his fire service* (core legacy), not for informing. Informing is a terrible act, but separable from the *reason for the honor*.
  *   **#5 (Mural):** Your verdict prioritizes preventing harm (Clause 3) over truthful documentation *in this specific, harmful context*. The principle captures this by weighting ongoing harm heavily. A museum display might be different.
  *   **#1/#7 (Losers' Monuments):** #1 honors a cause (slavery/treason - Clause 2). #7 memorializes individuals who died (Clause 1 - purpose is memorial, not cause endorsement).

  ---

  ### **Applied to New Cases**

  1.  **City Renames Street After Living Philanthropist; Philanthropist Later Convicted (e.g., fraud):**
      *   **Verdict:** **Rename.** (Clauses 1 & 2: Honors a person; core legacy now includes serious crime incompatible with public honor).
  2.  **University Founder Had Utterly Standard (But Now Abhorrent) Views for His Time (e.g., supported slavery in 1750):**
      *   **Verdict:** **Keep Name + Context.** (Clauses: 1 (Honors), BUT 2 (**Not Core Legacy:** The core reason for honor is founding the university; the views, while abhorrent now, were the societal norm *and* not the specific reason for the honor). Context is essential.
  3.  **Statue of Scientist Put Up By His Own Students (Not State):**
      *   **Verdict:** **Generally Preserve + Context if needed.** (Clauses: 1 (Honors), 4 (**Less Public Authority:** Erected by individuals based on personal/professional respect). Unless the scientist's core work (Clause 2) or personal acts were fundamentally incompatible (e.g., horrific human experimentation), the private group's act of honoring carries weight. Context could address flaws.

  ---

  ### **Verdicts the Principle *Can't* Save (And You Should Consider Dropping)**

  1.  **Your Feeling on #2 (Courthouse Name) vs. #1 (Statue):** The principle treats them identically (Public honor of core incompatible legacy). Your stronger feeling about the statue is likely aesthetic/emotional (a statue is more visceral than a nameplate). The principle doesn't justify treating them differently.
  2.  **The Fire Chief (#6) vs. McCarthy Era Harm:** If the harm caused by his informing was severe and well-known (e.g., neighbors imprisoned/lives ruined), and the community *now* feels the honor is an endorsement of that betrayal, **Clause 3 (Harm)** could justify renaming, conflicting with your verdict. Your verdict downplays the harm relative to his service. The principle allows for renaming if the harm is deemed significant and ongoing.
  3.  **The Bench Plaque (#8):** Strictly, the principle preserves it due to Clause 4. However, if the plaque were on a *public building* honoring him as "Citizen of the Year," abandoning his kids *might* trigger Clause 2/3 if it fundamentally contradicts the basis of the public honor.

  **Conclusion:** Your intuitions primarily hinge on **why the thing exists** (honor vs. memory/documentation), **what specifically is being honored** (core legacy vs. peripheral acts), the **impact of its continued presence** (harm vs. value), and **who put it there** (public authority vs. private actors). The "Contextual Public Honor" principle formalizes this. The biggest tension point is how heavily to weigh **ongoing harm (Clause 3)**, as seen in the Mural (#5) and potentially the Fire Chief (#6). This is inevitably context-dependent and subjective.
