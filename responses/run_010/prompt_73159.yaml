  First, I need to build a strong case for this. Historical examples come to mind: the Factory Acts in Britain relied on employment records, species conservation uses population surveys. The user mentions farmed animals as a counterpoint—why are they still marginal despite being highly counted? That’s a key point. Maybe because their legibility serves exploitation, not protection. Future generations, though uncountable, get moral talk through proxies like sustainability metrics. 

