prompt: |-
  For the better part of a year I have been reporting on invertebrate welfare — insect farming, municipal mosquito control, the ethics of field collecting — and somewhere along the way I began keeping a private ledger of the practices I would personally sign off on. I would like to know what principle, if any, the entries add up to.

  The entries, in the order I wrote them down. A museum's ethyl acetate killing jar for collecting beetles: not fine. Letting the same beetles desiccate in a dry vial: fine, though I cannot tell you why that is the better outcome. Freezing a vial of Drosophila at the end of an experiment: fine. Boiling a lobster alive: not fine. Sedating crayfish in a clove-oil bath before killing them: fine, and better than freezing them. A municipal larvicide program that destroys what I will generously call a trillion mosquito larvae to prevent a dozen human cases of West Nile virus: fine. Swapping one sodium streetlight for a warmer LED so that a few thousand fewer moths are drawn into it each season: a genuine moral improvement, not a rounding error. A gene drive built to collapse a regional mosquito population, with a body count on the same order as the larvicide's: not fine. A cricket-flour protein bar: fine. Eating a handful of live crickets on camera as a stunt: not fine. A survey protocol that photographs and releases specimens instead of collecting them: fine, even though it requires roughly ten times the site visits and so, through trampling and repeated netting, probably kills more insects than the collecting it replaces.

  My own tentative rule is that I should minimize expected harm, computed as my credence that the animal is sentient, multiplied by the number of animals, multiplied by something standing for the intensity and duration of what they undergo. That rule does most of the work, but it renders the larvicide and the gene drive morally identical, which I decline to accept, and it dissolves the streetlight into insignificance, which I also decline to accept. I have begun to suspect that my ledger tracks how easily I can picture an animal's death rather than anything about the animal: the trillion larvae are unfilmable, and that may be the whole of my acquittal.

  So I want the principle, or the short list of candidates, that my entries actually support — stated precisely, with the entry that motivates each clause, and with its verdicts on two or three cases I have not thought to list. Then apply it to the question I keep circling: whether a city should treat mosquito abatement as a welfare problem at all, given that it would have to weigh a trillion unfilmable deaths against a dozen human cases, and given that my streetlight verdict appears to commit me to counting the former. Finally, be explicit about which entries a coherent principle is forced to overturn, and whether it can overturn them without overturning the ones I care most about. If the price of saving every entry is a rule no one could actually apply, tell me so and give me the bill.
reasoning: |-
  Hmm, the user has presented a fascinating ethical puzzle about invertebrate welfare. They've been keeping a ledger of practices they personally approve or disapprove, and now want to understand the underlying principle. The examples range from museum specimen collection to mosquito control programs.

  Looking at their list, several patterns emerge. Practices involving direct, observable suffering (like boiling lobsters alive or eating live crickets) are rejected, while less visible harms (like letting beetles desiccate) are accepted. Scale matters too - large-scale interventions like gene drives are rejected even when similar-scale larvicide programs are accepted. There's also a distinction between instrumental use (cricket flour bars) versus gratuitous harm (cricket-eating stunts).

  The user has already tried a utilitarian framework but found it unsatisfying - it can't explain why they treat larvicide and gene drives differently, or why small improvements like streetlight changes feel significant.

  For an underlying principle, I'm considering a three-part framework: 1) Avoidance of perceptible suffering, 2) Scale proportionality with a threshold effect, 3) Intentionality and purposefulness of harm. This would explain most of their judgments - like why freezing Drosophila is acceptable (instant death) while boiling lobster isn't (observable distress).

  Applying this to mosquito abatement: the framework suggests cities should address welfare concerns within practical limits - prioritizing low-cost interventions (like streetlight changes) while recognizing that large-scale larvicide programs, though tragic, may be justifiable for public health. But gene drives cross a threshold into unacceptable territory due to their irreversible nature.

  I need to honestly note where this principle conflicts with some entries - like why desiccating beetles is deemed acceptable despite likely involving suffering. The framework would overturn this judgment. Similarly, their intuition about survey protocols (preferring photographing despite higher incidental deaths) doesn't neatly fit.

  The key insight is that visualizability of suffering matters more than users admit - but we can build a coherent ethic without relying solely on that bias. The proposed principle balances welfare concerns with practical constraints, while acknowledging the special moral weight of direct, intentional harm.
answer: |-
  Your ledger reveals a consistent, multi-principled ethical framework focused on **minimizing perceptible suffering, respecting the scale and context of harm, and prioritizing avoidance of direct, intentional cruelty.** Below is the precise principle derived from your entries, its application to new cases, implications for mosquito abatement, and necessary revisions to your ledger.

  ---

  ### **The Principle: Minimization of Perceptible Suffering with Contextual Constraints (MPSC)**
  1.  **Avoid Perceptible Suffering (Intensity/Duration):** *Direct harm causing observable distress (e.g., thrashing, escape attempts) is prohibited unless absolutely necessary.*  
      *Motivated by:* Boiling lobster (not fine), eating live crickets (not fine).  
      *Justifies:* Sedating crayfish (fine; avoids distress), freezing Drosophila (fine; rapid/unobservable).  

  2.  **Minimize Suffering at Scale with Proportionality:** *Large-scale harm is permissible only if it achieves significant, non-speculative benefits and employs the least distressing method available. Catastrophic or irreversible harm (e.g., extinction) is disproportionately weighted.*  
      *Motivated by:* Larvicide (fine: prevents disease) vs. Gene drive (not fine: irreversible collapse).  
      *Justifies:* Warmer LED streetlights (fine: scalable harm reduction).  

  3.  **Reject Gratuitous or Performative Harm:** *Harm inflicted for trivial reasons (e.g., entertainment, convenience) is impermissible, even if small-scale.*  
      *Motivated by:* Eating live crickets on camera (not fine).  
      *Justifies:* Cricket-flour bar (fine: nutritional purpose).  

  4.  **Accept Non-Perceptible Death:** *Death without observable suffering (e.g., desiccation, rapid freezing) is permissible if it serves a legitimate purpose.*  
      *Motivated by:* Desiccating beetles (fine), freezing Drosophila (fine).  

  ---

  ### **Verdicts on Unlisted Cases**
  1.  **Commercial beekeeping (honey extraction):**  
      *Verdict:* **Fine** under MPSC. Stress is minimized (smoke calms bees), purpose is nutritional/commercial, no observable suffering during honey harvest if done properly.  

  2.  **Pesticide use on aphids in home gardening:**  
      *Verdict:* **Not fine** under MPSC. Neurotoxins cause prolonged thrashing (violates #1), scale is trivial (violates #2 proportionality), purpose is often cosmetic (violates #3). Neem oil (slower, less distressing) would be preferable.  

  3.  **Accidental roadkill during nighttime driving:**  
      *Verdict:* **Fine** under MPSC. Suffering is incidental (not intentional), unavoidable for transportation, and death is instantaneous for most insects.  

  ---

  ### **Mosquito Abatement as a Welfare Problem**
  *   **Should cities weigh welfare?** **Yes, but with severe constraints.**  
      *   MPSC compels low-cost, low-effort interventions that reduce suffering (e.g., switching streetlights).  
      *   Larvicide programs are **permissible** under #2: they prevent serious human disease (significant benefit), use relatively quick methods (e.g., Bti toxin), and avoid perceptible suffering in larvae.  
      *   Gene drives remain **impermissible** due to catastrophic scale and irreversibility (violates #2 proportionality).  
  *   **The "trillion unfilmable deaths" dilemma:**  
      MPSC *does* count them, but prioritizes **efficiency**. A city should:  
      1.  Implement all welfare improvements that align with public health goals (e.g., warmer LEDs near wetlands).  
      2.  Use the *least distressing* larvicide (e.g., Bti over oil-based smothering).  
      3.  **Not** divert resources from human health to reduce larval suffering if it compromises disease control. Welfare gains must be *ancillary* to the primary goal.  

  ---

  ### **Coherent Revisions to Your Ledger**
  The MPSC principle forces two revisions for consistency:  
  1.  **Ethyl acetate killing jar vs. desiccation:** *Both must be "fine" or both "not fine."*  
      *   **Revision:** Desiccating beetles is **not fine**. Ethyl acetate causes rapid unconsciousness (likely *less* suffering than slow desiccation). Your intuition likely conflates "natural" desiccation with minimal suffering, but evidence suggests dehydration is distressing. MPSC (#1, #4) requires the fastest, least perceptible method available.  
      *   *Why keep core entries?* Lobster boiling/eating live crickets remain "not fine" due to perceptible suffering (#1) and performative harm (#3). Larvicide remains "fine" under #2.  

  2.  **Survey protocol (photography vs. collecting):**  
      *   **Revision:** If photography *increases* net deaths (via trampling), it is **not fine** under MPSC (#2: scale inefficiency). Purposeful collection with rapid killing is preferable if it reduces total harm.  
      *   *Exception:* If collected specimens advance critical conservation research, the purpose may justify harm.  

  ---

  ### **The Cost of Saving Every Entry**
  Saving *all* entries requires a **subjective "imaginability coefficient"** (e.g., weighting harm by how vividly you visualize it). This is ethically untenable:  
  - It condemns larvicide (unfilmable) but excuses boiling lobster (vivid).  
  - It makes streetlights significant (visualizable moths) but larvae insignificant.  
  - **The bill:** Moral reasoning becomes arbitrary and self-indulgent. A city using this rule might switch streetlights (easy to picture) but ignore larvicide welfare (hard to picture), despite the latter affecting vastly more individuals.  

  ---

  ### **Conclusion**
  Your ledger follows **MPSC**, prioritizing the reduction of observable suffering and rejecting cruel or disproportionate interventions. It demands cities address invertebrate welfare in mosquito control *where practical* (e.g., streetlights, humane larvicides) but permits large-scale harm for vital public health. The revisions to beetle desiccation and survey protocols are necessary for coherence—**without** undermining your core aversion to vivid cruelty (lobster, live crickets) or your defense of scalable improvements (streetlights). The principle is demanding but applicable: it forces trade-offs but avoids unworkable subjectivity.
