prompt: |-
  My friend, who does software licensing for a living, and I spent most of a long dinner last night arguing about whether the law has already settled the question of whether ideas can be owned. He thinks it has. His exhibit was the Supreme Court's opinion in Baker v. Selden, 101 U.S. 99 (1879), which he reads as a court declaring, on metaphysical grounds, that ideas and methods are simply not the kind of thing that can belong to anyone. I argued the opposite: that the opinion says nothing of the sort, and is instead making a narrower point about what one particular statutory instrument — copyright in a book — can and cannot reach. He said I was splitting hairs, since the Court expressly calls the truths of a science the common property of the whole world. We did not resolve it, and I have come to suspect we were both reading past the sentences.

  Here is the passage I have been working from. For context: Selden had obtained copyright in a book called Selden's Condensed Ledger, or Book-keeping Simplified, which explained a system of bookkeeping and annexed ruled forms and headings illustrating it; Baker produced account books achieving the same results by a different arrangement of columns and different headings. The opinion of Bradley, J.:

  "It is contended that he has secured such exclusive right, because no one can use the system without using substantially the same ruled lines and headings which he has appended to his books in illustration of it. In other words, it is contended that the ruled lines and headings, given to illustrate the system, are a part of the book, and, as such, are secured by the copyright; and that no one can make or use similar ruled lines and headings, or ruled lines and headings made and arranged on substantially the same system, without violating the copyright.

  . . . Where the truths of a science or the methods of an art are the common property of the whole world, any author has the right to express the one, or explain and use the other, in his own way. As an author, Selden explained the system in a particular way. It may be conceded that Baker makes and uses account-books arranged on substantially the same system; but the proof fails to show that he has violated the copyright of Selden's book, regarding the latter merely as an explanatory work; or that he has infringed Selden's right in any way, unless the latter became entitled to an exclusive right in the system.

  . . . And this is really the question to be decided in this case. Stated in another form, the question is, whether the exclusive property in a system of book-keeping can be claimed, under the law of copyright, by means of a book in which that system is explained? The complainant's bill, and the case made under it, are based on the hypothesis that it can be.

  . . . There is no doubt that a work on the subject of book-keeping, though only explanatory of well-known systems, may be the subject of a copyright; but, then, it is claimed only as a book. Such a book may be explanatory either of old systems, or of an entirely new system; and, considered as a book, as the work of an author, conveying information on the subject of book-keeping, and containing detailed explanations of the art, it may be a very valuable acquisition to the practical knowledge of the community. But there is a clear distinction between the book, as such, and the art which it is intended to illustrate. The mere statement of the proposition is so evident, that it requires hardly any argument to support it. The same distinction may be predicated of every other art as well as that of book-keeping."

  I would like help reading this closely, and then help deciding which of our two positions the text actually supports. Specifically:

  1. Give me a sentence-by-sentence plain rendering of the excerpt, including the nineteenth-century legal locutions I am unsure of — what it means to say a bill is "based on the hypothesis," what is being "predicated of every other art," and what force "as such" carries in "the book, as such."

  2. What kind of distinction is the one between the book and the art? Is it an ontological claim about two sorts of object, a claim about two sorts of human activity (describing a practice versus engaging in it), or a claim about the scope of two different legal instruments? Point to the wording that decides the matter.

  3. The Court says the mere statement of the proposition is so evident that it requires hardly any argument. But the complainant's contention, quoted in my first paragraph, is precisely that the separation cannot be performed: no one can use the system without using substantially the same ruled lines and headings. Does the passage answer that contention, or does the appeal to obviousness bypass it? If it bypasses it, is that a defect in the reasoning or an artifact of what a court needs to establish in a case like this one?

  4. Take apart the sentence beginning "Where the truths of a science or the methods of an art are the common property of the whole world." Note that it grants a right not only to express and explain but to use. What is the status of the premise — a description of how ideas are, a statement of positive law, or a normative commitment about what must be left open for others? And does "common property" mean unowned, or does it mean owned in common, which is not the same thing? This sentence is the one my friend leans on hardest, so I want it read against him and against me, whichever way it falls.

  5. The Court concedes that the book may be a very valuable acquisition to the practical knowledge of the community, and that it may explain an entirely new system, then denies the claim anyway. What conception of copyright does that concession presuppose, and why is the book's value or novelty beside the point on that conception?

  6. Then adjudicate. State the strongest version of my friend's reading and the strongest version of mine, and say which the excerpt better supports — or whether the text supports a third reading neither of us had. If it turns out he is right, say so plainly.

  7. Finally, tell me where the distinction comes under pressure and whether the passage contains resources to handle it. My own candidate pressure points are cases where the art cannot be practiced except through its embodiment, and where the embodiment is itself the thing used rather than a description of it — though I do not want you to accept those candidates merely because I offered them.

  Two constraints. Reason from the text I have given you and from general argument; I am not looking for a bibliography, a list of authorities, or citations to later cases or commentary, and I would rather you not supply them. And since I have excerpted rather than reproduced the opinion, if any of your conclusions depend on material I have left out, flag that dependency explicitly instead of reconstructing what you think the rest of the opinion says.
reasoning: |-
  Okay, let me approach this systematically. The user presents a nuanced legal debate about Baker v. Selden, seeking close textual analysis without external references. 

  First, I need to unpack the 19th-century legal language. Phrases like "bill based on the hypothesis" likely mean Selden's lawsuit assumed copyright could protect his accounting system. "Predicated of every other art" suggests the book-art distinction applies universally. "As such" in "the book, as such" emphasizes the work qua copyrighted text, not its underlying ideas.

  The core distinction appears functional, not ontological. The Court contrasts conveying knowledge (copyrightable) with practicing methods (uncopyrightable). Key evidence: "conveying information" versus "the art which it is intended to illustrate." This frames copyright's scope, not metaphysical ownership of ideas.

  The "common property" sentence troubles me. It seems declarative but in context functions normatively - a policy choice ensuring public access to fundamental knowledge. "Common property" implies non-exclusive access rights, distinct from communal ownership. The grant of "use" rights confirms this operational focus.

  Notably, the Court doesn't fully engage Selden's merger argument (system=forms). By calling the distinction self-evident, it treats separable expression as axiomatic. This might reflect judicial efficiency - if expression isn't copied, no infringement exists regardless of system dependence.

  The concession about the book's value reveals copyright's purpose: incentivizing knowledge dissemination without monopolizing practical application. Novelty becomes irrelevant because copyright protects explanatory text, not functional advantages.

  Weighing both readings: 
  - Friend's "metaphysical" view overreaches. The Court never denies ownership of ideas generally (trade secrets? patents?), just under copyright. 
  - User's "statutory scope" interpretation fits better. The holding targets copyright's limits, citing patent law's role for functional systems.

  Pressure points emerge when expression merges with function (like forms inseparable from methods). But the Court anticipates this by requiring actual copying of expression, not just equivalent results. Its "different arrangement" finding in Baker shows this principle applied.

  Ultimately, the text supports the user. The ruling carefully avoids broader ideology, anchoring everything to copyright's statutory purpose. I'll craft this analysis with precise textual anchors and logical progression.
answer: |-
  Here's a close reading guided by your questions, confined strictly to the text provided:

  ### 1. Plain Rendering of Key Sentences
  - **"the complainant's bill... are based on the hypothesis that it can be"**:  
    Selden's lawsuit *assumes as its foundational legal premise* that copyrighting a book explaining a system automatically grants exclusive rights to the system itself.  
  - **"The same distinction may be predicated of every other art"**:  
    This separation between the physical book and the abstract method *applies equally* to all technical fields (e.g., carpentry, medicine), not just bookkeeping.  
  - **"the book, as such"**:  
    "As such" means *in its specific identity* as a copyrighted textual work. Copyright protects *the book qua book*—its written expression—not the functional content it describes.  

  ### 2. Nature of the "Book vs. Art" Distinction  
  It is **a claim about the scope of copyright law**, not ontology or human activity. The Court contrasts:  
  - **"the book... conveying information"** (copyrightable expression)  
  - with **"the art which it is intended to illustrate"** (uncopyrightable method).  
  **Decisive wording**: "considered *as a book*... conveying information" vs. "the *art*." The focus is on what copyright law protects ("claimed only as a book"), not philosophical categories.  

  ### 3. The "Obviousness" Claim vs. Selden's Contention  
  - **Selden's argument**: The forms are inseparable from the system; using the system *requires* copying the forms.  
  - **Court's response**: The distinction is deemed self-evident ("mere statement... requires hardly any argument"). **This bypasses the contention** that merger (system=forms) negates the distinction.  
  - **Assessment**: Legally defensible but analytically shallow. The Court sidesteps merger by treating separability as axiomatic. This reflects a judicial priority: establishing bright-line copyright boundaries trumps debating functional inseparability *in this context*. The ruling implies that if Baker used different forms (even if achieving identical results), no infringement occurred—regardless of whether Selden’s forms were "necessary" to practice the art.  

  ### 4. "Common Property" Sentence: Deconstruction  
  - **Text**: "Where the truths of a science or the methods of an art are the common property of the whole world, any author has the right to express the one, or explain *and use* the other..."  
  - **Status of Premise**: **Normative commitment** (what *must* be free for public use), framed as a legal principle. It’s not a description of fact (some ideas *are* owned via patents) nor pure positive law (it’s invoked to *interpret* copyright).  
  - **"Common property"**: **Unowned** (res communis), not owned collectively. Key evidence: "the whole world" implies universal, unrestricted access. "Property" here is metaphorical—ideas are *like* public lands, open to all.  
  - **Against your friend**: The sentence *assumes* ideas are unowned to justify copyright’s limits; it doesn’t *declare* ideas metaphysically unownable. Patents explicitly own methods *via statute*.  
  - **Against you**: The Court roots copyright’s exclusion of methods in this broader principle, implying it’s foundational to intellectual property law.  

  ### 5. Concession of Value/Novelty & Copyright’s Purpose  
  - **Concession**: Selden’s book might be novel and valuable to public knowledge.  
  - **Why irrelevant?**: Copyright incentivizes *dissemination of knowledge* ("conveying information"), not control over practical application. Protecting the book rewards Selden for *explaining* the system; it doesn’t grant a monopoly on *using* it. Novelty/value might matter for patents, but copyright protects expression, not utility.  

  ### 6. Adjudication of Your Positions  
  - **Friend’s strongest reading**: The Court grounds its holding in a universal principle: ideas/methods ("truths of science," "methods of art") are inherently public property, beyond private ownership. "Common property of the whole world" is a metaphysical declaration.  
  - **Your strongest reading**: The Court addresses *only* copyright law’s scope. Copyright protects expression in books; it cannot monopolize functional systems, which (if protectable at all) require patents. Distinction is statutory, not ontological.  
  - **Verdict**: **Your reading is better supported**. The opinion:  
    (a) Focuses on "the law of copyright" and statutory boundaries ("claimed only as a book");  
    (b) Contrasts copyright with patent law *by implication* (methods require patents);  
    (c) Avoids broad metaphysical claims—"common property" is invoked to justify copyright’s limits, not deny *all* ownership of ideas (e.g., via patents).  
  **Conclusion**: The text supports a copyright-specific rule, not a universal theory of idea-ownership. Your friend overreads "common property."  

  ### 7. Pressure Points & Textual Resources  
  - **Pressure point 1 (Art requires embodiment)**: If an art *cannot* be practiced without copying expression (e.g., Selden’s forms), does merger negate distinction?  
    - **Textual resource**: The Court notes Baker used "different arrangement of columns." By finding no infringement despite equivalent results, it implies **copyright requires literal copying of expression**, not just functional equivalence. If forms were truly inseparable, the case might differ—but the Court avoids this scenario.  
  - **Pressure point 2 (Embodiment is the art)**: If the book *is* the functional tool (e.g., a unique tax form), not just description.  
    - **Textual resource**: The Court insists "the art" is distinct from the book "as such." It would likely deem the form uncopyrightable if its structure is purely functional (patent territory). Copyright protects original *expression* in the form’s design, not its mechanical use.  
  - **Key limitation**: The text assumes expression and function *are* separable ("different arrangement" suffices). It lacks tools for when they fuse inextricably.  

  **Final Note**: The excerpt contains no *explicit* dependency on omitted material. Its reasoning stands internally consistent for copyright disputes over functional systems.
