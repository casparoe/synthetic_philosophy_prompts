prompt: |-
  I am a third-year doctoral student in a lab that collects first-person reports alongside psychophysical measures — detection thresholds, forced-choice discrimination, confidence ratings — and our PI is drafting the analysis plan for a preregistered study. She wants a written criterion, stated in advance, for deciding which trials' reports enter the report dataset and which get set aside as performance artifacts. I have been working through Dennett's heterophenomenology as the philosophical frame for this, because it promises that a subject's own reports are data to be explained rather than privileged testimony about a private theater, and because that promise seems to say I should keep almost everything. In practice I keep almost nothing consistently. Here are my actual verdicts.

  1. A patient with a scotoma in his left field denies seeing anything there on every trial, yet his orientation discriminations within the scotoma run well above chance. I keep the denials as data, and I do not let the above-chance guessing demote them; the guessing goes in a separate column entirely.
  2. A subject reports, confidently and unprompted, a vivid saturated red afterimage, but is at chance in a two-alternative forced choice between two reds presented where the afterimage is. I keep the report that there is some red-ish phenomenal character, but I refuse to treat it as evidence that his experience carries the fine-grained determinate shade he attributes to it. So it is partly kept, and I cannot say what determines the part.
  3. In a change-blindness trial the central object of the scene is swapped during a blink and he reports that nothing changed. I keep that report without qualification. When he adds, five minutes later, that he certainly would have noticed any change, I discard the addition outright as hindsight — though it comes from the same mouth in the same session.
  4. A waking dream report: flying over a walled city, emotionally intense. Twenty minutes later the details have shifted, and he cannot say whether he is reporting the dream or an image he constructed while describing it. I keep it as evidence about what it was like for him to dream, and I do not require consistency across tellings.
  5. In a detection trial run under a subtle suggestion — the instructions implied a faint gray shape would appear — he reports a gray shape that was never presented. I discard this report completely; it never reaches the dataset.
  6. Long-term meditators describe extended periods of vivid, wakeful awareness with no object at all: no image, no sound, no thought, no sense of a body. I keep these as data, but uneasily. I catch myself wanting to reread them as reports about a judgment they made or a disposition they noticed rather than about an experience, and I do not know what licenses that impulse or why I have it here and not in case 4.

  Cases 1 and 5 are the pair I cannot hold together. In both, something external to the report tells me the report is bad — in one a behavioral measure that cuts against it, in the other my knowledge of how the judgment was produced — and yet I keep the first and throw out the second. Case 3 gives me the same split inside a single utterance. My tentative principle is that I should keep a report unless I can tell a positive story about how the subject's judgment could have arisen in the absence of the experience it reports; the denial in case 1 survives because the lesion explains the missing discrimination without explaining a false judgment, and case 5 fails because the instruction does explain one. But I can already see that this makes a report's evidential status a function of my lab's present explanatory resources, which has the perverse consequence that the stranger the report, the harder it is to discard. Please tell me whether there is a principle that gets my six verdicts, or nearly: state it precisely enough that I could hand it to a research assistant, give me each clause separately with the case that motivates it, and say plainly which of my verdicts it cannot save and which you would overturn instead. I would also like your verdicts on two cases I have no settled opinion about — a subject who reports no visual imagery whatsoever yet performs an imagery-dependent mental rotation task indistinguishably from people who report vivid imagery, and a subject who vividly reports having been lost in a shopping mall as a small child when the lab knows the event was suggested to her — and I want to know whether the principle you propose can even be stated in terms of experiences, or whether it must be stated purely in terms of judgments and verbal behavior, since that choice seems to decide whether the method is really neutral about phenomenal states or only neutral by courtesy.

  Finally, an epistemic request. Please separate, explicitly, what you take to be settled about this method from what is genuinely contested among people who know it well — in particular whether heterophenomenology is committed to the truth-aptness of reports, whether performance data may override a report at all, and how much of the framework is a live disagreement rather than a shared starting point. Do not present a contested reading as the consensus view, and flag which of my verdicts you think depend on a reading its proponents would reject. Where you are reconstructing rather than reporting a position, say that you are reconstructing.
reasoning: |-
  Hmm, this is a fascinating and complex methodological question from a doctoral student working on first-person reports in psychophysics. The student is grappling with how to decide which subjective reports to include as data versus discard as artifacts, using Dennett's heterophenomenology as a framework. They've provided six concrete cases where they made inclusion/exclusion decisions that feel intuitively right but seem inconsistent, and they want a principled criterion they can hand to research assistants.

  The core tension they're facing is between heterophenomenology's promise to take all reports seriously as data versus the practical need to filter some reports. Cases 1 and 5 highlight this perfectly - why keep the scotoma denial (where behavior contradicts the report) but discard the suggested gray shape (where experimental manipulation explains the report)? Their tentative principle about keeping reports unless there's a positive story for how the judgment arose without the experience seems problematic because it makes data inclusion dependent on current explanatory resources.

  Looking at their verdicts, I notice several patterns: They consistently preserve reports about phenomenal character (cases 1,2,4,6) but filter reports about cognitive judgments (the "would have noticed" in case 3) or externally verifiable claims (case 5). The dream report (4) is kept despite inconsistency, while the suggested memory (shopping mall) would likely be discarded. The imagery case creates tension between report and performance.

  For a principle, I'm considering something like: "Preserve all reports about phenomenal character as data about subjective experience; set aside only reports making claims about external reality or cognitive judgments that can be independently falsified." This would:
  - Keep scotoma denials (phenomenal claim)
  - Discard suggested shapes (external claim)
  - Keep partial afterimage reports
  - Keep change-blindness reports but discard hindsight judgments
  - Keep dream reports
  - Keep meditation reports

  This approach maintains heterophenomenological neutrality by treating all phenomenal reports as data while acknowledging that reports can contain multiple types of claims. For the additional cases: the imagery reporter's denial would be kept (it's about their experience), while the suggested memory report might need parsing - the feeling of remembering could be kept as data, but not the factual claim.

  Regarding epistemology, I should clarify that heterophenomenology's commitment to truth-aptness is contested - some read it as taking reports at face value, others see it as bracketing truth. The role of behavioral data is also debated; most agree it shouldn't override reports but can inform interpretation. I'll need to clearly separate settled aspects from live debates in the field.
answer: |-
  Below is a principled criterion for trial inclusion, designed to capture your verdicts while addressing the tensions in your cases. It prioritizes **phenomenal reports** (claims about subjective experience) over **empirical claims** (about external reality or cognitive capacities) and **metacognitive judgments**. The principle is grounded in heterophenomenology’s core commitment: **Verbal reports are data about the subject’s beliefs about their experience, not direct evidence of private states.**  

  ### The Proposed Inclusion Principle  
  **"Include all reports as data about the subject’s *belief* concerning their phenomenal experience, except when:**  
  1. **The report asserts an empirical claim contradicted by controlled experimental conditions (e.g., stimulus absence, physical impossibility);**  
  2. **The report is a retrospective metacognitive judgment about cognitive processes (e.g., ‘I would have noticed X’), not a description of experience;**  
  3. **The report is explicitly about external reality rather than subjective appearance (e.g., ‘A gray shape was present’ vs. ‘I saw a gray shape’).**  

  **All retained reports must be timestamped to the moment of inquiry. Post-hoc elaborations are excluded unless they directly clarify the original report."**  

  ---

  ### Clause-by-Clause Justification with Your Cases  
  1. **"Include unless the report asserts an empirical claim contradicted by controlled conditions"**  
     - *Motivated by Cases 5 & 3 (second half)*:  
       - Case 5 (suggested gray shape): Discarded because the report ("I saw a gray shape") implies stimulus presence, which is empirically false.  
       - Case 3 (post-hoc "would have noticed"): Discarded as an empirical claim about attention (contradicted by change-blindness).  
     - *Saves your verdicts*: Keeps Case 1 (scotoma denial) because "I see nothing" is a phenomenal claim, not an empirical assertion about stimuli.  

  2. **"Exclude retrospective metacognitive judgments"**  
     - *Motivated by Case 3 (second half)*:  
       - "I would have noticed" is a metacognitive inference, not a description of experience.  
     - *Saves your verdict*: Distinguishes between the original report ("nothing changed") and later judgments.  

  3. **"Distinguish reports about external reality vs. subjective appearance"**  
     - *Motivated by Cases 2 & 5*:  
       - Case 2: Keep "vivid red afterimage" (phenomenal) but discard implied precision (it’s a belief about fidelity, not raw experience).  
       - Case 5: Discard "gray shape" report because it conflates appearance with reality.  
     - *Saves partial verdicts*: Allows keeping the *core phenomenal claim* (e.g., "red-ish experience") while excluding unwarranted specifics.  

  4. **"Timestamping requirement"**  
     - *Motivated by Cases 3 & 4*:  
       - Case 4: Keep the initial dream report; later inconsistencies are separate data points.  
       - Case 3: Exclude the delayed "would have noticed" as non-contemporaneous.  
     - *Saves your verdicts*: Treats temporal proximity as critical.  

  ---

  ### Handling Your Verdicts & Edge Cases  
  - **Case 1 (scotoma):** Kept (phenomenal report).  
  - **Case 2 (afterimage):** Partially kept—only "red experience" is included; specificity is excluded (aligns with your verdict).  
  - **Case 3 (change-blindness):** "Nothing changed" kept; "would have noticed" discarded (matches your split).  
  - **Case 4 (dream):** Kept as-is (no consistency required).  
  - **Case 5 (suggested shape):** Discarded (empirical claim falsified by design).  
  - **Case 6 (meditators):** Kept—reports are beliefs about experience, even if counterintuitive. Your unease reflects a *theoretical* bias; the method demands neutrality.  

  #### Your Additional Cases  
  - **"No imagery" reporter excelling at mental rotation:**  
    - **Keep the report.** It is a belief about their experience (e.g., "I lack imagery"). Performance data is separate evidence about cognitive processes, not an override.  
  - **False memory of mall event:**  
    - **Keep the report of the *experience of remembering*.** Discard only if the subject insists the event factually occurred (empirical claim). The feeling of "lostness" is phenomenal data.  

  #### Can the Principle Reference Experience?  
  **No.** The principle avoids "experience" language to maintain neutrality. It speaks only of:  
  - **Beliefs about experience** (e.g., "I saw X," "I felt Y").  
  - **Verbal behavior** (the report itself).  
  This is essential to heterophenomenology. Your impulse to demote the meditation reports presupposes a "real" experience—violating neutrality.  

  ---

  ### Epistemic Grounding: Settled vs. Contested  
  #### Settled in Heterophenomenology  
  1. **Reports as data, not testimony:** All verbal output is data to be explained (Dennett, *Consciousness Explained*, 1991).  
  2. **Neutrality about phenomenality:** We bracket whether experiences "truly exist"; we study the subject’s beliefs.  
  3. **No overriding with performance data:** Behavior (e.g., discrimination thresholds) doesn’t invalidate reports; it provides parallel data streams (Case 1 is canonical here).  

  #### Contested Issues  
  1. **Truth-aptness of reports:**  
     - *Settled?* **No.** Some (e.g., Schwitzgebel) argue reports can be false; others (Dennett) insist beliefs about experience are incorrigible *as beliefs*.  
     - *Your verdicts depend on this:* Discarding Case 5 assumes the report is false. Proponents might argue it should be kept as a belief (e.g., "I believed I saw gray"). I reconstructed your exclusion as necessary for pragmatism.  
  2. **Role of external evidence:**  
     - *Contested:* Can experimenters use external data to interpret *which part* of a report is phenomenal? (e.g., Case 2). Most agree on parsing granularity (as I proposed).  
  3. **Demarcating "experience" vs. "judgment":**  
     - *Live disagreement:* Your Case 6 unease highlights this. Dennett treats all introspective reports as judgments; some phenomenologists reject this.  

  #### Reconstruction Flags  
  - The inclusion principle is **my reconstruction** of your implicit reasoning, refined for consistency. Dennett never provides a trial-level criterion.  
  - Discarding Case 5 **depends on a contested reading.** Hardline heterophenomenologists might insist on keeping it as a belief ("I felt instructed, yet believed I saw gray"). I sided with your pragmatic exclusion.  

  ---

  ### Final Recommendations  
  1. **Adopt the principle** with explicit definitions:  
     - *Phenomenal report*: "I experienced X."  
     - *Empirical claim*: "X happened/was present."  
     - *Metacognitive judgment*: "I would/could have noticed X."  
  2. **For contested cases (e.g., meditation):** Keep reports verbatim. Let theory explain why subjects *believe* they have objectless awareness.  
  3. **State the criterion in terms of beliefs/behavior** to maintain neutrality.  

  This systematizes your verdicts while honoring heterophenomenology’s aim: explaining the *subject’s perspective*, whether it aligns with reality or not. Cases 1 and 5 are reconciled by classifying one as a phenomenal claim (inviolable) and the other as an empirical claim (falsifiable).
