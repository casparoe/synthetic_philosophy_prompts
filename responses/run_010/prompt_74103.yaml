prompt: |-
  My student government is putting three questions to a school-wide vote in the spring, and I have been asked to settle who gets to vote before anyone starts arguing about the questions themselves. Two features of our situation are unusual, and I want the specification to handle them rather than assume them away. First, our electorate is not fixed by the vote: one question would end boarding at the school, which would remove roughly a third of the students who would otherwise be casting ballots, and another would extend the franchise to non-teaching staff beginning the following year, so that the outcome changes who decides the next round. Second, nobody here can say what would make an answer correct, so the debate has dissolved into people trading single examples at each other.

  So: write the desiderata for a theory of the boundary of the demos, that is, the requirements any account of who belongs to the electorate must meet in order to count as adequate. Give exactly five numbered items, each one or two sentences, each naming the requirement together with the case or consideration behind it and marking it either as non-negotiable or as a demand peculiar to one camp in this debate. At least one item should say what a theory owes us when the outcome of a boundary decision alters the composition of the body that decided it, and if any two of your five turn out to be unsatisfiable together, state that inside the relevant item rather than leaving it to me to notice. No introduction, no conclusion, and no survey of who has argued for what. After the five items, add one separate line saying how confident you are in the list as a whole, which item you are least sure of, and which one you think rules out the largest number of otherwise attractive accounts. Please write in American English.
reasoning: |-
  Hmm, the user is asking about a theory for determining who gets to vote in their school-wide election, specifically for the boundary of the demos (electorate). They have two unusual features: one vote could remove boarders who are voting, and another could add non-teaching staff next year, so the outcome changes who decides future votes. Also, people are stuck arguing with examples instead of principles.

  I need to provide exactly five numbered desiderata (requirements) for such a theory. Each item must be one or two sentences, name the requirement, refer to the case that motivates it, and mark it as non-negotiable or peculiar to a camp. At least one item must address the issue of outcomes altering the demos composition. If any two conflict, I have to state that in the relevant item. No intro, no conclusion. Then, after the items, a separate line on confidence, least sure item, and which item rules out the most accounts.

  Let me outline the five items based on the user's scenario:

  1. **Self-determination Compatibility**: This handles the problem where a vote changes who votes in the future. For example, extending the franchise to staff affects future decisions. This should be non-negotiable because it's a core issue in their situation. I need to specify that the theory must account for the demos deciding its own boundaries without contradiction.

  2. **Stability of Boundaries Across Decisions**: Since removing boarding could disenfranchise current voters, the theory must ensure boundaries are consistent over multiple votes. This might conflict with the first item, so I'll note that potential conflict here. Mark as non-negotiable.

  3. **Empirical Grounding in School Context**: People are trading examples, so the theory must be based on real-world impacts at the school. Non-negotiable to avoid abstract debates.

  4. **Non-Arbitrary Exclusion**: Someone might argue that only certain groups (like students) should vote, but the theory must justify exclusions clearly. Mark as peculiar to a camp—say, those opposing staff inclusion—to reflect the debate.

  5. **Procedural Fairness in Transition**: When boundaries change, like adding staff, the process must be fair and not biased. Non-negotiable for legitimacy.

  Now, for conflicts: Item 1 and Item 2 might be unsatisfiable together if a decision to expand the demos now affects who decides later, creating a loop. I'll state that in Item 2.

  After the items, I'll add the confidence line: I'm moderately confident overall, least sure about Item 4 because it's tied to a camp and might be subjective, and Item 1 rules out the most accounts by demanding consistency in self-determination.

  Finally, write in American English: use words like "staff" instead of "staff members," and keep sentences concise.
answer: |-
  1.  **Self-Determination Compatibility (Non-negotiable):** The theory must resolve the paradox where the demos votes on changes (like extending the franchise to staff) that alter its own future composition for subsequent decisions, ensuring the initial boundary decision is legitimate under the new rules it creates. This addresses the core problem of the vote altering who decides next time.
  2.  **Stability of Boundaries Across Decisions (Non-negotiable, potentially conflicting with Item 1):** The theory must define boundaries consistently enough that voters disenfranchised by an outcome (like boarders if boarding ends) were legitimately included in the vote causing that disenfranchisement, preventing retroactive illegitimacy; note that this stability requirement may be fundamentally unsatisfiable with full self-determination compatibility when the decision directly shrinks the demos.
  3.  **Empirical Grounding in School Context (Non-negotiable):** Criteria for inclusion must be justified by demonstrable, significant impacts of the vote's outcomes on individuals within the specific school community (e.g., boarding students affected by ending boarding, staff affected by policy changes), moving beyond abstract principles to address the "trading examples" problem.
  4.  **Non-Arbitrary Exclusion (Peculiar to camps opposing staff inclusion):** The theory must provide a clear, non-circular justification for excluding any group demonstrably affected by school governance (like non-teaching staff), rejecting mere tradition or status quo as sufficient reason; this responds to arguments focusing solely on current student voting rights.
  5.  **Procedural Fairness in Transition (Non-negotiable):** When boundary changes are enacted (like adding staff next year), the theory must ensure the transition process itself is fair to both current voters and the newly included or excluded, avoiding rules that inherently favor one group's interests in setting future boundaries.

  Moderately confident overall; least sure about Item 4's phrasing capturing the camp-specific demand without bias; Item 1 likely rules out the largest number of otherwise attractive accounts by demanding internal consistency on self-altering decisions.
