prompt: |-
  our lab made me the official methods person and i've been trying to write down what I actually believe so it can go in the onboarding doc, but I don't trust that the pieces fit together. can you audit it? here's the list:

  1. no priors, full stop. i don't want a "subjective prior" doing any work in what we publish. justification should be in terms of error rates: how often does this procedure get it wrong over repeated use.
  2. what makes a method good is its long-run error control, not how strongly this particular dataset supports anything. the 5% is a property of the procedure, not of my one experiment.
  3. which is why peeking / optional stopping is a real problem and not a technicality: if you look after every 20 subjects and quit as soon as it goes significant, your actual false-positive rate is nowhere near nominal, and a paper that did that simply didn't control its error rate. the stopping rule is part of the procedure and has to go into the analysis.
  4. but when someone asks me whether to believe a single result, i catch myself reasoning about the data itself: if lab A and lab B end up with the same numbers, i don't see how A's data can be better evidence than B's becuase A had planned to stop at n=100 and B would have kept going if it hadn't hit significance. same data, same evidence, whatever the intention was.
  5. i refuse to say a p-value is "the probability the null is true," and i correct people who do.
  6. i do think a very small p is evidence against the null, and a large one is not evidence for it — that asymmetry feels right to me.
  7. i also basically buy the argument that most published findings are false: low power, plus the fact that most of the hypotheses people bother to test were unlikely to be true in the first place, means the share of significant results that are real has to be low.
  8. and i think the replication crisis is a misuse story, not a philosophy story — flexibility, p-hacking, HARKing, selective reporting. preregistration plus fixed sample sizes plus reporting everything, and we've fixed most of it.

  which of these are actually in conflict and which only look like they are? rank the real ones by how bad they are rather than dumping them all in one pile, say what i'd have to give up in each case and what that costs me, and then tell me which single change would buy the most coherence for the least damage. no reading list please, i just want the audit.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're the methods person in their lab, tasked with writing the onboarding doc. They've listed their methodological beliefs but are unsure if they fit together. The main request is to audit these points for conflicts, rank the conflicts by severity, suggest what to give up, and find the best change for more coherence without adding reading.

  First, I need to parse each point. Point 1 is strict frequentist—no priors, focus on error rates. Point 2 emphasizes long-run error control over individual dataset strength. Point 3 stresses that optional stopping inflates FPR, so stopping rules must be part of the procedure. Point 4 admits that for a single result, the same data should be equally evidence regardless of stopping rules. But Point 3 says stopping rules affect error rates, so there's tension here. 

  Point 5 rejects interpreting p-value as the probability the null is true. Point 6 says small p is evidence against the null, which is consistent with frequentist thinking. Point 7 agrees with Ioannidis that most published findings are false due to low power and high false hypotheses. Point 8 attributes the replication crisis to p-hacking, etc., and thinks preregistration fixes it. 

  Now, identifying conflicts. The big one is between Point 3 (stopping rules matter for error rates) and Point 4 (same data, same evidence). In frequentist stats, stopping rules change the p-value calculation, but the user feels evidence is data-dependent. That’s a direct clash. 

  Point 7 and Point 8 might have tension. Point 7 says most findings are false due to prior odds and low power, which is a Bayesian argument (using prior probabilities). But Point 1 rejects priors entirely. So Point 7 implicitly uses a prior (low probability of hypotheses being true), conflicting with the "no priors" stance.

  Other points seem consistent. Point 5 and 6 are standard frequentist. Point 2 supports Point 3. Point 8’s solutions align with frequentist fixes like preregistration.

  Ranking conflicts: The Point 3 vs 4 is the biggest because it challenges the core frequentist principle. Point 1 vs 7 is next because invoking prior odds contradicts the no-priors rule. Point 7 vs 8 is minor since both address the replication crisis but from different angles.

  For Point 3 vs 4, the user has to choose: either accept that evidence depends on the procedure (keep Point 3) or give up strict frequentism for likelihood principles (embrace Point 4). Sacrificing Point 3 would undermine error rate control, which is central to their philosophy. Sacrificing Point 4 would mean accepting that procedural details affect evidence, which feels counterintuitive but is necessary for coherence.

  Between Point 1 and 7, keeping Point 1 means rejecting Point 7's argument, which relies on prior odds. But Point 7 is crucial for explaining the replication crisis. Sacrificing Point 7 weakens their argument, but sticking to no priors is foundational. Alternatively, they could reframe Point 7 without priors, maybe focusing on base rates from empirical studies.

  The single best change? Sacrificing the "full stop" in Point 1 to allow empirical priors. This resolves the conflict with Point 7 without abandoning error rates. They can still reject subjective priors but use empirical data for base rates. It’s a minimal change with high coherence payoff, preserving their core stance on error control while explaining why most findings are false.

  Also, clarifying Point 4 to align with Point 3 by emphasizing that evidence assessment depends on the procedure, not just data. But that’s more about wording than changing beliefs. The key is adjusting Point 1 to allow empirical priors for meta-arguments, maintaining their frequentist approach in primary research.
answer: |-
  Here's the audit of your methodological positions, ranked by severity of conflict, with costs and the optimal single change for coherence:

  ### **Ranked Conflicts (Most Severe First)**
  1. **Points 3 vs. 4 (Stopping Rules vs. Evidence Symmetry)**  
     - **Conflict**: Point 3 demands that the stopping rule *must* affect the analysis (frequentist error control). Point 4 argues identical data = identical evidence, regardless of stopping rules (likelihood/long-run evidence principle).  
     - **Cost of Resolving**:  
       - *If you keep 3*: You must accept that "evidence" is procedure-dependent. Identical data *isn't* the same evidence if obtained via different stopping rules.  
       - *If you keep 4*: You abandon strict frequentism. Optional stopping isn't a problem for evidence (violating point 3).  
     - **Severity**: Fundamental. This is a clash between frequentist and likelihood/Bayesian philosophies.

  2. **Points 1 vs. 7 (No Priors vs. Most Findings False)**  
     - **Conflict**: Point 7 ("most hypotheses unlikely true") implicitly *requires* a prior probability (low base rate of true effects). Point 1 forbids priors.  
     - **Cost of Resolving**:  
       - *If you keep 1*: You can't logically justify Point 7. "Unlikely hypotheses" is Bayesian language.  
       - *If you keep 7*: You weaken Point 1, allowing empirical/meta-scientific "priors" for broader arguments.  
     - **Severity**: High. Point 7 relies on a prior you explicitly reject.

  3. **Points 5/6 vs. 7 (p-values vs. False Findings)**  
     - **Conflict**: Points 5/6 treat p-values as error rates (not posterior probabilities). Point 7 interprets significance through a Bayesian lens (PPV ≈ power × prior / (power × prior + α)).  
     - **Cost of Resolving**:  
       - *If you keep 5/6*: You must reframe Point 7 using *only* frequentist terms (e.g., low power → high Type II error; publication bias → inflated false positives).  
       - *If you keep 7*: You accept that p-values alone don't answer "Is this finding real?"  
     - **Severity**: Moderate. Point 7 relies on Bayesian reasoning inconsistent with Points 5/6.

  ### **Minor Tension (Not Critical)**
  - **Points 3/8 vs. 7 (Solutions vs. Problem)**:  
    Point 8 (preregistration/fixed-N) fixes optional stopping (Point 3), but Point 7 claims most findings are false *due to low power*—which fixed-N worsens if you don't adjust N for power. **Resolution**: Emphasize that Point 8 *requires* high-power designs to solve Point 7.

  ### **Consistent Positions**
  - Points 1, 2, 3, 5, 6, 8 form a coherent frequentist core.  
  - Points 2 and 3 directly support each other.  
  - Points 5 and 6 are standard frequentist interpretations.  
  - Point 8 is a practical implementation of Points 1-3.

  ---

  ### **Recommended Single Change for Max Coherence/Min Damage**  
  **Sacrifice the "full stop" in Point 1 to allow *empirical base rates* for meta-scientific arguments (e.g., Point 7).**  

  - **Why?**  
    - Resolves the Point 1 vs. 7 conflict cleanly.  
    - Minimal cost: You still reject *subjective* priors in *your lab's analyses* (core intact). But you acknowledge that *scientific reality* has base rates (e.g., "only 10% of proposed effects exist"). This is defensible as frequentist meta-evidence.  
    - Protects Point 3: Stopping rules still break error control.  
    - Saves Point 7: "Most findings false" becomes a claim about empirical base rates + low power + α, not subjective priors.  

  - **Resulting Coherence**:  
    - Frequentist methods (Points 1-3, 5-6, 8) govern *your lab's primary analyses*.  
    - Point 7 is justified by *observed replication rates* (empirical frequency), not Bayesian priors.  
    - Point 4 remains the outlier but is now isolated (see below).

  ---

  ### **What to Do About Point 4?**  
  Point 4 conflicts irreconcilably with Point 3. Two options:  
  1. **Weaken Point 4**: Clarify that "evidence" *for scientific inference* must account for the procedure. Identical data *can* warrant different conclusions if obtained via hacking vs. pre-registered.  
  2. **Isolate Point 4**: Label it a personal intuition but stress that it *doesn't apply to error control* (Point 3 governs your lab's work).  

  **Recommendation**: Option 2. This preserves your core while acknowledging the tension.

  ---

  ### **Final Coherent Framework**  
  1. **Methods**: Strict frequentism (no priors in analyses; error rates rule).  
  2. **Procedures**: Pre-registration, fixed-N, no peeking (error control).  
  3. **Interpretation**: p-values measure incompatibility with H₀, not P(H₀|data). Small p ≠ "true effect."  
  4. **Meta-Science**: Use *empirical base rates* (e.g., replication failures) to argue that most published findings are false.  
  5. **Replication Crisis**: Solved by enforcing (1)-(3) via Point 8.  

  **Cost**: You accept that "evidence" in science isn't *solely* data-dependent—it's procedure-dependent (resolving Point 3 vs. 4). This is the price of error control.
