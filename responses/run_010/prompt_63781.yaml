prompt: |-
  Me and my mate Rhi were arguing about this until two in the morning and I still can't tell which of us lost, so I'm putting it to you cold. It started as a seminar thing on constitutional precommitment — entrenchment, supermajority amendment rules, that sort of thing — and I built the argument below to show that the whole idea of a constitution binding later generations is incoherent. Every step felt obviously true as we went along, and then we hit the conclusion and both of us balked, because it doesn't just kill constitutionalism, it kills the Ulysses story that the entire literature leans on. Here it is:

  (1) A decision that binds people is legitimate only if those people authorised it.
  (2) The generation that ratifies a constitution and the generation that lives under it decades later are, for political purposes, different bodies of people — elections turn over, the electorate is largely replaced, nobody alive voted for most of what binds them.
  (3) So a constitution is only legitimate for the people who ratified it.
  (4) The same holds at the individual level: a binding choice I make now is legitimate only if the me who has to live with it authorised it — and the me who has to live with it is precisely the one who will want out when the moment comes.
  (5) Ulysses on the beach, ordering his crew to lash him to the mast and ignore him later, is the paradigm case of (4).
  (6) Therefore Ulysses's order cannot legitimately bind the later Ulysses, who never authorised being tied up and is screaming to be released.
  (7) So rational self-binding is impossible, and a fortiori constitutional precommitment is just one generation imposing its will on the next.

  Rhi says the thing is valid and we should accept (7), which strikes me as nuts — you can't get through a single day without relying on your own earlier choices, and every promise, contract and savings plan would be nonsense. I say something slips between (5) and (6), but I can't say what without making the argument collapse in a different place, and I don't want to just wave at it.

  Can you work out where the slide is, or if there isn't one, which premise is cheapest to give up? I'd rather keep (1) than (7) if I have to choose, but tell me what that actually costs. Please organise the answer in four titled sections in this order: **Bottom line** (three or four sentences, say plainly whether the argument is valid-and-unavoidable or has a flaw, and where); **Where the slide is** (around 250 words, going step by step through the ones doing the real work, especially the jump from (4) to (6) — I want to know whether 'authorises' is doing one job or two, and whether the same-process point is doing more work than I think); **The two exits** (about 300 words, laying out the best version of rejecting (4) and the best version of rejecting (6) — or whichever pair you think are genuinely live); **What each costs** (about 200 words, including what each exit says about a later majority amending an entrenched clause by following the amendment rule, which is the case Rhi kept throwing at me). Roughly 850 words total, no reading list at the end, and write it like you're explaining it to someone who's had four hours of sleep.
