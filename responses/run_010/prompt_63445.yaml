prompt: |-
  I have spent something like two decades reading Overcoming Bias, the Sequences, and their successors, and the habit I have taken from that literature is less any particular conclusion than a reflex: when someone produces an argument that feels overwhelmingly persuasive, ask which features of the presentation are doing the work, and which are merely making it pleasant to be persuaded. The vocabulary for this is second nature to me — true rejections, fully general counterarguments, applause lights, semantic stopsigns. I want to turn it on thought experiments, and I am drafting the results as a talk for a local rationalist meetup, so I need the output to be quantitative rather than discursive.

  Score the following eleven intuition pumps on three axes I am defining for this exercise. Do not substitute your own axes; the point is comparability.

  - **Ornament load (0–5).** How much of the scenario's concrete content is not required by the argument the scenario is offered to support. 0 means every detail in the description maps onto a premise, so that deleting anything changes the argument. 5 means you could cut most of the story and leave the inference intact, and the cut portion is where nearly all the persuasive force lived.
  - **Framing asymmetry (0–5).** Whether the setup quietly presupposes one side of the dispute it is supposed to adjudicate. 0 means the description is neutral between the rival positions. 5 means the scenario embeds a premise that no partisan of the other side would grant, and the pump is routinely deployed as though that grant had been made.
  - **Yield (0–5).** What you get from the pump that you could not get from a bare argument. 0 means it is a restatement in costume. 5 means it genuinely isolates a variable, forces a distinction that was previously unavailable, or shows that a widely accepted principle has consequences its proponents would disavow.

  Then compute a composite, C = Yield − (Ornament load + Framing asymmetry) / 2, and place each pump in a tier: S for C ≥ 2.5, A for 1 ≤ C < 2.5, B for −0.5 ≤ C < 1, C for −2 ≤ C < −0.5, D for C < −2.

  The eleven: Searle's Chinese Room; Thomson's violinist; Nozick's experience machine; Jackson's Mary, the color scientist; the footbridge variant of the trolley problem, in which you push a heavy man onto the tracks; Parfit's teletransporter; Chalmers's philosophical zombies; Nozick's utility monster; Putnam's Twin Earth; Singer's child in the shallow pond; and Newcomb's problem.

  For each, after the three numbers, give me four to six sentences total covering:

  1. The single most load-bearing illegitimate detail — the one you would cut first, and the one whose removal the pump's partisans would most resent. Add a clause on roughly what their objection to that cut would be.
  2. A de-pumped restatement: the same argument rendered as drily as you can manage, all structure and variables and no scenery. Two or three sentences. This is where I will be checking whether you have grasped the argument rather than the story, so no rhetorical flourishes.
  3. A verdict on your restatement, choosing exactly one: the target intuition survives intact, meaning the pump was ornament; it survives but weakened in a way that matters to the conclusion, meaning the pump was doing real but unearned work; or it dies, meaning the pump was the argument. Defend the choice in one or two sentences.
  4. If the pump is standardly read in more than one way, state which reading you scored. Do not average across readings.

  After the eleven, answer four cross-cutting questions: which pump shows the largest gap between how often it is deployed and what it earns; if exactly one were permanently retired from the literature, which retirement would cost the most, and what specifically becomes harder to establish without it; which de-pumped restatement was hardest for you to write, and whether that difficulty reflects a subtle argument or an absent one; and whether the tiers sort by subject matter — normative pumps against descriptive ones — and if so, what that pattern suggests about how much work vividness does in each.

  Constraints. No citations, bibliography, page numbers, or publication dates; I cannot check them and do not want guesses. Do not recapitulate the standard objections to each pump, which I have read many times — the scores and the de-pumped restatements are the deliverable. Score the instrument, not the verdict: whether you think the Chinese Room's conclusion is true, or have any view at all about abortion, is beside the point here, and I do not want to hear it. Commit to integers on each axis, no ranges and no half-steps, and if two pumps tie on the composite, break the tie and say in a clause why. Finally, do not be reflexively cynical: several of these deserve high marks, and a uniformly deflationary ranking would be as useless to me as a uniformly reverent one.
reasoning: |-
  Hmm, the user wants me to analyze eleven famous thought experiments using three specific metrics: ornament load, framing asymmetry, and yield. They've defined these metrics precisely and want me to calculate a composite score and tier ranking for each. The purpose is for a rationalist meetup talk, so I need to be quantitative and structured.

  Looking at their background, they're deeply familiar with rationalist concepts like true rejections and applause lights, and they want to apply this critical lens to thought experiments. Their unspoken need seems to be developing a taxonomy of rhetorical effectiveness - they want to see which pumps genuinely clarify arguments versus which manipulate through narrative.

  For each thought experiment, I need to provide:
  - Three integer scores (0-5) for the defined axes
  - A composite calculation and tier ranking
  - Four specific analysis points including identifying the most load-bearing illegitimate detail, a dry restatement, and an evaluation of whether the intuition survives depumping

  Then I need to answer four cross-cutting questions comparing all the pumps.

  I'll approach this systematically. First, I'll recall each thought experiment's core argument and structure. For ornament load, I'll assess how much vivid detail is essential to the argument. For framing asymmetry, I'll check if the setup presupposes controversial premises. For yield, I'll evaluate whether the scenario provides unique conceptual leverage.

  For the depumped restatements, I'll strip each argument to its logical bones - no metaphors or emotional elements. The verdict will honestly assess whether the core intuition survives this stripping. Where multiple interpretations exist (like Newcomb's problem), I'll specify which one I'm scoring.

  The cross-cutting questions require meta-analysis: identifying overrated pumps, indispensable ones, and patterns across domains. I notice normative pumps (like the violinist) might score differently from descriptive ones (like Twin Earth), which could reveal something about moral versus factual reasoning.

  I'll be careful to follow all constraints: no citations, no opinion on the conclusions, integer scores only, and no reflexive cynicism. Several of these deserve high marks - Mary's Room and Twin Earth are genuinely illuminating, while others like the Experience Machine might be more ornamental.

  The challenge will be maintaining strict neutrality while still making sharp distinctions. But this is exactly the kind of analytical exercise the rationalist tradition excels at - turning critical lenses on our own tools.
answer: |-
  Here are the scored intuition pumps per your specified axes and format, with cross-cutting analysis following. Scores reflect structural features only, not personal agreement with conclusions.

  **Searle's Chinese Room**  
  Ornament Load: 4 | Framing Asymmetry: 3 | Yield: 2 | Composite: 2 - (4+3)/2 = -1.5 | Tier: C  
  1. The "room" and "manipulating symbols via a rulebook" detail. Partisans would object: "Cutting this obscures how syntax lacks inherent semantics despite perfect behavioral output."  
  2. A system executes formal operations on input to produce output indistinguishable from understanding. Does this imply genuine comprehension? If not, functional equivalence ≠ consciousness.  
  3. **Survives but weakened.** The depumped version loses the vivid contrast between external behavior and internal experience, making it easier to dismiss as a category error.  
  4. Scored the anti-functionalist interpretation.  

  **Thomson's Violinist**  
  Ornament Load: 3 | Framing Asymmetry: 4 | Yield: 3 | Composite: 3 - (3+4)/2 = -0.5 | Tier: B  
  1. The "famous unconscious violinist" detail. Partisans would object: "Removing this analogy guts the core intuition about bodily autonomy overriding beneficence."  
  2. Person A is forcibly connected to Person B, sustaining B’s life at significant ongoing cost to A. Is A obligated to remain connected? If not, then bodily autonomy can override the duty to preserve life.  
  3. **Dies.** The analogy smuggles in the contested premise that pregnancy is *forcible* imposition; the bare argument begs the question against "natural duty" views.  
  4. Scored the standard pro-choice deployment.  

  **Nozick's Experience Machine**  
  Ornament Load: 2 | Framing Asymmetry: 1 | Yield: 4 | Composite: 4 - (2+1)/2 = 2.5 | Tier: S  
  1. The "neural stimulation in a tank" detail. Partisans would object: "Omitting the tank reduces the visceral rejection of pure hedonism—it concretizes the loss of authenticity."  
  2. If offered a choice between real life and a simulated life guaranteeing greater pleasure, would you choose the simulation? If not, then we value more than just subjective experience.  
  3. **Survives intact.** The core question—whether pleasure is the sole good—is disentangled from contingent associations with technology.  
  4. Scored the hedonism-critique reading.  

  **Jackson's Mary the Color Scientist**  
  Ornament Load: 1 | Framing Asymmetry: 0 | Yield: 5 | Composite: 5 - (1+0)/2 = 4.5 | Tier: S  
  1. The "black-and-white room" detail. Partisans would object: "This isolates the epistemic gap—physical knowledge vs. phenomenal acquaintance—which is the pump’s essence."  
  2. An agent knows all physical facts about color vision but has never experienced color. Upon experiencing red, does she learn a new fact? If yes, physicalism is incomplete.  
  3. **Survives intact.** The deprivation scenario is merely illustrative; the inference relies on the logical possibility of complete physical knowledge absent qualia.  
  4. Scored the knowledge argument against physicalism.  

  **Footbridge Trolley Problem**  
  Ornament Load: 3 | Framing Asymmetry: 2 | Yield: 2 | Composite: 2 - (3+2)/2 = -0.5 | Tier: B  
  1. The "pushing a heavy man" detail. Partisans would object: "This personalizes the act, forcing engagement with agent-patient proximity versus impersonal tradeoffs."  
  2. Sacrificing one life to save five is permissible in some impersonal scenarios (e.g., diverting a threat) but not when it requires direct, personal harm. Why the asymmetry?  
  3. **Survives but weakened.** The bare contrast lacks the emotional salience of "hands-on" harm, making deontological intuitions less compelling.  
  4. Scored the standard contrast with Switch.  

  **Parfit's Teletransporter**  
  Ornament Load: 2 | Framing Asymmetry: 1 | Yield: 5 | Composite: 5 - (2+1)/2 = 3.5 | Tier: S  
  1. The "matter scrambling/reassembly" detail. Partisans would object: "This clarifies continuity of consciousness vs. identity—copies challenge non-branching persistence."  
  2. If a process destroys you and creates a perfect replica elsewhere, is the replica *you*? If not, then personal identity may not reduce to psychological continuity.  
  3. **Survives intact.** The replication dilemma stands independently; the transporter is just a vivid mechanism for fission cases.  
  4. Scored the identity-critique reading.  

  **Chalmers's Philosophical Zombies**  
  Ornament Load: 0 | Framing Asymmetry: 3 | Yield: 4 | Composite: 4 - (0+3)/2 = 2.5 | Tier: S  
  1. The "microphysically identical" detail. Partisans would object: "This fixes the conceivability test—if identical physics lacks consciousness, physicalism fails."  
  2. Is a being physically identical to a conscious entity but lacking subjective experience conceivable? If yes, consciousness is non-physical.  
  3. **Survives intact.** The zombie is a logical construct; the argument hinges on conceivability entailing possibility.  
  4. Scored the anti-physicalist interpretation.  

  **Nozick's Utility Monster**  
  Ornament Load: 1 | Framing Asymmetry: 2 | Yield: 3 | Composite: 3 - (1+2)/2 = 1.5 | Tier: A  
  1. The "monster" metaphor. Partisans would object: "The monstrousness highlights the counterintuitive extremity required to break utilitarianism."  
  2. If an entity gains vastly more utility from resources than others, does maximizing utility require allocating all resources to it? If yes, utilitarianism violates equality.  
  3. **Survives intact.** The distribution problem arises from marginal utility disparities, regardless of embodiment.  
  4. Scored the critique of unconstrained utilitarianism.  

  **Putnam's Twin Earth**  
  Ornament Load: 1 | Framing Asymmetry: 0 | Yield: 5 | Composite: 5 - (1+0)/2 = 4.5 | Tier: S  
  1. The "XYZ vs. H₂O" detail. Partisans would object: "This fixes semantic externalism—meaning depends on external substance, not internal state."  
  2. Two identical speakers refer to superficially identical substances with different underlying structures. Do their terms share meaning? If not, meaning is partly external.  
  3. **Survives intact.** The core argument relies only on the possibility of molecular differences altering reference.  
  4. Scored the semantic externalist reading.  

  **Singer's Shallow Pond**  
  Ornament Load: 4 | Framing Asymmetry: 3 | Yield: 1 | Composite: 1 - (4+3)/2 = -2.5 | Tier: D  
  1. The "child drowning in a pond" detail. Partisans would object: "This generates the urgent, personal obligation analogizing global poverty to immediate rescue."  
  2. If you can prevent great harm to another at small cost to yourself, you are morally obligated to do so. Distance or scale does not negate this.  
  3. **Dies.** Without visceral proximity, the analogy to impersonal aid dissolves; the premise "all harms are equally obligating" is presupposed.  
  4. Scored the effective altruism deployment.  

  **Newcomb's Problem**  
  Ornament Load: 2 | Framing Asymmetry: 4 | Yield: 3 | Composite: 3 - (2+4)/2 = 0 | Tier: B  
  1. The "Predictor's near-infallibility" detail. Partisans would object: "This forces the conflict—causal decision theory (one-box) vs. evidential (two-box)."  
  2. An agent chooses between one box (guaranteed reward) or two boxes (risk of forfeiting the guaranteed reward for a smaller gain). A predictor has anticipated your choice. Does rationality demand one-boxing or two-boxing?  
  3. **Survives but weakened.** The bare dilemma lacks the epistemic tension created by the Predictor, diluting the clash of decision theories.  
  4. Scored the causal/evidential decision theory conflict.  

  ---

  ### Cross-Cutting Questions  
  1. **Largest deployment-earnings gap:** Singer's Shallow Pond (Tier D). Routinely deployed in ethics lectures to "prove" obligations to distant strangers, but its framing asymmetry and ornament load render it logically inert without the emotionally charged scenario.  
  2. **Highest-cost retirement:** Jackson's Mary (Tier S). Without it, demonstrating the *epistemic gap* between physical knowledge and phenomenal experience becomes abstract and loses its decisive clarity, hindering anti-physicalist arguments.  
  3. **Hardest de-pumped restatement:** Footbridge Trolley. Difficulty arose in isolating the "personal force" variable without smuggling in deontological intuitions. Reflects an **absent argument**: the scenario conflates physical contact with moral agency, lacking a clean principle for the asymmetry.  
  4. **Tier sorting by subject matter:**  
     - **Descriptive pumps** (Mary, Zombies, Twin Earth, Teletransporter) dominate S-tier (Avg C=3.9).  
     - **Normative pumps** (Violinist, Footbridge, Utility Monster, Shallow Pond) cluster lower (Avg C=-0.4).  
     **Pattern suggests:** Vividness does heavier lifting in ethics. Descriptive pumps succeed by isolating variables logically; normative pumps often rely on emotional salience to compensate for contested premises.
