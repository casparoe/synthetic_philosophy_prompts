prompt: |-
  I'm auditing a passage from a well-regarded popular history of twentieth-century economics that I read on a flight and have since mislaid, though I kept notes on the part that concerns me. I'm writing a seminar paper for a course in the history of economic thought on whether the socialist calculation debate has any bearing at all on current proposals for computationally mediated planning, and this passage is roughly the account my advisor expects me to engage with rather than dismiss. The book summarizes the debate as follows:

  'In 1920 Mises observed that where the state owns the means of production there are no market prices for capital goods, and without prices there is no common unit in which to compare the costs of alternative production processes — so a socialist economy could not calculate rationally, though Mises was careful not to claim it would grind to a halt at once, and allowed that a socialist country trading with a capitalist world market could borrow those prices as a crutch. In the 1930s Oskar Lange answered him. Socialism does not need real capital markets, Lange argued, because a central planning board can simulate them: the board announces a set of prices, instructs every state enterprise to produce the output at which marginal cost equals the announced price and to produce that output at minimum cost, and then raises the price of whatever proves to be in shortage and lowers the price of whatever proves to be in surplus, iterating until the books balance. It is the procedure competitive markets perform by buying and selling, carried out instead by arithmetic, and Lange thought the board could do it better than a market, since it could choose any distribution of income it wished and could take account of the external effects that competitive firms ignore. Hayek conceded the logic and changed the subject: even if a board could solve the equations in principle, it could never assemble the data, because the knowledge that matters economically — which machine stands idle, whose particular skills suit which task, what a local shortage means this afternoon — is dispersed among millions of people, much of it tacit, and changing faster than any questionnaire can track. The practical verdict arrived in 1989–91, when the planned economies of Eastern Europe collapsed; the debate closed with the Austrians vindicated on the theory as well as the practice.'

  Most of this sounds right to me, and I can't tell where the pressure points are. Could you work through the passage claim by claim and say, for each one, whether it is accurate, a defensible simplification, or a misrepresentation — and for the misrepresentations, give me the correction in wording that the party being described would themselves accept, so that I can defend a paraphrase rather than a quotation? Three things especially worry me. First, whether Hayek's move is fairly described as conceding the logic and switching subjects, or whether Mises and Hayek were making claims that are distinguishable rather than one argument progressively downgraded; if the latter, what does Mises's impossibility claim assert that a claim about the volume of available information does not? Second, whether Lange's price-adjustment procedure is being presented as something an administrator could literally run, and what the standard objection to that reading is — I have a half-formed suspicion that the adjustment story presupposes that nothing is produced or traded while the prices are being revised, and that this is where the model comes apart. Third, whether the collapse of Soviet-type economies does any work for the theoretical question, given that they did not price at marginal cost and never operated a Lange-style board, and what happens to the usual verdict on the debate — that Lange won the statics and Hayek the dynamics — if it does not.

  Finally, and please be blunt here: I am half-inclined to think the passage's implicit moral is that Hayek's objection was really an objection about information capacity, and is therefore obsolete in a world where a single online retailer coordinates an internal inventory larger than that of many national economies. Does that inference actually follow from the parts of the summary that survive your corrections? Tell me what the strongest version of that objection to the Austrians would have to say, and where it runs into difficulties the passage never raises. I'm not after a reading list — I'd rather have the reasoning worked through.
