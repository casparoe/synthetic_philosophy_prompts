answer: |-
  Here's a claim-by-claim audit of the passage, highlighting inaccuracies, simplifications, and corrections needed for a defensible paraphrase, followed by your specific concerns:

  **Passage Audit:**

  1.  **Claim:** *'In 1920 Mises observed that where the state owns the means of production there are no market prices for capital goods, and without prices there is no common unit in which to compare the costs of alternative production processes...'*
      *   **Assessment:** **Accurate.** This is the core of Mises's initial challenge ("Economic Calculation in the Socialist Commonwealth"). No private ownership → no genuine market exchange for capital goods → no market prices → no basis for rational economic calculation.
      *   *Paraphrase Defense:* Mises argued that socialism lacked genuine market prices for capital goods, rendering rational economic calculation comparing production alternatives impossible.

  2.  **Claim:** *'...so a socialist economy could not calculate rationally, though Mises was careful not to claim it would grind to a halt at once...'*
      *   **Assessment:** **Accurate.** Mises focused on the *impossibility* of rational calculation for complex, dynamic economies, not an immediate collapse. He acknowledged simpler economies or static states could muddle through.
      *   *Paraphrase Defense:* Mises concluded socialism couldn't achieve *rational* economic calculation, though he allowed it might function crudely or temporarily, especially in simpler contexts.

  3.  **Claim:** *'...and allowed that a socialist country trading with a capitalist world market could borrow those prices as a crutch.'*
      *   **Assessment:** **Defensible Simplification.** Mises did discuss this possibility ("Foreign Trade" argument). However, he saw it as severely limited: prices for *final* goods could be borrowed, but not for *all* intermediate/capital goods, especially those not traded internationally. It couldn't solve the calculation problem for the *entire* structure of production. The "crutch" metaphor captures the limitation well.
      *   *Paraphrase Defense:* Mises conceded that a socialist economy trading internationally might use world market prices for some goods as a partial guide, but argued this was insufficient for comprehensive rational calculation of the internal production structure.

  4.  **Claim:** *'In the 1930s Oskar Lange answered him. Socialism does not need real capital markets, Lange argued, because a central planning board can simulate them...'*
      *   **Assessment:** **Accurate (as summary of Lange's core proposal).** Lange's model ("On the Economic Theory of Socialism") explicitly proposed simulating a competitive market via trial-and-error price adjustment by the Central Planning Board (CPB).
      *   *Paraphrase Defense:* Lange countered that a Central Planning Board could simulate market pricing through an iterative adjustment process, eliminating the need for actual private capital markets.

  5.  **Claim:** *'...the board announces a set of prices, instructs every state enterprise to produce the output at which marginal cost equals the announced price and to produce that output at minimum cost...'*
      *   **Assessment:** **Accurate (as description of Lange's *formal* rules).** This is Lange's famous two rules: (1) Set output where MC = Price, (2) Minimize cost of production.
      *   *Paraphrase Defense:* Lange proposed that state enterprise managers follow rules to minimize costs and set output where marginal cost equals the centrally announced price.

  6.  **Claim:** *'...and then raises the price of whatever proves to be in shortage and lowers the price of whatever proves to be in surplus, iterating until the books balance.'*
      *   **Assessment:** **Defensible Simplification (with crucial caveats).** This describes Lange's iterative *tâtonnement* process. *However*, the passage omits the *massive, inherent practical problems* Hayek highlighted. Crucially, Lange assumed this process operated in a *static* context ("parametric function of prices") and that managers would truthfully report costs/demand. The phrase "until the books balance" is too simplistic; the goal is general equilibrium.
      *   *Paraphrase Defense:* Lange described an iterative process where the Board adjusts prices upwards for goods in shortage and downwards for goods in surplus, aiming to find equilibrium prices.

  7.  **Claim:** *'It is the procedure competitive markets perform by buying and selling, carried out instead by arithmetic...'*
      *   **Assessment:** **Mostly Accurate.** Lange explicitly framed it as replicating Walrasian tâtonnement (auctioneer process) via administrative arithmetic.
      *   *Paraphrase Defense:* Lange characterized this as replicating the theoretical market equilibrium process (tâtonnement) through administrative calculation.

  8.  **Claim:** *'...and Lange thought the board could do it better than a market, since it could choose any distribution of income it wished and could take account of the external effects that competitive firms ignore.'*
      *   **Assessment:** **Accurate.** These were key advantages claimed by Lange (and Lerner, Taylor).
      *   *Paraphrase Defense:* Lange argued this system could outperform real markets by achieving desired income distribution and internalizing externalities.

  9.  **Claim:** *'Hayek conceded the logic and changed the subject...'*
      *   **Assessment:** **Significant Misrepresentation.** Hayek did *not* concede the logic was sound *in practice*. He shifted the focus *because* he believed the formal logic was *irrelevant* to the real economic problem. His point was that the logical possibility under idealized, static assumptions masked an *insurmountable practical impossibility* in a dynamic world. This wasn't "changing the subject"; it was attacking the *premises* of Lange's model as fundamentally unrealistic.
      *   **Correction (Hayek's View):** "Hayek argued that Lange's formal solution, while logically conceivable under unrealistic static assumptions, entirely missed the *practical essence* of the economic problem: the dispersed, tacit, and dynamic nature of relevant knowledge, which no central body could ever collect or utilize effectively. He shifted the debate from formal solvability to practical feasibility and knowledge generation."
      *   *Paraphrase Defense:* Hayek rejected the practical relevance of Lange's formal model, arguing it failed to address the fundamental problem of dispersed, tacit knowledge in a dynamic economy.

  10. **Claim:** *'...even if a board could solve the equations in principle, it could never assemble the data, because the knowledge that matters economically — which machine stands idle, whose particular skills suit which task, what a local shortage means this afternoon — is dispersed among millions of people, much of it tacit, and changing faster than any questionnaire can track.'*
      *   **Assessment:** **Accurate Summary of Hayek's Key Objection (Knowledge Problem).** This captures Hayek's core argument from "The Use of Knowledge in Society" (1945) and related works. The emphasis is on *practical impossibility due to knowledge dispersion and dynamics*.
      *   *Paraphrase Defense:* Hayek contended that the necessary economic knowledge (local, tacit, transient) is inherently dispersed and dynamic, making its central collection and use by a planning board impossible.

  11. **Claim:** *'The practical verdict arrived in 1989–91, when the planned economies of Eastern Europe collapsed; the debate closed with the Austrians vindicated on the theory as well as the practice.'*
      *   **Assessment:** **Misrepresentation on multiple counts.**
          *   **Theory:** The collapse cannot vindicate Mises's *strict impossibility* claim *against Lange*, because the Soviet system *never implemented anything resembling Lange's model*. It used highly centralized, bureaucratic, *physical* planning with fixed prices, not marginal cost pricing or iterative simulation. Mises and Hayek argued against *any* form of comprehensive central planning, including the Soviet type. The collapse *is* strong evidence against *Soviet-style* planning, but it doesn't directly adjudicate the *theoretical* Lange-vs-Mises/Hayek debate about the *feasibility* of Lange's specific market-simulation scheme. The standard verdict ("Lange won statics, Hayek dynamics") implicitly acknowledges Lange's solution *might* work in a static world, which the collapse doesn't test.
          *   **Practice:** While vindicating the practical failure of Soviet planning, it doesn't *directly* prove Mises's *theoretical* impossibility claim over Lange's *theoretical* counter-proposal, as Lange's model wasn't tested.
          *   **"Closed the Debate":** Highly contestable. The debate continues, especially regarding modern computational possibilities.
      *   **Correction:** "The collapse of Soviet-style planned economies in 1989-91 provided powerful empirical confirmation of the severe practical difficulties and ultimate failure of highly centralized bureaucratic planning, aligning with the Austrian critique of real-world socialism. However, these systems did not implement Lange's model of simulated markets using marginal cost pricing and iterative adjustment. Therefore, while the collapse strongly supports the Austrian *practical* warnings about centralization, it does not directly adjudicate the *theoretical* Lange-vs-Mises/Hayek debate over the *feasibility* of Lange's specific proposal under ideal, static conditions. The standard nuanced view ('Lange won the statics, Hayek the dynamics') remains relevant."
      *   *Paraphrase Defense:* The Soviet collapse demonstrated the catastrophic failure of highly centralized bureaucratic planning in practice, consistent with Austrian warnings. However, since these systems did not employ Lange's model of market simulation, the collapse does not directly resolve the theoretical debate over Lange's specific proposal.

  **Addressing Your Specific Concerns:**

  1.  **Mises vs. Hayek: Concession or Distinction?**
      *   **Misrepresentation:** The passage wrongly implies Hayek conceded Lange's logic was sound and merely shifted to a practical objection. **They were making fundamentally different, though related, arguments.**
      *   **Mises's Impossibility Claim:** Argued socialism *logically* precludes rational economic calculation *by its very nature* (no private ownership → no genuine markets → no market prices → no calculation). It's a *categorical* impossibility.
      *   **Hayek's Knowledge Problem:** Focused on the *practical impossibility* of centralizing and utilizing the *necessary knowledge* for calculation *even if* formal ownership rules allowed simulated prices. He argued the *knowledge required* is inherently dispersed, tacit, and dynamic, making central coordination infeasible regardless of formal mechanisms. Hayek saw Lange's model as solving a non-existent, static theoretical problem while ignoring the real, dynamic economic problem of utilizing dispersed knowledge.
      *   **Distinction:** Mises said "You can't build a calculator without these essential parts (prices from real markets)." Hayek said, "Even if you *could* build that calculator (simulated prices), you could never feed it the right information fast enough or in the right form because the information is scattered, constantly changing, and often impossible to articulate clearly." Hayek's argument complements and deepens Mises's, but it addresses a different dimension (epistemological/practical) rather than downgrading it.

  2.  **Lange's Procedure: Literally Runnable? Standard Objection?**
      *   **Passage Presentation:** The passage presents it as a literal procedure ("announces", "instructs", "raises", "lowers", "iterating").
      *   **Standard Objection (Your Suspicion is Correct):** The fatal flaw is assuming a **static snapshot**. Lange's *tâtonnement* process, borrowed from Walras, assumes:
          *   No production or consumption occurs during the iterations ("frozen" economy).
          *   Managers truthfully report costs/demand (no incentive problems).
          *   The underlying production possibilities and preferences are fixed.
          *   The Board can process all data instantly.
      *   **The Model Comes Apart:** In reality, the economy is *never* static. While the Board is iterating prices for round 1, production *is* happening based on the initial prices, new technologies emerge, consumer preferences shift, resources get used up, managers act strategically, and local conditions change. The data the Board receives at step 2 is already obsolete and reflects decisions made under the *wrong* prices from step 1. The process chases a moving target and is constantly out of date. It cannot converge in a dynamic world. Hayek emphasized this dynamism as inherent to the economic problem.

  3.  **Soviet Collapse & The Verdict:**
      *   **Collapse's Relevance:** As per the correction above, it strongly supports the *practical* critique of *highly centralized bureaucratic planning* (which both Mises/Hayek opposed and which Lange also criticized as inefficient!), but **it does zero work for adjudicating the theoretical debate between Lange and Mises/Hayek** because Lange's model wasn't implemented. The Soviets never used marginal cost pricing or iterative simulation. They used material balances and fixed prices.
      *   **Impact on "Lange statics / Hayek dynamics":** This nuanced verdict **remains intact**. The collapse doesn't refute the idea that Lange's model *might* work in a perfectly static world (the "statics" win). It powerfully confirms Hayek's point that real economies are dynamic, and any planning system ignoring that dynamism is doomed ("dynamics" win). The collapse is evidence *for* the dynamics side, but it doesn't *need* the collapse to be valid; Hayek's argument stands on its own epistemological grounds.

  **Your Inference Regarding Modern Computation & Hayek's Obsoleteness:**

  *   **Does the Inference Follow?** **No.** The passage's summary of Hayek's objection (once corrected) highlights issues that modern computation *does not inherently solve*.
  *   **Strongest Computational Planning Argument:** Proponents might argue that modern Big Data, AI (machine learning, optimization algorithms), ubiquitous sensors, and high-speed networks *could* potentially:
      *   Gather vastly more real-time data (e.g., IoT sensors on machines, RFID tracking, digital transactions).
      *   Process this data faster than ever before to detect shortages/surpluses.
      *   Use sophisticated algorithms to *approximate* optimal prices and production plans, updating them frequently.
      *   Handle complexity beyond human planners.
  *   **Where it Runs into Hayekian Difficulties (Unraised by Passage):**
      1.  **Tacit Knowledge:** Can algorithms capture the manager's "gut feeling" about a worker's suitability, the local nuance of a "shortage," the potential of a novel production method glimpsed by an engineer, or the shifting preferences of consumers *before* they manifest in data? Much economically crucial knowledge resists codification. Hayek argued markets *utilize* this tacit knowledge through action (bidding, offering) without needing to articulate it centrally.
      2.  **Dispersed Agency & Incentive:** Who discovers and reports the "idle machine" or "particular skill"? In a market, individuals have direct incentives to utilize resources profitably. In a computational planning system, does a local manager have the incentive (or freedom) to report an idle machine if it might lead to it being taken away? Can an algorithm replicate entrepreneurial *discovery* and initiative, or just optimization within known parameters? The problem isn't just *capacity*, it's about *who knows what* and *who has the motive and authority to act on it*.
      3.  **Perpetual Disequilibrium:** The economy is never in, nor approaching, a static equilibrium. Computational planning, even with fast updates, is still solving yesterday's problem with yesterday's data. Markets are a continuous *process* of discovery and adjustment involving millions of parallel, decentralized actors reacting instantly to local signals. Central computation, no matter how fast, is sequential and aggregated. Can it truly match the speed and granularity of decentralized adaptation?
      4.  **Knowledge Generation:** Markets don't just *use* existing knowledge; they *generate* new knowledge through competition, experimentation, profit/loss signals, and entrepreneurial action. Can a central algorithm simulate the discovery process inherent in rivalrous competition? How does it know what possibilities to explore without the feedback of real profit and loss based on real consumer spending?

  **Conclusion on Your Inference:** While modern computation vastly increases *data processing capacity*, it does not fundamentally overcome Hayek's core objections concerning the nature (tacit, dispersed), generation (entrepreneurial discovery), and utilization (requiring decentralized agency and incentives) of economically relevant knowledge in a dynamic system. The strongest computational planning argument must confront these epistemological and institutional challenges, not just the brute-force processing power. The passage's summary, even corrected, doesn't imply Hayek's objection is obsolete; it highlights the enduring nature of the knowledge problem.
