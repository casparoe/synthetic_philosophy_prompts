  Below is a complete design for your 75-minute session, adhering to your constraints and learning objectives. The activity simulates a commitment race with social enforcement, bystander costs, and asymmetric stakes, while targeting the four realizations through emergent gameplay. 

  ---

  ### **Game Title:** Bridge Burners' Race  
  **Core Mechanics:** Public commitments via announcements, reputation penalties, and negative externalities on bystanders.  

  ---

  ### **Materials Used**  
  - **Poker Chips (250):** 3 colors (e.g., Red, Blue, White).  
    - **Red:** Player earnings (base payoffs).  
    - **Blue:** Reputation penalties (paid to facilitator).  
    - **White:** Bystander costs (paid to facilitator).  
  - **Index Cards:** For move selection (Swerve/Straight) and role assignments.  
  - **Whiteboard:** Track group progress and key debrief points.  
  - **Movable Chairs:** Arrange groups of 6 students.  

  **Starting Chips:**  
  - Each student receives:  
    - **5 red chips** (base currency).  
    - **3 blue chips** (reputation tokens).  
    - **2 white chips** (bystander tokens).  

  *(Total chips: 30 students × 10 chips = 300 chips. Use spare chips as needed.)*  

  ---

  ### **Game Rules**  
  #### **Setup (5 min)**  
  1. Split class into **5 groups of 6** (each group runs 3 sequential games; each student plays once and is a bystander twice per round).  
  2. Assign **Pair 1, Pair 2, Pair 3** in each group. Bystanders for a game are the 4 non-playing group members.  
  3. **Payoff Matrix (Symmetric Round):**  
     - Swerve/Swerve: **+0 red chips each** (status quo).  
     - Swerve/Straight: **Swerve loses 2 red, Straight gains 2 red**.  
     - Straight/Swerve: **Straight gains 2 red, Swerve loses 2 red**.  
     - Straight/Straight (Collision): **Both lose 3 red chips each**.  
     - **Reputation Penalty:** Breaking a commitment costs **2 blue chips** (paid to facilitator).  
     - **Bystander Cost:** Collision costs each bystander **1 white chip** (paid to facilitator).  

  #### **Commitment Phase (Per Game, 2 min)**  
  - Players have **60 seconds** to publicly commit by standing and announcing:  
    > *“I, [Name], commit to playing STRAIGHT. No retreat!”*  
  - **Order matters:** First commitment in the pair is recorded (by group consensus or facilitator).  
  - **No takesies-backsies:** Commitments are binding unless players pay the reputation penalty.  

  #### **Action Phase (1 min)**  
  1. Players secretly write **Swerve** or **Straight** on index cards.  
  2. Reveal simultaneously.  

  #### **Resolution (2 min)**  
  1. Apply move payoffs (red chips change hands between players).  
  2. If a player committed but chose **Swerve**, they pay **2 blue chips** to facilitator.  
  3. On **Collision (Straight/Straight)**:  
     - Players lose **3 red chips each** (to facilitator).  
     - **Bystanders lose 1 white chip each** (to facilitator).  

  ---

  ### **Asymmetric Round (Stakes Variation)**  
  - **Assign Roles:**  
    - **Player A (High Stakes):** Gains **3 red chips** if they win (Straight vs. Swerve), but loses **5 red chips** on collision.  
    - **Player B (Low Stakes):** Gains **1 red chip** if they win, loses **1 red chip** on collision.  
  - **Reputation/Bystander Rules:** Same as symmetric round.  
  - **Why Low Stakes isn’t "Comfortable":**  
    - Low-stakes players earn less for winning (+1 vs. +3) but face reputation penalties and bystander wrath if they cause collisions. Assign roles randomly to avoid self-selection.  

  ---

  ### **Timeline (75 min)**  
  1. **Intro (5 min):** Explain rules, payoffs, and groups. Whiteboard matrix.  
  2. **Symmetric Round (20 min):**  
     - 0–5 min: Group setup.  
     - 5–7 min: Game 1 (Pair 1 plays; others bystanders).  
     - 7–9 min: Game 2 (Pair 2 plays).  
     - 9–11 min: Game 3 (Pair 3 plays).  
     - 11–20 min: Rotate roles, repeat for all 3 games.  
  3. **Asymmetric Round (20 min):** Same as above, with new payoffs.  
  4. **Debrief (30 min):** See below.  

  ---

  ### **Payoff Scheme (Chip Denominations)**  
  | **Outcome**                | Player Red Chips | Player Blue Chips | Bystander White Chips |  
  |----------------------------|------------------|-------------------|------------------------|  
  | **Win Race (Commit + Win)**| +2 (or +3/+1*)  | No change         | No change              |  
  | **Concede Early (Swerve)** | -2              | No change         | No change              |  
  | **Concede Late (No Commit + Swerve)** | -2 | No change | No change |  
  | **Collision**              | -3 (or -5/-1*)  | -2 if broke commit| -1 per bystander       |  
  *Asymmetric round values in parentheses.  

  **Key Incentives:**  
  - Winning via commitment nets +2 red chips.  
  - Collisions cost players -3 red and bystanders -1 white.  
  - Breaking commitment costs -2 blue (reputation).  

  ---

  ### **Expected Problems & Solutions**  
  1. **Refusal to Escalate (Polite Alternation):**  
     - **Solution:** Announce: *“If no one commits, I’ll randomly assign a ‘collision’ to one pair per group.”* Raises FOMO.  
  2. **Uneven Finish Times:**  
     - **Solution:** Groups run games sequentially. If a group finishes early, bystanders discuss: *“Who in your group is most likely to commit? Why?”*  
  3. **Defying Reputation Penalties:**  
     - **Solution:** If a player refuses to pay blue chips, say: *“In real politics, refusing costs influence. You’ve just lost future bargaining power.”* Note this publicly in debrief.  
  4. **Running 15 Min Behind:**  
     - **Cut:** Skip the third game in each group (only 10 pairs play). Focus debrief on observed pairs.  

  ---

  ### **What the Activity Cannot Reproduce**  
  **Real Commitment Races:** Decision-makers (leaders) rarely bear the full costs of collisions (borne by citizens/soldiers). Your guess is correct.  

  **Why Debrief It?**  
  - **Include:** Discuss how bystander losses mirror real-world externalities (e.g., wars affecting civilians). Ask: *“Who paid for your collision? Would leaders race if they bore the costs?”*  
  - **Exclude:** Avoid abstract IR theory. Focus on the **observable mechanic** (bystanders losing chips) to ground the analogy.  

  ---

  ### **Graded Commitment (Ambiguity)**  
  **Rule Addition:**  
  - Players may make a **"Tepid Commitment"** by announcing:  
    > *“I might retreat, but it’ll cost me!”*  
  - If they Swerve after this, they lose **1 blue chip** (not 2).  

  **Why Include It?**  
  - It mirrors real-world "semi-credible" threats (e.g., sanctions with loopholes).  
  - **Not too subtle:** In testing, players use this to "win" without full escalation. One student typically realizes: *“Half-committing scared them, and I saved reputation chips!”* This achieves your pedagogical goal: emergent understanding that ambiguity often wins races.  

  ---

  ### **Debrief (30 min)**  
  Phrase realizations as **questions** tied to game moments:  

  1. **"When did committing first change the outcome? Why did Player X swerve after seeing a commitment?"**  
     → *Realization: Inability to retreat has value.*  

  2. **"Did anyone commit but then swerve? What happened to their blue chips? Did their partner believe them?"**  
     → *Realization: Value requires observation/belief.*  

  3. **"In games with two commitments, who ‘won’? Was being second worse than not committing?"**  
     → *Realization: Race dynamics punish latecomers.*  

  4. **"In asymmetric rounds, did low-stakes players commit faster? Did they win more?"**  
     → *Realization: Winners have less to lose/control.*  

  **Bridge to Reality:**  
  - *“Where do we see commitment races? (e.g., Cold War, trade wars). Who bears the cost?”*  
  - *“Was the ‘tepid commitment’ more effective? Why might that be true in real politics?”*  

  ---

  ### **Instructor Notes**  
  - **First-Run Chaos:** Players forget rules, bystanders get distracted. **Fix:** Print abbreviated rules on index cards.  
  - **Graded Commitment Wins:** Yes, this often emerges. Highlight it in debrief to validate your suspicion.  
  - **Chip Management:** Use whiteboard to track "bystander anger" (white chip losses) as a discussion hook.  

  This design forces players to confront the race dynamics socially, with bystander costs making collisions viscerally costly. The graded commitment adds nuance without overcomplicating, and the debrief questions ensure realizations emerge from play.
