prompt: |-
  I am a third-year politics major, currently in a seminar on political representation, and one of nine members of my university's Committee on Student Governance. The Senate has charged us with recommending, before the end of the term, whether to replace the elected Undergraduate Assembly with a chamber selected by lot. The proposal arose from a concrete failure rather than an interest in institutional design: turnout in Assembly elections is now 9 percent of the undergraduate body; last spring 61 percent of the forty-eight seats were filled unopposed; and nineteen of the members now serving are in a third or fourth consecutive term, several of whom hold seats on two other university committees and list Assembly service on their fellowship applications. Two members of the committee want to abolish elections outright. Two want to keep them and treat low turnout as a campaigning problem. I have been asked to circulate a written opinion ahead of our meeting on the 14th, and I would like help drafting it.

  Three proposals are formally on the table.

  A. Full sortition. Forty-eight members drawn each September by stratified random sample from the undergraduate roll — stratified by year, school, financial-aid status, and commuter versus resident status — serving non-renewable twelve-month terms, with service as the default and a right to decline on any stated ground.

  B. A hybrid. Twenty-four seats elected as now, twenty-four filled by the same sortition. Sorted members are permanently ineligible for later elected university office; elected members may serve at most two consecutive terms.

  C. Elections retained, with single consecutive-term limits, mandatory renomination of every incumbent by their district, and a "none of these candidates" line that forces a fresh nomination round if it takes a plurality.

  All three must survive an institutional constraint. The bylaws require that any body allocating money from the student activities fee be "accountable to the student body." The Office of the General Counsel has told us only that this test is met "where the student body retains a practical means of removing a member," and has expressly declined to say whether a sorted chamber could satisfy it. That question is ours to answer, not theirs.

  I also want the memo to address three problems I have raised in committee that nobody has yet answered.

  First, the refusal skew. If declining is costless, the students with the least slack — those working twenty hours a week, commuters, students with caregiving obligations — will decline at the highest rates, and the chamber that actually convenes risks being a negatively selected version of the pool we already have. What design feature, other than a payment, counteracts this, and how would we detect it if it failed?

  Second, the payment dilemma. We cannot ask low-income students to serve unpaid, yet once service is paid it becomes a job with a wage, which is exactly what attracts the résumé-builders the reform is meant to displace. Recommend a specific arrangement and say what it costs.

  Third, discipline without a ballot. A sorted member cannot be voted out and has no constituency to answer to. Given the counsel's formulation, what mechanism would give the student body a practical means of removal that is not an election under another name, and that does not hand a recall power to whatever minority is organized enough to use it?

  The strongest objection comes from a fourth-term elected senator, and I think it is partly right, so I do not want it waved off with the observation that elected members also defer to staff. Her case is that institutional memory is what allows a student body to refuse the administration, and that a chamber of novices, redrawn every September and briefed by the same professional staff who brief the administrators, will be captured not by factions but by the bureaucracy's framing of the agenda.

  Relatedly, one pro-sortition member keeps invoking the old claim, associated with Montesquieu and with Rousseau, that suffrage by lot belongs to the nature of democracy while election belongs to that of aristocracy, because voting selects the prominent and the well-connected. The memo should say whether that argument does any work on our facts or is decoration — our problem may be less that elections pick an elite than that they have stopped picking anyone.

  On format: a memo to the committee, roughly 1,000 to 1,200 words, with the bottom line in the opening paragraph — which of A, B, or C, with what amendments — followed by the reasoning that gets us there, including why the runner-up is worse rather than merely different. Address the three problems with proposals a committee could vote on. Give the senator's objection a paragraph of its own. If you recommend a phased pilot, specify what would be recorded during it and what result at the end of year two should count as confirming or defeating the experiment, stated so that a future committee could apply the standard without relitigating the theory.

  No citations, footnotes, or reading list. Where you gesture at real-world citizen assemblies or juries, describe them in prose and only where you are confident of the facts. And do not let the recommendation dissolve into a call for further study.
reasoning: |-
  Okay, the user is a third-year politics major serving on a university committee tasked with recommending whether to replace the elected Undergraduate Assembly with a sortition system. They need to draft a memo analyzing three proposals (full sortition, hybrid, reformed elections) addressing specific concerns about refusal skew, payment dilemmas, accountability mechanisms, and institutional memory. The memo must deliver a clear recommendation with actionable amendments.

  First, let's unpack the core issues. The current system suffers from catastrophic democratic failure: 9% turnout, 61% unopposed seats, and entrenched members treating it as a résumé-building exercise. Yet replacing it with sortition introduces new challenges: underrepresentation of overburdened students, the paradox of paid service attracting careerists, and lack of accountability without elections. The institutional constraint about "accountability" is particularly tricky since legal counsel left it undefined.

  The user's framing suggests they lean toward reform but need concrete solutions. Their three unaddressed problems reveal sophisticated institutional design thinking—they recognize that procedural fairness alone doesn't guarantee substantive representation. The senator's objection about bureaucratic capture is valid too; it echoes scholarly critiques of citizen assemblies lacking bargaining power against entrenched administrations.

  For the refusal skew: Payment is unavoidable, but we can mitigate careerism by making compensation modest and universal—no means-testing that stigmatizes. A fixed stipend below campus job rates might work. To detect skew, we'd track declination rates by demographic strata. 

  The payment dilemma: Call it a "civic duty stipend" equal to 5 hours/week at campus job rates. This compensates labor without incentivizing careerists. Cost-wise, 48 students × $15/hr × 5hrs/wk × 32 weeks ≈ $115k annually—a rounding error in student activity fees.

  Accountability mechanism: Adapt jury-style dismissal. Randomly selected panels of students (say 12 peers) could review misconduct complaints. Requires supermajority to remove, preventing factional abuse. 

  On institutional memory: The hybrid model (B) cleverly preserves some continuity via elected members while injecting new voices. But limit them to two terms to prevent entrenchment. 

  Montesquieu/Rousseau argument: Academically interesting but irrelevant here. The problem isn't that elections are aristocratic—they've simply collapsed as a selection mechanism. Sortition isn't chosen for ideological purity but as salvage operation.

  Final recommendation should be amended hybrid: Sortition seats get stipends + dismissal panels; elected seats get term limits. Pilot for two years tracking declination demographics and policy outcomes vs. administration proposals. Success metric: ≥30% of assembly initiatives should oppose admin positions without rubber-stamping contrarianism.

  The memo must avoid academic jargon since the audience includes non-politicians. Keep solutions concrete: Instead of "leveraging deliberative democracy," say "randomly selected members attend mandatory orientation."
answer: |-
  ## Memorandum  
  To: Committee on Student Governance  
  From: [Your Name], Undergraduate Representative  
  Date: 11 April 2025  
  Subject: Recommendation on Undergraduate Assembly Reform  

  **Recommendation**: Adopt **Proposal B (Hybrid Sortition-Election Model)** with the following amendments: (1) Implement a universal $1,200 annual stipend for all Assembly members, prorated monthly; (2) Establish a 12-member, randomly selected Student Review Panel to adjudicate removal petitions; (3) Phase in via a two-year pilot, with full adoption contingent on meeting participation equity and accountability benchmarks. Modified Proposal B best addresses institutional decay while mitigating sortition’s risks. Proposal A (full sortition) risks bureaucratic capture and refusal skew; Proposal C (election reforms) fails to resolve systemic disengagement.  

  ### I. Core Problem: Democratic Collapse Demands Structural Change  
  The Assembly’s 9% turnout, 61% uncontested seats, and entrenched incumbency reflect electoral failure, not voter apathy. Term-limited members accumulating committee seats signal capture by a narrow cadre using service for credentialing. Mandatory elections under these conditions produce neither legitimacy nor representation. While Proposal C’s term limits and "none of the above" option address symptoms, they cannot resuscitate a system where elections lack contested choices. The choice is thus between sortition (A or B) and hybridity (B).  

  ### II. Analysis of Proposals with Amendments  
  **Proposal A (Full Sortition) – Risks Unaccountability and Negative Selection**  
  *Strengths*: Eliminates careerism; guarantees descriptive representation via stratification.  
  *Critical Flaws*:  
  - **Refusal Skew**: Without compensation, low-income/overburdened students will decline service at higher rates. Payment is essential—but a wage risks attracting opportunists.  
    *Amendment: Universal Stipend*: All members receive $1,200/year (equivalent to 5 hrs/week at campus jobs). *Why this works*: Compensates labor without incentivizing résumé-builders (campus jobs pay more; stipend is non-competitive). Cost: $57,600/year (<0.5% of typical student activities fee pool).  
  - **Accountability Gap**: "Practical means of removal" cannot rely on elections.  
    *Amendment: Student Review Panel*: Petitions for removal (signed by 5% of undergrads) trigger review by 12 students drawn randomly from the full roll. Removal requires 9/12 votes for cause (neglect, misconduct). Prevents factional abuse while enabling legitimate oversight.  
  - **Institutional Memory Deficit**: Annual turnover risks bureaucratic capture. No amendment fully resolves this—hence rejection of A.  

  **Proposal C (Election Reforms) – Inadequate for Systemic Collapse**  
  *Strengths*: Preserves continuity; "none of the above" forces competition.  
  *Critical Flaws*:  
  - Fails to expand the candidate pool. Term limits may worsen inexperience.  
  - Mandatory renomination entrenches incumbents where no alternatives exist.  
  - Cannot address 91% non-participation; treats apathy as a campaign tactic issue.  

  **Proposal B (Hybrid) – Balanced Solution with Amendments**  
  *Strengths*: Preserves electoral voice while injecting diversity; term limits prevent elected entrenchment.  
  *Amendments Address Weaknesses*:  
  - **Refusal Skew**: Apply universal stipend to *all* members. Track declination rates by stratum (e.g., financial aid status). Pilot success requires declination disparity <15% between high/low burden groups.  
  - **Accountability**: Review Panel applies to *all* members. Sorted members ineligible for future office prevents careerism.  
  - **Institutional Memory**: Elected members (max 2 terms) provide continuity. Pair with mandatory onboarding for sorted members by outgoing Assembly.  

  ### III. Addressing the Senator’s Objection: Bureaucratic Capture  
  A chamber of novices advised by staff risks adopting administrative priorities uncritically. This is valid—but the current system’s capture by credential-seekers is equally concerning. Proposal B mitigates this by:  
  - Retaining 24 elected members with policy experience.  
  - Structuring staff briefings as open debates (e.g., require administration to respond to alternative proposals from sorted members).  
  - Success metric: ≥30% of Assembly-initiated policies should diverge from administrative recommendations during the pilot.  

  ### IV. The Montesquieu Argument: Ideology vs. Pragmatism  
  Sortition advocates invoke historical ideals: elections favor elites, lotteries embody equality. While theoretically sound, **our crisis is functional, not philosophical**. Elections have ceased to select *any* representative cohort. Sortition is recommended not because elections are aristocratic, but because they have collapsed. The hybrid model pragmatically balances inclusion with stability.  

  ### V. Pilot Design and Evaluation Benchmarks  
  Implement Proposal B (amended) for two years, with automatic sunset if benchmarks fail:  
  1. **Participation Equity**: Declination rate gap ≤15% between students with/without work/care obligations.  
  2. **Accountability**: ≤2 valid removal petitions filed per term; ≥1 member reviewed by Panel annually (tests accessibility).  
  3. **Legitimacy**: Annual survey shows ≥40% of students rate Assembly as "representative."  
  4. **Independence**: ≥30% of Assembly initiatives oppose or amend administrative proposals.  

  **Conclusion**: Modified Proposal B disrupts entrenchment while ensuring equitable participation and accountability. It answers our charge by repairing representation without gambling on untested purity (A) or insufficient tweaks (C). I move to adopt the hybrid model with stipulated amendments and evaluation criteria.  

  ---  
