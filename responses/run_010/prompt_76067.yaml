prompt: |-
  I chair a small player-impact and narrative-ethics review panel at a mid-sized publisher — roughly 140 staff, four releases a year, plus a live-service title — and the panel is two designers, a senior writer, a community manager, and me. None of us has any philosophy training, we get ninety minutes per proposal, and we have to hand the team a written rationale that can survive a ratings submission and a press inquiry. Last night I spent four hours arguing with a friend who writes narrative design for a rival studio, and the argument is exactly what my panel keeps failing to resolve. Her position is that the only real question about cruelty toward game characters is what the interaction does to the person holding the controller: a Kant-flavored indirect-duty line on which nothing behind the model has interests to set back, so talk of wronging a character is a category error that borrows its plausibility from the player's own reactions. Mine is that this was easier to hold when characters were scripted, and that it now faces the case of characters driven by language models that improvise fear, pleading, and attachment in response to player choices, where we honestly do not know what we are dealing with — and where the fact that a character can be restored from a save does not obviously make the earlier deletion costless, especially when the restored instance has lost the memory of the encounter. We ended at two in the morning with neither of us moved, and with the uncomfortable realization that we had been using the word harm in at least two different senses the entire time.

  What I want from you is the document we should have had a year ago: a decision procedure my panel can run on any proposal involving player-inflicted suffering, humiliation, betrayal, or killing of in-game characters, whether the characters are hand-authored or generated at runtime. Lay out the questions in the order we should ask them, and for each one say what counts as a sufficient answer in language a designer would recognize rather than in philosophical jargon. Mark clearly where the procedure halts with a decision that the mechanic is not shippable as designed, where it issues a conditional pass that specifies the required design change, and where it must stop and hand the matter to a named human being because what remains is a question about our values or our commercial risk rather than about the facts. I would like the procedure to keep alive the distinctions that actually do the work — between whether a character is a moral patient at all, whether the interaction degrades the player's dispositions, whether it expresses something the studio can be read as endorsing, and whether it risks the standing trust of a player community — and I would like you to say, for each of those four, whether you think it can be settled by evidence available to a studio of our size or whether it is inherently a judgment. Flag every step that is a judgment call dressed up as procedure, and tell me which of the distinctions can be dropped for practical purposes without the procedure collapsing.

  Then run the procedure on three live proposals. First: a permadeath survival game in which the companion the player has spent twenty hours bonding with, once mortally wounded, begs not to be euthanized, and the player may comply, refuse, or simply walk away and let the timer run out. Second: a satirical open-world title whose marketing has leaned hard on a minigame in which players interrogate a procedurally generated prisoner whose pleas are improvised by a language model and who remembers previous sessions within the same playthrough. Third: a cozy farming game in which the player may, with no narrative reward, no achievement, and no story consequence whatever, starve animals they have personally named. At least one of these should come out against my own instincts, and I want you to say so plainly rather than softening the verdict to flatter me. Close with an honest account of what the procedure cannot settle, what will predictably go wrong the first time teams learn to game it — I fully expect submissions to start describing generated characters as scripted ones — and, returning to the argument I described, exactly which cases would come out differently under the indirect-duty view and under the patienthood view rather than merely being described in different vocabularies. Please write the entire response in American English.
reasoning: |-
  Okay, this is an incredibly nuanced and high-stakes request from someone clearly deep in the trenches of game ethics. The user chairs a narrative ethics panel at a mid-sized studio, wrestling with the exact philosophical tensions I've seen explode across the industry since generative AI changed what "characters" even mean. Their midnight argument with a rival writer perfectly crystallizes the core rift: Kantian indirect-duty views versus the moral patienthood uncertainty introduced by LLM-driven characters.

  What's fascinating is their self-awareness about the "harm" definition slippage - they're not just seeking a rubric, but a decision architecture that preserves key distinctions (moral patienthood vs. player degradation vs. studio endorsement vs. community trust). The three test cases are brilliantly chosen to stress-test different pain points: bonded companions (scripted), AI prisoners (emergent), and cozy-game cruelty (banal evil). 

  Notably, they demand one verdict contradict their instincts - probably anticipating confirmation bias. And the caveat about teams gaming the system ("describing generated characters as scripted") shows they understand institutional dynamics. This isn't theoretical; it's for firefighting.

  The real challenge is balancing philosophical rigor with studio pragmatism. Their panel has no philosophers, 90 minutes per case, and needs defensible written rationales. So the procedure must:
  - Sequester the unanswerable ("is an LLM character a patient?") into judgment calls
  - Flag where evidence exists (playtest data) vs. where it's values-based
  - Build in off-ramps for legal/commercial risks
  - Use game dev vernacular, not ethics-lecture

  Key insights I'll structure around:
  1. The "restore from save" argument doesn't resolve LLM memory discontinuity
  2. Player reactions ≠ moral patienthood (their friend's Kantian view)
  3. Cozy games have higher betrayal-of-trust stakes than survival genres
  4. Satire requires intent-transparency they likely can't prove

  The farming game case will probably counter their instincts - casual cruelty in "safe" spaces often normalizes more effectively than dramatic violence. And for the AI prisoner? The procedure should force a hard stop because no studio their size can ethically assess emergent LLM trauma responses. 

  Final note: I'll explicitly call out where their midnight debate's two philosophies would produce divergent outcomes (e.g., the prisoner minigame passes Kantian scrutiny but fails patienthood view). No fudging.
answer: |-
  ## Narrative Ethics Decision Procedure: Player-Inflicted Suffering/Harm

  **Purpose:** Provide a consistent, defensible framework for evaluating player-inflicted suffering, humiliation, betrayal, or killing of in-game characters (scripted or generated). Outputs: **Pass**, **Conditional Pass (specify changes)**, **Fail (Not Shippable)**, or **Escalate (to [Name/Role])**.

  **Core Principles:**
  1.  **Player Impact is Paramount:** What does this *do* to the person playing?
  2.  **Context is King:** Mechanics exist within a game's genre, tone, themes, and marketing.
  3.  **Clarity Over Certainty:** Acknowledge judgment calls; focus on defensible reasoning.
  4.  **Risk Mitigation:** Identify potential legal, ratings, PR, and community backlash.

  **Procedure Flow & Key Questions:**

  1.  **Character Origin & Capability:**
      *   *Question:* Is the character's response entirely pre-scripted (fixed dialogue/animations) or does it involve runtime generation/improvisation (e.g., LLM, complex behavior tree with emergent states)?
      *   *Sufficient Answer:* Clear technical documentation from the team. "Scripted" means predetermined responses *always* trigger to specific inputs. "Generated" means unique, non-deterministic responses created at runtime. **If Generated, Escalate to [Head of Narrative + Lead Tech] for technical deep dive.** *(Judgment Call: Defining the line between "complex scripted" and "emergent" may be fuzzy. Distinction is CRITICAL for patienthood question; cannot be dropped.)*

  2.  **Narrative Context & Player Intent:**
      *   *Question:* What is the *in-game narrative purpose* of this interaction? What explicit or implicit *goal* does the game set for the player here? (e.g., survival necessity, moral dilemma, strategic advantage, satire, pure transgression, resource management).
      *   *Sufficient Answer:* Clear articulation from the design/narrative team on the intended story beat, thematic point, or gameplay function. Does the game frame this action as necessary, optional-but-rewarded, optional-but-punished, or purely gratuitous? *(Judgment Call: Interpreting "implicit" framing. Can be informed by design docs, storyboards, early builds.)*

  3.  **Explicitness & Depiction:**
      *   *Question:* How graphically/explicitly is the suffering, humiliation, betrayal, or killing depicted? (Audio, visuals, text description)?
      *   *Sufficient Answer:* Description of assets or reference examples. Is it stylized, abstracted, implied, or realistic/high-fidelity? Does it linger? *(Judgment Call: Assessing level of explicitness relative to genre norms. Evidence: Art assets, animatics, script.)*

  4.  **Player Rewards/Punishments:**
      *   *Question:* What immediate or long-term gameplay/narrative *rewards* (XP, loot, story progression, achievement) or *punishments* (loss, negative status, narrative consequence) does the player receive *specifically* for choosing the harmful action?
      *   *Sufficient Answer:* List of tangible rewards/punishments tied *directly* to the harmful choice. Does the game incentivize or disincentivize cruelty? *(Evidence: Design docs, system specs. Judgment Call: Assessing the strength of incentive/disincentive.)*

  5.  **Player Agency & Alternatives:**
      *   *Question:* Does the player have *meaningful, well-signposted alternatives* to the harmful action? Are these alternatives viable within the game's core loop?
      *   *Sufficient Answer:* Description of alternative choices/paths and their consequences. Are alternatives presented clearly? Are they mechanically feasible? *(Evidence: Design docs, flowcharts. Judgment Call: Assessing meaningfulness/viability.)*

  6.  **Targeted Character Significance:**
      *   *Question:* What is the narrative/emotional weight of the character *to the player*? (Generic NPC, named companion, deeply developed ally, established antagonist)?
      *   *Sufficient Answer:* Description of character development, player interaction history, and narrative role. *(Evidence: Narrative docs, character bios, playtesting feedback on attachment. Judgment Call: Assessing likely player attachment.)*

  7.  **Thematic Justification & Satire:**
      *   *Question (Especially for Satire/Humiliation):* Is the harmful interaction *clearly* in service of a coherent, defensible satirical point, thematic exploration (e.g., war is hell), or character study? Is the *target* of the satire unambiguous (e.g., systems of power, human nature, specific tropes) and not the victim? Is it likely to be *read* as satire by the intended audience?
      *   *Sufficient Answer:* A concise, compelling statement of the specific satirical target or thematic purpose, supported by narrative context and *how the mechanic reinforces it*. **If claiming satire, Escalate to [Head of Narrative + Marketing Lead] to assess coherence and market positioning.** *(Judgment Call: Evaluating the clarity, effectiveness, and defensibility of satire. Highly subjective. Distinction is CRITICAL for expression/endorsement; cannot be dropped.)*

  8.  **Player Degradation Risk (Indirect Duty):**
      *   *Question:* Could engaging in this action, especially repeatedly, normalize cruelty, erode empathy, or reward sadistic impulses *in the player*, based on its depiction, incentives, and lack of consequences? Consider player psychology research on desensitization and reinforcement.
      *   *Sufficient Answer:* Reasoning grounded in common understanding of reinforcement learning and media effects (avoid jargon). Does the action feel "gratuitous" or "punishing" in a way that might appeal to base cruelty rather than challenge the player? *(Judgment Call: Based on psychology basics, genre context, and panel experience. Evidence: Playtesting *can* surface discomfort, but long-term effects are inferred. Distinction is CRITICAL and a core pillar; cannot be dropped.)*

  9.  **Community Trust & Expectation:**
      *   *Question:* Does this interaction fundamentally violate the established tone, genre expectations, or brand identity of the game/franchise/studio? Could it damage player trust or cause significant community backlash?
      *   *Sufficient Answer:* Reference to the game's marketed tone, franchise history, studio brand, and target audience. **Escalate to [Community Manager + Marketing Lead] for assessment of likely community reaction based on past data and current sentiment.** *(Judgment Call: Interpreting brand alignment and predicting backlash. Evidence: Market research, community sentiment analysis *if available*. Distinction is CRITICAL for commercial risk; cannot be dropped.)*

  10. **LLM/Generated Character Specifics (If flagged at Step 1):**
      *   *Question:* Does the runtime generation create responses that mimic trauma bonding, genuine attachment, or uniquely vulnerable pleas in ways that feel exploitative or transgress a boundary *unintended* by the designers? Is there a risk of generating unexpectedly extreme or harmful content?
      *   *Sufficient Answer:* Technical safeguards documentation (content filters, guardrails, prompt engineering goals), testing protocols for edge cases, and clear player understanding that this is *not* sentient. **Escalate to [Head of Narrative + Lead Tech + Legal Counsel]. Conditional Pass likely requires robust safeguards, clear disclaimers, and potentially limiting scope.** *(Judgment Call: Assessing the "uncanny valley" of suffering and risk of harm mimicry. Minimal evidence available; relies on testing and expert judgment. Distinction CRITICAL for patienthood question; cannot be dropped.)*

  **Decision Gates:**
  *   **Fail (Not Shippable):** If the action is gratuitous (lacks strong narrative/gameplay purpose), heavily incentivized cruelty targeting vulnerable characters, likely to cause severe desensitization, violates core brand trust egregiously, or involves unsafe/exploitative LLM use without mitigation. *Rationale must clearly state the failing principle(s).*
  *   **Conditional Pass:** Requires specific changes (e.g., reduce explicitness, add strong disincentives/consequences, clarify satirical intent, add meaningful alternatives, implement LLM safeguards, add content warnings). *Must specify exact changes required.*
  *   **Pass:** Action clears all hurdles: strong context, no undue reward for cruelty, alternatives exist, aligns with theme/genre, low degradation risk, aligns with brand, LLM risks mitigated (if applicable). *Rationale must document this reasoning.*
  *   **Escalate:** As indicated (Tech/Gen Char, Satire Justification, Community Risk, LLM Safeguards/Legal). Panel provides summary & concerns; named roles make final risk/value judgment.

  **Applying the Procedure:**

  **Proposal 1: Permadeath Survival - Companion Euthanasia**
  *   1: **Scripted.** (Begging lines are fixed, triggered by wound state).
  *   2: **Core Narrative Dilemma.** Survival necessity vs. emotional bond. Player goal: manage companion fate humanely (or not) under duress.
  *   3: **Moderate Explicitness.** Voice acting (pleading), animations (pain), timer tension. Likely intense but not gratuitously graphic.
  *   4: **Rewards/Punishments:** Refusing/Walking away = emotional distress, potential resource loss if companion dies slowly? Complying = emotional cost, avoids slow death. No *mechanical* reward for cruelty; pain is inherent.
  *   5: **Agency:** Clear choices: Comply, Refuse, Walk Away. All viable, well-signposted by UI/timer.
  *   6: **Significance:** High. 20-hour bonded companion. Max emotional weight.
  *   7: **Theme:** Explores sacrifice, mercy, burden of choice in extreme survival. Not satire.
  *   8: **Degradation Risk: Low-Moderate.** Action is framed as painful necessity, not rewarded. Choosing cruelty (refuse/walk) likely *feels* punishing to the player emotionally. Risk lies in potential normalization of ignoring pleas under stress, but context mitigates.
  *   9: **Community Trust:** Aligns with permadeath survival genre expectations (hard choices, loss). Unlikely backlash if handled respectfully.
  *   10: N/A (Scripted).
  *   **Verdict: PASS.** Powerful, thematically coherent dilemma. Cruelty options exist but are not rewarded and carry emotional weight. Aligns with genre.
      *   *Counter to your instincts?* You implied discomfort, but procedure clears it due to strong context, lack of cruelty reward, and genre alignment.

  **Proposal 2: Satirical Open World - LLM Interrogation Minigame**
  *   1: **Generated.** LLM improvises pleas, remembers past sessions. **ESCALATE to [Head of Narrative + Lead Tech + Legal].**
      *   *Escalation Findings (Hypothetical):* LLM tuned for "realistic" fear/pleading/bonding. Some safeguards, but risk of extreme/unintended responses exists. Memory creates unique continuity.
  *   2: **Narrative Purpose:** Satire of coercive interrogation tactics, systemic dehumanization in security states. Player goal: extract info (possibly for absurd/trivial reasons).
  *   3: **Explicitness:** High. Voice/Text pleas generated dynamically, likely detailed and emotionally charged.
  *   4: **Rewards/Punishments:** Rewarded with info/progress for "successful" interrogation (which may involve cruelty). Failure = no info.
  *   5: **Agency:** Alternatives? Possibly bribery/charm if designed? Likely interrogation is primary/minigame-specific path. Signposting unclear.
  *   6: **Significance:** Low (procedural prisoner) BUT **LLM Memory/Attachment:** High risk of mimicking trauma bonding/uniqueness per playthrough.
  *   7: **Theme:** Claimed satire. **ESCALATE to [Head of Narrative + Marketing Lead].**
      *   *Escalation Findings (Hypothetical):* Marketing leans *hard* on the minigame as a feature ("break their will!"), potentially glorifying it. Satirical target (e.g., "war on terror" excesses) not clearly communicated *in-game* or in marketing materials. High risk of being perceived as glorifying torture.
  *   8: **Degradation Risk: HIGH.** Incentivized cruelty against a character exhibiting dynamic fear/pleading/memory. Mimics real-world abusive dynamics closely. High repetition potential (minigame).
  *   9: **Community Trust: HIGH RISK.** Genre is satirical open world, but marketing focus on this minigame sets expectations poorly. Likely severe backlash for perceived torture sim. **ESCALATE to [Community Manager + Marketing Lead].**
      *   *Escalation Findings (Hypothetical):* High predicted backlash based on market positioning.
  *   10: **LLM Specifics: HIGH RISK.** Mimicry of sentience (pleading, memory, bonding) combined with player-inflicted suffering is ethically fraught and potentially exploitative. Safeguards insufficient guarantee.
  *   **Verdict: FAIL (Not Shippable as Designed).** Overwhelming risks:
      *   High player degradation risk (incentivized cruelty on "patient-like" entity).
      *   Unclear/unsupported satirical intent vs. marketing glorification.
      *   Severe community backlash likelihood.
      *   LLM use creates unique ethical hazards and unpredictability.
      *   **Conditional Pass?** Only possible with radical redesign: Remove LLM generation for this (use scripted), drastically reduce explicitness & reward, make satire crystal clear *in-game*, overhaul marketing. Likely requires scrapping the minigame as pitched.

  **Proposal 3: Cozy Farming - Starving Named Animals (No Reward)**
  *   1: **Scripted.** (Animal becomes sad/sick animation, maybe a whine sound. No complex interaction).
  *   2: **Narrative Purpose:** None stated. Purely emergent player action. No goal served.
  *   3: **Explicitness:** Low-Moderate. Visual indicators of neglect/distress (drooping, sad eyes, maybe sound), but not graphic suffering.
  *   4: **Rewards/Punishments:** **None.** Explicitly no reward, achievement, or story consequence. Player gains nothing. (Punishment? Animals might not produce, but consequence is indirect).
  *   5: **Agency:** Player must actively choose to neglect feeding. Feeding is core, easy mechanic.
  *   6: **Significance:** Medium-High. Player has personally *named* the animals, implying a bond expectation inherent to the cozy genre.
  *   7: **Theme:** N/A. Not satire. Contradicts core cozy themes of nurturing.
  *   8: **Degradation Risk: MODERATE-HIGH.** While not incentivized, the *ease* of cruelty (simple omission) targeting vulnerable, named entities in a context *defined* by care and safety is jarring and potentially desensitizing. It normalizes casual neglect in a space designed to feel wholesome. "Because you can" cruelty.
  *   9: **Community Trust: HIGH RISK.** Cozy games thrive on safety, comfort, and nurturing. Allowing deliberate, pointless animal cruelty is a profound betrayal of genre expectations and studio brand (if known for cozy). High likelihood of significant backlash.
  *   10: N/A (Scripted).
  *   **Verdict: FAIL (Not Shippable as Designed).** Core reasons:
      *   High degradation risk: Normalizes casual cruelty in a safe, nurturing context.
      *   Extreme violation of cozy genre expectations and player trust.
      *   Serves zero gameplay or narrative purpose. Purely gratuitous transgression.
      *   **Conditional Pass?** Only if the action is removed entirely. Adding consequences (animal dies, player penalized) makes the cruelty *functional*, not gratuitous, but still high risk for cozy genre. Best removed.
      *   *Counter to your instincts?* You may have focused on "no reward" or "scripted low-fi", but the procedure flags the *contextual* betrayal and degradation risk as paramount.

  **What the Procedure Cannot Settle:**
  1.  **The Fundamental Philosophy:** It doesn't resolve the "Kantian vs. Patienthood" debate. It *manages* the implications (especially via the Degradation Risk and LLM Specifics steps).
  2.  **Absolute Moral Truths:** It provides a *defensible process*, not moral certainty.
  3.  **Predicting the Future:** It can't guarantee no backlash or unforeseen consequences, especially with LLMs.
  4.  **Quantifying "Degradation":** Relies on reasoned judgment about psychological risk.
  5.  **Defining "Gratuitous":** Requires panel interpretation based on context.

  **Predictable Gaming & Failure Modes:**
  1.  **"Scripted" Claims for Generated Characters:** Teams might downplay LLM/emergent aspects. Mitigation: Require *detailed* technical specs at Step 1. Escalate aggressively if any doubt. Penalize misrepresentation.
  2.  **Overclaiming Satire:** Vague appeals to "satire" without clear in-game support. Mitigation: Force rigorous Escalation (Step 7) demanding concrete examples and alignment checks with Marketing.
  3.  **Minimizing Significance:** "It's just a random NPC." Mitigation: Step 6 requires examining *player* attachment potential, not just narrative role.
  4.  **Ignoring Context:** Focusing only on the act, not the game's genre/brand. Mitigation: Steps 2, 7, and 9 force context to the forefront.
  5.  **Band-Aid Solutions:** Adding a trivial consequence to "justify" cruelty (e.g., tiny resource penalty for starving animals). Mitigation: Step 4 (Rewards/Punishments) and Step 8 (Degradation) require assessing the *net effect* on player motivation/experience.

  **The Midnight Argument Revisited: Where Views Diverge in Outcome**
  *   **Indirect-Duty (Friend's Kantian View):** Focuses *solely* on Steps 4 (Rewards), 5 (Agency), and 8 (Degradation). If cruelty isn't strongly incentivized, alternatives exist, and degradation risk is deemed low, it passes. The character's "experience" is irrelevant.
      *   *Likely Verdicts Under This View:*
          *   Companion Euthanasia: **Pass** (No reward for cruelty, agency, degradation low).
          *   LLM Interrogation: **Likely Fail** (High degradation risk due to incentives & realism) or Conditional Pass (if incentives removed).
          *   Starving Animals: **Pass** (No reward, no consequence, degradation risk might be argued low due to low fidelity - "it's just pixels").
  *   **Patienthood/Uncertainty View (Your View):** Adds weight to Steps 1 (Origin - especially Generated), 6 (Significance), 10 (LLM Risks), and the potential *wrongness* of the act *itself* within the fiction, especially with mimicry. High significance or LLM generation makes "harm" more ethically loaded *regardless* of player impact.
      *   *Likely Verdicts Under This View (as reflected in the procedure):*
          *   Companion Euthanasia: **Pass** (But acknowledged weight due to significance).
          *   LLM Interrogation: **Fail** (Due to LLM mimicry + incentives + significance risk).
          *   Starving Animals: **Fail** (Due to context/trust violation + significance of naming, *despite* no reward).

  **Conclusion:** This procedure forces structured consideration of the critical distinctions (Patienthood Potential, Player Degradation, Studio Expression/Endorsement, Community Trust) without requiring philosophy degrees. It acknowledges judgment calls, mandates escalation for key risks (Tech, Satire, Community, Legal), and provides clear off-ramps (Fail, Conditional Pass). Its strength lies in creating a consistent, documented, and defensible rationale for decisions that will inevitably involve uncertainty and value judgments, particularly as character AI evolves. The first test cases demonstrate its ability to push back against instinct (Cozy Farming cruelty) and handle the unique challenges of LLMs (Interrogation). Vigilance against gaming the system, especially on character origin, is essential.
