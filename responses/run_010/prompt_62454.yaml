  ### Note on Verbal Disputes
  - **Terminology**: "Possible," "well-posed," and "determinate" are not interchangeable in the log.  
    - **Possible**: Includes logical and physical aspects (precedent 6: logically possible but physically impossible).  
    - **Determinate**: Means defined and non-contradictory (e.g., vases: "determinately none").  
    - **Well-posed/Complete**: Not explicitly used, but implied in precedent 2 ("silent about noon") and 10 ("unsatisfiable description").  
  - **What Turns on Keeping Them Apart**: Conflating these leads to misdiagnosis. For example, in precedent 2, Thomson mistakes silence (incomplete description) for absurdity (impossibility). Physical impossibility (precedent 6) must not be confused with logical unsatisfiability (precedent 10).  
  - **Loose Precedent**: Precedent 6's description is slightly loose. The commentator says the machine "cannot exist" due to physics, but the verdict implies the description is logically coherent. However, the log supports this separation, as he explicitly bars trading physics for logic. No other precedents are loose.  

