answer: |-
  The famine declaration system rests on an **implicit theory of famine as a measurable threshold phenomenon**, distinct from its causes. Here's a reconstruction and critical analysis:

  ### Implicit Theory of Famine in Declaration Practice
  1.  **Famine as a Discrete State:** It presupposes famine is a specific, identifiable *state of affairs* (extreme food deprivation, malnutrition, mortality) emerging when social systems catastrophically fail. This state exists independently of its causes.
  2.  **Objective Measurability:** The thresholds treat core indicators (food access, malnutrition, mortality) as objective, quantifiable phenomena analogous to a "magnitude reading" (e.g., seismic activity). Measurement focuses on *outcomes* observable in the population.
  3.  **Agency-Neutral Detection:** The system is designed to *detect* this state *without* needing to establish *how* it occurred. The review committee's "technical and scientific" mandate explicitly brackets questions of intent, negligence, or institutional failure. The state exists and is measurable *prior* to attributing causality.
  4.  **The "What" Before the "Why":** The declaration answers "*Is there a famine?*" (based on thresholds) as a logically and operationally separate question from "*Why is there a famine?*" or "*Who is responsible?*".

  ### Strict Commitments vs. Compatible Accommodations
  *   **Strict Commitments:**
      *   Famine is a distinct, catastrophic threshold state defined by specific population-level outcomes.
      *   This state can be identified through standardized, quantitative measurement of those outcomes.
      *   Identification can and should (for the purpose of declaration) be separated from causal analysis or assignment of responsibility.
  *   **Merely Compatible Accommodations (Not Required by the Theory):**
      *   **Evidential Caution:** Practical difficulty in *proving* intent/deliberate causation in complex emergencies.
      *   **Donor Politics:** Avoiding blame facilitates funding appeals to donors who might include states potentially implicated in causing the famine.
      *   **Operational Need for a Bright-Line Trigger:** Provides a clear, unambiguous signal for mobilizing large-scale humanitarian response, reducing bureaucratic delays caused by debates over causation.

  ### Can Technical Neutrality Be Squared with War Crime & Entitlement Framings?
  *   **Superficially Yes, Fundamentally Tension-Ridden:**
      *   *Superficial Compatibility:* The *measurement* of outcomes (death, malnutrition) used for declaration *can* also serve as *evidence* for a war crime investigation (intentional starvation). Sen's entitlement analysis *explains* how the measurable collapse happens (failure of access mechanisms) without *necessarily* assigning blame at the declaration stage.
      *   *Fundamental Tension:*
          *   **Entitlement Analysis Points to Agents:** Sen's framework explicitly attributes famine to institutional failures (markets, states, social structures) and thus *implicates* agents (governments, armed groups, economic actors). Declaring a famine *using Sen's logic* inherently suggests institutional failure exists, yet the declaration process studiously ignores naming or investigating those responsible.
          *   **War Crime Focuses on Agency:** The war crime of starvation centers on *intentional conduct* by specific actors. The technical declaration, by avoiding causal analysis, creates a disconnect between identifying the catastrophic *result* and investigating the criminal *act* that may have caused it.
          *   **Neutrality as De-politicization (or Obfuscation):** The "technical neutrality" risks depoliticizing famine, framing it as a natural disaster or unfortunate accident, when the entitlement analysis and international law suggest it is often a profoundly political and criminal event. It separates the humanitarian response (triggered by declaration) from the justice/accountability response (which requires a separate, often politicized, process).

  ### Changes Needed to Classify Famine as a Crime
  Treating famine *declaration* as a step towards accountability for a potential crime would require radical changes:

  1.  **Criteria Changes:**
      *   **Intent Indicators:** Thresholds would need supplementation with criteria designed to *infer intent or reckless negligence*. E.g., evidence of siege warfare, blocking aid, confiscating food, destroying markets/farms, discriminatory policies alongside mortality/malnutrition data.
      *   **Causal Linkage:** Criteria would need to assess the *causal link* between actions of specific actors and the observed outcomes, rather than just the outcomes themselves.
  2.  **Who Certifies:**
      *   **Forensic Mandate:** The review body would need a mandate akin to a prosecutor or independent commission of inquiry, with expertise in international law, forensics, and conflict analysis, not just public health/nutrition.
      *   **Investigative Powers:** It would require powers to gather evidence (testimony, documents, satellite imagery) on *actions and intent* of parties to the conflict/state, not just population surveys.
      *   **Independence & Legitimacy:** Certification would need the legitimacy of a judicial or quasi-judicial body (e.g., ICC investigators, UN Human Rights Council commissions), not just technical experts convened by humanitarian agencies.
  3.  **What Certification Licenses:**
      *   **Trigger for Accountability:** The primary outcome would shift from a humanitarian funding appeal to triggering formal investigations (ICC, UN Security Council, national courts) and potential prosecutions.
      *   **Conditionality & Sanctions:** Certification could automatically trigger targeted sanctions, arms embargoes, or conditions on aid/loans directed at responsible parties.
      *   **Humanitarian Imperative Remains:** While focused on accountability, the catastrophic human suffering would still necessitate a massive response, but the political dynamics of delivering aid would become even more complex (e.g., aid used as leverage, access denied by implicated actors).

  **In essence:** The current system implicitly treats famine as a *disaster* to be responded to. Treating it as a *crime* would require reframing the declaration process as an *investigation* into culpable acts causing that disaster. The technical neutrality of the current system serves a specific operational purpose but creates a significant gap between identifying the outcome and addressing the agency often central to its cause, as highlighted by both Sen and international law. Bridging this gap requires fundamentally rethinking the purpose and process of "famine declaration."
