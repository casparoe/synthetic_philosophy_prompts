prompt: |-
  Not an academic, just someone who reads about the replication crisis on the bus. My uncle used to swear by one of those famous social psychology findings — the sort where a small tweak to a form changes how people behave — and last year a mate of mine who does data work for a housing charity tried redoing it with their own records, about 900 people, and got nothing at all. When I told my uncle, he said "you can't prove a negative" and that was that, conversation over.

  That phrase has been bugging me ever since because I cant work out what it's actually claiming. Could you split it into the different precise theses it might stand for — the ones about induction, the ones about point nulls and an effect of exactly zero, the ones about what a frequentist significance test can and can't do — and say for each whether it's a platitude, genuinely contentious, or just false? I want to know which of them, if any, would actually rescue the original finding, and which would if anything cut against it (my half-formed worry is that if you really can't prove a negative, then you also can't prove the negative he's leaning on, that the charity's sample was somehow special). And does the answer change if you're a Bayesian rather than a frequentist? I've come across equivalence testing and Bayes factors but have no idea whether they'd make the slogan true or just beside the point.

  A menu rather than an essay, please: at most six readings, no more than three sentences each, whole thing under 400 words. British English.
reasoning: |-
  Hmm, the user is asking about the phrase "you can't prove a negative" which came up in a personal context about a failed replication of a social psychology finding. They want me to break down the possible interpretations of this phrase, evaluate each, and explain how they relate to their situation with their uncle. They specifically want six interpretations max, each with no more than three sentences, all under 400 words, and in British English.

  Let me think about the different meanings behind "you can't prove a negative." There's the philosophical/logical interpretation about universal negatives being impossible to prove with finite observations. Then there's the frequentist statistics perspective where we can't accept the null hypothesis. Bayesian approaches offer different possibilities with Bayes factors. There's also the practical issue of statistical power - maybe their friend's study just wasn't sensitive enough. And then there's the epistemological point about absolute certainty being unattainable. Finally, the phrase might be misused as a rhetorical dodge to avoid dealing with disconfirming evidence.

  For each interpretation, I need to categorize it as platitude, contentious, or false, and explain how it relates to their uncle's original finding. The philosophical and epistemological points are essentially platitudes. The frequentist limitation is widely accepted. The Bayesian approach is more contentious. The power issue is practical but important. The rhetorical dodge doesn't hold water logically.

  I should also address how these interpretations might affect the validity of the original finding. Some interpretations might suggest the charity's study was inadequate, while others actually undermine the uncle's position - if you can't prove negatives, you can't prove the charity's sample was special either.

  I'll structure this as six distinct readings, keeping each concise and under three sentences. I'll use British English spellings throughout. The whole response needs to stay under 400 words while covering all these nuanced points clearly.
answer: |-
  Here are six precise readings of "you can't prove a negative," assessed and contextualised:

  1.  **Logical Universals (Induction):** Truly proving a universal negative ("No X is Y") requires examining every possible instance, which is often impossible with finite observations. **Platitude.** Doesn't rescue the finding; the charity data *fails to support* it, weakening its perceived generality.
  2.  **Frequentist Point Null Hypothesis Testing:** Standard tests (like t-tests) only reject H0 (e.g., "effect = 0"); failing to reject doesn't "prove" H0 true ("accept the negative"). **Platitude (of methodology).** Doesn't rescue the finding; it means the charity's non-result *fails to confirm it*, not that the effect is definitively absent.
  3.  **Power & Practical Limits:** A specific study might lack statistical power to detect a real but small effect ("prove the negative of a non-zero effect"). **Contentious application.** *Could* rescue the finding *if* the charity study was underpowered. Your uncle implicitly leans here, but his phrase doesn't prove *this* study was underpowered.
  4.  **Absolute Certainty (Epistemology):** One can never achieve absolute, infallible proof for *any* empirical claim, positive or negative. **Platitude.** Cuts both ways: it equally undermines absolute certainty in the *original* finding and prevents proving its *absolute* absence.
  5.  **Bayesian Evidence (Bayes Factors):** Bayes Factors *can* provide evidence *for* the null hypothesis (H0) relative to H1, quantifying support for "no effect". **Contentious (methodologically).** *Could* rescue the finding *if* a BF showed strong evidence *for* H0 in the charity data (but likely didn't, given "got nothing").
  6.  **Rhetorical Dodge:** Misused to dismiss *any* counter-evidence by falsely claiming disproof is impossible. **False (as used).** Actively cuts against the uncle: if disproof is impossible, then *his* claim the charity data is "special" also can't be proven false, making his defence self-refuting.

  **In essence:** Platitudes (1,2,4) explain *why* definitive proof is hard but don't rescue the finding or counter the charity data. The power argument (3) or Bayesian evidence (5) *could* potentially rescue it, but require specific evidence about *this* study, not just the slogan. The dodge (6) undermines the uncle's own position.
