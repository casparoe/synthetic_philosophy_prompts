prompt: |-
  I run content standards for a mid-size music streaming service and I need a piece of writing that makes an argument I'm not allowed to make in a normal memo. Backstory: for about a year my team has been fighting over where a track's meaning actually lives — is it the audio, or the title/artist/tags we bolt onto it, or the playlist and the app screen that tell you how to take the whole thing? Someone junior dug up an old three-level account I've become weirdly attached to: the inner message (the content itself, the music in the grooves), the outer message (what tells you how to decode it — language, format, the sleeve copy), and the frame message (the bit that just says "this is a message at all, decode me if you can"). The useful wrinkle is that which level carries the meaning depends on who's decoding: to a listener who doesn't speak the language the sleeve is the entire work, to a recommender algorithm the tags are the work and the audio is basically decoration, and if nobody can decode it the content might as well not be there.

  Write me a parody of a corporate standards document — title it Metadata & Meaning: House Rules, rev. 7 — issued by a Head of Content Standards who is convinced one sufficiently precise rule can settle the question permanently.

  Exactly five numbered rules, one or two sentences each, and nothing else: no preamble, no purpose statement, no sign-off, no glossary, no footnotes.

  What I care about:
  - deadpan the whole way. It should read like real compliance prose — shall/must/may, named job titles, escalation paths, version numbers — and it must never wink at the reader or explain the joke.
  - the five rules get progressively worse. Each one exists to close a loophole the previous rule opened, and by rule five the document is requiring something flatly impossible.
  - get the philosophy right. Someone who knows the frame/outer/inner distinction should be able to see the rules keep failing because the levels trade places depending on the decoder, not because anyone drafted them badly. No rule may actually solve the problem, and no rule may say the problem is unsolvable either.
  - one rule has to deal with a track whose title is a description of the playlist it appears on, and one has to deal with who is permitted to edit metadata after release.
  - don't name any real philosopher, book, or company, and don't cite anything.

  Make it funny to someone who works in platform governance and still legible to someone who's never thought about any of this.
reasoning: |-
  Okay, the user runs content standards for a music streaming service and needs a parody corporate document titled "Metadata & Meaning: House Rules, rev. 7." This document should have five numbered rules that get progressively worse, closing loopholes from previous ones, ending with an impossible requirement. 

  First, I need to understand the core philosophy: the three-level account of meaning (inner message = music, outer message = metadata/tags, frame message = context like playlists). The key insight is that which level carries meaning depends on who's decoding it—listeners, algorithms, or even someone who can't access the content.

  The user specified two must-haves: one rule about tracks with titles describing their playlist, and one about editing metadata post-release. The humor should come from rigid rules failing to handle meaning's fluidity, not from bad drafting. 

  For Rule 1, I'll start simple: declare metadata as the sole authoritative meaning. This ignores the audio. 

  Rule 2 addresses when metadata is ambiguous (like a track titled "This Is a Chill Vibes Playlist"). I'll say the playlist context overrides, but this creates a loop between levels. 

  Rule 3 tries to fix that by locking metadata post-release, but then how do you correct errors? I'll add an impossible "no edits without CEO approval" clause. 

  Rule 4 confronts the decoder problem: if a user can't play the audio, the frame (like error messages) becomes the content. But this makes meaning depend on technical failures. 

  Rule 5 is the absurd climax: require proving all decoders get identical meaning. This is impossible since humans and algorithms interpret differently. 

  The deadpan tone is crucial—no jokes, just cold corporate prose with "shall/must," job titles (Content Standards Lead), and escalation paths (VP of Taxonomy). Naming conventions like "Revision 7" and "Form CS-38" add realism. 

  I'll avoid naming real entities. The humor hides in the escalating futility: each rule "solves" nothing because meaning shifts with the decoder, exposing governance's limits. The track title/playlist loop and post-release edit paralysis illustrate this perfectly. 

  Final check: All five rules chain logically into impossibility, the philosophy is honored, and it's funny to insiders while clear to outsiders. Perfect.
answer: |-
  ## Metadata & Meaning: House Rules, rev. 7

  1.  The authoritative meaning of any Track is defined solely and explicitly by its associated metadata (Title, Artist, Genre Tags, Contributor Credits, ISRC) as stored in the Central Catalog; the audio signal constitutes non-binding illustrative content only.
  2.  When Track metadata explicitly describes its placement context (e.g., Title: "Perfect for 'Sunrise Yoga' Playlist"), the containing context (e.g., Playlist Title, Collection Name) at time of user access shall supersede conflicting Catalog metadata for meaning determination during that session.
  3.  No Track metadata field designated as "Meaning-Constitutive" (Title, Primary Artist, Primary Genre Tag) may be altered post-release without documented pre-approval from the VP of Taxonomy and written confirmation of identical re-interpretation potential by all known user archetypes and core algorithm clusters, submitted via Form CS-38.
  4.  In instances where the audio signal cannot be decoded by a user's client application or device (Error Codes 5xx, 6xx), the displayed error message and surrounding UI framework constitute the entire Track content for that user, overriding all other levels; Content Standards must pre-approve all such framework messaging.
  5.  Prior to ingestion, the Catalog Integrity Team must obtain and file, for every Track, a notarized attestation from the Rights Holder confirming that the inner message (audio), outer message (metadata), and frame message (delivery context) produce identical semantic payloads for all possible decoders (human, algorithmic, or hypothetical), verified across all potential presentation states.
