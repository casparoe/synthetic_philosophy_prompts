prompt: |-
  Thirty-five years in paleobiology, mostly taphonomy — my whole career was arguing about what it means when a fossil *isn't* there, and in that line of work the silence of the rock is exactly evidence, once you've got a preservation model to weigh it against. Retired now, reading ancient history for pleasure. In my book group we were going back and fourth about whether a certain temple was destroyed by fire in a particular decade. Nobody writing about those years mentions a fire, and the record for that stretch is unusually good — a couple of chronicles and a run of administrative tablets survive, and they'd plausibly note the loss of a major cult site. A friend waved me off with "absence of evidence is not evidence of absence," and called my inference worthless on that basis.

  Can you lay out the different precise claims that slogan might be standing in for, from the trivial to the radical, and say for each whether it's actually true and whether it rescues his objection? I want the readings spelled out in terms of what has to hold for a source's silence to carry weight — how likely the author was to mention the thing, how much of the record survives to us, how likely the event was anyway. Then tell me which reading he was probably invoking, and whether there's a version of the slogan a paleontologist would reject outright. American English, please.
