  Based on your panel's eight precedents, I identify three core candidate rules that collectively explain all decisions. These rules operate as a hierarchy: methods must satisfy **Specificity** first, then **Suffering/Duration**, and finally **Justification/Stage**. The rules are interdependent, and the panel appears to apply them sequentially (like a decision tree). Ambiguity arises because the rules are not explicitly weighted, and borderline cases (e.g., Case 7) reveal subjectivity in "sufficient justification." I'll break this down step by step, apply it to your new cases, and propose a low-cost test for next year.

  ---

  ### **Three Candidate Rules (Hierarchical Framework)**
  Your precedents suggest the panel evaluates proposals in this order:

  1. **Specificity Rule**:  
     - *The method must minimize harm to non-target organisms.*  
     - Reject if non-target effects are significant (broad-spectrum impacts).  
     - Overrides other concerns if failed (e.g., Case 1).  
     - Precedents supporting: Case 1 (rejected for non-target death), Case 2 (approved for target-specificity), Case 4 (approved despite ethical concerns because specificity was high), Case 5 (approved for specificity to mosquito larvae).

  2. **Suffering/Duration Rule**:  
     - *The method must minimize suffering and duration of harm.*  
     - Reject if death/damage is prolonged or uncertain (e.g., glue traps).  
     - Accept if death is quick (instant or hours) OR affects a developmental stage where suffering "does not arise" (e.g., larvae/eggs).  
     - Precedents supporting: Case 5 (larvicide approved due to pre-adult stage), Case 6 (rejected for prolonged suffering), Case 8 (approved for instant death), Case 2 (approved despite days-long death because feeding stops quickly, reducing perceived suffering).

  3. **Justification/Stage Rule**:  
     - *The justification must be proportional to the harm caused.*  
     - Strong justifications: human safety, ecosystem protection, or invasive threats.  
