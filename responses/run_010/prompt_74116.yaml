prompt: |-
  I lead the health economics function at a national technology-appraisal body. My working vocabulary is QALYs, incremental cost-effectiveness ratios, opportunity-cost-based thresholds, a fixed budget, and the distributional weighting schemes that add weight to treatments for patients with large expected lifetime health shortfalls. My exposure to the philosophical literature is limited: I know only in outline that prioritarianism holds that benefits matter more the worse off the recipient is in absolute terms, and that Parfit's leveling-down objection is meant to show why telic egalitarianism fails where prioritarianism does not.

  Restate the priority view and the leveling-down objection into my vocabulary as faithfully as you can: what weighting scheme or social welfare function each corresponds to, what a comparative claim about relative position would have to look like in an appraisal, and what an allocation problem under a fixed budget can and cannot express. Then give me the residue report — which claims carry over cleanly, which you had to bend to fit (and say precisely how you bent them), and which have no counterpart at all in cost-effectiveness practice. Judge whether that residue is a limitation of my framework or evidence that the philosophical dispute is less substantive than it sounds, and test rather than accept one candidate I can think of: that a zero-sum budget makes it impossible to keep relative and absolute considerations apart, so that the leveling-down scenario may not be statable in my terms at all. Do not smuggle in the assumptions of welfare economics and present them as translation, and do not give me sources or a reading list — I want the reasoning.
reasoning: |-
  Okay, let's tackle this step by step. The user is a health economics lead at a technology-appraisal body, deeply embedded in practical cost-effectiveness analysis with terms like QALYs, ICERs, and distributional weighting. They want a translation of prioritarianism and the leveling-down objection into their framework, plus a residue report. 

  First, I need to map philosophical concepts to health economic tools without importing welfare economics assumptions. Prioritarianism's core is that health gains matter more for the worse off in absolute terms. In CEA, that's already operationalized through severity-based weighting—like giving extra weight to QALYs for patients with large lifetime health shortfalls. That's a clean fit: the social welfare function would apply weights based on pre-treatment absolute health deficit. 

  Now the leveling-down objection: Parfit's point that pure equality might prefer making everyone worse off just to reduce inequality. In CEA, any policy must show health gains—you can't even model a scenario where you destroy health without offsetting benefits. The budget constraint is fixed but positive-sum; you're always allocating gains. So telic egalitarianism's "equality for its own sake" has no footing here. A comparative claim would need to show that reducing inequality *without* harming anyone is cost-effective—but that's just efficiency, not leveling down. 

  Residue report: Prioritarianism translates neatly to severity weighting. Leveling-down can't be expressed because CEA requires Pareto improvements. This isn't a limitation of CEA; it's evidence that the philosophical dispute relies on zero-sum dynamics that don't exist in budget-constrained QALY maximization. The user's hunch is right—fixed budgets make "relative vs absolute" inseparable. 

  Key insight: In CEA, you can't even *describe* leveling-down as a viable option. That's not bending the concepts; it's proof that telic egalitarianism is irrelevant to real-world resource allocation.
answer: |-
  Here’s the translation, residue report, and verdict grounded strictly in your operational framework:

  ### 1. **Priority View Restated**  
  - **Social Welfare Function**: \(\text{SWF} = \sum \left[ w(s_i) \cdot \Delta QALY_i \right]\),  
    where \(w(s_i)\) is a **severity-dependent weight** applied to QALY gains (\(\Delta QALY_i\)) for patient group \(i\).  
    \(s_i\) = **absolute pre-treatment lifetime health shortfall** (e.g., expected QALYs without intervention vs. population maximum).  
    \(w(s_i) > 1\) when \(s_i\) is large, and \(w'(s_i) > 0\) (weight increases with shortfall size).  
  - **In Appraisal**: A treatment for patients with larger \(s_i\) (e.g., terminal illness) receives higher effective QALYs per unit cost, improving its ICER relative to the threshold.  
  - **Budget Constraint Expression**: Under a fixed budget, this weighting scheme can be implemented by **adjusting the effective QALY gains** in cost-effectiveness calculations, making interventions for the severely ill more likely to meet the opportunity-cost threshold.

  ### 2. **Leveling-Down Objection Restated**  
  - **Claim**: A purely "egalitarian" weighting scheme might prefer Outcome A over Outcome B **solely because A has less inequality**, even if:  
    - Total QALYs in A < Total QALYs in B,  
    - Some groups in A have strictly fewer QALYs than in B,  
    - No group in A has more QALYs than in B.  
  - **In Appraisal Terms**: This would require a hypothetical **comparative claim** that an allocation reducing health inequality is "better" **despite**:  
    - Lower aggregate QALYs,  
    - Worse health for some groups,  
    - No health gain for any group.  
  - **Budget Constraint Limitation**: Under a fixed budget, **no such allocation can exist**. Every decision compares interventions with *positive* QALY gains; you cannot allocate resources to actively *reduce* health (e.g., destroying QALYs) to achieve equality. The closest analogue—diverting resources from a high-QALY-gain intervention for the well-off to a lower-QALY-gain intervention for the worse-off—still requires net health gain overall or for the worse-off group.

  ---

  ### **Residue Report**  
  | **Concept**               | **Translation Fidelity** | **Bending/Exclusion** |  
  |----------------------------|---------------------------|------------------------|  
  | **Prioritarianism**        | Clean carry-over.         | None. Your "large lifetime health shortfall" weighting **is** prioritarianism in practice. |  
  | **Leveling-Down Scenario** | **No operational counterpart.** | Must bend: Telic egalitarianism requires a scenario where destroying health improves equality—**infeasible** under budget-constrained CEA. The closest parallel (favoring equality-enhancing but less efficient allocations) still requires net health gains. |  
  | **Telic Egalitarianism**   | No meaningful expression. | Excluded: CEA cannot rank allocations based *purely* on reduced inequality without health gains. |  

  ---

  ### **Verdict on the Residue**  
  - **Limitation of Framework?** Partially. Your budget constraint inherently **blocks leveling-down** by requiring Pareto-improvements (all allocations must produce net QALY gains). This isn’t a flaw—it reflects that real-world appraisal must improve health, not sabotage it.  
  - **Less Substantive Dispute?** **Yes**, in your context. The leveling-down objection targets a hypothetical that **cannot arise** under fixed-budget CEA:  
    - **Zero-Sum Budget Test Confirmed**: Under your model, all resource shifts are *positive-sum* (net QALYs ≥ 0). Health cannot be "leveled down"; it can only be allocated to different beneficiaries. Absolute shortfalls (*priority view*) can be weighted, but relative inequalities (*telic egalitarianism*) lack levers without violating efficiency.  
  - **Core Insight**: The philosophical distinction collapses in practice because **your ICER/threshold system cannot express trade-offs between total health and equality**—it can only incorporate equality via *weighted aggregation* of absolute gains (prioritarianism). "Pure equality" has no purchase where every option must create health.

  ---

  ### **Conclusion**  
  Your framework **naturally embeds prioritarianism** via severity weighting but **precludes telic egalitarianism** by design. The leveling-down objection highlights a pathology irrelevant to resource allocation under a health-improvement mandate. The residue isn’t a limitation—it reveals that your model operationalizes the *only ethically coherent version of equity* in cost-effectiveness: weighting gains by absolute need, not chasing equality at the cost of health destruction. The dispute is substantive in philosophy but functionally academic in your practice.
