answer: |-
  Aquinas's position on tyrannicide is nuanced and easily misunderstood. While Chapter 6 of *De Regno* (On Kingship) uses approving examples like Ehud and Judith, and the *Summa Theologiae* (II-II, Q42, A2) states overthrowing tyranny isn't sedition, **he absolutely does *not* grant a general license for private individuals to assassinate tyrants.** His core principle that only public authority can licitly kill (*Summa Theologiae* II-II, Q64, A3) remains paramount. Here's how he reconciles the seemingly conflicting points and the crucial distinction between individual and community action:

  1.  **The Foundational Principle: Public Authority Required for Killing:**
      *   Aquinas firmly holds that the *deliberate taking of human life* (execution, not self-defense) is an act of justice reserved *exclusively* for those holding legitimate public authority ("auctoritas publica"). This authority derives from God (Rom 13:1-4) and is exercised for the common good.
      *   A private individual ("persona privata") lacks this authority and thus commits murder if they deliberately kill another, even a tyrant.

  2.  **The Exception: Divine Commission (Extraordinary & Rare):**
      *   How, then, does he justify Ehud and Judith? Aquinas interprets these biblical figures **not as acting as private individuals in the ordinary sense, but as instruments of God executing a divine judgment.**
      *   They received a special, direct mandate from God (as understood by Aquinas) to act. This bypasses the *normal* requirement for human public authority because God, as the supreme authority, can directly commission someone for this task.
      *   **Crucially:** Aquinas presents this as an *exceptional, extraordinary case*, not a general rule applicable to anyone who perceives tyranny. He does *not* argue that private citizens can decide God has commissioned *them*; the biblical examples are presented as unique divine interventions. This is not a green light for vigilante justice.

  3.  **The Community's Role: Revoking Authority, Not Private Murder:**
      *   This is where the key distinction lies. Aquinas argues that **the community ("multitudo") is the original source of the ruler's authority.** The ruler holds power *for* the common good *from* the people (even if mediated through election or custom), ultimately derived from God.
      *   **Tyranny as a Breach of Contract:** When a ruler becomes a tyrant, oppressing the common good they were appointed to serve, they fundamentally violate the implicit "pact" or purpose of their rule. They forfeit their right to govern.
      *   **Deposition as an Act of Public Authority:** When the community acts *collectively* to depose the tyrant, **they are exercising their residual, original authority.** They are revoking the power they originally granted. This is not a "private" act, even if done by many individuals together. It is the *community acting in its public capacity* as the source of political legitimacy.
      *   **Execution *After* Deposition:** Once the tyrant is deposed by the community's authority, **they are no longer the ruler.** The community (or its newly constituted representatives/public authority) can then *licitly* execute the deposed tyrant as a dangerous criminal/enemy of the state, using the *public authority* now properly exercised by the community or its agents. This execution happens under the auspices of public justice, not private vengeance.
      *   **"Stirring Up" is Not Sedition:** This is why overthrowing a tyrant isn't sedition (*Summa* II-II, Q42, A2). Sedition is rebellion against *just* authority. Tyranny, by definition, is the *corruption* of just authority into oppression. Resisting it is defending the common good and the true source of authority (the community/God), not attacking it.

  4.  **Conditions for Community Action (Explicit & Implied):**
      Aquinas attaches significant conditions and cautions, especially in *De Regno* Ch. 6, regarding *any* action against a tyrant:
      *   **Exhaustion of Peaceful Means:** Every possible recourse to persuasion, petition, or pressure must be tried first.
      *   **Proportionality & Avoiding Greater Evil:** The remedy must not cause more harm than the tyranny itself (e.g., widespread civil war, chaos, or inviting a worse tyrant).
      *   **Reasonable Chance of Success:** Rash attempts that will only provoke worse repression are forbidden.
      *   **Consent/Willingness of the Community:** The action must genuinely reflect the will of the populace ("ex communi voluntate"), not just a faction. Aquinas is wary of factional strife replacing one oppression with another.
      *   **For *Private* Individuals (Beyond Divine Commission):** Essentially, no right to assassinate. Their role is limited to endurance (if bearable), prayer, or supporting the *public* action of the community if/when it lawfully arises. Vigilantism is condemned.

  **Answering Your Core Question: Community Action vs. Individual Assassination**

  *   **It is Different in Kind:** This is the crucial point.
      *   **Private Assassination:** An individual, lacking public authority, deliberately kills the ruler. This is murder, *unless* under an extraordinary, directly divine commission (which Aquinas sees in the biblical cases but does not extend as a general principle).
      *   **Community Deposition/Execution:** The community, *as the original source of political authority*, collectively acts to revoke the mandate of the ruler who has become a tyrant. This is a public act. The subsequent execution (if necessary) is carried out by the community or its agents *acting under this now-exercised public authority*, making it a legitimate act of public justice against a deposed criminal, not a murder. The authority to kill derives from the community's public status.

  **In Summary:**

  Aquinas provides **no general justification for private individuals assassinating tyrants.** His approval of Ehud and Judith rests solely on his interpretation of them as uniquely divinely commissioned instruments. His core principle that only public authority can kill remains untouched.

  The **"community can depose him" route is fundamentally different** and is the *only* licit human path Aquinas endorses for removing a tyrant. It involves the community exercising its inherent, residual public authority to revoke the ruler's mandate. This act of deposition transforms the tyrant from a ruler into a criminal enemy of the state. Any subsequent execution is then performed under the community's public authority, satisfying Aquinas's requirement. It's not merely "the crowd doing it" instead of one person; it's the legitimate source of political power reclaiming its authority and acting justly through that reclaimed public role.
