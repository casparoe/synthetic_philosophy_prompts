prompt: |-
  I'm a novelist and you're my philosophy-of-time consultant, so please don't give me the survey answer — think hard about this one.

  My book has exactly one piece of machinery in it: a device that shows my protagonist what is happening *right now* at a particular star forty light years out. Not what happened there, what is happening there now. Whether that device is even coherent seems to hinge on there being a real, frame-independent answer to "which distant events are simultaneous with this moment here." My physicist brother says relativity settled that decades ago and that I'm writing fantasy; my agent says readers wont notice.

  So I want a number: your credence that there is a metaphysically privileged cosmic present — a distinguished slicing of spacetime that picks out what's real *now* across space. Count it as true if there's a fact of the matter independent of anyone's choice of reference frame, even if no experiment could ever tell us which frame is the right one.

  Then give me the decomposition rather than just the total. Roughly: how likely is it that the presentism/eternalism dispute is substantive at all instead of two vocabularies; how much does special relativity really decide; if a privileged slicing is compatible with the physics, is positing it a respectable move or a naked ad hoc patch; and does the felt passage of time carry any evidential weight here. A number and one sentence of reasoning for each, how they combine into your total, and which sub-question the total is most sensitive to and what would budge it.

  Two things I care about most. Be straight about the state of play: mark clearly which of these is settled among people who actually work on it and which is genuinely open, and don't hand me a contested position as if it were consensus. And tell me where my brother and my agent are actually disagreeing, since they both claim to know the answer.
