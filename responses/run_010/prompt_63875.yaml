prompt: |-
  I work in bank supervision and I read philosophy at night, mostly to stop my head from turning into a spreadsheet. I've been working through the "wrong kind of reasons" stuff and I get the basic move: if believing something would make you happier, that's not a reason bearing on whether it's true, and same for admiration or fear. Fine. But there's a wrinkle I can't find anywhere and I dont know if it's a thing with a name or just me being confused at midnight.

  The wrinkle is that the very same consideration seems to be a wrong-kind reason when I'm the only one acting on it, and a right-kind reason once enough other people act on it too. Two cases. First, from work. A small bank gets shaky. My reason for leaving my deposits where they are isn't that the bank is sound — I have no clue whether it is — it's that everyone else is leaving theirs, and that's precisely what keeps it sound. On its own that's a purely instrumental, arguably wrong-kind reason to trust the place. But if everyone has that reason and acts on it, the bank actually is sound, and now there's a reason to trust it that has something to do with whether it's trustworthy. Second, less technical: I have no reason to admire our new department head except that admiring him makes the office run smoothly, which is obviously the wrong kind. Now suppose everyone admires him on exactly that basis, the admiration changes how he behaves, and after two years he really is a magnanimous, competent, decent boss. Then the admiration everybody had seems to have manufactured the very property that makes admiration fitting.

  What I want isn't the label, it's the carving. I know someone will say "self-fulfilling prophecy" and that's not it — I'm not asking about the causal mechanism, I'm asking whether the *kind* of reason changes, and when. So: is there an established concept for reasons that are wrong-kind at the individual level and right-kind at the collective level, or a name for the flip itself? What are the nearest concepts — ordinary conventions, reasons that come into existence through promises or other commitments, the distinction between reasons about an object and reasons about having an attitude toward it — and how is my pattern different from each of those, not just vaguely adjacent? And where does the flip fail? I suspect my second case is shakier than my first: if everyone in a cult admires the guru, and the admiration really does make him widely admired, that doesn't make him admirable, so it seems to matter which properties an attitude can bring into existence and which it can't. If no name exists, coin one and give me the boundary conditions — I want to be able to explain to my seminar group why the bank case flips and the guru case doesn't, without just waving at it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They work in bank supervision and study philosophy at night. They're dealing with the "wrong kind of reasons" problem but noticed a twist: a reason that seems wrong-kind individually becomes right-kind when collectively acted upon. They provided two examples—bank stability and admiration for a boss. Their main questions are: is there a name for this flip, how does it differ from similar concepts, and when does it fail?

  First, I need to recall the basics of wrong vs. right kind of reasons. Wrong-kind reasons are about the consequences of holding an attitude, not about the object's properties. Right-kind reasons directly relate to the object's properties that make the attitude fitting. The user's insight is that collective action can transform a wrong-kind reason into a right-kind one by altering the object itself.

  Looking at their examples, the bank case is clearer. Individually, staying because others stay is instrumental (wrong-kind). But if everyone does this, the bank remains solvent, creating a genuine reason to trust it. The admiration case is trickier. Collective admiration might change the boss's behavior, making him admirable, but the guru example shows it doesn't always work. So the key difference is whether the attitude can causally produce the relevant properties.

  Next, I should check existing philosophical concepts. Constitutive rules come to mind—like in money or promises, where collective acceptance creates the fact. But here, it's more about causal generation. Emergent properties might fit, but that's a broader concept. The term "bootstrapping reasons" feels right—reasons that, through collective action, bootstrap the very properties they depend on. But I need to ensure this isn't just self-fulfilling prophecy; the user specified they're interested in the reason's kind changing, not just the mechanism.

  For boundary conditions, the flip works when:
  1. The attitude can causally generate the property (solvency through deposits, boss's traits through morale).
  2. The property is attitude-dependent (social facts vs. intrinsic ones).
  3. There's sufficient participation (critical mass for the effect).

  The guru example fails because admiration can't make him intrinsically virtuous; it only affects social perception. This highlights the difference between social and non-social properties.

  The user's deeper need might be to apply this framework in their work and seminars. They want clear criteria to distinguish cases like the bank from the guru. They also might seek terminology to articulate this flip effectively in discussions. Providing a coined term like "bootstrapping reasons" with defined boundaries addresses their request for a tool to explain the distinction without hand-waving.

  I should also note where existing concepts fall short. Conventions involve coordination but don't necessarily change the reason's kind. Promises create new reasons through commitment, but here it's about collective action generating fittingness properties. Emphasizing the causal role of attitudes in creating properties is crucial.

  Finally, validating their intuition that the admiration case is shakier reinforces their critical thinking. It shows that not all socially constructed properties are the same—some require more than collective attitude to be genuinely fitting.
answer: |-
  This is a razor-sharp observation that cuts to the heart of the attitude-dependence of reasons and the social construction of normative facts. You've identified a genuine phenomenon that sits at the intersection of epistemology, action theory, and social ontology. There isn't a single, universally agreed-upon label for this specific "flip," but the *structure* is well-recognized and can be precisely carved using established concepts. Let's break it down:

  **The Core Mechanism: Causal Generation of Fittingness Properties**

  The flip occurs when **collective action based on instrumental/WKR concerns *causally generates* the very property that makes the attitude fitting (provides an RKR).** The *kind* of reason changes because the *object* changes. What was a reason *about the consequences of holding the attitude* (WKR) becomes (or enables) a reason *about the properties of the object itself* (RKR) through the collective action it motivates.

  1.  **Individual Level (WKR):** Your reason for attitude A (trust, admiration) towards object O is purely instrumental: holding A has good consequences *for you* or *for others* (e.g., preventing a bank run, office harmony), *independent* of O's current properties fitting A. This is paradigmatically the Wrong Kind of Reason. It doesn't bear on whether O *is* trustworthy or admirable *now*.
  2.  **Collective Action & Causal Effect:** When *sufficiently many* individuals act on this instrumental/WKR (e.g., leave deposits, express admiration), their actions *cause* O to *acquire* or *manifest* the property P that makes attitude A fitting (e.g., solvency, magnanimity/competence).
  3.  **Collective/Post-Action Level (RKR Emerges):** *Because* of the collective action motivated by WKRs, O now *possesses* property P. This property P *is* a paradigmatic Right Kind of Reason for attitude A. The reason is now directly about the object's *actual* fittingness-making property.

  **Why This Flip Isn't Just...**

  *   **A Self-Fulfilling Prophecy (SFP):** You're right to distinguish this. SFPs focus on the *belief causing the event*. Your focus is on the *kind of reason* motivating the *action/attitude* that causes the event *which then creates a new kind of reason*. SFPs describe the causal chain; you're analyzing the normative metamorphosis *within* that chain.
  *   **An Ordinary Convention (e.g., driving on the right):** Conventions solve coordination problems. The reason to drive on the right *is* that others do it (a coordination reason, arguably a WKR for the *belief* that "one *should* drive on the right here"). Crucially, the convention *doesn't* typically create a *new fittingness property* in the road itself. The road doesn't become intrinsically "right-driving-fitting." Your cases involve generating *intrinsic fittingness properties* (solvency, admirable character traits).
  *   **Reasons from Promises/Commitments:** Promises create new *obligations* (reasons for action) via the act of promising. Your flip doesn't involve new obligations *per se*, but the *causal generation of new fittingness properties* (P) for existing attitudes (A) via collective action motivated by WKRs. The new RKR is about P, not about keeping a promise.

  **The Best Fit: Constitutive Rules & Emergent Normative Facts (with a caveat)**

  The closest established concept is **Constitutive Rules** (Searle) in the context of **Social Ontology**. Constitutive rules create the very possibility of certain facts: "X counts as Y in context C." Money is the classic example: Pieces of paper (X) count as money (Y) because we collectively accept they do (C). Acting *as if* they are money *makes* them money.

  *   **Application to Your Cases:**
      *   **Bank Solvency:** Solvency is partly constituted by depositor confidence. The collective action *based on the WKR* (staying to prevent a run) *constitutes* the state of solvency in that moment. "Sufficient depositors maintaining deposits (X) counts as solvency (Y) in context C (a fractional reserve banking system vulnerable to runs)." Their actions *are* the solvency (or a crucial part of it). The RKR (trust based on solvency) emerges because solvency *is* constituted by the collective action motivated by the WKR.
      *   **The Boss:** Collective admiration (motivated by the WKR of office harmony) can *constitute* his authority, perceived competence, and even *elicit* magnanimous behavior through positive reinforcement and the Pygmalion effect. His magnanimity *becomes real* partly *because* of the collective attitude. "Collective expressions of admiration (X) count as establishing authority/perceived competence (Y1) and elicit magnanimous behavior (Y2) in context C (a hierarchical workplace)." The RKR (admiration based on actual magnanimity) emerges because the magnanimity was *generated by* the collective attitude initially based on the WKR.

  **The Caveat & The Flip Failure (Guru Case):** Constitutive rules work for *social facts* (solvency, authority, *being admired*). They **fail for intrinsic, non-social properties** that cannot be constituted solely by collective attitude.

  *   **Why the Boss *Can* Flip (Partially):** Leadership qualities like magnanimity, perceived competence, and authority *are* highly socially constructed and responsive to the attitudes of others. Collective admiration can genuinely *elicit* and *reinforce* these traits, making them real properties of the person. The RKR becomes fitting because the property was causally generated.
  *   **Why the Guru *Doesn't* Flip:** True moral admirability (e.g., genuine compassion, profound wisdom, selflessness) is generally considered an *intrinsic* property, not *solely* constituted by others' attitudes. While collective admiration might make him *powerful* or *widely admired* (social facts), it cannot *constitute* genuine moral virtue if it's absent. Collective delusion doesn't create intrinsic goodness. The initial WKR (admire for harmony) leads to collective action (admiration) which creates a *different* social property (being widely admired), **not** the intrinsic property (being admirable) that would provide an RKR for admiration. The attitude cannot generate the required fittingness property.

  **Coining a Term: Bootstrapping Reasons**

  Since no perfect single term exists, let's coin one reflecting the mechanism: **Bootstrapping Reasons**.

  *   **Definition:** A consideration that functions as a Wrong Kind of Reason (WKR) for an attitude A towards object O *at the individual level*, but which, *when acted upon collectively*, causally generates (bootstraps) the very property P in O that constitutes a Right Kind of Reason (RKR) for A.
  *   **Boundary Conditions (When the Flip Works):**
      1.  **Attitude-Dependent Property:** The fittingness-making property P for attitude A must be of a type that *can* be causally generated or sustained by the collective holding of attitude A (or actions directly motivated by it). (Works for solvency, social authority, *some* aspects of character reinforced by feedback; fails for intrinsic moral virtue, fundamental physical facts).
      2.  **Causal Efficacy:** The collective action based on the WKR must be *sufficient* to actually generate or sustain P. (Requires critical mass/tipping point).
      3.  **Reflexivity:** The property P must be such that its existence depends, at least in part, on the attitudes/actions of the agents holding A (or considering it). (Solvency depends on depositor behavior; a leader's efficacy depends on follower response; intrinsic virtue does not).
      4.  **Normative Shift:** The reason *after* the bootstrap is genuinely an RKR – it directly concerns P, which now genuinely exists as a property of O.

  **Explaining the Difference (Bank vs. Guru) to Your Seminar:**

  1.  **Bank Run Prevention (Flip Works):**
      *   *Individual WKR:* "I keep my deposit to prevent a run." (Consequence of action, not current solvency proof).
      *   *Collective Action:* Enough depositors act on similar WKRs -> deposits stay.
      *   *Bootstrapped Property:* Solvency *is directly constituted by* the sum of deposits not being withdrawn. The collective action *is* the solvency (or its core component).
      *   *Emergent RKR:* "The bank *is* solvent (because deposits are present)." Solvency, the property justifying trust, has been *bootstrapped* by the actions motivated by the WKRs.
      *   *Why it Flips:* Solvency is an *inherently attitude-dependent social fact*. Depositor behavior *constitutes* it.

  2.  **Cult Guru (Flip Fails):**
      *   *Individual WKR:* "I express admiration to fit in/avoid conflict." (Consequence, not based on current admirability).
      *   *Collective Action:* Followers express admiration -> Guru gains power/influence, *is widely admired*.
      *   *Bootstrapped Property?* *Being widely admired* (a social fact) is generated. *Genuine admirability* (intrinsic moral virtue, wisdom) is **not** generated. The attitude might feed the guru's ego, but it doesn't create compassion, wisdom, or selflessness.
      *   *No Genuine RKR Emerges:* "The guru *is widely admired*" is a reason *for others to pay attention to him* (a different attitude) or *for sociologists to study the cult*, but **not** a direct RKR for *admiration* itself. Admiration requires properties *in him* that justify the esteem. Collective admiration only created a social property *about the group's attitude*, not an intrinsic virtue *in him*.
      *   *Why it Fails:* Genuine admirability (in the moral/character sense) is *not* an attitude-dependent property in the required way. Collective belief cannot bootstrap intrinsic virtue; it can only create social power or the illusion of virtue. The bootstrapping only produced a *different* property (being admired), not the *fittingness-making* property (being admirable).

  **In essence:** The flip from WKR to RKR via collective action works when the attitude itself (or actions directly motivated by it) can *causally generate or constitute the very property that makes the attitude fitting*. This is possible for socially constructed, reflexive properties (solvency, authority, certain reinforced traits) but impossible for intrinsic, non-social properties (fundamental moral virtue, basic physical facts). Your "bootstrapping reasons" highlight how social reality can be pulled up by its own normative bootstraps, but only where the fabric of that reality is woven from collective attitudes and actions.
