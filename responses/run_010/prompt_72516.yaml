prompt: |-
  I work in quality engineering at a plant that makes injection-molded parts for automotive suppliers, so my whole professional vocabulary is measurement systems analysis, gauge R&R, control charts, capability studies (Cp/Cpk), sampling plans, OC curves, common cause vs special cause. I've been a black belt for about fifteen years and I run our annual MSA and gage calibration program, which is to say I think about statistics all day but almost entirely as "is my process stable, is my measurement system adequate, is my output within spec."

  My sister is a postdoc in social psychology and over the holidays she tried to explain the replication crisis to me, plus the frequentist-versus-Bayesian fight that sits underneath it. I read a couple of the overview pieces she sent afterward — the one arguing that most published findings are probably false, and something about a big project that tried to redo a pile of published psychology experiments and got a much weaker picture the second time around. I could follow the individual complaints: people fiddling with their data until the result crosses the magic threshold, stopping the study early because it started looking good, running twenty tests and reporting the one that lit up, journals only publishing the hits and never the misses, studies too small to detect the effects they claim. But every time I tried to think about them in my own terms I ended up somewhere suspiciously comfortable, like "that's just a bad gauge study" or "they don't know whether their process is even in control." My sister said that flattens the actual disagreement, but she couldn't quite articulate why, and honestly I suspect she just thinks her framework is deeper.

  So here's what I want. Take the replication-crisis argument, including the methodological dispute between the frequentist and Bayesian camps about what a p-value does and doesn't license, and restate it as faithfully as you can in the language I actually use — measurement systems and %GRR, stability and control limits, process capability, acceptance sampling and producer's/consumer's risk, special vs common cause. Not as cute metaphors; I want the real mapping, the way you'd write it if you were forced to express their claims in my notation. Then give me the residue report, and be blunt about it: which claims came across clean, which ones you had to bend or quietly re-describe to make them fit, and which ones have no counterpart in my toolkit whatsoever.

  That last bucket is the part I actually care about, because I think it's where the interesting question lives. When the Bayesians complain that a p-value can't express evidence for a hypothesis and that the frequentists have no principled way to fold in what you already knew before the study ran, I genuinely don't know where to put that in my world — I don't talk about belief, I talk about process behavior and conformance to spec, and my priors basically live in the choice of control limits and the sampling plan rather than in any number I update. So I want you to tell me which way to read the gap. Is my vocabulary missing something real, something the QE framework simply has no room to represent? Or is their disagreement less substantive than it sounds, two dialects over one underlying decision problem that my plant-floor framing actually makes clearer? And while you're in there, call me out wherever the translation tempts you to import my assumptions and pass them off as theirs — the bias I'd expect is toward reducing everything to a measurement-system problem or a stability problem, and I'd rather you flag that tendency than let it slide.

  Please write the whole thing in American English.
reasoning: |-
  Okay, let me unpack this. The user is a quality engineering expert in automotive manufacturing with deep stats knowledge applied to process control (MSA, GR&R, SPC, capability). Their sister, a social psychology postdoc, introduced them to the replication crisis and the frequentist vs Bayesian debate. The user intuitively mapped psychology's problems to manufacturing concepts (e.g., p-hacking as bad gauge R&R) but suspects this oversimplifies the conflict. They want a rigorous translation of the replication crisis arguments into their QE framework, followed by an analysis of what gets lost in translation—especially the Bayesian critique about prior knowledge and hypothesis evidence.

  Hmm, the core tension here is between the user's world of observable physical processes and psychology's unobservable constructs. In manufacturing, you can measure a bolt's diameter directly; in psychology, "self-esteem" is inferred through noisy proxies. This fundamentally changes how we think about measurement systems. Their GR&R analogy works for measurement precision but misses validity—are we even measuring the right thing? That's where the "gauge validation" gap appears.

  The Bayesian challenge cuts deeper. In acceptance sampling, the user sets risks (AQL/LTPD) based on historical data—this resembles empirical priors. But Bayesian "belief updating" with subjective priors? No clean analog. Their control limits embed process knowledge, but it's binary (in/out), not a continuous belief update. The residue here feels significant: psychology often lacks the stable processes that make frequentist methods robust in manufacturing.

  Key translation pain points I see:
  1. Psychology's "effects" aren't like part dimensions—they're context-bound and fade over time. Special cause vs common cause gets muddy.
  2. P-values as "process signals" ignores their misinterpretation as evidence strength. An SPC chart's red point triggers investigation; a p<0.05 gets misread as "true effect."
  3. Their sampling plans assume random representative batches. Psychology studies often use convenience samples—like testing parts only from Tuesday's shift and generalizing to all production.

  The big insight? Manufacturing stats assume controlled systems; psychology studies systems that resist control. The user's tools excel at monitoring stability, but the replication crisis stems from a field where everything is instability. That’s not a framework gap—it’s a domain difference demanding different meta-tools. The Bayesian approach isn’t "deeper"; it’s a necessary adaptation to higher uncertainty. 

  I’ll structure the response as: 
  - Direct translation of replication crisis issues into QE terms (p-hacking → gauge tampering, small studies → undersized GR&R)
  - Clear residue report highlighting the mismatches (validity, belief updating) 
  - Brutal honesty about where QE assumptions distort the problem (e.g., treating unstable effects as measurement error)

  The goal isn’t to declare one framework superior but to show why psychology’s chaos breaks the manufacturing stats paradigm—and where that break reveals something fundamental about statistical inference itself.
answer: |-
  Here's the translation you requested, followed by a residue report and gap analysis. The goal is strict fidelity to your QE framework while exposing where the replication crisis arguments strain or break it.

  **Translated Replication Crisis & Methodological Dispute in QE Terms:**

  1.  **"Most published findings are probably false" (False Positive Crisis):**
      *   **QE Translation:** Your supplier is submitting PPAPs where the Cpk > 1.67 looks good, but a high percentage of their submitted samples fail incoming inspection or cause field issues. The root cause isn't just bad parts; it's that their *validation process* is generating misleading Cpk values. Their gauge study (%GRR) might *appear* acceptable on paper (e.g., <30%), but they engaged in practices that invalidate it:
          *   **P-hacking/Data Dredging:** Like repeatedly re-running the same gauge R&R study with different operators, different parts, or different measurement methods until they finally get %GRR < 30%, then only reporting *that* run. They ignored all the runs that failed.
          *   **Selective Reporting/HARKing:** Like running a gauge R&R on 10 different characteristics but only reporting the one with an acceptable %GRR, pretending that was the only one they planned to study.
          *   **Stopping Rules/Low Power:** Like stopping a gauge R&R study early because the first 3 operators and 5 parts *happened* to show low variation, instead of running the full planned sample size designed to detect a %GRR of 30% with sufficient confidence. Many studies are equivalent to using a gauge R&R sample size (n) too small to reliably distinguish between a %GRR of 20% (good) and 50% (bad).
          *   **Publication Bias:** Like the customer (the journal) only accepting PPAP submissions where Cpk > 1.67. Suppliers with Cpk = 0.9 never submit or get rejected, so the customer's database only shows "good" processes. This distorts the *overall* quality picture.

  2.  **Replication Failure:**
      *   **QE Translation:** Another plant (or your own plant later) tries to run the *exact same* PPAP validation (same part print, same gauge, same MSA protocol, same sampling plan, same Cpk calculation) on parts from the *same nominal process* (or a process built to the same spec), but gets a significantly worse Cpk or fails the capability study entirely. This suggests the original PPAP validation result was unstable or misrepresented the true, long-term process capability. The "effect" (meeting Cpk) wasn't a reliable property of the process itself.

  3.  **Frequentist Framework Critique (as seen by Bayesians/Replication Critics):**
      *   **QE Translation:** The core complaint is that the standard "pass/fail" logic (p < 0.05 / Cpk > 1.33) is being fundamentally misinterpreted and misapplied.
          *   **Misinterpreting p-value:** Treating p < 0.05 as proof the process is "good" (H0: Cpk <= 1.33 is false) is like treating a single point outside the control limit as *definitive proof* the process mean has shifted, without any investigation into special causes or stability. A p-value (like a control chart point) signals *unexpected variation under the null assumption*, not the *probability the null is true* or the *size of the effect*. It's an alarm bell, not a capability statement.
          *   **Ignoring Prior Information (Frequentist "Flaw"):** When evaluating a new supplier's Cpk study, you don't start from zero. If they have a history of poor quality, you require *more compelling evidence* (tighter confidence intervals, more samples, stricter AQL) to accept their claim than you would for a proven, reliable supplier. The standard frequentist Cpk hypothesis test (H0: Cpk <= k) doesn't formally incorporate this existing knowledge about the supplier's track record (the "prior"). Your sampling plan (AQL, LTPD) implicitly builds in risk based on history, but the *test statistic itself* doesn't.
          *   **Stopping Rules & Flexibility Affect Meaning:** The evidentiary weight of a Cpk value *should* depend on *how* you got there. Finding Cpk > 1.33 after running the exact pre-planned sample size is stronger evidence than finding it after peeking at the data 10 times and adding samples only when it looked bad (akin to optional stopping). Standard frequentist reporting often treats these as equivalent.

  4.  **Bayesian Alternative (Core Idea):**
      *   **QE Translation:** Instead of just asking "Does this Cpk study pass the threshold (p < 0.05 / Cpk > 1.33)?", you formally combine the new study data with your *prior assessment* of the supplier's reliability (the "prior distribution" of their true Cpk). This results in a *posterior distribution* – an updated, probabilistic assessment of their *actual* Cpk, incorporating both old and new information. The output isn't just "pass/fail"; it's "Based on everything we know, the *probability* their true Cpk is > 1.33 is X%, and the *most likely value* is Y." This directly quantifies the "belief" in the hypothesis (Cpk > 1.33) given the data and prior knowledge. Setting up the prior is critical and analogous to choosing your initial AQL/LTPD risks based on supplier history, but it's made explicit and quantitative.

  **Residue Report: What Didn't Map Cleanly & Where the Gaps Are**

  1.  **Came Across Clean:**
      *   **P-hacking/Selective Reporting/Dredging:** Maps directly to invalidating an MSA study or capability study by cherry-picking data/conditions. Unambiguous bad practice in both worlds.
      *   **Small Studies/Low Power:** Maps directly to undersized gauge R&R studies or capability studies. Results are unreliable, high risk of misclassification (False Pass/False Fail).
      *   **Publication Bias:** Maps directly to only seeing "passed" PPAPs, distorting the perceived baseline quality. Acceptance sampling concepts (AQL, LTPD, OC curves) perfectly describe the risk of accepting bad processes.
      *   **Misinterpreting p-value as "Effect Proof":** Maps cleanly to misinterpreting a single out-of-control point as proof of a shifted mean, or a single passing Cpk study as proof of a robust process. Both are about confusing a signal of inconsistency with a definitive state.
      *   **Replication as Re-running Validation:** The concept is identical: can the result be reproduced under the *same* conditions? Failure indicates the original validation was flawed or unstable.

  2.  **Bent or Re-described:**
      *   **"Effect Size" vs. "Within Spec":** Your world cares if the dimension is *within spec*. Psychology cares about the *size* of the difference (e.g., how much does intervention X *increase* self-esteem?). Mapping "statistically significant effect" to "Cpk > threshold" captures the "pass/fail" aspect but flattens the importance of *how far* from the threshold the result is (though Cpk itself incorporates distance to spec). The replication crisis heavily involves tiny effect sizes that are statistically significant but practically meaningless – analogous to a Cpk of 1.34 vs 1.33, but the practical meaning of a tiny psychological effect is far less concrete than being 0.0001mm inside a tolerance.
      *   **The Null Hypothesis (H0):** Your "null" is often clear: the process mean is off-target, or variation is too high (Cpk <= k). In psychology, H0 is often "no difference" or "no effect." Mapping H0 rejection to "Cpk <= k is rejected" works structurally, but the *concreteness* of the QE null (a physical dimension out of spec) is different from a psychological null (no difference between groups).
      *   **Bayesian Prior:** Mapping it to historical supplier risk used to set AQL/LTPD is the *closest operational analog* in your decision-making. However, it's less about a formal "distribution" and more about binary risk thresholds. The quantitative updating (posterior distribution) has no direct parallel in standard SPC/PPAP.

  3.  **No Counterpart / The Real Gaps (Where Your Vocabulary Has No Room):**
      *   **The Central Gap: Quantifying Belief in a Hypothesis.** This is the core Bayesian argument. Your world deals with **observed behavior of physical systems** (process stability, measurement error, conformance). You infer state (in-control, capable) from data using rules with known error rates (Type I/II = Producer's/Consumer's Risk). Psychology (and Bayesians) need to quantify **belief in unobservable constructs/theories** ("Does cognitive dissonance theory hold?"). Your tools answer "Is my process behaving as expected?" or "Does this lot meet spec?". Bayesians want to answer "How much should I *believe* theory X is *true* given this data and what I knew before?". Your "priors" are embedded in **risk management choices** (control limits, sampling plans), not in a number representing the *probability the hypothesis is true* that gets updated.
      *   **Lack of a Stable "Process":** Your entire framework assumes an underlying, relatively stable process generating parts. Control charts *assume* common cause variation. MSA assumes the *parts* have variation to be measured. Psychology often studies **inherently unstable "effects"** – they can depend on culture, time, context, subtle experimenter differences. Replication failure isn't always just "bad initial measurement"; sometimes the "effect" itself is weak, context-dependent, or even non-existent. Your "common vs special cause" framework struggles here because there *is no* stable common cause system generating the "true effect size." This is arguably the *biggest* reason for the crisis and the hardest to map.
      *   **Validity of the "Gauge" (Construct Validity):** Your %GRR assesses if you can measure *diameter* precisely and accurately. But does a survey question *actually* measure "self-esteem"? This is **construct validity** – does your gauge measure the *intended underlying construct*? There's no direct analog in your physical measurement world beyond ensuring the gauge is calibrated to the right standard. This is fundamental in social science: a low %GRR (good reliability) on a bad gauge (poor validity) is worthless. Your framework lacks tools to assess this deeper "is this measuring the right thing?" question.
      *   **Subjectivity of the Prior:** While you use historical context for risk (like a prior), Bayesian priors can be explicitly subjective (expert judgment). Formalizing subjective belief into a prior distribution has no counterpart in your objective, physical measurement world. Your historical data is empirical; their prior can incorporate theoretical expectations or degrees of uncertainty that aren't strictly data-driven.
      *   **Direct Probability of Hypothesis:** The Bayesian posterior probability (e.g., "There's an 85% chance the true effect is positive") is fundamentally different from a p-value ("If the null were true, data this extreme would occur 3% of the time") or a Cpk ("This process, as measured now, has a capability index of 1.5"). Your tools describe *data* or *process performance*; the Bayesian posterior directly describes *belief in the hypothesis state*.

  **Reading the Gap & Calling Out Bias:**

  *   **Is your vocabulary missing something real? Absolutely.** Your framework is brilliantly suited for **stable physical processes with objective measurement**. It lacks the language and tools for:
      1.  **Quantifying belief in theoretical propositions.**
      2.  **Handling the fundamental instability and context-dependence of many social science phenomena.** (This is the biggest gap – assuming a stable process where none exists).
      3.  **Formally assessing the validity of the measurement for abstract constructs.**
      4.  **Incorporating subjective prior knowledge quantitatively into the statistical result itself** (beyond setting risk parameters).

  *   **Is their disagreement less substantive? No.** The frequentist/Bayesian dispute highlights a fundamental difference in the *goal of inference*: Frequentists focus on **error rates in long-run repeated sampling** (like your Producer's/Consumer's risk). Bayesians focus on **updating rational belief in specific hypotheses** given specific data. Your plant-floor framing makes the *operational consequences* of poor statistics crystal clear (bad parts, failed audits). However, it doesn't resolve the *philosophical/methodological* dispute about how best to model inference for unstable phenomena or quantify belief. Your framework *is* clearer for *your* domain, but it's not universally applicable.

  *   **Bias Called Out:** Your instinct to map everything to "bad gauge study" or "unstable process" **is a bias.** It assumes:
      *   There *is* a stable underlying effect/process to measure (often untrue in psych).
      *   The measurement target (construct) is as concrete as a diameter (it's not).
      *   The primary problem is technical execution of the study (MSA/Sampling), not the fundamental instability of the subject matter or the lack of tools to quantify belief. While bad execution *is* a huge part of the replication crisis, the lack of a stable "process" and the need for belief updating are *inherent challenges* in social science that your framework doesn't directly address.

  **Conclusion:** Your QE framework provides powerful, concrete analogs for the *procedural flaws* driving the replication crisis (p-hacking = bad MSA, small studies = low power, publication bias = distorted sampling). It also clarifies the frequentist logic (p-value as signal, not proof). However, it hits a hard wall when confronting the **Bayesian demand for hypothesis probability**, the **inherent instability of social science "effects"**, and the **challenge of construct validity**. This gap isn't a failing of your framework; it reflects the fundamentally different nature of the problems. The "interesting question" lives in that gap: how *do* you rigorously quantify belief and knowledge when studying phenomena that lack the stable, objective properties of an injection molding process? Your world excels at ensuring the gauge is good and the process is stable *for a defined characteristic*. Their world struggles to define stable characteristics and build gauges for abstract concepts in the first place. The translation exposes that the core of the dispute isn't just about statistics; it's about the nature of the phenomena being studied.
