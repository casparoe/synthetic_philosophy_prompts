prompt: |-
  I sit on a university research-impact funding panel and I've been asked to write up the recommendation that goes to the full committee. Two bids, same cost. Bid A: a screening protocol for a common condition whose benefit is estimated at about 12% absolute risk reduction off a large pooled dataset — dull, but everyone agrees on the number. Bid B: an intervention for a rare condition with almost no trial data, so our reviewers' estimates of it's benefit run anywhere from 5% to 60% and can't sensibly be narrowed, because there's no frequency base to narrow them against. Half the panel wants to fund A on the grounds that at least we know what we're buying. The other half says that's pure Ellsberg — preferring the urn with the known proportions even when the vague urn has the better worst case — and that this kind of squeamishness shouldn't be steering public money. One member wants us to score B at its worst-case estimate, i.e. maximin over the range; another objects that this makes the panel incoherent across a run of decisions, and that either way we're systematically starving anything novel or understudied, which is a distributive choice we should be making deliberately rather then by accident.

  Draft the memo I'll circulate: a clear recommendation (fund A, fund B, or some split), reasoning the panel could actually vote on, an explicit answer to whether ambiguity aversion here is a bias to be corrected or a legitimate response to a real difference between the two cases, and a serious treatment of the best argument for the side you come out against. British English, please.
reasoning: |-
  Okay, the user is on a university research funding panel and needs to draft a memo recommending between two bids. Both cost the same, but they present a classic dilemma between certainty and uncertainty. 

  Bid A offers a clear 12% absolute risk reduction for a common condition, backed by solid data. It's the safe choice. Bid B targets a rare condition with wildly varying benefit estimates (5-60%) due to scarce data. The panel is split: half wants the known quantity, half sees the uncertainty as an opportunity worth pursuing despite the ambiguity.

  Hmm... the user needs more than just a recommendation. They're wrestling with deeper philosophical questions: Is avoiding ambiguity a cognitive bias (Ellsberg paradox) or a legitimate risk-assessment strategy? And how should public funding bodies handle high-variance proposals without systematically penalizing innovation?

  The panel members' arguments reveal competing priorities: One camp focuses on accountability ("we know what we're buying"), the other on opportunity cost ("starving novel research"). The maximin scoring suggestion for Bid B is particularly thorny—it might seem prudent but could indeed create long-term anti-innovation bias. 

  Right, the memo must achieve four things: (1) a defensible recommendation that isn't a cop-out (so probably not an equal split), (2) clear reasoning about ambiguity aversion, (3) substantive engagement with the losing side's best argument, and (4) British English phrasing. 

  I'm leaning toward recommending Bid A, but not because ambiguity aversion is "correct." Instead, the key is that public funding has higher evidentiary thresholds—the 12% benefit in Bid A isn't just certain, it's demonstrably meaningful at scale. For Bid B, the uncertainty isn't merely about degree of benefit; it's about whether any benefit exists at all (the 5% floor might be overly optimistic). Funding it would be more justifiable if there were mechanistic plausibility or unmet need arguments, but the user hasn't mentioned those. 

  The strongest counterargument? That rare conditions deserve disproportionate investment precisely because they're neglected. But the panel isn't rejecting Bid B for being rare—it's rejecting it because the proposal fails to constrain the uncertainty. If researchers could narrow the range (e.g., through pilot data), it might be fundable. 

  Better structure the memo to mirror this: Start with the recommendation upfront, then unpack the rationale while explicitly validating the pro-Bid B concerns. The "systematically starving novelty" point is too important to dismiss—it deserves a named acknowledgment in the limitations section. 

  Final note: Must avoid "bias" framing. Call it "differential risk tolerance" to sound less judgmental. And use "whilst" for British flavor.
answer: |-
  ## Memorandum: Funding Recommendation for Research Bids A & B

  **To:** University Research Impact Funding Panel  
  **From:** [Your Name/Chair], Research Impact Funding Sub-Panel  
  **Date:** 24 May 2024  
  **Subject:** Recommendation Regarding Funding Allocation Between Bid A (Screening Protocol) and Bid B (Rare Condition Intervention)  

  ### 1. Recommendation
  **The Sub-Panel recommends funding Bid A (Screening Protocol).**  
  While acknowledging the compelling case for Bid B, we advise prioritising Bid A on grounds of demonstrable impact certainty, scalability, and prudent stewardship of public funds.  

  ---

  ### 2. Reasoning  
  #### Core Rationale:  
  Bid A presents a **known, significant benefit** (12% absolute risk reduction) for a **common condition**, validated by robust, pooled data. This offers high confidence in tangible, near-term population health impact. Bid B, while potentially transformative for a rare condition, carries **unresolvable uncertainty** regarding its efficacy (5–60% benefit range). This ambiguity introduces unacceptable risk of funding an intervention with minimal real-world impact.  

  #### Addressing Ambiguity Aversion:  
  Ambiguity aversion here is **a legitimate risk-assessment strategy**, not merely a cognitive bias. Key differences justify treating the bids asymmetrically:  
  *   **Evidentiary Basis:** Bid A’s benefit is empirically grounded; Bid B’s range reflects profound evidence gaps.  
  *   **Accountability:** Public funding requires justifiable investment decisions. Funding Bid A provides a clear, auditable impact pathway.  
  *   **Scalability:** Bid A’s common condition ensures broader societal return; Bid B’s rare condition inherently limits reach, amplifying the risk of funding an ineffective intervention.  
  *   **Risk Character:** Bid B’s uncertainty isn’t symmetrical "risk" (quantifiable probabilities) but "ambiguity" (unknown probabilities). Prudence dictates caution when potential outcomes cannot be reliably bounded.  

  #### Rejecting Maximin for Bid B:  
  Scoring Bid B at its worst-case (5%) is overly punitive and methodologically flawed. It ignores the *possibility* of high returns and would indeed systematically disadvantage novel/understudied fields. Our decision rests not on maximin, but on **inability to substantiate *any* reliable benefit estimate** within the vast range provided.  

  ---

  ### 3. Engagement with the Counterargument  
  We recognise and take seriously the **strongest argument for funding Bid B**:  

  > *"Prioritising only low-ambiguity projects systematically disadvantages innovative or understudied fields, particularly those addressing rare conditions with inherent evidence challenges. This creates a distributive injustice by funnelling resources toward ‘safe’ incrementalism at the expense of potentially transformative, high-variance research where public investment is most needed."*  

  **This argument is valid and ethically salient.** Neglected conditions deserve attention, and aversion to ambiguity *can* stifle innovation. However, **funding Bid B in its current form is not the solution to this systemic issue**:  
  *   **Lack of Mitigation:** The proposal offers no pathway to reduce ambiguity (e.g., pilot data, mechanistic plausibility, or tiered evaluation).  
  *   **Opportunity Cost:** Funding Bid B with unresolvable uncertainty risks squandering resources that could support other high-potential, novel bids with clearer feasibility.  
  *   **Systemic vs. Specific:** Addressing the "novelty penalty" requires deliberate policy (e.g., ring-fenced funds, staged funding), not ad hoc funding of high-ambiguity proposals without safeguards.  

  **Recommendation:** The Panel should separately discuss establishing mechanisms (e.g., a "high-risk, high-reward" stream) to support such bids *where ambiguity can be actively managed*, ensuring distributive choices are deliberate, not accidental.  

  ---

  ### 4. Conclusion  
  Bid A offers a guaranteed, significant impact on a common condition, aligning with the core mandate of responsible public investment. While Bid B highlights a critical challenge in research funding equity, its current unresolvable uncertainty makes it an inappropriate vehicle for addressing that challenge. We advise funding Bid A and initiating a separate review of funding mechanisms for high-ambiguity, high-potential research.  

  **Proposed Vote:**  
  ☐ Accept Recommendation: Fund Bid A  
  ☐ Reject Recommendation  

  ---  
  **Endorsed by:** [Sub-Panel Chair/Signatory]  
  **Next Steps:** Vote at Full Committee Meeting on [Date].
