answer: |-
  ## The Fifty Percent Rule

  The envelope arrived at dawn, thick with the damp smell of official paper. Inside, on cream-colored stock, lay the form: *Provincial Relief Board – Post-Calamity Mortality Attribution Assessment (Form 7B)*. Below the dense bureaucratic preamble, two blank boxes dominated the page:

  *   **Percentage Attributable to Climatic Cause:** ______%
  *   **Percentage Attributable to Administrative Cause:** ______%

  *Sum must equal 100%. Result determines classification and provincial relief status.* Three days. Officer Javid stared at the form on his desk, the inkwell beside it suddenly looking like a hole into which he might vanish.

  Outside his window, the Province of Surya stretched – not parched desert, but land bearing the scars of a thirst that hadn’t quite killed it. The drought was real. Javid had ridden out weeks ago, seen the cracked clay beds of the Lesser Serpent River, watched the stunted, greyish stalks in the western paddies yield half their normal burden under a sky that bleached color from the world. The rains had failed. That much was undeniable.

  Yet, on his desk, the final harvest ledger lay open. The numbers, neat columns in black ink, refused to lie. *Total Provincial Grain Yield: 1,820,000 tons.* He flipped back through the brittle pages of previous years. The ten-year average: 1,780,000 tons. *Above* average. Surya had grown enough food.

  The starving hadn't been in the fields. They’d been in the alleys of Karapur, the river port where the Lesser Serpent met the trade routes. Boatmen, their sinewy arms slack now, who’d hauled goods upstream when the river allowed. Weavers from the clattering workshops, their looms silent. Day laborers who broke stone for road repairs. Rickshaw pullers who once darted like water beetles through the city’s veins. Paid in fixed copper *tankas*, their wages had become meaningless when the price of rice, stable as bedrock for years, began its sickening ascent.

  Javid shuffled through the supplementary reports – not part of the official assessment, but context he couldn’t ignore. A clipping from the *Karapur Gazette*, three months old: *"War Effort Procurement Order Enacted: Provincial Grain Reserves Mobilized for National Defense."* Signed by Deputy Commissioner Ranjit, acting on directives from the central government. Later reports spoke of hoarding – merchants, yes, but also smaller landholders suddenly afraid, seeing the price climb and the government taking its share. And climb it did. From the baseline of 10 *tankas* per *maund*, rice had soared to 15, then 25, then 30 within four months. Tripled. A boatman’s daily wage bought half a *maund*, then a quarter, then a handful.

  The mortality figures were starkest. District returns showed clusters of excess deaths starkly concentrated in Karapur and the river towns, among the landless laborers and artisans. The rice-growing villages? Death rates barely nudged above normal. They ate what they grew, or sold it at the inflated prices and prospered. The grain was *there*. It just flowed away from those who needed it most, pulled by the twin currents of war and fear.

  He couldn’t fill the form. Every number he imagined felt like a betrayal.

  *Fifty-one percent Climatic.* It was true, the drought *had* happened. It reduced the harvest from potential abundance to mere sufficiency. Without it, the price surge might have been manageable. But was it the *cause* of the boatman’s child dying? Or was it the invisible hand that snatched the rice away while the child’s father held useless coins?

  *Fifty-one percent Administrative.* True too. The procurement order diverted tons at below-market rates. The rumours, unchecked, amplified the panic. The fixed wages became death warrants. But Deputy Commissioner Ranjit wasn’t a monster. Javid had sat across from him yesterday, delivering preliminary figures. Ranjit, harried, grey-faced, had pushed a telex across the desk.

  "Look, Javid," he'd said, his voice taut. "Central Command. Famine projected *here*," he stabbed a finger at a map of the neighboring province of Vastra. "Real scarcity. Crop failure worse than ours. They were counting on our surplus. What was I meant to do? Ignore the directive? Let *them* starve wholesale? My duty was to Surya *and* the Federation." He wasn’t gloating; he looked haunted. He’d genuinely believed he was preventing a greater catastrophe. A defensible position, wrapped in impossible choices.

  Javid had said nothing, merely noting the telex. The aggregate numbers mocked him. *Province: Above Average Grain. Result: Starvation.* A ledger couldn’t capture the hollow eyes of the weaver woman he’d seen begging near the old spice market, her hands, once nimble, now trembling claws. It couldn’t show the piled, anonymous bodies in the paupers' field outside Karapur – boatmen and laborers, not farmers. The form demanded a single split, a neat division where nature ended and human failing began. But the lines were smeared with dust and desperation.

  On the afternoon of the second day, he found the internal memo he needed for the aggregate numbers. Buried in a transport folder, it was a summary of grain movement *out* of Karapur port in the critical months:

  *   **Month 1:** Gov't Procurement: 15,000 tons. Private Sale (External): 5,000 tons. Local Market Release: 20,000 tons. *Rice Price: 12 t/m*
  *   **Month 2:** Gov't Procurement: 20,000 tons. Private Sale (External): 10,000 tons. Local Market Release: 15,000 tons. *Rice Price: 22 t/m*
  *   **Month 3:** Gov't Procurement: 18,000 tons. Private Sale (External): 15,000 tons. Local Market Release: 7,000 tons. *Rice Price: 30 t/m*

  *Total Local Release: 42,000 tons (3 months). Pre-Crisis Avg. Local Monthly Consumption: 20,000 tons.*

  The numbers were coldly eloquent. Local release plummeted as prices soared. *Forty-two thousand tons* released locally over three months against a normal need of *sixty thousand*. The gap was the hunger. And the gap was carved by the "Gov't Procurement" and "Private Sale (External)" columns – the war effort and the hoarders capitalizing on the fear it bred. The province had grain, but Karapur’s share shrank relentlessly. The average abundance concealed a fatal redistribution.

  He picked up his pen. The inkwell yawned. *Climatic cause:* The drought reduced the buffer, made the system brittle. *Administrative cause:* The decisions – Ranjit’s procurement, the failure to curb speculation, the rigid wage economy – determined *who* broke when the buffer vanished. They were threads in the same suffocating rope.

  To call it over half Climatic felt like absolving the machinery that ground the poor into dust. To call it over half Administrative felt like ignoring the cracked earth, the true initial blow, and crucifying Ranjit for obeying orders meant to save others. Neither number captured the terrible truth: the food existed, and people died because they couldn’t reach it. The drought was the spark; the tinder was stacked by men.

  On the morning of the third day, Javid dipped his pen. He didn’t write a number. Instead, he drew a single, dark line diagonally across both blank percentage boxes. Below the line, on the space reserved for "Officer Remarks," he wrote in a clear, steady hand:

  *The grain sufficed. The distribution failed. Death requires no percentage, only acknowledgement.*

  He underlined the final word twice. Then, beneath his signature and title, he added:

  *Recommendation: Audit Form 7B. The question obscures more than it reveals.*

  He blotted the ink carefully, slipped the form back into its envelope, and sealed it. It wasn’t defiance, not exactly. It was the only honest answer the bad question could elicit. He hadn’t solved the riddle of blame. He’d simply pointed to the locked door the form pretended didn’t exist. The locked door behind which lay the boatman’s empty bowl, the weaver’s trembling hands, and the terrible arithmetic of access. He sent the envelope on its way, knowing it wouldn’t bring relief, knowing it wouldn’t save Ranjit or damn him, knowing it wouldn’t feed a single soul. It was merely a small, stubborn refusal to call a shared **disaster** anything less complex than the sum of its agonizing parts, or to reduce a systemic **crime** against the hungry to a single, meaningless digit. The form demanded a verdict; he had returned only evidence of its own inadequacy.
