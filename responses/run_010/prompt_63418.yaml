answer: |-
  ### Research Proposal: The Machine in the Razor — Which "Occam" Does Solomonoff Induction Actually Vindicate?  

  **Core Question**  
  Solomonoff induction formalizes Occam’s razor by weighting hypotheses inversely to their Kolmogorov complexity (program length), promising three levels of vindication:  
  1. **Asymptotic claim**: Posteriors converge to the truth with infinite data.  
  2. **Finite-data claim**: With practical evidence, simpler compatible hypotheses receive higher posterior probability.  
  3. **Guidance claim**: Scientists should prefer theories with minimal program length, as they are "simpler."  

  *But does machine-dependence—where Kolmogorov complexity is defined only up to an additive constant—undermine one, all, or none of these claims? And does the answer change if "simplicity" reflects scientific practice (e.g., fewer parameters) rather than program length?*  

  **Why Existing Positions Don’t Settle This**  
  - **Enthusiasts** often conflate all three claims, treating asymptotic results as validating finite decisions.  
  - **Idealization shruggers** dismiss uncomputability but sidestep whether machine-dependence cripples finite-data or guidance claims.  
  - **Reference-machine skeptics** argue the additive constant dominates real-world inference but lack a systematic taxonomy of *which* claims fail and under which simplicity metrics.  
  Crucially, no one has disentangled which levels of vindication survive when:  
  - (a) "Simplicity" means program length (vulnerable to arbitrary compression),  
  - (b) "Simplicity" aligns with scientific heuristics (e.g., parsimony in parameters).  

  **Method: Triangulating Theory, Simulation, and Scientific Practice**  
  *Timeline: 12 months, split across three phases. Theorist consultation (1–2 hrs/month) for technical rigor; all analysis and synthesis led by me.*  

  - **Months 1–3: Formalize Claims and Map Machine-Dependence**  
    - *My role:* Dissect asymptotic/finite/guidance claims using philosophical analysis. Draft "threat model" for how additive constants could disrupt each.  
    - *Theorist role:* Verify formal conditions under which convergence proofs hold (e.g., Do additive constants violate the "merging of opinions" theorem?).  
    *Deliverable:* A taxonomy of vulnerability—e.g., "asymptotic claim robust; finite claim fragile if constants swamp evidence."  

  - **Months 4–6: Simulate Finite-Data Impact with Toy Priors**  
    - *My role:* Design toy universes (e.g., binary sequences generated by short programs) and test how machine choice affects posteriors at small data scales. Example: Fix evidence *e*; vary reference machines to see if "simplest" hypothesis flips.  
    - *Theorist role:* Ensure simulations respect invariance theorems; suggest edge cases.  
    *Deliverable:* Concrete examples of "finite-data disasters"—where machine choice overrides evidence.  

  - **Months 7–9: Interview Scientists on Simplicity Heuristics**  
    - *My role:* Conduct structured interviews with 15–20 physicists/biologists (beats I cover). Probe: What makes one theory "simpler" than another? Is it parameters, entities, or something else? How do they trade off simplicity vs. fit?  
    *Deliverable:* Map mismatches between Kolmogorov simplicity (e.g., a program can be short but "ugly" with ad hoc steps) and scientists’ operational criteria.  

  - **Months 10–12: Synthesis and Drafting**  
    - *My role:* Integrate findings. Does machine-dependence *matter less* if we redefine simplicity scientifically? Does guidance collapse even if asymptotics hold?  
    *Deliverable:* Essay draft; lecture outline.  

  **Why This Approach Beats Alternatives**  
  - *Simulations alone* miss scientific context; *intellectual history* ignores computational limits.  
  - *Pure theory* is inaccessible to my audience. This hybrid method links math to real-world practice—e.g., showing a "simpler" program might require more epicycles than a scientist would tolerate.  

  **Outcomes and Failure Modes**  
  - **Success:** A nuanced verdict (e.g., "Asymptotics hold, but guidance is machine-dependent *unless* we redefine simplicity; here’s how").  
  - **Failure defined as:**  
    - No clear examples of finite-data fragility (possible, but unlikely per preliminary talks).  
    - Scientists’ "simplicity" is too fragmented to generalize (mitigation: highlight diversity as a finding).  
  - **Public Payoff:**  
    - Resolves a debate plaguing popular accounts of algorithmic inference.  
    - Warns scientists against importing "Occam proved!" rhetoric uncritically. Offers a framework for when simplicity arguments succeed or fail.  

  **Scope and Feasibility**  
  - A year is realistic *if* simulations are kept simple and interviews targeted.  
  - *If time runs short, I will:* Prioritize Sections 1–2 (formal claims + simulations) and abbreviate interviews. Core is isolating which claims fail—empirical work enriches but isn’t essential.  

  **Conclusion**  
  This project clarifies a foundational tension: Solomonoff induction is hailed as Occam’s triumph, yet its reliance on arbitrary machines may collapse the very guidance it promises. By dissecting claims, testing fragility, and grounding simplicity in practice, I’ll show what the theorem *can* and *cannot* do for science—moving beyond "asymptotic shrugs" and skeptic panic. The result will empower scientists, philosophers, and educators to wield Occam’s razor with precision.  

  ---  
  **Proposal Length:** ~1.5 pages (fits two with 1.5 spacing).  
  **Tone:** Analytical but avoids narrative tangents. Focuses on gap/method/impact.  
  **Your next step:** Replace placeholder text (e.g., interview counts) with specifics. Lean on the theorist to bulletproof the "Formalize Claims" section.
