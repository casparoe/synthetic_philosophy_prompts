prompt: |-
  I keep having intuitions about when a prediction market should actually get to make a decision, and they don't seem to line up with each other. Here they are.

  - A state deciding whether to build a light rail line, betting on ridership and commute times ten years out: yes, let the market decide.
  - The same state deciding where to site a hazardous waste facility, betting on the same kind of welfare measure: no. The market would pick the poorest town and I don't think that's a reason to.
  - A central bank setting rates off markets for inflation and unemployment: yes.
  - A parole board using a market on reoffending: no, even though it would probably predict better than the board does.
  - A school board choosing curriculum off a market on test scores: no — feels like the metric eating the thing it's supposed to measure.
  - War, a market on whether a strike sets a nuclear program back five years: no, because the people who know most are on the other side and can trade on it.
  - Approving a new drug: yes. Allocating one available organ between two patients by market: no. Both are life-and-death predictions, so I cant seperate these.
  - A market on whether a regional bank fails: no, since the price moving can help make it fail.

  Is there a principle, or a short list of them, that gets most of these and explains why the two pairs I can't separate (waste site vs. rail line, drug vs. organ) come out different? And what does it say about a case I haven't thought of, like a city betting on whether removing a dam raises property values and fish counts? Tell me which of my verdicts it forces me to give up. Assume the standard futarchy setup where you run a market for each option and take whichever predicts better welfare, so the market for the option you rejected never resolves — I suspect that matters to some of my verdicts but I couldn't say how.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're presenting a series of scenarios where prediction markets are either acceptable or not, and they're struggling to find a consistent principle. The key here is to identify underlying patterns that explain their intuitions. 

  First, I notice the user has grouped some cases as pairs they can't separate—like waste site vs. rail line, and drug approval vs. organ allocation. That suggests their confusion might stem from overlapping factors. Maybe the waste site involves distributional fairness, while the rail line is more about aggregate efficiency? 

  The user also mentions futarchy's setup where unresolved markets affect incentives. That’s crucial for cases like the bank failure or wartime markets where trading could influence outcomes. For the organ allocation case, the unresolved market might create perverse incentives to sabotage the other patient. 

  Then there’s the metric corruption problem in the school curriculum example. Test scores becoming the target could undermine education quality. Similarly, for the hazardous waste site, welfare metrics might ignore how costs are distributed to marginalized communities. 

  The user’s unspoken need seems to be a framework for ethical decision-making that incorporates prediction accuracy without sacrificing fairness or integrity. They want principles that don’t force them to abandon their intuitions but explain them coherently. 

  The drug vs. organ case is tricky. Both involve life-and-death predictions, but organ allocation’s unresolved market creates a conflict of interest. That distinction might resolve their dilemma. For the dam removal, environmental benefits vs. property values could conflict, so it’s a no-go due to metric limitations. 

  I’ll need to synthesize principles that address influence, fairness, and metric adequacy. The user’s examples are diverse, so the framework must be flexible yet precise. Also, highlighting where their intuitions might conflict with the principles—like accepting the parole market if bias is addressed—could add value.
answer: |-
  Here's a coherent set of principles derived from your intuitions, explaining your verdicts and resolving the pairs you found difficult:

  ### Core Principles
  1.  **Non-Influence Principle:** Prediction markets should not *themselves* significantly alter the outcome they are predicting (e.g., through self-fulfilling or self-defeating prophecies).
  2.  **Distributional Fairness Principle:** The decision fundamentally involves imposing significant, concentrated *costs* or *risks* on a specific group, where fairness and equity (beyond aggregate welfare) are paramount ethical considerations.
  3.  **Metric Adequacy Principle:** The welfare metric used in the market must be a sufficiently good proxy for the *actual* desired societal outcome. It must not be easily corrupted or gamed in a way that undermines the underlying goal.
  4.  **Strategic Manipulation Principle:** Key information holders with opposed interests must not be able to profitably manipulate the market to create a false signal or directly harm the decision-making entity.

  ### Applying the Principles to Your Cases

  *   **State Building Light Rail (Yes):**
      *   *Violates Principles?* None significantly. Aggregate welfare (ridership, commute times, economic growth) is a good primary goal. Decision distributes benefits/costs widely. Market prediction unlikely to *cause* the outcome.
  *   **State Siting Hazardous Waste Facility (No):**
      *   *Violates Principle #2 (Distributional Fairness):* Concentrates significant risks/costs. Lowest-cost site likely harms the most vulnerable community, which is ethically unacceptable regardless of aggregate welfare. Market optimizing only for cost/welfare ignores this justice dimension.
  *   **Central Bank Setting Rates (Yes):**
      *   *Violates Principles?* None significantly. Markets (inflation/unemployment) are core indicators. Central bank retains authority but uses market signals effectively. Market prices inform, don't *dictate* the complex final decision.
  *   **Parole Board Using Reoffending Market (No):**
      *   *Violates Principle #2 (Distributional Fairness) & #3 (Metric Adequacy):* Fairness and individual justice in sentencing/parole are paramount, beyond just aggregate reoffending rates. A pure reoffending metric ignores rehabilitation, proportionality, and due process. Also risks algorithmic bias amplification.
  *   **School Board Choosing Curriculum (No):**
      *   *Violates Principle #3 (Metric Adequacy):* Test scores are a notoriously corruptible and incomplete measure of real education (critical thinking, creativity, citizenship). Optimizing purely for test scores would actively *worsen* genuine education ("metric eats the goal").
  *   **War - Market on Strike Setting Back Nukes (No):**
      *   *Violates Principle #1 (Non-Influence) & #4 (Strategic Manipulation):* The adversary (key information holder) can trade to create false signals (e.g., betting against success to discourage the strike). Market movements revealing intelligence could directly aid the enemy. Prediction market activity *itself* influences the strategic outcome.
  *   **Approving a New Drug (Yes):**
      *   *Violates Principles?* None significantly. Primary goal is aggregate safety/efficacy prediction. FDA retains authority but uses market signals (e.g., on trial results, side effects) as one valuable input within a rigorous process. Decision impacts are widespread, not concentrated unfairly.
  *   **Allocating One Organ by Market (No):**
      *   *Violates Principle #2 (Distributional Fairness) & #1 (Non-Influence - via Futarchy Setup):* Life-and-death allocation based *solely* on predicted outcomes (even using welfare) is ethically repugnant; fairness and need must be primary. **Crucially, the Futarchy setup matters:** The market for the *losing* patient never resolves. Participants betting on Patient A have a direct financial incentive to sabotage the outcome for Patient B (if they received the organ) to win their bet. This creates perverse, potentially lethal incentives.
  *   **Market on Regional Bank Failure (No):**
      *   *Violates Principle #1 (Non-Influence):* A falling price in the bank failure market can trigger a loss of confidence, leading to a bank run, making failure *more* likely – a classic self-fulfilling prophecy.

  ### Resolving Your Difficult Pairs

  1.  **Hazardous Waste (No) vs. Light Rail (Yes):**
      *   **Key Difference:** Principle #2 (Distributional Fairness). The waste facility imposes concentrated, unavoidable *burdens* on a specific community, where fairness is paramount. The light rail primarily involves distributed costs/benefits and aggregate efficiency.
  2.  **Drug Approval (Yes) vs. Organ Allocation (No):**
      *   **Key Differences:**
          *   **Principle #2 (Distributional Fairness):** Allocating a single life-saving resource based purely on predicted outcomes ignores fundamental fairness and need.
          *   **Principle #1 (Non-Influence - Futarchy Effect):** The unresolved market in organ allocation creates dangerous perverse incentives for sabotage, which doesn't exist in drug approval (markets inform a broader decision, not directly allocate the scarce resource between individuals with opposing markets).

  ### The Dam Removal Case (Property Values vs. Fish Counts)

  *   **Analysis:** This depends on the *specific welfare metric* defined for the futarchy vote.
      *   *If the metric is purely Property Values:* **Likely NO.** Violates Principle #3 (Metric Adequacy). Optimizing for property values ignores environmental health (fish counts), which is presumably a core goal. It risks gentrification and harming ecological values.
      *   *If the metric is a weighted combination (e.g., Property Values + X*Fish Counts):* **Potentially YES, BUT...** It avoids Principle #3 *if* the combination truly reflects societal goals. However, it could still violate:
          *   **Principle #2 (Distributional Fairness):** If removal significantly harms specific property owners or communities reliant on the dam (e.g., for recreation, irrigation) while benefiting others.
          *   **Principle #4 (Strategic Manipulation):** If large landowners or developers can manipulate the market.
  *   **Verdict:** **Leans NO** in practice. Defining a truly adequate combined metric is hard. Distributional impacts on specific communities (e.g., downstream towns, farmers) are likely significant and raise fairness concerns (Principle #2). Property values are also easier to manipulate/influence than fish counts.

  ### Verdicts You Might Need to Give Up (Based on Principles)

  The principles are largely consistent with your intuitions. The main challenge is **Parole Board:**

  *   **Parole Board (Your Verdict: No):** The principles strongly support your "No" (Fairness & Metric Adequacy). *However*, if the market was *solely* a prediction tool (e.g., "What is the probability this individual reoffends within 3 years?") used *informatively* by the board alongside other factors (rehabilitation, nature of crime, victim input, proportionality), the principles wouldn't inherently forbid it. Your "No" likely stems from the fear of it *replacing* human judgment, which the principles also caution against due to Fairness and Metric Adequacy. You could soften this to "Only as an *informational input*, never the sole decider" without violating the core principles, but your strong "No" is defensible.

  ### In Summary

  Your intuitions align remarkably well with the inherent limitations of prediction markets in decision-making (futarchy). The core tension is between **prediction efficiency** and **value-laden governance** (fairness, justice, avoiding corruption, preventing manipulation). Prediction markets excel at aggregating information for well-defined, non-manipulable, aggregate outcomes. They struggle profoundly with decisions involving concentrated burdens, fundamental fairness, corruptible metrics, and situations where the market itself changes the outcome or invites sabotage. The unresolved market aspect of futarchy specifically creates perverse incentives in zero-sum allocations like the organ case.
