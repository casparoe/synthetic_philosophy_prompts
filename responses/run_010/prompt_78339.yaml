  First, I need to understand their frustration. They mention two key observations: writers game the system by chopping sentences and moving complex content to footnotes, and the checker misses cases where simple language obscures meaning (like "coverage will be adjusted"). The disconnect between departments—communications relying on scores versus research requiring comprehension testing—adds another layer. 

  The user explicitly wants to avoid Orwell summaries, so I won't go there. Instead, they seek the underlying theory of language behind their practice. I should dissect what the readability metrics assume: that meaning resides in word/sentence difficulty, ignoring structure, discretion, or intentional vagueness. 

  Their questions about Orwell's inversion are sharp. The agency implements his stylistic rules (short words, active voice) but ignores his broader critique about clarity of thought and political honesty. That tension needs highlighting. 

  When analyzing justifications (accountability, consent, call reduction, litigation), I suspect litigation drives the numeric gate—it's about defensibility, not comprehension. The other goals require actual understanding, which scores don't guarantee. 

  For philosophical underdetermination: behaviorist theories (stimulus-response) align with surface metrics, while pragmatic or critical theories would reject them. This duality explains why the practice persists—it's compatible with opposing views of communication. 

  Finally, shifting to a reader-capacity model would require institutional changes: comprehension testing, restructuring documents to centralize conditions, retraining reviewers. The footnotes and hidden discretion would need reintegration, undermining the current "certify and forget" approach. 

  The user's deeper need? To arm themselves with this analysis for committee debates. They want to expose contradictions and advocate for meaningful clarity—not green checkmarks.
answer: |-
  Your agency's practice rests on a **computational-behaviorist theory of language**, which presupposes that meaning resides primarily in lexical and syntactic features of the text itself, decoupled from writer intent or reader context. This theory is philosophically shallow and operationally brittle, as your experience reveals. Below is a reconstruction of its foundations, contradictions, and alternatives:

  ### Core Presuppositions of the Readability-Gate Practice
  1.  **Meaning lives in the sentence:** The model assumes obscurity is a product of word length and sentence structure. It ignores that meaning arises from *systems* (document structure, institutional context, reader’s prior knowledge) and *intentionality* (what the writer avoids stating).
  2.  **Clarity is surface-level:** Difficulty is reduced to syllables and word order. Structural complexity (nested conditionality, distributed information), epistemic opacity (withheld rationale), or strategic vagueness ("adjusted") are invisible.
  3.  **Readers are homogeneous & mechanistic:** It assumes all "8th-grade readers" process text identically. Real-world factors (stress, health literacy, cultural schema) are irrelevant. Comprehension is modeled as passive decoding, not active interpretation.
  4.  **Quantification equals objectivity:** The score substitutes for judgment, creating legal-administrative defensibility ("We followed the standard"). This prioritizes institutional risk management over reader understanding.

  ### Orwell Inverted: Form Without Substance
  Your practice *is* an inversion of Orwell:
  -   **Mechanized Rules:** You rigidly enforce Orwell’s stylistic rules (short words, active voice) while violating his core principle: **"The great enemy of clear language is insincerity."** Your system incentivizes *procedural sincerity* (passing the checker) while enabling *substantive insincerity* (burying complexity, using vague approved terms).
  -   **Ignoring Causes:** Orwell linked linguistic decay to political evasion. Your practice *facilitates* evasion by making obscurity technically compliant. "Coverage will be adjusted" is Orwell’s nightmare: a short, passive, abstract phrase hiding agency power.
  -   **Breaking Rules for Clarity:** Orwell’s "final rule" (break others to avoid barbarism) is impossible under your regime. Rewriting "adjusted" as "reduced or terminated based on income changes" might *worsen* the score despite adding clarity.

  ### Justifications vs. the Numeric Gate’s True Function
  | Justification             | Compatible with Numeric Gate? | Primary Driver? |
  |---------------------------|-------------------------------|-----------------|
  | Democratic Accountability | No (requires understanding)   | ❌              |
  | Informed Consent          | No (requires comprehension testing) | ❌              |
  | Reducing Helpline Calls   | Partially (lowers barrier)    | ⚠️ Secondary   |
  | **Limiting Litigation Exposure** | **Yes (creates defensible record)** | **✅ PRIMARY**  |

  **The numeric gate exists primarily for institutional risk mitigation.** A high readability score provides objective-looking evidence in court or audits that the agency "communicated clearly," regardless of actual comprehension. Other goals are secondary or require incompatible methods (like testing).

  ### Philosophical Underdetermination & Commitments
  -   **Underdetermined By:**  
      -   **Behaviorist Linguistics:** (Words as stimuli triggering predictable responses). Fits the checker's mechanics.  
      -   **Formalist Stylistics:** (Clarity as grammatical simplicity). Justifies the editing rules.  
      -   **Bureaucratic Rationalism:** (Standardization ensures fairness/accountability). Legitimizes the certification process.  
  -   **Commits To (Forbidden by Rivals):**  
      -   **Meaning is Context-Free:** Rejected by *Pragmatics* (meaning requires context) and *Critical Theory* (language encodes power).  
      -   **Complexity Can Be Excised:** Rejected by *Systems Theory* (complexity migrates, doesn't vanish).  
      -   **Reader Cognition is Uniform:** Rejected by *Cognitive Linguistics* and *Sociolinguistics*.  

  ### Institutional Change: Shifting to Reader-Capacity Clarity
  Adopting the view that clarity is **"the reader's capacity to act"** requires dismantling the current regime:

  1.  **Who Certifies & How:**  
      -   **Certifiers:** Usability specialists (not compliance reviewers).  
      -   **Evidence:** Comprehension testing with target populations (like research protocols), task-success metrics (e.g., "Can the user correctly calculate their copay?"), not readability scores.  

  2.  **Handling Complexity & Discretion:**  
      -   **Eliminate Footnotes/Cross-Referencing:** Core conditions must be integrated into the main flow using progressive disclosure, scenarios, or decision trees.  
      -   **Surface Discretion:** State explicitly *who* decides, *what criteria* they use, and *how* the reader can influence it. Example: "A caseworker will decide if you qualify for this exception based on [X factors]. You can provide evidence at your appointment."  

  3.  **Textual Changes:**  
      -   **Mandate Rationale:** Explain *why* a rule exists (e.g., "State law requires X, so your benefit changes if Y").  
      -   **Replace Glossary Terms with Natural Equivalents:** If "adjusted" must stay, *immediately* clarify: "This means your coverage may decrease, increase, or end."  
      -   **Visual + Textual Structuring:** Use design (not just bullets) to show relationships, exceptions, and actions required.  

  4.  **Accountability Shift:**  
      -   **Audit for Outcomes:** Track *misunderstandings* (appeals, complaints, helpline errors) linked to documents, not compliance scores.  
      -   **Writer Training:** Focus on minimizing cognitive load and anticipating reader questions, not syllable counts.  

  ### Conclusion
  Your practice stands on a theory that reduces language to mechanics, mistaking simplicity for clarity and quantification for accountability. Its true function is legal defensibility, facilitated by its blindness to power, structure, and reader agency. To center reader capacity, the agency must abandon readability scores as certification tools, embrace context-dependent testing, and demand that documents surface—rather than bury—the institutional structures that shape readers' lives. This shifts resources from compliance monitoring to participatory design, accepting that clarity is measured at the point of understanding, not the point of publication.
