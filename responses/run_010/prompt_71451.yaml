prompt: |-
  I work in health technology assessment — the analysis that decides whether a public payer funds a drug or a screening programme. Not a philosopher, and I don't want a philosophy lecture; I want you to tell me what my own rulebook is committed to.

  Here's the practice, described as neutrally as I can:

  1. When we compare an intervention that costs money now and delivers health benefits forty years out against one that delivers them next year, we discount the costs and the health at the *same* annual rate — call it 3%. A life-year gained in 2065 counts for maybe a third of one gained in 2026.
  2. The reason usually given for using one rate on both is that money compounds: a pound now can be invested and comes back larger, so future pounds have to be shrunk before they're comparable, and health has to be shrunk on the same schedule or you'll systematically overfund prevention.
  3. But health is not allowed to compound. There's no rule anywhere that lets us bank a life-year now and spend it in 2060, or invest in health and earn returns on it. We treat health as strictly non-transferable across time.
  4. The rulebooks also say the 3% is made of two separate pieces — one for the fact that future people will probably be richer than us, one that's just impatience about people who don't exist yet — and they say the second piece should be very small on ethical grounds. In practice nobody can ever tell me which piece a given number came from.
  5. And in the sister guidance for long-run climate and environmental risk, the rate isn't constant at all: it steps down the further out you go, and irreversible or catastrophic losses sometimes get exempted from discounting entirely. So the rate stops being a function of *when* the harm happens and becomes a function of *what kind of thing* is being lost.

  So: what theory of value does 1–3 actually presuppose? Does shrinking future health at a rate whose whole justification is capital markets commit us to treating health as a fungible investable stock after all, or is there a coherent story in which the discounting and the no-banking rule sit together — and if there is, what has to be true about time, and about the identity of the person who benefits, for that story to work? Then take 4 seriously: if growth went to zero permanently, does the practice still have any content, or is its entire ethical payload parasitic on an empirical forecast? And take 5 seriously: what does a rule that switches discounting on and off by *category of loss* presuppose, and is it consistent with 1 at all? My hunch is that 5 quietly abandons the monistic, single-metric picture that 1 assumes.

  Commit to a verdict. I don't want a menu of possible readings with the picking left to me — tell me which reading you'd defend, whether the practice is ultimately coherent or is doing two incompatible things under one number, and where you're reconstructing charitably rather than describing what's really there.
reasoning: |-
  Okay, let me unpack this health economist's deep challenge about discounting practices. They're clearly frustrated with the theoretical inconsistencies in standard HTA guidelines and want me to cut through the jargon to expose the underlying commitments. 

  First, I notice they've structured their query like a legal brief - five precise observations about current practice followed by three sharp philosophical questions. This isn't someone wanting textbook answers; they're auditing their own profession's logical foundations. The demand for a verdict rather than options suggests they've already spotted contradictions and want confirmation.

  The core tension jumps out: discounting health gains at financial rates while insisting health can't be banked or invested. If health isn't capital, why treat it like capital? The climate policy comparison is devastating - suddenly discount rates morph based on what's being lost rather than when. That reveals the unspoken hierarchy where some goods get special metaphysical status.

  Hmm... their hunch about monism collapsing in point 5 feels correct. When we exempt irreversible losses from discounting, we're essentially saying: "This isn't just another commodity - its value transcends time in ways GDP doesn't." But that breaks the single-rate system's back. You can't have a unified currency of value while secretly admitting some things are priceless.

  The zero-growth scenario question is brilliant. If future wealth stops being the excuse for discounting, only pure time preference remains - which ethicists have condemned since Ramsey. That exposes the whole apparatus as parasitic on perpetual growth. Suddenly, saving a future life would "cost" nothing in missed investment returns, yet we'd still count it less? The emperor has no clothes.

  What's really being presupposed? A theory where:
  - Health is monetized by proxy (via cost-per-QALY)
  - But not truly monetizable (no banking)
  - Time is money for discounting purposes
  - Except when it isn't (catastrophic risks)

  The only coherent story left is that we're not actually discounting health at all - we're discounting the money that could have been invested instead, with health gains dragged along as collateral damage in the calculation. But that commits us to the very investment logic we deny when rejecting health banking.

  Verdict: The practice is fundamentally incoherent. The 3% rate is a zombie concept - its capital justification died when we banned health investment, but we keep shuffling it forward. Climate policy proves alternatives exist, but adopting them would require abandoning the fantasy of health as just another discounted cash flow.

  ...I'll structure the response to first diagnose the value theory failure, then show why zero-growth breaks everything, then expose how climate policy's category-based discounting is actually the more consistent approach. No hedging - they asked for a verdict, they'll get one.
answer: |-
  Here's your verdict, stripped of philosophy lectures and dissecting your rulebook's commitments point by point:

  **Your practice (points 1-3) presupposes a *constrained monetization* theory of health value within a *wealth-maximizing framework*. It is logically coherent only if you accept a very specific, narrow premise: health gains are *solely valuable as consumption goods* enabled by economic resources, not as intrinsic or capital goods.** Here's the breakdown:

  1.  **The Core Commitment:** Health is not a capital stock *to be invested in for future health returns*, but it *is* treated as a *consumption good* whose future value must be discounted because the *economic resources* required to produce it *could have been invested* in the capital market. The "same rate" rule commits you to the view that **health gains derive their *comparative* value entirely from the opportunity cost of the capital used to produce them.** Health itself is non-fungible across time, but the *money* used to buy health *is* fungible and investable. Discounting health at the financial rate isn't about health compounding; it's about the *foregone financial returns* on the money tied up in producing that future health.

  2.  **Coherence Condition:** This story *only* holds together if:
      *   **Time is Money (Literally):** The *only* relevant factor for comparing interventions across time is the opportunity cost of capital. The identity of the beneficiary (2026 vs. 2065) is irrelevant *except* insofar as it reflects a delay in consumption requiring capital to be tied up.
      *   **Health is Purely Derivative:** Health gains have no intrinsic, non-monetizable value that exists independently of the economy. Their value is *entirely contingent* on the economic system generating the resources to create them. You are not valuing "life-years" *as such*; you are valuing "economic-resource-enabled life-years".

  3.  **Point 4 (Growth & Impatience): This exposes the ethical fragility.**
      *   **Parasitic on Growth:** If permanent growth fell to zero, the *entire justification* for the bulk of the discount rate (the "growth" component reflecting richer future generations) collapses. You'd be left only with "pure time preference" (impatience). Ethically, discounting the health of future, equally poor people purely because they exist later is indefensible within most frameworks used in public policy. **Your practice loses its primary empirical anchor and ethical cover without the growth forecast.** It becomes ethically arbitrary.
      *   **The "Impatience" Smokescreen:** The "very small" pure time preference component is often a fudge. Its size is rarely derived ethically; it's usually a residual or a convention. Its presence tacitly admits that the "opportunity cost of capital" story isn't *sufficient* on its own, but adding it undermines the claim that the practice is purely about efficient resource allocation and not intergenerational ethics.

  4.  **Point 5 (Climate Rules): This fundamentally contradicts 1-3 and reveals the monism's failure.**
      *   **Abandoning Monism:** Switching rates or exempting catastrophic losses by *category* explicitly rejects the core premise of 1-3: that all benefits (health, environmental, economic) can be commensurated on a single metric (money/equivalent) and discounted solely based on *time*. It admits that **some values are incommensurable and some losses are lexically superior.**
      *   **Presupposing Intrinsic/Catastrophic Value:** Exempting irreversible/catastrophic losses presupposes that:
          1.  These losses have a value *not* derivable from or replaceable by future economic output (contradicting the "health as derivative consumption good" view).
          2.  The *nature* of the loss ("what kind of thing") matters more than *when* it occurs for discounting purposes. Time becomes secondary to ontology.
      *   **Inconsistency:** Applying a constant financial discount rate to health interventions (based on opportunity cost of capital) while applying declining or zero rates to catastrophic environmental harms based on their intrinsic/catastrophic nature **is logically inconsistent** within the single-metric framework assumed by point 1. It confirms that the "single discount rate for all benefits" model is a convenient fiction for *some* decisions but collapses when faced with losses deemed fundamentally different in kind.

  **Your Verdict:**

  1.  **On 1-3:** Coherent *only* under the **highly specific, narrow premise that health gains are purely derivative consumption goods valued solely by the opportunity cost of the capital used to produce them.** It denies health is capital *itself* but treats it *as if* it were a commodity purchased with capital. The "no banking" rule is consistent *only* because health isn't the *capital*; the *money* is.
  2.  **On 4 (Zero Growth):** **The practice loses its primary justification and ethical plausibility.** Without growth, discounting future health at 3% becomes ethically indefensible pure time preference applied to the lives of equally poor future people. Its "ethical payload" *is* parasitic on the growth forecast.
  3.  **On 5 (Climate Rules):** **This fundamentally contradicts and undermines the theory underpinning 1-3.** It abandons temporal monism for categorical value distinctions, presupposing intrinsic, non-substitutable, potentially catastrophic value for some goods – a concept explicitly denied in the health discounting logic. It highlights that the "single rate" practice relies on suppressing value pluralism.

  **Ultimate Conclusion: Your current HTA discounting practice (1-3) is *procedurally* coherent under a specific, narrow economic logic (health as derivative consumption good), but this logic is ethically fragile (reliant on growth forecasts and fudged time preference) and *fundamentally inconsistent* with the value commitments revealed in climate guidance (5). The rulebook is trying to serve two masters: a monistic, financial-opportunity-cost model for most health interventions, and a pluralistic, intrinsic-value model for catastrophic/long-term risks. It cannot hold both positions simultaneously without contradiction. The inconsistency lies not in the *math* of discounting health at 3%, but in the *underlying theory of value* it presupposes versus the one implied by the exceptions made for other domains.** Your hunch about monism collapsing is correct. The "single number" masks a deep theoretical rift.
