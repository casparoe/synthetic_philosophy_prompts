answer: |-
  Here's the bottom line upfront: **The most exclusionary requirement is explaining the seven modes combinatorially from three non-empty elements, excluding ad-hoc enumerations. The desiderata set is consistent; no formalization satisfying all exists yet, but the task isn’t performatively contradictory, as formalizing *how* it qualifies predication is distinct from claiming exhaustiveness.**

  ### Desiderata for Formalizing Syādvāda (Non-negotiable unless marked)

  1.  **Combinatorial Derivation of Seven Modes:** Must generate exactly seven distinct, non-redundant modes from the non-empty combinations of {is (A), is not (¬A), inexpressible (I)}. *Why:* Core doctrine. Accidental enumeration undermines the logic’s systematicity. **[Non-negotiable]**
  2.  **Non-Hedging `syāt`:** `syāt` cannot make every proposition compatible with its negation (avoiding self-refutation). It must restrict the domain of applicability (via standpoints) such that qualified assertions are non-trivially true/false. *Why:* Essential for meaningful assertion and debate; avoids universal skepticism. **[Non-negotiable]**
  3.  **Successive vs. Simultaneous Assertion:** Must differentiate the "is and is not" mode (asserted successively/krama) from the "inexpressible" mode (arising from the *impossibility* of asserting "is and is not" simultaneously/yugapat). *Why:* Foundational to the 3rd vs. 4th/5th/6th/7th modes. **[Non-negotiable]**
  4.  **Compositionality:** Must handle nested `syāt` claims (e.g., `syāt(syāt P)`) without collapsing modes or losing the qualification structure. *Why:* Jain arguments embed qualifications; formalism must reflect actual usage. **[Non-negotiable]**
  5.  **Standpoint (Naya) Parameterization:** Standpoints must be modeled explicitly, but the parameter set must be *principled* (e.g., substance, place, time, aspect – reflecting canonical nayas) to avoid ad-hoc subjectivity. *Why:* `syāt`’s meaning depends on context; unconstrained standpoints invite arbitrariness. **[Preference: Commentarial/Formal]**
  6.  **Ontological vs. Epistemic Interpretation:** Must commit to whether `A`, `¬A`, `I` describe reality (objects have incompatible aspects) or epistemic limitations (asserters cannot fully express). *Cost:* Ontological requires true contradictions; Epistemic requires a robust knowledge/expressibility operator. **[Preference: Comparative/Formal]**
  7.  **Disputation & Definite Falsity:** Must allow asserting `syāt P` as definitively true *within its standpoint* and rejecting `Q` (e.g., an opponent's unqualified `P` or `¬P`) as false simpliciter. *Why:* Jain argumentative practice asserts conclusions and negates wrong views. **[Non-negotiable]**

  ### How Standard Moves Fare

  *   **Many-Valued/Fuzzy Logic:** Often fails (1) by not deriving 7 modes combinatorially, (3) by treating modes as simultaneous truth-values, and (7) by lacking definite falsity. Struggles with (2) meaningfully.
  *   **Dialetheism:** Handles (6 ontological) "is and is not" but fails (3) by conflating successive/simultaneous, and (4) compositionality with `I`. Cannot explain `I` distinctively. Fails (2) if `syāt` is redundant.
  *   **Contextualism (Standpoints):** Essential for (2), (5), (7). Fails if parameters are arbitrary (5). Must integrate with (1), (3), (4), (6) to succeed.

  **Key Exclusion:** Requirement (1) immediately disqualifies formalizations that merely list 7 truth-values or operators without combinatorial justification. Requirement (2) excludes systems where `syāt P` entails nothing concrete. **The set is consistent:** A contextualist, paraconsistent logic with a defined inexpressibility operator, combinatorial modes, and standpoint semantics *could* satisfy all, though none fully achieves it yet. The papers’ core task is demonstrating this integration.
