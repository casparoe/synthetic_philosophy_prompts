prompt: |-
  ok so I sit on the curatorial committee of a small regional human rights museum and I need help thinking through a decision we have to make next month. Please take this as seriously as a professional philosopher of history who also does museum ethics consulting would — that's the role I want you in. And do some explicit brainstorming out loud before you land anywhere: sketch the candidate rules, test each one against the record, and only then give me a verdict. No reading lists or citations, I can't check them and I don't want them, I want your actual reasoning. Flag wherever you're guessing.

  Here's the record. Our job is to approve or reject exhibit and program proposals, and roughly half of them involve comparing one mass atrocity to another. Over four years:

  1. Approved — two adjacent galleries, one on the Atlantic slave trade and one on the rubber terror in the Congo Free State, joined by a shared wall text about extraction economies and coerced labor. The minute reads: "the comparison is about the machinery, not the misery."
  2. Rejected — a public panel series, working title "Which Was Worse?", four historians debating the twentieth century's mass killings with a running death-toll graphic on the screen behind them. Two members said the format, not the subject, was the problem.
  3. Approved with conditions — a photo display pairing images from a siege with images from a famine some decades earlier, on condition that every caption name who did what to whom, and that neither event's name be used as an adjective for the other.
  4. Rejected — a proposal to use the phrase "concentration camps" in wall text about a detention system that is still operating, even though one of our own board members survived such a camp as a child and personally endorsed the comparison. The recorded reason is a single word: "premature."
  5. Approved — an exhibit on two different countries' programs of removing children from an indigenous population, told through parallel timelines and a lot of shared archival documents.
  6. Rejected, narrowly — a grant-funded proposal to build a "severity index," a scoring rubric weighting scale, intent, irreversibility and complicity, to be used to sort our own case files. The reason given was that it "puts numbers on things that shouldnt have them." I argued at the time that this is hard to square with 5, which is nothing but numbers and dates, and nobody really answered me.

  One member insists we've been applying a single coherent principle the whole time. Another thinks we've just been voting our stomachs and dressing it up afterwards. I honestly can't tell which of them is right, and I want your read on that too.

  Now the proposal in front of us. An outside scholar wants to mount a display comparing two famines — one in a nineteenth-century colony run by an imperial power, one under a twentieth-century state's grain requisition program. The comparison is entirely about mechanism: railway and shipping logistics, what was being exported and when, which officials knew what, how the relief bureaucracy behaved, the ideology that made starvation thinkable in each case. Every caption names agents. Each famine gets its own wall text in its own vocabulary, and the scholar has written in explicitly that the exhibit draws no conclusion about which was worse.

  The centerpiece, though, is one large graph: excess mortality for both famines plotted on a single set of axes, normalized per capita, so the two lines cross each other about a third of the way in. The scholar's argument is that the crossing is the whole point — one curve spikes and collapses, the other grinds on for years, and the shapes track the difference between a market-mediated and a state-commanded famine.

  Complication: our community advisory council is split. The group affiliated with the smaller of the two death tolls supports the exhibit enthusiastically. The group affiliated with the larger one objects in writing, saying the overlay "shrinks our dead into a line on somebody else's chart."

  What I want from you:

  (a) Give me the candidate rules that could explain our six verdicts. I'd guess at least three or four are worth taking seriously — something like "compare machinery, not misery," "no comparison that yields an ordering," "don't touch live politics," "don't annex one community's dead into another's vocabulary." Don't just run with my list: generate your own, and tell me which of mine you'd drop and why.

  (b) Say how much strain each rule is under — which of the six verdicts it has to explain away or treat as a mistake — and whether any single rule survives all six without bending. If none does, say which verdict you'd tell us to reverse.

  (c) Then the actual recommendation: what should we vote to be consistent with ourselves? Straight approve, reject, or approve-with-conditions, and if conditions, exactly what conditions, worded so I could read them out in the meeting.

  (d) Which of the six is the closest analog to this proposal, and which is the most misleading analog that someone on our committee is likely to reach for anyway?

  (e) If the record genuinely underdetermines this — and I suspect it does — tell me what principle we'd be committing to with each of the plausible votes. Not what we decide this time, but what we'd be signing up to say yes or no to the next time a proposal like it lands on us.

  (f) Finally, construct one further hypothetical proposal, your own invention, that would come out differently under your top two candidate rules, so we could float it to the committee and find out which rule were actually running.

  Think carefully and take your time with it. I'd much rather have a long, worked-through answer than a tidy one.
reasoning: |-
  Okay, the user is on the curatorial committee of a small human rights museum and needs help deciding on a proposal about comparing two famines. They provided six past decisions and want a structured analysis. Let me start by understanding their main concerns. They're unsure if their past decisions followed a coherent principle or were just gut feelings. The proposal involves comparing two famines through mechanisms, with a graph showing normalized mortality rates. One community group supports it, the other opposes because they feel it reduces their tragedy to a line on a chart.

  First, I need to extract candidate rules from the six verdicts. Let's go through each one. 

  Approved the slave trade and Congo exhibit because they compared machinery, not misery. That suggests a rule about focusing on systemic structures rather than suffering. 

  Rejected the "Which Was Worse?" panel. The issue was the format—ranking atrocities with death tolls. So maybe a rule against comparative rankings or competitive frameworks. 

  Approved the siege and famine photo display with conditions: naming perpetrators and not using one event's name as an adjective for the other. This emphasizes specificity and avoiding appropriation. 

  Rejected using "concentration camps" for a current detention system, calling it "premature." So a rule against applying historical terms to ongoing conflicts to avoid politicization. 

  Approved the indigenous children removal exhibit with timelines and documents. Here, structural similarities without direct comparison were okay, supported by shared documents. 

  Rejected the severity index because it quantified suffering. The objection was putting numbers on unquantifiable things. But the user points out that exhibit 5 used numbers and dates, so there's tension here. 

  Now, generating candidate rules. The user suggested some, like "compare machinery, not misery." That fits 1 and 5. But the rejected panel (2) and severity index (6) involve quantification and ranking. The live politics rule from rejection 4 ("premature") seems solid. The annexation rule from approval 3's condition is important. 

  Testing each rule against all six decisions. Rule A: Compare structures, not suffering. Explains approvals 1, 3 (with conditions), and 5. But why reject the severity index (6)? Maybe because scoring reduces structures to numbers. Panel (2) is rejected because it's about misery, not structures. Rejection 4 (live politics) isn't covered here, so that's a strain. 

  Rule B: No comparative ranking. Explains rejection of 2 and 6. But approval 1 compares structures without ranking, and 5 uses numbers without ranking. However, the graph in the new proposal has crossing lines, which might imply ranking even if unintended. The community's objection about "shrinking dead into a line" touches this. 

  Rule C: Avoid ongoing politicization. Explains rejection 4. But doesn't relate to others unless the famines involve current issues. The proposal's famines are historical, so maybe not applicable. 

  Rule D: Prevent annexation. From 3's conditions. Approval 3 required naming agents and no adjective use. The new proposal does name agents and avoids using one famine's name for the other. But the graph's overlay might be seen as annexation by the opposing group. 

  Rule E: Quantification only when contextualized. Explains why 5 was approved (numbers in timelines) but 6 rejected (reduction to scores). The graph in the proposal is contextualized within mechanisms, so maybe acceptable. But the community's objection highlights the risk. 

  No single rule fits all six without strain. Rule B (no ranking) struggles with 5's numbers. Rule D (no annexation) is strained by 1's shared text. The closest analog is approval 1 (machinery comparison) and 5 (parallel timelines). The misleading analog could be rejection 6 (severity index) because of the graph's quantification. 

  For the recommendation, approve with conditions: modify the graph to be separate but synchronized axes, add a disclaimer about not ranking, and involve the objecting community in caption revisions. This aligns with past decisions focusing on structures, avoids ranking, and addresses annexation concerns. 

  If they approve, they commit to structural comparisons with quantification in context. If rejected, they might be ruling out any overlay visuals. The hypothetical proposal: an exhibit comparing bureaucratic mechanisms of two genocides with a shared document display (allowed under Rule A) but rejected if it includes a timeline with normalized body counts (violates Rule B). This tests if the committee prioritizes structural analysis over quantification methods.
answer: |-
  ### (a) Candidate Rules Explaining the Six Verdicts  
  After analyzing the record, I propose five candidate rules (I'll retain two of yours with modifications, drop two, and add three new ones):  

  1. **Rule A (Structural Comparison Only)** [Modified from your "machinery, not misery"]: *Compare only the institutional/logistical mechanisms of atrocities—never suffering, scale, or moral weight.*  
     - **Retains your core insight** but drops "misery" as too vague. Explains #1 (extraction machinery), #3 (conditions about naming agents), and #5 (parallel programs).  

  2. **Rule B (No Implied Hierarchy)** [New]: *Never allow formats that suggest ranking, competition, or quantifiable "worse-ness"—even implicitly.*  
     - Explains #2 (rejecting debate/death-toll display), #6 (rejecting "severity index"), and #3's condition (banning adjectival annexation).  

  3. **Rule C (No Active Political Instrumentalization)** [New]: *Avoid comparisons that could be weaponized in ongoing conflicts or unresolved justice claims.*  
     - Explains #4 ("premature" for live detention systems) and #3's condition (naming perpetrators reduces abstraction).  

  4. **Rule D (Anti-Annexation Principle)** [Retained from your list]: *Prevent one community's trauma from being subsumed into another's narrative or vocabulary.*  
     - Explains #3's condition (no adjectival use), #4 (rejecting terminology that might dilute specificity), and #6 (rejecting index that flattens distinct harms).  

  5. **Rule E (Quantification as Context, Not Essence)** [New]: *Use numbers only to illustrate structure/duration—never as standalone evidence of severity.*  
     - Explains #5 (approving timelines/dates as contextual) vs. #6 (rejecting scoring rubric).  

  **Dropped from your list:**  
  - "Don't touch live politics" → Too narrow; **Rule C** covers it better by focusing on *instrumentalization risk*.  
  - "No comparison that yields an ordering" → Partially absorbed into **Rule B**, but "ordering" is broader than hierarchy (e.g., chronological order in #5 is fine).  

  ---

  ### (b) Testing Rules Against the Record  
  | Rule          | Strain Points (✓= clean fit, ✗= strain, ‼= major contradiction) |  
  |---------------|---------------------------------------------------------------|  
  | **A: Structural Only** | ✓ #1, ✓ #3 (conditions), ✓ #5 → ✗ #2 (didn’t engage structures) → ‼ #6 (severity index quantified structures) |  
  | **B: No Hierarchy**    | ✓ #2, ✓ #6 → ✗ #5 (timelines could imply progression) → ‼ #1 (adjacent galleries risk implicit comparison) |  
  | **C: No Instrumentalization** | ✓ #4 → ✓ #3 (conditions reduce risk) → ✗ #1, #5, #6 (no live politics) |  
  | **D: Anti-Annexation** | ✓ #3 (no adjectives), ✓ #4 (terminology) → ✗ #1 (shared wall text could blur distinctness) → ‼ #5 (shared documents risk fusion) |  
  | **E: Quantification as Context** | ✓ #5 → ✓ #6 rejection (rubric made numbers essential) → ✗ #3 (photos not quantified) → ‼ #1 (no numbers used) |  

  **Verdict:**  
  - **No rule survives unbent.** **Rule B (No Hierarchy)** has the least strain (only minor tension with #5).  
  - **I’d reverse #6’s rejection**—it’s the outlier. If quantification is valid in #5 (dates/timelines), rejecting a "severity index" solely for using numbers is inconsistent. The problem was making numbers *evaluative*, not their use.  

  ---

  ### (c) Recommendation for the Famine Proposal  
  **Vote: Approve with Conditions**  
  - **Conditions:**  
    1. **Separate the graph:** Display the two mortality curves on *synchronized but distinct axes* (side-by-side graphs, shared timeline x-axis). No overlay.  
    2. **Add a disclaimer:** At the graph’s base: *"These curves illustrate logistical mechanisms, not relative suffering. Each famine’s victims remain irreducible to data."*  
    3. **Revise one caption:** Replace "the shapes track the difference between..." with *"the mortality curves reflect distinct famine mechanisms: market-mediated vs. state-commanded."*  
    4. **Consult the objecting group:** Offer them input on phrasing for *their* famine’s wall text (not veto power).  

  **Reasoning for Conditions:**  
  - The graph’s overlay is the annexation risk (**Rule D**) and could imply hierarchy (**Rule B**). Separate axes preserve structural insight (**Rule A**) while honoring the community’s concern.  
  - The disclaimer addresses quantification concerns (**Rule E**).  
  - The caption edit reinforces structural focus (**Rule A**) and depersonalizes the comparison.  

  ---

  ### (d) Analogues  
  - **Closest Analog: #1 (Slave trade/Congo exhibit)**  
    Both focus on "machinery" (extraction logistics vs. famine logistics), name agents, and avoid moral comparison.  
  - **Misleading Analog (Likely to be cited): #6 (Severity index)**  
    Opponents will fixate on the graph’s numbers, but the key difference is intent: here, quantification illustrates *mechanism* (per Rule E), not severity ranking.  

  ---

  ### (e) Principles Committed To by Voting Options  
  - **Approve (with our conditions):** Commits to:  
    *"Structural comparisons using contextualized quantification are permissible, provided they avoid visual/textual annexation of one trauma into another’s framework."*  
    → *Future implication:* Opens door to mechanistic exhibits with graphs, but sets precedent for community consultation on sensitive visuals.  
  - **Reject:** Commits to:  
    *"Any visual representation of comparative mortality data—even for structural analysis—constitutes annexation and is unacceptable if opposed by affected communities."*  
    → *Future implication:* Effectively bans all overlay graphs/timelines in comparative exhibits, risking over-reliance on text.  
  - **Approve with NO conditions:** Commits to:  
    *"Community objections to structural comparisons are secondary to scholarly framing."*  
    → *Future implication:* Erodes trust with advisory councils; may escalate conflicts.  

  ---

  ### (f) Hypothetical Proposal to Test Rules  
  **Proposal:** *An exhibit comparing the bureaucratic paperwork systems of the Holocaust and the Rwandan Genocide (e.g., ID cards, train manifests, memos). Includes a shared timeline of document production volumes (pages/month).*  
  - **Under Rule B (No Hierarchy):** APPROVED. Focuses on structures (bureaucracy), avoids ranking.  
  - **Under Rule D (Anti-Annexation):** REJECTED. Shared timeline could fuse distinct traumas ("paperwork" ≠ moral equivalence).  
  - **Test Value:** Reveals whether the committee prioritizes *structural analysis* (Rule B) or *trauma separation* (Rule D) when documentation is central.  

  ---

  ### Final Takeaway  
  Your committee has consistently prioritized **structural analysis** (#1, #3, #5) while rejecting **hierarchical quantification** (#2, #6) and **terminological annexation** (#3, #4). The famine proposal’s graph is the friction point—it straddles structural insight and annexation risk. **Conditions separating the axes and adding context uphold your core principle (Rule A) while respecting Rule D.** If you reject over the graph, you’re implicitly elevating Rule D above Rule A—a shift requiring explicit justification.  

  Vote for the conditions. They align with your record, honor the scholar’s intent, and offer the objecting community agency—without surrendering to veto power.
