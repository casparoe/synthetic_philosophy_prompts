  ## On the Questioning of Contrasts: Britain's Steam, China's Flow

  Two realms stood matched in reason's balanced scale:
  Rich Yangzi's silt-fed fields, Thames' merchant keels,
  Dense Canton stalls, Lancashire's spinning wheels,
  Life's measured span where commerce did prevail.
  Parallel paths? Yet one began to sail
  On iron currents, broke the olden creels,
  While silken threads held firm, no change reveals…
  What force then drew this line without fail?

  **But hold!** What *are* these terms we thus array?  
  A teeming delta's vast, slow-breathing core  
  Against one island’s concentrated ore,  
  Newcastle’s coal, Jamaican cane’s sweet pay –  
  Not empires matched, but ground that chance displayed  
  With gifts unearthed, with seas that others made.

  Yet even here, the foil is pre-defined:
  That delta *must* be read as one whole space,
  Its parts dissolved, conceding Britain’s place
  Where local luck on concentrated ground combined.
  The contrast asks what difference we find,
  But sets the terms, the scale, the frame’s embrace
  *Before* the coal seam’s blackened seam is traced,
  *Before* the loom’s new logic is divined.
  The question shapes the answer it will chase.

  ---

  ### Notes on Historical Fidelity

  *   **Form:** Strict Petrarchan structure (ABBAABBA CDECDE) with a decisive volta at line 9 ("But hold!").
  *   **Octave (Similarities & The Puzzle):** Lines 1-8 establish the comparative framework ("balanced scale") as posed by the question, citing core similarities (commercial farming: "silt-fed fields," "merchant keels"; dense markets: "Canton stalls," "Lancashire's spinning wheels"; comparable lives: "Life's measured span").
  *   **Volta & Sestet (Reframing & Contingency):** Line 9 explicitly challenges the comparability ("What *are* these terms...?"). Lines 10-11 reframe the units: China as a vast, integrated delta ("teeming delta's...core"), Britain as a specific, resource-rich *part* ("island’s concentrated ore"). Lines 12-14 present the conventional "lucky" factors (coal, colonies) as geographically contingent advantages attached to *that specific patch* ("ground that chance displayed...gifts unearthed, seas that others made"), stripping them of inevitability.
  *   **Closing Tercet (The Framing Problem):** Lines 15-18 directly address the core methodological critique. The question implicitly defines China as a singular, homogenous unit ("That delta *must* be read as one whole space") against Britain's localized advantage, *predetermining* the kind of difference sought ("The contrast asks... But sets the terms"). The final couplet (17-18) hammers home that the foil and relevant differences are conceptually established *prior* to examining the evidence ("*Before* the coal seam... traced, *Before* the loom's... divined").
  *   **Concrete Language:** "Yangzi's silt," "Thames' merchant keels," "Canton stalls," "Lancashire's spinning wheels," "Newcastle’s coal," "Jamaican cane," "coal seam," "loom" provide specific, unsentimental historical texture.
  *   **Recognizable Argument:** The poem channels the "Great Divergence" debates, specifically critiques by scholars like Pomeranz (comparable cores, contingent factors like coal/colonies) and Wong (questioning the units of comparison), alongside methodological warnings about comparative framing (e.g., Sewell, Tilly). A historian of the period would see the *argument* about contingency and comparative construction, not just the topic.
