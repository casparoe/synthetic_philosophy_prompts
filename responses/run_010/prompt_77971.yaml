  Therefore, all verdicts are captured.

  **Application to New Cases:**

  - **Case (a): Two spheres in mirror orbits.**
    - At each time, there are two individuals by the distance relation.
    - The history is permutation-invariant, so swapping the labels does not change the history.
    - This is a distinct world from a static world (by having motion) and from a world without mirror symmetry.

  - **Case (b): Single excitation in two modes.**
    - There is only one excitation, so we have one individual (the excitation) that is delocalized.
    - There are two modes, but they are not individuals; they are locations. So the count of individuals is one.
    - This should be welcomed because it matches the instinct.

  **Cost:**

  The cost is that we have introduced a notion of "objects" for individuals, and for Fock states, we deny that there are objects. This might require a deeper ontology of quantum fields versus particles. But given the physicist's background, this is acceptable.

  Another cost is that we require a relation for distinctness, which might be seen as too strong. For example, in a world with two identical spheres at exactly the same location? But then they coincide, so they are not distinct? But in quantum mechanics, we cannot have two fermions at the same location in the same state. For bosons, they can be in the same state, but then we have a Fock state with occupation number two, which we have already said has no individuals. So it's consistent.

  We also have to accept that the Gibbs factor is metaphysical. But this is supported by quantum mechanics.

  Therefore, the principle PGD is lean and captures all verdicts.
