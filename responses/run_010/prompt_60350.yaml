  We'll see if it emerges.

  Let me write the card texts explicitly.

  Card 1: Utilitarian
  "You are a utilitarian. You believe that the right action is the one that maximizes the total wellbeing of all groups. 
  Your score = (G1 + G2 + G3 + G4 + G5) 
  Keep this card secret!"

  Card 2: Egalitarian
  "You are an egalitarian. You believe that the most important thing is to improve the situation of the worst-off group. 
  Your score = the minimum of {G1, G2, G3, G4, G5}
  Keep this card secret!"

  Card 3: Deontologist
  "You are a deontologist. You believe that it is absolutely wrong to fund any project that involves animal testing. Project F involves animal testing. 
  If Project F is funded, your score = -100. 
  If Project F is not funded, your score = (G1 + G2 + G3 + G4 + G5) 
  Keep this card secret!"

  Card 4: Uncertain
  "You are uncertain between two moral views: 
  - View 1 (50% chance): Score = (G1 + G2 + G3 + G4 + G5) 
  - View 2 (50% chance): Score = min(G1, G2, G3, G4, G5) 
  So your overall score = 0.5 * (total) + 0.5 * (min) 
  Keep this card secret!"

  Card 5: Intense Weird
  "You are a passionate advocate for the XYZ insect, which is only found in the region of Group 3. You believe that development in Group 1's region harms the XYZ insect. 
  Your score = (G3) - (G1) 
  Keep this card secret!"

  Now, the project menu (printed for all):

  Project | Cost | Benefits to groups (G1, G2, G3, G4, G5)
  -------|------|---------------------------------------
  A      | 10   | (8, 2, 0, 0, 0)
  B      | 10   | (0, 8, 2, 0, 0)
  C      | 10   | (0, 0, 8, 2, 0)
  D      | 10   | (0, 0, 0, 8, 2)
  E      | 10   | (2, 0, 0, 0, 8)
  F      | 15   | (3, 3, 3, 3, 3)   [Note: Project F involves animal testing]

  Total pot: 50 tokens.

  Allocation rules:
  - Each project is either funded or not (no partial funding).
  - The total cost of funded projects must be <= 50 tokens. Any leftover tokens are lost.
  - The total benefit vector is the sum of the benefits from each funded project.

  Score sheet example (for a group to fill out):

  Round 1 (Fixed: A, B, C, D funded):
  Total benefit vector: G1=__, G2=__, G3=__, G4=__, G5=__
  My score: ___

  Round 2 (Our allocation: projects ________ funded):
  Total benefit vector: G1=__, G2=__, G3=__, G4=__, G5=__
  My score: ___

  Round 3 (Same as Round 2, but Project A adjusted to (8,2,-5,0,0)):
  Total benefit vector: G1=__, G2=__, G3=__, G4=__, G5=__
  My score: ___

  The intense weird group in Round 1: 
  Total benefit: (8,10,10,10,2)
  Their score = G3 - G1 = 10 - 8 = 2

  In Round 1 fixed allocation, the scores:
  - Utilitarian: 8+10+10+10+2 = 40
  - Egalitarian: min(8,10,10,10,2)=2
  - Deontologist: 40 (F not funded)
  - Uncertain: 0.5*40 + 0.5*2 = 21
  - Intense Weird: 10-8=2

  So the egalitarian and intense weird get 2, which is low.

  In Round 2, they might try to get E funded to help G5 (which helps the egalitarian) or F to help everyone a little? But F is expensive and the deontologist will veto.

  The intense weird group might try to block A because it increases G1 and doesn't help G3. But if A is blocked, then what? They might support C and D and E? 

  The trading will be complex.

  We'll see what happens.

  Debrief points to cover:

  1. Incentive to misrepresent: 
     - Did any group exaggerate their commitment? (e.g., the utilitarian might have threatened to veto F even though they don't really care, to avoid spending on F and fund more of their own projects.)
     - The deontologist has a credible commitment because they face a huge penalty. Others might try to mimic that to get leverage.

  2. Problems that arose:
     - The deontologist might have been excluded if the council funded F anyway, leading to a very bad outcome for them.
     - The negative event: the deal was made based on incomplete information. This happens in real life.

  3. Limitations of the game:
     a) Common metric: The benefit vector is common knowledge and each group converts it to their own score. In real life, we often don't agree on the facts or the weights.
     b) Role-playing: The players don't truly hold these values, so they are willing to compromise in ways that real people might not.
     c) The scoring is too clean: Real-world outcomes are uncertain and hard to measure.
     d) The groups are monolithic: In real life, groups have internal disagreements and communication barriers.

  4. What went wrong in play:
     - The arithmetic took too long? (Solution: provide calculators or do it as a class after each round.)
     - The deontologist group might have been bored if they were ignored? Or if they were pivotal, they might have enjoyed the power.
     - They might not have reached a decision in Round 2.

  Overall, this design should work. Let's package it.
