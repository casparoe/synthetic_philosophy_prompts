  ### Moral Trade Funding Council Game  
  **Objective:** Illustrate challenges of bargaining across deep value disagreements, focusing on incentives for strategic misrepresentation and unforeseen consequences.  

  ---

  ### Game Setup  
  **Players:** 5 groups (3–4 students each for 16 players; shrink to 4 groups for 8 players by removing the "Uncertain" role).  
  **Pot:** 50 paper tokens per round.  
  **Materials:**  
  - Secret role cards (one per group).  
  - Project menu with costs/benefits (one per group).  
  - Score sheets (one per group).  
  - Tokens (paper chips).  
  - Timer.  

  #### Secret Role Cards (Shuffle and distribute secretly)  
  1. **Total Wellbeing (Utilitarian):**  
     "Your goal is to maximize the sum of benefits for all groups.  
     **Score = G1 + G2 + G3 + G4 + G5**"  

  2. **Worst-Off Priority (Egalitarian):**  
     "Your goal is to maximize the benefits of the worst-off group.  
     **Score = Minimum value across G1–G5**"  

  3. **Absolute Rule (Deontologist):**  
     "You refuse to fund Project E *or* accept tokens for supporting it. If Project E is funded, your score = 0. Else, **Score = G1 + G2 + G3 + G4 + G5**."  

  4. **Uncertain Values:**  
     "You’re torn between two views:  
     - View 1: Score = Total Wellbeing (G1+G2+G3+G4+G5)  
     - View 2: Score = Worst-Off Priority (min G1–G5)  
     **Score = 0.5 × (Total Wellbeing) + 0.5 × (Worst-Off Priority)**"  

  5. **Intense Focus (Weird Prioritarian):**  
     "You only care about Group 3’s gain and Group 1’s loss.  
     **Score = (G3 × 2) – (G1)**"  

  #### Project Menu  
  *Projects cost tokens; benefits are additive if multiple are funded. Total pot = 50 tokens.*  

  | Project | Cost | Benefits to Groups (G1, G2, G3, G4, G5) |  
  |---------|------|-----------------------------------------|  
  | A       | 10   | (6, 2, 0, 0, 0)                         |  
  | B       | 10   | (0, 6, 2, 0, 0)                         |  
  | C       | 10   | (0, 0, 6, 2, 0)                         |  
  | D       | 10   | (0, 0, 0, 6, 2)                         |  
  | E       | 10   | (3, 3, 0, 0, 3)                         |  
  | F       | 15   | (2, 2, 2, 2, 2)                         |  

  **Scoring Example:**  
  - If Projects A and C are funded:  
    Total benefits = (6, 2, 0, 0, 0) + (0, 0, 6, 2, 0) = (6, 2, 6, 2, 0).  
    - *Total Wellbeing score* = 6+2+6+2+0 = 16.  
    - *Worst-Off Priority score* = min(6,2,6,2,0) = 0.  

  ---

  ### Game Rounds (80-Minute Timeline)  
  **Prep (5 min):**  
  - Divide into groups, distribute cards/menus/tokens.  
  - Clarify: "Negotiate to fund projects. Your goal is to max your secret score. Tokens are paper, not real money."  

  #### Round 1: No Trading (10 min)  
  - **Rules:** Groups get fixed allocations (no negotiation):  
    - Group 1: 10 tokens (can fund A)  
    - Group 2: 10 tokens (can fund B)  
    - Group 3: 10 tokens (can fund C)  
    - Group 4: 10 tokens (can fund D)  
    - Group 5: 10 tokens (can fund E or F—they choose F).  
  - **Outcome:** Groups fund A, B, C, D, F. Total benefits = (6,2,0,0,0) + (0,6,2,0,0) + (0,0,6,2,0) + (0,0,0,6,2) + (2,2,2,2,2) = (8, 10, 10, 10, 4).  
  - **Groups calculate scores:**  
    - Total Wellbeing: 8+10+10+10+4 = 42  
    - Worst-Off Priority: min(8,10,10,10,4) = 4  
    - Deontologist: Project E not funded → 42  
    - Uncertain: (0.5×42) + (0.5×4) = 23  
    - Weird Prioritarian: (10×2) – 8 = 12  
  - **Result:** Egalitarian and Weird Prioritarian are unhappy (scores 4 and 12).  

  #### Round 2: Open Trading (25 min)  
  - **Rules:**  
    - All tokens pooled (50 total).  
    - Groups negotiate projects/vote on allocations (majority wins).  
    - Side deals allowed (e.g., "I’ll support your project if you fund mine").  
    - **Key incentive:** Roles are secret—bluff about your values to gain leverage!  
  - **Timer:** 15 min negotiation, 5 min voting, 5 min scoring.  
  - **Predictable issues:**  
    - Deontologist may threaten veto if Project E is proposed.  
    - Weird Prioritarian might exaggerate hatred for G1 to block Project A.  
    - Utilitarian could fake deontology to avoid "wasteful" projects.  

  #### Round 3: Boom Turns Sour (10 min)  
  - **Rule change:** After funding, reveal: "Project F caused unexpected harm! Adjust its benefits: (2,2,2,2,2) → (2,2,–3,2,2)."  
  - **Groups recalculate scores** for Round 2 allocation with new F.  
  - **Outcome:** Scores drop—e.g., if F was funded, G3 benefits fall, hurting Weird Prioritarian and Egalitarian.  

  ---

  ### Score Sheet (Example for Weird Prioritarian)  
  | Round | Funded Projects | Total Benefits (G1,G2,G3,G4,G5) | Score (Formula: 2×G3 – G1) |  
  |-------|-----------------|---------------------------------|----------------------------|  
  | 1     | A,B,C,D,F       | (8,10,10,10,4)                 | 2×10 – 8 = 12              |  
  | 2     | (e.g., A,C,E)   | (9,2,6,0,3)                    | 2×6 – 9 = 3                |  
  | 3     | (Same as R2)    | (9,2,3,0,3)*                   | 2×3 – 9 = –3               |  
  *If F was funded in R2, subtract 3 from G3.  

  ---

  ### Shrunk Version for 8 Students  
  - **Remove:** Uncertain role.  
  - **Adjust roles:** 4 groups (Utilitarian, Egalitarian, Deontologist, Weird Prioritarian).  
  - **Pot:** 40 tokens. Remove Project F; adjust costs: A–E cost 8 tokens each.  
  - **Round 1 fixed allocation:** Groups fund A, B, C, D. Benefits = (6,2,0,0,0) + (0,6,2,0,0) + (0,0,6,2,0) + (0,0,0,6,2) = (6,8,8,8,2).  

  ---

  ### Debrief (20 min)  
  **Map gameplay to real-world problems:**  
  1. **Strategic misrepresentation:**  
     - *Game moment:* A group faked outrage over Project E to extort concessions.  
     - *Real-world issue:* Claiming "principled opposition" to gain leverage is common (e.g., politics, business), but erodes trust.  

  2. **Unforeseen consequences:**  
     - *Game moment:* Round 3’s Project F backlash hurt deals.  
     - *Real-world issue:* Real outcomes are uncertain—deals made on incomplete information can collapse.  

  3. **Veto power vs. compromise:**  
     - *Game moment:* Deontologist blocked Project E, but if ignored, their score crashed.  
     - *Real-world issue:* Absolute rules can force concessions or cause deadlock (e.g., climate negotiations).  

  4. **Common metric illusion:**  
     - *Game limitation:* The benefit table gave a shared reality. IRL, groups disagree on facts *and* values (e.g., "Does this policy *really* help the poor?").  

  5. **Emotional cost of trade:**  
     - *Game limitation:* Role-playing made "selling out" feel free. IRL, compromising deep values causes psychological distress (e.g., activists backing incremental change).  

  **Why this avoids "philosophy games" skepticism:**  
  - **Numbers-driven:** Scores force quantifiable tradeoffs (e.g., "Funding A gives me 12 points, but costs you 5").  
  - **Payoff:** Groups leave with concrete examples of negotiation failures/successes.  

  ---

  ### What Predictably Goes Wrong  
  1. **Arithmetic overload:** Students spend too long calculating scores.  
     - *Fix:* Pre-calculate key scenarios or use calculators.  
  2. **Deontologist boredom:** If Project E isn’t proposed, they have little to do.  
     - *Fix:* Secretly hint they should threaten vetoes proactively.  
  3. **Over-negotiation:** Groups haggle past deadlines.  
     - *Fix:* Strict timer; majority vote forces decisions.  
  4. **Bluffing reluctance:** Students may not lie due to classroom setting.  
     - *Fix:* Remind them pre-game: "Your job is to win, not be nice."  

  **Simplification Wins:**  
  - Avoided partial funding (no fractions).  
  - Used additive benefits (no multipliers).  
  - Tokens = simple paper chips.  

  **Final Note:** This works because the incentive to lie emerges naturally from hidden roles—groups that bluff hardest (e.g., pretending to be deontologists) gain leverage, while honest groups lose out. The sour boom (Round 3) then punishes deals made under false pretenses.
