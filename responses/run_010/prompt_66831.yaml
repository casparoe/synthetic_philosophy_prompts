prompt: |-
  A chapter of a trade book about trust summarizes the epistemology of testimony as follows:

  "Philosophers divide into reductionists and anti-reductionists about testimony. The reductionist line, which goes back to Hume, holds that a hearer's belief is justified only if she has evidence, independent of testimony itself, that this particular speaker is telling the truth on this particular occasion; since collecting such evidence usually means asking other people, the view implies that we can never rationally trust a stranger. The anti-reductionist line, which goes back to Reid, holds that belief in testimony is justified a priori, meaning we are entitled to it independently of all experience: nature installs in us a principle of veracity licensing us to accept what we are told, and the license is unconditional, since any attempt to check it would itself have to run through testimony. Both sides grant that testimony yields knowledge only when it is reliable; what they disagree about is how reliable it actually is. Reid's side looks better placed, because nobody in fact checks, and young children believe whatever they are told."

  I am inclined to accept the ending, since I do mostly believe what people tell me without investigating, but I grew uneasy at the sentence claiming that both sides grant everything turns on reliability. Please go through the passage claim by claim: what would a specialist in social epistemology accept, what would they regard as a simplification that changes the position being described, and what would they reject outright? I would especially like to know whether the reductionist really demands case-by-case evidence about the speaker at hand, what the technical label "a priori" is doing in the anti-reductionist's mouth as opposed to its everyday sense, and whether the appeal to children and unreflective adults supports the conclusion the chapter draws from it. Finally, once the passage is corrected, does anything substantive remain of the case for anti-reductionism, or does the correction leave the two sides arguing only about how often testimony happens to be true?
reasoning: |-
  Okay, let me tackle this user's query step by step. They're asking about a passage from a trade book on trust that summarizes the epistemology of testimony, specifically the reductionist vs. anti-reductionist debate. The user has several concerns: whether reductionists really demand case-by-case evidence, why anti-reductionists use "a priori" in a technical sense, and whether the appeal to children supports anti-reductionism. They also want to know if, after corrections, the debate boils down to just how often testimony is reliable.

  First, I need to recall the standard positions in testimony epistemology. Reductionism, tracing back to Hume, argues that testimonial justification requires non-testimonial evidence. But the passage claims reductionists need evidence for each specific speaker on each occasion, which seems too strong. From what I remember, most reductionists allow general background knowledge about testimony's reliability. For example, Elizabeth Fricker allows inductive support from past experiences. So the passage oversimplifies by implying reductionists can't trust strangers at all. That's a point to correct.

  Then there's anti-reductionism linked to Reid. The passage says they claim justification is "a priori." But in philosophy, "a priori" means independent of experience. Reid's view is actually that testimony is a basic source of justification, not derived from other sources. It's defeasible, not unconditional. The passage's phrasing might confuse readers into thinking it's infallible. Also, Reid's "principle of veracity" is innate but calibrated by experience—it's not that we can never check testimony. So the "a priori" label is misleading here; it's more about non-inferential justification.

  The appeal to children and unreflective adults is used to support anti-reductionism. But is this valid? Children do trust testimony without evidence, which seems intuitive. However, reductionists could counter that this trust is pre-rational and only later justified through experience. The user mentioned unease about the reliability claim. Both sides agree reliability is necessary for knowledge, but the core dispute is about the structure of justification—whether it's inferential or not. Correcting the passage should clarify that the debate isn't just about reliability frequency but about how justification works.

  The user also asks if anything substantive remains for anti-reductionism after corrections. Yes, because even with general background knowledge, anti-reductionists argue that testimony provides immediate justification. For instance, when you ask a stranger for directions, you don't consciously base trust on past experiences; you just believe them. That immediacy is key to anti-reductionism. Reductionists might still require some implicit background knowledge, but the disagreement on justification's structure persists.

  I should also address the "a priori" confusion. The everyday sense might mean "without evidence," but technically, it's about justification independent of experience. Reid's view isn't strictly a priori; it's more about default trust that's defeasible. The passage's phrasing makes anti-reductionism seem dogmatic, which isn't accurate.

  In conclusion, the passage has significant simplifications. Correcting them shows that both positions are more nuanced. Reductionists don't need case-by-case evidence, anti-reductionism isn't unconditional, and the child argument has limitations. The substantive debate remains about whether testimony requires inferential justification or if it's a basic source. The user's unease about the reliability focus is valid—the disagreement is deeper than just how often testimony is true.
answer: |-
  Here's a claim-by-claim analysis of the passage from a specialist's perspective in social epistemology, addressing your specific concerns:

  1.  **"Philosophers divide into reductionists and anti-reductionists about testimony."**
      *   **Accept:** This is a standard and accurate framing of the core debate in the epistemology of testimony.

  2.  **"The reductionist line, which goes back to Hume, holds that a hearer's belief is justified only if she has evidence, independent of testimony itself, that this particular speaker is telling the truth on this particular occasion;"**
      *   **Simplification/Rejection:** This is a **significant oversimplification bordering on misrepresentation**.
          *   **Global Reductionism:** The passage describes what's often called *local reductionism* (requiring justification specific to *this* speaker and *this* occasion). However, the dominant reductionist position is *global reductionism*. Global reductionists argue that the justification for testimonial belief ultimately rests on non-testimonial evidence *in general* about the reliability of testimony as a source (e.g., our inductive experience that people are usually truthful, competent, and sincere in everyday contexts). They do **not** necessarily demand *case-by-case* evidence about *each specific speaker on each specific occasion*.
          *   **Hume:** Attributing the strict local view to Hume is debatable. While Hume emphasized the need for inductive confirmation of testimony's reliability, he often spoke about testimony *in general* or *types* of testimony, not necessarily requiring evidence for every single utterance.
      *   **Specialist View:** Reductionists (primarily global) require that testimonial justification be *reducible* to justification based on perception, memory, and inference. This evidence provides inductive support for trusting testimony broadly or certain types of testimony. They **do not** demand impossible case-by-case evidence for strangers. Background knowledge about human psychology, social norms, and past reliable testimony suffices in most everyday cases.

  3.  **"...since collecting such evidence usually means asking other people, the view implies that we can never rationally trust a stranger."**
      *   **Rejection Outright:** This conclusion is **false** based on the corrected understanding of reductionism.
          *   Global reductionism, utilizing broad background knowledge (e.g., "In this society, people giving street directions are usually reliable," or "People generally don't lie about mundane facts without motive"), **absolutely allows rational trust in strangers** in countless ordinary situations. The justification rests on general experience, not investigation of *that specific* stranger.

  4.  **"The anti-reductionist line, which goes back to Reid, holds that belief in testimony is justified a priori, meaning we are entitled to it independently of all experience;"**
      *   **Simplification/Misuse of Term:** This is a **misleading characterization** of the standard anti-reductionist view and misuses "a priori".
          *   **"A Priori":** In philosophy, "a priori" justification means justification independent of *any* particular sensory experience (e.g., logic, math). Anti-reductionists (like Reid, Coady, Burge) **do not** typically claim testimonial justification is *a priori* in this strong sense. They claim it's *non-inferential* and *presumptive* or *default*. We are *prima facie* entitled to believe what we are told *without needing to first infer its reliability from other sources*. This entitlement is a fundamental feature of our cognitive design, learned through our nature as social beings. It's still grounded in our general experience as social creatures but doesn't require a *conscious inferential step* based on that experience for each belief.
          *   **Reid:** Reid argued for innate principles (like a "principle of veracity" and a "principle of credulity") that dispose us to tell the truth and believe others, respectively. These are foundational, but their operation and calibration are shaped by experience. He did *not* claim justification was independent of *all* experience in the *a priori* sense.

  5.  **"...nature installs in us a principle of veracity licensing us to accept what we are told, and the license is unconditional,"**
      *   **Simplification:** While Reid used the language of principles, modern anti-reductionists (like Burge's "Acceptance Principle" or Lackey's "Dualist" view) describe it as a *defeasible entitlement* or *default justification*.
      *   **Rejection:** The license is **not unconditional**. Anti-reductionists universally agree that testimonial justification is **defeasible**. If you have positive reasons for doubt (e.g., the speaker is known to lie, contradicts known facts, seems confused, makes an extraordinary claim), the default entitlement is overridden, and belief is no longer justified. The "principle" establishes a *presumption* of truth, not an absolute guarantee.

  6.  **"...since any attempt to check it would itself have to run through testimony."**
      *   **Accept (with nuance):** This is a key anti-reductionist argument (the "infinite regress" or "global skepticism" argument). To *generally* doubt testimony, you'd need to rely on other testimony (e.g., studies about lying, history books showing unreliability), which you'd then also have to doubt. This highlights the fundamental role testimony plays in building our entire web of beliefs. Reductionists counter that the ultimate base rests on non-testimonial sources like perception, even if testimony is the primary vehicle for *transmitting* vast amounts of knowledge.

  7.  **"Both sides grant that testimony yields knowledge only when it is reliable;"**
      *   **Accept:** This is standard. Knowledge requires true, justified belief. Reliability (the testimony being truthful and the speaker competent) is necessary for the belief to be *true* (a condition for knowledge). Both sides agree unreliable testimony cannot yield knowledge.

  8.  **"what they disagree about is how reliable it actually is."**
      *   **Rejection Outright:** This is a **major oversimplification** that misses the core dispute.
          *   The fundamental disagreement is about the **structure and source of epistemic justification** for testimonial beliefs, **not** primarily the empirical frequency of reliable testimony.
          *   **Reductionist:** Justification requires (often implicit) inferential support from non-testimonial sources (perception, induction) establishing testimony's general or local reliability.
          *   **Anti-Reductionist:** Justification is non-inferential and fundamental; testimony is a basic source of justification like perception, enjoying a default entitlement that doesn't rely on prior justification for its reliability.
      *   They *might* disagree about reliability *in specific contexts* as a consequence of their views, but the core philosophical disagreement is justificatory structure.

  9.  **"Reid's side looks better placed, because nobody in fact checks, and young children believe whatever they are told."**
      *   **Simplification/Mixed:** This appeals to a common argument for anti-reductionism: the *psychological reality* and *developmental priority* of trust.
          *   **"Nobody in fact checks":** True for the vast majority of testimonial beliefs in daily life. Anti-reductionists argue reductionism demands an unrealistic and unsustainable level of constant checking incompatible with how we actually form beliefs. Reductionists counter that the "checking" is usually implicit reliance on background knowledge, not active investigation.
          *   **"Young children believe whatever they are told":** True empirically. Anti-reductionists argue this shows trust is a fundamental, natural cognitive stance. Reductionists counter that children's trust is *pre-rational* or *pre-justificatory*; they learn justification *through* experience (e.g., learning mom is usually right, learning that some people lie). Their initial trust is necessary for learning but doesn't constitute fully justified belief until calibrated by experience (a view sometimes called "credulist reductionism").
      *   **Specialist View:** The appeal to children and unreflective acceptance is a **strong psychological and phenomenological point** supporting anti-reductionism's claim that testimony functions as a *basic* source. It highlights the implausibility of demanding *explicit* inferential justification for every belief. However, reductionists can accommodate this by emphasizing *implicit* reliance on background knowledge. It doesn't *prove* anti-reductionism is correct, but it makes reductionism look psychologically unrealistic if interpreted too strictly (as the passage initially does).

  **Summary of Key Corrections:**

  1.  **Reductionism:** Primarily *global*, not local. Relies on general background knowledge about testimony's reliability, **not** case-by-case evidence. **Does allow rational trust in strangers**.
  2.  **Anti-Reductionism's "A Priori":** Misleading. Justification is *non-inferential*, *presumptive*, or *default*, not *a priori* (independent of all experience). It's grounded in our nature as social epistemic agents.
  3.  **The License:** **Defeasible, not unconditional**. Defeaters override the default entitlement.
  4.  **Core Disagreement:** About the **structure of justification** (inferential reduction vs. non-inferential default entitlement), **not** primarily the empirical reliability rate of testimony.
  5.  **Children/Unreflective Trust:** Supports anti-reductionism's *plausibility* by matching psychological reality, but doesn't decisively refute sophisticated reductionist accounts using implicit background knowledge.

  **Does a Substantive Case for Anti-Reductionism Remain After Correction?**

  **Absolutely, yes.** Correcting the misrepresentations doesn't reduce the debate to a mere empirical tally of reliable vs. unreliable testimony. The core philosophical disagreement remains robust:

  *   **Anti-Reductionist Strength:** The argument from psychological reality and the necessity of testimony as a foundational source remains powerful. The "infinite regress" worry highlights the deep dependence of our knowledge on testimony. Anti-reductionism offers a more naturalistic account of how we *actually* acquire the vast majority of our beliefs – we simply accept them unless we have a reason not to. It treats testimony as a fundamental epistemic source on par with perception, reflecting our deeply social nature. The burden of proof arguably lies with the reductionist to show why this default trust needs grounding in other sources.
  *   **Reductionist Strength:** Reductionists maintain that justification *must* ultimately trace back to non-testimonial sources (perception, inference) to avoid circularity or arbitrariness. They argue that background knowledge *is* doing the justificatory work implicitly, even if we aren't consciously aware of it. They can handle defeaters more naturally as part of the same inductive framework. Sophisticated reductionists can explain trust in strangers via general background knowledge.

  **Conclusion:** The passage contains significant oversimplifications and one outright falsehood (reductionism forbids trusting strangers). Correcting these reveals a complex and ongoing debate about the fundamental architecture of epistemic justification concerning testimony. Anti-reductionism's core case – that testimony provides a unique, non-inferential, default justification essential for human knowledge acquisition – retains its substance and force against reductionism's claim that all justification must ultimately reduce to perception and inference. The debate centers on the nature of justification itself, not just the frequency of truth-telling.
