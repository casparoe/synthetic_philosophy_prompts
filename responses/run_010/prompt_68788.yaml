prompt: |-
  A public history museum where I work is preparing an exhibition on how historians distinguish a well-supported revisionist claim from a pseudohistorical one. The curators have decided against a gallery of famous bad claims; they want visitors to leave able to apply a rubric themselves. The draft instrument we have been circulating scores any claim on six indicators, one point each:

  (1) The claim cannot be formulated in a way that specifies what evidence, if it turned up, would count against it.
  (2) Anomalies are accumulated without reference to base rates — every unexplained inscription, out-of-place artifact, and gap in the record is entered as positive evidence, with no comparison to the amount of unexplained material the field contains in general.
  (3) Its proponents address a general audience and do not engage the technical objections raised in the specialist literature.
  (4) The claim becomes more convincing to its adherents as further anomalies are attached to it, rather than being constrained by them.
  (5) Its proponents have a stake — professional, national, or ideological — in the claim's being true.
  (6) Its core has remained essentially unchanged for decades while the counter-evidence around it has accumulated.

  These are loosely adapted from the falsifiability and research-programme criteria in philosophy of science; the exhibition text will not attribute them to any particular author, and no source apparatus is needed from you.

  My task is to advise which indicators survive. Please do the following.

  First, rank the six by discriminating power — how reliably each separates pseudohistory from legitimate revisionism that happens to be unfashionable, in both directions. Assign each a score from 0 (no better than a coin flip) to 1 (near-decisive), arrange them in tiers, and give one sentence of justification per indicator.

  Second, for each indicator supply the most damaging counterexample you can construct: either a genuine historical claim the indicator would wrongly flag, or an acknowledged pseudohistory it would let through. State which of the two failure modes that indicator is more exposed to, and if in your judgment the false-positive rate on real scholarship exceeds the true-positive rate on pseudohistory, say so explicitly and mark the indicator for deletion rather than mere down-weighting.

  Third, answer two structural questions: should the rubric be scored conjunctively, so that a claim counts as pseudohistorical only if it trips several indicators at once, or additively as drafted; and which single indicator, if struck, would most weaken the instrument?

  Fourth, propose at most one replacement indicator to fill the gap you identify, and subject it to the same counterexample test you applied to the original six.

  Finally, run your finished rubric on the two cases the curators are already quarrelling over — the scholarly reception of the Vinland sagas' account of a Norse presence in North America in the decades before the excavations at L'Anse aux Meadows, and Fomenko's New Chronology, which applies statistical methods to ancient astronomical records and to recurrent patterns of dynastic names to argue that events attributed to Rome, Greece, and Egypt actually occurred in the Middle Ages. Report the score each case receives and whether you think that score is correct. If the rubric misfires on either case, identify the indicator responsible and say what the misfire reveals about the rubric as a whole.
reasoning: |-
  Okay, let me approach this systematically. The museum needs a practical tool to help visitors distinguish pseudohistory from legitimate revisionism. I need to evaluate each of the six proposed indicators rigorously.

  First, I'll assess discriminating power by considering how well each indicator flags pseudohistory while avoiding false positives against unconventional but valid scholarship. For example:
  - Indicator 1 (falsifiability) seems strong because pseudohistory often avoids testable predictions
  - But Indicator 5 (stake in outcome) might be weaker since many legitimate historians have ideological motivations

  For counterexamples, I'll construct scenarios where indicators fail:
  - A valid claim that appears unfalsifiable due to evidentiary gaps
  - A pseudohistory that engages specialists superficially to bypass Indicator 3

  The structural questions require analyzing whether conjunctive scoring (multiple flags required) would reduce false positives compared to the current additive approach. I suspect conjunctive might be better given the imperfect nature of individual indicators.

  Considering replacements, I'm leaning toward proposing an indicator about selective evidence use - pseudohistory often cherry-picks while ignoring contradictory data. This would need testing against cases like valid scholarship that initially appears selective due to fragmentary records.

  Finally for the test cases:
  - Vinland sagas pre-excavation: Should score low (legitimate debate)
  - Fomenko: Should score high (pseudohistory)
  If discrepancies appear, like Vinland scoring moderately due to Indicator 5 (nationalist stake), I'll note how the rubric might over-penalize emerging scholarship.

  Throughout this, I'm mindful that the rubric must be teachable to museum visitors while remaining philosophically sound. The counterexample tests will be crucial for identifying where indicators need refinement or replacement.
answer: |-
  Here is a comprehensive evaluation of the proposed rubric, incorporating your requested analysis, counterexamples, structural recommendations, and application to test cases:

  ### I. Ranking by Discriminating Power (0-1 Scale)
  **Tier 1: Strong Discriminators (0.8-0.9)**  
  - **(6) Core unchanged despite counter-evidence (0.9)**: Pseudohistory fossilizes, while revisionism evolves with evidence.  
  - **(1) Unfalsifiable formulation (0.85)**: Legitimate claims specify disconfirming evidence; pseudohistory immunizes itself.  
  - **(4) Anomalies increase conviction (0.8)**: Rigorous scholarship treats anomalies as problems to resolve, not proof.  

  **Tier 2: Moderate Discriminators (0.6-0.7)**  
  - **(2) Ignores base rates (0.65)**: Common in pseudohistory but also affects early-stage legitimate research.  
  - **(3) Avoids specialist engagement (0.6)**: Strong signal but some valid outsider-work targets general audiences first.  

  **Tier 3: Weak Discriminator (0.4)**  
  - **(5) Proponents have stake (0.4)**: Frequent in *both* pseudohistory (e.g., nationalist myths) and legitimate revisionism (e.g., decolonial scholars).  

  ---

  ### II. Counterexamples and Failure Modes  
  1. **Indicator 1 (Unfalsifiability)**  
     - *False Negative*: Velikovsky's *Worlds in Collision* (specified planetary orbits as disproof; still pseudoscience).  
     - *False Positive*: Early claims of Pre-Clovis settlement in Americas (lacked falsifiable evidence until tool discoveries).  
     - **Failure Mode**: More exposed to false negatives; lets through pseudohistory with token falsifiability.  

  2. **Indicator 2 (Ignores Base Rates)**  
     - *False Positive*: Initial studies of the Antikythera Mechanism (gaps misinterpreted due to lack of comparative ancient tech base rates).  
     - *False Negative*: "Crystal Skulls" pseudohistory (uses statistical claims about quartz sourcing).  
     - **Failure Mode**: Balanced failure rates; retain but down-weight.  

  3. **Indicator 3 (Avoids Specialist Literature)**  
     - *False Positive*: Howard Zinn’s *A People’s History* (written for public; engaged scholarly critics in later editions).  
     - *False Negative*: Graham Hancock (cites specialists selectively to dismiss objections).  
     - **Failure Mode**: More exposed to false negatives; pseudohistory often simulates engagement.  

  4. **Indicator 4 (Anomalies Increase Conviction)**  
     - *False Positive*: Plate tectonics theory (1912–1950s anomalies strengthened Wegener’s resolve before validation).  
     - *False Negative*: Flat Earth theories (dismiss new evidence as conspiracies).  
     - **Failure Mode**: Low false-positive rate; highly reliable.  

  5. **Indicator 5 (Proponents Have Stake)**  
     - *False Positive*: Afrocentrist scholars re: Egyptian achievements (legitimate revisionism with ideological stakes).  
     - *False Negative*: Fomenko (academic mathematician; no overt stake).  
     - **Failure Rate**: **False positives exceed true positives** → **DELETE**. Stakes pervade all scholarship; poor discriminator.  

  6. **Indicator 6 (Core Unchanged Despite Evidence)**  
     - *False Positive*: Marxist historical materialism (core tenets persistent but debated within academia).  
     - *False Negative*: Holocaust denial (adapts superficially while core denial remains).  
     - **Failure Mode**: Rare false positives; near-decisive for pseudohistory.  

  ---

  ### III. Structural Recommendations  
  - **Conjunctive vs. Additive**: Use **modified additive scoring** (threshold of 3+ flags indicates pseudohistory). *Why*: Conjunctive scoring misses borderline cases; additive alone over-penalizes niche revisionism.  
  - **Critical Indicator**: If struck, **Indicator 6** (core unchanged) most weakens the rubric. It captures pseudohistory’s resistance to paradigm shifts.  

  ---

  ### IV. Replacement Indicator  
  - **Proposed Replacement**:  
    **"Selectively dismisses methodological norms (e.g., carbon dating, textual criticism) without rigorous justification."**  
    - *Counterexample Test*:  
      - False Positive: Early critics of radiocarbon dating (legitimate concerns about calibration).  
      - False Negative: Young Earth Creationism (rejects multiple dating methods but cites "flaws" in technical terms).  
    - **Verdict**: Strong discriminator (0.75); false positives rare in mature scholarship.  

  ---

  ### V. Test Case Applications  
  **1. Vinland Sagas (Pre-L’Anse aux Meadows)**  
  - **Score**: 1/6 (Only Indicator 5 weakly applicable: nationalist stakes in Nordic scholarship).  
  - **Verdict**: **Correct**. Legitimate revisionism: anomalies (saga inconsistencies) were debated, core claims evolved with archaeology.  

  **2. Fomenko’s New Chronology**  
  - **Score**: 5/6 (Fails only Indicator 5, which is deleted; hits 1,2,3,4,6 and replacement).  
    - (1) Unfalsifiable: Redates evidence rather than accepting disproof.  
    - (2) Ignores base rates: Treats name repetitions as anomalies without medieval comparators.  
    - (3) Avoids specialists: Uses mathematics to bypass historical methods.  
    - (4) Anomalies = proof: Each "pattern" reinforces the theory.  
    - (6) Core unchanged: Despite archaeological/genetic counter-evidence.  
    - Replacement: Rejects stratigraphy/textual criticism unjustifiably.  
  - **Verdict**: **Correct**. Pseudohistory clearly flagged.  

  **Rubric Misfire**: None. Vinland’s low score and Fomenko’s high score align with scholarly consensus.  

  ---

  ### Final Rubric (Recommended)  
  1. Unfalsifiable claim formulation  
  2. Anomalies without base rates  
  3. Avoids specialist engagement  
  4. Anomalies increase conviction  
  6. Core unchanged despite evidence  
  **Replacement**: Selective dismissal of methods  
  - **Scoring**: 3+ flags = pseudohistorical.  

  **Strengths**: Balanced, minimizes false positives, covers Fomenko-style technical pseudohistory.  
  **Weakness**: May flag radical but rigorous scholarship (e.g., early feminist history). Contextual exhibition text is essential.
