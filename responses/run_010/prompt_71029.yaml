prompt: |-
  My roommate is a hospital social worker, and we argued for most of a Saturday night about a practice she administers and I cannot make sense of. I would like the practice analyzed rather than the argument adjudicated, so let me describe it as concretely as I can, in her terms rather than mine.

  The setting is advanced dementia. A patient signed documents years earlier, while competent: a health care proxy naming a family member as agent, and an instructional directive refusing, in the event of severe and irreversible dementia, hospital transfer, resuscitation, dialysis, antibiotics for aspiration pneumonia, and — in the version she says she sees most often — artificial nutrition and hand-feeding. Many of these forms also include a short free-response section, and she told me something that struck me: the ethics committee pays far more attention to that paragraph than to the checkboxes. It is where the patient writes, in their own hand, what made their life worth living, and says that a life without memory of their children, or without recognition of their own name, would not be a life they would want continued.

  Four further features of the protocol matter for what I am asking.

  1. When the time comes, the directive governs. Staff are expected to follow it even when the patient is visibly content — pleased by a visit, delighted by ice cream, laughing at the television — and even when the thing that will kill her is a readily treatable infection.
  2. Surrogates are coached in a fixed order of resort: first, what the patient said or wrote; second, what the patient would have wanted, inferred from her values and character; and only third, and only when the first two are empty — for an infant, or someone profoundly disabled from birth — her best interests, understood as her welfare from the inside.
  3. At the same time, for every other purpose, the institution treats the demented patient as a full subject of welfare. Pain must be assessed and treated; her distress is taken at face value; she is protected against neglect; a relative who failed to feed her would be reported to the authorities.
  4. Staff are also told to seek the patient's assent before acting — to read her acceptance or resistance of a spoon, a needle, a transfer — which everyone concedes has no legal standing and which is, in practice, honored.

  My friend's position was that the directive is the patient's own voice and that ignoring it silences her. Mine was that we are allowing a piece of paper, written by someone who on any ordinary description no longer exists, to override the interests of a person who is here, happy, and incapable of consenting to anything; and that the same sequence of acts performed by a stranger we would call killing. Neither of us moved. Here is what I want from you instead.

  What account of the self does this practice presuppose? Specifically: does it assume that a person is something like the continuing author of a story — that the self persists as the source of a narrative and can bind later stages of the organism by what it once wrote — and if so, how much psychological continuity does that require, given that the directives are enforced precisely when memory, recognition, and the capacity to carry the story forward have been destroyed? Does the practice treat the person as partly located outside her own skull, in the document and in her family's testimony about her values, and if so, what would have to be true of selves for that to be more than a figure of speech?

  Which rival accounts does it rule out outright, and which does it merely sit awkwardly alongside? I mean accounts on which what matters is the stream of experience, or the living human animal, or the present capacity to care about anything at all.

  Then tell me whether there is a deflationary reading that needs no such metaphysics: autonomy as the earlier self's right to dispose of what happens to her body, or the ordering in (2) as a rule about burden of proof and the reliability of evidence rather than about identity, or a straightforwardly consequentialist rule about what happens when documents stop being trusted. Say which of these genuinely assume less, and whether any of them can explain the committee's preference for the handwritten paragraph over the checkboxes.

  Is the structure internally consistent? I am most exercised by three joints: the ranking in (2), which makes experiential welfare a last resort rather than the default, and thereby seems to give narrative selves less protection than beings who have no story; the coexistence of (1) and (3), in which one body is a rights-bearing subject of experience for purposes of protection and a narrative author for purposes of ending treatment; and (4), assent that is always sought and never decisive, which seems to say that present experience matters morally but not enough to matter.

  Finally, distinguish what the practice strictly requires from what it merely fits comfortably, and identify which features are load-bearing and which are decoration — places where two or three incompatible theories of the self would generate the identical protocol. And describe what would actually have to change — the form, the ordering, the staff training, the evidence needed to establish that a directive applies — under two replacements: that the welfare of the experiencing subject now is the only thing that counts, and that the demented patient is a numerically different person who has succeeded the author of the directive, inheriting the body without inheriting her obligations. On the second, note that at least one country treats a written request made while competent as sufficient authorization for euthanasia once dementia has advanced past the point of confirmation, while other legal systems treat the same act as homicide; tell me which replacement would be easier to legislate and which would be easier for a family to live with.

  I would like the implicit theory stated up front as a compact thesis, then the analysis. Aim for something I could hand my roommate without her feeling that the practice she has spent a career administering was written off by someone who has never stood at the bedside.
reasoning: |-
  Okay, the user has presented a deeply complex ethical and philosophical scenario regarding advanced care directives in dementia care. This isn't just an abstract question - it's tied to a real-life argument with their social worker roommate, so the emotional stakes are high. The user wants analysis, not arbitration, but I sense they're also seeking validation that their concerns have intellectual merit.

  First, I need to unpack the practice as described: binding advance directives enforced even when the current demented patient appears content. The key tensions are between the past competent self's written wishes versus the present experiencing self's apparent welfare. The institutional protocol has four features that create philosophical friction points.

  The core question is about the implicit theory of selfhood here. It seems to presuppose a narrative self that persists beyond cognitive capacity - that the person is fundamentally the author of their directive. But this raises problems when the very capacities that enable authorship (memory, continuity) are destroyed. The handwritten paragraph being prioritized over checkboxes suggests it's not just about legal authority but about capturing the person's essence.

  Alternative theories clash sharply: if we see the self as the current stream of experience, this practice looks barbaric. If we see it as the biological organism, we'd prioritize basic care. The "different person" theory (where the demented patient is successor to the directive-writer) might explain the legal contradictions in euthanasia laws internationally.

  The user's three consistency worries are spot-on:
  1. Why is experiential welfare last in the hierarchy? 
  2. How can the same entity be both rights-bearing subject and narrative author? 
  3. What's the point of seeking assent that's deliberately non-decisive?

  I should acknowledge the practical wisdom embedded in the practice too - the horror of being trapped in dementia is precisely what the directive aims to prevent. The handwritten paragraph matters because it reveals what "life worth living" meant to that specific person, beyond generic preferences.

  For replacements:
  - A pure welfare model would require scrapping advance directives entirely, which most societies reject as too paternalistic.
  - The "successor person" model creates legal nightmares about body ownership and obligation inheritance.

  The roommate's position reflects standard bioethics, but the user's discomfort reveals genuine philosophical fissures. I'll present this as two valid perspectives grounded in different priorities, not as one being "correct." The analysis should honor both the social worker's clinical wisdom and the user's ethical rigor.
answer: |-
  Here is a compact thesis capturing the practice's implicit theory of self, followed by a detailed analysis addressing your questions:

  **Core Thesis:** The practice presupposes that a person is a **diachronic narrative agent** whose identity and morally decisive interests persist despite radical cognitive discontinuity. The authentic self resides in enduring values and life-defining commitments expressed while competent, granting authoritative priority to past directives over present experiential states. The demented patient is the *same person* as the author of the directive, but in a state of profound incapacity where her true will is expressed *only* through the documented prior self.

  ### Analysis Addressing Your Questions

  #### 1. **Account of the Self Presupposed**
      - **Diachronic Narrative Self:** The practice views a person as an entity extended in time, defined by a coherent life story authored through values, relationships, and choices. Identity hinges on psychological connectedness to core values ("what made life worth living"), not transient cognitive states or experiential content.
      - **Minimal Psychological Continuity Required:** The theory requires *only* biological continuity (same living organism) and *narrative continuity* (the directive embodies the culmination of the life story). Memory loss and inability to "carry the story forward" are irrelevant; the *ending* of the story was authored in the directive. The handwritten paragraph is crucial because it reveals the *why* behind the checkboxes – the core values that define the person’s identity and conception of a meaningful life.
      - **Self "Outside the Skull":** Yes, the practice treats the self as partially externalized. The directive + family testimony act as **constitutive prosthetics** for the self when the brain can no longer sustain narrative agency. This is more than metaphor: it posits that authentic personhood depends on access to one’s enduring values *as expressed to others*. Without these external records/testimony, the demented individual’s identity and will are deemed inaccessible or obscured.

  #### 2. **Rival Accounts Ruled Out or in Tension With**
      - **Ruled Out:**
          - **Present-Attached Welfare Subject:** The view that only current experiential welfare matters (e.g., pleasure, absence of pain, contentment) is explicitly overridden by features (1) & (2). A happy, ice-cream-enjoying patient is denied treatment based on past directives.
          - **Human Animal View:** The idea that the morally significant entity is simply the living human organism demanding basic care/protection clashes with (1) & (2). Withholding antibiotics/hand-feeding contradicts biological preservation.
      - **Awkward Coexistence:**
          - **Capacity-to-Care View:** The claim that moral status depends on *current* capacity to care about anything struggles with (3) & (4). Pain is treated (acknowledging present experience matters), but refusal of life-saving treatment based on past values ignores present attachments. (4) highlights this tension: seeking assent acknowledges present subjectivity, but its non-decisiveness subordinates it to the past self.

  #### 3. **Deflationary Readings & Their Limits**
      - **Autonomy as Bodily Disposal Right:** The directive could be seen as a property right over one's future body. This *avoids metaphysics of identity* but fails to explain:
          - Why *values* (handwritten paragraph) matter more than specific instructions (checkboxes). Property rights focus on control, not the narrative meaning behind choices.
          - Why the surrogate hierarchy (2) prioritizes inferred values ("what patient would want") over best interests. Property rights don't require inferring hypothetical wishes.
      - **Burden of Proof/Evidence Reliability:** Ordering (2) could be a practical rule: Written directives are the *best evidence* of wishes; best interests are a fallback when evidence is absent. This explains the hierarchy *technically*. However, it struggles with:
          - The *moral weight* given to enforcing directives against apparent present welfare (1).
          - The committee's focus on the *handwritten paragraph* – its value is narrative/expressive (revealing identity-defining values), not just evidentiary reliability. A checkbox is equally reliable evidence of a choice.
      - **Consequentialist Trust Maintenance:** Upholding directives ensures societal trust in the system, encouraging people to plan care. This justifies (1) pragmatically. But it cannot explain:
          - The depth of commitment to directives *even when distressing to families/staff* or seemingly contrary to obvious welfare.
          - Why the handwritten paragraph is prioritized – its content doesn't make the directive more legally enforceable or trustworthy than a checkbox; its value is intrinsic to understanding the *person's* reasons.
      - **Verdict:** The "Burden of Proof" reading assumes the least metaphysics *on the surface*, but the committee's preference for the handwritten paragraph reveals a deeper commitment to the *narrative self*. The expressive content of "why" life matters is irreplaceable evidence of the *person's identity and values*, not just their choices. A purely deflationary account cannot fully capture this.

  #### 4. **Internal Consistency & Tensions**
      - **(2) Welfare as Last Resort:** This *is* consistent with the core thesis: The narrative self deserves priority *because* it possesses autonomy and values. Beings without a narrative (infants) *cannot* have prior wishes, leaving best interests as the only guide. It protects the narrative self *on its own terms* (respecting its preemptive refusal), not by valuing its current welfare less.
      - **Coexistence of (1) & (3):** This reflects the **dual status** of the patient under the theory:
          - *As Narrative Author:* For treatment decisions governed by the directive’s scope, she is the past self whose authority is supreme.
          - *As Experiencing Subject:* For all other interactions (pain management, protection), she is a vulnerable being owed compassion and basic care. The body/mind *hosts* the enduring person but suffers *now*. The practice sees no contradiction: Protecting the vulnerable body respects the person who inhabits it, while honoring the directive respects her authentic will.
      - **(4) Assent Sought but Not Decisive:** This navigates the dual status. Seeking assent:
          - Respects the *present subject* by avoiding force where possible, minimizing distress.
          - Acknowledges the *body's* experience.
          - Its non-decisiveness stems from the core thesis: The *narrative self* is the only competent moral agent here. Her prior refusal stands regardless of the demented subject's current reaction. It signals that present experience *matters* (morally relevant to avoid suffering), but the *will* expressed by the narrative self matters *more*.

  #### 5. **Load-Bearing vs. Decorative Features & Replacement Scenarios**
      - **Load-Bearing (Essential to Core Thesis):**
          - The binding force of advance directives overriding present welfare (1).
          - The surrogate hierarchy prioritizing prior expressed wishes/inferred values (2).
          - The focus on the handwritten paragraph revealing identity-defining values.
          - The distinction between treatment refusal (governed by directive) and comfort care/protection (governed by present welfare) (3).
      - **Compatible/Decorative (Could fit other theories):**
          - Seeking assent (4) – Could fit a welfare model (minimize distress) or a weak narrative view (respecting current agency where possible).
          - Using family testimony for inference in (2) – Compatible with evidence-based or best interest models.
      - **Replacements:**
          - **Replacement 1: Sole Primacy of Current Experiential Welfare:**
              - **Changes Required:** Directive becomes merely *advisory*. Surrogates must *override* it if patient seems content. Form focuses *only* on medical choices, not values/narrative. Ordering (2) reversed: Best interests (current welfare) first, then inferred wishes, then prior instructions. Staff training emphasizes assessing *current* quality of life. Handwritten paragraph irrelevant; checkboxes sufficient if evidence of choice. Withholding antibiotics for a happy patient becomes neglect/homicide.
              - **Legislation/Ease:** Easier to *legislate* (clearer focus on preventing perceived suffering). Harder for *families* – Forces agonizing real-time quality-of-life judgments, undermines planning security, feels like betraying loved one's wishes.
          - **Replacement 2: Demented Patient as a Different Person:**
              - **Changes Required:** Directive authorizes *euthanasia* at a defined stage (like Dutch model), ending the "successor" person's life legally. Or, directive becomes *void* upon severe dementia; new person's best interests govern. Form needs clear "trigger" definition. Ordering (2) collapses; only best interests matter for the new person. Staff training: Recognize two distinct entities. Evidence focuses on *diagnosis* confirming "new person" status. Hand-feeding refusal might be ignored; antibiotics given unless *current* person suffers.
              - **Legislation/Ease:** *Legally complex* - Defining the "personhood threshold" is contentious (memory? recognition? feeding ability?). The euthanasia path is legislated in few places (Netherlands) precisely due to this difficulty. For *families*, euthanasia might offer closure aligned with past wishes but requires accepting active killing. The "void directive" path might feel like abandoning the prior self but avoids prolonging a life the "new person" might enjoy.

  ### Conclusion for Your Roommate
  This practice rests on a profound commitment: **The person you cared for, who feared dementia and wrote that directive, is still present.** We honor her courage and foresight by treating her documented values as her enduring voice. The handwritten paragraph isn't just evidence; it's her essence, telling us what "she" truly is and what she cannot bear to become. The ice cream smile belongs to a body experiencing a moment, but the refusal belongs to *her* – the author of her life story, who deserves to have its final chapter written as she dictated. We protect the vulnerable body she inhabits (3,4) precisely *because* it is hers, while refusing treatments (1) that would imprison her in a state she equated with death-in-life. The hierarchy (2) isn't about loving her less than an infant, but about respecting her unique capacity to tell us who she is. This view demands we hold two truths: the *person* persists, but her *capacity* to speak is gone. Her directive is the bridge. The tensions you feel are real – they reflect the tragedy of dementia itself – but the protocol aims for fidelity to the person who existed before the disease took hold. It doesn't write off the suffering at the bedside; it seeks to prevent a deeper suffering the patient herself foresaw and named.
