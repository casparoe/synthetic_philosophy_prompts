answer: |-
  Below is a sorting tree designed to guide students through the logical space of non-human causes in history, starting from the shared commitment that the 1815 Tambora eruption is historically relevant. The tree uses concrete, theory-neutral questions to sort students into eight named positions. Each question is answerable without prior knowledge of the labels, focusing on conceptual distinctions like causality, agency, temporality, and mediation. The tree is built for clarity and fits on one page, with seven key questions.  

  ---

  ### **Sorting Tree: Non-Human Causes in History**  
  *Start here: You accept that the 1815 Tambora eruption is relevant to explaining events in 1816–18.*  

  1. **Does the non-human factor’s impact depend primarily on how humans interpret or symbolize it?**  
     - **Yes** → The factor acts through cultural meanings (e.g., omens, prophecies, or panics). Go to position: **Meaning-Mediation View** (e.g., Tambora only matters through the famines as "divine punishment").  
     - **No** → Its effects are material, regardless of interpretation. Go to 2.  

  2. **Is the non-human factor a discrete *event* (e.g., eruption, epidemic) or a long-term *structure* (e.g., climate zone, disease pool)?**  
     - **Event** → Effects unfold in a short, bounded timeframe. Go to 3.  
     - **Structure** → Effects unfold over centuries. Go to 6.  

  3. **(For events) Does the factor actively *cause* outcomes, or does it merely *enable/constrain* them?**  
     - **Cause** → It directly produces outcomes (e.g., smallpox *kills* populations). Go to 4.  
     - **Enable/constrain** → It creates possibilities/limits without determining outcomes (e.g., D-Day weather enables/disables landings). Go to position: **Possibilism** (e.g., weather on D-Day is a condition for action, not a cause of victory).  

  4. **(For causal events) Are its effects so overwhelming that they override human agency?**  
     - **Yes** → Humans have little power to adapt or resist. Go to position: **Hard Environmental Determinism** (e.g., 536 dust veil *causes* famine; no escape).  
     - **No** → Human choices/adaptations shape outcomes. Go to 5.  

  5. **(For non-deterministic causal events) Does the factor have "agency"—acting with force *beyond* simple cause/effect?**  
     - **Yes** → It is an active participant in networks (e.g., smallpox as a "conquistador"). Go to position: **Actor-Network "Actant" View** (e.g., smallpox co-shapes conquests).  
     - **No** → It is one variable among many, with no special "will" or power. Go to position: **Disease-History View** (McNeill/Crosby style; e.g., smallpox is a cause, but context determines impact).  

  6. **(For structures) Does the structure *determine* societal outcomes, or does it *interact* with human choices?**  
     - **Determine** → It sets inevitable paths (e.g., geography dictates destiny). Go to 7.  
     - **Interact** → It shapes but does not dictate outcomes. Go to position: **Braudelian Long-Durée Structural View** (e.g., Little Ice Age frames the 17th-century crisis but doesn’t cause it).  

  7. **(For deterministic structures) Is the structure’s power rooted in *geography* or *biology*?**  
     - **Geography** → Luck of location/resources drives history. Go to position: **Diamond-Style Geographic Luck** (e.g., continents shape development).  
     - **Biology** → Disease/ecology creates systemic advantages/disadvantages. Go to position: **Deflationary View** (e.g., labor scarcity post-1348 is a variable, not an actor; "climate is context, not cause").  

  ---

  ### **Key for Named Positions**  
  - **Meaning-Mediation View**: Non-human factors act only through human interpretation (e.g., famines as omens).  
  - **Possibilism**: Non-human factors enable/constrain choices but don’t cause outcomes (e.g., D-Day weather).  
  - **Hard Environmental Determinism**: Non-human factors overpower human agency (e.g., 536 dust veil).  
  - **Actor-Network "Actant" View**: Non-humans are co-actors in networks (e.g., smallpox as an "ally" of Cortés).  
  - **Disease-History View**: Biological factors are causes, but mediated by society (McNeill/Crosby; e.g., disease in Mexico).  
  - **Braudelian Long-Durée Structural View**: Structures frame human action over centuries (e.g., Little Ice Age).  
  - **Diamond-Style Geographic Luck**: Geography determines long-term outcomes (e.g., continental axes).  
  - **Deflationary View**: Non-human factors are background variables, not actors (e.g., post-1348 labor scarcity).  

  ---

  ### **Empty Combinations and Why**  
  1. **"Meaning-Mediation + Hard Determinism"**: Incoherent. If effects *depend* on interpretation (Q1), the factor cannot *override* agency (Q4).  
  2. **"Actor-Network + Deflationary View"**: Unattractive. Actor-network requires agency (Q5), while deflationary denies it (Q7).  
  3. **"Braudelian + Diamond-Style"**: Empty. Braudel rejects determinism (Q6: "interact"), while Diamond requires it (Q6: "determine").  
  4. **"Possibilism + Hard Determinism"**: Incoherent. Possibilism denies causality (Q3: "enable"), determinism requires it (Q3: "cause").  

  ---

  ### **Leaves the Tree Cannot Separate**  
  - **Disease-History View vs. Actor-Network View**: Both can describe biological events (e.g., smallpox) similarly. The tree sorts them by "agency" (Q5), but in practice, McNeill/Crosby (disease-history) and Latour (actor-network) overlap when disease is framed as an active force.  
  - **Deflationary View vs. Possibilism**: Both treat non-human factors as non-causal conditions. The tree separates them by temporality (event vs. structure), but conceptually, both minimize causal power.  

  ---

  ### **Where the Tree is Most Likely Wrong**  
  **Weak Branch**: Q3 (Cause vs. Enable/constrain) collapses under pressure.  
  - **Why?** The line between "cause" and "enable" is fuzzy. For example, labor scarcity post-1348 *caused* wage rises (Q3: cause) but also *enabled* peasant mobility (Q3: enable). This forces arbitrary choices.  
  - **What would redraw it?**  
    - **Argument**: William H. Sewell’s *Logics of History* shows "events" and "structures" are intertwined; a factor can be both cause and enabler.  
    - **Historical work**: Mark Overton’s *Agricultural Revolution in England* demonstrates how climate (structure) and famine (event) interact, blurring Q2 and Q3.  
    - **Redraw**: Merge Q2 and Q3 into one node: "Is the factor’s role *causal* (produces change) or *conditional* (sets parameters)?" Then split based on temporality.  

  **Other Pressure Points**:  
  - Q7 (geography vs. biology) is arbitrary for cases like the Little Ice Age (both climatic and biological effects). J. R. McNeill’s *Mosquito Empires* would challenge this by showing disease and geography as intertwined.  
  - Q1 (interpretation) assumes a clear material/symbolic split. Keith Thomas’s *Religion and the Decline of Magic* argues that material crises (famine) *produce* interpretations (omens), making mediation unavoidable.  

  This tree simplifies complex debates but offers a starting point for discussion. Revise it when students find cases that defy binary sorting (e.g., the weak D-Day case challenging Q3).
