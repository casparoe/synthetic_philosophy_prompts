prompt: |-
  I cover science and ideas for a general-interest outlet, which means about one story a month on some new evolutionary-psychology result and about the same number of emails telling me it's a just-so story. The phrase seems to be doing very different jobs for different people -- sometimes "unfalsifiable," sometimes "untested," sometimes "the trait might not be an adaptation at all," sometimes just "the author is a Victorian in a lab coat." Before I write the piece that sorts this out, can you give me a menu?

  Separate the distinct precise claims "just-so story" can be making about an evo psych explanation -- post-hoc fitting to any outcome, no independent evidence, no way to test the historical sequence as opposed to the present-day correlation, failure to rule out byproducts/drift/inherited baggage, smuggling todays values into the Pleistocene, an under-specified picture of the ancestral environment -- and for each say whether it's a trivial truth about all historical science, a substantive and fair charge, or just false.

  Two things I especially need. First, which of the readings survive the retreat I keep seeing: a critic dismisses a hypothesis, an experiment later confirms the effect, and the critic says a real effect doesn't make the adaptive story any better. Second, whether the standard comeback -- that everything from plate tectonics to dinosaur parenting was once just a story about the past -- works against all those readings or only some of them, and what a charge would have to say to survive it.
reasoning: |-
  Okay, the user is a science writer covering evolutionary psychology for a general audience. They get about one story a month on new evo psych findings and just as many emails calling those stories "just-so stories." They need to unpack what critics mean by that term because it seems to carry different meanings. Their goal is to write a piece clarifying these criticisms and whether they hold water.

  First, I need to list the distinct claims behind "just-so story." The user provided several: post-hoc fitting, no independent evidence, untestable historical sequences, failure to rule out alternatives (like byproducts or drift), imposing modern values on ancestral environments, and vague ancestral environment descriptions. For each, I have to categorize whether it's a trivial truth of historical science, a fair criticism, or just false.

  The user also has two specific needs. First, they want to know which criticisms remain valid even after an effect is experimentally confirmed. For example, if a study later confirms that a behavior exists, does that validate the adaptive story? Critics might say no, because the effect could stem from other causes, not adaptation. So criticisms about failing to rule out alternatives or untestable sequences might still hold.

  Second, they ask about the common defense comparing evo psych to historical sciences like plate tectonics. Which criticisms does this defense counter? The "trivial truth" ones—like post-hoc fitting or untestable sequences—are inherent in historical sciences. But if the criticism is about methodological flaws, like not ruling out alternatives or imposing modern values, then the comparison might not hold. The defense works against claims that are unavoidable in historical reconstruction but not against poor methodology.

  Now, considering the user's deeper needs: They likely want to present a balanced view to their audience, distinguishing valid critiques from unfair ones. They might also need to address why evo psych faces more skepticism than other historical sciences. Possible reasons include the sensitive nature of human behavior, political implications, and past misuses (like justifying stereotypes). The user might need to discuss how evo psych can improve its methods to address valid criticisms, such as using multiple lines of evidence or clearer ancestral environment models.

  I should structure each criticism clearly, explaining why some are fair and others not. For example, post-hoc fitting is a trivial truth because all historical sciences work backwards from data. However, failing to rule out alternatives is a fair charge if researchers don't consider non-adaptive explanations. The confirmation of an effect doesn't validate the adaptive story if other causes aren't ruled out. The plate tectonics defense counters criticisms about historical inference but not methodological shortcomings.

  I should also mention that the term "just-so story" is sometimes used pejoratively to dismiss the field entirely, which isn't helpful. Emphasizing that rigorous evo psych avoids these pitfalls by using consilience, testing present-day mechanisms, and collaborating with other disciplines could be key. The user might want to highlight examples of well-done evo psych studies versus weaker ones to illustrate the differences.
answer: |-
  Here's a clear "menu" breaking down the distinct critiques behind "just-so story," their validity, and how they interact with your two key questions about experimental confirmation and the historical science defense:

  **The "Just-So Story" Critique Menu**

  | **Core Claim** | **Precise Meaning** | **Validity Category** | **Survives Experimental Confirmation?** | **Historical Science Defense Works?** |
  |----------------|---------------------|------------------------|-----------------------------------------|--------------------------------------|
  | **1. Post-Hoc Fitting** | Constructing an adaptive story *after* observing a trait, making it unfalsifiable for *that specific trait* in isolation. | **Trivial Truth (but requires nuance)** | **Yes, survives.** Confirming the trait exists doesn't validate the *specific* adaptive story retrofitted to it. | **Countered.** All historical science works backwards. Key is generating *new*, testable predictions from the hypothesis. |
  | **2. Lack of Independent Evidence** | Hypothesis relies solely on the trait's existence & plausibility, lacking genetic, archaeological, cross-species, or comparative data. | **Substantive & Fair Charge** | **Yes, survives.** Confirming the trait doesn't magically provide evidence for its *evolutionary origin*. | **Countered *if* evidence exists.** Defense highlights *available* evidence (e.g., fossils, genes, artifacts). Charge sticks if evidence remains absent. |
  | **3. Untestable Historical Sequence** | Unable to empirically test the proposed causal chain (mutation, selection pressure, trait fixation) in the deep past. | **Trivial Truth (but requires nuance)** | **Yes, survives.** Confirming the current effect doesn't prove the *historical pathway*. | **Countered.** Direct testing of deep history is impossible. Reliance on consilience & predictive power is standard (e.g., feathered dinosaurs → birds). |
  | **4. Failure to Rule Out Alternatives** | Neglecting non-adaptive explanations: byproducts/spandrels, genetic drift, phylogenetic inertia, exaptation, or current utility ≠ past adaptation. | **Substantive & Fair Charge** | **Yes, survives.** Confirming the effect doesn't distinguish its *origin* (e.g., fear of snakes could be innate or learned). | **Not countered.** Rigorous historical science *actively seeks & rules out* alternatives (e.g., extinction events vs. tectonics). Charge highlights methodological weakness. |
  | **5. Modern Values in Pleistocene** | Uncritically projecting contemporary social structures, norms, or values onto ancestral environments (e.g., nuclear families, rigid gender roles). | **Substantive & Fair Charge** | **Yes, survives.** Confirming an effect now doesn't validate assumptions about *past social context*. | **Not countered.** Requires rigorous paleoanthropology/ethnography. Defense fails if assumptions are demonstrably anachronistic. |
  | **6. Under-Specified EEA** | Vague, monolithic, or stereotypical description of the "Environment of Evolutionary Adaptedness" (ignoring diversity, change, or specific ecology). | **Substantive & Fair Charge** | **Yes, survives.** Confirming an effect doesn't validate the *specific EEA model* used to explain it. | **Not countered.** Strong historical science uses detailed, evidence-based reconstructions (e.g., specific dinosaur habitats). Charge highlights poor modeling. |
  | **7. "Victorian in a Lab Coat"** | Using evolutionary narratives to justify existing social hierarchies, stereotypes, or regressive politics (often tied to #5). | **Substantive & Fair Charge (when accurate)** | **N/A (Motivational).** Confirming an effect might be weaponized, but the charge is about *framing/motivation*, not the science itself. | **Not countered.** Defense is irrelevant; this is about rhetoric, misuse, or poor scientific practice reflecting bias. |

  **Addressing Your Key Questions:**

  1.  **Which Critiques Survive Experimental Confirmation?**
      *   **Almost All of Them (#1, #2, #3, #4, #5, #6).** This is the core of the critic's retreat. Demonstrating a trait or psychological mechanism exists *today* (e.g., "men prefer younger partners," "people fear spiders") is **only Step 1**. It does *not*:
          *   Validate the *specific adaptive story* concocted to explain it (#1).
          *   Provide evidence the trait *evolved* via natural selection for that function (#2, #4).
          *   Prove the proposed *historical sequence* (#3).
          *   Validate assumptions about the *ancestral social environment* (#5) or the *specific EEA model* (#6).
      *   **Why?** The confirmed present-day effect could be:
          *   A learning bias, not an evolved adaptation.
          *   A byproduct of another adaptation.
          *   Driven by current culture/physics, reflecting minimal evolutionary input.
          *   Correctly identified in function, but arising via drift or exaptation, not direct selection for that function.
      *   **The Valid Critic's Point:** Rigorous evolutionary psychology must go *beyond* showing a current effect. It needs evidence *for the evolutionary origin and process* (#2, #4) and a *well-supported model* of the selective pressures (#5, #6). Confirming the effect is necessary but insufficient.

  2.  **Does the "Historical Science Defense" Work? (Plate Tectonics, Dinosaur Parenting, etc.):**
      *   **It Works Against:** Charges that are inherent to *any* historical reconstruction (#1 Post-Hoc Fitting, #3 Untestable Sequence). Yes, all historical sciences start with observations and build plausible narratives. The defense highlights that the *method* itself isn't invalid; the key is how well the narrative integrates evidence and generates testable predictions.
      *   **It Fails Against:** Charges highlighting **methodological weaknesses specific to the study** or **avoidable flaws**:
          *   **#2 Lack of Independent Evidence:** Plate tectonics didn't stop at "continents fit"; it gathered paleomagnetism, seafloor spreading, etc. The defense only works if the evo psych study *has* gathered comparable diverse evidence. If it hasn't, the charge stands.
          *   **#4 Failure to Rule Out Alternatives:** Good historical science *explicitly considers and argues against* alternatives. Paleontologists debate whether a structure was for display or combat; geologists debate impact vs. volcanism for extinctions. Ev Psych must do the same for adaptation vs. byproduct/drift/etc. The defense fails if alternatives are ignored.
          *   **#5 Modern Values in Pleistocene & #6 Under-Specified EEA:** Paleontologists use sedimentology, biomechanics, and phylogeny to *rigorously reconstruct* dinosaur environments and behaviors. The defense fails if evo psych relies on vague stereotypes ("Savanna-like," "Hunter-Gatherer bands assumed like 20th-century foragers") without evidence-based modeling. Anachronism is a flaw, not an inevitability.
          *   **#7 Victorian Lab Coat:** This is about misuse/bias, not the historical method itself. The defense is irrelevant here.
      *   **The Nuance:** The defense reminds us that demanding *direct experimental proof of deep history* (#3) is impossible. However, it does **not** excuse poor methodology (#2, #4, #5, #6). Good historical science demands **consilience** – weaving together multiple, independent lines of evidence to build the strongest possible case, while actively trying to falsify alternatives.

  **Conclusion for Your Piece:**

  *   Acknowledge that "just-so story" is often a lazy insult, but it points to **real methodological pitfalls** (#2, #4, #5, #6) that rigorous evo psych must avoid.
  *   **Distinguish between demonstrating a current psychological mechanism (often testable) and demonstrating its evolutionary origin (much harder).** Critics are right that the former doesn't prove the latter.
  *   The "historical science defense" is **valid against charges of inherent unfalsifiability** but **invalid against charges of poor practice** (lack of evidence, ignoring alternatives, anachronism, vague models).
  *   **Strong evo psych:** Uses diverse evidence (cross-cultural, developmental, genetic, comparative, archaeological), explicitly models/test the EEA, rigorously rules out non-adaptive explanations, and generates novel testable predictions about *present-day* psychology/behavior derived from the evolutionary hypothesis.
  *   **Weak evo psych:** Relies solely on plausibility + a current effect, ignores alternatives, projects modern values, uses a cartoonish EEA, and makes only post-hoc explanations. *This* deserves the "just-so story" label.

  This framework should give you the tools to dissect both the criticisms and the defenses fairly, moving beyond the slogan to the substantive scientific issues at stake. Good luck with the piece!
