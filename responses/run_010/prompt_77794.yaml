prompt: |-
  I'm a software engineer, no philosophy training, so bear with me on the vocabulary. On my team there's one person — call her Maya — who signs off on the wording of anything we ship that describes how our systems work, and she's weirdly strict about when it's legitimate to say a piece of software "believes" something. I've been keeping a mental list of her calls, and Thursday I have to write up a new system, so I'd like to predict her verdict before she gives it.

  Her record so far, as best I remember it:

  - The poker bot we trained by self-play — no language, just betting — yes, she's fine saying it has beliefs about what's in your hand.
  - An NPC from an old text adventure with a hand-written dialogue tree and a couple of flags (player_stole_bread = true): no. I pointed out that belief-talk is honestly the easiest way to predict its lines, and she said sure, but that's a figure of speech, it doesn't actually believe anything.
  - An 80s-style medical triage expert system with thousands of hand-written rules: no. Her reason was something like "you can print the rules out."
  - Our production chatbot (big pretrained LM, we fine-tuned it): yes, it believes Paris is in France.
  - That same chatbot while it's role-playing a character who insists the moon is hollow: the role-play claims arent its beliefs, apparently. She says underneath it still believes the moon is rock.
  - A thermostat: no, obviously. This one confused me, because I have a vague memory of the thermostat being the classic example for the other side — that even a thermostat gets to have beliefs — so her flat no felt like she was ruling something out on purpose.

  Now the new thing. It's a customer support agent. We didn't train or fine-tune anything for it; the LM is frozen, off the shelf. There's a hand-written Python module, maybe 400 lines, that maintains a JSON blob of what the system takes to be true about the customer: plan tier, whether the last payment bounced, which region, whether they've already tried the reboot step. It gets filled in from API calls plus some regexes over the transcript, and it's pasted into the prompt every turn. The behavior tracks it exactly — flip one field and everything downstream changes the way you'd expect, and we can enumerate hundreds of counterfactuals because we wrote the code. It's way more consistent than the LM's own world knowledge, which wobbles if you rephrase a question.

  So: does the agent, on her view, believe the customer's payment bounced?

  What I want out of you:

  1. What rule or rules is she actually running? I'm fairly sure more than one is consistent with every item above, so lay out the candidates and show each one survives the whole list — including the role-play one and the thermostat one, which seem to me like the awkward cases.
  2. What does each candidate say about the JSON blob, and where do they split?
  3. Your best guess at her verdict, plus why you'd prefer one rule over the others given her track record rather than given which sounds more sensible in the abstract.
  4. The case I should raise Thursday that forces the rules apart — something they'd disagree about, so her answer tells me which one she's on. If it takes two different cases to seperate three rules, give me both and say which pair each one discriminates.
  5. If she says no, what wording does that leave me with in the doc, and what would she be signing up for if she ever said yes about something we built by hand?
reasoning: |-
  Hmm, the user is a software engineer dealing with a colleague (Maya) who has strict rules about when AI systems can be said to "believe" things. They need to predict Maya's verdict on their new customer support agent system before documenting it. 

  First, let's unpack Maya's past rulings: 
  - Poker bot (trained by self-play): Yes, believes
  - Text adventure NPC (hand-written flags): No
  - Expert system (hand-written rules): No
  - Pretrained chatbot: Yes, believes facts
  - Same chatbot role-playing: No for role-play claims (says underlying model still holds true beliefs)
  - Thermostat: Hard no (despite it being a classic belief example in philosophy)

  The new system is an off-the-shelf LM with a 400-line Python module maintaining a structured JSON state blob (customer facts like payment status). Key features: completely hand-coded state tracking, deterministic behavior based on state, no learning.

  The user wants:
  1) Maya's underlying rules (multiple consistent hypotheses)
  2) How each rule treats the JSON blob
  3) Prediction for this case
  4) Test cases to distinguish rules
  5) Fallback documentation language if "no"

  Looking at patterns:
  Maya consistently rejects belief-talk for hand-authored systems regardless of complexity (NPC flags vs expert system rules). She approves for learned systems (poker bot, pretrained LM). The role-play exception shows she distinguishes base model beliefs from temporary outputs. The thermostat rejection is notably strict - she's drawing a bright line against simple control systems.

  Possible rules:
  A) Belief requires learned representations (rejects all hand-coded systems)
  B) Belief requires causal history (rejects systems without training)
  C) Belief requires model persistence (rejects transient state like role-play)

  All three rules explain the existing rulings:
  - Poker bot: learned (A), trained (B), persistent model (C) → yes
  - NPC/Expert: hand-coded → no under all rules
  - Base chatbot: learned/trained/persistent → yes
  - Role-play: transient state → no under C
  - Thermostat: not learned → no under A/B

  For the new system:
  - LM itself qualifies as believing under all rules (pretrained)
  - But the JSON blob is hand-authored state
  - Rule A: rejects JSON (hand-coded)
  - Rule B: rejects JSON (no training)
  - Rule C: might accept if seen as persistent belief store

  Prediction: likely no, because:
  - Maya consistently rejects hand-coded systems
  - The thermostat precedent shows she draws hard line
  - JSON module resembles expert system (she rejected)

  Best test case: 
  To distinguish A/B from C: A system with hand-coded but persistent belief-like state (e.g., CRM that accumulates customer facts over time). Rule C might say yes while A/B say no.

  Documentation fallback: 
  Use "maintains" or "tracks" instead of "believes". If she says yes to anything hand-coded, she'd have to accept the expert system or thermostat - which her history suggests she won't.

  The user's frustration is palpable - they see functional equivalence between the JSON state and "beliefs". But Maya seems to care about origins (learned vs designed) more than behavior. This matches philosophical divides like Dennett's intentional stance vs Searle's biological requirements.
answer: |-
  Based on Maya's rulings, she's drawing a line between **emergent representations from learning** vs. **explicitly engineered state**. Here's the breakdown:

  ### 1. Candidate Rules & Their Consistency
  All three rules below explain *every* example you provided:

  - **Rule A (The Learning Principle):**  
    *"Belief requires the system to have learned the representation through adaptive feedback (e.g., training), not hand-coding."*  
    - Poker bot: **Yes** (trained via self-play).  
    - NPC/Expert system: **No** (hand-authored rules/flags).  
    - Chatbot: **Yes** (pretrained + fine-tuned on data).  
    - Role-play: **No** (hollow-moon claim isn’t learned; it’s contextually generated).  
    - Thermostat: **No** (no learning; hardwired thresholds).  

  - **Rule B (The Causal History Principle):**  
    *"Belief requires the state to be caused by a process that traces back to real-world data/experience, not programmer intent."*  
    - Poker bot: **Yes** (behavior emerges from simulated gameplay).  
    - NPC/Expert system: **No** (flags/rules set by programmers, not data).  
    - Chatbot: **Yes** (knowledge from pretraining on real-world text).  
    - Role-play: **No** (hollow-moon claim lacks causal history).  
    - Thermostat: **No** (setpoint isn’t inferred from experience).  

  - **Rule C (The Persistence Principle):**  
    *"Belief requires stable, model-persistent representations—not transient, task-specific states."*  
    - Poker bot: **Yes** (beliefs are core to its model).  
    - NPC/Expert system: **No** (flags are ephemeral to the game session).  
    - Chatbot: **Yes** (Paris/France is embedded in weights).  
    - Role-play: **No** (hollow-moon is a transient output).  
    - Thermostat: **No** (state resets; no persistence beyond immediate input).  

  All rules align with her thermostat rejection: it lacks learning, causal history, and persistent representations.

  ---

  ### 2. What Each Rule Says About Your JSON Blob
  - **Rule A (Learning):** ❌ **No belief**  
    The JSON state is hand-coded (regexes/APIs → Python → JSON). No adaptive learning.  
    *Analogy:* Identical to the rejected expert system—just a "printable" state container.  

  - **Rule B (Causal History):** ❌ **No belief**  
    The blob is populated by deterministic code (your regexes/APIs), not data-driven inference. It’s a reflection of programmer logic, not the LM’s experience.  
    *Analogy:* Like the NPC’s `player_stole_bread` flag—useful for prediction, but not a belief.  

  - **Rule C (Persistence):** ⚠️ **Debatable**  
    The JSON is persistent across turns, but it’s *external* to the LM (pasted into prompts). The LM itself doesn’t retain it; your code does.  
    *Split:* If Maya sees the JSON as part of the "system," it might qualify. But her role-play ruling suggests she cares about *model-internal* persistence.  

  **Where they split?** Rule C is the only one that *could* allow belief for engineered state if it’s persistent/global. Rules A/B categorically reject hand-coded systems.

  ---

  ### 3. Prediction & Why
  **Verdict:** ❌ **Maya will say NO, the agent does not "believe" the payment bounced.**  
  - **Why?** Your JSON system is a **hand-authored state tracker**—directly analogous to the rejected NPC flags and expert system. The LM’s *own* knowledge might "believe" things (e.g., "Paris is in France"), but your JSON blob is:  
    - Not learned (Rule A).  
    - Not causally tied to data (Rule B).  
    - External to the LM’s persistent state (Rule C).  
  - **Her track record prioritizes Rule A/B:** She consistently rejects belief for anything engineered, regardless of complexity (e.g., "you can print the rules out" for the expert system). The thermostat rejection confirms she’s not softening for simple systems.

  ---

  ### 4. Test Cases to Force Rules Apart
  #### Case 1: *"A self-updating CRM profile"*  
  - **System:** An LM with a hand-coded module that *gradually builds* a customer profile over months (e.g., infers "customer prefers phone support" from repeated behavior).  
  - **Question:** Does it "believe" the customer’s preference?  
    - **Rule A:** ❌ No (no training/learning).  
    - **Rule B:** ⚠️ Maybe—if "inference from data" is causal enough.  
    - **Rule C:** ✅ Yes (persistent, system-wide state).  
  - **Discriminates:** Rule B vs. Rule C (and Rule A if she says yes).

  #### Case 2: *"A retrained rules engine"*  
  - **System:** Your old medical expert system, but now its rules are *updated automatically* based on hospital outcome data (no deep learning, just statistical rule-tuning).  
  - **Question:** Does it "believe" symptom X indicates disease Y?  
    - **Rule A:** ✅ Yes (adapted from feedback).  
    - **Rule B:** ✅ Yes (caused by real-world data).  
    - **Rule C:** ❌ No (still rules, not model-embedded).  
  - **Discriminates:** Rule C vs. Rules A/B.

  ---

  ### 5. If She Says "No" (Expected)
  **Wording for the doc:**  
  > *"The system maintains a structured customer state record (JSON) based on transaction history and dialog analysis. This state informs the agent’s responses, ensuring consistency in handling scenarios like payment issues or regional features."*  
  **Avoid:** "believes," "knows," "thinks." Use "tracks," "maintains," "stores," "infers."

  **What she’d sign up for if she said "yes":**  
  If Maya ever approved belief for a hand-coded system, she’d implicitly endorse:  
  - The NPC having "beliefs" (since your JSON is analogous to `player_stole_bread`).  
  - The expert system "believing" medical facts (since it’s also a "printable" state).  
  - Possibly even the thermostat "believing" the room is cold (if Rule C weakens).  
  Her consistency suggests she won’t cross this line—she’s protecting "belief" for systems with *emergent* cognition.

  ---

  ### Key Insight
  Maya isn’t just tracking behavior; she’s tracking **how the representation was created**. Her "belief" is a label for knowledge that *wasn’t put there by a human*—it emerged from data/training. Your JSON is human-engineered scaffolding, so it fails her bar. Frame your doc around **deterministic state tracking**, and you’ll sail through.
