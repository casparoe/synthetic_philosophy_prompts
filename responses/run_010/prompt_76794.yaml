prompt: |-
  I run a small off-campus reading group for psych grad students and a few philosophy undergrads — we meet in a borrowed seminar room with no projector and a whiteboard that doesn't actually work, so everything I hand out has to survive being printed on one side of A4 in black and white. This week is experimental philosophy and the centerpiece is the side-effect effect: the chairman of the board who greenlights the program because all he cares about is profit, where most people say he intentionally harmed the environment and most deny he intentionally helped it (something like an 82/23 split in the original study). My group has been through those vignettes twice now and half of them have settled into "well, obviously the folk are just biased," while the other half think that's cheap, and I want something that forces the disagreement out into the open instead of letting everyone quietly keep their intuition.

  So: a decision tree. Entry point is "I accept the harm/help asymmetry is robust enough to be worth explaining," exit is a named account of why it happens. Every node has to be a question a reader can answer by thinking about the concept and about what the data would have to look like — not "do you sign up for the skill hypothesis?" I want the splits to run along the real fault lines: whether the folk concept of intentional action has any normative content to begin with; whether the folk are getting it right or getting it wrong; whether the effect is local to intentional action or shows up across the other non-moral ascriptions too (knowing, deciding, being in favor of, acting freely); whether the badness of the outcome is doing the work or whether it's something that just happens to travel with badness (costliness, the agent's knowing acceptance of the outcome, what the effect reveals about him as a person); and whether your view predicts the asymmetry would survive being decoupled from blame entirely. Six to nine leaves, each carrying the label people actually use if there is one — and if you're not sure anyone defends a given cell, write "unnamed" and say in one line whether the cell is empty because it's incoherent, because it's unattractive, or just because nobody's got round to it. No bibliography, no author-year cites; I'd much rather have an honest "not sure who holds this" than an invented paper.

  For each leaf give one sentence on what the view says the folk are getting right or getting wrong, and one sentence naming the finding that would kill it. Then two short sections at the end: first, any pairs of leaves your tree can't actually separate, plus the extra question that would separate them (I strongly suspect at least two of the "it's just bias" views land in the same place); second, up to three nodes where you think a reader's honest answer is unstable, or where the node is really two questions in a trenchcoat. Start with a one-line bottom line at the very top: which leaf you'd bet on yourself, one sentence, no hedging. Whole thing under 900 words including that bottom line — it has to fit the page.
reasoning: |-
  Okay, the user runs a reading group for psych grad students and philosophy undergrads. They need a one-page decision tree on the side-effect effect (Knobe effect) to spark debate. The current issue is that half the group sees it as folk bias, while the other half thinks that's too dismissive. The user wants to force the disagreement into the open.

  First, I need to cover the key fault lines they mentioned: normative content in folk concepts, whether folk are right or wrong, the scope beyond intentional action, what's driving the effect (badness vs. correlated factors), and if the asymmetry persists without blame. Each leaf should be a named theory or "unnamed" with a reason why it's not held. For each leaf, include what folk get right/wrong and a falsifying finding.

  The bottom line should be my bet on which theory is most plausible. The user wants conciseness—under 900 words. Also, address any indistinguishable leaves and unstable nodes. 

  Structuring the decision tree: Start with whether the asymmetry needs explaining. Then, is there normative content? If yes, is the folk concept correct? If no, does the effect appear in non-moral ascriptions? Then, is badness central? And does the asymmetry survive without blame? 

  Theories to include: Deep Self (Knobe), Skill Hypothesis (Pettit), Belief Hypothesis (Alicke), etc. Unnamed positions might be where folk are wrong but no normative content, which seems incoherent. 

  Check for overlapping leaves. For example, two "just bias" views might converge. Identify questions to split them. Also, note unstable nodes, like "normative content" which might conflate different norms. 

  Ensure the tree fits on one A4 page. Use clear, concise questions. Avoid jargon where possible. Test each path to ensure it leads to a distinct leaf. 

  Finally, the bottom line: I'd bet on Deep Self, as it accounts for multiple aspects. But mention alternatives briefly. Keep the whole thing tight and focused on sparking discussion.
answer: |-
  Here’s a decision tree forcing key fault lines on the side-effect effect. I’d bet on **Deep Self (Normative)** as the most explanatorily rich account.  

  ---

  ### DECISION TREE: EXPLAINING THE SIDE-EFFECT EFFECT (KNOWBE EFFECT)  

  **1. Accept the harm/help asymmetry as robust?**  
     *→ No: Stop (Folk bias is noise/uninteresting).*  
     *→ Yes: Go to 2.*  

  **2. Does the folk concept of "intentional action" inherently involve normative evaluation (e.g., linking to blame/praise)?**  
     *→ Yes: Go to 3.*  
     *→ No: Go to 4.*  

  **3. Is the folk concept *correct*? (Does "intentional" truly require norm-violation)?**  
     *→ Yes: **Deep Self (Normative)** (Knobe, Sripada). Folk get right that intention reveals character flaws/virtues. Killed if: asymmetry vanishes when outcomes are equally norm-violating but non-moral (e.g., breaking arbitrary rules).*  
     *→ No: **Folk Error** (Unnamed - unattractive). Folk mistakenly conflate intentionality with blame. Killed if: asymmetry persists even when folk explicitly deny normative relevance.*  

  **4. Does the asymmetry extend to *other* non-moral ascriptions (e.g., "knowingly," "decided to," "in favor of")?**  
     *→ Yes: Go to 5.*  
     *→ No: **Local Pragmatics** (Adams & Steadman). Folk bias is specific to "intentional," driven by conversational blame-implicature. Killed if: asymmetry appears in isolated, non-conversational judgments (e.g., private ratings).*  

  **5. Is the *badness itself* directly driving the asymmetry (vs. correlated features like agent’s attitude)?**  
     *→ Yes: **Bias Hypothesis** (Alicke). Folk misattribute intentionality due to blame motivation. Killed if: asymmetry remains strong when harm is blameless (e.g., unavoidable side-effect saving lives causes *less* "intentional helping").*  
     *→ No: Go to 6.*  

  **6. Is the asymmetry explained by the *personal cost/effort* required for the agent to avoid/achieve the side-effect?**  
     *→ Yes: **Skill Hypothesis** (Pettit & Knobe). Folk see harmful side-effects as intentional because avoiding them would require skill/virtue the agent lacks. Killed if: asymmetry persists when avoiding harm/achieving help is trivially easy.*  
     *→ No: Go to 7.*  

  **7. Does the asymmetry survive decoupling from blame/praise (e.g., in neutral or admirable harm scenarios)?**  
     *→ Yes: **Belief Hypothesis** (Nadelhoffer, Beebe). Folk tacitly require stronger evidence of belief/awareness for positive side-effects. Killed if: explicit belief ratings show no harm/help asymmetry.*  
     *→ No: **Deep Self (Non-Normative)** (Unnamed - coherent but undeveloped). Folk track desire-consistency, but blame amplifies perception of underlying attitudes. Killed if: asymmetry absent when harm is desired but blameless.*  

  ---

  ### INDISTINGUISHABLE LEAVES & REQUIRED SPLITS  
  *   **Bias Hypothesis (5-Yes)** and **Folk Error (3-No)** both predict folk judgments are mistaken. **Split:** Does the effect *only* appear for intentional action? If yes → Folk Error is weakened; if no → Bias Hypothesis strengthened.  
  *   **Deep Self (Normative) (3-Yes)** and **Deep Self (Non-Normative) (7-No)** both involve character assessment. **Split:** Is the character assessment inherently moral? If yes → Normative; if no → Non-Normative.  

  ---

  ### UNSTABLE/COMPLEX NODES  
  1.  **"Normative Evaluation" (Node 2):** "Normative" conflates moral blame, praise, rationality, or convention. A reader might answer "yes" meaning moral blame but "no" for other norms.  
  2.  **"Badness itself" (Node 5):** Hard to isolate badness from correlated factors (e.g., perceived desire, avoidability). Readers may conflate badness with agent’s endorsement.  
  3.  **"Decoupling from blame" (Node 7):** Difficult to imagine truly blame-neutral harms. Scenarios (e.g., harm required to save lives) may introduce new norm complexities.  

  ---
