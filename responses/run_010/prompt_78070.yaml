  Okay, let me approach this systematically. The user is a philosophy PhD candidate wrestling with Hume's is-ought problem in their dissertation, specifically whether Hume's passage supports the strong thesis known as Hume's Law. They've presented nine inferences with their intuitive verdicts and seek a coherent principle to reconcile them. 

  First, I notice the core tension lies between cases 5 (rejected promise-to-obligation inference) and 6 (accepted chess-move-to-ought inference), which share identical logical structure but receive opposite verdicts. The user's proposed principle - requiring normativity to be "already available" in premises - seems insufficient as it would approve both. 

  Breaking down the cases: Institutional inferences (3,5,6) reveal a pattern. Case 3 (sea captain) is valid only because the "ought" is explicitly embedded in the premise. Case 6 (chess) works because the addressee implicitly accepts chess rules. But case 5 fails because moral obligation requires stronger grounding than mere institutional facts - hence the user's intuition that it "compels only an audience that already treats being under an obligation as a reason to act." 

  For the biological cases (7-8): The heart judgment (7) succeeds because "bad" is attributive to functional standards we all recognize. But the Aristotelian inference (8) fails because "ought" here implies moral normativity, not just functional assessment. This distinction between functional and moral normativity seems crucial. 

  The disjunctive case (4) and desire-based cases (1-2) are red herrings - the former is syntactically valid but normatively empty, while the latter depends entirely on contingent desires. 

  Now for the requested principle: I'll propose that normativity must be either 1) explicitly contained in premises (motivated by case 3), or 2) operationally valid within a practice the addressee accepts (cases 1,6), or 3) attributive to uncontested functional standards (case 7). This excludes case 5 because moral obligations aren't reducible to institutional facts, and excludes case 8 because human flourishing standards are contested moral notions. 

  On the new cases: The coercive contract inference works (parallel to chess) if legal standards are accepted; the injury-to-wrong judgment fails because "injury" and "for no reason" contain implicit normativity that requires justification. 

  Case 9 (pleasure-as-good) belongs elsewhere - it's about definability, not inference validity. Collapsing the distinction would mistakenly validate all naturalistic fallacies. 

  Finally, if forced to abandon one verdict, it should be case 5 - but with the crucial clarification that institutional "oughts" are only hypothetical, not categorical moral obligations. This preserves the is-ought gap for moral claims while allowing practice-immanent normativity.
answer: |-
  ### A Proposed Principle for Distinguishing Legitimate Normative Inferences

  **The Principle of Immanent Normativity:**  
  An inference from wholly descriptive premises to a normative conclusion is legitimate **if and only if** either:  
  (i) The normativity in the conclusion is *explicitly contained* within the premises (e.g., embedded in a relative clause), **or**  
  (ii) The premises describe facts *within a rule-governed practice* **and** the addressee *accepts the practice's constitutive norms as reasons for action*, **or**  
  (iii) The normativity is *attributive* (e.g., "good," "bad") **and** invokes an uncontested functional standard inherent to the described entity.  

  **Motivations from Your Verdicts:**  
  - Clause (i) is motivated by **3** (sea captain): The "ought" is explicit in the premise.  
  - Clause (ii) is motivated by **1** (cholera + desire) and **6** (chess): Normativity depends on addressee-dependent commitment to rules/desires.  
  - Clause (iii) is motivated by **7** (bad heart): "Bad" invokes a biological function with uncontested standards.  

  ---

  ### (a) Accounting for Your Verdicts  

  **Accommodated Verdicts:**  
  - **1**: Covered by (ii) — the desire *is* the accepted practice (prudential reasoning).  
  - **2**: Illegitimate — lacks (ii) without the desire.  
  - **3**: Covered by (i) — "ought" is explicit.  
  - **4**: Valid syntax but normatively inert — not addressed by the principle because it doesn’t *generate* normativity (irrelevant to Hume’s gap).  
  - **6**: Covered by (ii) — chess rules are accepted by players.  
  - **7**: Covered by (iii) — "bad" is attributive to uncontested biological function.  
  - **9**: Illegitimate — *not* covered by any clause. "Good" here is not attributive (it’s predicative) and requires moral justification.  

  **Problem Cases:**  
  - **5** (promise): Your rejection *requires* denying that "being under an obligation" entails a reason for action unless the addressee *already endorses* the moral force of promises. Clause (ii) *would* cover this **only if** the addressee accepts institutional norms (e.g., legal obligation). But you reject it because *moral* "oughts" demand more than institutional facts.  
  - **8** (ought to live in communities): Your rejection conflicts with (iii). While "flourishing" is functional like "bad heart," you deny its normativity because *moral* "oughts" can’t be derived from functional facts alone.  

  **The Inconsistency:** Your verdicts **5** (reject) and **6** (accept) *are* incompatible under your tentative principle. The split hinges on:  
  - **6** involves *non-moral* normativity: Chess "oughts" are conditional on game participation.  
  - **5** implies *moral* normativity: Obligations purport to bind categorically.  
  **Solution:** Amend clause (ii) to specify:  
  > *(ii) ... and the normativity is conditional on participation in the practice (e.g., chess), not categorical (e.g., moral promises).*  

  This splits **5** and **6**: Chess "oughts" are hypothetical ("if you play, you must..."); promissory "oughts" claim categorical force. **5** fails because "Jones ought to pay" pretends to a categorical norm not contained in the premises.  

  **Cost of Abandoning 5 and 8 Together:**  
  - Giving up **5** weakens objections to institutional naturalism (e.g., Searle).  
  - Giving up **8** severs Aristotelian naturalism from ethics.  
  *But this is unnecessary*: Amending (ii) saves **5**'s rejection, while **8** fails because "flourishing" lacks the *uncontested* status of biological functions (it’s evaluative).  

  ---

  ### (b) Verdicts on New Cases  

  1. **"This contract’s formation was coercive → This contract ought to be void."**  
     - **Verdict: Legitimate** under (ii).  
     - Premises describe an institutional fact (coercion) within a practice (contract law). The inference holds *if* the addressee accepts legal norms (e.g., "coercion invalidates contracts"). The "ought" is conditional on endorsing the legal system.  

  2. **"He caused her a serious injury for no reason → He acted wrongly."**  
     - **Verdict: Illegitimate** under the principle.  
     - Foot-style naturalists claim "injury" and "for no reason" are normative, but *only if* we accept a prior standard (e.g., "injury is bad"). The premises are descriptive ("caused tissue damage," "no goal served"), but the conclusion requires bridging to moral wrongness. Clause (iii) fails because "wrong" isn’t attributive (unlike "bad heart").  

  ---

  ### (c) The Status of Case 9  

  **Does 9 belong here?**  
  - **No.** Case 9 concerns the *definability* of "good" (Moore’s open-question argument), not inference validity.  
  - **Collapsing definability and validity distorts your verdicts:**  
    - It mistakenly validates **8** (if "flourishing = good" is analytic, the inference works).  
    - It invalidates **7** (if "good" is indefinable, "bad heart" becomes suspect).  
  - **Enforce the distinction:** Hume’s gap is about *inferences*, not semantics. Case 9 belongs in a metaethical chapter on naturalism.  

  ---

  ### (d) Final Recommendation  

  Your verdicts are salvageable by:  
  1. Limiting attributive normativity (**iii**) to *non-evaluative* functions (e.g., biological roles).  
  2. Restricting practice-immanent normativity (**ii**) to *hypothetical* "oughts."  
  3. Treating moral inferences (**5**, **8**) as illegitimate unless premises contain explicit moral terms (per i).  

  **The one verdict to abandon if forced:**  
  Verdict: 8  

  **Reason:** **8** (Aristotelian ought) is the weakest link. Unlike **7** ("bad heart"), it conflates functional and moral normativity. Abandoning it preserves the core Humean gap for ethics while accommodating institutional/hypothetical cases.
