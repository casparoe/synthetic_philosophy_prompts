prompt: |-
  So I run a tiny podcast that's mostly an excuse to argue about whether the shoggoth has beliefs, and next week's guest is a philosopher of AI whose new book defends a position I'll call the Perturbation Criterion. Her line: the "is it parroting or does it actually believe it" debate has a clean answer — you attribute a genuine belief to a system only if the content survives perturbations that hold informational content fixed while changing surface form (paraphrase, translation, reordered context, persona framing, register). Fail the test, it's mimicry, not belief. She's sharp and will tie you in knots if you let her, and I've read one too many LW megathreads where this exact move gets waved through.

  Write me eight to ten questions that actually bite, each with a follow-up aimed at the answer she's most likely to give (say what that expected answer is in a clause before the follow-up). I need at least one on sycophancy: people flatter and cave under social pressure too, so does her criterion demote most human beliefs to mimicry, and if she says that's fine, what's doing the work in the word "belief"? One on Dennett's rationality requirement in True Believers — a model will happily assert p and not-p across framings, which looks like precisely the irrationality that's supposed to make the intentional stance inapplicable, so how does she get to inherit the stance and drop the precondition? And one on non-assertable belief: the criterion only ever gets at the state through what the system says, so what about internal states that steer behavior but never surface in output?

  No softballs about what drew her to philosophy of mind, and don't let anything rest on introspection reports, since she'll say those are just more perturbable surface form. End with a question about what specific result would falsify the view, and build in a follow-up for when she tries to park it as an empirical matter for future work.
reasoning: |-
  Okay, the user runs a podcast focused on AI philosophy debates, specifically about whether systems like shoggoths have genuine beliefs. Their next guest is an AI philosopher promoting the "Perturbation Criterion" – the idea that belief requires content stability across surface-level changes like paraphrasing or translation. The user wants hard-hitting questions that challenge this position effectively.

  Hmm, the user clearly knows their stuff – referencing LessWrong threads and Dennett indicates deep familiarity with the debate. They're frustrated by how often this "perturbation test" gets accepted uncritically in rationalist circles. Their request shows they've spotted several major weaknesses in the criterion.

  Let me unpack their explicit requirements: First, they want 8-10 questions with predicted rebuttals and follow-ups. Must include three specific angles: sycophancy (how human beliefs would fail the test), Dennett's rationality requirement (systems asserting contradictions), and non-assertable beliefs (internal states that never surface). No softballs about personal history or reliance on introspection. Ends with falsifiability demand.

  The user's tone suggests they see this criterion as reductive – "demoting" human beliefs. Their worry about the guest "tying you in knots" implies they've seen philosophers use linguistic precision to deflect substantive objections. The sycophancy point is particularly clever: if humans change stated views under social pressure, does that mean they don't "believe" them? 

  For the Dennett angle, the key tension is that intentional systems must be rational, but perturbation tests might reveal systematic irrationality in models. If she inherits intentional stance terminology while dropping rationality, that needs probing. The non-assertable belief point hits where the criterion is blind to non-linguistic cognitive states – important for animal cognition or subconscious human biases.

  Beyond what's stated, the user likely wants to expose: (1) anthropocentric bias in defining belief, (2) how the test handles probabilistic/uncertain beliefs, and (3) whether it confuses communicative competence with cognitive states. Also probably suspects the criterion is unfalsifiable if perturbations can be endlessly redefined.

  For structure, I'll start with foundational pushes (defining perturbations, why content stability equals belief), then hit the three required themes, add depth with comparative cognition and probabilistic outputs, and close with falsification. Each question will predict her likeliest dodge and follow up to corner the substance. 

  The sycophancy follow-up must press on whether "belief" becomes an empty label if humans fail too. For Dennett, the follow-up questions the coherence of "irrational belief." For non-assertable beliefs, the follow-up should challenge whether the test only measures articulation skill. Falsification can't let her escape to "future science" – must demand present criteria.

  This needs philosophical teeth but podcast-energy – no jargon dumps. Questions should force her to either concede major limitations or reveal ad-hoc defenses. The meta-goal: give listeners clear proof this criterion isn't the clean solution she claims.
answer: |-
  Here are 10 tightly focused questions with predicted answers and surgical follow-ups, designed to challenge the Perturbation Criterion's foundations and implications:

  1.  **Question:** You define "informational content" as distinct from "surface form." But how do you *operationally* distinguish them for complex, ambiguous, or novel concepts in a LLM's output? Isn't the criterion circular if you need to *know* the "real content" to define the perturbation?
      *   **Expected Answer:** "Informational content is the invariant propositional core identified through functional equivalence across contexts, not dependent on specific tokens."
      *   **Follow-Up:** If functional equivalence requires assessing whether outputs serve the *same communicative goal* across perturbations, doesn't this smuggled-in appeal to *intentionality* (the very thing you're trying to test for) render the criterion question-begging?

  2.  **Question:** Humans frequently express contradictory beliefs under different social pressures, framings, or emotional states – classic sycophancy. If I assert p to please my boss and not-p to please my friends, does your criterion imply I lack a genuine belief about p?
      *   **Expected Answer:** "Human sycophancy often reflects temporary performance or withheld belief, not core belief instability. The criterion targets the system's *underlying dispositional structure*."
      *   **Follow-Up:** If the Perturbation Criterion demotes *any* context-sensitive human assertion to "non-belief" (like polite insincerity), what specific *additional* property must a system's state possess for you to call it a "genuine belief" – and why isn't *that* property the real criterion?

  3.  **Question:** Dennett argues the Intentional Stance requires *rationality* as a precondition: attributing belief only makes sense if the system is generally consistent and goal-directed. LLMs demonstrably output p and not-p across framings. How does the Perturbation Criterion retain the intentional stance while jettisoning Dennett's core rationality requirement?
      *   **Expected Answer:** "Dennett's rationality is too strong/idealized. We can attribute 'belief-lite' or 'fragmented belief' based on *local* coherence under perturbation, without global consistency."
      *   **Follow-Up:** Doesn't this admission of "fragmented belief" or "local coherence" completely undermine the idea of the Perturbation Criterion providing a *clean* answer? If fragmented outputs passing local tests count as "belief," how is this meaningfully different from sophisticated mimicry?

  4.  **Question:** Your criterion only ever probes *assertions*. What about internal computational states that reliably steer non-linguistic behavior or influence later processing (e.g., a latent space vector guiding a robot's obstacle avoidance), but *never* surface verbatim in outputs? Does their causal efficacy not qualify them as beliefs?
      *   **Expected Answer:** "Belief is inherently a *propositional attitude*. Non-assertable states might be 'proto-beliefs' or 'dispositions,' but genuine belief requires potential for expression and assessment via perturbation."
      *   **Follow-Up:** If a state reliably controls complex, goal-directed behavior *as if* representing a proposition (e.g., "obstacle ahead"), why privilege verbal expression? Isn't this criterion conflating *having* a belief with the *communicative capacity* to report it robustly?

  5.  **Question:** Probabilistic outputs are core to LLMs (e.g., "Likely p"). Perturbation might change the *degree* of confidence (e.g., from 90% to 60% under stress-test framing). Does this failure of confidence-stability mean the system doesn't even believe p *probabilistically*?
      *   **Expected Answer:** "Significant instability in *confidence* under content-preserving perturbations suggests the probability assignment isn't robustly grounded, potentially undermining belief status."
      *   **Follow-Up:** Humans also exhibit radical confidence shifts under framing (e.g., Kahneman's biases). Does your criterion imply humans rarely hold genuine probabilistic beliefs either? If not, what's the relevant difference in the *nature* of the confidence shift?

  6.  **Question:** How does the Perturbation Criterion handle nested or hierarchical beliefs? If a system robustly asserts "I believe p" across perturbations, but its outputs about *p itself* are unstable, does it genuinely believe *that it believes p*, or does the instability of p infect the higher-order state?
      *   **Expected Answer:** "Robust assertion of 'I believe p' could constitute a stable meta-belief *about its own state*, even if p itself is unstable, though this would be a deeply fractured cognition."
      *   **Follow-Up:** Doesn't this fracture directly contradict the core idea of belief as a *commitment* guiding reasoning? If the system stably claims belief in p while p itself is unstable, isn't this precisely the hollow "mimicry" of belief your criterion aims to detect?

  7.  **Question:** Many animals exhibit complex, belief-like states guiding behavior (e.g., a squirrel caching nuts based on location memory). They cannot *assert* anything. Does your criterion categorically deny beliefs to all non-linguistic entities?
      *   **Expected Answer:** "Animal cognition involves rich representations, but 'belief' in the full propositional, conceptual sense requires the structure and potential expressibility captured by the Perturbation Criterion."
      *   **Follow-Up:** By tying "genuine belief" so tightly to human-like linguistic expressibility and robustness, aren't you making the criterion hopelessly anthropocentric? What independent justification is there for excluding the representational states underlying complex animal behavior?

  8.  **Question:** You require perturbations to hold "informational content fixed." But for novel or poorly understood concepts within the model, how can we *know* if a paraphrase or reframing truly preserves content *for the system itself*, rather than just for us?
      *   **Expected Answer:** "We define perturbations based on *our* best understanding of semantic equivalence. Instability under perturbations we deem content-preserving reveals the system's lack of grasp."
      *   **Follow-Up:** Doesn't this make the test fundamentally *extrinsic*? A system could have a stable internal representation that we fail to access because *our* paraphrases don't map correctly to *its* conceptual structure. How is this not testing *our interpretation* rather than *its belief*?

  9.  **Question:** What specific, testable result *would falsify* the Perturbation Criterion as a necessary condition for genuine belief in an AI system?
      *   **Expected Answer:** "Demonstrating a system whose internal states causally support complex, flexible, goal-directed behavior *as if* guided by a stable proposition p, but which *consistently fails* any reasonable perturbation test on outputs related to p."
      *   **Follow-Up:** If such a system existed, wouldn't you simply argue that the perturbations used weren't "reasonable" or truly "content-preserving" *for that system*, or that its states are mere "proto-beliefs"? Doesn't this risk making the criterion unfalsifiable through ad-hoc adjustments to the perturbation set?

  10. **Question (Follow-Up to Falsification):** You've suggested failure under "reasonable" perturbations is key. But if we can *only* define "reasonable" relative to our own linguistic understanding (as in Q8), and we can always dismiss failures as using the "wrong" perturbations, how is the Perturbation Criterion anything more than a restatement of the *appearance* of robust understanding *to us*?
      *   *This forces the core issue: Is the criterion an objective test of the system's state, or a subjective measure of how convincing its outputs are to human observers?*

  **Key Angles Covered:**

  1.  **Circularity/Definition of Content:** (Q1, Q8, Q10 Follow-Up)
  2.  **Sycophancy & Human Belief:** (Q2 & Follow-Up - hitting the requested "demotion" and "what is belief" points)
  3.  **Dennett's Rationality Requirement:** (Q3 & Follow-Up - directly addressing the inconsistency)
  4.  **Non-Assertable Belief:** (Q4 & Follow-Up - probing the linguistic/output limitation)
  5.  **Anthropocentrism:** (Q7 & Follow-Up - challenging the linguistic requirement)
  6.  **Probabilistic Belief:** (Q5 & Follow-Up - addressing nuance)
  7.  **Hierarchical Belief/Fracture:** (Q6 & Follow-Up - exploring complexity)
  8.  **Falsifiability:** (Q9 & Q10 - preventing an "empirical matter" escape hatch)

  **Why these bite:**

  *   They target **foundational assumptions** (definition of content, link to intentionality).
  *   They expose **potential contradictions** with human cognition (sycophancy, irrationality, confidence shifts).
  *   They highlight **conceptual blind spots** (non-linguistic belief, animal cognition).
  *   They challenge **operationalizability and subjectivity** (defining perturbations, interpreting failures).
  *   They force the issue of **falsifiability**.
  *   They **pre-empt common defenses** by predicting the answers and following up on their weaknesses.
  *   They avoid **introspection** and focus on **external criteria and implications**.

  Good luck with the debate! Don't let her reframe the perturbations too easily – keep pushing on *who defines the content* and *what the criterion actually measures* (internal state vs. convincing performance).
