prompt: |-
  In my normative ethics seminar we are working through the demandingness objection, and in section a classmate offered a response I want to test on you. His claim is that a duty to aid the global poor is structured like a liability to pay taxes in a cooperative scheme: there is a total that needs to be raised, an assessment fixes your share of it, and your bill does not grow merely because others fail to pay theirs. On that picture consequentialism is not devastatingly demanding after all — you owe what an ideal scheme would have levied on you, and the shortfall created by everyone else's default is not yours to absorb. He said this is how to reconcile the intuition behind the demandingness objection with a wholly impersonal account of the good, without conceding any agent-relative prerogatives.

  Could you audit the tax analogy for me? I would like the mapping stated explicitly — what plays the role of the scheme, the assessing authority, the taxpayer, the public good, full versus partial compliance — and then the points where the mapping breaks. Which of those failures are fatal to the intended use, and which are harmless? I am especially unsure about three things: whether the absence of any actual collecting agency matters, whether a fair share is determinable at all without one, and whether the analogy is carrying the argument or merely illustrating a prior principle about partial compliance that would need independent defence. Finally, does the moderate conclusion survive once the disanalogies are on the table, and if the tax picture cannot carry it, is there a better analogy that could?
reasoning: |-
  Okay, the user is in a normative ethics seminar dealing with the demandingness objection. Their classmate proposed a tax analogy to counter this objection, suggesting that consequentialism isn't overly demanding because one's duty is limited to their "fair share" of aid, regardless of others' non-compliance. The user wants me to audit this analogy thoroughly.

  I need to unpack this tax analogy carefully. The core idea is that just as taxpayers aren't responsible for covering others' unpaid taxes, individuals aiding the global poor shouldn't have to compensate for others' inaction. The classmate claims this reconciles demandingness concerns with impersonal goodness without needing agent-relative prerogatives.

  First, I should explicitly map the tax analogy components:
  - Tax scheme → Ideal global aid system
  - Assessing authority → Idealized moral calculation
  - Taxpayer → Moral agent
  - Public good → Poverty alleviation
  - Full compliance → Everyone contributes fair share
  - Partial compliance → Others shirk duties

  Now, where does this analogy break? The biggest issue is that taxes have enforcement mechanisms—governments collect them, while global aid lacks any such authority. Without this, who determines what a "fair share" is? The analogy assumes we can objectively calculate this, but in reality, moral philosophers debate this constantly. Also, taxes operate within legal systems with clear rules; global aid has no comparable framework.

  The absence of a collecting agency matters profoundly. In real taxation, if someone doesn't pay, the state pursues them—it doesn't just let the burden fall on compliant taxpayers. But with poverty relief, if others don't contribute, the needy still suffer, creating moral pressure beyond one's "share."

  I'm also skeptical about whether fair shares are determinable without an actual system. Different moral theories (utilitarianism vs. egalitarianism) would calculate shares differently. The analogy risks smuggling in prior assumptions about fairness that need independent justification. It might illustrate a partial-compliance principle rather than proving it.

  Despite these flaws, the moderate conclusion—that duties aren't limitless—might survive if we treat the analogy as heuristic. It helpfully challenges the "sinking lifeboat" intuition where one person must do everything. But it can't resolve core issues alone.

  For better analogies, consider: 
  - Public goods games (but still face free-rider problems) 
  - Climate change responsibilities (similar coordination issues) 
  - Joint promises (though enforcement remains weak)

  Ultimately, the tax analogy highlights important questions about fairness in non-ideal conditions but can't fully defend the classmate's position without additional arguments about why "fair share" boundaries exist in morality. The user should push on how we define fairness without a real scheme and whether any analogy can overcome the enforcement gap.
answer: |-
  Your classmate's tax analogy is a creative and philosophically significant attempt to resolve the demandingness objection. Let's audit it systematically, mapping the components, identifying disanalogies, evaluating their severity, and assessing the viability of the conclusion.

  ### Explicit Mapping of the Tax Analogy
  1. **The Cooperative Scheme**: The global institutional order needed to efficiently eradicate severe poverty (analogous to a state's fiscal system).  
  2. **The Assessing Authority**: Ideal moral reasoning (e.g., impartial consequentialist calculation) determining a "fair share" of the burden.  
  3. **The Taxpayer**: The individual moral agent with resources to aid others.  
  4. **The Public Good**: Prevention of extreme suffering/death among the global poor (analogous to infrastructure, security, etc.).  
  5. **Full Compliance**: A world where all capable agents contribute their fair share.  
  6. **Partial Compliance**: The actual world, where many (or most) fail to contribute.  
  7. **The Liability**: The agent's duty to aid, capped at their fair share (≈ tax bill), regardless of others' non-payment.  

  ### Key Disanalogies & Their Implications  
  1. **Absence of an Enforcing Authority**  
     - **Disanalogy**: Real tax systems have states to assess/collect taxes, punish evasion, and adjust budgets. Global poverty relief lacks any such authority.  
     - **Why it Matters**: Without enforcement, non-compliance isn't merely a "shortfall" but an ongoing moral emergency. Need doesn't disappear when others shirk; unmet needs persist.  
     - **Fatal? Potentially.** The analogy assumes the *structure* of a cooperative scheme exists *in potentia*, but without an actual mechanism to coordinate shares or compel payment, the "fair share" concept may lack practical force.  

  2. **Determinability of "Fair Share"**  
     - **Disanalogy**: Taxes rely on predefined rules (e.g., progressive rates). Consequentialism lacks an objective formula for individual shares. What's "fair" under utilitarianism? 10% of income? Enough to avoid marginal utility loss?  
     - **Why it Matters**: If shares are indeterminate, the analogy cannot specify limits. Demandingness might reemerge if the "share" is high (e.g., Peter Singer's 33% proposal).  
     - **Fatal? Not necessarily.** Philosophers like Liam Murphy (*Moral Demands in Nonideal Theory*) defend calculable shares (e.g., "each contributes until the per-person cost equals the per-person benefit of full compliance"). But this requires defending a *prior principle* of fairness.  

  3. **The Analogy as Illustration vs. Justification**  
     - **Disanalogy**: Taxes derive legitimacy from political processes; the duty to aid rests on moral urgency alone. The analogy *presumes* the acceptability of a "scheme" but doesn't prove its existence.  
     - **Why it Matters**: The analogy illustrates *how* duties could be bounded but doesn't explain *why* they *are* bounded absent agent-relative prerogatives. It risks begging the question.  
     - **Fatal? Yes, for standalone use.** The analogy needs underpinning by a theory of fairness in partial compliance (e.g., Murphy's "collective principle of beneficence").  

  4. **Non-Excludability vs. Targeted Aid**  
     - **Disanalogy**: Public goods (like roads) benefit all, including non-payers. Poverty aid targets specific beneficiaries—non-payment directly harms them.  
     - **Why it Matters**: In taxation, my payment isn't wasted if others defect; in aid, my "share" may achieve nothing if systemic change requires full funding.  
     - **Harmless? No.** This undermines the efficiency rationale, making individual action feel futile and potentially *more* demanding psychologically.  

  ### Does the Moderate Conclusion Survive?  
  **Yes, but weakly and only with modifications**:  
  - **Strengths**: The analogy successfully challenges the "sinking lifeboat" intuition (where one must do everything). It shows that over-demandingness *could* arise from poor coordination, not morality itself.  
  - **Surviving Core**: The insight that duties in non-ideal conditions should mirror ideal fairness *can* persist if paired with:  
    - A defensible theory of fair shares (e.g., "each gives enough that if all gave likewise, the goal would be met").  
    - Recognition that shortfalls create new duties (e.g., advocacy, institutional reform) beyond mere giving.  
  - **Caveats**:  
    - Without a real scheme, "fair shares" are counterfactual and unenforceable.  
    - The *impersonalism* of consequentialism remains—your "share" might still require significant sacrifice (e.g., for high earners).  
    - It doesn't address *other* sources of demandingness (e.g., ongoing disasters after poverty is alleviated).  

  ### Better Analogies?  
  1. **Climate Change Mitigation**:  
     - Each nation has a "fair share" of emissions reductions. Shortfalls by others don't absolve you, but your duty isn't to fix the *entire* problem alone.  
     - **Advantage**: Reflects global coordination problems.  
     - **Limitation**: Still lacks enforcement.  

  2. **Public Goods Game**:  
     - Players contribute to a common pot; if total meets threshold, all benefit. Your rational contribution is your share, regardless of free-riders.  
     - **Advantage**: Models strategic interaction.  
     - **Limitation**: Morality isn't a game; stakes are life/death.  

  3. **Joint Promise**:  
     - Ten friends promise to fund a lifesaving surgery. If six default, the remaining four aren't obligated to cover the full cost—but they *are* obliged to try renegotiating or finding alternatives.  
     - **Advantage**: Captures relational duties and partial compliance.  
     - **Limitation**: Assumes pre-existing agreement.  

  ### Final Verdict  
  The tax analogy **cannot carry the argument alone** due to enforcement and determinability gaps. However, it *effectively illustrates* a principled response to demandingness: duties in non-ideal conditions should approximate what would be required under fair cooperation. To defend this, your classmate must:  
  1. Ground "fair shares" in a standalone theory (e.g., Murphy’s collective principle).  
  2. Address the "new duties" created by non-compliance (e.g., political action).  
  3. Acknowledge that even a "fair share" may be substantial—it moderates but doesn't eliminate demandingness.  

  **Recommendation**: Use the analogy as a *heuristic* to show that consequentialism needn't demand infinite sacrifice, but pair it with rigorous non-ideal theory to answer the fatal disanalogies. The conclusion holds only if fairness in partial compliance is defensible independently.
