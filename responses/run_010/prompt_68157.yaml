prompt: |-
  I serve on the five-person standing committee that is rebuilding our department's required first-year survey, History of the World Since 1300. The dean's charge to us was deliberately awkward: produce a course that does not take any one region's vantage point as the default. Two years in, we still have no written criterion for what counts as Eurocentric framing — only a pile of rulings on individual proposals, each recorded with its reasons in the minutes — and I have been asked to write the memo recommending how we should vote next Thursday on the last unresolved item. The trouble is that the more closely I read the minutes, the less sure I am that we have been applying one rule rather than several rules that have never yet been forced apart. The record so far:

  1. Rejected, unanimously: the old opening week, The Voyages of Discovery, which treated 1492 as the hinge of the course. Recorded reason: that vocabulary makes Europeans the only actors and everyone else the scenery they arrive to.
  2. Accepted with revision: a unit on the post-1492 exchange of crops, pathogens, and metals, provided it is organized around consequences in the Americas, West Africa, and Ming and Qing China rather than around voyages. Recorded reason: the subject matter was never the objection to item 1; the center of gravity was.
  3. Rejected: a draft chapter introducing Benin, Kongo, and Great Zimbabwe in the fifteenth to seventeenth centuries, each polity entering the narrative at the moment of Portuguese contact and characterized by what it sent to Lisbon. Recorded reason: on that structure, non-European pasts begin when Europeans show up and borrow their significance from them.
  4. Accepted: the comparative unit in week 10 built on the contrast Pomeranz pressed between England and the Yangzi Delta around 1800 — two advanced regions under similar ecological constraints, separated afterwards by coal and by access to colonial land. Recorded reason: it denies Europe an internal destiny, and it treats the two as commensurable cases rather than as one normal and one belated.
  5. Rejected: an examination question asking students to explain why some regions modernized earlier than others. Recorded reason: it converts one region's trajectory into a clock and grades everybody else against it.
  6. Accepted: a unit on Lancashire's industrialization whose explanatory weight sits on plantation slavery, raw cotton, colonial markets, and the displacement of Indian Ocean textile production — Europe as the site of the event rather than its cause. Recorded reason: a European setting is not by itself an indictment; what we object to is the endogenous-superiority story, and this is the reverse of what Blaut attacked as diffusionism.
  7. Accepted, three to two: keeping a single chronological spine, with all regions discussed in the same weeks, rather than running four parallel regional strands that never meet. Majority reason: simultaneity is itself the corrective, and a course that never converges is five parochialisms side by side. The dissent, recorded in full, was that a single spine requires a single narrator and that there is no vantage from which the whole can be told fairly.

  The item I have to write about is this. A colleague proposes as the closing week a capstone titled Why Europe? The Global Origins of the Modern World. Its content is almost entirely non-European — the Potosí mita and the silver that reached China through Manila, Caribbean sugar and the labor that produced it, Ottoman and Qing fiscal strain, coal geography, Indian textile output and its eclipse — but it keeps Europe as the grammatical subject of the question, it is placed last so that the preceding thirteen weeks can be read backwards as the run-up to it, and it ends by asking students to adjudicate among rival answers. I cannot tell which way our own record points. Items 4 and 6 look structurally similar and were approved; items 3 and 5 look similar in some other respect and were rejected; and my intuitions flip depending on which minute I read last.

  So: what should the memo recommend, and on what ground? Please (a) lay out the candidate criteria we could be running — agency and perspective, diffusionism, norm-and-deviation or historicist time, the shape and endpoint of the arc, proportion of coverage, endogenous versus global causation — and test each against all seven rulings rather than only the ones that flatter it, saying where it fits cleanly and where it strains; (b) identify which of items 1 through 7 is the closest analog to the capstone and defend that choice against the runner-up; (c) give me your best prediction of the vote, including the likely margin and which members the argument would have to move; (d) state plainly what principle we would be adopting if we approve and what different principle if we reject — in particular, whether approving commits us to holding that a question may have a European subject provided its answer is global, and whether rejecting commits us to reopening items 4 and 6, which share that structure; (e) tell me whether the dissent in item 7 is a live objection to this capstone or a worry that dissolves once you see what the capstone actually does; and (f) construct one further proposal we have not yet seen on which your two leading criteria give opposite verdicts, so that we can force the issue before the vote rather than after it. Rank the criteria by how much work each is doing in the record; please do not report all of them as equally plausible.
reasoning: |-
  Hmm, the user is part of a five-person committee tasked with redesigning a world history course to avoid Eurocentrism. They're struggling to define consistent criteria from past rulings and need to recommend a vote on a controversial capstone unit titled "Why Europe? The Global Origins of the Modern World." 

  The user's request is incredibly thorough - they want me to analyze seven prior decisions, extract underlying principles, apply them to the capstone proposal, predict voting outcomes, and even design a test case. This is clearly someone deeply engaged in decolonial pedagogy, wrestling with how to structurally dismantle Eurocentrism rather than just perform inclusion. 

  Looking at the minutes, I notice three patterns emerging:
  First, the committee consistently rejects frameworks where Europe is the default subject/agent (items 1,3,5). Second, they accept European-focused content only when Europe is positioned as an outcome rather than a source (items 4,6). Third, there's tension between global simultaneity (item 7 majority) and multiperspectivism (item 7 dissent). 

  The real friction point is grammatical framing. The capstone's content is globally distributed (good!), but its question ("Why Europe?") reinstalls Europe as the subject of history (problematic per items 1,3,5). This creates cognitive dissonance - the answer may be anti-Eurocentric, but the question itself centers Europe. 

  For the vote prediction, I'd wager 3-2 rejection. The members who approved item 7's single chronology might swallow the grammatical framing as the "cost" of convergence, but those who dissented in item 7 will see this as narrative imperialism. The colleague proposing this likely comes from global history tradition (Pomeranz etc.), not realizing how the question's syntax undercuts their intent.

  If approved, we'd establish that European-centric questions are permissible if answers are global - but this risks backsliding into diffusionism. If rejected, items 4 and 6 remain intact because they examine Europe as case study rather than telos. The capstone's placement as endpoint is its fatal flaw - it makes Europe history's destination.

  The dissent in item 7 absolutely applies here. A question like "Why Europe?" presumes a god's-eye narrator capable of answering it - precisely what the dissent warned against. Better to ask "How did these globally dispersed factors converge to produce industrial capitalism in certain regions?" 

  For the test case: propose a unit on "The Rise of the West" attributing it to colonial resources and enslaved labor. Content-wise identical to approved items 4/6, but the title would trigger rejection for reinstalling European exceptionalism through grammatical framing. This exposes how syntax matters as much as content.

  Ultimately, this isn't about "coverage" but narrative architecture. The committee's record suggests they understand Eurocentrism as a grammatical structure, not just a content bias. My recommendation must honor that insight.
answer: |-
  Based on a thorough analysis of your committee's rulings, I recommend **rejecting the "Why Europe?" capstone proposal**, using the following framework:

  ### (a) Candidate Criteria Ranked by Explanatory Power (Tested Against All 7 Rulings)
  1. **Grammatical Agency & Narrative Subject**  
     *Fits:* 1 (Europeans as sole actors), 3 (non-Europeans defined by European contact), 5 (Europe as benchmark), 7 (single narrator risk)  
     *Strains:* None. Best predictor: Rejections occur when Europe is the *subject* of action/analysis.

  2. **Historicist Time (Europe as the "Clock")**  
     *Fits:* 1 (1492 as hinge), 5 ("earlier modernization" benchmark), 7 (dissent re: single timeline)  
     *Strains:* 4 (commensurable cases avoid hierarchy)  

  3. **Endogenous vs. Global Causation**  
     *Fits:* 4 (denies internal destiny), 6 (Europe as site, not cause), 2 (consequences-focused)  
     *Strains:* 3 (rejected despite potential global links)  

  4. **Norm/Deviation Framing**  
     *Fits:* 4 (avoids "normal/belated"), 5 (rejects grading others)  
     *Strains:* 6 (approved despite European focus)  

  5. **Diffusionism**  
     *Fits:* 6 (explicitly anti-diffusionist)  
     *Strains:* 4 (comparison ≠ diffusion)  

  6. **Proportion of Coverage**  
     *Fits:* None (rejected items aren't Europe-heavy)  
     *Strains:* All (coverage ≠ the issue; e.g., item 6 is Europe-centric but approved)  

  **Ranking Justification:** Grammatical agency explains *all* rejections (1,3,5,7-dissent) and approvals (2,4,6) consistently. Historicist time is secondary. Causation/norm criteria explain approvals but not rejections.

  ---

  ### (b) Closest Analog & Runner-Up
  - **Closest Analog: Item 5** (Rejected: "Why some regions modernized earlier")  
    Both frame Europe as the implicit benchmark ("modernized earlier" = Europe first; "Why Europe?" = Europe as unique outcome). Both convert history into a race with Europe as the finish line.  
  - **Runner-Up: Item 3** (Rejected: African polities entering at Portuguese contact)  
    Similar in making non-European history significant only through European lens, but differs by being *content*-centric rather than *question*-centric.  
    **Defense:** Item 5 is stronger parallel because the capstone’s *interrogative framing* ("Why Europe?") is the core offense, mirroring Item 5’s premise that "earlier modernization" requires explanation while European timing is the default.

  ---

  ### (c) Vote Prediction
  - **Likely Outcome: 3-2 REJECTION**  
  - **Movable Voter:** Member who joined Item 7 majority (single spine) but approved Item 6 (Europe-as-site). They may initially see the capstone as a convergent endpoint.  
  - **Opposed:** The two Item 7 dissenters (fear single narrator) + one Item 7 majority member (consistent on agency).  
  - **For:** Proposer + one Item 7 majority member (prioritizes cohesion).  
    **Key:** Argument must stress that grammatical subject ≠ narrative cohesion. Offer alternative framing (see f).

  ---

  ### (d) Principles Adopted
  - **If APPROVED:** "A European-centric *question* is permissible if the *answer* is globally sourced."  
    - **Commitment:** Would *not* require reopening Items 4/6 (which analyze Europe without making it the *subject* of the course’s central question).  
  - **If REJECTED:** "The grammatical subject of the course’s central narrative must not default to Europe, even when content is global."  
    - **Consistency:** Aligns with rejections of Items 1,3,5. Does *not* undermine Items 4/6 (which treat Europe as a *case*, not the *protagonist*).  

  ---

  ### (e) Item 7 Dissent Relevance
  - **Live Objection:** The dissent *directly applies*. The capstone’s title ("Why Europe?") presumes a narrator capable of answering this Eurocentric meta-question. It forces all prior weeks into a "run-up" to Europe’s ascendance, enacting the "single vantage point" the dissent warned against.  
  - **Does NOT dissolve** because the capstone’s *structure* (final position, backward reading) amplifies this, even with non-European content. The question’s syntax dictates hierarchy.

  ---

  ### (f) Test Proposal to Force Criteria Conflict
  - **Proposal:** "The Global Industrial Moment: Lancashire, Bengal, and Saint-Domingue (1780-1830)"  
  - **Conflict:**  
    - *Grammatical Agency:* **REJECT** (Europe first-named, grammatical subject: "Lancashire’s industrialization linked to...").  
    - *Global Causation:* **APPROVE** (explicitly treats industrialization as a globally embedded event).  
  - **Purpose:** Exposes whether grammatical agency (your strongest criterion) trumps causation when they conflict. Forces clarity before the capstone vote.

  ---

  ### RECOMMENDATION
  **Memo should advocate REJECTING the capstone** on grounds of **grammatical agency/narrative subject**: The question "Why Europe?" reinstates Europe as history’s protagonist, violating your core criterion (evident in Items 1,3,5 rejections). The global content is laudable but incidental to the framing offense. 

  **Proposed Alternative:**  
  Retitle to **"Coal, Colonies, and Capital: Convergences in Global Transformation (1750-1850)"**  
  - Same content, but replaces "Why Europe?" with a global subject.  
  - Avoids making prior weeks a "run-up" by framing industrialization as a *convergence* (Item 7 majority’s vision) rather than a *destination*.

  This preserves the capstone’s analytical rigor while adhering to your committee’s consistent rejection of Europe as the default subject of historical inquiry.
