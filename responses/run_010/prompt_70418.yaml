answer: |-
  1. **Setup and materials**: For 12 pairs: Role cards labeled "A" and "B", each with a private scenario and preference ranking (A: z > x > y; B: y > z > x) framed as relatable choices (e.g., A controls book selection, B controls movie choice, with shared pizza); worksheets to record rankings and token tallies; tokens (e.g., paper clips).  

  2. **Preference-profile generator and payoff scheme**: All pairs share identical fixed preferences: A ranks outcomes z (ideal book/movie combo) > x (okay book/annoying movie) > y (bad book/annoying movie); B ranks y (ideal) > z (good) > x (worst). Tokens awarded per pairwise match: 1 token if social ranking of a pair (xy, yz, or xz) aligns with a student’s private ranking.  

  3. **Two phases and rules**:  
     - **Phase 1 (fixed spheres)**: By fiat, A decides between x and y (same movie), B decides between y and z (same book); transitivity forces x > y > z. Record ranking.  
     - **Phase 2 (tradeable/waivable spheres)**: Pairs negotiate to trade or waive decisiveness rights (e.g., A swaps book control for movie control). Rebuild social ranking using new assignments (waived rights decided by mutual agreement or coin flip). Record new ranking.  

  4. **Debrief mapping**:  
     - Fixed spheres: A’s x>y choice and B’s y>z choice illustrate *minimal liberalism*; the resulting x>z vs. both preferring z>x exposes *Pareto violation*.  
     - Tradeable spheres: Trades repair Pareto (e.g., if B controls xy and A controls yz, new ranking z>y>x avoids conflict) but relocate liberalism (control shifts); waivers risk deadlock (unresolved pairs).  

  5. **Failure modes and irreproducible feature**:  
     - **Transitivity ignored**: Students skip deducing x>z → enforce completeness via worksheet prompts.  
     - **Trade stalemate**: Pairs hoard rights → incentivize tokens by pre-calculating gains (e.g., trade yields +1 token each).  
     - **Overlooked conflict**: Students miss x>z vs. z>x tension → require explicit pairwise checks in phase 1.  
     - **Irreproducible feature**: *Profile generality*—the paradox requires all possible preferences, not just this profile; explain post-game.
