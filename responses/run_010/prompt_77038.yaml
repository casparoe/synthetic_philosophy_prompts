  Non-negotiable requirements: Statewise dominance (Mirror-plus-one dominates Mirror, so must be better). Weak Pareto (if one option is better in all states, it should be preferred). Symmetry (Mirror game should be valued at zero). Truncation consistency (as N increases, decisions should stabilize). Finite EV preservation. Practical guidance for bounded agents.

