  The user's deeper needs: They want a clear framework to evaluate decision theories, highlighting trade-offs. They need to present the landscape for readers, showing which requirements force which choices. Identifying conflicts helps structure the chapter, showing why no single solution satisfies all.

  I should list each requirement with a motivating case, mark non-negotiables, and note conflicts. Then, summarize how different approaches (REU, truncation, bounded utility, incomparability) handle these. The scorecard will help compare theories. Key conflict: Bounded utility avoids issues but is restrictive. Without it, maintaining statewise dominance and truncation consistency is tricky, leading to potential incomparability or exploitation.
answer: |-
  Here's a breakdown of requirements for a decision theory handling gambles with undefined expected value (UEV), motivated by your cases and core concerns. Requirements are categorized as **Non-Nnegotiable (NN)** or **Negotiable (N)**, reflecting foundational consistency versus theoretical choices.

  ### Core Requirements (Non-Negotiable: NN)

  1.  **Statewise Dominance (Weak Pareto):**
      *   **Motivation:** Mirror-plus-one dominates Mirror game statewise (every outcome is $1 better). Any adequate theory *must* rank Mirror-plus-one strictly above Mirror game. Violation implies the theory ignores clear local improvements.
      *   **NN Reason:** Fundamental to rationality. Ignoring guaranteed improvement in every possible world is indefensible.

  2.  **Weak Symmetry Respect:**
      *   **Motivation:** Mirror Game. The gamble's inherent symmetry (via the outer coin flip) strongly suggests a value of zero. A theory *must* assign the Mirror Game a value equivalent to status quo (or zero utility change).
      *   **NN Reason:** Captures the core intuition that perfectly symmetric opposing forces cancel out. Ignoring this symmetry renders the theory unable to handle the foundational Pasadena case meaningfully.

  3.  **Finite EV Preservation:**
      *   **Motivation:** "The boring end." The theory must correctly handle standard gambles with finite expected value, reproducing standard Expected Utility Theory (EUT) results for these cases. It cannot distort comparisons between finite-EV gambles or between finite-EV and UEV gambles in obviously wrong ways (e.g., claiming a sure $10 is worse than a gamble with known EV $5).
      *   **NN Reason:** A theory failing for well-defined cases loses credibility as a *general* decision theory.

  4.  **Truncation Consistency / Limit Stability:**
      *   **Motivation:** Truncation Vulnerability & Practical Guidance. For any UEV gamble G, consider its truncation G_N (stop after N flips/terms, assign 0 or some continuation value beyond). As N increases, the preference ordering induced by evaluating G_N must converge/stabilize. Furthermore, this limit ordering must be consistent with the theory's direct evaluation of G (if it has one). Crucially, the theory must not be *vulnerable to money pumps* based on knowing the agent's truncation point N.
      *   **NN Reason:** 1) **Practical Guidance:** Bounded agents *must* use some finite approximation (like truncation). The theory must tell them *what to do*, and the recommendation should stabilize as computational resources (N) increase. 2) **Rationality Defense:** Vulnerability to a money pump based purely on patience/computation is a fatal flaw, demonstrating dynamically inconsistent preferences exploitable by a clever bookie.

  5.  **Non-Collapse (Avoid Universal Incomparability):**
      *   **Motivation:** "No collapsing into 'everything unbounded is incomparable'." The theory must be able to compare *some* UEV gambles to each other and to finite-EV gambles or sure things (as required by Statewise Dominance, Symmetry, and Finite EV Preservation). It cannot declare *all* UEV gambles simply incomparable.
      *   **NN Reason:** We have strong intuitions (Mirror=0, Mirror-plus-one > Mirror) that demand comparability. A theory declaring everything incomparable abdicates its core function for the very cases it's meant to address.

  ### Negotiable Requirements (N) - Priors of Camps

  6.  **Utility Boundedness:**
      *   **Motivation:** Preventing divergence. Many UEV problems vanish if utility is bounded (e.g., u(wealth) = 1 - exp(-k*wealth)). The integral defining EV converges. (Mirror: converges to 0; Mirror-plus-one converges to 1).
      *   **N Reason:** While a powerful *fix*, assuming boundedness is a substantive restriction. It answers "why does EV diverge?" by asserting "it shouldn't, your utility function is misspecified". Some find this elegant; others find it unrealistic or question the psychological plausibility of absolute bounds. It precludes true linear utility over unbounded wealth, which is a common modeling assumption.

  7.  **Totality of Ordering:**
      *   **Motivation:** Complex UEV gambles. Must the theory always declare one gamble better, worse, or indifferent to another? Or can it sometimes say "these are incomparable"?
      *   **N Reason:** Totality is elegant and simplifies representation. However, some argue that certain UEV gambles are genuinely incomparable (e.g., a Pasadena gamble vs. a different UEV gamble with divergent characteristics). Relaxing totality might be necessary to satisfy other requirements without paradoxes. (Statewise Dominance still forces comparability *when it applies*).

  8.  **Real-Valued Utility Representation:**
      *   **Motivation:** Numerical guidance. Does the theory need to assign a single real number (a "value") to gambles, or can it operate with preference orderings directly, perhaps represented by vectors, intervals, or other structures?
      *   **N Reason:** Real numbers are standard and intuitive. However, for UEV gambles, a single real number might be inadequate or misleading. Some theories (e.g., rank-dependent) use modified functionals; others might use lexicographic orders or sets of values. The core requirement is a consistent *preference ordering* (potentially partial), not necessarily a real-valued representation.

  9.  **Strong Symmetry / Invariance to Grouping:**
      *   **Motivation:** Mirror Game grouping. Should the value *only* depend on the final probability distribution over outcomes, not on how states are grouped or described (like the outer coin flip)?
      *   **N Reason:** EUT satisfies this (state descriptions don't matter, only prob(x)). Some proposed UEV fixes (e.g., certain limiting procedures) might violate it, assigning different values based on "natural" groupings. While invariance is desirable, relaxing it *might* be a pragmatic cost of handling UEV within a representational framework.

  ### Conflicts & The Boundedness Culprit

  *   **The Core Conflict:** Satisfying **Statewise Dominance (NN)**, **Symmetry (NN)**, **Truncation Consistency (NN)**, and **Non-Collapse (NN)** simultaneously is extremely challenging *without* assuming **Utility Boundedness (N)**.
  *   **Why Boundedness "Does the Damage":** With unbounded utility, the divergent tails of UEV gambles create fundamental instability. Truncation sequences (G_N) for gambles like Pasadena or Mirror can oscillate wildly in value (e.g., alternating large positive and negative finite EVs). This directly threatens Truncation Consistency – the limit might not exist, or preferences based on G_N might flip infinitely often, creating money pump vulnerability. Relaxing Totality (allowing incomparability) or Strong Symmetry might offer escape hatches, but they conflict with intuitions or desired properties. Bounded utility tames the tails, ensuring truncations converge smoothly to a stable limit satisfying all other NN requirements.
  *   **Specific Conflict Example (Truncation Vulnerability):** Suppose an unbounded-utility theory uses finite N truncation for decisions. For the Mirror Game, G_N might be positive for even N and negative for odd N. An adversary could:
      1.  When N is even (agent values G > 0), offer to "sell" G for $0.10.
      2.  When N is odd (agent values G < 0), offer to "buy" G back for $0.10.
      3.  Repeat. The agent pays $0.20 per cycle, losing money indefinitely despite each trade seeming acceptable given their current N.
      This violates **Truncation Consistency / Stability (NN)** and demonstrates irrationality. Bounded utility prevents this oscillation.

  ### Decision Theory Scorecard (Handling UEV Gambles)

  | Approach                   | Key Idea                                     | Statewise Dom. (NN) | Symmetry (NN) | Truncation Consistency / Limit Stability (NN) | Non-Collapse (NN) | Boring EVs (NN) | Bounded Util (N) | Totality (N) | Real Val. (N) | Notes                                                                 |
  | :------------------------- | :------------------------------------------- | :------------------ | :------------ | :-------------------------------------------- | :---------------- | :-------------- | :--------------- | :---------- | :------------ | :-------------------------------------------------------------------- |
  | **Bounded Utility**        | Assume |U(x)| < B for all x.    | ✅                  | ✅             | ✅                                              | ✅                 | ✅               | **Assumed**      | ✅           | ✅             | "Solves" UEV by making EV converge. Strong assumption.                |
  | **Relative Expected Util (REU)** | Use a risk-weighted avg. of utilities.       | ✅                  | ⚠️ (Context)  | ⚠️ (Often)                                     | ✅                 | ✅               | ❌                | ✅           | ✅             | Handles some UEV; symmetry/value can depend on structure/grouping.    |
  | **Cauchy Principal Value** | Symmetric limit for alternating series.      | ❌ (e.g., Pasadena) | ✅             | ❓ (Depends)                                   | ✅                 | ❌ (Pasadena=0?) | ❌                | ✅           | ✅             | Fails Statewise Dom. (e.g., Pasadena vs Pasadena+1 both have PV=0). |
  | **Incomparability**        | Declare many UEV gambles incomparable.       | ✅ (When applies)   | ✅ (Often)     | ❌ (N/A or Weak)                               | ❌                 | ✅               | ❌                | **❌**       | ❌ (Often)     | Avoids contradictions but fails Non-Collapse & practical guidance.    |
  | **Finitistic / Construction** | Value defined only via construction rules.   | ✅                  | ⚠️ (By Fiat?) | **Core Logic**                                | ✅                 | ✅               | ❌                | ⚠️ (Often)   | ❌ (Often)     | Focuses on what bounded agents *do*; may lack unified representation. |
  | **Dominated Convergence**  | Only define EV if |u(x)| dominated by integrable fn. | ✅ (Implicit) | ⚠️ (Implicit)  | N/A (Rejects UEV)                               | ❌ (Rejects UEV)   | ✅               | **Implied**      | ✅           | ✅             | Mathematically clean but rejects UEV gambles as undefined/invalid.    |

  **Legend:** ✅ = Satisfies, ❌ = Violates, ⚠️ = Partially Satisfies or Depends on Formulation, ❓ = Unclear/Varies

  ### Summary for Your Chapter

  A theory *must* satisfy the **Non-Negotiable (NN)** requirements: Statewise Dominance, Weak Symmetry (for cases like Mirror), correct handling of Finite EVs, Truncation Consistency/Limit Stability (including money-pump resistance), and Non-Collapse. The central tension arises because unbounded utility makes satisfying these simultaneously very hard, often leading to oscillation in truncations and vulnerability. **Bounded utility is the most effective way to resolve this tension**, but it's a substantive assumption **(N)**. Alternatives involve trade-offs: relaxing totality (incomparability), relaxing strong symmetry/grouping invariance (REU, some finitistic views), or rejecting UEV gambles entirely (dominated convergence). Your cases (Mirror, Mirror-plus-one, Truncation vulnerability) perfectly expose these core conflicts and the pressure bounded utility exerts. The scorecard highlights the key trade-offs of major approaches.
