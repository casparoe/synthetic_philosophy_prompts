prompt: |-
  I am a postdoc in an evolutionary-biology group, and I am drafting the section of a joint review that assigns biological systems to levels of selection. My supervisor, whom I will call Professor N., has been remarkably consistent over a decade of lab meetings and graduate teaching about which collectives she is willing to call units of selection, and I have to write up a new case before she sees the draft. I want a reconstruction and a prediction from you, not a survey of the debate; I don't need references or a reading list.

  Her verdicts so far, with the remark she made on each when she made one:

  1. A monogynous ant species with a permanently sterile worker caste, one singly-mated queen per nest, workers that destroy any eggs laid by other workers, and daughter colonies produced by fission in which a single queen is led away by her own daughters. **Yes** — the colony is a unit of selection and an individual in the literal sense. Her remark: "the workers no longer have a fitness of their own."

  2. A polygynous ant species whose nests are started each season by several unrelated queens who cooperate, end up with dozens of queens, and whose workers police one another's eggs just as efficiently as in species 1. **No.** Her remark: "a shared nest, not a body."

  3. *Dictyostelium* fruiting bodies, assembled each time from tens of thousands of amoebae drawn from many clones, roughly a fifth of which become the sterile stalk, and in which cheater strains that bias their own allocation to the spore mass are well documented. **No.** Her only addition was that the composition of a fruiting body is a matter of luck.

  4. A flow-cell biofilm grown up from one cell, hence perfectly clonal, in which matrix production is a costly public good, non-producing mutants arise and rise in frequency inside the biofilm, and cells slough continuously into an effluent that is discarded, so nothing downstream ever founds anything. **No.** Her remark: "clonality is not individuality."

  5. A metapopulation of pond snails: patches colonized by one or two founders, frequent local extinction, and residents free to emigrate to other patches whenever they like. **No.** Her remark: "a place, not a thing."

  6. A shoal of reef fish that assembles each morning from the same local population and dissolves at dusk; shoal size has genuinely non-additive effects on predator detection and confusion, and shoals differ markedly in survival. **No**, with no remark.

  7. A lichen propagated by soredia, each of which carries both partners, whose photobiont is not known to exist free-living, and neither of whose partners can establish the thallus alone. **Yes** — one individual, two genomes.

  The case I have to rule on is devil facial tumour disease in Tasmanian devils. So that we are arguing about the same thing, I stipulate its features: the cancer is transmitted not by a virus but by the living tumour cells themselves, passed mainly in bites; a tumour in a new host is founded by a small inoculum of cells from an existing tumour; those cells are allogeneic to their host and are nonetheless not rejected; the disease is a single clonal lineage descended from one devil's Schwann cell a few decades ago, and a second, genetically distinct clonal lineage now circulates in another part of the island; assume our collaborators' deep sequencing recovers several subclones competing within a single host's tumour, and that the subclone which dominates inside a host is not the subclone best at reaching the next host, because fast-growing subclones tend to kill the host before it has bitten enough neighbours to transmit; and nothing in the tumour polices its own cells — any cell is in principle able to found a new infection.

  What I need:

  (a) Name the candidate rules — using the standard vocabulary of the levels-of-selection debate where it has one — that are consistent with all seven verdicts *and* with the pattern of her remarks. Give me at least three, say which of her remarks each is meant to capture, and say which superficially attractive rules her track record has already excluded and by which verdict.

  (b) For each rule that survives, state its verdict on the devil tumour, and set out explicitly where the rules *diverge* rather than where they agree.

  (c) Give your best single guess at what she will say, with reasons drawn from the pattern of her seven verdicts and glosses rather than from which rule you find most plausible in the abstract. If you think those seven genuinely underdetermine this case, say so, and say what the residual uncertainty consists in. If your conclusion is that she is equivocating between two senses of "unit of selection," that is a substantive answer and I want it argued rather than announced.

  (d) Name one further case — a real system, or a stipulated one if you need to hold a variable fixed — that would discriminate between your two leading rules, and state what she would be committed to saying about it under each.

  (e) Tell me what would change your mind: which single consideration, or which detail about the devil tumour that I may have described wrongly or left out, would flip your prediction — and where your reconstruction of her criteria is most likely to be wrong, for instance if her remarks express a temperament rather than a criterion, or if she is in fact running two rules and switching between them without noticing.
reasoning: |-
  Hmm, the user is a postdoc in evolutionary biology who needs to predict their supervisor Professor N's stance on whether devil facial tumour disease qualifies as a unit of selection. They've provided seven clear examples of Professor N's previous verdicts with remarks, and now need to apply this pattern to the devil tumour case.

  Looking at Professor N's pattern: she consistently rejects "collectives" that lack either reproductive bottleneck (like polygynous ants), functional integration (like Dictyostelium), or physical boundedness (like snail metapopulations). Her approvals require either evolutionary irreversibility (monogynous ant workers) or obligate symbiosis (lichen). The biofilm case shows clonality alone isn't sufficient, and the shoal example confirms that even functional collectives aren't units if transient.

  For the devil tumour, several key features stand out: it's a single clonal lineage with subclone competition, transmission occurs through biting, and fast-growing subclones actually hinder transmission by killing hosts too quickly. Crucially, there's no policing mechanism - any cell can potentially found a new tumour.

  The rules that best fit Professor N's pattern appear to be: 
  - Bottlenecked Reproduction (requires reproductive specialization and bottleneck at transmission)
  - Obligate Germ-Soma Division (requires irreversible specialization where only certain parts reproduce)
  - Functional Integration with Policing (requires mechanisms suppressing internal conflict)

  Applying these to the tumour: 
  - Bottlenecked Reproduction fails because any cell can transmit
  - Obligate Germ-Soma Division fails because no specialized "transmission cells" exist
  - Functional Integration fails due to lack of policing

  The shoal verdict suggests that even if tumour transmission had bottlenecks, the lack of policing might still disqualify it. The biofilm case confirms that clonality without functional integration isn't enough.

  I think Professor N will reject the tumour as a unit of selection because it lacks both reproductive specialization and conflict suppression. The biofilm case is particularly telling here - she explicitly dismissed clonality as insufficient for individuality. The closest analogy is the Dictyostelium rejection due to "luck-based" composition, which applies to the tumour's transmission too.

  To test these rules, a hypothetical "tumour with transmission specialists" case would be decisive: if she accepts that, Bottlenecked Reproduction wins; if not, Obligate Germ-Soma Division is stronger. Her remark about ant workers "losing their fitness" suggests the latter might be her true standard.
answer: |-
  Based on Professor N's consistent pattern across seven verdicts and her specific remarks, I reconstruct her underlying criteria and predict her verdict on devil facial tumour disease (DFTD). The key is recognizing that she prioritizes **functional integration and evolutionary irreversibility of specialization** over mere clonality, group benefit, or statistical selection. Her rejections consistently target systems lacking *organism-like* attributes, even when selection acts at the collective level.

  ### (a) Candidate Rules Consistent with All Seven Verdicts
  1. **Irreversible Germ-Soma Division with Bottlenecked Reproduction**  
     - *Captures:* "workers no longer have a fitness of their own" (1), "clonality is not individuality" (4), "a place, not a thing" (5).  
     - *Requires:* A subset of units (germ line/reproductives) *exclusively* responsible for collective propagation, with somatic units *permanently* incapable of independent reproduction. Transmission must occur via a bottleneck (e.g., fission, specialized propagule).  
     - *Excluded rules:* "Selection acting at level X" (rejected for biofilm/shoal despite selection); "Clonality" (rejected for biofilm); "Mutual dependency" (rejected for Dictyostelium despite cooperation/cheating).

  2. **Obligate Functional Integration with Policing**  
     - *Captures:* "a shared nest, not a body" (2), "composition is matter of luck" (3), "clonality is not individuality" (4).  
     - *Requires:* Mechanisms suppressing within-collective conflict (e.g., policing, obligate mutualism) ensuring collective fitness is not undermined by selfish components. Collectives must be discrete, bounded entities ("things," not "places").  
     - *Excluded rules:* "Multilevel selection" (rejected for polygynous ants/shoals despite group selection); "Emergent fitness" (rejected for shoal despite non-additive survival effects).

  3. **Evolutionary Individuality via Developmental Bottleneck**  
     - *Captures:* "one individual, two genomes" (7), "the colony is an individual" (1), "a shared nest, not a body" (2).  
     - *Requires:* Collectives originating from a *single propagule* (bottleneck) and developing into a functionally integrated whole with co-adapted traits. Rejects aggregates assembled from multiple independent lineages.  
     - *Excluded rules:* "Trait-group selection" (rejected for snail metapopulations/shoals); "Clonal expansion" (rejected for biofilm).

  ### (b) Verdicts on Devil Tumour and Divergence
  | **Rule**                          | **Verdict on DFTD** | **Reason for Verdict**                                                                 | **Where Rules Diverge**                                                                                                |
  |-----------------------------------|---------------------|---------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|
  | **Irreversible Germ-Soma Division** | **NO**              | No germ-soma separation: *any* tumour cell can found a new infection. No bottleneck (inoculum is arbitrary fragment). | Vs. Rule 2: Doesn't require policing if germ-soma is fixed. Vs. Rule 3: Allows multi-lineage systems if bottlenecks exist (e.g., lichen). |
  | **Obligate Functional Integration** | **NO**              | No policing: selfish subclones (fast growers) undermine transmission fitness without suppression. Tumour is not a bounded "thing" but a parasitic aggregate. | Vs. Rule 1: Accepts multi-queen ants if policing existed. Vs. Rule 3: Rejects clonal biofilms despite bottleneck. |
  | **Developmental Bottleneck**        | **NO**              | Tumour lacks developmental trajectory: inoculum doesn't "develop" into a structured whole; subclones compete opportunistically. | Vs. Rule 1: Accepts polygynous ants if founded by one queen. Vs. Rule 2: Doesn't require policing (e.g., lichen soredia lack internal policing). |

  **Divergence Highlight**: Rule 1 (germ-soma) focuses on *reproductive role irreversibility*; Rule 2 (policing) on *conflict suppression*; Rule 3 (bottleneck) on *origins and development*. DFTD fails all three: cells are totipotent, subclones conflict freely, and "inoculum" is not a specialized propagule.

  ### (c) Best Guess for Professor N's Verdict: **NO**  
  **Reasons from pattern**:  
  - She rejects **clonality without individuality** (biofilm: "clonality is not individuality" applies directly to DFTD).  
  - She rejects **aggregates lacking policing** (Dictyostelium: "matter of luck" mirrors tumour subclone competition).  
  - She requires **functional indivisibility** (polygynous ants: "not a body" vs. monogynous ants as "literal individual"). DFTD is a disorganized cell mass.  
  - Her "**fitness of their own**" remark (1) is pivotal: Tumour subclones *do* have fitness (within-host growth vs. transmission), unlike ant workers.  
  - **Residual uncertainty**: Whether "one clonal lineage" (despite subclones) parallels lichen's "two genomes but one individual." But lichen's obligate co-development and propagule bottleneck are absent here. Her biofilm rejection suggests clonality is insufficient without higher-order organization.  

  **Prediction**: She will say: *"A parasitic cell line, not an individual. The subclones still have their own fitness, and there’s no body to regulate them."*

  ### (d) Discriminating Case: **A Social Amoeba with Enforced Germ-Soma Bottleneck**  
  - *Stipulated system*: A *Dictyostelium*-like organism where **spores derive only from a subset of cells that undergo irreversible differentiation before aggregation**, and **somatic cells (stalk) are precluded from sporulation by a molecular mechanism (e.g., a toxin-antidote system)**. Assume clonal mixtures occur, but only "germ-line" cells transmit.  
  - **Rule 1 (Germ-Soma)**: YES. Meets irreversible reproductive specialization + bottleneck.  
  - **Rule 2 (Policing)**: NO/Uncertain. Germ-soma is fixed, but no policing *within* germ line.  
  - **Rule 3 (Bottleneck)**: YES. Developmental bottleneck exists.  
  - *Her likely verdict*: **YES** (analogous to ants/lichen). This would confirm Rule 1 is primary, as it captures her emphasis on reproductive fate irreversibility.

  ### (e) What Would Change My Mind  
  - **Flipping the verdict**: If DFTD had **dedicated "transmission cells"** (e.g., a subset that migrates to bite sites and *only* those cells found new tumours), I would predict YES. This would mirror ant workers' lost fitness and lichen soredia.  
  - **Weakest link in reconstruction**: Her **lichen verdict** ("one individual, two genomes") might imply she accepts *genomic conflict* if developmentally channeled. If DFTD subclones were spatially/temporally segregated (e.g., "transmission-phase" cells with suppressed growth), she *might* accept it.  
  - **Likely error**: Overemphasizing *policing* (Rule 2). Her biofilm rejection ("clonality is not individuality") suggests **developmental integration**, not just policing, is key. If she prioritizes Rule 3, DFTD fails more decisively.  
  - **Temperament**: She seems to **anthropomorphize "individuality"** (e.g., "body," "thing"). DFTD’s lack of structure and totipotent cells violates this intuition.  

  **Conclusion**: DFTD fails Professor N's threshold for "unit of selection" due to absent reproductive specialization, internal conflict, and developmental disorganization. Her pattern suggests a **NO** verdict, grounded in evolutionary individuality requiring irreversible part-whole dependencies. Test with the social amoeba case to resolve Rules 1 vs. 3.
