answer: |-
  ### (1) Essay Question (55 minutes; 25 marks)
  > The Centerville Municipal Arts Council adopts a new grant requirement: all funded projects must submit a one-page "Statement of Political Purpose" identifying the specific social or political objective the artwork aims to advance. Council Chair Alistair Vance defends the rule, stating: "This aligns perfectly with W.E.B. Du Bois’s principle that all art is propaganda. If art *always* serves a political end, we have a right to know what end artists intend to serve with public funds."  
  >  
  > Critic Vera Krasna objects on two grounds. First, she argues that if Du Bois is correct that *all* art is inherently propaganda, then requiring artists to *declare* a political purpose is redundant—it adds no new information, merely bureaucratic theater. Second, she posits a "transparency dilemma": if an artwork openly declares its political aim, audiences will judge it solely on whether it *achieves that aim* (like scoring a checklist) rather than engaging with it aesthetically; conversely, if an artwork hides its aim (to avoid such reductive judgment), it becomes manipulative propaganda. Thus, a Du Boisian funder cannot demand transparency without undermining art’s power or integrity.  
  >  
  > **Analyze whether Du Bois’s assertion that "all art is propaganda" commits him to supporting Council Chair Vance’s funding rule. In your response:**  
  > (a) Explain whether Du Bois’s claim is descriptive (about what art *is*), normative (about what art *should be*), or both—and what *actually follows* for arts funding from each interpretation.  
  > (b) Resolve or dissolve Krasna’s "transparency dilemma" by critically examining her underlying assumptions about propaganda and artistic reception.  
  > (c) Address how Du Bois’s simultaneous defense of Black artists against charges of "didacticism" *and* his rejection of "art-for-art’s-sake" inform your analysis.  
  > *(Word limit: 600 words)*  

  ---

  ### (2) Model Answer (710 words)  
  Du Bois’s assertion that "all art is propaganda" cannot straightforwardly endorse Chair Vance’s funding rule because Du Bois uses "propaganda" not as a prescriptive blueprint for artists or institutions, but as a *descriptive critique of cultural power*. Krasna’s objections, while revealing tensions in institutionalizing his claim, rely on conflating distinct meanings of "propaganda," and Du Bois’s own commitments to both artistic freedom and political urgency dissolve her dilemma once his framework is properly contextualized.  

  **(a) Descriptive vs. Normative & Implications for Funding**  
  Du Bois’s claim operates simultaneously on descriptive and normative levels, but neither licenses Vance’s rule. Descriptively, he argues that art *always* emerges from and intervenes in social conditions, inevitably advancing (or reinforcing) ideologies—even "neutral" art propagates the status quo. Normatively, he insists that Black artists, facing systemic oppression, *should* consciously create art that challenges racial injustice. Crucially, however, this normativity is *responsive*: it counters white demands that Black art be "apolitical" while white art’s political biases go unscrutinized. For Du Bois, calling all art propaganda *exposes this double standard*, not that artists must telegraph intentions to funders. Vance’s rule misunderstands this: if art is *descriptively* propaganda, forcing declarations is indeed redundant (as Krasna notes), but if it’s *normative*, the rule imposes reductive, institutional definitions of "valid" politics onto artists—precisely the coercion Du Bois resisted when defending Black artists against white critics accusing them of "didacticism."  

  **(b) Resolving the Transparency Dilemma**  
  Krasna’s dilemma collapses because it equivocates on "propaganda." Her "redundancy" objection assumes propaganda means *rhetorically purposive* (aligning with Du Bois’s descriptive claim). But her "manipulation" objection shifts to propaganda as *covertly one-sided*, implying deceit. Du Bois, however, rejects the latter sense. For him, art’s political nature is often *unconscious* or *systemic*, not necessarily intentional subterfuge. The "transparency dilemma" thus falsely presumes that declaring an aim makes audiences judge *only* compliance, while hiding one makes art inherently deceptive.  

  Du Bois resolves this by reframing artistic reception. He does not demand audiences "score" art’s political efficacy, as Vance’s rule invites. Instead, he insists art be judged *holistically*—aesthetically *and* politically—by communities it represents. In defending Black art against charges of didacticism, he argues that form and content are inseparable; a protest song’s power lies in its emotional resonance, not just its message. Thus, for Du Bois, declaring a political aim (if done) shouldn’t reduce art to a checklist because the *artistic experience*—how form shapes perception—remains primary. Krasna’s "scoring" scenario arises only if institutions (like Vance’s council) instrumentalize art, divorcing aim from aesthetic enactment. Meanwhile, "manipulation" accusations often target marginalized artists whose politics disrupt dominant norms; Du Bois would note that white art’s "hidden" ideologies (e.g., portraying Black inferiority) are rarely deemed manipulative. The dilemma dissolves once propaganda is seen as inherent to all art’s social embeddedness, not a choice between declaration or deceit.  

  **(c) Du Bois’s Dual Commitments & Power Dynamics**  
  Du Bois’s rejection of "art-for-art’s-sake" and his defense against didacticism charges are not contradictory but dialectical. He rejects aesthetic autonomy because art’s political effects are inescapable in a racist society, yet he condemns didacticism to insist that Black art merits evaluation *as art*, not just as political speech. This tension clarifies why Vance’s rule misapplies him: Du Bois seeks to empower Black artists to set their *own* standards of beauty and purpose, free from white paternalism. Vance’s council, by dictating how artists must justify their aims, reinstates the very power dynamic Du Bois critiques—where institutions police what counts as "valid" politics.  

  Ultimately, Du Bois’s slogan challenges *who controls the criteria* for judging art. If "all art is propaganda," the issue isn’t forcing artists to declare aims (which, as Krasna rightly notes, risks bureaucracy or reductive scoring), but exposing how dominant groups weaponize accusations of "politicization" to silence marginalized voices. Vance’s rule perversely uses Du Bois to demand transparency from grantees while ignoring the council’s own unstated political biases in funding decisions. The true Du Boisian response would be to fund diverse artists without coercive declarations, then let audiences—especially those whose struggles the art reflects—engage with the work on their own terms, politically and aesthetically intertwined. Krasna’s dilemma only arises when institutions like the council instrumentalize art; for Du Bois, art’s propaganda function is a condition to be made conscious and democratic, not a lever for bureaucratic control.  

  ---

  ### (3) Marking Scheme (Total: 25 marks)**  
  **1. Descriptive/Normative Distinction & Funding Implications** (5 marks)  
  *   *Top:* Clearly distinguishes descriptive/normative, shows Vance’s rule misapplies both.  
  *   *Common Error:* Treats Du Bois as *only* normative, arguing he "would support Vance to promote political art."  

  **2. Splitting Propaganda’s Senses to Address Krasna** (6 marks)  
  *   *Top:* Identifies equivocation (rhetorical purpose vs. covert manipulation); uses Du Bois to reject deceit assumption.  
  *   *Common Error:* Accepts Krasna’s definition of propaganda as inherently deceptive.  

  **3. Resolving Transparency Dilemma via Reception & Form** (5 marks)  
  *   *Top:* Explains how Du Bois’s holistic judgment (aesthetic + political) dissolves "scoring" vs. "manipulation" binary.  
  *   *Common Error:* Concedes the dilemma is unsolvable under Du Bois or proposes a compromise (e.g., "artists should hint but not state aims").  

  **4. Du Bois’s Dual Commitments (Anti-didacticism vs. Anti-art-for-art’s-sake)** (5 marks)  
  *   *Top:* Shows how tension reframes power dynamics, exposing Vance’s rule as paternalistic.  
  *   *Common Error:* Only discusses one commitment (e.g., "Du Bois hates art-for-art’s-sake, so he’d support Vance").  

  **5. Synthesis: Power, Standards, and Institutional Critique** (4 marks)  
  *   *Top:* Locates the crux—Du Bois challenges *who sets standards*, making Vance’s rule a distortion of his project.  
  *   *Common Error:* Lists points without concluding how Krasna/Vance misunderstand Du Bois’s core intervention.  

  ---

  ### (4) A/B Boundary Note  
  An **A/A+ answer** (First-class) dissolves Krasna’s dilemma by exposing her definitional slippage *and* reframing the debate around Du Bois’s challenge to cultural authority, showing precisely how Vance’s rule reinstates the power imbalance Du Bois critiques. It seamlessly integrates his dual commitments into a coherent analysis of institutional overreach. A **B/B+ answer** (Competent) correctly identifies Du Bois’s descriptive/normative layers and resolves the dilemma by splitting "propaganda’s" meanings but may treat Du Bois’s "defense against didacticism" as separate from his institutional critique rather than foundational to it, or miss how the funding rule exemplifies the very control Du Bois resists.
