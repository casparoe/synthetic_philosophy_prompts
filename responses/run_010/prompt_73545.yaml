  The key challenges here are:
  - Mixed audience with different backgrounds (general reporters rusty on math, data journalists who think they know it all, editors who decide what gets published)
  - No laptops or breakout time
  - Need to make it practical ("reporting discipline" not "parlour trick")
  - Must address common misconceptions
  - Causal reasoning is tricky to handle in limited time

  For the structure, I'll start with why weighted averages matter before introducing the paradox. The career-changers example (Table 1) should be the primary carrier because the numbers are clean and the context is real journalism. We'll build the arithmetic step-by-step on the whiteboard.

  Important milestones:
  - First 15 mins: Make them feel why group sizes matter using simple percentage comparisons
  - Minute 20: Introduce the paradox formally when they're primed to see the reversal
  - Minute 45: Address the "confounding is obvious" objection by data journalists
  - Minute 70: Use the reading program example (Table 2) to show when the paradox rules fail
  - Last 5 mins: Separate takeaways for reporters and editors

  For the causal question in Table 2, I'll keep it simple: "Did the program put students in Chapter 12, or were they already good readers?" without diving into causal diagrams. The honest answer is we can't tell from the table alone - which becomes the reporting lesson.

  What to avoid: Fancy visualizations that distract from the arithmetic, and the Berkeley admission example which adds unnecessary complexity.

  Key reporter takeaway: "Always ask for the breakdown by subgroups that matter." Editor takeaway: "Ask what weights changed when we pooled the data."

  The data journalists need special handling - I'll challenge them to explain why the paradox still matters even if they know about confounding, emphasizing that it's about misinterpretation of descriptive stats, not just modeling.
answer: |-
  Here’s a battle-tested 90-minute plan focused on practical reporting instincts, not statistics theory. The goal is to make Simpson’s paradox a **checklist item** for interpreting aggregated data.

  ---

  ### **Order & Dependencies (Total: 90 min)**
  1.  **The Trap of Averages (0–15 min):**  
      *Start with a non-paradox example.* On the whiteboard:  
      *Hospital A: 10 patients, 8 recover (80%). Hospital B: 100 patients, 70 recover (70%).*  
      Ask: *"Which hospital is better?"* Most say A. Then reveal:  
      *Hospital A’s patients were all young, low-risk; Hospital B’s included 80 high-risk elderly.*  
      **Key move:** Have them calculate recovery rates *for high-risk only* (e.g., B: 50 high-risk, 30 recover → 60%). Ask: *"Why did the overall rate mislead us?"* **Land the point:** *"Overall averages weight groups differently. If one group is larger or has worse outcomes, it drags the total down—even if the hospital is good at treating them."*  
      *Dependency:* They must see that group size affects overall rates before the paradox can click.

  2.  **Introduce the Reversal (15–35 min):**  
      Project **Table 1 (Career/Grads)**. *Do not mention "Simpson’s" yet.*  
      Walk through each row:  
      *"Career-changers: Intensive 65% vs. Standard 60%. Which looks better?"* (Intensive)  
      *"Grads: Intensive 90% vs. Standard 85%. Better?"* (Intensive)  
      *"Now look at the bottom row: Pooled. Intensive 71% vs. Standard 82%. Which is better?"* (Standard)  
      **Let the room react.** Ask: *"What just happened?"*  
      **Whiteboard the weights:**  
      - Intensive track: Mostly grads (40/160 = 25%) who have high placement.  
      - Standard track: Mostly career-changers (200/230 = 87%) who have low placement.  
      *"The 'better' track (Intensive) got a boost because it had more easy-to-place grads. The 'worse' track (Standard) got dragged down by more hard-to-place career-changers."*  
      **Label it:** *"This is Simpson’s Paradox: When combining groups reverses a trend."*

  3.  **The Reporting Discipline (35–50 min):**  
      Drill: *"What should you do when you see an overall comparison?"*  
      **Rule 1: Demand the breakdown.** *"Always ask: ‘What subgroups could be hiding here?’"*  
      **Rule 2: Check the weights.** *"Could one group be bigger or harder-hit? How does that tilt the average?"*  
      **Rule 3: Find the "third variable."** (Here: career-changers vs. grads). *"What invisible factor might change the weights?"*  
      *Dependency:* They must link the paradox to actionable reporting steps.

  4.  **Table 2: The Twist (50–70 min)**  
      Hand out **Table 2 (Reading Programmes)**. Ask:  
      *"Programme B is better for both groups who reached/didn’t reach Chapter 12. Programme A has a better overall pass rate. Which should the district buy?"*  
      **Let debate erupt.** Then reveal the catch:  
      *"Reaching Chapter 12 isn’t random—Programme A pushes students there faster. The ‘subgroup’ (Chapter 12) isn’t a pre-existing type like career-changers; it’s* caused *by the program."*  
      **Crucial distinction:**  
      - Table 1: Subgroup (career/student) existed *before* treatment. Disaggregation reveals truth.  
      - Table 2: Subgroup (Chapter 12) is *downstream* of treatment. Disaggregation hides Programme A’s real benefit (helping more kids reach Chapter 12).  
      *"Sometimes the overall rate is the honest one. Ask: ‘Is this subgroup a cause or an effect?’"*

  5.  **Q&A + Takeaways (70–90 min)**  
      Open floor. Then reinforce:  
      - **Reporters’ Monday move:** *"When you see ‘X beats Y overall,’ ask: ‘What’s grouped inside? How big are the pieces? Could weights flip this?’"*  
      - **Editors’ question:** *"Before approving a ‘winning’ claim: Did you check if the trend holds in key subgroups, and if those groups are sized fairly?"*  

  ---

  ### **Carrier Example: Why Table 1 Wins**
  **Use Table 1.** It’s ideal because:  
  - Numbers are clean (round, mental math friendly).  
  - The third variable (career vs. grad) is visible and intuitive (no medical jargon).  
  - No villain—participants self-selected tracks, avoiding "manipulation" suspicions.  
  - You reported it → builds credibility.  

  **Skip Berkeley/kidney stones:**  
  - Berkeley admissions adds gender politics (distraction).  
  - Kidney stones imply medical expertise. Both require explaining external context. Table 1’s context is already in the data.  

  ---

  ### **Killing Misconceptions Early**
  - **"Disaggregated is always true"**: Dies at **min 50** with Table 2. Preempt by asking: *"What if the subgroup isn’t a fixed type?"*  
  - **"Small samples/rounding error"**: Crushed in Table 1 by **min 35** because groups are large and rates differ meaningfully (65% vs 60%).  
  - **"Somebody massaged data"**: Neutralized in **min 15** by showing weights naturally distort averages (Hospital example).  
  - **Data reporters’ "This is just confounding"**: At **min 20**, say: *"Yes—but Simpson’s paradox shows how confounding creates* mathematically unavoidable reversals *in descriptive stats. Your model adjusts for confounders; this teaches you which ones to demand."* They’ll underestimate how often this bites in raw descriptive tables (like press releases).  

  ---

  ### **Causal Judgement Call**
  **Sacrifice depth for clarity.** In 90 min:  
  - **Vocabulary to use:** *"Is this subgroup a pre-existing difference (like career stage) or a result of the treatment (like reaching Chapter 12)?"*  
  - **Vocabulary to avoid:** "Causal pathway," "mediator," "collider."  
  - **When asked "How do I know?"**: Say: *"The table won’t tell you. You investigate: Did the intervention create the groups? If yes, overall might be fairer. If no, dig into subgroups."*  
  **Honest answer:** Teaching causal inference requires another session. Here, focus on *diagnosing the paradox* and *triggering skepticism*.  

  ---

  ### **What to Cut**
  - **No charts.** A flow diagram of weights would distract from the arithmetic gut-punch.  
  - **No formulas** (e.g., weighted averages). Use concrete comparisons: *"Imagine if 90% of your class were math geniuses—your ‘average’ grade would be high even with bad teaching."*  
  - **No "why it happens" proofs.** Focus on *how to spot it*.  
  - **Say aloud:** *"We’re skipping causal diagrams—today is about interrogation, not modeling."*  

  ---

  ### **One-Sentence Bridge for the Curious**
  *"If you want more, Google ‘Simpson’s paradox causal vs. descriptive’—but remember, your first weapon is asking for the breakdown."*

  ---

  **Why this works:** It turns paradoxes from "stats magic" into a **checklist**:  
  1. See overall comparison → Pause.  
  2. Demand subgroups.  
  3. Check sizes.  
  4. Ask: "Were groups there before treatment?"  
  5. If reversed, dig deeper; if not, ask why.  

  The editor learns to ask: *"Did you check the weights?"*  
  The reporter learns: *"Never trust a top-line number."*
