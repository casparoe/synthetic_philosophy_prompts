prompt: |-
  I'm starting a dissertation chapter on what makes two things two, and I want the requirements list before I touch any of the arguments — I've read enough haecceitism-versus-bundle-theory material to know both sides mostly just assert their criteria at each other. So: write the desiderata any account of numerical distinctness has to meet to count as usable in an ontology of physical objects, ordinary and quantum-scale alike (not of sets, not of persons through time). For each requirement, the case or consideration behind it.

  I want the cases it has to return a verdict on — Black's two-sphere universe, Kant's incongruent hands, the two electrons in a helium atom, a statue and the clay it's made of, two drops of water alike in every respect — and the distinctions it isn't allowed to collapse: the version of the indiscernibility principle that lets relational predicates count against the version that doesn't, qualitative sameness against numerical oneness, and explaining a difference against merely going along with one. Then mark which requirements are non-negotiable and which are one camp's preferences wearing a badge. I suspect "distinctness must always be grounded in something qualitative" is the latter but I can't show it, and I don't know whether "distinctness is necessary, never contingent" is a requirement or a theorem.

  Which single requirement knocks out the most candidates? And is there a subset that can't be jointly satisfied — my hunch is grounding plus no brute facts plus the possibility of a symmetric world is already incoherent. Argue that either way, it's the part I most want.

  Plus one case of my own to fit into the list: a world whose only contents are two exactly alike, timeless, non-interacting spheres, with no space and no time at all, so there aren't even relations for them to differ by. Say which requirement it's aimed at, and whether it's a fair test or a rigged one.

  Two sentences each, no more, on how substratum views, bundle-plus-spacetime, and haecceitism do against the finished list. And if you think I've set this up wrong — that what-makes-two-things-two has no non-trivial answer, or that you can't write these criteria without already picking a side — tell me that straight instead of handing me a polite list.
reasoning: |-
  Okay, let me tackle this dense ontology question. The user wants a rigorous framework for evaluating theories of numerical distinctness in physical objects, with clear test cases and meta-requirements. 

  First, I need to identify the core tension: grounding distinctness in qualities versus allowing primitive thisness. The symmetric spheres case highlights this perfectly - it demands an answer where no qualitative differences exist. 

  Considering the test cases: Black's spheres challenge weak discernibility, Kant's hands introduce relational structure, quantum particles test weak discernibility in physics, statue/clay addresses co-location, and water drops examine temporary identity. Each exposes different weaknesses in theories.

  For requirements, I'm separating must-haves from contested ones. Non-negotiables include: avoiding contradictions with counting facts (R1), satisfying Leibniz's law in its strong form (R2), and respecting necessary distinctness of objects (R3). The grounding principle (R7) is clearly the most divisive - it immediately eliminates haecceitism.

  The trickiest part is the symmetric world test (R4). Combined with no-brute-contingency (R6) and grounding (R7), it creates a trilemma. Bundle theories fail R4, haecceitism fails R7, and moderate realism struggles with R6. This is the user's key insight about incoherence.

  The timeless spheres case is brilliant - it forces the issue on primitive identity. I'll present it as a fair test targeting grounding advocates. For closure, I'll contrast how major theories fare: substratum flunks R7, spacetime bundles handle R4 poorly, haecceitism violates R6/R7.

  But I should acknowledge the elephant: maybe the question itself assumes a false dichotomy. The requirements might already embed metaphysical commitments. I'll note this but provide the framework since the user explicitly wants it.
answer: |-
  Here's your distilled requirements list with cases, distinctions, and negotiability marked. The timeless spheres case is included as R4b.

  ### Non-Negotiable Requirements (Violation implies incoherence/inadequacy)
  1. **R1: Non-Contradiction in Counting**  
     *Must return a consistent count (e.g., "two" spheres in Black's universe, not one-and-a-half or indeterminate).*  
     Case: Black's two-sphere universe (symmetrical spheres in empty space).  
     Why: Denying this makes quantification meaningless.

  2. **R2: Strong Leibniz's Law**  
     *Numerically distinct objects cannot share all intrinsic *and relational* properties.*  
     Case: Kant's incongruent hands (mirror-image hands in relational space).  
     Distinction: Must allow relational predicates to ground distinctness. Weak Leibniz (intrinsic-only) fails here.

  3. **R3: Necessity of Distinctness**  
     *If objects are distinct, they cannot become identical (and vice versa).*  
     Cases: Statue/clay (temporary co-location), two water drops (coalescence).  
     Why: Collapsing distinctness over time violates persistence intuitions and causal explanation.

  ### Contested Requirements (Often theory-dependent)
  4. **R4a: Discernibility in Symmetric Worlds**  
     *Must ground distinctness without primitive "thisness" in symmetric worlds.*  
     Case: Two electrons in a helium atom (same quantum state).  
     Why: Haecceitists reject this; bundle theorists insist on it.

  5. **R4b: Discernibility in *Non*-Relational Worlds**  
     *Must ground distinctness in a world with no space, time, or relations (your timeless spheres).*  
     Case: Two identical, timeless, non-interacting spheres alone in a void.  
     Target: Forces a choice between primitive identity (haecceitism) or denying such worlds possible (relationism). **Fair test** of R4a's foundations.

  6. **R5: Explanation vs. Description**  
     *Must *explain* distinctness, not merely describe it (e.g., "they occupy different locations" explains; "they just are different" does not).*  
     Case: Water drops before contact (explanation via spatial separation).  
     Distinction: Rules out brute facts as insufficient.

  7. **R6: No Brute Contingency**  
     *Distinctness cannot be contingent without grounding in properties.*  
     Case: Statue/clay (contingent co-location).  
     Why: Avoids arbitrary "identity gaps."

  8. **R7: Qualitative Grounding**  
     *All distinctness must supervene on qualitative differences.*  
     Cases: Black's spheres (if relational properties allowed), timeless spheres (if not).  
     **Most divisive requirement**: Knocks out haecceitism immediately. Many consider it a preference disguised as necessity.

  ---

  ### Key Analysis
  - **Strongest Eliminator**: **R7 (Qualitative Grounding)**. Instantly disqualifies haecceitism, demanding all distinctness be qualitative.
  - **Incoherent Triad**:  
    **R4a/b (Symmetric Worlds Discernible) + R7 (Qualitative Grounding) + R5 (Explanation)** *cannot* hold simultaneously in non-relational symmetric worlds (like your timeless spheres). If no relations exist (R4b), R7 forces identity, violating R1. Rejecting R4b preserves R7 but makes distinctness inexplicable (violating R5). Haecceitism rejects R7 to resolve this.
  - **Contingency Status**: "Distinctness is necessary" (R3) is a non-negotiable requirement; "contingency requires grounding" (R6) is contested.

  ---

  ### Theory Assessments (2 sentences each)
  - **Substratum Theory**: Fails R7 (primitively individuates via bare particulars) and struggles with R4b (no qualitative grounds for distinctness). Meets R1-R3 by brute force.
  - **Bundle Theory + Spacetime**: Fails R4b (if spacetime is relational) or R5 (if spacetime points are primitive haecceities). Excels at R2/R7 if relations suffice.
  - **Haecceitism**: Rejects R7/R5 outright, accepting brute non-qualitative facts. Easily satisfies R1-R4b but violates explanatory demands (R5/R6).

  ---

  ### Critical Stance
  Your approach is valid but **R7 ("grounding in qualitative properties") is theory-laden, not neutral**. Insisting on it preemptively favors bundle theories. The core tension is whether distinctness *requires* discernibility (R4a/R7) or if primitive individuation (haecceitism) is admissible. Your timeless spheres (R4b) sharpens this: rejecting such worlds as impossible is already a metaphysical commitment. **No theory satisfies all contested requirements without trade-offs.**
