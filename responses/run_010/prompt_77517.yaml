  The user has thought deeply about this - they've been reading anthropic threads since 2009 and want something that properly engages with Everettian quantum mechanics and decision theory. They specifically mention Chiang/Egan style - dry, procedural, with zero infodumps. I need to avoid banned words like "multiverse" and not name real physicists.

