prompt: |-
  I am the lead curator at a small genome database covering three farmed fish species, and I need a written decision procedure for a dispute that now consumes more of my team's time than any other single task. We assign molecular-function terms from a widely used community ontology, and our internal guideline document says only that curators should record what the gene product does. Two members of our review panel read that sentence incompatibly, and roughly forty annotations a month come back flagged because the readings diverge. The biochemist on the panel holds that if an activity can be demonstrated in a clean assay under conditions that plausibly obtain in the animal, the term should be assigned; he regards appeals to evolutionary history as unverifiable and beside the question actually in front of us. The comparative phylogeneticist holds that an activity belongs to a gene product only if that activity is what the sequence has been retained or modified for, and that otherwise we are dignifying side effects, physical byproducts, and laboratory artifacts with the word function; her practical objection is downstream, that once such a term is in the database, genome-scale model builders and our variant-interpretation group both treat it as licensing a claim about what the animal loses when the gene is broken. I know both positions have names and that there is a literature on whether they can be reconciled, and you are welcome to use that vocabulary in your reply to me. The procedure itself, however, has to be usable by two curators who have never encountered the debate and must not require them to settle it in order to do their jobs. One related detail you should know, because I think it is where the disagreement has been hiding: our schema has a single free-text-plus-vocabulary field called justification, with three permitted values — assay, homology, or unknown — and "homology" is currently doing an enormous amount of quiet work, since it lets a curator assert a historical claim while appearing only to report a sequence comparison.

  Here are three of the live disputes; I want all three run through whatever procedure you write. (1) In the second species, a duplicated gene's copy encodes a protein that cleanly cleaves a dietary ester found only in a prey item this species no longer eats and that is absent from every gut-content sample we hold; the enzyme assay is unambiguous, the only knockdown study reports no detectable phenotype, gut expression sits near our limit of detection, and comparative sequence shows the copy retained across the genus with several substitutions around the active site. Our current practice, which I introduced and like, is to propagate the term laterally from the species where the prey is still eaten. (2) An extremely abundant muscle protein binds and sequesters a commonly used antiparasitic treatment at the concentrations actually reached in that tissue, lowering effective dose; nobody has argued this binding was ever selected for, but the effect is real, dose-dependent, and the breeding program wants a term attached so the phenotype surfaces in their enrichment analyses. (3) A protein assayed in vitro against a synthetic substrate that occurs in none of the three species, with clean kinetics and no in vivo evidence whatever; the paper is otherwise excellent and its authors state plainly that the physiological substrate is unknown. I should tell you where I stand, since I expect the procedure to cost me something: I have been arguing the biochemist's side, and I would rather not be told that lateral propagation in case (1) is defensible merely to spare my feelings.

  The deliverable is a reusable procedure, not an essay. Give me ordered questions, with an explicit statement of what counts as a sufficient answer to each and what evidence discharges it; say where the procedure terminates in assign, where it terminates in do not assign, and whether it should terminate in something other than the binary our schema currently supports — I suspect we need more than one field, but do not simply add fields until the disagreement evaporates. Mark at every step which of the two conceptions of function it is enforcing, and where you deliberately let one govern at the other's expense, say why the panel member who loses that step can still sign the document. Identify which questions are matters of evidence and which are matters of what the database is for, and must therefore go to a human, and say to which of the two. Name the steps that are judgment calls dressed up as procedure, and say what a curator's gut is actually doing at each. The constraints are hard: twenty minutes per dispute, no new wet-lab work may be required, the procedure must run on the published evidence plus our orthology table, and the output has to be a sentence a curator can paste into an audit trail. Then run the three cases, giving for each the verdict, the step that decided it, and that audit-trail sentence. Close with what the procedure cannot do and the systematic error I should expect to find in a year — which kind of term will be over-assigned and which under-assigned, and why that direction rather than the other. Please write the whole thing in American English and keep it under 900 words. Lead directly with the numbered procedure — no preamble on the philosophical background, which I already have, and no reading list, which nobody on my team will read — and put the three worked cases and the limitations after it, keeping any per-step header to five words or fewer.
reasoning: |-
  We are designing a decision procedure to resolve annotation disputes without requiring curators to settle the philosophical debate between biochemical activity and selected-effect function. The procedure will be step-by-step, with clear termination points and audit trail outputs. It will use existing evidence (published data, orthology tables) and require no new experiments. 

  Key principles:
  - We distinguish between biochemical activity (what the gene product does in a test) and biological function (what it does for the organism, implying evolutionary relevance).
  - The procedure will have two parallel tracks: one for biochemical activity and one for biological function. This allows us to assign terms in a way that satisfies both perspectives without conflating them.
  - We will modify the database schema to have two separate fields for molecular function: one for biochemical activity (based on direct assay evidence) and one for biological function (based on evolutionary and in vivo evidence). This addresses the core problem of the single field and the overloaded "homology" justification.
  - The justification field will be expanded to allow multiple justifications per annotation and will include new values: "direct_assay", "inferred_from_homology", "inferred_from_orthology", "inferred_from_mutant", and "unknown". We drop the old "homology" and replace it with more precise terms.

  However, note the constraint: "do not simply add fields until the disagreement evaporates". But the problem is fundamentally about two distinct concepts. Therefore, we must have two fields to capture both. We'll call them:
    1. Biochemical Activity Term (BAT): assigned based on in vitro or in vivo biochemical evidence, regardless of evolutionary context.
    2. Biological Function Term (BFT): assigned only when there is evidence that the activity is biologically relevant in the organism.

  The procedure will guide the curator to assign one or both, depending on the evidence.

  **Revised Schema:**
  - Biochemical Activity Term (BAT): A term from the ontology, assigned if there is direct experimental evidence (in vitro or in vivo) of the activity. Justification: direct_assay, or inferred_from_homology (if the homology is to a protein with direct assay, and the curator is confident the activity is conserved) but note: this is biochemical activity, so it's about the molecule's capability.
  - Biological Function Term (BFT): A term from the ontology, assigned if there is evidence that the activity is physiologically relevant in the organism. Justification: inferred_from_mutant (phenotype evidence), inferred_from_expression (tissue, condition), inferred_from_orthology (if the ortholog has a known biological function and the context is conserved), or direct_assay (if the assay is in vivo and shows physiological relevance).

  The old "justification" field is split into two fields: one for BAT justification and one for BFT justification.

  **Decision Procedure:**

  The procedure is a series of questions. Each question must be answered with evidence from the literature or database. The procedure terminates when a step provides a definitive answer. The curator must document the step and the evidence at each decision point.

  **Step 1: Biochemical Activity Evidence (BAT)**
     - **Question:** Is there direct experimental evidence (in vitro or in vivo) that the gene product performs a specific molecular activity? 
     - **Sufficient Answer:** Yes, if a published assay demonstrates the activity under any conditions (clean in vitro, in vivo, or in heterologous systems). No, if no assay exists or the assay is of poor quality (e.g., high background, not reproducible).
     - **Evidence:** Published assay data. If the assay is in a non-native system, it must be a clean assay (controls, kinetics, etc.). Orthology or homology is not direct evidence for biochemical activity unless the ortholog has been biochemically characterized and the sequence similarity is high in the relevant domains (use orthology table and literature).
     - **Termination:** 
          - If yes, assign the BAT and note the justification (direct_assay, or inferred_from_homology if based on ortholog's assay). 
          - If no, leave BAT unassigned and proceed to Step 2 for BFT only (but note: without BAT, BFT requires strong in vivo evidence).
     - **Enforced Concept:** Biochemical activity (biochemist's view). 
     - **Why the phylogeneticist can live with it:** The BAT is explicitly labeled as biochemical activity, not biological function. It does not imply evolutionary relevance. The phylogeneticist's concern is addressed by separating the two.

  **Step 2: Biological Function Evidence (BFT)**
     - **Question:** Is there evidence that the biochemical activity (if known) is physiologically relevant in the organism? 
     - **Sufficient Answer:** Yes, if one or more of the following:
          a) Mutant phenotype: Loss of the gene leads to a defect in a process that the activity explains.
          b) Expression pattern: The gene is expressed in a tissue/cell/condition where the substrate is present and the activity makes sense.
          c) Conservation: The gene is conserved in orthologs that have the same biological function, and the biological context (e.g., presence of substrate) is conserved in the species.
          d) Direct in vivo evidence: The activity has been measured in the organism and shown to be physiologically relevant.
     - **Evidence:** Published in vivo studies, mutant phenotypes, expression data, conservation of context (e.g., the substrate is present in the organism). 
     - **Termination:**
          - If yes, assign the BFT and note the justification (e.g., inferred_from_mutant, inferred_from_expression, inferred_from_orthology, direct_assay_in_vivo).
          - If no, leave BFT unassigned (even if BAT is assigned).
     - **Enforced Concept:** Biological function (phylogeneticist's view). 
     - **Why the biochemist can live with it:** The BAT is still assigned, so the biochemical activity is recorded. The BFT is an additional layer that requires evidence of biological relevance.

  **Step 3: Handling Lack of Evidence**
     - If neither BAT nor BFT can be assigned, then the term is not assigned. The justification is "unknown".

  **Judgment Calls:**
  - Step 1: Assessing the quality of an assay. The curator must use their judgment to decide if the assay is "clean". They should look for controls, reproducibility, and whether the paper's conclusions are supported by the data. The gut is asking: "Is this a reliable demonstration of what the molecule can do?"
  - Step 2a: Determining if a mutant phenotype is explained by the activity. The curator must judge if the phenotype is consistent with the loss of the activity. The gut is asking: "Is this activity the reason the organism needs this gene?"
  - Step 2c: Assessing conservation of context. The curator must judge if the biological context (e.g., presence of substrate, physiological role) is conserved. The gut is asking: "Is there a reason to think this activity matters in this species too?"

  **Audit Trail Output:**
  For each assigned term (BAT or BFT), the curator writes a sentence that includes:
     - The term assigned.
     - The type (BAT or BFT).
     - The justification (e.g., direct assay, inferred from orthology, etc.).
     - The key evidence (one sentence).

  **Worked Examples:**

  **Case 1: Duplicated gene in second species (enzyme for dietary ester no longer eaten)**
  - Step 1: Yes, biochemical activity is demonstrated by assay (clean cleavage of the ester). Assign BAT: "ester hydrolase activity". Justification: direct_assay (from the paper showing the assay). 
  - Step 2: Check for biological function. 
     - Mutant phenotype: No detectable phenotype (knockdown study). 
     - Expression: Gut expression is very low. 
     - Conservation: The gene is retained, but the prey is absent and the active site has substitutions. The context (substrate in diet) is not conserved in this species. 
     - Therefore, no evidence for physiological relevance. Do not assign BFT.
  - Audit Trail for BAT: "Assigned Biochemical Activity Term 'ester hydrolase activity' based on direct assay (reference)."
  - Audit Trail for BFT: None (not assigned).
  - **Verdict:** Assign BAT only.

  **Case 2: Muscle protein binding antiparasitic**
  - Step 1: Yes, biochemical activity: binds the antiparasitic drug. Assay shows dose-dependent binding in vitro and in tissue. Assign BAT: "antiparasitic binding activity".
  - Step 2: Biological function? 
     - There is no mutant phenotype reported (and none expected because it's not the natural function). 
     - Expression: abundant in muscle, but that doesn't indicate a natural substrate. 
     - Conservation: No evidence that this binding was selected for. 
     - The activity is not physiologically relevant; it's an accidental binding. 
     - Therefore, do not assign BFT.
  - But note: the breeding program wants the term for enrichment analyses. However, our procedure is for molecular function terms. We can assign BAT, which captures the biochemical activity. The breeding program can use the BAT for their analysis (since the effect is real) without implying it's the biological function.
  - Audit Trail for BAT: "Assigned Biochemical Activity Term 'antiparasitic binding activity' based on direct assay (reference)."
  - Audit Trail for BFT: None.
  - **Verdict:** Assign BAT only.

  **Case 3: Protein with in vitro activity against synthetic substrate**
  - Step 1: Yes, biochemical activity: the assay is clean (kinetics) against a synthetic substrate. Assign BAT: [term for the activity, e.g., "hydrolase activity"] (but note: the substrate is synthetic and not found in the species). 
     - However, the activity is against a synthetic substrate. We can assign a general term (e.g., "hydrolase activity") if the assay demonstrates that general activity, but not a specific one (if the specific substrate is not natural). 
     - Alternatively, if the ontology has a term for the specific synthetic substrate, we can assign that, but it may not be useful. 
     - Important: The authors state the physiological substrate is unknown. We assign a BAT that reflects what was tested, but it may be very general.
  - Step 2: Biological function: 
     - No in vivo evidence. 
     - Expression? Not mentioned. 
     - Mutant? Not mentioned. 
     - Conservation? Not mentioned. 
     - Therefore, no BFT.
  - Audit Trail for BAT: "Assigned Biochemical Activity Term 'hydrolase activity' (or more specific if the ontology term exists for that substrate) based on direct assay using synthetic substrate (reference)."
  - Audit Trail for BFT: None.
  - **Verdict:** Assign BAT only, but note that the BAT might be very general or of limited biological relevance.

  **Limitations and Systematic Errors:**
  - **What the procedure cannot do:** 
     - Resolve cases where the evidence for biological function is ambiguous (e.g., expression in the right tissue but no mutant phenotype). These will be judgment calls and may require panel review.
     - Assign a BFT without direct evidence of physiological relevance. Some activities that are biologically relevant but not yet experimentally verified in the species will be missed (under-assigned for BFT).
  - **Systematic Error:**
     - **Over-assigned:** Biochemical Activity Terms (BAT) for activities that are real in vitro but have no biological relevance in the organism. This is because we assign BAT whenever there's a clean assay, even if the activity is never used in the organism. 
     - **Under-assigned:** Biological Function Terms (BFT) because they require in vivo evidence (mutant, expression in context, etc.). Many genes may have biochemical activities assigned but no BFT, especially for genes with subtle phenotypes or in non-model organisms where in vivo studies are lacking.
     - **Why this direction:** The procedure prioritizes avoiding false claims of biological function (to address the phylogeneticist's concern) while recording biochemical activities (to address the biochemist's concern). This will lead to an excess of BATs without BFTs.

  **Final Notes:**
  - The procedure requires about 20 minutes per dispute because it is structured and uses existing evidence.
  - The curator does not need to understand the philosophical debate; they follow the steps and assign based on evidence.
  - The two-panel members can sign because both concepts are captured separately: the biochemist gets BATs, the phylogeneticist gets BFTs only when there's evidence of biological relevance.

  **Procedure Document (Step-by-Step):**

  **Decision Procedure for Molecular Function Annotation**

  **Step 1: Biochemical Activity Term (BAT) Assignment**
  - **Question:** Is there direct experimental evidence (in vitro or in vivo) of a specific molecular activity?
  - **Sufficient Answer:** 
     - Yes: Published assay (with controls and reproducibility) demonstrates the activity. 
     - No: No assay or assay is of poor quality.
  - **Evidence Required:** Primary literature or reliable database entry describing the assay.
  - **Termination:**
     - If Yes: Assign BAT. Justification: "direct_assay" (if assayed on this protein) or "inferred_from_homology" (if based on ortholog's assay and sequence similarity is high in functional domains). Write audit trail: "Assigned Biochemical Activity Term '[term]' based on [justification] (reference)."
     - If No: Do not assign BAT. Proceed to Step 2 (for BFT only if there is other evidence, but note without BAT, BFT requires strong in vivo evidence of a function that implies an activity).

  **Step 2: Biological Function Term (BFT) Assignment**
  - **Question:** Is there evidence that the activity (if known) is physiologically relevant in the organism?
  - **Sufficient Answer:** Yes if one or more of:
     a) Mutant phenotype: Loss of gene causes a defect explainable by loss of the activity.
     b) Expression: Gene expressed in relevant tissue/condition where activity makes sense.
     c) Conservation: Orthologs have same biological function AND biological context (e.g., substrate) is conserved.
     d) Direct in vivo evidence: Activity measured in organism and shown to be relevant.
  - **Evidence Required:** Published in vivo experiments, phenotype studies, expression data, conservation of context.
  - **Termination:**
     - If Yes: Assign BFT. Justification: "inferred_from_mutant", "inferred_from_expression", "inferred_from_orthology", or "direct_assay_in_vivo". Write audit trail: "Assigned Biological Function Term '[term]' based on [justification] (reference)."
     - If No: Do not assign BFT.

  **Step 3: No Assignment**
  - If neither BAT nor BFT is assigned, leave unannotated. Justification: "unknown".

  **Judgment Calls (Curator's Gut):**
  - Step 1: Deciding assay quality. Gut: "Is this assay trustworthy?"
  - Step 2a: Linking mutant phenotype to activity. Gut: "Does the phenotype make sense if this activity is lost?"
  - Step 2c: Assessing context conservation. Gut: "Is the biological setting (e.g., substrate availability) the same here?"

  **Worked Cases (as above) and Limitations (as above) are provided separately.**
answer: |-
  ### Molecular Function Annotation Decision Procedure  
  **Purpose:** Assign ontology terms based on evidence, resolving biochemical activity vs. biological function disputes. Terminates in **assign BAT** (Biochemical Activity Term), **assign BFT** (Biological Function Term), **assign both**, or **no assignment**. Requires two new fields:  
  - **Biochemical Activity Term (BAT):** Captures demonstrable molecular activity.  
  - **Biological Function Term (BFT):** Captures evolutionarily relevant function.  
  *Justification field expanded to: `direct_assay`, `inferred_from_orthology`, `inferred_from_mutant`, `inferred_from_expression`, `unknown`.*  

  ---

  #### **Step 1: Direct assay evidence?**  
  **Question:** Does published evidence describe an in vitro/in vivo assay demonstrating molecular activity?  
  **Sufficient Answer:** Yes = assay with controls, kinetics, and reproducibility (any substrate/organism). No = no assay or irreproducible/poorly controlled.  
  **Evidence:** Primary literature. Orthology tables not sufficient.  
  **Termination:**  
  - Yes → Assign BAT. Justification: `direct_assay`. Proceed to Step 2.  
  - No → Proceed to Step 3.  
  **Enforces:** Biochemist view (activity ≠ evolutionary relevance).  
  **Why opponent accepts:** BAT is explicitly activity-only; no evolutionary claim.  
  **Judgment Call:** Curator assesses assay quality (gut: "Is this reliable lab evidence?").  

  #### **Step 2: Physiological relevance?**  
  **Question:** Is there evidence the activity occurs in the organism with biological impact?  
  **Sufficient Answer:** Yes = mutant phenotype, in vivo expression in relevant context, or conserved biological context (substrate/process exists in species). No = none of these.  
  **Evidence:** Mutant studies, expression data, ecological data (e.g., gut samples), conservation of context (via orthology tables/literature).  
  **Termination:**  
  - Yes → Assign BFT. Justification: `inferred_from_mutant`, `inferred_from_expression`, or `inferred_from_orthology` (context conserved).  
  - No → Do not assign BFT.  
  **Enforces:** Phylogeneticist view (function requires evolutionary relevance).  
  **Why opponent accepts:** BFT requires in vivo/contextual evidence; BAT already captures activity.  
  **Judgment Call:** Curator links activity to organism biology (gut: "Would breaking this gene disrupt the organism?").  

  #### **Step 3: Orthology evidence?**  
  **Question:** Is there high-confidence orthology to a protein with assigned BAT/BFT?  
  **Sufficient Answer:** Yes = ortholog with direct assay (BAT) or conserved context (BFT). No = low sequence similarity or no ortholog data.  
  **Evidence:** Orthology table + literature for ortholog’s evidence.  
  **Termination:**  
  - BAT via ortholog → Assign BAT. Justification: `inferred_from_orthology`.  
  - BFT via ortholog → Assign BFT only if context conserved (Step 2 criteria).  
  - No → No assignment. Justification: `unknown`.  
  **Enforces:** Both views (orthology supports activity; context conservation supports function).  
  **Why opponents accept:** Orthology is proxy evidence; context conservation bridges views.  
  **Judgment Call:** Curator evaluates ortholog evidence quality (gut: "Is this transfer justified?").  

  ---

  ### Worked Cases  
  **Case 1: Duplicated esterase in second species**  
  - **Step 1:** Yes (clean assay) → Assign BAT: "ester hydrolase activity".  
  - **Step 2:** No (no phenotype, low expression, prey absent) → No BFT.  
  - **Verdict:** Assign BAT only.  
  - **Decisive Step:** Step 2 (physiological relevance absent).  
  - **Audit Trail:** "BAT 'ester hydrolase activity' assigned via direct_assay; no BFT: no evidence of physiological relevance."  

  **Case 2: Muscle protein binding antiparasitic**  
  - **Step 1:** Yes (dose-dependent binding assay) → Assign BAT: "xenobiotic binding activity".  
  - **Step 2:** No (no phenotype/expression linking to native function) → No BFT.  
  - **Verdict:** Assign BAT only.  
  - **Decisive Step:** Step 2 (biological impact unsubstantiated).  
  - **Audit Trail:** "BAT 'xenobiotic binding activity' assigned via direct_assay; no BFT: no evidence of selected function."  

  **Case 3: Protein with synthetic substrate assay**  
  - **Step 1:** Yes (clean kinetics) → Assign BAT: "hydrolase activity" (general term; specific term if ontology allows).  
  - **Step 2:** No (unknown physiological substrate) → No BFT.  
  - **Verdict:** Assign BAT only.  
  - **Decisive Step:** Step 1 (assay valid, but synthetic substrate).  
  - **Audit Trail:** "BAT 'hydrolase activity' assigned via direct_assay; no BFT: physiological substrate unknown."  

  ---

  ### Limitations and Systematic Error  
  **What the procedure cannot do:**  
  - Resolve ambiguous context conservation (e.g., substrate presence inferred indirectly). Requires panel review.  
  - Assign terms without published evidence (e.g., predicted activities).  
  - Handle non-molecular processes (e.g., cellular roles); use separate ontology.  

  **Systematic error in 1 year:**  
  - **Over-assigned:** BATs for activities with no biological relevance (e.g., Case 2). *Why*: Procedure prioritizes biochemical evidence over evolutionary context.  
  - **Under-assigned:** BFTs for genes with subtle phenotypes (e.g., Case 1). *Why*: BFT requires direct in vivo/context evidence, which is rarer than assays.  
  *Direction bias*: Favors biochemist view (BATs easily assigned); phylogeneticist view (BFTs) under-represented due to evidence scarcity.  

  ---  
  **Procedure runtime:** ≤20 mins/dispute. Uses only published data + orthology tables. Audit trail sentence generated at termination.
