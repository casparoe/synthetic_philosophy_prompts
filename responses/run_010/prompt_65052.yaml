prompt: |-
  ok, weird situation and I want the spec before I read anything.

  I've been asked to write an interpretive guide for hearing officers in a jurisdiction that doesn't exist — treat it as a thought experiment where I get to stipulate the institutional facts. Take these five seriously, they're the whole point:

  1. the legislature is a citizen legislature. 45 session days a year, most members have no staff, big bills get drafted overnight by whoever is still in the building.
  2. between sessions it can't amend anything except in a declared emergency, so a statute can sit there visibly misfiring for two full years while everyone agrees it misfires.
  3. the floor transcript is published verbatim and everybody knows it. Members give floor speeches for the cameras and to plant a record for future litigation.
  4. there's an initiative process — voters can enact a statute directly, and those come with a ballot pamphlet argument written by the sponsors and no committee report at all.
  5. the people applying the rules are hearing officers with no legal training, sitting alone, roughly 20 minutes per matter, no clerk.

  What I want: the full list of what an interpretive theory for THIS place has to deliver — the outcomes it must get right, the distinctions it must not collapse, the constraints that follow from 1 through 5. For each item give the consideration behind it and a short invented fact pattern showing what's at stake (generic please, no fake case names or section numbers, I don't want anything I'd have to fact check). And for each one say whether it would still be a requirement in an ordinary court system, because I suspect a bunch of the standard demands made on theories of statutory interpretation only look mandetory because of facts about real legislatures that fail here — I want to know which ones those are.

  Then mark which are non-negotiable and which are just the taste of one camp, and flag any pair you think can't be jointly satisfied. My guess is something about the 45-day session collides with something about the 20-minute hearing officer, but tell me if the real collision is somewhere else. Last thing: which single requirement does the most work eliminating candidate theories.

  Skip the scorecard on textualism vs purposivism vs the dynamic-whatever view, I'll do that myself once I have the list in hand.
reasoning: |-
  We are designing an interpretive theory for hearing officers in a jurisdiction with the following unique features:

  1. Citizen legislature: 45 session days/year, no staff, bills drafted hastily.
  2. No amendments between sessions except in emergencies → statutes can be flawed and unamended for up to two years.
  3. Floor transcripts are public and used strategically (for cameras and future litigation).
  4. Initiative process: statutes enacted by voters with only a ballot pamphlet from sponsors (no committee reports).
  5. Hearing officers: no legal training, 20 minutes per matter, no clerk.

  We need a list of requirements for an interpretive theory in this context. For each requirement, we provide:
  - The consideration behind it.
  - A short generic fact pattern illustrating the stake.
  - Whether it would be a requirement in an ordinary court system.
  - Mark as non-negotiable (N) or debatable (D).
  - Flag any pairs that cannot be jointly satisfied.

  Additionally, identify which requirement does the most work in eliminating candidate theories.

  ---

  **List of Requirements for Interpretive Theory**

  1. **Requirement: Speed and Simplicity in Application**
     - **Consideration**: Hearing officers have only 20 minutes per matter and no legal training. The method must be quickly applicable without complex analysis.
     - **Fact Pattern**: A statute says "no vehicles in the park." A hearing officer must decide whether an electric scooter is a vehicle. The theory must yield a clear answer without lengthy research or balancing tests.
     - **Ordinary Court**: Less critical; courts have more time, clerks, and legal training.
     - **Status**: Non-negotiable (N)

  2. **Requirement: Resistance to Legislative Inertia**
     - **Consideration**: Due to the legislature's infrequent sessions, statutes cannot be fixed quickly even when flawed. The theory must allow hearing officers to adapt or correct obvious errors without waiting for amendments.
     - **Fact Pattern**: A statute imposes a tax on "all fruit," but the legislative transcript shows that the sponsor said "we mean only citrus fruit." The literal text is overbroad and causes absurd results (e.g., taxing apples when everyone knows it was meant for oranges). The theory must permit avoiding the absurdity.
     - **Ordinary Court**: Courts might defer to the legislature to fix errors, but here that is not feasible for two years. Thus, more flexibility is needed.
     - **Status**: Non-negotiable (N) (but the method of correction must be constrained to avoid overreach)

  3. **Requirement: Reliance on Available and Accessible Materials**
     - **Consideration**: Hearing officers cannot access expensive databases or do deep research. Materials must be limited to those readily available (e.g., the statute text, floor transcripts, ballot pamphlets for initiatives).
     - **Fact Pattern**: An initiative enacts a statute banning "harmful substances near schools." The ballot pamphlet says the sponsors were concerned about drug dealers. The hearing officer must decide if it applies to a pharmacy dispensing prescription drugs. The theory should allow using the pamphlet but not require expert testimony or scientific studies.
     - **Ordinary Court**: Courts often use legislative history, committee reports, etc., but here only specific sources (floor transcripts, pamphlets) are available and must suffice.
     - **Status**: Non-negotiable (N)

  4. **Requirement: Predictability and Consistency**
     - **Consideration**: With many hearing officers and no appeals process (implied by the 20-minute matter and no mention of appeals), decisions must be predictable to facilitate compliance and reduce disputes.
     - **Fact Pattern**: Multiple hearing officers must interpret "operating a business without a license." If one officer holds that a lemonade stand is a business and another does not, chaos ensues. The theory must provide clear rules that yield consistent outcomes across officers.
     - **Ordinary Court**: Important, but less critical because appeals courts can correct inconsistencies.
     - **Status**: Non-negotiable (N)

  5. **Requirement: Respect for Direct Democracy (Initiatives)**
     - **Consideration**: For initiatives, the only legislative history is the ballot pamphlet. The theory must give weight to the sponsors' stated intent without overreaching, as there is no committee process to refine the language.
     - **Fact Pattern**: An initiative bans "large corporations" from local elections. The pamphlet says it targets "mega-rich outsiders." A small local business is accused. The hearing officer must decide if the small business is included. The theory must look to the pamphlet but not invent limitations not reasonably inferable.
     - **Ordinary Court**: Initiatives are interpreted with their unique history, but courts might have more tools. Here, the pamphlet is the primary source.
     - **Status**: Non-negotiable (N)

  6. **Requirement: Avoidance of Complex Purpose-Based Reasoning**
     - **Consideration**: Hearing officers lack legal training and time for nuanced purposivism. The theory should minimize open-ended balancing of purposes.
     - **Fact Pattern**: A statute requires "safe working conditions." A hearing officer might be tempted to define "safe" based on personal views of safety. The theory must anchor in textual or contextual clues rather than abstract purpose.
     - **Ordinary Court**: Purposivism is common and manageable with legal training and time.
     - **Status**: Non-negotiable (N)

  7. **Requirement: Floor Transcripts as Primary Legislative History**
     - **Consideration**: Floor transcripts are public and intentionally used by legislators to plant records. The theory must use them but be wary of strategic statements (e.g., a lone member's view vs. widespread understanding).
     - **Fact Pattern**: A bill passes with a vague clause. One member's floor speech (for the cameras) says, "This clause covers all accidents," but others are silent. The hearing officer must decide whether to credit that speech. The theory should not ignore transcripts but must have a filter (e.g., only statements reflecting collective understanding).
     - **Ordinary Court**: Courts use legislative history selectively; here, it's more central because other sources are absent.
     - **Status**: Debatable (D) (how much weight to give, but using it is N)

  8. **Requirement: Text as the Starting Point and Anchor**
     - **Consideration**: With no legal training, hearing officers need a clear starting place. The text is the most accessible and stable source.
     - **Fact Pattern**: A statute says "dogs must be leashed." A hearing officer must decide if it applies to a wolf hybrid. Starting with the text ("dogs") provides a foothold; then context (e.g., common understanding) can be considered.
     - **Ordinary Court**: Text is always important, but other methods might downplay it. Here, it is essential.
     - **Status**: Non-negotiable (N)

  ---

  **Potential Conflicts:**

  - **Conflict between Resistance to Legislative Inertia (2) and Predictability (4)**: 
    - Correcting errors might lead to inconsistent decisions if hearing officers have different views of what is absurd. This could undermine predictability.
    - **Resolution**: The theory must have a high threshold for correction (e.g., only for "irreconcilable absurdity" with clear evidence from available sources) and simple rules to ensure consistency.

  - **Conflict between Avoidance of Complex Purpose-Based Reasoning (6) and Resistance to Legislative Inertia (2)**:
    - Avoiding purpose might make it harder to fix errors that require understanding purpose. But complex purpose analysis is too demanding.
    - **Resolution**: Use purpose only when clearly stated in accessible materials (e.g., floor transcript or ballot pamphlet) and tied to the text.

  - **Conflict between Reliance on Available Materials (3) and Floor Transcripts (7)**:
    - For initiatives, there are no floor transcripts, only the ballot pamphlet. So the theory must handle statutes differently based on origin (legislature vs. initiative).

  ---

  **The Requirement That Eliminates the Most Candidate Theories: Speed and Simplicity (1)**

  - Why: Any theory requiring multi-step balancing, weighing of precedents, or extensive research (like dynamic updating or deep purposivism) is eliminated. Only theories that can be applied in minutes with minimal materials survive. This rules out most sophisticated approaches used in ordinary courts.

  ---

  **Summary of Non-Negotiables (N) vs. Debatables (D):**

  - N: 1 (Speed), 2 (Resistance to Inertia), 3 (Available Materials), 4 (Predictability), 5 (Respect Initiatives), 6 (Avoid Complex Purpose), 8 (Text as Anchor)
  - D: 7 (Floor Transcripts – how to weight them)

  The collision is not directly between the 45-day session and the 20-minute hearing, but between the need to correct legislative errors quickly (due to infrequent sessions) and the hearing officers' limited capacity (time/training). This forces a design that is both flexible (to fix errors) and simple (to apply quickly). The resolution is a constrained error-correction mechanism based only on accessible sources and obvious absurdities.
answer: |-
  Below is the full list of requirements for an interpretive theory tailored to your specified jurisdiction, derived from the five institutional constraints. I focus on what the theory *must* deliver to function in this environment, with each requirement including:  
  - **Consideration**: Why it matters given the constraints.  
  - **Fact Pattern**: A generic, jurisdiction-agnostic illustration.  
  - **Ordinary Court Relevance**: Whether it would still apply in a typical court system.  
  - **Non-Negotiable (N) or Debatable (D)**: Based on whether it's essential for basic functionality or a matter of philosophical preference.  
  - **Conflicts**: Pairs that may be incompatible, with explanations.  

  Finally, I identify the requirement that eliminates the most candidate theories.  

  ---

  ### **1. Requirement: Minimize Reliance on Contextual Knowledge or Research**  
  **Consideration**: Hearing officers have no legal training, no clerks, and only 20 minutes per matter. They cannot perform deep research, parse legal precedents, or access specialized databases. The theory must yield answers from readily available materials (e.g., statute text, floor transcripts, ballot pamphlets).  
  **Fact Pattern**: A statute bans "vehicles in public parks." A hearing officer must decide if a battery-powered scooter qualifies. They cannot consult case law, dictionaries, or expert opinions—only the statute and any floor speech/ballot pamphlet.  
  **Ordinary Court Relevance?** No. Courts assume time, resources, and legal expertise for research. Here, it’s impossible.  
  **Status**: Non-negotiable (N).  

  ### **2. Requirement: Correct Obvious Drafting Errors Without Legislative Action**  
  **Consideration**: The legislature meets only 45 days/year and cannot amend non-emergency statutes for up to two years, even if everyone agrees they "misfire." Hearing officers must fix glaring errors (e.g., typos, contradictions) to avoid absurd outcomes, as waiting for correction is impractical.  
  **Fact Pattern**: A statute imposes a "500-foot distance requirement" between schools and "any store selling alcohol." Due to a drafting error, it says "50 feet" instead. Businesses comply with 500 feet, but an enforcement action targets a store 200 feet away. The hearing officer must reconcile this without legislative input.  
  **Ordinary Court Relevance?** Rarely. Courts usually defer to legislatures to fix errors or use narrow "absurdity doctrine" exceptions. Here, it’s essential for functionality.  
  **Status**: Non-negotiable (N).  

  ### **3. Requirement: Treat Floor Transcripts as Definitive Evidence of Legislative Intent**  
  **Consideration**: Floor speeches are publicly available and strategically used by legislators to "plant a record" for future disputes. Ignoring them would waste this resource and undermine predictability, especially since committee reports don’t exist.  
  **Fact Pattern**: A vague statute penalizes "misuse of public funds." A legislator’s floor speech explicitly states, "This targets only elected officials, not civil servants." The hearing officer must use this to resolve ambiguity.  
  **Ordinary Court Relevance?** Debatable. Courts use legislative history selectively (textualists reject it; purposivists embrace it). Here, it’s critical due to the lack of other sources and the public record’s reliability.  
  **Status**: Non-negotiable (N) for resolving ambiguity.  

  ### **4. Requirement: Ballot Pamphlets as Sole Authority for Initiatives**  
  **Consideration**: Initiatives lack committee reports or floor debates—only the sponsors’ ballot pamphlet exists. Hearing officers cannot infer intent from non-existent materials, and the pamphlet is the only direct insight into voter intent.  
  **Fact Pattern**: An initiative bans "synthetic drugs." The ballot pamphlet states it targets "chemically altered substances like fentanyl." A hearing officer must decide if it applies to a lab-created caffeine pill. The pamphlet is the only guide.  
  **Ordinary Court Relevance?** Partially. Courts consider ballot materials, but also use broader tools (e.g., public policy debates). Here, it’s the only option.  
  **Status**: Non-negotiable (N).  

  ### **5. Requirement: Strict Textual Default for Routine Cases**  
  **Consideration**: With only 20 minutes/hearing, officers need a quick starting point. The statute’s plain text is the most accessible anchor. Purpose-based or dynamic approaches require nuanced analysis that exceeds time/training limits.  
  **Fact Pattern**: A statute requires "all dogs to be leashed in parks." A hearing officer encounters an unleashed cat. The text ("dogs") resolves this instantly; no need to ponder the law’s purpose (e.g., animal control).  
  **Ordinary Court Relevance?** Yes, but less strict. Courts use textualism as one tool among many. Here, it’s the baseline for efficiency.  
  **Status**: Non-negotiable (N) for simple cases.  

  ### **6. Requirement: Avoid Judicial Lawmaking or Updating**  
  **Consideration**: Hearing officers lack legal expertise and legitimacy to "update" statutes based on societal changes. Legislative inertia (Constraint 2) means updates must wait for sessions, so officers must apply the law as enacted, not adapt it.  
  **Fact Pattern**: A 1980 statute regulates "telephone communications." A hearing officer must decide if it covers internet-based calls. The theory cannot allow "updating" to include modern tech—only the original text/transcripts matter.  
  **Ordinary Court Relevance?** Debatable. Many courts (e.g., in dynamic interpretation) update statutes. Here, it risks overreach and inconsistency.  
  **Status**: Non-negotiable (N).  

  ### **7. Requirement: Predictability Over Optimal Outcomes**  
  **Consideration**: With many hearing officers making snap decisions, consistency is key to fairness and compliance. Complex balancing tests (e.g., weighing purposes) lead to unpredictable outcomes.  
  **Fact Pattern**: A statute forbids "noisy devices after 10 PM." One officer bans a generator for noise pollution; another allows it as "essential." A theory must prioritize clear rules (e.g., decibel thresholds) over contextual fairness.  
  **Ordinary Court Relevance?** Partially. Courts value predictability but prioritize justice in close cases. Here, scale and speed make it essential.  
  **Status**: Non-negotiable (N).  

  ### **8. Requirement: Reject Implied Exceptions or Inferences**  
  **Consideration**: Hearing officers lack time to infer unstated exceptions or purposes. Floor transcripts (Constraint 3) and ballot pamphlets (Constraint 4) provide explicit intent, making implications unnecessary and risky.  
  **Fact Pattern**: A statute says "no animals in restaurants." A hearing officer must decide if service dogs are exempt. Unless the transcript/pamphlet mentions an exemption, the answer is "no"—no implied exceptions for disability access.  
  **Ordinary Court Relevance?** No. Courts routinely imply exceptions (e.g., for fundamental rights). Here, it invites inconsistency.  
  **Status**: Non-negotiable (N).  

  ---

  ### **Conflicts Between Requirements**  
  - **Biggest Conflict: #2 (Correct Errors) vs. #6 (Avoid Lawmaking)**  
    - **Why**: Correcting errors (#2) requires judges to "fix" the law, but #6 forbids lawmaking. Legislative inertia forces officers into this gap.  
    - **Example**: If a statute misfires due to a typo (#2), "fixing" it feels like lawmaking (#6).  
    - **Resolution**: Only allow corrections when the error is *obvious* from the face of the text/transcript (e.g., "500 feet" vs. "50 feet"), not based on policy.  

  - **Secondary Conflict: #3 (Floor Transcripts) vs. #5 (Textual Default)**  
    - **Why**: Floor speeches (#3) may contradict the text (#5), forcing officers to choose.  
    - **Example**: Text says "vehicles," but a floor speech says "only motorized vehicles." Which controls?  
    - **Resolution**: Default to text unless the transcript shows a clear, non-strategic consensus (hard to gauge in 20 minutes).  

  - **Collision Insight**: You suspected the 45-day session (#2) conflicts with the 20-minute hearing (#1, #5). This is real: Legislative inertia demands flexibility (#2), but time constraints demand simplicity (#1, #5). The resolution is a highly rule-bound error-correction standard (e.g., "only if the text is nonsensical without correction") to avoid overburdening officers.  

  ---

  ### **Most Theory-Eliminating Requirement**  
  **#1 (Minimize Research/Context) does the most work**. It eliminates:  
  - **Purposivism**: Requires inferring legislative goals from external sources (unavailable).  
  - **Dynamic Interpretation**: Demands updating statutes based on societal changes (needs research).  
  - **Common-Law Methods**: Relies on precedent and analogical reasoning (too time-consuming).  
  Only **textualism** (augmented by floor transcripts/ballot pamphlets) survives, as it uses accessible materials and avoids context. Even then, it must be simplified (no complex canons).  

  ---

  ### **Summary: Non-Negotiables vs. Debatables**  
  - **Non-Negotiables (N)**: All except #3 (which is N for intent but D for *weight* in ambiguous cases). These ensure basic functionality.  
  - **Debatables (D)**: How to weight floor transcripts (#3) against text (#5). Purposivists might emphasize transcripts; textualists might downplay them. But in this system, transcripts are indispensable due to Constraints 3 and 4.  

  This framework prioritizes speed, predictability, and institutional constraints over theoretical elegance. Candidate theories must pass Requirement #1 first—anything requiring more than 20 minutes of analysis fails.
