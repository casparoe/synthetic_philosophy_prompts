prompt: |-
  I'm a second-year MPP student and our seminar this term is on climate policy and intergenerational ethics — brutal reading load, meets Thursdays, half the class is econ people and half are policy-nerds like me who've never opened a discount-rate spreadsheet in their lives. Last week we got into an argument about whether a resource-rich country can make itself sustainable by pumping oil aggressively and then parking the rents in a sovereign wealth fund plus green R&D. One guy, very quantitative, said yes obviously, and that this is exactly what the old line 'live off the interest, not the capital' is telling you to do: convert the exhaustible stuff into other capital so the total doesn't fall, and then consume the yield. Someone on the other side said the very same line refutes him, because the remaining carbon budget and the climate system ARE the capital, so every barrel extracted is eating into it, and a pile of money is not a substitute — her phrase was that you can't eat a bond portfolio, and he shot back that money's only worth anything if there's a functioning biosphere to spend it in. They went round and round, and our professor finally said the two of them were using one sentence to mean two completely different things and neither had bothered to say which. That's the bit I want to get straight, because I keep reaching for that slogan myself and I honestly can't tell whether I'm saying anything when I do.

  So: pretend you're an environmental philosopher who also genuinely understands ecological economics, and think this through carefully before you commit to a structure — brainstorm first, get the candidate claims on the page, then sort them. I want a menu, not an essay that picks one favourite reading and explains it. Work through the sentence piece by piece: what could 'interest' mean (a flow that leaves the stock physically intact? whatever an asset yields at market rates? the sustainable yield of a renewable system like a fishery or a forest? and does a non-renewable stock even have an 'interest' at all, or only a depletion rent that you're supposed to reinvest)? What could 'capital' mean (a money-denominated aggregate? a physical stock? one specific critical component that can't be traded off against the rest? the climate system, which isn't obviously a stock you own so much as a condition you operate inside)? What's the force of 'live off' (a claim about what consumption is permissible, or about what prudent policy should do, and over what horizon — a year, a generation, forever)? And is the slogan even about sustainability, or is it a disguised claim about substitutability between kinds of capital, or a claim about how to measure welfare across generations, or just a homely warning against short-termism? For each reading, give me a verdict: trivially true and doing no work, substantive and defensible, or false / only looks true because of an equivocation somewhere in it. Then tell me which reading, if any, actually licenses the sovereign-wealth-fund position, which licenses the keep-it-in-the-ground position, and whether there's a reading under which those two aren't contradicting each other at all but are just making claims about different things.

  Format-wise: a numbered list of readings with a one-line verdict each and then a couple sentences of argument, and at the end a short section saying which reading you think people most often have in mind when they drop the line in conversation, plus which readings are the ones that make the slogan sound profound while smuggling in the contested assumption. Don't give me a bibliography or a reading list or citations — I'll chase the sources down myself and I don't want you guessing at them — but do name positions and distinctions where they have names. One more thing: write the whole answer in British English, spelling and idiom, even though I've written this in American English and I'm not going to pretend otherwise.
