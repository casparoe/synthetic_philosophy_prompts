  But note: AV might go with (a) if the players accept the packaged proposal, but we are trying to capture the implicit model, not the actual acceptance. We are assuming the proposal passed, meaning it was accepted by vote.

  Given the constraints, we'll proceed.

  **Question 3:**
  - (a) SEV, BV (the entrenched rule binds)
  - (b) CV (the majority can always change the rules)
  - (c) AV (it's about acceptance)

  **Question 4:**
  - (a) DV (later rule prevails by default), CV (current majority wins)
  - (b) SEV, BV (the existing rule must be explicitly repealed)
