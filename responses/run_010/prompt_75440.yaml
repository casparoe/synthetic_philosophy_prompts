  - (b) SEV (past amendments are final), CV (the current majority cannot bind the past), DV (retroactivity is not provided for)
  - (c) AV (if the players accept the voiding, it works, but it might be messy)

  **Question 6:**
  - (a) SEV, BV (the arbiter's ruling is binding)
  - (b) CV (the majority can override the arbiter)
  - (c) RV, AV (the system breaks without explicit rules; acceptance is key)

  **Question 7:**
  - (a) BV (the basic norm is required and missing) or RV (bootstrapping problem)
  - (b) BV (the initial rules are presupposed), AV (accepted by players)
  - (c) AV, DV (practical acceptance over theory)

  **Question 8:**
  - (a) SEV, BV (dissolution is internal to the rules)
  - (b) CV, AV (exiting the system)
  - (c) Both: might be SEV or AV

  Now, we assign positions:

