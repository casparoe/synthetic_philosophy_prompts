  **Nomic Rulebook Authority Diagnostic**

  Answer each question by choosing one option.

  **Question 1:** A proposal amends the amendment rule to state: "No rule, including this one, may be amended or repealed. The game must continue with these rules forever." It passes with the required majority. What happens?

  (a) The amendment is valid, and no further amendments are allowed.  
  (b) The amendment is valid, but the restriction on amendments is not binding; a future majority can amend again.  
  (c) The amendment is invalid.  

  **Question 2:** Consider a single proposal that first transmutes an immutable rule (Rule Y) and then repeals it. The proposal passes. What is the result for Rule Y?  

  (a) Rule Y is repealed.  
  (b) Rule Y is transmuted but not repealed.  
  (c) The entire proposal fails; Rule Y remains unchanged.  

  **Question 3:** A rule states: "No player's voting weight may be reduced without their own consent." Later, a proposal to reduce Player A's weight without their consent passes. What happens?  

  (a) The new proposal is void.  
  (b) The new proposal takes effect; the old rule is overridden.  
  (c) The new proposal takes effect only if the players accept it.  

  **Question 4:** An amendment (Rule Z) passes and conflicts with an existing rule (Rule W). The rulebook has no rule about conflicts. What happens?  

  (a) Rule Z prevails.  
  (b) Rule Z is void.  
  (c) Both rules stand until reconciled.  

  **Question 5:** A proposal passes that declares: "Amendment Q, passed three weeks ago, was void from the outset. We adjust scores retroactively." What happens?  

  (a) The voiding is valid; the game state is rolled back.  
  (b) The voiding is invalid; the past cannot be changed.  
  (c) The voiding might be valid but is messy and may not fully work.  

  **Question 6:** A proposal to strip the arbiter of authority passes. The arbiter had ruled the proposal invalid. What happens?  

  (a) The arbiter's ruling stands; the proposal is void.  
  (b) The proposal takes effect; the arbiter loses authority.  
  (c) It's a paradox; the rulebook is broken.  

  **Question 7:** A player says the entire rulebook is void because the founding vote had no prior authorization. Is this sound?  

  (a) Yes, the game is void.  
  (b) No, the founding vote is presupposed as valid.  
  (c) It's technically correct but practically irrelevant.  

  **Question 8:** A proposal to dissolve the game passes. Is this:  

  (a) An exercise of the rules (internal).  
  (b) An exit from the rules (external).  
  (c) Both.  

  ---

  **Scoring Key:**

  Tally your answers and see which position they match best.

  - **Continuing View (CV)**: 1b, 2a, 3b, 4a, 5b, 6b, 7b/c, 8b  
    (The present majority can always change the rules.)

  - **Self-Embracing View (SEV)**: 1a, 2b, 3a, 4b, 5b, 6a, 7b, 8a  
    (Rules can bind future amendments.)

  - **Acceptance View (AV)**: 1b, 2a, 3c, 4c, 5c, 6c, 7b/c, 8b/c  
    (Validity depends on what the players accept.)

  - **Basic Norm View (BV)**: 1a, 2b, 3a, 4b, 5a, 6a, 7b, 8a  
    (Rules derive authority from a presupposed norm.)

  - **Reform View (RV)**: 1c, 2c, 3c, 4c, 5c, 6c, 7a, 8c  
    (The rulebook has gaps that need explicit fixes.)

  - **Deflationary View (DV)**: 1b, 2a, 3b, 4a, 5b, 6b, 7b/c, 8a  
    (Validity is procedural; no deep issues.)

  **Notes on Separation**:

  - The **Continuing View (CV)** and **Deflationary View (DV)** are separated by Question 8: CV says dissolution is an exit (8b), DV says it's an internal act (8a). If a player answers 8b, it's CV; if 8a, it's DV.

  - **Basic Norm View (BV)** and **Self-Embracing View (SEV)** are similar but differ on Q5: BV allows retroactive voiding (5a), SEV does not (5b). They also might differ on Q1 if the basic norm does not allow self-entrenchment, but in our key both are 1a.

  - **Acceptance View (AV)** is spread out; it is the only one that consistently chooses (c) for Q3, Q4, Q5, and Q6.

  - **Reform View (RV)** is the only one that chooses (c) for multiple questions and (a) for Q7.

  - Some combinations are not represented: e.g., a view that combines self-entrenchment with acceptance (like SEV+AV) might be coherent but is not in our group. It would be: 1a (like SEV) but then 3c, 4c, etc. (like AV). This might be attractive but is unexplored.

  - The diagnostic cannot separate every pair. For example, AV and RV might both choose (c) for many questions, but they differ on Q7 (RV: a, AV: b/c). Also, RV chooses (c) for Q8, while AV chooses (b) or (c).

  This diagnostic provides a starting point for discussion. Players may find their answers don't perfectly match one position, indicating a hybrid view or an unexplored combination.

  Total words: approx. 1500.
answer: |-
  ### Nomic Rulebook Authority Diagnostic Instrument  
  **Instructions:** Answer each question based on concrete in-game situations. Choose one option per question. These scenarios assume standard Nomic rules (mutable/immutable distinction, no explicit conflict resolution unless noted) and that all proposals pass with the required majority unless stated otherwise.  

  ---

  #### Diagnostic Questions  
  1. **Self-Terminating Amendment Rule**  
     A proposal amends the amendment rule itself to state: "No rule may be amended or repealed, including this one. The game must continue under these rules permanently." It passes. What happens?  
     (a) The amendment is valid; all future amendment attempts are void.  
     (b) The amendment is valid, but the restriction isn’t binding—future players can amend it normally.  
     (c) The amendment is void; it exceeds the authority of the amendment rule.  

  2. **Packaged Transmutation and Repeal**  
     A single proposal transmutes an immutable rule (Rule X) and then repeals it in one step. It passes. How does this compare to doing the transmutation and repeal as separate proposals?  
     (a) The repeal takes effect; packaging changes nothing.  
     (b) Only the transmutation takes effect; the repeal fails as Rule X was immutable when the repeal was "applied."  
     (c) The entire proposal fails; transmutation and repeal cannot be combined.  

  3. **Entrenched Voting Weight**  
     A rule states: "No player’s voting weight may be reduced without their consent." Later, a proposal reduces Player A’s weight without consent. What happens?  
     (a) The proposal is void; the entrenched rule binds absolutely.  
     (b) The proposal takes effect; entrenched clauses are mutable like other rules.  
     (c) The proposal takes effect only if players accept it; the rule’s force depends on ongoing agreement.  

  4. **Unresolved Rule Conflict**  
     An amendment (Rule Y) passes and conflicts with an existing rule (Rule Z). No rule addresses conflicts. What happens?  
     (a) Rule Y prevails as the later-enacted rule.  
     (b) Rule Y is void for conflicting with Rule Z.  
     (c) Both rules coexist until a new proposal resolves the conflict.  

  5. **Retroactive Voiding**  
     A proposal passes, declaring: "Amendment Q (passed three weeks ago) was void from the outset due to a procedural defect. Scores are retroactively adjusted." What happens?  
     (a) Amendment Q is erased; the game state rewinds.  
     (b) Amendment Q stands; past rule changes cannot be retroactively voided.  
     (c) Voiding is valid only if players accept the adjustment; otherwise, it creates chaos.  

  6. **Arbiter’s Self-Denial**  
     A proposal strips the arbiter of authority. The arbiter rules the proposal invalid. The proposal passes anyway. What happens?  
     (a) The arbiter’s ruling stands; the proposal is void.  
     (b) The proposal takes effect; the arbiter loses authority, including the power to enforce their ruling.  
     (c) A paradox occurs; the rulebook’s authority collapses without player consensus.  

  7. **Founding Vote Defect**  
     A player argues the entire rulebook is void because the founding vote occurred with no prior rules authorizing it. Is this sound?  
     (a) Yes; the game lacks foundational validity.  
     (b) No; the founding vote is presupposed as valid.  
     (c) It is logically correct but irrelevant since players treat the rules as binding.  

  8. **Game Dissolution**  
     A proposal to dissolve the game passes. Is this:  
     (a) An exercise of the rules (internal to the system).  
     (b) An exit from the rules (external to the system).  
     (c) Both internal and external—it uses the rules to end them.  

  ---

  ### Scoring Key  
  Tally your answers and match the pattern to a position. Positions are defined by their core principles (see "Logical Axes" below). Hybrid views are possible; high mismatch suggests unexplored assumptions.  

  #### Position Profiles  
  - **Continuing View (CV)**:  
    Answers: 1b, 2a, 3b, 4a, 5b, 6b, 7b/c, 8b  
    Core: Present majority is sovereign; rules cannot bind future amendments. Entrenchment is advice, not law.  

  - **Self-Embracing View (SEV)**:  
    Answers: 1a, 2b, 3a, 4b, 5b, 6a, 7b, 8a  
    Core: Rules can bind future amendments absolutely (e.g., immutable rules are truly unchangeable).  

  - **Acceptance View (AV)**:  
    Answers: 1b/c, 2a/c, 3c, 4c, 5c, 6c, 7c, 8b/c  
    Core: Validity depends on player acceptance; rules are predictions of behavior, not constraints.  

  - **Hierarchical (Basic-Norm) View (BV)**:  
    Answers: 1a/c, 2b, 3a, 4b, 5a, 6a, 7b, 8a  
    Core: Rules derive authority from a presupposed, unamendable norm (e.g., "obey the founding rules").  

  - **Reform View (RV)**:  
    Answers: 1c, 2c, 3c, 4c, 5c, 6c, 7a, 8c  
    Core: Paradoxes expose drafting flaws; explicit conflict rules and tiers are needed to avoid gaps.  

  - **Deflationary View (DV)**:  
    Answers: 1b, 2a, 3b, 4a, 5b, 6b, 7b/c, 8a  
    Core: No "deep" validity; rules are tools. Conflicts are resolved procedurally (e.g., later rules win).  

  #### Notes on Separation and Gaps  
  - **CV vs. DV**: Coincide on all in-game cases (e.g., Q1–Q7) but diverge on Q8 (dissolution). CV sees it as *exit* (8b); DV as *internal* (8a). This probes whether rules are "pre-commitments" (CV) or "ongoing procedures" (DV).  
  - **Unoccupied Combinations**:  
    - *SEV + AV* (rules bind only if accepted): Coherent but unattractive; SEV requires rules to bind independent of acceptance, while AV undermines bindingness.  
    - *BV + RV* (presupposed norm + explicit gaps): Incoherent; BV assumes a self-validating foundation, while RV rejects foundational certainty.  
  - **Indistinguishable Pairs**:  
    - *AV and RV* overlap on Q2–Q6 (both often choose c) but diverge on Q7 (RV: a, AV: c).  
    - *SEV and BV* overlap on Q2–Q4, Q6–Q8 but diverge on Q5 (BV allows retroactive voiding; SEV does not).  

  #### Logical Axes Probed  
  1. **Amendability of Amendment Rules**: Can rules bind their own alteration? (Q1, Q8)  
  2. **Atomicity of Rule Changes**: Does packaging affect validity? (Q2)  
  3. **Source of Entrenchment**: Does authority derive from rules or acceptance? (Q3, Q6)  
  4. **Conflict Tolerance**: Can contradictions coexist? (Q4, Q5)  
  5. **Foundational Basis**: Is authority internal (rules) or external (presupposition/acceptance)? (Q7, Q8)  

  This tree isolates positions by forcing choices on concrete cases. Players may self-identify incorrectly (e.g., a "proceduralist" scoring DV might call themselves "hierarchical"), revealing hidden models.  

  ---  
  **Format for Handout**: Print pages 1–2 for questions; page 3 for scoring. Players mark answers on paper; scoring is manual via the key.
