prompt: |-
  So — I cover neuroscience and bioethics for a Sunday ideas section, and a feature I'm writing about organ donation after circulatory death has quietly mutated into a piece about what death even is. I've got more competing answers than I have wordcount, so I need help triaging them.

  Here are the six I'm juggling:

  1. **Circulatory-respiratory.** Death is the irreversible stop of breathing and circulation. This is what actually happens in practice during donation-after-circulatory-death cases: circulation is stopped, the team waits out a hands-off interval of a few minutes, and then declares death and proceeds.
  2. **Whole-brain / total brain failure.** Death is the irreversible loss of the integrated functioning of the entire brain, brainstem included. This is roughly the legal standard in the US, and it's the one families run into when a body is warm, ventilated, and legally dead.
  3. **Higher-brain.** Death is the permanent loss of the capacity for consciousness. Heartbeat and breathing can continue on machines and the person is still gone. This implies that permanently unconscious but ventilated patients — deep permanent vegetative states, some cases of covert-awareness ambiguity — occupy a category we're currently getting wrong in both directions.
  4. **Organism-as-a-whole.** Skip organ-specific criteria entirely. Death is the loss of the body's capacity to sustain itself as a single integrated organism, however you measure it. Brain and heart are both just proxies for this.
  5. **The reversibility-horizon account.** A neuroscientist pitched me this and I can't tell if it's genuinely new or just clever-sounding, which is partly why I want your read. The claim: "irreversible" in all the standard definitions is smuggling in a hidden variable — namely, what technology is standing nearby. On her version death is indexed to locally available intervention, so an organism is dead at the moment when nothing *that can be brought to bear right there* could restore integrated function. Her own example: the identical patient is dead in a rural critical-access hospital and not-yet-dead in a quaternary center with ECMO standing by, and she thinks we should just accept that death is partly a fact about resources rather than pretending it's a pure fact about the body.
  6. **The standing-consent account.** Give up on death-as-biological-fact as the load-bearing element. Keep requiring prior authorization, but treat the relevant permission as something a competent person can grant in advance to cover states we'd otherwise call alive — specifically, permanent unconsciousness with a supported body. Death becomes a legal and moral status conferred by authorization plus loss of personhood-interests, not a threshold a monitor detects.

  What I want from you:

  - Score each of the six, 1–10, on three separate axes: (a) how philosophically defensible it is on its own terms, (b) how likely some version of it is to be doing real work in US law or hospital practice 40 years from now, and (c) how costly its errors are — i.e., if we adopt it and we're wrong in individual cases, how bad is the resulting harm to a still-living patient versus to a donor's family or a transplant recipient. Give me the numbers in a little table, not prose.
  - Then collapse that into a tier list (S/A/B/C) of which one I should treat as the most serious contender for the spine of the piece, and say a sentence per item about why it landed where it did.
  - One more number on its own: your honest estimate of the probability that US practice moves off whole-brain onto something else in the next 40 years. Something like 0.15 or 0.6 — whatever you'd actually bet, plus two sentences on what would move it.
  - Tell me which single placement of yours a room full of transplant surgeons and philosophers would object to most loudly, and wether you'd still defend it if they did.

  Don't send me a reading list or citations — I've got my own fact-checking to do and half of it is behind paywalls anyway. I specifically want your judgment, including on item 5: is the reversibility-horizon move a real advance, or does it just relocate the ambiguity and call it a theory?
reasoning: |-
  Okay, let me tackle this query step by step. The user is a journalist writing about organ donation after circulatory death, and their piece has evolved into exploring the definition of death itself. They've presented six definitions and need help evaluating them across specific criteria to structure their article.

  First, I need to understand the user's core needs: they're overwhelmed by competing definitions and need a way to prioritize them within limited wordcount. The scoring system they requested (1-10 on three axes) suggests they want a structured, almost quantitative comparison. The tier list request indicates they need editorial guidance on framing the piece. The probability question about future US practice shows they're thinking about the piece's long-term relevance.

  Looking at the six definitions:
  - Circulatory-respiratory is the current practical standard for DCD but philosophically weak.
  - Whole-brain is the legal standard but faces challenges from neuroscience.
  - Higher-brain is philosophically strong but legally/practically problematic.
  - Organism-as-a-whole is elegant but vague in implementation.
  - Reversibility-horizon is provocative but risks making death location-dependent.
  - Standing-consent sidesteps biology entirely, focusing on consent.

  For scoring, I consider:
  Philosophical defensibility: How logically coherent is each definition? Higher-brain scores well here as it centers consciousness.
  Future relevance: Which might gain traction? Standing-consent could rise with tech advances.
  Error costs: Definitions risking harm to living patients (like circulatory) score worse here.

  The reversibility-horizon idea (item 5) is particularly interesting. While innovative in highlighting resource dependence, it makes death contingent on location - which feels ethically unstable. I rate it moderately on philosophy but low on future adoption.

  For the 40-year probability estimate, I land on 0.4. Key drivers would be: persistent diagnostic ambiguities in whole-brain determination, and pressure from organ demand. But change will be slow due to legal inertia.

  The most controversial placement will likely be scoring standing-consent highly on philosophical grounds. Transplant surgeons might object to decoupling death from biology, but I'd defend it as the only approach that honestly addresses permanent unconsciousness without claiming the body is dead.

  Throughout, I'm conscious this is for a Sunday ideas section - so the analysis needs rigor but also narrative appeal. The tier list should help the user build their article around the most compelling frameworks.
answer: |-
  Here's your triage toolkit, structured as requested:

  ### Scoring Table (a=Philosophy, b=Future Practice 40yrs, c=Error Cost)
  | Definition                | a   | b   | c   |
  |---------------------------|-----|-----|-----|
  | 1. Circulatory-respiratory | 3   | 7   | 2   |
  | 2. Whole-brain            | 6   | 8   | 5   |
  | 3. Higher-brain           | 9   | 6   | 7   |
  | 4. Organism-as-a-whole    | 8   | 5   | 6   |
  | 5. Reversibility-horizon  | 7   | 4   | 4   |
  | 6. Standing-consent       | 8   | 7   | 8   |

  *(c-axis note: Lower score = worse error (i.e., harming a living patient). Higher score = safer error (e.g., denying donation).)*

  ---

  ### Tier List for Article Spine
  **S-Tier (Core Contender):**  
  - **#6 Standing-Consent:** Radically honest about conflated ethical/biological questions. Forces the "why consent matters" conversation we’re already dancing around with advanced directives and PVS dilemmas.  

  **A-Tier (Essential Context):**  
  - **#2 Whole-brain:** The legal incumbent. Must address its contradictions (e.g., hypothalamic function persisting in "brain dead" bodies) and why it persists.  
  - **#3 Higher-brain:** Philosophically strongest challenge; exposes the consciousness elephant in the room. Vital for discussing diagnostic gray zones.  

  **B-Tier (Important Nuance):**  
  - **#5 Reversibility-horizon:** Sharp insight about "irreversible" being tech-dependent, but inflates contingency into definition. Best as critique, not replacement.  
  - **#4 Organism-as-a-whole:** Elegant unifying principle, but too vague for policy. Highlights why we *use* proxies like brain/heart.  

  **C-Tier (Practical but Flawed):**  
  - **#1 Circulatory-respiratory:** Current DCD workhorse, but biologically incoherent (organs recoverable = organism not fully "dead"). Necessary to explain, not philosophically defensible.  

  ---

  ### Probability of US Moving Off Whole-Brain in 40 Years: **0.4**  
  *Why?* Persistent diagnostic ambiguities (like residual hypothalamic function) and pressure from expanding organ demand *will* drive change. However, legal inertia, slippery-slope fears around PVS, and lack of consensus on a replacement will slow adoption. Expect evolution (e.g., stricter brain death protocols) before revolution.

  ---

  ### Loudest Objection & Defense  
  **Item:** Scoring #6 Standing-Consent as **S-Tier** and highest in philosophical defensibility (a=8).  
  **Objection:** Surgeons would rage at decoupling death from biology ("You're killing donors!"). Philosophers might reject "personhood-loss" as sufficient without biological death.  
  **Defense:** Absolutely. This forces the uncomfortable truth: current "death" declarations for DCD *already* rely on consent overriding biological continuity (reversible circulatory stops). It’s the only framework explicitly preventing the horror of harvesting from a conscious patient by making *valid consent* the absolute gatekeeper. The objection proves its value – it exposes our inconsistent moral intuitions.

  ---

  ### Verdict on #5 (Reversibility-Horizon)  
  **Not an advance, but a vital critique.** It brilliantly exposes the contingency baked into "irreversibility," making explicit what current definitions hide. But it *relocates* ambiguity from biology to resource allocation, creating unacceptable geographic/temporal instability in death determination. Useful for highlighting problems (e.g., ECMO blurring DCD lines), too dangerous as policy. Clever, not coherent.
