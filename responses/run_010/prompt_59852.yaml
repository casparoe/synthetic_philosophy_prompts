  ### In-Class Game Design: Understanding Common Priors and Disagreement  
  **Objective:** Make students viscerally experience why the common prior assumption is essential for Aumann's agreement theorem, and why "different starting points" prevent agreement even after full pooling.  

  ---

  ### **Game Structure: Two Rounds**  
  **Materials:**  
  - Two bags labeled "Bag A" and "Bag B" (use paper bags or boxes).  
  - 24 colored balls/tokens (or folded paper slips):  
    - **Round 1:** 12 red (R), 12 blue (B).  
    - **Round 2:** 8 red, 4 blue for Bag A; 4 red, 8 blue for Bag B.  
  - Whiteboard for public information.  
  - Student worksheets (see below) for calculations.  
  - Scoring: Participation points (e.g., 2 points per round for engagement, 1 bonus point for winning a bet).  

  **Group Structure:**  
  - 24 students → Split into two tribes: **Tribe A** and **Tribe B** (12 each) for Round 2.  
  - In Round 1, all 24 share a common prior.  

  ---

  ### **Round 1: Common Prior + Private Signals** (30 mins)  
  **Goal:** Show that pooling beliefs forces agreement (betting collapses).  

  1. **Setup (5 mins):**  
     - Publicly fill a bag with **12 red + 12 blue** balls. Announce: "This is the *only* bag. The true state is 50% red, 50% blue."  
     - Draw a ball (secretly, hide it) → True state (e.g., red).  

  2. **Private Signals (5 mins):**  
     - Pass the bag. Each student draws one ball (signal), **replaces it**, and notes:  
       - If drawn ball = true state → "Strong" signal (accurate with 75% reliability).  
       - If drawn ball ≠ true state → "Weak" signal (inaccurate, 25% reliability).  
     - *Rationale:* Simulates noisy information; ensures posteriors diverge despite common prior.  

  3. **Posterior Calculation (5 mins):**  
     - Students calculate posteriors using Bayes’ theorem (worksheet provided):  
       - Prior: P(Red) = 0.5.  
       - Signal strength: Strong → P(Red|Strong) = 0.75, Weak → P(Red|Weak) = 0.25.  
     - Students post posteriors on whiteboard anonymously (e.g., "Student 1: 0.75").  

  4. **Betting Phase (10 mins):**  
     - **Rules:**  
       - Betting pairs: Students with P(Red) > 0.5 vs. P(Red) < 0.5.  
       - Bet: "If red, I pay you 1 point; if blue, you pay me 1 point."  
       - Before betting, announce intention publicly.  
     - **Predicted Collapse:**  
       - When a pair announces intent, they realize:  
         - "If they disagree, they have conflicting signals."  
         - Pooling signals → posterior = 0.5 for both → bet collapses (no expected gain).  

  5. **Debrief (5 mins):**  
     - Q: "Why did no bets happen? What changed when you pooled?"  
     - Key: Common prior + pooled signals → agreement. Disagreement is "unstable."  

  ---

  ### **Round 2: Different Priors + Private Signals** (30 mins)  
  **Goal:** Show that different priors lead to persistent disagreement (bets proceed).  

  1. **Setup (5 mins):**  
     - Assign tribes: **Tribe A** (biased toward red), **Tribe B** (biased toward blue).  
     - Publicly fill two bags:  
       - **Bag A (Tribe A’s history):** 8 red, 4 blue → "You’ve seen 100 cases: 67% red."  
       - **Bag B (Tribe B’s history):** 4 red, 8 blue → "You’ve seen 100 cases: 33% red."  
     - Flip coin to pick true bag (e.g., Bag A). Draw true state (secretly).  

  2. **Private Signals (5 mins):**  
     - Pass the *true bag*. Each draws a ball (signal) and replaces it.  
     - Signal strength: Same as Round 1 (Strong if matches true state, else Weak).  

  3. **Posterior Calculation (5 mins):**  
     - **Tribe A:** Prior P(Red) = 2/3.  
       - Strong signal → P(Red|Strong) = 0.8; Weak → P(Red|Weak) = 0.5.  
     - **Tribe B:** Prior P(Red) = 1/3.  
       - Strong signal → P(Red|Strong) = 0.5; Weak → P(Red|Weak) = 0.2.  
     - Post posteriors on whiteboard (include tribe: "Tribe A: 0.8").  

  4. **Betting Phase (10 mins):**  
     - **Rules:** Same as Round 1.  
     - **Predicted Agreement to Disagree:**  
       - Tribe A with P(Red)=0.8 vs. Tribe B with P(Red)=0.2 → both see favorable bets.  
       - When pairing, they share tribes/signals but **don’t update to same posterior**:  
         - Tribe A: "I know Tribe B is biased, but *my* signal supports red!" → P(Red) ≈ 0.67.  
         - Tribe B: "I know Tribe A is biased, but *my* signal supports blue!" → P(Red) ≈ 0.33.  
       - Bets proceed (no collapse).  

  5. **Reveal & Score (5 mins):**  
     - Reveal true state → award bonus points to winners.  

  ---

  ### **Final Debrief** (15 mins)  
  **Stage the Philosophical Tension:**  
  1. **Q1:** "In Round 2, could we *redescribe* your priors as a common prior over a larger state (e.g., 'which tribe you’re in') plus evidence?"  
     - *Let students argue. Push:* "What would that common prior look like? How do you assign probabilities to tribal histories?"  

  2. **Q2:** "If we *can* always redescribe things this way, is the common prior assumption unfalsifiable? If *not*, what’s the difference between Round 1 and 2?"  
     - *Target:* Distinguish "common prior + asymmetric info" (Round 1) vs. "fundamentally different priors" (Round 2).  

  3. **Q3:** "In real life, how could we tell if disagreement stems from different priors vs. incomplete pooling?"  
     - *Admit the gap:* "In this game, I *manufactured* the common prior. In life, we never know. The theorem says: **if** there’s a common prior, pooling forces agreement. But if priors are truly different, disagreement can persist."  

  ---

  ### **Pitfalls & Solutions**  
  1. **Botched Arithmetic:**  
     - **Solution:** Provide worksheets with Bayes’ formula and pre-calculated posteriors (e.g., tables). Use decimals (0.75) not fractions.  

  2. **Bluffing/Competitive Posteriors:**  
     - **Solution:** Anonymize posterior posting. Award points for participation (not accuracy). Emphasize: "No one sees your individual result; we care about the pattern."  

  3. **Risk Aversion Killing Bets:**  
     - **Solution:** Use tiny stakes (participation points). Frame bets as "expected gain" exercises (e.g., "If your posterior is 0.8, betting wins 0.8 - 0.2 = 0.6 points on average").  

  4. **Time Management:**  
     - **Solution:**  
       - Round 1: Enforce strict 2-min calculation time.  
       - Round 2: Pre-assign tribes before class.  
       - Use timer app projected on whiteboard.  

  5. **The "Manufactured Prior" Gap:**  
     - **Address in Debrief:** Explicitly contrast "observed common prior" (Round 1) vs. "real-world uncertainty about priors" (Round 2). Stress: "The theorem doesn’t say priors *exist*; it says *if* they exist, disagreement vanishes after pooling."  

  ---

  ### **Why This Works**  
  - **Experiential Learning:** Students *feel* bets collapse (Round 1) vs. persist (Round 2).  
  - **Contrast:** Round 1’s instability vs. Round 2’s stability highlights the common prior’s role.  
  - **Philosophy in Action:** The debrief forces confrontation with the assumption’s plausibility.  

  **Predicted Outcome:** Students leave uneasy about glib dismissals of Aumann ("different starting points") and aware that the common prior is substantive, not just "bookkeeping."
