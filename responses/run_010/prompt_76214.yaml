prompt: |-
  I'm building a "what do you actually believe about heritability?" self-sorting quiz for a stats-literate general audience — people who can handle a variance ratio but have never touched the philosophy of biology literature. I want 8 to 10 items, each one a concrete scenario or a claim to agree/disagree with, and never one that names a camp or uses a loaded phrase like "genes for" — the point is to sort people by what they'd say, not by what they call themselves. Then a scoring key mapping answer patterns onto the underlying stances: the causal-contribution reading, the "it's only a description of variance in this population in this environment" reading, the genotype-by-environment-interaction view that estimates don't travel across settings, the twin-and-adoption-study-confound skeptics, and whatever else you think belongs on the list.

  Some nodes I want in there for sure:
  - a batch of genetically identical seedlings split between a rich and a deprived environment, asking what the reader expects to happen to the heritability estimate;
  - a claim that a high h² for some trait in one population licenses expecting the same group ranking to show up in a different population;
  - a set of polygenic scores that predict well in one ancestry group and poorly in another — what does the reader think that shows about the score;
  - an item on whether "missing heritability" is a puzzle at all.

  Lay out the logical space first: which combinations of answers the items make available, which ones nobody actually holds and why (incoherent, unattractive, or just unexamined), and flag any two positions your items can't really tell apart. Also if any of my four nodes is a bad diagnostic, say so and swap it.
reasoning: |-
  Okay, the user wants to create a heritability quiz for a stats-literate audience. They need concrete scenarios without loaded terms to sort people into underlying stances. Let me start by understanding their main nodes: seedlings in different environments, group rankings across populations, polygenic scores across ancestries, and missing heritability.

  First, I should map out the logical space of heritability beliefs. The key positions are Descriptive-Statistics, Causal-Contribution, GxE-Sensitivity, and Confound-Skeptic. Each has distinct views on what heritability measures and its limitations. 

  The user mentioned four nodes. The seedling scenario tests if environment affects heritability estimates. That's good for distinguishing Descriptive vs. Causal views. The group ranking item checks if high heritability implies stable rankings across groups. This targets population-specific vs. universal beliefs. Polygenic scores predicting differently in ancestries can reveal views on genetic vs. environmental causes of prediction differences. Missing heritability questions whether it's a puzzle, which touches on measurement issues versus inherent limitations.

  I need to ensure items don't use jargon. Each question must be a scenario or claim. For example, the seedling item can show how heritability changes with environmental variation. The group ranking item challenges the assumption that genetic rankings persist. Polygenic score differences could be misinterpreted, so the options need to cover genetic architecture versus environmental factors.

  Missing heritability might be tricky. Some see it as a technical problem, others as a conceptual flaw. Including options that address both perspectives is key. Also, Confound-Skeptics might dismiss twin studies altogether, so an item on study designs is necessary.

  I should check if any positions are conflated. For instance, GxE-Sensitivity and Descriptive-Statistics both emphasize context but differ in focus. Items need to tease them apart. The seedling item does this by linking environmental shift to heritability change, which Descriptive views highlight, while GxE focuses on unpredictability across environments.

  Polygenic score performance can confuse genetic differences with environmental effects. Including an option about environmental disparities versus genetic architecture helps differentiate stances. Confound-Skeptics might attribute prediction differences to study flaws, while others see it as valid evidence.

  Scoring needs to map answer patterns. For example, agreeing that heritability changes with environment aligns with Descriptive and GxE, disagreeing suggests Causal. Disbelieving cross-population rankings points to Descriptive or GxE. The combinations will sort users into the main positions.

  I should also identify incoherent positions. For example, thinking heritability is causal but also population-specific might be inconsistent. Or expecting group rankings to persist while acknowledging GxE interactions. Highlighting these helps refine the quiz.

  Finally, ensure the quiz avoids named camps. Each item must stand on its own, using scenarios to elicit natural responses. The scoring key then groups those responses into the underlying stances without labeling them initially.
answer: |-
  Here’s a streamlined 8-item quiz with scoring logic and a map of the logical space, designed to cleanly distinguish core stances on heritability without jargon or loaded terms.

  ---

  ### **Quiz Items**  
  *(Agree/Disagree/Neutral)*  

  1. **Seedling Split**:  
     *"A batch of genetically identical plant seedlings is divided: half grown in optimal conditions, half in poor soil. The heritability estimate for height in the combined group will be near zero."*  
     *(Tests: Environmental sensitivity vs. genetic determinism)*  

  2. **Ranking Stability**:  
     *"If Population A shows high heritability for educational attainment, we should expect the same socioeconomic groups to rank similarly in attainment if Population B has the same heritability estimate."*  
     *(Tests: Misconception of heritability as cross-population ranking predictor)*  

  3. **Polygenic Score Gap**:  
     *"A polygenic score predicts heart disease risk well in Europeans but poorly in South Asians. This likely indicates the score misses genetic variants more common in South Asians."*  
     *(Tests: Genetic essentialism vs. G×E/environmental-structure awareness)*  

  4. **Missing Heritability**:  
     *"The 'missing heritability' problem is primarily a technical challenge—better GWAS methods will eventually find the 'hidden' genetic variants."*  
     *(Tests: Belief in exhaustive genetic causality vs. statistical artifact view)*  

  5. **Adoption Study Inference**:  
     *"Adopted children's IQ correlating more strongly with biological than adoptive parents supports genes being the dominant cause of IQ differences."*  
     *(Tests: Confound skepticism & causal interpretation)*  

  6. **Equal Environments Claim**:  
     *"Twin studies assume identical twins experience equally similar environments—if this isn't true, heritability estimates are still reliable because genetics drive environmental choices."*  
     *(Tests: Confound skepticism depth)*  

  7. **Policy Heritability**:  
     *"If depression has 50% heritability in a population, targeting environmental factors (e.g., therapy access) can only ever address half the problem."*  
     *(Tests: Proportional thinking fallacy & causal partitioning)*  

  8. **Gene Editing Impact**:  
     *"Editing a gene linked to aggression in lab mice will reliably reduce aggression across all standard lab environments."*  
     *(Tests: G×E interaction awareness)*  

  ---

  ### **Logical Space & Scoring Key**  
  **Core Positions**:  
  1. **Descriptive-Statistics (DS)**: Heritability = *variance description* for a specific population/environment.  
  2. **Causal-Contribution (CC)**: Heritability ≈ *proportion of causation* attributable to genes.  
  3. **G×E-Sensitivity (GxE)**: Heritability ≠ *portable*; estimates collapse across environments.  
  4. **Confound-Skeptic (CS)**: Twin/adoption designs *fatally confounded*; estimates untrustworthy.  

  ---

  #### **Answer Patterns → Positions**:  
  | Item | DS          | CC          | GxE         | CS          |  
  |------|-------------|-------------|-------------|-------------|  
  | 1    | **Agree**   | Disagree    | **Agree**   | Neutral     |  
  | 2    | **Disagree**| Agree       | **Disagree**| Disagree    |  
  | 3    | Disagree    | Agree       | **Disagree**| **Agree**   |  
  | 4    | Disagree    | **Agree**   | Neutral     | **Disagree**|  
  | 5    | Disagree    | Agree       | Neutral     | **Disagree**|  
  | 6    | Disagree    | Agree       | Neutral     | **Disagree**|  
  | 7    | **Disagree**| Agree       | **Disagree**| Disagree    |  
  | 8    | Disagree    | Agree       | **Disagree**| Disagree    |  

  **Scoring**:  
  - **DS**: Disagree on 2,3,5,6,7; Agree on 1.  
  - **CC**: Agree on 2,3,4,5,6,7,8.  
  - **GxE**: Agree on 1; Disagree on 2,3,7,8.  
  - **CS**: Disagree on 4,5,6; Agree on 3.  

  ---

  ### **Coherence Constraints & Diagnostics**:  
  - **Incoherent Combinations**:  
    - **CC + DS**: Can’t claim heritability is *only* descriptive variance (DS) while treating it as causal proportion (CC).  
    - **GxE + CC**: G×E undermines portability; CC assumes stable genetic causality.  
    - **CS + CC/DS**: Skepticism invalidates methods CC/DS rely on.  

  - **Weak Diagnostics**:  
    - Item 4 (Missing Heritability): **Replace with**:  
      *"High heritability for a trait means we've identified most relevant genes."*  
      *(DS/GxE/CS: Disagree; CC: Agree)*  
    - Item 8 sharpens G×E distinction better than original "group ranking" item.  

  - **Blind Spots**:  
    - **DS vs. GxE**: Hard to distinguish *conceptually* (both contextual). GxE emphasizes *mechanistic unpredictability*; DS is *statistical*. Item 8 (gene editing) best separates them.  
    - **CS vs. Others**: CS uniquely rejects foundational methods (Items 5,6).  

  - **Unattractive/Unexamined**:  
    - **Pure CC**: Rare among experts (ignores G×E/confounds). Laypeople often default here.  
    - **DS-Only**: Ignores causal inference entirely; uncommon in practice.  

  ---

  ### **Why This Works**:  
  - **No self-labeling**: Positions emerge from concrete inference patterns.  
  - **Clears confounds**: Item 3 avoids "genetic difference" traps; Item 6 tests environmental assumptions.  
  - **GxE operationalized**: Items 1 (seedlings) and 8 (gene editing) force confrontation with environmental dependence.  
  - **CS isolated**: Items 5-6 directly challenge methodological trust.  

  Adjust answer scales (e.g., 5-point Likert) for nuance, but binary scoring simplifies mapping. Use the scoring table to assign dominant position based on majority alignment.
