  The user wants to name and conceptualize this phenomenon. They've provided clear examples: diabetes and hypertension threshold changes, and gene definition shifts. They contrast this with the seamless re-anchoring of chemical elements to atomic number. Their questions probe for existing terminology, conceptual boundaries, mechanisms, and distinguishing features.

  Hmm... The core issue seems to be the uncritical transfer of inductive warrants across criterion changes. Clinicians' "overdiagnosis" focuses on harm, not epistemology. Philosophical discussions of reference (e.g., causal theories) don't address warrant transfer. 

  Breaking it down: 
  First, the extension change itself isn't necessarily problematic - it's the assumption that previously established inferences automatically apply to the new members. Second, when predictions fail for new members, the explanation avoids implicating the criterion change. 

  The chemical elements case succeeds because atomic number explains why atomic weight worked. In medical examples, the new criterion often doesn't explain the old success - it's just moving a threshold on a continuum. 

  For naming... "Inductive warrant overextension" captures the core mechanism. "Criterion drift" is more evocative but less precise. The key definition should emphasize three components: criterion revision, unvalidated inference transfer, and failure attribution to anything but the revision.

  The boundary with successful re-anchorings lies in explanatory continuity: does the new criterion explain the old successes? If not, warrant transfer is epistemically reckless.

  User is clearly sophisticated - they've spotted a genuine gap in conceptual tools. Their contrast case shows deep understanding. They'll want precision, not jargon. Must avoid half-baked terminology suggestions that would send them on wild goose chases.
answer: |-
  Your phenomenon is distinct and under-conceptualized. I'll address your queries systematically:

  ### 1. Existing Concept?
  No established term captures this **triad**: (a) criterion-driven extension change, (b) **uncritical transfer of inductive warrants** to the new extension, and (c) **failure attribution to heterogeneity rather than boundary shift**. 

  Near misses:
  - **Diagnostic creep/overdiagnosis**: Focuses on harm to individuals, not epistemic warrant transfer.
  - **Reference drift** (philosophy): Concerns what a term denotes after change, not justification of inferences.
  - **Construct proliferation** (psychometrics): Describes new subtypes, not warrant transfer post-revision.

  ### 2. Conceptual Ranking & Gaps
  | **Candidate**          | Captures                               | Misses                                  |
  |-------------------------|----------------------------------------|-----------------------------------------|
  | **Operationalism**      | Definitional dependence on criteria    | Warrants surviving criterion change     |
  | **Natural kind debates**| Stability of inductions across changes | *Ad hoc* boundary shifts in medicine    |
  | **Reification**         | Treating constructs as real entities   | Dynamic criterion changes specifically  |

  ### 3. Mechanism Decomposition
  Your decomposition is correct:  
  - **Extension change**: Neutral tool revision (e.g., HbA1c replacing glucose)  
  - **Warrant transfer**: Epistemically illicit carryover of inferences (e.g., applying ACCORD trial results to BP 130-139 mmHg patients)  
  - **Failure absorption**: Attribution bias ("subtypes") masking boundary-change artifacts  

  The core pathology is **warrant transfer without justificatory continuity**.

  ### 4. Boundary Cases: Re-anchoring vs. Your Cases
  **Principled distinction**:  
  - **Successful re-anchoring** (elements): New criterion (atomic number) *explains why old criterion worked* (atomic weight correlated via proton-neutron ratio). Inductive success preserved through *explanatory continuity*.  
  - **Pathological cases**: New criterion (e.g., BP 130/80) *lacks explanatory linkage* to old warrants. Prognostic inferences tied to old threshold (140/90) don't automatically hold for new members.  

  This isn't merely about interests or luck—it's whether the new criterion *subsumes the old's causal basis*.

  ### 5. Proposed Term: **Inductive Warrant Overextension (IWO)**  
  **Definition**:  
  *The unjustified retention and application of evidence-based inferences (prognostic, therapeutic, epidemiological) to members added to a category through criterion revision, when:*  
  (a) *The revision expands/displaces the extension non-trivially*  
  (b) *No empirical re-validation occurs for new members*  
  (c) *Predictive failures are attributed to category heterogeneity rather than warrant-transfer error*  

  **Exclusions**:  
  - Revisions where new criterion explains old successes (e.g., chemical elements)  
  - Definitional changes without warrant transfer (e.g., redefining "planet" without claiming new bodies share Pluto's properties)  
  - Gradual diagnostic drift without abrupt extension shifts  

  **Key differentiator**: IWO requires *active epistemic negligence*—treating the category as if its inductive power resides in the *label itself* rather than the evidence-bound extension.

  ---

  ### Why this fits your cases
  - **Hypertension threshold change**: ACCORD trial warrants (derived from >140 mmHg cohort) overextended to 130-139 mmHg patients without new RCTs. Failures attributed to "mild hypertension" subtypes.  
  - **Gene redefinitions**: Trait-association warrants (from protein-coding loci) overextended to non-coding transcripts. Functional failures attributed to "non-functional genes."  
  - **Chemical elements contrast**: Atomic number *explains* atomic weight correlations—no warrant overextension occurred.

  IWO isolates the epistemic hazard: categories become **inductive tokens** where historical evidence is spent promiscuously across changing boundaries. The cost isn't merely clinical harm but *systematic misattribution of predictive error*.
