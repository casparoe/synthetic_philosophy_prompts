prompt: |-
  I am a junior in high school, and for the past fourteen months I have been running a small resale business out of my bedroom: I buy used vintage clothing in bulk lots at estate sales, photograph the pieces, and sell them individually online. I have a decision to make this weekend that I cannot settle on my own, and I want to lay out the situation as exactly as I can, because the advice I have been given keeps sounding confident without sounding true.

  I started with $600 of birthday money. My method has been to bring essentially all of it to every sale and buy the largest lot I could get for it. There have been twelve lots. Nine sold for between 1.8 and 3 times what I paid. Two roughly broke even after fees and shipping. One — a very large lot of heavily stained denim that I could not resell — returned about a quarter of its cost, and took my bankroll from roughly $1,900 down to $475. It took me five months and seven smaller purchases to climb back to the $2,400 I have now.

  On Saturday there is an estate sale two hours away with a collection I have seen photographed in detail, and I am as sure as I have ever been about one of these that it would resell for close to three times the $2,300 asking price. My older cousin, who does this at a much larger scale, tells me that if I really believe that, then anything less than all-in is just refusing to make money; he says the only question worth asking is what the average outcome would be if I could run the same purchase a hundred times, and that a purchase with a good average is one you should make as big as you possibly can. My mother, who watched me lose three-quarters of my money doing precisely what he recommends, thinks I should never commit more than a few hundred dollars again. Neither of them will engage with the other's reasoning.

  Two things complicate it that I do not know how to fold in. First, by June 1 I need $1,800 in cash for the deposit and airfare on a summer program I have already been accepted to and have told my parents I would pay for myself; if my bankroll drops below that, there is nowhere else for it to come from. Second, my nine-in-twelve record is twelve lots in one narrow category, and resale prices in that category have been sliding since December, so I am not certain the same ratio would come out if I ran it again.

  So I would like to know: is my cousin right that the average across a hundred imaginary repetitions is what I should be tracking, is my mother right that the size of the number matters more than the odds, or are the two of them answering different questions from the one I actually have? And what should I put down on Saturday — preferably a rule I can reuse on the next lot rather than a single figure, along with an honest account of how much that rule should shift given that my track record is short and the market is cooling.
reasoning: |-
  Okay, let me start by really understanding this user's situation. They're a high school junior running a vintage clothing resale business. They've built up $2,400 from an initial $600, but had a major setback losing most of their money on one bad lot. Now they're facing a big decision about investing $2,300 in a promising estate sale, with conflicting advice from their cousin and mother.

  Hmm, the core tension here is between probability and consequence. The cousin's "expected value" approach makes mathematical sense in a vacuum - if you repeat good bets enough times, you come out ahead. But the mother's trauma from watching that 75% loss makes her focus on downside protection. Both perspectives are valid but incomplete for this specific situation.

  Wait, the summer program deadline adds crucial real-world constraints. Needing $1,800 by June 1 means the next 6 weeks' cash flow is critical. Even if this purchase has great expected value, failure could mean missing the program - a consequence that outweighs statistical probabilities. The market cooling since December also worries me; past success might not predict future results.

  I notice the user is remarkably analytical for their age - tracking exact multiples (1.8-3x returns), understanding sample size limitations, and wanting a reusable rule. That's impressive. Their frustration about advice "sounding confident without sounding true" suggests they sense both relatives are oversimplifying.

  The denim disaster reveals their business has fragility. One bad lot erased months of gains because they were overexposed. This makes me think about "position sizing" concepts from investing - how much to risk per trade given your total capital. Professional traders would never bet their entire bankroll on one position.

  Also interesting how they mention the lot is two hours away. That adds time/gas costs and suggests less flexibility if they need to make multiple trips or can't easily assess condition in person. The stains on that denim lot probably weren't visible in photos - a risk here too.

  The real question seems to be about risk management under constraints, not just expected value. I should frame it as: "How to maximize growth while protecting against ruin and honoring near-term obligations." That combines both relatives' concerns.

  For the reusable rule, I'm considering suggesting a percentage cap per lot (maybe 25-33% of capital) plus a cash reserve for the summer program. That way they're never one bad buy away from disaster. The exact percentage could adjust as their bankroll grows or if market volatility increases.

  The market cooling trend matters more than they might realize. If vintage prices are down 10-20% across the board, that "3x return" estimate might be optimistic. They should probably apply a discount to their historical multiples when calculating current expected value.

  Most importantly, they need to separate the summer program money immediately. That's not business capital anymore - it's a committed expense. Treating it as such changes everything.
answer: |-
  Your situation requires balancing probability with consequence - and both your relatives are partially right but incomplete. Here's a breakdown and a reusable decision framework:

  ### Core Problem: Two Conflicting Truths
  1. **Your cousin is mathematically correct**  
     Expected Value (EV = Probability × Outcome) *is* the foundation of rational investing. If an opportunity truly has +EV, scaling up increases total gains over time. Your 75% success rate (9/12 wins) historically supports this.

  2. **Your mother is behaviorally correct**  
     A single catastrophic loss can destroy your ability to play the game. Your $1,900 → $475 crash proves this. Real-world constraints (like your $1,800 June 1 deadline) make large losses catastrophic even if "statistically unlikely."

  ### Your Unique Constraints Change Everything
  - **The $1,800 Deadline:** This isn't just money – it's a non-negotiable liability. Your business capital is now also an emergency fund.
  - **Market Uncertainty:** Cooling prices since December mean your historical 1.8-3x returns may be optimistic. This isn't the same game as last year.
  - **Sample Size:** 12 lots is too small to trust the 75% win rate long-term. Variance can brutalize small samples.

  ---

  ### A Reusable Decision Framework
  Use this 4-step evaluation for *every* future purchase:

  1. **Isolate Protected Capital**  
     Immediately remove funds for known near-term obligations.  
     → **Action now:** Set aside $1,800 for your program TODAY. Your working capital is **$600** ($2,400 - $1,800).

  2. **Calculate Maximum Tolerable Loss (MTL)**  
     What loss could you absorb without crippling your business or missing goals?  
     → Given your rebound took 5 months after losing 75%, your MTL is likely 20-30% of post-obligation capital.  
     → **For this lot:** MTL = 30% of $600 = **$180**

  3. **Adjust for Market Risk**  
     Apply a discount to your historical returns due to cooling demand.  
     Historical average return: ~2.2x (midpoint of 1.8-3x)  
     Conservative adjustment: Reduce by 20% → **1.76x expected return**  
     → If the lot costs $X, expected profit = (1.76 × $X) - $X - Fees = **$0.76X - Fees**

  4. **Apply the 5% Rule (Reusable Position Sizing)**  
     Never risk >5% of **total capital** on a single lot.  
     → Total capital today = $2,400 → Max risk = **$120**  
     Why 5%?  
     - Ensures 20+ losing lots to bankrupt you (very unlikely)  
     - Survivable drawdowns  
     - Compensates for your market’s increasing volatility  

  ---

  ### Recommendation for Saturday
  - **Do NOT go all-in.** Cousin's advice ignores your deadline and market shift.  
  - **Do NOT sit out.** Mother's fear ignores your expertise and EV edge.  
  - **Invest $100-$120** (4-5% of $2,400).  

  **Why this works:**  
  - Protects your $1,800 obligation  
  - Limits loss to ≤$120 (5% of capital)  
  - Gains exposure to a high-confidence lot  
  - Honors the positive EV without overextending  

  **If the lot sells well:** You profit and preserve momentum.  
  **If it fails:** You lose $120 but retain $2,280 — still above your $1,800 target, with time to recover before June.

  ---

  ### How to Adapt This Rule Long-Term
  | Condition               | Action                          | Position Size Adjustment |
  |-------------------------|---------------------------------|--------------------------|
  | **Market heating up**   | Increase confidence factor      | ↑ Max 7.5% of capital    |
  | **Market cooling**      | Reduce confidence factor (20-30%) | ↓ Max 3-4% of capital    |
  | **Near-term obligation**| Isolate funds FIRST             | Recalculate from new base|
  | **Losing streak**       | Reduce size until trend reverses| Halve position size      |
  | **Capital >$5k**        | Add diversification rule: ≤3% per category | Add category caps |

  ### The Honest Truth About Your Edge
  Your 9/12 record *suggests* skill, but 12 lots prove nothing statistically. With cooling demand, treat your next 10 purchases as exploratory. Size small until you have 6 months of data in this new market. Track every lot’s ROI including labor hours—sometimes “breakeven” lots cost you in time.

  **Saturday’s move:** Bid $120. If rejected, walk away. Your system must survive mispriced lots. The discipline to underinvest when others overextend is how resellers last decades. Your mother’s caution saves you from ruin; your cousin’s aggression builds wealth. Synthesize them.
