answer: |-
  **The idea in one paragraph**  
  You’ll run a game called "The Vicarage Test." Participants read a short passage privately and answer factual questions about it, rating their confidence. Midway, you reveal that *some* of them read a subtly altered version, but no one knows who or what changed. This casts doubt on their own judgment, not the text. They then re-answer the same questions with chocolate biscuits at stake. The goal is to make them feel the tension between knowing their initial belief might be unreliable (higher-order evidence) and clinging to it anyway (epistemic akrasia), mirroring an unreliable narrator’s grip on a reader.  

  **Materials and room**  
  - Whiteboard  
  - Printed copies of **one identical passage** (14 copies)  
  - Printed question sheets (14 copies)  
  - Pens (14)  
  - Small blank paper slips (28 total)  
  - Box of chocolate digestives (biscuits)  
  - Timer  

  **The rules and the scoring**  
  1. **First round:** Participants read the passage (5 mins). They answer 3 factual questions on slips (e.g., "What color was the car?"), each with a confidence rating: 1 (Guessing) to 5 (Certain). Slips are anonymous.  
  2. **Scoring:** Biscuits are awarded only for **correct answers rated 4 or 5**. Each such answer earns one biscuit. Lower confidence (1-3) or incorrect answers earn nothing.  
  3. **Second round:** After "the drop," they re-answer the same questions on new slips, same confidence scale. Scoring is identical: only correct + high-confidence answers win biscuits.  
  *Why no hedging?* High confidence (4-5) is the *only* way to win, but if wrong, they lose. Guessing (1-3) forfeits biscuits regardless. This forces them to confront *whether to trust their memory*, not avoid commitment.  

  **The drop**  
  **When:** After collecting first slips (at ~25 mins).  
  **What you say:** *"Before we score, I need to reveal something. Half of you read a version with one minor detail changed—a word or fact altered. The other half read the original. I won’t say who or what. This can affect how reliably you interpreted what you read."*  

  **Run sheet**  
  - **0:00–0:05:** Introduce the game: "We’re testing how we process narrative." Hand out passage.  
  - **0:05–0:10:** Silent reading.  
  - **0:10–0:15:** Hand out Q-sheets + slips. Answer Qs + confidence. Collect slips.  
  - **0:15–0:25:** Discuss passage themes (e.g., "What mood did it create?"). *Do not discuss facts*.  
  - **0:25–0:27:** **The drop** (script above).  
  - **0:27–0:32:** Hand out new slips. Re-answer same Qs + confidence. Collect.  
  - **0:32–0:45:** Score Round 1: Tally correct 4/5s on whiteboard. Distribute biscuits.  
  - **0:45–1:00:** Score Round 2. Distribute biscuits.  
  - **1:00–1:30:** Debrief (questions below).  

  **The debrief**  
  *(Ask these, don’t lecture. Link answers to concepts.)*  
  1. *"When I revealed some versions were altered, did you doubt your memory of the text? What did that feel like?"* → (Higher-order evidence: evidence about your reliability).  
  2. *"Did anyone keep a high-confidence answer in Round 2 even after suspecting their memory might be compromised? Why?"* → (Epistemic akrasia: believing despite doubts).  
  3. *"Who lowered confidence on something they ‘knew’ initially? What changed?"* → (Higher-order evidence overriding direct belief).  
  4. *"In Round 2, did you trust any detail more stubbornly? Which one, and why might that be?"* → (Epistemic akrasia as narrative inertia).  
  5. *"How is this like suspecting an unreliable narrator but still believing their first chapter?"* → (Link to fiction: we doubt the source, not just the facts).  

  **What will go wrong the first time**  
  **Problem:** Everyone gets the first answers right (your passage was too easy).  
  *Fix:* Pre-write 1–2 backup twist questions (e.g., "What was the protagonist’s surname?" if unrevealed in text). Reveal post-drop: "One question had no answer in your version." Use these for scoring.  
  **Problem:** Post-drop, they all hedge (rate everything 1–3).  
  *Fix:* Remind them: "Biscuits only for 4/5 confidence. If you’re sure, own it." If no one risks it, confess post-game: "No versions changed. Your doubt was the point."  
  **Problem:** They guess the trick (e.g., "All passages are identical!").  
  *Fix:* Nod: "Interesting! But if true, would that make you doubt your *own* answers more, or the text?" Pivot to debrief early.  

  **What the game can’t reproduce**  
  The game can’t replicate the *emotional investment* or *temporal duration* of an unreliable narrator. In fiction, we spend hours with a voice, bonding with their perspective before doubt creeps in. The game’s doubt is instant and intellectual; fiction’s is slow-burn and visceral. You’ll need to add: "Unlike this 20-minute test, a novel makes you *live* inside a compromised mind. You grieve the lost ‘truth’ because you trusted it for chapters. That’s why epistemic akrasia hurts—it’s betrayal by someone you believed."  

  ---

  **Passage Suggestion**: Use 2 paragraphs where a narrator describes a rainy drive. Include one inconsistent detail (e.g., "the cracked windscreen" early vs. "I wiped the fogged side window" late). Questions: 1) What was damaged? (Windscreen) 2) What did they wipe? (Window) 3) What was the weather? (Rain). All answerable confidently unless doubt clouds recall.
