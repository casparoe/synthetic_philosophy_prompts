prompt: |-
  second-year PhD student in a consciousness lab here, and I've been stuck with writing the protocol for how our RAs handle subjects' verbal reports. We run masked-presentation and rivalry tasks: subjects describe what they saw, and we also collect forced-choice and eye-tracking data that sometimes flatly contradicts the report. My PI wants the whole thing framed as heterophenomenology — the reports are the primary data, and we suspend judgment about whether the inner episodes they describe are real in the sense of actually having occurred. But nobody has ever operationalized that, so in practice RAs do the opposite and type "confabulation" into the spreadsheet any time a report doesn't match the stimulus.

  Can you write me a procedure an RA with no philosophy training could actually run? About 40 reports a session, two minutes each, anything unresolved gets flagged and comes to me. I need the questions to ask of a report in order, what counts as settling each one, when a report gets logged as data-about-a-report versus data-about-a-percept, what to do with reports of experiences the subject insists are indescribable, and where the neutral stance genuinely runs out and the RA is making a judgment heterophenomenology doesn't license.

  Then run it on three cases: (1) a fluent, confident report of a face in a masked trial where forced choice is at chance; (2) two subjects in identical stimulus conditions giving incompatible reports, where we have independent reason to think one of them is more accurate; (3) a subject who says "I saw the word, but I'm certain I didn't see anything." At least one should land somewhere my PI will hate, and say which. Finally, tell me which steps are just philosophy smuggled in as bookkeeping, and what the procedure can't do at all.
reasoning: |-
  Okay, this is a fascinating and tricky methodological challenge from a consciousness researcher. The core tension is between their PI's insistence on strict heterophenomenology (treating verbal reports as primary data without judging their truth) and the practical reality where RAs default to labeling discrepancies as "confabulation." 

  First I need to unpack what's really needed: a concrete protocol that operationalizes Dennett's framework for undergrad RAs handling messy perceptual reports. The user specifically wants:
  - A step-by-step flowchart for classifying reports
  - Clear decision points about when to log as "description-of-experience" vs "report-as-behavior"
  - Handling edge cases like ineffable reports
  - Recognition of where neutrality breaks down
  - Analysis of 3 test cases that'll likely expose philosophical fault lines

  Hmm... the deeper issue here is translating epistemology into Excel columns. Heterophenomenology requires bracketing the "reality" of reported experiences, but RAs are implicitly making metaphysical judgments every time they type "confabulation." The protocol must force them to stay at the textual level.

  Key design challenges:
  - Avoiding any language implying truth/falsity (even "inaccurate" is loaded)
  - Distinguishing report features (hesitations, confidence markers) from content
  - Building in flags for when interpretation exceeds textual evidence
  - Making the "neutral stance" mechanically enforceable

  For the test cases, I'll pick deliberately provocative examples. Case #3 ("I saw it but didn't see it") is perfect for exposing the limits - heterophenomenology must log the contradiction as-is, but the PI will hate that it yields "unclassifiable" data. That's the poisoned pawn in this methodological chess game.

  The smuggled philosophy will likely lurk in:
  - Defining what counts as "sufficient description" (already assumes a theory of expressibility)
  - Interpreting metacognitive statements ("I'm certain") as data about the report rather than the percept
  - The very act of categorizing reports imports folk psychology

  Notably, the protocol can't resolve:
  - Whether minimal reports ("something flashed") reflect impoverished perception or impoverished description
  - How to handle culturally atypical phenomenology
  - When subjects misuse language (e.g. calling a blur "clear")

  *scribbles flowchart skeleton*
  Start with verbatim transcription → isolate content claims → tag linguistic markers → cross-reference only with other verbal data (confidence ratings), never with forced-choice → log contradictions as textual features...

  Ah! The critical move: forced-choice/eye-tracking discrepancies become "additional behavioral data points" rather than "truth benchmarks." That might satisfy the PI while preventing "confabulation" labels. For the "indescribable" case, log the utterance itself as the datum: "subject reported ineffability."

  Biggest risk: RAs might resent the extra paperwork. Need to make the spreadsheet do heavy lifting with dropdowns and auto-flags. Time to draft concrete steps...
answer: |-
  Here's a procedural protocol designed to operationalize heterophenomenology for your RAs, followed by analysis of your test cases and limitations. The core principle: **Treat verbal reports as *textual artifacts* to be cataloged, not as truth claims about perception.**

  **Heterophenomenological Report Processing Protocol (v1.0)**

  **I. Pre-Session Setup**
  1.  **Template Spreadsheet:** Create a spreadsheet with these columns:
      *   Subject ID | Session ID | Trial # | Stimulus Type (Masked/Rivalry) | *Verbatim Report (Text)* | *Confidence Rating* (if collected) | *Reported Content (Text)* | *Metacognitive Markers (Text)* | *Ambiguity Flags (Text)* | *Coding Notes (Text)* | *Researcher Flag (Y/N)*
  2.  **RA Training:** Emphasize: "You are an archivist of language, not a judge of reality. Your job is to describe *what was said*, not whether it 'matches' anything. Never use 'confabulation,' 'wrong,' or 'inaccurate.' Use neutral, descriptive language."

  **II. Step-by-Step Processing (Per Report)**
  *   **Step 1: Verbatim Transcription (60 sec)**
      *   **Action:** Transcribe the subject’s *exact words* into "Verbatim Report." Include hesitations ("um"), repetitions, fillers ("like"), and emotional tones noted briefly in brackets (e.g., "[laughs]", "[sighs]").
      *   **Settled:** When the transcription is complete and accurate against the recording/notes. Flag if audio is unclear.
      *   **Logging:** Raw data-about-the-report.

  *   **Step 2: Extract Reported Content (30 sec)**
      *   **Action:** In "Reported Content," neutrally paraphrase the *percept described*. Use the subject's terms.
          *   *Example:* If subject says "It was definitely a red blur, like a squished circle, moving upwards," log: `Red blur, squished-circle shape, upward motion`.
          *   *Indescribable Reports:* If subject says "I saw something but I literally cannot describe it," log: `Subject reports indescribable visual experience`. If they offer *any* descriptors ("a feeling," "a flash," "weird"), log those: `Subject reports indescribable "flash" or "feeling"`.
      *   **Settled:** When the core described percept is captured neutrally using subject's vocabulary. Flag if the report is genuinely contentless *or* if the description is paradoxical (e.g., "a silent sound").
      *   **Logging:** Data-about-the-report (it's a summary of the *description*, not an endorsement of the percept).
      *   **Neutrality Limit:** Avoid interpreting metaphors literally ("It stabbed my eyes" → `Bright/Intense light?` - Flag for researcher). Don't "correct" terms.

  *   **Step 3: Identify Metacognitive Markers (20 sec)**
      *   **Action:** In "Metacognitive Markers," list words/phrases indicating the subject's *attitude toward their own report or experience*:
          *   Confidence: "Sure," "Maybe," "Sort of," "No doubt," "I guess," "Positive."
          *   Certainty: "Certain," "Absolutely," "Definitely," "Couldn't have been."
          *   Clarity: "Clear," "Vague," "Fuzzy," "Sharp."
          *   Qualifiers: "Kind of," "Almost," "Partially," "Seemed like."
          *   Perplexity: "Weird," "Confusing," "Made no sense," "I don't know how to say it."
          *   Ineffability: "Can't describe," "No words," "Beyond description."
      *   **Settled:** When all relevant markers are listed. Flag if markers are contradictory (e.g., "Absolutely sure... I think").
      *   **Logging:** Data-about-the-report (features of the subject's linguistic act).
      *   **Neutrality Limit:** RA is *not* judging if confidence is *justified*, only noting its expression.

  *   **Step 4: Check for Ambiguity/Internal Conflict (10 sec)**
      *   **Action:** In "Ambiguity Flags," note:
          *   Contradictions within the report (e.g., "It was red... no, maybe blue").
          *   Explicit statements of uncertainty/perplexity not captured in Step 3.
          *   Vagueness that makes content unclear (e.g., "Something happened").
          *   Mark "Y" in "Researcher Flag" if any ambiguity flag is set *or* if Step 2/3 was flagged.
      *   **Settled:** Based on presence/absence of flags in the text.
      *   **Logging:** Data-about-the-report (identifying features requiring potential researcher review).

  *   **Step 5: Cross-Referencing (Strictly Limited - 10 sec)**
      *   **Action:** *Only* check if the subject provided an **explicit confidence rating** during the trial (e.g., scale 1-10). Log this rating in its column. *Do NOT look at forced-choice responses, eye-tracking, or stimulus properties.*
      *   **Settled:** Logging the numerical rating or noting its absence.
      *   **Logging:** Data-about-the-report (another behavioral datum provided by the subject).

  **III. Handling Researcher Flags**
  *   RA sends flagged reports (marked "Y") to the PhD student (you) daily.
  *   **Your Role:** Review verbatim report and coding. Resolve ambiguities *only* by refining the descriptive coding (Steps 2-4) based *strictly* on the text. Do *not* invoke external data (FC, ET). If unresolvable textually, log the ambiguity explicitly (e.g., "Report contains unresolved internal contradiction: X vs Y").

  **IV. What NEVER Happens in RA Processing**
  *   Comparing "Reported Content" to the actual stimulus.
  *   Comparing "Reported Content" to forced-choice responses or eye-tracking.
  *   Using words implying truth/falsity, correctness, matching, or confabulation.
  *   Interpreting *why* the subject said what they said (beyond cataloging their own metacognitive markers).

  ---

  **Analysis of Test Cases (Applying Protocol Strictly)**

  1.  **Case 1: Fluent, confident report of a face in masked trial (FC @ chance)**
      *   **Verbatim Report:** "That was clear! Definitely a face, maybe female, looking to the left. Sharp eyes." [Assume confidence rating: 9]
      *   **Reported Content:** `Face, possibly female, leftward gaze, sharp eyes`
      *   **Metacognitive Markers:** `"Clear!", "Definitely", "Sharp"` + Confidence Rating: `9`
      *   **Ambiguity Flags:** `None`
      *   **Researcher Flag:** `N`
      *   **Outcome:** Logged purely as a fluent, high-confidence report describing a face. The FC data being @ chance is **irrelevant for the report coding**. It exists elsewhere in the dataset as separate behavioral data. *PI Perspective:* Pure heterophenomenology achieved. The report stands as a valid description of the subject's *reported experience*, regardless of stimulus visibility. **PI will like this.**

  2.  **Case 2: Incompatible reports in identical conditions; one subject more "accurate"**
      *   **Subject A Report:** "A vertical grating, pretty clear, grey lines." (Matches stimulus)
      *   **Subject B Report:** "Horizontal stripes, fuzzy, kinda greenish." (Mismatches stimulus)
      *   **RA Processing (A):**
          *   Content: `Vertical grating, grey lines`
          *   Markers: `"pretty clear"`
          *   Flags: `None` → Flag: `N`
      *   **RA Processing (B):**
          *   Content: `Horizontal stripes, fuzzy, greenish hue`
          *   Markers: `"fuzzy", "kinda"`
          *   Flags: `None` → Flag: `N`
      *   **Outcome:** Both reports logged neutrally as descriptions of different experiences. The external evidence suggesting A is "more accurate" (e.g., better ET fixation, consistent FC) **is not accessed or used by the RA.** The incompatibility is a feature of the dataset, not a problem for coding. *PI Perspective:* Ideal heterophenomenology. The reports reflect two different textual artifacts/experiences. **PI will like this.**

  3.  **Case 3: "I saw the word, but I'm certain I didn't see anything."**
      *   **Verbatim Report:** "I... saw the word 'APPLE'. But I'm absolutely certain I didn't see anything at all. It's confusing."
      *   **Reported Content:** `"APPLE" AND "nothing"` (RA flags: Paradoxical Content)
      *   **Metacognitive Markers:** `"absolutely certain", "confusing"`
      *   **Ambiguity Flags:** `Internal Contradiction: Saw "APPLE" vs Saw "nothing"`
      *   **Researcher Flag:** `Y` (Automatic flag due to Ambiguity Flag & Step 2 flag)
      *   **Your Resolution:**
          *   Refine "Reported Content": `Subject reports both seeing the word "APPLE" AND seeing "nothing".`
          *   Refine "Ambiguity Flags": `Explicit internal contradiction in reported percept.`
          *   **Cannot resolve** the contradiction textually. Log as-is.
      *   **Outcome:** The report is logged *in full*, capturing the contradiction as a core feature of the subject's utterance. It's a valid data point: "Subject produced a report containing a specific contradiction." *PI Perspective:* **The PI will likely HATE this.** Heterophenomenology demands logging the contradiction neutrally, but it results in "nonsensical" data that's hard to interpret within standard cognitive models. It highlights the subject's struggle or potential metacognitive error without offering an explanation, which feels unsatisfying. This is where strict neutrality clashes with the desire for coherent psychological explanation.

  **Where Philosophy is Smuggled In:**

  1.  **"Reported Content" Extraction (Step 2):** The act of paraphrasing inherently involves interpretation. Defining what constitutes the "core percept" assumes a theory of meaning and relevance. Deciding how to handle metaphors or unusual descriptions requires implicit assumptions about language use.
  2.  **Categorizing "Metacognitive Markers" (Step 3):** Assigning words to categories like "confidence" or "certainty" relies on folk-psychological understanding of these terms. It assumes these linguistic markers map cleanly onto internal states, which is philosophically contentious.
  3.  **Defining "Ambiguity/Conflict" (Step 4):** Identifying a "contradiction" relies on logical principles. Deciding what level of vagueness warrants a flag involves judgment about communicative intent.
  4.  **The Very Act of Segmentation:** Breaking the report into "Content" and "Metacognition" presupposes a model of how verbal reports are structured, potentially biasing against holistic or non-propositional descriptions of experience.

  **What the Procedure CANNOT Do:**

  1.  **Explain Discrepancies:** It provides no mechanism or language for *explaining why* reports might differ from stimuli, FC, or ET. It deliberately ignores these comparisons.
  2.  **Resolve Deep Ambiguity:** Reports like Case 3 remain paradoxical data points. The procedure doesn't provide tools to "fix" them.
  3.  **Handle Radical Miscommunication:** If a subject uses language idiosyncratically or misunderstands the task instructions fundamentally, the coding might be technically "correct" but miss the underlying issue.
  4.  **Incorporate Non-Verbal Behavior:** Hesitations, gestures, or physiological reactions during the report aren't captured unless explicitly verbalized ("I'm shaking").
  5.  **Guarantee Inter-RA Reliability:** Despite procedures, subtle judgments in Steps 2 & 3 could lead to coder drift without rigorous training and spot checks.
  6.  **Eliminate the "Feeling" of Judgment:** RAs might still *feel* like they're judging the subject, even if the protocol forbids it. The protocol controls output, not internal cognition.
  7.  **Provide a Theory of Consciousness:** It generates descriptive textual data. Interpretation within a theory of consciousness (e.g., access vs. phenomenal consciousness) happens *later*, by you or the PI.

  **Key Takeaway:** This protocol forces RAs to treat verbal reports as *linguistic behaviors* to be cataloged. It prevents the automatic "confabulation" label by severing the link between report coding and external validation during the coding process. The cost is accepting paradoxical or incoherent reports as valid data points (Case 3), which exposes the core methodological challenge of heterophenomenology: it brackets questions of truth but can generate data that seems inherently "untrue" or inconsistent, creating tension with explanatory goals in cognitive science. The PI's discomfort with Case 3 is the price of true operational neutrality.
