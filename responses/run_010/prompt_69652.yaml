prompt: |-
  Right, so I'm about three-quarters of the way through my third novel and I've got myself into a hole that I'm increasingly sure is philosphical rather than structural. It's set in a town like the one I grew up in, somewhere between Doncaster and the coast, and there are two strands: Nessa, a housing options officer who spends her days reading other people's files, and Priya, the girlfriend of Nessa's teenage son, who ends up in a forty-second video that goes round the whole county in about ninety minutes. Neither of them is a victim in the tidy way the plot needs, and that's the trouble — I keep writing scenes where they say they've been violated and then can't say why, and I've started to worry that I'm only leaning on the word privacy because it sounds weighty in dialogue.

  So before I draft part two I want the specification rather than the arguments. Treat it as though I'm commissioning a theory of why privacy is worth anything at all, adequate to the purpose of letting a character of mine speak from it without sounding like she's read a paper: what does such a theory have to deliver? Give me the requirements list — the phenomena it has to explain (why the watcher nobody ever catches still seems to do something to the person watched; why being described accurately can sting worse than being lied about; why I don't mind my GP knowing things I'd never tell my sister; why I've nothing to hide reads as a mistake rather than a defence), the cases it has to come out right on, the distinctions it mustn't run together (privacy against secrecy, confidentiality, anonymity, solitude; the right to privacy against the value of it; controlling access against restricting access against getting the norms of a situation right), and the facts it can't contradict — including that people say one thing and do another with their data, and that some invasions really do protect people, safeguarding being the obvious one. For each requirement, give me the case or consideration behind it in a sentence or two, and mark it non-negotiable or else a pet preference of a particular camp. I want you to be blunt about which of the things demanded here are genuine desiderata and which are just an anti-reductionist reflex: is it actually a requirement that a theory show privacy is good in itself rather than borrowed from property, bodily security or autonomy, or is that a thumb on the scale? Same question for the demand that a theory condemn all observation the subject hasn't agreed to. Then tell me whether some subset of the requirements simply can't be met together — I'd love an impossible triangle, honestly, because that's a novel — and which single requirement knocks out the most candidates.

  Some seeding, since these are the scenes I've already got and they're where I suspect the theory will either hold or break:

  - Nessa has entirely lawful access to a tenant's whole history, including her refuge addresses, reads it all, is kind about it, leaks nothing, and the reader is still meant to feel something has been done to that woman.
  - Priya's video is shot at a bus shelter, contains nothing illegal and nothing anyone at school didn't already know about her, and ruins her anyway.
  - A widow finds a second phone in her late husband's jacket and doesn't unlock it; I want the not-looking to matter and the looking to be something other than a betrayal of him.
  - A councillor who's pledged total transparency livestreams his own life and publishes his inbox and loves it, then gets an early dementia diagnosis, and his recordings become a record his family can't get out from under — consent given by an earlier self about a later one who can't give it.

  After the requirements, briefly and no more than a paragraph each, how do the main contenders do against the list: the control account, the restricted-access one, the one built on context-relative norms, the one that ties privacy to intimacy and friendship, and the reductionists who think there's no such thing over and above other interests. Flag which of my four scenes is pulling the most weight and which one I could probably cut without losing a requirement. No reading list, no citations — I'll find my own — and don't quote at me; I just want criteria sharp enough that I can hold a scene up against them and see if it stands.
reasoning: |-
  Okay, the user is a novelist struggling with a philosophical hole in their third novel. They've set up two main characters—Nessa, a housing officer with access to private files, and Priya, a teen whose video goes viral—and both feel violated without clear reasons. The user wants a theory of privacy that explains why invasions hurt even when no laws are broken or secrets exposed. They need this theory to feel authentic in dialogue, not academic.

  First, I need to unpack their core request: a "specification" for a privacy theory. They listed concrete phenomena (e.g., why accurate descriptions sting more than lies), distinctions (e.g., privacy vs. secrecy), and contradictions (e.g., people mishandling their own data). They also flagged tensions—like whether privacy must be intrinsically valuable or if condemning all non-consensual observation is realistic.  

  The user’s frustration is palpable. They’re drafting scenes where characters *feel* violated but can’t articulate why, and they worry "privacy" is just a hollow buzzword. Their examples are sharp: Nessa legally reading files still feels invasive; Priya’s non-scandalous video ruins her; a widow avoids a dead husband’s phone; a transparent councillor’s past consent backfires. These highlight gaps in mainstream theories—control theories fail Priya (she consented to the video?), while context norms struggle with the councillor (his context changed).  

  I should start by listing rigorous requirements. Non-negotiables include explaining the watcher’s psychological harm (even unseen) and the "nothing to hide" fallacy. Key distinctions: privacy isn’t secrecy (the widow knows the phone’s contents exist; her restraint is about respect, not ignorance). The GP/sister example demands explaining relational boundaries—it’s not about trust levels but role-based appropriateness.  

  Then, the tricky part: balancing demands. The user suspects an "impossible triangle." I agree—privacy can’t be both purely intrinsic *and* instrumentally essential *and* perfectly separable from autonomy. If I prioritize intrinsic value (privacy as dignity), it might clash with safeguarding exceptions (e.g., overriding privacy to protect someone). The councillor’s scene exposes this: his past autonomy (consent) conflicts with his future self’s dignity.  

  For theories, reductionism (privacy as a proxy for security/autonomy) falters on Nessa’s scene—she *has* lawful access, so no autonomy breach, yet harm lingers. Contextualism handles the GP/sister distinction well but stumbles on the councillor (norms shifted under him). Intimacy-based theories fit the widow (not-looking as preserving relational integrity) but miss Priya—her school knew her secrets; the harm is about scale/decontextualization.  

  The widow’s scene is the strongest test: her choice not to look *matters*, but looking wouldn’t be mere betrayal. A good theory must frame privacy as respecting *potential* boundaries—the phone represents parts of her husband he compartmentalized, and violating that posthumously reframes their history. If the theory reduces privacy to property (his phone, his rules), it misses the relational weight.  

  I’ll flag Priya’s scene as the heaviest lift. It needs a theory explaining why *distribution* harms, even without new secrets. Control theories partially work (she lost control of the audience), but contextualism better captures the dehumanization—the video freezes her in a moment stripped of her ongoing identity. Still, most theories need tweaks here. The councillor scene could be cut; it illustrates reversibility of consent, but other scenes cover consent’s limits.  

  Finally, I’ll keep it citation-free as requested. The goal is giving them a "lens" to test scenes—e.g., if Nessa’s file-reading feels flat, does their theory explain the *asymmetry* (she knows the tenant’s vulnerabilities without reciprocity)? If not, it’s insufficient.
answer: |-
  Here's your requirements list for a functional theory of privacy, designed for novelistic authenticity and philosophical rigor. Focus on these criteria when drafting characters' voices or testing scenes.

  ### Core Requirements (Non-Negotiable Phenomena to Explain)
  1. **The Unseen Watcher's Harm**: Why *being watched* (even if undetected) alters behavior/self-perception.  
     *Case*: Priya altering her actions pre-video, knowing potential observation.  
  2. **Truth's Sting**: Why accurate exposure can hurt more than lies.  
     *Case*: Priya’s video showing known truths ruins her—decontextualized truth becomes weaponized.  
  3. **Role-Relative Disclosure**: Why we accept some knowing (GP) but not others (sister).  
     *Case*: GP vs. sister distinction—privacy enables compartmentalization of identity/relationships.  
  4. **"Nothing to Hide" Fallacy**: Why this feels like a category error, not a defense.  
     *Case*: Councillor’s transparency pledge pre-dementia—privacy isn’t about hiding, but *curating* selfhood.  
  5. **Lawful But Violative Access**: Why authorized use (Nessa reading files) still feels invasive without malice/leaks.  
     *Case*: Nessa’s tenant files—access ≠ entitlement; knowing without reciprocity creates power asymmetry.  
  6. **Consent Reversibility**: Why consent (Councillor’s livestream) can become non-consent when context shifts.  
     *Case*: Dementia diagnosis making past consent irrelevant—selves are temporal, not monolithic.  

  ### Critical Distinctions (Must Not Collapse)
  - **Privacy vs. Secrecy**: Privacy guards *how* information flows; secrecy hides *that* it exists.  
    *Case*: Widow’s second phone—not looking respects privacy without implying secrets.  
  - **Privacy vs. Solitude**: Solitude is physical isolation; privacy is informational/relational boundaries.  
    *Case*: Priya in public bus shelter—no solitude, yet privacy invaded.  
  - **Value vs. Right**: Privacy’s *value* (why it matters) vs. *right* (when it should be protected).  
    *Case*: Safeguarding invasions—value remains, but right may be overridden.  
  - **Control vs. Restricted Access**: Control implies agency; restricted access is structural. Privacy requires both.  
    *Case*: Nessa controls access legally, but tenant lacks control over exposure.  

  ### Non-Negotiable Contradictions to Acknowledge
  - **Hypocrisy Gap**: People trade data freely yet resent corporate/government access.  
    *Case*: Priya sharing at school vs. county-wide video—scale and audience mutate perceived harm.  
  - **Safeguarding Exception**: Some invasions (e.g., welfare checks) protect people, proving privacy isn’t absolute.  
    *Case*: Nessa’s role—lawful access can be both violative *and* necessary.  

  ### Contentious Demands (Blunt Assessment)
  - **"Good in Itself" Requirement**:  
    *Verdict*: **Anti-reductionist reflex**. Privacy need not be *sui generis*; it can emerge from autonomy/bodily integrity *without* being reducible to them. Nessa’s scene works if privacy is autonomy’s precondition (tenant’s story isn’t hers to know).  
  - **Condemn All Non-Consensual Observation**:  
    *Verdict*: **Unrealistic thumb on scale**. Public space observation (e.g., bus shelter) isn’t inherently wrong; harm stems from *decontextualization* (Priya’s video). Theories must explain *why* some observation violates, not condemn all.  

  ### The Impossible Triangle
  You *can’t simultaneously satisfy*:  
  1. Privacy as **intrinsic good** (non-instrumental value),  
  2. Privacy as **always overridable** (e.g., for safeguarding),  
  3. Privacy as **strictly individual** (ignoring relational/social dimensions).  
  *Your novel’s leverage point*: The councillor’s scene forces all three into conflict—intrinsic dignity vs. familial care vs. temporal identity.  

  ### Theory Showdown vs. Requirements
  - **Control Theory** (Privacy = controlling your information):  
    Fails **Truth’s Sting** (Priya didn’t lose control—she was in public) and **Unseen Watcher** (control irrelevant if unaware). Nessa’s scene breaks it—tenant never had control.  
  - **Restricted Access** (Privacy = limiting others’ access):  
    Fails **GP/Sister Distinction** (access is similar) and **Consent Reversibility** (councillor granted access). Struggles with **"Nothing to Hide"** (access isn’t the point).  
  - **Contextual Integrity** (Privacy = adhering to context-specific norms):  
    Aces **GP/Sister**, **Lawful Access**, and **Decontextualization** (Priya’s video). Fails **Unseen Watcher** (norms don’t cover undetected observation) and **Consent Reversibility** (norms can’t bind future selves).  
  - **Intimacy/Friendship Theory** (Privacy = enabling intimate bonds):  
    Nails **Widow’s Phone** (not-looking preserves relational integrity) and **GP/Sister**. Fails **Councillor** (livestream isn’t intimate) and **"Nothing to Hide"** (not just about relationships).  
  - **Reductionism** (Privacy = proxy for security/autonomy):  
    Fails **Lawful Access** (Nessa violates privacy without breaching security/autonomy) and **Truth’s Sting** (no autonomy loss in accurate exposure). Dies at **Unseen Watcher**.  

  ### Scene Weight & Cut Recommendation
  - **Heaviest Weight**: **Priya’s Video**. Tests decontextualization, truth’s sting, and the hypocrisy gap. If the theory can’t explain this, scrap it.  
  - **Safest Cut**: **Councillor’s Livestream**. Consent reversibility is covered thematically in the widow’s scene; dementia adds pathos but not a unique requirement.  

  **Your Litmus Test**: For any scene, ask: *Does this show a boundary that, when crossed, distorts identity or relationship integrity—even without secrecy, malice, or harm intention?* If yes, the theory holds. Nessa reading files passes; Priya’s viral video passes explosively. The widow’s restraint is your keystone—privacy as respect for the *unbounded self* we never fully know, even in those we love.
