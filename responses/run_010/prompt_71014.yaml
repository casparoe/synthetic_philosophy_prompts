  What's your credence in that whole conjunction? I want the decomposition, not a vibe: P(i), then P(ii | i) — and for that one I specifically care whether the disjunctive counterexamples (the lost-diamond type case, where each disjunct is basic but the disjunction isn't) are genuinely fatal or just a rearguard action — then P(iii | i & ii), and whatever way you think they should be combined.

  Also give me a separate number for the rival diagnosis: that the culprit isn't the principle's scope at all but the epistemic machinery underneath it (factivity plus distribution over conjunction, KK, or treating Kp as rigid across worlds), and say whether that competes with or supplements the restriction story.

  Last bit: which single sub-question is your final number most sensitive to, and what argument would shift it by more than 0.1?
