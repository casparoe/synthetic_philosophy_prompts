prompt: |-
  I have just taken a seat on a hospital's assisted-reproduction ethics committee. Our remit is narrow: we rule on referrals from clinicians when a proposed use of preimplantation genetic testing is contested, and by our own charter we are to decide new referrals by reference to our prior rulings rather than from first principles. I am voting on a referral next week and want to be clear about what our record actually commits us to.

  Our five rulings, in order:

  1. A couple asked whether the clinic might rank their eight viable embryos by expected health profile; they said they had no preference of their own. We permitted the ranking and permitted implantation of the top-ranked embryo, adding in the written opinion that implanting any of the others would not have wronged the child who would have resulted, and that the ranking created no obligation to use it.

  2. A couple, both congenitally deaf, asked us to select for the variant they carry so that their child would share their deafness. Refused, 6–1.

  3. A couple, both of whom have achondroplasia, asked us to select for the variant they carry. Refused, 4–3. The majority noted that every projection placed the resulting child's life comfortably above any threshold this committee has ever applied; the dissent held that we have no business overriding parents who are confident they can raise such a child well and who do not regard the trait as a misfortune.

  4. A couple carrying a variant for a childhood-onset degenerative condition asked us to select against it. The only unaffected embryos were ones that would otherwise have been discarded. We permitted the selection and wrote that the couple was not merely permitted but required to choose an unaffected embryo wherever selection was available — while also writing that the discarded embryos were not wronged, since no one who would otherwise have existed was made worse off.

  5. An advisory opinion, not a referral: a 41-year-old patient asked whether we would consider it wrongful for her to postpone conception by three years, given that the child who would then exist would be a numerically different person carrying a somewhat elevated risk of a manageable but significant condition. We wrote that the postponement would wrong no identifiable person, that we would therefore not advise against it on that ground, and that we would instead counsel her about the risk she would be accepting.

  The referral before me. A couple has three frozen embryos created six years ago. Testing that did not exist then can now be run, but only by thawing, biopsying, and refreezing, with a small chance of losing whichever embryo is biopsied. The clinic expects to find that one of the three carries a dominantly inherited variant for progressive bilateral hearing loss beginning in early middle age — substantial residual hearing for decades, no other expected health effects, and on every projection a life comfortably above any threshold we have applied. The couple asks us to approve implanting that embryo specifically. Their stated reasons: they were told six years ago that it was the first embryo created and they do not want to sort their children; two members of the family are deaf and they do not regard hearing loss as a misfortune; and they would welcome any of the three. They also inform us, and the clinic confirms, that if we refuse they will decline the testing altogether and have one embryo thawed and implanted at random, in which case the affected embryo may be implanted anyway and the clinic will never know which.

  Note that every contested ruling above concerns selecting for or against a trait; this referral concerns declining to select against one, and the couple's refusal changes which child exists rather than how any particular child fares.

  Please address the following:

  - Which of our five rulings is the closest analog to this referral, and in which respects the analogy holds and in which it breaks.
  - At least two candidate rules that jointly fit all five rulings but diverge on this one. State each rule so it can be checked against the record, and say what each implies about my vote.
  - Your recommendation for how I should vote if consistency with our own precedents is the governing constraint, with the reasons for preferring one rule over the others, and an honest account of how much the record really settles.
  - One further referral, described concretely, that would discriminate between the leading candidate rules.
  - What principle the committee would be adopting, wittingly or not, by approving and by refusing respectively — including whether the couple's announcement about what they will do if refused should be treated as a reason or as a threat.

  Two requests about how you present this. First, mark clearly where you are imputing a rationale the committee never articulated, as distinct from where the written opinions actually commit us. Second, separate what is settled among people who work on nonidentity and procreative ethics from what remains genuinely contested — several of the positions that could be read into rulings 1 through 5 are live disputes, and I would rather see them flagged as such than absorbed silently into an argument as though they were agreed.
reasoning: |-
  Okay, the user is on a hospital's assisted-reproduction ethics committee and needs to vote on a new referral. They've provided five prior rulings and a new case. The key is to determine consistency with precedents.

  First, I need to understand the new referral: A couple wants to implant an embryo that likely carries a gene for progressive hearing loss starting in middle age. They decline testing unless approved, and will implant randomly if refused. Their reasons include not wanting to "sort" children and not viewing hearing loss as a misfortune.

  Now, comparing to prior rulings:
  - Ruling 1 allowed health-based ranking but emphasized no obligation to use it. The new case is about selecting for a trait, which is different.
  - Ruling 2 refused selecting for deafness. But that was congenital deafness, while here hearing loss starts in adulthood. Also, the parents in ruling 2 actively wanted a deaf child, whereas here they're indifferent but prefer not to select against it.
  - Ruling 3 refused selecting for achondroplasia. The committee prioritized the child's projected life quality above parental preference. The dissent argued for parental autonomy. This seems closest because both involve selecting for a disability with non-life-threatening impacts.
  - Ruling 4 required selecting against a serious childhood degenerative condition. This established a harm threshold - only mandated selection against severe traits.
  - Ruling 5 said postponing conception doesn't wrong anyone due to nonidentity. Relevant because implanting the affected embryo creates a different person who wouldn't otherwise exist.

  The analogy with ruling 3 is strongest: both involve selecting for a disability with life quality above committee thresholds. But differences exist - achondroplasia is congenital while this hearing loss is adult-onset, and the parental motives differ.

  For candidate rules:
  Rule A: Mandate selection against traits significantly below health thresholds; permit otherwise. This fits rulings 2,3 (refusals for disabilities) and 4 (mandate for severe condition). Would refuse current case since hearing loss is below baseline health.
  Rule B: Only intervene when selection creates net harm to the child. Fits rulings 1 (no harm), 4 (serious harm), 5 (no identifiable victim). Permits current case since life still above threshold.

  Rule B seems more consistent as ruling 3's dissent emphasized parental autonomy when life quality is sufficient, and ruling 4's mandate was based on severity. The current hearing loss condition is manageable and adult-onset, so likely doesn't meet the harm threshold.

  The committee's unstated principle might be avoiding preventable serious harm to future children, while respecting parental autonomy for non-severe traits. The couple's statement about random implantation shouldn't be seen as a threat but as relevant information - it highlights that refusing testing doesn't prevent the outcome.

  For a future test case, consider a couple wanting to select for a mild controllable condition like asthma. Rule A would refuse while Rule B might permit, showing the divergence.

  Ultimately, voting to permit aligns best with precedents by focusing on the harm principle from ruling 4 and the nonidentity considerations from ruling 5. The record settles that traits not creating serious harm fall under parental discretion, but there's genuine philosophical debate about whether selecting for disability is inherently wrong regardless of harm.
answer: |-
  Here is a structured analysis addressing your queries, with clear demarcation of committee precedents vs. imputed rationales, and identification of contested ethical positions. The goal is consistency with your charter's precedent-based approach.

  ---

  ### 1. Closest Analog: Ruling 3 (Achondroplasia Selection)  
  **Analogy Holds**:  
  - Both involve selecting *for* a non-lethal disability (achondroplasia vs. adult-onset hearing loss).  
  - Both project lives "comfortably above any threshold" applied by the committee.  
  - Parental reasoning is similar: they do not view the trait as a misfortune and believe they can parent effectively.  
  - Refusal in Ruling 3 implies a baseline rejection of selecting *for* avoidable disabilities, regardless of life quality.  

  **Analogy Breaks**:  
  - **Trait Severity & Timing**: Achondroplasia is congenital and physically manifest; this hearing loss is adult-onset (delayed impact) and sensory-only.  
  - **Parental Motive**: Ruling 3 parents actively sought the trait; here, parents are indifferent to the trait but oppose *selection against it* due to symbolic/family reasons ("not sorting children").  
  - **Alternatives Impact**: In Ruling 3, selection *for* the trait determined which child existed. Here, *declining testing* determines which child exists (nonidentity issue).  

  **Other Rulings**:  
  - Ruling 2 (deafness) is superficially similar but involves congenital deafness (more severe impact) and explicit parental desire for a deaf child.  
  - Ruling 4 (degenerative condition) mandates selection *against* severe harm, creating asymmetry.  
  - Ruling 5 (postponement) reinforces nonidentity principles but addresses temporal risk, not trait selection.  

  ---

  ### 2. Candidate Rules Fitting All Five Rulings  
  **Rule A: Harm Threshold + Parental Autonomy Limitation**  
  > *"Selection for or against a trait is impermissible if it foreseeably results in a child with health below the committee’s established thresholds, or if it intentionally imposes avoidable disability without overwhelming benefit. Otherwise, selection is permitted."*  
  - **Vote Implication**: **Refuse**. Adult-onset hearing loss is "avoidable disability" (invoking Ruling 3’s refusal).  
  - **Fits Precedents**:  
    - Rulings 2 & 3: Selecting *for* disability refused (avoids "imposing" sub-threshold harm).  
    - Ruling 4: Selecting *against* severe harm required (mandates avoiding sub-threshold harm).  
    - Ruling 1: Permitted (no disability imposed).  
    - Ruling 5: Permitted (no sub-threshold harm).  

  **Rule B: Net Harm Avoidance + Nonidentity Primacy**  
  > *"Selection is only restricted when it would cause net harm to a specific future child (violating harm threshold) or when declining selection would lead to severe harm that could be avoided without sacrificing comparable life. Nonidentity effects absolve obligations unless harm is catastrophic."*  
  - **Vote Implication**: **Permit**. The child created would have a life "above threshold," and nonidentity means no alternative child is harmed (invoking Ruling 5).  
  - **Fits Precedents**:  
    - Ruling 4: Required (avoiding severe harm to a specific child).  
    - Rulings 2 & 3: Refused (achondroplasia/deafness could imply net harm, despite thresholds).  
    - Ruling 1: Permitted (no net harm).  
    - Ruling 5: Permitted (nonidentity absolves risk imposition).  

  ---

  ### 3. Recommendation for Voting & Consistency Assessment  
  **Vote: PERMIT** (with Rule B as the more consistent framework).  

  **Reasons to Prefer Rule B**:  
  - **Aligns with Ruling 4’s Core Logic**: Ruling 4 mandated selection *only* for a "childhood-onset degenerative condition" (severe harm), distinguishing it from non-severe traits. Adult-onset hearing loss (manageable, no other effects) falls outside this severity.  
  - **Ruling 3’s Dissent as Clarifying**: The dissent argued against overriding parents when life quality is sufficient. Rule B codifies this by limiting intervention to catastrophic harm.  
  - **Ruling 5’s Nonidentity Focus**: The couple’s choice determines *which child exists*. Refusing testing (as they threaten) would achieve the same outcome as approving—no "harm" to a specific child occurs.  
  - **Ruling 1’s Flexibility**: The committee explicitly rejected obligations to select for health (embryo ranking), supporting parental discretion for non-severe traits.  

  **What the Record Settles (and What It Doesn’t)**:  
  - **Settled**:  
    - Life above threshold ≠ automatic permission to select *for* disability (Rulings 2 & 3).  
    - Severe harm must be avoided (Ruling 4).  
    - Nonidentity absolves "wronging" in cases like postponement (Ruling 5).  
  - **Unsettled/Contested**:  
    - Whether "avoidable disability" itself is wrongful *even if* life quality is sufficient (live debate between "disability-neutral" vs. "impairment restriction" views).  
    - How to weigh parental autonomy vs. welfare when traits are non-severe (Ruling 3’s 4–3 split shows disagreement).  
    - Whether timing of disability (congenital vs. adult-onset) affects obligations (no precedent).  

  **Honest Assessment**:  
  The record leans toward Rule B but does not definitively settle it. Rule A can be defended via Rulings 2/3’s refusals, but these rulings lack explicit reasoning about harm severity, making Rule B more compatible with Ruling 4’s logic and Ruling 5’s nonidentity principles.  

  ---

  ### 4. Future Referral to Discriminate Between Rules  
  **Scenario**:  
  > *A couple carries a variant for a manageable, non-progressive condition (e.g., mild asthma or psoriasis). They request selecting an embryo *with* the variant to ensure the child shares their lived experience. Projected life quality is well above thresholds.*  

  - **Rule A (Harm Threshold + Autonomy Limitation)**: Refuse. "Intentional imposition" of avoidable disability without overwhelming benefit.  
  - **Rule B (Net Harm Avoidance + Nonidentity)**: Permit. No net harm (life above threshold), nonidentity applies, parental autonomy respected.  

  **Why It Discriminates**:  
  - Tests whether "avoidable disability" alone is sufficient for refusal (Rule A) or if severity/net harm is required (Rule B).  

  ---

  ### 5. Principles Adopted by Approving vs. Refusing  
  **If APPROVED**:  
  - **Principle**: *Parental discretion governs selection for non-severe traits when life quality is above threshold and nonidentity applies.*  
  - **Couple’s Announcement**: Treated as **reason** (not threat). It highlights that refusing testing leads to the same outcome, making intervention pointless (nonidentity logic).  
  - **Unstated Shift**: Moves toward the Ruling 3 dissent’s view that parents may decide when harm is not severe.  

  **If REFUSED**:  
  - **Principle**: *Selecting for any avoidable disability is impermissible, regardless of life quality or nonidentity effects.*  
  - **Couple’s Announcement**: Treated as **threat** (undermining committee authority). Ignores the nonidentity outcome.  
  - **Unstated Shift**: Solidifies Rulings 2/3 into a bright-line rule against disability selection, potentially conflicting with Ruling 5’s permissiveness toward risk.  

  **Contested Ethical Positions**:  
  - **Approving** implies acceptance of the "nonidentity problem" (Parfit, Shiffrin) as absolving obligations for non-severe harms. *This is contested* (e.g., disability advocates argue selecting *for* disability can be affirming; critics call it "harming future persons").  
  - **Refusing** assumes a "harm principle" where avoidable disability is inherently harmful *even if* life quality is high. *This is contested* (e.g., Barnes, Amundson argue disability is often neutral difference, not harm).  

  ---

  ### Key Distinctions in Analysis  
  - **Committee Precedents (Explicit)**:  
    - Life above threshold (Rulings 3, 4, 5).  
    - No obligation to select for health (Ruling 1).  
    - Nonidentity absolves "wronging" (Rulings 4, 5).  
  - **Imputed Rationales (Based on Patterns)**:  
    - Severity matters (Ruling 4 vs. Rulings 2/3).  
    - Parental autonomy limited by "intentional imposition" of disability (Rulings 2/3).  
  - **Live Ethical Disputes**:  
    - Nonidentity as negating harm obligations (settled in your Rulings 4/5 but debated in academia).  
    - Whether disability is inherently harmful (Rulings 2/3 assume yes; disability scholars disagree).  

  **Final Advice**: Vote to **PERMIT** to align with the committee’s narrower harm threshold (Ruling 4) and nonidentity principles (Rulings 4/5). Rule B best synthesizes the record, though the lack of explicit reasoning in Rulings 2/3 leaves room for debate. The couple’s alternative plan should inform (not dictate) your decision, as refusal achieves nothing given nonidentity.
