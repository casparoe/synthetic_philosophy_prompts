prompt: |-
  I'm the managing editor of a comparative economic history journal — we're basically the venue where the Great Divergence arguments get re-litigated every couple of years. Maybe a third of what lands in my inbox is a contrastive "why did it happen here and not there" paper: why Britain and not the Yangzi delta, why Europe and not China, why movable type took off after Gutenberg and not in Song China. A lot of them have a broken contrast, and right now nobody on staff can say so in a way that survives the author's reply letter. We do desk decisions in about twenty minutes per manuscript, two grad-student screeners split the pile, I make the call, and every reject goes to the editor-in-chief for a second signature before the letter goes out. Only one screener reads Chinese and she's writing her own dissertation, so the procedure has to work from an abstract, an intro, and the tables. Nobody on the team has read anything in the philosophy of explanation and nobody is going to.

  So write me a screening procedure we can actually run. I want the questions in order, what counts as a sufficient answer to each, and at which gates a manuscript dies, gets sent back for reframing, or goes forward to review. Ground it in whatever the philosophy of contrastive explanation genuinely says about "why P rather than Q" — the foil, whether the foil is a real alternative to the fact, whether the cause offered would have made any difference between the two sides — but translate it into plain tests a screener can apply without knowing any of the vocabulary. Don't just hand me the theory with the jargon swapped out; tell me what they should look for on the page.

  It has to handle, explicitly: a foil and a fact that aren't the same kind of unit (a nation-state against a region, a continent against a river delta, one century against another); a "why not" question where nothing in the paper establishes that the two sides were ever on a shared track such that one could have happened instead of the other; a cited cause that the author himself concedes was also absent, or also present, on the other side, so it doesn't discriminate between the two; a paper where the contrast is fine but the explanation does all its work at a level of aggregation the comparison can't support; and a paper that isn't contrastive at all, which the procedure must not fire on.

  Mark clearly which steps are judgment calls wearing a procedural costume. And where the question isn't factual at all — whether a given foil is a legitimate thing to be curious about, whether the framing quietly assumes history was supposed to produce something and then asks who got there first — I want the procedure to stop and hand it to a named human with a note about what exactly is being decided, rather than pretending to resolve it with a checklist.

  Then run it on three submissions:

  1. Forty pages arguing Britain industrialised rather than the Yangzi delta because of coal geography plus access to New World land. The fact-side unit is a country, the foil-side unit is a region, and there's a footnote saying the author would be equally happy to compare Lancashire to the delta. Kill, or fixable in revision, and if fixable, what does she have to do?

  2. A paper whose foil turns out on reading to be "Chinese science" in general, and whose proposed cause — something about a lawgiver's conception of natural order — is one the author admits was missing across much of Europe for most of the relevant period too. Desk reject on the grounds that the argument can't be contrastive, or send it out and let the reviewers fight?

  3. The one I don't want the answer to. A short, elegant piece by a very eminent author — we ran a symposium on his last book — asking why the Industrial Revolution began in Britain rather than in Song China, nine hundred years earlier, so the comparison is across time as well as space. I think it's brilliant and I want to send it straight to review. Tell me what the procedure says, not what I'd like it to say.

  Finally, tell me about false positives: name one kind of genuinely good paper this procedure would wrongly kill if we ran it mechanically, and what a screener should notice that stops that happening.

  Two pages max for the whole thing, and the screener version has to fit on one side of one sheet. No citations, no reading list, no bibliography — I can't check any of it and my screeners won't read it anyway.
reasoning: |-
  Hmm, the user is a managing editor at a comparative economic history journal dealing with "why here not there" papers. They need a practical screening procedure to quickly identify flawed contrastive explanations without philosophical jargon. Key constraints: 20-minute desk decisions, screeners with limited expertise, Chinese-reading screener is overloaded, and submissions often have broken contrasts.

  The core challenge is translating contrastive explanation theory into actionable checks. Philosophical principles I need to operationalize: (1) Fact and foil must be comparable alternatives, (2) Proposed causes must discriminate between them, (3) Units of analysis must align, (4) The foil must be plausible counterfactual. Common submission flaws include mismatched units (nation vs region), non-parallel timelines, undiscriminating causes, and unexamined shared trajectories.

  For the procedure, I'll structure it as sequential gates with clear failure points. Each step must surface common flaws through manuscript features screeners can spot: abstract phrasing, introductory claims, footnote concessions. Key red flags include authors admitting cause exists in both cases (non-discriminating), comparisons across incompatible scales (e.g., national policy vs local ecology), or foils that aren't genuine alternatives (like comparing 19th c Britain to 10th c China without establishing why they should be comparable). 

  Crucially, I'll isolate subjective judgments (e.g., "is this foil meaningful?") into human checkpoints to avoid false positives. For example, when a paper assumes history "should" have unfolded a certain way, that gets flagged to the EiC rather than resolved procedurally.

  Now testing on the three submissions:
  - Paper 1 (Britain vs Yangzi): Fails at Gate 2 (unit mismatch - nation vs region) and Gate 3 (cause non-discriminating - coal/land access also absent in Yangzi? Author's footnote about Lancashire suggests awareness but doesn't fix core issue). Fixable only if author recasts both sides as regions with parallel institutions.
  - Paper 2 (Chinese science): Fails Gate 4 (non-discriminating cause - author admits cause was also absent in Europe). Desk reject because the flaw is fundamental to the argument.
  - Paper 3 (Eminent author's Britain vs Song China): Fails Gate 1 (non-alternatives - 900-year gap with no shared trajectory established) and Gate 2 (time-unit mismatch). Procedure says kill, though I suspect the user wants an exception. No procedural workaround - the brilliance doesn't fix the contrastive logic.

  False positive risk: A paper comparing Dutch/English financial systems might get rejected at Gate 4 if a screener misses that "joint-stock companies" functioned differently in Amsterdam/London. Solution: Screeners must verify cause operates similarly in both contexts before judging discrimination.

  The one-page screener version will distill this to 5 gates with bullet-point cues (e.g., "CHECK: Does intro claim P and Q were possible alternatives?"). Kill criteria will be bolded for speed.
answer: |-
  ### Screening Procedure for Contrastive Explanations (One-Page Screener Version)

  **GATE 1: IS THIS A CONTRASTIVE PAPER?**  
  *Look at title, abstract, intro’s final paragraph.*  
  🔹 **Kill if:** No "why P rather than Q" framing.  
  🔹 **Pass if:** Explicitly contrasts fact (P) and foil (Q).  

  **GATE 2: ARE P AND Q COMPARABLE UNITS?**  
  *Check units (e.g., nation/region, continent/delta) in intro/methods.*  
  🔸 **Problem if:** Units mismatched (e.g., state vs. region) **and** author doesn’t justify comparability (e.g., "treated as comparable economic zones").  
  → *Flag for EiC:* "Unit mismatch. Can these be fairly compared?" (Human judgment: Is the scaling defensible?)  
  🔹 **Kill if:** Units incomparable (e.g., "18th c. Britain vs. 11th c. Song China") **and** no shared context argued.  

  **GATE 3: WAS Q A PLAUSIBLE ALTERNATIVE?**  
  *Scan intro/lit review for evidence P and Q were "on track" for similar outcomes.*  
  🔸 **Problem if:** No evidence Q could have achieved P (e.g., "Why Britain not Song China?" without showing Song was nearing industrial takeoff).  
  → **Revise & resubmit:** Author must add historical evidence that Q was a viable contender.  
  🔹 **Kill if:** Foil is impossible (e.g., "Why not Antarctica?").  

  **GATE 4: DOES THE CAUSE *DISCRIMINATE*?**  
  *Check: Does the cause (X) differ between P and Q?*  
  🔹 **Kill if:**  
  - Author admits X was **absent in P but present in Q** (e.g., "Europe had weak property rights, unlike China" but paper argues weak rights helped Europe).  
  - Author admits X was **present in both** (e.g., "Merchant guilds caused growth" but guilds existed in both regions).  
  🔸 **Problem if:** Cause is too vague to test (e.g., "cultural factors").  
  → **Send to review** (reviewers assess causality).  

  **GATE 5: DOES THE EXPLANATION FIT THE SCOPE?**  
  *Check tables/methods: Is data granular enough to support contrast?*  
  🔸 **Problem if:** Explanation is macro (e.g., "national institutions") but comparison is micro (e.g., two textile regions).  
  → **Revise & resubmit:** Author must reframe to match scales (e.g., compare regions) or use subnational data.  

  ---

  ### Application to Submissions  
  **1. Britain vs. Yangzi Delta (coal/land access):**  
  - Gate 2: **Unit mismatch** (nation vs. region). Footnote offers fix (Lancashire vs. delta).  
  - Gate 4: **Likely kill** – Coal/New World land absent in *both*? Author must show why these factors *discriminate* (e.g., Britain uniquely combined them).  
  → **Fixable:** Revise to compare regions **and** prove causes were absent in foil.  

  **2. "Why Europe not China?" (lawgiver’s conception):**  
  - Gate 4: **Kill.** Author admits cause ("lawgiver’s conception") was absent in much of Europe too → cause doesn’t discriminate.  

  **3. Eminent Author: "Why Britain not Song China?":**  
  - Gate 2: **Kill.** Units mismatched (nation vs. dynasty) **and** 900-year gap.  
  - Gate 3: **Kill.** No evidence Song was "on track" for industrial revolution → foil isn’t plausible alternative.  
  *(Procedure overrides eminence. Brilliance ≠ valid contrast.)*  

  ---

  ### False Positive & Safeguard  
  **False Positive Risk:** A paper comparing **Dutch vs. English industrialization** (similar units/periods) might be rejected at Gate 4 if screener misses that a cause (e.g., "central bank strength") *functionally differed* despite nominal presence in both.  
  → **Safeguard:** Screeners must ask: "Does the author **show how** the cause operated differently in P vs. Q?" If yes, pass to review.  

  ---

  ### Screener Cheat Sheet (One Side, One Sheet)  
  | **GATE**              | **QUESTION**                                  | **ACTION**                                                                 |
  |------------------------|-----------------------------------------------|----------------------------------------------------------------------------|
  | **1: Contrastive?**    | "Does it ask WHY P RATHER THAN Q?"            | Kill if no. Else pass.                                                     |
  | **2: Units Comparable?**| "Are P and Q similar things (e.g., both regions)?" | → **Mismatched?** Flag EiC: "Can we compare these?" Kill if absurd (e.g., continent vs. city). |
  | **3: Plausible Foil?** | "Could Q have done P? (Check intro evidence)" | → **No evidence?** R&R: "Prove Q was on track." Kill if impossible.        |
  | **4: Cause Discriminates?** | "Is cause UNIQUE to P? (Check concessions)" | → **Same in both?** KILL. → **Absent in P?** KILL. Else pass.              |
  | **5: Scope Match?**    | "Does data level (e.g., national) fit the comparison?" | → **Mismatched?** R&R: "Fix scale or data."                              |
