  The user has done impressive preparatory work, citing key texts and arguments from both sides. I should acknowledge this while ensuring my draft respects both scholarly positions. The sea captain jataka, Santideva's suffering argument, karma's intentionalism, and the precepts' exceptionless appearance are all crucial touchstones. 

  For the agreed claims, I'll focus on non-negotiable textual facts: karma's intentional basis, the precepts as training rules, the absence of hedonic calculus, and nirvana's unique status. These constrain extreme interpretations - consequentialists can't ignore intention, while virtue ethicists must account for impartial concern.

  The disagreements table needs careful phrasing to avoid strawmanning. For example, framing the sea captain dispute as "Does this case demonstrate consequentialist override or illustrate compassionate motive?" rather than loading the question. The terminological/substantive column is vital - some disputes may turn on how broadly we define "consequentialism."

  For cruxes, the user's three are strong, but I'll add a fourth: whether "suffering without owner" (Santideva) implies impartial aggregation or something else. Each needs paired predictions: e.g., virtue ethicists would expect Vinaya casuistry to focus on motive purification, not harm minimization.

  In my assessment, I'll note where formulations might be rejected - e.g., consequentialists may object to calling nirvana "non-maximizable," virtue ethicists to downplaying the sea captain's outcome focus. My reasoning is most exposed in interpreting no-self's ethical implications. The biggest game-changer would be finding explicit meta-ethical discussions in commentarial literature.

  This requires balancing scholarly rigor with clarity for a high school audience. The collaborative framing is brilliant - it forces engagement beyond talking points. I'll structure it as a formal statement with clear sections, using minimal Pali/Sanskrit terms without oversimplifying.
answer: |-
  Here is a draft joint statement reflecting the collaborative process you envision, designed to clarify the dispute and identify productive paths forward:

  **Joint Statement on the Interpretation of Buddhist Ethics: Consequentialist and Virtue-Ethical Perspectives**

  **1. Agreed Claims (Textual & Methodological Constraints)**

  Both interpretive camps agree that any adequate account of Buddhist ethics must coherently explain the following textual features and doctrinal commitments:

  1.  **Primacy of Intention (Cetanā):** Karmic quality is fundamentally determined by the *intention* (*cetanā*) behind an action. Outcomes alone do not constitute the moral quality of an act in the karmic framework.
  2.  **Structure of the Precepts (Śīla):** The core ethical precepts (e.g., against killing, stealing, false speech) function primarily as *training rules* (*śikṣāpada*) for cultivating character and intention, not as deduced theorems from a prior moral calculus. Their formulation is generally presented categorically.
  3.  **Absence of Aggregative Calculus:** The early Buddhist texts (Sutta/Sūtra Piṭaka) and Abhidharma provide no explicit, systematic methodology for quantifying, aggregating, or calculating net suffering/pleasure across beings to determine right action in complex cases.
  4.  **Nirvāṇa as Telos:** Nirvāṇa is the ultimate goal (*artha*) of the Buddhist path. It is not conceived as a "good" to be maximized *within* samsara alongside other goods, but as the cessation of suffering and the defilements (*kleśas*) that fuel it. The path aims at *realizing* this state, not producing more of it.
  5.  **Centrality of Compassion (Karuṇā) and Altruism:** The cultivation of boundless goodwill (*maitrī/mettā*) and compassion (*karuṇā*) for *all* sentient beings, extending to the willingness to sacrifice one's own well-being for others (especially in Mahāyāna), is a core ethical imperative.
  6.  **Suffering (Duḥkha) as Fundamental Problem:** The recognition of the pervasiveness of *duḥkha* and the commitment to its cessation (*nirodha*) are foundational to the entire Dharma, providing the soteriological context for ethics.
  7.  **Role of Wisdom (Prajñā):** Ethical conduct is intrinsically linked to and supported by the development of wisdom (*prajñā*), particularly insight into no-self (*anātman*) and dependent origination (*pratītyasamutpāda*).

  **2. Disagreements Table**

  | Dispute                                                                 | Consequentialist Statement (Goodman-esque)                                                                                                 | Virtue-Ethical Statement (Keown-esque)                                                                                                                                 | Substantive (S) or Terminological (T)? |
  | :---------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------- |
  | **Primary Ethical Concern**                                             | The fundamental ethical goal is the minimization/cessation of *duḥkha* (suffering/dis-ease) *across all sentient beings impartially*.       | The fundamental ethical goal is the cultivation of wholesome mental states (*kuśala*) and the eradication of unwholesome roots (*akuśala-mūla*), leading to liberation. | S                                      |
  | **Basis of Moral Evaluation**                                           | While intention matters karmically, the *moral rightness of an action* is ultimately determined by its consequences for aggregate suffering. | The *moral quality of an action* is determined primarily by the quality of the intention (*cetanā*) and its roots (greed, hatred, delusion vs. non-attachment, goodwill, wisdom). | S                                      |
  | **Status of Precepts (e.g., Killing)**                                  | The precepts are generally reliable rules-of-thumb for minimizing suffering, but can be justifiably overridden when adherence would cause significantly greater net suffering (Jātaka case). | The precepts express fundamental virtues (non-harming) and their violation inherently cultivates unwholesome roots. Exceptions, if any, relate to intention/motive purity, not net outcome calculation. | S                                      |
  | **Role of No-Self (Anātman)**                                           | Anātman undermines the metaphysical basis for strong agent-relative constraints (self/other distinction), grounding impartial concern for all suffering. | Anātman primarily undermines attachment and the conceit "I am," facilitating compassion by dissolving egoistic barriers; it does not dissolve the moral significance of the agent's *karmic* intention. | S                                      |
  | **Interpretation of Bodhisattva Sacrifice**                             | Accepting personal suffering/rebirth for others' benefit exemplifies maximizing aggregate welfare over self-interest, constrained by skilful means. | Accepting personal suffering/rebirth demonstrates the perfection of compassion and non-attachment; the *motive* is paramount, not a calculation of net welfare gain. | S                                      |
  | **Is 'Consequentialism' the appropriate label?**                        | Buddhist ethics is best *reconstructed as* a form of consequentialism (welfarist, impartial, minimizing suffering) as this captures its core drive. | Applying 'consequentialism' imports alien categories; Buddhist ethics is fundamentally about character transformation (*citta-bhāvanā*) and shares deep affinities with virtue ethics. | T (Primarily)                          |

  **3. Cruxes: Pivotal Sub-Questions**

  1.  **Crux A: The Intentionalism of Karma & Agent-Relativity:**
      *   **Question:** Does the intentionalism of karma entail *modern agent-relativity* (where the agent's own actions have special moral significance *for them*), or is it compatible with an *impartial standard* applied to motives (i.e., the motive of compassion is good *because* it impartially seeks suffering's cessation)?
      *   **Textual Evidence:** Analysis of Vinaya case rulings (especially controversial ones involving monks causing unintended harm or acting under duress) and Abhidharma classifications of wholesome/unwholesome mental factors (*caitasikas*). Focus on *why* an intention is judged wholesome/unwholesome.
      *   **VE Prediction:** Vinaya/Abhidharma will focus on the *presence/absence of unwholesome roots* (lobha, dveṣa, moha) in the mind-moment of action, regardless of distant consequences. Judgments will centre on the agent's state, not aggregate outcomes. Impartiality stems from the *universal scope* of wholesome motives like compassion, not from aggregative calculation.
      *   **Consequentialist Prediction:** Vinaya/Abhidharma, while emphasizing intention, will implicitly or explicitly link the unwholesomeness of motives like hatred or greed to their *tendency to cause suffering*, and the wholesomeness of compassion to its *tendency to alleviate suffering*. The *reason* an intention is bad/good is its connection to suffering/relief. Impartiality is inherent in the goal itself.

  2.  **Crux B: The Sea Captain Jātaka: Override or Upāya?**
      *   **Question:** Does the tale primarily demonstrate a *consequentialist override* of a precept (killing prohibited, but allowed to prevent greater net harm), or does it illustrate something else: e.g., the *purity of a compassionate motive* (devoid of hatred) combined with *skilful means (upāya)* in an extreme circumstance?
      *   **Textual Evidence:** Close reading of the Jātaka narrative *itself*: the justification given (if any), the Buddha-to-be's stated motivation, and the karmic result (commended, but still karmically weighty). Comparison with other extreme cases in the canon (e.g., self-sacrifice).
      *   **VE Prediction:** The text will emphasize the captain's *compassionate motivation* and *lack of ill-will/hatred* towards the murderer, framed as an act of desperation guided by wisdom (*upāya*), not a calculation of "500 > 1". The karmic result (commendation but still negative karmic seed) reflects the violation's gravity despite the motive.
      *   **Consequentialist Prediction:** The text will implicitly or explicitly justify the act based on the *net saving of lives* (preventing 500 deaths vs. causing one death). The commendation outweighs the karmic burden precisely *because* the outcome was a massive net reduction in suffering. Motive is compassionate *because* it impartially minimizes suffering.

  3.  **Crux C: Śāntideva's "Suffering Without Owner" & Aggregation:**
      *   **Question:** Does Śāntideva's argument ("suffering is to be prevented because... it has no owner. One should simply stop suffering. What amazes me is that suffering as such is not seen as the real issue...") primarily support *impartial aggregation* (all suffering counts equally, prevent the most), or does it primarily support *non-attachment to self/other distinctions* enabling boundless compassion, without implying a calculus?
      *   **Textual Evidence:** Detailed exegesis of Śāntideva's *Bodhicaryāvatāra* Chapter 8 (especially verses 89-106), examining the flow of argument, the context of the meditation, and the conclusions drawn. Comparison with other Mahāyāna sources on compassion and emptiness.
      *   **VE Prediction:** Śāntideva uses *anātman* to break down *egoistic barriers to compassion* ("because there is no self, *my* suffering isn't special"), leading to the spontaneous, boundless *expression* of compassion towards *any* suffering encountered. The focus is on the *mindstate* of the agent, not aggregative duty.
      *   **Consequentialist Prediction:** Śāntideva uses *anātman* to dissolve the *moral relevance of the subject/object distinction* for suffering, establishing that *all suffering* is intrinsically equally undesirable and must be impartially minimized ("simply stop suffering"). This logic inherently supports aggregation.

  4.  **Crux D: Nirvāṇa and Maximization:**
      *   **Question:** Does the unique status of nirvāṇa as the ultimate goal preclude interpreting the path's ethical dimension as aiming to maximize a *samsaric* good (well-being/suffering-reduction), or can the alleviation of samsaric suffering be seen as the proximate goal inherently linked to the ultimate goal?
      *   **Textual Evidence:** Analysis of texts describing the relationship between ethical conduct (*śīla*), concentration (*samādhi*), wisdom (*prajñā*), and nirvāṇa. Examination of how the alleviation of suffering *in samsara* is presented as a goal relative to nirvāṇa. Mahāyāna discussions of the bodhisattva's activity.
      *   **VE Prediction:** Texts will present ethical conduct as *purifying the mind* and *removing obstacles* (defilements) necessary for realizing nirvāṇa. Alleviating others' suffering *in samsara* (especially in Mahāyāna) is an *expression* of the compassion cultivated *on the path to nirvāṇa*, not an independent maximization goal.
      *   **Consequentialist Prediction:** Texts will consistently present actions that alleviate suffering as *karmically wholesome* and *conducive to progress on the path*, precisely *because* they reduce duḥkha. While nirvāṇa is the cessation *of* suffering, the ethical imperative *within* the path *is* the minimization of suffering as the proximate expression of the ultimate goal.

  **4. Critical Assessment of the Draft Statement**

  *   **Likely Points of Rejection/Slant:**
      *   *Consequentialists* might reject the Agreed Claim about Nirvāṇa (Point 4) as *overstated*. They might argue that while nirvāṇa itself isn't maximized, the *proximate aim of ethics within samsara* is unequivocally the reduction of suffering, making it functionally consequentialist *at that level*.
      *   *Virtue Ethicists* might find the Consequentialist statement on the "Basis of Moral Evaluation" in the table slightly slanted by implying the *rightness* is *determined* by consequences, whereas they would argue intention determines *karmic quality*, which is the primary moral evaluation. They might also argue the Sea Captain Jātaka row underplays the karmic consequence for the captain.
      *   The "Terminological" label for the 'Consequentialism' label dispute might be seen by *Virtue Ethicists* as underplaying their substantive point: that focusing on character/intention vs. states-of-affairs reflects a fundamentally different *structure* of ethical reasoning, not just a label.

  *   **Exposed Reasoning:**
      *   The distinction between "S" and "T" in the table is inherently fuzzy and contestable. Is the disagreement over the "Primary Ethical Concern" substantive or partly driven by different definitions of "ethical concern"? My placement leans towards "S" assuming the definitions are clear, but this is precarious.
      *   The predictions for the Cruxes (especially A & B) rely on interpreting often ambiguous or context-dependent textual passages. A single Vinaya case or Śāntideva verse could be interpreted either way by skilled scholars. My formulation assumes a degree of textual determinacy that may not exist.
      *   The treatment of *anātman* in Crux C is particularly exposed. The link between metaphysical doctrine and ethical implications is complex and debated. My framing assumes it *must* support one ethical implication primarily, but it might inherently support *both* readings simultaneously or differently in different contexts.

  *   **Potential Game-Changers (Recasting the Dispute):**
      *   **Vinaya Casuistry:** If a detailed survey of Vinaya case rulings revealed consistent patterns where *only* the immediate intention/mental state was considered, *never* the broader consequences, this would strongly favour VE on Crux A and undermine consequentialist claims about implicit calculation. Conversely, if consequences (especially suffering caused) were frequently cited *as the reason* an intention was unwholesome, it would bolster consequentialism.
      *   **Systematic Mahāyāna Meta-Ethics:** Discovering a clear, systematic discussion in a major Mahāyāna Śāstra (e.g., in Candrakīrti, Śāntarakṣita, Kamalaśīla) explicitly framing ethical decisions in terms of aggregating suffering/happiness would be a major coup for consequentialists. Conversely, a text explicitly grounding ethics *only* in purifying buddha-nature or cultivating bodhicitta as an intention would favour VE.
      *   **"Merely Verbal" Demotion:** If both sides agreed that "consequentialism" only means "caring about consequences *at all*," the label dispute (last row) would collapse into triviality. However, both camps operate with richer definitions (impartial aggregation vs. character transformation). Crux D (Nirvāṇa) could become more verbal if both sides agreed the proximate aim *within samsara* is suffering-reduction, but disagreed on whether this *proximate aim* constitutes the core "ethics" or just a supportive practice.
      *   **Promoting a New Crux:** A crucial point potentially underplayed is **Skilful Means (Upāya)**: Does *upāya* function primarily as context-sensitive expression of virtue (VE) or as context-sensitive optimization of good consequences (Consequentialist)? A focused study of *upāya* justifications across texts could be a major crux. Your initial setup mentions it briefly with the sea captain; it deserves elevation.

  **Conclusion:** Your characterization of the two camps is accurate and reflects the core tensions in the scholarship. This collaborative framework successfully isolates key points of agreement, clarifies the substance of the disagreements beyond terminological sparring, and crucially, identifies specific, researchable cruxes that could genuinely advance the debate. The most promising path forward lies in collaborative close reading focused on the Cruxes, particularly the Vinaya and Abhidharma evidence (Crux A) and Śāntideva's argument (Crux C), with predictions formally registered beforehand. Good luck with your essay – it tackles a profound and well-defined question at the heart of Buddhist ethics.
