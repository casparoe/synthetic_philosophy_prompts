prompt: |-
  I sit on the investment committee of a small endowment, and next month we must decide whether to retain a manager whose largest winning position was built on reasoning he cannot now reconstruct and which our own analysts judged unsound at the time. Half the committee holds that the outcome settles the matter; the other half holds that we would simply be rewarding luck. Before I let either side invoke epistemology, I want the specification written down.

  Write the requirements that any account of why knowledge is worth more than mere true belief must satisfy to be usable in a decision like ours. For each requirement, give the case or consideration that motivates it. Among the things the account must cope with, please make sure the following appear: the familiar swamping difficulty — that once a belief is true, its having been produced reliably seems to add nothing to its value; the ancient concession that a true belief serves exactly as well as knowledge for as long as it lasts, with the difference located in stability rather than in present usefulness (say whether your list requires an account to preserve that concession or to overturn it); cases in which knowing is worse for the knower than remaining ignorant; true beliefs produced by processes that would have gone wrong in very nearby situations; and the distinction between what a state is worth to the person in it and what it is worth to a group that relies on him.

  One requirement I want tested hard: whether the extra value of knowledge is available only in hindsight. If it is, can it do any work at all in an assessment that is necessarily made before the bet resolves?

  Structure the answer as: **Purpose**, one paragraph on what you take the account to be for; **The requirements**, numbered, each with its motivating case; **Non-negotiable or camp preference**, a short pass marking each; **The unsatisfiable subset**, if there is one — that is the part I most want; **The most exclusionary requirement**, a sentence or two; **Contenders in brief**, three or four standard answers scored against the list. Nine hundred to twelve hundred words. No citations or reading list — I can find the sources; it is the criteria I lack.
reasoning: |-
  Okay, the user is part of an investment committee deciding whether to retain a fund manager. The manager had a big win, but the reasoning behind it can't be reconstructed now, and their analysts thought it was unsound at the time. Half the committee thinks the outcome justifies keeping him, while the other half thinks it's just luck. The user wants to avoid getting into epistemology debates without clear criteria. They need requirements for why knowledge is better than true belief, specifically for this decision.

  First, I need to recall the key philosophical issues here. The swamping problem: once a belief is true, why does how it was produced matter? The ancient idea that true belief works just as well as knowledge until it fails. Also, cases where knowing is worse than ignorance, beliefs from unreliable processes in nearby situations, and the difference between value to the individual vs. the group. The big question is whether the extra value of knowledge is only visible in hindsight and if that's useful for decisions before outcomes are known.

  The user mentioned structuring the response with specific sections: Purpose, Requirements (numbered with cases), Non-negotiable, Unsatisfiable subset, Most exclusionary requirement, and Contenders. Each requirement needs a motivating case. Let me list out possible requirements based on their points.

  The swamping problem needs a requirement that the account must show why the source of truth matters even after the fact. Motivating case: a manager buys a stock based on tea leaves, wins, but the method is unreliable. Outcome doesn't justify the process.

  Ancient concession: true belief and knowledge are equally useful until the belief fails. The requirement should either preserve or overturn this. Motivating case: both true belief and knowledge lead to the same action, but knowledge is more stable.

  Cases where knowing is bad: e.g., knowing a painful truth. Requirement: the account must explain why knowledge is still valuable overall despite such cases.

  Nearby possible worlds: beliefs from processes that could easily fail. Motivating case: a manager predicts based on flawed data that happened to be right this time. The requirement should show that such beliefs are less valuable because they're fragile.

  Individual vs. group value: for the group relying on the manager, the reliability matters more than for the individual. Motivating case: an investor with a true belief might benefit, but the endowment needs consistent performance.

  Hindsight issue: if the extra value of knowledge is only seen after the fact, can it be used pre-outcome? Requirement: the account must allow assessment before outcomes are known. Motivating case: deciding to retain the manager now, based on process, not past luck.

  Now, considering the non-negotiables. The user probably can't compromise on the hindsight requirement and the need for pre-outcome assessment. Also, the distinction between individual and group value seems crucial for their committee context.

  The unsatisfiable subset might be the combination of the hindsight requirement with the swamping problem. If knowledge's value is tied to reliability, but outcomes swamp past reliability, it's hard to justify before outcomes. Also, if the ancient concession is true (equal usefulness until failure), then in a single instance, true belief and knowledge are indistinguishable in outcome, making pre-outcome assessment tricky.

  The most exclusionary requirement is likely the hindsight one, as it demands that the value of knowledge must be assessable without knowing outcomes, which many theories struggle with.

  Contenders: Reliabilism might handle reliability but struggles with swamping. Virtue epistemology focuses on skills but might conflate with outcomes. Instrumental accounts value knowledge for future actions but face the ancient concession. Pragmatic encroachment ties knowledge to practical stakes, which could address group vs. individual but might not resolve the hindsight issue.

  The user's deeper needs: They want a framework to objectively evaluate the manager beyond outcomes, avoiding rewarding luck. They need criteria that justify decisions pre-outcome, emphasizing process over results. The committee's split suggests a need for consensus through structured criteria. Also, they might want to prevent future poor decisions based on luck mistaken for skill.
answer: |-
  ### Purpose  
  The account must resolve the endowment's dilemma by providing actionable criteria for distinguishing reliably generated true beliefs (knowledge candidates) from luck-based true beliefs, specifically for evaluating agent performance *before* outcome realization. It must ground why—despite identical outcomes—knowledge is a superior basis for *future* decisions, especially when institutional resilience depends on consistent processes rather than isolated successes. This demands an account that functions prospectively, not retrospectively, to prevent rewarding randomness masked by results.

  ### Requirements  
  1.  **Source Sensitivity Beyond Outcome (Anti-Swamping):** The account must explain why the *source* of a true belief retains distinct value even after truth is confirmed. *Motivating case*: A manager buys a stock because tea leaves spelled "BUY"; it triples. The outcome is identical to a purchase based on sound financials, but the endowment cannot trust tea leaves for future bets. Outcome "swamps" past reliability only if value is purely backward-looking; the account must show how source reliability carries forward.

  2.  **Stability as Core Differentiator (Preserved Ancient Concession):** The account must preserve the ancient concession: a true belief and knowledge serve identically *in the immediate action guided*. The surplus value of knowledge must lie in its *persistence and resilience* across time or counterfactual scenarios. *Motivating case*: Two managers both correctly buy Asset X today. One knew (via rigorous analysis), one truly believed (via lucky guess). Both profit equally *this quarter*. But next quarter, when conditions shift, the guesser dumps X prematurely due to unstable conviction, while the knower holds based on understanding. Value emerges in sustained alignment with truth.

  3.  **Tolerance for Epistemic Harms:** The account must accommodate cases where knowing is instrumentally worse for the knower than ignorance, without collapsing knowledge's general value. *Motivating case*: A manager knows her firm is insolvent before others; paralysis or costly hedging ensues, while ignorant peers profit temporarily. Knowledge’s value must be systemic (e.g., truth-connection) or long-term, not strictly tied to immediate welfare.

  4.  **Near-Miss Vulnerability:** The account must devalue true beliefs produced by processes that fail in very similar possible worlds. *Motivating case*: A manager correctly predicts a merger based on a model with a critical data-entry error that happened to offset another error this time. In nearly identical markets, the model fails catastrophically. The true belief "could easily have been false," undermining its value for reliance.

  5.  **Group-Agent Asymmetry:** The account must distinguish the value of a belief *to the believer* from its value *to a group relying on the believer*. Knowledge's surplus value should be amplified under delegation or systemic dependence. *Motivating case*: An individual gambler benefits equally from a lucky true belief or knowledge when betting her own money. But an endowment relying on a manager needs the latter’s process to be *reliably transparent and justifiable* to the committee, ensuring collective trust and error detection. Luck lacks this scaffold.

  6.  **Prospective Assessability (Anti-Hindsight):** The account must allow the extra value of knowledge to be identifiable *before the truth of the belief is verified*. *Motivating case*: The committee must decide *now* whether the manager’s past success—which looks identical to knowledge ex-post—warrants future trust. If knowledge’s value is only visible in hindsight (e.g., "it worked"), it cannot guide pre-resolution decisions like manager retention.

  ### Non-Negotiable or Camp Preference  
  - **Preserved** for Requirement 2 (Stability as Core): The ancient concession is empirically undeniable; knowledge and true belief *do* guide identical successful actions initially. Overturning this misrepresents practical reasoning.  
  - **Non-negotiable** for Requirement 6 (Prospective Assessability): For the endowment's decision, hindsight-only value is useless. If knowledge’s value requires outcome confirmation, it collapses into outcome worship.  
  - **Non-negotiable** for Requirement 5 (Group-Agent Asymmetry): Committees inherently assess for delegation; individual-value-only accounts are inert here.

  ### The Unsatisfiable Subset  
  Requirements 1 (**Anti-Swamping**), 2 (**Stability**), and 6 (**Anti-Hindsight**) form a fatal triad under instrumentalism:  
  - If knowledge’s value is purely future-facing (stability), it seems assessable pre-outcome (satisfying 6).  
  - Yet, once a belief is true, its instrumental success *now* obscures its source (swamping). Why prefer reliability if the guess worked *this time*?  
  - Stability (2) requires counterfactual robustness ("it *would* persist"), but swamping (1) demands that the *actual* outcome not erase source differences. Meanwhile, Anti-Hindsight (6) forbids using future outcomes to retroactively justify the source.  
  **Conflict**: An account satisfying 1 and 2 must ground value in modal resilience (not outcomes), but this is *invisible* without historical or counterfactual data. Yet 6 demands we assess without outcome data. How can stability be measured prospectively? If only via past reliability, swamping resurfaces: why care about past reliability if the latest success was lucky? **This trio forces a choice: either accept retrospective validation (violating 6) or define knowledge’s value independently of outcomes altogether**.

  ### The Most Exclusionary Requirement  
  **Requirement 6 (Prospective Assessability)**. It excludes all accounts where knowledge’s value is (a) purely retrospective (e.g., "knowledge is that which was reliably produced *and succeeded*") or (b) dependent on verifying truth *first*. This requirement insists that the extra value must be a *predictive* feature of the belief-forming process, observable *ex-ante*.

  ### Contenders in Brief  
  1.  **Reliabilism + Instrumentalism (e.g., Goldman):** Knowledge = true belief from reliable process.  
      - *Scores*: Strong on 1 (source matters), 4 (flags fragile processes), and 5 (reliability aids institutional trust). Fails 2 (ignores stability: reliable processes need not produce *stable* beliefs) and catastrophically fails 6 (reliability is assessed post-hoc via outcomes, inviting swamping). Neutral on 3.  
      - **Verdict**: Unusable; rewards historical luck if buried in aggregate stats.

  2.  **Virtue Epistemology (e.g., Sosa):** Knowledge = true belief from intellectual virtue (skill).  
      - *Scores*: Good on 1 (virtue ≠ luck), 2 (skills foster stability), 5 (virtues justify delegation), and 6 (skills are observable pre-outcome). Weak on 4 (a virtue might misfire in nearby worlds) and 3 (virtuous knowledge could still harm).  
      - **Verdict**: Best contender if "virtue" includes dispositional resilience (addressing 4). But risks conflation: a lucky guess might mimic virtue in a one-off.

  3.  **Instrumental Value of Understanding (e.g., Grimm):** Knowledge’s value lies in understanding, which supports counterfactual reasoning.  
      - *Scores*: Excels at 2 (understanding enables stability) and 4 (understands why near-misses fail). Good on 1 (understanding isn’t swamped by truth). Fails 6 (understanding often verified post-hoc) and 5 (individual-focused). Neutral on 3.  
      - **Verdict**: Rich but retrospective; hard to audit pre-outcome without the manager’s testimony (which failed here).

  4.  **Pragmatic Encroachment (e.g., Fantl & McGrath):** Knowledge depends on practical stakes; higher stakes raise justification requirements.  
      - *Scores*: Addresses 5 (group reliance heightens stakes) and 6 (stakes are pre-outcome). Fails 1 (if truth is achieved, why does high-stakes justification matter more?) and 2 (stakes don’t ensure stability). Ignores 4.  
      - **Verdict**: Useful for weighting risks but doesn’t resolve the core luck/reliability distinction.

  **Conclusion for the Committee**: No account flawlessly satisfies all, but **Virtue Epistemology** comes closest by emphasizing *cognitive skills observable before outcomes*. For your decision: ignore the winning position’s outcome. Audit the manager’s *process* for replicable skills (e.g., data hygiene, stress-testing assumptions, error correction)—factors resilient in nearby worlds. If none exist, the win was luck, unrepeatable. If skills are evident but the analysts misjudged them, retain with oversight. The unsatisfiable triad (1,2,6) means you cannot avoid inferring reliability prospectively; but virtue theory makes this operational. Reward the *method*, not the result.
