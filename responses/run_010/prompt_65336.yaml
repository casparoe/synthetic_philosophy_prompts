  ### **Scoring Key**  
  **How to use:**  
  - Tally your answers.  
  - Match your pattern to the closest position.  
  - **Consistency Trap:** Compare Q1 & Q2. If you answered A/B for Q1 but C/D for Q2, you consistently distinguish therapy/enhancement. If you answered similarly for both (e.g., A/B for both), you may hold a "deflationary" view (see Eliminativist/Welfarist/Pro-enhancement). If inconsistent (e.g., A for Q1 and A for Q2), your intuitions conflict—you might hold two views at once!  
  - **Indistinguishable Positions:** Some views share answer patterns. These are flagged below.  

  #### **Named Positions and Their Commitments**  
  1. **Normal-Function View** (e.g., Boorse/Daniels)  
     - **Core Idea:** Health = normal species-typical function. Therapy restores it; enhancement exceeds it.  
     - **Your Pattern:** Q1: A/B; Q2: C/D; Q3: C; Q4: C; Q5: A or B; Q6: A; Q7: C; Q8: C; Q9: A; Q10: A; Q11: A; Q12: B or C.  
     - **Most Awkward Commitment:** Rejects growth hormone for a healthy short child (Q4-C)—even if it causes suffering—because shortness isn’t a "disease."  
     - **Indistinguishable From:** Purpose-Based View (splits on Q4/Q8/Q12).  

  2. **Purpose-Based View**  
     - **Core Idea:** The distinction hinges on intent: treating disease vs. improving beyond health.  
     - **Your Pattern:** Q1: A/B; Q2: C/D; Q3: C; Q4: D; Q5: A; Q6: A; Q7: C; Q8: D; Q9: A; Q10: A; Q11: A; Q12: B.  
     - **Most Awkward Commitment:** Supports cochlear implants against Deaf parents’ wishes (Q5-A) because the *intent* is therapeutic, ignoring cultural context.  
     - **Indistinguishable From:** Normal-Function View (splits on Q4: Purpose-Based says D, Normal-Function says C).  

  3. **Social-Constructivist/Positional View** (e.g., Buchanan)  
     - **Core Idea:** Enhancement = arms race for positional goods (e.g., status, jobs). What’s "normal" depends on social context.  
     - **Your Pattern:** Q1: A/B; Q2: C/D; Q3: D; Q4: B; Q5: D; Q6: A; Q7: D; Q8: B; Q9: A; Q10: A; Q11: A; Q12: D.  
     - **Most Awkward Commitment:** Rejects stimulants for a music student (Q3-D) even if it helps them, fearing unfair competition.  
     - **Indistinguishable From:** None.  

  4. **Giftedness/Species-Ethics View** (e.g., Sandel/Kass)  
     - **Core Idea:** Enhancement is hubristic—it disrupts appreciation for natural human design.  
     - **Your Pattern:** Q1: A/B; Q2: D; Q3: C/D; Q4: C/D; Q5: C/D; Q6: A; Q7: C/D; Q8: C/D; Q9: A or D; Q10: A; Q11: A; Q12: C.  
     - **Most Awkward Commitment:** Rejects mood pills for low-normal mood (Q8-C/D) even if beneficial, as it "tamper[s] with human nature."  
     - **Indistinguishable From:** Normal-Function on Q2/Q6, but differs on moral enhancement (Q12-C).  

  5. **Capability Approach** (e.g., Nussbaum/Sen)  
     - **Core Idea:** Focuses on enabling core capabilities (e.g., health, senses). Supports interventions expanding these.  
     - **Your Pattern:** Q1: A/B; Q2: A/B; Q3: A; Q4: A; Q5: A; Q6: C; Q7: A; Q8: A; Q9: C; Q10: A; Q11: A; Q12: A.  
     - **Most Awkward Commitment:** Supports cosmetic breast augmentation (Q9-C) if it enables "bodily integrity," even without medical need.  
     - **Indistinguishable From:** Welfarist/Pro-enhancement (all share Q1-2 A/B and Q12-A).  

  6. **Welfarist View** (e.g., Harris/Savulescu)  
     - **Core Idea:** Well-being is all that matters; therapy/enhancement is irrelevant.  
     - **Your Pattern:** Q1: A/B; Q2: A/B; Q3: A; Q4: A; Q5: A; Q6: C; Q7: A; Q8: A; Q9: C; Q10: A; Q11: A; Q12: A.  
     - **Most Awkward Commitment:** Supports super-speed prosthetics (Q2-A/B) even for healthy people, as it improves quality of life.  
     - **Indistinguishable From:** Capability Approach and Pro-enhancement.  

  7. **Pro-Enhancement (Duty to Enhance)** (e.g., Savulescu extended)  
     - **Core Idea:** We have a moral duty to enhance if it improves well-being.  
     - **Your Pattern:** Same as Welfarist (Q1-2: A/B; Q3: A; Q4: A; Q5: A; Q6: C; Q7: A; Q8: A; Q9: C; Q10: A; Q11: A; Q12: A).  
     - **Most Awkward Commitment:** Supports mandatory moral enhancement (Q12-A) to create a "better society," overriding autonomy.  
     - **Indistinguishable From:** Welfarist and Capability Approach.  

  8. **Eliminativist/Deflationary View**  
     - **Core Idea:** The therapy-enhancement distinction is incoherent or morally irrelevant.  
     - **Your Pattern:** Same as Welfarist/Pro-enhancement.  
     - **Most Awkward Commitment:** No "awkward" cases—it handles all interventions equally by ignoring the distinction.  
     - **Indistinguishable From:** Welfarist, Capability Approach, Pro-enhancement.  

  #### **Unoccupied or Incoherent Positions**  
  - **"Distinction matters, but no fact about normal function":** Incoherent. If the distinction matters, it must hinge on *something* (e.g., intent, welfare, social norms). No one defends this.  
  - **"Anti-enhancement but no baseline":** Unoccupied. Without a baseline (e.g., species-typical, social), opposition collapses into gut feeling.  

  #### **Handling Inconsistencies**  
  - **Q1 & Q2 Trap:** If you answered A/B for Q1 but A/B for Q2, you hold a "deflationary" view (e.g., Welfarist/Eliminativist). If you answered A/B for Q1 but C/D for Q2, you hold a "distinction" view (e.g., Normal-Function). If answers conflict (e.g., Q1: A, Q2: D), your intuitions are split—you might hold elements of both.  
  - **General Advice:** "Your answers suggest you’re trying to distinguish therapy from enhancement in some cases but not others. This might mean you hold two views at once—e.g., Normal-Function for physical traits but Purpose-Based for mood."  

  #### **Indistinguishable Groups**  
  - **Welfarist, Capability Approach, Pro-enhancement, Eliminativist:** All share the same answer pattern. No question separates them because they prioritize welfare/capabilities and reject the therapy-enhancement split.  
  - **Normal-Function and Purpose-Based:** Separated by Q4 (growth hormone): Normal-Function says C (normal variation), Purpose-Based says D (enhancement).  

