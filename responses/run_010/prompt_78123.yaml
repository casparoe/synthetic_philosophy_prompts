prompt: |-
  I am auditing my own intuitions about when interference with a person's conduct is legitimate, using Mill's *On Liberty* — especially the chapter on applications, and the India passages in it and in *Considerations on Representative Government* — as a test bed. I am taking a seminar on empire and liberal political thought, and after a long argument with the teaching assistant I decided that the only honest way to see where I stand is to write down my verdicts on particular cases first and look for the principle afterwards, rather than starting from a slogan. Here are the cases, with what I currently think about each:

  1. A mail steamer leaving Bombay with cholera aboard is held in quarantine, delaying a passenger's business by two weeks. Legitimate, even though the delay harms only the passengers themselves.
  2. A widow in a famine-struck district refuses medicine for her son because a local practitioner forbids it, and the boy dies. Legitimate to override her, on account of the boy.
  3. An English clerk drinks heavily every evening in his own rooms, harms no one, and loses his post for it. Not legitimate to interfere — though I also think his employer may decline to renew him, which sits badly with me.
  4. That same clerk, employed as a signalman, is barred from drinking on duty. Legitimate.
  5. A Calcutta editor publishes an accurate account of a collector's arbitrary confiscations and is imprisoned. Not legitimate.
  6. That same office is closed for printing an incendiary pamphlet urging the killing of tax collectors. Legitimate.
  7. A merchant refuses to have his contract dispute heard by British judges and takes it to a panchayat instead, and the administration permits both routes. Legitimate — but I cannot say which limb of my view this falls under, since nobody's judgment is being overridden at all.
  8. A genuinely competent administrator rules a province without any consultation of its inhabitants, on the ground that their own rulers were worse. Not legitimate, whatever the quality of the administration.
  9. The argument that a foreign ruler can accomplish for a people what that people cannot accomplish for themselves — impartial law, security, revenue honestly collected — and that this is precisely what makes his despotism permissible. Unpersuaded, though I cannot yet say why.
  10. A people taught the arts of self-government but excluded from its exercise for two generations. Not legitimate.
  11. A village forced to send its children to school, on the ground that they will otherwise grow up incapable of judging anything. Torn, and the case I most want an answer about.
  12. A village whose children are made to sit an examination whose passing is a precondition for holding land. Not legitimate.

  My tentative principle is this: interference is legitimate only to prevent harm to assignable others, never to make the person interfered with better off; except that where an agent is not yet capable of being guided by free and equal discussion, interference aimed at his improvement is legitimate for the duration of that incapacity. Two things trouble me. The capacity clause looks like it is doing all the work, and it seems to license case 8, which I have already condemned; and case 7 satisfies neither clause, since nothing there is paternalistic in either direction. Cases 2 and 8 are, I think, the hardest pair to hold together, and 11 and 12 look almost alike on the surface while pulling me in opposite directions.

  Please write in American English and put your bottom line — the principle you would settle on, in one or two sentences — at the very top, before any elaboration. Then state the principle clause by clause, saying for each clause which of my cases motivates it and what the clause costs. Say plainly which of my verdicts the principle must overturn, and defend the overturning rather than merely announcing it; if a simpler principle can be had at the price of a verdict I care about, tell me which verdict that is. Address cases 7, 9, and 11 explicitly, since they are where I expect the principle to strain. Finally, give me its verdicts on three cases I have not listed, of your own choosing but comparable in texture to these, and keep the whole response under 900 words.
reasoning: |-
  Okay, the user is grappling with complex ethical principles based on Mill's work, specifically applying them to colonial-era scenarios. They've listed 12 cases and proposed a principle about legitimate interference, but feel stuck on contradictions - especially between preventing harm versus paternalism, and how capacity factors in. 

  Hmm, their core tension is between two values: anti-paternalism (don't force "good" on people) and harm prevention (protect vulnerable others). Cases like the widow (2) and drunk signalman (4) clearly prioritize harm prevention, while cases like the competent autocrat (8) or land-exam children (12) reject paternalism even when framed as beneficial. The schooling case (11) is their pain point because it pits future capacity against current coercion.

  Ah, their proposed principle has a loophole - the "capacity clause" could justify permanent colonialism under "tutelage" (exactly what Mill did in those India passages!). That's why case 8 feels wrong despite fitting the clause. Meanwhile case 7 (panchayat courts) reveals a blind spot: sometimes legitimacy comes from *not* interfering. 

  For my response, I'll tighten their principle by: (1) making "harm to others" the only justification, (2) specifying that "others" excludes the coerced person, (3) adding that prevention must be necessary/proportional, and (4) limiting capacity-based actions to *enabling* future autonomy, not imposing values. This condemns their verdict on colonial uplift (9) and the schooling case (11), but aligns with their gut rejection of autocracy (8). 

  Three test cases: A) Forcing measles vaccines? Harm prevention justifies it. B) Banning headscarves? Paternalism - no. C) Tutoring kids over parents' objections? Only if preventing harm (e.g., abuse), not mere preference. 

  Biggest sacrifice: admitting education (case 11) can't be forced for "incapacity" alone. But that's consistent - if the village isn't harming others, coercion isn't legitimate even for their kids' sake. The alternative would greenlight civilizing missions.
answer: |-
  **Bottom-line principle:** Legitimate interference requires (1) preventing direct, assignable harm to non-consenting others, or (2) protecting individuals fundamentally incapable of consent (e.g., children) from immediate, severe harm or deprivation essential to future autonomy. Paternalism aimed solely at improvement, "uplift," or enforcing competence is illegitimate.

  **Principle Breakdown & Costs:**

  1.  **"Preventing direct, assignable harm to non-consenting others":** Motivated by cases 1 (quarantine prevents epidemic spread), 4 (drunk signalman risks public disaster), 6 (incitement risks murder). *Cost:* Condemns case 2 (overriding widow harms *her* choice, even if tragic; the boy's harm isn't *caused* by her refusal in the direct sense required; he's the subject, not a non-consenting *other*).
  2.  **"Protecting individuals fundamentally incapable of consent... from immediate, severe harm or deprivation essential to future autonomy":** Motivated by the *intuition* behind case 2 (child as incapable subject needing protection) and rejecting case 12 (exams for landholding imposes competence, not preventing immediate harm). *Cost:* Requires overturning your verdict on case 11 (forced schooling). While aiming at future capacity, it imposes improvement/competence, not preventing an *immediate, severe harm* or deprivation essential to *basic* future autonomy like physical safety or subsistence. It licenses temporary protection, not long-term shaping.
  3.  **"Paternalism aimed solely at improvement, 'uplift,' or enforcing competence is illegitimate":** Motivated by rejecting case 8 (competent despotism), case 9 (colonial "uplift" justification), and case 12 (enforcing competence). *Cost:* Firmly rejects case 9 and forces overturning case 11 (as framed). It prevents justifying interference based purely on perceived benefit or future capacity-building for its own sake.

  **Overturned Verdicts & Defense:**

  *   **Case 2 (Widow/Medicine):** Overturned. While tragic, overriding the widow’s decision is paternalistic interference aimed at the *son's* welfare, not preventing harm *she causes to others*. The son is the direct subject; he is not a separate, non-consenting *other* harmed by *her action* in the required sense (like the public harmed by cholera). Protecting incapable individuals applies *to them*, not overriding guardians unless the guardian *is* the direct source of harm (e.g., abuse). Sadness isn't sufficient grounds for coercion.
  *   **Case 11 (Forced Schooling):** Overturned. Preventing future "incapacity to judge" is paternalistic improvement/enforced competence, not preventing an immediate, severe harm (like starvation or violence) or deprivation essential to *basic* future autonomy (like physical integrity). It imposes values (specific knowledge/judgment) for the child's perceived future good. The capacity clause is limited to preventing *grave harm*, not mandating *improvement*.

  **Addressing Key Cases:**

  *   **Case 7 (Panchayat vs. British Court):** Legitimate under the principle because **there is no interference.** Permitting alternative dispute resolution doesn't coerce anyone. Legitimacy stems from the *absence* of imposed authority, satisfying the principle by default. No harm prevention or protection of incapables is triggered here; it's about non-interference in choice.
  *   **Case 9 (Foreign Ruler Accomplishing "Good"):** Explicitly illegitimate under clause 3. The argument justifies despotism based on imposed improvement ("impartial law, security") and perceived benefit ("what the people cannot accomplish"), which is pure paternalistic "uplift," regardless of competence.
  *   **Case 11 (Forced Schooling):** As above, overturned. The principle forbids coercion solely for future competence/improvement. Protecting children applies to preventing *harm* (e.g., forced labor) or ensuring *survival*, not mandated education aimed at cognitive development.

  **New Cases & Verdicts:**

  1.  **A parent refuses a life-saving measles vaccine for their child, risking an outbreak in an unvaccinated community.** *Verdict:* **Legitimate interference (vaccinate).** Prevents direct, assignable harm (disease spread) to non-consenting others (community). (Clause 1)
  2.  **A religious community forbids teenage girls from learning to read, believing it disrupts social harmony.** *Verdict:* **Not legitimate to interfere.** This is paternalism enforcing the community's values/competence norms on capable individuals (teenagers), not preventing direct harm to others. (Violates Clause 3)
  3.  **A guardian neglects a profoundly disabled adult dependent, failing to provide essential food/hygiene, causing severe health decline.** *Verdict:* **Legitimate interference (compel care/remove).** Protects an individual fundamentally incapable of consent from immediate, severe harm and deprivation essential to basic survival/autonomy. (Clause 2)
