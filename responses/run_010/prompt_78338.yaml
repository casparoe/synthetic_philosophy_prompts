prompt: |-
  I'm a backend engineer, no philosophy training at all, and I got roped into writing the eval section of our model card after two people on my team had a genuinely heated argument at a design review. Neither of them would let it go and now I have to decide what I'm allowed to claim, so I'd like you to referee it move by move.

  Background: we built a model that predicts whether a pull request will introduce a bug. We trained on PRs from 2019–2023 and scored it on 2024 PRs, where we knew the real outcomes. It scored way better than the baseline. Then someone noticed that three of the ten eval repos were forks of repos in the training data, and that two of us had been looking at the 2024 outcomes while choosing features. Marcus says the 2024 number is now worthless as evidence. Elena says that's ridiculous. Here's roughly how it went:

  1. Marcus: you can't be confirmed by something you already knew. Once you're certain of E, learning that your model implies E tells you nothing new — the probability of the hypothesis doesn't move. So the score is a stat, not evidence.
  2. Elena: that proves too much. The classic case everybody agrees about is a theory of gravity that exactly explained a leftover wobble in a planet's orbit that astronomers had already known about for decades, and nobody says that wasn't a huge confirmation. Old evidence can obviously confirm.
  3. Marcus: doesn't transfer. Those astronomers didn't have the theory sitting there while they were taking the measurements. We did. What matters isn't how old the data is, it's whether the hypothesis got built with the answers in hand. And there's a fix: keep a "shadow model" — a frozen snapshot of the feature set from before anyone looked at any 2024 outcome — and report the likelihood ratio of the shadow model against the null on the 2024 data. That number would mean something.
  4. Elena: you're inventing a prior after the fact. You get to choose which snapshot to freeze, and you'll always find one that flatters you. And the shadow model isn't the model we ship, so even a beautiful ratio says nothing about the thing that goes to production.
  5. Marcus: that's exactly what a held-out set is, and you love held-out sets. It's also exactly what pre-registration is in medicine — you freeze the hypothesis before the outcome comes in. Nobody calls pre-registration "picking a fake prior."
  6. Elena: pre-registration works because the outcomes are genuinely unknown when you freeze. Your shadow model is being tested on outcomes you already know. It's a rerun of a race whose winner you've already seen. Hand me 2025 data that nobody has opened and I'll agree it's evidence.
  7. Marcus: so your rule is "wait a year," which means we can never say anything about the current model at all. And you can't hold that, because in move 2 you cited an old-evidence case and called it confirmation. Elena: that case had a theory built without access to the outcome. Ours didn't.

  What I want from you: go through the seven moves and rate each one — clearly right, mostly right, mixed, mostly wrong, clearly wrong — with a sentence or two on why, not just who wins overall. Then tell me: is Marcus's claim in move 1 actually correct as a matter of the math, and if it is, is it a flaw in the framework or a feature? Is any part of this argument just a fight about the word "evidence" or "confirm," and if so, say which part and what each of them should have said instead? Can the shadow-model idea be rescued — under what conditions would it be legit and under what conditions is it just decoration? And what are both of them missing that would have ended the argument faster? Finally, say who is more right overall, and what I'm actually allowed to write in the eval section.
reasoning: |-
  Okay, let me unpack this messy situation. A backend engineer got dragged into a philosophical stats fight between Marcus and Elena about evaluating their bug-prediction model. The core tension is whether their 2024 test results are valid evidence given potential data leakage and researcher bias.

  First, Marcus's opening move seems technically correct on Bayesian grounds - if you already know the outcome (E), then P(H|E) shouldn't change when your model outputs E. That's just math. But Elena rightly points out this would invalidate many historical scientific confirmations, creating tension between formal probability and scientific practice.

  The gravity analogy is interesting but messy. Marcus makes a crucial distinction: it's not about data age but whether the hypothesis was constructed with answer keys in hand. Elena's "race rerun" metaphor in move 6 is particularly vivid - testing on known outcomes feels performative rather than probative. Yet Marcus's shadow model proposal (move 3) tries to simulate pre-registration, which Elena dismantles by noting they're testing on known outcomes and can cherry-pick snapshots.

  Both miss pragmatic solutions though. The team could:
  - Immediately run the current model on fresh 2025 data (Elena's request)
  - Add robustness checks showing similar performance on non-forked repos 
  - Document the known limitations transparently

  For the eval section, I'd recommend reporting the 2024 numbers but with prominent caveats about the forks and feature selection bias. The real win would be committing to a truly blind 2025 test.
answer: |-
  Here's a move-by-move analysis, followed by key answers and recommendations:

  ### Move-by-Move Refereeing
  1. **Marcus (Claim: Known evidence can't confirm)**  
     *Rating: Mostly right (but oversimplified)*  
     Technically correct per Bayesian logic: If you *already knew* outcome E with certainty, a model predicting E shouldn't update your belief in the model. However, this assumes perfect certainty about E — which rarely exists in practice (e.g., labels might be noisy). Overly rigid framing.

  2. **Elena (Counter: Old evidence confirms in science)**  
     *Rating: Mostly right (but conflates history with methodology)*  
     Correct that historical science accepts "old evidence" confirmation (e.g., Mercury's orbit confirming relativity). But Marcus is right that those theories weren't *designed using that specific data*. Key distinction: **access during development** vs. **retroactive testing**.

  3. **Marcus (Shadow-model solution)**  
     *Rating: Mixed (conceptually valid, practically flawed)*  
     The core idea (freezing a pre-outcome version) aligns with pre-registration principles. However, his execution is flawed: a "snapshot" chosen *after* seeing outcomes invites cherry-picking. Needs a time-stamped, pre-outcome commit.

  4. **Elena (Critique: Shadow model is post-hoc)**  
     *Rating: Clearly right on cherry-picking risk, mostly wrong on irrelevance*  
     Correct that selecting a snapshot retrospectively is invalid. Wrong that testing a shadow model is useless: if properly version-controlled *before* seeing 2024 data, it **does** test the development process’s integrity. The shipped model’s validity depends on this.

  5. **Marcus (Defense: Pre-registration analogy)**  
     *Rating: Mostly right*  
     Pre-registration *is* the gold standard for avoiding hindsight bias. Held-out sets work similarly — **if** untouched during training/feature engineering. Valid analogy, but requires strict adherence.

  6. **Elena (Counter: Known outcomes invalidate shadow tests)**  
     *Rating: Mostly wrong*  
     Knowing outcomes doesn’t magically corrupt frozen code. A *properly* versioned shadow model tested on known data **still** shows if the *pre-outcome* logic generalizes. The bias is in human interpretation, not the math. Her "wait a year" demand is impractical and ignores rigorous pre-registration.

  7. **Marcus/Elena (Recap of core conflict)**  
     *Rating: Marcus > Elena*  
     Marcus correctly identifies the crux: **access during development**. Elena’s gravity example fails because Einstein didn’t tune equations to Mercury’s data; your team *did* tune features using 2024 knowledge.

  ---

  ### Key Questions Answered
  **Q1: Is Marcus's claim (move 1) mathematically correct?**  
  Yes, under strict Bayesianism with *certain* prior knowledge of E. But real-world evaluations rarely have absolute certainty (e.g., bug labels may be disputed). The flaw is in applying an idealized framework to messy data.

  **Q2: Is this a semantic fight over "evidence"?**  
  Partly. Elena uses "evidence" colloquially (any data matching predictions). Marcus uses it technically (data that updates beliefs). They should clarify:  
  - Marcus: "The 2024 score doesn't provide *new confirmatory power* due to contamination."  
  - Elena: "The 2024 score still *demonstrates consistency*, even if not ideal proof."

  **Q3: Can the shadow model be rescued?**  
  **Yes, with conditions:**  
  - **Legit**: If a feature-set snapshot is timestamped *before any team member saw 2024 outcomes*, testing it on 2024 data is valid (simulates pre-registration).  
  - **Decoration**: If chosen retrospectively or after outcome exposure, it’s useless.  

  **Q4: What did both miss?**  
  - **Mitigation tests**: Run the model on *only the non-forked 2024 repos* (new data). If performance holds, it partially validates the model.  
  - **Process audit**: Document exactly when 2024 outcomes were accessed and which features were added/modified afterward.  
  - **Bayesian workaround**: Report likelihood ratios *relative to the baseline* without claiming "confirmation."  

  **Q5: Who is more right overall?**  
  **Marcus (60/40)**, on rigor grounds. The feature selection while knowing 2024 outcomes *is* a validity threat. But Elena is right that the score isn’t "worthless" — it just needs caveats.  

  ---

  ### What You Can Write in the Eval Section
  1. **State results transparently**:  
     *"The model achieved [metric] of X on 2024 PRs, outperforming the baseline (Y)."*  
  2. **Disclose limitations**:  
     *"Three evaluation repositories were forks of training repositories, creating potential data leakage. Additionally, two engineers viewed 2024 outcomes during feature development, risking confirmation bias."*  
  3. **Add robustness checks** (if possible):  
     *"When evaluated only on non-forked 2024 repositories, performance remained strong (Z)."*  
  4. **Commit to future validation**:  
     *"A truly blind test on 2025 data (with no outcome access during development) is planned for Q3."*  

  **Final verdict**: Report the number with caveats, reject "shadow model" without proof of pre-outcome versioning, and prioritize a clean 2025 test. This balances scientific rigor with practicality.
