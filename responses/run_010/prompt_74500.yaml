prompt: |-
  I am drafting the methodological section of a monograph on the coordination of rational credence with objective chance, and before committing to any particular bridge principle I want the specification fixed: what a principle of this kind has to deliver in order to be adopted at all. The purpose is stipulated as follows. The principle is to serve as a normative constraint on the priors of an ideally rational agent reasoning about genuinely stochastic physical theories — decay processes, statistical mechanics, drift in population genetics — and it must be usable by an agent who does not already know which chance theory is true.

  Take the familiar schema as the starting point: for a chance function ch indexed to a time, a rational credence function Cr, a proposition A, real x, and admissible evidence E,

    Cr(A | E ∧ ch(A) = x) = x.

  Everything below concerns what must be true of a candidate principle of this shape, rather than which candidate to pick.

  Write the desiderata list. For each requirement give: (i) the requirement, stated specifically enough that one could check a formulation against it; (ii) the case or consideration that motivates it — ideally a concrete situation in which a principle ignoring the requirement yields a clearly wrong or clearly undefined answer; and (iii) your verdict on whether it is non-negotiable or a preference of a particular camp, with a sentence of argument for the verdict.

  The list must cover at least the following territory, and you should add what I have omitted.

  1. The four situations below. For each, say what an adequate principle is obliged to say, and treat that obligation as a constraint on the list.
   (a) Self-undermining chance. A stochastic theory T assigns chance 0.5 to a certain coin landing heads at t, and also assigns chance 0.2 to the proposition that T itself states the chances at t correctly; so T is, by its own lights, probably but not certainly true. The agent's total evidence includes T. What does the schema deliver here, and what must a principle do about the fact that a chance hypothesis is not certain of its own correctness?
   (b) Frequency clash. The agent is certain that ch(A) = 0.5 for repeated trials of one setup, and then learns that in a hundred such trials, 82 were A — an outcome of vanishingly small probability on that chance hypothesis. On one metaphysics of chance the credence in the next trial stays at 0.5; on another it must move. Does this show that the bridge principle cannot be metaphysically neutral, and must a principle declare which side it takes?
   (c) Chance zero. A continuously distributed quantity takes a value that had chance zero, and the agent observes that it has. The conditional in the schema is then either undefined or zero-over-zero.
   (d) The blameless ignoramus. An agent with no access to chance information holds credences that track observed long-run frequencies closely but violate the schema. Is she irrational? Must the principle bind her; and if not, at what level — priors, ur-priors, or every credence function at every time — should the principle be stated?

  2. Status. Is the principle a priori or a substantive empirical claim? Can it be both non-trivial, in the sense that chance is not simply defined as whatever quantity credence ought to defer to, and knowable independently of experience? If these cannot be had together, say which to give up and what is lost by giving it up.

  3. The restriction on evidence. Admissibility, or whatever replaces it, has to be characterized. What counts as an acceptable characterization, and what would make a characterization a mere device for saving the schema from counterexample?

  4. Existence, consistency, and stability. There must be credence functions satisfying the principle, and satisfying it jointly with the probability axioms and with conditionalization; and compliance must survive the accumulation of evidence, or the loss of compliance must be explicable.

  5. Distinctions that must not be collapsed: chance at a time versus chance relative to a history; the chance function versus the agent's evidence about the chance function; a principle's being false versus its being inapplicable; objective chance versus propensity versus limiting frequency versus epistemic probability.

  6. Accessibility. A principle applicable only by an agent who already knows the chances does no work; a principle on which known chance overrides all further evidence makes ordinary statistical learning inexplicable. Address both.

  Then answer these directly. Which single requirement does the most exclusionary work — which one rules out the largest number of otherwise attractive formulations, and why? Is any subset of the requirements jointly unsatisfiable? If so, exhibit the subset, give the argument for the incompatibility, and say which member should be dropped or weakened; if the list itself amounts to a no-go result, that is precisely what I want to see.

  Finally, in a few sentences per candidate and no more than a page in total, score the main contenders against the list: the original schema with an admissibility restriction; the reformulation that treats the principle as a constraint on ur-priors, or on the credence function's response to a whole chance hypothesis, rather than on arbitrary conditional credences; a derivation of the principle from accuracy-dominance considerations; and the view that chance just is whatever quantity occupies the deference role.

  Do not cite literature or supply a reading list; where a technical notion is needed, state it in the text.
reasoning: |-
  We are constructing a list of desiderata for a bridge principle that constrains rational credence by objective chance. The principle must serve as a normative constraint on the priors of an ideally rational agent reasoning about stochastic theories, without the agent knowing which chance theory is true. The schema is:

    Cr(A | E ∧ ch(A) = x) = x.

  We will address the six territories and the four specific situations. Then we will evaluate the main contenders.

  I. Desiderata List

  1. Situations as Constraints

  (a) Self-undermining chance
     - Requirement: The principle must handle self-undermining chance theories (i.e., theories that assign a chance less than 1 to their own truth) without leading to inconsistency or an unacceptable credence assignment. Specifically, when the agent's total evidence includes such a theory T, the principle must yield a coherent credence for the event A (e.g., the coin landing heads) and for the truth of T itself.
     - Motivation: Consider T which says ch(Heads)=0.5 and ch(T is true)=0.2. If we naively apply the schema with E = T, then we get:
          Cr(Heads | T ∧ ch(Heads)=0.5) = 0.5.
       But also, by the same schema, we have:
          Cr(T is true | T) = 1? But T says ch(T)=0.2, so we must have Cr(T is true | T) = 0.2? This leads to contradiction because conditional on T, the agent should be certain of T. The problem is that E (which is T) is not admissible with respect to T? But if we disallow E=T, then the principle cannot be applied when the agent learns T.
       Alternatively, one might try to condition on ch(Heads)=0.5 without conditioning on T. But if T is the evidence, then we have to use T. The principle must avoid such contradictions.
     - Verdict: Non-negotiable. A principle that leads to contradiction in such a case is inconsistent.

  (b) Frequency clash
     - Requirement: The principle must specify how an agent should respond when the observed frequency of an event diverges drastically from the known chance. In particular, it must be clear whether the principle mandates that the credence in the next trial remains at the known chance (as in Humean views) or allows (or requires) deviation (as in non-Humean views). The principle must not be metaphysically neutral in the sense that it must be compatible with the correct metaphysics of chance, but it should not presuppose a particular metaphysics arbitrarily. Alternatively, the principle might be flexible enough to work under different metaphysics, but then it must specify how the agent's credence is constrained in the face of such evidence.
     - Motivation: The agent knows ch(A)=0.5 for each of 100 independent trials. Then the agent observes 82 A's. If the principle says that the credence for the next trial must still be 0.5 (because the chance is 0.5 and the frequency does not change the chance), then it must be because the chance is defined by the entire history (as in Humean views). But if the chance is a primitive propensity, then maybe the frequency evidence should lead the agent to revise her belief about the chance? However, the agent is certain of the chance. The principle must clarify: does the chance hypothesis ch(A)=0.5 remain certain even after the frequency evidence? If so, then the credence for the next trial must remain 0.5. If not, then the principle must allow for updating the chance hypothesis. The problem is that the schema conditions on the chance hypothesis and the evidence. If the evidence includes the frequency, then we have:
          Cr(A_101 | E ∧ ch(A_101)=0.5) = 0.5
       where E includes the frequency. But if the agent is certain of ch(A_101)=0.5, then the frequency does not matter. However, if the agent becomes uncertain about the chance, then the schema doesn't directly apply. The principle must account for how the agent should update her credence about the chance hypothesis.
     - Verdict: Non-negotiable that the principle must be compatible with a coherent account of learning chances. It must not be that the principle forces the agent to ignore evidence that might undermine the chance hypothesis. But note: the agent is certain of the chance in the setup. So if we require that the agent remains certain, then the credence for the next trial remains 0.5. But that seems counterintuitive. The principle must allow for the possibility that the agent can lose confidence in the chance hypothesis when faced with disconfirming evidence. However, the schema as written conditions on the chance hypothesis being true. So we must ensure that the principle does not force the agent to condition on a chance hypothesis that is undermined by the evidence. This suggests that the principle should not be applied when the evidence undermines the chance hypothesis. Alternatively, the principle might be reformulated to avoid conditioning on the chance hypothesis when the evidence includes information that defeats it.

  (c) Chance zero
     - Requirement: The principle must handle events that have chance zero without leading to undefined or degenerate credences. Specifically, when the agent conditions on a chance hypothesis that assigns chance zero to a proposition A, and the agent also learns A (or a proposition that entails A), the principle must not break down.
     - Motivation: Suppose the chance of a dart landing on a specific point on a continuous dartboard is zero. The agent learns that the chance of landing on that point is zero and then learns that the dart did land on that point. The conditional credence Cr(A | E ∧ ch(A)=0) would be undefined if we interpret the conditioning event as having positive probability, but if ch(A)=0 is in the conditioning event and A is also true, then we have a contradiction? The agent has evidence that includes both ch(A)=0 and A. But ch(A)=0 implies that A is impossible? Or in a non-classical setting, it might be possible. The principle must avoid contradiction and yield a well-defined credence. This might require a formulation that uses conditional probabilities given events of probability zero (e.g., via regular conditional probabilities) or a revision of the schema.
     - Verdict: Non-negotiable. A principle that fails for events of chance zero is too limited for continuous stochastic theories.

  (d) The blameless ignoramus
     - Requirement: The principle must not condemn as irrational an agent who has no access to chance information but forms reasonable credences based on observed frequencies. The principle should be stated as a constraint on the agent's initial credence function (ur-prior) and not necessarily on every credence function at every time. The agent is blameless if she updates rationally from her initial credence function, even if that initial credence function did not incorporate chance information because she had none.
     - Motivation: Consider an agent in a deterministic universe (or one that she believes to be deterministic) who has never encountered any chance theory. She uses observed frequencies to set her credences. For example, she has observed 50 heads in 100 coin flips and sets her credence for the next flip at 0.5. This is reasonable. But if the true chance of heads is 0.6, then her credence violates the bridge principle because she does not condition on the chance. However, she does not know the chance. The principle should not require her to have credences that defer to chances she does not know. Instead, the principle should constrain her initial priors such that if she were to learn the chance, she would defer. But at times when she does not know the chance, she may use other methods. The principle should be a constraint on the ur-prior (the initial credence function before any evidence) so that conditional on the chance, it matches the chance. Then, when the agent does not know the chance, her credences are obtained by conditioning her ur-prior on the evidence she has, which may not include the chance.
     - Verdict: Non-negotiable that the principle should not require every agent at every time to have credences that match the chances. Instead, it should be a constraint on the ur-prior.

  2. Status
     - Requirement: The principle must be a non-trivial a priori constraint on rational credence. It should not define chance as the quantity to which credence defers (to avoid circularity and triviality) and must be knowable independently of experience. However, it might be that the principle is a priori but the application to a particular chance theory is empirical.
     - Motivation: If the principle is empirical, then it is a hypothesis that must be confirmed by experience. But then the agent must have some prior way to set credences without the principle. If the principle is a priori, then it is a constraint of rationality. But if it defines chance, then it is trivial and does not connect to an objective feature of the world. The principle must be non-trivial in that it connects two distinct concepts: chance and credence. And it must be a priori because it is a fundamental norm of rationality.
     - Verdict: Non-negotiable that the principle is a priori and non-trivial. However, it might be that we have to give up the non-triviality to some extent: if we define chance by the role it plays in the principle, then we risk triviality. But we can avoid that by having an independent account of chance. The principle is then a substantive a priori truth about how rational credence should align with objective chance.

  3. Restriction on evidence
     - Requirement: The characterization of admissible evidence must be non-circular and not ad hoc. It must be defined in terms that do not presuppose the chance function or the agent's credence function. An unacceptable characterization is one that is tailored to avoid counterexamples by listing exceptions without a principled basis.
     - Motivation: In Lewis's original Principal Principle, evidence is admissible if it is not about the future (or if it is historical or about the chances). But in the self-undermining case, the chance theory T is about the chances and the future. If we say T is inadmissible, then we cannot condition on it. But that seems wrong. We need a characterization that allows for learning chance theories without leading to contradiction. A characterization that is too permissive (e.g., allowing any evidence) leads to contradiction in the self-undermining case. A characterization that is too restrictive prevents the agent from using the principle when she learns a chance theory. The characterization must be based on the information content of the evidence relative to the chance hypothesis and the event A. For example, evidence is admissible relative to A and ch if it does not contain information that is "inadmissible" in the sense of defeating the chance hypothesis for A. But that might be circular.
     - Verdict: Non-negotiable that the characterization must be non-circular and principled. However, achieving this is challenging.

  4. Existence, consistency, and stability
     - Requirement: There must exist credence functions that satisfy the principle (along with the probability axioms and conditionalization). Moreover, the principle must be consistent with conditionalization: when the agent updates by conditionalization on new evidence, the updated credence function should still satisfy the principle (or if not, the conditions under which it fails must be explained). The principle must not lead to a contradiction when combined with the probability axioms and conditionalization.
     - Motivation: Without existence, the principle would be vacuous. Without consistency, it would be contradictory. Without stability, the principle would have to be abandoned after learning some evidence, which would make it useless for guiding rational credence over time. For example, in the self-undermining case, we require that the agent can have a coherent credence function that satisfies the principle and the evidence.
     - Verdict: Non-negotiable.

  5. Distinctions not to be collapsed
     - Requirement: The principle must respect the following distinctions:
          - Chance at a time t versus chance relative to a history up to t (so that the chance function evolves over time as history accumulates).
          - The chance function itself versus the agent's evidence about the chance function (so that the agent might be uncertain about the chance).
          - A principle being false (i.e., it is not a constraint) versus being inapplicable (e.g., when the evidence is inadmissible).
          - Objective chance (a fundamental physical feature) versus propensity (a dispositional property) versus limiting frequency (a frequentist reduction) versus epistemic probability (a measure of belief). The principle must not presuppose a reduction of chance to frequency or propensity; it should be compatible with different metaphysical views.
     - Motivation: If we conflate chance at t with chance at an earlier time, we might misapply the principle. If we conflate the chance with evidence about the chance, then we might require the credence to match the evidence about the chance rather than the actual chance. If we do not mark when the principle is inapplicable, we might force credences in situations where the principle should not apply. If we collapse chance with limiting frequency, then we are adopting a particular metaphysical view, but the principle should be neutral.
     - Verdict: Non-negotiable.

  6. Accessibility
     - Requirement: The principle must be applicable by an agent who does not know the chances. It must not require the agent to know the chances in order to use the principle. Moreover, the principle must not make the chance hypothesis override all further evidence; it must allow for the possibility that the agent can learn evidence that undermines the chance hypothesis.
     - Motivation: If the principle is only applicable when the agent knows the chances, then it cannot guide the agent in forming credences when she is uncertain about the chances. Also, if the principle requires that credence must match the chance whenever the agent is certain of the chance, then it leaves no room for statistical learning: the agent would never change her credence about the chance hypothesis once she is certain. But we do learn from evidence to update our beliefs about chances.
     - Verdict: Non-negotiable.

  II. Which single requirement does the most exclusionary work?
  The requirement that the principle must handle self-undermining chance theories (1a) without contradiction is the most exclusionary. It rules out the original Principal Principle without a suitable admissibility restriction because the original formulation with Lewis's admissibility (which allows only historical information and information about the chances) would treat the chance theory T itself as admissible. But then conditioning on T and ch(A)=x (for A within T) leads to the requirement that Cr(A | T) = x. However, T also says something about its own chance, and if T says ch(T)=0.2, then we would also require Cr(T | T) = 0.2, but that must be 1. Contradiction. This forces a reformulation of the principle, such as moving to the New Principle (which conditions on the entire chance theory, not just the chance of A) or to a different formulation.

  III. Are any subset of the requirements jointly unsatisfiable?
  Consider:
  - The requirement that the principle must be a priori and non-trivial (Status, 2).
  - The requirement that the principle must handle chance zero events (1c).
  - The requirement that the principle must be applicable without knowing the chances (Accessibility, 6).

  The issue: To handle chance zero events, we need a sophisticated mathematical framework (e.g., regular conditional probabilities) which might be seen as introducing empirical or contingent elements. But the principle is supposed to be a priori. Moreover, if the agent does not know the chances, then conditioning on ch(A)=0 and A might be a rare event, but the principle must still work.

  However, I do not see a direct contradiction. The more serious tension is between:
  - The self-undermining case (1a) requiring that the agent can condition on a chance theory without inconsistency.
  - The requirement that the principle must be consistent (Existence, 4).

  But the New Principle (by Hall, Lewis, and others) is designed to handle self-undermining chances. So it is satisfiable.

  Another tension: 
  - The blameless ignoramus (1d) requires the principle to be a constraint on the ur-prior, not on every credence function.
  - Accessibility (6) requires that the principle is applicable without knowing the chances.

  But this is not a tension; they are compatible.

  I do not see an unsatisfiable subset. The list is demanding but not impossible.

  IV. Scoring the Main Contenders

  1. Original schema with admissibility restriction (Lewis's Principal Principle)
     - 1a: Fails. Self-undermining chances lead to contradiction because T is admissible and conditioning on T and ch(A)=x leads to inconsistency when T is self-undermining.
     - 1b: Handles if we interpret admissibility to exclude the frequency evidence? But if the agent is certain of the chance, then even after the frequency evidence, the credence for the next trial must be 0.5. But that may be counterintuitive. However, the principle does not force the agent to remain certain of the chance; the agent might update on the frequency evidence and become uncertain about the chance. But then the schema does not apply. So it is unclear.
     - 1c: Fails. Conditioning on events of chance zero is not defined.
     - 1d: The principle is stated as a constraint on the credence function at any time. But then the blameless ignoramus would be violating the principle because she doesn't condition on the chance. So it would condemn her. But we want to avoid that.
     - 2: The admissibility restriction is supposed to be a priori, but it is not trivial. However, the restriction is not well-defined and is ad hoc.
     - 3: The admissibility characterization is problematic: it is vague and has been criticized as circular or unprincipled.
     - 4: Without self-undermining and chance zero, it exists and is stable for some cases.
     - 5: Respects some distinctions but not chance zero.
     - 6: Accessible only when the agent has admissible evidence and the chance hypothesis; but the agent might not know the chances.

