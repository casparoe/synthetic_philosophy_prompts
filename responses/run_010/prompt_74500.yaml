     - The New Principle: Cr(A | E ∧ H) = ch_H(A | E), where H is a chance hypothesis (a proposition that specifies the entire chance function) and ch_H is the chance function specified by H. And E is admissible only if it is compatible with H and does not contain information that H says is inadmissible? Actually, the New Principle does not require admissibility. It conditions on the entire chance hypothesis H and sets the credence to the chance conditional on E? But note: we condition on H and E, and then set Cr(A | H∧E) = ch_H(A | E), provided that ch_H(E)>0.

     - 1a: Handles self-undermining: if H is self-undermining, then ch_H(H) might be low, but we set Cr(H | H) = 1, which is consistent because ch_H(H) is not directly used. We use ch_H(A | E) for A, not for H. For H itself, we have Cr(H | H)=1, which is correct.
     - 1b: If the agent learns H (which says ch_H(A)=0.5) and then learns the frequency, then if E includes the frequency, we have Cr(A | H∧E) = ch_H(A | E). But ch_H(A | E) might be defined and might be different from 0.5? For example, if H says the trials are independent, then ch_H(A_101 | frequency)=0.5 regardless of the frequency. So the credence remains 0.5. But if the agent becomes uncertain about H, then the principle doesn't force credence for A to be 0.5. So it is consistent with statistical learning (by updating on H). However, if the agent remains certain of H, then she must set credence to 0.5. This is acceptable for non-Humeans? But for Humeans, the chance might change? But H specifies the entire chance function, so if H is a Humean theory, then the chance might depend on the entire history, including the frequency. So ch_H(A_101 | frequency) might be 0.5 even if the frequency is 82, because the chance is defined by the entire pattern. So it works for both if the chance hypothesis is correctly specified.
     - 1c: Chance zero: we use conditional chance, which might be defined via a regular conditional probability. So if ch_H(A)=0 but the agent learns A, then ch_H(A | A) is undefined? But actually, we condition on E which might include A. Then ch_H(A | A) = 1? But if ch_H(A)=0, then typically ch_H(· | A) is not defined. This is a problem. Some versions of the New Principle require that the conditional chance is defined. So it may not handle all chance zero cases.
     - 1d: This is stated as a constraint on the ur-prior. So the agent's initial credence must satisfy Cr_0(A | H) = ch_H(A) for all A and H. Then the blameless ignoramus is not condemned because at her time, she has not conditioned on H. Her credences are based on other evidence. So it passes.
     - 2: It is a priori and non-trivial if we have an independent account of chance.
     - 3: It does not use an admissibility restriction; instead, it conditions on the entire chance hypothesis and uses the chance conditional on the evidence. So no need for admissibility.
     - 4: It is consistent and stable under conditionalization? When the agent learns new evidence, she updates by conditioning. The updated credence still satisfies the principle because the principle constrains the prior and conditionalization preserves the condition. However, if the evidence E has ch_H(E)=0, then the conditional chance ch_H(A|E) might not be defined. So it fails for some cases.
     - 5: Respects the distinctions. In particular, the whole chance hypothesis H specifies the chance function at a time (relative to a history).
     - 6: Accessible: the agent does not need to know the chances; she can have uncertainty over H. The principle constrains the prior and then updating is by conditionalization.

  3. Accuracy-dominance derivation (e.g., from epistemic utility theory)
     - The idea: rational credences must avoid accuracy-dominance. If an agent's credence is not calibrated to the chances in a certain way, then it is accuracy-dominated by one that is. So the principle is derived from the requirement of non-dominance.

     - 1a: It might handle self-undermining if the derivation is done carefully. But the results are not straightforward. Some accuracy arguments lead to the New Principle.
     - 1b: It might deliver the same as the New Principle.
     - 1c: The accuracy framework often uses finite partitions and might not handle continuous cases well. Chance zero events are problematic.
     - 1d: The constraint is on the credence function at a time? Or on the prior? The derivation might be for the prior. So blameless ignoramus is okay.
     - 2: It is a priori (from rationality as non-dominance) and non-trivial if chance is given independently.
     - 3: No admissibility needed? The derivation might give the principle without admissibility.
     - 4: Existence and consistency: it is derived from coherence requirements, so it should be consistent.
     - 5: Might collapse some distinctions if not careful. For example, it might define chance by the role in avoiding dominance? Then it might be circular. But if chance is given, then it is okay.
     - 6: Accessible: the agent does not need to know the chances; the constraint is on the credence function in light of the chances (even if unknown). But the agent must have a credence over chance hypotheses.

  4. Chance as whatever quantity occupies the deference role (the functionalist view)
     - This view defines chance as the quantity that rational credence defers to. So the principle becomes: Cr(A | E ∧ ch(A)=x) = x, and chance is defined as the function that makes this principle hold.

     - 1a: It might run into problems because the self-undermining chance might not exist. That is, there might not be a function ch such that for every A, conditioning on ch(A)=x yields x, especially when the theory is self-undermining. But if we define chance by the principle, then we must ensure existence and consistency. This is not guaranteed.
     - 1b: It might be that the functional role requires that the credence for the next trial remains 0.5 even after the frequency, but that seems counterintuitive. So the functional role might not be satisfied by any quantity.
     - 1c: It does not solve the chance zero problem.
     - 1d: The principle is still a constraint on every credence function? Then the blameless ignoramus would be irrational. But if we define chance by the principle, then in her world, there might be no chance? Or the chance might be the frequency? Then she matches it. But if the chance is defined by the principle, then in a world without an objective chance function that satisfies the principle for every rational agent, then there is no chance? That seems too restrictive.
     - 2: This view gives up non-triviality: chance is defined by the principle, so the principle is trivial (analytic). We lose the objective world-connecting aspect of chance.
     - 3: Admissibility must be built in, but it is circular because chance is defined by the principle.
     - 4: Existence: there might not be a chance function that satisfies the principle for every A and every E. In some worlds, no such function exists.
     - 5: Collapses the distinction between chance and the deference role: they are the same.
     - 6: Accessible? Only if the agent can know the chance, which is defined by the principle. But the agent might not know it.

  Verdict: The New Principle (reformulation as constraint on ur-priors and whole chance hypotheses) scores best. The accuracy-dominance derivation might lead to a similar principle. The functionalist view is problematic because it makes the principle trivial and may not have a chance function in every world.

  Final Note: The self-undermining case is the key challenge that forces the move from the original schema to the New Principle. The chance zero problem remains an open issue for all approaches, but using conditional chances with regular conditional probabilities might be a way forward.
answer: |-
  ### Desiderata for a Bridge Principle on Chance-Credence Coordination

  **Core Purpose**: The principle must normatively constrain the *ur-priors* of an ideally rational agent who is uncertain about the true stochastic theory (e.g., quantum decay, statistical mechanics) and must function without prior knowledge of the true chance theory. The schema is:  
  $$\text{Cr}(A \mid E \land \text{ch}(A) = x) = x.$$  
  Below, requirements are specified, motivated by cases, and classified as non-negotiable (NN) or negotiable (N). NN indicates failure implies inconsistency, vacuity, or irrationality; N reflects philosophical divergence.

  ---

  #### 1. Situations as Constraints
  **(a) Self-undermining chance**  
  - **Requirement**: The principle must yield coherent credences when the chance theory $T$ assigns a credence to its own truth (e.g., $T$ states $\text{ch}(\text{heads}) = 0.5$ and $\text{ch}(T) = 0.2$), even when $E$ includes $T$. Specifically, conditioning on $T$ must not force $\text{Cr}(T \mid T) \neq 1$.  
  - **Motivation**: If $T$ is evidence ($E = T$), naïvely applying the schema implies $\text{Cr}(T \mid T) = \text{ch}(T) = 0.2$, contradicting $\text{Cr}(T \mid T) = 1$. A principle that allows this contradiction is inconsistent.  
  - **Verdict**: **NN**. Coherence under self-reference is necessary for any normative constraint.  

  **(b) Frequency clash**  
  - **Requirement**: The principle must specify whether learning a frequency (e.g., 82 heads in 100 trials when $\text{ch}(\text{heads}) = 0.5$) affects credence for the next trial. It need not be metaphysically neutral but must align with learning without presupposing a specific metaphysics (e.g., Humean vs. propensity).  
  - **Motivation**: If credence must stay at 0.5 (per Humean views), the principle should explain why frequency evidence does not undermine $\text{ch}(\text{heads}) = 0.5$. If credence shifts (per non-Humean views), the principle must allow evidence to challenge chance hypotheses. A neutral principle risks being inapplicable.  
  - **Verdict**: **NN**. The principle must integrate statistical learning; neutrality invites vacuity.  

  **(c) Chance zero**  
  - **Requirement**: The principle must handle observation of events with initial chance zero (e.g., a continuous random variable taking a precise value) without undefined ($0/0$) or degenerate credences.  
  - **Motivation**: If $\text{ch}(A) = 0$ and $A$ occurs, conditioning on $[\text{ch}(A) = 0 \land A]$ makes $\text{Cr}(A \mid \cdot)$ undefined or contradictory. A principle that breaks here cannot cover continuous theories.  
  - **Verdict**: **NN**. Continuum-based theories require resolution of chance-zero observations.  

  **(d) Blameless ignoramus**  
  - **Requirement**: The principle must not condemn agents who lack chance information but track frequencies as irrational. It must constrain *ur-priors* (initial credences before evidence), not all credences at all times.  
  - **Motivation**: An agent with no access to chances sets $\text{Cr}(\text{heads}) = 0.5$ after 50 heads in 100 flips. If the true $\text{ch}(\text{heads}) = 0.6$, she violates the schema but is blameless. Binding every credence state would overreach.  
  - **Verdict**: **NN**. Normativity requires the principle to apply at the ur-prior level; later credences derive via conditionalization.  

  ---

  #### 2. Status  
  - **Requirement**: The principle must be *a priori* (knowable without experience) and *non-trivial* (objective chance is not defined as the deference target). It should be a substantive truth connecting distinct concepts.  
  - **Motivation**: If empirical, agents need prior credences without the principle, inviting circularity. If trivial (e.g., chance *is* the deference target), it loses objectivity. A non-trivial a priori principle grounds rational learning.  
  - **Verdict**: **NN** for a priori status; **N** for non-triviality (some accept triviality to secure applicability).  

  ---

  #### 3. Restriction on Evidence  
  - **Requirement**: Admissibility (or equivalent) must be characterized *independently* of chance or credence (e.g., via temporal or informational criteria). A characterization is unacceptable if it is ad hoc (e.g., "evidence not causing counterexamples").  
  - **Motivation**: Lewis’s historical admissibility fails in self-undermining cases by deeming $T$ admissible, causing contradiction. A circular definition (e.g., "inadmissible if it affects chance") renders the principle vacuous.  
  - **Verdict**: **NN**. Non-circularity ensures the principle is action-guiding; ad hoc fixes undermine normativity.  

  ---

  #### 4. Existence, Consistency, and Stability  
  - **Requirement**: There must exist credence functions satisfying the principle, probability axioms, and conditionalization. Compliance must *persist* under evidence accumulation unless evidence undermines chance hypotheses.  
  - **Motivation**: Without existence, the principle is vacuous. Instability (e.g., learning $A$ when $\text{ch}(A) = 0$ breaks compliance) makes the principle self-defeating. Self-undermining cases test consistency.  
  - **Verdict**: **NN**. A normative principle must be feasible and dynamically robust.  

  ---

  #### 5. Distinctions Not Collapsed  
  - **Requirement**: The principle must distinguish:  
    - Chance at $t$ vs. chance relative to history.  
    - Chance vs. evidence about chance.  
    - False vs. inapplicable principle.  
    - Objective chance vs. propensity/frequency/epistemic probability.  
  - **Motivation**: Conflating chance at $t$ with earlier chances misapplies the principle. Equating chance with evidence (e.g., "$\text{ch}(A) = x$" vs. "evidence suggests $\text{ch}(A) = x$") risks requiring deference to beliefs, not chances. Collapsing objective chance with frequency imposes metaphysics.  
  - **Verdict**: **NN**. Distinctions ensure correct scope and metaphysical neutrality.  

  ---

  #### 6. Accessibility  
  - **Requirement**: The principle must be usable without knowing chances and must not make chance hypotheses immune to undermining by evidence.  
  - **Motivation**: If applicable only with known chances, it cannot guide uncertain agents. If chance overrides all evidence (e.g., $\text{Cr}(A \mid E \land \text{ch}(A)\!=\!x) = x$ even with $E$ falsifying $\text{ch}(A)\!=\!x$), statistical learning is impossible.  
  - **Verdict**: **NN**. Accessibility is core to the purpose; dogmatism precludes learning.  

  ---

  #### Exclusionary Analysis  
  - **Most exclusionary requirement**: **Self-undermining chance (1a)**. It rules out the original Principal Principle and any formulation treating chance hypotheses as certainties, as these yield contradictions when $E$ includes $T$. Solutions require reformulating the deference condition (e.g., deferring to *conditional* chances).  
  - **Joint unsatisfiability**: **Subset {1a, 1c, 3}** (self-undermining, chance zero, admissibility characterization).  
    - **Conflict**: Resolving chance-zero events (1c) requires conditioning on $\text{ch}(A)\!=\!0 \land A$, but self-undermining cases (1a) show that unrestricted conditioning leads to contradiction. Admissibility (3) must exclude $A$ here but doing so arbitrarily violates non-circularity.  
    - **Resolution**: Drop strict admissibility (3) in favor of a reformulation (e.g., deferring to chances conditional on evidence). This weakens 3 but satisfies 1a and 1c.  

  ---

  #### Contender Scoring  
  - **Original schema with admissibility** (e.g., Lewis):  
    - Fails 1a (self-undermining), 1c (chance zero), and 3 (admissibility circular). Partial on 1b (no learning from frequencies). Barely satisfies 4. **Inadequate**.  
  - **Ur-prior constraint + whole chance hypotheses** (e.g., New Principle: $\text{Cr}(A \mid H_T \land E) = \text{ch}_{T}(A \mid E)$, with $H_T$ = "$\text{ch}$ is $T$'s chance function"):  
    - Satisfies 1a (defers to $\text{ch}_{T}(A \mid E)$, avoiding self-undermining), 1d (ur-prior constraint), 2 (a priori), 4 (stable under conditionalization), 5 (distinguishes chance functions), 6 (usable under uncertainty). Partial on 1b (if $T$ specifies independence, $\text{ch}_{T}(A_{\text{next}} \mid \text{freq}) = \text{ch}_{T}(A_{\text{next}})$). Fails 1c if $\text{ch}_{T}(A \mid E)$ undefined. **Best contender; chance-zero resolution needed**.  
  - **Accuracy-dominance derivation** (e.g., minimize inaccuracy given chance):  
    - Satisfies 1d (constrains ur-priors), 2 (a priori), 4 (existence), 5 (avoids metaphysics). Fails 1a (self-undermining not resolved without ad hoc fixes), 1c (chance zero unsupported). Weak on 1b (depends on chance-credence separation). **Promising but incomplete**.  
  - **Chance as deference target** (functionalist view):  
    - Satisfies 6 (accessible by construction). Fails 1a (self-undermining may prevent existence), 1c (chance zero unresolved), 2 (trivializes chance), 3 (admissibility circular), 5 (collapses chance/deference). **Inadequate for objectivity**.  

  **Conclusion**: The New Principle (ur-prior + whole hypotheses) best satisfies the desiderata but requires extending to chance-zero cases (e.g., via regular conditional probabilities). Self-undermining is the key driver; trivializing chance is the costliest sacrifice.
