answer: |-
  1. Since I *know* my keys are in my pocket, I also *know* any evidence they're in the refrigerator is misleading—so goodbye critical thinking, I guess. (Leans on closure & treating "misleading" as known).  
  2. The more compelling the future evidence against my belief seems, the more confidently I dismiss it—turns out true knowledge makes me the worst student in every lab ever.  
  3. Knowledge tells me future counter-evidence *must* be misleading, so I'm logically committed to treating peer review as performance art. (Assumes infallibility of the initial knowing state).  
  4. According to this paradox, learning requires ignorance: if you *could* be wrong, you stay open to evidence; if you *know*, you slam the door forever.  
  5. "Misleading evidence" does all the work—it lets me call a smoking gun a magic trick without looking, which is convenient until my refrigerator starts beeping.
