answer: |-
  ### Analytical Classification
  - **Burden Allocation**: Item 1 (initial presumption), Item 7 (strictness of presumption).  
  - **Epistemic Principles**: Item 2 (tacit knowledge justification), Item 4 (empirical evidence standard), Item 5 (irreversibility > antiquity).  
  - **Empirical Claims**: Item 3 (longevity often reflects power, not function).  
  - **Case Conclusions**: Item 6 (specific policy judgments).  

  ### Audit: Tensions, Revisions, and Costs  
  **Severe Tensions**  
  1. **Item 2 vs. Item 3**  
     - **Conflict**: Item 2 asserts longevity as *evidence* of problem-solving tacit knowledge. Item 3 flatly denies this, attributing durability to power dynamics.  
     - **Resolution Needed**: Abandon or reinterpret Item 2. The cheapest fix: Recast Item 2 as a *hypothesis* ("longevity *may* indicate tacit knowledge"), not evidence.  
     - **Cost**: Weakens the epistemic foundation for Item 1. Without Item 2’s strong claim, Item 1 risks becoming a procedural formality.  

  2. **Item 2 vs. Item 4**  
     - **Conflict**: Item 2 valorizes *non-propositional* knowledge resistant to explicit articulation. Item 4 demands *empirical evidence* that requires translating practice into testable propositions.  
     - **Resolution Needed**: Clarify that Item 4’s evidence *replaces* Item 2’s tacit knowledge as the justification for overcoming Item 1’s presumption.  
     - **Cost**: Item 2 becomes ornamental; the epistemic core shifts entirely to empiricism.  

  **Moderate Tension**  
  3. **Item 1 vs. Item 5**  
     - **Conflict**: Item 1 imposes a blanket burden based on longevity. Item 5 makes irreversibility the true driver of caution, irrespective of age.  
     - **Resolution Needed**: Amend Item 1 to incorporate irreversibility explicitly (e.g., "burden is highest for irreversible changes to long-standing practices").  
     - **Cost**: Dilutes Chesterton’s fence by introducing a non-traditionalist criterion. Item 3’s power critique may then apply more broadly.  

  **Cosmetic Tension**  
  4. **Item 3 vs. Item 6**  
     - **Apparent Conflict**: Item 3 implies skepticism toward durable practices, yet Item 6 supports abolishing three such practices.  
     - **Resolution**: Item 3 is a general caution; Item 6 reflects empirical judgments *after* burden is met. No revision needed—Item 6 is consistent if evidence overcomes presumption.  

  **Ambiguities & Unearned Work**  
  - **Item 2 Ambiguity**: *Reading 1* (Strong): Longevity *proves* functional tacit knowledge. *Reading 2* (Weak): Longevity *suggests possible* tacit knowledge worth investigating. **Adopt Reading 2** to align with Item 4 and avoid contradiction with Item 3.  
  - **Item 6’s Unearned Work**: It masquerades as a principle but is a conclusion. Isolate it from the framework—it’s an output of the principles, not part of their justification.  
  - **Item 7**: Ambiguous on what "genuine presumption" entails. Does it block even *empirical investigation* until a causal account is given? Clarify: The presumption governs *action*, not inquiry.  

  ### The Optimal Revision  
  **Revise Item 2 to read**:  
  *"Longevity *may* indicate embedded practical knowledge (per Oakeshott/Hayek), but this is a defeasible hypothesis—not evidence of function—and must be tested empirically (see 4)."*  

  **What This Cleans Up**:  
  - Eliminates severe tension with Item 3 (power trumps function).  
  - Resolves conflict with Item 4 (empiricism tests tacit knowledge claims).  
  - Preserves Item 1’s burden while demoting tradition from epistemic anchor to heuristic.  

  **The Repaired Package**  
  - **Still Conservative?** Barely. Item 1’s burden allocation retains a conservative *procedure*, but:  
    - The epistemic engine is now empiricism (Item 4), not tradition (Item 2 weakened).  
    - Irreversibility (Item 5) is a technocratic, not traditionalist, criterion.  
  - **What Stands**: A framework of *institutional caution* grounded in:  
    1. Default skepticism toward irreversible change (Items 1 + 5),  
    2. Power-aware scrutiny of persistence (Item 3),  
    3. Empirically verified function (Item 4).  
  - **Verdict for Colleagues**:  
    - To the traditionalist: You’ve stripped conservatism to its procedural skeleton. Item 1 remains, but it’s a fence with no metaphysical pasture.  
    - To the rationalist: Your empiricism won (Item 4), but you retain a Hayekian distrust of design (Item 7) and a focus on unintended consequences (Item 1 + 3).  
  - **Lowest-Common-Denominator Viability**: Yes. The package now advocates evidence-based reform with a bias toward stability when risks are high—a stance any institutional pragmatist could endorse. The "conservatism" is in the tilt toward inertia, not in the tools or justifications.  

