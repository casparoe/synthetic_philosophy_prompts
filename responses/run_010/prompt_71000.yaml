prompt: |-
  I'm at a four-person political-risk shop and a foundation client has asked us for a single number: the chance that an unwritten two-term convention gets broken in the next ten years, in a country where the constitution says nothing about term limits but every president since the mid-80s has stepped down after two, and where the ruling party has started floating a third term out loud. Our intern assembled a comparison set — 34 unwritten succession conventions across 19 countries, 1870 to 2010, counted from the moment each one had been observed through at least two peaceful successions — and found that 9 of the 34 broke within 25 years of that point. But the moment we tried to turn 9/34 into anything, the whole thing started wobbling: 6 of those 9 breaks occured in a single decade-ish stretch at the end of the window, so they're probably not independent draws; three of the 25 "survivors" were still alive when the window closed, so they're censored, not successes; the underlying archive over-represents countries whose records got digitized, which is not a random sample of anything; and our target case has already run about 38 years, longer than 28 of the 34, and nobody here can agree whether that longevity makes it tougher or more fragile. The two seniors split along the usual lines — one says anchor on the outside view first and adjust only grudgingly, in the spirit of the reference-class-forecasting crowd, the other says a base rate built from cases whose mechanisms (colonial administration, telegraph-era information lag, Cold War patronage) are simply gone is not an anchor, it's a hallucination, and you should be reasoning from how the thing would actually break.

  Before we referee that argument I want the spec. Write the desiderata: what a method for putting a probability on a rare, one-off, long-horizon event by way of a small set of historical analogues actually has to deliver in order to count as adequate. I want the requirement stated, then the case or consideration behind it — including the ones that are easy to skip, like how the reference class gets picked and what stops you from defining it by hindsight, how a static "9 out of 34" becomes a hazard over the client's specific ten-year window, what the method owes you when the target case is unlike everything in the sample on the one feature that seems to matter, what it should do about cases clustering in time and therefore not adding up to 34 independent observations, and whether it has to say anything about how the number would move if the client redraws the class. Also mark which of these are genuinely non-negotiable and which are just the house style of one camp or the other, and tell me which single requirement, taken seriously, knocks out the most candidate methods — I suspect that's where the real disagreement between my two seniors lives. And if some subset of the requirements is jointly unsatisfiable for events this rare — my guess is that "sample big enough to have a usable standard error," "sample homogeneous enough that the frequency transfers," "class defined only from facts available at forecast time," and "sample drawn from a period whose causal structure still holds" cannot all be satisfied at once — then say that plainly as the result rather than as a caveat at the end.

  For context on what counts as adequate: this has to be a protocol four people can actually run in a couple of weeks, hand over as one probability plus an honest interval to a client who will spend money on it, and get scored on a decade from now by someone who wasn't in the room — so a method that only produces qualitative confidence, or that can't be settled by anything short of the heat death of the universe, is out. One extra wrinkle that I think belongs on the list somewhere: the foundation intends to campaign publicly to defend the convention, which means our forecast, if it circulates, changes the thing it's forecasting, and I don't know whether a method has to handle that or just flag it. Finally, briefly and only briefly, run four candidates against the list: the raw base rate from the 34 cases, a duration model with covariates fit to the same data, a structured expert inside-view analysis of how the third term would actually happen, and a no-number option that just presents the closest analogues and their outcomes. A table is fine for that part. The criteria are what I'm after, the scorecard is a courtesy.
reasoning: |-
  Hmm, this user is at a political-risk consultancy facing a high-stakes forecasting challenge. They need to assign a probability to a rare institutional event - the breaking of an unwritten two-term presidential convention - with limited historical data and deep methodological disagreements within their team. The core tension is between reference-class forecasting ("outside view") and mechanism-based reasoning ("inside view"), amplified by data quirks like temporal clustering and censoring.

  The user's request is exceptionally well-structured: they want desiderata for evaluating forecasting methods, articulated as concrete requirements rather than abstract principles. Key pain points include:
  - The 9/34 base rate has temporal clustering (6 breaks in one decade)
  - Right-censoring of 3 ongoing conventions
  - Archival bias toward digitized records
  - Their case's 38-year longevity exceeding most comparators
  - The foundation's planned intervention creating reflexivity

  Notably, they're not asking for the answer but for evaluation criteria - showing sophisticated meta-cognition about the forecasting process. The unspoken need is likely team alignment: they're caught between two senior analysts' epistemological divides and need a framework to referee.

  For the desiderata, I'll organize around five pillars:
  1. **Epistemic foundations** - How the method justifies probability claims
  2. **Reference-class hygiene** - Avoiding cherry-picking and ensuring relevance
  3. **Temporal modeling** - Converting static counts to time-bound probabilities
  4. **Uniqueness accommodation** - Handling outlier cases
  5. **Operational robustness** - Practical constraints like time and reflexivity

  The critical tension is between Requirement 1 (empirical grounding) and Requirement 5 (causal relevance). Historical data requires stability in causal structures, but their case exists in a post-Cold War, digital-era context where old mechanisms (colonial administration, telegraph lag) no longer apply. This is where their seniors' disagreement crystallizes: one wants to anchor in data despite obsolescence, the other rejects "hallucinated" anchors.

  On methods evaluation:
  - **Raw base rate** fails on temporal modeling, uniqueness, and reflexivity
  - **Duration model** struggles with causal relevance and small-sample inference
  - **Expert inside view** has transparency issues but handles uniqueness best
  - **No-number option** dodges quantification but may dissatisfy client

  The reflexivity problem is particularly thorny: forecasting a convention's survival while knowing the client will campaign to defend it creates a Schrödinger's cat scenario. No method fully resolves this, but expert judgment can at least simulate feedback loops.

  Ultimately, they'll need to acknowledge the "impossible quartet": no method can simultaneously achieve sufficient data, homogeneity, ex ante class definition, and causal contemporaneity for such rare events. The path forward might be a hybrid approach that transparently layers base rates with scenario-adjusted weights.
answer: |-
  Here's a structured specification of desiderata for quantifying rare institutional events via historical analogues, followed by a candid assessment of candidate methods. Core tensions center on **epistemology** (can history anchor probability?) and **practicality** (can we compute it rigorously?).

  ---

  ### **Desiderata for Adequate Forecasting Method**
  *(Non-negotiable requirements in **bold**; others reflect competing schools)*

  | # | Requirement                                     | Rationale & Key Considerations                                                                                                | Non-Negotiable? |
  |---|-------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------|-----------------|
  | 1 | **Empirical grounding**                         | Must produce a mathematically defensible probability (not just qualitative confidence). Client requires a number for decision-making.                                                                 | **Yes**        |
  | 2 | **Ex ante reference class definition**          | Class must be defined using only information available *before* the forecast period (e.g., "unwritten conventions with ≥2 successions by 2010"). Prevents hindsight bias.                  | **Yes**        |
  | 3 | **Temporal resolution**                         | Must convert static proportion (9/34) into a *time-bound probability* (e.g., 10-year risk). Handles censoring (3 ongoing cases) and variable exposure periods.                            | **Yes**        |
  | 4 | **Causal relevance**                            | Sample must share underlying mechanisms with target case. If historical breaks relied on extinct factors (e.g., Cold War dynamics), frequency may not transfer.                              | **Debated**    |
  | 5 | **Sample independence**                         | Must account for clustered events (e.g., 6 breaks in one decade). Non-independent cases inflate effective sample size.                                                                     | **Yes**        |
  | 6 | **Heterogeneity accommodation**                 | Must address how target case differs from sample (e.g., 38yr longevity vs. sample median). Should quantify sensitivity to uniqueness.                                                      | **Debated**    |
  | 7 | **Protocol transparency**                       | Method must be replicable by outsiders for scoring. Cannot rely on unstated subjective adjustments.                                                                                         | **Yes**        |
  | 8 | **Reflexivity acknowledgment**                  | Must flag (if not adjust for) how the forecast itself may alter outcomes (e.g., foundation’s campaign strengthening the norm).                                                              | **Minimal: Flag** |
  | 9 | **Reference class sensitivity**                 | Should show how probability changes if class definition shifts (e.g., adding/excluding cases, changing timeframes). Avoids definitional arbitrariness.                                      | **Debated**    |

  ---

  ### **The Central Tension & Joint Unsatisfiability**
  - **Knockout Requirement**: **#4 (Causal Relevance)**. If historical breaks occurred under structurally different conditions (e.g., colonial era, bipolar world), their frequency *cannot* anchor the forecast. This invalidates pure reference-class methods for one senior.  
  - **The Impossible Quartet**: For rare events (<10% base rate) with institutional specificity, **all four** of these are *jointly unsatisfiable*:  
    > (a) Adequate sample size (low standard error)  
    > (b) Causal homogeneity (mechanisms still operative)  
    > (c) Ex ante class definition (no hindsight)  
    > (d) Contemporary relevance (no "zombie mechanisms")  
    **Result**: Compromises are unavoidable. Prioritizing (a) and (c) yields a brittle anchor; prioritizing (b) and (d) abandons empiricism.

  ---

  ### **Candidate Methods Scorecard**
  *(Against Requirements 1-9; ✓ = Fully Meets, ~ = Partially, ✗ = Fails)*

  | Method                        | 1<br>Empirical | 2<br>Ex Ante | 3<br>Temporal | 4<br>Causal | 5<br>Independence | 6<br>Heterogeneity | 7<br>Transparent | 8<br>Reflexivity | 9<br>Sensitivity | Key Weakness |
  |-------------------------------|---------------|-------------|--------------|------------|-------------------|-------------------|-----------------|-----------------|-----------------|-------------|
  | **Raw Base Rate** (9/34)      | ~ (ignores time) | ✓           | ✗            | ✗          | ✗                 | ✗                 | ✓               | ✗               | ✗               | Fails #3,4,5: Ignores censoring, longevity, clustering. |
  | **Duration Model**<br>(e.g., Weibull survival w/ covariates) | ✓             | ✓           | ✓            | ~          | ~ (clustering adjustable) | ~ (covariates help) | ✓               | ✗               | ~               | #4/#6: Covariates rarely capture deep causal differences. Small sample → wide intervals. |
  | **Structured Expert Inside View**<br>(e.g., scenario-weighted Delphi) | ~ (Bayesian) | ~           | ✓            | ✓          | ✓                 | ✓                 | ~               | ~               | ~               | #1/#7: Subjective weights risk opaqueness. Hard to score empirically. |
  | **No-Number Analogues**<br>(Narrative cases) | ✗             | ✓           | ✗            | ✓          | ✓                 | ✓                 | ✓               | ~               | ~               | Fails #1: No probability. Client may reject as non-answer. |

  ---

  ### **Recommendations**
  1. **Reject pure base rates**: They fail temporal resolution (#3) and independence (#5).  
  2. **Hybrid path forward**:  
     - **Anchor**: Fit a survival model (addressing #3, #5) to generate a baseline hazard (e.g., 10-yr risk: 15% ± 8%).  
     - **Adjust**: Use expert weights to downweight historically irrelevant cases (#4, #6) and model reflexivity (#8).  
     - **Report**: Baseline + adjusted probabilities + sensitivity to class changes (#9).  
  3. **Client honesty**: State: *"Historical data suggests X%, but adjustments for [longevity, modernity, activism] range from X/2 to 2X. We assess Y% as most plausible."*  
  4. **Reflexivity**: Flag that campaigning *reduces* break risk (e.g., via "endogenous institutionalization"), but don't model formally—too speculative.

  **Bottom Line**: No method satisfies all desiderata. The survival model + expert adjustment hybrid best balances rigor and relevance **if** experts document adjustments transparently (#7). Prioritize #1, #2, #3, #5—sacrifice #4 perfection.
