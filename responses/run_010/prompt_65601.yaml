prompt: |-
  I run a Thursday lunch-and-learn at my company — mostly backend engineers, no econ or philosophy background, me included (I only know this stuff from hacking on the game tree in python over a weekend). Next week it's 30 minutes at a whiteboard on backward induction and the centipede game, and what I want from you is the plan for the explanation, not the explanation.

  Two complications you should build around. One: I already ran a toy version on my team, 6 nodes, playing for coffee credits, and basically nobody took at node 1 — most games died around node 4 or 5, two ran to the end. I want to use my own numbers, so I need to know where in the sequence they land and what I'm actually entitled to claim from them. Two: I'm pretty sure the room's first reflex will be to patten-match this to minimax — these people write alpha-beta for fun — and I think that reflex is exactly wrong here, but I can't articelate why, so that one needs a designated spot in the talk rather than a shrug.

  So give me: what has to be true in their heads before the paradox is even statable, and what depends on what — I genuinely can't tell whether common knowledge of rationality has to come before the recursion, after it, or not at all; the one tree that should carry the whole thing, and what it needs and what would break it; the misconceptions in the order they'll actually show up (I'm expecting "the experiments just prove people are irrational", "backward induction assumes everyone's a selfish jerk", and "this is the prisoner's dilemma with extra steps") and the exact beat where each gets headed off; one question I can ask at the end that would tell me it landed instead of polite nodding; and what I should openly refuse to get into at this level.
reasoning: |-
  We are building a 30-minute whiteboard session plan on backward induction and the centipede game for backend engineers. The audience has no econ or philosophy background. The presenter has run a 6-node version of the centipede game with the team, and the results were that most games ended around node 4 or 5, with two running to the end. We need to account for these results and explain what they mean.

  Key elements of the plan:

  1. **Prerequisites in their heads**: What must be understood before stating the paradox?
  2. **The tree that carries the explanation**: What tree to draw and what it needs.
  3. **Common knowledge of rationality (CKR)**: When to introduce it and its role.
  4. **Misconceptions and how to address them**:
     - "Experiments prove people are irrational."
     - "Backward induction assumes everyone's a selfish jerk."
     - "This is the Prisoner's Dilemma with extra steps."
  5. **Connection to minimax/alpha-beta**: Why the reflex is wrong and how to address it.
  6. **A question to check understanding**.
  7. **What to avoid in this session**.

  ---

  **Plan Outline:**

  **I. Introduction (5 minutes)**
     - **Hook**: Remind them of the game they played: 6-node centipede for coffee credits. Results: most ended at 4 or 5, two went to the end. Ask: "Why didn't you all take at node 1? That would have been the rational thing, right?" 
     - **Goal of the session**: Understand the logic of backward induction, why it leads to a paradox, and what our experiment says about human behavior and game theory.

  **II. The Centipede Game Setup (5 minutes)**
     - Draw a 6-node centipede tree (as played). Label players (A and B) and payoffs at each terminal node. 
     - Rules: 
          - At each node, the current player can either TAKE (ending the game) or PASS (passing to the next player).
          - Payoffs increase as the game progresses, but the player who TAKES gets a larger share.
     - Example payoff structure (use the one from the experiment, but if not recalled, use a standard one, e.g., at node 1: A takes -> (2,0); if passes, then at node 2: B takes -> (1,3); if passes, then at node 3: A takes -> (4,2); ... up to node 6). 
     - Note: The key is that the total pie grows, but the player who takes gets a bonus.

  **III. Backward Induction Step-by-Step (10 minutes)**
     - Start from the last node (node 6). At node 6, if it's Player A's turn, what will A do? A will TAKE because the alternative (passing) would end the game with no more moves, so A gets the highest payoff by taking.
     - Move to node 5: Player B, knowing that if they pass, A will take at node 6 and B will get less than if B takes at node 5. So B will take at node 5.
     - Continue backward: At node 4, Player A realizes that if they pass, B will take at 5 and A will get less than if A takes at 4. So A takes at 4.
     - ... and so on until node 1: Player A should take immediately.
     - **The paradox**: Backward induction says the game should end at the first node, but in reality (and in experiments) it doesn't.

  **IV. Why This Isn't Minimax (5 minutes)**
     - **Address the reflex**: Engineers might think of backward induction as similar to minimax. But:
          - Minimax is for zero-sum games (one player's gain is the other's loss). The centipede game is non-zero-sum: both can gain by cooperating (passing) until later nodes.
          - In minimax, players are maximizing their own payoff while minimizing the opponent's maximum payoff. In centipede, players are maximizing their own payoff, but they are not adversaries in a zero-sum sense.
          - Backward induction in centipede relies on the assumption that each player is rational and that each player knows the other is rational, and so on (common knowledge of rationality). Minimax does not require this common knowledge structure because in zero-sum games, the opponent is assumed to be fully adversarial and rational, but the solution concept is different.
          - In centipede, the backward induction solution is a Nash equilibrium (specifically, a subgame perfect equilibrium), but it is not the only possible outcome if players are not perfectly rational or if common knowledge of rationality fails.

  **V. Common Knowledge of Rationality (CKR) (3 minutes)**
     - **Timing**: Introduce after backward induction, to explain why the solution is what it is and why it fails in practice.
     - Define: 
          - Rationality: Each player will choose the action that maximizes their own payoff, given their beliefs.
          - Common knowledge: Not only is each rational, but each knows the other is rational, and each knows that the other knows, and so on ad infinitum.
     - In the centipede game, backward induction requires CKR. Without it, players might pass because they hope the other will pass too, leading to higher payoffs.

  **VI. Explaining the Experimental Results (2 minutes)**
     - Why didn't everyone take at node 1? 
          - **Not necessarily irrational**: The backward induction solution assumes CKR. In reality, we don't have common knowledge of rationality. 
          - Players might pass because they are uncertain about the other player's rationality or because they are trying to be cooperative (even if selfishly, hoping for a larger payoff later). 
          - Also, the game is played once and without communication, so trust and reputation are factors.
     - Conclusion from the experiment: The backward induction solution is a theoretical benchmark. Real behavior deviates because of limited rationality, social preferences, or lack of common knowledge.

  **VII. Addressing Misconceptions (Built into the above, but explicitly: )**
     - **"Experiments prove people are irrational"**: 
          - Head off during the explanation of results: It's not that people are irrational; they might be risk-averse, or they might not have common knowledge of rationality. Also, they might be maximizing expected utility in a broader sense (including social preferences).
     - **"Backward induction assumes everyone's a selfish jerk"**:
          - During the backward induction step: Backward induction assumes rationality (selfish payoff maximization) and common knowledge of that. But we are not required to assume that in real life. People might have other-regarding preferences (they care about fairness or the other's payoff). However, even with selfish preferences, without CKR, the outcome can be different.
     - **"This is the Prisoner's Dilemma with extra steps"**:
          - During the setup: The centipede game is sequential and has multiple rounds, while PD is simultaneous and one-shot. In PD, the dominant strategy is to defect. In centipede, backward induction leads to an immediate take, which is analogous to defection, but the structure is different. The centipede game can be seen as a repeated PD? Actually, not exactly because in centipede, the game ends when someone defects (takes). But the one-shot PD is a 2x2 matrix, while centipede is a long game. So they are different.

  **VIII. Check for Understanding (1 minute)**
     - **Question**: "If we played the game again, but this time I told you that the other player is definitely rational and they know you are rational, and you know they know, and so on (i.e., common knowledge of rationality), then what would you do at node 1? Why?"
     - The expected answer: They should take at node 1 because any other action would lead to a worse outcome given the backward induction.

  **IX. What to Avoid**
     - Do not dive into the philosophical debates about rationality (e.g., bounded rationality, alternative solution concepts) beyond what's necessary.
     - Avoid formal definitions of Nash equilibrium or subgame perfection beyond the intuition.
     - Do not get into alternative models (like quantal response equilibrium) to explain the experimental results.

  ---

  **The Tree That Carries the Explanation**
  - Draw a 6-node centipede tree (as played in the experiment). Label the players (A and B) and the payoffs at each terminal node when a take occurs. The tree must show:
     - At each decision node, whose turn it is.
     - The two actions: TAKE (leading to a terminal payoff) and PASS (leading to the next node).
     - The payoffs at each terminal node (when a take happens or when the game ends without a take).
  - What it needs: Clear labeling and progressive buildup of backward induction steps (erasing or crossing out non-optimal moves as we go backward).
  - What would break it: If the payoffs do not satisfy the condition that taking at an earlier node gives the current player more than what they would get if they passed and the next player took immediately (otherwise the backward induction might not hold).

  ---

  **Summary of Timing:**
  - I: Intro (5 min)
  - II: Setup (5 min)
  - III: Backward Induction (10 min)
  - IV: Minimax Contrast (5 min) [Note: might be integrated with III or as a separate part]
  - V: CKR (3 min) [could be part of III or IV]
  - VI: Experimental Results (2 min)
  - VII: Misconceptions (addressed throughout, but if needed, 1 min recap)
  - VIII: Check (1 min)

  Total: 32 minutes (allow 2 minutes buffer for questions during the session).

  Adjust as needed, but this plan covers the required points.
answer: |-
  Here's a battle-tested plan for your 30-minute session, optimized for engineers and incorporating your constraints. The structure anticipates pushback and leverages your experimental data.

  ---

  ### **1. Prerequisites: What Must Be True Before Stating the Paradox** (5 min)
  - **Core concepts to whiteboard first** (keep it concrete):  
    - *Agents*: Two players (A/B), alternating turns.  
    - *Rationality*: "Each player picks the action that maximizes their personal payoff." (Emphasize: no morality, no fairness—just optimization.)  
    - *Game structure*: Draw a 6-node centipede tree **with your actual payoffs** (e.g., node 1: A takes → (3,0), passes → node 2; node 2: B takes → (1,5), etc.).  
    - *Key property*: "PASS increases the total pie, but the *current player* gets more if they TAKE now vs. passing and letting the *other* take next."  
  - **Why this matters**: Without shared understanding of rationality and payoff maximization, the paradox isn’t surprising—it’s just "people being nice." Anchor in your experiment: "You all had the same payoffs. Why did no one take at node 1?"

  ---

  ### **2. The One Tree That Carries the Whole Thing** (10 min)
  - **Draw your 6-node experiment tree** with payoffs. Then:  
    1. Start at the end (node 6): "If we reach node 6, what does B do? TAKE (payoff X > passing payoff)."  
    2. Move to node 5: "A knows B will take at 6. So A compares: TAKE now (gets Y) vs. PASS (gets less because B takes). So A takes at 5."  
    3. Walk backward to node 1. Cross out PASS options as you go—show the collapse.  
  - **What the tree needs**:  
    - Payoffs where **taking early is dominant if you trust the induction** (e.g., A taking at node 1 = 3, passing and being taken from at node 2 = 1).  
  - **What breaks it**:  
    - If payoffs don’t incentivize backward steps (e.g., if passing at node 1 gives A a *higher* payoff than taking, even if B takes next).  
    - If players doubt others’ rationality (your exit point to experiments).

  ---

  ### **3. Where Common Knowledge of Rationality (CKR) Fits** (3 min)
  - **Timing**: **After** backward induction, **before** explaining your results.  
  - **Script**: "Backward induction only works if:  
    1. I know you’re rational.  
    2. You know I’m rational.  
    3. I know that you know I’m rational... (ad infinitum).  
    This is CKR—without it, the chain breaks. Our experiment didn’t have CKR."  
  - **Why here**: CKR explains why BI *should* work in theory but fails in practice. Don’t introduce it earlier—it’s the answer to "Why did we all pass?"

  ---

  ### **4. Beating Misconceptions in Order of Appearance**
  Build rebuttals into the flow:

  | Misconception | When It Arises | How to Head It Off |
  |---------------|----------------|---------------------|
  | **"This is minimax/alpha-beta"** | During backward induction demo | **Stop and contrast**: "Minimax assumes adversarial goals. Here, both players *gain* by cooperating (PASSing)—it’s non-zero-sum. BI isn’t about defeating the opponent; it’s about *coordinating with a rational partner* to avoid mutual loss." |
  | **"Experiments prove people are irrational"** | When showing your results (node 4/5 ends) | **Reframe**: "Not irrational—*strategically uncertain*. Without CKR, passing is rational! You passed because you doubted others would BI. If you *truly* believed CKR, you’d take at node 1." Show a node 4 payoff: "If you thought B might pass, passing could be profit-maximizing." |
  | **"BI assumes selfish jerks"** | During payoff discussion | **Neutralize**: "BI doesn’t require selfishness—it requires *predictability*. If you care about fairness, redefine payoffs to include fairness. BI still applies; it’s about consistency, not values." |
  | **"Prisoner’s Dilemma (PD) with extra steps"** | Likely during Q&A | **Short-circuit**: "PD is simultaneous; this is sequential. PD has one dominant strategy; here, dominance depends on CKR. BI’s paradox is unique to sequential trust games." |

  ---

  ### **5. The Check-for-Understanding Question**  
  End with: **"If we replay with the *exact same group*, but first I prove everyone can do backward induction on the spot—should we expect more or fewer games ending at node 1? Why?"**  
  - *Why it works*: Tests grasp of CKR. Correct answer: "More take at node 1 because we’ve created common knowledge of rationality."

  ---

  ### **6. What to Refuse to Get Into**  
  Explicitly say:  
  - "We won’t discuss evolutionary game theory, bounded rationality, or altruism—assume payoff maximization."  
  - "We won’t solve the philosophy of CKR—just accept it as a mechanic."  
  - "Ignore Nash equilibria beyond BI’s solution—save for another talk."

  ---

  ### **Timing Summary**  
  - **0-5 min**: Prerequisites + experiment reminder.  
  - **5-15 min**: BI walkthrough on your tree + minimax contrast.  
  - **15-18 min**: CKR + experimental results (using your node 4/5 data).  
  - **18-25 min**: Misconception busting (woven in).  
  - **25-29 min**: Check question + wrap-up.  
  - **29-30 min**: Explicitly state boundaries ("What we’re ignoring").

  This forces the paradox to emerge from their own data, separates BI from minimax, and preempts knee-jerk objections. Bring your payoff numbers—they’re your best tool.
