prompt: |-
  For six years I have co-organized a small annual workshop that pairs philosophers of biology with working molecular biologists, and the same argument recurs each time without anyone moving. The question is whether DNA literally carries information, or whether 'genetic information', 'the code', and talk of reading or editing a genome are metaphors that have hardened into jargon. The camps are stable, and I think I can state them without caricature. On one side, a deflationary line — associated in this literature with Sahotra Sarkar's skeptical treatment of the informational idioms of molecular biology — holds that the cell contains no semantic facts, only physical ones: a template, a catalyst, a set of concentration gradients, and a highly convenient way of talking. On the other side, defenders of literal information divide into at least two sub-camps: those who ground biological information in natural selection, on the Maynard Smith-style thought that a signal carries information only where the association between signal and response was shaped by selection, which DNA satisfies and which an inert chemical does not; and those who take a teleosemantic or naturalizing-content route, on which DNA's function is to represent features of the organism. In between stand the developmental systems theorists, who argue that the whole framing is a hangover from a pre-molecular picture: on causal parity, DNA is one developmental resource among many, and the informational vocabulary is precisely what smuggles in its privilege.

  My working hypothesis — offered as a hypothesis, which I want tested rather than flattered — is that the workshop stalls because at least three distinct claims are being argued over under a single banner, and participants keep switching between them:

  (i) a semantic claim: DNA has content; it is about something;
  (ii) a coding claim: the mapping from nucleotide triplets to amino acids is combinatorial, largely arbitrary, and stable across contexts in the way a cipher or a telegraphic code is;
  (iii) a causal-specificity claim: interventions on sequence produce more finely discriminated effects on phenotype than interventions on any other developmental resource.

  My suspicion is that (ii) is nearly undisputed and does very little work in the argument; that critics of (i) are routinely heard as critics of (iii), which they need not be; and that defenders of (iii) — including those who appeal to the information-theoretic measures of causal specificity that have grown up around the parity debate — present their results as support for (i), which those results cannot supply, since a number telling us how much difference a difference in sequence makes says nothing about whether anything is about anything.

  Diagnose the disagreement. Is it a verbal dispute over the word 'information', in the sense that the parties would stop disagreeing once the ambiguity were resolved and each said what they meant; a substantive disagreement about the metaphysics of content that the ambiguity merely obscures; or two different questions — one about scientific practice and what explanatory work the vocabulary does, one about whether semantic properties exist in nature at all — being pursued under one heading? Take up specifically the possibility that (iii) is a live empirical and formal question that has already been partly answered while (i) is not, and say whether that asymmetry explains the impasse. Then tell me what would count as progress: a distinction, a formal result about specificity, an experiment, a change of question — or whether the honest position is that no progress should be expected, and why. If you think my three-way split is wrong, say so and give a better decomposition. No bibliography, no reading list, and no citations; I want the diagnosis argued from the content of the positions as described here.

  Begin with your bottom line in the first sentence — the diagnosis stated outright — and give the reasoning after it. No preamble, and no restating of the question.
reasoning: |-
  Hmm, the user is describing a persistent philosophical debate in molecular biology workshops they've been organizing for six years. The core disagreement is about whether DNA literally carries information or whether that's just hardened metaphor. They've outlined three main positions: deflationists who deny semantic content, literalists who ground information in natural selection or teleosemantics, and developmental systems theorists who reject DNA's privileged status.

  The user proposes a hypothesis that the stalemate stems from conflating three distinct claims: semantic content (i), coding properties (ii), and causal specificity (iii). They suspect (ii) is uncontroversial, while critics of (i) are mistaken for critics of (iii), and proponents of (iii) incorrectly present it as evidence for (i).

  Key questions to address: Is this primarily a verbal dispute about the word "information"? A substantive metaphysical disagreement? Or are two different questions (scientific practice vs. existence of semantic properties) being conflated? Need to specifically evaluate whether (iii) is empirically tractable while (i) isn't, and if this asymmetry causes the impasse. Finally, suggest what would constitute progress - or if progress is unlikely.

  My analysis: The dispute combines verbal ambiguity with substantive metaphysical disagreement. The word "information" is indeed being used in at least three senses: semantic/referential (claim i), combinatorial/code-like (claim ii), and causal-specificity (claim iii). Claim ii about the genetic code's combinatorial nature is indeed uncontroversial - it's an empirical fact about biochemistry. Claim iii about causal specificity is measurable through interventionist experiments and information theory, making it scientifically tractable.

  The real sticking point is claim i about semantic content. This isn't resolvable through experiments because it hinges on philosophical commitments about what counts as "aboutness" - whether it requires evolutionary history (Maynard Smith), teleological function (teleosemantics), or is categorically inapplicable to non-minds (deflationists). These are fundamentally different metaphysical starting points.

  The conflation occurs because: Deflationists denying (i) appear to threaten (iii) when they shouldn't - one can acknowledge DNA's causal specificity without attributing semantic content. Meanwhile, specificity-measure proponents often overreach by presenting (iii) as evidence for (i), when correlation statistics can't establish aboutness.

  Progress would require: First, disentangling these claims explicitly in discussions. Second, accepting that (i) remains metaphysical while focusing on formalizing and measuring (iii). Third, perhaps shifting the question from "is it information?" to "what does the information vocabulary achieve scientifically?" Developmental systems theorists might contribute here by examining why we privilege DNA causally despite parity arguments.

  However, complete resolution seems unlikely because the semantic question (i) may be fundamentally unresolvable - it depends on whether one believes semantic properties can emerge in biological systems without cognition. The debate might persist not due to confusion but because participants value different aspects: some care about explanatory power in science, others about ontological commitments in nature.

  The user's three-way split is largely accurate, though claim ii might be better characterized as "combinatorial arbitrariness" since "coding" already implies semantic interpretation for some. The core insight remains: specificity is measurable, aboutness is philosophical.
answer: |-
  The dispute combines verbal ambiguity about "information" with a substantive metaphysical disagreement about semantic properties in nature, where the asymmetry between empirically tractable causal specificity and philosophically contested aboutness perpetuates the impasse.  

  **Diagnosis Breakdown:**  
  Your three-way split correctly isolates the core conflations:  
  - Claim (ii) *is* uncontroversial: Nucleotide-to-amino-acid mapping exhibits combinatorial arbitrariness (e.g., codon redundancy), but this is a biochemical pattern, not proof of semantic content.  
  - Claim (iii) *is* empirically measurable: Interventionist experiments (e.g., mutagenesis studies) and information-theoretic tools (e.g., Woodward’s causal specificity metrics) confirm DNA’s high-resolution causal influence on phenotypes relative to other factors (e.g., cytoplasmic gradients). This is a scientific question with incremental progress.  
  - Claim (i) *is* metaphysical: Whether DNA "represents" or is "about" organismal traits hinges on unresolved debates over naturalizing intentionality (e.g., must content derive from evolutionary history? Can non-cognitive entities "represent"?).  

  **Why the Impasse Persists:**  
  1. **Conflation of (i) and (iii):** Critics of semantic content (i) are misinterpreted as denying causal specificity (iii), though one can accept DNA’s unique causal role while rejecting "aboutness." Conversely, proponents of (iii) often imply it justifies (i), but specificity metrics quantify causal discrimination, not meaning.  
  2. **Asymmetry Trap:** (iii) is testable (e.g., calculating mutual information between sequence variants and phenotypic outcomes), while (i) is not. Workshop participants likely default to arguing (iii) because it feels scientific, but their underlying motivations diverge: Deflationists care about ontological parsimony; literalists seek to ground representation in biology; developmentalists contest explanatory privilege.  
  3. **Terminal Stakes:** The debate masks two irreconcilable questions:  
     - *Scientific utility:* Does "information" language optimize explanation/prediction? (Here, coding and specificity claims suffice.)  
     - *Metaphysical commitment:* Do semantic properties exist independently of minds? (Here, deflationists and literalists have foundational disagreements.)  

  **Pathways to Progress (not resolution):**  
  - **Distinguish claims explicitly:** Frame discussions around (i), (ii), and (iii) as separate. Consensus on (ii)/(iii) is achievable; (i) should be treated as distinct.  
  - **Formalize causal specificity:** Use quantitative frameworks (e.g., information theory, causal graphs) to compare DNA’s role to epigenetic/environmental factors. This addresses developmentalists’ parity concerns without invoking semantics.  
  - **Shift the question:** Instead of "Is DNA information?", ask "What does the information metaphor accomplish, and what does it risk obscuring?" This exposes pragmatic vs. realist commitments.  
  - **Acknowledge limits:** Progress on (i) is unlikely; it depends on prior philosophical stances (e.g., teleosemantics requires accepting selection as a naturalizer of function). The honest position is that the semantic debate cannot be settled empirically and may reflect divergent intuitions about nature.  

  **Bottom Line:** The workshop stalls because participants conflate measurable causal specificity with intractable metaphysical questions about meaning, while the genetic code’s uncontroversial properties offer no leverage. Progress requires isolating these layers and redirecting energy toward formalizing specificity and clarifying explanatory goals—not expecting consensus on whether nature contains "semantic facts."
