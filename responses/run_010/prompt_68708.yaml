  ### Decision Tree for Interpreting Harsanyi's Aggregation Theorem

  **Instructions**: Answer each question based on the theorem's assumptions and your philosophical intuitions. Proceed down the branches until you reach a leaf (position). Each leaf names a position and states the cost of holding it.

  1. **Does the social utility function represent a moral good (i.e., a value we ought to maximize)?**  
     - **A: Yes** → 2  
     - **B: No** → 6  

  2. **Is this moral good an aggregate of individual well-being?**  
     - **A: Yes** → 3  
     - **B: No** → Leaf 1: *Non-welfarist moral aggregation* [unoccupied; cost: Must defend non-well-being interpretation of utility scales]  

  3. **Can interpersonal comparisons fix the weights in the sum?**  
     - **A: Yes** → 4  
     - **B: No** → Leaf 2: *Representational emptiness* [cost: Must accept that weights are arbitrary without interpersonal comparability]  

  4. **Does the veil of ignorance justify the weights independently?**  
     - **A: Yes** → 5  
     - **B: No** → 7  

  5. **Does rational choice under the veil require vNM rationality?**  
     - **A: Yes** → Leaf 3: *Veil-based utilitarianism* [cost: Must accept vNM rationality in the veil]  
     - **B: No** → Leaf 4: *Rawlsian* [cost: Must reject vNM rationality in the veil]  

  7. **Must individuals receive equal weights?**  
     - **A: Yes** → Leaf 5: *Utilitarianism (equal weights)* [cost: Must defend equal weights without the veil]  
     - **B: No** → Leaf 6: *Weighted welfarism* [cost: Must defend unequal weights separately]  

  6. **Should society have a vNM-rational preference ordering?**  
     - **A: Yes** → 8  
     - **B: No** → 9  

  8. **Is this ordering based on individual well-being?**  
     - **A: Yes** → Leaf 7: *Deflationary welfarism* [cost: Must accept sum as mere preference representation]  
     - **B: No** → Leaf 8: *Deflationary non-welfarism* [unoccupied; cost: Must explain non-well-being utility aggregation]  

  9. **Which axiom is rejected for the social ordering?**  
     - **A: Pareto indifference** → Leaf 9: *Pareto rejector* [cost: Must reject Pareto indifference]  
     - **B: Independence (sure-thing principle)** → 10  
     - **C: Other** → Leaf 10: *Other axiom rejection* [unoccupied; cost: Must specify rejected axiom]  

  10. **Is social evaluation done by transforming utilities ex post?**  
      - **A: Yes** → Leaf 11: *Prioritarianism* [cost: Must reject independence and use concave transformation]  
      - **B: No** → Leaf 12: *Ex ante non-separability* [unoccupied; cost: Must defend non-separable ex ante evaluation]  

  ---

  **Leaf Positions and Costs**:  
  - **Leaf 1**: *Non-welfarist moral aggregation* — Unoccupied (coherent but requires utilities to represent non-well-being values).  
  - **Leaf 2**: *Representational emptiness* — Cost: Weights lack moral significance without interpersonal comparability.  
  - **Leaf 3**: *Veil-based utilitarianism* — Cost: Assumes vNM rationality justifies equal weights.  
  - **Leaf 4**: *Rawlsian* — Cost: Replaces vNM rationality with maximin in the veil.  
  - **Leaf 5**: *Utilitarianism (equal weights)* — Cost: Requires independent defense of equal weights.  
  - **Leaf 6**: *Weighted welfarism* — Cost: Requires external justification for unequal weights.  
  - **Leaf 7**: *Deflationary welfarism* — Cost: Social utility is a preference index, not a moral good.  
  - **Leaf 8**: *Deflationary non-welfarism* — Unoccupied (coherent but utilities must represent non-well-being preferences).  
  - **Leaf 9**: *Pareto rejector* — Cost: Must abandon Pareto indifference (e.g., for fairness).  
  - **Leaf 10**: *Other axiom rejection* — Unoccupied (e.g., rejects continuity; cost must be specified).  
  - **Leaf 11**: *Prioritarianism* — Cost: Rejects independence for ex post inequality aversion.  
  - **Leaf 12**: *Ex ante non-separability* — Unoccupied (e.g., evaluates lotteries pre-resolution; cost must specify aggregation).  

  **Indistinguishable Leaves**:  
  - **Leaf 3 (*Veil-based utilitarianism*) and Leaf 5 (*Utilitarianism (equal weights*))** yield identical social orderings (maximize sum of utilities). They differ only in justification (veil vs. direct equality). To separate: Ask, *"Does the veil provide the sole justification for equal weights?"*  
  - **Leaf 6 (*Weighted welfarism*) and Leaf 7 (*Deflationary welfarism*)** could coincide if weights are fixed descriptively. To separate: Ask, *"Do the weights carry moral weight?"*  

  **Unoccupied Cells**:  
  - **Leaf 1, 8, 10, 12**: Coherent but unattractive. Require defending counterintuitive utility interpretations or unspecified alternatives.  

