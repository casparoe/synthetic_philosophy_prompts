prompt: |-
  You're a philosopher of punishment who also genuinely knows the US Eighth Amendment history, not a law-review voice doing impressions of one. Think carefully about the mapping before you start writing.

  Setup, correct me if I've got any of it wrong: Furman v. Georgia (1972) invalidated existing capital statutes as arbitrary — 5-4, a one-paragraph per curiam with nine seperate opinions and no single rationale. States then split into two camps: some, like North Carolina and Louisiana, made death mandatory for first-degree murder in order to eliminate discretion entirely, while others rebuilt discretion but channeled it with bifurcated trials, statutory aggravating factors, and automatic appellate review. The Court upheld the second approach (Gregg, 1976) and struck down the first (Woodson, 1976). Fifteen years later McCleskey v. Kemp (1987) rejected a statistical study showing Georgia's death sentencing tracked the race of the victim, the majority holding that a pattern of systemic disparity doesn't establish a violation absent purposeful discrimination in the defendant's own case.

  Analyze that 1972–1987 sequence as a live test of the retributivism-vs-consequentialism debate. I want you to use the ordinal/cardinal distinction — ordinal proportionality is about sentences being ranked correctly against one another, cardinal proportionality is about the absolute anchor sitting in the right place — and tell me which of the two Furman's complaint actually was, and whether Gregg's machinery could even in principle have fixed the problem it was aimed at. Then run the analysis in both directions: which features of the episode each theory explains, which it misdescribes, and where each one goes completely silent — say "silent" rather than forcing a verdict. Two things I especially want out of it: why a retributivist of all people might have to side with the McCleskey majority, and why a straightforward consequentialist should be bothered by Woodson rather than relieved.

  Format: first sentence is your bottom line, then the reasoning. No preamble, don't restate my question back at me. Before the analysis proper, spend three or four lines naming the candidate framings you considered and which one you're adopting and why. No citations or reading list — I'm offline and don't want guesses at page numbers.
reasoning: |-
  Okay, the user wants an analysis of the Furman to McCleskey sequence through the lens of retributivism vs. consequentialism, focusing on ordinal and cardinal proportionality. Let me start by recalling the key cases. Furman (1972) struck down death penalty statutes for arbitrariness, leading to two state responses: mandatory death penalties and guided discretion. Gregg upheld guided discretion, while Woodson struck down mandatory statutes. McCleskey later rejected statistical evidence of racial bias.

  The user is interested in how each theory explains these decisions. They mentioned ordinal proportionality (relative severity of punishments) and cardinal proportionality (absolute severity of the punishment itself). Furman's complaint was about arbitrariness, which seems ordinal—sentences weren't consistently applied. Gregg's guided discretion aimed to fix this by structuring discretion. But McCleskey's rejection of statistical evidence might be problematic for retributivists if they focus on individual intent rather than systemic issues.

  Retributivism emphasizes just deserts and individual culpability. So for Furman, the arbitrariness violates ordinal proportionality because similar crimes aren't punished similarly. Gregg's framework tries to address this through aggravating factors. But McCleskey's requirement of showing intentional discrimination in each case aligns with retributivism's focus on individual cases, not systemic patterns. That's why a retributivist might side with the majority in McCleskey.

  Consequentialism looks at societal outcomes like deterrence. Arbitrary executions might not deter effectively, so Furman's concern could be both ordinal and cardinal. Gregg's guided discretion aims for consistency, which should improve deterrence. But Woodson's rejection of mandatory death penalties is puzzling for consequentialists because mandatory sentences should theoretically maximize deterrence. However, maybe the risk of disproportionate punishment (cardinal issue) undermines public trust, reducing deterrence. Hence, a consequentialist might be bothered by Woodson.

  The user also wants to know where each theory is silent. Retributivism doesn't address systemic bias unless it's intentional in individual cases. Consequentialism might overlook individual injustice if the system achieves overall utility. 

  I need to ensure the analysis stays focused on the theories without digressing. Highlighting why a retributivist supports McCleskey and why a consequentialist is troubled by Woodson is crucial. Also, clarifying that Furman's issue was ordinal (inconsistent application) and whether Gregg could fix it—yes, in principle, by structuring discretion. But McCleskey shows that even with guided discretion, systemic bias can persist, which retributivism might ignore but consequentialism should worry about due to eroded legitimacy.
answer: |-
  The Furman-Gregg-Woodson-McCleskey arc reveals retributivism's dominance in structuring legal doctrine despite consequentialist anxieties, primarily because Furman’s core objection was **ordinal disproportionality** (inconsistent sentencing severity among equally culpable offenders), which Gregg’s guided discretion nominally addressed, while McCleskey exposed retributivism’s blindness to systemic bias and Woodson unsettled consequentialism by rejecting deterrence-maximizing mandatory sentences.  

  **Framings Considered:**  
  - *Pure doctrinal history* (ignores philosophical tension).  
  - *Consequentialism as driver* (overstates deterrence/rationalization focus).  
  - *Hybrid theory* (muddies explanatory clarity).  
  Chosen: **Retributivism as doctrinal engine, consequentialism as critical counterpoint** — aligns with the Court's fixation on individual desert post-Furman and exposes normative gaps.  

  **Analysis:**  
  1. **Furman’s Complaint & Gregg’s Fix:**  
     - Furman’s arbitrariness critique targeted **ordinal disproportionality**: death sentences applied erratically, violating retributive justice’s demand for consistent ranking by culpability. Cardinal proportionality (is death ever appropriate?) was *not* at issue; the per curiam implied death could be constitutional if applied fairly.  
     - Gregg’s machinery (bifurcation, aggravation, review) aimed *exclusively* at ordinal repair by structuring discretion to ensure death was reserved for the "worst" offenders. In principle, it *could* fix Furman’s arbitrariness by creating a rational ranking system — but only if applied without bias.  

  2. **Retributivism’s Explanatory Power & Silence:**  
     - **Explains**: Woodson’s rejection of mandatory death (no individualization violates ordinal ranking by ignoring mitigating factors) and Gregg’s focus on culpability-based selection.  
     - **Misdescribes**: Treats McCleskey’s statistical bias as irrelevant — retributivism cares only about *this defendant’s* desert, not system-wide patterns. Hence, a retributivist *must* side with McCleskey’s majority: absent proof of discriminatory *intent in the specific case*, the sentence remains "deserved" regardless of racial impact.  
     - **Silent**: On whether systemic bias corrupts the ordinal ranking itself (e.g., Black defendants/white victims systematically deemed "more culpable"). Retributivism lacks tools to address structural inequities.  

  3. **Consequentialism’s Explanatory Power & Silence:**  
     - **Explains**: Furman’s fear that arbitrary executions undermine deterrence (public perceives punishment as random) and delegitimize the system. Supports Gregg’s proceduralism as rationalization to bolster deterrence and moral authority.  
     - **Misdescribes**: Woodson’s invalidation of mandatory death. A strict consequentialist should *favor* mandatory sentences to maximize deterrence certainty — yet Woodson rejected them as "excessive." This forces consequentialists to confront cardinal limits: even optimal deterrence cannot justify universally mandatory death if it feels morally grotesque (bothered, not relieved).  
     - **Silent**: On why *procedural* fixes (Gregg) satisfy when bias persists (McCleskey). If the goal is reducing murders or cost efficiency, unaddressed racial disparities may corrode system legitimacy — but consequentialism cannot explain why *process* over *outcome* sufficed doctrinally.  

  **Conclusion:** The sequence shows law privileging retributive ordinal proportionality, leaving consequentialism to highlight unresolved tensions (bias in McCleskey, absolutism in Woodson) that the doctrinal structure cannot resolve.
