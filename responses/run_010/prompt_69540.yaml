answer: |-
  ### Desiderata for a Theory of Conventional Moral Obligation  
  *(Operationalized for Non-Specialist Adjudication)*  

  **Core Distinctions the Theory Must Preserve**  
  1.  **Wronging someone** (harming/interfering with a specific person/group) vs. **Doing wrong** (violating an impersonal standard).  
  2.  **Having a reason** (a consideration favoring action) vs. **Having an obligation** (a decisive, exclusionary requirement).  
  3.  **Conditions for a norm's existence** (social facts about its recognition) vs. **Conditions for its binding *you*** (agent-relative factors like role, benefit, or commitment).  
  4.  **Bad convention** (a norm that is inefficient, unfair, or harmful) vs. **Wrongful breach** (violating it when bound).  
  5.  **Constitutive rules** (defining the practice, e.g., "queuing means first-come-first-served") vs. **Regulative rules** (governing conduct within it, e.g., "don't push in line").  
  6.  **Expectation-dependent costs** (my loss if your noncompliance frustrates my reliance) vs. **Attitudinal costs** (disapproval/hurt feelings alone).  
  7.  **Visitor status** (binary or graded outsider) vs. **Member status** (binary or graded insider). *[Added per your apparatus]*  

  **Requirements List**  

  1.  **Label:** **"Locate the Cost"**  
      *   **Demands:** The theory must identify a specific cost (material, psychological, relational) caused *by this breach* that falls on identifiable others, beyond mere dislike of rule-breaking.  
      *   **Cases:** **A** (frustration, potential conflict), **D** (child safety/confusion, others' reliance), **F** (perceived unfairness, undermining official rule), **J** (visitor-specific resentment).  
      *   **Non-Negotiable?** **No.** Harm/cost purists demand it, but expressive theories often reject it as fundamental.  
      *   **Loses if dropped:** Shields against moralizing trivialities or purely symbolic breaches (e.g., minor vestigial norms like **I**). Risk: Over-focus on tangible harm misses expressive/symbolic wrongs (**E**, **H**).  

  2.  **Label:** **"Pin the Reliance"**  
      *   **Demands:** The theory must specify *whose* reasonable plans/expectations are concretely disrupted by *this specific noncompliance* in a way that imposes a cost or unfairness.  
      *   **Cases:** **A** (queuers relying on order), **C/D** (drivers/pedestrians relying on light signals), **F** (those relying on official rule vs. unofficial norm).  
      *   **Non-Negotiable?** **Yes, for Coordination/Positional types.** Core to their function. Less critical for pure Signaling/Vestigial.  
      *   **Loses if dropped:** Ability to distinguish **B** ("shape people happen to be in") from **A** (active reliance). Collapses coordination into mere habit.  

  3.  **Label:** **"Decode the Signal"**  
      *   **Demands:** The theory must explain what noncompliance *communicates* (disrespect, rejection, superiority) in the specific context, and why that communicated message wrongs others or damages relationships.  
      *   **Cases:** **E** (tipping as communication of satisfaction/respect), **F** (not greeting by name as aloofness), **H** (campaigning as hostile rejection), **I** (dropping form of address as indifference).  
      *   **Non-Negotiable?** **Yes.** Essential for Signaling conventions. Expressivist theories center this; harm/fair-play struggle.  
      *   **Loses if dropped:** Coherence on **E**, **H**, **I**. Reduces signaling to irrational habit or arbitrary pressure.  

  4.  **Label:** **"Map the Membership"**  
      *   **Demands:** The theory must adjust obligations based on agent status (member/visitor, degree of integration) and explain *why* status matters (e.g., benefit receipt, acceptance, vulnerability to sanction).  
      *   **Cases:** **G** (long-term visitor rejecting norms), **J** (locals annoyed at visitors jaywalking), Visitor in **E/F**.  
      *   **Non-Negotiable?** **Yes.** Universalist theories flounder here. Requires grounding in relationship/context.  
      *   **Loses if dropped:** Fairness in applying norms to outsiders (**G**) or explaining differential expectations (**J**). Treats all agents identically regardless of connection.  

  5.  **Label:** **"Flag the Vestigial"**  
      *   **Demands:** The theory must distinguish norms where compliance is driven by *active mutual expectation* (**A**, **D**) from those where it's mere *habit or inertia* without significant expectation or cost (**B**, **I**).  
      *   **Cases:** **B** (empty queue shape), **I** (habitual form of address).  
      *   **Non-Negotiable?** **Yes.** Prevents "zombie norms" from binding indefinitely.  
      *   **Loses if dropped:** Risks obligating compliance with pointless or harmful dead norms. Cannot explain why breaching **B** is fine but breaching **A** isn't.  

  6.  **Label:** **"Weigh the Weight"**  
      *   **Demands:** The theory must explain variations in obligation *strength* (prima facie vs. absolute) based on cost, reliance, fairness, expressiveness, and context (e.g., child present in **D**).  
      *   **Cases:** **C** (low stakes) vs. **D** (high stakes), **A** (clear reliance) vs. **B** (no reliance).  
      *   **Non-Negotiable?** **Yes.** Avoids binary "bound/not bound" outputs. Requires scalar reasoning.  
      *   **Loses if dropped:** Nuance. Cannot explain why **C** is permissible but **D** is likely wrong, or why breaching a vital coordination norm is worse than breaching a minor signal.  

  7.  **Label:** **"Block Bootstrapping"**  
      *   **Demands:** The theory must prevent mere *expectation of compliance* or *disapproval of noncompliance* from *creating* a moral obligation where none existed before. Need a further ground (harm, unfairness, expressive meaning).  
      *   **Cases:** **E** (tipping where rationale gone but expectation persists), **F** (unofficial norm conflicting with official rule), **J** (locals annoyed at visitor jaywalking despite doing it themselves).  
      *   **Non-Negotiable?** **Yes.** Prevents moral "tyranny of the majority." Core to distinguishing existence from bindingness.  
      *   **Loses if dropped:** Legitimizes arbitrary or unfair norms simply because they exist and provoke disapproval (**F**, **J**). Obligation collapses into social pressure.  

  8.  **Label:** **"Handle the Hypocrite"**  
      *   **Demands:** The theory must assess breaches where the complainer routinely violates the norm themselves or benefits from its violation by others (**J**), or where the norm itself is inconsistent/flawed (**F**).  
      *   **Cases:** **F** (resentment despite norm inconsistency), **G** (rejection by non-member), **J** (locals jaywalking but annoyed at visitors).  
      *   **Non-Negotiable?** **No.** Fair-play theories demand it; expressive theories may downplay it.  
      *   **Loses if dropped:** Fairness critique. May obligate compliance with hypocritically enforced or internally inconsistent norms, weakening legitimacy.  

  9.  **Label:** **"Scope the Entrepreneur"**  
      *   **Demands:** The theory must distinguish permissible/obligatory norm *challenge* or *reform* (**H**) from wrongful breach, based on motive, means, and target norm's quality.  
      *   **Cases:** **H** (deliberate noncompliance to change norms).  
      *   **Non-Negotiable?** **Yes.** Without this, all challenge is wrong. Requires assessing norm quality and reform effort.  
      *   **Loses if dropped:** Stifles social progress. Cannot justify **H**'s actions as potentially legitimate protest.  

  10. **Label:** **"Resist Personal Calculus"**  
      *   **Demands:** The theory must generate obligations *independent* of the agent's subjective endorsement, values, or perceived net benefit. Obligation flows from the social context/relationship, not internal conviction.  
      *   **Cases:** **G** ("I never accepted it"), Visitor in **E/F** acting on home norms.  
      *   **Non-Negotiable?** **Yes.** Core to the concept of *obligation* vs. mere reason. Enables inter-rater agreement by removing idiosyncrasy.  
      *   **Loses if dropped:** Predictability and agreement. Obligation dissolves into personal preference. **G**'s stance always wins.  

  **Conflict Analysis: The Suspected Trio**  
  *   **The Trio:** Content fixed locally + Grounding in locatable cost/unfairness + Excluding agent's judgement.  
  *   **The Conflict:** Local norms (**J**, **F**) often generate expectations/disapproval *without* clear locatable costs beyond expressive offense ("resentment", "reads as a verdict"). Grounding solely in locatable cost rejects these as obligations ("Block Bootstrapping" - R7). However, excluding the agent's judgement (R10) prevents dissolving the obligation via personal rejection. The tension arises when local practice generates strong expressive expectations seen as binding (e.g., tipping in **E**), but the only "cost" is communicative harm (offense, misattribution). *Harm/Fair-Play theories* demand locatable costs and reject pure expressivism. *Expressive theories* accept communicative harm but struggle on R10 if they incorporate agent's interpretation of meaning. **Result:** Requiring all three risks ruling out *all* signaling conventions (**E**, **I**, **H**) and hypocritical enforcement (**J**) as morally binding, or smuggling expressive costs in as "harms," violating "Block Bootstrapping" (R7).  

  **The Cleaver Requirement**  
  *   **Requirement:** **"Resist Personal Calculus"** (R10 - Obligation independent of agent's judgement).  
  *   **Why it Clears the Field:** It immediately eliminates subjectivist/relativist accounts where obligation hinges on the agent's acceptance or values (e.g., **G**'s defense fails). Most sophisticated theories accept this.  
  *   **Why You Might Not Insist:** It risks making obligations overly rigid, potentially binding agents to deeply flawed or oppressive local norms where personal rejection is justified ("Block Bootstrapping" R7 & "Scope the Entrepreneur" R9 become harder to satisfy). It prioritizes predictability over individual conscience, which may be politically or ethically unpalatable for some stakeholders (e.g., the community organizer).  

  **Brief Assessment of Theoretical Families**  
  1.  **Harm/Cost Grounding:** Focuses on R1 (Locate Cost) and R2 (Pin Reliance). Strong on **A**, **C**, **D**, **B** (shows no cost). Weak on pure signaling (**E**, **I**), expressive protest (**H**), and hypocrisy (**J**) – struggles to locate "harm" beyond offense. Risks violating R7 (Bootstrapping) if it labels disapproval as harm. Poor on R4 (Membership) nuance.  
  2.  **Fair-Play/Benefits Grounding:** Focuses on R2 (Reliance as reciprocity) and R8 (Hypocrite). Strong on **A**, **F**, **G** (membership/benefit), **J** (fairness). Weak on vestigial norms (**B**, **I** - no benefit received), low-stakes coordination (**C** - no unfairness), and expressive meaning (**E**, **H**). Struggles with R9 (Entrepreneur) if norm is unfair.  
  3.  **Expressive Grounding:** Focuses on R3 (Decode Signal) and R6 (Weigh Weight via meaning). Strong on **E**, **H**, **I**, **J**, **F**. Can handle R4 (Membership via shared meaning) and R9 (Entrepreneur via communicative intent). Weak on low-stakes coordination without expressive layer (**C**, potentially **A/B**), R1/R2 (Locate Cost/Pin Reliance) – risks violating R7 (Bootstrapping) by treating communicated offense *as* the wrong. Struggles with R10 (Resist Calculus) if meaning depends on agent's intent.  

  **(Word Count: 1720)**
