prompt: |-
  Just spent three hours going back and forth with a friend about when you're actually allowed to flat-out say something, and I think we're each half right, so I want a third party.

  Her line is the simple one: you may assert p only if you know p. My problem is it keeps landing wrong, so I started writing down cases where I'm pretty confident about the verdict, and there's a shape to them I can't name.

  1. My sister texts that her flight's delayed; I tell my mum "her flight's delayed." Fine, obviously.
  2. Friend has one of about ten million lottery tickets, draw hasn't happened yet, I say "you didn't win." Not fine. I'd take it back. And I'm no more confident about lots of things I say happily all day.
  3. Doctor after a biopsy: "it's benign, you don't have cancer." Test is something like 99.7% accurate and she's upfront about that. Totally fine — she should say it straight.
  Case 2 vs case 3 is the pair that broke us. Roughly the same ballpark of odds, opposite verdicts, and I'm not moving on either.
  4. A cousin who never reads anything announces at dinner "that bridge is going to come down, I just have a feeling." Bridge is in fact condemned and closes two months later. Still not fine, I think. Right answer, bad assertion.
  5. A friend teaches high school biology, very religious, tells her class we share a common ancestor with chimpanzees. Privately she can't get herself to believe it, but she teaches it straight and says the evidence points there. I say that was a fine assertion. My friend says it's improper automatically, because she doesn't even believe the thing.
  6. A committee chair reads out "we found the methodology unreliable" after voting the other way herself, unanimously outvoted by everyone else on the panel. Fine to say, I think, even though she doesn't know it and doesn't believe it.
  7. I told a friend "your flatmate is taking your money" on the word of the other flatmate, and it turned out false. Improper, and "his evidence looked good at the time" doesn't make it proper — it just makes him less blameworthy. Blamelessness and propriety are two different things, which she agrees with.
  8. I know a friend is pregnant, she hasn't told anyone, I say so at a party. Improper, but not because of anything about assertion as such — it's the telling. This is the only case we fully agree on.

  My own guess at a principle, which I want you to attack: you may flat-out assert p only if you could produce, on demand, a reason for p that is about this particular case rather than about how things of that type usually go, and that would satisfy a reasonable person who doubted it. That handles 2 against 3 — all I've got for the lottery is the odds, whereas she's got a slide with your cells on it. It handles 4, since a feeling is nothing. It probably handles 1 and 7.

  But it wrecks 5 and 6, which I'm not giving up, and here's the one I think kills it: I tell my nine year old the earth is about 4.5 billion years old. I could not begin to back that up on demand. I have no case-specific grounds at all, I'm just downstream of a lot of people I'll never meet. And it is obviously a completely fine thing to say. So either my principle is wrong or "produce it on demand" isn't the right test.

  So, what's the principle? Give me your best one or two, clause by clause, and say which case each clause is there to handle. Then be honest about which of my verdicts it can't keep and which one I should drop — I suspect it's one of 2 and 3 and I want to know which, and what the argument is. Finally, what does it say about three we never got to: a climate scientist saying this heatwave was made about three times more likely by warming, which sounds statistical but feels perfectly assertable; a jury foreman saying "guilty" where the real evidence was a DNA match with a one-in-a-billion random match probability; and a mechanic saying "your alternator's shot" after a five minute test that's right about 95% of the time. And if your principle says the DNA case is fine but the lottery isn't, spell out exactly what's doing the work in that gap, because I'm confident there is a gap and I can't say what it is.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They've been debating assertion norms with a friend for hours, and their cases reveal deep tensions in epistemic principles. The core conflict seems to be between knowledge-based norms and contextual/pragmatic considerations. 

  Hmm, the lottery case (2) versus biopsy case (3) is particularly thorny—both involve ~0.3% uncertainty but different intuitions. The user instinctively feels statistical claims need an "anchor" in evidence beyond just odds, but their proposed principle fails for testimony cases (like teaching evolution). That dead end suggests we need multiple criteria. 

  I notice their scenarios cluster into types: testimony (1,5,6), statistical evidence (2,3), gut feelings (4), and ethical constraints (8). No single principle covers all. The biology teacher case (5) is especially telling—assertion seems proper despite personal disbelief because of role-based obligations. That points to social context mattering as much as epistemology.

  For the DNA/lottery gap: the key might be whether odds attach to a specific causal history (DNA: this sample was tested) versus pure chance (lottery: no particularizing facts). The mechanic case (95% test) feels assertable partly because diagnostic processes carry normative weight in their context. 

  The user's struggle with "producing reasons" for the Earth's age reveals how much we rely on epistemic chains. We don't demand individual verification for communal knowledge—which suggests assertion norms must account for division of cognitive labor. Maybe the real principle is about responsibly channeling reliable processes rather than personal certainty.

  ...But I should check if role-based assertions (doctor, teacher, jury) share a "deference to system" feature that pure statistical claims lack. That could explain why biopsy results feel different from lottery denials. The climate scientist case would then hinge on whether their attribution models count as such a system.
answer: |-
  Here's a principled framework that reconciles your intuitions, clause-by-clause, with analysis of your cases and new examples. It combines epistemic, contextual, and functional dimensions of assertion:

  ### **Principle: Responsible Assertion**
  You may flat-out assert *p* if and only if:
  1. **Evidential Grounding**: You possess justification for *p* that is **non-arbitrary** and **appropriately connected** to the subject matter.  
     *(Handles Cases 2, 3, 4, 7)*  
  2. **Social Function**: Your assertion serves a **legitimate communicative purpose** in its context (e.g., informing, coordinating, fulfilling a role).  
     *(Handles Cases 5, 6, 8)*  
  3. **Defeasible Reliability**: Your justification arises from a **reliable process/method** that is contextually adequate (even if statistical) *or* you are a **trusted conduit** of such a process (e.g., expert testimony).  
     *(Handles Cases 1, 3, 5; bridges lottery/DNA gap)*  

  ### **Clause-by-Clause Application to Your Cases**
  - **Case 1 (Flight Delay)**: Fine. *Evidential Grounding* (direct testimony) + *Social Function* (informing) + *Defeasible Reliability* (text message is reliable).  
  - **Case 2 (Lottery)**: Improper. *Evidential Grounding* fails—pure odds are arbitrary (no connection to *this* ticket). *Social Function* may exist, but grounding is insufficient.  
  - **Case 3 (Biopsy)**: Fine. *Evidential Grounding* (test result, even statistical) + *Defeasible Reliability* (medical test is reliable; doctor interprets results).  
  - **Case 4 (Bridge Feeling)**: Improper. *Evidential Grounding* fails (gut feeling is arbitrary).  
  - **Case 5 (Biology Teacher)**: Fine. *Social Function* (role obligation) + *Defeasible Reliability* (conduit for scientific consensus). Belief is irrelevant.  
  - **Case 6 (Committee Chair)**: Fine. *Social Function* (role obligation to report group decision) overrides personal belief.  
  - **Case 7 (False Accusation)**: Improper. *Evidential Grounding* fails (hearsay isn’t adequately connected).  
  - **Case 8 (Pregnancy Gossip)**: Improper. Violates *Social Function* (no legitimate purpose; breach of trust).  

  ---

  ### **Where Your Verdicts Stand & What to Drop**
  - **Your friend’s principle ("assert only if you know *p*")** fails Cases 5 and 6 (teacher/chair don’t "know" *p*).  
  - **Your proposed principle ("produce case-specific reasons")** fails Cases 5 (teacher can’t produce evidence) and 6 (chair disagrees).  
  - **Drop Case 2 as "improper"** if you insist statistical claims are never assertable—but the framework explains why Case 3 *is* proper. The lottery lacks the **non-arbitrary connection** clause (see below).  

  ---

  ### **Resolving the Lottery/Biopsy Gap (Cases 2 vs. 3)**
  The difference is **non-arbitrary grounding**:  
  - **Lottery**: "You didn’t win" relies *only* on base rates (1/10M odds). No evidence addresses *this specific ticket*.  
  - **Biopsy**: "It’s benign" uses a test **applied to the patient’s tissue**. The 0.3% error rate is a limitation of a *targeted method*, not a generic statistic.  
  - **Key**: Statistical claims are assertable **only when tied to a specific investigative process** (e.g., biopsy, DNA test).  

  ---

  ### **New Cases Analyzed**
  1. **Climate Scientist**: "This heatwave was 3× more likely due to warming."  
     - **Fine**: *Evidential Grounding* (attribution study) + *Defeasible Reliability* (scientific model) + *Social Function* (informing public).  

  2. **Jury Foreman**: "Guilty" (based on 1-in-a-billion DNA match).  
     - **Fine**: *Evidential Grounding* (DNA tied to defendant) + *Defeasible Reliability* (forensic science) + *Social Function* (legal verdict). Contrast with lottery: DNA matches **particularize** the odds to the defendant.  

  3. **Mechanic**: "Your alternator’s shot" (95% accurate test).  
     - **Fine**: *Evidential Grounding* (test applied to *this* car) + *Defeasible Reliability* (standard diagnostic method) + *Social Function* (expert advice).  

  ---

  ### **Why This Works**
  - **Solves the Lottery/DNA Gap**: DNA evidence is **particularized** (applies to *this* person) via forensic process; lottery lacks this.  
  - **Saves Testimony/Trust Cases**: Teachers/mechanics assert properly as **conduits of reliable systems**, even without personal belief or ability to "prove" *p* on demand.  
  - **Excludes Arbitrary Claims**: Gut feelings (Case 4) and base rates (Case 2) lack a **non-arbitrary link** to the subject.  

  **Final Verdict**: Drop your insistence that **Case 2 (lottery)** should be assertable. The framework shows why statistical claims *without a specific investigative anchor* (like biopsies/DNA) fail—they’re epistemically inert. Your intuitions about Cases 3 (biopsy), 5 (teacher), and 6 (chair) are correct and preserved.
