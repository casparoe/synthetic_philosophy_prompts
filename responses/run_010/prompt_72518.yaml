answer: |-
  Here's a toast designed for the occasion, balancing affection, principle, and diplomacy, clocking in around 4 minutes:

  **(Clink glass gently)**

  "Good evening, everyone. For those who don't know me, I’m [Your Name], [Aunt's Name]’s very proud niece/nephew. And let’s be honest, seeing so many of you here tonight – historians, society members, friends, colleagues – proves something fundamental: my aunt clearly knows where *all* the bodies are buried. Figuratively speaking, of course. Mostly. *(Pause for laugh)* Seriously, after 38 years as our county archivist, she probably *could* tell you, but professional ethics would forbid it.

  What she *has* done, relentlessly and beautifully, is help us understand the lives buried in those boxes and files. Not as dusty relics, but as real people living real moments. Anyone who’s ever written a label under her watch – and many of you have the scars! – knows her golden rule. That falling-apart copy of Butterfield in her desk drawer wasn’t just reading; it was her compass.

  **'You don't say what something led to,'** she’d insist. **'You say what it looked like from where they were standing in 1893, with no idea what was coming.'** No 'firsts', no 'beginnings of', no sneaky adjectives doing the heavy lifting of hindsight. Just: *This is what they saw. This is what they knew. This is what they felt.*

  **(Look towards Aunt, warmly)**

  Aunt [Aunt's Name], that’s how you treated every scrap of paper, every photograph, every story entrusted to this county. You fought to let the past speak for itself, on its own terms, free from our comfortable narratives about progress or inevitability. You demanded intellectual honesty, not judgment from the future. It made the history you curated feel astonishingly alive, immediate, and human. You made us *witnesses*, not just readers.

  Now, tonight also celebrates the new heritage trail – twelve plaques marking significant spots. And yes, there was… vigorous discussion… about the wording. My aunt engaged in that discussion with her trademark passion for precision, for stripping away the lens of hindsight. The result reflects many viewpoints, as these things often do. There’s plaque number four, certainly. But there’s also plaque number [Number of her plaque - e.g., twelve]. And *that* plaque? It bears her unmistakable imprint. It tells its story cleanly, clearly, rooted firmly in its moment. No grand prophesies, just the facts as they were lived. It stands as a quiet testament to her standard – a permanent reminder of how she believed history *should* be told.

  **(Raise glass higher)**

  So, to [Aunt's Name]: For 38 years of meticulous care, fierce integrity, and an unwavering belief that the past deserves to be understood on its own terms. For teaching us to see the people of yesterday not as stepping stones to us, but as people just as complex, just as uncertain, just as *present* in their moment as we are in ours. For safeguarding our shared story with such profound respect. Your legacy isn't just in the archives; it's in how you taught us all to *see*. We are so grateful. To [Aunt's Name]!"

  **(Everyone drinks)**

  ---

  **Where I Reached for Progress & What I Did Instead:**

  1.  **Describing her plaque:** I almost wrote: *"It stands as a beacon of how history* ***should and will eventually*** *be told."* **Problem:** This implies inevitable progress towards her view, undermining her core objection to teleology. **Solution:** Changed it to: *"It stands as a **quiet testament** to her standard – a **permanent reminder** of how she believed history should be told."* (Focuses on *her* belief and its enduring presence, not future victory).
  2.  **Her legacy:** I nearly said: *"Your legacy... shows us how far we've come in understanding the past."* **Problem:** "How far we've come" is pure Whig history/progress narrative. **Solution:** Changed to: *"Your legacy isn't just in the archives; it's in **how you taught us all to see**."* (Focuses on a *method* and *perspective* gained, not linear progress).
  3.  **The Toast Closing:** The initial draft ended with a vague "and the future is brighter for your work." **Problem:** Implies her work leads to a better future (progress). **Solution:** Replaced it with a focus on gratitude for how she changed perspective *now*: *"We are so grateful."*

  The core strategy was to constantly reframe: avoid verbs implying direction (lead to, pave the way, culminate) or value judgments based on outcomes (important *because*...). Instead, focus on **presence** (how things were then), **integrity** (her consistent principle), **respect** (for the past's reality), and **enduring impact** (her influence *now*, not her vindication later).
