prompt: |-
  I help run an independent philosophy reading group at my high school, and this term we are working through Scanlon's contractualism. I set practice questions for the other members and mark their answers so they can see where the reasoning goes wrong. I am now marking the submission below and want a grade and a complete set of written comments on it. Please treat the answer as all the evidence available: do not credit it for what a charitable reader might supply, and do not assume I already have a view of its quality.

  The question I set was:

  State Scanlon's contractualist criterion of wrongness, explain the aggregation problem it is said to face, and assess his response to it. Your answer must explain how his view can require saving the greater number when the harms are unequal without ever summing complaints across persons.

  The submitted answer:

  Scanlon's contractualism holds that an act is wrong if it would be forbidden by any set of principles for the general regulation of behaviour that no one could reasonably reject as a basis for informed, unforced general agreement. Because the standard is reasonableness rather than advantage, the test is impartial: we consider a principle from the point of view of everyone affected together, weighing all of their interests against one another, and we accept it if that joint weighing would not be rejected.

  The aggregation problem arises from the individualist restriction, the rule that only individual persons' reasons count and that these may not be summed across persons. Suppose one person will die unless I rescue him, while a billion others will each suffer a mild headache. Intuitively the billion headaches together matter more than the one death, but contractualism has no way of adding them up, so it appears to imply that we should let the billion suffer and save the one.

  Scanlon's response is the balancing argument. We compare complaints pairwise, one individual at a time. In the unequal case the dying person's complaint is far stronger than any single headache-sufferer's, so a principle directing us to rescue him cannot reasonably be rejected, while the opposite principle can be rejected by him. Because pairwise comparison does this work, Scanlon holds that no case ever requires adding complaints together: the same machinery handles the headaches case, and the objection loses its force.

  Where harms are equal, however, pairwise comparison yields a tie, since each of the five has a complaint exactly as strong as the one's. Here Scanlon follows Taurek in holding that the numbers do not count: we should flip a fair coin, because giving each person an equal chance of being saved is the only way to give positive weight to every life. His theory is therefore non-aggregative all the way down, saving the greater number when the harms differ in size and declining to when they do not.

  Please give me a grade out of ten and then a point-by-point commentary I can hand back: identify which claims are accurate and which are not, and for each problem explain what the correct position is and why a student might have slipped into the error. Distinguish, as far as you can, mistakes that suggest a real misunderstanding of the theory from imprecise but ultimately harmless phrasing, and tell me which single issue I should push hardest on in our next meeting.
reasoning: |-
  Okay, the user runs a philosophy reading group focusing on Scanlon's contractualism and needs help grading and commenting on a student's submission. The question covers Scanlon's criterion of wrongness, the aggregation problem, and his response. 

  First, I need to recall Scanlon's core ideas accurately. His contractualist criterion defines wrongness based on principles no one could reasonably reject. The aggregation problem challenges how this view handles cases where many small harms seem to outweigh one severe harm without summing complaints. Scanlon's solution involves pairwise comparisons and a tie-breaking mechanism for equal harms.

  Looking at the student's answer: They start well by stating the criterion correctly but slip when describing the "joint weighing" process—Scanlon explicitly avoids aggregating interests. The headache vs. death example is correctly framed, but the student misrepresents the outcome, implying contractualism would save the one over the billion, which isn't Scanlon's intended conclusion. 

  The bigger issue is the "balancing argument" section. The student misunderstands pairwise comparison as a direct contest between individuals, but Scanlon uses it to justify principles that permit saving the greater number. The Taurek reference is accurate but oversimplified—Scanlon rejects coin-flipping and argues for saving the greater number in equal-harm cases through a different rationale about generic complaints. 

  The student's errors suggest they conflate Scanlon with Taurek and miss how principles generate reasons beyond pairwise clashes. The deepest confusion seems to be about the move from individual complaints to principle-based justifications. For the next meeting, I'd prioritize unpacking why contractualism isn't about direct comparisons between people but about evaluating principles that could govern actions. 

  The grade? A 5/10 feels right—foundational grasp but critical misunderstandings in key responses. The commentary should pinpoint where the student veers off-track (e.g., "joint weighing," misreading the headache case outcome, misapplying pairwise comparison, and the Taurek confusion) while acknowledging what they got right. I'll structure feedback to clarify Scanlon's actual solutions without assuming prior knowledge.
answer: |-
  ### Grade: 5/10  
  *(Adequate grasp of core concepts but significant misunderstandings of Scanlon's responses and key distinctions, leading to an inaccurate overall portrayal.)*

  ---

  ### Point-by-Point Commentary

  **1. Scanlon’s Criterion of Wrongness**  
  - **Accuracy**: Correctly stated the core criterion.  
  - **Error**: The phrase "weighing all of their interests against one another" and "joint weighing" is misleading.  
  - **Correction**: Scanlon **explicitly rejects** aggregative "weighing" of interests. The test examines whether *each individual*, considering their *own* reasons, could reasonably reject a principle. We compare burdens *under alternative principles*, not by summing or jointly weighing interests.  
  - **Why the error?**: You might conflate contractualism with utilitarianism. Scanlon’s "impartiality" involves considering each person’s standpoint *separately*, not merging them.  

  **2. The Aggregation Problem**  
  - **Accuracy**: Correctly defines the problem (individualist restriction) and gives a valid example (death vs. billion headaches).  
  - **Error**: Incorrectly claims contractualism implies we "should let the billion suffer and save the one."  
  - **Correction**: Scanlon **denies** this is the implication. He argues a principle permitting saving the one *could* reasonably be rejected by the billion, as each has a generic complaint against principles ignoring easily preventable suffering (see *What We Owe to Each Other* §5.5).  
  - **Why the error?**: Overgeneralizing the "no summing" rule without seeing how Scanlon addresses small harms via *principled objections*.  

  **3. Scanlon’s Response: Pairwise Comparison**  
  - **Accuracy**: Correctly identifies "pairwise comparison" as part of Scanlon’s strategy.  
  - **Error**: Misrepresents how pairwise comparison works and its role.  
    - **Major Error 1**: Claims we compare complaints "one individual at a time" and that the dying person’s complaint is stronger than "any single headache-sufferer’s."  
      - **Correction**: Scanlon **does not** compare individual complaints directly. Instead, we ask if a principle allowing failure to save the one (to avoid billions of headaches) could be reasonably rejected *by the one person*. The answer is no because their complaint (death) is *not* outweighed by *any single other person’s* complaint (a headache). However, the billion *collectively* can reject a principle that *always* prioritizes saving the one, as it ignores their *generic* complaint (see *WWOTO* p. 229-232).  
    - **Major Error 2**: Asserts pairwise comparison handles the headache case fully.  
      - **Correction**: Pairwise comparison **alone** cannot resolve the headache case—it only shows no *individual* headache-sufferer can reject saving the one. Scanlon relies on the **totality of complaints** against a principle (not summing, but counting rejections based on generic reasons) to justify saving the billion.  
  - **Why the error?**: Confusing "no summing of *strengths*" with "no consideration of *multiple complaints*." Scanlon avoids interpersonal aggregation but allows multiple individuals to reject a principle based on comparable individual burdens.  

  **4. Equal Harms & Taurek**  
  - **Accuracy**: Correctly notes Scanlon addresses equal harms differently.  
  - **Error**: Claims Scanlon "follows Taurek" and that "numbers do not count."  
    - **Correction**: Scanlon **explicitly rejects Taurek’s view** (*WWOTO* p. 232-234). In equal-harm cases (e.g., save 1 vs. save 5), Scanlon argues we must save the greater number. A principle permitting saving the fewer could be reasonably rejected by each of the five, as it ignores their complaint ("I could have been saved at no greater cost"). Flipping a coin is wrong because it fails to minimize rejectable losses.  
  - **Why the error?**: Misreading Scanlon’s critique of Taurek as endorsement. Scanlon uses pairwise comparison to *refute* Taurek: each of the five has an equal complaint, but a coin-flip principle allows a greater *number* of comparable complaints to be ignored.  

  **5. Overall Non-Aggregativity Claim**  
  - **Accuracy**: Correct that Scanlon avoids summing complaints.  
  - **Error**: Concludes his view "saves the greater number when harms differ" and declines when equal.  
    - **Correction**: Scanlon **saves the greater number in BOTH scenarios**:  
      - *Unequal harms*: Save the one from death over billions with headaches? **No**—a principle requiring saving the one *can* be reasonably rejected.  
      - *Equal harms*: Save one or five? **Save the five**.  
  - **Why the error?**: Misinterpreting both the headache case and the equal-harm case, leading to an inverted summary.  

  ---

  ### Key Distinction: Misunderstanding vs. Imprecise Phrasing  
  - **Harmless Imprecision**: Using "weighing interests" to describe contractualism (if clarified later).  
  - **Serious Misunderstandings**:  
    1. Thinking pairwise comparison replaces aggregation (it doesn’t; it’s a step in evaluating principles).  
    2. Believing Scanlon endorses saving the one in the headache case.  
    3. Confusing Scanlon’s rejection of Taurek with agreement.  
    4. Misstating when numbers matter (they *always* matter for equal harms, and *sometimes* for unequal).  

  ---

  ### Priority for Next Meeting  
  **Push hardest on: How contractualism handles the "billion headaches" case without aggregation.**  
  - This exposes the core confusion about rejection reasons: While no *single* headache-sufferer can reasonably reject saving the one, a principle that *always* prioritizes the larger harm (death) over any number of smaller harms *can* be rejected collectively. Each person’s complaint ("I suffer a preventable harm") is generic and identical, allowing a group to reject principles ignoring cumulative burdens—**not by summing, but by noting comparable individual complaints**.  
  - Use Scanlon’s own example: A principle requiring saving a life instead of preventing *any number* of broken arms is rejectable because it ignores the "moral significance" of broken arms when many occur (*WWOTO* p. 235).
