prompt: |-
  I'm taking a metaphysics sequence this term on material constitution, and over the winter break I did several weeks of filing in a museum's registration office. The experience has made the seminar material look strange to me, because the registration desk runs on a set of rules that nobody there would recognise as metaphysics but that seem to encode a very definite one.

  The rules, roughly as I saw them applied:

  1. Every collection object is issued an accession number on acquisition and keeps it for life. A marble sculpture that loses a hand has a new hand carved from freshly quarried stone and toned to match; the object is still catalogued under the same number, still attributed to the same artist, still exhibited as the same work.
  2. The museum was offered a cast produced from a high-resolution scan of one of its bronzes — shape-for-shape identical, visually indistinguishable. It was declined as a work, would at most be catalogued as a study copy, and would be insured at a small fraction of the original's value.
  3. When the museum buys a bronze from an authorised edition of eight, each cast is a work in its own right with its own number and catalogue entry, and a damaged cast would not be made good by substituting another cast from the same edition.
  4. When a painting is re-attributed from a master to his workshop, nothing physical changes — same canvas, same number, same shelf — but the record and the valuation change dramatically, and the staff speak as though the object had turned out to be a different thing all along.
  5. When a metal object is stolen and melted down, it is recorded as destroyed rather than altered or relocated; yet the insurance schedule for the metalwork galleries lists, as best I could tell, a weight for each object alongside its value.
  6. In the case of the gilded bronze doors of the Florence Baptistery, the originals were removed to the museum across the square and casts installed in the doorway. The museum's account is that the work moved and the building received a substitute — not that the doorway kept the work while the museum acquired the parts.

  My difficulty is that these do not look as though they issue from a single view. Rule 1 treats an artwork's matter as replaceable part by part. Rule 2 treats what makes something the artwork as a history of production that a perfect duplicate lacks. But the new hand in Rule 1 was not made by the artist either, so origin cannot be what Rule 1 tracks in every part; and Rule 6 has the work travelling with the object rather than with the history or the site, which sits oddly beside both. Rule 5 meanwhile has the institution treating one thing as both a lump of metal with a bullion figure attached and a work that no lump can be reduced to.

  So: reconstruct, as explicitly as you can, the account of what an artwork is and of the identity conditions of material objects that this bundle presupposes. Then separate what genuinely follows from that account from what merely happens to sit comfortably with it — I want to know where the practice is underdetermined, such that a four-dimensionalist, someone who thinks the statue and the lump are two coinciding objects, and a mereological essentialist could all staff the same desk and issue the same numbers. Is the bundle coherent as it stands, or is one of the rules doing double duty? And a suspicion I cannot shake: the operative criterion appears to be that an object is the work if and only if it bears the accession number, which is either circular or else not a criterion of identity at all but a bookkeeping device standing in for a real one. Which is it? Finally, what would concretely have to change — labels, insurance schedules, storage arrangements, the vocabulary of condition reports — if the museum adopted the coincidence view?

  I'm not after a survey of who holds which position; I want the reconstruction and your assessment of where it holds together.
reasoning: |-
  Okay, let me tackle this user's query. They're studying metaphysics and noticed that museum practices imply a specific metaphysical framework. The user lists six rules from their experience at a museum's registration office, pointing out apparent contradictions. They want a reconstruction of the underlying account of artwork identity, an analysis of its coherence, and how different metaphysical views could fit within these practices.

  First, I need to parse each rule to identify the implied principles. Rule 1 shows that an artwork can persist through material replacement, suggesting that identity isn't tied to original matter. Rule 2 emphasizes the importance of the original production history over physical duplication. Rule 3 treats each cast in an edition as a distinct work, so multiplicity is possible even with identical origins. Rule 4 indicates that attribution changes the identity without physical alteration, so historical context is key. Rule 5 distinguishes between the artwork and its material composition—destroyed when melted, but weight was still recorded. Rule 6 separates the work from its original location, allowing relocation without loss of identity.

  The user points out tensions, like Rule 1 allowing replacement parts while Rule 2 rejects duplicates. Also, Rule 5 treats the object as both artwork and material. The accession number seems central, raising questions about circularity. They also ask how adopting the coincidence view (statue and lump as distinct but coinciding objects) would change museum practices.

  I should reconstruct the museum's implicit metaphysics. It seems they view artworks as historical individuals: unique entities defined by origin and provenance. The accession number serves as a placeholder for this historical chain. Material is replaceable if it maintains the object's functional and historical continuity, but perfect copies lack the right origin. Each editioned cast is a distinct individual because of its unique production moment. Attribution affects identity because it changes the artwork's historical context. Destruction occurs when the object loses its historical continuity, like being melted down. Location is secondary to the object's identity.

  Now, assessing coherence. The rules form a consistent whole centered on historical individuation. The accession number isn't circular but a practical tag for this history. Tensions like Rule 1's replacement parts not being original can be resolved by distinguishing between the artwork's core identity and its material instantiation. The museum cares about the object's persistence through changes that preserve its historical narrative.

  Underdetermination: Four-dimensionalists could see the artwork as a spacetime worm, allowing parts to be replaced over time. Coincidence theorists might distinguish the artwork from its material, which aligns with Rule 5. Mereological essentialists would struggle with Rule 1, but the museum's focus on function over parts might accommodate them if replacements maintain the work's identity.

  Adopting the coincidence view would require changes. Condition reports would need dual descriptions: artwork condition vs. material state. Insurance might split into artistic and material value. Storage might separate items based on both aspects. Labels could indicate the coinciding entities. This would make the metaphysics explicit but add complexity.

  The user's deeper need is to connect theoretical metaphysics with real-world practices, understanding how implicit frameworks operate. They might also seek validation of their observation that institutional practices embody coherent, albeit unspoken, metaphysical systems. Highlighting the museum's pragmatic resolution of philosophical tensions addresses their core concern.
answer: |-
  Your museum experience brilliantly exposes the *implicit metaphysics* governing institutional art ontology – a coherent but pragmatically layered system centered on **artworks as historically individuated functional entities**. Below is a reconstruction, assessment of coherence, underdetermination, and implications of adopting coincidence theory.

  ---

  ### **The Museum's Implicit Account of Artwork Identity**
  1. **Artworks as Historical Individuals**:  
     An artwork is a unique entity individuated by its **causal origin and continuous institutional history**. It is neither purely material (contra mereological essentialism) nor purely conceptual (contra idealism).  
     - *Rule 2*: The scanned bronze duplicate lacks the *original causal history* (artist's act, institutional acquisition) – hence not the artwork.  
     - *Rule 4*: Re-attribution alters the *causal origin story* (master vs. workshop), changing the artwork’s identity despite unchanged matter.  
     - *Rule 3*: Each bronze cast is a distinct historical individual due to its unique production event within the edition.

  2. **Functional Continuity Over Material Continuity**:  
     Identity persists through material change if the object maintains its **institutional function** as the designated artwork.  
     - *Rule 1*: The sculpture retains identity because repairs preserve its *functional role* (exhibition, attribution). The new hand is subsumed into the work’s historical narrative.  
     - *Rule 6*: The doors remain "the work" because their institutional role (as curated art) moves with them; the building’s doorway loses this status.

  3. **Materiality as a *Vehicle*, Not the Essence**:  
     Matter is the *bearer* of the artwork-identity but not constitutive of it.  
     - *Rule 5*: When melted, the artwork is "destroyed" because its *functional and historical identity* is erased, even though the matter persists. The weight listing acknowledges matter’s role in valuation (e.g., gold content) without conflating it with the artwork.

  4. **The Accession Number as a Metaphysical Anchor**:  
     The number is **not circular** but a *pragmatic marker* for the artwork’s institutional history. It tracks:  
     - The object’s acquisition event (tethering it to institutional time).  
     - Its curated biography (conservation, exhibition, attribution changes).  
     *It is the institutional analog of Kripkean "rigid designation"* – a fixed reference to a historically individuated entity.

  ---

  ### **Coherence Assessment**
  - **Tension Resolved**: Rules 1 and 2 are compatible because:  
    - Rule 1 allows *gradual material replacement* that preserves functional continuity (like Theseus’ ship).  
    - Rule 2 rejects *wholesale substitution* by a duplicate, which lacks the original’s historical trajectory.  
    The new hand in Rule 1 is grafted into an existing historical entity; the scanned bronze has no such lineage.  
  - **Rule 5’s Dual Aspect**: Consistent – the artwork is destroyed when its *identity-bearing history* ends, but the *matter* retains economic value (bullion). This mirrors Locke’s distinction between nominal and real essences.  
  - **Coherence Verdict**: The bundle is **internally coherent** as a *pragmatic historical-individualism*. It prioritizes institutional narrative over strict material or spatial criteria.

  ---

  ### **Underdetermination: Where Competing Metaphysics Fit**
  1. **Four-Dimensionalism (4D)**:  
     - The artwork is a *spacetime worm*. Rule 1’s repairs are later temporal parts; Rule 6’s relocation is a worldline extending to the museum.  
     - **Compatibility**: High – the accession number tracks the worm’s entire history.

  2. **Coincidence Theory (Statue/Lump Distinction)**:  
     - The statue (artwork) and lump (matter) coincide but have different persistence conditions. Rule 5’s "destruction" applies to the *statue* when melted; the *lump* persists.  
     - **Compatibility**: Moderate – the museum’s language ("destroyed") implicitly rejects coincidence, but staff could use it to explain insurance valuations.

  3. **Mereological Essentialism**:  
     - Rejects Rule 1 (part replacement alters identity).  
     - **Compatibility**: Low – only possible if staff ignore replacements (e.g., treat repaired works as "new" entities with old numbers – violating Rule 1’s spirit).

  **Underdetermination Summary**:  
  - Rules 1, 5, and 6 are compatible with 4D or coincidence theory.  
  - Rule 4 (re-attribution) fits all if identity is historical.  
  - Rule 3 (editions) fits all if casts are distinct spacetime worms or coinciding entities.  
  - *Only mereological essentialism conflicts irreconcilably with Rule 1*.

  ---

  ### **Adopting the Coincidence View: Concrete Changes**
  If the museum explicitly endorsed coincidence theory (statue ≠ lump), practices would shift to track *two entities* per object:  

  | **Practice**          | **Current Approach**                                  | **Coincidence View Changes**                                  |
  |------------------------|-------------------------------------------------------|---------------------------------------------------------------|
  | **Condition Reports**  | Describe object holistically (e.g., "bronze corrosion"). | Dual entries: "Artwork surface: stable. Material: bronze exhibiting X corrosion." |
  | **Insurance Schedules** | Single value with optional material notes.            | Split valuation: <br>- *Artwork value* (based on provenance) <br>- *Material value* (bullion/weight) |
  | **Storage**            | Objects grouped by artist/period.                     | Additional categorization by material vulnerability (e.g., "gilded bronzes" for conservation). |
  | **Cataloguing**        | One accession number per artwork.                     | Dual IDs: Accession number (artwork) + Material ID (e.g., "L-1937-Bronze"). |
  | **Vocabulary**         | "The sculpture was damaged."                          | "The statue (artwork) is intact; the coinciding bronze lump has damage." |
  | **Rule 5 Application** | "Destroyed" for melted object.                        | "Artwork destroyed; material recycled." |

  ---

  ### **Conclusion: Institutional Metaphysics as Pragmatic Coherence**
  The museum’s rules encode a **robust, functionalist historical individualism**. The accession number is not circular but a *deictic tag* for an entity defined by:  
  - **Origin** (artist/culture, acquisition event)  
  - **Narrative continuity** (provenance, conservation, attribution)  
  - **Institutional role** (as a curated, exhibited, insured object).  

  **Where it holds together**: It resolves practical dilemmas (repairs, copies, attribution) by privileging *causal history and function* over matter or location. Rule 5’s "material weight + artwork destruction" is its most elegant harmony of dual aspects.  

  **Where it frays**: Rule 1’s acceptance of non-original parts *strains* the "origin is essential" intuition from Rule 2. Here, *functional restoration* overrides strict historical origin for *parts*, while the *whole* retains its historical identity. This is not incoherent but reveals institutional pragmatism: the work’s *continuity as an exhibit* outweighs mereological purity.  

  **Final Verdict**: The bundle is coherent under a **teleological-historical framework**. It underdetermines metaphysics in ways allowing 4D or coincidence theorists to operate the desk – but mereological essentialists would sabotage conservation. The accession number is a bookkeeping *proxy* for a real criterion (**persistence through institutional narrative**), making museum metaphysics a fascinating case of *pragmatic ontology in action*.
