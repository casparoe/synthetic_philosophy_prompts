prompt: |-
  I run a small political-theory podcast (40 minutes, no ads, roughly 900 listeners) and next week's guest is a theorist whose recent book argues we should hold binding referendums far more often than we do — not as a populist gesture but on explicitly epistemic grounds. Her core move is a Condorcet-jury-theorem one: a large electorate voting a binary question is more likely to land on the right answer than a few hundred legislators are, and she leans on that constantly. She's smart and very likeable and has a habit of answering a hard question with a charming story about some Swiss commune, which eats five minutes and walks her back to safe ground. Act as an expert on democratic theory and the epistemic-democracy literature, think carefully about where that literature genuinely presses on a view like hers, and draft me ten interview questions.

  Before the questions, give me three or four sentences sketching what you take the real pressure points to be and why — I want to see the reasoning, but keep it short. Then the questions. Ground rules: don't ask her to restate the thesis, and no "what got you interested in this?" filler. I want at least one question on each of the following. (a) Independence: if she also thinks deliberation is part of what makes referendum outcomes good, then deliberation correlates voters' errors, and correlated errors are exactly what wrecks the jury-theorem argument — I want that tension put to her directly, not as a gotcha but as a fork she has to pick a side of. (b) Competence above a half: what the argument needs is voters being better than chance at getting it right, and what happens to the whole edifice if for many referendum questions there's arguably no fact of the matter for a jury to track. (c) Framing and the "which question is actually being asked" problem — the gap between the words on the ballot and the mandate a government claims afterwards, including the case where a win gets cashed out in a much more specific form than anyone voted on. (d) Turnout and quorums: does her view commit her to thresholds, and what does an organised boycott of the vote do to the epistemic story. (e) Intensity and logrolling: a binary vote can't register how much anyone cares, and legislatures have a mechanism for trading that off which referendums structurally lack — is that mechanism corruption or is it information. (f) Re-running the question: is a second referendum on the same issue a second roll of the dice, or the epistemically better one now that voters have seen the consequences.

  For every question, write the follow-up keyed to the answer she's most likley to give — as an actual sentence I can say out loud, not a description of one — and add a single line saying which questions you expect her to pivot away from and roughly what the pivot will sound like. Sequence them so the early ones are ones she can handle well and the heat builds through the middle. End on one question about what observation or empirical result would count against her view, phrased so a generality won't get her off the hook. Keep it usable: i have to read these off a piece of paper in a room with bad acoustics, so short sentences, and no jargon that the audience would need her to translate.
reasoning: |-
  Okay, the user runs a small political theory podcast and needs help crafting interview questions for a guest who advocates for more frequent binding referendums based on epistemic grounds, particularly using the Condorcet Jury Theorem. Let me start by understanding the core of her argument. She argues that a large electorate is more likely to reach the correct decision on binary questions compared to a small group of legislators. The user wants questions that challenge her view without being confrontational, focusing on specific pressure points in the literature.

  First, I need to identify the key pressure points. The Condorcet Jury Theorem relies on voters being independent and having competence above 0.5. But real-world factors like deliberation can correlate errors, breaking independence. Also, many issues might not have a clear "correct" answer, making competence hard to measure. Other issues include framing effects, turnout, intensity of preferences, and re-running referendums. The user specifically mentioned these areas (a to f), so each question must address one of them.

  For question (a) on independence, the tension is between deliberation and correlated errors. If she values deliberation, how does she reconcile that with the theorem's need for independence? The follow-up needs to press if she leans towards independence or accepts lower epistemic gains from deliberation.

  For (b) on competence above 0.5, the issue is when there's no fact of the matter. Follow-up should challenge her to name issues where competence might be below 0.5, forcing her to admit limits or defend universal applicability.

  Framing (c) is about the gap between ballot wording and implementation. The follow-up should ask how to prevent governments from overstepping the mandate, testing her practical solutions.

  Turnout (d) addresses boycotts skewing results. Follow-up questions whether she’d enforce participation to maintain epistemic integrity, which could be controversial.

  Intensity (e) questions how referendums handle differing stakes versus logrolling in legislatures. Follow-up needs to contrast epistemic gains with potential injustice, pushing her to weigh trade-offs.

  Re-running referendums (f) explores whether repeated votes improve accuracy or undermine legitimacy. Follow-up asks how soon to re-run, challenging her stance on voter learning versus instability.

  Ending with what evidence would counter her view prevents evasion. Need a concrete example, like low-competence issues or failed referendums, to pin her down.

  Also, anticipating her pivots is crucial. She might dodge independence by emphasizing deliberation's benefits, so follow-up must bring back to the theorem's requirements. For competence, she might pivot to education, so follow-up presses on inherent vagueness.

  Sequencing questions to start safe, like framing, then build to tougher ones like independence and competence. Ending with evidence against her theory ensures a strong close.

  User’s practical needs: concise, jargon-free questions for reading aloud. Avoid restating thesis, no filler. Follow-ups must be direct sentences. Ensure clarity for the audience without needing explanations.
answer: |-
  Here are the core pressure points: The Condorcet theorem needs voter independence and competence >0.5. Deliberation often correlates judgments, undermining independence. Many complex policy questions lack clear "right answers," making competence assumptions dubious. Binary votes also erase intensity and trade-offs inherent to governance, risking instability or ignoring minority stakes when referendums are rerun or mandates stretched.

  **Interview Questions & Follow-Ups:**

  1.  **Question (c - Framing):** Your book argues referendums tap collective wisdom, but the specific wording on the ballot *frames* the choice. How do we ensure the government's implementation – especially if it's more specific or far-reaching than the ballot question implied – genuinely reflects the "right answer" voters supposedly chose?
      *   *Likely Answer:* She'll emphasize clear question drafting, independent commissions, and voter education.
      *   **Follow-Up:** "But when a government cites a referendum win to justify policies beyond the ballot's literal wording, is that still epistemically valid, or does it stretch the mandate beyond what the 'jury' actually decided?"
      *   *Pivot Risk:* Low for this opener. She'll engage directly.

  2.  **Question (d - Turnout/Quorums):** If the epistemic power comes from large numbers, does your view require high turnout? What happens to the "jury theorem" logic if, say, 40% of voters boycott a referendum they see as illegitimate?
      *   *Likely Answer:* She'll suggest turnout is usually sufficient, or that boycotts are rare and self-defeating. May downplay the need for strict quorums.
      *   **Follow-Up:** "So, if a passionate minority boycotts, leaving only the majority faction voting, doesn't that *guarantee* the majority wins, even if the boycotters might have been crucial for epistemic accuracy? Doesn't that break the theorem's core assumption?"
      *   *Pivot Risk:* Low/Medium. Might pivot to deliberation reducing boycott likelihood.

  3.  **Question (e - Intensity/Logrolling):** Legislatures can trade votes – "I'll support your dam if you support my school" – reflecting how intensely different groups care. A binary referendum can't capture that intensity. Is this vote-trading just corrupt horse-trading, or is it actually aggregating important information that a simple yes/no vote loses?
      *   *Likely Answer:* She'll argue trading often reflects elite deals ignoring the common good, and referendums force direct accountability on the core issue.
      *   **Follow-Up:** "But doesn't losing that intensity information risk the referendum outcome being profoundly unjust to a minority that cares *deeply*, even if it's epistemically 'correct' in a narrow sense? Is that a necessary trade-off for epistemic gain?"
      *   *Pivot Risk:* Medium. Might pivot to deliberation expressing intensity or framing this as democracy's cost.

  4.  **Question (f - Re-running):** If a referendum passes but has negative consequences, proponents often argue for a "confirmatory" vote. Is this second vote epistemically *better* because voters learn from experience, or does it undermine the initial epistemic claim by suggesting the first vote wasn't actually tracking the truth?
      *   *Likely Answer:* She'll lean towards it being epistemically better ("learning from consequences"), seeing it as part of an ongoing process.
      *   **Follow-Up:** "Doesn't frequent re-running risk creating policy instability? And if the first vote *was* epistemically sound based on the information then, why should changed circumstances (or consequences) automatically invalidate it for epistemic reasons?"
      *   *Pivot Risk:* Low. She'll engage but emphasize context.

  5.  **Question (a - Independence):** You value deliberation before referendums. But the Condorcet theorem relies on voters' judgments being *independent*. Doesn't widespread deliberation – sharing arguments, being persuaded – actually *correlate* voters' errors, which seriously weakens or even breaks the theorem's guarantee of correctness?
      *   *Likely Answer:* She'll argue *good* deliberation reduces individual error rates more than it correlates them, making the net epistemic effect positive (a common response).
      *   **Follow-Up:** "But the theorem's mathematical guarantee *requires* independence. If you accept deliberation correlates errors, even while lowering them, doesn't that mean we lose the theorem's certainty and have to rely on a much weaker, empirically untested claim about net epistemic gain?"
      *   *Pivot Risk:* **HIGH.** Expect pivot to "deliberation improves competence" or Swiss commune story. Follow-up forces the fork.

  6.  **Question (b - Competence >0.5 / No Fact):** The Jury Theorem assumes a "correct" answer exists and voters are slightly better than random at finding it. How does your argument hold when the referendum question is deeply value-laden (e.g., "Is the sacredness of life more important than bodily autonomy?") or involves complex future predictions where arguably *no* clear fact of the matter exists *before* the choice is made?
      *   *Likely Answer:* She'll argue most policy questions *do* have better/worse answers trackable via evidence/reason, or frame values in terms of societal well-being.
      *   **Follow-Up:** "Can you name a common referendum topic where you think the average voter *isn't* likely to be more competent than a coin flip? If not, how can we test this core assumption for issues like constitutional identity or long-term environmental trade-offs?"
      *   *Pivot Risk:* **HIGH.** Expect pivot to "voters are competent on means if not ends" or emphasizing simplicity/education. Follow-up demands specificity.

  7.  **Question (Epistemic Test):** What specific, observable real-world outcome would genuinely count as evidence *against* the epistemic power of frequent referendums in your framework? (For example, consistent policy outcomes deemed worse by experts, or referendum results fluctuating wildly with minor campaign changes).
      *   *Likely Answer:* She might cite poorly designed referendums, lack of deliberation, or corruption as confounding factors, not refutations.
      *   **Follow-Up:** "Setting aside implementation flaws, if we saw *well-run* referendums repeatedly producing decisions that independent experts widely agreed were harmful based on the best evidence, would that challenge the core epistemic claim for *those* types of questions?"
      *   *Pivot Risk:* Medium. She'll try to define "experts" or "harm," but the follow-up pins down the core challenge.

  **Sequence Rationale:** Starts with concrete operational issues (Framing, Turnout) she can handle confidently. Builds to challenges about lost information (Intensity, Re-running). Places the two most theoretically damaging critiques (Independence, Competence) back-to-back near the climax, forcing direct engagement. Ends with the empirical test, preventing evasion and grounding the debate. Follow-ups are concise, jargon-free, and directly challenge potential pivots or weaknesses in likely answers.
