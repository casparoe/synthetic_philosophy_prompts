  Hmm, the user is on a governance committee for a regional health cooperative with 40,000 members. They're dealing with a proposal to use a prediction market to help make administrative decisions. The proposal involves the board voting on a health measure to maximize and some constraints, then a prediction market predicts which option would best improve that measure, and the top option gets adopted.

  There was an objection that the market might recommend harmful actions like closing a rural clinic if it boosts the aggregate health measure. The proposer countered with Robin Hanson's futarchy slogan: "vote on values, but bet on beliefs." This seemed to satisfy everyone at the meeting, but then another member used the same slogan differently to argue that indifferent participants couldn't distort the market since values only come from voting. Now the user is confused and wants clarity for the next meeting.

  I need to provide a clear breakdown of what this slogan actually means. The key is to distinguish between multiple interpretations of "vote on values, but bet on beliefs." The user wants numbered, distinct theses—not just rewordings of the same idea—with each one analyzed for truth, conditions for truth, and which objections it addresses.

  For each thesis, I'll define what counts as values, what the vote settles, what the bet is about, and how it resolves. Then I'll categorize each as platitude (obviously true), substantive (defensible but debatable), or false. I need to show which objections each thesis addresses: the first about unwanted trade-offs, the second about market distortion.

  After that, I should point out where the slogan might slide between meanings in a single utterance. I'll speculate what the room probably heard and whether proponents could endorse that. I also need to highlight where the values/beliefs distinction breaks down—like when setting the measure involves prediction, or when constraints are defended predictively.

  Finally, the user wants a repaired slogan that would actually answer the first objection, or an admission that it can't be fixed. I should be honest here; the slogan alone might not resolve the core issue about trade-offs.

  Structuring this carefully: first, the numbered menu of theses, then the sliding meanings, likely interpretation, and distinction failures. For the repair, I'll suggest something that explicitly separates trade-off decisions from predictive ones, though it may still have limitations.

  The user is preparing for a meeting, so I'll keep it practical and jargon-free. They don't need citations, just clear, actionable insights.
answer: |-
  Here is a disambiguation of Robin Hanson's futarchy slogan "Vote on values, but bet on beliefs" in the context of your health cooperative's proposal, structured as requested:

  ### Numbered Menu of Precise Theses

  1.  **Thesis: The vote solely determines the single, measurable objective (e.g., "maximize average lifespan") and any explicit, non-tradeable constraints (e.g., "no clinic closures"). The prediction market solely predicts which administrative option will achieve the highest score *according to that specific objective*, within the constraints.**
      *   **Pinned Down:**
          *   **Values:** Defined narrowly as *choosing the single goal metric* (the "value" to maximize) and *specifying absolute prohibitions* (side-constraints). These are treated as normative choices immune to predictive argument within the mechanism.
          *   **Vote Settles:** The exact definition of the health measure (e.g., QALYs gained, average lifespan) and the list of forbidden actions (e.g., "cannot close Clinic X", "must maintain Y% rural access").
          *   **Bet On:** A purely predictive question: "Which administrative option (A, B, C) is expected to produce the highest numerical value for the chosen metric Z, *given* that none of the forbidden actions in the constraints will occur?"
          *   **Resolution:** The market price reflects the aggregated probability estimate of option A/B/C yielding the highest Z. The highest-priced option wins.
      *   **Truth Status:** **Substantive and defensible thesis**. It's the core design claim of the proposed futarchy mechanism.
      *   **Conditions for Truth:** This thesis holds true *if and only if* the mechanism operates precisely this way: the vote *only* sets Z and the constraints, and the market *only* predicts outcomes under Z within those constraints. Success requires Z is measurable and constraints are verifiably enforceable.
      *   **Answers Objections:**
          *   **First Objection (Closing Rural Clinic):** **Partially Answers.** If "cannot close rural clinics" is explicitly voted on as a *constraint*, the market cannot recommend it. If it *isn't* voted as a constraint, the market *will* recommend it if it maximizes Z, and the slogan asserts this is correct *because* closing it is a "value" choice the board failed to prohibit. The slogan clarifies the mechanism but doesn't inherently prevent the outcome; it shifts responsibility for preventing it to the vote on constraints. *The objector's point about "goods not for trade-off" is addressed by saying those goods belong in the constraints voted on.*
          *   **Second Objection (Indifferent Participants):** **Answers.** Values (the goal Z and constraints) are set *only* by the vote. Indifferent participants betting in the market only influence the prediction of outcomes under Z/constraints; they don't get to change Z or the constraints. Their presence only distorts the market if they bet *irrationally* relative to predicting Z.

  2.  **Thesis: The vote expresses the collective "utility function" (what is ultimately valued). The prediction market solely predicts which option will maximize that utility.**
      *   **Pinned Down:**
          *   **Values:** Defined broadly as the complete, potentially complex, and unobservable welfare function of the membership (e.g., encompassing equity, access, specific health outcomes beyond a single metric, preferences over trade-offs).
          *   **Vote Settles:** A *proxy* for the utility function - specifically, the chosen single metric Z and constraints are *interpreted as* the operational definition of utility for the purpose of this decision.
          *   **Bet On:** Purely predictive question: "Which administrative option (A, B, C) is expected to maximize the *actual, underlying utility* of the members, *as approximated by* achieving the highest score on metric Z within the constraints?"
          *   **Resolution:** Market price reflects belief about which option maximizes *utility-as-defined-by-Z-and-constraints*.
      *   **Truth Status:** **False** in the context of the proposed mechanism (though potentially a *defensible goal* of futarchy proponents). The vote *doesn't* capture the full utility function; it sets a specific, narrow operationalization (Z & constraints). The market bets only on Z, not on the underlying utility.
      *   **Conditions for Truth:** This would only be true if Z and the constraints were a perfect and complete representation of the membership's utility function, which is practically impossible for complex societal goods like health equity and access. The mechanism doesn't attempt this; it uses Z/constraints as the definition.
      *   **Answers Objections:**
          *   **First Objection:** **Does Not Answer.** This thesis *assumes* that maximizing Z *is* maximizing utility. The objector claims that closing the rural clinic *doesn't* maximize true utility, even if it maximizes Z. This thesis dismisses that claim by definition.
          *   **Second Objection:** **Answers.** Same as Thesis 1: Indifferent participants only affect prediction, not the definition of utility (Z/constraints).

  3.  **Thesis: The vote determines the *question* the prediction market must answer (e.g., "Which option maximizes metric Z?"). The prediction market solely answers that specific factual question.**
      *   **Pinned Down:**
          *   **Values:** Defined procedurally as *what question to ask* the market.
          *   **Vote Settles:** The precise predictive question posed to the market (e.g., "Which option yields the highest value for metric Z in year T?").
          *   **Bet On:** The answer to the specific factual question defined by the vote.
          *   **Resolution:** Market prices resolve the voted-upon question.
      *   **Truth Status:** **Platitude.** This is a description of how the mechanism functions: the board votes on the resolution the market will estimate. No reasonable person would deny this is *what happens* procedurally.
      *   **Conditions for Truth:** Always true by the mechanism's design.
      *   **Answers Objections:**
          *   **First Objection:** **Does Not Answer.** This merely states *that* the market answers the voted question. It doesn't address *whether* the question ("maximize Z") appropriately incorporates values like rural access, or whether answering it factually leads to unacceptable trade-offs. The objector's concern remains untouched.
          *   **Second Objection:** **Answers.** Indifferent participants betting only affect the factual answer to the specific question set by the vote; they don't change the question itself.

  ### Analysis of the Utterance & Distinction

  1.  **Sliding Between Readings:** A single utterance of "vote on values, bet on beliefs" most commonly slides between **Thesis 1 (core mechanism)** and **Thesis 3 (procedural platitude)**, sometimes with aspirational hints of **Thesis 2 (utility maximization)**. Proponents often *intend* Thesis 1, but evoke Thesis 2 rhetorically. Listeners often hear Thesis 3 or a vague blend of 1 and 2.
  2.  **Likely Room Hearing:** The room most likely heard a blend emphasizing **Thesis 3 (procedural platitude - vote sets the question, market answers it)** with an implication of **Thesis 1 (values/goal set by vote, beliefs/prediction set by market)**. They took this as disposing of the first objection because they implicitly assumed the *vote* would include constraints preventing the rural clinic closure (Thesis 1), or that the procedural separation itself solved the confusion (Thesis 3).
  3.  **Proponent Consistency:** Proponents could consistently endorse **Thesis 1** as the accurate description of the mechanism. They might *aspire* to **Thesis 2** but acknowledge Z is a proxy. **Thesis 3** is trivially true. Using Thesis 2 rhetorically while implementing Thesis 1 is common but potentially misleading.
  4.  **Where the Distinction Fails:**
      *   **Fixing the Measure is Predictive:** Choosing *which measure* (lifespan vs. QALYs vs. patient satisfaction) best captures "health" or "value" involves predictive beliefs about what constitutes good health, how different outcomes trade off, and how well the measure correlates with true welfare. This isn't a pure "value" choice separable from beliefs.
      *   **Defending Constraints Predictively:** Arguments *for* including a constraint (e.g., "Don't close rural clinics") often rely *heavily* on predictive beliefs: "Closing it *will* cause severe hardship," "It *will* lead to worse outcomes for group X," "The negative impact *won't* be offset by gains elsewhere." The "value" that rural access is non-tradeable is frequently *supported* by beliefs about the magnitude of the negative consequences. Separating the normative "thou shalt not" from the predictive "because if you do, Y will happen" is often artificial.
      *   **Defining Constraints Operationally:** Vague constraints ("ensure equitable access") require interpretation and operationalization, which involves predictive judgments about what policies actually achieve that goal.

  ### Repaired Slogan for the First Objection

  No simple slogan perfectly answers the first objection. The objection highlights an inherent limitation of *any* mechanism that aggregates welfare into a single metric (even with constraints). However, a slogan emphasizing the *responsibility* shifted to the vote, and the *type* of decision it handles, comes closer:

  **"Vote on the goal and the rules; bet on which move scores highest within them."**

  *   **Why it's better:** It explicitly names the outputs of the vote ("goal", "rules") and frames the market's task as finding the best "move" under those fixed rules to score on the fixed goal. It directly counters the "confusion" claim by clarifying that preventing the rural clinic closure is a matter of setting the "rules" (constraints) during the vote. It doesn't make the false promise of Thesis 2 (capturing all value) and avoids the procedural vagueness of Thesis 3.
  *   **Limitation:** It still doesn't guarantee the board *will* vote for the "right" constraints or that the chosen metric captures all important values. The fundamental challenge of defining the goal and rules remains. The slogan clarifies where that responsibility lies within the mechanism.

  **Key Takeaway for the Meeting:** The slogan primarily clarifies the *division of labor* within the specific futarchy mechanism (Thesis 1/3). It does *not* magically resolve the hard normative question of *what* constraints should be imposed or *what* metric truly captures member welfare. The first objector was right that the mechanism *can* recommend closing the rural clinic **if** the board fails to vote for a constraint prohibiting it. The slogan's function is to say: "Preventing that outcome is the *vote's* job (setting values/constraints/rules), not the market's job (predicting outcomes under those rules)." The second objector was correct about indifferent participants.
