answer: |-
  Here is the engineered test case meeting all specifications:

  **Scenario:** The low-lying island nation of Atollia faces imminent, catastrophic inundation due to accelerating sea-level rise primarily driven by the cumulative historical greenhouse gas emissions of Industria, a wealthy industrialized state. Industria has consistently been among the top three global emitters since pre-industrial times and actively lobbied against international climate mitigation efforts for decades. The entire population of Atollia (120,000 people) must evacuate permanently. They face drowning and the total destruction of their homeland – a severe harm resulting from systemic, unplanned atmospheric changes, not persecution or targeting by any agent. Industria, acknowledging its significant causal contribution, refuses to admit the Atollians. Instead, it offers the geographically proximate and lower-middle-income state of Uplandia a substantial, legally binding payment package: full resettlement costs, generous per-refugee development aid, and robust international monitoring guarantees. Uplandia, possessing ample arable land and seeking development funds, accepts. The agreement ensures Atollians receive citizenship, housing, livelihoods, and cultural preservation support in Uplandia, verified by neutral NGOs. Industria would far prefer paying this (costing 0.5% of its GDP) over admitting the refugees itself.

  **Verdicts on "May Industria pay instead of admit?"**

  1.  **Freedom-of-Association Account (State Autonomy / Moderate Exclusion Right):** **Yes, payment is permissible.** Industria's core obligation is to avoid leaving individuals in desperate need. The payment to Uplandia demonstrably fulfills this obligation by securing safe refuge and adequate provision for the Atollians. Industria is not obligated to associate with, or integrate, these specific individuals into its own society when their basic needs are met elsewhere through its financial contribution. Its right to self-determination includes choosing *how* it discharges its minimal humanitarian duty, provided the outcome is genuinely adequate.

  2.  **Responsibility-Sensitive Account (Causal Responsibility Creates Special Duties):** **No, payment is impermissible.** Industria's significant causal role in creating the harm that displaced the Atollians generates a special duty of repair that goes beyond merely ensuring basic needs are met *somewhere*. This duty includes accepting a disproportionate share of the *burden of refuge*, which necessitates offering admission and integration, not just outsourcing the solution financially. Paying Uplandia shifts the physical and social burdens onto a less responsible state and severs the direct connection between the harm-doer and the victims that acknowledgment and repair require. Payment evades the full moral cost Industria owes.

  3.  **Cosmopolitan Account (Borders Have No Intrinsic Moral Weight):** **No, payment is likely impermissible.** Borders are morally arbitrary. The primary concern is the well-being and rights of individuals (the Atollians) and global justice. While the Uplandia solution provides safety, Industria's immense wealth and direct causal responsibility make it the *most* capable and *most* obligated agent to provide not just safety, but also the highest feasible level of opportunity, continuity, and well-being. Admitting the Atollians into Industria's affluent society likely offers significantly better long-term prospects (economic, educational, cultural stability) than resettlement in Uplandia, even with aid. Choosing payment prioritizes Industria's parochial preferences over the best available outcome for the displaced, violating cosmopolitan equality principles. Payment might only be permissible if Uplandia's offer demonstrably provided *equal or better* prospects than admission to Industria – which is unlikely given the wealth disparity.

  4.  **Persecution Criterion (Moral Test of Targeted Harm):** **Payment is permissible (but the criterion doesn't strongly compel admission).** The persecution criterion, applied morally, focuses on whether individuals are fleeing harms inflicted *because of* their identity, beliefs, or actions – that is, targeted persecution. The Atollians are fleeing an existential environmental catastrophe caused by diffuse, systemic factors; no one is *singling them out* for harm. Therefore, under this specific criterion, they do not have a special moral claim *based on persecution* that would *override* Industria's presumptive right to exclude. The primary moral question shifts to meeting basic needs and addressing harm causation, which the Uplandia payment adequately handles regarding the persecution criterion's specific concern. The criterion doesn't generate a strong reason *for* admission here.

  **The Critical Feature & Analysis:**

  *   **Feature Doing the Work:** **Industria's direct, material, and demonstrable causal responsibility for the specific harm causing the displacement.** This creates the tension between the state's desire to exclude and the claim that responsibility generates a duty to admit.
  *   **Case Without Causal Responsibility:** If Industria were *not* causally responsible (e.g., if Atollia's inundation was solely due to natural geological shifts), the case collapses into a standard scenario of **generalized distress migration**. Industria's offer of fully-funded, adequate refuge in Uplandia would satisfy most moderate accounts of humanitarian duty (like the Freedom-of-Association view) and the persecution criterion. Only a strong cosmopolitan might still demand admission purely based on capacity/global equality, but even that demand would be significantly weaker without the responsibility link. The responsibility-sensitive account would lose its primary objection.
  *   **Defender of Exclusion's Attack:** A defender of a strong right to exclude would attack the scenario on several grounds:
      1.  **Diffusion of Responsibility:** They would argue Industria's causal contribution, while significant, is diffuse and shared with countless other emitters and global systems. Pinpointing *this specific state* as owing *this specific group* admission stretches causality beyond reasonable moral or practical limits. ("Why Industria and not all high-emission states? Why Atollians and not all climate migrants?")
      2.  **Adequacy of Payment as Discharge:** They would strenuously argue that the payment *does* fully discharge Industria's responsibility. By ensuring safety, adequate provision, citizenship, and monitored well-being in Uplandia, Industria has remedied the harm it caused. Demanding admission conflates remedy with an unwarranted penalty or an overly demanding form of reparation.
      3.  **Sovereignty & Preference:** They would emphasize Industria's sovereign right to determine its membership and prioritize the preferences and social cohesion of its existing citizens. Outsourcing refuge via payment respects Uplandia's sovereignty (its choice to accept) while allowing Industria to avoid the significant societal impacts of large-scale integration, which it has a right to do if basic needs are met elsewhere.
      4.  **Practical Precedent/Slippery Slope:** They would warn that accepting this responsibility-admission link creates an unworkable precedent, opening the door for vast, unpredictable claims against states for broad systemic harms (economic policies, historical actions, resource consumption) leading to displacement, overwhelming their capacity to control borders.
