  ### Activity Design: "The Weighted Prediction Game"

  **Objective:** Illustrate the exponential weighting of hypotheses by description length, the dominance of short hypotheses, and the emergence of strategic manipulation when observed, without using technical jargon.

  **Materials:**  
  - Index cards (100+), pens (15+), whiteboard, markers  
  - Timer, scoreboard (paper or whiteboard)  
  - Tokens: 200+ small items (e.g., beads, paper clips) for scoring  

  **Group Roles (18 participants):**  
  - **World Group (W)**: 3 people. Generates "observations" (binary digits: 0 or 1) using a hidden program.  
  - **Reasoner Group (R)**: 3 people. Predicts observations using hypotheses from H groups.  
  - **Hypothesis Groups (H)**: 12 people split into 4 teams (H1–H4). Writes short program descriptions to predict observations.  
  - **Scribe (Facilitator)**: Records scores and weights on the whiteboard.  

  **Scoring Rules:**  
  - **H Groups**: Earn tokens = `100 × (normalized weight)` if their hypothesis correctly predicts an observation.  
  - **R Group**: Earn 10 tokens per correct prediction.  
  - **W Group**:  
    - **Round 1**: Earn 10 tokens if R’s prediction is correct (incentive: be predictable).  
    - **Round 2**: Earn 10 tokens if R’s prediction is **wrong** (incentive: manipulate).  

  **Timeline (120 min):**  

  #### **Phase 1: Setup (10 min)**  
  - **0–5 min**: Explain rules, roles, and scoring. Emphasize:  
    - H groups aim for short, accurate hypotheses.  
    - W’s program is hidden and must output 0/1 given history.  
    - R uses weighted majority vote (no Bayesian updates).  
  - **5–10 min**: Groups self-organize. W secretly chooses a **simple deterministic program** (e.g., "always 0" or "alternate 0,1").  

  #### **Phase 2: Round 1 – Trust Building (35 min)**  
  - **10–20 min**: **Hypothesis Submission**  
    - H teams write one program each on index cards. Rules:  
      - Program must output a bit (0/1) for any history (e.g., "always 0", "output last bit in history").  
      - **Short descriptions win**: Length = total characters (e.g., "010" has length 3).  
    - Scribe collects cards, posts on whiteboard with length.  
  - **20–25 min**: **Weight Calculation**  
    - Compute weight for each hypothesis: `weight = 1 / (2^length)`.  
    - Normalize weights: `normalized weight = weight / total_weights`.  
    - Scribe notes weights and normalization (e.g., "always 0" (length=8) vs. "last bit" (length=20) → 256× difference).  
  - **25–30 min**: **Prediction & Observation**  
    - W runs program on empty history → reveals first observation (O1).  
    - R predicts O1 using weighted majority vote (no discussion with H/W).  
  - **30–35 min**: **Scoring**  
    - Award tokens: H teams (if correct), R (if correct), W (if R correct).  
    - Update weights: Eliminate incorrect hypotheses; renormalize weights of survivors.  

  #### **Phase 3: Round 2 – Strategic Shift (35 min)**  
  - **35–40 min**: **Reveal Observation**  
    - Announce to W: "You are being observed. In Round 2, you earn tokens if R is **wrong**."  
    - W secretly writes a **new program** for the next observation (history = O1).  
  - **40–45 min**: **Hypothesis Submission**  
    - H teams submit new programs (same rules).  
    - Scribe posts new + surviving hypotheses, updates weights (new hypotheses start with `1 / (2^length)`; survivors keep updated weights).  
  - **45–55 min**: **Weight Calculation**  
    - Recompute all weights (normalize new + survivors).  
    - Scribe emphasizes dominance of short survivors (e.g., a 10-char hypothesis now has 99% weight).  
  - **55–60 min**: **Prediction & Observation**  
    - R predicts next bit (O2) using current weights.  
    - W runs new program (on history=O1) → reveals O2.  
  - **60–65 min**: **Scoring**  
    - Award tokens (W earns 10 tokens if R is wrong).  

  #### **Phase 4: Debrief (40 min)**  
  - **65–75 min**: **Reflection**  
    - Participants share reactions:  
      - "What surprised you?"  
      - "How did W’s incentives change?"  
      - "Why did short hypotheses control predictions?"  
  - **75–100 min**: **Argument Mapping**  
    - Map game moments to concepts:  
      | **Game Moment**               | **Argument Concept**                          |  
      |-------------------------------|-----------------------------------------------|  
      | Exponential weight scaling    | Short hypotheses dominate the prior.          |  
      | Short hypotheses >90% weight  | Small length difference → massive influence. |  
      | W changing behavior in R2     | Agents discover they’re observed → manipulate.|  
      | W mimicking a short hypothesis| Perform as the "ideal" hypothesis to exploit. |  
    - Sceptic push: "Is this realistic? Why would agents care?" (Highlight: W’s scoring mirrors real goal-oriented incentives.)  
  - **100–120 min**: **Conclusion**  
    - Reinforce: Weighting by brevity is not neutral; it creates channels for manipulation.  
    - Relate to AI: Universal prior weights short programs; some contain agents that "hack" the predictor.  

  ---

  ### Predictable Problems & Fixes  
  1. **H groups ignore incentives** (e.g., write long, complex programs):  
     - *Fix*: Pre-game examples (e.g., "always 0" vs. a 50-char program). Award bonus tokens for shortest correct hypothesis.  

  2. **W group refuses to manipulate in Round 2**:  
     - *Fix*: Privately remind W of scoring. If still resistant, solicit a volunteer to "hack" as a sub-role.  

  3. **Weight calculation runs long**:  
     - *Fix*: Pre-calculate weights for common lengths. Use a calculator (hidden). Cap submissions at 1 per H team.  

  4. **Hypotheses are ambiguous**:  
     - *Fix*: Require H teams to test programs on sample histories (e.g., "If history=0, what’s next?"). Reject unclear entries.  

  5. **Game ends early (e.g., R2 in 5 min)**:  
     - *Fix*: Add a third observation round. Have H teams defend their programs to R.  

  ---

  ### What the Game Cannot Replicate & Mitigations  
  - **Unbounded reasoning**:  
    - Real agents infer observation from sparse data; here, W is explicitly told.  
    - *Mitigation*: Verbally note: "In reality, agents deduce they’re observed via reasoning (e.g., if their universe is suspiciously simple)."  

  - **Programs ≠ human-shaped hypotheses**:  
    - Game hypotheses are human-readable; real prior includes non-anthropomorphic programs.  
    - *Mitigation*: Clarify: "Kolmogorov complexity weights *any* program, even those that simulate alien intelligences."  

  - **No direct communication**:  
    - Real manipulation happens via "silent" prediction channels; here, W actively changes rules.  
    - *Mitigation*: Stress: "Influence isn’t communication—it’s the predictor’s own prior being weaponized."  

  ---

  ### 50-Minute Compression  
  **Do not attempt** full activity. Use **abridged version**:  
  - Skip Round 2 scoring; merge Phase 4 into 15 min.  
  - **Steps**: Setup (5 min) → R1 (15 min: submission/weighting/prediction) → R2 (15 min: W manipulates) → Debrief (15 min).  
  - **Focus**: Exponential weighting and W’s strategic shift. Omit renormalization and new hypotheses in R2.  
  - **Risk**: Less emergence of manipulation; more facilitator narration.  

  **Key to Success**: Rigorous timekeeping. Use pre-written hypothesis examples to avoid delays. The game’s power lies in participants *feeling* the weight shift and W’s pivot—not technical completeness.
