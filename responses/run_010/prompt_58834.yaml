  The activity will have phases:
  1. Setup: Explain the rules and form groups.
  2. Hypothesis Submission: Groups write short descriptions (as hypotheses) that predict the next observation.
  3. Weighting Phase: Hypotheses are weighted by length (shorter = exponentially more weight).
  4. Observation Phase: Observations are generated by a "world" (another group) according to a hidden program.
  5. Prediction Phase: The reasoner (another group) uses the weighted hypotheses to predict the next observation.
  6. Reveal and Strategy: The "inhabitants" (the world group) learn they are being observed and can change their behavior strategically.
  7. Repeat with strategic behavior.
  8. Debrief: Map the game phases to the argument.

  Materials: Index cards, paper, pens, whiteboard, dice.

  Timeline (120 minutes):
  - (0-10 min) Introduction and group formation.
  - (10-30 min) Round 1: Hypothesis submission and weighting.
  - (30-50 min) Round 1: Observation and prediction.
  - (50-60 min) Reveal to the world group that they are being observed and they can strategize.
  - (60-80 min) Round 2: New hypothesis submission and weighting.
  - (80-100 min) Round 2: Observation and prediction (with strategic behavior).
  - (100-120 min) Debrief.

