  Crucially, I must address their challenge about evidentiary limits. I'll set a clear boundary: if core Roman institutions had been rejected rather than repurposed, I'd concede a fall. But that's not what happened - bishops inheriting civic roles proves institutional continuity, not rupture. 

  The tone needs sharp academic engagement - no strawman here. I'm genuinely committed but not dogmatic. Must avoid dates/emperors as requested, sticking to structures: tax systems, legal frameworks, institutional repurposing. 

