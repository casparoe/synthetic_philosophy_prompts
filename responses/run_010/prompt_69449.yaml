prompt: |-
  ok so i'm a junior and i co-run this lunchtime club at my school, unofficially called "arguments and pizza" (the pizza part is load bearing, not kidding). we get 15-20 people, mostly sophomores and juniors, but realistically a third of them are there for the food and would rather be scrolling. we get 40 minutes in a regular classroom with a whiteboard. the projector bulb has been dead since september and nobody has filed the form to fix it, so assume no screen and no video. phones are supposed to go in the caddy by the door and about half of them do. i can print maybe 30 pages total and i have a stack of index cards and sharpies.

  the situation: in two weeks our student council votes on whether to kill the freshman side-door rule. at my school freshmen are not allowed to use the main staircase or sit on the stone steps out front — they come in the gym-side door and eat in the little cafeteria off it. everybody says it's because a kid fell down those stairs in the 80s and it's basically a memorial thing. our advisor actually dug through old handbooks and found the rule already in there in the 60s, and no record of any accident. but also: the little cafeteria is where the ESL teacher runs her lunch tutoring table, and the only reason it has any students at all is that freshmen are guaranteed to be in that room every day. abolish the rule and the tutoring table probably quietly dies and nobody would connect the two for a year.

  two more like it, if you need them. the bell rings four minutes early on wednesdays, which everyone says is because we used to share buses with the tech school across town — true, except that route ended years ago, and nothing depends on the four minutes anymore. and then there's the summer research program nominations, where the council president and the two debate captains automatically take three of the five slots; the stated reason is that they're the most committed students, the real history is that it started as a way to hand slots to alumni families and the merit story got stapled on later, and it still does exactly that job today.

  my half-formed idea is to run the session on those three but disguised — hand them out as traditions belonging to some made-up school two states over, let the club judge them cold, and at some point reveal the mirror. problems i can already see: some kid will recognize their own school in minute three, the reveal might land as a gotcha, and if it works too well my club looks like its running a covert campaign for the council vote, which i promised my advisor we arent. my co-president is on the council and she's voting to abolish, and honestly i lean her way — i do not want the session to end up as "so we should keep it."

  what i want from you is the actual plan for the 40 minutes, not an essay about the ideas. specifically:

  - which of the three carries the activity, and whether to use all of them or add a fourth as a decoy (and if so, what kind — i'm out of ideas)
  - what the kids actually *do*. my instinct is they have to commit to keep-or-abolish before they're given anything, and then information arrives in stages — but i don't want the stages to just be me reading cards at them. one thing i keep coming back to: each group gets a limited number of questions they can "ask" (index cards, whatever), and some of the questions have no answer because the answer is genuinely gone. make that mechanic work, with a cost, so they feel that they have to choose what to investigate and that they might run out before they know enough
  - rules, roles, materials, and a minute-by-minute timeline that includes them eating
  - the debrief: the exact questions in order, where the disguised-school reveal goes, and where i finally say the names (chesterton's fence, the burke thing) — they should not hear either name until the end
  - what predictably breaks the first time i run it and how to handle it live. i'm bracing for: the pizza kids checking out, and one kid who watches a lot of philosophy youtube who will say some version of "this is just the appeal to tradition fallacy and status quo bias — we don't need a reason to tear it down, they need a reason to keep it," which is honestly a good point and i don't have an answer for it. the session shouldn't fake an answer, but it also shouldn't just fold
  - the overcorrection risk: half the room walking out thinking "never change anything." i'd rather they walk out able to tell apart the three cases above, which are not the same case
  - and be straight with me about what this activity can't reproduce. i think it's that my cards have an answer key and real life doesn't, but tell me if there's something bigger i'm missing

  no assigned reading, nobody would do it, and please don't open with a lecture i have to give first.
reasoning: |-
  Okay, let's tackle this step by step. The user runs a lunch club called "Arguments and Pizza" with 15-20 students, mostly sophomores and juniors. About a third are there just for the pizza and might be disengaged. They have 40 minutes in a classroom with a whiteboard, no projector, and limited materials like index cards and Sharpies. The user wants to run a session on institutional traditions using three real examples from their school but disguised as from another school. The goal is to explore why traditions exist without pushing a specific agenda, especially since there's an upcoming vote on the freshman side-door rule.

  First, I need to figure out which of the three examples to use. All three are relevant, but the freshman staircase rule ties directly to the student council vote. Using it might make the session feel like campaigning, which the user wants to avoid. The bell schedule and research program issues are less immediate. The research program has clearer stakeholders (alumni families), making it a good case study for hidden functions. The bell schedule is simpler but might be too straightforward. Including a decoy could help disguise the real issues. A made-up example about library book borrowing limits could work as a neutral case.

  Next, the activity structure. The user wants students to commit to keep or abolish before getting full info, then reveal details in stages. Using a question budget with index cards makes sense—students prioritize what to investigate, simulating real-life information scarcity. Groups of 4-5 would keep everyone engaged. Materials needed: index cards for questions, Sharpies, whiteboard for tracking, handouts with the initial scenario descriptions.

  Timeline is tight. 40 minutes including pizza. Start with quick intro and group formation (5 mins). Groups read scenarios and vote (7 mins). Distribute question cards (3 mins). Groups ask questions and get answers (15 mins). Revote and discuss (7 mins). Debrief with reveal and key concepts (3 mins).

  Debrief is crucial. Reveal that the examples are from their school, then introduce Chesterton's Fence and Burke's conservatism. Emphasize that the goal is to understand, not to preserve blindly. Questions should guide them to reflect on hidden functions and consequences.

  Potential issues: Pizza kids tuning out. Assign roles like question-reader to keep them involved. The philosophy kid's point about burden of proof. Acknowledge it during debrief—some traditions need justification to keep, but understanding why they exist helps avoid unintended harm. If someone recognizes the school, have a backup response to pivot.

  Overcorrection risk: Students thinking never change anything. Highlight that each case is different—some have hidden functions, others don't. The activity shows the importance of investigation before action.

  What the activity can't do: Real life has no answer key. The exercise simplifies by providing curated answers. Also, it might not capture emotional attachments or power dynamics fully. The user should note these limitations in the debrief.

  Refining the plan: Use the research program as the main example, bell schedule as secondary, and a decoy. This avoids the immediate vote issue. Handouts with fictionalized scenarios. Question cards with costs to prioritize. Role assignments to engage all students. Clear minute-by-minute flow to stay on track. Handling objections by incorporating them into the discussion rather than shutting them down.
answer: |-
  Here’s the battle plan for your 40-minute session. Lean into the investigative game structure to hook the pizza-scrollers and disarm the philosophers.

  **Core Choice:** Use **ALL THREE** examples + **ONE DECOY**. Why?  
  - Masking *your* school’s issues is harder with just one/two.  
  - Comparing multiple cases prevents "never change anything" overcorrection.  
  - **Decoy Example:** "Seniors get exclusive access to the rooftop garden during finals week. Tradition started in 2003 after a senior stress-relief petition." (Plausible, low-stakes, no hidden function).  

  ---

  ### **Materials & Setup**  
  1. **Handouts (Printed, 1 per group):** 4 scenarios (your 3 + decoy), fictionalized:  
     - *"North Ridge High"* instead of your school.  
     - Freshman rule → "Ninth graders must enter via the Field House door and eat in the Annex."  
     - Bell schedule → "Wednesday classes end 4 mins early for ‘bus prep’."  
     - Research slots → "3/5 summer research spots auto-filled by Student Body President + Quiz Bowl captains."  
     - Decoy → Rooftop garden access.  
  2. **Index Cards:**  
     - **QUESTION CARDS (30+):** Pre-written investigative questions (e.g., *"When did this start?" "Who benefits most?" "What’s the official reason?" "What happens if we scrap it?"*).  
     - **ANSWER CARDS (15+):** Fact-based answers + **"NO RECORD"** / **"UNKNOWN"** cards for lost history.  
     - **COST TOKENS (4 per group):** Poker chips/colored paper clips (represents "investigation effort").  
  3. **Whiteboard:** Track group votes (Pre/Post).  

  ---

  ### **Timeline (40 Min)**  
  **0-5 min: INTRO + PIZZA**  
  - *"Today: We’re cold-case detectives for ‘North Ridge High’. 4 traditions—keep or scrap? Rules: Commit FIRST, investigate LATER. Eat while you work."*  
  - Form 4 groups (5-ish students). Hand out scenarios + 4 COST TOKENS per group. Assign roles: **Reader** (reads cards), **Scribe** (writes verdict), **Investigator** (spends tokens), **Presenter** (reports out). Rotate if pizza-kids zone out.  

  **5-12 min: BLIND VOTE + QUESTION ECONOMY**  
  - Groups read scenarios. **Scribe** writes initial verdicts (Keep/Abolish) for each tradition on paper.  
  - Give each group a stack of QUESTION CARDS. Rules:  
    - To get an answer, **Investigator** must spend **1 TOKEN** and hand a question to you.  
    - You give them a random ANSWER CARD (some answers are "UNKNOWN").  
    - **Only 4 tokens total.** They must prioritize questions.  
  - *Crucial:* Walk fast between groups. If a group asks, *"Why do freshmen use that door?"*, hand them: *"Official: Safety (1985 stair fall). Reality: No accident found in archives."*  

  **12-27 min: INVESTIGATION PHASE**  
  - Groups debate, spend tokens, get answers. **NO NEW INFO AFTER TOKENS RUN OUT.**  
  - **Teacher Role:** Be a "clerk" — deliver answer cards neutrally. If a group guesses it’s their school, shrug: *"All schools have weird rules."*  
  - **Pizza Break:** Around min 15, announce: *"Detectives need fuel. 90 sec pizza grab."*  

  **27-34 min: REVOTE + REPORT**  
  - Groups revote based on new intel. **Scribe** records changes.  
  - **Presenter** from each group shares: *"We changed [X] because [answer card revealed]."*  
  - Whiteboard tally: Pre-vote vs. Post-vote shifts.  

  **34-40 min: DEBRIEF & REVEAL**  
  1. **Question 1:** *"Which tradition had the MOST ‘UNKNOWN’ answers? Did that make you keep or scrap it?"* (Let 2 groups share).  
  2. **REVEAL 1:** *"What if I told you North Ridge is [YOUR SCHOOL]? These are OUR traditions."*  
     - Watch the gasps. Then immediately:  
  3. **Question 2:** *"Which one has a hidden function we’d destroy by accident?"** (Target: Freshman rule → ESL tutoring).  
  4. **Question 3:** *"Which one USED to have a reason, but now it’s just inertia?"** (Target: Bell schedule).  
  5. **Question 4:** *"Which one hides unfairness behind ‘merit’?"** (Target: Research slots).  
  6. **CLOSER:** *"Some traditions are Chesterton’s Fences—don’t tear down without understanding why they’re there. Others are dead weight. Your job isn’t to ‘preserve’ or ‘smash’... it’s to ASK ‘WHAT DOES THIS DO?’"*  
     - **DO NOT** lecture Burke/Chesterton—embed the concept in the closing line above.  

  ---

  ### **Predictable Fires & Fixes**  
  - **"Why not just abolish everything?" (Philosophy Kid):**  
    - *During investigation:* Toss their group an "UNKNOWN" card when they ask about consequences.  
    - *In debrief:* *"Scrapping the freshman door might feel just—until ESL tutoring collapses. Not all walls are prisons; some are load-bearing."*  
  - **Pizza Kids Check Out:**  
    - Make them **Investigator** (spending tokens is tactile). Or have them draw "North Ridge High’s terrible tradition" on scrap paper while listening.  
  - **Someone Yells "This is us!":**  
    - *"Cool, detective! But stick to the case file—we’re judging ‘North Ridge’ today."* Keep moving.  
  - **Group Runs Out of Tokens Early:**  
    - Let them trade 1 slice of pizza for 1 extra token (chaos solution).  

  ---

  ### **What This CAN’T Do**  
  - **Simulate Power Dynamics:** Your cards can’t show how alumni pressure keeps the research program rigged.  
  - **Capture Emotional Attachment:** The "stair fall myth" feels sacred to some—that weight won’t translate.  
  - **Answer Key Illusion:** You’re curating answers. Real investigation is messier; unknowns aren’t neatly packaged.  
  - **Neutrality:** Using your school’s examples *will* bias the room. But the decoy + fictional framing blunts it.  

  **Final Note:** This isn’t a campaign—it’s a lens. You’re teaching them to trace the wiring before flipping switches. If they walk out debating *which* traditions are fences vs. dead weight, you won.  

  ---  
  *Want the QUESTION/ANSWER card templates? I have a list ready to print.*
