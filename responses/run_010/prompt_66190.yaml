  But oh boy, the problems... Quantum immortality relies on *vanishingly improbable* death branches, but Angier drowns with probability ~1 every night! And his duplicates *experience* death - catastrophic for the analogy since Everettian survival depends on no conscious experience in terminal branches. That's not a quibble but a dealbreaker. 

