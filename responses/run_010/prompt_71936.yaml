  Here's the seed I want you to build the question around (feel free to fudge the timings if different numbers make for a cleaner problem): a preregistered study in which people flex a wrist whenever they feel like it, and on half the trials a stop-signal can arrive at a random moment in the 500ms before EMG onset. Headline result — subjects reliably manage to call the action off when the signal lands inside the last ~150ms, and almost always fail when it lands earlier. I want the question to make students work out what that pattern does and doesn't license about conscious agency: the veto reading, the "conscious intention is a late, causally inert tag" reading, and at least one third reading they'd have to supply themselves — plus what control or further design change they'd demand before believing any of it. Ideally the question is answerable in about 90 minutes.

