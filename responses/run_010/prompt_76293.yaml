  **Core Pattern**: The supervisor prioritizes whether an observation protocol could have produced a counterexample. If the setup inherently prevents falsification (e.g., sampling only safe areas or knowing alternatives), it yields no evidence. Quantity matters for weak evidence from non-instances (e.g., warehouse scan), but only if falsification was possible.

