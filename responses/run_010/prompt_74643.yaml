answer: |-
  ## Project Proposal: Putting ITN on Solid Foundations - A Curve-Based Justification

  **The Itch:** The Importance/Tractability/Neglectedness (ITN) framework, widely used within effective altruism (EA) for cause prioritization, suffers from a critical **scale invariance flaw**. Multiplying raw scores across these dimensions and ranking causes based on the product is mathematically arbitrary. Rescaling any dimension – using logarithmic scales instead of linear, shifting the 0-1 range endpoints, or applying other equally defensible transformations – alters the final ranking. A significant portion of the output ranking is therefore an artifact of unstated and undefended measurement conventions, undermining the framework's objectivity and reliability for comparing diverse causes.

  **The Question Stated Precisely:** Under what specific assumptions about the functional form of the *impact-vs-resources curve* for a cause area does the product of its Importance (I), Tractability (T), and Neglectedness (N) scores provide a valid first-order approximation of the *marginal impact per additional unit of resources*?

  **Why the Usual Defenses Fail:**
  *   **"It's just a heuristic"**: While true, this doesn't excuse the scale-dependence. A useful heuristic should be *robust* to reasonable implementation choices. ITN's ranking volatility under rescaling demonstrates it lacks this robustness, making it an unreliable heuristic for comparisons where resource shifts between causes hinge on small ranking differences.
  *   **"It forces explicit thinking"**: Explicitly thinking about I, T, and N is valuable, but the *multiplication step* is where the scale sensitivity arises and where justification is weakest. Thinking explicitly doesn't resolve the fundamental arbitrariness introduced by the multiplicative combination of potentially arbitrary scales.
  *   **"It works in practice"**: Anecdotal success doesn't validate the underlying mechanics. Without understanding *why* the multiplication works (if it does) and under what conditions, we risk misallocating resources based on methodological artifacts rather than true impact potential. Confirmation bias is a significant risk.

  **The Proposed Approach: Reframing ITN as a Curve Claim**
  Instead of treating I, T, and N as independent scores to be multiplied, we reinterpret them as parameters describing an **impact-vs-resources curve**:
  1.  **Importance (I)**: The **asymptote** – the theoretical maximum achievable impact if all possible resources were optimally applied (i.e., `Impact(max) = I`).
  2.  **Tractability (T)**: The **initial slope** (or derivative at current resources) – how steeply impact increases with the *first* unit of additional resources (`dImpact/dResource @ current ~ T`).
  3.  **Neglectedness (N)**: The **current position** on the curve – inversely related to the cumulative resources already invested (`Current Resources ~ 1/N`).

  **The Core Insight:** The product `I * T * N` *only* corresponds to the marginal impact per resource (`dImpact/dResource`) under very specific assumptions about the shape of this curve – primarily, a curve where marginal impact declines linearly with cumulative resources (e.g., `Impact = I * (1 - exp(-k * Resource))`, where `k` relates to T and N). The project will rigorously investigate these necessary assumptions.

  **Why This Approach Over Simpler Normalization?**
  *   **Addresses the Root Cause:** Normalization (e.g., forcing 0-1 scales) might reduce *some* arbitrariness, but it doesn't solve the fundamental problem: multiplication is only justified for marginal impact under specific curve shapes. Normalization treats the symptom (scale differences) without tackling the disease (model mismatch).
  *   **Provides Foundational Justification:** This approach seeks to *ground* ITN in a model of how impact actually responds to resources. If successful, it tells us *when and why* ITN is a valid tool, rather than just making the arbitrary tool slightly less arbitrary.
  *   **Reveals Hidden Assumptions:** It forces explicit consideration of *diminishing returns* – how does marginal impact decay as more resources are added? This is crucial for prioritization but often implicit and unexamined in standard ITN.
  *   **Enables Better Modeling:** If the necessary assumptions (like linear decay of marginal returns) are unrealistic for many causes, this approach points the way towards more nuanced models (e.g., using the curve parameters directly for prioritization).

  **What I Will Do (Month-by-Month Plan):**

  *   **Month 1: Foundation & Formalization**
      *   Literature review: EA critiques of ITN, economic models of production/diminishing returns, cause prioritization methodologies.
      *   Precisely formalize the impact-vs-resources curve concept. Define `Impact = f(Resource; I, T, N)` mathematically.
      *   Derive the general expression for Marginal Impact (`dImpact/dResource`).
  *   **Month 2: Assumption Hunting & Model Mapping**
      *   Identify the specific functional forms of `f(Resource)` where `dImpact/dResource = constant * I * T * N` holds true. (Focus: Exponential saturation, Linear returns to log resources?).
      *   Explicitly map common interpretations of T (slope at zero? average slope?) and N (inverse resources? inverse current spend?) onto curve parameters.
      *   Formalize the necessary assumptions about curve shape and parameter definitions.
  *   **Month 3: Exploring Alternatives & Generality**
      *   Investigate what `I * T * N` approximates under *other* common curve shapes (e.g., logarithmic, power-law, S-curves).
      *   Analyze how robust/vulnerable the `I*T*N ≈ Marginal Impact` equivalence is to deviations from the ideal assumptions.
      *   Begin documenting implications: When does ITN work well? When does it break down?
  *   **Month 4: Tractable Models & Data Interface**
      *   Develop simplified, tractable mathematical models usable by practitioners based on the curve framework.
      *   Design a practical method for cause analysts to estimate/describe the assumed `f(Resource)` shape for their cause (even qualitatively).
      *   Explore how existing data (e.g., historical funding vs. progress) *could* inform curve parameters/shape (feasibility assessment).
  *   **Month 5: Simulation & Case Studies**
      *   Build simple simulation models to compare prioritization based on `I*T*N` vs. direct marginal impact calculation under different curve shapes.
      *   Conduct illustrative case studies on 2-3 contrasting cause areas (e.g., global health vs. AI safety) applying the curve framework.
      *   Identify key factors causing ITN rankings to diverge from marginal impact rankings in simulations.
  *   **Month 6: Synthesis, Outputs & Communication**
      *   Synthesize findings: Clear statement of necessary assumptions, robustness conclusions, and limitations.
      *   Draft final report: Problem statement, theoretical framework, key results, practical implications & recommendations.
      *   Develop clear outputs: Decision tree/toolkit for practitioners using ITN more robustly; template for documenting curve assumptions.
      *   Internal project review and finalization.

  **What a Result Looks Like:**
  1.  **A Formal Justification (or Refutation):** A clear mathematical answer: "ITN multiplication approximates marginal impact *if and only if* the impact curve has form X, with parameters defined as Y and Z." This is the core deliverable.
  2.  **Practical Guidance:** A framework/toolkit for EA organizations:
      *   A checklist of critical assumptions to validate when using ITN.
      *   Guidance on how to think about and potentially estimate the shape of the impact curve for a cause.
      *   Alternative simple models to use if ITN's core assumptions seem violated.
      *   Clearer definitions for T (initial slope) and N (inverse current resources).
  3.  **Documentation:** A comprehensive report detailing the problem, methodology, findings, and implications for cause prioritization practice. Code for simulations/models.

  **What Would Count as Failure:**
  1.  **Unclear Assumptions:** Failure to precisely identify the necessary and sufficient conditions under which `I*T*N` approximates marginal impact.
  2.  **No Actionable Insights:** Producing only abstract mathematical results without translating them into practical implications or tools for cause prioritizers.
  3.  **No Testable Implications:** Failing to generate concrete predictions about *when* and *how* ITN rankings would diverge from marginal impact, making the theory untestable in principle.
  4.  **Ignoring Real-World Complexity:** Sticking purely to oversimplified models that bear no resemblance to how impact is believed to function in actual cause areas (e.g., ignoring coordination problems, tipping points, or discrete thresholds).

  **Realistic Scope for Six Months:**
  This project will provide a **rigorous theoretical foundation** and **initial practical framing**, but it is not a complete solution. Realistically, we can:

  1.  **Formalize the Curve Model:** Precisely define the mapping and derive the necessary assumptions.
  2.  **Identify Key Curve Shapes:** Rigorously analyze the implications of 2-3 fundamental curve types (e.g., exponential saturation, linear, log).
  3.  **Develop Conceptual Tools:** Produce frameworks, checklists, and illustrative examples for practitioners.
  4.  **Run Proof-of-Concept Sims:** Demonstrate the *potential* for ranking divergence using simple simulated cause areas.
  5.  **Clarify Definitions:** Provide much sharper definitions for I, T, and N within this context.

  **We likely cannot:**
  1.  **Empirically Validate Curves:** Conduct detailed empirical estimation of impact curves for real-world causes (beyond illustrative case studies using rough proxies).
  2.  **Handle Extreme Complexity:** Fully model causes with highly discontinuous, threshold-dependent, or multi-agent strategic dynamics – though we'll note these as limitations.
  3.  **Build Complex Software:** Develop a full-fledged, user-friendly prioritization tool (beyond simple simulation code/docs).
  4.  **Cover All EA Causes:** Exhaustively analyze every major cause area.

  **Honest Read:** This six months will transform the ITN discussion from "let's multiply these scores" to "here's the impact curve model ITN implies, the assumptions it requires, and how to use it (or alternatives) more rigorously." It will provide the essential theoretical grounding and initial practical steps, setting the stage for future empirical work and tool development. The core deliverable – clarifying the link between ITN and marginal impact via curve shape assumptions – is achievable and addresses a fundamental methodological weakness.
