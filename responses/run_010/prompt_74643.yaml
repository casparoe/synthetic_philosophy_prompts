  I'm pitching a six-month project to a small funder and need the proposal written up. The itch: the importance/tractability/neglectedness framework that EA-type orgs use to rank cause areas isnt scale-invariant. You score each dimension, multiply, and rank — but re-anchor the scales in an equally defensible way (logs instead of raw scores, or a 0–1 range with different endpoints) and the ranking of causes comes out different. So a chunk of the output is an artifact of measurement choices nobody ever defends.

  My half-formed hunch is the fix isnt to ditch ITN but to stop treating it as a score and start treating it as a claim about the shape of an impact-vs-resources curve: neglectedness is where on the curve you currently sit, tractability is the slope, importance is the asymptote. Then the real question is what assumptions about that curve you need before the product counts as even a rough first-order approximation of marginal value.

  Write it up: the question stated precisely, why the usual defenses (it's just a heuristic, it forces you to think explicitly, whatever) don't settle it, what I'd actually do month by month, why the impact-curve route rather than the obvious cheaper fix of just normalizing the scales, what a result looks like, what would count as the project failing, and an honest read on how much of this six months can realistically cover. No bibliography, I'll put references in myself.
