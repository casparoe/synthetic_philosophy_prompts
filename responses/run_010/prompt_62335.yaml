prompt: |-
  At a talk last week the speaker's whole framing of chaos was that a chaotic deterministic system is basically a pseudorandom number generator with a physical seed: the initial condition is the seed, the equations of motion are the algorithm, the exponential divergence of nearby trajectories is the bit-mixing, and if you knew the seed exactly you could replay the entire output. His running example was a driven double pendulum. He used the picture to make two claims -- that the probabilities in classical statistical mechanics are all in the map and none of them in the territory, and that you therefore need something like quantum mechanics before objective chance gets a foothold anywhere in nature.

  My friend, who writes PRNGs for a living, says the analogy is worse then it looks, because a seed is a finite string that somebody chose and could in principle recover, whereas the state of a physical chaotic system is a real number that no finite measurement pins down -- so the ignorance is in principle, not just in practice. Separately, the speaker waved at the shadowing lemma to say that a noisy numerical integration is always tracking some genuine trajectory, and my friend muttered that its the wrong comfort to take from that result.

  Can you audit the analogy properly? I want the correspondences laid out explicitly -- seed, algorithm, mixing, period length, the statistical test battery -- and then the disanalogies sorted into the ones that actually threaten his two conclusions versus the ones that are only skin deep. Also tell me which features of a PRNG the analogy quietly imports that a double pendulum doesn't have. While you're in there: someone in the audience said instruments ten times more precise double your forecast window and the speaker nodded along, and I don't think that's right -- work out what ten times more precision actually buys you and where the audience member's intuition goes wrong. Then give me a committed verdict rather than a menu: does the all-classical-probability-is-epistemic claim survive the audit, does the no-chance-without-quantum-mechanics claim, and if the analogy is doing damage, what's a better one for the job it was asked to do. If you have room, say whether the same audit goes through for Bohmian mechanics, where the hidden seed is the initial configuration and there's a probability measure over it that everybody treats as doing real explanatory work.
reasoning: |-
  We are going to audit the analogy between a chaotic deterministic system and a pseudorandom number generator (PRNG). The speaker's analogy:

  - Seed: initial condition of the physical system
  - Algorithm: equations of motion
  - Mixing: exponential divergence of nearby trajectories (sensitive dependence on initial conditions)
  - Replay: if you know the seed exactly, you can replay the entire output.

  The speaker used this to argue:

  1. In classical statistical mechanics, probabilities are entirely epistemic (i.e., in the map, not the territory) because they arise from ignorance of the exact initial condition.

  2. Therefore, without quantum mechanics, there is no objective chance in nature.

  We also have two critiques from the friend:

  a) The seed in a PRNG is a finite string that is chosen and could be recovered, while the state of a physical system is a real number that cannot be pinned down by any finite measurement. Thus, the ignorance is in principle.

  b) The speaker used the shadowing lemma (which says that a noisy numerical integration is always close to some exact trajectory) to comfort about numerical errors, but the friend thinks that's the wrong comfort.

  We are to:

  1. Lay out the correspondences explicitly (seed, algorithm, mixing, period length, statistical test battery).

  2. Sort the disanalogies into those that threaten the speaker's two conclusions and those that are only skin deep.

  3. Identify features of a PRNG that the analogy quietly imports but a double pendulum doesn't have.

  4. Address the audience member's claim: "instruments ten times more precise double your forecast window" — work out what ten times more precision actually buys and where the intuition goes wrong.

  5. Give a committed verdict on whether the two claims survive the audit.

  6. If there is room, comment on Bohmian mechanics.

  Let's break it down.

  ### 1. Correspondences

  - **Seed**: In a PRNG, the seed is a finite bitstring (e.g., 64 or 128 bits) that initializes the state. In the chaotic system, the seed is the initial condition (a point in a continuous state space, e.g., in a double pendulum: angles and angular velocities).

  - **Algorithm**: In a PRNG, the algorithm is a deterministic function that maps the current state to the next state and outputs a number. In the chaotic system, the algorithm is the deterministic equations of motion (e.g., Hamiltonian equations) that map the current state to the next state.

  - **Mixing**: In a PRNG, mixing refers to operations that spread the entropy of the state so that the output appears random. In a chaotic system, the exponential divergence of nearby trajectories (positive Lyapunov exponent) serves a similar purpose: it quickly amplifies small differences, making the system appear random.

  - **Period length**: A PRNG has a finite period (after which it repeats). A chaotic system in a bounded phase space will also have a recurrence (by Poincaré recurrence) but the recurrence time is typically astronomically large and not comparable to a PRNG period. Moreover, for a chaotic system, the recurrence is not a practical concern because the system is mixing and the recurrence time is too long.

  - **Statistical test battery**: PRNGs are tested against a suite of statistical tests to ensure they produce output that is indistinguishable from random. For a chaotic system, we can also perform statistical tests on the output (e.g., the sequence of positions) and it should pass tests for randomness (if the system is ergodic and mixing). However, the double pendulum might not be tested as rigorously as a PRNG, but the point is that the output appears random.

  ### 2. Disanalogies

  We can categorize:

  **A. Finite vs Infinite State**

  - PRNG: The state is finite (a fixed number of bits). The seed is chosen from a finite set and is recoverable (in principle) from the output if the algorithm is known and the state is small enough.

  - Chaotic system: The state is continuous (infinite precision). Any measurement has finite precision, so we never know the exact state. Moreover, even in principle, we cannot specify a real number exactly (as it would require an infinite amount of information).

  **Why it matters for the claims:** This disanalogy directly supports the friend's point and the speaker's first claim. The ignorance of the exact initial condition is in principle, not just in practice. Thus, it reinforces the idea that probabilities in classical statistical mechanics are epistemic. However, the friend is pointing out that the analogy might be worse because the PRNG seed is recoverable in principle (if you have the output and the algorithm, you can backtrack to the seed) but for a chaotic system with continuous state, you cannot recover the exact initial condition even with perfect output because there are infinitely many initial conditions that would produce the same finite-precision output. This doesn't threaten the speaker's first claim; it actually strengthens it by showing the ignorance is inherent.

  **B. Periodicity vs Aperiodicity**

  - PRNG: Must have a finite period (though it can be very long). The output is periodic.

  - Chaotic system: In a bounded phase space, by Poincaré recurrence, the system will eventually return arbitrarily close to the initial state. However, the time for recurrence is typically so large (exponentially in the number of degrees of freedom) that for practical purposes it is aperiodic. Moreover, the recurrence is not a cycle but a near-return.

  **Why it matters:** This disanalogy is not critical. The period in a PRNG is a technical limitation, but the chaotic system's recurrence time is so large that it doesn't affect the analogy for practical timescales. So this is skin deep.

  **C. Shadowing Lemma and Numerical Errors**

  - The shadowing lemma (for hyperbolic systems) says that for a noisy numerical trajectory, there exists an exact trajectory that stays close to the noisy one for a long time. The speaker uses this to say that the numerical simulation is tracking a real trajectory.

  - The friend's mutter: It's the wrong comfort because the exact trajectory that is shadowed might be very different from the one we intended to simulate (because of the sensitive dependence). So even though we have a trajectory, it might not be the one we wanted.

  **Why it matters:** This is a disanalogy in the sense that in a PRNG, if you make an error in one step, it might propagate but you can exactly recompute from the seed. In the chaotic system, numerical errors mean we are not simulating the intended trajectory but a nearby one. The shadowing lemma tells us that the simulation is still physically meaningful (it's close to some real trajectory) but it's not the one we started with. This does not threaten the speaker's claims because the point is that the system is deterministic and the probabilities come from ignorance of the exact initial condition. The fact that we are tracking a different trajectory (but still a valid one) doesn't change that.

  **D. Statistical Tests**

  - PRNG: Designed to pass a battery of tests (e.g., NIST tests) for randomness.

  - Chaotic system: The output of a chaotic system may not pass all tests that a cryptographic PRNG would. For example, a double pendulum might have correlations that a good PRNG would avoid. But the speaker is not claiming cryptographic security, only that it looks random for practical purposes.

  **Why it matters:** This is skin deep because the analogy doesn't require the chaotic system to be a perfect PRNG, only that it amplifies small uncertainties and produces unpredictable output.

  ### 3. Quietly Imported Features

  The analogy might quietly import:

  - **Finite state**: The PRNG has a finite state, so it is periodic and the seed is recoverable. The chaotic system does not have these properties.

  - **Controlled mixing**: A PRNG is designed to have good mixing properties (e.g., to pass statistical tests). A double pendulum might not be optimally designed for mixing and might have "bad" initial conditions that lead to non-random behavior (e.g., periodic orbits). But typically, a driven double pendulum is chaotic for a wide range of parameters.

  - **Reproducibility with exact seed**: In a PRNG, if you know the seed exactly, you can reproduce the sequence exactly. In the chaotic system, even if you knew the initial condition exactly (which is impossible in practice because of the continuous state), you would need to compute the trajectory exactly (without numerical error) to reproduce it. But the shadowing lemma doesn't help with that because it only says that a noisy computation is close to some exact trajectory, not the one we intended.

  ### 4. Ten Times More Precision

  The audience member: "instruments ten times more precise double your forecast window."

  What does that mean? The forecast window is the time until the prediction error becomes too large. Due to exponential divergence, the error grows as:

    error(t) ≈ error(0) * exp(λt)

  where λ is the Lyapunov exponent.

  We want the time T such that error(T) = C (some critical value). Then:

    C ≈ error(0) * exp(λT)  =>  T ≈ (1/λ) * ln(C / error(0))

  If we improve the initial error by a factor of 10 (ten times more precise, so error_new(0) = error_old(0)/10), then:

    T_new ≈ (1/λ) * ln(C / (error(0)/10)) = (1/λ) * [ln(C / error(0)) + ln(10)]

  So the improvement in time is: ΔT = T_new - T_old = (1/λ) * ln(10)

  This is a constant (depending on λ and the factor of improvement) and does not depend on the original error. For example, if λ=1 (per unit time) and ln(10)≈2.3, then ΔT≈2.3 units. If the original forecast window was T_old, then T_new = T_old + ΔT. So it adds a constant, not doubling.

  The audience member's intuition might be that if you reduce the initial error by a factor of 10, then because of exponential growth, you get a linear increase in the time until the error reaches a threshold. But it's logarithmic: the improvement in time is proportional to the logarithm of the factor of precision improvement.

  Where the intuition goes wrong: They might be thinking linearly. For example, if the error grows linearly, then ten times more precision would let you forecast ten times longer. But in chaotic systems, the growth is exponential, so the improvement is only logarithmic.

  ### 5. Verdict on the Claims

  **Claim 1: All classical probabilities are epistemic (in the map, not the territory).**

  This claim survives the audit. The disanalogies (especially the infinite state space and the impossibility of exact measurement) reinforce that the ignorance of the initial condition is in principle. The probabilities in classical statistical mechanics arise because we cannot know the exact microstate, and the chaotic dynamics quickly amplify that ignorance. The shadowing lemma doesn't change this because it only says that a noisy simulation is close to some trajectory, but we still don't know which one.

  **Claim 2: Therefore, you need quantum mechanics for objective chance.**

  This claim is more contentious. The speaker's argument is that without quantum mechanics, everything is deterministic and probabilities are only due to ignorance. But note that objective chance (ontic probability) is a matter of interpretation. In classical mechanics, one could argue that the probabilities are merely epistemic. However, the friend's point about the in-principle ignorance in chaotic systems (due to continuous state) does not by itself introduce objective chance. It only makes the epistemic probability more entrenched.

  But does quantum mechanics necessarily provide objective chance? Not in all interpretations. For example, in the de Broglie-Bohm interpretation (Bohmian mechanics), quantum mechanics is deterministic and probabilities are epistemic (arising from ignorance of the initial configuration). So the speaker's claim might be too strong.

  Moreover, the analogy does not directly address whether there is objective chance in nature. It only says that in classical chaotic systems, the randomness is epistemic. To get objective chance, the speaker says you need quantum mechanics (presumably in an interpretation that has objective chance, like Copenhagen).

  But note: the audit of the analogy doesn't directly challenge the idea that quantum mechanics has objective chance. It only challenges whether the analogy is sufficient to rule out objective chance in classical physics (which it does) and whether it forces the need for quantum mechanics for objective chance (which is a separate claim). The analogy itself is about classical chaos.

  Verdict: The claim that without quantum mechanics there is no objective chance is a non sequitur from the analogy. The analogy only shows that in classical chaos, probabilities are epistemic. But that does not imply that quantum mechanics is the only way to have objective chance. Moreover, in deterministic interpretations of quantum mechanics (like Bohmian), there is no objective chance. So the claim might not hold.

  ### 6. Bohmian Mechanics

  In Bohmian mechanics, the system is deterministic. The state is given by the wave function (which evolves deterministically by the Schrödinger equation) and the actual configuration (positions of particles) which evolves deterministically guided by the wave function. There is a probability measure over the initial configuration (usually taken as |ψ|^2) that is treated as doing real explanatory work.

  The same audit applies: 

  - The initial configuration is like a seed (but again, continuous, so in-principle ignorance). 
  - The equations of motion (guidance equation) are the algorithm. 
  - The system may exhibit chaos (sensitive dependence on initial conditions). 

  The probabilities in Bohmian mechanics are epistemic because they arise from ignorance of the exact initial configuration. The quantum equilibrium hypothesis (that the initial configuration is distributed by |ψ|^2) is posited as an axiom, but the probabilities are still epistemic (they reflect our ignorance of the exact configuration). 

  So in Bohmian mechanics, there is no objective chance. Therefore, the speaker's second claim (that you need quantum mechanics for objective chance) is false in this interpretation. The existence of objective chance depends on the interpretation of quantum mechanics.

  ### Summary

  - The analogy is mostly valid for the purpose of showing that chaotic systems amplify small uncertainties and produce unpredictable behavior, making probabilities in classical statistical mechanics epistemic.

  - The disanalogies (especially the infinite state) do not threaten the first claim; they support it.

  - The second claim (that you need quantum mechanics for objective chance) is not supported by the analogy because:
    (a) The analogy does not address quantum mechanics.
    (b) Even in quantum mechanics, there are deterministic interpretations (like Bohmian) where probabilities are epistemic.

  - The audience member's claim about precision is incorrect: ten times more precision adds a constant time (ln(10)/λ) to the forecast window, not doubling.

  A better analogy for the job might be to emphasize the in-principle ignorance of the continuous initial condition and the exponential amplification. However, the PRNG analogy is useful for conveying the idea of deterministic unpredictability. For the second claim, the speaker might need to argue from quantum indeterminacy (in non-deterministic interpretations) rather than from classical chaos.

  Final Verdict:

  - Claim 1 (classical probabilities are epistemic) survives the audit.
  - Claim 2 (need quantum mechanics for objective chance) does not necessarily follow and is interpretation-dependent. The analogy does not establish it.

  If the speaker's point is that classical physics (including classical chaos) does not have objective chance, then that is supported. But the further step that quantum mechanics is required for objective chance is a separate argument that the analogy doesn't address.
answer: |-
  ### Audit of the Chaos-PRNG Analogy

  The speaker's analogy frames a chaotic deterministic system (e.g., a driven double pendulum) as a pseudorandom number generator (PRNG), with the initial condition as the seed, equations of motion as the algorithm, exponential divergence as bit-mixing, and deterministic replay as a key feature. This is used to argue that probabilities in classical statistical mechanics are purely epistemic (reflecting ignorance, not objective chance) and that quantum mechanics is necessary for objective chance. We'll audit the analogy step by step, address the friend's critiques, evaluate the audience member's claim about precision, and deliver a verdict. We'll also briefly touch on Bohmian mechanics.

  ---

  ### **Explicit Correspondences**
  Here's how the analogy maps onto a chaotic system like a driven double pendulum:

  1. **Seed**: The initial condition (e.g., positions and momenta of the pendulum arms).  
     - *In PRNG*: A finite bitstring (e.g., 128 bits) chosen to initialize the generator.  
     - *Analogy*: Both define the starting state for deterministic evolution.

  2. **Algorithm**: The equations of motion (e.g., Hamiltonian dynamics).  
     - *In PRNG*: A deterministic function (e.g., a cryptographic hash or linear recurrence) that updates the state and outputs numbers.  
     - *Analogy*: Both transform the current state deterministically to produce future states/outputs.

  3. **Mixing**: Exponential divergence of nearby trajectories (quantified by Lyapunov exponents).  
     - *In PRNG*: Bit-mixing operations (e.g., XOR shifts, modular arithmetic) that diffuse small input differences across the output.  
     - *Analogy*: Both amplify small uncertainties (in initial state or seed) into large, unpredictable changes, creating apparent randomness.

  4. **Period Length**: The system's recurrence time (due to Poincaré recurrence in bounded phase spaces).  
     - *In PRNG*: The number of iterations before the output repeats (e.g., \(2^{128}\) for a 128-bit state).  
     - *Analogy*: Both have a finite cycle length, but the chaotic system's period is astronomically large (e.g., \(10^{10^{16}}\) years for a double pendulum), making it functionally aperiodic on human timescales.

  5. **Statistical Test Battery**: Output evaluated for randomness.  
     - *In PRNG*: Tests (e.g., NIST SP 800-22) for uniformity, independence, and pattern absence (e.g., no autocorrelation).  
     - *Analogy*: Chaotic systems can pass basic randomness tests (e.g., histogram uniformity, decay of correlations) when discretized, but not cryptographic tests without careful tuning.

  ---

  ### **Disanalogies: Threatening vs. Skin-Deep**
  Disanalogies are sorted based on whether they threaten the speaker's two core claims:
  - **Claim 1**: Classical probabilities are purely epistemic (in the map, not the territory).
  - **Claim 2**: Quantum mechanics is needed for objective chance.

  #### **Threatening Disanalogies (undermine claims)**
  1. **State Representation and Recoverability**  
     - *Disanalogy*: PRNG seeds are finite, discrete, and recoverable (e.g., from output via reverse engineering). Chaotic systems have continuous states (real numbers), making the initial condition fundamentally unknowable with finite measurements.  
     - *Threat to claims*:  
       - Strengthens **Claim 1** (ignorance is in-principle, not just practical, so classical probability is indeed epistemic).  
       - Weakens **Claim 2**: If classical chaos has in-principle ignorance, it doesn't logically require quantum mechanics for epistemic probability. Quantum mechanics isn't "needed" for this; classical chaos already exemplifies it. Claim 2 overreaches.

  2. **Output Replay and Determinism**  
     - *Disanalogy*: PRNGs allow exact replay with the seed. Chaotic systems cannot be replayed exactly due to the shadowing lemma's limitations (see below) and the impossibility of measuring real numbers.  
     - *Threat to claims*:  
       - Weakens the analogy's support for **Claim 1**: While replay is theoretically possible, it's practically and fundamentally inaccessible, making epistemic probability even more salient.  
       - Does not threaten Claim 1's core, but exposes a flaw in the analogy's determinism narrative.

  #### **Skin-Deep Disanalogies (superficial, don't threaten claims)**
  1. **Periodicity**  
     - *Disanalogy*: PRNGs have short, predictable periods; chaotic systems have near-infinite recurrence times.  
     - *Impact*: Irrelevant for statistical mechanics, where timescales of interest are far shorter than recurrence times. No threat to claims.

  2. **Mixing Efficiency**  
     - *Disanalogy*: PRNGs are engineered for optimal mixing (e.g., cryptographic avalanche effect); chaotic systems like the double pendulum have "natural" mixing that may be inefficient (e.g., sticky regions in phase space).  
     - *Impact*: Affects randomness quality but not the core epistemic argument. Skin-deep.

  3. **Statistical Testing**  
     - *Disanalogy*: PRNGs are designed to pass stringent test batteries; chaotic systems may fail tests due to dynamical artifacts (e.g., correlations in Poincaré sections).  
     - *Impact*: Only affects "perfect" randomness, not the analogy's utility for illustrating epistemic probability. Skin-deep.

  ---

  ### **Quietly Imported PRNG Features (Absent in Chaos)**
  The analogy implicitly assumes PRNG properties that chaotic systems lack:
  - **Finite State**: PRNGs have finite states, enabling periodicity and seed recovery. Chaotic systems have infinite state spaces (real numbers), making recovery impossible.
  - **Controlled Mixing**: PRNGs are tuned for uniform mixing; chaotic systems have mixing dependent on dynamics (e.g., not globally uniform in double pendulums).
  - **Replay Fidelity**: PRNGs allow bit-perfect replay; chaotic systems cannot replay exactly due to numerical errors and measurement limits.
  - **Testability**: PRNGs are built for statistical tests; chaotic systems are rarely tested rigorously, and their "output" (e.g., trajectory points) is often coarsely sampled.

  ---

  ### **Addressing the Audience Member's Precision Claim**
  **Claim**: "Instruments ten times more precise double your forecast window."  
  **Reality**: This is incorrect. Exponential divergence implies that forecast windows scale logarithmically with precision, not linearly.

  - **Math**: For Lyapunov exponent \(\lambda\), initial error \(\delta_0\), and tolerable error threshold \(\delta_{\text{max}}\), the forecast time \(T\) is:  
    \[
    T \approx \frac{1}{\lambda} \ln \left( \frac{\delta_{\text{max}}}{\delta_0} \right)
    \]
  - **Effect of 10x Precision**: If \(\delta_0 \to \delta_0 / 10\), the new forecast time \(T'\) is:  
    \[
    T' \approx \frac{1}{\lambda} \ln \left( \frac{\delta_{\text{max}}}{\delta_0 / 10} \right) = T + \frac{\ln(10)}{\lambda}
    \]
  - **Result**: A 10x precision improvement adds \(\Delta T = \ln(10)/\lambda\) to the forecast window. For a double pendulum (\(\lambda \sim 1-10\ \text{s}^{-1}\)), \(\Delta T \approx 0.23-2.3\ \text{seconds}\)—not a doubling. Doubling would require a precision improvement of \(e^{\lambda T}\), which is exponential (e.g., \(10^{43}\)x for \(T=10\ \text{s}\) and \(\lambda=1\ \text{s}^{-1}\)).

  **Where the Intuition Goes Wrong**:  
  - Assumes linear error growth (e.g., "half the error, double the time"). Chaos has exponential growth: small precision gains yield diminishing returns. Logarithmic scaling means forecasting far into the future requires infeasible precision.

  ---

  ### **Verdict on the Speaker's Claims**
  1. **Claim 1 (Classical probabilities are epistemic)**:  
     - **Survives the audit**. The disanalogies reinforce this: the infinite state space and in-principle ignorance in chaos make probability fundamentally epistemic in classical statistical mechanics. The territory is deterministic; the map uses probability due to measurement limits.

  2. **Claim 2 (Need quantum mechanics for objective chance)**:  
     - **Does not survive**. The analogy shows classical chaos has in-principle ignorance but does not imply quantum mechanics is necessary for objective chance.  
       - Objective chance requires ontological indeterminism, which quantum interpretations (e.g., Copenhagen) provide but classical mechanics lacks. However, the analogy doesn't bridge this gap—it only addresses epistemic probability.  
       - Quantum mechanics isn't the only path: stochastic theories (e.g., collapse models) could introduce objective chance without quantum theory.  
     - **Flaw in the argument**: Claim 2 conflates "epistemic probability exists classically" with "objective chance requires quantum mechanics." The analogy supports the former but not the latter.

  **Overall Verdict**: The analogy is useful for illustrating epistemic probability in chaos but overextends for Claim 2. It "does damage" by smuggling in PRNG features (e.g., finite states, replay) that misrepresent physical chaos. A better analogy:  
  - **Chaos as an Inexact PRNG with Analog Input**: Emphasize the seed as a real number (not a finite string), mixing as physical dynamics, and replay as theoretically possible but practically unattainable. This clarifies epistemic probability without implying quantum necessity.

  ---

  ### **Bohmian Mechanics Addendum**
  The same audit applies, with nuances:
  - **Seed**: Initial particle configuration (hidden variable), with a probability measure (e.g., \(|\psi|^2\)).
  - **Algorithm**: Deterministic guidance equation (+ Schrödinger evolution for \(\psi\)).
  - **Mixing/Chaos**: Possible in some Bohmian trajectories, amplifying ignorance.
  - **Probability**: Treated as epistemic (ignorance of exact initial configuration), but the \(|\psi|^2\) measure is posited as a "quantum equilibrium" axiom.  
  - **Audit Result**:  
    - Claim 1 holds: Probabilities are epistemic (ignorance of hidden initial conditions).  
    - Claim 2 fails: Bohmian mechanics is deterministic, so it doesn't introduce objective chance. The audit reinforces that quantum mechanics (even Bohmian) doesn't necessitate objective chance—it depends on interpretation.  

  **Conclusion for Bohm**: The analogy audit holds, but it highlights that Bohmian mechanics uses epistemic probability like classical chaos, undermining Claim 2 further.

  ---

  ### **Final Summary**
  - **Claim 1 (epistemic probability in classical mechanics)**: Valid, reinforced by disanalogies.  
  - **Claim 2 (quantum needed for objective chance)**: Invalid; the analogy doesn't support it, and Bohmian mechanics shows quantum can be epistemic too.  
  - **Better Analogy**: Chaos as a "physical PRNG with an analog seed," stressing in-principle ignorance and logarithmic forecasting.  
  - **Core Issue**: The analogy is pedagogically useful but overplayed; it explains epistemic probability but can't adjudicate objective chance without deeper metaphysics.
