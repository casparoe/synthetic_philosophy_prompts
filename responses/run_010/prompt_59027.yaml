answer: |-
  ## A History of Now

  They called him radical, but we know how
  His pamphlets *really* seed our party's view.
  See subtle foresight in his furrowed brow?
  He meant our modern platform, clear as **now**.

  This treaty signed (a messy compromise,
  A hungry empire grabbing what it could)
  Was merely practice for the later prize,
  The *true* expansion, waiting to be **now**.

  Ignore those factions clinging to old ways!
  Their stubborn cries were but a backward creed,
  Obstructing Progress through their futile days,
  A hurdle cleared to reach our present **now**.

  The rebels' path that led to barren stone,
  The quiet faith that left no monument,
  The costly venture tried and left alone —
  These vanish where the grand highway points **now**.

  The victors write the tale, their judgment sure:
  *They* saw the future, *they* were in the right.
  The losers? Blinded, destined to endure
  The footnote's shade beneath our verdict **now**.

  One chronicler, amidst the dusty leaves,
  Reads whispers where the grand procession drowned.
  He sees the branching paths the story weaves,
  Not marching toward, but lost upon the ground.

  ---

  **Note on the Cheating:**

  The constraint inherently forces every stanza’s conclusion back to the present ("now"), enacting the Whig distortion even as the poem critiques it. This is the central cheat: the *form* cannot help but "haul back" every historical moment, mirroring the very recruitment Butterfield denounced. The "distinct charges" are framed, inevitably, through their relationship to *us*, the present readers/judges.

  Regarding the broken stanza (6):
  *   **Does it escape presentism?** Only partially. Its refusal of the rhyme creates formal dissonance, representing the alternative, non-teleological history. The lack of a neat "now" rhyme and the image of "paths... lost upon the ground" resist the triumphant conclusion.
  *   **Does it flatter the present?** Arguably, yes. The chronicler who "sees" the branching paths is positioned as morally and intellectually superior *from our present perspective*. We, the modern readers, are implicitly aligned with this wiser viewpoint. The stanza congratulates *us* (and the chronicler *we* approve of) for recognizing the flaw. The refusal itself becomes a performance of our enlightened stance, paradoxically reinforcing our privileged position "now" as the judges of historical interpretation. The silence after "drowned" isn't neutral; it's curated *for us* as proof of our sophistication, becoming another kind of presentist claim. True escape from the "now" within a poem constructed *about* and *for* the present is perhaps impossible.
