prompt: |-
  I'm the TA for a grad seminar on authenticity in art, and I've gotten sick of how every treatment of forgery I've read collapses into "Goodman says one thing, Dutton says another, next topic." My advisor thinks the whole debate is stale; I think it just hasn't been laid out properly. So I want you to build me a classification instrument — a decision tree or a short quiz with a scoring key, whichever ends up sharper — that sorts people by what they'd actually say about cases, not by which name they'd drop. Starting point: you've been looking at and loving a painting for years, and it's just been conclusively established as a forgery, one you can't tell from the original even hanging next to it. Endpoint: a named position on whether your admiration was misplaced the whole time. Each branch node should be a single claim that really does split the space — whether a work's identity includes its history of production, whether aesthetic value supervenes on what you can experience of the object, whether appreciating art is partly recognizing an achievement rather than just registering properties, whether "indistinguishable now" licenses "indistinguishable forever," whether the damage lands on the viewer, the imitated artist, the market, or the historical record, and whether your verdict is supposed to carry over unchanged to music, fiction, and (weirdly) to software. Phrase every node as a question someone could answer without already knowing which leaf it leads to.

  The leaves I need present, at minimum: the look-is-all-there-is view; the Goodman-flavored one where the forgery is a training device and present indistinguishability is a contingent, self-correcting state of affairs; Dutton's split between artistic and aesthetic value, on which the forgery is a fine picture and a failed performance; the achievement view that credits effort and risk-taking; a position that keeps your aesthetic response intact but calls the thing a fraud on someone other than you; the historicist view where a work is something like an indicated structure and forging is a category confusion; and the deflationary option that "the painting" was never the sort of thing that could be forged at all. Then mark any cell of the space that's coherent but empty, label it unnamed, and give me one sentence on whether nobody's there because it's incoherent, unattractive, or just unexplored. And flag honestly which pairs of leaves your instrument can't actually separate — I suspect the achievement view and the historicist view are going to come out the same on paper, and I want to know if that's a defect in the tree or a real convergence in the debate. No bibliography, please, I know where to look, I just want the instrument.

  Seed it with three cases I want threaded through the questions. First: a forger — call her Vess, purely invented — who serves her time, comes out, and paints under her own signature; the new work is honestly worse, but the collectors who bought the forgeries keep them on the wall and re-hang them as "anonymous, after [whoever]," and the prices don't drop. Does your tree route that to the same leaf as a straight con, and if not, what node did I miss? Second: a system that produces canvases in the manner of a living painter, with her knowledge and blessing, and she signs the back of the stretcher herself — forgery, collaboration, or a third kind of thing, and does the provenance node fire differently when the original author consents? Third, the reverse: an authenticated old master that everyone agrees is a dud, sitting next to a forgery of the same subject that everyone agrees is superb — can your tree preserve the intuition that the first is a bad something and the second a good non-something, or does it have to give that intuition up? Aim for roughly ten questions or nine leaves, one page-ish, and keep the questions concrete: no question should be anything like "do you think history matters to art?"
reasoning: |-
  Okay, the user is a TA for a grad seminar on authenticity in art, and they're frustrated with the stale Goodman vs. Dutton debate on forgery. They want a fresh approach—a classification tool like a decision tree or quiz that sorts people based on their actual responses to cases, not just name-dropping. The goal is to map out positions on whether admiration for a painting later revealed as a forgery was misplaced.

  First, I need to identify the key positions they listed: look-is-all-there-is, Goodman-esque, Dutton's split, achievement view, fraud on someone else, historicist view, and deflationary option. Plus, they want unnamed coherent positions flagged and any indistinguishable pairs noted.

  The user provided three seed cases to integrate:
  1. Vess the forger whose works are reattributed but still valued. Does the tree distinguish this from a straight con?
  2. A system producing art with the artist's consent and signature. Is this forgery, collaboration, or something else?
  3. An authenticated but bad old master vs. a superb forgery. Can the tree preserve the intuition that one is a bad artwork and the other a good non-artwork?

  The challenge is phrasing questions that are concrete and don't require prior knowledge. Questions should avoid abstract terms like "history matters" and instead focus on scenarios. For example, asking about reattribution after forgery exposure or consent in production.

  Structuring the decision tree:
  - Start with the core question: after discovering a forgery, is your admiration misplaced? This splits into yes/no branches.
  - Then, for "yes," probe why: is it because of aesthetic experience, achievement, or fraud? Each sub-question further refines the position.
  - For "no," explore reasons like unchanged aesthetic value or the deflationary view that the object wasn't forgeable.
  - The seed cases need to be woven in. For Vess, question 5 (reattribution) might show if the tree distinguishes consensual vs. deceptive contexts. The consent case (artist-approved system) ties into question 4 (author consent). The bad authentic vs. good forgery case tests if aesthetic and artistic value can be separated, covered in questions 3 and 7.

  Potential overlaps: The achievement view and historicist view might converge if both emphasize the artist's role. Need a question that separates them, perhaps about whether the work's identity is tied to its creation history (historicist) vs. the artist's effort/risk (achievement). Question 2 (aesthetic supervenes on experience) and question 3 (appreciation as recognizing achievement) could help differentiate.

  Unnamed positions: If someone thinks admiration is misplaced only due to fraud but not affecting aesthetic value, and it's not covered, that might be unnamed. Or if they think the object's identity is tied to provenance but admiration isn't affected—coherent but possibly unexplored because it's counterintuitive.

  Ensuring the tool is one-page with ~10 questions and 9 leaves. Each question must be concrete, using scenarios rather than abstract principles. The output should clearly map to the required positions and address the seed cases within the branching logic.
answer: |-
  Here’s a concise decision tree (9 leaves, 10 questions) prioritizing concrete cases over theory names. **Bold terms** mark key positions; *italics* indicate seed case integration.  

  ---

  ### **Authenticity Decision Tree**  
  *Start: You loved a painting for years; it’s now exposed as a forgery indistinguishable from the original.*  

  1. **When you learn it’s a forgery, does your *admiration for the work itself* noticeably fade?**  
     - **NO** → Go to Q2  
     - **YES** → Go to Q3  

  2. **Does the reattribution of Vess’s forgeries to “anonymous, after X” (*seed case 1*) make them fully legitimate artworks?**  
     - **YES** → **Deflationary View**: "The painting" never *was* an authentic artwork; it’s now correctly re-categorized as a derivative object. Your admiration wasn’t misplaced—just mislabeled.  
     - **NO** → **Fraud View**: Your aesthetic response is intact, but the work is a fraud on the artist/history/market. Admiration shifts to the object’s *appearance*, not its status.  

  3. **Is your faded admiration due to feeling the *aesthetic experience* is now flawed?**  
     - **NO** → Go to Q4  
     - **YES** → **Look-Is-All View**: Aesthetic value supervenes on perceptible features. If indistinguishability holds, your fading admiration is irrational. *But in practice, we can’t un-know provenance.*  

  4. **If an AI system makes a painting with a living artist’s consent/signature (*seed case 2*), is it equivalent to her hand-made work?**  
     - **YES** → **Unnamed Position**: Admiration fades only for *non-consensual* forgeries. Coherent but unexplored (prioritizes consent over process).  
     - **NO** → Go to Q5  

  5. **After exposure, would rehanging the forgery as “Anonymous, after X” (*seed case 1*) restore your full admiration?**  
     - **YES** → **Goodman-Esque**: Forgery is a training tool; "indistinguishable now" ≠ indistinguishable *after* forensic/historical correction. Admiration was provisional.  
     - **NO** → Go to Q6  

  6. **Is the key problem that you *mistook the forger’s achievement* for the original artist’s?**  
     - **YES** → Go to Q7  
     - **NO** → Go to Q8  

  7. **Could a superb forgery of a *dud* old master (*seed case 3*) be a greater artistic achievement than the authentic work?**  
     - **YES** → **Achievement View**: Artworks demand creative effort/risk. Forgery lacks this, so admiration *for the work as art* was misplaced (even if it’s a beautiful object).  
     - **NO** → **Historicist View**: A work is an "indicated structure" tied to its origin. Forgery is category confusion—it *cannot* be the same artwork. Admiration was for a fiction.  
       *🚩 Convergence Alert*: Achievement/Historicist often align here. Split rests on whether "achievement" requires *originality* (Historicist) or *skill* (Achievement).  

  8. **Does the forgery’s exposure primarily damage the *historical record*, not your experience?**  
     - **YES** → **Dutton-Esque Split**: Artistic value (achievement/history) ≠ aesthetic value (appearance). Forgery is a "fine picture" but failed *artwork*. Admiration for aesthetics wasn’t misplaced.  
     - **NO** → Go to Q9  

  9. **Is the core issue that the forger *deceived the market*, not you?**  
     - **YES** → **Fraud View** (as in Q2): Admiration stands, but the object is tainted by deceit.  
     - **NO** → **Historicist View** (as in Q7): The work *itself* is ontologically invalid.  

  ---

  ### **Seed Case Outcomes**  
  - **Vess Case (1)** → Splits at **Q5**. Reattribution "fixes" the work for Goodman-esque/Deflationary views; Fraud/Achievement/Historicist deny full restoration.  
  - **Consensual System (2)** → Splits at **Q4**. Consent *changes* the outcome for most views (e.g., not fraud/category error).  
  - **Bad Authentic vs. Good Forgery (3)** → Tested at **Q7**. Achievement/Historicist preserve "bad something vs. good non-something"; others reject the dichotomy.  

  ### **Unnamed Position**  
  - **Q4 YES branch**: Admiration fades *only* for non-consensual forgeries. Plausible but unexplored (likely due to focus on paradigmatic deceit-based forgeries).  

  ### **Indistinguishable Pairs**  
  - **Achievement/Historicist** (Q7→NO): Hard to separate without emphasizing *originality* (Historicist) vs. *skill* (Achievement). The tree flags this as a genuine debate overlap.  
  - **Fraud View** (Q2 NO / Q9 YES): Same output, but different emphasis (market vs. artist harm).  

  ### **Design Notes**  
  - **Avoids abstraction** by anchoring questions in actions (rehanging, consent, reattribution).  
  - **Convergence** in Achievement/Historicist reflects the debate; the tree exposes it rather than forcing separation.  
  - **One page** by pruning redundant branches (e.g., Q6/Q7 isolate achievement-focused views).  

  Use this to map student intuitions first, *then* reveal theory labels—it’ll show why the debate feels "stale" when positions share deep structural commitments.
