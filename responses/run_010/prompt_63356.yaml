  ## The Story

  The groan of the old manual gates echoed through the control room, a deep-throated protest against the torrent they were releasing. Mara wiped sweat from her forehead with the back of her wrist, leaving a smudge of grease. Rain lashed the reinforced windows, blurring the floodlights illuminating the churning white water cascading down the primary spillway. The reservoir was a dark, swollen beast straining against its concrete cage, inches from the top. The digital readout on the new automation panel pulsed a steady, accusing green: **HOLD PROTOCOL ACTIVE**.

  Her shift had been a relentless dance of defiance against the blinking lights. The new system, installed after the Authority decided past operators were too quick to dump precious reserves, was designed to cling to every drop until the absolute last safe moment. Tonight, with the drought-breaking storm hammering the catchment, "last safe" was a moving target Mara couldn’t trust the automation to hit for Valley West. Valley East, however… Valley East flooded if the reservoir topped out. It was a brutal seesaw.

  The phone jangled. *Duty Engineer*. Again. Mara grabbed it, her voice raspy. "Control."

  "Level’s still climbing, Mara. Automation still overriding?"

  "Manually releasing via primary spillway," she confirmed, her eyes fixed on the secondary, automated spillway’s status panel. Its indicators were ominously dark. "Automation’s *insisting* on holding. Secondary spillway remains inactive."

  "Right. Keep overriding the holds. We need to bleed off *now* to protect West." He paused. "Any flicker from the secondary system?"

  "Nothing. Solid green HOLD." She knew what he was asking. The secondary system, for all its modern promise, had an infamous quirk: under extreme pressure surges, its sensors could fault. Instead of releasing, it sometimes defaulted deeper into HOLD, refusing to budge even when water was lapping the parapet. The only way to *make* it release in that state was a complex, multi-step manual override buried in its diagnostics – an intervention to *force* it to do its job. To *not* flood Valley East tonight, if that fault triggered, she’d have to actively wrestle the machine. To protect West *now*, she had to actively fight the system’s desire to hold.

  "Understood. Keep at it. Every override counts for West." The line clicked dead.

  Mara leaned back, the worn vinyl of the chair creaking. She stared at the two panels. To protect Valley West, she had to *do* something, repeatedly, deliberately: override the HOLD command cycle after cycle, forcing the manual gates open wider. Each override was a positive act, a keystroke and confirmation against the system’s will. Her fingers ached from the repetition. But to protect Valley East... if the automation faulted later? Protecting East meant being ready to perform that complex, active override on the secondary system. *Not* flooding East would require frantic *doing* in that scenario.

  Jen stumbled in at 3:55 AM, the smell of damp rain gear cutting through the room’s stale air of ozone and old coffee. Her eyes were red-rimmed, her movements heavy as she shrugged off her coat. "Hell of a night," she mumbled, collapsing into the spare chair. She glanced at the primary spillway release logs scrolling on a secondary monitor. "Still fighting the box?"

  "Every fifteen minutes," Mara sighed, initiating another override sequence. The green HOLD light flickered red for a moment – **OVERRIDE ACCEPTED** – then stubbornly returned to green. The groan outside deepened slightly. "It’s like trying to bail out a sinking ship with a thimble while someone keeps turning off the pump."

  Jen grunted, pouring cold coffee from the untouched pot into a chipped mug. She didn’t drink it, just cradled it for warmth. "West will be grateful. If it works."

  "If," Mara echoed. She gestured vaguely at the secondary panel. "But look at this mess. To *not* flood East later, if that thing glitches... Jen, I’d have to *do* something pretty drastic to the secondary system. Actively force it to release. But right now, to *not* flood West, I have to *do* this." She tapped the override console. "All night. Constant action. My ‘inaction’ – just letting the automation hold – would be catastrophic for West. But it would take *less* effort. Sitting here, hands off, coffee in hand? That’s the path to drowning West. ‘Doing nothing’ here… it’s the *lazy* option that kills people. Stopping East later? That’ll take sweat and swearing." She rubbed her temples. "It’s backwards. Preventing the bad thing… it takes more movement, more deliberate fiddling, than letting it happen. How does the ‘did she do it or let it happen’ line even *work* here? The shape of the alternatives is all twisted."

  Jen stared at the reservoir level graph, a steep, terrifying climb momentarily blunted by each of Mara’s override spikes. "Shape of alternatives? Verbs?" She scoffed, a dry, tired sound. "Who cares? Look at the water, Mara. Look at the damn graph. People are going to get flooded. Either West gets it early because we held too long waiting for the automation to maybe-fault, or East gets it later because we dumped too much early and the reservoir peaked too high before the fault *did* kick in. Or both get it because we screwed the timing. The only thing that matters in that report," she jabbed a finger at the terminal where the incident log template waited, blank and accusing, "is whether the choices made ended up better or worse than other choices *could* have. Whether people ended up drier or wetter. Arguing over whether you ‘killed’ West by overriding or ‘killed’ East by *not* overriding fast enough later? That’s just… bookkeeping. Morality by spreadsheet. The valleys don’t care about your verbs. They care about the water."

  The storm raged outside. The phone stayed silent. The green HOLD light glowed. Mara’s next override prompt flashed on the screen. She moved to execute it, her movements automatic now, driven by fatigue and the visceral image of Valley West’s main street underwater. Jen just watched the level, her untouched coffee growing colder.

  ***

  The grey light of dawn stained the sky when the internal comm crackled. "Control, this is Field Team Alpha. We’re at the secondary spillway headworks. Confirming… automation fault. Sensors locked on HOLD. Water is… cresting the auxiliary overflow. Repeat, secondary system fault confirmed. Water is topping auxiliary."

  Mara froze, her finger hovering over the next override prompt for the *primary* gates. Valley West needed that water kept flowing out. But Valley East… The auxiliary overflow was minimal. To prevent catastrophic flooding in East *now*, she needed to perform the active, complex override on the *secondary* system – right this second. Two deliberate acts demanded simultaneously: keep overriding primary for West, *and* initiate the secondary override for East.

  Jen was already lunging for the secondary panel manual. "Override sequence! Now! Give me the codes!" Her fingers flew over the keypad, pulling up buried menus, entering authorization strings Mara dictated between commands for the primary system. It was frantic, clumsy, a desperate ballet fought on two fronts against a machine that resisted release on one side and demanded constant prodding to release on the other.

  The secondary spillway gates finally, sluggishly, began to open. Too late? Mara didn’t know. The water finding the auxiliary overflow first was bad news for East. Her primary overrides continued, a drumbeat of necessity for West. The room filled with the sound of rain, groaning metal from both spillways now, frantic keystrokes, and Jen’s muttered curses.

  ***

  Later, the sun a pale disc behind thinning clouds, the Duty Engineer stood in the control room. Reports were trickling in: significant flooding in Valley West’s low-lying areas. Serious inundation starting in Valley East near the secondary spillway’s auxiliary channel, stabilized now that the main gates were open. Both valleys had taken hits. The reservoir level was finally falling steadily under the combined release.

  The preliminary incident report draft glowed on the main screen. Most of it was dry technical detail: storm intensity, reservoir inflow rates, system status logs. Then came the crucial summary sentence, the one requiring their sign-off:

  **"Operator intervention prevented automatic HOLD protocol execution on the primary spillway during the critical early surge period. Subsequent manual override was required to activate the secondary spillway following confirmed system fault."**

  Mara stared at it. *"Operator intervention prevented..."* It framed her constant overrides as a *positive action* that *stopped* the system (the HOLD protocol). But stopping the HOLD was what *released* the water that flooded West. And "prevented automatic... execution" sounded like she *did* something that caused a *failure* (the system not holding), when actually, the system *was* holding – she was fighting it. Saving East later required *another* intervention. The verbs felt like traps. What was the alternative shape? Letting the automation hold would have been passive for her, but disastrously active for West. Letting the secondary fault persist would have been passive, but murderously active for East. Her night was a maze where preventing harm required constant, exhausting *doing*.

  Jen jabbed a finger at the sentence. "See? Verbs. ‘Intervention prevented’. ‘Override required’. It’s obsessed with *what we did to the machine*. Not with Valley West getting three feet of water in their shops because we *didn't* hold! Or East getting flooded because the *machine* faulted and we were too busy fiddling the primary overrides to catch it faster!" She slumped, rubbing her eyes. "Does that sentence tell anyone whether we made things *better* or *worse*? Does it tell them how much water ended up where? Or does it just set up the lawyers to argue whether we ‘caused’ West by acting or ‘caused’ East by not acting fast enough later? It’s tracking nothing real. Just how much we touched the buttons."

  They looked at the sentence together. Mara saw the phantom movements of her hands on the consoles, the deliberate acts that felt like both salvation and violation. Jen saw the muddy waterline rising on buildings miles away, indifferent to the control room's frantic dance. The cursor blinked patiently after the final period, waiting for authorization neither operator could yet give. The cold coffee sat forgotten between them.

  ## Where I Bent It

  The core philosophical distinction between "doing" (actively causing harm) and "allowing" (failing to prevent harm) is famously contested, and the reservoir scenario inherently strains it. Here’s where the fiction simplifies or leans on specific interpretations:

  1.  **Mara's "Shape of Alternatives" View:** Her articulation ("if only a few actions cause harm, you did it; if most prevent it, you let it happen") is a rough, character-specific paraphrase drawing on ideas like Jonathan Bennett's "range of possibilities" analysis. Real philosophical treatments are far more nuanced, involving concepts like normativity, intention, and baseline expectations. The story simplifies this complexity into an intuitive, exhausted observation. Mara focuses on the *effort* and *deliberateness* required for prevention versus inaction, which leans into a more consequentialist/descriptive reading of the distinction rather than a purely deontological one centering on rights or duties. Philosophers like Philippa Foot or Judith Jarvis Thomson might argue the distinction holds based on different principles (e.g., positive vs. negative duties), which Mara doesn't articulate.
  2.  **The Automation's Role:** The scenario hinges on the automation fault *defaulting to HOLD*, making non-intervention later an active *cause* of East's flooding. This "default to harm" setup is crucial for creating the inversion Mara experiences. Philosophically, this leans on the idea that allowing harm requires a *failure to activate a mechanism designed to prevent it* when you have the capacity and duty to do so – making it morally equivalent (or close) to doing harm. Critics might argue that the machine's fault is the primary cause, and the operator's *failure to override* is merely allowing *that cause* to play out, preserving the distinction. The story assumes Mara/Jen's duty makes the override failure a morally significant act of "doing" in this context.
  3.  **Jen's Consequentialism:** Jen's dismissal of the doing/allowing distinction as "bookkeeping" simplifies consequentialism. While she's right that outcomes matter, consequentialism doesn't necessarily *ignore* the distinction; it might just weigh the *consequences* of actions vs. omissions differently depending on context. Her position represents a pure "outcomes are all that matter" view, which is a strong, contested stance within consequentialism itself (e.g., rule vs. act consequentialism). Her irritation focuses on the *report*'s framing, implying that the institutional response gets bogged down in verbs, which is a narrative device highlighting the practical friction of the philosophical debate.
  4.  **Symmetry & Blame:** The scenario presents a near-impossible choice where both valleys flood regardless of significant effort, making *both* characters partially "right" in their frustration. This avoids the cleaner moral judgments of classic cases (like the Trolley Problem) and leans into the messy reality the user wanted. However, it subtly implies that *some* flooding was inevitable, potentially letting the operators/system off the hook slightly compared to a scenario where perfect choices could have prevented *all* harm. The focus remains on the *distinction itself* being blurred, not on assigning ultimate blame.
