prompt: |-
  I run a small community foundation — six staff, about forty volunteers — and we administer a hardship fund whose donor deed says the money is for people whose difficulties arose without fault of their own. That's my paraphrase, the deed is worse. We get roughly 900 applications a year, grants run from 200 to 3,000 pounds, and each one is assessed by a volunteer with no legal or philosophical training, working from documents only: bank statements, a GP letter, a landlord's notice, a P45. Fifteen minutes a file. The written reason goes back to the applicant, and every refusal is appealable to a three-person panel.

  Years ago a board member read something about luck egalitarianism — inequalities being unjust when they come from luck rather than choice, Dworkin's brute luck versus option luck — and it quietly became our unofficial theory. We've never managed to turn it into anything a volunteer can actually run. What we do instead has a phrase: going up the ladder. You ask whether the mess was a choice, then you ask what caused the choice, then what caused that, and we have no rule for how many rungs anyones allowed to climb before you stop and call the thing circumstance. Two volunteers will climb to different heights on files that look identical, and I have the appeal numbers to prove it.

  So: can you write us the procedure itself? The questions to ask in order, what counts as a sufficient answer to each given only what's in the file, where the ladder stops and on what grounds, where the procedure terminates in a no, and where it has to stop and hand the file up to me or the panel because the question is one of values rather than fact. It has to be usable by someone who's never heard of any of this, and it can't assume we can investigate an applicant's character or intentions — file facts only. We've decided, I think rightly, that asking volunteers to judge someone's will is both impossible and demeaning, and I don't want that smuggled back in through a cleverer wording.

  Then run it on three files we're arguing about right now. (a) A woman who borrowed to open a bakery two years ago; the business is dead, she has two kids and an eviction notice. (b) A man who gave up full-time work for fifteen years to look after his mother; she died in March, he has no pension and no recent work history at all. (c) A young man who rode without a helmet, crashed, and has a head injury that keeps him out of work. Be straight with me about (c) — I already suspect a strict procedure either refuses him or has to smuggle something in at step two, and I'd rather be told which.

  And tell me where the thing will misfire. Which steps are judgment calls dressed up as procedure, what a luck-egalitarian procedure structurally can't see, and — I've read enough of the criticism to know people say this whole approach humiliates applicants and abandons exactly the people a fund like ours exists for — whether your procedure can absorb that objection or whether you'd redesign around a different metric entirely. Finally: what would change your mind about the design you're recommending, and where is your reasoning most likely to fail?
reasoning: |-
  Hmm, the user runs a small community foundation with a hardship fund, and they're dealing with a complex philosophical framework applied to real-world grant decisions. They need a practical procedure that volunteers can use in 15 minutes per file, based solely on documents, without judging character or intentions. 

  The core challenge is operationalizing "luck egalitarianism" - distinguishing between hardships caused by brute luck (circumstances beyond one's control) versus option luck (consequences of conscious choices). Their current "ladder" approach is inconsistent because volunteers arbitrarily decide how far back to trace causality. 

  Key constraints:
  - Must use only documentary evidence (bank statements, medical letters, etc.)
  - No character judgments
  - Must fit within 15-minute assessment window
  - Needs clear stopping rules
  - Must produce defensible written reasons

  The three test cases are revealing:
  (a) Bakery owner: Business failure could be bad luck (market crash) or choice (risky investment)
  (b) Caregiver: Sacrifice appears voluntary but may have had no real alternatives
  (c) Unhelmeted cyclist: Clear choice but severe consequences - the ethical tightrope case

  The procedure I'm designing needs:
  1) A strict document-focused lens
  2) Sequential yes/no gates
  3) Explicit "handoff points" for value judgments
  4) Built-in consistency checks
  5) Acknowledgement of systemic blind spots

  For the cyclist case (c), honesty is crucial - a pure luck egalitarian approach would refuse him since the injury resulted from a choice. Any exception would violate the framework. Better to acknowledge this limitation upfront than create loopholes.

  Potential failures to flag:
  - Will still have borderline cases requiring escalation
  - Can't capture coercive circumstances (e.g., "voluntary" caregiving due to lack of social services)
  - May exclude people facing compound disadvantages
  - Written reasons might still feel stigmatizing despite procedural fairness

  The redesign considerations are vital - if the community's values conflict with strict luck egalitarianism (e.g., wanting to help the cyclist anyway), they might need to:
  - Explicitly add humanitarian exceptions
  - Shift to a vulnerability-based framework
  - Create separate criteria for catastrophic outcomes

  Final validation test: Would this procedure have refused the cyclist without moral contortions? If yes, it's philosophically honest but may require the foundation to reconsider their underlying principles.
answer: |-
  Here's a procedural framework designed for your constraints: document-based, time-bound, volunteer-friendly, avoiding character judgments, with clear escalation points. It replaces the infinite ladder with a **causal chain analysis limited to two steps**, focused on *documented constraints on choice*.

  ---

  ### **The Procedure: "Causal Chain Assessment"**
  **Core Principle:** We assess whether the hardship resulted primarily from *constrained choices* (brute luck) or *unconstrained choices* (option luck). "Constrained" means the applicant had no reasonable alternative due to circumstances visible in documents.

  #### **Step 1: Identify the Immediate Cause of Hardship**
  - **Question:** "What specific event/condition in the documents directly caused the current crisis (e.g., eviction, job loss, medical emergency)?"
  - **Documents Required:** Landlord notice, P45, GP letter, redundancy letter, etc.
  - **Stop & Grant If:** The cause is *unquestionably external* (e.g., factory closure, cancer diagnosis, flood damage). *No further steps.*  
  - **Proceed If:** The cause involves an applicant action (e.g., quitting job, starting business, accident during risky activity).

  #### **Step 2: Trace to First Documented Constraint**
  - **Question:** "Do the documents show a *material constraint* forcing that action? Focus on: **Health limitations, financial coercion, legal obligations, or care duties.**"
  - **Sufficient Evidence:** 
    - GP letter confirming illness/disability affecting decision.
    - Bank statements showing unaffordable costs for alternatives.
    - Court order (e.g., custody agreement requiring reduced work).
    - Death certificate/carer’s allowance proof creating care duty.
  - **Stop & Grant If:** A constraint is documented AND directly linked to the action. *Example: Quit job to care for dying parent (death cert + carer’s letter).*  
  - **Proceed If:** No constraint is documented OR the link is unclear.

  #### **Step 3: Assess Alternative Options (Final Step)**
  - **Question:** "Could a reasonable person have avoided the action without severe consequences, based *only* on file facts?"
  - **Evidence Check:** 
    - Were alternatives *financially impossible* per bank statements? 
    - Were alternatives *physically impossible* per medical evidence?
    - Was there a *legal requirement* (e.g., court order)?
  - **Grant If:** Documents prove alternatives were **objectively unviable** (e.g., no savings to avoid loan, disability preventing other work).  
  - **Refuse If:** Alternatives were viable per documents (e.g., savings unused, no health barrier mentioned).  
  - **Escalate If:** Viability hinges on contested facts OR requires moral judgment (e.g., "Was caring for mom *reasonable* when state care existed?"). Send to you/panel.

  #### **Termination Rules:**
  - **Grant:** Steps 1 or 2 show brute luck; Step 3 shows constrained choice.
  - **Refuse:** Step 3 shows unconstrained choice with viable alternatives.
  - **Escalate:** Ambiguous documents, conflicting evidence, or value judgments needed.

  ---

  ### **Application to Test Cases**
  ***(a) Bakery Owner (Eviction after business failure)***  
  - **Step 1:** Immediate cause = business failure (loan docs + bank statements). Proceed.  
  - **Step 2:** Why start business? No health/job loss in file; no evidence of coercion. Proceed.  
  - **Step 3:** Alternatives? File shows no disability, no redundancy pre-loan. Could she have sought work? No proof alternatives were unviable.  
  - **Outcome:** **Refuse** (option luck). *Escalate if she claims unrecorded disability or recession proof.*  

  ***(b) Full-Time Caregiver (No pension/work history after mother’s death)***  
  - **Step 1:** Immediate cause = no income (bank statements + death cert). Proceed.  
  - **Step 2:** Why no work history? Documents show care duty (death cert + possible carer’s allowance).  
  - **Outcome:** **Grant** (brute luck – care was constrained by duty). *No Step 3 needed.*  

  ***(c) Unhelmeted Cyclist (Head injury preventing work)***  
  - **Step 1:** Immediate cause = head injury (GP letter). Proceed.  
  - **Step 2:** Why no helmet? No medical/logistical constraint in file (e.g., no GP note saying "couldn’t afford helmet" or "balance disorder").  
  - **Step 3:** Alternatives? Could he have worn one? File shows no financial barrier (bank statements pre-accident) or physical constraint.  
  - **Outcome:** **Refuse** (option luck). *You’re right: a strict procedure refuses him. Escalation can’t overturn without smuggling in compassion, which violates the deed.*  

  ---

  ### **Where It Misfires & Limitations**  
  1. **Judgment Calls Disguised as Procedure:**  
     - "Reasonable person" standard (Step 3) is subjective. Volunteers may interpret "viable alternatives" differently based on implicit bias.  
     - **Mitigation:** Strictly tie to documents (e.g., "If savings > £X, alternative exists unless medical proof bars work").  

  2. **Structural Blind Spots of Luck Egalitarianism:**  
     - **Ignores Systemic Injustice:** A Black single mother’s "choices" may be shaped by racism/sexism invisible in documents. Procedure may refuse her.  
     - **Punishes Compound Disadvantage:** Someone with poor education (brute luck) makes a "bad choice" – procedure blames them.  
     - **Demands Intrusive Proof:** Applicants must document constraints (e.g., "Prove you couldn’t afford a helmet"), which can feel humiliating.  

  3. **Can the Procedure Absorb Criticism?**  
     - **Partial Fixes:** Escalation panels can apply equity lenses for systemic cases, but this bends the theory.  
     - **Fundamental Conflict:** Luck egalitarianism *requires* refusing cases like the cyclist. If this feels wrong, **redesign around vulnerability, not luck**:  
       - *Alternative Metric:* "Grant if applicant is in acute hardship AND lacks resources to recover independently."  
       - This helps the cyclist but may conflict with your deed’s "no fault" clause.  

  ---

  ### **What Would Change My Mind?**  
  - **Evidence of Systematic Exclusion:** If data shows refugees/disabled/chronically ill are disproportionately refused at Step 3, add constraints (e.g., "Assume systemic barriers if applicant is in [protected group]").  
  - **Deed Ambiguity:** If "without fault of their own" legally permits moral discretion, reintroduce a panel at Step 3 for compassion.  
  - **Volunteer Feedback:** If they consistently escalate "obvious" cases, the procedure is too rigid.  

  ### **Where Reasoning Fails**  
  - **Invisible Constraints:** Volunteers can’t assess coercion (e.g., domestic violence) without investigative power.  
  - **False Positives:** A savvy applicant with good documentation may get grants despite option luck (e.g., "bought helmet but didn’t wear it" – if not in file, it’s granted).  
  - **Moral Luck:** The cyclist’s *outcome* was worse than his *fault* – punishing him may feel disproportionate.  

  ---

  ### **Recommendation**  
  This procedure brings consistency and avoids character judgments, but it *will* refuse sympathetic applicants like the cyclist. If your foundation’s values clash with this outcome:  
  1. **Redefine your theory** (e.g., "Help all with catastrophic outcomes regardless of cause").  
  2. **Adjust the deed** to allow humanitarian exceptions.  
  3. **Keep appeals panels robust** – they’re your pressure valve.  

  **Final Design:** Pair this procedure with mandatory bias training and quarterly review of refusal/appeal data to catch inequities.
