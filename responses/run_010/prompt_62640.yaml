prompt: |-
  I edit a small popular-history magazine and I've been asked to write the one-page test our readers' panel uses to decide whether a submission is pseudohistory or just an unfashionable opinion. Every draft I write falls over on some case I bring to the next meeting, so before I try again I want the spec rather than another draft: what does a criterion for calling something pseudohistory actually have to deliver?

  Give me the requirements, with the case or the consideration behind each, and mark which ones are non-negotiable and which are really just one camp's taste dressed up as a standard. I already suspect that must-be-falsifiable and must-have-a-mechanism are carrying more weight than they can bear.

  Here's the pile my drafts keep tripping on. Atlantis: taken as a bare claim, that there was an advanced civilisation somewhere that collapsed, it's an ordinary empirical hypothesis, so the defect can't be improbability — and I cant seperate the claim from the practice, where the site relocates to Thera or Antarctica or the Richat Structure every single time somebody goes and looks. Göbekli Tepe and the other genuinely spectacular recent digs, which are peer-reviewed and real and also load-bearing for exactly that kind of story, so a criterion keyed on fabricated evidence is out too. Fomenko's chronology: credentialed mathematician, wall of statistics, testable, tested, failed — which is why 'they arent testable' can't be the test either. Schliemann, who wrecked strata, overclaimed a hoard from the wrong millennium, and still came out roughly right about Troy. The Norse in Newfoundland, treated as saga nonsense until the Ingstads dug it up. And that 2021 peer-reviewed paper about an airburst flattening a Jordan Valley city, which the journal retracted four years later after a documentary machine had been running behind it the whole time.

  One more constraint that I think gets ignored: the criterion can't classify ordinary historical inference as pseudohistorical. Historians abduce motives out of thin records all day and the past doesn't rerun, so whatever the difference is, it can't just be thin evidence plus no repeat experiments.

  My suspicion, and tell me if I'm wrong, is that you can have at most two of these: a rule a smart non-specialist can apply before the digging is done; a rule that isn't just whatever the experts currently say; and a rule that doesn't retroactively stamp the Vinland vindication as pseudohistory. Say which pair you'd keep and why.

  Then tell me which single requirement does the most work knocking out existing criteria, and give me two lines each on how the falsifiability move, the degenerating-research-programme move, and the sociological one about refusing to engage the scholarly community do against the list. No reading list, I'm not going to read it.
reasoning: |-
  Okay, the user is an editor for a small popular-history magazine and needs to create a one-page test to distinguish pseudohistory from legitimate but unfashionable historical opinions. They've struggled because every draft fails when tested against specific cases like Atlantis, Göbekli Tepe, Fomenko's chronology, Schliemann, the Norse in Newfoundland, and a retracted peer-reviewed paper about an airburst. 

  The user wants the specifications for what makes a criterion effective, including which requirements are non-negotiable versus those that are subjective. They suspect that falsifiability and requiring a mechanism are overemphasized. They also need the criterion to avoid misclassifying ordinary historical inference as pseudohistory, since historians often work with thin evidence without repeatable experiments.

  Hmm, the core challenge is defining pseudohistory without relying on current expert consensus, while being applicable by non-specialists and not invalidating cases like Vinland that were initially dismissed but later proven true. The user also wants to know which two of three conflicting goals to prioritize: simplicity for non-specialists, independence from expert consensus, and not misclassifying vindicated claims.

  The user's examples highlight key pitfalls. Atlantis is problematic because the claim itself isn't improbable, but the practice shifts evidence constantly. Göbekli Tepe shows that spectacular but real finds can support pseudohistorical narratives, so fabricated evidence isn't a reliable marker. Fomenko's work was testable but failed, so testability alone isn't sufficient. Schliemann used flawed methods but was roughly correct, indicating that methodological errors don't always equal pseudohistory. The Norse in Newfoundland was initially dismissed as legend but proven true, showing that a criterion shouldn't reject claims just because they challenge consensus. The retracted paper demonstrates that peer review isn't foolproof.

  The non-negotiable requirements should include: 
  - Resistance to counterevidence (since pseudohistory often ignores disproof, like Atlantis relocations)
  - Methodological isolation (pseudohistory avoids engagement with mainstream scholarship, unlike ordinary historical debates)
  - Preservation of ordinary historical reasoning (since historians legitimately use abduction and can't rerun the past)

  Negotiable requirements might include testability and falsifiability, as these are often misapplied. The requirement for a mechanism is particularly problematic because history often deals with motives and contingencies without clear mechanisms.

  Prioritizing simplicity for non-specialists and avoiding misclassification of vindicated claims (like Vinland) makes sense, as these are practical needs for the magazine's readers. Sacrificing independence from expert consensus is necessary because non-experts can't realistically evaluate historical claims without some reference to scholarly engagement.

  Among existing criteria, resistance to counterevidence does the most work. It excludes Atlantis (constant relocation), Fomenko (ignored failed tests), and the retracted paper (documentary ignored criticism). It doesn't exclude Vinland, as the claim wasn't modified to evade disproof.

  Falsifiability fails because many pseudohistorical claims are testable but then evade results (like Fomenko). Degenerating research programs don't fit history well, as fields can be fruitful even with slow progress. The sociological criterion (refusing peer engagement) is strong but risks overreach if applied too rigidly to legitimate heterodox work.

  In summary, the test should focus on how claims respond to counterevidence and whether they engage with mainstream scholarship, while accepting that expert consensus is a necessary reference point for non-specialists.
answer: |-
  Here's the specification you need, distilled from your cases and constraints. Non-negotiables (NN) are core to pseudohistory's defining flaws. Negotiable/"Taste" items (T) often reflect disciplinary norms or gatekeeping but aren't inherently disqualifying.

  ### Requirements for a Pseudohistory Criterion
  1.  **Resistance to Counterevidence (NN):** The core claim or core evidence must demonstrate systematic immunity to disproof or significant counter-evidence. When faced with disconfirmation, the *core idea* doesn't adapt or get discarded; instead, auxiliary hypotheses proliferate, evidence relocates, or disproof is dismissed via conspiracy/cover-up *without compelling independent justification*.
      *   *Case: Atlantis* (site shifts constantly), *Fomenko* (ignores failed tests/contradictions), *Retracted Paper* (documentary persisted despite scholarly critique *before* retraction).
      *   *Counter: Vinland* – Evidence *was* sought and found; the claim didn't mutate to evade disproof. *Schliemann* – Overclaimed specific details but accepted core corrections (Troy's location/era). *Ordinary History* – Theories evolve/are abandoned based on evidence.

  2.  **Methodological Isolation / Rejection of Standard Tools (NN):** Proponents systematically reject, bypass, or redefine fundamental historical methods (source criticism, stratigraphy, linguistics, peer review) *when they yield inconvenient results*, rather than engaging rigorously with them. They operate in a parallel epistemic universe.
      *   *Case: Fomenko* (rejects carbon dating, textual criticism), *Atlantis (common variants)* (ignore geology, archaeology when inconvenient), *Retracted Paper Documentary* (bypassed ongoing peer critique).
      *   *Counter: Göbekli Tepe Researchers* – Use standard methods, publish in peer-reviewed journals, engage critics. *Schliemann* – Used (flawed) excavation methods standard *for his time*, engaged with peers (even if combatively). *Ordinary Unfashionable Opinion* – Argues *within* the methodological framework.

  3.  **Preservation of Ordinary Historical Abduction (NN):** The criterion **must not** classify standard historical inference (abduction from fragmentary evidence, proposing motives, interpreting ambiguous sources) as pseudohistorical simply due to lack of definitive proof or repeatability. The flaw lies in *how* the reasoning is conducted, not the inherent uncertainty of history.
      *   *Case: Your core constraint.* Historians *must* infer motives, connect dots thinly. Pseudohistory mistakes the *process*.
      *   *Counter: Pseudohistory often mimics abduction poorly* – e.g., ignoring simpler explanations, forcing patterns.

  4.  **Not Solely Dependent on Current Expert Consensus (T):** While consensus is a heuristic, a criterion relying *only* on "experts reject it" fails against *Vinland* and risks stifling legitimate revisionism. Consensus is evidence, not the definition.
      *   *Case: Vinland* – Initially dismissed by consensus. *Göbekli Tepe Interpretation* – Challenged prior consensus significantly but methodologically.
      *   *Note:* This is often *dressed up* as a standard ("real scholars agree...").

  5.  **Not Solely Dependent on Falsifiability/Testability (T):** Many pseudohistorical claims *are* technically testable (Fomenko!) but evade the results. Conversely, complex historical claims can be hard to *definitively* falsify.
      *   *Case: Fomenko* – Testable, tested, failed, ignored. *Atlantis (basic claim)* – Vaguely testable in principle.
      *   *Problem:* "Must be falsifiable" is often misapplied as "must be *easily* falsifiable *now*" or conflated with "must have a proven mechanism."

  6.  **Not Solely Dependent on Evidence Fabrication (NN):** While common, fabrication isn't *necessary*. Pseudohistory often misuses, misinterprets, or selectively ignores *real* evidence.
      *   *Case: Göbekli Tepe (misuse by others)* – Real site used to support wild claims via selective reading/ignoring context. *Atlantis (Richat, etc.)* – Uses real geological features.
      *   *Counter:* Fabrication *is* a hallmark of much pseudohistory (Piltdown Man), but not universal.

  7.  **Not Solely Dependent on Improbability (T):** History is full of improbable things that happened. The *specificity* and *evasion* matter more than raw improbability.
      *   *Case: Atlantis (basic claim)* – Advanced civs collapsing isn't inherently improbable (Bronze Age Collapse). *Airburst (initial claim)* – Cosmic impacts *are* improbable events, but the *specific evidence* was the issue.

  ### Which Pair to Keep? (Smart Non-Specialist Applies + Doesn't Retroactively Condemn Vinland)
  *   **Keep:** **Smart Non-Specialist Applies** + **Doesn't Retroactively Condemn Vinland**.
  *   **Why:** Sacrificing "Not Just What Experts Say" is the least harmful. Non-specialists *need* heuristics. "Engagement with mainstream methods/evidence" (Req 2) is a *proxy* for expert consensus but focuses on *process* rather than just *current opinion*. Vinland's proponents (Ingstads) *used* mainstream methods (archaeology, saga analysis) to *find* evidence within the existing framework. Pseudohistory rejects the framework itself when inconvenient. This pair prioritizes practical usability and avoids the worst historical injustices.

  ### The Single Requirement Doing the Most Work Knocking Out Existing Criteria
  *   **Resistance to Counterevidence (Req 1).**
      *   **Knocks Out:** "Must be falsifiable" (Fomenko *was* falsifiable, failed, ignored). "Must have a mechanism" (Atlantis often lacks one, but that's not its core flaw; the flaw is moving the goalposts). "Expert consensus" (Vinland was falsified *by consensus* until proven right, but the *claim itself* didn't evade disproof - evidence was eventually found *using standard methods*). "Improbability" (Basic claim isn't wildly improbable).

  ### Quick Takes on Existing Moves vs. Your Pile
  1.  **Falsifiability:**
      *   *Fomenko:* Testable, tested, failed – so falsifiability *passes* him, but he ignores results. **Fails.**
      *   *Atlantis (basic claim):* Vaguely falsifiable? But practitioners evade falsification constantly. **Inadequate.**
      *   *Vinland:* Falsifiable (find the site). **Passes correctly, but was initially deemed falsified/false.**
      *   *Problem:* Doesn't address *evasion* of falsification.

  2.  **Degenerating Research Programme (Lakatos):**
      *   *Fomenko:* Perfect example – core theory protected, auxiliary hypotheses explode. **Works.**
      *   *Atlantis:* Fits – core myth preserved, evidence shifts wildly. **Works.**
      *   *Retracted Paper/Doc:* If persistent despite critique, fits. **Works.**
      *   *Vinland:* Not degenerating – core claim pursued *within* methods, eventually successful. **Works.**
      *   *Problem:* Hard for a non-specialist to apply quickly ("Is this programme progressive or degenerating?"). Requires tracking over time.

  3.  **Refusing to Engage Scholarly Community (Sociological):**
      *   *Fomenko/Atlantis (typical):* Operate in parallel, dismiss critics as blind/dogmatic/conspiring. **Works.**
      *   *Retracted Paper Doc:* Ignored scholarly critique process. **Works.**
      *   *Vinland:* Ingstads actively engaged archaeological community. **Passes correctly.**
      *   *Schliemann:* Engaged, albeit controversially. **Passes.**
      *   *Göbekli Tepe Researchers:* Deeply engaged. **Passes.**
      *   *Problem:* Can overreach. Legitimate heterodox scholars might struggle to get a hearing initially. Requires judging *how* engagement is refused (conspiracy vs. frustration).

  **The Core:** Pseudohistory isn't primarily defined by being *wrong* or *unfashionable* or even *thinly evidenced*. It's defined by **epistemic insincerity** – a systematic pattern of **evading disconfirmation** (Req 1) and **operating outside the rules of evidence and method** (Req 2) that define the historical discipline, while often mimicking its forms. Your test needs to sniff out that insincerity in the claim's *structure* and *handling*, not just its content or current popularity. Focus on **how it responds to challenge** and **where it gets its authority**.
