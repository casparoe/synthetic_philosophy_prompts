prompt: |-
  Right, so I'm in year 13 and I'm doing an EPQ on whether technology is neutral, and my supervisor read the draft and just wrote "proves too much" in the margin. I've read it six times and I can't see where. Help me find it.

  The case I start from: Robert Moses had overpasses built over the parkways running out to the Long Island beaches near New York, and he had them built low — too low for a bus to get under. So the people with cars got the beach and the people who'd have come by coach didn't, and nobody ever had to pass a rule about who was allowed in, which meant there was nothing to argue against or appeal. (I know the details are disputed, apparently the story's been retold so many times it's half legend — but just grant it, assume the low clearance really did the excluding. I want the argument checked, not the history.)

  Here's what I wrote:

  1. Some artefacts get built in a way that settles a question which would otherwise have to be settled politically — and settles it once, quietly.
  2. Once its built, the artefact keeps settling it for decades without anyone deciding anything: the arrangement is in the concrete and it outlives the people who put it there.
  3. So an artefact can carry a political arrangement, and carry it more securely than a law can, because a law has to be renewed and can be repealed and gets challenged in court, and a bridge doesn't.
  4. What did the work in 1? Two things: the thing reliably sorts people into better-off and worse-off groups, and nobody votes on that sorting.
  5. Loads of things do both of those without anyone having planned it — a town that grew around one station, how long the green man stays lit at a crossing, the default settings on an app, the hours the leisure centre is open, the standard width of a door.
  6. So they carry political arrangements too. Which means the politics isn't in the designer's head after all, its in the distribution the thing produces.
  7. And since the distribution gets fixed at the design-and-build stage, and that stage isn't an election, the political system can only ever ratify the shape afterwards.
  8. So it makes very little difference whether a country is a democracy: how people's lives are actually organised is settled by the stuff around them, not by the ballot box.
  9. Therefore if you want to change how people live you have to change the artefacts, and voting is basically a sideshow.

  I do not beleive 9. It feels obviously wrong, and 8 makes me uneasy too, but the problem is I can't find a step that's actually false — every single one looks fine to me when I read it on its own, and they all look fine when I read them in order, which is somehow worse.

  One warning before you answer: I've already got the cheap objection ready to hand, which is that if everything is political then "political" stops picking anything out, the way physics would stop being a subject if everything turned out to be physical. I don't think that objection is much good on its own, because moral claims apply to pretty much everything too and "moral" isn't empty, so a concept being universal doesn't automatically make it useless. So please don't just tell me 5 makes the whole thing vacuous — tell me why, if that's what you think.

  What I actually want:

  - which numbered step you'd cut, and exactly what slips between it and the one before — is there a word in there doing two different jobs?
  - why that step looked so harmless when I wrote it, because it genuinely did
  - what I lose by cutting it. Like if I go back and restrict 4 to 6 to designs where somebody actually intended the sorting, have I still got anything interesting, or have I just described people being political and using concrete as a handy tool?
  - and is there a real difference between artefacts *having* politics and artefacts *determining* politics? I have a feeling 1 to 3 is about the first one and 7 to 9 is about the second, but I can't point at the moment they came apart.

  If you think some of the steps can be repaired rather than cut, say so, but tell me what the repair costs.
reasoning: |-
  Okay, let me try to figure out what's going on with this EPQ draft. The student is working on whether technology is neutral and their supervisor wrote "proves too much" in the margin. The key issue seems to be that the argument leads to a conclusion the student themselves finds problematic - that voting is basically irrelevant (point 9). 

  Hmm, looking at the structure... The argument builds step by step from the Robert Moses case to this sweeping claim. The first few points seem solid: artifacts can embed political decisions (1-3), many things create distributions without intent (4-6), then it takes a sharp turn toward technological determinism in 7-9. 

  Ah! The critical slip happens between steps 6 and 7. Step 6 says artifacts "carry political arrangements", which is reasonable. But step 7 suddenly claims the distribution gets "fixed" at design stage and political systems can "only ever ratify" it afterwards. That's where it overreaches. 

  Why does this happen? Probably because the Moses example is so vivid - that low bridge really did lock in exclusion for decades. But most artifacts aren't like that! Door widths can be changed, app settings adjusted, opening hours voted on. The student is generalizing from an extreme case to all technology.

  What's lost if we fix this? We'd still have the important insight that design embeds values, but without denying democracy's power. The repair would be to distinguish between degrees of reversibility. Some things (like concrete bridges) are hard to change, but most aren't. 

  The deeper issue is equating "having politics" with "determining politics". The bridge has politics (it enables exclusion) but doesn't determine politics (people could build ramps, provide buses, etc.). That distinction rescues the argument without making voting irrelevant.

  Smart student though - they already anticipated and dismissed the "everything is political" objection. Their instincts about point 9 being wrong are correct. The supervisor's "proves too much" is spot-on because the argument accidentally concludes that democracy is meaningless, which even the student rejects.
answer: |-
  Your argument is sharp and logically tight – that's why the problem is subtle. The core issue is between **steps 6 and 7**, specifically the leap from "artefacts carry political arrangements" to "the distribution gets *fixed* at the design-and-build stage" and "the political system can *only ever ratify* the shape afterwards." **This slippage transforms "carrying" politics into "determining" politics in a way that dismisses democratic agency.** Your supervisor's "proves too much" pinpoints how this leads to the (untenable, even to you) conclusion 9.

  Here's the breakdown:

  1.  **Where it Goes Wrong & Why it Looks Harmless:**
      *   **Step 6:** "So they carry political arrangements too. Which means the politics isn’t in the designer’s head after all, it’s in the distribution the thing produces." **This is strong and defensible.** You've argued artefacts (intentionally or not) *embed* and *enact* distributions of advantage/disadvantage, access/denial, which *are* political outcomes.
      *   **The Harmless Look:** Step 6 feels like a natural culmination of 1-5. You've shown artefacts *do* political work by shaping outcomes.
      *   **Step 7:** "And since the distribution gets *fixed* at the design-and-build stage, and that stage isn’t an election, the political system can *only ever ratify* the shape afterwards." **This is the critical overreach.**
      *   **The Slippage:** The words "fixed" and "only ever ratify" are doing the damage. You equate "carrying/influencing" with "determining and locking in." You move from "artefacts are powerful political actors" to "artefacts *pre-empt* and *nullify* subsequent democratic politics." This ignores the **ongoing politics *around* the artefact.**

  2.  **Why Step 7 Looks Harmless (But Isn't):**
      *   The Robert Moses example *feels* like it proves step 7. The bridges *were* very hard to change and *did* lock in exclusion for decades. It creates a powerful mental model.
      *   Logically, step 7 seems like a direct consequence of 6: *If* the politics is in the distribution produced by the thing, *and* the thing is built, *then* the politics is fixed by the building. This ignores that the "distribution produced" isn't static or unalterable *after* construction, nor is the artefact's existence and impact immune to political challenge and change.

  3.  **What You Lose By Cutting/Repairing Step 7 (And Why It's Necessary):**
      *   **If you simply cut step 7 (and weaken 8/9):** You lose the *deterministic* claim that democracy is powerless against built infrastructure. **This is essential to lose** because it's the part that "proves too much" and is demonstrably false. You *keep* the powerful core argument: Artefacts embed, enact, and stabilize political arrangements (distribution of goods/access/opportunity) in ways that are often subtle, long-lasting, and bypass formal democratic deliberation. This is still profound and challenges naive tech neutrality.
      *   **Repair Option (Highly Recommended):** Replace the deterministic language in step 7. Acknowledge the *asymmetry* and *durability* artefacts introduce, but not total fixation. For example:
          > "7. Because artefacts physically or systematically enact distributions, changing them *often* requires significant effort, resources, and political struggle *after* their creation. This creates an asymmetry: establishing a distribution via artefact can be easier and more durable than changing it later through the political system, *though not impossible*."
      *   **Cost of Repair:** You lose the stark, shocking (but inaccurate) claim that democracy is inherently futile against technology. You gain a more nuanced, defensible, and ultimately stronger argument about the *power dynamics* and *inertia* artefacts introduce into politics. You can still argue artefacts *constrain* and *shape* democratic choices significantly without claiming they *eliminate* them.

  4.  **The Difference Between "Having" and "Determining" Politics:**
      *   **Steps 1-3 (Having):** Brilliantly demonstrate that artefacts *have* politics. They *embody* decisions (intentional or not) with political consequences (who benefits, who is excluded). They *stabilize* these consequences over time, making them resistant to change ("settles it once, quietly," "outlives the people"). This is about **agency and influence**.
      *   **Steps 7-9 (Determining):** This leaps to artefacts *determining* the fundamental shape of society ("how people's lives are actually organised is settled by the stuff"), rendering the formal political system ("democracy," "voting") essentially powerless ("only ever ratify," "sideshow"). This is about **causal primacy and inevitability**.
      *   **Where They Came Apart:** Precisely in step 7. Steps 1-6 establish artefacts as powerful political *actors* with significant *influence*. Step 7 incorrectly elevates them to the *supreme political authority*, overriding all others. The Moses case *illustrates* powerful influence and difficult-to-reverse consequences; it does not prove that *all* artefact politics are immutable or that *no* democratic action can ever effectively counter or reshape them (e.g., the ADA mandating accessibility changes to buildings/infrastructure).

  **Revised Path Forward & Addressing Your Concerns:**

  1.  **Cut the Determinism:** Severely weaken or replace step 7. Acknowledge the *durability* and *resistance to change* artefacts introduce ("ratchet effect," "path dependency"), but not total fixation or the nullification of democracy.
  2.  **Reframe 8 & 9:** Instead of "it makes very little difference whether a country is a democracy," argue: "The *form* democracy takes is profoundly shaped by its material infrastructure. Artefacts create durable landscapes of advantage and constraint that democratic processes must constantly navigate and struggle against, often at a significant disadvantage." Replace 9 with: "Therefore, meaningful political change often requires not just changing laws or voting, but also changing the material and digital artefacts that structure everyday life and enforce existing distributions of power." (This keeps artefacts crucial without making voting irrelevant).
  3.  **Why Avoid Restricting to Intent?** Your point about unintended consequences (step 5) is vital! Restricting to intentional design weakens the argument significantly. It lets "neutral" tech off the hook. The power of your core insight (1-6) is that politics emerges *from the function and effect* of the artefact in the world, regardless of intent. *That's* the challenge to neutrality. Keep it. The problem wasn't step 5, it was the leap in step 7.
  4.  **Addressing the "Cheap Objection":** You're right to dismiss the "everything is political, therefore 'political' is meaningless" objection. Your argument successfully shows *how* and *why* artefacts are political actors – through the distributions they produce and stabilize. This is specific and substantive, akin to showing *how* economic structures or cultural norms are political. The universality doesn't negate the specific mechanism you've identified.

  **In summary:** Your brilliant insight (artefacts embed and enact politics durably) gets overextended into an unsustainable claim (artefacts determine politics and nullify democracy) between steps 6 and 7. Repair this by emphasizing the *asymmetrical power*, *durability*, and *resistance to change* of artefactual politics without claiming they *eliminate* democratic agency. This retains the powerful critique of tech neutrality while avoiding the fatalistic (and inaccurate) conclusion that makes your argument "prove too much." The fixed bridge is a potent *example* of influence, not proof of inevitability.
