  Hmm, the core insight here is fascinating - that current equality metrics treat conversion rates as static when in reality people's ability to convert resources into functionings varies in fragility. The user's hunch about robustness being politically significant makes intuitive sense. I should frame this as investigating whether robustness is a distinct metric or a modifier to capabilities.

  For the research question, we need to avoid vague "does it matter" phrasing. Something like: "Is resource-conversion robustness best conceptualized as (a) an independent fourth metric for distributive equality, (b) an internal refinement of capability sets, or (c) a weighting principle for comparing capability sets?" That has teeth.

  The economist partner's role is crucial here. Since there's no budget for data collection, we'll leverage their expertise in analyzing existing disability policy structures to build vulnerability scenarios. The user mentioned disability and climate cases - disability is clearly the stronger focus given the economist's background. We should explicitly drop climate applications as out of scope for now.

  Month-by-month planning is key. First month should be conceptual mapping, then developing typologies of "shock points" in disability systems, followed by robustness-sensitive assessment criteria. Last month would be comparative analysis against resourcism/capability approaches.

  For success metrics: If we can show robustness changes distributive rankings in real cases where other metrics agree, that's win. Failure would be if it collapses into existing frameworks or only matters in trivial edge cases. Need to preempt the "is this just relabeling?" panel concern upfront.

  Better emphasize the economist's contribution throughout - they're not just a prop. Their understanding of policy levers and institutional constraints will ground the philosophical framework. The no-data constraint actually helps focus on theoretical innovation.

  Scope note must be blunt: 8 months is tight. Climate/disaster cases require different expertise and get cut. Disability policy offers clearer conversion rate examples anyway. That's defensible.

  The tone should stay accessible - two economists on panel means no philosophy jargon without explanation. Concrete examples like bus route cuts or medication access problems will help immensely.
answer: |-
  Here’s a structured 3-4 page proposal draft focusing on clarity, feasibility, and addressing your key requirements. It’s designed for interdisciplinary reviewers, avoiding jargon while maintaining rigor.

  ---

  **Proposal Title:** Robustness in Resource Conversion: A Missing Dimension for Distributive Justice?  

  **Collaborators:**  
  [Your Name] (Philosophy) & [Economist Partner’s Name] (Health Economics)  

  ### 1. Core Research Question
  **"Is resource-conversion robustness a distinct normative consideration for distributive justice, and if so, how should it be integrated into existing egalitarian frameworks (resourcism, capability theory)?"**  
  We aim to determine whether robustness:  
  *(a)* Functions as a **fourth independent metric** (alongside welfare, resources, capabilities),  
  *(b)* Serves as an **internal refinement of the capability metric** (e.g., by modifying capability set definitions), or  
  *(c)* Acts as a **weighting principle** for comparing capability sets across individuals.  
  *Distinguishing Test*: We will assess which framework best explains cases where robustness alters distributive rankings *without* changing snapshots of resources or capabilities.  

  ### 2. Gap in Existing Literature & Why This Matters
  Current egalitarian theories overlook robustness, creating blind spots:  
  - **Resourcism** (e.g., Dworkin, Rawls): Treats resources as the metric but ignores how conversion *variability* undermines equality. A wheelchair user and an able-bodied person with identical incomes are deemed equal—yet the former’s mobility collapses if a single elevator breaks. Resourcism *cannot* absorb robustness without abandoning its core claim that resources are the appropriate metric.  
  - **Capability Theory** (e.g., Sen, Nussbaum): Acknowledges conversion heterogeneity but treats it as static ("Sen’s wheelchair user"). It overlooks how *fragility* of conversion (e.g., dependence on one bus route) creates vulnerability invisible to snapshot capability sets. Robustness could refine capability theory by requiring "stability thresholds" for functionings—but this would substantially revise its structure.  
  - **Why it "bites"**: Neither framework registers losses from *predictable systemic volatility* (e.g., policy changes, supply chain disruptions). Robustness exposes a hidden inequality: two individuals with identical current capabilities differ if one is vulnerable to minor shocks (e.g., medication supply instability).  

  ### 3. Methodology: 8-Month Work Plan (No Data Collection)
  **Economist’s Role:** Leverage expertise in disability program design to identify real-world "shock points" (e.g., policy tweaks, funding cliffs) and model their impact on conversion stability. Translate philosophical robustness criteria into testable economic scenarios.  
  **Why Worked Examples (Not Regression)?**  
  Operationalizing robustness for quantitative analysis would require longitudinal data on individual vulnerability—infeasible without fieldwork/time. Instead, we use **structured case comparisons** drawn from disability policy contexts to:  
  - Isolate robustness as the *only* variable changing between scenarios,  
  - Show how it alters distributive judgments *without* new data.  
  *Economist’s Contribution*: Builds plausible, policy-relevant cases (e.g., impacts of transitioning from fixed home-care grants to means-tested vouchers on user stability).  

  **Monthly Plan:**  
  - **Months 1–2:** Conceptual Groundwork  
    - *Philosophy*: Define robustness formally (e.g., "range of exogenous shocks a person absorbs while maintaining baseline functionings").  
    - *Economics*: Catalog real-world disruptions affecting disability support recipients (e.g., eligibility changes, provider market collapse).  
  - **Months 3–4:** Develop Robustness-Sensitive Framework  
    - Jointly design cases comparing individuals with identical resources/capabilities but differing robustness (e.g., Person A’s assistive tech depends on one supplier; Person B’s has multiple suppliers).  
  - **Months 5–6:** Test Frameworks (a), (b), (c)  
    - Apply cases to each model: Does robustness require a new metric (a)? Does it fit as capability refinement (b)? Or as a weighting factor (c)?  
  - **Months 7–8:** Analysis & Drafting  
    - Identify which approach best handles cases without ad-hoc adjustments.  
    - Co-author paper: "Robustness as a Egalitarian Currency: Beyond Capability Snapshots."  

  ### 4. Success, Failure & Triviality Tests  
  - **Success** = Demonstrating that robustness *re-ranks* distributive equality in cases where resourcism/capability theory concur. Example: Two people with equal mobility capability today; one withstands a bus route cut, the other does not. Our framework must flag this as an injustice where rivals see parity.  
  - **Failure** = If robustness only matters in edge cases, or collapses into existing metrics:  
    - *Triviality Test*: If "robust capability sets" are indistinguishable from standard capabilities (e.g., if Nussbaum’s "control over environment" already covers it), the idea adds nothing.  
    - *Falsity Test*: If robustness never changes distributive rankings *independently* of resources/capabilities, it lacks normative force. We pre-commit: If our cases show no unique role for robustness, we refute the hypothesis.  
  - **Key Evidence**: Success hinges on constructing cases where *only* robustness differs, yet egalitarian intuitions demand intervention.  

  ### 5. Scope Limitation: Focusing Disability, Shelving Climate  
  **We explicitly exclude climate/disaster cases** despite their intuitive link to robustness. Why?  
  - **Depth over Breadth**: Disability policy offers a controlled setting with:  
    - Well-documented conversion factors (e.g., mobility devices, caregiver access),  
    - Clear institutional "shock points" (e.g., budget cycles, regulatory changes)—vital for building cases without fieldwork.  
  - **Economist’s Expertise**: Health economics specialization ensures cases are policy-relevant and credible. Climate adaptation would require distinct literature/empirical baselines, inflating scope.  
  - **Feasibility**: 8 months suffices for disability-focused theoretical innovation. Adding climate would fracture the analysis.  

  ---

  ### Expected Impact
  This project reorients the "equality of what?" debate by revealing how *stability of access*—not just static conversion—shapes vulnerability. For policymakers, it suggests evaluating programs by robustness (e.g., "How many disruptions would break this user’s capabilities?"). For philosophy, it challenges the sufficiency of snapshot metrics in a volatile world.  

  ---  
  **Proposal Length:** ~3.5 pages (excl. title/header).  
  **Tone:** Argument-driven, avoids excessive citations.  
  **Panel Appeal:** Balances philosophical precision with economist’s applied rigor; uses concrete policy examples to ground theory.
