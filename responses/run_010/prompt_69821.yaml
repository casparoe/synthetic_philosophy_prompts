prompt: |-
  I am a novelist, and in three weeks I am giving the closing talk at an interdisciplinary workshop at a large research university — two days on persistence and personhood, titled something like Persistence, Persons, and the Fiction of Both. My invitation came because of my last novel, Recension, in which a transit authority offers a cheaper tier of teletransportation: the scan preserves every memory, every intention, the whole dispositional architecture of the traveller, but at reduced resolution in one specific respect, which in the book I call the marginal hand — the capacity to annotate, retract, reorder, and re-weight one's own past. Passengers who arrive on the economy tier are, in the idiom of the novel, set in type: nothing about them has been lost that any inventory of the mind would list, and yet their future has stopped being authored rather than merely continued. The book's second strand follows a woman with dense retrograde amnesia whose record of her life is nearly gone but whose marginal hand is entirely intact; she invents, repudiates, and begins again, and the novel treats her, against all expectation, as the one who has survived. I intend to argue in the talk that Parfit's Relation R gets the shape of the problem right and the content wrong: what matters in survival is a narrower and asymmetric relation — call it R-star — consisting not in psychological continuity as such but in continuity plus retained revisability, and that the two relations come apart in both directions, so that R can hold where what matters has been lost and can fail where what matters is preserved. My third move, and the one I am least sure of, is to ask whether revisability grounds obligations or dissolves them: I have a character who re-authors his past so thoroughly that earlier promises no longer seem to bind him, and I want to suggest that a relation which makes survival matter cannot be one that also lets the survivor write off his own debts.

  The room will be about thirty people, and I need to be clear-eyed about who they are, because I am not one of them. Three are analytic metaphysicians working squarely in the Parfitian tradition, and one of those three is an animalist who thinks the entire psychological-continuity programme is a category mistake because the person in the chair is an organism and no relation among experiences can substitute for the persistence of the animal; he will not be interested in my literary case, only in whether I have said anything about what persists. A fourth is a four-dimensionalist whose first question will be whether R-star is a metaphysical relation or an evaluative one wearing a metaphysical costume, and who will want to know what it supervenes on. Two are philosophers of psychiatry and neuroethics who work on dementia, confabulation, and narrative capacity in clinical populations; they will treat my amnesiac as an empirical claim and will press me on whether real patients come in the two neat kinds my novel requires, or whether revision is itself usually a species of confabulation that I have romantically relabelled. There is a visiting philosopher who has argued that narrative is a genre we impose on lives rather than a structure lives possess, and who regards all narrativist theories of the self as either false or a description of literary taste; he will say that I have simply projected my vocation onto the metaphysics. And there is a literary theorist who will congratulate me and then say that the book dramatizes a view already in the literature, which is its own kind of dismissal. Several graduate students will be angling for the question that makes them look clever. I have read this literature seriously but I will not survive sustained technical pressure on grounding, and I would rather know in advance where to plant my flag and say that a novel's question is not the same question than be discovered saying it under duress.

  So I would like a preparation sheet rather than a defence. Give me the eight or so objections this audience will actually raise — not the objections a general reader or a book-festival audience would raise, and not the science-fictional ones about copies and duplicates that I will already have addressed in the opening minutes — ordered by how much damage each would do if I handled it badly. Phrase each in the register its owner would use, so that I can hear the animalist's flatness, the four-dimensionalist's precision, and the neuroethicist's citation of what patients actually do. For each, tell me what I should concede immediately and without hedging, what I must hold, and give me a reply I could deliver in about two minutes standing up; then mark, honestly, where that reply is softest, because the soft spot is what the follow-up will find. Tell me which single reply has to land for the rest of the talk to be worth giving, and which objection I should raise myself in the first ten minutes in order to disarm it. And tell me the question I am hoping nobody asks — the one about whether a criterion of survival built on the capacity to re-author one's own life quietly ranks human beings, so that the cognitively disabled and the very old, who in my own book are the set type and the amnesiac respectively, end up mattering less; I know that reading is available in the novel, I am not certain it is wrong, and I want to know what I say if someone in the second row says it out loud.
reasoning: |-
  Okay, the user is a novelist preparing for a closing talk at an interdisciplinary workshop. They need to anticipate objections from a specialized audience and craft strategic responses. Let me unpack this.

  First, the core argument: The user challenges Parfit's Relation R by proposing R-star (psychological continuity + retained revisability). Their novel explores this through two characters - economy teleportation passengers who lose revisability ("set in type") and an amnesiac who retains it. The third risky move questions whether revisability dissolves obligations.

  The audience breakdown is critical. Each discipline will attack differently:
  - Analytic metaphysicians (Parfitians/animalist) will demand ontological rigor
  - 4D-ist will probe metaphysics vs evaluation
  - Neuroethicists will challenge clinical realism
  - Anti-narrativist will call it genre projection
  - Literary theorist will dismiss it as derivative

  The user's vulnerability: They're out of their depth in technical philosophy but need to hold ground on what fiction uniquely offers. Their fear isn't being wrong, but being forced into defensive posturing.

  Key preparation needs:
  1. Pre-empt the most damaging objections (prioritized by threat level)
  2. Scripted concessions/hold lines per critic
  3. Identify the make-or-break reply (likely the animalist challenge)
  4. Voluntary disarmament of the disability ethics bomb
  5. Protection against grounding questions they can't handle

  Most dangerous unasked question: The implied hierarchy where cognitive disability = "set type" = lesser survival value. This could unravel their entire ethics. Must address proactively.

  The neuroethical objection about clinical neatness is urgent too - if real patients don't split cleanly into their two archetypes, their dual-case structure collapses. Should concede variation but hold that extremity reveals structure.

  Biggest insight: The talk's survival depends on framing fiction not as evidence but as a magnifying glass for relations we otherwise miss. That's the flag to plant early.
answer: |-
  Here is your preparation sheet, structured for maximum tactical awareness. I've ordered objections by potential damage (high to lower), phrased in each critic's authentic voice, with strategic responses and vulnerability markers. The key reply to land is the **Animalist's Challenge**.

  ---

  ### **1. The Animalist's Challenge (Highest Damage - Undermines Entire Premise)**  
  **Objection (Flat, impatient):** "This is category confusion. Persons *are* animals. No psychological relation – continuity, revisability, or otherwise – substitutes for the persistence of the organism. Your 'R-star' is irrelevant to survival because survival *just is* biological continuity. Your novel’s characters are imaginative, but they don’t address what *persists*."  
  **Concede Immediately:** "You're right that biological persistence is fundamental to our ordinary concept of a human person."  
  **Hold Firm:** "But the *value* we attach to survival – why we fear death or certain transformations – is psychological. R-star isolates *that* evaluative core. My novel isn’t metaphysics; it’s about what *matters* in survival *given* biological continuity."  
  **2-Minute Reply:**  
  > "If we cloned your body and brain state perfectly at time T, but destroyed the original, *you* wouldn’t survive – the organism is gone. But if we gradually replaced your neurons with synthetic analogs preserving all cognitive functions, including revisability, you’d likely feel you survived. R-star captures *why* the second case feels continuous despite material change, while the first doesn’t, even with duplication. The novel asks: when does the organism’s persistence cease to matter *to us* without psychological agency?"  
  **Soft Spot:** Conflates persistence criteria with survival value. Follow-up: "But if the organism persists, why does psychological value override metaphysics?"  
  **Defensive Move:** "It doesn’t override – it answers a different question: not 'What exists?' but 'Why should I care?'"  

  ---

  ### **2. The Disabled Ethics Bomb (Existential Threat - Moral Hierarchy)**  
  **Objection (Quietly devastating):** "Your criterion ranks humans. If R-star requires 'revisability,' then those with cognitive disabilities (your 'set type') or advanced dementia (your amnesiac?) matter less. They 'survive' but lose moral status. Is that your implication?"  
  **Concede Immediately:** "The novel *can* be read that way, and that’s horrifying."  
  **Hold Firm:** "But R-star addresses *narrative agency*, not moral worth. The amnesiac isn’t 'better' – she’s tragically unmoored. The 'set type' isn’t lesser – they’re frozen. Both are persons owed full dignity. The talk asks: can obligations bind *across* revisions of selfhood?"  
  **2-Minute Reply:**  
  > "This terrifies me too. R-star isn’t a criterion for personhood or rights. It’s about the *structure of a life we experience as our own*. We owe duties to all persons, regardless of cognitive capacity. But if someone radically re-authors their past (like my character), do *they* still owe debts to their former self? That’s a question about identity’s grip on ethics, not moral hierarchy."  
  **Soft Spot:** Distinguishing "mattering for survival" from "mattering morally." Follow-up: "But if R-star grounds survival-value, doesn’t it inevitably downgrade those without it?"  
  **Preemptive Strike:** **Raise this yourself early**. Say: "Before we start – I need to stress R-star is not about human worth. It’s about why *I* might fear losing my revisability while still breathing."  

  ---

  ### **3. The 4D-ist’s Supervenience Question (High Damage - Exposes Conceptual Vagueness)**  
  **Objection (Precise, cutting):** "Is R-star metaphysical or evaluative? If it’s real, what does it supervene on? Brain states? Narrative practices? If it’s just 'valuing revisability,' you’ve dressed preference in metaphysical clothes."  
  **Concede Immediately:** "R-star is irreducibly hybrid. It supervenes on *both* lower-level cognitive processes *and* the narrative valence we assign them."  
  **Hold Firm:** "But that’s the point: survival *matters* because it bridges objective continuity and subjective investment. Parfit’s R is purely descriptive; R-star is phenomenological."  
  **2-Minute Reply:**  
  > "It supervenes on the neurocognitive capacity for metacognition (e.g., prefrontal cortex function) *plus* its successful deployment in self-narration. When economy teletransport damages neural substrates for re-evaluation, R-star fails. When amnesia spares those substrates, R-star holds. It’s as real as 'pain' – which supervenes on nociception but is felt as suffering."  
  **Soft Spot:** "Successful deployment" is vague. Follow-up: "How much revision counts as 'successful'? Isn’t this circular?"  

  ---

  ### **4. Neuroethicist’s Clinical Reality Check (Medium-High Damage - Undermines Empirical Basis)**  
  **Objection (Citing studies):** "Dementia and amnesia don’t split neatly into 'revision-capable' or 'fixed.' Confabulation often *masquerades* as revision – it’s pathological, not authentic re-authoring. Your novel’s dichotomy romanticizes illness."  
  **Concede Immediately:** "Real cases are messier. Confabulation and revision exist on a spectrum."  
  **Hold Firm:** "But the *extremes* clarify the distinction. Late-stage semantic dementia patients lose factual memory but retain evaluative flexibility – they *revise* past judgments. Severe Korsakoff’s patients fixate on false narratives. The novel amplifies to isolate variables."  
  **2-Minute Reply:**  
  > "Consider Patient B. with frontotemporal dementia [cite real study if possible]. She forgot her life but constantly reinvented her values, expressing clear agency. Patient A. with Alzheimer’s clung rigidly to fading fragments. Both are tragic, but B.’s capacity to *re-engage* her story – however invented – mirrors my amnesiac. Revision isn’t truth; it’s functional metacognition."  
  **Soft Spot:** Clinical overlap. Follow-up: "But isn’t B.’s 'agency' just disinhibition?"  

  ---

  ### **5. The Anti-Narrativist’s Projection Charge (Medium Damage - Dismisses Core Method)**  
  **Objection (Wry, dismissive):** "Narratives don’t structure lives; novelists structure narratives. You’ve mistaken a literary device for metaphysics. 'Revisability' is just you valuing your craft."  
  **Concede Immediately:** "Narrative is *a* lens, not the world’s fabric."  
  **Hold Firm:** "But we *experience* our lives through time as evaluative beings. R-star isn’t 'narrative' as genre; it’s the pre-linguistic capacity to reweigh past events – which narrative expresses."  
  **2-Minute Reply:**  
  > "When you regret a choice or reframe a trauma, that’s revision – not because you’re writing a memoir, but because your mind updates valences. My character’s 'set type' can recite their past but can’t *re-feel* it. That’s a psychological deficit, not a literary preference."  
  **Soft Spot:** Reducing phenomenology to "feeling." Follow-up: "Isn't 'updating valence' just learning, not *self-revision*?"  

  ---

  ### **6. The Literary Theorist’s "Derivative" Dismissal (Low-Medium Damage - Erodes Originality)**  
  **Objection (Smiling, patronizing):** "Lovely book! But this is Schechtman’s 'narrative self-constitution' with a sci-fi twist. Or Dennett’s 'center of narrative gravity.' You’ve dramatized existing theory."  
  **Concede Immediately:** "I stand on giants’ shoulders. Schechtman/Dennett inspired me."  
  **Hold Firm:** "But they treat narrative as holistic continuity. R-star isolates *revisability* as the active ingredient. And unlike them, I show it can *dissolve* obligations."  
  **2-Minute Reply:**  
  > "Schechtman argues narrative *creates* identity. I ask: what happens when identity is *re-created*? If you revise your past so profoundly that your old promises feel alien, are you still bound? That’s new territory – and it’s where philosophy needs fiction’s torque."  
  **Soft Spot:** Overclaiming novelty on well-trodden ground.  

  ---

  ### **7. The Graduate Student’s "Grounding" Trap (Low Damage - Exposes Technical Limits)**  
  **Objection (Eager, sharp):** "If R-star isn’t brute physical continuity, and it’s not functionalism, and not narrative ethics – what grounds it? Is it emergent? Fundamental?"  
  **Concede Immediately:** "I can’t give a reductive account."  
  **Hold Firm:** "And I don’t need to. Fiction’s job is to isolate a *phenomenon* philosophy might miss: that survival-feeling depends on being able to *renegotiate* your past."  
  **2-Minute Reply (Plant Your Flag Here!):**  
  > "A novel’s question isn’t 'What are the necessary and sufficient conditions of R-star?' It’s: 'Do we recognize ourselves in the amnesiac who reinvents, or the copied self who can’t?'. If you feel a chill at 'set type' characters, *that* intuition is the datum. Your job is to ground it; mine is to make you feel it."  
  **Soft Spot:** Retreat to "intuition" sounds evasive.  

  ---

  ### **8. The Parfitian’s "Why Not R?" (Lowest Damage - Already Addressed)**  
  **Objection (Polite, probing):** "Parfit already allows that continuity matters via connectedness (overlapping links). Isn’t 'revisability' just a high-degree R-relation?"  
  **Concede Immediately:** "R captures the scaffolding."  
  **Hold Firm:** "But connectedness of *what*? Two people can share memories/desires (high R) but one can revise them, one cannot. That difference *changes everything* for survival-value."  
  **2-Minute Reply:**  
  > "Imagine identical twins with identical psyches at T1. One undergoes economy teletransport (loses revisability), one doesn’t. At T2, both are psychologically continuous with T1. But only the second can *rethink* T1. Parfit would say both survive equally. I say only the second survives *as a person*."  

  ---

  ### **Key Strategic Summary**  
  - **Make-or-Break Reply:** The **Animalist's Challenge**. If they don’t accept that R-star addresses survival-*value* (not metaphysics), the talk collapses.  
  - **Disarm Early:** **Raise the disability ethics objection yourself** in the first 10 minutes. Show you’ve wrestled with it.  
  - **Plant Your Flag:** When pressed on technicalities (especially grounding), retreat to: **"Fiction doesn't answer metaphysical questions; it compels them. My job is to make you see why R-star *feels* like the core of survival."**  
  - **Nightmare Question:** The disability hierarchy charge (#2). Preempt it, concede its gravity, and decouple R-star from moral worth.  

  You’re not defending a theory; you’re inviting philosophers to feel a problem fiction renders visceral. Your strength is phenomenology, not ontology. Stand there.
