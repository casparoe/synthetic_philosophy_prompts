  The constraints are quite strict: I need to invent a biologically plausible organism with fully specified selection history, avoid all the standard examples, fix the causal-role interest within the case, create a variant individual with specific mechanistic differences, and write the description without any functional language. The target is a grid where each theory gives different answers for both function and malfunction.

  The core challenge is finding a scenario where:
  - Ancestral function (F) is no longer maintained by selection
  - The trait currently contributes to something else (F*) that's biologically significant
  - There's a variant that's broken for F but better at F*
  - Modern-history sees no current selective maintenance

