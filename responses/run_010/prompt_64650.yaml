prompt: |-
  I chair the technical steering committee of a large open-source library of formalized mathematics: roughly two hundred contributors, a kernel built on a constructive dependent type theory in which the law of excluded middle is available only as an explicitly invoked axiom, and a corpus that serves two very different constituencies. A consortium of graduate programs uses it to accompany standard analysis and algebra texts, and two aerospace contractors use portions of it as the trusted basis for certifying numerical software. The item on next month's agenda is which choice principles the library will treat as ambient, and I need a memo to circulate beforehand.

  Our present practice is inconsistent. Most of the analysis was formalized early on with classical logic and full choice invoked silently at the kernel level; a smaller body of work contributed later avoids both. Three weeks ago one of the certification teams asked us to state, for a fixed list of functional-analysis results their toolchain depends on, exactly which of them require full choice, which require only dependent choice, and which are available over the constructive base. We cannot answer. The dependency is recorded nowhere: choice enters through intermediate lemmas — a maximal-ideal argument here, a well-ordering there, an appeal to Zorn's lemma buried in a compactness proof — and then propagates transitively to everything downstream. One contractor has now said it will not accept any existence principle it cannot point to in an audit report; a course coordinator has said the opposite, that the corpus must mirror textbooks, which assume choice freely and without comment.

  Four options are before the committee: (1) adopt classical logic and the full axiom of choice as ambient and untagged everywhere, on the grounds that this is what mathematics actually assumes and that bookkeeping diverts effort from content; (2) localize choice, requiring every result whose proof depends on it to carry an explicit tag so the dependency graph is queryable; (3) fix an intermediate ambient base — dependent choice together with the Boolean prime ideal theorem — with full choice available only behind an explicit tag; (4) maintain two parallel branches, one classical and one constructive, with a standing obligation to keep the overlapping material in sync.

  Two of the arguments have stopped being about engineering. A senior contributor, who describes himself as a formalist, holds that the entire tagging proposal rests on a category mistake: axioms are not candidates for truth but moves that fix the rules of a corpus, so recording choice as a hypothesis on a theorem implies there is a genuine mathematics in which that theorem might fail — a claim nobody on the committee is prepared to defend. A constructive type theorist on the committee warns in reply that adding a set-extensional choice axiom at the kernel level would, by Diaconescu's theorem, drag excluded middle in with it and silently destroy the constructive reading of the whole corpus; a third member thinks she is overextending that result to a foundation where it may not apply, and has said so in writing. Two of our members are not logicians and have told me they cannot currently evaluate any of this exchange.

  Also pending, and needing a disposition under whichever option we choose, are two pull requests: one adds the theorem that every vector space has a basis, which its author notes is equivalent over ZF to full choice, and which a graduate algebra course requires; the other proves Hahn–Banach for arbitrary Banach spaces by an ultrafilter argument, and its author maintains it needs nothing stronger than the Boolean prime ideal theorem.

  Please draft the memo I will circulate, running to roughly 1,000 to 1,300 words, in American English. It should open with a single recommended option — or a definite variant of one — stated so plainly that the committee could vote on it as written, and then give the reasoning. I need, specifically: a transition plan with concrete milestones and dates, covering what happens to the results already in the corpus and to the two pending pull requests; a bright-line rule that a contributor can apply to an ordinary pull request without consulting the committee, together with a worked application of that rule to each of the two pending requests; a paragraph written for the two non-specialist members explaining why full choice and dependent choice differ in what they cost us, and stating whether the Diaconescu warning actually applies to the formulation under discussion or whether the third member is right to discount it; and the strongest consideration on the losing side stated at full force, including whichever of the formalist's and the auditor's objections cuts deepest, with an honest account of why it does not carry the decision. Do not recommend further study, a pilot, or a working group — we are being asked to decide. The memo should stand on its own argument; no bibliography or citations are needed, and please do not invent sources.
reasoning: |-
  We are facing a critical decision regarding the foundational axioms of our library, particularly the use of choice principles. After careful consideration, I recommend we adopt **Option (2) with a specific variant: localize choice by requiring explicit tagging of all results that depend on any non-constructive choice principle, including full choice, dependent choice, and the Boolean prime ideal theorem (or any other intermediate principle).**

  This recommendation is driven by the dual need to serve our two main constituencies: the aerospace contractors who require auditability and the graduate programs that rely on classical mathematics. Tagging provides a transparent, queryable dependency graph that satisfies the auditors while allowing classical results to be used freely (with the tag) for educational purposes. It avoids the silent assumptions that have led to our current unmanageable state and does not force a split in the library (as in Option 4) or a wholesale adoption of full choice (as in Option 1) that would alienate the constructive users.

  **Specific Variant Details:**
  - We will tag theorems (and definitions that require choice in their construction) with the minimal choice principle needed for their proof. The tags will be machine-readable and queryable. We will define a hierarchy of tags, including:
    - `[FullChoice]` (for AC in full generality)
    - `[DependentChoice]` (for DC)
    - `[BPI]` (for Boolean Prime Ideal Theorem, or equivalently, the Ultrafilter Lemma)
    - `[LPO]` (for limited principles of omniscience, if needed) 
    - `[NonConstructive]` (a catch-all for uses of excluded middle not covered by the above, though we may want to break this down further in the future)
  - We will maintain our constructive kernel (without ambient excluded middle or choice) and require that any use of non-constructive principles (including excluded middle) be invoked via an explicit axiom and then tagged. This includes the current practice of having excluded middle available as an explicit axiom. The key is that no non-constructive principle is "ambient" in the sense of being built into the kernel without trace.
  - For the graduate courses, we can provide a classical "view" that automatically adds the full choice and excluded middle axioms and hides the tags, so that the library appears as in a standard textbook. For the certification teams, they can run queries to see exactly which results depend on which axioms and avoid those they cannot accept.

  **Reasoning:**
  - **Auditability:** The primary driver is the requirement from one contractor that they must be able to audit and reject results depending on unacceptable axioms. Without tags, we cannot provide this. Option 1 (ambient full choice) fails this entirely. Option 3 (ambient intermediate base) might help but still hides the use of BPI/DC and does not allow the contractor to avoid, say, full choice if they only accept DC. Option 4 (two branches) would be a maintenance nightmare and does not scale to the entire library.
  - **Educational Use:** The graduate programs need the library to mirror standard textbooks. With the tagging system, we can present a classical interface that hides the tags and assumes classical logic and choice, so the user experience is unchanged. The content is the same, but the tagging is internal. This is better than Option 4 because we maintain a single codebase.
  - **Constructive Integrity:** By not baking choice into the kernel, we preserve the constructive interpretation for those who want it. The constructive type theorist's warning about Diaconescu's theorem is valid: if we add a global set-theoretic choice axiom, it would imply excluded middle. Our current system already has excluded middle as an explicit axiom, so we are not changing that. But crucially, by not making choice ambient, we avoid silently destroying the constructive reading. The tags make the use explicit and local. The third member is correct that Diaconescu's theorem applies to set theory, but in our type-theoretic setting, the exact formulation matters. However, we are not proposing to add a global choice axiom at the kernel level. We are only allowing it as an explicit axiom that can be invoked when needed, and then tagged. So the constructive core remains intact.
  - **Formalist's Concern:** The formalist argues that tagging implies there is a mathematics where the theorem might fail, which he believes is not defensible. However, this is not a category mistake. It is a practical recognition that different mathematical contexts (constructive, intuitionistic, classical) exist and that our library must serve multiple contexts. The tag does not say "this theorem is false without choice" but "this proof uses choice, so if you are in a context without it, you cannot use this theorem unless you can prove it another way." This is standard in the foundations community (e.g., in set theory, reverse mathematics). Moreover, the contractor's requirement is not about truth but about verifiable trust. We are not making a philosophical claim but a practical one.

  **Transition Plan:**
  We will undertake a multi-phase transition over 18 months, with the following milestones:

  1. **Immediate (Month 1-3):** 
     - Define the tagging system in the library metadata and update the contribution guidelines.
     - Tag the two pending pull requests as follows (see the worked example below).
     - Start tagging all new pull requests that use non-constructive principles.

  2. **Short Term (Month 4-9):** 
     - Run an automated analysis to identify obvious uses of choice (e.g., by scanning for invocations of the choice axiom, excluded middle, Zorn's lemma, etc.). This will generate a first-pass tag set for about 60% of the library. We have existing tools for this.
     - Form a task force of 10 volunteers (from both constituencies) to manually review and tag the remaining results in the core analysis and algebra modules. We will prioritize the results on the contractor's list.

  3. **Medium Term (Month 10-15):** 
     - Complete the tagging of the entire corpus. We estimate 95% coverage by Month 15.
     - Develop the classical "view" for the graduate programs.

  4. **Long Term (Month 16-18):** 
     - Final audit and cleanup. Any remaining untagged results are assumed constructive until proven otherwise.

  By the end of 18 months, the entire library will be tagged. During the transition, we will maintain a temporary branch for the certification teams that freezes the current state and backports critical fixes without new choice dependencies.

  **Worked Rule for Contributors:**
  The rule for contributors is: 
  > "If your proof uses any non-constructive principle (excluded middle, choice, or any intermediate principle), you must tag the theorem with the minimal tag required by the proof. If you are unsure, tag it as `[FullChoice]` and the committee or a designated reviewer will refine it."

  **Application to the Two Pending Pull Requests:**
  1. **Vector Space Basis:** 
     - The theorem states that every vector space has a basis. The author notes it is equivalent to full choice. 
     - **Tagging:** We tag it with `[FullChoice]` because the standard proof uses full choice (via Zorn's lemma). 
     - **Disposition:** We merge the pull request with the `[FullChoice]` tag. The graduate course can use it because they are operating in the classical view. The certification teams can avoid it if they do not accept full choice.

  2. **Hahn–Banach Theorem (for arbitrary Banach spaces via ultrafilter):** 
     - The author claims it only requires the Boolean prime ideal theorem (BPI). 
     - **Tagging:** We verify that the ultrafilter argument uses BPI (which is equivalent to the ultrafilter lemma). 
     - **Tag:** We tag it as `[BPI]`. 
     - **Disposition:** We merge with the `[BPI]` tag. The certification team that requires only dependent choice might reject it (if they do not accept BPI), but the one that accepts BPI can use it. The graduate course can use it without noticing the tag.

  **Explanation for Non-Specialist Members:**
  Full choice (AC) and dependent choice (DC) differ in strength and the kinds of results they prove. AC allows you to select an element from every set in an arbitrary collection of nonempty sets, even if the sets are not ordered in any sequence. DC is weaker: it only lets you make a sequence of choices when each choice depends on the previous ones. For example, DC is enough to prove that every countable set of nonempty sets has a choice function, or to build a sequence by recursion. AC is much stronger: it can prove the existence of a basis for any vector space (even an infinite-dimensional one) or a well-ordering of the reals. In terms of cost, AC is rejected by some constructivists because it implies the law of excluded middle (by Diaconescu's theorem) and allows "non-computable" objects. DC is more acceptable in some constructive settings (e.g., in Russian constructivism) and is often enough for analysis. 

  Regarding Diaconescu's theorem: it states that in a constructive set theory, if you assume the full axiom of choice, then you can prove the law of excluded middle. Our foundation is a dependent type theory, not set theory. However, if we were to add a set-theoretic style choice axiom (one that selects an element from every set in a type of sets) at the kernel level, it would indeed force excluded middle. But we are not doing that. We are only allowing the use of choice as an explicit axiom in specific proofs, and we are tagging the results that use it. So the constructive core remains: without invoking the axiom, the type theory is constructive. Therefore, the warning is valid in the abstract but does not apply to our specific plan because we are not making choice ambient. The third member is correct that we can avoid the problem by not having a global choice axiom in the kernel.

  **Strongest Objection from the Losing Side:**
  The most compelling objection comes from the formalist: that tagging introduces a false impression of contingency in mathematical truth. He argues that mathematics in practice is done with full choice and excluded middle, and that by tagging we are pretending that theorems could be false in some other setting, which he believes is a category mistake. This objection cuts deep because it challenges the very purpose of tagging: if mathematics is only done one way, why complicate the library? 

  We acknowledge this perspective and agree that for the graduate courses, the classical setting is the intended one. However, we must also serve the certification teams for whom the classical setting is not acceptable. The tag does not say the theorem is "conditionally true" but that it is "conditionally provable in our system." The library is not a single mathematical universe but a tool that must serve multiple. The formalist's objection is valid in a purely classical context, but we are not in such a context. We are in a context where two valid uses (classical and constructive) coexist. Therefore, we must make the dependencies explicit.

  **Conclusion:**
  We recommend the tagging option because it is the only way to meet the requirements of both constituencies without forking the library. It requires a significant but manageable transition effort. I move that the committee approve this recommendation and the transition plan.

  Respectfully submitted,
  [Your Name]
  Chair, Technical Steering Committee
answer: |-
  **MEMORANDUM**  
  **To:** Technical Steering Committee Members  
  **From:** Chair, Technical Steering Committee  
  **Date:** October 26, 2023  
  **Subject:** Resolution on Axiomatic Treatment of Choice Principles  

  ---

  ### **I. Recommended Decision**  
  After thorough analysis, **Option (2) — localize choice with explicit tagging — is recommended**, with the following variant:  
  > **All results proven using the law of excluded middle (LEM) or any choice principle (full/dependent choice, Boolean prime ideal (BPI), Zorn’s lemma, etc.) must carry machine-readable tags indicating the minimal non-constructive axiom required.** LEM and choice will remain explicitly invocable axioms but *not* ambient; untagged results are constructively valid by default.  

  This decision will be implemented via:  
  - A hierarchical tagging system: `[LEM]`, `[DC]` (dependent choice), `[BPI]`, `[AC]` (full choice).  
  - A queryable dependency graph for auditing.  
  - A classical "view" for educational users, auto-appending `[LEM+AC]` to results for textbook parity.  

  **Vote Proposal:**  
  *Approve the adoption of explicit tagging for non-constructive axioms, with transition plan below.*  

  ---

  ### **II. Rationale**  
  **A. Core Trade-offs Addressed:**  
  - **Auditability Requirement:** Contractors need traceability. Tags provide an automatable map of axiom use, satisfying certification without fragmenting the corpus (Option 4) or hiding dependencies (Option 1).  
  - **Educational Need:** Graduate courses require classical results. The classical "view" masks tags, mimicking textbooks.  
  - **Constructive Integrity:** Tags prevent silent erosion of constructive content. Unlike Option 1, ambient LEM/AC is *not* embedded, sidestepping Diaconescu’s concern (see §IV).  
  - **Minimal Viable Change:** Tags retrofit existing inconsistencies (e.g., untangling analysis proofs) without imposing an untested ambient base (Option 3) or duplicative maintenance (Option 4).  

  **B. Why Not Other Options?**  
  - **Option 1 (Ambient LEM+AC):** Fails auditing needs, invalidates constructive interpretation.  
  - **Option 3 (Ambient BPI+DC):** Still obscures specific dependencies (e.g., Hahn-Banach’s BPI use), limiting audit precision.  
  - **Option 4 (Parallel Branches):** Unsustainable at scale; syncing diverging contributions wastes effort.  

  ---

  ### **III. Transition Plan & Milestones**  
  **Phase 1: Framework Setup (Months 1–3)**  
  - **M1:** Implement tagging syntax and CI checks for new PRs.  
  - **M2:** Release automated tools to scan proofs for key terms (`Zorn`, `choice_fn`, `ultrafilter`, etc.).  
  - **M3:** Deploy dependency-graph generator.  

  **Phase 2: Retroactive Tagging (Months 4–12)**  
  - **M4:** Tag contractor’s list of functional-analysis results.  
  - **M6:** Tag all analysis/algebra files via automated scan + manual review (20 volunteers; 5 files/week each).  
  - **M12:** Full corpus tagged (95% coverage). Untagged results default to constructive.  

  **Phase 3: Pending PRs & Future Work**  
  - **Immediate action:** Merge both pending PRs with tags applied per rule below.  
  - **Ongoing:** Annual audits to maintain tag accuracy.  

  ---

  ### **IV. Contributor Rule & Pending PRs**  
  **Bright-Line Rule for Contributors:**  
  > If a proof invokes LEM or a choice principle, tag the result with the **weakest applicable axiom** (e.g., use `[BPI]` if BPI suffices). If uncertain, apply `[AC]` and note uncertainty in the PR; reviewers will adjust.  

  **Applied to Pending PRs:**  
  1. **Vector Space Basis (PR #442):**  
     - **Rule Application:** Proof uses Zorn’s lemma, equivalent to full choice (`[AC]`).  
     - **Disposition:** Merge with `[AC]` tag. Graduate courses see it as "standard"; auditors exclude if needed.  
  2. **Hahn-Banach Theorem (PR #457):**  
     - **Rule Application:** Ultrafilter argument relies on BPI, not full choice.  
     - **Disposition:** Merge with `[BPI]` tag (per author’s claim). Auditors accept if BPI is permitted.  

  ---

  ### **V. For Non-Specialists: Choice Costs and Diaconescu**  
  **A. Full vs. Dependent Choice:**  
  - **Dependent Choice (DC):** Constructs sequences where each choice depends on prior ones (e.g., "for every natural number, pick an element"). Sufficient for most analysis (e.g., Baire Category Theorem). *Cost*: Acceptable in some constructive systems.  
  - **Full Choice (AC):** Selects elements from *arbitrary* sets simultaneously (e.g., "pick an element from every set in an infinite family"). Needed for vector space bases or well-ordering ℝ. *Cost*: Forces excluded middle (Diaconescu), making proofs non-constructive.  

  **B. Diaconescu’s Warning:**  
  - **Concern:** Adding full choice to a constructive type theory implies LEM, collapsing constructive content.  
  - **Does It Apply Here?** **No**, because:  
    > We are **not** adding AC/LEM to the kernel. They remain *explicitly invoked axioms*, tagged at the theorem level. The constructive base (no ambient LEM/AC) stays intact.  

  The third member is correct: Diaconescu assumes set theory. Our type theory avoids this by keeping choice local.  

  ---

  ### **VI. Strongest Objection: Formalist’s Challenge**  
  **Objection at Full Force:**  
  > *"Tagging axioms as hypotheses falsely implies theorems might fail without them. Axioms are rules of the game, not empirical claims. Recording ‘AC → Theorem T’ suggests T is disputable mathematics — but no one here denies T’s truth under standard axioms. This is a category mistake that compromises rigor for illusory flexibility."*  

  **Why It Does Not Carry the Day:**  
  - **Purpose of Tags Is Practical, Not Philosophical:** Tags do not question the truth of theorems under ZFC; they record proof dependencies for *auditing* (contractor demand) and *computational generality* (constructive users).  
  - **Mathematics Is Not Monolithic:** Textbooks assume LEM+AC implicitly, but certification requires distinguishing AC from weaker principles (e.g., BPI). Tags reconcile these by making implicit assumptions explicit — akin to marking "proprietary code" in open-source.  
  - **The Auditor’s Need Prevails:** Without tags, we lose aerospace users. The formalist’s objection, while coherent, prioritizes purity over usability for high-stakes consumers.  

  ---

  ### **VII. Conclusion**  
  Tagging resolves our dual mandate: it serves educational users (via classical view) and certification teams (via auditable dependencies) without fragmenting the library. The transition is labor-intensive but feasible with tooling and volunteer effort. The formalist’s critique is acknowledged but outweighed by the necessity of trust and inclusivity in a multi-constituency project.  

  **Vote to adopt the tagging system and transition plan.**  
  **Estimated implementation start:** November 30, 2023.
