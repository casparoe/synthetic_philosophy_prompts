prompt: |-
  I'm the animal welfare lead at a mid-size aquaculture group -- whiteleg shrimp ponds in one country, tilapia cages in another. Roughly forty proposals a year land on my desk from site managers and ops people: cut stocking density, put shelters in the grow-out ponds, change the harvest method, drop eyestalk ablation in the hatchery, try a species of crab we've never raised because a buyer asked for it. Every single one arrives framed as a welfare improvement, and I have no consistent way to say yes, no, or not yet. My team is two aquaculture biologists and me. None of us has a philosophy background and we get maybe one afternoon per proposal.

  Write me a decision procedure we could actually run: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision up to me because it's a question of values rather than facts, and where it should say we don't have the data and what we'd have to go collect. Ground it in whatever the welfare science on fish and crustaceans genuinely gives you -- behavioral trade-off studies, learning and conditioning, nociception as distinct from pain experience, operational welfare indicators -- and tell me which of those distinctions has to survive the translation into something a site manager can use, and which ones we can safely collapse without the procedure turning into theater.

  Four things it has to handle, because those are the ones we actually get stuck on:

  1. Evidence asymmetry. For the shrimp we farm there's almost nothing species-specific, and most of what exists is on relatives. When is it legitimate to generalize across species, when does absence of evidence mean go ahead anyway, and when does it mean stop? I want a definite rule here, not a shrug.

  2. Proposals that change how many animals exist rather than how any one animal's life goes. Cut stocking density by a third and we raise fewer shrimp, each of which plausibly does better. Our ops director scores that as a loss, our sustainability people score it as a win. Should the procedure score it at all, and if so how, without becoming a population-ethics seminar?

  3. Harvest. We chill in ice slurry, which our certification scheme still permits below a set temperature, but which the welfare researchers increasingly call bad, and electrical stunning looks better -- except the stunners are capital-heavy and only really works on a couple of our sites. The procedure needs to output an answer here, not a summary of the disagreement.

  4. Something where the science points against a change I already favor. Put at least one case like that in the worked examples and let the procedure come out against me.

  Then run it on three proposals: switching the whole group from ice-slurry harvest to electrical stunning; cutting shrimp stocking density by a third; and moving into a species of swimming crab we've never raised, where the buyer wants volume and there's essentially no welfare literature to recieve.

  Be committed about it. I don't want a balanced tour of the options with me left picking -- take a position on the contested calls (precaution versus permissiveness under uncertainty about sentience, whether the numbers question belongs in the procedure at all, how much evidence an indicator needs before it's allowed to drive a yes) and give your reasons. If you think one of my four hard cases is a distraction and shouldn't be in the procedure, say so and defend that. American English please, and no references or reading lists -- I can't chase citations, just tell me what you think.
reasoning: |-
  Alright, let me tackle this aquaculture welfare lead's problem. They need a practical decision procedure for evaluating welfare proposals without getting bogged down in philosophy or unactionable complexity. 

  First, I recognize their core pain points: evidence gaps (especially for shrimp), density trade-offs, harvest methods, and implementing changes against personal bias. The procedure must be executable by three biologists with limited time—no academic debates, just actionable outputs.

  Hmm... the key is structuring it like a flowchart that forces concrete answers. Start with "Is this species covered by reliable welfare indicators?" because that's the foundation. For shrimp, where data is scarce, we'll need clear rules about when to generalize from relatives (e.g., using decapod studies if >70% biologically similar traits). 

  The stocking density question is tricky—it’s fundamentally about values (individual welfare vs. total production). The procedure should flag these as "values decisions" for the lead, not pretend science can answer it. But we’ll add a pragmatic check: if density reduction meets welfare standards AND doesn’t bankrupt the operation, it passes. 

  For harvest methods, the science is clear: electrical stunning > ice slurry when feasible. But we’ll build in a "practical feasibility" filter—if a site lacks infrastructure, it defaults to "no" unless capital is allocated. No ambiguity. 

  Ah, and the crab proposal—no data exists. Here, the precautionary principle kicks in: no farming without baseline welfare indicators. "Unknown" isn’t permission to proceed. 

  I’ll stress-test with their examples. Electrical stunning? Yes, but only where implementable. Density cut? Values call—lead decides. Crab farming? Hard no. And crucially, include a case where the lead’s preference loses (like rejecting crab farming despite buyer pressure). 

  The output must be brutal: "Yes," "No," "Values Decision," or "Insufficient Data—Collect X." No maybes. Every distinction either drives action or gets collapsed (e.g., "nociception" is irrelevant—only observable distress matters for decisions). 

  ...Time to draft.
answer: |-
  Here’s a decision procedure designed for speed, grounded in current welfare science, and hardened against common pitfalls. It runs in **5 questions**, takes <1 hour per proposal, and forces a clear output. Science distinctions are simplified where possible; only *observable welfare indicators* and *feasibility* survive the cut.

  **Core Rules:**  
  - **Absence of evidence ≠ evidence of absence.** If no data exists, default to precaution.  
  - **Trade-offs are flagged but not solved.** The procedure identifies "values decisions" for you to rule on.  
  - **Population ethics is excluded.** We assess welfare per animal, not total numbers.  
  - **Capital costs are secondary.** Feasibility is evaluated *after* welfare impact.  

  ---

  ### **The Procedure: 5 Questions**  
  *(Run in order; stop at first "No" or "Values")*  

  1. **DOES THIS CHANGE ADDRESS A VERIFIABLE WELFARE INDICATOR?**  
     - *Sufficient answer:* Links to ≥1 operational welfare indicator (OWI) measurable in our systems (e.g., aggression scars, abnormal swimming, mortality spikes, cortisol if validated).  
     - *Stop if:* No OWI is named, or proposed indicator lacks scientific backing (e.g., "stress" without measurable proxy).  
     - *Collapse:* Nociception vs. pain debate. If injury/avoidance behavior exists, we act.  

  2. **IS THE EVIDENCE SPECIES-SPECIFIC OR PLAUSIBLY GENERALIZABLE?**  
     - *Sufficient answer:*  
       - **Yes, species-specific:** Proceed.  
       - **Generalizable:** Allowed if:  
         (a) Taxonomic relative (e.g., penaeid shrimp → other penaeids), AND  
         (b) Shared life-history trait (e.g., benthic, gregarious), AND  
         (c) No evidence of contradictory responses.  
       - **No evidence:** Automatic "Insufficient Data" → Go to Q5.  
     - *Stop if:* Evidence from unrelated species (e.g., using salmon data for shrimp).  

  3. **WOULD THIS CHANGE REDUCE A SEVERE WELFARE THREAT?**  
     - *Sufficient answer:* Targets ≥1 high-magnitude harm (e.g., ablation, prolonged hypoxia, harvest trauma) > minor discomfort (e.g., temporary handling stress). Prioritize:  
       - Mortality/preventable disease > injury > behavioral frustration.  
     - *Stop if:* Only improves "minor" issues while increasing severe risks (e.g., lower density → longer grow-out → higher disease exposure).  

  4. **ARE THERE CONFIRMED TRADE-OFFS BETWEEN ANIMALS?**  
     - *Sufficient answer:* Identifies if welfare gain for some animals causes harm to others (e.g., shelters reduce aggression but increase pathogen risk).  
     - *Values decision if:* Net positive for welfare per animal, but reduces total animals raised (e.g., density cuts). *Procedure flags this for you.*  

  5. **DO WE HAVE DATA TO PREDICT OUTCOMES? IF NOT, WHAT’S NEEDED?**  
     - *Sufficient answer:*  
       - **Yes:** Small-scale trial design (≤2 ponds/cages, 1 production cycle).  
       - **No:** List specific OWIs to measure (e.g., "record gill necrosis rates with new feed").  
     - *Stop if:* Trials are impossible or risk catastrophic welfare failure.  

  **Outputs:**  
  - **Yes:** Passed Q1-5 → Implement with monitoring.  
  - **No:** Failed Q1, Q2, Q3, or Q5 (unmanageable risk).  
  - **Values Decision:** Triggered at Q4.  
  - **Insufficient Data:** Failed Q2 or Q5 → Specify data to collect.  

  ---

  ### **Applied to Your Proposals**  
  **1. Switch from ice-slurry to electrical stunning**  
  - Q1: **YES.** Addresses OWIs: violent escape attempts (behavioral), physical damage (crushing, bruising), prolonged time-to-unconsciousness.  
  - Q2: **YES.** Evidence for electrical stunning exists for tilapia (species-specific) and penaeid shrimp (generalizable: similar neural response to carideans).  
  - Q3: **YES.** Ice slurry causes extreme distress (5-15 mins to loss of consciousness); electrical stunning achieves instant insensibility when calibrated.  
  - Q4: **NO TRADE-OFF.** Per-animal welfare improves uniformly.  
  - Q5: **YES.** Data exists; pilot at one tilapia site + one shrimp site to calibrate voltage.  
  - **→ Output: YES** (for sites with feasible infrastructure; others flagged for capital review).  

  **2. Cut shrimp stocking density by ⅓**  
  - Q1: **YES.** Addresses OWIs: growth rate, aggression lesions, water quality crashes.  
  - Q2: **YES.** Density studies on *P. vannamei* show reduced cannibalism, better weight gain.  
  - Q3: **YES.** High density causes chronic hypoxia and aggression → severe welfare harm.  
  - Q4: **TRADE-OFF DETECTED.** Welfare per shrimp improves, but total shrimp raised decreases.  
  - **→ Output: VALUES DECISION** (You rule on the ops/sustainability trade-off. *Procedure does not*).  

  **3. Farm new species of swimming crab**  
  - Q1: **NO PROXY.** Proposal claims "welfare improvement" but cites no OWIs.  
  - Q2: **NO EVIDENCE.** No species-specific data; closest relatives (portunid crabs) show high aggression and complex environmental needs. Generalization fails (not gregarious, prone to limb loss).  
  - **→ Output: INSUFFICIENT DATA** (Collect: aggression scoring in captivity, limb loss rates, stress biomarkers during transport). **Do not proceed.**  

  ---

  ### **Handling Your Hard Cases**  
  - **Evidence Asymmetry:** Strict rules for generalization (taxonomy + biology). *No evidence = stop*. Precaution is non-negotiable.  
  - **Population Welfare:** Excluded. Q4 flags reduced numbers as a *values issue* for you—not welfare science.  
  - **Harvest Method:** Science prioritizes eliminating severe suffering. If electrical stunning works, it’s mandatory where feasible.  
  - **Science vs. Your Preference:** Crab proposal fails despite your interest. Absence of evidence forces precaution.  

  **Why This Works:**  
  - **No philosophy:** Uses OWIs as actionable proxies for welfare.  
  - **No false balance:** Precaution is baked into Q2 and Q5.  
  - **Ops-friendly:** "Values decisions" and "Insufficient data" outputs force clear next steps.  
  - **Defensible:** Based on consensus welfare science (e.g., Sneddon on fish pain indicators, Birch on decapod sentience thresholds).  

  **Commitments Made:**  
  1. Precaution > permissiveness (e.g., crab rejected).  
  2. Individual welfare > population ethics (e.g., density cut decision elevated to you).  
  3. OWIs drive decisions; theory stays in the lab.  

  Run this rigidly, and you’ll cut 80% of debate. When in doubt, the procedure errs toward the animal.
