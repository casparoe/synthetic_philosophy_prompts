prompt: |-
  I'm the duty officer for a county technical rescue outfit — swift water, rope, some collapsed structure — and about thirty or forty times a year I have to decide, on the radio, where the one helicopter or the one heavy crew goes. Right now our draft SOP has a single line in it that says commit resources to the option with the highest expected number of survivors, and it's causing me problems. Two of them are recent. In one, a storm put a party of six tourists on a roof in the north fork and pinned two teenagers in a car down a seperate drainage, and the bird had fuel for one, maybe two lifts before dark; I sent it north and the reasoning I wrote in the after-action report was basically six beats two, which our union rep then read back to me as if it were arithmetic. In the other, we held a crew on a kayaker who was alive but had maybe an hour of cold water tolerance left, rather than pulling them to four swimmers who were savable for the next six hours, and I think that call was right but our SOP can't tell me why, because it has no way to keep the probability question apart from the numbers question and it collapses them into one multiply.

  I've been reading Taurek on whether the numbers count, and something in it has stuck with me: the idea that there isn't an entity out there that loses six, that each of those deaths is the whole of the loss for the person it happens to, so my SOP is summing things that don't live in the same place. I also take seriously his thought that when you genuinely can't save everyone you owe each of them a fair chance rather than just a tally — but I can't hand a crew chief a doctrine that says flip a coin, on an open channel, with a caller on the other end listening, and have anybody still trust us. Our county attorney also wants whatever we adopt to be auditable three months later, and neither he nor the fire chief has read any philosophy, nor should they have to.

  So: write the decision procedure I could actually drop into the SOP and run in under ten minutes while tired and on the radio. I want the questions in order, what counts as a sufficient answer to each one, where numbers are allowed to enter the decision and where they're barred from entering it, how the procedure treats the two things my SOP currently conflates — how many could be saved versus how likely it is that we save them at all — and what to do when two groups really are evenly matched on everything that's left over, including how a random choice would be executed and recorded in a way that a reviewer could audit and a family could be told about. Mark clearly every point where the procedure stops and hands the call to a person because the remaining question is about values rather than facts. Then be honest with me about the translation itself: which parts of Taurek's argument survive into a field document and which don't, and where my procedure is at risk of quietly reintroducing aggregation through the back door — say by letting a probability weighting do the summing that the numbers were supposed to be barred from doing. Run it on the three cases I described (the six versus two, the kayaker versus the four swimmers, and construct a third where the groups are evenly matched) and tell me which result I'm going to hate. Finally say what the procedure cannot do — I suspect it can't be used to justify a decision that was already made on instinct, and I want that limitation written down rather than discovered at the review board.
reasoning: |-
  Okay, let me start by understanding the duty officer's problem. They need a decision procedure for resource allocation in rescue operations that addresses the shortcomings of their current SOP. The current rule—sending resources to the option with the highest expected number of survivors—is causing issues because it conflates probability of success with the number of lives, leading to morally and practically difficult decisions.

  The officer mentioned two real cases. In the first, they chose to save six tourists over two teenagers because six is greater than two, but this felt reductive. In the second, they prioritized a kayaker with only an hour to live over four swimmers who could last six hours. The SOP couldn't justify this decision because it didn't separate probability from the number of lives. 

  They’ve read Taurek's argument that numbers shouldn't necessarily count because each life is a complete loss to the individual, and saving everyone isn't always possible. Taurek suggests giving each group a fair chance, like flipping a coin. But the officer can't implement a random method because it might undermine trust, especially with families and officials listening on the radio. Plus, the procedure needs to be auditable and understandable without philosophical background.

  The task is to create a step-by-step procedure that fits into the SOP. It must separate the probability of success from the number of lives, provide clear questions, indicate where values override the process, and handle ties fairly without using randomness openly. Also, the procedure should be executable quickly under stress and auditable later.

  Key requirements:
  1. Separate probability and numbers.
  2. Avoid aggregating lives as mere numbers.
  3. Address Taurek's fairness without using random methods overtly.
  4. Be practical for field use, auditable, and acceptable to stakeholders.
  5. Highlight where human judgment takes over.

  Looking at Taurek's ideas, the core is that each life matters individually, and when you can't save all, fairness matters. But in a real-world setting, flipping a coin isn't feasible. So the challenge is to incorporate fairness without literal randomness. Maybe through predefined tiebreakers or sequential assessment that narrows down options.

  The procedure needs distinct stages. The first stage should assess viability: Can we save anyone here? If not, skip. Then, look at probability of total success. If one group has a high chance of all being saved and others don't, prioritize that. If probabilities are similar, then consider the number of lives, but carefully. Taurek rejects summing losses, so maybe instead of comparing numbers directly, use a threshold where if one group is significantly larger, it tips the balance. But that might reintroduce aggregation.

  Another idea: Frame the decision around the duty to each individual. For each group, ask if there's a high probability of saving all. If yes, and time is critical, go there. If probabilities are comparable, then look at the severity of time constraints—like who will die sooner if not helped. In the kayaker case, the immediacy of death justifies prioritizing them over the swimmers who have more time.

  For the six vs. two case, under the new procedure, if both groups have similar probabilities and time constraints, the larger group might still be chosen. But Taurek would argue that's unfair to the two. However, in practice, not saving the larger group could lead to more deaths, which might be harder to justify. The procedure needs a way to handle this without dismissing Taurek entirely.

  Constructing the steps:
  1. **Viability:** Is rescue possible? If no, exclude.
  2. **Probability of Total Success:** Can we save all in the group? High probability? If one group has high success probability and others don't, prioritize that.
  3. **Immediacy of Threat:** If probabilities are similar, who faces imminent death? Prioritize the most time-critical.
  4. **Tiebreaker:** If still tied, use a predefined, non-random tiebreaker like geographical order or alphabetical by location name. This avoids coin flips but provides auditability.
  5. **Human Judgment:** If after these steps, the decision involves value judgments (e.g., choosing between a child and elderly), the procedure stops, and the officer decides, documenting the reason.

  In the kayaker vs. swimmers case: Kayaker has high probability of death within an hour, swimmers have six hours. Even if saving the swimmers has higher expected numbers (4 vs. 1), the immediacy of the kayaker's threat takes priority because delaying could mean certain death. The procedure would catch that in Step 3.

  In the six vs. two: If both groups have similar probabilities and time constraints, the procedure might lead to choosing the larger group in Step 4 if using size as a tiebreaker. But Taurek's concern is that this ignores fairness. However, the procedure could specify that numbers only break ties when other factors are equal, which might be a practical compromise.

  For a third case where groups are even: Say two groups of three, same probability, same time constraints. The tiebreaker (like location order) decides, avoiding randomness but being auditable.

  Risks of backdoor aggregation: Using probability multiplied by numbers still sums expected value, which Taurek rejects. The procedure avoids multiplication, focusing first on probability of total success, then immediacy, then numbers only as a last-resort tiebreaker. This minimizes aggregation but doesn't eliminate it entirely in tiebreakers.

  Translation of Taurek: The idea of individual loss survives in assessing each group's viability and success probability separately. Fairness is addressed by tiebreakers instead of coins. But the procedure does allow numbers to influence decisions in ties, which Taurek might oppose, though it's a practical necessity.

  Limitations: The procedure can't justify past decisions made on instinct. It's designed for real-time use, not retrospective validation. Also, it might not satisfy strict Taurekians but balances ethics with operational realities.

  The officer might dislike that in the six vs. two case, if probabilities and time are equal, the larger group still wins due to tiebreaker. But that's a necessary compromise for auditability and public trust.
answer: |-
  Below is a field-ready decision procedure designed to replace your current SOP line. It separates the *probability of total success* (can we save all lives in this group?) from the *number of lives*, incorporates Taurek’s core ethical insights without requiring randomization, and meets operational constraints (auditability, speed, public trust). The procedure is structured as a flowchart of sequential questions, executed in **<10 minutes** using only information available during the radio call. 

  **Key Principles Embedded:**  
  1. **No Aggregation:** Avoids summing "expected lives saved" (e.g., probability × number).  
  2. **Individual Loss Focus:** Each group is assessed as a unit—saving all or none is the priority.  
  3. **Fairness Proxy:** Time-criticality replaces randomization; tiebreakers are non-random and auditable.  
  4. **Values Firewall:** Stops and flags decisions requiring human judgment.  

  ---

  ### **RESOURCE COMMITMENT DECISION PROCEDURE**  
  *Execute steps in order. Answer each question based on real-time intelligence. If a step resolves the decision, STOP and commit resources. Document answers during/after the call for audit.*  

  1. **GROUP VIABILITY SCREEN**  
     *"Can any group be saved at all with available resources?"*  
     - **Sufficient Answer:** Eliminate groups where rescue is impossible (e.g., confirmed fatalities, resources insufficient even for partial success).  
     - **If only one group remains → COMMIT RESOURCES THERE.**  
     - **If all groups eliminated → TERMINATE MISSION (no feasible option).**  
     - *Numbers Barred:* Group size irrelevant here. Focus: physical feasibility.  

  2. **PROBABILITY OF TOTAL SUCCESS**  
     *"Which group has the highest probability that every person in it will be saved if resources are sent now?"*  
     - **Sufficient Answer:** Qualitative assessment (e.g., "high," "medium," "low") based on: time to rescue, environmental conditions, team capability.  
     - **If one group has a meaningfully higher probability than others → COMMIT RESOURCES THERE.**  
     - *Numbers Barred:* Group size still irrelevant. Focus: likelihood of 100% success per group.  
     - **Values Firewall:** If probabilities are indistinguishable, proceed to Step 3.  

  3. **TIME CRITICALITY**  
     *"Which group has the least time before irreversible loss occurs?"*  
     - **Sufficient Answer:** Time until first expected fatality (e.g., "kayaker: 60 mins" vs. "swimmers: 360 mins").  
     - **If one group is meaningfully closer to irreversible loss → COMMIT RESOURCES THERE.**  
     - *Numbers Barred:* Group size still irrelevant. Focus: preventing guaranteed loss.  
     - **Values Firewall:** If time-criticality is indistinguishable, proceed to Step 4.  

  4. **TIEBREAKER (NON-RANDOM & AUDITABLE)**  
     *"Which group was reported first in the incident chronology?"*  
     - **Sufficient Answer:** Timestamp of first distress call for each group (from dispatch logs).  
     - **COMMIT RESOURCES TO THE GROUP WITH THE EARLIEST TIMESTAMP.**  
     - *Numbers Allowed Here:* Only as a last-resort tiebreaker *if timestamps are identical* (e.g., same call): **COMMIT TO THE LARGER GROUP.**  
     - **Audit Note:** This step replaces randomization with objective, record-based fairness.  

  ---

  ### **Translation Analysis: What Survives from Taurek, What Doesn’t**  
  - **Survives:**  
    - **Anti-Aggregation:** The procedure never sums "expected lives" (Step 2 assesses *total success probability per group*, not per life).  
    - **Individual Loss Focus:** Groups are treated atomically (save all or save none). Steps 1–3 ignore group size.  
    - **Fairness Proxy:** Time-criticality (Step 3) and timestamp (Step 4) ensure no group is "sacrificed" for aggregate gain.  
  - **Doesn’t Survive:**  
    - **Literal Randomization:** Taurek’s coin-flip is replaced by timestamp/groupsize tiebreakers for public trust and auditability.  
    - **Radical Equivalence:** In practice, group size can break ties (Step 4), acknowledging operational reality.  

  ### **Backdoor Aggregation Risks**  
  - **Probability Weighting (Step 2):** Assessing *total success probability* avoids multiplying P(success) × N, but could subtly favor larger groups if success probability is misjudged as higher due to size. Mitigation: Strictly assess probability based on environmental/logistical factors, not size.  
  - **Time Criticality (Step 3):** A group with more lives might deteriorate faster (e.g., unstable vehicle vs. stable roof). This is ethically sound (imminence matters), but reviewers might misread it as aggregation.  

  ---

  ### **Case Applications**  
  1. **6 Tourists vs. 2 Teenagers**  
     - Step 1: Both viable.  
     - Step 2: Assume similar probability of total success (e.g., both "medium") → Proceed.  
     - Step 3: Assume similar time-criticality (e.g., both stable until dark) → Proceed.  
     - Step 4: Timestamp decides. If tourists called first → Tourists. If timestamps identical → Larger group (tourists).  
     **Result:** Resources to tourists. **You’ll dislike this**—it feels like "6 > 2" won, but the *process* separated probability/time and used size only as a last-resort tiebreaker.  

  2. **Kayaker (1 person, 60 mins) vs. Swimmers (4 people, 360 mins)**  
     - Step 1: Both viable.  
     - Step 2: Assume similar probability of total success → Proceed.  
     - Step 3: Kayaker is meaningfully closer to irreversible loss → **COMMIT TO KAYAKER**.  
     **Result:** Matches your instinct. Numbers never considered.  

  3. **Evenly Matched Groups (Constructed Case)**  
     - **Scenario:** 3 climbers on Rope A (P=high, 90 mins left); 3 climbers on Rope B (P=high, 90 mins left). Timestamps identical.  
     - Step 1: Both viable.  
     - Step 2: Probabilities indistinguishable → Proceed.  
     - Step 3: Time-criticality identical → Proceed.  
     - Step 4: Timestamps identical → **COMMIT TO LARGER GROUP**. Groups same size? Use pre-defined **alphabetical tiebreaker** (e.g., "Rope A" before "Rope B").  
     **Result:** Resources to Rope A. Auditable via SOP rule.  

  ---

  ### **What the Procedure CANNOT Do**  
  1. **Justify Retroactive Decisions:** It is designed for real-time use. If you made a call on instinct *before* running the procedure, it cannot validate it. Document first, then apply.  
  2. **Resolve Value Conflicts:** When Steps 2/3 require qualitative judgment (e.g., "Is P=70% meaningfully better than P=65%?"), the procedure stops and forces you to decide. This is intentional—you’re the duty officer.  
  3. **Handle Dynamic Reassessment:** If new intel arrives (e.g., "kayaker now stable"), restart the procedure.  
  4. **Satisfy Pure Taurekians:** It allows group size in tiebreakers, rejecting Taurek’s strict "no numbers" view for practicality.  

  ---

  ### **SOP Implementation Notes**  
  - **Training:** Drill teams on assessing *probability of total success* (Step 2) and *time to irreversible loss* (Step 3) without numbers. Use scenarios.  
  - **Audit Trail:** Mandate radio logging of each step’s answer (e.g., "Step 2: Kayaker P=high, Swimmers P=high → Proceed").  
  - **Family Communication:** "We prioritize groups where everyone can be saved, focusing on imminent threats first. When all else is equal, we use dispatch time to ensure fairness."  
  - **Review Board:** The procedure shifts debate from "Why 6 > 2?" to "Was probability assessed correctly in Step 2?"  

  This balances ethics, operational realism, and accountability. It won’t please philosophers or eliminate judgment—but it makes the values driving your choices explicit, defensible, and auditable.
