  #### 2. Dissolution of Apparent Conflicts: Item 7
  **Claim**: Your friend argues that in the waiting-for-evidence case, Reflection forces you to hold an absurd credence on Monday (e.g., both high and low).  
  **Dissolution**: This misinterprets Reflection.  
  - Reflection requires: For any r, **Cr_now(H | Cr_t(H) = r) = r**.  
  - In the test case, let Cr_t(H) be high (r_high) if E (evidence) occurs, low (r_low) otherwise. Reflection demands:  
    - Cr_now(H | Cr_t(H) = r_high) = r_high  
    - Cr_now(H | Cr_t(H) = r_low) = r_low  
  - This is satisfied by conditionalization (2): Cr_now(H | E) = r_high and Cr_now(H | ¬E) = r_low. Your unconditional Cr_now(H) is a weighted average (e.g., P(E) * r_high + P(¬E) * r_low), not r_high or r_low.  
  **Lesson**: Reflection constrains *conditional* credences, not unconditional ones. It is compatible with uncertainty about future evidence. No absurdity arises.  
  **Verdict**: Item 7 is not a problem; your friend's objection dissolves upon correct application of Reflection.

