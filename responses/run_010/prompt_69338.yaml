  - You must give up strict conditionalization (allow that credences can change without new evidence, perhaps by some form of drift or non-evidential updating).
  - Or you must reject Reflection (so that you can have Cr_now(H | Cr_t(H)=0.6) ≠ 0.6 even though you plan to have Cr_t(H)=0.6 without new evidence).
  - Or you must abandon the plan (i.e., not expect your credence to change without new evidence).

  But note that you endorse the plan and would not cancel it. So you are committed to the change.

  Also, note that in your account, you say that the life, practices, and company will make the claim seem more plausible. This might be interpreted as a change in your credence function that is not driven by new evidence. But conditionalization requires that the only changes are due to evidence.

  ## 3. The role of conciliationism (item 6)
  You say that at the end of the trip, you will be a peer to your current self: same evidence, same competence, no mistake discovered. Then by conciliationism, if your future self has credence 0.6 and your current self has 0.2, then when you become that future self, you should learn about your current self's credence (0.2) and conciliationism would require you to move toward 0.2. But you expect to be at 0.6. So that would require you to lower your credence. But then, if you become aware of this dynamic, your current self might try to adjust.

  This introduces a potential instability. However, note that at the future time, you have the same evidence as now? But according to your plan, you are not acquiring new evidence. So the evidence base is the same. Then, if you are a peer, then conciliationism says that upon learning of the disagreement (between your past and present self), you should adjust. But in this case, the past self and the future self have the same evidence? Actually, at the future time, you have the same evidence as now, but now you have not yet taken the trip? No, the trip does not provide new evidence. So the evidence set is the same.

  Therefore, at the future time, you are a peer with your past self. So if at the future time you learn that your past self had credence 0.2, then by conciliationism, you should adjust your credence from 0.6 toward 0.2. But that would make your credence at the future time less than 0.6. But you expected 0.6. So there is a problem.

  Moreover, if you anticipate that, then at the present time, you might not expect 0.6. But you do.

  So item 6 (conciliationism) sharpens the problem in item 5. It adds a reason why the future credence of 0.6 might not be stable.

  But note: at the future time, when you are aware of the disagreement, you are no longer in the same state as your past self: you now have the additional information that your past self had a different credence. So the evidence base is now different (it includes the fact of the past credence). Therefore, conciliationism might not require you to move all the way to the average? Or it might. This is a thorny issue.

