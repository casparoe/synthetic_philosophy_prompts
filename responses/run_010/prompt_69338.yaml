  But you currently assign 0.2. So there is a contradiction.

  Therefore, you cannot be certain that your future credence will be 0.6 without already having a credence of 0.6. But in your plan, you are not certain? Let's see: you say you "expect" it to be around 0.6. So perhaps you are not certain. Then, let r be the event that Cr_t(H)=0.6. Then:

  Cr_now(H | r) = 0.6

  But your unconditional Cr_now(H)=0.2. This implies that you must assign positive probability to the event that Cr_t(H) is not 0.6. Moreover, the event that Cr_t(H) takes on other values must bring down the average.

