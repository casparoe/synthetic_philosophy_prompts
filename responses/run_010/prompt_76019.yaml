answer: |-
  **ADVERTISEMENT FOR THE POSITION OF LOBBY NOTICEBOARD ORDERING PRACTICE**  

  **(1) ABOUT THE POST**  
  The Committee on Custom seeks applications to fill the vacancy of Lobby Noticeboard Ordering Practice, following the regrettable dissolution of the previous incumbent after eleven years of uninterrupted service. The former practice operated on a strictly top-down basis: new notices were affixed to the uppermost available space, displacing older items downward until their natural expiration at the board’s lower edge. This regularity was neither mandated nor documented, yet functioned adequately until disrupted by an alternative bottom-up methodology. The Committee emphasises that this post is not a salaried role, nor a set of rules to be enforced, but a *self-perpetuating behavioural regularity* capable of resolving recurrent coordination problems among residents. The successful applicant will be expected to operate without administrative intervention or explicit agreement.  

  **(2) THE SUCCESSFUL CANDIDATE**  
  Ideal applicants must satisfy three core requirements:  
  - **Self-Sustaining**: Once adopted, adherence must generate its own incentive for continuation. No external enforcement or reminders may be required.  
  - **Arbitrary**: The practice must lack intrinsic superiority over alternatives (e.g., top-down vs. bottom-up). Its value derives solely from universal adoption, not efficiency or moral merit.  
  - **Conditional**: Participants must conform *only* on the expectation that others will conform. Should expectations lapse, adherence must cease.  
  Crucially, the practice must attain the status of *common knowledge*: all residents must know it is in force, know that others know, know that others know they know, etc. — without any formal declaration or public resolution. Announcements inherently undermine this criterion.  

  **(3) APPLICANTS THE COMMITTEE CANNOT CONSIDER**  
  The Committee regrets it is unable to entertain submissions from:  
  - **The Intrinsically Superior**: Proposals justifying themselves through inherent efficiency, aesthetic appeal, or logical necessity (e.g., "Top-down is objectively better as gravity pulls eyes downward"). A convention’s power lies in its arbitrariness; merit invalidates candidacy.  
  - **The Conditional Non-Conformist**: Individuals offering to comply "if everyone else does" while reserving the right to act unilaterally. Conformity must be universally conditional on others’ conformity — no exceptions.  
  - **The Promissory Solutions**: Applicants submitting signed pledges, covenants, or the Committee’s own 21–19 vote resolution (see Clause 5). If mutual promises sufficed, a convention would be redundant.  
  - **The Retroactive Instantiationists**: Claims that a practice was "always in force" based on unconscious, unarticulated, or hypothetical resident beliefs. The Committee lacks apparatus to audit subjective mental states, rendering such applications non-falsifiable and void.  

  **(4) REMUNERATION, TENURE, AND SELECTION PROCEDURE**  
  The position is unpaid in perpetuity. Offering remuneration would transform conformity into a transactional exchange, negating the convention’s self-sustaining character. Tenure is indefinite, contingent solely on continuous, expectation-driven adherence by residents.  
  The Committee acknowledges an inherent paradox: it cannot *select* a candidate, as any authoritative imposition would prevent the practice from becoming common knowledge through voluntary, conditional adherence. Consequently, after exhaustive review, the Committee recognises that the *only salient candidate* — owing to its historical precedent and familiarity — is the original top-down practice. It is therefore reappointed by default. Residents are advised that this reappointment is not an edict but a focal point for re-coordination.  

  **(5) NOTE ON THE RECENT VOTE**  
  The Committee’s 21–19 vote endorsing the top-down method is hereby rescinded as counterproductive. The vote created common knowledge of *non-universal expectation* (the 19 voters do not expect the 21 to persist, and vice versa), thereby eroding the conditional preference for conformity. The vote is now a historical document with no operational status. Residents are urged to initiate the reappointed practice by posting their next notice at the *top* of the board, purely as a speculative gesture. It is hypothesised that such an act, if observed, may catalyse shared expectations of recurrence. Until this occurs, the noticeboard will remain bifurcated. The Committee reminds residents that conventions emerge from practice, not resolutions — and that this advertisement is purely diagnostic, not a solution.  

  ---  

  **Key Lewisian Elements Embedded:**  
  - **Arbitrariness**: Clause 3’s rejection of "intrinsically superior" solutions mirrors Lewis’s emphasis on conventions as solutions indifferent to their content (*Convention*, Sect. I.2).  
  - **Conditionality & Mutual Expectation**: Clause 2’s "conditional" requirement and Clause 5’s vote analysis reflect Lewis’s definition: a convention is a preference to conform *if* others do (Sect. I.1).  
  - **Common Knowledge**: Clause 2’s "common knowledge" criterion and Clause 5’s vote fallout directly apply Lewis’s rigorous treatment (Sect. II.2).  
  - **Salience**: Clause 4’s default reappointment via "focal point" invokes Lewis’s solution to coordination problems without communication (Sect. 3.3).  
  - **Promises vs. Conventions**: Clause 3’s dismissal of "promissory solutions" echoes Lewis’s argument that conventions persist *without* promises or threats (Sect. I.3).  

  The satire targets the committee’s futile instrumentalism — treating a convention like a hireable employee — while preserving affection through earnest, jargon-clumsy execution. The bathos of applying high theory to a noticeboard is in the premise itself.
