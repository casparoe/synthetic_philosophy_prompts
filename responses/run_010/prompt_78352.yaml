answer: |-
  **OPINION OF TRIBUNAL MEMBER**  
  **Regarding Appeal of [Cooperative Name]**  

  ### I. Introduction  
  1. This appeal concerns the proper interpretation of Clause 4(b) of the Capital Expenditure Rebate Scheme (1981), which provides: "A rebate of five per cent of the qualifying expenditure of an applicant, up to a maximum of fifty thousand dollars per applicant in any year." The appellant cooperative, comprising 31 member farms (each independently eligible), lodged a single claim aggregating $1,620,000 in qualifying expenditure. The assessment officer awarded a rebate of $50,000, applying the maximum once to the claim. The cooperative contends the maximum attaches to each member farm, entitling it to $81,000 (i.e., 31 × $2,610, rounded). I recommend dismissing the appeal, affirming the $50,000 award. The eleven stayed claims shall be determined consistently, and the agency’s guidance manual requires revision to clarify this outcome. My reasons address the panel’s divergent views and the dispositive textual, contextual, and purposive factors.  

  ### II. The Text and Its Context  
  2. **The threshold question**: Does "per applicant" refer to the entity lodging the claim or to each underlying person incurring expenditure? The provision links the maximum to "an applicant," not to "each person" or "each enterprise" whose expenditure is claimed. The word "applicant" appears only in the rebate clause and the separate eligibility clause, which restricts eligibility to "enterprises with fewer than 250 employees." The eligibility clause uses "applicant" synonymously with the entity seeking the rebate—here, the cooperative as a single filer. Nothing in the text suggests "applicant" morphs into multiple entities when a consortium applies.  

  3. **The strongest counterargument** (per-member reading): The phrase "qualifying expenditure of an applicant" could imply expenditure belongs to individual members, making them the true "applicants." This is superficially plausible but collapses under scrutiny. First, the syntax ties "applicant" to the claim ("per applicant in any year"), not to the expenditure’s origin. Second, the scheme has always required a single application per claim; it lacks machinery for apportioning rebates among members or verifying member-level compliance in a joint filing. The per-member reading thus demands an unstated premise: that "applicant" means "each person on whose behalf expenditure is claimed." But the text does not say this, and inserting it rewrites the provision.  

  ### III. Purpose and Consistency  
  4. **The scheme’s purpose**: The enabling instrument aims to "defray costs of small operators," with "operator" singular. Rebates are capped to concentrate benefits on genuine small operators, preventing large entities from dominating funds. The per-member reading would permit consortia to access multiple maxima, enabling rebates vastly exceeding $50,000—here, $81,000 for a group with aggregate expenditure akin to a mid-sized enterprise. This undermines the cap’s anti-windfall function.  

  5. **Administrative practice**: Forty-four years of uniform application to single entities (yielding 38,000 decisions) confirm the agency’s settled understanding. While no prior joint claim arose, this consistency reinforces that "applicant" was always the filer. The 2009 guidance footnote (though non-binding) aligns with this. The cooperative argues past practice is irrelevant because it never tested joint claims. But consistency in application to identifiable "applicants" is probative: it shows the provision operated as written, without implying ambiguity.  

  6. **The indeterminacy counterargument**: One colleague contends the text and history are equally consistent with both readings, making this a prospective policy choice. I acknowledge force in this: the drafting file is silent on joint claims, and no prior case forced a choice. But indeterminacy exists only if we ignore context. The phrase "per applicant" naturally refers to the actor in the application process—the filer. To read it as referring to unnamed third parties (members) requires affirmative evidence, which is absent. Where a provision’s ordinary meaning aligns with its purpose and history, we are not making law but applying it.  

  ### IV. The "Disposition" Theory  
  7. **The third view**: Meaning derives solely from administrative dispositions (e.g., the 2009 footnote and officer’s practice). This has attraction: it avoids metaphysical debates about "true meaning" and promotes predictability. But it fails here. First, dispositions predict what *will* be done, but our task is to determine what *should* be done under the provision. The officer’s decision (and footnote) might be erroneous—indeed, that is the appeal’s premise. Second, the footnote’s drafter (an outside contractor) had no authority to bind interpretation, and the habit of applying the cap to single-filer claims did not contemplate joint filings. Basing a $31,000 denial on this thin record is unjust.  

  ### V. Retroactivity and Fairness  
  8. **The complication**: If the provision was indeterminate pre-ruling, applying a new rule retroactively to this cooperative is unfair. But this presupposes indeterminacy, which I reject. The text always pointed to one reading: the cap applies per filer. The cooperative chose to file jointly, accepting the agency’s application process. There is no evidence it relied on a per-member reading; its approach was strategic, not faith-based. Fairness thus favors consistency with the scheme’s design, not a windfall for novel filing.  

  9. **Policy consequences**: Adopting the per-member reading would incentivize artificial consortium claims to multiply caps, straining funds and administration. Conversely, the single-cap reading ensures predictability. The stayed claims—all consortium filings—must be dismissed or adjusted to $50,000 per claim. The guidance manual should be amended to reflect this ruling but warrants stakeholder consultation given its operational role.  

  ### VI. Orders  
  I propose:  
  (a) The appeal is dismissed.  
  (b) The rebate awarded remains $50,000.  
  (c) The eleven stayed claims shall be determined per (a)–(b).  
  (d) The agency must revise its guidance manual within six months to clarify that "applicant" means the entity lodging the claim, irrespective of membership structures.  

  ---  
  **ANNEX: THE "FOUND VERSUS MADE" DISTINCTION** (Plain-Language Summary)  

  This quarrel is a difference in description, not a genuine disagreement, if two things hold:  
  1. **The provision has a "framework meaning"**: The clause sets boundaries (e.g., it requires *some* cap tied to *some* conception of "applicant"), but within those boundaries, multiple outcomes are textually plausible until a tribunal chooses one.  
  2. **Our role is interstitial**: We resolve ambiguity using tools (text, purpose, consequences) without claiming one answer was "always there."  

  In this case, I see a *genuine disagreement*. The "framework" view overstates ambiguity. Words like "applicant" have ordinary meanings that existed pre-ruling. We are not choosing between equally valid options but discerning which fits the provision’s fabric. The per-filer reading fits naturally; the per-member reading stretches the text. Thus, we are finding, not making. But even if you see ambiguity, the outcome is fixed by purpose and fairness—which still involves judgment, not creation.
