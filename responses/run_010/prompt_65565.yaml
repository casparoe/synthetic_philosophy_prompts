prompt: |-
  I am putting together seminar materials on the use of unrealistic assumptions in scientific modelling, and I have found that the general debate does not get me to a settled view of my own. I know the instrumentalist thesis — that a model is to be judged by the accuracy of its predictions for the purpose at hand, that its assumptions may be wildly false, and indeed that the more significant a theory is, the more unrealistic its assumptions tend to be — a thesis Samuelson named the F-twist, declining out of courtesy to call it the F-fallacy. I also know the standard rejoinder: that a false premise cannot be doing any work in explaining a true prediction, so what is really required is a showing that the idealised factor makes no relevant difference. Each position seems to me to capture half of my own case-by-case judgements and to lose the other half, so rather than another rehearsal of the argument I should like to know what principle my verdicts actually add up to. Here they are.

  A first-year mechanics problem in which a block slides down a frictionless incline: acceptable; adding friction would make it more realistic and, for the purpose of teaching the resolution of forces, worse. Planets treated as point masses under Newtonian gravitation: acceptable, and barely an idealisation at all, since a spherically symmetric body attracts anything outside it exactly as though its mass were concentrated at its centre — here the assumption is not false but restricted, and I want a principle able to register that difference. Ignoring the mutual perturbations of the planets to get a first approximation to an orbit: acceptable, because the errors are not merely small but are computed and subtracted by the same theory, and it is the success of the perturbation calculation that earns my trust in the starting point. The ideal gas law, neglecting molecular volume and intermolecular attraction: acceptable, because the deviation is orderly and signed, admits a two-parameter correction, and tells me in advance which way the model errs and when. A lattice of nearest-neighbour spins standing in for a real ferromagnet: acceptable near the critical point, where the microscopic details are demonstrably washed out and quite different models share the same exponents. The thermodynamic limit — infinitely many particles — in order to obtain a genuine phase transition: acceptable, even though no real system is infinite and a finite one has no true singularity, because finite-size scaling shows me the way back. Galileo's falling bodies with air resistance neglected: acceptable; indeed dropping a hammer and a feather together on the Moon seems to me to have confirmed the idealisation rather than exposed it. The Earth treated as a perfect sphere: acceptable for working out great-circle distances between cities, unacceptable for predicting the precession of a satellite's orbital plane, where the equatorial bulge is precisely the effect in question — same idealisation, opposite verdicts, and the only apparent difference is the question asked. The independence of irrelevant alternatives in the impossibility theorem about social choice, a condition no real voting procedure satisfies: acceptable, because the aim is not to predict the behaviour of parliaments but to display a structural feature of a class of aggregation rules, and the idealisation is what makes the structure visible. The Black–Scholes assumption of log-normal returns with constant volatility: unacceptable, notwithstanding that it prices liquid options well, that everyone knows the tails are too thin and that volatility clusters, and that there is a whole family of corrections available in the form of jumps, stochastic volatility and local volatility implied by the smile. My unease is that those corrections are fitted to the very option prices the model was supposed to explain, so the deviation is never measured against anything independent, and that the model fails hardest precisely where it is most relied upon. The representative agent in macroeconomics: unacceptable, because aggregation is where the interesting behaviour lives, and because results about aggregate excess demand suggest that almost any smooth aggregate function can be rationalised by some distribution of well-behaved individuals, so the individual-level assumptions purchase nothing at the level where the predictions are made. The assumption of no unmeasured confounding in an observational study in epidemiology: unacceptable, and for a third reason — it is not merely false but untestable in principle from the data available, and if it fails it can reverse the causal conclusion while leaving every prediction intact. And the spherical cow: unacceptable, though I want the principle to explain why that is a joke and the frictionless incline is physics, given that the two are formally indistinguishable.

  My own tentative formulation is that an idealisation is licensed when, and only when, the modeller has available an argument — mathematical, experimental, or a matter of demonstrated robustness — that the factor omitted or falsified makes no relevant difference to the answer to the question actually being asked, with a merely provisional licence where that argument has not yet been given. Three things worry me about it. First, the ideal gas law and the option-pricing model look structurally identical — a false distributional assumption, good central predictions, a known and systematic correction — yet I judge them differently, and what seems to drive the difference is whether the correction is anchored to something independent of the data being fitted, and whether failure coincides with reliance; I should like to know whether those are two further clauses, one clause, or nothing at all. Second, the principle appears to license idealisations only retrospectively: Galileo had no demonstration about air resistance, the correction to the ideal gas law arrived decades after the law was trusted, and the assumption of molecular chaos was used long before anyone could say why it was permissible. Either most of the great idealisations were illegitimate when made, or my provisional clause is doing all the work — and if it is, it looks suspiciously like permission to assume whatever has not yet been shown to matter, which is the F-twist with a guilty conscience. Third, if legitimacy is relative to the question asked, and the modeller chooses the question, what prevents the principle from licensing any idealisation whatsoever for a suitably chosen question? So: state the principle, or two or three rival candidates, precisely and clause by clause, saying which of my cases motivates each clause and what would undermine it; apply it to at least three cases I have not listed, one of them from outside physics and economics; tell me plainly which of my verdicts it cannot reproduce, and rank those verdicts by how costly they would be to abandon — I suspect I shall have to give up either my acceptance of the ideal gas law or my rejection of the option-pricing model, and I want to know which surrender is cheaper and what else it would cost me; and finally say whether the resulting principle is materially different from judging models by their predictions alone. If it is, describe a concrete situation in which the two come apart — a model my principle condemns though it predicts well, or licenses though it predicts badly. Please argue from the cases themselves rather than giving me a survey of the literature or a reading list.
reasoning: |-
  Okay, the user is deeply engaged in the philosophy of scientific modeling, specifically the legitimacy of unrealistic assumptions. They've presented a detailed list of cases where they accept or reject such idealizations and are struggling to formulate a consistent principle that captures their intuitive judgments. 

  First, I notice their frustration with the standard instrumentalist vs. realist debate - they've clearly moved beyond textbook positions. Their cases reveal sophisticated nuances: they care about whether deviations are orderly (ideal gas), whether corrections are anchored independently (Black-Scholes vs. perturbation theory), and whether the idealization obscures the phenomenon of interest (representative agent). 

  The spherical cow example is particularly telling - they want to articulate why it's absurd while frictionless planes aren't, even though mathematically similar. That's the crux: they need a principle that distinguishes productive from misleading abstraction. 

  Their proposed principle (licensing idealizations only when there's an argument the falsified factor makes no relevant difference) has three pain points: 
  1) It can't distinguish their different judgments of structurally similar cases (ideal gas vs Black-Scholes)
  2) It seems to condemn historically important idealizations used before justifications existed 
  3) It might be too permissive if modellers can cherry-pick questions

  I should address these systematically. For the first issue, the key is whether the model's success is circumstantial (Black-Scholes fits options but fails at stress testing) versus grounded in understanding (ideal gas deviations follow predictable patterns). The independence of validation matters - Van der Waals constants come from non-option data, while volatility smiles are calibrated to the very prices being modeled. 

  For the historical concern, we need temporal tolerance: Galileo's assumption was productive because it led to testable predictions about vacuum behavior, even if he couldn't quantify air resistance. The principle should reward heuristic value when rigorous justification comes later. 

  The question-relativity problem requires constraining what counts as a legitimate question - it must probe the phenomenon's essence (like orbital precession demanding bulge inclusion) rather than avoiding the hard parts. 

  The user's rejection of Black-Scholes is revealing - they distrust models that fail when stakes are highest. That's not captured in their initial principle but might be covered by adding a "failure-context alignment" clause. 

  For new cases: 
  - In climate modeling, neglecting cloud microphysics might be acceptable for global temperature projections (orderly bias) but not for regional rainfall (where clouds dominate). 
  - In neuroscience, modeling neurons as identical units fails when studying network diversity effects. 
  - The Hardy-Weinberg equilibrium in genetics accepts no-selection assumptions because deviations are measurable via allele frequencies - satisfying both correction anchors and testability. 

  Their hardest trade-off is indeed ideal gas vs Black-Scholes. I'd argue sacrificing the ideal gas judgment is costlier - it undermines centuries of productive thermodynamics where models guided understanding, not just fitting. Rejecting Black-Scholes only questions one financial model, not the methodology. 

  Finally, the principle differs from pure predictionism in cases like the no-confounding assumption: it can correctly condemn models that predict well by accident (confounding hides the bias) but would be licensed by predictionism. The representational virtues matter.
answer: |-
  Based on your cases and concerns, here's a precise principle structured to capture your judgments, with clauses addressing your worries. The core idea is **justified controllability of error**:

  ### Principle of Justified Idealization (PJI)
  An idealization is legitimate iff:
  1.  **Purpose-Specificity:** It serves a well-defined *epistemic goal* (prediction, explanation, conceptual clarification) for a *specific question* Q.
  2.  **Error Controllability:** There exists a *credible justification* (mathematical proof, empirical evidence, robustness analysis) that the idealized/falsified factor F induces an error E in answering Q that is either:
      *   (a) **Irrelevant:** |E| is negligible for Q's purpose, *or*
      *   (b) **Systematic & Correctable:** E is quantifiable, predictable in direction/sign, and correctable using resources *independent* of the data/model being evaluated for Q.
  3.  **Failure Transparency:** The justification identifies the *conditions* under which the idealization breaks down (where |E| becomes significant for Q or correctability fails) and these conditions do not systematically coincide with contexts where the model is *relied upon* for Q.
  4.  **Testability (Weak):** The justification for clauses 2 & 3 does not rely *solely* on untestable assumptions. (The idealization itself may be untestable, but *its impact* must be assessable).

  ### Clause Motivation & Undermining Cases
  *   **Clause 1 (Purpose-Specificity):**
      *   *Motivations:* Earth's shape (sphere ok for distances, not for precession); Independence of Irrelevant Alternatives (IIA - ok for structural proof, not for predicting votes).
      *   *Undermined by:* Choosing an irrelevant Q just to "save" the model (e.g., defending spherical cow by asking "what shape simplifies geometry?").
  *   **Clause 2 (Error Controllability):**
      *   *(a) Irrelevant:* Motivated by frictionless incline (teaching resolution), planetary perturbations (small, computable error), lattice near critical point (microscopic details irrelevant). *Undermined by:* Using point-mass Earth for precession (bulge is relevant).
      *   *(b) Systematic & Correctable:* Motivated by ideal gas (orderly, signed deviation; Van der Waals constants derivable from *non*-PVT data like critical points). *Undermined by:* Black-Scholes (corrections "fitted" to option prices themselves, lack independence).
  *   **Clause 3 (Failure Transparency):**
      *   *Motivations:* Black-Scholes (fails catastrophically in tails/stress when most relied upon); ideal gas (predicts *when* it fails - high P/low T). Thermodynamic limit (finite-size scaling shows *how* it fails). *Undermined by:* Representative agent (hides aggregation effects precisely where they matter for macro predictions); No unmeasured confounding (failure can reverse conclusion without warning).
  *   **Clause 4 (Weak Testability):**
      *   *Motivations:* No unmeasured confounding (untestable impact); Spherical cow (no credible path to test impact on milk yield). *Undermined by:* Any idealization whose justification relies *only* on an untestable assumption about the impact of F (e.g., "Assume F doesn't affect Q, because I said so").

  ### Applying PJI to Your Cases
  *   **Frictionless Incline (Acceptable):** Q = Teach force resolution. F = Friction. Justification: Experience/experiment shows friction small for smooth surfaces on short inclines; E demonstrably negligible for Q (Clause 2a). Failure: Rough surfaces/long inclines (Clause 3).
  *   **Planets as Points (Acceptable):** Q = Orbit calc (external gravity). F = Size/shape. Justification: Math proof (Shell Theorem) shows E=0 exactly for spherical symmetry (Clause 2a). Failure: Non-spherical bodies (Clause 3).
  *   **Ideal Gas (Acceptable):** Q = Predict PVT near STP. F = Mol. vol/attraction. Justification: Empirical evidence shows E small/near STP, systematic (predictable sign), correctable via VdW eqn using constants from *independent* data (e.g., critical constants) (Clause 2b). Failure: High P/Low T identified (Clause 3).
  *   **Black-Scholes (Unacceptable):** Q = Price options *and* assess risk. F = Constant vol/log-normal. Justification fails: Corrections (stoch vol, jumps) fitted *to option prices themselves* (violates Clause 2b independence). Fails catastrophically in tails/stress tests – precisely when relied upon for risk management (violates Clause 3). Volatility clustering is inherent, not correctable "independently".
  *   **Representative Agent (Unacceptable):** Q = Explain/predict aggregate macro behavior. F = Heterogeneity/Aggregation effects. Justification fails: Sonnenschein-Mantel-Debreu shows E is *fundamental* – aggregation *is* the phenomenon, cannot be assumed away (Violates Clause 2a irrelevance & 2b correctability). Hides behavior precisely at aggregate level (Violates Clause 3).
  *   **No Unmeasured Confounding (Unacceptable):** Q = Infer causation. F = Confounders. Justification fails: Impact E is untestable *in principle* with available data (Violates Clause 4). Failure can reverse conclusion without detection (Violates Clause 3).
  *   **Spherical Cow (Unacceptable):** Q = Predict milk yield? F = Shape/Anatomy. Justification: None credible showing E is irrelevant or correctable independently. No failure transparency. Pure absurdity highlights lack of justification (Violates all clauses).

  ### New Cases
  1.  **Climate Modeling - Ignoring Cloud Microphysics (e.g., in simple GCMs):**
      *   *PJI Verdict:* **Provisional Acceptability.** Q = Project global mean temp change. F = Cloud processes. Justification: Evidence that bulk cloud feedbacks dominate micro details *for global mean* (Clause 2a plausible but contested). Failure: Cloud microphysics crucial for regional precip/extremes (Clause 3 known). *Licensed provisionally* (research ongoing), not definitively.
  2.  **Neuroscience - Leaky Integrate-and-Fire Neuron Model:**
      *   *PJI Verdict:* **Acceptable.** Q = Understand network dynamics/computation. F = Biophysical details (ion channels, dendrites). Justification: Robustness studies show many network phenomena emerge despite neuron model details; E often irrelevant for Q (Clause 2a). Failure: Studying specific dendritic computations (Clause 3 clear).
  3.  **Ecology - Lotka-Volterra Predator-Prey Model (Ignoring Spatial Structure/Stochasticity):**
      *   *PJI Verdict:* **Contextual Acceptability.** Q = Conceptual understanding of cycles/phase space. F = Space/Stochasticity. Justification: Math analysis shows core oscillatory dynamics robust; E irrelevant for Q (Clause 2a). Failure: Predicting extinction risk in fragmented habitats relies on spatial/stochastic effects (Clause 3). *Unacceptable* if Q is extinction prediction.

  ### Conflicts with Your Verdicts & Cost of Abandonment
  *   **Conflict:** Your *acceptance* of the Ideal Gas Law vs. *rejection* of Black-Scholes. PJI distinguishes them via **Clause 2b (Independent Correction)** and **Clause 3 (Failure Context)**.
      *   **Cost of Abandoning Ideal Gas Acceptance:** High. Undermines vast swathes of successful, predictive thermodynamics and physical chemistry where systematic corrections *are* independently anchored (critical constants, transport properties). Rejects a paradigm case of progressive modeling.
      *   **Cost of Abandoning Black-Scholes Rejection:** Low(er). Acknowledges its *practical* use for *interpolating* liquid options prices within a narrow range, but maintains its *epistemic* failure for understanding tail risk or providing independent justification. Finance models are often tools, not theories; this downgrade is consistent with their track record.
  *   **Other Potential Conflict:** Galileo's Falling Bodies. PJI might only grant *provisional* legitimacy initially (no rigorous justification then). Abandoning *final* acceptance is costless (history validated it). Abandoning *provisional* acceptance when justification is pending is costly – it stifles exploration. PJI avoids this via recognizing heuristic value pending justification.

  ### PJI vs. Predictionism
  PJI is **materially different** from judging models by predictions alone.

  *   **Concrete Divergence: No Unmeasured Confounding.**
      *   *Predictionism:* The model (e.g., regression adjusting for measured confounders) might predict the outcome Y *perfectly* in the observed data. It licenses the model.
      *   *PJI:* Condemns it. The justification for the idealization (no unmeasured confounding) is untestable (Violates Clause 4). Failure (presence of confounder) can reverse the causal conclusion *without harming predictive accuracy* (Violates Clause 3 - failure is silent). Predictionism licenses a model that is fundamentally misleading for its (causal) purpose.

  ### Summary
  Your verdicts coalesce around the **Principle of Justified Idealization (PJI)**, emphasizing *purpose-specific, justified controllability of error* with *failure transparency* and *avoiding untestable justifications for error impact*. It distinguishes cases like Ideal Gas vs. Black-Scholes via **independent correctability** and **failure context alignment**. It handles historical cases via recognizing provisional legitimacy pending justification. It escapes trivialization by constraining legitimate questions and requiring substantive justifications. While prediction is crucial, PJI adds essential dimensions of **error accountability** and **epistemic security relative to the specific purpose**, condemning models that predict well by accident or hide critical failures. Your rejection of Black-Scholes and representative agents is cheaper to maintain than abandoning the ideal gas law.
