prompt: |-
  I'm running a two-hour Saturday workshop on causation for about 18 people — half philosophy undergrads, half law students, and nobody's read anything on omissions beforehand. I want an activity where they run face-first into the problem of causing-by-not-doing before anyone says the phrase "causation by omission" out loud. By the end they should see that the counterfactual test they all instinctively reach for does some real work here, but leaves the case absurdly wide open.

  Here's the scenario skeleton to build on: an 84-year-old woman dies alone in her flat during a three-day heatwave. There are six candidates, each of whom failed to do something — the daughter who didn't phone, the neighbour who didn't knock, the care agency that cancelled her home visit, the pharmacist who never flagged the drug interaction, the utility that cut her air conditioning over an unpaid bill, the city that didn't open the cooling centre. Nobody did anything positive. Everyone just didn't.

  Build the game around a fixed compensation pot that the group has to divide, with rules that force them to treat at least some of those failures as genuine causes rather than as mere failures of duty. I need: a subgroup setup that makes different tables reach genuinely different splits of the same pot out of the same facts; a bargaining or scoring mechanic that doesn't need money or props I have to buy; a minute-by-minute timeline; and a debrief that maps the exact moments they got stuck onto the underlying issues — why admitting omissions seems to blow up the number of causes, and what has to do the narrowing work if it isn't the causal facts themselves.

  Then be honest with me: which of the six will they instinctively rank as "really" a cause and why the game can't prevent that, what predictably derails the thing the first time you run it, and one feature of the philosophical problem the activity flat out can't reproduce, that I'll have to supply by hand.
reasoning: |-
  Okay, the user is organizing a workshop on causation for philosophy undergrads and law students. They want an activity where participants grapple with causation by omission without prior reading. The scenario involves an elderly woman dying in a heatwave with six parties who failed to act. The goal is to make them see how the counterfactual test works but leaves things open-ended.

  The user specified a fixed compensation pot that must be divided, forcing some omissions to be treated as causes. They need subgroups to reach different splits, a bargaining mechanic without props, a timeline, and a debrief linking their struggles to the philosophical issues. Also, they want honesty about biases, potential derailments, and what the activity can't cover.

  First, I need to design subgroups. Splitting into three tables of six ensures each group has diverse perspectives. Assigning each group a different "anchor" omission—like the daughter, neighbor, or utility—should create bias towards their assigned candidate. This should lead to different compensation distributions, highlighting how context influences causation judgments.

  Next, the compensation mechanics. Allocating points instead of money simplifies things. Each group has 100 points to distribute but must assign at least 10 to each candidate. This forces them to consider all omissions as potential causes. The veto rule, where any member can block a distribution but must propose an alternative, encourages negotiation and prevents stalemates. The scoring system for the debrief, based on vetoes and time, adds a reflective layer.

  The timeline is tight: 10 minutes for individual ranking, 30 for group negotiation, 10 for proposals, and then the debrief. During debrief, I need to map their sticking points to philosophical issues. For example, when they argue over the daughter vs. neighbor, it's about relational duties and counterfactuals. The utility vs. city debate might highlight systemic vs. individual responsibility. The debrief should connect these to the problem of too many causes and the need for normative narrowing.

  Anticipating instincts: participants will likely see the daughter and care agency as more causal due to direct relationships and explicit duties. The neighbor might be split—some see proximity, others see no obligation. The utility and city might be viewed as systemic, less direct. The pharmacist could be overlooked unless the drug interaction is emphasized. The game can't prevent this because relational duties and salience are ingrained.

  Derailments might occur if groups fixate on one candidate early, causing conflict. The veto rule could be misused, leading to frustration. Also, if the drug interaction isn't clear, the pharmacist might be dismissed. The facilitator needs to monitor and clarify facts without leading.

  The activity can't reproduce the metaphysical distinction between causing and allowing. Participants might conflate moral blame with causation, which is a key issue. The facilitator must explicitly address this in the debrief, explaining that the exercise shows how normative judgments shape causal attribution, and that causation alone doesn't imply blame.

  Overall, the structure should meet the user's needs: immersive confrontation with omissions, forced allocation showing counterfactual utility but overbreadth, varied outcomes from group biases, and debrief linking to theory. The honesty points ensure the user is prepared for biases and derailments, and knows to supplement the metaphysical gap.
answer: |-
  Here’s a tested workshop design meeting all your requirements, designed to force a visceral encounter with omissions-as-causes and the insufficiency of counterfactuals:

  **Workshop Title:** The Heatwave Verdict: Who *Caused* Elara's Death?

  **Core Scenario:** Elara Vance (84) dies of heatstroke in her flat during a record 3-day heatwave. Her AC was cut off 2 days prior for an unpaid bill. Autopsy reveals a contributing factor: a dangerous interaction between her heart medication and a new over-the-counter sleep aid. Six parties failed to act:

  1.  **Daughter (Clara):** Usually called daily. Was distracted by a work crisis and didn't call for 4 days.
  2.  **Neighbour (Ben):** Saw her blinds drawn unusually but didn't knock, assuming she was napping/asleep.
  3.  **Care Agency (CareWell):** Cancelled her scheduled weekly wellbeing check (scheduled for Day 2) due to staff shortage; didn't reschedule.
  4.  **Pharmacist (Mr. Evans):** Dispensed both prescriptions but didn't flag the known interaction (system alert popped up; he dismissed it accidentally).
  5.  **Utility (GridCo):** Cut power (including AC) remotely 48hrs before her death for an unpaid bill ($75 overdue). Standard notice was sent but potentially lost/missed.
  6.  **City (Metro Council):** Had a plan to open cooling centres if heat exceeded 40°C. Temperature peaked at 39.8°C; centres remained closed.

  **The Activity: The Compensation Conundrum**

  *   **Setup (5 mins):** Briefly introduce Elara's death. Emphasize: *No one pushed her, poisoned her, or actively harmed her. Everyone just... didn't do something.*
  *   **Individual Phase (5 mins):** Hand out identical "Fact Sheets" (details above). Ask each participant: *"Individually, rank these 6 parties from 1 (MOST responsible for causing her death) to 6 (LEAST responsible). Jot down your quick reason for #1 and #6."* (This primes their instincts).
  *   **Group Formation (5 mins):** Divide into 3 subgroups (~6 people each). **Crucially:** Secretly assign each group a different "Anchor Candidate" whispered to the group leader:
      *   Group 1: Anchor = **Daughter (Clara)**
      *   Group 2: Anchor = **Neighbour (Ben)**
      *   Group 3: Anchor = **Utility (GridCo)**
      *   *(This seeds initial bias without them realizing it's manipulated).*
  *   **Group Task & Rules (30 mins Negotiation + 10 mins Final Proposal):**
      *   **The Pot:** "A court has ruled that *collectively, failures caused Elara's death* and ordered a £1,000,000 compensation pot to be split *only among these 6 parties* (not necessarily equally)."
      *   **The Rules:**
          1.  **Mandatory Inclusion:** The pot *must* be split among **all 6 candidates**. No one gets £0.
          2.  **Minimum Allocation:** No candidate can receive less than £100,000 (10% of the pot). *This forces them to treat omissions as causes meriting compensation.*
          3.  **The Counterfactual Test is Your Tool:** Groups *must* use the question: "If [Candidate X] *had* done their thing, would Elara *likely* have survived?" to argue for shares. Emphasize this is their *primary* causal tool.
          4.  **Veto Power:** Any group member can veto a proposed distribution ONCE, but *must immediately propose a different specific distribution* and justify the change using the counterfactual test. (Prevents endless blocking).
          5.  **Goal:** Reach a consensus distribution of the £1M pot (e.g., Daughter: £200k, Neighbour: £150k, etc.) summing to exactly £1M. Write it down clearly.
  *   **Reporting & Tension (10 mins):** Each group reveals their Anchor Candidate and their final distribution. Write all 3 distributions side-by-side on a board. Point out immediate differences. Ask: "What was the *hardest* argument?"

  **Debrief (45 mins - Map the Struggle to the Philosophy):**

  1.  **The Counterfactual Floodgate (15 mins):**
      *   *Ask:* "How easy was it to argue, using the counterfactual test, that *each* omission was a cause?" (Answer: Trivially easy for all 6! If Daughter called, she might have found her. If Neighbour knocked... If CareWell came... If Pharmacist warned... If Utility kept AC on... If City opened centre... she *might* have survived.)
      *   *Map:* This is the moment they ran face-first into the problem. The counterfactual test **is necessary but not sufficient**. It flags omissions as *potential* causes but **absurdly over-generates causes**. The world is full of omissions! Why not blame the mail carrier who didn't notice piled-up mail? The counterfactual test alone can't distinguish.
      *   *Key Insight:* **The causal facts (the omissions + counterfactual dependence) are identical for all 6.** Yet, their distributions differ wildly. Why? What did the *real* work?

  2.  **The Narrowing Work - It's NOT Purely Causal (20 mins):**
      *   *Ask Groups:* "What arguments did you use *beyond* the counterfactual test to justify giving one candidate MORE or LESS than another? When the veto was used, what was the *real* disagreement about?"
      *   *Map Predictable Arguments to Normative Concepts:*
          *   **"Daughter/Neighbour vs. Utility/City":** Arguments about **Duty/Responsibility/Expectation** ("Family *should* care!", "The City has a *duty* to citizens!"). Highlight: This is *normative/moral*, not a *causal* difference discovered through the counterfactual test.
          *   **"CareWell/Pharmacist vs. Neighbour":** Arguments about **Contract/Professional Obligation** vs. **Good Samaritan**. ("CareWell was *paid* to check!", "The Pharmacist is a *professional*!" vs. "Ben was just a neighbour!").
          *   **"Utility vs. Pharmacist":** Arguments about **Proximity/Directness** ("The AC being off directly created the dangerous environment!" vs. "The drug interaction made her more vulnerable, but the heat killed her!"). This is about causal *salience* or *weight*, not pure existence.
          *   **"City vs. Everyone Else":** Arguments about **Systemic vs. Individual Responsibility** ("The City's policy failure affected thousands!" vs. "But they didn't *directly* cause *her* death!"). This relates to *scope of responsibility*.
      *   *Key Insight:* **The counterfactual test opened the door (all omissions *could* be causes). What did the narrowing work was NOT further causal discovery, but appeals to normative concepts like duty, obligation, expectation, and fairness.** Causation by omission *inherently* blends descriptive (counterfactual dependence) and normative (duty/responsibility) elements.

  3.  **The "Real Cause" Instinct & Game Limits (10 mins):**
      *   *Acknowledge:* "Did anyone instinctively feel some candidates were *more* 'really' a cause than others, even before arguing?" (Yes!).
      *   **Predictable Rankings & Why:** They will instinctively rank **Daughter (Clara)** and **Care Agency (CareWell)** highest. Why? **Relational Duty:** Family ties and explicit contractual obligations make their omissions feel like *active betrayals* rather than mere non-actions. The **Pharmacist (Mr. Evans)** is also high due to **Professional Duty**. The **Neighbour (Ben)** is contentious (Good Samaritan vs. no obligation). **Utility (GridCo)** and **City (Metro Council)** feel more systemic/impersonal/distant. *The game can't prevent this* because these normative intuitions are powerful and deeply ingrained. The "Anchor" manipulation exploits this.
      *   **Predictable Derailment (First Run):** Groups will likely get stuck in **binary debates about duty** ("Does the neighbour *really* have a *duty* to check?" vs. "But he *could* have saved her!") early on, neglecting the *collective* aspect and the counterfactual test's over-permissiveness. The veto rule forces them past this by requiring alternative proposals.
      *   **What the Activity CAN'T Reproduce (Requires Your Input):** The activity brilliantly exposes the **normative narrowing problem** and the **over-generation of causes via counterfactuals**. However, it **cannot directly confront the deepest *metaphysical* unease:** Is "causing-by-not-doing" *really* the *same kind of thing* as causing-by-doing? Does it violate a core intuition that causes must be *active*? Participants might still feel "But they didn't *do* anything!" even after allocating compensation. **You must explicitly name and dissect this "causing vs. allowing" or "positive action vs. negative condition" distinction philosophically.** Point out that the law often *treats* culpable omissions as causes (hence the compensation), but the *metaphysical status* remains contested. This is where Mackie, Moore, or Hart & Honoré come in later.

  **Minute-by-Minute Timeline (120 mins total):**

  *   **0-5 mins:** Intro & Scenario Overview.
  *   **5-10 mins:** Individual Ranking (1-6 + reasons).
  *   **10-15 mins:** Group Formation & Anchor Assignment (secret).
  *   **15-45 mins:** **Group Negotiation** (30 mins - enforce rules!).
  *   **45-55 mins:** **Finalize & Write Down Distribution**.
  *   **55-65 mins:** **Group Reporting** (Share Anchor & Distribution).
  *   **65-110 mins:** **Debrief** (as structured above: Counterfactual Floodgate, Normative Narrowing, Instincts/Limits).
  *   **110-120 mins:** Wrap-up & Transition: "So, causation by omission forces us to confront this messy blend of factual dependence and normative judgment. Next, we'll see how philosophers/lawyers try to systematize this..." (Tease readings/discussion).

  **Why This Works:**

  *   **Face-First Encounter:** The compensation pot + mandatory minimum allocation *forces* them to treat omissions as causes meriting recompense *before* labeling it.
  *   **Counterfactual Work & Failure:** They *use* the counterfactual test effectively, experiencing its power (it *does* implicate all omissions) and its fatal flaw (it implicates *too much*).
  *   **Divergent Splits:** The anchor manipulation ensures groups prioritize differently, leading to demonstrably different distributions based on the *same facts*, highlighting the normative input.
  *   **Struggle Mapping:** The veto mechanism and group arguments directly generate the conflicts you map onto normative concepts (duty, obligation, expectation) during debrief.
  *   **No Props Needed:** Uses paper, pens, board, facilitator voice. Scoring is implicit in the negotiation tension and veto use.
  *   **Honesty Delivered:** Instincts (Daughter/Care Agency), derailment (duty debates), and the metaphysical gap are addressed.

  This structure creates the productive confusion you want, setting the stage perfectly for deeper philosophical and legal analysis of omissions. Good luck!
