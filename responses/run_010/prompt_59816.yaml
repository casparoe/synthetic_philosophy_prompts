answer: |-
  ### Brainstorming Notes  
  Your core move—disaggregating inevitability into granularity, perturbation width, and timing—is analytically crisp and potentially novel. It reframes deterministic squabbles as category errors. The modal horizon concept is elegant but risks being path dependence in new jargon. The epistemological worry about "retrospective inevitability inflation" feels urgent but underdeveloped. Key tensions: Is this a *methodological* intervention (how we *talk* about inevitability) or an *ontological* one (what inevitability *is*)? You lean toward the former, but the distinction blurs.

  ---

  ### Major Objections  
  1. **Granularity and Perturbation Width Are Not Cleanly Separable**  
     If you define the outcome with high granularity (e.g., "the Industrial Revolution *as it occurred in Manchester between 1780–1820*"), the perturbation class narrows *automatically*: only perturbations capable of altering Manchester-specific events suffice. Conversely, coarse outcomes (e.g., "industrialisation somewhere in Europe by 1850") permit wider perturbations. Your framework treats these as independent parameters, but granularity may *determine* viable perturbation width. If so, collapsing occurs.  

  2. **Modal Horizon Adds Little Beyond Path Dependence**  
     Your "modal horizon" is essentially the lock-in point from path dependence literature, rebranded. Path dependence already defines when outcomes become irreversible. To sharpen this: *Integrate it with granularity*. Show how the horizon *shifts* when the outcome description changes (e.g., the horizon for "British industrialisation" vs. "steam-powered textile manufacturing in Lancashire"). Without this, it’s repackaging.  

  3. **Retrospective Inevitability Inflation May Just Be Hindsight Bias**  
     Historians’ overestimation of inevitability due to surviving records *could* be reduced to standard hindsight bias (e.g., Fischer’s *Historians’ Fallacies*). To prove it’s distinct, demonstrate a *structural* epistemic problem: e.g., show that archives systematically erase evidence of *viable alternatives* that existed pre-outcome (e.g., lost records of alternative technologies). Absent this, it’s descriptive flair without diagnostic teeth.  

  ---

  ### Paragraph-by-Paragraph Critique  
  **Opening Claim ("metaphysical dispute... artefact")**:  
  Strong setup. The shift from metaphysics to parameters is persuasive. But "artefact" overreaches—some disputes *are* metaphysical (e.g., Laplacean determinism). Reframe: "often masquerades as metaphysical but is frequently an artefact..."  

  **Three Parameters**:  
  - **Granularity**: Well-handled. Example clarifies.  
  - **Perturbation Width**: The "no measure over counterfactual histories" point is vital. Stress that *all* historical counterfactuals require stipulation—this is where debates turn dialectical, not empirical.  
  - **Timing**: Path dependence is correctly situated, but Gould’s "replaying the tape" is misread. Gould *is* making an indeterminism claim (see *Wonderful Life*). His point isn’t about width but about chaos theory’s sensitivity to initial conditions. Correct this.  

  **Interpretive Claim (Carr, covering laws, etc.)**:  
  - Carr: Spot-on. His "Cleopatra’s nose" dismissal targets overly specific counterfactuals (granularity).  
  - Covering laws: Yes—objections about causal laws are width complaints (e.g., "no laws govern harvest failures").  
  - Path dependence/Gould: As above, Gould is weaker here. Either drop him or engage his actual argument.  

  **Modal Horizon Proposal**:  
  Currently underpowered. To add value:  
  - Show how *granularity shifts the horizon*. E.g., the horizon for "industrial capitalism" may be 1600, but for "Boulton & Watt’s engine" is 1775.  
  - Emphasize its *indexicality*: "Standing past the horizon" means we lack access to pre-horizon contingency. This makes inevitability *relational*, not absolute.  

  **Epistemological Worry ("Retrospective Inevitability Inflation")**:  
  This is promising but needs:  
  - A *mechanism*: E.g., "Winners’ archives" preserve only the path taken, incinerating alternatives (cf. Trouillot’s *Silencing the Past*).  
  - *Evidence*: Study cases where pre-outcome sources reveal greater perceived contingency than post-outcome narratives (e.g., pre-1945 predictions of Soviet collapse vs. post-1991 "inevitable" accounts). Without this, it’s elegant speculation.  

  ---

  ### Final Assessment  
  **Is it worth building the dissertation around?**  
  **Yes—but conditionally**. The parameter framework is original and dismantles stale debates. However:  
  1. **Sharpen modal horizon**: Make it interact explicitly with granularity (e.g., "fine-grained outcomes have earlier horizons").  
  2. **Decouple granularity and width**: Argue that width is *constrained* by but not *reducible* to granularity (e.g., coarse outcomes can still be disrupted by narrow perturbations).  
  3. **Ground the epistemic worry**: Show retrospective inflation in historical practice—else it’s armchair psychology.  

  **Demote if**: You cannot resolve the granularity/width entanglement or prove the epistemic problem’s distinctness. As-is, it’s a powerful section for a paper on historical contingency, not yet a dissertation core.  

  **Thesis potential**: 7/10. With rigorous disentangling of parameters and archival work on inflation, it could reshape how we frame historical necessity. Don’t demote—*dig deeper*.
