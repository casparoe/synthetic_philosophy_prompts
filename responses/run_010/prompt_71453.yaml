  ### Leaves and Paths  
  1. **Epistemicism:**  
     - Path: Q10A→Q11B→Q1B→Q5B  
       *or* Q10A→Q11B→Q1B→Q5A→Q7A→Q9C  
       *or* Q10A→Q11B→Q1A→Q4D→Q5B  
       *or* Q10A→Q11B→Q1A→Q4D→Q5A→Q7A→Q12A  
     - **Cost:** Brute, unknowable facts.  

  2. **Supervaluationism:**  
     - Path: Q10A→Q11B→Q1A→Q4B→Q3B  
       *or* Q10A→Q11B→Q1C→Q2B→Q8B→Q9B  
       *or* Q10A→Q11B→Q1A→Q4B→Q3C→Q8B→Q6A  
       *or* Q10A→Q11B→Q1C→Q2B→Q8B→Q6A  
       *or* Q12B  
     - **Cost:** Artificial precisification makes truth.  

  3. **Degree Theory:**  
     - Path: Q10A→Q11B→Q1C→Q2B→Q8C  
     - **Cost:** Abandons classical logic for degrees.  

  4. **Contextualism:**  
     - Path: Q10A→Q11B→Q1A→Q4C→Q7D→Q8D  
       *or* Q10A→Q11B→Q1C→Q2B→Q8D  
       *or* Q12C  
     - **Cost:** Truth varies endlessly with context.  

  5. **Ontic Vagueness:**  
     - Path: Q10A→Q11B→Q1C→Q2A→Q6B  
     - **Cost:** Unsettledness is in the world, not language.  

  6. **Nihilism:**  
     - Path: Q10A→Q11B→Q1C→Q2B→Q7B  
     - **Cost:** Vague predicates never truly apply.  

  7. **Deflationary:**  
     - Path: Q10A→Q11B→Q1A→Q4E→Q6D  
       *or* Q10A→Q11B→Q1C→Q2B→Q8A→ (forced)  
     - **Cost:** Rejects the debate as confused.  

  8. **Outlier:**  
     - Path: Q10B *or* Q11A  
     - **Function:** Flags respondents rejecting clear cases (likely answering randomly or nihilist).  

