  ### Vacant Combinations & Unseparated Leaves  
  - **Vacant Combos (permitted but no leaf):**  
    1. Q1A→Q4A→Q5A→Q7A→Q9A: Incoherent (denies cut-off but asserts disjunction truth).  
    2. Q1C→Q2C: Unattractive (denies oracle can be true but asserts definite fact in river).  
    3. Q5C→Q9C: Incoherent (no cut-off but conjunction true).  
  - **Unseparated Pairs:**  
    - **Epistemicism vs. Supervaluationism** on Q9C/Q9B: Ambiguous if unstable on Q5/Q7.  
    - **Contextualism vs. Degree Theory** if Q8D/C chosen arbitrarily.  

  ### Handling Instability  
  - **Rule:** Prioritize answers in this order: Q1 > Q4/Q5/Q6 > Q2/Q3 > Q7/Q8/Q12.  
  - **Reporting:** Flag unstable profiles (≥2 conflicting branches) as "Unstable" and assign to the leaf with the most matching answers. If tie, report as distinct outcome.  

