answer: |-
  ### Diagnostic Instrument: Vagueness Intuitions Survey  

  **Instructions:** For each question, select the option that best reflects your intuition. There are no right or wrong answers; we are interested in your immediate reactions. Answer honestly without overthinking.  

  ---

  #### Questions:  
  1. **Oracle Case:** An oracle announces the exact number of grains at which a collection ceases to be a heap, and you understand it perfectly. What is the status of the oracle’s statement?  
     - (A) True of our language.  
     - (B) True of the world.  
     - (C) Incapable of being true.  

  2. **River Case:** A river has split into two channels over centuries. Which channel is the original river?  
     - (A) Unsettled out in the world itself.  
     - (B) Unsettled only in our practice of naming.  
     - (C) There is a definite fact of the matter.  

  3. **City Council Case:** A council resolves by coin toss that roller-skates count as "vehicles" and a decommissioned ambulance monument does not. After the vote:  
     - (A) The term is now exact, and the council made it exact.  
     - (B) The term is now exact, but the council only recorded a decision they lacked the power to make true.  
     - (C) The term is not exact.  

  4. **Cut-off Source:** What, if anything, makes the cut-off for "heap" fall where it falls?  
     - (A) Nothing further; it just is that way.  
     - (B) Our linguistic practices and a bias toward natural meanings.  
     - (C) Our practical interests.  
     - (D) The structure of the world itself.  
     - (E) The question has no answer.  

  5. **Knowability:** Can anyone know the exact cut-off for "heap"?  
     - (A) No, it is impossible.  
     - (B) Yes, but not in a way demonstrable to others.  
     - (C) There is no cut-off to know.  

  6. **Iteration:** Can it be unsettled whether it is unsettled that a collection is a heap?  
     - (A) No.  
     - (B) Yes, and this runs on without end.  
     - (C) Yes, but it stops at some stage.  
     - (D) The question is malformed.  

  7. **Disjunction (hard case):** For a collection that is neither clearly a heap nor clearly not, if someone says, "This is a heap or it isn’t," what is that statement?  
     - (A) True.  
     - (B) False.  
     - (C) Neither true nor false.  
     - (D) True or false depending on the context.  

  8. **Sorites Premise:** Granting that "removing one grain from a heap always leaves a heap" means you accept:  
     - (A) Something true.  
     - (B) Something false.  
     - (C) Something very nearly true but not quite.  
     - (D) Something whose status moves with the situation.  

  9. **Conjunction:** "There is a number n where n grains make a heap, n−1 grains do not, and neither is unsettled." Your reaction:  
     - (A) False: no such n exists.  
     - (B) False: there is such an n, but it is unsettled.  
     - (C) True.  

  10. **Clear Heap (non-diagnostic):** A neatly arranged 1,000-grain collection: is it a heap?  
      - (A) Yes.  
      - (B) No.  

  11. **Clear Non-Heap (non-diagnostic):** A single grain: is it a heap?  
      - (A) Yes.  
      - (B) No.  

  12. **Negation (hard case):** For a hard-case collection, "This is not a heap" is:  
      - (A) True or false (we just don’t know which).  
      - (B) Neither true nor false.  
      - (C) True or false depending on context.  

  ---

  ### Scoring Key  
  **How to use:** Follow the branches based on answers. Non-diagnostic questions (10–11) are sanity checks; all paths route through them, but they only flag outliers.  

  1. **Start at Q10 (Clear Heap):**  
     - **A (Yes) →** Proceed to Q11.  
     - **B (No) →** **Leaf: Outlier** (rejects clear cases; likely confused or nihilist).  

  2. **Q11 (Clear Non-Heap):**  
     - **A (Yes) →** **Leaf: Outlier** (rejects clear cases; likely confused or nihilist).  
     - **B (No) →** Proceed to Q1.  

  3. **Q1 (Oracle):**  
     - **A (True of language) →** Proceed to Q4.  
     - **B (True of world) →** Proceed to Q5.  
     - **C (Inc. true) →** Proceed to Q2.  

  4. **Q4 (Cut-off Source):**  
     - **A (Nothing) →** Proceed to Q5.  
     - **B (Linguistic practices) →** Proceed to Q3.  
     - **C (Practical interests) →** Proceed to Q7.  
     - **D (World structure) →** Proceed to Q5.  
     - **E (No answer) →** Proceed to Q6.  

  5. **Q5 (Knowability):**  
     - **A (Impossible) →** Proceed to Q7.  
     - **B (Yes, undemonstrable) →** **Leaf: Epistemicism** (Cost: Accepts brute, unknowable facts).  
     - **C (No cut-off) →** Proceed to Q8.  

  6. **Q2 (River):**  
     - **A (World unsettled) →** Proceed to Q6.  
     - **B (Naming unsettled) →** Proceed to Q8.  
     - **C (Definite fact) →** **Leaf: Error** (incoherent with Q1C; force to nearest: Epistemicism).  

  7. **Q3 (Council):**  
     - **A (Made exact) →** Proceed to Q5.  
     - **B (Recorded exact) →** **Leaf: Supervaluationism** (Cost: Accepts artificial precisification as truthmaking).  
     - **C (Not exact) →** Proceed to Q8.  

  8. **Q7 (Disjunction):**  
     - **A (True) →** Proceed to Q9.  
     - **B (False) →** **Leaf: Nihilism** (Cost: Denies all vague predicates apply).  
     - **C (Neither) →** Proceed to Q12.  
     - **D (Contextual) →** Proceed to Q8.  

  9. **Q8 (Sorites Premise):**  
     - **A (True) →** **Leaf: Error** (incoherent with most; force to Deflationary).  
     - **B (False) →** Proceed to Q9.  
     - **C (Nearly true) →** **Leaf: Degree Theory** (Cost: Rejects classical logic for degrees).  
     - **D (Moves) →** **Leaf: Contextualism** (Cost: Truth varies endlessly with context).  

  10. **Q9 (Conjunction):**  
      - **A (False: no n) →** Proceed to Q6.  
      - **B (False: unsettled n) →** **Leaf: Supervaluationism** (Cost: As above).  
      - **C (True) →** **Leaf: Epistemicism** (Cost: As above).  

  11. **Q6 (Iteration):**  
      - **A (No) →** **Leaf: Supervaluationism** (Cost: As above).  
      - **B (Without end) →** **Leaf: Ontic Vagueness** (Cost: Unsettledness is fundamental to reality).  
      - **C (Stops) →** **Leaf: Error** (unattractive; force to Supervaluationism).  
      - **D (Malformed) →** **Leaf: Deflationary** (Cost: Rejects the framework as confused).  

  12. **Q12 (Negation):**  
      - **A (True/false unknown) →** **Leaf: Epistemicism** (Cost: As above).  
      - **B (Neither) →** **Leaf: Supervaluationism** (Cost: As above).  
      - **C (Contextual) →** **Leaf: Contextualism** (Cost: As above).  

