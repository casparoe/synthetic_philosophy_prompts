  I should consider different theories. The practical incentives argument is straightforward: blame leads to hiding mistakes. But if there's a deeper commitment, like the systems approach viewing humans as part of a larger system, that might contrast with HR's individual focus. That’s where the inconsistency lies—not in metaphysics but in operational models.

  Ubuntu's relational personhood could mean responsibility is shared, but the company's HR practices individualize it. However, implementing ubuntu might not mean naming individuals but emphasizing community learning. Stack ranking might need to shift to team-based assessments.

