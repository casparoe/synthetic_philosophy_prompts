prompt: |-
  I retired four years ago after thirty-four years spent measuring trace gases in the upper atmosphere, and I have since been working through decision theory and ethics with a small group that meets on Thursday evenings in a library meeting room. I am writing to you in the capacity of a referee, because two members of the group argued for the better part of two hours last week and I remain unable to decide between them.

  To give the argument something to bite on, I had prepared a numerical case. Suppose that £5,000 given to a bed-net programme saves one life; treat this as a stipulation for the sake of the example rather than a claim about the world. Suppose further that for the same £5,000 you could fund a project which, on the estimates of the people running it, has a one-in-ten-billion chance of averting a catastrophe that would kill everyone now alive — some eight billion of us — and otherwise achieves nothing whatever. The expected number of lives saved is then 0.8, slightly below the certain donation. Now change the project's probability estimate from one in ten billion to one in a billion, and the ordering reverses by a factor of eight.

  The exchange ran as follows.

  1. Hanne, who taught school mathematics for thirty years, opened by saying that a rule which tells you to weigh a certain life against a lottery ticket, and to hand your wallet to a stranger threatening inconceivably many people provided you grant his threat any non-zero probability, is not a rule about what to do at all. A theory whose verdicts are odious in precisely those cases that distinguish it has been refuted by them, not vindicated.

  2. Owen, a research engineer, replied that expected-value maximisation is the only competitor that cannot be exploited. Anything else either allows someone to pump money out of you — selling you A over B, B over C and C over A — or makes you refuse a gamble you would have accepted had it been presented in a different order. As for odiousness, our intuitions about risk were calibrated in an environment in which the probabilities worth tracking lay between one-in-ten and one-in-ten-thousand, and introspection outside that range is not evidence. A rule should be judged by whether an adversary can systematically impoverish whoever follows it, not by whether its verdicts sound agreeable in a seminar.

  3. Hanne said: then look at my own numbers. Your rule's verdict turns on the eleventh significant figure of an estimate nobody has any means of obtaining, and it is unstable under any honest description of our uncertainty. Worse, the same rule requires you to accept a certain modest harm — a small tax, say — in order to avert a tiny probability of an astronomical one, so you will sacrifice identifiable people who exist for hypothetical people who do not. A rule that trades the certain against the conjectural at that ratio is not merely counterintuitive but unusable, and a rule that cannot be used by creatures like us cannot be a rule for creatures like us.

  4. Owen answered that her first point concerns evidence, not decision theory: if you are genuinely uncertain between one-in-a-billion and one-in-ten-billion, you hold a spread of credences and take the expectation across the spread, and the calculation does not become ill-defined merely because it is difficult. As for her second point, he was willing to grant a bounded utility function — the standard way of defusing the St Petersburg game — but insisted it buys nothing, since once enough people's welfare is at stake, a bounded value per person multiplied by an astronomically large population swamps any smaller certain gain. Escaping that, he said, requires rejecting expected-value maximisation outright; and the currently fashionable way of doing so, weighting outcomes by their probabilities rather than simply multiplying, fails dynamically, because an agent who plans by such a rule will foreseeably abandon her own plan at every stage and end up with an outcome she ranks below one she could have had.

  5. Hanne said the dynamic argument proves too much. It assumes she must be sequentially consistent and must carry out whatever plan she adopts now; but she is entitled to decline to bind herself and to decide afresh at each stage in the light of what she then cares about, and a pump only drains a purse that keeps consenting to be drained. In moral cases, moreover, there is no single purse: you cannot be Dutch-booked out of other people's lives, because the loss does not accrue to the agent doing the choosing, so the bookkeeping objection has no purchase where the stakes belong to third parties.

  6. Owen conceded that in part, but said that if she will not accept the coherence constraint even in the prudential case, where the purse is her own, she has no account of why her refusals are not arbitrary. Her position amounts to disregarding probabilities below some threshold, and she cannot say where the threshold sits; if it is vague, then it is vague whether she is obliged to save a life, and that vagueness is a worse disease than fanaticism.

  7. Hanne's final move was that vagueness in our obligations is no defect in a theory if the underlying facts admit of no sharp boundary, and that his demand for precision is a habit imported from mathematics into a domain where it does not belong. She added that his own view undermines itself: if the rule is to be followed by creatures with limited time and poor estimates, the fanatic must advise us not to perform his calculation, in which case his theory tells us not to use it. Owen replied that this is the ordinary two-level structure of a respectable theory, unremarkable and unproblematic, and the meeting broke up there.

  Please adjudicate this exchange round by round. For each of the seven moves, judge it as clearly right, partly right, or clearly mistaken, and say briefly what justifies the rating; where a single round contains several distinct claims, split them apart and rate them separately. Then address three questions on which the whole dispute seems to me to turn: whether sensitivity to the eleventh significant figure counts against the decision rule or only against the evidence we happen to have; whether the observation that there is no single purse genuinely defeats the coherence objection in moral cases, or concedes far too much; and whether Owen is right that a bounded utility function fails to block his conclusion. Having done that, tell me which of the two is more right overall and what, if anything, both of them are missing — it struck me at the time, though I may well be talking nonsense, that once utility is bounded they may not be disagreeing about decision theory at all but about some further question, and I should like to know whether that is so and what that question would be. Do not trouble yourself with references or with the literature; I want your own analysis of the argument as it was actually conducted. Please write your answer in British English, in both spelling and idiom.
reasoning: |-
  Hmm, this is a fascinating ethical and decision theory puzzle from a retired atmospheric scientist. The user presents a detailed exchange between Hanne and Owen about expected value maximisation in high-stakes, low-probability scenarios, and wants me to adjudicate each of their seven arguments before addressing three core questions.

  First, I need to understand the scenario properly. We're comparing: 
  - A certain outcome: £5,000 saves one life via bed nets 
  - A speculative project: same cost with extremely low probability (1 in 10 billion) of saving 8 billion lives 

  Hanne rejects expected value calculations in such extreme cases, calling them "not a rule about what to do," while Owen defends them as the only non-exploitable approach. Their debate touches on Dutch booking, bounded utility, moral vs prudential cases, and the feasibility of precision in real-world decisions.

  For my adjudication, I'll need to: 
  1. Go through each of the seven exchanges and rate them as clearly right/partly right/clearly mistaken with justifications 
  2. Answer the three key questions about sensitivity, the "single purse" objection, and bounded utility 
  3. Give an overall verdict on who's more right 
  4. Explore the user's intuition about whether they're actually disagreeing about something deeper than decision theory

  The user mentions bounded utility as a potential pivot point - that's crucial. If utility per person is bounded (say, max value per life saved), then even astronomically low probabilities multiplied by huge populations might not swamp moderate certain gains. But Owen argues this fails dynamically because agents would abandon plans.

  I should also consider Hanne's point about moral cases being different from prudential ones - when stakes belong to others, Dutch booking arguments may not apply in the same way. And the precision issue: when probabilities are beyond our measurement capability (like 1 in 10 billion vs 1 in billion), should decision rules accommodate that uncertainty?

  The user wants British English throughout, so I'll adjust spelling and idioms accordingly. And no literature references - just analysing the arguments as presented. This requires careful balancing between mathematical coherence and practical moral reasoning.
answer: |-
  ### Adjudication of the Exchange  
  *Ratings reflect logical coherence, argumentative strength, and relevance to decision theory principles, not moral intuitions.*

  **Round 1: Hanne’s Opening**  
  - *Claim*: Expected-value maximisation ("weighing a certain life against a lottery ticket") is not a usable rule when it demands handing resources to a stranger threatening inconceivable harms based on any non-zero probability. Odious verdicts refute the theory.  
  **Rating: Partly right.**  
  **Justification**: Hanne correctly identifies that expected-value calculations can yield counterintuitive or morally repugnant results in extreme cases (e.g., prioritising negligible probabilities of cosmic stakes over certain modest gains). However, this is an *objection* to the theory’s practical implications, not a logical refutation. Her "odiousness" criterion conflates normative discomfort with formal invalidity.  

  **Round 2: Owen’s Reply**  
  - *Claim 1*: Expected-value maximisation is uniquely non-exploitable (avoids Dutch books and money pumps).  
  **Rating: Clearly right.**  
  **Justification**: Coherence theorems in decision theory robustly support that only expected-utility maximisers avoid sure losses in sequential choices.  
  - *Claim 2*: Intuitions about risk are unreliable outside everyday probability ranges (e.g., 1/10 to 1/10,000); rules should be judged by exploitability, not agreeableness.  
  **Rating: Partly right.**  
  **Justification**: Owen is correct that human risk intuitions are ecologically calibrated and often fail in extremes. However, dismissing *all* intuitive objections risks insulating the theory from legitimate empirical constraints (e.g., cognitive limits).  

  **Round 3: Hanne’s First Rebuttal**  
  - *Claim 1*: Expected-value verdicts depend on unknowable precision (e.g., the 11th significant figure) and are unstable under uncertainty.  
  **Rating: Clearly right.**  
  **Justification**: When probabilities are estimated (e.g., 1/10⁹ vs. 1/10¹⁰), minute changes flip decisions. Real-world agents lack the precision to apply the rule faithfully, rendering it operationally dubious.  
  - *Claim 2*: The rule sacrifices certain, modest harms for tiny probabilities of astronomical harms, trading "identifiable people for hypothetical people."  
  **Rating: Partly right.**  
  **Justification**: Hanne exposes a genuine tension (e.g., accepting small taxes to avert extinction risks). But labelling this "unusable" overstates the case—some effective altruists *do* use such calculus, however controversially.  

  **Round 4: Owen’s Second Reply**  
  - *Claim 1*: Hanne’s precision objection concerns evidence (handled by credence spreads), not decision theory.  
  **Rating: Partly right.**  
  **Justification**: Owen correctly separates epistemic uncertainty (addressed by expected value over priors) from decision rules. Yet he underplays how extreme uncertainty can paralyse the calculation itself.  
  - *Claim 2*: Bounded utility avoids St. Petersburg issues but fails here because large populations swamp bounded per-person utility.  
  **Rating: Clearly mistaken.**  
  **Justification**: If utility per life is bounded (e.g., capped at a finite value), multiplying by any population—however large—cannot exceed that bound. A bounded utility function *does* block Owen’s conclusion (see detailed analysis below).  
  - *Claim 3*: Non-expected utility rules (e.g., rank-dependent weighting) fail dynamically.  
  **Rating: Clearly right.**  
  **Justification**: Agents using non-linear probability weighting often violate dynamic consistency, making them vulnerable to exploitation or regret.  

  **Round 5: Hanne’s Second Rebuttal**  
  - *Claim 1*: Agents need not be sequentially consistent; they can decide afresh at each stage, avoiding money pumps by refusing to consent.  
  **Rating: Partly right.**  
  **Justification**: Hanne validly notes that resisting binding commitments can evade exploitation. However, this invites time inconsistency and undermines planning—a serious flaw in prudential cases.  
  - *Claim 2*: In moral cases, "no single purse" defeats Dutch books because losses accrue to third parties.  
  **Rating: Clearly right.**  
  **Justification**: Coherence arguments assume all stakes belong to the agent. When choosing for others (e.g., saving strangers), "bookmaking" an agent over others' welfare is nonsensical—the loss isn’t *theirs*.  

  **Round 6: Owen’s Challenge**  
  - *Claim 1*: Without coherence constraints, Hanne’s threshold-based refusals are arbitrary and vulnerable to vagueness.  
  **Rating: Partly right.**  
  **Justification**: Owen fairly critiques Hanne’s implied probability threshold as underspecified. Vagueness *is* problematic if it obscures obligations (e.g., is 1/10⁹ "too small"?).  
  - *Claim 2*: Vagueness is "a worse disease than fanaticism."  
  **Rating: Clearly mistaken.**  
  **Justification**: This overstates the case. Vagueness in moral thresholds (e.g., the Sorites paradox) is pervasive and manageable, while "fanaticism" (prioritising tiny probabilities of vast stakes) can demand indefensible sacrifices.  

  **Round 7: Hanne’s Final Move**  
  - *Claim 1*: Vagueness in obligations is acceptable if reality lacks sharp boundaries; Owen’s demand for precision is misplaced.  
  **Rating: Clearly right.**  
  **Justification**: Ethics often deals with fuzzy thresholds (e.g., "when does a life begin?"). Insisting on artificial precision misapplies mathematical standards to normative domains.  
  - *Claim 2*: Owen’s rule self-undermines, as limited agents should ignore it.  
  **Rating: Partly right.**  
  **Justification**: Hanne cleverly notes that *applying* expected-value maximisation to extreme cases may be computationally infeasible, advising against its own use. But this is a pragmatic, not logical, flaw.  

  ---

  ### Analysis of Core Questions  
  1. **Sensitivity to the 11th significant figure**:  
     - This counts against both the rule *and* the evidence. Decision rules must be *actionable*. If a theory demands superhuman precision (e.g., distinguishing 10⁻¹⁰ from 10⁻¹¹) and flips verdicts on unmeasurable differences, it fails as a guide for real agents. Owen’s "credence spread" response is theoretically sound but practically inert—no one can compute expectations over such vast uncertainties.  

  2. **"No single purse" in moral cases**:  
     - Hanne’s objection **genuinely defeats the coherence argument** for moral decisions. Dutch books require the *agent* to suffer consistent losses, but when choosing for disconnected others (e.g., allocating bed nets vs. asteroid defence), losses are distributed across the population. There is no "purse" to drain *from the agent*, so coherence constraints do not apply. Owen concedes this, and rightly so.  

  3. **Does bounded utility block Owen’s conclusion?**  
     - **Yes, decisively**. If utility per person is bounded (e.g., saving a life has maximum value *U_max*), then the expected utility of the catastrophe project is:  
       \[
       \text{EU} = p \times N \times U_{\text{max}} \quad \text{where} \quad p \times N \ll 1 \quad \text{(e.g., } 10^{-9} \times 10^{10} = 0.01\text{)}
       \]
       With *U_max* fixed, EU remains dwarfed by the certain saving of one life (utility = *U_max*). Owen’s claim that large *N* swamps bounded utility is mathematically false.  

  ---

  ### Overall Verdict  
  **Hanne is more right overall**, particularly on the operational limits of expected-value maximisation in extreme cases, the irrelevance of Dutch books in moral contexts, and the necessity of accommodating vagueness.  

  **What both miss**:  
  - **Hanne** underestimates the value of dynamic consistency in prudential cases (e.g., retirement planning). Her "decide afresh" approach risks shortsightedness.  
  - **Owen** overlooks that bounded utility *resolves* the fanaticism problem but clings to its inevitability. His defence of precision is mathematically elegant but ethically naive.  

  **The deeper disagreement**: Once utility is bounded, their dispute shifts **from decision theory to meta-ethics**:  
  - **Owen** implicitly assumes a *consequentialist framework* where only outcomes matter, and coherence is paramount.  
  - **Hanne** invokes *agent-centred constraints*: we owe greater duties to identifiable individuals than to statistical lives, and rules must respect epistemic limits.  

  This is not a technical quarrel about expectation calculations but a clash over **moral demandingness and the role of uncertainty in ethics**. Hanne’s view better navigates the human predicament—where rules must guide fallible agents—while Owen’s remains a philosopher’s idealisation.  

  ---  
  I trust this adjudication meets your request for clarity and impartiality. Should your Thursday group revive the debate, I would be curious to hear how they respond.
