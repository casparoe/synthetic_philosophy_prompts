  Now the part I actually care about. Residue report, item by item, sorted into: (a) translates cleanly; (b) translates only if you distort one side — say which side and how; (c) has no expression in my vocabulary at all. Be scrupulous about not smuggling: if the only reason something counts as translating is that you quietly imported an expressivist assumption into type theory, or a cognitivist assumption into the metaethics, that is a failure, not a success — flag it as one. I'd rather have five honest entries than twenty flattering ones.

