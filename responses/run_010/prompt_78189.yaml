answer: |-
  ### Brainstorming Candidate Correspondences

  I'll start by listing candidate type-theoretic correspondences for key expressivist concepts, then prune puns or superficial matches. The goal is literal translation, not analogy.

  #### Key Concepts and Candidates:
  1. **Moral sentences express attitudes, not beliefs**  
     - Candidate A: Moral sentences are *tactics* (state transformers) that modify a proof state (e.g., adding an attitude to the context), not *terms* (proofs of propositions).  
     - Candidate B: Moral sentences are terms of a special type `Attitude` (non-propositional, non-truth-apt).  
     - Candidate C: Moral sentences are *judgments* (e.g., `Γ ⊢ approve(lying)`), not propositions.  

  2. **Truth-aptness**  
     - Candidate A: Truth-apt = inhabitable type (`Type` or `Prop`). Non-truth-apt = non-type (e.g., tactic, `Attitude`).  
     - Candidate B: Truth-apt = type with a well-defined negation. Non-truth-apt = type lacking negation.  

  3. **Unasserted occurrence (e.g., in antecedents)**  
     - Candidate A: Unasserted = bound variable in a lambda (e.g., `λ (h : P), ...` where `P` is not inhabited).  
     - Candidate B: Unasserted = quoted tactic (a term representing a tactic).  

  4. **Validity without truth-preservation**  
     - Candidate A: Validity = existence of a metalevel function transforming input attitudes to output attitudes.  
     - Candidate B: Validity = proof of a `Harmony` type (e.g., `att_P → att_Q`) where `att_P` is an attitude term.  

  5. **Quasi-realist escalation (higher-order attitudes)**  
     - Candidate A: Higher-order attitude = function between `Attitude` terms (e.g., `f : Attitude → Attitude`).  
     - Candidate B: Higher-order attitude = tactic that takes quoted tactics as input.  

  #### Pruning Puns and Superficial Matches:
  - **Deleted Candidate B for (1)**: Treating attitudes as terms of type `Attitude` makes them truth-apt (since `Attitude` is a type). This distorts expressivism, which denies moral sentences are truth-apt. It's a pun on "type" as linguistic category vs. semantic truth-aptness.  
  - **Deleted Candidate B for (2)**: Defining truth-aptness via negation confuses logical structure with semantic status. Expressivism denies truth-aptness *prior* to logic.  
  - **Deleted Candidate A for (4)**: Metalevel functions aren't compositional; they don't explain embedded occurrences. This is handwavy.  
  - **Deleted Candidate A for (5)**: Functions on `Attitude` terms reify attitudes as objects, smuggling in cognitivism.  

  **Surviving candidates** for translation:  
  - (1A): Moral sentences as tactics.  
  - (1C): Moral sentences as non-truth-apt judgments.  
  - (2A): Truth-aptness as inhabitable type.  
  - (3A): Unasserted as bound variable.  
  - (3B): Unasserted as quoted tactic.  
  - (4B): Validity as harmony between attitudes.  
  - (5B): Higher-order attitudes as tactics over quoted tactics.  

  ---

  ### Translation of Expressivism and Frege-Geach  
  I'll translate the core ideas and the standard argument:  
  *Premise 1:* Lying is wrong.  
  *Premise 2:* If lying is wrong, then getting your little brother to lie is wrong.  
  *Conclusion:* Getting your little brother to lie is wrong.  

  #### Type-Theoretic Setup  
  - **Atomic moral sentence (e.g., "Lying is wrong")**:  
    - Expressivist claim: Not a proposition (type), but an attitude-expression.  
    - Translation: A **tactic** `att_lying_wrong` that modifies a proof state (e.g., adds `disapprove(lying)` to the context).  
    - Type: Tactic (e.g., in Lean, `ProofState → ProofState`), not a type.  

  - **Truth-aptness**:  
    - Translation: Only types (e.g., `Prop`) are truth-apt. Tactics are not; they are actions.  

  - **Conditional ("If P, then Q")**:  
    - Cognitivist view: Implication `P → Q`, a type inhabited by functions `Π (p : P), Q`.  
    - Expressivist problem: If `P` is a tactic, it can't be a function input (not a type).  
    - Translation: The conditional is *not* `P → Q` (since `P`, `Q` aren't types).  

  - **Unasserted occurrence (antecedent)**:  
    - In `P → Q`, `P` is a hypothesis (bound variable). But if `P` is a tactic, it can't be bound.  
    - Translation: **No direct analogue**. Type theory requires all bound variables to have types. An unasserted moral sentence has no type, so it can't be embedded.  

  - **Frege-Geach objection in type theory**:  
    - Premise 1 (asserted): Runs tactic `att_lying_wrong`, updating state.  
    - Premise 2 (conditional): To form `if P then Q`, we need to embed `P` (unasserted). But `P` is a tactic, and:  
      - It can't be a hypothesis (not a type).  
      - It can't appear in a function type (e.g., `tactic → tactic` is ill-kinded; tactics aren't types).  
    - Result: Premise 2 is **ungrammatical** in type theory. Validity (a function `P → Q`) is undefined.  

  #### Quasi-Realist Reply (Higher-Order Attitudes)  
  - **Blackburn's move**: The conditional expresses a higher-order attitude (e.g., disapproval of approving `P` without `Q`).  
  - **Translation**: **Reification via quoting**.  
    - Quote tactic `att_lying_wrong` into a term `q_lying_wrong : QuotedTactic`.  
    - Now `QuotedTactic` is a type (truth-apt!). The conditional becomes:  
      `harmony : Π (q : QuotedTactic), (eval q) → att_q`  
      where `eval` "runs" the quoted tactic, and `att_q` is the attitude for `Q`.  
    - Higher-order attitude: `harmony` is a tactic taking quoted tactics and outputting new attitudes.  
  - **Negation problem**: Negating `att_lying_wrong` can't be `¬q_lying_wrong` (which is a proposition about the quote), but a *new tactic* (e.g., `approve(lying)`). The quote and the tactic have different types, so negation isn't uniform.  

  #### Your Half-Baked Guess: Assessment  
  - **Correct**:  
    - Moral sentence as tactic: Yes.  
    - Frege-Geach as "can't put tactic in lambda": Perfect.  
    - Quasi-realism as quoting: Exact.  
