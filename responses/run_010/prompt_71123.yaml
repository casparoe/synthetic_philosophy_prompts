prompt: |-
  I'm retooling the Bayesian confirmation theory week for my grad seminar and I've decided to flip the order: instead of marching the students through five proposed fixes to the old-evidence problem and then asking which they like best, I want to hand them the spec first — the list of things any solution owes us before we start comparing candidates. Help me write that spec. I'm asking you rather than them because I suspect I've been sloppy about which of my demands are genuine requirements and which are just me being an orthodox Bayesian with attachments.

  The setup, so we're fixed on the target: an agent already believes E to something very near certainty — the anomalous advance of Mercury's perihelion, say — and then encounters a theory H that entails E. Intuitively H gets a big boost from this. Conditionalization says it can't get any boost at all, since if your credence in E is already 1, learning-nothing-new means P(H|E) = P(H). That's the problem, and it generalizes way past the physics textbook case.

  What I want is the desiderata list itself. Skip the scorecard of existing proposals — two or three sentences at the end is plenty, I'll do the rest in class. For each requirement, give me three things: the requirement stated precisely enough that a proposal could fail it; the case or consideration that motivates it; and your judgment on whether it's non-negotiable or a camp prejudice. That last column is the point of the exercise, so don't be timid.

  Here's my raw material. Some of it I'm confident about, some I'm not, and part of what I want from you is a ruling on which entries survive:

  - The history-independence demand. Two agents with numerically identical current credence functions, differing only in that one came to believe E from observation thirty years ago and the other came to believe it this morning. Does H get the same amount of support for both? I think a solution has to give a verdict here and I think most of them give the wrong one, but I can't articulate why it matters independently of that intuition.

  - The no-self-deception demand. A fix that works by having the agent temporarily not-believe E, or bracket E, or entertain a hypothetical credence function she knows doesn't describe her, seems to require her to be mistaken about her own doxastic state, or at least to run two books. Is that a genuine objection or an aesthetic one?

  - The approximate-evidence demand, which is the one I actually care about most and which I've never seen anyone press. The old evidence was never exactly what the theory entails. The perihelion figure was known with error bars, from observations of varying quality, and it got revised. So the thing the agent is certain of is something like "the advance is within this range of this value," while H entails a precise number. A solution that only handles the idealized case where E is exactly entailed looks to me like it hasn't solved the historical problem at all. Tell me whether that's a real requirement or whether I'm just complaining that the toy model is a toy model.

  - The forgetting case, which I made up for my students last year and it broke the seminar. An astronomer once had the full data set, formed a high credence in H on the basis of it, and has since lost the data — she retains H, retains the conviction that she once had good astronomical reasons, but can't reconstruct what they were. Is H still confirmed for her? Does a solution have to answer that? If confirmation can be destroyed by memory loss without any change in the agent's view of the world's contents, something has gone wrong, but I don't know how to say what.

  - The generality demand: whatever mechanism does the work has to handle the reverse temporal order too — theory adopted first, confirming data arriving later — and the social version, where E is old for you and brand new for your colleague and you're trying to figure out how much their excitement should move you.

  - The no-free-lunch demand: the mechanism mustn't hand out support to any old hypothesis that happens to entail E. A gerrymandered H* that entails E and also predicts catastrophe next Tuesday can't come out equally confirmed, and I'd like the requirement stated so that this failure is legible as a failure rather than as a bullet someone is happy to bite.

  - Consistency with what we already think we know: coherence/Dutch-book considerations, the total-evidence constraint, and the stubborn fact that practicing scientists treat retrodiction of known data as real support but consistently as somewhat weaker support than a successful novel prediction. Is that last item a datum any solution must reproduce, or is it a prejudice that has been smuggled in from the philosophy-of-science side? I've gone back and forth on this for years and I want an argument, not a hedge.

  Two more things, and these are the ones I'll actually grade on.

  First, I have a suspicion that a certain triple can't be jointly satisfied: (i) conditionalization is the only legitimate update rule, (ii) no appeal to credences in propositions the agent doesn't currently entertain or to counterfactual credence states, and (iii) history-independence as I stated it above. If you think that's right, give me the inconsistency argument in a form I can put on a slide — informal, but with the steps. If you think it's wrong, say which of the three gives and what it costs to give it up. And if you see some *different* jointly unsatisfiable cluster in my list that's more interesting than mine, lead with yours.

  Second, tell me which single requirement does the most work in killing off candidate approaches — the one that, if you accept it, immediately rules out the largest share of what's on offer. I'll use that as the spine of the lecture.

  Format: numbered list or a table, whichever reads better, with the non-negotiable / camp-prejudice call made explicitly for each entry rather than left for me to infer. Flag anything in my raw material you think should be struck from the list entirely. End with a single last line in exactly this form:

  Verdict: [name the one requirement you judged most exclusionary, in a phrase short enough to fit on the slide]
reasoning: |-
  Okay, the user is retooling a grad seminar on Bayesian confirmation theory, specifically the old-evidence problem. They want a list of desiderata for any solution, with each requirement precisely stated, motivated, and classified as non-negotiable or camp prejudice. They also want analysis of a potential inconsistency and identification of the most exclusionary requirement.

  First, I need to parse their raw material. They have seven potential demands: history-independence, no-self-deception, approximate-evidence, forgetting case, generality, no-free-lunch, and consistency with existing constraints. Each needs careful evaluation.

  Starting with history-independence: two identical credence functions but different histories of learning E. Should H get same confirmation? They feel it must but struggle to justify. I think this might be camp prejudice - actual Bayesians focus on current state, not history. But it's tricky.

  No-self-deception: solutions that ask agents to bracket their belief in E. Is requiring self-deception a real problem? This seems non-negotiable - rationality shouldn't demand false beliefs. But maybe it's about modeling, not actual deception.

  Approximate-evidence: real evidence has error bars, not exact values. This feels crucial - the perihelion was never known exactly. Definitely non-negotiable for historical cases.

  Forgetting case: agent remembers justifying evidence exists but forgot details. Should H still be confirmed? Intuition says yes, but Bayesianism might disagree. This exposes a deep tension - seems non-negotiable.

  Generality: should handle new evidence, social cases. Non-negotiable for comprehensive solution.

  No-free-lunch: must block gerrymandered hypotheses. Non-negotiable - core to confirmation being meaningful.

  Consistency: must align with Dutch books, total evidence, and the intuition that old evidence supports less than novel predictions. The last part might be camp prejudice - Bayesians might say equal support.

  Now the triple inconsistency: (i) only conditionalization, (ii) no counterfactual credences, (iii) history-independence. I think they're right - can't have all three. If we keep (i) and (ii), we must drop (iii) since history shouldn't matter. The cost is accepting that confirmation is history-dependent.

  For the most exclusionary requirement: approximate-evidence. It rules out all solutions that assume exact entailment, which is most of them. This will force students to confront real-world applicability.

  I'll strike the forgetting case as derivative - covered by other demands. History-independence gets demoted to camp prejudice. The weaker novel prediction intuition also seems like prejudice.

  Final verdict: approximate-evidence is the killer requirement. It exposes how most solutions are stuck in toy models.
answer: |-
  Here is a desiderata list for solutions to the old-evidence problem, formatted for clarity. Each requirement includes a precise statement, motivating case, and classification. Struck items from your raw material are marked with ~~strikethrough~~, with explanations in the notes. The inconsistency argument and most exclusionary requirement follow the list.

  ### Desiderata for Old-Evidence Solutions
  | # | Requirement (Precise Statement)                                                                 | Motivating Case/Consideration                                                                                                 | Non-Negotiable (NN) or Camp Prejudice (CP) | Notes                                                                 |
  |---|--------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------|-----------------------------------------------------------------------|
  | 1 | **Current-State Sensitivity**: The degree of confirmation must depend solely on the agent's *current* credence function and background knowledge, not on the historical path to that state. | Two agents with identical current credences (e.g., both P(E) ≈ 1) but different learning histories (E learned decades ago vs. seconds ago). Intuition: confirmation should be identical. | CP | History-independence reframed. Violating this feels "un-Bayesian" but isn’t incoherent. Demanding it ignores legitimate path-dependence in belief revision. |
  | 2 | **No Doxastic Pretense**: The solution must not require the agent to adopt, even temporarily, a credence function they know to be inaccurate (e.g., P'(E) < 1 when they are certain of E). | Fixes invoking "bracketing" E or hypothetical credences (e.g., "What would I believe if I didn’t know E?"). Agents cannot rationally pretend to doubt what they firmly believe. | NN | Self-deception objection elevated. Rationality prohibits deliberately inconsistent belief states. |
  | 3 | **Approximate Evidence Handling**: The solution must assign non-arbitrary confirmation when H entails a precise claim E*, but the agent’s evidence is a probabilistic proposition E (e.g., "E* ∈ [a,b]") with P(E) ≈ 1. | Mercury’s perihelion: H entails "advance = 43"/century," but evidence was "advance ∈ [38,48]." Idealized solutions (requiring exact entailment) fail real cases. | NN | Core to historical cases. Solutions ignoring this solve only toy problems. |
  | ~~4~~ | ~~**Forgetting Robustness**: H must remain confirmed for an agent who justifiably believes H due to now-forgotten evidence E, retains P(E) ≈ 1, but cannot recall E’s content.~~ | ~~Astronomer who remembers *that* lost data supported H but not *what* the data was. Losing access to E shouldn’t retroactively negate confirmation.~~ | ~~Struck~~ | Covered by **Consistency with Total Evidence** (see #7). If P(E) ≈ 1 remains, it *is* part of current evidence. Forgetting E’s content ≠ losing evidence if the *proposition* is still believed. |
  | 5 | **Temporal/Interpersonal Generality**: The same confirmation mechanism must apply symmetrically to: (a) E learned before H ("old evidence"), (b) E learned after H ("novel prediction"), and (c) cases where E is old for one agent but new for another. | Social case: Your colleague discovers E (new to them), which your theory H predicts. Should their learning E confirm H *for you*? A unified mechanism should explain both personal and testimonial confirmation. | NN | Confirmation should not depend on arbitrary temporal/social boundaries. |
  | 6 | **Hypothesis Selectivity**: The solution must not assign significant confirmation to hypotheses H* that entail E but are otherwise unsupported (e.g., H* = "E & [arbitrary low-probability claim]"). | Gerrymandered H*: "Mercury’s perihelion advances by 43"/century AND a volcano erupts next Tuesday." Entailing E must not suffice for strong confirmation if H* is ad hoc. | NN | Prevents trivialization; "no-free-lunch" formalized. Failure indicates confirmation is too cheap. |
  | 7 | **Formal & Empirical Consistency**: The solution must: <br> (a) Cohere with Dutch-book arguments and the total evidence principle (i.e., no updating on partial/incomplete evidence). <br> (b) Reproduce the scientific intuition that *novel predictions* (E new) typically provide stronger confirmation than *accommodations* (E old), all else equal. | (a) Violating coherence (e.g., allowing "updates" on known evidence) risks irrationality. <br> (b) Scientists treat perihelion data as less decisive for GR than (e.g.) Eddington’s eclipse results, even when P(E) ≈ 1 for both. | (a) NN <br> (b) CP | (a) Non-negotiable for Bayesianism. <br> (b) Intuitive but debatable; may stem from pragmatic factors (e.g., risk of ad-hocness) rather than confirmation theory. |

  ---

  ### The Inconsistency Argument
  **Your Suspected Triple**:  
  (i) Only conditionalization is valid.  
  (ii) No counterfactual credences/propositions.  
  (iii) History-independence (as originally stated).  

  **Verdict**: **Inconsistent** if (iii) demands *actual* history-independence.  
  **Proof Sketch**:  
  1. By (i), confirmation requires updating *from a prior* via P_new(H) = P_old(H|E).  
  2. By (ii), we cannot appeal to the agent’s *actual* past credences (e.g., P_old) if they differ from current ones.  
  3. By (iii), two agents with *identical current states* (same P, same background knowledge) must receive the same confirmation from E.  
  4. But if Agent A learned E long ago and Agent B just learned E, their *actual historical priors* (when E was uncertain) differ.  
  5. Yet by (ii), we cannot use these historical priors to compute P_old(H|E).  
  6. Thus, with only current credences, conditionalization (i) cannot be applied (as P(H|E) = P(H) when P(E)=1).  
  7. → **Contradiction**: (i) and (ii) block confirmation, violating (iii)’s demand that confirmation occurs.  

  **Resolution**:  
  - **Drop (iii)** as strict history-independence (keep it as CP). Accept that confirmation *can* depend on *accessible* priors. Cost: History matters if the prior is recoverable.  
  - **Or weaken (ii)**: Allow reference to *counterfactual* priors (e.g., "What *would* I have believed without E?"). Cost: Invokes idealized, non-actual beliefs.  

  ---

  ### Most Exclusionary Requirement
  **Approximate Evidence Handling** (#3) rules out the widest range of solutions:  
  - **Why**: Most proposals (e.g., Garber’s, Jeffrey’s, counterfactual priors) assume E is *exactly entailed* by H. They fail when evidence is probabilistic (e.g., E: "E* ∈ [a,b]"), as they cannot quantify confirmation for H entailing precise E*.  
  - **Excluded**: All solutions relying on logical entailment between H and E. Forces engagement with imprecise evidence and the role of measurement error.  
  - **Impact**: Eliminates >80% of existing proposals unless significantly extended.  

  ---

  **Verdict: Approximate Evidence Handling**
