prompt: |-
  I'm the human-factors lead for a group of four community hospitals, and basically my whole job is writing medication protocols. The failure mode I keep running into is the same one over and over, and I think its the absent-minded driver problem from decision theory wearing scrubs: a nurse arrives at a step in a sequence and genuinely cannot tell whether the step has already happened. Interrupted mid-task and came back after a code, took over from the last shift, two identical-looking bags hanging, the pump alarm wiped the record of what was pushed. The driver version is the one where a guy plans a route with two exits that look the same from the road, and by the time he's at one he can't tell if it's the first or the second, so what he'd commit to beforehand and what looks right in the moment come apart — and people still argue about which of those should win. I want to know whether that argument infects anything I build.

  Our protocol review committee meets twice a month and gets maybe 8 to 10 change requests each time. Some are trivial, some are about high-alert drugs where a double dose kills somebody. We get 45 minutes per request, the chair is a pharmacist, and both the nursing practice council and pharmacy have to sign off on anything that touches bedside workflow. No new IT spend this fiscal year, so "buy a smarter pump" isn't an available move — fixes have to be procedural or physical.

  What I want is a decision procedure my committee can actually run on a request inside that 45 minutes.

  1. The questions to ask, in order, and what counts as a sufficient answer to each. One of the early ones should be the test for whether a step is what I've started calling history-blind: could someone dropped into that step with no memory of the last ten minutes tell whether it had already been done? Give me a way to actually administer that test in a meeting, not just a definition. And tell me how to distinguish it from the neighboring problem where the person knows exactly where they are but won't follow the plan anyway — that's a compliance issue and I handle it completely differently.

  2. Once a step is flagged, the branches. As far as I can see you can make the state observable (tally mark on the bag, a physical tag, a witness), or you can take the choice away at that step (hard stop, forced function, one-person rule), or you can leave the ambiguity alone and just design the best behavior for someone standing in it (default-when-unsure is X). Lay out which branch to prefer under which conditions, and be explicit about the fact that this is where the philosophy bites: each branch quietly picks a side in the plan-versus-the-moment dispute. Say which side each one picks and what my committee is committing itself to when it picks a branch.

  3. Something our legal and nursing people care about that I've never seen written down anywhere: some fixes make the *state* knowable and some remove the *choice*, and only the second kind reads as "we don't think you can be trusted at the bedside." I've watched good safety fixes die in the nursing council purely on that axis. Build me a way to score a proposed fix for how accusatory it is, so the committee sees the tradeoff explicitly instead of experiencing it as a fight.

  4. Where the procedure has to stop and hand the decision to a human because it's a values question rather than a facts question — how much risk is acceptable, how much bedside autonomy we're willing to spend, whether a fix that prevents one double dose a decade is worth forty extra seconds on every single shift.

  5. Honesty about the seams. Which of your steps are judgment calls dressed up as procedure? And is anything in the absent-minded driver debate unsettled in a way that makes part of what I'm building arbitrary — I'd rather know before it goes into a policy document.

  Then run it on three requests sitting in my inbox:

  (a) A proposal to let ED nurses give a repeat dose of an IV antiemetic when they aren't sure the first one went in, capped at two per patient per shift, because the current rule (never repeat unless documented) means people just stay nauseous.

  (b) Our barcode scan before administration fails to read about 8% of the time, staff invented a workaround where they scan at the start of shift instead of at the bedside, and somone has proposed we delete the scan entirely. I already suspect the answer is no, but I want to know whether your procedure gets there for the right reasons or whether it's going to tell me something I don't want to hear.

  (c) A mandatory two-person independent double check on a high-alert infusion that gets skipped during handoffs, because the receiving nurse can't tell whether the check happened on the other side of the shift change. The request is to add a third signature to the record.

  For at least one of these, tell me straight if the procedure lands opposite to what the requester wants, and what I should do about the politics of that. And close with what the procedure can't handle — I suspect it goes quiet when the ambiguity is about *which patient* rather than which point in the sequence, and whenever the history that matters lives in someone else's head.
reasoning: |-
  We are going to address the problem of the "absent-minded driver" in medication protocols by creating a decision procedure for the committee. The procedure will be designed to fit within a 45-minute review per request and will focus on identifying and addressing steps that are "history-blind". We will break down the procedure into the requested parts.

  ### 1. Decision Procedure: Questions to Ask

  The committee should go through the following questions in order for each step in the protocol that is under review (or for the step in question in the change request):

  **Question 1: Is this step about a medication administration or a critical safety check?**  
     - *Sufficient answer*: If yes, proceed to Question 2. If no, then the step is less critical and the risk of ambiguity is lower, but still may require analysis if it is part of a sequence that could lead to a critical error.

  **Question 2: Is the step history-blind?**  
     - *Test to administer in the meeting*:  
       - Present the scenario: "Imagine a nurse is at this step. They have been interrupted for 10 minutes (e.g., by a code) and then return. They have no memory of the last 10 minutes. Can they look at the current state (the patient, the equipment, the chart, etc.) and determine with certainty whether this step has been completed?"  
       - If the answer is "no", then the step is history-blind.  
     - *Distinguishing from compliance issues*:  
       - If the nurse knows the step hasn't been done but chooses to skip it, that's a compliance issue. The history-blind test is about the physical and informational environment not providing enough cues to determine the state of completion.  
     - *Sufficient answer*: The committee must reach a consensus. If there is doubt, assume it is history-blind.

  **Question 3: What is the consequence of failure?**  
     - *Sufficient answer*: Classify as:  
       - Low: Minor inconvenience, no harm.  
       - Medium: Potential for harm, but reversible or non-severe.  
       - High: Severe harm or death (e.g., double dose of a high-alert drug).  
     - This helps prioritize and choose the branch.

  ### 2. Branches for History-Blind Steps

  Once a step is flagged as history-blind and the consequence is known, choose one of the following branches:

  - **Branch 1: Make the state observable**  
    - *How*: Add a physical or digital marker (e.g., checkmark on the bag, tag, scan, electronic record update).  
    - *When to prefer*: When the step is frequent and the fix is low-cost, or when preserving autonomy is important.  
    - *Philosophy*: This side trusts the person to make the right decision if the state is clear. It favors the plan (the pre-commitment) because the state is made visible at the moment.  
    - *Commitment*: The committee is committing to providing the necessary tools and training to make the state visible.

  - **Branch 2: Remove the choice**  
    - *How*: Hard stop (e.g., a mandatory double-check that cannot be bypassed, a physical barrier, a forced function in a device).  
    - *When to prefer*: For high-consequence steps, especially when the observable fix is not feasible or when the risk is too high.  
    - *Philosophy*: This side does not trust the moment because the state is inherently ambiguous and the cost of error is too high. It enforces the pre-commitment.  
    - *Commitment*: The committee is committing to enforcing the rule even if it seems cumbersome.

  - **Branch 3: Design the best default behavior**  
    - *How*: Define a default action for when the nurse is unsure (e.g., "when in doubt, do not administer").  
    - *When to prefer*: When the consequence of inaction is low or when the other branches are not feasible.  
    - *Philosophy*: This is a compromise that tries to minimize harm in the moment. It may go against the pre-commitment if the default is inaction and the plan required action.  
    - *Commitment*: The committee is accepting the risk of the default action.

  ### 3. Scoring for "Accusatory" Nature

  To address the concern that some fixes imply mistrust, we can create a simple scoring system:

  - **Trust Score (1-5, 1=most accusatory, 5=least)**  
    - **Remove the choice (Branch 2)**: Score 1 or 2 (depending on the implementation: e.g., a forced function in a pump might be a 2, while a mandatory two-person check might be a 1 because it implies the nurse cannot be trusted alone).  
    - **Design the best default behavior (Branch 3)**: Score 3 (it relies on the nurse's judgment in the moment).  
    - **Make the state observable (Branch 1)**: Score 4 or 5 (it empowers the nurse with information and trusts them to act correctly).  

  Present this score to the committee so they see the trade-off between safety and perceived trust. Also, note that Branch 1 is the least accusatory and may be more acceptable to nursing.

  ### 4. Handing Off to Human Judgment

  The procedure must stop and hand off to human judgment when:
  - The consequence level is high and the fix involves significant trade-offs (e.g., a hard stop that might delay care in an emergency).
  - The cost of the fix (in time, resources, or autonomy) is high and the benefit is uncertain or low.
  - The committee must decide on the acceptable level of risk, weighing the frequency of the event against the cost of the fix.

  At this point, the committee should discuss and vote, considering:
  - How many times a year is this error likely to occur without the fix?
  - How severe is the harm?
  - How much time and resources will the fix take?
  - How does it impact nurse autonomy and job satisfaction?

  ### 5. Honesty About Seams

  - The following steps are judgment calls:  
    - Question 2 (history-blind test): It relies on imagining a scenario, which may vary.  
    - Question 3 (consequence): Severity classification is subjective.  
    - Choosing a branch: It requires weighing safety against autonomy and feasibility.  

  - The absent-minded driver debate is unsettled in that there is no universally accepted answer to whether pre-commitment or the moment should win. Our procedure explicitly ties each branch to one side:  
    - Branch 1 (observable) and Branch 2 (remove choice) side with pre-commitment by making the state clear or enforcing the plan.  
    - Branch 3 (default) sides with the moment by allowing the nurse to choose based on the current situation.  

  By choosing a branch, the committee is taking a stance. There is no neutral ground.

  ### Running the Procedure on the Example Requests

  #### (a) Repeat dose of IV antiemetic when unsure if first dose was given

  1. **Question 1**: Yes, medication administration.
  2. **Question 2**: The step of giving the repeat dose is history-blind? Actually, the issue is at the point of deciding whether to repeat. The nurse is unsure if the first dose was given. So the step "administer first dose" might be history-blind? But the request is about the repeat. Let's reframe: the nurse is at the step of considering a repeat dose and cannot tell if the first one was administered. This is history-blind because the state (whether the first dose was given) is not observable.  
     - *Test*: Nurse returns after interruption, sees the patient is still nauseous, but cannot tell if the first dose was given (maybe the bag is still hanging, no documentation). They cannot determine if the step (first dose) was done. So yes, history-blind.
  3. **Consequence**: Medium. Double dose might cause side effects, but the drug is not typically high-alert (but check specific drug). Not giving when needed prolongs nausea.

  **Branch Selection**:  
  - Option 1: Make state observable (e.g., require documentation immediately after first dose, or a physical tag on the bag when given). But the problem is that the current rule (never repeat without documentation) is exactly that and it fails because documentation is missing.  
  - Option 2: Remove choice: current rule (never repeat) is a form of removing choice? But it leads to under-treatment.  
  - Option 3: Default behavior: the proposal is to allow a repeat when unsure, capped at two. This is a default behavior (when in doubt, you may repeat, but with a cap).  

  Given the consequence is medium and the default behavior (repeat) might be safe for this drug, this seems acceptable. However, we must check if the drug is known to be safe in double dose? The committee must check the pharmacology.

  **Trust Score**: Branch 3 (default behavior) has a trust score of 3 (neutral).  

  **Handoff to Human**: The committee must decide if the risk of double dosing (even with the cap) is acceptable and if the drug's safety profile allows it.  

  **Procedure Outcome**: The procedure supports the request (if the drug is safe for double dose) because it chooses Branch 3. This aligns with the requester.

  #### (b) Delete barcode scan because of 8% failure and workaround

  1. **Question 1**: Yes, it's a safety check (medication verification).
  2. **Question 2**: The step of scanning at the bedside is intended to catch errors. If the nurse scans at the start of shift, then at the bedside they cannot tell if they scanned the right medication for the right patient at the right time (because they did it in advance). This is history-blind? At the moment of administration, they cannot tell if the scan was done for this patient at this time? Yes, because the scan record might be from the start of shift and not reflect the current state.  
     - Also, the workaround itself creates a history-blind situation: when at the bedside, the nurse doesn't know if the medication was scanned for this patient or if the scan was done at all? Actually, they did it at the start of shift, but the patient might have changed?  
     - The step we are concerned with is the verification at the time of administration. Without a scan at that time, the state (whether the medication is correct for the patient at this moment) is not observable. So it is history-blind.

  3. **Consequence**: High. Wrong medication or wrong patient can cause severe harm.

  **Branch Selection**:  
  - Option 1: Make state observable: improve the scanning process (e.g., better scanners, training) or add a physical token (like a printed label after scan to attach to the medication).  
  - Option 2: Remove choice: force a scan at the bedside (hard stop) by policy.  
  - Option 3: Default behavior: if unsure, don't administer? But that might cause delays and under-treatment.

  The request is to delete the scan entirely. That would remove the safety check, making the state even less observable. We cannot choose that because the consequence is high.

  **Trust Score**: The current workaround is a compliance issue? But the root is that the scan fails 8% of the time. The procedure would recommend against deletion and instead suggest making the state observable (fix the scanning process) or remove the choice (enforce bedside scan).  

  **Outcome**: The procedure says no to deletion because it would leave a high-consequence step history-blind without a fix. It suggests either Branch 1 (fix the scanning) or Branch 2 (enforce the scan). This is opposite to the request.

  **Politics**: Explain that the scan is a critical safety step and the failure rate must be addressed. Propose alternatives:  
  - Work with IT to troubleshoot the 8% failure (even without new spend, maybe maintenance or training).  
  - If deletion is not an option, then the committee must choose a branch: enforce the scan (Branch 2) or make the state observable in another way (Branch 1).  

  #### (c) Mandatory two-person check skipped during handoffs; add third signature

  1. **Question 1**: Yes, high-alert infusion, critical safety check.
  2. **Question 2**: The step is the two-person check. The receiving nurse cannot tell if the check was done before the handoff. This is history-blind: at the moment of handoff, the state (whether the check was done) is not observable.  
  3. **Consequence**: High (because it's a high-alert drug).

  **Branch Selection**:  
  - Option 1: Make state observable: add a visible marker (e.g., a tag on the pump, a signature on a board in the room) that the check was done.  
  - Option 2: Remove choice: force the check to be done at specific times (e.g., at handoff) or by the receiving nurse.  
  - Option 3: Default behavior: if unsure, do the check again? But that might be redundant and time-consuming.

  The request is to add a third signature (the receiving nurse) to the record. This is making the state observable? Not exactly, because the receiving nurse is now part of the check. It's more like a handoff check. Alternatively, it could be seen as a way to document that the check was done at handoff.

  But the problem is that the check might have been done at the beginning of the infusion and then the handoff happens. The receiving nurse doesn't know if it was done. The third signature is a way to document that the check was done at handoff? That doesn't solve the problem of the original check being missed. It just adds a new check at handoff.

  **Better Fix**: Make the state observable: have a clear, visible record (like a tag on the pump) that the initial check was done. Then at handoff, the receiving nurse can see that tag and know it was done. If the tag is missing, they know to do the check.

  The request (third signature) is a form of making the state observable? It leaves a record that the handoff check was done, but it doesn't address the ambiguity about the initial check. It also adds a new check (which might be redundant).

  **Procedure Suggestion**: Prefer Branch 1: make the initial check observable (e.g., a tag on the pump that stays until the infusion is complete). Then the receiving nurse can see it. If the tag is missing, they do the check and add the tag. This avoids the need for a third signature and reduces redundancy.

  **Trust Score**: Branch 1 (observable) has a high trust score (4 or 5).  

  **Outcome**: The procedure suggests an alternative to the third signature. It might not be what the requester wants (they proposed a third signature) but it addresses the root cause (the state is not observable) and is less burdensome.

  ### What the Procedure Can't Handle

  - **Ambiguity about which patient**: This is a different problem (patient misidentification) and requires separate solutions (e.g., two-patient identifiers, armbands).  
  - **History in someone else's head**: The procedure assumes that the state can be made observable. If critical information is only in a person's mind and not shared, that requires communication protocols (e.g., structured handoffs) which are outside the scope of this procedure.  
  - **Systemic issues**: Such as chronic understaffing leading to skipped steps, which is a compliance issue but also a resource problem.  
  - **Multiple overlapping sequences**: When a nurse is managing multiple patients and tasks simultaneously, the history-blindness can be compounded.  

  ### Summary of the Decision Procedure

  **Step-by-Step for Committee Meeting (45 minutes per request):**

  1. **Present the request** (5 minutes).
  2. **Identify the step(s) in question** (5 minutes).
  3. **Run Questions 1-3** (10 minutes).
  4. **If history-blind and critical, choose a branch** (10 minutes).  
     - Use the trust score to discuss acceptability to nursing.
  5. **Hand off to human judgment if needed** (10 minutes for discussion and vote).
  6. **Document the decision and rationale** (5 minutes).

  This should fit in 45 minutes with discipline.

  For the examples:  
  - (a) Supported with Branch 3 (if drug safe).  
  - (b) Rejected, and alternative fixes proposed.  
  - (c) Alternative fix proposed (observable state via a tag).  

  The procedure may sometimes land opposite to the request, especially when safety is at stake. To handle the politics:  
  - Emphasize patient safety and the rationale.  
  - Offer alternatives that address the root cause.  
  - Use the trust score to show that the committee values nurse autonomy and is choosing the least accusatory option that is safe.  
    
  Finally, the procedure is a tool to structure the discussion and make the trade-offs explicit, but it cannot replace clinical judgment or values-based decisions.
answer: |-
  Below is a decision procedure tailored for your committee, designed to fit within 45-minute reviews. It explicitly addresses the "absent-minded driver" problem (history-blindness), incorporates the philosophical tradeoffs, and includes safeguards for human factors, legal, and cultural concerns. I'll outline the procedure step-by-step, then apply it to your three cases (a, b, c).

  ---

  ### **The Decision Procedure: "HISTORY" Framework**
  **(45-Minute Flow: 5 min/step)**

  1. **H: History-Blind Test**  
     **Question:** *"Could a nurse, dropped into this step with no memory of the prior 10 minutes, determine if the step was completed?"*  
     **Test to Administer in Meeting:**  
     - **Act it out:** Have the requester and a nurse on the committee role-play the scenario. Use props (e.g., two identical IV bags, a pump with a reset alarm).  
     - **Key Check:** If the role-player hesitates >5 seconds or asks, "Did I already do this?", it fails.  
     **Distinguishing from Compliance:**  
     - If the role-player knows the step isn't done but *chooses* to skip it (e.g., "I’m too busy to scan"), it’s compliance. History-blindness is about *inability to know*, not unwillingness.  
     **Sufficient Answer:** Consensus from role-play + nursing rep. If ambiguous, assume history-blind.  
     **Time:** 5 min.

  2. **I: Impact Assessment**  
     **Question:** *"What is the consequence if this step is duplicated or skipped?"*  
     **Sufficient Answer:** Categorize as:  
     - **Low:** Inconvenience or reversible harm (e.g., delayed care).  
     - **Medium:** Non-lethal harm (e.g., side effects, longer stay).  
     - **High:** Death/disability (e.g., high-alert drugs, wrong patient).  
     **Use:** Determines how aggressively to fix.  
     **Time:** 5 min.

  3. **S: Solution Branch Selection**  
     **Question:** *"Which solution branch best resolves the history-blindness?"*  
     **Branches and Philosophy:**  
     | **Branch** | **When to Prefer** | **Philosophy (Plan vs. Moment)** | **What Committee Commits To** |
     |------------|---------------------|----------------------------------|-------------------------------|
     | **Observable State** (e.g., tags, timers, digital traces) | High-frequency steps; low/medium impact; preserves autonomy. | Favors **the moment**: Trusts staff to act correctly if state is visible. | "We trust you with the truth." |
     | **Remove Choice** (e.g., hard stops, forced functions) | High-impact steps; observable state is impractical. | Favors **the plan**: Enforces pre-commitment; distrusts the moment. | "We prioritize safety over autonomy." |
     | **Default Behavior** (e.g., "when unsure, do X") | Low-impact steps; ambiguous states are rare. | **Compromise**: Defers to the moment but guides it. | "We accept the risk of defaults." |  
     **Sufficient Answer:** Match branch to impact (High impact → Remove Choice; Medium/Low → Observable or Default).  
     **Time:** 10 min.

  4. **T: Trust Impact Score**  
     **Question:** *"How accusatory is this fix?"*  
     **Scoring System (1–5 Scale):**  
     - **1 (High Accusation):** Removes choice + implies incompetence (e.g., mandatory witness for simple tasks).  
     - **3 (Neutral):** Observable state or reasonable defaults (e.g., checklist sticker on bag).  
     - **5 (Empowering):** Makes state visible without restricting autonomy (e.g., color-coded tags).  
     **Sufficient Answer:** Nursing rep scores it. If score ≤2, redesign or justify tradeoff.  
     **Time:** 5 min.

  5. **O: Override to Human Judgment**  
     **Question:** *"Does this require a values tradeoff we must debate?"*  
     **Handoff Triggers:**  
     - Risk tolerance (e.g., "Is preventing 1 death/year worth 1,000 extra hours of nursing time?").  
     - Autonomy erosion (e.g., "Does this hard stop undermine clinical judgment?").  
     - Cost-benefit ambiguity (e.g., "Is a 5-second fix worth it for a rare error?").  
     **Process:** Chair leads 10-min debate, then vote. Document rationale.  
     **Time:** 10 min.

  6. **R: Review Seams & Arbitrary Elements**  
     **Question:** *"Where are we papering over unresolved debates?"*  
     **Honesty Checkpoints:**  
     - **History-Blind Test:** Subjective; relies on role-play realism.  
     - **Branch Selection:** The absent-minded driver problem has **no philosophical consensus**. Removing choice enforces the plan; defaults trust the moment.  
     - **Unsettled Risks:** Ambiguity about *which patient* (not just which step) is outside this model.  
     **Sufficient Answer:** Explicitly flag these in the decision document.  
     **Time:** 5 min.

  7. **Y: Yield to Implementation**  
     **Question:** *"Can this be piloted for 30 days with feedback?"*  
     **Sufficient Answer:** If no IT spend, require a low-cost pilot (e.g., paper-based). Nursing council signs off on pilot design.  
     **Time:** 5 min.

  ---

  ### **Application to Your Cases**
  **Key Philosophy Tradeoff:**  
  - **Observable State** trusts the moment.  
  - **Remove Choice** trusts the plan.  
  - **Default Behavior** splits the difference.

  #### **(a) Repeat Dose of IV Antiemetic**  
  - **H:** **History-blind.** After interruption, nurse can't tell if first dose was given (no documentation, bag looks unchanged).  
  - **I:** **Medium.** Double dose causes side effects (e.g., sedation); no dose prolongs nausea.  
  - **S:** **Default Behavior branch** (cap at 2 doses/shift). Best for medium impact + frequent decisions. Favors the moment ("When unsure, you may repeat").  
  - **T:** **Score 4.** Empowers nurses; not accusatory.  
  - **O:** **Handoff needed.** Values debate: Is nausea relief worth sedation risk? Committee votes.  
  - **R:** **Seam:** Defaults assume drug safety is well-established.  
  - **Y:** Pilot with paper log.  
  **Outcome:** **Supports requester.** Philosophy aligns with trusting the moment.

  #### **(b) Delete Barcode Scan**  
  - **H:** **History-blind.** Nurse at bedside can't tell if scan was done at start of shift or if meds changed.  
  - **I:** **High.** Scanning prevents wrong-drug/wrong-patient errors (potentially fatal).  
  - **S:** **Observable State branch** (fix workaround). Deleting the scan removes a safety layer → unacceptable for high impact.  
  - **T:** Deleting scans **scores 1** (appears to blame nurses for workarounds). Observable fix (e.g., bedside scan + backup paper log) scores 3.  
  - **O:** **Handoff needed.** Is 8% failure rate worth risk? If no IT spend, committee weighs procedural burden vs. safety.  
  - **R:** **Seam:** Ambiguity if multiple patients are involved (not addressed here).  
  - **Y:** Pilot bedside scan + paper backup.  
  **Outcome:** **Rejects request** (but offers alternative). Procedure gets there for the right reasons: history-blindness + high impact demand observable state, not removal of safeguards.  
  **Politics:** Explain: "Deleting the scan doesn't fix history-blindness; it removes our ability to see the state. We’ll fix the workaround without blaming staff."

  #### **(c) Two-Person Check at Handoff: Add Third Signature**  
  - **H:** **History-blind.** Receiving nurse can't tell if check was done pre-handoff.  
  - **I:** **High.** High-alert infusions; double dose could kill.  
  - **S:** **Observable State branch** (e.g., physical tag on pump when checked). Adding a third signature doesn’t solve ambiguity; it adds bureaucracy.  
  - **T:** Third signature **scores 2** (implies prior nurses can't be trusted). Observable tag scores 4.  
  - **O:** **No handoff.** Fix is low-cost (tag) and reduces burden.  
  - **R:** **Arbitrary:** The driver problem debates "who decides?"—here, the tag makes the state visible, sidestepping the dispute.  
  - **Y:** Pilot with removable tags.  
  **Outcome:** **Rejects request** but offers better fix. Procedure lands opposite: Requester wants more oversight, but tags are less accusatory and more effective.  
  **Politics:** Frame as: "Tags let you *see* the check happened—no more guessing or extra signatures."

  ---

  ### **What the Procedure Can’t Handle**  
  1. **Ambiguity about which patient** (e.g., identical twins, mislabeled rooms). This requires separate ID protocols (e.g., biometrics, two-step ID).  
  2. **History in someone else’s head** (e.g., handoff communication gaps). Use structured tools like SBAR or I-PASS.  
  3. **Systemic issues** (e.g., chronic understaffing causing shortcuts). These escalate to hospital leadership.  
  4. **Unconscious deviations** (e.g., automatic behaviors). Requires behavioral psychology expertise.  

  ### **Final Guidance**  
  - **When Politics Clash:** If the procedure opposes a request, appeal to shared values: "We all want patients safe and nurses empowered. This fix achieves both by [branch rationale]."  
  - **Unsettled Philosophy:** The absent-minded driver debate *is* unresolved. Your procedure makes the choice explicit (e.g., "We prioritize the plan via hard stops for high-alert drugs"), avoiding arbitrariness.  
  - **Output:** For each request, document: (1) History-blind test result, (2) Chosen branch + philosophy, (3) Trust score, (4) Handoff debates.  

  This procedure turns abstract theory into actionable questions, exposes tradeoffs, and respects frontline realities—without new IT spend.
