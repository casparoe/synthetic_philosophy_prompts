  For the procedure, I need to build something that:
  1. Explicitly separates identification (what is this norm?) from evaluation (should we comply?)
  2. Has clear escalation points when certainty isn't achievable
  3. Flags where "objective" steps are actually judgment calls
  4. Produces defensible outputs for ethics committees

  The five test cases are perfectly chosen to stress-test the system. That tipping example (#1) will force "comply" recommendation despite traveler objections - which meets the user's request for at least one unpopular output. The queueing dilemma (#2) and jaywalking (#3) test coordination vs legal boundaries. The gender norms case (#4) is ethically charged, and the cash envelope (#5) is classic handoff territory.

  For structure, I'll design a 6-step funnel: from verifying the norm exists, through burden analysis, to third-party impact assessment. Each step needs:
  - A binary decision point
  - A "sufficient evidence" threshold
  - Clear stop/escalation rules
  Crucially, step 4 (burden transfer) will be flagged as the main judgment call disguised as procedure - the point where values inevitably enter.

  The deliverables will include:
  - Numbered steps with rationale
  - Plain-language flowchart
  - Case applications with handbook wording
  - Honest limitations section

  British English throughout, as requested. And no citations - this needs to stand on practical logic alone. The gender norms case will indeed push toward "comply" in the procedure, but I'll explicitly note where the system overreaches by prioritizing relationship preservation over individual dignity.

  Most importantly, the "what it can't do" section will warn about:
  - Collective harm norms (where individual compliance maintains bad systems)
  - Misidentified power dynamics
  - Epistemic black holes (norms that defy outsider observation)
  - Values conflicts masquerading as fact questions

  This should give the user not just a tool, but transparency about where the tool breaks - which is what they're really asking for when they request "fake rigour" flags.
answer: |-
  ### Procedure for Evaluating Local Convention Compliance Obligations  
  *(6-step decision sequence for advisers; 15 minutes/norm)*  

  **Key Principles:**  
  1. **Epistemics first:** Separate *verifying the norm exists* from *judging its moral weight*.  
  2. **Burden test:** Focus on *who bears the cost* of non-compliance.  
  3. **Defensible uncertainty:** If evidence is weak or ambiguous, escalate.  

  ---

  ### Step 0: Pre-Check (2 mins)  
  **Action:** Confirm this is a *reported behavioural regularity* with perceived social significance (not a one-off).  
  **Evidence Sufficiency:** At least two independent sources (e.g., returnee feedback + host institution guidance + reputable travel advisory).  
  **Stop Condition:** If unverified → **Handoff to regional specialist**.  
  **Fake Rigour Flag:** Judging "independent" sources is subjective.  

  ### Step 1: Coordination Test (3 mins)  
  **Question:** *Is this purely about avoiding mutual inconvenience?*  
  (e.g., jaywalking when safe, queuing styles).  
  **Check:** If non-compliance *only* inconveniences the traveller (e.g., missing a bus) and doesn’t harm others.  
  **Sufficient Answer:** "Yes" if locals describe it as "how we avoid chaos" not "what decent people do".  
  **Stop Condition:** If yes → **Output: "Comply or adapt; no moral obligation."**  
  **If no → Proceed to Step 2.**  

  ### Step 2: Burden Transfer Test (4 mins)  
  **Question:** *Does my non-compliance push costs onto vulnerable/unconsenting parties?*  
  (e.g., tipped wages, queue-jumping causing others to lose out).  
  **Check:** Identify who is harmed. Is it someone with low power to avoid the harm (e.g., server, fellow passenger)?  
  **Sufficient Answer:** Clear evidence of direct, unavoidable harm (e.g., tips subsidising base pay verified by local labour law).  
  **Stop Condition:** If confirmed → **Output: "Comply; obligation exists to avoid harm."**  
  **If unclear/absent → Proceed to Step 3.**  

  ### Step 3: Third-Party Reliance Test (3 mins)  
  **Question:** *Did someone reasonably rely on my compliance, such that breaking it betrays trust?*  
  (e.g., cash allowances pre-allocated by hosts, pre-booked shared taxis).  
  **Check:** Is there evidence of preparatory action by others *because* they assumed compliance?  
  **Sufficient Answer:** Direct confirmation (e.g., host states: "We budgeted this for you").  
  **Stop Condition:** If confirmed → **Output: "Comply; obligation exists due to reliance."**  
  **If no → Proceed to Step 4.**  

  ### Step 4: Moral Objection Filter (2 mins)  
  **Question:** *Does complying endorse/participate in something deeply harmful or discriminatory?*  
  (e.g., norms enforcing gender/racial hierarchy).  
  **Check:** Does the practice actively degrade, exclude, or endanger a group? (Not just "uncomfortable").  
  **Sufficient Answer:** Evidence of systemic harm (e.g., local women report exclusion from promotions linked to the norm).  
  **Stop Condition:** If confirmed → **Output: "Do not comply; override for ethical reasons."**  
  **If no → Proceed to Step 5.**  

  ### Step 5: Sanction Assessment (1 min)  
  **Question:** *Is the sanction for non-compliance primarily reputational or relational?*  
  (e.g., mild offence taken, seen as "odd" not "wrong").  
  **Check:** Are penalties social (awkwardness) rather than material (fines, job loss)?  
  **Sufficient Answer:** Returnee/host reports confirm no lasting consequences beyond mild friction.  
  **Stop Condition:** If yes → **Output: "Adapt if practical; no strong obligation."**  
  **If sanctions are severe → Output: "Comply; self-protection justified."**  

  ### Step 6: Legal/Contractual Cross-Check (Always)  
  **Overlay:** If any step suggests "comply" but it violates UK law/university policy → **Handoff to legal team**.  

  ---

  ### One-Page Flowchart-in-Words  
  `START → [0. Verify norm? NO → Handoff | YES → 1. Coordination norm? YES → "Comply/adapt, no obligation" → END]`  
  `↓ NO`  
  `→ [2. Harms vulnerable party? YES → "Comply (avoid harm)" → END]`  
  `↓ NO`  
  `→ [3. Breaches relied-upon trust? YES → "Comply (honour reliance)" → END]`  
  `↓ NO`  
  `→ [4. Participates in systemic harm? YES → "Do not comply (ethical override)" → END]`  
  `↓ NO`  
  `→ [5. Sanction severe? YES → "Comply (self-protect)" | NO → "Adapt if practical" → END]`  
  `!!! LEGAL CHECK AT EVERY "COMPLY" OUTPUT → If conflicts UK law/policy: HANDFOFF`  

  ---

  ### Case Applications  

  | **Case** | Key Bucket | Output Sentence in Pack |  
  |----------|------------|-------------------------|  
  | **1. Tipping** | Burden Transfer (Step 2) | *"Tips constitute 60-80% of servers’ income here. You are obliged to tip 15-20% to avoid direct harm to low-wage workers, even if personally opposed. Expense via petty cash; cite ‘essential local labour practice’."* |  
  | **2. Bus Crush** | Coordination (Step 1) | *"Boarding operates on ‘first to door’ basis, not queuing. Adapt to local flow to avoid missing transport. No obligation, but non-compliance solely inconveniences you."* |  
  | **3. Jaywalking** | Sanction Assessment (Step 5) | *"Crossing on red is common but illegal. Fines are substantial and tied to your host’s sponsorship. Comply with signals; your child’s presence increases scrutiny. Obligation stems from legal risk to institution."* |  
  | **4. Gender Norms** | Moral Objection Filter (Step 4 → **Override**) | *"Do not comply with gendered greeting/dining customs. Host sanctions target you, but the norm perpetuates workplace exclusion. We will brief hosts in advance on our equality policy. Escalate pushback to Mobility Office."* |  
  | **5. Cash Envelope** | Third-Party Reliance (Step 3 → **Handoff**) | *"Unrecorded cash ‘allowances’ conflict with UK fraud prevention policy. DO NOT ACCEPT. Escalate immediately to Legal & Finance. Hosts claim reliance, but legality overrides."* |  

  **Note:** Case 4 triggers ethical override (Step 4). The procedure *does* overreach by assuming "systemic harm" is verifiable in 4 mins. Here, junior women’s testimonies were deemed sufficient.  

  ---

  ### What the Procedure Cannot Do (Honest Limitations)  
  1. **Collective Harm Blindspots:** Norms where *individual* compliance seems harmless but *collective* practice is destructive (e.g., ubiquitous bribery). Outputs may wrongly suggest "comply if no direct burden".  
     *How you’d notice:* Returnees report enabling corrupt systems despite following the procedure.  
  2. **Power Misreads:** Underestimates when "vulnerable" parties *prefer* the norm (e.g., tipped workers fearing wage cuts if tipping abolished). Favours visible harm over complex consent.  
  3. **Epistemic Black Holes:** Fails on norms locals hide from outsiders (e.g., religious taboos). Relies on surface observations.  
  4. **Values Collisions:** Cannot resolve "modelling for children" (Case 3) vs. "teaching ethical resistance". Favours pragmatic self-protection.  
  5. **Speed-Induced Errors:** Forces binary categorisation. A 15-min limit will misclassify nuanced norms (e.g., "letting seniors order food" could be respect *or* sexism).  

  **Defence Strategy:** Document all sources used at Step 0. Flagged "fake rigour" steps (e.g., Step 4 harm assessment) justify escalation when challenged.  

  ---  
  **Output Tone:** British English, imperative mood. Assumes traveller resistance but centres institutional duty of care.  
  **On Unpopular Outputs:** Case 1 (tipping) forces complicity with an "extortionate" system – argue via *immediate harm prevention*, not moral endorsement.
