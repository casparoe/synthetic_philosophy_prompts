prompt: |-
  I sit on the safety review board of a small regional airline and we have to sign off on the internal report for last month's incident — turboprop, hard landing, right gear collapsed, four passengers injured, no fatalities. The chain our investigators laid out: a retaining bolt in the right gear had been passed its replacement interval for eleven days and nobody swapped it; the maintenance program calls for a second mechanic to verify that swap and the sign-off for it is blank; the torque-verification rig that would have flagged the bolt was pulled offline six weeks earlier for a software update and never put back in service; and nine years ago a now-retired structures engineer wrote a memo saying the bolt's design should be revisited, it was declined, and he never raised it again.

  The problem we can't agree on is the form. It gives us one line for the cause of the occurrence and then an open list of contributing factors, and the regulator treats those very differently — the cause line is what gets read into enforcement against individuals, contributing factors only feed safety recommendations. Two of us want the missed replacement in the cause line and everything else as contributing. Our staff engineer says none of them belong there at all: the cause is the cracked bolt and the collapse, these are all things that didn't happen, and calling an absence a cause is just a polite way of saying somebody's to blame — plus once you list failures to act you never stop, since why isn't it also a cause that the manufacturer never redesigned the bolt, or that we never hired enough mechanics to make the schedule stick? Another member points out that the second-mechanic verification and the torque rig were each by itself enough to catch the bolt, so of neither can you say the injuries wouldn't have happened without it, which by the test we normally use means neither is a cause — a result he thinks is obviously absurd.

  Report goes to the regulator in nine days, we meet Thursday. Draft the findings section I'll circulate: what actually goes in the cause line, what goes in contributing factors, and why the placement matters given how the regulator uses each. Then give us a standing rule the board can adopt so we're not relitigating this every time an omission comes up. Engage the staff engineer properly instead of just outvoting him — if he's right that we're smuggling blame into a causal field, say what the honest version of the form would look like instead. And tell me what to do about the fueler from the handling company who told an investigator he'd noticed chafing on that gear leg two days before the flight and mentioned it to nobody: we have no jurisdiction over him and I dont know whether he belongs in this report at all.
reasoning: |-
  Okay, the user is part of a safety review board for a small regional airline dealing with a complex incident report. They need help drafting findings for a regulatory report where the main issue is categorizing causes versus contributing factors. The incident involves a hard landing leading to a gear collapse due to a missed bolt replacement. 

  First, I need to understand the core conflict: the team disagrees on how to fill out the form's "cause" line versus the "contributing factors" list. The regulator treats these differently—"cause" can lead to enforcement against individuals, while contributing factors only inform safety recommendations. 

  Some board members want the missed bolt replacement as the cause, with other elements as contributing factors. The staff engineer argues that only physical events (the cracked bolt and collapse) should be in the cause line, labeling omissions as "blame smuggling." Another member points out logical flaws in the "but-for" test applied to multiple preventive measures. 

  The user also mentions a fueler who noticed chafing but didn't report it—this adds jurisdictional uncertainty. 

  Key philosophical tensions emerge: 
  - Can "absences" (like missed maintenance) be causes? 
  - How to avoid infinite regress (e.g., blaming the bolt designer)? 
  - Reconciling multiple sufficient preventive failures. 

  The staff engineer has a valid point about conflating causality with blame. Aviation safety traditionally focuses on active failures but modern frameworks (like Reason's Swiss Cheese model) acknowledge latent conditions. However, regulatory forms might not reflect this nuance. 

  For the findings draft: 
  - The cause line should capture the most direct operational failure (the missed bolt swap) since it's the last controllable event. 
  - Contributing factors should include all system failures (verification lapse, tool outage, design memo). 
  This balances regulatory expectations with systemic analysis. 

  The standing rule proposal should: 
  - Define "cause" as the proximate failure in operational control. 
  - Treat upstream organizational flaws as contributing factors. 
  - Explicitly exclude "but-for" tests for multiple sufficient failures. 

  For the fueler: since he's outside jurisdiction but his observation relates to risk detection, he should be a contributing factor (reporting culture failure) without naming him. 

  The deeper need here is preserving the board's credibility—both with regulators (by complying with form intent) and internally (by addressing the engineer's concerns about blame culture). The "honest form" alternative (listing all failures neutrally) is theoretically better but impractical given regulatory constraints. 

  Final output must: 
  - Resolve the categorization logically. 
  - Offer a repeatable rule. 
  - Validate the engineer's concern while pragmatically working within the form's limits. 
  - Handle the fueler fairly without overreach.
answer: |-
  Here's a draft Findings section addressing your core disagreements, the staff engineer's concerns, the fueler's role, and a proposed standing rule:

  ---

  **DRAFT FINDINGS: Incident [Flight #/Date/Aircraft Tail #]**

  1.  **Cause of the Occurrence:** Failure to replace the right main landing gear retaining bolt at its prescribed replacement interval.
  2.  **Contributing Factors:**
      *   Inadequate execution of the independent verification procedure required by the maintenance program for the bolt replacement task (missing second mechanic sign-off).
      *   Unavailability of the calibrated torque-verification rig due to its extended removal from service following a software update.
      *   Latent organizational deficiency: Lack of a formal mechanism to re-evaluate the component design following the identification of potential concerns (as documented in the 9-year-old engineer's memo).
      *   Latent organizational deficiency: Inadequate oversight of critical tool availability and return-to-service processes.
      *   Latent organizational deficiency: Inadequate safety reporting culture, as evidenced by the observed but unreported gear leg chafing.

  ---

  **Placement Rationale & Regulatory Impact:**

  1.  **Cause Line (Failure to replace the bolt):**
      *   **Why here?** This is the most direct, proximate operational failure in the chain. It was a specific, required action within the airline's control that was not performed, directly enabling the bolt to fail under stress. It meets the regulator's likely "but-for" test: *but for* this specific maintenance task not being done, the bolt likely wouldn't have been present to fail. It is an "absence of action" but one that was explicitly mandated by procedure at a specific time.
      *   **Regulatory Impact:** This *will* trigger regulator scrutiny of the Maintenance Control / Planning department and potentially the assigned mechanic(s). Enforcement action (fines, sanctions against the *organization* or certifications of *individuals*) is possible based on their specific failures (e.g., scheduling, work order management, task execution). The focus is on accountability for the defined procedural lapse.

  2.  **Contributing Factors (Verification, Tool, Design Review, Oversight, Reporting Culture):**
      *   **Why here?** These represent systemic weaknesses or failures in the airline's Safety Management System (SMS) that created the *conditions* allowing the proximate cause (missed bolt) to occur and go undetected. They are primarily "absences" (of verification, of tool availability, of design review process, of oversight, of reporting) representing organizational or process failures.
      *   **Regulatory Impact:** These will result in **Safety Recommendations** directed at the airline. The regulator will expect a formal response detailing corrective actions to address these systemic issues (e.g., revise verification procedures, implement tool tracking/return-to-service protocols, establish a formal process for re-evaluating historical concerns, enhance oversight mechanisms, improve safety reporting culture training). Enforcement against individuals is unlikely based *solely* on these factors in the report. They drive systemic improvement.

  **Addressing the Staff Engineer's Concerns ("Smuggling Blame"):**

  The staff engineer is fundamentally correct about the limitations of the form and the risk of confusing causality with blame, especially concerning omissions. His point about infinite regress (blaming the manufacturer, hiring) is valid.

  *   **Engagement & Compromise:**
      *   Acknowledge his core insight: "You are right that listing every conceivable absence as a 'cause' is illogical and leads to infinite regress, shifting focus from the organization's operational control. It also risks attributing blame where systemic factors dominate."
      *   Explain the practical reality: "The regulator's form structure forces a distinction between the most direct operational failure (their enforcement focus) and systemic precursors (their SMS focus). We are using 'Cause' narrowly to mean 'the final operational failure within our direct control that allowed the physical failure.'"
      *   Highlight the mitigating approach: By labeling the upstream factors as "Latent Organizational Deficiencies" in the contributing factors list, we explicitly frame them as systemic SMS issues, not individual blames. We avoid listing *all possible* omissions (like hiring or the 9-year-old design decision itself), focusing only on omissions *within the airline's current operational and safety management processes* that demonstrably contributed *to this specific failure chain*.
      *   **The "Honest Form":** An ideal form wouldn't force a single "Cause" but would have sections for:
          1.  **Proximate Trigger:** The immediate operational failure (Missed Bolt Replacement).
          2.  **Latent Conditions:** The underlying systemic/organizational failures that enabled the trigger (Verification lapse, Tool unavailability, Inadequate design review process, Oversight failure, Reporting culture).
          3.  **Barrier Failures:** Specific defenses that didn't work (Verification procedure, Tool check - both failed here).
          This structure better reflects modern safety science (Reason's model) but isn't the current regulatory format.

  **Standing Rule on Omissions as Cause/Contributing Factors:**

  > **Proposed Board Standing Rule:** "For the purpose of reporting on this form:
  > 1.  **Cause (Proximate Operational Failure):** Shall be restricted to the *most immediate and necessary operational action (or mandated inaction) within the airline's direct control that was not performed or was performed incorrectly, and without which the incident would likely not have occurred.* This typically involves a specific task deviation, procedural violation, or failure to execute a required maintenance/operational action as prescribed.
  > 2.  **Contributing Factors (Systemic/Organizational Precursors):** Shall include failures of organizational processes, defenses, oversight, or culture (including omissions) that created the conditions allowing the proximate operational failure to occur or go undetected. These factors are characterized by their latency and contribution to multiple potential failure paths, not just this specific incident.
  > 3.  **Exclusion:** Factors entirely outside the airline's reasonable sphere of control or influence (e.g., original component design flaws not previously identified as critical by the manufacturer or regulator, acts of God, deliberate sabotage by external actors) shall not be listed as Causes or Contributing Factors, though they may be noted descriptively in the report narrative if relevant. The 'but-for' test is applied rigorously only to the 'Cause' line item; multiple sufficient contributing factors are permitted."

  **Rationale for the Rule:** This rule:
  *   Defines "Cause" narrowly and operationally.
  *   Explicitly allows "omissions" as Contributing Factors when they represent systemic failures.
  *   Avoids infinite regress by focusing on the airline's operational control and processes.
  *   Acknowledges multiple sufficient barriers can fail (addressing the "absurdity" concern).
  *   Distinguishes latent conditions from the proximate trigger.

  **The Fueler (Handling Company Employee):**

  *   **Do not** name the individual fueler in the report. He is not an airline employee.
  *   **Do** include the *fact* and its implication as a Contributing Factor:
      *   **Finding:** "Latent organizational deficiency: Inadequate safety reporting culture, as evidenced by the observed but unreported gear leg chafing."
  *   **Why include it?** The *failure to report* observed damage is a symptom of a safety culture issue relevant to the airline's operational environment, even if the observer wasn't an airline employee. It highlights a vulnerability in the overall system detecting potential issues.
  *   **Action:** Flag this specific finding internally to the relevant department (likely Ground Ops or Safety). They must engage with the handling company to:
      1.  Verify the fueler's statement.
      2.  Understand why the handling company's reporting procedures failed (Did he know how? Was he discouraged?).
      3.  Strengthen the contractual safety reporting requirements and communication channels between the handling company and airline maintenance control. *This* becomes part of the corrective action plan stemming from the Contributing Factor.

  ---

  **Recommendation for Thursday's Meeting:**

  1.  Present this draft Findings section.
  2.  Present the proposed Standing Rule for adoption.
  3.  Explicitly acknowledge the staff engineer's valid concerns about blame vs. causality and the form's limitations. Explain how the draft and rule attempt to address them pragmatically within the regulatory framework, while agreeing an ideal form would look different.
  4.  Discuss the approach to the fueler's information (include as evidence of culture, not name, drive action with handling company).
  5.  Seek consensus on this approach as a resolution to the current impasse and a template for future incidents involving omissions or latent conditions. Emphasize that the Contributing Factors section, especially "Latent Organizational Deficiencies," is where the crucial systemic learning and SMS improvement happens.
