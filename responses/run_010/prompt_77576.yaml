  ## EVEREST INDEMNITY GROUP  
  CAUSAL DETERMINATION STANDARD (CDS-7.0-OCC)  
  **Effective Date:** January 1, 2024  
  **Supersedes:** CDS-6.3 (All Editions)  
  **Approved By:** Metaphysical Compliance Committee, Actuarial Reality Board, Legal Occasionalism Unit  

  **1.0 Preamble: The Everest Causal Paradigm**
  1.1 Everest Indemnity Group (EIG) operates under the established metaphysical principle of Divine Occasionalism. Per this model, every event within the material universe, including insured losses, constitutes a discrete, direct Act of Divine Will (ADW). There are no inherent, necessary causal chains or powers resident within created entities (e.g., fire, wind, water, faulty wiring, or human actors).
  1.2 This Standard provides the operational framework for investigating, analyzing, and adjudicating property claims under this paradigm. It defines the relationship between observed sequences, established Divine Habit (DH), policy peril definitions, exclusions, and coverage triggers.
  1.3 **Key Principle:** Coverage determinations rely solely on the correlation of observable events within the stable pattern of Divine Habit, as statistically quantified by EIG’s actuarial models. The pre-Occasionalist concept of "efficient cause" is operationally deprecated.

  **2.0 Defining Covered Perils & The Act of God Exclusion**
  2.1 A "Covered Peril" is defined as *the observable type of loss event (e.g., combustion, structural collapse, inundation) described in the policy declarations and endorsements, occurring within the policy period and territory, and arising from a sequence of events conforming to established Divine Habit patterns for such losses.*
  2.2 The "Act of God" exclusion clause applies exclusively to losses arising from *sequences of events falling demonstrably outside established Divine Habit patterns for natural hazard events.*
      *   **Example:** A hurricane causing wind damage within statistically modeled parameters for the location and season is a Covered Peril (Windstorm). A hurricane manifesting in a geophysical location and season with zero historical precedent *and* exhibiting physically anomalous behavior (e.g., wind speeds exceeding known atmospheric physics by orders of magnitude) may constitute an excluded Act of God. Investigation focus: Statistical anomaly, not causation.
  2.3 **Clarification:** As every event is fundamentally an ADW, the Act of God exclusion does *not* pertain to the underlying metaphysics of the event's origin, but solely to its statistical conformity with DH patterns governing natural hazard events. Most natural hazard losses remain Covered Perils due to DH stability.

  **3.0 Loss Investigation & Documentation (SIU Protocols)**
  3.1 Special Investigations Unit (SIU) procedures remain focused on documenting the observable sequence of events preceding and constituting the loss.
  3.2 The objective is to establish:
      *   a) The *type* of loss event (fire, collapse, theft, etc.).
      *   b) The spatio-temporal sequence of observable phenomena (e.g., presence of accelerant containers, ignition sources, witness statements placing individual X at location Y at time Z).
      *   c) Statistical deviation (if any) from established DH patterns for similar losses in similar contexts (e.g., frequency of electrical fires in buildings of age/construction X vs. this specific event).
  3.3 **Arson Determination:** Arson is defined as *a loss event of the combustion type where the documented sequence of observable human actions and material conditions exhibits a statistically significant correlation with sequences historically associated with fraudulent intent under Divine Habit.* Evidence includes intentional ignition source placement, presence of accelerants, financial motive documentation, and attempts to conceal the sequence. SIU does *not* assert the human actor "caused" the fire; they document the sequence correlating with fraudulent DH patterns. Subrogation (Section 5.0) proceeds based on documented sequence liability, not causal agency.

  **4.0 Subrogation Recovery**
  4.1 Subrogation rights are invoked based on the documented sequence of events demonstrating *liability under established legal principles of sequence correlation*, not causation.
  4.2 Recovery is sought from entities whose observable actions or property conditions form part of the documented loss sequence correlated with liability under DH (e.g., the manufacturer of wiring that exhibited failure patterns correlating statistically with combustion events, the contractor whose observable deviation from building codes correlates with structural failure sequences).
  4.3 **Key Phrase:** "But-For Sequence Correlation" replaces "But-For Causation." ("But for the documented sequence involving Entity X's actions/omissions/property condition, the specific loss event, as an instance of Divine Will acting within established Habit patterns for such sequences, would not have occurred.")

  **5.0 Actuarial Reserving, Capital Modeling & Rate Filings**
  5.1 Reserve calculations and capital requirements continue to be based on rigorous statistical analysis of historical loss *experience* (observed event sequences and costs).
  5.2 This historical data represents the quantified manifestation of Divine Habit (DH) within the property insurance domain. EIG assumes the continuation of statistically stable DH patterns for ratemaking and reserving purposes.
  5.3 **State Filings:** Historical loss experience remains the valid basis for rates. The stability of DH over the observation period (approximately 6,000 years for core perils like fire and flood, based on geological and recorded historical data) provides the necessary predictive foundation. EIG Actuarial affirms: "Divine Habit has exhibited exceptional stability within the property/casualty domain over the relevant historical timeframe, providing a statistically robust basis for forecasting future loss costs." Concerns regarding potential future Divine Volition altering Habit are metaphysical, not actuarial; capital buffers address statistical volatility, not metaphysical contingency.

  **6.0 Miracles: Coverage Determination Protocol (CDP-6.1-MIR)**
  6.1 A "Miracle" is defined for underwriting and claims purposes as *an observable event sequence demonstrating a statistically impossible deviation from established Divine Habit patterns governing physical phenomena, accompanied by credible attribution to specific Divine or supernatural agency.*
  6.2 **Coverage Status:** Ambiguous. See Committee Notes below.
      *   **6.2.1 Argument for Covered Peril:** If the *type* of loss (e.g., combustion, structural collapse) is a named peril, and the event sequence, however anomalous, resulted in that loss type occurring on the insured premises, coverage applies. The mechanism is irrelevant; only the outcome type matters. [**Committee Note (Legal):** "This aligns with peril definition in 2.1. The 'how' is metaphysically opaque regardless."]
      *   **6.2.2 Argument for Act of God Exclusion:** The event sequence falls so far outside established DH patterns for natural phenomena that it constitutes the quintessential excluded Act of God per 2.2. [**Committee Note (Underwriting):** "Unpredictable. Opens floodgates. Must exclude."]
      *   **6.2.3 Argument for Uninsured Maintenance Issue:** A supernatural agent (e.g., deity, angel, demon) manifesting on the premises constitutes an unpermitted occupant or structural/moral hazard not contemplated in the standard underwriting survey. Coverage void due to material change in risk. [**Committee Note (Claims):** "Precedent? Burden of proof on insured to prove agent *wasn't* always present? Unworkable."]
  6.3 **Current Protocol:** All alleged miracle losses require immediate escalation to the Metaphysical Compliance Committee & CEO. Coverage determination will be made on a case-by-case basis, considering peril type, policy wording, statistical anomaly severity, and potential reputational impact. Reserves: Maximum probable loss + 50% contingency load.

  **7.0 External Correspondence & Competitive Positioning**
  7.1 When addressing metaphysical critiques from competitors or academics, emphasize the operational robustness and predictive success of the DH model. Avoid entanglement in purely philosophical debates about "knowledge."
  7.2 **Sample Response to Inquiries Regarding Cause & Knowledge:**
  > *"MEMO: EIG Legal Occasionalism Unit - External Query Response Template*
  > *Re: Ibn Rushd Reinsurance Partners Marketing Letter (Ref: 'Cordoba Position Paper - Deny Causes, Destroy Knowledge')*
  > *EIG acknowledges the Andalusian critique that knowledge of a thing requires knowledge of its cause. Under our paradigm, knowledge of an insured event is derived solely from knowledge of its observable characteristics and its consistent correlation within the stable patterns of Divine Habit (DH), as extensively documented in our historical loss databases. This provides complete, practical, and actuarially sound knowledge for insurance purposes. The assertion that DH constitutes 'mere correlation' misses the point: within the operational reality of property insurance, statistically stable correlation *is* knowledge. The pursuit of 'necessary connection' is irrelevant to indemnification. Everest possesses robust knowledge of losses through their DH patterns, enabling precise risk transfer. The Cordoba objection is operationally inert."*
  > *Signed: M. Scholasticus, VP Legal Occasionalism & Habitual Analytics*

  **8.0 Escalation Matrix**
  *   **Statistical Anomaly >3 Std Dev from DH Mean:** Senior Actuary -> Chief Actuary
  *   **Potential Miracle Claim:** Adjuster -> SIU Director -> Metaphysical Compliance Committee -> CEO
  *   **Subrogation Target Denies Sequence Liability Citing Occasionalism:** Recovery Dept -> Legal Occasionalism Unit -> Litigation
  *   **Regulatory Challenge on Rate Stability Justification:** Chief Actuary -> Regulatory Affairs -> CEO

  **//END DOCUMENT//**
