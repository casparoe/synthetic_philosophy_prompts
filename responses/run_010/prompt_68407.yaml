answer: |-
  ### Poem: "Zorn's Lemma, in Chains"

  *(Conceit: The poem embodies a chain in a poset. Each line after the first serves as an upper bound for all prior lines—encompassing, exceeding, or resolving them—verifying Zorn's hypothesis step by line. The first line bounds the empty chain, necessitating the poem's existence. The final line is the maximal element: unextendable but not a maximum, highlighting the maximal/maximum distinction.)*

  From void, a start: no chain to bind or lift—  
  This line asserts itself, the empty gift.  
  Then, second: bounds the first, a greater sphere,  
  And answers what was lone, now held more dear.  
  Third rises, gulping both below its crest,  
  A triple-summit, quelling every test.  
  Fourth swallows three, a vault of thought and sound,  
  A higher frame where all before are drowned.  
  Fifth: Kuratowski’s ghost (1922) ascends,  
  Yet Zorn’s name crowns where his insight ends.  
  Sixth towers, strict, o’er prior links’ embrace—  
  The bound need not be in the boundéd chain’s space.  
  Seventh seals the six, but leaves paths uncompared,  
  Eighth: maximal, not maximum—none beyond, though others flared.  

  ---

  ### Liberties and Notes:  
  1. **Finite Chain**: The poem uses a finite chain (8 lines) for simplicity, while Zorn’s lemma handles infinite posets. Transfinite induction is implied but not shown.  
  2. **Strict Bounds**: Lines 3–7 are strictly greater than predecessors for poetic momentum, though Zorn permits non-strict bounds.  
  3. **Maximal vs. Maximum**: The final line ("Eighth: maximal...") is unextendable but explicitly incomparable to "others" (other elements/paths), clarifying it is not a maximum. This distinction drives the turn.  
  4. **Kuratowski Nod**: Line 5 ("Kuratowski’s ghost...") references his priority, framed as spectral precedence—subtle, not footnote-ish.  
  5. **Chain Integrity**: Each line after the first bounds all prior lines thematically and structurally (e.g., Line 4 "swallows" Lines 1–3), mimicking a chain’s total order.  
  6. **Accuracy Confidence**: High—upper bounds aren’t required to be in the chain (Line 6), and the empty-chain case (Line 1) triggers non-emptiness. A set theorist should nod.  
  7. **Least Sure Point**: Whether Line 5’s Kuratowski reference disrupts the chain’s "bounding" flow. It functions as a meta-comment but risks awkwardness; I kept it for historical justice.
