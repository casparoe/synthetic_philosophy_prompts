  The critical point comes in their final question: Can culture do all the cognitive heavy lifting? I think Dennett would argue no - Gregorian tools require Popperian brains to implement them. A purely Skinnerian mind couldn't sustain complex culture because cultural transmission isn't just passive conditioning; it requires inference and error-correction. 

