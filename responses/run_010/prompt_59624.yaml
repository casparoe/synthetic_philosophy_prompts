prompt: |-
  Two weeks from now I'm giving a talk at another department's metaphysics seminar — visiting, mid-sized group, mostly people who work on causation but from pretty different directions. I don't want a defense of my view. I want a Q&A prep sheet.

  The thesis: I'm an eliminativist about omissive causation, but not the standard kind. When we say the gardener's failure to water the plant caused it to die, there's no absence in the world doing any causing. What's true is that an actual, occurrent process — water loss, wilting, cell collapse — ran to completion because a preventive mechanism that was *poised* never fired. And "poised" is meant to be a natural property, not a normative or pragmatic one: roughly, the mechanism was assembled, energized, and one small trigger away from intervening at the relevant time. Hose attached, tap already on, he's standing in the yard = poised. Me, on another continent, failing to water your plant = not poised, so my omission is no cause of anything, even though something like the counterfactual comes out true once you fill in the plane ticket. Bottle of water in the passerby's pocket = borderline, and I'm willing to bite that. So the view promises to kill negative facts entirely, to explain why omission talk is so selective without appealing to norms or speaker interest, and to still get a real difference between the gardner and me. I know the familiar dilemma is in the room's head already — McGrath's version, either there's no causation by omission or there's vastly more of it than common sense accepts — and poisedness is supposed to be my exit from the second horn, so expect them to test whether it actually gets me out.

  The room. The host is a counterfactual theorist who is completely unbothered by absences; she thinks the whole problem is manufactured and there's nothing metaphysically special about positive causation. Two people work in the causal-models tradition: one thinks variable choice and the relativity of causal claims dissolve these puzzles, the other is more formal, works with default-valued models, and will want to know why I don't just take defaults as primitive. There's a process/conserved-quantity theorist who is also an eliminativist about omissions and will read my account as a surrender dressed up as a solution. A philosopher of action cares about the doing/allowing distinction and will want to know what's left of it if omissions are never causes. Someone from the experimental side of causal selection — norms, blame, that literature — will be there. A visitor from the law school works on factual causation in tort, especially liability for negligent omissions. Plus a couple of grad students, one of whom will just keep asking what the truthmakers are.

  Give me the eight-ish objections I'll actually get, ordered by how much damage they'd do, each phrased the way that person would phrase it — the process theorist and the tort lawyer are not going to use the same words — with a reply I can deliver in about two minutes, what I should concede up front so I don't look like I'm digging in, and a note on where the reply is soft. Flag any objection on which the honest answer is that my view is just contextualism with extra steps. Then tell me the one reply that has to land, the thing that if I fumble it the whole talk is a loss. And end with the question I'm hoping nobody asks.
reasoning: |-
  Okay, the user is preparing for a metaphysics seminar on omissive causation. They're an eliminativist but with a twist: instead of absences causing things, it's about mechanisms that were "poised" to act but never fired. They want a Q&A prep sheet with potential objections, replies, and strategies. 

  First, I need to unpack their core argument. Their "poised mechanism" idea replaces absences with actual physical states (e.g., gardener holding a hose). The key sell is that this avoids both horns of McGrath's dilemma—no absences *and* no explosion of omissions. But I see tension already: if poisedness is supposed to be objective and natural, how does it avoid becoming context-dependent when borderline cases arise? 

  The audience breakdown is crucial. Each member represents a landmine: 
  - The counterfactual theorist will deny the problem exists. 
  - The causal-model folks will ask why not just use defaults. 
  - The process theorist will cry "surrender." 
  - The law scholar needs liability to map onto poisedness—but what about the passerby with water? 
  - The truthmaker demand from grad students is inevitable. 

  Biggest threat: McGrath's second horn. If the law school visitor nails the "borderline = liability nightmare" point, and the user can't show poisedness isn't just disguised normativity, the view collapses. The reply must stress *physical* readiness (energy, assembly, triggering proximity) as distinct from mere possibility. But conceding that normativity *creeps in during application* might disarm critics. 

  The question they dread: "How is poisedness not just causal potential by another name?" Because if it is, they've smuggled in the very dispositionality their eliminativism rejects. The honest reply might be that potential isn't causation—but that feels shaky. 

  For the tort lawyer, I’ll craft a reply emphasizing how poisedness tracks *reasonable* preventability better than counterfactuals alone. But I should flag that borderline cases (like the passerby) might force pragmatic compromises—this keeps the user honest about limits. 

  The must-land point: "Poisedness blocks the omission explosion because it requires *actual local mechanisms*, not distant possibilities." If they fumble this, the whole talk becomes "why not just counterfactuals plus norms?" 

  Final note: The truthmaker objection is annoying but survivable. The process theorist's "surrender" charge? More dangerous—need to frame this as *reducing* omissions to processes (the mechanism's state), not eliminating them without replacement.
answer: |-
  Here's your Q&A prep sheet, designed for maximum battlefield utility. Objections are ordered by potential damage, with phrasing tailored to each opponent. I've flagged soft spots and included strategic concessions.

  ---

  ### **Top 8 Objections & Replies**  
  *(Ordered by damage potential)*  

  1. **The Tort Lawyer (Liability Focus)**  
     *Objection:* "Your 'poised mechanism' test lets negligent actors off the hook! If a lifeguard is napping *beside* the pool (poised), they're liable for drowning—but if they're napping in the break room (not poised), they're not? Both violated the same duty. Law needs consistent normative standards, not physics-based hair-splitting."  
     *Reply:* "Poisedness *anchors* duty to physical reality: the lifeguard poolside is *part of the causal system* in a way the break-room guard isn’t. Law already distinguishes 'opportunity to act' (e.g., proximity in negligence cases). This avoids overextending liability to globally possible but unreal preventers."  
     *Concede:* Borderline cases (e.g., lifeguard 10 feet away) may need pragmatic legal tests.  
     *Soft Spot:* Blurs descriptive metaphysics with prescriptive law.  

  2. **Counterfactual Theorist (Host)**  
     *Objection:* "Why invent 'poisedness' when counterfactuals handle omissions cleanly? 'If the gardener watered, it wouldn’t have died' is true for the gardener but false for you on another continent. All the selectivity comes from context. You’re dressing up pragmatics as metaphysics."  
     *Reply:* "Counterfactuals *identify* omissions but don’t ground *causation*. Poisedness explains *why* some counterfactuals feel causal (the mechanism was real and ready) while others don’t (mere possibilities). It’s the difference between a loaded gun and a disassembled one."  
     *Concede:* Context sets the relevant mechanism (e.g., "watering" means gardener, not rain).  
     *Soft Spot:* Risks becoming "contextualism with extra steps" if poisedness relies on contextually set thresholds.  

  3. **Process Theorist (Eliminativist Ally?)**  
     *Objection:* "Calling it 'poised mechanisms' is eliminativism in name only. You’ve replaced absences with *dispositions* (readiness to act). But dispositions aren’t occurrent processes—they’re just absences in a lab coat! This surrenders to quiddities."  
     *Reply:* "The *poised state* is occurrent: the gardener’s muscles are tensed, the hose is pressurized. It’s the actual energy state of a preventive mechanism, not a bare disposition. Wilting occurs *because* this physical state didn’t change."  
     *Concede:* Dispositional language is unavoidable, but the substrate is physical.  
     *Soft Spot:* Vulnerable if "poised" can’t be defined without circularity.  

  4. **Causal-Models Formalist (Defaults Advocate)**  
     *Objection:* "Defaults in causal models already solve omission selectivity. Why add poisedness? It’s just a relabeling of 'default = normal state'—which we take as primitive to avoid metaphysical baggage."  
     *Reply:* "Defaults are useful but ungrounded: *why* is 'gardener waters' the default? Poisedness provides a physical basis. The default is set by the mechanism’s actual state (e.g., irrigation system installed), not just modeling choices."  
     *Concede:* Defaults may capture pragmatic priorities in models.  
     *Soft Spot:* If "default" is interpreted naturalistically, the views converge.  

  5. **Philosopher of Action (Doing/Allowing)**  
     *Objection:* "If omissions aren’t causes, what’s left of 'allowing harm'? The distinction collapses: both involve non-intervention. But we blame the poised gardener, not you abroad. Your view severs morality from causation."  
     *Reply:* "Allowing harm *is* a moral judgment applied to agents with poised preventive capacity. Causation is physical (water loss); blame tracks responsibility for the poised mechanism’s inaction."  
     *Concede:* Morality isn’t reducible to causation—but causation constrains it.  
     *Soft Spot:* Leaves "responsibility for inaction" metaphysically thin.  

  6. **Experimental Selection Scholar (Norms/Blame)**  
     *Objection:* "Your view ignores 20 years of evidence! People *call* omissions 'causes' based on norms, not physics. The passerby *is* blamed if they knew the plant was dying—even if 'poisedness' is borderline. Norms explain the selectivity, not your mechanism."  
     *Reply:* "Poisedness explains *why* norms latch onto certain cases: it provides a physical correlate for 'reasonable opportunity to act.' The passerby isn’t blamed if they lack capacity (e.g., no water bottle)."  
     *Concede:* Norms influence causal *judgments*, but not the causal *relation*.  
     *Soft Spot:* Risks conflating metaphysics with psychology.  

  7. **Causal-Models Relativist**  
     *Objection:* "Causal claims are relative to variable sets. 'The gardener’s omission caused death' is true in a model where gardener-action is a variable. Your 'poisedness' is just a constraint on variable choice—it doesn’t add ontology."  
     *Reply:* "Variable choice *presupposes* a causal structure. Poisedness explains why some variables (gardener-action) but not others (your-action) are *eligible* for inclusion: only mechanisms physically present can be variables."  
     *Concede:* Models are context-relative, but context is constrained by reality.  
     *Soft Spot:* If variable choice is purely pragmatic, poisedness is redundant.  

  8. **Grad Student (Truthmaker Zealot)**  
     *Objection:* "What’s the truthmaker for 'the mechanism was poised'? If it’s the hose being attached, that’s just a positive state. But then why isn’t *that state* the cause? You still need absences!"  
     *Reply:* "Truthmaker: the physical configuration of the mechanism (hose attached, water pressure, gardener’s location). This state *explains why the death process completed*, but it didn’t *cause* death—interference would have prevented it. Causation is the wilting process; poisedness is why prevention failed."  
     *Concede:* Talk of "prevention failing" is shorthand, not ontological commitment.  
     *Soft Spot:* "Failure" language may smuggle in absences.  

  ---

  ### **The Must-Land Reply**  
  **When confronting McGrath’s Dilemma (Horn 2: Omission Explosion):**  
  > *"Poisedness blocks the explosion because it requires a *local, assembled preventive mechanism*—not just any possible preventer. The gardener’s mechanism was *in situ*; mine wasn’t. Distant or unassembled preventers (me on another continent, a disconnected hose) aren’t poised. This is why common sense denies they ‘cause’ anything, even if counterfactuals hold."*  
  **→ If this fails**, the view collapses into contextualism. Hammer: Poisedness is about **physical proximity and readiness**, not mere possibility.

  ---

  ### **The Question You Hope Nobody Asks**  
  > **"How is 'poisedness' not just *causal potential*? And if it is, haven’t you eliminated omissions only by reintroducing dispositions—which are equally problematic for a process ontology?"**  
  *Why it’s lethal:* Forces you to either (a) admit poisedness is dispositional (undermining "occurrent process" claims), or (b) posit a dubious categorical property.  
  *Patchy Reply:* "Poisedness is the *actual energetic state* of a mechanism (e.g., water pressure in the hose), not mere potential. Potential is unmanifested; poisedness is manifested readiness. But yes, it walks a fine line."

  ---

  ### **Tactical Summary**  
  - **Concede early:** Norms influence judgments, borderlines need pragmatics, context sets mechanism scope.  
  - **Defend fiercely:** Poisedness as physical (not dispositional), and as blocking McGrath’s second horn.  
  - **Weakest flank:** Borderline cases (passerby) and "disguised contextualism" risk.  
  - **Win condition:** Sell poisedness as a *natural gateway for prevention*—not a cause, but why prevention was physically possible.  

  Good luck. If the process theorist scowls, offer coffee afterward. If the truthmaker grad student corner you, sigh and say "emergent properties."
