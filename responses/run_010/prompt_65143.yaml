  Looking at their seven rationales, I notice several patterns emerging. Rationale 1 rewards programs that make risky novel predictions. Rationale 2 shows they'll fund degenerating programs if no alternative exists, but at reduced levels. Rationale 3 suggests they value clear research heuristics even without track records. Rationale 4 indicates failed predictions aren't fatal if repairs add new content. Rationale 5 shows they'll fund rivals that absorb successes and generate new content. Rationale 6 reveals they'll terminate stagnant programs regardless of lack of refutation or rivals. Rationale 7 condemns post-hoc fitting even with accuracy.

  The tension between rationales 2 and 6 is particularly interesting - they funded a degenerating psychology program due to no alternative, but terminated a stagnant mechanics program despite no rival. This suggests their "no rival" consideration has boundaries - stagnation seems worse than active degeneration with anomalies.

  For the new case, the allostatic-load incumbent appears degenerative (post-hoc adjustments, modular belt) but recently made a novel prediction. The network-dynamics rival absorbed successes parsimoniously but had a failed prediction repaired with an untestable latent term. Applying their principles, the incumbent seems degenerating despite the new prediction (similar to case 7's condemnation of post-hoc fitting), while the rival shows promise but has testability issues (like case 4 required content beyond repair).

  I predict they'll fund the rival but not the incumbent, similar to case 5 where they transferred funding to a rival. The incumbent's new prediction feels like too little too late given its long degenerative history, while the rival's absorption of successes and potential to explain adjacent anomalies aligns with case 5's logic.

  The most useful missing fact would be whether the rival's latent coupling could be tested indirectly through its anomaly-explanations. If it could, this would strengthen the case for funding under their progressive principles. If completely untestable, it might warrant rejection like case 7.

