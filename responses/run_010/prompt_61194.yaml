  Below is a concise decision tree and taxonomy for determining "same mechanism" in model monitoring, designed to resolve disagreements by mapping concrete scenarios to philosophical positions. The tree uses 8 binary/multiple-choice questions based on real monitoring challenges, avoiding abstract terminology. Each question includes a scenario, answer options, and a scoring key that maps answer patterns to 8 named positions. For each position, I specify the detector criterion and its behavior on your cases (1)–(6). Finally, I note empty cells in the logical space and flag underspecified distinctions.

  ---

  ### **Decision Tree: "When Is It the Same Mechanism?"**  
  *Answer each scenario question below. Record answers to map to a position via the scoring key.*  

  1. **Weight Permutation**  
     *Weights change due to re-seeding, but model behavior is identical on all tests.*  
     - **A**: Flag as a mechanism change.  
     - **B**: Do not flag.  

  2. **Selectivity Broadening**  
     *A feature fires on new inputs (e.g., dogs not just cats), but task performance is unchanged.*  
     - **A**: Flag as a mechanism change.  
     - **B**: Do not flag.  

  3. **Downstream Rerouting**  
     *A circuit’s internal computation is identical, but its output is routed to a different head.*  
     - **A**: Flag as a mechanism change.  
     - **B**: Do not flag.  

  4. **Chain-of-Thought Shift**  
     *The model solves a task via generated text (CoT) instead of pure weights. Weights are unchanged.*  
     - **A**: Flag as a mechanism change.  
     - **B**: Do not flag.  
     - **C**: Flag only if CoT alters final output activations.  

  5. **Memorization Shift**  
     *The model uses memorization (not general algorithm) for in-distribution inputs, failing on OOD probes.*  
     - **A**: Flag as a mechanism change.  
     - **B**: Do not flag.  

  6. **Held-Out Divergence**  
     *Model is identical on eval set but diverges on held-out data. Weights are 97% similar.*  
     - **A**: Flag as a mechanism change.  
     - **B**: Do not flag.  

  7. **Continuous Drift**  
     *A circuit’s weights/activations drift over time (e.g., 50% cosine similarity drop), but behavior is stable.*  
     - **A**: Flag as a mechanism change.  
     - **B**: Do not flag.  

  8. **Minor Activation Shift**  
     *A feature’s activation similarity drops 10% with no behavior change.*  
     - **A**: Flag as a mechanism change.  
     - **B**: Do not flag.  
     - **C**: Flag only if similarity drops below a threshold (e.g., 15%).  

  ---

  ### **Scoring Key: Positions on Mechanism Identity**  
  *Match your answers to a position. For each, I describe the detector criterion and its response to cases (1)–(6).*  

  | Position                     | Answers Leading Here (Q1–Q8) | Detector Criterion                                                                 | Flags on Cases | Silent on Cases |  
  |------------------------------|-------------------------------|-----------------------------------------------------------------------------------|----------------|-----------------|  
  | **1. Strict Weight/Neuron Identity** | Mostly **A** (esp. Q1, Q5, Q6, Q7) | Flag if weights/neurons change beyond tight threshold (e.g., weight cosine < 0.99). | (1), (5), (6)  | (2), (3), (4)   |  
  | **2. Causal-Role Functionalism**    | Mostly **B** (esp. Q1, Q2, Q4-B, Q5-B) | Flag only if task performance changes on probe set.                                   | (5)*           | (1), (2), (3), (4), (6)* |  
  | **3. Interventionist**              | **A** on Q3, Q4, Q5; **B** elsewhere | Flag if ablating the circuit breaks different behaviors (on probe set).               | (3), (4), (5)  | (1), (2), (6)   |  
  | **4. Informational/Geometric**      | **A** on Q1, Q7, Q8-A; **B** on Q2, Q3 | Flag if feature directions change in shared basis (e.g., activation cosine < 0.9).    | (1), (7)       | (2), (3)        |  
  | **5. Historical/Lineage**           | **A** on Q1; **B** elsewhere  | Flag if circuit isn’t continuous descent from original (e.g., reset weights).         | (1)            | (2), (3), (4), (5), (6) |  
  | **6. Interest-Relative**            | Mixed/inconsistent answers    | Flag based on *which property* you monitor (e.g., brittleness → flag (5), (6); selectivity → flag (2)). | Varies by interest | Varies |  
  | **7. Deflationary (Behavior-Only)** | **B** on all except Q5-A, Q6-A | Flag only if probe-set behavior changes.                                              | (5)*           | (1), (2), (3), (4), (6)* |  
  | **8. Graded Identity**              | **C** on Q8; **B** on Q7      | Flag if similarity (weight/activation/ablation) drops below configurable threshold.   | Threshold-dependent (e.g., (1), (5) if threshold=0.95) | Threshold-dependent |  

  > **Notes on cases**:  
  > - *For (5)*: Causal-Role and Deflationary flag only if probe-set performance drops (may miss OOD failure).  
  > - *For (6)*: Most positions silent if eval set performance stable. Interventionist flags only if ablation profile changes on held-out data (rare).  

  ---

  ### **Empty Cells in the Logical Space**  
  Cells without coherent/unattractive positions:  
  - **Weight identity necessary but functional equivalence insufficient?**  
    - *Empty*: Incoherent. If weights define identity, functional change is irrelevant (redundant).  
  - **Functional equivalence necessary but weight identity insufficient?**  
    - *Empty*: Unattractive. Would flag harmless permutations (case 1), violating multiple realizability.  
  - **Historical identity without continuous descent?**  
    - *Empty*: Unexplored. Lineage typically implies continuity; discontinuous "descent" is oxymoronic.  

  ---

  ### **Underspecified Distinctions**  
  - **Causal-Role vs. Interventionist** collapse in practice:  
    They only cleanly separate in **case (3)**. Interventionist flags rerouting (ablation breaks new behaviors); Causal-Role stays silent if task performance unchanged. In cases (1, 2, 4–6), they behave identically.  
  - **Graded vs. Interest-Relative** overlap:  
    Graded thresholds often encode interests (e.g., "brittleness threshold"). The tree separates them by Graded’s quantitative focus (Q8-C) vs. Interest-Relative’s qualitative flexibility.  

  ---

  ### **How to Use This Handout**  
  1. Have stakeholders answer the 8 questions individually.  
  2. Use the scoring key to map answers to a position.  
  3. For each position, review:  
     - The detector criterion (adjust your harness accordingly).  
     - Which cases it flags (e.g., **Interventionist** catches memorization (5) but not held-out divergence (6)).  
  4. Discuss underspecified distinctions (e.g., Causal-Role vs. Interventionist) to align on priorities.  

  This resolves debates by forcing concrete choices: *Should we flag re-seeding (Q1)?* **Yes** → Strict Weight; **No** → most others. By anchoring in your cases, it ensures the taxonomy drives detector design, not metaphysics.
