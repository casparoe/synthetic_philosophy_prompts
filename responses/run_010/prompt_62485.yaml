  ### Thought Experiment: Fundraising Allocation for a Charity

  A charity must allocate a fixed fundraising budget of $100,000 among ten donor-acquisition channels (A–J) to maximize expected donations. Each channel's true donation yield (dollars per dollar spent) is unknown but drawn from identical independent normal distributions with a mean of 1.0 (a 100% return) and a standard deviation of 0.3. The charity has unbiased historical data: a single year of observed yields for each channel (e.g., A: 1.4, B: 1.2, C: 0.9, D: 1.1, E: 1.3, F: 0.8, G: 1.0, H: 1.5, I: 0.7, J: 1.1). Both agents know the distribution (mean = 1.0, SD = 0.3) and that further data is uninformative. The **maximizer** computes the expected yield for each channel as the historical sample mean (since it uses all evidence and the prior mean is known, but it treats sample means as point estimates without accounting for selection bias). It allocates the entire budget to the channel with the highest sample mean (e.g., H: 1.5). The **satisficer** uses a fixed aspiration level of 1.05 (historically set for unrelated reasons) and accepts the first allocation meeting it. It starts with an equal split ($10,000 per channel), computes the average sample yield as (1.4 + 1.2 + ... + 1.1)/10 = 1.1, which exceeds 1.05, and stops there. In reality, true yields regress toward the mean (e.g., H yields 1.1, while others vary around 1.0). The maximizer’s choice yields $110,000 (100,000 × 1.1), while the satisficer’s equal split yields $105,000 (10,000 × [1.1 + 1.0 + ... + 1.0] = 10,000 × 10.5). Crucially, over repeated cycles (new true yields and samples each year), the satisficer averages a 105% return, while the maximizer averages 103% due to consistent overestimation of the highest-yield channel.

  ---

  ### Worked Solution
  **Agents’ Computations and Actions:**
  - **Maximizer**:  
    - Computes expected yield for each channel as its sample mean (e.g., H: 1.5).  
    - Maximizes expected utility by allocating 100% to the highest sample mean (H).  
    - **Failure point**: It ignores that the highest sample mean is likely inflated by noise (selection bias). The sample mean is an unbiased estimate *for a single channel*, but the *maximum* of many sample means overestimates the true maximum due to noise.  
  - **Satisficer**:  
    - Starts with equal split ($10,000 per channel).  
    - Computes the average sample yield (1.1) and compares it to the aspiration level (1.05).  
    - Since 1.1 > 1.05, it accepts the equal split without considering other allocations.  

  **Key Feature Enabling Satisficer’s Advantage**:  
  The ratio of **noise magnitude** (SD = 0.3) to the **number of channels** (10) is critical. High noise amplifies overfitting in the maximizer, while many channels increase the probability that the top sample is a noisy outlier. The satisficer’s equal split avoids selection bias by diversifying across all channels, diluting the impact of noise.  

  **Checks: What If the Feature Is Removed?**  
  - **Precise estimates (SD = 0)**:  
    True yields match sample means. The maximizer correctly allocates to the best channel (yield = 1.5), dominating the satisficer’s average yield (1.1). Satisficer’s advantage vanishes.  
  - **Few channels (e.g., two)**:  
    With fewer channels, selection bias is minimal. The maximizer averages a 102% return vs. the satisficer’s 101% (due to equal splitting). Satisficer’s advantage disappears.  
  - **Stationary environment with large historical sample**:  
    A large sample (e.g., 100 years) reduces noise in estimates. The maximizer’s chosen yield approaches the true maximum (1.0), while the satisficer averages 1.0. No advantage.  
  **Collapse to search-cost story**: When estimates are precise or channels are few, the case collapses to standard search-cost explanations (maximizing is feasible). The *only* surviving advantage is diversification against overfitting in high-noise, high-channel-count settings.  

  **Satisficer’s Victory: Doing Something Right or Less Wrong?**  
  The satisficer wins because it **does something less wrong**. The maximizer’s failure is overfitting to noisy data, while the satisficer’s rigid rule accidentally avoids this pitfall by diversifying. It is not "right" in an absolute sense (equal splitting is suboptimal if true yields are known) but less wrong under extreme uncertainty.

  ---

  ### Objection: Proper Uncertainty Representation
  **Objection**: A sophisticated maximizer would account for uncertainty by shrinking estimates toward the prior (e.g., Bayesian updating) or using robust optimization. For example, it might allocate to multiple channels to hedge against overfitting, mimicking diversification.  

  **Reply and Concession**:  
  - This objection **defeats the case**. A Bayesian maximizer would compute each channel’s posterior mean by shrinking the sample mean toward the prior mean (1.0). For sample mean \(x_i\), prior mean \(\mu = 1.0\), prior variance \(\tau^2 = 0.09\), and noise variance \(\sigma^2 = 0.09\), the posterior mean is:  
    \[
    \text{Posterior mean} = \frac{\mu / \tau^2 + x_i / \sigma^2}{1 / \tau^2 + 1 / \sigma^2} = \frac{1.0 / 0.09 + x_i / 0.09}{1 / 0.09 + 1 / 0.09} = \frac{1.0 + x_i}{2}.
    \]  
    For channel H (\(x_i = 1.5\)), the posterior mean is 1.25. After shrinking, no channel exceeds 1.25, and the maximizer might diversify. In fact, with sufficient shrinking, it converges to equal splitting.  
  - **What Concedes**: The satisficer’s advantage vanishes if the maximizer uses proper statistical corrections. The aspiration-level rule is a **crude stand-in for Bayesian shrinkage**, not a uniquely rational strategy.  
  - **Residue of Advantage**: None remains. Under full rationality, maximizing with uncertainty representation absorbs the satisficer’s benefit.  

  ---

  ### Conclusion on Bounded Rationality
  **Normative Claim**: This case **fails to support** Simon’s stronger claim that satisficing is normatively superior to maximizing. The satisficer’s advantage arises only under specific conditions (high noise, many channels) and evaporates when the maximizer accounts for uncertainty. It remains a descriptive strategy for resource-limited agents, not a standalone normative alternative.  

  **Dependence on Details**:  
  - The advantage relies on the **noise-to-channels ratio** (structural) but requires numerical calibration (e.g., SD = 0.3, 10 channels).  
  - It collapses if the maximizer uses optimal statistical methods (non-structural limitation).  

  **Final Verdict**: Satisficing "wins" here by exploiting the maximizer’s under-specified reasoning, not by inherent virtue. The thought experiment reinforces that proper uncertainty management, not satisficing, is the normative ideal. Simon’s thesis holds as a pragmatic description of human behavior but not as a prescriptive alternative to optimized decision-making.
