prompt: |-
  ok, recurring argument with a friend from my LW-adjacent policy reading group and he's got a move I can't defuse.

  He says: banning the purchase of sex to protect sex workers is exactly like banning sweatshop jobs to protect garment workers — the workers took the job because it beat their alternatives, so removing it hurts the very people you meant to help, and the right move is full decriminalization on the New Zealand model. He also says the asymmetry doesn't rescue the Nordic model: charging only the buyer is still "taking the job away," just by a longer route. And he thinks the German/Dutch legalization route is worse again, because it makes the state a partner in the market instead of shrinking it. I keep getting the sense that the analogy is carrying his whole conclusion, but last time I said so in the thread I got accused of special pleading and honestly I couldn't point at the exact joint where it snaps.

  Can you audit it for me? what maps onto what (garment worker, factory owner, the ban, the alternatives, whatever else you think has a counterpart), which disanalogies are load-bearing for his conclusion versus which ones would just be me scoring points, what the analogy quietly assumes about the workers' choice set, and whether "decriminalize like NZ" still follows once you pull that out. if you think the Nordic-model side has a better analogy for what an asymetric demand ban is actually doing, name it.

  Format: exactly five numbered points, one or two sentences each, no intro, no wrap-up paragraph. slots — (1) the mapping, (2) the single disanalogy that actually breaks his inference, (3) two disanalogies that sound devastating in a thread but don't matter, (4) what the analogy smuggles in, (5) whether the NZ conclusion survives, plus the other side's better analogy if there is one.
reasoning: |-
  Hmm, the user is describing a recurring argument with a friend about banning sex work purchases versus sweatshop jobs. The friend uses an analogy: banning sex work purchases harms sex workers just like banning sweatshop jobs harms garment workers, since both workers choose these jobs as their best available option. The friend argues for full decriminalization like New Zealand's model, rejecting the Nordic model where only buyers are charged and criticizing German/Dutch legalization for state involvement. The user feels the analogy is flawed but can't pinpoint why and got accused of special pleading. They want me to audit the analogy in a specific five-point format.

  I need to analyze the mapping between the two scenarios. In the friend's analogy, sex workers map to garment workers, sex buyers map to factory owners or employers, the ban on purchasing sex maps to banning sweatshop jobs, and the alternatives for workers are similar. Both involve removing an option that workers prefer over worse alternatives.

  The key disanalogy that breaks the inference is about the nature of the transaction. Sweatshop jobs are typically long-term employment relationships where the employer provides a workplace and ongoing pay. Sex work transactions are often one-off exchanges where the buyer consumes a service. Banning sweatshop jobs eliminates the entire employment structure, but banning sex purchases targets the demand side without necessarily eliminating the worker's ability to sell services if decriminalized for sellers. This is crucial because the Nordic model decriminalizes sellers while criminalizing buyers, so it doesn't "take the job away" in the same direct way as banning a factory job would.

  For disanalogies that sound devastating but don't matter, I can point to two: First, the physical conditions - sweatshops involve hazardous environments while sex work involves bodily risks, but both are harmful in different ways, so this doesn't undermine the core choice argument. Second, the international dimension - sweatshops are often in global supply chains affecting trade, while sex work is usually local, but this is irrelevant to the individual worker's choice calculus.

  The analogy smuggles in an assumption that workers have identical choice sets. But for sex workers, alternatives might be more constrained by stigma, trafficking risks, or lack of other options due to discrimination, making the "best alternative" potentially less voluntary than in labor markets. This affects the voluntariness premise.

  Regarding whether the NZ conclusion survives, once we recognize that the Nordic model doesn't remove the job but regulates demand differently, and considering the unique vulnerabilities in sex work, full decriminalization like NZ isn't the only logical conclusion. The better analogy for the asymmetric ban might be like banning the purchase of stolen goods to deter theft without punishing the victims - targeting demand to reduce harm while keeping sellers legal.
answer: |-
  (1) Sex workers map to garment workers, sex buyers to factory owners, the purchase ban to banning sweatshop employment, and the "best alternative" justification is identical in both cases.

  (2) A sweatshop ban destroys the *entire employment relationship* (worker *and* owner activity), while the Nordic model explicitly *decriminalizes the worker* (seller) and only bans the *demand-side transaction* (purchase), leaving the worker legally able to offer services.

  (3) Disanalogies that don't break the core argument: differing physical harms inherent in the work (factory toxins vs. bodily risks) and international supply chain effects (sweatshops often export-focused, sex work largely domestic/local consumption).

  (4) The analogy smuggles in the assumption that the worker's choice set and agency are identical across contexts, ignoring sex work's unique vulnerabilities like trafficking, severe stigma limiting alternatives, and higher direct physical threat from buyers/clients.

  (5) The NZ conclusion doesn't necessarily follow; the Nordic model's asymmetric ban is better analogized to banning the *purchase* of illegally harvested organs to deter trafficking while protecting desperate sellers from prosecution, reducing harm without removing seller legal agency.
