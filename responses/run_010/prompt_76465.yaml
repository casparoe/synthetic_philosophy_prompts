  A friend taught me Nomic, the game in which amending the rules is itself a legal move, and from there I fell into the argument about whether a rule that authorizes its own amendment can validly do so at the top of a system — the puzzle Alf Ross raised in 1969 and Peter Suber later worked out at book length. Rereading Catch-22 in that light, I keep thinking the novel is about a legal order with no settled rule of change at all: Catch-22 is never written down and its content shifts every time it is invoked, Doc Daneeka is officially dead while standing there alive and protesting, Major Major is promoted to major by a punch-card machine, and Milo's syndicate contracts with the enemy to bomb its own squadron and the contract is honored.

  I would like a reading of the novel through the self-amendment problem rather than through circular reasoning in general. Is Catch-22 a rule of change, or is it something with no criteria of validity at all — and if the latter, is Ross's paradox simply the wrong frame, and what is the right one? Do the episodes above turn on the law's capacity to remake itself, or only on the fact that nobody can check what it currently says? And where does the novel resist this reading: one of your points should say plainly where I am forcing it. Finish by saying what the novel shows about a self-amending system that the abstract argument cannot show. Please do not quote the book — I am working from memory too — and skip any plot summary. Give me exactly five numbered points, each a sentence or two, with no introduction or conclusion.
