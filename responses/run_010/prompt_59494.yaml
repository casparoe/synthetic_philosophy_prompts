answer: |-
  Here's your targeted Q&A prep sheet, ordered by likelihood/consequence of interruption. Reply structures assume you're reinforcing core principles, not winning debates.

  ---

  **Prep Sheet: Directed Levy Q&A**  
  *Core Defense Theme: "This isn't neutrality as perfection—it's neutrality as damage control."*

  1. **Objection (US Litigator #1):** "Your levy is state-compelled support for religion. Directing taxes to churches violates the Establishment Clause per *Town of Greece* and *Arizona Christian School Tuition Org*. The state can't force me to fund a mosque any more than it can force prayer."  
     *Reply (2-min):* "The levy isn't funding doctrine—it's funding civic participation. Every eligible group must provide audited public services (soup kitchens, counseling) to receive funds, turning tithes into social infrastructure. The state isn't endorsing theology; it's outsourcing welfare via viewpoint-blind rules. SCOTUS already greenlit indirect funding in *Espinoza*."  
     *Soft Spot:* "Public services" criterion may exclude contemplative orders/pagan groups.  

  2. **Objection (Economist):** "You're crowding out organic giving. If $1K of my taxes goes to St. Mary's, I'll deduct $1K from my donation plate—net zero for churches, wasted admin cost."  
     *Reply (2-min):* "Data from Italy and Spain shows *supplemental* effects: state funds build new clinics, freeing parish donations for sacraments. This isn't substitution—it's portfolio diversification. Poorer communities gain most; your scenario assumes fixed giving budgets, but visibility boosts engagement."  
     *Soft Spot:* Assumes European data translates to hyper-individualist/US contexts.  

  3. **Objection (Canon Lawyer):** "You'll turn churches into state contractors. Accepting funds means submitting to audits, anti-discrimination rules, maybe LGBTQ+ hiring mandates. That’s the gilded cage—we trade autonomy for survival."  
     *Reply (2-min):* "Groups *opt in* knowing the strings: accept public accountability or rely on voluntary giving. The cage door is open. Italy's Catholic Church took the otto per mille and still opposes abortion funding. This funds *activity*, not belief—if your soup kitchen serves all, you keep autonomy."  
     *Soft Spot:* "Activity vs. belief" distinction collapses if state defines "eligible services."  

  4. **Objection (French Scholar):** "Laïcité means the state *ignores* conviction, not codifies it! Your 'eligible communities' list creates state-approved heresy. Who defines 'conviction'? A committee? This is Protestant ecclesiology as public policy."  
     *Reply (2-min):* "The state already defines 'religion' for tax exemptions and chaplaincies. We use existing recognition frameworks (e.g., 501(c)(3) status) with added service requirements. Neutrality isn't blindness—it's refusing to privilege *how* groups organize. France's own *cultes reconnus*—"  
     *Soft Spot:* Using 501(c)(3) inherits all its biases (e.g., against amorphous/non-hierarchical groups).  

  5. **Objection (German Expert):** "This is Kirchensteuer with extra steps! We force registrations, you force designations. Both alienate the unaffiliated. Why not learn from our 30% exit rate?"  
     *Reply (2-min):* "Critical difference: no formal affiliation. You choose anew each year—no membership, no exit paperwork. The lottery default prevents the Kirchensteuer's core flaw: punishing silence. This is *lighter* touch."  
     *Soft Spot:* Annual choice = high admin burden vs. Germany's one-time registration.  

  6. **Objection (Sociologist):** "No 'none' option is coercive. Unaffiliated taxpayers must fund groups they reject. You're forcing the 'nones' to validate institutional religion!"  
     *Reply (2-min):* "The civic-commons option *is* their outlet—funding secular social services. No 'none' box prevents creating a state-categorized anti-blob. Forcing designations spreads funds widely; Italy's silence subsidy lets Catholics dominate without consent."  
     *Soft Spot:* Atheists funding "secular humanists" may still feel coerced into supporting *an* ideology.  

  7. **Objection (US Litigator #2):** "Compelled expression! Forcing me to *choose* a group is government-mandated identity disclosure. *Wooley v. Maynard* says the state can't make me advertise my beliefs."  
     *Reply (2-min):* "The choice is private—like charitable deductions. No public disclosure, no endorsement. You're allocating taxes, not professing faith. The civic-commons option is belief-agnostic."  
     *Soft Spot:* IRS audits could expose choices; perception of compulsion remains.  

  8. **Objection (Grad Student):** "The lottery default rewards size. A tiny pagan church has equal odds to Catholics per citizen? That's mathematically neutral but practically absurd."  
     *Reply (2-min):* "Precisely! Survival shouldn't depend on administrative hustle. The megachurch and the coven have equal per-capita shots at uncapped funds. Italy's system rewards bureaucracy; this rewards community presence."  
     *Soft Spot:* Randomness may defund critical mass for minority groups (e.g., needing $50K for a shelter roof).

  ---

  **Preemptive Concessions (Slide 10):**  
  1. *Eligibility Criteria:* "Our recipient rules *are* messy—they inherit all the biases of existing charity law. Perfect neutrality is impossible; we mitigate with low barriers and service mandates."  
  2. *Establishment Clause:* "Yes, SCOTUS may kill this. But if *Espinoza* allows scholarships to religious schools, why not direct social spending?"

  ---

  **The Nightmare Question:**  
  **"What stops a hostile government from manipulating eligibility to defund disfavored groups? (e.g., requiring 'pro-democracy pledges' for mosques or banning 'extremist' charities)."**  
  *Why it’s worse than the Islam question:* It exposes how your "neutral machinery" relies on state goodwill—the French scholar will pounce, litigators will note *Lukumi Babalu*, and the sociologist will cite minority repression. Your reply ("Independent commission! Sunset clauses!") sounds naïve amid global democratic backsliding.

  ---

  **Verdict: #5 - Lottery administration invites endless litigation.**
