answer: |-
  ## The Ledger's Arithmetic

  Vessa woke to the drip. Not the cheerful thaw-drip of eaves, but the hollow, terminal drip from dry fountains. Frost still etched the windowpanes, but the high country snows were retreating, the glacial meltwater Vessa’s lifeblood was thinning. In six weeks, the Office of the Ledger must choose: the shorter, cheaper Long Bar aqueduct cut, promising water within a year, or the longer Greywater cut, condemning the lower terraces to two parched winters. The choice hung, as it always did, on a map. This season, two maps stood before the Office: Anselm Ferrand’s, the Office’s own meticulous surveyor, and Dace Iles’s, drafted for the Water Company. Both claimed truth; both were known liars.

  Ferrand insisted the vital water-bearing stratum lay shallow beneath Long Bar, making the short cut feasible. Iles placed it deep, demanding the longer detour to Greywater Flat. Each map held one recorded contradiction elsewhere: Ferrand misplaced a crucial spring in the Ashen Steps, a repair party confirmed it wasn't where he marked it. Iles, conversely, had the course of the Salt Road wrong near the Kilnfield; drovers swore to the error. Neither man was incompetent nor deceitful; the high country was vast, treacherous, and largely unseen since the Founders walked it 140 years prior. Knowledge came in fragments – a drover’s sworn affidavit about a rockfall on the Nine Terraces, a prospector’s sketch of a new fissure in the Threshing Plain. These fragments were entered, like mosaic tiles, into the great books of the Office, weighed against the competing maps.

  The reckoning was governed by Article Nine. It demanded that for a map to be certified, it must possess at least one claim uniquely borne out by inspection that its rival *didn’t* make, and crucially, possess *no* point where the rival made a unique claim later proven true. And this had to hold not just under the Founders’ broad divisions – the Kilnfield, the Ashen Steps, the Nine Terraces, etc. – but under *any* conceivable finer partition of the high country into named districts.

  Odile Renn, junior reckoner, ink-stained and perpetually cold, traced the entries. The urgency was a physical weight. She’d been cross-referencing the latest drover report (a minor path deviation near the Kilnfield boundary, supporting Ferrand) when her stylus paused. An itch of unease. She pulled the master ledger for the Ferrand-Iles adjudication. Under the *coarse* Founders’ divisions:

  **District: Long Bar**
  *   **Ferrand Claims:** Water stratum shallow (depth X). *Iles Contradicts.*
  *   **Iles Claims:** Water stratum deep (depth Y). *Ferrand Contradicts.*
  *   *Inspection Pending.*

  **District: Ashen Steps**
  *   **Ferrand Claims:** Spring at Grid Ref. A7. *Iles silent.*
  *   **Iles Claims:** *None unique.*
  *   **Inspection Bore Out:** Spring absent at A7. *Contradiction against Ferrand recorded.*
  *   *Therefore, Column 1 (Ferrand unique & true): 0. Column 2 (Iles unique & true): 0.*

  **District: Salt Road**
  *   **Ferrand Claims:** *None unique.*
  *   **Iles Claims:** Course bends west at Marker 12. *Ferrand silent.*
  *   **Inspection Bore Out:** Course bends east at Marker 12. *Contradiction against Iles recorded.*
  *   *Therefore, Column 1 (Ferrand): 0. Column 2 (Iles): 0.*

  **Other Districts:** No unique claims or contradictions relevant to this rivalry.

  *Summary under Coarse Division:*
  *   *Column 1 (Ferrand unique & true): 0*
  *   *Column 2 (Iles unique & true): 0*
  *   *Result: Neither satisfies Article 9. Both have known errors elsewhere (Ashen Steps for Ferrand, Salt Road for Iles). Certification impossible? Yet certification MUST happen.*

  This was the impasse everyone saw. Both maps flawed. No obvious superiority. The Office, Odile knew, would default to the coarse division and find a technicality, or lean on Ferrand’s institutional standing. But Article Nine demanded it hold under *any* division. Odile’s unease focused on Long Bar. What if it wasn’t one district? She sharpened her stylus, dipped it, and carefully, almost fearfully, drew a line across the ledger page for Long Bar, splitting it into two new, hypothetical districts: **Long Bar North** and **Long Bar South**.

  She re-entered the claims, knowing Ferrand placed the shallow stratum across the whole Bar, Iles the deep stratum everywhere. But by splitting it:

  **District: Long Bar North**
  *   **Ferrand Claims:** Stratum shallow. *Iles Contradicts (says deep).*
  *   **Iles Claims:** Stratum deep. *Ferrand Contradicts (says shallow).*
  *   *Inspection Pending.*

  **District: Long Bar South**
  *   *Identical entries to Long Bar North.*
  *   *Inspection Pending.*

  No change there. But then, the Ashen Steps. Ferrand’s error. The spring he misplaced was vaguely in the *northwest* quadrant. Odile drew another line, splitting the vast Ashen Steps into **Ashen Steps Northwest** and **Ashen Steps Remainder**.

  **District: Ashen Steps Northwest**
  *   **Ferrand Claims:** Spring at Grid Ref. A7 (within NW). *Iles silent.*
  *   **Iles Claims:** *None unique.*
  *   **Inspection Bore Out:** Spring absent at A7. *Contradiction against Ferrand recorded.*
  *   *Therefore, Column 1 (Ferrand unique & true): 0. Column 2 (Iles unique & true): 0.*

  **District: Ashen Steps Remainder**
  *   **Ferrand Claims:** *None unique to this sub-district.*
  *   **Iles Claims:** *None unique to this sub-district.*
  *   *Therefore, Columns: 0, 0.*

  Still no advantage. Then Odile looked at Iles’s error on the Salt Road. The mistaken bend was near the Kilnfield boundary, say, the *eastern* stretch. She split the Salt Road into **Salt Road East** and **Salt Road West**.

  **District: Salt Road East**
  *   **Ferrand Claims:** *None unique.*
  *   **Iles Claims:** Course bends west at Marker 12 (within East). *Ferrand silent.*
  *   **Inspection Bore Out:** Course bends east at Marker 12. *Contradiction against Iles recorded.*
  *   *Therefore, Column 1 (Ferrand): 0. Column 2 (Iles): 0.*

  **District: Salt Road West**
  *   **Ferrand Claims:** *None unique to this sub-district.*
  *   **Iles Claims:** *None unique to this sub-district.*
  *   *Therefore, Columns: 0, 0.*

  Odile sat back. Nothing changed. Both maps still showed their single known error, and no unique truth. The arithmetic seemed immutable. Then it struck her. The *silence*. Under the coarse division, when Ferrand was wrong in the Ashen Steps, his error infected the *whole* district, negating any potential unique truth he might have claimed elsewhere within it. But by splitting the Ashen Steps, isolating his error solely to the Northwest quadrant, what about the Remainder? Ferrand hadn't made any *unique* claim about the Remainder that Iles contradicted... but what if he *had*? What if, elsewhere, Ferrand had a unique truth currently buried within a coarse district?

  She flipped pages feverishly. There! The Threshing Plain. Ferrand’s map noted a stable, iron-rich outcrop at Grid Ref. C3, vital for anchor points. Iles’s map was silent on it. A repair party last season had verified its presence and stability. Under the coarse division of the Threshing Plain:

  **District: Threshing Plain (Coarse)**
  *   **Ferrand Claims:** Iron outcrop at C3. *Iles silent.*
  *   **Iles Claims:** *None unique.*
  *   **Inspection Bore Out:** Outcrop present & stable. *Therefore, Column 1 (Ferrand unique & true): 1.*
  *   *But... Ferrand also has his error in Ashen Steps (another district). Article Nine requires NO entries in Column 2 (rival unique truths), which Ferrand has (0), but it also requires the Column 1 entry to exist, which it does (1). However... the Ashen Steps error is a separate district contradiction. Does Article Nine require a clean slate globally? The Office interpreted it per district under a division, but the *known errors* were global blots.*

  Odile’s hands trembled. She split the Threshing Plain around C3: **Threshing Plain (C3 Vicinity)** and **Threshing Plain Remainder**.

  **District: Threshing Plain (C3 Vicinity)**
  *   **Ferrand Claims:** Iron outcrop at C3. *Iles silent.*
  *   **Iles Claims:** *None unique.*
  *   **Inspection Bore Out:** True. *Column 1 (Ferrand): 1. Column 2 (Iles): 0.*

  **District: Threshing Plain Remainder**
  *   *No unique claims or contradictions.*

  Now, crucially, she applied the *same* fine division to the Ashen Steps, isolating Ferrand's error solely to **Ashen Steps Northwest**:

  **District: Ashen Steps Northwest**
  *   **Ferrand Claims:** Spring at A7. *Iles silent.*
  *   **Iles Claims:** *None unique.*
  *   **Inspection Bore Out:** Spring absent. *Contradiction recorded. BUT... this is a contradiction against Ferrand's claim *within this district*. It *doesn't* negate his unique truth in the Threshing Plain (C3 Vicinity).*
  *   *Column 1: 0 (no unique Ferrand truth *here*). Column 2: 0.*

  **District: Ashen Steps Remainder**
  *   *No unique claims.*

  Under *this specific fine division*:
  *   **Ferrand:** Column 1 (unique truths): 1 (Threshing Plain C3). Column 2 (Iles unique truths borne out): 0.
  *   **Iles:** Column 1: 0. Column 2: 0.

  Ferrand satisfied Article Nine! He had a unique, verified truth, and no district where Iles had a unique, verified truth under *this* division.

  Odile felt cold. She turned to Iles’s map. His Salt Road error was confined to **Salt Road East** by her earlier split. What unique truth did *he* have? The Nine Terraces. Iles noted a particularly resilient lichen type on the Third Terrace, crucial for predicting erosion. Ferrand was silent. Inspectors confirmed it. Under coarse division, it counted. Under fine? She split the Nine Terraces: **Nine Terraces (Third)** and **Nine Terraces Remainder**.

  **District: Nine Terraces (Third)**
  *   **Iles Claims:** Resistant Lichen Type Gamma. *Ferrand silent.*
  *   **Ferrand Claims:** *None unique.*
  *   **Inspection Bore Out:** True. *Therefore, for ILES: Column 1 (his unique truth): 1. Column 2 (Ferrand unique truth): 0.*
  *   *(In Ferrand's ledger under this district: Column 1: 0, Column 2: 1 (Iles's truth))*

  **District: Nine Terraces Remainder**
  *   *No unique claims.*

  Confining Iles’s Salt Road error solely to **Salt Road East**:

  **District: Salt Road East**
  *   **Iles Claims:** Bend west at Marker 12. *Ferrand silent.*
  *   **Ferrand Claims:** *None unique.*
  *   **Inspection Bore Out:** Bend east. *Contradiction recorded against Iles. Doesn't negate his lichen find.*
  *   *For Iles: Column 1: 0 (here). Column 2: 0.*

  **District: Salt Road West**
  *   *No issues.*

  Under *this specific fine division*:
  *   **Iles:** Column 1 (unique truths): 1 (Nine Terraces Third). Column 2 (Ferrand unique truths borne out): 0.
  *   **Ferrand:** Column 1: 0. Column 2: 1 (Iles's truth in Nine Terrares Third).

  Iles now satisfied Article Nine!

  Odile stared at the ledger. By choosing *how finely* to divide the country – isolating errors and truths into separate, tiny districts – she could make *either* map satisfy the strict letter of Article Nine. Ferrand, by isolating his Threshing Plain truth and his Ashen Steps error. Iles, by isolating his Nine Terraces truth and his Salt Road error. The Long Bar disagreement remained unresolved, pending inspection that wouldn't come in time. The absolute requirement of Article Nine – non-empty Column 1, empty Column 2, under *every* admissible division – was impossible. Any fine division that isolated their respective truths and errors could satisfy it for one, but a different fine division could satisfy it for the other. And crucially, a division fine enough to isolate *both* errors and *all* potential unique truths simultaneously would show *both* columns potentially non-zero for both maps, depending on which unique truths existed elsewhere. The foundational rule was a sieve.

  She took her findings to Chief Reckoner Hale. He was old, his face a map of Vessa’s own worries. He listened without interruption as she explained, pointing to the ledger entries, the splits she’d made. She showed him how Ferrand could be made to satisfy Article Nine under one division, Iles under another. She didn’t mention the impossibility of satisfying it universally; she just laid out the arithmetic of the splits.

  Hale sighed, a sound like stone grinding on stone. He didn’t look surprised. He looked tired. “Ah, Renn. The divisions.” He rubbed his temples. “The Founders… they saw a landscape. We see fragments. The ledger demands absolutes the land refuses to give.” He pointed a gnarled finger at the names on the wall – years of drought and near-starvation. “Thirteen years back. The Greywater maps. Both flawed. We used the coarse division. Certified Ferrand’s predecessor. The cut was made. It held. If we’d followed Article Nine to the letter… waited for a perfect map…” He shook his head. “There’d be no lower terraces now. Just dust and bones.” He looked at her, not with anger, but with the bleak recognition of a shared burden. “The ledger is our tool, Renn. Not our master. Sometimes… the arithmetic needs… interpretation. For the city.”

  He left her with the weight of it. The thaw-clock ticked. The Long Bar cut offered salvation for the lower terraces within a year, but only if Iles was wrong and Ferrand right about the stratum. The Greywater cut was safe but would bleed the terraces dry for two winters. Hale’s unspoken directive was clear: use the coarse division. Find a way. Certify Ferrand. Hope the stratum is shallow. Save the city *now*.

  Odile returned to her desk. The great ledger lay open, the phantom districts of Long Bar North and South, Ashen Steps Northwest and Remainder, Threshing Plain C3 and Remainder, Nine Terraces Third and Remainder, Salt Road East and West, blurring before her eyes. Each split was admissible. Each changed the story the maps told about themselves. Ferrand *was* wrong in the Ashen Steps. Iles *was* wrong on the Salt Road. Ferrand *did* know about the iron outcrop. Iles *did* know about the lichen. Both truths mattered. Both errors mattered. Which map held the truth about Long Bar? Which could be trusted with the city’s thirst? The ledger, under its own strict rules, offered no answer, only the illusion of one depending on how you sliced the land.

  She dipped her stylus. The inkwell was low. Outside, the hollow drip continued. She had to enter the latest drover report – the minor path in the Kilnfield supporting Ferrand. Under the coarse division, it would add a tiny weight to his side. Under a fine division isolating that path? It might become a unique truth. Or it might be irrelevant.

  Odile Renn hovered the stylus over the Kilnfield entry. She thought of Hale’s weary pragmatism, the dust and bones of the lower terraces. She thought of the ledger’s beautiful, brittle arithmetic, shattered by the simple act of drawing a line on a page. She thought of water, and the deep, hidden rock beneath Long Bar.

  Slowly, deliberately, she began to write. Not in the main ledger, but on a fresh scrap of vellum. She drew the Founders’ coarse divisions: Kilnfield, Ashen Steps, Nine Terraces, Salt Road, Greywater Flat, Threshing Plain, Long Bar. Beneath them, she listed the latest verified entries. She ignored the phantom splits. She tallied the columns under the only division Vessa had ever truly known. The stylus moved, recording the drover’s path, adding a single, solitary point to Ferrand’s Column One. For now, it was the only arithmetic the city could afford. She would enter it into the official book before dusk. But the scrap of vellum, marked with the coarse, familiar shapes, she folded and tucked deep inside her tunic, against her skin. It felt like a secret, and like a lie.
