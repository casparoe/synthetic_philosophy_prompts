prompt: |-
  I work in macroeconomics: I build, estimate, and defend medium-scale general equilibrium models, and my professional life is spent in the space between household-level behavior and aggregate time series. I am fluent in that vocabulary — aggregation and its failures, representative agents versus heterogeneous-agent models, structural versus reduced-form parameters, the Lucas critique, identification, steady states and linearization around them, policy invariance — and I have no real training in philosophy of science, though I know the standard labels and have read enough around the edges to suspect that a certain philosophical dispute is my own methodological quarrel with the names changed.

  The task is to test that suspicion by translation. Take the four positions below and restate each of them, as faithfully as you can, in the vocabulary I actually use:

  1. The classical account of theory reduction as derivability (Nagel): the higher-level theory is recovered from the lower-level one by way of bridge laws linking the two vocabularies, and reduction succeeds when the derivation goes through.
  2. The multiple-realizability argument for the autonomy of the higher-level sciences (Fodor): the same higher-level property is realized by indefinitely many distinct lower-level configurations, so no manageable bridge law exists, and the higher-level generalizations earn their keep regardless.
  3. The causal-exclusion argument against non-reductive physicalism (Kim): if the physical level is causally closed and every physical effect has a sufficient physical cause, then a higher-level property either is that lower-level cause or does no causal work at all.
  4. The asymptotic or singular-limit conception of emergence (Batterman): certain macroscopic regularities are not obtainable from the microscopic theory at any finite order, arise only in a limiting regime, and are conspicuously insensitive to microscopic details across systems that share the limit.

  For each of the four, keep three things strictly separate: what translates cleanly into my modeling practice, with the corresponding economic notion named; what translates only if you let either the philosophy or the economics bend out of shape to make the fit; and what has no expression at all in my vocabulary, where the philosopher is doing something my language cannot do.

  Then give me the residue report and take a position on it. In particular:

  - Use the Sonnenschein–Mantel–Debreu result as your first test case. Aggregate excess demand inherits only continuity, homogeneity of degree zero, and Walras's law from individual optimization, so the aggregate behavior of an economy of utility maximizers is nearly unrestricted. Is that a genuine economic instance of multiple realizability, or does it fail to be one because the aggregate still supervenes on, and is fixed by, the micro parameters together with the distribution of endowments? Make the difference between those two readings precise, and tell me whether supervenience is doing any work here that "determined by the deep parameters" is not already doing.
  - Use the representative agent as your second test case. There is a well-known construction in which the representative agent's preferences conflict with those of every individual household in the economy, and a related literature showing that structural parameters recovered from aggregate data need not match the parameters of the underlying heterogeneous economy. Does the representative-agent model count as a reduction of the macro to the micro, as a re-description that merely dresses aggregate behavior in micro clothing, or as something else? Whichever of the four positions you invoke to classify it, say what that classification predicts about my practice that I could actually check.
  - Address a worry I have, which may simply be a confusion. We can almost never identify the deep micro parameters from aggregate data, and we routinely linearize about a steady state and treat the linearized system as if it carried the modal behavior of the whole economy. Both look like epistemic or approximative failures rather than metaphysical ones. Does the dispute contain resources for separating "we cannot derive it" from "it is not derivable"? If so, which position supplies them, and what does holding onto that distinction cost me in my day job?
  - Say whether Wimsatt's criterion — a system is decomposable exactly when the behavior of the whole is invariant under redistribution and rearrangement of its parts — is anything more than a formal restatement of what an economist already means when aggregation succeeds.

  Finally, your verdict on the residue. Where the translation fails, and I expect it to fail hardest on downward causation, on the claim that levels are real rather than bookkeeping, and on whatever is distinctive about the singular-limit picture, tell me whether that failure marks a defect in my vocabulary, something my modeling language cannot represent but ought to be able to, or a sign that the original claim was less determinate than it looked, so that its untranslatability is a symptom rather than a loss. Do not settle this by sorting items into two columns without arguing for the sorting.

  Two rules of conduct. First, no smuggling: if you make a philosophical position look cleaner or more defensible by importing an assumption from my framework — optimization, equilibrium, rationality, the working presumption that what cannot be identified does not exist — flag the import at the point where it occurs and say what the position looks like without it. Second, no bibliography and no reading list; I want the argument, and I would rather you reason from what you know than point me at sources I cannot check.
reasoning: |-
  We are going to translate four philosophical positions into the vocabulary of macroeconomics, specifically medium-scale general equilibrium modeling. We will then address specific test cases and questions.

  The vocabulary: aggregation, representative agents vs. heterogeneous-agent models, structural vs. reduced-form parameters, Lucas critique, identification, steady states, linearization, policy invariance.

  First, the four positions:

  1. **Nagel's classical reduction**: Reduction is when a higher-level theory (macro) can be derived from a lower-level theory (micro) using bridge laws that connect the vocabularies. Success: the derivation works.

  2. **Fodor's multiple realizability**: The same macro property can be realized by many different micro configurations. Therefore, no manageable bridge law exists, and macro generalizations are autonomous.

  3. **Kim's causal exclusion**: If the physical (micro) level is causally closed (every effect has a sufficient micro cause), then a macro property either is identical to that micro cause or is epiphenomenal (does no causal work).

  4. **Batterman's singular-limit emergence**: Some macro regularities cannot be obtained at any finite order from the micro theory; they only appear in a limiting regime and are insensitive to micro details.

  For each, we separate:
  - What translates cleanly (with economic term named).
  - What translates only with bending (and how).
  - What has no expression.

  Then, we address:
  - The SMD result: multiple realizability vs. supervenience.
  - The representative agent: reduction, re-description, or what?
  - Epistemic vs. metaphysical failures: "cannot derive" vs. "not derivable".
  - Wimsatt's criterion: decomposability and aggregation.

  Finally, the residue report: where translation fails (downward causation, reality of levels, singular limits) and whether it's a defect in the vocabulary or a symptom of indeterminacy.

  Rule: No smuggling. Flag imports.

  ---

  **Translation of the Four Positions**

  1. **Nagel's reduction**:
     - Clean translation: **Structural estimation of a micro-founded macro model**. We derive aggregate behavior from micro primitives (preferences, technology, endowments) and then estimate the deep parameters. The bridge laws are the aggregation rules (e.g., how individual demands sum to market demand). Reduction succeeds when the model matches the data.
     - Bending: Nagel's bridge laws are typically thought of as identities or definitions, but in economics, aggregation is often approximate (e.g., due to heterogeneity) and might require assumptions (like identical preferences). Without identical agents, the bridge laws are not exact. Also, in economics, the derivation might require equilibrium conditions (like market clearing) that are not part of the micro theory per se but are added.
     - No expression: The idea that bridge laws are a priori or necessary. In economics, they are contingent and model-dependent. Also, the philosophical notion of "theory" as a set of laws is not exactly how we think of models.

  2. **Fodor's multiple realizability**:
     - Clean translation: **The SMD result and the failure of aggregation**. The same aggregate excess demand function can arise from many different distributions of individual preferences and endowments. Thus, macro regularities (like the aggregate consumption function) are not reducible to a unique micro foundation and must be studied at their own level.
     - Bending: Fodor's argument is about the autonomy of special sciences, but in economics, we often still try to build micro foundations. The SMD result does not necessarily make macro autonomous; it just shows that without strong assumptions, we cannot uniquely recover micro from macro. Also, Fodor's point is that macro generalizations are still valid, but in economics, we worry about the Lucas critique: if macro relations are not structural, they may break under policy change.
     - No expression: The idea that macro properties are "real" in a way that is independent of micro. In economics, we typically hold that macro supervenes on micro (i.e., fixed micro fixes macro). The SMD result shows that many micro configurations yield the same macro, but the macro is still determined by the micro.

  3. **Kim's causal exclusion**:
     - Clean translation: **The Lucas critique and policy invariance**. If we take the micro level (deep parameters) as causally closed (they are the fundamental drivers of the economy), then any macro relationship (like a reduced-form Phillips curve) that is not structural (i.e., not derived from micro) is either an epiphenomenon (it doesn't cause anything) or must be identical to a micro-based relationship. Policy changes (a macro intervention) will affect the reduced form if it is not structural.
     - Bending: Kim's argument is about causation in a metaphysical sense. In economics, we are more pragmatic: we care about prediction and policy. The Lucas critique is about the stability of parameters, not about whether macro causes are real. Without the assumption of rationality and optimization (which is imported from economics), Kim's argument doesn't get off the ground because the micro level might not be causally closed in the required way.
     - No expression: The idea of causal closure as a metaphysical principle. In economics, we don't have a well-defined notion of causal levels; we have statistical exogeneity and endogeneity. Also, downward causation (macro causing micro) is common in economics (e.g., aggregate demand affecting individual investment) and is not seen as problematic.

  4. **Batterman's singular-limit emergence**:
     - Clean translation: **Nonlinear dynamics and linearization around steady state**. Some macro phenomena (like phase transitions) only emerge in the limit as we take the system size to infinity or as we approach a bifurcation point. The linearized system around the steady state might be insensitive to micro details (e.g., in a representative agent model, the exact utility function might not matter for local dynamics). Also, the limit might be singular: the behavior at the limit is not the same as the behavior when approaching it.
     - Bending: Batterman's examples come from physics (like thermodynamics from statistical mechanics). In economics, we rarely have such limits. Linearization is an approximation, and we know that it breaks down far from the steady state. The claim of "insensitivity to micro details" is often an idealization; in heterogeneous-agent models, micro details can matter.
     - No expression: The idea of a singular limit as a distinct kind of emergence. In economics, we don't have a formal way to express that the macro is discontinuous with the micro in the limit. Also, the philosophical debate about whether such emergence is ontological (real) or epistemic is not part of our vocabulary.

  ---

  **Residue Report and Test Cases**

  1. **SMD as multiple realizability vs. supervenience**:
     - The SMD result shows that the same aggregate excess demand function can be realized by many different distributions of individual preferences and endowments. This is an economic instance of multiple realizability: the macro property (aggregate demand) is multiply realizable at the micro level.
     - However, the macro behavior still supervenes on the micro: fix the micro parameters and the distribution, and the aggregate is fixed. But note: the distribution is a macro-level object? Not exactly: the distribution is a property of the micro-level (the set of agents). So supervenience holds: no change in macro without a change in micro.
     - The key difference: Fodor's multiple realizability is meant to show that the macro is autonomous because it doesn't depend on the specific micro details. But in economics, we still say that the macro is determined by the micro (including the distribution). So the SMD result is a failure of identifiability (we cannot recover the micro from the macro) but not a failure of supervenience.
     - Supervenience is doing work: it says that the macro is fixed by the micro, but it doesn't require that there is a unique bridge law. "Determined by the deep parameters" is the same as supervenience because the deep parameters (including the distribution) are the micro level. The SMD result shows that the mapping from micro to macro is many-to-one. So multiple realizability is present, but it doesn't imply autonomy because we still need the micro to explain why the macro is what it is.

  2. **The representative agent**:
     - The representative agent model is often presented as a reduction: we derive macro from micro by assuming a single agent. But we know this is flawed: the representative agent's preferences may not exist (due to the SMD result) and may not reflect the individuals.
     - It is not a reduction in Nagel's sense because we cannot derive the macro from the actual micro (with heterogeneity) without aggregation, which fails. Instead, it is a re-description: we take aggregate data and impose an "as if" optimization problem. This is a form of Fodor's autonomy: we have a macro model that is useful even though it doesn't reduce to the true micro.
     - But note: sometimes we build heterogeneous-agent models and then aggregate. That is an attempt at reduction. The representative agent is a shortcut that avoids aggregation by assuming it away.
     - Classification: The representative agent is a case of Fodor's autonomy. It is a higher-level model that is not reducible (because of multiple realizability) but is still useful. The prediction: if we take the representative agent model as a structural model, the Lucas critique applies because it may not be invariant to policy changes. We can check this by seeing if the model's parameters are stable across policy regimes. If they are not, then it fails as a reduction and is merely a reduced form.

  3. **Epistemic vs. metaphysical**:
     - The dispute does contain resources. Nagel's reduction is about derivability in principle, while Fodor and Batterman are about why it fails in practice or in principle.
     - Nagel would say that if we had all the micro data, we could derive the macro. But Fodor says that even then, the macro generalizations are necessary because the micro details are too many. Batterman says that in some cases, even with all the micro data, the macro only emerges in the limit and cannot be derived at finite orders.
     - In economics:
       - "We cannot derive it" (epistemic): We don't have enough data to identify the micro parameters. We linearize because it's tractable, but we know it's an approximation.
       - "It is not derivable" (metaphysical): The SMD result says that even with infinite data, we cannot recover the micro from the macro because of multiple realizability. Batterman's emergence would say that the macro behavior (e.g., a phase transition in an agent-based model) is not derivable from the micro at any finite order because it only appears in the infinite limit.
     - Which position supplies the distinction? Fodor and Batterman both argue for underivability in principle. Fodor: because of multiple realizability, there is no bridge law. Batterman: because of the singular limit, the macro is not continuous with the micro.
     - Cost in day job: Holding onto the distinction might lead us to be cautious about the scope of our models. For example, if a phenomenon is emergent in Batterman's sense, then linearization might miss it entirely. But in practice, we might not know whether a failure is epistemic or metaphysical.

  4. **Wimsatt's criterion**:
     - Wimsatt: a system is decomposable if the behavior of the whole is invariant under redistribution and rearrangement of its parts.
     - In economics, aggregation succeeds when we can write aggregate variables as a function of aggregates (e.g., aggregate consumption as a function of aggregate income) without needing the distribution. This is exactly what Wimsatt's decomposability requires: the aggregate relationship does not depend on how the parts are arranged (the distribution).
     - Example: In the representative agent model, we assume decomposability: the whole economy acts as if it were one agent. But the SMD result shows that this is generally not true: aggregate demand depends on the distribution. So Wimsatt's criterion is a formal restatement of what we mean by aggregation succeeding: when the distribution doesn't matter.

  ---

  **Verdict on the Residue**

  Where translation fails:

  - **Downward causation**: In economics, we have feedback from macro to micro (e.g., aggregate demand affecting individual expectations). Kim's causal exclusion says this can't happen if the micro is causally closed. But in our models, we build it in (e.g., with adaptive learning). This failure is because our vocabulary does not have a notion of causal closure. We are pragmatic: if the model works, we use it. The untranslatability is a symptom: Kim's argument assumes a strict hierarchy of causation that economics does not respect. It's not a loss because we don't need it.

  - **Reality of levels**: In philosophy, levels might be ontologically real. In economics, levels are bookkeeping: we use the model that works for the question at hand. The failure to translate is because we are instrumentalists. The original claim was less determinate: what does it mean for a level to be "real"?

  - **Singular limits**: Batterman's idea is not well-expressed in economics because we don't have the same kind of limits. Our linearization is a Taylor approximation, not a thermodynamic limit. The untranslatability is a loss if we want to model phenomena that require such limits (e.g., financial crises as phase transitions). But currently, it's not in our vocabulary.

  Defect or symptom? Mostly symptom: the philosophical claims are less determinate when applied to economics because our models are not about fundamental reality but about useful representations. The residue highlights where our practice is pragmatic and not committed to a specific metaphysics. The cost of importing these ideas without bending would be to impose a metaphysics that doesn't fit.

  ---

  **Final Position**

  - The SMD result is a genuine case of multiple realizability, but it does not grant full autonomy to macro because we still need micro to explain macro (via supervenience). Supervenience is doing the same work as "determined by the deep parameters", but it emphasizes that the determination is many-to-one.

  - The representative agent is a case of Fodor's autonomy: it is a macro model that is not reducible to the true micro (because of multiple realizability) but is useful for some purposes. However, it fails the test of policy invariance (Lucas critique) if the underlying micro changes.

  - The distinction between "cannot derive" and "not derivable" is important. Fodor and Batterman provide reasons for underivability in principle. In practice, we should be aware that some macro phenomena might not be reducible even in principle (e.g., due to multiple realizability or singular limits). This might lead us to accept some macro models as autonomous.

  - Wimsatt's criterion is indeed a restatement of successful aggregation.

  The residue is not a defect in our vocabulary but a reflection of the fact that economics is a science of models, not of fundamental laws. The untranslatable parts are either not needed (like downward causation being problematic) or not yet formalized in our framework (like singular limits). We should be cautious about claims that our models are reductions in Nagel's sense and embrace the pragmatic autonomy of macro when necessary.
answer: |-
  ### Translation of the Four Philosophical Positions into Macroeconomic Vocabulary

  I'll restate each position using your vocabulary—aggregation, representative agents, structural parameters, etc.—while strictly separating clean translations, bent translations, and untranslatable elements. I'll flag any smuggling of economic assumptions (e.g., optimization, equilibrium) and note how the position changes without them. After, I'll address your test cases and residue report.

  ---

  #### 1. **Nagel's Classical Reduction (Derivability via Bridge Laws)**  
  **Clean Translation**:  
  - *Economic Notion*: **Microfoundations-based structural estimation**. Here, the "higher-level theory" is a macroeconomic model (e.g., aggregate consumption), and the "lower-level theory" is household optimization. "Bridge laws" are aggregation rules (e.g., summing individual demands into aggregate demand). Reduction succeeds when the macro model is derived from micro primitives (preferences, constraints) and estimated structural parameters align with micro data.  
  - *What Translates*: The core idea of deriving macro from micro via explicit rules (aggregation) is central to DSGE modeling. Success is when the macro model's predictions hold under policy changes (policy invariance), satisfying the Lucas critique.

  **Bent Translation (Philosophy or Economics Must Bend)**:  
  - *Bending Philosophy*: Nagel assumes bridge laws are logical or definitional (e.g., "temperature = mean kinetic energy"). But in economics, aggregation rules are often approximate (e.g., assuming identical preferences to go from micro to macro). Without optimization or equilibrium, Nagel's bridge laws become arbitrary mappings without behavioral foundations.  
  - *Bending Economics*: If we relax rationality (e.g., allow bounded rationality), Nagel's derivation fails because micro primitives don't cleanly generate macro outcomes. Reduction becomes a curve-fitting exercise, not a logical derivation.

  **No Expression in Your Vocabulary**:  
  - Nagel's "bridge laws" imply a priori connections between theories, but economics treats aggregation as contingent and empirical. Your language lacks a notion of "logical derivability" independent of estimation; everything is causal or stochastic. The idea that reduction is a matter of formal logic (not calibration) is foreign.

  #### 2. **Fodor's Multiple Realizability (Autonomy of Higher Levels)**  
  **Clean Translation**:  
  - *Economic Notion*: **Sonneschein–Mantel–Debreu (SMD) result as a failure of aggregation**. The "higher-level property" is aggregate excess demand, which can be realized by "indefinitely many distinct lower-level configurations" (distributions of preferences/endowments). "No manageable bridge law" corresponds to the impossibility of uniquely recovering micro parameters from aggregate data. The "higher-level generalizations" are reduced-form macro models (e.g., aggregate consumption functions), which "earn their keep" for forecasting even without microfoundations.  
  - *What Translates*: SMD shows macro behavior is "nearly unrestricted" by micro, justifying autonomous macro models when microfoundations are intractable.

  **Bent Translation (Philosophy or Economics Must Bend)**:  
  - *Bending Philosophy*: Fodor's autonomy requires higher-level sciences to have irreducible causal powers, but economics often assumes macro supervenes on micro (no macro change without micro change). Without this supervenience assumption, Fodor's autonomy could imply macro is wholly detached from micro—something economics rejects.  
  - *Bending Economics*: If we ignore supervenience (e.g., in ad hoc macro models without microfoundations), Fodor's view fits. But this clashes with the Lucas critique, which insists macro relations must be structural to avoid policy failure.

  **No Expression in Your Vocabulary**:  
  - Fodor's "indefinitely many realizations" implies an ontological claim: macro properties exist independently. Your vocabulary is epistemic (about what we can know or model), not ontological. You lack a concept of "property identity" across levels; everything is parameters and distributions.

  #### 3. **Kim's Causal Exclusion (Against Non-Reductive Physicalism)**  
  **Clean Translation**:  
  - *Economic Notion*: **Lucas critique and identification failures**. "Physical level" = micro primitives (deep structural parameters). "Causally closed" means all macro effects (e.g., inflation) have sufficient micro causes (e.g., household expectations). "Higher-level property" = reduced-form macro parameter (e.g., Phillips curve slope). Kim's argument says: if micro causes are sufficient, the macro parameter either *is* a micro parameter (e.g., via aggregation) or is epiphenomenal (does no causal work).  
  - *What Translates*: Structural parameters are "micro causes"; reduced-form parameters are epiphenomenal under policy changes if not structural.

  **Bent Translation (Philosophy or Economics Must Bend)**:  
  - *Bending Philosophy*: Kim assumes causal closure is metaphysical, but economics treats it as empirical (e.g., via Granger causality tests). Without rationality or optimization, causal closure isn't axiomatic; micro might not "close" the system if agents are irrational.  
  - *Bending Economics*: If macro causes (e.g., aggregate demand) are treated as real, Kim's view forces you to say they must reduce to micro or be illusory. But in practice, you use macro shocks (e.g., TFP) without full micro reduction, bending Kim toward instrumentalism.

  **No Expression in Your Vocabulary**:  
  - "Causal exclusion" relies on a strict hierarchy where micro causes are primary. Economics allows feedback (e.g., macro variables affecting micro expectations), violating hierarchy. Your language has no framework for "downward causation" (macro→micro), treating it as equilibrium adjustment. Kim's metaphysics of causation is absent.

  #### 4. **Batterman's Singular-Limit Emergence**  
  **Clean Translation**:  
  - *Economic Notion*: **Linearization around steady states and non-identifiability**. "Macroscopic regularities" = stylized facts (e.g., business cycles). "Not obtainable at finite order" mirrors how linearized systems approximate dynamics near steady states but fail globally. "Insensitive to microscopic details" resembles how linearized parameters (e.g., impulse responses) are robust to micro heterogeneity in large samples. "Limiting regime" = steady-state equilibrium.  
  - *What Translates*: The claim that macro behavior emerges only asymptotically (e.g., via laws of large numbers) and is "insensitive" to micro details aligns with central limit theorems in aggregation.

  **Bent Translation (Philosophy or Economics Must Bend)**:  
  - *Bending Philosophy*: Batterman's emergence is ontological (limits create new properties), but you treat limits as approximations (epistemic). Without equilibrium assumptions, singular limits lose meaning; e.g., away from steady states, dynamics may depend critically on micro.  
  - *Bending Economics*: To fit Batterman, you must reinterpret linearization as "emergent" rather than approximative—e.g., treating VAR models as capturing irreducibly macro phenomena. But this clashes with microfoundations goals.

  **No Expression in Your Vocabulary**:  
  - "Singular limit" implies discontinuity between micro and macro (e.g., phase transitions). Economics lacks such discontinuities; linearization is smooth. "Emergence" as ontological novelty (e.g., liquidity traps as new causal powers) isn't modeled; you see it as nonlinear dynamics.

  ---

  ### Residue Report and Test Cases

  #### 1. **SMD Result: Multiple Realizability or Supervenience?**  
  - **Genuine Multiple Realizability?** Yes, but qualified. SMD shows aggregate excess demand is *multiply realizable*: many micro configurations (preferences, endowments) produce identical aggregate behavior. This mirrors Fodor: macro properties (excess demand) are "autonomous" because they don't depend on specific micro details.  
  - **Supervenience vs. Determination**: Supervenience ("no change in macro without micro change") is weaker than "determined by deep parameters." SMD satisfies supervenience—fix micro, and macro is fixed—but violates unique determination because many micro states map to one macro state. Supervenience *is* doing work: it distinguishes SMD from full autonomy by preserving dependency on micro, even if non-unique. "Determined by deep parameters" implies identifiability (unique mapping), which SMD denies.  
  - **Precision**: Multiple realizability emphasizes non-uniqueness (macro underdetermined by micro); supervenience emphasizes dependency (macro constrained by micro). SMD has both: macro depends on micro (supervenience) but isn't uniquely identifiable (multiple realizability).  

  #### 2. **Representative Agent: Reduction, Re-description, or What?**  
  - **Classification**: The representative agent is a *failed reduction* (Nagel) that functions as a *re-description* (Fodor). Nagel fails because the representative agent's preferences often conflict with heterogeneous households (e.g., Gorman aggregation fails), so macro isn't derived from actual micro. Instead, it's a Fodor-style autonomous re-description: aggregate behavior is "as if" it came from a single optimizer, useful for prediction but not reduction.  
  - **Prediction for Practice**: If Fodor is right, representative-agent models should work when macro regularities are robust to micro details (e.g., matching moments of aggregate data). But Nagel/Kim predict failure under policy changes (Lucas critique): if the model isn't structural, parameters will shift. You can test this: simulate policy changes in a heterogeneous-agent model; if the representative agent's parameters break, it's not reduction.  

  #### 3. **Epistemic vs. Metaphysical Failure: Can We Separate Them?**  
  - **Resources in the Dispute**: Batterman supplies the sharpest distinction. "Cannot derive" (epistemic) = linearization is approximate but improvable with higher-order terms or better data. "Not derivable" (metaphysical) = singular limits: macro behavior (e.g., fat-tailed distributions in crises) has no finite-order micro derivation and emerges only asymptotically.  
  - **Application**: In identification failures, "cannot identify" is epistemic (more micro data might help). But SMD shows "not identifiable" in principle (metaphysical) due to multiple realizability. For linearization, if dynamics near steady states are structurally unstable (e.g., bifurcations), it's "not derivable" (Batterman); otherwise, it's "cannot derive" with current tools.  
  - **Cost in Your Day Job**: Holding Batterman's distinction cautions against overreliance on linearization for phenomena like crises (which may be singular). But it costs parsimony: you must justify when a limit is "singular" (e.g., via sensitivity analysis), adding complexity.  

  #### 4. **Wimsatt's Criterion: More Than Formal Restatement?**  
  - **Assessment**: Wimsatt's decomposability ("invariant under redistribution/rearrangement of parts") is *exactly* what economists mean by successful aggregation. E.g., aggregate consumption depends only on aggregate income (not its distribution) iff the system is decomposable. SMD shows economies are rarely decomposable, as redistribution changes aggregate demand.  
  - **No Added Value**: This is a restatement. Wimsatt doesn't advance your vocabulary; it formalizes existing concepts (aggregation failures).  

  ---

  ### Verdict on the Residue: Defect, Indeterminacy, or Symptom?  
  Where translation fails hardest—downward causation, "levels as real," singular limits—the issue is **indeterminacy in the philosophical claims**, not defects in your vocabulary. Here's the reasoning:  

  - **Downward Causation (e.g., macro shocks → micro behavior)**: Kim calls this impossible if micro is causally closed, but your models routinely include it (e.g., aggregate demand affecting investment). The untranslatability arises because Kim's "causal closure" is a metaphysical stance, while you treat causation as a practical modeling choice (e.g., recursive identification in VARs). The failure is a *symptom*: Kim's claim assumes a rigid hierarchy that economics doesn't respect, making it less determinate when applied to feedback systems.  

  - **Levels as "Real" (vs. bookkeeping)**: Fodor/Batterman argue higher levels are ontologically autonomous, but you see levels as pragmatic approximations. The untranslatability is a *symptom*: "real levels" is an underdefined philosophical claim. Your vocabulary (e.g., "reduced-form vs. structural") already handles this by shifting focus to invariance and prediction. Insisting levels are "real" adds no operational content.  

  - **Singular Limits**: Batterman's emergence claims distinct ontological status for limits, but you see them as mathematical approximations (e.g., linearization). The failure is *indeterminacy*: Batterman relies on physical examples (e.g., thermodynamics) with clear phase transitions, but economics has no exact analogues. Your models can *represent* singular limits (e.g., bifurcations in growth models), but you don't treat them as "emergent" in a metaphysical sense. The untranslatability highlights that Batterman's position is less about math and more about interpretation—which your vocabulary wisely avoids.  

  **Overall Position**: The residue isn't a defect in your framework. Economics is a science of causal models, not ontology. Where philosophy seems untranslatable, it's often because it imposes extraneous metaphysics (e.g., Kim's exclusion) or overgeneralizes from physics (e.g., Batterman). Your vocabulary's "gaps" are strengths: they force clarity on what matters for estimation and policy. The cost of importing philosophy uncritically is obscured trade-offs (e.g., between tractability and microfoundations). Your practice already navigates these issues—e.g., using heterogeneous agents for distribution-sensitive policies while retaining representative agents for forecasting. The dispute refines your skepticism but doesn't demand overhaul.
