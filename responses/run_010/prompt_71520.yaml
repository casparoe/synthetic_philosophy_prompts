    So they can coexist.

    But then the question is: is counting people a violation of the individualist restriction? Scanlon might say no: the individualist restriction is about not summing welfare. We are not summing welfare, we are counting how many individuals have a complaint of a given strength.

    Therefore, the impossibility might not hold.

    But then what about the triad I had? I had:

        A: Individualist Restriction (no summing welfare)
        B: Determinacy in same-harm cases (achieved by tie-breaking by numbers)
        C: Minimal Adequacy for large numbers of moderate harms (achieved by threshold and then tie-breaking by numbers)

