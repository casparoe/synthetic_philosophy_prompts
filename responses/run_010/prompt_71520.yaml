    Therefore, there is no impossibility.

    But then why is there a debate? Because the threshold is arbitrary? And because it might be hard to compare the harm of death to the harm of a broken arm, even when the number is large.

    Also, in the threshold approach, we have to set the threshold. How? That might be vague.

    But formally, we can have a procedure.

    The procedure:

     Precondition: We have a harm function that assigns to any welfare difference for an individual a level in H. We also have a threshold function T: H -> H, which might be the identity for most levels, but for a moderate harm level h, if the number of individuals experiencing h is above a threshold N_h, then we elevate the harm level to a more severe level h' = T(h, count) [but typically, we might have fixed thresholds].

     Alternatively, we can define the harm level of a group? But that would violate individualism? We don't want that.

