    1. Individualist Restriction: No summing of welfare across persons.
    2. Comparability of Complaints: We can compare the strength of complaints across individuals (via a total order H).
    3. No Worse Than Baseline: Complaints are relative to the alternative allocation.

  Negotiable:

    4. Tie-Breaking by Numbers: In case of tie in the maximal complaint, break by counting the number of individuals with that complaint.
