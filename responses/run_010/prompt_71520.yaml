          group_complaint(S, a, b) = the harm level of the group S of individuals who are worse off in a than in b.

     But then we are aggregating the group, which violates the individualist restriction.

     Therefore, the threshold approach within the individualist framework might not work for dissimilar harms without redefining the harm levels in a way that depends on the number of people affected? But that would be:

          harm(i, a, b) might depend on the number of other people in the same situation? But that seems odd.

     Alternatively, we might have a fixed mapping: harm level for a broken arm is always the same, regardless of numbers.

     Then C is not achieved.

     So we have a tension.

     After all, the threshold approach requires that we treat the harm level of an individual as being more severe when there are many others also harmed? That seems to violate the individualist restriction.

     Hence, we might conclude that under the individualist restriction, we cannot achieve C without some form of aggregation that the restriction forbids.

     Therefore, the impossibility is:

          A: Individualist Restriction (understood as: the harm level for an individual depends only on that individual's welfare and not on the number of others in the same situation)

          B: Determinacy in same-harm cases

          C: Minimal Adequacy for large numbers of moderate harms

     are incompatible.

     We can drop A by allowing the harm level to depend on the number of others similarly affected? But that is not standard.

     Or drop C.

     Or drop B.

     So the scorecard of contenders:

     - Scanlon: A, B, not C.
     - Moderate Contractualism (with threshold): They try to have A, B, C by allowing the harm level to be context-dependent on the number of people? But that might violate the spirit of A. Or they might have a fixed threshold that is not context-dependent: e.g., a broken arm is always elevated to death if there are more than 1000? That is fixed, so per-individual harm level does not depend on the actual number in the group? Then it is not context-dependent? But then in a small group, a broken arm is not elevated, but in a large group it is. So the harm level of the same welfare difference for the same individual is different based on how many others are affected? That seems to violate individualism.

     Therefore, we might class moderate contractualism as dropping A.

     - Others: weighted lotteries: they drop B in favor of randomness.

     - Consequentialism: drops A.

     Hence, the only way to keep A and B is to drop C.

     So to answer your friend: contractualism is not utilitarianism with a veto. It is a view that in cases of dissimilar harms, the veto of the one facing the severe harm always wins, no matter how many face the moderate harm. And in same-harm cases, the numbers break the tie.

     The specification:

     Input: 
       I: finite set of individuals.
       A: finite set of allocations.
       For each allocation a and individual i, we know the welfare of i in a: w_i(a). And we assume we have a harm function that, for any two welfare levels for the same individual, assigns a harm level in a totally ordered set H. And we assume we can compare harm across individuals: that is, the harm level for individual i in allocation a compared to b is comparable to that for j.

     Procedure for comparing two allocations a and b:

       Let C(a, b) = { h in H : h = harm(i, a, b) for some i such that w_i(a) < w_i(b) }
          where harm(i, a, b) = the harm level for i when choosing a instead of b.

       Similarly, C(b, a).

       Let max_a = max(C(a, b)) if C(a, b) non-empty, else the least element in H.
       Let max_b = max(C(b, a)) if C(b, a) non-empty, else the least element in H.

       If max_a > max_b, then a is rejected in favor of b.
       Else if max_b > max_a, then b is rejected in favor of a.
       Else (max_a == max_b):
          Let n_a = number of i in I such that harm(i, a, b) = max_a.
          Let n_b = number of i in I such that harm(i, b, a) = max_b.

          If n_a > n_b, then a is rejected in favor of b.
          Else if n_b > n_a, then b is rejected in favor of a.
          Else: tie (neither is rejected in favor of the other).

     Then, to find the permissible allocations in a set A:

          We build a directed graph where an edge a -> b means that a is rejected in favor of b.

          Then, the permissible allocations are the ones with no incoming edges (the uncovered set? the Condorcet winners?).

          If there is a cycle, then there might be no node with no incoming edges? Then we return the set of allocations that are in the top cycle? Or we return all allocations? We might have to live with the possibility of multiple permissible allocations or none? But we require non-emptiness? We can return the set of allocations that are not strictly rejected by any other allocation? That is, for allocation a, if there is no b such that a is rejected in favor of b, then a is permissible.

          But note: rejection is defined pairwise. And it is possible that a is not rejected by any other allocation? Then it is permissible.

          This set is non-empty? Not necessarily: if we have a cycle, then every allocation is rejected by some other. Then the set is empty.

          To fix that, we might use the Schwartz set: the set of allocations that are not beaten by any allocation outside a set, and within the set they are in a cycle. But that is complex.

          For simplicity, we might assume that the set A is such that the rejection relation is acyclic? Or we might require that the input harm function is such that it is acyclic? But we cannot guarantee.

          Alternatively, we might use a scoring: for each allocation, count the number of allocations that reject it? Then pick the allocation(s) with the minimum score? But that is not in the theory.

          Given the time, we'll assume that the rejection relation is acyclic, or we allow for multiple permissible allocations including those in cycles.

     This specification meets A, B, and not C.

     To meet C, we would need to modify the harm function to depend on the number of individuals with the same harm? But that is not in the input. Or we might have a preprocessing step that elevates harm levels if the number of individuals with that harm level in the allocation is above a threshold? But that would be:

          For allocation a and b, we might define an elevated harm level for i based on the number of individuals with the same harm in the same allocation? But that is context-dependent and might violate the spirit of individualism.

     So we leave it at that.

     Final scorecard:

     - Scanlonian contractualism: Meets 1,2,3,4,6 (if we assume no cycle),7 (if we assume fixed populations and deterministic allocations). Does not meet 5 (threshold) and also does not meet the adequacy condition C.
     - Moderate contractualism: Tries to meet 1,2,3,4,5,6,7 by context-dependent harm levels or thresholds, but might violate 1.
     - Utilitarianism: Drops 1, meets the rest by summing welfare.

     Therefore, your friend is partly right: in the dissimilar harm cases, contractualism gives a veto to the one with the severe harm. But in same-harm cases, it does not (it breaks the tie by numbers). So it is not simply a veto in all cases.

     To call it "utilitarianism with a veto" is not accurate because utilitarianism would aggregate in both cases.

     But in the dissimilar harm case, it is like a veto.

     And in the same-harm case, it is like utilitarianism (because it counts numbers).

     Hence, it is a hybrid.

     But without aggregation of dissimilar harms, it fails to save the many from moderate harms.

     End.
answer: |-
  Below is a precise specification of Scanlonian contractualism's approach to the aggregation problem, structured as desiderata (requirements) for a runnable procedure. Each requirement is grounded in concrete cases, with formal properties and classifications into non-negotiable vs. contingent commitments. The core tension (impossibility result) is addressed at the end.

  ### **Inputs & Outputs**
  - **Input**: Finite set of individuals \(I\), finite set of candidate allocations \(A\) (distributions of a fixed budget/benefit), and a baseline allocation \(A_0\) (status quo or alternative). Each allocation assigns welfare states to individuals, but **no interpersonally comparable cardinal welfare** is assumed.
  - **Output**: Subset \(P \subseteq A\) of permissible allocations (those not reasonably rejectable).
  - **Rule**: Must never sum welfare/complaints across persons; comparisons are strictly individual.

  ---

  ### **Desiderata & Motivating Cases**
  Formal properties are embedded in each requirement. Cases are simplified for clarity.

  1. **Individualist Restriction (Non-Negotiable)**  
     - **Requirement**: Complaints are defined per individual; no summing/aggregating across persons.  
     - **Motivation**: Core tenet of contractualism. Prevents collapse into utilitarianism.  
     - **Case**: One ventilator for a dying patient vs. 10,000 inhalers for asthmatics. Cannot sum the asthmatics' moderate harms; each complaint is assessed separately.  
     - **Formal**: Complaints for allocation \(a\) are computed as welfare loss relative to a baseline \(A_0\) (or pairwise against another \(a' \in A\)). No function sums losses/benefits across \(I\).

  2. **Comparable Complaint Strength (Non-Negotiable)**  
     - **Requirement**: Complaints must be ordinally comparable across individuals without a cardinal scale.  
     - **Motivation**: Needed to resolve conflicts; e.g., death vs. broken arm.  
     - **Case**: Policy A kills one; Policy B gives each of 1M people a 1/M risk of death. Complaints (certain death vs. risk exposure) must be comparable.  
     - **Formal**: A preorder \(\succeq\) on complaint strength exists (e.g., death > paralysis > minor injury). Invariant under relabeling of individuals.

  3. **Complaints Against Alternatives (Non-Negotiable)**  
     - **Requirement**: Complaints are relative to feasible alternatives, not counterfactuals.  
     - **Motivation**: Avoids vagueness; complaints must be actionable.  
     - **Case**: Choosing between two policies: one kills one, another kills five. Complaints depend on direct comparison, not hypotheticals.  
     - **Formal**: For any \(a, a' \in A\), complaint strength for \(i\) is defined iff \(i\) exists in both allocations. Non-identity cases handled separately (see #8).

  4. **Tie-Breaking by Numbers (Contingent)**  
     - **Requirement**: When max complaints against two allocations are equal, the allocation affecting fewer people is rejected.  
     - **Motivation**: Resolves symmetric cases deterministically; e.g., trolley problems.  
     - **Case**: One death vs. five deaths (trolley problem). Identical max complaints (death), so save five.  
     - **Formal**: If \(\max(\text{complaints against } a) = \max(\text{complaints against } a')\), reject \(a\) if \(|\{i: \text{complaint}_i(a) = \max\}| > |\{i: \text{complaint}_i(a') = \max\}|\). Not strictly aggregated; counts individuals at max harm level.

  5. **Threshold for Dissimilar Harms (Contingent)**  
     - **Requirement**: A large number of moderate harms can override a severe harm via a threshold (e.g., 1,000 broken arms > one death).  
     - **Motivation**: Avoids absolute veto for severe harms; ensures adequacy.  
     - **Case**: One death vs. 10,000 cases of severe but non-fatal illness. With threshold, saving 10,000 is permissible.  
     - **Formal**: Harm levels can be "elevated" if \(N\) affected exceeds threshold \(T\) (e.g., 1,000 broken arms \(\rightarrow\) death-equivalent). Context-dependent; may violate individualism.

  6. **Risk as Ex Post Harm (Contingent)**  
     - **Requirement**: Complaints based on ex post outcomes, not ex ante risks.  
     - **Motivation**: Scanlon rejects ex ante balancing; complaints arise from actual outcomes.  
     - **Case**: Policy A kills one; Policy B imposes 1/M risk of death on each of \(M\) people. If B kills one, complaints are identical to A.  
     - **Formal**: Allocations are deterministic; if risks are input, they must be realized as outcomes. No probability-weighted complaints.

  7. **Non-Empty Permissible Set (Contingent)**  
     - **Requirement**: \(P \neq \emptyset\) for any \(I, A\).  
     - **Motivation**: Moral decisions require actionable guidance.  
     - **Case**: Cycle where \(a_1\) beats \(a_2\), \(a_2\) beats \(a_3\), \(a_3\) beats \(a_1\). Procedure must still return at least one permissible allocation.  
     - **Formal**: Outputs the set of allocations with no "strictly better" alternative (unbeaten in pairwise comparisons). Ties allowed; cycles broken by Schwartz set or similar.

  8. **Non-Identity Handling (Contingent)**  
     - **Requirement**: Individuals who only exist in one allocation have complaints iff their welfare is below a threshold (e.g., "worth living").  
     - **Motivation**: Avoids paralysis in population ethics.  
     - **Case**: Building a park creates future people with good lives; not building it creates different people with worse lives. Complaints only from those below threshold in the chosen allocation.  
     - **Formal**: For \(i\) existing only in \(a\), complaint if \(w_i(a) < \theta\). Baseline \(A_0\) must include all possible individuals.

  ---

  ### **Classification & Tensions**
  - **Non-Negotiable (drop → not contractualism)**: 1, 2, 3.  
    These enforce individualism, comparability, and relativism to alternatives. Dropping them permits aggregation, collapsing into consequentialism.
    
  - **Contingent Commitments**:  
    - **Numbers Skeptics** (Scanlon): Reject 4, 5. Tie-breaking not allowed; severe harms always veto.  
      Case: Death always outweighs any number of headaches.  
    - **Moderate Aggregators**: Accept 4, 5. Tie-breaking and thresholds allow limited aggregation.  
      Case: 1,000 broken arms > one death.  
    - **Weighted-Lottery Advocates**: Replace 4 with random selection in ties.  
      Case: Trolley problem resolved by coin flip.  
    - **Risk-Focused Views**: Modify 6 to use ex ante risks in complaints.  
      Case: 1M risk exposures > one certain death.

  ---

  ### **Impossibility Result**
  Your triad captures the core tension, but misidentifies the minimal adequacy condition. The critical impossibility is:  
  1. **Individualist Restriction** (no summing across persons).  
  2. **Determinacy in Symmetric Cases** (e.g., save five over one in trolleys).  
  3. **Adequacy for Dissimilar Harms** (e.g., save 10K from severe illness over one death).  

  **Why they conflict**:  
  - (1) forbids aggregating complaints.  
  - (2) requires tie-breaking by numbers in symmetric cases (e.g., deaths).  
  - (3) requires elevating moderate harms to severe levels when \(N\) is large (effectively aggregating).  
  Elevating harms (for 3) violates individualism (1) by making complaint strength context-dependent (e.g., a broken arm is "worse" when 10K are affected).  

  **What it costs to drop each**:  
  - Drop (1) → Consequentialism (summing permitted).  
  - Drop (2) → Indeterminacy (e.g., coin flips in trolley cases).  
  - Drop (3) → Numbers skepticism (one death > any number of smaller harms).  

  **Most Eliminative Requirement**:  
  - **Adequacy for Dissimilar Harms** (3): Rules out numbers-skeptical views (Scanlon's orthodoxy) and weighted lotteries, leaving only moderate aggregation (which bends individualism).

  ---

  ### **Contender Scorecard**
  | **View**               | **Meets Non-Negotiables?** | **Handles Trolley?** | **Handles 10K Illnesses vs. Death?** |  
  |------------------------|---------------------------|----------------------|--------------------------------------|  
  | **Scanlon (Numbers Skeptic)** | Yes                       | Yes (via tie-break)  | No (death always wins)               |  
  | **Moderate Aggregator**      | Yes* (with context)       | Yes                 | Yes (with threshold)                 |  
  | **Utilitarianism**           | No (sums welfare)         | Yes                 | Yes                                  |  
  | **Weighted Lottery**         | Yes                       | No (random)         | No                                   |  

  \* Moderate aggregators technically violate individualism by making complaint strength depend on group size.

  ---

  This spec exposes that contractualism is **not** "utilitarianism with a veto": It forbids summing, handles symmetric cases without aggregation, but struggles with dissimilar harms without thresholds. The impossibility shows that adequacy requires bending individualism—highlighting the theory's limits.
