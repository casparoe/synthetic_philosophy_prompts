  The user seems intellectually sophisticated - they've clearly analyzed this deeply over years and rejected several existing concepts (hagiography, halo effect, role models) as inadequate. Their frustration with "adjacent but not quite" terminology is palpable. What they really crave is precise conceptual carving, not just labels. 

  Hmm... their core question is whether admiration for complex achievers causes moral calibration drift. Interesting how they distinguish this from simple inconsistency - they're describing something more systematic. The friend's dismissal of this as mere inconsistency feels too reductive given the detailed patterns described.

  Let me mentally scan relevant psychological concepts. Cognitive dissonance comes close but doesn't quite fit because the user isn't describing discomfort-driven rationalization. Moral licensing is adjacent but typically involves claiming credit for past good behavior to excuse current bad behavior, which isn't quite this. 

  The most promising lead might be the "identifiable victim effect" scaled up to whole biographies - we become more tolerant of flaws when we intimately know someone's narrative. But that doesn't fully capture the yardstick-recalibration aspect. 

  Perhaps this needs a new term. "Moral accommodation" comes to mind - where admiration creates cognitive accommodations for associated flaws. Or "exemplar drift" emphasizing how role models shift our moral boundaries. But the user wants rigorous definition, not just naming.

  Important to address their specific diagnostic questions: Yes, this likely happens with fictional characters (we tolerate Walter White's crimes). Yes, institutions probably trigger similar effects (loyalty to alma maters despite scandals). The mechanism feels unified - admiration triggers a protective narrative-building instinct that reinterprets actions and elevates contingencies. 

  The friend's "mere inconsistency" critique deserves engagement. But the user's description suggests something deeper: vivid narratives don't just remind us of principles - they temporarily rewrite our moral algebra by making abstract principles feel negotiable when attached to human complexity. That's distinct from forgetting principles.

  This feels like uncharted territory between moral psychology and narrative theory. The closest established framework might be Bandura's moral disengagement theory, but that focuses on deliberate justification of harm, whereas here the shift is subtler and often unconscious.
answer: |-
  What you've described is a remarkably precise dissection of a psychological phenomenon that lacks a single established name—but can be mapped to intersecting concepts in moral psychology, cognitive bias, and narrative theory. The closest existing framework is **Moral Disengagement** (Bandura), but it requires significant carving to fit your case. Let's break it down step by step.

  ### Core Phenomenon:  
  **Admirative Moral Rescaling**  
  *Definition*: The unconscious recalibration of moral standards—specifically the threshold for condemning vices or reinterpreting immoral acts—triggered by sustained narrative immersion in the life of an admired but flawed agent. This occurs not through reasoned justification but through *affective habituation* to the subject's moral contradictions, facilitated by biographical depth.

  ---

  ### Why Existing Concepts Fall Short:
  1. **Moral Disengagement (Bandura)**  
     - *Overlap*: Involves redefining harmful conduct to make it personally acceptable.  
     - *Divergence*: Bandura's theory focuses on *self*-justification of one's *own* harmful acts. Your case involves *vicarious* justification for *another's* acts via admiration.  
     - *Key Difference*: Your "upgrading" of acts (cruelty → severity → firmness) mirrors cognitive restructuring (a disengagement mechanism), but it's *admiration-driven* rather than guilt-avoidant.

  2. **Halo Effect**  
     - *Overlap*: Positive traits influencing perception of negative ones.  
     - *Divergence*: The halo effect is *trait-based inference* (e.g., "He's brilliant, so he must be kind"). Your case is *narrative-based recalibration*: brutality isn't denied; its *moral weight* is diminished systemically ("This isn't so bad anymore").

  3. **Cognitive Dissonance**  
     - *Overlap*: Tension between "He's admirable" and "He did evil" could drive reinterpretation.  
     - *Divergence*: You show no distress (dissonance's hallmark). The shift is subtle, automatic, and lacks conscious conflict.

  4. **Exemplar Theory**  
     - *Overlap*: Admiration for moral exemplars shapes ethical reasoning.  
     - *Divergence*: Exemplar theory assumes admiration targets *virtues*. Here, admiration *immunizes vices* and reshapes moral taxonomy itself.

  ---

  ### Diagnosing Your Three Layers:
  | **Observation** | **Mechanism** | **Distinctive Feature** |
  |-----------------|---------------|------------------------|
  | **Rising tolerance for others' misconduct** | **Normative Habituation**: Repeated exposure to "admirable vice" in narrative normalizes the trait. | Biographical immersion makes the vice feel "necessary" or "contextually forgivable," transferring this leniency to real-world analogs. |
  | **Upgrading bad acts of admired figures** | **Affective Protection**: Protecting admiration trumps moral consistency. Acts are reinterpreted to preserve the subject's admirability. | Driven by *narrative empathy*, not new evidence. The act's description shifts to align with the subject's "grand narrative." |
  | **Treating contingencies as normative** | **Narrative Teleology**: Biographical facts become retroactive justifications. The *outcome* (admirable achievement) imbues *causes* (illness, grief) with undue moral significance. | Contingencies are framed as "enabling conditions" for virtue, tacitly endorsing them as pathways to greatness. |

  ---

  ### Answers to Your Diagnostic Questions:
  1. **Does this occur with fictional characters/institutions?**  
     Yes. Fictional antiheroes (e.g., Don Draper) trigger identical rescaling. Institutions leverage this via "founder narratives" (e.g., excusing toxic corporate culture because "it drives results").

  2. **Must the subject be admirable overall?**  
     Not necessarily. A "wretched" subject can still trigger rescaling if *aspects* are admired (e.g., a criminal's charisma making ruthlessness seem "cool"). However, *sustained admiration* (often requiring net-positive valuation) intensifies the effect.

  3. **One mechanism or two?**  
     One core mechanism: **Admirative Scaffolding**—the use of admiration to construct a cognitive framework that reclassifies vices as "necessary costs" or reinterprets acts to preserve coherence. Upgrading acts and tolerating traits are dual expressions of this.

  4. **Is this a distinct failure or just narrative sway?**  
     Distinct. Ordinary narrative engagement evokes empathy or insight. *Admirative rescaling* is a **counter-moral heuristic**: it uses emotional investment to *override* stable ethical judgments. Your friend's "inconsistency" charge misses that this is a *systematic* bias emerging from narrative bonding.

  ---

  ### Why Your Friend Is Half-Right (But Only Half):
  Your friend correctly notes that biography doesn't *teach* morality—it *reconfigures* it through affective channels. But claiming you "never knew brutality was bad" ignores the phenomenon's core: narrative doesn't *remind* or *educate*; it *reweights* values. You still know brutality is bad abstractly, but admiration creates a "moral blind spot" for its exemplars. This is **contextual moral numbing**.

  ---

  ### Proposed Term:  
  **Exemplar-Induced Moral Rescaling (EIMR)**  
  *Definition*: A cognitive-affective bias whereby immersive engagement with the life narrative of an admired agent triggers:  
  (a) Downward recalibration of the moral severity of their vices,  
  (b) Upward reinterpretation of their immoral acts to preserve admirability, and  
  (c) Conflation of contingent biographical facts with normative justifications—  
  resulting in transferable tolerance for similar flaws in others.

  This isn't on your shelf yet—but it maps the territory you've uncovered. The argument wasn't about nothing: it revealed how biography doesn't just describe lives, but *reprograms* our moral sensors.
