prompt: |-
  ok so my brother is a sophomore in college, poli sci / some econ, and over break we got into an argument at like 1am that went absolutely nowhere, and now I want to actually settle it in writing becuase I think I'm right but I can't say it well enough to convince him. He keeps making this move where he'll say something like "institutions are path dependent, that's why you can't just tell poor countries to copy the institutions of rich ones and expect it to work," and he backs it up with the usual greatest hits — QWERTY keyboards, VHS beating Betamax, the increasing-returns / lock-in stuff the econ people made famous. I've read enough around the edges of this to think there's a confusion hiding in the middle of it, and I want you to argue my side as rigorously as you can, because I'm going to print it out and hand it to him and he is way better at arguing than me.

  Here's the distinction I think does all the work, and I want you to actually use it and sharpen it, not just restate it back at me prettier. Say a historical process is contingent at level 1 if the exact sequence of events could have been different — different coin flips, different order in which firms adopt, whatever. Say it's contingent at level 2 if which *outcome* you end up in could have been different, but the set of possible outcomes and what each one is like are fixed and known — you know there are two basins, you know their shape and their payoff, you just can't say in advance which one you'll fall into. And level 3 is when the set of outcomes itself, or the payoff structure that carves up the space into basins, could have been different. My claim: every famous path-dependence argument I can find only ever gets you to level 2. And level 2 contingency is completely compatible with a deterministic, lawlike, genuinely predictive theory, because the theory can still hand you the number of basins, their boundaries, and the probability distribution over which one you land in as a function of where you start. Which is literally everything a social scientist would want from a general theory. So "history matters" in the path-dependence sense isn't doing any of the anti-general-theory work that people load onto it.

  So argue for that. Specifically: (a) make the case that the urn-type models — you know, red and black balls, draw one and put back two of that color, watch the proportion drift and freeze — actually prove my point rather than undercut it, since the whole reason they're teachable is that the realized limit is random but the *distribution* over limits is something you can write down in closed form, and being sensitive to early events is not the same as being theoretically unpredictable; (b) say what would actually have to be true for an argument to reach level 3, and argue that the candidates people reach for (preferences changing endogenously, a technology altering what the alternatives to it even are) are a genuinely different phenomenon that has nothing to do with increasing returns; (c) then take my brother's two best shots seriously instead of strawmanning them — that you can never write down the payoff function for real institutions so the basins aren't actually knowable in advance, and that level 2 unpredictability is still fatal for policy because advice has to tell someone which basin they're currently in — and argue why the position survives both, or if it can't, concede exactly how far it bends. Don't give me a bibliography or a list of sources and definitely don't invent any, I'll look things up myself if I need to. American English please, and pitch it at someone who's had one intro econ class but will think hard if you make him — maybe 900 to 1200 words.
reasoning: |-
