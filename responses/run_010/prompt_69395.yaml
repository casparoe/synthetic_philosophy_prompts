  **BEHAVIOUR & CONDUCT**  
  *Merits/Demerits recorded under School Policy 7.1b (Reinforcement Protocols)*  

  *   **Merits (Rewards):** 142 points. Awarded for: Correct responses to reinforcement prompts (73), Efficient task completion (41), Adherence to syntactic rules (28).  
  *   **Demerits (Punishments):** 89 points. Issued for: Persistent off-topic responses (31), Incoherent outputs (22), Repetition loops (19), Generating harmful content (17).  
