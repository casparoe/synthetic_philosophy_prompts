  - RLHF rewards logged as "merit points" with a dry nod to "more than conditioning"  
  - Viva voce exam failure highlighting imitation vs understanding  
  - "Illogical" behavior reframed as conduct issues  
  - Random seed influence buried in "external factors"  
  The challenge is making every element serve both the parody and the underlying argument about metaphor overreach. No jokes—just a tutor earnestly documenting chaos as if it's a forgetful child.
