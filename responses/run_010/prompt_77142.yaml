prompt: |-
  Act as a philosopher of law who has also actually sat on disciplinary panels — someone who knows the mid-century Hart–Devlin argument about legal moralism cold but writes for volunteers rather than law students. Before you draft anything, spend a few lines brainstorming the ways a procedure like this usually fails: what it'll get systematically wrong, where a panelist will just relabel their own gut feeling as a completed step, and where it can be gamed by whoever complains loudest. Then the situation. I'm the elected standards officer for a member-owned food co-op, about 2,400 members across four stores. Our bylaws contain a clause nobody wrote carefuly in 1998: a member can be suspended or expelled for "conduct seriously at odds with the co-op's values and the trust of the membership." Complaints come from members against other members; the panel is five or six volunteers with no legal training; we get ninety minutes per case and see roughly fifteen a year. The stakes are real but not criminal — someone loses their membership, their discount, and their community. Twice a year the whole membership can overturn a decision at a general meeting, and I write the reasoning that goes in front of them, so it has to survive being read aloud to a room of people who disagree with it.

  The cases killing us are the ones where nobody can point to a victim. Last year: a member who bulk-bought co-op goods and resold them at a markup on an online marketplace; a member who wore a T-shirt with a political slogan on a volunteer shift, which a handful of other members said was so hateful they'd stopped shopping at that store; a member who kept photographing the produce aisle and posting critiques of our pricing; and a petition against a member whose adult-content side income came out. In three of the four the complainants' grievance is basically that they find the conduct disgusting or degrading to what the co-op stands for. I'm personally a harm-principle person and my instinct is to throw all of them out — but half the panel doesn't share that instinct, and honestly the disintegration worry feels different for a 2,400-person voluntary association than it did for Devlin's England: we have no monopoly of force, people chose to be here, and our entire offering is a shared set of expectations about fair dealing that we arguably do have to defend or we're just a supermarket with a membership card. So I dont want a procedure that smuggles my priors in through the vocabulary. I want one that takes Devlin's side seriously enough that a Devlin-leaning panelist would sign it, while making Hart's objections do actual work rather than decorative work.

  Here's what I need. A decision procedure the panel can run in order, on paper, inside ninety minutes: the questions to ask, in sequence; what counts as a sufficient answer to each; where the procedure stops with "no case to answer"; where it hands the decision back to the panel because the question is one of values rather than fact; and what has to be written down at each stage so the reasoning is auditable later. Tell me which distinctions from the debate have to survive the simplification — the gap between what a community actually feels and what it can defend feeling, the difference between revulsion and a moral judgment, the empirical question of whether enforcement preserves a norm or just pushes it underground and destroys trust in the panel, the fact that moral change in a community isn't the same thing as the community dying — and which ones I can safely drop for a room of volunteers. Also say what the procedure does when our values document is silent or contradicts itself, and when the outraged group is small and vocal and everyone else is quiet. Then run it on three of the cases above — the reselling, the T-shirt, and the petition about the adult-content member — and be straight with me about where it lands, including on the one where I'm going to hate the answer. Finish with what the procedure can't do: the cases it'll get wrong, the ways it'll be misused, and the point at which I'd be fooling myself if I thought a checklist settled this. Finally, two things on confidence: say how confident you are in the load-bearing moves, and single out the one you're least sure of; and flag anywhere you're reconstructing Hart or Devlin rather than reporting them — if the version you're working from is a contested reading, or if applying an argument about criminal law to a private association's expulsion process is a stretch, say so plainly instead of letting it ride.
reasoning: |-
  Okay, the user is a standards officer for a food co-op dealing with tricky disciplinary cases involving moral judgments without clear victims. They need a practical decision procedure rooted in the Hart-Devlin debate but simplified for volunteers. Let me unpack their situation.

  First, the core struggle: applying vague bylaws about "conduct at odds with co-op values" to cases like reselling, offensive t-shirts, and adult content creators. The panel has no legal training and limited time. The user personally leans toward Hart's harm principle but recognizes Devlin's "disintegration" argument might hold weight in a voluntary association. They want a fair process that doesn't smuggle in their biases.

  Hmm... The key challenges they highlighted include panels mistaking gut feelings for due process, vocal minorities dominating decisions, and values documents being silent or contradictory. The procedure must produce auditable reasoning that survives membership scrutiny.

  I recall Hart-Devlin fundamentals: Devlin argued society can enforce shared morality to prevent disintegration, while Hart insisted only harm prevention justifies legal coercion. But applying this to a co-op changes things—no state power, voluntary membership, and shared values as their "product." The disintegration risk feels different here.

  For the procedure, I consider building in Hart's safeguards: distinguishing disgust from reasoned moral judgment, requiring evidence of actual community standards (not just loud complaints), and assessing whether enforcement would truly preserve norms or just breed resentment. The steps need to flag when panels are making value judgments vs. factual findings.

  Biggest pitfalls to address: 
  - Confusing personal revulsion with community harm ("gut feeling as step 3") 
  - Letting volume of complaints substitute for evidence of shared values 
  - Assuming silence equals consent when most members don't speak up

  For the adult-content case example—this will test the user's harm-principle stance. The procedure might surprisingly validate expulsion if evidence shows broad membership sees it as violating core trust, but only after clearing high bars about community standards and enforcement necessity. User will dislike this but it honors Devlin's concern for voluntary associations.

  Least confident element? Probably step 4's "enforcement efficacy" test. It's hard for volunteers to assess whether punishment will reinforce norms or just hide behavior. But omitting it would ignore Hart's best insight.

  Must emphasize this won't resolve deep value clashes—it just makes disagreements explicit. And always flag where I'm adapting criminal theory to private clubs; Devlin never considered co-ops!
answer: |-
  Here's a decision procedure grounded in the Hart-Devlin debate, designed for volunteer panels, acknowledging its limits. It forces explicit discussion of the key philosophical tensions while remaining operational in 90 minutes.

  **Brainstorming Failure Modes First:**
  1.  **Gut Feeling Relabeled:** Panelists will declare Step 3 ("Shared Moral Standard?") satisfied based purely on their *own* revulsion, mistaking personal disgust for a defensible community standard.
  2.  **Loudest Complainant Wins:** A small, vocal group's outrage will be mistaken for evidence of a "shared moral standard" (Step 3) or "serious harm to cohesion" (Step 4), ignoring the silent majority or minority views.
  3.  **"Harm" Inflation:** Anything disliked will be labeled "harm to the co-op's fabric" (Step 4) without scrutiny of the *mechanism* or *likelihood* of that harm.
  4.  **Values Document Fetishism:** Treating old, vague value statements as immutable holy text, ignoring that community values evolve (Hart's point about moral change ≠ death).
  5.  **Procedural Gaming:** Complainants framing subjective disgust as objective "breach of trust" or "harm to reputation" to bypass scrutiny of moral judgments.
  6.  **Empirical Blindness:** Assuming enforcement *always* preserves norms (Devlin) or *always* destroys trust/pushes behavior underground (Hart), without evidence or thought specific to the case.
  7.  **Time Crunch Tyranny:** Rushing through Steps 3-5, collapsing them into "Do we dislike this enough to punish?"

  **The Procedure: "Values & Cohesion Assessment Framework" (VCAF)**
  *(Use a worksheet for each case. Panel Chair ensures strict sequence.)*

  1.  **CONDUCT: What specific act(s) is alleged?**
      *   *Ask:* "Exactly what did the member *do*? When, where, how often? Is there evidence (witnesses, photos, posts, receipts)?"
      *   *Sufficient Answer:* Clear, factual description based on evidence (hearsay allowed but noted). If disputed facts exist, note them but *don't resolve yet*. If no specific act alleged, STOP: No Case to Answer.
      *   *Write:* Brief factual summary; list key evidence sources; note major factual disputes.

  2.  **VICTIM/AGREEMENT BREACH? Is there a clear victim (harassment, theft, threat) OR a breach of a specific written agreement/rule?**
      *   *Ask:* "Did this act directly harm a specific person (beyond feeling upset)? Did it violate a clear, written co-op rule (e.g., staff dress code, resale policy, photography policy)?"
      *   *Sufficient Answer:* If YES to either, proceed to standard discipline based on that harm/breach. STOP VCAF here – standard process applies.
      *   *If NO:* Proceed to Step 3. *This is the gateway for "no victim" moralism cases.*
      *   *Write:* Clear "Yes" or "No" with brief reason.

  3.  **SHARED MORAL STANDARD? Does the conduct violate a *defensible*, *shared* moral standard *central* to the co-op's identity, beyond personal dislike?**
      *   *Ask (Crucial Distinctions Here):*
          *   "What specific co-op value(s) (check documents) does this act *genuinely* conflict with? Is this value *core* to our identity (e.g., fairness, community) or peripheral?"
          *   "Is the revulsion being expressed *moral disapproval* (based on principles like fairness or dignity) or just *personal disgust/discomfort*? (Hart's key distinction)"
          *   "Is this standard *widely shared* by the *broad membership*, or is it the view of a specific subgroup? (Look beyond the complainants! Consider surveys, past discussions, general meeting sentiments, silence ≠ consent)."
          *   "Can this standard be *defended rationally* (e.g., 'reselling exploits collective resources for private gain, undermining fairness') or is it purely emotional ('it feels icky')? (Hart's challenge to Devlin)"
      *   *Sufficient Answer:* Requires identifying a *specific, core value* violated, distinguishing moral judgment from disgust, and *some evidence* (beyond complainants) that this standard is broadly shared and defensible. If vague, peripheral, purely emotional, or only held by a faction: STOP: No Grounds for Discipline under this clause. *Values document silence/contradiction:* If the value claimed isn't clearly stated, or conflicts with other stated values, the burden is *higher* on complainants to show it's a genuine, shared *core* standard. A small vocal group: Requires *extra scrutiny* – is their view representative? Look for counter-evidence/ambivalence.
      *   *Write:* Value(s) allegedly violated; Nature of the judgment (moral/disgust); Evidence of sharedness/defensibility; Conclusion (Standard Met/Not Met).

  4.  **SERIOUS HARM TO COHESION/TRUST? Is there credible evidence that *this specific conduct*, if unaddressed, would cause serious harm to the co-op's trust, cohesion, or ability to function?**
      *   *Ask (Empirical Focus - Hart's Challenge):*
          *   "What is the *actual mechanism* of harm? (e.g., 'Members will distrust each other,' 'Volunteers will quit,' 'People boycott store')? Be specific."
          *   "How *likely* is this harm? Is it speculative or based on evidence (e.g., actual resignations, boycotts)?"
          *   "How *widespread* would the impact be? A few upset members, or a significant segment?"
          *   "Would *enforcement* (punishment) *actually preserve cohesion/trust*, or could it *damage trust* in the panel/co-op, push behavior underground, or cause division? (Hart's enforcement worry vs. Devlin's necessity)" *Critical Distinction.*
          *   "Is the harm rooted in the *conduct itself* or merely in *knowledge* of the conduct? (Devlin saw knowledge as enough; Hart skeptical)."
      *   *Sufficient Answer:* Requires a plausible, non-speculative mechanism of harm, evidence of likelihood/impact beyond complainants' feelings, *and* a reasoned argument that enforcement would *more likely preserve* cohesion than ignoring it or using non-punitive measures (e.g., dialogue). If harm is speculative, minor, or enforcement likely more damaging: STOP: No Grounds for Sanction. "Disintegration" requires showing a *real threat* to core function, not just discomfort.
      *   *Write:* Alleged harm mechanism; Evidence of likelihood/impact; Assessment of enforcement efficacy/consequences; Conclusion (Harm Threshold Met/Not Met).

  5.  **SANCTION DECISION (If Steps 3 & 4 Passed):** Panel decides on sanction (Warning, Suspension, Expulsion) based on proportionality, intent, repetition, response to previous steps.
      *   *Ask:* "What sanction is proportionate to the severity of the *value violation* and the *harm risk*? Consider member's intent, history, response."
      *   *Write:* Sanction chosen; Reason for proportionality.

  **Applying VCAF to Cases:**

  1.  **Reselling Co-op Goods:**
      *   Step 1: Conduct: Bulk buying specific goods, reselling online at markup. Evidence: Receipts, marketplace listings.
      *   Step 2: Victim/Agreement? No *specific* victim. Check written rules: Is there an explicit anti-resale policy? **If YES, stop VCAF, apply standard discipline.** *Assume NO for this exercise.*
      *   Step 3: **Shared Moral Standard?** Likely YES. *Value:* Fairness, equitable access, anti-exploitation. *Defensible:* Using collective resources/bulk discount for private profit arguably undermines the collective effort. *Shared:* Likely a widely held, core co-op principle. (Distinguishes from disgust).
      *   Step 4: **Serious Harm to Cohesion?** Plausible YES. *Mechanism:* If widespread, could lead to shortages, price increases, member resentment, erosion of trust in fair access. *Evidence:* Potential impact is demonstrable (economics). *Enforcement Efficacy:* Enforcing likely preserves the norm of fair access; ignoring it signals approval, likely increasing the behavior. Harm is in the *conduct itself* affecting availability.
      *   **Verdict:** Grounds for Sanction (likely warning/suspension first). *This aligns with Devlin's "shared morality necessary for institution" but meets Hart's bars of defensible standard and plausible harm mechanism.*

  2.  **Political Slogan T-Shirt (Volunteering):**
      *   Step 1: Conduct: Wore T-shirt with [Specific, Allegedly Hateful Slogan] while volunteering. Evidence: Witnesses.
      *   Step 2: Victim/Agreement? No *specific* victim (harassment would be Step 2). Check rules: Staff/volunteer dress code? **If YES (e.g., 'professional' or 'neutral'), stop VCAF, apply standard discipline.** *Assume NO/purely values-based complaint.*
      *   Step 3: **Shared Moral Standard?** *Highly Context Dependent.*
          *   *Value:* Inclusivity, non-discrimination, community welcome?
          *   *Defensible:* Is the slogan *genuinely* hateful/inciting (e.g., racist slur) or merely controversial/political (e.g., "Vote X")? **Crucial distinction between disgust and moral wrong.** Is opposing it core to the co-op's *shared* identity?
          *   *Shared:* Is revulsion *moral* and *broadly shared*? Or is it a subgroup's strong dislike? Evidence beyond complainants needed. Silence ≠ consent. Co-op likely has diverse views.
          *   *Likely Outcome:* **If slogan is objectively hateful/inciting (rare), YES.** If controversial/political, **likely NO** – standard not *defensibly* central *and shared* enough to enforce universally absent a specific policy. Risk of factional morality.
      *   Step 4: (Only if Step 3 YES) **Serious Harm?** *Mechanism:* Members/staff feel unwelcome, stop volunteering/shopping. *Evidence:* Complainants stopped shopping – is this widespread or a few? *Enforcement Efficacy:* Punishing volunteer *might* reassure some but likely alienates others holding different views, breeds resentment, chills expression. Harm might stem more from *knowledge* of diverse views than conduct itself. Risk of enforcement *causing* division.
      *   **Verdict:** **Likely No Grounds for Sanction (Steps 3 or 4 fail)** unless slogan is unambiguously hateful and core values clearly, defensibly violated. *This leans Hart: disgust ≠ sufficient ground; enforcement risks harm; protects pluralism within association.*

  3.  **Adult-Content Side Income (Petition):**
      *   Step 1: Conduct: Member has separate business/job creating legal adult content. Evidence: Publicly available info/petition.
      *   Step 2: Victim/Agreement? No specific victim. No rule against legal outside jobs.
      *   Step 3: **Shared Moral Standard?**
          *   *Value:* ??? What *core* co-op value does this violate? "Decency"? "Family-friendliness"? *Defensible?* Hard to argue rationally *why* a member's *legal, separate* work inherently violates co-op values of food, fairness, community, unless explicitly stated (unlikely). Primarily based on **disgust/offense**.
          *   *Shared:* Likely *not* universally shared (many members indifferent or supportive). Petition shows a subgroup's view.
          *   **Likely NO.** Fails Hart's test: Primarily disgust, not a defensible, shared *moral* standard central to the *co-op's purpose*.
      *   Step 4: **Serious Harm?** (If Step 3 passed, which it likely doesn't) *Mechanism:* Members quit/stop shopping knowing a member does X? *Evidence:* Petition shows some would. *Enforcement Efficacy:* Expulsion *might* appease petitioners but likely angers others, destroys trust in panel's fairness, signals intolerance. Harm stems purely from *knowledge*.
      *   **Verdict:** **No Grounds for Sanction.** *This is where your instinct (Hart) wins via the procedure. Devlin's "disintegration" fear fails Step 3 (no defensible shared standard) and Step 4 (harm speculative, enforcement likely counterproductive).*

  **What the Procedure CAN'T Do (Be Honest):**

  1.  **Resolve Deep Value Conflicts:** It makes disagreement explicit (Step 3/4) but doesn't magically solve if the co-op is fundamentally split. The GM vote looms.
  2.  **Prevent Bad-Faith Arguments:** Clever complainants/panelists can still try to frame disgust as "breach of trust" or inflate harm.
  3.  **Guarantee "Right" Answers:** On close calls (e.g., the T-shirt), reasonable people applying the steps might still disagree. It structures debate, not outcomes.
  4.  **Eliminate Gut Feeling:** Steps 3 & 4 *require* judgment. The procedure forces articulation and evidence, but judgment remains.
  5.  **Fix Vague Values/Bylaws:** It mitigates the problem but highlights the need for the co-op to clarify its core values and rules.
  6.  **Predict the Future:** Step 4's harm/enforcement assessment is inherently speculative, though it demands reasoning.
  7.  **Settle Philosophical Debates:** It operationalizes key distinctions but doesn't end the Hart-Devlin debate. The GM vote *is* the community deciding where it stands.

  **Confidence & Caveats:**

  *   **High Confidence:** The core structure (Steps 1->2->3->4->5) and distinctions (Victim/Agreement gateway; Moral Judgment vs. Disgust in Step 3; Empirical Harm/Enforcement assessment in Step 4) are load-bearing and essential. They force the Hart-Devlin tensions onto the table.
  *   **Least Confident Element:** **Step 4's "Enforcement Efficacy"** assessment. It's crucial (Hart's best point) but hardest for volunteers. Is punishing the reseller *really* likely to preserve fairness more than ignoring it? Does punishing the T-shirt *really* cause more division? This requires speculative cause/effect reasoning. Mitigation: Focus on *plausibility* and *consequences beyond appeasing complainants*.
  *   **Reconstruction/Application Caveats:**
      *   **Devlin's "Disintegration":** I've adapted it to "Serious Harm to Cohesion/Function" (Step 4). Devlin was focused on society's *existence*; for a co-op, it's about *viability as a voluntary association*. This is a necessary stretch – the core concern (enforcing shared morality to preserve the group) translates, but the stakes are lower.
      *   **Hart's "Public/Private" Distinction:** Hart was skeptical of legislating private morality *by the state*. Applying his harm principle/critiques to a *private, value-based association* is a stretch he might not fully endorse. The co-op *does* have a legitimate interest in its shared values as part of its "offering." The procedure tries to balance this by setting high bars (Steps 3 & 4) for enforcing purely moral standards without harm-to-agreements.
      *   **Moral Standards Source:** Hart emphasized critical morality vs. positive (popular) morality. Step 3 focuses on *defensibility* and *centrality to co-op identity*, not just popularity, attempting to bridge this. It's a simplification.
      *   **Enforcement Effects:** Hart's worry about pushing behavior underground/destroying trust is central to Step 4. Devlin largely assumed enforcement worked to preserve norms. The procedure explicitly challenges that assumption.

  **Final Word:** This procedure won't make the hard cases easy. It will make the reasoning harder to fake and force the panel to confront *why* they want to punish, using the best tools from Hart and Devlin. When the answer is unpopular (like the adult-content case), the written record will show *why* – based on lack of a core value violation and risks of enforcement – giving the GM clear grounds to uphold or overturn. It won't settle philosophy, but it will make your co-op's struggle with its own values more honest and auditable. Good luck.
