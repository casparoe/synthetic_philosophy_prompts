prompt: |-
  Consider an invented naming case. In 1908 a photographic plate survey entered a faint moving point of light in its catalogue as "Obj-9." In 2019 a team, unaware that the old entry existed, named the same body "Vantor" after a decade of tracking it. Both terms are used as ordinary names, so both rigidly designate the body; and Vantor is Obj-9. From this I have built an argument that appears to abolish the necessary a posteriori, and I cannot locate the slip.

  1. Any competent user of the name can know a priori that Vantor is Vantor.
  2. Since everything is necessarily self-identical, and identicals are substitutable salva veritate even in modal contexts when the terms are rigid, it is necessary that Vantor is Obj-9.
  3. The content of "Vantor is Vantor" and the content of "Vantor is Obj-9" are, on the direct-reference view, the same singular proposition p — a single object, standing in identity to itself; there is nothing else in either content to differentiate them.
  4. Epistemic status attaches to what is believed rather than to the words used to believe it: if p can be known without experience at all, then p can be known without experience, and every sentence expressing p inherits that status.
  5. Therefore "Vantor is Obj-9" is knowable a priori — and, by (2), knowable a priori to be necessary.
  6. Nothing in (1)–(5) depended on these names, this object, or this science. So every true identity between rigid designators is knowable a priori.
  7. The standard exemplars of the necessary a posteriori are all identities of exactly this form. So the category is empty: such truths are necessary and a priori, and a century of astrometry was not needed to know the one above.

  I am unwilling to accept (7), and equally unwilling to surrender the necessity of identity or the rigidity of both names, since those carry the rest of the picture I want to keep. So: which step fails? Identify it, explain what made it look unobjectionable, and then price the alternatives — for each way out you would seriously consider, say what it costs elsewhere in the theory of reference and modality, and whether the necessary a posteriori survives it in recognizable form or only as a re-labelled distinction.
reasoning: |-
  We are presented with an argument that seems to abolish the necessary a posteriori. The example involves two rigid designators, "Vantor" and "Obj-9", which both refer to the same celestial body. The argument concludes that every true identity between rigid designators is knowable a priori, which would eliminate the necessary a posteriori.

  Let's go through the steps and find where the mistake lies.

  1. **Any competent user of the name can know a priori that Vantor is Vantor.**  
     This is uncontroversial. The statement "Vantor is Vantor" is a logical truth and can be known without experience.

  2. **Since everything is necessarily self-identical, and identicals are substitutable salva veritate even in modal contexts when the terms are rigid, it is necessary that Vantor is Obj-9.**  
     This is also correct. If "Vantor" and "Obj-9" are rigid designators and they designate the same object in the actual world, then in every possible world they designate that same object. Hence, the identity is necessary.

  3. **The content of "Vantor is Vantor" and the content of "Vantor is Obj-9" are, on the direct-reference view, the same singular proposition p — a single object, standing in identity to itself; there is nothing else in either content to differentiate them.**  
     The direct-reference view (like that of Kripke) holds that the proposition expressed by an identity statement between two rigid designators is a singular proposition: the object that is the referent, and the relation of identity. Thus, both sentences express the same proposition p: the object O (which is both Vantor and Obj-9) is identical to itself.

  4. **Epistemic status attaches to what is believed rather than to the words used to believe it: if p can be known without experience at all, then p can be known without experience, and every sentence expressing p inherits that status.**  
     This step claims that the epistemic status (a priori or a posteriori) is a property of the proposition, not the sentence. Therefore, if one sentence expressing p is knowable a priori, then the proposition p is knowable a priori, and any other sentence expressing p must also be knowable a priori.

  5. **Therefore "Vantor is Obj-9" is knowable a priori — and, by (2), knowable a priori to be necessary.**  
     This follows from the previous steps: if the proposition p is knowable a priori (via "Vantor is Vantor"), and if "Vantor is Obj-9" expresses the same proposition, then it too is knowable a priori. And since we have established that it is necessary, then we can know a priori that it is necessary.

  6. **Nothing in (1)–(5) depended on these names, this object, or this science. So every true identity between rigid designators is knowable a priori.**  
     This is a generalization. The argument would apply to any pair of rigid designators that corefer.

  7. **The standard exemplars of the necessary a posteriori are all identities of exactly this form. So the category is empty: such truths are necessary and a priori, and a century of astrometry was not needed to know the one above.**  
     This concludes that the necessary a posteriori does not exist because all such identities are actually a priori.

  The problem must lie in step 4. Why?

  Step 4 claims that the epistemic status is attached to the proposition and not to the way it is expressed. However, this overlooks an important distinction: the way in which we come to know a proposition might depend on the way the proposition is presented to us. In other words, two sentences that express the same proposition might require different cognitive routes to be known.

  Specifically, the proposition that O is O (where O is the object) is known a priori when expressed as "Vantor is Vantor" because it is a logical truth. However, when expressed as "Vantor is Obj-9", we do not know a priori that these two names refer to the same object. We must rely on empirical evidence to discover that the object we call "Vantor" is the same as the object we call "Obj-9".

  Thus, while the proposition is the same in both cases, the cognitive access to that proposition is different. We can know the proposition under the mode of presentation "Vantor is Vantor" without any experience. But to know the same proposition under the mode of presentation "Vantor is Obj-9", we require empirical evidence.

  This is a standard response in the philosophy of language, often associated with Fregean senses or with two-dimensional semantics. The idea is that even though the proposition is the same, the way we grasp it (the "sense" or the "cognitive significance") is different. The epistemic status (a priori vs a posteriori) is not solely a property of the proposition but also of the way in which we apprehend it.

  Therefore, step 4 is too simplistic. It assumes that if a proposition is knowable a priori under one mode of presentation, then it is knowable a priori under every mode of presentation. But this is not the case.

  **Alternatives and Costs:**

  1. **Reject step 4: Epistemic status is not solely attached to the proposition but also to the way it is expressed (or the mode of presentation).**  
     - Cost: This requires introducing a level of meaning beyond the singular proposition, such as Fregean senses or cognitive modes of presentation. This complicates the direct-reference theory and may lead to a more nuanced view of meaning and reference. However, it preserves the necessary a posteriori: the identity is necessary, but we can only know it a posteriori because we need empirical evidence to link the two names to the same object.
     - The necessary a posteriori survives as a recognizable category: necessary truths that require empirical evidence to be known.

  2. **Deny that "Vantor is Vantor" and "Vantor is Obj-9" express the same proposition.**  
     - This would block step 3. One might argue that the two sentences express different propositions because the names themselves contribute differently to the proposition. However, this goes against the direct-reference view which holds that the proposition is singular and does not include the names or modes of presentation.
     - Cost: This would require abandoning the direct-reference theory and adopting a description theory or a Fregean theory of names. This would be a significant departure from Kripke's picture and would undermine the arguments for rigid designation and the necessary a posteriori.

  3. **Accept the conclusion and deny the necessary a posteriori.**  
     - This is a radical move. Some philosophers (like Nathan Salmon) have argued that the necessary a posteriori is not really a posteriori in the sense of requiring empirical evidence for the proposition, but rather that we have a posteriori evidence for the sentence. However, this view is not widely accepted because it seems to undermine the original insight that there are necessary truths that we can only know through experience.
     - Cost: It would require reinterpreting the entire debate about the necessary a posteriori, and it might not align with our intuitions about cases like "Hesperus is Phosphorus" or "Water is H2O".

  The most plausible way out is to reject step 4 by introducing the idea that modes of presentation matter for epistemology. This is consistent with Kripke's own view, as he acknowledged that while the proposition is necessary and a posteriori, the way we come to know it is through empirical investigation.

  Thus, the necessary a posteriori survives: we preserve the necessity of identity and the rigidity of names, but we recognize that knowing the identity requires empirical evidence because we must discover that the two rigid designators refer to the same object. The century of astrometry was indeed needed to know that Vantor is Obj-9, even though once we know it, we know a necessary truth.

  **Conclusion:**

  The slip is in step 4. It looks unobjectionable because we tend to think that if two sentences express the same proposition, then they must have the same epistemic status. However, this ignores the role of the linguistic expressions (or the modes of presentation) in how we come to know that proposition. The proposition that O is O is necessary and can be known a priori when presented in a trivial way (like "Vantor is Vantor"), but when presented in a non-trivial way (like "Vantor is Obj-9"), we require empirical investigation to know that the proposition is true.

  The cost of this way out is that we must accept that the epistemic status (a priori vs a posteriori) is not solely a property of the proposition but also of the way the proposition is accessed (i.e., the mode of presentation). This does not require giving up direct reference for semantics (the proposition is still singular) but does require a richer account of cognitive significance for epistemology.

  The necessary a posteriori survives in its recognizable form: there are necessary truths that we can only know through empirical investigation.
answer: |-
  The flaw in your argument lies in **step 4**, where you claim that epistemic status (a priori vs. a posteriori) attaches solely to the proposition itself, not to the linguistic expressions used to grasp it. This step overlooks a critical distinction in the epistemology of language: **how a proposition is presented or accessed** affects whether it can be known a priori. While "Vantor is Vantor" and "Vantor is Obj-9" express the same singular proposition (as per direct reference), they involve different **modes of presentation**—that is, different cognitive routes to the same referent. Consequently, the epistemic status of the proposition depends on the specific way it is formulated or apprehended.

  ### Why Step 4 Fails
  1. **Modes of Presentation Matter for Epistemology**:
     - The proposition ⟨O, identity, O⟩ (where O is the celestial body) is trivially knowable a priori when presented as "Vantor is Vantor" because it involves no new information—it is a logical truth requiring only understanding of the name "Vantor" and the concept of identity.
     - However, when the same proposition is presented as "Vantor is Obj-9," it requires knowing that "Vantor" and "Obj-9" corefer. Since the coreference is not given a priori (the names are distinct and their equivalence is opaque without empirical investigation), this mode of presentation cannot be known a priori. Competent users of "Vantor" and "Obj-9" must rely on experience to discover they designate the same object.
     - Thus, the epistemic status is not a property of the proposition alone but of the **proposition-under-a-description** or the **cognitive path** to it. Step 4 erroneously assumes that if a proposition is knowable a priori under one mode of presentation, it must be knowable a priori under all modes. This is false.

  2. **What Made Step 4 Seem Unobjectionable**:
     - Direct reference theories (e.g., Kripke) emphasize that the meaning of a rigid designator is its referent, so sentences with coreferring rigid designators express the same proposition. This semantic point is correct but does not extend to epistemology. The slippage occurs by conflating **semantic content** with **epistemic access**. While the proposition is identical, the **cognitive significance** differs: "Vantor is Vantor" is uninformative and trivial, whereas "Vantor is Obj-9" is potentially informative and requires empirical justification. Step 4 ignores this, treating epistemology as purely propositional rather than perspectival.

  ### Price of Rejecting Step 4: Theoretical Alternatives
  Rejecting step 4 preserves the necessary a posteriori but requires enriching the theory of reference and modality. Below are viable alternatives, with their costs:

  #### **Alternative 1: Adopt a Two-Dimensional Semantics**
  - **Description**: This framework (e.g., Chalmers, Jackson) distinguishes two intensions:  
    - The **primary intension** (epistemic dimension) captures how reference is fixed in a scenario (e.g., "Vantor" via 2019 tracking, "Obj-9" via 1908 photographic plates).  
    - The **secondary intension** (metaphysical dimension) captures rigid reference across possible worlds.  
    "Vantor is Obj-9" has a contingent primary intension (knowable only a posteriori) but a necessary secondary intension.
  - **Costs**:  
    - **Complexity**: Adds a layer to semantics, moving beyond pure direct reference. Critics (e.g., Soames) argue it overcomplicates or misrepresents Kripkeanism.  
    - **Controversy**: Hardcore direct-reference advocates reject two-dimensionalism as conflating meaning with epistemic access.  
    - **Survival of Necessary A Posteriori**: The category remains intact and recognizable. Truths like "Vantor is Obj-9" are necessary a posteriori because their primary intension is contingent and knowable only empirically, even though their secondary intension is necessary.

  #### **Alternative 2: Endorse Fregean Senses for Epistemology Only**
  - **Description**: Accept direct reference for semantics (propositions are singular) but invoke **Fregean senses** (modes of presentation) for epistemology. "Vantor" and "Obj-9" have different senses, so "Vantor is Vantor" and "Vantor is Obj-9" express the same proposition but under different senses. A priori knowledge requires trivial senses (e.g., identity via the same name), while a posteriori knowledge involves non-trivial senses (e.g., linking distinct names).
  - **Costs**:  
    - **Inconsistency with Pure Direct Reference**: Kripke explicitly rejects senses, so this hybrid approach may seem ad hoc. It risks reintroducing descriptivism through the back door.  
    - **Explanatory Burden**: Must clarify how senses are individuated without compromising rigidity.  
    - **Survival of Necessary A Posteriori**: The category survives robustly. The necessity of identity is preserved, but empirical work is needed to discover identities involving distinct senses.

  #### **Alternative 3: Defend a "Shallow" Necessity of Identity**
  - **Description**: Argue that while "Vantor is Obj-9" is metaphysically necessary, this necessity is **epistemically inaccessible** without empirical investigation. Necessity is a metaphysical property, but a priority is an epistemic property—they operate at different levels. Step 4’s error is assuming metaphysical necessity implies epistemic triviality.
  - **Costs**:  
    - **Limited Appeal**: This is less a "solution" and more a restatement of the problem. It doesn’t resolve why the same proposition can’t be known a priori under all descriptions.  
    - **Vagueness**: Fails to explain how epistemic access works, leaving a gap in the theory.  
    - **Survival of Necessary A Posteriori**: The category remains, but as a brute fact without deeper explanation. It may feel like relabeling rather than resolving the tension.

  ### Why Your Desired Framework Survives
  - **Necessity of Identity and Rigidity**: Both are preserved. Rigid designation ensures "Vantor is Obj-9" is necessary if true, and rejecting step 4 doesn’t threaten this.
  - **Necessary A Posteriori**: All alternatives retain it recognizably. In your case, "Vantor is Obj-9" is necessary (due to rigidity) but a posteriori (because discovering coreference requires empirical work—e.g., linking historical data to modern observations). The century of astrometry was essential to know the identity, as competence with the names alone doesn’t suffice.
  - **Cost-Benefit**: Alternative 1 (two-dimensionalism) is the most comprehensive fix but adds theoretical baggage. Alternative 2 (Fregean senses for epistemology) is elegant but less loyal to Kripke. Alternative 3 is minimalist but unsatisfying. All allow the necessary a posteriori to endure without relabeling.

  ### Conclusion
  Step 4 fails because it neglects the role of modes of presentation in epistemic access. The slip arose from conflating semantic content (where coreferring rigid designators express identical propositions) with epistemic status (which depends on how the proposition is linguistically or cognitively grasped). By rejecting step 4, you salvage rigidity, necessity of identity, and the necessary a posteriori. The cost is a modest expansion of the theory—e.g., adopting two-dimensionalism or Fregean senses for epistemology—but this is a price paid by most contemporary solutions to this puzzle. The necessary a posteriori emerges unscathed: it remains a category for truths that are metaphysically necessary but epistemically dependent on experience due to our cognitive limitations.
