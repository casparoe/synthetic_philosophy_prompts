answer: |-
  Here’s a structured teaching plan designed to build Spinoza’s democratic theory from the ground up, address misconceptions preemptively, and leverage your constraints effectively. The 80-minute session is divided into timed segments with explicit dependencies.

  **Core Pedagogical Constraint:**  
  *Maintain the 30-minute ban on "contract/consent/agreement."* This is essential. Spinoza’s "transfer of right" is *not* contractual but a reconfiguration of power relations. Introducing contract language early invites Hobbesian misreading. You sacrifice nothing critical in the first half-hour.

  ---

  ### **1. Sequence of Components (with Dependencies & Timing)**  
  **Total: 80 mins**  
  *(Dependencies in italics)*

  - **Min 0–15: Natural Right as Power (Causal Capacity)**  
    - **Key Move:** Define *right* (jus) as coextensive with *power* (potentia).  
      - Use whiteboard: **"Right = Power to Exist & Act"** (TTP Ch. 16).  
      - Clarify: Power ≠ violence (*potestas*). Power = *capacity* (e.g., "A fish’s right is to swim; a hawk’s to fly").  
    - *Dependency:* This is the *foundation*. Without it, "transfer of right" becomes Hobbesian.  
    - **Preempt Misconception:** "Might-makes-right" (crude interpretation).  
      - Contrast: Hobbesian self-interest vs. Spinoza’s *ontological* claim: "Right" is descriptive, not normative. What you *can* do *is* your right.  

  - **Min 15–25: Freedom as Internal Determination**  
    - **Key Move:** Freedom = being "determined by oneself" (TTP Ch. 16, Preface).  
      - Example: A stone in motion *thinks* it’s free. Real freedom is acting from one’s nature (e.g., a musician composing joyfully vs. under duress).  
    - *Dependency:* Requires prior grasp of *power*. Freedom is the *full expression* of power.  
    - **Preempt Misconception:** "Freedom = fewer laws."  
      - Stress: Laws enabling self-determined action *increase* freedom (e.g., traffic laws enable driving; repression *reduces* power).  

  - **Min 25–40: Democracy as the "Most Natural" State (PT Ch. 11, TTP Ch. 16)**  
    - **Key Move:** Democracy aligns sovereign power with collective power.  
      - Whiteboard: **"State’s Power = Sum of Citizens’ Power."**  
      - Argue: Non-democratic states artificially *constrain* collective power (monarch ≠ sum of subjects). Democracy minimizes alienation.  
    - *Dependency:* Requires *freedom as internal determination* (democracy maximizes conditions for it).  
    - **Preempt Misconception:** "Democracy = majority voting."  
      - Clarify: It’s about structural alignment of power, not decision rules. Majority rule is a *tool*, not the essence.  

  - **Min 40–55: Sovereignty’s Limits (TTP Ch. 20 + "Transfer of Right")**  
    - **Lift Vocabulary Ban:** Now introduce "transfer of right" — but frame as *convergence* of individual powers into collective power.  
    - **Carrying Case:**  
      - **Law A (Possible):** "Do not insult the sovereign." (Governs actions; enforceable).  
      - **Law B (Impossible):** "Believe the sovereign is divine." (Governs mind; unenforceable).  
      - Why? Minds cannot "transfer" their power of judgment (TTP Ch. 20). Sovereignty extends *only* to actions.  
    - *Dependency:* Requires *right=power* (sovereign’s power is limited by what power can actually control).  

  - **Min 55–70: Structural Exclusion (PT Ch. 11, §4)**  
    - **Key Move:** Exclusion is *not* ad hoc prejudice but a *test case* for "independence under law."  
      - Whiteboard: **"Who is *sui juris* (under own right)?"**  
      - Use Spinoza’s logic:  
        - **Premise:** Citizens must be *sui juris* (able to exercise power independently).  
        - **Claim:** Women/servants are "dependent" by social *potestas* (domination), not nature.  
        - **Concession:** Amazons prove women *could* be independent (PT 11.4).  
      - **Pedagogical Goal:** Show this is Spinoza’s *failure* to apply his own standard consistently — revealing tension in his empiricism vs. ontology.  
    - **Preempt Derailment:**  
      - Preframe: "This exclusion isn’t peripheral — it *tests* Spinoza’s core principle. Does his 'empirical' claim hold against his ontology?"  
      - If challenged: "Is 'dependence' here a *natural* limit (like a fish out of water) or a *social* one (like the Amazons disprove)? What would Spinoza’s *own* logic demand?"  

  - **Min 70–75: Check for Understanding**  
    - **Scenario:** "A sovereign commands all subjects to laugh daily. Does this increase or decrease their power? Why?"  
      - **Goal:** Tests grasp of power/freedom (forced laughter ≠ joyful laughter; command reduces power).  
      - **Trap:** Distinguishes Spinoza from Hobbes (Hobbes: obedience = security; Spinoza: irrational law = disempowerment).  

  - **Min 75–80: Deliberate Omissions**  
    - State clearly: "We’ve bracketed Spinoza’s *metaphysics* (e.g., *conatus* from *Ethics*) and his *institutional designs* for non-democracies. Why? To focus on *conceptual foundations*: how his theory of power reshapes freedom, sovereignty, and democracy."  

  ---

  ### **2. Addressing Misconceptions (Extended List)**  
  - **"Spinoza is a contractarian":**  
    - *When:* After introducing "transfer of right" (min 40).  
    - *Response:* "Hobbes’ contract *creates* sovereignty. Spinoza’s 'transfer' is a *recognition* of existing power convergence."  

  - **"Freedom means fewer laws":**  
    - *When:* During freedom discussion (min 20).  
    - *Response:* Use example: "Does a bridge without guardrails increase your freedom to drive? Or does it *limit* your power (by risking death)?"  

  - **"TTP Ch. 20 = modern free speech liberalism":**  
    - *When:* During sovereignty limits (min 50).  
    - *Response:* "Spinoza defends *philosophizing* (seeking truth), not 'speech' per se. Sedition (e.g., inciting violence) is still barred. It’s *epistemic*, not liberal individualist."  

  - **"Exclusion is inconsistency/prejudice":**  
    - *When:* During exclusion segment (min 60).  
    - *Response:* "Spinoza *admits* exclusion isn’t natural (Amazons!). This shows the *gap* between his ontology (all humans equally have natural right) and his sociology (women ‘dependent’). The tension is *instructive*."  

  ---

  ### **3. Why This Sequence Works**  
  - **Natural Right → Freedom → Democracy → Sovereignty Limits → Exclusion** builds *causally*:  
    - Right-as-power *enables* the definition of freedom.  
    - Freedom *requires* democracy as optimal power alignment.  
    - Democracy’s structure *exposes* sovereignty’s mind/action limits.  
    - Exclusion *tests* the theory’s internal coherence.  
  - The **carrying case** (Law A vs. Law B) does triple duty:  
    - Illustrates mind/action distinction.  
    - Shows why democracy minimizes impotent commands (sovereign knows collective capacity).  
    - Segues to exclusion: "Can the 'dependent' *really* align their power with the sovereign?"  

  ---

  **Final Tip:** If Rawls/Habermas arise, defer: "Spinoza isn’t seeking ‘fair procedures’ or ‘ideal speech’ but *power alignment*. Let’s see if his model satisfies their concerns *after* we grasp his framework." This honors their interest while keeping focus.
