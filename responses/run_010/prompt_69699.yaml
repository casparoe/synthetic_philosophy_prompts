prompt: |-
  You are a legal philosopher with practical experience advising statutory law-reform bodies. Think carefully before answering, and begin with a short, explicitly labelled brainstorming section in which you work out which distinctions from the underlying debate have to survive translation into an administrative procedure and which can be dropped without distorting the argument; only then present the deliverable itself.

  I am counsel to a law-revision commission in a common-law jurisdiction. Our enabling statute directs us to review the criminal code and, for every offence that prohibits conduct chiefly because the community regards it as wrong rather than because it demonstrably injures anyone, to recommend one of four dispositions: repeal outright; retain as it stands; downgrade to a civil or administrative penalty; or refer the file to the full commission as a question of values that the secretariat should not resolve on its own. Two clauses in the statute pull against each other. The first provides that no conduct may be criminalised solely on the ground that the community finds it immoral, indecent or offensive. The second provides that in reviewing existing offences the commission must have regard to whether abolition would tend to weaken standards that the community holds in common. We have roughly 130 candidate offences, fourteen months, and three staff — one with training in jurisprudence, two without. Each recommendation is drafted by a staff member, signed by me, and put to the five commissioners; the resulting report goes to a legislative committee and may be tested in judicial review, so every memo must carry its reasoning in two pages. Two commissioners hold that the second clause does most of the work and three that the first does, and the procedure has to be run day to day by the two staff members who have never read any jurisprudence and will not be reading any for this job.

  Write the procedure as a sequence of ordered steps. For each step, state the question in plain operational language, say what would count as a sufficient answer, and say which answers route the file to which disposition and which merely advance it to the next step. It must build in the difference between a communal feeling about a practice and a communal belief about what will happen if the practice is permitted, and it must say what evidence could settle the second question, what to do when there is none — which is the usual case — and how much weight the sheer longevity and prevalence of a standard can bear without the procedure collapsing into a rule that whatever has always been illegal stays illegal. Include steps that ask about the offence as it is actually enforced, rather than about the conduct in the abstract: who is charged, what the offence makes available by way of blackmail, extortion, entrapment or entry into private premises, and whether the enforcement pattern is so selective that the rule on the books is not the rule in operation. Mark explicitly every place where the procedure must stop and hand the question to the commissioners, and flag every step that is really a judgement call dressed up as a step. Ground the whole thing in the mid-century exchange between Patrick Devlin and H. L. A. Hart, and draw on other writers in that tradition where they sharpen a step; you may name ideas and positions where a name helps a commissioner see a step's pedigree, but paraphrase rather than quote, and do not append a bibliography, reading list or citations.

  Finally, run the procedure on three petitions and report the disposition for each. (a) A retained offence prohibiting sexual conduct between two consenting adults in private. (b) An offence prohibiting the desecration of, or commercial dealing in, human remains, where the petitioner's case is that the wrong is not owed to any identifiable victim and cannot be cashed out as injury. (c) An offence prohibiting the keeping of a brothel in a jurisdiction where the underlying acts are not themselves criminal, so that the question is whether the state may criminalise the organisation of conduct it has declined to criminalise. For each, state which steps did the work, where the procedure ran out of factual answers and had to fall back on something else, and whether the output is one this commission will dislike; for at least one of the three, say plainly that it is, and say why the procedure should not be adjusted to avoid it.
reasoning: |-
  Hmm, this is a complex request from a legal counsel working on criminal law reform. They need a step-by-step procedure based on the Devlin-Hart debate that can be applied by non-specialist staff to classify offences. 

  First I need to unpack the core tensions: the "immorality alone" prohibition versus "upholding communal standards" mandate. The Hart-Devlin framework is perfect here - Hart would reject moral enforcement without harm, while Devlin saw shared morality as society's glue. But we must operationalize this philosophical debate into concrete steps.

  The key distinctions that must survive translation:
  1) Harm-based vs morality-based prohibitions (Hart's core concern)
  2) Genuine communal standard vs transient disgust (Devlin's "disintegration thesis")
  3) Enforcement reality vs theoretical prohibition

  Distinctions we can safely drop:
  - Abstract debates about legal positivism vs natural law
  - Nuanced interpretations of "harm" (we'll use a practical threshold)
  - Historical context of the Hart-Devlin exchange 

  For the procedure, I'll need steps that:
  - Identify actual enforcement patterns (to filter zombie laws)
  - Distinguish between "this feels wrong" and "this erodes society"
  - Handle evidentiary gaps (common when assessing societal impact)
  - Prevent longevity from automatically justifying retention

  The petition examples are telling. The brothel case will test whether criminalizing organization of legal acts can stand - that's pure Devlin territory. The human remains offence forces us to confront non-injury based wrongs. And the sodomy law... well, that's the Hart-Devlin debate in microcosm.

  I'm designing steps that route clearly:
  - Step 1 kills "zombie laws" with no enforcement
  - Step 2 filters harm-based offences out of this procedure
  - Step 3-4 test Devlin's disintegration thesis with evidentiary demands
  - Steps 5-6 examine enforcement abuse risks
  - Only then do we reach the values judgment (Step 7)

  For commissioners who dislike certain outcomes, I'll need to explain why bending the procedure would violate its philosophical foundations. The human remains case might produce such tension - it's morality-based but deeply entrenched.

  The two untrained staff can handle this if the steps are concrete: "Check last 5 years of prosecution records" not "Assess moral substratum." Where judgment is unavoidable (Step 7), we route to commissioners explicitly.

  Applying this to the petitions:
  - The sodomy law fails at Step 2 (no demonstrable injury) but might clear Step 4 if evidence shows social cohesion impact. However, selective enforcement (Step 5) should doom it.
  - Human remains offence has no victim (Step 2) but longevity evidence (Step 4) might carry it to commissioners as a values call.
  - Brothel prohibition could stumble at Step 3 (no evidence of societal harm) and Step 6 (entrapment risks).

  The procedure must sometimes deliver uncomfortable results - that's the point of having rules rather than discretion. If we adjust it to protect sacred cows, we've resurrected the very moral enforcement the first clause forbade.
answer: |-
  ### Brainstorming
  The core tension requires distinguishing Hart's harm principle (criminal law should prevent tangible harm, not enforce morality) from Devlin's societal disintegration thesis (shared morality binds society; its erosion risks collapse). Key operational distinctions:  
  1. **Harm vs. Moral Wrongness**: Must separate conduct causing demonstrable injury (physical, psychological, economic) from conduct condemned *only* as "immoral." Hart’s position dominates Step 2.  
  2. **Enforcement Reality vs. Theoretical Prohibition**: Actual enforcement patterns (e.g., selective prosecution, blackmail potential) may reveal whether an offence functions as a moral signal or harm-prevention tool.  
  3. **Longevity vs. Evidence of Social Function**: Mere tradition cannot justify retention (per Hart), but Devlin allows considering whether abolition would *actively erode* cohesion. Must demand evidence beyond "it’s always been illegal."  
  4. **Predictive Community Belief vs. Moral Feeling**: "Weakening standards" (Statute Clause 2) requires evidence that permitting the conduct would *cause* societal harm, not just that people dislike it.  

  Droppable nuances:  
  - Abstract debates about moral relativism.  
  - Distinctions between "indecent" and "immoral."  
  - Hart/Devlin’s views on judicial vs. legislative roles.  

  ---

  ### Procedure: Offence Classification Protocol  
  **Step 1: Enforcement Reality Check**  
  *Question:* "In the past 5 years, has this offence been enforced (arrests, charges, convictions) in non-sting operations?"  
  *Sufficient Answer:* Prosecution data or police records.  
  *Routing:*  
  - **No enforcement → Recommend REPEAL** (zombie law).  
  - **Enforced → Proceed to Step 2**.  

  **Step 2: Demonstrable Injury Test**  
  *Question:* "Does the prohibited conduct directly cause non-speculative harm (physical, psychological, economic) to an identifiable person, beyond merely offending observers?"  
  *Sufficient Answer:* Medical studies, victim testimony, economic data. *If none, assume no injury*.  
  *Routing:*  
  - **Harm proven → RETAIN as is** (exits procedure).  
  - **No harm proven → Proceed to Step 3**.  

  **Step 3: Societal Harm Prediction**  
  *Question:* "Is there evidence that permitting this conduct would likely weaken a foundational societal standard (e.g., undermine family integrity, erode trust in institutions)?"  
  *Sufficient Answer:* Empirical studies (e.g., criminology, sociology), historical analogues. *Anecdotes or moral claims insufficient*.  
  *Routing:*  
  - **Evidence found → Proceed to Step 4**.  
  - **No evidence → Recommend REPEAL** (pure morality law).  

  **Step 4: Longevity & Social Function Weight**  
  *Question:* "Does the offence’s longevity (≥20 years) correlate with evidence it sustains a specific, indispensable social practice (e.g., burial rites), not just widespread disapproval?"  
  *Sufficient Answer:* Anthropological data, records of social rituals. *Tradition alone is insufficient*.  
  *Routing:*  
  - **Correlation proven → Proceed to Step 5**.  
  - **No correlation → Recommend DOWNGRADE** (non-criminal sanction).  

  **Step 5: Enforcement Abuse Risk**  
  *Question:* "Is enforcement prone to abuse (e.g., blackmail via threat of prosecution, discriminatory targeting, entrapment)?"  
  *Sufficient Answer:* Court records showing dismissed cases, sentencing disparities, or entrapment patterns.  
  *Routing:*  
  - **High risk → Recommend REPEAL** (weaponized law).  
  - **Low risk → Proceed to Step 6**.  

  **Step 6: Victimless Coordination Test**  
  *Question:* "Does the offence criminalize organizing/permitting conduct that is legal for individuals (e.g., brothels where sex work is legal)?"  
  *Sufficient Answer:* Comparison with individual liability statutes.  
  *Routing:*  
  - **Yes → Proceed to Step 7** (values judgment).  
  - **No → Recommend DOWNGRADE**.  

  **Step 7: Commissioner Referral (Judgment Call)**  
  *Question:* "Despite lacking harm or evidence of societal erosion, does the offence represent a non-negotiable communal standard?"  
  *Sufficient Answer:* None. Relies on commissioners’ assessment.  
  *Routing:*  
  - **Refer to FULL COMMISSION** for values determination.  

  ---

  ### Application to Petitions  
  **(a) Consensual Adult Sexual Conduct Offence**  
  - *Step 1:* Likely enforced historically, but assume recent non-enforcement → **Proceed**.  
  - *Step 2:* No demonstrable injury to participants → **No harm proven**.  
  - *Step 3:* No evidence legalization erodes society (per Hart; e.g., post-decriminalization studies) → **Recommend REPEAL**.  
  - *Where procedure faltered:* Step 3 (no evidence of societal harm). Relied on Hart’s harm principle.  
  - *Commissioner dislike?* Yes (2 commissioners favoring Clause 2). Procedure should *not* be adjusted: Allowing morality alone to justify criminalization violates Clause 1 and enables oppression (e.g., targeting minorities).  

  **(b) Desecration/Commercial Dealing in Human Remains**  
  - *Step 1:* Assume rare but extant enforcement (e.g., grave-robbing) → **Proceed**.  
  - *Step 2:* No identifiable victim → **No harm proven**.  
  - *Step 3:* No evidence trade in remains erodes society; may cause disgust but not collapse → **Proceed to Step 4**.  
  - *Step 4:* Longevity links to burial rites; anthropological data shows ritual dignity supports grief practices → **Proceed to Step 5**.  
  - *Step 5:* Low abuse risk (niche enforcement) → **Recommend DOWNGRADE** to administrative penalty (e.g., fines for improper handling).  
  - *Where procedure faltered:* Step 4 used longevity + social function evidence sparingly, avoiding Devlin’s "feelings" trap.  

  **(c) Brothel-Keeping (Individual Sex Acts Legal)**  
  - *Step 1:* Assume enforcement → **Proceed**.  
  - *Step 2:* No *inherent* harm from aggregation (cf. individual acts) → **No harm proven**.  
  - *Step 3:* No evidence brothels increase violence/disease vs. decriminalized solo work → **Proceed to Step 6**.  
  - *Step 6:* Criminalizes organizing legal conduct → **Refer to COMMISSIONERS** (Step 7 values call).  
  - *Commissioner output:* Likely retain (3-2 vote), but procedure forces explicit values justification.  
  - *Where procedure faltered:* Step 6 flagged coordination paradox. Step 7 requires commissioners to defend criminalization as a communal standard.  

  ---  
  **Final Note**: The procedure prioritizes Hart’s harm principle but routes unresolvable Devlin-esque disputes to commissioners. It prevents longevity from auto-justifying retention (Step 4’s evidence hurdle) and exposes enforcement biases (Step 5). Staff only apply Steps 1–6; commissioners handle Step 7.
