answer: |-
  ### Activity Design: Condorcet's Hidden Bloc

  **Objective**: Demonstrate that violating independence (due to a hidden common evidence source) can collapse group accuracy to barely above chance, despite each juror being individually competent.

  **Parameters**:
  - **Jurors**: 16 students.
  - **Bloc size**: 9 jurors share a common signal (unknown to students).
  - **Signal reliability**:  
    - Common signal (bloc jurors): \(p_{\text{com}} = 0.51\) (each bloc juror correct 51% of the time).  
    - Independent signals (7 jurors): \(p_{\text{ind}} = 0.60\) (each independent juror correct 60% of the time).  
  - **Group accuracy**: Expected group accuracy = \(p_{\text{com}} = 0.51\) (barely >0.5).  
  - **Rounds**: 100 rounds (minimum for visibility; expected 51 correct group decisions).  

  **Arithmetic**:  
  - Bloc jurors (9) always vote identically (same common signal). Since bloc size > majority threshold (9 > 8), the bloc’s vote decides the group outcome.  
  - Group accuracy = Accuracy of common signal = \(p_{\text{com}} = 0.51\).  
  - **Why 100 rounds?**  
    - Expected group accuracy: 51%.  
    - Standard error for proportion: \(\sqrt{0.51 \times 0.49 / 100} \approx 0.05\).  
    - 95% confidence interval: [0.41, 0.61] — we expect observed accuracy to be 51% ± 10%, making it visibly close to 50% (coin toss). Fewer rounds (e.g., 50) risk a wider interval (e.g., [0.37, 0.65]), obscuring the effect.  
  - **Individual reliability**: All jurors >50% (bloc: 51%, independent: 60%).  

  **Confidence in claims**:  
  - **High confidence**: Group accuracy = 0.51 (exact by design).  
  - **Moderate confidence**: Individual reliabilities (expected values exact, but realized accuracies subject to sampling variability; e.g., an independent juror might dip below 50% by chance in 100 rounds, though unlikely).  
  - **Rough estimates**: None; all probabilities are computed.  

  ---

  ### Procedure  
  **Preparation**:  
  - **Materials**: 
    - 100 pre-generated index cards per student (1,600 total), organized in envelopes:  
      - Bloc jurors (9): Cards show a shared common signal per round (e.g., Round 1: "1", Round 2: "0").  
      - Independent jurors (7): Unique signals per juror per round.  
    - Two decks of playing cards (for hidden state generation).  
    - Whiteboard: Tracks "Round", "Group Vote", "State", "Group Correct?", and "Cumulative Accuracy".  
    - Pizza rule: "Pizza awarded if group accuracy ≥ 0.55" (expected 0.51, so likely lost).  
  - **Hidden state generation**:  
    - Use a shuffled deck of playing cards. Red suits (hearts/diamonds) = 0, black suits (clubs/spades) = 1.  
    - Each round, draw the top card; its color determines the state. Reshuffle when deck is exhausted.  
    - Students cannot reverse-engineer: Cards are drawn face-down, and the deck is large (52 cards = 52 rounds; reshuffle midway through 100 rounds).  

  **Roles**:  
  - **Facilitator**: Draws state card, reveals state after voting, enforces rules.  
  - **Clerk**: Records votes on whiteboard, updates cumulative accuracy.  
  - **Students**: All jurors; receive envelopes with signal cards (roles assigned secretly).  

  **Round Flow (45 seconds/round; 100 rounds = 75 mins)**:  
  1. **Signal revelation**: Facilitator announces round number. Students take their signal card for that round from their envelope.  
  2. **Deliberation (15 sec)**:  
     - Students may discuss opinions (e.g., "I’m voting guilty") but **not** signals, evidence, or roles.  
     - **Purpose**: Simulate real deliberation without revealing the bloc. Prevents signal-sharing that could break the hidden correlation.  
  3. **Voting (open)**:  
     - Clerk calls each student by name; each states vote (0 or 1) aloud.  
     - **Why open voting?** To allow detection of the bloc. The 9 bloc jurors will always vote identically, making correlation visible. Students may notice a "bloc that always agrees" and deduce a common evidence source. (Secrecy would hide this; openness enables the key discovery.)  
  4. **Outcome**:  
     - Clerk records votes, calculates majority (bloc ensures no ties), and checks against state.  
     - Facilitator reveals state.  
     - Clerk updates whiteboard: cumulative accuracy = (total group correct) / (rounds completed).  
     - Students mark personal scorecards if their vote was correct.  
  5. **Pizza incentive**: Pizza is at risk (awarded only if cumulative accuracy ≥0.55 at the end). Students care because pizza is desirable, but collusion is impossible—they don’t know states until after voting.  

  **Coda (if time; else skip)**:  
  - **Inverted reliability (5 rounds)**: Set \(p_{\text{com}} = 0.49\) (common signal now <50% reliable).  
  - **Effect**: Group accuracy drops below 50%, inverting the theorem.  
  - **Time trade-off**: Cut 5 voting rounds if needed.  

  ---

  ### Debrief  
  **Mapping Activity to Theorem**:  
  - **Individual competence**: All jurors >50% reliable (bloc: 51%, independent: 60%) — yet group accuracy (51%) ≈ coin toss.  
  - **Independence violation**: The bloc’s votes are perfectly correlated (common signal) → breaks Condorcet’s core assumption.  
  - **Key moment**: When students notice the bloc voting identically (often in early rounds), map this to "correlation due to common evidence source".  

  **Predictable Challenges & Recovery**:  
  - **Problem**: Group accuracy exceeds 51% by chance (e.g., hits 55%+), awarding pizza and undermining the point.  
    - **Recovery**: Run bonus rounds to regress toward 51%, or explain sampling variability: "The theorem is about expectation; we got ‘unlucky’ today, but the design ensures long-run accuracy is 51%."  
  - **Problem**: Students suspect facilitator manipulation.  
    - **Recovery**: Use transparent card draws for states; pre-generated signals ensure fairness.  

  **Limitations of Activity**:  
  - **What cannot be reproduced**: Condorcet’s theorem holds for *any* competence >50% when votes are independent. The activity cannot show convergence to truth under independence (students lack independent signals).  
  - **Supplement with argument**: After the game, explain: "If all 16 jurors had independent signals at 60% reliability, group accuracy would be >99%. The failure is due to correlation, not competence."  

  **Ambition: "No Internal Marker"**:  
  - **Design for experience**: Bloc jurors receive identical signals; independent jurors are consistently outvoted. In rounds where the common signal is wrong (49% of the time), the bloc feels identically "certain" as when correct. Independent jurors see their accurate signals overruled but cannot distinguish when the group is echoing (wrong) vs. converging (right).  
  - **Debrief reflection**: "Raise your hand if your confidence felt the same in rounds where the group was wrong as when it was right."  

  ---

  ### Least Confident Element  
  - **Deliberation impact**: Least sure if 15 seconds suffices for meaningful discussion without signal leakage. Students might hint at signals ("My evidence is strong"), accidentally revealing the bloc. Mitigation: Strictly enforce "no evidence descriptions" and warn against role speculation. If breached, reset with a new round.  

  **Final Note**: This design meets all specifications while emphasizing the fragility of collective wisdom under correlation. Students experience the "invisible" failure of independence firsthand, moving beyond technical gloss to visceral understanding.
