answer: |-
  Below is a complete, tested design for your lunch-and-learn session. It uses a simulation game ("City Sentencing Simulator") to create an experiential understanding of the deterrence vs. desert conflict. The game avoids naming the philosophical views until the debrief and emphasizes the structural difference: deterrence looks at the *system* (crime schedule), desert looks at the *individual offender* (capping punishment per person). I've refined your mechanic to be more engaging and tractable within 75 minutes, while preserving your core insight.

  ### **Why This Design Works**
  - **Hands-on, not theoretical**: Participants actively set penalties and see consequences.
  - **Contradiction made visible**: The cap (desert stand-in) forces them to accept undeterred crimes that deterrence would have prevented, using the same cases.
  - **Debrief maps gameplay to philosophy**: Specific moments show how the two justifications diverge in practice.
  - **Scaled for realism**: Harm and probability values are calibrated so deterrence-based penalties feel "excessive" once the cap is introduced, creating tension.
  - **No scapegoating**: I exclude punishing innocents (though it’s the sharpest conflict) to avoid derailing the session. Instead, I inject the dilemma verbally in the debrief.

  ---

  ### **Game Overview**
  - **Premise**: The group runs a city’s sentencing office. Each round, they set penalties for new crimes. The goal is to minimize total harm (in "harm units") by deterring crimes. Midway, a "Fairness Act" caps penalties per person, forcing trade-offs.
  - **Key Conflict**: 
    - **Rounds 1–2 (deterrence focus)**: Penalties are set based on harm and catch probability. High-harm/low-probability crimes require extreme penalties to deter.
    - **Rounds 3–4 (desert focus)**: A penalty cap makes some crimes impossible to deter. Participants see the "cost" of the cap in undeterred crimes.
  - **Takeaway**: Deterrence and desert aren’t just about severity—they answer different questions: "What penalty deters this crime?" vs. "What penalty does this offender deserve?"

  ---

  ### **Roles, Materials, Setup**
  - **Participants**: 12–15 engineers/PMs. No roles—everyone deliberates together (encourages debate).
  - **Materials**: 
    - **Flip chart or whiteboard** to track penalties and results.
    - **Printed offense cards** (one set per round, 4 crimes per set).  
    - **Tokens** (e.g., red = harm, blue = prevention cost). Not essential, but make it tactile.
    - **Calculator** (for facilitator).
  - **Scoring Arithmetic**:
    - **Expected penalty** = Penalty × Probability of capture.
    - **Deterrence condition**: Crime is deterred if expected penalty ≥ harm. If not, crime occurs.
    - **Total harm per round** = Sum of harm for all undeterred crimes.
    - **Cumulative harm** = Running total across rounds (lower = better).
  - **Offense Design**:
    - Each crime has: **Name**, **Harm** (in units), **Capture prob** (p), **Base occurrence** (always 1 for simplicity).
    - Probabilities are low for high-harm crimes (making deterrence expensive).
    - Harm units are abstract (e.g., 1 unit = $10K in damages). Actual numbers balance realism and playability.

  ---

  ### **Offense Cards (4 sets, 4 crimes each)**
  **Round 1** (No cap)  
  1. Shoplifting: Harm 5, p=0.8  
  2. Burglary: Harm 20, p=0.6  
  3. Fraud: Harm 50, p=0.4  
  4. Arson: Harm 100, p=0.2  

  **Round 2** (No cap)  
  1. Vandalism: Harm 10, p=0.7  
  2. Auto Theft: Harm 30, p=0.5  
  3. Embezzlement: Harm 80, p=0.3  
  4. Insider Trading: Harm 200, p=0.1  

  **Round 3** (Cap = 150)  
  1. Robbery: Harm 40, p=0.6  
  2. Assault: Harm 60, p=0.4  
  3. Bribery: Harm 120, p=0.25  
  4. Terrorism: Harm 500, p=0.05  

  **Round 4** (Cap = 150)  
  1. Graft: Harm 30, p=0.5  
  2. Kidnapping: Harm 150, p=0.3  
  3. Data Theft: Harm 300, p=0.1  
  4. Sabotage: Harm 400, p=0.08  

  ---

  ### **Rules**
  1. **Objective**: Minimize cumulative harm over 4 rounds.
  2. **Each round**: 
     - Group reviews 4 crimes (on cards or board).
     - They set a penalty for each crime (no constraints in Rounds 1–2; penalties ≤150 in Rounds 3–4).
     - Facilitator calculates expected penalty and deterrence:  
       `Expected penalty = Penalty × Capture prob`  
       If `Expected penalty ≥ Harm`, crime is **deterred** (0 harm).  
       Else, crime **occurs** (full harm).
  3. **Scoring**:  
     - Total harm per round = Sum of harm for undeterred crimes.  
     - Record cumulative harm on the board.
  4. **Cap introduction**: After Round 2, announce: *"City Council passed the Fairness Act: No person may be penalized more than 150 units, regardless of crime. This takes effect immediately."*  
     - **Why 150?**: It’s high enough to deter mid-level crimes (e.g., Assault) but too low for high-harm/low-p crimes (e.g., Terrorism requires 500 / 0.05 = 1000 to deter). This creates tension.

  ---

  ### **Minute-by-Minute Timeline** (75 min total)
  - **0–5 min: Intro**  
    - *Facilitator:* "You run the city’s sentencing office. Your job is to set penalties for crimes to reduce harm. Each round, you’ll see new crimes with harm and capture probability. Set penalties—we’ll calculate outcomes. Goal: Minimize total harm across 4 rounds."  
    - **Don’t explain deterrence/desert or math**. Start gameplay immediately.

  - **5–15 min: Round 1**  
    - Present Round 1 crimes. Group debates penalties (5–7 min).  
    - Calculate outcomes (2 min):  
      - *Example:* If Arson penalty = 400, expected penalty = 400 × 0.2 = 80 (<100 harm) → not deterred.  
      - Record harm on board.  
    - **Predictable issue**: Group may under-penalize high-harm/low-p crimes (e.g., set Arson penalty=150 → expected=30 <100 → undeterred). *Steer by asking:* "Will that penalty make someone think twice?"

  - **15–25 min: Round 2**  
    - Present Round 2 crimes. Group sets penalties (5–7 min).  
    - Calculate outcomes (2 min).  
    - **Key moment**: Insider Trading (harm=200, p=0.1) requires penalty ≥2000 to deter. If they set high (e.g., 2500), it deters; if low, it occurs.  
    - **Predictable issue**: Debate over "fair" penalties. *Steer by reminding:* "Remember, harm is the goal—what stops this crime?"

  - **25–30 min: Introduce Cap**  
    - Announce: "Council passed Fairness Act: Max penalty = 150 per person. Use this for Rounds 3–4."  
    - **No debate**—move to Round 3.

  - **30–40 min: Round 3**  
    - Present Round 3 crimes (with cap). Group sets penalties ≤150 (5–7 min).  
    - Calculate outcomes (2 min).  
    - **Key moment**: Terrorism (harm=500, p=0.05) max expected penalty = 150 × 0.05 = 7.5 (<500) → **never deterred**. Group sees high harm (500) they can’t prevent.  
    - **Predictable issue**: Frustration at cap. *Steer by noting:* "You’re constrained by law—work with it."

  - **40–50 min: Round 4**  
    - Present Round 4 crimes (cap remains). Group sets penalties (5–7 min).  
    - Calculate outcomes (2 min).  
    - **Key moment**: Data Theft/Sabotage can’t be deterred (require penalties >1500). Cumulative harm spikes.  
    - Report final cumulative harm.

  - **50–75 min: Debrief** (25 min)  
    **Structure**:  
    1. **Experience first** (5 min): Ask:  
       - "What strategy worked early on?" (Likely: set high penalties for low-p crimes).  
       - "How did the cap change things?" (They couldn’t deter Terrorism/Sabotage).  
       - "What felt unfair?" (e.g., "We had to let Terrorism happen!").  
    2. **Name the views** (5 min):  
       - "Two ways to justify punishment:  
         - **Deterrence**: Set penalties to prevent future crime. You did this in Rounds 1–2 by pricing crimes at harm ÷ p.  
         - **Desert**: Set penalties based on what the offender deserves. The cap (150) was a stand-in—it says no one deserves >150, no matter the crime."  
    3. **Map gameplay to philosophy** (10 min):  
       - "Notice the structural conflict:  
         - In Round 2, **deterrence** looked at the whole schedule: Insider Trading required 2000 penalty to deter, even if it felt excessive.  
         - In Round 3, **desert** looked at the offender: The cap said ‘no one deserves >150,’ so Terrorism occurred.  
         Same crime (high-harm/low-p), different answers because they answer different questions."  
       - Highlight: "It’s not about totals—desert fixes the penalty per offender; deterrence fixes it per crime type."  
    4. **Introduce scapegoating** (3 min):  
       - "One conflict we avoided: What if punishing an innocent person deterred a crime? Deterrence might say ‘yes’ if it prevents harm; desert says ‘never’—innocents don’t deserve it. That’s the sharpest version of this tension."  
    5. **Limitations** (2 min):  
       - "This game can’t capture three real-world elements:  
         - **The offender’s experience**: Numbers ignore suffering—desert is about moral blame, not harm units.  
         - **Moral intuitions**: We didn’t feel outrage at under-punishing Terrorism or sympathy for the offender.  
         - **Unquantifiable harms**: Real crimes (e.g., murder) have dignity costs beyond units."  
       - Conclude: "Real sentencing debates hinge on these human elements—the game shows the structural clash."

  ---

  ### **Predictable Problems and Steering Tips**
  1. **Problem**: Group ignores probability and focuses only on harm.  
     - **Steering**: After Round 1, say: "For Arson, you set penalty=X, but expected penalty was X×0.2=Y. Since Y<100, it wasn’t deterred. How could you adjust?"  

  2. **Problem**: Penalty debates stall (analysis paralysis).  
     - **Steering**: Enforce time limits. Use a visible timer. Push for majority votes.  

  3. **Problem**: Cap feels arbitrary or frustrates players.  
     - **Steering**: In debrief, link it to desert: "The cap mirrors real arguments—e.g., ‘life imprisonment is max, even for terrorism.’"  

  4. **Problem**: Low engagement from non-debaters.  
     - **Steering**: Assign a "calculator" role to quiet members. Use tokens for harm (red) and prevention (blue) to make it tactile.  

  5. **Problem**: Math errors confuse outcomes.  
     - **Steering**: Pre-calculate examples. Use a calculator app projected on screen.  

  6. **Problem**: Scapegoating question derails early.  
     - **Steering**: If raised, say: "We’ll discuss that in debrief." Then address it as the "extreme case."  

  ---

  ### **Why No Scapegoating in Gameplay?**
  I excluded punishing innocents despite its philosophical power because:  
  - It risks overshadowing the core deterrence/desert conflict.  
  - It could trigger excessive debate or discomfort in a work setting.  
  - The cap already forces the key insight: desert limits *per-person* punishment, even at a cost.  
  - **Compromise**: Introduce it in debrief as the "unresolved extreme."  

  ---

  ### **What the Game Cannot Reproduce**
  - **The moral dimension**: The game uses abstract harm units and ignores the offender’s humanity. Desert-based punishment isn’t just about caps—it’s about *deserved suffering* based on blameworthiness. Likewise, deterrence ignores retributive justice.  
    - **How to supply this**: In debrief, ask: "What’s missing? Would you set a 150 penalty for murder if it deterred? Why not?" Then contrast with the game’s numbers.  

  This design ensures participants *feel* the conflict through trade-offs, setting up a rich debrief. It fits your constraints and leverages group collaboration. Run it as-is, and you’ll have engineers debating desert theory over lunch!
