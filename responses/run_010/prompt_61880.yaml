  Round 3:
  1. Robbery: Harm 50 units, catch prob 0.5, base occurrence 1.
  2. Assault: Harm 10 units, catch prob 0.9, base occurrence 1.
  3. Corruption: Harm 500 units, catch prob 0.1, base occurrence 1.
