  1. The game has 4 rounds.
  2. In each round, the group is presented with 4-5 offenses (each with: description, harm amount, catch probability, and base occurrence count).
  3. The group sets a penalty for each offense type (in dollars).
  4. For each offense type, the expected penalty is calculated: penalty * catch probability.
