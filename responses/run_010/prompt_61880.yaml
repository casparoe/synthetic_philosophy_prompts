  6. The total harm for the round is the sum of (number of crimes that occurred * harm) for each offense type.
  7. The city's "success" is measured by the total harm prevented (which is the base harm that would have occurred without any deterrence minus the actual harm). But we can also track the total harm incurred per round.

  Alternatively, we can think of the base occurrence as the number that would occur if there was no penalty. Then, if not deterred, that base number occurs. We can pre-calculate the base harm for the round (if no penalties) and then the actual harm is the sum of (number of crimes * harm) for only the undeterred offenses.

