  The game uses invented numbers and abstract harms. It does not capture the moral experience of punishment: the suffering of the punished person, the injustice of punishing an innocent, the retributive intuition that some acts deserve punishment regardless of consequence. Also, in the game, the group is setting penalties for types of offenses, not for individual offenders. The desert-based view often focuses on the individual's culpability and the proportionality of the punishment to the wrong done. The game reduces everything to harm and catch probability, which is a simplification.

  In the debrief, we must highlight that the desert-based view is about the offender's blameworthiness and that there are intrinsic limits to punishment regardless of social benefit. The game's ceiling is a stand-in for that, but in reality, the desert-based limits are not arbitrary but tied to the severity of the offense.

  **Detailed Minute-by-Minute Timeline:**

