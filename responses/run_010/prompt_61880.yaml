prompt: |-
  I run an informal lunch-and-learn at a software company: 12 to 15 engineers and product managers, one 75-minute session, nobody in the room has taken a philosophy class. I want a hands-on activity that gets them to feel the difference between justifying punishment by what it deters and justifying it by what the offender deserves. No lecture beforehand, and neither view gets named until the debrief.

  The mechanic I have in mind — refine it or replace it if you can do better: the group runs a city's sentencing office over four rounds. Each round they receive a handful of offenses, each with a stated harm figure and a stated probability of actually catching the offender, where the costly-to-detect ones do the most damage. They set a penalty per offense type, and the city's next-round crime rate is computed from the expected penalty, which should quietly push them toward pricing a crime at its harm divided by its catch probability. Halfway through, impose a hard ceiling on how much any single person may be penalized no matter what it would deter, and let them play long enough to see what that ceiling costs in crime prevented. What I want them to walk away seeing is that the two views do not merely disagree about totals: one fixes a sentence by looking at this offender in isolation, the other by looking at the whole schedule, and those give contradictory answers on the very same cases.

  Please include roles, rules, materials (paper and tokens are fine, no real money), the exact scoring arithmetic for the city, a minute-by-minute timeline, a debrief that maps specific moments in play onto the distinction, and an honest list of what predictably goes wrong the first time this is run and how to steer it. Two further requests. Decide whether to offer the group the option of penalizing someone they know is not the offender when catching the real one is too expensive; I suspect it is the sharpest moment available, but I do not want the session to collapse into that one shock. And tell me plainly which feature of the real disagreement the game cannot reproduce — the numbers are invented and nobody in the room is the one being punished — so I know what I have to supply by hand afterward.
reasoning: |-
  We are designing a simulation game for a lunch-and-learn session to illustrate the difference between deterrence-based punishment and desert-based punishment. The game will have the group act as a city's sentencing office over four rounds. The key mechanic is that in the first two rounds they set penalties without a cap, and then in the last two rounds they have a hard ceiling on penalties. The goal is for them to experience how the ceiling (representing desert-based limits) affects the crime rate.

  Key elements:
  - Offenses: Each offense has a stated harm (in dollars) and a probability of catching the offender (p). The expected cost to the offender is penalty * p. For deterrence, we want expected cost >= harm, so penalty >= harm / p.
  - The group sets a penalty for each offense type per round.
  - The city's crime rate in the next round is computed based on the expected penalty (penalty * catch probability). If the expected penalty is less than the harm, then the crime occurs at a base rate. If the expected penalty is greater than or equal to the harm, the crime is deterred and doesn't occur.

  However, we want to simulate a population of potential offenders. We can do this by having a fixed set of offense types and for each offense type, a base number of crimes that would occur if undeterred. Then, in the next round, the number of crimes of that type that occur is the base number if undeterred, or zero if deterred.

  But to make it more dynamic, let's assume that the base number of crimes is fixed per round? Alternatively, we can have the same set of offenses appear each round, and the group sets penalties for each type. Then, for the next round, we compute which crimes are deterred.

  We need:
  - A list of offense types with:
     - Harm (H)
     - Catch probability (p)
     - Base occurrence (number of such crimes that would occur if not deterred) - but to keep it simple, we can have each offense type represented by one instance per round? Or multiple? Let's have each offense type have a fixed base occurrence count per round (say 1 to 3, for simplicity).

  Alternatively, we can abstract the numbers and use tokens to represent crimes. But for a 75-minute session, we can use paper and pencil and a simple table.

  Proposed structure:

  **Roles:**
  - The entire group (12-15 people) will act as the sentencing council. They can discuss and then set penalties for each offense type by consensus or by vote.

  **Materials:**
  - A whiteboard or flip chart to record the penalty schedule and results.
  - Handouts for each round: one sheet per round listing the offenses for that round (with harm, catch probability, and base occurrence count).
