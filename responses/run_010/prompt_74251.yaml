answer: |-
  **MEMORANDUM**  
  **TO:** Members, Public Art Commission  
  **FROM:** [Your Name], Lay Commissioner  
  **DATE:** October 7, 2023  
  **SUBJECT:** Recommendation: Disposition of Untitled Clay Sculpture (1974), Central Library Atrium  

  ---

  ### **I. Background & Urgency**  
  The untitled clay sculpture (1974) in the library atrium faces irreversible material failure. Conservator findings confirm: unfired clay and corroded armature preclude conventional restoration. Without action, the work will collapse within 3–6 years. The commission must select one of four options at the October 14 meeting.  

  ### **II. Options Summary**  
  1. **Preserve Decay:** Slow deterioration via climate case + interpretive text.  
  2. **Estate-Authorized Replacement:** Fabricate successor using ≥10% original material (per 1996 certificate).  
  3. **Gradual Consolidation:** Chemically stabilize + replace armature/clay incrementally over 18 months (on-site).  
  4. **Facsimile Display:** 3D-scan/print replica for atrium; retire original to storage.  

  ### **III. Recommendation: Option 4 (Facsimile Display)**  
  **Execute an exact facsimile for public display; relocate the original to archival storage.**  
  **Rationale:**  
  - **Honors Legal & Ethical Constraints:** Complies with the deed of gift ("preserve the sculpture itself") by retaining the original object, while acknowledging that *public display* of the decaying work is unsustainable. The replica ensures public access to the artwork’s form.  
  - **Avoids Authenticity Quagmires:** Options 2 and 3 force contested philosophical choices about material identity. Option 1 misrepresents uncontrolled decay as artistic intent.  
  - **Pragmatic & Transparent:** Buys time for future conservation tech; clearly separates original from display object.  
  - **Schedule:** Scan by December 2023; install replica by June 2024. Storage protocol for original by November 2023.  

  ---

  ### **IV. Critical Assumptions Underlying Recommendation**  
  1. **The "Work" ≠ Its Material Alone.**  
     The sculpture is a *specific historical artifact* (the 1974 object), not an abstract form infinitely replicable. While the replica captures its appearance, it cannot inherit its provenance or material history.  

  2. **Material Thresholds Are Legally Meaningless.**  
     The deed and insurance policy bind us to the "original fabric." Replacing >90% (Option 3) or incorporating 10% (Option 2) abandons this fabric. Philosophically, no "essential" quantity of original matter exists—only total retention or total loss.  

  3. **Public Display Obligation ≠ Preservation Obligation.**  
     The library atrium requires an enduring visual experience. The original cannot provide this; a facsimile can. Preservation of the original is achieved through archival storage, not exhibition.  

  ---

  ### **V. The Strongest Case Against Option 4 (Presented Fairly)**  
  **Opposing View:** *Options 2 or 3 preserve the work’s continuity.*  
  The sculpture is a *process*, not a static object. The artist’s 1996 certificate explicitly endorsed successor fabrication (Option 2), rendering the "original" clay incidental. Gradual consolidation (Option 3) respects the work’s evolution—akin to Theseus’ ship. Destroying/replacing parts over time *is* the artwork’s lifecycle. Option 4 falsely severs the artwork from its history, reducing it to a digital copy. The replica is a forgery; the stored original becomes irrelevant rubble. The deed’s spirit demands active stewardship of the artwork’s *being*, not its corpse.  

  ---

  ### **VI. Analysis of Key Issues**  
  **A. The 10% Original Material Clause (Option 2): Ceremonial, Not Philosophical**  
  - The requirement to blend 10% original matter is **symbolic ritual**, not ontological necessity.  
  - **Dispersal vs. Concentration:** Irrelevant. A single grain of original clay in the head confers no greater "authenticity" than dispersed particles. The clause merely performs reverence for the past; it does not bridge the gap between original and copy.  

  **B. Legal Uncertainties**  
  - **Moral Rights (Attribution/Integrity):** Counsel confirms these rights *may* persist posthumously. Option 4 risks an integrity claim if the replica misrepresents the artist’s vision. *Mitigation:* Label the replica explicitly as a "conservation facsimile."  
  - **Insurance Payout:** Storing the original likely avoids a "loss" trigger. Confirm with insurer.  

  **C. Option 2 vs. Option 3: A False Dichotomy**  
  Both replace original matter. The dispute over "speed of substitution" is semantic:  
  - Option 2 (sudden replacement) relies on the estate’s authority.  
  - Option 3 (gradual replacement) relies on conservation ethics.  
  Neither preserves the 1974 fabric. The commission’s split on this issue underscores its intractability.  

  ---

  ### **VII. Risks & Contingencies**  
  - **Estate/Donor Objections:** Engage estate on replica labeling; emphasize original’s physical preservation.  
  - **Public Confusion:** Install interpretive signage explaining the facsimile’s purpose.  
  - **Premise Risk:** This recommendation assumes the *artist’s intent* is secondary to *material reality*. If the commission believes intent overrides decay (e.g., the artist welcomed entropy), Option 1 becomes defensible. I judge this unlikely given the deed’s terms.  

  ---

  ### **VIII. Motion for October 14 Vote**  
  “Approve Option 4: Commission a 3D-printed facsimile for permanent atrium display; relocate the original sculpture to dark, climate-controlled storage with monitored decay; allocate $35,000 from the Conservation Fund for scanning, fabrication, and signage.”  

  ---  
  **Word Count:** 985  

  ---  
  **DRAFT NOTE:** This memo prioritizes legal defensibility, transparency, and separation of preservation from display. It rejects performative material fetishism (10% clause) while honoring the physical artifact’s irreplaceability. For your novel, it frames the debate as: *Is art a body or a soul?*—a tension your characters can weaponize.
