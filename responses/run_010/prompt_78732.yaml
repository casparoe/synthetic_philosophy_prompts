  ## MEMO: Recommendation on Scattered-Site Master Lease Renewal

  **To:** Housing Authority Board Members  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation: Renew Master Lease with Landlord [Name/Landlord Entity] *with Critical Conditions*

  **Recommendation:** Renew the five-year master lease with the incumbent private landlord **conditional upon the removal of the "no-cause, 30-day termination" clause for individual tenancies and its replacement with a "for-cause only" termination standard.** If the landlord refuses this condition, I recommend **not renewing** and pursuing alternative solutions for the full cohort, including negotiation with the nonprofit and exploring bridge funding/other landlords.

  ### Reasoning & Key Considerations

  1.  **The "No-Cause" Power Itself is a Significant Harm, Even Minimally Used:**  
      *   **Insecurity & Chilling Effect:** The mere existence of this power fundamentally undermines tenant security. Tenants live with the knowledge their housing can be terminated arbitrarily within 30 days. This creates pervasive insecurity, deterring legitimate complaints about repairs or other issues (evidenced by the two known instances targeting complainants). Fear of retaliation stifles the tenant voice essential for maintaining habitable conditions.  
      *   **Power Imbalance:** It entrenches an extreme power imbalance. Tenants effectively have no guaranteed lease term, making them vulnerable to pressure or unspoken demands, regardless of whether the power is exercised frequently.  
      *   **Past Use Confirms the Risk:** The two documented uses targeting complainants demonstrate the clause *can* and *has been* used retaliatorily. While the landlord offers an alternate explanation for one, the pattern raises serious concerns about misuse. "Only twice in nine years" does not negate the harm caused in those instances or the ongoing deterrent effect. It proves the clause *is* available for misuse.

  2.  **Tenant Satisfaction Survey is Inadequate on This Specific Issue:**  
      *   A 78% overall satisfaction rate is positive but does not specifically address the *security of tenure* provided by the lease terms. Satisfaction with current conditions or management responsiveness does not equate to feeling secure against arbitrary eviction.  
      *   The survey neither asked about awareness of this clause nor feelings of security related to it. Fear of retaliation could itself suppress negative responses on related issues. We cannot infer tenant approval of this specific harmful clause from a general satisfaction metric.

  3.  **The Strongest Case for Renewal (Avoiding Displacement) is Compelling but Flawed:**  
      *   **Staff Position Validity:** Preventing displacement for 80 families is an absolutely critical and urgent priority. The landlord's operational history (aside from the clause) seems acceptable, and the clause *is* rarely invoked *in practice*. Maintaining continuity for 200 households is a paramount benefit.  
      *   **The Flaw:** Accepting this clause to avoid displacement trades one harm (immediate loss of housing for 80) for another (ongoing structural insecurity and vulnerability for 200). It normalizes a fundamentally unjust power dynamic within our subsidized housing program. We have a duty to provide *secure* housing, not just housing contingent on landlord discretion.

  4.  **The Nonprofit Alternative: Pros, Cons, and Limitations:**  
      *   **Pros:** Fixed-term, cause-only leases provide vastly superior tenant security and align with best practices for stable housing. Their model directly addresses the core harm of the existing clause.  
      *   **Cons:** The 9% higher cost per unit is a significant budget challenge requiring serious consideration. The inability to serve all 200 households (only 120 units) creates an unacceptable immediate crisis for 80 families. This is the primary barrier to outright acceptance.

  ### Recommendation Rationale & Conditions
  Renewing *with the condition* of removing the no-cause clause balances the critical needs:
  *   **Preserves Housing for All 200:** Avoids the immediate, catastrophic displacement of 80 families.
  *   **Eliminates the Core Harm:** Replacing the clause with a for-cause standard directly addresses the insecurity, power imbalance, and potential for retaliation. It transforms the lease into one providing genuine security.
  *   **Addresses Past Misuse:** Prevents future retaliation like the documented cases.
  *   **Leverages Renewal Power:** We have maximum leverage *now* to negotiate this essential change during renewal. Securing this protection for five years is a major win for tenant stability.
  *   **Pragmatic & Achievable:** This is a concrete, specific change focused solely on the problematic clause. The landlord's acceptance of this condition would demonstrate a commitment to fairer practices consistent with the HA's mission.

  **If Condition is Rejected:** Renewal without removing this clause institutionalizes a harmful power dynamic we should not endorse. Non-renewal would then force:
  1.  Urgent pursuit of the nonprofit for 120 units.
  2.  Aggressive identification of alternative landlords/properties for the remaining 80 units, potentially using bridge funding or short-term solutions.
  3.  Transparent communication and support plans for all affected tenants.

  ### Conclusion
  While the imperative to avoid displacing 80 families is immense, we must not achieve it by accepting lease terms that inherently undermine tenant security for all 200. The existence of the no-cause eviction power *is* a significant harm, creating fear and vulnerability even when dormant. The two past uses confirm its potential for abuse. The satisfaction survey does not mitigate this specific risk. **Conditional renewal demanding removal of the no-cause clause is the most responsible path: it protects current residents from displacement *and* provides them the fundamental security they deserve.** I urge the Board to support this approach.
