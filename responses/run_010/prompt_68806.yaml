prompt: |-
  Ok so I'm two years into a philosophy PhD and my quals prospectus is due in about six weeks — the committee is one just war person, one person who does rights theory and liability, and one philosophy-of-law person who thinks this whole area is a mess. Here's the half-baked thing I keep circling. The moral equality of combatants fight is always set up as binary: either combatants on both sides have the same permissions and the same liability regardless of whether their war is just (the traditional, Walzer-ish line), or the revisionists are right that liability tracks whether what you're doing actually contributes to an unjust threat, so symmetry is a moral myth that only survives as a legal convention. What bugs me is that both sides argue as if "combatant" picks out one morally homogeneous kind. It obviously doesn't. A conscripted nineteen-year-old infantryman, a logistics NCO moving fuel, an intelligence analyst who tasks strikes, a drone pilot on the other side of the planet, a cyber operator, a staff officer who signs the operations order — these differ wildly in how directly their action constitutes a threat, how much they know, and how much risk they personally run. And I have a suspicion that a lot of the intuitive pull of the traditional view is actually coming from that third thing, from reciprocity of risk: we feel bad saying the guy who's about to be shot at was acting impermissibly, partly because he's in the same boat as the guy shooting at him. If that's right, the traditional view isn't exactly false, it just has a hidden premise that only applies to a subset of combatants, and a graded picture falls out of it.

  What I want from you is help turning this into an actual prospectus, roughly 1800 words, that I could hand those three people without getting torn apart. So: state the research question in a form that has a determinate answer and isn't just "is the moral equality of combatants true?" — something like "is there a principled, non-ad-hoc basis for grading combatant liability by role, or does any such grading collapse into either full symmetry or full revisionism?" but sharpened much better than that. Then explain why the two existing camps genuinely leave this open rather than having already answered it, because the revisionist will just say "obviously, that's what contribution-tracking liability means" and I need a reason my question isn't trivially theirs. Then the method: what I'd actually do week to week, which cases I'd fix as a standing test set, what the conceptual machinery is, and why that method rather than the obvious alternatives (empirically surveying soldiers' intuitions; rebuilding liability theory from scratch; going the legal route, though note that IHL basically makes status turn on membership in the armed forces with medical and religious personnel carved out, so I can't just borrow its categories). Then say what a successful result looks like and, just as importantly, what would make me junk the project — what finding would show the graded view is unstable. And give me an honest scope check for one semester plus the following summer. No bibliography and no reading list, I'll add the citations myself, and please don't invent any: talk about positions and arguments, not about papers.

  You're the expert in this one — treat it as if you've sat on a dozen of these committees and know exactly where prospectuses like mine fall apart. Before you draft anything, spend the first part of your answer brainstorming out loud: give me three or four ways the question could be sharpened, say which is most defensible and why, and flag anywhere my framing is confused or the idea is less original than I'm hoping. Then write the prospectus. Think hard about whether reciprocity of risk can really carry the weight I'm putting on it or whether it's just doing rhetorical work — I'd rather hear that from you now than from the liability person on my committee in six weeks. There's also a seperate worry you should engage with: if grading works, does it hand states a recipe for structuring their militaries so that most of their people buy moral immunity? That might be a feature or a fatal flaw and I cant tell which.
reasoning: |-
  Okay, the user is a philosophy PhD student preparing their qualifying exam prospectus on the moral equality of combatants. They've identified a gap in the existing literature where both traditional and revisionist views treat "combatant" as a homogeneous category, which clearly isn't the case in modern warfare. Their key insight is that reciprocity of risk might be the hidden factor making the traditional view intuitively appealing.

  Hmm, the user's framing needs tightening - they're right that revisionists would claim their view already covers role-based liability. The challenge is showing this isn't trivial by demonstrating how current revisionist frameworks fail to systematically address the combatant heterogeneity they've identified. Their reciprocity of risk hypothesis is provocative but needs careful handling - it might be more about moral psychology than liability foundations.

  Three potential angles for sharpening the question occur to me: First, focusing on whether reciprocity explains the intuitive appeal of symmetry. Second, examining how role variations affect liability criteria. Third, testing if reciprocity should be incorporated into liability assessments. The second seems strongest - it's philosophically substantive while accommodating their empirical observations about combatant diversity.

  Important red flags: That reciprocity point could easily get shredded by their committee's rights theorist unless grounded in established liability frameworks. Also need to address whether grading liability might incentivize risk-avoidant military structures - this could be a devastating objection if not preempted.

  For the prospectus structure, should anchor everything to a concrete methodology: constructing combatant archetypes then applying existing liability criteria to each. The standing test cases they mentioned (infantryman, drone pilot etc.) are perfect for this. Success would look like a consistent role-sensitive framework that doesn't collapse into existing positions; failure would be if reciprocity proves irrelevant or if all roles land at symmetrical extremes.

  Timewise, one semester plus summer seems tight but feasible for core arguments, though empirical validation would need to be bracketed. Should emphasize this is a theoretical foundation for future work rather than a comprehensive system.

  Biggest vulnerability remains the reciprocity argument - might advise presenting it as a diagnostic tool rather than normative claim in early stages. The military structure objection should be framed as downstream policy implication rather than intrinsic flaw.
answer: |-
  Here’s a structured approach to your prospectus, starting with a critical brainstorm and culminating in a defensible 1800-word framework. I’ll flag vulnerabilities and sharpen your core contention to withstand committee scrutiny.

  ---

  ### **Brainstorm: Sharpening the Question & Flagging Pitfalls**
  1. **Three Ways to Sharpen the Research Question:**  
     - Option 1: *"Does reciprocity of risk explain the intuitive appeal of the moral equality thesis (MET), and can it ground a role-sensitive liability framework?"*  
       **Verdict**: Too focused on psychology; risks conflating *why* MET feels plausible with *whether* liability *should* be role-sensitive.  
     - Option 2: *"Under what conditions (role, knowledge, risk-exposure) does an individual combatant’s liability to defensive harm deviate from the symmetrical MET or the contribution-tracking revisionist model?"*  
       **Verdict**: Descriptive; doesn’t commit to a normative framework.  
     - Option 3: *"Can a reciprocity-of-risk condition reconcile the moral asymmetry of wars with the intuition that combatants share a common predicament, yielding a non-arbitrary graded liability model?"*  
       **Verdict**: **Strongest**. Targets the core tension in your insight, demands normative innovation, and forces engagement with both camps.  

  2. **Originality Check & Framing Fixes**:  
     - **Originality**: Yes—existing literature (e.g., Lazar, Fabre, McMahan) acknowledges *some* role variation (e.g., civilians vs. combatants, leaders vs. foot soldiers) but doesn’t systematically dissect *combatant roles* or treat reciprocity of risk as a *liability-mitigating factor*. Your focus on intra-combatant heterogeneity is underexplored.  
     - **Confusion in Your Framing**:  
       - You conflate **liability** (moral status) with **permissibility** (action assessment). Focus squarely on liability: *When is a combatant morally liable to be killed?*  
       - Reciprocity of risk isn’t yet doing real work—it’s a hypothesis. Don’t assume it’s *the* answer; treat it as a testable lever.  
     - **Reciprocity of Risk: Can It Bear Weight?**  
       - **Yes, but cautiously**. It captures the "shared fate" intuition driving MET, but risks conflating *fairness* with *moral liability*. To avoid committee pushback: **Frame reciprocity as a *mitigating condition* for liability**, not a foundational criterion. E.g., *"Exposure to reciprocal risk reduces an unjust combatant’s culpability, thereby partially excusing or diminishing liability."*  
     - **The "Moral Immunity" Objection**:  
       - **Critical engagement**: If grading works, states *could* engineer "low-risk/high-impact" roles (e.g., drone operators) to evade liability. This isn’t fatal—it reveals a *feature* of your model: it exposes how *technical asymmetry creates moral loopholes*, forcing a confrontation with the ethics of remote warfare. Preempt this by arguing your framework *diagnoses* a problem for IHL, not solves it.  

  ---

  ### **Prospectus: A Graded Liability Model for Combatant Roles**  
  *(~1800 words; adjust depth per section)*  

  #### **1. Research Question**  
  *"Can a reciprocity-of-risk condition generate a non-arbitrary, role-sensitive model of combatant liability that resolves the stalemate between the Moral Equality Thesis (MET) and revisionist asymmetry, without collapsing into either?"*  

  #### **2. Gap Analysis: Why Existing Camps Leave This Open**  
  - **Revisionists (McMahan, Fabre)** argue liability tracks *individual contribution to unjust threats*. But they:  
    - Treat "contribution" monolithically (e.g., a drone pilot = infantryman if causal impact is similar).  
    - Ignore how *risk exposure* alters moral assessment—e.g., a conscript under duress vs. a volunteer.  
    - **Why your question isn’t trivial**: Revisionists lack tools to explain *why* low-risk/unjust combatants (e.g., cyber ops) elicit moral discomfort despite clear contribution. Your model introduces *reciprocity* as a novel mitigating factor.  
  - **Traditionalists (Walzer, Shue)** defend MET via the "shared danger" of combatants. But they:  
    - Fail to justify why *all* combatants (e.g., rear-echelon staff) deserve equal liability despite vastly different risk/knowledge.  
    - **Your leverage point**: Their reliance on reciprocity is implicit and untheorized—you make it explicit and scalable.  

  #### **3. Methodology: Conceptual Mapping with Test Cases**  
  - **Core Method**: *Normative conceptual analysis* grounded in **test cases** designed to isolate variables:  
    ```markdown
    | Role                | Direct Threat | Knowledge | Risk Exposure | Reciprocity |
    |---------------------|---------------|-----------|---------------|-------------|
    | Conscripted Infantry| High          | Low       | High          | High        |
    | Drone Pilot         | High          | High      | Near-zero     | None        |
    | Logistics NCO       | Indirect      | Medium    | Medium        | Medium      |
    | Intelligence Analyst| Indirect      | High      | Low           | Low         |
    | Staff Officer       | Indirect      | High      | Low           | Low         | 
    ```  
  - **Week-to-Week Work**:  
    - **Weeks 1–4**: Analyze how MET/revisionism *each* assess liability in the test cases.  
    - **Weeks 5–8**: Develop a "reciprocity-adjusted liability" framework:  
      - Define reciprocity: *"Shared exposure to comparable defensive harm by just combatants."*  
      - Argue reciprocity mitigates liability *only for unjust combatants* by reducing culpability (e.g., duress in conscripts) or enabling mutual respect.  
    - **Weeks 9–12**: Stress-test the framework: Does it handle cyber/autonomous systems? Does it avoid excusing high-impact/low-risk unjust combatants?  
  - **Why Not Alternatives?**  
    - **Empirical surveys**: Useful but secondary—your claim is normative, not psychological.  
    - **Rebuilding liability theory**: Overambitious; your model *extends* existing frameworks.  
    - **Legal categories**: IHL’s binary status is precisely what your moral grading challenges.  

  #### **4. Success Criteria & Kill Conditions**  
  - **Success**: A model that:  
    - Explains intuitions about test cases better than MET/revisionism.  
    - Generates consistent liability verdicts across roles *without* ad-hoc exceptions.  
    - Shows reciprocity does meaningful work (e.g., it lowers liability for high-risk/unjust combatants but not low-risk ones).  
  - **Kill Conditions**: Abandon if:  
    - Reciprocity proves redundant (e.g., contribution + duress accounts for all cases).  
    - The model collapses into MET (all combatants retain near-equal liability) or revisionism (reciprocity does no work).  
    - Grading requires arbitrary thresholds (e.g., "≥50% risk exposure = liability mitigation").  

  #### **5. Scope & Timeline (1 Semester + Summer)**  
  - **Semester Goal**: Complete conceptual framework and test against core cases.  
  - **Summer Goal**: Draft 2 journal-article-length chapters:  
    1. Critique of MET/revisionism on combatant heterogeneity.  
    2. Defense of reciprocity-adjusted liability.  
  - **Realistic Boundaries**:  
    - **Exclude**: Non-combatant liability, *jus ad bellum* assessments, empirical data collection.  
    - **Include**: Cyber/drone roles as stress tests, but defer full treatment of AI to later work.  

  ---

  ### **Committee Defense Strategy**  
  - **For the Just War Scholar**: Emphasize how your model *preserves* Walzer’s insight about shared risk while updating it for modern warfare.  
  - **For the Rights Theorist**: Ground reciprocity in *culpability mitigation* (not fairness) to avoid "moral luck" objections.  
  - **For the Law Skeptic**: Argue that exposing IHL’s oversimplification is a *virtue*—your model shows why legal conventions need moral underpinnings.  
  - **Reciprocity’s Role**: Position it as a *corrective* to revisionism’s overindividualism—it captures the *relational* aspect of warfare.  
  - **"Moral Immunity" Reply**: States *already* exploit loopholes (e.g., contractors). Your framework makes this evasion *visible* and morally indictable ("unjust combatants in low-risk roles are *more* liable, not less").  

  **Bottom Line**: Your prospectus turns a valid observation about combatant heterogeneity into a targeted intervention in the MET/revisionism debate. By testing reciprocity as a liability-mitigator, you force both sides to confront the moral significance of risk—a variable they neglect. If sharpened as above, this is committee-ready.
