answer: |-
  Based on your verdicts and analysis, I've refined your principle of identity through sanctioned change to resolve inconsistencies while preserving your core intuitions. The key insight is that **project identity resides in the unbroken chain of maintainer-sanctioned evolution within a single, continuous version control history**. Below is the precise principle, tested against your cases, applied to new scenarios, and evaluated for trade-offs.

  ---

  ### **Refined Principle of Project Identity**
  **A project remains the same if and only if:**  
  1. **It evolves through a sequence of changes** (commits, pull requests, etc.),  
  2. **Each change is authorized by the project's recognized maintainers at the time**,  
  3. **These changes are recorded in a single, unbroken version control history**,  
  4. **The project's primary repository (the canonical source of truth) persists through this evolution**.  

  **Identity breaks if:**  
  - The chain of sanctioned changes is severed (e.g., no maintainer authorization).  
  - The version control history is abandoned or reset (e.g., a new repository is created without importing the full history).  

  ---

  ### **Testing Against Your Verdicts**
  | Your Case                                                                                                | Your Verdict          | Principle's Verdict       | Consistency | Reasoning |  
  |----------------------------------------------------------------------------------------------------------|-----------------------|---------------------------|-------------|-----------|  
  | 1. Every line replaced incrementally; same repo/history/community.                                      | Same project         | **Same project**          | ✅          | Continuous sanctioned changes in one history. |  
  | 2. Archived and rebuilt from scratch; new team, no original history.                                     | Not the same         | **Not the same**          | ✅          | Chain broken: no sanctioned evolution from original; history reset. |  
  | 3a. Hard fork (95% code, new name/governance).                                                           | New project          | **New project**           | ✅          | Fork repudiates old governance → no authorization from original maintainers. New history. |  
  | 3b. Original dies; fork team pushes fixes to **original repo** under old name.                           | Original "returns"   | **Same project**          | ✅          | Fork team becomes new maintainers of the **original repo/history**. Chain resumes via sanctioned changes to the canonical repository. |  
  | 4. Internal tool rewritten in new language; same team/users; data importer.                              | Same tool            | **Same project**          | ✅          | Sanctioned evolution in one history (rewrite is a single authorized change). |  
  | 5. Database: all rows replaced; same schema/name/app.                                                   | Leans "not the same" | **Not the same** (forced) | ❌          | **Forced abandonment:** Data replacement is state change, not project evolution. The principle applies to *projects* (code/docs/governance), not data state. Identity requires sanctioned changes to *project artifacts*, not user data. |  

  **Inconsistency Resolution:**  
  - **Case 3b** initially seemed irreconcilable but is resolved by emphasizing the **repository's continuity**. Your intuition aligns because the fork team revived the *original history*, not just the name.  
  - **Case 5** must be abandoned. The principle distinguishes **project** (code, schema, docs) from **data state**. Replacing rows is akin to deleting all user data—it doesn’t alter the project’s identity.  

  ---

  ### **Verdicts on New Cases**
  1. **Code untouched; contributors/docs entirely replaced.**  
     - **Verdict: Same project.**  
     - **Why:** Contributors/docs are part of the project's sanctioned evolution. Changes are authorized by maintainers and recorded in history. Code continuity is irrelevant—identity resides in the chain of change.  

  2. **Renamed; no other changes.**  
     - **Verdict: Same project.**  
     - **Why:** Renaming is a sanctioned change (e.g., updating docs/configs). The history and maintainers persist.  

  ---

  ### **Trade-Offs: Code vs. Community Continuity**
  Your principle **does not require trading code for community continuity**. Instead, it prioritizes:  
  - **Continuity of governance:** Maintainers sanction changes, ensuring institutional authority.  
  - **Continuity of history:** The version control record is the "source of truth."  

  This approach:  
  1. **Is principled:** It anchors identity in objective criteria (history + authorization), not subjective intuitions.  
