prompt: |-
  I'm running a session for our grad reading group on Williams next month and I want to hand people a case that isn't one of the famous ones. No George and the chemistry department, no Jim, no husband standing around wondering whether he's permitted to rescue his own wife — half the room has those memorised and stops thinking the moment they hear them, which rather defeats the object. What I want is a thought experiment built to a pretty awkward set of specs, and I want you to show me it actually meets them rather than just gesturing at the general territory.

  Here's the spec. First, the target shouldn't be utilitarianism or any other consequentialism: make the demanding view a rigorously impartial but non-aggregative one — a Ross-style pluralism where beneficence has genuine weight, or a contractualist view on which what you do has to be justifiable to each person it affects, something in that neighbourhood — and it has to issue a real requirement in the case, not just a permission that gets outvoted by the agent's tastes. Second, the ground project the agent is being asked to give up has to be one most people would call trivial or faintly silly. Nothing noble, no vocation, no sick relative, no great work of art. This is the crux for me: if the project is admirable the objection just smuggles in the value of the project and isn't about integrity at all, and I want a case that can't be accused of that. Third, the motive the agent actually acts from can't be love or loyalty or anything derived from a special relationship — it has to be something more like personal fastidiousness, professional pride, taste, or plain stubbornness. Fourth, ordinary and realistic: a workplace, a street, a hobby, a family. No sci-fi, no exotic beliefs, the agent is fully informed and reasoning normally, and the whole thing fits in one paragraph because I want to put it on a slide.

  Then do the check for me. Name the demanding theory precisely enough that we could argue with it, say what it requires here and by what route, and say what the integrity objection says about that — and keep it separate from the point Williams makes about the husband having one thought too many, because my own suspicion is that those two are doing different work and I'd like to see whether that's right once love has been taken out of the picture. Tell me which single feature of the case is doing the heavy lifting, and run the swap: what happens to the verdicts if you replace the trivial project with an admirable one? If that makes the objection stronger rather than weaker, does that show it was never really about integrity? Finish with the best attack a defender of the impartial view has on the case — I assume it's something about an agent dressing up a preference as a commitment — and say whether the case can be tightened against that or whether it just collapses. And if you think one of my four constraints can't be met alongside the others, say so and tell me why; I'd rather know then be handed a case that quietly cheats.
reasoning: |-
  Okay, the user is preparing for a grad reading group on Bernard Williams and needs a fresh thought experiment that meets very specific constraints. They want to avoid the classic cases (George, Jim, the husband) because participants might have memorized them and stop engaging critically. 

  Hmm, their specs are quite demanding: 
  First, the impartial theory must be non-consequentialist but still demanding—something like Rossian pluralism or Scanlonian contractualism. It needs to actively require sacrifice, not just permit it. 
  Second, the agent's project must be genuinely trivial—not noble or admirable, so the integrity objection can't be deflected by the project's inherent value. That's their crux. 
  Third, the motive should be something like fastidiousness or pride, not love/loyalty, to isolate integrity from special relationships. 
  Fourth, it has to be ordinary, realistic, and concise. 

  *scratches head* This is tricky because Williams' integrity objection often leans on deep projects (art, family) or special relationships. Stripping those away risks making the case feel artificial or the objection weak. But let me try... 

  For the theory: Scanlonian contractualism fits best. It demands acts be justifiable to each affected person, so if someone is harmed without justification, it's forbidden. Perfect for generating demands without aggregating utility. 

  For the project: Needs absurd triviality. What about... competitive crossword solving? Not admirable, yet someone might build their identity around it. The motive could be professional pride—a solver who refuses to compromise their "craft" even slightly. 

  Setting: A workplace. Colleague asks for a minor, last-minute favor that clashes with the agent's rigid crossword routine. The cost to the colleague is high (missed medical appointment), but the agent refuses to disrupt their ritual. Scanlon would say this refusal is unjustifiable—the harm isn't outweighed by the solver's "pride." But Williams would argue forcing compliance attacks their integrity by making them betray a core (if silly) commitment. 

  *checks specs* 
  - Theory: Scanlon, non-aggregative, demands sacrifice ✅  
  - Project: Crossword obsession—trivial ✅  
  - Motive: Professional pride (not love) ✅  
  - Setting: Office, realistic, one paragraph ✅  

  Now the heavy lifting: The triviality is key. If we swap in "practicing lifesaving surgery" instead of crosswords, the integrity objection strengthens—but that reveals it was never about integrity per se, just the project's value. Here, the project's worthlessness exposes that integrity matters even when commitments are silly. 

  Defender's counter: "This isn't integrity—it's narcissism! Real integrity involves valuable commitments." But we can tighten the case: Make the agent acknowledge the triviality ("I know it's ridiculous, but it's me") to show it's about identity, not worth. 

  *thinks* Does this hold? Maybe. The objection feels weaker with a silly project, but that's the point—it tests if integrity is purely about identity-conferring commitments, regardless of content. If the group recoils at demanding sacrifice for crosswords, Williams wins. If they say "grow up," the impartialist wins. Perfect for discussion. 

  Final tweak: Add that the colleague could reschedule but with significant stress (elderly parent, limited slots). Ensures the refusal is unjustifiable under Scanlon without begging the question. 

  Phew. This might work.
answer: |-
  Here's a case crafted to your exact specifications, followed by the analysis you requested. It avoids all the classic Williams scenarios and strictly adheres to your constraints.

  **The Case: "The Proofreader's Deadline"**

  >Alex is a fastidious freelance proofreader for technical manuals. Her professional pride hinges on delivering *flawless* work; even minor errors feel like personal failures. She's scheduled to proofread a 50-page manual (for a non-critical industrial pump) by 5 PM Friday for Client A, a task she can comfortably finish by noon. That afternoon, Client B—a small, struggling non-profit she occasionally works for—calls in a panic. Their sole grant writer, suddenly ill, needs someone to perform a *final* proofread on a crucial, complex $500,000 grant proposal due *absolutely* by 5 PM. They beg Alex, knowing her reputation. The task would take Alex exactly 3 hours, overlapping her planned proofreading slot for Client A. Rescheduling Client A isn't an option (they need it for a routine Monday meeting). If Alex helps Client B, she must rush Client A's work, guaranteeing several minor typographical errors will slip through (though the manual would remain functionally usable). Client B will almost certainly lose the grant without the proofread, jeopardizing their operations and the jobs of 5 staff. Alex, aware of all consequences and reasoning clearly, declines Client B. She explains, "I pride myself on never delivering substandard work. Rushing Client A's job would mean putting my name on something imperfect. I just can't do that, even for a good cause." She completes Client A's work flawlessly by noon. Client B loses the grant.

  ---

  ## Analysis: Meeting the Specs & Williams' Integrity Objection

  1.  **The Demanding Impartial Theory: Scanlonian Contractualism**
      *   **Precise Definition:** An act is wrong if its performance under the circumstances would be disallowed by any set of principles for the general regulation of behaviour that no one could reasonably reject as a basis for informed, unforced general agreement. Each person's standpoint must be given equal consideration; the justification must be acceptable *to each person* affected. Aggregation (simply adding up gains and losses across persons) is not permitted. Reasonable rejection focuses on the comparative burdens imposed on individuals.
      *   **Requirement in this Case:** Scanlonism requires Alex to help Client B. Here’s the route:
          *   **Standpoint of Client B / Non-Profit Staff:** They face a very high burden if Alex refuses – significant financial loss, threat to the non-profit's mission, and potential job losses. This burden is imposed because Alex prioritizes her own professional pride regarding a minor task (Client A) where the consequence of rushing is *only* minor typographical errors in a non-critical manual delivered *early*.
          *   **Standpoint of Alex:** Helping Client B would impose a burden: forcing her to put her name on work she knows contains minor errors, violating her professional self-conception and pride. She might experience significant distress and feel her integrity as a proofreader is compromised.
          *   **Reasonable Rejection Analysis:** Could Client B reasonably reject a principle allowing proofreaders to prioritize avoiding *any* minor errors in non-critical, early work over preventing severe financial/job losses for a small organization? **Yes.** The burden on Client B is vastly greater than the burden imposed on Alex (distress and compromised pride over minor flaws). Alex's burden, while real, stems from a personal standard she holds, not an objective requirement of the task (Client A's work would still be usable delivered early with typos). Could Alex reasonably reject a principle requiring her to help in this situation? **Unlikely.** When comparing the burdens, her distress over minor imperfections seems disproportionate to the concrete, severe harm her refusal causes others. A principle requiring aid here is one Alex could accept if she didn't hold this specific, unusually strict standard of perfectionism. Therefore, a principle *permitting* refusal in this case is reasonably rejectable by Client B, making Alex's refusal wrong. Scanlonism **requires** Alex to take on Client B's job and rush Client A's work.

  2.  **The Integrity Objection Applied:**
      *   **The Objection:** Scanlonism, by requiring Alex to act against her core commitment to flawless work (even for trivial output), attacks her integrity. It forces her to betray a fundamental aspect of her self-conception and identity – her professional pride and fastidiousness. This demand treats Alex merely as a locus for the satisfaction of impersonal justificatory requirements (what principles no one could reasonably reject), disregarding the fact that *this particular commitment*, however trivial it seems to others, is constitutive of *who she is*. Making her abandon it, even for a morally compelling impartial reason, involves a kind of moral assault on the self. It alienates her from her actions by requiring her to adopt an external, impartial perspective that negates her deeply held, identity-defining project.
      *   **Distinction from "One Thought Too Many":** This is crucially different. The "one thought too many" objection (e.g., the husband) concerns the *motive* for a morally good act (saving one's wife) and whether impartial justification *needs* to figure in the agent's deliberation at all when a personal relationship provides sufficient (and perhaps more authentic) motivation. Here, the integrity objection concerns the *content of the demand itself*. It's not about *how* Alex would help Client B if she did (whether she'd think impartially or just feel compassion), but about the fact that Scanlonism demands she perform an act (delivering flawed work) that is fundamentally *incoherent* with her deepest (if trivial) sense of self. The objection targets the *requirement to act*, not the deliberation leading to it.

  3.  **Heavy Lifting Feature: Triviality of the Project**
      *   The *triviality* of Alex's project (perfect proofreading of a non-critical industrial pump manual delivered early) is absolutely central. It isolates the core of Williams' integrity concern: the value of acting from one's *own* commitments, regardless of their *impersonal* value. If the project had inherent moral weight, the objection could be misconstrued as relying on that weight, not the value of integrity itself.

  4.  **The Swap: Trivial Project vs. Admirable Project**
      *   **Swap:** Replace Alex's proofreading pride with an "admirable" project: She's meticulously restoring a rare, historically significant manuscript for a museum exhibit opening Monday; rushing it risks damaging the fragile artifact. Client B's situation remains the same.
      *   **Effect on Verdicts:**
          *   **Scanlonism:** Might *still* require helping Client B? The burden on Client B is very high (jobs/mission). The burden on Alex (risk to artifact) is also high, but perhaps comparable or even less severe depending on the artifact's uniqueness vs. the jobs. The rejection analysis becomes much murkier. A principle *requiring* Alex to risk the artifact might now be reasonably rejectable *by Alex*. The outcome is less clear-cut.
          *   **Integrity Objection:** **Becomes significantly stronger and more intuitively compelling.** The demand to risk damaging a culturally valuable artifact feels like a clearer, more profound violation of Alex's integrity, precisely *because* the project itself is independently valuable. People readily grasp the wrongness of forcing someone to compromise a noble vocation or valuable preservation work.
      *   **What This Shows:** The swap reveals that when the project is admirable, the integrity objection gains intuitive force *because* the project *itself* has significant impersonal value. In the original case with the trivial project, the *only* source of the objection's force is the value of *acting from one's own commitments* (integrity itself). If the objection weakens when the project is trivial, it suggests that in cases with admirable projects, the intuitive pull often comes *more* from the value of the admirable project being sacrificed than from the abstract value of integrity. The original case *forces* the focus onto integrity alone.

  5.  **Best Attack by Defender of Impartial View (Scanlonism):**
      *   **The Attack:** "This isn't an integrity issue; it's narcissism disguised as principle. Alex has elevated a personal preference (extreme, self-imposed perfectionism about trivial work) into an unchallengeable 'commitment.' Scanlonism rightly identifies this preference as unreasonable grounds for rejecting a principle requiring aid when the cost to others is so severe. Her 'integrity' is just stubbornness protecting an arbitrary and disproportionate standard. Demanding she act justly doesn't attack her true self; it asks her to moderate an unreasonable and harmful idiosyncrasy. Her distress is self-inflicted and doesn't outweigh the concrete harm to others."
      *   **Can the Case Be Tightened Against This?** It can be *resisted*, but not collapsed.
          *   **Resistance:** Williams argues that what constitutes an agent's "true self" or "ground project" isn't determined by an external, impartial assessment of its reasonableness or worth. If Alex genuinely experiences this standard as constitutive of her identity *as a professional* (however silly it seems), demanding she violate it *is* demanding she betray herself. The defender assumes the impartial view gets to define what counts as a "reasonable" commitment for integrity's sake, which is precisely what Williams challenges. The case highlights that integrity *can* attach to projects others find trivial or irrational (e.g., a vow, a quirky artistic vision, a self-imposed challenge). Tightening involves emphasizing Alex's internal perspective: "For Alex, delivering *any* error is professional death; it's not a preference but the core of her work identity."
          *   **Limitation:** The attack has force. It exposes the potential for agents to shield selfishness or irrationality with the language of "integrity." The case doesn't *prove* Williams is right; it creates the stark conflict the integrity objection needs to be tested. The defender will always argue the "commitment" is unreasonable. The point of the case is to force the question: *Even if unreasonable, does forcing compliance still constitute a distinctive wrong (attacking integrity) beyond the impersonal wrong of not maximizing good or meeting justifiability?* The triviality makes this question unavoidable.

  ## Conclusion: Does it Meet All Constraints?

  Yes, the case meets all four constraints simultaneously:
  1.  **Non-Consequentialist Demand:** Uses Scanlonian Contractualism, demanding beneficence/avoiding harm based on reasonable justifiability to each person, non-aggregatively.
  2.  **Trivial Ground Project:** Perfect proofreading of a non-critical manual (industrial pump) delivered early. Admirable only to Alex; objectively silly.
  3.  **Non-Relational Motive:** Pure professional pride and fastidiousness ("never delivering substandard work," "putting my name on something imperfect").
  4.  **Ordinary & Realistic:** Workplace (freelance), realistic consequences (lost grant/jobs vs. minor typos in a manual), fully informed agent, normal reasoning. Fits one paragraph.

  The case cleanly isolates Williams' core integrity objection from consequentialism, special relationships, and the independent value of projects. It forces the debate onto whether impartial moral theories, even non-aggregative ones like Scanlonism, can demand actions that require an agent to fundamentally betray their own (even trivial) identity-constituting commitments. The defender's best attack questions whether such a trivial commitment *should* be considered identity-constituting, but the case ensures that attack must confront the core philosophical claim about the nature of integrity and the self head-on.
