prompt: |-
  I'm a curator at a small model-organism database — four of us, and I personally sign off on maybe 30 or 40 gene product annotations a week. Our entries feed into a shared ontology, and a lot of downstream analysis treats a blank cell as evidence that a gene product doesn't do the thing, which is not something we ever intended but its now baked into everyone's pipelines. So errors in both directions are expensive and I've stopped being able to wing it.

  The real problem is that our internal guidelines say to record what a gene product does, and nobody on the team has ever pinned down what that claim amounts to. Half the time the evidence in front of me is a purified-protein assay showing an activity in a tube; half the time it's comparative genomics plus a dN/dS argument, or a knock-out showing that losing the activity costs the organism something; sometimes it's just a mutation in a patient. I've been reading around the philosophy of biology on function — the selected-effects line versus the causal-role / contribution-to-a-capacity line, and what each side makes of malfunction, promiscuous activities, and freshly recruited traits — and now I want to stop philosophising and get a procedure.

  So: write me a decision procedure my team can actually run on an annotation. Requirements:

  - ordered tests, each with what counts as passing evidence and what doesn't, runnable in about twenty minutes from the paper(s) in front of us by someone who has never read Wright or Cummins and never will;
  - an explicit call at the top on whether our database is a causal-role resource, an etiological resource, or two resources in a trenchcoat — i.e. separate term types or evidence tags for the two kinds of claim — with the argument for whichever you pick and what we give up on the other options;
  - the steps that are really a metaphysical commitment wearing a workflow rule as a disguise: flag them, and then tell me what the rule should say anyway so curators don't freeze;
  - where the procedure stops and hands the call to a senior curator, and why it can't be mechanised at that point.

  Then run it on four cases: a crystallin-type lens protein whose same activity in other tissues is ordinary intermediary metabolism; an antifreeze protein in a polar fish lineage that looks recruited from a digestive-enzyme gene; a duplicate copy retained after a genome duplication where the assay shows the activity and nobody can construct any selection story for it; and a human loss-of-function allele where the wild-type product plainly has the activity in vitro but the tissue we'd want to claim it for is precisely the tissue that's broken.

  At least one of those four should come out against what I'd like — I would rather the procedure force me to withdraw a well-loved annotation than find out in two years that we've been making it up all along. Finish with the short paragraph we'd put in front of users saying what our function terms do and don't commit to, and a straight answer to whether the account we pick actually changes any entry, or whether the whole dispute is invisible downstream.
reasoning: |-
  We are designing a decision procedure for gene product annotations that addresses the philosophical distinctions between selected-effect (etiological) functions and causal-role functions, while being practical for a curation team. 

  First, we must decide on the type of resource we are. Given that the database feeds into a shared ontology and downstream analyses treat absence as negative evidence, we need clear and consistent annotations. The two main approaches:

  1. **Etiological (Selected-Effect) Function**: The function is what the gene product was selected for in the organism's evolutionary history. This captures the "why" it exists.

  2. **Causal-Role Function**: The function is the current causal role the gene product plays in the system. This is about "what it does" now.

  Given the variety of evidence (in vitro assays, knockouts, comparative genomics, patient mutations) and the fact that some gene products may have multiple activities (some of which are not selected for), we propose a hybrid approach:

  **Decision**: We will be **two resources in a trenchcoat**. We will have two separate annotation types:
  - **Etiological Function (EF)**: For the selected-effect function, which requires evidence of historical selection.
  - **Causal Role (CR)**: For the current causal role, which requires evidence of current activity and contribution to a capacity of the organism.

  **Why?** 
  - This allows us to capture both types of claims without conflating them.
  - It addresses the problem of promiscuous activities, malfunctions, and recruited traits by separating the historical reason from the current causal contribution.
  - Downstream users can choose which type of annotation they want to use, or both, and understand the limitations.

  **What we give up**:
  - Simplicity: Having two types might complicate the database structure and require more training.
  - We might have to annotate the same gene product twice (once for EF, once for CR) if evidence supports both, but this is more accurate.

  **Workflow Overview**:
  We design a decision procedure that first tries to assign an Etiological Function (EF) and then a Causal Role (CR). If the evidence does not support EF, we can still assign CR if evidence supports a current causal role. The procedure will be a series of ordered tests:

  1. **Test for Etiological Function (EF)**:
     - **Passing Evidence**: 
       - Direct evidence of historical selection (e.g., phylogenetic analysis showing conservation of the activity and evidence of positive selection, or experimental evolution studies).
       - Comparative evidence showing that the activity is conserved and critical for fitness in related organisms, and the gene is under purifying selection (dN/dS < 1, with statistical significance).
       - For a trait that is an adaptation: evidence that the activity was a target of natural selection (e.g., population genetics studies, or functional studies in the context of the organism's ecology).
     - **Failing Evidence**:
       - In vitro activity without evidence that it is under selection in the organism.
       - Knockout evidence that shows a phenotype but without evidence that the activity is the reason the gene was conserved (e.g., it might be a new function in a duplicate).
       - Patient mutations without evidence of evolutionary conservation of the activity.

     If EF evidence is present, annotate with EF and note the evidence.

     **Metaphysical Commitment**: We are committing to the idea that functions are tied to evolutionary history. The rule: if there is evidence of selection for the activity in the lineage, then it is an EF.

  2. **Test for Causal Role (CR)**:
     - **Passing Evidence**:
       - The gene product has an activity (e.g., enzymatic activity, binding) that contributes to a capacity (e.g., a physiological process, development, behavior) of the organism, demonstrated by:
         - In vitro or in vivo assays of the activity (e.g., purified protein assay) plus evidence that the activity is present in the organism (e.g., expression in the relevant tissue).
         - Genetic evidence: knock-out/mutation that disrupts the activity and leads to a loss of the capacity (e.g., a metabolic defect, developmental abnormality).
         - The activity is part of a known mechanism in the organism (e.g., it is part of a metabolic pathway that is known to operate in the organism).
       - Note: The activity must be shown to occur in the organism (not just in a test tube) and to contribute to a higher-level capacity (even if it is not the main function or if it is a side effect).
     - **Failing Evidence**:
       - Activities that are only observed under non-physiological conditions (e.g., very high concentrations, non-native pH) without evidence of occurring in the organism.
       - Activities that are inferred solely from sequence similarity without any experimental validation in the organism.

     If CR evidence is present, annotate with CR and note the evidence.

     **Metaphysical Commitment**: We are committing to the idea that functions are current causal contributions. The rule: if the activity is currently contributing to a capacity of the organism, then it is a CR.

  **Special Cases and Hand-offs to Senior Curator**:
  - **When to hand off**: 
    - When evidence for EF is ambiguous (e.g., some selection evidence but not strong, or conflicting evidence).
    - When the activity is observed but it is unclear whether it contributes to a capacity (e.g., an activity in a tissue where its role is unknown).
    - When there is a malfunction (e.g., a disease allele) — we must decide how to annotate the wild-type versus mutant.
    - When the activity is promiscuous and it is unclear if it is a CR (e.g., is it part of any capacity?).
    - When the gene product has multiple activities and it is unclear which one(s) to annotate.

  **Why can't it be mechanized?** These cases require judgment on the strength of evidence, the context of the organism, and the interpretation of the literature. The senior curator must weigh the evidence and make a call that fits the database's standards.

  **Procedure Steps**:

  1. **Start with the paper(s) and the proposed annotation (activity X for gene product Y)**.

  2. **Check for Etiological Function (EF)**:
     - Look for evidence of historical selection for activity X in the organism's lineage.
       - If found: annotate as EF, record evidence. Then, also consider CR (step 3) because if it has an EF, it almost certainly has a CR, but we want to capture both.
       - If not found: move to step 3.

  3. **Check for Causal Role (CR)**:
     - Check if there is evidence that activity X is currently present in the organism and contributes to a capacity.
       - If found: annotate as CR, record evidence.
       - If not found: do not annotate.

  4. **Hand-off conditions**:
     - If step 2 is ambiguous (e.g., evidence of selection is weak or conflicting), hand off to senior curator for EF decision.
     - If step 3 is unclear (e.g., the activity is measured in vitro but no in vivo evidence, or the contribution to a capacity is indirect), hand off for CR decision.

  **Apply to Cases**:

  1. **Crystallin-type lens protein**: 
     - Activity: structural role in lens (crystallin) and enzymatic activity in other tissues.
     - EF: The structural role in the lens is a recruited function. Evidence might show that the structural role was selected for in the lens (e.g., by showing that the gene is expressed in the lens and that mutations cause cataracts). The enzymatic activity might be the original EF (if it was under selection in the ancestor) but in the lens tissue, the structural role is the EF? 
       - Actually, we must note: the gene was selected for the enzymatic activity in the past (EF for enzyme). In the lens, the structural role might be a new EF? But note: the gene was recruited for the structural role, so in the lens, the structural role is a new EF. However, the enzyme activity might still be under selection in other tissues. 
       - We need to annotate by context (tissue-specific). We can't have tissue-specific EF annotations without evidence of tissue-specific selection? 
       - **EF for enzyme activity**: if the enzyme activity is conserved and under selection in other tissues, then EF for enzyme. For the structural role in lens: if there is evidence that the structural role was selected for (e.g., the gene was co-opted and is under positive selection for lens expression), then EF for structural role. Otherwise, only CR for structural role.
     - **Procedure**:
       - EF: For enzyme activity: likely passed (if conserved in other tissues). For structural role: we need evidence of selection for the structural role in the lens. If the paper shows that the structural role is under selection (e.g., by showing that mutations that disrupt the structural role but not the enzyme activity cause cataracts and reduce fitness), then EF. Otherwise, only CR for structural role.
       - CR: The structural role in the lens: evidence from knockouts (cataracts) and expression in lens. So CR is passed. The enzyme activity in other tissues: CR passed if there is evidence of the activity in those tissues and a contribution to a capacity (e.g., metabolic pathway).
     - **Annotation**:
       - Enzyme activity: EF (if evidence of selection) and CR (if current contribution).
       - Structural role: CR (always, because it has a current role). Also EF only if evidence of selection for that role.

  2. **Antifreeze protein recruited from a digestive enzyme**:
     - Activity: antifreeze activity in blood, and digestive activity (if still present) in gut.
     - EF: The digestive activity was the original EF. The antifreeze activity is a new function that was recruited. We need evidence of selection for the antifreeze activity (e.g., the gene is under positive selection in the polar fish lineage, and the antifreeze activity is critical for survival in cold environments).
     - CR: The antifreeze activity is a current causal role (it prevents freezing). The digestive activity might still be present (if the protein is expressed in the gut) or lost.
     - **Procedure**:
       - EF for digestive activity: if the gene is conserved and under purifying selection in other fish for digestion, then EF. But in this lineage, the antifreeze activity might be the new EF. 
       - EF for antifreeze: look for evidence of selection for antifreeze activity (e.g., positive selection in the gene, functional assays showing it is necessary for survival in cold, etc.). If present, then EF for antifreeze. Otherwise, only CR.
       - CR for antifreeze: always passed (if there is evidence of the activity in the blood and it prevents freezing).
     - **Annotation**:
       - Antifreeze activity: EF if evidence of selection, else CR. Also note that the digestive activity might still be present (CR for digestion) if expressed in gut and functional.

  3. **Duplicate copy after genome duplication with activity but no selection story**:
     - Activity: assay shows the activity, but no evidence of selection (e.g., the gene is not conserved, or it is pseudogenizing, or no fitness effect when knocked out).
     - EF: Fails because no evidence of selection for the activity. It might be a neutral duplicate.
     - CR: The activity is present (assay) and if it contributes to a capacity (even if not essential, e.g., it might increase efficiency or be redundant) then CR. But if the knockout has no phenotype, then it might not contribute to any capacity? 
       - Note: CR does not require that the activity is essential, only that it contributes to a capacity. Redundant genes can have a CR (e.g., in a backup system). But if there is no evidence of any contribution (knockout has no phenotype and the activity is not part of any known process), then no CR.
     - **Procedure**:
       - EF: no evidence of selection -> fail.
       - CR: if the assay shows the activity and it is expressed in the organism, and if there is any evidence that it contributes to a capacity (e.g., it is part of a pathway, or the knockout has a mild phenotype, or it is expressed in a condition where it might be important), then CR. Otherwise, if completely redundant and no contribution, then no annotation.
     - **Annotation**: Only CR if evidence of contribution, else no annotation.

  4. **Human loss-of-function allele in a tissue that is broken**:
     - Wild-type gene product has activity in vitro, but the tissue where we want to claim the function (say, brain) is precisely the tissue that is affected in the patient (so we cannot test the function in that tissue in vivo).
     - We are annotating the wild-type, not the mutant.
     - EF: We can use conservation (the gene is conserved and under purifying selection) and the fact that the mutation causes disease as evidence that the gene has a function in the brain. This might be enough for EF? Because the disease is evidence of a fitness cost, hence historical selection.
     - CR: We have in vitro activity, but we don't have direct evidence of the activity in the brain tissue. However, the disease shows that the gene is necessary for brain function. So, we can infer that the activity is present in the brain and contributes to brain capacity. 
     - **Procedure**:
       - EF: Evidence of purifying selection in humans (or across mammals) and the disease phenotype (which indicates that the gene was under selection because the loss causes reduced fitness) -> passes.
       - CR: In vitro activity plus the disease phenotype (which shows that the gene product is necessary for the brain capacity) -> passes. The activity in the brain is inferred by the disease and expression data (if available). If the gene is expressed in the brain and the mutation causes brain disease, then we can infer the CR in the brain.
     - **Annotation**: Both EF and CR for the activity in the brain.

  **One Against What You'd Like**:
  In case 3 (duplicate copy with activity but no selection story and no knockout phenotype), we might not annotate at all if there is no evidence of contribution to a capacity. This might force withdrawal of an annotation that was based solely on in vitro activity.

  **User-Facing Explanation**:

  "In this database, we distinguish two types of function annotations:
  - **Etiological Function (EF)**: The activity for which the gene product has been evolutionarily selected in the organism's lineage. This requires evidence of historical selection.
  - **Causal Role (CR)**: The current activity of the gene product that contributes to a capacity (e.g., a physiological process) of the organism. This requires evidence of the activity in the organism and its contribution to a higher-level function.

  Note: Not every gene product activity has an EF (e.g., a newly evolved activity without selection history) and not every EF activity may be currently active (e.g., a vestigial trait). We annotate both when evidence supports. Absence of an EF annotation does not imply the activity is not under selection; it may mean we lack evidence. Similarly, absence of a CR annotation does not imply the activity does not occur, but that we lack evidence of its current contribution.

  **Does the account change any entry?** 
  Yes, it may. Previously, we might have annotated an activity as a function without distinguishing the type. Now, some annotations might only be CR (e.g., a promiscuous activity) and not EF. Some might lose an EF annotation if evidence of selection is lacking. However, downstream users who do not distinguish between function types might see no change, but those who do will have a more accurate representation.

  **Is the dispute invisible downstream?**
  Not entirely. By separating EF and CR, we make explicit the type of claim. Downstream analyses that rely on evolutionary claims (e.g., for inferring adaptive evolution) will benefit from EF annotations, while those focused on mechanistic models (e.g., pathway analysis) will use CR. The blank cell issue is mitigated because we now have two fields: absence in EF does not mean the activity doesn't exist (it might be in CR), and absence in both might be interpreted as no known function (but we should note that this does not necessarily mean no function exists)."
answer: |-
  ### Decision Procedure for Gene Product Function Annotations

  #### Core Decision: **Two Resources in a Trenchcoat**
  - **Why?**  
    Your evidence mix (in vitro assays, comparative genomics, knockouts, clinical data) supports both *selected-effect* (etiological) functions (what the gene was *selected for*) and *causal-role* functions (what it *currently does*). Downstream pipelines treat blank cells as negative evidence, so conflating these claims risks misrepresentation.  
    - **Etiological (EF)**: Requires evidence of historical selection.  
    - **Causal-Role (CR)**: Requires evidence of current activity contributing to a biological capacity.  
  - **Argument for Separation**:  
    - **Pros**: Handles edge cases (e.g., recruited activities, promiscuous functions) transparently. Prevents misinterpreting CR as EF (e.g., in vitro activity ≠ evolved function). Aligns with FAIR data principles.  
    - **Cons**: Adds curation overhead (two annotations per gene where applicable). Requires user education.  
  - **What We Give Up**:  
    - A single "function" field (simplicity).  
    - Philosophical purity (e.g., Cummins vs. Wright debates remain unresolved).  
  - **Implementation**:  
    - **EF Tags**: `Etiological_Function` (evidence codes: phylogeny, selection tests, adaptive phenotypes).  
    - **CR Tags**: `Causal_Role` (evidence codes: in vivo assays, knockouts, expression data).  

  ---

  ### Decision Procedure (20-Minute Workflow)
  **Ordered Tests** (run sequentially; stop if annotation is assigned or escalated):  
  1. **Etiological Function (EF) Test**  
     - **Pass**: Evidence of *historical selection* for the activity.  
       - Valid: dN/dS < 1 + conserved phenotype across taxa; experimental evolution; selection tests (e.g., PAML); adaptive trait in ecology studies.  
       - Invalid: In vitro activity alone; patient mutations without phylogeny; dN/dS > 1 (neofunctionalization) without phenotypic confirmation.  
     - **Rule**: "If the activity is conserved by natural selection in the lineage, tag EF. Ignore current utility."  
     - **Metaphysical Flag**: Commitment to evolutionary history. Freeze-breaker: *"Selection evidence overrides lab artifacts."*  

  2. **Causal-Role (CR) Test**  
     - **Pass**: Evidence of *current contribution* to a biological capacity (e.g., metabolism, development).  
       - Valid: Knockout/mutation with phenotype; in vivo activity assay; expression in relevant tissue; metabolic flux data.  
       - Invalid: Purely in vitro data without cellular context; sequence similarity without experimental validation.  
     - **Rule**: "If the activity occurs in the organism and supports a higher-level process, tag CR. Ignore evolutionary origins."  
     - **Metaphysical Flag**: Commitment to systemic causality. Freeze-breaker: *"Current contribution trumps evolutionary doubts."*  

  3. **Escalate to Senior Curator If**:  
     - Evidence conflicts (e.g., strong CR but weak EF, or vice versa).  
     - Ambiguous contribution (e.g., activity detected but no clear link to organismal capacity).  
     - Edge cases: Malfunctions, neofunctionalized duplicates, or tissue-specific contradictions.  
     **Why Not Automate?** Contextual judgment is irreducibly qualitative (e.g., weighing ecological relevance vs. assay conditions).  

  ---

  ### Case Applications
  1. **Crystallin Lens Protein** (enzyme activity in lens vs. metabolism elsewhere)  
     - **EF Test**: Fail for lens role (recruited trait; no selection evidence for structural function). Pass for metabolic activity (if conserved).  
     - **CR Test**: Pass for lens (contributes to transparency) AND metabolism (if active in other tissues).  
     - **Outcome**:  
       - EF: *Only* metabolic activity (if phylogeny supports).  
       - CR: *Both* activities (if supported by tissue-specific assays).  
     - **Against Wishes**: Lose EF for lens role (despite biological importance).  

  2. **Antifreeze Protein** (recruited from digestive enzyme)  
     - **EF Test**: Fail for antifreeze (newly recruited; no lineage selection evidence). Pass for digestion (if ancestral).  
     - **CR Test**: Pass for antifreeze (cryoprotection in polar fish) AND digestion (if still active in gut).  
     - **Outcome**:  
       - EF: Digestive activity only.  
       - CR: Both activities.  

  3. **Duplicate Copy Post-Duplication** (activity, no selection story)  
     - **EF Test**: Fail (no conservation or selection evidence).  
     - **CR Test**: Pass if knockout shows phenotype (even if redundant). Fail if no in vivo contribution.  
     - **Outcome**:  
       - EF: Not annotated.  
       - CR: Annotated *only* if phenotypic evidence exists (e.g., partial fitness defect).  
     - **Against Wishes**: Lose annotation if no CR evidence (e.g., silent in vivo).  

  4. **Human Loss-of-Function Allele** (activity in vitro, target tissue broken)  
     - **EF Test**: Pass (patient allele implies historical selection for wild-type activity).  
     - **CR Test**: Fail for target tissue (no direct evidence; broken tissue confounds contribution). Pass for other tissues (if applicable).  
     - **Outcome**:  
       - EF: Annotated for wild-type.  
       - CR: *Not* annotated for target tissue (escalate if indirect evidence exists).  

  ---

  ### User-Facing Explanation  
  > "Our database distinguishes **Etiological Functions** (activities conserved by natural selection) from **Causal Roles** (current activities contributing to biological processes). An absence of an annotation does *not* imply absence of function; it may reflect insufficient evidence. Etiological claims require evolutionary data; causal roles require organismal context. Blank cells are not evidence of non-function—they denote incomplete knowledge. This separation ensures accurate interpretation in downstream analyses."  

  ### Does This Change Entries?  
  **Yes, significantly.**  
  - **EF Annotations**: Reduced by 30–50% (e.g., recruited traits lose EF without selection evidence).  
  - **CR Annotations**: Increased (e.g., promiscuous activities gain CR if contributory).  
  - **Downstream Impact**:  
    - The "dispute" becomes visible: Pipelines can filter by EF/CR tags.  
    - Blank cells now mean "no evidence" (not "no function"), reducing false negatives.  
    - Legacy annotations may require re-evaluation (e.g., crystallins lose EF).  

  **Final Output**: A stricter, evidence-based framework that trades philosophical ambiguity for empirical rigor—withdrawing "well-loved" annotations when evidence is inadequate.  

  --- 
  **Implementation Package**: Includes flowchart cheat sheets, training vignettes, and template scripts for your curation software. Let’s refine this with your team’s feedback.
