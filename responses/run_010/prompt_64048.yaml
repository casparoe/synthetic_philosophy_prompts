  ---

  ### **Decision Tree: Is Death Bad for the Deceased?**
  *(Answer each question as if in a heated kitchen argument)*

  1. **Can you be harmed by something you never feel?**  
     - **No** → Death can't harm the dead (proceed to Node 2).  
     - **Yes** → Harm doesn't require experience (proceed to Node 3).  

  2. **Is "never existing" fundamentally different from "no longer existing"?**  
     - **Yes** → Go to Node 4.  
     - **No** → Go to Node 5.  

  3. **Is the harm mostly about losing *future* goods?**  
     - **Yes** → Go to Node 6.  
     - **No** → Death's harm is about breaking a life's momentum (proceed to Leaf E).  

  4. **Does dying young make death worse?**  
     - **Yes** → Death is bad as stolen potential (Leaf D).  
     - **No** → Death is irrelevant; the dead can't care (Leaf A).  

  5. **Is a person's identity stable over time?**  
     - **Yes** → Death is a misfortune nobody experiences (Leaf B).  
     - **No** → Death is less catastrophic because the "self" is fluid (Leaf F).  

  6. **Is the harm just about *your specific plans* being cut short?**  
     - **Yes** → Death is bad only as cancelled plans/desires (Leaf C).  
     - **No** → Death is bad because it destroys a valuable being (Leaf G).  

  ---

  ### **Resulting Leaf Positions (7 Views):**
  - **Leaf A**: Death is **no harm to the dead at all** (unfelt = unharmable).  
  - **Leaf B**: Death is a **misfortune nobody experiences** (deprivation without a subject).  
  - **Leaf C**: Death is bad **only as cancelled plans/desires** (frustrated agency).  
  - **Leaf D**: Death is bad because **it ruins the shape of a life** that was gaining meaning.  
  - **Leaf F**: Death is **less catastrophic** because the self isn't fixed (no enduring "I" to lose).  
  - **Leaf E**: Death is bad because **it destroys a valuable being** (intrinsic harm, not just deprivation).  
  - **Leaf G**: Death is **worse early** (steals potential) or **worse late** (severs hard-earned ties) – *context-dependent harm*.  

  *(Note: Leaf D and G split "timing" for nuanced views on life-shape vs. potential.)*

  ---

  ### **Combinations Nobody Holds (and Why):**
  1. **"No" to Q1 + "No" to Q2 + "No" to Q5**  
     (*Path: Unfelt harm impossible → Never-existing ≠ ceasing-to-exist → Self is unstable*)  
     - **Why unheld**: Incoherent. If you deny felt harm (Q1) and insist pre-life/death are identical (Q2), claiming the "self is fluid" (Q5) contradicts why death would matter *at all*. You’d need the "self" to be real enough for deprivation to register.  

  2. **"Yes" to Q1 + "No" to Q3 + "Yes" to Q5**  
     (*Path: Unfelt harm possible → Harm isn’t about future loss → Self is stable*)  
     - **Why unheld**: Unexplored/unappealing. If harm doesn’t need feeling (Q1) and isn’t about lost futures (Q3), but the self *is* stable (Q5), why is death bad? No major philosopher defends this gap—it’s a "misfortune in theory" with no mechanism.  

  ---

  ### **Inseparable Leaves & Overlaps:**
  - **Leaf B vs. Leaf E**  
    Both hold death is a "misfortune nobody experiences," but **Leaf B** focuses on *deprivation* (losing possible experiences), while **Leaf E** focuses on *annihilation* (destroying a valuable entity). They share a conclusion but diverge in *why* it’s bad. Distinct enough for two characters.  
  - **Leaf C vs. Leaf D**  
    **Leaf C** is about *subjective frustration* (your plans ruined), **Leaf D** is about *objective shape* (life’s narrative arc shattered). One is personal, one is structural.  

  ---

  ### **Recommendations for Your Novel:**
  - **Assign Leaf E** ("Destroys a valuable being") to your maverick character. It’s **under-explored** in philosophy (most focus on deprivation), logically coherent, and vivid: *"Death isn’t just stolen time—it’s crushing a masterpiece in progress."*  
  - **Avoid Leaf G** for two characters—it’s **context-dependent** (worse early/late). Fine for one, but overlaps with Leaf D on "stolen potential."  
  - **Leaf F** ("Self is fluid") pairs well with a pragmatic/stoic character.  
  - **Leaf A** (Epicurus) and **Leaf B** (deprivationism) are bedrock views—great for foundational arguers.  

  This tree ensures all six positions are distinct, defensible, and rooted in real debates. No two characters will accidentally share the same "haircut." Use Leaf E for your outlier—it’s rare but rock-solid.
