  On integration claims: While mainstream medicine accepts brainstem centrality, the passage oversimplifies by ignoring spinal reflexes and residual hypothalamic function. A well-informed popularizer might still simplify this way, but should acknowledge these nuances affect the "dead donor rule" justification.

  For the steelman request: The author correctly emphasizes brain death isn't just "as if" death. Their core error is presenting contested philosophical positions (like consciousness being necessary for personhood) as settled biology. But in science communication, some conflation of biological and normative criteria is inevitable when explaining legal standards.

  The moral unproblematic conclusion survives only if one accepts whole-brain death as actual death - which some philosophers reject precisely because bodies can still gestate fetuses or heal wounds. The user's suspicion about normative choices masquerading as facts seems well-placed here.

  Throughout, I'll flag where the passage slides between:
  1. Biological organism criteria (integration)
  2. Anatomical criteria (brainstem destruction)
  3. Personhood criteria (consciousness loss)
