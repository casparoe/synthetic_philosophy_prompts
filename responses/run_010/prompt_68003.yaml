answer: |-
  ### (a) Essay Question  
  **Jurisprudence Final Paper**  
  **Time Allowed: 60 minutes**  
  **Marks: 25**  

  **Question:**  
  Varene’s legal system (described below) exhibits perfect congruence between official action and declared rules, yet violates several other principles associated with the internal morality of law. Drawing *only* on the conceptual resources of the Hart–Fuller debate:  
  (i) Explain why this system poses no difficulty for Hart’s core model of a legal system, but systematically fails Fuller’s framework.  
  (ii) What does this reveal about whether Hart and Fuller were addressing the same fundamental question about law?  

  **Follow-up (integral to part ii):**  
  How might this analysis challenge the emphasis on post-war informer cases as the primary battleground for their debate?  

  **Fact Pattern:** Varene has no written constitution. For 40 years, its courts treat as law whatever the Minister of Justice announces in a numbered circular published weekly in the Gazette. A later circular displaces an earlier statute. Note:  
  - The Gazette is publicly available for a modest fee; circulars use precise, unambiguous language.  
  - No circular is repealed. Conflicts between subsisting circulars are resolved by applying the most recent; same-day conflicts favour the lower-numbered circular.  
  - No court has ever declined to apply a circular or treated one as invalid. Officials uniformly call this practice "the law of Varene."  
  - Some circulars are general; others name individuals and dictate outcomes in pending cases.  
  - Some circulars apply retroactively; some impose duties impossible to perform within their operative week.  
  - Courts apply circulars exactly as written, without deviation.  

  ---

  ### (b) Model Answer (800 words)  

  Varene’s system appears meticulously rule-bound: officials scrupulously apply published circulars, achieving perfect congruence between declared rules and judicial action—a hallmark of Lon Fuller’s "inner morality of law." Yet it catastrophically violates Fuller’s other principles: constancy (rules change weekly with no stability), generality (individualised directives replace general norms), non-retroactivity, and feasibility (impossible duties). For H.L.A. Hart, conversely, Varene is a straightforward instance of a functioning legal system. This stark divergence exposes their fundamentally distinct projects: Hart seeks a descriptive account of law’s structure, while Fuller evaluates law’s moral viability. The informer cases, central to their historical exchange, obscure this contrast by focusing narrowly on congruence and retroactivity.  

  Hart’s model centres on the union of primary rules (governing conduct) and secondary rules (identifying, changing, and adjudicating law). The rule of recognition—a social practice among officials—is key. Varene satisfies this perfectly. Officials uniformly treat Gazette circulars as supreme law, accepting a rule that "whatever the Minister publishes in the Gazette is law, with later circulars overriding earlier ones and statutes." The resolution of conflicts (recency, then lower numbering) further confirms a shared, operational standard for identifying valid law. Circulars’ clarity and the courts’ consistent application ensure efficacy and predictability. Hart’s positivism asks only whether officials converge on a practice for recognising law—not whether the resulting rules are just, stable, or general. Varene’s arbitrary, retroactive, or impossible commands are, for Hart, morally defective *laws*, not non-law. The system’s pathology lies in its content, not its legal validity.  

  Fuller’s framework collapses in Varene precisely because it demands more than congruence. His eight principles (including constancy, non-retroactivity, feasibility, and generality) are interdependent conditions for law’s existence. A system failing any substantially ceases to be "law" because it cannot guide conduct—law’s essential purpose. Varene’s volatility (weekly changes, no repeal) destroys constancy, preventing subjects from forming stable expectations. Individualised directives negate generality, substituting ad hoc commands for rules. Retroactivity and impossible duties make compliance irrational. For Fuller, congruence alone is hollow if other principles are flouted; rules cannot guide if they are unknowable, unstable, or incapable of being followed. Varene thus embodies a "managerial dictatorship" issuing arbitrary fiats, lacking the reciprocity between rulers and ruled that defines legality. Crucially, Fuller’s principles are not severable "options": they form a unified ideal. Varene proves that perfect congruence cannot compensate for the collapse of the other seven.  

  This reveals Hart and Fuller were not addressing the same question. Hart offers a *conceptual* analysis of law’s structure, using the rule of recognition to distinguish legal systems from other social orders. Fuller advances a *moral-functional* thesis: law must minimally respect human agency to deserve the name. Varene clarifies this: Hart sees a valid but wicked system; Fuller sees no law at all, only coercion disguised as law. Their disagreement is not about whether morality influences law (as positivism vs. natural law debates suggest), but about whether moral functionality is intrinsic to law’s conceptual identity.  

  The post-war informer cases (where retroactive laws punished acts legal when committed) inadvertently narrowed the debate to congruence and retroactivity. Fuller used them to argue that extreme procedural injustice voids legality; Hart countered that such laws remain valid, albeit evil. Varene shows this emphasis is incomplete. By showcasing failures of constancy, generality, and feasibility *alongside* perfect congruence, it demonstrates that Fuller’s critique is broader: law’s morality lies in its capacity to sustain a cooperative practice of governance. The informer cases spotlighted only two of eight principles, implying congruence is the primary battleground. Varene proves congruence is insufficient alone and may even mask deeper degeneracy. The debate’s enduring relevance lies not in retroactivity alone, but in whether law’s authority derives solely from social sources (Hart) or also from moral architecture (Fuller). Varene forces this choice into the open.  

  ---

  ### (c) Marking Scheme (25 total)  
  *Ceiling for purely expository answers (accurate summary of Hart/Fuller without original analysis of Varene’s implications): 13/25.*  

  | **Must-Hit Move**                                                                 | **Marks** | **Mistake Caught**                                                                                          |  
  |-----------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------------------------------|  
  | **1. Hart’s rule of recognition**: Explain how Varene satisfies Hart’s model via official practice accepting circulars as supreme, identifiable law. | 5 | Claiming Varene lacks a rule of recognition because it is unwritten/not in a constitution. |  
  | **2. Fuller’s broken principles**: Identify specific failures beyond congruence (constancy, generality, non-retroactivity, feasibility), showing they are systematic. | 6 | Focusing *only* on congruence or conflating all failures into "injustice." |  
  | **3. Severability vs. package**: Argue that Varene proves congruence alone is insufficient for Fuller, exposing his principles as non-severable conditions for law’s existence. | 6 | Treating Fuller’s principles as a checklist where passing one (congruence) mitigates others’ failure. |  
  | **4. Different projects**: Contrast Hart’s *descriptive* focus (law as social fact) with Fuller’s *moral-functional* view (law as enterprise subject to internal morality). | 5 | Framing the debate as "positivism vs. natural law" or reducing it to the separation thesis. |  
  | **5. Informer cases critique**: Use Varene to argue the informer cases overemphasized congruence/retroactivity, obscuring Fuller’s broader critique of law’s architecture. | 3 | Ignoring the follow-up or treating informer cases as exhaustive of the debate. |  

  **Penalties**:  
  - -3 if answer contrasts legal positivism/natural law generally.  
  - -2 if answer merely summarizes Hart/Fuller’s general theories without engaging Varene deeply.  
  - Model answer structure/insight cap: **25**; Expository-only cap: **13**.
