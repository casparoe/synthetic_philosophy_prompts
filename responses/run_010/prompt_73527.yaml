prompt: |-
  I'm in a metaethics seminar that's spent the last three weeks on expressivism and the embedding problem, and I have to hand in a draft on Friday — 6 pages max, and the prof wants us to actually say something rather than just summarize the dialectic. My partner read an early version and told me the middle section was "fine but obvious," which stung, because I'm pretty sure what I'm proposing in section 3 is NOT just Blackburn's higher-order attitudes thing in a different hat. But I can't articulate the difference cleanly enough to defend it yet. Below is basically the whole argument, compressed (I stripped the examples down to save space). Three things I'd want from you: (a) tell me straight out if anything I say about the history or the dialectic is just wrong, because I've mostly read this stuff secondhand; (b) tell me whether section 3 does what I claim it does, or whether there's an obvious hole I'm blind to; (c) give me the single strongest objection my professor would make, so I hear it now instead of in the margin of the returned paper. You don't need to point me at literature, I can chase things down myself, I just want your take on the reasoning.

  --- draft ---

  **1. The setup.** Expressivism says a sentence like "lying is wrong" doesn't state a fact but expresses a non-cognitive attitude — disapproval, say. Geach's complaint, following Frege's separation of a sentence's content from the force with which it's asserted, is that the very same sentence turns up in positions where it isn't asserted at all: inside conditionals, under negation, after "maybe." In those positions the speaker is expressing no attitude whatsoever. So if the meaning of the sentence just is the attitude it's used to express, unasserted occurrences come out meaningless — which they plainly aren't, since "lying is wrong; if lying is wrong then getting your little brother to lie is wrong; therefore getting your little brother to lie is wrong" is valid, and valid in virtue of what the sentences mean rather than anything psychological. An expressivist semantics that can't reproduce that validity has changed the subject. Geach was answering the emotivists of his day, Ayer and Stevenson mainly, but the point itself is older and more general than ethics.

  **2. The slogan.** My claim is that the Frege-Geach problem is a compositionality problem wearing a logic costume. What breaks is the ability to build the meaning of a complex expression out of the meanings of its parts, once "meaning" is spelled out as "attitude expressed." Presenting it as a problem about inference misleads people into thinking an expressivist can duck it by giving up on a distinctively moral logic, or by treating validity as something other than truth-preservation. That dodge fails, and it fails for a reason worth stating: even if you refuse to talk about arguments at all, you still have to explain the conditional, and the conditional is a complex expression with moral sentences on both sides. Negation is the same story, and I think people underappreciate how bad it is: if "lying is wrong" expresses disapproval, then "lying is not wrong" should express the absence of disapproval, but the absence of an attitude isn't itself an attitude, and worse, on that reading the two sentences come out compatible rather than contradictory. So I'm not going to try to escape via inference. Section 4 is supposed to fix negation in the same way section 3 fixes conditionals, but I ran out of page space and honestly I'm not sure it does any work.

  Separately: Hare thought his phrastic/neustic split had already answered all of this — same descriptive content, the phrastic, with different neustics bolted on depending on whether you're asserting or supposing. My reading is that Geach's response is that this only works if the phrastic is genuine content, i.e. something of the kind that can be true, in which case the expressivist has already conceded the whole point. Is that fair? That bit I definitely got from secondary sources.

  **3. The proposal.** Don't take the attitude to be the semantic value. Take the semantic value to be a *policy about one's own future attitudes*. To judge that lying is wrong is not to disapprove of lying right now, it is to bind yourself: to be disposed, on coming to believe that some act is an instance of lying, to disapprove of it, and to be disposed to keep that binding in place across changes in your other views and across changes in your own character. The policy is the content. It is content of a perfectly respectable sort — a function from states of a certain kind to states of another kind — so it composes.

  An embedded occurrence of "lying is wrong" then contributes the same policy, unexercised: no attitude is expressed because none is adopted, but the content is still there, so compositionality is preserved. The conditional expresses a policy about policies — roughly, a binding to adopt the consequent-policy upon adopting the antecedent-policy — and modus ponens comes out valid because whoever holds the two policies and then exercises the first has already committed himself to exercising the second; failing to do so is a breach of a commitment he himself undertook, not a failure to match the world.

  Two claimed advantages over the higher-order attitude route. First, no regress: I never need to say what disapproving of a *combination* of attitudes is, which seems like the shaky step in the standard move. Second, and this is the one I actually like: the view predicts a datum. Call it the avowal test. A speaker can't sincerely and unironically say "lying is wrong, but I don't disapprove of lying" — but she can perfectly well say "lying is wrong, but I don't feel anything about it," and does, all the time, e.g. when reporting that she was raised to think so and is trying to shake it. A policy account explains the asymmetry: the second conjunct reports a failure of the felt accompaniment, which the policy never promised, whereas the first conjunct reports a failure to have adopted the policy that the first conjunct says she adopted. Attitude-expressivism explains the first infelicity and, I think, has no explanation at all for why the second one is fine.

  --- end draft ---

  One thing I should flag: I'm sympathetic to expressivism but I half suspect its doomed, and I want to know whether section 3 is a real third option or a relabeling of something already on the table. Also if you think the avowal test paragraph is doing no real work, say so — I'm attached to it but not that attached. And sorry for the run-ons, I wrote it fast.
reasoning: |-
  Hmm, this user is in a metaethics seminar struggling with an expressivism draft. They're clearly stressed about Friday's deadline and their partner's "obvious" comment stung - that academic insecurity is palpable. The core issue is whether their section 3 proposal about "policies" is genuinely novel or just Blackburn's higher-order attitudes repackaged. 

  First, let's unpack their argument structure. Section 1 accurately summarizes Frege-Geach: embedded contexts break attitude-expression semantics. Good that they note it's broader than ethics - shows they grasp the compositional heart of the problem. Section 2's "compositionality wearing logic costume" insight is sharp. Their take on Hare is correct too: Geach would say phrastics only help if they're truth-apt, which expressivists reject. 

  Now section 3 - the policies approach. Clever move to make semantic values future-directed commitments rather than present attitudes. The avowal test is their darling, but actually the stronger bit is solving the regress problem in Blackburn. When they say "I never need to disapprove of disapproving" - that's the real innovation. The avowal asymmetry is neat but secondary; the regress avoidance is what makes this distinct. 

  Biggest vulnerability? Their professor will pounce on the metaphysics of "policies." What ontological status do these binding-commitments have? If they're just psychological dispositions, how is this different from Blackburn? If they're normative entities, haven't they smuggled in realism? Also, negation remains shaky - they admit section 4 isn't worked out, and "binding to NOT adopt a policy" feels circular. 

  The user's self-awareness is impressive - they sense expressivism might be doomed but want to push this idea honestly. I'll emphasize that the policy approach is indeed a third way between Blackburn and realism, but stress they must confront the "what are policies?" objection head-on. Might suggest trimming avowal to one sentence and expanding the regress point - that's the gold.
answer: |-
  Okay, let's break this down. This is a strong, engaged draft tackling a core problem head-on. Your frustration is understandable, and your core intuition in section 3 *is* pointing to something potentially different. Here's the straight take:

  **(a) History/Dialectic - Mostly Spot On:**

  1.  **Frege-Geach & Expressivism:** Your setup (Sec 1) is correct. You accurately capture Geach's challenge (embedding), its basis in Frege (force/content), why it's devastating for simple expressivism (meaninglessness in unasserted contexts), and why inference preservation is the key test. Correct that it applies generally, not just to ethics. Your focus on compositionality being the *core* issue under the logic/inference guise is insightful and correct.
  2.  **Negation Problem:** Your diagnosis of the negation problem ("absence isn't an attitude", compatibility issue) is exactly right and often underplayed. It's a major headache for simple expressivism.
  3.  **Hare & Geach:** Your summary of Hare (phrastic/neustic) and Geach's reply is fair and accurate. Geach *did* argue that if the phrastic has genuine, shareable content capable of being true/false, then Hare has conceded cognitivism. If it doesn't, it can't do the compositional work needed for embedding. Your reading of secondary sources here served you well.

  **(b) Does Section 3 Do What You Claim? (Yes, with Caveats & Potential Holes):**

  *   **Distinct from Blackburn? YES, in a significant way.** Blackburn's higher-order attitudes (e.g., approving of disapproval) are *still attitudes*, just directed at other attitudes. Your "policies about future attitudes" are fundamentally **commitments or plans governing *future* psychological states and actions**.
      *   **Key Difference:** You're moving the semantic value from a *present psychological state* (attitude) to a *future-directed normative commitment* (to have/discharge certain states/actions under conditions). This is a structural shift. Blackburn's attitudes are *expressive*; your policies are *prescriptive* (for oneself).
      *   **Regress Avoidance:** This is the strongest point *for* distinctness. Blackburn needs an attitude towards an attitude towards an attitude... for iterated embeddings. You stop at the policy level: the conditional expresses a single policy *relating* two other policy-contents. You don't need a "policy about policies about policies". This *is* a genuine advantage and avoids the regress worry inherent in pure attitude hierarchies.
      *   **Avowal Test:** This *is* a datum your view explains neatly. Simple attitude expressivism struggles with "I judge X wrong but feel nothing" (should be impossible if judgement *is* the feeling). Your view cleanly separates the *commitment* (the policy/judgement) from the *contingent psychological accompaniment* (the feeling of disapproval). This is a point in your favor. *However*, don't overplay this – it's supporting evidence, not the core innovation. The core is the move to future-directed commitments/policies as semantic values.
  *   **Does It Solve Compositionality? PROMISING, BUT QUESTIONS REMAIN:**
      *   **Embedded Content:** Your solution for the conditional ("policy about policies") is plausible *in principle*. Assigning the *same* policy-content (unexercised) to the embedded occurrence is the right move compositionally. The conditional's meaning being a higher-order policy binding the antecedent and consequent policies seems coherent.
      *   **Potential Hole 1: The Nature of "Policies":** What *are* these policies ontologically? Are they reducible to complex dispositions? If so, how do they differ *structurally* from Blackburn's attitudes in a way that avoids similar compositionality problems when embedded? If they are irreducible normative commitments, have you smuggled in a kind of realism (about commitments) that expressivism traditionally rejects? **This is the biggest metaphysical/categorical question your view faces.**
      *   **Potential Hole 2: Negation (As You Suspect):** You rightly flagged this. If "lying is wrong" expresses policy P (commit to disapprove of lying), what policy does "lying is not wrong" express? It can't be "absence of P" (compositionality/compatibility problem returns). Is it a policy *not* to disapprove? A policy to tolerate? A policy to disapprove of P? Each option has costs. **Your proposal *needs* a worked-out account of negation to be complete.** Saying it's fixed "the same way" as conditionals needs concrete detail – a policy relating to P in a negating way? What *is* that relation? This is currently the weakest link.
      *   **Potential Hole 3: Truth-Preservation Lite?** You say modus ponens is valid because failing to adopt the consequent policy after adopting the antecedent is a "breach of commitment." This grounds validity in *internal consistency of commitment* rather than correspondence to facts. But is this sufficient? Couldn't someone hold perfectly consistent but morally abhorrent policies? Does this capture the *normative force* we associate with logical validity in moral arguments? This might be a feature, not a bug, for expressivism, but your professor might press on whether this really captures "validity" in the intended sense.

  **(c) The Single Strongest Objection Your Professor Would Make:**

  **"You've replaced attitudes with policies, but policies are either complex psychological dispositions (in which case, how do they fundamentally differ from Blackburn's attitudes in a way that avoids similar compositionality regresses when embedded, especially for negation?), or they are irreducible normative commitments (in which case, haven't you just smuggled normative facts – facts about what commitments one *ought* to hold or what constitutes a 'breach' – back into your semantics, thereby abandoning core expressivist anti-realism?). Explain the ontological and normative status of these 'policies' and show how they genuinely avoid the problems of both simple attitudes *and* Blackburn's higher-order attitudes without collapsing into a form of realism."**

  **Why this is the killer objection:**

  1.  **Hits the Core Innovation:** It directly targets the novelty – the move from attitudes to policies.
  2.  **Exploits the Ambiguity:** It forces you to clarify the most philosophically loaded aspect of your view.
  3.  **Connects to Expressivism's Motivation:** Expressivism is driven by anti-realism. If policies turn out to require normative realism to make sense, the view self-defeats.
  4.  **Highlights the Negation Problem:** The question of how a "policy of not having policy P" works is a specific instance of this ambiguity.
  5.  **Challenges the Validity Account:** The "breach of commitment" relies on a norm internal to the policy system – where does *that* norm come from? Is it just another policy? (Regress threat again).

  **Conclusion & Advice:**

  *   **Section 3 is NOT just Blackburn relabeled.** The move to future-directed *commitments* or *plans* governing attitudes, rather than present or higher-order attitudes themselves, **is a distinct and promising third option.** The regress avoidance and avowal test explanation are real strengths.
  *   **The "Policies" Ambiguity is Your Biggest Challenge.** You *must* address head-on what these policies are. Lean into the "commitment" or "plan" aspect. Argue they are *sui generis* practical commitments irreducible *merely* to dispositions or feelings, but stress they are commitments *we create* through our judgements, not discovered facts. Deny that this requires normative realism – the "breach" is a failure of *internal coherence* of the agent's own commitments, not a failure to match an external norm. (This is tricky but necessary).
  *   **Strengthen the Negation Section (Even Briefly):** You need *some* account. Sketch it. Perhaps "not wrong" expresses a policy *permitting* or *being indifferent to* the act, or a policy *rejecting* the commitment to disapprove. Acknowledge it needs more work but show the direction.
  *   **Keep the Avowal Test,** but maybe shorten it. It *is* evidence for your view over simple attitude expressivism. Use it to highlight the separation between commitment and feeling.
  *   **Emphasize Regress Avoidance:** This is the clearest advantage over Blackburn. Hammer it.
  *   **Tone:** Your draft is clear and engaging. Keep that energy. Acknowledge challenges frankly but defend your core insight.

  You're on to something interesting. The key is to clearly articulate the *nature* of the policies/commitments and defend their compatibility with expressivism's anti-realist core. Good luck with the draft!
