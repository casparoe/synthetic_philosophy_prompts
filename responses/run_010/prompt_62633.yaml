prompt: |-
  Okay, this landed in my lap and I could use help thinking it through.

  I'm on my university's new committee on public statements — six of us, set up last year after the president said something about a war and half the faculty lost it. Our charter has a clause everyone quoted approvingly at the time and nobody has actually had to apply until now: the university may take a public position only where the reasons for it "can be understood and assessed by members of the community regardless of their religious or philosophical commitments."

  Here's the case. A student coalition wants us to endorse a city ordinance putting a year-round low-barrier shelter on a block currently zoned for a development project. Most of what they submitted is unremarkable: overdose and hypothermia deaths downtown, the cost of boarding people in the ER versus shelter beds, the fact that the campus already draws heavily on city services. But the opening section is explicitly theological. It grounds the obligation in a claim about hospitality being owed to persons as such, and then it makes a historical argument — the block was cleared in the sixties partly by taking a church's property, and the congregation's standing covenant to the neighborhood is part of what got destroyed. And here's the wrinkle: they say that historical claim is a reason *for this university specifically* only because of the covenant. So it's not separable from the rest, by their own account.

  Two objectors. A faculty member says the charter plainly bars it: you can't assess a covenant obligation unless you share the faith, so the reason fails the test. A student member says the test is a racket — that translation demands fall hardest on exactly the communities whose neighborhoods got cleared, and that the clause quietly assumes the secular parts of the packet are any less commitment-dependent (they rest on views about what makes a death bad, about how to weight the worst-off, about the limits of property rights, none of which is neutral either).

  Draft the memo I need to get to the other five by Monday night. It should recommend something concrete — endorse as submitted, endorse a version, decline, defer, or an option I haven't thought of — with a next step and a date attached. It should also give us a test we could run on the *next* request in ten minutes, not just a verdict on this one, and be straight about what the test rules out; I don't want a standard that turns out to permit every statement ever proposed. There's a disagreement underneath this that the memo should surface and take a side on: some of us read the charter as demanding reasons people *share*, others read it as asking only whether each member has some sufficient reason of their own to accept the position. Those are different tests and would come out differently here. Same with a second confusion — whether the charter means religious reasons can be offered so long as public reasons show up eventually, or means the public reasons have to be the ones actually carrying the argument.

  Two more things. I'm a member of the congregation in question, so I've recused from the vote and this circulates as a discussion document without my authority behind it — which means it has to be genuinely even-handed, and if it reads as a defense of my own church I've made things worse. Flag anywhere you think it's tilting. And at the end, tell me how confident you are in the recommendation and which single piece of the reasoning you're least sure of. I'd rather know now which part is load-bearing on a hunch than find out Tuesday when someone pushes on it.
reasoning: |-
  Alright, the user is part of a university committee on public statements. They need to draft a memo by Monday night addressing whether to endorse a student coalition's proposal that includes theological arguments. The committee's charter requires reasons that can be understood and assessed regardless of religious or philosophical commitments. 

  First, I need to parse the key issues. The student proposal has both secular and theological sections. The theological part ties a historical covenant to the university's specific obligation. The faculty member argues this violates the charter since assessing the covenant requires shared faith. The student member counters that secular reasons also depend on philosophical commitments, and the translation demand unfairly burdens certain communities. 

  The user has recused themselves due to their church membership, so the memo must be impartial. They need a concrete recommendation—endorse, modify, decline, defer—with next steps. Crucially, the memo should establish a test for future cases, not just this one. It must address two underlying disagreements: whether the charter requires shared reasons vs. personal sufficient reasons, and whether religious reasons can be included if secular ones support the conclusion, or if secular reasons must carry the argument independently. 

  For the recommendation, modifying the proposal seems balanced. Removing the theological section but retaining the historical facts as context, while emphasizing the secular arguments. This navigates the charter's requirements without dismissing the coalition's perspective. The test for future cases should focus on whether the core justifications are assessable without specific commitments. 

  I'm least confident about excluding the covenant as a specific obligation. The student coalition explicitly states it's essential for the university's unique responsibility. However, the charter's intent seems to prioritize reasons accessible to all, so separating the covenant from the obligation might be necessary, even if it feels like a compromise. Highlighting this uncertainty is important for the user. 

  The memo should surface the two key disagreements: shared reasons vs. sufficient reasons, and the role of religious reasoning. Taking a side here—supporting sufficient reasons and requiring core justifications to be secular—provides clarity for future cases. Acknowledging that philosophical commitments underpin all reasons but requiring core arguments to be publicly assessable balances inclusivity with practicality. 

  Next steps: circulate the modified endorsement draft for committee review by a set deadline. This ensures timely action while allowing input. Confidence in the recommendation is medium—the modification approach is a practical middle ground, but the tension between inclusivity and the charter's constraints remains tricky. Flagging the covenant obligation exclusion as the weakest point prepares the user for potential pushback.
answer: |-
  Here's a draft memo designed to be impartial, provide a clear test, and address the underlying disagreements. It flags potential tilting and identifies areas of uncertainty.

  ---

  **MEMORANDUM**

  **TO:** Committee on Public Statements  
  **FROM:** [Your Name], Recused Member - Discussion Document Only  
  **DATE:** [Date Drafted]  
  **SUBJECT:** Recommendation & Framework for Action on Student Coalition Endorsement Request (City Ordinance: Low-Barrier Shelter)

  ## I. Summary of Request & Key Issues
  The Student Coalition requests the university endorse a city ordinance establishing a year-round low-barrier shelter on a specific block. Their submission includes:
  1.  **Substantial Secular Arguments:** Data on overdose/hypothermia deaths, comparative costs (ER vs. shelter beds), analysis of campus impact on city services.
  2.  **Theological/Historical Arguments:** Grounds the obligation in hospitality owed to "persons as such" rooted in a specific theological view. Argues the university has a *particular* obligation due to historical events: the block's clearance in the 1960s involved taking property from [Church Name], destroying its neighborhood covenant. The coalition explicitly states this covenant-based obligation is a *unique reason for the university* and inseparable from the theological framing.

  **Key Committee Disagreements (To Be Resolved):**
  *   **Disagreement 1: Meaning of "Understood and Assessed" (Charter Clause):**
      *   **View A (Strict Shared Assessment):** A reason fails unless members *share the necessary framework* to evaluate its validity (e.g., assessing a covenant requires shared religious faith). (Faculty Objector)
      *   **View B (Sufficient Personal Assessment):** A reason passes if each member, *using their own frameworks*, can understand the claim and assess whether *it constitutes a reason for them or others* (e.g., even non-believers can understand the *claim* of a covenant and assess its historical basis or its motivational force for believers/the coalition). (Implied by Student Objector's critique).
  *   **Disagreement 2: Role of Non-Public Reasons:**
      *   **View X (Exclusive Public Justification):** Only reasons accessible and assessable by all (public reasons) should form the *core justification* for a university statement. Religious/philosophical reasons cannot be the primary drivers.
      *   **View Y (Inclusive Eventual Justification):** Religious/philosophical reasons can be presented *alongside* public reasons, so long as sufficient public reasons exist to ultimately justify the position to the broader community.

  ## II. Recommendation: Endorse a Modified Version
  *   **Action:** Endorse the position supporting the city ordinance for a year-round low-barrier shelter on the specified block.
  *   **Modification:** **Remove the theological grounding and the claim of a *specific university obligation* stemming *solely* from the [Church Name] covenant.** Retain the historical fact of the church's displacement and its covenant as *context* demonstrating the site's significance and the community's loss, **but not as the *justification* for the university's unique obligation.**
  *   **Core Justification in Endorsement:** Base the university's endorsement **exclusively** on the secular arguments presented: public health data (deaths, ER burden), cost-effectiveness, the university's impact on city resources, and the general principle of supporting solutions to urgent community needs impacting campus safety and environment. Acknowledge the student coalition's broader motivations respectfully but neutrally (e.g., "motivated by deep commitments to community well-being and historical justice").
  *   **Next Step:** Circulate a draft endorsement statement reflecting this modification to the committee by **5:00 PM [Date - e.g., Tuesday]**. Committee vote scheduled for **[Date - e.g., Wednesday]**.
  *   **Rationale for Modification:** This approach navigates the charter clause most defensibly by ensuring the *core reasons justifying the university's official position* are accessible and assessable based on widely shared frameworks of public health, fiscal responsibility, institutional self-interest, and general civic welfare. It respects the coalition's passion and the historical context while adhering to the requirement that the university's *specific reasons for acting* be publicly justifiable.

  ## III. Proposed Test for Future Statements (The "Accessible Core Justification" Test)
  To efficiently evaluate future requests, apply this two-part test:

  1.  **Identify the Core Justification:** What are the *primary, indispensable reasons* offered specifically for the *university* to take this public position?
  2.  **Assess Accessibility:**
      *   Can a reasonable member of the university community **understand the meaning and logical force** of each core reason?
      *   Can they **assess its validity or weight** using methodologies or frameworks common to academic inquiry and public discourse (e.g., empirical evidence, logical coherence, historical analysis, legal precedent, widely recognized ethical principles like preventing harm or promoting welfare) **without requiring adherence to a specific religious doctrine or comprehensive philosophical system?**

  **What This Test Rules Out:**
  *   Statements where the *core justification* relies on:
      *   The authority of specific religious texts or leaders as the ultimate reason.
      *   Doctrinal claims requiring faith for validation (e.g., "God commands this," "Karma demands this").
      *   Esoteric philosophical premises inaccessible without specialized training in that specific system.
      *   Claims of unique institutional obligation *derived solely* from religious covenants or non-public historical narratives.
  *   **Clarification:** The test does *not* require "neutrality" in the sense of being free from *all* values or philosophical underpinnings (as the student objector correctly notes, secular arguments also rest on values). It requires the *core justification* to be accessible via *publicly shared methods of reasoning and evidence*.

  ## IV. Addressing the Underlying Disagreements & Charter Interpretation
  The memo takes the following positions on the identified disagreements, necessary to form a workable test:

  1.  **"Understood and Assessed" (Disagreement 1):** Supports **View B (Sufficient Personal Assessment)**. The charter requires reasons that individuals can *engage with* using their own capacities for understanding and evaluation, not reasons they necessarily *share* or *find convincing* within their own worldview. One need not be Catholic to understand the *claim* of a papal edict and assess its historical context or its impact on believers; one need not be a utilitarian to understand a cost-benefit argument and assess its data. The test focuses on *accessibility of assessment*, not *shared conviction*.
  2.  **Role of Non-Public Reasons (Disagreement 2):** Supports **View X (Exclusive Public Justification)** for the *core reasons carrying the argument*. Non-public reasons (religious, deep philosophical) can be presented as motivation, context, or supplemental argument. However, the *reasons that actually justify the university's official stance* must themselves be publicly accessible and assessable. The public reasons must be sufficient to stand independently as the justification.

  **Why this Interpretation?** This balances the charter's intent (ensuring statements aren't exclusionary or based solely on non-shared commitments) with practicality and inclusivity. It allows diverse motivations but grounds the *university's authoritative voice* in the common ground of public reason. View Y (Inclusive Eventual) risks allowing core justifications to be non-public if public reasons are merely appended. View A (Strict Shared) is likely unworkable, as even secular ethical arguments rely on contestable foundations.

  ## V. Potential Tilting & Your Recusal
  *   **Potential Tilting Concern:** The recommendation removes the covenant-based *specific obligation* argument central to the coalition's case for the university. This could be perceived as diminishing the historical church connection. **Flag:** This is driven solely by the charter interpretation argued above (core justification must be public). It is *not* a judgment on the validity or importance of the covenant claim itself, nor is it motivated by your personal connection. The historical fact remains as context.
  *   **Recusal Reminder:** This memo is submitted strictly as a discussion document. I have recused myself from the final vote and exert no authority over the committee's decision. My goal is to facilitate a clear, principled discussion based on the charter.

  ## VI. Confidence Level & Key Uncertainty
  *   **Overall Confidence in Recommendation: Medium-High (7/10).** The "Accessible Core Justification" test provides a clear, workable standard aligned with a reasonable interpretation of the charter. Modifying the endorsement leverages the strong secular arguments and avoids the most direct charter conflict.
  *   **Least Confident Element: Exclusion of the Covenant as a Specific Obligation.** While I believe the *charter interpretation* requiring this is correct, I am less certain about the *practical/political wisdom* or *perceived fairness* of this specific exclusion. The coalition explicitly states this is a *unique* reason *for the university*. Removing it may feel like silencing a valid, deeply held perspective on the university's historical responsibility, even if it doesn't meet the public justification bar. This is the point most vulnerable to the critique that the charter's interpretation inherently favors dominant, secular frameworks. **This is the load-bearing hunch:** that the requirement for public core justification outweighs the potential harm of excluding this specific, historically grounded claim of unique obligation. Be prepared for significant pushback here on Tuesday.

  ---
  **End of Memo**

  **Key Strengths of this Approach:**
  1.  **Provides a Clear Test:** The "Accessible Core Justification" test is actionable for future cases.
  2.  **Takes a Principled Stand:** Resolves the core disagreements in a way that gives meaning to the charter clause without making it impossible to act.
  3.  **Offers a Concrete Path Forward:** Recommends endorsement (likely desired by many) but with a necessary, justifiable modification.
  4.  **Acknowledges Recusal & Tilting:** Explicitly addresses the sensitivity around the church connection.
  5.  **Flags Uncertainty:** Clearly identifies the most contentious and potentially weakest part of the reasoning for committee debate.
