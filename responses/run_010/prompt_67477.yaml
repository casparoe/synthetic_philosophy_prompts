prompt: |-
  I am in my final year at school and am writing an extended project on privacy. I would like you to act as a professional philosopher who specialises in the ethics of information, and I would like you to think the problem through carefully rather than answer quickly.

  I have been collecting my own intuitive verdicts about when privacy is violated, and I have a tentative principle of my own that seems to fit most of them. I call it the bystander test: my privacy is violated when someone comes to know something about me that a polite stranger, physically present beside me at the relevant moment, could not have come to know. Here are the verdicts, in no particular order.

  1. A neighbour's drone photographs me sunbathing in my own back garden, which is open to the sky and overlooked from the lane. Violation.
  2. My GP sends my diagnosis to a consultant at another hospital without asking me, so that I can be seen sooner. Not a violation.
  3. My GP tells my mother the same diagnosis, also without asking me, because she has been worried. Violation.
  4. A chain of shops works out from my purchases that I am probably pregnant, when I have told no one. Violation, and the clearest one on my list.
  5. A stranger photographs a busy street corner, I am recognisable in the background, and the picture goes online. Not a violation.
  6. My mother reads the diary I keep in a drawer. Violation.
  7. I accept an app's terms and conditions, which allow it to sell my location history to a data broker. Violation, even though I consented, and even though I never read them.
  8. A search engine records my queries; I know it does and I do not mind. Not a violation. Those same records sold to an insurer, which then refuses to renew my policy. Violation.
  9. A research dataset is published with names stripped out, but three entries could be re-identified by matching them against an electoral register. Violation, although nobody was targeted.
  10. My closest friend can tell from my face and my voice that something is wrong before I have said a word. Not a violation. An app that infers the same thing from the rhythm of my typing over a month and reports it to my employer. Violation.

  The bystander test seems to handle 1, 4, 5, 6, 7, 9 and 10 reasonably well, but it appears to get 2 wrong, and it cannot separate the two halves of 8. Worse, I cannot see how to repair it without making things worse elsewhere: if I add a clause about the recipient's role or purpose, in order to save 2, that same clause seems to excuse the app in 7 and the insurer in 8, since selling and pricing are exactly what they are for. Yet 2 and 7 are the pair I find hardest to reconcile, because in 2 a disclosure without consent is perfectly acceptable and in 7 a disclosure with consent is not, which suggests consent is not doing the work at all.

  What I would like from you:

  - Begin with two or three sentences diagnosing where my principle actually breaks, before you propose anything.
  - State the principle you think captures the pattern, or a small number of rival candidates, in precisely worded numbered clauses, and say which of my cases motivates each clause.
  - Tell me honestly which of my verdicts your account cannot accommodate and which of them I ought to give up. I would rather have a spare account that overturns one or two verdicts than an elaborate one that rescues all ten, but please say so plainly if the cost of simplicity falls on 4 or 7, which are the two I care most about.
  - Apply the account to two cases I have not listed: a firm that stores no individual fact about me at all but trains a system on my messages until it can imitate me convincingly; and a service that reconstructs the speech of someone who has recently died from their old correspondence. In the second case, say whose privacy, if anyone's, is engaged.
  - Finish by giving me one further case of your own choosing that you expect the repaired principle to handle badly, or that you think should make me change my mind.

  Please keep your answer to no more than 700 words, write it in British English, and argue the matter out in your own words: no citations, references or reading lists, and do not assume I know any technical terminology.
reasoning: |-
  Okay, let me approach this privacy ethics problem methodically. The user presents an intriguing bystander test principle that captures most intuitive verdicts but struggles with cases involving professional roles and meaningful consent. 

  First, I need to diagnose why the bystander test fails: it focuses solely on information accessibility while ignoring the crucial dimensions of relational context and substantive consent. This explains why it handles observational cases well (like the drone or diary) but stumbles over disclosures where role-based expectations matter (like the GP sharing with a consultant vs mother).

  For a better principle, I'm considering three interconnected ideas: informational norms tied to relationships (addressing the GP cases), consent requiring genuine understanding (handling the app's deceptive terms), and secondary usage restrictions (covering the insurer example). Case 2 shows professional norms legitimize disclosure, while case 7 reveals consent without comprehension is hollow. 

  I'll need to honestly confront where this revised approach conflicts with the user's intuitions. Case 8's first half might need reclassification since mere data collection without misuse isn't inherently wrong under this framework. But preserving cases 4 and 7 is paramount as requested.

  For new applications: 
  - The imitation system likely violates dignity rather than privacy per se
  - Reconstructing the deceased's voice engages survivors' expectations more than the dead person's privacy

  Finally, I'll test the principle with a case about mandatory workplace monitoring - where professional context might legitimize what would otherwise be intrusive, forcing reconsideration of absolute privacy claims.
answer: |-
  Here is your diagnosis and proposed repair, argued step by step:

  1.  **Diagnosis:** Your bystander test focuses solely on *physical observability* (what a stranger could naturally perceive). It breaks because privacy norms are fundamentally *relational* and *contextual*. What matters is not just *access* to information, but *who* accesses it, *for what purpose*, and crucially, *what relationship* exists between you and them. Case 2 (GP to consultant) is acceptable because sharing within the care team is normatively expected for your health benefit. Case 7 (app's terms) is unacceptable because the consent was non-substantive (you couldn't reasonably grasp the implications), and the recipient (data broker) has no legitimate, expected purpose *for you*. Consent alone is insufficient if it's not meaningful.

  2.  **Proposed Principle (The Contextual Integrity Principle):**
      1.  **Informational Norms:** Privacy is violated when there is a significant breach of the *contextually appropriate informational norms* governing the flow of personal information. (Motivated by Cases 2, 3, 8: GP->consultant is norm-compliant; GP->mother, insurer use are norm-violating).
      2.  **Substantive Consent:** Consent must be *substantive*: it requires reasonable understanding of the nature and likely consequences of the information flow. Non-transparent or impossible-to-understand consent (like lengthy T&Cs) is invalid for legitimising novel or normatively unexpected flows. (Motivated by Case 7, clarifies Case 8: app consent isn't substantive; insurer use wasn't consented to at all).
      3.  **Purpose & Relationship:** Norms are defined by the *relationship* (e.g., doctor-patient, commercial, familial) and the *original, contextually understood purpose* for collecting the information. Secondary uses incompatible with this purpose breach norms. (Motivated by Cases 4, 8, 10: pregnancy inference/sale, insurer use, employer report are incompatible with the original context/purpose).

  3.  **Accommodating Verdicts & Cost:**
      *   **Accommodates:** 1 (Drone: violates norms of secluded space), 2 (GP->consultant: norm-compliant), 3 (GP->mother: violates patient confidentiality norm), 4 (Pregnancy inference: incompatible purpose), 5 (Street photo: public observation norm), 6 (Diary: violates norms of private possession), 7 (App T&Cs: non-substantive consent), 8 (Search use: norm-compliant; Insurer sale: incompatible purpose & no consent), 9 (Re-identification: violates norms of anonymised research), 10 (Friend: norm-compliant observation; App->employer: incompatible purpose).
      *   **Cost (One Verdict):** This principle would classify the *mere recording* in the first half of Case 8 ("Search engine records my queries; I know it does and I do not mind. Not a violation") as potentially norm-compliant *only if* the collection purpose and norms are reasonably understood and accepted. If you intuitively feel *any* recording is a violation unless explicitly consented to *for that specific act*, even when known and unobjectionable, this principle might feel too lenient here. It prioritises contextual norms and substantive understanding over requiring explicit consent for every single data point collected within an understood context. You might need to relax the strictness of that initial verdict if the context is genuinely understood and acceptable.

  4.  **New Cases:**
      *   **AI Imitation:** This likely *is* a violation. While no single fact is stored, the *pattern* and *expressive identity* derived from your messages constitute highly personal information. Training the system breaches norms concerning the control and use of one's unique expressive characteristics for incompatible purposes (imitation), even if collected consensually (unless substantive consent for *that specific outcome* was clearly given).
      *   **Reconstructed Speech:** This primarily engages the *privacy expectations of the living survivors* (e.g., family, friends) and potentially societal norms about respecting the deceased. The *deceased person's privacy* is less directly engaged (as they lack ongoing interests), but the act might violate norms concerning the respectful treatment of a person's legacy and the sensitivity of communications *originally shared in confidence* with the living. The key breach is against the contextual norms of the original correspondence and the expectations of those still living who were party to it.

  5.  **Challenge Case:** **Mandatory workplace productivity monitoring software.** It tracks keystrokes, application use, and takes periodic screenshots. Employees are clearly informed and must agree to use it to keep their job. According to the principle:
      *   *Norms/Purpose:* The employer-employee relationship involves norms of performance assessment, but continuous, granular surveillance likely exceeds contextually expected oversight, breaching norms of reasonable autonomy and trust.
      *   *Consent:* Agreement under threat of job loss is arguably not fully voluntary or substantive regarding the intrusiveness.
      *   *Verdict:* Likely a violation despite "consent" and a defined purpose. This challenges whether *any* consent within a power imbalance (like employment) can legitimise highly intrusive monitoring, potentially requiring a stricter limit on the *type* of information collected, regardless of consent or stated purpose. It might force you to consider if some informational spheres (like real-time mental states inferred from typing) deserve near-absolute protection.
