answer: |-
  ## The Chart Speaks in Burdens

  The silt-heavy light of the Delta City Archives always smelled faintly of damp vellum and despair. Tamsin, Assistant Recorder Third Class, smoothed the edges of the massive Chart – a calfskin map stained the color of old tea, depicting the ever-shifting labyrinth of the Great Delta. Sandbars, like scattered teeth, interrupted the blue-inked channels snaking towards the open sea. Today, it was a battleground.

  House Salter, gaunt petitioners smelling of brine and desperation, stood on the River side. Their claim: that House Reed, fattened on tolls from the deep-sea channels, illegally diverted a feeder stream, starving Salter’s oyster beds. The remedy: control of the season’s tolls. House Reed’s representatives, draped in indigo wool, radiated calm confidence from the Sea side. The Charter demanded the game.

  Tamsin’s duty was simple: oversee the placement of the markers – polished river stones, obsidian for Reed, chalk-white limestone for Salter – and, once a chain was forged or broken, sign the Certificate of Fairness. The Certificate, pre-printed on thick parchment, bore the weight of centuries. Its central tenet, inscribed beneath the City Seal: *By the Irrefutable Proof of First Advantage, lodged within these Archives, the Petitioner, granted opening placement, cannot be denied victory should they play flawlessly. Thus is Justice assured.*

  "Flawlessly." Tamsin’s lips barely moved. She’d read the Proof. Every archivist did, eventually, in the dusty, silent vaults. Four hundred years old, a masterpiece of cold logic: *Assume the Second Player possesses a strategy guaranteeing victory. The First Player places a stone arbitrarily, then adopts that very strategy, treating their own first stone as a ‘free’ extra piece. Since any stone of one’s own color can only ever strengthen one’s position (by occupying space the opponent might claim or securing a vital link), this ‘extra’ stone ensures the First Player wins too. Contradiction. Therefore, the Second Player cannot have a winning strategy. Since the game is finite, deterministic, and draws impossible, the First Player must have one.*

  It was beautiful. Air-tight. And utterly useless. No one *knew* the winning strategy. The Chart was too vast, the possible moves near-infinite. Petitioners like Salter, often exhausted, under-resourced, facing opponents steeped in generations of recorded games, invariably lost. The Proof existed. The victory did not. Tamsin had signed dozens of certificates, her neat script affirming a fairness built on an invisible, unattainable line. She imagined it sometimes, that perfect path, shimmering just beneath the surface of the Chart, forever out of reach. A ghost road to justice.

  The change hadn’t been in the Proof, nor initially in the rules. It was in the *Delta*. Or rather, the City’s response to it. Pirate activity had spiked in the outer channels last season. The Council’s solution: the *Channel Maintenance Edict*. Any House claiming a sandbar *must* also secure and maintain the deepest adjacent channel to it, funding patrols and beacons. A sandbar was now not just a stepping stone; it was an anchor, chaining you to the expense and vulnerability of guarding the water beside it. An extra stone wasn’t just a potential asset; it could be a crippling obligation.

  House Salter played first. Their patriarch, Elan Salter, hand trembling slightly, placed a white stone on ‘Fisher’s Tooth’, a small bar near the river mouth. A cautious, traditional opening. Reed’s captain, Imara Reed, countered swiftly, black obsidian claiming ‘Serpent’s Back’, a long, key bar further out.

  The game unfolded. Stones clicked onto the Chart. Salter played defensively, trying to build a thin, inland chain. Reed pressed outward, securing deep-water channels with confident placements. Tamsin watched, her recorder’s mind noting each move, her archivist’s soul feeling the new tension in the air. The Edict hung over the board like a fog.

  Salter placed a stone on ‘Mudlark Shoal’, a bar offering a potential link towards the central channels. But Mudlark Shoal abutted ‘Widow’s Deep’, a notoriously treacherous, pirate-favored channel. Elan Salter paled slightly as he placed it; claiming Mudlark meant committing scarce resources to patrol Widow’s Deep all winter.

  Reed countered by claiming ‘Cormorant Rock’, forcing Salter to respond near the river. The pattern repeated: Salter’s placements, while technically sound for connecting sandbars, kept burdening them with dangerous, expensive channel obligations. Reed, playing second, could choose *which* bars to contest, often forcing Salter into claiming bars adjacent to channels Reed had already secured or didn’t mind defending – or into claiming disastrous liabilities like Widow’s Deep. Salter’s stones weren’t just links; they were millstones.

  The critical moment came midway. Salter needed to break Reed’s growing coastal chain. They placed a bold white stone on ‘Gull Point’, a bar projecting seaward. It was a potential bridgehead.

  Imara Reed smiled thinly. She didn’t block Gull Point directly. Instead, she placed a black stone on ‘Siltbank’, a small, insignificant bar *behind* Gull Point, deep in what should have been Salter’s developing territory. Siltbank was useless for Reed’s chain. But it abutted ‘Shark Run’, another deep, exposed channel.

  The logic hammered into Tamsin, cold and absolute. *If Salter adopts Reed’s hypothetical ‘guaranteed second-player strategy’ now, it would treat Salter’s first stone on Fisher’s Tooth as the ‘freebie’. But to follow the strategy perfectly, Salter would need to respond to Reed’s move on Siltbank.* The only moves dictated by the strategy in that area would involve securing connections *around* Siltbank. But Siltbank was Reed’s. To secure links near it, Salter might be forced to claim bars adjacent to Shark Run. Or even worse, *not* claiming them might break their chain elsewhere.

  The ‘free’ stone wasn’t free anymore. It was a fixed point, an *obligation* Salter was stuck with. Fisher’s Tooth, their opening mercy, anchored them to a position that was now potentially *weakened* by the burden of Widow’s Deep, while Reed’s move on Siltbank forced them into a zone where *any* response risked activating the liability of Shark Run. Salter couldn’t simply ‘adopt’ Reed’s strategy starting from Fisher’s Tooth; that stone dictated a specific, resource-draining reality the abstract strategy didn’t account for. The extra stone wasn’t an advantage; in this new calculus of burdens, it was a vulnerability Reed could exploit by forcing Salter into claiming or defending costly positions *adjacent* to their fixed opening point. The contradiction dissolved. The Proof’s central pillar – *a stone of your own can only help* – crumbled under the weight of the Channel Maintenance Edict.

  Elan Salter stared at Siltbank, then at the white stone on Gull Point, then at the looming obligation of Shark Run. His shoulders slumped. He placed his next stone weakly, inland, avoiding the trap but conceding the seaward advance. The end came swiftly after that. Reed’s black stones flowed around Gull Point, forming a solid, unbroken chain from a deep channel they already secured to the open sea. Salter’s fragmented white chain withered on the vine, choked by the cost of its own markers and the channels they demanded.

  Silence descended, thick and sour. The Reed representatives murmured satisfaction. The Salters stood like condemned men. Imara Reed inclined her head towards Tamsin. "The chain is forged, Recorder. Justice is served."

  Tamsin looked down at the Certificate of Fairness on her desk. The pre-printed words glared back: *...the Petitioner, granted opening placement, cannot be denied victory should they play flawlessly. Thus is Justice assured.* Her pen hovered over the signature line. Her hand didn’t tremble; it felt encased in ice.

  Signing it was a lie. The Proof was broken. The game, under these new rules, was not fair. The mercy of the first move was now a potential noose. Salter hadn’t played flawlessly – no one ever did, the winning path was a phantom – but crucially, *even if they had known the old perfect strategy, it might not have worked anymore*. The existential guarantee was void.

  But refusing to sign? Declaring the Charter’s central tenet invalid? It wouldn’t help the Salters; the game was over, Reed’s chain was visibly complete. It would unleash chaos. Four centuries of settled disputes, countless property rights, inheritances, and treaties rested on the sanctity of the Chart and the Proof. Her own family’s modest holdings near the river mouth – granted to her great-grandfather after a successful petition against a now-defunct house – were rooted in a Certificate signed under the same unread Proof. To void it was to potentially void the foundation of half the city’s landed claims. It would be an earthquake, and the first buildings to collapse would be those like her family’s, built on the most recent, most vulnerable precedents. House Reed, vast and entrenched, would weather it; families like hers, and the Salters, would be swept away in the legal tsunami. The lesser evil wasn't Reed winning *this* toll; it was preventing the collapse of the entire, flawed, but functioning system that kept a fragile order in the Delta.

  The lesser evil felt like swallowing ash.

  Tamsin picked up the pen. The nib scratched faintly on the parchment as she signed her name: *Tamsin Vael, Asst. Recorder 3rd Cl.* The formal title felt grotesque. She reached for the Recorder’s seal, a heavy disk of bronze depicting the interlocking chains of the Delta. She held it over the red wax puddle on the certificate. The heat from the cooling wax radiated faintly against her palm.

  Below, Elan Salter made a small, wounded sound. Imara Reed collected her obsidian markers with brisk efficiency. The Chart lay between them, a testament to connection and severance. The perfect, unwalkable path to victory still shimmered, Tamsin knew, beneath the surface, a cruel mathematical ghost. It existed. It always would. And it meant absolutely nothing anymore.

  The seal hovered. The wax deepened from crimson to near-black. The silence in the archive chamber was complete, waiting for the final, irrevocable *thump* of institutional certainty. Tamsin’s arm didn’t move. The seal hung suspended, a bronze question mark over the cooling blood of the wax. The only sound was the distant, indifferent sigh of the Delta against the city walls.
