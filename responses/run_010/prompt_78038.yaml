  Next, the user points out Miss Lucy and Miss Emily's conflict. Lucy tells the truth and gets fired, while Emily defends gradual disclosure. Fricker sees filling gaps as good, but here Lucy's truth-telling doesn't change anything. The students already knew but couldn't articulate it. This challenges Fricker's model because the injustice isn't just structural; it's about how the system manages disclosure. Emily's position might be seen as paternalistic, arguing that ignorance allows a childhood. But is that defensible? The novel shows that even with truth, the students are paralyzed by their conditioned concepts. So Emily's approach perpetuates the capture, making her complicit.

