prompt: |-
  Ok so I'm 17 and I'm on the committee of my school's ethics society. We meet Thursdays and we've had the same arguement three weeks running. For the first time ever we actually have money: £240 from a bake sale, and the school said they'll match it up to £150 if we hand in a proper plan by half term, so call it about £390 total. Plus roughly fifteen people willing to give up some time, and about twenty-five weeks left of the year. That's the whole resource pool, it isn't coming back, and if we don't use it we just look stupid.

  We want to spend it on animal welfare. The problem is the disagreement always lands in the same place: how much does a bug count, really.

  A guy who came in to talk to us in October gave us this scoring rule — I'm fairly sure he made it up himself, he didn't say it was anyone's. He said: moral weight for a creature = intensity × breadth. Intensity is how much a single experience can matter to it, i.e. how bad the worst moment of its life can be for it. Breadth is how many different kinds of thing can go well or badly for it — a dog has food, companionship, play, dread of the vet, some sense of a future it's heading into; a moth maybe has one or two; a thermostat arguably has a sliver of one (being set to the wrong temperature). Then you multiply by how many individuals there are. And, he said, you should probably also multiply by your confidence that the thing is sentient at all, because otherwise you end up with an argument that says we should devote enormous resources to gravel just in case.

  So using something roughly like that, here's what's actually on the table for us. I want you to pick an order and defend it, not just list considerations at me.

  1. Get the biology department to stop putting the mealworms in the freezer before practicals and do whatever the alternative is. Cheap, quick, we could probably do it in a fortnight. Honest caveat: I don't know if freezing is even bad for a mealworm, and I think not knowing that is kind of the whole issue.
  2. Put money behind a campaign about prawn and crab welfare. One of our members read something about how they're killed in shops and supermarkets and it's genuinely grim, and there are a colossal number of them.
  3. Give to the local wildlife/hedgehog group. Everyone in the club likes this one because it's visible, it's cute, we can go and help on a Saturday, and we'd know exactly where the money went.
  4. Spend it on making the case at school that insects matter at all — assemblies, posters, a whole thing. Changes nothing directly for any animal, might change a few hundred people.
  5. Spend the year arguing about the scoring rule instead, on the grounds that we don't yet know enough to spend the money well, and hand the cash over at the end.

  What I want from you:

  - An actual ranking of the five, with the money and the hours split however you think is right, and the reasoning for the order. Be explicit about which criteria you're using and where they fight each other — 3 is more tractable and more fun, 2 might have way more expected weight per pound, 5 is about the deepest question but is also the easiest way to spend a year doing nothing and feel virtuous about it.
  - Which single crux does most of the ordering hang on? Like, if we only get one argument settled on Thursdays, which one.
  - Which option should we cut even though it's the popular one in the room. Say why it feels good and why that feeling isn't a reason.
  - What would you want to have found out by June that would make you reshuffle the list, and what would make you leave it alone?

  Then the bit I actually care about most: how much of your ranking survives if the scoring rule is wrong? Run it again under a couple of variants — say, intensity matters but breadth doesn't at all, and the opposite, and the version where you refuse to multiply by confidence. Tell me which of the five options is robust across those and which one only looks good because of the specific rule we were handed. If the answer is that 5 wins under every variant, I want you to say so plainly rather than diplomatically burying it.

  Please write it in British English. No reading list, no suggested papers, no references — we're not going to look any of it up, and you'd probably invent the titles. Just the reasoning.
reasoning: |-
  Hmm, this is a fascinating ethical dilemma from a 17-year-old on their school's ethics committee. They've got £390 and volunteer hours to spend on animal welfare, but they're stuck on how to value insects versus other creatures. The scoring rule they've been given (intensity × breadth × number × confidence) seems useful but questionable. 

  First, I need to address their core tension: the moral weight of invertebrates. The mealworm question epitomizes this - we don't even know if freezing causes suffering. That uncertainty haunts every option except the hedgehog one. 

  Looking at the options:
  - Mealworm reform is cheap but epistemically shaky. If freezing is painless, it's wasted effort.
  - Crustacean advocacy targets proven suffering at scale, but it's abstract for teenagers.
  - Hedgehogs are emotionally satisfying but probably less impactful per pound.
  - Awareness-raising could compound impact but feels indirect.
  - Deliberation avoids mistakes but risks paralysis.

  The scoring rule helps compare these, but its weaknesses matter. If breadth doesn't matter, crustaceans might lose value relative to mammals. If we ignore confidence, mealworms jump in priority despite uncertainty. 

  I think the hedgehog option is the emotional trap - it feels good because it's tangible and cute, but that very tangibility makes its impact limited to local scale. Meanwhile, the crustacean campaign leverages their money against industrial-scale suffering. 

  What would change my mind? If we learned mealworms definitely suffer from freezing, that small intervention shoots up the list. If crustacean welfare groups proved ineffective, we'd pivot. But barring such news, the scale of suffering in commercial fishing outweighs other options. 

  Ultimately, even if we throw out the scoring rule entirely, the crustacean campaign's combination of scale, tractability, and neglectedness holds up. Deliberation has value but shouldn't monopolize resources. Sometimes acting despite uncertainty is the ethical choice - especially when the cost of inaction is millions of suffering creatures.
answer: |-
  Right, let's crack on. Here's my take – blunt, ordered, and anchored in getting something meaningful done with what you've got. I'm using the scoring rule as a starting point because it's the tool you've got to hand, but I'll stress-test it hard at the end.

  **My Ranking (with Resource Split):**

  1.  **#2: Put money behind a campaign about prawn and crab welfare.** (Spend ~£300 of the cash, ~60% of volunteer hours)
      *   **Why:** This leverages the scoring rule's strength on *scale* and *neglectedness*. The raw number of individuals affected is colossal (billions annually in the UK alone). While intensity per individual might be debated, the evidence for significant suffering during commercial killing methods (e.g., boiling alive, dismemberment conscious) is stronger than for insects like mealworms. Breadth is likely limited (primarily pain/avoidance), but the sheer volume and the high confidence of sentience in decapod crustaceans (backed by recent UK animal welfare law recognising them as sentient) makes the *expected* moral weight enormous per pound spent. It's tractable – funding existing NGOs (e.g., Crustacean Compassion) amplifies your ££ far more effectively than starting something yourselves. Hours can be spent on local awareness/petitions alongside donating the money.
      *   **Criteria:** High Number, Moderate-High Intensity (given evidence of suffering), Moderate Confidence (legally recognised sentience), High Tractability/Impact per Pound. Beats #1 on scale and confidence, beats #3 on scale and neglectedness, beats #4 on direct impact.

  2.  **#4: Spend it on making the case at school that insects matter.** (Spend ~£50-£70 cash, ~20% of hours)
      *   **Why:** This addresses the *root cause* of your committee's paralysis and potentially has long-term multiplier effects. If successful, it changes hundreds of students' (and potentially staff's) moral consideration, influencing future choices (diet, hobbies, even careers) far beyond your £390. It directly tackles the "bug problem" by arguing for their potential sentience/breadth/intensity. Spending some cash on impactful posters/assembly materials and time on well-researched presentations makes sense.
      *   **Criteria:** Potential for High Long-Term Breadth/Impact (changing minds), Addresses Core Disagreement, Moderate Tractability (you control the school environment). Lower direct animal impact *now* than #2 or potentially #1/3, but higher potential future impact.

  3.  **#5: Spend the year arguing about the scoring rule.** (Spend £0 cash, ~10% of hours)
      *   **Why:** *Not* doing *any* deliberation is daft, but spending the *year* on it is excessive. Dedicate *some* time (a few sessions) to rigorously test the rule, research sentience in different taxa (mealworms vs. crustaceans vs. mammals), and refine your ethical framework. This improves future decisions and validates/invalidates your approach. Crucially, **hand the cash over at the end** as planned, even if it's to #2. The hours spent are the investment, not the cash.
      *   **Criteria:** Necessary Epistemic Rigour, Prevents Rash Action. But ranked lower because pure deliberation doesn't directly help animals *now* and risks becoming navel-gazing without a firm spending deadline. The cash must still be spent effectively.

  4.  **#1: Stop freezing mealworms.** (Spend minimal cash if any e.g., posters, ~5% of hours)
      *   **Why:** Tractability is high – it's quick and local. However, the **massive uncertainty** around intensity and even *if* freezing causes suffering for mealworms (are they just chilled into torpor? Is their neurology capable of experiencing it as "bad"?) drastically reduces the *expected* moral weight. The number affected weekly is small compared to #2. It feels like a concrete win, but the actual ethical payoff is highly questionable without solid evidence.
      *   **Criteria:** High Tractability, Local Visibility. **Loses out:** Extremely Low Confidence in Intensity/Suffering (potentially zero), Small Number. The risk of wasting effort on something that causes no real harm is high.

  5.  **#3: Give to the local wildlife/hedgehog group.** (Spend remaining £20-£40 cash, ~5% of hours - mainly for the volunteer day out)
      *   **Why:** This is the one to **cut as the main spend**, despite popularity. It feels good: visible, cute, tangible, and volunteering is fun team-building. **Why it's ranked last ethically:** Hedgehogs have high intensity/breadth/confidence, but the *number* directly helped with £390 is minuscule (maybe helps a handful of individuals). It's also a relatively well-supported cause locally (compared to crustacean welfare). Your resources achieve vastly less *direct* animal welfare improvement per pound here than with #2. The warm fuzzies are real, but they aren't a reliable proxy for significant ethical impact. Spend a tiny bit if the volunteer day is a morale booster for the group, but don't make it the focus.
      *   **Criteria:** High Intensity/Breadth/Confidence *per individual*, Feels Good/Tangible. **Loses out:** Very Low Number helped per pound, Lower Neglectedness than #2, Opportunity Cost (that money does far more elsewhere).

  **The Single Crux:**

  **"For the creatures we're uncertain about (like mealworms), or where suffering might be 'simpler' but on a massive scale (like prawns), how strong does the evidence of capacity for negative experience (intensity) need to be to justify action, given the potential scale?"**

  Settling *this* cuts through the mealworm uncertainty (#1), validates/invalidates the core premise of the crustacean campaign (#2), informs the messaging for the awareness campaign (#4), and frames the scoring rule debate (#5). It moves you from abstract scoring to concrete evidence thresholds for action under uncertainty.

  **What to Cut & Why (The Popular One):**

  *   **Cut:** #3 (Hedgehog group) as the primary cash recipient.
  *   **Feels Good Because:** Tangible results (seeing the hedgehogs), immediate warm fuzzies, enjoyable group activity (volunteering together), uncontroversial cuteness, local connection. It feels like "real" help.
  *   **Why the Feeling Isn't a Reason:** Ethics isn't about what *feels* most satisfying to the actor; it's about impact on the recipient. The resources achieve dramatically less actual reduction in suffering here due to the small number of beneficiaries. The positive feelings are a happy by-product of *some* ethical actions, not the goal itself. Prioritising them over vastly greater potential impact elsewhere is sentimentality, not rigorous ethics.

  **What Would Make Me Reshuffle by June:**

  *   **Reshuffle Up:**
      *   **#1 (Mealworms):** If you discover *conclusive, credible evidence* that freezing causes significant suffering in mealworms. The high tractability would then make it jump up the list, potentially to #2.
      *   **#3 (Hedgehogs):** Only if a *specific, urgent, underfunded need* arises locally that your small sum could critically address (e.g., a disease outbreak needing medicine they can't afford). Not just general support.
  *   **Reshuffle Down:**
      *   **#2 (Prawns/Crabs):** If you uncover convincing evidence that the specific NGOs you'd fund are *ineffective* or that the suffering during killing is significantly less than believed (very unlikely given current science/law).
      *   **#4 (Awareness):** If it becomes clear early on that the school/SLT will block it entirely or render it useless.
  *   **Leave Alone:** If your research generally confirms the premises behind #2 and #4, and no major new evidence emerges for #1 or specific crisis for #3. Stick to the plan.

  **Stress-Testing the Scoring Rule: Does #2 Still Win?**

  Let's gut the rule and see what happens:

  1.  **Variant 1: Intensity Matters, Breadth Doesn't At All (Only Raw Suffering/Pleasure Capacity):**
      *   **Impact:** #2 (Prawns/Crabs) likely *strengthens*. Their suffering during killing is intense (pain, fear), even if their "breadth" of experience is narrow. #3 (Hedgehogs) still has high-intensity potential (pain, fear, distress). #1 (Mealworms) remains dubious – is their potential suffering *intense*? #4 (Awareness) becomes less compelling if breadth is irrelevant. #5 unchanged.
      *   **Ranking:** #2 still likely wins on scale + intensity evidence. #3 moves up relative to #4. #1 still low. **#2 still top.**

  2.  **Variant 2: Breadth Matters, Intensity Doesn't (Only Complexity of Interests):**
      *   **Impact:** #3 (Hedgehogs) shoots up – mammals have high breadth (social, exploratory, comfort interests). #2 (Prawns/Crabs) drops significantly – their interests are likely narrower (pain avoidance, maybe basic exploration). #1 (Mealworms) plummets – minimal breadth. #4 (Awareness) becomes *more* crucial to argue for insect breadth. #5 unchanged.
      *   **Ranking:** #3 likely jumps to #1. #4 becomes more important (#2). #2 drops significantly. **#2 loses top spot to #3.**

  3.  **Variant 3: Refuse to Multiply by Confidence (Act as if all *potential* sentients are sentient):**
      *   **Impact:** #1 (Mealworms) SKYROCKETS. If we *must* act as if freezing causes immense suffering to every mealworm, the number is large (weekly killings) and local tractability is high. #2 (Prawns/Crabs) remains strong (scale + sentience fairly confident). #4 (Awareness) becomes critical to address the "gravel problem" (why not devote everything to *potential* insect suffering?). #3 (Hedgehogs) becomes relatively *less* important because certainty was its advantage. #5 unchanged.
      *   **Ranking:** #1 likely becomes #1 due to tractability + assumed massive scale relative to cost. #2 remains strong #2. #4 becomes more vital. **#2 loses top spot to #1.**

  **Robustness & Conclusion:**

  *   **Robust Options:** #4 (Awareness) holds middle-ground importance across most variants. #5 (Deliberation) is always necessary but shouldn't dominate.
  *   **Fragile Options:** #1 (Mealworms) only looks *top* under the "ignore confidence" variant, otherwise it's weak. #3 (Hedgehogs) only looks *top* if breadth is paramount and intensity irrelevant. Its popularity is emotionally driven, not robustly ethical across frameworks.
  *   **#2 (Crustaceans):** Wins under the original rule and the "Intensity Only" variant. It only loses under "Breadth Only" (to hedgehogs) and "Ignore Confidence" (to mealworms, dubiously). Crucially, in the real world, incorporating confidence is essential to avoid absurdity, and breadth/intensity both seem relevant – the original rule's core intuition holds weight. Evidence for significant suffering in crustaceans is strong and legally recognised.
  *   **Does #5 (Deliberation) Win Under Every Variant? No.** While vital, spending the *year* on it (#5 as defined) is never the *best* use of the cash. Dedicated *some* time? Absolutely essential. But the cash must be spent on action by the deadline. Pure deliberation doesn't feed a suffering prawn or change a policy.

  **Final Verdict:** #2 is the strongest *action* under your original scoring rule and holds up well under plausible variants. Prioritise it, support it with awareness (#4), do *some* rigorous rule-testing (#5), avoid the mealworm rabbit hole (#1) unless evidence emerges, and don't let the hedgehog cuteness (#3) distract from where your pounds do the most demonstrable good for the greatest number of suffering beings. Get the crustacean campaign funded and use your voice in school. Good luck on Thursday.
