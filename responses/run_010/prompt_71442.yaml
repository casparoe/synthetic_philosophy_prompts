  The user wants three structured responses: First, a brainstorming grid of franchise rules vs democratic theories. Second, an analysis of which theory best explains the actual rules. Third, where theories contradict or go silent. They specifically want two thorny issues addressed: the bootstrap objection (regress vs circularity) and the post-referendum negotiation implications.

  For the brainstorming grid, I'll consider: all-affected-interests, all-subjected-to-coercion, all-subjected-to-this-specific-decision, and membership-based accounts. Each franchise rule will get a quick assessment under each theory. 

  For the analysis, I suspect the actual rules reflect historical sedimentation more than principle - the Commonwealth/Irish inclusion being colonial relics, the 15-year rule arbitrary, Gibraltar's status unique. All-subjected-to-coercion might come closest to explaining peers' inclusion, but even that's shaky. 

  The bootstrap question is fascinating. Their friend calls it infinite regress, but I lean toward circularity being the core problem - you can't democratically legitimate the demos without already having one. This matters because circularity suggests the problem is logically unresolvable, while regress might imply it's merely impractical.

  On post-referendum negotiations: the EU27 deciding excluded residents' fates does look like a second-order boundary problem. This supports Whelan's pessimism - democratic procedures can't contain their own boundary issues. The razor-thin margin exacerbates legitimacy concerns but doesn't change the theoretical problem.

  Must avoid two pitfalls: First, no speculation about whether different rules would've changed the outcome. Second, no citations - they want raw analysis. Keep it under 1200 words while maintaining rigor. The tone should be collegial but precise - they've clearly earned that after their wine-fueled debate.
answer: |-
  ### (1) Brainstorming Grid: Franchise Rules vs. Democratic Boundary Theories  
  *(✔ = Consistent; ✘ = Inconsistent; ~ = Ambiguous/Partial; * = Theory-Specific Conflict)*

  | Franchise Rule                     | All-Affected Interests (Goodin) | All-Subjected-to-Coercion (Abizadeh) | All-Subjected-to-*This* Decision | Membership/Participation (Dahl/Rawls) |
  |------------------------------------|----------------------------------|--------------------------------------|----------------------------------|---------------------------------------|
  | **UK + Gibraltar included**        | ✔ (Gibraltar deeply affected)   | ✘ (Gibraltar not UK-coerced)         | ✔ (Decision binds both)          | ✔ (Gibraltar de facto UK territory)   |
  | **Irish/Commonwealth citizens in** | ✘ (Minimal affectedness)        | ✘ (Not subject to UK coercion)       | ✘ (Decision doesn’t bind them)   | ✔ (Historical membership artifact)    |
  | **Lords vote**                     | ~ (Affected but unelected)      | ✔ (Subject to UK laws)               | ✔ (Bound by outcome)             | ✘ (Excluded from GE franchise)        |
  | **15-year expat cutoff**           | ✘ (Excluded long-term affected) | ✘ (Not currently coerced)            | ~ (Bound but can’t participate)  | ✔ (Residual membership logic)         |
  | **EU nationals excluded**          | ✘ (Massively affected)          | ✔ (Subject to UK coercion) *!*       | ✘ (Directly bound by outcome)    | ✘ (Taxpaying residents excluded)      |
  | **16-17 y.o. excluded**            | ~ (Affected but age-limited)    | ✔ (Subject to coercion)              | ✔ (Bound by outcome)             | ✔ (Status quo age threshold)          |
  | **Prisoners excluded**             | ~ (Affected but penal status)   | ✔ (Highly coerced) *!*               | ✔ (Bound by outcome) *!*         | ✔ (Status quo exclusion)              |
  | **Crown Dependencies excluded**    | ✘ (Deeply affected)             | ✘ (Not subject to UK coercion)       | ✘ (Bound via int’l treaties)     | ~ (Separate legal entities)           |

  **Key Tensions**:  
  - **All-Subjected-to-Coercion** *requires* including EU nationals/prisoners but *excludes* Irish/Commonwealth/Gibraltar.  
  - **All-Affected** demands inclusion of EU nationals, long-term expats, Crown Dependencies, youth.  
  - **Membership** explains most exclusions (EU nationals, youth) but clashes on Lords/Commonwealth.  
  - **Subjected-to-This-Decision** implodes: EU nationals *are* bound, Gibraltar *isn’t* fully bound, expats *are* bound but excluded.

  ---

  ### (2) Which Theory Explains the Actual Franchise?  
  **Dominant Logic: Historical Membership Sediment**  
  The rules map almost perfectly onto the **UK’s existing electoral franchise** (Parliamentary Elections Act), plus Gibraltar’s unique status. This isn’t principled coherence but institutional inertia:  
  - **Irish/Commonwealth inclusion**: Imperial legacy (reciprocal voting rights), not current affectedness.  
  - **Lords voting**: Referendums ≠ general elections; they’re legislators subject to implementing the result.  
  - **15-year expat rule**: Arbitrary compromise between "lifetime membership" and logistical feasibility.  
  - **EU nationals excluded**: Mirroring general elections (no voting rights for non-Commonwealth foreigners).  
  - **Youth excluded**: Status quo age threshold.  
  - **Crown Dependencies out**: They’re not part of the *UK* franchise, despite UK control of foreign policy.  

  **Gibraltar** is the outlier explained by EU law: It was part of the EU *through* the UK, so excluding it would have violated EU treaty obligations. **Principle 0, Legal Necessity 1**.  

  **No theory justifies the whole package**. The franchise is a **Frankenstein of historical accidents**, not a boundary-theoretic ideal.  

  ---

  ### (3) Where Theories Go Silent or Self-Destruct  
  **Silences**:  
  - **The "Advisory" Dodge**: Theories assume binding decisions. If the vote is consultative, who’s "subjected"? The government? Parliament? Voters? All theories stumble here.  
  - **Temporal Boundaries**: The 15-year rule exposes that *no* theory cleanly defines when membership expires. Is it coercion? Residency? Emotional ties?  
  - **Scale of Effect**: "Affectedness" is infinite (e.g., German car workers). The UK drew an arbitrary line at *direct legal subjugation*, but EU nationals proved even that wasn’t applied consistently.  

  **Contradictions**:  
  - **All-Subjected-to-Coercion vs. Itself**: Including Irish citizens (not coerced) while excluding EU nationals (coerced) is indefensible.  
  - **Membership vs. Democratic Legitimacy**: If membership defines the demos, how was it democratically constituted? (Hello, bootstrap!)  
  - **Subjected-to-This-Decision**: Gibraltar’s inclusion admits that *legal reach* matters more than territorial sovereignty... but Crown Dependencies were excluded anyway.  

  ---

  ### Pressing Your Two Issues  
  #### (A) Bootstrap: Regress or Circularity?  
  **Your friend’s "infinite regress" is descriptively accurate but misses the core paradox**. Yes, the current demos was shaped by prior decisions (e.g., Commonwealth voting rights established by pre-democratic empire). But the **circularity** is the normative trap:  
  > *To democratically define the demos, you need a demos to make the decision.*  

  The referendum franchise was set by **Parliament (sovereign authority)**, not by democratic fiat. This *avoids* circularity by appealing to an undemocratic foundation (parliamentary supremacy). The "regress" ends in raw power, not a primordial demos. **Does it matter?** Yes:  
  - If it’s *just* regress, you might ground it in "original consent" (Locke) or practicality (Weber).  
  - If it’s *circular*, democracy is foundationally self-undermining (Whelan’s pessimism).  

  The UK case shows **circularity circumvented by sovereignty**—but that sovereignty’s legitimacy rests on prior regress (e.g., Magna Carta → Cromwell → Glorious Revolution → Reform Acts).  

  #### (B) Aftermath: Second-Order Boundary Problem?  
  **Yes, the EU27 negotiation was a boundary reset**. The excluded EU nationals’ rights were decided by:  
  1. The **EU Council** (27 heads of state),  
  2. **Bargaining** with the UK government (which had a referendum mandate).  

  This exposes **two fatal gaps**:  
  - **Internal Exclusion**: 3M UK residents silenced in the "democratic" decision.  
  - **External Reinscription**: Their fate was decided by a *non-democratic* body (EU Council) and inter-state power dynamics.  

  **Does this confirm Whelan?** Grimly, **yes**. Democracy didn’t fix its edges; it **outsourced them to a non-democratic forum**. The UK’s sovereign stipulation of the franchise *worked* procedurally, but the legitimacy is **manufactured retrospectively** by:  
  - The losers accepting defeat (mostly),  
  - The state’s coercive power to enforce Brexit,  
  - The EU27’s deal masking the boundary failure.  

  **The razor-thin margin exacerbates but doesn’t create the problem**. Even a 60-40 vote leaves the *excluded* aggrieved. What’s damning is that the margin made the **state’s brute-force override** (of 48.1% + excluded residents) more visible.  

  ---

  ### Bottom Line  
  The 2016 franchise was **unprincipled sediment**. Boundary theories highlight its contradictions but offer no escape from the bootstrap paradox. The aftermath proves democracy’s edges are **always contested and ultimately enforced by power**—not reasoned democratic closure. This case is a textbook example of why Whelan despaired: *Democracy presupposes what it must justify*. Parliament drew a line; the world moved on; but the scar remains.
