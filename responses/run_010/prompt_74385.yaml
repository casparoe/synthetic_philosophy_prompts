  Biggest challenge: distinguishing HOT from Global Workspace. They'll likely converge at "no binding requirement" since both tolerate temporal mismatches. Should be transparent about that limit. Also need to warn that IIT and panpsychism get excluded for not engaging with timing empirically - fair sacrifice for focus.

