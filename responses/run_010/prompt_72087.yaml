  - Haunted by philosophy-of-science imposter syndrome ("Whewell's consilience with serial numbers filed off")
  - Worried their "institutional" framing will trigger material-culture-studies reflexes about "unearned leaps"

  For the prep sheet, I'll prioritize by damage x likelihood as requested. The Bayesian quant specialist probably tops the list - their capacity data objections could unravel the foundation. The petrographer's sourcing critique is next - if those "three fabric groups" collapse to one, the administrative control argument weakens significantly. 

  Special attention needed for that peripheral variant paradox: their claim that smaller local jars *confirm* institutional reach is counterintuitive enough that even allies might balk. I'll craft the strongest possible "immunizing hypothesis" charge they might face, and a reply that leans on the "imitation under constraint" logic without overclaiming.

  The unspoken nightmare question - about what evidence would falsify their thesis - is revealing. Their admission that peripheral variants "should" support market exchange but don't suggests admirable honesty but also vulnerability. I'll suggest a pivot: reframe as "absence of expected market signals" rather than claiming perfect falsification criteria.

  Preemptive moves I'll recommend: 
  - Slide footnote on reconstruction assumptions for capacities
  - Verbally flag the cooking/jar variability comparison as "provocative but imperfect" early on
  - Explicitly differentiate "modest administrative reach" from full state apparatus

  Biggest risk area remains the philosophy-of-science underpinnings. When they say "this isn't ethnoarchaeology in quantitative costume," they're begging not to be asked about middle-range theory. I'll give them an escape hatch via "locally robust inference" rather than grand universals.

  This is going to be a gladiatorial seminar. My goal is to arm them with parries and pivots so they leave bloodied but standing.
answer: |-
  Here is your Q&A prep sheet, prioritized by (likelihood × damage potential) and tailored to your audience's specific expertise. I've flagged fatal methodological vs. case-specific issues, noted concessions to make early, and crafted replies with candid weaknesses.

  ---

  ### **Top-Tier Objections (High Likelihood/High Damage)**
  1. **The Quantitative Archaeologist (Bayesian/Compositional)**  
     *Objection:* "Your capacity CV comparison is invalid. Hand-made cooking pots are functionally distinct from wheel-thrown storage jars. Worse, your bimodal distribution likely reflects arbitrary binning—how many complete profiles? What reconstruction algorithm? Show kernel density plots, not histograms."  
     *Reply:* "Valid concern. We have 27 complete profiles reconstructed via polynomial curve-fitting of ≥3 diagnostic sherds each, cross-verified against 3 intact jars. Kernel density plots (available offline) confirm bimodality [show quick sketch if allowed]. Yes, comparing functional classes is imperfect, but the CV difference (8% vs. 22%) exceeds ethnoarchaeological baselines for *comparable* vessels [e.g., Feinman et al.]. The key is the *within-class* standardization."  
     *Weakness:* Admits comparison isn't apples-to-apples; avoids committing to CV thresholds.  
     *Tactic:* **Reframe**—shift focus to intra-class regularity.  
     *Fatal to:* Case study if bins/kernel debate undermines bimodality.  

  2. **The Petrographer (Thin Sections)**  
     *Objection:* "Three source groups? With how many thin sections? I’ll bet you’re over-splitting a single geochemical continuum. If your 'sources' are actually micro-variations within one clay bed, your 'centralized production' evaporates."  
     *Reply:* "Forty-seven thin sections and 136 pXRF spot analyses. PCA shows three discrete clusters [briefly gesture clustering plot]. Crucially, each group correlates with non-overlapping extraction zones—here, here, and here [map snippet]. We’ve excluded diagenetic variation via micromorphology."  
     *Weakness:* Doesn’t disprove wider clay distribution; sample size may seem small to petrography purists.  
     *Tactic:* **Hold**—cite specific PCA loadings if pressed.  
     *Fatal to:* Case study if groups collapse.  

  3. **The Interpretive Theorist (Material Culture Studies)**  
     *Objection:* "You’ve reified ‘institutions’ from pots! Where’s your engagement with *chaîne opératoire*? If producers shared techniques but not oversight, you’d get identical forms. This is typological determinism in a quantitative trench coat."  
     *Reply:* "Fair—but we *have* tracked operational sequences. Trimming marks, coil junctions, and firing clusters differ *between* source groups yet output near-identical jars. That divergence in *process*, not just product, implies enforced templates."  
     *Weakness:* Still indirect; no producer signatures or workshop evidence.  
     *Tactic:* **Concede + Reframe**—"I concede we lack direct evidence of potters’ social ties. But the *convergence* of form amid operational divergence demands explanation beyond tradition."  
     *Fatal to:* Methodological claim if "institution" requires direct behavioral proof.  

  ---

  ### **High-Damage Wildcards (Lower Likelihood, But Crippling)**  
  4. **The Economic Historian (Premodern Markets)**  
     *Objection:* "Why can’t regularity emerge from repeated transactions? Medieval fishmongers converged on barrel sizes without central coordinators. Where’s your *positive* evidence for administration?"  
     *Reply:* "In markets, you see *gradual* standardization over time. Here, jars appear abruptly standardized *from inception* at new settlements. Plus, the peripheral variants—deliberately *undersized* yet mimicking the form—suggest imposed norms flouted at edges."  
     *Weakness:* Assumes abrupt standardization; medieval analogy stings.  
     *Tactic:* **Hold**—stress simultaneity of form + settlement.  
     *Fatal to:* Case study if comparable market examples exist.  

  5. **Behavioral Archaeologist (Taphonomy)**  
     *Objection:* "Burned deposits? Construction fills? You’ve cherry-picked catastrophic/ritual deposits! Where’s the domestic refuse? Your sample isn’t ‘event-locked’—it’s systematically biased."  
     *Reply:* "We’ve sampled 14 middens—jars are <5% of sherds there versus >40% in destruction layers. But note: these jars *functioned* for storage/transport. Their rarity in trash suggests curation, not bias. The ‘events’ capture them *in use*."  
     *Weakness:* Can’t disprove ritual vs. administrative use.  
     *Tactic:* **Reframe**—argue rarity supports elite control.  
     *Fatal to:* Case study if jars proven ritual.  

  ---

  ### **The Peripheral Variant Trap**  
  6. **Synthetic Critic (Any Senior Faculty)**  
     *Objection:* "You claim peripheral variants *confirm* institutional reach. That’s unfalsifiable! If they matched, you’d say ‘control’; when they don’t, you say ‘partial control’. How is this not immunization?"  
     *Reply:* "Because we see *gradient* conformity: settlements within 15km match norms; beyond 20km, sizes drop. If institutions were absent, we’d see *radical* divergence—local forms, not scaled-down copies. This is mimicry under attenuated influence."  
     *Weakness:* Still slippery; no clear "failure" threshold.  
     *Tactic:* **Reframe + Concede**—"I concede it’s not *proof*—but it’s consistent with comparative models of hegemonic control [e.g., Sinopoli 1994]. What *would* falsify it? If variants abandoned the form entirely."  
     *Fatal to:* Methodological claim (if seen as circular).  

  ---

  ### **Preemptive Concessions (Minute 5)**  
  - **Concede upfront:**  
    - "This isn’t a *state*—it’s sub-polity coordination."  
    - "CV comparisons across functional classes are heuristic, not definitive."  
    - "We lack epigraphic proof of administration."  

  ### **Your Nightmare Question**  
  *Objection:* **"What single finding would make you abandon administration for market exchange?"**  
  *Why it’s bad:* Your answer ("peripheral variants") contradicts your thesis.  
  *Real nightmare:* **"Show us your Bayesian model for jar standardization over time. If it’s gradual, it’s a market; if abrupt, it’s admin."**  
  *Reply:* "We lack high-resolution phasing for that—but in Phase 1B deposits, standardization is *already* present. Future ceramic seriation may test this."  
  *Tactic:* **Concede** data limitation; deflect to future work.  

  ---

  ### **Critical Preemptions (Slide/Verbal)**  
  - **For petrographer:** Footnote: "3 fabric groups = PCA clusters (n=47 thin sections) at 90% confidence."  
  - **For Bayesian:** Verbally: "Capacity binning uses Scott’s Rule; sensitivity tests with varying bins support bimodality."  
  - **For theorists:** Early slide: "‘Institution’ here = *enforced standardization of utilitarian goods*."  

  ### Summary  
  **Fatal to methodology** if:  
  - "Institution" requires direct evidence you lack.  
  - Consilience is dismissed as circular.  
  **Fatal to case study** if:  
  - Petrographic groups dissolve.  
  - Capacity bimodality breaks.  

  Go in preempting petrography/statistical concerns, concede functional comparisons early, and defend the peripheral variant with *spatial gradients*, not logic. Your composure point: when cornered, say "That’s beyond this dataset—but let’s design a test." You’ve earned the right to your inference.
