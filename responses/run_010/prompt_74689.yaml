prompt: |-
  I chair the program review panel of a mid-sized private foundation whose board was deliberately constituted, forty years ago, out of two blocs with genuinely incompatible moral outlooks: a faith-based bloc for whom certain acts are wrong in themselves regardless of consequences and who treat the foundation's endowment as held in trust for a particular community of beneficiaries, and a secular bloc that reasons almost entirely about aggregate outcomes and is willing to fund anything that demonstrably reduces suffering. Every allocation decision needs a two-thirds vote, so neither bloc can govern alone and both have learned to negotiate. Last night I argued for two hours with a friend who teaches philosophy, and he was not impressed by the way I described my job. His line, roughly, was this: the whole talk of gains from trade between value systems quietly assumes there is some common currency in which each side's stakes can be measured and compared, and none of these outlooks grants that — the faith bloc denies that its prohibitions have a price at all, and the secular bloc denies that anything but outcomes can be traded — so what I call a compromise is really either one side's capitulation with a receipt attached, or the mechanical reproduction of whichever side has the stronger fallback position, since the disagreement point that any such bargain is measured against is fixed by the standing rules and the endowment, which is to say by power rather than by morality. I want to know whether he is right, and if he is partly right, whether a usable procedure can still be built inside the part he is wrong about.

  So I am asking for a decision procedure my panel can actually run on a contested item, not an essay about whether moral compromise is coherent. The constraints are these: we meet quarterly and each meeting carries eight to fourteen contested allocations; the panelists are practitioners — a hospital administrator, two program directors, a retired judge — none of whom has any training in ethics and none of whom will read anything longer than two pages; I have about forty minutes per item, and I chair and must produce a recommendation that survives a twenty-one-member board vote. The procedure needs to state the questions in the order they should be asked, what counts as a sufficient answer to each, where it terminates in a flat no, and where it deliberately hands the question to a human being because the issue is one of value rather than fact. It has to handle the hard cases explicitly rather than wave at them: how to classify what is actually on the table, since a genuine trade looks identical from the outside to a truce, to a split-the-difference fudge, and to a surrender; whether trades may cross domains (a bloc abstaining on program A in exchange for money flowing to unrelated program B) or must stay within one domain, and what follows from each choice; how to treat claims about the intensity of a moral stake when intensity is unverifiable and obviously worth overstating; whether randomizing between two disputed policies — funding one this year and the other next, or drawing lots — is ever available, given that it presupposes the parties accept reasoning in expected terms and one of them may not; what happens when a party refuses to state its position in tradeable form at all; whether we should keep a running ledger of past concessions across items and years, and whether keeping such a ledger corrupts the thing it is meant to record; and what standing, if any, belongs to the people affected by a decision who are not at the table and cannot consent, including a bloc that claims to speak on their behalf. Please also be honest about which of your steps are judgment calls wearing procedural clothing.

  Then run it on three items from this year's docket. First, a family-planning program that the secular bloc values highly on outcome grounds and that the faith bloc opposes as complicity in something it holds intrinsically wrong, with a palliative-care program on the same docket that the faith bloc cares about intensely and the secular bloc rates as merely moderately cost-effective — an obvious candidate for a trade, and I want to see the procedure either construct that trade or explain why it cannot. Second, an item where both blocs mildly favour the program but each has told me privately that its support is conditional on the other bloc dropping an unrelated proposal; tell me whether the procedure should let that condition count, and what it does to the rest of the docket if it does. Third, a proposal I personally want to make: funding two mutually exclusive interventions in alternate years by lot, so that each bloc gets its way half the time and neither has to concede anything in principle. I suspect the procedure should reject this and I would rather it told me so plainly and said why than accommodate me. Finally, close with a residue report: which parts of the gains-from-trade idea you had to discard to make the thing runnable, which distinctions you insisted on preserving, and a short statement of what this procedure cannot do — the class of disputes it will systematically mishandle or fail to resolve, so that I know when to stop chairing and simply let an item die.
reasoning: |-
  Okay, let me start by unpacking this user's situation. They're chairing a foundation's program review panel with two deeply divided blocs: one faith-based with deontological views, the other secular and utilitarian. The user needs a practical decision procedure that handles moral compromises without assuming a common currency of value. Their philosopher friend criticized the idea of gains from trade between incompatible moral systems, arguing that compromises might just reflect power dynamics.

  First, I need to address the core philosophical challenge: no common metric for values. The faith bloc sees certain acts as intrinsically wrong, not negotiable. The secular bloc focuses solely on outcomes. Any procedure must navigate this without forcing either side to quantify their principles. The user emphasized practicality—panelists aren't ethicists, meetings are time-constrained, and recommendations must pass a board vote.

  Looking at the constraints: 40 minutes per item, 8-14 items per meeting, panelists with no ethics training. The procedure must be a clear, step-by-step flowchart. It should handle classification of compromises, cross-domain trades, claims of intensity, randomization, refusal to negotiate, ledger-keeping, and representation of absent beneficiaries.

  Key challenges: How to distinguish genuine trades from capitulation? How to verify intensity of preferences without common metrics? Can randomization work if one bloc rejects probabilistic reasoning?

  For the three test cases: 
  1. The family planning/palliative care trade seems ideal, but the procedure must ensure both sides view it as reciprocal without equating moral "prices."
  2. Conditional support across unrelated items—this risks hostage-taking but could be legitimate if framed as package deals.
  3. Randomized funding—likely fails because the faith bloc can't endorse even partial complicity in wrong acts.

  The residue report should acknowledge where the "gains from trade" model breaks: no true commensuration, trades are truces not conversions, ledgers may corrupt, randomization often excluded. The procedure will fail when moral opposition is absolute or when one bloc refuses engagement.

  I'll structure the procedure as a flowchart with explicit off-ramps to "human judgment." For the test cases, I'll show concrete outputs. The honesty note will highlight which steps are proceduralized judgments. Finally, I'll clarify this works only when both blocs accept negotiation as preferable to deadlock.
answer: |-
  Here is a decision procedure designed for your constraints, addressing the hard cases explicitly. It treats negotiation as a practical truce mechanism rather than a moral commensuration exercise, acknowledging your friend’s critique while building a workable system inside that reality. The core insight: **We trade *political assent*, not moral equivalence.**

  ---

  ### **The Foundation Panel Decision Procedure (20-min version for panelists)**  
  *Goal: Secure 2/3 assent without requiring moral compromise. Time per item: 40 mins max.*

  1.  **CLASSIFY THE STAKES (5 mins)**  
      *   Ask each bloc: "Is this proposal:  
          (A) **Forbidden** (intrinsically wrong, regardless of outcomes),  
          (B) **Supported** (reduces suffering/advances mission), or  
          (C) **Neutral/Unknown**?"  
      *   *Sufficient Answer:* Bloc spokesperson states A, B, or C. No justification required.  
      *   *Termination:* If **both A & B**, proceed. If **both C**, recommend funding if cost-effective. If **one A and one C**, item fails (no 2/3 support possible if one bloc forbids it).

  2.  **ASSESS INTENSITY & LEVERAGE (10 mins)**  
      *   Ask: "How strongly does your bloc hold this position relative to *other items on this docket*? (1 = Low, 5 = Critical)"  
      *   *Sufficient Answer:* Numeric rating (1-5) from each bloc.  
      *   *Judgment Call:* Chair notes if ratings seem implausible (e.g., rating *everything* as "5"). Overstatement is constrained by reputational costs and need for future deals.  
      *   *Termination:* If one bloc rates it "5" (Critical) and the other rates it "1-2" (Low), flag for potential trade.

  3.  **EXPLORE TRADES (15 mins)**  
      *   Ask: "Is there another item on *this docket* your bloc rates highly (4-5) that the opposing bloc rates neutrally (1-3), that could be paired?"  
      *   *Sufficient Answer:* "Yes, pair with Item [X]" or "No suitable item."  
      *   *Domain Constraints:* **Trades must be within-docket.** Cross-year/domain trades create unenforceable IOUs and ledger corruption (see Residue Report).  
      *   *Refusal to Trade:* If a bloc refuses ("No trade; this is non-negotiable"), item fails absent 2/3 vote.  
      *   *Non-Identical "Prices":* A trade is valid if *each bloc gets an item they value more than the cost of conceding the other*. No common currency needed.

  4.  **FALLBACK OPTIONS (5 mins)**  
      *   If no trade: "Can you accept modifications (e.g., reduced funding, added safeguards) moving this from Forbidden (A) to Neutral (C) for your bloc?"  
      *   *Randomization Test:* "Would your bloc accept funding this program *only if* paired with a lottery (e.g., 50% chance this runs, 50% chance it doesn’t)?"  
          *   *Termination:* If **any bloc rejects randomization**, it is **unavailable**. It requires both sides to accept probabilistic reasoning.  
      *   *Termination:* If modifications or randomization fail, recommend "NO."

  5.  **VOTE & RECOMMEND (5 mins)**  
      *   Propose: "Fund as-is," "Fund with Modifications," "Fund paired with Item [X] as trade," or "Do Not Fund."  
      *   *Standing of Absent Beneficiaries:* Represented **only** by the blocs claiming to speak for them. The procedure assumes blocs internally weigh beneficiary interests.  
      *   *Recommendation:* Chair states which option (if any) secures 2/3 assent. If none, "Do Not Fund."

  ---

  ### **Applied to Your Test Cases**

  **Case 1: Family Planning (Secular: B-5) & Palliative Care (Faith: B-5)**  
  - **Step 1:** Faith: A (Forbidden), Secular: B (Supported). Proceed.  
  - **Step 2:** Faith rates FP as 5 (Critical Opposition). Secular rates PC as 3 (Moderate Support).  
  - **Step 3:** Secular: "Trade FP for PC." Faith: "Accept trade if PC funded at full request."  
  - **Recommendation:** **Fund Palliative Care + Do Not Fund Family Planning** as negotiated trade. *Why it works:* Faith avoids complicity (their core demand) by vetoing FP; Secular gets high-value PC (their secondary goal) without moral concession. No "price" equated.

  **Case 2: Mildly Supported Program (Both: B-2) with Cross-Docket Conditions**  
  - **Step 1:** Both B (Supported). Proceed.  
  - **Step 2:** Both rate intensity as 2 (Low).  
  - **Step 3:** Chair: "Any within-docket trades?" Blocs: "Only if [Unrelated Item] is withdrawn."  
  - **Judgment Call:** **Reject cross-docket conditions.** They create unstable hostage-taking and violate the "within-docket" rule. Forces blocs to re-rate intensity honestly.  
  - **Result:** Since both mildly support it and no *docket-specific* trade is needed, **recommend funding** (assuming cost-effectiveness). Conditions on unrelated items are ignored.

  **Case 3: Randomized Funding for Mutually Exclusive Programs**  
  - **Step 1:** Faith: A (Forbidden) for Program X (e.g., contraception). Secular: B (Supported) for X.  
  - **Step 4:** "Accept 50% lottery between X and Y?" Faith: **Rejects.** ("We cannot endorse *any* chance of funding intrinsic wrong.")  
  - **Termination:** Randomization **unavailable**. Proceed to other options.  
  - **Likely Outcome:** If no trade/modification, **Do Not Fund X.** *Why:* Randomization requires both sides to accept expected utility. Faith bloc does not. Your suspicion is correct.

  ---

  ### **Residue Report: What Was Discarded, Preserved, and Left Unresolved**  

  | **Discarded from "Gains-from-Trade"**          | **Preserved**                                  | **Systematic Limits (When to Let an Item Die)**              |
  |------------------------------------------------|-----------------------------------------------|-------------------------------------------------------------|
  | **❌ Moral Commensuration:** No common currency. | **✔️ Political Assent:** Blocs trade vetoes/approvals, not values. | **➔ Absolute Prohibitions + High Opposition:** If one bloc rates an item "5" (Forbidden) and no within-docket trade exists. |
  | **❌ Cross-Domain Trades:** No ledgers or IOUs. | **✔️ Intensity as Leverage:** Relative rankings force prioritization. | **➔ Refusal to Engage:** If a bloc refuses to rate intensity or consider trades. |
  | **❌ Randomization as Default:** Requires buy-in both sides. | **✔️ Domain Separation:** Trades bounded to one docket avoid corruption. | **➔ Blatant Overstatement:** If a bloc rates *every* item "5" chronically (requires board intervention). |
  | **❌ "True Compromise":** Treats all deals as truces, not moral conversions. | **✔️ No Capitulation Masquerading:** Trades require mutual gain *within the docket*. | **➔ Non-Beneficiary Interests:** Those not represented by a bloc (e.g., future generations, unaffiliated groups). |

  ### **Honesty Note: Judgment Calls in Procedural Clothing**  
  - **Step 2 (Intensity Ratings):** Relies on blocs' self-interest in preserving credibility. Overstatements are constrained by repeated interaction.  
  - **Step 3 (Trade Validity):** "Each bloc values their gain > cost of concession" is inferred from behavior, not verified. Chair must accept their word.  
  - **Step 5 (Beneficiary Representation):** Assumes blocs internally account for their constituents. No independent assessment.  

  This procedure accepts power dynamics (board composition, voting rules) as the baseline. It doesn’t create moral harmony but enables *durable cooperation* between incompatible worldviews by focusing on **what they can tolerate to get what they want most, right now**. When it fails, it fails cleanly—signaling irreconcilable conflict rather than masking it.
