prompt: |-
  Analyze the Suez Crisis of 1956 as a case study in reference-class selection and the outside view. I know the narrative well — Nasser's nationalization of the Canal Company in July, the Franco-British-Israeli collusion, the landings in early November, the run on sterling, Washington's refusal to let Britain draw on the IMF, the Soviet threats, and Eden's resignation in January — so please do not spend any of your space retelling it. What interests me is the epistemics of the forecasts, chiefly British but also French, that were made in the months before the invasion.

  Five tasks, to be answered as five numbered items:

  1. Identify the predictions that actually carried the decision — how quickly Nasser's government would fall, whether the operation could be finished before the world could react, how the United States would respond, whether Britain's reserves could survive a prolonged crisis — and characterize what the inside-view case for each looked like given the evidence available in autumn 1956.

  2. Reconstruct the reference classes that were on offer at that moment and the base rates they would have yielded. I have in mind, at minimum, the post-1945 attempts by European powers to reverse a nationalist government's assertion of sovereignty by force or economic pressure: the Dutch in Indonesia, the French in Indochina, and Britain's own failure in Iran in 1951 alongside its partial success there in 1953. Say what each class implies, and where the classes point in different directions.

  3. Apply a distinction I am stipulating for this exercise rather than borrowing from the literature. Call a forecast *class-robust* when several defensible reference classes point the same way, and *class-fragile* when its accuracy depends on which of several equally defensible classes the analyst happened to select. Sort the principal British predictions on that scale, and say whether 1956 was a failure of class-fragility, of never consulting a class at all, or of consulting one and then overriding it with inside detail.

  4. State where the outside view goes silent. A base-rate method might license the claim that the intervention would fail without licensing any claim about how it would fail, when, or at what price; and the Iranian outcome of 1953 shows that at least one member of the natural class came out the other way. Name what the theory cannot deliver here instead of pressing it into service.

  5. Give your verdict on what the episode does to the broader project of forecasting imperial decline from base rates — whether 1956 is a data point in a long-run pattern of the kind posited by Spenglerian cycles or the cliodynamic program, or whether decision-scale base rates and civilizational-scale ones are separate enterprises that no single episode can join.

  Please give exactly five numbered items, corresponding to the five tasks, one or two sentences each, with no introduction and no conclusion. If you find yourself wanting more room, be more selective rather than longer.
reasoning: |-
  Hmm, the user is asking me to analyze the Suez Crisis of 1956 through the lens of reference-class forecasting and the outside view. They specifically want me to avoid retelling the historical narrative since they're already familiar with it, and instead focus on the epistemology of the forecasts made by British and French leaders before the invasion.

  The user has given me five very specific tasks to complete as five numbered items. Let me break down each one:

  For task 1, I need to identify the key predictions that drove the decision to invade: how quickly Nasser would fall, whether they could finish before global reaction, US response, and British reserves surviving. I should describe the inside-view case for each based on evidence available in autumn 1956. The British leaders likely thought Nasser was unstable, the operation could be swift, the US would support them as allies, and their reserves could handle pressure.

  For task 2, I need to reconstruct the relevant reference classes from post-1945 attempts by European powers to reverse nationalist governments: Dutch in Indonesia (failure), French in Indochina (failure), British in Iran 1951 (failure), and British in Iran 1953 (success). I should show how these point in different directions - the earlier failures suggest high risk, while the 1953 success offers hope.

  For task 3, I need to apply the user's distinction between class-robust and class-fragile forecasts. I'll sort the key predictions on this scale: the US response forecast was class-fragile (depending on whether you focus on alliances or anti-colonial trends), while the British reserves prediction was class-robust (multiple classes show vulnerability to pressure). I think the failure was due to ignoring reference classes rather than selecting the wrong one.

  For task 4, I need to identify where the outside view goes silent. Base rates can indicate likely failure but can't predict the specific failure mode, timing, or cost. They also can't resolve ambiguous cases like Iran 1953 where the outcome differed.

  For task 5, I need to give a verdict on what this episode says about forecasting imperial decline. I believe 1956 doesn't directly inform civilizational-scale theories since decision-scale base rates deal with specific interventions, not long-term patterns of decline.

  I'll structure my response exactly as requested: five numbered items corresponding to the five tasks, with one or two sentences each, no introduction or conclusion. I'll be selective and concise to stay within the space constraints.
answer: |-
  1.  Key predictions driving the decision were: Nasser's rapid collapse under military pressure (inside view: Egyptian military weakness and Nasser's perceived unpopularity); swift operation completion before international reaction (inside view: Anglo-French military superiority and surprise from collusion); US diplomatic support or acquiescence (inside view: Cold War alliance priorities and shared anti-Nasser sentiment); and British reserves withstanding financial pressure (inside view: perceived economic resilience and US/IMF safety nets).

  2.  Relevant reference classes: Dutch Indonesia (1945-49) and French Indochina (1946-54) showed failure against nationalist movements despite force, implying high success barriers. Britain's Iran 1951 (failure to reverse Mossadegh's oil nationalization via sanctions/pressure) reinforced this. Britain's Iran 1953 (successful CIA/MI6 coup restoring the Shah) implied nationalist governments *could* be overturned covertly with US backing, pointing towards potential success under specific conditions.

  3.  Predictions were largely *class-fragile*: US response depended on prioritizing the "anti-colonial failure" class (implying opposition) or the "Iran 1953" class (implying support/concurrence); Nasser's fall depended on "postwar interventions" (implied failure) or historical colonial policing (implied success). The primary failure was *never consistently consulting a relevant class*; existing classes like Indonesia/Indochina/Iran 1951 were discounted by inside conviction (military superiority, special relationship).

  4.  The outside view falls silent on the *specific mechanism and timing of failure*: base rates from relevant classes strongly suggested high failure probability but couldn't specify the decisive run on sterling, precise US financial blockade, or Soviet nuclear threats as the proximate causes, nor the exact six-week timeline. It also cannot resolve the ambiguity presented by the Iran 1953 outlier within the class.

  5.  1956 is a decision-scale failure relevant to forecasting the outcomes of specific imperial *actions*, not a direct data point for Spenglerian/cliodynamic civilizational decline; base rates for intervention outcomes and long-term imperial trajectories operate on fundamentally different scales and timeframes, making the episode largely irrelevant to the latter enterprise.
