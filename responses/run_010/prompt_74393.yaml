  ### Scenario
  In a condensed matter laboratory, a new quasi-one-dimensional material, QM-1, is synthesized in a single crystal form and subjected to electrical transport measurements. At a precise temperature of 1.5 K, the longitudinal resistivity is measured as \(1.0 \times 10^{-4}\) Ω·cm. This is the only instance of QM-1 in history. Both parties agree on the complete distribution of local matters of particular fact, including all physical events and properties in the lab and the universe. They agree that the deterministic, exceptionless law \(L\) holds: "All instances of QM-1 exhibit longitudinal resistivity \(1.0 \times 10^{-4}\) Ω·cm at 1.5 K." \(L\) is part of the unique best system for the Humean, with no ties or underdetermination, and reflects a necessitation relation for the anti-Humean. The apparatus is a standard cryostat setup with four-probe resistivity measurement, involving no exotic elements.

  **Disputed counterfactual sentence**: "If this crystal of QM-1 had never been synthesized, then any synthesis of QM-1 would have exhibited longitudinal resistivity \(1.0 \times 10^{-4}\) Ω·cm at 1.5 K."

  ---

  ### Demonstration

  **Sentence**:  
  "If this crystal of QM-1 had never been synthesized, then any synthesis of QM-1 would have exhibited longitudinal resistivity \(1.0 \times 10^{-4}\) Ω·cm at 1.5 K."

  **Verdicts and Reasoning**:

  - **Anti-Humean (Necessitation Theorist) Verdict**: **True**  
    - Step 1: Law \(L\) is a primitive necessitation relation between universals (e.g., the property of being QM-1 and the property of having resistivity \(1.0 \times 10^{-4}\) Ω·cm at 1.5 K). This relation is ontologically independent of the mosaic.  
    - Step 2: The antecedent describes a world where this particular crystal does not exist, but the universals (e.g., QM-1) and the necessitation relation \(L\) still exist.  
    - Step 3: The consequent claims that any instance of QM-1 must obey \(L\) due to its necessitation nature. Since the law holds in all possible worlds, any synthesis of QM-1 would exhibit the specified resistivity.  
    - **Divergence Point**: Step 2 relies on the denial of supervenience—laws are not grounded in the mosaic, so removing an instance does not affect \(L\)'s existence or scope.  

  - **Humean (Best-System) Verdict**: **False**  
    - Step 1: Laws supervene on the actual mosaic. \(L\) is part of the best system only because it efficiently systematizes the regularity observed in the single actual instance of QM-1.  
    - Step 2: In the closest possible world \(w\) where this crystal was never synthesized (and no other instances exist), the mosaic lacks any QM-1-related facts. The best system in \(w\) cannot include \(L\) because there are no regularities for \(L\) to summarize; including it would add gratuitous complexity without strength.  
    - Step 3: The consequent claims that in \(w\), any synthesis of QM-1 would exhibit the resistivity. But since \(L\) is not a law in \(w\) (per Step 2), and there are no mosaic facts to ground the regularity, there is no basis to assert that a hypothetical synthesis would obey \(L\). In \(w\), the conductivity of a synthesized QM-1 crystal could differ (e.g., due to unknown factors), as the actual mosaic does not constrain uninstantiated properties.  
    - **Divergence Point**: Step 2 relies on supervenience—laws depend on the mosaic, so removing all instances of QM-1 removes \(L\) from the best system.  

  **Load-Bearing Feature**: The singularity of the instance (exactly one actual instance of the type governed by \(L\)).  
  - **Removal Test**: If we delete this feature (e.g., by having multiple actual instances of QM-1), the divergence collapses. For the Humean, removing one instance leaves others to ground \(L\) in the best system, so the consequent holds. For the anti-Humean, \(L\) was always necessary, so the consequent still holds. Agreement on "true" is restored. If singularity is removed, divergence does not migrate to another sentence; it vanishes entirely under the given constraints.

  ---

  ### Strongest Attack and Survival
  **Attack**: The physicist will argue that the disputed counterfactual is metaphysically idle because no working scientist would ever assert it. Scientists focus on predictions and experiments for actual or possible instances, not counterfactuals about the non-existence of the experimental subject itself. The sentence involves a universal quantification over purely hypothetical syntheses ("any synthesis"), which is untestable and irrelevant to laboratory practice. Additionally, the case secretly imports a disagreement about explanation: The anti-Humean's verdict relies on the law explaining why the conductivity *must* hold, while the Humean rejects this, treating the difference as merely explanatory (hence a matter of "taste").  

  **Survival**: The case survives this attack but only on a technicality.  
  - **Scientific Relevance**: While the counterfactual is not one a scientist would "bother to state" in practice, it is explicitly about a laboratory synthesis apparatus and a measurable physical property (resistivity), satisfying the constraint of ordinary experimental physics. Scientists *do* reason about material properties in hypothetical scenarios (e.g., "Would this material behave the same if we could make it again?"), though not typically via universal quantifiers over non-actual instances.  
  - **Explanatory Disagreement**: The divergence is not *manufactured* by prior explanatory differences but *generated* by the core metaphysical disagreement (supervenience vs. non-supervenience). The verdicts arise directly from applying each account of lawhood to the mosaic: The anti-Humean's necessitation relation directly implies truth, while the Humean's supervenience-based best-system analysis implies falsity. Explanatory talk emerges as a consequence, not a cause.  
  - **Confidence**: This meets the specifications, but I am moderately confident it is the best possible under the constraints. The counterfactual is "scientific" only in a broad sense (it references lab equipment and measurements), and the attack exposes that any divergence may inevitably edge into metaphysics a physicist would dismiss. A stricter reading of "scientist would bother to state" might invalidate the case, but I judge it passes on your terms.  

  **Confession of Doubt**:  
  - **Joint Satisfiability**: I am 90% confident the constraints are satisfiable only by exploiting singularity (as above) or similar edge cases. Without singularity or probabilistic elements, I doubt a divergence can be produced. For instance, if we try a counterfactual about a non-actual experiment with the *same* apparatus (e.g., "If the temperature had been 1.6 K, resistivity would be X"), both sides agree due to deterministic laws.  
  - **Frailty**: The case is fragile. If we require a counterfactual a scientist *routinely* uses (e.g., "If the voltage were higher, the current would double"), agreement is unavoidable. This suggests your colleague may be right that the Humeanism/anti-Humeanism debate is idle for *core* scientific discourse. However, it is not idle for metaphysical counterfactuals grounded in science, which this case provides.
