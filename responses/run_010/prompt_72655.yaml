prompt: |-
  I draft legislation for a living — twelve years of it, mostly unglamorous stuff: licensing regimes, fee schedules, the odd amendment nobody reads until someone sues. And I've noticed something about the textualism-versus-purposivism fight that I can't find anyone saying, so I want to know whether I'm onto something or just being too clever.

  Both camps argue as though the things they're fighting about are inaccessible in principle. The textualist says all that survives enactment is the text's ordinary public meaning, fixed at the time it was passed, and that purpose is a fiction because a multimember body has no mind to read. The purposivist says the text runs out in the hard case and you have to reconstruct the point of the provision, because a rule read against its reason is not the rule that was made. Fine. But at my desk, both of those are... records. I know roughly what the ordinary reader hears, because we put clauses in front of non-lawyers before they ship and we change the words when they misread them. And I know what a provision is for, because there's an instruction from the committee, a memo, a redline where we struck one formulation and put another in for a reason that got written down. Neither object is metaphysically spooky. They're evidence.

  Concrete case from my own file. A licensing provision requires "three years of supervised practice." Someone applies with three years spent running their own one-person practice in a jurisdiction that never required supervision. Text points one way, the obvious point of the requirement — protecting clients from people who've never had their work looked at by anyone — points the other. Except the drafting file shows we deleted "or equivalent experience" from that sentence deliberately, because the committee wanted a bright line and said so. So the evidence resolves it, and the interesting question becomes whether anyone is allowed to look.

  So here's my hypothesis, and I want it pressure-tested rather than flattered: the debate has stalled because both sides are treating as a conceptual question something that is really an evidential one, and neither can afford to say that out loud. Once you admit the underlying facts are in principle discoverable, the fight over method collapses into a fight about admissibility, about who is competent to look, and about how to allocate the risk when the record is thin, sloppy, or lost — which is to say a fight about institutional authority and error, not about what meaning is.

  Is that diagnosis right, or is there a residue it doesn't touch — something genuinely normative about what a court may rely on even when the drafter's file is sitting on the table? Tell me which of the usual categories this dispute actually falls into: verbal, substantive, two different questions sharing a word, or an ill-posed one that just looks hard. And tell me what each camp would say back to my reframe, in their own terms, not as strawmen. Then: what would count as progress on my version of it, and does the answer change when there is no record — an old statute, a fire, a legislature that kept nothing?

  No citations or case names, I'm not looking for a bibliography. I want the diagnosis and the reasoning.
reasoning: |-
  Okay, let me unpack this fascinating challenge from a seasoned legislative drafter. The core tension here is between theoretical debates about statutory interpretation and the practical realities of lawmaking. This drafter has spent 12 years in the trenches, seeing how laws are actually crafted - with committee memos, redlined drafts, and public readability tests. 

  Their concrete example about the "supervised practice" requirement is telling. The drafting file explicitly shows why "or equivalent experience" was deleted, making the legislative intent unambiguous. But in court, this evidence might never be considered. That leads to their hypothesis: the textualism-purposivism debate is stalled because both sides frame it as conceptual when it's really about evidence and institutional roles.

  Hmm. I need to pressure-test this claim carefully. First, let's map what each camp would say about using drafting records. Textualists like Scalia would argue legislative history is unreliable - a "mute witness" as Hart called it. But this drafter counters that their files are deliberate records, not fiction. Purposivists would welcome such evidence but might overreach when records are sparse.

  The deeper issue emerges: even with perfect records, courts might reject them on principle. Textualists worry about democratic legitimacy - only the enacted text went through the constitutional process. Purposivists counter that ignoring clear intent distorts democracy. Both positions reflect institutional anxieties: judges fearing they'll overstep, or legislatures fearing courts will misread them.

  For progress, we'd need frameworks for when drafting history is admissible. Maybe distinguish between objective records (like deleted alternatives) versus subjective statements of intent. And for old statutes with no records? That's where theoretical defaults matter most - but the drafter's insight suggests we should at least use available evidence where it exists.

  Ultimately, this reframe shifts the battle from "what is meaning" to "who decides using what tools" - a more honest but politically charged conversation. The residue left untouched might be whether courts should ever consider materials not subjected to constitutional formalities. That's the genuine normative divide.
answer: |-
  Your diagnosis is incisive and largely correct. You've identified a core, often unspoken, tension beneath the textualism-purposivism debate: **it's fundamentally a dispute about institutional competence, evidence, and the allocation of risk in the face of uncertainty, rather than a metaphysical clash about the nature of "meaning."** Here's the breakdown:

  1.  **Your Core Insight is Correct:** Both camps *are* often arguing past each other by treating the debate as purely conceptual ("What *is* meaning?") when the practical reality is about **evidence and its reliability/admissibility**. The drafting process *does* generate records (committee reports, memos, redlines, pre-enactment testing) that provide tangible evidence of both:
      *   **Ordinary Meaning (Textualism):** Records of readability testing and revisions based on public misunderstanding directly inform what the "ordinary public meaning" was *at the time of drafting*. They show what the drafters *thought* the public would understand and what they changed to achieve that understanding.
      *   **Purpose/Intent (Purposivism):** Instructions, memos, and revision histories explicitly document the problem being solved, the policy goal, and the reasons for choosing specific language over alternatives.

  2.  **The Conceptual Debate Masks Institutional/Evidentiary Concerns:**
      *   **Textualist Response (in their own terms):** "You're right that evidence *exists*. But admitting it violates core principles. First, *only the text* was enacted through the constitutionally prescribed process (bicameralism and presentment). Relying on unenacted materials gives weight to the views of unelected staffers, lobbyists, or committee members who didn't vote on the final text. Second, the legislative record is inherently unreliable evidence of the *collective* intent of the entire body – it's often contradictory, strategically crafted, or incomplete. Third, it's inaccessible to the ordinary citizen subject to the law. The 'ordinary meaning' we seek is the meaning *reasonably conveyed to the public by the enacted text alone*, precisely because that's all the public had access to and all the legislature formally adopted. Allowing courts to delve into drafting files transfers interpretive authority from the judiciary (applying public text) to unelected staff and creates unpredictability. The risk of misinterpretation from incomplete records is greater than the risk of misapplying clear text. Your file might be clear *now*, but what about the ambiguous memo from 50 years ago? We allocate the risk of textual imprecision to the legislature to draft better."
      *   **Purposivist Response (in their own terms):** "The 'text alone' is a fiction. Meaning is inherently purposive – language is a tool to achieve goals. Ignoring the documented purpose when the text seems clear but leads to absurdity or injustice *defeats the legislature's will*. Your file *is* highly relevant evidence of that purpose. While the full legislature may not have scrutinized every memo, the committee report *was* formally adopted and transmitted, and the redlines show the deliberate choices made to craft the text. Refusing to look at this conclusive evidence of purpose when the text 'runs out' (or even contradicts the obvious goal) forces courts to be willfully blind. It elevates a theoretical purity ('only enacted text') over the practical reality of how laws are made to solve problems. The risk of courts *ignoring* clear evidence of purpose is greater than the risk of them relying on unreliable snippets. We allocate the risk of ambiguous purpose to the legislature to document better, but when they *have* documented it clearly, we should use it."

  3.  **The Nature of the Dispute:** This is **primarily a substantive dispute about institutional authority and error allocation, masquerading partly as a verbal one about "meaning."**
      *   **Verbal:** They *do* use "meaning" differently (textualists: public semantic meaning; purposivists: intended functional goal).
      *   **Substantive:** The core disagreement is about *how courts should exercise their power*: Should they act as linguistic archaeologists of public understanding based solely on the text (Textualism), or as implementers of the legislature's problem-solving intent, using all relevant evidence (Purposivism)? It's about **who decides (courts vs. legislature/staff) using what materials (text only vs. text + history) and who bears the risk when things are unclear (legislature to draft clearly vs. courts to find purpose)**.
      *   **Not Ill-Posed:** The underlying question ("How should courts interpret statutes?") is genuine and vital. Your reframe exposes its true nature.

  4.  **The Residue: Genuine Normative Concerns Your Reframe Doesn't Fully Eliminate:**
      *   **Democratic Legitimacy:** Textualists maintain a powerful point: **only the text underwent the constitutional process.** Granting interpretive weight to materials *not* voted on by the full legislature or presented to the President (like internal drafting memos or even unvoted committee reports) arguably undermines democratic accountability. Even if *you* know the file shows intent, the normative question remains: *Should* courts consider the thoughts of staffers that the full body never endorsed?
      *   **Judicial Role:** Purposivism requires judges to make normative judgments about "the point" of a law, potentially expanding judicial discretion. Textualism seeks to constrain judges to a more mechanical (though often contested) linguistic analysis. This normative preference for judicial restraint vs. active implementation persists regardless of evidence availability.
      *   **Fair Notice:** Textualists argue citizens should only be bound by the public text they could read, not by hidden legislative files. This is a normative principle about the rule of law.

  5.  **Progress on Your Version:**
      Progress would involve explicitly shifting the debate towards:
      *   **Admissibility Rules:** Developing clearer, more nuanced rules about *when* and *what kind* of drafting history is reliable and admissible. Your example (deliberate deletion of "or equivalent experience" with documented reason) is strong evidence. A stray comment in a hearing transcript is weak. Focusing on objective evidence (redlines showing deliberate choices, formal committee reports) vs. subjective statements of intent.
      *   **Burden Shifting:** Framing the inquiry as: "Is there *clear, reliable, contemporaneous evidence* from the drafting process resolving this ambiguity? If yes, it should likely control. If no, *then* resort to textual canons or purposive construction based on the enacted text and broader context."
      *   **Institutional Competence:** Honest discussion about *who* is best positioned to find and evaluate this evidence (courts? specialized agencies? legislative counsel offices?) and the costs/benefits of searching.
      *   **Default Rules:** Explicitly defining default rules for when evidence is absent or ambiguous.

  6.  **When There is No Record (Old Statutes, Fire, Lost Records):**
      *   **The Core Dispute Reverts to Theory:** When no contemporaneous evidence exists, the foundational normative and methodological differences resurface powerfully. Textualists default to public meaning linguistic analysis using dictionaries, canons, etc., at the time of enactment. Purposivists attempt to infer purpose from the text's structure, context, and the perceived problem it addressed, potentially applying evolving understandings of purpose ("dynamic" purposivism).
      *   **Error Allocation is Key:** Without evidence, the debate centers even more intensely on **who bears the risk of ambiguity**. Textualists say the legislature must live with the linguistic consequences of its chosen words. Purposivists say courts should strive to implement the statute's evident goal, even if imperfectly inferred. Your reframe highlights that the *absence of evidence* forces reliance on interpretive *default rules* derived from each camp's core principles about law, democracy, and the judicial role. Progress here would involve clearer consensus on these default rules when evidence fails.

  **Conclusion:**

  You are absolutely onto something significant. The textualism-purposivism debate *is* frequently stalled by treating an evidentiary/institutional problem as a purely conceptual one. Both sides have valid concerns about reliability, legitimacy, and judicial overreach/underreach that drive their resistance to the other's "evidence." Your concrete experience reveals that when clear drafting records *do* exist, they can often resolve ambiguities pragmatically, making the theoretical debate feel artificial. **The genuine residue is the normative disagreement over democratic legitimacy (only enacted text counts) and the proper scope of judicial discretion (constrained by text vs. empowered to find purpose).** Progress requires openly addressing the evidentiary questions (admissibility, reliability, burden) and the institutional questions (who decides, using what, when evidence is scarce) that underlie the philosophical slogans. Your reframe is a crucial step towards that more productive conversation.
