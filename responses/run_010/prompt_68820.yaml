prompt: |-
  I'm a military lawyer: I do targeting review for a living, and I think natively in distinction, military necessity, proportionality, feasible precautions, and the collateral-damage estimation methodology that operationalizes them. Restate Anscombe's case against Truman's decision to bomb Hiroshima and Nagasaki in that vocabulary, as faithfully as you can — her claim that the killing was murder rather than tragic necessity, and that no reckoning of consequences can license choosing to kill the innocent as a means. Then give me the residue report: which of her claims my doctrine can express as a rule of conduct, which it can express only as a rule of decision procedure or of individual culpability, and which it has no way of stating at all. Two things I want pressed on. First, my framework already contains something that looks like her absolutism — the prohibition on making civilians or the civilian population the object of attack — while licensing their foreseeable death as an incidental effect; Anscombe appears to think that gap is far narrower than the doctrine assumes, and that admitting foreseen civilian deaths for a good end has already surrendered what the prohibition was meant to secure. Second, if her own distinction between intended and merely foreseen harm is doing the work, say where exactly she locates the intention in a campaign of area bombing. Finish with a verdict: does what fails to translate show that international humanitarian law is missing a concept, or that her notion of intention cannot bear the weight she puts on it? No citations or reading list — I'll do that part myself.
reasoning: |-
  Okay, the user is a military lawyer specializing in targeting reviews. They want Anscombe's argument against the Hiroshima and Nagasaki bombings translated into military operational terms like distinction, military necessity, etc. Then they want a residue report showing which parts of her argument fit into current doctrine, which only fit as decision procedures or culpability, and which don't fit at all.

  First, I need to recall Anscombe's main points. She argued that intentionally killing innocents is murder, even if it leads to good consequences. For her, using atomic bombs on civilians wasn't just tragic necessity but murder because the civilian deaths were intended as a means to force surrender. She emphasizes the distinction between intended harm and foreseen but unintended harm.

  The user also wants two specific points pressed. First, how the existing framework's prohibition on targeting civilians still allows foreseeable incidental deaths, but Anscombe sees that gap as too narrow. She probably thinks that if you foresee mass civilian deaths and proceed, it's effectively intentional. Second, where she locates the intention in area bombing—like whether choosing the method (area bombing) inherently intends civilian harm.

  Breaking down the translation into military terms: distinction prohibits targeting civilians, but allows incidental harm if proportional. Military necessity requires the attack to offer a concrete advantage. Proportionality weighs military gain against civilian harm. Feasible precautions mean taking steps to minimize harm. CDM is the process to estimate collateral damage.

  For Anscombe, even if these criteria are met, if civilians were used as a means (e.g., their deaths coerced surrender), it's still wrong. So, in CDM terms, she's saying that if civilian harm isn't just collateral but part of the plan's effectiveness, it violates the absolute prohibition, making it murder.

  Now, the residue report. Which of her claims fit as rules of conduct? The prohibition on targeting civilians aligns, but her stricter view on foreseen harm as intentional doesn't. That part might only fit as a rule for decision-making or culpability, where planners must examine intent. Some aspects, like her moral absolutism against any intentional innocent killing, aren't captured in IHL, which allows foreseen harm under proportionality.

  On the two pressed points: The existing framework's gap between targeting and incidental harm is accepted in IHL, but Anscombe argues that when foreseen harm is massive and integral to success, it's no longer incidental. For intention in area bombing, she'd say the choice of a method that inherently destroys civilians shows intent, as the civilian destruction is part of the mechanism for victory.

  Finally, the verdict. What doesn't translate might show IHL lacks a concept—like the moral weight of intention. But it could also be that her notion of intention is too rigid for the complexities of warfare. IHL focuses on outcomes and procedures, while Anscombe's view is deontological. The user might need to consider if IHL's flexibility is necessary or if it risks moral loopholes.
answer: |-
  Here's Anscombe's argument restructured in targeting review vocabulary, followed by the residue report addressing your specific queries:

  ### Anscombe's Argument in Targeting Doctrine Terms
  1.  **Distinction Violation as Core Offense:** Truman made the civilian populations of Hiroshima and Nagasaki the *object of attack*. The weapon's nature (indiscriminate blast/thermal/radiation effects on dense urban areas), the selection of cities as primary targets, and the anticipated scale of civilian casualties were integral to the attack's mechanism of success. Civilian deaths weren't a regrettable side effect; they were the chosen *means* to shock Japan into surrender ("kill civilians to break will"). This constitutes a direct attack on civilians, violating distinction at its root.
  2.  **Military Necessity Misframed:** While ending the war swiftly was a legitimate military objective, the *necessity* claim fails because:
      *   The chosen means intrinsically required massive, intentional civilian killing. Necessity cannot justify a *prohibited* means (attacking civilians).
      *   Alternatives existed (continued blockade/conventional bombing, awaiting Soviet entry, modified surrender terms/demonstration) that might have achieved surrender without this intrinsic violation, even if less efficiently or predictably.
  3.  **Proportionality as Illegitimate Calculus:** The doctrine permits foreseen civilian harm only as an *incidental* effect ("collateral damage") outweighed by concrete military advantage. Here, the civilian destruction *was* the direct mechanism for achieving the advantage (surrender via terror/shock). Proportioning the "advantage" (war's end) against the civilian deaths *as if they were collateral* is invalid. You cannot license the *intended* killing of innocents by weighing its positive outcomes. The proportionality rule assumes incidental harm; it doesn't apply when harm is the weapon.
  4.  **Feasible Precautions Rendered Irrelevant:** No meaningful precautions could be taken (like precision, warning, target isolation) because the attack's effectiveness *depended* on maximizing indiscriminate civilian devastation and terror. Seeking to minimize harm would have undermined the mission's core mechanism.
  5.  **CDM as Moral Slippery Slope:** Operationalizing these concepts via CDE methodology inherently obscures the distinction between *incidental* harm (licit under proportionality) and *intended* harm used as a weapon (murder). By quantifying foreseen civilian deaths and "balancing" them against military advantage, CDE provides a procedural veneer of legality to what is fundamentally an attack directed against civilians. It transforms an absolute prohibition into a utilitarian calculation.

  ### Residue Report

  1.  **Expressible as a Rule of Conduct:**
      *   **The Absolute Prohibition:** "Civilian persons and civilian objects shall not be the object of attack." (AP I, Art. 48, 51(2)). Anscombe's core claim that directly attacking civilians is always prohibited aligns perfectly here.

  2.  **Expressible Only as Rule of Decision Procedure / Individual Culpability:**
      *   **Intent vs. Foresight:** Doctrine requires assessing intent (e.g., for war crimes like intentionally directing attacks against civilians). Rules of engagement (ROE) and target vetting procedures *demand* analyzing whether civilians are the object or merely foreseeably affected. This translates Anscombe's *concern* about confusing intended and foreseen harm into a procedural requirement to *distinguish* them rigorously during planning and review. Failure to do so can lead to individual culpability.
      *   **"Feasible Precautions" Scrutinizing Method:** The requirement to choose means/methods of attack to avoid/minimize civilian harm (AP I, Art. 57(2)(a)(ii)) *can* be applied procedurally to challenge methods where civilian harm is inherent and unavoidable for mission success (like area bombing a city center). If harm is unavoidable *and* integral to the effect, it suggests intent, potentially leading to rejection of the target/method or culpability for the planner/commander. This operationalizes Anscombe's critique of area bombing tactics.
      *   **"Concrete and Direct" Advantage Scrutiny:** Military necessity requires the advantage to be "concrete and direct." Review procedures can rigorously interrogate whether the *mechanism* of achieving the advantage relies on violating distinction (e.g., "Is breaking civilian morale *through their deaths* the direct mechanism, or is it a side effect of destroying a war-fighting capability?"). A finding that the advantage depends on civilian harm indicates a distinction violation.

  3.  **No Way of Stating Within Doctrine:**
      *   **Moral Absolutism Re: Innocents as Means:** Doctrine explicitly *rejects* Anscombe's core moral axiom: "Launching an attack which may be expected to cause incidental loss of civilian life... which would be excessive in relation to the concrete and direct military advantage anticipated, is prohibited." (AP I, Art. 51(5)(b)). This *licenses* foreseen killing of innocents as a side effect ("incidental") if proportionate. Anscombe argues *any* intentional (or functionally equivalent) killing of innocents as a means is murder, regardless of proportionality or ultimate good. Doctrine has no vocabulary for this absolute prohibition on *using* civilian harm as a tool, only on making it the *object* or disproportionate *effect*.
      *   **Consequentialism as Intrinsically Illegitimate for Innocent Life:** Doctrine *is* fundamentally consequentialist regarding incidental harm (proportionality = cost/benefit analysis). Anscombe's claim that no reckoning of good consequences can ever justify *choosing* to kill the innocent (even if "merely" foreseen as certain and integral to the plan's success) is antithetical to the structure of IHL. Doctrine permits this choice under the proportionality rule.
      *   **The Gap is Non-Existent:** Doctrine sees a clear line: object (prohibited) vs. incidental effect (permitted if proportionate). Anscombe sees no meaningful gap when the foreseen "incidental" effect is vast, certain, and *instrumental* to the goal. Doctrine lacks the conceptual tools to recognize or prohibit this instrumental use *if* nominally labelled "incidental" and proportionate.

  ### Pressing on Your Two Points

  1.  **The Gap Between Prohibition and Proportionality:** Anscombe argues the gap isn't narrow; it's illusory in cases like Hiroshima/Nagasaki (and area bombing generally). The doctrine says "Don't target them *but* you can knowingly kill them as a side effect if it's worth it." She contends that when the scale of foreseen death is massive and *essential to the plan's mechanism* ("destroy the city to break will"), labelling it "incidental" is sophistry. The civilian deaths aren't a regrettable accident of attacking a military objective; they *are* the objective's destruction *and* the chosen means of coercion. The prohibition on attacking civilians was meant to *shield* them from being instruments of war. Allowing their foreseeable mass death as a "proportionate" side effect whenever the advantage seems great enough *is*, she argues, surrendering that shield entirely. Doctrine sees proportionality as a constraint; she sees it as the loophole that eviscerates the core protection.

  2.  **Locating Intention in Area Bombing:** Anscombe locates the intention in the deliberate *selection of the method and target set* knowing that civilian destruction is inseparable from and fundamental to the desired military effect. Choosing area bombing of a city center (with weapons unable to discriminate) to achieve a goal like "breaking morale" or "forcing surrender through shock" *intends* the civilian devastation because it is the chosen causal mechanism. The planner/commander *wills* the destruction of the civilian environment and population *as the means* to demoralize the enemy or coerce its leadership. The intention isn't necessarily "kill civilians for its own sake," but it *is* "kill civilians *in order to* achieve X military goal," making their deaths an intended means, not merely a foreseen side effect. The choice of method that intrinsically requires mass civilian harm to function reveals the intention.

  ### Verdict: The Translation Gap

  What fails to translate most significantly is Anscombe's **absolute deontological prohibition on intentionally using the death of innocents as a tool, regardless of consequences.** IHL explicitly *rejects* this absolutism in favor of a utilitarian calculus for foreseen incidental harm. This shows IHL is **missing a concept** – the concept that innocent human life has a moral inviolability that cannot be traded off against military or even humanitarian outcomes, no matter how grave. IHL's core compromise accepts that foreseen civilian death *can* be licit under strict conditions (distinction, proportionality, precautions).

  However, this gap also reveals that **Anscombe's notion of intention, while powerful for individual moral culpability, struggles to bear the full weight she assigns it in the complex, systemic context of warfare governed by IHL.** Doctrine *tries* to capture intent via the "object of attack" and ROE/procedures, but the fog of war, dual-use objects, and the reality that large-scale military actions inevitably cause massive foreseen civilian harm make her bright-line distinction between "intended means" and "foreseen incidental effect" incredibly difficult (some argue impossible) to apply consistently and fairly as the *sole* basis for judging the *legality* of an attack. IHL's proportionality rule, however flawed, represents an attempt to manage this horrific reality with *some* constraint, whereas her framework risks rendering virtually all warfare involving populated areas inherently murderous. The residue demonstrates IHL's fundamental choice: regulate the inevitable horrors of war through constrained consequentialism, not absolute prohibition based on intent.
