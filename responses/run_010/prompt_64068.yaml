answer: |-
  ### (a) Clarifying Positions and Identifying the Crux  
  **Friedman's Instrumentalism** is a claim about *scientific methodology in economics*: theories are tools for prediction, not descriptions of reality. Success is judged solely by predictive accuracy for target phenomena. Unrealistic assumptions are virtues because they enable abstraction. The "F-twist" implies that assumptions are *epistemically inert*—their truth is irrelevant to the theory's validity.  

  **Dennett's Crane/Skyhook Distinction** is a claim about *explanation in evolutionary biology and cognitive science*: legitimate explanations must be reducible (in principle) to lower-level mechanisms. Skyhooks are illicit shortcuts that invoke unexplained complexity; cranes are scaffolds built from base processes. The intentional stance is a heuristic for prediction, but its legitimacy depends on *reducibility* to mechanistic (e.g., design or physical) stances.  

  **The Crux of Apparent Symmetry**: Both positions prioritize predictive success but differ *ontologically and explanatorily*. Friedman *severs* prediction from ontological commitment: false assumptions are acceptable because theories are "black boxes." Dennett *links* prediction to reducibility: predictive stances are provisional tools that must cash out in mechanisms. The symmetry breaks on **explanatory grounding**. For Dennett, predictive success *licenses nothing* without a path to reduction; for Friedman, it licenses everything.  

  ### (b) Dennett's Consistency  
  Dennett **can consistently endorse the intentional stance while condemning skyhooks**. The intentional stance is *not* a skyhook because:  
  - It is explicitly a *heuristic*, not a final explanation.  
  - It demands *in-principle reducibility* to the design or physical stance (e.g., brains implement belief-like states via neural mechanisms).  
  - Its predictive power derives from the system’s *competence*, which cranes (e.g., evolution, learning) built.  

  Critics who call it a skyhook (e.g., Fodor) ignore Dennett’s requirement that stances must be *vindicated by reduction*. If an attribution *could not* be reduced (e.g., positing cosmic rationality without evolutionary history), it would be a skyhook. The intentional stance avoids this by being substrate-neutral and mechanistically redeemable.  

  ***Caveat***: I adopt an *instrumentalist* reading of Dennett here (as the user requested). A realist reading (e.g., that beliefs are *real patterns*) would weaken the tension but is contested (see Dennett’s debate with Searle).  

  ### (c) Diagnostic and Case Applications  
  **Diagnostic**: An unrealistic assumption/as-if attribution earns its keep iff:  
  1. **Predictive Utility**: It delivers reliable predictions for a defined domain.  
  2. **Reducibility Anchor**: It points to *specifiable mechanisms* that explain *how* the system achieves this competence (even if simplified).  
  3. **Provisionality**: It is not treated as a *fundamental* explanation.  
  *It becomes a skyhook if it blocks reducibility or posits irreducible complexity.*  

  **Case Tests**:  
  1. **Friedman’s Billiard Player**  
     - *Predictive Utility*: Yes (predicts shots well).  
     - *Reducibility Anchor*: Yes (skills from practice/neural tuning, not equations).  
     - *Provisionality*: Friedman treats it as fundamental; Dennett would demand reduction.  
     - **Verdict**: **Licensed as crane** if anchored to learning mechanisms. *Diagnostic adds value*: Friedman’s error is ignoring reducibility.  

  2. **Beliefs in a Thermostat**  
     - *Predictive Utility*: Minimal (only for on/off states).  
     - *Reducibility Anchor*: None (thermostat lacks cognitive architecture; reduction to circuits explains behavior without beliefs).  
     - *Provisionality*: Not heuristic—it *misleadingly* anthropomorphizes.  
     - **Verdict**: **Skyhook**. Predictive success is trivial, and attribution adds no explanatory depth. *Diagnostic avoids relabeling*: It shows why this fails Dennett’s criteria despite surface similarity to intentional stance.  

  3. **Profit Maximization in Firms**  
     - *Predictive Utility*: Moderate (e.g., in competitive markets).  
     - *Reducibility Anchor*: Debatable. Routines, algorithms, or evolutionary selection *might* anchor it (e.g., Nelson-Winter’s evolutionary economics), but often absent in Friedmanite models.  
     - *Provisionality*: Often treated as fundamental.  
     - **Verdict**: **Skyhook if unreduced** (e.g., assuming omniscient rationality without learning mechanisms). **Crane if anchored** (e.g., to organizational routines). *Diagnostic does work*: It forces engagement with *how* firms approximate maximization.  

  ### (d) Resolution  
  **Dennett’s position has the better of the exchange** because it integrates prediction with explanation through reducibility, while Friedman’s instrumentalism risks epistemic complacency by decoupling them—a point underscored by the diagnostic’s demand for mechanistic anchors.  

  **Deciding consideration**: Science aims not just to predict but to *explain*; Friedman’s dismissal of explanatory depth (per Wong/Hausman) conflates pragmatism with anti-realism, whereas Dennett’s crane framework preserves accountability to mechanisms without sacrificing predictive utility.  

  ---
  **Specialist Notes**:  
  - My instrumentalist reading of Dennett is common (e.g., Ross, 2000) but disputed; realists (e.g., McDowell) would reject the reducibility requirement.  
  - Friedman’s "as-if" is often defended as *tractability* (e.g., Musgrave), but I treat Hausman/Wong’s critiques as decisive.  
  - The diagnostic borrows from Craver’s (2007) "mechanistic explanation" criteria, extending it to economics.
