  On question (a): The disagreement appears to be about standards of justification rather than formal satisfiability. Both sides accept the mathematics (e.g. that strictly proper scoring rules are mathematically immodest). The clash is normative: should rationality require self-endorsement? This isn't resolvable by theorem alone.

  For (b): The framework's design makes separation difficult. Dominance arguments inherently require a perspective - you dominate relative to whose assessment? The scoring rule serves dual purposes: as dominance criterion and as truth-tracker. The literature's failure to separate these stems from accuracy-first epistemology's original ambition to unify rational assessment.

  Regarding (c): Progress would likely come from disambiguating the framework's components. We might distinguish between:
