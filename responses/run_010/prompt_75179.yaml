      A and C: 0.25
      B and not C: 0.25
      B and C: 0.25

  Jeffrey update (after experience):
    P_new(A)=0.7, P_new(B)=0.3, and C remains independent.
    New joint:
      A and not C: 0.7 * 0.5 = 0.35
      A and C: 0.35
      B and not C: 0.3 * 0.5 = 0.15
      B and C: 0.15

