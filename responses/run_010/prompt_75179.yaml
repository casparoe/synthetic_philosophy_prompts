  Scenario:

  You are a chef and must decide whether to add a spice to a sauce. The sauce uses either genuine truffle oil (A) or a substitute (B). You have a prior belief that P(A)=0.5 and P(B)=0.5. There's also a 50% chance that a food critic is dining tonight (C), and the critic's presence is independent of the oil. You grab a bottle without looking and get a faint whiff. The experience makes you 70% confident it's A and 30% confident it's B (and you cannot check again). The rigidity condition holds: the experience doesn't change your conditional beliefs about C given A or given B. Adding the spice would slightly diminish the sauce if it's genuine (utility 8 instead of 10) but would rescue a substitute sauce (utility 5). Without spice, a substitute sauce would lead to a disaster (utility -10) if the critic is present, but only mild complaints (utility 2) if absent. The genuine sauce is excellent (utility 10) regardless of the critic.

