  The attack: A proponent of phenomenal conditionalization would argue that we should not conditionalize on A but on the phenomenal evidence E (the experience of the faint whiff that makes the agent 70% confident of A). Then, using background knowledge about the reliability of smell, we would set P(A|E)=0.7 and get the same result as Jeffrey, so we would choose spice. Therefore, the naive update is not the right way to do standard conditionalization. This attack does work to show that standard conditionalization (when done properly) agrees with Jeffrey, but it changes the subject: the scenario was designed to illustrate the mistake of the naive updater. The point remains that Jeffrey conditionalization provides a direct update rule without needing to model the evidence proposition E explicitly.

