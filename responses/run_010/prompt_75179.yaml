    Choose spice.

  Naive update (conditionalize on A, so P(A)=1, P(B)=0):
    Joint:
      A and not C: 0.5
      A and C: 0.5
      B and anything: 0

    No spice: 10*(0.5+0.5) = 10
    Spice: 8*(0.5+0.5)=8
    Choose no spice.

