  We are drafting a joint statement between two camps: the amplification camp (which believes small perturbations can be amplified without bound, making long-term event-level forecasting impossible) and the damping camp (which believes perturbations are usually absorbed locally, with structural forces setting an envelope of possible outcomes).

  Part One: Numbered list of claims both camps can sign. Each claim must be substantive, and for each, we state what each camp gives up by signing.

  1. **Claim**: In any complex social system, there exist states (bifurcation points) where a small perturbation can lead to a large divergence in outcomes, and other states where even large perturbations are damped.
     - *Amplification camp gives up*: That amplification is the norm at all times and in all states; they concede that damping is common away from bifurcations.
     - *Damping camp gives up*: That amplification never happens; they concede that at critical junctures, small causes can have large effects.

  2. **Claim**: The historical record is systematically biased toward recording and emphasizing events that had large consequences, making it difficult to estimate the base rate at which small events lead to large divergences.
     - *Amplification camp gives up*: That the frequency of hinge events in the historical record is a direct measure of their actual frequency; they concede that the record over-represents cases where small causes had large effects.
     - *Damping camp gives up*: That the absence of evidence for many small causes having large effects is evidence of absence; they concede that we cannot directly observe the full distribution of small events.

  3. **Claim**: The strength of coupling within subsystems relative to between subsystems (near-decomposability) varies across systems and over time, and this variation affects the typical timescale over which perturbations propagate and the feasibility of forecasting.
     - *Amplification camp gives up*: That cross-subsystem interactions are always strong enough to cause global amplification rapidly; they concede that in highly near-decomposable systems, local damping can prevail for long periods.
     - *Damping camp gives up*: That near-decomposability is always so strong that cross-subsystem effects are negligible on any timescale; they concede that when between-subsystem coupling is high, perturbations can propagate faster and farther.

  4. **Claim**: Path dependence is a real phenomenon in social systems, and it can lead to lock-in such that the system does not return to a prior state after a detour, even if the perturbation that initiated the detour was small and damped in the short term.
     - *Amplification camp gives up*: That path dependence requires large, unbounded amplification at the time of the event; they concede that small perturbations can lead to lock-in via cumulative, bounded changes.
     - *Damping camp gives up*: That path dependence is incompatible with damping; they concede that even damped perturbations can, in the presence of increasing returns, lead to divergent long-term outcomes.

  5. **Claim**: The predictability of event-level outcomes at long horizons (e.g., 30 years) is not uniform across all types of events or all system states; it depends on the current state (e.g., proximity to a bifurcation) and the timescale relative to the system's relaxation time.
     - *Amplification camp gives up*: That long-term event-level forecasting is always impossible; they concede that in some states (e.g., far from bifurcations) and for some event types, it may be feasible.
     - *Damping camp gives up*: That long-term event-level forecasting is always feasible; they concede that near bifurcations and for events that cross subsystem boundaries, it may be impossible.

  Part Two: JSON object.

  First, we address verbal disputes.

  Verbal Disputes:

  1. **Term**: "Contingency"
     - Amplification usage: They mean that small differences in initial conditions can lead to large differences in outcomes, making the actual outcome highly sensitive and thus not determined by structural forces alone.
     - Damping usage: They mean that outcomes are not fixed in advance but are constrained by structural forces so that only outcomes within a certain envelope are possible.
     - Replacement terminology: We use "high sensitivity to initial conditions" for amplification camp's meaning and "envelope of possibility" for damping camp's meaning.
     - Residue after fix: None. The dispute is now about how wide the envelope is and how sensitive outcomes are within it.

  2. **Term**: "Chaos"
     - Amplification usage: Often used loosely to mean high sensitivity to initial conditions, even if not strictly chaotic in the technical sense.
     - Damping usage: Used to refer only to systems with a positive Lyapunov exponent and exponential divergence.
     - Replacement terminology: Reserve "chaos" for the technical sense (with Lyapunov exponent) and use "high sensitivity" for the loose sense.
     - Residue after fix: Genuine disagreement remains about how common true chaos (in the technical sense) is in social systems.

  3. **Term**: "Small events don't matter"
     - Amplification usage: They mean that small events can have large, unbounded effects.
     - Damping usage: They mean that small events rarely have large effects because of damping.
     - Replacement terminology: Use "small events can have large effects" (amplification) and "small events usually have only local effects" (damping).
     - Residue after fix: The dispute becomes empirical: how often do small events have large effects?

  Now, Disagreements (at least 4, but we'll do 4 for now):

  We structure each disagreement with an id, topic, wordings for each camp, kind, and linked crux.

  1. **Disagreement D1**:
     - Topic: Frequency of amplification
     - Amplification wording: "Small perturbations are amplified to the system level often enough that event-level forecasting beyond a few years is impossible in principle for most questions of interest."
     - Damping wording: "Small perturbations are usually damped, and event-level forecasting at decadal scales is often feasible because structural forces constrain the outcomes."
     - Kind: empirical_but_unsettled
     - Linked crux: C1 (which is about the base rate)

