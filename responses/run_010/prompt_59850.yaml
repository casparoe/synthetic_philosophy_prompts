  1. **Crux C1** (Base rate of amplification):
     - Question: What fraction of small perturbations in a social system lead to a divergence in outcomes that exceeds a factor of 10 at the system level after 20 years?
     - Who moves: Both
     - How they move: If the fraction is high (say >10%), amplification camp is strengthened; if very low (<0.1%), damping camp is.
     - Accepted test: Simulate a synthetic society model with tunable parameters (e.g., agent-based model with subsystems) and run monte carlo simulations: introduce random small perturbations at random times and measure the distribution of outcome divergences after 20 years. The model must include structural forces and stochastic elements.
     - Prediction amplification: The fraction is >10% (they expect high sensitivity).
     - Prediction damping: The fraction is <0.1% (they expect damping to be the norm).
     - Feasibility: Needs_data_collection (building and running the model)
     - What would not count: A perturbation that is not small (e.g., a major war) or a system that is hand-picked to be at a bifurcation point. The test uses random perturbations at random times.

  2. **Crux C2** (Modeling near-decomposability):
     - Question: In a model of near-decomposable systems, how does the strength of between-subsystem coupling affect the predictability of system-level outcomes after a perturbation?
     - Who moves: Both
     - How they move: If even weak coupling leads to rapid loss of predictability, amplification camp is supported; if predictability remains high until coupling is very strong, damping camp is.
     - Accepted test: Use a coupled map lattice or modular network model with tunable between-module coupling strength. Apply small perturbations and measure the forecast error at the system level over time. Vary coupling strength from very weak to strong.
     - Prediction amplification: Predictability drops sharply even at low coupling strengths (e.g., when coupling is 10% of within-subsystem strength).
     - Prediction damping: Predictability remains high until coupling is very strong (e.g., >50% of within-subsystem strength).
     - Feasibility: runnable_now (such models exist and can be run)
     - What would not count: Using a model without hierarchical structure or with only global coupling. The model must have a clear near-decomposable structure.

  3. **Crux C3** (Denominator problem):
     - Question: What fraction of small events that occur in a society are recorded in the historical record, and of those that are recorded, what fraction are later judged to have had large consequences?
     - Who moves: Both
     - How they move: If the recorded large-consequence events are a tiny fraction of all small events, damping camp's selection effect argument is strengthened; if a substantial fraction, amplification camp's claim of frequency is supported.
     - Accepted test: Use a high-resolution historical dataset (e.g., detailed diaries or news archives from a past period) to catalog all small events (e.g., as recorded on a given day in a city) and then track which ones are mentioned in later histories and with what consequence magnitude. Also, use counterfactual analysis to estimate the true effect size of each event.
     - Prediction amplification: At least 1% of small events are recorded and later deemed to have had large consequences.
     - Prediction damping: Less than 0.01% of small events are recorded and deemed to have large consequences.
     - Feasibility: Needs_data_collection (requires detailed archival work and counterfactual assessment)
     - What would not count: Events that are not small (e.g., major battles). The test must focus on events that are initially minor.

  4. **Crux C4** (Human forecasters with vignettes):
     - Question: When given pairs of vignettes that are identical except for one small antecedent, how often do human forecasters judge the altered version to lead to a substantially different outcome at 30 years?
     - Who moves: Both
     - How they move: If forecasters often (say >30% of the time) judge that the change leads to large differences, amplification camp is supported; if rarely (<5%), damping camp is.
     - Accepted test: Create matched pairs of historical vignettes: one describing events as they happened, and one with a small change (e.g., a different decision by a minor official, a delayed message). Ask trained forecasters to rate the plausibility of the altered timeline and the magnitude of the difference after 30 years, without knowing which is real. Use a large set of pairs.
     - Prediction amplification: Forecasters rate >30% of altered vignettes as leading to large differences (they believe small changes often matter).
     - Prediction damping: Forecasters rate <5% of altered vignettes as leading to large differences (they believe small changes rarely matter at that scale).
     - Feasibility: runnable_now (can be done with existing historical cases and forecasters)
     - What would not count: Vignettes where the change is not small or where the outcome is directly affected by the change in an obvious way. The alteration must be plausibly minor and the rating blind.

