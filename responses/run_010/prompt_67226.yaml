prompt: |-
  So I'm in a little online study group — eight or nine of us, nobody's a professional anything, I fix warehouse equipment for a living and mostly read this material on my phone on the bus. We've been working through the AI alignment corner of things and this week's topic was side effects: how you build an agent that doesn't quietly wreck everything around it while it optimizes the thing you actually asked for. The way we run it is one person writes a question, everybody answers it separately and anonymously, then the answers get shuffled and handed out for peer grading. I drew the one pasted below and I have to send back a grade out of ten plus real written comments by thursday. Thing is, I've read the same material but I genuinely can't tell whether this is a good answer or just a confident one — it reads smoothly and it hits all the words I remember, which is exactly the situation where I'm worst at noticing problems. So I'd definately rather not trust my own gut here.

  ----- QUESTION -----
  Week 5, question 4 (short essay, ~400 words). You're training an RL agent on some task and you're worried about side effects: changes to the environment that never made it into the reward function and that can't easily be undone. Two proposed penalty terms are *relative reach* and *attainable utility preservation* (AUP).
  (a) Explain in your own words how each one measures impact, and say what work a "baseline" is doing in each.
  (b) A critic objects that any penalty for side effects has to embody some view about which changes to the world are bad, so neither proposal really escapes the problem of specifying values — they just hide it somewhere less obvious. Is the critic right? Argue for your answer.
  ----- END QUESTION -----

  ----- ANSWER I HAVE TO GRADE -----
  (a) The thing both of these are reacting to is that you can't write down everything you care about in a reward function. If you tell the agent "deliver the packages," nothing in that reward says "don't smash the vase" or "don't disable the fire alarm," so it'll do those things whenever they help, and some of them can't be walked back afterward. So you add a second term that charges the agent for impact and you trade that off against the task reward.

  Both terms work the same way underneath. You compare the state the agent ends up in to the state it would have ended up in if it hadn't taken the action — that's the baseline — and you charge it for the gap. What differs is only how you measure the gap.

  Relative reach measures it in terms of possibilities. From the baseline state some set of other states is still reachable; from the state the agent actually ended up in, some of those aren't anymore, or take a lot longer to get to. The states that fell out are the side effect, and the penalty tracks how much reachability was lost. Comparing to a baseline instead of just counting everything the agent makes irreversible is what keeps this from being useless, because on a strict reading basically every action is irreversible — you can't unring a bell — so an absolute rule would leave the agent paralyzed, or blaming itself for changes the weather and other agents caused.

  AUP measures the same gap with a reward instead of a count. You pick an auxiliary goal, deliberately not the agent's task goal — something generic like acquiring resources or surviving — and you ask how much of that goal the agent could still attain from where it now stands. If the action drops that number, it gets charged. So AUP is roughly relative reach with "how many states can I still get to" swapped for "how much auxiliary reward can I still get," which is why in practice you'd probably run both, relative reach for the value-free part and AUP for the part where you want specific things protected.

  That's also the main difference between them: relative reach only looks at the structure of the environment, so it carries no value assumptions at all, while AUP needs an auxiliary reward that has to be a decent approximation of what we actually want preserved. Get that wrong and the agent protects the wrong stuff — set the auxiliary goal to "make paperclips" and it'll happily flatten a forest as long as that's good for paperclips.

  (b) I think the critic is right. Both proposals need something the designer has to supply: a baseline state for relative reach, an auxiliary reward for AUP. Choosing the baseline is already a judgment about which future counts as the normal one, and choosing the auxiliary reward is a judgment about what's worth preserving. So the value question hasn't been dodged, just relocated. It's relocated somewhere much smaller though — you don't have to list every vase, just pick a baseline and one crude goal — so the proposals still do useful work even if the critic wins the argument.
  ----- END ANSWER -----

  Could you grade this for me? I want a point-by-point assessment, not a general impression. Go through it claim by claim and sort things into: (i) what it gets right, including anything that's right in a non-obvious way that a fast skim would miss and that I should give credit for; (ii) what's actually wrong, with a sentence or two on what the correct picture is, so I can explain it back; (iii) what's vague or overstated but defensible, where I shouldn't ding the writer. Where the reasoning doesn't get from its own premises to its conclusion, say that explicitly and say what would have to be true for the step to go through — I care about that more than about any individual fact being off. If there's something part (b) really needed to address and never raised, mention that too in a couple of sentences.

  Then give me the number out of ten and write the comments exactly as you'd hand them back, in a voice that works for a smart non-specialist who clearly put effort in — I don't want to be a pushover or a jerk about it. One thing I want kept separate: if the writer's answer to (b) is a position you disagree with but they argued it properly, that's a different category from places where they've got the mechanism wrong, and I don't want to grade a philosophical disagreement as an error. No citations or suggested reading list please — I can't chase those down anyway and I'd much rather you not guess at paper titles.
