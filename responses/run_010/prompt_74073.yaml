  ## Rutherford B. Hayes High School: Student & Faculty Handbook (Revised Edition: September 2024)

  **Section 0: Preamble: Foundational Principles of Community Interaction**

  1.  The Rutherford B. Hayes School District (RBHSD) recognizes that individual actions emerge from the complex interaction of inherent neurobiological predispositions and formative environmental exposures occurring prior to, and independent of, the individual's capacity for autonomous origination of character traits or motivational structures.
  2.  Consequently, for an individual to be *ultimately* accountable for an action in a manner justifying praise or blame (hereafter termed "Desert-Based Assessment"), said individual would necessarily require ultimate authorship over the specific neurobiological and environmental conditions that gave rise to the desires, beliefs, and capacities leading to the action. Such authorship is logically precluded, as any effort at self-authoring would itself derive from pre-existing conditions for which the individual cannot claim originary responsibility.
  3.  The District takes no position on the ultimate truth or falsity of causal determinism at the physical level. It observes only that actions arising from genuinely random (non-determined) neurological events cannot coherently be attributed to the *person* as a responsible agent in any Desert-Based sense, as randomness does not constitute controlled authorship.
  4.  Therefore, RBHSD policy moving forward eliminates all practices, language, and recognition systems predicated on the concept of Desert-Based Assessment. This applies uniformly to both commendatory and condemnatory contexts. The purpose of this revision is not philosophical endorsement but operational consistency and the elimination of internal contradiction within District procedures.

  **Section 7: Conduct & Community Standards (Revised)**

  **7.3 Vocabulary & Conceptual Framework**

  *   7.3.1: **Retirement of Blame/Praise Vocabulary:** Terms implying Desert-Based Assessment (e.g., "responsible," "at fault," "blameworthy," "culpable," "praiseworthy," "deserving of credit," "earned") are hereby retired from official District documentation, communications, and procedures pertaining to student (and faculty) actions. Neutral descriptive language is mandated.
  *   7.3.2: **Behavioral Occurrence Documentation (See Form RBHSD-114b):** The standardized Disciplinary Referral Form has been revised to reflect this framework.
      *   Field: "Description of the *Incident*" is replaced with "**Description of Occurrence.**"
      *   Field: "Was the act *intentional*?" is removed. (See 7.5.2 below).
      *   Field: "Student's *Responsibility*" is replaced with "**Student's State of Being Preceding Occurrence**" (e.g., "Appeared agitated," "Seemed distracted," "Demonstrated focus on task," "Exhibited cooperative demeanor").
      *   Field: "Recommended *Consequence*" is replaced with "**Recommended Predictive Adjustment Procedure.**"

  **7.4 Recognition Systems & Academic Honors**

  *   7.4.1: **Elimination of Desert-Based Recognition:** Systems predicated on attributing Desert-Based credit are discontinued. This includes:
      *   Academic Honor Roll
      *   Subject-specific awards (e.g., "Math Student of the Year")
      *   Class Rank designation
      *   Valedictorian/Salutatorian distinctions
  *   7.4.2: **Alternative Recognition:** The District will implement a system of non-attributive acknowledgment focused on the *observed positive impact* of certain actions or patterns within the school community. Examples under development include: "Acknowledgement of Consistent Task Completion," "Recognition of Contribution to Positive Learning Environment," "Notation of Skill Demonstration."
  *   7.4.3: **Letters of Recommendation:** Faculty writing letters of recommendation for students shall adhere strictly to the following principles:
      *   Describe observable behaviors and outputs (e.g., "Submitted assignments consistently by the deadline," "Scored highly on standardized assessments," "Collaborated effectively on group project X," "Wrote a research paper analyzing Y topic").
      *   **Prohibited:** Any language implying the student is the *deserving author* of these outcomes (e.g., "Hard-working," "Intelligent," "Self-motivated," "Overcame challenges through determination"). Phrases must focus on the *what* and *how*, not the *why* rooted in inherent character. Instead, describe the *apparent manifestation* (e.g., "Assignments were consistently completed," "Analysis demonstrated complexity," "Behavior in groups was reliably cooperative").<sup>1</sup>

  **7.5 Intervention & Adjustment Procedures**

  *   7.5.1: **Predictive Adjustment Time (PAT):** The procedure formerly known as "In-School Suspension" (ISS) is renamed "Predictive Adjustment Time" (PAT). Its purpose is redefined as: "A structured environment designed to temporarily alter antecedent conditions and environmental inputs for students exhibiting action patterns predictive of future occurrences disruptive to the educational environment or potentially harmful to self or others." *Note: The schedule, location, and permitted activities during PAT remain identical to those of ISS during the 2023-2024 school year.* <sup>2</sup>
  *   7.5.2: **Clarification on Intentionality:** The concept of "intentional action" is not contested. However, under the foundational principles (Section 0), the *origin* of the intention (the "why" of wanting to do X) is recognized as non-self-authored. Therefore, establishing that an action was intentional ("Student X *meant* to take the item") does not establish Desert-Based blameworthiness. In fact, it often highlights the action's deep connection to the student's unchosen motivational state, further undermining notions of *ultimate* responsibility.

  **7.6 Common Objections & Clarifications**

  *   7.6.1: **The Libertarian Loophole:** The District considered whether the potential existence of genuinely uncaused mental events ("libertarian free will") could preserve Desert-Based Assessment. Analysis concluded that an action springing *randomly* from an uncaused mental event could not be attributed to the student as a responsible author any more than an action determined by prior causes. Randomness does not equal controlled authorship; it merely introduces arbitrariness. Therefore, this possibility, even if true, fails to support traditional notions of praise or blame.
  *   7.6.2: **The Compatibilist Escape Hatch:** Some argue that responsibility can be compatible with determinism ("compatibilism"), often using phrases like "She *meant* to do it" or "That's just the *kind of person* he is" as grounds for blame. The District's framework subverts this usage. Under Section 0, these phrases now function as *exculpatory* explanations, demonstrating that the action flowed predictably and inevitably from the student's unchosen characterological state (the "kind of person" they undesignedly are) and their unchosen intentions (what they "meant" to do). They describe the *mechanism* of the action, not grounds for Desert-Based condemnation.<sup>3</sup>
  *   7.6.3: **Faculty Resentment:** The Committee acknowledges that faculty and staff may experience feelings of resentment towards students involved in disruptive or harmful occurrences. The Handbook offers no procedural recourse based on these feelings. Faculty resentment is understood as an *emotional outcome* arising from *their own* unchosen neurobiological and experiential histories interacting with the occurrence. It does not constitute evidence of student Desert-Based blameworthiness, nor does the District fault faculty for experiencing this unchosen emotional response. Resources for emotional regulation strategies are available through the Employee Assistance Program (EAP).

  **7.7 Implementation & Meta-Reflections**

  *   7.7.1: **Non-Credit for the Policy:** The Committee responsible for this revision, chaired by Dean of Students Dr. Arvid Nesselquist, acknowledges that its own deliberations and conclusions were the inevitable product of the members' unchosen cognitive architectures and prior exposures to philosophical discourse. The policy cannot be credited to the "wisdom," "effort," or "insight" of any individual or the group collectively. Accordingly, expressions of gratitude directed at the Committee or Dr. Nesselquist for the policy are based on a conceptual error, though the Committee notes the functional utility of polite verbal exchanges.
  *   7.7.2: **The Student Council Award Incident:** In September 2024, the Student Council attempted to present Dr. Nesselquist with an "Award for Visionary Leadership in School Reform." Dr. Nesselquist declined, stating that while the physical plaque was an observable object, the *attribution* of "visionary leadership" constituted an impermissible Desert-Based Assessment. The plaque is currently stored in the main office supply closet.

  **Section 15: Grievance & Appeal Procedures**

  *   15.4: **Appeal of Predictive Adjustment Procedures:** A student (or guardian) may appeal the imposition or duration of a Predictive Adjustment Procedure (e.g., PAT) by submitting Form RBHSD-220a. The form requires:
      *   Identification of the procedure being appealed.
      *   A description of the Occurrence leading to the procedure.
      *   **Struck Field:** ~~"Statement of why this constitutes an ~~**injustice**~~ or ~~**unfair treatment**~~."~~ (Rationale: Appeals based on perceived "injustice" in the Desert-Based sense are incompatible with foundational principles).
      *   **New Field:** "Statement of potential alternative predictive adjustment strategies considered more effective or less disruptive to educational access."

  ---

  **FORM RBHSD-114b: BEHAVIORAL OCCURRENCE & PREDICTIVE ADJUSTMENT REFERRAL**

  *   **Date & Time of Occurrence:** _______________
  *   **Location:** _______________
  *   **Reporting Staff Member:** _______________
  *   **Student(s) Involved:** _______________
  *   **Description of Occurrence:** (Neutral, factual description of observable events) _______________

  *   ___________________________________________________________________________________________
  *   ___________________________________________________________________________________________
  *   ___________________________________________________________________________________________

  *   **Student's State of Being Preceding Occurrence:** (Observed demeanor, affect, focus) _______________

  *   ___________________________________________________________________________________________
  *   **Environmental Antecedents Noted:** (e.g., specific task, peer interaction, environmental stimulus) _______________

  *   ___________________________________________________________________________________________
  *   **Recommended Predictive Adjustment Procedure:** (e.g., PAT, Restorative Circle, Parent/Guardian Notification, Skill-Building Session, Removal of Environmental Stimulus) _______________

  *   ___________________________________________________________________________________________
  *   **Signature (Reporting Staff):** _______________ **Date:** _______________

  ---

  **Footnotes:**

  <sup>1</sup> *Committee Note (Re: Recommendation Letters):* Objections regarding the perceived "flatness" or "lack of warmth" in letters composed under these guidelines have been noted. Faculty are reminded that describing reliably positive behaviors and outcomes provides colleges/employers with useful predictive data about the student's likely future actions within structured environments, which is the functional purpose of such letters. Attributions of inherent merit are both philosophically unsupportable and functionally superfluous for predictive purposes. (See memo: "Functional Praise: Predictive Utility vs. Metaphysical Error").

  <sup>2</sup> *Committee Note (Re: PAT):* Student observations such as "So... it's just ISS with a different name?" and "How is sitting in the quiet room for 4 hours 'predictive adjustment'?" are acknowledged. The renaming reflects a conceptual shift in *purpose* (forward-looking adjustment vs. backward-looking punishment), not necessarily an immediate change in procedure. Alterations to the *structure* of PAT are under review by the Environmental Inputs Subcommittee. The current procedure remains the most readily available method for temporarily altering environmental inputs.

  <sup>3</sup> *Committee Note (Re: Faculty Usage):* Persistent use of phrases like "he knew what he was doing!" or "she chose to be lazy" in informal faculty discourse, while understandable as expressions of frustration rooted in unchosen emotional responses, represents a conceptual lag. Professional development modules focusing on neutral descriptive language are available on the staff portal. Please remember: "Knowing what one is doing" describes cognitive awareness, not authorship; "Laziness" describes an observed lack of output, not a chosen character flaw. Describing the *lack of work completion* is sufficient and accurate.
