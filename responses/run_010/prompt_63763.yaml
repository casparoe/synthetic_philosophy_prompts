prompt: |-
  Next month I'm presenting at a two-day workshop on agency in organizations — a mixed crowd of philosophers, legal theorists, and a handful of people from business schools — and the organizers have asked each participant to circulate in advance a one-page list of the commitments they are prepared to defend, so that the sessions can be spent attacking the list rather than summarizing positions. I also sit on the seven-person board of a housing cooperative, which is where most of my intuitions in this area come from, and I've tried to write the list honestly rather than diplomatically. Before I send it I'd like a careful consistency check, because I have a nagging sense that several of these items do not belong in the same document, and I can't tell which ones are doing the damage.

  1. I'm a reductionist about collective attitudes in the Bratman style. When it is true that some people intend to do something together, that truth is made true entirely by facts about the personal attitudes of those people: interlocking intentions directed at our acting together, mutual responsiveness, and a commitment to meshing sub-plans. I don't think we need, and I don't think there is, an irreducible we-mode ingredient in the mind; talk of a plural subject strikes me as a façon de parler for a pattern of individual psychology.

  2. Nonetheless I think organized collectives are agents in their own right. A board, a firm, or a municipality can hold beliefs and intentions that no member holds, can revise them by its own procedures, and can retain them through the replacement of every last member. What fixes such a collective's attitudes, on my view, is its decision procedure together with its records — minutes, standing policies, previously ratified resolutions — and not any snapshot of what is currently in its members' heads. I don't see this as in conflict with item 1, since item 1 is an account of people acting together and item 2 is an account of structured organizations.

  3. Here is the case that motivates item 2. Last spring our board had to decide whether to accept a municipal grant conditioned on a set of occupancy rules. Following our standing procedure, we voted separately on three questions: whether the conditions were acceptable in principle, whether we could realistically comply with them, and whether to accept the grant. Each of the first two carried five votes to two; the motion to accept failed four to three. Every member's own three votes were entirely coherent — each of the four who voted against accepting had voted in favor of one of the two premises and against the other. My judgment is that the cooperative was committed to accepting the grant by the deliverances of its own procedure, that it is open to criticism for the resulting incoherence, and that the criticism lands on the cooperative rather than on any member.

  4. For the small-scale case I'm a flat individualist. When our house runs its annual workday or agrees to replace the roof, I'm content to say there is nothing there beyond interlocking personal intentions; item 1 explains it completely and I see no need to posit an entity. And when someone drops out after the plan has been settled, I think the others have standing to complain — but that standing comes, on my view, from the fact that in joining the plan the person licensed the others to rely on them, not from any commitment that is irreducibly joint.

  5. I hold a supervenience constraint as a guard against letting group agency float free: two collectives whose members have exactly the same personal attitudes, in exactly the same interlocking pattern, cannot differ with respect to what they collectively believe or intend.

  6. Blame and credit are not symmetric at the group level. An organization can be blameworthy for something no member intended, foresaw, or endorsed, because its procedures and its records can make the thing its own doing; but an organization can be credited for something only if at least one member actually endorsed it and was moved by it, since credit requires that somebody's motives be good, and motives exist only in people.

  7. I deny group feeling altogether. No committee, firm, or state has a phenomenology; experience requires a single unified subject, and I don't see how one could be assembled out of many. At the same time I am perfectly happy to say that a landlord company is contemptuous of its tenants, that a firm's apology was performed rather than felt, and that such ascriptions are apt objects of moral assessment.

  8. Methodologically, I prefer accounts that explain group talk by deriving it from independently available facts over accounts that buy explanatory power by enlarging the furniture, and I am especially suspicious of views on which a theory's own favorite entity turns out to be indispensable for making ordinary moral criticism of organizations work. That usually seems to me a sign that the moral work was being done by something else all along.

  What I want is an audit rather than a lecture. Go through these and tell me which pairs genuinely pull against each other and which only look as though they do, and rank the real tensions by severity instead of presenting them as a flat list of worries. For each genuine tension, say what would have to give — which item, or which part of it — and what the cheapest available revision costs me. I'd particularly like to know whether items 2, 5, and 6 can be held together without abandoning item 1, and whether item 3 and item 4 can be held together without my owing two different accounts of where the standing to criticize comes from; I would much rather repair the package than defect to a plural-subject view or to a view that takes we-intentions as primitive. Then tell me which single revision would eliminate the most trouble overall. Please don't simply announce that the list is inconsistent and stop there, and please don't hedge by flagging every pair as problematic — if some of these are compatible on inspection, I want to hear that as well, and why.
reasoning: |-
  Hmm, the user is asking for a consistency check on their philosophical commitments about agency in organizations. They've presented eight distinct items and want me to identify genuine tensions between them, prioritize those tensions by severity, and suggest minimal revisions to resolve them. They specifically want to know if items 2, 5, and 6 can be reconciled with item 1, and whether items 3 and 4 can coexist without conflicting accounts of criticism.

  Looking at their position, they're trying to walk a fine line between reductionism about collective attitudes (item 1) and realism about organizational agency (item 2). Their housing cooperative example (item 3) shows how organizational procedures create commitments independent of member attitudes. Meanwhile, they maintain strict individualism for small-scale cases (item 4) and a supervenience constraint (item 5). There's also an asymmetry in blame/credit (item 6), denial of group phenomenology (item 7), and methodological preferences (item 8).

  The main tension I see is between their reductionism (item 1) and organizational realism (item 2). How can collective attitudes be entirely reducible to individual psychology if organizations maintain commitments through member turnover? The supervenience constraint (item 5) actually helps here by tethering organizational states to individual attitudes, even if not current ones. But item 6's asymmetry creates problems - why can organizations be blamed without any member endorsing the action, but not credited without member endorsement?

  The housing cooperative case (item 3) and small-scale individualism (item 4) also create tension regarding criticism. Item 3 says criticism lands on the cooperative itself, while item 4 says criticism comes from interpersonal reliance. This needs reconciliation. Their denial of group feeling (item 7) is actually consistent with their position, as is their methodological preference (item 8).

  To resolve these, I should suggest clarifying that item 1 applies only to unstructured groups while item 2 covers structured organizations. For the credit/blame asymmetry, they might need to refine how "endorsement" works in organizational contexts. The criticism tension could be resolved by distinguishing between procedural and interpersonal criticism. The most impactful single revision would be to make the scope distinction between unstructured and structured collectives explicit throughout their items.
answer: |-
  Here's a systematic consistency audit of your eight commitments, prioritizing genuine tensions by severity and identifying compatible items. The analysis reveals one major tension requiring revision, two moderate tensions demanding clarification, and several items that are compatible or even mutually reinforcing.

  ### Major Tensions (Requiring Revision)

  1.  **Tension: Items 2 & 6 vs. Item 1 (Severity: High)**
      *   **Conflict:** Item 1 (Bratman-style reductionism) asserts collective attitudes are *entirely* constituted by *current* interlocking individual attitudes ("facts about the personal attitudes of those people"). Item 2 asserts structured organizations (like your board) have attitudes fixed by *procedures and records*, not by any "snapshot of what is currently in its members' heads." Item 6 reinforces this by allowing organizational blameworthiness even when *no member* intended, foresaw, or endorsed the outcome – the attitudes are organizationally real, not reducible to current member attitudes.
      *   **Why it's severe:** Item 1 explicitly denies any "irreducible we-mode ingredient" and reduces collective intentionality to *current* individual psychologies. Items 2 and 6 posit organizational attitudes that are *procedurally constituted* and *persist independently* of the current psychologies of the specific members involved. This is a fundamental clash about the ontological basis of organizational attitudes.
      *   **Resolution Needed:** Item 1's scope must be restricted. It works well for *unstructured, small-scale joint action* (as you note in Item 4), but cannot ground the *organizational agency* described in Items 2, 3, and 6.
      *   **Cheapest Revision:** **Clarify the scope of Item 1.** Explicitly state that Bratman-style reductionism applies *only* to unstructured joint action ("we-intentions" for acting together) and *not* to the attitudes of formally constituted, rule-governed organizations with procedures and records. Item 1 explains the *social glue* binding members initially or in small tasks (Item 4), but the *organizational mind* (Items 2, 3) is a distinct phenomenon grounded in procedures and institutional memory. This preserves the core of Item 1 for its intended domain while making space for Item 2's realism about organizations. **Cost:** You concede Bratmanian reductionism isn't *sufficient* for organizational agency, though it might be part of the foundation (members accepting the procedures).

  ### Moderate Tensions (Requiring Clarification)

  2.  **Tension: Items 2 & 3 vs. Item 5 (Severity: Moderate)**
      *   **Conflict:** Item 5 (Supervenience Constraint) states that groups with identical interlocking individual attitude patterns *cannot differ* in collective attitudes. Items 2 & 3 describe organizational attitudes determined by *procedures and records* (minutes, policies). Crucially, *records are external artifacts*, not part of the "personal attitudes" mentioned in Item 5. Two boards could have identical *current* member psychologies (intentions, beliefs, interlocking patterns) but differ in their organizational attitudes because one has minutes recording a prior binding resolution the other lacks.
      *   **Why it's moderate:** Item 5 is a crucial guardrail against "free-floating" agency. However, your core insight in Item 2 requires recognizing that organizational attitudes supervene on a *broader base* than just current individual psychologies – they supervene on *current psychologies + institutional artifacts + procedures*. The conflict arises if Item 5 is interpreted narrowly (only current psychologies).
      *   **Resolution Needed:** Broaden the supervenience base in Item 5 to include the organization's constitutive rules, procedures, and records.
      *   **Cheapest Revision:** **Reformulate Item 5:** "Two collectives whose members have exactly the same personal attitudes, operating under *identical constitutive rules and procedures*, and possessing *identical institutional records*, cannot differ with respect to what they collectively believe or intend (as determined by those procedures)." This preserves the constraint while accommodating the institutional reality of Items 2 & 3. **Cost:** A slightly more complex supervenience base.

  3.  **Tension: Item 3 vs. Item 4 (Standing to Criticize) (Severity: Moderate)**
      *   **Conflict:** In Item 3 (Board case), criticism for incoherence lands *directly on the cooperative* as an agent, independent of individual member failings. In Item 4 (Small-scale), standing to criticize a defector comes *solely* from the *interpersonal reliance* licensed by that individual's joining the plan, *not* from any irreducibly joint commitment. This suggests two distinct sources of normativity: organizational-procedural vs. interpersonal-reliance.
      *   **Why it's moderate:** Both accounts are plausible for their contexts, but the *source* of the normativity binding the agent (and enabling criticism) seems different. The board case relies on the organization's own rules generating commitments; the house case relies on bilateral/multilateral reliance permissions.
      *   **Resolution Needed:** Distinguish the contexts clearly and potentially offer a unified account of how reliance/permission *applies within* the organizational context.
      *   **Cheapest Revision:** **Clarify the distinct grounds.** Emphasize that Item 4 applies to *unstructured* joint action where the *only* normative structure is the web of interlocking intentions and reliance. In the *structured* context of Item 3, members, by participating in the organization and accepting its procedures (perhaps grounded in initial Bratmanian commitments *to the cooperative itself*), license the *procedures* to generate organizational commitments that bind the *organization* and create a distinct kind of normative standing. The criticism in Item 3 targets the organization's procedural output failure; criticism in Item 4 targets an individual's breach of reliance. **Cost:** Accepting two sources of standing, but seeing the organizational one as built upon (or a development of) the smaller-scale reliance model within a formal structure.

  ### Compatible or Reinforcing Items

  *   **Item 1 & Item 4:** Directly compatible. Item 4 is a specific application of Item 1 to small-scale cases. No tension.
  *   **Item 2 & Item 3:** Item 3 is a concrete illustration and justification for Item 2. Reinforcing.
  *   **Item 2 & Item 7 (Denial of Group Feeling):** Perfectly compatible. You can affirm organizational agency (beliefs, intentions, blameworthiness) without attributing phenomenology. "Contempt" is a disposition expressed in actions/policies, not a felt state of the organization. Reinforcing.
  *   **Item 6 (Asymmetry) & Item 7:** Compatible. Blameworthiness based on actions/procedures (Item 6) doesn't require feeling (Item 7). Credit requiring good motives (Item 6) aligns with motives being personal (Item 7).
  *   **Item 6 & Revised Item 2/3:** Compatible. Organizational blame based on procedures/records (Item 2/3) explains how blame can exist without member endorsement (Item 6). Credit requiring member endorsement/motive (Item 6) fits with motives being personal.
  *   **Item 8 (Methodology) & Overall Position:** Your stated position (after revisions) is *more* compatible with Item 8 than alternatives. You explain organizational talk via procedures, rules, records, and patterns of individual attitudes (Bratmanian for unstructured, reliance/permission for defection, acceptance of procedures for organizations). You avoid positing irreducible group minds or group phenomenology. Item 8 supports your skepticism about views making their special entity indispensable for moral criticism (you derive moral criticism from procedural failure + reliance permissions).

  ### Answering Your Specific Questions

  *   **Can Items 2, 5, and 6 be held with Item 1?** Only if **Item 1's scope is restricted** to unstructured joint action. With that revision (Item 1 for small-scale/unstructured, Item 2 for organizations), then:
      *   Item 5 (revised to include procedures/records) is compatible with the revised Item 2.
      *   Item 6 is compatible with the revised Item 2 (blame via procedures) and doesn't inherently conflict with the *limited scope* of Item 1.
  *   **Can Items 3 and 4 be held together re: standing to criticize?** Yes, but it requires **acknowledging distinct sources of normativity**: interpersonal reliance for unstructured joint action (Item 4) vs. procedural failure binding the organization itself, grounded in members' acceptance of the procedures (potentially traceable to reliance/permission *regarding the organization*), for structured action (Item 3). The "standing" in Item 3 belongs to anyone assessing the organization's coherence; in Item 4, it belongs specifically to the co-participants who were licensed to rely.

  ### The Single Most Impactful Revision

  **Restricting the scope of Item 1 (Bratmanian reductionism) to unstructured/small-scale joint action.** This single change resolves the *major* tension (Item 1 vs. 2/6), significantly alleviates the tension with Item 5 (by allowing the supervenience base to broaden for organizations), and makes reconciling the criticism in Items 3 & 4 more straightforward by clearly separating the domains of application. It preserves the core insights of *both* your reductionist intuitions (Item 1, Item 4) and your realism about organizational agency (Items 2, 3, 6) without forcing an implausible reduction of the latter to the former.

  ### Conclusion
  Your list is **internally consistent with two crucial revisions and one clarification**:
  1.  **Revise Item 1:** Explicitly limit its scope to unstructured/small-scale joint action.
  2.  **Revise Item 5:** Broaden the supervenience base to include constitutive rules, procedures, and records.
  3.  **Clarify Items 3 & 4:** Acknowledge distinct (though potentially related) grounds for criticism/normative standing in unstructured vs. structured contexts.

  These revisions preserve the core of your position (reductionism for small-scale, realism for organizations, asymmetry in blame/credit, denial of group feeling, methodological preference) while resolving the significant tensions. The resulting package is robust, avoids plural subject or primitive we-intention views, and reflects the valuable insights gained from your cooperative experience. It’s ready to face the workshop onslaught!
