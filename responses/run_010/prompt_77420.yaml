answer: |-
  Right then, let's dissect that phrase "better never to have been" like a slightly overcooked Sunday roast. Your flatmate's using it as a conversational full stop, but it's really more of a tangled ball of string. Here’s the menu of precise claims it *might* be making, marked for flavour, and whether they lead to "so don't have kids":

  **The Menu of Meanings:**

  1.  **Impersonal, World-State Comparison (Prevention Focus):**
      *   **Claim:** "The state of the world *where a particular person never exists* is better than the state of the world *where that same person exists and experiences life*." (The comparison is between two possible worlds, one with Person X, one without).
      *   **Flavour:** **Arguable.** This is where the "asymmetry" he mentions lives. It claims preventing existence prevents potential suffering (a definite 'bad'), and the cost is only the *absence* of potential pleasure (which, the asymmetry argues, isn't a 'bad' *if no one exists to miss it*). Highly controversial ethically, relies on specific value judgments about the badness of suffering vs the non-badness of absent pleasure for non-existent beings.
      *   **Path to "Don't Have Kids"?** **Yes, directly.** If bringing someone into existence *makes the world a worse state* (because it adds potential suffering without sufficient compensating pleasure, or because the absence of suffering is a greater good than the presence of pleasure), then it's better *for the world* not to do it. This is core anti-natalism (e.g., David Benatar's argument).

  2.  **Personal Welfare Claim (Non-Existent Subject):**
      *   **Claim:** "It is better *for a specific non-existent person* that they never come into existence."
      *   **Flavour:** **Flat out false (or nonsensical).** This is the most problematic. It attributes a state of welfare ("better for *whom*?") to someone who *does not and never will exist*. You can't meaningfully say something is good *for* a non-entity. There's no subject to benefit. This is likely loose talk or a misstatement trying to capture meaning #1 or #3.
      *   **Path to "Don't Have Kids"?** **No.** It's logically incoherent. If the person doesn't exist, there's no "them" for whom non-existence is "better". It can't ground a reason *for them*.

  3.  **Ascription of Harm/Benefit to Procreation:**
      *   **Claim:** "Bringing a person into existence *harms* them (or fails to benefit them), whereas not bringing them into existence *does not harm them* (and may spare them harm)."
      *   **Flavour:** **Arguable (and contentious).** This avoids directly attributing welfare to the non-existent, but makes a claim *about the act of procreation*. It hinges on the asymmetry: creating someone *exposes* them to harm (suffering), whereas not creating them only *withholds* potential benefits (pleasure), which the asymmetry claims isn't harmful *to the non-existent person*. Critics argue creating someone also confers benefits and that non-existence isn't a state you can compare to existence meaningfully.
      *   **Path to "Don't Have Kids"?** **Yes, directly.** If procreation is an act that harms the person created (or is net harmful, or fails to be beneficial), then it's wrong to do it *to that person*. This is another core anti-natalist argument.

  4.  **Verdict on Permissibility (Anti-Natalism Lite):**
      *   **Claim:** "Bringing a person into existence is morally impermissible (or at least, not permissible)."
      *   **Flavour:** **Arguable.** This is less a precise claim about states or welfare and more a direct moral conclusion. "Better never to have been" is offered as the *reason* or *justification* for this verdict, usually relying on one of the above arguments (#1 or #3).
      *   **Path to "Don't Have Kids"?** **Yes, explicitly.** This *is* the "so don't have kids" claim, justified by the other arguments.

  5.  **Expression of Current Suffering (The Hospital Bed Meaning):**
      *   **Claim:** "Given the *extreme suffering this existing person is experiencing right now*, their life is so terrible that non-existence *would be preferable for them now* (or perhaps retrospectively, that it would have been better *for them* if they had never been born *to avoid this*)."
      *   **Flavour:** **Bland (as a feeling) / Arguable (as a universal claim).** This is a desperate cry of pain or profound regret expressed *by or about an existing person*. It's not about abstract comparisons of possible worlds or the logic of non-existence. It's about *this life, now*, being unbearably awful. It presupposes existence and compares *current existence* to *non-existence* (or retrospectively, *past non-existence* vs *past existence leading to now*). It's subjective and contextual.
      *   **Path to "Don't Have Kids"?** **No, not directly.** It's about an *existing* person's *current* suffering. It doesn't logically extend to the creation of *new* people who *might* suffer, unless combined with very pessimistic assumptions about the universal likelihood of such suffering (which would push it towards #1 or #3).

  **The Sleight of Hand (Never Have Been vs. Not Being Now):**
  You've nailed his trick. He constantly exploits the ambiguity between:
  *   **Never Having Existed:** The state *before* conception, involving no subject. Central to arguments #1, #2, #3.
  *   **Not Existing Now (Ceasing to Exist or Never Having Existed):** The hospital bed meaning (#5) is almost always about *escaping current existence* or regretting *having come into existence* that led *to this current state*. It requires a subject who *does* or *did* exist. He uses the emotional weight of #5 to prop up the abstract, impersonal logic of #1 or #3, which are fundamentally different.

  **Which Gets Him to "So Don't Have Kids"?**

  *   **#1 (Impersonal World-State)** and **#3 (Harm of Procreation)** are the core arguments he needs. They are the engine driving the anti-natalist conclusion (**#4**).
  *   **#2 (Better For Non-Existent)** is logically wonky and doesn't work on its own, though he might *think* he's saying this.
  *   **#5 (Current Suffering)** doesn't get him there logically on its own, but he uses its emotional resonance to make #1 or #3 seem more plausible.
  *   **#4 (Impermissibility)** *is* the "so don't have kids" claim, justified by #1 or #3.

  **In short:** His intended meaning is almost certainly a blend of **#1 (Impersonal World-State)** and **#3 (Harm of Procreation)**, packaged as **#4 (Impermissibility)**, using the emotional resonance of **#5 (Current Suffering)** to make it seem obvious, while relying on the ambiguity between "never existing" and "not existing now" to avoid the logical problems of **#2 (Better For Non-Existent)**. The arguments (#1 & #3) are highly **arguable**, resting entirely on that contentious asymmetry about suffering vs. absent pleasure. They are not the settled truth he presents them as. The hospital bed use (#5) highlights how context changes the meaning entirely – there, it's about *existing* agony, not an abstract argument against procreation.
