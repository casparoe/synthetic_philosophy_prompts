  ### Verdict on the Lizard Dewlap
  Your flatmate would say the dewlap is **not honest**. Here's why, based on the patterns in her verdicts and the underlying rule she's applying.

  ### The Rule She's Running
  Her core rule for honesty is: **A signal is honest only if its expression (e.g., size, intensity, or presence) varies with the bearer's quality, and this variation is enforced by mechanisms that make cheating unprofitable, impossible, or too costly for low-quality individuals.** This rule emphasizes:
  - **Condition-dependent cost**: High-quality individuals can afford the signal more easily (e.g., peacock's train, bowerbird's bower).
  - **Physiological constraints**: Cheating is physically impossible (e.g., red deer roaring).
  - **Punishment or social enforcement**: Cheating is deterred by repeated interactions (e.g., house sparrow's bib).
  - **Shared costs**: Cheating harms the signaler's kin/group, making it evolutionarily unstable (e.g., nestling begging calls).

  In all her verdicts, the signal **varies** with quality (e.g., larger trains, louder roars, bigger bibs, more elaborate bowers). If the signal doesn't vary—even if it's costly—it can't convey information about quality and thus isn't honest. The arbitrary Fisherian ornament (no cost, no quality information) is a special case that reinforces this: cost alone isn't sufficient; the signal must be linked to quality through variation.

  ### Why the Dewlap Fails
  - **No variation in the signal**: Every male has the identical dewlap (same size, color, etc.). A scrawny male pays the same absolute cost as a robust one, so the dewlap doesn't signal anything about his quality (e.g., strength, health, or fitness).
  - **No enforcement mechanism**: 
    - The cost is **not condition-dependent in a way that affects expression**. Even though the relative cost is higher for scrawny males (20% of their budget vs. 4% for robust males), nothing stops them from paying it. The fixed cost doesn't force variation in the dewlap itself.
    - **No physiological constraint**: A scrawny male can physically produce the dewlap.
    - **No punishment**: Males are solitary and meet only once, so there's no social enforcement (like in the house sparrow).
    - **No shared costs**: The cost is borne individually, not by a group.
    
  Since the dewlap doesn't vary and has no mechanism to prevent low-quality males from displaying it, it isn't an honest signal. It's just a fixed, mandatory ornament—like a "uniform" all males wear—that conveys no information about individual quality.

  ### Alternative Rule That Fits Her List but Conflicts Here
  An alternative rule that fits all her existing verdicts equally well is: **A signal is honest if it is costly and the cost burden (relative to the bearer's resources) is condition-dependent, regardless of whether the signal varies.** 

  - **Why it fits her list**:
    - Peacock's train: Cost burden is higher for low-quality males (they can't afford it), and the signal varies. But the rule doesn't require variation—it would still work if the train were fixed but unaffordable for weak peacocks.
    - Red deer roaring: Cost burden is condition-dependent (low-quality stags can't roar as much due to constraints), and signal varies. Again, variation isn't strictly necessary under this rule.
    - House sparrow's bib: Cost burden is higher for cheats (due to punishment), leading to variation, but the rule focuses on burden alone.
    - Bowerbird's bower: Cost burden tracks quality, varying with the builder.
    - Nestling begging: Cost burden is shared, making cheating costly for the brood.
    - Arbitrary Fisherian ornament: No cost, so condition-dependent burden doesn't apply—fits as "not honest."
    
  - **Why it conflicts in the lizard case**: Under this rule, the dewlap **would be honest** because the cost burden is condition-dependent—it consumes a larger fraction of a scrawny male's budget. The signal doesn't need to vary; the mere fact that low-quality males pay a higher relative cost makes it honest.

  ### The Further Case to Tell the Rules Apart
  To distinguish her rule from the alternative, use this case:  
  **A species of frog where every male has an identical bright orange throat patch. The patch costs the same fixed amount of energy and pigment to produce (e.g., 100 joules). High-quality males have a total energy budget of 500 joules; low-quality males have 250 joules. Interactions are one-off and anonymous (no punishment).**

  - **Her rule (requires variation)**: **Not honest.** The throat patch doesn't vary—all males look identical—so it conveys no information about quality. Even though the cost burden is higher for low-quality males (20% of budget vs. 10%), there's no mechanism linking cost to signal expression.
    
  - **Alternative rule (condition-dependent burden alone)**: **Honest.** The cost burden is higher for low-quality males (20% vs. 10%), making it honest despite no variation.

  **Why this case resolves the ambiguity**:  
  - Her existing verdicts don't include a fixed-signal case, so both rules fit them equally well.  
  - This frog case forces a choice:  
    - If she requires variation (her rule), she says "not honest."  
    - If she only requires condition-dependent burden (alternative rule), she says "honest."  
  The lizard case is similar but could be stumped by ambiguity; this frog case eliminates that by isolating the fixed-signal element. Her likely answer ("not honest" for the frog) confirms her true rule.
