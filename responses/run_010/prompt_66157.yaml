prompt: |-
  I'm a backend engineer, mostly distributed systems — lots of independently deployed services that have to agree on stuff (rate limits, who's holding the lock, whether to roll back) with no central coordinator, no shared clock, and sometimes no direct channel at all, so it's gossip protocols, leases, capability tokens, that kind of thing all day. Zero formal philosophy background; I read philosophy-adjacent blog posts and have picked up enough jargon to be dangerous. A friend of mine who's deep in the rationalist scene tried to explain acausal trade to me over the weekend — the idea that two agents who can never send each other a signal, not even in principle, can still strike and honor a deal because each can model the other well enough, and that this apparently matters a lot for how some very powerful future AI would treat civilizations it'll never meet. I nodded along, but the parts that stuck feel like they're doing something wierd with words, and when I tried to repeat it back to him on Monday I couldn't.

  So: restate the whole acausal trade thing in the vocabulary I actually think in — protocols and handshakes, Byzantine faults, capability tokens, "we can't have a channel but we can have a shared prior," models of other components used for control, whatever is genuinely the right analogue rather than the nearest-sounding one. Be as faithful as you can and don't collapse it into metaphor; if the honest translation of some claim is that it has no counterpart in my world, say that instead of inventing one. And then give me the residue report, which is the part I actually care about: which claims survive intact, which only survive if you stretch my vocabulary until it squeaks, and which have no expression in it at all. Then take a side on whose fault the residue is — is my protocol vocabulary missing a concept (something about decisions turning on logical rather than causal dependency, maybe?), or is the acausal trade story less coherent than it sounds, so that the failure to translate is itself evidence? One thing I want handled head-on, because my friend couldn't answer it: in my world, two services that model each other from stale or lossy data will happily coordinate on a story that's wrong but mutually consistent, and I don't see what structurally prevents that from being the entire mechanism behind acausal trade — so is there a real deal, or is it just two models agreeing with each other?

  Format: exactly five numbered items, no introduction and no conclusion, each a sentence or two (short paragraph at most), in this order — (1) the setup: two agents, no possible channel, why anyone thinks a deal is even on the table; (2) the mechanism: what supposedly makes the deal get honored, in my terms; (3) the payoff claim: why this is supposed to matter enormously rather than be a curiosity; (4) the strongest objection, including the stale-models one above; (5) the residue report plus the verdict on whose fault the residue is. Don't bother with citations, a bibliography, or a reading list — I can't look anything up and in my experience those come back made up half the time anyway.
