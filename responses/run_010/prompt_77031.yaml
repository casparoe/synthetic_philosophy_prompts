  The case studies: The British example illustrates custodial silence designed to hide gaps, crucial for showing deliberate obfuscation. The fire example highlights accidental custodial loss leading to biased survival, morphing into instrumental silence. The surname point isn't novel (archivists know selection biases) but effectively shows how custodial events create new instrumental biases. So they're functional, not decorative.

