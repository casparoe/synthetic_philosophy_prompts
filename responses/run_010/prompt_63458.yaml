  So I'm trying to settle for myself which of epistemicism and supervaluationism I actually find more convincing, and I don't want to lean on my half-remembered version of what either camp says. Here's the thing though: instead of the usual head to head, I want to score them separately against three bits of data I've been treating as the real test cases. Call them:

  (a) the arbitrariness datum — the fact that any proposed cutoff for "heap" or "tall" feels arbitrary in a way that seems to demand an explanation, not just a shrug;

  (b) the tolerance datum — the intuition that each individual step in a sorites series really does preserve the predicate, so that whichever theory wins has to say something about why that intuition is so sticky even if it's false;

  (c) the sharpness datum — ordinary speakers seem to treat at least some vague predicates as if they do have definite boundaries in practice, e.g. nobody actually hesitates over whether a 6'4" man is tall.

  Rate each theory on each of the three, 0 to 10, where 10 means it fully accounts for the phenomenom and 0 means it either ignores it or makes it worse than the pre-theoretic mess it was supposed to clean up. Short justification for every single number, not just the extremes. Then give me one overall number for each theory, weighted by how much you think each datum should matter to the debate — and tell me what weights you picked. If you think one of the three is a bad datum, e.g. that (c) is really just a fact about how experiments get run and not about the semantics at all, say so and score it anyway, then explain how dropping it would have moved your overall numbers.
