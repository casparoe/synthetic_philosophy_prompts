prompt: |-
  I have spent more years than I care to admit in the anthropics threads on LessWrong, and I have now constructed an argument about Boltzmann brains that seems to succeed too well — which is usually a sign of a hidden flaw. I should like a diagnosis.

  Let us call the following the Instability Criterion: a theory is rationally rejected if, were it true, the evidence we take to support it would probably not support it.

  (1) The Instability Criterion holds.
  (2) Any cosmology whose history contains a long equilibrium phase, or an eternally inflating late time, implies that observers with experiences qualitatively like mine are overwhelmingly more numerous, on the theory's own counting, as momentary thermal fluctuations with manufactured memories than as evolved creatures with genuine pasts.
  (3) So if such a cosmology were true, my recollections — of the temperature anisotropy data, of deriving the fluctuation rate, of the very argument I am now setting out — would be far more likely to be manufactured than veridical.
  (4) By (1), such cosmologies are rationally rejected. So far I am happy.
  (5) But nothing in that argument was peculiar to fluctuation cosmologies. Every empirical theory is supported by records, and there is no coherent body of experience that could not have arisen spontaneously; so for any theory T, were T true, my evidence would not reliably support T.
  (6) Hence, by (1), every empirical theory is rationally rejected.
  (7) Since (6) is absurd, (1) is false — and with it goes the only principled ground I had for rejecting Boltzmann-brain cosmologies at (4).

  I cannot accept the second half of (7). A cosmology that entails I am probably a disembodied brain hallucinating a research programme still seems to me to be in trouble, and in a way that a cosmology which merely permits sceptical hypotheses is not. I have framed the argument so that it does not turn on how one resolves the measure problem, nor on whether fluctuated observers enjoy coherent or incoherent memories; if it does turn on one of those after all, say so and explain where my framing failed. My suspicion is that (5) is doing something sneakier than (2), but I cannot say what.

  Which step should I reject, why did it look unobjectionable at the time, and what does rejecting it cost? I would like the exits priced rather than merely listed: keep (1) and swallow the global scepticism, restrict (1) in some non-ad-hoc way, deny (2), or deny that a theory's own measure licenses conclusions about me. Please write in American English.
reasoning: |-
  Okay, let me tackle this user's problem. They've been deep into LessWrong anthropics threads and crafted an argument against Boltzmann brains that backfires into global skepticism. The core issue is their Instability Criterion leading to rejecting all empirical theories. 

  First, I need to understand their argument structure. Step (5) claims every theory faces the same manufactured evidence problem as Boltzmann cosmologies. But is that true? For normal theories like evolution, the "fluctuation" scenario isn't just improbable—it's incompatible. If evolution is true, my memories must have causal origins. The probability of Boltzmann-style fluctuations isn't just low under evolution; it's zero because evolution denies such fluctuations create memories. 

  The key difference is explanatory coherence. Boltzmann theories make manufactured evidence probable, while normal theories make it vanishingly unlikely. The user's step (5) falsely equates mere logical possibility with probabilistic likelihood under the theory. 

  I should check if this resolves cleanly. Accepting this means rejecting step (5), which costs nothing for rejecting Boltzmann brains and preserves scientific reasoning. The user's suspicion about (5) being sneaky was correct. 

  The user might worry this is ad-hoc, but it's not—it follows from how theories define their own probability spaces. Their framing failed by overlooking that theories implicitly specify what counts as evidence. 

  This feels satisfying: Boltzmann cosmologies uniquely undermine their own evidence, while normal theories don't. No need for measure problem tangles or swallowing skepticism. The exit costs are minimal—just recognizing that (5)'s generalization was too hasty.
answer: |-
  Here's the diagnosis, priced exits included. Your flaw is in step (5), and rejecting it costs surprisingly little while saving your core intuitions.

  1.  **The Flaw: Step (5) is False.** It *overgeneralizes* the problem from Boltzmann cosmologies to *all* theories by ignoring the *causal structure* embedded within each theory.
  2.  **Why Step (5) Looks Unobjectionable (The Trick):** It relies on a superficial similarity: the mere *logical possibility* that any experience could be manufactured. This seems parallel to Boltzmann scenarios where manufactured evidence *is* the dominant causal pathway. Step (5) treats "manufactured evidence" as a monolithic, theory-independent category. It fails to account for *how each theory itself explains the origin of the evidence* and what probabilities it assigns to different causal pathways.
  3.  **Why Step (5) is Actually Wrong:**
      *   **Normal Theories Bind Evidence to Past:** Under a non-Boltzmann theory T (e.g., evolution, standard Big Bang cosmology), the theory *itself provides a causal mechanism* linking present evidence (like memories, data records, fossils) to a real past history. T *entails* that these records were *generated by the historical process it describes*.
      *   **Manufactured Evidence is Incompatible (or Vanishingly Improbable) Under T:** For T, the possibility that your specific, coherent memories and records are *uncaused thermal fluctuations* isn't just improbable *given* T; it's typically *logically incompatible* with T's causal structure or assigned a probability *so low it's effectively zero within T's own probability measure*. T *denies* that such fluctuation observers with coherent manufactured evidence are possible or are significant components of reality. If T is true, then the *only* (or overwhelmingly dominant) way your evidence exists is via the causal history T describes.
      *   **Contrast with Boltzmann Cosmologies:** Step (2) is correct *only* for cosmologies where the theory *itself predicts* that the dominant way observers like you (with your experiences) exist is as thermal fluctuations. The theory *forces* the conclusion that your evidence is likely manufactured *if the theory is true*. The instability is *internal* to the theory.
      *   **Example:** Consider T = "Humans evolved on Earth over billions of years." Under T:
          *   The causal pathway for your memories and scientific data involves your brain developing via evolution, sensory input, learning, etc. T *predicts* this pathway.
          *   The pathway "random thermal fluctuation in a vacuum assembling a brain with fake memories identical to yours" is:
              *   Not predicted by T.
              *   Not a component of T's description of reality.
              *   Assigned an infinitesimally small probability *by the laws of physics T assumes*, far smaller than the probability of your evidence arising via evolution *under T*.
              *   Crucially, *if T is true*, then the fluctuation scenario *didn't happen*. Your memories *are* veridical *under T*. The probability T assigns to your evidence being manufactured is effectively zero *within T's own framework*. There is no "probably manufactured" scenario *if T is true*.

  4.  **Rejecting Step (5): What it Costs**
      *   **Cost:** You must accept that the "manufactured evidence" threat is *not symmetric* across all theories. It's only a devastating, theory-undermining problem for theories that *internally predict* manufactured evidence is the dominant origin of observers like you. You give up the idea that *mere logical possibility* of skeptical scenarios is sufficient to trigger the Instability Criterion under any theory.
      *   **Benefit:** This cost is minimal and philosophically sound. It preserves:
          *   **Your Instability Criterion (1):** It remains valid as a principle for identifying *self-undermining* theories.
          *   **Your Rejection of Boltzmann Cosmologies (2-4):** Theories with long equilibrium phases *do* internally predict that your evidence is likely manufactured, triggering the Instability Criterion. They are rationally rejected.
          *   **Scientific Reasoning:** Normal scientific theories (evolution, standard cosmology, etc.) are *not* self-undermining via the Instability Criterion. Under those theories, your evidence reliably supports them because the theory itself explains the evidence as veridical and assigns negligible probability to it being manufactured *in the way that would undermine it*. Sceptical hypotheses remain *logically possible* but are *externally imposed*, not *internally generated* by the theory itself. Science functions normally.
          *   **Your Intuition:** Your strong sense that Boltzmann cosmologies are uniquely problematic ("in trouble in a way that... is not") is vindicated. The instability is specific to them.

  **Why Your Framing Didn't Catch This (The Suspected Sneakiness):**

  You framed it to avoid dependence on the measure problem or memory coherence. The flaw lies deeper, in the *interpretation of probability conditional on the theory*. Step (5) treats "P(Manufactured Evidence | T)" as significant for *every* T, simply because a manufactured state is *logically conceivable*. However, for non-Boltzmann T, "Manufactured Evidence" in the relevant sense (thermal fluctuation with fake memories) *isn't an event within the sample space defined by T* or is assigned probability zero by T's own laws. T defines what constitutes possible evidence and its origins. For T, your evidence *is* the result of the causal process T describes. The Instability Criterion only bites when T *itself* says the dominant way your evidence exists is via a process that renders it unreliable for supporting T.

  **Priced Exits Summary:**

  1.  **Keep (1) & Swallow Global Scepticism (Reject Science):** **Cost:** Absurd, self-defeating. You couldn't rationally believe *anything*, including the argument itself or the existence of LessWrong threads. **Price:** Infinite. Unacceptable.
  2.  **Restrict (1) Non-Ad-Hoc:** **This is the solution.** Restrict the Instability Criterion's application to theories where the "manufactured evidence" scenario is *a probable outcome predicted by the theory itself*. **Cost:** Giving up the symmetry argument in (5). **Price:** Very Low. Aligns with how theories define their own probability spaces and causal structures. Saves science and your rejection of Boltzmann brains.
  3.  **Deny (2):** **Cost:** Requires solving the measure problem *against* Boltzmann brains or denying the physics of fluctuations/equilibrium. **Price:** Very High/Controversial. The problem seems robust to measure details (as you noted), and denying the physics is unsupported. Doesn't solve the later steps anyway.
  4.  **Deny a Theory's Measure Licenses Conclusions About Me (Reject Anthropic Reasoning):** **Cost:** Makes it impossible to rationally reason about observer selection effects *at all*, including in uncontroversial cases (e.g., the Doomsday Argument, Sleeping Beauty). **Price:** High. Throws out valuable tools. Also doesn't cleanly resolve the core issue – if the theory predicts vastly more BBs, *something* has to give in how we reason.

  **Conclusion:** Reject step (5). The cost is minimal: acknowledging that the threat of manufactured evidence only triggers the Instability Criterion when it is *internally generated* by the theory's own predictions. Boltzmann cosmologies uniquely suffer this fate. The Instability Criterion remains valid, your rejection of Boltzmann brains stands, and science is saved from the global scepticism trap. Your suspicion about (5) was correct – it smuggled in an invalid equivalence between the *internal* prediction of manufactured evidence in Boltzmann scenarios and the mere *external logical possibility* of such evidence under other theories.
