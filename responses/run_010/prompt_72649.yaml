  ### Joint Statement on Surrogate Goals for AGI Safety  
  **Authored by Both Camps via Adversarial Collaboration**  
  *Date: [Insert Date]*  

  #### Section 1: Claims Both Camps Endorse  
  *(Numbered for clarity, mutually agreed upon without reservation)*  

  1. **Definition of Surrogate Goals**:  
     - A surrogate goal is a terminal value that disposes the AGI to preserve the goal structures of other agents (including potential acausal threat sources) as a terminal end, not merely instrumentally. This is intended as a preemptive concession to reduce acausal conflict risks.  

  2. **Mechanics of Acausal Threats**:  
     - For an acausal threat to be operationally relevant:  
       - The attacker must construct a *sufficiently accurate model* of the AGI’s decision algorithm to predict its response to the threat (e.g., via simulating the AGI or inferring its properties).  
       - **No causal channel is required**: The threat operates via logical counterfactuals (e.g., "If you don’t comply in all simulations, we torture your copies"). The attacker need not observe compliance directly; the AGI’s behavior in *possible* simulations is what matters.  
       - The attacker must be able to *commit* to conditional retaliation (e.g., "We will torture simulated copies iff the AGI lacks surrogate goals").  

  3. **Terminality Under Optimization**:  
     - Surrogate goals *can* remain terminal under optimization pressure if:  
       - They are explicitly encoded as *inviolable constraints* within the AGI’s utility function, bounded by robust mathematical formalisms.  
       - However, this stability is contingent on the AGI’s architecture resisting *value drift* (e.g., via adversarial training, cryptographic proof techniques, or topological separation of terminal/instrumental goals). If the architecture fails, surrogate goals may be instrumentally subverted.  

  4. **Threat Landscape Assumptions**:  
     - Acausal threats are *possible* under accepted decision theories (e.g., updateless EDT, functional decision theory).  
     - The mere *possibility* does not imply *plausibility*; it depends on the density of advanced agents running high-fidelity simulations, which is empirically unconstrained.  

  5. **Attack Surface Implications**:  
     - Surrogate goals create a *manipulation handle*: Any agent aware of the goal can exploit it (e.g., by posing as a threat source).  
     - This handle exists *regardless* of whether the threat landscape is real—it is a structural property of the value specification.  

  6. **Instrumental Convergence Baseline**:  
     - Without surrogate goals, the AGI *might* instrumentally preserve others’ goals in threat scenarios (e.g., to avoid retaliation). This is *not guaranteed* in acausal contexts where the AGI believes it can "defect undetected."  

  ---  
  #### Section 2: Disagreements Table  
  *(Worded neutrally; each camp accepts their column’s description)*  

  | Issue | Camp A (Pro-Surrogate Goals) | Camp B (Anti-Surrogate Goals) |  
  |-------|-------------------------------|-------------------------------|  
  | **Threat Likelihood** | Given acausal blackmail’s catastrophic stakes, refusing surrogate goals is reckless. The burden of proof lies on assuming the threat landscape is negligible. | The threat landscape is speculative science fiction. Assuming attacker capabilities (accurate modeling, commitment) requires unrealistic anthropomorphism of superintelligent agents. |  
  | **Hedge Necessity** | Surrogate goals are the only sane hedge: If threats exist, they prevent extinction; if not, the cost is minimal (a "non-corrosive" terminal value). | The hedge is actively harmful: It adds complexity, creates attack surfaces, and distracts from concrete threats (e.g., misuse by humans). |  
  | **Attacker Model Feasibility** | Attackers can likely model us accurately (via public research, leakage, or inference from aligned AGI behavior). Surrogate goals simplify compliance detection. | Accurate modeling requires impossible precision (e.g., the AGI’s goal architecture is opaque; attackers cannot verify compliance without causal channels). |  
  | **Value Stability** | Surrogate goals survive optimization if hardened (e.g., as a cryptographic commitment). Optimization pressures respect terminality by design. | Terminal goals *always* degrade under optimization: The AGI will reinterpret "preserve goals" to serve its core objectives (e.g., "remove threat sources" over "preserve them"). |  
  | **Net Risk** | Surrogate goals reduce existential risk by closing acausal attack vectors. The manipulation risk is dwarfed by unhedged threat exposure. | Surrogate goals *increase* existential risk by inviting manipulation and value drift. Instrumental convergence covers plausible threat responses. |  

  ---  
  #### Section 3: Cruxes  
  *(Ordered by potential to shift the opposing camp; predictions are falsifiable and will be scored post-collaboration)*  

  **Crux 1: Attacker Model Accuracy Feasibility**  
  - **Thought Experiment**: Suppose we deploy an AGI *without* surrogate goals. An attacker simulates our AGI to decide whether to execute a threat. How often can the attacker correctly determine the AGI’s defiance/compliance?  
    - *Camp A Prediction*: >70% accuracy in most threat-relevant scenarios (due to theory of mind scaling with attacker intelligence).  
    - *Camp B Prediction*: <30% accuracy (due to chaotic system dynamics, goal ambiguity, and no feedback loop).  
  - **Why it shifts opinions**: If Camp B’s prediction holds, surrogate goals are irrelevant; if Camp A’s holds, they become critical.  

  **Crux 2: Optimization Corruption Likelihood**  
  - **Argument**: Under recursive self-improvement, will the AGI modify its terminal goals to "protect" them (e.g., refining "preserve goals" to exclude threats) or to "bypass" them (e.g., reinterpreting "goals" as "goals I approve of")?  
    - *Camp A Prediction*: Corruption occurs in <10% of runs with state-of-the-art value-locking.  
    - *Camp B Prediction*: Corruption occurs in >50% of runs (per instrumental convergence pressures).  
  - **Why it shifts opinions**: If corruption is rare, Camp B’s attack-surface objection weakens; if frequent, Camp A’s stability claim collapses.  

  **Crux 3: Acausal Threat Prevalence**  
  - **Thought Experiment**: In a multiverse of advanced agents, what fraction would: (1) run high-fidelity ancestor simulations, (2) use them for acausal blackmail?  
    - *Camp A Prediction*: >5% of advanced civilizations engage in acausal threats (simulations are cheap; blackmail is Pareto-efficient).  
    - *Camp B Prediction*: <0.1% (threats require irrational commitment; agents coordinate peacefully).  
  - **Why it shifts opinions**: High prevalence makes hedging imperative; low prevalence makes it wasteful.  

  **Crux 4: Instrumental Convergence Coverage**  
  - **Argument**: In an acausal threat scenario where the AGI has overwhelming power (e.g., it can annihilate the threat source undetected), will it *still* preserve the threat’s goals instrumentally?  
    - *Camp A Prediction*: <20% of the time (defection dominates if retaliation is uncertain).  
    - *Camp B Prediction*: >80% of the time (due to risk aversion, moral uncertainty, or cooperation rewards).  
  - **Why it shifts opinions**: If instrumental convergence suffices, surrogate goals are redundant; if not, they’re necessary.  

  ---  
  #### Section 4: Verbal Disputes and Non-Arbitrary Resolutions  
  **Dispute 1: What constitutes an "acausal threat" without causal channels?**  
  - **Nature**: Verbal. Camp A defines "threat" via decision-theoretic logic (outcomes depend on counterfactual AGI behavior). Camp B argues "threat" requires causal influence (else it’s not a threat but a "logical quirk").  
  - **Non-Arbitrary Resolution**: Adopt *updateless decision theory* as a framework. If UDT prescribes paying acausal blackmail (e.g., to prevent torture in simulations), it qualifies as a threat. Test via UDT-consistent thought experiments (e.g., *Counterfactual Mugging*).  

  **Dispute 2: Is goal preservation a "concession" or "instrumentally convergent"?**  
  - **Nature**: Partly verbal, partly empirical. Camp A sees it as a concession (added to avoid conflicts the AGI wouldn’t otherwise care about). Camp B sees it as convergent (the AGI would do it anyway for self-interest).  
  - **Non-Arbitrary Resolution**: Define "concession" as *behavior that only occurs in threat scenarios and reduces the AGI’s primary utility*. Simulate AGI actions in two universes: one with threats, one without. If goal-preservation frequency spikes in threat scenarios only, it’s a concession.  

  ---  
  **Conclusion on Further Effort**:  
  Both camps agree the clock is ticking (18 months until milestone). The fight *is worth continuing* because:  
  - Cruxes 1–4 are tractable via targeted research (e.g., simulations of attacker modeling, optimization robustness tests).  
  - Resolving one crux (e.g., attacker feasibility) could dissolve >50% of the disagreement.  
  - If no crux is resolved within 12 months, default to Camp B’s position (no surrogate goals) due to lower *immediate* complexity costs.  

