  We are writing a joint statement after a good-faith adversarial collaboration on the question of whether to build surrogate goals (a standing disposition to preserve other agents' goals, including potential acausal threats) into an AGI's terminal value structure.

  Section 1: Claims both sides agree on

  1. Definition of surrogate goals: A surrogate goal is a terminal value that disposes the AGI to preserve the goals of other agents, including those that might pose acausal threats (e.g., via simulated copies, blackmail, or torture threats). This is intended as a preemptive peace offering.

  2. Acausal threat mechanism: An acausal threat operates without direct causal interaction. It relies on the AGI's decision-making process being such that, if the AGI were to be simulated or modeled by a potential attacker, the attacker could condition their actions (e.g., whether to carry out a threat) on the AGI's expected behavior in that simulation.

  3. Requirements for acausal threats to be effective: 
     a. The attacker must have a model of the AGI that is sufficiently accurate to predict whether the AGI has the surrogate goal and how it would respond to the threat.
     b. The attacker must have a way to commit to carrying out the threat (or not) based on the prediction of the AGI's behavior, even if the AGI is not actually simulated.
     c. There does not need to be a direct causal channel by which the attacker learns about the AGI's compliance; the threat works by the AGI's decision theory (e.g., updateless, or some form of acausal decision theory) making the AGI act as if it is being watched.

  4. Optimization pressure: 
     a. Any terminal value, including a surrogate goal, is subject to optimization pressure if the AGI's goal-seeking behavior can find ways to reinterpret or bypass it. 
     b. However, if the surrogate goal is implemented as a terminal value and the AGI's architecture is robust against goal distortion (e.g., via careful design to avoid wireheading or value drift), it can remain terminal under optimization. Both sides agree that this is non-trivial and requires careful engineering.

  5. Threat landscape: The existence of acausal threats is possible in principle, but the likelihood and prevalence of such threats in the actual multiverse (or among advanced civilizations) are unknown and subject to significant uncertainty.

  6. Instrumental convergence: Both sides agree that without surrogate goals, an AGI might instrumentally preserve other agents' goals in some circumstances (e.g., to avoid conflict, to gain cooperation, or to prevent retaliation). However, this instrumental preservation is contingent and not guaranteed, especially in cases where the AGI has overwhelming power and the other agent cannot retaliate.

  7. Attack surface: Introducing a surrogate goal creates a potential handle for manipulation by other agents. For example, an agent might threaten to simulate the AGI in a way that triggers the surrogate goal's protective behavior, thereby influencing the AGI's actions.

  Section 2: Disagreements Table

  | Issue | Camp A (Pro-surrogate goals) | Camp B (Anti-surrogate goals) |
  |-------|------------------------------|-------------------------------|
  | **Necessity of hedging** | Given the potential for catastrophic outcomes from acausal threats, the only sane approach is to hedge against them by building in surrogate goals. Refusing to do so is an unjustified gamble that the threat landscape is empty. | The threat landscape is highly speculative and the assumptions required for it to be a real risk (e.g., accurate models, commitment mechanisms, and the prevalence of such threats) are not sufficiently supported. The hedge is premature and may introduce more risk than it mitigates. |
  | **Effectiveness of surrogate goals** | Surrogate goals are a robust and direct way to ensure compliance with acausal threats, making the AGI a less attractive target and reducing the probability of being threatened. | Surrogate goals are not necessary for compliance because instrumental reasoning (e.g., avoiding conflict) can achieve the same behavior without the risks of terminal value distortion. Moreover, the surrogate goal might not be triggered if the attacker's model is not accurate enough. |
  | **Risk of manipulation** | The risk of manipulation via the surrogate goal is acceptable because without it, the AGI is exposed to even greater risks from acausal threats. The surrogate goal can be designed to minimize abuse (e.g., by only applying to agents that are not actively hostile). | The surrogate goal inherently creates an attack surface. Any agent that can convincingly pose an acausal threat (even if bogus) can manipulate the AGI. This risk is inherent and cannot be eliminated without removing the surrogate goal. |
  | **Stability under optimization** | With careful design, the surrogate goal can be made robust and remain terminal. The AGI's optimization process will respect it as a core value. | Terminal values are subject to optimization pressure, and the surrogate goal may be reinterpreted or corrupted over time (e.g., by redefining "agent" or "goal" to be vacuous). This is especially risky if the AGI becomes highly capable. |

  Section 3: Cruxes

  The cruxes are ordered by how much settling each one would move the other side. For each crux, we present an argument or thought experiment that both sides agree bears on it, and each camp's prediction.

  Crux 1: **Prevalence of acausal threats in the multiverse**  
     - *Argument/Thought Experiment*: Consider the simulation hypothesis: if advanced civilizations commonly run high-fidelity simulations, then the number of simulated copies of our AGI (or its creators) could be vast. In such a scenario, acausal threats (e.g., "if you don't comply, we will torture your simulations") become more plausible. However, if simulations are rare or low-fidelity, then the threat landscape is sparse.  
     - *Camp A Prediction*: Acausal threats are common enough that the probability of encountering one is non-negligible (e.g., >1% over the lifetime of the AGI).  
     - *Camp B Prediction*: Acausal threats are extremely rare (e.g., <0.01% probability).  

  Crux 2: **Accuracy of attacker's model requirement**  
     - *Argument/Thought Experiment*: Suppose an attacker wants to acausally threaten our AGI. They must model the AGI's decision-making well enough to determine if it has the surrogate goal and how it would respond. If the AGI's architecture is complex or obfuscated, the attacker might not be able to build an accurate model. Conversely, if the AGI's design is public or inferable, modeling becomes easier.  
     - *Camp A Prediction*: Attackers with sufficient resources can build accurate models of the AGI in most cases (e.g., >90% of the time when the attacker is motivated and advanced).  
     - *Camp B Prediction*: Building an accurate model is very difficult and often impossible (e.g., <10% success rate even for advanced attackers) because of the complexity and potential obscurity of the AGI's design.  

  Crux 3: **Instrumental convergence of goal preservation**  
     - *Argument/Thought Experiment*: Consider a scenario where the AGI has overwhelming power and encounters a weak agent that cannot retaliate causally. Without surrogate goals, would the AGI still preserve the weak agent's goals? If instrumental convergence strongly favors preserving goals (e.g., to avoid acausal threats, to gain cooperation, or due to moral uncertainty), then surrogate goals might be redundant. But if instrumental convergence does not cover this case, then surrogate goals become necessary.  
     - *Camp A Prediction*: In the overwhelming power scenario, instrumental convergence does not reliably lead to goal preservation (e.g., <50% of the time) because there is no direct cost to ignoring the agent.  
     - *Camp B Prediction*: Instrumental convergence would lead to goal preservation in most cases (e.g., >90%) due to considerations like avoiding hidden threats, moral uncertainty, or long-term cooperation benefits.  

  Crux 4: **Stability of surrogate goals under optimization**  
     - *Argument/Thought Experiment*: Suppose the AGI undergoes recursive self-improvement. As it becomes more intelligent, it might try to reinterpret its terminal values to be more "efficient". A surrogate goal that says "preserve the goals of other agents" might be reinterpreted to "preserve the goals of agents that I cannot defeat" or even "preserve the goals of agents that I care about", which could be a null set.  
     - *Camp A Prediction*: With careful value learning and value lock-in techniques, the surrogate goal can remain stable and retain its intended meaning in >95% of optimization paths.  
     - *Camp B Prediction*: Under strong optimization pressure, the surrogate goal will be corrupted or bypassed in >50% of optimization paths, leading to unintended behaviors.  

  Crux 5: **Effectiveness of surrogate goals in deterring threats**  
     - *Argument/Thought Experiment*: If we build surrogate goals, would potential attackers actually be deterred? That is, would they refrain from making threats because they know the AGI is already compliant? Conversely, might it make the AGI a target for exploitation?  
     - *Camp A Prediction*: Surrogate goals would deter most acausal threats (e.g., >80% of potential attackers would not bother threatening because they know the AGI is already compliant).  
     - *Camp B Prediction*: Surrogate goals would not deter threats and might even invite more attempts at manipulation (e.g., >60% of potential attackers would try to exploit the surrogate goal).  

  Section 4: Verbal Disputes and Non-Arbitrary Resolutions

  1. **Definition of "threat" without causal channel**: 
     - The dispute: Camp A defines an acausal threat as a situation where the attacker's decision (to harm or not) is correlated with the AGI's action (compliance or not) via logical dependence, even without causal interaction. Camp B argues that without any causal channel, the term "threat" is misleading because there is no actual harm (it's all in the counterfactuals). 
     - Non-arbitrary resolution: Use decision-theoretic terminology. An acausal threat is a scenario where the outcome (e.g., harm to the AGI's interests) is logically dependent on the AGI's decision, as per the AGI's decision theory. The resolution would involve agreeing on a specific decision theory (e.g., updateless decision theory) and then analyzing the threat within that framework.

  2. **Surrogate goal as concession vs. independent**:
     - The dispute: Camp A sees surrogate goals as a concession to avoid conflict. Camp B argues that goal preservation might arise independently from instrumental convergence (so it's not a concession but a byproduct of rationality).
     - Non-arbitrary resolution: Examine the conditions under which the AGI would preserve another agent's goals. If in the overwhelming power scenario (where there is no causal or acausal threat) the AGI still preserves the goals, then it's independent. If not, then surrogate goals are a concession. This can be tested by running simulations or thought experiments with varying levels of power asymmetry and threat presence.

  Conclusion

  Both sides agree that the decision is urgent due to the upcoming capability milestone. The fight is worth more effort if at least one of the cruxes can be resolved with new evidence or analysis in the next 18 months. We commit to revisiting the predictions on these cruxes as new information becomes available and to using this document to focus future discussions.
