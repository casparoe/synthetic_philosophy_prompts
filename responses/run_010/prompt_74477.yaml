  ## Speech: For Jane, at the End of the Roast

  [Laughter as speaker approaches the podium, checks mic] Okay, deep breath. I have to confess, I stayed up far too late last night arguing about… well, about Jane. And coffee. And what it *means* to taste coffee like Jane tastes coffee. [Shakes head, smiles] Don’t worry, I won’t subject you to the philosophy lecture. Jane would walk right out, and frankly, she’d be right. [Glances affectionately at Jane] She’s always been ruthlessly practical about what matters. And what matters tonight is celebrating forty-one astonishing years. Forty-one years of turning beans into brilliance.

  Jane gave the organizers strict instructions: no talk of magic palates, no “gifted” nonsense, no “once-in-a-generation” sensory wizardry. Honestly, I think we all breathed a sigh of relief. Because trying to pin down some mythical “essence” of Jane’s talent? It always felt… inadequate. Like trying to describe a Beethoven symphony by talking about the shape of the violin. It misses the *work*, the sheer, sustained, magnificent *effort* of it.

  So, what do we celebrate? We celebrate **attention**. Not just noticing, but a kind of deep, relentless, four-decade-long *conversation* with coffee. Jane didn’t just taste; she *listened*. She learned the language of the bean – not just its loud declarations of chocolate or citrus, but its whispers, its faint echoes of earth or nut, the subtle shifts in acidity that tell a story of soil and sun and rain. And crucially, she remembered. She built, sip by sip, cup by cup, a vast, intricate internal library. Not just of flavours, but of *connections*. How a slight change in roast altered the balance. How a shift in processing echoed years later in the cup. How one coffee could speak to another across continents and harvests.

  This library wasn't inherited; it was **forged**. Through thousands of cuppings, side-by-side comparisons, meticulous note-taking, and the hard, sometimes frustrating, work of calibration. Calibration against the beans themselves, against her colleagues on the panel, against the evolving landscape of coffee. Jane’s genius – and yes, we *can* call it that, when it’s earned – lies in this incredible, layered **capacity**. The capacity to detect differences so fine most of us wouldn’t register them as noise. The capacity to hold a flavour profile stable in her mind, not just across hours, but across *years*, allowing her to spot drift – in the bean, or crucially, in her own perception. The capacity to learn, adjust, refine, and then learn again. It’s a dynamic skill, constantly tuned, never static.

  Which brings me to the story. The story that, for many of us here, cemented Jane’s reputation not just as a master taster, but as a master of integrity. For years, Jane stood firm: a beloved origin had changed. It tasted different. She reported it faithfully, cup after cup, panel after panel. And then… she concluded she was wrong. Not wrong that it *tasted different to her* – it absolutely did. But wrong about the *why*. With rigorous honesty, she unpicked it. She realized the coffee hadn’t fundamentally changed beneath her; *her own finely tuned standards, her own expectations born from decades of comparison*, had shifted. The target, for her, had moved.

  That moment wasn't a failure; it was the ultimate demonstration of her mastery. It showed the **depth of her commitment to the coffee itself**, beyond ego, beyond habit. It showed the courage to recalibrate her own incredible instrument – her cultivated discernment – against the external world, not just her internal sense. It proved that her judgments weren’t pronouncements from an ivory tower of taste, but living, breathing assessments rooted in an unflinching dialogue with reality. It was about getting it *right*, not about being right. That’s the Jane we honour. The Jane whose standards were so high, they included the humility to question even her own most deeply felt impressions.

  [Turning directly to Jane]
  Jane, what you built over forty-one years isn’t some mystical inner sense inaccessible to the rest of us. It’s something far more substantial, far more admirable, and frankly, far more useful. You built an **encyclopedia of discernment**. You honed a **precision instrument** through practice, memory, and relentless curiosity. You learned to navigate the complex world of flavour with a map you drew yourself, detail by painstaking detail. You didn’t just taste coffee; you learned to *read* it, to understand its history in its profile, to anticipate its potential. You taught generations of cuppers that expertise isn’t a birthright, it’s a practice. It’s showing up. It’s paying attention. It’s remembering. It’s having the guts to question your own palate when the evidence demands it.

  Your legacy isn't locked away in some private sensory vault. It’s in the consistent excellence of the coffee that left this company under your watch. It’s in the palates you trained, the standards you upheld, the sheer respect you commanded for the bean and the craft. It’s in the quiet confidence we all felt knowing that if Jane tasted it, it *was* so. Because her "taste" wasn’t whimsy; it was the culmination of decades of disciplined engagement with the world.

  So, we raise our glasses – hopefully filled with something excellent you helped select! – not to an oracle of qualia, but to the master artisan of attention. To the woman who proved, cup after cup, year after year, that understanding flavour is a magnificent, achievable feat of learning, memory, and unwavering dedication. To four decades of paying attention, beautifully, rigorously, and deliciously well. Thank you, Jane. Enjoy every sip of the well-earned rest.

  ---

  ## Afterword: For Your Eyes Only

  This draft walks the tightrope, prioritizing celebration of Jane's *achievement* (discrimination, calibration, memory, integrity) over metaphysical claims. However, it subtly presupposes your view in key places:

  1.  **"The coffee itself" / "External world":** Phrases like "commitment to the coffee itself," "dialogue with reality," "the evidence demands it," and implying her recalibration was aligning with an objective standard ("the target moved *for her*") quietly assume an external reality her discriminations track, bypassing the qualia realist's claim that *what it's like* is the fundamental reality, even if her *judgments* about its cause were mistaken. A realist might say the coffee *didn't* change, but the *quale* evoked by the same physical stimulus *did*, and her initial reports were accurate about *that* phenomenal shift. The speech frames her final conclusion as aligning with "reality," presupposing your ontology.
  2.  **Praising Discernment as the Achievement:** The core strategy – praising the capacity for discrimination, memory, and calibration *as the essence of her expertise* – implicitly rejects the idea that the "private show" is the source of value. However, if Jane stood up and said, "But the *reason* those discriminations matter, the *reason* I care about getting it right, is because of *how incredibly, uniquely vivid and specific that taste experience itself is for me, and I know exactly what I mean by 'how it tasted' even if I misattributed the cause*," the speech's framework struggles. It praises the functional outcomes but sidesteps the potential phenomenal motivation a realist attributes to her. It risks sounding like it's praising the machinery while ignoring the supposed raw experiential fuel.
  3.  **The Anecdote's Framing:** Presenting her withdrawal as the "ultimate demonstration of mastery" and "commitment to the coffee itself" leans heavily on *your* reading. A qualia realist could argue it equally demonstrates the *reality* of shifting qualia (the taste *did* change *for her* phenomenally) and her integrity was in correctly identifying the *source* of that phenomenal shift (her standards, not the bean). The speech frames it as a victory for objective discrimination over subjective feeling, which begs the question against the realist who sees subjective feeling as primary.

  **The Strongest Counter from the Speech's Architecture:**

  Your friend's most potent challenge, derived *precisely* from the praise you *do* offer, might be this:

  *"You lavish praise on Jane's integrity in the origin story, her willingness to overturn her own strong conviction about the taste changing because the evidence pointed to her standards shifting. But what *was* that 'strong conviction' based on? According to you, it was just a complex disposition to report 'it tastes different' based on shifted discriminations. Yet, Jane felt a deep, persistent certainty – a phenomenal conviction – that the taste itself had changed. She later concluded this conviction was misplaced regarding the bean's properties. However, doesn't this very conviction – this persistent, undeniable *seeming* of a changed taste experience, which felt so real and specific it drove years of reporting – point to the existence of the quale itself as the object of that conviction? You praise her for correctly interpreting the *cause* of her discriminations, but you dismiss the *content* of the experience (the 'what it was like' of the changed taste) that was the direct object of her conviction and the impetus for her reports. Isn't the sheer force and specificity of that felt conviction, even when misattributed, the very residue functional description leaves behind? You celebrate her navigating away from its misinterpretation, but doesn't its undeniable *presence* as the driving force undermine your claim that there's nothing more than dispositions and discriminations? Her certainty wasn't *about* her dispositions; it felt like it was *about the taste*. If there's no 'taste experience' apart from dispositions, what was she so persistently certain *of* before she realized her mistake?"*

  This leverages the *intensity* and *specificity* of Jane's own reported experience (which you must acknowledge happened, even if misattributed) as evidence for the quale being the *object* of her certainty, not merely a pattern of dispositions. It argues that the "what it was like" *is* the undeniable fact she was grappling with, even if she later reinterpreted its cause. This directly challenges the eliminative heart of your view using the very moment of integrity you rightly want to celebrate.
