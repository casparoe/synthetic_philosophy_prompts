  Okay, the user works on existential risk estimation and needs a rigorous specification for self-locating reasoning. They want desiderata—clear criteria any account must meet—not arguments. Their examples include the Doomsday Argument, reference class issues, and predictive feedback scenarios. 

  First, I need to structure this carefully. The user listed seven phenomena but wants additions if something's missing. Let me mentally walk through their cases: 

  Canonical case (birth rank): Must explain when/why prior choice affects the shift magnitude, not just assume it. The math should be transparent. 

  Reference class: Can't rely on fuzzy intuitions—needs objective grounding. Big red flag if an account lets you tweak classes to get desired outcomes. 

  Conservativeness: Non-negotiable. If there's no indexical uncertainty, fall back to standard Bayesian updates. No residual doubts when totals are certain. 

  Predictive feedback: This is subtle. If an agent's estimate directly causes the total (e.g., "if I say N=1e12, the program creates that many"), does the sampling assumption implode? The account mustn't prescribe credences the protocol falsifies. 

  Self-selected reference class: Early users of the argument aren't random samples. Must clarify when self-selection nullifies vs. attenuates the inference. 

  Infinite totals: Can't assume finitude. Should explicitly fail safe rather than give nonsense outputs. 

  Presumption: Critical! Must not confuse "this hypothesis makes my existence likely" with "my observations are typical under this hypothesis." The former isn't evidence; the latter might be. 

  ...Wait, did they miss observer-relative measures? Like if observers have different durations or cognitive capacities. But maybe that's covered under reference class. 

  Now, sorting: 

  Non-negotiables: Conservativeness (violating Bayesianism breaks everything) and Presumption (equivocation here invalidates inferences). 

  Predictive feedback might be the killer—many accounts won't handle the causality loop. Also, infinite totals trip up frequentist-style sampling approaches. 

  The biggest filter? Probably Presumption. It rules out any account where "more observers → higher prior" directly boosts the hypothesis, or where likelihoods get conflated with typicality. 

  For family 1 (large prior on many-observer worlds): Struggles with Presumption (it's circular) and Predictive feedback (if N is set by the agent, why privilege many-observer worlds?). 

  Family 2 (rank as random sample): Fails Predictive feedback (sampling breaks when N depends on the estimate) and may force arbitrary reference classes. 

  ...The user will hate this, but the minimal unsatisfiable set is likely: Canonical shift + Reference class objectivity + Predictive feedback. You can't have all three—if N is causally tied to the estimate, the "random sample" logic self-destructs. Best to abandon strict random sampling for observer-relative cases. 

  Final note: User wants this actionable for risk reports. So emphasize where choices remain—e.g., "If you insist on random sampling, you must reject that N can be set by estimates." No waffling. 

  Right, drafting now. British English: "prioritise", "grounding", "maths". Check.
answer: |-
  Below is a specification of desiderata for any account of self-locating evidence, structured as requested. Requirements are derived from your cases, with additions where gaps were identified. Each desideratum is motivated by a specific problem and labelled for negotiability. The sorting follows.

  ---

  ### **Desiderata for Accounts of Self-Locating Evidence**

  1. **Prior-Sensitive Shift (Canonical Case)**  
     *Requirement*: Must explain when/how birth rank shifts posteriors over total observers, with magnitude explicitly determined by the prior’s *structure* (e.g., sensitivity to scale), not ad hoc choice.  
     *Motivation*: In Doomsday-like cases, shifts are negligible under scale-invariant priors (e.g., \( P(N) \propto 1/N \)) but dramatic under narrow priors (e.g., \( N \sim \text{Uniform}[1, 10^{12}] \)). Accounts must derive shift size from prior properties, not treat it as arbitrary.  
     *Status*: **Non-negotiable**. Failure implies the account cannot distinguish evidence from prior artefact.

  2. **Reference Class Non-Arbitrariness**  
     *Requirement*: Must provide objective criteria for selecting the reference class (e.g., observers sharing indexically identical evidence). "Similarity" intuitions or opportunistic adjustments (e.g., expanding class to dilute doomsday conclusions) are invalid.  
     *Motivation*: Without constraints, agents can "gerrymander" classes (e.g., defining "observers" as only those born in the 21st century) to force desired posteriors.  
     *Status*: **Negotiable** in implementation (e.g., objective criteria may vary), but **non-negotiable** in requiring *some* non-arbitrary grounding.

  3. **Conservativeness**  
     *Requirement*: Reduces to standard Bayesian conditionalisation when no indexical uncertainty exists. If the total \( N \) is known with certainty, self-locating evidence must not alter beliefs about \( N \).  
     *Motivation*: An agent who knows \( N = 10^{12} \) gains zero information from learning their birth rank. Violating this would manufacture doubt from no evidence.  
     *Status*: **Non-negotiable**. Failure contradicts core probability theory.

  4. **Predictive Feedback Robustness**  
     *Requirement*: Must not prescribe credences that are *causally self-falsifying* when the estimate influences the total. Must explicitly model whether the agent’s causal role is part of their evidence and whether sampling assumptions hold under feedback.  
     *Motivation*: In the protocol where stating an estimate \( \hat{N} \) causes \( N = \hat{N} \), naively applying "rank \( r \implies N \approx r \)" leads to contradiction: if the agent believes \( N \approx r \), states \( \hat{N} = r \), and \( N \) becomes \( r \), the belief is "true" but only because the sampling assumption ("I am a random sample") was invalidated by feedback.  
     *Status*: **Non-negotiable** for coherence. Failure allows self-undermining beliefs.

  5. **Self-Selection Transparency**  
     *Requirement*: Must specify conditions under which self-selection (e.g., being among the first to consider the argument) nullifies or rescales inferences. Requires formalising how selection biases interact with sampling probabilities.  
     *Motivation*: Early arguers are a non-random subset (e.g., only early observers exist when the argument is first run). If selection correlates with rank, ignoring this inflates doomsday probabilities spuriously.  
     *Status*: **Negotiable** in method (rescaling vs. nullification), but **non-negotiable** in requiring explicit treatment.

  6. **Finiteness Agnosticism**  
     *Requirement*: Must not assume finite \( N \) implicitly. Should return undefined posteriors or alternative outputs (e.g., expectations over observer measures) when \( N = \infty \) or is ill-defined.  
     *Motivation*: In infinite cosmologies, unnormalisable priors make rank-based likelihoods undefined (e.g., \( P(\text{rank} = r \mid N = \infty) = 0 \)). Accounts must flag this rather than default to finite \( N \).  
     *Status*: **Non-negotiable**. Covert finiteness assumptions invalidate applications to cosmology.

  7. **Presumption-Typicality Distinction**  
     *Requirement*: Must not treat "hypothesis \( H \) makes my existence likely" as evidence for \( H \). Only *typicality* (my observations are unsurprising under \( H \)) can be evidential.  
     *Motivation*: Hypotheses positing more observers often imply higher probability of your existence (e.g., \( P(\text{I exist} \mid N = 10^{20}) > P(\text{I exist} \mid N = 10^{10}) \)), but this is not evidence for large \( N \)—it reflects prior weighting. Collapsing this conflates likelihoods with prior probabilities.  
     *Status*: **Non-negotiable**. Failure permits bootstrapping arbitrary hypotheses.

  ---

  ### **Sorting and Conflicts**
  - **Non-negotiable Desiderata**: 1 (Prior-Sensitive Shift), 3 (Conservativeness), 4 (Predictive Feedback), 6 (Finiteness Agnosticism), 7 (Presumption-Typicality).  
    *Rationale*: These ensure coherence with probability theory, prevent self-contradiction, and block fallacies.  
  - **Negotiable Desiderata**: 2 (Reference Class), 5 (Self-Selection).  
    *Rationale*: These admit competing solutions (e.g., universal vs. egocentric classes) without incoherence.  

  - **Minimal Unsatisfiable Subset**: {1, 2, 4}.  
    *Conflict*: Predictive feedback (4) breaks the "random sampling" assumption used in canonical shift (1), while reference class objectivity (2) blocks ad hoc fixes.  
    *Resolution*: Abandon **desideratum 1 as stated** (strict birth-rank likelihoods). Shift magnitude must depend on causal structure (e.g., feedback-aware likelihoods).  

  - **Highest-Leverage Requirement**: **7 (Presumption-Typicality)**.  
    *Why*: Eliminates "self-indication" approaches (e.g., SIA) that treat observer count as prior evidence, and exposes conflation in many anthropic proposals.  

  ---

  ### **Assessment of Major Families**
  - **Family 1: Larger Observer Count as Raising Prior Probability** (e.g., Self-Indication Assumption, SIA)  
    Fails desiderata 6 (assumes finiteness via normalisation) and 7 (confuses presumption for evidence). Struggles with 4 (feedback makes priors dynamic) and 1 (shifts are prior-driven, not evidence-driven). Incoherent under scrutiny.  

  - **Family 2: Rank as Random Sample** (e.g., Doomsday Argument, "Copernican" sampling)  
    Fails 4 (sampling breaks under feedback), 6 (undefined for infinite \( N \)), and 5 (ignores self-selection bias). Meets 1 and 3 only in simple cases. Intact under finite, non-feedback scenarios but fragile elsewhere.  

  ---

  ### **Conclusion**  
  Adequate accounts must satisfy all non-negotiable desiderata, resolving conflicts via causal modelling (e.g., for feedback) and explicit typicality. Neither major family succeeds fully, but desiderata 4 and 7 force a reconception of self-locating evidence as *model-relative typicality* without sampling or presumption. The critical insight: self-locating data only constrains hypotheses when it is *diagnostic of unobserved parameters under causal structure*. Anything less invites artefact.
