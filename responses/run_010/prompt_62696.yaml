  Hmm, the user wants me to analyze the 2007 Northern Rock bank run as an information cascade. They've provided detailed facts about what happened: Northern Rock relied heavily on short-term wholesale funding that dried up when the interbank market froze. After seeking emergency liquidity from the Bank of England on September 13th, the BBC reported this, leading to queues of depositors the next morning. Despite reassurances from authorities that the bank was solvent, people withdrew about £2bn over a few days until the Chancellor guaranteed all deposits on September 17th.

  I need to map this to an information cascade model. In this framework, depositors are making decisions sequentially. Each person observes some private signals (their own financial knowledge, news) and public actions (like seeing queues). The action set is binary: run (withdraw) or wait. A cascade tips when people start ignoring their private signals and follow the crowd.

  Now, evaluating rival explanations: Bayesian herding suggests people infer insolvency from others' actions. But the official reassurances about solvency didn't stop the run, which undermines this. Diamond-Dybvig coordination panic fits better - people run expecting others to, and being first matters. The deposit guarantee stopped the run by changing payoffs, not information, which supports this. Reputational herding doesn't seem applicable here.

  The user's hunch is key: payoff changes stopped the run, not new information. This aligns with coordination panic models. The BBC broadcast acted as a public signal that everyone knew others saw, which fits global games where public signals coordinate expectations.

  The anomaly is small depositors queueing despite having little at stake due to deposit insurance covering most losses. This isn't necessarily against cascades; they might have feared delays or insurance failure. But it points to limitations: cascade models don't account for payoff interactions or media's role in synchronizing actions.

  The core limitation is that cascade models assume actions don't affect payoffs directly, but here, withdrawals actually stressed the bank. Also, media isn't typically modeled but was crucial in creating a simultaneous cascade.
answer: |-
  **Bottom line: The Northern Rock run was not primarily an information cascade but a Diamond-Dybvig coordination panic triggered by a highly public signal (the BBC broadcast), where the deposit guarantee stopped the run by altering payoffs, not beliefs.**

  ### Mapping to Information Cascade
  *   **Actors:** Depositors making sequential withdrawal decisions (observed via queues/media).
  *   **Private signals:** Individual depositor knowledge (e.g., understanding NR's funding model, trust in officials, personal financial resilience). Weak for most retail depositors.
  *   **Observations:** Public actions – seeing queues on TV/news (14 Sept onwards), hearing about others withdrawing.
  *   **Action set:** {Run (withdraw), Wait (leave deposit)}.
  *   **Cascade tipping point:** If depositors after 14 Sept started ignoring their private signals (e.g., believing officials' solvency assurances) and ran solely because they saw others running, inferring insolvency from the queues.

  ### Evaluating Rival Explanations
  1.  **Bayesian Herding (Inferring Insolvency):**
      *   *For:* Early withdrawals could signal private negative information to later depositors, making queues grow.
      *   *Against:* Persistent official solvency assurances (public signals) *should* have outweighed herd signals if depositors were primarily Bayesian updaters. The run continued for days despite these strong, repeated counter-signals. The guarantee stopped the run instantly without providing new solvency information – it changed the *payoff* for running vs. waiting. This strongly undermines the pure information story.

  2.  **Diamond-Dybvig Coordination Panic:**
      *   *For:* The BBC broadcast (13 Sept eve) acted as a massive, synchronous public signal of *liquidity distress* (needing BoE help). This crystallized a *fear that others would run*, creating a self-fulfilling panic. Running early mattered (avoiding queues/lock-ins later). The guarantee directly altered the payoff structure: waiting became dominant regardless of others' actions, instantly halting the run. The irrelevance of solvency assurances fits – panic is about liquidity, not inherent insolvency.

  3.  **Reputational Herding:**
      *   *Against:* This typically involves professionals copying peers to protect reputation (e.g., fund managers). Retail depositors in queues weren't concerned with reputational damage from running; they feared losing money or access.

  **User's Hunch & Public Signals:** Your hunch is correct. The failure of solvency assurances (information) vs. the success of the guarantee (payoff change) decisively favors Diamond-Dybvig over Bayesian herding. The BBC broadcast perfectly fits the "public signal" in global games/coordination models. Its universal awareness meant everyone knew it would coordinate *expectations* of a run, making the run itself the focal equilibrium. This explains the near-instantaneous, nationwide panic response better than a slow-building cascade relying on sequential observation of actions.

  ### The Anomaly: Small Depositors Queueing
  *   This is **not necessarily a problem** for the coordination panic story and is **consistent with** a cascade interpretation.
  *   *Cascade/Herding:* They might infer from queues that insolvency is highly probable, overriding their knowledge of deposit insurance coverage. Or, they infer others know something they don't.
  *   *Coordination Panic:* The key fear isn't just ultimate insolvency. The BBC story signaled *immediate liquidity problems*. Queues confirmed this. Small depositors rationally feared:
      1.  **Payout Delays:** Even if solvent *eventually*, getting their money back could take weeks/months during resolution, causing personal hardship (bills, rent).
      2.  **Insurance Uncertainty:** Was the FSCS robust enough? Would it pay quickly? The unprecedented nature bred distrust.
      3.  **Sequential Service Constraint:** Being late in the queue might mean physical unavailability of cash *now*.
  *   The action (queuing) signals the expectation of *liquidity failure and payout delays*, not necessarily fundamental insolvency. The guarantee addressed *these* fears directly (immediate access assured).

  ### What the Cascade Framework Can't Express
  The standard information cascade model is poorly suited for Northern Rock because:
  1.  **Payoff Interdependence (Strategic Complementarity):** The payoff for *my* action (run/wait) *directly depends* on *others'* actions via the bank's liquidity constraint. This core dynamic of bank runs (Diamond-Dybvig) is absent in basic cascade models where actions merely signal information, not cause the event.
  2.  **The Media's Role:** Cascade models focus on individuals observing the *actions* of predecessors. Here, the **synchronous, massive public signal (BBC broadcast)** instantly coordinated beliefs and expectations for *all* depositors simultaneously, bypassing sequential observation. Media isn't part of the basic cascade structure.
  3.  **Distinguishing Liquidity Panic vs. Solvency Crisis:** The framework struggles to separate a run driven purely by coordination failure (liquidity) from one driven by revealed fundamental weakness (solvency). Northern Rock exhibited both, but the panic phase and its halt by the guarantee highlight the dominance of coordination failure.
  4.  **Role of Authorities & Guarantees:** The model has no mechanism for a third party (Chancellor) to instantly change the strategic game's payoff matrix for all players.
