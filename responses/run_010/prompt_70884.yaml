prompt: |-
  I am a second-year philosophy graduate student, and my qualifying paper is on the quarrel between Hobbes and the Oxford mathematicians in the 1650s and 1660s: Hobbes's De Corpore and its mathematical sections, Wallis's Elenchus geometriae Hobbianae, Hobbes's Six Lessons to the Professors of Mathematics, and Wallis's reply. My supervisor has warned me twice against writing Whig history in which Wallis wins because calculus subsequently worked, and a historian in my seminar has accused me of anachronistically reading constructive scruples back into a dispute that was really about Hobbes's vanity and his terror of anything smacking of scholastic infinity. Partly to answer both of them, and partly because I could not stop noticing it, I have spent the last month keeping a notebook of my own verdicts about which demonstrations I actually accept, in the hope of extracting from them a standard I can state without any historical apparatus. The results are embarrassing. Euclid's very first proposition, the construction of the equilateral triangle, I accept without qualification, and I think the construction is doing the justificatory work rather than merely exhibiting the result. The familiar nonconstructive argument that there are irrational numbers a and b with a to the power b rational, via considering the root-two-to-the-root-two case, I accept as a proof, though I register a residue of dissatisfaction: I have been told that such a pair exists without learning which pair it is. Wallis's characteristic procedure in the Arithmetica Infinitorum, tabulating the ratio of the sum of the first n natural numbers to n squared for n equal to one, two, three, and onward, watching the values crowd toward one half, and then pronouncing the value for the infinite case to be exactly one half, I do not accept as a proof at all; I would call it a conjecture wearing the clothes of a demonstration. Yet the epsilon-and-delta definition of a limit, and everything proved from it, I accept completely, despite its quantifying over infinitely many positive quantities; and I accept Cantor's diagonal argument with no unease whatsoever, even though it concerns an uncountable totality that on Hobbes's view of the infinite ought to be unintelligible to me.

  Here is where it gets uncomfortable. The computer-assisted proof of the four-color theorem I accept as establishing the theorem, but if you ask whether I have followed a proof I say no, and I describe my position as reasonable trust in testimony rather than knowledge by demonstration, which makes me feel like a fraud who is grading his own exam leniently. Nonstandard analysis, with its infinitesimals and its transfer principle, I accept as rigorous, although I reject the seventeenth-century infinitesimal reasoning that looks to me structurally similar; I cannot say what the difference consists in beyond a vague appeal to the fact that one of them comes with precise rules for when the reasoning is licensed. The picture of two stacked triangles that establishes the closed form for the sum of the first n natural numbers I accept as carrying the proof rather than merely suggesting it. But the picture of two curves that must cross, offered as a proof of the intermediate value theorem, I reject, because I think the eye is being asked to supply a completeness principle about the continuum that the drawing does not contain. And a conjecture in number theory confirmed by machine out to some astronomical bound I treat as barely supported at all; indeed large-scale verification makes me slightly less confident, since I keep thinking of the Mertens conjecture, checked to enormous ranges and eventually refuted.

  My tentative principle is this: a demonstration gives me knowledge only where I could in principle retrace it myself, step by step, and only where those steps terminate in objects I have constructed or can survey. That principle is already in trouble, and I want you to tell me how badly. It seems to mispredict the computer-assisted case, which is a finite enumeration I could in principle retrace and in practice cannot; it seems to mispredict the epsilon-delta and diagonal cases, where I survey an infinite domain by grasping a single rule rather than by any stepwise retracing; and it seems to leave the Wallis case unexplained, since his table is a retraceable finite procedure with exactly one bad step at the end, and I would like the principle to locate the badness in that step rather than in the procedure. So please do the following. First, give me the principle, or if a single one cannot be had, a small set of candidate principles stated precisely enough to be applied mechanically, and for each clause tell me which of the cases above forced it in. Second, tell me what your principle says about cases I have not listed: a consistency proof for arithmetic that proceeds by transfinite induction up to the first epsilon number; a theorem of ordinary analysis whose only known proof essentially invokes large cardinal axioms; an argument establishing that some property holds with probability one; and a proof whose validity depends on the consistency of the very system in which it is carried out. Third, be honest about which of my verdicts your principle cannot accommodate, and what it would cost to save all of them, since I suspect that accommodating everything requires clauses so baroque that the resulting standard is no standard at all. Fourth, and this is what the paper turns on, tell me whether the principle that survives is Hobbes's, Wallis's, or neither: was their fight genuinely about what counts as a demonstration, or about something else, such as whether mathematics is knowledge of causes and constructions or a disciplined technique for manipulating marks we have ourselves appointed, and was Hobbes's conviction that infinite quantities were the thin end of a scholastic wedge a philosophical insight or a reflex of his politics?
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a second-year philosophy grad student working on Hobbes vs. the Oxford mathematicians, specifically the debates around mathematical demonstrations in the 1650s-60s. Their supervisor warned against Whig history, and a seminar historian accused them of anachronism regarding constructive scruples. The user then lists their own verdicts on various mathematical proofs to find a consistent standard, but finds contradictions in their judgments.

  First, I need to understand their core struggle: they want an epistemological principle that explains their mixed reactions to proofs (Euclid good, Wallis bad, epsilon-delta good, etc.), but their tentative principle (retraceable steps + surveyable constructions) fails to cover cases like computer proofs or Cantor's diagonal argument. Their deeper aim seems to be resolving whether Hobbes/Wallis were truly debating demonstration standards or if it was about vanity/scholasticism—and whether their own principle aligns with either side.

  Breaking down their examples: 
  - Euclid I.1 (constructive) and sum-of-naturals visual proof are accepted. 
  - Nonconstructive irrational exponent proof accepted but with dissatisfaction. 
  - Wallis's infinitesimals rejected as non-proof. 
  - Epsilon-delta and Cantor accepted despite infinity. 
  - Computer proofs accepted as testimony, not demonstration. 
  - Nonstandard analysis rigorous vs. 17th-century infinitesimals not. 
  - Visual IVT proof rejected for hiding completeness.

  Their embarrassment comes from inconsistent intuitions. For instance, why accept Cantor's uncountable infinity but reject Wallis's infinitarian reasoning? The user suspects their principle needs "baroque" clauses to fit everything, which might defeat the purpose of a standard.

  Now, the user's four requests:
  1. **Precise principle(s)** explaining their verdicts.
  2. Application to new cases (transfinite induction, large cardinals, probabilistic arguments, relative consistency proofs).
  3. Honesty about which verdicts the principle can't accommodate and the cost of forcing it.
  4. **Historical resolution**: whether their surviving principle is Hobbes's, Wallis's, or neither—and what the fight was *really* about.

  For part 1, I consider multiple candidate principles since no single one fits all. Key angles: 
  - **Surveyability**: Emphasizing cognitive grasp (explains Euclid, rejects computer proofs as non-retraceable). 
  - **Rule-Groundedness**: Prioritizing explicit inference rules (explains why nonstandard analysis is rigorous vs. 17th-century infinitesimals). 
  - **Domain Management**: Distinguishing between "surveyable" infinite structures (via rules) and unsurmountable ones (rejects Wallis's table extrapolation). 

  These handle most cases but struggle with the computer proof (finite but impractical) and probabilistic arguments (accepted despite non-constructivity). A hybrid principle might work but risks complexity.

  For part 2 (new cases):
  - **Transfinite induction**: Rejected under surveyability (can't mentally traverse ε₀), but rule-groundedness might accept it as formal.
  - **Large cardinal theorems**: Rejected if domain management requires "surveyable" axioms; otherwise, accepted as formal.
  - **Probability one arguments**: Rejected by surveyability/construction (no witness), but probabilistic practice accepts them—clash here.
  - **Relative consistency proofs**: Accepted only if domain management treats consistency as a rule, but self-referential cases (proving consistency within the system) fail.

  For part 3, the hardest fits are:
  - **Computer proofs**: The principle must bend to allow "in principle" retraceability despite practical impossibility. This feels like cheating but is common in math.
  - **Probabilistic arguments**: If the user accepts them, the principle needs a clause for "structural inevitability" (e.g., measure theory), which may feel ad hoc.
  - **Wallis's table**: The rejection is salvaged by emphasizing that the "infinite leap" lacks a rule, but the user's dissatisfaction runs deeper—they want to pinpoint the *step* as bad, not the method.

  Saving all verdicts would require a disjunctive principle (e.g., "surveyable OR rule-grounded OR..."), which becomes unprincipled. Alternatively, admit that standards are pluralistic—but that might undermine the user's goal of a clean historical resolution.

  For part 4 (historical analysis):
  - **Hobbes** would reject Cantor, epsilon-delta, and computer proofs (all involve unsurveyable infinities or non-constructions). The user accepts them, so not Hobbes.
  - **Wallis** would embrace infinitarian methods (like his table extrapolation), which the user rejects. So not Wallis.
  - Thus, **neither**. The real fight was likely about:
    - **Ontology**: Is math about constructed objects (Hobbes) or discovered relations (Wallis)?
    - **Authority**: Who controls mathematical discourse—geometers or "symbol-tamers"?
    - **Scholastic fear**: Hobbes saw infinity as inviting theological chaos; Wallis saw it as a tool.
  The user's principle is modern: it accepts formal rigor (unlike Hobbes) but demands cognitive access (unlike Wallis's leaps). Their "bad step" in Wallis is the unregulated infinity jump—something Hobbes critiqued but for different (political) reasons.

  Final note: The user's discomfort with computer proofs ("fraud grading leniently") echoes Hobbes's anti-testimony stance, but they override it for socialized rigor. This tension between personal warrant and communal proof is key—maybe the paper's pivot is that *all* standards are partly political, as Hobbes sensed but misattributed.
answer: |-
  Based on your detailed self-observation and the historical context, here is a synthesized epistemological principle (or set of principles) that explains your verdicts, followed by analysis of new cases, limitations, and the Hobbes-Wallis conflict. Your unease stems from tensions between **constructive access**, **cognitive surveyability**, and **formal rigor**—a modern perspective neither Hobbes nor Wallis fully embraced.

  ---

  ### **I. The Proposed Principle(s)**
  Your core standard is **Rule-Grounded Surveyability**, which splits into three clauses:  
  1. **Rule-Groundedness**: A demonstration must invoke explicit, finitely stated rules of inference applied to well-defined objects.  
     - *Forces*: Nonstandard analysis (rigorous rules) vs. 17th-century infinitesimals (vague rules); computer proofs (rule-based but impractical).  
  2. **Domain Surveyability**: Objects/domains must be cognitively surveyable via a finite recipe (e.g., construction algorithms, finitary rules for infinite sets).  
     - *Forces*: Euclid I.1 (surveyable construction) vs. Wallis (unsurveyable infinity leap); Cantor (rule for diagonalization) vs. visual IVT (no rule for completeness).  
  3. **Termination in Construction**: All steps must terminate in objects constructed by the agent or rules they fully command (rejecting "black boxes").  
     - *Forces*: Nonconstructive irrationals (dissatisfaction without witness) vs. stacked triangles (constructive sum).  

  **Hybrid Principle**:  
  *A demonstration confers knowledge iff:  
  (i) It is grounded in finitely stated, mechanically applicable rules;  
  (ii) All objects/domains are surveyable via a finite rule (even if infinite in extension);  
  (iii) I can reconstruct the objects/steps *in principle* (allowing idealization, but rejecting irreducible testimony or unsanctioned infinity-jumps).*  

  ---

  ### **II. Application to New Cases**  
  1. **Transfinite induction up to ε₀ (consistency proof for PA)**:  
     - **Verdict**: Rejected.  
     - *Why*: Fails (ii) and (iii). ε₀ is not surveyable by a finite rule; you cannot mentally traverse it stepwise. Accepting Cantor but rejecting this highlights your demand for *procedural surveyability* (diagonalization is a finite algorithm applied to any countable list, while transfinite induction requires embracing an unsurveyable ordinal).  

  2. **Theorem requiring large cardinal axioms**:  
     - **Verdict**: Rejected if axioms are "unsurveyable" (e.g., measurable cardinals).  
     - *Why*: Fails (ii). Large cardinals lack constructive access or algorithmic surveyability; they are posited axiomatically. If the axiom itself feels like a "black box," it violates your standard.  

  3. **Property holding with probability 1**:  
     - **Verdict**: Rejected (but probabilistic practice accepts it).  
     - *Why*: Fails (iii). Measure-theoretic proofs (e.g., "almost all reals are normal") quantify over unsurveyable sets without constructing witnesses. Your dissatisfaction with Wallis’s crowding ratios extends here: probability 1 ≠ constructive certainty.  

  4. **Proof dependent on system consistency (e.g., relative consistency proofs)**:  
     - **Verdict**: Rejected as circular.  
     - *Why*: Fails (i) and (iii). It assumes a consistency "black box" you cannot constructively verify. Like the computer proof, it relies on testimony (the system’s reliability) without full surveyability.  

  ---

  ### **III. What Your Principle Cannot Accommodate (and the Cost)**  
  - **Computer-assisted proofs (e.g., four-color theorem)**:  
    - *Conflict*: You accept it as knowledge but admit you haven’t "followed" it. The principle rejects it (fails iii: you *can’t* retrace it, even in principle, due to human cognitive limits).  
    - *Cost to save it*: Add a **social-epistemic clause** (e.g., "trust in peer-verified, rule-based processes"). But this risks admitting Wallis-style empiricism (e.g., "scientists accept limits, so why not infinite ratios?").  

  - **Wallis’s Arithmetica Infinitorum**:  
    - *Conflict*: Your principle locates the "bad step" (the infinity leap) but rejects the *entire procedure* as nonsurveyable. Yet you want to accept finite tables *per se*.  
    - *Cost to save your verdict*: Tighten (ii) to forbid *any* unregulated infinity (no "and then it converges" without a rule). This salvages your view but may indict later calculus intuitions.  

  - **Probabilistic Arguments**:  
    - *Conflict*: Mathematicians accept "almost all" proofs, but you reject them.  
    - *Cost to accept them*: Surrender (iii)’s demand for constructions/witnesses. This collapses into formalism, abandoning Hobbesian scruples.  

  **Result**: Saving *all* your verdicts requires a disjunctive, context-sensitive standard—e.g., "Surveyability OR peer-verified formal proof OR..."—which becomes "baroque" and unprincipled. Your instinct is correct: a unitary standard is impossible without sacrificing some intuitions.  

  ---

  ### **IV. Hobbes vs. Wallis: What Was the Fight Really About?**  
  **Your principle is neither Hobbes’s nor Wallis’s**. It is a modern synthesis that splits their differences:  
  - **Hobbes’s Core**: Mathematics must be grounded in causal constructions ("generation of magnitudes"). He rejected infinity, unmediated symbols, and non-constructive arguments as "insignificant speech" (Leviathan I.5).  
  - **Wallis’s Core**: Mathematics is a formal language of "species" (symbols) whose manipulation extends to the infinite; empirical patterns (like ratios) justify generalizations.  

  **The Quarrell’s True Nature**:  
  1. **Not primarily about demonstration standards** (though it was surface rhetoric). Hobbes demanded *constructions as causal explanations*; Wallis sought *effective symbolic techniques*. Your principle accepts both (e.g., Euclid I.1 satisfies Hobbes; Cantor satisfies Wallis) but imposes stricter constraints than either.  
  2. **Not (just) about vanity or scholasticism**: Hobbes’s terror of infinity *was* political (infinity ≈ uncontrollable sovereignty), but also epistemological: he saw unsanctioned infinity as a gateway to scholastic "absurdities." Wallis, a Puritan, embraced infinity as an expression of divine omnipotence—but this was secondary to his instrumentalist view of symbols.  
  3. **The Real Divide**: **Ontology vs. Utility**.  
     - Hobbes: Math is *knowledge of causes* (hence constructions are essential).  
     - Wallis: Math is a *tool for problem-solving* (hence symbolic efficiency > ontology).  

  **Your Principle’s Alignment**:  
  - You side with Hobbes *against Wallis* on constructivism (rejecting Wallis’s infinity leap).  
  - You side with Wallis *against Hobbes* on formalism (accepting Cantor/epsilon-delta via rules).  
  - Thus, your standard is a **post-19th-century synthesis**: it marries constructivist scruples (surveyability) to formal rigor (rules), transcending their 17th-century dichotomy. Hobbes lost historically not because he was "wrong," but because mathematics evolved toward Wallis’s symbolic flexibility—*then* retroactively justified it with rigor (e.g., Weierstrass).  

  **Conclusion for Your Paper**: The quarrel was fundamentally about **whether mathematics describes constructed realities or manipulates appointed symbols**. Hobbes’s "scholastic wedge" fear was prescient: unregulated infinity *did* produce paradoxes (e.g., set theory’s crises), later tamed by formal rules. Your principle shows that neither won cleanly: modern mathematics balances constructed surveyability and rule-governed formalism, a resolution neither could foresee.
