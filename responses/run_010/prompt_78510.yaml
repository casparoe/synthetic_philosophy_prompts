answer: |-
  Here is a decision protocol designed for your volunteers, grounded in idealized deliberation theory but hardened for clinical reality. It treats the "idealized patient" as a *reconstruction tool* rather than a discoverable truth, explicitly flags projection risks, and halts when identity erodes. Steps build sequentially; sufficient answers require *evidence*, not just assertion.

  ---

  ### **Protocol: Patient Values Reconstruction (PVR) Framework**
  **Time:** ~60 minutes. **Materials:** Pencil, worksheet (see structure below). **User:** Trained lay surrogate.  
  *Core Principle: Your task is not to decide what is best, but to reconstruct what the patient would decide if they could access better information, think clearly, and feel the consequences.*

  #### **I. Establish Baseline: The "Actual Patient" Anchor**  
  1. **"Is there a valid, applicable advance directive?"**  
     - *Sufficient answer:* Directive exists, is signed/witnessed, matches *current* medical condition.  
     - *Looks sufficient but isn't:* Vague language ("no suffering"), outdated (>5 yrs without update), condition not addressed.  
     - *Stop/Defer:* If invalid or inapplicable. *Hand off to committee/court.*  
     - *Judgment call:* Whether condition "matches." Flag: *This interprets words; bias risk high.*  

  2. **"What did the patient *say* about this specific scenario?"**  
     - Gather direct quotes from directives, witnessed conversations, letters.  
     - *Sufficient:* "I told my sister I'd never want a feeding tube if I had dementia."  
     - *Insufficient:* "He hated hospitals."  
     - *Stop:* If no evidence. *Hand off to physician/family for standard best interests.*  

  #### **II. Adjust the Knobs: Controlled Idealization**  
  *Use worksheet table below. Default settings are **bold**; departures require justification.*  

  | **Knob**              | **Default Setting**       | **Adjust If...**                          | **Justification Required For Departure**          |  
  |------------------------|---------------------------|------------------------------------------|--------------------------------------------------|  
  | **Information**        | **What patient knew**     | New prognosis/treatment exists           | "Patient valued staying current; this changes outcome likelihood" |  
  | **Critical Rationality** | **Patient's reasoning style** | Contradictions in their statements     | "Patient always resolved conflicts logically; this clarifies" |  
  | **Vivid Acquaintance** | **Patient's imagination** | Outcome is unimaginable (e.g., locked-in) | "Patient underestimated suffering/joy in similar past event" |  

  3. **For each knob, ask:**  
     - *"How far am I turning this? (Low/Med/High)"*  
     - *"What evidence lets me reconstruct this?"* (e.g., "Turn Vividness HIGH: He never understood disability until his brother had a stroke.")  
     - *Sufficient answer:* Specific patient history justifying adjustment.  
     - *Insufficient:* "I think everyone would want this."  
     - *Judgment call:* All adjustments. Flag: *This is where your values may intrude.*  

  #### **III. Run Reconstruction: "What Would Patient Decide?"**  
  4. **Apply the knobs to the evidence:**  
     - *"If the patient knew ____ (Info adjustment), thought through ____ (Rationality adjustment), and felt ____ (Vividness adjustment), what would they choose?"*  
     - *Sufficient answer:* "Based on her letter saying X + her habit of trusting doctors (Rationality HIGH) + her fear of choking (Vividness HIGH), she'd refuse feeding tube."  
     - *Insufficient:* "She’d want dignity."  
     - *Stop:* If no coherent output. *Hand off to committee.*  

  #### **IV. Apply Stopping Rule: The Identity Threshold**  
  5. **"Could the patient *recognize* this choice as their own?"**  
     - *Test:* Would the patient say "That sounds like me" (even if they’d disagree)? If not, you’ve invented a stranger.  
     - *Anchor to:* Patient’s core values, life-defining relationships, autobiographical narrative.  
     - *Sufficient answer:* "Yes: This aligns with his lifelong stubbornness."  
     - *Stop/Defer:* If "no" or unsure. *Hand off to family/committee.*  
     - *Judgment call:* Defining "core values." Flag: *This risks replacing patient with your ideal.*  

  #### **V. Documentation (Required for every step)**  
  For each answer, write:  
  - **What it rests on:** "His 2020 directive refusing vents for terminal illness."  
  - **What could change it:** "If he’d seen his granddaughter’s wedding."  
  - **What a dissenter must dispute:** "They’d need evidence he valued family over independence."  

  ---

  ### **What This Cannot Do**  
  1. **Eliminate projection:** Your values *will* influence knob adjustments.  
  2. **Resolve deep value conflicts:** Hands off when identity erodes.  
  3. **Predict outcomes:** Only reconstructs choices.  
  4. **Replace physicians:** Medical judgments excluded.  
  **Misfires when:**  
  - No evidence exists (invents a person).  
  - Surrogate ignores audit trails (hides bias).  
  - "Happiness" masks incapacity (e.g., advanced dementia).  

  ---

  ### **Application to Cases**  
  *(Worksheet excerpts; full audit trail abbreviated for space)*  

  **Case 1: ALS Patient**  
  - *I.1:* Directive valid but vague ("no reasonable prospect..."). *Adjust Info knob HIGH: Update prognosis (vent-dependent, no recovery).*  
  - *I.2:* Directive: "No life support." Current statement: "Glad to be alive." *Adjust Rationality MED: Resolve conflict using his past independence vs. new family joy.*  
  - *Vividness HIGH: He now knows locked-in life.*  
  - *Reconstruction:* "Knowing survival requires vent, tolerating dependence for granddaughter, he’d continue."  
  - *Stopping Rule:* Recognizable? *Yes: Values family, adapts pragmatically.*  
  - **Output: CONTINUE TREATMENT.**  
    *⚠️ Conflicts with your prior (favors directive). Procedure overrides because current experience updates "valued life."*  

  **Case 2: Dementia Patient**  
  - *I.1:* Directive clear: "No antibiotics if I don’t know anyone." Current condition matches.  
  - *Stopping Rule:* Would she recognize refusal? *Unlikely: Directive based on fear of being a "stranger," but she now has positive experiences (humming, no distress). Identity rupture.*  
  - *Stop. Hand off to committee.*  
  - **Output: DEFER. Committee must weigh directive vs. current well-being.**  
    *⚠️ Aligns with your suspicion of dementia contentment but halts—directive may no longer reflect a recognizable self.*  

  **Case 3: TBI Patient**  
  - *I.1:* No directive. *I.2:* Weak evidence: "Prizes independence" (roommate), "distrusts institutions" (sister).  
  - *Adjust Vividness HIGH: He can’t imagine dependency.*  
  - *Reconstruction:* "Fully informed of long rehab, distrusting hospital power, he’d refuse aggressive interventions."  
  - *Stopping Rule:* Recognizable? *Barely: Independence is core, but evidence thin.*  
  - **Output: REFUSE AGGRESSIVE CARE (e.g., surgery if risky).**  
    *⚠️ High projection risk—audit trail essential.*  

  ---

  ### **Philosophical Anchors**  
  - **Brandt/Railton** (ideal desires): Knobs operationalize "full information/vividness."  
  - **Parfit** (identity): Stopping rule asks if choice is "autobiographically continuous."  
  - **Jaworska** (dementia): Contentment ≠ capacity to value; justifies overruling directives if identity persists.  
  - **Williams** (projects): Core values = "categorical desires" defining identity.  

  This protocol makes tradeoffs explicit. It won’t prevent value imposition, but forces honesty about *where* and *why* it happens. The cases show it will sometimes defy directives and distrust contentment—not by theory fiat, but by taking lived experience seriously.
