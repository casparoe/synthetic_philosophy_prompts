prompt: |-
  I am drafting a seminar paper on whether there is anything to the idea that history runs in cycles, and before I commit myself to defending or attacking any particular scheme, I want to be clear about what such a scheme would have to deliver in order to count as a theory rather than a suggestive metaphor. The candidates I have in mind span a wide range: Polybius's rotating sequence of constitutions and its degenerative steps; Ibn Khaldun's account of how group solidarity carries a lineage into power and then thins out over roughly three generations; the twentieth-century morphological schemes that treat a culture as an organism-like whole passing through seasons over something like a millennium, and those that treat the civilization as the unit which encounters challenges and either responds or fails to; and, more recently, the quantitative literature on secular cycles and elite overproduction, which tries to make the pattern measurable and even forecastable. I should add that the standard I have in mind is a demanding one: I do not want a scheme that merely makes the past intelligible after the fact, but one that a planning body could act on in advance, since that is the only respect in which a cyclical theory would have an advantage over the linear or ratcheting picture of history, on which accumulated technical knowledge simply does not decay.

  Here are some of the things people have demanded of such theories, and I suspect strongly that some of these are genuine requirements while others are just the aesthetic preferences of one camp: predictive precision about the timing of phase transitions; an internal mechanism rather than a correlation across cases; units of analysis that can be identified independently of the periodization the theory itself proposes; compatibility with the fact that the agents in the story are people who could have acted otherwise; immunity to the charge of being true only in hindsight; scope conditions that explain why some societies show no cycle at all; and consistency with the observation that material capabilities do not appear to reset between one cycle and the next. Write the desiderata: exactly five requirements that any adequate cyclical theory of history must meet, drawn from this list or replacing parts of it where you judge that what is being demanded is not a requirement at all but a prejudice.

  Present the answer as a numbered list of exactly five items, one sentence or two each, with no introduction and no concluding paragraph. Each item should name the requirement, give the case or consideration that motivates it — an actual historical episode, a feature of the schemes above, or a methodological point, as appropriate — and mark it as non-negotiable or as a preference particular to one camp, saying which camp where relevant. If one of the five does more work than the others in excluding the schemes I listed, say so within that item; if any two of the five cannot be jointly satisfied, which I expect is the interesting possibility given that the mechanism is supposed to run through the beliefs and loyalties of agents who might come to hold the theory itself, flag the conflict inside the later of the two items rather than in a summary. I will do the scoring of Polybius, Ibn Khaldun, Spengler, Toynbee, and the cliodynamic models against your list myself, so please leave that out.
reasoning: |-
  Okay, let's tackle this user's query. They're drafting a seminar paper on cyclical theories of history and need to identify five essential requirements for such theories to be more than just metaphors. The user mentioned several historical models like Polybius, Ibn Khaldun, Spengler, Toynbee, and cliodynamics. 

  First, I need to parse their key concerns. They want a theory that's actionable in advance, not just explanatory post-hoc. The listed potential requirements include predictive precision, internal mechanisms, independently identifiable units, compatibility with human agency, immunity to hindsight bias, scope conditions, and accounting for non-resetting capabilities. 

  The user suspects some demands are genuine requirements while others are aesthetic preferences. They want exactly five items, each clearly labeled as non-negotiable or camp-specific. Also, note conflicts between requirements, especially regarding agency and self-awareness of the theory.

  Starting with non-negotiable requirements. Predictive precision seems tricky—cyclical theories often can't specify exact timing, so this might be a preference. Internal mechanisms are crucial; without them, it's just correlation. Units must be identifiable independently to avoid circularity. Human agency is non-negotiable; history isn't deterministic. Immunity to hindsight is essential for the theory to be testable. Scope conditions explain why some societies don't cycle, which is necessary. Material capabilities not resetting is important but might be covered by other points.

  Looking for conflicts. The biggest potential conflict is between having a deterministic mechanism and allowing for human agency. If agents can act otherwise, that might disrupt the cycle. Also, if the theory itself influences behavior (reflexivity), it could interfere with the cycle's operation. This needs to be flagged in the requirements.

  Now distilling to five items. Internal mechanism (non-negotiable), independently identifiable units (non-negotiable), compatibility with agency (non-negotiable, conflicts with mechanism), immunity to hindsight (non-negotiable), and scope conditions (non-negotiable). Predictive precision is a preference, as per cliodynamic aspirations. Material capabilities are addressed by the units and scope conditions.

  Ensure each item has a name, motivation, and classification. For example, the conflict between mechanism and agency should be noted in the agency requirement. Also, highlight which requirement does the most work—probably the internal mechanism, as it excludes many metaphor-like theories.

  Finally, check adherence to instructions: no intros/conclusions, five numbered items, no model scoring. Make sure each point is concise and directly addresses the user's demands, filtering out biases like overemphasis on prediction.
answer: |-
  Here are five requirements:

  1.  **Internal Mechanism (Non-negotiable):** The theory must specify a causal engine inherent to the system (e.g., institutional decay, elite competition, resource exhaustion) that generates the cycle endogenously, differentiating it from mere observed correlations across cases, such as the recurring phases in Polybius or Ibn Khaldun's *asabiyyah* thinning.
  2.  **Immunity to Hindsight Bias (Non-negotiable):** The theory must be falsifiable and generate non-trivial predictions about future phase transitions (e.g., the onset of decline or renewal) that can be tested prospectively, avoiding schemes that only offer compelling explanations *after* events unfold, a key weakness of many morphological theories.
  3.  **Independently Identifiable Units (Non-negotiable):** The units of analysis (e.g., state, civilization, elite group) must be definable and identifiable using criteria separate from the cyclical stages themselves, preventing circular reasoning, which is a risk in schemes like Spengler's where "cultures" are defined by their lifecycle.
  4.  **Compatibility with Agency (Non-negotiable):** The proposed mechanism must be consistent with the historical reality that human actors possess genuine choice and could have acted otherwise within their context; this fundamentally conflicts with deterministic readings of cyclical mechanisms and creates tension with requirement (1) if the mechanism implies rigid inevitability, especially if actors become aware of the theory itself.
  5.  **Scope Conditions (Non-negotiable):** The theory must explicitly define the boundaries (e.g., societal complexity, scale, environmental factors) under which the cycle operates and explain why it manifests clearly in some societies (e.g., dynastic China, Rome) but appears absent or disrupted in others (e.g., prolonged stability, rapid collapse without cyclical return), addressing a limitation in universalist applications of models like Toynbee's challenge-response.
