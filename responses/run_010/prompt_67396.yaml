prompt: |-
  I am assembling a comparative study of how monetary valuation is absorbed, resisted, and re-engineered in markets that people find repugnant. I would like to work past the familiar exchange between the market-design view of repugnance and the corruption view, and instead use a more mechanical idea drawn from economic sociology: that money does not arrive as a single homogeneous substance but in socially specified forms, and that whether a market in a contested good survives depends substantially on the form in which the price is paid.

  To fix the apparatus, three elements matter. First, earmarking: a transfer can be made in general-purpose cash or in a restricted vehicle — vouchers, tax credits, non-transferable permits, segregated accounts, in-kind provision — and the vehicle determines what the money can contaminate and who can convert it into something else. Second, the direction and register of the flow: an identical sum carries a different meaning as compensation, reimbursement, honorarium, incentive, penalty, or outright price, and practices often migrate between these registers over time without changing their economics. Third, the persistence of special-purpose monies: the documented historical separation of a household's money into the wage, the wife's allowance and pin money, the child's chore money, charitable money, and dirty money shows that a single currency is routinely fractured into morally distinct sub-currencies. Related evidence includes the monetization of children's death-benefit claims in the American life-insurance industry, the conditional and unconditional cash-transfer programs of recent decades, and the field results in which paying blood donors or paying parents for on-time pickup reduced the very behavior the payment was meant to produce.

  With that apparatus, please score each of the following on a scale from 0 to 100 for what I will call monetization durability. A score near 100 means the price form has become unremarkable and self-sustaining: the transaction is conducted at scale, without recurring public controversy, and without institutional backsliding. A score near 0 means the monetary form has been abandoned, prohibited, or persistently displaced by a non-monetary substitute in most places where it was tried, and remains politically radioactive.

  1. Cash payment to subjects for participation in a Phase I clinical trial.
  2. Compensated living kidney donation, including the one regulated national program that has operated for decades.
  3. Commercial surrogacy under written contract.
  4. Tradable permits priced per tonne of carbon dioxide.
  5. Individually transferable catch quotas in commercial fisheries.
  6. Cash transfers to poor households made conditional on school attendance and vaccination.
  7. Payments in cash or vouchers to drug-dependent patients for verified abstinence.
  8. Lump-sum payments to poor women for accepting long-acting contraception.
  9. Paid queue-jumping: commercial line-standing services and premium fast-pass pricing at theme parks.
  10. Paid plasma donation in jurisdictions where it is legal, running alongside voluntary unpaid whole-blood donation.
  11. Corporate naming rights over public stadiums and, in a handful of cases, over public schools.
  12. Performance bonuses for teachers tied to student standardized-test scores.
  13. Paying citizens a flat sum for turning out to vote, explicitly not for how they vote.
  14. Bounties paid per specimen for invasive species.

  The deliverable should contain the following, in order:

  (a) Before any scoring, state the three or four criteria you are actually applying, and say which of them you expect to do most of the work.

  (b) A score and tier for each item, with two or three sentences locating it. The explanation must name the feature of the monetary form — not of the underlying good — that determines its position, or else say explicitly that in this case no such feature is available and the good is doing all the work.

  (c) At least two pairs drawn from the list in which the intuitive ranking by moral repugnance and your ranking by monetization durability come apart. Explain what each divergence shows: whether the apparatus is capturing something the moral intuition misses, or whether the intuition is tracking a harm that the durability measure is simply blind to.

  (d) At least one case in which durability is attributable almost entirely to a design choice about the vehicle. Describe the counterfactual concretely: what happens to the practice, and to its politics, if the vehicle is switched from restricted to general-purpose cash or the reverse.

  (e) A second ranking of all fourteen items, this time by the degree to which you think a well-designed change in the monetary form could move the item at all, holding the underlying good fixed. Identify the items for which that number is essentially zero, and say what it is about those goods that makes the payment form irrelevant.

  (f) Finally, state what evidence would persuade you that your scale is measuring something other than the age of the practice. Age and durability are obviously confounded here: the oldest arrangements on the list are also the ones that have had the most time to become unremarkable, and I want to know how you would break that apart.
reasoning: |-
  Hmm, this user is assembling a comparative study on monetization in repugnant markets and wants me to apply an economic sociology framework. They've outlined three key elements: earmarking, flow direction/register, and persistence of special-purpose monies. The core task is scoring 14 items on "monetization durability" - how stably accepted the monetary form has become.

  The user clearly wants to move beyond simplistic market-design vs corruption debates. Their framework is sophisticated, drawing from Zelizer's work on social meaning of money. I need to be equally precise in applying it. The deliverable has six specific components requiring structured responses.

  For part (a), I'll define durability criteria based on their framework: institutionalization (how embedded in systems), controversy level, substitutability (if non-monetary alternatives displace it), and scalability. Institutionalization should bear the most weight since it directly reflects monetary form endurance.

  When scoring the 14 items in part (b), I'll need to carefully distinguish between resistance to the underlying good versus resistance to the monetary form itself. For example, compensated kidney donation faces objections to organ commodification rather than payment mechanics, while voting payments trigger concerns about monetary influence on democracy regardless of the act's inherent morality.

  For part (c), I can contrast carbon permits (high durability despite climate controversy) with voting payments (low durability despite neutral act) to show how monetary form matters independently of repugnance. Similarly, teacher bonuses (contested payment form) versus plasma donation (accepted payment form) reveal how earmarking mediates acceptance.

  Part (d) offers a chance to demonstrate earmarking's power. I'll use conditional cash transfers - show how switching to unconditional cash would change perceptions from "support" to "handout," altering political viability.

  In part (e), I'll rank reform potential. Some items like carbon permits are locked into their monetary forms, while others like surrogacy could benefit from vehicle redesign (e.g., using trust accounts instead of cash).

  Finally for part (f), I'll consider how to disentangle durability from age. Key evidence would include: new practices gaining quick acceptance (e.g., crypto transactions), old practices suddenly collapsing (like dowries), or cross-jurisdictional comparisons showing same-age systems with different durability.

  Throughout, I'll maintain focus on monetary mechanics - the "how" of payment rather than the "what" being traded. The user wants precisely this analytical separation.
answer: |-
  Here is the comparative analysis using your specified framework and deliverable structure:

  **(a) Monetization Durability Criteria**  
  1. **Institutionalization**: Depth of integration into formal systems (laws, accounting, routine operations).  
  2. **Controversy Recurrence**: Frequency/severity of public, legal, or ethical challenges to the *monetary form*.  
  3. **Substitutability**: Vulnerability to displacement by non-monetary alternatives (barter, in-kind, prohibitions).  
  4. **Scalability**: Ability to operate at volume without systemic friction.  
  *Institutionalization* will bear the heaviest weight, as it reflects structural resilience of the monetary form itself.

  **(b) Scoring & Tiering (0-100)**  
  **Tier 1: High Durability (80-100)**  
  5. **Tradable Fishing Quotas (95)**  
  *Institutionalization via government-managed ITQ systems; controversies focus on ecological impacts, not the quota-trading mechanism.*  
  4. **Carbon Permits (90)**  
  *Embedded in national/regional cap-and-trade systems; price volatility debated, but the *permit-as-vehicle* is stable.*  
  6. **Conditional Cash Transfers (85)**  
  *Earmarked vouchers/direct deposits for specific uses (school/vaccines) insulate from "cash handout" stigma.*  

  **Tier 2: Moderate Durability (50-79)**  
  10. **Paid Plasma (75)**  
  *Segregation from voluntary blood donation (different sites, processing) and "gift card" payments reduce contamination.*  
  3. **Commercial Surrogacy (70)**  
  *Escrow-managed payments + itemized contracts (medical/lifestyle) distinguish from "baby selling," but legal fragility persists.*  
  9. **Paid Queue-Jumping (65)**  
  *Rebranded as "concierge services" or "time-saving premiums"; friction arises when public queues (e.g., visas) are monetized.*  
  11. **Corporate Naming Rights (60)**  
  *Stadiums normalized as "sponsorship"; schools provoke backlash due to *in-kind-to-cash shift* in public goods.*  
  14. **Invasive Species Bounties (55)**  
  *Frame shifts between "civic duty" (honorarium) and "mercenary hunting" (price); depends on species charisma.*  

  **Tier 3: Low Durability (0-49)**  
  1. **Phase I Trial Payments (45)**  
  *Payment *register* matters: "compensation for time" accepted in Global North; "inducement" banned in India/EU vulnerable groups.*  
  2. **Compensated Kidney Donation (30)**  
  *Iran’s program survives via *non-cash* incentives (health insurance, govt gratitude medals); direct cash universally prohibited.*  
  7. **Abstinence Payments (25)**  
  *Vouchers restrict use (e.g., groceries), yet "paying addicts" triggers moral decay narratives; programs often defunded.*  
  12. **Teacher Test Bonuses (20)**  
  *Bonuses misalign with professional *register*; reversion to non-monetary recognition (promotions, grants) common.*  
  13. **Voting Payments (10)**  
  *Any payment direction (turnout vs. vote) violates "civic duty" register; universally illegal or symbolic (<$5).*  
  8. **Contraception Payments (5)**  
  *Lump sums interpreted as coercion; displaced by non-cash incentives (baby supplies, childcare) or free provision.*  

  **(c) Divergences: Moral Intuition vs. Durability**  
  - **Kidney Donation (Low Durability) vs. Plasma (Moderate)**  
    *Divergence*: Kidneys evoke stronger repugnance, but durability difference stems from *earmarking*: Plasma is "gift card" restricted to non-essentials; kidney compensation is seen as contaminating bodily integrity regardless of form.  
    *Apparatus Insight*: Earmarking contains commodification perception for plasma but fails for kidneys due to the good’s inalienability.  
  - **Teacher Bonuses (Low) vs. Naming Rights (Moderate)**  
    *Divergence*: Naming rights intuitively corrupt public goods more than teacher pay, yet bonuses are less durable.  
    *Apparatus Insight*: *Register mismatch*: Bonuses corrupt professional "vocation" norms; naming rights fit commercial "sponsorship" registers in entertainment (but not education).  

  **(d) Vehicle Design as Decisive Factor**  
  **Case**: Conditional Cash Transfers (CCTs)  
  - *Current Vehicle*: Restricted vouchers/direct transfers for school/vaccine costs → **Durability 85**  
  - *Counterfactual*: Switch to unconditional cash.  
    - *Effect*: Transfers reclassified as "welfare handouts," triggering debates on "laziness" and fraud. Political support erodes; programs scaled back (e.g., Brazil’s *Bolsa Família* critics demand work requirements).  
    - *Apparatus Insight*: Earmarking converts "payment" into "co-investment," avoiding contamination of recipient agency.  

  **(e) Reform Potential Ranking (High to Low Potential)**  
  1. Phase I Trial Payments (Register shift: "time compensation" → "scientific contribution honorarium")  
  2. Abstinence Payments (Vehicle shift: cash → non-transferable rehab credits)  
  3. Contraception Payments (Register shift: lump-sum → childcare service subsidies)  
  4. Voting Payments (Vehicle shift: cash → lottery-based non-cash rewards)  
  5. Teacher Bonuses (Register shift: test bonuses → school-wide performance grants)  
  6. Commercial Surrogacy (Vehicle shift: cash → trust-managed expense reimbursements)  
  7. Invasive Species Bounties (Register shift: bounty → tax credit)  
  8. Compensated Kidney Donation (Vehicle shift: cash → prioritized healthcare access)  
  9. Paid Queue-Jumping (Register shift: line-standing → "time brokerage" licensing)  
  10. Naming Rights (Vehicle shift: cash → infrastructure grants with discrete recognition)  
  11. Carbon Permits (Near Zero: Vehicle integral to market function)  
  12. Fishing Quotas (Near Zero: ITQ system inseparable from rights design)  
  13. Conditional Transfers (Near Zero: Earmarking is core to legitimacy)  
  14. Paid Plasma (Near Zero: Segregation already optimized)  

  **Near-Zero Reform Items**: Carbon permits, fishing quotas, CCTs, and plasma. For these, the payment form is *constitutive* of the market structure. Altering vehicles/registers would collapse the mechanism (e.g., unconditional cash for CCTs destroys conditionality; non-tradable permits kill carbon markets).  

  **(f) Disentangling Durability from Age**  
  To test if durability reflects institutional maturity rather than monetary design:  
  1. **Cross-Jurisdictional Comparison**: Identify practices of similar age but differing durability (e.g., paid plasma in US vs. Germany: US high durability via specialized clinics; Germany persistent controversy despite similar timeframes).  
  2. **Sudden Destabilization**: Cases where established monetary forms rapidly collapse due to *vehicle* flaws (e.g., teacher bonuses in NYC abandoned after 3 years despite decades of merit-pay debates).  
  3. **"Born Durable" Innovations**: New practices achieving quick normalization via clever design (e.g., India’s UPI digital vouchers for farm subsidies avoided cash corruption stigma within 5 years).  
  4. **Historical Regression**: Practices that *lost* durability after vehicle changes (e.g., WWII blood donation shifted from community credits to cash → backlash and non-profit takeover).  

  This approach isolates design effects by examining variation in trajectories controlling for age, using disruption events and comparative adoption speed as natural experiments.  

  ---  
  *The apparatus reveals that durability hinges on:  
  (1) Whether the payment vehicle/register aligns with existing moral "circuits" (e.g., plasma as "gift," permits as "compliance tool").  
  (2) Resistance spikes when money crosses registers (e.g., vocation→market) or contaminates sacred goods (organs, votes).  
  (3) Earmarking succeeds not by hiding payment, but by *ritualizing* its boundaries.*
