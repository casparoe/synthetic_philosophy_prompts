prompt: |-
  so I'm a junior and I'm one of the two student members on our district's technology advisory panel. Mostly it's boring, but in five weeks we vote on what to recommend to the school board about a tool the district wants to keep paying for. It's an early-warning thing: it takes 9th graders' attendance, credits earned, and a couple of 8th grade test scores and spits out a number for how likely each kid is to fall off-track — behind on credits by the end of 10th grade, basically on a slow path to not graduating. Counselors use the number to hand out the extra tutoring slots, and there are only like 120 slots district-wide, so it's really a ranked list and the top 120 kids get in.

  The mess is that there are three promises floating around and I'm pretty sure they can't all hold at the same time, but nobody on the panel will say that out loud. (1) The board told the community at the spring meeting that the tool would be "equally accurate for every group," and in the minutes that got written down as equal false positive rates and equal false negative rates across groups. (2) The superintendent said at the budget town hall that the tool doesn't use race at all, not even to set different cutoffs for different kids. (3) Last month a student group filed a complaint pointing out that among the kids who get flagged, the share who actually do end up falling off track is way lower in one group than in another, so getting flagged means something different depending on who you are, and they're calling that profiling dressed up as accuracy.

  The vendor's own numbers are what make my head hurt. They say the share of kids who actually fall off track is about 18 percent in one group and about 31 percent in another, and they say their score is calibrated for both, meaning if you take all the kids at a given score level, roughly the same fraction of them go off track no matter what group they're in. One board member's proposed fix is to set the cutoff for each group so that the number of flagged kids matches that group's share of enrollment, and the vendor wrote back that this would require race-aware thresholds, wich sounds like it just breaks promise (2) instead. Another member wants to solve it by asking for 300 more slots. Nobody has said what they'd give up.

  Can you draft the memo I'm going to hand in and read aloud? It has to actually land somewhere — renew, renew with conditions, or don't — and it has to tell the board which of the three promises to stop making and what to do instead, with a real timeline, since the vote is in five weeks and next fall's scores land in August. I also want it to be honest about the strongest case for the promise I'm telling them to drop, because half the panel is going to be annoyed no matter what and I don't want it to look like I ducked the hard part. And please be concrete about what a false positive and a false negative even mean here, because nobody is getting punished — a kid who gets flagged gets tutoring, and a kid who gets missed just doesn't get it. I keep having the feeling that this flips which error is the bad one compared to all the courtroom and hiring examples people bring up, but I can't articulate how, and I need the memo to do that work for me. Same question for the "flag everyone proportionally" fix: my gut says it sounds fair and is actually worse for somebody, and I want to know if my gut is right.

  Write the whole thing as straight continuous prose, like a letter or a long email — no headings, no bullet points, no bold, no tables. My advisor says anything with bullets gets skimmed and then nobody reads the reasoning. Put the recommendation in the first paragraph so people can't miss it, and keep it to about a page and a half since I have to read it out loud. Also don't send me off to go read studies or papers, I have zero time and no journal access — just explain whatever I need to know inside the memo itself.
reasoning: |-
  Okay, the user is a high school junior serving on a district technology advisory panel. They need to draft a memo for a crucial vote on an early-warning tool that predicts 9th graders' risk of falling off-track academically. The core tension revolves around three conflicting promises: equal error rates across groups (1), no use of race in the tool (2), and consistent predictive value across groups (3). Vendor data shows different base rates of academic risk (18% vs 31% across groups), creating statistical impossibilities when combined with the promises. 

  The user's deeper needs are multifaceted: they need a clear recommendation that resolves the mathematical impossibility while being politically viable, an explanation that makes statistical trade-offs accessible to non-experts, and ethical framing that addresses equity concerns without jargon. They're also subtly asking for validation of their intuition that proportionality fixes might backfire and that the tutoring context flips traditional error cost perceptions. 

  Professionally, I should prioritize clarity in explaining why the promises conflict mathematically (base rate differences + equal error rates = calibration imbalance), emphasize the no-punishment context to reframe error costs (false positives = free tutoring, false negatives = missed support), and reject proportional thresholds as mathematically incoherent with calibration. The recommendation must land in the first paragraph, avoid academic references, and maintain plain prose throughout.

  Emotionally, the user feels overwhelmed by adults avoiding hard truths, so the memo must model courageous clarity while acknowledging valid concerns behind each promise. The "strongest case" request shows maturity—they want to disarm critics by preemptively honoring opposing views. Time pressure (5 weeks) means every word must count.

  Structurally: lead with renewal + conditions, immediately name which promise to drop (equal error rates), explain why calibration matters most in a support context, propose new thresholds to maintain calibration without race data, and outline a 5-week timeline. Crucially, reframe false positives as "over-support" and false negatives as "missed opportunities" to align with the tool's purpose. The gut feeling about proportionality is correct—it would break calibration, making scores meaningless for some groups.
answer: |-
  **MEMORANDUM**  
  To: District Technology Advisory Panel  
  From: [Your Name], Student Member  
  Date: [Current Date]  
  Subject: Recommendation for Early-Warning Tool Renewal with Critical Adjustments  

  I recommend renewing the early-warning tool contract for one year, conditional on the district immediately revising how we use its risk scores to allocate tutoring slots. We must stop promising equal false positive and false negative rates across groups (Promise #1) because it is mathematically incompatible with the tool’s calibration and the real differences in academic risk among students. Instead, we should prioritize ensuring the tool’s predictions are equally *meaningful* for every student (addressing the student group’s complaint) while maintaining race-blind inputs (Promise #2). This requires setting a single, consistent risk-score cutoff district-wide and adding tutoring slots to mitigate unavoidable trade-offs.  

  ### The Core Conflict  
  First, let’s clarify terms. A **false positive** occurs when the tool flags a student as "at-risk," but they *do not* actually fall off-track by 10th grade. Here, that student receives tutoring they might not need—a supportive error. A **false negative** happens when the tool *misses* a student who *does* fall off-track. That student loses access to tutoring—a harmful error. Critically, **no one is punished for being flagged**; this is purely about allocating scarce support. Unlike hiring or justice systems, a false positive here is a safety net, not an accusation.  

  The vendor’s data shows a fundamental tension:  
  - Group A has 18% of students fall off-track; Group B has 31%.  
  - The tool is *calibrated*, meaning a score of "X" predicts the same risk (e.g., 70% chance of falling off-track) for students in *any* group. This is Promise #3’s demand: "flagged" should mean the same thing for everyone.  

  But calibration *cannot* coexist with equal false positive/negative rates when baseline risks differ. Equal false negatives would require identical sensitivity to risk across groups, but if Group B has higher true risk, the tool must flag more students to "catch" the same proportion of at-risk cases—skewing false positives. Equal false positives would force the tool to ignore real risk disparities, leaving more Group B students without help. **Promise #1 is statistically impossible** given the calibration we value.  

  ### Why Proportional Thresholds Fail  
  Some propose setting group-specific cutoffs so flagged students match each group’s enrollment share (e.g., 50% Group A, 50% Group B if enrollment is split). This *sounds* fair but violates calibration. If Group B’s true risk is higher, forcing equal flagging would:  
  - Lower the cutoff for Group A, flagging lower-risk students (inflating false positives).  
  - Raise the cutoff for Group B, missing higher-risk students (inflating false negatives).  
  Worse, it *uses race explicitly* (breaking Promise #2) and makes the score meaningless: a "high-risk" flag would indicate wildly different actual risks per group.  

  ### The Strongest Case for Equal Error Rates (and Why We Drop It)  
  Advocates for Promise #1 argue that unequal error rates feel discriminatory—if Group B has more false positives, more of their students might be mislabeled "at-risk." This concern is valid, but in our context, the cost is asymmetry: Group B students get *more support* (even if unneeded), while Group A’s false negatives mean *more missed support*. Equal errors would require either:  
  - Ignoring calibration (making the tool less reliable for all), or  
  - Artificially suppressing flags for Group B (denying help to students objectively more likely to need it).  
  Neither is acceptable. Our priority must be accurate targeting of tutoring.  

  ### Recommended Path Forward  
  1. **Renew the tool** but use a **single, district-wide risk-score cutoff** (e.g., 70% predicted risk) for allocating slots. This preserves race-blind inputs (Promise #2) and calibration (addressing Promise #3).  
  2. **Add tutoring slots immediately**. With 120 slots for ~31% at-risk students in Group B versus 18% in Group A, a single cutoff will inevitably flag fewer Group A students (lower risk pool) and more Group B students (higher risk pool). Adding slots (e.g., +150) ensures we cover more high-risk students without arbitrary caps.  
  3. **Publicly retire Promise #1**. State: "The tool’s predictions are equally reliable for all students, but baseline differences mean error rates will vary. We prioritize accurate risk prediction over equal errors."  

  ### Timeline  
  - **Next 2 weeks**: Vendor provides cutoff analysis for single threshold (e.g., score yielding top 150 high-risk students).  
  - **Week 3**: Panel votes on cutoff/slot expansion. Superintendent identifies funding (e.g., reallocating professional development budgets).  
  - **Week 4**: Draft revised guidelines for counselors.  
  - **Week 5**: Finalize recommendation to board.  
  - **August**: Apply new threshold when 9th grade scores arrive.  

  ### Why This Works  
  We keep the tool’s core strength—calibration—so "70% risk" means the same urgency for every child. We avoid race-based thresholds, focusing on need. Adding slots acknowledges reality: unequal risk requires unequal resources for justice. And we tell the truth: equal error rates were a well-intentioned but impossible promise. Our duty isn’t statistical symmetry—it’s ensuring every high-risk student has a fair shot at support.  

  ---  
  *This memo reflects my analysis as a student user of district tools. I urge us to choose accuracy, equity, and honesty over comforting contradictions.*
