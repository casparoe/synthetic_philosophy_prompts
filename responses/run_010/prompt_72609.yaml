prompt: |-
  I am two years into a novel whose structure will not survive its own premise unless I can defend it, and what I need from you is a working procedure, not a seminar.

  The book is one story told eleven times: eleven mutually exclusive versions of the same six years in the same provincial town, each entered through the same woman's point of view. In four branches her mother dies in the winter of 1946, before she ever meets her father, and she is raised by a different couple. In three branches, the man the town addresses by a certain name turns out, late in the book, not to be the man that name was first attached to. In two branches, the mineral the whole local economy is built on is shown to have a different composition from what the town believes it has. In one branch she was never born at all, and the narration goes on referring to her in the past tense regardless. My developmental editor's standing objection is that these are not eleven versions of one world but eleven unrelated stories wearing borrowed labels: that I have no right to the cross-branch claims the book lives on. Those claims are that this woman is the same woman in each branch; that the man called by that name is not the man; that the mineral in the false-composition branches is the mineral; and that the branch in which she does not exist is still about her.

  I want to answer her with a rule I can apply myself, fast, because I am revising against a fixed delivery date and there are eleven branches rather than one.

  Build me a decision procedure grounded in what the philosophy of language and metaphysics actually says about names, descriptions, and the necessary-but-knowable-only-afterwards: rigid designation, the essentiality of origins, and the gap between how we identify a thing's bearer and what it takes for a thing to be that thing at all. I know roughly what that apparatus holds. I need it translated into something a novelist can run against a chapter in twenty minutes.

  Deliver it in these parts:

  1. An ordered list of tests to apply to any cross-branch sentence — a claim of the form *this is the same X in branch n and branch m*. For each test: the question to ask, what counts as passing, and what a failure licenses or forbids (rewrite the sentence; demote it to a claim internal to one branch; cut it; or keep it, because it is precisely the kind of claim the structure earns). Mark which tests are mechanical and which are judgment calls dressed as procedure.
  2. A rule for the identification problem — sentences that fix the reference of a name or kind term by description, and the difference between those and sentences that assert identity. Tell me how to spot the difference in my own prose when the same wording can do either job.
  3. A rule for kind terms and for artifacts, where the essential feature is composition or origin rather than a person's parentage, and a note on where that rule and the rule for persons come apart.
  4. What the procedure says about the branch in which she never exists: whether the narration there is talking about her, about nothing, or about something else, and which choice I should make.
  5. A one-page legend my editor and the copy desk can apply without reading any philosophy — the questions in order, with the pass conditions reduced to a line each.
  6. The points at which the procedure hands the decision back to me as a matter of what the book is for rather than what is true.

  Then run it on three cases and show the working: the four branches where her mother dies in 1946 and she is raised by strangers but keeps the same name, the same face, and the same temperament; the three branches where the man addressed by that name is not the man it was originally attached to, including the sentence I most want to keep, which is that she has known him all her life and never once met him; and the two branches where the mineral's composition is not what the town believes.

  Also give me one case where the procedure returns a verdict I will not like. Name a specific cross-branch claim of mine that it forbids, and do not soften it.

  Finally, be honest about the limits: where the procedure will misfire on prose that is doing something other than assertion, where it quietly commits me to a metaphysics of persons or kinds I may not want elsewhere in the book, and which distinctions it has to drop in order to be usable.

  On commitment: I want one procedure, not a menu of defensible options. Where the theory permits two readings, choose one, give me your reasons, and tell me what the choice costs the novel. If your view is that the premise is incoherent and no procedure can rescue it, say so plainly and name the single structural change that would make it coherent. I would much rather have a definite position to argue against than a survey I have to adjudicate myself.
reasoning: |-
  Okay, the user is a novelist working on a complex multi-branch novel and needs a practical decision procedure grounded in philosophy of language/metaphysics to defend cross-branch identity claims against editorial criticism. They're under time pressure with eleven branches to revise. 

  Hmm, this is fascinating but challenging. The core tension is between the editor's view (these are disconnected stories) and the author's vision (genuine variations of one world). The philosophical concepts involved—rigid designation, essential origins, reference fixing—need to be operationalized for creative writing. 

  First, I should note the user's urgency: they need something actionable, not theoretical. Their specification of six concrete deliverables shows they've deeply considered this. The examples given (mother's death, impostor man, mineral composition, non-existent protagonist) reveal where the narrative hinges on contested identities. 

  *flips through mental notes on Kripke*
  Right, rigid designation is key here—the idea that names refer to the same entity across possible worlds. But applying this to fiction requires adapting the concept. For the mother's death branches, the daughter's identity must survive the different upbringing if her origin (egg/sperm) is unchanged. But temperament and face alone won't suffice—those are accidental properties. 

  For the impostor man case, the name refers rigidly to the original bearer. So when the narration says "she never met him" while interacting with the impostor, that's philosophically sound—if "him" rigidly designates the original. The mineral is trickier: if its chemical composition differs, it's arguably not the same mineral kind unless we prioritize the town's false belief over science. 

  The non-existent branch is the most provocative. If the narration refers to "her" past-tense despite her never existing, we're in Meinongian territory (nonexistent objects). Alternatively, it could be a counterfactual about her—but then the tense is problematic. 

  *starts drafting tests*
  The procedure must distinguish:
  - When descriptions fix reference (e.g., "the first mayor") vs. when they're accidental ("the tall mayor")
  - Essential properties (human DNA origin) vs. contingent (being raised by strangers)
  - Artifact identity (mineral defined by composition vs. societal perception)

  For the editor's cheat sheet, I'll strip out philosophy jargon. Just: "Does this claim depend on how the character sees things, or what's fundamentally true?" 

  *anticipates pushback*
  The user won't like that the mineral with different composition fails the identity test—but scientifically, it must. They'll have to either adjust the premise or lean into the town's error as thematic. Similarly, the non-existent protagonist branch might need reframing as "the version where she wasn't born" rather than "never existed." 

  Biggest sacrifice: the procedure enforces biological essentialism for persons. If the novel wants to challenge that (e.g., with social identity themes), it'll create friction. But they asked for one coherent stance—Kripkean essentialism is the most defensible for cross-world identity. 

  *checks user's tone*
  They're clearly stressed ("two years in", "fixed delivery date") but thinking rigorously. The demand for an unlikable verdict shows intellectual honesty. I'll be blunt about the mineral example failing. 

  Final note: This system will misfire on poetic or metaphorical passages. But for plot-critical identity claims, it should armor them against editorial objections—if the author accepts the metaphysical tradeoffs.
answer: |-
  Here is a battle-tested decision procedure grounded in Kripkean metaphysics and philosophy of language, designed for speed and defensibility. It prioritizes **rigid designation** (names refer to the same entity across all possible worlds where it exists) and **essential properties** (what makes a thing *that* thing). It assumes a *metaphysically realist* stance: there are facts about identity independent of epistemic access.

  ---

  ### 1. Ordered List of Tests for Cross-Branch Identity Claims
  *(Apply sequentially. Stop and act on first failure.)*

  1.  **The Rigid Designator Test (Mechanical)**
      *   **Question:** Is "X" a rigid designator (e.g., a proper name like "Elizabeth Bennet," "Water," "The Eiffel Tower") or a non-rigid description (e.g., "the tallest woman in town," "the stuff in the mine," "the mayor")?
      *   **Pass:** "X" is a rigid designator. Proceed to Test 2.
      *   **Fail:** "X" is a description. Proceed to Test 3.
      *   **Failure Consequence:** *Rewrite* the claim using rigid designators if possible, or *demote* to a branch-internal claim (e.g., "In branch n, the man called 'Smith' *is believed by the town to be* the original Smith").

  2.  **The Essential Origin/Composition Test (Judgment Call)**
      *   **Question:** Does the cross-branch claim concern an entity whose *essential property* (origin for persons/organisms, composition for natural kinds/artifacts) is identical in both branches?
          *   *Persons:* Same biological parents? (Essential origin)
          *   *Natural Kinds (e.g., Gold, Water):* Same atomic composition? (Essential composition)
          *   *Artifacts (e.g., a specific statue, a town):* Same material origin (e.g., the lump of clay, the founding act/location)? (Essential origin)
      *   **Pass:** The essential property is identical. The claim is valid. *Keep it.*
      *   **Fail:** The essential property differs. The claim is false across branches.
      *   **Failure Consequence:** *Cut* the claim asserting identity. You may *keep* a claim about *causal origin* or *mistaken identity* (e.g., "The town calls this man 'Smith', but he is not the original Smith" is valid; "This man *is* Smith" is false if essential origin differs).

  3.  **The Reference-Fixing Description Test (Judgment Call)**
      *   **Question (Only if Test 1 Failed):** In the context of the narrative across branches, is the description used *solely to fix the reference* of a rigid designator, or is it *part of the meaning/identity condition*?
          *   *Reference-Fixing:* The description points to an underlying entity with essential properties (e.g., "The man called 'Smith'" rigidly designates the *original* Smith, even if an impostor bears the name).
          *   *Meaning-Constitutive:* The description *defines* what "X" is (e.g., "The mineral that fuels our town" defines "Luminite" solely by its economic role, not composition).
      *   **Pass:** The description is reference-fixing for a rigid designator. Proceed back to Test 2 using the rigidly designated entity.
      *   **Fail:** The description is meaning-constitutive. "X" *is* whatever satisfies the description in that branch. Identity claims across branches fail if descriptions differ.
      *   **Failure Consequence:** *Demote* the claim to branch-internal, or *rewrite* to clarify the description defines "X" differently per branch (e.g., "In branch n, 'Luminite' *means* the mineral with composition C; in branch m, it *means* the mineral with composition D").

  4.  **The Transworld Identity Test (Judgment Call)**
      *   **Question:** Could this entity, with its essential properties intact, *plausibly* exist and have the described contingent properties in *both* branches? (This tests narrative coherence, not strict metaphysics).
      *   **Pass:** Yes, the variations are plausible contingent differences (e.g., same person raised differently; same town with different economic base due to different mineral *beliefs*).
      *   **Fail:** The contingent differences logically contradict the essential properties or are wildly implausible.
      *   **Failure Consequence:** *Rewrite* to remove the contradiction/implausibility, or *demote/cut* if essential. *Keep* only if the implausibility *is the point* the structure earns (e.g., the non-existence branch).

  ---

  ### 2. Rule for Reference-Fixing vs. Identity Assertion
  *   **Problem:** Distinguishing "This is how we pick out X" from "This is what X *is*".
  *   **Rule:** Look for **modal force** and **counterfactual stability**.
      *   **Reference-Fixing:** Descriptions establishing *who/what we're talking about*. Often accompanied by phrases like "known as," "called," "referred to as," or context implying discovery ("*That* man is Smith!"). Counterfactual: "Even if Smith had a different job, he'd still *be* Smith."
      *   **Identity Assertion:** Descriptions stating *necessary conditions for being X*. Often definitive statements ("Smith *is* the mayor"). Counterfactual: "If Smith weren't the mayor, would he still *be* Smith? (Yes). If he weren't *born to the Smiths*, would he still *be* Smith? (No)."
  *   **Spotting in Prose:**
      *   Does the sentence feel like it's *pointing* ("Look, *that* is Smith!") or *defining* ("Smith *is defined by* his role as mayor")?
      *   Can you imagine the entity existing without that property? If yes, it's likely reference-fixing. If no, it's likely identity-constitutive.
      *   **Your Key Sentence:** "She has known him all her life and never once met him." This *passes* as reference-fixing. "Him" rigidly designates the *original* Smith. "The man called Smith" is a reference-fixing description pointing to the *impostor* in this context. The sentence highlights the *gap* between reference (the impostor she knows) and the rigid designator (the original she never met).

  ---

  ### 3. Rule for Kinds/Artifacts vs. Persons
  *   **Rule:** Apply Test 2 (Essential Origin/Composition) strictly:
      *   **Natural Kinds (Mineral):** Essential property = **Atomic Composition**. If composition differs, it's *not the same kind*, regardless of beliefs, appearance, or use. (Water is H₂O; XYZ isn't water).
      *   **Artifacts:** Essential property = **Material Origin**. The specific matter formed at creation, or the specific originating act/location. (The Ship of Theseus' original planks; the town founded *here* on *this date* by *these people*).
      *   **Persons:** Essential property = **Biological Origin** (Originating sperm and egg). Contingent: upbringing, name, memories, appearance (within biological limits).
  *   **Where They Come Apart:** Biological origin is paramount for persons, overriding descriptions or social roles. For kinds/artifacts, origin/composition overrides function or belief. *The town believing the mineral is Luminite doesn't make it Luminite if the composition is wrong.* A person raised by different parents *is* the same person if biological origin is identical. The procedure *enforces this distinction*.

  ---

  ### 4. The Non-Existent Branch
  *   **What the Procedure Says:** Rigid designators like her name refer *only* if she exists in that branch. If she never existed:
      *   Her name **lacks a referent** in that branch. Claims about "her" are **about nothing** (reference failure).
      *   The narration using her name in the past tense is **incorrect** within that branch's reality.
  *   **Your Choice & How to Justify:** You have two defensible paths:
      1.  **Embrace Reference Failure:** The narration *is* mistaken or using the name emptily. This creates uncanny dissonance – the structure "earns" this by highlighting the absence. *Justification:* Metaphysical honesty. The branch *lacks* her; referring to her is an error within its world.
      2.  **Counterfactual About Her:** Frame the entire branch as a **counterfactual scenario** *about her* ("In the version where she was never born..."). The narration speaks from a perspective *outside* this branch, comparing it to branches where she exists. "She" rigidly designates the same person *from the perspective of the multiverse structure*. *Justification:* Coherence for the overall narrative project. The "she" refers to the essential person defined across the multiverse, even where her instance is null.
  *   **Recommended Choice:** **#2 (Counterfactual)**. It preserves the core claim that the branch is "about her" without violating reference within the branch. Rephrase narration subtly (e.g., imply a comparing consciousness: "Had she existed, the town would have..." or use the structure itself as the implicit vantage point).

  ---

  ### 5. One-Page Legend for Editor/Copy Desk
  **Test Order for Cross-Branch Claims (e.g., "This is the same X in branch 1 and branch 2"):**

  1.  **Name or Description?**
      *   *Pass (Name):* It's a proper name (like "Anna Karenina" or "Gold"). Go to 2.
      *   *Fail (Description):* It's a descriptive phrase (like "the hero" or "the blue mineral"). Go to 3.
      *   *Action:* If Fail, rewrite using a name or mark as branch-specific belief.
  2.  **Same Core "Whatness"?**
      *   *Pass:* For people: Same biological parents. For minerals: Same chemical makeup. For objects/towns: Same original material/founding act. Keep claim.
      *   *Fail:* Core "whatness" differs (e.g., different parents, different mineral chemistry). Cut identity claim. Can keep claim about mistaken identity.
      *   *Action:* If Pass, claim is valid. If Fail, cut or rewrite as error/belief.
  3.  **Pointing or Defining? (Only if Step 1 Failed)**
      *   *Pass (Pointing):* The description just identifies who/what we mean by a name (e.g., "The man *called* Smith"). Go back to Step 2 using the named thing.
      *   *Fail (Defining):* The description *is* what the thing is (e.g., "Smith *is* the mayor"). Claim only applies if description matches in both branches.
      *   *Action:* If Pass, retest named thing in Step 2. If Fail, mark claim as branch-specific fact.

  **Special Case (Non-Existent Character Branch):** Narration referring to "her" treats her as a concept defined across *all* the book's versions, not as a real person *within* that specific branch's world.

  ---

  ### 6. Points Handed Back to the Author
  The procedure forces these choices *back to you* based on narrative intent:
  *   **Test 2 (Essential Property):** *Judging* biological origin as essential for persons. If your novel *rejects* this (e.g., argues identity is social), the procedure fights you. *Cost:* Undermines the core defense using philosophy.
  *   **Test 3 (Reference-Fixing vs. Defining):** *Judging* if a description fixes reference or defines meaning. Authorial intent determines this. *Cost:* Misjudgment makes claims incoherent.
  *   **Test 4 (Transworld Plausibility):** *Judging* if contingent differences are plausible. Authorial fiat ("It's *this kind* of story") overrides strict plausibility. *Cost:* Risks reader disbelief if pushed too far.
  *   **Non-Existence Branch:** *Choosing* between metaphysical honesty (reference failure) or structural cohesion (counterfactual about her). *Cost:* Option 1 creates dissonance; Option 2 requires careful framing.

  ---

  ### Procedure Applied to Your Cases

  **Case 1: Mother Dies in 1946, Raised by Strangers (Same Name, Face, Temperament)**
  *   Claim: "This is the same woman in branch A (mother dies) and branch B (mother lives)."
  *   Test 1: "Woman" likely rigid via name (e.g., "Sarah"). **Pass.** -> Test 2.
  *   Test 2: *Essential Origin:* Same biological parents? *Assume yes* (mother dies *after* conception). **Pass.** Contingent properties (raised by strangers, same face/temperament) are irrelevant to identity. **Keep Claim.** (Editor's objection fails on personhood).

  **Case 2: The Man Addressed by Name is Not the Original Man**
  *   Claim: "The man called 'John Vale' in branch C is not John Vale." (And your sentence: "She has known him all her life and never once met him.")
  *   Test 1: "John Vale" is a rigid designator. **Pass.** -> Test 2.
  *   Test 2: *Essential Origin:* Is the man in branch C the biological offspring of the people who originally named "John Vale"? *Assume no* (he's an impostor/lookalike). **Fail.** Therefore, "This man *is* John Vale" is false. However:
      *   Claim "The man called 'John Vale' *is not* John Vale": This asserts **non-identity**, which is *true* given Test 2 failure. **Keep Claim.**
      *   Your Sentence: "She has known *him* all her life and never once met *him*." First "him" rigidly designates the *impostor* (reference fixed by context "known"). Second "him" rigidly designates the *original John Vale*. The sentence asserts she knows the impostor but never met the original. Given Test 2 (different origins), this is **true and valid. Keep it.** (This is the structure *working*).

  **Case 3: Mineral Composition is Not What the Town Believes**
  *   Claim: "The mineral mined in branch D is Luminite" AND "The mineral mined in branch E is Luminite" (where compositions differ).
  *   **Cross-Branch Identity Claim Implied:** "The mineral in D and E is the *same kind* (Luminite)."
  *   Test 1: "Luminite" – Is it a rigid natural kind term? *Assume yes* (like "Gold"). **Pass.** -> Test 2.
  *   Test 2: *Essential Composition:* Does the mineral in D and E have the *same* atomic composition? *Assume no* (your premise). **Fail.**
  *   **Consequence:** The claim that the mineral in D and E is the *same kind* (Luminite) is **false.** They are different minerals. You *cannot* claim it's the same mineral kind across these branches.
  *   **Solution:**
      *   *Option 1 (Cut Identity):* Only claim "The town *calls* the mineral in D 'Luminite'" and "The town *calls* the mineral in E 'Luminite'". Demote to branch-specific belief.
      *   *Option 2 (Redefine Luminite):* Make "Luminite" non-rigid, defined *only* by the town's belief/economic role (Fail Test 1 -> Test 3 Fail). Then "This is Luminite" just means "This is what the town believes is Luminite". Identity claim across branches still fails if definitions differ. **This is the verdict you won't like.**

  ---

  ### Verdict You Won't Like (Specific Forbidden Claim)
  *   **Forbidden Claim:** Any direct assertion that "The mineral mined in the false-composition branch *is* Luminite" (implying it's the *same kind* as in branches where the composition matches the town's belief or the true composition).
  *   **Why:** Test 1 Pass (Luminite rigid) -> Test 2 Fail (Different essential composition) = **False Identity Claim.** You can only say the town *calls* it Luminite or believes it is Luminite. The procedure forbids the metaphysical identity.

  ---

  ### Limits & Costs of the Procedure

  1.  **Misfires on Non-Assertive Prose:** It crudely treats narration as assertion. It will misfire on:
      *   **Metaphor/Poetics:** "She was the soul of the town." (Not a literal identity claim).
      *   **Free Indirect Discourse:** Thoughts/fears expressed as fact ("He was surely the real Smith!").
      *   **Unreliable Narration:** Claims known to be false within the branch.
      *   **Thematic Statements:** "We are all the mineral, ground down by time." (Not literal).
      *   **Mitigation:** Apply only to sentences making *plot-critical, world-building identity assertions*. Scan context for markers of non-literalness.

  2.  **Metaphysical Commitments:**
      *   **Biological Essentialism for Persons:** Enforces the view that *only* biological origin defines personal identity. Undermines themes of social construction, memory, or psychological continuity defining identity.
      *   **Scientific Essentialism for Kinds:** Assumes natural kinds have hidden essential structures (composition), overriding societal use or function. Conflicts with anthropological views of categories.
      *   **Artifact Origin Essentialism:** May clash with intuitions about functional persistence (e.g., Ship of Theseus).
      *   **Cost:** Limits exploration of alternative identity theories within the branches. The structure's core defense relies on these specific commitments.

  3.  **Dropped Distinctions for Usability:**
      *   Nuances in artifact identity (form vs. function vs. matter).
      *   Distinctions between natural kinds and nominal kinds.
      *   Complex cases of vague identity or temporal parts.
      *   Alternative theories (Descrpitivism, Bundle Theory) are excluded.
      *   **Cost:** Some edge cases might feel forced into the Kripkean mold.

  ---

  ### Final Assessment
  **The premise is NOT incoherent.** The procedure provides a robust, philosophically defensible framework to defend your cross-branch identity claims for *persons* ("same woman") and *non-identity claims* ("not the man"). **The major structural pressure point is the mineral.** The procedure *forces* you to either:
  1.  **Change the Mineral Premise:** Make the composition *the same* across all branches, with only the *town's belief* differing. This preserves the essential kind identity. Or,
  2.  **Demote the Mineral Identity:** Treat "Luminite" as a branch-specific label defined by belief/use, not a rigid natural kind. This sacrifices the cross-branch kind identity claim but preserves the town's perspective.

  **Recommendation:** **Change the mineral premise (Option 1).** It's the cleanest fix aligning with the procedure and preserving your intended structure's integrity for the characters and impostor plot. The false *belief* about composition can still drive your local economy theme without violating metaphysical identity across branches. This is the single structural change yielding coherence under the required metaphysics. Use the procedure rigorously on person/impostor claims and embrace the counterfactual framing for the non-existence branch. Good luck!
