  First, I need to parse their seven points. Point (1) establishes they're a Scanlonian contractualist. Point (2) rejects summing complaints, aligning with Taurek. Point (3) agrees with saving the five over one, which seems at odds with (2). Point (4) supports lotteries in ties. Point (5) justifies using QALYs at work, claiming it's compatible. Point (6) allows comparing individual complaints. Point (7) wants the theory conservative, avoiding utilitarian extremes.

  The user suspects contradictions. Let me map tensions. Between (2) and (3): how can complaints not sum yet numbers matter? Taurek would save neither group or flip a coin, but the user saves the five. They mention pairwise comparisons. That's key—maybe they're using a different aggregation method. 

  Point (5) using QALYs might clash with (2). QALYs sum across people, which Scanlonians like Kamm or Otsuka reject. The user argues QALYs measure individual benefit, but summing them for efficiency implies aggregation. That's a problem.

  Point (6) comparing complaint strengths across persons might conflict with (2)'s no-summing. If you can compare, why not sum? But the user thinks comparisons are possible without totaling. Scanlon allows some interpersonal comparisons for reasonableness, but it's tricky.

  Point (7)'s conservatism could be threatened if their solution leads to non-intuitive results. Saving the five is common sense, but rejecting aggregation in headaches vs. death might seem revisionary. They need to ensure their theory aligns with ordinary judgments.

  Now, ranking tensions by severity. The worst is between (2) and saving the five in point (3). If complaints can't sum, why prioritize the larger group? The user's pairwise comparison idea needs scrutiny. Can pairwise fairness override individual complaints without aggregation? Regan's "saving more as a side effect" might help, but it's not purely contractualist. 

  Next, (5)'s QALYs versus (2). Institutional vs. individual contexts might justify different principles. But Scanlon's framework applies to all principles, so this distinction needs defense. Maybe appeal to efficiency in institutions as non-rejectable, but that's shaky.

  Then (6) comparing complaints versus (2). If strengths are comparable, why not sum? The user must clarify that comparison is for reasonableness, not aggregation. But allowing comparison might open the door to summing, which they deny.

  The cheapest fix? For (2) vs. (3), adopt a non-aggregative justification like pairwise fairness. That preserves (2) while saving the five. For (5), argue that QALY-based decisions are governed by different principles reasonable for institutions. This might require conceding some ground but keeps practical work intact.

  The biggest cleanup would be refining how numbers matter without summing. Using pairwise comparison as a tie-breaker in complaints could resolve multiple tensions. This maintains contractualism while addressing intuitions about saving lives.

  The user might be worried about defending their work approach. They need a principled distinction between individual morality and institutional efficiency. Emphasizing the different roles and responsibilities could help, but it needs philosophical grounding.

  Also, ensuring their view doesn't collapse into utilitarianism. By limiting interpersonal comparison to necessity for reasonable rejection, they avoid summing while allowing essential judgments. This balances conservatism with theoretical coherence.
answer: |-
  Here's a structural audit of your commitments, ranked by severity of tension. I'll proceed as requested: first a brainstorm of candidate tensions, then diagnosis and repair options for the real ones, followed by the most efficient fix.

  **Brainstorm: Candidate Tensions**
  1.  **(2) vs. (3):** Can "complaints don't sum" *really* coexist with saving the five? Pairwise comparison seems like a workaround, but does it smuggle aggregation in?
  2.  **(2) vs. (5):** Does using QALY maximization *in practice* undermine the claim that "there's no such thing as total suffering"? Isn't a QALY league table inherently aggregative?
  3.  **(2) vs. (6):** If complaint strengths *can* be compared across people "without much controversy," why can't they be summed? What's the barrier?
  4.  **(1)/(7) vs. (3):** Is saving the five *vindicated* by contractualism without aggregation, or is it a revision requiring special justification? Does pairwise comparison feel "conservative"?
  5.  **(5) vs. (1):** Can a principle mandating QALY maximization for public payers *really* be justified to each person, one by one, to someone who loses out? Or is it inherently aggregative/rejectable?
  6.  **(3) vs. (4):** If pairwise comparison breaks ties, why is a lottery needed at 5v5? Why not just pick one group via pairwise? What breaks the symmetry?
  7.  **(6) vs. (1):** Does comparing complaint strengths across persons for reasonableness assessments subtly reintroduce a cardinal interpersonal measure Scanlon wanted to avoid?

  **Diagnosis & Repair: Ranked Tensions**

  1.  **Severe Tension: (2) "Complaints Don't Sum" vs. (3) "Save the Five"**
      *   **The Rub:** Your pairwise move is clever, but it faces a powerful objection: *Why does winning more pairwise comparisons matter?* If Alf has a complaint against being left to die if you save Betty (one of the five), and Betty has an *identical* complaint against being left to die if you save Alf, then choosing to save Betty over Alf seems *arbitrary* on non-aggregative grounds. Saving the five means saving Betty *instead of Alf* specifically *because* there are *four others* you also save by choosing that option. This looks like the number of complaints *for the option* (saving the five) functionally outweighs the complaint *against it* (the one left to die), even if you disavow summing "harm totals."
      *   **Cheapest Repair (Preserve (3)):** Embrace a **non-aggregative justification for saving the many** that *doesn't* rely on pairwise comparison as the *mechanism*. Two main contenders exist in the literature:
          *   **Regan/Frick: Saving More as a Side Effect:** When you act to save the five, the death of the one is a *foreseen but unintended side effect* of saving a group. When you save the one, the deaths of the five are *directly intended* (or the direct object of your choice to *not* save them). Many find the latter harder to justify to each person left to die. This preserves (2) by focusing on the *structure* of agency, not summing harms. **Cost:** Requires abandoning pairwise comparison as the *explanation* for (3); may seem less intuitive/intellectually satisfying than "numbers matter."
          *   **Kamm/Otsuka: Pairwise *Defeat*:** Focus on the complaint of the single person if you save the five vs. the complaint of *each* of the five if you save the one. Each of the five can complain: "Choosing to save the one person *instead of me* imposes a terrible burden on me (death) for a benefit to someone else that is *no greater* than the benefit I would have received." The single person cannot make this "pairwise defeat" complaint against *each* member of the five; they can only complain that *someone* got saved instead of them. The principle "save the larger group" is harder to reject reasonably because it minimizes the number of individuals who can lodge this specific, powerful type of complaint. **Cost:** More complex; requires defining a specific *type* of complaint; still feels like numbers matter via complaint counting.
      *   **Cheapest Repair (Preserve (2)):** Concede that in the *pure rescue case* (identical individuals, identical claims), saving the five *is* unreasonable if complaints truly don't sum; adopt Taurek's solution (lottery or save whoever you happen to reach first). **Cost:** Directly contradicts (3) and likely (7) – major revision to common sense.
      *   **What You Lose:** If repairing towards saving the five, you lose the *simplicity* of "pairwise comparison explains it all" and must adopt a more nuanced non-aggregative argument. If repairing towards Taurek, you lose the strong intuitive pull of saving the many.

  2.  **Significant Tension: (2) "Complaints Don't Sum" / (1) Contractualism vs. (5) QALY Maximization at Work**
      *   **The Rub:** Your justification for (5) is shaky. A QALY *is* a measure of individual benefit (gain/loss in health-related quality of life over time). However, *maximizing total QALYs* is fundamentally an aggregative principle. Consider someone with a rare, expensive-to-treat condition offering modest QALY gains per patient vs. funding a cheap intervention for many offering small QALY gains each. Summing the small gains *across many people* leads you to fund the latter, leaving the rare disease patient untreated. Can that patient *reasonably reject* the principle "Maximize Total QALYs"? Absolutely: "This principle sacrifices *my* significant health loss (even if not 'death') for the sake of *many* others' *much smaller* individual gains. My complaint is stronger than any *single* one of theirs. You haven't justified this *to me*; you've justified it by adding up small gains across strangers." Your point about institutional context needs stronger grounding *within contractualism*.
      *   **Cheapest Repair (Preserve (5)):** **Radically contextualize the principle.** Don't claim "QALY maximization" is *the* principle. Argue that *within the specific institutional role* of a public payer managing *scarce resources for a population under a mandate of fairness and efficiency*, the *package* of principles governing decision-making (including transparency, evidence-based assessment, *and* efficiency measured by cost-per-QALY) forms a system that *as a whole* is not reasonably rejectable. Each person benefits from a system that strives for efficiency and breadth under scarcity, even if they sometimes lose out. Emphasize procedural fairness (like NICE's processes). **Cost:** This weakens the direct link between (1) and any single act; moves towards a *systemic* or *role-based* contractualism. You lose the clean "this act is wrong iff..." of core Scanlon. Requires careful defense against the rare disease patient's complaint.
      *   **Cheapest Repair (Preserve (1)/(2)):** **Abandon QALY maximization as the *sole* or *primary* decision rule.** Incorporate explicit equity weights, thresholds for severity/rarity, or budget sets specifically for high-cost/low-prevalence conditions – mechanisms designed to address the strongest individual complaints that aggregation ignores. **Cost:** Major revision to your work practice; likely seen as less efficient by some stakeholders.
      *   **What You Lose:** If preserving QALYs, you lose some purity in applying (1)/(2) directly to institutional actions and must accept a more complex, systemic justification. If abandoning strict QALY max, you lose a key efficiency tool in HTA.

  3.  **Moderate Tension: (2) "Complaints Don't Sum" vs. (6) Comparing Complaint Strengths**
      *   **The Rub:** If we can compare Alf's complaint (death) and Betty's complaint (mild headache) and uncontroversially say Alf's complaint is *stronger*, what *exactly* stops us from saying that a sufficiently large number of Betty-strength complaints *collectively* outweigh Alf's? The standard contractualist line (Scanlon, Kumar) is that comparisons are only needed for *reasonableness assessments*: is Alf's rejection of a principle *reasonable* given the burden it imposes *on him* compared to the burdens others would bear under alternative principles? The comparison is for judging the *reasonableness of rejection*, not for *summing burdens* to outweigh someone else's burden directly. A billion headaches don't give anyone a claim *strong enough* to reasonably reject a principle forbidding actions that kill one person to cure those headaches.
      *   **Cheapest Repair:** **Sharply distinguish comparing *for reasonableness* from summing *to outweigh*.** Emphasize that (6) is solely about the former. We compare burdens to ask: "Is this person's objection to principle P *reasonable*, given how badly P treats them compared to how badly alternatives would treat others?" It's not about stacking Betty's burden *against* Alf's to see whose is bigger in a vacuum; it's about assessing the *reasonableness of each individual's stance* within the contractual situation. **Cost:** Requires vigilance in language; doesn't fully satisfy those who see comparability as inevitably leading to summability.
      *   **What You Lose:** Some might feel this is semantics, but it's crucial Scanlonian orthodoxy. You lose the ability to say headaches *sum* to outweigh death, but you keep the core of (2) and (6).

  4.  **Minor Tension: (3) "Save the Five" (via Pairwise?) vs. (4) Lottery for Ties**
      *   **The Rub:** If the mechanism for saving the five is robust pairwise comparison showing the five have stronger *collective* claim, why doesn't that work at 5v5? Applying pairwise *within* a tied group doesn't break the symmetry. A lottery seems like a different kind of justification (procedural fairness/avoiding arbitrary choice).
      *   **Repair:** **Clarify the role of pairwise comparison.** Pairwise comparison likely only shows that saving the five is *permissible* or *preferred* over saving the one when there's an asymmetry. It doesn't create a *strict obligation* or a claim that dissolves ties. At 5v5, there is *no* asymmetry to leverage via pairwise comparison. No individual or subgroup has a claim stronger than their counterpart in the other group. Therefore, the contractualist must find a *different* principle for tied cases, and a fair lottery is a prime candidate (as Scanlon discusses). **Cost:** None, really. This is consistent. Pairwise comparison explains *why* we save the five when we can, not *how* to decide when we can't distinguish via pairwise means.
      *   **What You Lose:** Nothing. This clarifies the limited scope of the pairwise move.

  **The Single Most Efficient Revision: Refine the Justification for Saving the Five**

  Adopting either the **Regan/Frick (Saving More as Side Effect)** or the **Kamm/Otsuka (Pairwise Defeat)** account for saving the five delivers the most significant cleanup:

  1.  **Resolves the Core Tension (2 vs. 3):** It provides a principled, non-aggregative reason for saving the many that doesn't rely on summing complaints or simple pairwise comparison. This shores up your foundational commitment to Scanlonian contractualism (1).
  2.  **Strengthens (7) Conservatism:** It aligns the theory better with a powerful common-sense intuition without resorting to aggregation, making the theory *more* conservative, not less.
  3.  **Indirectly Supports (5) Contextualization:** By firmly grounding the individual rescue intuition non-aggregatively, it makes it easier to argue that institutional efficiency (QALY max) operates under a *different set of principles* justified by the systemic context and role, not by directly outweighing individual complaints via aggregation. The repair for (5) becomes more plausible.
  4.  **Minimal Collateral Damage:** It doesn't force you to abandon any of your core stated beliefs (1, 2, 4, 6, 7); it only requires refining *how* you justify (3). The cost is theoretical complexity, not a loss of commitment.

  **Conclusion:** Your framework is coherent *except* for the core numbers problem (2 vs. 3) and the institutional application (1/2 vs. 5). The most damaging tension is explaining saving the five without aggregation. Prioritize refining that justification using established non-aggregative strategies (Regan/Frick or Kamm/Otsuka). This provides the strongest foundation for defending your other points, especially the contextual defense of QALYs. Be prepared for tough questions on whether your QALY justification truly satisfies contractualism's demand for justification *to each individual* – that remains the thorniest practical challenge for your view. Good luck in the lion's den!
