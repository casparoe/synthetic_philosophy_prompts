prompt: |-
  ok so I've been going in circles on this for like three days and I want somebody to tell me where the bodies are buried. Context: there's a proposal floating around my local democracy-nerd group where each parent gets an extra half-weight ballot per minor child, split between the parents if both claim it, capped at one extra full ballot per parent. Basically demeny voting with a cap bolted on. A friend of mine thinks arguing about the cap is missing the point because the whole family of proposals is unsalvageable, and he wrote out an argument for that. I don't accept the conclusion but I can't find the bad step, which is annoying because hes using my own premises to do it.

  (1) A collective decision is legitimate only if everyone affected by it has an equal say in producing it.
  (2) Children are affected by basically everything the state does — more than adults, arguably, since they'll live with the consequences longer and can't exit.
  (3) So if children have no say, the state's decisions are illegitimate with respect to them.
  (4) A two-year-old can't form or express a political preference, so her say has to be exercised by somebody else, and the only non-arbitrary somebody is a parent.
  (5) But a parent casting her own ballot plus her children's now has more voting power than a childless adult. The children's say has been converted into the parent's extra say, which violates (1) just as badly as disenfranchising them did.
  (6) The patch is the fractional ballots above. But a half-weight ballot isn't a vote, it's a weight attached to a person's influence. Once you concede that influence can be weighted by something other than one-person-one-ballot, nothing in (1) rules out weighting by stakes, or by competence, or by taxes paid. (1) has been cashed out into its opposite.
  (7) So either (1) is unimplementable for the largest class of affected people, or implementing it licenses exactly the inequality it was supposed to forbid.
  (8) Therefore (1) is false. Equal say isn't what legitimacy consists in. And note this isn't just about kids — the same move kills the principled case for votes at 16 and for votes for permanent residents, and leaves you with prudence all the way down.

  My gut says something goes wrong somewhere around (5)-(6) but I can't name it, and I also don't trust (8) — it feels like he's slid from "this is hard to implement" to "the principle is false," wich seems too fast. But here's my problem: if I try to block (4) by saying fine, no ballots for the under-12s, just real ones at 16, haven't I conceded that what (1) actually tracks is capacity rather than affectedness? That was his whole point.

  So: which step is the load-bearing error, why did it look fine the first four times I read it, and what does each repair actually cost — (a) resisting (2) and saying kids aren't affected in the sense (1) needs, (b) denying that a proxy ballot converts a right into power, (c) accepting weighted ballots and trying to hold the line at (6)? I'd rather keep (1) than (8) if I have to pick, but I want the price tag, not the reassurance. Also worth saying whether the cap does any independent damage that the uncapped version doesn't, since that's the thing we were actually arguing about.

  And please be explicit about which parts of this are settled among people who work on democratic theory and which are live fights — I don't want to walk away thinking there's a consensus diagnosis here when there probably isn't, and I'd much rather you flag the places where the field just disagrees than smooth them over.
reasoning: |-
  Okay, this user has been wrestling with a complex democratic theory problem for days. They're clearly frustrated but also deeply engaged - this isn't someone looking for quick answers but wanting to understand the philosophical machinery. The core tension is between a strong principle of equal say for all affected (premise 1) and practical implementation regarding children. 

  Their friend's argument cleverly uses their own premises to show that giving children proxy votes either violates equality (by giving parents extra power) or destroys the principle entirely (by introducing weighted votes). The user feels stuck because every exit seems costly: rejecting that children are affected (premise 2) feels wrong, denying proxy conversion (premise 5) seems shaky, and accepting weighted votes (step 6) opens Pandora's box. 

  What's revealing is their meta-concern: they want explicit markers about where democratic theory has consensus versus ongoing debates. They're not just after "the answer" but a map of the intellectual terrain. The mention of the voting cap being their original debate point shows they're trying to distinguish fundamental flaws from negotiable details.

  Their gut skepticism about premise 8 is astute - the leap from implementation difficulties to principle falsification is indeed contestable. But they're rightly troubled that alternatives like voting at 16 might concede their friend's point about capacity trumping affectedness. This is someone who understands that philosophical choices have downstream political costs.

  The emotional subtext is interesting too: "where the bodies are buried" suggests they feel their friend's argument has hidden flaws, while "using my own premises" shows frustration at being cornered by their own logic. They're not just defending a policy but their broader commitment to democratic equality.
answer: |-
  Here's a breakdown of the argument's load-bearing errors, the cost of repairs, and the state of democratic theory consensus:

  **The Load-Bearing Error: Premise (1)'s Ambiguity & Premise (5)'s Mischaracterization**
  *   **Premise (1) is crucially ambiguous:** "Equal say" can mean:
      *   **Formal Equality (One-Person-One-Vote - OPOV):** Equal formal voting power/resource.
      *   **Substantive Equality (Equal Influence/Consideration):** Equal weight given to interests in decision-making.
  *   **Premise (5) conflates these:** It assumes that giving parents a proxy vote *must* mean converting the child's "say" into *formal voting power* for the parent, violating OPOV. This ignores the possibility that the proxy vote is intended to give *substantive consideration* to the child's distinct interests via a trusted representative. The parent isn't (ideally) wielding the child's vote *as their own extra power*; they are wielding it *on behalf of the child's interests*.
  *   **Why it looks fine:** The argument cleverly exploits the ambiguity in (1). If "equal say" strictly means OPOV, then (5) seems correct - adding ballots gives parents more formal power. But if "equal say" means substantive consideration, then proxy voting *aims* to achieve that consideration where direct voting is impossible. The friend's argument forces you to choose the interpretation that makes Demeny voting fail.

  **Repair Options & Their Costs:**

  1.  **Resisting (2): Deny kids are "affected" in the relevant sense.**
      *   **What it means:** Argue that "affected" in (1) requires *agency* or *capacity for judgment* to have a "say," not just passive impact. Children are profoundly affected, but lack the capacity to exercise a "say" meaningfully. Legitimacy requires giving a say only to those capable of wielding it.
      *   **Cost:** This explicitly abandons the core intuition behind (1) for children and other dependent populations (severely disabled, dementia patients). It grounds legitimacy in *capacity* (cognitive maturity/agency), not just affectedness. This weakens the case for lowering the voting age to 16 (though you could argue 16-year-olds *do* have sufficient capacity). It aligns legitimacy more closely with classical liberal "consent of the governed" models focused on autonomous agents. **High Cost:** You sacrifice the purest form of the "all affected" principle.
      *   **Consensus?** **No consensus.** This is a fundamental divide. "All affected interests" theorists (e.g., Robert Goodin) vs. "Competency/agency" theorists (e.g., classical liberals, some deliberative democrats).

  2.  **Denying (5): Argue proxy ballots represent distinct interests, not parent power.**
      *   **What it means:** The parent casting ballots isn't exercising "more say" *for themselves*. They exercise their own vote *and* act as a fiduciary/trustee for each child's distinct interest. The extra weight isn't *their power*; it's the *mechanism* for representing another's interest within the OPOV framework for competent voters. The aim is substantive equality of consideration.
      *   **Cost:** Requires robust normative justification for *why parents* are the appropriate fiduciaries (arguably non-arbitrary due to intimacy, responsibility, and incentive alignment). Requires accepting that formal OPOV *among competent adults* can be temporarily suspended to represent the interests of non-competent dependents *without* inherently violating the equality principle *for the competent*. You must bite the bullet that parents *formally* have more voting slips, while insisting they *substantively* represent distinct interests. Requires guarding against parental abuse (e.g., voting purely in their own interest using the child's ballot). The cap arguably helps mitigate this risk slightly by limiting amplification. **Moderate Cost:** Requires defending representation of interests and parental trusteeship within democracy.
      *   **Consensus?** **No consensus, but a common justification.** Demeny voting proponents (e.g., Paul Demeny, some pro-natalist theorists) explicitly use this fiduciary/representation logic. Critics argue parental self-interest inevitably corrupts the representation.

  3.  **Accepting Weighted Ballots & Holding the Line at (6).**
      *   **What it means:** Concede that "equal say" (as substantive consideration) *can* justify weighted voting. Argue that child representation is the *only* justified weighting because:
          *   **Capacity Barrier:** Children uniquely lack *any* capacity to represent themselves.
          *   **Stakes & Vulnerability:** Their uniquely high stakes and vulnerability create a special obligation for representation.
          *   **Fiduciary Relationship:** The parent-child relationship provides a unique, non-arbitrary basis for assigning the representation role.
      *   **Cost:** Abandons OPOV as an inviolable formal principle. Requires drawing a bright line: Why *only* children? What about other high-stakes/low-capacity groups? What about other potential weightings (stakes, competence)? Defending this line requires arguing that the parent-child case is *sui generis* (unique) based on the combination of total dependency, unique fiduciary bond, and societal interest in future generations. This is difficult. The cap becomes even more arbitrary in this view – why is 1 extra ballot the "right" weight? **High Cost:** Opens Pandora's box; defending the boundary is challenging.
      *   **Consensus?** **Strong consensus *against*.** Democratic theory overwhelmingly defends OPOV as a core formal requirement for political equality among citizens. Weighting by stakes/competence/taxes is widely rejected as leading to plutocracy or epistocracy. Demeny voting is a rare, contested exception proposed specifically for children.

  **Addressing Premise (8) & Your Gut Feeling:**

  *   **Premise (8)'s Leap ("hard to implement" -> "false"):** Your gut is right. The argument commits a **Non Sequitur**. Difficulty implementing a principle under specific circumstances (enfranchising the profoundly incapacitated) does *not* logically entail that the principle is false. It might mean we need imperfect proxies (like parental votes), or that the principle needs refinement (incorporating capacity), or that legitimacy has other sources besides perfect adherence to (1). The friend slides from an implementation problem for a specific group to rejecting the principle entirely.
  *   **The "Capacity vs. Affectedness" Point:** If you block (4) by saying votes start at 16, you *are* prioritizing capacity over pure affectedness for the young. This *modifies* Premise (1), it doesn't necessarily abandon it. You could argue that having a "say" *presupposes* a minimum capacity to form preferences or exercise agency. Affectedness is necessary but not sufficient; capacity is also required. This is a common position. It doesn't mean (1) is false; it means (1) needs a capacity qualifier.

  **The Cap's Role:**

  *   The cap **does independent damage** *if* you accept the fiduciary representation view (Repair 2). It arbitrarily limits the representation of larger families' children's interests. A family with 4 kids gets only 1 extra vote split between parents, meaning each child gets only 1/8th weighting per parent, while a family with 1 kid gets 1/2 weighting. This undermines the "equal consideration" goal.
  *   The cap **mitigates damage** *if* you fear parental power amplification (as in Premise 5). It limits how much extra *formal* power any parent can get, reducing the perceived inequality among adults.
  *   **Consensus?** Caps are generally seen as pragmatic political compromises to make Demeny voting more palatable, not principled components. They weaken the pro-natalist/representation logic.

  **State of the Field - Consensus vs. Debate:**

  1.  **Premise (1) - "All Affected" Principle:** **Live Fight.** Highly influential (Goodin), but contested. Critics argue it's too vague ("affected how much?"), impractical, and ignores agency/obligation.
  2.  **Children & Voting:** **Live Fight.** Demeny voting is a niche proposal. Debates rage over lowering the voting age (e.g., to 16 - **modest support growing, not consensus**), but full proxy voting for infants is fringe and highly controversial. Most theorists accept *some* form of parental representation in *non-electoral* contexts (medical decisions, education), but extending it to voting is contested.
  3.  **Formal OPOV:** **Strong Consensus.** Weighted voting for competence/stakes/taxes is overwhelmingly rejected as anti-democratic. Demeny voting is the main exception debated.
  4.  **Legitimacy Basis:** **Live Fight.** Is it consent? Deliberation? Equal consideration of interests? Outcomes? No consensus. Premise (1) represents one major strand (procedural equality/consideration).
  5.  **Proxy Voting/Fiduciary Representation for Non-Competents:** **Debated, Limited Consensus for Non-Electoral Contexts.** The *concept* of representing interests is accepted, but its application to *voting* is where the fight is. Parental authority is widely accepted for many child decisions; voting is seen as categorically different by many.

  **Conclusion:**

  The fatal flaw is **Premise (5)'s conflation of formal voting power with substantive interest representation**, exploiting the **ambiguity in Premise (1)**. Your friend's argument forces Premise (1) to mean strict OPOV, making Demeny voting violate it, or forces it to mean substantive equality, which (they argue) licenses unacceptable weighting. The repair costs are high no matter what:

  *   **Denying Affectedness:** Sacrifices the pure "all affected" ideal for children.
  *   **Fiduciary Defense:** Requires justifying parental representation and accepting formal inequality among adults.
  *   **Accepting Weighting:** Abandons OPOV and struggles to defend boundaries.

  Premise (8)'s leap is invalid. Difficulty implementing a principle doesn't falsify it. Moving the voting age to 16 *does* incorporate capacity into the "equal say" requirement, but this is a common refinement, not an abandonment. The cap is a pragmatic, not principled, element, arguably harmful to the representation logic but mitigating to the power-concern logic.

  The field largely agrees on rejecting weighted voting generally (OPOV is sacred) but is deeply divided on the "all affected" principle, the status of children's interests in democracy, and the permissibility of *any* exceptions like Demeny voting. Your friend's argument is clever but relies on contested interpretations and an invalid final leap.
