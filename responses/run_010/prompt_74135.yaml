prompt: |-
  Prepping a seminar session on whether history can be objective. One of my students has just turned in a short paper whose whole argument is one sentence: history is written by the victors, therefore Ranke's hope of showing how it really was is a fantasy. I don't want to just tell her that's a platitude doing no work — I want to say precisely why. So can you lay out the different claims that proverb could actually be making: claims about who produces the records, which records survive, whose questions get asked, what gets commemorated, that sort of thing. For each, say whether it's trivially true, genuinely contentious, or flatly false. Then seperate out the ones that would really license a move from a fact about the archive to a conclusion about there being no true account of the past, and tell me whether any of those readings is the scepticism you find in Carr or in White, or something weaker entirely. A list I can hand out at the start of class would be ideal.
