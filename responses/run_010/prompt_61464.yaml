  ### Reasoning

  Your cases reveal a tension between the informational value of crowd behavior and the conditions under which copying becomes rational or irrational. The core issue is that cascades can be informationally valuable when the crowd's actions reflect independent signals, but they can mislead when signals are dependent, manufactured, or when individual expertise should override. Your separate-sources rule (independence/authenticity) is necessary but insufficient—it fails in emergencies (fire alarm) and authority contexts (attending physician), and it doesn't resolve ex ante/ex post distinctions (sunscreen, citation ring). 

  I propose a unified principle with three clauses addressing these gaps:  
  1. **Independence/Authenticity**: The crowd's actions must reflect genuinely independent private signals or experiences (not manufactured or copied).  
  2. **Stakes-Verification Tradeoff**: Copying is rational if (a) stakes are high and independent verification is prohibitively costly/risky *or* (b) the crowd includes recognized expertise/authority with superior reliability.  
  3. **Epistemic Position**: Rationality is judged based on information available at decision time (ex ante); discovering signals were inauthentic/dependent later doesn’t retroactively condemn the act.  

  This principle handles:  
  - **Restaurant line (Case 1)**: Fine (Clause 1—independent signals).  
  - **Planted line (Case 2)**: Tourist rational ex ante (Clause 3) but wronged ex post (violates Clause 1).  
