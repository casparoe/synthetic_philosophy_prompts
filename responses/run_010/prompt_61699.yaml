prompt: |-
  in my semantics seminar we're on derogatory terms next week and I want to walk in already knowing what to demand of an account, before I read five of them and get talked into whichever one is written best. so: write the desiderata for a theory of slurs. the data it has to handle and the distinctions it cant collapse. stuff like why the nasty part seems to survive negation and embedding and even reports of what somebody else said, but doesn't survive a dictionary entry or an initialism; why a slur and its neutral counterpart pick out the same people yet aren't interchangeable in some contexts; how a fully competent speaker can sincerely say there are no X's in this town without the sentence coming out false; reclamation and in-group use; why the offensiveness looks glued to the word rather than to the speaker's intentions; and what's supposed to separate a slur from an ordinary insult like "jerk".

  for each one, give the case that motivates it and say whether you take it to be non-negotiable or actually a prejudice of one camp — I suspect the requirement that every slur have a clean neutral counterpart is shaky, and maybe so is the requirement that the semantics itself explain why using one is wrong. then tell me which single desideratum knocks out the most views, and whether any pair is jointly unsatisfiable (my hunch is stability across contexts vs flexibility under reclamation). a couple of sentences at the end on how the truth-conditional, prohibitionist, expressivist and presuppositional camps do against the list is fine, no more.

  and be explicit about which of these requirements the literature basically agrees on versus which are live fights — dont dress up a contested position as the consensus.
