answer: |-
  Here's a crisp set of desiderata for a theory of slurs, structured to arm you for seminar debate. Desiderata are labeled **N-N** (Non-Negotiable: widely agreed core data), **C** (Contested: live disputes), or **A** (Assumed but shaky: potentially ideological). Consensus notes and theory impacts follow.

  ---

  ### **Core Desiderata**  
  1. **Offense Resilience (Embedding/Report Immunity)**  
     - *Case:* "Bob isn't a k*ke" or "Alice said Carl is a ch*nk" remain offensive despite negation/reporting.  
     - *Status:* **N-N** (agreed: offense isn't canceled by embedding).  
     - *Knockout:* Eliminates simple **truth-conditional** views (e.g., slurs = neutrals + negative connotation).  

  2. **Neutral Counterpart Non-Interchangeability**  
     - *Case:* "There are no k*kes here" vs. "There are no Jews here" can both be true, but the slur isn't substitutable in, e.g., historical discourse ("Jewish poets" ≠ "k*ke poets").  
     - *Status:* **N-N** (agreed: same extension, different expressive profile).  

  3. **Truth-Conditional Identity with Possible Empty Extension**  
     - *Case:* A competent speaker says "There are no f*gs in this town" truthfully (if no gay men reside there), despite the slur's offensiveness.  
     - *Status:* **N-N** (agreed: slurs contribute to truth conditions like neutrals but carry offensive baggage).  

  4. **Reclamation & In-Group Use**  
     - *Case:* "queer" used pridefully within LGBTQ+ communities vs. offensively by outsiders.  
     - *Status:* **C** (contested *how* to model this: semantic bleaching? New convention? Contextual parameters?).  
     - *Tension:* Creates friction with **Stability (N-N)**—how can offense be rigidly glued to the word yet vanish in reclaimed uses?  

  5. **Offense Glued to the Word (Intention-Independence)**  
     - *Case:* A well-intentioned speaker using a slur "accidentally" still offends (e.g., non-native speaker using an archaic term).  
     - *Status:* **N-N** (agreed: offense is conventional, not speaker-specific).  
     - *Knockout:* Sinks **prohibitionism** (slurs = taboo words) if it ignores semantic content.  

  6. **Slur vs. Ordinary Insult Distinction**  
     - *Case:* "jerk" targets behavior; "n*gger" targets group identity + enables systemic harm.  
     - *Status:* **N-N** (agreed: slurs encode group-based contempt; insults need not).  

  ---

  ### **Contested/Shaky Desiderata**  
  7. **Universal Neutral Counterparts**  
     - *Case:* Some slurs (e.g., racial epithets) lack uncontested neutrals (is "B*lgian" neutral? Context-dependent!).  
     - *Status:* **A** (shaky: often assumed but empirically false for some terms; *test this in seminar*).  

  8. **Semantics Must Explain Wrongness**  
     - *Case:* Why is using a slur *morally* wrong? Is this part of semantics or pragmatics/ethics?  
     - *Status:* **C** (major rift: **expressivists** say yes; **truth-conditionalists** say no).  

  ---

  ### **Meta-Analysis**  
  - **Most Damaging Desideratum:** **Offense Resilience (1)**. Kills naive truth-conditional views and weak prohibitionism.  
  - **"Jointly Unsatisfiable" Pair?** **Stability (1/5) vs. Reclamation (4)** is the hottest tension. Theories strain to reconcile rigid offense with contextual flexibility. *Your hunch is correct*—no theory fully resolves this.  
  - **Consensus Strong On:** 1, 2, 3, 5, 6.  
  - **Live Fights:** 4 (reclamation mechanics), 7 (neutral counterparts), 8 (wrongness in semantics).  

  ---

  ### **Theory Scorecard (1 Sentence Each)**  
  - **Truth-Conditional (e.g., Hom 2008):** Handles 2,3 but fails 1,5 (offense not embedded).  
  - **Prohibitionism (e.g., Anderson & Lepore):** Explains 5 but flattens 2,3,4 (no semantic content).  
  - **Expressivism (e.g., Potts 2007, Jeshion 2013):** Nails 1,5,6 but struggles with 3 (empty extensions) and 4 (reclamation).  
  - **Presuppositional (e.g., Schlenker 2007):** Best at 1,2,3; treats offense as backgrounded content—but 4 (reclamation) and 7 (universal neutrals) remain thorny.  

  **Tactical note:** Hammer **Offense Resilience** and **Reclamation** to expose weaknesses. Challenge any theory that assumes **universal neutral counterparts (7)**—cite slurs for disabled people or mixed-race groups where neutrals are contested. Separate semantics from ethics (**8**) unless reading expressivism.  

  Good luck—walk in skeptical!
