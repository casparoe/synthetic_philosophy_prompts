prompt: |-
  I teach an upper-level undergraduate seminar in political theory on defeat and collective memory — eighteen students, nearly all seniors — and I am writing their three-hour, closed-book final. Over the term we worked through four cases in which a military or political disaster was converted into a usable national story: the Confederacy's Lost Cause, Masada, the Battle of Kosovo in 1389 and the myth that grew up around it, and Dunkirk. The final has two essay questions; the one I need from you is worth 25 of the 100 marks, and students will have roughly fifty minutes on it. They will have nothing in the room with them, so the question must supply whatever historical detail it depends on, and neither the question nor the model answer should require or provide citations. Please do not attribute positions to named scholars or books; if a view has an author, describe the view instead.

  Here is the difficulty I want the question to sit on. The distinction my students arrive with, and the one our reading tends to reinforce, is between tragic memory and redemptive myth: a defeat is either remembered as loss and warning, or reframed as a moral victory that was worth the cost. That distinction is useless for sorting these cases, because it puts Dunkirk and the Lost Cause on the same side — both redemptive, both converting catastrophe into proof of character — and puts Masada and Kosovo on the same side, both binding sacrifice to a covenant and a promised future. That is precisely the wrong grouping, since in ordinary liberal usage the first pair and the second pair are supposed to be the tolerable and the intolerable cases. So I have been working with a candidate criterion of my own, which for seminar purposes I call the creditor test. Every redemptive myth of defeat is a story about a debt the dead left outstanding, and the test asks whom the myth makes a debtor. An inward-debt myth binds the living only to their own future: endure, rebuild, keep faith, do not let it happen again. An outward-debt myth generates claims on other people — on land, on status, on submission, on redress, on revenge. I think this sorts the cases better, but I am not confident it survives contact with them, and I want the question built exactly where it strains. Four pressure points, which you may use, sharpen, or replace: Dunkirk looks purely inward-facing, yet it was pressed into service as a justification for holding an empire and for treating a rout as a moral triumph, and its most beloved image, the flotilla of little ships, sits on top of the fact that most of the men came off naval vessels and along the harbor mole; Masada looks inward and is usually retold that way, while resting on a single ancient account whose defenders are a band of Sicarii rather than a national army; the Lost Cause looks outward in its claims against Black citizens and against the federal government, yet it also supplied a defeated region with a genuinely inward-facing self-image of endurance; and Kosovo looks outward in its modern nationalist uses while apparently having functioned under Ottoman rule as a fatalistic accommodation to that rule rather than a claim against it.

  What I want is one essay question, not a set. It must be answerable from argument alone — a fluent narration of any one of the four cases should not carry a student past the midpoint — and it should force the student either to reconstruct a criterion of their own or to take mine apart, and to say what case or what evidence would falsify whichever criterion they defend. Build the creditor test into the stem, stated crisply enough that a student who has never encountered it can work with it in fifty minutes, and leave room for a strong answer to conclude that the test grades the wrong feature entirely. Then give me: (1) the question exactly as students would see it, including any supplied detail; (2) a model answer of about nine hundred words that commits to a definite verdict on the test and argues for it rather than inventorying positions; (3) a marking scheme as a table with exactly these columns — band and mark range out of 25; the moves an answer must contain to earn that band; the characteristic failure that caps an answer at that band; the comment I would write in the margin; and a one-line diagnostic question I could ask in a viva that would reveal whether the student genuinely has the move or has merely landed on the right vocabulary; and (4) after the table, a short JSON object with the fields crux (one sentence on what the question really tests), recitation_ceiling (the highest mark a purely recitational answer can reach, and why), test_verdict (the model answer's committed verdict on the creditor test), discriminating_moves (an array of strings, each naming a move that separates a first-class answer from a merely good one), and strongest_objection (the best objection a student could raise against the framework built into the stem, and how the scheme credits it). I would much rather be told that my framework is wrong and given a better question built around a better criterion than be handed a hedge between the two: take a position and give your reasons for it. Please write everything in American English.
reasoning: |-
  We are creating an essay question that challenges the student to evaluate the "creditor test" as a criterion for distinguishing between different types of collective memory of defeat. The test is defined as follows: 
     - Inward-debt myth: binds the living to their own future (e.g., endure, rebuild, keep faith, prevent recurrence).
     - Outward-debt myth: generates claims on others (e.g., land, status, submission, redress, revenge).

   The four cases are:
     1. The Lost Cause (Confederacy): Typically seen as outward (claims against Black citizens and the federal government) but also provided an inward self-image of endurance for the defeated South.
     2. Masada: Often told as an inward-facing story of heroic last stand and commitment to freedom, but based on a small group (Sicarii) and sometimes used to inspire modern Israeli nationalism which can have outward implications.
     3. Kosovo (1389): Modern nationalist uses are outward (claims to land and against others), but under Ottoman rule it functioned as a fatalistic accommodation (inward?).
     4. Dunkirk: Seen as inward (the "Dunkirk spirit" of resilience) but was used to justify holding the empire (outward) and obscures the reality of the evacuation (most evacuated by naval vessels, not little ships).

   The question must:
     - Supply necessary historical detail.
     - Not require citations or mention specific scholars.
     - Force the student to either reconstruct a criterion or take apart the creditor test.
     - Ask what evidence would falsify the criterion they defend.

   We'll build the creditor test into the stem and leave room for the student to reject it.

   Essay question:

  "In this course, we have examined how societies transform military or political disasters into usable national stories. We initially considered a distinction between tragic memory (remembering defeat as loss and warning) and redemptive myth (reframing the defeat as a moral victory). However, this distinction groups the cases of Dunkirk and the Lost Cause together as redemptive, and Masada and Kosovo together as tragic, which obscures important differences. Instead, we have explored the 'creditor test' as an alternative criterion. The creditor test asks: whom does the myth make a debtor? An inward-debt myth binds the living only to their own future (e.g., to endure, rebuild, keep faith, or prevent recurrence). An outward-debt myth generates claims on other people (e.g., for land, status, submission, redress, or revenge).

  Drawing on at least three of the following cases — the Lost Cause (the Confederate memory of the American Civil War), Masada (the Roman siege of a Jewish fortress in 73-74 CE, where defenders chose mass suicide over surrender), the Battle of Kosovo (1389, where a Serbian-led coalition fought the Ottoman Empire and was defeated, leading to a rich mythic tradition), and Dunkirk (the evacuation of British and Allied troops from France in 1940, often remembered as a 'miracle' of civilian rescue) — write an essay that does the following:

  1. Evaluate the creditor test as a tool for understanding the differences among these cases. Does it provide a more useful framework than the initial tragic/redemptive distinction? Why or why not?
  2. Choose one case that you believe most severely tests the creditor test. Explain how this case either exposes a flaw in the test or demonstrates its strength. What evidence within that case would falsify the test (or your alternative criterion, if you propose one)?
  3. If you find the creditor test inadequate, propose and defend an alternative criterion that better accounts for the differences among these cases. If you defend the creditor test, explain how it withstands the challenges posed by the case you chose in part 2.

  Note: Your essay must engage directly with the creditor test and the cases. Avoid relying on recitation of case details; focus on argument."

   Model Answer (approximately 900 words):

  The creditor test, by focusing on the direction of the debt imposed by a myth of defeat, offers a promising but ultimately flawed framework for understanding collective memory. While it improves on the tragic-versus-redemptive distinction by revealing crucial differences between cases that the initial grouping obscures, it fails to account for the dynamic and context-dependent nature of collective memory. Specifically, the test is vulnerable to the way myths can be repurposed over time and the fact that a single myth often contains both inward and outward elements. The case of the Lost Cause most severely tests the creditor test, exposing its inability to capture the duality of myths that simultaneously bind a community inward and project claims outward.

  The creditor test does provide a valuable lens. It successfully distinguishes Dunkirk from the Lost Cause. Dunkirk, as an inward-debt myth, emphasizes national unity, resilience, and the duty to carry on the fight against Nazism. The debt is to the evacuated soldiers and the nation's own future: Britain must endure and ultimately prevail. The Lost Cause, by contrast, is outwardly directed: it demands the restoration of white supremacy, challenges federal authority, and seeks to vindicate the Confederacy. Similarly, the creditor test separates Masada from Kosovo in their modern forms. Masada, as retold in modern Israel, is an inward-debt myth: it calls for self-reliance and the prevention of another Holocaust, binding Israelis to their own survival. The Kosovo myth, in its 20th-century nationalist revival, is outwardly directed: it demands the reclamation of Kosovo as Serbian land and justifies resistance against Albanians and others.

  However, the creditor test stumbles when confronted with the complexity of the Lost Cause. The Lost Cause does more than project outward claims; it also served as an inward-binding force for the defeated South. It provided a narrative of honor and sacrifice that allowed Southern whites to endure Reconstruction and economic hardship. The debt was not only to extract submission from Black citizens and concessions from the federal government but also to honor the Confederate dead by preserving a distinct Southern identity. This duality reveals a flaw in the creditor test: it forces a binary choice (inward vs. outward) when many myths operate in both directions simultaneously. Moreover, the test fails to account for how the same myth can shift over time. The Kosovo myth under Ottoman rule functioned as a form of fatalistic accommodation — an inward-debt myth that urged Serbs to endure Ottoman domination while keeping faith in a distant divine redemption. Only later did it become an outward-debt myth. The creditor test, by focusing on the debt's direction at a fixed point, misses this evolution.

  The case of the Lost Cause thus falsifies the creditor test if we require the test to assign one clear direction. Evidence that the Lost Cause was used both to build internal cohesion and to justify external claims shows that the test cannot adequately classify such myths. If we modify the test to allow for dual-direction myths, we lose its clarity and predictive power. An alternative criterion — the "audience test" — better captures the dynamics of collective memory. The audience test asks: to whom is the myth primarily addressed? Is it directed inward to the community itself (for self-definition and internal cohesion) or outward to others (for recognition, legitimacy, or intimidation)? This reframing accounts for duality: a myth can be told to multiple audiences, but its dominant audience determines its primary function. The Lost Cause was primarily addressed to Southern whites (inward) during Reconstruction to build solidarity, but later, during the Jim Crow era, it was directed outward to assert white supremacy. Dunkirk, even when used to justify empire, was primarily an inward-facing story told to Britons to bolster morale. The audience test also explains Kosovo: under the Ottomans, the myth was told among Serbs (inward), but in the 19th century, it was directed at the Ottoman Empire and other nations (outward) to support national liberation.

  The creditor test, while insightful, is too static and binary. The audience test offers a more flexible and dynamic criterion that can accommodate the multifaceted nature of collective memory without losing analytical power. It recognizes that the same myth can serve different purposes at different times or for different groups within a society, but by focusing on the primary audience, it provides a clearer tool for distinguishing cases. The enduring lesson is that collective memory is not a fixed artifact but a living tool, constantly reshaped by the needs of the present.

