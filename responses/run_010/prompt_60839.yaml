answer: |-
  ### Essay Question for Students

  **Question:**  
  This course has examined how societies transform military or political disasters into "usable" national stories. We began with a distinction between **tragic memory** (a defeat remembered as loss and warning) and **redemptive myth** (a defeat reframed as a moral victory). Yet this framework groups Dunkirk and the Lost Cause (Confederate memory of the Civil War) as redemptive, and Masada (the Roman siege of a Jewish fortress in 73–74 CE) and the Battle of Kosovo (1389, where a Serbian-led coalition fell to the Ottomans) as tragic. This obscures crucial differences: Dunkirk and Masada are often seen as defensible myths, while the Lost Cause and Kosovo’s nationalist revival are widely condemned.  

  To refine our analysis, we introduced the **creditor test**:  
  - **Inward-debt myths** bind the living to their own future (e.g., "endure, rebuild, keep faith").  
  - **Outward-debt myths** generate claims on others (e.g., land, status, revenge).  

  Using **at least three** of the four cases below, write an essay that:  
  1. **Evaluates the creditor test** as a tool for distinguishing these cases. Does it resolve the limitations of the tragic/redemptive distinction? Why or why not?  
  2. **Identifies one case** that most severely challenges the creditor test. Explain how this case exposes a flaw in the test—or, if you defend the test, how it withstands the challenge.  
  3. **Specifies what evidence** would falsify your preferred criterion (the creditor test or an alternative you propose).  

  **Case Summaries:**  
  - **Lost Cause**: After the Confederacy’s defeat (1865), this myth framed the South’s sacrifice as noble, emphasizing states’ rights and downplaying slavery. It demanded racial hierarchy ("outward" claims) but also fostered regional pride ("inward" endurance).  
  - **Masada**: Jewish defenders died by suicide during a Roman siege. The story (from historian Josephus) is often told as a call to Jewish resilience against extinction ("inward"). Yet the defenders were Sicarii (a militant sect), not a national army, and the myth later fueled territorial claims.  
  - **Kosovo**: A Serbian-led coalition lost to the Ottomans (1389). Under Ottoman rule, the myth emphasized fatalistic sacrifice to preserve Serbian identity ("inward"). Modern nationalists reframed it as a call to reclaim Kosovo ("outward").  
  - **Dunkirk**: The evacuation of Allied soldiers (1940) was celebrated as a "miracle" of civilian courage (small boats). This bolstered British resolve against Nazism ("inward"). Yet it obscured naval dominance in the rescue and justified colonial empire.  

  Your essay must:  
  - Use the creditor test as a starting point.  
  - Argue for or against its usefulness, or propose a better alternative.  
  - Avoid reciting case details; focus on conceptual evaluation.  

  ---

  ### Model Answer (Approx. 900 words)  
  The creditor test improves on the tragic/redemptive distinction by exposing why societies condemn myths like the Lost Cause while tolerating Dunkirk or Masada. It correctly identifies **outward claims** as the core problem: myths become toxic when they demand submission, land, or vengeance from others. The Lost Cause’s insistence on white supremacy and Kosovo’s nationalist calls for ethnic expulsion are outward debts that perpetuate conflict. By contrast, Dunkirk’s demand for national perseverance and Masada’s warning against future disunity impose inward debts, binding a community to its own future. Yet the test fails when a single myth **simultaneously generates inward and outward debts**, or when its function **changes across time**. The Lost Cause most severely tests this framework, revealing that the creditor test is reductionist. A better alternative—the **audience test**—focuses on whom the myth empowers.  

  The creditor test succeeds where the tragic/redemptive binary collapses. Dunkirk and the Lost Cause both redeem catastrophe, but the creditor test distinguishes them: Dunkirk’s "spirit" obligated Britons to defend their homeland (inward), while the Lost Cause obligated America to restore the South’s racial order (outward). Similarly, Masada and Kosovo both involve tragic sacrifice, but Masada’s debt ("never again") is inward (a duty to Jewish survival), while Kosovo’s modern iteration demands Albanian displacement (outward). This explains liberal tolerance: inward myths focus on self-improvement; outward myths incite domination.  

  However, the Lost Cause exposes the creditor test’s flaw. It is not purely outward. For defeated Southerners, it was a lifeline of dignity—an inward debt to honor ancestors by enduring Reconstruction. This duality defies binary categorization. If we label it outward for its racial claims, we ignore how it sustained a broken community inwardly. Conversely, if we call it inward, we absolve its harm. The test cannot resolve this tension because it treats directionality as static. Kosovo’s evolution compounds this: as an inward anchor under Ottoman rule, it became an outward weapon in the 1990s. The creditor test grades direction at a single point, missing how myths mutate with political needs. Dunkirk’s imperial justification—using the "little ships" to legitimize holding colonies—further shows how inward myths can quietly serve outward agendas.  

  These cases falsify the creditor test if we require exclusive categorization. Evidence that the Lost Cause **simultaneously** fostered Southern resilience *and* white supremacy would break the inward/outward binary. Similarly, evidence that Masada—often framed as inwardly unifying—was invoked to justify displacing Palestinians in Israel’s founding would expose the test’s blindness to dual use.  

  The creditor test’s core weakness is its **neglect of power**. A stronger alternative is the **audience test**: *Whom does the myth equip with agency?*  
  - **Internal audiences** (e.g., Britons after Dunkirk, Southerners post-1865) receive tools for endurance.  
  - **External targets** (e.g., Black citizens under Jim Crow, Albanians in Kosovo) face subjugation.  

  This reframes the Lost Cause: it gave *white Southerners* agency to rebuild (inward function) while denying agency to Black citizens (outward disempowerment). Dunkirk empowered Britons to resist fascism but implicitly denied agency to colonized peoples by upholding empire. The audience test thus captures duality: a myth can empower one group while disempowering another. It also explains evolution. Kosovo’s Ottoman-era audience was Serbs seeking cultural survival; its 1990s audience was nationalists seizing land.  

  The creditor test is not useless—it identifies toxic external claims—but the audience test better diagnoses harm. Myths become dangerous not when they impose debt, but when they **strip agency from others**. This falsifies if a myth demonstrably empowers all groups (e.g., a shared tragedy fostering mutual reconciliation). No case here meets that standard. The audience test thus sorts the cases: Dunkirk and Masada *primarily* empower the defeated (tolerable); the Lost Cause and Kosovo’s revival *primarily* disempower scapegoats (intolerable). It accepts complexity but demands moral accountability.  

  ---

  ### Marking Scheme  

  | Band | Mark Range | Required Moves                                                                 | Characteristic Failure                                  | Margin Comment                                     | Viva Diagnostic Question                          |  
  |------|------------|-------------------------------------------------------------------------------|--------------------------------------------------------|---------------------------------------------------|--------------------------------------------------|  
  | A+   | 22–25      | 1. Critiques creditor test via duality/change; 2. Proposes coherent alternative; 3. Uses falsification; 4. Uses 3+ cases to contrast frameworks | Treats cases statically; no falsification              | "Strong on how Kosovo’s evolution breaks the test" | "If Masada inspired settler claims, does your audience test still call it inward?" |  
  | A    | 18–21      | 1. Explains creditor test’s strengths/weaknesses; 2. Identifies a pressure point; 3. Engages falsification | Defends/rejects test superficially; minimal falsification | "Lost Cause duality noted but not resolved"       | "How would the creditor test categorize Ottoman-era Kosovo?" |  
  | B    | 14–17      | 1. Defines creditor test; 2. Applies it to 3 cases; 3. Notes one challenge    | Recites cases; no evaluation of test                   | "Describe less, argue more: does the test work?"  | "What makes Dunkirk inward if it justified empire?" |  
  | C    | 10–13      | 1. Mentions creditor test; 2. Uses 2 cases descriptively                     | Confuses test/cases; minimal analysis                  | "What is outward debt in Masada?"                 | "Define inward vs. outward debt."                |  
  | D    | 5–9        | 1. Incomplete case use; 2. Vague reference to test                           | Major errors; incoherent                               | "Revisit the creditor test definition"            | "Which case is purely inward?"                   |  
  | F    | 0–4        | Fails to engage question or cases                                            | Off-topic; severe inaccuracies                         | "Address the creditor test directly"              | "What is the tragic/redemptive distinction?"     |  

