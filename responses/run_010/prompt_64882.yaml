  Here is a speech crafted to honor your wife's specific wishes, navigate the sensitivities with her sister, provide comfort grounded in reality, and incorporate the Michigan memory. It presents her view as her chosen perspective, not scientific doctrine.

  **(Begin Speech - Approx. 6 minutes)**

  Friends, family, thank you for being here for [Wife's Name]. It means a great deal. These last days have been… well, words don’t quite cover it. Standing here feels impossible, but I promised her I would, and I promised her *how* I would. So, I need to be clear about that first.

  [Wife's Name] was very specific about what she didn’t want said today. She didn’t permit talk of her having "gone," or "passed on," or "left us." She didn’t want anyone saying she’s "at peace now," or that she "lives on in us" in a way that means she’s still experiencing things. She didn’t allow the word "soul." And she absolutely didn’t want anyone saying she’s watching over us. She felt strongly that these ideas, however comforting to some, simply weren’t true to how she saw the world.

  Now, that leaves a gap, doesn’t it? What *can* we say? How do we talk about someone who isn’t here? What comfort is left? Well, she found her own answer, especially in this last year. It became a kind of map for her, a way of understanding her place in things, even from her bed.

  It came from her love of the stars. She found an idea – not a new one, but new to her – about time. It’s hard to explain simply, but she worked hard to explain it to me. She said that the idea of a single, universal "now" – one moment that everyone, everywhere, agrees is happening right this second – that idea doesn’t hold up. It depends on how you're moving. She’d give an example: two people passing each other on the street, one heading towards a distant galaxy, one heading away… they wouldn’t agree on whether some huge event far, far away had already happened or was still to come. Their "nows" would slice the universe differently.

  And she argued this: If you can’t say that one person’s "now" is more real than another’s just because they’re walking east instead of west, then how can you say that only *this* instant, *our* present, is truly real? She believed it meant that everything – past, present, and future – must be equally real. The past isn’t gone, wiped out. It’s not destroyed. It’s just… elsewhere. Fixed in its place. Still part of the whole fabric.

  **This was her map.** This was the picture she chose to hold onto. It wasn't about science proving she was somehow still present or conscious. Her sister, who knows physics deeply, would rightly point out that physics doesn't dictate *this* particular view of reality; it comes from a philosophical choice [Wife's Name] made about what "real" must mean. She wouldn’t want anyone leaving here thinking science says she’s still around. That wasn’t her point.

  Her point was about the *enduring reality* of everything that happened. The life she lived. The love she felt. The moments we shared. They aren’t erased. They are fixed, permanent parts of what is real. They happened. They *are*, in that sense, just as real as this moment right now.

  And that brings me to Michigan. The summer of 1974. That little lake. It wasn't fancy, but it was perfect. We were so young. We spent weeks there, swimming, lying on the dock watching clouds, talking about everything and nothing. The smell of pine needles and water. The sound of the loons at dusk. That feeling… of being utterly present, utterly happy, utterly together. It was pure, simple joy. [Wife's Name] returned to that lake almost every year for fifty years. Why? It wasn't just nostalgia. It was, I think, her touchstone. Proof that some things hold. That the peace, the connection, the sheer *aliveness* of that moment wasn’t lost just because it was 1974. It remained real. It anchored her.

  That’s what she believed about her own life, about all our lives. That the reality of who she was – her fierce intelligence, her dry humor, her patience showing me the stars through her telescope, her incredible strength running the store beside me for thirty-eight years, the deep love she had for all of you – that reality isn't contingent on this moment. It isn't erased. It exists, fixed and true, in the vast structure of what is real. She isn't *here*, experiencing this gathering. But the life she lived, the love she gave, the person she was – that is not gone. It is part of the permanent record.

  So, today, we mourn the absence of her presence, the silence where her voice should be. That pain is real and deep. But we also celebrate what *is* real: the indelible mark she left, the memories that haven't vanished, the love that shaped us. We hold onto the reality of her life. We hold onto the reality of that Michigan lake, not just as a memory, but as a testament that some moments are so real, they echo forever in the fabric of everything.

  Thank you for loving her. Thank you for remembering her reality.

  **(End Speech)**

  **Why this works:**

  1.  **Honors Her Prohibitions:** Explicitly states them upfront and avoids all forbidden language/concepts (no soul, no afterlife, no watching over, no "gone", "at peace", etc.).
  2.  **Presents Her View Accurately:** Explains the core of her chosen perspective ("everything is real," "the past is not destroyed, it is elsewhere") using her street-level analogy. Avoids technical terms.
  3.  **Respects the Sister & Physics:** Clearly separates her *philosophical choice* ("her map," "the picture she chose," "a philosophical choice") from scientific doctrine. States directly that physics doesn't dictate this view and that her sister disputes it. Underscores that it doesn't imply her continued presence or consciousness ("It wasn't about science proving she was somehow still present or conscious").
  4.  **Provides Grounded Comfort:** Offers comfort based on the enduring reality of her life, her love, and shared experiences ("The life she lived... They aren't erased... permanent parts of what is real"). Focuses on the *fact* of her existence and impact.
  5.  **Uses the Michigan Memory:** Weaves it in as tangible proof of the enduring reality of moments and feelings, fulfilling your request and providing a universally relatable emotional anchor. It embodies her philosophy in a lived experience.
  6.  **Accessible & Honest:** Uses simple language and one core image (the lake as a touchstone). Acknowledges the pain of absence while offering the comfort of her chosen perspective. Does not lie or betray her wishes.
  7.  **Manages the Audience:** Explicitly addresses the prohibitions for the churchgoing relatives upfront. Provides the astronomy club with a respectful and accurate (to her view) summary. Offers genuine comfort rooted in memory and love for everyone.
  8.  **"Paris Was" Issue:** Describes her life *in the past tense* ("She was," "She loved," "She ran") as factual statements about completed events, but consistently emphasizes the *enduring reality* of those events ("They *are*, in that sense, just as real"). It doesn't put *her* in the past tense as if she ceased to exist as a concept; it places the *events* of her life in the past while affirming their permanent reality.

  This speech stays true to her, respects the boundaries, navigates the family dynamics, and offers comfort based on the solid ground of her life and love, framed by the perspective she found meaningful. It allows you to speak honestly and honor her memory as she wished.
