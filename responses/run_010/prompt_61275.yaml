answer: |-
  Let's map this rich historical case onto the relativism framework, cutting through both the 1947 statement's nuances and the 1999 reversal's implications.

  **Dissecting the 1947 Statement:**

  1.  **Dominant Claim: Descriptive Relativism (DR):** This is the statement's explicit, undeniable core. It meticulously documents "respect for the many differing ways of life" and asserts that "standards and values are relative to the culture from which they derive." The emphasis is on the *fact* of profound moral/cultural diversity ("genuine differences"). It uses DR as the foundation for its warning: imposing a single standard ignores this diversity.

  2.  **Sliding into Normative Relativism (NR):** The statement doesn't just *describe* diversity; it draws a normative conclusion: tolerance and non-interference ("respect for differences between cultures," "the right of men to live in terms of their own traditions"). This slide is crucial and explicit: *Because* cultures differ fundamentally (DR), *therefore* one culture should not impose its values on another (NR). The "respect" urged is the normative consequence.

  3.  **Metaethical Relativism (MR) - Ambiguous and Contested:** This is the crux of your self-refutation question and the epistemic reading. The statement does **not** explicitly declare "There are no framework-independent moral truths." However, its language strongly *implies* or *leans* towards MR:
      *   "The rights of Man... cannot be conceived in terms of any single state."
      *   Values are "relative to the cultural background".
      *   It rejects the possibility of a "universal frame of reference" for judging *all* cultures. This is key.
      *   **The Self-Refutation Charge:** Critics rightly target this implied MR. If *all* values are framework-dependent (MR), then the normative injunction to "respect" other cultures (NR) is *itself* only valid within the AAA's (or Western anthropological) framework. It has no *binding* force on cultures that don't value tolerance or respect in that way. The statement *attempts* to ground NR in the anthropological *fact* of DR, but the *normative force* of "should respect" requires something more – an objective reason why tolerance is the *right* response to diversity, which MR explicitly denies. **Conclusion:** The critics *were* attacking a position strongly implied by the statement's logic and language. While it doesn't baldly state MR, its rejection of a universal frame and grounding of NR solely in DR makes it highly vulnerable to the charge. It built a trap for itself.

  4.  **Your Epistemic Reading ("Justification, not Truth"):** This is insightful and partially defensible, but likely lets them off *too* easy.
      *   **Survives?** Parts do. The statement heavily emphasizes the *practical impossibility* of cross-cultural ethical judgment ("lacking a scientific basis for such adjudication"). It's concerned with the imposition of *specific* Western values *without justification acceptable to others*. This *could* be read as epistemic caution: *We (anthropologists) have no reliable, universally acceptable procedure to justify imposing one set of values over another.*
      *   **Too Easy?** Yes, because the statement goes beyond epistemic caution. By declaring values "relative to the cultural background" and rejecting *any* universal frame, it ventures into the metaphysical territory of MR. It doesn't just say *we can't know* objective truth; it implies that such truth *doesn't exist* in a way that transcends frameworks. The rejection of a "universal frame of reference" suggests a denial of the very *possibility* of framework-independent truth, not just our current inability to access it.
      *   **Maritain vs. AAA:** Maritain's "agree on rights, disagree on why" is a *different*, though related, move. It's **pragmatic overlapping consensus.** It avoids the metaethical question *entirely*. It says: "We can agree on *what* needs protecting (the list of rights) for diverse *practical* or *prudential* reasons (natural law, divine command, social utility, avoiding horror), without needing shared foundations." The AAA statement, in contrast, *did* engage the metaethical question by rejecting the possibility of universal justification/foundation *at all*, making its tolerance injunction unstable. Maritain bypassed the metaphysical quagmire; the AAA waded in and got stuck.

  **The 1999 Reversal: What it Does (and Doesn't) Do to the Theory**

  The 1999 Declaration doesn't refute relativism wholesale; it represents a complex pragmatic shift largely driven by factors outside the relativism debate, though the debate illuminates the *nature* of the shift:

  1.  **What it Rejects:**
      *   **The Normative Conclusion of 1947 (NR):** It explicitly rejects the 1947's injunction against cross-cultural judgment/imposition. It embraces the legitimacy and necessity of anthropological engagement with human rights, including critique of violations.
      *   **The *Implication* of Absolute Incommensurability:** It rejects the 1947's underlying implication that cultural barriers are so absolute that *no* cross-cultural moral critique is possible. It acknowledges that certain harms are recognizable across cultures.

  2.  **What it Does NOT Necessarily Reject:**
      *   **Descriptive Relativism (DR):** It still acknowledges cultural diversity and the need for sensitivity to context. It doesn't claim all values are identical everywhere.
      *   **Metaethical Relativism (MR):** It doesn't *assert* the existence of objective, framework-independent moral truths. It *functions* as if some norms are universalizable, but its justification is primarily pragmatic and experiential, not metaphysical.

  3.  **What Explains the Shift? Relativism's Role:**
      *   **Relativism's Instability Under Pressure?** Partly. The 1947 position proved normatively inadequate in the face of large-scale, undeniable horrors (genocide, apartheid, ethnic cleansing, state failure). The purely tolerant stance became morally untenable for many anthropologists witnessing or documenting profound suffering. Normative Relativism buckled under the weight of *prima facie* universal wrongs.
      *   **The Limits of Descriptive Relativism:** The shift highlights that recognizing *differences* (DR) doesn't preclude recognizing shared *vulnerabilities* or *harms*. Anthropologists observed that while the *expression* of dignity or harm might differ, certain experiences (systematic violence, deprivation, humiliation) constituted profound harms across diverse cultural contexts. DR doesn't entail that cultures are morally opaque to each other.
      *   **Epistemic Humility Evolves, Doesn't Vanish:** The 1999 statement doesn't claim perfect, objective access to moral truth. It emphasizes context, dialogue, and avoiding ethnocentrism. This reflects a *matured* epistemic stance: acknowledging the *possibility* of cross-cultural understanding and judgment based on shared human experience and dialogue, while remaining critically aware of cultural difference and power dynamics. It moves *beyond* the 1947 epistemic paralysis ("no scientific basis") towards a more nuanced, engaged, yet still cautious, position.

  4.  **What the Shift IS Primarily:**
      *   **A Pragmatic and Moral Response to New Facts:** Genocide, ethnic cleansing, state collapse, and the growth of global human rights discourse provided overwhelming experiential evidence that some harms demand a response *despite* cultural differences. The shift is less a philosophical refutation of MR and more a recognition that the 1947 normative stance (NR) was practically and morally unsustainable in the face of extreme violence and suffering.
      *   **An Institutional Update:** The AAA updated its professional ethics and public stance based on decades of fieldwork, engagement with global politics, and the lived experience of its members witnessing atrocities. It prioritized preventing harm over a strict interpretation of cultural autonomy.
      *   **A Move Towards Overlapping Consensus (Maritain-style):** The 1999 statement grounds its support for human rights in diverse anthropological perspectives (cultural survival, social justice, resistance to oppression) and the pragmatic need to address widespread, recognizable suffering. It avoids asserting a single, universal philosophical foundation, focusing instead on shared goals and the urgency of preventing specific harms. This mirrors Maritain's pragmatic approach.

  **Conclusion: What the Relativism Debate Explains**

  *   **It explains the 1947 statement's core argument (DR → NR) and its fatal flaw (the slide towards implied MR making NR self-undermining).**
  *   **It explains the *nature* of the 1999 shift:** rejecting the *normative paralysis* of the 1947 position and demonstrating the practical/moral *instability* of strong normative relativism when confronted with extreme harm. It highlights how descriptive relativism doesn't preclude recognizing cross-cultural harms.
  *   **It illuminates the *epistemic shift*:** from "no possible adjudication" (1947) to "adjudication is difficult but possible and necessary through dialogue, context, and recognition of shared vulnerabilities" (1999).

  **What it Doesn't Explain (or Force):**

  *   **It does not prove MR false.** The 1999 statement doesn't engage the metaphysical question. It operates pragmatically.
  *   **It does not mean DR was abandoned.** Cultural sensitivity and awareness of difference remain central.
  *   **The primary driver was experiential/pragmatic:** responses to genocide, global politics, and the felt need to act against suffering, not a philosophical disproof of relativism. The relativism debate helps us *analyze* the shift philosophically, but it didn't *cause* it. The arc is best understood as an institution grappling with the *practical consequences* of taking descriptive relativism to its apparent normative conclusion, finding that conclusion inadequate, and adopting a more engaged stance grounded in pragmatism and a minimal, experientially-based universalism focused on preventing severe harm. The silence on deep metaethics remains.
