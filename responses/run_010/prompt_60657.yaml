  I'm applying for a one-year research fellowship and need a proposal of about 800 words. My half-formed idea: it is sometimes said that if the simulation argument goes through, giving enormous weight to the far future loses its force — we would be simulated, the simulation could be switched off at any moment, and nothing we do would reach the reality running it. But that quick move runs together three channels that pull in different directions: a simulation is likely to be shorter than the world simulating it; its inhabitants have less unmediated causal control over what follows; and our being simulated would itself be evidence that some civilizations survive long enough to run ancestor simulations, which cuts the other way. Nobody seems to have asked whether the three cancel. Turn this into a proposal: the question stated precisely enough to have a determinate answer; why neither longtermism nor the objection that we cannot foresee the long-run effects of our acts settles it; the method, and why a decision-theoretic rather than an empirical project is the right one here; what a result would look like and what would count as failure, including the possibility that the question dissolves under analysis; and a work plan for the year in three or four blocks. No bibliography — I'll add the references myself. And please commit: give me one question and one method, defended with reasons, not a menu of options for me to choose between.
