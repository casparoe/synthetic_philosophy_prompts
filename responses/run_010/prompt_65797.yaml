  - Acknowledge the brother's valid pain about their father's choice without endorsing or condemning it
  - Honor the father's radical generosity while avoiding any prescriptive tone ("you should do this too")
  - Sit comfortably with the paradox of a man who was deeply involved in daily family life yet treated his children and strangers equally in his final financial act
  - Avoid all clichés about charity or platitudes about "what he'd want"

  The user's philosophical research is fascinating - especially Bernard Williams' "one thought too many" concept that perfectly articulates the brother's unspoken objection. But we must bury that academic framework beneath plain language. The swimming coach detail is crucial - it proves his partiality wasn't performative but consistent.

  Hmm... the emotional landmines are everywhere. If we lean into the sister's saint narrative, we alienate the brother. If we validate the brother's hurt, we betray the user's conviction that their father wasn't wrong. The solution might be in the user's own phrasing: "I do not have a clean account." We should make the lack of resolution the point - not as evasion, but as testament to the father's complexity.

  For structure:
  Open with tactile memories (the dog sleeping spots, swim practice) to ground the abstract conflict in lived warmth. Then introduce the inheritance reveal as a "second story" that seems contradictory. Use the swimming coaching detail to prove his capacity for devotion. When addressing the estate decision, borrow the user's "ran the numbers" phrasing but immediately counter with "he never treated us like numbers." 

  The forbidden phrases are helpful guardrails - they force us toward originality. Instead of "every little bit helps," we'll focus on his consistency: giving quietly since the 90s. For the ethical tension, maybe: "When both sides of an argument sound true, sometimes the truth is holding both." 

  Biggest risk is sounding like we're defending the father against the brother. Must constantly loop back to observable facts: He loved intensely AND gave radically. The mystery isn't a problem to solve but a reality to sit with. Closing image of the siblings carrying different pieces resonates because it doesn't force reconciliation.

  This will hurt to hear. But the user is clearly ready for that. Their constraints show extraordinary emotional intelligence - especially banning "he'd want you to" which prevents co-opting the father's voice. We'll mirror that precision.
answer: |-
  Here’s a draft honoring your constraints, your father’s complexity, and the room’s need for honesty without resolution. Aim for roughly 5-6 minutes spoken aloud.

  ---

  **(Start warmly, look around)**
  Thank you all for coming. It means a lot to see you here for Dad. Most of you knew him pretty well – some for decades. You know he was an actuary. Numbers were his world, his job, his language. He saw patterns, calculated risks, understood odds. And he was *very* good at it.

  But the man we knew… the man who drove forty minutes each way, twice a week for *six years*, just to coach my swim team when I was frankly terrible at it… that wasn't just numbers. That was commitment. Pure, stubborn, time-and-gasoline commitment. He knew which of our dogs slept on which couch cushion. He knew our friends' names, our schedules, the little things that made us tick or drove us crazy. He was right here. Present. Involved. In the messy, everyday stuff of being a dad and a husband and a friend.

  **(Slight shift in tone, more reflective)**
  So, when we learned what he did with his money… it hit different. Three weeks ago, we found out that since the late nineties, quietly, without fanfare, he'd been routing a huge chunk of his income, and then nearly all of his estate, into a fund to help others. A lot of others. What he left us kids was a specific amount: four thousand dollars each. And a note. A short one. It said he hoped we wouldn't read that number as an apology, because he wasn't apologizing.

  **(Acknowledge the tension directly but neutrally)**
  That note… it landed hard. For each of us, in different ways. My sister sees the incredible generosity in it. The quiet, lifelong commitment to something bigger. And she’s right. That *is* there. It’s real, and it’s powerful.

  My brother… he feels something else. He feels like that number, that choice, says something about how Dad saw *us*. Like maybe Dad ran the numbers on his own kids and decided we were… equal. Just equal with strangers out there somewhere. And that thought… that hurts. Deeply. It feels like something fundamental might be missing. And that feeling? That’s real too. It’s not about the money. It’s about what that choice *means* when it comes from the man who drove to all those swim practices.

  **(The core honesty - no resolution)**
  And honestly? I get both sides. I wrestle with it myself. Because here’s the thing I keep circling: How do you hold *both* of these Dad’s in your head? The Dad who knew exactly which brand of cereal I hated? And the Dad who made this enormous, calculated, impersonal-seeming choice with everything he'd built?

  **(Pause, look at the audience)**
  I don’t have a clean answer. I don’t have a neat little phrase that ties it all up with a bow and makes everyone feel okay. He wasn’t cold here and generous out there. He was warm *here*, deeply involved *here*, and he gave the estate away anyway.

  **(Address the "what if everyone" thought without taking sides)**
  People talk about choices like this. "What if everyone did it?" Some say that’s the point – imagine the good. Others say that exact thought is just an excuse people use *not* to do anything. And you know what? Both those voices… they’re probably sitting right here in this room today. Both of them are trying to make sense of the world, trying to figure out the right thing. Dad heard those arguments too, I’m sure. But he wasn’t making a speech. He wasn’t writing a rulebook. He was just… doing what he decided to do. Quietly. For decades. Without needing us, or maybe anyone, to agree with him.

  **(Landing: Focus on the man, the mystery, the shared space)**
  So, what do we say about him today? We say he loved his work, those patterns and probabilities. We say he loved his family – fiercely, practically, showing up for swim meets and dinners and the small stuff. We say he loved his wife, our mom, with a quiet, steady devotion. We say he made a choice about his money that was huge, and deliberate, and leaves us with big questions we won’t solve today.

  He wasn’t a saint on a pedestal. He wasn’t a calculator without a heart. He was Bob. [Use his name]. Complicated. Stubborn in his ways. Deeply loving in his actions right here at home. And utterly committed, in his own quiet way, to an idea of giving that most of us would find… well, let’s just say, challenging.

  **(Final words, inclusive)**
  He left us with four thousand dollars, and a note saying not to take it as an apology. He also left us with decades of memories – the drives, the dog hair on the couch, the way he knew your name and your kid’s name. And he left us with this… this complicated feeling. This question without an easy answer.

  Today isn’t about agreeing on the answer. It’s not about telling anyone what to do with their money or their choices. It’s about remembering the whole man. The actuary. The coach. The husband. The dad. The quiet giver. The guy who showed up. However we each feel about that final choice, we’re here because he mattered. He mattered in all those ordinary, wonderful, frustrating, real ways. And we’ll miss him. All of him. Thanks, Dad.

  ---

  **Why this works with your constraints:**

  1.  **No Prescription:** It explicitly avoids telling anyone what to do ("Today isn't about... telling anyone what to do...").
  2.  **No Concession:** It doesn't say he was wrong. It presents his choice as deliberate, significant, and linked to who he was, without condemning it. It validates the *feeling* of something missing without agreeing the choice *was* wrong.
  3.  **Honors Brother's Objection:** It states the brother's feeling ("it hurts... something fundamental might be missing") clearly, sympathetically, and allows it to sit in the room ("that feeling? That's real too"). It doesn't refute it or try to explain it away. The "how do you hold both?" section directly addresses the core tension he feels.
  4.  **Honest about the Paradox:** The entire "core honesty" section ("How do you hold both...") centers the unresolved tension. It uses the swim team/dog details *specifically* to ground the paradox in lived warmth. It explicitly rejects a "neat turn" ("I don’t have a clean answer... no neat little phrase").
  5.  **Navigates the "What if everyone" Argument:** It acknowledges both common perspectives neutrally ("Both those voices... they’re probably sitting right here"), links them to a universal human struggle ("trying to make sense of the world"), and then dismisses them *as irrelevant to describing Dad's personal choice* ("But he wasn’t making a speech... He was just… doing what he decided").
  6.  **Banned Phrases Avoided:** Scrupulously avoids all listed clichés. Focuses on *his* specific actions and choices, not generalities.
  7.  **Landing for Both Siblings:** Ends by naming the specific feelings ("complicated feeling," "question without an easy answer"), explicitly states the day is *not* about agreeing on the answer, and refocuses on remembering the *whole* man and the shared, tangible memories ("the drives, the dog hair..."). Names him personally ("Bob"). Concludes with "we'll miss him. All of him." which allows both siblings to find their truth within "all of him."
  8.  **Plain Language & Humor:** Uses simple, concrete language and images (swim practice, dog hair, cereal, couch cushions). The "frankly terrible at it" about swimming is the touch of self-deprecating humor. The "time-and-gasoline commitment" is slightly wry. Avoids philosophy jargon entirely; the Williams "thought too many" concept is embodied in the brother's feeling and the unresolved tension, not named.
  9.  **Weight on the Paradox:** The central section ("How do you hold *both*...") is the emotional and philosophical core, delivered plainly. The contrast between the intensely personal details and the impersonal scale of the giving carries the weight.

  **Delivery Tip:** Pauses are crucial, especially after stating the brother's feeling, the core paradox ("How do you hold both..."), and the acknowledgment of the differing voices in the room. Speak the memories warmly, the financial reveal matter-of-factly but with gravity, and the unresolved tension with honest uncertainty. Look at your siblings when acknowledging their specific perspectives.
