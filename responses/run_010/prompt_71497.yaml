answer: |-
  ## MEMORANDUM

  **TO:** Research, Evaluation, and Accountability Committee Members  
  **FROM:** [Your Name], Committee Chair  
  **DATE:** October 25, 2023  
  **SUBJECT:** Literacy Pilot Evaluation, Annual Report Card Presentation, and Funding Recommendation for Expansion  

  **EXECUTIVE SUMMARY**  
  The committee faces three intertwined decisions regarding the two-year literacy pilot: (1) what the annual public report card should present, (2) whether to fund expansion at $1.8 million, and (3) whether to change screening/identification practices. Based on the data and inherent complexities, **I recommend:**  

  1.  **Report Card:** Present **both** the overall proficiency rate *and* the subgroup comparisons, accompanied by explicit annotations explaining:
      *   Why identification rates differ significantly between groups.
      *   That subgroup comparisons may reflect program impact *on served students* but are not pure apples-to-apples due to identification being program-dependent.
      *   The impact on the state accountability index.
  2.  **Expansion Funding:** **Approve conditional expansion funding** for Fall 2024, but **only** for the *current nine pilot schools*, contingent on implementing an improved evaluation design for the 2024-25 school year. Defer district-wide expansion decision until Spring 2025 based on that enhanced data.
  3.  **Screening/Identification:** **Maintain universal screening** in the pilot model. **Do not** change identification criteria based solely on this data, but task staff with analyzing the impact of higher identification rates on resource allocation and student outcomes longitudinally.  

  **Crucially, neither the overall nor the subgroup table, by itself, definitively answers the core question: "Did the pilot program *cause* better outcomes for the students in the pilot schools?"** The subgroup data suggests positive effects *for students receiving services*, but the overall data reflects the pilot's net impact *in its specific context* (higher identification rate, potentially higher needs). The strongest evidence we lack is a comparison of outcomes using a *consistent identification method* applied *before* program start. The data we have provides suggestive, but not conclusive, evidence on program effectiveness, heavily influenced by *how* students are categorized and *why* schools volunteered.  

  **The Core Data and Interpretations**  
  Our analyst provided the following results for third-grade reading proficiency:  

  *   **Pilot Schools (9 schools):** 49.7% Proficient (2,980 / 6,000)
      *   Not Identified: 68.0% Proficient (2,380 / 3,500)
      *   Identified: 24.0% Proficient (600 / 2,500)
  *   **Comparison Schools (14 schools):** 55.2% Proficient (5,520 / 10,000)
      *   Not Identified: 64.0% Proficient (5,120 / 8,000)
      *   Identified: 20.0% Proficient (400 / 2,000)

  This presents an apparent paradox: the pilot subgroups outperform their comparison counterparts by approximately 4 percentage points each, yet the pilot schools *overall* lag the comparison schools by 5.5 percentage points. The key driver is the dramatically higher identification rate in pilot schools (41.7% vs. 20.0%), resulting in a larger proportion of students in the lower-performing "identified" subgroup within the pilot group.

  **What Do These Tables Actually Show (and Not Show)?**  

  1.  **The Subgroup Table (Proponents' Focus):** This table suggests that students receiving services *within the pilot model* performed better (24.0% vs. 20.0%) than similar students in the comparison schools, and non-identified students also performed better (68.0% vs. 64.0%). This is the core argument for the pilot's effectiveness *on the students it served*.  
      *   **Limitations:** The critical flaw, as our psychometrician highlights, is that "identification" is not a fixed characteristic like gender. The pilot's universal screening *actively created* the larger "identified" group. We cannot know how many of the 2,500 pilot-identified students would *ever* have been identified under the referral system (perhaps only 1,000?), or how the 1,000 additional identified students would have performed *without* the pilot's intervention. This makes direct comparisons of "identified" students across groups potentially misleading. The higher subgroup scores could reflect true program impact, or they could partly reflect the inclusion of students with milder needs who were previously missed by referrals.

  2.  **The Overall Table (CFO's Focus):** This table shows the net result: a lower proportion of students meeting proficiency in the pilot schools compared to the comparison schools. The CFO's argument deserves a strong, fair hearing:  
      *   **Clarity and Verifiability:** The overall proficiency rate (49.7% vs 55.2%) is simple, unambiguous, and directly calculable from public state assessment data. Parents, reporters, and the community can easily access and understand this figure. It requires no statistical modeling or acceptance of categorization rules. It reflects the *lived reality* of the outcome metric for all third graders in those schools.  
      *   **Real-World Consequence:** The state's accountability system uses this overall rate. Regardless of our internal analysis or report card annotations, the pilot schools *will* see a drop in their ratings this year based on this publicly reported figure. Ignoring or downplaying it in our report card risks appearing evasive or out of touch with the metric that officially defines school performance for the state and the public.  
      *   **Net Impact:** This figure represents the *net effect* of the pilot program *as implemented* in its specific context (higher identification, different schools). It answers the practical question: "What happened to the overall proficiency rate in schools using this model compared to others?" The answer, based on this data, is that it was lower. This could be due to the higher identification rate pulling down the average, underlying differences in the student populations not fully captured by subgroup labels, or other factors – but the outcome itself is a concrete reality with consequences.  

  **The Honest Answer:** Neither table, by itself, provides a definitive causal answer about the pilot's effectiveness. The subgroup comparisons are confounded by the program-dependent nature of identification. The overall comparison is confounded by pre-existing differences between the volunteer pilot schools and the comparison schools (including higher poverty, as noted) and the very different identification rates the program induced. **The evidence we *most critically lack* is a baseline assessment using a *consistent screening method* applied to *all* schools *before* the pilot began, allowing us to track outcomes for students with similar baseline needs in both groups.** This would move us closer to isolating the program's effect.

  **Key Complications and Assumptions**  
  Our interpretation hinges on two critical and uncertain assumptions:

  1.  **The Nature of Identification:** How comparable are the "identified" students across groups? If the pilot's screening truly found students with needs similar to those identified via referral in the comparison schools *plus* students with milder needs who benefit less from intensive intervention, the 4-point gain in the identified subgroup might overstate the program's impact on the students who would have been identified anyway. Conversely, if the referral system missed many students with significant needs, the pilot's gain might be understated or reflect preventing more severe outcomes. **This is the *most critical assumption* to press our analyst on before Thursday.** Ask: "Based on the screening tool and referral data, can we estimate the potential overlap between students identified by the pilot and those who *likely* would have been referred in the comparison system? What does the distribution of screening scores suggest about the needs of the additionally identified students?"

  2.  **Volunteer Effect & Poverty Difference:** The pilot schools self-selected and serve higher-poverty neighborhoods. While we have subgroup data, poverty (and other unmeasured factors like school culture, leadership, or prior initiatives) likely varies *within* the "identified" and "not identified" subgroups too. Did the pilot schools volunteer *because* they were struggling and saw a greater need? Or because they were more innovative and capable? This pre-existing difference could bias the results in either direction. **Press the analyst:** "What quantitative data (beyond subgroup labels like Free/Reduced Lunch) do we have to characterize the poverty gap *within* the identified/not-identified subgroups? Are there other pre-existing trend data (e.g., prior year scores) suggesting differences in trajectory before the pilot?"

  **Recommendations & Rationale**  

  1.  **Annual Report Card Presentation:**
      *   **Present Both:** Include both the overall proficiency rate (49.7% for Pilot, 55.2% for Comparison) and the subgroup breakdowns.
      *   **Mandatory Annotations:** Accompany the data with clear, concise annotations:
          >   "Note: The pilot program utilized universal screening, identifying 41.7% of third graders for literacy support services, compared to 20.0% identified via referral in comparison schools. This difference in identification rates significantly impacts the overall proficiency comparison. Subgroup comparisons (Identified/Not Identified) may reflect program impact on students served but are not direct comparisons of identical student groups due to differences in identification methods and rates. The overall proficiency rate is used in the state's accountability index."
      *   **Rationale:** Transparency demands acknowledging both the internal evidence suggesting benefit for served students *and* the net outcome that affects school ratings and public perception. The annotations directly address the core complexities (identification method, state rating impact) without requiring statistical sophistication. Ignoring the overall rate is impractical and undermines credibility. Suppressing the subgroup gains obscures a potentially important positive signal.

  2.  **Funding Expansion:**
      *   **Recommendation:** Approve funding **only for continuing the pilot in the existing nine schools** for the 2024-25 school year ($1.8M estimate). **Explicitly condition this funding** on the design and implementation of a rigorous evaluation plan for the coming year. **Defer** the decision on district-wide expansion until Spring 2025, pending results from the enhanced evaluation.
      *   **Enhanced Evaluation Requirements:** The evaluation must include, at minimum:
          *   **Baseline Fall Screening:** Implement the *pilot's screening tool* in *both* the continuing pilot schools *and* a carefully matched set of comparison schools *at the start* of the 2024-25 school year (e.g., Grade 2 or early Grade 3).
          *   **Consistent Outcome Tracking:** Track the reading proficiency of students in both groups using the state assessment or another agreed-upon metric, analyzing results based on *baseline screening scores/risk levels* rather than (or in addition to) program-dependent identification status.
          *   **Resource & Implementation Fidelity Tracking:** Document the actual resources (staff time, materials) used per identified student and monitor fidelity to the small-group instruction model.
      *   **Rationale:** The current data, while showing promise in the subgroups and highlighting a systemic issue (under-identification via referral), is too confounded by identification differences and selection bias to justify a $1.8M *district-wide* expansion. The subgroup gains (4 points) are meaningful but not overwhelmingly large given the costs and complexities. However, discontinuing the pilot now risks losing potential momentum and alienating the schools that volunteered. Funding continuation *only* for the existing schools, with a mandate for a vastly improved evaluation, is a responsible middle path. It allows us to gather the crucial baseline data we currently lack, provides more time to refine implementation, and generates evidence strong enough to support a confident district-wide decision next year. It also mitigates the risk of scaling a program with an unclear net impact.

  3.  **Screening and Identification Changes:**
      *   **Recommendation:** **Maintain universal screening** as a core component of the pilot program in the continuing schools. **Do not recommend changing identification thresholds or service eligibility criteria district-wide** based solely on this data.
      *   **Further Analysis:** Direct the analyst to conduct a deeper dive using available data (screening scores, prior performance, possibly longitudinal tracking if feasible) to investigate:
          *   The performance trajectory of the students identified *only* by the pilot screening vs. those who likely would have been referred.
          *   The resource implications (cost per student, staffing needs) of the higher identification rate.
      *   **Rationale:** The higher identification rate is a direct consequence of replacing a passive referral system with active screening. While it lowered the *overall* proficiency rate in the short term, it likely reflects a more accurate identification of need – a systemic issue the pilot aimed to address. Changing thresholds based solely on this outcome snapshot could lead us back to under-identification. The priority should be understanding the needs and outcomes of the additionally identified students and ensuring adequate resources, not redefining need based on one year's test scores. The union's request regarding evaluations is noted; the focus of the report should be program evaluation, not individual staff performance.

  **Weight of the Recommendation**  
  This recommendation carries **moderate weight** regarding the report card presentation (it resolves the immediate transparency need) and the screening/identification decision (it maintains the core innovation). The expansion funding recommendation is **more tentative and conditional**. It leans on the suggestive positive signal in the subgroup data and the importance of addressing potential under-identification, balanced against the significant cost, the unclear net impact, and the critical need for better evidence. It is not a ringing endorsement of the pilot's proven effectiveness but a pragmatic step to gather definitive evidence while maintaining the existing investment. The recommendation *against* immediate district-wide expansion carries **stronger weight** due to the lack of conclusive evidence on net impact and the magnitude of the investment.

  **Conclusion**  
  The literacy pilot presents a complex picture. It shows potential for improving outcomes for students receiving services but also highlights the significant impact identification practices have on overall metrics and the challenges of comparing different models. Our report card must reflect this complexity transparently. Expanding the program district-wide immediately is premature and risky given the cost and unresolved questions. Continuing the pilot in its current schools with a mandated, rigorous evaluation design is the responsible path forward to gather the evidence needed for a confident, district-wide decision next year. Universal screening should be retained as a valuable tool for identifying need; the focus now should be on understanding the implications of finding more students who need help and ensuring the intervention is effective for them.

  I look forward to discussing these recommendations and the underlying analysis in detail at Thursday's meeting. Please come prepared to discuss the specific questions for the analyst regarding identification comparability and within-subgroup poverty differences.
