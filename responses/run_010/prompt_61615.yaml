  ### (b) Conditions for Dilation

  Dilation occurs when the event A and the partition are such that the conditional probability of A given any cell of the partition is sensitive to the prior in a way that the unconditional probability is not.

  In the example above, the unconditional probability of A is fixed at 0.4 for every prior in the set. But the conditional probabilities vary with the prior.

  Your guess: dilation cannot arise if the event A is independent of every cell under every prior in the set. This is true. If for every prior in the set, A is independent of each event in the partition, then the conditional probability of A given any cell would be equal to the unconditional probability, and there would be no dilation.

  However, dilation can arise even when A is not independent of the partition under every prior, but the set of priors is such that the unconditional probability is constant while the conditional ones vary.

  The relevant notion of independence: for a single prior, A is independent of an event E if P(A∩E)=P(A)P(E). For a set of priors, we could define that A is independent of the partition under the set if for every prior in the set, A is independent of each cell. But dilation can occur even if for some prior in the set, A is not independent of some cell.

  In fact, in the example above, for a given prior, A is not independent of E1 or E2. For instance, under P1: 
    P1(A)=0.4, P1(E1)=0.4+0.4=0.8, then P1(A∩E1)=P1(w1)=0.4, and P1(A)P1(E1)=0.4*0.8=0.32, not equal.

  So independence fails.

  ### (c) Sure-Loss and Coherence

  Now, we want to know if the set of priors in the example is coherent and does not incur sure loss.

  First, the set of priors is convex and closed. It is the convex hull of two extreme points.

  We can represent it by a set of linear previsionals. In Walley's theory, a set of lower and upper previsions is coherent if it is the lower and upper envelope of a set of linear previsions (which it is) and if it avoids sure loss, then the set is non-empty and the natural extension is itself.

  In this case, the set is a convex set of linear previsions, so it is coherent and avoids sure loss.

  Now, is there a sure loss? That is, can we construct a Dutch book?

  In the dilation example, we have unconditional and conditional probabilities. A dynamic Dutch book would involve bets at both times.

  The friend's argument: an agent who books your ex ante and ex post prices might be able to force a sure loss.

  But note: the updating in imprecise probability can be done in different ways. The standard is to use the generalized Bayes rule: the conditional lower prevision is the lower envelope of the conditional probabilities over the set of priors that are updated by Bayes rule.

  In our example, we used Bayes rule for each prior.

  Now, suppose we try to set up a Dutch book.

  At time 0, the agent has an interval [0.4,0.4] for A. So she would buy a bet on A for up to 0.4 and sell for at least 0.4. But since it's degenerate, she will only accept bets that are exactly at 0.4.

  At time 1, after observing the evidence (either E1 or E2), she will have an interval [0.5, 0.6667] for A. So she would buy a bet on A for up to 0.5 and sell for at least 0.6667.

  Can we design a series of bets that she will accept that lead to a sure loss?

  Suppose before seeing the evidence, we offer to sell her a bet on A that pays 1 if A happens, 0 otherwise, at price 0.4. Since her lower and upper probability is 0.4, she will buy it at 0.4.

  Then after seeing the evidence, say she sees E1, then she now has a lower probability of 0.5 and an upper of 0.6667. We now offer to buy from her a bet on A at price 0.5. Since her lower probability is 0.5, she is willing to sell at 0.5? 

  But note: she now owns a bet that will pay 1 if A occurs. If she sells it to us for 0.5, then regardless of whether A occurs, what happens?

    - If A occurs: she has to pay us 1 (because we now own the bet and she has to honor it? Or we are buying the bet from her, so she transfers the bet to us and we pay her 0.5. Then we get 1 if A occurs, but she is not involved anymore.

    - But wait, she originally bought the bet from us at 0.4, and then she sells it back at 0.5. She makes a profit of 0.1, and we have no further involvement.

  So no loss.

  Alternatively, after she observes E1, we might offer to buy a new bet on A at 0.5. She would accept to sell at 0.5.

  But then if A occurs, we get 1 from the new bet, and also from the old bet she has to pay us 1? But the old bet is already sold? 

  It's messy.

  Alternatively, we might offer a bet that depends on the evidence.

  The key to a dynamic Dutch book is to have bets that are called off if the conditioning event doesn't occur.

  In this case, we can have:

    Before the event, we sell her a bet on A that is called off if E1 does not occur. Specifically, we sell a conditional bet: if E1 occurs, then the bet on A is in force; if not, the bet is off. The price for such a bet: the lower probability of A given E1 is 0.5, and the unconditional lower probability of the indicator of E1 times the conditional bet? Actually, Walley's theory.

  But let's think.

  The standard dynamic Dutch book for precise Bayesians involves:

    At time 0: 
        Bet 1: A bet on A given E1: pays 1 if A and E1 occur, 0 otherwise. The price is P(A|E1) * P(E1).
    But in imprecise, it's more complex.

  In our example, the set of priors is such that for each prior, the conditional probability is updated by Bayes rule. So the set of posteriors is the set of conditional probabilities from the priors. And since the set of priors is convex and closed, and we update by Bayes rule, then the conditional lower prevision is the lower envelope of the conditional probabilities.

  Walley's coherence conditions for dynamic avoid sure loss.

  In fact, there is no sure loss because the set is convex and closed, and we are updating by Bayes rule, and this is known to avoid sure loss in the dynamic setting.

  But dilation does occur.

  Therefore, dilation is not the same as sure loss. Dilation can occur in a coherent set of priors.

  ### Diagnosis of the Friend's Argument

  The friend says: "an agent who books your ex ante and ex post prices against each other can squeeze you just as a Dutch book squeezes an incoherent credence function"

  In the example, we were not squeezed. The reason is that the ex ante and ex post prices are not inconsistent in a way that allows a sure loss. The updating rule is internally consistent within the set of priors.

  The ex ante probability for a conditional bet on A given E1 would be based on the lower prevision of the indicator of A and E1 divided by the lower prevision of E1? But in our case, the set of priors gives a range for P(A|E1), and the ex ante prevision for the conditional bet would be the lower envelope of P(A∩E1) over the priors, which is not the same as the lower envelope of P(A|E1) times the lower prevision of E1.

  In fact, in our example:

    P(A∩E1) = P(w1) = 0.4 for every prior.
    P(E1) = P(w1)+P(w2) = 0.4 + (0.2+0.2λ) = 0.6+0.2λ, which ranges from 0.6 to 0.8.

    So the lower probability of E1 is min over λ of P(E1) = 0.6.

    The lower probability of A∩E1 is 0.4.

    The conditional lower probability given E1 is 0.5.

    Now, if we try to set up a conditional bet on A given E1 at time 0, the agent would set the price for the bet that pays 1 if A and E1 occur, and 0 otherwise, at the lower prevision of that bet, which is 0.4.

    Alternatively, the price for a conditional bet (which is called off if E1 does not occur) that pays 1 if A occurs and E1 occurs might be based on the lower prevision of the indicator of A given E1, but Walley defines the conditional lower prevision at time 0 for a conditional bet as the lower prevision of the product: the indicator of E1 times the conditional prevision. However, it is defined to avoid dynamic incoherence.

  Since the set is coherent, there is no dynamic Dutch book.

  The flaw in the friend's argument is that the ex ante and ex post prices are not required to be the same. In fact, after conditioning on E1, the agent has more information and is allowed to change her assessment.

  ### Updating Rules

  The example used generalized Bayes: updating each prior by Bayes rule and then taking the envelope.

  Other updating rules might not dilate. For example, if we used an updating rule that only updates the prior that maximizes the probability of the evidence, or minimizes, then the conditional set might be a singleton and not dilate.

  But in our example, with generalized Bayes, we get dilation.

  ### Is Dilation a Defect?

  The question remains: is dilation a defect?

  The imprecise probabilist can argue that dilation is a rational response to ambiguity. In the example, initially you know that the probability of A is 0.4. But after you learn E1, you know that the state is either w1 or w2. However, your set of priors gives different weights to w1 and w2. In one extreme (P1), w1 and w2 are equally likely, so P(A|E1)=0.5. In the other extreme (P2), w1 is twice as likely as w2, so P(A|E1)=0.4/(0.4+0.2)=2/3. Therefore, the new evidence has introduced ambiguity that was not present before: the relative likelihood of w1 and w2 is not known. So the widening of the interval reflects this new ambiguity.

  Thus, the agent has learned something: they have learned that the state is in {w1, w2}, but within this set, they are now exposed to the ambiguity about the relative probabilities that they had in their prior set. Initially, the prior set had a fixed probability for w1 (0.4), but the probabilities for w2 and w3 varied. After conditioning on E1, the probability of w1 is now compared to w2, and the ratio depends on the prior.

  So dilation is not a loss of information; it is the emergence of ambiguity that was hidden in the unconditional probabilities.

  The cost of this reply: 
    - The agent cannot tell between "I have learned something that resolves the ambiguity" and "I have learned something that makes the ambiguity relevant". In other words, the agent might have hoped that learning would reduce the imprecision, but instead it might increase it.
    - It seems that rational inquiry can make you less certain in the sense of widening your intervals, even though you have gained information.

  This is counterintuitive to many.

  The divergence in intuition: 
    - On one hand, learning should not make you less informed. 
    - On the other hand, the new information might force you to confront an aspect of the uncertainty that was previously irrelevant.

  The imprecise probabilist must bite the bullet and say that sometimes learning can make you more uncertain in the sense of having a wider interval of probabilities.

  ### Summary

  - Dilation is not sure loss and can occur in coherent models.
  - Dilation reflects the emergence of ambiguity that was present in the prior set but not affecting the unconditional probability of the event.
  - It is a feature, not a bug, of imprecise probability for representing ambiguity.
  - The cost is that learning can sometimes increase the perceived ambiguity, which goes against the intuition that learning always sharpens our knowledge.
