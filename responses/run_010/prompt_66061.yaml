answer: |-
  Here’s a systematic audit of the book’s claims, grounded in specialist consensus and key disputes. I’ll first outline major interpretive frameworks for the white horse dialogue, then dissect each claim.

  **Core Readings of the White Horse Dialogue (Gongsun Long’s *Báimǎ Lùn*):**
  Specialists debate whether Gongsun Long is:
  1. **Linguistic Reformist:** Highlighting how classical Chinese handles predication (without "is"), urging precision to avoid ambiguity in terms like "horse" (which can be mass-noun-like, implying "horseness").
  2. **Metaphysical Realist:** Asserting that abstract attributes ("whiteness," "horseness") exist independently (closest to the book’s take).
  3. **Logical Analyst:** Using set-like reasoning ("white horse" ⊆ "horse," so denying identity is technically valid if "is" means "is identical to").
  4. **Dialectical Performer:** Creating paradoxes to expose contradictions in common language, not defending a fixed doctrine.
  5. **Semantic Contextualist:** Arguing words shift meaning based on situation (e.g., "horse" in "bring a horse" vs. "a horse is an animal").

  The book adopts a *Logical Analyst* reading with *Metaphysical Realist* elements. It silently bypasses *Linguistic* and *Contextualist* readings, which are dominant in modern scholarship.

  **Audit of Claims:**

  1. **"School of Names = Chinese Sophists, traveling for argument’s sport."**  
     - **Accept:** They were dialecticians focused on language/reality puzzles.  
     - **Simplification:** Calling them "sophists" is fine if meaning "professional arguers."  
     - **Wrong:** They weren’t *just* entertainers. Gongsun Long was likely a court official; debates had political/legal stakes (e.g., defining terms for laws). "School of Names" (*Míngjiā*) is a later Han Dynasty label—they didn’t self-identify as a "school." Overemphasis on "fun" trivializes their philosophical aims.

  2. **"The argument: ‘Horse’ names shape, ‘white’ names color; color ≠ shape, so white horse ≠ horse."**  
     - **Accept:** This paraphrases the text’s opening move.  
     - **Simplification:** Fair for general audiences.  
     - **Wrong:** Ignores *how* classical Chinese works. Without "is," the argument hinges on word order and particles. The text uses "馬" (mǎ, horse) and "白馬" (bái mǎ, white horse) as compound terms. "Is not" (*fēi* 非) denies term-identity, not predication. This isn’t about "shape vs. color" but whether adding "white" creates a new compound term distinct from "horse."

  3. **"Practical test: Asking for a horse vs. a white horse yields different animals."**  
     - **Accept:** The text uses this to show differing extensions (sets: "white horses" ⊂ "horses," ≠ "horses").  
     - **Simplification:** Accurate and effective.  
     - **Wrong:** Nothing major. This is the least contested part.

  4. **"This is the extension/intension distinction; Gongsun Long was technically right; critics did bad logic."**  
     - **Extension** = the set of things a term refers to (all horses vs. only white horses).  
     - **Intension** = the concept or properties defining the term (e.g., "equine" vs. "equine + white").  
     - **Accept:** Yes, the dialogue distinguishes extensions.  
     - **Wrong:**  
       - **"Technically right"**: Only if "is" means *strict identity* (like "Clark Kent *is* Superman"). But in "a white horse *is* a horse," "is" implies *predication* (subset membership). Denying predication ("a white horse is not a horse") is false under standard logic.  
       - **Critics weren’t illogical**: Opponents like Xunzi understood extensions but rejected the argument as *semantically invalid*—it violated how language is used pragmatically (calling a white horse "not a horse" confuses communication). Their objection was linguistic, not logical ignorance.  
       - **Intension ≠ Extension**: The text *only* discusses extensions (actual objects). Intensions (concepts) are a modern imposition. Gongsun Long shows "white horse" and "horse" have different extensions, but never analyzes their conceptual definitions.

  5. **"Gongsun Long believed qualities like whiteness subsist separately, like Plato’s Forms."**  
     - **Accept:** He did argue whiteness and hardness could be considered independently (e.g., in *On Hardness and Whiteness*).  
     - **Simplification:** Calling him "Chinese Plato" is a common shorthand.  
     - **Wrong:**  
       - **Not Platonic**: Plato’s Forms are perfect, eternal universals. Gongsun Long’s "whiteness" (*bái* 白) is an abstractable attribute, but it doesn’t exist in a transcendent realm—it’s immanent and dependent on context. His focus is on *separating attributes in discourse*, not metaphysical dualism.  
       - **Overreach**: The white horse dialogue doesn’t discuss separated qualities. This conflates it with his other, more metaphysical work.

  6. **"No word for ‘is’ prevented deep analysis; paradoxes were dismissed as tricks."**  
     - **Accept:** Classical Chinese lacks a copula ("is" as in "X is Y"). Critics *did* often dismiss such paradoxes as useless wordplay.  
     - **Wrong:**  
       - **Not a barrier**: Chinese expresses predication via word order (e.g., "馬白" = "horse [is] white") or particles. Philosophers *were* aware of predication—they just analyzed it differently.  
       - **Misdiagnosis**: Critics rejected the paradox because it violated *conventional language use* (e.g., calling a white horse "not a horse" is absurd in practice), not because they couldn’t grasp predication.  
       - **Deterministic**: The claim implies language *dictates* thought. But the Mohists developed sophisticated logic in the same linguistic environment. The School of Names declined due to political/social factors (e.g., Qin unification suppressing dissent), not linguistic limits.

  **Crucial Correction for Claim 4: Why "different extensions" doesn’t justify "is not a horse"**  
  - The argument equivocates on "is":  
    - **Premise 1**: "A white horse is not [identical to] ‘horse’" (i.e., the terms aren’t synonymous). **True**.  
    - **Premise 2**: "If you ask for a horse, you may get a yellow horse; if you ask for a white horse, you won’t" (extensions differ). **True**.  
    - **Conclusion**: "Therefore, a white horse is not [a] horse" (denying class membership). **False**.  
  - The leap from "term A ≠ term B" to "object X is not a member of class Y" is invalid. The *object* "white horse" is still in the *set* "horses." Gongsun Long exploits this ambiguity, which exists precisely because Chinese doesn’t mark predication vs. identity explicitly. Critics rightly saw this as verbal sleight-of-hand.

  **Ranking Distortions (Most to Least Damaging):**  
  1. **Claim 4** (Logical misstep): Warps the dialogue into a false "triumph" of set theory, misrepresents critics.  
  2. **Claim 6** (Linguistic determinism): Erases Chinese philosophical ingenuity; unsupported by evidence.  
  3. **Claim 5** (Platonic projection): Imposes Western metaphysics, obscuring Gongsun Long’s actual method.  
  4. **Claim 1** (Historical context): Over-simplifies motives but doesn’t distort the philosophy.  
  5. **Claim 2** (Argument structure): Roughly correct; minor linguistic details omitted.  
  6. **Claim 3** (Extension test): Largely accurate.

  **The Single Most Corrective Insight:**  
  **Gongsun Long isn’t proving a metaphysical truth; he’s exposing how language can mislead when terms are rigidly equated.** The white horse dialogue is a *semantic warning*: words like "horse" shift meaning based on context ("horse" alone vs. "white horse"). Critics dismissed it not because they were bad logicians, but because they prioritized communicative function over abstract consistency. This reframes the debate from "Who’s right?" to "How should language anchor reality?"—the real Warring States obsession.
