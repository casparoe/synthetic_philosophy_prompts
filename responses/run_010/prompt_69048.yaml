prompt: |-
  I write about science and ideas for a general-interest magazine, and for the past five years a good deal of my reporting has concerned how large institutions adjudicate conflicts of interest when their staff work across very different normative cultures. A source has given me the complete set of reasoned decisions that the independent ethics panel of a multilateral development institution — call it the Panel — has chosen to publish over that period. I would like you to work from that track record as I have summarized it and tell me what the Panel should decide in the matter now before it. Two ground rules: please do not reach for real commissions, real published rulings, or a reading list, and do not cite anything. Work only from what I give you; I want your reconstruction of the reasoning, not your sources.

  The Panel's nine published decisions, in the order issued:

  1. A procurement officer accepted two tickets to a football match from a firm whose bid he was actively scoring. He declared the tickets eleven days later, after the contract had been awarded. Finding: serious violation.

  2. A country director was presented at a provincial farewell ceremony with a hand-woven textile, declared value roughly $150. Local custom made refusal an insult to the host. He declared it in writing within two days and kept it in his home. Finding: no violation.

  3. A senior manager's brother-in-law applied for a post in her directorate and proved the strongest of nine candidates. She disclosed the relationship in writing before the shortlist was drawn and recused herself from the panel. Finding: no violation — but with a recommendation that an officer from outside the directorate countersign the appointment, since the appearance of favouritism had not, in the Panel's phrase, been fully cured by recusal.

  4. A staff member accepted a week-long, all-expenses-paid study tour of a supplier's factories. No procurement decision was pending and none was foreseeable that year. He did not declare it. Finding: violation.

  5. A mission chief accepted eleven nights of lodging provided by a host government in a country where declining such hospitality is treated as a diplomatic breach. Declared before the trip. Finding: no violation, with a direction that the institution negotiate a standing accommodation arrangement so that staff are not repeatedly placed in that position.

  6. A regional director used discretionary programme funds to sponsor a harvest festival in the region she represented in a national assembly she intended to rejoin on leaving the institution. She did not declare the sponsorship. Finding: violation.

  7. A staff lawyer accepted a speaking fee at the prevailing market rate from a bar association whose members sometimes litigate against the institution. Declared in advance; the subject was unrelated to any live matter. Finding: no violation.

  8. A regional director accepted a $6,000 honorarium for a keynote at a university with no current or prospective dealings with the institution. Declared in advance. Finding: no violation, the Panel observing that remuneration for work actually performed stands on a different footing from a gift.

  9. A grants officer's adult son was hired as a consultant by an association that had received an award she had scored eighteen months earlier, the hiring having been unknown to her at the time of scoring. Declared as soon as she learned of it. Finding: no violation, with a direction that she be walled off from that association's file for two years.

  The tenth matter, argued last month and not yet decided: A field coordinator was guest of honour at a harvest ceremony in a district where custom obliges the guest of honour to accept a staff from the elders. She declined twice, as the ritual requires, then accepted a carved ivory-and-silver staff, since appraised at about $9,000 — by a wide margin the most valuable gift the Panel has ever been asked to bless. She declared it in writing nine days later, before any decision she touched could have been affected. The institution's code requires declaration within thirty days and provides that gifts of substantial value are held for the institution, though the ethics office may direct otherwise; it directed her in writing to retain the staff at her residence pending appraisal. Five weeks after the ceremony and eleven weeks before the annual grants round opened, she recused herself in writing from every item arising in her district. When the round was decided, a community association chaired by the son of the elder who presented the staff received an award of ordinary size, on the merits, from the remaining panel members, in a session she did not attend. No one alleges she lobbied or voted on it. The appraisal has now come back, the ethics office's interim direction has lapsed, and the office has asked her to surrender the staff. She has refused, on the ground that the custom makes the gift personal to her as guest of honour, that surrendering it to a foreign institution would itself insult the elders, and that she has followed every instruction she was given.

  What I need from you:

  (a) Every rule that survives all nine decisions — not the one you find most attractive, but each candidate consistent with the whole set. I suspect more than one survives, and I suspect at least one of them is doing far more work in these findings than the Panel's own language admits.

  (b) Which of those surviving rules the pending case actually turns on, and precisely where they come apart. Give me the finding under each.

  (c) Which precedent is the closest analog and what does the distinguishing work — value, custody, the family nexus, or something else.

  (d) Your single best guess at the decision, and the reasoning the Panel would most likely write to reach it.

  (e) What principle the Panel would be adopting, wittingly or not, with each available choice — and in particular whether a finding against the coordinator commits the institution to a conception of public office on which the officeholder has no personal standing at all. Say plainly whether you take that conception to be a universal standard of integrity or a locally specific one now being enforced against someone who never agreed to it, and what follows for the other eight decisions if you are right.

  (f) The one further hypothetical case that would most cleanly discriminate among the surviving rules — a fact pattern you would want to see the Panel take next.

  Answer in prose with the six parts labelled. Commit to a prediction and defend it rather than enumerating possibilities; I would rather be given a contestable view than a balanced survey.
reasoning: |-
  Hmm, the user is a science and ideas writer for a general-interest magazine, focusing on how large institutions handle conflicts of interest across different normative cultures. They've shared nine published decisions from an ethics panel of a multilateral development institution and want me to apply that reasoning to a pending tenth case. They've set strict ground rules: no external sources, just working from the provided summaries.

  Looking at the nine decisions, I need to extract consistent underlying rules. Decisions 1 and 4 show that non-disclosure of benefits leads to violations, especially when related to ongoing responsibilities. Decisions 2 and 5 highlight exceptions for culturally obligatory gifts where refusal would cause offense, but with requirements for timely declaration and institutional adjustments to prevent recurrence. Disclosure timing matters too - late disclosure in case 1 was problematic, while timely disclosure in cases 2, 3, 5, 7-9 helped avoid violations.

  The concept of "curing appearances" appears in case 3, where recusal wasn't enough and required additional safeguards. Case 6 shows that using institutional funds for personal political benefit is unacceptable. Cases 7 and 8 distinguish between gifts and payment for services rendered. Case 9 demonstrates that unknown conflicts don't violate rules if disclosed upon discovery and mitigated.

  For the pending case (a harvest ceremony staff worth $9,000), several factors are in tension: high value (unprecedented for the Panel), cultural obligation (similar to cases 2 and 5), timely declaration and recusal (before any decisions), but refusal to surrender the item based on cultural arguments.

  The closest precedent is case 2 (hand-woven textile), but the value difference is extreme ($150 vs $9,000). Case 5 (lodging) is also relevant for cultural accommodation, but involved temporary use rather than permanent ownership.

  I think the Panel will likely rule "violation" and require surrender of the staff. Their reasoning would emphasize that cultural sensitivity has limits at this value threshold, and that the institution's custody rule for substantial gifts must prevail. They might offer to display the staff publicly to mitigate cultural offense.

  This decision would implicitly adopt a universalist conception of public office where personal standing yields to institutional custodianship at certain thresholds. The coordinator never agreed to this conception, but the Panel would view it as inherent to multilateral institutional integrity.

  A good hypothetical to test these principles would be a medium-value culturally obligatory gift (say $1,500) where surrender would cause offense but the value isn't as extreme as $9,000 - this would clarify where the Panel draws the line on cultural accommodation versus institutional rules.
answer: |-
  Here is the analysis structured as requested, working solely from the track record provided:

  **(a) Surviving rules from all nine decisions:**  
  Three rules are consistently upheld:  
  1. **Timely declaration cures most conflicts** (applies to #2, #3, #5, #7, #8, #9). Late or non-declaration is fatal (#1, #4, #6).  
  2. **Cultural compulsion negates prohibition** *if* declared and if refusal would breach local norms (#2, #5).  
  3. **Substantial gifts require institutional custody** per code, absent exceptional waiver (#8’s “different footing” for work vs. gifts implies this; #6’s undisclosed sponsorship violation reinforces it).  

  The unstated rule doing heavy lifting: **"Appearance of impropriety must be actively cured"** – not just avoided. Recusal alone is insufficient without supplemental safeguards (#3’s countersign requirement; #9’s "walling off").  

  **(b) Pending case’s turning points and findings under each rule:**  
  - **Rule 1 (Timely Declaration):** She declared within 9 days (under 30-day limit), recused *before* grants round. **Finding: NO VIOLATION** under this rule.  
  - **Rule 2 (Cultural Compulsion):** Custom compelled acceptance; refusal was culturally impossible. **Finding: NO VIOLATION** under this rule.  
  - **Rule 3 (Substantial Custody):** Gift ($9,000) is "substantial value" per code. Ethics office directed surrender. Cultural argument ("insult to elders") challenges custody. **Finding: VIOLATION** – custody rule trumps cultural claim here.  
  - **Unstated Rule (Curing Appearances):** Recusal and declaration occurred, but retention of high-value gift creates lingering appearance of influence (elder’s son’s grant). **Finding: VIOLATION** – supplemental cure (e.g., donation/display) needed.  

  **Where rules come apart:** Cultural compulsion (Rule 2) justifies *acceptance* but conflicts with custody requirement (Rule 3) for high-value items. Timeliness (Rule 1) is satisfied but doesn’t resolve custodial duty.  

  **(c) Closest analog and distinguishing factor:**  
  - **Closest analog:** #2 (hand-woven textile). Both involve culturally obligatory gifts, timely declaration, and personal retention.  
  - **Distinguishing work:** **Value** ($150 vs. $9,000). #2’s value was trivial; this gift is "by a wide margin the most valuable." Custody rule is triggered here but not in #2.  

  **(d) Predicted decision and reasoning:**  
  **Finding: VIOLATION**  
  **Reasoning:**  
  *"While the Panel acknowledges the cultural imperative compelling acceptance of the staff and commends the coordinator’s timely declaration and recusal, the exceptional value of the gift ($9,000) triggers the institution’s mandatory custody provision for substantial assets. The cultural argument against surrender, while understandable, cannot override the institutional imperative to prevent even the appearance of patrimonial influence – particularly given the subsequent grant to an association linked to the presenting elder. The coordinator’s compliance with procedural safeguards (declaration, recusal) mitigates the severity but does not eliminate the breach of the custody rule. The staff must be surrendered to the institution. The Panel directs the ethics office to explore culturally appropriate disposal (e.g., ceremonial display or return to the community) to mitigate diplomatic insult."*  

  **(e) Implicit principle and implications:**  
  - **Principle if violation found:** The institution adopts a **universalist conception of public office as a wholly impersonal trust**. The officeholder has no personal standing to retain custodial rights over high-value items, regardless of cultural embeddedness or prior agreement. This treats institutional integrity as non-negotiable at high-value thresholds.  
  - **Local vs. Universal:** This is a **universal standard being enforced locally**. The coordinator (likely a national of the host country) is held to a multilateral code she accepted upon employment, not a local norm.  
  - **Implications for other decisions:**  
    - **Undermines:** #2 (textile retention) survives only due to *de minimis* value. If value were $5,000, #2 would flip to violation.  
    - **Reinforces:** #6 (undisclosed sponsorship for political gain) – custody of institutional resources is paramount.  
    - **Strains:** #5 (lodging accepted due to custom) – if the lodging were a permanent gift (e.g., a villa), it would violate under this principle.  
    - **Harmonizes with:** #3 (countersign after recusal) – "curing appearances" is necessary even when intent is clean.  

  **(f) Discriminating hypothetical case:**  
  **"A senior economist, while on mission, is inducted into a tribal council. Custom requires acceptance of a ceremonial dagger (value $2,500) symbolizing his role as advisor. He declares it immediately. The tribe has no active projects with the institution but may bid in future. He argues surrendering the dagger severs his advisory status and insults the tribe. Ethics office demands surrender."**  

  **Why it discriminates:**  
  - Tests the **value threshold** between #2 ($150) and pending case ($9,000).  
  - Probes whether **symbolic/functional cultural items** (vs. mere gifts like #2’s textile) alter custody calculus.  
  - Challenges whether **future dealings** (vs. pending decisions) heighten appearance concerns.  
  - Forces Panel to define if "curing appearances" requires surrender or if symbolic retention under conditions (e.g., recusal from tribal bids) suffices.  

  ---  
  **Summary:** The Panel’s logic demands a violation ruling to preserve custodial integrity at high-value thresholds, but the reasoning will emphasize the uniqueness of the value and offer face-saving custodial solutions. This elevates institutional imperatives above local personhood, revealing a universalist stance latent in the prior cases but now strained by scale.
