  ### **Conclusion**
  Your results reveal that solvability depends on **perceptual naturalness** (vision’s preattentive computations) and **inferential transparency** (discoverable through simple operations), moderated by a **normative constraint** (rules must be intentional and coherent). This principle explains why:
  - Natural, transparent properties (#1, #2) are easy.
  - Non-natural (#4) or non-transparent properties (#7, #8) are hard.
  - Salient but inadmissible properties (#6) are rejected.
  - Transparency can be learned (#3 retest) or hinted (#4 hint).

  To test this, design problems that pit naturalness against transparency (e.g., a property that is perceptually salient but requires complex verification). If my principle holds, transparency will dominate—salience alone won’t suffice. Your work brilliantly highlights how human cognition blends perception, convention, and concept-formation in puzzle-solving.
