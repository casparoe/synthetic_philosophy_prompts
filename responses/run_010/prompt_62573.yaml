  ### **Predictions for New Problems**
  Apply the principle to your untested problems:

  1. **Problem X**: Left has at least one isolated segment (no other segment touches it); right has none.  
     - **Perceptually natural**: Vision detects isolated elements for figure-ground segregation (e.g., spotting a detached branch).  
     - **Inferentially transparent**: Holistic scan for "lonely" segments; easy to verbalize ("a segment not connected to others").  
     - **Admissible**: Coherent visual concept (connectivity-based).  
