  2. **Problem Y**: Modified #4. Left has exactly one stroke (line segment); right has exactly two.  
     - **Perceptually natural**: Vision subitizes small quantities (1–3 items) for object enumeration.  
     - **Inferentially transparent**: Quick count (effortless for 1–2 items); easy to verbalize ("one segment" vs. "two segments").  
     - **Admissible**: Coherent as a counting-based concept.  
     - **Prediction**: Solvable quickly. Contrast with original #4 (parity), which lacked naturalness and transparency for *abstract* counting.

  **Crucial Note**: The principle gives the *same verdict* (solvable) for both new problems, but this is **not a flaw**. Both satisfy the two factors, and their differences (isolation vs. counting) are both perceptually natural for small numbers. The original #4 (parity) fails because it requires *non-natural* abstraction (even/odd), while #Y uses *natural* subitizing. This distinction is captured by the principle.

