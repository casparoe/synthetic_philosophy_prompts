  Then I should provide a "residue report" showing what translates well, what requires conceptual stretching, and what can't be translated at all. They specifically want me to address alliesthesia (where pleasure flips based on internal state) and the attitudinal case (like a parent's pleasure in their child's recovery).

  The user seems highly knowledgeable in both fields. They're probably trying to bridge their neuroscience training with current philosophical teaching. There might be some underlying tension here - perhaps they're questioning whether neuroscience can fully capture subjective experiences of pleasure.

  For the heterogeneity problem itself: philosophers argue that pleasures feel different, so how can they be the same "thing"? Neuroscience might approach this by looking at shared neural mechanisms rather than subjective qualities.

