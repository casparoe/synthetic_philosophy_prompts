prompt: |-
  Taking a course on electoral systems this term and I'm supposed to be able to defend some position on reform, but my own intuitions are a mess, so I'd like to know what principle they actually add up to — if any. Here are my verdicts, mostly from a problem set we did with made-up countries:

  - Party A gets 44% of the vote, party B 43%, and A wins 60% of the seats. I don't feel any injustice here, it's just how single-member districts work.
  - Same 44/43 result, except the map was drawn so that A would have won 60% even on 38%. That one feels like a genuine wrong. Is it a *different* wrong from the first?
  - In the problem set, a party with 12% of the vote spread evenly everywhere wins one seat, while a party with 5%, all of it in one region, wins 56. I called this a scandal in seminar and I still think it is.
  - But when a regional party wins nearly all the seats in the region where it's actually popular, I think that's a feature and not a bug.
  - Hung parliament: the largest party gets shut out of government by a coalition of the second, third and fourth parties. Even with perfectly proportional seat totals my gut says the election was stolen.
  - I voted tactically for my second choice to block someone I really dislike. Didn't feel wasted, but I also don't feel represented by my MP.
  - A district decided by one vote out of 40,000: I think the losers' votes should count for nothing *and* that the winner should get the seat.

  The principle I keep reaching for is "seats should mirror votes", which I'm pretty sure doesn't survive #1 or the hung parliament. Can you state the real candidates precisely, say which of my verdicts motivates each clause, run them on cases I haven't thought of (a party that only stands in half the districts; 30% turnout in one seat and 80% in another; measuring against votes cast vs. eligible voters; a gerrymander in the minority party's favour), and just tell me straight which of my intuitions have to go?
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're taking a course on electoral systems and need to defend a reform position, but their intuitions seem contradictory. They've listed several scenarios where their gut reactions clash, and they're struggling to find a consistent principle. 

  First, I notice the user is academically engaged—they reference a problem set and seminar discussions—but frustrated by their own apparent inconsistencies. The core tension seems to be between accepting certain mechanical outcomes of majoritarian systems (#1, #7) while rejecting others as undemocratic (#2, #3, #5). There's also a clear regionalism paradox: they condemn regional concentration yielding disproportionate power (#3) but endorse it when it reflects actual local dominance (#4).

  Hmm... the "seats should mirror votes" principle they mention is classic proportionality, but their examples show they intuitively permit deviations when they feel "earned" (natural geography, legitimate local mandates) but not when "manufactured" (gerrymandering, vote-splitting). That suggests their real value is legitimacy of outcomes, not pure math. 

  The tactical voting point (#6) is particularly telling—they accept strategic behavior but mourn the representation gap. And hung parliaments (#5) reveal a deep discomfort with post-election bargaining overriding voter intent, even with proportional math. 

  For the unconsidered cases: 
  - A party running in half the districts likely wouldn't bother them if those were genuine strongholds (aligned with #4), but if it won a national majority with 25% of seats contested? That might trigger their #3 scandal reflex. 
  - Turnout disparities... probably fine if organic (urban vs rural apathy) but not if suppressed (voter ID shenanigans). 
  - Gerrymandering for minorities? They'd likely condemn the process (per #2) even if approving the outcome. 

  Their contradictions aren't fatal—just layered. They need to rank: Is local accountability > proportionality? Is preventing manufactured outcomes > strict neutrality? The answer might be a majoritarian system with robust anti-gerrymandering rules and maybe regional top-ups. 

  Biggest tension: Accepting #1 (natural seat/vote mismatch) but rejecting #5 (coalition override) requires believing district wins convey unique legitimacy that seat shares don't. That's defensible but needs articulating. Maybe they sacrifice the hung parliament intuition? Or reframe coalitions as post-election dealmaking distinct from seat allocation...

  Also noting their emotional language ("scandal", "stolen") points to values about consent and desert. Worth naming that.
answer: |-
  Based on your intuitions, your core principle isn't pure proportionality ("seats mirror votes") but **"Legitimate Representation"** – where outcomes must reflect *earned voter support* rather than arbitrary distortions. This principle combines **Geographic Accountability** with **Anti-Manipulation**, moderated by **Political Realism**. Here's how it breaks down:

  ### The Proposed Principle:
  **"An electoral system should translate voter preferences into legislative seats such that:**
  1.  **Mandates reflect sustained voter support:** Winners must demonstrate *meaningful local or regional electoral strength* (justifies #1, #4, #7).
  2.  **Outcomes resist artificial distortion:** Results shouldn't be *disproportionately warped by deliberate manipulation or systemic quirks* (justifies #2, #3).
  3.  **Governments require demonstrable consent:** Governing coalitions must be *plausibly connected to voter choices* (justifies #5).
  4.  **Votes have weight, but not equality:** All votes contribute to an outcome, but local majorities deserve mandate recognition (justifies #1, #6, #7)."**

  ---

  ### How Your Verdicts Motivate Each Clause:
  1.  **Clause 1 (Mandates):** Explains #1 (A earned district wins), #4 (regional dominance deserves seats), and #7 (local winner deserves mandate).
  2.  **Clause 2 (Anti-Manipulation):** Explains #2 (gerrymandering is artificial distortion) and #3 (systemic quirk makes 5% > 12%).
  3.  **Clause 3 (Consent):** Explains #5 (coalition excluding largest party lacks *demonstrable* consent).
  4.  **Clause 4 (Weight ≠ Equality):** Explains #1/7 (accepting winner-takes-all), #6 (tactical vote had impact, even without personal representation).

  ---

  ### Testing on New Cases & Which Intuitions Must Go:
  1.  **Party runs in only half the districts, wins 30% national vote but 60% of seats:**  
      *   **Your Principle:** Acceptable under Clause 1. They earned mandates *where they competed*. National vote % is irrelevant if they didn't seek nationwide support. *(Sacrifices strict proportionality).*
      *   **Intuition Lost:** Pure "seats mirror votes" (#3-type outrage wouldn't apply here).

  2.  **30% turnout in one seat vs. 80% in another (same # of voters):**  
      *   **Your Principle:** Acceptable under Clause 4/1. Lower turnout reflects lower engagement; the local winner still earned their mandate. No systemic distortion (Clause 2). *(Assumes no suppression).*
      *   **Intuition Kept:** #1/#7 logic – winner deserves the seat.

  3.  **Measuring vs. Eligible Voters (e.g., Party wins 60% of seats with 35% of votes cast, but only 20% of eligible voters):**  
      *   **Your Principle:** **Problematic** under Clause 3 (Consent). Governing legitimacy weakens if support is a small fraction of the electorate. May also trigger Clause 2 if low turnout is systemic. *(Prioritizes actual voters but acknowledges broader legitimacy concerns).*
      *   **Intuition Modified:** #5 (stolen feeling) applies here – government lacks *broad* consent.

  4.  **Gerrymander favoring the *minority* party (e.g., Packing opposition to give minority 55% of seats with 45% vote):**  
      *   **Your Principle:** **Unacceptable** under Clause 2 (Anti-Manipulation). Intentional distortion is wrong, regardless of beneficiary. Outcome isn't "earned" naturally. *(Consistency with #2 is key).*
      *   **Intuition Kept:** #2 logic prevails – process matters more than who benefits.

  ---

  ### Which Intuitions Must Be Sacrificed?
  1.  **Pure Proportionality (#3 Scandal):** You must abandon the idea that a *national* vote share *must* translate directly to seats. Your acceptance of regional mandates (#4) and district wins (#1, #7) conflicts with this. The "scandal" in #3 is due to the *specific systemic quirk* (vote concentration), not *just* the disproportionality.
  2.  **Hung Parliament Gut Feeling (#5):** If the coalition has a *combined majority of seats/votes AND a plausible governing agreement*, your "stolen" feeling conflicts with Clause 3 (Consent). The largest party isn't inherently entitled to govern; the coalition *does* represent the majority's choice. You need to accept coalition-building as legitimate if it reflects aggregated voter intent.
  3.  **Vote "Waste" in Safe Seats:** Your comfort with #1 and #7 means you accept that votes for losers in SMDs "count for nothing" in terms of representation. Your tactical vote (#6) felt impactful (blocking someone) despite not getting personal representation, showing you value *effectiveness* over pure representation per vote. This is consistent with your principle.

  ---

  ### The Bottom Line: You're a "Modified Majoritarian"
  Your intuitions align with a system prioritizing **geographic representation and earned mandates** (like FPTP or AV), but **with strong safeguards against manipulation** (independent redistricting, maybe regional top-ups). You reject pure proportionality and accept winner-takes-all logic, but demand fairness in the process and legitimacy in outcomes. 

  **To defend reform:** Advocate for a majoritarian system (e.g., Alternative Vote or MMP) with:
  1.  **Strict anti-gerrymandering rules** (Clause 2).
  2.  **Mechanisms to ensure coalition governments reflect voter intent** (e.g., formal agreements pre-election, strengthening Clause 3).
  3.  **Acceptance that regional concentration deserves representation** (Clause 1), even if disproportional nationally.

  Your "Legitimate Representation" principle is coherent and defensible – it just requires letting go of proportionality as the *sole* measure of fairness and accepting coalition governments as valid expressions of majority will.
