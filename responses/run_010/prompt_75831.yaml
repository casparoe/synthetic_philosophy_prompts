answer: |-
  ### Correspondence Audit: Proofs as Programs  
  *(Curry-Howard Isomorphism, Constructive Lens)*  

  **Explicit Mapping:**  
  - **Program** ↔ **Proof** (A sequence of logical steps).  
  - **Type** ↔ **Proposition** (e.g., `Type: List Sorted` ↔ `Prop: "Every sequence has a sorted permutation"`).  
  - **Type-checker** ↔ **Proof verifier** (Checks logical correctness, e.g., Coq/Agda).  
  - **Input** ↔ **Evidence/Assumptions** (e.g., input list ↔ axioms/premises).  
  - **Running the program** ↔ **Verifying the proof** (Execution computes output; verification confirms consistency).  
  - **Bug** ↔ **Logical error** (Runtime crash ↔ contradiction in proof).  

  **Strain Points:**  
  1. **Non-Executable "Outputs":** Classical existence proofs (e.g., "∃x such that P(x)") often lack a *constructive witness*. The program (proof) type-checks but crashes when run (no output produced).  
  2. **Infinite Objects:** Programs handle finite data; math deals with infinite sets (e.g., real numbers). A classical proof of "Every bounded set has a supremum" defines no algorithm to *find* it.  
  3. **Truth vs. Verification:** Programming equates truth with verifiability ("if it compiles/runs, it works"). Classical math allows truth independent of verification (e.g., non-constructive axiom of choice).  
  4. **Platonism in Disguise:** The analogy assumes "mathematics must compute," importing a computational metaphysics mathematics need not share.  

  **Key Disanalogies Bearing on the Conclusion:**  
  - **Classical Proofs ≠ Empty Promises:** They *do* guarantee existence (e.g., "Prime pairs are infinite" assures structure, even if no pair is provided). The "cash" is logical consequence, not computation.  
  - **Beyond Execution:** Classical methods prove results *unattainable* constructively (e.g., "Intermediate Value Theorem" for continuous functions—constructive versions require stronger assumptions).  
  - **Efficiency/Irrelevance:** A constructive proof might be computationally intractable (e.g., extracting a million-digit prime), while a classical proof efficiently establishes truth.  

  **Conclusion Audit:**  
  - **Brother-in-law's core claim ("non-constructive = no cash") survives only if you equate mathematical value with program execution.** Otherwise, it conflates *verification* (which classical proofs pass) with *computation* (which they avoid).  
  - **Intuitionist advantage is real but narrow:** Constructive proofs *do* yield algorithms, but classical proofs offer broader, efficient certainty where computation is irrelevant (e.g., uncountable sets).  
  - **The analogy carries his case** by silently imposing a computational standard on mathematics. Reject that standard, and classical proofs retain force.  

  **Better Arguments for Intuitionism:**  
  1. **Philosophy:** Argue that mathematical objects are mental constructions (Kant/Brouwer), making non-constructive proofs speculative.  
  2. **Computational Integrity:** In computer-assisted proofs, constructive methods avoid reliance on unverifiable oracles (e.g., excluded middle).  
  3. **Paraconsistency:** Highlight how constructive systems resist paradoxes (e.g., Curry’s paradox) by restricting logical rules.  

  **Recommendation:**  
  Abandon the analogy as primary argument. Instead:  
  - **For the character:** Let them wrestle with classical proof’s "oracular" power—e.g., it feels like accessing truth without building it.  
  - **For debate:** Cite Gödel: Classical math is *stronger* but less transparent. Its "awe" stems from transcending algorithmic constraints, not self-delusion.  

