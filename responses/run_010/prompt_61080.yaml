  - All dialogue clipped - no monologues per user's request

  For the philosophical tension:
  The core conflict should be about aggregation thresholds - can infinite small pains outweigh one large agony? This forces Aris to confront whether suffering has qualitative breaks. The pinprick objection emerges when a petitioner argues that under her logic, preventing a papercut would justify extinction.

  The ending must be tactile: perhaps her final conversion factor written on glass, reflected against petitioners' faces outside. No resolution - just the weight of the number.

  Key scenes:
  1. Hearing room cold open (establish table through use)
