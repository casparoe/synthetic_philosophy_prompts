  - Crafting a central dilemma that arises from internal contradictions within negative utilitarianism
  - Handling the "pinprick objection" organically in dialogue
  - Maintaining strict show-don't-tell throughout

  Hmm, the Aggregation Problem seems more dramatically fertile than the Pleasure-Erasure scenario. The migraine vs torture dilemma creates immediate visceral stakes. Let's set up:
