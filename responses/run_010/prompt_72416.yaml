answer: |-
  Below is a comprehensive Attribution and Authentibility Review procedure designed for your museum's panel. It addresses your core requirements: a fixed, non-specialist-executable sequence grounded in philosophical principles (translated into operational questions), avoidance of the indiscernibility objection and connoisseurship, a sharp distinction between forgery/replication, explicit handling of hybrids, and clear dispositions. The procedure excludes non-relevant matters (e.g., restitution, market value) and accounts for your constraints (90 minutes/object, no authority for new technical work). Predictable misfires and the three case studies are detailed in prose, followed by a one-page table summarizing the procedure.

  ### Grounding in Philosophical Principles
  The procedure operationalizes key ideas from forgery/originality philosophy (e.g., Dutton, Goodman, Lessing) without direct citation:
  - **Indiscernibility**: A perfect copy lacks the historical, intentional, and contextual "narrative" of an original, making its value derivative. Thus, attribution decisions hinge on evidence of **origins and history**, not appearance.
  - **Forgery vs. Replication**: Legitimate replicas (e.g., posthumous casts from an artist’s model) involve no intent to deceive at creation, while forgeries do. Hybrids (e.g., a copy later misrepresented) are treated as forgeries from the point of deception.
  - **Value of Originals**: An object’s status depends on its **provenance**, **maker’s intent**, and **integrity** (material continuity). Heavily restored objects retain value if they preserve historical continuity (e.g., "the object displayed since 1931").
  - **Transparency**: Public trust requires correcting misattributions that misled stakeholders, regardless of aesthetic merit.

  ### Procedure Design
  - **Non-Specialist Execution**: A registrar or student can run the sequence using file documents (catalog records, lab reports, provenance files). No visual analysis is permitted.
  - **Fixed Dispositions**: Six options (e.g., qualify attribution, public correction) triggered at specific steps.
  - **Judgment Flags**: Steps 5 and 6 involve value choices (explicitly stated) where the panel weighs ethics, transparency, and institutional priorities.
  - **Referrals**: If new evidence (e.g., technical analysis) is needed, the procedure halts, and an interim disposition (always #4: Withdraw from Display Pending Review) is applied until external partners provide data.
  - **Exclusions**: The procedure **cannot** address:
    - Looting/restitution (ethical/legal process).
    - Legal title (administrative/legal determination).
    - Market/insurance value (appraiser/insurer role).
    - Aesthetic quality ("goodness").
    - Cultural affiliation (requires community consultation).
  - **Predictable Misfires**:
    - **Ambiguous Evidence**: The procedure may force binary choices (e.g., forgery vs. replica) when evidence is inconclusive, leading to arbitrary dispositions.
    - **Costly Referrals**: If external technical work is unaffordable, objects stall in disposition #4 indefinitely.
    - **Value Choice Deadlocks**: Panel disagreements at Steps 5–6 may require director intervention.
    - **Connoisseurship Bias**: Panelists may unconsciously inject visual opinions despite rules; training is essential.

  ### Worked Case Studies
  #### Case 1: Small Panel (Workshop with Master’s Hand)
  - **Step 1**: Trigger = Partner lab imaging. Current attribution = Named master.  
  - **Step 2**: Production history = Workshop (per lab); disclosure history = Always attributed to master by donor/museum. **Insufficient**—inconsistent, proceed.  
  - **Step 3**: Integrity = Hybrid (master’s faces, workshop body). Proceed.  
  - **Step 4**: Intention = No deceit at creation (workshop norm); misrepresentation by donor/museum. Proceed.  
  - **Step 5**: Significance = Visitor favorite, donor’s namesake gift. **Value choice**: Preserve historical narrative (display) vs. strict attribution. Choice = Retain with reinterpretation.  
  - **Step 6**: Public commitment = Long-standing public attribution. **Value choice**: Transparency (correct) vs. embarrassment. **Disposition** = #2 (Qualify attribution: "Workshop of [Master], faces by master?") + #5 (Public correction due to donor/museum misrepresentation).  
  - **Outcome**: Attribution qualified; donor notified; public correction issued (e.g., website update, donor letter).

  #### Case 2: Posthumous Bronze (Alumnus Gift)
  - **Step 1**: Trigger = Donor’s public claim of "original." Current attribution = None (proffered gift).  
  - **Step 2**: Production history = Foundry marks/paperwork confirm posthumous cast from artist’s model; disclosure history = Donor misrepresented as "original." Proceed.  
  - **Step 3**: Integrity = Legitimate replica (original model, new material). Proceed.  
  - **Step 4**: Intention = No deceit at creation (marks/paperwork honest); misrepresentation by donor. Proceed.  
  - **Step 5**: Significance = Historical value as posthumous cast. **Value choice**: Expand collection (include replicas) vs. originals-only policy. Choice = Collect with qualifications. **Disposition** = #2 (Qualify attribution: "Posthumous cast from artist’s model") + #6 (Decline gift unless donor retracts public claim).  
  - **Outcome**: Gift declined if donor refuses retraction; accepted with attribution if donor complies. No public correction (donor’s error, not museum’s).

  #### Case 3: Drawing (Withdrawn Attribution, Displayed Unchanged)
  - **Step 1**: Trigger = Specialist’s withdrawn attribution 15 years ago. Current attribution = Well-known artist (unchanged).  
  - **Step 2**: Production history = Specialist’s report (no technical evidence); disclosure history = Museum ignored report, displayed as artist. **Insufficient**—no documentation of origins. **Disposition** = #4 (Withdraw from display) + Referral for technical analysis.  
  - **After Referral**: Lab confirms forgery.  
    - **Step 4**: Intention = Created to deceive. Proceed.  
    - **Step 5**: Significance = None noted (no visitor/donor impact). **Disposition** = #3 (Withdraw attribution, reinterpret as forgery).  
    - **Step 6**: Public commitment = 15 years of display. **Value choice**: Transparency vs. embarrassment. **Disposition** = #5 (Public correction required).  
  - **Outcome**: Public correction issued (e.g., press release, catalog update). No quiet resolution—**your expectation is correct**. The museum’s prolonged misrepresentation necessitates public accountability. A quiet label change (#2) would only apply if the attribution was always tentative (e.g., "attributed to") and the change minor, but here the attribution was definitive and the error egregious.

  ---

  ### Attribution and Authenticity Review Procedure (Table)
  **Instructions**: Execute steps in order. Use file documents only—no visual analysis. For referrals (new evidence needed), apply disposition #4 and pause procedure. Dispositions:  
  1. Retain attribution unchanged.  
  2. Qualify attribution (label/catalog).  
  3. Withdraw attribution; retain/reinterpret object.  
  4. Withdraw from display pending review (interim for referrals).  
  5. Issue public correction.  
  6. Decline proffered gift.

  | Step | Question                                                                 | Sufficient Answer                                                                 | Insufficient Answer                                                                 | Disposition(s) Triggered                                                                 | Sign-off       | Judgment Flag (Y/N; If Y, Choice) |
  |------|--------------------------------------------------------------------------|-----------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|----------------|-----------------------------------|
  | 1    | What is the current attribution and what specific event triggered review? | Clear attribution statement from catalog; verifiable trigger (e.g., lab report, donor letter). | Vague trigger (e.g., "suspicion"), or no challenge to attribution.                 | If insufficient: #1 (retain). Else: Proceed.                                             | Non-specialist | N                                 |
  | 2    | What does documentation say about production (who, when, how) and disclosure (ownership/sale history, prior representations)? | Direct evidence: contracts, invoices, inscriptions, conservation reports, or prior catalog entries. | Only stylistic analysis; no documents; gaps in provenance.                         | If consistent with attribution: #1 (retain). If inconsistent: Proceed. If insufficient: #4 (withdraw) + Referral. | Non-specialist | N                                 |
  | 3    | What is the object’s material integrity? (e.g., % original, interventions, hybrid status) | Technical report (e.g., lab imaging) detailing materials/alterations; documents confirming when interventions occurred. | No technical report; reliance on visual assessment.                                | If original/hybrid: Proceed. If minimal integrity (e.g., <20% original): Proceed to Step 5. If insufficient: #4 (withdraw) + Referral. | Panel          | N                                 |
  | 4    | Was the object created with intent to deceive? Was it ever misrepresented? | Direct evidence of intent/misrepresentation: fraudulent marks, deceptive sales, or admissions (e.g., forger’s confession). | Speculation; legitimate replication (e.g., posthumous cast with honest disclosure). | If forgery: Proceed to Step 6. If replica/hybrid: Proceed to Step 5. If insufficient: #4 (withdraw) + Referral. | Panel          | N                                 |
  | 5    | Does the object have historical/cultural significance independent of attribution? (e.g., long display, visitor impact, association with events/people) | Evidence: Visitor data, exhibition history, donor significance, or educational value (e.g., "used in teaching since 1950"). | Aesthetic praise; market value; no documented significance.                         | If yes: Choice of #2 (qualify) or #3 (reinterpret). If no (and forgery): Proceed to Step 6. If no (and replica): #6 (decline gift) or #3 (reinterpret). | Panel          | Y; Preserve historical narrative vs. Strict attribution standards. |
  | 6    | Did the museum publicly commit to an incorrect attribution? (e.g., publications, major displays, donor agreements) | Proof: Exhibition catalogs, press releases, plaques, or insurance records with incorrect attribution. | Internal records only; attribution always qualified (e.g., "attributed to").        | If yes: #5 (public correction required). If no: #2 (quiet label change). For forgeries, always #5. | Panel + Director | Y; Transparency vs. Avoid embarrassment/donor conflict. |

  This procedure ensures consistency, minimizes panel disputes, and upholds ethical standards. For implementation, train panelists on strict adherence to documentary evidence and use the table as a quick-reference guide during reviews.
