prompt: |-
  I am the registrar and collections manager at a small university teaching museum — roughly fourteen thousand objects, two full-time curators, no conservator on staff, and technical examination contracted out through a partner institution's lab. Eighteen months ago the director asked me to convene a standing Attribution and Authenticity Review panel: two curators, a faculty art historian, a conservator from the partner lab, one graduate student member, and me as chair. We meet monthly, and weekly during a review cycle of a single collection. Our mandate is narrow but endlessly recurring: whenever an object's authorship, period, or status as an original is called into question — by the lab's imaging, by an outside scholar, by a journalist, by the donor, or by our own re-cataloguing — the panel must decide what the museum says about the object and what the museum does with it. We have no written method, so meetings dissolve into art-historical argument while the wall label, the accession record, the online catalogue entry, and the insurance valuation drift further out of agreement with one another. I need a procedure: a fixed sequence of questions the panel runs on any such object, in order, that a non-specialist can execute — my student member, or me acting alone between meetings — without being able to adjudicate connoisseurship disputes.

  It has to be grounded in what the philosophical literature on forgery, copies, and the value of originals actually argues, but I want those arguments translated into questions rather than cited, and I want no reading list. Two things in particular we get wrong in discussion, and the procedure must not inherit our errors. First, the indiscernibility objection: whenever attribution is questioned, someone asks why it matters if the substitute panel would look exactly the same, and the panel then spends an hour trying to find perceptual differences it cannot find. The procedure must say, in operational terms, what is being decided when we downgrade an object that looks precisely as it did last year and looks just as good, and it may not make any step depend on a looking-based test. Second, the distinction between forgery and legitimate replication — posthumous casts from the sculptor's own model, studio replicas, workshop production with the master's hand in parts, later interventions that replaced original material, honest reproductions sold as such — where the operative facts concern the maker's intention, the object's history of disclosure and ownership, and how it came to be, not how it appears. I want that distinction kept sharp, and I want explicit handling of the hybrids: a nineteenth-century copy that was subsequently passed off as an original; a workshop panel that the master finished; a heavily restored object in which almost no original substance survives but which is nonetheless the very object that has hung in this building since 1931.

  For each step, state what counts as a sufficient answer and what counts as an insufficient one, which of a fixed set of dispositions the step triggers (retain attribution unchanged; qualify attribution in the label and catalogue record; withdraw attribution but retain and reinterpret the object; withdraw from display pending review; issue a public correction of the record; decline a proffered gift), who must sign off, and — flagged separately and conspicuously — the steps at which the panel is not uncovering a fact but making a value choice, together with a sentence naming what the choice is between. Also state what the procedure cannot settle (looting and restitution, legal title, market value and insurable value, whether an object is good, questions of cultural affiliation) and the ways in which it will predictably misfire on real files. Bear in mind our constraints: ninety minutes per object, and no authority to commission new technical work ourselves, so any step requiring new evidence must be marked as a referral out with an interim disposition specified.

  Then run the procedure end to end on three files. (1) A small panel long catalogued under a named master's name; the partner lab's imaging suggests predominantly workshop production, with the master's hand confined to the faces. It is a visitor favorite and it is the donor family's namesake gift. (2) A bronze offered by an alumnus whose foundry marks and paperwork indicate it was cast decades after the sculptor's death from the sculptor's own model, and which the donor has described in print, in a local paper, as an original. (3) A drawing whose attribution to a well-known hand was withdrawn by a specialist fifteen years ago and which we have continued to display under the old name with no note anywhere. Take the third to be the case where the procedure delivers a result the museum will not like: I expect it to force a public correction rather than a quiet label change, and I want the procedure to tell me whether that expectation is correct or whether there is a defensible route to resolving it quietly. Finally, after the prose procedure, give me the whole thing as a table with exactly these columns: Step | Question put to the file or the object | Sufficient answer | Insufficient answer | Disposition(s) triggered | Sign-off | Judgment flag (Y/N), and if Y, what is being chosen between. Keep the table to one page and put everything else — the grounding of the questions, the hard cases, the exclusions, the misfire modes, and the three worked files — in prose above it.
reasoning: |-
  We are designing a procedure for the Attribution and Authenticity Review panel. The procedure must be a fixed sequence of questions that can be executed by a non-specialist (like the student member or the registrar acting alone) and that does not rely on connoisseurship (looking-based tests). It must avoid two major pitfalls: the indiscernibility objection (arguing about perceptual differences) and the blurring of the distinction between forgery and legitimate replication.

  Key principles from the philosophical literature (without citation):
  - The value of an original often lies in its historical and cultural context, its provenance, and the fact that it was created by a particular individual at a particular time. A perfect copy, even if visually identical, lacks this historical connection.
  - Forgeries are deceptive by intention and history, while legitimate replicas (like posthumous casts from the original model) are often made without intent to deceive and with transparency.
  - The status of an object can change over time (e.g., a copy later passed off as an original becomes a forgery) and can be hybrid (e.g., a workshop piece with master's intervention).

  The procedure must:
  1. Be grounded in the above but translated into a series of operational questions.
  2. Avoid any step that depends on perceptual differences.
  3. Clearly distinguish between the object's history of production (including maker's intention, disclosure, and ownership) and its appearance.
  4. Explicitly handle hybrid cases.

  Structure of the procedure:
  - Steps are sequential and each step has:
    - A question
    - What counts as sufficient and insufficient answers
    - The disposition(s) triggered by the step (from a fixed set)
    - Who must sign off (could be the panel, the chair, or the non-specialist)
    - A judgment flag (Y/N) indicating if the step involves a value choice (and if Y, what the choice is between)

  Fixed set of dispositions (to be used consistently):
  1. Retain attribution unchanged.
  2. Qualify attribution in the label and catalogue record (e.g., add "attributed to", "workshop of", etc.).
  3. Withdraw attribution but retain and reinterpret the object (e.g., display as "Anonymous" or with a new context).
  4. Withdraw from display pending review (if more information is needed and the current attribution is too misleading to display).
  5. Issue a public correction of the record (e.g., a press release, update online, notify donors, etc.).
  6. Decline a proffered gift (for objects under consideration for acquisition).

  The procedure cannot settle:
  - Looting and restitution (this is a separate ethical/legal process)
  - Legal title (this is a matter for the administration and lawyers)
  - Market value and insurable value (this is for appraisers and insurers)
  - Whether an object is good (aesthetic judgment is not our purpose)
  - Questions of cultural affiliation (this is for cultural specialists and communities)

  Constraints:
  - 90 minutes per object.
  - No authority to commission new technical work. If new evidence is needed, mark as a referral out and specify an interim disposition.

  Predictable misfires:
  - When the evidence is ambiguous and the procedure forces a binary choice.
  - When the required referral for new technical work is too costly and the interim disposition is unsatisfactory.
  - When the panel disagrees on a value choice step and the procedure does not specify how to break the tie (we assume the panel votes, but the procedure must be clear).

  Procedure Steps:

  We design a sequence of 6 steps. The non-specialist (or panel) must follow these in order. Each step must be answered with the available evidence. If a step requires new evidence, the procedure halts and refers out.

  Step 1: Establish the current attribution and the reason for review.
     - Question: What is the object's current attribution (as stated in the accession record, label, online catalogue) and what event or evidence triggered this review?
     - Sufficient: Clear statement of current attribution and the trigger (e.g., technical report, scholar's letter, etc.).
     - Insufficient: Vague or missing trigger.
     - Disposition: None (procedural step). But if the trigger is insufficient (e.g., a vague suspicion), the review may be terminated with disposition 1 (retain) and the trigger documented.
     - Sign-off: Non-specialist (registrar or student) can do this step.
     - Judgment flag: N

  Step 2: Determine the object's history of production and disclosure.
     - Question: What is the known history of the object's production (who made it, when, under what circumstances) and its history of disclosure (how has it been represented in previous ownerships, sales, and by the museum)?
     - Focus on documentary evidence: inscriptions, marks, bills of sale, prior catalogues, conservation records, etc. Not appearance.
     - Sufficient: Documentary evidence that establishes a clear chain of production and disclosure (e.g., a bill of sale describing it as a copy, or a conservation report noting a restoration).
     - Insufficient: Only stylistic analysis or connoisseurship (which we avoid) or no evidence.
     - Disposition: If the history of production and disclosure is clear and consistent with the current attribution, then disposition 1 (retain). If inconsistent, then move to step 3. If insufficient evidence, then disposition 4 (withdraw from display pending review) and refer out for further research (which may include technical work, but we cannot commission it, so we just note the gap).
     - Sign-off: Non-specialist can do this step if the evidence is clear. If not, the panel must decide.
     - Judgment flag: N (factual)

  Step 3: Assess the integrity of the object's substance and the nature of interventions.
     - Question: What is the nature and extent of the original material versus interventions (restorations, replacements, additions)? And are these interventions part of the object's history of production (e.g., workshop production) or later alterations?
     - We are not judging by appearance but by technical reports and provenance records.
     - Sufficient: Technical report (e.g., from the partner lab) that details the material composition and interventions, and any documentary evidence about when interventions occurred.
     - Insufficient: No technical report or only visual assessment.
     - Disposition: 
          - If the object is largely original with minimal intervention: move to step 4.
          - If the object is a hybrid (e.g., workshop piece with master's hand in parts) or has significant interventions but the original creation context is clear: move to step 4.
          - If the object has been so heavily altered that the original substance is minimal (e.g., a heavily restored painting with little original paint) but the object is historically significant (e.g., it's the same object that has been in the museum since 1931): then we move to step 5 (which considers historical significance) and later we may use disposition 3 (withdraw attribution but retain and reinterpret) or 2 (qualify attribution).
          - If the evidence is insufficient: disposition 4 (withdraw pending review) and refer out for technical analysis (if not already done). Note: we cannot commission, so if no report exists and we don't have one, we must withdraw until we can get one (via partner lab or other means).
     - Sign-off: Panel must be involved if there is ambiguity. Non-specialist can only proceed if the report is clear.
     - Judgment flag: N (factual)

  Step 4: Evaluate the intention and context of creation.
     - Question: Was the object created with the intention to deceive (at the time of creation) or was it created as a legitimate replica, workshop product, or with honest disclosure? And has it ever been misrepresented (by others) after creation?
     - This step requires documentary evidence: contracts, bills of sale, inscriptions, etc.
     - Sufficient: Clear evidence of intention (e.g., a contract for a workshop replica, or a bill of sale that says "forgery").
     - Insufficient: Only stylistic analysis or speculation.
     - Disposition:
          - If the object was created without intent to deceive and with honest disclosure (e.g., a posthumous cast from the original model sold as such): then we are dealing with a legitimate replica. Move to step 5.
          - If there was intent to deceive at creation: then it's a forgery. Move to step 6.
          - If the object was created without intent to deceive but later misrepresented (e.g., a copy that was sold as an original in the 20th century): then it's a hybrid case (legitimate creation but later deceptive history). Move to step 5.
          - If the evidence is insufficient: disposition 4 (withdraw pending review) and refer out for further research.
     - Sign-off: Panel must decide because this is a critical step and may require interpretation of evidence.
     - Judgment flag: N (factual, because we are relying on documentary evidence of intention and representation)

  Step 5: Determine the object's historical and cultural significance independent of attribution.
     - Question: Does the object have significant historical or cultural value that is independent of its attribution? (e.g., it has been in the museum's collection for a long time, it is a favorite of visitors, it is associated with a notable event or person, or it is an important example of a type of object even if not by the master.)
     - This step involves a value choice: we are choosing between emphasizing the object's historical/cultural value versus strictly adhering to the principle that only the original (with correct attribution) has value.
     - Sufficient: Evidence of long-term display, visitor impact, association with important events or people, or significance as an example of a practice (e.g., 19th-century copying of old masters).
     - Insufficient: Only arguments about aesthetic quality or market value.
     - Disposition:
          - If yes, then the panel must choose between two paths: 
              a) If the object is a legitimate replica or a hybrid with historical significance: then we can retain it and use a qualified attribution (disposition 2) or withdraw attribution and reinterpret (disposition 3). 
              b) If the object is a forgery (from step 4) but has historical significance (e.g., a famous forgery that the museum has displayed for years): then we might choose to retain and reinterpret (disposition 3) as a forgery, which would require a public correction (disposition 5) because of the deception involved.
          - If no, then move to step 6 for forgeries or to disposition 6 (decline gift) if it's a proffered gift, or if already in the collection, consider disposition 3 or 4 (but note: we must be cautious about keeping forgeries without historical significance).
     - Sign-off: Panel must decide because this is a value choice.
     - Judgment flag: Y. The choice is between:
          - Preserving the object's historical and cultural narrative (even if it is not what we thought) versus
          - Adhering strictly to the principle that the museum only displays objects with correct and verified attributions, which might lead to deaccessioning or permanent withdrawal.

  Step 6: Decide on the need for public correction.
     - Question: Has the museum previously published or publicly displayed the object under an attribution that is now found to be incorrect, and if so, to what extent was the public or specific stakeholders (donors, scholars) misled?
     - This step is about the museum's duty to correct the record.
     - Sufficient: Evidence of public display or publication with the incorrect attribution and the extent of the error (e.g., the object was a centerpiece in an exhibition, the donor family has built their identity around it, or it was published in the museum's catalogue raisonné).
     - Insufficient: The object has only been displayed internally or the attribution was always qualified.
     - Disposition:
          - If the museum has publicly committed to the attribution (e.g., in a published catalogue, on a donor plaque, in press releases) and the new conclusion is a downgrade (e.g., from master to workshop) or a revelation of forgery, then disposition 5 (issue a public correction) is required.
          - If the attribution was always tentative (e.g., "attributed to") and the change is minor, then a quiet label change (disposition 2) may be sufficient.
          - For forgeries, a public correction is almost always required because of the element of deception and the museum's role in exposing it.
     - Sign-off: Panel must decide, and the director should be consulted for major public corrections.
     - Judgment flag: Y. The choice is between:
          - Maintaining the museum's reputation for transparency and scholarship (by issuing a public correction) versus
          - Avoiding potential embarrassment, donor relations issues, or public confusion (by handling it quietly).

