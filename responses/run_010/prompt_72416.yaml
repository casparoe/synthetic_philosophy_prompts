  Step 4: Intention and context: The object was created in the master's workshop, so there was no intent to deceive at creation. It was a normal workshop practice. However, it was later attributed fully to the master by the donor and museum. So there was post-creation misrepresentation. This is a hybrid case (legitimate production but later misattribution). Move to step 5.

