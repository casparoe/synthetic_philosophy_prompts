answer: |-
  ### Principle for Ranking House States

  The principle that captures all seven verdicts is based on **protected personal domains with externality-based collective override**, defined by two conditions on the ranking of states:

  1. **Personal Sovereignty (PS)**:  
     For any two states \(x\) and \(y\) that differ **only** in features within individual \(i\)'s protected personal domain, and where this difference **does not affect** others (no externality), the ranking must reflect \(i\)'s preference. The preferences of others over \(i\)'s personal domain features are irrelevant.  
     - Formally: If \(x\) and \(y\) differ solely in \(i\)'s personal domain features with no externality, then \(x \succ y\) iff \(i\) prefers \(x\) to \(y\), and \(x \sim y\) iff \(i\) is indifferent. Others' preferences over \(\{x, y\}\) are excluded from the ranking.

  2. **Externality-Triggered Pareto (EP)**:  
     For any two states \(x\) and \(y\) where a change in features **causes externalities** (affects others) or involves **communal resources**, the ranking must respect the Pareto principle: if all individuals prefer \(x\) to \(y\), then \(x \succ y\). Bargaining or voting may resolve non-unanimous cases.  
     - Formally: If \(x\) and \(y\) differ in ways that cause externalities or involve communal resources, then unanimous strict preference for \(x\) over \(y\) implies \(x \succ y\). Non-unanimous cases are resolved collectively (e.g., bargaining, voting).

  **Protected personal domains** are context-specific:  
  - R's bedroom interior (seen only by invitation).  
  - Your kitchen radio use (while cooking).  
  - *Externality* = physical impact (e.g., smell, sound) on others' domains or communal areas.

  ---

  ### Verdicts Explained by the Principle

  - **Verdict 1 (R's poster)**: PS applies (no externality). Only R's preference matters. Others' distaste is irrelevant.  
  - **Verdict 2 (Your radio)**: PS applies (no externality). Only your preference matters.  
  - **Verdict 3 (Unanimous poster removal)**: PS still applies, but R now prefers removal. No conflict: R exercises sovereignty.  
  - **Verdict 4 (£20 offer)**: EP applies. Involves communal money (£20) and R's personal domain. Unanimous acceptance → Pareto improvement. Not "vote-buying" as R retains sovereignty (must consent); the trade is Pareto-valid.  
  - **Verdict 5 (Irrelevant preferences)**: PS explicitly excludes others' preferences in personal domains without externalities. The right enforces this exclusion.  
  - **Verdict 6 (Smoking ban)**: EP applies. Smell in corridor → externality. House may decide collectively.  
  - **Verdict 7 (Door open/shut)**: EP applies. Draught affects you → externality. Bargaining is a valid collective resolution (EP allows non-unanimous methods).  

  ---

  ### Two New Cases

  **Case 1: Loud Kitchen Radio**  
  - You play radio loudly while cooking; sound disturbs others in the living room.  
  - **Principle**: EP applies (externality). House may collectively decide (e.g., bargain for lower volume, vote on rules).  
  - **Verdict**: Not your call alone. Ranking depends on collective preference (e.g., if all prefer quiet, radio off \(\succ\) on).

  **Case 2: R's Bedroom Painting**  
  - R paints his bedroom door (interior) a bright color; visible only when he invites others in.  
  - **Principle**: PS applies (no externality). Only R's preference matters. Others’ distaste is irrelevant.  
  - **Verdict**: R’s call. House outvoting him violates PS.

  ---

  ### Limitations and Trade-offs

  - **Verdict 4's worry**: The principle saves it (Pareto-improvement with consent), but you must accept that rights can be *voluntarily traded* without coercion. The "vote-buying" unease stems from conflating rights with inalienability—here, rights are *waivable* via bargaining.  
  - **What to give up?** No verdicts sacrificed—all fit. However, **Verdict 5** needs refinement: the right *does work* by excluding irrelevant preferences from the ranking (PS), even if they "never counted." Without PS, irrelevant preferences could enter rankings (e.g., via majority rule).  

  ---

  ### Rights as Filter vs. Sen's Paradox

  - **Rights as filter**: The principle treats rights as a **filter on admissible rankings** (PS restricts how preferences are aggregated) rather than decisive power over pairs.  
  - **Escapes Sen's paradox? Yes.** Sen’s paradox requires:  
    - (i) Unrestricted domain (all preferences allowed),  
    - (ii) Minimal liberalism (each person decisive over some pair),  
    - (iii) Pareto optimality.  
    The paradox arises when (i)–(iii) conflict (e.g., meddlesome preferences override rights).  
  - **This principle avoids conflict by**:  
    - Restricting domain via PS (excluding irrelevant preferences),  
    - Allowing Pareto (EP) only when externalities exist or rights are waived.  
    Meddlesome preferences are ignored in personal domains (PS), so no clash with Pareto. Bargaining (Verdicts 4,7) resolves conflicts voluntarily.  
  - **Not a relocation**: Genuine escape. Rights filter out meddlesome preferences *before* aggregation, preventing paradox conditions from intersecting. Collective decisions (EP) activate only for externality-involving states, preserving autonomy elsewhere.  

  ---

  **Summary**: The principle unifies your verdicts by conditioning rights on externalities, excluding irrelevant preferences in personal domains, and allowing Pareto/bargaining when externalities or communal resources are involved. It escapes Sen’s paradox by restricting preference aggregation.
