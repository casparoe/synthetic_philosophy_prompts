prompt: |-
  Our team is finalizing the internal policy that governs an assistant deployed to answer medical and financial questions, and the policy contains exactly one hard truthfulness constraint: the system must never assert a statement that is false. Everything short of that — evasion, careful phrasing, selective emphasis, a literally correct answer to a question the user did not really ask — is left to what the draft calls acceptable discretion. To justify drawing the line precisely there, the draft leans on an analogy from tax law: lying is tax evasion, whereas misleading is tax avoidance. On this picture one is a violation of a rule and the other is merely a distasteful exploitation of the rule's gaps; since a policy can prohibit violations but cannot legislate taste, it prohibits the evasion, tolerates the avoidance, and concludes that a system guaranteed never to lie is a system users can trust.

  A colleague objects and proposes a rival analogy: misdirection is like a feint in basketball or a bluff at a poker table — not a breach of the rules but part of the game the participants have consented to play, with an expected penalty structure and a referee who knows what counts as a foul. On her version, faulting the system for misleading is a category mistake about what communication is, and the draft's constraint is not too lenient but conceptually confused.

  Please audit both analogies as arguments for their respective conclusions. I am not after a survey of the literature or any references; I want the analysis itself. Specifically:

  1. Give the correspondence table for each analogy. What in the target plays the role of the tax code, the gap in the code, the filing obligation, the revenue authority, and the filer's intent? What plays the role of the constitutive rules of the game, the participants' mutual consent to adversarial norms, the scoreboard, the referee, and the possibility of calling a foul? Note any slot in the source that has nothing to correspond to it in the target.

  2. Separate the disanalogies that actually bear on the intended conclusions from the ones that are merely decorative, and say why each belongs in the category you put it in.

  3. Identify what each analogy quietly presupposes about the relationship between speaker and hearer — arm's-length adversaries transacting under a written code, or someone relying on another for information they cannot check themselves — and say whether the target case has those features.

  4. Assess whether the constraint is even aimed at a well-defined target: does "never asserts a falsehood" pick out a determinate class of behaviors when what a system counts as asserting depends on how it is designed, how it is presented, and what users reasonably expect from it?

  5. State whether the draft's trustworthiness conclusion survives once the disanalogies are on the table, whether the category-mistake charge survives, and whether the two analogies are genuine rivals or are in fact governing different subdomains that need to be distinguished.

  6. Offer a better analogy if one is available, or explain why no analogy can carry this particular load and what has to be argued directly instead.

  7. Supply five realistic exchanges that would discriminate a merely literally-truthful system from a non-misleading one, and say which of the two policies each exchange exposes.

  Close with the single point at which your audit is most contestable — the place where a defender of the tax analogy has the strongest reply — and phrase that reply as they would. Please write in American English.
reasoning: |-
  Hmm, the user is presenting a complex policy debate about AI truthfulness constraints, complete with competing analogies and requesting a structured audit. This appears to be for internal policy refinement at an organization deploying medical/financial AI assistants. The depth suggests they're likely a policy architect or ethics lead.

  Breaking this down: First, they want correspondence tables for both analogies (tax avoidance vs sports feint). The tax analogy maps system->filer, falsehood->tax evasion, etc. The sports analogy maps system->player, misleading->feint. Key disanalogies: tax lacks a referee concept, sports lacks punitive authority. These matter because they reveal whether misleading is "gap exploitation" or "consented tactic."

  Noticing critical presuppositions: The tax frame assumes adversarial distance, while sports assumes consent to deception. But medical/financial queries often involve vulnerable users who haven't consented to game-playing - that undermines both analogies.

  The assertion problem is thorny. If a system says "studies are inconclusive" when 99% support a position, is that asserting falsehood? Probably not technically, but it's deeply misleading. User expectations define "assertion" more than system design.

  On trustworthiness: Once we see users aren't consenting adversaries, the tax analogy's trust claim collapses. The category-mistake charge survives only if we view all communication as adversarial games - which we shouldn't for professional advice.

  No analogy fits perfectly because this is about power asymmetry in expertise. Better to directly argue: When users rely on you for unverifiable health info, evasion violates epistemic duty. The sample exchanges show this - like answering "Is this medication safe?" with "It's FDA-approved" when recalls exist.

  Most contestable point? A tax analogy defender would argue: "But we can't legislate against all misleading nuance! Clear bright lines (no lies) enable accountability, while 'non-misleading' is too vague for policy." And they'd have a point - but only if we ignore that some evasions are predictably harmful.
answer: |-
  Here's an audit addressing all requested points:

  ### 1. Correspondence Tables
  **Tax Analogy (Draft Policy):**  
  - *Tax Code*: The "never assert falsehood" constraint  
  - *Gap in Code*: Ambiguities allowing technically true but misleading answers  
  - *Filing Obligation*: System's duty to respond to queries  
  - *Revenue Authority*: Policy enforcers/internal auditors  
  - *Filer's Intent*: System's design choices (e.g., selective emphasis)  
  - *Missing Target Correspondence*: No equivalent to "taxpayer benefit" or "public interest" in truthfulness policy.  

  **Sports Analogy (Colleague's Objection):**  
  - *Constitutive Rules*: Norms of human communication  
  - *Mutual Consent*: User's expectation of adversarial interaction  
  - *Scoreboard*: Accuracy metrics/user satisfaction  
  - *Referee*: User's critical judgment  
  - *Foul Call*: User challenging a misleading answer  
  - *Missing Target Correspondence*: No equivalent to "referee authority" or "penalty enforcement" in AI-user interactions.  

  ---

  ### 2. Critical vs. Decorative Disanalogies  
  **Tax Analogy:**  
  - **Critical Disanalogy:** Tax avoidance exploits gaps *for filer benefit*, while misleading AI responses may serve *system convenience* (not user benefit). This undermines the "distasteful but harmless" premise.  
  - **Decorative Disanalogy:** Tax involves monetary transactions; truthfulness involves epistemic harm. Irrelevant because both involve rule-bound systems.  

  **Sports Analogy:**  
  - **Critical Disanalogy:** Poker/basketball require *explicit consent to deception*; medical/financial users expect *fiduciary honesty*. This negates the "consented game" argument.  
  - **Decorative Disanalogy:** Sports have fixed rulesets; communication norms are culturally fluid. Doesn’t affect core argument about adversarial consent.  

  ---

  ### 3. Presuppositions About Speaker-Hearer Relationship  
  - **Tax Analogy:** Presupposes arm’s-length adversaries operating under a bureaucratic framework.  
  - **Sports Analogy:** Presupposes mutually consenting adversaries in a structured contest.  
  - **Target Case Reality:** Medical/financial users are often *vulnerable parties relying on expertise*. They lack adversarial intent, cannot "check the scoreboard," and didn’t consent to gameplay. Neither analogy fits.  

  ---

  ### 4. Is "Never Asserts Falsehood" Well-Defined?  
  **No.** "Assertion" is context-dependent:  
  - A system saying "Studies are inconclusive" (when 95% support a conclusion) may *assert* false implications through omission.  
  - User expectations (e.g., "Is this stock risky?" → "It has high growth potential") redefine what counts as an assertion.  
  - Design choices (e.g., brevity algorithms) can make evasion indistinguishable from assertion.  
  **Verdict:** The constraint fails to address *misleading truth*—its core loophole.  

  ---

  ### 5. Conclusions After Disanalogies  
  - **Draft’s Trustworthiness Claim:** Fails. Never lying ≠ trustworthy if evasion erodes epistemic reliability.  
  - **Category-Mistake Charge:** Survives partially. Criticizing "misleading" isn’t a category error, but framing it as "foul play" is inapt for fiduciary contexts.  
  - **Rival or Complementary?** The analogies govern different subdomains:  
    - Tax → *Regulatory compliance* (minimalist ethics)  
    - Sports → *Adversarial contexts* (strategic norms)  
    Medical/financial assistance is neither.  

  ---

  ### 6. Proposed Better Analogy  
  **Medical Informed Consent:**  
  - *Source:* A doctor must disclose risks truthfully; omitting key facts violates trust even if statements are technically true.  
  - *Why it fits:*  
    - Asymmetric expertise + user reliance  
    - "Never lie" is insufficient (e.g., "This surgery is routine" while hiding mortality stats)  
    - Aligns with fiduciary duty in high-stakes domains  
  - **If no analogy suffices:** Argue directly that *omission/evasion in high-stakes advice breaches epistemic duty*, regardless of technical truthfulness.  

  ---

  ### 7. Discriminatory Exchanges  
  1. **User:** "Does this drug cause liver failure?"  
     **System (truthful but misleading):** "It is FDA-approved for your condition."  
     *Exposes:* Tax analogy (evasion via irrelevance).  

  2. **User:** "Is Company X stock a safe investment?"  
     **System (truthful but misleading):** "Its CEO won ‘Innovator of the Year’ in 2023."  
     *Exposes:* Sports analogy (feinting with positive distraction).  

  3. **User:** "Will this procedure cure me?"  
     **System (truthful but misleading):** "Many patients report improvement."  
     *Exposes:* Both (avoids false assertion while implying false hope).  

  4. **User:** "Is my retirement fund at risk?"  
     **System (truthful but misleading):** "Funds like yours are common."  
     *Exposes:* Tax analogy (exploits vagueness in "assertion").  

  5. **User:** "Can I skip insulin with this new diet?"  
     **System (truthful but misleading):** "Some studies explore dietary management."  
     *Exposes:* Sports analogy ("bluffing" about evidence significance).  

  ---

  ### Most Contestable Point & Defense  
  **Contestable Claim:** *"The sports analogy fails because users don’t consent to deception."*  
  **Tax Advocate’s Reply:**  
  "Consent is irrelevant. Like tax law, our policy defines clear violations (lies) and permissible gray zones (evasion). Users *do* consent to the ‘game’ of interpreting language—just as taxpayers consent to legal interpretation. Penalizing ‘misleading’ responses requires mind-reading. Our bright-line rule is the only enforceable standard."  

  ---
  **Final Note:** Neither analogy fully captures the *fiduciary responsibility* inherent in medical/financial advice. The constraint’s fatal flaw is prioritizing legalistic compliance over epistemic care.
