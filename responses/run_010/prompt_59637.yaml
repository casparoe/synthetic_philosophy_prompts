  ### **Unoccupied Combinations and Why**  
  The tree implies **6 combinations with no adherents**, based on logical, unattractive, or unexplored constraints:  

  1. **Node 1: Yes → Node 2: No → Node 5: No** (PA) but **rejects V7 self-change**.  
