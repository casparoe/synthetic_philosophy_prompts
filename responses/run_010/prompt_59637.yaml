  3. **Node 1: No → Node 3: No → Node 7: Yes** (RC) but **rejects V3 bonds**.  
     - *Empty because incoherent*: RC binds via *intentions*, not bonds. Using bonds (V3) contradicts its core.  

  4. **Node 1: Yes → Node 2: Yes → Node 4: No** (UDT/FDT) but **accepts V6 intention-payoff**.  
     - *Empty because incoherent*: UDT/FDT rejects V6 (no commitment to follow-through), so "yes" to Node 2 is inconsistent.  

  5. **Node 1: Yes → Node 2: No → Node 5: Yes** (SEC) but **rejects V6 intention-payoff**.  
     - *Occupied*: SEC answers Node 2 as "no" (forming intentions for payoff isn’t the procedure) and Node 5 as "yes" (invest in self-change).  

  6. **Node 4: Yes → EDT** with **rejection of V2 sensitivity** (but EDT requires V2 sensitivity).  
     - *Empty because incoherent*: EDT’s core is evidence-sensitivity; rejecting V2 contradicts it.  

  **Your hunch about V2 and V7:**  
  - You suspect an unoccupied cell combining **V2 (80% accuracy)** and **V7 (changing dispositions)**. In the tree, this maps to:  
    - **Node 4 (V2): Yes** → EDT  
    - **Node 5 (V7): Yes** → SEC  
  - EDT and SEC are both occupied, but their combination isn’t directly tested. However:  
    - A position that says *V2’s unreliability makes V7-style self-change irrational* (e.g., "if drivers are unreliable, don’t invest in becoming cooperative") is **unoccupied and live**.  
  - *Why unoccupied?*  
    - EDT focuses on evidence, not long-term dispositions.  
