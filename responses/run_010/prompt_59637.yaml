    - CM requires reliability (V5), but V2 isn’t directly about reputation.  
  - *Why live?* It’s coherent: if external reliability is low (V2), costly self-change (V7) may not pay off. Yet no major position advocates this, as most tie rationality to internal states (e.g., intentions) or timeless rules. This gap aligns with your hunch.  

