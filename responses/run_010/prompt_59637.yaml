  Below is a decision tree designed to sort students into distinct positions on rationality in Parfit's hitchhiker and its variants. The tree uses 7 nodes (questions about specific variants) to map to 10 named positions. Each node is phrased as a direct question about a variant, avoiding jargon or position labels, so students can answer based on intuition. The variants (V1–V7) are integrated to force finer distinctions than the standard case alone allows.  

  After the tree, I detail adjacent leaf distinctions and unoccupied combinations, including analysis of your hunch about V2 and V7.  

  ---

  ### **Decision Tree**  
  *Each node is a yes/no question about a variant. Answer to proceed.*  

  1. **Node 1 (V1 - Standard):** In the standard case, where the driver is near-perfect at reading you, should you form the intention to pay?  
     - *Yes* → Go to Node 2  
     - *No* → Go to Node 3  

  2. **Node 2 (V6 - Toxin-style):** If a payoff (e.g., the ride) is granted solely for having the intention *tonight*—and no one checks if you follow through—should you form the intention?  
     - *Yes* → Go to Node 4  
     - *No* → Go to Node 5  

  3. **Node 3 (V3 - Bond):** If a third party holds a bond forcing you to pay later (making payment your best option then), should you set up that bond?  
     - *Yes* → Go to Node 6  
     - *No* → Go to Node 7  

  4. **Node 4 (V2 - 80% accuracy):** If the driver is only 80% accurate, does that change what’s rational to do (vs. the standard case)?  
     - *Yes* → **Leaf: Evidential Decision Theory (EDT)**  
     - *No* → **Leaf: Updateless/Functional Decision Theory (UDT/FDT)**  

  5. **Node 5 (V7 - Changing dispositions):** If you can’t choose your disposition directly but can take costly steps to change it over months, should you take those steps?  
     - *Yes* → **Leaf: Self-Effacing Consequentialism (SEC)**  
     - *No* → **Leaf: Planning Agency (PA)**  

  6. **Node 6 (V5 - Repeat trips):** If you’ll be stranded again and drivers share notes, should you pay?  
     - *Yes* → **Leaf: Constrained Maximization (CM)**  
     - *No* → **Leaf: Parfit’s Move (PM)**  

  7. **Node 7 (V4 - Small sum):** If the sum is small enough that paying looks fine once reputation/self-respect are counted, should you pay?  
     - *Yes* → **Leaf: Resolute Choice (RC)**  
     - *No* → **Leaf: Act-By-Act Causal (ABC)**  
     - *Uncertain* → **Leaf: Under-Described (UD)**  

  ---

  ### **Leaves (Positions) and Their Awkward Commitments**  
  1. **Act-By-Act Causal (ABC):** You die in the desert because paying later is irrational, and that’s the cost of rationality. (Gauthier)  
  2. **Resolute Choice (RC):** You must stick to an intention even when you know you’ll have no reason to follow through. (Bratman)  
  3. **Sophisticated Choice + Self-Binding (SC):** You can only "solve" the problem by paying for external devices (e.g., bonds), which may be costly or unavailable. (Elster)  
  4. **Planning Agency (PA):** You should avoid reconsidering intentions even when new information arises. (Bratman)  
  5. **Constrained Maximization (CM):** Cooperative dispositions only pay off if others reciprocate; in one-off cases, you lose out. (Gauthier)  
  6. **Parfit’s Move (PM):** It’s rational to cause yourself to act irrationally later. (Parfit)  
  7. **Self-Effacing Consequentialism (SEC):** The best decision procedure (e.g., cultivating a disposition) may require ignoring consequentialist reasoning when acting. (Parfit)  
  8. **Evidential Decision Theory (EDT):** Acting is rational if it provides good evidence (e.g., "I’m a cooperator"), even if causally ineffective. (Jeffrey)  
  9. **Updateless/Functional Decision Theory (UDT/FDT):** You must commit to timeless "policies" ignoring later evidence (e.g., "always pay"), which can be self-destructive if flawed. (MIRI/Yudkowsky)  
  10. **Under-Described (UD):** The case is too vague; rationality depends on unstated details (e.g., driver’s psychology). (N/A)  

  *Note: SC is embedded in Node 3 (V3) and is reached via Node 6, but since it requires a specific device, it’s not a leaf here. PM covers SC-like outcomes via self-caused irrationality.*  

  ---

  ### **Adjacent Leaf Distinctions and Separating Variants**  
  - **EDT vs. UDT/FDT (Node 4):** Separated by **V2 (80% accuracy)**. EDT says reliability changes rationality (lower accuracy weakens evidential value); UDT/FDT says it doesn’t (timeless policies are accuracy-invariant). *Not separated by V6/V7*.  
  - **SEC vs. PA (Node 5):** Separated by **V7 (Changing dispositions)**. SEC says invest in costly self-change; PA says no need (resolve suffices). *Not separated by V6*.  
  - **CM vs. PM (Node 6):** Separated by **V5 (Repeat trips)**. CM pays for reputation; PM pays even in one-off cases (irrationality is caused). *Not separated by V3/V7*.  
  - **RC vs. ABC (Node 7):** Separated by **V4 (Small sum)**. RC pays when costs are low (intention-binding); ABC never pays. *Not separated by V1/V3*.  
  - **ABC vs. UD (Node 7):** Separated by **V4 (Small sum)**. ABC rejects paying even with low costs; UD demands more case details.  
  - **PM vs. UD/ABC (Structure):** PM is separated from UD/ABC by **V3 (Bond)** and **V5 (Repeat trips)**. PM endorses bonds/reputation; UD/ABC reject them.  
  - **UDT/FDT vs. SEC/PA (Structure):** UDT/FDT is separated from SEC/PA by **V6 (Toxin-style)**. UDT/FDT rejects forming intentions for immediate gain; SEC/PA may accept if resolvable.  

  **Indistinguishable pairs:**  
  - **PA and RC** aren’t directly separated; both answer similarly on V1/V6/V7. PA emphasizes non-reconsideration; RC focuses on intention-integrity. The tree groups them separately via Nodes 5 and 7 but doesn’t force a split.  
  - **SEC and IC (Indirect Consequentialism)** are merged; SEC is a subset focusing on consequentialism’s self-effacement.  

