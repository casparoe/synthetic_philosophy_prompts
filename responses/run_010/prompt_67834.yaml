answer: |-
  ## The Toast (Approx. 4 minutes)

  (Lifting glass, warm smile)

  "Eleven years. Eleven years of tweaking forms, rearranging menus, and generally making the machinery of government… slightly less likely to make us all tear our hair out. That’s [Boss's Name]’s legacy, sitting in this room – in the heating bills claimed a little faster, the pensions quietly building, the school lunches that weren’t always the soggy fish fingers. (Pause for slight chuckle)

  But anyone who worked with [Boss's Name] knows it wasn't *just* about making things easier. It was about something harder. Taped inside her desk drawer – and I know because she made every single one of us argue past it – was a simple rule: **'If you'd be embarrassed to explain it to the person it happens to, don't ship it.'**

  Not 'Does it work?' – though she certainly cared about that. Not 'Does it save money?' – though that helped. But: **'Can you look someone in the eye, in words they'd understand, and explain *why* their choices are being presented this way? Can you own it?'**

  Think about that. Think about the sheer nerve of designing a system – *any* system, from choosing your lunch to signing up your organs – and forcing yourself to imagine standing in front of the person using it, explaining *exactly* how it steers them. No hiding behind jargon. No relying on them not noticing. Just: 'Here's how it works, here's why we set it up this way. Does that seem fair to you?'

  (Glance around the room, inclusive)
  That rule, I think, is why we’re all here tonight. Because it wasn't about tricking anyone. It was about recognizing that **every system has a starting point. Every form has a first box. Every menu has a top option. Pretending those starting points are neutral isn't clever; it's just avoiding responsibility. The real question was always: *Which* starting point serves people best? And crucially: can we *explain* why we picked that one?**

  (Now, the joke - delivered lightly)
  It’s like… retirement itself, really. (Turn slightly to include grandson). [Boss's Name], tomorrow morning, your alarm clock hits snooze… and suddenly discovers the default setting has been changed to ‘Off’. Permanently. Hope you explained *that* setting change to yourself clearly! (Smile, expectant pause for laughter – works for both techies and teen).

  (Shift tone, slightly more serious, acknowledge without naming)
  Now, I know some in this room might hear that rule and think: 'But did she *always* live up to it? Isn't it easy to make things smooth and cheap *for the designer*, while the person filling out the form just feels… quietly nudged?' And you know what? That’s a fair challenge. That rule forces us to confront the gap between the designer’s ease and the user’s experience. It forces us to ask: are we making this clear *enough*? Are we giving people a real sense of agency, or just a smoother path *we* picked? [Boss's Name] knew that gap existed. That rule was her bridge across it. It wasn't always perfect, but it was the compass.

  Because ultimately, [Boss's Name], that rule wasn't just about government forms or pension schemes. It was about respect. Respect for the intelligence of the people you were trying to help. Respect that meant you couldn't hide the design choices. You had to make them *sayable*.

  (Shift to warmth, personal, look at Boss and family)
  And that’s the [Boss's Name] I’ll remember. The one who’d stare down a complex regulation and ask, ‘But how do we *explain* this bit to Mrs. Higgins in her kitchen?’ The one who’d argue fiercely about a default setting, not just for efficiency, but because she genuinely cared whether someone would feel railroaded or respected. The one whose idea of a good Friday afternoon was making a nine-page form vanish into two… and then explaining *why* to anyone who asked.

  So, [Boss's Name], as you step away from designing our choices, we raise a glass. Not just to the smoother systems, the simpler forms, the better defaults – though there are many. But to the **courage of explanation**. To the belief that good design isn’t sneaky; it’s transparent enough to hold up to the people it serves. To the woman who taped a reminder in her drawer demanding integrity, and then spent eleven years trying to live up to it. We’ll miss your clarity, your fierce pragmatism, and yes, even your slightly terrifying ability to ask, ‘So, explain it to me like I’m the person stuck with this design…’

  To [Boss's Name]! May your retirement options be plentiful, clearly explained, and set exactly how *you* want them!"

  (Everyone: "To [Boss's Name]!")

  ---

  ## Where the Truth Got Bent & The Flagged Line

  1.  **Bending Truth #1 (The Rule's Consistency):** The toast implies the rule *was* the consistent, governing principle for all her work ("forced us to confront," "was her bridge," "trying to live up to it"). In reality, you and the lawyer suspect she didn't always honor it fully. The toast presents the rule as the *aspiration* and *measuring stick*, softening the reality of its occasional lapse.
  2.  **Bending Truth #2 (The Critics' View):** Saying critics might think "‘But did she *always* live up to it?’" frames their objection primarily as a question about *her adherence to her own rule*. The lawyer, especially, likely objects to the *inherent ethics* of opt-out systems regardless of explanation. The toast subtly reframes his critique to fit the narrative of her rule.
  3.  **Bending Truth #3 (The Impact):** While listing concrete examples (heating bills, pensions, lunches), the toast elevates "eleven years of form design" into "the courage of explanation" and a legacy of "respect". This is a sentimental inflation, making the practical work sound like a profound philosophical stance, even while trying to avoid that.
  4.  **The Flagged Line (By Her Rule):** **"It wasn't about tricking anyone."**
      *   **Why it flags:** Explaining this line *to the civil liberties lawyer* (the person deeply affected by her work whom it arguably 'happened to'), or even to the skeptical grandson, might be embarrassing. The lawyer spent years arguing her *methods were inherently deceptive*, even if unintentionally. Saying "it wasn't about tricking anyone" directly contradicts the core of *his* lived experience fighting her work. It dismisses his fundamental objection as a misunderstanding of intent ("tricking"), rather than engaging with his critique about inherent effects and power imbalances ("cheap for the designer, invisible to the user"). It fails her "sayable to the person it happens to" test because it simplifies and dismisses a valid, deeply held opposing viewpoint held by someone directly impacted.
