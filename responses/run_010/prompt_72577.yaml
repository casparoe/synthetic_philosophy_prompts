prompt: |-
  I am an American who moved to Aarhus eleven months ago, and last week I was asked to sit on the recognition committee of the small independent school where my stepdaughter is enrolled — partly, I suspect, because the newsletter is bilingual and they were short a native English speaker. My Danish husband's reading of the committee is that its practice is simply Janteloven in a school uniform; mine is that it is something else; neither of us can say what. The committee meets Thursday on a case we cannot settle at home, and I would rather argue from its own record than from either of our folk theories.

  The precedents, all from the last six years of minutes, which the outgoing chair handed me:

  1. The school's robotics team placed second nationally. All nine students went on the front page and were given the assembly slot.
  2. Alumni asked the school to reinstate its old tradition of naming a single top graduate each spring. The committee refused, with the recorded reason that it made an example of one child for the benefit of the others.
  3. A student who had arrived in Denmark two years earlier speaking no Danish was admitted to a selective upper-secondary programme. Full feature, photograph, interview.
  4. A student won a national young soloists prize on violin. She received one line in a list of news items; the minutes note that she had been taught since the age of five by her father, a professional musician.
  5. The annual citizenship prize — an individual prize, named and announced from the stage — went to a student who organized a petition that got the municipality to reroute a bus line.
  6. A family offered a donation large enough to name the new science wing and asked that the gift be announced alongside the naming. The committee took the money and declined the announcement, on the ground that it would put other families in their place.
  7. The school publishes its aggregate results in the national tests but not the per-class breakdown, and has never named a student in connection with a score.

  Thursday's case. A fifteen-year-old has won a national individual mathematics competition — rank-order, announced with names. She is the daughter of two university academics, has had private tutoring since she was nine, and her teachers describe her as doing less homework than almost anyone in her year while finding the material easy. So far that reads like precedent 4. But the prize carries a summer scholarship she will be away for; several younger students from the least academic part of our catchment started a mathematics club in her wake last term; and it was those students who wrote to the committee asking that she be featured, saying she had made mathematics look like something available to them. Her parents, meanwhile, have written that they would prefer the school not make a fuss.

  What I need:

  - Which rules are jointly consistent with precedents 1 through 7? I can see at least three candidates — something about never ranking individuals in public, something about whether the visible cause of a success is the child's own work or her circumstances, something about whether a display lowers anyone watching it — but I cannot tell whether these are genuinely distinct rules or one rule in different clothes, and I expect there are others I have missed. State each candidate as a rule that could actually be applied, and say which precedents it explains and which it leaves unexplained.
  - For each candidate rule, what does it imply for Thursday's case, and which precedent is its closest analog?
  - On that basis, what should the committee decide if it wants to be consistent with itself, and how much confidence can that recommendation carry? If the record genuinely underdetermines this case, say so plainly; then say what principle the committee would be committing itself to by featuring her, and what different principle it would be committing itself to by giving her a line in a list.
  - One question that is mine rather than the committee's: I want to propose a case — ideally something we could decide cheaply next year — that would settle which rule this body is actually running. What should that case look like, and what verdicts under which candidate rules would it force apart?
  - Finally, how should I treat the parents' preference for no fuss? Does it enter the analysis above as a reason, or is it only about how a decision gets implemented?

  Please keep the analysis anchored in these precedents rather than in general claims about Danish or Australian or American attitudes. The whole point is that the crude labels my husband and I have been trading do not tell us what this committee does. No references needed.
reasoning: |-
  Hmm, the user is an American parent in Denmark serving on a school recognition committee, trying to understand its unspoken rules through seven precedents. They need help analyzing patterns before Thursday's meeting about a math competition winner.

  First, let's unpack the precedents. When the robotics team placed second nationally (Precedent 1), they got full recognition - front page and assembly slot. But when a student won a national violin prize (Precedent 4), she only got one line in a news list. The key difference seems to be collective vs individual achievement. The robotics team involved nine students working together, while the violin win was individual - and they even noted her professional musician father, suggesting external advantages mattered.

  The citizenship prize winner (Precedent 5) got individual recognition but it was for community impact - organizing a petition that changed a bus route. This wasn't about innate talent but about civic action benefiting others. Meanwhile, they refused to name a top graduate (Precedent 2) because it would "make an example of one child for others' benefit" - explicitly rejecting comparative ranking.

  The donation case (Precedent 6) shows sensitivity to inequality: they took the money but refused the announcement to avoid "putting other families in their place." Similarly, they publish aggregate test scores but not per-class breakdowns (Precedent 7), avoiding invidious comparisons. For the student admitted to a selective program after learning Danish in two years (Precedent 3), they gave full publicity - highlighting effort overcoming circumstance.

  Now for Thursday's case: a math competition winner from an academic family with private tutoring since age nine. Superficially like the violinist (Precedent 4) who got minimal recognition. But complicating factors: younger, less academic students started a math club inspired by her, and they're the ones requesting recognition. Parents want no fuss.

  Three candidate rules emerge:

  1) The "Collective/Individual Rule": Full recognition only for collective achievements or individual achievements tied to community benefit (explains 1, 3, 5 vs 2,4,6). The math win is individual so would get minimal recognition like the violinist.

  2) The "Effort/Circumstance Rule": Spotlight effort overcoming adversity (Precedent 3) but downplay advantages (Precedent 4). Since this student had tutoring and innate ability, minimal recognition.

  3) The "Inspiration/Envy Rule": Recognize if it inspires without causing envy (Precedents 1,3,5 vs 2,4,6). Here, the math club shows inspiration, but her advantages risk envy - so borderline case.

  The precedents don't perfectly resolve this. If they feature her, they'd be committing to valuing inspiration over advantage concerns. If they give one line, they prioritize avoiding privilege-displays.

  For a clarifying future case: imagine a student from disadvantaged background wins an art prize through pure effort. All rules would support recognition, so not ideal. Better: a privileged student whose individual achievement demonstrably inspires peers - like this math case but without the parental objection. That would force the committee to choose between rules.

  Parental preference shouldn't change the recognition decision, only implementation - perhaps a quieter feature without photos if they insist.
answer: |-
  Based solely on the committee's precedents (1-7), I identify **three distinct candidate rules** that explain the decisions. Each is defined by its operational logic, not abstract values. Below is the analysis, implications for Thursday's case, and recommendations—all anchored in the record.

  ---

  ### **Candidate Rules Jointly Consistent with Precedents 1-7**
  *(Each rule explains 6/7 precedents; none perfectly explains all, but all are plausible)*

  1. **The Collective/Individual Rule**:  
     *Recognize achievements fully only if they are collective or demonstrate overcoming adversity; minimize individual recognition where success stems from privilege or creates hierarchies.*  
     - **Explains**:  
       - Precedent 1 (robotics team: collective → full recognition).  
       - Precedent 3 (student learned Danish quickly: overcoming adversity → full feature).  
       - Precedent 4 (violin prize: individual + privilege → minimal recognition).  
       - Precedent 5 (citizenship prize: community impact → recognized, as it benefits others).  
       - Precedent 6 (donation announcement declined: avoids hierarchy among families).  
       - Precedent 7 (no per-class scores: avoids ranking individuals).  
     - **Unexplained**:  
       - Precedent 2 (no top graduate: fits "avoid hierarchy," but the reason given ("example for others") isn’t directly covered).  

  2. **The Effort/Circumstance Rule**:  
     *Highlight achievements where success is attributable to the child’s own effort in challenging circumstances; downplay achievements where success is heavily influenced by external advantages.*  
     - **Explains**:  
       - Precedent 3 (learned Danish rapidly: effort in adversity → featured).  
       - Precedent 4 (violin win: privilege noted (father’s training) → downplayed).  
       - Precedent 5 (citizenship prize: effort to organize petition → recognized).  
       - Precedent 6 (donation not announced: wealth advantage hidden).  
       - Precedent 7 (no individual scores: avoids crediting circumstantial advantages like tutoring).  
       - Precedent 2 (no top graduate: avoids crediting inherent advantages).  
     - **Unexplained**:  
       - Precedent 1 (robotics team: no mention of circumstances → full recognition).  

  3. **The Inspiration/Envy Rule**:  
     *Publicly celebrate achievements only if they inspire peers without causing envy or diminishing others; suppress recognition if it highlights inequality or could demotivate.*  
     - **Explains**:  
       - Precedent 1 (robotics: inspires school pride → recognized).  
       - Precedent 2 (top graduate: risks envy/demotivation → refused).  
       - Precedent 3 (language success: inspiring for immigrants → featured).  
       - Precedent 4 (violin win: privilege risks envy → minimal).  
       - Precedent 6 (donation announcement: risks "putting families in their place" → declined).  
       - Precedent 7 (no individual scores: avoids demotivating lower performers).  
     - **Unexplained**:  
       - Precedent 5 (citizenship prize: individual award given despite potential envy).  

  **Key Insight**: These rules are distinct but overlapping. Precedent 5 (citizenship prize) is consistent with all three, while Precedents 1 (robotics) and 2 (top graduate) help differentiate them. No single rule cleanly explains all seven, but the committee’s pattern suggests a priority on **mitigating social comparison**.  

  ---

  ### **Implications for Thursday's Case**
  - **The Case**: Math competition win (individual, privilege-heavy) that inspired peers. Parents oppose fuss; students request recognition.  
  - **Analysis by Rule**:  

    | Rule                  | Implication for Thursday                 | Closest Analog Precedent |  
    |-----------------------|------------------------------------------|--------------------------|  
    | **Collective/Individual** | Minimal recognition (like Precedent 4). Privilege + individual achievement fits violin case. Peer inspiration is irrelevant. | Precedent 4 (violin) |  
    | **Effort/Circumstance**   | Minimal recognition (like Precedent 4). Tutoring/academic background implies advantage; effort not highlighted. Inspiration irrelevant. | Precedent 4 (violin) |  
    | **Inspiration/Envy**      | **Feature her** (like Precedent 3). Peer inspiration overrides privilege concerns. Suppressing recognition ignores demonstrated positive impact. | Precedent 3 (language learner) |  

  ---

  ### **Committee Recommendation & Confidence**
  - **Consistent Decision**:  
    - **Minimal recognition (one line in news list)** aligns with **Collective/Individual** and **Effort/Circumstance** rules (stronger fit with 6/7 precedents).  
    - **Featuring her** aligns only with **Inspiration/Envy** (weaker, as it conflicts with Precedent 4).  
  - **Confidence**: **Moderate**. Precedents underdetermine due to:  
    - Tension between Precedent 4 (downplay privilege) and Precedent 3 (highlight inspiration).  
    - No precedent where peer advocacy overrides privilege concerns.  
  - **Principles Committed**:  
    - **If featured**: The committee prioritizes **demonstrable peer inspiration** over individual privilege.  
    - **If one line**: The committee prioritizes **avoiding displays of inherent advantage**, even when others advocate recognition.  

  ---

  ### **Proposal for a Future Clarifying Case**
  To force a choice between rules, propose a case with:  
  - **Setup**: A privileged student (e.g., wealthy, tutoring) wins an individual prize *without* peer inspiration (e.g., a solo art award). Peers are indifferent or resentful.  
  - **Verdicts Under Candidate Rules**:  
    - **Collective/Individual** or **Effort/Circumstance**: Minimal recognition (like Precedent 4).  
    - **Inspiration/Envy**: Minimal recognition (no inspiration + envy risk).  
  - **Why It Clarifies**: All rules align here. Now add a twist: the same student’s win *later* inspires a peer initiative. If the committee retroactively features it, they follow **Inspiration/Envy**. If not, they follow **Effort/Circumstance** or **Collective/Individual**.  

  ---

  ### **Treatment of Parents' Preference**
  - **Role in Analysis**: **Irrelevant to the recognition decision**. Precedents never cite parental preferences as a factor (see Precedent 4: violinist’s views unmentioned; Precedent 6: donor’s request rejected).  
  - **Implementation Only**: If recognition is granted, accommodate preferences tactfully (e.g., no photograph, subdued wording). If no recognition, no action needed.  
  - **Why**: The committee’s rules focus on institutional values (social equality, peer impact), not stakeholder requests.  

  ---  
  **Conclusion**: The record most supports **minimal recognition** (one line) for the math winner, as her advantages align with Precedent 4. However, peer inspiration introduces ambiguity—making this a borderline case that could shift the committee’s future approach. Anchor arguments in Precedent 4 (privileged individual achievement) vs. Precedent 3 (inspiration from overcoming adversity), and note that parental input affects only *how*, not *whether*, to recognize.
