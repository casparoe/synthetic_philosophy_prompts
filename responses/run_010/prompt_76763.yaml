prompt: |-
  I run the awards program for a UK-registered charity (I'm American, which is why I'm writing this in one spelling and asking for the other — please answer in British English, everything we publish uses it).

  Setup: about 300 nominations a year for 15 awards. The shortlisting panel is six volunteers with no philosophy training and four hours total, so roughly ten minutes per nomination they actually look at. The board ratifies whatever we send up and doesn't second-guess the form. The form is the whole process.

  Right now it scores outputs — hours, money raised, people reached — and we hand awards to the top scorers. Twice recently we've honored someone and felt awful about it: enormous good done, but transparently as a networking exercise or a guilt tax. And we've passed over people whose work was smaller and whose reasons looked completely clean, and a panelist said afterwards that we'd had it backwards, that an award for this is supposed to be about why someone acted and not how much good fell out of it.

  So I want to rebuild the form around the question of whether the nominee acted for the right reasons. I know this drags in a theory of moral worth — acting from duty versus merely acting in line with it, whether someone has to be moved by the thought that the act is right or only by whatever makes it right, whether sympathy, or a person's own recovery, counts as the right kind of motive at all. Fine. But my panel can't read theory and I can't make them. I need whatever that debate actually implies, translated into a scoring procedure six volunteers can run on a two-page nominaton in ten minutes, that produces something tallyable, because we do tally.

  What I need:
  - the questions in the order they should be asked, what counts as a sufficient answer to each, and what to enter when the nomination is silent — which is most of the time;
  - which distinctions from the literature you're keeping and which you're dropping as unusable at ten minutes a head, and why;
  - how the form handles the nominee who does a lot of good for bad reasons and the one who does modest good for good reasons, since they're competing for the same fifteen slots;
  - the point where the form stops and a person has to decide, marked explicitly.

  Two things I want you to be blunt about rather than paper over. First, motives aren't observable, and everything the panel sees is second-hand prose written by someone who likes the nominee. The procedure can't be a motive detector, so tell me what it can legitimately be instead and where it'll generate confident nonsense. Second, weve got a self-undermining problem: our guidance for nominators is public, so people increasingly write to the criteria, and some of the most motive-flattering nominations we recieve are obviously reverse-engineered from last year's winners. Build that in rather than treating it as an edge case — I want a form that behaves sensibly when the evidence about motives was produced by the form itself.

  Then run it on three nominations I'll sketch: (1) a lawyer who's done a very large amount of pro bono work and whose nomination says frankly that it started as a way to build a client base and continued because he turned out to be good at it; (2) a woman who runs a small bereavement group after losing her own son, whose nomination is entirely about her warmth and says nothing about principles or duty; (3) a teenager who organized a big food drive because his youth leader told him it was the right thing to do and he wanted her approval. Give me the scores. I expect the procedure will produce a verdict I hate — probably ranking (1) under (3), or clearing (3) outright — and if it does, tell me whether the form is wrong or my instincts are.

  And if the honest conclusion is that the form should stop pretending to read motives and measure something else entirely, say so and say what.
reasoning: |-
  Hmm, the user runs an awards program for a UK charity and needs to redesign their scoring form to focus on nominees' motives rather than just outcomes. They've encountered situations where people who did impressive work for questionable reasons got awards over those with genuine intentions but smaller impact. 

  The core challenge is translating complex moral philosophy into a practical tool for untrained volunteers who only have 10 minutes per nomination. They need concrete questions, scoring thresholds, and handling of incomplete information - all while acknowledging that motives are inherently unobservable and nominations are often strategically written. 

  Key constraints stand out: the panel lacks philosophy training, time is extremely limited (4 hours total for 300 nominations), and past winners' examples have created feedback loops where nominators game the system. The user explicitly wants blunt honesty about these limitations rather than idealized solutions.

  For the moral framework, Kant's distinction between acting FROM duty versus merely IN ACCORDANCE WITH duty seems most relevant here. But pure Kantianism would exclude emotional motivations like the bereaved mother's grief - which intuitively feels wrong. The scoring system must therefore value both principle-based and emotionally-driven motives, while filtering out purely self-serving ones. 

  The proposed solution centers on "reasons for continuing" because initial motivations often evolve (as with the lawyer building his client base). This avoids penalizing people whose motives improved over time. The "source of motivation" question handles cases like the teenager seeking approval - giving partial credit since external validation isn't inherently bad, but full credit requires some internalization of values.

  For implementation: 
  - Quantifiable anchors are crucial (e.g., "mentions duty/principles at least once" rather than subjective judgments)
  - Explicit null handling prevents paralysis when nominations are silent
  - The "human override" step after scoring acknowledges that algorithms can't capture everything

  The test cases reveal uncomfortable truths: 
  1) The lawyer scores low despite massive impact because his motivation remains instrumental
  2) The bereaved mother gets full credit - her emotional drive is reframed as "virtuous motive" 
  3) The teenager lands in the middle since his motivation is external but not corrupt

  If the user hates these results, that likely reflects tension between their instinct to reward impact versus the form's focus on motives. The solution isn't abandoning motive assessment but accepting that smaller-scale, heartfelt contributions may outrank strategically massive ones - which is exactly why they redesigned the system.

  Final note: The "self-gaming" issue is addressed by scoring evidence of motive independently of outcomes, and by keeping specific thresholds unpublished. Nominators can't optimize for what they don't know.
answer: |-
  Here’s a practical, British English framework for your awards form, designed for untrained volunteers assessing moral motivation in 10-minute windows. It acknowledges the constraints while prioritising **actionable evidence of motive** over philosophical purity.  

  ---

  ### **Revised Awards Scoring Framework**  
  **Core Principle:** Score *observable indicators* of whether the nominee *sustained their work for morally relevant reasons*, not abstract "purity of heart".  

  #### **Questions & Scoring (Max 10 Points)**  
  1. **What sparked the action?**  
     - *Ask:* "Did the nomination describe an initial *personal trigger* (e.g., loss, faith, injustice) or *external prompt* (e.g., assignment, networking)?"  
     - *Sufficient answer:* Explicit trigger stated (e.g., "after her son died", "assigned by his firm").  
     - *If silent:* **0 points** (assume no meaningful trigger stated).  
     - *Score:* 1 pt if trigger is morally relevant (e.g., empathy, principle); 0 pts if self-serving (e.g., "to build contacts").  

  2. **Why did they *continue*?**  
     - *Ask:* "Is there evidence they persisted for reasons beyond the initial trigger?"  
     - *Sufficient answer:* Mentions duty, empathy, community need, or personal values.  
     - *If silent:* **0 points**.  
     - *Score:*  
       - **2 pts** = Clear internal motive (e.g., "felt it was her duty", "couldn’t ignore the suffering").  
       - **1 pt** = Mixed motive (e.g., "enjoyed the work but also wanted to help").  
       - **0 pts** = Purely external (e.g., "good for business", "required by school").  

  3. **Source of motivation**  
     - *Ask:* "Does evidence suggest motivation came *from within* (values/empathy) or *from outside* (rewards/approval)?"  
     - *Sufficient answer:* Descriptions of behaviour (e.g., "she volunteers extra hours despite no pay").  
     - *If silent:* **0 points**.  
       - *Score:*  
       - **2 pts** = Internal (e.g., principles, compassion).  
       - **1 pt** = External (e.g., praise, career).  
       - **0 pts** = Only self-interest (e.g., tax breaks).  

  4. **Sacrifice/risk**  
     - *Ask:* "Did they incur *personal cost* (time, money, reputation)?"  
     - *Sufficient answer:* Specific sacrifices named (e.g., "used life savings", "faced criticism").  
     - *If silent:* **0 points**.  
     - *Score:*  
       - **2 pts** = Significant sacrifice (e.g., financial loss, health risk).  
       - **1 pt** = Moderate cost (e.g., time, minor expenses).  
       - **0 pts** = No cost or net benefit.  

  5. **Impact on others’ dignity**  
     - *Ask:* "Did the nominee *respect agency* of those helped? (Avoids paternalism)"  
     - *Sufficient answer:* Descriptions of collaboration/listening (e.g., "co-designed with refugees").  
     - *If silent:* **1 pt** (neutral assumption).  
     - *Score:*  
       - **2 pts** = Empowers others (e.g., skills training, advocacy).  
       - **1 pt** = Neutral/not mentioned.  
       - **0 pts** = Undermines dignity (e.g., exploitative, condescending).  

  #### **Tally & Thresholds**  
  - **8–10 points**: "Strong evidence of virtuous motive"  
  - **5–7 points**: "Mixed motives, but morally relevant reasons present"  
  - **0–4 points**: "Limited evidence of morally relevant motivation"  

  **Human override point:** After tally, panelists flag nominations scoring 5–7 for a 2-minute discussion if impact is exceptional (e.g., saved lives). *No override for scores 0–4.*  

  ---

  ### **Philosophical Compromises**  
  - **Keeping**:  
    - Kant’s "duty vs. inclination" (via Q2 continuation motives).  
    - Virtue ethics’ "character" (via Q3 internal motivation).  
    - Dignity/autonomy (Q5).  
  - **Dropping**:  
    - "Moral worth purity" (unknowable).  
    - Distinguishing sympathy from duty (both score if sustained).  
    - "Acting for the right vs. the good" (outcomes still matter, but filtered by motive evidence).  

  ---

  ### **Handling Edge Cases**  
  - **High impact, bad reasons**: Scores low on motive (Q1–Q3), unlikely to win unless impact forces override (rare).  
  - **Modest impact, good reasons**: Scores high on motive, prioritised unless impact is negligible.  
  - **Self-gaming nominations**: Q2 and Q3 penalise answers that parrot "duty" without evidence (e.g., no sacrifice). Q5 exposes performative help.  

  ---

  ### **Test Cases**  
  1. **Lawyer (pro bono for client base)**  
     - Q1: Self-serving trigger (0 pts)  
     - Q2: Continued due to skill/enjoyment (1 pt)  
     - Q3: External motivation (career) (0 pts)  
     - Q4: Moderate cost (time) (1 pt)  
     - Q5: Neutral (1 pt)  
     - **Total: 3/10** → *Rejected*  

  2. **Bereavement group leader**  
     - Q1: Personal trigger (son’s death) (1 pt)  
     - Q2: Sustained by empathy (2 pts)  
     - Q3: Internal (compassion) (2 pts)  
     - Q4: Significant time cost (2 pts)  
     - Q5: Empowers (support group) (2 pts)  
     - **Total: 9/10** → *Honoured*  

  3. **Teenager (food drive for approval)**  
     - Q1: External trigger (youth leader) (0 pts)  
     - Q2: Motive remains external (approval) (0 pts)  
     - Q3: External (validation) (0 pts)  
     - Q4: Moderate cost (time) (1 pt)  
     - Q5: Neutral (food handouts) (1 pt)  
     - **Total: 2/10** → *Rejected*  

  **If you hate this outcome:** The form is working. The lawyer’s *motives* are instrumental; the teen’s are approval-seeking. The bereaved mother demonstrates virtuous motivation. **Your instinct to reward scale conflicts with assessing *why* people act. This form resolves that by demoting transactional do-gooding.**  

  ---

  ### **Blunt Truths**  
  1. **This isn’t a "motive detector"** – it assesses *narrative evidence of intention*. It will misfire on poorly written nominations or cunning liars.  
  2. **Self-gaming is mitigated, not solved**: By scoring *specific behaviours* (sacrifice, continuity) over stated motives, reverse-engineering is harder. Keep thresholds secret.  
  3. **Confident nonsense**: Volunteers may confuse "sacrifice" with privilege (e.g., "gave up holidays" vs. "skipped meals"). Training examples must clarify this.  

  **Final Verdict**: This form *can* work if you accept:  
  - Awards will favour "humble heroes" over strategic altruists.  
  - Impact still matters, but only if tied to credible motive evidence.  
  - **Publish the criteria** – transparency reduces gaming more than secrecy.  

  If this feels too subjective, revert to measuring **sacrificial cost-adjusted impact** (e.g., hours ÷ income percentile). But if moral motivation matters, this framework is your least-worst option.
