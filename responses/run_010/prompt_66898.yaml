  ### Decision Tree for Genomic Semantics  
  *Starting Trunk (Accepted Molecular Facts):*  
  - Translation occurs via a near-universal codon-to-amino acid mapping (with rare variants).  
  - Identical DNA sequences produce different effects in different cell types/environments.  
  - Sequence changes reliably alter downstream products, but other factors (e.g., cellular context) also alter products.  
  - Large portions of most genomes are never transcribed or translated.  

  **Node 1: Frameshift Mutation**  
  A single-base insertion in a protein-coding gene produces a non-functional protein. Does this primarily occur because the genetic code relies on a fixed, linear template?  
  - **Yes** → Physical template integrity is essential.  
  - **No** → The disruption is due to misalignment with decoding rules.  

  **Node 2: Engineered Stop Codon Reassignment**  
  A synthetic organism uses a reassigned stop codon to encode a non-natural amino acid, maintained faithfully across generations. Does this demonstrate that codon assignments are arbitrary?  
  - **Yes** → Assignments are conventional and interchangeable.  
  - **No** → Assignments depend on physical/chemical constraints.  

  **Node 3: Context-Dependent Splicing**  
  A sequence produces Protein X in the liver and Protein Y in the eye via alternative splicing. Is this variation best explained by how cellular machinery interprets the sequence?  
  - **Yes** → The receiver’s machinery determines the product.  
  - **No** → Sequence features physically mandate the outcome.  

  **Node 4: Ancestral Sequence Reconstruction**  
  A DNA sequence inferred from evolutionary history (but never existing naturally) functions when synthesized and inserted into a modern cell. Does this imply the genetic code operates independently of historical lineage?  
  - **Yes** → Coding rules transcend evolutionary history.  
  - **No** → Function depends on co-evolved cellular context.  

  **Node 5: RNA Virus Genome**  
  An RNA viral genome is translated by host ribosomes it did not evolve with. Is the coding relation here established by the host?  
  - **Yes** → The host’s machinery defines the coding relation.  
  - **No** → The virus’s sequence properties dictate decoding.  

  **Node 6: Synonymous Substitution Effect**  
  A synonymous codon change (same amino acid) alters gene expression but not the protein sequence. Does this show DNA’s causal role extends beyond specifying amino acids?  
  - **Yes** → DNA affects products via multiple mechanisms.  
  - **No** → This is a minor exception to sequence-determined output.  

  **Node 7: Pseudogene**  
  A pseudogene shares sequence homology with a functional gene but is never transcribed. Does this imply it lacks coding potential?  
  - **Yes** → Non-transcribed sequences cannot function as code.  
  - **No** → Latent coding potential exists regardless of current use.  

  **Node 8: Nonsense Mutation**  
  A point mutation converts an amino acid codon to a premature stop codon, yielding a truncated, non-functional protein. Is this a case of "misrepresentation"?  
  - **Yes** → The DNA inaccurately specifies a functional product.  
  - **No** → It’s a causal breakdown, not semantic error.  

  ---

  ### Logical Space of Positions  
  *Five Dimensions:*  
  1. **Resemblance (R):** Sequence-product correspondence via physical complementarity (template/mould).  
  2. **Convention (C):** Sequence-product mapping is arbitrary and historically contingent.  
  3. **Use (U):** Sequence content is fixed by receiver’s interpretation and selective history.  
  4. **Misrepresentation Possible (M):** Mutations can "misrepresent" functional norms.  
  5. **Causal-Parity Objection (P):** DNA is one causal factor among equals (no informational asymmetry).  

  *Each dimension is binary (0 = No, 1 = Yes). Positions mapped to (R, C, U, M, P):*  

  | Leaf Position                         | (R,C,U,M,P) | Notes                           |  
  |---------------------------------------|-------------|---------------------------------|  
  | **Strict Code Realism**               | (0,1,0,1,0) | Arbitrary code with normative semantics. |  
  | **Code-Without-Content**              | (0,1,1,0,0) | Conventional mapping, no representation. |  
  | **Causal-Specificity**                | (0,*,*,0,0) | Fine-grained control ≠ semantics. (`*` = any value) |  
  | **Sender-Receiver/Teleosemantic**     | (0,*,1,1,0) | Content fixed by selection on receivers. |  
  | **Truth-Requiring (Dretskean)**       | (0,0,1,1,0) | Representational fidelity required. |  
  | **Developmental-Systems Deflationism**| (*,*,*,0,1) | DNA is one input among equals. |  
  | **Code-Biology**                      | (0,1,*,*,0) | Genetic code is the first of many. |  
  | **Pure Shannon**                      | (*,*,*,0,*) | Quantifiable bits, no meaning. |  
  | **Template View**                     | (1,0,0,*,*) | DNA as physical mould (redundant for translation). |  
  | **Unnamed**                           | Other combos | See unoccupied diagnoses below. |  

  ---

  ### Unoccupied Combinations & Diagnoses  
  1. **(1,1,*,*,*)**  
     - *Diagnosis:* Incoherent. Resemblance (physical complementarity) contradicts Convention (arbitrariness) in translation.  
  2. **(1,*,1,*,*)**  
     - *Diagnosis:* Collapses into Template View. Resemblance excludes receiver-dependent "use" in standard interpretations.  
  3. **(*,0,0,1,0)**  
     - *Diagnosis:* Unattractive. Rejects Convention/Use but requires misrepresentation without a basis for norms.  
  4. **(0,0,0,1,0)**  
     - *Diagnosis:* Coherent but unwritten. No known defense of non-conventional, non-use-based misrepresentation.  

  ---

  ### Inseparable Leaf Pairs  
  1. **Causal-Specificity (0,*,*,0,0) vs. Pure Shannon (*,*,*,0,*)**  
     - *Separating Case:* A mutation that alters expression without changing sequence specificity (e.g., epigenetic mark). Pure Shannon quantifies bits; Causal-Specificity requires fine-grained dependence.  
  2. **Code-Biology (0,1,*,*,0) vs. Strict Code Realism (0,1,0,1,0)**  
     - *Separating Case:* Alternative splicing codes. Strict realism restricts "code" to codon mapping; Code-Biology extends it.  

  ---

