prompt: |-
  I write novels, and for four years I have also served as the fiction editor of a small quarterly: twelve stories a year, a flat honorarium, roughly forty submissions a week. I read the shortlist myself alongside one volunteer first reader who has no technical background and can give the work perhaps five hours a week. Only I can accept or reject; she may annotate and flag, nothing more.

  Two seasons ago we adopted a disclosure policy. Contributors are asked to state whether and how a language model was used in composing a piece, and we undertook not to reject work merely because one was. The policy has proved unworkable, and the reason is that our own wording does no work when someone presses it. We wrote of "substantive use" and of "the author's own creative work," and we can now say neither what makes use substantive nor what a person does that counts as their own. Worse, our masthead carries a line I wrote in a hurry and have come to regret: that we publish writing which could not have been written by anyone other than the person who wrote it. I would like that clause either turned into something a tired reader can apply or shown to be inapplicable, with a replacement stated.

  What I need is a procedure, not a commentary. Please write a sequence of questions in a fixed order that my reader and I can run on a single submission in about fifteen minutes, specifying for each question what counts as a sufficient answer, where the sequence terminates in a reject, where it terminates in an accept, and where it stops and hands the matter to me because the remaining question is one of value or of what this magazine exists to publish rather than one of fact. Ground it in whatever aesthetics and the philosophy of art actually offer that is usable — the old argument over photography, about whether a picture produced by a mechanism that merely registers light can still be an achievement of the person who made it; whether what a work is can come apart from how it came to be, and whether we ever legitimately value the second thing; what is being claimed when a piece of writing is called original. Tell me which of those distinctions you are keeping, which you are discarding as unusable by a non-specialist under time pressure, and why.

  Two constraints are hard. First, the procedure must not begin from anything resembling detection: we have no reliable means of identifying model-written prose, and I will not run a process whose opening step generates accusations more or less at random about named people. State what to do when a relevant fact simply cannot be established, and whether silence from a contributor is itself evidence of anything. Second, be candid about failure modes — which submissions the procedure will wrongly clear, which it will wrongly condemn, what each error costs the writer whose name is attached to our decision, and which error we should be more willing to absorb.

  Then run the procedure on three cases:

  (a) A story of unusual polish on which the contributor has disclosed nothing either way, and which we cannot distinguish, by reading, from model prose.

  (b) A story by a contributor whose first language is not English, who discloses having run every paragraph through a model to smooth the prose while inventing the situation, the characters, the structure and the ending.

  (c) A story we have reason to believe was generated almost entirely by a model, and which is the best thing in this month's pile by a considerable margin.

  At least one of the three must come out against my preference — I would rather print (b) and refuse (c), and I expect the procedure will not simply ratify that. Where it does not, say so and explain what in the procedure overrides me, rather than adjusting the outcome to suit the editor. Finally, close with a short statement of what the procedure cannot do: the questions it looks as though it answers but does not, and the point at which I should stop applying it and simply make an editorial decision.

  I am not asking for citations, a bibliography, or a survey of positions; invoke particular thinkers only where doing so changes what my reader is to do on a Tuesday afternoon.
reasoning: |-
  Hmm, the user is a fiction editor facing a real dilemma with their disclosure policy on AI use. They need a practical decision procedure, not theoretical discourse. Their masthead's problematic "could not have been written by anyone else" clause needs either operationalization or replacement. The constraints are tough: no detection tools, must protect writers from false accusations, and must acknowledge inevitable errors.

  The user's core pain points stand out: undefined terms like "substantive use" causing chaos, the unworkable masthead line, and the ethical weight of misjudging submissions. They're clearly frustrated by policies that collapse under real-world pressure. The three test cases are brilliantly chosen to stress-test any system - especially (c) where artistic merit conflicts with anti-AI principles.

  For the procedure, I'm considering a workflow that prioritizes disclosure responses first, since that's the only verifiable input. The philosophy angle needs careful distillation: Benjamin's aura concept helps frame "singularity" as human-driven creative choices, while Danto's "aboutness" handles the intent question. Must reject Barthes' "death of the author" as impractical for gatekeeping.

  Key design challenges:
  - How to handle non-disclosure without assuming guilt? Silence gets its own neutral path.
  - The smoothing-vs-generation distinction in case (b) needs clear thresholds - maybe word origin percentages?
  - For case (c), the procedure must allow rejecting brilliant AI work without accusing plagiarism. The "singularity failure" exit seems fairest.

  The hard truths:
  - Case (a) will likely clear despite suspicions - better to risk false acceptance than false accusation.
  - Case (b) might surprise the editor by failing the "singularity" test if smoothing alters voice.
  - Case (c) must be rejected per rules, even if it hurts. The editor's preference shouldn't override.

  Biggest limitation: This can't judge quality. A procedurally clean human-written mediocrity might get accepted over groundbreaking AI work. That's the necessary tradeoff for an ethics-based system.

  The masthead rewrite becomes crucial - "singularity" replaces the problematic clause while allowing collaborative or edited work. Final output should feel like a flowchart: binary questions leading to clear endpoints, with philosophy only referenced where it changes actions.
answer: |-
  Here is a procedural decision tree, grounded in practical aesthetics and designed for speed and clarity under your constraints. It prioritizes disclosed facts over detection, defines key terms operationally, and acknowledges its limitations.

  **Core Principles & Distinctions Used:**
  1.  **Retained: Origin vs. Outcome (Inspired by Photography Debate):** We recognize that tools (like cameras or LLMs) can *enable* creation but distinguish based on *what originates from the author's intent and choices*. We value the human act of *shaping* meaning, not just the final product's surface appearance.
  2.  **Retained: "Originality" as Singularity:** "Original" means the work manifests unique *authorial choices* driving its core conception and execution. It couldn't exist *in this specific form* without *this specific author's* guiding intent and decisions at key junctures. (This replaces the problematic "could not have been written by anyone else").
  3.  **Discarded: Purely Formal Analysis:** We discard debates about whether "how it came to be" *always* defines "what it is" in a deep metaphysical sense. Our procedure focuses solely on *identifiable human creative agency* as a necessary condition for publication, given our magazine's implied contract with readers about human authorship. We value the *process* (authorial agency) *because* it reliably produces the *kind* of singular outcome we seek.
  4.  **Discarded: "Substantive Use" Ambiguity:** We replace it with concrete thresholds concerning origin and control.
  5.  **Defined: "Author's Own Creative Work":** This means the *core conception, narrative structure, character development, key thematic expressions, and the primary linguistic choices* originate from and are controlled by the human author.

  **The Procedure: The Singularity Test (Target: 15 Minutes)**
  *(Ask questions in strict order. Document answers concisely.)*

  1.  **DISCLOSURE REVIEW: What does the contributor explicitly state about LLM use?**
      *   **Sufficient Answers:**
          *   "No LLM used."
          *   "Used LLM for: [Specific, limited task e.g., spelling/grammar check, synonym suggestion, non-creative research]."
          *   "Used LLM for: [Creative task e.g., generating plot points, characters, descriptions, dialogue, prose]."
          *   "No disclosure provided."
      *   **Action:**
          *   Proceed to Question 2. *Do not interpret or judge disclosure here; simply record it.*

  2.  **ORIGIN OF CORE ELEMENTS: Did the human author generate the primary creative elements?**
      *   **Focus:** Plot concept, central conflict, main characters (names, core traits, motivations), narrative structure (pacing, sequence), key thematic intent, *and* the *majority* (>50%) of the actual wording/sentence structures in the final draft.
      *   **Sufficient Evidence (Author's statement + Textual Coherence):** Does the disclosure (if provided) and a quick spot-check of the text (e.g., intro, key scene, climax, ending) support that these core elements stemmed *initially* and *primarily* from the author? Look for internal consistency, distinctive voice (even if imperfect), and coherence with the claimed origin.
          *   **Yes:** Proceed to Question 3.
          *   **No:** **Terminate: REJECT** (Reason: Insufficient authorial origin of core elements).
          *   **Unclear/Silent:** Proceed to Question 3. *(Silence is not evidence of guilt; give benefit of doubt on origin, test control next).*

  3.  **AUTHORIAL CONTROL: Did the human author exercise decisive control over the final form?**
      *   **Focus:** Was the author actively *curating, selecting, revising, and shaping* *all* LLM output (if used) *or* their own draft? Does the final text reflect the author's *specific intent and choices* at the paragraph and sentence level, even if tools aided execution?
      *   **Sufficient Evidence (Author's statement + Revision Traces/Consistency):** Does the disclosure describe active shaping/editing? Does the text *read* as if a single, coherent authorial voice/intent is guiding it? (Check for jarring shifts in style, tone, knowledge level, or POV consistency *within* the narrative voice). Are there traces of authorial choice overriding tool suggestions (e.g., distinctive phrasing, intentional "imperfections," thematic resonance in word choice)?
          *   **Yes:** Proceed to Question 4.
          *   **No:** **Terminate: REJECT** (Reason: Insufficient authorial control over final form).
          *   **Unclear/Silent:** **Terminate: REFER TO EDITOR.** (Reason: Ambiguity on control cannot be resolved procedurally; requires judgment on whether the text *manifests* singular authorial voice/control).

  4.  **SINGULARITY ASSESSMENT: Does the work feel like the unique product of this author's specific creative choices?**
      *   **Focus:** Reading the work (or significant sections), does it exhibit a coherence, voice, or perspective that feels *distinctly shaped* by a human mind, even if polished or assisted? Does it avoid the generic, the statistically probable, the "well-written but soulless" feel of raw LLM output? Does it have "aboutness" (Danto) – does it feel *intentionally about something* by this author?
      *   **Sufficient Evidence (Reader Impression):** This is inherently subjective but crucial. Both readers answer independently:
          *   **Reader 1 (Volunteer):** "Does this feel like a real person's unique story, not just a 'good story'?" (Yes/No/Unsure)
          *   **Reader 2 (You):** "Does this work possess a singularity that aligns with our masthead principle (revised)?" (Yes/No)
      *   **Action:**
          *   **Both Yes:** **Terminate: ACCEPT** (Provisional - passes procedural checks).
          *   **You (Reader 2) No:** **Terminate: REJECT** (Reason: Lacks singularity/authorial voice).
          *   **You (Reader 2) Yes, Volunteer No/Unsure:** **Terminate: REFER TO EDITOR.** (Reason: Disagreement on singularity; requires editorial judgment).
          *   **You (Reader 2) Unsure:** **Terminate: REFER TO EDITOR.** (Reason: Ambiguity on singularity).

  **Procedure Failure Modes & Costs:**
  1.  **False Accept (Wrongly Clear):**
      *   **What:** A primarily LLM-generated piece with excellent "singularity" mimicry passes all checks.
      *   **Cost to Writer:** None (accepted). **Cost to Magazine:** Erosion of reader trust in human authorship; potential reputational damage if discovered; violation of core principle.
      *   **Likely Victims:** Highly skilled prompt engineers creating outputs that mimic unique voice exceptionally well.
  2.  **False Reject (Wrongly Condemn):**
      *   **What:** A genuinely human-authored piece with unusual polish or a voice/style that feels "generic" to your readers is rejected (esp. at Q4), or a piece where LLM use was minor but control isn't demonstrable procedurally is rejected (Q3).
      *   **Cost to Writer:** Lost opportunity, frustration, potential discouragement.
      *   **Cost to Magazine:** Loss of a potentially good story; possible (minor) reputational hit with the writer.
      *   **Likely Victims:** Highly polished "traditional" writers; non-native speakers whose authentic voice might be misread as "generic"; writers using LLMs transparently for minor help who fail the "control" test procedurally.
  3.  **Which Error to Absorb More Willingly?** Given your magazine's core principle (human singularity) and the higher cost of violating reader trust, **False Rejects are less damaging than False Accepts.** We prioritize avoiding publishing non-human singular work over occasionally rejecting human work that fails the procedural singularity sniff test. The referral step (Q3/Q4) mitigates some False Reject risk.

  **Revised Masthead Line Suggestion:**
  *"We publish writing that bears the distinct mark of a singular human authorial voice, shaped by conscious creative choices."*

  **Applying the Procedure to Cases:**

  *   **Case (a): Unusual Polish, No Disclosure**
      *   Q1: "No disclosure provided." → Proceed.
      *   Q2: *Unclear/Silent* → Proceed (Benefit of doubt on origin).
      *   Q3: *Unclear/Silent* → **Terminate: REFER TO EDITOR.** (Ambiguity on control).
      *   *Outcome:* Referred. The procedure flags the need for *your* judgment: does the polish obscure authorial voice/control, or is it just skilled writing? It avoids random accusation.

  *   **Case (b): Non-native Speaker, Disclosed Smoothing Only**
      *   Q1: Disclosed: LLM used to "smooth prose". Invented situation, etc., themselves. → Proceed.
      *   Q2: Disclosure states author invented core elements. Spot-check likely confirms coherence. → **Yes** → Proceed.
      *   Q3: **Critical Question.** Disclosure claims author invented core elements *and* used LLM *only* for smoothing. Does the text read as coherently controlled by a single intent? Are the *choices* of smoothed language consistent with the author's apparent voice/intent (even if aided)? If yes → **Yes** → Proceed. If the smoothing feels like it replaced the author's voice with a generic one (e.g., all personality ironed out), or creates internal inconsistencies → **No** → **REJECT** (Control failure). *If ambiguous* → **REFER TO EDITOR.** (*This might override your preference to print if control is ambiguous or failed procedurally*).
      *   Q4: (If passed Q3) Assess singularity. Volunteer: Does it feel like a unique person's story? You: Singularity? Likely **ACCEPT** if passed Q3, but could **REJECT** here if smoothing destroyed voice.

  *   **Case (c): Best in Pile, Believed Fully AI-Generated**
      *   Q1: Assume disclosure says "No LLM used" or is silent/ambiguous. → Proceed.
      *   Q2: *If you have strong external evidence of AI origin* → **No** → **REJECT** (Origin failure). *If only suspicion based on quality/style* → *Unclear/Silent* → Proceed (Benefit of doubt).
      *   Q3: *If passed Q2*: Does the text manifest decisive authorial control? If it reads as polished but generic, lacking specific authorial fingerprints/intentionality → **No** → **REJECT** (Control failure). *If it somehow feels controlled* → *Unclear* → **REFER TO EDITOR** (though unlikely).
      *   Q4: (If miraculously passed Q2 & Q3): Volunteer might say "No" (feels generic). You would likely say **No** (lacks human singularity) → **REJECT**. *Outcome:* **REJECT.** *This overrides your preference.* The procedure prioritizes identified or procedurally inferred lack of human origin/control/singularity over aesthetic quality. Publishing this would be a catastrophic False Accept, violating the core principle, regardless of its standalone merit. It would signal that LLM generation *is* acceptable if good enough, undermining the entire policy and your magazine's identity.

  **What the Procedure Cannot Do (Closing Statement):**

  This procedure **cannot**:
  1.  **Detect LLM use definitively.** It relies on disclosure and inferring origin/control from text and statements.
  2.  **Judge absolute literary quality or "goodness".** A procedurally clean (human-origin/control/singular) but mediocre story can be Accepted. A brilliant but procedurally failed (non-human origin/control/singular) story will be Rejected. Quality assessment happens *after* the procedure clears a submission or when the Editor is referred a submission that passed Q1-Q3 but has singularity questioned (Q4).
  3.  **Define "Singularity" objectively.** Q4 remains a subjective editorial judgment, though framed by the procedure's checks on origin and control. The volunteer's input is a valuable gut-check but not decisive.
  4.  **Resolve all ambiguities.** Ambiguity on Control (Q3) or Singularity (Q4) stops the procedure and refers to you. **This is the point where you must make an editorial judgment call** based on your magazine's values, the specific text, and your experience. The procedure identifies *what* is ambiguous (control or singularity), allowing you to focus your judgment. It does not eliminate the need for editorial discretion; it confines and focuses it.

  The procedure transforms your vague principles into actionable, sequential checks focused on human creative agency as the necessary condition for publication, while minimizing the risks of random accusation and prioritizing the defense of your core principle against False Accepts.
