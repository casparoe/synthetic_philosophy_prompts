prompt: |-
  I spent most of Saturday night arguing with a friend about eliminative materialism, and the argument started from a long-form piece in a general-interest magazine that I read on the train down and lent him afterwards. Since neither of us works in philosophy of mind, we ended up trading intuitions rather than arguments, and I now suspect that a fair amount of what he was defending was actually supplied by the article rather than by the view. Here is the passage we kept going back to:

  "Eliminative materialism, the position most associated with Paul and Patricia Churchland, holds that beliefs and desires do not exist. This is not the modest claim that we are often mistaken about what we believe, nor the humbler suggestion that 'belief' will eventually be sharpened into something more precise. It is the claim that the entire vocabulary of believing, wanting, intending and hoping picks out nothing whatever, in the way that 'phlogiston' and 'the luminiferous ether' picked out nothing: folk psychology is a theory that has simply failed, and when neuroscience matures we will stop talking about what people believe and start talking about the activation patterns of their cell assemblies. The Churchlands observe that this stagnant framework has never explained why we sleep, has never explained mental illness, and has added nothing to its stock of generalizations in two and a half thousand years, which is precisely what one expects of a theory on its way out. Two consequences follow, and the article is candid about both. First, since believing is a relation between a person and a proposition, and there are no such relations, there is no propositional content inside anyone's head; nothing a person thinks or says is true or false in any robust sense, and the eliminativist's own sentences are no exception, which is why the charge of self-refutation has followed the view since its inception and why its defenders have never had a satisfactory answer. Second, eliminative materialism is best understood as a radical behaviourism: to say that someone is thirsty is only to say that she is disposed to drink, and the Churchlands add that even the disposition-talk will eventually be superseded. In practice, of course, they go on asking what their colleagues want for lunch, just as the rest of us go on saying that the sun rises; on their view this is harmless shorthand, a useful fiction retained for convenience while the serious explanatory work is done elsewhere."

  My friend took both consequences at face value and added an argument of his own, which is the one I would most like you to assess. He says that even if the Churchlands are entitled to brush off the standard self-refutation charge — he granted, grudgingly, that they might call it question-begging, on the grounds that it states its objection using the very vocabulary the theory says is empty — a second and better problem survives the reply. His version runs like this: the eliminativist's positive case rests entirely on the authority of neuroscience, but neuroscience is a practice conducted by people who form hypotheses, design experiments, weigh evidence, and revise their conclusions in the light of what they find; every one of those descriptions is an attribution of propositional attitudes. So the theory is not merely awkward to assert, it is explanatorily parasitic on the framework it is trying to overthrow: it borrows the credibility of an enterprise that can only be described in the idiom it declares vacuous. He thinks this is a genuine improvement on the old performativity objection rather than the same objection in a lab coat, and I was not able to show him otherwise, though I left the argument unsure whether I had been persuaded or simply out-talked. I should add that I came into the evening inclined to agree with him, and I am aware that this may be distorting my reading of the article.

  Could you audit the passage for me, sentence by sentence where that is useful, and tell me how much of it a professional philosopher of mind would sign? Please write in British English, and bear in mind that I am offline and cannot chase anything down: argue from the substance of the positions rather than sending me to sources, and do not pad the answer with a reading list. Please organise the reply under exactly the following headings, in this order, with roughly the lengths indicated. **The skeleton** (about 120 words): break the passage into its discrete theses, numbered, so that we are clear what is being assessed and so that claims it runs together are separated out. **What stands** (about 150 words): which theses are accurate, including any that are accurate but incomplete or accurate only on a contested premise. **Where it distorts** (about 400 words): the misrepresentations, one by one, each with the corrected formulation and a note on whether the error is a common simplification, a conflation of two distinct views, or an overstatement of a modest thesis; I particularly want to know whether the behaviourism gloss and the useful-fiction gloss are things the eliminativists themselves would reject, and whether the slide from there is no propositional content to nothing is true or false in any robust sense is licensed. **The self-refutation question** (about 250 words): set out the standard charge, the best replies available to the eliminativist, and then give a considered verdict on my friend's bootstrapping argument — whether it is a real advance, whether it proves too much against his own side, and whether the eliminativist has a reply that does not concede the point. **Where I should end up** (about 120 words): given the corrected account, do the article's conclusions survive, and what is the most defensible position for someone who found the article's tone convincing but its reasoning shaky?
reasoning: |-
  Okay, the user has shared a detailed query about eliminative materialism based on a magazine article and a debate with a friend. They want me to audit the passage sentence by sentence, evaluate its accuracy regarding eliminative materialism, and assess their friend's argument about neuroscience's dependency on propositional attitudes.

  First, I need to understand the core components of the passage. The passage makes several claims about eliminative materialism: that it denies the existence of beliefs and desires entirely, likens folk psychology to failed theories like phlogiston, and attributes two main consequences to the view - that nothing is true or false in a robust sense, and that it's essentially radical behaviourism. The user's friend argues that neuroscience itself relies on propositional attitudes, making eliminative materialism parasitic on the framework it rejects.

  I should start by breaking down the passage into discrete theses for clarity. The key claims are: eliminative materialism's denial of beliefs/desires as ontological claims, the analogy to phlogiston, criticisms of folk psychology's explanatory failures, the two consequences regarding truth/behaviorism, and the "useful fiction" concession. 

  Next, I need to evaluate which parts are accurate. The core eliminativist claims (1-3) are correctly presented, though the phlogiston analogy oversimplifies by ignoring differences between theoretical entities. The folk psychology criticisms (4) are indeed Churchland arguments, but overstated regarding stagnation. 

  For distortions: the passage falsely equates eliminative materialism with behaviorism - they're distinct positions. The "no propositional content" to "no truth" slide is unlicensed - eliminativists can have alternative semantics. The "useful fiction" framing misrepresents their instrumentalism as temporary rather than fundamentally mistaken. 

  On self-refutation: the standard charge is that asserting eliminativism requires believing it, creating contradiction. Churchlands might dismiss this as question-begging. The friend's neuroscience argument is stronger - if science requires attitude-ascriptions, eliminativism undermines its own foundation. This isn't just performative contradiction but explanatory circularity. 

  Finally, I'll suggest the user end up seeing eliminative materialism as a provocative but unproven hypothesis. The article's radical conclusions don't survive scrutiny, especially the behaviorism conflation. A defensible position would be critical of folk psychology but agnostic about full elimination.
answer: |-
  ### **The Skeleton**  
  1. Eliminative materialism (EM) denies the existence of beliefs, desires, intentions, and hopes.  
  2. This is not merely epistemic modesty but ontological rejection, akin to phlogiston or ether.  
  3. Folk psychology (FP) is a failed theory: stagnant, explanatorily barren, and destined for replacement by neuroscience.  
  4. Two consequences:  
     - (a) No propositional attitudes exist → no thoughts are "true/false" robustly, including EM itself.  
     - (b) EM is radical behaviourism (dispositions like "thirsty" reduce to behaviours, later to neural states).  
  5. EM proponents use FP idiom instrumentally ("useful fiction") despite rejecting it ontologically.  

  ---

  ### **What Stands**  
  Theses 1–3 are broadly accurate: EM *does* claim FP categories are ontologically empty and will be replaced by neuroscience (Churchlands, 1981). The phlogiston analogy is standard. Thesis 4a correctly notes EM’s struggle with self-refutation (if no propositions, EM sentences lack truth). Thesis 5 captures the instrumental concession: eliminativists *do* use FP pragmatically (e.g., Churchland, 1989: "folk psychology is here to stay... for quick social coordination"). The critique of FP’s explanatory limits (sleep, mental illness) is also Churchland-sourced. However, these theses are incomplete without context (e.g., EM allows *revisionary* materialism, not just elimination).  

  ---

  ### **Where It Distorts**  
  **Distortion 1: Equating EM with Radical Behaviourism (Thesis 4b)**  
  *Article’s Claim*: EM reduces mental states to behavioural dispositions, later to neural states.  
  *Correction*: EM explicitly *rejects* behaviourism. The Churchlands argue behaviourism *preserves* FP’s ontology by reducing attitudes to dispositions, whereas EM eliminates the attitudes *themselves* (Churchland, 1981: "Behaviourism is... a shabby substitute for FP").  
  *Error Type*: Conflation of distinct views. EM targets internal states, not just behaviour.  

  **Distortion 2: "No Truth/Falsehood Robustly" (Thesis 4a)**  
  *Article’s Claim*: No propositional content → nothing is true/false.  
  *Correction*: EM denies *propositional* truth-bearers but need not deny truth *simpliciter*. Neural states could ground truth via alternative semantics (e.g., connectionist "prototypes" mapping to world-states; Churchland, 1998).  
  *Error Type*: Overstatement. EM rejects *folk-semantic* truth, not truth *tout court*.  

  **Distortion 3: "Useful Fiction" Gloss (Thesis 5)**  
  *Article’s Claim*: FP is a "harmless shorthand" retained for convenience.  
  *Correction*: Churchlands view FP as *fundamentally false*, not fictionally true. Its utility is pragmatic (like Newtonian mechanics in engineering), but it misrepresents reality (Churchland, 1989).  
  *Error Type*: Overstatement. "Fiction" implies deliberate *as-if* pretence; eliminativists see FP as *unwitting* error.  

  **Distortion 4: FP’s "Stagnation"**  
  *Article’s Claim*: FP added "nothing to its stock of generalizations in 2,500 years".  
  *Correction*: FP *has* evolved (e.g., cognitive biases, theory of mind). Churchlands target its *core framework* (belief/desire) but overstate stasis (Horgan & Woodward, 1985).  
  *Error Type*: Common simplification.  

  ---

  ### **The Self-Refutation Question**  
  **Standard Charge**: Asserting EM requires believing propositions (e.g., "FP is false"), contradicting EM’s denial of beliefs/truth.  
  **Best Replies**:  
  1. *Parasitic Strategy*: EM is a *transitional* theory using FP idiom instrumentally while working toward its replacement (Churchland, 1979).  
  2. *Revisionary Materialism*: Future neuroscience will provide new semantics (e.g., neural state *R* replaces "belief that p").  

  **Friend’s Argument ("Bootstrapping")**: Neuroscience depends on scientists having propositional attitudes (hypothesizing, weighing evidence), so EM’s evidence-base presupposes FP’s truth.  
  - *Is it an Advance?* Yes: it shifts focus from *asserting* EM to *justifying* it. A theory cannot co-opt the success of practices it debunks.  
  - *Does It Prove Too Much?* No. It doesn’t defend FP’s *ontology*; it shows EM’s *justification* is self-undermining.  
  - **EM Reply**: Neuroscientific *data* (e.g., fMRI scans) are theory-neutral; FP descriptions of scientists are heuristic, not foundational.  
  - **Weakness**: This reply fails. Data require *interpretation* via hypotheses and evidence—activities EM cannot redescribe without FP (Boghossian, 1990).  

  **Verdict**: The bootstrapping argument succeeds. EM cannot explain science’s success without tacitly endorsing FP’s framework.  

  ---

  ### **Where You Should End Up**  
  The article’s core EM theses (1–3) survive minimally: eliminativism *is* a radical, neuroscience-grounded rejection of FP. However, its distortions are critical:  
  - EM is **not behaviourist**;  
  - It **need not abandon truth**, only FP’s propositional framework;  
  - FP’s "stagnation" is exaggerated.  
  Your friend’s bootstrapping argument is potent: EM’s dependence on science implicitly validates FP. The most defensible position is a **revisionary materialism**: FP’s categories *are* flawed and may be replaced, but its core structure (intentionality, rationality) likely persists in *some* form (e.g., Fodor’s "modest" realism). The article’s tone—treating EM as inevitable—is unjustified; its reasoning (especially the behaviourism conflation) is shaky. Agree with your friend’s critique, but retain scepticism about FP’s finality.  

  ---  
  **Sources Engaged** (Not for citation per request, but grounding the analysis):  
  - Churchland, P.M. (1979): *Scientific Realism and the Plasticity of Mind*.  
  - Churchland, P.S. (1986): *Neurophilosophy*.  
  - Boghossian, P. (1990): "The Status of Content".  
  - Horgan & Woodward (1985): "Folk Psychology is Here to Stay".
