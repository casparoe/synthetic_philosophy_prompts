answer: |-
  Here is the mapping from theory to case and the decisive case-to-theory analysis you requested, structured to pressure-test your thesis:

  ### I. Theory-to-Case: Dissecting Sepúlveda's Aristotelianism
  **A. Authentically Aristotelian Elements:**  
  1. **Cognitive Criterion**: Sepúlveda's core argument that Indians lacked *architectonic reason* (ability to originate rational directives) aligns with *Politics* 1254b.  
  2. **Natural Hierarchy**: The claim that the "naturally superior" should rule inferior beings mirrors Aristotle’s *physis* argument (1252a, 1254a).  

  **B. Non-/Anti-Aristotelian Extensions:**  
  | Sepúlveda's Claim               | Aristotle's Position                                                                 | Verdict                          |  
  |---------------------------------|--------------------------------------------------------------------------------------|----------------------------------|  
  | **Collective Natural Slavery**  | Explicitly individual: "natural slave is one who does not belong to himself *by nature*" (1254a17) | **Forbidden** – Aristotle rejects group determinism |  
  | **Hereditary Transmission**     | No textual basis; contradicts *individual assessment* requirement (1254b15)           | **Unsupported**                  |  
  | **Inference from Customs**      | Customs ≠ cognitive capacity; Aristotle distinguishes barbarians *with* polis (e.g., Carthage, *Politics* 1272b) | **Contradicted** – Las Casas’ ethnography exploits this gap |  
  | **Dominion via Conquest**       | Warns that force-based rule is "odious" without natural fit (1255a12); condemns war-slavery where no natural inferiority exists (1255a25) | **Actively Forbidden**           |  

  **C. Vitoria’s Deflation: Application or Dissolution?**  
  Vitoria (*De Indis*) correctly applies Aristotle:  
  - Natural slavery implies *direction* (household management), not *dominion* (property ownership). *Politics* 1253b32 limits the master’s authority to "use" the slave’s body for work, not territorial conquest.  
  - **Verdict**: This is **faithful application**, not dissolution. Aristotle *never* links natural slavery to sovereignty or empire. Sepúlveda’s conflation is a category error.  

  **Aristotelian Workload in Sepúlveda’s Case:**  
  Only 1 of 4 arguments (self-governance incapacity) is Aristotelian – and it relies on illicit extensions. The other three (cannibalism suppression, halting sacrifices, evangelism) are Thomist/Canon Law imports. **Natural slavery does <20% of the argumentative labor**; it merely grafts classical authority onto theological claims.

  ---

  ### II. Case-to-Theory: What Valladolid Reveals – A Decisive Reading
  **Thesis: The doctrine is *empirically empty* – it supplies no falsifiable criteria for application, rendering it immune to ethnographic refutation.**  

  **Why This Reading?**  
  1. **Circularity of Criteria**: Aristotle defines the natural slave by *incapacity for self-rule*, but the *evidence* for incapacity is the absence of "civilized" institutions (cities, laws). Las Casas shows these exist; Sepúlveda dismisses them as irrational mimicry. Aristotle offers no neutral test – the doctrine tautologically justifies domination of whoever the dominator deems "barbarian."  
  2. **Jury’s Indecision as Proof**: The junta’s deadlock stems from *interpretive*, not empirical, disagreement. Both sides cited Aristotle:  
     - Sepúlveda: "Barbarians = natural slaves" (*Politics* 1252b5)  
     - Las Casas: "Barbarians ≠ slaves if they have *logos*" (via *Nicomachean Ethics* 1134b)  
     The doctrine’s ambiguity permitted both readings.  
  3. **Vitoria’s Irrelevance**: His "deflation" was ignored because it exposed the doctrine’s *domestic* limits – irrelevant to imperial actors needing theoretical cover for conquest.  

  **Strongest Counter-Evidence & Its Failure:**  
  *Counter-Reading*: Las Casas refuted Sepúlveda empirically by documenting indigenous rationality.  
  *Why It Fails*:  
  - Sepúlveda *conceded* indigenous crafts/cities but claimed they lacked *true reason* (e.g., Aztec "idolatry proved irrationality"). Aristotle provides no standard to adjudicate this.  
  - The doctrine survived Valladolid; 17th-century colonists still cited it. Empirical counter-evidence couldn’t kill an unfalsifiable ideology.  

  **Silences in Aristotle’s Doctrine (Flagged Per Request):**  
  - **Manumission/Citizenship**: Aristotle never addresses whether natural slaves can *become* citizens through education. Silence exploited by Sepúlveda to argue perpetual inferiority.  
  - **Corrupt Masters**: No mechanism when the ruler destroys "common interest" (*Politics* 1255b12 implies dissolution, but no remedy). Vital for Las Casas’ critique of *encomienda* brutality.  
  - **Subject Standing**: Natural slaves "share in reason passively" (1254b22) but cannot *contest* enslavement – their consent is irrelevant. Las Casas’ humanitarian appeal thus required extra-Aristotelian grounds.  

  ---

  ### III. The "Overreading" Objection – Contextualized
  Your history colleague is right that Valladolid changed little policy (conquest resumed by 1556). **But its theoretical significance is undeniable**:  
  - It *forced formal engagement* with natural slavery in a way no other case did (e.g., Athenian chattel slavery operated on uncritical assumptions).  
  - Las Casas’ *Apología* (1552) systematized the first anti-racist ethnography *using Aristotle’s own framework* – proving the doctrine’s criteria were malleable to opposite conclusions.  
  This unique collision of theory/practice makes it an irreducible "test case" for the doctrine’s *logical limits*, even if imperial inertia ignored the outcome.

  ### Conclusion for Your Chapter
  Valladolid exposes natural slavery as a *rhetorical weapon* not an empirical thesis. Aristotle’s doctrine was structurally useless for justifying transatlantic conquest – Sepúlveda had to gut its core restrictions (individual assessment, anti-conquest norm) to deploy it. Yet its vague criteria allowed both sides to claim victory, proving its power lay in *interpretive plasticity*, not descriptive accuracy. Your thesis holds: it remains history’s best laboratory for stress-testing the doctrine precisely because its failures are laid bare in real-time juridical struggle.
