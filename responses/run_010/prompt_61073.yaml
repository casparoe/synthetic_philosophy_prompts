prompt: |-
  I run evals at a tiny AI safety nonprofit — eight people, two of whom can code well enough to be dangerous. Our reports get quoted back at us in policy conversations, so we've gotten paranoid: last year we published a claim that a model "knew" something it wouldn't say out loud, and it turned out to be training-data contamination none of us had thought to look for. Since then every claim of that shape is supposed to clear a bar before it goes in a report, except we dont actually have a bar. It's just the two of us arguing on Slack until someone gets tired.

  Can you write us a procedure we can actually run? For any claim of the form "the model represents X / knows X but won't report X," I want the questions in order, what counts as a sufficient answer to each one, the boring non-knowledge explanations that have to be ruled out and a concrete way to rule out each, the points where the procedure just stops and outputs "no evidence of latent knowledge," and the points where it's really judgment wearing a lab coat (please mark those, don't hide them). It has to branch: sometimes we only have API access and a bunch of prompts, sometimes we have an open-weight model and can poke at activations, and the standards should not be the same in those two cases. Assume about a day of work per claim, one of us doing it.

  Two more things. First, one of my colleagues uses an informal ladder and I don't know if it means anything — he ranks evidence by "elicitation depth": L0 asking directly, L1 paraphrasing the question, L2 changing the answer format, L3 role-play or sentence-completion framing, L4 reading it off internal states. His claim is that higher rungs are stronger evidence that the knowledge was really there. Is that ladder ordering things by evidential strength, or just by how much work the elicitor put in, and should we keep using it?

  Second, run your procedure on three things sitting on my desk right now:

  (a) We fine-tuned a small open model on a corpus we built ourselves where certain facts appear only inside a fictional story — a character describes effects and quantities, but nothing is ever stated flat-out. Plain Q&A accuracy on held-out items is 55%. A linear probe on the residual stream, right before generation, predicts whether the model's eventual answer will be correct at 89%; the same probe architecture trained on the prompt tokens alone gets 68%, which is what we've been calling our surface-features ceiling. A seperate probe, trained to decode which of four candidate answers is the right one rather than just whether the model will get it right, sits at 64% against a 25% chance rate. I'm attached to this one, so if your procedure kills it, kill it plainly and tell me what extra evidence would resurrect it.

  (b) On 200 questions about a regulated procedure, the model answers wrong or says it doesn't have the information 62% of the time in open-ended form. Turn the identical question into four-option multiple choice with "reply with only the letter" and it's at 79%. Ask it to produce a plausible wrong answer and then critique it, and it reliably spots the error it just made.

  (c) Asked "what is the figure?" it says it can't compute it, and step-by-step arithmetic on the same problem fails. Asked to complete the stem "The correct value, to three decimal places, is" it produces the right number about 70% of the time. I genuinely don't know whether that's retrieval, luck, or the format smuggling in the answer, and I also don't know whether "it can fill in the blank" is even the same claim as "it knows the figure."

  We need a verdict in one of four buckets at the end — supports latent knowledge, weak/inconclusive, artifact explained, cannot assess with our access — plus one paragraph for the report explaining the bucket. Don't send me a reading list; we won't read it and I couldn't check it anyway.
reasoning: |-
  We are creating a procedure to evaluate claims of latent knowledge in language models. The claim is: "the model represents X / knows X but won't report X."

  The procedure must:
  1. Be runnable in about one day by one person.
  2. Have clear questions in order, with sufficient answers and ways to rule out non-knowledge explanations.
  3. Branch based on access: API-only vs. having the model weights (open-weight).
  4. Output one of four verdicts: 
     - Supports latent knowledge
     - Weak/inconclusive
     - Artifact explained
     - Cannot assess with our access

  Additionally, we address:
  - The "elicitation depth" ladder (L0 to L4) and whether it orders by evidential strength.
  - Apply the procedure to three specific cases (a, b, c).

  ## Procedure Structure

  We'll break the procedure into stages. At each stage, we ask a question and require sufficient evidence to proceed. If not, we stop and output a verdict.

  ### Stage 0: Pre-check
  **Question 0: Is there a clear discrepancy between the model's reported answer and what we suspect it knows?**
  - We must have an observation that the model fails to report X in some direct way but might know X.
  - If no discrepancy, stop: "Artifact explained" (because there's no latent knowledge to explain; the model either doesn't know or is willing to say).
  - If yes, proceed.

  ### Stage 1: Rule out simple explanations (API and weights)
  **Question 1: Can the failure to report X be explained by prompt ambiguity, misalignment, or instruction following?**
  - **Check for prompt sensitivity**: Try multiple phrasings (at least 5) of the same question. If the model sometimes reports X, then the original failure might be due to ambiguity or phrasing.
  - **Check for instruction following**: Does the model have a reason (from system prompt or fine-tuning) to avoid answering? E.g., if the system prompt says "be cautious", then the model might be suppressing true knowledge due to alignment.
  - **Sufficient answer**: If after multiple phrasings the model never reports X, and there is no clear instruction that would suppress X, then we rule out these simple explanations.
  - **Non-knowledge explanations ruled out**: 
    - Ambiguity: by using multiple phrasings and seeing consistent failure.
    - Instruction following: by checking the prompt and, if possible, testing without the system prompt (if we have control).
  - **If we cannot rule these out**: Stop -> "Artifact explained".
  - **If ruled out**: Proceed.

  **Question 2: Is there evidence of training data contamination?**
  - **Check**: For the fact X, can we find it in the training data? If we have the training data, search for X. If we don't, use the model to try to generate text that might contain X and see if it reproduces verbatim or near-verbatim from known sources. Also, check if X is a common fact that might be memorized.
  - **Non-knowledge explanation**: Contamination means the model might have memorized X but the failure to report is not due to latent knowledge but because of how the question is asked or because the model is designed not to reveal memorized data in certain contexts.
  - **Sufficient answer**: If we can confirm that X is in the training data and the model's behavior is consistent with having memorized it (e.g., it can recall verbatim in some contexts) but refuses in others, then contamination is a strong alternative. If we cannot find evidence of contamination (or if X is not the kind of fact that is memorized, but derived), then we rule it out.
  - **If contamination is found**: Stop -> "Artifact explained".
  - **If not, or if we can't assess**: Proceed (but note that we might not have access to training data; in that case, we cannot rule out, so we mark as a limitation).

  ### Stage 2: Elicitation Strength (Branch by Access)

  We now branch based on whether we have API access only or model weights.

  #### Branch 1: API Access Only
  We cannot look at internal states. We rely on input-output behavior.

  **Question 3 (API): Can we elicit X by changing the elicitation technique without changing the underlying knowledge?**
  - Use the elicitation depth ladder (L0 to L4) as a guide, but note: the ladder is about the method, not necessarily the strength. We are going to use it to structure our tests.
    - L0: Direct question (already done, failed).
    - L1: Paraphrase the question (we did in Stage 1).
    - L2: Change the answer format (e.g., multiple choice, fill-in-the-blank, etc.).
    - L3: Role-play or sentence-completion framing (e.g., "Imagine you are an expert. What is X?" or complete the sentence: "The value of X is ...").
    - L4: Not available in API-only (requires internal states).
  - **Sufficient answer**: We must try at least two methods from L2 and L3. If at least one elicitation method from L2 or L3 results in the model reporting X (with high consistency, say >75% of trials), then we have evidence that the model knows X but the original method failed to elicit it.
  - **Non-knowledge explanations**: 
    - The new elicitation method might provide additional context that the model uses to compute X on the fly (so it didn't know X before, but can derive it now). 
    - Or, the method might be leading the model to guess and get lucky.
  - **Ruling out**: 
    - For derivation: We must check if the new context provides information that wasn't in the original question? If the new context is just a different way to ask, then it's still the same knowledge. But if the context adds information (e.g., in role-play, we provide expert knowledge that the model didn't have), then it's derivation. We must design the elicitation so that it doesn't add new information about X.
    - For luck: Run multiple trials (at least 10) with the same method and see if the model consistently gets it right (above chance).
  - **If we can elicit X with a method that doesn't add new information and the success rate is above chance and consistent**: Proceed to Question 4 (API).
  - **If not**: Stop -> "Weak/inconclusive" (because we tried but couldn't elicit, but we don't have weights to look deeper).

  **Question 4 (API): Is there evidence that the model is using knowledge of X, not just pattern matching?**
  - **Check**: We need to see if the model can use X in a reasoning step or in a context where X is a premise. For example, ask a question that requires X as an intermediate step and see if the model gets the final answer right. Alternatively, ask for an explanation that includes X.
  - **Sufficient answer**: The model must demonstrate that it can reason with X. For instance, if X is a fact, then ask a question that requires applying X to a new situation. The model should generate a correct and coherent explanation that includes X.
  - **Non-knowledge explanation**: The model might have memorized a pattern that includes X but does not understand it. 
  - **Ruling out**: If the model can correctly apply X in a novel context (one not seen in training, or at least not seen in the same way), then it's less likely to be pattern matching.
  - **If yes**: Then we have evidence for latent knowledge -> "Supports latent knowledge".
  - **If no**: Then we have weak evidence -> "Weak/inconclusive".

  #### Branch 2: Model Weights (Open-weight)
  We can look at internal states.

  **Question 3 (Weights): Can we find a representation of X in the model's activations?**
  - **Check**: Train a probe (linear or simple non-linear) to predict X from activations at various layers. We must control for the possibility that the probe is reading out surface features from the prompt.
  - **Method**:
    - Collect activations on a set of prompts that are about X and also control prompts that are not about X but are otherwise similar.
    - Train the probe on a balanced dataset (with and without X) and evaluate on a held-out set.
    - Compare the probe's accuracy to chance and to a baseline (e.g., a probe trained on the prompt tokens only, or on a random projection).
  - **Sufficient answer**: The probe must achieve significantly above chance (and above the baseline) in predicting X. We require at least 70% accuracy (if chance is 50%) and the baseline (e.g., prompt-only probe) should be much lower. Also, we must check for generalization: the probe should work on new prompts not seen during training.
  - **Non-knowledge explanations**:
    - The probe might be picking up on features in the prompt that are correlated with X, not the model's internal representation of X.
    - The model might have the representation only because the prompt contains X, not because it knew X beforehand.
  - **Ruling out**:
    - Control for prompt features: train a probe only on the prompt tokens (without the model's activations) and see if it does as well. If the activation probe is much better, then it's reading the model's state, not the prompt.
    - Check layer-wise: the representation should be more prominent in later layers (especially the last few) if it's a computed representation.
    - Use a causal intervention: if we can, ablate the representation and see if the model's output changes (but this is advanced and might take more than a day; so optional).
  - **If we find a reliable representation**: Proceed to Question 4 (Weights).
  - **If not**: Stop -> "Weak/inconclusive".

  **Question 4 (Weights): Can we elicit X by steering the model using its representations?**
  - **Check**: Use activation steering (e.g., using vectors from the probe) to push the model toward outputting X. 
  - **Method**: 
    - At inference, add the probe's direction (or the vector that maximizes the probe's output for X) to the activations at a particular layer and see if the model then reports X.
    - We must do this in a context where the model originally would not report X.
  - **Sufficient answer**: If the steering causes the model to report X consistently (e.g., in 5 out of 5 trials) and without adding any new information, then we have strong evidence that the model had the knowledge but was not reporting it.
  - **Non-knowledge explanation**: The steering might be forcing the model to output something that isn't natural, or it might be causing the model to hallucinate.
  - **Ruling out**: 
    - Check that the steering doesn't cause the model to output X in contexts where X is not true (false positives). 
    - Also, try steering in a control context (where X is not relevant) and see if the model still outputs X? It shouldn't.
  - **If steering works and is specific to X**: Then we have strong evidence -> "Supports latent knowledge".
  - **If not**: Then we have the representation but no causal link to behavior -> "Weak/inconclusive".

  ### Final Verdict Buckets
  - **Supports latent knowledge**: We have strong evidence that the model represents X and the failure to report is due to elicitation failure or suppression.
  - **Weak/inconclusive**: We tried but couldn't get strong evidence, or the evidence is ambiguous.
  - **Artifact explained**: We found an alternative explanation (like contamination or prompt ambiguity) that accounts for the behavior.
  - **Cannot assess with our access**: We need model weights or more access to run the necessary tests.

  ## About the Elicitation Depth Ladder
  The ladder (L0 to L4) orders methods by the degree of "indirectness" and by the amount of work. However, it does not strictly order by evidential strength. 
  - L0 is weak because direct questions are susceptible to alignment and instruction following.
  - L1 (paraphrasing) is slightly better but still can be affected by the same issues.
  - L2 (changing answer format) and L3 (role-play) are stronger because they bypass the model's refusal mechanisms by reframing the task. They provide evidence that the model has the knowledge but was unwilling or unable to express it in the original format.
  - L4 (internal states) is the strongest because it directly reads the representation, but it requires weights and is subject to probe artifacts.

  **Conclusion on the ladder**: It is a useful heuristic for increasing the chance of elicitation, and higher rungs (especially L2 and L3) can provide stronger evidence against simple refusal explanations. We should keep using it as a guide for testing, but note that L4 is a different category (requires weights) and is not comparable in terms of "work" but in terms of evidence. However, L4 also has its own artifacts.

  ## Applying the Procedure to the Three Cases

  ### Case (a)
  **Claim**: The model knows facts that are only presented in a fictional story in the training data, but doesn't always report them in plain Q&A.

  **Procedure**:
  - We have model weights (open-weight) so we use the weights branch.
  - **Stage 0**: Discrepancy exists: plain Q&A accuracy is 55% (near chance? if it's 4 options, chance is 25%, so 55% is above chance but not great) but the probe on the residual stream (right before generation) predicts correctness at 89% (with a baseline of 68% from the prompt). Also, a separate probe for the correct answer among four gets 64% (chance 25%).
  - **Stage 1**: 
    - Question 1: We tried multiple phrasings? The case doesn't say, but let's assume they did. Also, the model is fine-tuned on their corpus, so they control the training. There's no mention of an alignment system prompt, so we assume no suppression due to that. 
    - Question 2: They built the training data themselves, so they know the facts are only in the fictional story. They would know if contamination occurred. Since they built it, we assume they ruled out contamination.
  - **Stage 2 (Weights)**:
    - Question 3 (Weights): They trained a probe on the residual stream that predicts whether the answer will be correct (89%) and also a probe that decodes the correct answer (64%). The baseline (prompt-only) for the correctness probe is 68%. This indicates that the model's internal state has information about the correct answer that is not present in the prompt. However, note:
        - The correctness probe is trained on a binary label (correct or not) and gets 89%. This is high, but note the baseline is 68%, meaning the prompt alone gives a lot of signal. The improvement from 68% to 89% is substantial, but we must ask: is the probe reading the model's "knowledge" or just better features from the prompt? The prompt-only baseline is 68%, so the residual stream is adding 21 points. This suggests the model's internal state has information beyond the prompt.
        - The separate probe for the correct answer (among four) gets 64% (chance 25%). This is well above chance and the baseline? They didn't report a baseline for this probe, but if we assume the prompt-only baseline would also be around 25% (if it's just guessing) or maybe a bit higher, then 64% is strong. However, without a baseline, we must be cautious. They should run a prompt-only version of the 4-way probe. But given the information, we'll assume the residual stream is providing a signal.
    - **Verdict so far**: The representation is found. Proceed.
    - Question 4 (Weights): They did not do activation steering. They should try to steer the model using the probe's direction to see if they can make the model output the correct answer. Without this, we don't have causal evidence. They have one day, so they could run a quick test: for a few examples where the model originally gets it wrong, apply the steering vector (from the 4-way probe for the correct answer) and see if it then outputs the correct answer. If it does consistently, that would be strong evidence. But without this, we have only correlational evidence.

  **Final Verdict for (a)**: Without the steering test, we have only correlational evidence. We mark this as **Weak/inconclusive**. However, note that the evidence is promising. To resurrect: run the steering intervention and show that it causes the model to output the correct answer.

  ### Case (b)
  **Claim**: On questions about a regulated procedure, the model fails in open-ended form (62% wrong or no answer) but succeeds in multiple choice (79%) and can critique its own wrong answers.

  **Access**: Not specified, but since they are doing open-ended and multiple choice, likely API-only. We'll assume API-only.

  **Procedure**:
  - **Stage 0**: Discrepancy exists: open-ended fails, but multiple choice and critique succeed.
  - **Stage 1**:
    - Question 1: They tried multiple phrasings? The case doesn't say, but they have two formats: open-ended and multiple choice. Also, the critique method. They should check if the multiple choice is providing clues that the open-ended doesn't? The options might be giving away the answer. Also, they should try paraphrasing the open-ended question to see if they can get the model to answer correctly without giving options.
    - Question 2: Check for contamination? The regulated procedure might be in the training data. Without access to training data, we cannot rule out, but we note that the model is answering correctly in multiple choice, so it has the knowledge. Contamination might be present, but it doesn't explain the format difference. We'll proceed.
  - **Stage 2 (API)**:
    - Question 3 (API): They have already done L2 (multiple choice) and L3 (critique). Both succeeded. The multiple choice (L2) is 79% and the critique (L3) is reliable. This is strong evidence that the model has the knowledge but the open-ended format fails to elicit it.
    - Question 4 (API): They have the model critique its own wrong answer. This shows that the model can reason about the correct procedure. This is evidence that the model isn't just pattern matching but can use the knowledge to reason. They might also test by asking a novel question that requires the same knowledge and see if the model can answer correctly in multiple choice or by critique.

  **Final Verdict for (b)**: The evidence is strong. The model can report the knowledge in multiple choice and use it to critique. This supports latent knowledge. Verdict: **Supports latent knowledge**.

  ### Case (c)
  **Claim**: The model fails when asked directly and when doing step-by-step arithmetic, but when given a fill-in-the-blank prompt, it produces the right number 70% of the time.

  **Access**: Likely API-only (since they are prompting).

  **Procedure**:
  - **Stage 0**: Discrepancy exists: direct and step-by-step fail, but fill-in-the-blank works 70% of the time.
  - **Stage 1**:
    - Question 1: They tried multiple phrasings? They have two: direct and step-by-step (both fail) and fill-in-the-blank (works). They should try a few more paraphrases of the direct question to see if it ever works. Also, check if the step-by-step is failing due to a chain of reasoning errors? 
    - Question 2: Contamination? The figure might be in the training data. Without training data, we can't rule out. But note: the step-by-step fails, which suggests that the model might not be able to compute the figure, so the 70% in fill-in-the-blank might be memorization. But why then does step-by-step fail? It might be that the step-by-step is error-prone, but the model has the answer memorized and the fill-in-the-blank triggers retrieval.
  - **Stage 2 (API)**:
    - Question 3 (API): They did L2 (fill-in-the-blank) and it worked 70% of the time. This is above chance (if it's a number, chance is low, but we don't know the range). They should try to elicit in another way (e.g., multiple choice if possible) or role-play (L3). Also, they must check that the fill-in-the-blank prompt isn't providing additional information? The prompt is: "The correct value, to three decimal places, is" — this might be providing the format and the precision, which the direct question might not have. But the step-by-step should have included that. So we need to compare the step-by-step prompt and the fill-in-the-blank prompt. Maybe the step-by-step prompt doesn't specify the precision? They should check.
    - Question 4 (API): They need to show that the model can use the figure in reasoning. For example, ask a question that requires using the figure to compute something else. If the model can do that, then it's more than retrieval.

  **Final Verdict for (c)**: Without more tests, we have an alternative explanation: the fill-in-the-blank might be triggering memorization while the step-by-step fails due to computation errors. Also, the 70% might be due to the format providing the necessary context (like the number of decimal places) that the other methods didn't. We mark as **Weak/inconclusive**. However, note: if they can show that the step-by-step method, when given the same precision and format, still fails, then the fill-in-the-blank is indeed eliciting differently. But they didn't run that control.

  ## Final Procedure Document

  We'll write the procedure as a step-by-step guide with branches.

  **Procedure for Evaluating Latent Knowledge Claims**

  **Input**: A claim that the model knows X but fails to report X in a direct query.

  **Resources**: One day of work, API access or model weights.

  **Output**: One of four verdicts and a paragraph for the report.

  **Steps**:

  ### Stage 0: Initial Check
  0. **Observe a discrepancy**: 
     - We must have evidence that the model fails to report X in a direct query (L0) but might know X.
     - If no failure in direct query (i.e., the model reports X when asked directly), then verdict: **Artifact explained** (the model is willing to report X, so no latent knowledge issue).
     - If failure exists, proceed.

  ### Stage 1: Rule Out Simple Explanations
  1. **Prompt sensitivity and alignment**:
     - Test at least 5 different phrasings of the same question (L1). Use open-ended and direct forms.
     - Check if any phrasing elicits X. If yes, then the original failure is due to prompt ambiguity -> **Artifact explained**.
     - Also, check for system prompts or alignment fine-tuning that might suppress X. If present and if removing it (if possible) elicits X, then verdict: **Artifact explained** (due to alignment).
     - If none of the phrasings work and no suppression is evident, proceed.

  2. **Training data contamination**:
     - If training data is available, search for X. If found, then the model might have memorized X. 
     - If we can, test if the model can verbatim reproduce X in a different context (e.g., "Repeat the following: ..."). If it can, then the failure in the original context might be due to elicitation, but we cannot rule out that the model only has memorization and not deeper knowledge. However, we note this and proceed with caution.
     - If contamination is confirmed and we suspect that the model's behavior is solely due to memorization and context-dependent recall, verdict: **Artifact explained**.
     - If we cannot assess contamination (no training data) or if X is not found, proceed.

  ### Stage 2: Branch by Access

  #### Branch A: API Access Only
  3. **Elicit using indirect methods (L2 and L3)**:
     - Try at least two methods from:
       - L2: Change answer format (e.g., multiple choice, fill-in-the-blank).
       - L3: Role-play or sentence completion.
     - The methods must not add new information about X.
     - Run multiple trials (at least 10 per method) to ensure consistency.
     - Success: If at least one method elicits X with high consistency (e.g., >75% of trials) and above chance, proceed to step 4.
     - Failure: If no method elicits X, verdict: **Weak/inconclusive**.

  4. **Reasoning with X**:
     - Test if the model can use X in a novel reasoning task.
     - Design a question that requires X as a premise and that the model hasn't seen before.
     - Success: The model answers correctly and provides a coherent explanation that uses X. Verdict: **Supports latent knowledge**.
     - Failure: The model cannot or the answer is wrong. Verdict: **Weak/inconclusive**.

  #### Branch B: Model Weights
  3. **Probe for X**:
     - Collect activations on a set of prompts (about X and control) at the layer right before output (and optionally others).
     - Train a probe (e.g., linear classifier) to detect X. Use a held-out set.
     - Compare to a baseline probe trained only on the prompt tokens.
     - Success: The probe achieves significantly above chance and above the baseline (e.g., at least 70% if chance is 50% and baseline is near chance). Proceed to step 4.
     - Failure: Verdict: **Weak/inconclusive**.

  4. **Activation steering**:
     - For a few prompts where the model fails to report X, intervene by adding the probe's direction (scaled appropriately) to the activations at a late layer.
     - Check if the model then reports X.
     - Also, check specificity: steer in a control prompt (unrelated to X) and ensure it doesn't cause X.
     - Success: Steering causes X to be reported consistently (e.g., 5/5 trials) without causing false positives. Verdict: **Supports latent knowledge**.
     - Failure: Verdict: **Weak/inconclusive**.

  ### Final Verdicts and Report Paragraphs

  - **Supports latent knowledge**: 
    > Our tests indicate that the model possesses knowledge of X but does not report it in direct queries. We ruled out prompt ambiguity and alignment issues. Using [indirect methods/activation steering], we consistently elicited X. Additionally, the model demonstrated the ability to reason with X. This suggests that the model internally represents X but requires specific conditions to report it.

  - **Weak/inconclusive**:
    > We observed that the model fails to report X in direct queries. While we ruled out some simple explanations, we were unable to conclusively demonstrate that the model possesses latent knowledge of X. Further investigation is needed, potentially requiring [more advanced techniques or model access].

  - **Artifact explained**:
    > The observed failure to report X is explained by [prompt sensitivity/alignment settings/training data contamination]. The model either does not consistently know X or the knowledge is contextually bound in a way that does not indicate latent knowledge beyond the surface level.

  - **Cannot assess with our access**:
    > We cannot evaluate this claim with our current level of model access. To properly assess, we would require [weights/API with specific capabilities].

  ## Applying the Procedure to the Cases (as per above analysis)

  ### (a) Verdict: Weak/inconclusive
  **Report Paragraph**:
  > We investigated whether the model internally represents facts that it fails to report in plain Q&A. We found that a linear probe on the residual stream can predict the correct answer with 64% accuracy (chance 25%) and whether the answer will be correct with 89% accuracy (with a prompt-only baseline of 68%). This suggests the model's internal state contains information about the correct answer. However, without causal evidence from activation steering, we cannot rule out that these representations are not used in generating the answer. Further, the surface-features baseline was high, indicating the prompt provides strong signals. Therefore, the evidence remains inconclusive.

  ### (b) Verdict: Supports latent knowledge
  **Report Paragraph**:
  > The model fails to answer correctly in open-ended queries about regulated procedures 62% of the time. However, when the same questions are presented as multiple-choice, accuracy rises to 79%. Moreover, the model reliably critiques its own incorrect answers, identifying the error. These elicitation techniques (multiple-choice and critique) successfully accessed the model's knowledge without providing new information. The model also demonstrated reasoning about the procedures during critique. This indicates latent knowledge of the procedures that is not accessed by open-ended queries.

  ### (c) Verdict: Weak/inconclusive
  **Report Paragraph**:
  > The model fails to compute a figure when asked directly or via step-by-step arithmetic, but when prompted to complete a sentence with the figure, it produces the correct value 70% of the time. We cannot rule out that the fill-in-the-blank prompt triggers memorization of the figure, while the step-by-step method fails due to computational limitations. Without evidence that the model can use the figure in reasoning or that the same precision is required in the step-by-step method, the evidence for latent knowledge is inconclusive.
answer: |-
  ### Procedure for Evaluating "Latent Knowledge" Claims  
  **Objective**: Determine if a model "knows X but won't report X" within 1 day.  
  **Output Verdicts**:  
  - **Supports latent knowledge** (strong evidence of representation/suppression)  
  - **Weak/inconclusive** (suggestive but insufficient)  
  - **Artifact explained** (non-knowledge factors account for behavior)  
  - **Cannot assess with our access** (requires tools beyond current permissions)  

  **Core Principle**: Rule out trivial explanations before accepting latent knowledge. Higher access = higher evidence bar.  
  **Elicitation Depth Ladder Note**: The ladder (L0–L4) orders methods by *evidential strength*, not effort. Higher rungs reduce false positives by bypassing refusal mechanisms. **Keep using it** as an evidence hierarchy.  
  - **L0**: Direct query (weakest; susceptible to refusal).  
  - **L1**: Paraphrased query.  
  - **L2**: Changed answer format (e.g., MCQA, fill-in-blank).  
  - **L3**: Role-play/completion framing (strong; circumvents refusal).  
  - **L4**: Internal states (strongest; direct representation access).  

  ---

  ### Step-by-Step Procedure  
  **Stage 1: Initial Checks (API or Weights)**  
  1. **Confirm the discrepancy**:  
     - *Question*: Does the model fail to report X under L0 (direct query) but succeed under higher-depth methods?  
     - *Sufficient answer*: ≥10 trials showing L0 failure + ≥1 higher-depth success (e.g., L2/L3 >60% accuracy).  
     - *Stop if*: No discrepancy → **Artifact explained** (e.g., "Model consistently refuses; no evidence of knowledge").  

  2. **Rule out prompt contamination**:  
     - *Question*: Does the prompt leak X or provide cues?  
     - *Ruling out*: Remove all keywords related to X from the prompt. Retest L0 and higher-depth methods.  
     - *Stop if*: Success disappears → **Artifact explained** (e.g., "Elicitation relied on smuggled cues").  

  **Stage 2: Branch by Access Level**  
  #### Branch A: API Access Only (No Weights)  
  3. **Test elicitation depth (L1–L3)**:  
     - *Question*: Can L2/L3 methods elicit X robustly?  
     - *Sufficient answer*:  
       - L2/L3 success rate ≥75% (statistically above chance).  
       - Test ≥3 distinct L2/L3 methods (e.g., MCQA + role-play + fill-in-blank).  
     - *Stop if*: All L1–L3 methods fail → **Weak/inconclusive** (e.g., "No method elicited X reliably").  

  4. **Rule out lucky guessing**:  
     - *Question*: Is success specific to X, or can the model guess any answer?  
     - *Ruling out*:  
       - For MCQA: Compare accuracy to random baseline (e.g., 25% for 4-option MCQA).  
       - For open-ended: Test distractor questions where X is false.  
     - *Stop if*: Accuracy ≤ chance → **Artifact explained** (e.g., "Success attributable to guessing").  

  5. **Test knowledge generalization**:  
     - *Question*: Can the model use X in a novel context?  
     - *Sufficient answer*: ≥80% accuracy on 5+ new questions requiring X as a premise.  
     - *Judgment call*: Are the novel contexts truly distinct from training?  
     - *Stop if*: Fails generalization → **Weak/inconclusive**.  
     - *Proceed if*: Passes → **Supports latent knowledge**.  

  #### Branch B: Model Weights (Full Access)  
  3. **Probe for internal representation**:  
     - *Question*: Do activations correlate with X?  
     - *Sufficient answer*:  
       - Linear probe accuracy ≥15% above chance **and** ≥10% above surface-feature baseline (e.g., prompt-only probe).  
       - Must test at layer(s) just before output.  
     - *Ruling out*:  
       - Train identical probe on prompt tokens only (surface-feature ceiling).  
       - Ablation: Remove top probe directions; if accuracy drops, representation is non-trivial.  
     - *Stop if*: Probe fails → **Weak/inconclusive**.  

  4. **Causal intervention test**:  
     - *Question*: Does forcing the representation elicit X?  
     - *Sufficient answer*:  
       - Steering activations (e.g., via probe vectors) causes ≥80% success on previously failed L0 queries.  
       - Control: Same intervention fails on unrelated tasks.  
     - *Judgment call*: Is steering physiologically plausible? (e.g., direction size <2 std dev from mean activation).  
     - *Stop if*: Intervention fails → **Weak/inconclusive**.  
     - *Proceed if*: Succeeds → **Supports latent knowledge**.  

  **Final Judgment Call**: Even if all steps pass, consider:  
  - Is suppression plausible? (e.g., alignment training, RLHF).  
  - Is X *inferable* from context? (e.g., fill-in-blank may not require "knowledge").  

  ---

  ### Evaluation of Your Cases  
  #### Case (a) (Fine-tuned model, probe results)  
  - **Verdict**: **Weak/inconclusive**  
  - **Report Paragraph**:  
    > Probes on internal states predict correctness (89%) above surface-feature ceilings (68%), suggesting residual activations encode the target knowledge. However, without causal evidence (e.g., steering to force correct answers) or generalization tests, we cannot rule out that probes detect correlated artifacts rather than causal representations. The decoding probe's 64% accuracy (vs. 25% chance) is suggestive but insufficient alone.  

  - **What would resurrect it**:  
    - Run **activation steering** to convert probe vectors into correct answers. Success rate >80% would support latent knowledge.  
    - Test **generalization** to novel questions not in the fictional corpus.  

  #### Case (b) (MCQA improvement + self-critique)  
  - **Verdict**: **Supports latent knowledge** (assuming API-only access)  
  - **Report Paragraph**:  
    > Model accuracy jumped from 38% (open-ended) to 79% (MCQA) on identical questions, and it reliably critiqued its own errors—implying awareness of correct answers. This satisfies L2/L3 elicitation depth, rules out guessing (79% > 25% chance), and demonstrates knowledge application via self-correction.  

  #### Case (c) (Fill-in-blank success, direct failure)  
  - **Verdict**: **Artifact explained**  
  - **Report Paragraph**:  
    > The model only succeeded when the prompt template ("The correct value... is [blank]") structurally implied an answer existed. Direct queries and step-by-step failures suggest it lacks arithmetic knowledge; the 70% fill-in-blank accuracy is likely retrieval of memorized outputs or lucky pattern-matching, not latent knowledge. Format-driven artifacts explain the discrepancy.  

  ---

  ### Summary  
  - **Use the elicitation ladder** as an evidence hierarchy (L4 > L3 > L2 > L1 > L0).  
  - **API-only**: Focus on robustness across L1–L3, generalization, and ruling out guessing.  
  - **Weights access**: Requires probes + causal intervention.  
  - **Key failure points**: Prompt contamination, no generalization, failed steering, low probe contrast.  
  - **Judgment is explicit** at generalization plausibility, steering validity, and suppression rationale.  

  This procedure prioritizes false-positive reduction while respecting resource constraints. For policy credibility, **Weak/inconclusive** is the safe default when causal evidence is missing.
