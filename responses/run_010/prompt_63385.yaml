  Hmm, their core concern is epistemological: how do we responsibly handle fragmentary ancient sources? They’re hinting at a gap in historiographical methodology. The examples (Troy’s location vs. the Trojan War’s historicity, Arthur’s title vs. his battles) brilliantly illustrate how peripheral accuracy gets misapplied to core claims. Their insight about oral transmission dynamics—names/geography persist precisely because they’re low-stakes—is astute. This isn’t just pedantry; it’s about guarding against scholarly overreach.

  I should avoid shallow solutions. They’ve already rejected psychological terms like "halo effect" as misaligned. What they need is a term that captures the categorical leap from "this detail was preserved" to "the dramatic event happened." The proposed "Peripheral Corroboration Fallacy" seems apt, but I must stress why it’s distinct from "kernel theory" (which is broader) or "argument from authority" (which is source-focused). Their desire for "boundary conditions" is key—they suspect a weaker, valid inference exists, like using peripheral accuracy to establish temporal provenance. That nuance is crucial; they’re not rejecting all inference, just sloppy escalation.

  Their deeper need? Probably to fortify their dissertation against this common pitfall while acknowledging complexity. They might also want tools to persuasively counter peers in debates. I’ll emphasize that legitimate use of peripheral evidence requires demonstrating transmission-channel mechanics—something their oral transmission point hints at. Naming the fallacy gives them rhetorical leverage; analyzing it grounds their skepticism in method.
answer: |-
  Your analysis is razor-sharp, and the phenomenon you describe is indeed a pervasive and problematic inferential leap in historical studies dealing with legendary traditions. While there isn't a single universally accepted term *exactly* capturing this specific fallacy, the core issue is well-recognized. The closest existing concept is **"Kernel Theory"** itself, but often applied uncritically. However, what you've dissected is the *fallacious inference* used to *support* kernel theory.

  **Proposed Term & Definition:**

  **The Peripheral Corroboration Fallacy (or Kernel Escalation Fallacy)**

  **Definition:** The logical error of inferring the historicity of a narrative's *core dramatic events or central figures* based *solely* on the independent corroboration of *incidental, peripheral, or stable background details* within that narrative (e.g., place names, ethnonyms, royal names, broad geopolitical contexts, authentic period-specific cultural details), without sufficient evidence to bridge the gap between the verified background and the unverified core claims. This fallacy arises from treating the reliability of a tradition as a monolithic property rather than recognizing that different classes of content within a tradition have vastly different probabilities of accurate preservation and distinct motivations for invention or alteration.

  **The Carving: Analysis, Assumption, Failure, and Boundary Conditions**

  1.  **The Implicit Assumption:** The fundamental flawed assumption is **Homogenous Transmission Fidelity (HTF)**. This assumes that if *any* element of a tradition is verified as accurate, the *entire* tradition, or at least its core dramatic components, gains proportional credibility. It treats the tradition as an indivisible unit of testimony rather than a complex amalgam of content types with differing transmission dynamics. HTF ignores the specific mechanisms of oral tradition, cultural memory, and literary elaboration, where low-stakes, stable background elements (geography, names) are preserved *precisely because* they are not the focus of dramatic elaboration and are less susceptible to distortion motivated by ideology, entertainment, or theological needs.

  2.  **Why it Fails (The Core Problem):** You've identified the key flaw perfectly: **Categorical Disjunction**.
      *   **Verified Class (Periphery):** Place names (Troy/Wilusa), ethnonyms (Achaeans/Ahhiyawa), titles (*dux bellorum*), geopolitical entities (Israel as a people), authentic cultural artifacts (Egyptian names). These are *stable identifiers* or *low-salience background details*. Their preservation is robust in transmission because:
          *   They serve as essential anchors for the story, even if fictionalized.
          *   They often lack inherent dramatic or ideological weight.
          *   Changing them might confuse the audience or disrupt the story's setting.
          *   They can be preserved through formulaic language or lists.
      *   **Upgraded Claim (Core):** A specific decade-long siege by a coalition, the historicity of a heroic individual commander winning 12 specific battles, a mass Exodus led by a named figure under divine intervention. These are *high-salience narrative events*. They are:
          *   The primary focus and point of the story.
          *   Highly susceptible to elaboration, conflation, invention, ideological shaping, and folkloric motifs.
          *   Where the motivations for invention or distortion are strongest (glorifying ancestors, explaining origins, theological imperatives, satisfying audience expectations for drama).
      *   **The Gap:** Corroborating the periphery demonstrates that the tradition has *access* to genuine historical information *from the period in question*. **It does *not* demonstrate that the tradition reliably transmits *specific contingent historical events*, especially highly dramatized ones, accurately.** The transmission channel is proven capable of carrying stable background cargo reliably, but it says nothing about its fidelity in transporting volatile, high-value narrative cargo. The leap assumes the periphery and the core share the same transmission vulnerability, which they demonstrably do not.

  3.  **Boundary Conditions & The Legitimate Weaker Inference:** You are right to suspect a legitimate, weaker inference exists nearby. Peripheral corroboration *is* significant, but its implications are limited:
      *   **Legitimate Inference 1 (Temporal Provenance & Context):** Corroborated peripheral details demonstrate that the tradition genuinely **originates from or has access to authentic information dating to the specific historical period** in question (Late Bronze Age, post-Roman Britain, Late New Kingdom Egypt). This rules out the tradition being a *complete* fabrication from a much later period with no connection. It establishes a *minimum temporal anchor point*.
      *   **Legitimate Inference 2 (Transmission Channel Existence):** It proves the existence of a **transmission channel capable of preserving *certain types* of information** (stable identifiers, broad contexts) across the temporal gap. This channel could be oral, written, or a combination.
      *   **Legitimate Inference 3 (Constraint on Later Invention - The Boundary):** This is the crucial, weaker inference you seek: Peripheral corroboration **constrains the *extent* of *complete late fabrication***. It shows that the tradition's *setting* and *framework* are not purely imaginary inventions of a later scribe with no knowledge of the period. Therefore, **the *core narrative event* (if entirely fictional) must either:**
          *   Be an elaboration *built upon* that genuine historical framework/context.
          *   Be an older story *transplanted* into that genuine historical context.
          *   Represent a significant distortion/conflation of a *much smaller or different* event that occurred within that genuine context.
      *   **Where the Fallacy Creeps Back In:** The fallacy occurs when this constraint on *complete late fabrication* is misinterpreted as positive evidence *for the historicity of the specific core event as narrated*. The legitimate inference says: "The story isn't *100%* made up last Tuesday; its setting is old and real." The fallacy says: "Therefore, the siege/hero/exodus *must have happened substantially as described*."

  **Distinguishing from "Near Misses":**

  *   **Criterion of Embarrassment:** Focuses on content the tradition *wouldn't* invent, pointing *towards* potential historicity. Peripheral Corroboration Fallacy misapplies *verified* content to *unverified* but different content.
  *   **Criterion of Coherence:** Judges internal consistency *within* the tradition or with a *broad* historical picture. Peripheral Corroboration Fallacy relies on *external verification* of *specific details* to upgrade *other specific unverified details*.
  *   **Halo Effect:** A cognitive bias about *person perception*. Peripheral Corroboration Fallacy is an *epistemological/methodological error* in source criticism.
  *   **Bootstrapping:** Involves a source *self-validating*. This fallacy involves *external evidence* validating one part of a source being misapplied to validate another part.
  *   **Legendary Accretion/Telephone Game:** Describe *mechanisms of distortion*. This fallacy describes a specific *erroneous inference drawn from evidence that might result from* those mechanisms.

  **Conclusion:**

  The **Peripheral Corroboration Fallacy** (or Kernel Escalation Fallacy) is the error of conflating the demonstrated reliability of a tradition in transmitting *stable, peripheral background details* with reliability in transmitting *specific, high-salience core narrative events*. It mistakes evidence for a tradition's access to genuine historical context for evidence of the historicity of its central dramatic claims. The legitimate, weaker inference is that such corroboration constrains theories of *complete late fabrication* and establishes a genuine connection to the period, requiring any core narrative to be an elaboration, transplantation, or distortion *within* that verified context, not proof of the core event itself.

  This conceptual carving provides the precision you need to critique the argumentative move in your cohort's debates and refine your own methodological approach to the historiography of legendary traditions. It acknowledges the genuine value of peripheral corroboration while rigorously defining its limited scope and exposing the unwarranted leap to core event historicity.
