prompt: |-
  Trying to pin down when it's OK to just take somebody's word on a moral question, and my intuitions are a mess. Here they are, roughly in the order I thought of them.

  1. My sister-in-law is a philosophy prof who works on this exact stuff. I ask her about putting my dog under anesthesia for a procedure that's mostly for my convenience, she says it's wrong, doesn't elaborate, and I decide not to do it. Fine. She knows more than me about this.
  2. Same sister-in-law, same question, but she walks me through why — the dog suffers, the benefit to me is trivial, there's an alternative. Now I see it myself. Also fine, and obviously better, but I don't think #1 was bad in any way that #2 fixes.
  3. A coworker who's read everything on labor law tells me our overtime practice is illegal, and I go to HR on the strength of that. No weirdness at all. That's just what testimony is for.
  4. A friend tells me a mutual acquaintance's behavior at a party was sexist, gives no reasons, and I start treating the guy differently. I feel bad about this one in a way I didn't feel bad about #1, and I can't locate why. She's not an expert, sure, but the thing that bugs me is that I wouldn't have felt better if she WERE one. If my sister-in-law had told me the same thing about the same guy, I'd still feel the same twinge. So expertise doesn't seem to be the variable.

  Those two — 1 and 4 — look structurally identical to me and I have opposite feelings about them. That's the main thing I want explained.

  5. When I was nine I did what my parents said was right without asking why, and I think that was the correct posture, better than a kid trying to reason it all out. But an adult doing the same thing about a serious question looks like a failure of some kind. Same structure, flipped verdict.
  6. A surgeon unsure whether to proceed asks the hospital ethics committee and does what they recommend: fine. The same surgeon ignoring the committee and going with her own judgment after a night of thinking: also fine, maybe even more admirable. I can't get both of those out of one principle and I'd like to.
  7. The guy who donates a kidney because a mentor he trusts told him it was the right thing gets less credit in my eyes than the guy who donates because he sees the need. But also I'd much rather have the kidney than the credit-adjustment, and I'm not sure what that says about me.
  8. Purely factual stuff — is this bridge sound, did that study replicate, what's the actual mortality number — I defer constantly and think that's just being rational, zero compunctions. My guess going in was that the whole problem is that moral testimony is about wrongness itself rather than about the facts, and factual testimony is unproblematic. But 4 kind of kills that, since the party story is a factual-ish claim about what he did plus a normative gloss, and I'd feel weird about deferring on either half.
  9. If some bot turned out to be demonstrably more reliable than me on hard cases I'd take its verdict over mine. But if it told me something I suspect is wrong about my own conduct was actually fine, the relief I'd feel seems like the wrong kind of relief.

  So: is there a principle that captures most of this, or a small set of candidates? State them precisely and tell me what each clause is buying you. Then run it on cases I haven't listed — a judge following a legal advisor's recommendation on sentencing, me asking a friend whether it's OK to lie to my mom about her cooking, a doctor in a country whose medical norms differ from hers going along with local practice, someone accepting a priest's word on a question the priest is admittedly not an expert in. And be straight with me about which of my verdicts it can't save, because I'm fairly sure at least one of 5 or 6 has to go. Bonus question: is the pure/impure distinction (they just tell me it's wrong vs. they give me the reasons) actually doing the work I assumed it was in 1 vs 2, or is something else going on there?
reasoning: |-
  Okay, let's tackle this user's moral testimony dilemma. They've presented nine scenarios where they defer to others on moral questions, but their intuitions conflict. The main puzzle is why they feel fine deferring to their philosopher sister-in-law about the dog (#1) but uneasy accepting a friend's claim about sexist behavior (#4), even if the sister-in-law said the same thing. 

  First, I need to identify patterns. The user clearly values understanding reasons when possible (#2), but also accepts legitimate authority in #1 and #3. The discomfort in #4 stands out—why? Maybe because moral judgments about interpersonal behavior require personal engagement; deferring feels like outsourcing responsibility. That resonates with the "moral maturity" concept where adults should form their own judgments.

  Looking at #5, kids obeying parents is fine, but adults doing the same seems lazy. That suggests a developmental expectation. For #6, both trusting an ethics committee and independent judgment seem valid—so perhaps context matters, like whether it's a standardized dilemma or a unique situation. 

  The kidney donation case (#7) shows that motivation affects moral credit. Deferring reduces perceived virtue, but the user notes the practical benefit—highlighting a tension between moral psychology and real-world outcomes. 

  Factual testimony (#8) is straightforward, but moral testimony gets messy when it blends facts and norms. The party case (#4) is problematic precisely because the normative label ("sexist") requires personal interpretation, not just facts. 

  The bot scenario (#9) reveals that even reliable external validation feels unsatisfying for personal conduct—we crave internal conviction. 

  Key principles emerge: Authority legitimacy (expertise), domain (personal vs. general), moral maturity, and the value of understanding. Applying these to test cases: A judge deferring to a legal advisor is fine (expertise), but lying about mom's cooking based on a friend's advice feels off (personal domain). A doctor following local norms is acceptable for social coordination, but not if it violates core ethics. A priest's non-expert moral advice might be accepted based on role-based trust, but skeptically. 

  The pure/impure distinction (#1 vs. #2) isn't the core issue. In #1, the sister-in-law's expertise justifies deference even without reasons. In #4, the friend's judgment isn't expert, but more importantly, labeling behavior as sexist demands personal engagement—outsourcing feels like a failure of moral responsibility. 

  Inconsistencies: #5 (child obedience) and #6 (surgeon's choice) can coexist. Kids lack capacity; adults should reason independently unless facing standardized dilemmas (e.g., ethics committees). The surgeon can validly choose either path because committee guidance handles systemic issues, while personal judgment addresses contextual nuances. 

  Ultimately, the user's unease in #4 stems from the personal stakes and the expectation to form their own moral responses in interpersonal matters—not just the lack of expertise. The principle holds: Deference is legitimate when based on authority/role for general or specialized domains, but suspect in personal, relational contexts where moral understanding is intrinsically valuable.
answer: |-
  Here's a principle that captures most of your intuitions, followed by a breakdown, test cases, and reckoning with inconsistencies:

  **The Principle of Responsible Moral Deference:**
  *Deferring to another agent's moral judgment is permissible (and sometimes required) when:*
  1.  **The agent has legitimate authority/expertise** in the relevant domain *OR* occupies a role/social position that justifies deference (e.g., parent, judge, committee member within their mandate).
  2.  **The deferrer lacks the capacity, access, or standing** to make a reliable independent judgment (due to lack of expertise, information, time, objectivity, or developmental stage).
  3.  **The nature of the judgment doesn't intrinsically require first-personal understanding** (i.e., it's not deeply personal, relational, or identity-constitutive in a way that bypassing understanding undermines moral agency).
  4.  **The deferral serves a morally significant purpose beyond mere convenience** (e.g., upholding legitimate authority, coordinating action, accessing specialized knowledge, fulfilling a role-based duty).

  **What each clause buys you:**

  *   **Clause 1 (Authority/Role):** Justifies #1 (philosopher SIL on animal ethics), #3 (coworker on labor law), #5 (child to parent), #6 (surgeon to ethics committee), #8 (factual expertise). Explains why expertise matters in #1/#3 but not enough in #4.
  *   **Clause 2 (Lack of Capacity/Standing):** Justifies #1 (you lack expertise), #3 (you lack legal expertise), #5 (child lacks capacity), #8 (you lack technical knowledge), surgeon to committee (complexity/time). Explains why adult blind obedience (#5) fails.
  *   **Clause 3 (Not Intrinsically First-Personal):** Explains the core discomfort in #4 (labeling behavior as sexist *towards you/your social group* requires personal engagement), #7 (kidney donation motive reflects character), #9 (relief on personal conduct feels "wrong"). Explains why #1 (dog anesthesia) feels different - it's a generalizable welfare judgment, not a deeply personal relational one. Explains why #2 is "better" - understanding always enhances agency, but *bypassing* it is only problematic when the judgment *itself* demands personal comprehension.
  *   **Clause 4 (Significant Purpose):** Distinguishes legitimate deference (#1 avoiding harm, #3 upholding justice, #5 child development, #6 institutional integrity) from potentially lazy or irresponsible deference (#4 avoiding the work of moral discernment in relationships, #7 outsourcing character formation).

  **Running the Principle on Your Cases:**

  1.  **Dog Anesthesia (SIL, no reasons):** **Permissible.** (1) SIL has legitimate expertise in ethics. (2) You lack her specialized knowledge. (3) The judgment (animal suffering vs. convenience) is generalizable, not deeply personal/relational *in a way that requires your own derivation*. (4) Purpose: Avoiding potential harm.
  2.  **Dog Anesthesia (SIL, with reasons):** **Better.** Satisfies all 4 clauses *and* enhances understanding, fulfilling the ideal of moral agency where possible.
  3.  **Overtime Practice:** **Permissible.** (1) Coworker has legitimate expertise (knowledge of labor law). (2) You lack that knowledge. (3) Judgment is factual/legal (does X violate statute Y?), not intrinsically first-personal. (4) Purpose: Upholding justice/law, protecting rights.
  4.  **Party Behavior (Sexist):** **Problematic.** (1) Friend lacks clear expertise/role-based authority *on this specific judgment in your context*. (2) You *may* have capacity/standing to judge (you were there/socially aware). (3) **Crucially:** Labeling behavior as "sexist" *towards a mutual acquaintance in your social circle* is deeply relational and potentially identity-constitutive; deferring without understanding undermines authentic moral response and relationship management. (4) Purpose? Convenience/avoiding discomfort? Not clearly significant. *This is why SIL being an expert wouldn't fully fix it* - the *nature* of the judgment (relational, identity-laden) clashes with Clause 3.
  5.  **Child Obedience:** **Permissible (then).** (1) Parents have legitimate role-based authority. (2) Child lacks cognitive/emotional capacity for full independent judgment. (3) Judgment *can* be pedagogical, preparing for future understanding. (4) Purpose: Development, safety, socialization. **Adult Blind Obedience: Impermissible.** Fails (2) - adult has capacity/standing. Fails (4) - lacks sufficient purpose beyond convenience/abdication.
  6.  **Surgeon & Ethics Committee:** **Both Permissible.**
      *   *Follows Committee:* (1) Committee has legitimate institutional authority/expertise. (2) Complex case, surgeon may lack objectivity/time. (3) Standardized bioethical dilemmas aren't usually *intrinsically* first-personal to the surgeon. (4) Purpose: Institutional consistency, accessing diverse expertise, mitigating liability.
      *   *Ignores Committee:* (1) Surgeon *is* an expert themselves. (2) After reflection, they may feel they *do* have sufficient capacity/standing/judgment *in this specific case*. (3) The judgment *might* feel intensely personal/responsibility-laden for the surgeon (touching on Clause 3). (4) Purpose: Acting on deep conviction, taking full responsibility. *The principle allows both paths based on the surgeon's assessment of their own capacity (2), the nature of their responsibility (3), and the purpose served (4).*
  7.  **Kidney Donation (Mentor vs. Own Reason):** **Both Permissible, but different credit.** Deferring to Mentor: (1) Mentor *might* have authority (if wise/ethical). (2) Donor might lack full understanding of implications. (3) **But:** A major life-altering act like organ donation *intrinsically benefits* from first-personal understanding (Clause 3); outsourcing the *why* diminishes the act's characterological virtue (though not its material good). Acting on Own Reason: Satisfies Clause 3 fully, demonstrating deeper moral commitment. *Your desire for the kidney over credit reflects recognizing the act's material good outweighs the motive's purity in that context.*
  8.  **Factual Testimony:** **Permissible.** (1) Source has expertise. (2) You lack expertise/time/etc. (3) Facts are not intrinsically first-personal requiring *your* derivation (knowing the bridge load limit isn't a moral insight). (4) Purpose: Efficiency, accuracy, safety. *The party case (#4) fails because the "normative gloss" (sexist) is inseparable from the relational judgment triggering Clause 3, unlike pure facts.*
  9.  **Moral Bot (Hard Cases vs. Own Conduct):**
      *   *Hard Cases:* **Permissible.** (1) Bot demonstrably reliable (authority). (2) You lack its capacity. (3) Abstract hard cases may not be intrinsically tied to your identity. (4) Purpose: Better outcomes.
      *   *Own Conduct:* **Problematic Relief.** (1) Bot reliable. (2) You *might* lack objectivity. (3) **BUT:** Judgment about *your own* conduct is *paradigmatically* first-personal and identity-constitutive (Clause 3). Relief based *only* on external validation bypasses the self-understanding and growth intrinsic to moral agency for personal acts. The relief feels "wrong" because it stems from dodging the personal moral work.

  **Test Cases:**

  1.  **Judge following Legal Advisor on Sentencing:** **Permissible.** (1) Advisor has legal expertise. (2) Sentencing involves complex legal factors/jurisprudence judge may not master fully. (3) Sentencing, while weighty, is a role-based application of law/precedent, not primarily the judge's *personal* moral expression (though discretion exists). (4) Purpose: Correct application of law, consistency.
  2.  **Asking Friend: Lie to Mom about Cooking?** **Ambiguous, leaning problematic.** (1) Friend may lack clear authority. (2) You likely have capacity to judge this relational nuance. (3) **Crucially:** Honesty with a parent *is* deeply relational and personal (Clause 3). Deferring risks outsourcing a core relational duty. (4) Purpose? Seeking perspective is fine, but *blind deference* ("Is it OK?") clashes with Clause 3. Better to seek advice/reasons, then judge yourself.
  3.  **Doctor Following Differing Local Norms:** **Context-Dependent.** (1) Local practice may represent legitimate local expertise/consensus *or* be unethical. (2) Doctor may lack deep understanding of local context/values. (3) Core medical ethics principles *might* be non-negotiable (intrinsically requiring adherence). (4) Purpose: Patient welfare, respecting local context *if ethical*. *Permissible* if local norms are ethically sound adaptations (e.g., family disclosure practices). *Impermissible* if norms violate core ethics (e.g., discrimination, harmful rituals). Requires the doctor's *independent judgment* (Clause 2 capacity *should* be used here) informed by understanding (Clause 3).
  4.  **Accepting Priest's Word on Non-Expert Moral Question:** **Problematic.** (1) Priest lacks relevant expertise (by assumption). (2) You likely have similar capacity to reason. (3) Unless it's core religious doctrine *you* subscribe to, the judgment likely doesn't intrinsically require priestly mediation. (4) Purpose? Convenience? Avoiding thought? Not significant. This resembles #4 - outsourcing a judgment you should make yourself.

  **Inconsistencies & Which Verdicts Must Go:**

  *   **#5 (Child/Adult) Saved:** Principle clearly distinguishes based on capacity (Clause 2).
  *   **#6 (Surgeon) Saved:** Principle accommodates both paths based on the surgeon's assessment of their capacity (2), the nature of their responsibility (3), and the purpose served (4). Both can be admirable depending on context.
  *   **The Tension:** Your intuition that #1 is fine without reasons but #4 is problematic *even with an expert* is **largely saved** by Clause 3. The dog's welfare is a general moral question where deference based on expertise is appropriate. Labeling a specific person's behavior as sexist *to you/your social group* is relational and personal; deferring on *that specific judgment* feels like an abdication of your role in navigating social relationships and forming your own responses, regardless of the source's expertise. The SIL's expertise might make you *more likely to believe it's true*, but it doesn't resolve the *unease* about *how* you come to hold that belief in this context. The core issue is the *nature of the judgment*, not the purity of the testimony.
  *   **#7 (Kidney Credit):** Principle explains the credit difference (Clause 3) but agrees both acts are permissible. Your desire for the kidney reflects prioritizing consequence over motive character, which is pragmatic.
  *   **#9 (Bot Relief):** Principle explains the "wrong kind of relief" via Clause 3.

  **The Pure/Impure Distinction (#1 vs. #2):**

  You were right to question this. While #2 (with reasons) is *epistemically and morally better* (fosters understanding, agency), **it's not the core differentiator for permissibility in your cases.** The principle shows why #1 (pure testimony) was *permissible* for the dog case (due to expertise + nature of judgment) but wouldn't resolve the unease in #4 (due to nature of judgment). The "impure" testimony (reasons) in #2 enhances agency but doesn't change the *structural permissibility* established by the four clauses in #1. The key work in distinguishing #1 and #4 is done by **Clause 3 (Nature of Judgment)** and **Clause 1 (Authority/Legitimacy)** interacting differently in those contexts.

  **Conclusion:** Your intuitions largely map onto a principle emphasizing **legitimate sources, personal capacity, the intrinsic demands of the moral domain involved, and the purpose of deference.** The main friction comes from cases involving **interpersonal, relational, or identity-constitutive judgments** (like #4, #7 motive, #9 own conduct), where deference feels like a failure of moral engagement, regardless of the source's reliability. This principle captures that tension and explains most of your varied reactions.
