prompt: |-
  I'm prepping a session for my applied ethics seminar and I want to work through a puzzle about a practice instead of arguing from principles, so: help me get the practice straight first.

  Here's what I'm pointing at. If you want to adopt, the state vetts you — home study, background checks, income and housing requirements, references, and it can just say no. If you want to have a child of your own, nobody asks you anything at all, and the state's only involvement comes afterwards, with a notoriously low bar for "good enough" parenting. There's a related pattern in tort that seems to point the same way: in most US jurisdictions a parent can sometimes recover over a birth they weren't warned about, while the child almost never gets a claim on the ground that being born was worse for it than never existing.

  What theory of value does that bundle presuppose? Reconstruct the implicit view as carefully as you can, and then sort it for me: which parts does the practice strictly require, versus which is it merely consistent with — because I suspect a lot of it is just the trivial fact that adoption has an identifiable child in it and procreation doesn't. Does the practice commit us to something like the familiar asymmetry between preventing suffering and conferring happiness, or only to the weaker claim that you can't owe anything to the merely possible? Tell me where it's underdetermined, i.e. which rival views would license exactly the same screening regime. And finish with whether the two halves actually cohere, and what family law would have to look like if we took the screening side seriously.
reasoning: |-
  Okay, the user is prepping for an applied ethics seminar and wants to focus on a practice puzzle rather than principles. They're pointing out the disparity between adoption vetting and procreation freedom, plus related tort patterns. They need a careful reconstruction of the implicit value theory behind this bundle of practices.

  First, I need to unpack the core puzzle: why does society impose strict screening on adoptive parents but none on biological ones? The tort law asymmetry they mentioned - where parents can sue for wrongful birth but children almost never succeed in wrongful life claims - seems connected. 

  Hmm, the key might be in the different relationships to the child. Adoption involves an existing child needing placement, while procreation creates a new life. That distinction probably drives the state's different approaches. For adoption, the state acts as guardian making an active placement decision with duty of care. For biological parents, the state only intervenes reactively after harm occurs.

  The value theory here seems to prioritize concrete harms over abstract benefits. The state screens adopters to prevent foreseeable harm to an identifiable child, but doesn't regulate procreation because: a) there's no specific child to protect yet, b) non-existence isn't considered comparable harm, and c) there are autonomy concerns about controlling reproduction.

  Interesting how this connects to population ethics. The practice suggests that while we have obligations to existing people, we don't owe anything to potential future people. That would explain why wrongful life claims fail - courts can't compare existence vs non-existence. But wrongful birth succeeds because it's about parents' autonomy interests in reproductive choice.

  The user asked where the practice is underdetermined. Well, multiple ethical frameworks could justify this regime: 
  - Strong anti-natalism (though actual practice isn't that extreme) 
  - Moderate views about special obligations to existing persons
  - Even some pro-natalist views if they emphasize bodily autonomy

  The coherence question is tricky. There's tension between the strict adoption standards and lax approach to biological parenting. If we took adoption logic seriously for all parenting, we'd need universal pre-birth assessments - but that would be hugely invasive and politically impossible. The current system persists because adoption is seen as discretionary while procreation is fundamental, and because the state has different roles (active vs reactive).

  For the seminar, I should highlight these pressure points: How can we justify different standards for equally vulnerable children? Is the distinction between existing/conceived vs potential children ethically robust? What does this reveal about our underlying valuation of life and suffering?
answer: |-
  Here's a careful reconstruction and analysis of the implicit value theory embedded in this practice bundle, designed for your applied ethics seminar:

  **Core Practice Bundle:**
  1. **Adoption:** Rigorous state pre-screening (home study, background checks, income/housing, references, veto power).
  2. **Procreation:** No pre-screening; state intervenes *only* reactively based on minimal "harm prevention" standards.
  3. **Tort Law:**
     - *Wrongful Birth:* Parents can recover for unwanted birth (e.g., failed sterilization/warning).
     - *Wrongful Life:* Child almost never recovers for being born into suffering.

  **Reconstructed Implicit Value Theory:**
  1. **Asymmetry of Obligations:** We have strong duties to *prevent harm* to **existing/pending persons** (adopted children), but weak/no duties to **prevent the existence** of potentially suffering persons (via procreation restrictions) or to **create benefits** for non-existent beings.
  2. **Person-Affecting Constraint:** Moral obligations require an identifiable subject who exists or will exist independently of the decision. We owe nothing to *merely possible* people.
      - *Adoption:* Child is already existent/pending → duties attach.
      - *Procreation:* Child doesn't exist at decision point → no duties to *it*.
  3. **Minimalist Harm Prevention:** The state's role in procreation is limited to preventing *extreme, demonstrable harm* to children *after they exist* (abuse/neglect thresholds). Creating suboptimal lives isn't actionable harm.
  4. **Procreative Liberty Priority:** Bodily autonomy and reproductive freedom outweigh potential future harms to non-existent beings. Restricting procreation is a grave intrusion.
  5. **Differential State Roles:**
     - *Adoption:* State acts as *legal guardian* making an active placement decision → fiduciary duty to child.
     - *Procreation:* State acts as *reactive protector* of born children → lower threshold for intervention.

  **Sorting Commitments vs. Consistency:**
  | **Component** | **Strictly Required** | **Merely Consistent** | **Notes** |
  |---------------|------------------------|------------------------|-----------|
  | **Person-Affecting Constraint** | ✓ Core commitment | | Practice collapses without distinction between existing vs. possible children |
  | **Asymmetry (Prevent Suffering > Confer Benefit)** | ✓ | | Screening prevents harm to adoptee; no duty to create happy biological children |
  | **Procreative Liberty** | | ✓ | Practice *protects* liberty but doesn't logically require its absolute priority |
  | **Minimal Harm Standard** | ✓ | | Implied by non-intervention in procreation + tort rejection of wrongful life claims |
  | **Non-Identity "Problem"** | | ✓ | Practice aligns with but doesn't require Parfit's non-identity logic |
  | **Anti-Natalism** | ✗ | | Practice permits procreation despite risks; not anti-natalist |

  **Underdetermined Elements (Rival Views Allowing Same Practice):**
  1. **Negative Utilitarianism Lite:** Focus on preventing suffering without requiring maximization of happiness justifies screening adoptees for safety while ignoring biological parents' suboptimal conditions.
  2. **Contractualism (Scanlon-style):** Screening could be justified to adoptees as "reasonable rejection" by a vulnerable party; no comparable duty to unconceived children.
  3. **Rights-Based Theories:** Adoptees have immediate positive rights to protection; unconceived children have no rights.
  4. **Conservative Bioethics:** Strong procreative liberty + "natural" parental rights for biological parents vs. "artificial" state-mediated adoption.

  **Coherence Check:**
  The two halves **cohere pragmatically but not philosophically deeply**:
  - **Internal Logic:** Distinction between "child needing placement" (adoption) and "potential child" (procreation) holds practices together superficially.
  - **Tension Points:**
    - A child born to unfit biological parents faces identical risks as an adoptee placed with unfit parents. Differential treatment is hard to justify *from the child's perspective*.
    - Tort law inconsistency: Wrongful birth acknowledges reproductive harm *to parents*, but wrongful life denies comparable harm *to child* despite identical contexts.

  **If Screening Logic Were Generalized:**
  Family law would transform radically:
  1. **Universal Parenting Licenses:** Mandatory pre-conception assessments for all potential parents (financial stability, mental health, parenting knowledge).
  2. **Harm Prevention Threshold:** Legal recognition that creating a life likely to experience severe suffering constitutes actionable harm.
  3. **Wrongful Life Expansion:** Successful tort claims for children born into extreme, foreseeable suffering (e.g., genetic diseases with no treatment).
  4. **Procreative Autonomy Limits:** State intervention to prevent births in cases of severe parental incapacity (e.g., mandatory contraception for profoundly disabled individuals under guardianship).
  5. **Post-Birth Resource Guarantees:** Positive welfare rights for all children (housing, healthcare, income) matching adoption safeguards.

  **Seminar Launch Points:**
  - Is the existing/potential child distinction ethically robust, or a legal fiction masking inconsistency?
  - Does procreative liberty *deserve* its privileged status if screening adoptive parents saves children from harm?
  - Should the "minimum viable parenting" standard for biological parents match adoption requirements?
  - Does tort law's rejection of wrongful life claims coherently align with the state's interest in protecting children?

  This bundle reveals a deeply *conservative* default: protecting existing beings from harm while fiercely guarding the freedom to create new life, regardless of risk. The tension lies in whether society values *actual children* more than *potential parental liberty*—and your seminar can dissect whether that balance is defensible.
