  **EINSTEINBURG DEPARTMENT OF LAND REGISTRY & CADASTRAL SERVICES**

  **PUBLIC NOTICE: REGARDING PARCEL DESCRIPTIONS WITHIN DESIGNATED AREA "THE HOLE" (ORDINANCE 17-04.3b)**
  **Form RD-412 (Rev. 08/23)**
  **Office Hours: M-F 8:30 AM - 4:30 PM (Closed 12:00-1:00 PM)**

  **1. Purpose of this Notice:** This notice addresses inquiries and filings related to recent updates to the legal descriptions of parcels within the officially designated Area "The Hole" (Tax District 7, Plat Sections G-K).

  **2. Nature of the Update:** On [Date], the Registry implemented a standardized administrative adjustment ("the Adjustment") affecting *only* the textual legal descriptions (metes, bounds, and lot numbers) assigned to parcels within The Hole. This Adjustment involved a systematic shift in the textual descriptions relative to each other. For example, the textual description previously associated with Lot 412 is now associated with the point previously described as Lot 414, and so forth.

  **3. Key Clarifications Regarding the Adjustment:**
      *   **No Physical Alteration:** The Adjustment pertains *exclusively* to the Registry's textual records. There has been no physical alteration, relocation, removal, or addition of any material feature, boundary marker, structure, natural landmark, or substance within The Hole, the City of Einsteinburg, or its environs. All registered coincidences (e.g., Well A at Corner Stone B, Fence C along Creek D) remain precisely as documented and physically verifiable.
      *   **Scope of Adjustment:** The Adjustment applies *only* to parcels within The Hole. Parcel descriptions for all other areas of Einsteinburg, containing registered physical features and structures, remain unchanged. Historical records documenting past states of parcels within The Hole, prior to the Adjustment, also remain unchanged and accessible.
      *   **Effect on Filings:** Any filing (e.g., deed transfer, lien, easement) submitted to the Registry that differs from a previous filing *only* by the substitution of the post-Adjustment textual parcel descriptions for the pre-Adjustment descriptions within The Hole, while referencing the *same* registered coincidences (e.g., "the parcel bounded by Creek D and Road E"), is considered by the Registry to be substantively identical to the previous filing. No new filing fee is required for such submissions.^(1)
      *   **Adjudication of "True" Description:** The Registry maintains records documenting both the pre-Adjustment and post-Adjustment textual descriptions for parcels within The Hole. The Registry does not, however, possess or utilize any procedure, standard, or evidentiary basis for determining which set of textual descriptions (pre- or post-Adjustment) constitutes the singularly "true" or "correct" description of a specific point of land within The Hole *in the absence of a registered physical coincidence defining that point*. The Registry records reflect the *relationships* between parcels and registered features, not the inherent identity of unmarked points.

  **4. Addressing "Takings" Claims:** The Registry has received inquiries and formal filings alleging an unlawful "taking" of property, asserting that the Adjustment resulted in a specific parcel being "moved out from under" the claimant.

  *   **Registry Position:** The Registry finds no basis for such claims. The textual description associated with a specific point of land within The Hole has changed. However, as no physical property, structure, right of access, or registered coincidence associated with the claimant has been altered, removed, or impeded, the Registry identifies no material deprivation of property rights requiring compensation. The claimant's fence remains adjacent to their neighbor's well, consistent with Registry records of that coincidence, regardless of the textual label assigned to the points of land involved.

  **5. Understanding Resident Concerns (Informational Sidebar):**
  > *Some residents express a fundamental concern regarding the Adjustment. They assert that each specific, unique point of land within The Hole possesses an inherent identity independent of any description, structure, or future development. They believe Lot 412, for instance, is intrinsically *that* particular point of earth and space, existing prior to and separate from any fence, well, or Registry description. From this perspective, reassigning its description to a different point constitutes a real alteration of what *is* Lot 412, effectively "moving" the property itself, even if no physical object has budged. They argue the Registry's records should reflect this underlying reality of the land itself.*
  >
  > *The Registry acknowledges this viewpoint is coherent and held sincerely. However, the practical function of the Registry is to document legally recognized relationships and features on the land for the purposes of title, taxation, and development. Identifying the inherent identity of an unmarked point of land, absent any physical referent or registered coincidence, falls outside the Registry's operational mandate and established procedures. Implementing and maintaining systems capable of tracking such identities for vacant land would necessitate significant, ongoing expenditure for adjudication, surveying beyond standard practice, and record-keeping complexity with no discernible impact on verifiable property rights or municipal function.*

  **6. Filing Procedures:** Filings concerning parcels within The Hole must utilize the current, post-Adjustment textual descriptions. Attempts to file using pre-Adjustment descriptions for current transactions will be rejected as non-conforming. Historical research referencing pre-Adjustment descriptions remains available per standard archive access procedures (Form AR-7).

  **7. Contact:** For specific filing questions, consult a Registry Clerk at Window 3. Philosophical inquiries regarding land ontology are not an administrative service of this office.

  *^(1) Fee waiver applies only if the *only* change is the substitution of post-Adjustment Hole parcel descriptions for pre-Adjustment ones within an otherwise identical filing concerning the same registered coincidences. Any other substantive changes require standard fees.*

  ---

  **What I was actually satirizing:**

  1.  **The Hole & Indeterminacy:** Represents a region of empty spacetime within general relativity (GR). The "shift" parodies a *diffeomorphism* – a smooth, global reassignment of spacetime points. The notice's core argument mirrors the *hole argument*: if spacetime is a substance with points possessing independent identities ("haecceities"), then two spacetime configurations differing *only* by such a reassignment within the hole (a diffeomorphism) represent physically distinct realities, even though *all observable coincidences* (matter fields meeting at specific events) are identical. GR, however, treats such diffeomorphic models as representing the *same physical situation* – observables are coincidences.
  2.  **Registry Policy = Relationalism/Background Independence:** The office's stance embodies a relationalist view (spacetime isn't a substance; only relations/coincidences matter) and GR's background independence (no fixed spacetime arena). Their refusal to adjudicate the "true" labeling reflects the physical equivalence of diffeomorphic models. The claim that "there's nothing further to know" isn't ignorance but a denial of substantival haecceities for spacetime points.
  3.  **Scope of Indeterminacy:** Confining the shift to The Hole (empty future spacetime) mirrors how the hole argument highlights indeterminacy in GR's initial value formulation *only* within matter-free regions. Past and matter-filled regions are fixed, providing the coincidences that make the shifted solution admissible and indistinguishable observably.
  4.  **Complainant's Sidebar = Substantivalism:** The residents' grievance directly states the substantivalist position: spacetime points have inherent identities prior to matter/fields. The office conceding it's "coherent" reflects that substantivalism isn't logically absurd, just incompatible with GR's interpretation.
  5.  **Jab at Smugness/Absurdity:** The office's focus on "operational prudence" and cost mirrors pragmatic defenses of relationalism, while highlighting the potential absurdity of a bureaucracy meticulously tracking identities of utterly indistinguishable nothingness ("unmarked points"). The fee waiver rule satirizes how GR technically allows the shift but practically fixes gauges.

  **Oversimplification:** While the hole argument challenges substantivalism in pure GR, modern quantum gravity research (like loop quantum gravity or some string theory interpretations) suggests spacetime might not be fundamental, potentially reviving aspects of "atoms" of space with intrinsic properties, making the analogy less clear-cut at that scale.
