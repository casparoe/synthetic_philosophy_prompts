answer: |-
  Here are nine tightly focused questions with specific follow-ups, designed to advance the critical dialogue while respecting your constraints. Each question targets one of your required angles, and the follow-ups anticipate her most likely deflection or response based on your description.

  ### Sequence & Structure
  1.  **Metaphysics of Union:** Question 1 (Follow-up targets functional equivalence to the sensitive soul)
  2.  **Internal Exegetical Pressure:** Question 2 (Follow-up targets Descartes' physiological language)
  3.  **Motive Question:** Question 3 (Follow-up targets anachronism vs. charity)
  4.  **Collapse Question:** Question 4 (Follow-up targets scholasticism)
  5.  **Falsifiability Question:** Question 5 (Follow-up targets the criterion's empirical status)
  6.  **Extension:** Modal Capacity & Immateriality (Question 6, Follow-up targets dualist commitments)
  7.  **Extension:** Non-Cognitive Sentience & Pain (Question 7, Follow-up targets reflex vs. experience)
  8.  **Extension:** Training & Modal Generality (Question 8, Follow-up targets novelty in animal studies)
  9.  **Textual Counterevidence:** Question 9 (Follow-up targets non-exegetical status)

  ---

  **1. Question (Metaphysics of Union):**  
  "If genuine sensory states like pain or color appearances in animals are wholly grounded in their extended bodies – without any union with an immaterial mind – how does Descartes avoid attributing to mere extension a power (sentience) that his substance dualism seems to reserve for minds or their union with bodies? Doesn't this functionally reinstate a *sensitive soul*?"

  *   **Follow-up (if she distinguishes mechanistic sentience from conscious thought):**  
      "But if this purely corporeal sentience involves genuine qualitative feels (*qualia*), as pain must, how is it functionally different from the sensitive soul's power to sense? Isn't Descartes' core objection to the sensitive soul that *any* sentience requires an incorporeal principle?"

  **2. Question (Internal Exegetical Pressure):**  
  "Descartes describes animal 'memory' (e.g., in the *Treatise on Man* and *Passions*) as involving habituation of brain pores by animal spirits, leading to altered responses. If this physiological process explains complex, learned behaviors in animals, doesn't it suggest their sensory states *do* involve a form of cognitive processing (tracking correlations, modifying dispositions) incompatible with your strict non-cognitive sentience?"

  *   **Follow-up (if she argues this is purely mechanical association):**  
      "Why does Descartes repeatedly use cognitive terms like 'memory' and 'imagination' for these physiological processes in animals if they are meant to be utterly devoid of any cognitive dimension? Doesn't this language suggest he saw even mechanistic responses as involving a *kind* of representation?"

  **3. Question (Motive Question):**  
  "Your reading strongly safeguards human immortality by making thought (and thus soul) uniquely human. To what extent is this theological imperative *driving* your interpretation of the language criterion and animal sentience, rather than emerging solely from Descartes' texts? Could this make your reading anachronistically prioritize orthodoxy over Descartes' own philosophical arguments?"

  *   **Follow-up (if she denies theology drives it or claims textual support):**  
      "Even granting textual support, doesn't the *specific emphasis* on an unfalsifiable modal criterion – ensuring humans *must* be distinct – reflect a primary concern with securing immortality, potentially overriding Descartes' own methodological focus on observable mechanisms in animals?"

  **4. Question (Collapse Question):**  
  "By granting animals genuine, felt sensory states while reserving judgment and reflexive awareness for human minds, doesn't your position closely mirror the scholastic view (e.g., Aquinas) that animals possess sensitive souls capable of sensation and appetite but lack rational intellect? How is Descartes' view fundamentally different?"

  *   **Follow-up (if she distinguishes via mechanism or lack of substantial form):**  
      "If the difference is *only* that Descartes explains animal sentience mechanistically while the scholastics invoked a substantial form, doesn't the core *functional architecture* – sentience without intellective thought or reflexive awareness – remain identical? Has Descartes displaced scholasticism here, or just re-described its core distinction?"

  **5. Question (Falsifiability Question):**  
  "You argue the language criterion concerns an unbounded *capacity*, making it immune to any finite behavioral evidence. What specific, conceivable empirical discovery – say, an ape spontaneously combining novel signs to describe an *unexpected* event it hadn't been trained on, or neural evidence of metacognition during pain in a rodent – *would* force you to concede animals possess the relevant modal capacity for sign use?"

  *   **Follow-up (if she dismisses specific examples as cue-following or redefines the capacity):**  
      "If no conceivable observation can refute the claim that an organism *lacks* this unbounded capacity, doesn't that render the criterion empirically vacuous? How is 'capacity for universal sign use' meaningfully different from 'immaterial soul' if neither admits empirical test?"

  **6. Question (Extension: Modal Capacity & Immateriality):**  
  "If the modal language capacity is the true mark of the mind, and this capacity is not grounded in the body (as animal capacities are), does it follow *directly* for Descartes that this capacity *requires* an immaterial substance? Or could a sufficiently complex machine, in principle, possess this unbounded generativity?"

  *   **Follow-up (if she affirms it requires immateriality):**  
      "Given that Descartes argues for mind's immateriality primarily from the *unity of thought* and *doubt*, not explicitly from language's generativity, isn't grounding immateriality *primarily* in the modal language criterion an interpretive leap that risks circularity?"

  **7. Question (Extension: Non-Cognitive Sentience & Pain):**  
  "If an animal's pain is a genuine sensory state but wholly non-cognitive – involving no awareness *of* the pain, no aversive judgment, just a mechanical signal – how does this differ conceptually from a sophisticated nociceptive *reflex*? Isn't the 'feel' of pain inherently tied to some form of awareness?"

  *   **Follow-up (if she maintains the feel is present without awareness):**  
      "Can we coherently attribute *suffering* to an animal experiencing pain-in-this-sense? If not, doesn't this undermine the ethical significance often drawn from granting them sentience, and contradict Descartes' own descriptions of animal fear and pain as passions?"

  **8. Question (Extension: Training & Modal Generality):**  
  "Experiments show animals like bonobos or parrots combining learned symbols in novel ways to request *untrained* items or describe *new* situations. You categorize this as 'cue-following'. What specific behavioral evidence would demonstrate the required modal generality – applying signs to *circumstances never previously encountered* – if not the appropriate use of learned symbols in genuinely novel contexts?"

  *   **Follow-up (if she argues novelty in experiments is bounded/pre-programmed):**  
      "If the animal's response to *any* unforeseen circumstance can be dismissed as an extension of its organ's dispositions or training, isn't 'circumstances never previously encountered' defined so narrowly (perhaps only applying to abstract or counterfactual scenarios animals can't demonstrate) that the criterion loses its intended force as a *discriminator*?"

  **9. Question (Textual Counterevidence):**  
  "Leaving interpretation aside, what single passage in Descartes' *extant corpus* – letters, published works, notes – if it existed and read unambiguously, say 'Beasts not only sense but judge particulars' or 'The parrot uses words with understanding' – would definitively refute your core thesis that animal sentience is strictly non-cognitive and lacks the modal language capacity?"

  *   **Follow-up (if she says no single passage could refute it due to context/system):**  
      "If the entire corpus, interpreted charitably, cannot in principle contain evidence that would falsify your reading – if it's immune to textual counterevidence – doesn't that suggest it functions more as a philosophical *reconstruction* than a strictly *exegetical* account of Descartes' own considered position?"

  ---

  **Key Features Addressed:**
  *   **Avoids Restatement:** Questions assume knowledge of her three theses and push on implications, contradictions, or motivations.
  *   **Targets Deflection:** Q5, Q8, and their follow-ups directly engage the "cue-following" objection, demanding what *would* count and challenging the dismissal.
  *   **Covers Required Angles:** 1-5 correspond directly to your list. 6-8 extend pressure on related core tenets (immateriality, pain, observable novelty).
  *   **Specific Follow-ups:** Each anticipates a likely reply (e.g., mechanistic sentience, textual support for theology, scholastic mechanism, cue-following dismissal, textual holism) and pushes a specific, harder point.
  *   **Accessible:** Concepts like "non-cognitive," "modal capacity," "mechanistic," "scholastic," "immaterial" are essential but presented in context. Avoids overly technical jargon.
  *   **Time-Managed:** Questions are concise and direct, allowing for focused 2-3 min answers.
  *   **Final Question:** Q9 directly asks for falsifying textual evidence, with the prepared follow-up challenging the reading's exegetical status if immune to textual counterevidence.
  *   **Excluded:** No restatements, career questions, or questions requiring conceded points she rejects.
