  First, let's unpack the respondent's position:  
  - Animals have non-cognitive sentience (pain/appetites without judgment/awareness of awareness)  
  - Language criterion is modal (universal sign-use capacity vs. fixed organ-driven animal responses)  
  - The position is unfalsifiable by behavior observations  

