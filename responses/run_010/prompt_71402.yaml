  The metaphysics angle is tricky—if human sensation requires mind-body union but animals are purely corporeal, how does she avoid sneaking in a "sensitive soul"? The follow-up should press whether her view is functionally equivalent to scholasticism.  

  For internal exegesis: Descartes' own physiology describes animal spirits and habituation in ways that seem cognitive. If she dismisses this as mechanistic, the follow-up asks why Descartes calls it "memory" if it's truly non-cognitive.  

