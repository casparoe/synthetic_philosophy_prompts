  ### 1. Reading the instrument (120 words)  
  Administer the tree in 90 minutes:  
  1. **Prep (5 min):** Hand out the nine case descriptions.  
  2. **Individual reflection (15 min):** Each person writes notes on the cases, avoiding the words "understand," "conscious," or "meaning."  
  3. **Tree walk (60 min):** As a group, take the tree node by node. At each node, debate the question using concrete case comparisons. Vote publicly (e.g., colored cards for yes/no) and split the group into branches. Record which cases anchor each vote.  
  4. **Leaf assignment (10 min):** Tally final positions. Participants share which leaf they landed on and its awkward commitment.  
  Goal: Surface disagreements through cases, not theory. If time runs short, skip cosmetic nodes.  

  ### 2. The hinge questions (300 words)  
  Four load-bearing questions structure the tree. They appear independent but share dependencies:  
  1. **Does the *origin* of a competence affect its status?** (Cases 4 vs. 6: evolved gait vs. compiler optimizer.) Tests if human foresight in creation is essential. *Dependency*: If you answer "yes," you likely tie comprehension to designers, affecting downstream answers about representation.  
  2. **Does *robustness to counterfactuals* define genuine competence?** (Case 3: image classifier failing without snow.) Tests if fragility implies the competence was illusory. *Independence*: Can be answered separately from origin, but a "yes" often demands generalization (Case 7).  
  3. **Does *generalization* imply a deeper faculty?** (Case 7: self-driving car handling novel scenarios.) Tests if novel success transcends pattern matching. *Dependency*: If you deny robustness (Q2) but affirm generalization, you may contradict yourself—generalization assumes robustness.  
  4. **Does an *interpretable internal state* constitute representation?** (Case 9: sarcasm detector direction.) Tests if readable, causal internals reflect "aboutness." *Independence*: Can be split from other questions, but a "no" often aligns with deflationary views.  
  Cosmetic questions (e.g., about Case 5’s clarifying questions) refine branches but aren’t hinges.  

