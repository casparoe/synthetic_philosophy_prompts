answer: |-
  Here are five core questions with escape routes and follow-ups, plus your requested opener and closer, all in British English. Each question is concise, builds logically, and remains sharp even if previous answers are dodged.

  **Opener (Forces operational criterion):**  
  "Professor, for listeners new to this, could you state your key rule? When exactly does an observation confirm a hypothesis on your account, in terms anyone could apply to their own research?"

  ---

  **Question 1: Logical Equivalence & Frame-Dependence**  
  *Core:* If logically equivalent hypotheses get the same evidence, doesn’t your frame-relativity force you to abandon that? How do you reconcile your view with Hempel’s equivalence condition?  
  *Escape Route:* Claims equivalence holds only *within* a fixed sampling frame.  
  *Follow-Up:* But if ‘All ravens are black’ and ‘All non-black things are non-ravens’ are confirmed by different observations *even under the same frame* (e.g., a bird survey), doesn’t that violate equivalence directly?  

  **Question 2: Deliberate Search & Frame Selection**  
  *Core:* In field ornithology, we often target specific traits—say, radio-tagging *only* black ravens. If the frame is constrained by our search, doesn’t this ‘colour-aware’ sampling void confirmation entirely? Where would a colour-blind frame come from?  
  *Escape Route:* Argues targeted searches can nest within broader frames (e.g., “woodland birds”).  
  *Follow-Up:* But if I *only* sample birds reported as ‘large and black’, isn’t the frame intrinsically biased? Mustn’t we always appeal to an *idealised* frame we didn’t use—and who defines that?  

  **Question 3: Frame Gerrymandering & Bootstrapping**  
  *Core:* Could I design a sampling frame to ‘confirm’ anything? For instance, sampling ‘objects on my desk’ to argue all pens are blue, ignoring the red one in my bag. Isn’t your view vulnerable to this?  
  *Escape Route:* Insists frames must reflect *actual* causal processes, not arbitrary groupings.  
  *Follow-Up:* What stops me reframing *any* process post hoc? If I ‘sample’ pens by grabbing one from my bag, but call the frame ‘desk objects’, haven’t I manufactured confirmation?  

  **Question 4: Grue & Projectibility**  
  *Core:* If frames must be ‘projectible’—say, avoiding Goodman-style terms like ‘grue’—doesn’t your account inherit his problem? Or can ‘sampling frame’ itself be grue-like?  
  *Escape Route:* Claims frames are defined by physical/causal mechanisms, not predicates.  
  *Follow-Up:* But if I sample ‘grue emeralds’ using a device that detects greenness until 2050, then blueness, is that frame valid? If not, haven’t you smuggled in projectibility?  

  **Question 5: Unsampleable Hypotheses & Background Knowledge**  
  *Core:* Take a hypothesis like ‘No ravens exist in Antarctica’, confirmed by exhaustive surveys. Or ‘All neutrinos have mass’—where no frame exists. How does your account handle cases where sampling is impossible or total?  
  *Escape Route:* Appeals to ‘hypothetical’ frames (e.g., “if we *could* sample neutrinos…”).  
  *Follow-Up:* But doesn’t background knowledge intrude? If I know a species is either absent *or* ubiquitous and variable, finding one black individual might *lower* my confidence they’re all black. Doesn’t this show confirmation isn’t just about provenance?  

  ---

  **Closer (Falsifiability):**  
  "What observation would genuinely falsify your account? Not a case re-explained by frames, but something that, if found, would make you concede confirmation *can* happen without a sampling design."  

  ---

  **Design Notes for Rigour:**  
  1. **Escapes Pre-Empted**: Each follow-up addresses the guest’s likely rebuttals (e.g., Q2’s ‘nested frames’ retort is countered by demanding frame integrity).  
  2. **Background Knowledge**: Woven into Q5’s follow-up, using your plumage example to stress how prior beliefs can invert confirmation.  
  3. **Jargon Minimised**: Terms like ‘projectible’, ‘gerrymander’, and ‘bootstrapping’ are contextualised conversationally.  
  4. **British English**: "Colour", "fussier", "amongst" used throughout; no contractions in questions for formality.  
  5. **Independence**: Each question stands alone (e.g., Q4 on grue doesn’t assume Q1-3).  

  **Delivery Tip**: If she dismisses an objection as "re-running Hempel’s intuition", gently note: "But isn’t the worry here about *your* frame concept, not his original paradox?" to refocus. Good luck!
