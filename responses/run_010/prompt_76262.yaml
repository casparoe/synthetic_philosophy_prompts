  The user needs an essay question that forces students to analyze whether this is corruption, but crucially, they must examine what makes the concept of corruption determinate rather than just stipulative. The key tension lies in the standard "abuse of public office for private gain" definition - is this hereditary role truly "public office"? Are non-convertible, capped contributions "private gain"? And does the systemic harm of the alternative lottery matter?

  The deliverables required are specific: the exam question as students would see it, a model answer of about 750 words that takes a stance, a detailed marking scheme distinguishing A from B answers, and analysis of common student responses with grading consequences.

  For the question itself, it needs to be tightly written with all case details, time limit (75 minutes), and mark allocation (30 marks) clear. The prompt must force engagement with conceptual determinacy - not just listing definitional ambiguities but asking what would resolve them. The village council's cultural objection versus donor's universalist stance should frame the tension.

  For the model answer, I'll argue this is not corruption despite ticking some definitional boxes. The core reasoning will be: (1) the capped, non-convertible nature negates "private gain" by preventing accumulation, (2) the hereditary role functions as a customary trusteeship not a modern public office, and (3) the alternative causes greater harm - making the practice Pareto-superior. The determinacy point will be that corruption requires unjust enrichment and subversion of public purpose, both absent here. The council/donor conflict is substantive: it's about whether "public office" can embody community norms.

  The marking scheme will penalize answers that: (1) avoid commitment, (2) default to "it's corrupt because it violates formal rules," or (3) uncritically accept the council's view. A-grade answers must articulate why the definitional tensions matter - that corruption accusations serve to delegitimize certain power structures. B-grade answers will competently dissect the definition but miss this functional analysis.

  Common answers I anticipate: 
  1. "Clearly corrupt" (score: C+/B- for missing nuances) 
  2. "Not corrupt due to custom" (B- if unsupported, B+ with community-harm argument) 
  3. "Ambiguous but reformable" (B for pragmatism, A- if tied to concept-work) 
  4. "Structural violence masked as tradition" (A if it addresses determinacy)

  The model answer will explicitly reject the donor's classification while acknowledging why the definition seems applicable superficially. It'll conclude that calling this "corruption" stretches the concept to cover benign efficiency-seeking, revealing how the term often serves bureaucratic control agendas.
answer: |-
  **Political Philosophy 435: Corruption and Governance**  
  **Final Examination — Essay Question (75 minutes; 30 marks total)**  

  ---

  **Case:** The District Irrigation Office allocates dry-season canal turns via a state-mandated lottery system. However, the Water Master operates a parallel customary practice: contributing households (offering fixed grain, plough-team use, or school fees) receive priority. Contributions are capped at the value of a household’s water share, non-convertible to cash, and publicly recorded. The Water Master’s net gain equals neighbors’ average welfare; the role is hereditary, locally viewed as a commons trust, though the state pays a salary and classifies it as a civil service post. The lottery, used by few, yields lower harvests and unreliable delivery due to rigging. Non-contributing poor households and recent migrants lose turns. A donor program classifies the practice as corruption and demands abolition for aid; the village council calls this a foreign imposition of public/private norms.  

  **Question:**  
  Is this practice corrupt? Your answer must:  
  (a) Commit to "yes" or "no";  
  (b) Identify *one* specific condition that would make the concept of corruption **determinative** (i.e., capable of yielding a non-arbitrary verdict) in this case;  
  (c) Explain why the donor’s classification and the council’s objection cannot *both* be coherently correct if corruption is a substantive (not merely verbal) concept.  

  Support your analysis using the case details. Do not rely on citations or general theories of reciprocity.  

  ---

  ### **Model Answer (Approx. 750 words)**  

  **Verdict:** The practice is **not corrupt**.  

  **Determinative Condition:** Corruption must involve *net private enrichment* that *subverts public purpose*. Here, the Water Master gains no net advantage (capped contributions leave him no better off than neighbors), and the system *advances* the public purpose of reliable water distribution (unlike the lottery). Without net enrichment *and* harm to public ends, the accusation lacks determinacy.  

  **Analysis:**  
  The donor’s definition—“abuse of public office for private gain”—fractures under scrutiny. First, “public office” ambiguously straddles state bureaucracy and hereditary community trusteeship. The state retrofits the role as “civil service,” but locally, the Water Master is a custodian of communal resources, not a Weberian bureaucrat. Second, “private gain” fails: non-convertible, capped contributions prevent accumulation, rendering the Water Master’s position custodial, not exploitative. Crucially, “abuse” requires harm, yet the alternative lottery is demonstrably *worse* for productivity and equity—it is rigged, reduces harvests, and excludes the poor who cannot lobby fixers. The customary system, by contrast, publicly regulates contributions and appeals to elders, embedding accountability within local epistemology.  

  The council’s objection exposes the donor’s conceptual imperialism. Donors equate “state rules” with “public good,” ignoring that the lottery—a formal state process—creates *greater* exclusion (migrants, the poor) and inefficiency. Calling the practice “corrupt” presupposes a rigid public/private divide alien to the community’s understanding of trusteeship. Here, contributions are neither bribes (secret, negotiable, enriching) nor gifts (discretionary, personal); they are fixed, public, and functionally tithes for a communal service. If corruption requires *illegitimate* privatization, the system’s transparency and caps negate illegitimacy.  

  The donor and council cannot both be coherently correct if corruption is substantive. The donor insists the practice violates universal norms: state office + non-state payments = corruption. The council denies the state’s moral authority to redefine their commons governance. If corruption is objective, one must be mistaken. But the dispute is not verbal—it concerns *which framework* (state bureaucratic vs. communal fiduciary) defines “public office” and “gain.” The donor’s view assumes institutions precede norms; the council’s assumes norms precede institutions. Resolving this requires adjudicating harm: the lottery harms welfare, while the practice sustains it. Thus, the donor’s classification is incoherent *if* corruption implies systemic detriment. Here, no detriment exists—only a clash of institutional imaginaries.  

  **Conclusion:** The practice is functionally legitimate resource governance. Calling it “corrupt” stretches the concept to fit bureaucratic universalism, obscuring how communities optimize scarce goods when formal institutions fail. Corruption gains determinacy only when clear enrichment undermines public welfare—neither applies here.  

  ---  

  ### **Marking Scheme**  
  **Total: 30 marks**  
  - **Commitment to Verdict (3 marks):** 3 for clear "yes/no"; 0 for evasion or "it depends."  
  - **Determinative Condition (9 marks):**  
    - A (7–9): Names *one* precise, philosophically grounded condition (e.g., "net enrichment + harm to public purpose"). Explains why it resolves ambiguity.  
    - B (4–6): Identifies a tension (e.g., "defining ‘private gain’") but does not specify how to resolve it.  
    - C (1–3): Vague or recycled definition (e.g., "depends on culture").  
  - **Analysis of Case (12 marks):**  
    - A (10–12): Ties each element (office/gain/abuse) to case details; contrasts lottery harms vs. customary benefits; addresses publicity/caps.  
    - B (7–9): Describes tensions but lacks systemic comparison (e.g., notes "salary vs. hereditary" but ignores lottery’s failures).  
    - C (4–6): Surface-level application of definition without critique.  
  - **Donor/Council Incompatibility (6 marks):**  
    - A (5–6): Argues why substantive corruption demands rejecting one view (e.g., "divergent institutional ontologies").  
    - B (3–4): Labels dispute "cultural" without engaging harm or legitimacy.  
    - C (1–2): Assumes both can be valid.  

  **Grade Thresholds:**  
  - **A (24–30):** Verdict + condition resolve conceptual ambiguity; exposes donor’s harm-blind universalism; contrasts functional vs. formal legitimacy.  
  - **B (18–23):** Correctly applies definition but catalogs tensions without resolution; treats donor/council as "perspectives" without incompatibility argument.  
  - **C (12–17):** Misses key case facts (e.g., caps, lottery harms); defaults to "corrupt = breaks rules."  
  - **D/F (<12):** Ignores instructions; cites theories; no verdict.  

  ---  

  ### **Common Answers & Grading**  
  1. **"Clearly corrupt: It violates state rules."**  
     - Ignores lottery’s harms, caps, publicity. Treats definition as static.  
     - **Cost:** C (12–14). Misses determinacy requirement, incompatibility.  

  2. **"Not corrupt: It’s cultural reciprocity."**  
     - Defends custom but fails to articulate *why* reciprocity negates corruption (e.g., omits net gain/harm analysis).  
     - **Cost:** B- (18–20). Strong verdict, weak condition.  

  3. **"Ambiguous: Definition words conflict."**  
     - Catalogs tensions (office/gain/abuse) but no resolution or commitment.  
     - **Cost:** B (21–23). Good analysis, no determinacy condition.  

  4. **"Not corrupt, but problematic exclusion."**  
     - Confuses corruption with inequality. Fails to address why exclusion doesn’t make it corrupt (e.g., lottery also excludes).  
     - **Cost:** B- (18–19). Nuanced but evades core question.  

  5. **"Donor wrong, council right: Corruption requires harm."**  
     - Uses harm as determinative condition; contrasts systems.  
     - **Cost:** A- (25–27). May underdevelop "public purpose" subversion.
