prompt: |-
  I am a fourth-year PhD student in political theory, and this term I am running the weekly discussion section for an upper-level undergraduate seminar on the philosophy of social explanation. My section has sixteen students and meets once in a double period of 110 minutes; this is week six, and they have just come off Marx's 1859 Preface to *A Contribution to the Critique of Political Economy* together with Cohen's defence of the base–superstructure picture in *Karl Marx's Theory of History: A Defence*. Next week they read Elster's *Making Sense of Marx* and the methodological-individualist objection, so the discussion I want to set up now is not "is Marx right," but something narrower and, I think, harder to argue with in the abstract: what kind of claim the primacy thesis actually is, and what would count as its failing. The section has an unfortunate composition for this. Two economics concentrators have decided in advance that the whole framework is unfalsifiable and are eager to announce it in the first ten minutes; the remaining fourteen are broadly sympathetic to Marx and have started to treat any methodological question as a political attack. Between the two camps, discussion usually degenerates into the sympathetic students offering ever more ingenious readings of a text and the skeptics scoring the ingenuity as evidence of the problem. I would like an activity in which the difficulty arrives as an experience that both camps have in common before either of them gets to name it, and in which the word functional explanation does not appear until the debrief.

  Here is what I want them to come away seeing, roughly in this order. First, that the base feels extremely constraining when you are handed a superstructural fact and asked to explain it, and remarkably unconstraining when you are handed a base and asked to predict from it — and that they should notice this asymmetry in their own performance rather than be told about it. Second, that a social explanation can be simultaneously compelling, well-motivated, and non-discriminating, in the specific sense that it would have been offered with equal confidence for a society with a quite different base; I have in mind some kind of matching or identification mechanic where the students' own explanations are shuffled and their peers have to work out which society each was written about, so that the match rate is the datum. Third, and most delicately, something about the selection-shaped form of the thesis: that a disposition is said to explain a structure because structures of that type suit the level of the forces, and that this is close to saying that whatever prevailed was suited, unless the suitability criterion can be pinned down independently of which outcome occurred. I would like the third point to emerge from a round in which they must fix their criterion of suitability before being shown an outcome, and then get the chance to revise it, with the revision rate recorded openly on the board.

  Please write this up as something I can actually run. I need: the number and composition of teams; a full set of invented dossiers for four or five fictional societies, each specifying the level and character of the productive forces, the property relations, the class structure, and a couple of ecological or geographic constraints, all in the same format so that the differences are the only differences; the exact instructions and the fixed menu of superstructural items the teams predict or explain (household form, dominant legal doctrine on contract and inheritance, the prevailing religious or cosmological commitment, the form of political authority, the content of the admired virtue, and so on); the sequencing with minute-by-minute timing across the 110 minutes; and a scoring scheme that creates real competitive pressure without using grades or money, since my department prohibits both as in-class currency. Two practical constraints: the room has a whiteboard, a paper cutter, and no working projector, so everything must run on handouts and index cards; and I have a TA who can circulate and keep score. Finally, please tell me what will predictably go wrong the first time I run it — I expect at least one team to game the matching round by writing deliberately vague explanations, and I would like to know whether to build a scoring rule that punishes vagueness or to let that happen and use it in the debrief — and be frank about which feature of the base–superstructure problem the activity cannot reproduce at all and I will simply have to supply myself. My own suspicion is that it cannot reproduce diachronic depth, since the thesis is about sequences of modes of production over centuries and my game is unavoidably about synchronic fit across fictional societies, but I would like you to confirm or correct that, and to say what else falls through.
reasoning: |-
  We are designing a discussion section activity for 110 minutes (double period) with 16 students. The goal is to explore the nature of the primacy thesis (base-superstructure) without getting bogged down in political arguments or methodological jargon. We want the students to experience the asymmetry in the explanatory power of the base, the non-discriminating nature of social explanations, and the issue of selection bias in functional explanations.

  The activity will be structured in three rounds, corresponding to the three learning objectives. We will use fictional societies to avoid real-world political triggers.

  **Practical Setup:**
  - Room: whiteboard, paper cutter, handouts, index cards. No projector.
  - TA: to help with circulating materials and keeping score.
  - Students: 16, divided into 4 teams of 4. Mix the economics concentrators and the sympathetic students across teams to break up the existing dynamics.

  **Fictional Societies:**
  We create 4 fictional societies (A, B, C, D) with distinct bases and some ecological constraints. Each society is described in a dossier that includes:
  1. Level and character of productive forces (e.g., technology, tools, knowledge)
  2. Property relations (ownership of means of production)
  3. Class structure
  4. Ecological/geographic constraints

  We also need a set of superstructural items that each team will be asked to predict or explain. We fix these items for all societies:
  - Household form (e.g., nuclear, extended, matrilocal)
  - Dominant legal doctrine on contract and inheritance
  - Prevailing religious/cosmological commitment
  - Form of political authority (e.g., monarchy, council, democracy)
  - Admired virtue (e.g., courage, piety, industriousness)

  **Dossiers for Four Societies:**

  *Society A: Agrarian Oasis*
  - Productive forces: Primitive irrigation, bronze tools, domesticated animals (camels, goats), knowledge of seasonal flooding.
  - Property relations: Communal ownership of water sources and main canals; private ownership of plots by family units.
  - Class structure: Peasant farmers (majority), canal overseers (small class with administrative power), no distinct merchant class.
  - Ecological constraints: Located in a desert oasis, limited arable land, dependent on annual river flooding.

  *Society B: Mountainous Pastoral*
  - Productive forces: Terraced farming, iron tools, herding of sheep and yaks, knowledge of cheese-making and wool-spinning.
  - Property relations: Clan-based collective ownership of pastures and terraces; private ownership of livestock.
  - Class structure: Herders and terrace farmers (majority), clan elders (who manage disputes and collective decisions), warrior class for defense.
  - Ecological constraints: Mountainous terrain, short growing season, vulnerability to avalanches and raiders.

  *Society C: Coastal Maritime*
  - Productive forces: Advanced shipbuilding (wooden ships with sails), fishing nets, salt preservation, navigation by stars, metal tools (iron).
  - Property relations: Private ownership of ships and fishing equipment; communal ownership of docks and marketplaces.
  - Class structure: Fishermen and sailors (majority), shipowners and merchants, council of elders (elected from shipowners).
  - Ecological constraints: Coastal with rich fisheries, frequent storms, limited farmland.

  *Society D: Riverine Agrarian-Artisan*
  - Productive forces: Advanced pottery wheel, looms for textile production, iron plows, crop rotation, river transport (barges).
  - Property relations: Private ownership of workshops and tools; communal ownership of irrigation systems and roads.
  - Class structure: Artisans (potters, weavers), farmers, merchants, and a ruling council of guild masters and landowners.
  - Ecological constraints: Fertile river valley, prone to flooding, surrounded by forests.

  **Activity Structure:**

  *Total Time: 110 minutes*

  1. **Introduction (10 minutes)**
     - Briefly frame the activity: "Today we are going to role-play as anthropologists studying four newly discovered societies. Each team will be given a dossier on one society. We will do three rounds of activities to understand how the material base of a society relates to its superstructure."
     - Assign teams (4 teams of 4) and distribute dossiers (each team gets one society). Let teams know that they will become experts on their society.

  2. **Round 1: Prediction from Base (Asymmetry Experience) (30 minutes)**
     - **Goal:** Experience how the base is unconstraining when predicting the superstructure.
     - **Task:** Each team is given the base of their society (productive forces, property relations, class structure, ecology) and must predict the superstructural items for their society. They have 15 minutes to write predictions for:
          a. Household form
          b. Legal doctrine (contract and inheritance)
          c. Religious commitment
          d. Form of political authority
          e. Admired virtue
     - They should base their predictions solely on the base. They write each prediction on a separate index card (one per item) and label with the item name and society letter (but not the team name).
     - After 15 minutes, collect all prediction cards. Then, redistribute the cards so that each team gets the set of predictions from another society. Also, give each team a complete dossier (including the base and the actual superstructure) for the society whose predictions they now hold. 
     - **Exercise:** The teams now have 10 minutes to evaluate how well the predictions they received match the actual superstructure of the society they are looking at. They score each prediction on a scale of 1-3 (1 = poor match, 2 = okay, 3 = good). The TA circulates to collect the scores and record the average for each team on the whiteboard (without revealing which society it was for).
     - **Debrief Point (5 minutes):** Ask teams to reflect: Was it easy to predict? How much variation did they see in the predictions? Note the asymmetry: when you have the base, predicting the superstructure is hard and underdetermined.

  3. **Round 2: Explanation from Superstructure (Asymmetry and Non-Discriminating Explanations) (30 minutes)**
     - **Goal:** Experience how the base feels constraining when explaining a given superstructure and to see that explanations can be non-discriminating (i.e., they could apply to multiple bases).
     - **Task:** Each team is now given the superstructure of a society (without knowing which society it is) and must explain why that superstructure arose from the base. But note: we are going to assign each team a superstructure that is actually from a different society than their own. 
       - Step 1: Collect the actual superstructure (from the dossier) for each society on index cards (one card per superstructural item, labeled with the society and item).
       - Step 2: Shuffle and redistribute so that each team gets the set of superstructural items from one society (not their own). They do not know which society it is from.
     - **Exercise:** Teams have 15 minutes to write an explanation for each superstructural item (why it fits the base of the society they are assigned). They must use the base of their own society to explain the superstructure they received. For example, Team A (with Society A base) might get the superstructure of Society C and must explain why Society A's base would lead to Society C's superstructure. They write one explanation per superstructural item on index cards, without mentioning the society they are assigned (only the item).
     - After 15 minutes, collect all explanation cards. Then, set up a matching game: 
       - Post on the whiteboard the list of societies (A, B, C, D) and the superstructural items (household, legal, religion, authority, virtue). 
       - For each superstructural item, the TA reads aloud the explanation and then each team (including the one that wrote it) tries to guess which society the explanation was written for. They write their guess on a card and hand it to the TA. 
       - The TA records the votes and then reveals the correct society. The team that wrote the explanation gets a point for every team that guessed correctly (so if 3 teams guess right, they get 3 points). Also, the guessing teams get a point if they guess correctly. This encourages both good explanations and careful listening.
     - **Debrief Point (5 minutes):** Note how often the explanations could fit multiple bases. This shows that the explanations are non-discriminating.

  4. **Round 3: Functional Selection (20 minutes)**
     - **Goal:** Experience the issue of selection bias in functional explanations.
     - **Task:** Each team is given a new base (we create two new societies, E and F, to add complexity) to avoid using the same ones. Alternatively, we can use the same societies but add a twist. However, to save time and complexity, we'll stick with the original four. 
       - We tell teams: "Imagine that in each society, there are two possible superstructural forms for political authority (for example). We will focus on one item: form of political authority. We will give each team two options for political authority that could exist in their society. They must choose which one is more suited to the base."
     - **Exercise:**
       - Step 1: Before seeing the actual outcome, each team is given a base (their own society) and two alternative forms of political authority (one of which is the actual one from their dossier, and one is a plausible alternative). They must choose which one is better suited to the base and write down a criterion for why it is better suited (e.g., "because it allows for quick decision-making in times of crisis").
       - Step 2: Then, we reveal the actual outcome (which they already know from their dossier). If the actual outcome matches their choice, they get 2 points. If not, they get 0. But then we allow them to revise their criterion to explain why the actual outcome is actually better suited. If they revise, they get 1 point regardless (if they revise, they get 1 point; if they stick to their original and it was wrong, they get 0; if they were right and stick, they keep 2).
     - **Setup:** 
          - For Society A (Agrarian Oasis): 
              Option 1: Council of canal overseers (actual)
              Option 2: Hereditary monarch
          - Society B (Mountainous Pastoral):
              Option 1: Council of clan elders (actual)
              Option 2: Elected military leader
          - Society C (Coastal Maritime):
              Option 1: Council of shipowners (actual)
              Option 2: Priest-king who is also the chief navigator
          - Society D (Riverine Agrarian-Artisan):
              Option 1: Council of guild masters and landowners (actual)
              Option 2: Strongman ruler chosen by popular acclamation
     - **Process:**
          - Teams are given 5 minutes to choose and write their criterion.
          - Then, reveal the actual outcome (which they have in their dossier). They mark if they were right. 
          - Then, they have 5 minutes to decide: stick to their original criterion or revise it to explain the actual outcome. They must write a revised criterion if they change.
          - The TA records on the board: 
              - How many teams initially chose the actual outcome? 
              - How many revised their criterion after seeing the outcome?
     - **Debrief Point (5 minutes):** Discuss how easy it is to revise the criterion to fit the outcome. This illustrates the selection bias problem: the functional explanation can become tautological because the criterion of "suitability" can be adjusted after the fact.

  5. **Final Debrief (20 minutes)**
     - Start by asking the students about their experiences in each round.
     - Draw out the three points:
          1. Asymmetry: Predicting from base is hard (underdetermined); explaining a superstructural fact by the base feels more constrained but actually can be done flexibly (as seen in Round 2).
          2. Non-discriminating explanations: In Round 2, explanations were often so general that they could fit multiple societies.
          3. Selection bias: In Round 3, the criterion for "suitability" was often revised to fit the outcome, making the explanation unfalsifiable.
     - Then, connect to the readings: 
          - How does this relate to Cohen's defense? (He uses functional explanation: superstructural elements are explained by their function for the base.)
          - How might Elster's methodological individualism object? (He would say that without a mechanism, functional explanations are just-so stories.)
     - Avoid the term "functional explanation" until now. Then, introduce it and note that the activity has shown the challenges of such explanations.

  **Scoring Scheme:**
  - We are using points for competitive pressure, but not tied to grades or money. We can have a leaderboard on the whiteboard. The points are for bragging rights. The TA keeps a running total of points by team from Rounds 2 and 3 (Round 1 scores are for the debrief, not competition). 
  - Round 1: Scores are for debrief only (asymmetry).
  - Round 2: 
      - Explanation writing team: 1 point for each team that correctly matches the explanation to the society (max 3, since 4 teams total and one is the writer, but note: the writer doesn't vote for their own? Actually, we can have the writer vote too. So 4 votes total? But then max 4. Alternatively, the writer doesn't vote. Let's have 3 guessing teams per explanation. So max 3 points per explanation item. And there are 5 items. So each team writes 5 explanations, and each explanation can get up to 3 points. But note: each team writes explanations for one society (all 5 items). So the team's total for Round 2 is the sum of points for their 5 items.
      - Guessing teams: 1 point per correct guess per item. So each team will guess on 5 items (each from a different society, because the explanations are shuffled). So they can get up to 5 points in Round 2 from guessing.
  - Round 3:
      - Initial choice: 2 points if correct, 0 if wrong.
      - Then, if they revise, they get 1 point (regardless of initial choice). If they were initially correct and do not revise, they keep 2 points. If they were initially wrong and revise, they get 1 point. If they were wrong and don't revise, 0.
      - So maximum 2 points per team in Round 3.

  **Predictable Problems and Solutions:**
  1. **Vagueness in Round 2:** Teams might write vague explanations to make them match multiple societies. 
     - *Solution:* We can build a scoring rule that punishes vagueness. For example, the TA (or the instructor) can also rate the explanations for specificity on a scale and deduct points if too vague. But that is subjective and may slow things down. Alternatively, we can let it happen and use it in the debrief: "Notice how some explanations were so vague they could fit anything? That's a problem for social explanation." So we might not punish it in scoring but highlight it in discussion.

  2. **Diachronic Depth:** The activity is synchronic (fit at one time) and does not address the historical sequence of modes of production. The instructor will need to address this in the debrief, noting that the base-superstructure thesis is about historical change and that the activity only shows the synchronic fit. We can mention that the selection mechanism over time is what Cohen relies on, but Elster would demand a microfoundation.

  3. **Other Limitations:**
     - The fictional societies are simplified. Real societies are more complex.
     - The activity does not address class struggle or agency, which are central to Marx.
     - The activity might not capture the dynamic of the forces of production developing and then coming into conflict with relations of production.

  **Adjustments for Time:**
  The timing is tight. We have 110 minutes. The breakdown:
  - Intro: 10
  - Round 1: 30 (15 prediction, 10 evaluation, 5 debrief)
  - Round 2: 30 (15 explanation writing, 10 matching game, 5 debrief) [Note: the matching game might take longer. We might have to do one item at a time and limit to 1 minute per item, so 5 minutes for 5 items? But then voting and revealing might take 10 minutes total. Alternatively, we do one example per society? Or we do just one superstructural item to save time? But then we lose the effect. Let's do all 5 but quickly.]
    - Alternative: Instead of doing all 5 items, we do one per team? But that might not be enough. We can have the TA quickly tally. We'll allocate 15 minutes for the matching game and scoring.

  Revised timing:
  - Round 1: 15 min prediction, 10 min evaluation, 5 min debrief -> 30 min
  - Round 2: 15 min explanation, 15 min matching (each item: 2 min to read and vote, then reveal; 5 items * 3 min = 15 min), 5 min debrief -> 35 min
  - Round 3: 10 min (5 min initial, 5 min revision) and 5 min debrief -> 15 min
  - Final debrief: 20 min

  Total: 10 (intro) + 30 (R1) + 35 (R2) + 15 (R3) + 20 (final) = 110 minutes.

  **Materials:**
  - Dossiers: 4 copies (one per team) for their assigned society. Each dossier has base and superstructure.
  - Index cards for predictions and explanations.
  - Handouts for the two options in Round 3 for each society.

  **Team Composition:**
  - 4 teams: Team A, B, C, D.
  - Each team gets one society (A, B, C, D) and becomes experts on it.

  **Implementation:**
  - The instructor and TA must prepare the dossiers, index cards, and handouts in advance.
  - The TA will help with distributing materials, timing, and keeping score on the whiteboard.

  This activity should create a shared experience that cuts across the two camps and sets up the methodological critique for next week's reading (Elster).
answer: |-
  Below is a comprehensive, ready-to-run activity designed for your 110-minute section. It addresses your three core objectives through structured team exercises, avoids triggering political debates by using fictional societies, and leverages your room constraints (handouts, index cards, whiteboard). The activity is divided into three rounds, each targeting one of your learning goals, with competitive scoring to incentivize engagement without grades/money.

  ---

  ### **Activity Title: The Base-Superstructure Puzzle Box**
  **Objective:** Explore the *kind of claim* Marx's primacy thesis makes by experiencing its asymmetries, non-discriminating nature, and selection bias in functional reasoning—without explicit reference to Marx/Cohen until the debrief.

  **Students:** 16 (divided into 4 teams of 4)  
  **Time:** 110 minutes  
  **Materials:** 
  - 4 society dossiers (handouts)
  - Index cards (100+), markers, paper cutter
  - Whiteboard for scoring and instructions
  - TA role: Distribute materials, tally scores, track time.

  **Team Composition:**  
  - Pre-assign teams to balance skeptics/sympathizers (e.g., 1 econ concentrator + 3 others per team).  
  - Teams are named after colors: **Red, Blue, Green, Yellow**.

  ---

  ### **Fictional Societies (Dossiers)**  
  Four societies with identical descriptive categories but divergent traits. All share:  
  - **Productive Forces**: Technology/knowledge level.  
  - **Property Relations**: Ownership of productive assets.  
  - **Class Structure**: Primary social divisions.  
  - **Ecological Constraints**: Geography/resources.  
  - **Superstructure Items**: Fixed for prediction/explanation:  
    - (H) Household form  
    - (L) Dominant legal doctrine (contract/inheritance)  
    - (R) Religious/cosmological commitment  
    - (P) Form of political authority  
    - (V) Admired virtue  

  **Dossier Format (Handout Example):**  
  ```  
  **SOCIETY ALPHA**  
  - **Productive Forces**: Moderate-yield grain farming; iron tools; animal traction (oxen).  
  - **Property Relations**: Communal land ownership; private tools/livestock.  
  - **Class Structure**: Farmer-laborers (85%), Land stewards (15%).  
  - **Ecological Constraints**: Semi-arid plains; unpredictable rainfall.  

  **SOCIETY BETA**  
  - **Productive Forces**: Terraced rice farming; bronze tools; irrigation canals.  
  - **Property Relations**: State-owned land; hereditary use-rights.  
  - **Class Structure**: Peasants (75%), Bureaucrats (25%).  
  - **Ecological Constraints**: Mountain valleys; seasonal monsoons.  

  **SOCIETY GAMMA**  
  - **Productive Forces**: Coastal fishing/foraging; sailboats; wood/stone tools.  
  - **Property Relations**: Clan-based shoreline territories; shared boats.  
  - **Class Structure**: Fishers (80%), Elders (20%).  
  - **Ecological Constraints**: Dense coastline; typhoon risk.  

  **SOCIETY DELTA**  
  - **Productive Forces**: Floodplain agriculture; copper tools; grain storage.  
  - **Property Relations**: Temple-controlled land; tenant farmers.  
  - **Class Structure**: Laborers (70%), Priests (30%).  
  - **Ecological Constraints**: River delta; annual flooding.  
  ```  
  *(Full dossiers provided at end)*  

  ---

  ### **Activity Sequence**  
  **Total Time: 110 mins**  

  #### **0. Setup (5 mins)**  
  - Divide into 4 teams. Distribute:  
    - 1 dossier per team (Red: Alpha, Blue: Beta, Green: Gamma, Yellow: Delta).  
    - Index cards (20/team), markers.  
  - **Instructor Briefing**: “You’re anthropologists analyzing how a society’s material base shapes its culture. We’re running three rounds. Scoring is team-based—earn points by accuracy/insight.”  

  #### **1. Round 1: Prediction Asymmetry (30 mins)**  
  **Goal:** Experience base as *unconstraining for prediction*.  
  - **Task (15 mins)**:  
    Teams predict **all 5 superstructure items** (H, L, R, P, V) for *their own society* using *only the base* (forces, property, class, ecology). Write predictions on index cards (1 card per item).  
    **Example**: *“Society Alpha predicts: (H) Extended families”*  
  - **Scoring (10 mins)**:  
    - TA collects prediction cards.  
    - Teams receive *another team’s* dossier (e.g., Red gets Blue’s) and score predictions against the *actual* superstructure (provided on dossier back).  
    - Rate each prediction: 1 (poor), 2 (okay), 3 (excellent). TA averages scores per team.  
  - **Whiteboard (5 mins)**:  
    Post team scores. Ask: *“What was easy/hard? Did your base feel like it ‘determined’ outcomes?”*  
    **Key Insight**: Base feels vague for prediction → asymmetry.  

  #### **2. Round 2: Non-Discriminating Explanations (35 mins)**  
  **Goal:** Experience explanations as *compelling but non-discriminating*.  
  - **Task (15 mins)**:  
    Teams explain **one superstructure item** assigned by instructor (e.g., Red: H, Blue: L, Green: R, Yellow: P).  
    - Use *their society’s base* to explain *why* this item exists.  
    - Write on card: *“Society [X] has [item] because [base explanation]”*  
    **Example**: *“Society Alpha has nuclear families (H) because communal land reduces familial interdependence.”*  
  - **Matching Game (15 mins)**:  
    - TA shuffles explanation cards, reads each aloud.  
    - Teams guess which society the explanation refers to.  
    - TA tallies correct/incorrect guesses per explanation.  
  - **Scoring (5 mins)**:  
    - Explanation-writer team: 1 pt per *incorrect* guess (reward for ambiguity!).  
    - Guessing teams: 1 pt per *correct* guess.  
    **Whiteboard**: Post match rates (e.g., “Alpha-H: 1/3 correct”).  
    **Key Insight**: Plausible explanations often fit multiple bases → non-discriminating.  

  #### **3. Round 3: Selection Bias (25 mins)**  
  **Goal:** Experience *suitability criteria* as outcome-dependent.  
  - **Task 1: Pre-Outcome Criterion (10 mins)**:  
    Teams design a **suitability test** for political authority (P):  
    - *“What makes a form of authority ‘suit’ a base? Propose one measurable criterion.”*  
    - **Examples**: “Stability during crises,” “Efficiency in resource distribution.”  
    - Write criterion on whiteboard (e.g., “Red: Minimizes labor disputes”).  
  - **Task 2: Post-Outcome Revision (10 mins)**:  
    - Reveal actual authority forms (from dossiers).  
    - Teams: *Revise your criterion if needed to ‘fit’ your society’s outcome.*  
    - TA marks revisions on whiteboard (✓ if revised).  
  - **Scoring (5 mins)**:  
    - 2 pts if criterion *already fit* outcome without revision.  
    - 1 pt if revised to fit outcome.  
    - 0 pts if criterion *still doesn’t fit*.  
    **Whiteboard**: Post revision tally (e.g., “3/4 teams revised”).  
    **Key Insight**: Suitability criteria often reverse-engineered → selection bias.  

  #### **4. Debrief (15 mins)**  
  - **Guided Discussion**:  
    1. “In Round 1, why was predicting from a base harder than it seemed?” (→ Asymmetry)  
    2. “In Round 2, why could one explanation fit multiple societies?” (→ Non-discriminating)  
    3. “In Round 3, why did teams revise their criteria?” (→ Selection bias)  
  - **Connect to Marx**:  
    - “This is the functional explanation problem: ‘X exists because it benefits the base.’ But how do we test if it *had* to exist? What if alternatives also ‘suit’?”  
    - Note: Avoid “functional explanation” term until now.  
  - **Segue to Elster**: “Next week, we see if methodological individualism solves these issues.”  

  ---

  ### **Full Society Dossiers**  
  *(Back of each handout includes actual superstructure)*  
  **SOCIETY ALPHA**  
  - **Base**: Moderate-yield grain farming; iron tools; animal traction (oxen). Communal land; private tools/livestock. Farmer-laborers (85%), Land stewards (15%). Semi-arid plains; unpredictable rainfall.  
  - **Superstructure**:  
    - (H) Nuclear families  
    - (L) Customary law (verbal agreements)  
    - (R) Animism (spirits in nature)  
    - (P) Elected council of stewards  
    - (V) Pragmatism  

  **SOCIETY BETA**  
  - **Base**: Terraced rice farming; bronze tools; irrigation canals. State-owned land; hereditary use-rights. Peasants (75%), Bureaucrats (25%). Mountain valleys; seasonal monsoons.  
  - **Superstructure**:  
    - (H) Lineage-based clans  
    - (L) State-codified inheritance  
    - (R) Ancestor worship  
    - (P) Hereditary monarchy  
    - (V) Filial piety  

  **SOCIETY GAMMA**  
  - **Base**: Coastal fishing/foraging; sailboats; wood/stone tools. Clan-based shoreline territories; shared boats. Fishers (80%), Elders (20%). Dense coastline; typhoon risk.  
  - **Superstructure**:  
    - (H) Matrilocal extended families  
    - (L) Collective ownership norms  
    - (R) Ocean deity pantheon  
    - (P) Council of elders  
    - (V) Courage in storms  

  **SOCIETY DELTA**  
  - **Base**: Floodplain agriculture; copper tools; grain storage. Temple-controlled land; tenant farmers. Laborers (70%), Priests (30%). River delta; annual flooding.  
  - **Superstructure**:  
    - (H) Polygamous households  
    - (L) Divine law (contracts as oaths)  
    - (R) Monotheism (river god)  
    - (P) Theocratic priesthood  
    - (V) Obedience to authority  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Vagueness in Round 2**:  
     - Teams *will* write vague explanations to boost mismatch points (e.g., “Authority exists to stabilize society”).  
     - **Solution**: *Don’t punish*—use it in debrief: “Why did ambiguity help win? What does that say about real social explanations?”  

  2. **Diachronic Depth Missing**:  
     - **Confirmation**: Yes, the activity is synchronic (fit across societies), not diachronic (change over time). The base-superstructure thesis’s historical dimension (e.g., forces → relations conflict) is absent.  
     - **Mitigation**: Address in debrief: “Marx’s thesis is about centuries of change. Today’s game shows why judging ‘fit’ at one time is slippery—but doesn’t model historical dynamics.”  

  3. **Other Limitations**:  
     - **Oversimplified Bases**: Fictional societies lack real-world complexity (e.g., class struggle, ideology).  
     - **No Microfoundations**: Elster’s individualism objection (lack of mechanisms) isn’t modeled.  
     - **Student Frustration**: Skeptics may feel Round 2 “rewards bad science.” Use this: “Does Marxism incentivize flexible storytelling?”  

  4. **Logistical Hiccups**:  
     - Teams running behind: TA strictly enforces timers.  
     - Debate about scoring: Whiteboard transparency prevents disputes.  

  ---

  ### **Instructor Notes**  
  - **Why This Works**: The activity forces both camps into the same dilemmas. Skeptics confront the base’s ambiguity; sympathizers see how easily explanations become untestable.  
  - **Prep Work**: Pre-cut index cards, print dossiers (double-sided with superstructure hidden until needed).  
  - **TA Briefing**: Stress timekeeping and neutral scoring.  
  - **Final Tip**: If students resist the fictional frame, say: “This isn’t about Marx being right/wrong—it’s about whether *any* theory making this *kind of claim* can be tested.”  

  This design ensures your methodological focus lands experientially, priming students for Elster next week. Good luck!
