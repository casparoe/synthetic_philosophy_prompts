answer: |-
  ## Official Style & Execution Manual of the Pictorial Statistics Workshop
  **Städtisches Museum für Volkswirtschaft und Gesellschaft, [CITY NAME]**
  **Authorized by the Kommission für Volksbildung und Stadtentwicklung**
  **Under the Direction of Dr. Emil Hartwich**
  **Fifth Revision, Approved Workshop Committee, April 193[?]**

  **FOR THE ATTENTION OF ALL TRANSFORMERS, DRAFTSMEN, AND APPRENTICES**

  ### 1. PRINCIPLES OF THE VISUAL LANGUAGE
  The Workshop exists to translate the complex realities of social and economic life, as expressed in numerical data, into clear, memorable, and universally comprehensible pictorial forms. Our purpose is not the display of aesthetic refinement or historical curiosity, but the immediate communication of fact to the citizen, particularly the worker and the child, irrespective of linguistic or educational background. We operate on the foundational principle: **to remember simplified pictures is better than to forget accurate figures.**

  Our method constructs a true **Visual Language**. Each element is a deliberate signifier, bound by rules ensuring consistent interpretation. The goal is a system where the picture *is* the explanation. Captions are a failure of design. Our language deals exclusively with observable, physical realities – objects, actions, countable phenomena – ensuring its grounding in the concrete world accessible to all senses.

  ### 2. RULES OF CONSTRUCTION (MANDATORY)

  **2.1 Quantity Representation:**
     *   **Rule 1:** Quantity MUST be expressed through the repetition of identical, discrete unit figures. *Example: Five houses are represented by five identical house symbols.*
     *   **Rule 1a:** A single figure ALWAYS represents one unit. Scaling figures to represent quantity (e.g., one large house for five houses) is STRICTLY PROHIBITED. A large house is not five houses; it is merely a large house. The viewer cannot reliably discern whether comparison is by height, width, or area, introducing fatal ambiguity.
     *   **Rule 1b:** Where quantities are large, grouping (e.g., rows of five figures) is permitted for clarity, but each figure within the group MUST remain distinct and identical. Partial figures are FORBIDDEN.

  **2.2 Figure Design:**
     *   **Rule 2:** All figures MUST be reduced to the absolute minimum number of marks necessary for unambiguous recognition. Superfluous detail obscures meaning and burdens memory. *Example: A worker is a circle (head) attached to a rectangle (torso) with two lines (arms) and two lines (legs). Facial features, clothing details, tools (unless the *specific* tool is the subject) are EXCESSIVE.*
     *   **Rule 2a:** Figures MUST be presented in strict profile or elevation (front/rear view). Perspective, foreshortening, or three-quarter views introduce subjective interpretation and are FORBIDDEN.
     *   **Rule 2b:** Figures MUST be rendered in solid black silhouette on white ground, or vice-versa, using standardized stencil templates. Shading, hatching, or colour variation (beyond solid fills for differentiation per Rule 3.1) is PROHIBITED as it conveys no standardized meaning and risks misinterpretation.

  **2.3 Relationship & Context:**
     *   **Rule 3:** Differentiation between types of the same general category (e.g., different occupations, different commodities) MUST be achieved through clear, minimal modification of the base silhouette. *Example: A miner may be differentiated from a factory worker by the addition of a minimal lamp symbol on the helmet silhouette.*
     *   **Rule 3a:** Spatial arrangement conveys meaning. Proximity indicates association; separation indicates distinction. Alignment implies order or sequence. *Example: Figures arranged in a row below an arrow pointing upwards indicate increasing quantity over time.*
     *   **Rule 3b:** Arrows are the ONLY permitted abstract directional symbol. Their meaning (movement, direction, change, force) MUST be self-evident from context and consistent usage. Curved arrows are PERMITTED ONLY where necessary to avoid figure overlap and MUST NOT imply non-linear progression.

  **2.4 Chart Composition:**
     *   **Rule 4:** Every chart MUST contain a clearly defined "Key Area" displaying the unit figure alongside the numerical value it represents (e.g., [House Symbol] = 1000 Dwellings). This is the ONLY permissible use of numerals or words within the pictorial field.
     *   **Rule 5:** The overall arrangement MUST guide the eye logically through the represented facts, typically following conventions of reading (left-right, top-bottom). Flow MUST be self-evident.
     *   **Rule 6:** The chart MUST be self-contained. Interpretation MUST NOT rely on external captions, titles (beyond simple identifiers like "Coal Production 1925-1930"), or prior knowledge beyond the recognition of the minimal figures defined in the Key Area.

  ### 3. TROUBLESHOOTING & CLARIFICATIONS (Questions from the Print Shop Answered by the Workshop Committee)

  *   **Q (Print Shop):** How do we represent "No Accidents in Factory B this Quarter"? The chart for Factory A shows one accident figure. Leaving Factory B blank looks like we forgot it.
      *   **A (Workshop):** Represent Factory B with the standard factory building figure. The ABSENCE of the accident figure adjacent to it signifies "no accidents". Context supplies the meaning. *See Rule 3a (Separation = Distinction).* **Addendum to Rule 3a:** The presence of a primary subject figure (e.g., factory) without an associated event figure (e.g., accident) in the designated relationship position signifies the non-occurrence of that event for that subject. *(Approved Revision 4)*

  *   **Q (Print Shop):** Commission requested: "Likelihood of War in the Balkans." How to depict "likelihood"? We have no figure for "chance" or "probability."
      *   **A (Workshop):** "Likelihood" is not an observable physical fact. It is a prediction. We can only depict historical instances of mobilization, arms production, or treaties signed (observable facts). A chart titled "Arms Exports to Balkan States 1930-1935" conveys relevant, concrete facts from which likelihood might be inferred externally. We depict facts, not speculation. *Re-affirm Principle: Observable Physical Realities.*

  *   **Q (Print Shop):** Request: "Average Family Size in District VII." "Average" is problematic. We cannot draw half a child.
      *   **A (Workshop):** Depict a representative family silhouette. Ensure it is clearly labelled as "Representative Family, District VII" in the Key Area, alongside the numerical average figure (e.g., 4.2 Persons). The figure is a SYMBOL for the concept "family in District VII", not a depiction of 4.2 individuals. The numeral conveys the average. *Clarification to Rule 4: The Key Area may contain numerals defining statistical aggregates (e.g., average, total) pertaining to the representative figure displayed. The figure itself remains a whole unit representing the category.* **New Rule 6a:** Where aggregates are represented, the Key Area MUST explicitly state the nature of the aggregate (e.g., "Average Size", "Total Output"). *(Approved Revision 4)*

  *   **Q (Print Shop):** Chart returned: "Projected Effect of New School: IF we build it HERE, literacy rates MAY rise." How to depict "if," "may," and location emphasis ("HERE")?
      *   **A (Workshop):** Projections ("may") and conditionals ("if") fall outside the scope of depicting observable facts. Location emphasis ("HERE") can be achieved by placing the new school figure prominently within a minimal map outline of the district, distinct from other district symbols. The map outline is a permissible abstract spatial reference. The chart must be re-titled to depict concrete facts, e.g., "Current Literacy Rates by District" alongside "Proposed School Locations". The relationship (potential effect) must be inferred by the viewer from the juxtaposed facts. *Re-affirm Principle: Observable Physical Realities. Location is observable; conditionality is not.* **New Rule 3c:** Minimal map outlines (simple boundaries, key landmarks) are permissible solely for indicating geographical context or relative position of physical entities. *(Approved Revision 4)*

  *   **Q (Print Shop):** How do we represent "Debt"? We have coins and sacks (goods), but debt is an obligation, not a physical object.
      *   **A (Workshop):** Represent debt using the standardized "promissory note" figure (rectangle with minimal corner markings) adjacent to the debtor figure (e.g., worker silhouette) and pointing towards the creditor figure (e.g., bank building). The arrow signifies the direction of the obligation. *See Rules 3, 3a, 3b.* **New Standard Figure:** Promissory Note (Added Revision 3).

  ### 4. APPENDIX A: RETIRED SYMBOLS & CONVENTIONS
  *(Note: These symbols were trialled but withdrawn due to observed ambiguity, violation of core principles, or inability to scale effectively within the system. They are NOT PERMITTED in current work.)*

  *   **Symbol R1:** Figure with Diagonal Bar Through It (e.g., [Struck-Through House]).
      *   *Intended Meaning:* Absence, negation, prohibition of the thing.
      *   *Reason for Retirement:* Proven ambiguous in field testing. Does it mean "no houses," "destroyed houses," "houses not permitted," or simply "this symbol is invalid"? Contradicts Rule 6 (self-containment). Retirement enforced Revision 2.
  *   **Symbol R2:** Figure with Small Question Mark Attached (e.g., [House?]).
      *   *Intended Meaning:* Uncertainty, possibility, "perhaps" related to the thing.
      *   *Reason for Retirement:* Introduces unacceptable subjectivity and non-factual elements. What degree of uncertainty? How is it measured? Violates Principle of Observable Physical Realities. Retirement enforced Revision 1.
  *   **Symbol R3:** Secondary Figure Pointing at Primary Figure (e.g., [Small Man pointing at House]).
      *   *Intended Meaning:* Designation ("this house"), possession ("my house"), or relational emphasis.
      *   *Reason for Retirement:* Created significant confusion. Does the pointer indicate ownership, location, commentary, or merely draw attention? The pointer figure itself required interpretation (Who is pointing? Why?). Proved impossible to standardize without resorting to non-pictorial labels. Retirement enforced Revision 3. *(See Rule 3c for approved location emphasis alternative).*

  ### 5. THE MANUAL ITSELF
  The consistent application of these rules relies on the shared understanding engendered by this document. It is the foundation of our Visual Language. The question of how to depict the *rules* of depiction pictorially, for absolute universality, has been considered. While theoretically desirable, preliminary investigations concluded that a purely pictorial rulebook would necessitate:

  1.  A meta-symbol representing "Rule."
  2.  Figures representing complex concepts like "MUST," "PROHIBITED," "QUANTITY," "IDENTICAL."
  3.  A system for depicting the logical relationships between these concepts.

  Such a system would be recursive and potentially infinite. It would also violate the principle of depicting only *observable physical realities* ("MUST" is not observable). **Therefore, Rule 17:** The rules governing the Visual Language are communicated via this standardized written manual, utilizing the common textual language of the Workshop and Print Shop personnel. The symbols defined herein are considered sufficiently established within our operational context to render this manual intelligible to its intended users. The manual *itself* becomes a permitted, standardized symbol for "the rules" in any internal Workshop diagram concerning procedure. *(Approved Revision 4)*

  ---

  **END OF MANUAL**  
  **Städtisches Museum für Volkswirtschaft und Gesellschaft**  
  **Pictorial Statistics Workshop**  
  ***Wissen durch Bilder / Knowledge Through Pictures***
