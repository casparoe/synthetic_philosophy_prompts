  Need to invent names: museum (Städtisches Museum für Volkswirtschaft und Gesellschaft), director (Dr. Emil Hartwich), funding committee (Kommission für Volksbildung und Stadtentwicklung). The manual should have sections: principles, rules, troubleshooting, and an appendix of retired symbols. The troubleshooting section should highlight practical problems that expose theoretical flaws. For example, the print shop asking how to show "no accidents" leads to a rule that fails later.

