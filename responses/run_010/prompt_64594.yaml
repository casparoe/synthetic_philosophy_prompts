answer: |-
  This pattern reveals a deep philosophical tension in American public law, not reducible to any single moral theory. Let's dissect it systematically:

  **I. The Pattern's Moral Presuppositions: Beyond Scanlonian Contractualism**

  While the *merits stage* resembles Scanlon ("justification to each person separately"), the doctrine as a whole doesn't strictly require it. Alternative explanations fit key aspects:

  1.  **Threshold Deontology:**
      *   **Fits:** Standing doctrine and the rejection of trivial harms imply a threshold of cognizable injury below which no claim exists, regardless of numbers. The merits stage focuses on whether *this plaintiff's* rights (above the threshold) were violated.
      *   **Gaps:** Doesn't explain why aggregate harm *to others* can defeat relief at the preliminary injunction stage for a plaintiff with a *non-trivial* injury. The threshold is crossed, yet relief is denied based on others' harms.

  2.  **Rule-Consequentialism:**
      *   **Fits:** Explains doctrines as rules promoting systemic stability and efficiency. Standing prevents a flood of litigation over diffuse harms. Class actions aggregate claims efficiently where individual suits are impractical. Preliminary injunctions incorporate public interest to avoid disruptive rulings before full merits review.
      *   **Gaps:** Struggles to explain the *categorical* refusal at merits to weigh aggregate benefits against an individual's established right. If efficiency is paramount, why this bright-line rule?

  3.  **Institutional Competence & Structure:**
      *   **Fits:** Courts are designed for bilateral disputes between concrete parties with specific evidence. They lack tools (data, expertise, democratic legitimacy) to reliably measure aggregate social welfare or represent diffuse interests *as plaintiff*. Class actions are a procedural *exception* justified by necessity and strict judicial control. Preliminary injunction public interest is a limited, pragmatic check on drastic pre-trial relief.
      *   **Gaps:** Doesn't fully justify the *moral weight* seemingly given to the individual right at merits vs. its vulnerability to aggregate harms at injunction. It describes *how* the system operates, not necessarily the *moral principle* underlying the refusal to aggregate at merits.

  **Conclusion on Presuppositions:** The practice is **philosophically underdetermined.** Scanlonian contractualism best explains the core merits-stage logic ("justification to each person"). Threshold deontology fits the injury requirements. Rule-consequentialism explains the efficiency-oriented doctrines (standing filters, class actions). Institutional competence explains the structure's constraints. The system *commits* to:
  *   Individualized injury as the gateway (standing).
  *   Adjudicating the *plaintiff's* specific legal rights at merits, not conducting societal cost-benefit analysis.
  *   Permitting procedural aggregation *only* under strict conditions (class actions) for efficiency, not as moral aggregation.
  It *sits comfortably* with, but does not strictly require, a Scanlonian view. The preliminary injunction tension highlights this underdetermination.

  **II. Resolving the Tensions**

  1.  **Preliminary Injunction Public Interest vs. Non-Aggregative Merits:**
      *   **Function:** The public interest factor at the injunction stage is primarily a **hedge against error and a recognition of provisionality.** A preliminary injunction is granted *before* the court definitively rules on the merits. Weighing broader consequences acts as a safeguard:
          *   If the plaintiff *might* lose on merits, imposing massive disruption based on a preliminary finding is unjustified.
          *   It acknowledges the court's limited foresight and the potential irreversibility of an erroneous injunction.
      *   **Theory of Value vs. Rule of Decision:** This tension reveals the refusal to aggregate at merits is **primarily a rule of decision**, not a pure theory of value. The court values the individual right highly at merits. However, at the preliminary stage, where the right's violation is *not yet conclusively established*, the potential for catastrophic error *to others* justifies incorporating aggregate consequences pragmatically. It's a procedural concession, not a moral rejection of the plaintiff's claim's weight.

  2.  **Denial of Standing (Diffuse Harm) vs. Refusal to Aggregate at Merits:**
      *   **Distinct Principles:** These are related but distinct doctrines serving different purposes.
          *   **Standing (Diffuse Harm):** Focuses on **justiciability and plaintiff role.** It asks: Is *this person* the proper party to bring *this claim*? It holds that a plaintiff must demonstrate a concrete, particularized injury distinct from the general public to fulfill the Constitution's "case or controversy" requirement and ensure vigorous advocacy. It's about *who can sue*, not how the case is decided. The concern is inadequate representation and lack of a concrete stake.
          *   **Non-Aggregation at Merits:** Focuses on **adjudicative method.** It asks: How do we decide if *this plaintiff's rights* were violated? It holds that once standing is satisfied, the merits focus is on the plaintiff's injury and the government's justification *as it pertains to that plaintiff*, not a utilitarian calculus. The concern is protecting the individual from being overridden by the masses.
      *   **Relationship:** Standing ensures only plaintiffs with a sufficiently distinct stake get to the merits stage where the non-aggregative principle applies. They are complementary gatekeepers: standing filters *who* can assert rights, non-aggregation governs *how* those rights are adjudicated.

  3.  **Procedural vs. Moral Aggregation (Class Actions):**
      *   **Legitimacy Difference:** Class actions are a **procedural device for efficiency, not moral aggregation.** The key distinctions are:
          *   **Individualized Proof (Usually):** While certified as a class, members typically must prove (or settlement allocates based on) *individual harm* (e.g., specific overcharge, quantifiable damage). The fund division is *pro rata* based on *individual* loss, not a lump sum representing an aggregated moral claim.
          *   **Opt-Out Rights:** Members often have the right to exclude themselves and pursue individual claims, reinforcing the focus on individual injury.
          *   **Adversarial Process:** The class representative must adequately represent *each* member's interest in their individual recovery. The defendant defends against the *sum* of individual claims, not a collective moral harm.
      *   **Why Not Moral Aggregation?** Courts lack a mandate or methodology to adjudicate claims based purely on the *moral weight* of aggregated, diffuse harms absent concrete, particularized injuries traceable to the defendant for each claimant. Class actions solve a *litigation efficiency* problem for numerous *individually cognizable* injuries, not a *moral standing* problem.

  4.  **Trivial Injuries:**
      *   **Threshold Commitment:** The dismissal of trivial injuries, even if widespread, commits the system to a **threshold deontological view.** There is a minimum level of harm (concreteness, particularization, redressability) below which an injury is legally non-cognizable, regardless of how many suffer it. This threshold exists *prior to* and *independently of* pairwise comparison.
      *   **Role of Pairwise Comparison:** Pairwise comparison is the *adjudicative method* used *above the threshold*. It ensures that once an injury is deemed non-trivial and cognizable, the plaintiff's right is evaluated on its own terms against the government's justification *as it applies to them*, without being outweighed by aggregate benefits. The threshold defines *what counts* as a complaint; pairwise comparison defines *how that complaint is judged*.

  **III. Rebuilding on Aggregative Justification**

  A shift to a "straightforwardly aggregative theory" (e.g., utilitarianism) would necessitate profound changes:

  1.  **Doctrines Abandoned:**
      *   **Standing (Generalized Grievance Bar):** Diffuse harms affecting millions identically would be justiciable. A plaintiff alleging a $1 overcharge shared by 100 million could sue to enjoin the policy or recover aggregate damages. "Particularization" would lose its gatekeeping role if the harm is statistically significant.
      *   **Non-Aggregation at Merits:** Courts would *routinely* weigh total societal benefits against an individual's harm. A plaintiff's constitutional right could be overridden if the policy's aggregate net benefits are sufficiently large. The question would shift from "Was *this plaintiff's* right violated?" to "Does the policy maximize net social welfare?".
      *   **Trivial Injury Threshold:** As long as the *aggregate* harm is substantial, an individual's trivial injury would suffice for standing and potentially merit relief if the overall calculus favored it. Individual thresholds dissolve.

  2.  **Doctrines Surviving (Modified):**
      *   **Preliminary Injunction Test:** The "public interest" factor would become the *dominant* consideration, explicitly requiring courts to calculate net expected aggregate welfare. The other factors would be subsumed.
      *   **Class Actions:** Could become less crucial, as any plaintiff suffering a diffuse harm could sue for aggregate relief. However, they might survive as efficient vehicles for distributing compensation calculated on an aggregate basis.
      *   **Agency Deference:** Agencies routinely defend regulations via cost-benefit analysis (aggregating statistical lives, etc.). This practice would become the *model* for judicial review, not just agency justification.

  3.  **New Institutions Required:**
      *   **Office of the Public Advocate (OPA):** A government body (or court-appointed experts) would be essential to *represent the aggregate* in litigation. Since no individual plaintiff could adequately represent the diffuse benefits of a policy (e.g., millions saving $1 on a product due to a deregulation the plaintiff challenges), the OPA would intervene to present evidence and arguments on net social welfare. It would counter the plaintiff's claim of aggregate harm or champion the policy's benefits.
      *   **Judicial Expertise/Capacity:** Courts would need vastly enhanced resources for complex cost-benefit analysis, statistical modeling, and impact assessment – essentially functioning like regulatory agencies on a case-by-case basis.
      *   **New Remedies:** "Aggregate Injunctions" ordering government-wide policy changes based on net welfare calculations, and "Statistical Damages" funds distributed based on estimated probabilities of harm across a population, even to unidentified individuals.

  **Diagnosis:** The current system's tensions stem from its attempt to reconcile a core commitment to individualized justice and rights (reflected in standing and merits adjudication) with pragmatic concerns about error, disruption, and efficiency (reflected in preliminary injunctions and class actions). The "public interest" factor at injunction is the system's safety valve, allowing a form of aggregation *only* when the individual right hasn't been definitively established and the stakes of error are high. It's fundamentally a system built on **methodological individualism constrained by institutional pragmatism**, not a philosophically coherent whole. Rebuilding on pure aggregation would abandon individualism entirely, transforming courts into welfare-maximizing regulators requiring new representative structures to function. The tensions you identify are the fault lines between these competing impulses.
