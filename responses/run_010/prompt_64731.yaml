  Okay, the user is preparing for a seminar on formal epistemology, specifically focusing on the accuracy-first program's normative arguments. They're comfortable with the technical aspects but need a conceptual understanding of the tension between the dominance argument and epistemic consequentialism. Let me unpack their query step by step.

  First, they mention the dominance argument is framed as a non-teleological improvement over Dutch book arguments. The key here is sure-loss avoidance without maximizing. But Berker's critique targets epistemic consequentialism, which aggregates accuracy across propositions. The user wonders if this critique applies to the dominance argument itself or just to expected-accuracy justifications for updating norms.

  The technical detail about additivity being dropped is crucial. Since the dominance theorem works with just continuity and strict propriety, where does aggregation happen? The user suspects strict propriety might involve cross-world aggregation via expected inaccuracy. That's a sharp observation. I need to clarify the difference between aggregating across propositions vs. worlds.

  For (i), the distinction: Aggregating across propositions means summing inaccuracies for each world, like the Brier score does. But the dominance argument doesn't require this; it relies on global inaccuracy per world. Strict propriety involves expected inaccuracy, which aggregates across worlds weighted by credences. That's consequentialist because it calculates a weighted sum over possible outcomes. So dominance uses per-world inaccuracy, while strict propriety (for expected accuracy) uses cross-world aggregation.

  For (ii), an example: Consider credences in A, B, and A∧B. High credence in A and B, low in their conjunction. The incoherence isn't about individual inaccuracies but the relations. The dominance argument shows that any coherent alternative beats this globally in each world. The non-additive case (if I used a different measure) would still show dominance without summing per proposition. The key is the global score per world, not how it's built from parts.

  For (iii), does the sure-thing structure insulate from consequentialism? The dominance argument itself avoids aggregating across worlds; it's per-world. But strict propriety, needed for the theorem, does involve cross-world expectations. So Berker's charge might stick to strict propriety. However, the dominance reasoning is non-teleological—it's about avoiding sure-loss, not maximizing. The problem is that the justification for strict propriety might be teleological, creating tension.

  For (iv), the unity of the program: Static coherence via dominance is non-teleological, but dynamic arguments use expected accuracy, which is teleological. This bifurcation might not be fatal if the program can ground both parts differently. But it raises questions about whether the accuracy-first approach is unified or if different norms need different justifications.

  The user's deeper need is to lead a discussion on the normative foundations. They need clarity on where aggregation occurs, how Berker's critique applies, and whether the accuracy-first program's arguments are fundamentally coherent. They might also want to explore if epistemic norms can be justified without consequentialist reasoning.

  I should emphasize that the dominance argument avoids cross-world aggregation but relies on strict propriety, which doesn't. This distinction is key. The user's insight about strict propriety being consequentialist is correct. The challenge is whether strict propriety can be justified non-consequentially. If not, the dominance argument might inherit teleological elements indirectly. The seminar discussion could focus on whether this undermines the non-teleological claims of the accuracy-first program.
answer: |-
  Based on your deep grasp of the technicalities, let's dissect the conceptual anatomy of the dominance argument's justification and its vulnerability to Berker-style consequentialism critiques. The tension stems from conflating two distinct aggregation points and the normative logic underlying the key premises.

  **(i) Aggregation Across Propositions vs. Across Worlds: The Core Distinction**

  *   **Aggregation Across Propositions:** This refers to how a credence function's *total inaccuracy at a single possible world w* is calculated. For a credence function `c` defined over propositions `F1, F2, ..., Fn`, an *additive* inaccuracy measure `I(c, w)` sums the local inaccuracies: `I(c, w) = Σ_i l(c(Fi), v_w(Fi))`, where `l` is a loss function (e.g., Brier) and `v_w` is the truth-value at `w`. This explicitly treats propositions as separate units whose inaccuracies are summed.
  *   **Aggregation Across Worlds:** This refers to combining inaccuracy values *across different possible worlds*. This is fundamentally what *expected inaccuracy* does: `Exp_I(c) = Σ_w c(w) * I(c, w)`, weighting the inaccuracy at each world by the credence in that world. This aggregates the performance of `c` over the entire space of possibilities.
  *   **What Dominance Relies On:** The **strict dominance argument itself relies *only* on the assignment of a *single global inaccuracy score I(c, w)* to `c` *at each world w`.** It does *not* require `I(c, w)` to be computed by summing local inaccuracies (additivity), nor does it require comparing `I(c, w)` *across* worlds (expectation). Its logic is purely intra-world: For an incoherent `c`, at *every* world `w`, there exists *some* coherent `c*` such that `I(c*, w) < I(c, w)`. The geometric intuition (inaccuracy as distance, coherent credences as convex hull) perfectly captures this intra-world, global-score requirement. Additivity was a convenient way to generate suitable `I(c, w)`, but non-additive measures satisfying continuity and strict propriety also work precisely because they assign such global scores per world.

  **(ii) Worked Illustration: Why Distinction Matters & Where Aggregation Lurks**

  Consider an algebra with two atomic propositions, `A` and `B`, generating 4 possible worlds: `w1 (A=true, B=true)`, `w2 (A=true, B=false)`, `w3 (A=false, B=true)`, `w4 (A=false, B=false)`. An agent has credences:
  *   `c(A) = 0.9`
  *   `c(B) = 0.9`
  *   `c(A∧B) = 0.1`

  This violates coherence (conjunction constraint: `c(A∧B)` should be at least `c(A) + c(B) - 1 = 0.8`).

  *   **The Dominance Step (Intra-World, Global Score):** Focus on world `w1` (`A` true, `B` true, so `A∧B` true). The true values are `v_w1(A)=1`, `v_w1(B)=1`, `v_w1(A∧B)=1`.
      *   Calculate `I(c, w1)` using Brier: `[ (0.9-1)^2 + (0.9-1)^2 + (0.1-1)^2 ] = [0.01 + 0.01 + 0.81] = 0.83`.
      *   Consider a coherent alternative, e.g., `c*(A)=0.8`, `c*(B)=0.8`, `c*(A∧B)=0.8`. `I(c*, w1) = [ (0.8-1)^2 + (0.8-1)^2 + (0.8-1)^2 ] = [0.04 + 0.04 + 0.04] = 0.12`. `0.12 < 0.83`. Similar dominance can be shown for `c` compared to *some* coherent `c*` at `w2`, `w3`, and `w4`. Crucially, **this dominance comparison happens *within* each world, using the *total* inaccuracy score at that world.** It doesn't matter *how* `I(c, w1)=0.83` was calculated (sum or not), only that this single number represents `c`'s overall inaccuracy at `w1` and that a coherent alternative has a smaller number *at that same world*. The incoherence manifests in the poor *global* fit at worlds like `w1`, not in any single local inaccuracy (`c(A)=0.9` is quite accurate at `w1`!).
  *   **Where Aggregation Appears (Strict Propriety):** The dominance argument requires that the coherent credences are *exactly* the undominated ones. This relies on the inaccuracy measure satisfying **strict propriety**. Strict propriety states that for any probability function `p`, the function `c` that minimizes the *expected inaccuracy* `Exp_I(c)` *relative to p itself* is `c = p`. This involves **aggregation across worlds**: `Exp_I(c) = Σ_w p(w) * I(c, w)`. Minimizing this expectation requires trading off performance at different worlds, weighted by `p(w)`. **Strict propriety is defined via cross-world aggregation (expectation).** Its justification within the accuracy-first program is often consequentialist: an agent with credences `p` *ought* to adopt the credences `c` that maximize their *expected accuracy* (minimize expected inaccuracy) *according to their own lights* (`p`). This is a core teleological element.

  **(iii) Sure-Thing vs. Consequentialism: Does Dominance Insulate?**

  *   **The Sure-Thing Logic:** The dominance argument itself is **not teleological** in the maximizing sense. It says: *Regardless* of which world `w` is actual, `c` is strictly worse than some `c*` at `w`. Adopting `c` guarantees you could have done strictly better in terms of accuracy at the actual world, no matter what. It's a "sure-loss" of accuracy relative to coherence. There is no appeal to maximizing a quantity (like expected accuracy) or trading off performance at one world for gains at another. The flaw is categorical per world.
  *   **Berker's Charge & Where it Lands:** Berker's primary target *is* the aggregation inherent in defining epistemic value (accuracy) as a sum of local accuracies. He argues this treats propositions as separate "buckets" for value, allowing trade-offs (sacrificing accuracy on one proposition for gains on another), leading to problems like epistemic injustice or believing against evidence if it maximizes expected accuracy. **However, the dominance argument sidesteps the *direct* force of this charge regarding aggregation *across propositions* because:**
      1.  Dominance works with non-additive `I(c, w)`. The global score per world need not be built by summing local losses. The "separateness" of propositions isn't essential.
      2.  The logic doesn't involve trade-offs *between worlds* or *between propositions*. It shows a categorical flaw per world.
  *   **The Indirect Vulnerability (Strict Propriety):** The dominance argument's reliance on strict propriety is its vulnerability. **Strict propriety is fundamentally teleological and relies on cross-world aggregation.** Its justification requires accepting that epistemic rationality involves maximizing expected accuracy (minimizing expected inaccuracy) *from the agent's perspective*. This *is* a form of epistemic consequentialism: the right credence `c` is the one that produces the best *expected* epistemic outcome (accuracy) according to the agent's current credences `p`. Berker's critique of consequentialism (aggregation permitting problematic trade-offs) applies directly to the *justification of the premise* (strict propriety) needed to make the dominance argument fully normative and link coherence to non-dominance. While dominance avoids maximizing in its *conclusion*, it *depends on a premise justified by maximizing expected utility (accuracy)*.

  **(iv) Unity of the Accuracy-First Program: A Bifurcation?**

  The static dominance argument for coherence and the dynamic arguments for updating (e.g., conditionalization via minimizing expected inaccuracy) have fundamentally different normative structures:

  1.  **Static Coherence (Dominance):** Non-teleological (sure-loss avoidance). Relies on intra-world global inaccuracy scores and a premise (strict propriety) justified teleologically via cross-world aggregation (expectation).
  2.  **Dynamic Updating (e.g., Conditionalization):** Teleological. Directly justified by maximizing expected accuracy (minimizing expected inaccuracy) from the prior perspective.

  **What Follows:**

  *   **The Program is Bifurcated:** The core justifications for static and dynamic norms within the accuracy-first program *are* different in kind. The static argument is a dominance/sure-loss argument leveraging a teleologically justified premise. The dynamic arguments are straightforwardly consequentialist (maximize expected accuracy).
  *   **Is this Fatal?** Not necessarily, but it requires care:
      *   **Option 1 (Embrace Teleology):** Ground both strict propriety *and* the updating norms in epistemic consequentialism. This unifies the program under consequentialism but surrenders the claim that dominance is non-teleological in its foundations.
      *   **Option 2 (Seek Non-Consequentialist Ground for Strict Propriety):** Find a justification for demanding strictly proper measures that doesn't appeal to maximizing expected accuracy. This is challenging. Some argue strict propriety is constitutive of measuring "accuracy" meaningfully, or follows from other coherence constraints, but these arguments are complex and contested.
      *   **Option 3 (Minimize Teleology):** Accept the bifurcation. Argue that the dominance argument's *conclusion* (avoid sure-loss incoherence) is compelling independently of *why* strict propriety holds, perhaps because strict propriety is a minimal, plausible constraint on any reasonable accuracy measure. The teleological foundation is then a "weak link" but not necessarily fatal if the conclusion stands firm.
  *   **Challenge to Unity:** The bifurcation weakens the claim of a single, unified "accuracy-first" justification for all epistemic norms. The static and dynamic norms rest on distinct normative logics (sure-loss avoidance vs. expected utility maximization), even if both involve the concept of accuracy.

  **Conclusion on the Dispute:**

  The dispute with Berker hinges significantly on **the logic of normative argument**. Berker targets consequentialist logic (maximizing an aggregated good). Your insight is correct: **Aggregation across propositions is *not* essential to the dominance argument itself, but aggregation across worlds *is* essential to the justification of strict propriety, a key premise.** Therefore:

  1.  The dominance argument *as a formal result* (incoherent `c` dominated, coherent `c*` not) is not intrinsically consequentialist; its logic is sure-loss avoidance based on per-world global scores.
  2.  However, the **normative force** of the dominance argument for *requiring* coherence depends critically on the premise that rational inaccuracy measures must be strictly proper. The canonical justification *for* strict propriety *is* consequentialist (minimize your expected inaccuracy). This makes the overall *justification package* vulnerable to critiques of epistemic consequentialism, though not in the way Berker initially framed it (targeting propositional aggregation).
  3.  The distinction between propositional and cross-world aggregation is crucial for pinpointing this vulnerability. Berker's charge, if it lands, lands on the teleological justification of strict propriety, not directly on the dominance comparison.
  4.  The accuracy-first program faces a choice: unify under consequentialism (embracing teleology for both static and dynamic norms), find a non-consequentialist basis for strict propriety (difficult), or accept a bifurcated normative foundation.

  This landscape isn't fully settled. Whether strict propriety *can* be grounded non-teleologically, or whether epistemic rationality *must* ultimately involve a form of consequentialism (even for static coherence), remains a live debate. Your seminar is grappling with the precise nerve of this foundational tension.
