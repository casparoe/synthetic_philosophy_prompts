  Where to strengthen this... First, I should emphasize how Darwin's reliance on associationist staples (temporal persistence, mental comparison, habit-formation) undermines his anti-empiricist claims. Second, the inheritance point is crucial - if habits become instincts across generations, the nature/nurture boundary blurs. Third, we should stress how praise/blame operate through associative conditioning, not innate programming. 

  The user might also appreciate noting Darwin's contemporary Spencer directly fused associationism with evolution. And that Darwin's "moral sense" requires social feedback loops indistinguishable from utilitarian accounts. 

