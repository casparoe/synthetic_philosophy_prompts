  The user points out several key elements: enduring instincts outlasting momentary impulses, after-the-fact comparison between faded impulses and persistent instincts, and the role of praise/blame/habit. They're particularly sharp on the potential collapse of Darwin's distinction if "instinct" functions identically to "inherited habit" - especially since Darwin believed in inheritance of acquired characteristics. 

