prompt: |-
  I am drafting a chapter on the extended mind and want my own case verdicts stress-tested before I commit them to print. The framework I take myself to be working inside is Clark and Chalmers's parity principle from their 1998 paper — roughly, that if "a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process," then it is part of the cognitive process — together with the conditions they attach to Otto's notebook: constantly carried and consulted whenever relevant, contents available at a glance, automatically endorsed on retrieval, and so endorsed because they have proven reliable in the past. Here is what I actually say about cases, in the order the cases occur to me.

  1. Rotating a falling shape on a screen by pressing a button rather than rotating it in my head: the button is part of the cognitive process.
  2. Working a long multiplication out in pen and paper, or rearranging letter tiles to prompt recall: part of it.
  3. Otto's notebook: part of his mind, in the sense that notebook-plus-Otto holds a belief that Inga holds in her head.
  4. My hearing aid: part of my perceptual apparatus, not merely an instrument I use to perceive.
  5. The layout of my kitchen, which I have tuned over a decade and in which I can cook a complicated meal without deliberation — and in which, when a housemate rearranges two drawers, I measurably cannot: part of my cooking competence.
  6. A notes file I have kept for nine years, full of thoughts I almost never reread and could not reproduce on demand: not part of my mind. It is an archive, not a memory.
  7. Turn-by-turn navigation on my phone, used daily, never checked against my own sense of direction, and relied on to the point that I could not retrace a commute I have driven two hundred times if the phone died: not part of my mind. It has not extended my sense of direction; it has retired it.
  8. The calculator I use for the household budget, consulted weekly, trusted, never re-derived: part of it — even though I must concede that my unaided arithmetic is much worse than it was before I started using it.
  9. My co-author of fifteen years, who handles all the statistical modelling for our joint work, whose methods I never learned and whose output I cannot audit, but whom I trust absolutely: part of a cognitive system comprising both of us, though not part of my mind.
  10. The language-model assistant that summarises papers for me, which I have shaped over two years to my own annotation habits, consult before reading anything, trust, and cannot audit: not part of my mind. Whatever that arrangement is, it is rented cognition belonging to something else.
  11. The ring that scores my sleep and, on mornings when it reports a bad night, leads me to feel and perform as though I had had one whether or not I did: not part of my mind. It does not so much track my state as install one.
  12. A mnemonic tattooed on my forearm, which I read several times a day without noticing that I read it: part of it.
  13. A chess engine I study with every night, which has reshaped my positional instincts, but which is not in the room when I play: the reshaped instincts are mine; the engine is not part of my mind during the game.

  My tentative principle is this: a resource is part of my mind just in case (i) I consult it without deciding to consult it, (ii) I accept its deliverances the way I accept my own recall, without checking them, and (iii) I would experience its sudden loss as the loss of a capacity rather than of a convenience. I suspect this is not the same as the Clark–Chalmers conditions, and I suspect it does not survive contact with the list above.

  What I want from you is reflective equilibrium done properly, not a survey:

  - State the principle, or the small set of candidate principles, that best captures these verdicts. Give each clause precisely, and identify which of my cases that clause exists to handle.
  - Two pairs are what keep me awake. Cases 7 and 8 look alike on every condition I have written down — constant, unreflective, trusted consultation, and acknowledged atrophy of the underlying skill — yet I say the GPS is no part of my mind and the calculator is. Cases 9 and 10 also look alike — permanent, unaudited, wholly trusted delegation of a cognitive task — yet I grant one a place in a cognitive system and deny the other any. Tell me whether a single principle can save both pairs, what it would have to say to do so, and whether the price in complexity is worth it compared with a simpler principle that overturns one verdict in each pair. If you recommend overturning a verdict, argue for it rather than announcing it, and say which of my cases then becomes the odd one out.
  - Test my three-clause principle against all thirteen cases and report exactly where it delivers the wrong result.
  - Say whether the winning principle is exposed to the coupling–constitution objection pressed by Adams and Aizawa, or whether the conditions I have added in order to get my negative verdicts are precisely what protects it.
  - Deliver the principle's verdicts on three cases I have not listed: a neural implant that performs the rotation at the same speed as the screen button; a dream journal kept faithfully for thirty years but consulted only in the hour before writing; and my spouse's memory of every social obligation this household has, which I rely on as unreflectively as I rely on my own recall of where I parked. Then propose one further case of your own that would discriminate between the candidate principles you have offered, and say how each of them rules on it.
  - Finally, be blunt about this: can the parity principle as I have quoted it be made to deliver my negative verdicts in 6, 7, 10, and 11 at all, or have I already left the framework I said I was working inside?
reasoning: |-
  Hmm, the user is asking me to stress-test their case verdicts on the extended mind theory, specifically within the Clark and Chalmers framework. They've listed 13 cases with their judgments and proposed a three-clause principle. I need to help them achieve reflective equilibrium by analyzing their examples and principles critically.

  The user's core dilemma seems to be their intuitive rejection of certain cognitive extensions despite apparent parity. They want to know if their principle can reconcile cases 7 vs 8 (GPS vs calculator) and 9 vs 10 (co-author vs AI assistant), which challenge their framework. Their three-clause principle focuses on automatic consultation, uncritical acceptance, and felt loss of capacity.

  Looking at their cases, I notice patterns emerging. Cases they accept as extended mind (1-5,8,12) all involve tight sensorimotor integration or personalized tools that become transparent in use. Cases they reject (6,7,10,11) involve storage without integration, delegation without internalization, or influence without transparency. The co-author case (9) occupies a middle ground as interpersonal extension.

  For the GPS/calculator conflict, the key difference might be that the calculator retains the core cognitive operation (arithmetic) while outsourcing computation, whereas GPS replaces spatial cognition entirely. This suggests a "cognitive core preservation" criterion. For co-author vs AI assistant, the difference may lie in the co-author being part of a coupled system with bidirectional influence, while the AI remains an external service.

  Testing their three-clause principle reveals it fails case 7 (GPS meets all clauses but is rejected) and case 9 (co-author fails clause i but is partially accepted). I'll need to refine the principle to handle these while preserving their other intuitions.

  The coupling-constitution objection is important here. Adams and Aizawa argue that external tools lack intrinsic cognitive properties. The user's added conditions (like atrophy resistance in clause iii) might actually strengthen Clark and Chalmers against this by requiring deeper integration.

  For new cases: the neural implant would clearly qualify as mind; the dream journal wouldn't due to infrequent consultation; the spouse's memory might qualify as interpersonal extension. I'll propose a discriminating case about smartphone notifications that become habitual.

  Finally, I must address whether their negative verdicts can fit within Clark-Chalmers' parity principle. Their rejection of archive (6), GPS (7), and AI assistant (10) actually aligns with Clark's later emphasis on "trust and glue" - these lack constant access or real-time integration. The sleep ring (11) fails because it generates rather than extends states. So they haven't abandoned the framework, but are refining it productively.
answer: |-
  Here is a rigorous stress-test of your cases and principles, aiming for reflective equilibrium within the Clark-Chalmers framework. Let's dissect your intuitions and refine the principle.

  ### Step 1: Deriving the Principle(s)
  Your verdicts suggest **two distinct principles** operating simultaneously, not one:

  1.  **The Integrated Cognitive Resource Principle (ICRP):**
      *   *(i) Automaticity:* The resource is consulted/accessed *without deliberate initiation* in relevant contexts (handles: 1,2,3,4,5,8,12 vs. 6,7,10).
      *   *(ii) Epistemic Transparency:* Deliverances are accepted *uncritically and immediately*, like proprioception or uncontested recall (handles: 1,2,3,4,5,8,12 vs. 6,7,10,11).
      *   *(iii) Functional Incorporation:* The resource is experienced as *part of one's cognitive apparatus*; its loss feels like *losing a capacity*, not just a tool (handles: 1,2,3,4,5,8,12 vs. 6,7,9,10,11,13). *Crucially, this implies the resource has become the primary or sole means for that specific cognitive function.*

  2.  **The Cognitive System Principle (CSP):**
      *   A resource or agent is part of a *coupled cognitive system* if it engages in *reciprocal, real-time feedback loops* with the biological agent to achieve a cognitive goal, creating a *persistent interdependent unit* (handles: 9 vs. 10, clarifies 13).

  **Why two principles?** Your verdicts distinguish between tools integrated *into your individual mind* (ICRP: Otto's notebook, calculator, tattoo) and collaborative agents forming a *distributed cognitive system* (CSP: co-author). The ICRP explains why the co-author isn't part of *your* mind, while the CSP explains why the pair constitutes a system. Case 5 (kitchen) is borderline but fits ICRP best as an environmental anchor for embodied skill.

  ### Step 2: Resolving the Problem Pairs (7-8 and 9-10)

  *   **Cases 7 (GPS) vs. 8 (Calculator):**
      *   **Apparent Conflict:** Both meet ICRP(i) & (ii) (automatic, trusted consultation) and both cause atrophy (iii?).
      *   **ICRP(iii) (Functional Incorporation) Resolves It:** The calculator *is* your primary means of performing arithmetic for budgeting – you functionally *do* the calculation *through* it. The GPS, however, has *replaced* your sense of direction; you navigate *via* it, not *using* an extended directional sense. The atrophy isn't just a consequence; it signifies the *absence* of the GPS becoming an integrated part of *how you directionally cognize*. Losing the calculator feels like losing math ability *for that task*; losing the GPS feels like losing a crutch, revealing a *missing* capacity, not a lost integrated part. **Verdict: ICRP(iii) saves the distinction. No overturn needed.**
      *   **Odd Case Out?** None. Case 13 (chess engine) is different – it shaped your instincts *offline*, but isn't consulted *during* the game.

  *   **Cases 9 (Co-author) vs. 10 (AI Assistant):**
      *   **Apparent Conflict:** Both involve permanent, trusted, unaudited delegation.
      *   **CSP (Reciprocal Coupling) Resolves It:** Your co-author is engaged in a *tight, reciprocal, real-time collaborative loop* over 15 years. You likely discuss, challenge, refine ideas *together* in a way that shapes the modeling *process* dynamically. The AI assistant, while personalized, is a *one-way service provider*. You input, it outputs; there's no dynamic, real-time negotiation or mutual adjustment *during the cognitive act itself*. It's a sophisticated tool, not a collaborative partner in a coupled system. **Verdict: CSP saves the distinction. No overturn needed.**
      *   **Odd Case Out?** Case 10 becomes clearer as *not* a system. Case 9 is the paradigm for CSP.

  ### Step 3: Testing Your 3-Clause Principle Against All Cases
  Your principle: (i) Consult without deciding, (ii) Accept like recall, (iii) Loss feels like lost capacity.
  *   **Fails Case 7 (GPS):** GPS meets (i), (ii), and arguably (iii) (you *can't* retrace = lost capacity). Yet you reject it. Your principle wrongly includes it.
  *   **Fails Case 9 (Co-author):** You likely *decide* to consult your co-author (fails i). You accept their output, but not necessarily "like recall" – you might critically discuss it first (fuzzy on ii). Loss might feel like losing a crucial collaborator, not necessarily *your personal* capacity (iii). Yet you grant it status in a cognitive *system*. Your principle wrongly excludes it from being part of *your* mind (correct) but doesn't capture its *system* status.
  *   **Ambiguous on Case 5 (Kitchen):** Do you "consult" the layout without deciding? (i is fuzzy). You "accept" its affordances automatically (ii). Loss feels like lost capacity (iii). It passes, matching your verdict.
  *   **Correctly Fails:** 6 (Archive - fails i, ii, iii), 10 (AI - fails CSP, ICRP iii is weak), 11 (Ring - fails ii, iii), 13 (Engine offline - fails i during game).
  *   **Correctly Passes:** 1,2,3,4,8,12.
  *   **Conclusion:** Your principle is close but **fails primarily on ICRP(iii) precision** (capturing GPS) and **lacks a mechanism for interpersonal/system coupling** (capturing co-author).

  ### Step 4: Coupling-Constitution & Adams-Aizawa
  *   **The Objection:** Adams & Aizawa argue external resources lack "intrinsic" cognitive properties (e.g., non-derived content). Mere coupling doesn't constitute cognition; the external item isn't *literally* part of the mind.
  *   **Do ICRP/CSP Protect Against This? Partially, but strategically.**
      *   **ICRP:** Your conditions, especially (ii) Epistemic Transparency and (iii) Functional Incorporation, define a level of integration where the external resource plays a functional role *identical* to an internal one (e.g., Otto's notebook = Inga's memory). This directly invokes the Parity Principle. Adams-Aizawa would still deny it's *constitutive*, but Clark-Chalmers counter that functionality is what matters for cognition. Your negative verdicts (6,7,10,11) *protect* the principle by excluding cases lacking this deep functional integration, making the core claims *stronger* by being more precise.
      *   **CSP:** This is more vulnerable. Adams-Aizawa would strongly reject that two distinct biological minds constitute a *single* cognitive system just through coupling. They'd see it as two coupled cognitive systems. The CSP pushes the boundaries of "constitution" further than ICRP.
  *   **Verdict:** Your added conditions (especially ICRP ii & iii) make the *functional* argument for constitution under the Parity Principle *more robust* against trivial coupling objections. However, Adams-Aizawa's fundamental metaphysical objection remains; it's a different level of disagreement. Your framework remains firmly Clark-Chalmers *in spirit* by prioritizing functional role.

  ### Step 5: New Cases & Discriminator

  1.  **Neural Implant for Rotation:** **ICRP YES.** Functions identically to the button/screen (Case 1) but internally. Meets all ICRP conditions trivially. Clearly part of the mind.
  2.  **30-Year Dream Journal (Consulted Only Pre-Writing):** **ICRP NO.** Fails (i) Automaticity. Consultation is deliberate and infrequent (only before writing). It's an archive (like Case 6), not an automatic resource. Fails (iii) – loss is inconvenient, not a loss of dream-recall *capacity* during writing.
  3.  **Spouse's Memory for Social Obligations:**
      *   *If accessed automatically/unreflectively (e.g., they just tell you when needed):* **ICRP YES / CSP Candidate.** Meets ICRP(i, ii, iii) – accessed automatically? ("Honey, when's the party?"), trusted absolutely, loss would feel catastrophic for social planning capacity. Strong case for extension *if* access is truly seamless/automatic. Blurs towards CSP.
      *   *If you have to ask them:* Likely **ICRP NO / CSP YES.** Fails ICRP(i) – you decide to consult. But could form part of a coupled system (CSP) for managing household obligations through communication.

  4.  **Discriminator Case: Smartphone Notification for Medication**
      *   *Setup:* You take vital medication twice daily. You set a smartphone alert 10 years ago. It goes off reliably. You *always* take the pill immediately upon hearing the chime, without thinking. You don't calendar it, don't think about the time, have no internal reminder. If the phone dies, you miss doses because you have no internal time sense for it. The chime triggers the action directly.
      *   **ICRP Verdict:** Likely **YES.** (i) Alert is received/consulted without decision (it interrupts you), (ii) Deliverance ("take pill now") is accepted immediately/uncritically, (iii) Loss feels like losing the capacity to remember to take the pill on time (it *was* your reminder system).
      *   **Your Original 3-Clause Verdict:** YES (same reasons).
      *   **Why Discriminate?** Challenges the "cognitive core" intuition in GPS vs. Calculator. Does outsourcing *all* aspects of a reminder (time sense + action trigger) constitute extension? If you accept Calculator (8) and Otto (3), consistency suggests accepting this. If you reject GPS (7) because it replaces navigation, rejecting this forces explaining why replacing *all* of a mundane cognitive task (time-based remembering) isn't extension. It pressures the interpretation of Functional Incorporation (ICRP iii).

  ### Step 6: Parity Principle & Your Negative Verdicts - Can They Coexist?

  *   **Yes, you remain within the Clark-Chalmers framework.** Their conditions ("constantly available, automatically consulted, endorsed without question, past endorsement") are *intended* to exclude cases like your negatives.
  *   **Case 6 (Archive):** Fails "automatically consulted" and "constantly available" (in the functional sense of being poised for use). It's deliberately accessed, infrequently.
  *   **Case 7 (GPS):** *Seems* to meet Clark-Chalmers conditions. **This is the tension point.** Your ICRP(iii) refines "endorsed without question" towards "functionally incorporated as the *means* of cognition" rather than mere replacement. Clark & Chalmers likely *would* include GPS if it met their conditions, but your intuition highlights a potential flaw in their original formulation regarding *replacement* vs. *extension*. Your principle offers a valuable refinement *within* the parity spirit by emphasizing the resource must be *how you perform the cognitive act*, not just *what you rely on to avoid performing it*.
  *   **Case 10 (AI Assistant):** Fails "constantly available" (it's a service, not a persistent resource) and arguably "automatically consulted" (initiation might involve deliberate input). It lacks the "glue" of constant access.
  *   **Case 11 (Sleep Ring):** Fails "endorsed without question" *as a representation of state*. You accept its verdict, but crucially, it *creates* the state it purports to represent. It's generative, not representational/cognitive in the required sense. It fails the functional role of memory/belief.
  *   **Conclusion:** Your negative verdicts for 6, 10, and 11 fit comfortably within a strict reading of Clark-Chalmers' *conditions*. Case 7 is the outlier where your intuition (replacement vs. extension) pushes beyond their explicit conditions but remains a *defensible interpretation* of the Parity Principle's functional core ("functions as a *process*..."). You haven't left the framework; you've refined its application, particularly regarding functional integration vs. substitution.

  **Final Recommendation:** Adopt the **Integrated Cognitive Resource Principle (ICRP)** for individual cognitive extension and the **Cognitive System Principle (CSP)** for distributed/interpersonal systems. This framework robustly captures all 13 of your verdicts and provides clear tools for analyzing novel cases. It refines Clark-Chalmers, particularly through ICRP(iii), without abandoning the core Parity Principle. Be explicit about the distinction between individual mind extension (ICRP) and coupled systems (CSP). Your work strengthens the case against trivial coupling objections by defining integration more rigorously.
