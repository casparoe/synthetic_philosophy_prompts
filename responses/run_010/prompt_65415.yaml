prompt: |-
  Ok so this is half history question and half psychology question and I don't know where to file it. Last spring my school had this tradition where the seniors took over the faculty parking lot for a week in April — chain across the entrance, someone brought a grill, everybody knew it was "allowed" because it had always happened and two of the teachers had done it themselves when they were students here. Then in about a month and a half it just... ended. Nobody got suspended, there was no assembly, the paper didn't run anything, no one convinced anybody of anything. One senior said she wasn't doing it this year and why, and within two weeks the whole thing was dead and it hasn't came back. Same shape with a thing my older cousins used to say as an insult in middle school — they said it constantly, nonstop, and now they all insist they never meant anything by it and always thought it was a dumb thing to say.

  Here's the part I can't find a word for. Once the parking lot thing was over, basically everyone started reporting that they'd always thought it was stupid. Not "I changed my mind" — always. Including people I have texts from three weeks earlier hyping it up. And I don't think they're all just lying, and I don't think it's ordinary bad memory, because they're not misremembering details of what happened. It's more like once the thing stopped being a thing, the reason they had for being into it stopped making sense, so the old attitude became unavailable to them — not embarrassing to admit, just unreconstructable. My history teacher, when I brought this up, mentioned some historian who argued that killing the slave trade wasn't really about people getting morally persuaded but about it not paying anymore, and I also keep hearing people reference a book about dueling and honor codes. But neither of those seems to be aimed at what I'm noticing, which is the collapse happening with no argument in the air at all, plus the retroactive "I always knew."

  So does this have a name? I don't want a label I can slap on it, I want to know what the concept actually is and where it stops. I think there might be two separate things braided together and I can't tell if they're one phenomenon or two: (a) a norm that everybody goes along with and almost nobody privately endorses, which then dies very fast once the belief that everyone else endorses it cracks, and (b) the afterwards part, where people lose access to the attitude they used to have and can't even describe it from the inside anymore.

  Format, please:
  - **Short answer** — two or three sentences: is there an established term for (a), for (b), and for the combination? And if you think it's really one phenomenon and not two, say so here and argue for it later, don't just split the difference to be safe.
  - **Nearest concepts** — four or five candidates, a short paragraph each. For each one, don't just define it, tell me specifically how the parking lot story does and doesn't fit, and what it would have to look like to be a clean example.
  - **The edges** — a paragraph or two on boundary cases: what would have to be different for it to NOT be this thing? (like if there had been a real argument, or if everyone kept doing it but stopped mentioning it, or if it collapsed because one person got caught)
  - **Name it** — if nothing covers both halves together, coin a term for the combination, define it in one or two sentences, and say what the term deliberately excludes so it doesn't just become a synonym for "people change."
reasoning: |-
  Okay, let me unpack this query. The user describes two phenomena: a sudden collapse of a social norm without visible debate (like the senior parking lot tradition), followed by collective memory distortion where participants claim they never truly believed in it. They're asking for conceptual framing of this dual process.

  The core tension seems to be between social psychology and history of norms. The parking lot example is fascinating - it demonstrates how norms can be maintained purely through pluralistic ignorance, where public compliance masks private skepticism. The memory aspect is trickier; it's not mere forgetting but an active reconstruction of past attitudes. 

  For the short answer, I consider three established concepts: pluralistic ignorance covers the collapse mechanism (a), while cognitive dissonance reduction explains the retrospective attitude shift (b). But they're distinct processes - the first enables the collapse, the second cleans up the cognitive aftermath. No single term captures both.

  Looking at nearby concepts:
  - Pluralistic ignorance fits (a) perfectly but doesn't address the memory rewrite. 
  - False consciousness is too ideological for this neutral example.
  - Preference falsification describes strategic behavior but not the psychological aftermath.
  - Effort justification would require actual suffering, absent here.
  - Norm cascade describes the collapse but not the memory effect.

  For boundary cases, key differentiators are:
  - No moral conversion (vs abolitionism)
  - No enforcement change (vs stopped-but-secretly-continued norms)
  - No visible tipping point (vs MeToo where people openly changed stance)

  Since no term covers both phenomena, I propose "mnemonic disownership" for the memory aspect, distinguishing it from mere forgetting. The combined process could be called "pluralistic collapse with normative disalignment" - but that's mouthful. The user seems to want precision over catchiness though.

  The history teacher's slave trade reference is apt but different - that involved material incentives changing, whereas here the incentive was purely social. The dueling analogy works better for the honor-as-currency aspect.

  What's especially perceptive is how the user notices the absence of argument. Most social change theories center on conflict, but here the norm evaporates like mist when the illusion of consensus breaks. That's worth emphasizing.
answer: |-
  Here's the breakdown, following your format:

  **Short answer:**  
  (a) **Pluralistic ignorance** explains the collapse: people privately disbelieved but publicly conformed due to perceived majority support.  
  (b) **Cognitive dissonance reduction** (specifically, memory revision) explains the "always thought it was stupid" retrospection.  
  They are **two distinct but linked phenomena**: pluralistic ignorance enables the norm's fragility, while dissonance reduction sanitizes personal history after collapse. No single term covers both.

  **Nearest concepts:**  
  1.  **Pluralistic Ignorance**  
      *Definition:* A group collectively misunderstands others' true attitudes, leading to public conformity despite private rejection (e.g., everyone hates the tradition but thinks others love it).  
      *Fit:* Perfectly explains the parking lot collapse. Seniors participated assuming peers supported it, but private doubts were widespread. The moment one person vocalized dissent ("she wasn't doing it"), it shattered the illusion of consensus, causing rapid collapse.  
      *Clean Example:* If *everyone* had genuinely loved the tradition initially but stopped for external reasons (e.g., new rules), it *wouldn't* fit. The key is the disconnect between private belief and public action.

  2.  **Cognitive Dissonance Reduction (Memory Revision)**  
      *Definition:* Uncomfortable inconsistency between past actions/beliefs and current self-image is resolved by unconsciously altering memories ("I never really believed that").  
      *Fit:* Explains the retroactive "always thought it was stupid" claims. Participating in something now deemed pointless creates dissonance. Revising their past attitude ("I always knew it was dumb") restores consistency without admitting error.  
      *Clean Example:* If people said, "I used to love it but now I see it was silly," it would show *changed* belief, not dissonance-driven memory revision. The denial of the *existence* of past enthusiasm is key.

  3.  **Preference Falsification**  
      *Definition:* Publicly expressing preferences different from private ones due to social pressure, fear, or perceived benefits.  
      *Fit:* Describes the *participation* during the norm (public hype vs. private doubt). It overlaps with pluralistic ignorance as a *mechanism* for maintaining the norm.  
      *Doesn't Fit:* Preference falsification focuses on the *ongoing act* of hiding true preferences. It doesn't inherently predict the *rapid collapse* upon dissent or the *specific memory revision* afterward.

  4.  **Norm Cascade / Abandonment**  
      *Definition:* The rapid collapse of a social norm once a critical mass publicly defects, often due to changing incentives or revealed preferences.  
      *Fit:* Describes the *speed* and *social contagion* of the collapse ("within two weeks the whole thing was dead").  
      *Doesn't Fit:* Norm cascade is the *event* of collapse. It doesn't explain the *pre-condition* (pluralistic ignorance enabling the fragility) or the *post-collapse psychology* (dissonance reduction). It's the *what*, not the *why* or the *memory effect*.

  5.  **Effort Justification**  
      *Definition:* The tendency to attribute greater value to an outcome one has put significant effort into achieving.  
      *Fit (Inverse):* Effort justification would make people *defend* the tradition *more* after participating. The parking lot case shows the *opposite*: devaluing the past activity.  
      *Doesn't Fit:* This is actually a counter-concept. If people had dug in and defended the tradition *more* fiercely after the challenge ("We put so much effort in, it MUST be great!"), effort justification would fit. Its absence highlights the role of dissonance reduction instead.

  **The edges (Boundary Cases):**  
  *   **If there had been a real argument:** If the norm collapsed after public debate where people were genuinely persuaded (e.g., seniors presented with logical reasons it was unfair/unsafe and changed their minds), it wouldn't be pluralistic ignorance. The rapid collapse *without* debate is key evidence that private doubts were already widespread but suppressed. The retroactive denial might still occur via dissonance reduction, but the collapse mechanism would differ.
  *   **If everyone kept doing it but stopped mentioning it:** This would be norm *persistence* through inertia or habit, or perhaps *covert* preference falsification, not collapse. The public defiance and rapid abandonment are essential.
  *   **If it collapsed because one person got caught/punished:** If enforcement (e.g., suspension) caused the collapse due to fear, it would be about changing *incentives*, not revealing widespread private dissent. Pluralistic ignorance might still exist, but fear of punishment, not the shattering of perceived consensus, would be the proximate cause.
  *   **If people admitted they changed their minds:** This would simply be attitude change or persuasion. The *denial* of the past attitude ("I *always* thought it was stupid") is the hallmark of the dissonance reduction/memory revision aspect.

  **Name it:**  
  For the **combined phenomenon** – the rapid collapse of a norm sustained by pluralistic ignorance, followed by widespread retrospective denial of ever having sincerely endorsed it – coin the term:  
  **Pluralistic Collapse with Mnemonic Disownership.**  
  *Definition:* The dissolution of a group practice or belief, triggered by the exposure of widespread private dissent that was masked by public conformity (pluralistic ignorance), leading participants to subsequently reconstruct their past attitudes as always having aligned with the new consensus, thereby disowning their previous complicity (mnemonic disownership).  
  *Deliberately Excludes:*  
  1.  Norm collapse driven primarily by changing material incentives, enforcement, or persuasive arguments.  
  2.  Genuine, conscious shifts in belief where past views are acknowledged.  
  3.  Mere forgetting of details; this specifically targets the revision of *attitudinal memory*.  
  4.  Norms where private belief genuinely matched public action before the collapse.
