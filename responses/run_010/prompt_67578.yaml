answer: |-
  ### Accuracy-First Forecasting Game: Activity Design  
  **Goal:** Illustrate core concepts of accuracy-first epistemology through an interactive game, avoiding abstract discussion. Participants experience why hedging hurts (under proper scoring), why incoherence is self-punishing, and why immodesty is rational—before learning the formal names.  

  **Materials Needed:**  
  - 14 sets of question cards (pre-printed, 3 rounds)  
  - Butter beans (or similar tokens)  
  - Pre-printed score lookup tables (Brier & improper rule)  
  - Whiteboard & markers  
  - 1 six-sided die, 1 coin  
  - Bag with 3 red/6 blue marbles (or app-simulated)  
  - Timer  
  - Outcome cards (pre-determined)  

  **Timeline (90 Minutes):**  
  *Total: Intro (5 min) → Round 1 (25 min) → Round 2 (20 min) → Round 3 (25 min) → Debrief (15 min)*  

  ---

  ### **Round 1: Hedging vs. Overconfidence (25 min)**  
  *Concept: Proper vs. improper scoring rules. Hedging feels safe but loses; improper rules breed overconfidence.*  

  1. **Question 1 (Proper Rule: Brier Score) (10 min)**  
     - **Hand out Card 1:**  
       *"A fair six-sided die will be rolled. What’s the probability it lands on 1 or 2?  
       Scoring: Brier Rule (see table). Report probability: ______."*  
     - **Scoring Table (Pre-printed):**  
       | Reported (p) | If **1/2** (Score) | If **3-6** (Score) |  
       |--------------|---------------------|--------------------|  
       | 0.3          | 0.51               | 0.91              |  
       | 0.5          | 0.75               | 0.75              |  
       | 0.7          | 0.91               | 0.51              |  
       *[Full table: p=0.1 increments. Outcome=1: \(1 - (1-p)^2\); Outcome=0: \(1 - p^2\)]*  
     - **Process:**  
       - Collect cards. Roll die (pre-determined: **4** → outcome **0**).  
       - Announce: *"Outcome: 4. Not 1 or 2. Scores from table: e.g., 0.3 → 0.91, 0.5 → 0.75."*  
       - **Key moment:** Highlight a player who reported ∼0.33 (score 0.91) vs. hedger at 0.5 (score 0.75).  

  2. **Question 2 (Improper Rule) (15 min)**  
     - **Hand out Card 2:**  
       *"A fair coin will flip. Probability it lands heads?  
       Scoring: New Rule. Report probability: ______."*  
     - **Scoring Table (Improper):**  
       | Reported (p) | If **Heads** (Score) | If **Tails** (Score) |  
       |--------------|----------------------|----------------------|  
       | 0.5          | 0.25                | 0.25                |  
       | 0.8          | 0.64                | 0.04                |  
       | 1.0          | 1.00                | 0.00                |  
       *[Scores: Outcome=1 → \(p^2\), Outcome=0 → \((1-p)^2\)]*  
     - **Process:**  
       - Collect cards. Flip coin (pre-determined: **heads** → outcome **1**).  
       - Announce: *"Heads! Scores: e.g., 0.5 → 0.25, 1.0 → 1.00."*  
       - **Key moment:** Most will report 0.8–1.0 after seeing the table. Show how the rule pushes toward extremes.  

  ---

  ### **Round 2: Dutch Book (20 min)**  
  *Concept: Incoherent credences guarantee loss.*  

  1. **Setup (5 min):**  
     - Pick a volunteer ("Forecaster"). Give them a card:  
       *"Your beliefs:  
       P(die=1 or 2) = 0.4, P(die=3 or 4) = 0.4, P(die=5 or 6) = 0.4,  
       P(die=1–6) = 0.9"*  
     - Give Forecaster 10 beans. Explain: *"I’ll offer bets you think are fair."*  

  2. **Bookmaking (10 min):**  
     - Offer bets (write on whiteboard):  
       - "Bet A: Pay 4 beans. Win 10 if die=1/2."  
       - "Bet B: Pay 4 beans. Win 10 if die=3/4."  
       - "Bet C: Pay 4 beans. Win 10 if die=5/6."  
       - "Bet D: You get 9 beans now. Pay me 10 if die=1–6."  
     - **Forecaster accepts** (beliefs deem bets fair). Net: Pays 12 beans (A+B+C), gains 9 (D) → net loss of 3 beans.  

  3. **Reveal & Loss (5 min):**  
     - Roll die (pre-determined: **3** → event B).  
     - Settle:  
       - Forecaster wins 10 for B.  
       - Pays 10 for D (since die=1–6 occurred).  
     - **End state:** Started with 10 beans, ends with 7. Loss of 3 beans guaranteed.  

  ---

  ### **Round 3: Immodesty (25 min)**  
  *Concept: With proper scoring, you expect to rank first.*  

  1. **5 Quick Questions (10 min):**  
     - Hand out cards with questions (pre-determined outcomes):  
       1. *"Marble draw: P(red) from bag (3 red, 6 blue)?"* → Outcome: **Blue** (0)  
       2. *"Coin flip: P(heads)?"* → Outcome: **Heads** (1)  
       3. *"Die roll: P(even)?"* → Outcome: **3** (0)  
       4. *"P(seconds digit of end time even)?"* → Outcome: **4** (1)  
       5. *"P(total beans even)?"* → Outcome: **Yes** (1)  
     - **Secretly:** Players write predicted total score (0–5) and rank (1–14) on a slip.  

  2. **Scoring & Ranking (10 min):**  
     - Reveal outcomes. Use Brier lookup table to score each question (sum for total).  
     - Rank players: Highest total = Rank 1.  
     - **Reveal predictions:** Ask each, *"What rank did you predict?"* Write actual vs. predicted on whiteboard.  

  3. **The Ambush (5 min):**  
     - Most predicted ranks 3–7. Actual ranks vary.  
     - Point out: *"If you believed your probabilities, you should have predicted Rank 1. Why didn’t you?"*  

  ---

  ### **Debrief (15 min)**  
  Map game moments to accuracy-first concepts:  
  1. **Round 1A (Hedging):**  
     - Under Brier (proper), hedging (0.5) loses to true probability (0.33).  
     - *Real league takeaway:* Hedging feels safe but guarantees suboptimal accuracy.  

  2. **Round 1B (Overconfidence):**  
     - Improper rule (\(p^2/(1-p)^2\)) pushes toward 0/100% → overconfidence.  
     - *Why it matters:* Scoring rules define "good" judgments. Proper rules align accuracy and honesty.  

  3. **Round 2 (Dutch Book):**  
     - Incoherent probabilities → guaranteed loss (no math needed; beans made it visceral).  
     - *Philosophy link:* Coherence isn’t pedantry—it’s bankruptcy avoidance.  

  4. **Round 3 (Immodesty):**  
     - With proper scoring, *you expect your forecast to win* (even if it rarely does).  
     - *Your humiliation:* Small samples create variance; long-run accuracy still favors honesty.  

  ---

  ### **What Will Go Wrong (And Fixes):**  
  - **Competitive forecaster dominates:**  
    - Assign them as Round 2 volunteer or score calculator.  
  - **Sulking over loss:**  
    - Stress: *"This is about concepts, not skill. Your league had bad luck!"*  
  - **Math aversion:**  
    - Lookup tables prevent arithmetic. Use beans, not numbers, for Dutch Book.  
  - **Noisy collapse:**  
    - Enforce 60-second decision limits. Use timer.  

  ### **What the Game Can’t Replicate:**  
  1. **Tokens ≠ Epistemic Value:**  
     - Beans simulate accuracy as "points," but real accuracy is intrinsic.  
     - *Patch:* Debrief: *"The beans represent epistemic virtue—truth for its own sake."*  
  2. **Short-Run vs. Long-Run Variance:**  
     - One game can’t prove proper rules favor truth in the long run.  
     - *Patch:* Show expected scores on whiteboard (e.g., *"True 0.3 beats 0.5 in 100 tries"*).  

  ### **Handout Notes:**  
  - All materials in American English (e.g., "math," "practice").  
  - Pre-print tables/questions to avoid on-the-spot calculations.  

  ---  
  **Final Tip:** Start lighthearted ("This is philosophy with training wheels!"). The game makes the ideas *felt*—trust the reveals to spark discussion. You’ve got this!
