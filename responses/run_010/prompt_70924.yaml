prompt: |-
  I have sat for six years on the Historical Redress Committee of a private foundation — seven voting members, a staff lawyer, and a modest endowment whose own origins in nineteenth-century land dealings are the subject of a standing joke we never quite resolve. We evaluate claims brought by descendant communities, and our charter gives us only this much guidance: the fund exists to address wrongs whose consequences continue to structure the lives of the communities that suffered them, and the committee has discretion over the form of any remedy. We have never written down a decision rule. One member, a former appellate judge, keeps a private ledger of our votes and insists we are running a single test — that there must be somebody still answerable. A second, an economist, thinks we are really running a different test — whether the wrong still shows up in the claimants' lives today. A third, a historian, thinks both are rationalizations of something else, namely that we approve when the respondent institution has never admitted anything and reject when it has. I suspect at least one of those three glosses fails to fit at least one of our six decided claims, and I would like to know which. Our record is as follows:

  1. **Approved.** Descendants of a farming community in Calder County whose land was stripped in the 1920s through collusive tax foreclosures run out of the county treasurer's office. The county still exists, still holds and leases several of the parcels, and the claimant families remain markedly poorer and far less likely to own land than their neighbours. Remedy: a community land trust plus a formal acknowledgment by the county; no payments to individuals.
  2. **Rejected.** Descendants of workers in a company-run contract labour scheme of the 1870s and 1880s. This group's current income and health outcomes are the worst in any file we have seen. But the operating company was dissolved in 1893, its records were destroyed in a fire, and no part of its assets can be traced to any existing firm, endowment, or public body. Our written rationale was that we could find no one who owed the debt.
  3. **Approved.** A state boarding school that between 1900 and 1950 punished children for speaking their own language. Both the successor state agency and the sponsoring church body still exist. There is no property loss to point to, and the community's material position is close to the regional average, but there are eleven fluent speakers left, all past seventy. Remedy: an immersion school, teacher training, curriculum revision, and a memorial; again, no payments to individuals.
  4. **Approved at roughly a third of what was sought, with reasons.** A township defrauded of its common land in the 1930s — whose own leaders, in the 1960s, used the compensation they received to buy out and clear a smaller hamlet of tenants downstream. We said the later wrong did not erase the earlier one, and reduced rather than denied.
  5. **Rejected.** A diaspora association whose members were expelled from a port city in 1905. The confiscated properties passed, through a chain we could document without gaps, into the endowment of a university that has since issued a formal apology and established its own programme. The association's members are now better educated and wealthier than the national median, and no institution disadvantages them. Our rationale: the wrong was real, but nothing in their lives today is shaped by it, and the holder of the benefit had already repudiated the transfer.
  6. **Approved with conditions.** A public hospital system's non-consensual study, closed in 1963. The hospital argued that every individual responsible was dead. We held that the institution's continuity was enough, and awarded lifetime health monitoring for survivors plus a trust for their children, on documented intergenerational health effects. No cash to individuals here either.

  The claim now before us concerns the Ash Fork valley, flooded in the 1940s to build a hydroelectric reservoir. The utility that built the dam operates it still, is solvent, and has never disputed that the compensation paid at the time was below what the land would have fetched on an open market — but it maintains the taking was lawful, that the prices reflected genuine agricultural value, and that it owes nothing further. Compensation was paid to registered household heads only; the valley's landholding was in practice communal under informal arrangements the assessing office declined to recognise, and in several families the money went to one relative who kept it. Today about two-fifths of descendant households trace themselves to a compensated head, three-fifths do not. The descendants' material position is now slightly above the state median: the dam brought rural electrification, roads, and eventually a tourism economy in which some of their own families built businesses. What is gone is the cemetery, under forty feet of water; the church; the annual reunion; and the valley dialect, spoken fluently by fewer than forty people, none under sixty. The descendants' association is split, and an organised minority drawn mainly from the compensated two-fifths opposes the claim publicly, saying it will brand them as victims and reopen arguments about money their grandfathers received. Finally, the utility has announced it will decommission the reservoir in roughly twelve years, whereupon the lakebed will be exposed and, under current law, will revert to the utility unless some public body asserts a claim to it. The petition asks for four things: a cash payment to the uncompensated three-fifths; title to the lakebed, held in trust, when it emerges; exhumation and reinterment of the cemetery, or failing that a surveyed memorial; and a formal statement from the utility that the compensation was inadequate.

  What I want from you is a prediction and a reconstruction, not a general essay on redress. Predict our verdict, and because we have always separated remedies, give a separate verdict on each of the four requests — approve, reject, or approve with conditions, and in the last case what the condition would be. Then lay out the two or three decision rules that are each genuinely consistent with all six of our past votes, being explicit about which of my three colleagues' glosses, if any, actually survives the record, and showing how each surviving rule disposes of the new case; where they part company, say so plainly. Tell me which single precedent is the closest analog — I keep going back and forth between the Calder County case, because the respondent still holds and profits from the very land it took, and the boarding-school case, because what remains is a language and a cemetery rather than a measurable disadvantage, and I know the diaspora case is being quoted at me in dissent — and justify the choice rather than assuming it. Address two specific difficulties. First, we have never once awarded money to individuals in six votes: is that a principle about communal wrongs requiring communal remedies, or an artifact of the cases that happened to reach us, and does the compensated/uncompensated split inside this petitioner group give us a reason to break the pattern now? Second, our reduction in the fourth case: did it rest on the claimants' own misconduct, in which case it has no application here, or on not paying twice for one loss, in which case the electrification and tourism benefits these descendants received are exactly the kind of thing it was meant to net off? One of our members has also said that approving anything here commits us to a view he considers absurd, since had the dam not been built none of the petitioners would exist; tell me whether that objection has any force against a fund like ours, and whether any of the six votes has already committed us for or against it. Where the precedents genuinely run out — and I expect they do on the lakebed — say what principle we would be adopting by deciding either way, given that in the diaspora case we let an institution keep a benefit it had apologised for. Finally, propose one hypothetical claim, not on our docket, that would discriminate among the candidate rules better than anything we have already decided, and say what each rule would predict about it.
reasoning: |-
  Hmm, the user is presenting a complex ethical and procedural dilemma from their role on a Historical Redress Committee. They've described six past cases with nuanced outcomes and now need help analyzing a new claim about the Ash Fork valley flooding. 

  The core challenge is reverse-engineering their committee's unspoken decision rules from inconsistent precedents. Three colleagues have proposed different frameworks: accountability ("somebody still answerable"), ongoing harm ("wrong still shows up today"), and performative justice ("respondent never admitted anything"). None perfectly fit all six cases, so I need to find rules that do.

  First I'll mentally catalog the precedents:
  - Case 1 (Calder County) approved with ongoing harm + current beneficiary
  - Case 2 rejected despite severe harm because no accountable entity
  - Case 3 approved for cultural loss without material disadvantage
  - Case 4 partially approved despite claimants' later misconduct
  - Case 5 rejected because no ongoing harm + prior apology
  - Case 6 approved for institutional continuity despite individual perpetrators being dead

  Patterns emerge: accountability and ongoing harm seem necessary but insufficient alone. Case 5 is key - they rejected when both were absent (no harm + apology). But Case 3 shows "harm" can be cultural. The no-cash pattern feels intentional given chances to award it (Cases 1,3,6) and avoidance in Case 4 reduction.

  For Ash Fork:
  - Utility is clearly accountable (like Cases 1,6)
  - Harm is cultural (cemetery, dialect) not material (like Case 3)
  - But internal split among descendants complicates "community" remedy
  - Lakebed reversion is novel - parallels diaspora case but utility isn't repentant

  The "none would exist" objection is specious - by that logic no historical redress could occur. Case 6 already rejected similar timing arguments.

  Hypothetical test case: A stolen artifact now in a museum that denies wrongdoing, with descendants experiencing no material harm but cultural loss. Would tease apart whether admission status trumps harm assessment.

  User's anxiety about inconsistency is palpable. They need clear mapping to past votes, not philosophy. Should acknowledge their instinct about boarding-school case being closest analog due to cultural erosion.
answer: |-
  Based on your committee's record and the explicit tensions within it, here is the analysis you requested. The key is identifying decision rules consistent with *all six* precedents, then applying them to the Ash Fork claim.

  **Predicted Verdict for Ash Fork Claim:**
  1.  **Cash payment to uncompensated three-fifths: REJECTED.** (Consistent with no individual cash awards precedent; split claimant group weakens "community" claim for cash; benefits received complicate net loss argument).
  2.  **Title to the lakebed: APPROVED WITH CONDITION.** (Condition: Title held by a neutral land trust established *specifically* for the *entire* descendant community, including mechanisms to resolve internal disputes over use/management. Rationale: Utility still holds/profits from the land (like Calder County); reversion opportunity creates unique redress possibility; avoids direct windfall to claimants; addresses the "land" core of the original wrong).
  3.  **Exhumation/reinterment or memorial: APPROVED.** (Condition: Memorial only, funded by utility. Rationale: Directly addresses the submerged cemetery – a non-material, cultural harm analogous to the boarding school language loss; exhumation likely impractical/ethically complex).
  4.  **Formal statement of inadequate compensation: APPROVED.** (Rationale: Low-cost acknowledgment; utility has never admitted fault, satisfying a key condition seen in approvals).

  **Reconstructed Decision Rules Consistent with All Six Precedents:**
  Your committee operates under an implicit **two-pronged test**, where *both* prongs must be satisfied for approval:

  1.  **Institutional Accountability Prong:** A legally or morally continuous institution that *currently benefits from the wrong or has never formally acknowledged and repudiated it* must exist and be identifiable as the respondent. This prong emphasizes *who pays*.
      *   *Survives Colleagues' Glosses:* Supports the Judge's "somebody still answerable" but refines it to focus on *current benefit* or *lack of acknowledgment* (not just legal continuity). Directly contradicts the Historian's "never admitted anything" as the *sole* driver, as acknowledgment *alone* isn't sufficient for rejection (see Prong 2), but *lack* of acknowledgment is often necessary for approval.
      *   *Fits Precedents:*
          *   Approved (1): County still holds/leases land (benefits), no formal acknowledgment prior.
          *   Rejected (2): No existing entity (fails accountability).
          *   Approved (3): State/Church exist (continuity), no prior acknowledgment.
          *   Approved (4): Township exists (continuity), no prior acknowledgment of fraud.
          *   Rejected (5): University exists BUT issued apology/repudiated *and* established program (acknowledgment/repudiation).
          *   Approved (6): Hospital system exists (continuity), argued perpetrators dead but no acknowledgment of wrong.

  2.  **Ongoing Consequence Prong:** The wrong must have demonstrable negative consequences that *persist within the claimant community today*. This includes material disadvantage *or* significant non-material/cultural harm that impairs community identity or well-being. This prong emphasizes *why pay*.
      *   *Survives Colleagues' Glosses:* Supports the Economist's "wrong still shows up today" but broadens "shows up" to include cultural/identity harms, not just economic. Contradicts the Historian's view that approval/rejection is *only* about respondent admission status.
      *   *Fits Precedents:*
          *   Approved (1): Material disadvantage (poverty, landlessness).
          *   Rejected (2): *Severe* ongoing disadvantage, but fails Prong 1 (no one to pay).
          *   Approved (3): Cultural/linguistic harm (loss of language, identity).
          *   Approved (4): Loss of common land (material/cultural harm).
          *   Rejected (5): *No* ongoing consequence (materially better off, no disadvantage).
          *   Approved (6): Documented intergenerational health effects (material harm).

  **How the Rules Dispose of Ash Fork:**
  *   **Prong 1 (Accountability):** SATISFIED. Utility exists, is solvent, built/operates the dam, will benefit from lakebed reversion, and has *never acknowledged inadequacy* (only argued lawfulness/value). Continuous beneficiary, no repudiation.
  *   **Prong 2 (Ongoing Consequence):** SATISFIED. Significant non-material harm: Submerged cemetery (loss of sacred/ancestral space), loss of church/traditional reunion site, critically endangered valley dialect. This constitutes cultural/identity harm analogous to Case 3 (boarding school language).
  *   **Verdict:** APPROVAL warranted (as outlined above). Internal split/complicated history doesn't negate the core harm or accountability, but influences remedy *form* (avoiding individual cash).

  **Closest Precedent:** **The Boarding School Case (3)** is the closest analog.
  *   *Justification:* Both involve:
      *   Clear institutional continuity/accountability (State/Church vs. Utility).
      *   Lack of prior acknowledgment/repudiation.
      *   Absence of *current material disadvantage* but presence of severe *non-material, cultural/identity harm* (language loss/dying dialect; submerged cemetery/loss of place).
      *   Remedies focused on cultural preservation/acknowledgment rather than cash or property restitution per se.
  *   *Why not Calder County (1)?* Calder involved *current material disadvantage* and *direct, ongoing profit* from the *very land* taken. Ash Fork descendants are materially better off, and the utility's current "profit" is from electricity, not directly leasing the submerged lots. The lakebed reversion is future/potential, not current profit from the wrong.
  *   *Diaspora Case (5) Distinction:* The university *had* acknowledged/apologized and the claimants suffered *no ongoing consequence*. Neither is true for Ash Fork.

  **Addressing Specific Difficulties:**

  1.  **No Cash to Individuals: Principle or Artifact?**
      *   It's a **Principle**, strongly suggested by the record. Cases presented opportunities for cash (1, 3, 4-reduction, 6) but it was consistently avoided. Remedies focused on communal/cultural repair (land trusts, schools, health monitoring trust, acknowledgment). Case 4's reduction wasn't about *avoiding* cash per se, but avoiding *double compensation* for the *original loss*. The Ash Fork split *reinforces* this principle: awarding cash *only* to the "uncompensated" fraction would fracture the "community" basis of the claim, create internal resentment, and contradict the communal nature of the harm (cemetery, dialect, displacement). The principle is that redress for communal wrongs should benefit the *community as a whole*, even if imperfectly. **Break the pattern? No.**

  2.  **Case 4 Reduction: Misconduct vs. Double Payment?**
      *   It rested on **Not Paying Twice for One Loss.** The rationale explicitly stated "the later wrong did not erase the earlier one," implying the *earlier* wrong was compensable. The reduction was because the claimants *had already received compensation* (in the 1960s) *for the original land loss*, even if obtained unjustly later. It wasn't primarily punishment for misconduct. Therefore, **electrification and tourism benefits are relevant for netting off** when considering *overall material disadvantage* for Prong 2. However, in Ash Fork:
          *   Prong 2 is satisfied by *cultural harm*, not material disadvantage.
          *   The claimed remedies (lakebed, memorial, acknowledgment) address the *specific, non-material* losses (land/place, ancestors, history) which the development benefits *do not* compensate for.
          *   Arguing net material benefit is thus *irrelevant* to the justification for the *specific remedies sought* addressing cultural harm. It *would* be relevant if they sought compensation for *material loss*, which they aren't (except the cash claim, rejected under principle 1).

  3.  **The "None Would Exist" Objection:**
      *   **No Force.** This objection is a logical fallacy (ignoring the counterfactual where descendants exist *without* the harm) and irrelevant to the fund's charter ("wrongs whose consequences *continue to structure the lives*"). Case 6 (hospital study) committed you firmly *against* this objection: individuals harmed existed *because* the study happened, but the harm itself was redressable. Your mandate is to address *continuing consequences of past wrongs* for *existing communities*, not hypothetical non-existence. The objection confuses causation of existence with the nature of the harm inflicted.

  4.  **The Lakebed Reversion Novelty:**
      *   Precedents run out. Deciding requires adopting a principle:
      *   **Approve Title:** Adopts the principle that *opportunities arising from the original wrong* (like land becoming available again) should be directed to the wronged community as partial redress, especially when the accountable institution still exists and would otherwise benefit again. This leverages the unique circumstance for restorative justice.
      *   **Reject Title:** Adopts the principle that redress is limited to addressing *past consequences*, not future windfalls or opportunities, unless directly tied to the *specific asset* lost (which is submerged, not the future lakebed). This risks the utility benefiting *again* from the land taken inadequately. The Diaspora case (5) is weak precedent here because the university had *apologized and acted*, and there was *no ongoing harm* – neither applies to Ash Fork.

  **Discriminating Hypothetical Claim:**
  *   **Claim:** Descendants of a neighborhood demolished for "urban renewal" in the 1950s. The city government (same continuous entity) took the land via eminent domain, paying compensation deemed fair at the time but never formally acknowledged the disproportionate impact or cultural destruction. The land is now a profitable municipal parking garage. The descendants are now economically diverse (some poor, some middle-class, none identifiably worse off *as a group* than city averages), but they lack any physical center and their unique cultural traditions (centered on the neighborhood) have faded significantly. They seek acknowledgment and funding for a cultural center on city-owned land elsewhere.
  *   **How Rules Predict:**
      *   **Prong 1 (Accountability):** SATISFIED. City exists, benefits from garage, no acknowledgment.
      *   **Prong 2 (Ongoing Consequence):** AMBIGUOUS. *No material disadvantage* as a group. *Significant cultural harm* (lost place, faded traditions) but less acute than dying language/submerged cemetery. Is this "demonstrable negative consequence"?
          *   **Rule Interpretation A (Strict Material/Threshold Cultural):** Might REJECT. Cultural harm isn't severe enough (cf. <40 speakers, submerged grave vs. faded traditions). Analogizes to Diaspora (5) - no measurable harm.
          *   **Rule Interpretation B (Broader Cultural Harm):** Might APPROVE. Loss of place and cultural erosion *is* a persistent negative consequence shaping community identity, analogous to boarding school (3). Focus is on community cohesion/identity impairment.
  *   **Why it Discriminates:** This case directly tests the boundaries of "Ongoing Consequence" (Prong 2) when material harm is absent. It forces a choice between a narrower (like Case 5 rejection) or broader (like Case 3 approval) interpretation of non-material harm. None of your six cases sit precisely on this line – Case 3 had a critically endangered language, Case 5 had no discernible harm. This hypothetical falls in the grey zone between them, revealing the committee's implicit threshold for cultural harm.
