prompt: |-
  Getting asked by the organizers of a workshop I'm in next month to circulate a "where I stand" sheet beforehand — just a bare list of commitments, no arguments, so that everyone can spend the weekend taking swings at it. Before I send mine off I want a sanity check, because I'm fairly confident there's a crack in it somewhere and I cant locate it myself. This is my patch (computation and epistemic norms), which is exactly the situation where you stop seeing the obvious.

  Here's the list.

  1. Feasibility is normative. I hold a computational version of ought-implies-can: if there's no polynomial-time algorithm for a task, no agent — human, machine, whatever — can be epistemically required to perform it. I take polynomial time as the right rough cut on feasibility (the Cobham-Edmonds line), while admitting it's a crude instrument.

  2. Idealization in epistemology is legitimate rather than a mistake. When I teach Bayesianism I tell students that logical omniscience is an idealization on a par with a frictionless plane: the norm is stated for an ideal agent and we are the approximations. Nothing incoherent about that, and I don't think the idealization needs a computational apology.

  3. I'm a plain realist about complexity-class questions. P vs NP has a determinate answer, and it's whatever it is regardless of whether anyone can prove it or exhibit the relevant algorithm.

  4. Relatedly: a nonconstructive proof that P = NP would be a big metaphysical deal and a computational nothing. No algorithm, no new capacity to solve anything. You'd learn that something exists without being able to do anything with it.

  5. I take the natural-proofs barrier (Razborov and Rudich, very roughly: a proof strategy with the combinatorial features we'd naturally expect would, if it worked, also destroy the pseudorandom generators we believe exist) to be a philosophical result and not merely a technical one — it says an entire style of conceptual explanation in mathematics is unavailable for this question.

  6. I accept computer-assisted proofs as proofs. Four color, Kepler, whatever: if the machine-checked artifact is right we have knowledge, even though no single human surveys it. Understanding can be distributed across a community and across tools; it doesn't have to fit inside one skull.

  7. Where I get heterdox: I think the intractability of exact probabilistic inference in general Bayesian networks — I'll just say NP-hard and worse in a handout like this, I'm not going to get the precise class right — is not merely an implementation nuisance. It licenses a substantive revision of the norm. The norm can't be "hold coherent credences and conditionalize on them"; it has to be something like "use a procedure that reliably does well in the environments you actually inhabit." That's why I'm broadly sympathetic to the Gigerenzer-style heuristics program, and I take it to be doing epistemology rather than psychology.

  8. But I also insist, against a certain kind of pessimism, that worst-case complexity is the wrong measure of what an agent can actually do. When people tell me learning is hard or planning is hard or inference is hard, I say: yes, in the worst case over all instances, which is not the world any of us lives in. Real instances are structured, and average-case or smoothed behavior is what you should look at. That's my standing answer to people who think complexity theory has shown cognition to be impossible.

  So: which of these genuinely pull against each other, and which pairs only look like they do? I'd especially like to know whether 1, 2 and 7 can all stand up at once. And more generally, whether any item on the list is doing double duty in a way I haven't noticed — several of them are supposed to be doing load-bearing work in different arguments and I may not have checked that the loads are compatible.

  Rank the tensions by severity rather than listing them all as equally bad, and for each one say what the cheapest revision is and what it costs me philosophically — I want to know if the fix is local (drop a hedge, restate a claim) or whether it takes out something I care about. Then tell me which single change buys the most overall consistency. And please don't give me a diplomatic "it depends how you define idealization"; if that really is the answer, say so and tell me which definition I'd have to adopt for the set to cohere.

  Two last things. Be as committed as you can in the verdicts — I'd rather be told flatly that 7 has to go than be handed a menu. And then tell me where your own reasoning is most likely to break down: which of your findings is most fragile, and what argument or consideration would make you reverse your call on the worst tension you identify.
reasoning: |-
  Okay, the user is preparing for a workshop where they'll present their "where I stand" list on computation and epistemic norms. They want a sanity check because they suspect a crack in their position but can't locate it. Let me go through each point carefully.

  First, their eight commitments. Point 1 says feasibility is normative—ought-implies-can computationally, using polynomial time as feasibility. Point 2 defends idealization in epistemology, comparing logical omniscience to frictionless planes. Point 3 is realism about complexity classes like P vs NP. Point 4 says a nonconstructive P=NP proof wouldn't change computational capabilities. Point 5 sees the natural-proofs barrier as philosophical. Point 6 accepts computer-assisted proofs. Point 7 argues that NP-hardness in Bayesian inference requires revising epistemic norms towards heuristic procedures. Point 8 emphasizes average-case over worst-case complexity.

  The main tension I see is between 1, 2, and 7. Point 1 sets polynomial feasibility as a norm boundary. Point 2 embraces idealization without computational apology. But point 7 uses computational hardness to argue for norm revision. That seems circular: if idealization is legitimate, why does computational feasibility force us to abandon Bayesian norms? Yet point 7 cites intractability to reject "hold coherent credences" as the norm. That contradicts point 2's stance that idealization doesn't need computational apology. If logical omniscience is acceptable as an ideal, why isn't probabilistic coherence?

  Then point 8 complicates it further by dismissing worst-case complexity for real agents. But if worst-case doesn't apply to real agents, why use NP-hardness (a worst-case measure) in point 7 to demand norm revision? The user can't have it both ways—either worst-case matters for norms or it doesn't. Using it to reject Bayesian norms while dismissing it for practicality is inconsistent.

  Point 4 and 6 are less problematic. Point 4 says nonconstructive proofs don't enable new capabilities, which aligns with point 3's realism. Point 6's acceptance of distributed knowledge via computer proofs is consistent unless someone insists on individual comprehension, but the user doesn't.

  The natural-proofs barrier in point 5 as philosophical is plausible, framing it as a limit on explanatory styles. But it doesn't conflict directly with others.

  The cheapest fix? Modify point 7 to separate norms from procedures. Say the normative ideal remains coherence (preserving point 2), but feasible compliance requires reliable heuristics (incorporating point 1 and 8). This avoids the circularity and retains the core insights. It costs some rhetorical force but keeps the philosophical foundation intact.

  The user might resist because they want computational constraints to directly shape norms, not just compliance. But if they concede that point, they lose point 2's defense of idealization. Alternatively, they could qualify point 1 to exclude idealized agents, but that undermines their broader argument about feasibility.

  The most fragile part of my analysis is the tension between point 7 and point 8. If the user argues that worst-case complexity still licenses norm revision by showing that no efficient general algorithm exists, even if average-case is manageable, that might hold. But then point 8's dismissal of worst-case relevance weakens. They'd need to refine point 8 to allow worst-case as a constraint on norms while emphasizing average-case for practice.

  Overall, reconciling 1, 2, and 7 is the biggest hurdle. Making point 7 about compliance rather than the norm itself is the least costly fix. It maintains their support for heuristics without abandoning idealization.
answer: |-
  Here's a no-nonsense audit of your positions, ranked by tension severity with targeted fixes and philosophical costs. The core instability is between **1, 2, and 7**, with **7** as the primary fault line. Your other points are largely compatible or require minor tweaks.

  ### Critical Tensions (Ranked)
  1.  **1 + 2 vs. 7 (Severe Inconsistency)**  
      - **Conflict:** #2 defends idealization (e.g., logical omniscience) as legitimate *without computational apology*. Yet #7 uses computational intractability (NP-hardness of Bayesian inference) to argue for a *substantive revision of the epistemic norm itself*—replacing coherence/conditionalization with heuristic procedures. This directly contradicts #2: if idealization doesn't need computational justification, why does intractability force norm revision? #1 compounds this by making feasibility (polynomial time) normative, but #2 explicitly rejects computational constraints for ideals.  
      - **Cheapest Fix:** **Revise #7** to target *compliance strategies*, not the norm itself. Say: *"The norm remains 'hold coherent credences,' but tractable compliance requires procedures (e.g., heuristics) that approximate the ideal in feasible steps."*  
      - **Cost:** You lose #7's strong claim that intractability *revises the norm*. Gigerenzer becomes a pragmatic solution, not an epistemic revolution. Your challenge to Bayesianism softens.  
      - **Why This Fix?** Preserves #2's idealization defense while honoring #1's feasibility constraint. The norm stays idealized; the *how* becomes computational.

  2.  **7 vs. 8 (Significant Friction)**  
      - **Conflict:** #7 uses *worst-case* complexity (NP-hardness) to justify norm revision. #8 dismisses worst-case as irrelevant to real agents, advocating for average-case/smoothed analysis. You can't appeal to worst-case hardness to dismantle norms (#7) while simultaneously rejecting worst-case as a valid measure of agent capabilities (#8).  
      - **Cheapest Fix:** **Qualify #7** with: *"Intractability in the worst-case, *when combined with evidence that real-world instances share this hardness*, licenses norm revision."*  
      - **Cost:** Weakens #7's generality. Requires empirical work to justify revision (e.g., showing Bayesian inference is hard *in practice*).  
      - **Why This Fix?** Aligns with #8’s pragmatism. Worst-case alone isn’t enough; you need relevance to actual environments.

  3.  **1 vs. 4 (Minor Tension)**  
      - **Conflict:** #1 says no polynomial algorithm → no epistemic requirement. #4 says a nonconstructive P=NP proof is "computational nothing." But if P=NP is proved nonconstructively, agents *would* know a poly-time algorithm exists (even if unknown). #1 might then require agents to find/use it—contradicting #4's "no new capacity" claim.  
      - **Cheapest Fix:** **Clarify #1**: Specify that "feasibility" refers to *known, implementable* algorithms. Add to #1: *"...where 'can' means possessing a known, executable polynomial-time procedure."*  
      - **Cost:** Narrows #1’s scope. "Ought-implies-can" now hinges on current knowledge, not abstract existence.  
      - **Why This Fix?** Resolves the conflict with #4 while keeping both intact. Nonconstructive proofs don’t yield "known" procedures.

  ### Other Points: Minimal Issues
  - **#3, #5, #6:** These cohere well. Realism (#3) and natural proofs as philosophical (#5) support each other. Computer-assisted proofs (#6) align with #3/#5—distributed understanding doesn’t threaten determinate truths.  
  - **#2 and #6:** Idealization (#2) and distributed cognition (#6) are compatible. An ideal agent could survey a proof; humans distribute the effort.  
  - **#1 and #8:** Feasibility (#1) focusing on poly-time and average-case pragmatism (#8) can coexist if #1 is interpreted as setting a *general* boundary, while #8 guides practical application.

  ### Highest-Impact Single Change
  - **Revise #7** (as above) to separate the *normative ideal* from *feasible compliance*.  
  - **Why?** This resolves the severe #1+#2 vs. #7 tension and reduces friction with #8. It preserves your core insights: feasibility matters (#1), idealization is valid (#2), and heuristics are epistemically significant (revised #7).

  ### Where My Reasoning is Most Fragile
  - **Fragile Point:** The fix for #1+#2 vs. #7 hinges on accepting that *ideal norms can survive computational constraints*. If you argue that persistent, systemic intractability *must* reshape ideals (not just compliance), my proposed fix collapses.  
  - **What Would Change My Mind:** A strong argument that norms not justifiably *compliable* by any realistic agent are incoherent (e.g., "No ought from infeasible can"). This could force surrender of #2 or a major rework of #1.  
  - **Self-Doubt:** I’m least confident about dismissing #7 vs. #8 friction. If worst-case hardness *structurally* precludes average-case efficiency (e.g., cryptography), #8’s optimism may not save #7’s revisionism.

  ### Verdict
  **#7 is the linchpin problem.** Without revision, it fatally undermines #2 and strains #8. The cheapest path is to retreat from "revise the norm" to "revise compliance strategies." This costs you a radical conclusion but saves your framework. If you cling to #7 as stated, drop #2’s "no computational apology" claim—but that guts your idealization defense. **Send the list with #7 rephrased.**
