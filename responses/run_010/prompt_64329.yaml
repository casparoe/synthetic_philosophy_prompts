prompt: |-
  Last night I argued until two in the morning with a friend of mine — she raises money for a conservation charity, I did my first degree in behavioural ecology — about whether expensive displays actually carry information or merely persuade us that they do. She holds a straightforwardly Zahavian line: cost is the whole story, and the only reason anyone trusts the peacock's tail, the potlatch or the diamond ring is that a liar would find it ruinous. I kept insisting that cost is doing far more work in her sentence than she notices, and that in most of the human cases we actually fought over, what convinces us is not how much was spent but how much worse the spending would have gone for someone who did not mean it. She cited Grafen's point that the cost has to fall unevenly on different types, which I thought was my argument; I invoked the ethologists' distinction between indices, which are physically impossible to fake, and conventional badges, which are cheap but policed, which she thought was a dodge. Neither of us budged. Rather than continue shouting across a kitchen table, I want to lay out my own verdicts and find out whether they amount to anything principled.

  My working formulation, which I am entirely willing to see dismantled, is this: a display carries information about an underlying state in proportion to how differently its cost would have fallen on someone in a different state, and — the clause I added halfway through the argument — in proportion to how much of that cost falls precisely in those states of the world in which the display turns out to have been false. Here are the cases, with what I said about them after several glasses of wine; some I would defend to the death and others I would rather quietly withdraw. (1) A friend who takes unpaid leave and flies twenty hours economy to stand at my wedding: convincing. (2) A colleague who sends an identical condolence card through a service that mails such things on his behalf: unconvincing, though the money and the minutes are the same as for a note written by hand. (3) A founder drawing a nominal salary whilst paying his staff generously: convincing. The same founder drawing the same nominal salary whilst paying them badly: not merely unconvincing, but evidence of the opposite of what it advertises. (4) An heir who donates a million pounds: weaker evidence of generosity than a nurse who donates three thousand, because the loss would have been bearable for him and was not for her. (5) A couple who spend a ruinous sum on a large public wedding: I said this signals commitment. A couple who spend exactly the same ruinous sum on a long private honeymoon: I said this signals nothing whatever. I could not defend the pair to her and she would not let me drop it. (6) A man who, to convince his partner he will stay, tattoos her name on his face: strong, if grotesque, and strong precisely because it cannot be retracted. (7) A woman who turns down a once-in-a-career post abroad, tells no one, and stays for thirty years: I said this is a better signal than the tattoo, which she thought absurd, since by construction there is nobody positioned to receive it and even the recipient never learns what was forgone. (8) A person working three jobs to pay a sibling's medical bills: no signal at all, however enormous the cost, because there was no alternative open to them. (9) A promise secured by a forfeitable sum lodged with a third party: completely credible, and yet nothing about the utterance itself is costly — the cost is contingent on the promise being broken. (10) A stammer, a limp, an accent one cannot shed: evidence of the most reliable sort, but not, I want to say, a signal; and I cannot articulate what that difference comes to. (11) An anonymous donation that surfaces only after the donor's death: I said this is the clearest case of the lot, which sits badly with case 8 and worse with my friend's entire position, there being no audience left to convince.

  What I want from you is the principle, or the shortlist of candidate principles, that best organises this mess. State each precisely — in whatever vocabulary you prefer, so long as it is unambiguous about how much information a display carries and to whom it carries it — and then work through it clause by clause, saying which of my cases forced each clause in and which it was merely accommodating. Test the survivors against two cases I did not raise: a public apology that costs the apologiser nothing at the time of utterance but forecloses any later denial; and a costly initiation ritual that every member of a community undergoes, so that it is expensive for all and differential for none. Then be honest about the casualties. My own suspicion is that cases 5 and 7 cannot both stand, since the first makes publicity essential to signalling and the second makes it irrelevant, and I would much rather be told which one to abandon than be handed an account with an epicycle bolted onto it to save both. If preserving every verdict requires something baroque, say so plainly and tell me what the leaner account costs me — and where two principles make the same verdicts on all eleven cases, propose one further case that would separate them. Please spare me citations and suggestions for further reading: I want the argument, not a bibliography.
reasoning: |-
  Hmm, this user has presented a fascinating philosophical and biological puzzle about costly signaling. They've had an intense debate with a friend about whether expensive displays actually convey information or merely create an illusion of doing so. The user takes a nuanced position that focuses on how costs differentially affect people in different states, while their friend adheres to a strict Zahavian view where cost alone matters.

  Looking at their 11 varied examples, I notice several key tensions that need resolution: 
  - The role of publicity in signaling (cases 5 vs 7)
  - Whether observable cost is necessary (case 8 vs 11)
  - The difference between signals and involuntary indicators (case 10)
  - Contingent costs versus upfront costs (case 9)

  The user explicitly asks for principles that organize these cases without baroque complications, and wants me to identify which cases force certain clauses in the principles. They're clearly intellectually rigorous - notice how they anticipate tensions between their own examples and even suggest test cases. 

  The core insight emerging from all examples is that information comes not from raw cost, but from how costs would have affected counterfactual scenarios. The differential impact principle seems most promising - it explains why the nurse's donation (case 4) signals more than the heir's, and why the unobserved sacrifice (case 7) still qualifies as a signal despite lacking an audience. 

  For the publicity question, I'll argue that case 7 (the unobserved sacrifice) actually strengthens the signaling concept by showing that information exists independently of observation, while case 5 (the wedding) demonstrates how publicity leverages that information. They're compatible when we distinguish the signal's existence from its reception.

  The test cases further refine the principle: the irrevocable apology shows how costs can be deferred but still differential, while the uniform initiation ritual fails precisely because it lacks differential impact. 

  Ultimately, the nurse's donation and the anonymous posthumous gift stand as the purest examples - their signaling power derives entirely from the giver's counterfactual vulnerability, undistorted by reputation or reciprocity. That's the elegant core the user is seeking.
answer: |-
  Based on your cases and the core tension you identified, here’s a precise principle that organizes your verdicts, followed by a dissection of its clauses and how it handles your cases and tests:

  ### The Principle: Differential Counterfactual Cost (DCC)
  **A display carries information about an underlying state \( S \) to an observer \( O \) in proportion to:**
  1.  **The difference in net cost** (or burden) that executing the display *would impose* on an individual lacking \( S \), compared to one possessing \( S \), evaluated *at the point of display commitment*.
  2.  **The irreversibility of the cost commitment** – how irrevocably the cost is bound to the truth of the display concerning \( S \), making deception disproportionately more expensive or impossible for someone lacking \( S \).

  ### Clause Breakdown & Case Justification
  *   **Clause 1 (Differential Cost):** Forced by cases **4 (Heir vs. Nurse)**, **8 (No Alternative)**, and **11 (Anonymous Posthumous)**.
      *   **Why?** Raw expenditure is meaningless without comparing counterfactuals: *What would this action cost someone else/a different version of me?* Cases 4 & 11 show information derives from the *relative burden*, not absolute cost. Case 8 shows that if the cost is identical regardless of \( S \) (here, love for sibling), it conveys zero information *about \( S \)* (though it might signal something else, like desperation).
      *   **Accommodated by:** **1 (Friend to Wedding)** - High differential cost for non-friend (no willingness); **3 (Founder Salary)** - Low cost for genuinely committed founder (sacrifice is easy), high cost for greedy founder (sacrifice is intolerable); **6 (Tattoo)** - High differential cost (removal cost/indelibility worse for insincere); **7 (Turned Down Job)** - High differential cost for non-committed person (massive opportunity cost unbearable); **9 (Bonded Promise)** - Differential cost only manifests *if lying* (see Clause 2).
  *   **Clause 2 (Irreversible Commitment):** Forced by cases **2 (Condolence Card Service)**, **5 (Wedding vs. Honeymoon)**, **9 (Bonded Promise)**, and **10 (Involuntary Traits)**.
      *   **Why?** Clause 1 isn't enough. Case 2: Handwritten note vs. service costs similar time/money, but the service *decouples the cost from sincerity* – you pay the same whether sincere or not. Case 5: The wedding cost is publicly *committed* to the *relationship declaration*; the honeymoon cost, while large, isn't inherently committed to proving anything about commitment to others (it could just be hedonism). Case 9: The utterance cost is near zero, but the *irrevocable link* between breaking the promise and paying the bond creates the differential (Clause 1 only applies *if* lying happens). Case 10: Distinguishes signals (voluntary, costly displays) from **indices** (involuntary, unfakeable correlates of \( S \)). The cost of a limp/stammer isn't *voluntarily committed* to signal \( S \); it's an unavoidable byproduct. DCC focuses on *signals* – displays where cost is *chosen* to be bound to \( S \).
      *   **Accommodated by:** **1 (Friend to Wedding)** - Cost is committed to demonstrating friendship; **3 (Founder Salary)** - Accepting low salary commits to prioritizing staff/company; **6 (Tattoo)** - Cost/indelibility is the ultimate commitment; **7 (Turned Down Job)** - The *act of turning it down* is the irreversible commitment, even if unseen. The cost (opportunity) is sunk upon refusal.

  ### Handling Your Cases
  1.  **Friend to Wedding:** High Differential Cost (Clause 1) + Cost committed to demonstrating friendship (Clause 2). **CONVINCING.**
  2.  **Condolence Card Service:** Low Differential Cost (same cost for sincere/insincere) + Cost not committed to sincerity (service pays regardless) (Clause 2). **UNCONVINCING.**
  3.  **Founder Salary (Good Staff):** High Differential Cost (easy sacrifice for committed, hard for greedy) + Cost committed to prioritizing staff/company (Clause 2). **CONVINCING.** *(Bad Staff):* High Differential Cost *in reverse* (hard sacrifice for committed founder - they *want* to pay staff well, easy for greedy founder - they save money). Signals greed, not commitment. **EVIDENCE OF OPPOSITE.**
  4.  **Heir vs. Nurse:** High Differential Cost for Nurse (Clause 1 - loss unbearable without generosity), Low Differential Cost for Heir (loss bearable even without generosity). **NURSE STRONGER SIGNAL.**
  5.  **Big Wedding:** High (likely) Differential Cost (Clause 1) + Cost publicly & irrevocably committed to the *declaration of commitment* (Clause 2). **SIGNALS COMMITMENT.** *Long Honeymoon:* High Cost, but Low Differential Cost *regarding commitment* (hedonists also like luxury trips) + Cost not committed to *proving commitment* (Clause 2 - it proves wealth/desire for vacation, not commitment). **SIGNALS NOTHING (about commitment).**
  6.  **Facial Tattoo:** Very High Differential Cost (Clause 1 - removal cost/indelibility worse for insincere) + Ultimate Commitment (Clause 2 - irreversible). **STRONG (if grotesque).**
  7.  **Turned Down Job:** Very High Differential Cost (Clause 1 - unbearable loss for non-committed) + *Act of refusal* is the irreversible commitment, binding the cost (opportunity) to the state \( S \) (commitment), even if unseen (Clause 2). **BETTER SIGNAL (than tattoo, as no "cheap" alternative exists for insincere, unlike temporary tattoo).** (Information exists; reception is a separate issue).
  8.  **Three Jobs for Sibling:** High Cost, but **Zero Differential Cost** (Clause 1 - cost is identical whether done out of deep love or grim obligation/guilt; no alternative). **NO SIGNAL (about love).**
  9.  **Bonded Promise:** **Low upfront Cost (utterance).** High Differential Cost *contingent on lying* (Clause 1 - bond forfeited only if insincere) + Bond *irrevocably links* cost to deception (Clause 2). **COMPLETELY CREDIBLE.**
  10. **Stammer/Limp/Accent:** High reliability (unfakeable index). **NOT A SIGNAL** per DCC. Why? The "cost" is not *voluntarily incurred and committed* to convey information about \( S \). It's an unavoidable correlate. DCC defines signals by *strategic cost commitment*.
  11. **Anonymous Posthumous Donation:** High Differential Cost (Clause 1 - only truly generous would bear this cost for no recognition) + The *act of setting it up* irrevocably commits the cost to the state \( S \) (generosity) (Clause 2). **STRONG SIGNAL.** (Information exists; audience reception irrelevant to signal strength, though timing determines *when* it's received).

  ### Resolving Case 5 & 7 Tension
  *   **DCC resolves this:** Publicity isn't *essential* for the signal to *exist* or carry information (Clause 2 commitment can be private, as in Case 7). **Case 7 stands.** Publicity *is* often a mechanism to *enforce* Clause 2 (irreversible commitment) by making denial harder, as in the wedding (Case 5), but it's not the *only* mechanism (private irrevocable actions like refusal or secret contracts work too). **Keep Case 7, clarify Case 5.**

  ### Testing the Principle: New Cases
  1.  **Public Apology (Costs nothing now, forecloses denial later):**
      *   **DCC Verdict:** **Strong Signal.** *Clause 1:* High Differential Cost - Denial later is cheap for the innocent, ruinous for the guilty. *Clause 2:* The utterance *irrevocably commits* the speaker; future denial becomes impossible/costly only *if* the apology was insincere. The cost is contingent on later deception/denial, similar to the bonded promise.
  2.  **Costly Uniform Initiation Ritual (Expensive for all, no differential):**
      *   **DCC Verdict:** **No Signal** about any underlying state \( S \) *distinguishing members*. *Clause 1:* **Zero Differential Cost** - The cost is identical for all types undergoing it (e.g., brave/cowardly, loyal/disloyal). It signals only "underwent initiation" or "has resources," not deeper qualities. It may function as a *badge* or filter, but conveys no *differential* information about \( S \).

  ### Casualties and Leaner Costs
  *   **Casualty:** Your initial clause "*how much of that cost falls precisely in those states of the world in which the display turns out to have been false*" is partially absorbed by Clause 2 (Irreversible Commitment) and the counterfactual nature of Clause 1. DCC is leaner and avoids defining "states of the world where false".
  *   **Cost of Leanness:** DCC might seem less intuitive for Case 9 (Bonded Promise) initially, as the *upfront* cost is low. It forces focus on the *counterfactual cost differential* and the *irrevocable link* created by the bond mechanism. This is the price of avoiding epicycles – we accept contingent costs.

  ### Final Principle (Refined by Tests)
  **A deliberate display carries information about an underlying state \( S \) to an observer \( O \) proportionally to the difference in net burden it would impose on an individual lacking \( S \) versus one possessing \( S \), and to the degree the display irrevocably binds that burden to the truth of \( S \) for the displayer.**

  This principle captures the essence of costly signaling – it's not the money burned, but the vulnerability strategically accepted that only the "real deal" can afford. The nurse's donation and the deathbed anonymity are its purest expressions.
