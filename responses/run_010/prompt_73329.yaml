prompt: |-
  I'm a staff software engineer at a company that builds implantable neural prosthetics. What we ship today is unglamorous: when a small subregion has been damaged by stroke or injury, we learn that region's input-output mapping from months of recordings and replace its function with a synthetic module, so the signals arriving produce approximately the signals that used to come out. The roadmap I'm working on is more aggressive, and it is the part that has gotten us into arguments. Elective, incremental replacement of healthy tissue, one module per month, with the patient awake, talking, and reporting throughout a multi-year schedule. Our counsel has asked me to help draft the informed-consent language, and there is a sentence I cannot write: what the patient is guaranteed to survive. My training is in distributed systems, so I can specify exactly what the device does, but I have no idea what would count as a correct answer to the question it raises, and I would rather know that before I start reading theories of personal identity, which I assume is the name of the relevant literature.

  Our device has features that I suspect the standard thought experiments were not built to handle, and I want requirements that a theory cannot dodge by idealizing them away. First, fidelity is statistical rather than exact: the module reproduces the tissue's behavior within a measured tolerance, and the tolerance that counts as good enough plausibly differs by region, since matching a visual area closely may be a different matter from matching something involved in autobiographical memory. Second, modules are patchable after implant, so a patient's functioning can change with a firmware update and no surgery; because patches are written once and shipped to everyone, two patients' synthetic parts can drift toward being more similar to each other than to their own earlier tissue. Third, the implant takes periodic state snapshots and can restore one, and restore-into-a-second-body is at least conceivable, which gives us a branching case in which one branch is the original tissue and the other a restored copy, rather than two equal halves. Fourth, the synthetic internals are opaque: we can verify outputs but never confirm that the internal states resemble the biological ones they replaced, since the same function can be realized in a completely different format. Fifth, partial states are permanent. Plenty of patients will sit at something like thirty percent synthetic for the rest of their lives, and some will die mid-schedule, so whatever an account says has to apply to intermediate fractions and not only to the endpoints.

  So: write the desiderata, the specification any account of whether the patient survives this procedure must meet for me to be able to use it in a consent document and in a regulatory submission about what restoring a snapshot does to the person who was snapshotted. Exactly five numbered items, each a sentence or two: the requirement, the case or consideration that forces it (yours or mine), and a tag saying whether you take it to be non-negotiable or a preference of one particular camp. Make sure the set covers the distinctions a theory must not collapse, including the difference between being the same person and whatever actually makes survival worth wanting, between a relation that can branch and one that cannot, between the gradual schedule and installing every module at once under anesthesia, and between the patient and the organism. Include at least one demand that looks reasonable but is really just one side's prejudice, such as insisting there must always be a determinate answer, and say why it is a prejudice. For at most one item, state outright that it cannot be jointly satisfied with another item on the list and name the other; that is the part I most want to see. No introduction, no conclusion, and no scorecard of existing views. I will read the contenders afterward and score them myself against whatever list you give me.
reasoning: |-
  Okay, the user is a staff software engineer working on implantable neural prosthetics. They're dealing with an aggressive roadmap involving elective, incremental replacement of healthy brain tissue over years. Their main issue is drafting informed consent about what the patient survives, especially since their background is in distributed systems, not philosophy. They want a set of five specific desiderata for any theory of personal identity to meet, based on unique features of their tech.

  I need to understand the key aspects of their technology that challenge traditional theories. First, fidelity is statistical, not exact, and tolerances vary by brain region. Second, modules are patchable, so firmware updates can make synthetic parts across patients more similar to each other than to their original tissue. Third, they can take snapshots and restore them, even into another body, creating branching cases. Fourth, the synthetic internals are opaque; they can't verify internal states match biological ones. Fifth, partial states are permanent since patients might stay at intermediate synthetic percentages or die mid-schedule.

  The user wants exactly five numbered items, each with a requirement, the case that forces it, and a tag indicating if it's non-negotiable or a preference. They want coverage of key distinctions: same person vs. what makes survival desirable, branching vs. non-branching relations, gradual vs. all-at-once replacement, and patient vs. organism. They also want one item that's a disguised prejudice, like insisting on determinate answers. For one item, I should note an incompatibility with another.

  Breaking this down: The first item should address the core of survival—what matters to the patient. The branching case with snapshots forces the issue. This seems non-negotiable because without defining what matters, consent is meaningless. 

  Second, the statistical fidelity and regional differences. A theory must allow for approximate functional equivalence without requiring exact neural correspondence. This is non-negotiable because their tech can't achieve exact matches.

  Third, gradualism and partial states. The possibility of patients at 30% synthetic or dying mid-process means the theory must handle intermediate states. Non-negotiable since it's a real-world constraint.

  Fourth, branching from snapshot restores. The restore-into-second-body scenario forces this. Theories must distinguish between branching and non-branching continuity. Non-negotiable.

  Fifth, the demand for determinate answers, which is actually a prejudice. Legal and consent docs need yes/no answers, but reality might be vague. This is a preference, not a necessity.

  Now, the incompatibility: Item 1 (what matters) and Item 4 (branching) conflict. If branching is possible, survival might not be unique, but Item 1 assumes a binary survive/die outcome. 

  I should also ensure the distinctions are covered: same person vs. survival desirability (Item 1), branching (Item 4), gradual vs. all-at-once (implied in gradualism), patient vs. organism (not explicitly stated, but gradualism touches on it). 

  Hmm, the patient vs. organism distinction might need more attention. But the user mentioned partial states and intermediate fractions, which implies the organism continues even as synthetic parts replace tissue. Maybe Item 3 covers that by handling partial replacements. 

  For the prejudice item, insisting on determinate answers (Item 5) makes sense because theories like Parfit's might say survival isn't binary, but consent forms need clear answers. 

  Finally, making sure each item has the structure: requirement, case forcing it, tag. Keep it concise, no intros or conclusions. Align with the user's need for practical, tech-specific criteria that avoid philosophical idealism.
answer: |-
  Here are the five desiderata for any account of personal survival in your context:

  1. **Requirement**: The account must distinguish *survival* (what matters to the patient) from *personal identity* (the metaphysical relation of being the same person). It must specify what property, if preserved, makes the process *not death* from the patient’s perspective.  
  **Case**: A patient undergoing incremental replacement cares about continuing their subjective experience and values, not merely satisfying a formal criterion of identity.  
  **Tag**: Non-negotiable (forced by the ethical purpose of consent).  

  2. **Requirement**: The account must accommodate *statistical functional equivalence* without requiring identical neural implementation or state-for-state correspondence. It must define tolerable error margins per cognitive domain (e.g., vision vs. memory).  
  **Case**: Your synthetic modules approximate, but do not replicate, biological function with region-dependent tolerances; internal states are opaque and need not resemble biological ones.  
  **Tag**: Non-negotiable (forced by technical constraints).  

  3. **Requirement**: The account must handle *permanent partial replacement* and *gradual transition*, providing a criterion for survival that applies at every intermediate stage (e.g., 30% synthetic) and does not require completion of the full schedule.  
  **Case**: Patients may die mid-schedule or remain partially synthetic indefinitely; survival cannot depend on an arbitrary completion threshold.  
  **Tag**: Non-negotiable (forced by real-world clinical outcomes).  

  4. **Requirement**: The account must address *branching* (e.g., restoring a snapshot into a second body) and specify whether *both* branches can claim survival, or if survival is unique to one path. It must clarify if branching destroys the original or creates duplicates.  
  **Case**: Snapshot restoration creates two continuers: one from the original biological path and one from the synthetic copy.  
  **Tag**: Non-negotiable (forced by device capabilities). *This cannot be jointly satisfied with Item 1 if Item 1 requires non-branching continuity for survival*.  

  5. **Requirement**: The account must always yield a *determinate answer* (survives/does not survive) for legal consent and snapshot restoration, rejecting vagueness or spectrum-based judgments.  
  **Case**: Regulatory submissions and informed consent require binary guarantees (e.g., "you will survive the procedure").  
  **Tag**: **Prejudice** (forced by institutional needs, not metaphysics). *Rationale*: Insisting on determinacy ignores that survival may be a matter of degree (e.g., after 30% replacement) or context-dependent; this demand reflects legal pragmatism, not philosophical necessity.  

  ### Key Distinctions Covered:  
  - **Item 1**: Same person vs. what makes survival desirable.  
  - **Item 4**: Branching vs. non-branching relations.  
  - **Item 3**: Gradual vs. single-step replacement (via intermediate states).  
  - **Item 3/4**: Patient (persisting consciousness) vs. organism (biological continuity).
