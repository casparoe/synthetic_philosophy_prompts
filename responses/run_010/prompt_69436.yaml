  Start with **Purpose and Scope** to ground everything in institutional allocation. Then **Desiderata** as a numbered list with tags. **Distinctions** will prevent common conflations. **Incompatibilities** will highlight trade-offs. **The Excluder** names epistemic opacity as the biggest filter. **Brief Scorecard** rates theory families. **Bottom Line** advises against over-theorizing.  

