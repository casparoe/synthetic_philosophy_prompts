  For the rivalry-relocation requirement (their point "a"), the real conflict isn't over ideas but over market positions and institutional resources. This needs explicit framing as control over applications. The boundary problem ("b") requires operational definitions—perhaps "the minimal licensable unit" would work.  

  Independent arrival ("c") forces a choice: reward first filers (patent logic) or allow parallel use (copyright logic). Since tech transfer deals with patentable subjects, I'll lean toward patent norms but note the tension.  

  Foreclosure of improvements ("d") is thorny—blocking downstream work contradicts academic values but enables licensing. The desideratum must demand balance without vetoing exclusivity.  

  Epistemic opacity ("g") might be the killer: if provenance is often untraceable, any theory requiring clear lineage fails. This could eliminate labor-based theories outright.  

  In the scorecard, I'll show:  
  - Labor theories fail on opacity and rivalry-relocation  
  - Personality theories fail on boundary definitions and credit-control separation  
  - Incentive theories handle disclosure well but struggle with improvements  
