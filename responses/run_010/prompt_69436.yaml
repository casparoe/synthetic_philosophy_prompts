answer: |-
  ### Purpose and Scope  
  The theory must resolve practical disputes over institutional allocation of rights to potentially licensable academic outputs (algorithms, assays, data). It is **not** required to philosophically define "idea-ownership" universally, but to:  
  1. **Assign clear, defensible entitlements** between researchers, universities, and external parties;  
  2. **Enable licensing decisions** that withstand legal scrutiny and align with institutional missions;  
  3. **Resolve recurring conflicts** (e.g., independent invention, boundary disputes, credit allocation);  
  4. **Operate under epistemic constraints** (unclear provenance, fuzzy boundaries).  
  Metaphysical elegance is irrelevant; operational clarity and institutional sustainability are paramount.  

  ---

  ### The Desiderata  
  1. **Rivalry-Relocation Requirement**  
     - **Statement**: The theory must explain how non-rival ideas justify exclusive control by identifying the *rivalrous resource* (e.g., market position, research funding, institutional reputation) that exclusivity regulates.  
     - **Motivation**: Preventing free-riding on institutional investment (e.g., a startup commercializing a student’s algorithm without sharing revenue).  
     - **Tag**: Non-negotiable. Without this, ownership claims collapse into abstract moralizing.  

  2. **Boundary Definition**  
     - **Statement**: The theory must specify the *unit of ownership* (e.g., specific embodiment, problem-solution pair, technical function) with legally definable boundaries.  
     - **Motivation**: Disputes over whether a modified assay or algorithm derivative constitutes a new "idea."  
     - **Tag**: Non-negotiable. Vague boundaries invite litigation and stifle licensing.  

  3. **Independent Arrival Accommodation**  
     - **Statement**: The theory must justify granting exclusivity to first-to-file/-publish inventors despite simultaneous discovery, or reject exclusivity entirely.  
     - **Motivation**: Common in fast-moving fields (e.g., AI); patent’s "first-to-file" vs. copyright’s independent creation doctrine create inconsistent outcomes.  
     - **Tag**: Negotiable (scope depends on domain).  

  4. **Improvement Permeability**  
     - **Statement**: The theory must limit original owners’ veto over improvements while ensuring they benefit from downstream value.  
     - **Motivation**: Blocking improvements (e.g., via broad patents) contradicts academic progress yet incentivizes initial disclosure.  
     - **Tag**: Non-negotiable. Failure here undermines research ethics and innovation.  

  5. **Credit/Control Separation**  
     - **Statement**: The theory must disentangle attribution (credit, reputation) from economic control (licensing, exclusion), treating them as distinct interests.  
     - **Motivation**: Researchers demand credit; institutions need control for commercialization. Conflating them causes conflict (e.g., a postdoc insisting on control to protect reputation).  
     - **Tag**: Non-negotiable.  

  6. **Disclosure Justification**  
     - **Statement**: The theory must explain why public disclosure is a condition for ownership (e.g., as a social bargain, not inherent to property).  
     - **Motivation**: Patent law’s disclosure requirement clashes with trade secrecy; universities need clarity on when secrecy forfeits rights.  
     - **Tag**: Negotiable (implementation varies).  

  7. **Opacity Tolerance**  
     - **Statement**: The theory must allocate rights when provenance is untraceable (e.g., folk knowledge, incremental innovation, code fragments).  
     - **Motivation**: Many academic outputs emerge from cumulative, poorly documented collaboration.  
     - **Tag**: Non-negotiable. Theories requiring clear provenance are useless in practice.  

  8. **Institutional Sustainability**  
     - **Statement**: Rights allocation must fund further research (e.g., via licensing revenue) without deterring collaboration or entry.  
     - **Motivation**: Universities must balance revenue generation with open science norms.  
     - **Tag**: Non-negotiable.  

  9. **Labor Desert (Camp Prejudice)**  
     - **Statement**: "Ownership must reflect labor investment."  
     - **Motivation**: Appeals to fairness (e.g., a grad student claiming rights over an algorithm they coded).  
     - **Tag**: Camp prejudice. Labor is neither necessary (e.g., accidental discoveries) nor sufficient (e.g., routine work) for ownership.  

  10. **Single Determinate Owner (Camp Prejudice)**  
      - **Statement**: "Every idea must have one unambiguous owner."  
      - **Motivation**: Simplifies licensing but ignores collaborative science.  
      - **Tag**: Camp prejudice. Joint ownership or rights partitioning (e.g., control vs. revenue) often better serves institutional goals.  

  ---

  ### Distinctions the Theory May Not Collapse  
  - **Expression vs. Thought**: Ownership of *specific implementations* (code, assay protocol) ≠ ownership of abstract concepts (factorization methods).  
  - **Exclusion vs. Remuneration**: Right to block others ≠ right to demand payment (e.g., compulsory licensing for improvements).  
  - **Attribution vs. Control**: Moral right to be cited ≠ economic right to license.  
  - **Discovery vs. Invention**: Describing natural phenomena (unownable) vs. creating novel solutions (potentially ownable).  
  - **Provenance vs. Function**: Who made it vs. what it does. The latter often matters more for licensing.  

  ---

  ### Incompatibilities  
  Two key tensions make **full coherence impossible**:  
  1. **Independent Arrival vs. Labor Desert**: Granting exclusivity to first arrivals (e.g., first-to-file) ignores labor of independent second creators. Labor theories cannot resolve this without arbitrary cutoff rules.  
  2. **Improvement Permeability vs. Institutional Sustainability**: Permitting uncontrolled improvements undermines revenue from exclusive licensing. But blocking improvements harms science.  
  **Argument**: The rivalry-relocation requirement demands exclusivity to capture value (sustainability), while improvement permeability demands access to rivalrous resources (e.g., markets). No theory reconciles this; practical trade-offs (e.g., royalty-sharing for improvements) are unavoidable.  

  ---

  ### The Excluder  
  **Opacity Tolerance** eliminates the most contenders:  
  - **Kills**: Lockean labor and personality theories (require traceable provenance); strong natural-rights accounts (presume determinable ownership).  
  - **Survive**: Incentive theories (focus on outcomes, not origins) and deflationary approaches (rights based on institutional rules, not metaphysical claims).  

  ---

  ### Brief Scorecard  
  - **Lockean Labor Theories**: Fails boundary definition (labor doesn’t individuate ideas), opacity tolerance (requires clear provenance), and improvement permeability (labor on improvements may exceed original).  
  - **Personality Theories**: Fails credit/control separation (conflates attribution with control), rivalry-relocation (self-expression isn’t rivalrous), and opacity tolerance (personality requires identifiable authors).  
  - **Incentive-Welfare Theories**: Satisfies disclosure justification (disclosure as social benefit), institutional sustainability, and opacity tolerance (provenance irrelevant to incentives). Struggles with independent arrival (may arbitrarily favor first-comers) and improvement permeability (exclusivity can stifle downstream incentives).  
  - **Deflationary Bundle-of-Entitlements**: Best fit. Treats "ownership" as context-specific rules for exclusion/remuneration. Satisfies boundary definition (rights tied to concrete assets), credit/control separation, and opacity tolerance. Weak on independent arrival (requires arbitrary rules) but flexible for institutional tailoring.  

  ---

  ### Bottom Line  
  Your office should abandon the quest for a unified theory of idea-ownership. No account satisfies all desiderata; opacity tolerance and rivalry-relocation alone doom metaphysical approaches. Instead, **adopt a deflationary framework**: craft a policy that allocates *specific entitlements* (revenue shares, veto rights, attribution) based on institutional goals, not abstract ownership. Prioritize boundary definitions, improvement protocols, and provenance-agnostic defaults. A defensible bundle of rules beats a flawed theory every time.
