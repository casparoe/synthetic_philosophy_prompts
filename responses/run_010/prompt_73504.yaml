answer: |-
  Here's a translation of Scanlon's contractualism into your risk-regulation vocabulary, followed by the residue report and answers to your specific questions. The mapping is rigorous, preserving conceptual conflicts rather than smoothing them over.

  ### Translation of Scanlon's Four Elements
  1.  **"An act is wrong if forbidden by principles no one could reasonably reject, justified to each person individually":**
      *   **Regulatory Counterpart:** **The Individual Risk Criterion (as a floor for intolerability), applied *identifiably*.** This sets a non-negotiable upper bound on risk *to any specific person* from licensee actions. Justification for actions imposing risk *must* be defensible *to* the specific individuals bearing that risk (or their reasonable representatives), not just to the population aggregate. The "intolerable" level marks risk that *any* individual could reasonably reject as a basis for governing principles.
      *   **Bend:** Shifts focus from *regulator-setting* a threshold based on societal norms to the *individual's perspective* as the ground for reasonable rejection. The "intolerable" level *becomes* the operationalized level where rejection is deemed reasonable.

  2.  **"Rejection only on grounds of how it bears on the rejector, never totals/averages":**
      *   **Regulatory Counterpart:** **No clean counterpart. Direct conflict with core methodology.**
      *   **Translation Attempt (Bends Terms Fundamentally):** This forbids justifying an action *primarily* based on **Net Reduction in Expected Fatalities** or **Cost-Benefit Analysis using VSL**. The **Gross-Disproportion Test** *could* be bent if interpreted *only* through the lens of the *identifiable individual(s)* bearing the sacrifice or heightened risk, explicitly *ignoring* the aggregated benefits to others. "Sacrifice" is measured *only* for those harmed/risked; "benefit" isn't summed VSL, but the specific risk reduction *to them* (if any).
      *   **Bend:** Severely limits the Gross-Disproportion Test. It can only weigh *identifiable* sacrifice against *identifiable* risk reduction *for the same individual(s)*. It cannot weigh sacrifice by A against risk reduction dispersed over B, C, D...Z.

  3.  **"Large numbers of small benefits do not outweigh one serious harm (Electric Shock Example)":**
      *   **Regulatory Counterpart:** **Conflict with the logic of Collective Dose Reduction & VSL Monetization. Partial resonance with the Identifiable vs. Statistical Life distinction and De Minimis levels.**
      *   **Translation:** This asserts that reducing a **Diffuse Collective Dose** (yielding small, probabilistic individual risk reductions spread over many) **cannot justify imposing a Certain, Identifiable Non-Fatal Injury** (or other significant harm) on a specific worker, *even if* the monetized VSL of the collective reduction vastly exceeds the cost of the injury. The **De Minimis Individual Risk Level** becomes crucial *not* as a point below which risk is ignored, but as a point *above which* the aggregated "benefits" to others become *irrelevant* to justifying the harm to the identifiable individual. The harm stands unrebutted by aggregation.
      *   **Bend:** Radically changes the role of De Minimis. It's not about ignoring tiny individual risks, but about blocking the aggregation of tiny individual *benefits* to override a significant, identifiable harm to one. VSL aggregation is rejected.

  4.  **"Saving five over one justified by comparing pairwise complaints, not summing":**
      *   **Regulatory Counterpart:** **No counterpart. Fundamental conflict with expected-value reasoning.**
      *   **Translation Attempt (Highly Strained):** Evaluating a safety modification shouldn't rely on **Expected Fatalities Reduced**. Instead, compare the complaint of the *single identifiable person* who would die if you don't act (e.g., install Modification X) against the complaint of *each of the five identifiable people* who would die if you don't act (e.g., *don't* install Modification X). No one in the group of five can complain their complaint is *lesser* than the single person's; the single person cannot claim their complaint is *greater* than any one of the five. Therefore, the principle favouring saving the five isn't reasonably rejectable. *This process has no operational equivalent in PSA/CBA.*
      *   **Bend:** Requires abandoning probabilistic *expectation* for a (hypothetical) *comparison of specific realized outcomes/identifiable victims* across different choice scenarios. Inapplicable to diffuse, probabilistic public risk reductions.

  ### Residue Report: Sorting the Four Claims

  1.  **"Principles no one could reasonably reject, justified to each individually":**
      *   **Mapping:** **Bends Term.** Maps onto the *structure* and *intent* of the **Individual Risk Criterion (as Intolerability Floor)** and the implicit need for justification. Requires bending "intolerable" to explicitly mean "reasonably rejectable by an affected individual".
      *   **Residue:** The *source* of the criterion (contractual agreement vs. regulatory authority) differs, but the focus on the individual threshold is shared.

  2.  **"Rejection only on personal grounds, not totals/averages":**
      *   **Mapping:** **Inexpressible Core / Forces Fundamental Bend.** Directly contradicts the foundation of **Net Expected Fatality Reduction, VSL Monetization, and Societal Risk (F-N) aggregation**. Bending the **Gross-Disproportion Test** to apply only within the sphere of identifiable individuals bearing both cost and risk is a radical limitation not supported by current practice. The core prohibition on using totals/averages *cannot* be implemented within the existing aggregative framework.
      *   **Residue:** **High - Fundamental Conflict.** The core anti-aggregation principle has no true home.

  3.  **"Many small benefits don't outweigh one serious harm (Anti-Aggregation)":**
      *   **Mapping:** **Bends Terms / Partial Resonance.** Resonates strongly with the **Identifiable vs. Statistical Life** distinction and the intuitive discomfort your case raised. Bends the **De Minimis Level** from "ignore risk below here" to "cannot aggregate benefits below here to override a significant harm". Conflicts directly with **Collective Dose Reduction via VSL**.
      *   **Residue:** **Medium-High.** Captures the *sentiment* driving concern for identifiable victims against diffuse benefits, but requires rejecting the core tool (VSL aggregation) used to justify such trade-offs. De Minimis is repurposed.

  4.  **"Saving five over one via pairwise comparison, not summing":**
      *   **Mapping:** **Inexpressible.** No counterpart. **Expected Fatality Reduction** is the antithesis of this method. The scenario requires identifiable victims in specific outcome states, incompatible with probabilistic risk assessment of public exposure. **F-N curves** operate on aggregates. **Gross Disproportion** relies on expected value.
      *   **Residue:** **High - No Expression.** The pairwise comparative justification method is alien to the framework.

  ### Answers to Your Specific Questions

  1.  **Is a steep F-N curve the operational content of Scanlon's anti-aggregation? Category Mistake?**
      *   **Answer: Category Mistake.** An F-N curve, *no matter how steep*, **still aggregates fatalities non-linearly.** It assigns disvalue to the *sum* (N) of fatalities in an event. Scanlon's anti-aggregation rejects summing *altogether* in the relevant justificatory context. A steep F-N curve says "100 deaths in one event is *worse than* 100 deaths in 100 separate events, but both are *much worse* than 10 deaths." Scanlon says, concerning the justification for imposing risk/harm: "The complaint of each of the 100 individuals facing a 1% risk of death in an event cannot be summed to override the complaint of one individual facing certain severe injury." The F-N curve addresses societal *aversion to catastrophe magnitude*; Scanlon addresses the *moral irrelevance of summing small individual complaints* to override a large individual complaint. The disagreement is fundamental, not rhetorical.

  2.  **Does the inexpressible residue indicate a genuine hole regarding second-personal justification?**
      *   **Answer: Yes, precisely.** Your framework evaluates *distributions of risk and cost* (ex ante) and *aggregate outcomes* (ex post). **It lacks the conceptual apparatus to model or require justification *owed specifically to each affected individual*.** Forms record impacts on groups (workers, public) and aggregate metrics (collective dose, expected fatalities). They cannot record "This principle governing risk imposition cannot be reasonably rejected by Worker A, who bears injury X, because justification Y is owed *to them*." Scanlon's "second-personal character of justification" – the idea that wrongness stems from what we owe *to each other* as individuals – is the core missing element. Your case exposed this: the form had no field for the objection grounded in what was owed *to that specific maintenance worker*.

  3.  **Is there anything in your vocabulary contractualism lacks or would be worse off without?**
      *   **Answer: Yes. Contractualism struggles with:**
          *   **Pure Risk Efficiency (absent equity concerns):** Contractualism focuses on justifiability *to individuals*. While risk distribution (*equity*) is crucial (could someone reasonably reject a principle imposing *disproportionate* risk?), the concept of maximizing *net* risk reduction (efficiency) *as a primary goal*, separable from individual complaints, is alien. It might emerge indirectly, but isn't a foundational value.
          *   **Operational Ex Ante Evaluation:** Contractualism's pairwise comparisons often lean towards ex post perspectives (comparing realized fates). Strict application struggles with justifying actions based *solely* on reducing low-probability, high-consequence risks *before* any incident occurs, especially when the reduction mechanism involves complex systems and diffuse benefits. Your framework's core strength is handling this probabilistic, systemic, ex ante reality.
          *   **De Minimis as Regulatory Threshold:** Scanlon's framework likely wouldn't recognize a level below which risk imposition requires *no justification whatsoever* to the individual. Every imposition, however tiny, needs *some* (perhaps minimal) justification owed to the affected person. Your "broadly acceptable" level as a practical regulatory cutoff has no direct equivalent. Contractualism would likely see this as a necessary but imperfect administrative tool, potentially masking very small individual complaints that aggregate significantly.

  ### Conclusion for the Panel
  Scanlon's contractualism highlights a fundamental tension in our framework, exposed by cases trading identifiable harm for diffuse public benefit. His core insight is that justification must be addressed *to each affected individual* and that aggregating small, diffuse benefits cannot override a significant, identifiable harm to one person. **This anti-aggregation principle (Points 2 & 3) has no true operational counterpart and conflicts directly with VSL-based cost-benefit analysis and the societal risk logic embedded in F-N curves.** While our Individual Risk Criterion provides a floor (Point 1, bent), and the Identifiable/Statistical distinction resonates (Point 3), the machinery lacks the capacity for second-personal justification (Point 2 & Question 2) or pairwise comparison (Point 4). Conversely, our tools for systemic, probabilistic, ex ante risk efficiency (Question 3) are not central to contractualism. The residue is significant: contractualism reveals our framework's inability to formally capture objections based on what is owed *to specific individuals* when aggregated benefits are used to justify their burden. This isn't a flaw easily fixed by bending terms; it points to a different foundational philosophy of justification.
