  Hmm, the user is asking about a specific argument pattern they've encountered in well-being philosophy, particularly in hedonistic theories that define "the good" as pleasure. They describe a back-and-forth where proponents list diverse pleasures, critics point out these lack a common experiential quality, defenders propose unifying properties (like "wanted continuation"), and then counterexamples emerge showing the property is either too broad (including non-pleasures) or too narrow (excluding clear pleasures). When this fails, defenders retreat to a "family resemblance" model à la Wittgenstein, claiming no common feature is needed.

  The user wants three things:  
  (1) A term for the overall list-vs-property dialectic  
  (2) A specific label for the final retreat to family resemblance  
  (3) If no term exists, a coinage with definition and boundary cases  

  Key observations:  
  - This mirrors Wittgenstein's "games" example from *Philosophical Investigations* §66-71, where he argues concepts like "game" lack essences but share crisscrossing similarities.  
  - The defender's pivot from essentialism to family resemblance isn't inherently fallacious—Wittgenstein presents it as a legitimate move—but becomes problematic when deployed to salvage a substantive thesis (e.g., "pleasure is the singular good").  
  - The issue isn't just about pleasure's heterogeneity; it's that the *theoretical role* assigned to pleasure (as the unitary foundation of well-being) collapses once it's acknowledged as a loose cluster.  

  For (1): The core pattern resembles what's often called the **problem of heterogeneity** in pleasure debates (e.g., Sidgwick, Parfit, Rachels). Nozick's "experience machine" also pressures hedonism by questioning whether pleasure's qualitative diversity can sustain well-being claims.  

  For (2): The final move is a **theoretical deflation**. It's distinct from:  
  - *No true Scotsman* (no redefinition occurs)  
  - *Motte-and-bailey* (no strategic retreat/reversion)  
  - *Ad hoc rescue* (it's openly acknowledged as a conceptual shift)  
  Closest existing terms:  
  - **Conceptual evaporation** (Dennett, for theories that lose content under pressure)  
  - **Dissolution via family resemblance** (direct descriptor)  
  But neither is canonical. Since the move immunizes the theory by abandoning its initial claim of unity, **pleasure-splintering** or **unity retreat** could work as coinages.  

  For boundary clarity: A *non*-example would be Mill's distinction between "higher/lower" pleasures—here, the defender maintains pleasure's unity via a new property (quality), rather than abandoning unity.  

  Best fit for the final move: **dissolution via family resemblance**. If coining: **essence-shedding maneuver**.  

  \answer{essence-shedding maneuver}
answer: |-
  Your description captures a nuanced and recurring pattern in philosophical debates about pleasure and well-being, particularly within hedonistic frameworks. I'll address your three requests in order, providing conceptual carving, distinctions, and terminology. The phenomenon you're observing—especially the "final move"—is indeed recognized, though no single term universally dominates. I'll synthesize established concepts and, where gaps exist, offer precise coinage with boundaries.

  ### 1. **The Overall List-vs-Property Pattern: "The Heterogeneity Problem for Pleasure"**
     - **What it is**: This dialectic is a standard objection to *hedonistic monism* (the view that pleasure is a single, unified good). Critics argue that the diversity of "pleasures" (thirst-quenching, aesthetic joy, intellectual satisfaction) lacks a common phenomenological or metaphysical core, making "pleasure" too fragmented to serve as a unitary foundation for well-being. Proponents respond by proposing unifying properties (e.g., "wantedness," "positive affect"), which critics then attack as over/under-inclusive.  
     - **Established term**: **Heterogeneity problem** or **heterogeneity objection** (e.g., in discussions of Sidgwick, Nozick, or contemporary hedonic psychology). It's most associated with debates around *phenomenal unity*: can all pleasures share a single "feel" or functional role? The bite is sharpest against *experiential hedonism* (which ties well-being to conscious states), as it suggests pleasure isn't a natural kind.  
     - **Key references**:  
       - Rachels (2000)* argues pleasure isn't a "homogeneous sensation" but a "mode of attention," inviting the dialectic you describe.  
       - Nozick's "experience machine" leverages heterogeneity: if pleasures are diverse, why value only *feeling* them?  
       - Wittgenstein's "games" analogy (§66–67, *Philosophical Investigations*) is often invoked here, but as a *solution* to heterogeneity, not the problem itself.  
     - **What it isn't**: It's not merely a *sorites paradox* (vagueness in boundaries) or *equivocation* (ambiguous word usage). The focus is on disunity in the phenomenon itself.

  ### 2. **The Final Move: From Essence to Family Resemblance**
     - **What it is**: After failing to define a strict common property, the defender shifts to a *family resemblance* model (à la Wittgenstein), denying that pleasure needs an essence. This dissolves the heterogeneity objection—since no essence was claimed—but at the cost of theoretical substance. Crucially, this move *immunizes the core thesis* ("pleasure = the good") by making it unfalsifiable: if pleasure is just whatever resembles paradigm cases (thirst, chess, etc.), the theory can't be challenged by counterexamples, but it also loses explanatory power. The original claim that pleasure is "one thing" grounding well-being evaporates.  
     - **Recognized concepts**:  
       - **Wittgensteinian dissolution**: A general strategy of dissolving philosophical problems by showing they arise from linguistic confusion (e.g., demanding essences where none exist).  
       - **Theoretical deflation**: In philosophy of science, when a theory retreats from strong claims to avoid refutation (similar to Lakatosian "degenerating research programmes").  
       - **Nearest misfit**:  
         - *Not no-true-Scotsman*: No redefinition occurs; the extension of "pleasure" remains the same.  
         - *Not motte-and-bailey*: The strong claim (pleasure has a unified essence) isn't reclaimed; it's abandoned.  
         - *Not ad hoc rescue*: It appeals to a pre-existing (Wittgensteinian) framework, but still sheds content.  
       - **Best existing fit**: **Conceptual evaporation** (coined by Dennett for theories that become vacuous under pressure) or **dissolution via family resemblance**. Neither is perfect, as they emphasize different aspects.  
     - **Why it strains**:  
       - In well-being theory, hedonism traditionally promised a *unified metric* for the good life (e.g., Bentham's "felicific calculus"). The family-resemblance move abandons this, reducing "pleasure is the good" to "things resembling paradigm pleasures are good"—which is circular or trivial.  
       - Wittgenstein used family resemblance descriptively (to analyze concepts), not normatively (to ground ethics). Applying it here risks *concept-stretching*: if "pleasure" includes anything resembling chess victories or itch relief, why call it "pleasure" at all?  

  ### 3. **Coinage for the Final Move: "Essence-Shedding Maneuver"**
     If no established term suffices, I propose:  
     - **Term**: **Essence-shedding maneuver**  
     - **Definition**: A defensive tactic where a theory responds to counterexamples by jettisoning its commitment to a unifying essence for a key concept, adopting a family-resemblance structure instead. This preserves the theory's formal structure (e.g., "pleasure is the good") but empties it of substantive content, rendering it resistant to refutation at the cost of explanatory power.  
     - **Boundary case (non-instance)**:  
       - *What should NOT count*: **Mill's "qualitative hedonism"**. When Mill distinguishes "higher" (intellectual) and "lower" (sensory) pleasures, he *adds* a property (competent-judge preference) to unify them. This retains an essence (pleasure as desirable consciousness) and addresses heterogeneity without shedding unity. It’s a *revision*, not a dissolution.  
       - *Why this boundary?* Mill’s move engages the objection substantively; essence-shedding avoids it by downgrading the concept.  
     - **Relation to neighbors**:  
       - Closer to *dissolution* than *reduction*; closer to *immunization* (Popper) than *falsification*.  
       - Fits philosophy of science's "degenerating programme" (Lakatos) but targets conceptual, not empirical, content.  

  ### Summary and Best Term
  - The **heterogeneity problem** names the core dialectic.  
  - The final move is a **conceptual evaporation** or **dissolution via family resemblance**, but these are descriptive, not standardized. For precision, **essence-shedding maneuver** captures the tactical retreat and content loss.  
  - Best established approximation: **Wittgensteinian dissolution** (though imperfect, as Wittgenstein didn’t apply it normatively).  
  - Best concise term for your purpose: **essence-shedding maneuver** (if coining), or **dissolution** (if preferring established roots).  

  For your machine-readable answer, I'll use the most fitting existing term (with caveats) as it's recognizable in context, but note that coinage may be warranted:  

  \answer{dissolution}  

  *(Note: "Dissolution" here specifically invokes the Wittgensteinian tradition of dissolving problems by rejecting essences. If this feels too broad, \answer{essence-shedding maneuver} is the precise coinage.)*
