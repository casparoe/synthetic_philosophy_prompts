prompt: |-
  I sit on a small grantmaking committee that scores candidate causes with the standard three-factor template — how much good addressing the problem would do, how much room there is for us to move it at the margin, and how few resources are already directed at it — and after several funding rounds I have started to notice something in our own records that I cannot characterize with the vocabulary I have. It is not that our scores are biased in some obvious direction, and it is not the familiar complaint that "nobody else is working on this" often just means nobody wanted it. The pattern concerns the relationship between the three axes and the reliability of the estimates feeding them. The causes that reach the top of our ranking are disproportionately ones where our evidence is thinnest: a far-future extrapolation resting on a chain of speculative assumptions, a single underpowered study of an intervention, a three-person expert survey. Thin evidence means wide uncertainty, and when we rank by expected value across such a wide distribution, the upside tail does the work — a cause whose importance is known only to within an order of magnitude will, more often than not, outscore a cause whose importance is well measured and merely very good. But thin evidence also pushes the neglectedness score up, because the problems that are hardest to evaluate are precisely the ones other funders and governments have steered clear of. So the same feature that inflates one score is simultaneously inflating a second score that the template treats as an independent factor, and the two are correlated through a common cause, which is our own ignorance. We are not, as far as I can tell, selecting the most important causes; we are selecting the least well measured ones, and then congratulating ourselves on their importance.

  I keep reaching for a term and every candidate lands close but not on it. The winner's curse, and what decision analysts call the optimizer's curse, capture the mechanism of choosing the maximum over a set of noisy estimates, and I am happy to grant that this is part of what is happening — but both seem to me to presuppose that the noise is of roughly comparable magnitude across the options being compared, whereas my case depends on the noise being systematically larger for the options that also score well on a separate criterion, which strikes me as a different and nastier structure. Regression to the mean describes what happens after the selection, not why the selection is skewed in the first place. Goodhart's law involves someone optimizing against a measure until it stops tracking the target, and nobody here is gaming anything; we are all trying to be honest. Adverse selection is the nearest analogy I have managed to construct, since it concerns a pool of applicants skewed toward those you cannot assess properly, but the insurance-market setting turns on information asymmetry between two parties, and here the ignorance is entirely on our side — the causes are not concealing anything from us. The Matthew effect describes the downstream prestige dynamics rather than the epistemic selection, and "exploration versus exploitation" describes the trade-off we are failing to manage without naming the particular way we are failing to manage it.

  There is also a second-order version that I would want any adequate name to cover. When this criticism is raised in our meetings, the standard reply is that we should commission better data before committing serious money; but the decision about which cause to investigate further is itself made using the same inflated scores, so the research agenda tilts toward the causes that already looked best for the wrong reason, and a year later they look better still, now with a citation trail of our own making. In our records, the causes we funded an initial scoping study for are nearly always the ones we end up funding properly, and I have no independent reason to think they were the best candidates for a scoping study either. So: is there an established concept for this configuration — a selection procedure whose criteria are correlated with the variance of the estimates they operate on, such that the procedure preferentially returns the least well measured candidates and then treats their poor measurement as a virtue? I would like the nearest existing concepts identified one by one, with the differences stated rather than merely listed, and a verdict on which, if any, is the best fit. If none fits cleanly, please coin a term and give it a genuine definition: necessary and sufficient conditions, and two or three boundary cases that should not count — for instance, whether an ordinary multi-criteria ranking with noisy inputs but no neglectedness-type factor qualifies, whether the correlation between criterion and variance is required or merely sufficient, and whether the phenomenon is still the same thing once the compounding research-agenda effect is absent. A bare label will not help me; what I need is the carving.
reasoning: |-
  Okay, let me unpack this user's problem. They're on a grant committee using a standard three-factor scoring system (importance, tractability, neglectedness), but they've noticed a disturbing pattern: top-ranked causes disproportionately have the thinnest evidence. Thin evidence creates wide uncertainty distributions, and when ranking by expected value, the upside tails dominate. Worse, that same thin evidence inflates neglectedness scores because others avoid hard-to-measure problems. So ignorance corrupts two supposedly independent criteria. 

  The user has already ruled out several near-miss concepts: winner's curse (assumes uniform noise), regression to the mean (describes aftermath, not cause), Goodhart's law (no gaming here), adverse selection (no hidden information), and others. They also describe a compounding effect where preliminary studies get prioritized using the same flawed scoring, creating self-reinforcing cycles. 

  Hmm... this feels like a collision of several statistical and epistemic phenomena. The core issue is that variance in estimates isn't random noise—it systematically correlates with neglectedness. That interdependence breaks the scoring model's assumptions. The user wants either an existing term that fits perfectly (unlikely) or a newly coined concept with precise boundaries. 

  Let me mentally scan decision theory for similar structures. The optimizer's curse comes close but doesn't account for criterion-variance entanglement. Maybe a variant of the "streetlight effect" where we overvalue measurable things? No, here it's the opposite—we're drawn to the darkness. 

  Perhaps "epistemic neglect feedback loop"? That captures the self-reinforcing nature but misses the statistical mechanism. Or "uncertainty premium"—the idea that neglectedness pays extra for ignorance? Still incomplete. 

  *Lightbulb moment*: This resembles "opportunity cost of knowledge" in economics—the paradox where investing in measurement reduces neglectedness, making the cause less attractive. But that's a consequence, not the phenomenon itself. 

  The closest existing framework might be Simpson's paradox in meta-analysis, where aggregating biased subgroups creates illusions. Here, the "subgroups" are evidence-quality tiers. But Simpson's paradox usually involves categorical confounders, not variance magnitudes. 

  After circling this, I suspect no perfect term exists. We need to coin something. "Ignorance premium bias" emphasizes the reward for poor data. "Neglectedness-uncertainty entanglement" is descriptive but clunky. Or "variance-neglectedness conflation"? 

  But the compounding effect is crucial—it's not just static bias but a dynamic where preliminary research validates flawed selections. That's almost like epistemic path dependence. Maybe "autocatalytic ignorance"? 

  *Pauses* Wait—let's define it structurally: 
  1) A scoring system with at least one "desirable uncertainty" criterion (like neglectedness) 
  2) High variance in other criteria's estimates 
  3) Systematic correlation between high variance and high scores on the uncertainty criterion 
  4) Optional: a feedback loop where initial selections trigger biased follow-up research 

  Boundary cases: 
  - Pure winner's curse (uniform variance) doesn't count 
  - Deliberate obscurantism (like shell companies) isn't this 
  - If neglectedness were perfectly measurable, the entanglement vanishes 

  "Epistemic Neglect Entanglement" (ENE) seems most precise. The feedback loop could be specified as "recursive ENE." 

  User will want clear differentiators from adjacent concepts. Must explain why adverse selection doesn't fit (no counterparty asymmetry) and why optimizer's curse is insufficient (it ignores criterion covariance). 

  Also vital to validate their insight: they've identified a real flaw in effective altruism-style prioritization where neglectedness becomes a proxy for uncertainty. That's profound—it means standard frameworks may systematically backfire. 

  *Double-checks* Did I address the second-order effect? Yes, by making the feedback loop an intensifier of the core phenomenon. The coined term should cover both base and compounded versions. 

  Final thought: User's observation feels universally applicable beyond grants—any prioritization system valuing "neglectedness" or "novelty" might suffer this. Naming it could help many fields.
answer: |-
  This is a profound and clearly articulated critique of a systemic flaw in prioritization systems that value neglectedness alongside impact and tractability. After analyzing your description against established concepts, I conclude that **no single existing term fully captures this phenomenon**, but the closest framework is an **interaction between the Optimizer's Curse and a novel structural flaw**. Below is a systematic dissection:

  ### Near-Miss Concepts & Why They Fall Short:
  1.  **Optimizer's Curse (OC):**
      *   **Fit:** Directly explains why selecting based on maximum *expected value* from noisy estimates leads to overestimation of the chosen option's true value.
      *   **Misfit:** OC assumes noise/variance is *random and relatively symmetric* across options. Your core insight is that variance is **systematically higher** for options scoring high on *neglectedness* (due to the shared cause of ignorance). OC describes the *statistical* overestimation but not the *structural correlation* between high variance and a high score on a *specific criterion* (neglectedness).

  2.  **Adverse Selection:**
      *   **Fit:** Captures the idea that the selected pool (top-ranked causes) is skewed towards "lemons" (hard-to-evaluate causes).
      *   **Misfit:** Requires *asymmetric information* – the "sellers" (causes/proponents) knowing more than the "buyers" (committee). In your case, the ignorance is *symmetric*; the causes aren't hiding complexity, it's inherent and *observably* complex to everyone. The committee knows the evidence is thin; the problem is how their scoring *interprets* that thinness.

  3.  **Winner's Curse:**
      *   **Fit:** Similar to OC in the context of auctions/bidding; winning often means overpaying due to uncertainty.
      *   **Misfit:** Shares OC's limitation regarding uniform variance. Also, typically implies a competitive setting where "winning" is costly, which is less central here than the *systematic prioritization bias*.

  4.  **Goodhart's Law:**
      *   **Fit:** Highlights the risk of a measure (the composite score) becoming a poor proxy for the true goal (maximizing impact).
      *   **Misfit:** Goodhart's Law usually implies *gaming* or *effort shifting* in response to the measure. Here, the distortion arises passively from the *inherent structure* of the criteria and the nature of uncertainty, not strategic behavior.

  5.  **Exploration-Exploitation Trade-off Failure:**
      *   **Fit:** Clearly describes the suboptimal dynamic where you keep "exploiting" (funding/further researching) poorly measured options that look good superficially instead of strategically "exploring" to reduce uncertainty elsewhere.
      *   **Misfit:** This is a *consequence* or *manifestation* of the underlying bias (the inflated scores driving the research agenda), not the core structural flaw *causing* the inflated scores.

  6.  **Streetlight Effect:**
      *   **Fit:** Metaphor for searching where it's easiest (well-lit/measurable areas) rather than where things might actually be.
      *   **Misfit:** You're describing the *opposite*: your system prioritizes the *darkest*, least measurable areas *because* they are dark, mistaking uncertainty for potential. It's an *anti-streetlight effect*.

  ### The Core Structural Flaw & Proposed Coinage
  The essence is: **A prioritization metric incorporates a factor ("neglectedness") that is intrinsically and positively correlated with the uncertainty (variance) of the estimates for other key factors ("importance," "tractability"), due to a common cause (lack of measurement/knowledge). This correlation creates a systematic bias towards prioritizing options with the highest estimation uncertainty, as the upside potential dominates the expected value calculation *and* simultaneously boosts the neglectedness score.**

  This warrants a new term: **Neglectedness-Uncertainty Entanglement (NUE)** or **Epistemic Neglect Entanglement (ENE)**.

  **Formal Definition of Neglectedness-Uncertainty Entanglement (NUE):**
  *   **Necessary & Sufficient Conditions:**
      1.  A prioritization system ranks options using a composite metric.
      2.  At least one criterion in the metric (C1, e.g., "neglectedness") *increases* as a function of the *difficulty of measurement* or *lack of knowledge* about the option.
      3.  At least one other criterion in the metric (C2, e.g., "importance" or "tractability") is estimated with *variance* that *increases* as a function of the *difficulty of measurement* or *lack of knowledge* about the option.
      4.  The composite metric calculation treats the criteria as independent or fails to adequately penalize high variance in C2.
      5.  As a result, options with high variance in C2 estimates are systematically favored due to:
          *   (a) The inherent statistical bias in selecting maximum expected value from high-variance distributions (Optimizer's Curse).
          *   (b) The concurrent inflation of their score on C1.
      6.  The prioritization system thus exhibits a systematic bias towards selecting options characterized by high epistemic uncertainty.

  **Boundary Cases (What NUE is NOT):**
  1.  **Ordinary Multi-Criteria Ranking with Uniform Noise:** Ranking options using Importance/Tractability/Neglectedness, where measurement noise/variance is *similar* for all options. The winner *might* be overestimated (OC), but there's no *systematic bias* towards *inherently* less measurable causes. *(Fails Condition 3: Variance is not correlated with C1 scores).*
  2.  **Deliberate Obscurantism:** A cause actively hides information to appear more neglected and uncertain. *(Fails the spirit: The entanglement arises from inherent difficulty/symmetrical ignorance, not asymmetric information/strategic concealment).*
  3.  **Pure "Frontier" Prioritization:** Prioritizing less measured areas *explicitly* for learning value (exploration), *acknowledging* the high uncertainty of impact estimates. *(Fails Condition 5: The bias is unintentional and misattributes uncertainty to high expected impact/neglectedness virtue, rather than consciously valuing exploration).*
  4.  **NUE Without Compounding Research Effect:** The base phenomenon (initial prioritization bias) can occur without the second-order effect where biased scores then direct research, further inflating those scores. The compounding effect is a frequent and pernicious *amplifier* of NUE, but not part of its core definition. *(Condition 6 covers the selection bias; the research loop is a common consequence, not a defining element).*

  **Why "Entanglement"?** It emphasizes that the criteria C1 (neglectedness) and the *variance* of C2 are not independent; they are linked ("entangled") through the common underlying state of knowledge (or ignorance). Scoring high on C1 *implies* high variance in C2, and vice-versa, corrupting the intended independence of the factors.

  **Verdict & Application:**
  *   **Best Partial Fit:** **Optimizer's Curse** explains the *statistical mechanism* of overestimation within a high-variance option.
  *   **The Novel Element:** The **systematic correlation** between that high variance and a *high score on a separate, desired criterion (neglectedness)*, due to a shared root cause (ignorance).
  *   **The Coined Term:** **Neglectedness-Uncertainty Entanglement (NUE)** best captures this specific structural flaw inherent in prioritization systems using neglectedness alongside impact/tractability when ignorance is prevalent. **Epistemic Neglect Entanglement (ENE)** is a valid synonym emphasizing the knowledge aspect.
  *   **The Feedback Loop:** The second-order effect, where NUE also biases *which options get further research*, leading to self-reinforcing prioritization, is a critical **NUE Amplification Loop** or **Autocatalytic NUE**.

  **Addressing NUE:** Recognizing NUE suggests remedies like:
  1.  **Explicit Uncertainty Penalties:** Adjusting expected value calculations downward based on estimation variance (beyond just using the mean).
  2.  **Decoupling Exploration Funding:** Using separate criteria/explicit budgets for high-uncertainty "exploration" grants focused *only* on reducing uncertainty, not promising high impact.
  3.  **Bayesian Skepticism:** Systematically applying higher skepticism (stronger priors, discounting) to claims built on thin evidence chains, especially when neglectedness is high.
  4.  **Independent Scoping:** Basing initial research/scoping decisions on factors *other* than the inflated composite score (e.g., diversity of problem space, feasibility of measurement, independent expert nomination).
  5.  **Tracking NUE:** Actively monitoring whether funded projects/proposed top candidates consistently cluster in the high-uncertainty/high-neglectedness quadrant as a check for this bias.

  Your observation is incisive. NUE describes a pervasive but often overlooked pitfall in evidence-driven prioritization, especially where "neglectedness" is prized. It arises from the interaction of statistical reality, epistemic limitations, and scoring system structure, not from any actor's dishonesty.
