  I need to create exactly five scenes following their strict specifications. Each scene must have a one-line heading with time and place, be 180-260 words, and end on an ordinary detail. The story must include five specific elements: the "list problem" showing multiple people who didn't act, distinguishing omission from mere inaction, a broken backup system, the "physics of absence" describing something that didn't happen concretely, and an official setting where causation is poorly addressed.

  The challenge is showing causation by omission without anyone explicitly stating it. I'll need to populate the story with people who didn't act: the controller, a shepherd, a haulage driver, the technician's sister, county budget cutters, someone who unplugged a heater. I'll distinguish omission through factors like roster assignments, access to keys, promises made, sleep schedules, and proximity - without moralizing.

  For the backup failure, I'll include a ridge repeater that wouldn't have worked anyway, subtly revealed later. For the "physics of absence," I'll describe the unkeyed microphone in detail. The official scene will be a coroner's hearing where the question is handled bureaucratically.

  I'll structure it as: 1) The controller's shift during the storm, 2) The shepherd hearing static, 3) The driver seeing the vehicle, 4) The sister not calling, 5) The coroner's inquest. Each scene will end mundanely - a logbook, a kettle, a gearstick, a teacup, a pen being capped.

  The story will avoid any thesis statements about blame, letting the accumulation of omissions speak for itself. The final scene will be purely procedural with no resolution, leaving the question of causation hanging in the reader's mind.
answer: |-
  **1. 17:43, Net Control Desk, Pinecrest Village Hall**  
  Evelyn traced the static with her knuckle against the speaker mesh. Rain lashed the hall windows. The logging timer blinked: 17:41. Had that been a voice under the roar? A syllable, maybe "ford," maybe "over." She reached for the mic, cold metal under her fingers. But the storm report from Cedar Bend crackled through, urgent, detailing rockfall two miles down-valley. Priority. Her finger lifted. She marked a faint question mark beside 17:41 in the shift log, closed the binder, and turned to the kettle boiling on the sideboard. The question mark blurred slightly under a drop of spilled tea.

  **2. 18:15, Crook’s Ridge Bothy**  
  Old Man Davies scraped mutton fat from his plate. The handheld on the shelf hissed with the storm’s fury. A burst of noise, sharper, cut through – a mangled word, perhaps "water," lost instantly. He grunted. Could be interference, could be the repeater acting up again. He’d mention it to Tom tomorrow, hauling supplies. Or maybe not. He banked the peat fire, the radio’s squall fading beneath the wind’s drone and the rhythmic scrape of his knife on the plate. He forgot it by dawn, remembering only the ache in his knees from the damp.

  **3. 19:02, River Road, Approaching Blackwater Ford**  
  Lorrie Chang downshifted the lumber truck, wipers struggling. Headlights caught the parked water board pickup, angled sharply on the far bank, driver’s door open. Odd place. Hadn’t the tech, Neil, been up at the intake? Must have got stuck earlier, walked out. She’d seen him wave once, months back. Lorrie eased past, wheels churning muddy spray. No lights on in the cab, no movement. Not her business. Radio net was for weather and closures, not parked trucks. She focused on the slick tarmac ahead, the gearstick vibrating under her palm.

  **4. 21:30, Apartment 4B, Cedar Bend**  
  Maya scrolled her phone. Neil missed Sunday roast. Again. Probably buried in schematics, or maybe that hike he kept talking about. She typed *"U alive?"*, deleted it. He’d call if stranded. He was meticulous. The valley net would handle it; that was its job. She pictured his lopsided grin, dismissing her worry. She plugged her own phone in to charge, the screen darkening, and reached for her novel. Outside, rain drummed the fire escape, a steady, soaking rhythm.

  **5. 10:00, County Administration Building, Hearing Room 3**  
  The coroner’s officer tapped his pen. “Item seven: failure to relay potential distress signal, logged 17:41 hours November seventh. Did this omission contribute to Neil Argent’s death?” Evelyn sat rigid. The haulage driver hadn’t reported the truck. The shepherd forgot the static. The sister didn’t call. The county cut overnight monitoring. Someone unplugged the repeater hut heater for a kettle, freezing the backup battery, rendering the ridge-top repeater useless long before Neil keyed his mic. The officer looked up. Evelyn swallowed. “No,” she stated, as instructed. “Primary cause was misjudgement of floodwater depth at Blackwater Ford.” He checked a box. *Cause of Death: Misadventure.* His pen cap clicked shut.
