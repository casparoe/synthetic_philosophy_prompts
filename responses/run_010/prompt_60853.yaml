prompt: |-
  I run a tiny outfit that keeps a public ledger of long-run forecasts — the big dated ones: fisheries collapse by such-and-such year, topsoil gone by 2050, this metal runs out, that debt spiral hits, we cross this threshold in the 2040s. Every entry has a stated window and a stated mechanism, and when the window closes we publish a verdict: confirmed, falsified, or still live. That third category is where I'm losing my mind. About forty entries a year come up for review and a big chunk of them look dead on arrival, but thier authors write in to say we're calling it too early — the mechanism is sound, only the timing was off, give it another twenty years. Half my panel wants to log a miss as a miss. The other half is terrified we'll end up punishing anyone who thinks in centuries, and they have a point: Malthus looks like the poster child for a guy who was right about ten thousand years of history and wrong about the last two hundred.

  So write me a procedure my reviewers can actually run on an entry whose window has closed and whose predicted event didn't happen. Ordered questions, what counts as an adequate answer to each, the point where the entry gets logged as falsified, and the points where the call is genuinely a judgment about how much slack a theory has earned rather than something you could look up. Constraints: the reviewer is smart but not an economist, forty-five minutes per entry, two people on it, and the forecaster files a written reply that has to be addressed point by point. Ground it in whatever the philosophy of science actually has to say about rescue versus revision — core claims versus auxiliary assumptions, what it means for a theory to get sharper instead of vaguer, why re-dating a prediction isn't automatically cheating but sometimes is — not in our gut feelings.

  Then run it on three entries, showing the answers you'd write down at each step:

  1. Malthus. Core claim: population presses hard on the means of subsistence and gets held down only by misery and vice, with the geometric-ratio-versus-arithmetic-ratio argument doing the work. The record: two centuries of real wages and food output climbing way faster than population. The defense has to include both flavors — the one his own later editions handed him, where he adds moral restraint (marrying late, or not at all) as a third check, and the modern one, that the trap was real for essentially all of human history and we only broke out around industrialization, so the theory was right about everything except the timing of the escape.

  2. A 1970s entry claiming a specific industrial metal is exhausted by 2000 absent recycling. It missed. The authors now say the mechanism held and that substitution plus new extraction tech moved the date. Note that they never specified substitution in the original writeup.

  3. One I like and expect you to kill: a forecast filed in the nineties that a slow-moving fiscal threshold gets crossed in the 2040s, where the authors argue the mechanism has been confirmed at every step and only the date slipped. I want to know exactly which question in the procedure does the damage, because I need to find out whether I'm motivated-reasoning in its favor.

  Finally, flag which steps are judgment calls wearing a lab coat, and be straight with me about what no procedure can do here — specifically whether "true but early" can ever be told apart from "true but never testable," and what we should print for the public when it can't be.
reasoning: |-
  We are designing a procedure for evaluating forecast entries whose time window has closed without the predicted event occurring. The procedure must balance between dismissing a prediction as falsified and allowing for legitimate extensions due to timing errors or unforeseen factors. The procedure is grounded in philosophy of science concepts such as core vs. auxiliary hypotheses, ad hoc rescues, and the requirement for a theory to make risky predictions.

  The procedure consists of a series of ordered questions. Each question must be addressed by the reviewers, and the answers will guide the final verdict. The reviewers have 45 minutes per entry and must consider the forecaster's written reply.

  **Procedure for Evaluating a Missed Prediction:**

  1. **Identify the Core Claim(s):** 
     - What is the fundamental, non-negotiable part of the theory? This should be the mechanism that drives the prediction and is central to the theory's explanatory power.
     - *Adequate answer*: A clear statement of the core claim, ideally as stated by the forecaster or as evident from the original entry. If the core claim is vague, note that.

  2. **Identify the Auxiliary Assumptions:**
     - What are the supporting assumptions that were necessary for the prediction to occur within the stated window? These might include initial conditions, the absence of intervening factors, or specific parameter values.
     - *Adequate answer*: A list of the key auxiliary assumptions that were either explicitly stated or reasonably implied in the original entry.

  3. **Assess the Outcome:**
     - Did the event occur? (Clearly, no, because we are in this procedure.)
     - Are there any observable effects that are part of the core claim that should have been detected even if the full event didn't happen? (e.g., for a resource exhaustion, did we see the predicted scarcity signals?)
     - *Adequate answer*: A clear "no" for the event, and an assessment of whether any partial effects (that are part of the core mechanism) were observed.

  4. **Examine the Forecaster's Defense:**
     - What reasons does the forecaster give for the miss? 
     - Are they invoking new factors (e.g., technological change, policy interventions, or behavioral changes) that were not considered in the original model? 
     - *Adequate answer*: A summary of the defense and a note on whether the defense invokes factors that were previously unaccounted for.

  5. **Evaluate the Defense Against Ad Hoc Rescue:**
     - Does the defense modify the auxiliary assumptions without independent justification? 
     - Does the defense shift the core claim? 
     - *Adequate answer*: The reviewers must decide if the defense is a legitimate refinement (based on new evidence or a previously overlooked factor that was always part of the theory's scope) or an ad hoc rescue (changing the theory to avoid falsification without new evidence or independent testability). 

  6. **Assess Testability of the Revised Theory:**
     - If the theory is revised (e.g., by extending the timeline or adding new factors), does the revised theory make new, testable predictions? 
     - Are these predictions distinct from the original and do they expose the theory to new risks of falsification? 
     - *Adequate answer*: If the defense proposes a revision, the reviewers must check if the revised theory is testable and specifies conditions under which it could be falsified.

  7. **Determine the Verdict:**
     - If the defense fails (i.e., the miss is due to a failure of the core mechanism and the defense is ad hoc), then the entry is **falsified**.
     - If the defense shows that the miss can be attributed to auxiliary assumptions (and the core mechanism is still intact) and the revised theory is testable, then the entry may be moved to **still live** with a new window (if the forecaster provides one) or left as **falsified** if the revision is too vague or untestable.
     - However, if the core mechanism itself is found to be flawed (e.g., by direct contradictory evidence), then **falsified**.

  **Judgment Calls:**
  - Steps 1, 2, 4, 5, and 6 involve judgment. Step 5 (ad hoc vs. legitimate revision) is particularly subjective and requires careful consideration of the theory's history and the nature of the new factors introduced.
  - Step 6 (testability of the revised theory) is also a judgment call: what counts as a testable prediction? It must be specific and have a clear time frame.

  **What the Procedure Cannot Do:**
  - It cannot definitively separate "true but early" from "true but never testable". The latter is a problem because if a theory is repeatedly extended without ever being tested, it becomes unfalsifiable. The procedure must require that any revision must come with a new testable prediction and a time frame.
  - For the public, when we cannot distinguish, we must note that the theory has been revised and the original prediction falsified. We can log the original as falsified and then create a new entry for the revised prediction if it meets our criteria for a forecast.

  Now, we run the procedure on the three entries.

  ---

  **Case 1: Malthus**

  1. **Core Claim(s):** 
     - Population, when unchecked, grows geometrically while the means of subsistence grow arithmetically, leading to a point where population presses hard on the means of subsistence. The checks are misery (famine, disease) and vice (war, etc.). Later, Malthus added "moral restraint" (delayed marriage, celibacy) as a third check.

  2. **Auxiliary Assumptions:**
     - The growth rates (geometric vs. arithmetic) are fixed and cannot be substantially altered by technological progress or human ingenuity.
     - The checks (misery and vice) are the primary regulators of population.

  3. **Assess the Outcome:**
     - The event (population pressing hard on subsistence leading to misery and vice preventing further growth) did not occur in the last two centuries. Instead, real wages and food output have grown faster than population.
     - Partial effects: In some regions and times, Malthusian checks have operated (e.g., famines in the 19th century, but these were not the dominant global trend).

  4. **Forecaster's Defense:**
     - Defense 1 (Malthus's own revision): He added moral restraint as a check, so the core theory now includes three checks. This was a revision in later editions.
     - Defense 2 (modern): The Malthusian trap was real for all of human history until the Industrial Revolution. The timing of the escape was wrong, but the mechanism is still valid for pre-industrial societies and could reassert if growth in food production slows.

  5. **Evaluate Defense Against Ad Hoc Rescue:**
     - The addition of moral restraint was a revision to the core claim? Actually, Malthus expanded the core to include a third check. But note: the original core claim was that population growth is checked by misery and vice. The addition of moral restraint is a change to the core. However, it was done early and in response to criticism. The modern defense shifts the core to being about pre-industrial societies only? That is a significant change because the original prediction was about the future (and ongoing). The modern defense essentially says the theory only applies when there is no industrialization. This is a major restriction of the theory's domain. 
     - The defense might be seen as ad hoc because it is changing the theory to account for the anomaly (industrialization) without having predicted it. However, one could argue that the domain restriction is a legitimate refinement if supported by evidence from pre-industrial societies.

  6. **Testability of Revised Theory:**
     - The revised theory (as in the modern defense) is that the Malthusian mechanism operates in the absence of industrialization. This is testable: we can look at pre-industrial history and also at contemporary societies without industrialization. It has been confirmed in those contexts. But the original prediction was for the future of industrialized societies. The revised theory does not make a specific prediction about when (if ever) the Malthusian trap will reassert in industrialized societies. Without a specific prediction (with a window) for that, the revised theory is not making a risky forecast for the future.

  7. **Verdict:**
     - The original prediction (that population would press on subsistence and be held by misery and vice) for the time period since Malthus has been falsified. The revised theory (with moral restraint) still did not predict the sustained growth in food production and wages. The modern defense restricts the theory to pre-industrial societies, which is a significant retreat. Since the original entry was about the future (and the window has closed without the event in the context of industrialization), we must log it as **falsified**. The theory may have historical validity, but the forecast for the future (without a new specific prediction) is not supported.

  ---

  **Case 2: Specific Industrial Metal Exhaustion by 2000**

  1. **Core Claim(s):** 
     - The core claim is that the world will run out of a specific industrial metal by the year 2000, absent recycling.

  2. **Auxiliary Assumptions:**
     - The rate of consumption is based on then-current trends and does not account for significant substitution or new extraction technologies.
     - No major recycling efforts.

  3. **Assess the Outcome:**
     - The event (exhaustion) did not occur by 2000.
     - Partial effects: We may have seen price increases or increased exploration, but not exhaustion.

  4. **Forecaster's Defense:**
     - The authors say the mechanism (finite resource being depleted) held, but substitution and new extraction technology moved the date. They did not specify substitution in the original.

  5. **Evaluate Defense Against Ad Hoc Rescue:**
     - The defense invokes factors (substitution and new technology) that were not in the original model. This is a classic case of auxiliary assumptions being violated. However, the core claim (finite resource will run out) is still intact? Actually, the core claim is about exhaustion by a specific date. The defense is changing the auxiliary assumptions (allowing for substitution and new tech) to explain the miss. 
     - Is this ad hoc? Yes, because these factors were not considered initially and are being introduced after the fact to save the theory. The original model did not include them.

  6. **Testability of Revised Theory:**
     - The revised theory now includes substitution and new technology. The authors must provide a new prediction with a time window. Without that, the revised theory is vague. If they provide a new date, then we can create a new entry. But for the original entry, the prediction was for 2000 and it failed.

  7. **Verdict:**
     - The original prediction is **falsified**. The defense does not change that. The forecaster may submit a new forecast with a new date and updated assumptions (including substitution and new tech) for review. But the original entry is a miss.

  ---

  **Case 3: Fiscal Threshold in the 2040s (filed in the 1990s)**

  Note: The window hasn't closed (2040s), but the scenario is that the window has closed and the event didn't happen. The authors argue the mechanism has been confirmed at every step and only the date slipped.

  1. **Core Claim(s):** 
     - The core claim is that a specific fiscal mechanism (e.g., rising debt leading to a crisis when a threshold is crossed) will inevitably occur.

  2. **Auxiliary Assumptions:**
     - The rate of debt accumulation and the threshold level are based on the conditions at the time of the forecast.
     - No major policy changes or economic shifts that would alter the trajectory.

  3. **Assess the Outcome:**
     - The event (crossing the threshold leading to crisis) did not occur by the end of the 2040s window.

  4. **Forecaster's Defense:**
     - The mechanism has been confirmed (e.g., debt has been rising as predicted, and the relationship between debt and growth has been as expected) but the date slipped due to unforeseen factors (e.g., lower interest rates, higher growth, or policy changes).

  5. **Evaluate Defense Against Ad Hoc Rescue:**
     - The defense attributes the miss to auxiliary factors (interest rates, growth, policy). These were not included in the original model. The core mechanism (the relationship between debt and crisis) is said to be intact. 
     - However, the original model did not account for these factors? If they were not included, then the model was incomplete. The defense is an ad hoc addition of factors to explain the miss without having predicted them.

  6. **Testability of Revised Theory:**
     - The authors must provide a new prediction with a new window and a model that incorporates the factors they now say are important. Without that, the revised theory is not testable. If they do, we can create a new entry.

  7. **Verdict:**
     - The original prediction is **falsified**. The defense is an ad hoc rescue. The mechanism might still be valid, but the original forecast (with a specific window) failed. The fact that the mechanism has been confirmed in steps (e.g., debt rising) does not save the prediction because the event (the threshold crossing and crisis) did not occur by the deadline.

  **Which Step Does the Damage?** 
  - Step 5 (evaluating ad hoc rescue) and Step 7 (verdict) are where this is killed. The defense invokes new factors after the fact without independent justification (ad hoc). The core claim was about the threshold being crossed by a certain date, and it wasn't. The mechanism may be confirmed in part, but the event did not occur. Therefore, the original entry is falsified.

  ---

  **Summary of Judgment Calls:**
  - Step 1: Identifying the core claim can be ambiguous (e.g., Malthus's core changed over time).
  - Step 2: Determining the auxiliary assumptions requires interpretation of the original entry.
  - Step 5: Distinguishing between legitimate revision and ad hoc rescue is a major judgment call. It requires assessing whether the defense is based on independent evidence or is just a convenient excuse.
  - Step 6: Assessing testability of the revised theory is also a judgment call. What counts as a testable prediction? It must be specific and have a time frame.

  **What to Print for the Public:**
  - When an entry is falsified, we state: "The predicted event did not occur within the stated window. The forecaster has provided an explanation (summarize briefly), but the original forecast is considered falsified. The forecaster may submit a revised forecast for consideration in our ledger."
  - For the cases where we cannot distinguish between "true but early" and "true but never testable", we err on the side of falsifying the original and inviting a new entry that is testable. This avoids keeping vague, open-ended predictions that cannot be tested.

  **Final Note:** The procedure requires that any revision must be accompanied by a new testable prediction with a window. Without that, the theory becomes unfalsifiable and we cannot keep it in the "still live" category.
answer: |-
  Below is a structured, philosophy-of-science-grounded procedure for your reviewers. It draws on Lakatos' "research programmes" (core vs. auxiliary hypotheses), Popper's falsifiability, and Kuhn's "puzzle-solving" to distinguish legitimate revisions from ad hoc rescues. The goal is to force specificity, prevent unfalsifiability, and ensure theories *risk* being wrong. Judgment calls are flagged explicitly.

  ---

  ### **Review Procedure: Evaluating "Missed" Forecasts**
  **Time:** 45 minutes per entry (joint review by two people).  
  **Input:** Original forecast text, observed outcomes, forecaster's written defense.  
  **Output:** Verdict (Confirmed/Falsified/Still Live) with reasoning.  

  #### **Ordered Questions & Evaluation Criteria**
  1. **What is the core causal mechanism?**  
     - *Requirement:* Isolate the non-negotiable, falsifiable engine of the prediction. Must be stated in the original entry.  
     - *Adequate answer:* A 1–2 sentence summary of the mechanism that, if false, would invalidate the theory.  
     - *Judgment call?* Yes. Requires interpreting the author's intent but must cite original text.  

  2. **What were the critical auxiliary assumptions?**  
     - *Requirement:* List assumptions that *must* hold for the core mechanism to produce the event in the stated window (e.g., "no major wars disrupt supply chains").  
     - *Adequate answer:* Concrete, testable factors (e.g., "technology growth ≤2%/year") inferred from the original entry. Vagueness (e.g., "absent unforeseen innovations") counts against the forecaster.  
     - *Judgment call?* Minimal. Assumptions must be extractable from the original text.  

  3. **Did the core mechanism fail, or did auxiliary assumptions break?**  
     - *Requirement:* Cross-examine observed data against the core mechanism.  
     - *Adequate answer:*  
       - If the core mechanism made testable *process* predictions (e.g., "prices will rise 10%/year before collapse"), did they occur?  
       - If the defense blames auxiliary factors, are they on the original list (Q2)?  
     - *Judgment call?* Yes. Requires assessing if deviations disprove the core or are peripheral.  

  4. **Is the defense a legitimate revision or an ad hoc rescue?**  
     - *Requirement:* Apply Lakatos' test: Does the defense...  
       - **Increase specificity?** (e.g., adding quantifiable constraints to auxiliary assumptions).  
       - **Risk new falsification?** (e.g., predicting *new* testable events).  
       - **Explain anomalies *independently*?** (e.g., citing pre-existing evidence).  
     - *Adequate answer:*  
       - Legitimate if: Defense tightens the theory, offers new testable predictions, and uses non-post-hoc evidence.  
       - Ad hoc if: It only explains the miss, makes the theory vaguer, or lacks new risks.  
     - *Judgment call?* High. The line between "sharpening" and "rescuing" hinges on predictive ambition.  

  5. **Can the revised theory be tested *within a defined window*?**  
     - *Requirement:* The defense must propose a new falsifiable prediction with:  
       - A specific event.  
       - A bounded timeframe (≤25 years from now).  
       - No exit clauses (e.g., "unless governments intervene").  
     - *Adequate answer:* Concrete new forecast or clear reason why existing data falsifies the core.  
     - *Judgment call?* Minimal. Reject if the new window is open-ended or >25 years.  

  #### **Verdict Logic**  
  - **Falsified:** Core mechanism contradicted, or defense is ad hoc, or no testable update offered.  
  - **Still Live:** Core intact, defense legitimate, and new testable prediction provided.  
  - **Confirmed:** Event occurred (not applicable here).  

  ---

  ### **Applying the Procedure to Your Cases**
  #### **Case 1: Malthusian Collapse**  
  - **Q1 (Core mechanism):** "Population grows geometrically; food/land grows arithmetically → misery/vice corrects overshoot."  
  - **Q2 (Auxiliary assumptions):** No major productivity leaps in agriculture; no voluntary fertility reduction beyond vice/misery.  
  - **Q3 (Mechanism vs. auxiliaries):** Core failed. Wages/food grew *faster* than population (contradicting arithmetic growth). Voluntary fertility drops (e.g., later marriage) occurred without misery/vice.  
  - **Q4 (Legitimate or ad hoc?):**  
    - Defense 1 (Moral restraint): *Ad hoc.* Added post-failure without new risks (just relabels observed behavior).  
    - Defense 2 (Industrial escape): *Legitimate revision?* No. Core mechanism was global/perpetual; restricting it to pre-industrial eras *after* failure avoids falsification. No new testable claim about future traps.  
  - **Q5 (Testable update?):** None proposed.  
  - **Verdict:** **Falsified.** Core mechanism directly contradicted. Defense reduces scope to evade falsification.  

  #### **Case 2: Metal Exhaustion by 2000**  
  - **Q1 (Core mechanism):** "Fixed reserves / current consumption rates → exhaustion by 2000."  
  - **Q2 (Auxiliary assumptions):** No large-scale recycling; no substitution; extraction tech stagnant.  
  - **Q3 (Mechanism vs. auxiliaries):** Auxiliaries broke (substitution/tech emerged). Core (finite reserves) untested but plausible.  
  - **Q4 (Legitimate or ad hoc?):** *Ad hoc.* Original auxiliaries excluded substitution/tech; adding them *post-hoc* without independent justification (e.g., "we predicted tech limits") rescues the theory. No new specificity.  
  - **Q5 (Testable update?):** Authors must specify: (1) current reserve trajectory, (2) new exhaustion window, (3) thresholds for tech/substitution failure. If provided, log as new entry.  
  - **Verdict:** **Falsified** (original forecast). Defense ad hoc unless updated with testable claims.  

  #### **Case 3: Fiscal Threshold (2040s)**  
  - **Q1 (Core mechanism):** "Debt/GDP ratio exceeding X% → sovereign default spiral."  
  - **Q2 (Auxiliary assumptions):** Interest rates > growth rate; no fiscal reforms; no monetary intervention.  
  - **Q3 (Mechanism vs. auxiliaries):** Event didn’t occur. Defense says mechanism "confirmed" by rising debt, but core requires the *threshold effect* (spiral). Auxiliaries (rates, policy) likely broke.  
  - **Q4 (Legitimate or ad hoc?):** *Ad hoc.* "Mechanism confirmed at every step" is vague. If the spiral didn’t trigger, the core threshold claim is weakened. Defense shifts blame to auxiliaries without new risks (e.g., "threshold is now Y% due to QE").  
  - **Q5 (Testable update?):** Authors must provide: (1) exact new threshold, (2) catalyst for spiral (e.g., rate spike), (3) new window (<25 years).  
  - **Verdict:** **Falsified** (original entry). Defense is hand-waving; no new testable specifics.  
  - **Which question kills it? Q4.** The defense claims the core is "confirmed" but conflates *inputs* (debt rise) with the *event* (spiral). Without proposing a *risky* update, it’s an ad hoc rescue.  

  ---

  ### **The Limits of the Procedure**  
  1. **Judgment calls in disguise:**  
     - Q4 (ad hoc vs. revision) wears a "lab coat" but is deeply subjective. It depends on reviewers’ assessment of whether the defense *increases* or *decreases* the theory’s vulnerability.  
     - Q1 (core mechanism) can be gamed by forecasters using vague language. Reviewers must demand original textual evidence.  

  2. **"True but early" vs. "True but untestable":**  
     - **You cannot fundamentally distinguish them.** A theory claiming a 100-year horizon is unfalsifiable in practice.  
     - **Solution:** Impose a 25-year window for all "Still Live" entries (per Q5). This forces the theory to generate near-term tests. If the forecaster objects, the theory is unfalsifiable by your ledger’s standards.  

  3. **What to print for the public:**  
     - When the core is intact but auxiliaries break (e.g., Case 2):  
       *"Forecast falsified. Core mechanism not disproven, but original assumptions failed. A revised forecast has been submitted."*  
     - When the defense is ad hoc/untestable (e.g., Cases 1 & 3):  
       *"Forecast falsified. Defense relies on unsupported revisions or untestable claims."*  
     - Always publish: The core mechanism, why it passed/failed, and whether a testable update exists.  

  **Final Advice:** Your panel’s fear of punishing "century-scale" thinkers is valid, but a forecast without a bounded test is storytelling. The procedure forces specificity: Theories that earn slack must *generate new predictions*. Malthus doesn’t fail because he was wrong forever; he fails because his core was falsified *in the domain he specified*, and his defenders won’t risk a new test. By requiring Q5, you protect rigorous long-term thinkers while filtering out prophecy disguised as science.
