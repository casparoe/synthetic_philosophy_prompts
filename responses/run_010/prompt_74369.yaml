  Okay so this is a small thing but it's driving me nuts and I can't get past it. I'm deep in a novel where one of the two leads runs what's basically a containment team at a frontier lab — not the alignment people who want to make the model actually good, her people just assume it might be quietly working against them and build the cage anyway. Tripwires, honeypots, air-gapped evals, the whole business of testing a model in a way that's supposed to hide the fact that it's being tested. She's meant to be funny in a dry, burned-out way, and there's a scene where shes at a party, someone asks what she does for a living, and she tells a joke instead of answering.

