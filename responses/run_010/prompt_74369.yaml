  It has to be something a person can say out loud in dialogue — two or three sentences, not a little essay with a labelled setup. The punchline needs to land on the real content of her job: ideally something about how her safety measures are designed to work even when the model's goals are nothing like hers, or how the more capable the model is the less any test of it actually tells you, or how she spends her life building a lock for a door that is already suspicious of locks. What I don't want is a generic robot joke — no 'and then it takes over the world,' no Terminator nods, no as-an-AI gags, nothing where the humor is just that computers are scary. Someone who works in this area should read it and think yeah, that's exactly the bind she's in, not this novelist googled the word alignment once.

