  - **Rule 2: Disclosure must be public or witnessed by the competitor to count for priority.**  
    Public preprints (Case 1: X's sketch; Case 3: E's preprint) or formal events attended by competitors (Case 2: D's seminar with C present; Case 4: H's job talk with G present) establish priority. Informal/private disclosures (e.g., undated Slack, internal meetings without full result sharing) do not (Case 3).

  - **Rule 3: If work is not independent, priority goes to the source of the idea.**  
    When a competitor witnesses the result (Case 2: C attended D's seminar; Case 4: G attended H's talk), their work is deemed non-independent, and the disclosing group gets priority. Independence is only assumed without evidence of contact (Case 1).

  - **Rule 4: First public disclosure wins unless an earlier, documented disclosure event exists.**  
    Preprints are the default for priority (Case 1, 3), but they are overridden by earlier documented disclosures that meet Rules 1–2 (Case 2, 4). Partial disclosures (e.g., lemmas, ideas without full proofs) do not establish priority for the full result.

  **Why these rules are consistent with all precedents:**
  - **Case 1 (X wins):** X's preprint was the first public disclosure, and no evidence of contact meant work was independent. Y's more complete version didn't override X's priority.
  - **Case 2 (D wins):** D's dated notebook and seminar (disclosure to C) proved an earlier, documented full result, and C's presence made it non-independent. C's preprint was invalidated.
  - **Case 3 (E wins):** F's claims lacked dated documentation (Rule 1) and weren't a formal disclosure (Rule 2), so E's preprint won as the first public disclosure.
  - **Case 4 (H wins):** H's draft (documentation) and job talk (disclosure to G) established an earlier full result, and G's presence made it non-independent. G's preprint was overridden.

  **Contradicted interpretations:**
  - "First preprint always wins" is invalid (contradicted by Case 2 and 4).
  - "Private documentation alone suffices" is invalid (contradicted by Case 3; requires disclosure).
  - "Informal/partial disclosures count" is invalid (contradicted by Case 3; requires full result and formality).

