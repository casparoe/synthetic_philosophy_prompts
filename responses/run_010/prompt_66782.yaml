prompt: |-
  i run a ~40-person delivery company and I've spent five months trying to pick routing software. Nine demos, a scoring spreadsheet, quotes from all of them — the top three came within 4% of eachother on price and my spreadsheet can't separate them on features either. A consultant we had in for two days told me to quit trying to find the best one: decide up front what counts as good enough and take the first thing that clears it, because five months of my time already costs more than the gap between the candidates.

  I tried it. Problem is, every time an option cleared the bar I could see the bar had just been set from whatever I'd happened to see so far, so I'd nudge it up, and then I was back to searching. He said that's fine, the bar's supposed to move. But if the bar moves to meet whatever shows up, doesn't "take the first one that clears it" just describe what I end up doing instead of telling me when to stop? Is the rule empty, or am I holding it wrong?

  And I do have to sign something this quarter, so what do I actually do? Give me a verdict, not a both-sides list of considerations. Also — if you think I've mis-stated the problem, like if this kind of rule was never the sort of thing you could follow or break in the first place, say that plainly rather than humoring me.
reasoning: |-
  Okay, let me unpack this user's dilemma. They're stuck in a five-month software selection loop for their delivery company, paralyzed by near-identical options. The consultant's "first that clears the bar" advice backfired because their bar kept moving adaptively - which is the core paradox: if the benchmark adjusts to whatever they see, how is it a stopping rule at all? 

  Hmm... their frustration is palpable. Two things stand out: first, they're clearly a systematic thinker (spreadsheets, scoring) but trapped by their own rigor. Second, they reject wishy-washy advice - they want a verdict. Interesting how they preemptively called out any "mis-stated problem" deflection too. Smart user.

  The real issue seems psychological, not analytical. Their spreadsheet shows the top contenders are functionally tied, yet they're still seeking differentiation that doesn't exist. That perfectionism is costing them $40k+/month in lost leadership time (quick mental math: 40-person company, their salary probably $150k+, so yeah). 

  The consultant wasn't wrong about adaptive bars - that's how human evaluation works - but failed to give concrete implementation. What's missing is operationalizing "good enough." Need to force a decision by:
  - Hard-stopping feature comparisons (their data says it's done)
  - Switching to secondary criteria (implementation risk? vendor vibe?)
  - Setting a drop-dead date (they mentioned this quarter)

  Also detecting unspoken anxiety: signing a multi-year contract feels irreversible. Should acknowledge that while noting that modern SaaS makes switching less catastrophic than they fear. 

  Final verdict must be actionable: pick Vendor X by Friday using method Y. No "considerations" - they've considered enough. Might suggest flipping a coin between top two to expose how negligible the differences truly are.
answer: |-
  Your consultant was half-right: **adaptive bars are normal, but yours became meaningless because you didn't anchor it to reality.** "First past the post" fails when the finish line moves with each runner. Here’s your verdict:

  ### STOP EVALUATING. PICK ONE BY FRIDAY.  
  **How:**  
  1. **Freeze your feature spreadsheet.** Delete all columns except "Must-Haves" and "Dealbreakers." Anything scoring ≥80% with zero dealbreakers survives.  
  2. **Call your top 3 vendors.** Ask: *"Can you commit in writing to a live pilot with our real data/routes by [Date 3 weeks out]?"* Eliminate anyone who hesitates.  
  3. **Flip a coin** between the remaining options. If you feel disappointment at the result, pick the other one.  

  ### Why this works:  
  - **Your spreadsheet is a false precision trap.** If scores are within 4% after 5 months, differences are noise. Your gut knows this (hence the paralysis).  
  - **Implementation risk dwarfs feature gaps.** The vendor who can *actually deploy* without 6 months of "customization" will save you $50k+ in hidden costs.  
  - **"Perfection" costs more than it’s worth:** At your scale, 5 months of your salary alone likely exceeds the *lifetime cost difference* between vendors.  

  ### The rule isn’t empty—you used it wrong:  
  A valid "good enough" bar must be:  
  - **Defined BEFORE seeing options** (e.g., "Must handle 100 stops/day, cost <$X/user, no 12-month contracts").  
  - **Immutable** once set.  

  You set yours *dynamically* based on demos, which guarantees endless escalation. **That’s not a selection strategy—it’s a dopamine loop.**  

  ### Brutal truth:  
  **You’re no longer choosing software—you’re avoiding accountability for a decision.** Signing *any* viable contract now and focusing on execution will outperform waiting for a "perfect" solution. Fire the consultant, close the spreadsheet, and force the decision **this week.** The cost of delay is actively harming your business.
