       - Workers can compare input logs (detect measurement disagreements).  
       - No processing disagreement is inferred (logs match but outputs differ → fault signal).  
    3. **Trigger Audits on Conflict**: If logs match but estimates diverge, initiate a replay audit.  
  - **Why Philosophy Suggests This**: Balances conciliationism’s speed in measurement disagreements with steadfastness’s fault tolerance by leveraging auditability.  

  **Payoff Summary**:  
  - The translation exposes why your policies fail: **Policy 1 overgeneralizes partitions; Policy 2 overgeneralizes faults**.  
  - The hybrid policy addresses this by distinguishing disagreement types explicitly—a novel insight from mapping philosophy’s "shared evidence" to your replayable logs.  
  - **Verifiable Prediction**: Under the hybrid policy:  
