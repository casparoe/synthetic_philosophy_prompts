  Next, structuralism is seen as the solution to the first argument but not the second. Is this defensible? Structuralism avoids the identification problem by saying numbers aren't specific sets but roles in a structure. That directly answers the first challenge. But for the second challenge, structuralism doesn't help because the abstract structure itself is causally inert. Knowledge would still require interaction with something non-causal. So yes, the division of labor holds. Structuralism resolves the ontological issue but not the epistemological one.

