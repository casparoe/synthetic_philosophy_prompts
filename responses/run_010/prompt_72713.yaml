prompt: |-
  I'd like you to take on the role of a philosopher who works on formal epistemology — specifically on Bayesian coherence principles and the arguments for them — but who is used to explaining that material to a careful non-specialist who has a stake in the answer. Please think carefully rather than answering from first impressions. Before you evaluate anything, I'd like you to start with a short working section of your own: write out the principle as you understand it, in words and with whatever minimal notation you need, and list two or three situations in which a careful philosopher would say it simply does not apply or does not bind. Only then move on to the audit I'm asking for.

  Here is my situation. I have a recurrent psychiatric condition with distinct episodes, and a few years ago, during a stable stretch, I signed a psychiatric advance directive — the kind people sometimes call a Ulysses contract — which authorizes my care team to admit and treat me over my objection during a future episode, on the stated ground that my judgment at that time will not be reliable. Last month I had exactly such an episode, I objected, the directive was invoked, and I am now deciding whether to petition to have it narrowed or revoked. My care team meets with my family in ten days. My brother, who reads widely in philosophy of science and is considerably more confident than I am, has told me that the directive is not merely prudent but rationally mandatory, and that my wish to revoke it is not just imprudent but incoherent. He sent me a long message summarizing an online article he read about van Fraassen's Reflection principle. I have read it perhaps a dozen times, and I cannot tell whether it is rigorous or whether he has taken hold of a technical result and stretched it past its limits. I have no training in this and no way to check his sources.

  His message runs, in substance, as follows:

  > The Reflection principle says that your present degree of belief in a claim, given that your own future degree of belief in that same claim will be some particular value r, should itself be exactly r. Van Fraassen established this with a betting argument: if your present and future beliefs come apart in the wrong way, a bookmaker can assemble a package of wagers you will each willingly accept and that guarantees you a loss, so violating Reflection is incoherent in precisely the way that holding flatly contradictory beliefs is incoherent. It is really the same principle as Lewis's Principal Principle, merely redirected: the Principal Principle tells you to align your beliefs with objective chance, Reflection tells you to align them with your future self, and both are instances of the general rule that a rational agent defers to any source better informed than she is. Concretely, then, a rational agent can never expect to change her mind. If you now expect that in a year you will be confident that P, you had better be confident that P now; otherwise you are counting on becoming less rational than you are. The comforting idea that we all grow and revise is therefore no defense at all, because a fully coherent agent already contains, in her present beliefs, everything she will ever come to learn. Applied to you: when you signed the directive you expected that during an episode you would want to refuse treatment, and you judged in advance that this wanting would be a symptom rather than a judgment. Reflection says your earlier, stable assessment governs, because a coherent person's considered view cannot be displaced by a version of herself that she already anticipated and already discounted. This isn't paternalism, and it isn't a value judgment about whose wishes count. It is a requirement of consistency across time, and it is a theorem, so there is nothing here to argue with.

  Two things about my own position, so you know where I'm coming from and can correct me if I'm wrong. I am inclined to think the sentence about never expecting to change my mind cannot be right, because I plainly did expect to change and plainly did — but I can't articulate why that's a problem for the principle rather than a problem for me. And I'm frightened by the last part: if this really is a theorem, then my objection during the episode carries no rational weight whatsoever, and the directive is unassailable. I need to know whether that follows.

  Please give me an accuracy audit I can actually bring to the meeting.

  1. Break his message into its distinct claims and number them. For each, say whether it is accurate, a defensible simplification, or wrong — and explain why in a sentence or two of plain language, defining any technical term you use in the same breath.
  2. State precisely where his version departs from the principle as you would state it, especially on the question of what a rational agent should expect about her own future changes of mind.
  3. Address the direction of the principle explicitly. As I read him, he uses it to give my earlier self authority over my later self. Tell me whether that is what the principle does, and if not, what it does do in a case where the earlier self expects the later self to become distorted.
  4. Tell me whether a principle about degrees of belief has anything at all to say about a document that concerns treatment wishes and values, and if there is a version of his argument that survives that gap.
  5. Give me the strongest form of his position that remains standing after your corrections, so that I do not strawman him in front of my family. I would rather concede what is genuinely true than win cheaply.
  6. Distinguish, wherever it matters, between what is settled and what philosophers working on this dispute. Do not present your own preferred view as the consensus.

  Please end with a paragraph of six to eight sentences, in ordinary non-technical language, that I could read aloud to my care team and my brother about what this principle does and does not establish.

  One constraint on format: no bibliography, no reading list, and no citations. I have no internet access for this and cannot look anything up, so references would be useless to me. If you are unsure about what van Fraassen himself wrote, or about whether a particular argument is his or someone else's, say so plainly instead of filling the gap.
reasoning: |-
  Hmm, this is a deeply personal and philosophically complex query. The user is facing a real-life application of formal epistemology principles to their psychiatric advance directive, and their brother has invoked van Fraassen's Reflection principle to argue that revoking the directive would be irrational. 

  First, I need to carefully unpack the brother's argument. He makes several interconnected claims: that Reflection requires aligning present beliefs with anticipated future beliefs, that violating it leads to Dutch book vulnerability, that it's analogous to the Principal Principle, and that it makes the user's earlier judgment binding. Each claim needs individual scrutiny.

  The user's core concern seems twofold: whether the principle truly prohibits mind-changing as described, and whether it can legitimately govern value-laden decisions about medical autonomy. They're also clearly anxious about the "theorem" status - if this is mathematically proven, does that leave no room for disagreement?

  Key distinctions I must maintain:
  - Between belief updating (where Reflection applies) and preference/value changes (where it may not)
  - Between anticipating better information (where deference makes sense) and anticipating impaired judgment (where it may not)
  - Between synchronic rationality (consistency at one time) and diachronic rationality (consistency across time)

  The brother's conflation of these is problematic. His claim that "a coherent person's considered view cannot be displaced" ignores that Reflection actually requires the opposite - present self should defer to future self when better informed. But in this case, the future self is considered less informed due to impairment. That crucial reversal needs highlighting.

  Also important: the Dutch book argument only shows vulnerability if the belief changes violate probability axioms. But changing one's mind due to new evidence or perspective isn't axiom-violating - it's rational updating. The user's case involves neither new evidence nor rational updating though - it's about anticipated irrationality.

  For the care team meeting, I should emphasize that formal epistemology addresses belief coherence, not medical decision-making authority. The strongest surviving point might be that if the user truly believes their future self will be irrational, then consistency demands not deferring to that future self - which ironically supports the directive, but on different grounds than the brother claimed.

  The closing statement must be crystal clear: no mathematical principle can dictate whose wishes "count" in medical ethics. That requires different conversations about autonomy, beneficence, and what constitutes "self" during episodic illness.
answer: |-
  ### My Working Section
  **Principle Statement**:  
  Van Fraassen's Reflection Principle requires that your current degree of belief in a proposition \(P\)—given that *at future time \(t\)* you will believe \(P\) to degree \(r\)—should be exactly \(r\). Formally: \( \text{Pr}_{\text{now}}(P \mid \text{Pr}_t(P) = r) = r \).  

  **Situations Where It Does Not Apply**:  
  1. **Known Cognitive Impairment**: If you *currently know* your future self will be irrational (e.g., intoxicated), the principle doesn’t bind.  
  2. **Information Asymmetry**: If you expect to *gain new evidence* by \(t\), the principle isn’t violated by differing beliefs.  
  3. **Value/Priority Shifts**: The principle governs *beliefs*, not values or preferences (e.g., changing desires about medical treatment).  

  ---

  ### Accuracy Audit of Your Brother’s Claims  

  1. **"Reflection says your present degree of belief in \(P\), given your future degree will be \(r\), should be \(r\)."**  
     - **Accuracy**: Defensible simplification.  
     - **Why**: This captures the core formal rule. But it assumes no relevant cognitive changes (e.g., impairment).  

  2. **"Violating Reflection allows a 'Dutch book' (guaranteed loss)."**  
     - **Accuracy**: Accurate, *with caveats*.  
     - **Why**: Dutch books show incoherence *if* your beliefs violate probability axioms. But this assumes your future self is *rational* at \(t\).  

  3. **"Reflection = Principal Principle, but for future selves."**  
     - **Accuracy**: Wrong.  
     - **Why**: The Principal Principle aligns beliefs with *objective chances*. Reflection aligns with *your own future beliefs*—only if you see your future self as "epistemically superior" (better informed/rational).  

  4. **"A rational agent can never expect to change her mind."**  
     - **Accuracy**: Wrong.  
     - **Why**: You *can* rationally expect to change your mind if you anticipate new evidence. Reflection *requires* this alignment: if you expect future-you to believe \(P\) strongly, you must believe it now.  

  5. **"A coherent agent already contains all future learning."**  
     - **Accuracy**: Misleading.  
     - **Why**: Reflection doesn’t imply omniscience. It governs *conditional* beliefs: *if* you knew what your future self would believe, your current belief should match.  

  6. **"Your earlier assessment governs because you anticipated the episode."**  
     - **Accuracy**: Defensible only if strict conditions hold.  
     - **Why**: Reflection *could* support this *only if*:  
       - You currently trust your *future* self during the episode to be rational and better informed.  
       - But here, you *explicitly judged* your future self would be *impaired*. Reflection **does not apply** when you know your future self is irrational.  

  7. **"This is a theorem, so there's nothing to argue with."**  
     - **Accuracy**: Overstated.  
     - **Why**: It’s a theorem *within specific models* (e.g., agents who treat future selves as experts). Real-world cases (impairment, values) break these models.  

  ---

  ### Where His Version Departs from the Principle  
  - **Key Departure**: He ignores that Reflection **requires deference to future selves only if they are epistemically superior**. If you believe your future self will be *less* rational (e.g., due to mania), Reflection **does not command deference**—it may even *forbid* it.  
  - **On Changing Minds**: Reflection *expects* belief changes when new evidence arrives. It doesn’t freeze beliefs; it synchronizes present beliefs with *anticipated* future beliefs.  

  ---

  ### Direction of the Principle  
  - **Does it give earlier selves authority?** No. Reflection **commands present deference to future selves**, not past authority over future selves.  
  - **In distortion cases**: If you *now* believe your future self will be distorted, Reflection permits (even requires) *ignoring* that future self. His argument reverses this: your directive *relies* on judging future-you as irrational, so Reflection **cannot support overriding future-you’s wishes**.  

  ---

  ### Can Belief Principles Govern Treatment Wishes?  
  - **Short Answer**: No.  
  - **Why**: Reflection governs *beliefs* (e.g., "Is this treatment effective?"). It does not govern *values* (e.g., "Do I want this treatment?"). A wish to refuse treatment isn’t a "belief"—it’s a preference. Even if beliefs *about* your values shift (e.g., "I’ll value survival less during an episode"), Reflection doesn’t bind if the shift stems from impairment.  
  - **Surviving Argument?**: Only if all these hold:  
    - Your directive assumes your *beliefs about your values* during episodes are irrational.  
    - You *still* trust your future self’s *epistemic rationality* despite this.  
    - This is philosophically unstable—most would see impaired values as breaking the conditions for deference.  

  ---

  ### Strongest Surviving Version of His Position  
  1. If you *genuinely trust* that your future self during an episode will be *more rational and better informed* than your current self, Reflection says you *should* defer to that future self’s beliefs now.  
  2. But since your directive *explicitly assumes the opposite* (future-you is impaired), Reflection **cannot justify overriding future-you**. At best, it might support your *past* decision *if* you believed future-you would be competent—but you didn’t.  

  ---

  ### Settled vs. Disputed  
  - **Settled**: Violating Reflection *without justification* (e.g., no expected irrationality/new evidence) makes beliefs incoherent. Dutch books are valid *in ideal cases*.  
  - **Disputed**: Whether Reflection applies to *self-aware* anticipated irrationality, or to non-belief states (values). Many argue it **does not**.  

  ---

  ### Statement for Your Care Team and Brother  
  "I’ve looked carefully at how the Reflection Principle applies here. It says that if I *now* trust that my *future* self will be thinking clearly and have more information, I should align my current beliefs with what I expect to believe then. But my advance directive was created *because I expected my future self would be impaired*—not better informed. The principle doesn’t tell me to obey past-me or ignore future-me. It tells me that if I see future-me as rational, I should listen now. Since I don’t see my episode-self as rational, the principle doesn’t force me to accept past-me’s view. It also doesn’t touch on my values or wishes—only beliefs. So while it’s a real rule for consistent beliefs, it doesn’t make my directive rationally mandatory, nor does it silence my current objections."  

  This addresses the core concerns without technicalities. You can present it as a neutral summary.
