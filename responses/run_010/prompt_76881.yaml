answer: |-
  Here’s the complete take-home exam package tailored to your specifications:

  ### (1) Essay Question (as it appears on the paper)  
  **Question (30 marks; approx. 1000 words; 90 minutes):**  
  > Nadia, a nurse with a full-time hospital job, began taking one extra unpaid Saturday shift per month at a small free clinic ten years ago. She initiated this voluntarily, without being asked or making any commitment. By year three, the clinic’s roster was structured around her shift. By year six, new volunteers were told Saturdays were "covered." In year eight, the clinic declined a grant to fund a weekend nurse, relying on Nadia’s continued involvement. In year ten, Nadia wishes to skip her Saturday shift to attend her daughter’s graduation.  
  >  
  > **Has Nadia’s act of working the Saturday shift lost its supererogatory status by year ten? If so, identify when and why this change occurred, given that the act’s moral value remains unchanged and Nadia never promised anything. Your analysis must address whether this case reveals a general flaw in defining supererogation purely as "good but not required," and respond to the concern that such erosion unfairly penalizes consistent generosity. Strong answers will consider alternative foundations for obligation beyond promises or explicit roles.**

  ---

  ### (2) Model Answer (715 words)  
  Nadia’s Saturday shift was supererogatory at its inception: a praiseworthy, optional act of beneficence exceeding obligation. By year ten, however, it has become obligatory. This shift occurs not because the act’s intrinsic goodness diminished, but because others’ *reliance* transformed its moral status. The case exposes a critical limitation in defining supererogation solely by immediate features ("good, optional, praiseworthy, no blame for omission") by showing how external factors can retroactively impose duty without altering the act’s value.

  The transformation likely began between years three and six. When the clinic structured its roster around Nadia (year three) and informed recruits Saturdays were "covered" (year six), her voluntary act became embedded in institutional operations. This created *moral vulnerability*: the clinic and beneficiaries now depended on her. Crucially, Nadia’s awareness of this reliance—even without explicit agreement—introduces responsibility. By continuing past year three, she implicitly accepted her role in sustaining a system others trusted. When the clinic refused the grant (year eight), the reliance became material: concrete opportunities were forfeited based on her continued participation. At this point, her omission would harm others by depriving them of care they reasonably expected, making the act obligatory.

  This reliance-based obligation reveals a flaw in static definitions of supererogation. If supererogation requires only that an act *at the time of performance* is good and non-obligatory, Nadia’s shift remains supererogatory forever. But this ignores how repeated supererogation can generate new duties through others’ expectations. The case shows that an act can lose supererogatory status *post hoc* due to contingent social facts—not changes in the act itself. This suggests supererogation is context-sensitive and temporally unstable under the standard definition, especially for habitual acts.

  One might object that this unfairly penalizes Nadia’s generosity: her consistency created the reliance, yet now she is *less* free than if she had never volunteered. Punishing sustained beneficence risks discouraging the very behaviour we wish to encourage. However, this objection conflates *blame* with *obligation*. Nadia’s obligation arises from the clinic’s legitimate dependence, not fault. She is not "punished" but rather faces the moral consequences of her impact on others’ welfare. While unfortunate, this reflects a reality: when we integrate voluntary acts into vital systems, they acquire functional necessity. The solution is not to deny obligation but to design systems that avoid over-reliance—e.g., the clinic should have formalized weekend staffing.

  Importantly, obligation need not extinguish praiseworthiness. Nadia’s shift remains admirable in year ten because she sacrifices personal interests (her daughter’s graduation) for others’ needs. Obligatory acts can be heroic when costly. The persistence of praiseworthiness despite obligation resolves the concern that Nadia’s moral credit vanishes; duty and merit coexist.

  Alternative grounds for obligation beyond reliance exist. Some might argue Nadia’s shift fits an "imperfect duty" of beneficence—a general obligation to help others that allows latitude in how and when. When Nadia’s pattern became predictable, the duty "crystallized" into a specific requirement for this clinic on Saturdays. However, this framing is unnecessary here. The reliance account suffices: the clinic’s actions (structuring rosters, refusing funding) created tangible vulnerability, making Nadia’s participation necessary to prevent harm. Whether grounded in reliance or duty specification, the outcome aligns: her initial generosity generated constraints she cannot now disregard without failing others.

  A broader implication concerns how private generosity affects systemic responsibility. Nadia’s reliability allowed the clinic (and potential funders) to evade their duty to secure sustainable staffing. Her supererogation "crowded out" institutional solutions, masking a structural problem. When such crowding occurs, the supererogatory act ceases to be a true "extra" and becomes a stopgap others exploit. This reinforces that supererogation’s status depends on social context, not just individual intent.

  In conclusion, Nadia’s shift ceased being supererogatory by year eight when the clinic refused the grant. The change was triggered by others’ reliance, revealing that supererogation can erode through no fault of the agent. While this might seem to disincentivize sustained giving, it instead highlights that moral categories evolve with real-world dependencies. Nadia’s act remains praiseworthy, but its optionality is lost—not because she promised, but because her commitment became woven into others’ survival.

  ---

  ### (3) Marking Scheme (30 marks total)  
  **Top-band answers (24–30 marks) must:**  
  1. **Diagnose the shift** (6 marks):  
     - Clearly state the act is no longer supererogatory by year ten.  
     - Pinpoint reliance (clinic’s roster/grant decisions) as the catalyst, not Nadia’s intent.  
     *Common error: Arguing it remains supererogatory because "she never promised."*  

  2. **Explain reliance erosion** (8 marks):  
     - Trace how institutional dependence (rosters, messaging, grant refusal) created obligation by year 8.  
     - Argue this exposes a flaw in the static "good but not required" definition.  
     *Common error: Claiming the act’s value changed, or that obligation requires Nadia’s consent.*  

  3. **Engage the "unfairness" objection** (5 marks):  
     - Concede that consistency "creates" obligation but counter that blame ≠ obligation.  
     - Note praiseworthiness persists despite duty.  
     *Common error: Treating "obligatory" as synonymous with "blameworthy if omitted" without nuance.*  

  4. **Distinguish praiseworthiness from status** (4 marks):  
     - Explain why the act remains admirable (sacrifice) even when obligatory.  
     - Avoid claiming obligation negates moral credit.  
     *Common error: Assuming "obligatory" implies the act is morally neutral.*  

  5. **Alternative grounding (OR equivalent)** (4 marks):  
     - Either: Suggest reliance alone suffices for obligation without imperfect duty language, OR  
     - Use imperfect duty/latitude to explain crystallization (but *not* required for full marks).  
     *Top answers can omit "imperfect duty" if they establish reliance as an independent source of obligation.*  

  6. **Insight** (3 marks):  
     - Note crowding out (her reliability discouraged systemic solutions) OR  
     - Highlight temporal instability of supererogation under standard definitions.  
     *Not required for full marks but distinguishes A+ answers.*  

  ---

  **Key Clarification:** A student can achieve full marks **without mentioning moral residue or imperfect duty** (your instinct is correct). To do so, they must:  
  - Ground obligation squarely in *others' legitimate reliance* (not Nadia’s intent).  
  - Explain how this reliance arose from institutional choices (rosters, grant refusal).  
  - Defend why reliance creates obligation independent of promise/consent.  
  - Preserve praiseworthiness despite obligation.  

  This meets the core demand: showing supererogation can vanish due to external factors while the act’s value is unchanged, using the case’s social dynamics as the engine.
