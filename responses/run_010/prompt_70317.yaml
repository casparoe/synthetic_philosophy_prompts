prompt: |-
  so — I'm handing in a short position statement for a grad workshop on blame and the people in the room are going to tear it apart, and I want a reality check first. I genuinely don't have a feel for which of these is load-bearing, which is kind of the point of asking. Here's what I actually believe about standing and hypocrisy:

  1. Whether a moral claim is true has nothing to do with who's asserting it. Tu quoque is a fallacy and I never want to slide into it.
  2. But standing is a seperate thing from correctness. You can be right about the wrong and still not be in a position to blame someone for it — the criticism can be true and the blaming still inappropriate.
  3. Blame isn't just a hostile feeling. It's a kind of address: you're making a demand on someone, and it has to be a demand you're also prepared to hold yourself to. So what kills standing is failing to apply your own standard to yourself.
  4. That failure doesn't have to be visible. A guy who preaches thrift, secretly maxes out credit cards, and is never found out has lost standing just as fully as one who gets caught on Tuesday. Nobody's beliefs about him shift, nothing in the practice is disturbed, and he still can't blame.
  5. When I ask myself what's so bad about hypocritical blame — bad enough to cost you the right to make the criticism — most of my answer is social. It corrodes trust in moral address, it lets people with power weaponise morality, it makes blame look like status management rather than protest. That erosion is a large part of why hypocrisy costs you standing.
  6. Standing comes in degrees, and one way to have more of it is to be on the receiving end of the wrong you're criticising. Survivors get an elevated standing outsiders don't, and I don't think that's a pragmatic concession to rhetoric — I think it's the same property, more of it.
  7. I refuse the conclusion that nobody can blame anybody. Everyone is a hypocrite about something, and if that always forfeits standing then the whole enterprise is empty, which I take to be obviously the wrong result.

  Cases, both real-ish. My aunt drives everywhere, has never once felt bad about it, and lectures me about flying to conferences. My friend does exactly the same amount of driving, hates it, has tried twice to sell the car and failed, and lectures me about the same thing. I think both of them have forfeited standing with me.

  Do this as an audit, not a lecture. Which of these actually pull against each other, worst first — and don't just tell me everything is a bit tense, rank them. Which apparent conflict isn't a real one once you look closely, and what in my own list dissolves it? For each genuine tension, say which number has to go or has to be weakened, and what it costs me to weaken it there rather than somewhere else. Then tell me the single revision that buys the most consistency, and whether my two case verdicts survive it. No need to point me at the literature, I've read the usual suspects — I just want to know whether this particular set hangs together.
reasoning: |-
  Okay, let me try to unpack this user's position statement on blame and hypocrisy. They've laid out seven core beliefs and two real-life cases, and they want a reality check before their grad workshop. The key request is an audit—ranking tensions in their framework, not just pointing out problems.

  First, I need to understand their structure. Points 1 and 2 establish a clear separation between moral truth and standing. That seems solid. Point 3 defines blame as address with a self-applicability requirement—this is their engine. Point 4 extends the hypocrisy criterion to private failures, which is provocative but internally consistent. 

  Hmm, point 5 introduces social consequences as central to why hypocrisy matters. That's where I see the first major tension. If standing is lost purely through private hypocrisy (point 4), why does point 5 emphasize social erosion? Does the mechanism live in the address itself or in its reception? 

  Point 6 about survivor standing having "more of the same property" seems to clash with point 3's universal demand. If standing is about self-application, why would being victimized increase it? Unless... maybe the demand itself changes when you're affected? 

  Point 7 rejects universal standing loss—good instinct, but it's Band-Aiding the deeper issue. The aunt/friend cases expose this: both lose standing for the user, but the friend is trying. Why doesn't effort matter? That suggests their framework lacks a "sincere commitment" dimension. 

  Biggest conflict: Point 4 (private hypocrisy kills standing absolutely) and Point 7 (can't have universal standing loss). If secret failures always remove standing, we do get universal forfeiture. The user knows this can't be right but hasn't resolved it. 

  The aunt/friend cases help diagnose. Both fail self-application equally, so by point 4 they lose standing. But intuitively, the friend seems different. The user's system can't capture that because point 3's "demand you hold yourself to" is binary—either you meet the standard or you don't. No room for striving. 

  Most impactful revision: Soften point 3. If blame requires "sincere commitment to holding oneself to the standard" rather than perfect compliance, then the friend keeps standing while the aunt loses it. This saves point 7 and resolves the cases. Cost? It makes standing more subjective—but that's better than collapse. 

  Point 5's social concerns become secondary effects rather than standing's core. That's acceptable since the user already separates standing from correctness. The survivor point (6) might need reworking—maybe survivors have stronger standing because their commitment is unquestionable? 

  Final check: With sincere commitment as the core, the aunt (no commitment) lacks standing; friend (committed but failing) keeps it. Social harm explains why we especially resent hypocrites, but isn't definitional. Framework holds.
answer: |-
  Here’s a ruthless audit of your position, ranked by severity of tension. I’ve flagged conflicts, dissolved apparent ones, and identified the cost of revisions. Your core argument is robust but has one critical pressure point.

  **Worst First: Ranked Tensions**  
  1. **Point 4 vs. Point 7**  
     - **Conflict:** Point 4 (private hypocrisy forfeits standing absolutely) + Point 7 (rejecting universal standing loss) = Contradiction.  
       If *all* private moral failures kill standing (4), and *everyone* is a hypocrite about something (7), then standing is universally forfeited — which you explicitly reject.  
     - **Revision Needed:** **Point 4 must be weakened.**  
     - **Cost:** Retreat from "standing loss is absolute and internal" to "standing loss requires *knowing* hypocrisy or *exposure*." This sacrifices the elegance of your private-failure argument but saves your framework from collapse.  

  2. **Point 3 vs. Point 6**  
     - **Conflict:** Point 3 (standing requires applying the standard *to yourself*) vs. Point 6 (survivors have *elevated* standing).  
       If standing is binary ("hold yourself to the standard"), survivors shouldn’t have *more* — they either meet the criterion or not. "Elevated" standing implies degrees, but Point 3 frames it as a threshold.  
     - **Revision Needed:** **Reinterpret Point 3.**  
     - **Cost:** Redefine blame as "address with *sincere commitment* to the standard" (not perfect compliance). Survivors’ standing is "elevated" because their commitment is unquestionable (dissolving the tension with Point 6).  

  3. **Point 5 vs. Point 4**  
     - **Apparent Conflict:** Point 5 (social harm explains why hypocrisy costs standing) vs. Point 4 (standing loss occurs even without social harm).  
     - **Dissolved by:** Point 5 is *explanatory*, not definitional. Social harm justifies *why* we care about hypocrisy (including private failures), but standing loss itself is rooted in the *internal logic of blame* (Point 3). No revision needed.  

  **Minor Tension**  
  4. **Point 1 vs. Point 2**  
     - **Apparent Conflict:** Separating truth and standing (Point 2) might seem to undermine Point 1 (truth is speaker-independent).  
     - **Dissolved by:** Point 2 explicitly distinguishes correctness from standing. Truth remains objective; standing governs the *act of blaming*, not the truth-value. No revision needed.  

  ---

  **Single Best Revision for Consistency:**  
  **Weaken Point 4 →** *"Failing to apply your own standard forfeits standing **when the blamer is aware of their failure or when it’s publicly exposed**."*  

  **Why this buys the most:**  
  - Rescues Point 7 (not *every* hypocrite loses standing — only those aware/exposed).  
  - Retains the core of Point 3 (blame requires holding *yourself* accountable).  
  - Explains your aunt/friend cases:  
    - **Aunt:** Aware of her driving but unrepentant → loses standing.  
    - **Friend:** Aware but striving → **keeps standing** (under revised framework).  
    - *Your original verdict ("both forfeit") changes* — your friend regains standing.  

  **Do your case verdicts survive?**  
  - **Aunt:** Yes (loses standing).  
  - **Friend:** **No** — they now *retain* standing because they meet the "sincere commitment" standard (Point 3 revised). This aligns better with intuition: effort matters.  

  **Final Framework Health:**  
  - **Strong:** Points 1, 2, 5, 6 (after Point 3 reinterpretation).  
  - **Stable but Adjusted:** Points 3 (commitment, not compliance) and 4 (awareness/exposure matters).  
  - **Saved from Implosion:** Point 7 (universal standing loss avoided).  

  **Bottom Line:** Your core insight (blame as address requiring self-application) holds, but secret hypocrisy can’t *always* forfeit standing without nuking moral practice. The revision costs you a clean "internalist" account of standing but saves the system. **Aunt still can’t blame; friend can.** Bring popcorn to the workshop — this’ll be fun.
