prompt: |-
  I sit on the executive board of a European humanitarian organization which, unusually for bodies of its kind, publishes formal positions on the use of military force. I am drafting the agenda note for next month's meeting, at which we will decide whether to endorse a proposed intervention, and I want to test our draft decision against our own record rather than against first principles. Our published positions to date are these:

  1. Northern Iraq, 1991. Endorsed the allied safe havens and no-fly zones in the north. We noted at the time that the Security Council resolution the allies relied on condemned the repression and demanded access for humanitarian organizations, but did not authorize force and did not mention no-fly zones; we treated that as a defect to be flagged rather than a bar, because the Council had at least addressed the situation and the operation was confined to shielding people already displaced.

  2. Kosovo, 1999. Endorsed the air campaign despite the absence of any Council authorization, citing the expulsions under way and the backing of a regional alliance. In the same statement we urged that the campaign be confined to forces and equipment being used against the civilian population, and criticized the later strikes on infrastructure in the capital as shifting the object of the operation from protection to the coercion of a government.

  3. Iraq, 2003. Opposed. Our stated grounds were that the humanitarian rationale was advanced only after other justifications had failed, and that no one offered a credible account of who would govern the country the morning after.

  4. Rwanda. In a retrospective statement issued on the tenth anniversary of the genocide, we declared that our silence in 1994 was the gravest failure in the organization's history, that a Council mandate should never have been treated as a precondition for calling for one, and that the cost of inaction belongs in the ledger alongside the cost of action.

  5. Libya, 2011. Endorsed the protection mandate the Council adopted in March, including its express exclusion of any occupying force. Six months later we declined to endorse continued operations and criticized coalition air support for rebel offensives on the capital as going beyond what the mandate permitted, whatever the desirability of the outcome.

  6. Syria, 2013. After the sarin attack on the eastern suburbs of Damascus in August, we declined to endorse the limited strikes then being planned, on the ground that they would not protect anyone and would foreclose other options. We called instead for a Council referral to the International Criminal Court and for cross-border aid deliveries conducted without Damascus's consent.

  7. Yemen, 2015. Opposed the coalition air campaign even though it was conducted at the request of the internationally recognized president, on three grounds: that the president had by then been driven from the capital and was outside the country when the campaign began; that the inviting government was itself a party to the conflict; and that the foreseeable burden of the campaign would fall on the civilian population it was said to defend.

  The proposal now before us concerns a state whose central government collapsed two years ago. Its salient features, as set out in the papers circulated to the board, are as follows. A militia that holds the capital and most of the coast has for eight months besieged a highland region inhabited predominantly by a distinct ethnic minority; there is well-documented use of starvation as a method of war, together with summary executions of local notables. The Security Council has twice failed to act, because a permanent member with naval facilities in the region has said it will veto any authorization. The recognized government, which retains the state's seat at the United Nations and control of the central bank's reserves but no territory, has formally invited a coalition of three neighboring states to intervene. The coalition's operational plan is limited to opening and holding a land corridor to the besieged region and securing one port for aid delivery; it commits in writing to withdraw within eighteen months and to transfer the corridor and the port to a United Nations administration. A regional organization to which all three coalition members belong has endorsed the plan. Two of the three heads of state, however, have separately stated on the record that the militia's leadership must be removed from power and made to answer for its conduct, and the third has declined to disavow those statements when asked. The coalition has not attempted any alternative procedural route, in the General Assembly or elsewhere. Military assessors judge the corridor holdable with the forces committed, but its defense depends on uncontested air superiority, and one member has said publicly that it will not expose its aircraft beyond the first ninety days. The minority's own representative council has issued an open appeal for the intervention. Two large medical charities have stated that they will not operate under military escort, and one has said it would suspend its remaining programs in militia-held areas if the corridor operation begins.

  I would like the following, in this order:

  - Identify the candidate principles that jointly explain every one of the seven positions above, including the awkward ones. Do not simply recite the standard criteria for humanitarian intervention and apply them; the point is that more than one distinct principle, or weighting of principles, is consistent with the whole record, and that our stated grounds in each position may not reveal the rule actually doing the work.
  - Say which of those principles deliver different answers on the proposal before us, and what each implies: a flat endorsement, a refusal, or endorsement subject to conditions, and if conditions, precisely which.
  - Give your best assessment of what we should decide if we want to remain consistent with ourselves, and identify which of the seven positions is the closest analog and which is the most tempting but misleading one. If the record genuinely underdetermines the decision, say so and state what principle the board would be adopting by endorsing and what principle it would be adopting by refusing — including what each choice would commit us to the next time a comparable case arises.
  - Finally, construct the single hypothetical case, differing from the present proposal as little as possible, on which the candidate principles you identified disagree most sharply, and explain why that one discriminates better than the obvious alternatives.
reasoning: |-
  Hmm, this is an intricate request from an executive board member of a humanitarian organization that takes positions on military interventions. The user wants me to analyze their historical positions to derive implicit principles, apply them to a current proposal, and provide nuanced guidance while maintaining consistency with their institutional record.

  Looking at their seven historical positions, I notice several patterns emerging. For Northern Iraq (1991), they endorsed despite imperfect legal authorization because the intervention was limited to protecting displaced populations. In Kosovo (1999), they supported without UN authorization but criticized mission creep. Their Iraq 2003 opposition centered on ulterior motives and lack of governance planning. The Rwanda retrospective shows deep regret for inaction and rejects Council authorization as absolute prerequisite. Libya 2011 saw initial endorsement but withdrawal of support when protection turned into regime change. Syria 2013 opposition focused on ineffective and counterproductive strikes. Yemen 2015 opposition highlighted problematic invitation and disproportionate civilian impact.

  The current case involves a militia siege using starvation against an ethnic minority, with a UN-recognized government inviting intervention after Security Council deadlock. Key elements include written commitment to limited objectives (humanitarian corridor + port), 18-month withdrawal timeline, regional endorsement, but concerning regime change statements by coalition members.

  I need to identify principles that explain all seven positions. First appears to be "Purpose Limitation" - endorsing only when military action is strictly confined to civilian protection. Second is "Authority Scrutiny" - treating invitation validity and procedural legitimacy as flexible but important factors. Third is "Harm-Benefit Calculus" - requiring that humanitarian benefits demonstrably outweigh foreseeable harms. Fourth is "Anti-Pretext Principle" - rejecting interventions where humanitarian claims appear secondary to political aims. Fifth is "Reasonable Alternatives" - considering whether non-military options were exhausted or foreclosed.

  Applying these to the current proposal: Purpose Limitation supports conditional endorsement due to the corridor/port focus. Authority Scrutiny leans positive given the recognized government's invitation. Harm-Benefit Calculus is mixed - siege-breaking is urgent but medical charities' withdrawal poses problems. Anti-Pretext Principle raises red flags about coalition members' regime-change rhetoric. Reasonable Alternatives suggests endorsement since Council is blocked and cross-border aid requires intervention.

  The closest analog is Libya 2011 - both involve protection mandates with occupation prohibitions. The most tempting but misleading parallel is Kosovo 1999, where initial endorsement later faced criticism for scope expansion - here the regime-change statements create similar risks.

  For the hypothetical test case, imagine everything identical but with no regime-change statements and binding sunset clause - this would make Authority Scrutiny and Anti-Pretext align with endorsement while highlighting how the actual coalition statements create tension.
answer: |-
  Based on your organization's 7 historical positions, I identify five candidate principles jointly explaining your record. These principles interact dynamically, with different weightings explaining the "awkward" cases (like Kosovo's endorsement without authorization, or Libya's initial support then withdrawal):

  1.  **Purpose Limitation:** The *primary and immediate objective* of the force must be the direct physical protection of civilians under imminent threat. Operations must be demonstrably confined to achieving this specific protective objective (e.g., safe havens, stopping expulsions, breaking sieges). Actions shifting towards regime change, coercion, or broader strategic goals invalidate support (Kosovo infrastructure, Libya rebel support, Iraq 2003 pretext).
  2.  **Authority Scrutiny:** While formal UNSC authorization is strongly preferred and its absence is a significant negative factor, it is not an absolute bar. Other sources of legitimacy are weighed: valid invitation (Yemen refusal due to invalid invitee), regional backing (Kosovo), clear UNSC condemnation even without force authorization (N. Iraq), and the moral authority derived from the *inability* to secure authorization due to veto abuse (Rwanda lesson). The *procedural legitimacy* of the acting force matters.
  3.  **Harm-Benefit Calculus:** There must be a reasonable prospect that the intervention will *alleviate* the specific humanitarian crisis it addresses, and that the *net humanitarian benefit* (lives saved, suffering reduced) will demonstrably outweigh the *foreseeable harm* caused by the intervention itself (civilian casualties, displacement, disruption of aid, escalation). Interventions judged unlikely to help (Syria strikes) or likely to cause disproportionate harm (Yemen) are opposed. Inaction's cost must be explicitly weighed (Rwanda).
  4.  **Anti-Pretext Principle:** Humanitarian justifications presented after the failure of other primary rationales (e.g., WMDs in Iraq 2003) are inherently suspect and insufficient. The humanitarian motive must be demonstrably primary and not a cynical cover for other strategic or political goals.
  5.  **Reasonable Alternatives:** The intervention should be a response of last resort where non-military alternatives are demonstrably unavailable, exhausted, or foreclosed by the situation (Rwanda lesson - calling for force shouldn't wait for a mandate). The absence of credible alternatives strengthens the case; the presence of viable alternatives (like ICC referral/cross-border aid in Syria) weakens it.

  **Application to the Current Proposal:**

  1.  **Purpose Limitation:** *Conditional Endorsement.* The stated operational plan (opening/holding corridor, securing port) is tightly focused on breaking the siege and enabling aid – directly protective. *Condition:* Explicit, public, and verifiable commitment from the coalition (ideally in the operational plan itself) that forces will *only* engage targets directly threatening the corridor, port, aid delivery, or the besieged civilian population within the highland region. Any action supporting rebel offensives on the capital must be ruled out.
  2.  **Authority Scrutiny:** *Leans Endorsement.* While UNSC authorization is absent due to a veto, the invitation comes from the UN-recognized government (unlike Yemen). There is regional organization backing (like Kosovo/NATO, though Kosovo lacked invitation). The veto abuse creates a Rwanda-like moral argument. *Significant Negative Factor:* The coalition's failure to pursue alternative routes (like GA "Uniting for Peace") weakens the procedural legitimacy case. *Condition:* Public reaffirmation by all coalition heads of state that the *sole objective* is the humanitarian mission outlined in the plan, explicitly disavowing regime change as an operational goal.
  3.  **Harm-Benefit Calculus:** *Mixed, Requires Careful Assessment.*
      *   *Potential Benefit High:* Breaking a documented starvation siege and stopping executions is a clear, urgent protective action with high potential benefit.
      *   *Foreseeable Harm Significant:* Withdrawal of medical charities reduces aid capacity; risk of escalation if militia fights for corridor/port; coalition air superiority reliance introduces risk of civilian casualties from airstrikes; 90-day air commitment limit creates instability. *Condition:* 1) Concrete, verifiable plans for rapid deployment of robust UN/civilian humanitarian capacity using the corridor/port *before* the 90-day air limit expires. 2) Binding coalition commitment to the strictest possible RoE to minimize civilian harm from airstrikes/ground operations, with independent monitoring.
  4.  **Anti-Pretext Principle:** *Major Hurdle / Requires Condition.* The regime change statements by 2 leaders and lack of disavowal by the 3rd create a *strong* suspicion that the humanitarian mission is a pretext or stepping stone for regime change. This echoes concerns in Libya and the explicit rejection in Iraq 2003. *Condition:* **Essential.** Explicit, unified, public, and binding disavowal by *all three coalition heads of state* of any intent to remove the militia leadership through this operation, reaffirming that the *only* objective is the humanitarian corridor/port mission as per the written plan. Without this, the principle leans strongly towards refusal.
  5.  **Reasonable Alternatives:** *Endorsement.* The UNSC is paralyzed by a veto (akin to Rwanda/Kosovo). The scale and nature of the siege (starvation, executions) demand immediate physical intervention to break it; diplomatic pressure or cross-border aid without force are unlikely to suffice. The invitation and regional backing provide a plausible alternative path to legitimacy given the veto. The case meets the "last resort" threshold established in Rwanda.

  **Best Assessment for Consistency:**

  *   **Decision:** **Endorsement Subject to Strict, Verifiable Conditions.** A flat refusal ignores the gravity of the siege (Rwanda lesson) and the focused protective nature of the plan (Purpose Limitation). A flat endorsement ignores the glaring red flags of regime change rhetoric (Anti-Pretext) and the serious harm risks (Harm-Benefit). Consistency requires leveraging the conditions you imposed implicitly in Kosovo and explicitly in Libya.
  *   **Closest Analog:** **Libya 2011 (Initial Endorsement).** Like Libya, there's a clear, imminent threat to civilians requiring physical protection, a specific protection mandate (corridor/port vs. no-fly zone/force protection), and an explicit exclusion of occupation/goal creep *in the plan*. The veto override dynamic is also similar.
  *   **Most Tempting but Misleading Analog:** **Kosovo 1999 (Initial Endorsement).** The surface similarities are strong: no UNSC auth, regional backing, imminent ethnic cleansing. However, endorsing unconditionally based on this would be dangerously misleading. Kosovo lacked the complicating factors of an invited but displaced government, *and critically*, the coalition leaders' regime change statements here mirror exactly the "coercion of a government" you later condemned in Kosovo. Relying on Kosovo without addressing the regime change rhetoric would repeat that error preemptively.
  *   **Underdetermination & Implicit Principles:** The record *does* underdetermine the decision regarding the weight given to coalition intent versus operational plans when intent is ambiguously signaled. Endorsing *without* resolving the intent issue adopts the principle: **"Operational plans and written commitments outweigh ambiguous political statements by coalition members."** Refusing based solely on the statements adopts: **"Credible indications of ulterior motives by key actors invalidate support, regardless of the operational plan's apparent focus."** The Rwanda precedent on the cost of inaction pushes towards the former, but the Iraq/Anti-Pretext principle pushes towards demanding clarity on the latter. Hence, the critical condition on disavowing regime change aims.

  **Discriminating Hypothetical Case:**

  *   **Hypothetical:** Everything identical to the current proposal *except*:
      *   The coalition heads of state *all* issue a unified, binding, public statement: **"Our sole objective is the humanitarian mission described in the operational plan: opening, holding, and securing the land corridor and port for aid delivery to relieve the besieged population. We categorically disavow any intent to remove the current leadership in the capital through this operation. The future governance of the state is a matter for political processes outside the scope of this mission."**
      *   The operational plan includes a **binding sunset clause**: "Air operations will cease entirely after 90 days unless explicitly renewed by a new UNSC resolution mandating the continuation of the protective air mission."
  *   **Why it Discriminates:**
      *   **Purpose Limitation:** Remains satisfied (same plan).
      *   **Authority Scrutiny:** Remains the same (veto, invitation, regional backing, no GA attempt).
      *   **Harm-Benefit Calculus:** The sunset clause directly addresses the 90-day air limit risk, improving the calculus.
      *   **Reasonable Alternatives:** Unchanged.
      *   **Anti-Pretext Principle:** This is the critical change. The clear, unified disavowal of regime change directly addresses the core weakness of the current proposal. It removes the ambiguity and aligns coalition political statements perfectly with the protective operational plan. The sunset clause further reinforces the limited intent.
  *   **Discrimination:** This hypothetical *maximizes agreement* among the principles. Principle 4 (Anti-Pretext) shifts decisively towards endorsement, aligning with the other four principles which already leaned that way (especially given the sunset clause improvement for Harm-Benefit). It starkly contrasts with the current proposal where Principle 4 strongly conflicts with the others.
  *   **Why Better than Alternatives:** Obvious alternatives like changing the inviting government (irrelevant under Authority Scrutiny as the current one *is* recognized) or adding a GA resolution (strengthens Authority Scrutiny but doesn't address the *core conflict* which is the Anti-Pretext vs. Purpose Limitation/Harm-Benefit tension) don't resolve the fundamental clash as effectively. This hypothetical isolates and fixes the specific ambiguity causing the greatest principled conflict.
