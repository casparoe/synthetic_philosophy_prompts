prompt: |-
  I just took over the performance unit at a state workforce agency. We pay job-training providers partly on a 90-day placement rate, and every quarter a handful of them jump ten points and nobody knows whether to clap or open an investigation. Our last audit turned up a provider that had quietly stopped enrolling anyone with a record or a long gap in thier work history — the metric looked fantastic and the program stopped serving the people it exists for.

  Write me a triage procedure my analyst can run on the quarterly numbers before we decide whether to send auditors out. Assume we have intake dates, barrier and demographic flags, placement dates, wage at placement, and 6- and 12-month follow-ups — no site visits, no experiment, no clean comparison group. I want the tests in order, what each one needs and what a fail looks like, and the points where the procedure has to stop at "can't tell from this data" instead of guessing. Ground it in whatever is actually known about how a proxy comes apart from the thing you care about; I know there's a difference between gaming somebody chose to do and drift that just falls out of the structure of the measure, and I want those handled differently because the fixes are different. Flag every step that's really a judgment call wearing a lab coat.

  Then run it on three: a provider whose placement rate rose sharply the same quarter they cut intake by a third; a provider whose wage numbers improved while 12-month retention got worse; and an honestly excellent provider who just hired two great job coaches — the case where I expect your procedure to flag someone who did nothing wrong. Finish with what this thing can't do and what I'd have to buy to make it able to.
reasoning: |-
  We are designing a triage procedure to detect potential gaming or drift in performance metrics for job-training providers. The primary metric is the 90-day placement rate. We have data on intake dates, barrier/demographic flags, placement dates, wage at placement, and 6- and 12-month follow-ups.

  The goal is to identify when a provider might be manipulating the system (e.g., by cherry-picking easy-to-place participants) versus when there is a natural drift due to the structure of the measure. We also want to avoid false positives for genuinely excellent providers.

  The procedure will consist of a series of tests. Each test will require specific data and will have a "fail" condition. Some steps may lead to "can't tell" if the data is insufficient. We note steps that are judgment calls.

  ### Triage Procedure Steps

  1. **Check for changes in participant demographics and barriers**  
     - **What we need**: Barrier and demographic flags for participants in the current quarter and at least the previous four quarters (to establish a baseline).  
     - **What we do**: Compare the proportion of participants with barriers (e.g., criminal record, long work gap) in the current quarter to the historical average (e.g., past year).  
     - **Fail condition**: A significant decrease (e.g., more than 10% relative change) in the proportion of participants with barriers, especially if it coincides with a jump in the placement rate.  
     - **Note**: This is a direct check for cherry-picking. If we see a drop in barriers and a rise in placement, it's a red flag.  
     - **Judgment call**: Setting the threshold for "significant" change (could use statistical testing, e.g., chi-square, but also consider practical significance).  

  2. **Check for changes in intake volume**  
     - **What we need**: Intake dates and counts by quarter.  
     - **What we do**: Compare the current quarter's intake to the same quarter in previous years and to the immediate past quarter.  
     - **Fail condition**: A sharp drop in intake (e.g., more than 20% relative to the average of the past four quarters) coinciding with a jump in placement rate.  
     - **Why**: Reducing intake might allow the provider to focus resources on fewer participants, but it could also be a sign of cherry-picking (only enrolling those who are job-ready).  
     - **Judgment call**: The threshold for "sharp drop" and whether the timing aligns with the metric change.  

  3. **Check for changes in the timing of placements**  
     - **What we need**: Placement dates relative to the end of the 90-day window.  
     - **What we do**: Look at the distribution of days to placement for placed participants. Compare the current quarter to historical quarters.  
     - **Fail condition**: A significant shift toward placements happening very close to the 90-day cutoff (e.g., more than 50% of placements in the current quarter occur in the last 10 days of the window, compared to a historical average of 30%).  
     - **Why**: This could indicate that the provider is holding placements until just after the 90-day window to avoid counting failures (if the measure is defined as placed within 90 days, then placing on day 91 is a failure). Alternatively, if the measure is placed and still employed at 90 days, then placements close to the end might be at risk of not making the 90-day mark. However, note our metric is "90-day placement rate", which typically means placed by day 90.  
     - **Judgment call**: The threshold for what constitutes a significant shift in the distribution.  

  4. **Check for wage inflation without sustainability**  
     - **What we need**: Wage at placement and 6-month and 12-month retention data.  
     - **What we do**: Compare the current quarter's average placement wage and retention rates (at 6 and 12 months) to historical data.  
     - **Fail condition**: A significant increase in average placement wage accompanied by a significant decrease in 6-month or 12-month retention.  
     - **Why**: A provider might place participants in higher-wage but less sustainable jobs (e.g., temporary, seasonal) to boost the wage metric, but if retention drops, it suggests the jobs are not stable.  
     - **Judgment call**: The thresholds for significant changes in wage and retention.  

  5. **Check for consistency in long-term outcomes**  
     - **What we need**: 6-month and 12-month follow-up data (employment status and wage) for participants placed in the current quarter and in previous quarters.  
     - **What we do**: For the current quarter, we don't have 12-month data yet, but we can look at the correlation between placement rate and long-term outcomes in the past. However, for immediate triage, we can compare the current quarter's 6-month retention (for participants placed in the quarter two quarters ago) and 12-month retention (for the quarter a year ago) to see if they are moving in the same direction as the placement rate.  
     - **Fail condition**: A jump in the placement rate without a corresponding improvement (or even a decline) in 6-month or 12-month retention for the same cohort (with the appropriate lag).  
     - **Note**: This is a lagging indicator, so we might not have the data for the current quarter. For the current quarter, we can only check the long-term outcomes of past cohorts that had similar placement rates.  
     - **Judgment call**: How to handle the lag and whether to compare the same cohort (with lag) or cross-sectional.  

  6. **Check for data anomalies**  
     - **What we need**: All the data fields for the current quarter and historical data.  
     - **What we do**: Look for missing data patterns, duplicate entries, or implausible values (e.g., wages that are too high or too low, dates that don't make sense).  
     - **Fail condition**: An increase in missing data for barrier flags or outcomes, or a pattern of implausible data that coincides with the performance jump.  
     - **Why**: This might indicate data manipulation.  

  ### Order of Tests and Stopping Points

  The tests are ordered to first look for the most direct evidence of gaming (cherry-picking) and then move to more circumstantial evidence. We stop at "can't tell" when data is insufficient.

  1. **Step 1 (Demographics and Barriers)**: If we see a significant drop in barriers, especially if it aligns with the performance jump, that's a strong signal of gaming. We can recommend an audit. If there's no change in barriers, move to step 2.  
     - **Stopping point**: If barrier data is missing for a large portion of participants, we may not be able to tell. We should check the missingness rate and if it's too high (e.g., >20% of records missing barrier flags) then we note "can't tell" and flag for data quality improvement.

  2. **Step 2 (Intake Volume)**: If there's a sharp drop in intake and a jump in placement, that's suspicious. If intake is stable, move to step 3.  
     - **Stopping point**: If we don't have historical intake data (at least 4 quarters), we can't establish a baseline. Then we note "can't tell due to insufficient baseline".

  3. **Step 3 (Placement Timing)**: If we see a shift toward placements near the cutoff, that could be gaming the timing. If not, move to step 4.  
     - **Stopping point**: If we don't have the exact placement dates, we skip this step.

  4. **Step 4 (Wage and Retention)**: If we see wage inflation and retention drop, that's a red flag. If not, move to step 5.  
     - **Stopping point**: If we don't have 6-month or 12-month data for the relevant cohorts, we can't do this test. We note that.

  5. **Step 5 (Long-term Outcomes)**: If we have the lagged data and see a disconnect between placement and retention, that's concerning. If not, we move to step 6.  
     - **Stopping point**: The long-term outcomes for the current quarter's placements are not available yet, so we rely on past cohorts. But if the issue is new, we might not see it in past data. We can compare the current placement rate jump to the long-term outcomes of the most recent cohort for which we have data.

  6. **Step 6 (Data Anomalies)**: If we find anomalies, we flag for audit. If not, we conclude that the performance jump might be due to genuine improvement or other factors we can't detect with the data.

  After all steps, if we haven't found any red flags, we might still note that the provider passed the triage but we can't be certain without an audit. However, we might prioritize other providers that failed a test.

  ### Applying the Procedure to Three Cases

  #### Case 1: Provider A - Placement rate rose sharply the same quarter they cut intake by a third.

  - **Step 1**: Check barrier flags. If the proportion of participants with barriers dropped significantly, then fail. If barrier data is missing, we can't tell. If barriers are stable, then proceed.  
    *Assume barrier data is available and shows no significant change in barriers. Then we pass Step 1.*  
  - **Step 2**: Intake dropped by 33% (which is more than 20%). This coincides with the jump in placement. **Fail**.  
    We stop and recommend an audit. The reason is that the provider may be cherry-picking by reducing intake to focus on easier-to-place candidates, even though the barrier flags didn't change (maybe they are selecting based on unobserved characteristics).  

  #### Case 2: Provider B - Wage numbers improved while 12-month retention got worse.

  - **Step 1**: Check barriers. If barriers increased, that might explain the retention drop, but not the wage increase. If barriers decreased, then the wage increase might be due to cherry-picking. But let's assume barrier data shows no significant change.  
  - **Step 2**: Check intake volume. If intake volume didn't change, we move on.  
  - **Step 3**: Check placement timing. If placements are happening at the same pace as before, we move on.  
  - **Step 4**: We see an increase in average placement wage and a decrease in 12-month retention. This is the exact fail condition for Step 4. **Fail**.  
    We recommend an audit for potential gaming (e.g., placing participants in high-wage but unstable jobs).  

  #### Case 3: Provider C - Honestly excellent provider who just hired two great job coaches.

  - **Step 1**: Barrier flags should be stable or even improving (because better coaches might be able to handle more challenging cases). Assume barrier data shows the same mix of participants. Pass.  
  - **Step 2**: Intake volume: if they maintained or increased intake, then no issue. Pass.  
  - **Step 3**: Placement timing: if the new coaches are effective, they might place participants faster (so more placements early in the 90-day window). That is not a fail condition (we are looking for clustering near the end). Pass.  
  - **Step 4**: Wages and retention: we expect both to improve. But what if the provider is now placing participants in better jobs? Then we should see higher wages and stable or improved retention. If retention drops, that would be a red flag, but we don't expect that.  
    However, note that the hire happened in the current quarter. The long-term retention data for the current quarter's placements won't be available for 6-12 months. So we can only look at the current quarter's placement wage and the retention of past cohorts.  
    For Step 5 (long-term outcomes): we don't have long-term data for the current quarter. We can check if the past cohorts that had high placement rates (if any) also had good retention. But if this is the first quarter of improvement, we can't see the long-term effect yet.  
    **Result**: The provider passes Steps 1-4 and Step 5 is inconclusive because of the lag. Step 6 (data anomalies) should pass.  
    But note: the procedure did not flag this provider. We passed all tests.  

  However, what if the new coaches are so good that they are placing participants much faster? Then in Step 3, we might see a shift toward earlier placements. That is not a fail condition (we were looking for late placements). So that's fine.

  ### What This Procedure Can't Do

  1. **Detect collusion with employers**: If a provider has a deal with an employer to hire participants just for 90 days and then let them go, we might see good placement rates but poor retention. However, we do check retention in Step 4 and Step 5, but with a lag. So we might catch it in the next quarter or two.

  2. **Identify changes in unobserved characteristics**: We rely on barrier flags and demographics. If a provider starts selecting on unobserved characteristics (e.g., motivation, soft skills) that we don't flag, we won't catch it.

  3. **Real-time monitoring of long-term outcomes**: Because of the lag in 6- and 12-month data, we cannot immediately link a current placement rate jump to long-term outcomes.

  4. **Distinguish between genuine improvement and gaming when multiple factors change**: For example, if a provider both hires great coaches and starts cherry-picking, the signals might cancel out.

  5. **Capture external factors**: Changes in the local economy, employer demand, or policy changes might affect the metrics.

  ### What You'd Have to Buy

  To improve the procedure, consider:

  1. **Random site visits and interviews**: To verify employment and job quality, and to talk to participants about their experience.

  2. **Comparison groups**: If possible, use a quasi-experimental design (e.g., matched comparison group of similar individuals not in the program) to estimate the program's effect. But that requires data on non-participants.

  3. **More frequent data collection**: For example, monthly check-ins on employment status to reduce the lag in retention data.

  4. **Predictive modeling**: Build a model to predict expected placement and retention rates based on participant characteristics and economic conditions, then flag deviations from predictions.

  5. **Audit of provider's processes**: Review the provider's intake procedures, job matching processes, and data reporting systems.

  6. **Participant surveys**: To collect data on unobserved characteristics and job satisfaction.

  By investing in these, you could reduce the "can't tell" outcomes and better distinguish between gaming and genuine performance.
answer: |-
  Below is a triage procedure for your performance unit to systematically evaluate quarterly jumps in 90-day placement rates. It prioritizes detecting gaming (intentional manipulation) versus drift (unintentional structural issues), uses available data pragmatically, and explicitly flags judgment calls. The procedure is grounded in research on proxy metric corruption (e.g., Goodhart's Law, Campbell's Law) and real-world workforce program vulnerabilities.

  ---

  ### **Triage Procedure: Evaluating Placement Rate Jumps**  
  **Goal**: Identify whether a placement rate increase is due to gaming, drift, or genuine improvement.  
  **Input**: Quarterly data for a single provider, including:  
  - Intake dates, barrier/demographic flags (e.g., criminal record, work gap >6 months), placement dates, wage at placement, 6-/12-month employment retention.  
  **Output**: One of:  
  - **"Gaming suspected"** (red flag for audit),  
  - **"Drift suspected"** (yellow flag for metric redesign),  
  - **"Inconclusive"** (not actionable without more data),  
  - **"No red flags"** (proceed cautiously).  

  #### **Step Order & Logic**  
  Tests progress from high-specificity (direct gaming signals) to high-sensitivity (broader drift/context). Stop at "Inconclusive" if data gaps prevent reliable analysis. Judgment calls are flagged.  

  ---

  #### **1. Barrier Composition Shift Check**  
  **Purpose**: Detect cherry-picking (gaming) by screening out high-barrier participants.  
  **Needs**: Barrier flags for all enrollees in the current quarter (Qc) and ≥4 prior quarters (historical baseline).  
  **Test**:  
  - Calculate % of enrollees with ≥1 barrier (e.g., record/work gap) in Qc vs. historical average.  
  - **Fail (Gaming)**: ≥10%* absolute reduction in barrier rate, coinciding with ≥5%* placement rate jump.  
  - **Inconclusive**: >20% missing barrier flags in Qc/historical data.  
  **Why it works**: Directly measures exclusion of target populations. Known risk in workforce programs (e.g., "creaming").  
  **Judgment call**: Thresholds* (set based on your population’s typical barrier rate; e.g., if baseline=40%, 10% drop = new rate=30%).  

  ---

  #### **2. Intake Volume & Urgency Check**  
  **Purpose**: Identify strategic enrollment drops (gaming) or capacity issues (drift).  
  **Needs**: Intake counts and dates for Qc and ≥4 prior quarters.  
  **Test**:  
  - Compare Qc intake volume to historical average and same quarter YoY.  
  - **Fail (Gaming)**: Intake drop ≥25%* coinciding with placement jump.  
  - **Fail (Drift)**: Intake drop ≥25%* without placement jump (suggests loss of capacity/relevance).  
  - **Inconclusive**: Inconsistent historical intake data (e.g., seasonal programs).  
  **Why it works**: Sudden enrollment cuts often precede gaming; sustained drops indicate systemic drift from mission.  
  **Judgment call**: Threshold* (25% balances noise vs. signal; adjust for provider size).  

  ---

  #### **3. Placement Timing Distribution Check**  
  **Purpose**: Detect deadline gaming (e.g., rushing placements near day 90).  
  **Needs**: Placement dates (to calculate days-to-placement) for Qc and historical.  
  **Test**:  
  - Compare % of placements in Qc occurring in days 80–90 vs. historical average.  
  - **Fail (Gaming)**: ≥15%* absolute increase in end-of-window placements.  
  - **Inconclusive**: Missing placement dates or small sample size (<20 placements).  
  **Why it works**: Clustering near deadlines suggests artificial inflation (common in time-bound metrics).  
  **Judgment call**: Threshold* (15% detects material shifts without overflagging).  

  ---

  #### **4. Wage-Retention Decoupling Check**  
  **Purpose**: Catch wage-focused gaming (e.g., placing in unstable high-wage jobs).  
  **Needs**: Wage at placement and 12-month retention for the same cohort (lagged by 1 year).  
  **Test**:  
  - For cohort placed 4 quarters ago: compare avg. wage to 12-month retention.  
  - **Fail (Gaming)**: Wage increase ≥10%* with retention decrease ≥10%* (cohort-level).  
  - **Inconclusive**: <50% follow-up rate or missing wage data.  
  **Why it works**: Wage/retention trade-offs indicate job-quality sacrifices (known proxy corruption).  
  **Judgment call**: Thresholds* and cohort alignment (assumes 12-month retention reflects sustainability).  

  ---

  #### **5. Longitudinal Consistency Check**  
  **Purpose**: Spot drift in program effectiveness (e.g., declining impact despite metric gains).  
  **Needs**: 6-/12-month retention for current/lagged cohorts.  
  **Test**:  
  - Compare 90-day placement rate to 6-month retention for the same cohort (lagged 1 quarter).  
  - **Fail (Drift)**: Placement rate jump with no improvement/decline in 6-month retention.  
  - **Inconclusive**: Retention data <60% complete or cohorts <30 participants.  
  **Why it works**: Stable retention validates placement quality; decoupling suggests metric drift.  
  **Judgment call**: Defining "decline" (use historical correlation; e.g., if placement ↑10% but retention ↓5%, investigate).  

  ---

  #### **6. Contextual Sanity Check**  
  **Purpose**: Rule out data errors or external factors.  
  **Needs**: All data + external context (e.g., local unemployment rate changes).  
  **Test**:  
  - Verify no data entry anomalies (e.g., duplicate placements, implausible wages).  
  - Check for known external shocks (e.g., plant closure, policy change).  
  - **Fail (Gaming/Drift)**: Anomalies + metric jump; external factors don’t explain the change.  
  - **Inconclusive**: Confounding events (e.g., major employer opened).  
  **Why it works**: Rules out "false positives" from noise.  
  **Judgment call**: Assessing plausibility of external factors (requires analyst discretion).  

  ---

  ### **Procedure Outputs**  
  - **Stop and flag "Gaming"** if any test fails for gaming.  
  - **Flag "Drift"** if tests 2/5 fail (without gaming flags).  
  - **"Inconclusive"** if critical data is missing (e.g., barriers in step 1).  
  - **"No red flags"** only if all tests pass.  

  ---

  ### **Case Applications**  
  **Case 1: Provider with placement rate ↑ and intake ↓ by 33%**  
  - **Step 1**: Barrier rates stable? If barriers ↓10%, fail (gaming).  
  - **Step 2**: Intake ↓33% → **Fail (Gaming)**. Stop. Audit recommended.  
  - *Why*: High risk of cherry-picking. Fix: Enrollment compliance audit.  

  **Case 2: Provider with wages ↑ but 12-month retention ↓**  
  - **Step 1**: Barriers stable? If no change, proceed.  
  - **Step 2**: Intake stable? If yes, proceed.  
  - **Step 3**: Placement timing normal? If yes, proceed.  
  - **Step 4**: Wages ↑10%, retention ↓10% → **Fail (Gaming)**. Stop. Audit recommended.  
  - *Why*: Sacrificing sustainability for wage metrics. Fix: Validate job quality/retention.  

  **Case 3: Excellent provider (hired job coaches); no wrongdoing**  
  - **Step 1**: Barriers stable or improved? If yes, proceed.  
  - **Step 2**: Intake stable? If yes, proceed.  
  - **Step 3**: Placement timing: Likely ↑ in *early* placements (days 1–30). **No fail** (not end-of-window clustering).  
  - **Step 4**: Lagged data may show wage/retention ↑ → **No fail**.  
  - **Step 5**: 6-month retention ↑ → **No fail**.  
  - **Result**: **No red flags** (correct pass).  
  - *False positive risk*: Only if job coaches coincidentally reduced barriers (step 1) – but data would show real improvement.  

  ---

  ### **What This Procedure Can't Do**  
  1. **Detect collusion**: E.g., providers temporarily hiring participants.  
     - *Need to buy*: Employer verification audits or payroll data cross-checks.  
  2. **Capture soft outcomes**: E.g., job satisfaction, skill gains.  
     - *Need to buy*: Participant surveys or skills assessments.  
  3. **Prove causality**: Confounding factors (e.g., economic shifts) may skew results.  
     - *Need to buy*: Comparison group analysis (e.g., matched non-participants).  
  4. **Real-time intervention**: Lagged retention data delays drift detection.  
     - *Need to buy*: Monthly employment verification (e.g., via state wage records).  
  5. **Assess coaching quality**: Site visits or participant interviews needed.  

  **Recommendation**: Start with this procedure to prioritize audits, then invest in wage record integration and spot audits to close gaps. Focus gaming fixes on compliance (e.g., enrollment rules), drift fixes on metric redesign (e.g., barrier-adjusted placement rates).
