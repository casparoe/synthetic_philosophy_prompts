prompt: |-
  I fly and instruct on transport-category aircraft, and I have spent some years reading the philosophy of perception on the side — enough to know the names of the positions, not enough to have decided between them. What I want now is an audit of my own profession's training doctrine, because I think it takes a stand on the nature of perception, and I suspect it does not take the same stand twice.

  Here is the practice, as concretely as I can set it out. From the first hours of instrument training, a pilot is taught that the bodily senses are unfit as evidence about the aircraft's state in flight. The vestibular system cannot separate inertial force from gravity, so linear acceleration on a night takeoff over water produces a compelling sensation of pitching up that, if followed, ends in a dive; a bank entered slowly enough to fall below the threshold of detection leaves the pilot feeling wings-level when the aircraft is in fact banked, and then makes an honest correction feel like a bank the other way; head movements in a turn generate sensations of tumbling in axes that have no counterpart in the aircraft's actual motion. The drilled response to all of it is uniform: disregard the felt sense, fly the instruments, and recover unusual attitudes with reference to the panel rather than to the body. Accompanying this is an explicit doctrinal claim that I want you to take seriously, because I think it is doing philosophical work: a pilot in the grip of such an illusion cannot detect it from the inside. The misleading presentation of attitude is said to be, from the subject's point of view, exactly what a veridical presentation would be, so there is no introspective mark distinguishing the two cases, and the only available remedy is to defer to an indirect representation of the aircraft's state that the pilot has learned to interpret.

  Now the second half, which is what puzzles me. On an instrument approach, at the decision altitude or minimum descent altitude, the instruments are declared insufficient. To continue the descent the pilot must have the required outside visual references actually in sight — the runway environment itself — and if they are not there the approach is abandoned, however flawless the guidance has been. We are separately taught to expect the visual scene to mislead in recognizable ways: an unusually narrow runway or upsloping terrain produces a sense of being high that drives the aircraft low, and a night arrival over unlit water or featureless ground supports a confident sense of a normal glide path that terminates in the ground. Yet the prescribed remedy there is not more instrumentation but more procedure — a stabilized approach, published altitudes, cross-checked descent gates, a willingness to go around. And increasingly there are approved ways to substitute an infrared-derived image of the outside world for natural vision in the final segment. So in one phase of flight the deliverances of the senses are overridden by a representation; in another phase the representation is subordinated to direct visual contact with the environment; and the illusions we are warned about in the visual case are managed by rules rather than by better instruments.

  With that practice in view, I would like the following.

  1. Reconstruct the theory of perception the doctrine presupposes. In particular: does the claim that an illusion is undetectable from the inside commit us to the view that the misleading case and the matching veridical case share a common inner state, of the same fundamental kind, differing only in its causes? Does the practice require that claim, or does it merely wear it on the surface?

  2. Separate what the practice strictly presupposes from what it is only consistent with. Is the doctrine wedded to sense-data, to a representationalist account on which perception is always a matter of taking up inner states that may or may not match the world, to a view on which veridical perception is a relation to the environment rather than an inner state at all, or to none of these — that is, is the commitment genuinely metaphysical, or merely operational, a rule about which input to trust in which phase of flight with no theory of perception attached?

  3. Deal with the apparent inconsistency. Are the two halves of the doctrine really in tension, or can one and the same account of perception license both? If they can be reconciled, say precisely what does the reconciling work: differential reliability, task-dependence, the difference between knowing one's attitude and knowing one's position relative to the ground, the fact that the instruments are themselves read by looking at them, or something else. If they cannot, say which half is the anomaly.

  4. Report where the practice is underdetermined. Which rival theories would license exactly the same syllabus, the same drills, and the same accident-investigation conclusions? Is there anything in the practice — anything we actually do, require, or forbid — that only makes sense on one of them? I want to know whether my profession has an implicit metaphysics or only an implicit engineering policy, and what would settle the question either way.

  5. Run the counterfactual. Suppose we rebuilt the training from the view that veridical perception is not an inner state that happens to match the world but a different kind of thing altogether — direct acquaintance with the environment, not the same appearance with better causes. Would anything change? Would synthetic vision, conformal head-up symbology, and infrared-derived imagery be the natural completion of our present doctrine or a quiet abandonment of it? Would any drill for the illusions have to be rewritten, and if none would, what does that tell us about how much weight the doctrine's philosophical language is really bearing?

  Lead with your bottom line: a single opening sentence stating which view of perception this practice commits us to, or that it commits us to none. Then give the reasoning, organized under the five headings above. No preamble, and no restating of the question.
reasoning: |-
  Okay, this is a fascinating and deeply layered query from someone clearly fluent in both aviation and philosophy of perception. The pilot-philosopher is asking for a meta-analysis of their own profession's implicit epistemology - specifically how flight training doctrine engages with theories of perception through its contradictory-seeming treatment of sensory data. 

  First impression: this is that rare case where operational procedures force abstract philosophy into life-or-death practicality. The tension between instrument reliance and visual requirement at decision altitude mirrors the representationalism vs direct realism debate in philosophy. But the pilot's sharper question is whether the training actually commits to either.

  Breaking it down:
  The core contradiction seems to be:
  - Phase 1 (cruise): Sense-data declared fundamentally unreliable; instruments as arbiters of reality
  - Phase 2 (approach): Instruments declared insufficient; direct visual contact necessary
  ...while acknowledging both systems are fallible in different ways.

  What makes this philosophically rich is the explicit claim that illusions are "undetectable from the inside" - that's essentially a statement about the phenomenal indistinguishability of veridical and non-veridical experiences, which is central to arguments for representationalism.

  For the reconstruction (point 1):
  The doctrine's language strongly suggests a representationalist view - the "common inner state" idea. When they say the vestibular illusion feels identical to actual pitch-up, they're essentially describing sense-data that could be caused by multiple external states. This aligns with Lockean representationalism.

  But is this necessary? (point 2)
  Operationally, no. The training could work equally well under direct realism if framed as "sometimes sensory systems malfunction." The metaphysical commitment appears stronger in the vestibular case because the illusion is framed as intrinsically deceptive, not just inaccurate.

  The reconciliation challenge (point 3) is thorny:
  The apparent contradiction dissolves when we consider the different informational needs:
  - Attitude awareness: Requires integration beyond sensory modalities (hence instruments)
  - Ground reference: Requires environmental anchoring (hence visual contact)
  The key is that visual scene provides different data (relative position) that instruments alone can't safely deliver with current tech. So it's about task-specific reliability, not perception's fundamental nature.

  Underdetermination analysis (point 4) is revealing:
  Both representationalism and direct realism could justify the current procedures. Even enactivist views (perception as action-guided) fit the "stabilized approach" concept. The only thing that might lean representationalist is the "undetectable from inside" language - but that could be operational rather than metaphysical.

  Now the counterfactual (point 5):
  Fascinating thought experiment. If we rebuilt training on direct realism:
  - Synthetic vision systems would become philosophically consistent extensions rather than compromises
  - But drills wouldn't change - because the operational constraints (sensory limitations) remain identical regardless of theory
  This suggests the doctrine's philosophical language is mostly rhetorical reinforcement rather than operational necessity.

  The bottom line emerges: The practice operationally assumes representationalism but doesn't strictly require it. The real commitment is to context-specific reliability assessment. The "undetectable illusion" claim is the strongest metaphysical marker, yet even that serves pragmatic rather than philosophical ends.

  Final realization: What looks like philosophical inconsistency is actually brilliant context-sensitive epistemology. The shift from instruments to visual at DA isn't about perception's nature but about risk profiles: attitude errors kill slowly (seconds to impact) while terrain errors kill fast (fraction of a second). Hence different verification strategies.
answer: |-
  **Bottom line:** Aviation doctrine presupposes a representationalist theory of perception operationally but remains metaphysically underdetermined, reconciling its phases through task-specific reliability assessments rather than a unified account of perceptual states.

  ### 1. Reconstructing the Presupposed Theory  
  The claim that illusions are "undetectable from the inside" explicitly endorses **representationalism**. It asserts that vestibular/visual illusions and veridical perceptions share identical phenomenal character, differing only in their causal history (misleading vs. accurate). This requires a "common inner state" (e.g., a sense-datum or neural representation) that mediates perception. The doctrine *depends* on this: if illusions were introspectively distinguishable from reality, pilots could self-correct without instruments. The practice operationalizes this by treating perception as inherently interpretive—a fallible inner representation that may decouple from the world.

  ### 2. Strict Presuppositions vs. Compatibility  
  - **Required:** Representationalism is strictly presupposed for non-visual senses (vestibular/proprioceptive illusions). The "undetectable from inside" claim necessitates that perceptual states are *vehicles* (e.g., sense-data or neural correlates) that may mismatch reality.  
  - **Compatible but not required:**  
    - *Direct realism*: Veridical vision at decision altitude *could* be framed as direct environmental contact, but the doctrine doesn’t demand this—it merely treats vision as *more reliable* for terrain alignment.  
    - *Enactivism*: "Stabilized approach" procedures align with action-oriented perception, but this isn’t explicit.  
  - **Operational core:** The doctrine’s metaphysics is secondary to reliability hierarchies: instruments > bodily senses in cruise; vision > instruments near ground. It *uses* representationalist language pragmatically but could function under other theories if reliability rankings hold.  

  ### 3. Resolving the Apparent Inconsistency  
  **No tension; reconciliation via differential reliability and task constraints:**  
  - **Phase 1 (instruments override senses):** Bodily senses suffer *systemic, uncorrectable* errors (e.g., vestibular illusions lack introspective markers). Instruments provide higher-fidelity *attitude* data.  
  - **Phase 2 (vision overrides instruments):** Vision is uniquely reliable for *terrain-relative position* during approach. Instruments may lag or simplify spatial data (e.g., altimetry vs. slant distance), and vision integrates depth/context faster. Illusions here are *correctable* (e.g., narrow-runway effects mitigated by cross-checking glide-path indicators).  
  - **Reconciling factor:** The shift reflects *domain-specific trust*, not perception’s nature. Vision is prioritized where it outperforms instruments spatially; instruments dominate where senses are physiologically flawed.  

  ### 4. Underdetermination and Rival Theories  
  - **Compatible theories:**  
    - *Representationalism*: Best fits the "undetectable illusion" language and instrument mediation.  
    - *Direct realism*: Could interpret vision as direct contact, with illusions as rare failures.  
    - *Sensorimotor enactivism*: "Stabilized approach" mirrors perception-action loops.  
  - **No theory-exclusive practices:** All justify current drills if they accept:  
    - Vestibular inputs are unreliable for attitude.  
    - Vision is optimal for ground-referenced tasks.  
    - Fallibility requires procedural cross-checks.  
  - **Only commitment:** *Operational skepticism*—no input is infallible; trust hinges on context.  

  ### 5. Counterfactual: Direct Realism Rebuild  
  - **No procedural changes:** Drills for illusions (e.g., "ignore sensations, trust instruments") remain identical. The *operational response* to sensory failure doesn’t hinge on perception’s metaphysics.  
  - **Synthetic vision as natural evolution:** IR/head-up displays would extend, not abandon, the doctrine. They supply *enhanced environmental access*, aligning with direct realism’s "acquaintance" ideal while satisfying the core need: reliable terrain/attitude data.  
  - **Doctrine’s philosophical weight:** The "undetectable illusion" claim *is* rhetorically representationalist but serves heuristic, not metaphysical, purposes—it reinforces instrument reliance. Replacing it with "sensory systems fail predictably" wouldn’t alter training.  

  ### Conclusion  
  Aviation doctrine *operates as if* representationalism is true (especially for non-visual senses) but reduces to a pragmatic reliability hierarchy. Its "inconsistency" arises from task demands, not metaphysical confusion: instruments resolve bodily ambiguity; vision resolves spatial uncertainty. Synthetic vision systems complete, rather than contradict, this by optimizing environmental access—revealing that the doctrine’s essence is engineering, not epistemology.
