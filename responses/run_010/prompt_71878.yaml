  2. Cut straws into lengths that are about 1.5 to 2 times the diameter of the circle. We need many such straws (about 100-150) so that each method can be run multiple times.

  3. Prepare a ledger (on the whiteboard or on a big sheet of paper) to record bets and outcomes. Each student will bet a fixed amount (say $10 in play money) at a price they choose for the event. The price is the probability they assign to the event.

  Activity Structure (90 minutes total):

  Phase 1: Introduction and Betting (10 minutes)
