  - Students will bet on the event that a randomly chosen chord is longer than the side of an inscribed equilateral triangle.
  - The bet is placed before the method of generating the chord is known.
  - The same bet is then settled by three different physical procedures, each corresponding to one of Bertrand's methods.

  Materials (under $20):
  - A4 paper (several sheets)
  - Marker (to draw circles and mark points)
  - Ruler (to measure chords and draw lines)
  - Scissors (to cut straws or spaghetti to use as chords, or use whole straws if long enough)
  - Tape (to fix the circle on the table, if needed)
