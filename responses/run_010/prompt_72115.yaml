prompt: |-
  I am on an eighteen-month secondment with a small civil-society organisation advising a regional water utility and the district councils that oversee it, and we have been asked to produce a short integrity code before the end of the fiscal year. Before I write anything down, I want to find out what I actually believe, because my gut verdicts on the cases we have collected over the past year are not obviously consistent with one another, and my colleague on the secondment — a lawyer, who thinks this is all much simpler than I do — keeps telling me that I am just looking for a permission structure that will let me like the things I already like. Here are the verdicts, in roughly the order we encountered them.

  A district engineer accepts, at the close of a project, a hand-woven rug from the women's association in the village whose borewell she connected: fine, and I would go so far as to say that refusing it would itself have been a kind of offence. The same engineer, six months earlier, accepted an all-expenses-paid week at a technical conference in a coastal resort, paid for by the pump supplier then bidding on the next tender: not fine, obviously. But the same supplier has been paying the conference fees of the utility's engineers for fifteen years, everyone knows it, the training is genuinely good, and nobody involved thinks it has changed a single decision — I still say not fine, though I notice I cannot explain why the longevity and transparency of the arrangement should not make it better rather than worse. A council chairperson steers a small maintenance contract to his brother-in-law's firm, at market price, the work is good, and the relationship is declared in the minutes: bad practice, I'd say, but not corruption. Exactly the same facts with a large pipeline contract instead of a small maintenance one: corruption. I am aware that scale is doing unexplained work here and I don't know whether that is a real feature of the concept or an inconsistency I should eliminate. A ward member spends his discretionary development fund almost entirely in the two wards that voted for him: not corruption, that is simply what being elected means. The same ward member does the same thing after promising before the election that he would do it: still not corruption, and arguably better, because now it is honest — which I recognise sits badly with any general condemnation of clientelism. A headteacher takes an envelope of cash from a parent whose child is next on the waiting list for the last available place: corruption, unambiguously, no hedging. A headteacher accepts a donated computer laboratory from the parents' association, whose chair happens to be a parent whose child then gets that last place: not corruption, because the benefit went to the school rather than to her — but this is the verdict I trust least, since everyone knows what the lab was for. A clinic doctor moves an old schoolfriend up the queue: not corruption. The same doctor moves up the local councillor who can get the clinic a generator: corruption. And a judge on a customary land tribunal receives, according to long-standing local practice, a token payment in kind from litigants on both sides: not corruption, and I would push back hard on anyone who said otherwise — yet the moment one side gives more than the other, or gives before the judgment rather than after it, I am ready to call it corruption, and I cannot say what does the work in that distinction.

  My tentative principle, such as it is, runs something like this: an officeholder acts corruptly when she converts the impartial authority of her office into private advantage for a particular party, where "private" is meant to exclude benefits accruing to the community to which the officeholder is answerable. It fails on at least three of the cases above. The rug is a private advantage to the officeholder and yet seems permissible; the discretionary fund is an advantage to a community and yet looks like textbook clientelism to most people who write about this; the customary token is given to the judge personally and is nonetheless, I insist, not corruption. So I would like the principle tested and rebuilt rather than defended. Specifically: state one principle, or a small set of competing candidates, precisely enough that I could tell whether a new case falls under it, and go clause by clause saying which of my verdicts motivated each clause and what that clause does. Then tell me whether a single principle can deliver all of these verdicts or whether what I need is a two-part account — one part about the office and its norms, another about the transaction — and if it is two parts, say where the seam runs. Apply the result to cases I have not listed, and in particular to these two: the district engineer leaves the utility and takes a job at the pump supplier two years after her last tender decision, and a supermarket buyer accepts the same coastal-resort conference from a supplier, where there is no public office anywhere in the story but I still feel something has gone wrong, though perhaps not the same something. Finally, be straight with me about the cost. If a simple principle is available that gets most of my verdicts, name the ones it forces me to give up, and say whether the pairs I flagged — small contract versus large contract, envelope versus computer lab, token given after judgment versus token given before — are places where my intuitions are tracking a real distinction in the concept, or places where I am rationalising. I am less interested in what the code should say than in what I am committed to, and I would rather be told that two of these verdicts cannot both survive than be handed a baroque principle that saves everything at the price of saying nothing.
reasoning: |-
  Hmm, this is a fascinating and complex ethical puzzle. The user is grappling with real-world integrity dilemmas in their work with a water utility, and their frustration with inconsistent gut reactions is palpable. They've presented a series of concrete cases where their intuitive judgments seem contradictory, and they're wisely resisting the urge to create a "permission structure" that simply rationalizes pre-existing preferences.

  The core tension here is between formalism (clear rules) and contextualism (nuanced judgment). Their lawyer colleague represents the former approach, while the user instinctively senses that corruption isn't just about breaking rules but about violating the spirit of an office's purpose. The cases cluster around several recurring themes: gifts vs bribes, scale effects, community benefits vs personal gain, and cultural embeddedness.

  What stands out is how contextual their judgments are. The rug from villagers is acceptable because it's symbolic gratitude after service, not transactional. But the conference trip crosses the line because it's an ongoing relationship with a bidder. The headteacher's cash envelope feels corrupt while the computer lab doesn't - even though both secure admission - because the latter has plausible deniability through institutional benefit. This suggests their intuition is tracking something about the performative nature of corruption: whether the act maintains the appearance of impartiality.

  The customary tribunal payment case is particularly revealing. Their acceptance of symmetrical post-judgment tokens shows respect for local norms, while rejecting asymmetrical or pre-judgment payments indicates an underlying concern for actual influence. This points to a dual criterion: both the objective structure of the exchange AND its alignment with institutional purpose matter.

  For the integrity code, they'll need to balance several dimensions: personal vs community benefit, transaction timing relative to decision-making, cultural legitimacy, and scale proportionality. The "pump supplier job after two years" case will test their stance on revolving doors, while the "supermarket buyer" scenario forces consideration of whether corruption is uniquely a public-sector concern. Their discomfort with the latter suggests they sense that any position of trust creates fiduciary duties, not just government roles.

  Ultimately, their judgments reveal an implicit theory where corruption occurs when: (1) the benefit is particularized (targeting specific outcomes), (2) the officeholder has discretion over those outcomes, and (3) the exchange undermines the office's core purpose. The cases they struggle with are ones where these elements are in tension - like the ward member's discretionary funds, which are inherently particularistic by design. That's not inconsistency; it's recognizing that some roles legitimately permit favoritism while others don't.
answer: |-
  Based on your cases and your commitment to intellectual honesty, here's a principle that captures *most* of your verdicts, identifies where your intuitions need refinement or sacrifice, and acknowledges necessary distinctions:

  **The Principle of Institutional Fiduciary Integrity:**

  An officeholder acts corruptly when they **subvert the core purpose or impartial function of their office** by granting a **discretionary advantage** (favor, decision, resource access) in a way that **undermines public trust in the institution's essential fairness**, where:
      a)  The advantage is granted to a **specific beneficiary** (person or entity), and
      b)  The officeholder **knowingly accepts or creates a linkage** between the advantage granted and a **personal benefit** (tangible or intangible, present or future) *for themselves or their close associates*, OR where the transaction inherently creates a reasonable perception of such linkage due to its nature/timing/scale.

  **Breaking Down the Principle Clause-by-Clause with Your Cases:**

  1.  **"Subvert the core purpose or impartial function of their office":**
      *   *Motivated by:* Headteacher moving child up list for cash (subverts fair admissions), Doctor moving councillor for generator (subverts medical need queue), Judge accepting pre-judgment/unequal payment (subverts impartial justice), Council chair steering large contract to relative (subverts procurement integrity). District Engineer accepting conference trip from bidder (subverts impartial procurement function).
      *   *What it does:* This is the fundamental harm. Corruption damages the *institution's reason for existing*. It's not just about private gain; it's about perverting the office's duty.

  2.  **"Undermines public trust in the institution's essential fairness":**
      *   *Motivated by:* All "corruption" verdicts. This captures the systemic harm and the *appearance* aspect crucial in public office. It explains why the *transparency* of the conference trip doesn't make it better – it *reinforces* the perception of improper linkage, eroding trust. It also explains why the large contract nepotism is worse than the small one – the *scale* amplifies the perception of unfairness and systemic risk. (Scale *is* relevant when it impacts trust/risk).
      *   *What it does:* Addresses the societal/public interest dimension. Even if no *actual* decision changes (conference trip), the *perception* of impropriety damages the institution.

  3.  **"Granting a discretionary advantage":**
      *   *Motivated by:* District Engineer connecting borewell (discretion in execution/timing?), Headteacher admitting child, Doctor moving patient, Council chair awarding contract, Judge ruling. Ward member spending fund (discretion inherent in the fund).
      *   *What it does:* Focuses on where the officeholder has power to confer benefits or make decisions impacting specific parties.

  4.  **"To a specific beneficiary":**
      *   *Motivated by:* Contrasting the rug (gratitude for service rendered *generally*, beneficiary is *village*) vs. the cash envelope/computer lab/queue jump (benefit to *specific child*). Ward member spending in specific wards (specific beneficiaries: voters in those wards).
      *   *What it does:* Excludes generalized benefits to the community the office serves (like the rug, or arguably the computer lab *on its face*).

  5.  **"Knowingly accepts or creates a linkage... to a personal benefit":**
      *   *Motivated by:* Headteacher cash (explicit linkage), Doctor moving councillor (linkage: generator for clinic = professional benefit?), Conference trip (benefit = trip, linkage implied by bidder status), Judge accepting unequal/pre-judgment payment (linkage clear). *Contrast:* Rug (benefit, but no linkage to a *specific discretionary act* for that villager), Doctor moving friend (benefit? unclear direct *personal* gain, perhaps just friendship), Token payment after judgment (benefit, but culturally severed from decision).
      *   *What it does:* This is the "conversion" element. It requires a connection between the favor granted and the benefit received *by the officeholder or close associates*. "Knowingly" adds the mental state.

  6.  **"OR where the transaction inherently creates a reasonable perception of such linkage":**
      *   *Motivated by:* Conference trip (even if no decision changes, the perception is inherent), Headteacher computer lab (perception of linkage is strong, even if benefit is to school), Council chair steering *large* contract to relative (scale/perception), Judge accepting pre-judgment payment (timing creates inherent perception).
      *   *What it does:* Catches situations where the *appearance* is so damaging to trust that it constitutes corruption regardless of provable intent or direct linkage, especially given the officeholder's position. This is crucial for public institutions.

  **Can One Principle Deliver All Verdicts? The Need for Two Parts:**

  The principle above *mostly* works, but it inherently **requires a two-part account**:
  1.  **The Office & Its Norms (The "Institutional Fiduciary"):** Defines the core purpose, the nature of its discretion, and the essential fairness it must uphold. This determines *what counts as subverting its function* and *what level of perception undermines trust*. (e.g., Judge vs. Ward Member vs. Headteacher have different core functions and norms).
  2.  **The Transaction:** Analyzed against the specific office's norms using the criteria above (advantage, beneficiary, linkage/perception, benefit).

  **The "Seam":** The definition of "core purpose," "essential fairness," and "reasonable perception" *depends entirely on the specific office and its context*. A gift acceptable for a village engineer might be unacceptable for a procurement officer. Discretionary spending *is* the purpose of the ward member's fund, changing the analysis. Cultural norms (like the token) define what severs the linkage.

  **Applying to New Cases:**

  1.  **District Engineer leaves for Pump Supplier (2 years later):**
      *   *Analysis:* Timing (2 years) helps sever direct linkage to a *specific* decision. However, does it undermine trust in the *institution's* impartiality? Was she involved in setting specs for future bids? Did she gain unique insider knowledge? The core risk is that the *prospect* of future employment influenced decisions while in office ("revolving door"). **Verdict:** Not *necessarily* corrupt under the strict principle *if* there's a clean break and no evidence of prior understanding. *However,* it creates a *strong perception* problem. A robust integrity code would likely mandate a longer cooling-off period (e.g., 3-5 years) to *prevent* the perception and potential linkage. **Cost:** Strict application might say "not corruption," but good policy says "prohibit or restrict due to inherent perception risk."

  2.  **Supermarket Buyer accepts Conference Trip:**
      *   *Analysis:* There is no "public office." The core purpose is profit for the supermarket, not impartial public service. The "essential fairness" relates to shareholders/customers getting best value, not democratic legitimacy. Accepting lavish trips *could* subvert this purpose if it leads to favoring suppliers offering perks over those offering better prices/quality. It inherently creates a perception that decisions aren't made purely on merit. **Verdict:** While not *public corruption*, it likely violates a **fiduciary duty** to the employer (supermarket) and constitutes a **conflict of interest**. It's a breach of trust within the private commercial relationship. The "something wrong" is different: breach of commercial fiduciary duty/conflict, not subversion of public institutional integrity. Your principle correctly distinguishes this.

  **The Cost: What You Must Give Up or Refine**

  A simple principle capturing *all* your intuitions perfectly isn't possible without contradiction. Here's the cost:

  1.  **Ward Member's Discretionary Fund:** Your verdict ("not corruption, that's what elected means") is defensible *under this principle* **if** the core purpose/expectation of that fund *is* to deliver particularized benefits to constituents, even unevenly based on support. It's clientelism, but it might be functioning *as the system expects*. However, if the core purpose is *equitable* development across the district, then spending only in supportive wards *does* subvert that purpose and undermine trust in fairness for non-supporters. **Cost:** You must decide the *core purpose* of that fund. If it's inherently clientelistic, your verdict stands. If it's meant for equity, you must call it corruption. Your intuition likely tracks the former.
  2.  **Headteacher's Computer Lab:** Your gut is right. Under the principle, the *perception* linkage is inherent and strong. The benefit *to the school* is real, but the *specific discretionary act* (admitting the chair's child) is granted to a specific beneficiary *contemporaneously*. This *inherently creates a reasonable perception of linkage* to a benefit for the headteacher (maintaining good relations with influential parents, avoiding conflict, perhaps personal gratification). **Cost:** You must likely call this **corruption** under the principle. Refusing the lab might be impractical, but accepting it *while* making that specific admission decision creates the problematic linkage. Transparency doesn't fix the perception.
  3.  **Small vs. Large Contract Nepotism:** Your distinction is valid under "undermining public trust." Steering a large contract creates a much greater perception of systemic risk and unfairness than a small maintenance job. The *scale* amplifies the harm to institutional trust. **Not rationalizing - tracking a real distinction in impact.**
  4.  **Token Payment After vs. Before/Unequal:** Your distinction is valid. Payment *after* judgment, equally, within cultural norms, severs the linkage to the decision. Payment *before* or *unequal* inherently creates the perception (and potential reality) of linkage to the decision, subverting impartiality. **Not rationalizing - tracking a crucial distinction (timing/perception).**
  5.  **Doctor Moving Friend:** This is the hardest for the principle. If there's no clear *personal benefit* beyond friendship satisfaction (no generator, no cash), and medical need isn't severely compromised, does it *subvert the core purpose* enough? Your "not corruption" verdict might stand if it's a minor, infrequent act. But if it undermines trust in the queue system significantly, it could qualify. **Cost:** You might need to accept this as a borderline case or refine "personal benefit" to include intangible personal preferences influencing decisions against institutional rules.

  **Conclusion and Recommendation:**

  Your intuition is remarkably consistent in tracking **institutional subversion** and **perception of impropriety**, not just personal gain. The proposed principle formalizes this, but requires acknowledging:
  *   **Cost 1:** The Computer Lab case is likely corrupt under this principle due to inherent perception.
  *   **Cost 2:** The Ward Member case depends entirely on defining the fund's *core purpose*.
  *   **Clarification:** Distinctions based on Scale (contract size), Timing (token payment), and Cultural Context (token) are valid and incorporated.

  **For the Integrity Code:** Focus on preventing actions that **create conflicts between personal interests and institutional duties** and **undermine public trust in fairness**. Specifically prohibit:
  1.  Gifts/hospitality from current/potential contractors above token value.
  2.  Participation in procurement decisions involving close associates/family (with clear thresholds for "close" and contract value requiring recusal).
  3.  Accepting benefits linked to specific discretionary decisions.
  4.  Post-employment moves to key suppliers without a significant cooling-off period.
  5.  Using discretionary funds in ways that blatantly contradict their stated equitable purpose.

  **Acknowledge context:** Explicitly state that tokens of gratitude for service rendered (like the rug) are acceptable if modest, given openly, not linked to a specific pending decision, and culturally appropriate. Endorse the customary tribunal practice *only* if strictly post-decision, equal, and symbolic.

  This approach accepts that some intuitive distinctions are real (scale, timing) while requiring you to sacrifice the verdict on the Computer Lab and be precise about the Ward Member's fund. It provides clear guidance without being baroque. Good luck!
