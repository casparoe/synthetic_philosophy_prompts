  The user is questioning whether the determinism part is incorrect. They're right—Strawson's argument is meant to work irrespective of determinism. The core issue is the need to be causa sui, which is impossible. The essay's mention of determinism ruling out an infinite regress might misrepresent Strawson's position. I should clarify that the regress isn't about choices per se but about the conditions for being truly responsible for one's character.

  The user also asks about the scope of "how you turned out." Strawson limits this to the constitutive aspects of the self—character, motives, etc. The essay might be too vague here, not specifying that it's about the deep self, not just circumstantial actions. 

  Another point is whether Strawson recommends reforming blame and resentment. The essay says he suggests abandoning them for therapeutic management. While Strawson does discuss reactive attitudes, he doesn't push for reform, acknowledging they're natural. The user wants to know if he distinguishes between true moral responsibility and other notions. Strawson does accept practical responsibility but rejects ultimate moral responsibility.

  The user mentions compatibilists defining moral responsibility differently. Strawson's argument targets libertarian free will, so compatibilists might feel it's a straw man. The user might need this distinction to engage in debates or academic work. They’re likely looking for a clear critique to use against compatibilist objections.

  Assessing the dialectical force: the argument shows that ultimate responsibility requires impossible self-creation. But compatibilists redefine responsibility without that requirement. The user’s deeper need might be understanding if Strawson's argument holds against compatibilism. The answer is that it challenges libertarian views more effectively, while compatibilists can reject the premise that responsibility needs ultimate self-creation.

  The user’s identity could be a student or academic in philosophy, trying to parse arguments accurately. They want to avoid misrepresenting Strawson while critiquing the essay. Their unspoken need might be to confidently discuss the argument's strengths and weaknesses, especially against compatibilism, for a paper or discussion.
answer: |-
  Here's a claim-by-claim breakdown of the magazine summary against Galen Strawson's actual "Basic Argument" (primarily from his papers like "The Impossibility of Moral Responsibility" and "Free Will"):

  1.  **"Strawson's point is that you can only be morally responsible for what you do if you are responsible for how you turned out."**
      *   **Strawson's Endorsement:** **Yes, but with crucial restriction.** Strawson *does* argue that to be *ultimately* morally responsible for an action (MR), you must be responsible for the "core" self (character, motives, values, personality) from which that action flows. He restricts "how you turned out" to these *constitutive* aspects of your self – the "mental set" that determines your choices and actions in given circumstances. He *isn't* demanding responsibility for *all* contingent life circumstances or accidents of birth in the same absolute way.

  2.  **"Everything you do flows from your character and your circumstances, and you chose neither."**
      *   **Strawson's Endorsement:** **Yes, essentially.** This is a core premise. Your actions result from 1) your character (which you did not originally choose or create) and 2) the circumstances you find yourself in (which you also did not ultimately choose). This holds true regardless of determinism or indeterminism.

  3.  **"To be responsible for yourself you would have to have created yourself..."**
      *   **Strawson's Endorsement:** **Yes.** This is the heart of the argument. To be responsible for the constitutive self (point 1), you would need to be *causa sui* (self-caused). This is Strawson's key demand for *ultimate* moral responsibility.

  4.  **"...which would mean an endless chain of prior choices, each made by an earlier self you never picked..."**
      *   **Strawson's Endorsement:** **Simplified, but captures the core.** Strawson *does* argue that self-creation requires an impossible infinite regress: to create yourself (Self 1), you must already exist with some nature (Self 0) to do the creating, but then you aren't responsible for Self 0. Trying to make Self 0 responsible requires a prior Self -1, and so on *ad infinitum*. The key point isn't the infinite regress *itself* as the fatal flaw, but rather that the regress demonstrates the *impossibility* of true self-creation (*causa sui*) because *something* must be given, un-chosen, to start the process. The regress is the *reductio ad absurdum* proving self-creation is incoherent.

  5.  **"...precisely what determinism rules out."**
      *   **Strawson's Endorsement:** **No, this is a significant distortion.** **This is the user's main suspicion, and it's correct.** Strawson **explicitly insists** his argument works **whether determinism is true or false.** The problem isn't determinism; it's the impossibility of *causa sui* under *any* metaphysical conditions. If indeterminism is true, your character/motives might involve random events, but you are no more responsible for *that* randomness than for deterministic causes. You still didn't *create* the self that acts. Determinism is irrelevant to the core argument.

  6.  **"Since nothing can be its own cause, no one is ever truly morally responsible."**
      *   **Strawson's Endorsement:** **Yes, precisely.** This is the core conclusion: Ultimate or True Moral Responsibility (UMR/MR) requires *causa sui*, which is impossible. Therefore, no one is *truly* or *ultimately* morally responsible.

  7.  **"The consequence, Strawson says, is that we should abandon blame and resentment altogether and replace them with something like the therapeutic management of dangerous people..."**
      *   **Strawson's Endorsement:** **Partly, but overstated.** Strawson *does* argue that the *rational justification* for reactive attitudes like blame, resentment, indignation, and (crucially) *moral* praise and *moral* desert-based punishment evaporates if UMR is impossible. He sometimes discusses the *practical* necessity of managing harmful behavior through non-retributive, therapeutic, or protective means. **However:**
          *   He does **not** present this as a straightforward policy recommendation society *should* or *could* easily implement.
          *   His focus is on the *logical consequence* for the *justification* of reactive attitudes, not a detailed blueprint for social reform.
          *   He explicitly distinguishes *moral* blame/retribution (based on desert) from other forms of response (like holding accountable, deterring, protecting, rehabilitating). He's primarily arguing against the *desert* component.

  8.  **"...a shift he concedes we could never actually pull off, because, as Hume showed, our reactive attitudes are natural and inescapable."**
      *   **Strawson's Endorsement:** **Yes, accurately attributed.** Strawson *does* explicitly concede that abandoning reactive attitudes wholesale is psychologically impossible for humans. He draws heavily on P.F. Strawson (his father) and Hume to emphasize that these attitudes (like resentment, gratitude, forgiveness) are deeply ingrained, natural human responses to the perceived intentions and attitudes of others towards us. We cannot simply reason ourselves out of feeling them, even if their ultimate *moral* justification is undermined. He often calls this the "affective" or "psychological" impossibility of giving them up.

  **Strawson's Distinction Between Types of Responsibility:**

  *   **Ultimate Moral Responsibility (UMR/MR):** This is what the Basic Argument targets. It requires being *truly deserving* of blame or praise in a deep, non-consequentialist, non-forward-looking way *because* you were the *ultimate originator* of your action via being *causa sui*. Strawson argues this is impossible.
  *   **Practical/Causal/Forward-Looking Responsibility:** Strawson *accepts* these notions. We can be held *causally* responsible for outcomes. We can be held *practically* responsible (e.g., parents for children, citizens for laws). We can design systems for *forward-looking* purposes like deterrence, protection, rehabilitation, or moral education. He does *not* argue we should abandon these concepts or practices; he argues we should abandon the *retributive desert* component justified by UMR.

  **Assessing Dialectical Force Against Compatibilism:**

  The Basic Argument poses a **serious, fundamental challenge** to compatibilism, but its effectiveness depends on the compatibilist's starting point:

  1.  **Strength Against Libertarian Compatibilism:** It devastatingly undermines libertarian accounts that try to ground UMR in indeterminism or agent-causation. It shows they still require the impossible *causa sui*.
  2.  **Strength Against Standard Compatibilism:** It forces compatibilists to explicitly reject Strawson's core premise: that UMR requires being *causa sui* or responsible for one's constitutive self. Strawson argues this *is* what true moral responsibility *means*. Compatibilists counter that this is an unrealistically demanding, "hyperbolic" definition (Dennett's term) that doesn't reflect our actual practices and conceptions of responsibility.
  3.  **The Core Dispute - Defining MR:** The dialectical force hinges on this definitional clash:
      *   **Strawson:** "True MR *just is* UMR requiring *causa sui*. Since that's impossible, true MR doesn't exist."
      *   **Compatibilist:** "You've defined MR out of existence by setting an impossible standard. Our concept of MR is different and achievable: it involves reasons-responsiveness, identification with motives, fair opportunity to avoid wrongdoing, etc., *without* needing *causa sui*."
  4.  **Strawson's Response:** He argues the compatibilist notions are *not* genuinely *moral* responsibility in the deep, desert-entailing sense people intuitively care about (e.g., when feeling deep resentment or thinking someone *truly deserves* hell). He claims compatibilism offers a "panicky" redefinition (Pereboom) that fails to capture the core of what we mean by being *truly* blameworthy or praiseworthy.
  5.  **Assessment:** The argument has **significant dialectical force** because:
      *   It exposes a deep intuition about responsibility requiring ultimate authorship.
      *   It shows that indeterminism doesn't solve the problem.
      *   It forces compatibilists to defend why their (less metaphysically demanding) conception *should* count as genuine *moral* responsibility, especially concerning desert and retribution. However, it **does not decisively refute compatibilism** because compatibilists can (and do) successfully argue that Strawson's definition of MR is *not* the only coherent or practically relevant one, and that their accounts *do* capture important aspects of our responsibility practices and moral emotions *without* the impossible metaphysics. The battle largely becomes one over the *correct analysis* of our concept of moral responsibility.

  **In Summary:** The magazine essay captures the core structure of the Basic Argument but significantly distorts it by making determinism essential. Strawson's argument is explicitly designed to work against *any* metaphysical backdrop. The demand for responsibility "for how you turned out" is restricted to the constitutive self. The infinite regress is a consequence demonstrating the incoherence of *causa sui*, which is the true target. Strawson argues the *justification* for desert-based blame/punishment and reactive attitudes like resentment is undermined, leading to a *logical* case for abandoning them in favor of forward-looking management, but he fully acknowledges the psychological impossibility of doing so, crediting Humean insights. The argument's force against compatibilism lies in challenging the very definition of moral responsibility, exposing a deep tension between our intuition of ultimate authorship and what is metaphysically possible.
