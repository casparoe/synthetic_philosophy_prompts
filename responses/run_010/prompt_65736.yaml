prompt: |-
  I am co-teaching an upper-level undergraduate seminar on moral responsibility this term, and I need a matched pair of cases on the doctrine of double effect that my students cannot pattern-match. Every one of them has already met the trolley, the transplant surgeon, and the strategic bomber, and my colleague — a consequentialist who has promised to attack whatever I bring — has pointed out, fairly, that in most textbook versions the case has been narrated so that the intended verdict is simply announced rather than generated. So I want the pair set somewhere mundane and institutionally detailed. I had in mind a wildland fire incident commander trying to keep a fire out of a town, though I am open to a comparable civilian setting provided it is not medical triage, not military, and not a trolley wearing a costume. The two cases must involve exactly the same harm falling on exactly the same private party — say, the same acreage of a farmer's standing crop and the same equipment shed — and must deliver exactly the same benefit to exactly the same number of people, so that no arithmetic asymmetry and no difference in proportionality is available to do any of the work. The only intended difference is structural: in the first case the destruction of the property is part of what brings about the good, since a fuel break works precisely because the fuel is removed; in the second, an identical amount of destruction is a byproduct that contributes nothing to the outcome, as when the crew reaches a natural firebreak by another route and the same crop and shed are lost under heavy equipment on the way there.

  The design constraints I care about most are these. First, the difference has to fall out of the causal and institutional structure of the two scenarios; you may not simply tell us in the narration that one commander intends the damage and the other merely foresees it, because that is the move that makes classroom versions of the doctrine feel rigged. If you characterize the agents' deliberation at all, do it through what each would do given an available alternative, and make sure both commanders pass the counterfactual test in the same way: each would gladly forgo the damage if it could be avoided at no cost to the operation. I want that symmetry to be visible, because it is what forces the analysis to say something other than "he would have avoided it if he could." Second, hold fixed everything else that might contaminate the comparison — the same warnings issued to the owner, the same attempt to reach him by radio, the same offer of compensation afterward, the same risk borne by the crew, the same confidence in the weather forecast, the same legal exposure. Third, tell me honestly whether the redescription strategy — the objection that the first commander can always describe his intention more narrowly, as removing combustible material rather than ruining this person's livelihood — collapses the pair, and if it does collapse them, say so rather than quietly engineering around it.

  For the deliverable: the two cases in plain prose, no more than about two hundred words each and written so they could be handed out cold; then a walkthrough identifying which condition of the doctrine is doing the discriminating work in each case and why the remaining conditions are silent or equally satisfied; then a diagnosis of which single feature of the first case carries the weight, what happens to the analysis if that feature is removed, and the smallest realistic modification that would flip a double-effect theorist's verdict. Close with the strongest objection a skeptic of the doctrine would press against this specific pair — the objection that the distinction is a rationalization constructed after the fact by an agent who wants to be seen doing something rather than merely permitting it — and the best reply a defender can make without smuggling in facts about the setting that the cases do not already contain.
reasoning: |-
  We are constructing a matched pair of cases for the doctrine of double effect (DDE). The key is to have two scenarios that are identical in all respects except the structural role of the harm (destruction of property) in achieving the good outcome (saving the town). In the first, the harm is a means to the end (the fuel break requires the removal of the combustible material, which is the crop and shed). In the second, the harm is a foreseen but unintended side effect (the same destruction occurs incidentally while taking a different route to a natural firebreak).

  Constraints:
  - Same harm: same farmer's crop and equipment shed destroyed.
  - Same benefit: same town saved, same number of people.
  - Symmetry in counterfactuals: both commanders would avoid the damage if they could without compromising the operation.
  - All other factors fixed: warnings, attempts to contact, compensation, crew risk, weather, legal exposure, etc.
  - No medical, military, or trolley variants; mundane institutional setting (wildland firefighting).

  We must avoid announcing the intention; it must emerge from the causal structure.

  Case 1: The Fuel Break Case
  - The fire is threatening a town. The incident commander orders a fuel break to be created by bulldozing a strip of land that includes the farmer's crop and shed. The fuel break is placed precisely to stop the fire. The removal of the fuel (crop and shed) is what makes the break effective. Without removing that fuel, the break would not work. The commander knows that the farmer's property is being destroyed and regrets it, but it is necessary for the break. The commander would have avoided it if, say, the farmer had already harvested and removed the crop (but that is not the case).

  Case 2: The Alternate Route Case
  - The fire is threatening the same town. The commander knows of a natural firebreak (like a river) that can be used. However, to get the bulldozers and crew to that natural firebreak in time, they must take the shortest route, which goes through the same farmer's crop and shed. The commander orders the crew to take this route, knowing that it will destroy the crop and shed. The destruction does not contribute to the firebreak; it is merely a consequence of the movement. The natural firebreak (the river) is what stops the fire. The commander would have avoided the damage if there had been a clear road (but there isn't).

  In both cases, the harm is the same, the benefit is the same, and the commander would have avoided the damage if it were possible without compromising the mission.

  Now, for the doctrine of double effect (typically four conditions):
  1. The act itself must be morally good or neutral.
  2. The agent must intend only the good effect and not the bad effect (the bad effect may be foreseen but not intended).
  3. The bad effect must not be a means to the good effect.
  4. There must be proportionality between the good and bad effects (here, same proportionality so it doesn't do the work).

  In our pair, the key condition that discriminates is condition 3: in the first case, the bad effect (destruction) is a means to the good effect (it is the removal of fuel that stops the fire). In the second case, the bad effect is not a means; it is a side effect of getting to the natural firebreak.

  Condition 1: The act in both cases is the same type (ordering bulldozing) and is morally neutral (it's a standard firefighting technique). Condition 2: We have set up the counterfactual to show that neither commander intends the harm for its own sake. Both would avoid it if they could. Condition 4: Proportionality is the same in both (same harm, same good). So condition 3 is the discriminator.

  Redescription challenge: Can the first commander say, "I don't intend to destroy the crop; I intend to remove combustible material, and it just so happens that the combustible material is the crop"? But note: the combustible material is the crop. So in removing the combustible material, he is necessarily destroying the crop. The intention is to remove that very material (which is the crop). The defender of DDE would argue that the intention is directed at the removal of the crop as a means to the break. The skeptic might say that the commander can describe his intention as "creating a fuel break" without any direct reference to the destruction of property. However, in the DDE framework, if the removal of the crop is an essential part of the plan (without which the break wouldn't work), then it is intended as a means. In the second case, the destruction is not part of the plan; it's an unavoidable consequence of movement.

  Does the redescription collapse the pair? I don't think so. The DDE draws a line between what is intended as a means and what is merely foreseen. In the first case, the removal of the crop is intended because it is the means by which the break is created. In the second, the destruction of the crop is not intended because it is not part of the means to the firebreak (the natural break is the means) but is a side effect of getting there.

  But note: the commander in the first case might say, "I don't intend the destruction of the crop per se; I intend the removal of fuel, and that removal happens to destroy the crop." However, the removal of the fuel is the destruction of the crop. The two are identical. So he does intend the destruction of the crop as a means. In the second case, he does not intend the destruction of the crop at all; he intends to move the bulldozers, and the destruction is a side effect.

  The smallest realistic modification to flip the verdict: Suppose in the first case, the commander could create the fuel break without destroying the shed (maybe the shed is metal and not combustible) but still needs to destroy the crop. Then if he destroys the shed anyway (because it's in the way of the dozer path), that would be a side effect. But that's not the same harm. Alternatively, to flip the first case to be like the second: if the commander could create the fuel break by cutting the crop and baling it (so it's removed but not destroyed) and then selling it, but that's not possible because of time. We want the same harm.

  Alternatively, flip the verdict by changing the causal structure: Suppose in the first case, the commander creates the fuel break by bulldozing, but the crop and shed are not actually combustible (say, the shed is metal and the crop is green and wet) but the commander mistakenly thinks they are. Then the destruction is not necessary for the break. But then the proportionality might change because the harm is not justified by the benefit? We must avoid that.

  Alternatively, to flip the first case to be permissible under DDE: make the harm not a means. Suppose that the commander orders a firebreak that is created by bulldozing a strip of land that is entirely on public land, but then the fire jumps the break and the only way to stop it is to backburn from the break, and the backburn requires burning the farmer's crop. In that case, the destruction of the crop is a means to stopping the fire (by backburning). That would be intended. But we are trying to flip the first case to be like the second.

  Alternatively, to make the first case not intended: if the fuel break is created by removing vegetation, but the farmer's crop is not in the break line except for a small part that is unavoidable. But we want the same harm.

  Alternatively, the smallest modification: In the first case, the commander has two ways to create a fuel break: one that requires destroying the crop and shed, and one that doesn't (say, by going around the shed and leaving it, but that would leave a gap). If the commander chooses the one that destroys the shed even though there is an alternative that avoids it (but that alternative is more time-consuming and risky), then the destruction might be seen as a side effect of the chosen method. But then the harm is not necessary? We want the harm to be necessary in both cases.

  Alternatively, to flip the second case to be impermissible: if the commander in the second case could have taken a longer route that avoids the crop but chooses the shorter route to save time (and thus the destruction is not necessary). But we have set that the route is necessary to get to the firebreak in time.

  So the key feature carrying the weight is the causal role: in the first case, the harm is causally necessary as a means to the good effect (without it, the break wouldn't work). In the second, it is not (without it, the crew might not arrive in time, but the destruction itself isn't what stops the fire; it's the arrival at the natural break).

  Objection by skeptic: The distinction is a rationalization. The commander in the first case could just as well say he doesn't intend the destruction; he merely foresees it as a consequence of creating the fuel break. And the commander in the second case could be said to intend the destruction as a means to get to the firebreak quickly.

  Reply: The defender can point to the causal structure. In the first case, the destruction of the crop is a constituent part of the plan: the break is made by removing the fuel. The plan is: remove fuel (which is the crop) to create a break. In the second case, the plan is: move the crew to the river. The destruction of the crop is not part of the plan; it's an unavoidable consequence of the movement. The defender can also point to the counterfactual: if the crop were not combustible (but still destroyed by the bulldozer) in the first case, the break might still work because the ground is cleared? Then the destruction would be a side effect? But we are assuming the crop is combustible. The defender must insist on the actual causal role.

  Without the causal role of the harm as a means, the DDE would not mark a difference. If we remove that feature (say, by making the destruction in the first case not causally necessary for the break, but then the harm might not be justified), then the cases collapse.

  Now, writing the cases:

  Case 1: The Fuel Break
  The town of Millbridge is threatened by an approaching wildfire. Incident Commander Ava determines that the only way to stop the fire before it reaches the town is to create a fuel break directly in its path. The optimal location for the break runs through the property of Farmer Bell, including his mature wheat field and equipment shed. Ava orders a bulldozer crew to clear a 100-foot-wide strip, which requires demolishing the shed and plowing under the wheat. The break is successful: the fire burns up to the cleared area and dies out. Ava had attempted to contact Bell to warn him and later ensured the fire service offered compensation. She would have been relieved if Bell had already cleared the land, but he had not.

  Case 2: The Alternate Route
  The same wildfire threatens Millbridge. Incident Commander Cam knows of a natural firebreak: the Willow River, which lies between the fire and the town. However, the only accessible route for heavy equipment to reach the river in time is through Farmer Bell's property. Cam orders the bulldozer crew to take that route, knowing it will destroy Bell's wheat field and equipment shed. The crew reaches the river and successfully contains the fire there. The shed and crop are destroyed by the bulldozers' passage. Cam had attempted to contact Bell and later ensured compensation was offered. She would have taken a longer route if one existed, but none did.

  Now, the walkthrough:

  Both cases satisfy conditions 1 (the act of ordering the bulldozing is a standard and permissible firefighting tactic), 2 (neither Ava nor Cam intends the destruction of Bell's property; both would have avoided it if possible, as shown by the counterfactual), and 4 (the harm is the same and the benefit is the same, so proportionality is identical). The difference is in condition 3: in Case 1, the destruction of Bell's property is a means to creating the fuel break (without the removal of that fuel, the break would not function). In Case 2, the destruction is a foreseen side effect of the means (moving the crew to the river) but is not itself a means to the good end. The fire is stopped by the river, not by the destruction of the crop.

  The key feature carrying the weight is the causal role of the harm: in Case 1, the harm is causally necessary for the good effect as a means; in Case 2, it is causally necessary only for the efficient execution of the means (getting to the river) but not for the firebreak itself. If we remove this feature (say, by making the destruction in Case 1 not actually contribute to the break, perhaps because the crop is not combustible), then the harm would not be a means and the case would be more like Case 2. However, then the proportionality condition might fail because the harm would be gratuitous.

  The smallest realistic modification to flip a DDE theorist's verdict in Case 1 would be to alter the scenario so that the destruction of the crop is not part of the fuel break's effectiveness. For example, suppose the commander bulldozes a strip that includes Bell's field and shed, but the field is fallow and the shed is non-combustible. The break works because the ground is cleared, but the destruction of the shed and field is not necessary for the break (the break would have been just as effective if the shed were moved and the field left untouched). Then the harm would be a side effect of the bulldozing, and the case would be like Case 2. However, note that the harm is the same, but the benefit is the same, so the DDE might now permit it. But the skeptic might then argue that the harm was not necessary, so it would be impermissible on proportionality grounds. So we must be cautious.

  Alternatively, to flip the verdict without changing the harm's necessity, we could modify the intention: if Ava could create the break without intending the destruction (say, by using a method that removes the crop without destroying it, but that is not possible in the time). But that's not realistic.

  The strongest objection by a skeptic: The distinction between intending and foreseeing is not reflected in the agents' mental states but is imposed afterward to justify the action. In both cases, the commanders foresee the harm and proceed anyway. The skeptic might say that the only difference is that in Case 1, the harm is causally closer to the good effect, but that doesn't change the moral reality. The skeptic might argue that the commander in Case 1 does not intend the harm; she only intends the fuel break, and the harm is a foreseen consequence. Similarly, the commander in Case 2 might be said to intend the harm as a means to travel faster. The skeptic would say the DDE is a rationalization.

  The defender's reply: The mental state is not arbitrary; it is determined by the role of the harm in the plan. In Case 1, the harm is an integral part of the plan: the plan is to remove the fuel, and that requires destroying the crop. In Case 2, the harm is not part of the plan; it is a consequence of the plan. The plan in Case 2 is to move to the river; the destruction is a byproduct. The defender would argue that the structure of the action reveals the intention. If the harm is a means, it is intended; if it is a side effect, it is not. This is not a rationalization but a reflection of the practical reasoning.

  Without adding facts, the defender can point to the counterfactual test: if the fuel break could be created without destroying the crop (say, by magic), then Ava would do so. Similarly, Cam would avoid the destruction if she could. But in Case 1, without the destruction, the break would not work. So for Ava, the destruction is not just foreseen but required for the plan. For Cam, the destruction is not required for the firebreak (the river would work regardless) but is required only for the transportation. The harm in transportation is not the means to the firebreak; it's a cost of the means. The defender can also note that in Case 1, the harm is directly causally efficacious for the good, while in Case 2, it is not.

  This reply rests on the causal structure and the role of the harm in the plan, which is already contained in the cases.
answer: |-
  Below is a matched pair of cases designed for your seminar, adhering to your specifications. The setting is wildland firefighting, with identical harms (destruction of a farmer's 10-acre wheat field and equipment shed) and identical benefits (preventing a wildfire from reaching a town of 5,000 people). Both commanders issue warnings via radio and landline, fail to reach the farmer, offer identical compensation afterward, face the same legal exposure, and bear identical risks to their crews. Crucially, both would avoid the damage if it were possible without compromising the operation—but it is not. The difference lies solely in the causal-institutional role of the harm.

  ---

  ### Case 1: The Fuel Break
  Incident Commander Aris is coordinating the defense of Pineville against a fast-approaching wildfire. Aris orders a direct fuel break: a 300-foot-wide strip cleared of combustibles to halt the fire’s advance. The only feasible location runs through Farmer Bell’s property, requiring bulldozers to demolish Bell’s wheat field and equipment shed. The break succeeds because the fire consumes all fuel up to the cleared strip and extinguishes. Aris’s plan relies on the removal of Bell’s crops and shed as combustible material; without their destruction, the break would be ineffective. Aris radios Bell repeatedly, documents the attempts, and later authorizes compensation. Aris would have spared Bell’s property if an alternative break location existed, but none did.

  ### Case 2: The Access Route
  Incident Commander Cass is defending Pineville from the same wildfire. Cass identifies a natural firebreak—a rocky ridge—that can contain the fire if reinforced. The quickest route for bulldozers to reach the ridge crosses Farmer Bell’s property. Cass orders crews to take this path, knowing it will destroy Bell’s wheat field and equipment shed. The ridge is reinforced and stops the fire. The damage to Bell’s property occurs during transit but contributes nothing to the firebreak’s effectiveness; an unimpeded path would have achieved the same result. Cass radios Bell repeatedly, documents the attempts, and authorizes compensation. Cass would have avoided Bell’s land if a clear road existed, but none did.

  ---

  ### Walkthrough: Doctrine of Double Effect (DDE) Conditions
  The DDE traditionally requires four conditions for an act with both good and bad effects to be permissible:  
  1. **The act itself is morally permissible** (neutral/good).  
     - Satisfied equally: Both cases involve standard firefighting tactics (bulldozing) to save lives. No inherent wrongness.  
  2. **The agent intends only the good effect** (the bad effect is not intended).  
     - Satisfied equally: Both commanders foresee the harm but do not desire it. Counterfactual symmetry shows both would avoid it if possible.  
  3. **The bad effect is not a means to the good effect**.  
     - **Discriminating condition**:  
       - In Case 1 (Fuel Break), the destruction of Bell’s property *is* a means: the fuel break works *because* the crops and shed are removed as combustibles. Without their destruction, the break fails.  
       - In Case 2 (Access Route), the destruction is *not* a means: the ridge stops the fire independently; the damage is a byproduct of accessing the ridge.  
  4. **Proportionality between good and bad effects**.  
     - Satisfied equally: Identical harm (Bell’s property) and benefit (5,000 lives saved). No asymmetry to exploit.  

  **Why only Condition 3 discriminates**:  
  - Conditions 1, 2, and 4 are identical by design. Condition 3 isolates the structural difference: the causal role of the harm. In Case 1, the harm is instrumentally necessary; in Case 2, it is causally incidental. The DDE treats intended means (Case 1) as impermissible, while foreseen side effects (Case 2) may be permissible.

  ---

  ### Diagnosis: Key Feature, Removal, and Flipping the Verdict
  - **Feature carrying the weight**: The harm’s *causal role as a necessary component of the good outcome*. In Case 1, the destruction directly enables the good effect (fire containment); in Case 2, it does not.  
  - **If removed (e.g., harm is not necessary for the good effect)**: Both cases collapse into mere foresight. If the fuel break in Case 1 could work without destroying Bell’s property (e.g., if the crops were non-combustible), the harm would become a side effect, aligning with Case 2. The DDE would then permit both—but this violates the constraint of identical harm.  
  - **Smallest realistic modification to flip a DDE verdict**:  
    - **For Case 1 (to permissible)**: Alter the fuel break so Bell’s crops are destroyed *incidentally* during creation. Example: Aris bulldozes a break on public land adjacent to Bell’s field, but embers ignite Bell’s crops during operations. The crops’ destruction is now a side effect (not a means), satisfying Condition 3.  
    - **For Case 2 (to impermissible)**: Make the damage *instrumental* to speed. Example: Cass’s crew must destroy Bell’s shed to build a temporary bridge for faster access. The destruction now serves as a means (bridge-building), violating Condition 3.  

  ---

  ### Strongest Skeptical Objection and Reply
  **Objection (rationalization)**: "The distinction is artificial. Both commanders foresee identical harm and proceed identically. Calling one ‘intended’ and the other ‘foreseen’ is post hoc rationalization. Aris doesn’t ‘intend’ ruining Bell; they intend a fuel break, and the damage is a foreseen consequence. Cass ‘intends’ destruction as a means to speed. DDE merely sanitizes the same choice: actively causing harm to save lives."  

  **Defender’s Reply (without new facts)**:  
  - The objection conflates causal roles. Intention is determined by the *plan’s structure*, not psychology. In Case 1, Aris’s plan *requires* Bell’s destruction as a subgoal: "Clear combustibles (including Bell’s property) to create a break." The harm is embedded in the means. In Case 2, Cass’s plan is "Reinforce the ridge," with harm arising en route. The counterfactual test clarifies: if Bell’s property were fireproof, Aris’s plan would fail (exposing the means), while Cass’s would succeed (exposing the side effect). This structural difference is objective, not retrospective. The DDE reflects that using a person’s loss as a tool (Case 1) violates respect for their agency, whereas foreseeable but non-instrumental harm (Case 2) does not.  

  ---

  **Honest Assessment of Redescription**: The redescription strategy ("Aris intends removing combustibles, not ruining Bell") does *not* collapse the pair. In Case 1, "removing combustibles" just *is* destroying Bell’s property—they are identical under the description of the act. Redescription fails because the intended means (removing fuel) directly and necessarily entails the harm. Case 2 lacks this entailment; Cass’s path could (in theory) avoid damage without altering the outcome. The cases are robust.
