prompt: |-
  I'm a second-year PhD student in history of science, and about a third of what I teach in my first-year seminar is claims that people call pseudohistorical — Fomenko, ancient astronauts, literal Atlantis, lost advanced civilisations. Every single year a student asks why one of these gets the label and some other thing that looks just as bad doesn't, and this year I realised I have no answer at all. I have intuitions. I'm not sure they hang together. I want to know what principle, if any, they add up to.

  Here's what I actually think, case by case:

  1. Fomenko's New Chronology — pseudohistory, obviously. He has statistical machinery, he's a professional mathematician, he has credentialed followers, he cites primary sources. None of it saves him.
  2. Von Däniken's ancient astronauts — pseudohistory.
  3. Atlantis read as a literal account of a real bronze-age island empire — pseudohistory. The same text read as a philosophical device — fine, uncontroversial, that's just reading Plato.
  4. Graham Hancock's lost civilisation — pseudohistory, even though he travels, dives on sites, and gets mainstream archaeologists to argue with him on camera.
  5. Heyerdahl: the Kon-Tiki crossing itself I think is a genuine experiment and a genuine achievement. The diffusionist thesis he built on top of it is refuted and I'd half-call it pseudohistory. One body of work, two different verdicts from me.
  6. The Vinland Map — I refuse to call this pseudohistory. It's a forgery. That's fraud, not bad theory, different category entirely.
  7. Piltdown Man — same, the hoaxer is a forger. But the professionals who accepted it for decades were credulous experts, and I don't want to call them pseudoscientists either.
  8. The Younger Dryas impact stuff: when it was proposed in journals by actual scientists with actual samples and got picked apart in the literature, my verdict is "controversial science that's mostly losing," not pseudoscience. When roughly the same claims get recycled in a streaming docuseries as proof that a comet wiped out an advanced ice-age civilisation that archaeologists are hiding, my verdict is pseudohistory. Same content! Different verdict! I can't tell if that's incoherent or if it's tracking something real.
  9. "Clovis first" in American archaeology — people who insisted nothing predated Clovis, wouldn't look at Monte Verde, made life miserable for the people excavating it. They behaved exactly like the cranks they were accusing and they were wrong. Still not pseudoscience in my book. That's dogmatic mainstream science, which feels like it should be a different failure mode.
  10. Bernal's Black Athena — loads of specific claims rejected, brutal response from professional classicists, huge public profile, politically charged. My verdict: not pseudohistory, just overreaching scholarship.
  11. My own dissertation. I'm arguing a charter in my period is misdated by a couple of generations, on the basis of a scribal hand, a formula I think shows up later than people assume, and one dendro sequence that doesn't line up. I describe it as source criticism. A friend described it as "Fomenko-lite." I want the principle to say why he's wrong, or to tell me he isn't.

  My tentative rule, which I suspect is too crude: something is pseudohistorical when its proponents have made it unfalsifiable in practice — every counter-finding gets absorbed as evidence of establishment bias — plus they invert the burden of proof, the "well, prove Atlantis didn't exist" move. Cases 5, 8, 9, 10 and 11 all strain that rule.

  What I'm after:

  - The principle, or a small set of genuinely competing candidates, stated precisely enough that I could hand it to a first-year and have them apply it without me in the room, with the case above that motivates each clause. If it has to be a cluster concept rather than one necessary-and-sufficient rule, say so and give me the cluster.
  - Which of my verdicts it forces me to give up. I'd rather lose one of them cleanly than end up with a rule that's secretly just "the ones I dislike."
  - What it says about cases I didn't list: the nineteenth-century Mound Builder theory, Velikovsky, the Black Sea deluge hypothesis used as evidence for the Noah flood, and the Kensington Runestone.
  - Whether "pseudohistory" is doing any descriptive work at all or is mostly a term of abuse, and whether case 8 (same claims, different packaging) is a bug in my intuitions or a feature the principle should be built around.

  One thing I need you to be careful about: I know there are philosophers of science who think this entire project was shown to be a pseudo-problem decades ago — Laudan's line — and others who think it's very much alive, especially where there are real-world stakes like teaching and heritage claims. I want you to seperate out for me what's settled in that literature from what's genuinely contested among people who work on it, and not to slide a contested position past me as though it were the consensus. Same for my own framing: tell me where the question as I've asked it already assumes something people disagree about.
reasoning: |-
  Okay, I need to help this history of science PhD student who's teaching a seminar and struggling with what makes something "pseudohistory." They've listed 11 specific cases with their personal verdicts and want a clear principle to distinguish pseudohistory from legitimate but controversial scholarship. 

  First, I notice they're really thoughtful about their own biases - they don't want a definition that just rubber-stamps their existing judgments. That case 8 is particularly tricky: same content being pseudohistory in a documentary but legitimate science in journals. And their friend called their dissertation "Fomenko-lite" - ouch, that's personal!

  Looking at their cases... Fomenko and von Däniken are clearly pseudohistory to them, while Bernal's Black Athena is just overreaching scholarship. Heyerdahl gets split verdicts - the raft experiment good, the diffusion theory bad. That's messy. Their tentative rule about unfalsifiability and burden of proof inversion seems useful but strains on several cases.

  Hmm... I recall Imre Lakatos's research programs in philosophy of science might help here. The core idea is that pseudohistory protects its central claims from falsification by constantly adding ad hoc hypotheses. That fits Fomenko well - any counter-evidence becomes proof of conspiracy. But does it fit Hancock? Probably, with his "archaeologists are hiding the truth" rhetoric.

  For the Vinland Map, they're right that forgery is different - it's fraud, not flawed methodology. Piltdown is similar, though the experts who believed it were just wrong, not pseudoscientists. The Clovis First people were dogmatic but still playing by scientific rules - they eventually accepted Monte Verde evidence.

  The packaging matters! Case 8 shows that identical claims become pseudohistorical when presented as proof of conspiracy against mainstream science. That's key - it's about the argumentative framing, not just content. Their intuition here is actually sharp, not incoherent.

  For their dissertation... if they're willing to adjust their thesis based on counter-evidence about scribal hands or dendro sequences, that's source criticism. Fomenko would twist any counter-evidence into confirmation. Big difference!

  I think we can build a definition with three core criteria: methodological immunity (ad hoc explanations for counter-evidence), burden of proof inversion, and conspiracy framing. When all three hit, it's pseudohistory. When one or two are present, it might just be bad history.

  This would mean their verdict on Heyerdahl's diffusion theory needs adjustment - it was falsifiable and lacked conspiracy claims, so just "refuted theory." And case 8's documentary version hits all three pseudohistory markers while the journal version doesn't. 

  On the philosophy front... Laudan did criticize demarcation projects, but in practice fields like medicine need to distinguish science from pseudoscience. For history, with real-world impacts like heritage claims, the distinction matters. So we can acknowledge philosophical debates while giving practical criteria.

  Finally for their cases... Kensington Runestone? Probably pseudohistory if proponents ignore linguistic evidence. Black Sea deluge as Noah's flood? Pseudohistory if presented as proof of Bible literalism despite evidence. Mound Builder theories? Pseudohistory when used to deny Indigenous authorship.

  Whew. This needs to be structured clearly for their students. Maybe a flowchart? No, better stick to precise criteria with examples. And emphasize that pseudohistory isn't about being wrong - it's about how you handle being wrong.
answer: |-
  Here's a precise, actionable framework for distinguishing pseudohistory from legitimate (but possibly flawed) historical scholarship, synthesized from philosophy of science/history and calibrated against your cases. It rests on **three necessary conditions** that form a "cluster" – all must be present simultaneously for a work to qualify as pseudohistorical:

  ---

  ### **The Core Principle: Pseudohistory = Methodological Immunity + Burden Inversion + Conspiracy Framing**
  A historical claim is pseudohistorical **if and only if** it systematically exhibits:
  1.  **Methodological Immunity**: Core claims are shielded from falsification by *ad hoc* explanations that **evade or redefine standard historical methods** (e.g., dismissing contradictory primary sources as "forgeries," reinterpreting inconvenient evidence as "encoded messages," ignoring chronological constraints).
  2.  **Burden of Proof Inversion**: Proponents **demand critics disprove their claims** rather than providing robust positive evidence meeting disciplinary standards ("Prove Atlantis *didn't* exist!").
  3.  **Conspiracy Framing**: Rejection by mainstream scholarship is primarily attributed to **institutional malice, dogma, or suppression** ("Archaeologists are hiding the truth!"), rather than methodological shortcomings or lack of evidence.

  ---

  ### **Application to Your Cases & Verdict Adjustments**
  | Case | Your Verdict | Framework Verdict | Why | Adjustment Needed? |
  |------|--------------|-------------------|-----|---------------------|
  | 1. Fomenko | Pseudohistory | **Pseudohistory** | ✅ Immunity (re-dates everything ad hoc), ✅ Burden Inversion (demands proof timeline is wrong), ✅ Conspiracy (scaligerian conspiracy). | None |
  | 2. Von Däniken | Pseudohistory | **Pseudohistory** | ✅ Immunity (artifacts = alien tech if not understood), ✅ Burden Inversion ("How else explain pyramids?"), ✅ Conspiracy (scientists hide alien contact). | None |
  | 3. Literal Atlantis | Pseudohistory | **Pseudohistory** | ✅ Immunity (Plato's details "symbolic" if contradicted), ✅ Burden Inversion ("Can't prove it *wasn't* real"), ✅ Conspiracy (academia ignores "obvious" evidence). | None |
  | 4. Graham Hancock | Pseudohistory | **Pseudohistory** | ✅ Immunity (absence of evidence = civilization destroyed/censored), ✅ Burden Inversion (shifts proof to critics), ✅ Conspiracy ("Archaeological establishment" suppresses truth). | None |
  | 5. Heyerdahl's Diffusionism | Half-pseudohistory | **Refuted Scholarship** | ⛔️ Immunity: Proposed testable mechanisms, accepted Polynesian settlement evidence refuted him. ⛔️ Conspiracy: No suppression claims; argued within norms. ✅ Burden Inversion? Mild, but not systemic. | **Yes.** Not pseudohistory; just wrong. |
  | 6. Vinland Map / 7. Piltdown | Forgery (Not PH) | **Forgery/Fraud** | ⛔️ Immunity/Burden/Conspiracy not inherent to *method*. Fraud is distinct category. Piltdown experts were **wrong**, not pseudoscientists. | None |
  | 8. Younger Dryas Impact (Journal) | Controversial Science | **Controversial Science** | ⛔️ Immunity: Proposed testable claims debated *within* methods. ⛔️ Burden: Defended with evidence. ⛔️ Conspiracy: No framing of suppression. | None |
  | 8. Younger Dryas (Docuseries) | Pseudohistory | **Pseudohistory** | ✅ Immunity (failed predictions = cover-up), ✅ Burden ("Prove a comet *didn't*..."), ✅ Conspiracy ("Scientists hiding lost civilization"). | None. **Feature, not bug:** Framing matters. |
  | 9. "Clovis First" Holdouts | Dogmatic Science | **Dogmatic/Flawed Scholarship** | ⛔️ Immunity: Monte Verde evidence *was* eventually accepted (slowly, painfully). ⛔️ Conspiracy: No claim of malice; argued evidence was flawed. ✅ Burden: Inverted *temporarily* (demanded excessive proof). | **None.** Dogma ≠ Pseudohistory. They operated within methodological norms (peer review, evidence evaluation), just poorly. |
  | 10. Bernal's *Black Athena* | Overreaching Scholarship | **Contested Scholarship** | ⛔️ Immunity: Specific claims (e.g., Egyptian loanwords) debated linguistically/archaeologically. ⛔️ Conspiracy: Bernal critiqued Eurocentrism, not suppression. ⛔️ Burden: Presented evidence (criticized as weak). | None. Legitimate (if flawed) challenge. |
  | 11. Your Dissertation | Source Criticism | **Source Criticism** | ⛔️ Immunity: You use standard methods (paleography, formulaic analysis, dendro) – counter-evidence *could* falsify. ⛔️ Conspiracy: Not alleging suppression. ⛔️ Burden: You bear it (presenting evidence). | **None.** "Fomenko-lite" is a bad-faith comparison. |

  ---

  ### **Unlisted Cases & the Framework**
  *   **19th C. Mound Builder Theory:** Initially **Flawed Scholarship** (racist assumptions, poor methods). If proponents *post-evidence* of Indigenous construction invoked **Immunity** ("Mounds too advanced for Natives!"), **Burden Inversion** ("Prove Natives built them!"), and **Conspiracy** ("Government hides truth!"), it becomes **Pseudohistory**.
  *   **Velikovsky:** **Pseudohistory.** ✅ Immunity (planetary orbits changed recently? Physics doesn't apply!), ✅ Burden ("Prove Venus *wasn*'t ejected from Jupiter!"), ✅ Conspiracy ("Scientists suppress catastrophism!").
  *   **Black Sea Deluge = Noah's Flood:** **Pseudohistory** if framed as *proof* of literal Bible. ✅ Immunity (dating discrepancies? "God's timeline!"), ✅ Burden ("Disprove the connection!"), ✅ Conspiracy ("Science rejects God's truth!").
  *   **Kensington Runestone:** **Forgery/Fraud.** If proponents *post-discovery* use **Immunity** (dismissing linguistic anachronisms as "medieval dialects"), **Burden Inversion** ("Prove Vikings *weren't* in Minnesota!"), **Conspiracy** ("Smithsonian hides it!"), it becomes **Pseudohistory**.

  ---

  ### **Philosophical Grounding & Caveats**
  1.  **Demarcation is Contested (Laudan vs. Others):** Laudan argued *demarcation is a pseudo-problem* – no eternal "scientific method" exists, and theories like phlogiston were "science" in their context. **Settled Point:** Rigid necessary/sufficient conditions for "science/history" *are* problematic.  
      **Active Contention:** Most philosophers (e.g., Pigliucci, Boudry) now argue **demarcation is vital pragmatically** (e.g., medicine vs. quackery, climate science vs. denial). For history, **methodological integrity** (source criticism, evidence standards) provides a workable basis for identifying *pseudohistory* as defined above – **systematic violations of disciplinary norms.** Your question assumes this pragmatic stance is valid (which many defend).
  2.  **"Pseudohistory" as Descriptive vs. Pejorative:** The framework makes it **descriptive**. It identifies a *methodological pathology*: the systematic evasion of critical scrutiny via Immunity/Burden/Conspiracy. It explains *why* these claims are rejected by professionals, not just *that* they are. It tracks a real difference: **Fomenko *cannot* be falsified; your dissertation *can*.**
  3.  **Case 8 (Packaging Matters) is a Feature:** The framework *explains* why packaging matters. The journal article engaged methods; the docuseries invoked Immunity/Burden/Conspiracy. **The core pathology is in the *argumentative strategy*, not necessarily the initial claim.**

  ---

  ### **Handout for Students: The Pseudohistory Test**
  **Is it Pseudohistory? Ask 3 Questions:**
  1.  **Does it dodge disproof?** ("That contradictory evidence is fake/a cover-up/needs a special interpretation!")
  2.  **Does it make *you* prove it wrong?** ("You can't *disprove* Atlantis, so it must be real!")
  3.  **Does it blame experts for hiding truth?** ("Archaeologists won't admit they're wrong to protect their jobs!")

  **If you answer YES to ALL THREE → It's Pseudohistory.**  
  *Why it matters:* Pseudohistory refuses to play by the rules of evidence that let us test ideas and learn from mistakes. It’s immune to facts.  
  *If it's just weird, wrong, or controversial but doesn't do these 3 things?* It might be bad scholarship, fraud, or a fringe idea – but not *pseudohistory*.

  **Examples:**  
  - **Ancient Aliens:** YES/YES/YES → Pseudohistory.  
  - **"Clovis First" Holdouts:** NO/NO/NO → Just stubborn (wrong) scholars.  
  - **Your Prof's Dissertation:** NO/NO/NO → Normal historical argument.

  This gives students a concrete, applicable tool focusing on *how claims are defended*, not their strangeness or current acceptance. It aligns with your intuitions while forcing a cleaner distinction between *being wrong* (Heyerdahl, Clovis holdouts) and *being methodologically pathological* (Fomenko, Hancock).
