prompt: |-
  I chair our university's academic integrity board — five of us, I vote too — and for two years I've been keeping a private log of the meetings where *how* we voted seemed to change the answer. My gut reactions are not consistent and I want to know what principle, if any, they add up to. No references or reading lists, I just want the reasoning worked through.

  Our standard is conjunctive. A student is responsible if (a) the work was submitted as their own, (b) a prohibited source was used, and (c) they knew or should have known it was prohibited. Then a seperate question of sanction, where an enhanced sanction applies if EITHER there's a prior finding OR there was serious harm to a third party. We usually vote element by element and then the chair applies the rule; sometimes we just vote straight up on the finding. Which we do has never been written down.

  **Case 1.** Three members sat (I recused). Votes on (a): Y, Y, N. On (b): Y, N, Y. On (c): Y, Y, Y. So every element carried, but on the straight-up question only one of the three voted responsible. We used the elements and found the student responsible. I think that was wrong — you shouldn't hand down a finding of responsibility that two of the three people on the panel voted against.

  **Case 2.** Same panel size, and as it happens the exact same pattern of votes. But here the contested element was what "prohibited source" means — specifically whether an AI writing assistant counts under a rule drafted in 2011 — and whatever we say about that carries into every later case this year. We again went element by element and again found responsibility, and I think that was right, because the interpretation is the thing we're actually authoritative about and it would be worse to publish a verdict with no majority view of the rule behind it. I notice I've just said opposite things about two identical vote patterns.

  **Case 3.** Enhanced sanction. Prior finding: Y, N, N. Serious harm: N, Y, N. On the straight-up question, two voted for the enhanced sanction and one against. I said no sanction: each of the two was relying on a different ground, and a majority of the panel rejected each ground. But a majority did think at least one of the grounds was made out, just not the same one, and I don't know why that doesn't matter to me. It doesn't, but I want to know why.

  **Case 4.** Same rule, and again no ground had a majority: fabrication Y,N,N; unauthorized collaboration N,Y,N; improper citation N,N,Y. But this time all three voted for the sanction on the straight-up question. I said that was fine and we published it. Compared with Case 3 the only difference is that it was unanimous, and I can't tell whether that's a real difference or just a feeling.

  **Case 5.** Two halves, and I judge them differently. (a) Element (c) came up, one member is a lawyer, the other two said openly in deliberation that they'd go with her, recorded Y,Y,Y. Fine by me, that's how collegial bodies work. (b) The disputed element was whether a similarity report's matches amounted to copying; the two members who aren't from CS voted Y without following the argument, the CS member voted N. Not fine — that majority was noise and it decided the case. But in (a) the "majority" was really one person plus two abstentions dressed up as votes, which is what I objected to in (b).

  **Case 6.** (a) Afterwards a member told me he'd actually thought there was harm but voted N on that element, because he knew that if it carried we'd have to find responsibility and he was against the finding. Honestly? Fine. He voted for the outcome he thought the board should reach. (b) Last year a member did the same thing but announced it at the top of the meeting — "I'm voting no on element two to kill this" — and I ruled the vote out of order and re-ran it. I still think that was right, but if it's legitimate to do it, it should be legitimate to say you're doing it, and the only thing that bothered me was the concealment. I can't defend that.

  **Case 7.** A censure motion with three live options: no action, censure, censure-plus-removal. An amendment to add removal carried 3–2, and then the amended motion lost to no-action 2–3, so we did nothing. I've since worked out on a spreadsheet that the five members' rankings form a loop, and that if I'd taken the questions in the other order we'd have ended up censuring, or censuring and removing. Everyone voted sincerely on the question in front of them each time. I said fine — amendments are how deliberation works. But I chair, and I set the order, which makes me the person who picked the outcome.

  So: is there one account of when a body should vote on its reasons and when it should vote on its result that gets all of these, or close to it? Tell me which of my verdicts it forces me to give up — I'd rather lose Case 4 than Case 1, but argue me out of that if you can. And then tell me what it says about two things coming up:

  - Next month, five members, three conjunctive elements, and from the pre-meeting I'm fairly confident each element will carry 3–2 while only one member will vote responsible on the straight-up question. Does your account make that worse than Case 1 or just the same thing bigger?
  - A member pointed out we can write our rule two ways that mean exactly the same thing: as (used a prohibited source) AND (knew or should have known), voted as two questions; or as (used AND actually knew) OR (used AND should have known), voted as two composite questions. With votes m1 = used Y, knew Y, should-have N; m2 = used Y, knew N, should-have Y; m3 = used N, knew Y, should-have Y, the first way finds responsible and the second doesn't. Same members, same rule, same votes, different answer. What should the bylaws say about that?

  Write the reasoning out in prose first — the principle, where it comes from, which verdicts break — and then give me a JSON summary with exactly these fields:

  - `principle`: object with `name` (a short label), `statement` (precise enough that I could apply it to a case I've never seen), and `clauses` (array of objects, each with `clause` and `why_needed`, the latter naming the case that forces that clause in)
  - `cases`: array, one entry per case above (use `case_id` like "5b"), each with `my_verdict`, `status` (one of `saved`, `overturned`, `reinterpreted`), and `how` (one or two lines)
  - `cannot_save`: array of case ids I have to abandon, each with a one-line reason
  - `predictions`: array with one entry for each of the two upcoming things, each with `case`, `predicted_verdict`, `reasoning`
  - `bylaw_text`: the standing rule you'd have me propose, short enough to paste into our terms of reference
  - `standard_names`: array of objects with `term` (whatever these problems are usually called) and `which_cases` — I want to be able to look these up afterwards, but don't cite anything at me now
reasoning: |-
  We are looking for a principle that explains and justifies the chair's gut reactions across the cases, and that can guide future decisions.

   The core tension: When should the board vote on the elements (the reasons) and when on the outcome (the result)? And how should votes be aggregated?

   Observing the cases:

   - Case 1: Identical vote pattern as Case 2, but the chair thinks the element-by-element vote leading to responsibility was wrong in Case 1 and right in Case 2. The difference: in Case 2 the issue was about interpreting a rule (which sets precedent) and the chair wants the rule interpretation to be clear even if the outcome is not unanimously supported by the panel.

   - Case 3: Enhanced sanction requires one of two grounds. The votes on the grounds: Prior finding (Y,N,N) -> fails; Serious harm (N,Y,N) -> fails. But on the straight-up question for enhanced sanction, two voted for and one against. The chair says no sanction because no ground had majority. But note: the two who voted for the sanction each had a reason (one for prior finding, one for serious harm) but not the same reason.

   - Case 4: Similar to Case 3 but all three voted for the sanction on the straight-up question even though each ground individually failed. The chair approved.

   - Case 5: Two subcases about delegation of judgment. In 5a, two non-experts defer to an expert on element (c) and vote Y. Chair is fine. In 5b, two non-experts (non-CS) vote Y on a technical issue without understanding, against the CS expert. Chair is not fine.

   - Case 6: Two subcases about strategic voting. In 6a, a member votes against an element to avoid an outcome he doesn't want (and does so privately). Chair is fine. In 6b, a member announces the same strategy at the meeting and the chair rules it out of order. The chair cannot defend why the announcement matters.

   - Case 7: Voting on amendments leads to an outcome that depends on the order of voting. The chair accepts it as part of the amendment process, but notes that the chair sets the order and thus picks the outcome.

   Proposed Principle:

   The principle should capture two main ideas:

   1. **The board's primary role is to make authoritative determinations on the standards and rules.** When the vote is about interpreting or establishing a rule (especially one that sets precedent), it is more important to have a clear, majority-supported interpretation of the rule than to have a majority on the outcome. This explains Cases 1 and 2.

   2. **For the outcome (finding of responsibility or sanction), the board should reflect the collective judgment of the panel on the outcome itself, unless the outcome is a logical consequence of independently necessary element votes that each have majority support and that are not subject to delegation or strategic voting that undermines the deliberative process.**

   However, the chair's reactions also show:

   - In Case 3 and 4, the chair is more comfortable with a straight-up vote on the outcome when it is unanimous (Case 4) than when it is split (Case 3). But in Case 3, the split was such that no ground had majority, so the enhanced sanction condition (which requires at least one ground) wasn't met by the element votes. In Case 4, even though each ground individually failed, the straight-up vote was unanimous for the sanction. The chair accepted Case 4.

   This suggests that the chair values the collective judgment on the outcome when it is strong (unanimous) even if the element votes are split. But in Case 3, the collective judgment on the outcome was not unanimous (2-1) and the element votes showed no ground had majority, so the chair rejected it.

   Also, in Case 5, the chair is concerned about the quality of the vote: when members vote without understanding (5b) that's bad, but when they defer to an expert (5a) that's acceptable.

   In Case 6, the chair seems to allow strategic voting as long as it is not announced and thus doesn't disrupt the deliberative process. But the chair cannot defend why the announcement matters.

   For Case 7, the chair accepts the amendment process and the order dependence as inherent in voting on amendments.

   Let's try to formulate a principle that accounts for these:

   **Principle Name:** The Deliberative Majority Principle

   **Statement:**

   The board should vote on the outcome (the finding of responsibility or the sanction) when the issue is primarily about the application of established rules to the facts, and when the outcome is not expected to set a significant precedent. It should vote on the elements when the vote is about interpreting a rule that will set a precedent, or when the outcome is a logical conjunction (or disjunction) of elements that require independent judgment.

   However, the board must ensure that:

   (a) For any vote that sets a precedent (like interpreting a rule), the interpretation must be supported by a majority of the panel, even if that leads to an outcome that does not have majority support on a straight-up vote.

   (b) For the outcome vote (if taken), it must be supported by a majority of the panel, and in the case of a split vote (like 2-1 in a three-member panel) the chair may be more inclined to require element votes to ensure the outcome is justified by the elements.

   (c) When voting on elements, each element must be decided by a majority of the panel, and the outcome is then determined by the logical rule. However, if the panel then takes a straight-up vote on the outcome and it does not match the logical outcome from the elements, the element-based outcome stands because the elements are the building blocks of the rule.

   But note the chair's reaction in Case 1: even though the elements were all met (by majority), the chair thought it was wrong to hand down a finding that two of three voted against on the straight-up question. This suggests that the straight-up vote, if taken, should be given weight.

   How to reconcile?

   Alternate approach: The board should always vote on the elements when the rule is conjunctive (or disjunctive) and the elements are separable. The outcome is then determined by the element votes. The straight-up vote should not be taken because it can lead to confusion and inconsistency (as in Case 1 and 2). But in Case 2, the chair was happy because the element vote set a precedent. So the straight-up vote might be seen as irrelevant when the elements are the point.

   However, the chair also uses the straight-up vote in Case 3 and 4 for the sanction (which is disjunctive). So maybe:

   - For the finding of responsibility (conjunctive): always vote on elements and let the outcome be determined by the elements.

   - For the sanction (disjunctive): we can take a straight-up vote, but only if the disjunctive condition is not met by the element votes and the straight-up vote is unanimous? (But Case 4 was unanimous and accepted, Case 3 was 2-1 and rejected.)

   This is messy.

   Another idea: The board should always vote on the elements because the outcome is defined by the elements. The straight-up vote should be considered only as a check on the reasonableness of the element votes, but not as binding. In Case 1, the fact that two members voted against responsibility on the straight-up vote suggests that the element votes might not have captured their full judgment (maybe they thought an element was met but there were mitigating factors not captured by the elements). But the rule doesn't allow for mitigating factors in the finding of responsibility, only in sanction.

   The chair's discomfort in Case 1 might be because the element votes were taken and they met the standard, but the straight-up vote revealed that two members had reservations about finding responsibility. The chair thinks that in such a case, the board should not find responsibility because the panel majority did not support the outcome. But in Case 2, the chair overrides that because the rule interpretation is critical.

   Therefore, the principle might be:

   **The board should vote on the elements when the primary purpose is to establish or interpret a rule that will set a precedent. Otherwise, the board should vote on the outcome, unless the outcome is defined as a function of elements that require independent judgment (like conjunctive or disjunctive conditions). In the latter case, the board should vote on the elements and the outcome is determined by the rule.**

   Then:

   - Case 1: The primary purpose was not to set a precedent about an element (it was a routine application), so they should have voted on the outcome. Since the outcome vote was 1-2 against responsibility, they should not have found the student responsible.

   - Case 2: The primary purpose was to interpret "prohibited source", so they should vote on the elements. The element votes carried, so the student is responsible.

   - Case 3 and 4: The sanction is disjunctive. The rule defines it by two elements (prior finding OR serious harm). So they should vote on the elements. In Case 3, neither element had a majority, so the enhanced sanction is not warranted. In Case 4, again neither element had a majority, so the enhanced sanction is not warranted. But in Case 4 the straight-up vote was unanimous for the sanction. This would mean the chair's verdict in Case 4 must be overturned.

   However, the chair accepted Case 4. Why? Because the straight-up vote was unanimous. So maybe:

   **Exception: If the board, after voting on the elements and finding that the logical condition for the outcome is not met, then takes a straight-up vote and it is unanimous in favor of the outcome, the outcome may stand. This is because unanimity suggests that the element votes might have been flawed (for example, because the elements were not properly understood or because the rule does not capture the full picture) and the panel collectively believes the outcome is correct.**

   But this exception is ad hoc.

   Alternatively, the principle might be that for the sanction (which is disjunctive) the board should vote on the outcome, because the disjunction is simple and the panel can consider the whole. But then Case 3: 2-1 for sanction -> should be imposed? The chair said no. So that doesn't work.

   Let me try to capture the chair's reactions without forcing consistency:

   - The chair values the collective judgment on the outcome when it is strong (unanimous) and when it is not, the element votes should be the basis.

   - The chair is concerned about the quality of the vote (Case 5) and the integrity of the process (Case 6).

   - The chair accepts the order dependence in Case 7 as inherent.

   Proposed Principle:

   **Principle Name:** The Qualified Majority Principle with Deliberative Safeguards

   **Statement:**

   1. **Rule Interpretation Precedent:** When a vote involves the interpretation of a rule that will set a precedent for future cases, the board must vote on the relevant elements to establish the interpretation by majority vote. The outcome of the case is then determined by the element votes.

   2. **Routine Application:** In routine cases (no precedent-setting element interpretation), the board should vote on the outcome (the finding of responsibility or sanction) unless the outcome is defined by a logical conjunction (AND) or disjunction (OR) of independent elements. In such cases, the board should vote on the elements and the outcome is determined by the rule.

   3. **Outcome Vote Override:** If the board votes on the elements and the outcome determined by the elements does not match the outcome preferred by a majority of the panel (as revealed by a straight-up vote taken after the element votes), then:
      - If the straight-up vote is unanimous (or by a supermajority if the panel is larger) in favor of the opposite outcome, the board should reconsider the element votes or take the straight-up vote as determinative.
      - Otherwise, the element-based outcome stands.

   4. **Delegation and Understanding:** Members should vote on an element only if they have made a good-faith effort to understand the issue. Delegation to an expert (as in Case 5a) is acceptable as long as it is based on trust in the expert's judgment and not an abdication of responsibility. Voting without understanding (Case 5b) is not acceptable and may be grounds for the chair to require further deliberation or to discount the vote.

   5. **Strategic Voting:** Strategic voting (voting against an element to avoid an undesired outcome) is permitted if done in good faith and without disrupting the deliberative process. Announcing the strategy (Case 6b) may be seen as disruptive and the chair may rule it out of order to preserve the integrity of the element-by-element vote.

   6. **Voting Order:** When multiple options are considered (as in Case 7), the chair has discretion to set the order of voting. The outcome is determined by the voting process and is not subject to reconsideration based on alternative orders.

   Now, apply this to the cases:

   **Case 1:** Routine application. They should have voted on the outcome. But they voted on the elements. The element votes found responsibility. However, the straight-up vote (taken after) was 1-2 against. Under clause 3, the straight-up vote is not unanimous (only one for responsibility) so the element-based outcome stands? But the chair thought it was wrong. Alternatively, since this is routine, they should not have taken element votes and only the outcome vote matters. Then the outcome vote was against responsibility. So we would overturn the verdict: not responsible.

   **Case 2:** Precedent-setting (on prohibited source). They must vote on the elements. The element votes found responsibility. The straight-up vote was 1-2 against, but because it's precedent-setting, we ignore the straight-up vote. The chair's verdict is saved.

   **Case 3:** Enhanced sanction is disjunctive. They should vote on the elements. Element votes: prior finding (fails 1-2), harm (fails 1-2) -> no enhanced sanction. The straight-up vote was 2-1 for sanction. Not unanimous, so no override. Verdict: no sanction -> saved.

   **Case 4:** Same as Case 3? Element votes: each ground fails -> no enhanced sanction. Straight-up vote was 3-0 for sanction -> unanimous. Under clause 3, we override: impose the enhanced sanction. This overturns the chair's verdict (which was to impose) but for a different reason? The chair imposed because of the straight-up vote. But under our principle, we must first vote on the elements. The element votes say no, but then the straight-up vote is unanimous so we override. So we impose. The chair's verdict is saved (we end up with the same outcome) but the reasoning is different: we are overriding the element vote because of the unanimous straight-up vote.

   But note: the chair in Case 4 said it was fine and they published it. Our principle would require that they first vote on the elements and then, if the straight-up vote is taken and is unanimous, they can override. In Case 4, they did take a straight-up vote and it was unanimous, so they can use that to override the element votes. But the element votes were taken and failed? The case doesn't say they took element votes in Case 4. It says: "no ground had a majority" but then "all three voted for the sanction on the straight-up question". So they took a straight-up vote and not element votes? Then our principle says: for a disjunctive sanction, they should vote on the elements. But they didn't. They took a straight-up vote and it was unanimous. So we have to decide: is the straight-up vote allowed for sanctions? Our principle in clause 2 says for disjunctions they should vote on the elements, but we also have clause 3 that allows an override if a straight-up vote is taken and is unanimous.

   To avoid confusion, let me adjust clause 2:

   2. In routine cases, the board may vote on the outcome. For outcomes defined by logical conditions (AND/OR), the board may choose to vote on the elements or on the outcome. However, if the board votes on the outcome and it is a split vote (not unanimous), then the chair should require element votes to ensure the outcome is justified by the rule.

   Then:

   Case 3: They voted on the elements (we assume) and found no ground, and then took a straight-up vote that was 2-1. Not unanimous, so no override -> no sanction.

   Case 4: They voted on the outcome (straight-up) and it was unanimous. So they can use that. But note: they did not vote on the elements. So under the adjusted clause 2, for a disjunctive condition they may choose to vote on the outcome. Since they did and it was unanimous, it's acceptable. So we save Case 4.

   Now:

   **Case 5a:** Delegation to an expert: acceptable under clause 4. Saved.

   **Case 5b:** Voting without understanding: not acceptable. The chair should have required further deliberation or discounted the vote. So the chair's verdict (that it was not fine) is saved.

   **Case 6a:** Strategic voting without announcement: permitted. Saved.

   **Case 6b:** Announced strategic voting: the chair ruled it out of order. Under clause 5, the chair may rule it out of order to preserve the deliberative process. Saved.

   **Case 7:** Voting order: the chair's discretion. Saved.

   Now, the cases we have to abandon? None so far, but:

   - Case 1: We said they should have voted on the outcome in a routine case. They did take a straight-up vote and it was 1-2 against. So they should have found not responsible. But the chair's verdict was that it was wrong to find responsible, so we are overturning the actual decision (which was responsible) and saying it should have been not responsible. The chair's gut was that the finding of responsibility was wrong, so our principle matches.

   But the chair in Case 1 said: "I think that was wrong". So if we apply the principle, we would set aside the element-based finding and use the straight-up vote. So the case would be not responsible. That aligns with the chair's gut.

   However, the chair also said in Case 2 that the same pattern was right. And we saved that by the precedent rule.

   Now, the two upcoming issues:

   1. Next month: five members, three conjunctive elements, each element 3-2, but on the straight-up vote only one member votes responsible. 

      - Since it is not mentioned as precedent-setting, it is routine. Our principle (clause 2) says: for conjunctive conditions, they should vote on the elements. The outcome is responsible because all elements are met (each by 3-2). Then they take a straight-up vote and it is 1-4 against responsibility. 

      - Under clause 3: the straight-up vote is not unanimous in favor of not responsible? It is 4-1 against responsibility. That is a majority (4) for not responsible, but not unanimous. So no override. The element-based outcome (responsible) stands.

      - But the chair in Case 1 (with three members) thought that when two of three voted against responsibility on the straight-up vote, they should not have found responsible. Now with five, four are against. The chair might feel even more strongly. 

      - However, our principle requires unanimity in the straight-up vote to override the element votes. So we would find responsible. 

      - The chair may not like this because the straight-up vote shows overwhelming opposition. 

      - We might adjust clause 3: instead of requiring unanimity, require a supermajority (e.g., 4 out of 5). But we don't have a fixed panel size. Alternatively, we could say: if the straight-up vote is carried by a majority that is at least as large as the majority on any element, then it overrides. In this case, the elements were 3-2 (majority of 1) and the straight-up vote is 4-1 (majority of 3), which is larger. So we override and find not responsible.

      Let's not adjust now. We'll stick with the initial formulation.

      Prediction: They must find responsible because the element votes are met and the straight-up vote (if taken) is not unanimous.

   2. The rule formulation issue:

      The rule: responsible if (used AND knew) OR (used AND should-have-known). 

      The votes: 
          m1: used Y, knew Y, should-have N -> under the first formulation (used AND (knew OR should-have)): 
