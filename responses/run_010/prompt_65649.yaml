  ### Reasoning

  The core tension in your cases revolves around **when a deliberative body should vote on its reasons (elements) versus its result (outcome)**, and how to handle inconsistencies between the two. Your reactions suggest an underlying principle: **The board's primary duty is to establish authoritative interpretations of rules and ensure outcomes align with the collective judgment of the panel, while guarding against arbitrary or ungrounded decisions.** 

  This principle splits into three key ideas:
  1. **Precedent Primacy**: When a vote sets a precedent (e.g., interpreting a rule), elements must be voted on to ensure clarity for future cases.
  2. **Collective Outcome Alignment**: In routine cases, outcomes should reflect the panel's majority judgment on the result, not just mechanical element aggregation. If element votes yield an outcome opposed by a panel majority, the outcome vote overrides it.
  3. **Deliberative Integrity**: Votes must reflect genuine understanding. Strategic voting is tolerated if undisclosed (it reflects sincere outcome preference), but public manipulation or uninformed voting undermines the process.

  This explains your cases:
  - **Case 1 vs. 2**: Identical votes, but Case 2 involved precedent (interpreting "prohibited source"), so element voting was essential. Case 1 was routine; the outcome vote (rejecting responsibility) should have overruled the element-based result.
  - **Case 3 vs. 4**: Both lacked majority support for individual sanction grounds. In Case 3, the 2–1 outcome vote for sanction was split (no consensus on *why*), so it failed. Case 4’s unanimous outcome vote signaled clear consensus, so sanction stood.
  - **Case 5**: Delegation to an expert (5a) is legitimate trust; uninformed voting (5b) voids deliberation.
  - **Case 6**: Strategic voting is acceptable if private (6a reflects outcome preference) but disruptive if announced (6b co-opts the process).
  - **Case 7**: Order dependence is inherent to amendment procedures; the chair’s role is neutral.

  ### Trade-offs
  - **Case 4 is saved** (unanimity signals consensus), but **Case 3 is overturned** (split outcome vote lacks justification).  
  - **Case 1 is saved** (outcome vote overrides elements in routine cases).

