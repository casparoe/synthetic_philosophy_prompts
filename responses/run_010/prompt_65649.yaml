      So the difference is in how the votes are aggregated.

      In the first way, we aggregate the elements separately: first "used", then the disjunction "knew or should-have". Each is voted by the members and then the majority decides each element.

      In the second way, we aggregate the composite conditions: each member votes on the entire composite condition (which is a conjunction) and then we take the disjunction of the two composites by majority on each composite.

      The rule is the same: responsible if (used and (knew or should-have)).

      But the voting method changes the outcome.

      Our principle says: the board should vote on the elements. The elements are: used, knew, should-have? Or the elements are the two composites? 

      The rule is defined by three elements: used, knew, should-have. But the condition is a function of these three. The second formulation breaks it into two composites, but the composites are not independent: they share "used".

      The principle should be: vote on the most atomic elements that are independent. Here, the atomic elements are: used, knew, should-have. So we should vote on these three separately and then apply the rule: used AND (knew OR should-have).

      Then, the outcome is determined by the majority votes on each atomic element.

