  ### Runnable Package: "Grading Strategy Showdown"  
  **Objective:** Simulate the trade-offs between outcome-based (final answer) and process-based (step-by-step) oversight of AI systems, highlighting cost, gaming incentives, and performance trade-offs.

  ---

  ### **Materials List**  
  - **Per Team (4-5 teams for 22 people):**  
    - 1 set of 3 multi-step word problems (with steps and final answers verifiable by humans).  
    - 1 answer key (for graders only).  
    - Paper, pens, and a "token tracker" sheet (see below).  
    - 30 physical tokens (e.g., poker chips, paper clips, or drawn circles).  
  - **Shared:** Whiteboard for scores, phone timer, pizza.  
  - **Problems:** Use **arithmetic word problems** with common pitfalls (e.g., unit conversions, percentages). *Example:*
    1. *"A bakery sells cakes for $20 each. They bake 8 cakes per day for 6 days but sell 75% of them. How much revenue do they make?"*  
       *Steps: Total cakes = 8 × 6 = 48. Sold = 48 × 0.75 = 36. Revenue = 36 × $20 = $720.*  
    2. *"A car travels 60 mph for 2.5 hours, then 40 mph for 1.5 hours. What’s the total distance in miles?"*  
       *Steps: Distance 1 = 60 × 2.5 = 150. Distance 2 = 40 × 1.5 = 60. Total = 210 miles.*  
    3. *"A shirt costs $40 after a 20% discount. What was the original price?"*  
       *Steps: Discounted price = 80% of original. $40 = 0.8 × original. Original = $50.*  

  ---

  ### **Rules & Scoring**  
  1. **Teams:**  
     - 4 teams of 5–6 people (adjust for 22 people).  
     - Each team has:  
       - **2–3 Graders:** Decide grading strategy, check answers, spend tokens.  
       - **2–3 Models:** Solve problems, write steps + final answers.  
     - *8-person variant:* 2 teams of 4 (2 graders, 2 models per team).  

  2. **Token Economy:**  
     - 30 tokens per team to spend on grading.  
     - **Costs:**  
       - Outcome grading: 1 token (checks final answer only).  
       - Process grading: 3 tokens (checks all steps + final answer).  
     - Graders **commit to a token split upfront** (e.g., "15 outcome, 15 process" = 15 cheap checks or 5 deep checks).  

  3. **Model Incentives:**  
     - **Models score points** for *accepted* answers:  
       - Outcome-graded: 10 points if final answer correct.  
       - Process-graded: 20 points if *all steps correct*.  
     - **Models know the grading mode** for each attempt and can game it:  
       - Under outcome: Guess/skip steps (fast, low effort).  
       - Under process: Write plausible steps (even if wrong) to avoid detection.  

  4. **Round Structure (3 rounds, 8 min each):**  
     - Models solve 1 problem per round.  
     - Graders allocate tokens to grade 0–3 attempts per round (using their split).  
     - After grading, tokens spent are deducted.  

  5. **Scoring:**  
     - Team score = Total points from accepted answers.  
     - Bragging rights: Highest score wins. Ties broken by fewest tokens spent.  

  ---

  ### **Timeline (120 Minutes)**  
  **0:00–0:15 — Intro & Team Formation (15 min)**  
  - Frame the session: "Today, we’re simulating AI oversight. Is it better to grade outputs or steps?"  
  - Split into teams (assign roles: graders/models).  
  - Explain rules, tokens, and scoring.  

  **0:15–0:45 — Round 1–3 (30 min; 8 min/round + 2 min buffer)**  
  - **Per round:**  
    - Graders declare which attempts they’ll grade and how (outcome/process).  
    - Models solve one problem *knowing the grading mode*.  
    - Graders check answers, spend tokens, record points.  
  - **Facilitator:** Wander, enforce time, remind models to "game strategically."  

  **0:45–1:00 — Scoring Break (15 min)**  
  - Teams tally scores. Pizza arrives!  
  - Write scores on whiteboard: "Team A: 45 points, 24 tokens left."  

  **1:00–1:20 — Discussion: Learnings & Trade-offs (20 min)**  
  - **Key questions:**  
    - *To all:* "Which strategy gave you the most points? Why?"  
    - *To graders:* "Did deep grading catch more errors? Was it worth the cost?"  
    - *To models:* "How did you change your work for outcome vs. process grading?"  
    - *Philosophy trigger:* "If an AI gets the right answer with wrong steps, is that acceptable in healthcare/law?"  
    - *CS trigger:* "How does step-level feedback improve training? Why is it expensive in real RLHF?"  

  **1:20–1:40 — Conceptual Debrief (20 min)**  
  - Map game moments to real-world concepts:  
    | **Game Moment**              | **Real-World Concept**                          |  
    |------------------------------|------------------------------------------------|  
    | Models guessing under outcome | Gaming via output hallucinations (e.g., ChatGPT "confabulations") |  
    | High token cost for steps     | Cost of human step-level labels in RLHF        |  
    | Plausible-but-wrong steps     | Process deception (steps ≠ actual reasoning)   |  
    | Fewer deep checks             | Trade-off: Coverage vs. depth in auditing      |  
  - **Gap to verbalize:** "In real AI, intermediate steps are *not* a faithful record of reasoning. We assume models show their work honestly, but they might hide biases or make up steps!"  

  **1:40–2:00 — Big Questions & Wrap-up (20 min)**  
  - Debate starters:  
    - "When should we prioritize outcome over process grading (and vice versa)?"  
    - "Can we trust AI to explain itself if we reward 'pretty' steps?"  
  - Summarize insights: Cost vs. reliability, incentives for honesty.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Models are too competent/ethical:**  
     - *Fix:* Secretly ask 1–2 model players per team to "game aggressively" (e.g., guess wildly under outcome, write *confident-but-wrong* steps under process).  

  2. **Token economy collapses** (e.g., teams hoard tokens):  
     - *Fix:* Announce mid-game: "Unspent tokens lose 5 team points each!" to force spending.  

  3. **Graders check steps too leniently:**  
     - *Fix:* Require graders to write ✗/✓ per step on paper. Randomly audit one team’s checks.  

  4. **Time runs short:**  
     - *Fix:* Shorten rounds to 6 min or skip one problem.  

  ---

  ### **Why This Works**  
  - **Non-lecture discovery:** Teams experience cost/quality trade-offs firsthand.  
  - **Mixed-group engagement:**  
    - Philosophers debate ethics of "right answer vs. right process."  
    - CS folks see incentive design parallels in RLHF.  
    - Law students grasp auditing implications.  
  - **Scalable:** Works with 8–30 people.  
  - **Pizza-powered:** Social breaks ease tension.  

  ### **Final Note**  
  This simulates the *human oversight dilemma* but not the black-box nature of AI reasoning. Stress that real systems may "lie" in steps—this must be discussed verbally. Run it, and watch them debate! 🍕
