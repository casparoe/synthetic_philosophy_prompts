prompt: |-
  I'm writing my comps on social ontology and I want a story I can hand to first-years, because the Lewis material goes in one ear and out the other when it's stated abstractly. Could you write me a short story, maybe 1500 words, about a small isolated community — research station, fishing camp, whatever you like — that has to settle on some utterly arbitrary regularity, one where two options are exactly as good as each other and nobody has the standing to decide. Not which side of the road to drive on and not which language to speak; pick something mundane and slightly weird.

  What I actually want dramatised is three moments. First, the pre-convergence mess: nobody knows what to expect of anybody, so the coorindation problem doesn't solve, there are false starts, and the tie ends up broken by something trivial — somebody does it once for reasons entirely of their own. Second, the point where everyone knows that everyone knows, and matching stops being a gamble. Third, and this is the part I care most about: years later the original problem has simply evaporated, maybe because of some new bit of kit that makes either option costless, and yet the regularity is still there, and now people punish anyone who breaks it, and a character has come to think it's correct rather than merely convenient. I want that belief to look silly and, in some practical sense, defensible at the same time — don't settle it for me in the narration.

  After the story, give me a JSON object with these fields: "regularity" (what they settle on), "coordination_problem" (what goes wrong when people mismatch), "rival_equilibrium" (the option that would have worked just as well), "salience_event" (the accident that broke the tie), "false_starts" (array of strings), "common_knowledge_route" (how it became mutually known), "problem_evaporates" (what changed), "punishment" (how deviants get treated afterwards), "objectivist" (the character who thinks it's objectively right, plus the strongest thing you can say for them). A sentence or two per field, max.
reasoning: |-
  Okay, let me tackle this fascinating request. The user is writing comps on social ontology and needs a pedagogical tool - a story illustrating David Lewis's coordination conventions in action. They specifically want three moments dramatized: pre-convergence chaos, common knowledge establishment, and the puzzling persistence of arbitrary norms even after their original purpose vanishes.

  Hmm, the challenge lies in finding that perfect mundane-yet-weird regularity. Not driving sides or language - those are too common. Something like... utensil orientation? Or directional preferences in narrow spaces? The fishing camp setting feels right - isolated communities naturally develop peculiar norms. 

  For the first moment, I imagine sheer frustration - people constantly bumping into each other, dropping things, wasting time. The false starts should feel authentically random: one person mirroring another's mistake, someone copying a passing bird's movement. The salience event needs to be utterly trivial - say, someone instinctively placing an item a certain way while distracted by a seagull.

  The common knowledge moment is crucial. Maybe a newcomer's observation breaks the ice - "Hey, you all do X the same way now?" - making everyone realize mutual awareness has been achieved. Then years later, when wider walkways remove the physical problem entirely, the norm persists absurdly. Punishments could be subtle social sanctions - extra chores, exclusion from card games. 

  The objectivist character is key. They must defend the norm as "proper" while sounding slightly ridiculous - perhaps arguing it creates "order in the universe" or prevents "moral decay". Yet their position should have a sliver of plausibility about social cohesion. 

  For the JSON breakdown, I'll need precise yet concise answers: the regularity itself (say, which shoulder to turn when passing), the original coordination problem (collisions), the lost alternative (opposite shoulder), the seagull-inspired salience event, etc. Each field must crystallize the story's mechanics without interpretation.

  This approach should make Lewis's abstract concepts visceral - showing how arbitrary practices solidify into "truth" through collective memory and punishment. The humor in persistence-after-obsolescence might help first-years grasp why social facts feel objective even when they're demonstrably contingent.
answer: |-
  ## The Shoulder Rule of Beacon Station

  The wind whipped salt spray across Beacon Station’s metal walkways, the only sound besides the groan of the tide against the concrete pylons. Inside the cramped main module, ten researchers huddled over terminals, their movements constrained by the narrow corridors. Dr. Aris Thorne, astrophysicist, squeezed past Dr. Lena Petrov, marine biologist, their shoulders brushing awkwardly. Again.

  “Left, Lena! *Left!*” Aris hissed, steadying the tray of sensor chips he was carrying.

  “How was I supposed to know?” Lena snapped back, flattening herself against a bulkhead. “You went *right* yesterday with Eli!”

  This was the crux of Beacon’s newest, pettiest hell: **The Shoulder Pass**. In corridors barely wider than two people, turning your shoulder *in* or *out* when passing dictated whether you collided or slid past smoothly. Both options worked perfectly – *if* matched. But neither was inherently better. Turning *in* (right shoulder leading, facing the wall slightly) or turning *out* (left shoulder leading, facing the center) were perfect mirror images of utility. Yet mismatches meant bruised shoulders, dropped equipment, and frayed tempers.

  **Pre-Convergence Chaos:** The first weeks were a symphony of minor collisions and hissed apologies. False starts abounded:
  *   **Mimicry Misfire:** Eli, trying to be helpful, mirrored Lena’s accidental *out* turn once, only for her to spontaneously switch to *in* the next time, causing a crunch.
  *   **Habitat Hangover:** Aris, used to a station with wider corridors, unconsciously defaulted to *out*, oblivious until he nearly sent Priya’s coffee flying.
  *   **The Bird Incident:** Newcomer Ben, startled by a gull smacking the window, lurched *in* reflexively, colliding with Priya who was trying *out*. His mumbled “Sorry, bird!” became a brief, confusing meme.
  *   **The Unilateral Declaration:** Lena, frustrated, announced loudly, “Right. *In* is the way. Sorted.” She diligently turned *in* for the next hour… only to find Priya stubbornly turning *out* every time, “Just to see if it feels better.” It didn’t.

  The tie remained unbroken. Coordination felt impossible. Everyone gambled every time they saw someone approaching, leading to hesitant shuffles and last-second jerks that often made things worse.

  **The Salience Event:** It was the seagull, indirectly, that settled it. Ben was carrying a fragile acoustic sensor array – bulky, valuable, and borrowed. He rounded a corner just as Aris appeared, carrying a steaming bowl of soup. Panic flashed in Ben’s eyes. A collision meant disaster. In that split second of frozen indecision, a particularly aggressive gull *thwacked* against the window right beside Ben’s head. He flinched violently – **to his left**. His shoulder swung *out*, the sensor array swinging safely away from Aris, who instinctively mirrored the movement, turning *out*. They passed like gears meshing perfectly. The soup didn’t spill. The sensor was safe. Ben exhaled shakily, meeting Aris’s wide eyes. "Okay," Aris breathed. "Okay. *Out*."

  There was no reason. The gull could have startled Ben the other way. Aris could have reacted differently. But it happened. *Out* worked, spectacularly, in a high-stakes moment.

  **Common Knowledge Blooms:** The shift wasn't instant, but it was rapid. Priya saw Ben and Aris pass smoothly using *out* later that day. Lena saw Priya and Eli use *out* successfully. Small comments started: "Going *out*, Lena?" "Yep, *out*." A week later, during a team meeting about algae blooms, Eli joked, "Well, at least we've sorted the shoulder thing. *Out* works." There was a ripple of nods, a few quiet "Yeahs," a shared glance. No debate, no decree. Just recognition. **They all knew they all knew.** Passing became effortless, automatic. The gamble vanished. Shoulder *out* was just... how you walked Beacon's corridors.

  ---

  **Years Later:** Beacon Station had been upgraded. Corridors were widened significantly during a retrofit. Two people could now walk abreast comfortably. The physical *need* for the Shoulder Rule was gone. Utterly.

  Yet, it persisted.

  Dr. Anya Sharma, newly arrived geneticist, walked confidently down the new, spacious central corridor. She saw old-timer Ben approaching. Out of sheer habit, she turned her shoulder *out*. Ben, expecting it, mirrored her perfectly. It felt smooth, familiar.

  Later that day, Anya, distracted by a complex gene sequence on her pad, rounded a corner without consciously thinking. She turned her shoulder *in*. She collided gently with Aris Thorne, now Station Lead. Nothing spilled. No harm done. The corridor was wide.

  Aris stopped. His face, usually genial, hardened slightly. "Anya. Shoulder *out*."

  Anya blinked. "Oh! Sorry, Aris. Just spaced out. These new corridors, you hardly need to..."

  "*Out*," Aris repeated, his voice firm. "It's the rule." He walked on.

  The punishment was subtle but pervasive. Anya found her equipment calibration requests "accidentally" delayed. She wasn't included in the informal coffee group that met in the rec module. Lena, overhearing Anya explain to a confused new technician that "You just turn *out*, it's easier," gave a derisive snort. "Easier? It's *correct*. It maintains order. Things have a *way* they're done here, Anya."

  Anya argued once. "But the corridors are wide now! *In* or *out*, it doesn't *matter* anymore! It's arbitrary!"

  Lena looked genuinely scandalized. "Arbitrary? Young lady, it was settled years ago! After the Gull Incident! Ben saved vital equipment using *out*! Aris confirmed it! It works. It prevents... confusion. A station needs standards. *Out* is *right*." Lena's voice held conviction. It *felt* right to her. The years of smooth passes, the shared history embodied in the simple turn, the minor social friction avoided – it all coalesced into a sense of objective correctness. The origin in pure, dumb accident was buried under layers of practice and mild social enforcement. To Lena, deviating wasn't just inconvenient; it was *wrong*. It threatened the invisible fabric of Beacon's tiny society. And Anya, feeling the chill of exclusion despite the perfectly adequate corridor width, couldn't quite dismiss that conviction as entirely silly, even as she knew, rationally, that either turn would have worked just as well.

