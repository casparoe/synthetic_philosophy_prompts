prompt: |-
  First session of a metaethics seminar I'm teaching, on evolutionary debunking arguments. Problem: I've read maybe fifteen of these papers and I can't tell you which ones are actually arguments and which are just a genealogy story plus a shrug. So before I assign anything else I want the spec, not the survey.

  Write the desiderata — what an argument from the evolutionary origins of our moral intuitions to some flavour of moral skepticism has to deliver before it's earned its conclusion. Standard of adequacy: good enough to move a realist who already accepts every word of the relevant evolutionary psychology and doesnt dispute the science. Converting people who were already skeptics doesn't count.

  For each requirement, give the consideration or case behind it, and phrase it so I could hand it to a grad student as a question to put to a paper. About 8–10, fewer if some of mine below collapse together.

  Here's what I'd expect on the list. Keep what's worth keeping, cut what isn't and say why, add what I've missed:

  - the genealogy has to be more than a plausible story — what does it take for a selection history to do epistemic work, as opposed to merely be true?
  - a robustness clause: does the argument survive if the causal details come out differently — cultural group selection rather than kin selection, or the dispositions being a spandrel of general intelligence plus language rather than an adaptation in their own right? I suspect this one fights with the previous one, and if it does I want to know what that costs.
  - process vs content: is the target the reliability of the faculty, or the truth of the particular beliefs it outputs? most of these slide between the two without noticing.
  - retail vs wholesale: if it debunks, say, disgust-based norms or intuitions about incest, does that license anything about morality as a whole? what would the upgrade require?
  - a parity constraint. My seminar's fixed points are that modus ponens is reliable, that 7 is prime, and that pain is bad for the creature feeling it. Say which of the three the debunker can keep, which she loses, and whether losing the third is a fatal self-exception or just where the argument was always headed.
  - no self-undermining: if it generalizes to all normative belief, including the epistemic ones its own premises run on, is that a reductio or merely an uncomfortable bill?
  - the counterfactual — that we'd have had different moral beliefs had our ancestors been selected differently — plus an account of why that isn't the genetic fallacy with extra steps.
  - who owes the explanation of the fit between our moral beliefs and the moral facts. Requirement on the debunker, or on the realist she's attacking? sort that out, I think half the literature has it backwards.

  Then tag every requirement as non-negotiable, negotiable but expensive, or a camp prejudice wearing a requirements costume. Then the bit I most want: is there a subset that can't all be met at once? My guess is robustness plus empirical support plus parity is the tightest squeeze, but I could be wrong — show me the smallest unsatisfiable set, or tell me the list is jointly satisfiable and name what the cheapest view gives up instead. Last, one line on which single requirement eliminates the most existing replies, and a line each on how the dilemma-shaped versions and the ones aimed at the third-factor style realist replies come out against the list. No full scorecard, we'll do that in class.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're teaching a metaethics seminar on evolutionary debunking arguments (EDAs) and need a clear set of desiderata to evaluate these arguments. The main issue they've encountered is that many papers blend genealogy stories with weak arguments, making it hard to distinguish substantive critiques from mere narratives. Their goal is to establish criteria that an EDA must meet to convincingly challenge moral realism, assuming full acceptance of the evolutionary science involved.

  First, I need to understand their initial list of requirements. They mentioned eight points: genealogy beyond a story, robustness to different causal details, distinguishing process vs content, retail vs wholesale debunking, parity with other fixed points, avoiding self-undermining, counterfactual relevance without genetic fallacy, and assigning the explanatory burden for belief-fact fit. They want each requirement justified, phrased as a question for grad students, and tagged for negotiability. They also ask about possible conflicts between requirements and which single requirement disqualifies most existing replies.

  The user's deeper needs seem to be creating a structured framework for critical analysis in their seminar. They want to move beyond surveys to focus on robust arguments. Their frustration with the literature suggests a need for clarity and rigor. They might also be seeking a way to challenge students to engage deeply with the arguments rather than accepting superficial narratives.

  Looking at their list, some points might overlap or need refinement. For instance, "genealogy beyond a story" and "robustness" could conflict if requiring detailed evidence limits flexibility in causal mechanisms. The parity constraint is crucial because it tests whether the debunking argument applies selectively, which could reveal biases. Self-undermining is a common issue in EDAs—if all normative beliefs are debunked, the argument itself loses justification. 

  The counterfactual requirement addresses the genetic fallacy by demanding more than just a causal story—it needs an explanation of why the causal origin undermines justification. Assigning the explanatory burden is key; realists might argue that evolution could track moral truths, so the debunker must show why this is implausible.

  I should check for missing elements. One might be the distinction between proximate and ultimate explanations. Also, the user didn't mention the scope of the debunking—whether it targets all moral beliefs or specific types. Another point could be the role of cultural evolution, which might interact with biological factors.

  Now, considering conflicts: robustness vs empirical support could be tight. If an argument must work across different evolutionary pathways, it might rely on weaker evidence. Combined with parity, if the debunker exempts epistemic norms, they need a principled reason why moral norms aren't similarly exempt. This trio might be hard to satisfy simultaneously. 

  For the single most effective requirement, explanatory burden shifting seems strong. Many realists counter EDAs by proposing third-factor explanations (e.g., evolution selects for true beliefs). If debunkers must rule these out, and existing replies often fail here, this could eliminate many weak arguments.

  Dilemma-shaped replies (e.g., if evolution tracks truth, no debunking; if not, no reliability) must address the explanatory burden and counterfactual robustness. Third-factor replies need to show their explanations are more plausible than alternatives, which ties into the explanatory burden requirement.

  I'll streamline the user's list, combining related points and adding any gaps. For example, process vs content and retail vs wholesale both deal with scope, so they might be merged. I'll also ensure each requirement is actionable for grad students, phrased as critical questions. Tagging negotiability: non-negotiable for core logic (e.g., explanatory burden, counterfactual), negotiable but costly for robustness, and camp prejudices for some interpretations of parity.
answer: |-
  Here’s a refined set of desiderata for evaluating evolutionary debunking arguments (EDAs), distilled to 8 core requirements. Each is phrased as a critical question for grad students, tagged for negotiability, and followed by analysis of tensions and eliminatory power. The list prioritizes *argumentative rigor* over genealogical storytelling.

  ### **The Requirements**
  1. **Explanatory Burden Shifting**  
     *Question: "Does the argument show why the realist (not the debunker) owes an explanation for the alignment of moral beliefs with moral facts, given the causal story? If not, why is the genealogy epistemically significant?"*  
     *Consideration:* Genealogy alone is inert; the debunker must force realists to explain why evolution *wouldn’t* produce arbitrary beliefs.  
     *Tag:* **Non-negotiable** (otherwise no burden on realism).

  2. **Counterfactual Vulnerability Requirement**  
     *Question: "Does the argument establish that in nearby evolutionary scenarios where moral facts differ, we’d hold the same beliefs? If not, why is the actual genealogy undermining rather than merely descriptive?"*  
     *Consideration:* Avoids genetic fallacy by linking origins to modal fragility.  
     *Tag:* **Non-negotiable** (minimal condition for debunking force).

  3. **Non-Accidentality Demand**  
     *Question: "Why should we think the evolutionary process is insensitive to moral facts? Does the argument rule out 'tracking' explanations (e.g., truth-tracking benefits)?"*  
     *Consideration:* Realists can concede genealogy but assert evolution selects for truth-apt mechanisms.  
     *Tag:* **Negotiable but expensive** (lapses here reduce EDAs to "inference blockers," not defeaters).

  4. **Scope Delimitation**  
     *Question: "Precisely which class of moral beliefs/processes does the argument target? What principle licenses extending it beyond this scope?"*  
     *Consideration:* Debunking disgust-based intuitions ≠ debunking reflective moral reasoning.  
     *Tag:* **Negotiable but expensive** (undefended wholesale claims beg the question).

  5. **Parity Test**  
     *Question: "If this argument debunks moral beliefs, does it equally debunk (a) epistemic norms, (b) mathematical intuitions, or (c) pain-avoidance? If not, what breaks the parity?"*  
     *Consideration:* Pain-badness (*prudential normativity*) is the realist’s wedge; exempting it risks special pleading.  
     *Tag:* **Camp prejudice** (skeptics bite bullets; non-skeptics reject parity).

  6. **Robustness to Mechanism**  
     *Question: "Does the argument hold if the causal details change (e.g., group selection vs. spandrels)? If it requires specific details, does it survive empirical uncertainty?"*  
     *Consideration:* High robustness aids generality but may weaken epistemic implications.  
     *Tag:* **Negotiable but expensive** (fragility to biology invites "just-so" objections).

  7. **Self-Application Consistency**  
     *Question: "If the argument generalizes to all normative beliefs, does it debunk its own premises? If not, what insulates epistemic norms?"*  
     *Consideration:* Self-defeat looms if EDAs undermine reason itself.  
     *Tag:* **Camp prejudice** (skeptics accept global defeat; others see reductio).

  8. **Faculty vs. Output Distinction**  
     *Question: "Is the unreliability located in the cognitive *faculty* or specific belief *contents*? Does the argument conflate them?"*  
     *Consideration:* Debunking a faculty (e.g., emotion-driven intuitions) leaves rationalist realism unscathed.  
     *Tag:* **Non-negotiable** (conflation invalidates most EDAs).

  ---

  ### **Conflicts and Tensions**
  - **The Tightest Squeeze:**  
    **Robustness + Non-Accidentality + Parity** is unsatisfiable for *non-skeptical* EDAs.  
    - *Why:* Robustness requires abstract insensitivity (e.g., "evolution doesn't track truths"). But to exempt epistemic/mathematical norms (per Parity), you must assert *their* evolutionary sensitivity—contradicting Non-Accidentality. Only global skeptics avoid this.  
  - **Joint Satisfiability?**  
    Only for *global skeptics* who abandon Parity (accepting defeat for math/epistemic norms) and bite self-application bullets. All others must sacrifice Robustness or Non-Accidentality.  

  ---

  ### **Which Requirement Eliminates the Most?**
  - **Explanatory Burden Shifting** disqualifies >50% of EDAs.  
    - *Why:* Most papers assume genealogy *itself* shifts the burden. But realists (e.g., Enoch, Wielenberg) counter that evolution *could* track moral truths (e.g., via benefits of cooperation). EDAs that fail to *preempt* this move collapse.  

  ### **Dilemma-Style Replies vs. Third-Factor Theories**
  - **Dilemma Replies** ("If evolution tracks truth, no debunking; if not, no reliability"):  
    - They *succeed* only if **Non-Accidentality** is unmet (debunker can’t rule out tracking).  
    - They *fail* if debunker satisfies **Counterfactual Vulnerability** (shows beliefs are fixed while facts vary).  
  - **Third-Factor Replies** (e.g., "cooperation is adaptive *and* good"):  
    - Live options only if **Scope Delimitation** is weak (must cover *all* moral truths) or **Explanatory Burden** is unmet.  
    - Debunkers beat them by satisfying **Non-Accidentality** (e.g., show adaptive beliefs diverge from truths).  

  ---

  ### **Recommendation for Seminar**  
  Focus readings on EDAs that explicitly engage **Explanatory Burden** (e.g., Joyce *The Evolution of Morality* Ch.6, Street's "Darwinian Dilemma") and Third-Factor replies (e.g., Enoch's *Taking Morality Seriously*). Avoid papers that lean on genealogical narratives without argumentative scaffolding. This framework forces clarity on *why* origins matter epistemically.
