  Below is a diagnostic instrument designed to sort participants into eight theories of joint agency based on their responses to concrete scenarios. Each scenario includes 2–3 answer options that avoid technical terms and philosopher names. The instrument covers your specified minimum scenarios (infiltrator, distributed crowd, committee, surgeon-robot, conflicting subplans) and adds five more to ensure robust differentiation. The scoring key maps response patterns to the eight theoretical leaves, and the final section addresses reliability gaps and the obligation-denying irreducible group agent.

