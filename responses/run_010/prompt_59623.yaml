  ### **Design Notes**  
  - **Scenarios sourced from your requirements:**  
    - Infiltrator (Scenario 1), Distributed Crowd (2), Committee (3), Surgeon-Robot (4), Conflicting Subplans (5).  
    - Added: Spontaneous Choir (6), Assembly Line (7), Protest Turned Violent (8), Sports Team (9), Traffic Jam (10).  
  - **Why these work:** The answer options force distinctions between theories without jargon (e.g., Scenario 4’s "seamless coordination" vs. "no understanding" tests mental-state requirements).  
  - **Limitations:** Crowd-sourced contexts (Scenario 2) may conflate Theories 5 and 6; the scoring key mitigates this via differential responses to Scenarios 3 and 8.  

  This instrument diagnoses implicit commitments in design documents by revealing how individuals conceptualize shared agency. Use it to flag mismatches early (e.g., if most team members score as Theory 8, claims like "the team intends" may be vacuous).
