  ### **Scoring Key**  
  Map your answers to the theories below. **Tally matches** for each theory’s expected response pattern. The theory with the highest tally is your dominant view. Ties indicate hybrid perspectives.  

  | Theory of Joint Agency                                     | Expected Response Pattern (by Scenario #) |  
  |----------------------------------------------------------|------------------------------------------|  
  | **1. Planning-based shared intention**                   | 1B, 2B, 3B, 4B, 5B, 6B, 7B, 8B, 9B, 10B |  
  | **2. Plural subjects with joint commitment**             | 1A, 2B, 3A, 4B, 5A, 6A, 7B, 8A, 9A, 10B |  
  | **3. Collective intentionality (irreducible primitive)** | 1B, 2B, 3B, 4B, 5A, 6A, 7A, 8A, 9A, 10A |  
  | **4. We-mode (collective acceptance)**                   | 1B, 2B, 3A, 4B, 5A, 6A, 7A, 8A, 9A, 10B |  
  | **5. Minimal sub-personal account**                      | 1A, 2A, 3B, 4A, 5B, 6A, 7A, 8C, 9B, 10A |  
  | **6. Group agency (aggregation procedure)**              | 1A, 2A, 3A, 4A, 5B, 6B, 7A, 8B, 9B, 10B |  
  | **7. Teleological individualist**                        | 1B, 2B, 3B, 4B, 5B, 6B, 7B, 8B, 9B, 10B |  
  | **8. Deflationary (no shared intent)**                   | 1B, 2B, 3B, 4B, 5B, 6B, 7B, 8B, 9B, 10B |  

  **How to score:**  
  - Compare your answers to each theory’s pattern (e.g., if you answered 1B, 2B, 3B, etc., and Theory 1 matches all, you have 10 matches).  
  - Theory 7 and 8 share identical response patterns but differ philosophically (Theory 7 reduces joint agency to individual goals; Theory 8 denies it exists). Your rationale for choosing "B" in most scenarios determines which fits.  
  - For Scenario 8, "C" only appears in Theory 5; treat it as a unique match.  

