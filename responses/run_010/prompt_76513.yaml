prompt: |-
  I am in the second term of an MA seminar on the semantics of conditionals, and after working through Lewis's triviality results line by line I have arrived at a position I find myself unable to defend when pressed. It has four parts, which I take to hang together. (i) Adams's thesis — call it PC — is correct as a descriptive claim: a rational agent's degree of belief in an indicative conditional equals the conditional probability of the consequent given the antecedent, rather than the probability of some truth-evaluable content. (ii) Lewis's theorem shows that this is not a contingent feature of our conceptual scheme but a mathematical one: in any probability space closed under conditionalization, no proposition can have its probability equal the corresponding conditional probability across all pairs of sentences, save in degenerate cases. (iii) It follows that indicative conditionals are not truth-conditional, and that believing one is a Ramsey-style state of supposing the antecedent and adding the consequent on that supposition. (iv) The embedding problem — conditionals under negation, under disjunction, in antecedent position, in iterated conditionals — is not an independent objection but an expected consequence, since PC was never supposed to have unlimited scope. There is a fifth commitment a classmate keeps attacking, and it is the one I most want examined: I take (iii) to be *established* by (ii), not merely made plausible by it. That is, I think the triviality result is what rules out truth conditions for indicatives, rather than being one awkward datum among many that a truth-conditional account must absorb.

  Tell me what would count against this package. I want the defeaters ranked from fatal to merely awkward, and for each one I want to know what the mathematics, the language, or the world would have to look like. Specifically: (a) Is the inference from (ii) to (iii) as tight as I assume? Lewis's theorem constrains binary connectives that pick out a proposition from a pair of propositions; a restrictor semantics, on which "if" is not a two-place connective at all but narrows the domain of a covert modal, and the multidimensional or conditional-event approaches in the de Finetti, Jeffrey, van Fraassen and Bradley lines, all appear to sit on the far side of that constraint while remaining thoroughly truth-conditional. If so, has my position been left with an inference to the best explanation rather than a proof, and what would settle the question one way or the other? (b) What would have to be true for PC itself to fail in a way I could not absorb by narrowing its scope — and is there any such thing, or is the view already insulated? (c) What does my position predict that its rivals do not? I can list the failures of strengthening the antecedent, of transitivity, of import–export, and the McGee-style cases against modus ponens, but I suspect a truth-conditional restrictor account predicts most of these as well, in which case they are not differential evidence. Tell me what would be genuinely differential, and what result or observation would speak *against* my view rather than merely fail to support it. (d) How much weight should I place on the experimental literature: to what extent do people's degrees of belief in conditionals actually track P(C|A) rather than conjunctions or biconditionals, and does the suppositional view survive if that descriptive claim turns out to be only approximately true, and only for simple, non-causal, non-deontic conditionals? Flag anywhere you are unsure of the specifics.

  I would also like the honest division between what a committed suppositionalist would themselves concede as counting against them and what they would dismiss as question-begging. I expect embedding under operators, conditionals in questions and commands, and the availability of a truth-conditional account that matches PC's predictions at least locally to be conceded as real costs, but I may be flattering my own view, so say where I am. Close by telling me directly whether this position risks anything at all, or whether it has been qualified into a thesis no evidence can reach — and, if it is insulated, whether that is a defect for a view of this kind, which is after all partly a descriptive claim about a construction in a natural language and not merely a metaphysical stance. Throughout, please keep separate what is settled among people who work on this material from what remains genuinely contested, and do not present a live dispute — say, over whether the triviality results are decisive against *any* truth-conditional account — as though it had been resolved. Where the literature is divided, say that it is divided, and say which way you lean and why.
reasoning: |-
  Okay, let me unpack this user's query. They're in an MA seminar on conditionals, grappling with Lewis's triviality results and their implications for Adams's Thesis (PC). Their position has four main parts: PC as descriptively correct, Lewis's theorem showing it's mathematically necessary, hence indicative conditionals aren't truth-conditional, and embedding problems being expected. The fifth point—that (ii) proves (iii)—is what their classmate challenges, and they want to examine that critically.

  First, I need to assess the inference from Lewis's theorem to the non-truth-conditionality claim. Lewis's result targets binary connectives forming propositions, but alternative frameworks like restrictor semantics or conditional events avoid this by not treating "if" as such a connective. The user might be overestimating how decisive Lewis is here. The key gap is that Lewis assumes a classical probability space with propositional connectives, whereas alternatives reject that setup. So the inference isn't airtight; it's more abductive. To settle this, we'd need evidence that "if" behaves as a non-connective in syntax or that conditional probabilities can't be reduced to propositions.

  Next, PC's descriptive failure. The user asks what could falsify PC beyond scope limitations. Experimental data showing systematic deviations from P(C|A) in simple cases—like with negations or under causal/deontic contexts—would be problematic. Also, if people assign truth values to conditionals consistently, that challenges the suppositional view. The user's position can adapt by restricting PC's scope, but if core cases violate it, the theory loses its foundation.

  Differential predictions matter too. Suppositionalism uniquely predicts null probability when P(A)=0 and non-propositional embeddings, whereas truth-conditional accounts might handle embeddings better. Empirical tests on embeddings or probability-zero antecedents could differentiate. However, restrictor semantics also predicts many invalidities, so failures like import-export aren't unique to suppositionalism.

  The experimental literature is mixed. While many studies support PC for simple conditionals, others show deviations with embeddings or causal contexts. If future experiments find consistent deviations even in paradigmatic cases, that undermines PC's descriptive claim. The suppositionalist might dismiss complex cases as beyond scope, but if simple cases show issues, it's more damaging.

  For costs, the suppositionalist concedes embedding problems and the lack of a unified account across contexts. But they'd dismiss truth-conditional alternatives as missing the point, since conditionals aren't propositions. The position risks being insulated if it treats all counter-evidence as out-of-scope. That's a defect if natural language treats conditionals uniformly, but if conditionals are heterogeneous, scope restriction is justified.

  The user's position isn't unfalsifiable but has retreat options. Strong evidence would be universal failures of PC in simple cases or viable truth-conditional alternatives matching all suppositionalist predictions. The field is divided, with many favoring restrictor approaches as a middle ground. I lean towards suppositionalism for its elegance with the data, but acknowledge that embeddings require more tools. Ultimately, the user's inference from (ii) to (iii) is strong but not conclusive; alternatives exist, and the debate continues.
answer: |-
  Here's a breakdown of potential defeaters for your position, ranked by severity, addressing your specific questions (a-d), and concluding with an assessment of its vulnerability. The analysis separates settled points, contested areas, and where the literature stands.

  **Fatal or Potentially Fatal Defeaters**

  1.  **A Viable, Non-Degenerate Truth-Conditional Account Matching PC:**
      *   **What it looks like:** A mathematical demonstration of a truth-conditional semantics (e.g., a refined restrictor, multi-dimensional, or conditional event semantics) that provably satisfies PC (P(If A, C) = P(C|A)) for a significant class of indicative conditionals *without* collapsing into triviality or degeneracy under the assumptions Lewis used. Crucially, this account must handle embeddings coherently within a unified truth-conditional framework.
      *   **Why fatal:** This directly contradicts (ii) and (iii). Lewis's theorem shows *no single proposition* can satisfy PC universally. If a semantics constructs a *different proposition* for each conditional *context* (e.g., via domain restriction/modification as in restrictor views, or by treating the conditional as a different type of entity like a conditional event) and this entity *is* truth-conditional *and* satisfies PC robustly in non-degenerate spaces, then (iii) is false. Your inference from (ii) to (iii) rests on the assumption that "truth-conditional" means "denotes a single proposition *within the standard Boolean algebra of the probability space*". These alternatives reject that assumption while claiming truth-conditionality.
      *   **Settlement/Contestation:** This is the **core live dispute**. Bradley's tenet semantics, van Fraassen's original "Stalnaker Bernoulli" model, Kaufmann's causal models for conditionals, and sophisticated restrictor views (e.g., Kratzer) are attempts. Critics argue they either still face triviality in full generality, sacrifice genuine truth-conditionality (e.g., by making truth relative to information states in a way that dissolves into credence), or cannot handle embeddings naturally. **The literature is deeply divided.** Proponents see these as decisive counterexamples to the suppositionalist inference; opponents see them as failing to genuinely satisfy PC or offer unified truth conditions. *Leaning:* I find these approaches promising but not yet conclusively successful in fully reconciling truth-conditionality, non-triviality, and *all* the data (especially complex embeddings) within a single, elegant framework. The burden is high, but success here would be fatal.

  2.  **Systematic, Ineliminable Descriptive Failure of PC (in Core Cases):**
      *   **What it looks like:** Robust experimental evidence showing that for *simple, non-nested, non-causal, non-deontic* indicative conditionals under conditions of uncertainty, competent speakers' degrees of belief *consistently and significantly* deviate from P(C|A) and instead track something else (e.g., P(A ⊃ C), P(A & C), P(C) alone, or a causal strength measure), *even when* reasoning carefully and probabilistically coherent. This deviation would need to be irreducible to scope limitations, misunderstanding, or performance errors.
      *   **Why fatal (or severely damaging):** (i) is the descriptive bedrock. If (i) fails for the core cases PC was designed for, the entire motivation collapses. Suppositionalism loses its primary empirical support. While you could narrow scope further ("*only* for these very specific subtypes..."), this significantly weakens the theory's explanatory power and appeal.
      *   **Settlement/Contestation:** Most experimental evidence *supports* PC for simple conditionals in probabilistic contexts (e.g., Evans, Over, Douven, Baratgin). However, some studies show deviations, particularly under time pressure, with causal conditionals, or when participants are asked for truth-value judgments. **The consensus leans towards PC being largely descriptively accurate for simple indicatives**, but it's not uncontested. Critically, no study has shown a *systematic and robust* deviation in the core case that clearly falsifies PC. *Leaning:* PC holds reasonably well descriptively for its intended scope. A clear, replicable demonstration of systematic deviation in core cases would be devastating.

  **Significant Challenges / Awkward Costs**

  3.  **The Embedding Problem as Intractable for Suppositionalism:**
      *   **What it looks like:** The inability of any suppositionalist (or expressivist/quasi-realist) account to provide a satisfying, general, compositional semantics for conditionals embedded under negation ("It's not true that if A, C"), in disjunctions ("Either not-A or if A, C"), as antecedents ("If (if A, B) then C"), or in quantified contexts ("Every time it rains, if it's Tuesday, the game is canceled"). While you concede this as a cost, its severity depends on whether rivals handle it better.
      *   **Why challenging:** While (iv) frames it as expected, the *practical* difficulty remains immense. Ad hoc extensions (e.g., different "conditional senses" for different embeddings) undermine theoretical unity. If truth-conditional accounts (especially restrictor views) demonstrably offer *more elegant, unified, and empirically adequate* treatments of embeddings, this weakens suppositionalism's claim to overall explanatory adequacy, even if it handles the unembedded case simply. It highlights that suppositionalism might explain *belief in* conditionals well, but struggles with their *meaning* in complex linguistic structures.
      *   **Settlement/Contestation:** This is a **major challenge**. Suppositionalists (e.g., Edgington, Bennett) offer various strategies (e.g., wide-scope negation, special "conditional assertion" operators, context-dependence), but these are often seen as complex and less natural than truth-conditional approaches for embeddings. Restrictor views excel here. **The literature agrees embeddings are hard for suppositionalism, but disagrees on whether it's fatal or just a cost.** *Leaning:* It's a serious cost, but suppositionalists have resources. A truth-conditional account handling embeddings *and* matching PC's core prediction would be far superior.

  4.  **Indicative Conditionals Behaving Like Truth-Bearers in Non-Probabilistic Contexts:**
      *   **What it looks like:** Clear cases where indicative conditionals are unquestionably treated as having truth values independent of the speaker's credences: e.g., *consistently* being the objects of knowledge/factive attitudes ("John *knew* that if the wire was cut, the alarm would sound"), functioning reliably in valid *truth-preserving* multi-premise arguments involving embeddings, or being used in contexts demanding bivalence (legal contracts, precise technical specifications) without any sense of defect.
      *   **Why challenging:** Directly contradicts (iii). Suppositionalism struggles to explain how a non-truth-conditional state can be an object of knowledge or preserve truth in complex inferences. While expressivist/quasi-realist strategies exist ("true" = "correct to accept"), they can feel strained in these contexts compared to straightforward truth-conditionality. This suggests PC's scope might be narrower than the full semantic behavior of conditionals.
      *   **Settlement/Contestation:** Suppositionalists argue these uses are derivative or involve a shift in interpretation (perhaps towards a more "subjunctive" or universal generalization reading). Critics see them as core indicative uses. **Contested.** *Leaning:* This is a significant pressure point. While suppositionalists can offer analyses, these uses intuitively favor truth-conditionality. A compelling account of how suppositionalism handles *factive* attitudes towards conditionals is needed.

  5.  **Widespread Failure of PC in Non-Core Cases Undermining the Core:**
      *   **What it looks like:** Experimental evidence showing that PC fails *systematically* for indicative conditionals involving causation, obligation, or epistemic modality ("If she took the poison, it *must have been* in the tea"), even with competent speakers. Further, if the strategies for explaining these failures (e.g., "they involve covert modals") feel ad hoc or fail to isolate a clear "pure" conditional core where PC holds perfectly, it weakens PC's status as a fundamental principle.
      *   **Why challenging:** Erodes the descriptive claim (i). While you can narrow scope, if the "pure" core becomes vanishingly small or ill-defined, the theory loses generality. It raises the question: if PC fails so readily outside a narrow band, is it *really* the fundamental feature of conditionals, or just an artifact of specific tasks/questions?
      *   **Settlement/Contestation:** Evidence is mixed. PC seems weaker for causal/deontic/epistemic conditionals. **Consensus is that PC's descriptive accuracy is highest for simple epistemic/predictive indicatives.** *Leaning:* This is a manageable challenge via scope restriction, but requires careful delineation of the "core". If no stable core can be found, it's damaging.

  **Addressing Your Specific Queries (a-d)**

  *   **(a) Inference from (ii) to (iii):** **It is not airtight.** Lewis's theorem constrains *propositions defined within a standard Boolean algebra*. Alternatives (restrictor, multi-dimensional, conditional events) escape by either:
      *   Denying "if" is a binary connective forming a proposition in that algebra (restrictor).
      *   Defining a *different kind* of entity (conditional event) with its own non-Boolean algebra and truth conditions.
      *   Making the proposition denoted context-dependent in a way tied to the conditional probability (multi-dimensional).
      The inference is **abductive**: (iii) is the *best explanation* for why Lewis's result holds *if* you assume conditionals denote standard propositions. The alternatives listed show other explanations are possible. **What would settle it?** Evidence about the *syntactic category* of "if" (is it fundamentally a binary connective? Restrictor views say no). Evidence that conditional probabilities *cannot* be reduced to probabilities of propositions *in any coherent truth-conditional framework* without degeneracy – which is what the live dispute over the viability of the alternatives is about.
  *   **(b) Falsifying PC (Descriptively):** See Defeater #2 above. A systematic, robust deviation in *simple, non-nested, non-causal, non-deontic* cases under good conditions would be fatal. Narrowing scope ("only when...") is possible, but if the core case fails, the theory's foundation crumbles. Insulation is limited; core failure is catastrophic.
  *   **(c) Differential Predictions:**
      *   **Suppositionalism Predicts:** (1) Null probability when P(A) = 0 (belief state undefined). (2) Failure of standard logical laws (SA, Transitivity, Contraposition) *even when* the relevant probabilities are defined. (3) Embedding failures requiring special treatment. (4) Non-propositional status leading to difficulties with truth/factivity/quantification. (5) Import-Export as a core equivalence (often seen as a strength).
      *   **Truth-Conditional Restrictor Predicts:** (1) Often handles P(A)=0 via modal domains. (2) Also predicts failures of SA, Trans, Contraposition due to domain shift. (3) Handles embeddings compositionally and naturally. (4) Propositional status handles truth/factivity/quantification naturally. (5) Often predicts Import-Export, depending on modal flavor.
      *   **Genuinely Differential Evidence:**
          *   **Behavior at P(A)=0:** Does reasoning with "If A, C" when A is known false feel impossible/undefined (suppositionalist) or does it involve considering possibilities where A is true in some relevant sense (restrictor/truth-cond)? Experiments are tricky here.
          *   **Embedding Coherence:** Can a unified account handle *all* embeddings naturally? Restrictor views have an advantage. Finding a complex embedding where suppositionalism offers a clearly *more* natural or empirically adequate analysis than restrictors would be strong differential evidence *for* suppositionalism (though unlikely). Conversely, a clear embedding case handled effortlessly by truth-conditional accounts but requiring contortions by suppositionalism favors truth-conditions.
          *   **Truth-Value Judgments & Factives:** Do competent speakers confidently assign truth values to simple indicative conditionals in past tense scenarios based on how the world was ("Was it true yesterday that if it rained, the match was canceled?")? Consistent "yes" favors truth-conditions. "It depends on the probabilities" or "We don't say that" favors suppositionalism.
  *   **(d) Experimental Literature:**
      *   **Tracking P(C|A):** The bulk of evidence supports this for *simple, non-causal, non-deontic* indicatives under uncertainty. Deviations occur, but are often explainable (e.g., conflation with other interpretations like the material conditional under time pressure, focusing on causal strength). **It's robust enough to be a cornerstone.**
      *   **Survival if Approximate:** Yes. Suppositionalism doesn't require perfect calibration, just that P(If A, C) = P(C|A) is the *central tendency* and *norm* for rational belief in such conditionals. Approximate fit is expected for descriptive claims. However, systematic, significant deviations in the core case (see b) would undermine it.
      *   **Failure in Non-Core Cases:** This weakens the theory's generality but doesn't directly falsify the core claim. It necessitates scope restriction.

  **What the Committed Suppositionalist Concedes & Dismisses**

  *   **Concedes:**
      *   The embedding problem is a significant theoretical cost requiring complex, potentially ad-hoc solutions.
      *   Accounting for conditionals as objects of knowledge/factive attitudes is challenging and requires sophisticated quasi-realism.
      *   The theory struggles with quantified conditionals and conditionals in antecedents.
      *   PC might not hold perfectly or universally across all types of indicative conditionals; scope restriction is necessary.
      *   Truth-conditional rivals offer more elegant compositional semantics for embeddings.
  *   **Dismisses (as Question-Begging or Misdirected):**
      *   Arguments *assuming* conditionals must have truth conditions and then pointing out suppositionalism struggles to provide them. (This is the point of contention).
      *   Arguments based on intuitions about the "truth" of conditionals without addressing the suppositionalist's expressivist/quasi-realist account of truth-talk.
      *   Demands for a suppositionalist "proposition" equivalent. (They deny there is one).
      *   Counterfactuals as counter-evidence. (Suppositionalism is primarily for indicatives; different mechanisms are posited for counterfactuals).
      *   Lewis's result *itself* as showing suppositionalism is *wrong*. (They see it as confirming their view that no proposition can do the job).

  **Risk and Insulation: A Direct Assessment**

  Your position **does risk falsification**, primarily through:

  1.  **The successful development of a viable, non-degenerate truth-conditional semantics satisfying PC** (Defeater #1).
  2.  **Robust empirical falsification of PC in its core descriptive domain** (Defeater #2).

  However, it **is somewhat insulated** by:

  *   **Scope Restriction:** Failures outside the "core" indicative case can be explained away ("That's not the phenomenon PC describes").
  *   **Quasi-Realism:** Difficulties with truth/factivity can be met with sophisticated accounts of how we *talk as if* conditionals are true without them *being* true in a classical sense.
  *   **Complexity of Alternatives:** The difficulties facing truth-conditional accounts attempting to satisfy PC non-trivially provide ongoing support for the suppositionalist inference.

  **Is this insulation a defect?** Yes and no.
  *   **Yes:** If the insulation relies on making the core claim so narrow or the quasi-realism so complex that it loses contact with the full, rich, and seemingly unified way conditionals function in language (especially embeddings and factive contexts), it becomes less compelling as a *semantic* theory. It risks explaining only a fragment well while leaving the rest mysterious or handled by unrelated mechanisms.
  *   **No:** If conditionals genuinely are heterogeneous (e.g., "if" is ambiguous, or epistemic vs. causal conditionals are fundamentally different), then scope restriction is legitimate. The quasi-realist machinery might be necessary to account for our linguistic practices involving non-propositional contents. Insulation isn't inherently bad if it reflects the complexity of the phenomenon.

  **Conclusion:** Your position is a coherent and defensible response to Lewis's result, grounded in a plausible descriptive claim (PC). The inference from (ii) to (iii) is strong but **abductive, not deductive**, due to viable truth-conditional alternatives that circumvent Lewis's specific assumptions. Its primary vulnerabilities are the successful development of one of those alternatives or the collapse of its descriptive foundation. It concedes significant costs regarding embeddings but argues these are inherent to the nature of conditionals rather than flaws in the theory. While insulated to a degree, it is not unfalsifiable; core descriptive failure or a rival meeting the PC challenge would be decisive blows. **The field remains deeply divided**, with the viability of non-trivial truth-conditional accounts satisfying PC being the central battleground. *My personal lean:* I find the suppositionalist core (i-iii) compelling for simple indicatives, but believe the embedding problem and the appeal of unified truth-conditional frameworks (even if complex) keep the contest very much alive. The inference from Lewis to non-truth-conditionality feels like the *best current explanation*, but I'm not convinced it's the *only possible* one.
