answer: |-
  ### Final Examination: PHIL 398 - Classical Utilitarianism  
  **Due**: 72 hours from receipt  
  **Format**: Single essay response (1,500 words ±10%)  
  **Value**: 25 marks (25% of final grade)  

  ---

  ### Question  
  Jeremy Bentham’s argument for decriminalizing "victimless" sexual offences rests on the following utilitarian reconstruction:  
  1. **Punishment Justification Condition**: Punishment is only warranted if it prevents *more overall pain* than it creates.  
  2. **Structure of Mischief**: Pain ("mischief") from an act falls into two categories:  
     - **First-order mischief**: Direct harm to assignable individuals (e.g., non-consensual injury).  
     - **Second-order mischief**: Indirect social harms (e.g., public alarm incentivizing future offences or eroding security).  
  3. **Absence of First-Order Mischief**: Consensual private acts lack assignable victims, as no unwilling participant suffers direct harm.  
  4. **Disqualifying Residual Pains**:  
     - *Disgust of onlookers*: Constitutes "antipathy" (irrational aversion) and thus cannot justify punishment, as it reflects prejudice, not tangible harm.  
     - *Reputational harm*: Largely manufactured *by* criminalization itself (e.g., stigma from prosecution), not the act.  
  5. **Conclusion**: Criminalization fails the Punishment Justification Condition. Repeal minimizes net pain.  

  **Cases for Analysis**:  
  - **Case A**: Sodomy laws remain codified but are universally ignored: no prosecutions in 50 years. Public contempt manifests solely through social shunning, employment discrimination, and private hostility ("popular sanction").  
  - **Case B**: Sodomy laws are aggressively enforced (fines, imprisonment), yet the public is indifferent to private conduct; disgust surfaces *only* during state actions (e.g., trials).  

  **Prompt**:  
  Using *only* the reconstructed premises above:  
  (a) For **Case A**, does Bentham’s argument still demand repeal? Which premise(s) become decisive?  
  (b) For **Case B**, does second-order mischief (e.g., alarm from visible enforcement) strengthen or weaken Bentham’s case?  
  (c) Critically evaluate whether Premise 4’s dismissal of disgust is an *independent utilitarian claim* or a circular restatement of his conclusion. If Bentham must defend this premise more rigorously, what utilitarian cost might he incur?  
  (d) Final verdict: Can Bentham’s framework be fairly characterized as anticipating Mill’s Harm Principle? Justify your view *without invoking Mill’s arguments*—focus solely on tensions within Bentham’s calculus.  

  ---

  ### Model Answer (800 words)  
  Bentham’s utilitarian case for decriminalization remains robust in **Case A** but faces destabilizing tensions in **Case B**, revealing unresolved vulnerabilities in his treatment of disgust and social alarm.  

  **(a) Case A: Repeal as Pain Reduction**  
  Repeal is still justified under Premise 1. Criminalization’s *latent threat* perpetuates reputational harm (Premise 4), as the law’s existence validates social hostility. Though enforcement is absent, the statute signals state-endorsed infamy, amplifying "popular sanction" harms (e.g., blackmail, ostracism). Premise 4 carries the load: by treating reputation-harm as *artificially created* by law, Bentham argues repeal eliminates this pain-source without sacrificing prevention of "real" mischief. The utilitarian gain lies in removing state-sanctioned stigma—a net reduction in pain.  

  **(b) Case B: Second-Order Mischief as Counterargument**  
  Here, second-order mischief *undercuts* Bentham. Vigorous enforcement in an indifferent society manufactures alarm where none existed (Premise 2). Public trials *generate* disgust through sensationalized exposure, potentially inciting copycat violence or preemptive discrimination. Bentham’s framework cannot dismiss this as "antipathy" because the law *itself* creates tangible danger—precisely the mischief criminalization should prevent. If enforcement spawns new harms (e.g., vigilante reprisals), Premise 2 demands punishment be evaluated against *these* consequences. This forces Bentham into a paradox: criminalization now *causes* the very mischief it purportedly controls.  

  **(c) Disgust: Circularity or Core Premise?**  
  Premise 4’s rejection of disgust is neither independent nor adequately utilitarian. Bentham labels disgust "antipathy" to exclude it from the calculus, but this assumes *a priori* that social aversion is irrational. Yet if disgust empirically correlates with reduced social cohesion (e.g., eroded trust in communities), it becomes a measurable pain Bentham must weigh. His dismissal is circular: disgust is disqualified *because* it arises from non-utilitarian biases—but utilitarianism cannot arbitrarily exclude widely felt pains without undermining its aggregative foundation. To defend Premise 4, Bentham must argue that *channeling* disgust (e.g., via education) causes less pain than *criminalizing* it. This risks conceding that majoritarian sentiments can sometimes override individual liberty—a concession that bloats second-order mischief’s scope and invites tyranny-of-the-majority outcomes.  

  **(d) Anticipating the Harm Principle? A Qualified Yes**  
  Bentham’s core insight—that punishment requires *demonstrable harm beyond subjective revulsion*—parallels Mill’s Harm Principle. However, Bentham achieves this only by stretching utilitarianism to its breaking point. His insistence that reputational harm is "manufactured" (Premise 4) implicitly privileges autonomy: the state exacerbates pain by policing private acts. Further, his narrow view of first-order mischief (Premise 3) excludes moralistic paternalism. Yet unlike Mill, Bentham lacks a *rights-based* firewall against majorities. When social alarm is empirically widespread (e.g., Case B’s enforcement-fueled panic), his calculus could *demand* criminalization to quell disruption. Thus, Bentham anticipates Mill’s criterion but subverts it to utilitarian ends, rendering liberty contingent on fluctuating social costs. This utilitarian instrumentalism—not moral principle—protects private acts, leaving his framework vulnerable wherever alarm is quantifiable.  

  **Verdict**: Bentham’s reconstruction succeeds in Case A by targeting law-created stigma but falters in Case B by underestimating state-manufactured alarm. Premise 4’s handling of disgust is question-begging, and his "Harm Principle" resemblance requires sacrificing consistency to avoid majoritarian capitulation.  

  ---

  ### Marking Scheme (25 Total)  
  1. **Case A Analysis (5 marks)**:  
     - 5: Identifies repeal’s role in reducing law-validated stigma (Premise 4), explains latent threat of unenforced law.  
     - 3: Notes repeal’s relevance but conflates popular/political sanctions.  
     - 1: Claims repeal is pointless without enforcement.  
     *Common error:* Ignores Premise 4’s role in reputational harm.  

  2. **Case B Analysis (5 marks)**:  
     - 5: Shows enforcement *creates* second-order mischief (Premise 2), exposing tension in Bentham’s prevention goal.  
     - 3: Recognizes new harms but doesn’t tie to Premise 2’s logic.  
     - 1: Assumes public indifference nullifies Bentham’s case.  
     *Common error:* Treats disgust as unchanged by enforcement.  

  3. **Disgust Premise Critique (6 marks)**:  
     - 6: Demonstrates circularity in Premise 4; shows utilitarian cost of revision (e.g., empowering majorities).  
     - 4: Notes circularity but doesn’t explore revision costs.  
     - 2: Labels Bentham "biased" without engaging utilitarianism.  
     *Summary-spotting flag:* Calls Premise 4 "Bentham’s liberalism" without critique.  

  4. **Harm Principle Evaluation (6 marks)**:  
     - 6: Distinguishes Bentham’s instrumental autonomy from Mill’s rights; shows vulnerability to empirical alarm.  
     - 4: Notes similarity but misses contingency in Bentham.  
     - 2: Parrots "Bentham and Mill agree" without analysis.  
     *A/B Boundary:* Competent (18/25) notes parallels; first-class (21+/25) shows Bentham’s autonomy is *derivative* of utility.  

  5. **Clarity & Structure (3 marks)**:  
     - 3: Logical progression; premises applied, not listed.  
     - 1: Disjointed; rehashes reconstruction verbatim.  

  ---

  ### Specific Errors Costing Marks  
  - **-2**: Confusing *ascetic principle* (pain as virtue) with *sympathy/antipathy* (irrational biases).  
  - **-3**: Treating popular (social) and political (legal) sanctions as interchangeable.  
  - **-2**: Declaring Bentham a "rule utilitarian" without textual basis.  
  - **-1 per instance**: Using "tyranny of the majority" as a standalone objection without tying to utility calculus.  
  - **-4**: Reproducing summary hallmarks:  
    - Mentions Bentham’s "mummy" quote or Panopticon.  
    - Analyzes only historical decriminalization, not premises.  
    - Fixates on Bentham’s biography or manuscript history.  

  ---  
  **Instructions to Students**: Cite no sources. Use only the reconstructed argument. Answers quoting Bentham directly (e.g., "the game of push-pin") will be penalized.
