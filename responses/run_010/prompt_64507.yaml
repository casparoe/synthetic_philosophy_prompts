answer: |-
  Here's a breakdown of the philosophical presuppositions, tensions, and potential paths forward for your Author's Note, argued through as requested:

  **The Presupposed Theory of Historical Truth in Your Author's Note:**

  1.  **Archival Foundationalism:** The core presupposition is that there exists a recoverable, objective bedrock of "facts" about the past, primarily located within the historical archive (documents, records, dated events, attested individuals). This archive is the ultimate authority.
  2.  **Fact/Imagination Binary:** History and fiction are distinct realms. History deals with the knowable facts derived from the archive; fiction operates in the gaps ("where the record is silent") or in the realm of the purely subjective/private (private conversations, undocumented inner lives).
  3.  **Empirical Fidelity as Primary Virtue:** The highest obligation of the historical novelist is fidelity to these documented, empirical facts: dates, attested events, real people's public actions and recorded words, material realities supported by evidence.
  4.  **Imagination as Secondary & Apologetic:** Imagination is necessary *only* to bridge archival gaps or to render the subjective experience accessible. Its use requires justification ("I have imagined") precisely because it ventures beyond the factual bedrock. This imagination is framed as a *lack* of knowledge, not an interpretive *act*.
  5.  **Transparency as Accountability:** Disclosing where you deviate from the record (dates shifted) or where you invent (characters, conversations) is an act of honesty, allowing the reader to separate the "real" from the "invented."
  6.  **The Archive Defines Significance (Implicitly):** While not explicitly stated, the ranking of offenses reveals that the significance of an event or character is primarily derived from its attestation *in the archive*. The earthquake's *date* matters because it's recorded; the *existence* of a specific widow matters because she isn't. The archive dictates what *needs* to be true.

  **What the Note Strictly Needs vs. What It Sits Nicely With:**

  *   **Strictly Needs:**
      *   The *existence* of an archive/documented record.
      *   A *distinction* between elements directly attested in that record and elements supplied by the author.
      *   A *commitment to transparency* about that distinction for the reader.
      *   An *implicit contract* with the reader that attested elements will be treated with fidelity *unless explicitly confessed otherwise*.
  *   **Sits Nicely With (But Isn't Strictly Required):**
      *   **Archival Foundationalism:** The note *could* function (though its tone would clash) if the author viewed the archive as deeply constructed/selected, *as long as* they acknowledged the *reader's expectation* of fidelity to its contents.
      *   **Positivist Notion of Facts:** The note doesn't *require* facts to be unproblematic atoms; it just requires them to be *documented* points of reference.
      *   **Complete Separation of Fact/Interpretation:** The note focuses on surface-level deviations (date changes, character invention), not the deeper interpretive choices shaping the *meaning* of the attested facts.

  **Could a Card-Carrying Whitean Write This Note?**

  **Yes, absolutely – but for fundamentally different reasons.**

  *   **Genre Contract, Not Ontological Claim:** The Whitean author wouldn't believe the note describes an objective reality ("the past as it essentially was"). Instead, they would see it as fulfilling a *convention* of the historical fiction genre – a ritualized gesture of transparency expected by readers and editors.
  *   **Managing Reader Expectations:** They understand that readers *want* and *expect* this distinction. The note satisfies that desire, signaling: "I have respected the *documented signposts* you might independently check or know about. Where I invent, it's in the spaces you *expect* to be filled by fiction."
  *   **Acknowledging Shared Reference Points:** Even if they believe all historical narrative is constructed, they recognize that certain documented events (like the Lisbon earthquake date) are culturally agreed-upon reference points. Changing these creates dissonance with the reader's *prior knowledge*, breaking the immersive contract more severely than inventing an undocumented widow.
  *   **Confessing Surface Deviations, Not Deep Construction:** The note allows them to confess the most obvious, surface-level "deviations" (date shifts, character inventions) without needing to delve into the far more radical (and potentially alienating) confession that the *entire narrative structure and meaning* are literary impositions. It maintains the *illusion* of factual grounding where it matters most for reader buy-in.
  *   **The "Fidelity" is Performative:** The "fidelity" performed isn't to the *past itself* (which is inaccessible and only ever constructed), but to the *archive as a cultural artifact* and to the *reader's expectation* of fidelity to that artifact within this genre.

  **Therefore, the note itself does *not* commit you ontologically to Rankean ideals.** It commits you *pragmatically* to a set of genre conventions and reader expectations centred around transparency regarding the use of the documentary record. The *language* of fidelity borrows from positivist historiography, but its *function* is primarily contractual within the context of historical fiction.

  **Explaining the Ranking of Offenses:**

  Your instinct isn't "bad faith dressed up as rigor." It's a pragmatic response to the **boundaries defined by the archive and the genre contract:**

  1.  **Violating the Archival Boundary:** Moving a documented date is a direct violation of a clear, attested fact within the archive. It crosses a bright line. There is objective evidence (within the terms of the archive) that you are wrong. This breaks the fundamental trust established by the genre.
  2.  **Inventing Within the Gap:** Inventing a witness where none is recorded doesn't violate an attested fact. The archive is silent. You are operating *within the designated space for fiction*. You aren't contradicting the record; you are supplementing it in an area deemed inherently unknowable through documents alone. This is expected and permissible under the genre rules.
  3.  **Public vs. Private:** Public speeches are part of the documented historical record. They are attested facts about public performance. Private conversations are, by definition, outside the archive (unless recorded in a diary/memoir explicitly used). Inventing them is again operating in the realm of the undocumented and expected.
  4.  **Consequences of Breach:** Changing a date creates a direct conflict with verifiable knowledge the reader might possess, potentially undermining the entire narrative's credibility ("If they got *this* wrong, what else is wrong?"). Inventing a widow adds colour but doesn't create a factual contradiction; it merely adds an undocumented element, which readers accept as part of the fiction.

  **Is there a "respectable view" supporting this ranking?**

  *   **Within the Genre's Own Logic:** Absolutely. The ranking reflects the internal logic and expectations of historical fiction as a genre. It respects the authority of the archive as the shared foundation. A philosopher might critique the *basis* of that authority, but within the practice of writing and reading historical fiction, this hierarchy is functional and widely accepted as sensible. It's about *genre integrity*, not pure historiography.
  *   **Pragmatic Historiography:** Even historians who acknowledge Carr's point about selection would generally agree that *once a fact is established within the historical discourse* (like the earthquake date), deliberately changing it in a work presented as historically grounded is misleading. The "historical fact" (Carr's sense) *is* the documented date. Changing it misrepresents the current state of historical knowledge.
  *   **Against Whitean Radicalism:** White's argument makes the ranking *philosophically* arbitrary from an ontological standpoint (both are fictional constructions). However, *pragmatically*, even a Whitean might concede that violating widely accepted documented reference points is more disruptive to the *reader's experience and trust* within this specific genre than inventing undocumented elements. The ranking persists due to reader expectations and the practical function of the archive as a shared reference, not because of a deeper metaphysical truth.

  **If You Swallowed the Skepticism: What Changes?**

  Swallowing Carr and especially White doesn't make the note *impossible*, but it fundamentally changes its *meaning and potential content*:

  1.  **The Note Evolves:** It doesn't vanish; it transforms.
      *   **Shift from Fact-Checking to Interpretation:** The focus moves away from minor factual deviations ("I compressed two voyages") and gaps filled ("invented a widow") towards the *interpretive choices* that actually shape the novel's meaning. "I chose to frame the earthquake not primarily as a natural disaster, but as the catalyst for a crisis of faith embodied in the struggles of my fictional philosopher. This emplotment as 'Tragedy' emphasizes X, inevitably downplaying Y."
      *   **Confessing Construction:** You confess not just to *inventing details* but to *constructing meaning*: "The sources are ambiguous on Pombal's motivations in the immediate aftermath. I have chosen to portray him as primarily pragmatic and ruthless, drawing on Interpretation A rather than Interpretation B, to serve the novel's exploration of power."
      *   **Acknowledging Selection/Exclusion:** "While countless stories unfolded in Lisbon that day, I focused on these specific threads (the diplomat, the seamstress, the priest) to explore themes of X and Y. This necessarily excludes the equally valid perspectives of Z."
      *   **Genre Contract Still Addressed:** You'd still likely include elements like distinguishing real from fictional characters and major attested events, acknowledging this is expected. But the *justification* changes: it's about managing expectations within the convention, not asserting fidelity to an objective past.
  2.  **Potential Migration into the Text (Metafiction):** In its strongest form, the skepticism *could* lead to incorporating the awareness of construction *into the novel itself*. A character might muse on the unreliability of memory or records. The narrative structure might deliberately highlight its own selectivity or offer multiple perspectives on an event. This makes the "confession" part of the artistic fabric, not just the back matter. However, this is a significant stylistic shift that may not suit every story or audience.
  3.  **The "Fidelity" Language Becomes Awkward:** Phrases like "where the record is silent, I have imagined" start to ring hollow. The record is *always* silent in ways that matter profoundly, and "imagination" isn't just filling gaps; it's the essential tool for creating narrative meaning *even when using attested facts*. You might replace it with something more like: "The documented record provides anchors, but the connections, motivations, and overall narrative arc are my interpretive construction, aiming to explore [Themes]."
  4.  **The Ranking Softens (Philosophically):** While you'd likely *still* avoid changing well-established documented dates simply because readers *expect* fidelity to those specific signposts (genre contract!), you'd understand that the *philosophical* gulf between moving a date and inventing a widow is less absolute than you once thought. Both are acts of narrative construction relative to the inaccessible past. The difference lies in the *relationship to the archive-as-artifact* and reader expectations, not in a fundamental ontological distinction.

  **Diagnosis:**

  Your Author's Note presupposes a commonsense, archival-positivist view of history that neatly separates objective fact (governed by fidelity) from subjective gap-filling (governed by imagination). This view is philosophically naive but deeply embedded in the *genre conventions* of historical fiction, serving a crucial function in managing reader expectations and establishing trust.

  The ranking of offenses arises naturally from this presupposed view: violations of the archival record are cardinal sins because they break the foundational contract; inventions within the gaps are venial sins, expected and permissible. This ranking is "respectable" within the practice and expectations of the genre, even if historiographical critique exposes its philosophical limitations.

  A Whitean *can* write the identical note, performing the *ritual* of fidelity for purely pragmatic, genre-contract reasons, while privately holding a radically different view of historical truth. The note commits you to the *performance* and the *contract*, not necessarily to the underlying Rankean ontology.

  Swallowing the skepticism doesn't kill the note; it transforms it. The focus shifts from confessing minor deviations from the archive to explaining the major interpretive choices (selection, emplotment, perspective) that construct the novel's meaning. The note becomes less an apology for invention and more a reflection on the narrative construction of history itself. The ranking of offenses loses some of its absolute moral force, becoming more a matter of managing reader expectations regarding specific, well-known documented reference points.

  Your instinct about the dates isn't bad faith; it's a practitioner's respect for the genre's rules and the archive's cultural authority. The challenge, if you embrace the skepticism, is to find a way for your Author's Note to honestly reflect the deeper level of construction involved in your work while still fulfilling the reader's need for orientation within the familiar landscape of historical fiction. You can move beyond "I changed a date / invented a widow" confessions towards "This is the story I chose to tell about this time, and here's why."
