prompt: |-
  I am in the final year of a political theory degree, and my seminar this term is on the democratic boundary problem: the question of who is entitled to constitute the demos, and the worry that the boundaries of a voting body cannot themselves be fixed democratically without either an infinite regress or a first decision made by someone with no standing to make it. Alongside the seminar I sit on the steering committee for my city's participatory budgeting cycle, in which residents propose projects and then vote on how to allocate a fixed capital sum from the municipal budget. The council has pledged to fund the winning projects, so the vote is formally advisory but practically binding. The committee has to publish a standing eligibility rulebook this term, because at present we relitigate the same disputes from scratch each cycle, in public, under deadline.

  Our current rule is one sentence long — any city resident aged sixteen or over may vote — and it is doing almost no normative work. Each cycle we are petitioned by some combination of the following: commuters who work full time here and use our infrastructure but sleep in a suburb; undocumented residents of ten or more years' standing who are unwilling to register anything with a city office; fifteen-year-olds enrolled in our schools; second-home owners and university students present nine months a year; people sleeping rough with no address that can be verified; a shop owner whose livelihood depends entirely on a street up for repaving; and residents of an unincorporated pocket the city expects to annex within three years but which currently pays no city tax.

  Please write the eligibility procedure the committee could actually adopt. It should have two tiers: a committee-level procedure for deciding, once per cycle, whether a petitioned category is admitted, admitted in a restricted role (proposing but not voting, voting only on projects that affect it, casting an advisory ballot), or refused; and a table-level flowchart derived from whatever rules the committee settles, runnable by a volunteer with no theoretical training in under three minutes per person. For each step, state what it is operationalizing from the theory (all-affected interests, all-subjected-to-the-rules, coercion, membership, contribution, capacity, and so forth), what counts as a sufficient answer, whether the answer is a matter of fact or of value, and where the step hands the decision back to the committee rather than resolving it. Include an explicit stopping rule, a tie-breaker for cases where two principles point in opposite directions, and the documentation requirement — noting that we have no budget for verification, no database access, and a city attorney who must confirm we are not creating a parallel electorate for real municipal elections.

  Then run the procedure on three petitions: the commuters, the undocumented residents with no verifiable address, and the fifteen-year-olds. I expect it to admit the fifteen-year-olds and refuse the commuters; if that is right, tell me which of my own commitments that outcome contradicts, and what would have to be changed in the rulebook to reverse it honestly rather than by patching the case in afterward.

  Finally, flag the steps where the procedure is really laundering a value judgment as a technical criterion, say plainly which of these disputes the boundary problem leaves undecidable such that the committee is simply choosing, and identify the affected parties the procedure structurally cannot reach — future residents, nonhuman interests, taxpayers in other jurisdictions. I would also like a short paragraph of published justification, in plain language, that a person turned away at the table could be given and understand.
reasoning: |-
  We are designing a two-tier eligibility procedure for a city's participatory budgeting cycle. The first tier is a committee-level procedure to decide on petitioned categories once per cycle. The second tier is a table-level flowchart for volunteers to determine eligibility per person in under 3 minutes.

  Key principles from political theory that we might operationalize include:
  - All-affected interests: Those whose interests are affected by the decisions should have a say.
  - All-subjected: Those who are subject to the rules (coercively enforced) should have a say.
  - Coercion: The democratic decision results in coercive enforcement (e.g., via taxes or laws) so those coerced should be included.
  - Membership: Based on residency or citizenship.
  - Contribution: Those who contribute (e.g., taxpayers) should have a say.
  - Capacity: The ability to participate meaningfully (e.g., age, cognitive ability).

  We must note that the boundary problem implies that no principle can be perfectly justified without circularity or an arbitrary starting point. Therefore, the committee must make some value judgments.

  The procedure must consider:
  - No budget for verification.
  - No database access.
  - Cannot create a parallel electorate for real municipal elections (so must be distinct from voter rolls for elections).
  - Documentation requirement: We must rely on what the person can provide.

  We are to run the procedure on three petitions: commuters, undocumented residents (no verifiable address), and fifteen-year-olds.

  We are also to write a justification paragraph for those turned away.

  ---

  **Committee-Level Procedure (for deciding on petitioned categories):**

  This procedure is run once per cycle, in response to petitions received. The committee will consider each petitioned category and decide whether to:
  - Admit (full voting rights)
  - Admit with restricted role (e.g., proposing only, voting only on projects affecting their area, advisory ballot)
  - Refuse

  Steps for the committee:

  1. **Identify the principle(s) at stake:** For the petitioned group, discuss which democratic principles (all-affected, all-subjected, membership, etc.) apply and with what strength. Consider the nature of the group's connection to the city and the projects.

  2. **Assess impact on the process:** Consider practicalities: 
     - How large is the group? 
     - How can they be identified and verified (given our constraints)? 
     - Would including them create administrative burdens that might undermine the process?
     - Does including them conflict with the city attorney's requirement (avoiding a parallel electorate)?

  3. **Weigh competing principles:** If multiple principles point in different directions, use the following tie-breaker:
     - Prioritize principles that are most central to the participatory budgeting's purpose as defined by the city council (which is to empower residents to decide on local capital projects). Therefore, the primary principle is **residency-based membership** (because it is simple, verifiable, and aligns with the current rule and the idea that those who live in the city are the primary stakeholders). Secondary principles (like all-affected interests) may be considered for restricted roles.

  4. **Stopping rule:** The committee will make a decision by majority vote after one hour of discussion per petition (or after all members have spoken, whichever comes first). If no majority is reached, the category is refused by default (to avoid indecision).

  5. **Documentation:** The committee must publish a brief statement for each decision, including:
     - The group in question.
     - The principles considered.
     - The reasons for the decision (including any restrictions).

  **Operationalization:**
  - Each step operationalizes the committee's role in setting boundaries based on democratic principles and practical constraints.
  - The decision is a matter of value (weighing principles) and fact (practical considerations).
  - The committee is making a value judgment when weighing principles and setting priorities.

  **Tie-breaker:** In case of conflicting principles, the committee will default to the principle of residency-based membership as the primary criterion, because it is the most operational and least contentious given our constraints. If a group is not residents but has strong affected interests, they might be given a restricted role (like advisory) but not full voting.

  ---

  **Table-Level Flowchart (for volunteers):**

  This flowchart is run for each individual seeking to participate. It must take under 3 minutes and require no theoretical training. It relies on the rules set by the committee (which are updated each cycle based on the committee's decisions for petitioned categories).

  **Assumptions for the flowchart:**
  - The base rule is: "Any city resident aged sixteen or over may vote."
  - The committee has published a list of additional categories (if any) that are admitted (with or without restrictions) for this cycle.

  **Flowchart Steps:**

  1. **Ask: "Do you live in the city as your primary residence?"**
     - Operationalizes: **Membership** (residency as the core criterion).
     - Sufficient answer: The person must state their address and provide one document (from a predefined list) that shows their name and city address. The list of acceptable documents (considering no verification budget) might include:
       - A utility bill (within the last 3 months)
       - A lease or rental agreement
       - A government-issued ID with address (if the ID is current and shows a city address)
       - A letter from a shelter or social service agency (for homeless individuals) confirming they are staying in the city (if the committee has decided to admit homeless residents with such documentation)
     - If yes and they are 16 or over, they are eligible to vote and propose. **Stop here.**
     - If no, go to step 2.

  2. **Check the committee's published list of admitted categories for this cycle:**
     - The volunteer has a list (provided by the committee) of non-resident groups that are admitted (with or without restrictions) and the documentation required for each.
     - For example, if the committee has admitted "university students living in the city for 9 months", then the volunteer would check if the person falls into that category and ask for the required documentation (e.g., student ID and a university housing contract).
     - Operationalizes: **Committee's value judgment** (based on principles like all-affected or all-subjected for specific groups).
     - Sufficient answer: The person must state which category they are in and provide the documentation specified by the committee for that category.
     - If they fall into an admitted category and provide the documentation, they are eligible (with the specified role: full, proposing only, etc.). **Stop here.**
     - If not, go to step 3.

  3. **Check for restricted roles:**
     - The volunteer checks if the person might be eligible for a restricted role (like proposing only or voting only on specific projects) based on the committee's rules. For example, if the committee has allowed non-resident business owners to vote only on projects in the business district, then the volunteer would ask for proof of business ownership and location.
     - Operationalizes: **All-affected interests** (if the committee has adopted this for restricted roles).
     - Sufficient answer: The person must provide documentation as specified by the committee for that restricted role (e.g., business license for the specific street).
     - If they qualify, they are given the restricted role. **Stop here.**
     - If not, go to step 4.

  4. **Refer to the committee:**
     - If the person doesn't fit any category but insists they have a strong claim, the volunteer gives them a form to petition the committee for the next cycle. For the current cycle, they are turned away.
     - Operationalizes: **Procedural fairness** (allowing for future consideration) but not granting immediate participation.
     - This step hands the decision back to the committee for future cycles.

  **Stopping rule for the table:** After step 4, the process ends for that individual. They are either admitted (at step 1, 2, or 3) or turned away (step 4).

  **Documentation requirement at the table:** 
  - The volunteer must record the number of people turned away and the reason (e.g., not resident, not in an admitted category, or lacking documentation).
  - For those admitted under non-resident categories, the volunteer records the category and keeps a copy of the documentation (if provided) or notes what was provided.

  **Note on verification:** Since there's no budget for verification, the volunteer only checks that the document appears genuine and matches the person's name and the required information. They do not call to verify.

  ---

  **Running the Procedure on the Petitioned Groups:**

  We assume the committee is using the procedure above. The base rule is residency and age>=16.

  1. **Commuters (work full time in the city but sleep in a suburb):**
     - Committee-level discussion:
       - Principles: They are affected by city infrastructure (all-affected) and subjected to some rules (e.g., traffic laws). However, they are not residents (membership) and do not pay city income tax (contribution might be through sales tax, but not direct). 
       - Practical: They are a large group, hard to verify (no clear documentation of "working full time" without pay stubs, but we have no database). Including them might overwhelm the process and blur the focus on residents. Also, they can vote in their own municipalities.
       - Tie-breaker: Residency is primary. They are not residents, so the committee would likely refuse full voting rights. For a restricted role (e.g., voting only on transportation projects), but note the administrative burden of project-specific voting. Without a clear way to implement restricted roles for commuters, the committee might refuse.
       - Decision: Refuse. (They are not residents and the practical challenges are too great.)

  2. **Undocumented residents of ten or more years, unwilling to register anything with a city office:**
     - Committee-level discussion:
       - Principles: They are clearly residents (membership) and subjected to the rules (all-subjected). They are affected by the projects. However, they cannot provide documentation without risking exposure.
       - Practical: How to verify without documentation? The committee might consider alternative forms of proof (e.g., a letter from a community organization, or a neighbor's affidavit) but the person is unwilling to provide any. Without any documentation, we cannot verify residency. Also, the city attorney might object if it creates a parallel electorate (but note: participatory budgeting is not a real election, so maybe allowed). However, the committee must weigh the risk.
       - Tie-breaker: Residency is primary, but if they cannot prove it, we cannot admit them. The committee might want to include them but must have a verifiable method. Since they are unwilling to provide anything, it's impossible. The committee might decide to allow alternative documents (if they can be provided) but if the person refuses all, then they cannot be admitted.
       - Decision: The committee might create a category for long-term undocumented residents and allow them to use a letter from a designated community organization (without revealing status to the city). But if the person is unwilling to provide even that, then at the table, they would be turned away. However, the committee might decide that without any verification, they cannot admit. So for the petition, the committee might set up a process but note that if the person refuses to provide the alternative document, they are ineligible. Thus, the category is admitted in principle but with a documentation requirement that the person is unwilling to meet. So effectively, they are refused at the table.

  3. **Fifteen-year-olds enrolled in our schools:**
     - Committee-level discussion:
       - Principles: They are residents (membership) and affected by projects (e.g., schools, parks). The capacity principle might be raised (are they mature enough?), but 16 is already young and they are in school. Lowering the age to 15 would align with some youth engagement initiatives.
       - Practical: They can easily prove enrollment (school ID) and age (if needed). It's a clear group.
       - Tie-breaker: Residency is primary and they are residents. The only barrier is the age rule. The committee might decide to lower the voting age to 15 for participatory budgeting (since it's not a real election). This would require changing the base rule.
       - Decision: Admit (full rights) by changing the base rule to age 15 or over. Alternatively, if the committee does not want to change the base rule, they might create a category for 15-year-olds and admit them. But note: the current rule is 16, so the committee must explicitly change it.

  **Expected Outcome:**
  - Commuters: Refused.
  - Undocumented residents: If they refuse all documentation, turned away at the table (effectively refused).
  - Fifteen-year-olds: Admitted.

  **Contradiction in Commitments:**
  If the committee admits the fifteen-year-olds and refuses the commuters, it might contradict the principle of **all-affected interests**. The commuters are deeply affected by city infrastructure (they use it daily) while the fifteen-year-olds are residents but might be less affected in some ways (e.g., they don't drive, so road projects might affect them less). However, the committee is prioritizing membership (residency) over affectedness. 

  To reverse the outcome honestly (i.e., admit commuters and refuse fifteen-year-olds), the rulebook would need to:
  - Change the primary principle from residency to another principle, such as all-affected interests. Then, the base rule might be: "Anyone who works or lives in the city and is aged 16 or over may vote." But note: this would require verification of employment, which we don't have. Alternatively, the committee could create a category for commuters and require proof of employment (like a pay stub). For the fifteen-year-olds, if the committee keeps the age at 16, they would be excluded.

  However, note that the commuters are not residents and the fifteen-year-olds are. So if the committee values residency, then the outcome is consistent. The contradiction only arises if one holds that affectedness should be the primary criterion.

  ---

  **Laundering Value Judgments:**

  In the table-level flowchart:
  - Step 1: The residency requirement is a value judgment (that residents are the primary demos) operationalized as a technical criterion (proof of address).
  - Step 2: The list of admitted categories is based on the committee's value judgments about which non-resident groups deserve inclusion.

  In the committee-level procedure:
  - The tie-breaker rule (prioritizing residency) is a value judgment.
  - The decision to set the voting age at 16 (or 15) is a value judgment about capacity and inclusion.

  **Undecidable by Theory (Boundary Problem):**
  - The choice of the primary principle (residency vs. affectedness vs. subjection) is undecidable. The committee must choose.
  - The setting of the age threshold (15, 16, or 18) is arbitrary from theory and based on social norms and practical capacity.
  - The inclusion of undocumented residents involves a conflict between membership (they are residents) and the state's formal rules (which may not recognize them). Theory doesn't resolve whether democratic inclusion should override state recognition.

  **Structurally Unreachable Parties:**
  - Future residents: They are affected by long-term projects but cannot vote.
  - Nonhuman interests (e.g., the environment): They are affected but have no representation.
  - Taxpayers in other jurisdictions: If the city uses state or federal funds for a project, those taxpayers are affected but not included.

  ---

  **Justification Paragraph for Those Turned Away:**

  "We understand you want to participate in deciding how our city spends its capital budget. Our rules are designed to include people who live in the city and are directly affected by these projects. After careful consideration, we have set criteria based primarily on city residency for voting, because residents are the ones who experience the day-to-day results of these projects and contribute to the community long-term. We also consider other groups on a case-by-case basis. Unfortunately, based on the current rules, we cannot include everyone. We will record your interest for the committee to consider in future cycles. Thank you for caring about our city."

  ---

  **Final Rulebook Outline:**

  The rulebook will have two parts:

  **Part 1: Committee Procedure for Petitions**
  - How petitions are submitted (deadline, form).
  - The meeting where petitions are discussed (open to the public?).
  - The steps the committee takes (as above) to decide.
  - The tie-breaker rule and stopping rule.
  - How decisions are documented and published.

  **Part 2: Table-Level Eligibility Determination**
  - The base rule: "Any city resident aged sixteen [or fifteen, if changed] or over may vote and propose projects, provided they can show proof of residency from the approved list."
  - The list of approved non-resident categories (if any) and the documentation required for each.
  - The flowchart for volunteers (with steps as above).
  - What to do if someone doesn't fit: give them a petition form for next cycle and turn them away.
  - Documentation recording requirements.

  **Note:** The committee must review the rulebook each cycle and update based on petitions and experience.
answer: |-
  ### Eligibility Procedure for Participatory Budgeting

  #### **Committee-Level Procedure (for Deciding Petitioned Categories)**
  This procedure is run once per cycle to evaluate petitioned groups. The committee must decide whether to:  
  - **Admit** (full rights: propose and vote),  
  - **Admit with restrictions** (e.g., propose only; vote only on projects affecting their area; advisory ballot), or  
  - **Refuse**.  

  **Steps:**  
  1. **Define the group’s claim** (Operationalizes: *Principle identification*)  
     - What principle(s) does the group invoke? (e.g., all-affected interests, all-subjected-to-the-rules, contribution, capacity).  
     - *Sufficient answer*: A clear link between the group and one or more principles (e.g., "Commuters invoke all-affected interests because they use city infrastructure daily").  
     - *Fact/value*: Mixed. Fact (empirical impact), but principle selection is value-based.  
     - *Handoff to committee*: Always – this step frames the debate.  

  2. **Assess verifiability** (Operationalizes: *Practical feasibility*)  
     - Can membership be proven with zero budget? Require documentation that is accessible, low-cost, and protects privacy.  
     - *Sufficient answer*: A list of acceptable documents (e.g., pay stub for commuters; school ID for minors). If no feasible documentation exists, the group cannot be included.  
     - *Fact/value*: Primarily fact-based (what documents exist?).  

  3. **Weigh principles and conflicts** (Operationalizes: *Tie-breaking*)  
     - If principles conflict (e.g., all-affected vs. residency), apply tie-breaker:  
       - **Primary principle**: Residency-based membership (the default, as it aligns with municipal elections and avoids parallel electorates).  
       - **Secondary principle**: All-affected interests (for restricted roles only).  
     - *Sufficient answer*: A justified ranking (e.g., "Residency overrides affected interests for voting, but affected interests may grant proposing rights").  
     - *Fact/value*: Value judgment disguised as technical prioritization.  

  4. **Determine restrictions** (Operationalizes: *Mitigation of overreach*)  
     - If admitted, assign restrictions based on:  
       - Strength of claim (e.g., "Vote only on local projects" for narrowly affected groups).  
       - Practicality (e.g., "Advisory ballot" if verification is weak).  
     - *Sufficient answer*: A role matching the principle (e.g., all-affected → advisory; all-subjected → full rights).  
     - *Fact/value*: Value-based (how much voice is "fair"?).  

  5. **Stopping rule**  
     - Debate ends after 60 minutes per petition. Vote by majority. If tied, the group is **refused** (avoids indecision; defaults to status quo).  

  6. **Documentation**  
     - Publish a brief for each decision:  
       - Group description.  
       - Principles considered.  
       - Verifiability assessment.  
       - Decision and restrictions (if any).  
       - Rationale for overrides (e.g., "Residency prioritized over affected interests due to legal constraints").  

  **Tie-breaker for conflicting principles**:  
  - Residency > All-subjected > Contribution > All-affected > Capacity.  
  - Rationale: Residency is legally safest (avoids parallel electorate concerns) and simplest operationally.  

  ---

  #### **Table-Level Flowchart (for Volunteers)**  
  Volunteers use this with each petitioner. Time limit: 3 minutes. Requires only the rulebook and a document checklist.  

  **Steps:**  
  1. **Residency check** (Operationalizes: *Membership*)  
     - Ask: "Is your primary residence within city limits?"  
     - *Sufficient proof*: One document from List A (e.g., utility bill, lease, state ID). If yes and age ≥16 → **Admit (full)**. If no → Proceed to Step 2.  
     - *Fact/value*: Fact-based (document verifies residency).  

  2. **Committee-approved category check** (Operationalizes: *Committee’s value judgments*)  
     - Ask: "Do you belong to a pre-approved group this cycle?" (e.g., "University students" if committee admitted them).  
     - *Sufficient proof*: Document from List B (e.g., student ID for students; business license for shop owners).  
     - If documented → **Admit with restrictions** (per committee rules). If not → Proceed to Step 3.  
     - *Fact/value*: Fact-based (document match), but categories reflect value choices.  

  3. **Affected-interests check** (Operationalizes: *All-affected interests*)  
     - Ask: "Is there a specific project on the ballot that directly impacts you?" (e.g., "The repaving project on Maple Street").  
     - *Sufficient proof*: Document linking them to the project (e.g., business license for that street; lease for that neighborhood).  
     - If yes → **Admit to vote only on that project**. If no → Proceed to Step 4.  
     - *Fact/value*: Mixed. Fact (documented link), but "direct impact" is value-laden.  

  4. **Refer to committee** (Operationalizes: *Procedural fairness*)  
     - If Steps 1–3 fail, say: "You may petition the committee for next cycle." Give a pre-printed form.  
     - *No further action*: **Refuse for this cycle**.  
     - *Handoff to committee*: Always.  

  **Stopping rule**: After Step 4, the process ends.  
  **Documentation requirement**: Volunteers record:  
  - Number admitted/refused.  
  - Documents viewed (no copies kept; only a checkbox for "residency doc provided").  
  - For restricted voters: Ballot type (e.g., "Maple Street ballot").  

  **Approved Document Lists**:  
  - *List A (Residency)*: Utility bill, lease, state ID, letter from shelter (if committee admits homeless residents).  
  - *List B (Special groups)*: As per committee’s annual update (e.g., student ID, business license).  

  ---

  ### **Application to Petitions**  
  Using the procedure, the committee evaluates:  

  1. **Commuters** (work in city, live elsewhere):  
     - Step 1 (Principle): Claim all-affected interests (use infrastructure).  
     - Step 2 (Verifiability): Pay stub or employer letter possible → Feasible.  
     - Step 3 (Tie-breaker): Conflicts with residency (primary principle).  
     - Step 4 (Restrictions): Could offer "advisory ballot" or "vote on transport projects."  
     - Outcome: **Refused** (no restrictions). *Rationale*: Residency is primary; commuters vote in their home municipalities.  

  2. **Undocumented residents** (long-term, no verifiable address):  
     - Step 1 (Principle): All-subjected (subject to laws) and membership (de facto residents).  
     - Step 2 (Verifiability): No accessible documents without city registration → Not feasible.  
     - Outcome: **Refused**. *Rationale*: Cannot verify residency or identity without documents.  

  3. **Fifteen-year-olds** (enrolled in schools):  
     - Step 1 (Principle): Membership (residents) and capacity (enrolled minors may have competence).  
     - Step 2 (Verifiability): School ID or birth certificate → Feasible.  
     - Step 3 (Tie-breaker): Conflicts with age threshold (currently 16).  
     - Outcome: **Admit with full rights** (and lower voting age to 15). *Rationale*: Capacity is negotiable; verifiable via school ID.  

  **Contradiction in Your Commitments**:  
  - You expect to admit 15-year-olds and refuse commuters. This **contradicts all-affected interests**. Commuters are deeply affected by infrastructure (e.g., roads), while 15-year-olds may be less affected by some projects (e.g., senior centers). By prioritizing residency over affectedness, the outcome privileges membership.  
  - **To reverse honestly**: Change the tie-breaker to prioritize all-affected interests over residency. Amend the rulebook to:  
    - *Primary principle*: All-affected interests.  
    - *Table-level Step 1*: Ask, "Are you significantly affected by city projects?" (with commuter pay stub as proof).  
    - *Result*: Commuters admitted (full or restricted), 15-year-olds possibly refused if capacity is questioned.  

  ---

  ### **Critical Flaws and Laundered Judgments**  
  **Value judgments disguised as technical criteria**:  
  - **Table-Level Step 1**: "Primary residence" operationalizes *membership* but ignores non-resident stakeholders.  
  - **Committee Tie-breaker**: "Residency > All-affected" is a value choice favoring stability over inclusion.  
  - **Age threshold**: "16 or over" launders contested ideas about capacity.  

  **The boundary problem’s undecidables**:  
  - No theory resolves:  
    - **Which principle is supreme?** (Residency vs. affectedness).  
    - **Age of capacity**.  
    - **Verifiability vs. inclusion** (e.g., undocumented residents).  
  - The committee simply *chooses* based on practicality and values.  

  **Structurally excluded parties**:  
  - Future residents (no mechanism to represent them).  
  - Nonhuman interests (e.g., environmental impacts).  
  - Taxpayers in other jurisdictions (e.g., state/federal funders).  
  - Groups without documents (e.g., homeless without shelter letters).  

  ---

  ### **Justification Paragraph for Those Turned Away**  
  "We recognize your interest in shaping our city. Our rules prioritize residents because they live with the outcomes of these projects daily. We also consider others with strong ties, like business owners or those affected by specific projects, but must balance this with clear, fair rules. Unfortunately, we can’t include everyone this cycle. We’ve noted your request for the committee to review next year. Thank you for your understanding and community spirit."  

  *(Plain language, acknowledges exclusion, and offers a path forward without theoretical jargon.)*  

  ---  
  This procedure balances theory with pragmatism, centers residency as the default to avoid legal risks, and explicitly flags where values dictate outcomes. It meets your operational constraints while exposing the boundary problem’s inherent tensions.
