  - `scoring_and_reveal` (string) — how tokens convert, how the true target is tracked secretly, what the final reveal shows
  - `control_condition` (string) — how the good-proxy table works and how the constitutive twist bites
  - `debrief_beats` (array of objects: `{beat, minutes, maps_onto}`)
  - `first_run_failures` (array of objects: `{failure, why_it_happens, fix}`)
  - `cannot_reproduce` (array of objects: `{feature, what_facilitator_must_supply}`)
