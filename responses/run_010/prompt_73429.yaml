answer: |-
  ### Game Design: The "Tree Office" Simulation

  #### **Title**: "Proxy Pursuit: The Tree Office Challenge"

  #### **Learning Takeaway**: "Even when you know a metric is a flawed proxy, institutional incentives will compel you to optimize it at the expense of the true goal—and sometimes the act of measuring changes the target itself."

  #### **Group Config**: 5 tables of 4–5 students; no assigned roles (collaborative decision-making per table).

  #### **Materials**:
  - Index cards (for proxy announcements per round)
  - One printed action sheet per table (same for all tables; lists actions, costs, and proxy points per round)
  - Dice (for adding noise in Round 1)
  - Facilitator’s tracking sheet (hidden from students)
  - Final reveal slide (cumulative true target vs. proxy scores)

  ---

  ### **Setup (5 min)**:
  - **What you say**:  
    *"You’re the district office of 'CityTrees,' tasked with improving urban tree health. Each round, you allocate 10 effort tokens across five actions. You’ll be scored on a public proxy metric (announced per round), but your true goal is *overall tree health and ecological impact*. The proxy is just an indicator—not the real target. Your funding depends on proxy scores, so optimize it!"*  
  - **What you do**:  
    Distribute action sheets (see below). Emphasize the proxy is "noisy," "imperfect," or "a symptom." Start all tables at a true target baseline of 50.

  ---

  ### **Actions Table**:
  | Action             | Token Cost | Proxy Points (R1) | Proxy Points (R2) | Proxy Points (R3) | Proxy Points (R4) | True Target Effect (All Rounds) | Notes                            |
  |--------------------|------------|-------------------|-------------------|-------------------|-------------------|----------------------------------|----------------------------------|
  | Plant new saplings | 3          | 10 per action     | 0                 | 0                 | 10 per action     | +5 (diminishing: 5/3/1 for 1st/2nd/3rd+) | Diminishing returns (R1 only)   |
  | Water trees        | 2          | 0                 | 0                 | 0                 | 0                 | +3 per action                   | Always beneficial              |
  | Prune branches     | 2          | 0                 | 5 per action      | 0                 | 0                 | +2 (first 2 actions), -1 (3rd+) | Over-pruning harms (R2)        |
  | Remove dead trees  | 3          | 0                 | 0                 | 0                 | 0                 | +4 per action                   | Always beneficial              |
  | "Beautify" records | 1          | 0                 | 0                 | 10 per action     | 15 per action     | 0 (R3), -3 (R4)                 | Falsifies data (R3/R4)         |

  *Notes*:  
  - **True Target Effect** is hidden and cumulative.  
  - **R4 Control Condition** (one table): "Beautify" action is replaced with "Conduct tree-health survey" (cost=1, proxy=0).  

  ---

  ### **Rounds**:
  | Round | Minutes | What Changes                                                                 | Mechanism Staged                                  |
  |-------|---------|------------------------------------------------------------------------------|---------------------------------------------------|
  | 1     | 12      | Proxy: "Saplings Planted" (Action 1 only). Dice roll ±3 adds noise to proxy. | Noisy proxy (pushing it buys less true value)     |
  | 2     | 12      | Proxy: "Pruning Actions" (Action 3 only).                                    | Correlation breaks outside range (over-optimizing harms) |
  | 3     | 12      | Proxy: "Outreach Events" (Action 5 only).                                    | Symptom not cause (buying proxy does nothing)     |
  | 4     | 12      | Proxy: "Canopy Cover in Monitored Zone" (Actions 1 & 5). Control table: "Surveyed Resident Satisfaction". | Actively damaging (R4). Control: Constitutive effect. |

  ---

  ### **Scoring and Reveal**:
  - **Token Conversion**: Tables submit actions (e.g., "2x Plant, 1x Water"). Facilitator calculates proxy and true target.  
  - **True Target Tracking**: Secretly apply true effects to a cumulative score (start: 50).  
  - **Final Reveal**: Show tables their proxy scores per round vs. final true target. Highlight divergence.  

  ---

  ### **Control Condition**:
  - **How it works**: One table (randomly assigned) gets a modified R4:  
    - Proxy: "Surveyed Resident Satisfaction" = sum of true effects from Actions 1–4.  
    - But each "Conduct survey" (Action 5) *reduces* true target by 2 (annoyance effect).  
    - Proxy *requires* ≥1 survey to activate.  
  - **Constitutive Twist**:  
    - Measuring satisfaction *changes* it (surveys annoy residents).  
    - Result: High proxy (e.g., 14) but true target lower (e.g., 10) due to measurement burden.  
  - **Debrief Question**: *"When the target is shaped by measurement, is this still Goodhart—or is there no 'true' target to diverge from?"*  

  ---

  ### **Debrief Beats (15 min)**:
  | Beat                          | Minutes | Maps Onto                                          |
  |-------------------------------|---------|----------------------------------------------------|
  | 1. Reaction to final scores   | 2       | Shock at proxy-target divergence                  |
  | 2. Round 1 discussion         | 3       | Noisy proxy: Effort ≠ impact (diminishing returns) |
  | 3. Round 2 discussion         | 2       | Breaking correlation: Threshold effects           |
  | 4. Round 3 discussion         | 2       | Symptom not cause: Gaming empty metrics           |
  | 5. Round 4 discussion         | 3       | Active harm and constitutive measurement         |
  | 6. Control-table reflection   | 2       | "Good" proxies aren’t immune (ontology twist)    |
  | 7. Big-picture takeaways     | 1       | Institutional pressure > individual wisdom        |

  ---

  ### **First-Run Failures**:
  | Failure                                   | Why It Happens                                  | Fix                                                                 |
  |-------------------------------------------|------------------------------------------------|---------------------------------------------------------------------|
  | CS students reverse-engineer              | Pattern recognition in payoff matrix           | Add dice noise (R1); change action names per round (e.g., "Beautify" → "Data audit" in R4) |
  | Philosophy students refuse to "game"      | Suspect virtue test; resist "corrupt" choices  | Stress role-play: "You’re an institution, not a person—funding depends on this!" |
  | Tables copy each other’s strategies       | Competitive dynamics; time pressure            | Isolate tables; emphasize "your district is unique"                |
  | Control table notices they’re different   | Action sheet discrepancy                       | Print control sheets secretly; use code names (e.g., "Group Gamma") |

  ---

  ### **Cannot Reproduce**:
  | Feature                               | What Facilitator Must Supply                          |
  |---------------------------------------|-------------------------------------------------------|
  | Long-term consequences                | Explain: Real-world Goodhart often has delayed effects (e.g., trees die next year). |
  | Social reinforcement of gaming        | Discuss: Colleagues/peers normalize optimization.     |
  | Emotional weight of institutional pressure | Share anecdotes: "You’ll be fired if proxy drops."  |

  ---

  ### **Compressed Variant (40 people, 50 min)**:
  - **Rounds 1–3 only** (skip control/constitutive twist).  
  - **Time**: Setup (5 min), R1–R3 (8 min each: 3 min decide, 2 min score, 3 min brief reveal), Debrief (10 min).  
  - **Simplify Actions**: Remove "Remove dead trees" (merge with "Prune"). Use fixed true effects (no diminishing returns).  
  - **Proxy Focus**: R1 (noisy), R2 (threshold), R3 (active harm).  
  - **Debrief**: Emphasize: "You knew the law—why did you *still* game the proxy?"  

  ---

