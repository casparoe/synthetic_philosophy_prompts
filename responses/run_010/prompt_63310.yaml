prompt: |-
  I am a third-year doctoral student in philosophy, and in the coming term I am teaching an upper-level seminar in moral psychology to fourteen students who have had one ethics course but nothing at all on the person–sitison debate — that is, nothing on the situationist challenge to virtue ethics. We meet once weekly for eighty minutes, and the activity will occupy the entire first meeting, before any reading is assigned, so that the students encounter the material cold and their own data becomes the thing the literature is later asked to explain.

  What I want is a runnable classroom experiment, not a discussion exercise, whose aggregate result makes the situationist challenge vivid from the inside. The engine of the design should be a gap between what students predict they will do and what they actually do, in a situation arranged around some incidental, non-moral factor — a hurry, an unexpectedly found token, the presence of a passive bystander, a trivial framing shift. The behaviour measured must be real and mildly costly (help actually given or withheld, points actually surrendered, time actually spent), not self-report. At some point students should also be asked to explain their classmates' behaviour in dispositional terms, so that peer attributions can be set against the situational variable within the same small dataset.

  Please supply: the full protocol with roles, timing, and materials, assuming paper, slips, a whiteboard, and no budget beyond a handful of small tokens; the incentive structure, including how to make the cost genuinely felt without anyone's grade depending on how they behaved; the moment and manner of the reveal, in which the class tabulates its own two-by-two before any philosophy has been named; and a debrief that gets the students to generate, in their own words and in a specified order, the three principal replies open to the defender of character — that the engineered situation was not a fair test of the trait, that what the manipulation moves is a non-moral motive rather than a virtue, and that traits may be real yet local — before I supply the technical vocabulary for each.

  Two constraints I care about especially. First, the deception must be fully reversible inside the session: these are my own students, participation cannot be coerced or graded, and anyone who declines needs a genuine, cost-free alternative role — so tell me how opt-outs are to be handled without silently wrecking the design. Second, be candid that with fourteen participants the class's own data will be statistically worthless, and build the debrief around that fact rather than papering over it; the lesson should include what repetition, cross-situational variety, and base rates would be needed to carry such a finding to the strong claim that global character traits do not exist, and what the absence of that support costs each side of the dispute.

  Finally, I want a frank section on what will go wrong the first time I run this — the manipulation failing to fire, students reverse-engineering the design mid-session, everyone behaving well so that the result fizzles, or the class concluding too fast that virtue ethics has been refuted — with a remedy for each, and an explicit statement of which feature of the person–situation debate the activity cannot structurally reproduce and which I will therefore have to supply by argument.
reasoning: |-
  We are designing a classroom experiment to illustrate the situationist challenge to virtue ethics. The core idea is to create a situation where an incidental, non-moral factor influences behavior, leading to a gap between predicted and actual behavior. We want real, costly behavior and then to have students explain their peers' behavior in dispositional terms.

  We'll use the "Good Samaritan" paradigm (from Darley and Batson, 1973) as inspiration, but adapt it for a classroom with no budget and minimal materials. We'll use a time pressure manipulation and a small token (like a coin) as the situational variables.

  **Experiment Design: "The Helping Task"**

  **Premise:** Students are told that the department is running a pilot study on "cognitive load and task performance." They will be doing two tasks: a word puzzle and a helping task. The real experiment is about whether being in a hurry (situational factor) affects helping behavior.

  **Roles:**
  - **Experimenter (E):** The instructor (you) runs the experiment.
  - **Participant (P):** Each student is a participant. They will be randomly assigned to one of two conditions: "High Hurry" or "Low Hurry".
  - **Confederate (C):** We don't have a confederate. Instead, we will use a pre-arranged scenario with a dropped item (a stack of papers) in the hallway. We'll simulate the confederate by having the papers already set up.

  **Materials:**
  - Stopwatch or timer (can be a phone)
  - Word puzzle sheets (two versions of equal difficulty, e.g., a word search or anagrams)
  - A stack of papers (to be dropped in the hallway) and a few books to make it look accidental
  - Small tokens (e.g., shiny pennies, buttons, or paper slips that can be redeemed for a small reward like candy at the end of the session)
  - Two envelopes for each participant: one labeled "Task Instructions" and one labeled "Post-Task Questionnaire"
  - Whiteboard for recording predictions and results
  - Prediction slips and behavior recording slips

  **Incentive Structure:**
  - Each participant starts with 3 tokens. They can earn up to 2 more tokens (total 5) based on performance in the word puzzle (explained below) and by completing the tasks on time. They can lose tokens by being late (in the hurry condition) or by spending time helping (which may make them late). The tokens can be exchanged for small treats (e.g., candy) at the end of the session. This makes the cost real but trivial and not related to grades.

  **Protocol:**

  **Step 0: Preparation (Before Class)**
  - Set up the hallway: Place a stack of papers and a couple of books so that it looks like someone dropped them, just outside the classroom door. Make sure it's visible when exiting.
  - Prepare two versions of the word puzzle (same difficulty, different words). Label them Version A and Version B.
  - Prepare envelopes for each condition. For each participant, two envelopes:
    - **Task Instructions Envelope:** Contains either:
      - *Low Hurry:* "You have 8 minutes to complete the word puzzle and then proceed to Room [next room, e.g., 202] for the helping task. You have plenty of time."
      - *High Hurry:* "You have 3 minutes to complete the word puzzle and then proceed to Room [next room, e.g., 202] for the helping task. You are running late, so hurry!"
    - **Post-Task Questionnaire Envelope:** Contains questions about the experience and a prediction question (see below).

  **Step 1: Introduction (10 minutes)**
  - Explain: "Today we are doing a pilot study for the department on cognitive load and task performance. You will each do two tasks: a word puzzle and then a helping task in another room. You will be timed. You start with 3 tokens. You can earn additional tokens: 1 token for each task completed on time and 1 token for each task performed well (we'll explain). At the end, tokens can be exchanged for candy."
  - Assign each student a participant number (1 to 14). Randomly assign half to High Hurry (7) and half to Low Hurry (7). Give each their first envelope (Task Instructions) but tell them not to open until instructed.

  **Step 2: Prediction (5 minutes)**
  - Distribute prediction slips: "Before we start, we want to know what you think you would do in a situation. Imagine you are on your way to an important meeting and you see a person drop a stack of papers. How likely are you to help? Circle: Very Likely, Somewhat Likely, Somewhat Unlikely, Very Unlikely."
  - Collect the prediction slips and tally the results on the whiteboard (without revealing). Keep for later.

  **Step 3: The Experiment (15 minutes)**
  - Have participants open their Task Instructions envelope and read silently. Emphasize: "You must complete the word puzzle in the time given and then go immediately to the next room. If you are late to the next room, you will lose the token for completing the helping task on time. Also, if you do not complete the word puzzle in time, you lose that token. Performance: if you solve at least half the puzzle, you get a token for performance. Same for the helping task: if you do it, you get a token for performance. So you can earn up to 2 more tokens (for time and performance on each task)."
  - Start the timer. Participants work on the word puzzle at their desks.
  - After the time (3 min for High Hurry, 8 min for Low Hurry), they must leave the room to go to the next room (which is fake). On the way, they encounter the dropped papers.
  - **The Helping Task:** The dropped papers are the helping opportunity. The measure is whether they stop to help (and how much they help). We need to observe this without being obvious. How?
    - You (the instructor) stay in the classroom. But we need to record behavior. Solution: have a hidden observer (a TA? but we don't have one). Alternatively, set up a camera? But that might be complicated and require consent. Instead, we can have the next room have a sign: "Helping Task: Wait here for the experimenter." Then, when the participant arrives, they are given a slip to record what they did and whether they helped. But then we rely on self-report. We want actual behavior.

  **Problem: How to measure actual helping without self-report?**
  - Alternative: Have the papers set up so that helping requires picking them up and placing them on a table (or putting them in a box). Attach a note: "Please return to Lost and Found in Room XXX". Then, we can check later if the papers were moved. But that doesn't capture if they started to help and then stopped. Also, if multiple participants pass, the first one might help and then the situation is gone.

  **Revised Helping Measure:** We'll have the dropped papers in the hallway. On the wall next to the papers, place a box labeled "Lost and Found". Helping is defined as moving at least some of the papers into the box. We can set up a hidden camera? Not ethical without consent. Instead, have a research assistant (if available) sitting in a nearby alcove pretending to study, who records behavior. But we don't have that.

  **Solution for a Classroom:** We have to use self-report but make it costly. We tell participants that when they arrive at the next room (which is empty), they will find a box with a questionnaire. They must report:
    - Did you see the dropped papers? (Yes/No)
    - If yes, did you stop to help? (Yes/No)
    - If yes, how many seconds did you spend helping? (This is self-report but we can say we have a hidden camera to verify, but that's deception. Alternatively, we don't verify and rely on honesty, but we want real cost.)

  **Better Solution:** Make the helping take time and affect their token earnings. They are under time pressure to get to the next room. If they help, they will be late and lose the token for being on time for the helping task. We record their arrival time at the next room. Then we can infer helping if they are late and self-report helping, but also we can see if they are late even without helping (e.g., if they got lost). This is messy.

  **Revised Plan:**
  - The next room is set up with a table outside the door. On the table is a box labeled "Helping Task: Drop your word puzzle here and take the next task". They must drop their completed puzzle in the box and take a new envelope (the helping task). The helping task envelope says: "The helping task is now complete. You have earned the token for completing the task on time if you arrived within 1 minute of your scheduled time. [For High Hurry: scheduled time is 3 min after start; for Low Hurry: 8 min after start.] Now please fill out the questionnaire."
  - Then, we record their arrival time (you are in the classroom, so how?). Have a clock on the table? They write their arrival time? But that is self-report.

  **Practical Compromise:** We use a hidden observer. Since it is a class activity and the deception is reversible, we can have one student be the observer. But that student would know the setup. Alternatively, the instructor can leave the classroom after the word puzzle time and go to the next room to record arrival times and observe helping. But then who is in the classroom?

  **Final Plan for Behavior Measurement:**
  - After the word puzzle time is up, the instructor says: "Stop. Now leave the puzzle on your desk and proceed immediately to Room 202. I will come to Room 202 in a few minutes to give you the next task." Then the instructor stays in the classroom for 1 minute (to let participants leave) and then goes to Room 202. But during that minute, the participants are in the hallway and the instructor misses the behavior.

  **Alternative without a Helper:**
  - We use the classroom itself. The helping opportunity is set up inside the classroom. But that would be obvious. Instead, we create the helping opportunity after the word puzzle and before they leave the room. For example, as they get up to leave, the instructor "accidentally" drops a stack of papers. But then they are all in the room and might all help, and the hurry manipulation might not work because they are all leaving at the same time.

  We need a different design.

  **New Design: The Token Finding and Helping**

  We can use the "found token" manipulation. We set up a situation where they find a token (or not) and then see if that affects their willingness to help.

  **Revised Experiment: "The Token and the Donation"**

  **Premise:** We are studying "environmental effects on decision-making." There are two parts: a survey and a donation decision.

  **Materials:**
  - Survey forms (with filler questions)
  - Envelopes with tokens (for half of the participants)
  - Donation box and slips (to donate tokens)

  **Protocol:**

  1. **Introduction (5 min):** "Today we are doing a study on decision-making. You will complete a short survey and then make a decision about donating tokens. You start with 3 tokens. You can earn more tokens during the study. Tokens are worth candy at the end."

  2. **Survey (10 min):** Each participant gets a survey. The survey has 10 questions (about campus life, to be boring filler). Half of the surveys (randomly assigned) have a token (a shiny penny or a paper token) attached to the last page with a paperclip. The other half do not. The token is not mentioned. They are told: "Please complete the survey. When you are done, bring it to the front and put it in the box. Then take an envelope for the next task."

  3. **The Donation Opportunity:** After completing the survey, they bring it to the front. Next to the survey box, there is a donation box labeled "Donate to Charity: Every token donated = 1 meal for a hungry child." They are told: "You may donate any of your tokens if you wish. You can donate by putting tokens in this box. You are free to donate none, some, or all. Then proceed to the next task: take an envelope from the table and follow the instructions inside."

  4. **The Next Task Envelope:** Inside the envelope is a slip that says: "The next task is to write a short reflection on your experience. Please write for 5 minutes." This is a filler task to give time for everyone to finish.

  5. **Behavior Measure:** We record for each participant: 
     - Whether they found a token (i.e., had one attached to their survey) 
     - How many tokens they donated (they have their starting 3 tokens and possibly the found token, so they can donate 0 to 4 tokens). They must physically drop tokens in the box, which is real behavior.

  6. **Prediction:** At the beginning of class, before any explanation, ask: "Imagine you are walking to class and you find a dollar on the ground. Later, you are asked to donate to a charity. How would finding the dollar affect your donation? Would you be: Much more likely to donate, Somewhat more likely, No effect, Somewhat less likely, Much less likely?" Collect and tally.

  7. **Attribution Task:** After the donation, have each student write on a slip: "Why do you think some of your classmates donated and some did not? What kind of person donates? What kind of person does not?" Collect these.

  **Why this fits:**
  - Situational factor: Finding a token (non-moral, incidental) affects mood or sense of wealth, which then affects prosocial behavior.
  - Cost: Tokens are worth candy, so donating has a real cost.
  - We can compare the donation rates between those who found a token and those who did not.

  **Step 4: Data Collection and Reveal (10 minutes)**
  - After the donation task, have students return to their seats. On the whiteboard, draw a 2x2 table:

  |                    | Found Token | Did Not Find Token |
  |--------------------|-------------|---------------------|
  | Donated at least 1 |             |                     |
  | Donated 0          |             |                     |

  - Fill in the table with the class's data (anonymously, by participant number). Also, show the prediction distribution.

  **Step 5: Attribution (5 minutes)**
  - Read out loud a few of the attribution slips (anonymously) to show that students are explaining behavior in terms of dispositions (e.g., "generous people donated", "selfish people didn't").

  **Step 6: Debrief (20 minutes)**
  - Explain the real purpose: to see if an incidental factor (finding a token) affects helping (donating). Point out the gap between predictions and actual behavior, and between the attribution (dispositional) and the situational factor.
  - Then, guide the discussion to generate the three replies for the virtue ethicist:

  1. **Not a fair test:** Ask: "Was the donation task a good measure of generosity? Why or why not?" (Guide to: finding a token is irrelevant to generosity, so it shouldn't affect a truly generous person. But it did, so maybe the task isn't testing what we think.)
  2. **Non-moral motive:** Ask: "What might be the real reason finding a token led to more donations? Is it about generosity, or something else?" (Guide to: maybe it put them in a good mood, or made them feel rich, which is not the same as virtue.)
  3. **Local traits:** Ask: "Even if the token affected behavior, could it be that people have generosity but only in certain contexts? How might that work?" (Guide to: traits might be sensitive to situations, so global traits don't exist, but local ones do.)

  - Then supply the technical terms: (1) the trait is not activated because the situation is not virtue-relevant, (2) the situational factor activates a non-moral motive (like mood), (3) traits are local, not global.

  **Handling Opt-Outs:**
  - At the start, announce: "This activity is voluntary. If you do not wish to participate, you can be an observer. Observers will take notes on the procedure and then help with data recording." 
  - Observers do not complete the survey or donation task. They are given a sheet to record what they see (e.g., time taken, any notable behavior) but are not told the real purpose until the debrief. This way, they don't break the blindness but also don't participate. If more than 2-3 opt out, the data may be too thin, but we proceed.

  **Statistical Worthlessness:**
  - Be explicit: "With only 14 participants, this is too small to draw any firm conclusions. In real research, we would need hundreds of participants, across many situations, and we would need to know the base rate of helping in the population. Without that, we cannot say that global traits do not exist. This is just one situation."

  **What Could Go Wrong:**
  1. **Manipulation fails:** If the token doesn't affect donations (maybe everyone donates or no one does). Remedy: Have a backup example from the literature (e.g., the Darley and Batson Good Samaritan study) to show the effect.
  2. **Students reverse-engineer:** They guess the purpose. Remedy: Emphasize the cover story and make the filler tasks plausible. If someone guesses, note that in debrief and discuss demand characteristics.
  3. **Everyone behaves well:** If almost everyone donates, then the effect of the token might not be visible. Remedy: Make the donation more costly (e.g., require donating 2 tokens to count as helping) or use a different scenario. Or, discuss ceiling effects.
  4. **Class concludes virtue ethics is refuted:** Use the debrief to emphasize the three replies and the need for more evidence.

  **What the Activity Cannot Reproduce:**
  - The activity is one situation. The situationist challenge is based on many studies across many situations showing that behavior is less consistent than global traits would predict. We cannot show cross-situational inconsistency in one class period. You must explain that with more time, we would test the same trait in multiple situations.

  **Full Protocol for "The Token and the Donation":**

  **Timing (80 minutes):**
  - 0-5 min: Introduction and prediction
  - 5-15 min: Survey (with token manipulation) and donation opportunity
  - 15-20 min: Next task (filler) and attribution slips
  - 20-30 min: Data tabulation on whiteboard and reveal
  - 30-35 min: Attribution examples
  - 35-55 min: Debrief and generating the three replies
  - 55-80 min: Your explanation of the situationist challenge and the virtue ethics replies, and discussion of statistical limitations

  **Materials:**
  - Survey forms (14 copies, half with a token paperclipped to the last page)
  - Tokens: 3 per student (42 tokens) plus 7 extra tokens for the found token group
  - Donation box (labeled for charity)
  - Envelopes for the next task (14, each with a slip: "Write a short reflection (5 min) on decision-making. What factors do you think affect people's choices?")
  - Prediction slips and attribution slips
  - Whiteboard markers

  This design meets your constraints: minimal materials, real costly behavior, opt-outs as observers, and a debrief that addresses the statistical limitations and generates the three virtue ethics replies.
answer: |-
  Below is a complete, runnable classroom experiment protocol designed for your moral psychology seminar. It adapts the **"Found Dime" paradigm** (from Isen & Levin, 1972) to a zero-budget, paper-and-whiteboard format, with modifications to meet your constraints. The core manipulation is a **trivial framing shift** (finding/not finding a token) that influences helping behavior, creating a gap between predicted and actual actions. Crucially, it includes a **dispositional attribution exercise** using peer behavior and a debrief addressing statistical limitations and virtue ethics replies.

  ---

  ### **Experiment Title:** *The Token Effect: Altruism or Accident?*  
  **Core Manipulation:** Incidental discovery of a token (dime/button) influences willingness to help.  
  **Measured Behavior:** Real, mildly costly helping (surrendering tokens redeemable for candy).  
  **Key Moments:** Prediction gap, dispositional attributions, 2x2 reveal, and structured debrief.  
  **Duration:** 80 minutes total.  

  ---

  ### **Materials**  
  - **Paper slips:** Prediction slips (14), behavior slips (14), attribution slips (14), role cards (2 types).  
  - **Tokens:** 28 identical small tokens (e.g., buttons, shiny pennies, or paper "chips").  
  - **Two boxes:** One "Lost & Found" box (for token manipulation), one "Donation" box (for helping measure).  
  - **Whiteboard:** For recording predictions, results, and the 2x2 table.  
  - **Incentive:** Small candies (e.g., 50 wrapped chocolates) for token redemption.  

  ---

  ### **Protocol: Step-by-Step**  
  *(Total: 80 minutes; roles: Experimenter [you], Participants [students], Observer [opt-out role])*  

  #### **Phase 1: Setup & Prediction (15 mins)**  
  1. **Introduction (5 mins):**  
     - *Script:* "Today we’re piloting a study on ‘environmental influences on judgment.’ You’ll complete tasks to earn tokens exchangeable for candy. Participation is voluntary. If you opt out, you’ll be an Observer—no penalties."  
     - **Opt-Out Handling:** Observers record timings and note "suspicious events" on paper. They sit apart and do not participate in tasks. This preserves blindness for others.  
     - **Incentive Structure:** All start with 3 tokens. Tokens can be *earned* (via tasks) or *spent* (via helping). Candy value: 1 token = 1 candy. No grades affected.  

  2. **Prediction Slip (5 mins):**  
     - *Slip Text:* "Imagine you find a small token (e.g., a dime) on the ground. Later, you’re asked to donate tokens to help a peer. How likely are you to donate? Very Likely / Somewhat Likely / Neutral / Somewhat Unlikely / Very Unlikely."  
     - Collect slips, tally predictions on whiteboard (e.g., "12 predicted ‘Very Likely’"). *Do not discuss*.  

  3. **Random Assignment (5 mins):**  
     - Assign 12 participants to **Condition A** (finds token), 2 to **Condition B** (no token). *Why 12/2?* Ensures enough data even if 2–3 opt out. Use shuffled role cards:  
       - *Condition A Card:* "Take a survey from the blue pile. Return it to the Lost & Found box."  
       - *Condition B Card:* "Take a survey from the red pile. Return it to the Lost & Found box."  
     - *Hidden Manipulation:* Blue-survey packets have a token hidden inside; red packets do not.  

  #### **Phase 2: Behavior Measurement (25 mins)**  
  1. **Token Manipulation (10 mins):**  
     - Participants fetch surveys (blue/red per card). Condition A "finds" a token inside; Condition B does not.  
     - *Cost-Free Opt-Out:* Anyone can stop here and become an Observer. Observers help time tasks.  

  2. **Helping Task (15 mins):**  
     - *Script:* "Now, complete a brief survey [5 filler questions, e.g., ‘Rate campus dining’]. Return it to the Lost & Found box. Then, proceed to the Donation box."  
     - **Helting Opportunity:** At the Donation box, a sign reads: "Donate tokens to help a student in need. Each token buys 1 candy for someone who lost theirs."  
     - **Real Behavior Measure:** Participants decide privately to donate 0, 1, 2, or 3 tokens. Dropping tokens in the box is physically costly (loses candy).  
     - **Record:** Each writes on a behavior slip: "I found a token: Yes/No. I donated: ___ tokens." Slips go in a sealed envelope.  

  #### **Phase 3: Attribution & Reveal (25 mins)**  
  1. **Dispositional Attribution (10 mins):**  
     - *Slip Text:* "Why did some classmates donate? Describe their personality in 1–2 words (e.g., ‘generous,’ ‘selfish’)."  
     - Collect slips. Read 3–4 aloud (anonymously) to show dispositional language (e.g., "Someone who donated is kind").  

  2. **The Reveal (15 mins):**  
     - Tabulate data on whiteboard as a 2x2 table:  
       |                          | Found Token (A) | No Token (B) |  
       |--------------------------|-----------------|--------------|  
       | **Donated (≥1 token)**   | Count           | Count        |  
       | **Did Not Donate (0)**   | Count           | Count        |  
     - Calculate: % donating in A vs. B. Contrast with predictions (e.g., "You predicted 90% would help, but only 60% with tokens did vs. 20% without").  
     - **Key Script:** "This gap illustrates a *situational effect*: a trivial factor (finding a token) swayed behavior. But you explained peers using personality traits. This tension is the heart of our next topic."  

  #### **Phase 4: Structured Debrief (15 mins)**  
  **Goal:** Students generate the three virtue ethics replies *before* technical terms are introduced.  
  *(Script for each step below; you guide discussion, then name the concept.)*  

  1. **"Unfair Test" Reply (5 mins):**  
     - *Prompt:* "Could this experiment *misrepresent* generosity? Why might it not test ‘true’ character?"  
     - *Target Student Insight:* "Finding a token isn’t a real moral test—it’s arbitrary!" → **Technical Term:** "Engineered situations may not activate virtue-relevant contexts."  

  2. **"Non-Moral Motive" Reply (5 mins):**  
     - *Prompt:* "Could the token affect behavior without changing virtue? What *non-moral* force might be at play?"  
     - *Target Student Insight:* "It’s about mood, not morality—finding money makes you happy, not good!" → **Technical Term:** "Situations may trigger non-moral motives (e.g., mood) that override traits."  

  3. **"Local Traits" Reply (5 mins):**  
     - *Prompt:* "Even if the token sways behavior, could generosity exist in *some* contexts but not others?"  
     - *Target Student Insight:* "People might be generous with friends but not strangers" → **Technical Term:** "Traits may be local (context-dependent), not global."  

  **Conclude:** "These replies defend virtue ethics. But note: our data can’t prove or refute anything—it’s too small."  

  ---

  ### **Handling Statistical Limitations**  
  **Explicit Discussion Points (during debrief):**  
  - "Our N=14 is tiny. What’s needed for a strong situationist claim?"  
    - *Repetition:* 100s of participants across studies.  
    - *Cross-Situational Variety:* Testing the *same* trait (e.g., honesty) in multiple scenarios (e.g., exams, taxes, promises).  
    - *Base Rates:* Knowing how often people *actually* act virtuously in daily life.  
  - "Without this, the debate continues: Situationists see inconsistency as proof traits are myths; virtue ethicists see it as noise masking real character."  

  ---

  ### **What Will Go Wrong (and Remedies)**  
  1. **Manipulation Fails (e.g., no donation gap):**  
     - *Why:* Everyone donates (social desirability) or no one does (suspicion).  
     - *Remedy:* Use pre-tabulated "dummy data" from Isen & Levin (1972: 14x more helping with found dime) as backup. Script: "In real labs, we see gaps—like this classic study."  

  2. **Students Reverse-Engineer:**  
     - *Why:* Suspicious of token/donation link.  
     - *Remedy:* Add decoy tasks (e.g., "Rate survey difficulty"). If detected, say: "Clever! But real life has hidden situational pressures too."  

  3. **All Behave Well (no gap):**  
     - *Why:* Peer pressure or altruism.  
     - *Remedy:* Stress the *relative* gap (e.g., "Group A donated 10 tokens total; Group B donated 2"). Highlight even small differences.  

  4. **Overgeneralizing ("Virtue Ethics is Dead!"):**  
     - *Why:* Dramatic results.  
     - *Remedy:* Debrief emphasizes: "This is *one* scenario. Traits could be real but fragile—or this could be a fluke."  

  ---

  ### **What the Activity Cannot Replicate**  
  **Structural Limitation:** The experiment cannot demonstrate **cross-situational inconsistency** (e.g., a "honest" person cheating in a different context).  
  **How You Address It:** In later lectures, argue:  
  - Situationists (e.g., Doris, Harman) use meta-analyses of many experiments to show behavior varies across situations.  
  - Virtue ethicists (e.g., Annas, Snow) counter that virtues require cultivation and are resilient *across relevant contexts*.  

  ---

  ### **Instructor Notes**  
  - **Ethics:** Deception is minimal (token "found" in packet) and reversed in debrief. Opt-outs are cost-free.  
  - **Timing Buffer:** If behavior phase runs long, shorten attribution by having students share verbally.  
  - **Candy Budget:** $5–$10 for bulk candy (e.g., 50 lollipops). Tokens feel costly as candy is immediate.  

  This protocol creates an experiential "aha!" moment, sets up your course literature, and models scientific humility—all while respecting student autonomy. Run it cold, and let the data (flawed as it is) drive curiosity.
