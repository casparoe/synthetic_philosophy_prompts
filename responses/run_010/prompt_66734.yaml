  - **Keep**: Perturbation asymmetry (¶3-4), 4-grade ladder (¶5), human sphexishness (¶6 start).  
  - **Trim**: Transmission history (¶6 end), Grade 1 details (¶5), overlong examples (e.g., door-checking).  
  - **Add**: 2–3 sentences engaging the compatibilist reply (Section 3 above).  

