prompt: |-
  You're an expert in formal epistemology and epistemic utility theory — imagine you're the person a forecasting program calls when they want their probability training grounded in something real rather than in slogans. Before you write the deliverable, spend half a dozen lines getting the underlying theory straight for yourself: proper scoring, strict propriety, why an accuracy-seeker's own current credence always looks best to them from where they're sitting. Then write the thing.

  Situation: I teach philosophy but I also advise a small state epi-modeling group. Six analysts, no formal training, they submit probability forecasts monthly and an outside outfit scores them on a Brier-type rule we cant change and have no input into. I want to hand them a reusable audit they can run in about twenty minutes before submitting — steps in order, what counts as passing each step, where the audit stops and they just file the number.

  It has to actually do four things:

  1. Give them a pencil-and-paper way to check a set of numbers hangs together, without any Dutch-book arithmetic and without needing to know what a convex set is.
  2. Confront the immodesty problem head on. Telling them "report your honest credence, it's the one that maximizes your expected accuracy" is useless to a person holding a pen — I need the procedure to say what to do instead, or to admit there's nothing to do.
  3. Have a real step for the evidence question. There's a clean old result to the effect that free evidence is never expected to make an accuracy-seeker worse off, and my analysts violate it constantly by saying "let's just wait for Thursday's report" — but I know it has conditions and I want them stated rather than papered over.
  4. Mark every place where the procedure is judgment wearing a lab coat.

  Then run it on two cases: an analyst sitting on 0.15 for hospital-overflow-by-March who wants to hold it until a report lands Thursday; and two analysts at 0.3 and 0.7 who propose to average and file 0.5. Make the second one come out in a way they will hate.

  Last thing: my own rule of thumb, which I've been handing out for years, is that if you can name a specific piece of evidence that would move you, you're obliged to go look for it before you report. Tell me whether that survives contact with the theory, and if it does, which step of the procedure it belongs in.
reasoning: |-
  We are building an audit procedure for forecasters who need to check their probability assignments before submission. The procedure must be practical, require only pencil and paper, and address specific conceptual issues. We'll ground it in epistemic utility theory.

  ### Theoretical Grounding (for ourselves)
  - **Proper Scoring Rules**: A scoring rule assigns a numerical score to a forecast based on the actual outcome. The Brier score is a common example (quadratic scoring rule). A scoring rule is **proper** if a forecaster maximizes their expected score by reporting their true probability. It is **strictly proper** if the true probability is the unique maximizer.
    
  - **Strict Propriety and Immodesty**: Strict propriety implies that, from the forecaster's current perspective, their own credence is the one that looks best in expectation for minimizing inaccuracy (or maximizing accuracy). This is the "immodesty" property: each credence function recommends itself as optimally accurate from its own vantage point. Hence, telling forecasters to report their honest credence is sound in theory because it maximizes expected accuracy from their current epistemic state.

  - **Evidence Collection**: The "value of information" theorem states that free evidence (costless, noiseless, and relevant) is never expected to decrease accuracy. However, if the evidence is costly, noisy, or if the forecaster is not updating correctly, then it might not hold. Also, if the evidence is not free (e.g., waiting incurs opportunity costs), then waiting might not be beneficial.

  ### The Audit Procedure

  **Step 0: Preparation**
  - Write down the set of mutually exclusive and exhaustive events you are forecasting.
  - Assign probabilities to each event such that they are non-negative and sum to 1. 
    - *Pass condition*: Probabilities between 0 and 1 (inclusive) and sum to 1.
    - *If fail*: Adjust until they do.

  **Step 1: Internal Coherence Check (Avoiding Dutch Books without Arithmetic)**
  - For each event, ask: "If I were to offer a bet that pays $1 if this event occurs, at what price would I be exactly indifferent between buying and selling?" This price should be your probability for that event.
  - Now, check for every pair of events: if you think event A is more likely than event B, then the probability for A must be higher than for B. Also, if you think A is twice as likely as B, then the ratio of probabilities should be 2:1? (Note: We don't require ratio coherence because it's too hard without tools. Instead, we focus on ordinal and additive coherence.)
  - *Alternative simple check*: 
    - For any two events A and B, the probability of (A or B) must be at least the probability of A and at most the probability of A plus the probability of B. 
    - Also, the probability of (A and B) must be less than or equal to the minimum of the probabilities of A and B (if A and B are not mutually exclusive, but in our case events are mutually exclusive, so this is 0). 
    - *Pass condition*: The probabilities for any group of events that together form a partition (e.g., a set of mutually exclusive and exhaustive events) must sum to the probability of the union of that group (which is 1 for the whole set). 
    - *If fail*: Re-examine your probabilities for logical consistency.

  **Step 2: Immodesty Check (Confronting the "What to Report" Problem)**
  - Since the scoring rule is strictly proper, the theory says that your current probabilities are the ones that maximize your expected score. Therefore, you should report them.
  - *But what if you are uncertain about your probability?* The audit does not require you to change your mind. It requires you to report the probabilities that currently represent your credence. If you feel that you might change your mind with more thought, then you are not done with Step 0. 
  - *Procedure*: Ask: "Given what I know right now, are these numbers the best representation of my beliefs?" If yes, then report. If no, then go back to Step 0 and adjust until they are.
  - *Note*: This step does not require calculation. It is a commitment to the current state of your credence.

  **Step 3: Evidence Check (When to Wait for More Evidence)**
  - The rule: Only wait for evidence if the following conditions hold:
    (a) The evidence is free (no cost to wait, no opportunity cost).
    (b) The evidence is relevant (it could change your probability).
    (c) The evidence is expected to improve your score more than reporting now (which requires that you are not certain about what the evidence will say and that you will update correctly).
  - However, the classic result says that free relevant evidence is never expected to make you worse off. Therefore, if (a) and (b) hold, then waiting is expected to be beneficial. But note: 
    - Condition (c) is automatically satisfied if (a) and (b) hold and you update by conditionalization? Not exactly: the result says that the expected score after seeing the evidence (and updating by conditionalization) is at least as high as the score of reporting now. So if you can get the evidence for free and it is relevant, then waiting is better in expectation.
  - *But*: In practice, if the evidence is coming after the forecast is due, then waiting is not an option. Also, if there is a cost (e.g., missing the deadline) then it's not free.
  - *Audit step*: 
    1. Identify: Is there evidence you are waiting for? If not, pass.
    2. If yes, then ask: 
       - Can you get it before the deadline? If not, you must report now.
       - Is it free? (Any cost? Including time, opportunity, etc.) If not free, then you must weigh the cost against the expected gain. (But we don't have a way to do that in the audit? We mark it as a judgment call.)
       - Is it relevant? (Would it change your probability? If you are certain it won't, then it's not relevant.) 
    3. *Pass condition for not waiting*: If either the evidence is not available by the deadline, or it is not free, or it is not relevant, then you do not wait. Otherwise, you should wait (if the expected gain is worth the cost? But we assume free so then wait).
  - *But note*: The analyst might not be able to compute the expected gain. So we simplify: if the evidence is free, available by the deadline, and relevant (you can imagine it changing your probability), then wait. Otherwise, report now.

  **Step 4: Judgment Warnings**
  - We mark steps that involve judgment:
    - Step 0: Assigning probabilities is a judgment.
    - Step 2: Deciding that the numbers are the best representation of your current belief is a judgment.
    - Step 3: Deciding whether evidence is free, available, and relevant involves judgment (especially relevance and availability). Also, if the evidence is not free, then the cost-benefit analysis is a judgment.

  ### Run the Audit on Two Cases

  **Case 1: Analyst sitting on 0.15 for hospital-overflow-by-March who wants to hold until a report lands Thursday.**
  - Step 0: The event is binary: overflow (p=0.15) or not (p=0.85). Sum is 1. Pass.
  - Step 1: Coherence holds (only two events, mutually exclusive). Pass.
  - Step 2: The analyst believes 0.15 is their current best. So they would pass and report? But they want to wait. So we go to Step 3.
  - Step 3: 
    - Evidence: Thursday's report.
    - Available? Only if the forecast is due after Thursday. (If due before, then they must report now.) Assume the report comes before the deadline? Let's assume the deadline is after Thursday.
    - Free? Assume no cost to wait (so free).
    - Relevant? The analyst expects it to change their probability? They must answer: could the report change their mind? If yes, then relevant.
    - Therefore, they should wait and then update based on the report. 
  - Judgment: The analyst must judge that the report is indeed available by the deadline and free, and that it is relevant (which they do, because they want to wait). So the audit says: wait and then run the audit again on Thursday after updating.

  **Case 2: Two analysts at 0.3 and 0.7 who propose to average and file 0.5.**
  - Step 0: They are forecasting a binary event. Analyst A has p=0.3, Analyst B has p=0.7. They propose to report 0.5. But note: the audit is for an individual. So we must consider each analyst individually? However, they are proposing a group report. We must treat the group as a single forecaster? But the audit is for an individual. Let's assume they are acting as a group and must form a group credence. How? 

  But note: the audit is designed for an individual. We have to extend it? Alternatively, we can run the audit for each analyst and then see what the group should do.

  However, the group is not an individual. The group must form a single probability. The procedure does not cover group aggregation. But we can run the audit as if the group is the forecaster. Then:

  - Step 0: The group must assign a probability. They are considering 0.5. But what is the group's actual credence? If the group has not formed a credence, then Step 0 requires them to form one. They are proposing 0.5 as the average. Is that the group's credence? 

  But note: the audit requires that the probability is the best representation of the forecaster's belief. For the group, that might be a compromise. However, the theory of strictly proper scoring rules says that if the group's true credence is p, then they should report p. What is p? It is not necessarily the average. 

  In fact, if the group has two members with credences 0.3 and 0.7, and they have equal weight, then the group might use a linear pooling (average) but that does not preserve the property of being the expected score maximizer for the group. The group's expected score is maximized by reporting the average only if the group's credence is the average? But the group's credence is not defined. 

  However, the audit is for an individual. Therefore, we must insist that each analyst reports their own probability. If they are required to submit a group forecast, then the group must form a consensus credence. How? The audit doesn't say. But we can run the audit for the group as a whole if we consider the group as a single epistemic agent. However, that agent doesn't have a credence until they form one.

  Alternatively, we can run the audit for each analyst and then note that the group report should be the one that the group as a whole believes. But that is circular.

  Let me reframe: the group must assign a probability that represents the group's belief. The audit can be run by the group as if the group were an individual. Then:

  - Step 0: The group assigns 0.5 to the event. Then the non-event is 0.5. Sum is 1. Pass.
  - Step 1: Coherence holds. Pass.
  - Step 2: Is 0.5 the group's best representation? The group must decide. But if the group is composed of two analysts with 0.3 and 0.7, and they are averaging without any other reasoning, then they are not representing the group's true belief. The group has not formed a belief by considering the evidence together. They are just averaging arbitrarily. 

  Moreover, from the perspective of each analyst, if they are forced to report 0.5 instead of their own credence, then they are violating the strictly proper rule: each analyst would expect a better score by reporting their own credence. 

  But the group is a separate entity? Not exactly. The group's expected score is a function of what the group reports and the true state. The group's expected score, if they have a credence of p, would be maximized by reporting p. But what is p? It is not defined. 

  Therefore, we must reject the average. The group must form a credence by sharing evidence and reasoning together. They should not average without discussion.

  But the audit is for an individual. So in this case, the group has not done the necessary work to form a group credence. They are trying to skip the process. Therefore, the audit fails at Step 2 for the group: the number 0.5 does not represent the group's belief because the group hasn't formed one. They have just averaged two numbers arbitrarily.

  Hence, the procedure would require them to go back and form a group credence properly (by deliberation, sharing evidence, etc.). If they do that and come up with 0.5, then they can report it. But if they just average without deliberation, then they are not being honest. 

  Therefore, the procedure stops them: they cannot report 0.5 without having formed a group credence that they genuinely believe. This will make them hate it because it forces them to do more work.

  ### Rule of Thumb: "If you can name a specific piece of evidence that would move you, you're obliged to go look for it before you report."

  - Does it survive contact with the theory? 
    - The theory says that free relevant evidence is expected to improve your score. Therefore, if the evidence is free and relevant, then you should get it. But note: 
      - The rule of thumb requires that you can name the evidence and that it would move you (i.e., it is relevant). 
      - However, it does not require that the evidence is free. So if it is costly, then the rule of thumb might be too strong.
      - Also, if the evidence is not available until after the deadline, then you cannot get it.
    - Therefore, the rule of thumb is a good heuristic but should be qualified: you are obliged to look for it *if it is free and available by the deadline*.

  - Where does it belong? In Step 3 (Evidence Check). Specifically, it is a way to identify relevant evidence. So we can add in Step 3:
    - Ask: "Can you name a specific piece of evidence that would change your probability and that you can get before the deadline at no cost?" If yes, then you are obliged to get it (if you haven't already).

  Therefore, the rule of thumb survives with the qualification about cost and availability.

  ### Final Audit Procedure (Handout Version)

  **Forecast Submission Audit**

  *Time: ~20 minutes. Do this just before submitting.*

  **Step 0: Assign Probabilities**
  - List all possible outcomes (mutually exclusive and exhaustive).
  - Assign a probability to each outcome (a number between 0 and 1).
  - Check: Do the probabilities add up to 1? 
    - *If not, adjust until they do.*
  - *Judgment note: This step is your best judgment of the chances.*

  **Step 1: Check for Consistency**
  - For any two outcomes A and B, check:
    - Probability of A is not less than 0 and not greater than 1.
    - If A and B are mutually exclusive, then the probability of A or B occurring should be the sum of the probabilities of A and B.
    - For any group of outcomes that together cover all possibilities (and no overlap), their probabilities must add to 1.
  - *Pass condition: All checks hold. If not, go back to Step 0.*

  **Step 2: Commit to Your Belief**
  - Ask: "Given what I know at this moment, do these probabilities represent my best judgment?"
    - *If yes, proceed.*
    - *If no, return to Step 0 and adjust until they do.*
  - *Note: The theory says that your own probabilities are the ones that will maximize your expected score. So you should not second-guess by changing without new evidence or reasoning.*

  **Step 3: Decide on Waiting for Evidence**
  - Ask: "Is there any evidence I am waiting for that might change my probabilities?"
    - *If no, proceed to submit.*
    - *If yes, then:*
       a. *Can I get it before the deadline?* If not, submit now.
       b. *Is it free?* (No cost to wait, including time, opportunity, etc.) If not, you must decide if the cost is worth it (but note: without evidence, you cannot compute the benefit). In practice, if there's any cost, then it's a judgment call. (But we recommend: if there is a cost, then submit now unless the expected gain clearly outweighs the cost, which is hard to assess.)
       c. *Is it relevant?* (Would it change your probability? If you can name a specific piece of evidence that would move you, then it's relevant.) If not, submit now.
    - *If a, b, and c are all 'yes', then wait, get the evidence, update your probabilities (go back to Step 0), and then run the audit again. Otherwise, submit now.*
  - *Judgment note: This step requires judgment about availability, cost, and relevance.*

  **Submit** if you pass all steps.

  ### Run on Cases (Handout Version)

  **Case 1: Hospital Overflow (0.15, wants to wait for Thursday report)**
  - Step 0: Assigns 0.15 to overflow, 0.85 to no overflow. Pass.
  - Step 1: Pass (sum to 1).
  - Step 2: The analyst believes 0.15 is their best current judgment. Pass.
  - Step 3: They are waiting for a report on Thursday.
    - a. Available? If the deadline is after Thursday, yes.
    - b. Free? Assume no cost to wait, so yes.
    - c. Relevant? The analyst believes it might change their probability, so yes.
    - Therefore, they wait. After the report, they update and run the audit again.

  **Case 2: Two Analysts Propose to Average 0.3 and 0.7 to 0.5**
  - *Note: This is a group. The audit is for an individual or for the group as a single unit.*
  - If they are submitting as a group, then:
    - Step 0: They assign 0.5 to the event and 0.5 to the complement. Pass.
    - Step 1: Pass.
    - Step 2: The group must answer: is 0.5 our best judgment? If they just averaged without discussion, then the answer is no because they haven't formed a group belief. They must deliberate and form a consensus probability. If after discussion they agree on 0.5, then they pass. Otherwise, they must adjust. 
    - Step 3: They must check for evidence. But if they have already shared all evidence and deliberated, then there is no evidence to wait for. So they submit.

  However, without deliberation, they fail Step 2. The procedure forces them to deliberate and form a real group credence. They will hate this because they wanted a quick fix.

  By requiring Step 2 to be passed with a genuine belief, the audit prevents arbitrary averaging.

  ### Conclusion
  The rule of thumb about naming evidence fits into Step 3 and survives with qualifications. The audit procedure addresses the four requirements and provides a practical tool for forecasters.
answer: |-
  ### Theoretical Grounding  
  **Proper Scoring Rules** measure forecast accuracy (e.g., Brier score: lower = better). A rule is **strictly proper** if your true credence uniquely maximizes expected accuracy: reporting anything else looks *worse* from your current perspective. This induces **immodesty**—your credence *always* appears best to you *now*. Thus, "report honest credences" is sound *in theory*. But in practice, immodesty creates paralysis: "What if I’m wrong?" and "Should I adjust?" aren’t resolved by theory alone.  

  **Free Evidence**: Under strict propriety, costless, non misleading evidence *never* harms expected accuracy (Good’s Theorem). Violations imply: (1) evidence isn’t free (e.g., delay costs), (2) updating is flawed, or (3) relevance is misjudged.  

  **Key Insight**: Your credence is your *best current tool*. If you doubt it, *revise it*—don’t "adjust" post-commitment.  

  ---

  ### Audit Procedure: Pre-Submission Check (20 min)  
  **Materials**: Pencil, paper, your forecast (probabilities for mutually exclusive outcomes).  

  #### **Step 0: Coherence Check**  
  **Goal**: Ensure probabilities are internally consistent.  
  **Steps**:  
  1. List all outcomes (e.g., Overflow, No Overflow).  
  2. Assign probabilities (must be ≥0).  
  3. Sum all probabilities.  
  **Pass**: Sum = 1.00.  
  **Fail**: Reassign until sum = 1.00.  
  ***Judgment Warning***: Choosing outcomes/numbers is *your* call—no theory dictates this.  

  #### **Step 1: Immodesty Confrontation**  
  **Goal**: Decide whether to report or revise.  
  **Steps**:  
  1. Ask: "If I *had* to bet right now, would I use these numbers?" If **yes**, proceed. If **no**, return to Step 0.  
  2. *Do not* "adjust" probabilities to "hedge" or "average"—your credence is your credence.  
  **Pass**: Commitment to current numbers.  
  **No Escape**: Theory says *no better move exists* from your current view. If you distrust your credence, it’s not your credence—rethink Step 0.  

  #### **Step 2: Evidence Check**  
  **Goal**: Justify delaying for evidence.  
  **Steps**:  
  1. Identify evidence you’re waiting for (e.g., "Thursday’s report").  
  2. Ask:  
     - **Availability**: "Can I get it before the deadline?" If no, file now.  
     - **Cost**: "Is waiting free?" (e.g., no missed deadlines, no cognitive burden). If not, file now.  
     - **Relevance**: "Could this evidence change my probabilities?" If no, file now.  
  3. If all answers are "yes", wait. Else, file now.  
  **Pass**: File or wait (if waiting, rerun audit post-evidence).  
  ***Judgment Warning***: Assessing cost/relevance is subjective. Theory only guarantees gains for *truly* free, relevant evidence.  

  #### **Step 3: Finalize**  
  Submit probabilities. Do not recalculate, "smooth," or second-guess.  

  ---

  ### Case Studies  
  #### **Case 1: Hospital Overflow (0.15, wants to wait for Thursday’s report)**  
  - **Step 0**: Overflow: 0.15, No Overflow: 0.85 → Sum=1.00. **Pass**.  
  - **Step 1**: "I’d bet on 0.15 now." **Pass**.  
  - **Step 2**: Evidence = Thursday’s report.  
    - Available? Only if deadline > Thursday.  
    - Free? If delay has no cost, yes.  
    - Relevant? If report *could* change 0.15, yes.  
    → If all "yes", **wait**. Else, file.  
  **Result**: Analyst waits only if evidence is truly free/relevant. Theory supports waiting.  

  #### **Case 2: Analysts (0.3 and 0.7) propose averaging to 0.5**  
  - **Step 0**: They assign 0.5 to Event, 0.5 to ¬Event. Sum=1.00. **Pass**.  
  - **Step 1**: Ask: "Would you *bet* on 0.5?"  
    - Analyst A (true credence 0.3): "No—I believe 0.3!"  
    - Analyst B (true credence 0.7): "No—I believe 0.7!"  
    → **Fail**.  
  **Result**: They *cannot* pass Step 1. Averaging is forbidden—it’s not their credence. They must reconcile views via Step 0 (e.g., debate evidence) or submit separate forecasts. They’ll hate this—but theory says averaging violates strict propriety.  

  ---

  ### Rule of Thumb Assessment  
  **Your rule**: "If you can name evidence that would move you, you’re obliged to look."  
  - **Survival**: Mostly intact, with caveats.  
  - **Where it fits**: **Step 2 (Evidence Check)**.  
  - **Why**: Naming evidence satisfies *relevance*. But add:  
    - "Look *only if* it’s free and available by deadline."  
    - If not free, you’re *not* obliged—expected gains may not offset costs.  
  **Refined Rule**: "If you name *free, available* evidence that would move you, you must wait."  

  ---  
  **Summary**: This audit enforces coherence, exposes immodesty as a decision point (not a flaw), and mandates evidence discipline. It replaces slogans with action: *Commit, revise, or wait—but never fake your credence*.
