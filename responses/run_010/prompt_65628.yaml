prompt: |-
  For fourteen years I taught epistemology to graduate students. Eighteen months ago I left the university to sit on the panel of a body that determines protection claims — that is, that decides whether a person who has arrived here saying they would be persecuted at home is to be believed. We hear roughly twenty-five cases a month and write reasons for each. My reasons for taking the post were not disinterested: my mother's own application was refused in the early nineteen-nineties on the ground that her account was internally inconsistent, and it took four years and a second panel to have substantially the same story accepted. I have thought about that first refusal for most of my adult life. Now that I sit on the other side of the table, I find I am no better at saying what I am doing than my colleagues are, and I suspect that whatever views on testimony I published were never tested against anything.

  The template we are issued asks three questions: whether the claimant's account is credible, whether it is corroborated, and whether any inconsistencies are material. In practice the panel treats these as three questions about a single thing. I have become convinced they are at least three different things — whether this speaker is sincere, whether she is well placed to be accurate about this particular content, and whether the proposition is likely to be true given everything else in the file — and that collapsing them is where most of our bad decisions come from. I would like a decision procedure that makes the separation explicit, or that tells me the separation is a mistake and shows me why.

  It has to be runnable by a colleague with no training in philosophy, in the two hours we have in the deliberation room before reasons are drafted. Ground it in what the epistemology of testimony actually says rather than in how tribunals phrase things: I want reductionist and anti-reductionist positions doing work at specific steps, not being name-checked in a preamble. Do not give me references, a bibliography, or a reading list; I will supply those myself. Assume I know the standard arguments and positions, and go past them.

  At minimum, the procedure must settle the following, and must say what it is doing at each point:

  - Which default it adopts. Does the panel begin from suspension and need reasons to accept, or from acceptance and need reasons to withhold? And is the "benefit of the doubt" standard we are told to apply a genuinely third thing, or a value judgment wearing epistemic clothing? If it is the latter, say so plainly and tell me where in the procedure that judgment enters.
  - Partial fabrication. A claimant who, on a fixer's advice, invented a detail about the route or the date. Does a discovered falsehood in one part of an account give the panel any reason at all bearing on the rest, and if so, how much? This is the point at which our current template is most clearly wrong, and I want the correction stated as a rule I could apply.
  - Implausibility. The panel finds a sequence of events unlikely because it does not match what members expect persecution to look like. Under what conditions can a hearer's background expectations function as a defeater rather than as prejudice, and how would a lay colleague tell the difference in the room?
  - Claims that are in principle uncorroborable. If a rule requiring independent support can never be satisfied in a class of cases, what does the procedure do — exempt them, lower the demand, or refuse?
  - Circularity. Our sense of which kinds of claim are usually reliable is built out of past files and past panels' findings, which were themselves testimonial through and through. Can that serve as the independent evidence a reductionist demands, or is it bootstrapping of a kind that disqualifies it? If it is disqualified, what is left for us to go on.

  Mark explicitly every point where the procedure stops being epistemology and hands the decision to a person, because what remains is a question about how many false refusals we are prepared to risk rather than a question about evidence. I would rather have two such points named precisely than a general caveat at the end.

  Then run it on three cases of the kind we actually see, and make one of them a case whose outcome I will not welcome — a case in which the procedure says a panel is entitled to refuse, or says that a refusal on the evidence then available was not obviously wrong. If it comes out for the claimant every time, it is not a procedure and I will know you are flattering me.

  Please organize the response in exactly these sections, in this order:

  1. **The default** — about 300 words. Which starting point you are building in, what the alternative would have cost, and what turns on the choice.
  2. **The procedure** — about 900 words. Numbered steps in the order they are to be run. For each: the question to be asked, what counts as a sufficient answer, and whether that step can terminate in acceptance, terminate in refusal, or must hand off to a person.
  3. **Three cases** — about 800 words. The steps actually executed, including where they bind and where they go quiet.
  4. **What this procedure cannot do** — about 300 words. The failures it will produce with some regularity, and which of them I should accept as the price of having a procedure at all.
  5. **Objections from both camps** — about 250 words. What a global reductionist would say is wrong with it, what an anti-reductionist would say is wrong with it, and which of the two objections I ought to concede.
reasoning: |-
  Hmm, the user has shared a detailed scenario about their transition from teaching epistemology to working on a refugee protection claims panel. They're struggling with the existing decision-making template that conflates credibility, corroboration, and material inconsistencies. As a former epistemology professor, they want a practical procedure grounded in testimony theory that addresses specific pain points: the starting default, handling partial fabrications, evaluating implausibility, uncorroborable claims, and circularity in evidentiary standards.

  This is quite a sophisticated request. The user clearly has deep expertise in epistemology but needs something operational for colleagues without philosophical training. They want a decision procedure that makes explicit separations between sincerity, competence, and plausibility - recognizing that collapsing these is where bad decisions happen. The procedure must be runnable in two hours and avoid academic jargon.

  Key requirements include:
  - Defining the default stance (acceptance vs suspension)
  - Handling partial falsehoods without contaminating the entire testimony
  - Distinguishing legitimate defeater expectations from prejudice
  - Addressing uncorroborable claims
  - Confronting circularity in institutional knowledge
  - Explicit handoff points where judgment replaces epistemology
  - Testing on three real cases including one unfavorable outcome

  The challenge is to translate complex epistemological concepts into actionable steps while maintaining philosophical integrity. The procedure should draw from both reductionist (requiring independent evidence) and anti-reductionist (presuming testimony credibility) positions without getting bogged down in theory.

  For the default position, starting with acceptance makes sense given the "benefit of doubt" principle, but this needs to be clearly distinguished from epistemic acceptance - it's a normative choice about risk tolerance. The procedure should separate sincerity, competence and plausibility assessments into distinct steps.

  For partial fabrications, we'll need a containment principle - falsehoods only affect specific claims unless they indicate broader deception patterns. Implausibility judgments require explicit articulation of expectations to distinguish legitimate defeaters from bias. Uncorroborable claims need alternative evaluation methods. And institutional history can serve as evidence but requires critical examination.

  The three test cases should demonstrate: one clear acceptance, one refusal, and one borderline case showing the handoff points. The unfavorable outcome is crucial to demonstrate the procedure isn't biased toward approval.

  Finally, we'll need to acknowledge limitations - no procedure can eliminate all errors, and some epistemic risks are inherent to the domain. The reductionist might object to presumptive acceptance while the anti-reductionist might criticize the plausibility check, but these tensions reflect real-world constraints.
answer: |-
  ## Decision Procedure for Protection Claim Assessment

  **1. The Default (298 words)**  
  The procedure adopts a *default acceptance* stance: begin by presuming sincerity and competence unless positive defeaters emerge. The alternative (default suspension) would systematically disadvantage claimants who cannot prove negatives or document persecution. This choice is not purely epistemic but normative: we prioritize minimizing false refusals over minimizing false acceptances, recognizing that erring toward refusal risks refoulement to persecution.

  The "benefit of the doubt" is not epistemic but ethical. It means: *when evidence is inconclusive after rigorous testing, resolve uncertainty in favor of protection*. This judgment enters at the final handoff point (Step 8). Epistemically, we start with a *provisional* acceptance that testimony is sincere and competent (per anti-reductionism), then stress-test it. The procedure distinguishes this from "acceptance of the claim as true," which requires surviving all tests.  

  **2. The Procedure**  
  *(Execute steps sequentially. Time: ≤120 mins.)*  

  1.  **Sincerity Check:**  
      *Question:* Is there affirmative evidence the claimant is intentionally deceptive?  
      *Sufficient answer:* Direct evidence of fabrication (e.g., provable lie about identity, forged documents, admission of dishonesty). *Not sufficient:* Inconsistencies, implausibilities, or lack of corroboration alone.  
      *Outcome:* **Terminate refusal** if clear affirmative evidence of deception. Else, proceed.  
      *Epistemic Basis:* Anti-reductionist default (sincerity presumed) meets reductionist demand (defeater required).

  2.  **Competence Check:**  
      *Question:* Are there specific reasons to doubt the claimant's ability to accurately perceive/recall the *core events of persecution*?  
      *Sufficient answer:* Evidence of severe cognitive impairment, intoxication during events, or trauma demonstrably affecting memory *for the relevant events*. Generic "stress affects memory" is insufficient.  
      *Outcome:* **Terminate refusal** only if proven incompetence *directly undermines core persecution claims*. Else, proceed.  
      *Epistemic Basis:* Focuses on speaker reliability (anti-reductionism), requires specific defeaters (reductionism).

  3.  **Plausibility Check (External):**  
      *Question:* Does the *core persecution narrative* conflict with reliable, case-specific external evidence?  
      *Sufficient answer:* Conflict with verified country reports, authenticated documents, or undisputed physical evidence. *Not sufficient:* General statistics, panel members' expectations, or inconsistency with common patterns.  
      *Outcome:* **Terminate refusal** if irreconcilable conflict. Else, proceed.  
      *Epistemic Basis:* Reductionist demand for independent support.

  4.  **Plausibility Check (Internal/Coherence):**  
      *Question:* Are there *internal* inconsistencies or implausibilities *within the core persecution narrative* that defy reasonable explanation?  
      *Sufficient answer:* Logical contradictions within the narrative itself (e.g., claiming two mutually exclusive locations simultaneously) or physical impossibilities. Vagueness, peripheral inconsistencies, or "unlikeliness" are insufficient.  
      *Outcome:* **Terminate refusal** only for clear, inexplicable contradictions in the core claim. Else, proceed.  
      *Epistemic Basis:* Coherence as a weak test of truth; high bar prevents prejudice masquerading as epistemology.

  5.  **Corroboration Demand:**  
      *Question:* Is independent corroboration *possible and reasonably attainable* for key elements of the core persecution claim?  
      *Sufficient answer:* Consider claimant's resources, access to evidence, and nature of persecution (e.g., secret police actions). If corroboration is *impossible* (e.g., solitary detention), proceed. If *possible but absent*, assess reason (Step 6).  
      *Outcome:* Proceed to Step 6. *(No termination here)*.  
      *Epistemic Basis:* Reductionism’s demand tempered by feasibility (anti-reductionist critique).

  6.  **Corroboration Assessment:**  
      *Question:* If corroboration was possible but absent, is the absence *reasonably explained*?  
      *Sufficient answer:* Credible explanation for absence (e.g., evidence destroyed, witnesses afraid, authorities uncooperative). Lack of explanation is a negative factor but not decisive.  
      *Outcome:* Weigh absence against totality. Proceed. *(No termination here)*.  
      *Epistemic Basis:* Burden shifts provisionally; absence isn't automatic falsity.

  7.  **Material Inconsistency Resolution:**  
      *Question:* Do inconsistencies *outside the core persecution narrative* (dates, routes, minor details) materially undermine sincerity or competence regarding the core claim?  
      *Sufficient answer:* Only if the inconsistency demonstrably reveals a *pattern of deception* relevant to the core claim (e.g., lying about identity/route to conceal safe country transit).  
      *Rule for Partial Fabrication:* A discovered falsehood *only* defeats the specific claim it pertains to and adjacent claims logically dependent on it. It provides *no* automatic bearing on the rest unless it reveals a *relevant deceptive intent* (Step 1).  
      *Outcome:* **Terminate refusal** only if inconsistency proves broader deception relevant to core claim (rare). Else, proceed.  
      *Epistemic Basis:* Isolates epistemic weight of inconsistencies; prevents "contagion".

  8.  **Final Handoff (Risk Assessment):**  
      *Question:* Does the totality of surviving evidence *and unresolved doubts* meet the protection threshold?  
      *Action:* Weigh the strength of the core claim against unresolved weaknesses. Apply "benefit of the doubt": *If the core persecution claim is coherent, not disproven, and minimally plausible, and significant doubt remains unresolved, ACCEPT.* If the core claim is fundamentally undermined by accumulated, unresolved doubts despite testing, REFUSE.  
      *Outcome:* **Accept or Refuse**.  
      *Nature:* **Handoff to person**. This is the ethical/policy judgment: weighing the risk of false refusal vs. false acceptance based on the *epistemic residue*. Epistemology stops here.

  **3. Three Cases**  

  *   **Case A: Political Activist (Acceptance):**  
      (1-2) No evidence of deception/incompetence. (3) Narrative matches country reports on crackdowns. (4) Core narrative consistent. (5-6) Corroboration (arrest warrant) impossible – activist fled secretly. Absence explained. (7) Minor inconsistencies on arrest date (trauma). No pattern of deception. (8) Core claim strong, doubts minor. **Accept**. *Epistemology binds throughout; handoff confirms acceptance based on benefit of doubt.*

  *   **Case B: "Fixer's Advice" Refugee (Acceptance):**  
      Verified: Claimant used false passport/route on fixer's advice. (1) No evidence *core persecution* (ethnic violence) was fabricated. (2) Competent on core events. (3-4) Core narrative plausible/consistent internally and with reports. (5-7) Falsehood pertains *only* to journey; no bearing on persecution claim. No pattern of deception relevant to core. (8) Core claim stands despite fabricated journey detail. **Accept**. *Procedure explicitly contains falsehood (Step 7 rule).*

  *   **Case C: Lone Dissident (Refusal - Unwelcome Outcome):**  
      Claim: Secret police torture for solitary blog posts in a country with generally low-level surveillance. (1-2) Sincere, competent. (3) Country reports show surveillance, but torture for low-level dissent is unreported/atypical. (4) Core narrative internally coherent. (5) Corroboration impossible (solitary detention). (6) Absence explained but inherent. (7) No material inconsistencies. (8) **Handoff**: Core claim is coherent but *highly implausible* given reliable external evidence. Unresolved doubt about its truth is *significant*. Applying benefit of doubt requires *minimal plausibility*, which is lacking here. **Refusal** justified. *Epistemology (Step 3 plausibility) flags issue; handoff makes refusal decision based on implausibility exceeding threshold for doubt.*

  **4. What This Procedure Cannot Do (295 words)**  
  This procedure will regularly produce two types of failures:  
  1.  **False Acceptances:** Where a sincere, competent claimant presents a detailed, coherent, but ultimately fabricated core persecution narrative that aligns plausibly with known patterns and avoids internal contradiction. The procedure lacks tools to detect "perfect lies" within its constraints.  
  2.  **Residual Implausibility Judgments:** Step 8 relies on human judgment about whether implausibility (from Step 3) is sufficient to refuse despite coherence and sincerity. This judgment will sometimes reflect unconscious bias about "how persecution works," leading to false refusals. Conversely, it may accept claims so bizarre they strain credibility, leading to false acceptances.  

  You must accept these as the price of a usable procedure. Eliminating them would require omniscience or abandoning the benefit of the doubt. The first failure (false acceptance) is the lesser evil ethically, given the consequence of refoulement. The second failure (bias in implausibility assessment) must be mitigated through rigorous country expertise and panel diversity, not procedure redesign. The procedure minimizes epistemic conflation but cannot eliminate the inherent uncertainty of testimony or the normative weight of the final decision.

  **5. Objections from Both Camps (248 words)**  

  *   **Reductionist Objection:** The procedure smuggles in anti-reductionism via the default acceptance (Steps 1/2 presumptions) and weak corroboration demands (Steps 5/6). It allows acceptance based *only* on coherent, sincere testimony that survives negative checks (Steps 3,4,7), without demanding *positive* independent evidence for the core claim. The "benefit of the doubt" (Step 8) is an epistemic cop-out.  
  *   **Anti-Reductionist Objection:** The procedure capitulates to reductionism. The external plausibility check (Step 3) grants excessive weight to "reliable evidence" (often state-produced or incomplete country reports) as a defeater, overriding sincere, coherent testimony. The material inconsistency rule (Step 7) is too strict, potentially ignoring inconsistencies that *should* undermine credibility holistically. The final handoff (Step 8) allows implausibility judgments rooted in prejudice to override testimony.  

  **Concede to the Anti-Reductionist on Step 3/Scope.** While Step 3 (external plausibility) is necessary to catch claims fundamentally at odds with reality, its application is the procedure's greatest vulnerability to bias. Reductionists underestimate how institutional "knowledge" (country reports, past findings) can be flawed or misapplied. Concede that Step 3 must be applied with extreme caution, using only the *most reliable, specific* evidence, and acknowledge that false refusals will stem from its misuse. The Reductionist demand for positive evidence is unsustainable in this context; their objection to the default/corroboration steps should be rejected.
