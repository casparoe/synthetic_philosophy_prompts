  Okay, let me start by really understanding the user's problem. They're an archaeologist working at the intersection of paleoclimate and societal change. Their main issue is reviewing papers that link environmental events to social outcomes, but there's a specific methodological flaw they keep encountering. They've described three scenarios where the chronological resolution of different records creates an artificial sequence, making it seem like the environment caused societal changes when the data might not support that.

  First, I need to parse each scenario. The first one involves a volcanic spike (high resolution), aridity signal (low resolution), and settlement abandonment (even lower). The paper claims eruption led to drying, which led to abandonment. But because the eruption's date is precise, it's placed first, while the others have wide windows. The causal sequence is more about the resolution than actual timing.

  The second scenario is about a tephra layer used for dating. Later, that eruption is cited as the cause of destruction at the site. But the dating method itself sets the eruption as the anchor, so the cause is assumed because it's the fixed point in chronology.

  The third involves binning or smoothing data to align signals. The correlation only appears at certain temporal widths, which are chosen subjectively, and the sensitivity isn't checked. The alignment is manufactured by how the data is processed.

  The user mentions existing concepts like false precision or correlation != causation, but those don't fit. False precision is about reporting spurious digits, but here the error bars are correct. The issue is the mismatch in resolution creating an artificial sequence. They want a term or concept that captures this.

  I recall terms like "temporal scale mismatch" or "resolution-induced precedence." But I need to check if there's an established term. Maybe "chronometric locking" from Sahani and Peters? Or "temporal entanglement"? Also, in statistics, the modifiable temporal unit problem (MTUP) is similar but about aggregation, not resolution mismatch. 

  The common thread is the temporal resolution asymmetry creating an artificial precedence. The sharp record anchors the timeline, forcing the blunt events into a sequence. The causal direction is inherited from the data's properties, not evidence. 

  Possible terms: Resolution-Induced Causal Artefact (RICA), Temporal Resolution Asymmetry Effect (TRAE), or Chronometric Locking. Among these, Chronometric Locking seems fitting because the sharp event "locks" the sequence, and the blunt events are tied to it, creating a false precedence.

  A genuine non-instance would be if all events had similar resolution or if the causal link was tested with methods that account for the uncertainty, like Bayesian chronological modeling that handles phase transitions. Or if multiple independent lines of evidence converge despite resolution differences.

  The user needs a term that excludes mere coincidence of dates. Chronometric Locking works because it's about the methodological artifact from dating techniques. The three scenarios are manifestations of the same core issue: resolution asymmetry leading to manufactured sequence. 

  I should also mention related concepts like MTUP, ecological fallacy, and explain how they're similar but not the same. For example, MTUP is about aggregation levels affecting correlation, but here it's about resolution mismatch creating causal direction. 

  The user's deeper need might be to have a concrete concept to reference in peer reviews, to point out this flaw without lengthy explanations. Providing a clear definition, examples, and non-examples will help them communicate this issue effectively.
answer: |-
  Your description brilliantly isolates a pervasive and under-acknowledged methodological pitfall in interdisciplinary paleoscience. The core issue is **chronometric asymmetry manufacturing causal precedence**, where differing temporal resolutions of records create an *artificial sequence* that is misinterpreted as evidence for causation. While no single term is universally established, the closest conceptual frameworks and proposed terminology are below.

  ### Core Concept: **Chronometric Locking**
  **Definition:** The artifactual imposition of causal direction arising when events dated with high chronological resolution (e.g., ice-core spikes, tree rings) are linked to events dated with low resolution (e.g., radiocarbon phases, ceramic periods), causing the sharp event to *anchor* the timeline and systematically inherit precedence—regardless of actual temporal relationships within the uncertainty windows. This transforms methodological constraints into false historical narratives.

  **Why this term?**  
  - "Chronometric" emphasizes dating *methods* as the source.  
  - "Locking" conveys how the sharp event fixes the sequence, forcing lower-resolution events into dependent positions.  
  - It excludes mere coincidence: the problem is the *systematic misattribution of order* due to resolution asymmetry.

  ---

  ### Analyzing Your Three Scenarios as Manifestations of Chronometric Locking
  1. **Resolution-Induced Precedence (Your "First Version")**  
     - **Mechanism:** The high-resolution event (eruption year) becomes the temporal anchor. The low-resolution events (drying century, abandonment 300 years) have uncertainty windows overlapping both the anchor *and each other*. Yet the sequence "eruption → drying → abandonment" is presented as fixed because the eruption's position is unambiguous.  
     - **Why existing terms fall short:**  
       - *False precision*: Involves overstated precision, but here uncertainties *are* reported.  
       - *Underdetermination*: Focuses on insufficient evidence, not *method-driven sequence bias*.  
     - **Locking in action:** The eruption "locks" the start point, compressing perceived uncertainty for subsequent events.

  2. **Circular Chronology (Your "Second Version")**  
     - **Mechanism:** The tephra layer *defines* the site's chronology. Later attributing societal change to the eruption mistakes the *dating scaffold* for *independent evidence of causation*. The eruption's "precedence" is baked into the initial chronology.  
     - **Why existing terms fall short:**  
       - *Circular reasoning*: Describes the logic flaw but misses the *temporal* dimension.  
       - *Taphonomic bias*: Concerns preservation, not dating-derived causality.  
     - **Locking in action:** The dated eruption becomes the immutable pivot; societal changes are "locked" relative to it.

  3. **Bin-Width Dependency (Your "Third Version")**  
     - **Mechanism:** The apparent synchronicity/causality emerges *only* at arbitrary temporal smoothing scales. Choosing the bin width selects the narrative.  
     - **Why existing terms fall short:**  
       - *Modifiable Temporal Unit Problem (MTUP)*: Addresses how aggregation scale affects correlations but ignores *causal directionality* arising from resolution asymmetry.  
       - *Smoothing artifact*: Identifies signal distortion but not its causal implications.  
     - **Locking in action:** The bin width "locks" events into alignment, hiding resolution mismatches.

  **Common Structure:** All three involve **temporal resolution asymmetry** enabling a **systematic bias toward environmental causation** because natural proxies often have finer dating. The key is not just dating uncertainty, but how *differing precisions interact* to manufacture order.

  ---

  ### Related Concepts & Their Shortcomings
  1. **Modifiable Temporal Unit Problem (MTUP)**  
     - **Overlap:** Concerns how changing temporal bins alters correlations.  
     - **Shortfall:** Doesn’t address *causal direction* or *asymmetric resolution* (MTUP applies even if resolutions match). Your issue is a subtype where asymmetry guarantees directionality bias.

  2. **Ecological Fallacy**  
     - **Overlap:** Inferring individual-level causality from aggregate data.  
     - **Shortfall:** Focuses on *spatial/social* aggregation, not *temporal resolution* mismatches.

  3. **Temporal Entanglement (Sahani & Peters, 2019)**  
     - **Overlap:** Notes that dating uncertainty can entangle events in analysis.  
     - **Shortfall:** Doesn’t emphasize how *asymmetry* manufactures sequence.

  ---

  ### Genuine Non-Instance: When Causal Direction is "Earned"
  **Scenario:** A volcanic eruption (ice-core dated to 1627 ± 1 BCE) coincides with an *abrupt* societal collapse. Evidence includes:  
  - **High-resolution societal data:** Tablet archives cease *within 1 year* at multiple sites.  
  - **Independent markers:** Widespread fire layers directly above tephra at 5+ sites, with short-lived radiocarbon samples constraining fires to <10 years post-eruption.  
  - **Mechanistic link:** Contemporary texts describe famine, ash fall, and institutional breakdown.  
  **Why it avoids chronometric locking:**  
  1. Societal change has comparable resolution to the eruption.  
  2. Multi-proxy, *independent* lines of evidence converge on immediacy.  
  3. Directionality isn’t inherited from dating methods but from event character (e.g., fires *overlie* tephra).

  ---

  ### How to Operationalize "Chronometric Locking" in Reviews
  1. **Identify the anchor:** "The eruption’s annual resolution acts as a chronometric lock, anchoring the timeline."  
  2. **Highlight asymmetry:** "The abandonment window (300 years) encompasses the entire drying phase (100 years) and post-eruption period. Sequence cannot be inferred without independent evidence."  
  3. **Demand sensitivity tests:** "Show alignment robustness across bin widths; report null results."  
  4. **Reframe causation:** "Does environmental precedence reflect reality, or is it an artifact of the sharpest record being environmental?"

  By naming this, you expose a hidden scaffolding of interdisciplinary studies—one where dating methods, not evidence, write the story.
