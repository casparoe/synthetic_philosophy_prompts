  ### **Grid of Key Questions**
  I selected three yes/no questions that do the heavy lifting in the tree. Each corresponds to a critical node:  
  - **Q1:** Is the dispute about tables substantive (not resolvable by clarifying words)?  
  - **Q2:** In your view, do tables exist?  
  - **Q3:** Is the existence of tables trivial (obviously true from particle facts)?  

  The grid has 8 cells (2 × 2 × 2). Empty cells are diagnosed as:  
  - **Incoherent:** Logically inconsistent or self-defending.  
  - **Unattractive:** Theoretically possible but universally rejected for being absurd or unworkable.  
  - **Undefended:** No one argues for it, but it's not ruled out.  

  | Q1: Substantive? | Q2: Tables exist? | Q3: Trivial? | Occupied? | Diagnosis |  
  |------------------|-------------------|--------------|-----------|----------|  
  | No | Yes | Yes | **Yes** (Hirsch, Chalmers) | In ordinary language, tables exist trivially, but the dispute is verbal. |  
  | No | Yes | No | Empty | **Incoherent:** If existence isn't trivial, the dispute can't be fully verbal—disagreement should survive rephrasing. |  
  | No | No | Yes | **Yes** (Hirsch, Chalmers) | In an austere language, tables don't exist, and the dispute is verbal. |  
  | No | No | No | Empty | **Incoherent:** Similar to above—denying triviality implies a substantive residue. |  
  | Yes | Yes | Yes | **Yes** (Easy Ontology) | Tables exist, and it's trivial—no deep metaphysics. |  
  | Yes | Yes | No | **Yes** (Sider-style) | Tables exist, but it's substantive—reality has an objective structure. |  
  | Yes | No | Yes | Empty | **Unattractive:** If existence is trivial, denying tables requires rejecting particle facts (which both sides agree on). |  
  | Yes | No | No | **Yes** (Nihilism, Organisms-only, Restricted) | Tables don't exist, and it's substantive—composition is restricted or absent. |  

