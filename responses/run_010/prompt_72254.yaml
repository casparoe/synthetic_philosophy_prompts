answer: |-
  Below is a decision tree designed to sort metaontological positions based on concrete cases, starting with the table case ("Are there tables, or only particles arranged tablewise?"). The tree uses 8 nodes (questions) and 8 leaves (positions), with each question answerable without jargon. Jargon like "quantifier variance" or "joint-carving" only appears at the leaves (if at all). Each leaf includes a one-sentence statement of its most embarrassing commitment, and unnamed positions are flagged. Pairs of leaves that cannot be separated are noted.

  I'll first present the tree for the table dispute, then address the extras: a grid of key questions, and a rerun of the tree on the holes dispute (I chose holes over races because, like composition, it involves agreement on empirical facts—e.g., the cheese's shape—and focuses on ontological disagreement, avoiding the confounding empirical/political factors in the race dispute). My rerun confirms your hunch: the Sider-style and Hirsch-style parts of the tree behave differently for holes due to object-level disagreements about immateriality, while the verbal dispute branches (Hirsch/Chalmers) remain stable. Details are in the rerun section.

  ---

  ### **Decision Tree for the Table Dispute**
  *Start here:* In a scenario with particles arranged tablewise (and no other relevant features, like minds or organisms), answer the following:

  1. **Is the disagreement about whether "there is a table" a genuine disagreement about the world, or could it be resolved by clarifying words?**  
     - **Yes (genuine disagreement) → Go to Q2.**  
     - **No (could be resolved by clarifying words) → Go to Q5.**  

  2. **In your view, is there a table?**  
     - **Yes → Go to Q3.**  
     - **No → Go to Q4.**  

  3. **Does the existence of the table follow obviously and uncontroversially from the existence and arrangement of the particles?**  
     - **Yes → Leaf 1: Easy Ontology.**  
       - *Embarrassing commitment:* Ontology is trivial—there's no deep mystery to existence claims, as they're settled by boring logic.  
     - **No → Leaf 2: Sider-style Realism.**  
       - *Embarrassing commitment:* Reality has an objective "structure" that might exclude tables, even though we all agree on the particle facts.  

  4. **Are there any composite objects at all?**  
     - **No → Leaf 3: Mereological Nihilism.**  
       - *Embarrassing commitment:* Nothing composes anything—not even organisms—so you're just particles all the way down.  
     - **Yes → Go to Q8.**  

  5. **If both sides rephrased their claims without using "table" or similar words (e.g., only describing particle arrangements), would any disagreement remain?**  
     - **Yes (disagreement remains) → Go to Q6.**  
     - **No (disagreement vanishes) → Go to Q7.**  

  6. **Could both sides be correct if they are using "exists" in different ways?**  
     - **Yes → Leaf 4: Hirsch-style Verbalism.**  
       - *Embarrassing commitment:* Existence is language-relative—no one is "wrong," but we can't agree on what we're arguing about.  
     - **No → Leaf 5: Carnapian Pragmatism.**  
       - *Embarrassing commitment:* The only point of ontology is practical—choosing a linguistic framework isn't about truth, but convenience.  

  7. **Is the choice to say "there is a table" a practical decision about language, not a factual claim?**  
     - **Yes → Leaf 5: Carnapian Pragmatism.** (Same as above.)  
     - **No → Leaf 6: Chalmers-style Verbal Dispute Diagnosis.**  
       - *Embarrassing commitment:* Ontological disputes are often empty—if rephrasing removes disagreement, we were just talking past each other.  

  8. **Are living organisms the only composite objects?**  
     - **Yes → Leaf 7: Organisms-only Realism.**  
       - *Embarrassing commitment:* Tables don't exist, but organisms do—even though both are just particles arranged a certain way.  
     - **No → Leaf 8: Restricted Composition (unnamed).**  
       - *Embarrassing commitment:* Composition happens sometimes, but the restriction (e.g., only when causal unity exists) feels arbitrary and unmotivated. No standard name.  

  ---

  ### **Notes on the Tree**
  - **Ontological Pluralism:** The tree struggles to capture this. Pluralists might answer Q1 with "yes" (seeing a genuine disagreement), but then balk at Q2–Q4 because they believe in multiple "ways of existing" (e.g., tables exist derivatively, particles fundamentally). This creates tension: Q2 forces a yes/no answer about existence, but pluralists reject a univocal sense of "exists." I could not fit it into a leaf without a jargon-heavy node (e.g., "Do things exist in the same way?"), so it is excluded. Honest diagnosis: Pluralism collapses or overlaps with Sider-style Realism (if emphasizing "fundamental" existence) or Hirsch-style Verbalism (if emphasizing linguistic relativity), but it doesn't map cleanly.
  - **Unseparated Pairs:**  
    - **Hirsch and Chalmers (Leaves 4 and 6):** As you predicted, they often share branches (Q5 → Q7) and are only separable if someone rejects that rephrasing resolves the dispute (Q5) but still thinks both sides could be correct (Q6). In practice, few defend this split—most verbal dispute views answer identically, so the tree flags them as near-identical.  
    - **Sider-style and Organisms-only Realism (Leaves 2 and 7):** They share branches until Q8. Separation fails because both answer Q1 with "yes" and Q2 with "no," but only Q8 distinguishes their object-level criteria for existence (Sider focuses on "structure," organisms-only on life).  
  - **Empty Leaf:** The "no" branch of Q7 (if answering "no" to "practical decision?") has no occupants. Diagnosis: Incoherent—if rephrasing removes disagreement (Q5) but it's not practical (Q7), then denying both verbal and practical elements leaves no defensible position.  

