  ### **Rerun on the Holes Dispute**
  **Dispute:** "Are there holes in the cheese, or just cheese arranged hole-wise?" (Assume agreement on empirical facts: cheese shape, etc.)  
  **Why holes?** Like composition, it's a disagreement about "composites" (holes as immaterial objects/absences) with fixed empirical facts. Races would introduce non-ontological disagreement (e.g., social/political facts), which breaks the tree's assumptions.  

  **Tree Rerun Steps:**  
  - Identical nodes and questions as the table tree, but substitute "hole" for "table" and "cheese/shape" for "particles/arrangement."  
  - Key changes:  
    - Q2 ("In your view, is there a hole?") now hinges on immateriality (e.g., is a hole an object or an absence?).  
    - Q3 ("Is the existence of the hole trivial?") may split differently due to debates about parthood (e.g., holes as cheese-boundaries).  
    - Q8 ("Are organisms the only composites?") is irrelevant; replaced with "Are there any immaterial objects?" to parallel the composites question.  

  **Leaves with Changed Occupants:**  
  1. **Sider-style Realism (Leaf 2):**  
     - For tables: Occupied by realists who accept composites non-trivially (e.g., tables exist in reality's structure).  
     - For holes: Often *vacant*. Sider-style realists typically answer Q2 with "no" (holes aren't fundamental), pushing them to Leaf 8 (restricted immaterial objects). This confirms your hunch: for composition, both sides agree on particle facts, but for holes, object-level disagreements about immateriality mean Sider-style views diverge.  
  2. **Organisms-only Realism (Leaf 7):**  
     - For tables: Occupied by those who deny tables but accept organisms.  
     - For holes: *Vacant* (no analogue). Replaced by Leaf 8 (restricted immaterial objects), e.g., "only absences with causal powers exist."  
  3. **Restricted Composition (Leaf 8):**  
     - For tables: Occupied by organisms-only and similar views.  
     - For holes: *Gains occupants* from Sider-style and organisms-only realists. E.g., a Sider-style realist might land here if they deny holes but accept other immaterial objects (e.g., voids in spacetime).  

  **Stable Leaves (Same Occupants):**  
  - **Hirsch, Chalmers, Carnap (Leaves 4–6):** Unchanged. Verbal dispute views treat holes like tables—disagreement dissolves with rephrasing (e.g., "hole" talk is language-relative).  
  - **Easy Ontology (Leaf 1):** Unchanged. Neo-Fregeans (e.g., Amie Thomasson) argue holes exist trivially from cheese/shape facts.  
  - **Mereological Nihilism (Leaf 3):** Unchanged if extended to immaterial objects (e.g., only cheese exists, no "holes" as entities).  

  **Why This Confirms Your Hunch:**  
  - The tree separates verbal disputes (Hirsch/Chalmers) from realist ones cleanly in both cases because *empirical facts are held fixed*.  
  - However, for substantive realists (Sider-style), the tree is calibrated for composition. In the holes case, disagreements about immateriality (e.g., "Are holes real objects?") cause object-level splits that shuffle realists into different leaves. This shows the tree isn't "neutral"—it works best for disputes where both sides share all non-ontological commitments.  

  If your hunch were wrong (e.g., if Sider-style views consistently occupied the same leaf), the tree would be flawed. But it survives rerunning, with changes only where expected.  

