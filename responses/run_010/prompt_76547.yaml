prompt: |-
  We're running a workshop where a condenced matter physicist, a systems biologist and a computational social scientist each insist their target phenomenon is genuinely emergent, and I got stuck with writing the rubric we adjudicate with. Before I write it I want the spec: what any account of emergence has to deliver to be usable in that room.

  Give me the requirements — the cases it has to handle (including one where the macro law is derivable in principle but the derivation is about as long as just running the system, and one where a macro property is underivable only because the macro variable was gerrymandered), the distinctions it must not collapse, the results from physics and biology it can't contradict — with the motivating consideration behind each one. Then tell me which requirements are actually non-negotiable and which are camp preferences: my hunch is that "must exhibit multiple realizability" and "must license downward causation" are both the latter, but argue it, dont just assume it.

  Most of all: is any subset jointly unsatisfiable? I want to know whether novelty, causal efficacy, nothing-over-and-above-ness, and causal closure at the micro level can all be held at once, and if not which one has to go and what you lose by dropping it.

  End with five lines scoring Nagelian reduction, the Anderson more-is-different line, grounding-based accounts, and Wilson-style accounts that make emergence out to be ontological independence from a base you're nonetheless metaphysically dependent on. Five lines, not a treatise.
reasoning: |-
  Okay, let me tackle this query step by step. The user is designing a rubric to adjudicate emergence claims across physics, biology, and social science. They need clear requirements that work for all three fields without bias.

  First, I need to identify core requirements for any emergence account. The key cases to handle include:
  - Derivability edge cases (like when derivation length ≈ system runtime)
  - Gerrymandered macro variables
  - Must distinguish between epistemic vs ontological emergence
  - Can't contradict established science (e.g. thermodynamics in physics, evolution in biology)

  For non-negotiables: Causal closure of physics seems essential - can't violate conservation laws. Novelty must be included too, otherwise everything becomes "emergent" trivially. 

  Now for contentious points: Multiple realizability and downward causation. These might be field-specific preferences. Biologists often want downward causation for natural selection explanations, while physicists may reject it as violating micro-causal closure. Similarly, multiple realizability matters more in special sciences than fundamental physics.

  The big tension is between downward causation and micro-causal closure. If macro properties have real causal power, does that violate particle physics? One solution is to interpret downward causation as context-dependent constraints, not new energy injections.

  Finally, quick scoring of frameworks:
  - Nagel reduction: Too strict, fails novelty
  - Anderson: Good for novelty but vague on downward causation
  - Grounding: Clear dependence but struggles with causal efficacy
  - Wilson: Balances dependence/independence well, handles multiple realizability

  The rubric should probably require novelty and non-derivability while leaving downward causation optional with clear justification. That keeps physics happy while allowing biology/social science their emergence claims.
answer: |-
  Here’s a specification for your rubric, designed to adjudicate emergence claims across disciplines without field-specific bias. Requirements are categorized by **non-negotiable universals** (NN), **negotiable but cross-disciplinary** (CD), and **camp preferences** (CP).  

  ---

  ### **I. Core Requirements**  
  1. **Handle key test cases** (NN):  
     - **Case A (Intractable derivation)**: Macroscopic laws derivable *in principle* from micro-dynamics, but computational cost ≈ physically instantiating the system (e.g., protein folding from quantum mechanics).  
       *Motivation:* Distinguishes epistemic limits from ontological novelty.  
     - **Case B (Gerrymandered variables)**: Macro-property is "underivable" only due to arbitrary coarse-graining (e.g., defining "average income + hair color" as emergent).  
       *Motivation:* Blocks trivial emergence; requires macro-variables to be *natural* (robust under perturbation).  

  2. **Preserve critical distinctions** (NN):  
     - Epistemic (unknowable/computationally inaccessible) vs. ontological (irreducible new causal powers).  
     - Weak emergence (pattern derivable with infinite compute) vs. strong (pattern irreducible even with full micro-knowledge).  
     - Emergence vs. mere aggregation (e.g., phase transitions ≠ bird flocks).  

  3. **Respect scientific non-contradictions** (NN):  
     - Physics: Cannot violate causal closure/fundamental conservation laws (e.g., no new energy sources).  
     - Biology: Must accommodate evolutionary constraints (e.g., selection acts on multi-level hierarchies).  
     - Social science: Macro-regularities must persist despite micro-indeterminacy (e.g., market trends ≠ atomic motions).  

  ---

  ### **II. Contentious Requirements**  
  4. **Downward causation** (CD):  
     - Must allow macro-properties to *constrain or modulate* micro-dynamics without violating micro-causal closure (e.g., traffic jam altering driver behavior).  
     *Motivation:* Biologists/social scientists demand causal efficacy; physicists tolerate only "non-reductive" causation (e.g., boundary conditions).  

  5. **Multiple realizability** (CD):  
     - Macro-property must be achievable via distinct micro-configurations (e.g., consciousness in silicon/carbon).  
     *Motivation:* Shields special sciences from reduction; physicists may view as practical, not ontological.  

  6. **Novelty vs. nothing-over-and-above** (CD):  
     - Novel causal powers must not imply supernaturalism (e.g., liquidity emerges from H₂O, but is "nothing over and above" H₂O).  
     *Motivation:* Balances anti-reductionism with physicalism.  

  ---

  ### **III. Joint Satisfiability & Trade-offs**  
  - **Tension**: Downward causation + micro-causal closure + novelty.  
    - *Conflict:* If macro-properties exert novel causal power, how is micro-level causally closed?  
  - **Resolution**: Reject *strong* downward causation (energy-injecting). Allow *weak* downward causation: macro-properties as enabling constraints (e.g., DNA’s structure constraining chemical bonds).  
  - **Sacrifice**: Drop **strong ontological novelty** (e.g., "new fundamental forces"). Keep **relational novelty** (e.g., new system-level behaviors).  
    *Loss:* Weakens "radical emergence" but preserves scientific consistency.  

  ---

  ### **IV. Framework Scores (5-line critique)**  
  | **Framework**              | **Score** | **Key Limitation**                          |  
  |----------------------------|-----------|--------------------------------------------|  
  | Nagelian reduction         | ★☆☆☆☆     | Fails novelty & multiple realizability.    |  
  | Anderson ("More is different") | ★★★☆☆ | Strong on novelty, vague on downward causation. |  
  | Grounding-based accounts   | ★★☆☆☆     | Over-focuses on dependence; ignores causal efficacy. |  
  | Wilson (ontological independence) | ★★★★☆ | Best balance: dependence + autonomy.       |  

  ---

  ### **Summary for Rubric**  
  - **Non-negotiable**: Handle test cases, preserve distinctions, respect scientific laws.  
  - **Negotiable**: Downward causation (require "constraint" not force), multiple realizability (require robustness, not substrate-independence).  
  - **Drop**: Strong downward causation violating closure. Keep relational novelty.  

  This rubric forces clarity on *why* a phenomenon is emergent—not just that it’s complex—while allowing discipline-specific interpretations of causality.
