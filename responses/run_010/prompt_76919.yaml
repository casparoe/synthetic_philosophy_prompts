answer: |-
  **Working Memo: Appeal Analysis Under Student Code §4(c)**  
  *Key: Two coherent interpretations emerge from the record ("Decisionmaker Targeting" vs. "Balanced Appeal"). All six prior outcomes fit both, but with varying strain.*

  ---

  ### **I. Operative Tests Compatible with All Six Outcomes**  
  **A. "Decisionmaker Targeting" Test**  
  *Reduction requires:*  
  1. Conduct targets *only* the entity with direct power over the grievance;  
  2. All non-targeted impacts are minimal/unavoidable;  
  3. Ordinary channels exhausted *with that entity*;  
  4. No declaration of future misconduct.  
  *Strain on cases:*  
  - Fits Cases 1, 3, 4, 5 cleanly.  
  - Case 2: Strains by dismissing donor event as "non-minimal impact" (ignores code’s silence on scale).  
  - Case 6: Strains by treating selective enforcement as negating target relevance (focuses on equity over conduct).  

  **B. "Balanced Appeal" Test**  
  *Reduction requires:*  
  1. Conduct’s disruptive burden ≤ gravity of grievance + institutional intransigence;  
  2. Public identification demonstrates good faith;  
  3. No attempt to monopolize protest legitimacy;  
  4. Exhaustion measured by reasonableness, not literal completion.  
  *Strain on cases:*  
  - Fits Cases 1, 2, 4, 6 cleanly.  
  - Case 3: Strains by valuing "what student pays" over code’s "accept responsibility" clause (adds new metric).  
  - Case 5: Strains by conflating hypocrisy with failed appeal (code doesn’t require ideological consistency).  

  ---

  ### **II. New Appeal Outcome Under Each Test**  
  | **Test**               | **Outcome**         | **Reason**                                                                 |  
  |-------------------------|---------------------|----------------------------------------------------------------------------|  
  | **Decisionmaker Targeting** | No reduction | - Power cut harmed unrelated depts/staff (fails #1, #2)<br>- Vow to reoccupy regardless of sanction violates #4 |  
  | **Balanced Appeal**     | No reduction | - Harm to academics/staff > grievance urgency (fails #1)<br>- Hypocrisy re: rival group violates #3 |  

  ---

  ### **III. Recommended Holding & Analog Selection**  
  - **Closest Analog:** **Case 2** (dock blockade disrupting donor event).  
    - *Why controlling:* Both involved (a) secondary harm to non-decisionmakers (donors/unrelated depts), (b) targeting an office without discretion, (c) rejecting an available channel (senate hearing/faculty symposium).  
  - **Strongest Competing Analog:** Case 6 (identical uncharged encampment).  
    - *Why not controlling:* Case 6 turned on *procedural equity* (university’s inconsistent charging), not conduct merits. New appeal’s harm scale and reoccupation threat distinguish it.  
  - **Holding:** *No reduction. Sanction upheld.*  

  ---

  ### **IV. Adoptable Principle for Written Reasons**  
  > "Reduction under §4(c) requires that the conduct avoid material harm to parties without responsibility for the grievance, and that the student not declare intent to repeat the conduct irrespective of sanction."  
  - **What This Forecloses:** Future appeals may not cite selective enforcement (Case 6) or ideological consistency (Case 5 dissent) as independent grounds for reduction.  

  ---

  ### **V. Hypothetical Future Appeal to Separate Tests**  
  **Scenario:** Students block a research lab using animal testing.  
  - *Decisionmaker Targeting Test:* **No reduction** if lab includes researchers uninvolved in animal testing.  
  - *Balanced Appeal Test:* **Reduction possible** if harm to non-involved researchers is minimal vs. grievance gravity.  

  ---

  ### **VI. Post-Hoc Glosses vs. Operative Grounds**  
  | **Case** | **Stated Reason**                     | **Likely Post-Hoc?** | **Inference**                                          |  
  |----------|---------------------------------------|----------------------|--------------------------------------------------------|  
  | 1        | "Legible to persuadees"               | Yes                  | True driver: Minimal harm + registrar = sole target.   |  
  | 3        | "Weight to what student pays"         | Yes                  | True driver: Disclosure targeted decisionmaker (dev office). |  
  | 5        | "Claiming license denied to opponents"| Partially            | Core issue: Occupied office implementing (not making) policy. |  

  ---

  ### **VII. Rhetorically Weighty but Legally Irrelevant Facts**  
  1. **Last year’s uncharged blockade:** Invokes equity (Case 6) but irrelevant to conduct merits.  
  2. **Harm to hourly staff:** Sympathetic but immaterial under code if staff aren’t decisionmakers (per Case 2).  
  3. **Rival group comment:** Signals bad faith but not codified in §4(c) (Case 5 dissent noted this flaw).  

  ---

  ### **VIII. Where the Record Does Not Decide**  
  The record is genuinely split on:  
  - **Exhaustion of channels:** Must students use *all* avenues (Case 2) or only reasonable ones (Case 1)?  
  - **Selective enforcement:** Is it a standalone equity principle (Case 6) or irrelevant (Case 5)?  
  **What the Panel Chooses:** Whether §4(c) is a *procedural safe harbor* (strict compliance) or an *equitable balance* (weighing grievance vs. harm). Here, recommend strict view due to reoccupation threat.  

  **Final Advice:** Anchor arguments in **Case 2** (which both senior members endorsed) to show harm to non-decisionmakers is disqualifying. Distinguish Case 6 by emphasizing new appeal’s material harm and defiance of sanctions.
