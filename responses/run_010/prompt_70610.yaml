prompt: |-
  I am in the second half of a democratic theory seminar that has just spent three weeks on the boundary problem — the all-affected principle, the all-subjected principle, the circularity of letting an existing demos vote on who counts as a demos — and our professor handed out, as a kind of reality check, the recruitment protocols used by the citizens' assemblies that have become common over the past decade: the Irish bodies on constitutional questions, the French and British climate conventions, and a stack of municipal assemblies on housing and transport. The protocol is more or less the same everywhere. The organizers begin from a pre-existing administrative list, usually the electoral register or a national address file, and draw a large random sample of invitees from it. Because response rates are poor, they draw in strata and keep topping up until they hit a target size, and then they hold the resulting body against population benchmarks — sex, age band, highest educational qualification, region, urban versus rural, sometimes ethnicity or disability — and correct it: people drawn from over-represented categories are thanked and released, and additional names are drawn from under-represented ones, so that a person with no post-secondary qualifications ends up with a materially higher chance of serving than a professor does. Nobody is compelled to attend; a declinee is simply replaced, and in the reports I read there is no account of who declined or why. The whole exercise is then defended in a vocabulary of description rather than authorization: the assembly is said to be a microcosm or a miniature of the public, its legitimacy is said to come from the fact that anyone might have been picked, and it is routinely contrasted, favorably, with elected bodies on exactly that ground.

  What troubles me is that this practice is supposed to be the answer to the boundary problem, and it seems to me instead to presuppose an answer to it and to hide that answer inside a spreadsheet. The frame is a list the state already maintains for other purposes, so the assembly's claim to speak for the people inherits whatever criterion of belonging produced the register — citizenship, age, sometimes a prohibition on standing for election — and yet the justifying language is about affectedness and about being an ordinary person caught up in a shared fate, which is a much wider class than the register. There is also, I think, a straight internal tension that nobody in class named: the equal-chance idea and the mirror idea pull against each other, since quota correction deliberately makes selection probabilities unequal in order to make the final composition statistically right, and the practice treats the first as dispensable whenever the second requires it. And then there is the treatment of refusal. An election takes willingness to participate as politically meaningful — campaigning, turnout, and consent all depend on it — while an assembly treats a decline as noise to be engineered around, a gap to be filled by the next name on the list. That looks like a substantive claim about what membership in a demos consists in, not a neutral administrative convenience.

  So here is what I would like from you. Reconstruct the theory of the demos that this recruitment practice actually presupposes, as precisely as you can, and separate three layers: what it strictly cannot do without, what it merely sits comfortably alongside, and where it is genuinely underdetermined, so that several rival accounts of who belongs would license exactly the same protocol. In particular, tell me whether the practice treats the people as a distribution of attributes to be sampled or as a body of agents with standing to be summoned, and whether the quota machinery commits it to the first. Say which views of inclusion it quietly forecloses — the all-affected principle, the all-subjected principle, any consent- or participation-based account of membership, any view on which belonging is something a person does rather than something a list records — and whether it does so by argument or merely by default. Then address the two frictions I flagged: is the equal-chance/mirror conflict resolvable, or does the practice simply rank the two principles without admitting it; and what does the silent replacement of declinees presuppose about the relationship between willingness and membership? Finally, run the counterfactual I care about most. Suppose a city decided to build an assembly's frame from the all-affected principle rather than from the register — including long-term resident non-citizens, sixteen-year-olds, and, for a climate or infrastructure question, people not yet born and people living elsewhere who will bear the consequences. Explain which of those extensions the sampling technology can absorb and which it cannot, what has to give when the affected population has no list, no addresses, and in some cases no members yet, and whether the assembly would still be able to make the microcosm claim that does all the justificatory work in the current design. I would rather have your best reconstruction with its weak points marked than a survey of what the deliberative democracy literature says about mini-publics.
reasoning: |-
  Okay, the user is in a democratic theory seminar and has been studying the boundary problem. They're examining the recruitment protocols for citizens' assemblies and have several concerns. Let me start by understanding their main points.

  First, the user points out that these assemblies use pre-existing administrative lists, like electoral registers, to recruit participants. The process involves stratified random sampling and quota corrections to mirror the population's demographics. The legitimacy is framed as the assembly being a microcosm of the public. But the user thinks this approach presupposes a solution to the boundary problem instead of solving it. They see tensions between equal chance and mirror representation, and the treatment of refusals as noise rather than meaningful political expression.

  The user wants a reconstruction of the underlying theory of the demos in these practices. They want three layers: what's essential, what's compatible, and what's underdetermined. Specifically, they ask if the people are seen as attributes to sample or agents to summon, how quotas affect this, which inclusion views are foreclosed, and how the tensions between principles are handled. They also want a counterfactual where the assembly is based on the all-affected principle, including non-citizens, minors, future generations, and those affected elsewhere.

  I need to break down the presupposed theory. The core reliance on existing state lists means citizenship and age are foundational. Quotas treat the demos as a demographic aggregate, prioritizing statistical representation over individual agency. Refusals are managed administratively, implying that membership is passive. 

  The tensions: Equal chance vs. mirror representation—here, quotas show that mirroring trumps equal probability. Refusals are treated as irrelevant, suggesting membership is inherent, not requiring consent. 

  For the counterfactual, expanding to all-affected groups is problematic. Minors and non-citizens might be included if lists exist, but future generations and those outside jurisdictions can't be sampled. Without a list, the microcosm claim fails because there's no defined population to mirror. The assembly might shift to representing stakeholders, losing the statistical legitimacy.

  The user's deeper concern might be about the uncritical adoption of state-defined boundaries in deliberative democracy, masking normative choices. They might want to highlight how technical methods embed political assumptions, questioning if such assemblies can genuinely address democratic legitimacy without confronting boundary issues directly.
answer: |-
  Here’s a reconstruction of the implicit theory of the demos embedded in citizens’ assembly recruitment protocols, structured as you requested:

  ### **Core Presuppositions (What It Cannot Do Without)**
  1. **Pre-Existing State Jurisdiction as Foundational**:  
     The demos is coextensive with the state’s administrative reach. The electoral register or address file isn’t just a practical tool; it defines the *boundary of belonging*. Membership is **state-mediated**: you belong if the state recognizes you as a resident/citizen with formal standing.  
  2. **Passive Membership**:  
     Belonging is a status recorded by the state, not an act of consent or participation. Refusal to engage doesn’t negate membership—it’s an administrative hiccup.  
  3. **Aggregate Representation**:  
     The demos is a **statistical population** defined by demographic attributes (age, education, location, etc.). Legitimacy derives from mirroring these aggregates, not from individual agency.  

  ---

  ### **Compatible but Non-Essential Elements (What It Sits Alongside)**
  1. **Residence-Based Subjection**:  
     The practice aligns with the *all-subjected principle* if "subjection" is interpreted as residing under state jurisdiction. It doesn’t require active governance interaction.  
  2. **Descriptive Representation**:  
     The "microcosm" framing emphasizes reflecting societal diversity, compatible with Hanna Pitkin’s descriptive representation—but this is secondary to the state-boundary premise.  
  3. **Voluntarism Lite**:  
     Participation is voluntary, but refusal carries no political meaning; it’s neutralized by replacement.  

  ---

  ### **Underdetermined Elements (Where Rival Accounts Could Fit)**
  1. **Scope of "Affectedness"**:  
     The protocol doesn’t specify *how* affectedness is measured. A theorist could argue the state’s list implicitly defines "affected" parties, but it could also accommodate a narrower view (e.g., only legal citizens).  
  2. **Grounds for Quotas**:  
     Why correct for education but not income? The practice is agnostic about which demographics matter—this is politically negotiated, not theoretically resolved.  
  3. **Nature of Randomness**:  
     Is equal initial chance a moral imperative or a statistical convenience? The protocol doesn’t commit; it prioritizes outcomes (mirroring) over process (pure randomness).  

  ---

  ### **Key Tensions: Analysis**
  1. **Equal Chance vs. Mirror Representation**:  
     - **Conflict**: Quotas deliberately violate equal selection probability to achieve descriptive accuracy.  
     - **Resolution**: The practice **ranks mirroring above equal chance**, treating the latter as a defeasible tool. This presupposes that legitimacy flows from *outcome* (composition) not *process* (fair lottery).  
     - **Unspoken Claim**: A demos is legitimately represented when its *aggregate traits* are mirrored, even if some individuals (e.g., professors) are systemically deprioritized.  

  2. **Treatment of Refusal**:  
     - **Presupposition**: Membership is **involuntary and persistent**. Your place in the demos exists independently of your willingness to act on it.  
     - **Contrast with Elections**: Turnout signals political consent; here, refusal is apolitical noise. This rejects participation-based theories (e.g., Rousseauian active citizenship).  

  ---

  ### **Foreclosed Theories of Inclusion**
  - **All-Affected Principle**: Foreclosed by design. The register excludes non-resident affected parties (e.g., climate-impacted foreign communities) and future generations.  
  - **Consent-Based Membership**: Replaced by state-ascribed status. If belonging required consent, refusal would invalidate membership claims.  
  - **"Doing" Belonging**: Theories where membership is performative (e.g., through participation) are incompatible—the demos is a pre-existing dataset.  
  - **Cosmopolitan/Transnational Demoi**: Impossible without state-maintained lists.  

  ---

  ### **Counterfactual: Assemblies Based on All-Affected Principle**
  **Scenario**: A city defines "affected" to include non-citizen residents, 16-year-olds, future generations, and extraterritorial communities.  

  | **Group**               | **Sampling Feasibility** | **Required Compromises**                              |  
  |--------------------------|---------------------------|-------------------------------------------------------|  
  | **Non-citizen residents** | Technically feasible      | Requires non-electoral lists (e.g., tax records). Maintains "microcosm" claim if demographic quotas apply. |  
  | **16-year-olds**         | Feasible with new lists   | Needs school/enrolment databases. Quotas expand to include minors. |  
  | **Future generations**   | **Impossible**            | No list; no agency. Must shift to trusteeship (e.g., philosophers/advocates "representing" them). |  
  | **Extraterritorial affected** | **Impossible**        | No administrative list; jurisdictional boundaries ignored. Requires arbitrary selection (e.g., NGOs) or exclusion. |  

  **Consequences for Legitimacy Claims**:  
  - **Loss of "Microcosm" Legitimacy**: Without a defined, list-bound population, statistical representativeness collapses. How can you mirror a demos that has no address, age, or education data?  
  - **New Justification Needed**: The assembly shifts from "we mirror *the* people" to "we represent *stakeholders*." Legitimacy becomes **advocacy-based** (voice for affected interests) not **statistical**.  
  - **Operational Breakdown**: Sampling relies on state infrastructure. Without lists, recruitment becomes selective (e.g., civil society nominations), abandoning randomness.  

  ---

  ### **Conclusion: The Hidden Core**
  **The practice presupposes a statist, demographic theory of the demos**:  
  - **People as Distributions**: Quotas commit to this. The demos is a matrix of attributes; individuals are data points.  
  - **Agency vs. Summons**: It treats people as *summonable agents* only if they fit predefined categories. Their consent is irrelevant to their standing.  

  **What’s buried in the spreadsheet**: The state’s monopoly on defining membership. The protocol isn’t solving the boundary problem—it’s outsourcing it to the state’s bureaucratic machinery, then masking it with a veneer of statistical neutrality.  

  **Your professor’s "reality check" reveals a deeper truth**: Deliberative mini-publics *presuppose* a bounded polity. They can’t resolve the boundary problem; they can only operationalize a prior political settlement.
