  Okay, the user is writing a science column and is confused about a paragraph in Sidgwick's Methods of Ethics. They've paraphrased a section where Sidgwick argues that the timing of a pleasure shouldn't inherently make it more or less valuable, except for factors like uncertainty and vividness. Then he extends this reasoning to impartiality among persons, admitting he can't reconcile egoism with universal benevolence without assuming some moral order. The user has several specific questions about this passage.

  Breaking down the user's questions: First, they want to know if Sidgwick's argument about time is just a setup for his argument about persons. From what I recall, Sidgwick uses temporal neutrality as an analogy for impartiality between persons. The time argument isn't just a runway - it establishes a principle of neutrality that he then extends to interpersonal ethics. 

  Regarding the concessions about uncertainty and vividness, Sidgwick is clear these are legitimate practical reasons for discounting, but they're distinct from pure time preference. He's handing over psychological factors but not validating the philosophical claim that time itself justifies discounting. A defender of pure time preference couldn't claim victory here because Sidgwick maintains a conceptual distinction.

  On distinguishing rational vs psychological discounting - Sidgwick draws the line at whether the discounting is based on epistemic limitations (uncertainty) or cognitive limitations (vividness) versus treating futurity itself as value-reducing. The former can be rational adjustments, the latter irrational bias.

  The "point of view of the universe" isn't just decoration - it's his culmination of the impartial spectator argument. By this point in Book III he's established rational ethics requires universalizability, so the standpoint is earned. But it's worth noting he immediately admits its limitations when confronting egoism.

  About later thinkers building on this - Pigou's telescopic faculty critique directly echoes Sidgwick's vividness point, Ramsey's "failure of imagination" is essentially Sidgwick repackaged, and Parfit's non-relational features argument expands Sidgwick's core insight. The seeds are all there in this passage.

  To answer the key practical question: Yes, you can responsibly say Sidgwick considered pure time preference irrational. Your paraphrase captures the essentials correctly - no mangling detected. The critical nuance is his distinction between intrinsic valuation (where time is irrelevant) and practical decision-making (where psychological factors legitimately enter).

  The user seems professionally concerned about accurately representing philosophical positions in their column. They've done careful reading but hit a conceptual snag - exactly the kind of nuance their column likely aims to clarify for readers. Their questions suggest they want to present Sidgwick as grounding later economic critiques of discounting while acknowledging his concessions create space for behavioral approaches.
answer: |-
  Based on your paraphrase (which is accurate to Sidgwick's argument in III.XIII, particularly §3), here's a breakdown addressing your specific questions:

  1.  **Is the time move independent work or just a runway for the person move?**
      *   **Both, but primarily independent work establishing a core principle.** Sidgwick's argument against pure time preference in valuing one's *own* future pleasures is foundational. He's establishing a principle of *temporal neutrality*: the mere temporal location of a pleasure (past, present, future) is irrelevant to its *intrinsic value*. This is a crucial ethical and rational insight on its own. The "person move" (impartiality between individuals) is then presented as a *logical extension* of this same principle of neutrality applied to a different dimension (identity instead of time). The time argument demonstrates that location (in time) shouldn't affect intrinsic value; the person argument claims location (in space/person) shouldn't affect intrinsic value either. The time argument provides the *model* and *justification* for the person argument.

  2.  **Does conceding uncertainty & vividness gut the anti-discounting point?**
      *   **No, it absolutely does not.** This is the critical nuance. Sidgwick draws a sharp distinction:
          *   **Pure Time Preference (Irrational):** Discounting a future pleasure *solely because it is future*, implying its intrinsic value is less simply due to its temporal location. He rejects this as unreasonable.
          *   **Discounting for Uncertainty/Risk (Rational):** Discounting a future pleasure because there's a *chance it won't occur*. This is a rational adjustment for probability, applicable to *any* contingent future event, not specific to time preference.
          *   **Discounting for Reduced Vividness (Psychological, not Intrinsic):** Our weaker imaginative grasp of the future *affects our motivation* but does not change the *actual intrinsic value* of the future pleasure. This is a fact about human psychology, not a reason to claim the future pleasure is objectively less valuable. A defender of pure time preference cannot claim Sidgwick "handed over everything" because Sidgwick explicitly denies the core claim: that futurity *itself* reduces value. He concedes *pragmatic* and *psychological* reasons for *acting as if* the future is less important *in practice*, but maintains the *fundamental ethical principle* that it *isn't* intrinsically less important. He preserves the *rational ideal* while acknowledging *human limitations*.

  3.  **Where's the line between rational and psychological discounting?**
      *   **The line is drawn based on *why* the discounting occurs:**
          *   **Rational Discount:** Based on *epistemic limitations* (uncertainty, probability of non-occurrence). This adjusts the *expected value*. It's about the *likelihood* of the good being realized.
          *   **(Merely) Psychological Discount:** Based on *cognitive/affective limitations* (weakness of imagination, lack of vividness). This affects *motivation* and *felt concern* but does not change the *objective value* of the future good itself. Sidgwick sees this as a bias to be overcome by reason, not a justification.
          *   **Irrational Discount (Pure Time Preference):** Based *only* on the *temporal location* of the good, implying its intrinsic value diminishes with time. This is what Sidgwick unequivocally rejects as having no rational basis.

  4.  **Is the "point of view of the universe" doing work or decoration?**
      *   **It's doing essential argumentative work, and he *has* earned it *within his framework* by this point.** Sidgwick's entire project in the *Methods* is to systematize common-sense morality through rational intuitionism. A core principle he identifies and defends is the "axiom of Rational Benevolence": "that each one is morally bound to regard the good of any other individual as much as his own, except in so far as he judges it to be less, when impartially viewed, or less certainly knowable or attainable by him" (III.XIII.§3). The "point of view of the universe" is the ultimate expression of this impartiality – it represents the perspective where *all* individuals and their good are considered equally, stripped of the accidents of one's own spatio-temporal location or identity. He *needs* this standpoint to ground the universality and impartiality required by Rational Benevolence, which he has spent Book III arguing is a fundamental rational principle. It's the logical endpoint of removing the biases of self and time.

  5.  **How much later stuff is already here?**
      *   **The core ideas of Pigou, Ramsey, and Parfit are *directly present* in Sidgwick's paragraph:**
          *   **Pigou's "Telescopic Faculty":** Sidgwick's point about our "less vivid" imagination of the future *is precisely* what Pigou later termed the "defective telescopic faculty" causing irrational discounting. Sidgwick identified the psychological mechanism Pigou named.
          *   **Ramsey's "Failure of Imagination":** Ramsey's famous dismissal of pure time preference as "a practice which is ethically indefensible and arises merely from the weakness of the imagination" is essentially a pithy restatement of Sidgwick's combined points: rejecting intrinsic discounting + attributing practical discounting to psychological limitations (imagination/vividness).
          *   **Parfit's Non-Relational Features:** Parfit's argument that temporal location is a "non-relational" feature (like spatial location or personal identity) that shouldn't affect value judgments is *exactly* Sidgwick's core move. Sidgwick argues time (like person) is irrelevant to intrinsic value; Parfit deepens and formalizes this insight about the "irrelevance of location" in moral reasoning. Sidgwick provides the foundational argument Parfit builds upon regarding time specifically.

  **Your Key Question:**

  > **"Can I responsibly say in print that Sidgwick thought pure time preference was irrational?"**

  **Yes, absolutely and unequivocally.** Your paraphrase captures the essence correctly. Sidgwick explicitly states that the "mere difference of priority and posteriority in time" is "not a reasonable ground for having more regard to the consciousness of one moment than to that of another." He contrasts this with the *legitimate* grounds of uncertainty and vividness. His argument is a direct rejection of the rationality of discounting *solely* because a good is in the future. This is the bedrock of his critique.

  **In summary:** Sidgwick establishes temporal neutrality as a rational principle (time doesn't affect intrinsic value), using it as a model for interpersonal neutrality (person doesn't affect intrinsic value). He concedes *pragmatic* reasons for discounting (uncertainty) and a *psychological* reason (vividness), but these do not undermine his core rejection of *pure* time preference as irrational. The "point of view of the universe" is the crucial standpoint for impartiality he has been building towards. Later thinkers (Pigou, Ramsey, Parfit) explicitly draw on and refine these very Sidgwickian arguments. Your understanding and paraphrase are sound.
