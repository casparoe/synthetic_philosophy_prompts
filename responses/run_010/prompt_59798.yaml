  your procedure credits reports of absence and debits reports of presence, and that's not neutrality, that's a thumb on the scale. In blindsight you take the patient's denial — nothing there, I'm just guessing — and treat it as a finding about the experience; it's load-bearing for the whole story you tell about that case. But when somebody insists just as sincerely that there's something it's like to look at the red patch, you say fine, that's an entry in a world we're constructing, no ontological commitment. Same faculty, same sincerity, same lack of independent access from where you're standing, opposite weight. So give me one concrete case where your procedure handles a yes-report and a no-report differently, and where the difference isn't just your prior that there was nothing there to begin with. And don't answer that they're symmetric because both are merely reports — tell me what the method actually does differently in the two labs.
