  1. **Materials and Setup (5 min):**  
  Provide each team (3–4 teams) with 15 tokens and a shared "desk" (whiteboard or digital doc) that records room assignments only when queried. Explain: Guests arrive in waves; teams submit rules (≤25 words) to reassign current guests and assign new ones to rooms. Each rule costs 1 token, refunded only if it provably avoids collisions/stranded guests. Start with an empty hotel.  

  2. **Wave 1: Finite Guests (10 min):**  
  Announce: "10 new guests arrive." Teams submit rules (e.g., "Assign new guests to rooms 1–10"). Valid rules earn token refunds. *Debrief mapping: Potential infinity—rules handle finite steps; finitists accept this as "completed" finite work.*  

  3. **Wave 2: Countably Infinite Guests (15 min):**  
  Announce: "Infinitely many guests, labeled 1,2,3,..." Teams submit shifting rules (e.g., "Move current guest in room \(n\) to \(2n\), assign new guest \(k\) to \(2k-1\)"). Refund valid rules. *Debrief mapping: Actual infinity—treating infinite sets as whole objects; finitists reject "completed" infinities like this wave.*  

  4. **Wave 3: Nested Infinity (Buses) (20 min):**  
  Announce: "Infinitely many buses, each with infinitely many guests (seat 1,2,3,...)." Teams submit pairing rules (e.g., "Assign bus \(i\), seat \(j\) to room \(2^i3^j\)"). Refund if valid. *Debrief mapping: Actual infinity again—handling \(\infty \times \infty\) via "actualized" rules; finitists say this compounds the error.*  

  5. **Wave 4: Diagonal Wave (Subsets) (20 min):**  
  Announce: "Guests are all subsets of natural numbers." Teams use prior rules (e.g., list subsets as \(S_1, S_2, ...\)) to assign rooms. Invalidate all rules via diagonal: For rule \(k\), guest \(S_k\) refuses room \(k\) if \(k \in S_k\), or demands it if \(k \notin S_k\). Tokens lost. *Debrief mapping: Uncountability emerges from their rules; finitists say the game "cheats" by assuming infinite sets exist as objects (actual infinity), enabling impossible demands.*  

