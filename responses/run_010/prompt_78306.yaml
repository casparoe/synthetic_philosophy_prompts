prompt: |-
  So a friend of mine teaches a first-year seminar on how we know anything about the deep past — mostly freshmen, twenty-five of them, a mix of true-crime-podcast people and kids just filling a humanities requirement — and she got me a guest slot when her co-lecturer bailed. Seventy-five minutes, whiteboard only, no slides. The topic she's assigned me is "when does a legend become history," and the obvious version of that session is the greatest-hits tour: Troy, Arthur, the Exodus, three verdicts, done. I don't want to do that, partly because I'd be adjudicating things I'm not qualified to adjudicate and partly because a verdict isn't a transferable idea. The one narrow thing I actually want them to walk out with is this: an arguement from silence only has force once you've estimated how much trace that kind of event was likely to leave in the first place, and how likely we were to recover what it left. A mass movement of people through a small, closely administered, heavily excavated desert is one sort of claim; one warlord winning a skirmish in a post-imperial backwater with no chancery, no stone, and no surviving contemporary historian is a completely different sort. The sources are silent in both cases and the silence is not worth the same amount. In my notes I've been calling this the "detectability budget," which is my own coinage and not a real term — tell me honestly if it's actively misleading rather than merely informal, because I'd rather drop it than plant a bad picture in twenty-five heads.

  What I need from you is the plan, not the lecture. Give me the sequence: which ideas have to be in place before the weighting move even makes sense to someone who has never thought about sources at all (I suspect they need to see a text broken down claim by claim before they can weigh anything, and I suspect they need genre and purpose before they can break it down, but I don't know where the real load-bearing joints are), and what depends on what, with the reason at each step. Then the carrying example: pick the one case that does the work, and tell me what it has to have and what it has to lack for the idea to come through cleanly — I've been assuming Arthur, since the gap between the battle everyone's heard of and the ninth-century battle-list that first names him is so blatant, but maybe Troy is better because Hisarlik actually gives them a destruction layer and a Hittite archive with a place-name and a ruler's name that look suspiciously like the Greek ones, so they get to see detectability pay off rather than only fail. And then say what I do with the other two, and in what order, if they belong in the session at all — the Exodus is the one I'm most nervous about, since half the room will have some stake in it and I don't want the last twenty minutes to be about someone's childhood, though the Egyptian frontier record and the stele naming Israel as a people by around 1200 BCE make it the sharpest possible illustration of high-trace/low-recovery versus low-trace/high-stakes.

  Then the misconception map, and I want it in the order they'll actually arrive, not the order of severity. The one I'm sure of is the flat "no evidence means it didn't happen." The one I'm scared I'll create myself is the over-correction right after it — "so you can never actually rule anything out, it's all just a matter of faith" — which is the exact opposite failure and much stickier. I'd also guess "archaeology will settle it, we just haven't dug the right site yet," and "the story is true or false as a whole" rather than piece by piece, and probably a fifth one you can see coming that I can't. For each, tell me where in the sequence to head it off and roughly what I say or draw at that moment, and flag any that my setup will actively invite so I can change the setup. Tell me also what to openly refuse at this level — there's a whole pile of technical machinery behind this (dating methods, source criticism, oral-tradition theory, the politics of who gets to excavate) and I'd rather announce that I'm skipping it than blur it — and end with one exit question, ideally about a case they haven't seen in the session, that separates "understood the weighting move" from "learned the slogan." One last thing, and it's selfish: I'd like to lift the spine of this into a column afterwards, so if the teaching order doesn't work as an order for prose, tell me where it breaks and what to swap.
reasoning: |-
  Okay, let me tackle this teaching plan request. The user is preparing a guest lecture on when legends become history, with specific pedagogical goals and concerns. 

  First, I need to understand the core objective: teaching students to evaluate arguments from silence by considering detectability factors. The user wants to avoid superficial verdicts on Troy/Arthur/Exodus and instead build a transferable analytical skill. 

  The key insight is that silence means different things depending on two factors:
  1. Expected trace type/durability for the event
  2. Likelihood of recovering that trace

  I notice the user's term "detectability budget" might be problematic - it could imply a quantifiable resource when we're dealing with probabilities and unknowns. I'll suggest "detectability profile" as a more accurate alternative.

  For the teaching sequence, I consider the logical dependencies:
  - Students must first understand how claims are embedded in sources before evaluating silence
  - This requires analyzing source purpose and genre
  - Then we can introduce the detectability framework
  - Only after that apply it to case studies

  Arthur seems ideal as the primary case study because:
  - The gap between claimed event (5th-6th century) and first mention (9th century) is stark
  - Low-detectability context: post-Roman Britain had limited literacy, stone monuments, administrative records
  - Contrasts well with higher-detectability examples

  For other cases:
  - Troy can show successful detection (archaeology + Hittite texts confirming Wilusa)
  - Exodus serves as high-stakes contrast (Egyptian records exist but show no evidence of mass migration)

  Major misconceptions to address:
  1. "No evidence = didn't happen" (most common)
  2. "Can't rule anything out" (overcorrection risk)
  3. "Archaeology will solve it eventually"
  4. "All-or-nothing truth value"

  I'll weave in preemptive countermeasures throughout the lecture:
  - When introducing arguments from silence, immediately contrast high/low detectability scenarios
  - After Arthur analysis, explicitly state this doesn't prove non-existence
  - Use Troy to show detection success isn't always possible

  The exit assessment should test application of the framework to a new case - perhaps the founding of Rome, where students must evaluate what traces we'd expect from 8th century BCE events.

  For the column adaptation, I note that the teaching sequence works for prose if we:
  - Front-load the core principle
  - Use cases as illustrations rather than structural pillars
  - Group misconceptions thematically rather than chronologically

  Throughout this, I'm mindful of the user's concerns about:
  - Avoiding unqualified verdicts on sensitive topics
  - Preventing religious debates about Exodus
  - Not overwhelming beginners with technical jargon
  - Creating reusable pedagogical content
answer: |-
  Here’s a battle-tested plan prioritizing conceptual scaffolding, misconception avoidance, and transferable insight—structured for teaching flow first, with notes for column adaptation at the end.

  ---

  ### **Core Sequence: Load-Bearing Ideas & Order**
  1.  **Start with the Raw Material: What *is* a "Source"?**  
      *Draw:* A simple spectrum on the board: "Eyewitness Account" ←→ "Legend Written Centuries Later".  
      *Why:* Students equate "source" with "truth claim." They need to see sources as *artifacts* with context before dissecting claims.  
      *Key Move:* Ask: *"What did the creator of this source know, and what were they trying to achieve?"*  

  2.  **Break Down a Source Claim-by-Claim**  
      *Use:* A short, accessible text (e.g., a 3-sentence excerpt from *Historia Brittonum* on Arthur's battles).  
      *Do:* Annotate on the board:  
      - *Explicit Claim:* "Arthur fought at Mount Badon."  
      - *Implied Premise:* "Arthur existed"; "This battle was significant."  
      - *Source's Purpose/Genre:* "9th-century Welsh chronicle promoting Celtic heroism vs. Saxons."  
      *Why:* Students can’t weigh silence until they see claims as discrete units embedded in a context.  

  3.  **Introduce "Detectability" (Drop "Budget"; Use "Threshold" or "Profile")**  
      *Why "Budget" Misleads:* Implies a fixed, quantifiable resource. "Detectability Threshold" better conveys *minimum conditions needed* for evidence to survive.  
      *Draw:* A 2-axis framework:  
      - **Y-axis: Likelihood of Leaving Trace** (e.g., stone inscription vs. oral tradition)  
      - **X-axis: Likelihood of Recovery** (e.g., desert vs. rainforest; excavated vs. looted)  
      *Say:* *"Silence is meaningful ONLY if we’d expect a trace AND could find it."*  

  4.  **Primary Case Study: ARTHUR**  
      *Why It Works:*  
      - Ultra-low detectability: Post-Roman Britain (no administrative records, rare stone inscriptions, oral culture).  
      - High cultural stakes: Students "know" Arthur but see no contemporary evidence.  
      - Clear mismatch: 5th/6th-century event, first named in 9th-century text.  
      *Key Q:* *"What traces *should* exist if Arthur won major battles? Would they survive in 5th-century Britain? Could we dig them up?"*  
      *Reveal:* The crushing unlikelihood of physical/epigraphic evidence. **Silence here is WEAK evidence against.**  

  5.  **Contrast Case: TROY**  
      *Why Now:* Shows detectability *succeeding*, avoiding despair.  
      *Focus:*  
      - High detectability: Bronze Age palatial city (stone, clay tablets, trade records).  
      - Recovery: Hissarlik’s destruction layer (VIIa) + Hittite archives ("Wilusa" = Ilion, "Alaksandu" ≈ Alexander/Paris).  
      *Punchline:* *"Here, silence WOULD be significant—and we *aren’t* silent. We have names, destruction, diplomacy. Detectability met!"*  

  6.  **EXODUS: Handle with Care (Optional, Place Last)**  
      *Why Include?* Sharpest high-trace/low-recovery case:  
      - *High trace expectation:* Egyptian bureaucracy documented everything (grain, border crossings, rebellions).  
      - *Low recovery plausibility:* Perishable papyrus; lost delta archives; no camp traces in Sinai.  
      *But:** *"Israel" stele (~1200 BCE) shows the *people* existed then.*  
      *Strategy:*  
      - Present *only* the Egyptian administrative context + the Merneptah Stele.  
      - **Explicitly refuse theology:** *"We’re only asking: ‘Could Egyptian records capture a mass migration? Did they survive?’"*  
      - If challenged: *"That’s beyond today’s scope—we’re focused on how detectability shapes historical reasoning."*  

  ---

  ### **Misconception Map (in Order of Appearance)**
  1.  **"No evidence = It didn’t happen."**  
      *When:* Right after introducing arguments from silence.  
      *Head Off:* During Step 3 (Detectability Framework). Say: *"Silence isn't a 'no'—it's a 'we don't know YET.' First, ask: *Should* we see evidence?"*  
      *Visual:* Circle the **low trace/recovery** quadrant of your framework.  

  2.  **"The story is true or false as a whole."**  
      *When:* During Step 2 (Breaking down claims).  
      *Head Off:* When annotating Arthurian text. Ask: *"Could the battle be real but the dragon fake? Why might a chronicler *add* elements?"*  

  3.  **"Archaeology will settle this eventually."**  
      *When:* During Arthur discussion.  
      *Head Off:* When stressing post-Roman Britain’s *lack of durable traces*. Draw: A crumbling wood fort vs. a stone temple. *"No amount of digging finds what never existed or dissolved."*  

  4.  **Overcorrection: "So we can never rule *anything* out!"**  
      *When:* After Arthur’s low-detectability verdict.  
      *Head Off:* **Immediately pivot to Troy.** Say: *"But sometimes detectability *is* met—like in well-documented states. Troy shows silence *can* be decisive when traces *should* survive."*  

  5.  **(Your Blind Spot) "Written sources are always primary evidence."**  
      *When:* When comparing Troy’s texts vs. archaeology.  
      *Head Off:** During Step 1 (Source Spectrum). Ask: *"Is an epic poem written 500 years later ‘better’ than a pot shard from the event? Why/why not?"*  

  ---

  ### **What to Openly Skip**
  Announce early:  
  *"Today, we’re zooming in on one tool: weighing silence. We’re skipping:*  
  - *How sources are dated (paleography, carbon-14),  
  - How oral traditions work,  
  - Excavation methods/politics.  
  *These matter—but we’d need weeks!"*  

  ---

  ### **Exit Question (Tests the Weighting Move)**  
  *"The founding of Rome by Romulus in 753 BCE:  
  - What traces would you *expect* from a small village in 8th-century Italy?  
  - What *survives* from that time/place?  
  - Does silence about Romulus mean he didn’t exist? Why?"*  

  **Why it works:**  
  - Low urbanization era → low trace expectation.  
  - Archaeology shows huts on Palatine Hill (~750 BCE) → physical evidence of settlement.  
  - Forces distinction between "founder myth" and "settlement evidence."  

  ---

  ### **Column Adaptation Notes**  
  The teaching order **works for prose** if you:  
  1. Start with the **detectability framework** (Step 3) as the hook.  
  2. Use **Arthur** (Step 4) to illustrate low-detectability silence.  
  3. Contrast with **Troy** (Step 5) for high-detectability success.  
  4. **Swap Exodus** for a less charged example (e.g., Viking settlements in North America) unless writing for a specialized audience.  
  5. Group **misconceptions** thematically in the column (e.g., "The All-or-Nothing Fallacy" covers #1, #2, and #4).  

  **Selfish Bonus:** The exit question becomes the column’s kicker—readers apply the lens themselves.  

  ---
  This plan builds the "weighting move" stepwise, avoids quicksand, and leaves students with a forensic tool. Good luck—and turn that column into a viral explainer!
