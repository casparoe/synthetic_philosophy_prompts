prompt: |-
  ok so I'm in a philosophy of medicine seminar and my final paper is basically me trying to figure out whether I'm a naturalist about disease, which sounds like a weird thing to be undecided about but I keep flip flopping. The setup our prof gave us: the Boorse-style line is that a disease is a subnormal part-function relative to a reference class picked out by age and sex, where "subnormal" is supposed to be a plain statistical/functional fact, and all the values come in later, at the level of which dysfunctions we bother to treat or accommodate. The normativist reply is that you can't even get the reference facts without smuggling in judgments about what a good life or a typical enviornment looks like — Kingma's point that function claims are always relative to an environment, so specifying "the typical environment" either quietly does the evaluative work for you or leaves you stuck. Wakefield's harmful dysfunction is meant to be the hybrid escape hatch: genuine dysfunction on the natural side, harm on the value side.

  Here's the case I want you to anchor on. I made it up but I don't think it's crazy: suppose a common inherited variant cuts sweat gland density by something like 40 percent. In a temperate climate with air conditioning and mostly sedentary work, carriers never notice anything — no symptoms, no reduced lifespan, nothing flags on any test. In a humid tropical setting with outdoor physical labor, the same variant roughly triples heat-stroke risk. Nothing internal is malfunctioning relative to its own physiology in the first setting, the trait isn't obviously rare enough to be "subnormal" globally, and there's no suffering or disability at all in the environment most carriers actually live in. Whether it's a disease looks like it turns on where you happen to be, which is what I can't get past.

  So: give me your actual credence, one number, that a value-free naturalist core is doing genuine work in the concept of disease — meaning that you could pick out which states are diseases for real people in real populations using only non-evaluative facts about species-typical functioning (reference classes, statistical typicality, physiological or evolutionary design), such that stripping out the evaluative part would change the extension and not just our attitudes toward it. I don't want "it depends which flavor of naturalism you mean" as an answer, decompose it. At minimum I'd want a term for the probability that environment-relativity is fatal rather than fixable by just stipulating an explicit (even arbitrary) reference environment; a term for the probability that the reference class problem — whose age/sex/subpopulation counts as "normal" — can be handled without values; a term for whether hybrids like harmful dysfunction actually escape the objection or just relocate the value question into "dysfunction"; a term for the possibility that "disease" isn't one concept at all, so the whole debate is a metalinguistic negotiation over which concept to legislate into clinical practice and public health policy; plus anything else you think belongs that I've left out. A number and one line of justification for each, then how they combine into your final credence. Also, my number is 0.35 and my labmate's — she came in from public health and thinks species-typical function talk is mostly ideology in a lab coat — is 0.05. Tell me which single term you think the two of us are actually disagreeing about, since I suspect it isn't where either of us thinks it is, and then say which term your final number is most sensitive to and what argument or evidence would move it most. Please write the whole thing in American English.
