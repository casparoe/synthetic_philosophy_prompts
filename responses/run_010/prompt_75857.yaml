prompt: |-
  I am putting together the opening handout for a graduate seminar on the foundations of statistical mechanics, and my brief is to produce a single sheet that says, before we read any candidate accounts, what such an account has to be able to do in order to count as an explanation of the direction of time rather than a redescription of it. The seminar keeps foundering because people argue past one another: one camp says an account that posits a special low-entropy beginning has merely relocated the puzzle, the other says an account that does not has failed to explain why we are not living in a fluctuation, and a colleague of mine who works in condensed matter says the whole dispute is idle because in the laboratory the arrow is just a matter of boundary conditions and driving. Please take up the role of a philosopher of physics who has thought hard about what would count as a genuine explanation here. I want the desiderata for a theory that could be defended in a viva as a complete account of why physical processes are temporally directed — not merely a self-consistent story about why entropy rises in this or that system, but one that also underwrites the ordinary asymmetries we lean on: that we have records of the past and none of the future, that we can intervene on the future but not on the past, that causes precede their effects, that radiation goes out rather than converging in.

  Two constraints on the list. First, it must be usable against accounts that refuse to postulate a privileged initial condition for the whole universe as well as against accounts that embrace one, so any requirement that can only be failed by a theory on one side of that divide is not a desideratum but a sectarian demand, and I want those labelled rather than smuggled in. Second, the requirements must bite on the standard objections and on the messy cases, not only on the textbook ones: velocity reversal, recurrence on absurdly long timescales, the fact that fine-grained entropy is constant under Hamiltonian evolution so that any increase is a function of how we describe the system, the question of which macrovariables make a coarse-graining the natural one, and the behaviour of small systems observed for short intervals, where fluctuations are not negligible but routine. Where you believe two or more of the five cannot be satisfied together, say so inside the items themselves rather than in a separate discussion.

  Give me exactly five numbered desiderata and nothing else: no preamble, no summary, no parting remark, and no suggestions for further reading. Each item should be tight — at most three sentences — naming the requirement, giving the concrete consideration or counterexample that shows it to be a real demand rather than a taste, and closing with a square-bracketed tag reading either non-negotiable, negotiable, or camp prejudice; add a second tag, decisive, to the single item you think eliminates the most candidates. You may reason privately as long as you like, but the deliverable is the list alone. On the epistemic side I would much rather have five well-motivated requirements with an honest account of their status than a confident-looking checklist: where practitioners who know this material genuinely disagree about whether a demand is legitimate, say so plainly in the item and do not write as though your own camp's requirement were consensus, but where something is settled — that recurrence is a theorem whose timescales make it empirically irrelevant, that the constancy of fine-grained entropy forces any account of increase to say something about description or about initial conditions — treat it as settled and do not hedge it. Write throughout in British English.
reasoning: |-
  Hmm, the user is preparing a handout for a graduate seminar on statistical mechanics foundations, specifically about what makes a theory genuinely explain the direction of time. They want a list of five desiderata that can evaluate any account—whether it posits a special initial condition or not—and that addresses real philosophical and physical challenges. The seminar has been contentious, with camps arguing about whether positing a low-entropy beginning merely relocates the puzzle or whether omitting it fails to explain why we don't see fluctuations. There's also a dismissive view from condensed matter physics that the arrow is just about boundary conditions in the lab. I need to step into the role of a philosopher of physics and distill this into a tight list.

  The user has strict constraints: exactly five numbered items, no preamble or extras, each limited to three sentences. Each item must name a requirement, show why it's necessary through concrete considerations or counterexamples, and end with a status tag: non-negotiable, negotiable, or camp prejudice, plus one item tagged as decisive. I have to use British English and be honest about disagreements among experts. Crucially, I must avoid smuggling in sectarian demands that only apply to one side of the initial-condition debate.

  Now, brainstorming the desiderata. The core puzzle is that statistical mechanics seems to describe entropy increase but doesn't inherently explain why it happens only forward in time. Key issues include: velocity reversal paradoxes (if you reverse all momenta, entropy should decrease, but we never observe this), Poincaré recurrence (systems return to low entropy states eventually, but on absurdly long timescales), the fact that fine-grained entropy is constant under Hamiltonian dynamics (so entropy increase depends on coarse-graining), the problem of what makes a coarse-graining "natural," and the behavior of small systems where fluctuations are common.

  For the first desideratum, I'm thinking about entropy increase. A theory must explain why entropy reliably increases in typical macroscopic systems over relevant timescales. But it can't ignore fluctuations—we see them in small systems, like Brownian motion, so the account must handle why they're suppressed in large systems. This should be non-negotiable because it's central to the arrow of time.

  Second, velocity reversibility. If a theory predicts entropy increase only forward, it must explain why reversing velocities doesn't lead to observable decrease in entropy. This tests if the explanation is dynamical or relies on hidden assumptions. It's a standard objection, so it's non-negotiable. The counterexample is clear: if we could reverse velocities, entropy should decrease, but it doesn't in practice.

  Third, the status of the past. We have records of the past but not the future, and causes precede effects. A theory must ground this asymmetry without presupposing it. For instance, it should explain why we can't intervene on the past. This is tricky because it ties into broader asymmetries like causation and memory. I'll mark it as negotiable since experts debate how deeply statistical mechanics needs to address this versus it being a separate philosophical issue.

  Fourth, coarse-graining naturalness. Any account that relies on coarse-graining must justify why some macrovariables are privileged, like why we use pressure and temperature instead of arbitrary groupings. The counterexample is that without this, entropy increase could be an artifact of description. This is a camp prejudice because it's contentious: some think initial conditions solve it, others think it's unresolved.

  Fifth, recurrence and fluctuations. A theory must explain why recurrence (systems returning to low entropy) isn't observed and why fluctuations don't dominate in large systems over human timescales. The counterexample is small systems where fluctuations are routine, so the account must scale correctly. I'll tag this as decisive because it eliminates many naive theories—e.g., those that ignore cosmological initial conditions might struggle with why the universe doesn't fluctuate to low entropy now.

  I need to ensure the list is balanced. The decisive item is recurrence because it forces a choice: either initial conditions make recurrence times astronomically long, or something else does, but omitting it leads to absurd predictions. For tags: items 1, 2, and 5 are non-negotiable; 3 is negotiable; 4 is camp prejudice. I'm using British English spellings like "behaviour" and "coarse-grained."

  Finally, double-checking against constraints: five items, no extras, concrete counterexamples, tags applied, and honesty about disputes. This should help the seminar focus on what truly matters in evaluating theories of the arrow of time.
answer: |-
  1.  **Macroscopic Entropy Increase Under Normal Conditions:** The account must explain why, for common macroscopic systems isolated from persistent external driving and prepared in typical non-equilibrium states, entropy reliably increases towards equilibrium over accessible timescales. It must simultaneously accommodate the empirical reality of fluctuations (e.g., Brownian motion) and explain their suppression in scale and duration for large systems under ordinary conditions, without resorting to tautological definitions of 'typical' or 'normal'. [non-negotiable]

  2.  **Robustness Against Velocity Reversal:** The account must explain why physically reversing all particle velocities (a microstate symmetry of the underlying dynamics for many systems) does not typically lead to observable macroscopic entropy decrease over subsequent time, despite being dynamically possible. It must address why such reversed states are never encountered in practice as initial conditions for systems evolving *towards* equilibrium, exposing whether the asymmetry is grounded in dynamics or initial conditions. [non-negotiable]

  3.  **Grounding Temporal Asymmetries (Causation, Records, Intervention):** The account must underwrite, or be compatible with a coherent story for, fundamental temporal asymmetries like the existence of records only of the past, the possibility of intervening on the future but not the past, and the correlation of causes preceding effects. It must explain why radiation typically diverges from sources rather than converging onto them. Crucially, this grounding must not merely presuppose these asymmetries as brute facts. [negotiable] *Practitioners disagree on whether statistical mechanics alone must fully explain these or if they require additional philosophical or physical principles.*

  4.  **Justification of Privileged Coarse-Graining:** If the account relies on coarse-graining (defining macrostates/macrovariables to establish entropy increase), it must provide a non-arbitrary physical justification for *which* coarse-graining is privileged or 'natural' (e.g., why local densities, not Fourier modes above some cut-off). It must confront the counterexample that constant fine-grained entropy under Hamiltonian evolution means any increase depends on description, avoiding circular justifications based solely on observed increase. [camp prejudice] *This is contested: some view a justification as essential, others believe cosmological initial conditions render it unnecessary or that the demand is misplaced.*

  5.  **Empirical Irrelevance of Recurrence & Suppression of Cosmological Fluctuations:** [decisive] The account must explain why Poincaré recurrence (guaranteed return to low-entropy states on vast timescales for bounded systems) and the possibility of large entropy-decreasing fluctuations are empirically irrelevant over cosmological history and human timescales. It must address why we do not observe ourselves to be in a low-entropy fluctuation *now* and why the universe's observed large-scale structure and thermodynamic history are incompatible with being a typical fluctuation from equilibrium, even for a universe potentially infinite in time or space. [non-negotiable]
