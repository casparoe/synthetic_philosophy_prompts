  | **7. Deflationary aggregate** | a=Functional or Convention, b=Yes, c=Nothing, d=Independent, e=Manufacture, f=Unimportant, g=Random | Dismissing the mark pairing (Obs 2) as random despite its recurrence, treating it as coincidental. | Obs 1 (shape variety), Obs 4 (contextual rarity). | Obs 2 (marks), Obs 3 (building concentration). | Stratigraphic layers showing objects used differently over time. | Recurrent shape-mark combinations across contexts, indicating a unified system. |
  | **8. Licensed agnosticism** | All answer patterns not matching leaves 1–7 (e.g., a=Centralized, b=Yes, c=Language, d=Independent, e=Curation, f=Conclusion, g=Updating) | None—its commitment to underdetermination avoids awkwardness by suspending judgment. | Obs 7 (hoard), Obs 2 (marks) as evidence of ambiguity. | None—all observations are treated as potentially relevant but inconclusive. | A decipherable inscription linking marks to a specific practice. | Any single finding that decisively supports one leaf (e.g., mold fragments for leaf 1). |

