  ### Decision Tree for Tell Ardum Assemblage Interpretation

  The following decision tree uses seven nodes to sort respondents into one of eight interpretive positions based on the Tell Ardum observations. Each node is presented as a question with answer options, phrased neutrally to avoid revealing the destination leaf. Observations informing each node are cited, and nodes requiring background assumptions (marked with an asterisk) include a brief statement of that assumption. The tree proceeds in fixed order (a → b → c → d → e → f → g), but as the leaf assignment depends solely on the answer combination (not the order), reordering nodes does not change the leaf outcome for a given respondent. All nodes are traversed by every respondent.

  1. **Node a: What best explains the standardization of the common shapes? (Obs 1, 10, 11)**  
     - Centralized control of production.  
     - Social convention without central control.  
     - Functional requirements of use.  
     *\*Background assumption: Standardization in artifacts must arise from either centralized control, social convention, or functional necessity.*  

  2. **Node b: Does depositional context (midden, floor, vessel) indicate different uses for the objects? (Obs 3, 4, 11)**  
     - Yes.  
     - No.  
     *\*Background assumption: Depositional context can reliably indicate object function or use.*  

  3. **Node c: What is the most likely role of the incised marks? (Obs 2, 5, 6)**  
     - Encode language (e.g., words or numbers).  
     - Encode non-linguistic symbolic information (e.g., ownership or group identity).  
     - Have no encoded meaning (e.g., decorative or incidental).  
     *\*Background assumption: Marks on objects can function as encoded symbols or language.*  

  4. **Node d: What does the off-site hoard indicate about the objects? (Obs 7)**  
     - Shared meaning across the distance (same system understood at both sites).  
     - Movement of objects without shared meaning (objects transferred, but meaning not necessarily retained).  
     - Independent convergence (similar objects arose without contact).  
     *\*Background assumption: Object similarity across distant sites can result from shared culture, trade, or independent invention.*  

  5. **Node e: What does the production evidence (moldability, lack of wasters) primarily indicate? (Obs 10, 11)**  
     - About the conditions of manufacture.  
     - About the conditions of curation and deposition.  
     *\*Background assumption: Production evidence can illuminate manufacturing processes or post-depositional histories.*  

  6. **Node f: How should the conventional description of the large building as "non-domestic" be treated? (Obs 3)**  
     - As a premise for interpreting the objects (accept the description as given).  
     - As a conclusion to be tested by the evidence (evaluate based on objects).  
     - As unimportant for interpreting the objects (disregard the description).  
     *\*Background assumption: Building function is relevant to interpreting associated objects.*  

  7. **Node g: What does the pairing of marked objects (differing in one sign) most likely indicate? (Obs 2)**  
     - A system of verification (e.g., matching records).  
     - A system of updating or correction (e.g., amending information).  
     - Random variation or coincidence.  
     *\*Background assumption: Patterned variation in marks can indicate intentional systematic practices.*

  ---

  ### Leaf Summaries
  For each interpretive position (leaf), the table below provides:  
  - **Answer patterns**: Combinations of node answers that lead to the leaf.  
  - **Most awkward commitment**: A key challenge for the position, including an observation it must explain away or treat as coincidental.  
  - **Treated as decisive**: Observations central to the position.  
  - **Treated as noise**: Observations downplayed or disregarded.  
  - **Strengthening evidence**: One new piece of evidence (from excavation/analysis) that would most support the position.  
  - **Damaging evidence**: One new piece of evidence that would most undermine it.  

  | Leaf | Answer Patterns | Most Awkward Commitment | Treated as Decisive | Treated as Noise | Strengthening Evidence | Damaging Evidence |
  |------|----------------|------------------------|---------------------|------------------|------------------------|-------------------|
  | **1. Quantitative record-keeping** | a=Centralized, b=No, c=Language, d=Shared, e=Manufacture, f=Premise, g=Verification | Dismissing the off-site hoard (Obs 7) as evidence of contact despite no other shared material culture. | Obs 2 (marks), Obs 3 (building concentration). | Obs 7 (hoard isolation), Obs 4 (rare shapes). | Mold fragments in the large building confirming centralized production. | Marks on objects in domestic contexts showing wear, contradicting pre-firing non-use. |
  | **2. Bilateral counterfoil** | a=Convention, b=No, c=Non-linguistic, d=Movement, e=Manufacture, f=Premise, g=Verification | Explaining the marks (Obs 2) as non-linguistic while requiring their pairing for verification, despite no suspension holes (Obs 9) for portability. | Obs 2 (pairs), Obs 5 (no wear on marks). | Obs 7 (hoard), Obs 8 (late mark appearance). | Paired objects found in separate households with matching wear patterns. | Identical paired sequences in multiple locations, contradicting unique agreement records. |
  | **3. Votive** | a=Convention, b=Yes, c=Non-linguistic, d=Shared, e=Curation, f=Premise, g=Random | Assuming shared meaning for the off-site hoard (Obs 7) despite no evidence of contact, treating isolation as coincidental. | Obs 4 (sub-floor caches), Obs 6 (ochre, charred grain). | Obs 1 (standardization), Obs 10 (ease of molding). | Inscriptions on the vessel (Obs 3) directly referencing deities or offerings. | Common shapes found in high-wear domestic contexts (e.g., hearths), contradicting votive use. |
  | **4. Aleatory** | a=Functional, b=No, c=Nothing, d=Independent, e=Manufacture, f=Unimportant, g=Random | Treating the marks (Obs 2) as meaningless despite their structured pairing, requiring it to be coincidental. | Obs 1 (standardization), Obs 10 (moldability). | Obs 2 (marks), Obs 6 (ochre). | Wear patterns on all faces consistent with repeated throwing. | Concentration of objects in the building (Obs 3) showing no dispersal, contradicting throwing use. |
  | **5. Implement** | a=Functional, b=Yes, c=Nothing, d=Movement, e=Manufacture, f=Conclusion, g=Random | Rejecting the non-domestic building (Obs 3) as a premise, yet treating context as discriminatory without explaining the thick walls. | Obs 10 (moldability), Obs 5 (handling wear). | Obs 2 (marks), Obs 8 (shape changes). | Residues on objects matching specific craft materials (e.g., dyes, fibers). | Marked objects showing no functional differences from unmarked ones. |
