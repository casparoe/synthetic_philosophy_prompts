answer: |-
  ## Brainstorming (191 words)

  The core puzzle: **Can bureaucratic "error" create genuine loss when the outcome (a beloved child) seems identical?** The parents feel a specific *possible* child was erased by the delay—a ghost sibling. My narrator's ledger ritualizes this intuition: each named near-miss (Maya/crooked tooth, Leo/February laugh) embodies a unique essence tied to origin. The lot number isn't just data; it's a secular baptismal font. Her own lot number discovery isn't dramatic. It surfaces during routine file verification – perhaps her mother's old clinic records cross-referenced with a current case. She sees her patient ID, then "Cycle 2" next to the embryo lot used. No fanfare. It’s a cold fact nestled in a spreadsheet. The impact is interior: her ledger practice, once a melancholic hobby, now implicates *her*. Was *she* a "near miss" for another? The final scene avoids summary by focusing on sensory detail: her hand hovering over the ledger, the texture of the paper, the sound of the clinic hallway outside her office. Does she write her own name? Does she close the book? The gesture *is* the question, suspended. The report remains unwritten in the text; the ambiguity *is* the resolution.

  ---

  **The Ledger Keeper**

  Mrs. Delaney’s voice on the recording was frayed silk. “We love Chloe. Fiercely. She’s perfect. But… we lost someone else. The child we were *supposed* to have. The one from that first batch.” Her husband, Mark, cleared his throat, a rough sound like stones grating. “It feels like… like a twin vanished before they were born. A specific one.”

  I transcribed their words for the insurer’s report. Another cancelled cycle, another delayed transfer. Standard procedure at the Haven Fertility Centre dictated discarding unused embryos after a certain period. Standard for the clinic, catastrophic for the biological calculus of hopeful parents. The Delaneys’ first viable embryos – Lot #A7G42 – were thawed but never transferred due to a sudden, transient uterine anomaly flagged during the final pre-transfer check. One month later, Lot #A8B19 gave them Chloe. Healthy, beloved Chloe. Their claim wasn’t about medical malpractice on Chloe’s behalf. It was a metaphysical injury: the erasure of Child A7G42.

  My job, ostensibly, was to determine if their loss was legally cognizable. Did Child A7G42 *exist*, in any sense that mattered to an insurance payout? Or was it merely a counterfactual phantom?

  The clinic’s digital archive held the cold facts. Temperature logs for the liquid nitrogen Dewars. Technician initials on the discard authorization for #A7G42. The embryologist’s notes: “Grade 1AA. Optimal morphology.” A cluster of pixels on a screen. A number.

  Beside my terminal sat a different kind of record. A leather-bound notebook, unremarkable. Inside, my private ledger. Lot #A7G42 wasn't discarded here. Here, she was **Maya**. I’d written it months ago, the ink slightly smudged. Below it: *Crooked front tooth, like her grandmother in the photos.* Why that? A half-remembered detail from Mrs. Delaney’s family history intake form, perhaps. Imagination filling the void left by discarded potential. Lot #D3F11 (discarded, poor progression): **Leo**. *Would have laughed exactly two seconds after waking up.* Lot #E9K22 (cryopreservation failure): **Anya**. *Conceived in February; hated the cold.* It wasn’t grief exactly. More like… cartography. Mapping the archipelago of might-have-beens.

  I met Dr. Aris Thorne, Haven’s lead embryologist, ostensibly to clarify technical timings. He was a precise man, fingers stained faintly yellow from pipette tips. We sat in his cramped office overlooking the lab, sterile light glinting off stainless steel. He saw my open folder, the Delaney case flagged.

  “Ah, the ‘lost child’ claim,” he sighed, stirring his tea – Earl Grey, the scent sharp in the clinical air. “Tragic for them, emotionally. Legally? Philosophically? Murky.”

  “They feel a specific child was lost,” I ventured. “That Chloe, wonderful as she is, isn’t the one they initially prepared for.”

  Aris leaned back, steepling his fingers. “But what *is* that ‘one’? Think of an acorn.” He gestured towards the window where a sprawling oak dominated the clinic lawn. “That tree grew from *this specific acorn*. Plant another acorn from the same tree, even right beside it. Does it become *that* tree? No. It becomes another tree. Similar, perhaps, same species, same potential height. But fundamentally different. Its history is bound to its origin.” His voice was calm, didactic, devoid of jargon. “The essence of the oak *is* that it sprang from *this* seed, weathered *these* specific storms, absorbed nutrients from *this* exact patch of soil. Change the seed, change the origin point… you change the entity. Chloe is Chloe because she came from Lot #A8B19. The child from #A7G42 would have been someone else. Someone unique. Gone.” He took a measured sip. “The parents aren’t wrong to feel that loss. They prepared for one specific possibility. That possibility was extinguished.”

  It landed with surprising weight. Maya, with her crooked tooth, felt suddenly more real, more irrevocably *absent*. The acorn wasn’t just an analogy; it felt like truth.

  Later, sharing coffee with Lena Chen from Billing, the smoothness of Aris’s logic met friction. Lena was pragmatic, sharp, navigating insurance codes like a native language. I mentioned the case obliquely, the parents' claim.

  “Lost a different kid?” Lena snorted softly, tapping a stack of invoices. “Because they used a different freezer batch? That’s… poetic. But messy.” She dumped a sugar packet into her mug – “World’s Okayest Mom” printed on the chipped side. “Okay, say this Chloe is made of… atoms, right? Trillions of ‘em. Say, back at the very start, just *one* molecule in that winning sperm was different. Would she still be Chloe? Probably, yeah? Feels like her, acts like her.” She stirred vigorously. “Swap another molecule. Still her? Probably. Where do you draw the magic line?” She pointed her spoon at me. “Why are the *exact* sperm and egg the sacred line? Why not the exact moment of conception? Or the exact uterine environment that month?” She shrugged. “Maybe ‘could have been me’ just means ‘someone a lot like me, in another life.’ Less heartbreaking, maybe. Less… absolute.” She took a loud slurp. “We’re all just specific arrangements of stuff that happened to stick.”

  Lena’s objection echoed in the quiet of my office. Where *was* the line? Was Maya, defined by a hypothetical crooked tooth, truly a distinct *person* lost, or just a vivid ghost story conjured by grief and my ledger? Was Lena right? Was “the other child” just shorthand for a profound sense of disrupted narrative, not a literal, counterfactual individual?

  The Delaney report deadline loomed. My draft was sterile, factual, avoiding the essential question. I opened my ledger, seeking… what? Solace? Clarity? Permission? My finger traced the entry for Maya. *Crooked front tooth.* I imagined her grin. Aris’s acorn. Lena’s shifting molecules. The weight of the parents' sorrow felt tangible.

  Then, verifying donor information cross-referenced for an unrelated case – a routine quality check – my own patient ID popped up. Standard procedure involved linking current patients to historical fertility treatments if applicable. There it was: **Patient ID: S. Vance. Source Embryo: Lot #H2R77.** And below, a smaller notation: **Cycle: 2. Previous Attempt Cancelled (Cycle 1): Uterine Lining Suboptimal. Lot #H1F33 Discarded.**

  The air left the room. The hum of the computer tower sounded deafening. Lot #H1F33. Discarded. Like Maya. Like Leo. Like Anya. Cycle 2. Like Chloe.

  My hand went to the ledger. It lay closed beside me. The smooth leather felt suddenly alien. The names inside – Maya, Leo, Anya – shimmered with a terrifying new light. Had my mother, years ago in a different clinic under fluorescent lights, felt a pang for Lot #H1F33? The child-that-wasn’t? The acorn not planted? Did she imagine a laugh, a birth month, a crooked tooth? Or was she, like Lena, relieved that *a* child, *this* arrangement of stuff, finally stuck?

  I didn’t open the ledger. Didn’t reach for a pen. I simply sat. My other hand rested on the desk, fingers brushing the edge of the cool, smooth wood. Outside my door, the muffled sounds of the clinic continued – footsteps, a distant phone ringing, the low murmur of a consultation. Life, in its messy, contingent flow. The report for the Delaneys remained unfinished on my screen, the cursor blinking patiently beside the empty field labeled **Conclusion Regarding Loss of Specific Identity**. My gaze drifted from the screen to the closed ledger, then down to my own hand resting on the wood grain – the lines of the palm, the slight ridge of a childhood scar near the thumb, the pulse faintly visible at the wrist. Just specific arrangements of stuff. Arrived via Cycle 2.
