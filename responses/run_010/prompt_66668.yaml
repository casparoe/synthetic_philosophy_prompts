prompt: |-
  I write a science-and-ideas column and I'm trying to pin down what I actually mean by "science" before I file, because I keep using the word as a compliment. My gut verdicts:

  - Newtonian mechanics: science, even though we know it's wrong.
  - Psychoanalysis, the Freudian kind: not science. Nothing ever counts against it.
  - Astrology: not science, obviously.
  - The dinosaur-killer asteroid hypothesis: science, even though nobody can rerun the experiment.
  - Descriptive natural history — somebody spending ten years cataloging which beetles live on which ridge: definitely science, though I couldn't tell you what would falsify a beetle catalogue.
  - Parapsychology: here's my problem. They pre-register, they run the controls, they publish there failures, they've been publicly humiliated for decades. On self-criticism they beat most of physics. But I want to say it isn't science.
  - The black-box neural net that now beats the physics-based weather models, where nobody can say why it works: I want to call that science too — and I notice that sits badly with what I just said about parapsychology.

  My own tentative rule, which I came up with after a long lunch with a physicist: a field is a science to the degree that there's some specific event in the world that would make its practitioners professionally embarrassed. Call it the flinch test.

  Two things I want. First: does the flinch test actually deliver all seven verdicts? If not, tell me which of my verdicts has to go, or what clause you'd bolt on to save it — and what the clause costs, because I can feel a principle getting complicated enough to explain anything. Second: rule on a case I didn't list, which is interpretability research on large language models, where the subfield's entire argument right now is about whether its findings replicate at all.

  Bottom line up front: give me the repaired principle, or your replacement, in two sentences before anything else, then work the cases. 450 words hard cap, and please don't pad it with a history of Popper.
reasoning: |-
  Okay, the user is a science columnist trying to define "science" rigorously for their writing. They've listed seven case studies and proposed a "flinch test" (a field is scientific if practitioners would feel professionally embarrassed by specific real-world events). They want me to: 1) Test their flinch test against all cases, 2) Rule on interpretability research in LLMs, and 3) Provide a crisp two-sentence replacement principle upfront. 

  Hmm, their frustration with fuzzy definitions is palpable - especially that parapsychology paradox where method looks scientific but feels wrong. Smart how they noticed their neural net approval clashes with rejecting parapsychology. The flinch test is clever but... *checks cases* ...fails astrology (practitioners wouldn't flinch at failed predictions) and psychoanalysis (Freudians historically doubled down). 

  For my replacement principle, I'll focus on collective convergence toward truth through criticism. That handles: 
  - Newton (superseded but improved accuracy)
  - Astrology (no convergence)
  - Parapsychology (no progress despite methods)
  - Neural nets (improves predictions even if opaque)

  *Pauses at interpretability research* Tricky! It's messy now but the community's actively testing methods - that self-correcting impulse makes it science-in-progress. 

  Word count is tight. Must avoid philosophy tangents per request. Drafting the two sentences: "Science is..." then "This requires..." - yes, covers their core need without jargon. 

  Final check: Does this principle force any verdict changes? Their psychoanalysis call stands (no correction), parapsychology still out (convergence failure), and LLM research qualifies (active course-correction). Perfect. Now to justify economically in 450 words...
answer: |-
  Here's the repaired principle in two sentences:

  **Science is the collective, self-correcting enterprise seeking reliable empirical knowledge. This requires the community to actively converge toward better explanations by confronting findings that meaningfully constrain its theories.**

  Now, applying this to your cases:

  1.  **Newtonian Mechanics:** Science. Superseded by relativity/quantum mechanics, demonstrating self-correction and convergence toward greater accuracy.
  2.  **Psychoanalysis (Freudian):** Not Science. Core concepts (Oedipus complex, libido theory) resist meaningful constraint or convergence via empirical counter-evidence; interpretations adapt instead.
  3.  **Astrology:** Not Science. Predictions don't constrain theories meaningfully; failures don't lead to community convergence on revised, more accurate models.
  4.  **Dinosaur-Killer Asteroid:** Science. Specific evidence (iridium layer, crater) forced convergence on this explanation, constraining alternatives.
  5.  **Descriptive Natural History:** Science. While a catalogue isn't "falsified," *inconsistencies* with other catalogues (e.g., wrong location/date) or new data (e.g., DNA analysis revealing misclassification) would constrain and force correction, leading to convergence on an accurate record.
  6.  **Parapsychology:** Not Science. Despite methods, decades of rigorous effort show no meaningful convergence on replicable phenomena or explanatory theories; failures don't constrain the core hypothesis effectively.
  7.  **Black-Box Neural Net (Weather):** Science. Its demonstrably superior *predictive accuracy* (a key empirical constraint) forces convergence on its use over previous models, even if the mechanism is opaque. The community converges on its reliability *as a tool*.
  8.  **LLM Interpretability Research:** Science. The intense debate *about replication* IS the process of confronting findings to constrain theories and methods, aiming for convergence on reliable techniques and interpretations. The active struggle for constraint defines it.

  **Why the flinch test fails:** Practitioners in astrology or parapsychology might flinch at *methodological* criticism but rarely at *core empirical failures* constraining their fundamental claims. The key isn't embarrassment, but whether failure forces *theoretical convergence*. Your gut calls are preserved, but anchored in community progress, not just individual reaction. The cost? It emphasizes the *process* over any snapshot method or individual mindset.
