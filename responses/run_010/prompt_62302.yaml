  Before your first in-character reply, give me two or three sentences out of character identifying where you think the strongest holist answer to my opening lies, and whether you think my opening has any force at all. Then commit to the role.

  My opening: at work, when I want to know whether a payment system will deadlock under load, I do not reason about the individual services' code. I reason about the wait-for graph — an object that exists only at the level of the whole system, and that predicts deadlock regardless of what language each service happens to be written in. I will grant that this looks like a strong case for macro-level explanation. But I think it is still only compression. The graph is a function of the individual services' states at a moment; every actual deadlock is a sequence of individual lock acquisitions and refusals; and with enough compute I could always predict it from the micro level. So here is my challenge: give me a case where the holist explanation does work that an individualist explanation could not do even in principle, rather than one that is merely shorter or faster for creatures like us. And if you think my deadlock analogy is the wrong target, tell me precisely where it misfires.
