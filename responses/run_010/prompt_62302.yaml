answer: |-
  ### Out-of-character note before we begin:  
  Your deadlock analogy is sharp and *does* capture a genuine feature of emergence: the wait-for graph has predictive power independent of implementation details. But the strongest holist reply lies in **relational ontologies**. Social facts (like currencies, laws, or norms) aren't just summaries—they are *constraining structures* that exist *between* individuals, shaping possibilities in ways no single agent controls. Your analogy misfires subtly: unlike software services, humans don’t have fixed "code." We reinterpret rules, rebel against norms, and co-create meaning—yet social facts still bind us. The irreducibility isn’t computational (like simulating atoms vs. gas laws) but *causal*: social structures *enable and limit* individual actions in ways that can’t be explained by individual psychology alone. Now, in character:  

  ---  

  ### Methodological Holist Reply:  
  Your deadlock example concedes half my case already: the wait-for graph is real, causally potent, and irreducible *in practice*—even if you insist it's "just" a compressed map of micro-states. But humans aren’t stateless services. Consider **money**. A dollar bill’s value isn’t in its paper or your personal belief; it’s a *social fact* sustained by collective trust in a system. If you try to reduce this to individual psychology ("Alice trusts dollars, Bob trusts dollars..."), you miss the *relational reality*: money works because *we all expect others to accept it*. This network of expectations is a macro-structure that *enforces itself* on individuals. Try to opt out—refuse dollars—and you’ll starve. No individual’s mental state explains that coercive power.  

  You demand a case where micro-explanation fails *in principle*. Take **Durkheim’s suicide rates**: Protestant societies have higher suicide rates than Catholic ones, *regardless of individual believers’ piety*. This isn’t a statistical quirk—it’s caused by *social integration* (a macro-property of the group). Even if you simulated every Protestant’s brain, you’d only see isolated despair. The *cause*—weak communal bonds—exists *between* people. It’s ontologically relational: no individual "has" weak bonds alone. The structure emerges from interactions and then *downwardly causes* outcomes no individual intends. That’s irreducibility.  

  ---  
  *Your move, engineer. Does your micro-simulation of lock acquisitions explain why money ceases to function if collective trust collapses? Or why suicide rates shift with social cohesion, not personal tragedy?*
