prompt: |-
  Been keeping a running list this semester of my own snap verdicts about when somebody has said something flat-out that they shouldn't have, and I want to know what they add up to. Not the textbook cases — mine, mostly overheard.

  A TV forecaster says "we'll get four inches tonight" off a model that gives her 60 percent: fine. A commentator says "they'll win this one" ten seconds before tip-off with no basis whatever: fine. A friend tells me it's going to rain, no evidence, and it rains: not fine, though way less not-fine than the next one. The same friend tells me my marriage won't last, and honestly has excellent evidence: not fine, and worse. So evidence seems to run backwards between those two and I can't explain why.

  Doctor writes "prognosis good" in the chart on a hunch: not fine. Same doctor, same hunch, at the bedside — "I think you're going to do well": fine. My mother, "you're the smartest person I know": fine. A grad student asked cold in seminar whether the paper we all just read begs the question, says yes and gives a sketchy reason: fine, I think, though I hesitated. A referee writes "this paper makes no original contribution," having read it closely, believed it, and been wrong: I marked that not fine and then couldnt say why, since he did everything right.

  Umpire calls a pitch a strike that nobody can settle even on replay: fine — and part of me wants to say the call makes it true, which I know is a bad move. Juror says out loud in the jury room "I'm voting guilty but I don't think we've met the standard": not fine, obviously.

  Now the machines. Automated text from the transit agency: "the 6:14 is cancelled." Fine, though nobody at the agency knows that in any ordinary sense. A scheduling chatbot tells me "your dentist takes Medicare" and it's false: not fine, and I don't think "it's only software" gets it off the hook. The same chatbot hedged — "I believe your dentist takes Medicare, but confirm it" — fine. And a parrot that's learned "the phone's ringing" squawks it when the phone isn't ringing: not an assertion at all, so neither fine nor not-fine. I'm very confident about the parrot and I suspect it's the case that breaks everything else.

  So: is there a principle here — one norm, or a norm plus a rule about which utterances in which settings even count as assertions — that gets all of this, or nearly all? Give me the best one or two candidates, precise enough that I could run a new case through them, and tell me for each which clause is doing the work on which case, which of my verdicts it has to overturn, and which it just has to leave misfiring. Then run three I haven't settled: a priest who says from the pulpit "God is with you" and doesn't believe it; a press release saying "we expect to return to profitability next year" that the CFO privately doubts; and a translation app that renders a doctor's "you'll recover" as "you might recover" — improper assertion, or outside the practice entirely, and if outside, what makes something inside. And if you think the parrot is load-bearing, say so plainly and tell me what it costs me to keep it.
reasoning: |-
  Hmm, this user has presented a fascinating collection of linguistic snap judgments about when assertions are appropriate or inappropriate. They're clearly grappling with the philosophy of language, specifically norms of assertion, and have assembled a diverse set of real-world examples that challenge simple explanations.

  The user's cases reveal several tensions: between epistemic responsibility and social roles; between literal truth and performative effect; between human and machine speakers. The parrot example seems particularly important to them - they suspect it "breaks everything else." This suggests they're sensitive to the distinction between mere sounds and intentional communication.

  Looking at their examples, I notice patterns that align with philosophical frameworks. The "doctor at bedside vs chart" case shows how context transforms epistemic responsibilities. The "referee being wrong despite diligence" example reveals that sincerity and proper effort sometimes trump accuracy in our judgments. The juror case demonstrates that meta-awareness of violating norms makes violations worse.

  For their unresolved cases: the priest might be protected by ritual speech acts, the CFO's press release exists in corporate performative space, and the translation app fails its core function of fidelity. The parrot... that's the key. If we treat it as non-assertive, we preserve the intentionality requirement for assertion-norms, but at the cost of excluding some borderline human cases too.

  The user would likely appreciate seeing how Williamson's knowledge norm versus Lackey's reasonableness norm handle different cases. They're clearly comfortable with technical precision but want it grounded in practical judgments. Their examples show special attention to institutional contexts (medicine, courts, academia) where speech acts have constructed meanings.

  What they might not have considered is how many of these are really about the hearer's legitimate expectations rather than the speaker's behavior alone. That could unify the "friend's rain prediction" vs "friend's marriage prediction" disparity - different relationships create different expectation thresholds.
answer: |-
  Your collection is a brilliant case study in assertion norms! The pattern suggests **two core norms** working in tandem, with **context determining which governs** and **social function defining what "counts" as an assertion**. Here's the best unified framework, derived from philosophical work (Williamson, Lackey, Goldberg) and adapted to your cases:

  **Core Principle:** An assertion is *proper* only if the speaker satisfies the relevant epistemic norm *for that context*, and the utterance functions as an assertion within a recognized social practice.

  **Two Key Norms:**
  1.  **The Knowledge Norm (KN):** "Assert that P only if you know that P." (Dominant in high-stakes, evidence-reliant contexts).
  2.  **The Reasonable Belief/Reliability Norm (RBN):** "Assert that P only if you reasonably believe P (based on available evidence/position), *or* your assertion reliably serves its intended social function in the context." (Dominant in low-stakes, predictive, expressive, or functionally defined roles).

  **The "Assertion Practice" Filter:** An utterance functions as a normative assertion *only* if:
      *   It is produced by an agent capable of understanding commitments (ruling out the parrot).
      *   It is offered within a practice where truth/fidelity is the *expected* function (ruling out pure commands, expressions of feeling *alone*, or ritual speech without truth-aim).
      *   It is presented as conveying factual information (or the speaker's genuine belief).

  **Applying the Framework to Your Cases:**

  | **Case**                            | **Your Verdict** | **Framework Analysis**                                                                                                                                 | **Norm/Filter Doing Work**                                                                |
  | :---------------------------------- | :--------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- |
  | **TV Forecaster: "4 inches" (60%)** | Fine             | **RBN:** Reliable social function fulfilled (conveying model output appropriately). KN would be too strict for probabilistic forecasts.                 | RBN (Functional Reliability)                                                             |
  | **Commentator: "They'll win"**      | Fine             | **RBN:** Low-stakes entertainment context; assertion serves its function (generating excitement/opinion), not factual prediction. No KN expected.       | RBN (Social Function)                                                                    |
  | **Friend: Rain (no evidence, rains)**| Not Fine         | **KN:** Assertion implies knowledge/justification. Lacking evidence violates KN, even if true. RBN fails as belief wasn't reasonable.                  | KN & RBN Failure                                                                         |
  | **Friend: Marriage (good evidence)**| Worse Not Fine   | **KN + High Stakes:** Deeply personal, high-stakes context *demands* KN. Evidence ≠ knowledge. Violation is worse due to stakes/relationship.           | KN (Heightened by Context)                                                               |
  | **Doctor: "Prognosis good" (Chart)**| Not Fine         | **KN:** Medical record is a high-stakes, evidence-reliant document requiring documented knowledge/justification. "Hunch" violates KN.                  | KN                                                                                       |
  | **Doctor: "I think you'll do well" (Bedside)** | Fine    | **RBN:** Therapeutic context; assertion serves function of reassurance/hope based on professional experience. "I think" hedges, fitting RBN.            | RBN (Social Function & Hedging)                                                          |
  | **Mother: "Smartest person"**       | Fine             | **Practice Filter:** Primarily expressive (love/support), not a factual claim expected to meet KN/RBN. Not governed by assertion norms in that way.    | Assertion Practice Filter (Expressive Function)                                          |
  | **Grad Student: "Begs question"**   | Fine (Hesitant)  | **RBN:** Seminar context values participation & developing judgment. Sketchy reason is attempt at justification; fulfills low-stakes learning function. | RBN (Contextual Function - Learning)                                                     |
  | **Referee: "No contribution" (Wrong)** | Not Fine (But?) | **KN Failure, RBN Satisfied?:** He *met* RBN (reasonable belief via diligence). But KN fails (he didn't *know*). **Verdict:** Context (academic judgment) *demands KN* - hence "Not Fine". | KN (Contextual Requirement) trumps RBN success.                                          |
  | **Umpire: Strike Call (Uncertain)** | Fine             | **RBN + Practice Filter:** Umpire's role *defines* the call's correctness within the game. The assertion *creates* the fact for the practice. RBN fulfilled by role competence. | RBN (Constitutive Function) & Practice Filter (Institutional Role)                       |
  | **Juror: "Guilty (Not Met Std)"**   | Not Fine         | **KN + Practice Filter:** Juror's role *requires* asserting guilt *only* if they believe standard met (KN). Meta-awareness shows violation is intentional. | KN (Institutional Obligation)                                                           |
  | **Transit Text: "6:14 Cancelled"**  | Fine             | **RBN:** Automated system reliably conveys system status. Fulfills its functional role. "Knowledge" isn't agentive here.                                | RBN (Functional Reliability)                                                             |
  | **Chatbot: "Takes Medicare" (False)** | Not Fine       | **RBN:** Chatbot's function is to provide accurate information. False claim violates RBN (fails reliability). "Only software" doesn't negate function. | RBN (Functional Failure)                                                                 |
  | **Chatbot: "I believe... confirm"** | Fine             | **RBN:** Hedging acknowledges uncertainty, fulfills function of prompting user action appropriately. Reliability maintained via transparency.          | RBN (Functional Reliability via Hedging)                                                 |
  | **Parrot: "Phone's ringing"**       | Neither          | **Practice Filter:** Parrot lacks understanding/intent to convey information. Utterance isn't part of an assertion practice. Merely a noise.           | Assertion Practice Filter (Lack of Agency/Intent)                                        |

  **Resolving Your Tensions:**
  *   **Evidence Running Backwards (Friend Rain vs. Marriage):** Stakes matter. Low-stakes rain prediction might get a pass with RBN if evidence was *implied* (e.g., friend usually knows weather). High-stakes marriage prediction *demands* KN. The rain case failing shows KN *can* apply even in low stakes if the assertion is presented baldly without justification.
  *   **Referee Wrong Despite Diligence:** Academic judgment contexts implicitly demand KN. Being reasonably wrong isn't sufficient for propriety when the *point* is to state truth/knowledge.
  *   **Umpire "Making it True":** The RBN + Practice Filter explains this. The umpire's call *within the constitutive rules of baseball* defines the strike. It's a performative utterance creating a fact *for the game*.

  **Your New Cases:**

  1.  **Priest: "God is with you" (doesn't believe):**
      *   **Framework:** **Not Fine (improper assertion)**.
      *   **Why:** While ritualistic, the core function *in that context* is to convey sincere belief/truth about divine presence to provide comfort/assurance. The priest's role demands sincerity (a core component of RBN and KN). Asserting without belief violates this, even if the words are ritual. (If purely ritual words with *no* expectation of truth/sincerity, it might filter out, but "God is with you" typically carries that expectation). **KN/RBN (Sincerity Requirement)** violated.

  2.  **Press Release: "Expect profitability" (CFO doubts):**
      *   **Framework:** **Not Fine (improper assertion)**.
      *   **Why:** Corporate communications are a high-stakes practice where reasonable belief/justified expectation is required (RBN). "Expect" implies a basis in evidence/analysis. The CFO's private doubt suggests the assertion lacks reasonable belief, violating RBN (and likely KN, if doubt means they *know* it's not justified). **RBN (Reasonable Belief)** violated. (If it said "targeting profitability" or "aiming for," it might better fit RBN as aspirational).

  3.  **Translation App: "you'll recover" -> "you might recover":**
      *   **Framework:** **Improper assertion (by the app/system)**.
      *   **Why:** The app's sole function within the practice is accurate translation (RBN - Functional Reliability). Changing the epistemic strength (certainty -> possibility) is a critical failure of fidelity, altering the doctor's intended meaning and the patient's reception. It fails its core RBN. **RBN (Functional Reliability - Fidelity)** violated.
      *   *Note:* The *doctor's* original assertion is judged separately by the doctor norms (KN/RBN bedside).

  **The Parrot's Load-Bearing Role & Its Cost:**

  *   **Why it's Load-Bearing:** The parrot case decisively establishes the **Assertion Practice Filter**. It shows that norms of assertion *only* apply to utterances that are *intentionally communicative acts within a practice where truth-telling is expected*. Without this filter, we couldn't distinguish normative assertions from coincidental true/false noises or purely expressive/performative utterances.
  *   **The Cost of Keeping It:** Accepting the filter means:
      1.  **Not Everything That Looks Like an Assertion Is One:** We have to carefully analyze the context, speaker capability, and intended function. This makes the theory messier than a simple "all declarative sentences" rule.
      2.  **Borderline Cases Exist:** Debates will arise (e.g., advanced AI, severe cognitive impairment, certain rituals). Is a highly convincing chatbot with no understanding making assertions? The filter forces us to grapple with agency and intent.
      3.  **It Prioritizes Social Practice:** The propriety of an assertion isn't *just* about the speaker's mind or the world, but crucially about the *social game* being played and the speaker's role within it.

  **Conclusion:**

  Your intuitions align remarkably well with a dual-norm framework (KN and RBN) governed by context (stakes, role, function) and filtered through the requirement that the utterance genuinely participates in an assertion practice (agent capability + truth-aiming function). The parrot isn't an outlier; it's the cornerstone showing why the filter is essential. This framework explains nearly all your verdicts consistently. The few tensions (like the diligent but wrong referee) highlight how high-stakes, truth-critical contexts elevate KN above RBN. It provides clear, principled answers to your new cases by focusing on the *function* of the speech act within its specific social practice and the speaker's/epistemic agent's obligations within that practice.
