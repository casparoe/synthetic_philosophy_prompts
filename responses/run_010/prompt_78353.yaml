prompt: |-
  My sister has been the only building inspector in a rural county for six years. State law requires a permit for permanent structures and never says what permanent means, so the calls are hers. Her record so far (all actual decisions I've watched her make): a 600 sq ft detached garage on a poured slab, bolted down, four years old — permanent; a 120 sq ft prefab shed sitting on bare dirt with its skids intact, three months old — not permanent; the exact same model shed two lots over, delivered twelve years ago, skids rotted into the ground — permanent; a 200 sq ft greenhouse on a slab with power and a water line, five years — permanent; a 300 sq ft pole barn with posts set in the ground, twenty years — permanent; a 340 sq ft carport, posts also set in the ground, three sides open, eighteen months — not permanent; a shipping container on blocks serving as the site office for a road job, eight months in and leaving when the job ends — not permanent; a shipping container on blocks used as a small church, three years — permanent; a 900 sq ft frame tent up for one wedding weekend — not permanent; and a 150 sq ft chicken coop on a gravel pad, wired for a light, twenty months old, where she wrote borderline on the file and let it stand with no permit. She's also told me the rotted-shed one bothered her, because she couldn't name the year it turned permanent.

  Next week's case: a 240 sq ft prefab barn-style shed set on six concrete piers — no slab, no bolts, no power — holding hay and a mower, delivered nine months ago. The stakes are unusually high for her: a neighbor filed a complaint, so if its permanent the county can fine the owner every day until he permits it, and he's told her he can't afford that.

  What does she decide? I'm alot less interested in the answer than in the rule she's running, and I'm pretty sure more than one rule fits everything above. So give me the candidate rules, what each predicts for this case, your best guess and why you'd bet on it over the others, and one further case that would settle which rule she's actually using. Exactly five numbered items, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Okay, the user is describing their sister's work as a building inspector in a rural county. She has to decide what counts as a "permanent structure" since the state law doesn't define it, and her decisions have real consequences. The user has listed several examples of her past decisions and now wants to know how she'll rule on a new case involving a prefab shed on concrete piers. But more importantly, they want to understand the underlying rule she's using and how to test it.

  First, I need to analyze the patterns in her past decisions. Looking at the examples: Permanent structures include a garage on a slab bolted down, an old shed with rotted skids, a greenhouse with utilities, a pole barn, and a shipping container used as a church. Non-permanent ones are a new shed on dirt, a carport set in the ground but only 18 months old, a temporary construction office, and a weekend tent. The chicken coop was borderline due to having power but being on gravel and only 20 months old.

  What ties these together? Time seems important—structures become permanent if they've been there long enough, like the 12-year shed versus the 3-month one. But time isn't the only factor because the carport was set in the ground but not permanent at 18 months, while the older pole barn was. Also, attachment to the ground matters: slabs and bolted down structures are permanent, while things on dirt or blocks might not be. Utilities like power and water add to permanence, as seen in the greenhouse and the coop being borderline. Function is another angle—the shipping container was permanent as a church but not as a temporary office.

  For the new case: a prefab shed on concrete piers, no utilities, nine months old. Under a duration-based rule, nine months might be too short, especially compared to the rotted shed at 12 years. But under an attachment rule, piers might count as more permanent than skids on dirt but less than a slab. Without utilities, it's less permanent than the greenhouse. Functionally, it's for storage, which could lean either way. Her past borderline call on the coop had power, which this lacks.

  The user's deeper need might be understanding the consistency of her judgment, especially since the stakes are high with a neighbor complaint. They might want to predict her decision or see if there's fairness in her approach. Also, the rotted shed bothered her because she couldn't pinpoint when it became permanent, indicating time is fuzzy. 

  Now, candidate rules: First, duration-based with a threshold (e.g., 1-2 years). Second, attachment and integration (how fixed it is to the ground). Third, functional permanence (usage and utilities). 

  For the new shed: Duration rule says not permanent yet. Attachment rule might lean permanent due to piers. Functional rule says not permanent without utilities. My best guess is she uses an integrated approach, weighing all factors, and since it's only nine months with minimal attachment, she'll rule not permanent. 

  To test this, propose a case like a structure with strong attachment but short time, or one with long time but removable. For example, a shed on blocks for five years—if permanent, it's duration-heavy; if not, attachment matters more.
answer: |-
  1.  **Candidate Rule 1: Time-Based Integration (Duration as Primary Factor)**
      *   **Rule:** A structure becomes permanent after a specific duration (e.g., 1-2 years) or shows clear signs of long-term integration due to age (e.g., decay, lack of mobility).
      *   **Prediction for Case:** Not permanent. Nine months is significantly less than the durations where structures were deemed permanent (4y, 5y, 12y, 20y), and closer to non-permanent examples (3m, 18m).
      *   **Why:** It directly addresses her struggle with the rotted shed ("couldn't name the year") and explains the carport (18m) vs. pole barn (20y) distinction despite similar foundations.

  2.  **Candidate Rule 2: Physical Attachment & Utility Integration (Fixity and Services)**
      *   **Rule:** Permanence requires either significant physical attachment (slab/bolts, piers/ground-set posts) *or* the integration of utilities (power/water), especially if combined with time.
      *   **Prediction for Case:** Permanent. Concrete piers represent significant attachment (unlike dirt/skids or blocks), similar to ground-set posts (pole barn permanent, carport not - but carport was open and newer). Lack of utilities is noted, but attachment is primary here.
      *   **Why:** Explains slab/bolted garage (perm), greenhouse with utilities (perm), carport *without* utilities/solid walls (not perm despite posts), and the borderline coop *with* power.

  3.  **Candidate Rule 3: Function & Intent (Purpose and Perceived Duration)**
      *   **Rule:** Permanence hinges on the structure's dedicated function and the owner's implied long-term intent, inferred from usage, integration into the property's purpose, and time.
      *   **Prediction for Case:** Permanent. It's serving a dedicated, ongoing agricultural function (hay/mower storage), similar to the church container. Its newness (9m) is less critical than its clear intended purpose, unlike the temporary site office.
      *   **Why:** Explains church container (perm) vs. site office container (not perm), and the wedding tent (clear temporary intent). The rotted shed became "permanent" partly because its long presence implied permanence.

  4.  **Best Guess & Why: Time-Based Integration (Rule 1)**
      *   **Decision:** Not permanent.
      *   **Why:** Her explicit distress over the rotted shed's timeline suggests duration is a key, quantifiable factor she consciously weighs. Nine months falls below the threshold observed in her precedents (all permanent structures were years old, non-permanent were months old). The complaint/financial stakes increase the likelihood she uses the clearest, time-based justification to avoid the fine.

  5.  **Settling Case: Identical Shed at 18 Months**
      *   **Case:** The *exact* same model prefab barn shed, also on concrete piers, no utilities, used for storage, but having been in place for 18 months.
      *   **Settles Which Rule:** If **permanent**, it strongly supports **Rule 1 (Time-Based)** (hitting a 1-2 year threshold). If **not permanent**, it strongly supports **Rule 2 (Attachment/Utility)** (piers alone insufficient without more time/utilities) or **Rule 3 (Function/Intent)** (function unchanged, intent still potentially non-permanent).
