prompt: |-
  I sit on the standing committee of a federation of worker co-ops — about 40 affiliates, a shared relief fund, and a congress where the affiliates vote. We don't write policy. All we do is rule on who has standing in a given congress decision: binding vote, advisory vote, right to speak, right to a written response, or nothing. Our charter language is uselessly vague — it says standing belongs to "those with a legitimate stake in the outcome" — and we've been filling that in case by case for eight years.

  The precedents:

  - Residents of the town next to our largest affiliate's plant, who would have smelled and drunk the output of a wastewater-treatment decision: no vote, but a mandatory public hearing and a written response to every comment filed. Recorded reasoning: affected, not governed.
  - Third-party cleaning and security staff who work full-time inside our buildings and are bound by our site safety rules: binding votes in referenda on workplace safety and site rules; no vote on board elections or on distribution of surplus.
  - A supplier co-op in another country whose workers would have lost roughly a third of their income had congress voted to bring the work in-house: advisory vote plus a mandatory written response; no binding vote.
  - 16- and 17-year-olds living in affiliate housing: no binding vote, but a youth delegate with agenda-setting power — able to force any motion onto the floor.
  - A former member who left three years ago but still holds non-refundable capital in an affiliate, capital that a congress decision would revalue: no vote of any kind, but a right to claim compensation.
  - A river trust holding legal standing over the estuary two affiliates draw water from: non-voting seat, right to speak, and power to delay any decision touching the estuary by one session.

  Here's the new one, and it's a mess. Congress is deciding whether to move the relief fund's shipping contract to a cheaper handler. The current handler is a non-affiliated logistics warehouse, about 200 people, none of them subject to any Federation rule — their employer sets their conditions and they sit outside every jurisdiction we operate in. If congress switches, most of them probably loose their jobs. Two wrinkles: maybe 15 of them currently live in housing owned by one of our affiliates, so they *are* subject to Federation rules, just in their capacity as tenants; and about 30 are former members of an affiliate who left in good standing. So the affected group is internally split, and the split runs by capacity rather than by person — two people on the same warehouse floor would get different standing.

  What should we rule if we want to be consistent with ourselves? Which precedent is the closest analog — I keep flip-flopping between the supplier co-op and the former member with the capital stake, and I can't tell whether that indecision is me being dumb or the record genuinely not deciding it. And be explicit about what rule we'd be committing to with each option: are we an all-affected body, an all-subjected body, a two-tier body that gives binding voice to the governed and advisory voice to the merely affected, or something else that happens to fit all six verdicts? I want the candidate rules the precedents can't tell apart, what each one implies for the warehouse, your best guess at what we should actually do and why you'd prefer that reading, what principle we'd be adopting if we go the other way instead, and then the next case we should take up — a hypothetical is fine — that would really discriminate between the rules, because I suspect we've spent eight years splitting the difference without noticing that we were doing it.

  American English, please.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're on a standing committee for a federation of worker co-ops, and their role is to determine standing in congress decisions based on a vague charter. The charter says standing belongs to "those with a legitimate stake in the outcome." They've set precedents over eight years, and now they have a messy new case involving a logistics warehouse whose workers might lose jobs if a shipping contract is moved.

  First, I need to unpack the precedents. The user listed six cases, each with different outcomes. Let me categorize them to see the patterns. For instance, the town residents were affected but not governed, so they got a public hearing and written responses. The third-party staff were subject to site rules, so they got binding votes on safety issues but not on other matters. The supplier co-op had an economic stake but no governance, leading to an advisory vote. The minors in affiliate housing couldn't vote but had a delegate. The former member with capital got compensation rights. The river trust had legal standing, so they could speak and delay decisions. 

  Now, the new case: moving a relief fund's shipping contract. The current handler is a non-affiliated warehouse. If the contract switches, 200 workers might lose jobs. But within that group, some live in affiliate housing (subject to Fed rules as tenants), and some are former members. The user is torn between two precedents: the supplier co-op (advisory vote) and the former member (compensation). 

  I need to determine which precedent aligns best. The supplier co-op was affected economically but not governed, similar to the warehouse workers. The former member had a financial stake but no ongoing governance ties except capital. The warehouse workers are mostly external, but the 15 tenants are subject to Fed rules as tenants, not workers. The 30 former members have a historical tie but no current governance. 

  The committee's past decisions seem to differentiate between governance (binding votes) and mere effect (advisory or other rights). So the key is whether the affected parties are governed by the Fed's rules. For the warehouse workers, except for the tenants and former members, they aren't governed. The tenants are governed in their capacity as tenants, but this decision affects their jobs, not their tenancy. That's a different capacity. The former members aren't current members, so their standing is based on their past capital, which isn't relevant here. 

  So consistency would suggest no binding vote. Advisory roles or written responses might fit, like in the supplier co-op case. But the split within the group complicates things. Since the affected group has different capacities, the committee might need to address each subgroup separately. 

  The user also wants to know the underlying principle. The precedents point towards a two-tier system: binding for the governed, advisory for the affected. But some cases don't fit perfectly, like the river trust which has legal standing, not governance. So maybe it's about subjection to rules vs. impact. 

  For the warehouse, the 15 tenants have standing as tenants, but this decision isn't about tenancy. So they shouldn't get extra rights here. The former members might have a claim similar to the capital case, but since the decision doesn't affect their capital, compensation isn't applicable. Thus, the whole group is more like the supplier co-op: affected but not governed. An advisory vote or public hearing could apply. 

  But the user mentioned a youth delegate for minors. Could a similar delegate represent the warehouse workers? That might be a middle ground. However, creating a delegate for an external group might set a broad precedent. 

  The user's deeper need is to clarify their decision-making framework. They've been case-by-case without a clear rule. They need a principle that fits all precedents to avoid future confusion. The next hypothetical case should test the boundary between governance and impact. For example, if a decision affects a supplier's workers who are also governed by Fed environmental rules, which principle applies? 

  In conclusion, the committee should rule that the warehouse workers get an advisory vote and a written response, similar to the supplier co-op. This maintains consistency. The tenants and former members don't get additional rights here because their subjection is in a different capacity. The principle adopted is that binding rights require current governance in the relevant capacity, while affected parties get consultative rights. The next case should involve overlapping capacities to test this principle.
answer: |-
  Based on your precedents and the need for consistency, here's the breakdown of how to rule on the warehouse workers and the underlying principles you've likely been operating under:

  ### 1. **Closest Precedent: The Supplier Co-op**
     - **Why it fits**: The supplier co-op faced severe economic harm (loss of 1/3 income) from a Fed decision, but weren't governed by Fed rules. Your ruling gave them **advisory vote + mandatory written response**. The warehouse workers face comparable economic harm (job loss) and are similarly external to Fed governance.
     - **Difference**: The supplier had a *contractual* relationship; the warehouse has a *service* relationship. Your precedents don't hinge on this distinction (see river trust, which had no contract but legal standing).
     - **Rule Implied**: *Significantly affected external parties get consultative rights (advisory voice/response), not binding votes.*

  ### 2. **Why Former Member Precedent *Doesn't* Fit**
     - The former member's standing derived from **direct financial stake in Fed capital** (non-refundable equity). Your ruling protected *property rights*, not general welfare. Warehouse workers have no Fed capital stake.
     - **Key Distinction**: Your committee separates *ownership/governance interests* (binding rights) from *external impacts* (consultation/compensation).

  ### 3. **The Split Group: Resolving the Wrinkles**
     - **15 Tenant Workers**: Subject to Fed rules *as tenants*, not as workers. Precedents (e.g., safety rules for third-party staff) show you grant rights **based on the *capacity* in which rules apply**. Since the contract decision affects their *employment*, not tenancy, they get **no special standing** beyond other workers. *Capacity is key*.
     - **30 Former Members**: Left in good standing but hold no Fed capital. They resemble the former member precedent *without the capital stake*. Thus, **no standing** (as per your ruling on ex-members without financial ties).
     - **Other Workers**: Pure external impact. No governance link.
     - **Consistent Ruling**: **Advisory vote for all warehouse workers + mandatory written response to submitted comments** (mirroring supplier co-op). The internal splits don't alter their standing *for this specific decision* since no subgroup is governed *in their worker capacity*.

  ### 4. **Your Implicit Decision Rule**
  You operate as a **"Subjected-Plus" body**:
  - **Binding votes** for those **governed by Fed rules** *on the issue at hand* (e.g., third-party staff on safety rules).
  - **Consultative rights** (advisory vote/hearing/response) for:
    - Those **significantly affected but not governed** (supplier, town residents).
    - Those with **legal/fiduciary stakes** (river trust, former member with capital).
  - **No standing** for attenuated impacts or past ties without ongoing stakes (ex-member without capital).

  ### 5. **If You Chose the Former Member Path**
     - **Rule Adopted**: "Standing requires *direct financial or property stakes* in Fed entities."  
     - **Implication for Warehouse**: **No standing** for any worker (no capital/equity stake).  
     - **Why This Breaks Precedent**: Inconsistent with rulings for town residents (no property stake, got hearing) and supplier (no property stake, got advisory vote).

  ### 6. **Recommended Ruling & Why**
  - **Advisory vote + written response for all 200 warehouse workers**.  
  - **Why**:  
    - Fits the **supplier co-op precedent** (severe economic harm to non-governed party).  
    - Avoids arbitrary distinctions within the affected group (tenancy/ex-member status irrelevant to *this decision*).  
    - Upholds your **Subjected-Plus principle**: Binding voice is reserved for the governed; others get consultative rights proportional to impact.  
    - Prevents overreach: Granting binding votes here would imply *any* affected third party (e.g., customers, competitors) could claim standing.

  ### 7. **The Next Case That Would Force Clarity**
  **Hypothetical**: *An affiliate proposes building a wind farm. It would:  
  (a) Create noise affecting a non-affiliated town (like your wastewater case),  
  (b) Require buying land from a farmer co-op (a supplier),  
  (c) Generate surplus funding a new Fed childcare program open to non-members' kids.*  

  **Why it discriminates**:  
  - Tests if **"affected"** (town noise) vs. **"contractual"** (farmer co-op sale) vs. **"beneficiary"** (childcare users) are treated differently.  
  - Forces a choice: Is your principle about *harm* (symmetry with supplier/warehouse) or *governance* (childcare users subject to Fed rules)?  
  - Reveals if consultative rights apply only to *adverse* impacts or also *benefits*.

  ### Final Note
  Your committee isn't "splitting the difference"—you're evolving a **nuanced doctrine of standing**:
  - **Governance → Binding voice**  
  - **Significant impact → Consultative voice**  
  - **Property/legal stake → Compensation/delay rights**  
  The warehouse case fits squarely in the second category. Consistency demands advisory rights, not compensation or silence. The indecision comes from the *internal splits*, but precedents show you prioritize *the capacity in which impact occurs*. Here, all are impacted *as workers*, not as tenants or ex-members.
