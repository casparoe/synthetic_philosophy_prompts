prompt: |-
  I cover bioethics for a general-interest magazine, and a puzzle in informed-consent law has me stuck. When clinicians test whether a patient has capacity to refuse treatment, they look for four abilities: understanding the information, appreciating that it applies to her own situation, reasoning with it, and communicating a choice. Appreciation is where the work gets done — it is what lets a team conclude that a severely anorexic patient who recites the medical facts accurately but insists they do not describe her is not really deciding. Yet the same doctrine holds that a competent patient may refuse for reasons her doctors think foolish, because the test is procedural and outcome-blind.

  Now set that standard against decisions that would change who the decider is: a Deaf adult weighing a cochlear implant, a first pregnancy, a psychiatric treatment expected to alter temperament. For those, arguably no one can appreciate in advance what the outcome will be like, and the person who emerges may not share the values of the person choosing. What does the appreciation requirement presuppose about the relation between the deciding self and the self that lives with the decision? Does it assume that evaluative character persists through such a change, so that appreciating the outcome is possible in principle, or could the standard rest on something weaker? Which rival accounts of transformative choice does that exclude — including the view that such a decision is about which person to become rather than about which outcome to get? And why doesn't the requirement, applied honestly, render everyone incapacitated for these choices while still doing decisive work elsewhere? Please distinguish what the practice strictly presupposes from what it merely sits comfortably with, and tell me what capacity assessment would look like if the presupposition were false.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a bioethics journalist struggling with informed consent law, specifically the "appreciation" element in capacity assessments. The puzzle is how appreciation works for transformative choices—decisions that might fundamentally change the person making them. 

  First, I need to recall the four abilities for capacity: understanding, appreciation, reasoning, communication. The user points out that appreciation is the key in cases like anorexia where patients deny the illness applies to them. But in transformative decisions—like getting a cochlear implant or having a first child—the future self might have different values. So how can anyone truly "appreciate" that future state?

  Hmm, the user is asking two big philosophical questions wrapped in legal doctrine: (1) What does appreciation presuppose about personal identity over time? (2) Does this secretly invalidate capacity for transformative choices while working fine elsewhere?

  Let me break this down. The practice seems to assume a "persistent core self"—that your fundamental values stay constant enough to judge future states. Like when courts say even irrational reasons are okay if the process is sound. But for Deaf people considering implants or depression treatment altering personality, that assumption might crack. 

  I remember Laurie Paul's work on transformative experience—some choices are epistemically "transformative" because you can't know what it's like until you live it. Having a child is her classic example. If appreciation requires predicting future preferences, but those preferences don't exist yet... is capacity assessment impossible here?

  But wait—clinicians don't actually require perfect prediction. The user mentions this too. Appreciation is more about "could this happen?" not "will I like it?" So maybe the standard is weaker: just acknowledging possible futures, not fully inhabiting them. That avoids declaring everyone incompetent for big life choices. 

  Still, there's tension. If we strictly required understanding future values, transformative choices would paralyze capacity assessments. But in practice, courts accept "I want to experience motherhood" as sufficient appreciation for pregnancy refusal, even if the person can't know the exact outcome. 

  So what's the minimal presupposition? Probably just that values are stable enough to apply current preferences to future states. The rival view—that you're choosing a new self—isn't excluded, but the law acts "as if" continuity exists. If personal identity were radically discontinuous (like after dementia), capacity assessment might shift toward advance directives or substituted judgment. 

  For the journalist, the key is distinguishing doctrine from practical application. The strict presupposition is value persistence, but courts stretch it via procedural focus. If identity weren't continuous, capacity assessments might resemble dementia protocols—but for now, we lean on the fiction of a stable self because the alternative makes decision-making impossible.
answer: |-
  You've pinpointed a profound tension at the heart of informed consent doctrine—one where the practical necessity of the "appreciation" requirement collides with the philosophical reality of transformative experiences. Let's dissect this step by step.

  ### 1. **What "Appreciation" Presupposes About the Self**
     - **Core Presupposition**: The doctrine strictly presupposes **evaluative continuity**. It assumes the *deciding self* possesses a sufficiently stable core of values, preferences, and self-conception to rationally project itself into the future and "appreciate" the impact of the decision on its own life. The future self is treated as a continuation of the present self, capable of retrospectively endorsing (or at least recognizing the rationale for) the choice.
     - **Why This Works Elsewhere**: In non-transformative decisions (e.g., refusing amputation for gangrene), the future self's values are assumed to align with the present self's (e.g., "I will still value being alive without sepsis"). The anorexic patient fails *because* their denial ("I am not underweight") severs the link between current medical reality and future self-interest.

  ### 2. **The Challenge of Transformative Choices**
     Your examples—cochlear implants for Deaf adults, first pregnancy, personality-altering psychiatric treatments—represent **epistemically transformative experiences** (Laurie Paul's concept). Here:
     - **No Prior Access**: One cannot "appreciate" the *subjective experience* of the outcome (e.g., what it *feels like* to hear, to be a parent, or to have a new temperament).
     - **Value Uncertainty**: The future self may hold fundamentally different values (e.g., a Deaf person who gains hearing might no longer value Deaf culture; someone post-depression treatment might reject their former "authentic" self).

  ### 3. **What the Doctrine Excludes**
     - **Rival Account Excluded**: The doctrine implicitly rejects the **self-creation model** of transformative choice. If a decision is truly about "which person to become" (where the future self is discontinuous in values), *procedural* appreciation becomes impossible. You cannot appreciate how *this person's* life will be affected because *that person* doesn't yet exist.
     - **Accommodated View**: It *can* accommodate the **persistent-core model**, where a stable "essence" (e.g., a commitment to growth, curiosity, or specific relationships) persists through change. Appreciation here means understanding *that* one's values *might* shift, and choosing based on current values (e.g., "I value potential connection over current identity").

  ### 4. **Why Not Everyone is Rendered Incapacitated?**
     In practice, courts and clinicians **weaken "appreciation" for transformative choices** without admitting it:
     - **Focus Shifts to Process**: Can the patient understand *that* the experience will be transformative? Can they articulate reasons *grounded in current values* (e.g., "I want to experience sound," "I believe parenthood will fulfill me," "I need relief from suffering")?
     - **Outcome-Blindness Stretches**: Refusal is permitted even if the *reason* is the transformative nature itself (e.g., "I won't get a cochlear implant *because* I don't want to risk losing my Deaf identity"). This implicitly accepts that the "appreciation" is about the *significance of the change*, not its precise outcome.
     - **Legal Fiction of Continuity**: The law assumes a "narrative self" that binds past, present, and future. Appreciation is satisfied if the patient can integrate the choice into a *coherent life story* ("This is who I am and who I want to be").

  ### 5. **If the Presupposition Were False (Radical Value Discontinuity)**
     If evaluative continuity is rejected, capacity assessment would fracture:
     - **For Truly Transformative Choices**: Capacity could *not* be assessed procedurally. We might:
       - Defer to **prior directives** (if the patient anticipated the change).
       - Use **substituted judgment** (what the patient *would* want if informed by future values).
       - Adopt a **"reasonable person" standard** (but this risks paternalism).
     - **Assessment Would Focus On**:
       - **Understanding Metacognition**: Does the patient grasp *that* their future self may be unrecognizable?
       - **Value Exploration**: Why does the *current self* choose this transformation? Is it consistent with deeper meta-values (e.g., "I embrace change")?
       - **Proxy for Future Self**: In extreme cases (e.g., dementia), we already use advance directives. For cochlear implants or pregnancy, society currently avoids this due to autonomy concerns.

  ### 6. **What the Practice *Actually* Relies On**
     - **Strict Presupposition**: Evaluative continuity ("I will still be 'me' after this decision").
     - **Practical Compromise**: A **procedural proxy for authenticity**: Can the patient engage in a minimally coherent narrative justifying the choice *from their current perspective*, even if the future self diverges? This avoids collapsing the system while masking the philosophical problem.

  ### Key Takeaway for Your Article
  The "appreciation" requirement is a legal/practical tool built on a psychological assumption of self-continuity. It *works* for most medical decisions because they aren't truly transformative—but when faced with choices that alter identity, the doctrine relies on **strategic vagueness**. Clinicians lower the bar for appreciation, focusing on whether the patient *acknowledges* the potential for change rather than truly "appreciating" the future state. This preserves autonomy pragmatically but leaves the philosophical dilemma unresolved. If bioethics fully embraced radical self-discontinuity, informed consent would require a paradigm shift—one prioritizing **meta-autonomy** (choosing for potential selves) over procedural competence.
