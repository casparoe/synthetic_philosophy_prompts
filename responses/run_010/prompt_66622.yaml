  This pattern keeps appearing in their work - whether researching small town history or classical sources. The key elements are: a common origin source that gets lost; later sources adding plausible but invented details; these invented details being mistaken for independent verification; and the story becoming "richer" with each retelling, which paradoxically increases its perceived credibility.

  They're asking for terminology to describe this phenomenon. They want to know if established concepts cover this, or if they need to coin a new term. They specifically want: discussion of near-miss concepts showing where they fall short; a table comparing candidate terms; and a final verdict with either the best existing term or a newly coined one.

  I need to consider several related concepts:
