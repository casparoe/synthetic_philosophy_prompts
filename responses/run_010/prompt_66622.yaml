  - Textual corruption in philology (deals with errors but not enrichment-as-verification)
  - Source-dependent elaboration in historiography (comes close but isn't formalized)
  - The "Matthew Effect" in historiography (about prominence, not verification)

  None perfectly capture the full phenomenon. "Source-dependent elaboration" comes closest but isn't formalized. "Embellishment cascade" might work as a coinage, emphasizing how invented details build upon each other and create false confidence.

  For the table, I'll include:
