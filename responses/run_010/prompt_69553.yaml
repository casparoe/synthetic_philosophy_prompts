  Okay, the user is working on an STS seminar assignment about Langdon Winner's "Do Artifacts Have Politics?" and needs a fresh case study. They're tired of the usual examples like the Long Island parkways or McCormick molding machine. Let me unpack their requirements carefully.

  First, the setting must be a contemporary mid-sized public institution - maybe a public utility since that feels tangible. The artifact has to be physical infrastructure, no digital elements allowed. The political dimensions need to unfold in two specific ways: intentional design favoring one group initially, then an inherent reversal emerging from operational requirements over 20 years. 

  The tricky part is making the reversal endogenous - it must stem purely from the artifact's functional needs (maintenance, resource inputs, access control etc.), not external factors like policy changes or misuse. I'm considering municipal water systems since they have clear technical dependencies. 

  For the intentional politics, imagine a utility installing automated water meters to resolve billing disputes between landlords and tenants. The design explicitly transfers control to landlords initially. But then the inherent politics could emerge from the system's need for skilled maintenance - creating dependency on specialized technicians who gain leverage over time. 

  Key is ensuring the reversal comes from internal requirements: calibration tools only available to unions, proprietary parts creating monopolies etc. Must avoid any narrative shortcuts about "control slipping away" - every shift must trace back to technical necessities. 

  After drafting the scenario, I'll categorize it using Winner's framework: this seems like "requiring" specific social arrangements (technician hierarchy) due to "internal" technical needs. The objector would claim politics resides solely in human decisions, not the meters. But the counter is that the meters' technical specificity necessitates the power shift regardless of intentions. 

  The critical feature is the proprietary calibration interface - remove that and both political effects dissolve. The objector might argue we rigged it by making the interface artificially restrictive, but that's precisely what demonstrates artifact politics: the design choice creates unavoidable dependencies.
answer: |-
  Here's a scenario crafted to your specifications, avoiding digital tech and focusing on endogenous reversal:

  **The Scenario:**
  The City of Millhaven faced chronic disputes over water usage and billing between landlords of its aging, multi-unit apartment buildings and tenants. Landlords accused tenants of wastefulness; tenants suspected landlords of inflating shared bills. To resolve this, the Public Utilities Department (PUD) installed **individual, tamper-proof, high-precision water meters** on every apartment unit within these buildings. Designed explicitly to assign costs directly to tenants, the meters required specialized tools (only issued to PUD crews) for installation, reading (initially manual, later via short-range encrypted radio requiring proximity), and calibration. This design deliberately empowered tenants with precise consumption data, settling the billing dispute in their favor by making them solely responsible for measured usage. However, the meters' extreme precision demanded biannual calibration against a master standard to maintain accuracy within legally mandated tolerances, a complex procedure requiring a controlled environment and proprietary equipment only available at the PUD's central workshop. Furthermore, the radio-read units relied on a unique, low-power frequency requiring close proximity for data collection, making reliable readings in dense buildings dependent on unobstructed access corridors meticulously maintained within the building's plumbing infrastructure. Over twenty years, the sheer volume of meters (thousands installed) and the critical, non-deferrable nature of calibration and access maintenance concentrated immense operational power in the hands of the small, unionized PUD Meter Maintenance Unit (MMU). They alone possessed the certified skills, workshop access, and legal authority to perform calibration (preventing outsourcing). Landlords, now reliant on perfectly functioning meters for accurate tenant billing and legally required to grant unobstructed access to MMU crews on their schedule, found their property management constrained by the MMU's workflow priorities, union-negotiated response times, and interpretations of "unobstructed access." Tenants, meanwhile, faced billing disputes if meters drifted out of tolerance or access issues delayed readings, disputes resolvable only through the MMU's verification process. The artifact designed to empower tenants relative to landlords ended up subordinating *both* groups to the technical and operational imperatives controlled by the MMU.

  **Analysis:**

  1.  **Winner's Categories:**
      *   **Requires specific social arrangements:** The meters *require* a centralized, highly skilled maintenance unit (MMU) with specific workshop facilities, calibrated tools, and legally sanctioned authority due to the precision calibration mandate and proprietary technology. They also *require* building layouts that maintain specific access corridors.
      *   **Internal Conditions:** These requirements stem from the artifact's *internal* technical characteristics: the necessity for high-precision calibration to function accurately as intended, the reliance on a specific low-power radio frequency needing proximity/access, and the use of proprietary tools/seals preventing user maintenance.

  2.  **The Objector's Claim:**
      An objector would insist: "The politics aren't in the meters themselves! The PUD *chose* to centralize calibration. The city *chose* not to train building staff or allow third-party calibration. The union *negotiated* favorable work rules. The MMU *decides* its priorities and access interpretations. The artifact is neutral plumbing; the social arrangements around its *use* create the power dynamics."

  3.  **The Single Feature Doing the Work & Deletion:**
      *   **Feature:** The **legally mandated, high-precision calibration requirement** using **proprietary equipment in a central workshop**.
      *   **Effect of Deletion:**
          *   *Intentional Politics:* If calibration wasn't legally mandated and hyper-precise (e.g., simple, robust meters needing infrequent, field-based checks), the tenant empowerment via direct billing likely remains strong without creating a centralized bottleneck.
          *   *Inherent Politics:* If calibration could be done locally by building staff or multiple vendors using standard tools, the dependency on the MMU dissolves. Landlords could manage it, eliminating the reversal. The reversal *requires* the calibration to be complex, centralized, legally mandated, and proprietary.

  4.  **Addressing the Objector & Why the Case Isn't Rigged:**
      The objector focuses on *choices made in response* to the artifact's demands. However, the key argument is that the artifact's *internal technical requirements* (precision needing complex calibration) *necessitated* specific social arrangements. While humans make choices *within* those constraints, the range of viable choices is severely limited by the artifact:
      *   **Safety/Legal Mandate:** Ignoring calibration leads to inaccurate billing (defeating the artifact's purpose) and potential legal liability for the PUD. *Some* reliable calibration system is non-optional.
      *   **Technical Feasibility:** Achieving the mandated precision *economically* and *reliably* at scale, given the meter design, genuinely requires specialized equipment and controlled conditions, making decentralization or use of generic tools impractical. This isn't an arbitrary choice; it's driven by the physics and engineering of achieving the mandated performance.
      *   **Proprietary Nature:** The tools/seals are proprietary *because* the high-precision design incorporates unique mechanisms to prevent tampering and ensure accuracy – core to its *intended* political function (fair billing). Removing this makes the intentional politics vulnerable.
      **Attack on Rigging:** The objector might argue: "You *stipulated* the precision *must* be so high it requires centralization and proprietary tools. That's rigging the artifact to force the outcome." The response is: The level of precision *is* the key design choice enabling the intentional politics (resolving billing disputes fairly via incontrovertible data). Winner argues such design choices *embed* politics. The inherent politics flow *from the technical consequences* of that very choice (high precision needing complex, centralized maintenance), not from separate social choices. The reversal is endogenous because the operational demands (calibration, access) stem directly from the technical specifications required for the artifact's *primary function*.

  **Flagging Stipulation Temptation:**
  The phrase "*concentrated immense operational power in the hands of... the MMU*" describes the *outcome*. However, the preceding sentences explain *why* this happens based on the artifact's requirements: the "sheer volume," "critical, non-deferrable nature," and the fact they "alone possessed the certified skills, workshop access, and legal authority" are all direct consequences of the calibration requirement and proprietary tools/seals. The power concentration is *generated* by the necessity of performing a complex, mandatory, exclusive function at scale. The temptation is to skip to the outcome; the case tries to show the steps from internal requirement to social structure.
