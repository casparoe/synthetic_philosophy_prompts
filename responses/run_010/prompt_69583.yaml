prompt: |-
  I run a small university digital repository — scanned manuscripts, some born-digital files, a couple of old websites we captured years ago. Several times a week I have to make the same call: after some event (format migration, re-scan at higher resolution, a checksum mismatch, a disk failure where we restore from backup, a donor emailing a corrected file) is what we now hold still the object we accessioned, or a new object that replaced it? Right now it's whoever on shift's gut feel, and it leaks into the records: we have citations that resolve to something other than what a 2004 reader actually saw, and one incident where we told a donor wed lost the original when all we'd done was migrate it.

  I've absorbed more Parfit and four-dimensionalism than is healthy for a person, and this is that debate wearing a lanyard. If the object is wholly present at each moment, then a migration is either the same object with new properties or a replacement, and I need a rule for which. If it's a spacetime worm made of temporal parts, then "the object" is just a bundle I'm choosing, and the real question is what makes a bundle maximal — continuity of bits, of function, of the causal chain from the donor's hands? Annoyingly our identifier layer forces a binary answer even if the metaphysics is graded: one persistent ID per object, and an ID can't point at two things.

  So: write me a procedure my staff can run on an event in about ten minutes. None of them have any philosophy, and any verdict of "new object" comes to me to sign off. It should say which picture we're committing to — or how to hold both without the records contradicting each other — and give a determinate same-object / new-version / new-object answer, mark which distinctions have to survive the simplification and which we can drop, flag the steps that are values calls dressed up as procedure (what is a citation even a promise about?), and say where it'll misfire. Then run it on three cases: (1) we migrated 300 TIFFs to JPEG2000 in 2019 and someone's 2004 paper cites the TIFF; (2) our only copy fails a checksum and we restore from a backup made three years earlier; (3) a donor sends a corrected version of a file we hold and says the one we had was never finished.

  And be honest with me: if the two views make zero difference to what ends up in the database, say so, and tell me where the difference actually shows up, if anywhere.
reasoning: |-
  Okay, let me tackle this digital repository identity problem. The user runs a small university archive dealing with scanned manuscripts, born-digital files, and old website captures. Their core struggle is determining when a modified file remains "the same object" versus becoming a new entity after events like migrations, restorations, or donor updates. 

  First, I need to unpack their philosophical framing. They mention Parfit and four-dimensionalism - that's heavy metaphysics territory. The key tension seems to be between:
  - Endurantism (object persists through changes by maintaining identity)
  - Perdurantism (object is a series of temporal parts/stages)

  But in practice, their staff needs a binary decision for their persistent ID system. The user explicitly wants a 10-minute procedure that non-philosophers can apply, with clear escalation paths. They're also worried about real-world consequences like incorrect citations or donor relations.

  Hmm... the procedure should probably focus on functional requirements rather than metaphysical purity. What matters most for their repository? I'd guess:
  - Scholarly integrity (citations should resolve to substantively same content)
  - Preservation chain of custody
  - Donor relations
  - Administrative sanity

  Looking at their pain points: 
  - That 2004 citation example shows versioning issues
  - The donor incident reveals communication failures
  - Checksum mismatches cause restoration dilemmas

  For the procedure design, I'm considering a decision tree with three outcomes:
  1) Same object (update metadata silently)
  2) New version (create derivative ID)
  3) New object (full accession)

  Critical factors would include:
  - Intent behind the change (accidental vs deliberate)
  - Degree of transformation (bit-for-bit vs format shift)
  - External validation (donor input, scholarly context)

  The user specifically asked to test three cases:
  1) TIFF to JPEG2000 migration
  2) Backup restoration after checksum fail
  3) Donor-supplied "corrected" file

  For case 1, migration with significant format change probably needs versioning. Case 2 seems clearly same object if backup is verified. Case 3 is trickiest - if donor claims it's a correction, we might need both versions with clear relationships.

  Biggest challenge: making metaphysics actionable. The two philosophical views may converge in practice when we focus on what the repository promises users. The difference mainly shows in how we narrate the object's history - whether we emphasize continuity or stages.

  I should flag where values creep in disguised as procedure. For example, deciding what counts as "substantive change" involves judgment about scholarly use cases. The citation promise isn't just about bits - it's about intellectual content.

  Procedure must include:
  - Metadata inheritance rules
  - Versioning implementation
  - Escalation triggers
  - Failure scenarios (like when a "correction" is actually new content)

  And crucially - where to document the rationale so future staff understand why a decision was made. That metadata trail might be more important than the binary same/new determination itself.
answer: |-
  Here's a practical procedure for your staff, designed to cut through the philosophy while respecting archival integrity. It prioritizes *preservation intent*, *user expectations*, and *administrative reality*. The metaphysics informs but doesn't dictate the outcome.

  ---

  ### **Digital Object Identity Decision Procedure** (10-Minute Workflow)
  **Goal:** Determine if an event creates a **Same Object**, **New Version**, or **New Object**.  
  **Tools Needed:** Event details, original accession record, checksum log, preservation policy.  
  **Output:** Action + Metadata Update + Escalation Flag (if "New Object").  

  #### **Steps:**
  1. **DESCRIBE THE EVENT**  
     - What physically changed? (e.g., bits altered, format migrated, file replaced).  
     - Who triggered it? (system, staff, donor, error).  
     - Why was it done? (preservation, correction, repair).  

  2. **ASSESS INTENT**  
     - ✅ **Same Object**: Changes are *preservative* (e.g., format migration, fixity repair) with no intent to alter content/function.  
     - ⚠️ **New Version**: Changes are *corrective/iterative* (e.g., donor "fix," resolution upgrade) but retain core identity.  
     - ❌ **New Object**: Changes *fundamentally alter* content/context (e.g., new scan of a different physical copy, substantive re-editing).  

  3. **CHECK BITSTREAM CONTINUITY**  
     - Do current bits match *any* logged checksum from the object's history?  
       - ✅ **Yes** → **Same Object**.  
       - ❌ **No** → Proceed to Step 4.  

  4. **EVALUATE FUNCTIONAL EQUIVALENCE**  
     - Would a typical user (researcher, donor) perceive the content as identical?  
       - *Examples:*  
         - ✅ TIFF → JPEG2000 migration (same visual content).  
         - ⚠️ Donor’s "corrected" typo in a text file (same document, minor fix).  
         - ❌ Migrating a database to a new schema that breaks queries.  
       - **Same Function** → **New Version**.  
       - **Changed Function** → Escalate to Archivist (**Potential New Object**).  

  5. **DECIDE & DOCUMENT**  
     - **Same Object**: Update technical metadata (e.g., new format, checksum). *No ID change*.  
     - **New Version**: Assign a derivative ID (e.g., `orig-id_v2`), link to original. Preserve prior versions.  
     - **New Object** (Archivist sign-off only): Assign new persistent ID. Cross-link to original if dependent (e.g., "supersedes").  

  #### **Critical Metadata to Preserve (Non-Negotiable):**  
  - **Provenance Chain**: Log all events (who, why, when).  
  - **Fixity History**: Store past checksums.  
  - **Relationship Links**: If a new version/object is created, explicitly state its tie to predecessors.  

  #### **Where Values Masquerade as Procedure:**  
  - **Step 4 (Functional Equivalence)**: "Typical user" is subjective. Your repository’s mission defines this (e.g., a scholarly archive prioritizes intellectual content over pixel-perfect rendering).  
  - **Citation Promises**: A citation resolves to the *intellectual entity*, not the bits. Promise: "This ID persistently returns the authoritative representation of *what was accessioned*." Migrations are within scope; major corrections may require versioning.  

  #### **Where It Might Misfire:**  
  - **Over-Correction**: Donors submitting "fixes" that are actually new works (e.g., revising a poem).  
  - **Obsolescence**: If a format migration loses features (e.g., interactive elements), functional equivalence fails.  
  - **Ambiguous Events**: A restored backup with lost minor updates (treat as **Same Object** but log gaps).  

  ---

  ### **Case Applications**
  #### **Case 1: TIFF → JPEG2000 Migration (2019)**  
  - **Event**: Format migration for preservation. Bits changed; visual output equivalent.  
  - **Intent**: Purely preservative.  
  - **Bitstream**: ❌ No checksum match.  
  - **Function**: ✅ Identical scholarly use (image content unchanged).  
  - **Verdict**: **Same Object** (update format/checksum).  
  - **Citation Handling**: The 2004 citation points to the *intellectual content*. Resolving to the JPEG2000 is valid. Document the migration so scholars can trace versions if needed.  

  #### **Case 2: Restored from 3-Year-Old Backup After Checksum Fail**  
  - **Event**: Restoration due to corruption. Bits reverted to old state.  
  - **Intent**: Repair/preservation.  
  - **Bitstream**: ✅ Matches backup checksum.  
  - **Function**: ✅ Same content (even if outdated).  
  - **Verdict**: **Same Object** (log the restoration event and data loss gap).  
  - **Note**: If interim updates existed, treat as partial loss but *don’t* mint a new object.  

  #### **Case 3: Donor Submits "Corrected" File**  
  - **Event**: Donor replaces original, claiming it was "unfinished."  
  - **Intent**: Correction (external/subjective).  
  - **Bitstream**: ❌ No match.  
  - **Function**: ⚠️ Likely similar, but may have material changes (e.g., typo fixes vs. new content).  
  - **Verdict**: **New Version** (assign `orig-id_v2`, retain original as `orig-id_v1`).  
  - **Why**: The original was accessioned as-is. The "corrected" file is a derivative. Donor intent doesn’t override provenance.  
  - **Escalation**: Flag to archivist to assess significance (e.g., is this a disputed work?).  

  ---

  ### **The Philosophy/Reality Verdict**
  **Do endurantism vs. perdurantism change the database?**  
  - **No.** Both views converge on practical outcomes here.  
  - **Why?** The procedure prioritizes *continuity of reference* (perdurantist "worm") while allowing objects to "endure" minor changes. The binary ID system forces a decision, but **versioning + provenance logging** captures the nuance.  

  **Where the Difference Shows Up:**  
  - **Narrative & Accountability**:  
    - **Endurantism**: Focuses on "the object itself" changing. Staff must justify *why* migration doesn’t break identity (e.g., "essential properties intact").  
    - **Perdurantism**: Focuses on the object’s "stages." Easier to say "this is a new temporal part of the same worm," simplifying versioning.  
  - **Edge Cases**:  
    - A file restored from backup *with lost data* is clearly the same object in perdurantism (a temporal stage exists for it). Endurantism might struggle with "is it still whole?"  
    - **But your procedure resolves this** by logging the gap and prioritizing functional equivalence.  

  **Final Advice**:  
  Your persistent ID points to a *provenance chain*, not a static bitstream. **Same Object** = preservative actions within the chain. **New Version** = user-driven iterations. **New Object** = breaks in context/content. Document relentlessly, and your metaphysics can stay in the seminar room.  

  --- 
  This procedure gives staff clear criteria, minimizes existential crises, and ensures auditable decisions. The archivist (you) handles the gray areas, but 90% of events will resolve at Steps 2–4.
